      *   **Core Argument:** Libet shows brain activity precedes conscious awareness $\rightarrow$ Consciousness is epiphenomenal (retroactive narration) $\rightarrow$ Natural selection wouldn't keep a costly, useless trait $\rightarrow$ Therefore, moral responsibility is an evolutionary fiction.
