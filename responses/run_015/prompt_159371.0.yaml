answer: |-
  To untangle this dispute, we must distinguish three logical structures often conflated in Malthusian debates. First, a **dated prediction** (e.g., 'famine by 1900') is a point estimate in time; if the event occurs later, the prediction is simply false, not 'early'. Second, an **undated tendency** or *ceteris paribus* claim (e.g., 'population pressure *tends* to depress wages') is a structural relation; it cannot be early or late, only applicable or masked by intervening variables. Third, a claim about an **attractor or equilibrium** (e.g., 'the system converges to subsistence level *S*') specifies a state space and a dynamic; it is falsified if the system settles at a different attractor without a change in the specified variables.

  Applying this map to the fossil-fuel defence: the 'right but early' camp treats Malthus's claim as an undated tendency (ii) that is merely masked, while their critics treat it as a dated prediction (i) that has failed. However, the fossil-fuel argument actually relies on shifting the attractor's variables (iii). Malthus specified land as the binding constraint; the modern defence substitutes energy or ecological throughput. This is not a delay of the original mechanism but a redefinition of the system's state space.

  Regarding your specification condition: I pick the horn that **successful science routinely violates our own methodological standards**. History shows that core theories (Newtonianism, Darwinism) are rarely abandoned when auxiliaries fail; they are protected by post-hoc adjustments (e.g., positing Neptune to save Newton's orbits). Your condition is normatively sound for distinguishing progressive from degenerating research programmes, but descriptively false for how science actually survives anomalies. The Malthusians are not methodologically unique in adding auxiliaries; they are suspect only because their programme has failed to generate novel facts subsequently, unlike the Newtonian example.

  On the first complication, the pre-1800 Malthusian trap offers accommodation, not prediction. That the mechanism operated historically validates the *phenomenon*, but a theory's credibility rests on predicting *deviations* from the past, not merely projecting the past forward. That the theory faltered exactly when data became rigorous suggests the 'trap' was a historical contingency, not a universal law.

  On the second complication, shifting from land to energy is a theory replacement, not an auxiliary rescue. The ontology has changed. To say 'Malthus was right' when the binding constraint is no longer land is equivocation; it preserves the formalism (growth vs. constraint) while abandoning the causal mechanism. This renders the 'right but early' claim verbal rather than substantive.

  I maintain that the modern Malthusian claim is a degenerating programme relying on equivocation. The one fact that would most change my mind is a demonstrated global subsistence crisis driven solely by arable land limits.

  \answer{Not the same theory any more}
