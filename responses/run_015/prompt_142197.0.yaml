prompt: |-
  I'm on the programme committee of a small academic society — one conference a year plus the proceedings. No written policy, no staff, seven of us, and we argue things out over email. There's a case in front of us now and I keep going in circles, so: what should we do if we want to be consistent with ourselves, and what rule have we actually been running this whole time without noticing?

  Our track record, as near as I can reconstruct it:

  - Two years ago we pulled a keynote about a month before the conference, after people found blog posts he'd written arguing that some ethnic groups are just less intelligent. Nothing to do with his talk, which was on memory consolidation. We told him he was off the program. We never published anything, never gave a reason in writing, never said for how long.
  - Same year we kept a paper on the program that a lot of members said was dangerous — it argued for a partly genetic explanation of a group difference in school outcomes. We added a respondent and ran a critical commentary beside it in the proceedings. Our line was that it was an argument made with data, inside the normal norms, and that it isn't our job to police which conclusions people argue for.
  - Last year we withdrew a paper and barred the author from submitting for three years after we found he'd fabricated data. That one we did call a sanction, we did put a term on it, and we did put a note in the proceedings saying what happened.
  - We suspended a member for a year over a long run of humiliating emails to a junior member. Completely outside conference business, from her personal account, about a personal dispute. We said it didn't matter that it was off-platform.
  - We did nothing when someone complained about a member who'd done prison time for fraud about twelve years ago and whose talk was on something unrelated. We said he'd answered for it already and it had nothing to do with his role with us.
  - We did nothing about a member who publicly called one of our own decisions cowardly and named the people who'd complained. We said public criticism of the committee is protected even when it's rude.
  - We did nothing about a member who was filmed at a protest chanting something fairly violent, unconnected to our field. We said it was outside our remit — which, as one of our members pointed out at the time, sits oddly with the first and fourth items.

  Now: the psychologist from the first item has submitted a paper for this year's proceedings. It's a straight memory paper, co-authored with his PhD student who did the work and needs the publication. Reviewers say it's fine. Separately, his department has put him forward for our service award, which is mostly honorific but comes with a named lecture. He's fairly senior and well known.

  And we've since worked out that after we dropped him, at least two other societies quietly stopped inviting him and a job talk was withdrawn. As far as we can tell nobody in any of those places looked into anything — they just saw he wasn't on our program and drew their own conclusions. He doesn't know we know.

  So: do we take the paper, and do we give him the award? Which of our own decisions is the closest match, and what are we committing ourselves to either way? Because it feels like whatever we decide, we're also deciding something about what we did two years ago, which at the time felt like us just choosing who's on the program and now looks, to everyone outside, like a verdict. Does the fact that other people copied us change anything we owe him, or is that just other people's business? And is there some decision we could take now that would force us to stop dodging this next time?

  I care less about which way we go than about which rule we'd be running and what else it commits us to. Please don't just tell me to write a policy or take legal advice — we know, and we have to answer by Friday.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Member of a 7-person programme committee for a small academic society.
      *   **Context:** One annual conference + proceedings. No written policy, no staff. Decisions made via email argument.
      *   **Problem:** A specific case is causing circular debate. They need a decision by Friday.
      *   **Goal:** The user wants to know what rule they have *actually* been following (implicit policy) based on past precedents, and what committing to a specific decision now implies for future consistency. They want to avoid hypocrisy and establish a coherent principle, rather than just getting a "yes/no" answer.
      *   **Constraint:** Do not just say "write a policy" or "get legal advice." They know that, but need to act now.

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Case 1 (Keynote - Ethnic Intelligence Blog):* Removed from program. Reason: Off-topic speech (blog posts) unrelated to talk content. No written reason, no term, no publication. *Implicit Rule:* Reputation/Off-field conduct can disqualify participation, even if research is sound. High discretion, low transparency.
      *   *Case 2 (Paper - Genetic Group Difference):* Kept on program. Reason: Data-driven, within norms. Added commentary. *Implicit Rule:* Content of research is protected if methodologically sound, even if controversial/socially sensitive.
      *   *Case 3 (Paper - Data Fabrication):* Withdrawn + 3-year ban + Public note. *Implicit Rule:* Scientific misconduct is punished severely and transparently.
      *   *Case 4 (Member - Humiliating Emails):* 1-year suspension. Reason: Harassment/bullying, even off-platform/personal. *Implicit Rule:* Interpersonal conduct towards members matters, regardless of venue.
      *   *Case 5 (Member - Past Prison Fraud):* No action. Reason: Past debt paid, unrelated to role. *Implicit Rule:* Ancient, unrelated legal history doesn't count.
      *   *Case 6 (Member - Public Criticism of Committee):* No action. Reason: Free speech/protection of criticism. *Implicit Rule:* Criticism of the society is allowed, even if rude.
      *   *Case 7 (Member - Violent Protest Chant):* No action. Reason: Outside remit/unconnected to field. *Implicit Rule:* General political activism (even violent rhetoric) is ignored *unless* it targets protected groups? (Contradicts Case 1 & 4).

  3.  **Analyze the Current Case:**
      *   **Subject:** The Psychologist from Case 1 (Ethnic Intelligence Blog).
      *   **Action 1:** Submitted a paper (straight memory research, co-authored with student). Reviews say it's fine.
      *   **Action 2:** Nominated for Service Award (honorific + named lecture).
      *   **Complication:** Other societies quietly blacklisted him based on Case 1's action. He doesn't know the committee knows this.
      *   **Core Tension:** Case 1 removed him from the *program* (presentation) but didn't explicitly ban him from *membership* or *awards*. However, the collateral damage (other societies blacklisting him) suggests Case 1 was interpreted as a broader moral sanction.

  4.  **Identify the Implicit Rule (The "Real" Policy):**
      *   Looking at Cases 1, 3, 4 vs. 2, 5, 6, 7.
      *   *Pattern:* The committee intervenes when conduct threatens the **safety/reputation of the community** or **scientific integrity**. They do *not* intervene on **research conclusions** (Case 2) or **ancient history** (Case 5) or **criticism of the committee** (Case 6).
      *   *The Contradiction:* Case 1 (Blog posts) vs. Case 7 (Protest chant). Why was the blog post disqualifying but the protest chant wasn't?
          *   *Hypothesis:* The blog posts were about *academic subjects* (ethnic intelligence) using *academic authority*, whereas the protest was general politics. The blog posts undermine the *scientific standing* of the field regarding race, whereas the protest was outside the field.
          *   *Refined Hypothesis:* The rule is "Conduct that weaponizes academic standing to harm marginalized groups or undermines the field's integrity is sanctionable. General political conduct or controversial data-driven conclusions are not."
      *   *The "Shadow" Ban:* Case 1 was handled opaquely. This created a "stigma" without a "sentence." This is the source of the current mess.

  5.  **Evaluate the Options against Precedents:**

      *   **Option A: Accept Paper, Give Award.**
          *   *Consistency:* Aligns with Case 2 (research is research) and Case 5 (past sins don't define forever).
          *   *Conflict:* Directly undermines Case 1. If he's good enough for the Service Award, why was he kicked off the keynote list? It admits Case 1 was a mistake or excessive.
          *   *Commitment:* Establishes that "bad opinions" (blog) don't carry long-term professional penalties within the society. Restores him fully.
          *   *Risk:* Angers members who felt Case 1 was a moral stand. Ignores the collateral damage caused by Case 1.

      *   **Option B: Accept Paper, Deny Award.**
          *   *Consistency:* Aligns with Case 1 (he's tainted) but respects Case 2 (science is separate). Distinguishes between *participation* (allowed) and *honor* (reserved for those in good standing).
          *   *Conflict:* Still feels like a half-measure. Why is he safe for the proceedings but not the award?
          *   *Commitment:* Establishes a tiered system: You can work here, but you can't be a face of the society.
          *   *Risk:* Keeps the ambiguity alive.

      *   **Option C: Reject Paper, Deny Award.**
          *   *Consistency:* Aligns with Case 1 (he is persona non grata).
          *   *Conflict:* Contradicts Case 2 (research content shouldn't be policed). The paper itself is fine. This punishes the student (co-author).
          *   *Commitment:* Establishes that Case 1 was a permanent ban, not just a keynote cancellation. Formalizes the "Shadow Ban."
          *   *Risk:* Unfair to the student. Looks like censorship of valid science (Case 2 contradiction).

      *   **Option D: Accept Paper, Deny Award, + Clarify Case 1.**
          *   *Consistency:* Best fit. Acknowledges the science is valid (Case 2) but the *honor* requires community standing (Case 4/1).
          *   *Crucial Step:* Must address the opacity of Case 1.

  6.  **Synthesize the "Real Rule":**
      *   The committee has been running a **"Community Harm vs. Academic Freedom"** distinction.
      *   *Academic Freedom:* Protects controversial data (Case 2), past crimes (Case 5), criticism of committee (Case 6).
      *   *Community Harm:* Punishes fabrication (Case 3), harassment (Case 4), and *weaponized academic rhetoric* (Case 1).
      *   *The Glitch:* Case 1 was treated as Community Harm but processed like a scheduling conflict (no reason, no term). This created the "Shadow Ban."

  7.  **Address the Specific Questions:**
      *   *What rule have we been running?* "We sanction conduct that harms the community or scientific integrity, but we protect controversial conclusions and private history. However, we apply this opaquely."
      *   *Do we take the paper?* Yes. (Precedent: Case 2. The work is sound. Punishing the student is unfair. Case 1 was about the *keynote platform*, not the *journal*.)
      *   *Do we give the award?* No. (Precedent: Case 1 + Case 4. Awards imply endorsement of the person as a community leader. He is currently in a 'probationary' state due to Case 1, even if undefined.)
      *   *Does the collateral damage (other societies) matter?* Yes. It proves Case 1 had wider repercussions than intended. Ignoring it makes the committee look naive or cruel.
      *   *How to stop dodging next time?* You must convert the implicit sanction of Case 1 into an explicit status *now*.

  8.  **Drafting the Advice:**
      *   *Tone:* Direct, analytical, empathetic to the difficulty, focused on institutional logic.
      *   *Structure:*
          1.  Identify the Implicit Rule (The "Community Stewardship" Standard).
          2.  Analyze the Current Case against that Rule.
          3.  The Recommendation (Split Decision).
          4.  The "Cleanup" (Addressing Case 1's opacity).
          5.  The Commitment (What this locks in for the future).

  9.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, is accepting the paper fair to the student?* Yes, rejecting it punishes the student for the supervisor's blog. Case 2 says we don't police conclusions/data if valid.
      *   *Is denying the award fair to him?* He was removed from the keynote without a term. Denying the award acknowledges that removal wasn't just a "scheduling" issue. It validates the severity of Case 1 without needing to reopen the investigation.
      *   *The "Shadow Ban" issue:* This is the most critical ethical point. The committee accidentally blacklisted him elsewhere. They owe him clarity. If they accept the paper but deny the award, they are effectively saying "You are reinstated as a researcher, but not as a leader." This resolves the ambiguity.
      *   *The "Rule":* It's not just "harm." It's "Endorsement vs. Participation." We allow participation (papers) unless science is fake (Case 3). We restrict Endorsement (Keynotes, Awards) if conduct harms community trust (Case 1, 4).
      *   *Correction on Case 7:* The protest chant was ignored. Why? Probably because it wasn't *academic* weaponization. The blog posts were. This distinction is key.

  10. **Final Polish:** Ensure the distinction between *proceedings* (science record) and *award/keynote* (community endorsement) is clear. This is the lever that solves the consistency problem.

  **(Self-Correction Note):** I need to make sure I don't just give a verdict but explain the *principle* so they can argue it out in their email thread. The user asked "what rule have we actually been running." I need to articulate that clearly.

  *Implicit Rule:* **"Scientific validity guarantees participation; Community trust guarantees endorsement."**
  *   *Participation (Papers):* Protected unless fraudulent (Case 2 vs Case 3).
  *   *Endorsement (Keynotes, Awards):* Discretionary based on conduct/reputation (Case 1, Case 4).
  *   *The Problem:* Case 1 blurred these by removing a Keynote (Endorsement) without explaining it, making it look like a Participation ban.

  *Recommendation:* Clarify the distinction. Accept paper (Participation). Deny Award (Endorsement). Communicate the distinction to him to end the "Shadow Ban."

  11. **Final Review against constraints:** No "write a policy" lecture. Focus on Friday's deadline. Focus on consistency.

