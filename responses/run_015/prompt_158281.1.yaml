prompt: |-
  I've come round to the idea that heritability is basically a local snapshot — it partions varience for one population in one specific enviroment, and trying to compare coefficients across countries or generations is conceptually muddled. What would actually count against this strict localist view? I'm not after generic 'genes matter' pushback, but concrete defeaters: if indirect genetic effects (say, parents' genotypes shaping the home environment) turn out to dominate direct ones, does that break localism or just complicate the accounting? What about reaction norms that stay flat across wildly different ecologies — does that let heritability travel in a meaningful way? And if polygenic scores predict outcomes about as well in very different social contexts, is that fatal or just noise? Please rank these kinds of challenges from fatal to merely awkward, say which ones a committed localist would themselves concede, and be honest about whether the view has been qualified into unfalsifiability. Answer in British English, please — and don't mind the typo or two in my framing, that's just me being sloppy.
