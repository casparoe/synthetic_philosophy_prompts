      *   This view aligns closely with the standard quantitative genetics definition ($h^2 = V_G / V_P$). Since $V_P$ depends on $V_E$ (environmental variance), changing the environment changes the denominator, and potentially the numerator (via GxE interactions).
      *   *Strength:* It's technically correct according to classical definitions.
