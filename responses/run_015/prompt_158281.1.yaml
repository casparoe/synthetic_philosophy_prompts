answer: |-
  You are quite right to start from the position that heritability ($h^2$) is, strictly speaking, a descriptive statistic of a specific population at a specific time. It is a ratio of variances ($V_G / V_P$), and since environmental variance ($V_E$) fluctuates wildly between, say, 1950s Britain and 2020s Japan, the denominator shifts. Furthermore, if gene-by-environment interactions (GxE) exist, the numerator shifts too.

  However, a view that is technically correct can still be scientifically sterile if it prevents us from seeing stable underlying structures. To test your "strict localist" view, we need to see if there are empirical findings that suggest genetic influence is more robust than a mere snapshot.

  Here is an assessment of the challenges you raised, ranked from merely awkward to potentially fatal for strict localism, along with an honest appraisal of the unfalsifiability risk.

  ### 1. Indirect Genetic Effects (IGEs) / Genetic Nurture
  **Verdict: Merely Awkward (actually bolsters localism)**

  You asked if IGEs breaking down the barrier between "direct" genetic effects and environmental shaping defeats localism. Paradoxically, the rise of IGEs (where parental genotypes shape the rearing environment) tends to reinforce the localist caution rather than undermine it.

  IGEs are profoundly context-dependent. The way a parent's genotype regarding "educational attainment" manifests in the home depends entirely on the social structure. In a society with free university education, a parent's genetic propensity for learning might create a book-rich home. In a society where child labour is the economic norm, that same parental genotype might manifest differently or be suppressed entirely.

  **The Localist Concession:** A committed localist would happily concede that IGEs complicate the accounting. They would argue this makes heritability estimates *even less* portable across generations, because the "environment" being genetically shaped is itself historically contingent. This is not a defeater; it is ammunition for the localist.

  ### 2. Flat Reaction Norms Across Ecologies
  **Verdict: Significant Challenge (but not fatal to the statistic)**

  A reaction norm describes how a specific genotype's phenotype changes across an environmental gradient. If we observe flat reaction norms for a trait (e.g., eye colour, or perhaps certain cognitive baselines) across wildly different ecologies, it implies that the genetic *effect* is stable, even if the *variance* changes.

  This challenges the spirit of localism, if not the letter. If the biological mechanism is invariant, then the "snapshot" is capturing a stable causal engine, merely viewed through different lenses of environmental noise. If the rank ordering of individuals remains constant despite environmental shifts (no GxE), it suggests that $V_G$ is not being modulated by $V_E$.

  **The Localist Concession:** Here, the localist must concede ground. They would have to admit that while the *heritability coefficient* might still change (because $V_E$ changes), the underlying *genetic architecture* is portable. They would retreat from saying "genes only matter here" to "genes matter everywhere, but their statistical weight varies." This qualifies the view but doesn't destroy it.

  ### 3. Polygenic Score (PGS) Portability Across Social Contexts
  **Verdict: Potentially Fatal**

  This is the strongest empirical threat to strict localism. Currently, PGS portability is poor across ancestries (due to linkage disequilibrium differences), but let us look at your specific point: different *social contexts* within similar ancestry.

  If a PGS derived from a UK Biobank sample predicts educational attainment or height equally well in a high-inequality context and a low-inequality context (or across different decades), it suggests that the additive genetic variance is remarkably stable. It implies that the "local" environment is not interacting with the specific SNPs in a way that alters their predictive validity.

  If prediction holds constant while the environment changes, the heritability coefficient's fluctuation becomes a statistical artefact rather than a reflection of biological reality. It suggests the "signal" is universal, even if the "noise" ($V_E$) varies. If a localist looks at robust cross-context prediction and still insists the effect is purely local, they are no longer doing science; they are engaging in semantics.

  **The Localist Concession:** A honest localist must concede that if PGS portability is robust, the "snapshot" is actually a "video." They would have to accept that for some traits, genetic influence is sufficiently canalised that it transcends specific environmental variances.

  ### Ranking the Challenges

  1.  **PGS Portability (Fatal):** Demonstrates stable causal prediction across contexts.
  2.  **Flat Reaction Norms (Serious):** Demonstrates stable biological mechanisms, even if variance ratios shift.
  3.  **Indirect Genetic Effects (Awkward):** Mostly complicates the model without proving cross-context stability.

  ### On Unfalsifiability

  You asked whether this view has been qualified into unfalsifiability. There is a genuine risk here, often termed the "hereditarian's escape hatch" in reverse.

  If a localist argues that $h^2$ is local, and then finds a trait where $h^2$ is stable across contexts, they might dismiss it as a "coincidence of compensating variances." If they find a trait where it varies, they claim vindication. If every outcome is consistent with the theory, the theory is empty.

  For the strict localist view to remain scientific, it must specify **what would count as universality**. They need to state: *"If polygenic scores predict outcome X with correlation $R$ in Environment A and Environment B, I will accept that genetic influence is not merely local."*

  Without that pre-commitment, the localist view risks becoming a tautology: "Heritability is local because if it weren't, it wouldn't be local."

  ### Summary

  Your intuition is technically sound: $h^2$ is a population statistic, not a biological constant. However, biology often produces constants that *look* like statistics.

  *   **IGEs** do not break your view; they deepen the complexity of the "environment" part of your snapshot.
  *   **Reaction Norms** suggest the snapshot might be capturing a stable object, not just a fleeting shadow.
  *   **PGS Portability** is the only thing that could truly sink the ship. If prediction travels, the "local" constraint is effectively broken.

  A committed localist should concede that while the *coefficient* is local, the *causal capacity* of the genome may not be. If they refuse to distinguish between the statistical ratio and the biological reality it attempts to measure, then yes, they have insulated themselves against being wrong, but at the cost of saying nothing useful.
