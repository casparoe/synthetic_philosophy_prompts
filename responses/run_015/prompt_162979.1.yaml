  ### Part 6: The Pledge Case

  **Scenario:** Parents circulating a pledge not to hire tutors before Year 10. You suspect 1/3 will cheat.
  **Application of Principle:**
  1.  **Diagnosis:** This is an attempt to convert a **Prisoner's Dilemma** (Trap) into a **Coordination Game**. The pledge acts as a Schelling Point.
  2.  **Blame/Agency:** You are in the "Defensive Necessity" zone (Case 5). You are not a Fiduciary of the system, but you are a participant.
  3.  **Strategic Reality:** If 1/3 cheat, the pledge fails to solve the Lock-In (Clause 1.2). If you sign and others cheat, you suffer the "sucker's payoff" (your child loses relative standing).
  4.  **Moral Reality:** Signing signals a commitment to the Common Good (childhood well-being/fairness), even if it fails strategically.

  **What you should do on Monday:**
  **Sign the pledge, but do not rely on it.**
  Signing is the only move that attempts to break the Lock-In. If everyone reasons "I won't sign because others might cheat," the Trap is guaranteed. By signing, you lower the threshold for the coordination equilibrium to tip. However, because you anticipate defection (30%), you must privately prepare to escalate (hire a tutor) if you observe the coordination failing close to the exam date.
  *Philosophical Justification:* You are fulfilling a **secondary fiduciary duty**. Your primary duty is to your child (Defensive Necessity). Your secondary duty is to the community of parents (Common Stock of norms). Signing honors the secondary duty without immediately violating the primary one. You reserve the right to defect *only if* the coordination visibly collapses. This makes you a "conditional cooperator," which is the stable strategy in evolutionary game theory for dissolving traps.

