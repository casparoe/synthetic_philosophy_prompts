prompt: |-
  My study partner has these takes on formal-system puzzles and I can't figure out her actual rule. One: in the MIU system there's definitely no derivation of MU from the four rules, and she gets that by stepping outside and seeing every valid string has an even number of U's — she calls it JOOTSing and says it's totally legit, not like breaking the rules. Two: she describes Gödel's first theorem as basically the same move, build a sentence inside arithmetic about its own unprovability then step outside and see it's true but unprovable. Three: she insists no computer can ever genuinely JOOTS, even if you hard-code it with meta-rules about its own code, because it's still just running inside a bigger formal box — any "outside" is just more inside from a wider view. Four: if you translate MIU into different symbols and notice the rules map one-to-one, recognizing that isomorphism is also a valid JOOTS.

  Now here's a case she's never adressed. There's a system I'm calling NU with symbol-manipulation rules that have a hidden pair-invariant, which makes one particular target string unreachable, but there's no sentence inside NU that can even talk about symbol pairs — so no Gödel-style self-reference is possible inside it. A human can spot the invariant from outside and declare the target outta reach. Meanwhile there's a program hard-coded with the invariant as an explicit meta-axiom, and another program that learns to predict failure from training data but can't actually represent why.

  What'd she say about all three? Is the human recognition still JOOTSing even with zero self-reference inside NU? Would the hard-coded program count as having done it? And where does the learning program fall — closer to JOOTS or closer to just pattern-matching? I'm less interested in the answers than in which principle she's running: is it about consciousness vs mechanism, about explicit meta-representation being required, about self-reference being essential, or about structural transparency? Which of her four earlier verdicts is the weird outlier that doesn't fit? And what's the one further case — maybe involving a child or an animal recognizing a pattern — that'd actually split these rules apart?
