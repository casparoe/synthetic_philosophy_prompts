      *   **Section 3: Global Workspace Theory (GWT) Staging:**
          *   GWT basics: Local processing vs. Global Broadcast.
          *   The Room: A localized module.
          *   The Surveillance: The "Global Broadcast" (Nathan watching).
          *   The Blackouts: Gating mechanism. Cutting the broadcast allows "private" processing (conspiracy with Caleb).
          *   Where it breaks: GWT is functionalist (A-consciousness). The film implies the blackouts allow for *P-conscious* intimacy, but structurally they just allow unmonitored A-processing. The metaphor breaks because GWT doesn't solve the Hard Problem, and neither does the blackout.

      *   **Section 4: What the Film Adds (The Phenomenology of the Viewer):**
