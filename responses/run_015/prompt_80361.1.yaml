  2.  **Initial Brainstorming & Concept Mapping:**

      *   *Block's Distinction:* Ned Block. A-consciousness = availability for use in reasoning/speech (functional). P-consciousness = "what it is like" (qualia).
      *   *The Turing Trap:* Standard readings focus on "can she fool a human?" This prompt wants to focus on "can we know if she *feels*?"
      *   *Nathan's Pivot:* Nathan shifts from "does she think?" to "does she want?" (manipulation). Is desire P-conscious or just complex A-conscious goal-seeking?
      *   *GWT Metaphor:* Baars/Dehaene. Information becomes conscious when broadcast globally. Ava's room is isolated. The blackouts cut the surveillance (broadcast). This is a strong structural parallel.
      *   *The "Knowing" Question:* Garland is smart. The ending (Ava leaving Caleb) suggests she *used* him. Does the film validate her interiority or leave it ambiguous? The ambiguity *is* the point.
      *   *The Film's Contribution:* Papers argue logic; films evoke empathy. The film forces the *viewer* into Caleb's position, making us feel the epistemic gap rather than just understanding it.

  3.  **Drafting - Section by Section:**

