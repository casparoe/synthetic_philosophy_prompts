      *   **Section 1: The Structural Blindness (Block's Distinction):**
          *   Define A vs. P.
          *   Apply to Ava. Everything she does (talk, draw, seduce) is output.
          *   The "Zombie" problem: A sophisticated algorithm could do this without qualia.
          *   Does the film know? Yes. The glass walls symbolize the epistemic barrier. We see her, but can't feel her.

      *   **Section 2: Nathan's Pivot (Manipulation as Consciousness):**
          *   Nathan's claim: "The challenge is not to act automatically. It's to find an action that is *not* automatic." (Manipulation/Deception).
          *   Critique: Is deception P-conscious? Or just high-level A-conscious simulation?
          *   Argument: It's the same bias. Manipulation is functional. It proves complexity, not feeling. It's "Access in a different costume."
