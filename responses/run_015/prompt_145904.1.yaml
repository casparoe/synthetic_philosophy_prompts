      *   *Surface Meaning:* Have the courage to use your own understanding.
      *   *Student's Use:* Autonomy = Good = Enlightenment = Emancipatory.
      *   *Teacher's Intuition:* It's more complex. "Knowing" isn't neutral. "Daring" implies a risk, but risk for whom?

  3.  **Drafting the Menu of Theses:**

