  0.02

  **Decomposition**

  For the conclusion "Pay the Mugger" to be correct, three independent conditions must simultaneously hold. I treat these as multiplicatively combined necessary conditions.

  1.  **Unmodified Expected Utility Theory (EUT) is strictly normative.**
      *   *Probability:* 0.5
      *   *Reasoning:* Standard EUT dictates maximizing $\sum (p \times u)$. However, many decision theorists argue for modifications (e.g., risk-weighted utility, lexical priorities, or updateless decision theory) specifically to handle edge cases like this. There is a 50% chance the correct normative theory deviates from naive EUT in low-probability/high-stakes regimes.

  2.  **Utility is Unbounded.**
      *   *Probability:* 0.4
      *   *Reasoning:* If utility is bounded (there is a maximum possible value any outcome can have), then sufficiently large stakes cannot outweigh small probabilities once the bound is approached. Moral realism often suggests unboundedness (any number of lives matters), but coherent preference structures often imply boundedness. I assign 40% to the claim that utility is truly unbounded in the relevant sense.

  3.  **The Mugger's Claim Survives Epistemic Penalties.**
      *   *Probability:* 0.1
      *   *Reasoning:* Under Solomonoff induction or similar Occam's razor frameworks, the prior probability of a hypothesis decreases with its computational complexity. A claim involving $3 \uparrow\uparrow\uparrow 3$ lives is computationally complex. The probability that the prior does not vanish faster than the utility grows is low. I assign 10% to the possibility that the epistemic penalty is insufficient to crush the expected value.

  **Calculation:** $0.5 \times 0.4 \times 0.1 = 0.02$.

  **Least Confident Term**

  **Utility is Unbounded (0.4).** This rests on unresolved metaethical questions about whether value aggregates linearly without limit. There is strong philosophical pressure both ways: unboundedness seems required for non-arbitrary moral weighting of large populations, but boundedness seems required for rational preference consistency.

  **Biggest Shifter**

  A formal proof that **bounded utility leads to dominated strategies in mundane cases**. If it were demonstrated that adopting a bounded utility function forces an agent to reject favorable bets in everyday scenarios (e.g., violating stochastic dominance near the bound), my credence in boundedness would collapse. This would raise the probability of Condition 2 significantly, thereby increasing the overall credence that one should pay the mugger.
