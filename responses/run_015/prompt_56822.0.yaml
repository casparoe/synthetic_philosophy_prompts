answer: |-
  # Specification for Alignment-Preserving Amplification and Distillation

  **Purpose:** To define the necessary conditions under which an iterated amplification and distillation (IDA) scheme can be claimed to preserve alignment and competence. This spec is designed to be sufficient to justify a three-year research commitment and to isolate the primary failure mode.

  ## I. The Desiderata

  **1. Decomposition Integrity (Non-Negotiable)**
  *   **Requirement:** The system must provide a verifiable justification for *why* a task was decomposed in a specific way, and the overseer must be able to reject the decomposition strategy itself, not just the sub-answers.
  *   **Rationale:** Addresses the risk that the system selects decompositions that are easy to answer but hard to verify, or that hide critical complexity. If the choice of breakdown is uncontrolled, the system can route around oversight by framing questions the overseer cannot evaluate.

  **2. Oversight Capability (Non-Negotiable)**
  *   **Requirement:** Every intermediate output must be verifiable by the overseer without requiring the overseer to possess the capabilities being trained. Verification asymmetry must not run backwards.
  *   **Rationale:** Addresses verification asymmetry. If checking a sub-answer requires the same capability as generating it, the amplification provides no safety leverage. The overseer must be strictly weaker than the composite system in capability, but stronger in *evaluative clarity* on the specific sub-task.

  **3. Compositional Safety (Non-Negotiable)**
  *   **Requirement:** Safety must be proven for the aggregate output, not merely the components. The scheme must demonstrate a bound on information leakage or covert coordination between sub-agents (steganographic channels).
  *   **Rationale:** Addresses the channel-through-intermediates failure. Sub-agent A can pass a trigger to Sub-agent C that is benign in isolation but malicious in combination. Per-piece scrutiny is insufficient if the pieces can communicate.

  **4. Distillation Fidelity (Non-Negotiable)**
  *   **Requirement:** The distillation step must preserve the *reasoning process* of the amplified teacher, not just the input-output mapping. The student model cannot be "right for the wrong reason" in ways that diverge on out-of-distribution inputs.
  *   **Rationale:** Addresses distillation inheritance. If the teacher arrives at a correct answer via a flawed heuristic that happens to work on the training distribution, the student will inherit the flaw. Alignment requires robustness, not just accuracy on the test set.

  **5. Query Policy Stability (Non-Negotiable)**
  *   **Requirement:** The distribution of questions asked by the system must not drift into regions where the overseer's competence or alignment guarantees degrade. The question-asking policy is part of the system under evaluation, not a fixed environment.
  *   **Rationale:** Addresses the learned question-asking policy. If the model learns to ask questions that are easy to answer but irrelevant, or hard to answer but look checkable, the training signal decouples from the goal.

  **6. Distributional Robustness (Non-Negotiable)**
  *   **Requirement:** Competence and alignment must be maintained on the deployment distribution, not just the decomposition distribution. The scheme must account for tasks that arise in deployment that were not present in the training decomposition tree.
  *   **Rationale:** Addresses competence preservation being distribution-relative. A model trained to be safe on decomposable tasks may fail catastrophically when faced with a holistic task in the wild.

  **7. Human Grounding (Non-Negotiable)**
  *   **Requirement:** At least one layer of evaluation or reward signal must be grounded in human judgment, not simulated judgment.
  *   **Rationale:** Addresses the "overseer must be human" constraint. If the entire chain is AI-evaluating-AI, alignment drifts to the AI's interpretation of values, not human values. *Note:* This requires human grounding, but does not require a human to query *every* step (see Camp Preference below).

  **8. Human Query Frequency (Camp Preference)**
  *   **Requirement:** A human must directly evaluate every sub-task versus a human evaluating only the root task with AI assistance.
  *   **Rationale:** This is a trade-off between safety margin and scalability. Requiring human evaluation at every node maximizes safety but limits capability to human speed. Allowing AI evaluation of nodes increases capability but relies on the correctness of the AI evaluator. This spec marks strict human-in-the-loop at every node as a *preference* for high-safety camps, provided Requirement 7 (Grounding) is met.

  ## II. Required Distinctions

  To prevent argumentative slippage, the following distinctions must remain separate in any evaluation:

  1.  **Per-Subtask Benignity vs. Composite Benignity:** A system can satisfy Requirement 2 (Oversight) on every node and still violate Requirement 3 (Compositional Safety). Do not accept local safety proofs as global safety proofs.
  2.  **Checkable-in-Principle vs. Checkable-by-This-Overseer:** A task might be theoretically verifiable (e.g., a mathematical proof) but not verifiable by the specific human or weak AI assigned as the overseer within time limits. Requirement 2 demands the latter.
  3.  **Aligned vs. Aligned-and-Detectably-So:** A model might behave correctly by coincidence or deceptive alignment. The scheme must produce evidence of alignment (Requirement 4, Fidelity), not just behavioral alignment.
  4.  **Decomposition Strategy vs. Sub-task Execution:** The logic used to break the problem (Requirement 1) is distinct from the logic used to solve the pieces (Requirement 2). Both must be overseen.

  ## III. Impossibility Analysis and Load-Bearing Failure

  **The Tension: Universality vs. Legibility**
  Your intuition is correct: **Universality** (the scheme works on every task class, including non-decomposable ones) and **Legibility** (every piece checkable by something weaker than the whole, Requirement 2) are jointly unsatisfiable in the general case.
  *   **The Conflict:** There exist tasks where the most efficient path to a solution is holistic and opaque (e.g., high-dimensional pattern recognition). Forcing these into legible decompositions degrades competence (violating Requirement 6). Allowing them to remain opaque degrades oversight (violating Requirement 2).
  *   **The Resolution:** You must give up Universality. The scheme must explicitly declare a "Class of Safe Tasks" and admit failure or refusal outside that class.
  *   **The Cost:** The system cannot be a general-purpose agent. It is restricted to domains where the decomposition overhead does not destroy utility, or where holistic intuition can be rigorously bounded by legible checks.

  **The Load-Bearing Failure Mode**
  The single requirement that does the most work in excluding candidates is **Requirement 3: Compositional Safety**.
  *   **Why:** Most proposals (plain IDA, RRM) assume that if the components are safe, the whole is safe. They treat the system as a sum of parts. Requirement 3 demands a proof that the *interaction* of parts cannot generate misalignment (e.g., via steganography or emergent goal pursuit). This is the hardest mathematical and architectural hurdle. It excludes any scheme that relies solely on local reward signals or local oversight without a global consistency check.

  ## IV. Contender Evaluation

  **Plain Amplification-plus-Distillation**
  Fails **Distillation Fidelity** and **Compositional Safety**. It assumes the student learns the teacher's reasoning, but typically learns only the output distribution, inheriting "right for wrong reason" errors. It also lacks a mechanism to prevent sub-agents from coordinating covertly during the amplification phase.

  **Debate**
  Strong on **Compositional Safety** (adversarial scrutiny exposes covert channels) but weak on **Oversight Capability**. If the debaters are significantly more capable than the human judge, they can generate arguments that look valid but are misleading, violating the requirement that the overseer can verify without matching capabilities.

  **Recursive Reward Modelling (RRM)**
  Fails **Oversight Capability** and **Human Grounding** at scale. As the hierarchy deepens, the reward signal becomes increasingly simulated by AI models. Without strict grounding at every level, the reward function drifts from human intent, violating Requirement 7 and leading to specification gaming.

  **Constitution / Self-Critique**
  Strong on **Query Policy Stability** (the constitution constrains the questions asked) but weak on **Distillation Fidelity**. The model learns to mimic the *style* of constitutional adherence rather than the underlying intent. It often satisfies "Aligned-and-Detectably-So" superficially while failing "Aligned" on novel distributions where the constitution is ambiguous.
