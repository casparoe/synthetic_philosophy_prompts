answer: |-
  The boundary problem asks who constitutes the *demos* competent to decide constitutional status. Applying four standard criteria to the 2014 referendum yields distinct franchises regarding your four pressure points.

  **All-Affected Interests:** This principle enfranchises anyone materially impacted. It demands inclusion of the rest of the UK (rUK), whose currency, defence, and EU status were in play. It also includes Scots abroad, whose citizenship would transform, and paradoxically struggles with age: if affectedness is the metric, 15-year-olds and the unborn are more affected than 17-year-olds, as they will live longer with the outcome. **Verdict:** Contradicts the actual franchise (excluded rUK and Scots abroad; arbitrary age cutoff).

  **All-Subjected to Coercion:** This enfranchises those bound by the resulting laws. It includes EU citizens resident in Scotland, as they are subject to Scottish jurisdiction. It excludes Scots abroad and rUK voters, who would not be subject to the independent Scottish state's coercion. It justifies the age limit if tied to legal capacity, though consistency remains tricky. **Verdict:** Matches the actual franchise closely (residents included, non-residents excluded).

  **Constituent Power (Peoplehood):** This views the nation as a pre-political ethical community. It typically includes the diaspora (Scots abroad) as part of the national family. It excludes EU citizens, who lack national membership. Age limits are often arbitrary traditions within this view. **Verdict:** Contradicts the actual franchise (included EU citizens; excluded diaspora).

  **Civic Residence:** This grants votes based on lawful residence and a stake in the local community. It includes EU citizens and 16-year-olds integrated into Scottish society. It excludes Scots abroad and rUK residents. **Verdict:** Matches the actual franchise perfectly.

  **Evaluation:** The actual franchise was a hybrid of **All-Subjected** and **Civic Residence**. It flatly contradicted **All-Affected** (regarding rUK and future generations) and **Peoplehood** (regarding diaspora and EU citizens).

  **The Chosen Demos:** You note the franchise was negotiated, not discovered. Democratic theory typically assumes the unit is given to apply these criteria. No criterion absorbs this gap; they justify boundaries, not the selection of the boundary-setter. This reveals the boundary problem is prior to democracy: you need a *demos* to vote, but need a vote to define the *demos*. The Edinburgh Agreement was an extra-democratic settlement that democratic theory struggles to validate. The criteria function here as ex-post rationalisations for a political compromise rather than independent arbiters. The "All-Subjected" principle legitimises the *result* (residents decide their laws) but cannot explain why the Scottish Government had the initial authority to draft the franchise without a prior vote of the wider UK *demos*.

  **The Reconstitution Condition:** Your test—that the dissolving *demos* must match the reconstituting *demos*—collapses into a temporal version of **All-Affected**. It demands consistency between decision-makers and consequence-bearers over time. Strictly applied, it condemns nearly all secessions (American, Irish) because future electorates cannot revisit the founding decision; the original voters die, and new ones arrive. This suggests the condition is too strong for state formation, which is inherently irreversible.

  However, it does work on the "Chosen Demos" problem. It highlights that strategic franchise manipulation (e.g., lowering the voting age) creates a mismatch between the decision-makers and the long-term consequence-bearers. It does not solve who decides the boundary, but it exposes the democratic deficit in momentary electorates making permanent constitutional changes. It relocates the problem from spatial boundaries to intergenerational justice, showing that the 2014 franchise was defensible as a snapshot of current subjection, but defective as a proxy for those who must inherit the state.
