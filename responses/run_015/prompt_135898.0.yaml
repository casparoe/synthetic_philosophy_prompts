answer: |-
  ### Mapping the Decision Space: 8–10 Thermidor Year II

  To understand the fall of the Incorruptibles, one must first discard the image of a monolithic "Revolution" and instead view the National Convention as a fractured sovereign body operating under specific institutional pressures.

  **The Actors:**
  1.  **The Incorruptibles:** Robespierre, Saint-Just, and Couthon. They held moral authority but lacked a reliable voting bloc within the Convention.
  2.  **The Committee of Public Safety (CPS):** Fractured. Collot d'Herbois and Billaud-Varenne felt threatened by Robespierre's moralizing and saw their executive power waning.
  3.  **The Committee of General Security (CGS):** The police arm of the Revolution. They resented the CPS's encroachment on their authority via the Law of 22 Prairial.
  4.  **The "Thermidorian" Conspirators:** Deputies like Tallien, Fouché, and Barras. These were former terrorists who knew they were on Robespierre's purge lists and fought for physical survival.
  5.  **The Plain (The Marais):** The silent majority of the Convention. Exhausted by the Terror, fearful of Robespierre, but traditionally reluctant to act without a clear pretext.
  6.  **The Paris Commune/Sections:** Potentially Robespierre's muscle, but leaderless and hesitant to insurrect against the Convention without a clear decree.

  **Institutional Constraints:**
  *   **Convention Sovereignty:** Despite the centralization of power in the CPS under the Decree of 14 Frimaire, the National Convention remained the ultimate sovereign. It could recall or arrest Committee members at will.
  *   **The Law of 22 Prairial:** By streamlining the Revolutionary Tribunal and removing the right to defense, this law made every deputy vulnerable to accusation. It created a "prisoner's dilemma" where deputies realized that if they did not strike Robespierre, he might legally sanction them next.
  *   **Merged Executive-Legislative Structure:** Because the Committee members were also deputies, the struggle was not between branches of government but within a single chamber. This allowed for a parliamentary coup rather than requiring a civil war.

  **The Options:**
  *   **Robespierre (8 Thermidor):** He could have named his enemies (Collot, Billaud, Tallien), forcing the Convention to choose sides immediately. Instead, he spoke vaguely of "traitors" without listing names, allowing his enemies to claim *they* were the targets.
  *   **The Conspirators:** They could wait and risk arrest under Prairial, or they could preemptively frame Robespierre as a tyrant/dictator to galvanize the Plain. They chose the latter.
  *   **The Plain:** They could support the CPS (status quo), support the Commune (insurrection), or support the Convention's prerogative against "tyranny." Fear of the guillotine pushed them toward the conspirators once Robespierre was successfully framed as an outlaw.
  *   **The Commune:** They could have closed the barriers and rung the tocsin (alarm bell) immediately on the 9th. They hesitated, waiting for a formal decree from the Convention that never came.

  ### Applying the Theory: Ideological Destiny vs. Contingent Coup

  The aphorism that "revolutions devour their own children" suggests a metaphysical inevitability: that the radical logic of 1789 contained a seed of self-destruction that *required* the elimination of its most zealous architects. Through the lens of **ideological commitment**, Robespierre's fall appears as the culmination of the "Republic of Virtue." By defining opposition as corruption and corruption as capital treason, the Incorruptibles narrowed the political sphere until only they remained. The Law of 22 Prairial was the mechanism of this consumption, accelerating the Terror until it threatened the very deputies who instituted it. In this view, Robespierre was eaten because his ideology made compromise impossible; the Revolution could not stabilize while he sought to purify it indefinitely.

  However, when viewed through **contingency and institutional design**, the event resembles less a sacrificial ritual and more an ordinary parliamentary coup enabled by specific errors.
  1.  **Contingency of Fleurus:** The French victory at Fleurus (26 June) occurred just before Thermidor. This external contingency reduced the perceived necessity of emergency measures. The "Revolution in danger" narrative, which justified the CPS's power, lost potency, making the Terror seem gratuitous rather than essential.
  2.  **Robespierre's Tactical Blunder:** On 8 Thermidor, Robespierre refused to name names. This was not an ideological necessity but a tactical choice. Had he denounced Tallien and Fouché specifically, the Plain might have sacrificed them to save the Committee. His silence united disparate enemies (CGS, rival CPS members, threatened deputies) into a single coalition of survival.
  3.  **Institutional Vulnerability:** The "devouring" was made possible because the Convention retained the procedural power to arrest its own leaders. The coup succeeded not because the Revolution demanded blood, but because the conspirators successfully manipulated the rules of order to declare Robespierre an "outlaw," bypassing the normal right to speak.

  Therefore, the fall looks less like a revolution consuming its architects due to abstract "virtue" and more like a coalition of threatened politicians utilizing the sovereign power of the legislature to purge the executive. The "devouring" was a political survival strategy, not a historical destiny.

  ### Turning the Episode Back on the Theory

  The Thermidorian Reaction reveals significant limits in structural interpretations of 1789–94.
  *   **Class-Struggle Limits:** A Marxist reading might view Thermidor as the bourgeoisie reining in the sans-culottes. However, the key actors were not class representatives but committee members protecting their own skins. The split was not between classes but within the Jacobin elite itself.
  *   **Institutional Determinism:** While institutions mattered, they did not dictate the outcome. The same Convention that voted for the Terror voted against Robespierre. The institution was a vessel; the content depended on the coalition of the moment.
  *   **Silence of the "Devouring" Narrative:** The metaphor implies a closed loop where the Revolution ends or negates itself. In reality, Thermidor was a *pivot*, not an end. The Thermidorians kept the Republic, the war effort, and the seizure of church lands. They did not "eat" the Revolution; they ate the *Terror* to save the regime. The narrative is silent on the fact that the "children" who did the eating (Tallien, Barras) were themselves revolutionaries who continued the war and consolidated revolutionary gains. It masks the agency of actors who sought to *preserve* the Revolution by killing its most visible symbol.

  Furthermore, the "devouring" narrative obscures the role of **exhaustion**. It was not just that the Revolution killed its leaders, but that the political class and the public were fatigued by the instability. The "eating" was a demand for normalcy, not just a purge. By framing it as inevitable cannibalism, we miss the deliberate construction of a new stability that retained revolutionary sovereignty while discarding revolutionary morality.

  ### Summary

  The Thermidorian Reaction complicates the claim that revolutions necessarily eat their children by demonstrating that Robespierre's fall was not an inevitable metaphysical sacrifice, but a contingent parliamentary coup driven by institutional vulnerabilities, tactical errors, and a coalition of survival that sought to preserve the Revolution by terminating the Terror.
