          *   *Defender Response:* Rationality is distinct from epistemic utility. It's about "responding correctly to reasons," not maximizing truth. (Kiesewetter).
          *   *Ranking:* Awkward but perhaps survivable if one accepts a non-consequentialist meta-normativity.

      *   **4. Exploitability (Manipulation):**
