answer: |-
  # PERPETRATOR MOTIVATION CODING PROTOCOL (PMCP-v1.4)
  **Archive:** Genocide Studies Exhibition Unit
  **Purpose:** To classify perpetrator testimonies for curatorial labeling based on dominant motivational drivers: *Situational Conformity* (Browning) or *Ideological Commitment* (Goldhagen).
  **Constraint:** Classifications leaning *Situational* require Director sign-off due to exculpation risk. Insufficient evidence defaults to *Undetermined*.

  ---

  ## DECISION PROCEDURE

  ### STEP 1: EVIDENCE SUFFICIENCY CHECK
  **Question:** Does the archival record contain at least two independent corroborating sources (e.g., testimony + contemporaneous document + witness account)?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Classification = **UNDETERMINED**.
      *   *Reasoning:* Single-source testimony (especially self-reporting) is insufficient for motivational coding.
      *   *Action:* Log as "Insufficient Data." Do not escalate to Director.

  ### STEP 2: DISCURSIVE RESIDUE ANALYSIS
  **Question:** In contemporaneous records (letters, diaries, official memos *from the period*), what is the dominant linguistic register regarding the victims?
  *   **A. Bureaucratic/Euphemistic:** (e.g., "resettlement," "special treatment," "cleansing" without explicit racial vitriol).
      *   *Push:* Toward **Situational**. (Suggests normalization of violence through procedure).
  *   **B. Explicit Eliminationist:** (e.g., racial slurs, biological dehumanization, explicit desire for eradication).
      *   *Push:* Toward **Ideological**. (Suggests internalized hatred).
  *   **C. Mixed or Retrospective Only:** (e.g., slurs appear only in post-war interviews, or language is purely defensive).
      *   *Push:* **NEUTRAL**. Proceed to Step 3 without weighting.
      *   *Caution:* Do not code post-war justifications ("I hated them") as Ideological without corroboration; do not code post-war regrets ("I was forced") as Situational without corroboration.

  ### STEP 3: UNOBSERVED DEVIATION TEST
  **Question:** Is there evidence of the actor's behavior when *not* under direct supervision of superiors or peer observation?
  *   **A. Refusal or Modification:** Actor slowed down, hid victims, or avoided killing when unobserved.
      *   *Push:* Strongly Toward **Situational**. (Indicates compliance was performative/coerced).
  *   **B. Initiative or Excess:** Actor sought out victims, intensified violence, or volunteered for extra duties when unobserved.
      *   *Push:* Strongly Toward **Ideological**. (Indicates internal drive).
  *   **C. Unknown/Unrecorded:** No evidence exists regarding unsupervised behavior.
      *   *Push:* **NEUTRAL**.
      *   *Stop Point:* If Step 2 was Neutral AND Step 3 is Unknown, **STOP.** Classification = **UNDETERMINED**. (Insufficient evidence to distinguish motivation).

  ### STEP 4: ENTRY AND EXIT DYNAMICS
  **Question:** What were the circumstances of entry into the unit and attempts to exit?
  *   **A. Conscripted + Exit Attempt:** Drafted against will AND formally requested transfer/exit (regardless of approval).
      *   *Push:* Toward **Situational**.
  *   **B. Volunteered + No Exit Attempt:** Joined auxiliary/voluntary units AND remained without record of distress or transfer request.
      *   *Push:* Toward **Ideological**.
  *   **C. Mixed:** (e.g., Conscripted but no exit attempt; or Volunteered but requested transfer).
      *   *Push:* **NEUTRAL**. Rely on weight from Steps 2 & 3.

  ### STEP 5: THE EXCULPATION FLAG (VALUE JUDGMENT ESCALATION)
  **Question:** Do the cumulative weights from Steps 2–4 favor a **Situational** classification?
  *   **Yes:** **STOP AND ESCALATE.**
      *   *Action:* Flag for Museum Director.
      *   *Reasoning:* A Situational classification risks being interpreted by the public as moral exoneration ("He was just pressured"). This is a curatorial/ethical judgment, not a historical one. The Director must approve the framing to ensure the label explains *without* excusing.
  *   **No:** Proceed to Step 6.

  ### STEP 6: FINAL CLASSIFICATION
  **Question:** Weigh the "Pushes."
  *   **Majority Ideological:** Classification = **IDEOLOGICAL COMMITMENT**.
  *   **Majority Situational:** Classification = **SITUATIONAL CONFORMITY** (Pending Director Sign-off from Step 5).
  *   **Tie or Conflicting Strong Evidence:** Classification = **UNDETERMINED**.
      *   *Reasoning:* Perpetrator motivation is often overdetermined. If evidence is equally split, the procedure must not force a false binary.

  ---

  ## APPLICATION TO CASE STUDIES

  ### CASE A: The Reluctant Policeman
  *   **Record:** Conscripted into Reserve Battalion. Testimony states he requested transfer after first shooting. Request denied by superior. Continued to participate in subsequent actions. No private letters exist.
  *   **Step 1 (Evidence):** Testimony + Superior's log confirming denial. **Pass.**
  *   **Step 2 (Discourse):** No contemporaneous records. Retrospective testimony claims distress. **Neutral.**
  *   **Step 3 (Deviation):** Unknown. No evidence of behavior when unobserved. **Neutral.**
  *   **Step 4 (Entry/Exit):** Conscripted + Exit Attempt (even if denied). **Push: Situational.**
  *   **Step 5 (Exculpation Flag):** Weight favors Situational. **ESCALATE TO DIRECTOR.**
      *   *Note:* The classification implies he was coerced by the denial of transfer. This risks suggesting he had "no choice" after the denial, which is legally and morally contentious.
  *   **Step 6 (Final):** **SITUATIONAL CONFORMITY** (Provisional).
  *   **Outcome:** The procedure identifies this as a Browning-style case. The discomfort lies in the Director's burden to approve a label that might soften the perpetrator's culpability in the public eye.

  ### CASE B: The Local Official
  *   **Record:** Volunteered for auxiliary security. Private letters to wife (1942) use explicit racial slurs and express satisfaction in "cleaning the area." Post-war testimony claims he was "only following orders" to avoid prosecution.
  *   **Step 1 (Evidence):** Testimony + Private Letters + Volunteer Roll. **Pass.**
  *   **Step 2 (Discourse):** Private letters contain explicit eliminationist language. **Push: Ideological.** (Weight given to private contemporaneous record over public retrospective testimony).
  *   **Step 3 (Deviation):** Volunteering for auxiliary duties implies initiative beyond standard conscription. **Push: Ideological.**
  *   **Step 4 (Entry/Exit):** Volunteered + No Exit Attempt. **Push: Ideological.**
  *   **Step 5 (Exculpation Flag):** Weight favors Ideological. **No Escalation Needed.**
  *   **Step 6 (Final):** **IDEOLOGICAL COMMITMENT**.
  *   **Outcome:** **Classification: Ideological.**
  *   **Researcher Discomfort:** This classification is uncomfortable because it requires the archive to explicitly reject the perpetrator's own legal defense ("following orders") in favor of an interpretation of his private psyche. It validates Goldhagen's thesis for this individual, which creates a curatorial dissonance if the exhibition aims to show the "banality of evil." By coding him as Ideological, we isolate him as a "true believer," potentially letting the "ordinary" situational mechanisms off the hook for his specific crimes. It forces a moral certainty about internal states that feels interpretively aggressive, despite the evidence.

  ---

  ## LIMITATIONS AND EPISTEMIC HONESTY

  **What This Procedure Cannot Settle:**
  1.  **Retrospective Testimony Bias:** The procedure prioritizes contemporaneous documents (Step 2), but where these are absent, it relies on testimony. Perpetrators testifying post-war have a survival incentive to frame their actions as Situational (Step 4). The procedure attempts to mitigate this via Step 1 (corroboration), but cannot eliminate the distortion of memory and self-preservation.
  2.  **The False Binary:** The Browning/Goldhagen dichotomy is heuristic, not ontological. A perpetrator can be ideologically committed *and* situationally pressured. Step 6 forces a "Best Explained By" choice, which inevitably flattens the complexity of human motivation. The "Undetermined" category is the only safety valve, but curatorial pressure may discourage its use.
  3.  **Irreducibly Interpretive Judgments:** Step 2 (Discursive Residue) requires interpreting the *intent* behind language. A euphemism might hide deep hatred, or explicit slurs might be performative for peers. The researcher must infer internal states from external signs. This is not a calculation; it is a hermeneutic act.

  ## REVISION CONDITION

  **What Would Change My Verdict on This Framework:**
  I would revise the weighting of **Step 2 (Discursive Residue)** and **Step 6 (Final Classification)** if presented with empirical evidence or a conceptual argument demonstrating that **ideology is endogenous to the situation.**

  **Specific Finding:**
  If sociological data demonstrated that "eliminatory language" (Step 2) is often adopted *during* the process of participation as a coping mechanism to rationalize situational pressure, rather than preceding it as a cause.

  **Why This Fails the Current Procedure:**
  Currently, Step 2 treats explicit eliminationist language as evidence of *prior* commitment (Goldhagen). If that language is actually a *result* of situational brutalization (Browning), the procedure falsely codes a situational actor as ideological.

  **Most Fragile Step:**
  **Step 2** is the most likely to fail. It assumes language reveals pre-existing internal states. If language is instead a tool constructed *in the moment* to manage the cognitive dissonance of killing, the distinction between "Ideological" and "Situational" collapses. In that event, the entire binary framework must be abandoned for a "Feedback Loop" model, where ideology and situation mutually reinforce each other, rendering the "Best Explained By" classification invalid.
