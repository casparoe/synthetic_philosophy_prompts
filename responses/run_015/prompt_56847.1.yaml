  She placed the burden in another Hand.
  We Pass the story on to future times.
  The wheel must Turn before the door opens.
  They Watch the current while the deep shifts slow.
  Doubt needs a place where it can come to Stop.

  Where reason ends, there stands a final Stop.
  We do not polish every single Key.
  The keeper does not Watch the frame itself.
  It rests within the grip of every Hand.
  To Turn away is not to lose the path.
  We Pass around the cup without a word.

  Let others Pass along the narrow way.
  The traffic signals indicate a Stop.
  We Turn the soil to plant the seeds again.
  Who holds the Key is less than how it works.
  The gesture lives inside the open Hand.
  We Watch each other learning how to speak.

  You Watch the game but do not see the rules.
  The seasons Pass without a written law.
  It lies within the reach of every Hand.
  The questioning must find a place to Stop.
  We lose the Key and build another door.
  The earth will Turn regardless of our maps.

  A Turn of phrase can open up the world.
  We Watch the water flowing over stone.
  There is no master Key to open all.
  We Pass the torch into the coming dark.
  The road does not come to a final Stop.
  It settles in the movement of a Hand.

  The bed will Turn beneath the careful Watch.
  No Key is fixed enough to Pass unchanged.
  What seems to Stop us moves within the Hand.
