answer: |-
  1. The book incorrectly frames Mises's argument as a computational limitation, whereas he contended that without private ownership of capital goods, no genuine prices can exist to guide calculation.
  2. Hayek expanded this by arguing the problem is not solving equations but utilizing dispersed tacit knowledge that only market competition can discover and communicate.
  3. Lange would accept the description of his trial-and-error model, but Austrians reject it for assuming managers can mimic entrepreneurs without bearing actual financial risk.
  4. Consequently, modern computing power does not invalidate the Austrian critique because the issue is the absence of market-generated signals, not the processing speed of existing data.
  5. The giant firm analogy ultimately collapses because internal planning within a corporation depends on external market prices for capital and labor that a whole socialist economy would lack.
