answer: |-
  ### Part 1: The "Take a Breath" Brainstorm

  Right, put the marker down for a second. Here is where this seminar usually dies, and it's not because the students aren't smart. It's because the structure of the debate invites them to take the easy exits.

  First, the **Econ students**. You're right to be worried. If you open with "Friedman says your assumptions are lies," they will interpret that as "Economics is fake." They will retreat into a defensive instrumentalism ("Who cares if it's true, it works!") before you've even explained *why* the truth of assumptions might matter. You need to validate the *necessity* of abstraction before you critique the *type* of abstraction. If you don't, you lose them at minute 10, and they become a noisy bloc of skeptics.

  Second, the **Phil students**. They love to colonize. They will try to turn this into a generic Van Fraassen vs. Realism debate they had in year two. They'll say, "Oh, this is just constructive empiricism." It isn't. Friedman isn't saying we *can't* know the unobservables; he's saying the assumptions *aren't even intended* to be descriptively accurate. That's a stronger, weirder claim. If you let them reduce this to standard realism/instrumentalism, you lose the specific methodological bite of the F-twist.

  Third, the **Trap of "Approximation"**. This is the big one. Students think "unrealistic" means "simplified." They think you can always add the friction back in later to get closer to the truth (the "convergence" fallacy). The hard part of this seminar is showing them that sometimes, adding the "realistic" detail doesn't refine the prediction—it destroys the mechanism that generated the prediction. You need an example where the lie *does the work*.

  Finally, the **Whiteboard**. No slides means you own the visual space. If you write the Friedman quote up at minute 1, it becomes a slogan. If you write it at minute 70, it's a footnote. It needs to be the *problem* they are solving, not the answer key.

  ***

  ### Part 2: The Seminar Plan

  #### 1. Order of Operations: The F-Twist Before the Taxonomy
  **Verdict:** Put the **F-Twist (and the Quote) first**, Taxonomy second.

  **Why:** If you teach the taxonomy of idealization (Galilean, Minimalist, Hegelian, etc.) first, the students will treat Friedman as a sorting exercise. They'll say, "Ah, Friedman prefers Galilean idealization," and feel they've understood the philosophy without grappling with the *shock* of the claim.
  You need them to feel the tension first. The F-Twist is counter-intuitive. It violates their basic scientific intuition (true premises → true conclusion). By presenting the Twist *before* giving them the vocabulary to sanitize it, you force them to sit with the discomfort. The taxonomy then becomes the *tool* they need to resolve that discomfort, not a pre-emptive categorization.

  **Board Layout:**
  *   **Left Column:** "The F-Twist" (Leave space for the quote).
  *   **Center:** "The Example" (Diagram heavy).
  *   **Right Column:** "The Verdict" (Taxonomy & Criteria).

  #### 2. The One Example: Walrasian Tatonnement (The Auctioneer)
  **Do not use the Billiard Player.**
  **Why not:** It's too easy to dismiss as a metaphor for cognition. Students say, "Obviously people don't calculate vectors," and move on. It isolates the problem to *psychology*, whereas we want the problem to be *structural*.

  **The Carrier:** **The Walrasian Auctioneer (General Equilibrium).**
  *   **The Assumption:** There is a fictional "auctioneer" who calls out prices, no trade occurs until equilibrium is found, and everyone has perfect information about these prices.
  *   **The Falsehood:** Everyone knows this is ontologically false. There is no auctioneer. Trade happens *at* disequilibrium prices constantly (stocks, housing, groceries).
  *   **The Prediction:** Markets tend toward a unique clearing price where Supply = Demand.
  *   **The Kicker (Crucial):** If you make the assumption *more realistic* (allow trade at false prices/disequilibrium), the model often loses its ability to predict a *unique* equilibrium. You get path dependence (hysteresis). The final price depends on the history of trades, not just initial endowments.
  *   **Why this works:** It shows that the "lie" (no trade out of equilibrium) is what guarantees the clean prediction. Removing the lie doesn't refine the prediction; it dissolves the determinacy. This blocks the "it's just an approximation" retreat.

  #### 3. The Misconception Map (Defusion Points)

  *   **(e) Econ Defensiveness ("You're attacking science"):**
      *   **Defuse:** Minute 5 (Framing).
      *   **Move:** Explicitly state: "Abstraction is not a sin. All models lie. The question is whether the lie is *productive*." Validate the Econ students' practice before critiquing the justification.
  *   **(d) Realism vs. Instrumentalism ("It's just Van Fraassen"):**
      *   **Defuse:** Minute 15 (Introducing the Quote).
      *   **Move:** Draw a line on the board: "Anti-Realism about Entities" (Philosophy standard) vs. "Anti-Realism about Assumptions" (Friedman). Clarify that Friedman allows the *theory* to be real, just not the *premises*.
  *   **(a) "Assumptions don't matter / Anything goes":**
      *   **Defuse:** Minute 30 (During Example Analysis).
      *   **Move:** When discussing the Auctioneer, ask: "Could we assume the Auctioneer is a Martian?" If they say yes, press: "Does the Martian assumption *do the same work*?" Distinguish between *negligible* assumptions (friction) and *constitutive* assumptions (the mechanism).
  *   **(c) "Good Prediction = True Assumptions":**
      *   **Defuse:** Minute 40 (The "As If" turn).
      *   **Move:** Use the example to show the market acts *as if* there is an auctioneer, but proving there *is* one is category error. Break the link between predictive success and descriptive truth.
  *   **(b) "De-idealizing Converges on Truth":**
      *   **Defuse:** Minute 50 (The "More Realistic" Test).
      *   **Move:** This is where you hit them with the path-dependence point. Show that adding realism (trade at false prices) breaks the unique solution. Convergence is not guaranteed; sometimes it's a cliff.
  *   **(New) "The Map is the Territory":**
      *   **Defuse:** Minute 60.
      *   **Move:** Students often think the model *describes* the market. Force the distinction: The model is an *engine* for generating expectations, not a *picture* of the market.

  #### 4. Your Two Ideas: Slotting & Traps

  **Idea 1: Looping Assumptions (Performativity)**
  *   **Slot:** Minute 55 (After the "De-idealizing" critique, before the conclusion).
  *   **Verdict:** **Helpful, but dangerous.**
  *   **Why:** It shows a case where Friedman is *right* (the assumption becomes true), which prevents the seminar from becoming a pure Friedman-bash. It adds nuance.
  *   **The Trap:** If you present this as "See, assumptions can become true," students might think *all* successful models work this way.
  *   **Fix:** Frame it as a **Limit Case**. "In rare cases (like option pricing), the model changes the world to fit the assumption. In most cases (like the Auctioneer), it does not. Friedman treats the exception as the rule."

  **Idea 2: Relativized Twist (Target & Question)**
  *   **Slot:** Minute 65 (The Synthesis).
  *   **Verdict:** **Essential Conclusion.**
  *   **Why:** This solves the "Is Friedman right or wrong?" binary.
  *   **The Trap:** "Anything goes" relativism.
  *   **Fix:** Tie it to **Intervention**. "An assumption is unrealistic *relative to a question*." If the question is 'What is the price?', the Auctioneer works. If the question is 'How do we get there?', the Auctioneer fails. This gives them a criterion for "Good vs. Bad" idealization that isn't just "prediction."

  #### 5. How You'll Know It Landed (Assessment)

  **The Final Question (Minute 70):**
  > "Imagine two models of the housing market. Model A predicts prices perfectly but assumes buyers are psychic. Model B predicts prices poorly but assumes buyers look at Zillow. The government wants to **stop** a housing bubble. Which model do they use?"

  **The Wrong-But-Plausible Answer:**
  > "Model A, because prediction is the goal of science."
  > **Diagnosis:** They failed the "Intervention vs. Forecast" distinction (Minute 65). They think science is only about *knowing* the future, not *changing* it. They missed the point that false assumptions prevent effective policy even if they predict well.

  **The Right Answer:**
  > "Model B. To stop a bubble, you need to know the *mechanism* (Zillow/herding), not just the outcome. Model A's 'psychic' assumption gives you no lever to pull."

  #### 6. Scope Boundaries (What to Refuse)

  You need a principled line, not just "no time."

  **Refuse 1: "Models as Mediators" / "Credible Worlds" (Morgan, Morrison, Sugden).**
  *   **The Line:** "That literature asks what a model *is* ontologically. Today we are asking how a model *justifies* its assumptions methodologically. Different question."
  *   **Why:** It drags you into metaphysics when you need to stay in methodology.

  **Refuse 2: Econometrics, Identification, and External Validity.**
  *   **The Line:** "Identification is about *testing* whether a model fits data. We are discussing *construction*—why we build the model this way before we ever see the data."
  *   **Why:** The Econ students will try to pivot here because it's their comfort zone. It bypasses the philosophical problem of the assumption's truth.

  **Refuse 3: The "Truth" of Mathematics.**
  *   **The Line:** "We are not debating if math is real. We are debating if the *mapping* from math to world requires true premises."

  ***

  ### Minute-by-Minute Flow (75 Mins)

  *   **00-05:** **Framing.** Validate modeling. "All models lie. The question is which lies are licit." (Defuses Econ defensiveness).
  *   **05-15:** **The Setup.** Realism vs. Instrumentalism refresher (keep it brief). Introduce Friedman's context (post-war, wanting to make Econ "hard science").
  *   **15-20:** **The Provocation.** Write the Quote on the board. "The more significant the theory, the more unrealistic the assumptions." Let them sit with it.
  *   **20-35:** **The Example (Walrasian Auctioneer).** Draw the Supply/Demand cross. Introduce the Auctioneer. Ask: "Is this true?" (No). "Does it work?" (Yes, for price). "What if we remove him?" (Path dependence/Chaos).
  *   **35-45:** **The F-Twist Analysis.** Why does Friedman think the falsehood is a *virtue*? (It isolates the force). Distinguish *negligibility* from *heuristic*. (Defuses "Anything goes").
  *   **45-55:** **The Convergence Trap.** Challenge the idea that adding realism fixes it. Use the "Trade at false prices" point. (Defuses "Approximation").
  *   **55-60:** **The Looping Exception.** Briefly mention Option Pricing/Performativity. "Sometimes the model makes itself true." (Nuance).
  *   **60-70:** **Relativization & Criteria.** "Unrealistic relative to what?" Introduce the Intervention vs. Forecast distinction. (Defuses Relativism trap).
  *   **70-75:** **Assessment.** The Housing Bubble Question. Debrief.

  **Final Advice:** Watch the Econ students' body language at minute 20. If they cross their arms when you call the Auctioneer a "lie," pause and rephrase: "It is a *structural fiction* that enables calculation." Give them the dignity of the fiction without conceding the truth.
