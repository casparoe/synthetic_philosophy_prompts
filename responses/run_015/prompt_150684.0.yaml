prompt: |-
  Next tuesday I'm presenting to the research committee at a big global-health funder: mostly health economists who do everything in DALYs with a positive discount rate, the director who is a treasury-style skeptic about anything he can't put a number on, and one sympathetic philosopher who will not actually defend me. My thesis is that human extinction is bad in a way that isn't just the deaths and isn't just the discounted future QALYs either — that a real chunk of what makes anything we're doing now worth doing is hosted by people who will come after us, so extinction also retroactively shrinks the point of everything happening before it. I'm leaning on Scheffler's afterlife conjecture but trying to push it toward something a funding committee could act on.

  I'm opening with two cases and I want the Q&A built around them. Case one, the "one-day world": nobody dies early, nobody suffers, but some neurological change means no one can form or care about any project reaching more than about a day ahead. Case two, the archive world: humans die out, but a complete record of everything we made and cared about survives and is genuinely studied and valued by non-human successors for millennia. My line is that case one is nearly as bad as extinction and case two is much less bad than it — which I read as showing that what matters is continued forward-looking valuing, not the species as such and not welfare.

  Can you write me the prep sheet? The eight or so objections I'll actually get from this audience rather than from philosophers, ordered by how much damage they'd do, phrased the way a health economist or a treasury skeptic would put them — discounting, double counting with future lives, the Parfit-style point about people who'd never otherwise exist, "if nobody knows it's coming then nothing is lost", "unmeasurable so ignore it" — each with a two-minute reply and a note on where the reply is softest. And include the question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the Request:**
      *   **Audience:** Research committee at a global-health funder.
          *   Composition: Health economists (DALYs, positive discount rates), Treasury-style skeptic director (needs numbers, skeptical of intangibles), One sympathetic philosopher (won't defend).
          *   Context: High stakes, funding decision.
      *   **Thesis:** Human extinction is bad not just due to lost welfare (QALYs/DALYs) but because it retroactively shrinks the meaning/value of current projects (Scheffler's Afterlife Conjecture). Value depends on *continued forward-looking valuing* by successors.
      *   **Opening Cases:**
          1.  "One-Day World": No death/suffering, but no long-term projects (horizon < 1 day). Claim: Nearly as bad as extinction.
          2.  "Archive World": Humans die out, but records survive & are valued by non-humans. Claim: Much less bad than extinction.
      *   **Deliverable:** A prep sheet.
      *   **Requirements:**
          *   ~8 Objections (ordered by damage potential).
          *   Phrased in the audience's voice (economist/skeptic, not philosopher).
          *   Specific topics mentioned: Discounting, double counting, Parfit/non-identity, "if nobody knows," "unmeasurable."
          *   Format: Objection, 2-minute reply, note on where reply is softest.
          *   Include: The "Question I'm hoping nobody asks."

  2.  **Deconstruct the Audience & Thesis Tension:**
      *   *Economists:* Care about measurable welfare, discount rates, opportunity cost. They will hate "meaning" or "retroactive value" because it's not a utility flow.
      *   *Treasury Skeptic:* Wants ROI, metrics, actionable KPIs. "Meaning" is unbudgetable.
      *   *Philosopher:* Understands the argument but won't fight the room.
      *   *The Thesis:* It challenges the standard utilitarian/consequentialist framework used in global health (sum of welfare over time). It introduces a *structural* condition for value (successors) rather than a *content* condition (happiness).
      *   *The Risk:* Sounding like you're saying "Save the species for art's sake" while people are dying of malaria *now*.

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1: The Discount Rate/Opportunity Cost.* (Highest Damage). Economists live by discount rates. If you value the far future too much, you ignore the present.
          *   *Phrasing:* "If the future matters this much, why are we funding bed nets?"
          *   *Reply:* Instrumental vs. Constitutive. We need people *now* to value the future.
          *   *Weakness:* Still implies massive resource shift to x-risk.

      *   *Objection 2: Unmeasurable/Unactionable.* (Treasury Skeptic). "How do I budget for 'meaning'?"
          *   *Phrasing:* "I can't put 'retroactive meaning' in a cost-benefit analysis."
          *   *Reply:* It's a constraint, not an objective function. Like human rights.
          *   *Weakness:* Constraints get ignored when budgets tighten.

      *   *Objection 3: Double Counting.* (Economist). "Aren't you counting the future lives *and* the value of them existing?"
          *   *Phrasing:* "You're counting the QALYs of the future people, and then adding a 'meaning bonus'."
          *   *Reply:* No, it's the *condition* for current QALYs having full weight.
          *   *Weakness:* Hard to disentangle mathematically.

      *   *Objection 4: The "Nobody Knows" Argument.* (Skeptic). "If we go extinct silently, who feels the loss?"
          *   *Phrasing:* "If no one is around to be sad about it, where is the harm?"
          *   *Reply:* It's not about sadness, it's about the *truth* of the value of our current efforts.
          *   *Weakness:* Sounds metaphysical/spooky.

      *   *Objection 5: Non-Identity/Parfit.* (Philosophically literate Economist). "Future people don't exist yet."
          *   *Phrasing:* "You can't harm people who never existed. There's no victim."
          *   *Reply:* It's not harm to *them*, it's loss of value for *us*.
          *   *Weakness:* Confuses the locus of value.

      *   *Objection 6: Substitution/Non-Human Successors.* (Based on Case 2). "Why humans specifically?"
          *   *Phrasing:* "If aliens value our archive, why does it matter if they are human?"
          *   *Reply:* Continuity of *project* valuing, not biology. (Aligns with Case 2).
          *   *Weakness:* Might undermine "human" extinction focus.

      *   *Objection 7: Present Bias/Neglect.* (Pragmatist). "People are dying now."
          *   *Phrasing:* "This sounds like a luxury belief for people who don't see malaria."
          *   *Reply:* Long-termism stabilizes short-term investment.
          *   *Weakness:* Hard to prove causally.

      *   *Objection 8: The "One-Day World" Counter.* (Specific to the cases). "Is a day really enough?"
          *   *Phrasing:* "If they are happy for that day, isn't that enough?"
          *   *Reply:* Human agency requires temporal extension.
          *   *Weakness:* Paternalistic.

      *   *Refining the Order:* The "Opportunity Cost/Discounting" objection is the killer for health economists. The "Unmeasurable" is the killer for the Director. Let's put those top.

  4.  **Drafting the Replies:**
      *   Need to sound pragmatic, not metaphysical. Use their language (investment, portfolio, risk).
      *   Keep it under 2 minutes spoken (approx. 250-300 words).
      *   Identify the "Soft Spot" honestly.

  5.  **The "Question I'm Hoping Nobody Asks":**
      *   What undermines the whole thesis?
      *   Maybe: "If the future is likely to be terrible (suffering risks), doesn't extinction *increase* the meaning of our current struggle to prevent that?" Or simpler: "Does this imply we should stop global health work to focus on asteroid deflection?"
      *   Let's go with the resource allocation trade-off. It forces a binary choice they aren't ready to make.

  6.  **Review against Constraints:**
      *   8 objections? Yes.
      *   Ordered by damage? Yes.
      *   Phrased as economist/skeptic? Yes.
      *   2-min reply? Yes.
      *   Soft spot noted? Yes.
      *   "Hope nobody asks" included? Yes.
      *   Tone: Professional, strategic, slightly defensive but confident.

  7.  **Final Polish:**
      *   Ensure the distinction between Case 1 and Case 2 is woven into the replies where relevant.
      *   Make sure the "retroactive" claim doesn't sound like magic time travel. It's about the *conditions of justification*.
      *   Check the "Treasury" voice (ROI, KPIs, budget lines).
      *   Check the "Health Econ" voice (DALYs, discount rates, marginal utility).

      *(Self-Correction during drafting)*: I need to make sure I don't sound *too* philosophical. The prompt says "phrased the way a health economist or a treasury skeptic would put them." So the objections shouldn't sound like Nozick or Parfit directly, but like practical applications of those ideas. E.g., instead of "Non-Identity Problem," call it "Counterfactual Baseline Issues."

      *(Refining the "Retroactive" claim)*: This is the hardest sell. Economists think causality moves forward. I need to frame "retroactive" not as changing the past, but as changing the *current valuation* of the past. Like an asset class that loses value if the market closes.

      *(Final check on the "Hope nobody asks" question)*: It needs to be the one that exposes the funding implication. "Does this mean we defund malaria to fund asteroids?"

  8.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  # PREP SHEET: EXTINCTION & RETROACTIVE VALUE
  **Audience:** Global Health Research Committee (Health Economists, Treasury Director, 1 Philosopher)
  **Goal:** Secure funding/legitimacy for extinction-risk research without alienating current welfare priorities.
  **Core Argument:** Extinction isn't just lost future QALYs; it devalues current projects by removing the successors required to sustain their meaning (Scheffler).
  **Opening Cases:** (1) One-Day World (no future horizon) vs. (2) Archive World (non-human successors).

  ---

  ## TOP 8 OBJECTIONS (Ordered by Damage Potential)

  ### 1. The Opportunity Cost / Discount Rate Objection
  **Who:** Lead Health Economist
  **Phrasing:** "If the continuation of the species is a prerequisite for value, doesn't that imply an infinite weight on existential risk? By standard discounting, preventing a 0.01% extinction risk next century outweighs saving a million lives today. Are you proposing we reallocate the malaria budget to asteroid deflection?"
  **The 2-Minute Reply:**
  "I'm not proposing we replace welfare economics; I'm proposing we add a constraint. Think of it like a 'going concern' assumption in accounting. A company can't value its quarterly profits if it knows it's dissolving next month. Similarly, global health investments rely on a stable horizon to make sense. If we treat extinction risk as a 'systemic risk' to the portfolio rather than a competing line item, we don't need infinite weight. We just need to ensure the market stays open. We aren't trading bed nets for asteroids; we're ensuring the supply chain for bed nets exists in 2100. It justifies a baseline insurance premium, not total reallocation."
  **Softest Spot:** They will press you on the *size* of that premium. If you say 1%, they'll ask for the ROI calculation. You don't have one.

  ### 2. The "Unmeasurable KPI" Objection
  **Who:** Treasury Director
  **Phrasing:** "I can budget for DALYs averted. I can budget for lives saved. I cannot budget for 'retroactive meaning.' If you can't give me a metric, I can't defend this line item to the board. This sounds like art funding, not health funding."
  **The 2-Minute Reply:**
  "I agree we can't measure 'meaning' directly. But we measure 'stability' all the time. We fund governance and institutions not because they produce QALYs directly, but because they create the environment where QALYs can be produced. Treat extinction risk mitigation as infrastructure. You don't measure the ROI of a levee until the flood comes. The metric isn't 'meaning gained'; it's 'continuity of valuation preserved.' We are funding the condition that makes your other metrics possible."
  **Softest Spot:** Infrastructure usually has a clear failure mode. "Continuity" is vague. He may cut it as "overhead."

  ### 3. The Double-Counting Objection
  **Who:** Senior Health Economist
  **Phrasing:** "Standard long-termism already counts the welfare of future people. You're saying extinction is bad because of lost QALYs, *plus* bad because it voids the past. Aren't you double-counting the future? You're counting their lives and their function as an audience."
  **The 2-Minute Reply:**
  "No, because standard models treat future lives as *containers* of value. I'm arguing they are *generators* of value for the present. In a standard model, if I save a life in 2050, I add utility in 2050. In my model, saving that life also secures the value of the work we do in 2024. It's not double-counting the future; it's recognizing that the present value of our work is contingent on that future. It's the difference between valuing a bond for its coupon payments versus valuing it because it keeps the bank solvent."
  **Softest Spot:** Mathematically, this still looks like adding a second variable to the utility function that correlates perfectly with the first.

  ### 4. The "If Nobody Knows" Objection
  **Who:** Treasury Skeptic
  **Phrasing:** "If humanity goes extinct instantly, there's no one left to feel the loss. No one knows the meaning was lost. Where is the actual harm? You're positing a metaphysical loss that no conscious being experiences."
  **The 2-Minute Reply:**
  "Think of Case Two: The Archive. If aliens value our work, we feel less loss. Why? Because the *truth* of our contribution changes. Harm doesn't require a witness at the moment of impact. If I write a book that is burned before anyone reads it, the harm isn't just the reader's disappointment; it's the nullification of my effort. Extinction burns the book. The harm is the objective loss of a project's completion conditions, not the subjective sadness about it."
  **Softest Spot:** Economists define harm as reduced welfare for a subject. "Objective loss of project completion" sounds mystical to them.

  ### 5. The Non-Identity / Counterfactual Objection
  **Who:** Economist (who read some philosophy in grad school)
  **Phrasing:** "Future people don't exist. You can't say they are 'harmed' by not being born, and you can't say *we* are harmed by their absence if we're dead. You're relying on a counterfactual baseline where specific people exist who otherwise wouldn't. That's not a cost we can model."
  **The 2-Minute Reply:**
  "I'm not claiming harm to the non-existent future people. I'm claiming a loss of *justification* for current people. When I treat a patient today, part of my justification is 'this contributes to a healthier future.' If there is no future, that justification is false. It's not about the specific identity of future people; it's about the existence of *any* successors who can carry the project. It's a structural loss, not an individual harm claim."
  **Softest Spot:** This moves the goalposts from "harm" to "justification," which is harder to operationalize in a grant proposal.

  ### 6. The Substitution Objection (Based on Case 2)
  **Who:** Health Economist
  **Phrasing:** "In your Archive World, non-humans value our records. If the value comes from 'being valued,' why does it matter if it's humans doing the valuing? Does this imply we should fund alien-contact risk over human extinction risk?"
  **The 2-Minute Reply:**
  "It implies we should value *continuity of valuing* over *biological continuity*. However, human successors are the only known reliable mechanism for preserving human projects. Non-human successors are a high-risk hedge. My argument supports extinction risk reduction because humans are the current vehicle for this value chain. If we find a reliable non-human successor, great, but until then, human survival is the only actionable proxy."
  **Softest Spot:** If they push that AI is a non-human successor, you might have to admit human extinction matters less if AI survives. That's a PR nightmare for a health funder.

  ### 7. The "One-Day World" Counter-Intuition
  **Who:** Treasury Skeptic
  **Phrasing:** "In Case One, everyone is happy for their one day. They don't know they die tomorrow. If welfare is high, why is it 'nearly as bad as extinction'? You're saying ignorance makes it worse? That seems paternalistic."
  **The 2-Minute Reply:**
  "It's not about their ignorance; it's about the collapse of agency. Human welfare isn't just momentary pleasure; it's pursuit of goals. If I build a hospital knowing it collapses in 24 hours, the welfare gain from building it is negligible. In the One-Day World, no one can build the hospital. The 'badness' is the inability to engage in extended agency. It's a welfare argument, but about the *structure* of welfare, not just the intensity."
  **Softest Spot:** Hedonic utilitarians in the room will reject "extended agency" as a component of welfare if it doesn't feel good in the moment.

  ### 8. The "Luxury Belief" Objection
  **Who:** Director (Pragmatic)
  **Phrasing:** "This sounds like a theory for people who don't see children dying of diarrhea today. Is 'meaning' really a priority for a funder with our mandate?"
  **The 2-Minute Reply:**
  "It's not a priority over saving lives; it's a safeguard for the investment. If we ignore the horizon, we risk making our current successes temporary. We aren't asking you to fund meaning *instead* of health. We're asking you to recognize that health work *presumes* a future. Ignoring extinction risk is like investing in a farm without checking if the land is being sold. It's due diligence, not luxury."
  **Softest Spot:** If the land *is* being sold (high x-risk), the pragmatic move might be to eat the crops and run, not farm harder.

  ---

  ## THE QUESTION I'M HOPING NOBODY ASKS
  **"If the future is likely to contain net suffering (e.g., dystopian scenarios), doesn't extinction actually *preserve* the value of the past by preventing it from being tainted by a terrible future? Does your theory compel us to prevent extinction even if the future is hell?"**

  **Why this kills me:**
  1.  It forces me to defend the *quality* of the future, not just the *existence* of successors.
  2.  If I say "Yes, prevent extinction even if it's hell," I look like a monster to the health economists focused on suffering.
  3.  If I say "No, only if the future is good," I collapse back into standard welfare utilitarianism, rendering my "retroactive meaning" argument redundant.
  4.  It exposes that "forward-looking valuing" requires the future to be *worth* valuing, which brings us right back to QALYs/DALYs.

  **Prepared Deflection (if asked):**
  "That's why the 'Archive' case matters. We want successors who value the *good* we did. A dystopian future might devalue the past. But we can't predict the future's valence with enough confidence to bet on extinction. Our mandate is to preserve the *option* for a valuable future, not to guarantee it." (Weak, but buys time).
