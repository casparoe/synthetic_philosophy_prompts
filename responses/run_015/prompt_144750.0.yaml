answer: |-
  **Project Title:** The Mirror and the Forge: Tensions in the Normative Justification for Sortition

  **Research Question**
  Can the case for sortition sustain two conflicting normative claims simultaneously: that randomly selected bodies *mirror* the descriptive characteristics of the population, and that they *transform* preferences through deliberation to reach superior outcomes? If these claims are incompatible, which justification bears the weight of political authority, and what becomes of the democratic legitimacy of sortition once the other is discarded?

  **The Dialectical Gap**
  Current defenses of sortition and citizens' assemblies typically treat descriptive representation and deliberative quality as complementary features. The standard argument runs that random selection ensures the body looks like the people (mirroring), while structured deliberation ensures the body thinks better than the people (transformation). The literature assumes these functions reinforce one another: the mirror provides legitimacy, and the transformation provides efficacy.

  This project identifies a logical tension hidden in that compatibility claim. If deliberation successfully transforms preferences—changing minds, refining values, and moving participants away from their initial aggregate position—the body ceases to mirror the population at the moment of decision. Conversely, if the body must strictly mirror the population's existing preferences to claim descriptive legitimacy, deliberation becomes redundant or even illegitimate, as it distorts the "signal" from the public.

  Existing positions leave this open because they rarely specify whether the value of sortition lies in the *input* (who is in the room) or the *output* (what they decide). Defenders of mirroring often retreat to a claim about interests or social position when challenged on preferences, but this undermines the case for deliberation (since interests are fixed, whereas preferences are malleable). Defenders of transformation often rely on epistemic arguments but cloak them in the language of descriptive representation to secure democratic legitimacy. The gap is not a lack of empirical data on how assemblies perform, but a lack of conceptual clarity on which normative workbench the justification actually sits on. This project argues that you cannot have it both ways: a body that is genuinely transformed is no longer a mirror, and a body that remains a mirror has not genuinely deliberated.

  **Method and Work Plan**
  This is a conceptual project, not an empirical one. While empirical data on citizens' assemblies is abundant, no amount of data can resolve a normative contradiction. Knowing *that* participants change their minds does not tell us whether that change validates or invalidates the claim to representativeness. Therefore, the method will be reconstructive argumentation: mapping the logical commitments of each justification and testing their compatibility.

  *   **Month 1: Taxonomy and Reconstruction.** I will catalog the standard arguments for sortition, separating claims about selection (fairness, descriptiveness) from claims about process (deliberation, epistemic quality). The goal is to formalize the "Entry-Mirroring" vs. "Exit-Mirroring" distinction into precise normative terms.
  *   **Month 2: Stress Testing Compatibility.** I will attempt to construct a coherent model where both claims hold. This involves testing obvious escapes: e.g., that mirroring applies only to interests, not preferences; or that transformation is merely informational, not valuational. If these escapes fail—as I suspect they will—I will identify which justification collapses first.
  *   **Month 3: Drafting and Implications.** The final month is dedicated to writing the 8,000-word paper. The conclusion will not merely diagnose the tension but argue for one surviving justification. If the transformation argument wins, I will outline what happens to the democratic legitimacy claim once the "mirror" is broken. If the mirroring argument wins, I will assess whether sortition offers anything distinct from simple lottery-based fairness without deliberative ambitions.

  **Why this approach?**
  The obvious alternative is to engage deeply with the empirical literature on participation rates and deliberative dynamics. I am bracketing this for two reasons. First, the tension is logical, not factual; even a perfectly representative sample that deliberates perfectly faces this normative conflict. Second, scope management. Including the empirical wrinkle regarding self-selection and compulsory service risks turning a sharp conceptual paper into a broad institutional survey. The empirical question of *who* shows up is vital, but it is a sequel to the question of *why* their presence justifies authority.

  **Failure Conditions and Early Detection**
  The project fails if the tension turns out to be illusory. The most likely "boring" outcome is that the literature already segregates these claims by institutional type: mirroring justifies advisory bodies, while transformation justifies governing bodies. If this is the case, there is no contradiction, only a scope confusion.

  I will know this by the end of Month 2. If the taxonomy reveals that no serious theorist actually claims both mirroring and transformation for the *same* institution at the *same* time, the central problem dissolves. In that event, the paper will pivot to diagnosing why this scope confusion persists in popular discourse, though this is a less significant contribution. A more productive failure would be finding that both arguments collapse, leaving sortition with no normative ground distinct from existing representative models. This would still be a viable paper, arguing for a retreat to simpler fairness-based models.

  **Scope Check**
  This proposal is designed strictly for a single 8,000-word paper. The empirical wrinkle regarding self-selection bias and compulsory service (the "uptake" problem) is explicitly excluded from the core argument. While relevant, it complicates the normative analysis without resolving it. By treating the random selection as idealized for the sake of argument, I can isolate the normative conflict without getting bogged down in institutional design details. The goal is not to design a better assembly, but to clarify the justification for the ones we currently propose. This ensures the project is completable within one semester of research leave.
