answer: |-
  Good morning. Thank you for being here.

  Looking around this room, I see a divide that we often pretend doesn't exist. On one side, we have those who study the architecture of learning—theories, epistemologies, the deep structure of what it means to know something. On the other, we have those who build the building—the admins, the leaders who have to staff classrooms, manage budgets, and answer to parents when things go wrong. Usually, these two groups talk past each other. The theorists speak in ideals; the practitioners speak in constraints.

  I want to start by telling you why I am not standing in a classroom right now.

  Last month, I was fired. I identified a policy in my school that was harming students. I was correct about the harm. The data supported me; the outcomes were visible. But when I was called into a meeting to discuss my concerns, I was asked to explain the underlying mechanism of why the policy was failing. I stumbled. I could point to the bad result, but I couldn't trace the chain of reasoning that connected the policy to the harm. I had the right answer, but I didn't have the map.

  I had true belief. I did not have knowledge.

  And in the eyes of the administration, that distinction cost me my job.

  We are gathered here to talk about ethics, but I want to suggest that epistemology is the bedrock of educational ethics. There is an old philosophical question about why knowledge is more valuable than mere true belief. After all, if you need to get to a specific destination, a lucky guess gets you there just as fast as a calculated route. If the outcome is all that matters, why does the method count?

  For those of you steeped in the literature, you know the standard answers. But I want us to move past the textbook definitions. I want us to look at this through the lens of *credit* and *stability*.

  When a teacher operates on true belief alone, they are relying on epistemic luck. They might be using a curriculum that works, but they don't know *why* it works. They might be managing behavior effectively, but only because the specific dynamics of this year's class happen to align with their instincts. This is fragile. As soon as the context shifts—as soon as the variables change—the lucky guess fails. The teacher who relies on true belief cannot adapt because they cannot track the truth across different possible scenarios. They are right only until they are wrong.

  Knowledge, by contrast, is an achievement. It is the difference between stumbling onto the answer and possessing the ability to navigate the terrain. When a teacher has knowledge, they deserve credit for their success because the success is attributable to their competence, not their circumstance.

  To the administrators in the room: this is not just theoretical. This is a hiring and evaluation issue. When you interview a candidate, are you testing for true belief or knowledge? Are you looking for someone who can recite the right buzzwords—the lucky guess that sounds good in an interview—or are you probing for the underlying reasoning that will hold up when the classroom chaos begins?

  When you evaluate a teacher, do you look solely at outcomes? If two teachers get the same test scores, but one got there through rote drilling that lucky onto the state exam questions, and the other got there through deep conceptual understanding, are they equally successful? If you treat them as equals, you are incentivizing fragility. You are hiring for luck. And when the luck runs out, when the policy changes, or when a parent demands an explanation for a grade, that teacher will be in the same position I was in: correct, but defenseless.

  To my colleagues in philosophy: we need to help them see that the "credit condition" matters for professional agency. If a teacher cannot articulate the justification for their practice, they cannot claim ownership of it. They become technicians executing orders rather than professionals exercising judgment. When I couldn't defend the "why" in that meeting, I ceased to be a professional agent in their eyes. I became a malfunctioning component.

  This workshop is about ethics, but we cannot be ethical agents if we are epistemically hollow. We cannot defend students, we cannot resist bad policy, and we cannot mentor the next generation if we are operating on true belief alone. We need to build systems where knowledge is recognized, rewarded, and required.

  Over the next few days, I want us to dig into what it looks like to build that kind of knowledge. Not just for the sake of being right, but for the sake of being able to stay in the room when it matters.

  Let's get to work.
