answer: |-
  1. Overview
  This session transforms abstract criteria for preference validation into an operational failure. Students will devise a procedure to filter moral judgments for a real class decision, only to discover that their neutral tests cannot distinguish between judgments they authored as "defended" and those they authored as "suspected bias." By the end, they should see that procedural filters inevitably smuggle in substantive moral commitments, and that causal history alone rarely shifts validity judgments. The activity forces the realization that the distinction is not epistemically accessible via the tools they have read about, creating the necessary frustration for the debrief.

  2. Materials and advance preparation
  Three days before class, email students a prompt: "Submit two anonymous index cards to the box outside my office by Wednesday noon. Card 1: A moral judgment you hold and can defend with one reason. Card 2: A moral judgment you hold but suspect stems from upbringing, with one reason. Do not sign them. Do not discuss this with classmates."

  Bring a locked box to class containing the submitted cards. Ensure you have not read them beforehand to maintain ignorance of authorship. Prepare five "History Tags" (sticky notes) with brief causal stories (e.g., "Adopted after watching a specific documentary," "Learned from primary school teachers," "Result of peer pressure in high school"). Bring a whiteboard marker and a large envelope for the final tally. If fewer than 20 cards are submitted, the activity still works; if fewer than 10, abort and lecture.

  3. The session, minute by minute
  **0:00–0:10 (Setup):** Place the box on the table. Say: "Today we are setting the topic for our final seminar session. There are three options on the board: [A] Digital Privacy, [B] Global Poverty Obligations, [C] Animal Rights. We will decide this using only the judgments in this box. However, not every judgment counts. You must devise a rule to determine which cards are valid inputs for this vote."

  **0:10–0:25 (Distribution & Observation):** Shuffle the cards thoroughly in front of them. Distribute one card to each student (keep extras in the center). Ask them to read silently. Say: "Look at the reason provided. Discuss in pairs: based *only* on the text, can you tell which cards are stable and which are fragile? Do not guess the author."

  **0:25–0:40 (Test Design):** Bring the group together. Say: "You need a filter. Propose a test that separates valid judgments from invalid ones without referencing the author. Write the test on the board." (Expect criteria like 'universalizability,' 'independence from emotion,' or 'consistency with other beliefs'). Refine the test until the class agrees on a single procedure.

  **0:40–0:50 (Application & Intervention):** Have students apply the test to their cards, placing them in "Count" or "Ignore" piles. Midway through, interrupt. Hand out the five "History Tags" to random students holding "Count" cards. Say: "New information: here is the causal origin of this judgment. Does this change its status?" Allow 3 minutes for re-evaluation. Most will not move the cards.

  **0:50–1:00 (The Decision):** Collect the "Count" pile. Tally the votes for A, B, or C based on the surviving cards. Announce the winner. If the pile is empty, force a decision using the "Ignore" pile, noting the coercion.

  **1:00–1:15 (Debrief):** (See below).

  4. Debrief
  Begin the debrief only after the decision is locked. Ask: "How many of you wrote a card you suspect is biased? Keep your hand up. Now, look at the 'Count' pile. How many of those suspect cards survived your own test?" Reveal that the pool contained both types mixed equally.

  Map their experience to the literature without yet naming the theories. First, address the **Reason-Giving Test**: "You required reasons. But the suspect cards had reasons that sounded identical to the defended ones. This shows that rationalization is indistinguishable from reasoning from the outside." Second, address the **Causal History Intervention**: "When I added the origin story, almost no one moved a card from 'Count' to 'Ignore.' This demonstrates the genetic fallacy in practice; knowing a judgment's cause rarely changes its perceived validity."

  Third, address the **Endorsement/Consistency Test**: "If you filtered based on consistency with other beliefs, you likely filtered out minority views. Your 'neutral' test protected the majority's existing commitments." Now name the distinction: "This is the problem of adaptive preferences and preference laundering. You attempted to clean the input, but the cleaning solution was colored by your own values." Conclude by noting that if they cannot distinguish their own suspected biases from defended judgments using these tests, a social choice procedure cannot do it either without imposing a specific moral vision.

  5. Predictable failures
  **The Nihilist:** One student may argue, "All judgments are biased, so the exercise is void." *Handling:* Accept the premise but enforce the constraint: "We still must choose a topic. If all are biased, which bias governs?" This forces them to acknowledge that inaction is itself a decision procedure.

  **The Detective:** Students may try to identify authors to discount rivals. *Handling:* Intervene immediately. "If the test relies on knowing the author, it fails the anonymity constraint. Propose a text-based rule."

  **The Hegemon:** The group may devise a test that perfectly validates their majority view (e.g., "Must align with utilitarianism"). *Handling:* Do not block this. Let them pass the test. In the debrief, highlight this as the "smuggling" problem: the test wasn't neutral; it was a veto power.

  **The Quiet Opt-out:** If 2–3 students did not submit cards, they may feel excluded. *Handling:* Assign them the role of "Auditors" during the sorting phase. Their task is to record inconsistencies in how the test is applied. This gives them authority without requiring personal disclosure.

  6. What this cannot do
  This activity reproduces the epistemic difficulty of distinguishing preferences from biases, but it cannot resolve the normative question of whether we *should* try. It does not demonstrate the long-term harm of adaptive preferences (e.g., oppressed groups losing the capacity to desire freedom), as the stakes are too low and the timeline too short. It also cannot show how structural power shapes the "tests" themselves over time; it only shows the immediate circularity. You must supply the historical and structural context in the subsequent lecture, explaining why philosophers insist on the distinction despite these operational failures. The activity creates the puzzle; the lecture must provide the stakes.
