      *   *Problem:* We are in 3D space representing 2D spacetime.
      *   *Solution:* Use the height of the string to represent Time.
      *   Floor = Space. Height = Time.
      *   Distant Events are cards taped to the wall at different heights.
      *   Ambassador holds one end of string at "Head Height" (Now).
