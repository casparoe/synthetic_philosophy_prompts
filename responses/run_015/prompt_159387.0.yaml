      *   Students see: The Ledger says "Real" before the Messenger says "It Happened."

  9.  **Troubleshooting & Limitations:**

      *   *Confusion:* Students might think the string angle is arbitrary. *Fix:* Emphasize the Lottery makes it "Law of Nature."
