      *   The Advocate wants to say "Only what is simultaneous for *Stationary* Earth is Real."
      *   The Ambassador (Lottery) shows that Moving Frames are also valid.
      *   If Moving Frame says Event X is "Now" (and thus Real), and Stationary Frame says Event X is "Future," but Event X gets ratified... then "Future" is Real.

  7.  **Addressing the "Advocate's Failure":**

      *   Advocate proposes a rule: "Only events simultaneous with Earth-Now are Real."
      *   Round 1: Ambassador Stationary. Rule works.
      *   Round 2: Ambassador Moves (Lottery). String tilts. Touches a "Future" card.
      *   Rule: "If the Ambassador (a valid observer) says it's Now, it's Real."
      *   Result: A "Future" card is written on the Ledger.
      *   Advocate tries to fix: "Okay, only Stationary frames count."
      *   Instructor (Nature): "Principle of Relativity: All inertial frames are equal." Advocate overruled.
      *   Advocate tries: "Okay, nothing is Real until the Light Messenger arrives."
      *   Instructor: "That's Verificationism, not Realism. The Ledger is Ontology."
