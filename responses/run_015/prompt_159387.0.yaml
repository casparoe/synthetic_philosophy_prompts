      *   *The "Passing" aspect:* Rietdijk-Putnam usually involves two observers passing at a point. Here we have one Ambassador over time. *Fix:* Frame the Rounds as "Possible Worlds" or "Counterfactual Observers" that all contribute to the one true Ledger. Or, treat the Ledger as the accumulation of all valid perspectives.
      *   *Limitation:* Can't show the *metric* invariance. Can't show *c*. Can't show why the tilt happens (Lorentz transforms). Must explain that in debrief.

