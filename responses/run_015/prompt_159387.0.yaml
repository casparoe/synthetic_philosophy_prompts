  2.  **Deconstruct the Rietdijk–Putnam Argument:**

      *   *Premise 1:* Special Relativity is true (specifically, relativity of simultaneity).
      *   *Premise 2:* If two events are simultaneous for an observer, and one is "real" (present), the other must be "real" (present).
      *   *Premise 3:* Different observers (in relative motion) have different planes of simultaneity.
      *   *Conclusion:* What is "real" depends on the observer. If reality is objective, all events in all planes must be equally real (Eternalism).
      *   *The "Feel":* The frustration of trying to pin down "Now" when "Now" slides depending on how you move.

  3.  **Designing the Activity ("The Ledger of Andromeda"):**

      *   *Spatial Setup:* Need to represent space and time. Since we can't move through time, we'll use the room floor as spacetime. Let's say one dimension is space (x-axis), the other is time (t-axis). Actually, for a 75-min class, a 1D space + 1D time representation on the floor might be too abstract. Let's make "Space" the distance across the room and "Time" the sequence of rounds.
      *   *Better Approach:* Use the string to define "Simultaneity Lines."
      *   *The "Ambassador":* Needs to move. Let's have a student walk across the room. Their speed determines their "tilt" of simultaneity.
      *   *The "Events":* Index cards placed at a distance (representing Andromeda/Distant Galaxy).
