answer: |-
  **To:** The Conduct Committee
  **From:** The Chair
  **Subject:** Implementation of the Impartial Spectator Protocol (ISP)

  We are adopting a new decision procedure based on Adam Smith's *The Theory of Moral Sentiments*. Our goal is to escape the "peer bias" trap—where we judge conduct by what we would have done in the same tribe—and instead judge by what an informed, detached observer would feel.

  Below are the design specifications addressing our four known failure points, followed by the standing procedure, the case applications, and an assessment of where this system will break.

  ### I. Design Specifications: The Four Constraints

  **1. The Spectator's Information Set**
  *   **Question:** May our spectator know the outcome?
  *   **Answer:** **Yes.**
  *   **The Trade-off:** If we say **No**, we lose the ability to assess the actual harm done to the public trust and the victim; we risk judging a disaster the same as a near-miss, which undermines public safety. If we say **Yes** (without correction), we lose moral fairness; we punish bad luck rather than bad intent, which is the "irregularity of fortune" Smith warns against.
  *   **The Fix:** The Spectator knows the outcome as a *fact*, but is procedurally barred from weighting it during the **Propriety** phase (judging the agent's heart). Outcome weight is permitted only in the **Merit** phase (judging the sanction), and even then, it must be discounted to account for luck.

  **2. Propriety versus Merit**
  *   **The Problem:** Punishment requires resentment. In victimless crimes (fraud) or grateful victims (abuse), resentment is absent.
  *   **The Fix:** We split the inquiry.
      *   *Propriety:* Did the agent's motives fit the context? (Independent of victim feelings).
      *   *Merit:* Who is entitled to resent? If the direct victim is absent or grateful, the **Register itself** stands in as the proxy victim. The "resentment" is the breach of public trust. This allows sanction even when the direct victim complains nothing.

  **3. Sympathetic Imagination**
  *   **The Problem:** Panelists guessing "what I would feel" rather than entering the agent's situation.
  *   **The Fix:** We mandate **Evidence-Based Imagination**. Panelists cannot ask, "What would I do?" They must ask, "Given the evidence of their stress, training, and information *at that moment*, is their emotional response intelligible?"
  *   **Time Allocation:** 30 minutes of the 90-minute sitting is ring-fenced for this. It requires specific testimony regarding the agent's state of mind, not just their actions.

  **4. Rank and Deference**
  *   **The Problem:** Natural deference to seniors (or reverse discrimination against them).
  *   **The Fix:** The **Blind Rank Step**. Before deliberation, the panel must explicitly state the rank of the parties. Then, they must articulate how the judgment would change if the ranks were reversed. If the judgment *does* change, the panel is disqualified from voting on that case until they can reconcile the discrepancy. Smith admits we naturally defer to the rich and powerful; the Spectator's job is to correct this, not indulge it.

  ---

  ### II. The Impartial Spectator Protocol (ISP)

  **Total Time:** 90 Minutes
  **Quorum:** 3 Panelists
  **Decision Rule:** Consensus on Propriety; Majority on Sanction.

  #### Phase 1: Fact-Finding & Information Bracketing (15 Minutes)
  1.  **Establish Facts:** Review the evidence.
  2.  **Outcome Bracketing:** The Chair reads the outcome (harm/no harm) aloud. The panel acknowledges it but agrees to **bracket** it for Phase 2.
      *   *Exit Point:* If the facts are insufficient to determine the agent's state of mind, return to investigation. Stop.

  #### Phase 2: Propriety (The Agent's Breast) (30 Minutes)
  *Goal: Determine if the agent's motives and emotions were proportional to their situation, ignoring the outcome.*
  3.  **The Imagination Test:** Panelists must articulate the agent's motive using evidence (logs, testimony, context).
      *   *Question:* "Entering the agent's situation, with their information and constraints, would the Impartial Spectator find their anxiety/anger/haste proportional?"
      *   *Sufficient Answer:* "Yes, given X stressor, Y emotion was natural," OR "No, the emotion exceeded the cause."
  4.  **The Verdict on Propriety:**
      *   **If Propriety is Upheld:** Proceed to Phase 3.
      *   **If Propriety is Violated:** The agent is guilty of misconduct. Proceed to Phase 3 to determine sanction.
      *   **If Propriety is Unclear:** Hand back to Chair for further investigation. Stop.

  #### Phase 3: Merit (The Sufferer's Resentment) (30 Minutes)
  *Goal: Determine the sanction based on justified resentment.*
  5.  **Identify the Resenter:** Who has the right to resent?
      *   Is it the direct victim?
      *   If the victim is grateful/absent, is it the Public/Register?
  6.  **The Luck Discount:** If harm occurred, the panel must explicitly estimate how much of that harm was due to *negligence* versus *chance*.
      *   *Question:* "If the outcome had been different, would our resentment be the same?"
      *   *Requirement:* Sanction must be calibrated to the *negligence*, not the *harm*.
  7.  **The Rank Check:** Explicitly state: "Would we recommend this sanction if the senior were the junior and vice versa?" If the answer is no, the recommendation is void.

  #### Phase 4: Judgment & Sanction (15 Minutes)
  8.  **Select Sanction:**
      *   *Propriety Violation + Low Resentment:* Censure / Reprimand.
      *   *Propriety Violation + High Resentment (Public Trust):* Suspension.
      *   *Propriety Violation + Malice/Repeat:* Strike Off.
  9.  **No Sanction Exit:** If Propriety is upheld AND Resentment is unjustified (e.g., pure bad luck with no negligence), the case is dismissed.

  ---

  ### III. Case Applications

  Here is how the ISP runs on three recurring case types.

  #### Case 1: The Humiliating Senior
  *Facts:* Senior member publicly berates a junior during a ward round. The junior states privately they found it "bracing" and refuses to complain. A bystander files a complaint.
  *   **Phase 2 (Propriety):** The Spectator enters the Senior's situation. Was the anger proportional to the medical error? If the error was minor and the rage was explosive, Propriety is violated. The Junior's forgiveness does not fix the Senior's lack of self-command.
  *   **Phase 3 (Merit):** The Junior feels no resentment. However, the **Bystander** (and the Profession) resents the breach of decorum. The "Victim" for sanctioning purposes becomes the *culture of the ward*.
  *   **Outcome:** **Censure.** The Senior is sanctioned for lack of self-command (Propriety) and damaging the professional environment (Merit), despite the Junior's forgiveness.
  *   **Chair's View:** You will likely accept this. It protects the system even when the individual victim does not.

  #### Case 2: The Victimless Fraud
  *Facts:* Member falsifies 40 hours of continuing education. Audit discovers it. No patient relied on this; no harm occurred.
  *   **Phase 2 (Propriety):** The Spectator enters the agent's situation. Was the motive to deceive to maintain status? Yes. Is deceit proportional to the stress of being busy? No. Propriety is violated. Truth-telling is a foundational sentiment.
  *   **Phase 3 (Merit):** There is no direct victim to resent. The **Register** is the proxy victim. The resentment is the erosion of trust in the certification system.
  *   **Outcome:** **Suspension.** Even without harm, the breach of trust (Propriety) warrants a penalty to satisfy the "resentment" of the public who relies on the Register's accuracy.
  *   **Chair's View:** You will likely accept this. It upholds the integrity of the roll.

  #### Case 3: The Moral Luck Dilemma
  *Facts:* Two members make the exact same judgment call on the same ambiguous data. Member A's patient survives. Member B's patient dies due to an unforeseen biological reaction. Both are charged with negligence.
  *   **Phase 2 (Propriety):** The Spectator enters both agents' situations. Their information, stress, and reasoning were identical. Their motives were identical. **Propriety is judged equal.**
  *   **Phase 3 (Merit):** Here lies the friction. Human nature resents Member B more because the outcome is tragic. However, the ISP requires the **Luck Discount**. The panel must ask: "Was the death caused by negligence or biology?" If the negligence was identical, the *demerit* is identical.
  *   **Outcome:** **Equal Sanction (e.g., Mandatory Retraining).** To punish Member B more harshly is to punish luck, which the Impartial Spectator forbids.
  *   **Chair's View:** **You will not like this.** You will want to sanction Member B more severely to satisfy public outcry and acknowledge the death. But under Smith, this is an "irregularity of sentiment." If you punish B more than A, you are admitting your committee judges on outcomes, not conduct. This procedure forces you to treat them equally, which will look like indifference to the deceased patient.

  ---

  ### IV. Viability Assessment: What Survives, What Drops, Where It Misfires

  To make Smith work in ninety minutes with non-philosophers, we must be ruthless about translation.

  **1. Distinctions That Must Survive**
  *   **Propriety vs. Merit:** This is the engine. We must keep the separation between "Was the emotion appropriate?" (Propriety) and "How much do we punish?" (Merit). Without this, we collapse back into outcome bias.
  *   **The Luck Discount:** We must retain the instruction to discount the severity of the outcome when calibrating the sanction. This is the only way to cure the "peer review" bias of punishing bad results rather than bad decisions.

  **2. Distinctions That Can Be Dropped**
  *   **The "Man Within the Breast":** Do not ask panelists to consult their own conscience as a mystical guide. It is too vague. Replace it with the **Evidence-Based Imagination** rule. It operationalizes the Spectator without requiring moral introspection.
  *   **Gratitude vs. Resentment Nuance:** Smith spends pages on the nuance of gratitude. For us, simplify: If the victim resents, sanction is easier. If not, the burden shifts to the Public Trust. We do not need to measure the "temperature" of gratitude, only its presence or absence.

  **3. Where the Procedure Will Misfire**
  *   **Systemic vs. Individual:** Smith's theory is interpersonal. It works for a doctor-patient or doctor-doctor dynamic. It misfires on **systemic negligence**. If a member fails because the hospital system is broken, the "Impartial Spectator" might excuse the individual's propriety (they were overwhelmed), but the Committee must sanction to ensure safety. Smith's focus on the *agent's heart* may let dangerous systemic actors off too lightly if their personal motives were pure.
  *   **The "Unwelcome" Outcome:** As noted in Case 3, the procedure will occasionally demand a sanction that feels too light for the harm caused (or too heavy for a victimless technicality). You will face public pressure to abandon the "Luck Discount." If you do, the procedure is dead.

  **Final Instruction:** The ISP is not a moral compass; it is a bias-correction tool. It will not make you virtuous, but it will stop you from judging merely because you are peers. Run it strictly. If it produces a verdict you hate, check if your hatred is based on outcome rather than conduct. If it is, the procedure has done its job.
