      *   *Sympathy:* Not pity, but fellow-feeling. Entering into the situation of another.
      *   *Impartial Spectator:* The internalized judge. Not actual peers, not the agent, not the victim, but an informed, detached observer.
      *   *Propriety:* Suitability of the affection/action to the cause. (Did the emotion fit the stimulus?)
      *   *Merit/Demerit:* Desert of reward or punishment. Based on the sympathy of the spectator with the *gratitude* or *resentment* of the affected party.
