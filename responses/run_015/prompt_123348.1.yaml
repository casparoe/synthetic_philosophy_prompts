      *   *Bottom Line Revision:* The episode confirms Quine's thesis that translation is manual-relative and driven by pragmatic selection rather than discovering a pre-existing fact, because the behavioral evidence available to the Allies genuinely supported incompatible analytical hypotheses without privileging the Japanese cabinet's internal intent.

