          *   Crucial distinction: Underdetermination of theory by evidence (epistemic) vs. Indeterminacy of translation (ontological). The *mokusatsu* case is often cited as underdetermination (not enough intel), but Quine pushes further to say even with *all* behavioral evidence, indeterminacy remains.
