answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Ontology and Function of Emotional States
  **Parties:** Priya (Evaluative/Construal Position) and Marco (Somatic/Feeling Position)
  **Date:** [Current Date]

  ## PREAMBLE
  This document records the points of convergence and divergence between the undersigned regarding the nature of emotion. Its purpose is not to resolve the dispute, but to isolate the specific empirical and conceptual claims upon which the dispute turns. Both parties agree to treat the predictions recorded herein as binding for future discussion; if a bearing case resolves against a party's prediction, that party agrees to revise their theoretical commitment accordingly.

  ## SECTION I: AGREED CLAIMS
  *The following claims are endorsed by both parties. Denial of any claim below constitutes a withdrawal from this collaboration.*

  1.  **Intentionality:** Standard occurrent emotions are typically directed at an object (a situation, event, entity, or state of affairs), though this object may be imagined, remembered, or misidentified. Moods are acknowledged as distinct states that may lack a specific object.
  2.  **Correlation:** Emotional episodes are systematically correlated with patterned physiological changes (autonomic, endocrine, musculoskeletal). Neither party claims these changes are absent in standard cases.
  3.  **Phenomenology:** Emotional episodes possess a distinctive phenomenological character ("what it is like" to undergo them) that distinguishes them from cold cognitive states (e.g., calculating a sum) and non-emotional sensations (e.g., an itch).
  4.  **Agency and Reason:** Emotions play a causal and justificatory role in action. They interact with beliefs and desires to motivate behavior, and agents typically cite emotions as reasons for acting (e.g., "I ran because I was afraid").
  5.  **Non-Linguistic Subjects:** Infants and non-human animals exhibit behavioral and physiological profiles sufficient to warrant the attribution of emotional states, even in the absence of linguistic capacity to report judgments.
  6.  **Access:** It is possible for a subject to be in an emotional state without immediate introspective awareness of that state (unconscious or unacknowledged emotion).
  7.  **Taxonomy:** Emotions fall into recurring kinds (e.g., fear, anger, shame) that are distinguishable from one another by more than just the subject's verbal report.
  8.  **Scope of Theory:** A complete theory of emotion must account for: (a) the phenomenology of the experience, (b) the capacity of emotions to rationalize action, and (c) the existence of distinct emotional kinds with characteristic expressions.

  ## SECTION II: MAP OF DISAGREEMENTS
  *The following table isolates the cruxes of the dispute. The "Bearing Case" column identifies the specific scenario both parties agree is decisive for that crux. The "Prediction" column records what each party expects to observe.*

  | The Crux | Marco's Claim (Somatic) | Priya's Claim (Evaluative) | Substantive or Verbal? | Bearing Case | Marco's Prediction | Priya's Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Constitution**<br>*(Is the bodily change part of the emotion or an effect?)* | The emotion is constituted by (or is the perception of) the bodily change. Without the feeling, the emotion is missing or fundamentally altered. | The emotion is constituted by the evaluative construal/judgment. Bodily changes are typical effects or accompaniments, not the essence. | **Substantive.** Disagreement on the necessary conditions for the state's existence. | **The Denervated Subject**<br>(Interoceptive feedback blocked; cognitive appraisal intact; physiology active but unfelt.) | Subject will report *no* emotional experience or significantly diminished intensity. Emotion-guided behavior will degrade without somatic marking. | Subject will report full emotional experience based on situational appraisal. Behavior will remain intact as long as evaluation is intact. |
  | **2. Rational Assessment**<br>*(Can the emotion itself be irrational, or only the action?)* | Emotions themselves are not truth-apt. They are causal forces. Only the beliefs causing them or actions resulting from them are rational/irrational. | Emotions are assessable for rationality. They can be fitting/unfitting or rational/irrational independent of action, because they assert how the world is. | **Substantive.** Disagreement on whether emotions have correctness conditions. | **Recalcitrance**<br>(Subject judges walkway safe, yet freezes in fear. Subject reports *no* bodily change.) | This is a conflict between a judgment (safe) and a feeling (fear). If no bodily change is reported, it is not fear, but a startle reflex or habit. | This is an irrational emotion. The subject holds contradictory evaluative stances (judging safe vs. construing as dangerous). The emotion persists even without somatic feedback. |
  | **3. The Object Constraint**<br>*(Must an emotion have an external object?)* | No. An emotion can be a "bare feeling" caused chemically or mechanically without an intentional object. | Yes. An emotion without an object is a mood or a sensation, not an emotion proper. Emotions are essentially relational. | **Substantive.** Disagreement on the definition of the category "emotion." | **Emotion with No Situation**<br>(Autonomic profile matches fear; no object present; no thought of danger.) | This counts as an emotion (fear). It is a bodily state awaiting an object, but the state itself is present. | This counts as arousal or anxiety (mood), not fear. Without an object represented as dangerous, the specific emotion "fear" does not exist. |
  | **4. Reflexivity**<br>*(Can the object of an emotion be a bodily state?)* | Yes. Since emotions are feelings, one can feel a feeling. The object is the primary somatic episode. | Yes, but the emotion is a judgment *about* the bodily state (e.g., judging the palpitations as dangerous), not the feeling itself. | **Verbal/Substantive Mix.** Disagreement on the hierarchy of the state. | **Fear of Fear**<br>(Subject terrified of having a panic attack.) | The secondary fear is a new somatic pattern layered on the first. The intensity is the sum of bodily disruptions. | The secondary fear is a higher-order evaluation. The intensity depends on the *stakes* of the panic, not just the somatic load. |
  | **5. Offline Emotion**<br>*(Can emotion exist without current arousal?)* | Only as a memory or disposition. An occurrent emotion requires current somatic engagement, however faint. | Yes. An occurrent emotion can be purely cognitive/construal-based (e.g., dread, retrospective embarrassment) with negligible arousal. | **Substantive.** Disagreement on the temporal profile of the state. | **Offline Emotions**<br>(Dread about next Tuesday; embarrassment about 2009.) | Subject is recalling an emotion or anticipating one. If no somatic marker is present, the current state is "thinking about," not "feeling." | Subject is currently experiencing the emotion. The object is temporally distant, but the evaluative stance is occurrent. |
  | **6. Fictional Objects**<br>*(How do we feel for what we know isn't real?)* | The body reacts to the simulation regardless of belief. The feeling is real; the object is imagined. | The subject makes a "quasi-judgment" or entertains a thought without belief. The emotion is real, directed at the fictional content. | **Verbal.** Both agree the experience is real; disagree on the cognitive/bodily mechanism. | **Fiction and Music**<br>(Moved by film/music known to be non-real/non-representational.) | Physiological response is the primary fact. The "paradox" is only cognitive. | Evaluative engagement is the primary fact. The "paradox" is only somatic (why no flight response?). |

  ## SECTION III: META-THEORETICAL NOTE (THE PERCEPTUAL OPTION)
  *Addressing the question of whether "Emotion as Perception of Value" constitutes a third camp.*

  Both parties acknowledge the existence of a "Perceptual Theory of Emotion" (the claim that emotions are perceptions of value, analogous to sensory perception). We clarify our relation to this view as follows:

  1.  **Priya's Position:** Priya's "Construal" view is functionally equivalent to the Perceptual view *if* "construal" is defined as a non-judgmental, passive registration of value. However, Priya maintains that emotions are subject to rational critique in a way sensory perceptions are not (one can be reasoned out of an emotion more easily than out of a visual illusion). Therefore, Priya classifies her view as **Evaluative-Construal**, distinct from pure Perception.
  2.  **Marco's Position:** Marco maintains that emotions *are* perceptions, but perceptions of **internal bodily states**, not external value. He rejects the "Perception of Value" model as a metaphor that obscures the somatic mechanism.
  3.  **Resolution of the "Third Camp" Question:** The dispute is not merely a fight over which of three things deserves the name "emotion."
      *   **What is Verbal:** If Priya defines "Judgment" loosely (as "taking to be the case") and Marco defines "Bodily Feeling" loosely (as "somatic marker"), they may be describing the same integrated process using different focal points.
      *   **What is Substantive:** The substantive remainder is **causal priority and necessity**.
          *   If the Denervated Subject (Case 1) feels nothing, Marco is right: Somatic feedback is necessary.
          *   If the Denervated Subject feels fear, Priya is right: Evaluative processing is sufficient.
          *   The "Perception of Value" model does not escape this test. It must still specify whether the "perception" requires a bodily medium. If it does, it collapses into Marco's view. If it does not, it collapses into Priya's view.

  ## SECTION IV: COMMITMENT
  *By signing below, the parties agree that future arguments must address the specific predictions in Section II. Restating the original position without addressing the outcome of the Bearing Cases is prohibited.*

  __________________________
  **Priya**

  __________________________
  **Marco**

  __________________________
  **Facilitator**
