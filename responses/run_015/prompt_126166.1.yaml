      *   *Check Tone:* Avoid being too abstract. This is a governance memo, not a seminar paper.
      *   *Check Clause Interpretation:* Make sure I don't just say "we ignore the clause." I need to argue that approving with conditions *is* honoring the clause, because we aren't excluding based on conclusions, but structuring based on procedural integrity.
      *   *Check Charity:* Ensure the "Reject" position isn't painted as cowardly, but as a legitimate concern for institutional continuity.

  5.  **Writing - First Pass (Mental or rough notes):**
