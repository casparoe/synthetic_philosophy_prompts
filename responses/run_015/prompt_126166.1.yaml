      *   **Core Conflict:** The proposal explores the "paradox of tolerance" (platforming arguments that reject democratic equality/committee authority). The committee charter has a "reflective non-dominance" clause (cannot exclude proposals solely because they would eliminate the committee's authority).
      *   **Constraints:**
