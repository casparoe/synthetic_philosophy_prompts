          *   Prohibitions: No requests for literature reviews, no bibliographies, no page citations, no reliance on external inaccessible sources, no reduction to legal hate speech definitions or generic diversity statements.
      *   **Tone:** Professional, academically rigorous, decisive, institutionally aware.

  2.  **Determine the Recommendation:**
      *   *Option A (Reject):* Easiest for institutional survival, but violates the "reflective non-dominance" clause directly. Requires arguing the clause is absurd or overridden by survival.
      *   *Option B (Approve Unconditionally):* Honors the clause fully, but risks the "institutional suicide" critique. Might look naive.
      *   *Option C (Approve with Conditions):* The most nuanced path. It honors the spirit of the clause (allowing the inquiry) while mitigating the risk of self-undermining by framing the series as *about* the paradox rather than a platform for *enacting* the abolition of the committee.
      *   *Decision:* **Approve with Conditions.** This allows for the philosophical inquiry (respecting the charter) while establishing boundaries that prevent the series from becoming a performative contradiction that dissolves the committee's legitimacy prematurely. It turns the series into a case study rather than a weapon.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
