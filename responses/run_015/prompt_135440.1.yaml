  Dear David, I was running the shared monitor case we discussed, wiring two subjects into a single higher-order mechanism that tokens a representation to the effect that someone is in pain now whenever either subject sustains tissue damage. When the first subject stubbed her toe, the mechanism fired, and since both subjects stood in the right relation to that higher-order representation, the theory implies both are now consciously in pain. I asked the second subject where it hurt, and he pointed to the first subject's foot, insisting the pain was his even though his nociceptors were silent, which forces you to say either that consciousness can float free of the body it is about or that the higher-order state is misrepresenting his own state as painful. He then asked for the morphine, and when I refused on the grounds that his body was intact, he accused me of denying his phenomenology, leaving me trapped between conceding that two subjects can share a single qualitative state or admitting that the higher-order representation lacks the resources to explain why consciousness feels like it belongs to someone in particular. This punchline turns on the theory's commitment that the higher-order representation alone confers consciousness regardless of the accuracy of its target, which collapses when the representation is accurate about one subject but tokened in another. It exposes the inability of the mechanism to account for the first-personal character of experience without presupposing the very ownership it is meant to explain. Ultimately, the joke highlights the dilemma of assigning phenomenological ownership when the higher-order mechanism cannot distinguish between subjects.
