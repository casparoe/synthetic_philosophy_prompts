  | # | objection | who raises it, in their idiom | likelihood (H/M/L) | damage if unanswered (1-5) | my ~90-second reply | weakest link in that reply | hold or concede, and what exactly to concede |
  |---|---|---|---|---|---|---|---|
  | 1 | "Isn't this just Global Workspace Theory with extra steps? You say 'availability,' they say 'broadcasting.' Where's the empirical dissociation?" | Lead empirical researcher (GWT sympathizer). "If your meta-state is just tracking availability for use, that's exactly what the workspace does. Are you predicting dissociations between workspace ignition and your meta-state?" | H | 5 | "GWT describes the *causal* role of broadcasting; I'm describing the *constitutive* nature of the phenomenal state. Ignition is necessary for my meta-state, but the consciousness *is* the tracking relation, not the broadcast itself. Empirically, look for cases where information is broadcast for action (type-2 performance) but lacks the specific 'holdable' quality my meta-state requires." | Hard to specify a task where information is broadcast for use but not "holdable." Sounds like semantic splitting. | **Concede:** Admit substantial overlap in neural predictions. **Hold:** Insist the *definition* of consciousness differs (constitutive vs. causal), which matters for edge cases (dreams, masks). |
  | 2 | "You're telling me I wasn't conscious during the dream? That contradicts the phenomenology itself." | Everyone, but led by the Disjunctivist. "You're privileging the waking report over the experience itself. You're saying the experience is created ex post facto." | H | 5 | "I'm distinguishing the *occurrence* of the neural state from the *status* of being conscious. During REM, the system is in a closed loop. The 'consciousness' is the availability of that content to the waking cognitive system. It explains why dream amnesia erases the experience entirely—no uptake, no consciousness." | Sounds like gaslighting. Implies consciousness is a property of memory, not experience. | **Concede:** Admit this revises the folk concept of "experience." **Hold:** Argue it solves the problem of dream amnesia and aligns with the lack of prefrontal control during REM. |
  | 3 | "If the meta-state piggybacks on the first-order system, how do we decode it separately? You've made your theory untestable." | Cognitive neuroscientist (decoding/ML). "If the format is identical and the locus is shared, your meta-state is epiphenomenal or invisible to fMRI/EEG." | M | 4 | "It's not invisible; it's recurrent. You're looking for feedforward signatures. I predict specific feedback signatures from metacognitive regions (anterior PFC) to sensory cortex that correlate with confidence ratings, not just performance. The 'piggyback' is the reuse of sensory codes, not the absence of a distinct signal." | "Distinct signal" contradicts "piggyback/inherits format." Risks collapsing into standard metacognition models. | **Hold:** Insist on temporal resolution (MEG/EEG) over spatial. **Concede:** Admit current fMRI may not distinguish first-order from meta-state if formats are identical. |
  | 4 | "No-report paradigms show consciousness without metacognition. Your view requires a meta-state. Are you denying no-report findings?" | Empirical researcher (no-report proponent). "We see signatures of consciousness in animals/infants without evidence of higher-order monitoring. Your view implies they aren't conscious." | M | 4 | "My meta-state is non-conceptual and action-guiding, not a reportative judgment. A creature can track availability for action without generating a verbal report. However, if there is *no* monitoring mechanism at all, I do deny consciousness. I prioritize the mechanism over the intuition that 'simple' creatures are conscious." | Alienates the majority of the room who assume animals are conscious. High philosophical cost. | **Concede:** Admit this is a controversial implication. **Hold:** Define "consciousness" strictly as requiring availability-tracking, even if it excludes some animals. |
  | 5 | "Why posit two states? If the first-order state can represent itself, you're violating parsimony. What work is the second state doing?" | Self-representationalist Philosopher. "Intrinsic representation is ontologically cheaper. You're doubling states without doubling explanatory power." | L | 3 | "Self-representation struggles with error. A state cannot misrepresent itself easily. My two-state view explains hallucinations and dream errors: the first-order state exists, but the meta-state mistracks its availability. Parsimony matters less than explanatory scope." | Self-rep theorists have replies to error cases. Doesn't fully kill the objection. | **Hold:** Stand firm on the error argument. This is your strongest philosophical foothold against Self-Rep. |
  | 6 | "You're explaining how we know about experience, not experience itself. You've changed the subject." | Disjunctivist/Naive Realist. "Availability is epistemic. Phenomenality is ontological. You've given a theory of access, not consciousness." | L | 3 | "I'm denying the epistemic/ontological split. The 'what it is like' just *is* the system registering its own access. If you remove the availability tracking, there's nothing left to be 'ontologically' present. The feeling of presence is the tracking." | They will reject the premise. You are talking past each other. | **Concede:** Acknowledge this is a fundamental framing disagreement. **Hold:** Refuse to accept their definition of "phenomenality" as pre-theoretical. |
  | 7 | "If retrospective endorsement makes dreams conscious, why doesn't it make subliminal primes conscious? I remember a prime later—was it conscious?" | You (anticipating your own fear), or sharp Empiricist. "This collapses into a memory theory. If recall confers consciousness, then any remembered subliminal event becomes conscious." | M | 5 | "Because the subliminal prime never achieved the 'availability' status in the window. The memory is of the *effect*, not the *availability*. Dreams have rich sensory content that *was* available internally, just not to the waking system. Subliminal primes lack the sensory richness to be tracked." | Risky. If I can remember the content of the prime, why wasn't it "available"? Distinction is fuzzy. | **Concede:** Admit the boundary case is tricky. **Hold:** Insist on the *sensory richness* requirement for the first-order state to be trackable. |
  | 8 | "You haven't touched the explanatory gap. Why does availability tracking feel like anything?" | Explanatory Gap Philosopher. "You've described the function. You haven't explained the qualia." | L | 2 | "I'm a deflationist. I'm not trying to explain why red feels like red independent of the system. I'm explaining what constitutes the state *as* conscious. The 'feel' is the operational mode of the tracking. If you want a further explanation, you're asking for magic." | Dismissive. Might annoy the philosopher who feels their core concern is ignored. | **Hold:** Stand firm on deflationism. Don't try to solve the hard problem. |
  | 9 | "Does your view predict dissociations between metacognitive sensitivity (type-2 d') and consciousness?" | Empirical researcher (SDT expert). "If consciousness is the meta-state, should meta-d' always match conscious report? What about blindsight?" | M | 4 | "Yes, generally. But because my meta-state is non-conceptual, it can exist without full verbal report. Blindsight patients lack the availability tracking despite some residual processing. I predict meta-d' will correlate better with my definition than simple report does." | Blindsight is messy. Some argue there is residual consciousness. | **Hold:** Predict correlation but allow for non-verbal meta-states. |

