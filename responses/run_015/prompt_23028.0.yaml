      *   *Round-by-Round Analysis:* Break down the specific claims made in the prompt. Use decision theory terminology (time inconsistency, hyperbolic discounting, state-dependence) but keep it readable.
      *   *The Verdict:* Avoid declaring a single winner. Frame it as "Right about Mechanism" vs. "Right about Context."
