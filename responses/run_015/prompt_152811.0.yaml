  My case: the display in the lab says the chance this atom decays in the hour is 0.5, and that's exactly right as a lab-wide figure — half of all runs in that lab do decay in the hour. Then I learn two more things. First, there are no setups with a true single-case chance of 0.5: a setup is either hot (true chance 0.9) or cold (true chance 0.1), the prep produces each kind half the time, so the 0.5 is only the population average. Second, the only reason I'm watching this particular run is that the software puts a run on the watch-list only if the atom is still intact after a ten-second preliminary check: hot atoms pass that check with chance 0.1, cold ones with chance 0.9, and once you condition on which kind of setup it is, passing the check tells you nothing more about whether it decays in the hour. My own arithmetic says that makes it 0.18 — the expectation of the true single-case chance given that I'm watching it at all, which comes out the same as just doing the Bayesian update on the check.

