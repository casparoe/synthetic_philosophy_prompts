answer: |-
  To solve the heterogeneity objection, a theory of pleasure must provide a **unity condition**: an account of what makes the warm bath, the solved proof, and the morphine injection instances of the *same natural kind* (or functional kind), without denying their obvious differences. If the theory fails to find unity, hedonism collapses into a list of unrelated goods. If it forces unity by ignoring differences, it becomes phenomenologically inaccurate.

  Below are the desiderata for an adequate theory of pleasure, categorized by domain. I have flagged which are **Non-Negotiable** (required for any plausible hedonism) and which are **Parochial** (specific to certain philosophical traditions or empirical hypotheses).

  ### I. Phenomenological Desiderata
  *What the theory must say about the subjective experience.*

  **1. Accommodation of Phenomenal Diversity**
  *   **Requirement:** The theory must acknowledge that the *qualitative character* of eating chocolate differs from solving a math problem. It cannot posit a single, uniform "pleasure sensation" (like a specific tingle or glow) that is present in all cases.
  *   **Motivation:** Introspection reveals no common "pleasure atom." If a theory insists on one, it is falsified by the experience of "cold" pleasures (e.g., the satisfaction of a duty) or diffuse pleasures (e.g., mood elevation).
  *   **Status:** **Non-Negotiable.**

  **2. Positive Valence (The "Glow")**
  *   **Requirement:** Despite diversity, all instances must share a positive affective tone. They must be experienced as *good* or *to-be-pursued* in the moment of experience.
  *   **Motivation:** Without positive valence, the distinction between pleasure and neutral or negative states vanishes. This is the core intuition hedonism seeks to capture.
  *   **Status:** **Non-Negotiable.**

  **3. Intentionality (Object-Directedness)**
  *   **Requirement:** The theory must explain whether pleasure is a raw feel (non-intentional) or an attitude toward an object/state of affairs (intentional). It must accommodate pleasures that seem to require an object (pride in a child) and those that seem objectless (free-floating euphoria).
  *   **Motivation:** Intellectual and aesthetic pleasures seem to depend on *what* they are about. A theory that treats pleasure as merely a sensation struggles to explain why misunderstanding a joke kills the pleasure.
  *   **Status:** **Non-Negotiable** (though the specific resolution is debated).

  **4. Temporal Profiles (Anticipation, Relief, Flow)**
  *   **Requirement:** The theory must account for pleasures that are not "in the moment" consummations.
      *   *Anticipation:* Enjoying the thought of a future event.
      *   *Relief:* Enjoying the cessation of pain (negative pleasure).
      *   *Flow:* Enjoyment found in absorption where self-consciousness vanishes.
  *   **Motivation:** If pleasure is only a present sensation, anticipation and relief become paradoxical. Flow states challenge the idea that pleasure requires conscious monitoring of a "good feel."
  *   **Status:** **Non-Negotiable.**

  ### II. Conceptual & Normative Distinctions
  *What the theory must distinguish pleasure from.*

  **5. Independence from Desire (The "Wanting vs. Liking" Constraint)**
  *   **Requirement:** The theory must distinguish *taking pleasure in X* from *desiring X*. It must allow for:
      *   *Undesired Pleasure:* Being pleasantly surprised (enjoying something you didn't know you wanted).
      *   *Unenjoyed Desire:* Craving a cigarette while hating the taste (addiction).
  *   **Motivation:** If pleasure is defined as "satisfaction of desire," hedonism collapses into Desire Satisfactionism, and the heterogeneity objection returns for "desire." Furthermore, neuroscience distinguishes "liking" (opioid systems) from "wanting" (dopamine systems).
  *   **Status:** **Non-Negotiable.**

  **6. Pleasure vs. Absence of Pain**
  *   **Requirement:** The theory must distinguish the presence of a positive state from the mere removal of a negative one.
  *   **Motivation:** Bentham treated them as symmetrical on a single scale. However, the phenomenology of relief (pain stopping) feels different from the phenomenology of joy (gain). A theory that conflates them risks implying that the best life is one of minimal pain (the "oyster" objection) rather than positive engagement.
  *   **Status:** **Non-Negotiable** (for robust hedonism), though some negative utilitarians dispute this.

  **7. Occurrent vs. Dispositional Enjoyment**
  *   **Requirement:** The theory must distinguish between currently experiencing pleasure and being disposed to enjoy something (e.g., "I enjoy jazz" while sleeping).
  *   **Motivation:** Well-being is usually tied to *experienced* states. If dispositional enjoyment counts as intrinsic good, a comatose patient with satisfied dispositions would be flourishing, which contradicts the experiential core of hedonism.
  *   **Status:** **Non-Negotiable.**

  **8. Higher-Order Pleasures (Quality vs. Quantity)**
  *   **Requirement:** The theory should ideally explain why some pleasures seem "nobler" or more valuable than others, independent of intensity/duration (Mill's distinction).
  *   **Motivation:** Intuitively, the pleasures of the intellect seem to contribute more to well-being than base sensory pleasures, even if less intense.
  *   **Status:** **Parochial.** (Classical Benthamites reject this; Millians require it. A theory can solve heterogeneity without accepting qualitative hierarchy, but it loses explanatory power regarding human choice).

  ### III. Empirical Constraints
  *What the theory must respect from science.*

  **9. Neuroscience of Reward (Liking Systems)**
  *   **Requirement:** Consistency with the separation of hedonic hotspots (nucleus accumbens, ventral pallidum) involved in "liking" versus the broader dopaminergic system involved in "learning" and "wanting."
  *   **Motivation:** A theory of pleasure that equates pleasure with dopamine release is empirically false (dopamine tracks prediction error and motivation, not necessarily enjoyment).
  *   **Status:** **Non-Negotiable** (given current science).

  **10. Cognitive Penetrability**
  *   **Requirement:** The theory must accommodate the fact that beliefs change pleasure. (Learning the wine is cheap reduces the pleasure; learning the joke is cruel kills the laughter).
  *   **Motivation:** Purely sensory theories (felt-quality) struggle here. If pleasure were just a sensory input, cognitive context shouldn't alter the *pleasure* itself, only the judgment of it. But the pleasure itself seems to vanish.
  *   **Status:** **Non-Negotiable.**

  **11. Intensity/Duration Trade-offs**
  *   **Requirement:** The theory must allow for a metric (or at least a ranking) that permits comparison across heterogeneous types.
  *   **Motivation:** For hedonism to be action-guiding, one must be able to say "Proof A yielded more well-being than Bath B." If the heterogeneity is too radical, they become incommensurable, breaking the hedonic calculus.
  *   **Status:** **Non-Negotiable** (for hedonism as a normative theory).

  ---

  ### IV. Tensions and Incompatibilities
  *Where the desiderata pull against each other.*

  **1. The Phenomenal Unity vs. Cognitive Penetrability Tension**
  *   **Tension:** To solve heterogeneity, **Felt-Quality Theories** posit a common phenomenal tone (satisfying Desideratum #2). However, if pleasure is a distinct "feel," it is hard to explain how a belief (e.g., "this wine is vinegar") eliminates the feel without changing the sensory input. **Attitudinal Theories** (pleasure = pro-attitude) handle cognitive penetrability well but struggle to identify a common phenomenal "glow" (Desideratum #2), risking the charge that "pleasure" is just a label for "desiring to continue."
  *   **Risk:** You can have phenomenal unity or cognitive flexibility, but securing both is difficult.

  **2. The Measurement vs. Diversity Tension**
  *   **Tension:** Desideratum #11 requires commensurability (a single scale of value). Desideratum #1 acknowledges radical diversity. If the pleasure of morphine and the pleasure of proof are phenomenologically and functionally distinct, *what is the common currency* being measured?
  *   **Risk:** If the common currency is just "whatever is pursued," the theory is vacuous (Desideratum #5 violated). If the common currency is a specific sensation, it excludes intellectual pleasures (Desideratum #1 violated).

  **3. The Flow State vs. Consciousness Tension**
  *   **Tension:** Flow states (Desideratum #4) are often described as lacking self-conscious monitoring. Yet, hedonism traditionally requires conscious experience for well-being. If you are "lost in the music," are you experiencing pleasure? If yes, how do you measure it if you aren't monitoring it? If no, we exclude some of life's best moments.
  *   **Risk:** A theory that requires conscious monitoring of pleasure excludes flow. A theory that includes flow risks including unconscious states, blurring the line between occurrent and dispositional (Desideratum #7).

  ---

  ### V. Brief Survey of Approaches Against Desiderata

  | Approach | Core Claim | Strengths | Weaknesses (Relative to Desiderata) |
  | :--- | :--- | :--- | :--- |
  | **Felt-Quality Theory** (Bentham, Sidgwick) | Pleasure is a distinct, uniform sensation or "tone" accompanying experiences. | Secures **Phenomenal Unity** (#2) and **Valence** (#2). Intuitively simple. | Fails **Phenomenal Diversity** (#1) and **Cognitive Penetrability** (#10). Struggles with **Flow** (#4) where no distinct sensation is monitored. |
  | **Attitudinal Theory** (Feldman, Heathwood) | Pleasure is a pro-attitude (being pleased *that* p) toward a state of affairs. | Handles **Cognitive Penetrability** (#10) and **Intentionality** (#3) well. Distinguishes **Desire vs. Pleasure** (#5) effectively. | Struggles with **Phenomenal Unity** (#2). Risks vacuity: is "being pleased" just "desiring to continue"? May fail **Empirical Constraints** (#9) regarding raw affect. |
  | **Functionalism / Motivational** (Schroeder, simple psychological accounts) | Pleasure is defined by its role: it is what we seek to sustain/avoid losing. | Handles **Diversity** (#1) by ignoring phenomenology. Good fit with **Behavioral Data**. | High risk of **Vacuity** (Desideratum #5). Collapses into Desire Satisfactionism. Fails to distinguish **Pleasure vs. Desire** (#5) robustly. |
  | **Hybrid / Perceptual** (Tye, Bain) | Pleasure is an experience that represents something as good (imperative content). | Attempts to bridge **Phenomenology** (#2) and **Intentionality** (#3). Explains **Motivation** naturally. | Complex. Still faces **Heterogeneity** regarding *how* different representations share the "good" content. |

  ### Summary for Evaluation
  To evaluate a specific hedonistic theory, ask:
  1.  **Does it name a common property?** (If no, it fails to solve heterogeneity).
  2.  **Is that property present in a warm bath AND a solved proof?** (If no, it is too narrow).
  3.  **Is that property distinct from "getting what I want"?** (If no, it is vacuous).
  4.  **Does it allow for measurement across types?** (If no, it cannot guide action).

  The "Goldilocks" zone is narrow: The theory must be abstract enough to cover the proof and the bath, but concrete enough to distinguish pleasure from mere desire-satisfaction. Most failures occur by sliding too far toward abstraction (becoming functionalist/vacuous) or too far toward concreteness (becoming sensationalist/exclusionary).
