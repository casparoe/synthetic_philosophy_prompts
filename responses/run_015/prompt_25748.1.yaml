  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Phenomenal Diversity.* The theory must acknowledge that pleasures feel different. It can't just say "they all feel like a tingle."
      *   *Requirement 2: Commonality.* Despite diversity, there must be *something* common, otherwise "pleasure" is just a word.
      *   *Requirement 3: Desire Independence.* Crucial. If pleasure = satisfaction of desire, hedonism collapses into desire satisfactionism. Need to separate the *feeling* from the *getting what you want*. (Example: Masochist desires pain but doesn't enjoy the pain *qua* pain? Or surprise pleasures).
      *   *Requirement 4: Valence.* Pleasure must be positively valenced. It must *feel good*.
      *   *Requirement 5: Temporal Profiles.* Anticipation vs. Consummation vs. Relief vs. Memory. A theory needs to handle these time-relations.
