  # The Madness & Medicine Sorting Tree
  *(Photocopy this side)*

  **Instructions:** Start at Box 1. Answer the question based on your intuition about the case described. Follow the arrow to the next box. At the bottom, circle your position.

  | **BOX 1: The Autopsy Test** | **BOX 2: The Hidden Lesion** | **BOX 3: The Design Test** |
  | :--- | :--- | :--- |
  | **Case 1 (Degreaser):** A worker has white-matter damage and apathy.<br>Is the visible bodily damage *sufficient* to call this a medical disease? | **Case 2 (Syphilis):** Asylum patients had grandiosity before the bacteria were found.<br>Was their madness a "myth" *before* the lesion was discovered? | **Case 5 (Teens):** Can play games for 9 hours but not sit in class.<br>Is this a failing mechanism (dysfunction), or just a mismatch with school? |
  | **YES** → Go to Box 4 | **YES** → Go to Box 4 | **YES** → Go to Box 5 |
  | **NO** → Go to Box 2 | **NO** → Go to Box 3 | **NO** → Go to Box 6 |

  | **BOX 4: The Neuro-Excuse** | **BOX 5: The Exit Test** | **BOX 6: The Meaning Test** |
  | :--- | :--- | :--- |
  | **Case 7 (Offender):** Violent assault; average amygdala volume for his group, but no specific scan finding.<br>Does the statistical brain data make the act a *symptom* rather than a crime? | **Case 4 (Longshoremen):** Conviction they are only fit for loading work. If the port reopens, they work again.<br>Does changing the situation *dissolve* the condition? | **Case 3 (Widow):** Hears husband's voice, can't sleep, 6 months post-death.<br>Is this distress *intelligible* given the loss, or a disorder? |
  | **YES** → Go to Box 7 | **YES** → Go to Box 8 | **YES** (Intelligible) → Go to Box 8 |
  | **NO** → Go to Box 7 | **NO** → Go to Box 7 | **NO** (Disorder) → Go to Box 5 |

  | **BOX 7: The Utility Test** | **BOX 8: The Autonomy Test** | **BOX 9: The Coercion Test** |
  | :--- | :--- | :--- |
  | **Case 6 (Online):** Syndrome spreads by description; diagnosis gets housing/payment.<br>Is the category primarily a *tool for resources*? | **Case 8 (Anorexia):** Starving, articulate, refuses treatment.<br>Is her refusal a *symptom* of illness or a valid choice? | **General Principle:** Regardless of the answers above:<br>Does having the label "Mental Illness" license holding someone *against their will*? |
  | **YES** → Go to Box 9 | **YES** (Symptom) → Go to Box 9 | **YES** → **See Leaves A, B, C** |
  | **NO** → Go to Box 8 | **NO** (Choice) → Go to Box 9 | **NO** → **See Leaves D, E, F** |

  ***

  ### THE LEAVES (Circle your outcome)

  *   **A. Eliminativist:** (Path: Lesion + Neuro-Excuse + Coercion) It's all neurology eventually; treat the brain, manage the risk.
  *   **B. Harmful-Dysfunction:** (Path: Dysfunction + Coercion) Mechanism failure is real, even without a lesion; intervention justified.
  *   **C. Useful-Fiction:** (Path: No Lesion + Utility + Coercion) It's not a disease, but the label unlocks care/safety we need.
  *   **D. Hard Szaszian:** (Path: No Lesion + No Coercion) Disease requires a lesion; everything else is problems in living; no coercion.
  *   **E. Meaningful-Suffering:** (Path: Intelligible + No Coercion) The pain is real, but it is a reaction to life, not an illness.
  *   **F. Pluralist:** (Path: Mixed Answers + No Coercion) Different cases require different theories; reject one-size-fits-all coercion.
  *   **G. Labelling/Deviance:** (Path: Exit Test + No Coercion) The "illness" is just a name for behavior that breaks social rules.
  *   **H. Intelligible-and-Still-Illness:** (Path: Disorder + No Coercion) Grief can be a disorder, but that doesn't mean you force treatment.

  ***

  # Facilitator's Notes & Logical Map
  *(Keep this separate)*

  ### 1. The Coercion Split (Critical Constraint)
  You asked to separate the **Szaszian Metaphysician** (no disease) who supports sectioning from the **Realist Metaphysician** (real disease) who opposes it.
  *   **How the Tree handles it:** Box 9 (Coercion Test) is the final gatekeeper. It overrides the metaphysical path.
      *   **Szaszian + Pro-Coercion:** Likely lands on **Useful-Fiction (C)**. They admit it's not a "disease" (Box 1/2 No) but keep the label to license care.
      *   **Realist + Anti-Coercion:** Likely lands on **Pluralist (F)** or **Intelligible-and-Still-Illness (H)**. They admit the pathology but reject the automatic license to coerce.
  *   **Limitation:** If a student answers "Real Disease" *and* "No Coercion," the tree pushes them to **Pluralist**. This is a "soft" landing. A pure "Libertarian Naturalist" leaf doesn't exist in your requested list. *Note to group: If you land on Pluralist because you believe in brain disease but hate the Mental Health Act, state that explicitly.*

  ### 2. Empty Logical Space (Marked on Diagram Logic)
  There are combinations of answers the tree makes difficult to reach because they are philosophically unstable.
  *   **"The Neuro-Punishment" Space:** (Lesion Found + Punish Harder).
      *   *Status:* **Unattractive.** If Case 7 (Offender) has a brain lesion, calling it a "disease" usually *excuses* responsibility. Using a lesion to *aggravate* sentencing is biologically deterministic but morally punitive. Rarely held consistently.
  *   **"The Bare Disease" Space:** (No Lesion + No Dysfunction + No Distress + Still a Disease).
      *   *Status:* **Incoherent.** Without a lesion (Bodily), dysfunction (Design), or distress (Experience), the term "disease" has no referent. If someone claims this, they are likely using "disease" as a synonym for "statistical rarity."

  ### 3. Indistinguishable Leaves
  Two pairs of leaves are hard to separate using *only* these eight cases.
  *   **Hard Szaszian (D) vs. Labelling/Deviance (G):**
      *   *Why:* Both deny disease status based on social/bodily grounds. Case 4 (Longshoremen) pushes toward Labelling (social rule breaking), while Case 1 (Degreaser) pushes toward Szasz (bodily requirement). Without a specific question about *power structures* vs. *individual responsibility*, students may conflate "Myth" (Szasz) with "Construct" (Labelling).
  *   **Harmful-Dysfunction (B) vs. Eliminativist (A):**
      *   *Why:* Both accept the medical model. Case 5 (Teens) tests Dysfunction; Case 7 (Offender) tests Neurology. In practice, if a student believes in Dysfunction, they usually believe it *is* neurology we haven't found yet. The cases do not force a split between "Functional failure is real now" vs. "Functional failure is just unknown physics."

  ### 4. Case Usage Guide
  *   **Cases 1 & 2 (Degreaser/Syphilis):** Anchor the "Bodily Lesion" criterion. If they say No to both, they are on the Szaszian track.
  *   **Cases 5 & 7 (Teens/Offender):** Test the "Design/Dysfunction" criterion. Crucial for separating Szaszians from Naturalists when no lesion is visible.
  *   **Cases 3 & 4 (Widow/Longshoremen):** Test the "Exit/Context" criterion. Crucial for separating Naturalists from Labelling/Meaningful Suffering views.
  *   **Case 6 (Online):** Tests Pragmatism. Essential for reaching the "Useful Fiction" leaf.
  *   **Case 8 (Anorexia):** Tests Autonomy. Essential for the Coercion split.

  ### 5. Running the Session
  1.  **Hand out the Tree:** Give them 5 minutes to trace their path silently.
  2.  **The "Box 9" Check:** Before revealing leaves, ask for a show of hands on Box 9 (Coercion). This visually splits the room before they see the labels.
  3.  **The "Pluralist" Trap:** Watch for students who answer differently for Case 1 (Yes, disease) and Case 3 (No, not disease). This is the correct path to **Pluralist**. If they try to force consistency (e.g., "Grief *must* be a disease because Dementia is"), challenge them on the Exit Test.
  4.  **The Szaszian Undergrad:** If the philosophy undergrad lands on **Hard Szaszian**, ask them about Box 9. If they say "Yes" to coercion, redirect them to **Useful Fiction**. This forces them to admit their pragmatism contradicts their metaphysics.
