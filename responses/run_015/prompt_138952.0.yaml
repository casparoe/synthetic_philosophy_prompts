          *   *What was needed:* A realist reply usually involves: (1) Denying global UTE (this is only local/current), (2) Appeal to theoretical virtues (simplicity, A is simpler than B), (3) Inference to the Best Explanation (A explains the data with fewer ad-hoc assumptions), or (4) Future distinguishability (just because we can't tell now doesn't mean we never will).
