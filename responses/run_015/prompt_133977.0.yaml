answer: |-
  Friends, family, colleagues, and students.

  Thank you for being here. We are gathered to mark the absence of a woman who cared deeply, above almost all else, for the integrity of what we say.

  To speak about someone who has died is to walk a tightrope. We want to offer comfort, but we also want to offer truth. For most of you, that balance is a matter of instinct. For her, it was a matter of principle. She spent her life teaching us that there is a profound difference between a statement of fact and an expression of feeling. Both are human. Both are real. But they do different work.

  She taught us that when we say, "She is in a better place," or "She is watching over us," we are not stating facts that can be checked or verified. We are not describing a location she has traveled to, or a vantage point she now occupies. To claim otherwise would be to speak in a way she could not recognize. She believed that the boundaries of language are the boundaries of our shared world. When we cross them, we are not expanding the truth; we are leaving it behind.

  I know that for some of you, this might sound cold. It might sound like I am stripping away the usual comforts of a memorial. But I am not here to strip away comfort. I am here to offer you the comfort she valued: the comfort of clarity.

  She did not believe that because a claim cannot be verified, the feeling behind it is fake. Quite the opposite. She spent her career arguing that when A.J. Ayer wrote of his near-death experience, he was not describing a metaphysical reality. He was describing a profound emotional event. He was mapping the landscape of his own consciousness, not the geography of the universe.

  In that same spirit, I want to say something about our grief.

  We cannot verify where she is. To try to do so would be to violate the very intellectual honesty she modeled for us. But we can verify what she did. We can verify the papers she wrote, the students she guided, the arguments she sharpened, and the kindness she showed. Those are facts. They are in the world. They remain.

  And we can verify what we are feeling right now. The ache in this room is not a metaphysical claim. It is a phenomenological reality. It is data. The pain you feel is the exact measure of the value she held in your life. If the bond were illusory, the loss would not hurt this much. The grief is the proof of the love.

  She taught us that we do not need to invent a supernatural continuation to justify the significance of a life. The significance is in the verification. It is in the way her mind changed yours. It is in the way you catch yourself thinking, "What would she say about this?" and hearing her voice in your head. That is not a ghost. That is the enduring causal impact of a powerful intellect on the people it touched.

  There is a temptation, in moments like this, to blur the line between how much we miss her and where we imagine she has gone. She resisted that blur. She believed that we honor the dead not by pretending they are somewhere else, but by acknowledging fully that they are no longer here. To pretend otherwise is to diminish the reality of the death, and by extension, the reality of the life.

  So, I will not tell you she is at peace, because I cannot verify her state. I will not tell you she is looking down, because I cannot verify her sight.

  Instead, I will tell you this: She is present in the precision of our thoughts. She is present in the honesty of this gathering. She is present in the silence we share when words run out.

  She showed us that we can face the end without flinching, and without fabricating a safety net that isn't there. That is a terrifying gift, but it is also a liberating one. It means that the only thing that matters is what we do with the time we can verify. It means that the love we feel for her is not a bridge to another world, but an anchor in this one.

  We cannot say goodbye to her soul, because she taught us we do not know what that word verifies. But we can say goodbye to her influence, and promise to carry it forward. We can acknowledge the silence she has left, and fill it with the work she started.

  She is not elsewhere. She is here, in the truth we are brave enough to speak, and in the grief we are honest enough to feel. And that, in the end, is enough.
