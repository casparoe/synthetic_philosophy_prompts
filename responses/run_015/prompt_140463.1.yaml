answer: |-
  ### Dennett's Taxonomy: Where Does the Testing Happen?

  **Dimension:** *Percentage of testing/filtering occurring outside the creature's head (0 = entirely internal; 100 = entirely environmental).*

  *   **Darwinian Creatures: 100**
      *   Blind variation is generated genetically, and the environment exclusively weeds out the unfit via death or reproductive failure.
  *   **Skinnerian Creatures: 85**
      *   Actions are generated behaviorally, and the environment still selects outcomes via real-world reinforcement or punishment within a lifetime.
  *   **Popperian Creatures: 15**
      *   The creature internalizes the environment to simulate consequences, allowing hypotheses to die instead of the organism.
  *   **Gregorian Creatures: 60**
      *   Testing is exported back into the world via tools, language, and artefacts, making the environment (or other minds) the screening ground again.

  **Tiers and Swaps**
  *   **Tier 1 (External Filtering):** Darwinian and Skinnerian.
  *   **Tier 2 (Internal/Offloaded Filtering):** Popperian and Gregorian.
  *   **Swap Candidate:** Darwinian and Skinnerian are close enough to swap; both rely on real-world consequences rather than internal simulation, differing mainly in timescale (generations vs. lifetime).

  **The Zig-Zag**
  This taxonomy is **not a ladder** of increasing internalization. It is a zig-zag: testing moves from the world (Darwinian) to the head (Popperian) and back out to the shared world (Gregorian). Gregorian creatures score higher than Popperian ones on this scale because writing, diagrams, and speech externalize the testing process onto paper or into the public sphere.

  **The Feral Gregorian**
  If a Gregorian creature is reared without culture, language, or tools, its score drops from **60 to ~15**. This demonstrates that the score belongs to the **creature-plus-niche system**, not the biological hardware alone; without the "equipment" of culture, a human reverts to Popperian limits.

  ***

  ### Dimension 2: Who Bears the Cost of Failure?

  **Dimension:** *Percentage of the failure cost paid by the individual organism (0 = no personal cost; 100 = death/extinction).*

  *   **Darwinian: 100** (The organism or gene line is eliminated.)
  *   **Skinnerian: 90** (The organism suffers pain, hunger, or lost opportunity.)
  *   **Popperian: 20** (The organism pays only the metabolic cost of thinking.)
  *   **Gregorian: 5** (The organism can learn from others' failures, distributing or deferring the cost.)

  **Does the Ordering Change?**
  **Yes.** On the *Location* scale, Gregorian (60) is more external than Popperian (15). On the *Cost* scale, Gregorian (5) is safer than Popperian (20). While Popperians save themselves by testing internally, Gregorians save themselves by letting **others** test externally. This distinction prevents students from conflating *where* a thought happens with *who* pays for it.
