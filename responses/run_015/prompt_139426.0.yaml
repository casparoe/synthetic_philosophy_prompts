answer: |-
  This is a classic problem in Science and Technology Studies (STS), revisited for the algorithmic age. You are wrestling with the legacy of Langdon Winner's *Do Artifacts Have Politics?* (1980), specifically the tension between **determinism** (the thing makes us do it) and **instrumentalism** (the thing is just a tool).

  Your gut reactions are more sophisticated than the slogan because you are sensing the difference between *constitutive* politics (defining the rules of the game) and *distributive* politics (who wins the game). Your editor's "impose vs. permit" distinction is a start, but it is too binary. A better framework accounts for **friction, visibility, and reversibility.**

  Here is a principle, refined into three testable clauses, designed to match your verdicts while forcing clarity on the ambiguous ones.

  ### The Principle of Delegated Friction

  **An artifact carries politics when it encodes a human decision into a material or digital constraint that imposes a cost (friction) on a specific group, where that cost is difficult to perceive as a choice and difficult to reverse without institutional power.**

  To count as "political" under this principle, the artifact must satisfy three conditions:

  1.  **Delegation:** A question that could be settled by human judgment (e.g., "Who gets in?", "How safe is safe enough?") is settled by the design, code, or maintenance state of the object.
  2.  **Opacity:** The constraint presents itself as technical necessity, neutral efficiency, or inevitable neglect, rather than as a policy choice.
  3.  **Asymmetric Stickiness:** The cost of complying with or bypassing the constraint falls disproportionately on one group, and the barrier to changing the constraint is higher than the capacity of the affected group to overcome it.

  ---

  ### Applying the Principle to Your Verdicts

  Here is how this principle sorts your cases, and where it demands you change your mind.

  **1. The Long Island Overpasses (YES)**
  *   **Delegation:** Moses delegated the exclusion of buses to concrete.
  *   **Opacity:** It looks like a bridge, not a law.
  *   **Stickiness:** A bus cannot grow taller; a poor rider cannot lift the bridge.
  *   *Verdict:* **Holds.** This is the archetype.

  **2. The Restorative Justice Form (YES)**
  *   **Delegation:** Administrative friction replaces a judge's discretion.
  *   **Opacity:** It looks like bureaucracy, not a ban.
  *   **Stickiness:** Teachers lack the time to fight the form; the policy is nullified by ink.
  *   *Verdict:* **Holds.** This is crucial: *Bureaucracy is a technology.*

  **3. The Face-Recognition Lock (YES)**
  *   **Delegation:** A confidence threshold decides who is a resident.
  *   **Opacity:** Sold as an "engineering parameter," not a demographic filter.
  *   **Stickiness:** Residents cannot change their faces; vendors control the threshold.
  *   *Verdict:* **Holds.**

  **4. The Unrepaired Stairwell (YES)**
  *   **Delegation:** The decision to *withhold* maintenance allocates risk.
  *   **Opacity:** Looks like "neglect" or "budget issues," not a policy.
  *   **Stickiness:** Night-shift workers cannot fix the stairs; the Authority can but doesn't.
  *   *Verdict:* **Holds,** but requires you to expand "design" to "stewardship." The politics is in the *omission*.

  **5. The Elevator Key Fob (STRONG YES) vs. Video-Call Mute (WEAK NO)**
  *   **Comparison:** Both are defaults. But the elevator requires *permission* to proceed (high friction); the mute requires *action* to speak (low friction).
  *   **Stickiness:** You can unmute instantly; you cannot conjure a key fob.
  *   *Verdict:* **Holds.** The principle distinguishes based on the *cost of reversal*.

  **6. The Pothole App / Rent Strike (NO)**
  *   **Delegation:** The app delegated reporting, but users delegated *organizing*.
  *   **Opacity:** The tool remained transparent; the users injected the meaning.
  *   **Stickiness:** The tool did not resist the repurposing.
  *   *Verdict:* **Holds.** This confirms your suspicion: this isn't about the artifact's politics, but its **plasticity**.

  ---

  ### The Hard Truths: Verdicts You Must Abandon

  To make your principle coherent, you cannot keep your current stance on the Harvester and the Roundabout. They contradict your verdict on the Form and the Overpass.

  **1. The Mechanical Tomato Harvester (Must be YES)**
  *   **Your current view:** "Economics running through a machine."
  *   **The contradiction:** If the two-page form is political because its friction nullifies a policy, the harvester is political because its mechanical friction nullifies small growers. You have accepted that *administrative friction* is political, but *mechanical friction* is merely economic. In the built world, these are the same thing. The harvester delegated the definition of a "viable farm" to a drum speed.
  *   **The fix:** You must acknowledge that **efficiency is a political value.** The harvester didn't just harvest tomatoes; it harvested farmers. It satisfies Delegation (machine sets standard), Opacity (looks like progress), and Stickiness (small growers can't afford to adapt).

  **2. The Roundabout (Must be YES)**
  *   **Your current view:** "Political effects without being political."
  *   **The contradiction:** You say it "quietly reassigns whom the street is for." That is the definition of politics. You are hesitating because it applies to everyone, but traffic engineering is never neutral. It prioritizes flow (commuters/outsiders) over stoppage (locals/children).
  *   **The fix:** It satisfies Delegation (geometry replaces stop signs), Opacity (sold as "safety"), and Stickiness (residents cannot redraw the concrete). It is "frozen legislation" regarding right-of-way. If the Overpass is political, the Roundabout must be too.

  ---

  ### The Undecided Cases

  Using the Principle of Delegated Friction, here are the verdicts on your two lingering cases:

  **1. The Pay-at-Pump Preauthorization Hold**
  *   **Verdict: YES.**
  *   **Reasoning:** It delegates creditworthiness to a payment terminal protocol. It is opaque (labeled "security," not "liquidity test"). It is sticky (a driver with $20 in the tank and $15 in the bank is physically prevented from buying $15 of gas). It prices out the thin-balance population through a technical constraint. It is a wealth filter disguised as a fraud filter.

  **2. The 311 Learned Model for Complaint Ranking**
  *   **Verdict: YES (Strongly).**
  *   **Reasoning:** This is the modern Overpass. It delegates the allocation of public goods to a black box. It is opaque (nobody wrote the rule, nobody can read the weights). It is sticky (a resident cannot argue with a probability score). It creates a "digital stairwell" where neighborhoods with lower digital literacy or lower historical reporting rates get deprioritized. It is politics without a politician.

  ---

  ### The Pivot for Your Feature

  You ended your prompt with a profound insight: *"The repurposed app means the interesting question is not whether artifacts have politics but which ones can be argued with."*

  This is the winning angle. It moves you past the Winner thesis (which can feel deterministic) toward the Bruno Latour thesis (things are *mediators*, not just intermediaries).

  **The Narrative Arc:**
  1.  **The Hook:** The Slogan. "Design is Frozen Legislation." It feels true (Overpasses) but falls apart (Tomatoes).
  2.  **The Investigation:** You try to find the line. You realize "Intent" doesn't matter (The Form). You realize "Design" doesn't matter (The Stairwell).
  3.  **The Principle:** You land on **Delegated Friction.** Politics lives where a choice is hidden in a constraint that is hard to reverse.
  4.  **The Complication:** This makes *everything* political (Harvesters, Roundabouts). If everything is political, the word loses its bite.
  5.  **The Resolution:** The Pothole App. The measure of an artifact's politics is not just what it *does*, but how much it *resists being rewritten.*
      *   **Authoritarian Artifacts:** High friction, low plasticity (Overpass, Elevator, 311 Model). They demand obedience.
      *   **Democratic Artifacts:** Low friction, high plasticity (The Mute button, the Pothole App). They invite negotiation.

  **The Final Thesis:**
  The built world does not just "have" politics. It has **resistance.** Some artifacts are designed to settle the question of power permanently (concrete, code, bureaucracy). Others leave the question open. The struggle of modern citizenship is not just voting for laws, but identifying which artifacts have turned laws into concrete, and finding the tools to chip away at them.

  This allows you to keep your nuanced gut reactions while admitting that the Harvester and Roundabout *are* political—you just need to frame them as **uncontested politics** that we have mistaken for nature or economics.
