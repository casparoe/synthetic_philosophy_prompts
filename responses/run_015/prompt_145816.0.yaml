answer: |-
  Here is the translation of the nationalism–cosmopolitanism debate into your evolutionary game theory (EGT) framework, followed by the residue report and the structural analysis of your "modular loyalty" twist.

  ### 1. The Translations

  **Cosmopolitanism: The Global Well-Mixed Pool**
  In your vocabulary, cosmopolitanism is the hypothesis that the **interaction pool** is global and well-mixed. Moral equality translates to **strategy symmetry**: the payoff matrix $M$ is identical regardless of the partner's tag or location.
  *   **Assortative Matching:** Zero. Matching is random with respect to identity markers (borders). Assortment is permitted only based on *behavioral* history (e.g., reciprocal strategies), not *tag* history.
  *   **Exit Costs:** Zero. Agents can shift interaction partners without friction. There are no barriers to entry for any local sub-game.
  *   **Spillover Externalities:** Fully internalized across the total population. A defection in region $A$ reduces fitness in region $B$ equally to region $A$.
  *   **Commitment:** No sunk costs tied to specific locations or tags. Commitment devices are universal (e.g., global reputation systems).

  **Nationalism / Associative Claims: Local Pools with Endogenous Barriers**
  The nationalist claim that compatriots matter more translates to **tag-based assortative matching** within **local interaction pools**.
  *   **Interaction Pool:** Partitioned. Agents play primarily within a specific subset (the "nation").
  *   **Exit Costs:** High. Barriers to entering other pools (immigration costs, cultural friction) maintain the integrity of the local game.
  *   **Sunk-Cost Commitment:** Shared institutions function as **handicaps** or **bonding mechanisms**. Contributing to local public goods signals commitment to the local pool, increasing the credibility of threats/promises within that pool but not outside it.
  *   **Obligation:** Defined as the **Evolutionarily Stable Strategy (ESS)** conditional on partner tags. You cooperate with compatriots not because of intrinsic worth, but because the shadow of the future is longer within the high-assortment pool. The "special claim" is the **equilibrium premium** generated by local repeated games that cannot be sustained globally.

  **Modular Loyalty (Your Twist): Topology-Dependent Weighting**
  This position rejects partitioned pools in favor of a **weighted network graph**.
  *   **Interaction Probability:** A continuous function of topological distance (e.g., inverse path length or clustering coefficient).
  *   **Obligation Scaling:** Cooperative investment $I$ is not binary (In/Out) but scales with the **modularity coefficient $Q$** of the local cluster. High density = high investment; sparse bridge = low investment.
  *   **Boundaries:** Endogenous and soft. A "border" is merely an inflection point where interaction probability decays, not a hard wall.
  *   **Mechanism:** Cooperation is sustained by **network reciprocity**. The "obligation" to a neighbor is proportional to the probability of future re-encounter, which is determined by the structural cohesion of the subgraph they inhabit together.

  ***

  ### 2. Residue Report

  **What Maps Cleanly**
  *   **Frequency $\rightarrow$ Priority:** The philosophical intuition that "we owe more to those we interact with" maps cleanly to **discounted future payoffs**. High interaction frequency increases the shadow of the future, making cooperation an ESS.
  *   **Institutions $\rightarrow$ Commitment Devices:** The nationalist argument that shared institutions create obligations maps well to **sunk-cost signaling**. Investing in a local institution makes exit costly, thereby stabilizing cooperation within that pool.
  *   **Arbitrariness $\rightarrow$ Efficiency:** The cosmopolitan critique that borders are arbitrary maps to **efficiency losses**. If barriers prevent optimal matching or block positive-sum spillovers, the system is Pareto inefficient.

  **What Requires Fudging**
  *   **"Obligation" vs. "Stability":** This is the biggest fudge. In philosophy, "obligation" is normative (you *should* do this even if it costs you). In EGT, "obligation" is descriptive (you do this because it maximizes fitness). To translate "moral claim," you have to equate it with **"sustainable investment equilibrium."** You are smuggling in the assumption that *what is stable is what is owed*.
  *   **"Compatriot" vs. "Tag":** Philosophers argue about the moral significance of shared history/culture. In EGT, this is just a **correlated tag**. You have to fudge the *meaning* of the tag. EGT doesn't care if the tag is "fellow citizen" or "wearer of blue hats," only that it correlates with interaction probability. The *content* of the association is lost.
  *   **"Rights" vs. "Payoff Constraints":** Cosmopolitans argue strangers have *rights* to aid. In EGT, strangers only have a claim if withholding aid triggers punishment or reputational loss. If you can defect on a stranger without penalty, the model says you have no "obligation," whereas the philosopher says you do.

  **What Has No Counterpart (The Void)**
  *   **Intrinsic Worth:** EGT has no variable for intrinsic value. An agent is a vessel for payoff. The cosmopolitan idea that humans have value *independent* of their utility to your fitness function cannot be expressed.
  *   **Justice as Fairness:** Rawlsian-style fairness (distributive justice independent of efficiency) has no counterpart. EGT optimizes for stability or aggregate fitness, not distributional equity unless equity is a constraint required for stability.
  *   **The "Right to Exit":** Philosophers debate if people have a moral right to leave a nation. In EGT, exit is just a parameter (cost). If the cost is high, exit doesn't happen. There is no "right," only feasibility.

  ***

  ### 3. Structural Analysis: Binary vs. Continuous

  **Can your framework express continuous, topology-dependent obligation?**
  Yes, but with a caveat.
  Standard "group selection" or "multi-level selection" models often force a binary (Group $A$ vs. Group $B$). However, your specific vocabulary—**local interaction pools** and **endogenous boundaries**—allows for continuity *if* the boundary is defined probabilistically.
  *   If "boundary" = a hard wall (interaction prob = 0 outside), you are forced back into binary boxes.
  *   If "boundary" = a decay function (interaction prob $\propto e^{-\text{distance}}$), then **Modular Loyalty** is fully expressible. The "obligation" becomes the **cooperation probability $P(C)$**, which is a continuous variable dependent on the local clustering coefficient.

  **Is the philosophical binary an artifact?**
  The residue suggests the philosophical binary (Compatriot vs. Stranger) is largely an **institutional artifact**, not a structural necessity of cooperation.
  *   **Why Philosophers use Binary:** They are modeling *states*. States have hard borders, legal binaries (citizen/non-citizen), and discrete jurisdiction. Their ontology is political, not social.
  *   **Why EGT suggests Continuity:** Social networks are rarely perfectly partitioned. They are small-world networks with overlapping communities.
  *   **The Risk in Your Framework:** Even if you model continuous topology, **phase transitions** often occur. As network modularity increases, cooperation strategies often undergo a sharp transition from global defection to local cooperation. This can *simulate* a binary boundary emerging from continuous parameters. You might find that while your *inputs* are continuous, your *equilibria* look binary (high cooperation inside the cluster, zero outside).

  **Verdict on Vocabulary Failure vs. Philosophical Artifact:**
  It is not a failure of your vocabulary. Your framework is actually *more* granular than the philosophical debate.
  The residue exists because the philosophers are arguing about **deontological constraints** (rules you must follow), while you are modeling **equilibrium strategies** (behaviors that persist).
  *   If you find that "Modular Loyalty" produces stable cooperation without hard borders, you haven't failed to capture the philosophy; you've demonstrated that the **binary moral distinction is unnecessary for the functional outcome (cooperation).**
  *   However, if you want to capture the *moral outrage* a cosmopolitan feels when a nationalist ignores a starving stranger, EGT fails. EGT can explain why the nationalist *does* ignore the stranger (low probability of return interaction), but it cannot capture the *wrongness* of that act unless "wrongness" is defined as "destabilizing to the global system."

  **Summary:** Your framework dissolves the binary into a gradient of interaction probabilities. The "residue" is the normative force of morality itself, which EGT translates into stability conditions. The philosophical binary is indeed an artifact of institutional rigidity, which your topology-dependent model successfully exposes as non-essential for sustaining cooperation.
