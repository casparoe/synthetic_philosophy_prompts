answer: |-
  Any viable theory of conceptual slippage in copycat microdomains must treat normative and procedural history as ontologically constitutive, overriding intrinsic physical properties when determining category membership.

  ### Mandatory Desiderata

  **1. Explanatory Target: Divergent Categorization of Physically Identical Tokens**
  *   **Specification:** The theory must explain why two tokens with indistinguishable physical structures and performance profiles are assigned to different categories (e.g., "Genuine" vs. "Compatible").
  *   **Motivating Case:** A third-party brake pad stops a car identically to an OEM pad but is classified as "aftermarket," affecting resale value and insurance assessments despite physical equivalence.

  **2. Explanatory Target: Prediction of Boundary Shifts Without Hidden Essences**
  *   **Specification:** The theory must model how an object transitions categories based on external procedural events (certification, accreditation) rather than internal physical changes.
  *   **Motivating Case:** A used laptop becomes "Certified Refurbished" solely through a vendor's inspection and paperwork process, not through physical alteration sufficient to change its material essence.

  **3. Case Distinction: Functional Equivalence vs. Ontological Identity**
  *   **Specification:** The theory must distinguish between an object doing the job of a category member and being a member of that category.
  *   **Motivating Case:** A copycat pharmaceutical molecule may be bioequivalent (functional) but legally distinct (ontological) regarding patent protection and branding rights.

  **4. Case Distinction: Liability Attribution vs. Warranty Eligibility**
  *   **Specification:** The theory must separate the conditions under which an agent is liable for failure from the conditions under which a manufacturer owes replacement or repair.
  *   **Motivating Case:** An installer may be liable for damages using a compatible part even if the part itself carries no warranty from the original manufacturer.

  **5. Consistency Condition: Cognitive Science on Categorization**
  *   **Specification:** The theory must accommodate graded membership and typicality effects observed in human judgment.
  *   **Motivating Case:** Consumers intuitively rate "official" accessories as better examples of the category than "compatible" ones, even when performance is identical.

  **6. Consistency Condition: Jurisprudence on Product Liability**
  *   **Specification:** The theory must align with legal frameworks that often require binary determinations for liability despite fuzzy conceptual boundaries.
  *   **Motivating Case:** A court must rule definitively on whether a part is "defective" or "non-genuine," disallowing fuzzy membership in strict liability contexts.

  ### Constraints and Preferences

  **Non-Negotiable Constraints**
  *   **Normative Override:** Physical properties cannot be the sole determinants of category membership; legal and procedural status must be able to override material intrinsicness.
  *   **Contextual Sensitivity:** Boundary conditions must shift based on parameters like market framing and accreditation status.

  **Negotiable Camp Preferences**
  *   **Single Correct Taxonomy:** Whether there is one true classification system for the domain (Realist preference) or multiple equally valid systems relative to context (Anti-Realist preference).
  *   **Deterministic Boundary Rules:** Whether the shift conditions can be codified into strict rules or must remain heuristic and case-based.

  ### Jointly Unsatisfiable Pair
  **Cognitive Gradience vs. Jurisprudential Binary:** It is jointly unsatisfiable to fully maintain the fuzzy, graded boundaries required by cognitive science (Desideratum 5) while simultaneously satisfying the binary, crisp sets required by strict liability jurisprudence (Desideratum 6) without introducing a dual-layer ontology. A theory that insists categories are inherently fuzzy cannot easily explain why legal liability snaps to a binary state without appealing to an external arbitrating mechanism that effectively creates a second, artificial essence.

  ### The Single Eliminator
  **The Normative Override Constraint:** The requirement that normative and procedural history determines category membership independent of physical intrinsic properties eliminates the largest share of popular candidates, specifically Classical Essentialism. Any theory grounding category membership primarily in intrinsic physical properties fails to account for "fluid" boundary conditions where physical stasis coincides with categorical transition (e.g., certification).

  ### Theory Scoring

  **Classical Essentialism**
  *   **Score:** Fail.
  *   **Reasoning:** Violates the Normative Override Constraint. It cannot explain how an object changes category without physical change, nor can it account for divergent categorization of physically identical tokens without positing undetectable metaphysical essences.

  **Prototype-Theory Adaptation**
  *   **Score:** Partial Pass.
  *   **Reasoning:** Satisfies Cognitive Consistency and explains divergent categorization via similarity to different exemplars (OEM vs. Generic). However, it struggles with the Jurisprudential Binary condition, as prototype theory suggests fuzzy boundaries that conflict with the hard lines required for warranty eligibility and liability.

  **Pragmatic-Contextualist Model**
  *   **Score:** Pass.
  *   **Reasoning:** Successfully handles Normative Override and Contextual Sensitivity by treating categories as tools for specific goals (legal, commercial, cognitive). It accommodates the Unsatisfiable Pair by acknowledging different standards for different contexts (fuzzy for consumers, binary for courts), though it sacrifices the Negotiable Preference for a Single Correct Taxonomy.
