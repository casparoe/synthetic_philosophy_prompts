answer: |-
  ### Brainstorming and Preliminary Analysis

  Before reconstructing the metaphysical commitments of this assessment policy, I need to step back and ask what work this patchwork of rules is actually doing. The primary function of university assessment is not merely to measure a static property called "intelligence," but to certify competence for specific future contexts. When a medical board bans calculators, it is not making a claim about the nature of mind; it is making a claim about the reliability of future environments where tools might fail. When a humanities course bans autocomplete, it is likely trying to certify that the student can construct an argument structure without predictive scaffolding. The system is designed to test *internalized fluency* rather than *functional capacity*.

  The least charitable reading of this system is that it is a gatekeeping mechanism rooted in biological luck and tradition rather than pedagogical necessity. It privileges students with high working memory capacity and fine motor control (handwriting notes) while penalizing those who rely on external scaffolding, unless they have a medical diagnosis that allows the administration to frame the tool as a "prosthetic" rather than an "enhancement." This reading suggests the rules are not about cognition at all, but about maintaining the scarcity value of the degree by artificially restricting the tools of production. It creates a false dichotomy between "real" knowledge (inside the head) and "cheating" (outside the head), ignoring that almost all professional expertise involves a sophisticated coupling with external systems. If I am to analyze this fairly, I must avoid simply rationalizing this status quo as "pragmatic," but I must also avoid assuming the Extended Mind Thesis (EMT) is obviously true and the current rules are obviously false. The tension lies in whether the rules *require* a specific metaphysics or merely *reflect* a specific pedagogical goal.

  ***

  ### I. Reconstruction of the Implicit View

  **Speaking as a Philosopher of Mind:**

  To reconstruct the theory of cognition presupposed by your committee's rules, we must look at how the policies draw the boundary between the agent and the environment. The current system operates on a principle of **Internalism**, specifically a version of **Vehicle Internalism**. This is the view that the physical vehicles of cognitive states (the stuff that actually does the thinking) must be located within the biological boundaries of the organism (skin and skull).

  The honor code's clause regarding "own work" or "own knowledge" is the metaphysical anchor here. It presupposes that knowledge is a property that can be owned by a subject in a way that excludes external artefacts. In the vocabulary of the extended mind debate, this system rejects the **Parity Principle**. The Parity Principle states that if a part of the world functions as a process which, were it done in the head, we would have no hesitation in recognizing as part of the cognitive process, then that part of the world is part of the cognitive process. Your rules explicitly violate this. A handwritten formula sheet is functionally similar to biological memory retrieval—it is a store of information consulted at need. Yet, the rules treat biological retrieval as "knowledge" and the paper retrieval as "aid." This indicates a commitment to a **Constitution View** of cognition where only biological tissue can constitute the mind.

  Furthermore, the rules do not consistently apply the standard checklist for cognitive extension (often cited as reliability, automatic endorsement, and easy accessibility). A student's own notebook is reliable, automatically endorsed (they wrote it), and easily accessible. Yet, in a closed-book exam, this is banned. This suggests the practice does not merely fail to *recognize* extended cognition; it actively *polices* against it. The distinction between storage (notes) and processing (autocomplete/calculators) is unstable in your rules. Calculators (processing) are sometimes allowed, while notes (storage) are sometimes banned. This implies the underlying theory is not actually about storage versus processing, but about **Fluency versus Scaffolding**. The system assumes that true cognition requires the internal integration of the skill, whereas external tools are merely causal scaffolding that bypasses the cognitive work.

  However, does this practice *require* the falsity of the Extended Mind Thesis? No. One can accept that cognition *extends* into the world (metaphysically) but still argue that certain assessments must test the *internal substrate* specifically (pedagogically). Therefore, the rules are compatible with EMT, but they are inconsistent with the *spirit* of EMT. They treat the boundary of the skin as morally and epistemically significant, whereas EMT treats it as causally relevant but metaphysically porous.

  ***

  ### II. Diagnosis of Incoherence and Underdetermination

  **Speaking as a Philosopher of Mind:**

  The most significant incoherence in this system lies in the **Accommodation Exception**. You permit dictation software for students with dysgraphia but ban it for others. If we take the Internalist metaphysics seriously (that thinking happens only in the head), then allowing software for one group changes what is being measured for that group compared to the rest. They are being tested on "coupled cognition" while others are tested on "isolated cognition." This violates fairness if the goal is to compare knowledge.

  However, if we take the Extended Mind Thesis seriously, the inconsistency becomes moral rather than metaphysical. If cognition is naturally coupled with tools for everyone, then denying tools to non-diagnosed students is akin to denying glasses to a student with perfect vision during a reading test. It artificially handicaps the majority. The current system tries to have it both ways: it treats tools as "cheating" (external contamination) for the majority, but as "prosthetics" (restoring function) for the minority. This relies on a **Medical Model of Disability** rather than a **Social Model**. It assumes the "normal" mind is the biological brain, and any deviation requires a medical excuse to use tools. This creates a metaphysical contradiction: the tool is constitutive of the mind for the disabled student (restoring their agency) but merely causal for the non-disabled student (augmenting their agency).

  **Speaking as a Committee Member:**

  From an administrative perspective, the system is **philosophically underdetermined**. This means that multiple, conflicting theories of mind can justify the exact same rules.
  1.  **Internalism:** Justifies the rules because only internal states count as knowledge.
  2.  **Externalism (EMT):** Can justify the rules if the goal of the exam is to certify *internal integration* for safety-critical roles (e.g., a surgeon must recall anatomy without looking it up if the power fails).
  3.  **Behaviorism:** Can justify the rules because the observable behavior (writing without tools) is the only thing that matters for certification.

  Because rival theories license the same rules, the rules cannot be defended by appealing to the "true nature of mind." They must be defended by appealing to the **purpose of the credential**. The storage-versus-processing distinction does not survive scrutiny because the rules allow processing (calculators) in some contexts and ban storage (notes) in others. The real distinction is **Risk Management**. We allow calculators when arithmetic errors are high-risk but formula recall is low-risk. We ban notes when recall is high-risk (e.g., drug interactions) but allow them when synthesis is high-risk.

  The apparent inconsistency regarding accommodations dissolves if we view the exam not as a measure of "mind" but as a measure of "capacity to perform task X under constraints Y." For the student with dysgraphia, the constraint (handwriting) is the barrier to measuring the capacity (knowledge). For the student without dysgraphia, the constraint is the variable being tested (fluency under pressure). However, this explanation is fragile. It relies on the assumption that handwriting is a neutral medium, which it is not.

  **Speaking as a Philosopher of Mind:**

  I must flag that the claim that EMT is compatible with restricted exams is contested. Some proponents of EMT argue that if cognition is extended, then restricting tools is literally restricting the mind, making the assessment invalid by definition. I defend the view that EMT describes the *default state* of cognition, but institutions have the right to test *specific substrates* provided they are transparent about it. However, the honor code's language of "ownership" is metaphysically obsolete. Knowledge is not a property owned like a physical object; it is a state of coupling. To say a student "owns" knowledge they cannot access without a tool is to rely on a folk-psychological fiction.

  ***

  ### III. Recommendations and Counterfactuals

  **Speaking as a Committee Member:**

  If we were to rewrite these rules to align with a more coherent view of cognition and fairness, without necessarily adopting the full Extended Mind Thesis, I recommend the following shifts:

  1.  **Reframe the Honor Code:** Remove the language of "owning knowledge." Replace it with "demonstrating mastery of authorized systems." Academic dishonesty should be defined as **unauthorized coupling**. This shifts the focus from metaphysics (what is inside you) to protocol (what tools are permitted). This clarifies that using a banned tool is not a lie about who you are, but a violation of the testing constraints.
  2.  **Universal Design over Accommodation:** Instead of granting dictation software only to diagnosed students, evaluate whether the exam *requires* handwriting. If the learning objective is "constructing arguments," handwriting is irrelevant. Make the tool available to all. This removes the metaphysical stigma that tools are "cheats" for some and "medicine" for others. It acknowledges that all cognition is tool-mediated.
  3.  **Explicit Constraint Labeling:** When a course bans tools (closed book), the syllabus must explicitly state *why*. Is it testing recall for safety? Is it testing fluency? If the answer is "tradition," the rule should be challenged. This forces the faculty to justify the constraint based on learning outcomes rather than implicit internalist metaphysics.

  **Speaking as a Philosopher of Mind:**

  If the committee took the Extended Mind Thesis seriously as a metaphysical truth, the changes would be more radical:

  1.  **The Closed-Book Analogy:** A closed-book exam would indeed be morally akin to testing a student with part of their memory temporarily disabled, *if* the student normally relies on those notes to function cognitively. The analogy fails only if the goal of the exam is to test the biological substrate's integrity specifically. But if EMT is true, the "biological substrate" is not the whole mind. Therefore, the analogy holds: you are testing a diminished system. To fix this, exams should be **Open-System**. They should test the student's ability to manage their cognitive ecology (notes, tools, search) rather than their ability to function without it.
  2.  **Redefining Ownership:** "Own work" must be redefined as **Integrated Coupling**. A belief is "yours" not because it is in your head, but because you are reliably coupled to it and understand its provenance. A student using a formula sheet they created has integrated that sheet into their cognitive system. A student using a leaked solution key has not; they are bypassing the cognitive process entirely. The line between cheat and tool is not *location* (internal vs. external) but **integration and transparency**.
  3.  **The Accommodation Line:** Under EMT, the line between accommodation and cheat dissolves. Both are forms of coupling. The distinction should rest on **Universal Access**. If a tool improves cognitive performance, and its use is not the specific skill being tested, it should be available to everyone. Restricting it to diagnosed students reinforces the false metaphysical view that the "natural" mind is the biological brain.

  **Final Note on Consistency:**
  We are inconsistent when we ban notes (storage) but allow calculators (processing) without a clear pedagogical reason linked to risk. This inconsistency dissolves if we admit the goal is **Fluency Certification**. However, we are deeply inconsistent when we treat the same software as a prosthetic for one student and a crutch for another. This inconsistency only dissolves if we move to Universal Design.

  I defend without hedging that the current "ownership" language is metaphysically incoherent and should be removed. I contend that the distinction between internal and external resources is causally relevant but should not be morally decisive in assessment unless the internalization itself is the learning objective. Most contested in the literature is whether EMT implies we *must* allow all tools; I argue it does not mandate open tools, but it does mandate transparency about what is being tested (the brain vs. the brain-plus-tool system).
