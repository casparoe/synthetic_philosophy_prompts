      Dear Panel Member, Edmund Burke would likely oppose your scheme in principle, though he might find some solace in its restraint regarding destruction and daily life. His objection would land primarily on the presumption of the living to set arbitrary terms for the dead, rather than on the fate of the statues themselves. Where his writings are clear, he viewed society as a contract not just between those living, but between those living, those dead, and those to be born. This is a direct commitment on his part: the dead have standing, and their wishes constitute a form of property right in the traditions they bequeath. By imposing a thirty-year lease, you are effectively telling the dead that their contribution to the city's moral fabric is provisional, subject to revocation by a lottery of the living. This violates the principle of prescription, whereby long usage itself confers legitimacy. He would argue that the mere fact a thing has lasted is a reason for keeping it, not because the original reason remains clear, but because the endurance proves its compatibility with the social organism.

      However, we must extrapolate when asking how he would view a citizens' assembly deciding this. He distrusted abstract reason applied to social bonds, and a random assembly hearing legalistic cases fits poorly with his preference for natural aristocracy and established prejudice. Yet, if the alternative is violent mobbing, he might prefer your orderly process. On the question of whether inheriting a dishonourable name demands change, Burke believed reform was necessary to preserve the whole, but only when guided by prudence, not a calendar. Your scheme makes judgment routine and administrative, which risks trivializing the moral weight of commemoration. This follows directly from his fear that turning moral sentiments into calculations corrodes the affections that bind society.

