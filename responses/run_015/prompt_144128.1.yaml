prompt: |-
  Write a dialogue between Priya and Tom, both of whom know the EA scene pretty well, about whether measurability bias in effective altruism is quietly wrecking institutional resilience. Priya's view is that when funders demand quantifiable outputs — bednets, lives saved, that sort of thing — charities restructure themselves around what's legible, not what's useful. She thinks this is particularly toxic in longtermist funding, where organisations end up optimising for producing elaborate risk assessments that no government will ever read, just because that's the only deliverable you can put in a grant report. She also thinks "earning to give" makes it worse, because high-earners want clean metrics to justify there donations, so they accidentally incentivise this kind of performative measurement. Tom thinks she's romanticising messy institutions. He argues that without measurability you just get patronage networks and vanity projects, and that at least "earning to give" is transparent about the trade-off: you're not pretending to be a saint, you're just maximising resources. He also points out that institutional capacity is itself hard to measure, so complaining about measurability bias is a bit like complaining that gravity pulls things downward. They should actually respond to each other — Priya shouldn't just call Tom a shill for finance, Tom shouldn't just call Priya a Luddite. Try to reach a real conclusion, or at least figure out exactly where they disagree. Write it casually, like actual conversation, with maybe a typo or two, and use British spelling throughout.
