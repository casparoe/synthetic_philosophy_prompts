answer: |-
  **Priya:** Did you see the latest grant report from that AI safety org? The one we talked about at the conference.

  **Tom:** The one that raised the Series B? Yeah, skimmed it. Looked solid. Clear metrics on researcher hours and output papers.

  **Priya:** That's exactly what's worrying me. It's too clean. They've restructured the whole org around what's legible to funders, not what's actually useful. It's measurability bias quietly wrecking institutional resilience.

  **Tom:** Oh, here we go. You think they should just vibe based on institutional intuition? Priya, without measurability you just get patronage networks and vanity projects. That's the old aid model. Someone's cousin gets a contract to build a well that doesn't work. At least here we know what we're buying.

  **Priya:** I'm not saying throw out the metrics. I'm saying the metrics *become* the mission. Especially in longtermist funding. Organisations end up optimising for producing elaborate risk assessments that no government will ever read, just because that's the only deliverable you can put in a grant report. It's performative measurement.

  **Tom:** But someone has to read them. Or at least, the funders do. Look, I get the worry about Goodhart's Law. But complaining about measurability bias is a bit like complaining that gravity pulls things downward. Institutional capacity is itself hard to measure, sure, but that doesn't mean we stop trying to weigh things.

  **Priya:** It's not like gravity, Tom. Gravity is a physical constant. This is an incentive structure we built. We can change it. And it's made worse by the earning to give crowd. High-earners want clean metrics to justify their donations. They accidentally incentivise this kind of performative measurement because they need to feel their cheque bought a specific unit of 'good'.

  **Tom:** I think you're being unfair on the earners. At least earning to give is transparent about the trade-off. You're not pretending to be a saint working in the trenches, you're just maximising resources. It's honest. If I make millions in finance and give 50%, I don't need a story about how my spreadsheet saved a village. I just need to know the money was used well.

  **Priya:** But 'used well' gets defined by what's easy to count. So the orgs shift to do the countable stuff. They stop building the messy, human infrastructure that actually lets them pivot when a crisis hits. They become brittle. When the funding dries up or the risk model changes, they collapse because they never invested in the unmeasurable stuff. Like staff wellbeing or actual policy relationships.

  **Tom:** Okay, I'll concede that staff wellbeing is often overlooked. But if you remove the requirement for quantifiable outputs, how do you stop the money going to friends? You say 'trust', but trust doesn't scale. EA grew because we said 'show me the evidence'.

  **Priya:** I'm not saying 'trust'. I'm saying qualitative assessment is hard work. It requires funders to actually understand the org, not just read a dashboard. But dashboards are cheap. Understanding is expensive. So the system defaults to the cheap option.

  **Tom:** So what's the solution? You want funders to spend more time on due diligence? They're already bottlenecked.

  **Priya:** I want them to fund resilience as a line item. Even if it's unmeasurable. Admit that some things are loss-leaders for the health of the ecosystem.

  **Tom:** That sounds like subsidising inefficiency.

  **Priya:** It sounds like maintenance. You don't maintain a bridge because you can measure exactly when it will collapse. You maintain it because you know gravity exists.

  **Tom:** *laughs* Alright, fair point on the gravity. But here's where I think we actually disagree. You think the distortion is the primary risk. I think the opacity is the primary risk. If we loosen the metrics, I worry we drift back into the kind of charitable industrial complex that wastes billions on feeling good rather than doing good.

  **Priya:** And I think we're building a machine that runs perfectly until it hits a bump it wasn't programmed for, then shatters. We're optimising for the wrong environment.

  **Tom:** So we're stuck between inefficiency and fragility.

  **Priya:** Basically. Though I think we can measure 'capacity' if we tried. Retention rates, diversity of funding sources, ability to pivot projects. We just don't because it doesn't fit the 'lives saved' narrative.

  **Tom:** Retention rates are measurable, yeah. But funders don't care unless it ties back to output. Maybe that's the lever. If we can prove that high retention equals higher output over five years...

  **Priya:** See, now you're trying to measure the unmeasurable again.

  **Tom:** Habit. But... alright. Maybe the compromise is that big funders need to allocate a chunk of capital specifically for 'unmeasurable capacity building'. No KPIs attached. Just trust based on past performance.

  **Priya:** I'd take that. But you know they'll want to measure whether the 'unmeasurable' fund was successful.

  **Tom:** Probably. Humans are weird. We can't help ourselves.

  **Priya:** Yeah. Well, pass the sugar.

  **Tom:** Here. At least we can measure how many teaspoons go in.

  **Priya:** Don't start.
