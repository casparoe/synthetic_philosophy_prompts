answer: |-
  Here is the specification sheet you asked for. I have stripped out the academic scaffolding and focused on the structural constraints a theory of pleasure must satisfy to survive scrutiny from both a neurobiological and a philosophical perspective.

  ### Part 1: The Desiderata (The Spec)

  A viable theory of hedonism must satisfy the following five categories of constraints. I have marked which are "Hard" (theory fails if violated) and which are "Soft" (theory weakened but survivable).

  #### 1. Phenomenological Coverage
  *   **Heterogeneity Accommodation:** The theory must explain why a backrub, a proof, and a meal feel different, yet all count as pleasure.
      *   *Why:* Empirical fact of experience. Denying this makes the theory out of touch with the data (introspection).
  *   **Valence Intuition:** The theory must capture the "goodness" or "for-me-ness" of the state. It cannot be neutral processing.
      *   *Why:* If a state is functionally identical to pleasure but lacks positive valence, it isn't pleasure.
  *   **Intensity Scaling:** The theory must allow for degrees (a tickle vs. an orgasm).
      *   *Why:* Required for any quantitative modeling of behavior or experience.

  #### 2. Conceptual Distinctions (Non-Collapse)
  *   **Pleasure vs. Desire (Wanting vs. Liking):** The theory must distinguish between the *anticipation/pursuit* of a state and the *consummatory experience* of it.
      *   *Why:* Hard constraint. You can want what you don't like (addiction, duty) and like what you didn't want (surprise delight). Collapsing these renders the concept of "pleasure" redundant with "motivation."
  *   **Pleasure vs. Relief:** The theory must distinguish between the cessation of pain (relief) and positive hedonic tone.
      *   *Why:* Biologically and phenomenologically distinct. Relief is often tied to homeostatic correction; positive pleasure can be non-homeostatic (luxury).
  *   **Thin vs. Thick Pleasure:** The theory must account for "thin" (raw sensory feel) and "thick" (emotionally/cognitively laden, e.g., pride, schadenfreude) pleasures without reducing one to the other.
      *   *Why:* Intellectual pleasures lack a specific sensory locus; sensory pleasures lack complex cognitive content. A theory that only fits one is incomplete.

  #### 3. Biological Plausibility
  *   **Substrate Agnosticism (within reason):** The theory cannot require a single, localized "pleasure neuron" or unique neurotransmitter for all pleasures.
      *   *Why:* Hard constraint. We know dopamine, opioids, endocannabinoids, and serotonin all play roles in different reward contexts. A "single substance" theory is biologically falsified.
  *   **Dissociation of Components:** The theory must align with the dissociation of *learning* (prediction error), *motivation* (incentive salience), and *consummation* (palatability/liking).
      *   *Why:* Hard constraint. Lesion studies and optogenetics show these can be uncoupled. A theory that conflates them contradicts circuit data.
  *   **Temporal Dynamics:** The theory must account for habituation (hedonic adaptation) and satiety.
      *   *Why:* Pleasure is not a static state; it degrades with repetition. A static definition fails to predict behavior over time.

  #### 4. Cross-Subject Applicability
  *   **Non-Verbal Subjects:** The theory must apply to infants and non-human animals without requiring complex propositional attitudes (e.g., "I desire that this sensation continues").
      *   *Why:* Hard constraint. Rats clearly exhibit pleasure behaviors (facial expressions, approach) without linguistic capacity.
  *   **Pathology Consistency:** The theory must explain anhedonia (inability to feel pleasure) as a specific deficit, distinct from apathy (inability to act).
      *   *Why:* Clinical reality. Depression often involves dissociated wanting and liking.

  #### 5. Explanatory Power (No Handwaving)
  *   **Non-Circularity:** The theory cannot define pleasure as "that which is sought" or "that which feels good."
      *   *Why:* Tautologies do not solve the heterogeneity problem.
  *   **Causal Efficacy:** The theory must explain *why* pleasure reinforces behavior, not just correlate with it.
      *   *Why:* If pleasure is epiphenomenal (a byproduct with no causal power), hedonism as a motivational theory collapses.

  ---

  ### Part 2: The Incompatibility Matrix (Jointly Unsatisfiable Requirements)

  This is the critical section. You cannot maximize all desiderata simultaneously. You must trade off. Here are the hard clashes:

  #### Clash 1: Phenomenological Unity vs. Biological Distributedness
  *   **Requirement A:** There is a common "felt quality" (Hedonic Tone) shared by all pleasures.
  *   **Requirement B:** The biological substrate is distributed and heterogeneous (no single "pleasure center").
  *   **The Conflict:** If there is a single *qualia* of pleasure, neurobiology suggests there should be a common integrator or final pathway that generates it. We do not see a single neural signature for "liking" that covers food, sex, and math.
  *   **Verdict:** You must drop **A**. If you keep A, you contradict current systems neuroscience. If you keep B, you must explain the *feeling* of unity as an illusion or a higher-order construct, not a raw sensory given.

  #### Clash 2: Introspective Certainty vs. Non-Verbal Applicability
  *   **Requirement A:** The subject must be able to identify the state as pleasure (Introspective Access).
  *   **Requirement B:** The theory must apply to animals/infants who lack higher-order thought.
  *   **The Conflict:** If pleasure requires *knowing* you are pleased (a cognitive attitude toward a sensation), animals likely don't have it. If animals *do* have pleasure, then introspection is not necessary.
  *   **Verdict:** You must drop **A** as a necessary condition. Pleasure must be definable functionally or biologically to include animals, making human introspection a report of the state, not the state itself.

  #### Clash 3: Normativity vs. Functionalism
  *   **Requirement A:** Pleasure is intrinsically "good" for the subject (Normative).
  *   **Requirement B:** Pleasure is a reinforcement signal for adaptive behavior (Functional).
  *   **The Conflict:** Addiction and super-normal stimuli (e.g., pornography, ultra-palatable food) hijack the reinforcement system. They generate high "functional" reward signals but are often experienced as "bad" or destructive by the subject later.
  *   **Verdict:** You must decouple **A** from **B**. A biological theory can explain the mechanism (B) but cannot guarantee the normative value (A). Hedonism fails if it claims whatever triggers the reward system is "good."

  #### Clash 4: Heterogeneity vs. Causal Efficacy
  *   **Requirement A:** Pleasures are phenomenologically diverse (Chocolate $\neq$ Math).
  *   **Requirement B:** Pleasure acts as a common currency for decision making.
  *   **The Conflict:** To compare chocolate vs. math in a decision, the brain must translate them into a common metric. If they are truly heterogeneous, how are they compared? If they are translated into a common metric, does that metric constitute the "pleasure," or is it distinct from the experience?
  *   **Verdict:** The "Common Currency" likely exists in valuation circuits (OFC/Striatum) distinct from the experiential circuits. This suggests pleasure *as experienced* is not the same as pleasure *as a decision variable*.

  ---

  ### Part 3: Scorecard of Main Views

  Here is how the three dominant philosophical/biological frameworks score against the spec above.

  | Feature | **Felt-Quality (Hedonic Tone)** | **Attitude-Based (Desire for Experience)** | **Functional/Reward (Learning Signal)** |
  | :--- | :--- | :--- | :--- |
  | **Core Claim** | Pleasure is a specific phenomenological property added to experiences. | Pleasure is wanting the current experience to continue. | Pleasure is a positive reward prediction error or reinforcement signal. |
  | **Heterogeneity** | **FAIL.** Struggles to identify the common "tone" across diverse experiences. | **PASS.** Unifies diverse experiences via a single attitude type. | **PASS.** Unifies via functional role (reinforcement). |
  | **Pleasure vs. Desire** | **PASS.** Distinct states (can feel good without wanting). | **FAIL.** Collapses pleasure into a type of desire (circular). | **FAIL.** Collapses pleasure into "wanting" (incentive salience). |
  | **Bio-Plausibility** | **FAIL.** No single neural substrate for a "hedonic glow." | **SOFT FAIL.** Requires complex cognition unlikely in animals/infants. | **PASS.** Aligns with Dopamine/RL models (mostly). |
  | **Normativity** | **PASS.** Captures the "goodness" intuition well. | **PASS.** Explains why we pursue it. | **FAIL.** Cannot distinguish adaptive reward from addiction/pathology. |
  | **Introspection** | **PASS.** Matches how it feels to us. | **PASS.** Matches reflective endorsement. | **FAIL.** Often unconscious (prediction errors happen below awareness). |
  | **Overall Status** | Phenomenologically accurate, biologically unsupported. | Philosophically tidy, biologically/cognitively too demanding. | Biologically robust, phenomenologically empty. |

  ---

  ### Part 4: The "Positive Affect" Handwave

  You asked specifically about "Positive Affect." In neuroscience and psychology, this term is often used as a placeholder. Here is the diagnostic on whether it explains anything:

  1.  **As a Label:** It is a renaming of the problem. Saying "chocolate and math both generate positive affect" is equivalent to saying "they both generate pleasure." It solves nothing regarding heterogeneity.
  2.  **As a Mechanism:** If "Positive Affect" refers to a specific neurochemical state (e.g., opioid release in hedonic hotspots), it is too narrow. It covers sensory pleasure but fails to capture intellectual satisfaction or aesthetic awe, which do not map cleanly to opioidergic activity.
  3.  **As a Dimension:** If "Positive Affect" refers to a dimension of emotional space (e.g., Valence/Arousal models), it is descriptive, not explanatory. It tells you *where* the state sits, not *what* the state is.

  **Verdict:** "Positive Affect" is negotiable only if defined strictly as a **functional output of a valuation system**. If defined as a "feeling," it inherits the Felt-Quality failures (no biological substrate). If defined as "approach tendency," it inherits the Functional failures (collapses into desire/motivation).

  ### Summary Recommendation

  To build a theory that works for you (given your neuro background):

  1.  **Accept the Dissociation:** You must accept that "Pleasure" in the folk/phenomenological sense is likely a **composite** of at least two biological systems:
      *   **Liking:** Opioid/Endocannabinoid mediated, consummatory, localized (hedonic hotspots).
      *   **Learning/Valuation:** Dopaminergic, distributed, predictive.
  2.  **Drop Phenomenological Unity:** Do not look for a single "feel." Look for a common **functional role** (signaling fitness benefit or homeostatic alignment) that *generates* the illusion of a common feel via higher-order integration.
  3.  **The Trade-off:** The only way to satisfy the Biological and Cross-Species constraints is to adopt a **Functional/Attitude Hybrid**. You define pleasure as a state that functions to reinforce the current trajectory, *represented* to the organism (if capable) as "good."
  4.  **The Cost:** This means accepting that what humans *report* as pleasure (Felt-Quality) is a user-interface illusion generated by the brain to simplify complex valuation data. It solves the heterogeneity problem by saying the heterogeneity is real, and the unity is a functional abstraction, not a sensory primitive.

  This approach satisfies the biological hard constraints but requires you to treat introspection as data to be explained, not as the ultimate authority on what pleasure *is*.
