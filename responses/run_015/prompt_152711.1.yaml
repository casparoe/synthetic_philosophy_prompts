      *   *Requirement 5: Cross-Species Applicability.* Rats feel pleasure; do they have "propositional attitudes"?
      *   *Requirement 6: Distinction from Desire.* I can want something I don't enjoy (masochism, duty) and enjoy something I didn't want (surprise).
      *   *Requirement 7: Introspective Access.* Usually, I know when I'm pleased.

  4.  **Identifying Tensions/Incompatibilities (The "Hard Part"):**
      *   *Tension A: Phenomenological Unity vs. Biological Diversity.* If pleasure is a specific "feeling" (Felt-Quality), biology should show a specific "pleasure center" or neurotransmitter. We don't see one single substrate for *all* pleasures (e.g., intellectual vs. sensory).
      *   *Tension B: Introspective Access vs. Cross-Species/Unconscious.* If pleasure requires knowing you're pleased (higher-order thought), animals/infants might be excluded. If it's just functional, introspection becomes epiphenomenal.
