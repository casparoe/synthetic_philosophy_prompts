answer: |-
  # Incident Accountability Protocol (IAP)
  **Version:** 1.0  
  **Runtime:** 90 Minutes Max  
  **Operator:** Incident Review Board Lead  
  **Goal:** Determine accountability, remediation, and external communication.

  ## Part 1: The Decision Checklist
  *Answer these questions in order. Do not skip ahead. If a "Stop Condition" is met, move immediately to the Verdict Menu.*

  ### Q1: Intervention Capacity (The "Could They Stop It?" Test)
  **Question:** At the moment the incident became inevitable, did the identified human have the technical ability and time to prevent it?
  **Evidence Needed:** System logs (latency, command acceptance), UI state screenshots, video footage of the event timeline.
  **Sufficient Answer:** "Yes, the command window was open and latency was <200ms" OR "No, the system locked out input 3 seconds prior."
  **Stop Condition:** If **NO**, individual blame is impossible. Move to Q3 (Skip Q2).
  **Time Limit:** 10 Minutes.

  ### Q2: Information Access (The "Did They See It?" Test)
  **Question:** Was the information required to make the safe decision visible and unambiguous to the human at the time?
  **Evidence Needed:** UI logs, alert history, dashboard configuration at the time of incident.
  **Sufficient Answer:** "The alert was red and required acknowledgment" OR "The alert was buried in a low-priority log stream."
  **Stop Condition:** If **NO** (information was hidden or ambiguous), individual blame is invalid. Move to Q3.
  **Time Limit:** 10 Minutes.

  ### Q3: Prior Signal Audit (The "Did We Know?" Test)
  **Question:** Had this specific failure mode or risk been reported internally (tickets, alerts, complaints) before this incident?
  **Evidence Needed:** Support ticket history, engineering bug tracker, alert frequency logs (look for false positive rates).
  **Sufficient Answer:** "This alert has fired 40 times with 100% false positive rate" OR "Three customers reported weird behavior at this corner last week."
  **Stop Condition:** If **YES**, the responsibility shifts from the front-line operator to the team responsible for reviewing signals (Engineering/Support Management). Individual operator blame is reduced or eliminated.
  **Time Limit:** 20 Minutes.

  ### Q4: Competent Peer Standard (The "Swap Test")
  **Question:** If we swapped in a different, reasonably trained operator with the same tools and information, would the outcome likely be different?
  **Evidence Needed:** Expert review of the decision context, simulation data, comparison with similar shifts/operators.
  **Sufficient Answer:** "Any trained operator would have ignored this alert due to noise" OR "Standard protocol clearly dictates stopping, which was ignored."
  **Stop Condition:** If **YES** (anyone would have done the same), blaming this individual is unfair. Move to Q5.
  **Time Limit:** 20 Minutes.

  ### Q5: Prevention Efficiency (The "Crumple Check")
  **Question:** Is holding this person accountable the most effective way to prevent this from happening again?
  **Evidence Needed:** Root cause analysis draft.
  **Sufficient Answer:** "Retraining this operator prevents recurrence" OR "Fixing the alert threshold prevents recurrence for all 200 robots."
  **Stop Condition:** If **NO** (blaming the person doesn't fix the root cause), do not issue individual punishment. Move to Verdict.
  **Time Limit:** 15 Minutes.

  ### Q6: Stakeholder Expectation (The "Retribution Check")
  **Question:** Does the severity of harm create a public expectation for a human sacrifice that contradicts the facts above?
  **Evidence Needed:** Legal counsel input, comms team assessment, severity of injury.
  **Sufficient Answer:** "Public expects accountability" OR "Facts are clear enough to explain no fault."
  **Values Call:** **This question cannot be answered by facts.** The Board must vote on whether to absorb public pressure or hold the line on facts.
  **Time Limit:** 15 Minutes.

  ---

  ## Part 2: Verdict Menu
  *Select one primary verdict. You may combine with remediation steps.*

  1.  **Individual Corrective Action:** (Warning, Retraining, Removal).
      *   *Requires:* YES on Q1, YES on Q2, NO on Q4 (they deviated from peers), YES on Q5 (blame prevents recurrence).
  2.  **Process Failure:** (Management/Engineering Accountability).
      *   *Requires:* YES on Q3 (signals ignored) OR NO on Q2 (bad UI).
  3.  **Technical Remediation:** (Fix the Robot/Software).
      *   *Requires:* NO on Q5 (blaming humans doesn't fix root cause).
  4.  **No-Fault Restitution:** (Apology, Compensation, Design Review).
      *   *Requires:* NO on Q1 OR NO on Q4 OR Unavoidable Incident.
      *   *Obligation:* You must still provide repair, apology, and audit. You cannot "shrug."

  ---

  ## Part 3: Anti-Gaming Measures
  *How this procedure gets abused and how to stop it.*

  **1. The "System Did It" Shield**
  *   **Risk:** Engineering teams classify everything as "unforeseeable" to avoid Q3 findings.
  *   **Counter:** Q3 requires hard data on alert frequency and ticket history. If an alert fired 40 times, it is not unforeseeable. The Board must verify the "false positive" claim with data, not assertion.

  **2. The "Nearest Human" Scapegoat**
  *   **Risk:** Ops leads blame the remote operator because they are the easiest target (Q1/Q2 yes, skip rest).
  *   **Counter:** You cannot stop at Q2. You must run Q4 (Peer Standard). If 90% of operators would have ignored the alert, punishing one is scapegoating. You must run Q5 (Prevention Efficiency). If firing them doesn't fix the alert noise, it's wasted effort.

  **3. The "Values Dodge"**
  *   **Risk:** Using Q6 to justify firing someone even when facts say no fault (to satisfy public anger).
  *   **Counter:** If Q1-Q5 say "No Fault," Q6 cannot change the verdict to "Individual Corrective Action." It can only change the *Communication Strategy*. You may not lie about why someone was fired. If you must fire to satisfy public pressure, the verdict is "Process Failure" (leadership took responsibility), not "Operator Error."

  ---

  ## Part 4: Case Studies (Run-Through)

  ### Case 1: The Ignored Alert (Ankle Fracture)
  **Run-Through:**
  *   **Q1 (Intervention):** Yes. Operator could have stopped the robot.
  *   **Q2 (Information):** Yes. Alert was visible.
  *   **Q3 (Prior Signal):** **YES.** Alert fired 40 times before, 100% dismissed. This is a critical failure of the alert system, not the operator.
  *   **Q4 (Peer Standard):** **YES (Swap Test).** Any trained operator would have ignored a known false positive.
  *   **Q5 (Prevention):** **NO.** Punishing the operator does not fix the alert noise. Fixing the threshold does.
  *   **Q6 (Values):** Public wants accountability.
  **Verdict:** **Process Failure + Technical Remediation.**
  **Rationale:** "While the operator had the technical ability to intervene, the alert system had generated forty prior false positives without review, conditioning staff to disregard this specific warning. Holding the operator accountable would not prevent recurrence; correcting the alert threshold and reviewing historical dismissal patterns will. We owe the pedestrian full restitution and a public commitment to recalibrate our confidence thresholds."

  ### Case 2: The Firmware Wall-Hug (Blind Pedestrian Pinned)
  **Run-Through:**
  *   **Q1 (Intervention):** No/Limited. Robot behavior was autonomous and unexpected.
  *   **Q2 (Information):** No. Failure mode unknown in simulation.
  *   **Q3 (Prior Signal):** **YES.** Three customer complaints closed as duplicates. Support process failed to escalate.
  *   **Q4 (Peer Standard):** N/A (System failure).
  *   **Q5 (Prevention):** **NO.** Blaming support staff individually doesn't fix the triage protocol.
  *   **Q6 (Values):** High severity (vulnerable user).
  **Verdict:** **Process Failure (Support Triage) + Technical Remediation.**
  **Rationale:** "This incident resulted from an undocumented firmware behavior compounded by a support process that failed to escalate three prior customer reports. No individual operator could have prevented the specific robot behavior. Responsibility lies with the triage protocol that allowed duplicate complaints to be closed without engineering review. We are updating our escalation matrix and rolling back the firmware."

  ### Case 3: The Dog Paw (Genuine Gap)
  **Run-Through:**
  *   **Q1 (Intervention):** No. Happened too fast/unforeseeable.
  *   **Q2 (Information):** No. No sensor could detect the paw placement.
  *   **Q3 (Prior Signal):** No. Never happened before.
  *   **Q4 (Peer Standard):** N/A.
  *   **Q5 (Prevention):** **NO.** No design change exists without rendering robot useless.
  *   **Q6 (Values):** Owner wants someone fired.
  **Verdict:** **No-Fault Restitution.**
  **Rationale:** "This incident represents a genuine limitation of current technology where no human or system could have reasonably foreseen or prevented the injury without halting all operations. While no individual is at fault, we accept responsibility for deploying machines in shared spaces. We will cover all veterinary costs, issue a formal apology, and fund an independent safety audit to explore future design modifications, but no personnel will be disciplined."

  ---

  ## Part 5: Values Call Flag
  **Warning:** Step Q6 is the only point where moral judgment overrides factual findings.
  *   **If Facts = No Fault, but Public = Fury:** You must decide if you will lie to protect peace or tell the truth and manage the anger.
  *   **Procedure Rule:** You may not issue an **Individual Corrective Action** verdict if Q1-Q5 clear the individual. You may only change the **Communication Strategy** (e.g., "Leadership takes responsibility" instead of "System glitch").
  *   **Documentation:** If you make a values call here, it must be minuted as: "Board elected to absorb reputational risk to maintain factual integrity," OR "Board elected to prioritize stakeholder trust over strict factual attribution." Do not hide this.

  ---

  ## Part 6: Written Rationale Templates
  *Use these to ensure consistency in regulatory reports.*

  **For Individual Accountability:**
  "Following review, it was determined that the operator had both the capacity and the clear information required to prevent this incident, deviating from established protocol where a competent peer would not have. Retraining/Removal is enacted to ensure adherence to safety standards that directly prevent recurrence."

  **For System/Process Failure:**
  "The incident was driven by [alert fatigue/support triage failure/firmware bug] evidenced by [X prior signals]. Individual action would not address the root cause. Remediation focuses on [engineering fix/process update] to prevent systemic recurrence."

  **For No-Fault Restitution:**
  "Investigation confirms this event was unforeseeable and unpreventable by current human or system standards. While no negligence occurred, we acknowledge the harm caused by our operations. We are committed to [compensation/apathy/audit] as part of our duty of care to the community."
