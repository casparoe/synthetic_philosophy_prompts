answer: |-
  This is a remarkably sophisticated debate for a study group. You have stumbled into the core tension of modern historiography and ethics: the conflict between **moral contextualism** (Leo) and **moral realism/accountability** (Priya).

  Here is an adjudication of each move, a specific ruling on the "epistemic dominance" claim, and a final verdict on who holds the stronger position.

  ### Move-by-Move Adjudication

  **Move 1: The "Man-of-His-Time" vs. Contemporary Dissent**
  *   **Leo's Claim:** Moral frameworks evolve like technology (the antibiotic analogy). Judging the past by present standards is anachronistic.
  *   **Priya's Rebuttal:** Moral knowledge wasn't hidden; dissenters existed (abolitionists, indigenous resistance). The knowledge was available; it was ignored.
  *   **Adjudication:** **Priya wins this round.**
      Leo's antibiotic analogy is a category error. Scientific progress is cumulative and dependent on discovery (you *cannot* know antibiotics before they are discovered). Moral progress is often dependent on *choice* and *empathy*. As Priya notes, Bartolomé de las Casas criticized Spanish colonial brutality in the 1500s; Frederick Douglass was active while Jefferson's legacy was still being cemented. The moral "technology" was available; these figures chose not to use it. Leo's defense works for things truly unknowable to the past, but not for systemic injustices that were contested *at the time*.

  **Move 2: Institutional Moral Debt (The "Node" Argument)**
  *   **Leo's Claim:** Individuals are nodes in a structure. Blaming Columbus ignores the systemic incentives (Empire, Monarchy, Capital). Removing statues blames the brick, not the wall.
  *   **Priya's Rebuttal:** This is diffusion of responsibility. If everyone is just a node, systemic harm has no perpetrators.
  *   **Adjudication:** **Draw (with a lean to Priya).**
      Leo is sociologically correct: systems do incentivize harm, and focusing solely on "great men" obscures the machinery of history. However, Priya is ethically correct: statues are not erected to "systems"; they are erected to *individuals*. They are intended to honor specific agency. If we accept Leo's argument fully, we enter a "banality of evil" trap where no leader is ever accountable because they were just "following the structure." Priya correctly identifies that acknowledging systemic forces shouldn't absolve the individuals who wielded them.

  **Move 3: Symmetry and Epistemic Dominance**
  *   **Leo's Claim:** Future generations (2124) will condemn us (factory farming, AI). Our certainty is just "epistemic dominance"—arrogance based on being later in time.
  *   **Priya's Rebuttal:** There is a difference between *not knowing* and *not wanting to know*. Churchill had critics he actively dismissed.
  *   **Adjudication:** **Leo wins the philosophy; Priya wins the application.**
      Leo's philosophical point is robust (more on this below). However, Priya's distinction between *blind spots* and *closed eyes* is the crucial ethical filter. We cannot be blamed for what we genuinely cannot conceive of, but we can be blamed for suppressing voices that are telling us we are wrong *right now*.

  ---

  ### Is "Epistemic Dominance" a Real Problem or Fancy Dressing?

  **It is a real problem, but it is not a "get out of jail free" card.**

  Leo is invoking a concept known in philosophy as **moral fallibilism**. He is correct that the arc of moral history suggests our current blind spots will be visible to the future. If we eat meat, use fossil fuels, or deploy algorithmic bias, people in 2124 may view us as barbarians. To claim we are the "end of history" morally is indeed arrogant.

  **However, Leo is misusing it as a shield for the past.**
  The existence of future judgment does not negate the necessity of present judgment.
  1.  **Action requires certainty:** We must act on the best moral knowledge available *now*. If we wait until we are perfect (or until the future tells us we were wrong), we become paralyzed.
  2.  **The "Closed Eyes" Factor:** Priya's counter destroys the symmetry argument regarding figures like Churchill or Columbus. We will likely be condemned for factory farming, but there is a massive global movement *right now* arguing against it. If a person today actively silences animal rights activists, they are not suffering from "epistemic dominance"; they are suffering from **willful ignorance**.
  3.  **The Function of Statues:** Statues are not history books; they are honorifics. Epistemic dominance suggests we shouldn't be *arrogant* about our judgment, but it doesn't mean we shouldn't *make* judgments. If we decide today that colonialism is net-negative, keeping a statue up is an active endorsement of that value system by the *living*, not the dead.

  **Verdict on Leo's Point:** It is a vital check on arrogance, but it is **fancy dressing** when used to argue that we shouldn't reassess who we honor. We must judge the past to define our present, even if the future judges us for it.

  ---

  ### Overall Verdict: Who is More Right?

  **Priya is more right regarding the specific issue of statues.**
  **Leo is more right regarding the philosophy of history.**

  Since the debate is about *statues* (a public, symbolic act), Priya takes the win. Here is why:

  1.  **Statues are for the Living:** Leo treats statues as historical records that must be protected from "presentism." Priya correctly treats them as value statements made by the *current* community. Removing a statue isn't erasing Churchill from history; it's saying, "We no longer wish to honor this specific aspect of his legacy in our public square."
  2.  **The Availability of Dissent:** Leo's strongest shield (they couldn't know better) is historically false for the figures in question. As Priya noted, anti-colonial and abolitionist arguments existed during the lifetimes of both Columbus and Churchill. They weren't victims of their time; they were defenders of the dominant power of their time.
  3.  **Accountability:** Leo's structural argument is intellectually seductive but politically neutering. If we cannot critique individuals because they were "nodes," we lose the ability to assign leadership responsibility. Priya's insistence on agency is necessary for justice.

  **The Synthesis:**
  Leo is right that we should be humble. We should acknowledge that future generations may find faults with our own heroes (perhaps even the ones Priya defends). But Priya is right that humility does not require silence. We can acknowledge our own future fallibility while still deciding that, based on the evidence and moral arguments available *today*, Columbus and Churchill represent values we no longer wish to elevate.

  **Final Ruling:** Priya wins the debate, but she should thank Leo for keeping her honest. Without Leo's "epistemic dominance" warning, her position risks becoming self-righteous. Without Priya's "willful ignorance" rebuttal, Leo's position becomes a defense of the status quo.
