answer: |-
  This is a classic theoretical blockage, but your description suggests it has calcified into something more specific than the usual Weber-vs-Normative standoff. Since you know the literature, I will skip the genealogy of the concept and focus strictly on the architecture of your group's disagreement.

  ### Diagnosis: Two Questions Pursued Under One Heading

  Your impasse is not merely verbal, nor is it a clash of unarguable intuitions. It is a case of **two distinct questions being pursued under one heading**, specifically regarding the **temporal horizon of political obligation.**

  Here is the structural evidence from your description:

  1.  **The Delivery Camp is asking a question about *current causal efficacy*:** "What is the active mechanism sustaining obedience *right now*?" Their evidence is survey self-reports and revealed behavior (people say they comply because of growth; they comply). For them, legitimacy is a *sociological fact* about the present state of belief. If the belief exists, the legitimacy exists.
  2.  **The Authorization Camp is asking a question about *counterfactual resilience*:** "What happens to the claim to rule when the causal mechanism fails?" Their evidence is a theoretical deduction about the nature of the bond. They argue that because the bond is contingent on output, the *standing* to rule vanishes the moment output stops. For them, legitimacy is a *structural property* of the regime that must survive the inevitable bad quarter.

  The word "legitimacy" is doing double duty. For Camp 1, it means "effective claim to rule." For Camp 2, it means "durable right to rule."

  You can see this in their concessions. Camp 1 admits performance acceptance is conditional. Camp 2 admits delivery is valued. They agree on the *present* reality but disagree on the *modal* status of that reality. Camp 1 sees a regime that is legitimate *until* it fails. Camp 2 sees a regime that is *never* legitimate because it *must* fail eventually to be tested, and when it does, it has no buffer.

  This is why the impasse is stable. Camp 1 is looking at the *stock* of belief currently in the bank. Camp 2 is looking at the *interest rate* required to keep it there. Both are describing the same phenomenon, but one is describing the balance sheet and the other is describing the liquidity risk.

  ### Evaluation of the "Inherited-Credit" Hypothesis

  Your hypothesis—that the hidden empirical question is whether performance-based acceptance is self-renewing or self-consuming—is **a genuine empirical mechanism, not merely a redescription.**

  It successfully isolates *why* the Authorization camp feels performance claims are inferior. They intuitively grasp the **ratchet effect of expectations**: successful delivery raises the baseline for future delivery, making the "cost" of legitimacy inflationary. Procedural legitimacy, by contrast, often has a *depreciation buffer*; a bad quarter is absorbed by the "office" or the "constitution."

  However, your hypothesis does not resolve the *conceptual* stalemate on its own. Here is why:

  *   **If you prove performance legitimacy is self-consuming:** Camp 1 will say, "It is still legitimacy while it lasts. A bridge that collapses in 50 years is still a bridge." Camp 2 will say, "Exactly, it's a temporary transaction, not a standing authority."
  *   **If you prove performance legitimacy is self-renewing:** Camp 1 wins. Camp 2 must concede that delivery can generate a normative surplus that survives a downturn (perhaps by creating a tradition of delivery).

  The "Inherited-Credit" story names the *dynamic* that distinguishes the two types of claims, but it doesn't tell you which one deserves the label "legitimacy." It confirms that the *object of the claim* differs (as you suspected): one attaches to a **record** (flow), the other to an **office** (stock).

  So, your hypothesis is the key to the *empirical* lock, but it requires a *conceptual* key to open the door. It validates the Authorization camp's worry (fragility) without invalidating the Delivery camp's observation (efficacy).

  ### Path Forward: Progress via Reframing

  Do not abandon the word "legitimacy." It is too central to discard. However, you must stop asking "Is this legitimacy?" and start asking "What is the *failure mode* of this legitimacy?"

  **1. The Distinction: Legitimacy as Capital vs. Legitimacy as Contract**
  Reframe the debate using your credit insight.
  *   **Capital Legitimacy (Authorization Camp's ideal):** Attached to the *regime/office*. It is a reservoir. Bad performance draws down the reservoir, but does not immediately empty it. It allows for error.
  *   **Contract Legitimacy (Delivery Camp's observation):** Attached to the *administration/record*. It is a recurring transaction. Bad performance constitutes a breach of contract, voiding the claim immediately.

  Your group should agree that both exist. The disagreement is whether "Contract Legitimacy" deserves the same noun as "Capital Legitimacy."

  **2. The Evidence: Stress-Testing the Claim**
  Since you agree on the cross-sectional facts (growth, surveys), you cannot resolve this with more survey data. You need **longitudinal stress tests**.
  *   *The Question:* When delivery falters, does the regime revert to procedural justification (elections/tradition), or does it double down on delivery promises?
  *   *The Prediction:* If it's "Capital Legitimacy," the regime can survive a recession by invoking its procedural right to rule. If it's "Contract Legitimacy," a recession triggers an existential crisis because the *only* claim they have is voided.
  *   *The Metric:* Measure the *lag time* between performance failure and political crisis. Short lag = Contract. Long lag = Capital.

  **3. The Reframing: From "Is" to "How"**
  Stop asking "Is performance-based rule legitimate?" Start asking: **"Under what conditions does performance-based acceptance convert into procedural acceptance?"**
  This bridges the camps. Camp 1 gets to study how delivery creates belief. Camp 2 gets to study whether that belief hardens into a "right to rule" that survives the delivery stopping. This turns the "Inherited-Credit" hypothesis into a research program: *Does sustained performance eventually generate a procedural halo, or does it permanently trap the regime on the performance treadmill?*

  ### Verdict

  Your impasse is **Two Questions Pursued Under One Heading** (Current Efficacy vs. Counterfactual Resilience).

  Your "Inherited-Credit" hypothesis is **valid and empirically tractable**, but it is a description of the *mechanism of fragility*, not a definition of legitimacy. It explains *why* the Authorization camp is skeptical, but it doesn't prove them right about the definition.

  **Recommendation:**
  Adopt a **typological approach**. Agree that "Legitimacy" is the genus, and "Procedural/Capital" and "Performance/Contract" are species with different half-lives and failure modes.
  *   **Progress** looks like mapping the *conversion rate*: Can performance legitimacy be transformed into procedural legitimacy over time?
  *   **Failure** looks like continuing to argue binary definitions.

  If you frame it as "We are studying two different stability mechanisms that both produce compliance," the semantic fight dissolves. The Delivery camp studies the *engine* (performance). The Authorization camp studies the *chassis* (procedure). You need both to explain why the car moves and why it doesn't fall apart when the engine sputters.
