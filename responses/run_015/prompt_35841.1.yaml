  ### Nearest concepts and where they miss

  Moral luck addresses how external factors affect moral judgment, but it focuses on the agent's worthiness, not the observer's pedagogical extraction. Survivorship bias explains why we see only winners, yet your problem persists even when losers are present; the trait itself changes meaning based on the result. Hindsight bias describes knowing the outcome alters probability estimation, but it doesn't capture the moral valence shift where stubbornness becomes conviction or vanity. These concepts describe cognitive errors or metaphysical conditions, not the specific hermeneutic failure of reading virtue into success. They explain why we misjudge, but not why the *textual support* remains identical while the lesson inverts. The core issue isn't just seeing the wrong data or misjudging probability; it's that the narrative structure of a completed life forces coherence onto random events, manufacturing moral causality where there may only be correlation. Thus, while these concepts form the perimeter, they don't name the central pedagogical collapse you're witnessing regarding the stability of moral lessons. It is a failure of interpretation, not just selection.

  ### A name and definition, or why none fits

  There is no single canonical term because this sits at the intersection of cognitive psychology and virtue ethics. However, the most precise label is **"Outcome Bias in Moral Exemplarism."** While psychologists use "outcome bias" to describe judging decisions by results, applying it to "exemplarism" captures the pedagogical failure. It defines the tendency to attribute character virtues to agents solely because their narratives ended successfully, thereby reverse-engineering moral causality from historical accident. Alternatively, literary critics might call this **"Teleological Distortion,"** where the ending dictates the meaning of the beginning. Neither is perfect, as both imply an error in judgment rather than a structural flaw in the method itself. Ultimately, the problem is that biography imposes a plot on a life, and plots require causality that real lives often lack. The lesson isn't found; it is authored by the biographer's need for closure.

  ### Boundary cases

  Boundary cases exist where the method holds firmer. If a virtue is intrinsically valuable regardless of outcome—like Socrates accepting death rather than compromising truth—the lesson survives the ending. Here, the "success" is moral integrity, not worldly gain. Similarly, tragic heroes whose specific flaws (*hamartia*) directly cause their downfall offer stable lessons; hubris leading to a fall is consistent across contexts. The method also works when the subject explicitly documents their reasoning processes, allowing associates to evaluate decisions independent of results. However, when a life hinges on a single unpredictable variable—a market crash, a sudden illness—the biographical lesson becomes unstable. The method fails most when the distinction between "principled risk" and "reckless gamble" is visible only in retrospect. In these ambiguous zones, the life cannot teach ethics because the ethics are being written by the outcome.

  ### Verdict on the biographical method

  The biographical method survives, but only if radically modified. You cannot simply put admirable lives in front of associates and let imitation do the rest; that is indeed hagiography. To save the method, you must teach the *contingency* of the success. Do not present the biography as a blueprint, but as a case study in decision-making under uncertainty. Explicitly highlight the moments where luck intervened. Ask associates: "If this had failed, would this trait still be a virtue?" This transforms the seminar from imitation to critical analysis. The value lies not in the success, but in the reasoning visible beneath it. If you commit to teaching lives as complex narratives filled with moral luck rather than straight lines to virtue, the method remains powerful. It teaches judgment, not just rules. But if you present them as clean exemplars of success, you are teaching superstition, not ethics. Commit to the messy truth. You must tell them that virtue is not a guarantee of success, and success is not proof of virtue. Only then does the life become a tool.
