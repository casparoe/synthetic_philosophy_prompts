  | Objection-in-their-words | Who in the room says it | Damage 1-5 + why | 90-sec reply i can say out loud | Where that reply is soft |
  | :--- | :--- | :--- | :--- | :--- |
  | **"You're assuming the canteen wastes less if you skip. What if they just bin the unsold chicken anyway? Then your threshold model is empirically false."** | The Climate PhD (backed by the EAs checking your data) | **5/5** – If the supply chain doesn't work how you say, your entire mechanism collapses. It falsifies the premise. | "That's a fair empirical risk. My argument is conditional: *if* the supplier adjusts orders based on demand trends—which is standard inventory logic to cut cost—then the threshold effect holds. If they simply waste food, then yes, individual skipping is futile *consequentially*. But even then, the expressive value remains. However, given profit motives, assuming they adjust orders is the more rational baseline than assuming they burn money on waste." | You haven't actually verified the canteen's waste policy. If they push back hard on the data, you have no backup. |
  | **"This is neoliberal guilt-tripping. Focusing on individual trays distracts from the policy changes that actually move emissions. You're optimizing a leaf while the tree dies."** | The Climate PhD | **4/5** – Frames your project as morally harmful or irrelevant compared to systemic action. | "I agree policy is higher-leverage. But this isn't an 'either/or'. Expected value theory says we should take *all* positive EV actions, not just the highest one. Skipping lunch takes 0 extra time; lobbying takes hours. They aren't mutually exclusive. Also, individual norms shift political will. If we treat individual action as worthless, we lose the cultural momentum needed for policy change." | You might sound like you're dodging the priority question. Concede policy is *more* important, but insist individual action isn't *zero* importance. |
  | **"Your probability estimate is wild. Even with bulk orders, the chance your single tray tips the threshold is like 1 in 5,000. The EV is so tiny it's morally negligible."** | The EA Consequentialists | **4/5** – Attacks the math core of your thesis. If EV ≈ 0, the consequentialist case dies. | "Negligible isn't zero. In expected utility theory, low probability × huge harm (hundreds of chickens per lump) still yields significant EV. Also, you're ignoring the cumulative effect of my skipping all semester. It's not one tray; it's 60 trays. That pushes me much closer to the threshold. Dismissing small probabilities leads to paralysis in all climate action, not just diet." | EAs know that "small prob × huge harm" can still be effectively zero if the harm isn't huge enough. Be ready to defend the "harm per lump" number. |
  | **"Why tie moral worth to luck? If skipping lunch only matters because of a random threshold, then your moral integrity depends on inventory algorithms, not your character."** | The Virtue Ethics Students | **3/5** – Challenges the moral framing. Suggests your view makes morality too contingent/external. | "I'm not tying moral worth to the outcome, but to the *attempt* to align with good outcomes. Virtue ethics cares about intention, but consequentialism cares about impact. I'm arguing that a virtuous person *should* care about expected impact. Even if the threshold isn't hit, the intention to reduce harm is what builds the character. The luck element doesn't negate the virtue of trying." | This is a hybrid view. Pure virtue ethicists might say the consequence doesn't matter at all; pure consequentialists say intention doesn't matter. You're straddling both. |
  | **"If you don't eat that chicken, someone else will. The canteen won't throw it away; they'll just sell it to the next student who wanted it. No animals saved."** | Any Empirically-minded Student | **3/5** – Standard substitution objection. If demand is inelastic, your skip changes nothing. | "That assumes perfect substitution instantly. But canteen data is aggregated for orders. If demand drops slightly over a week, the *next* bulk order shrinks. It's not about that specific tray being wasted; it's about the signal sent to the supplier for the next shipment. The market clears over weeks, not minutes. So the substitution effect doesn't erase the threshold signal." | Requires the audience to accept the "aggregated data" model. If the canteen cooks fresh daily based on visual cues, this fails. |
  | **"If individual action is this low-impact, why not spend that energy organizing a campaign to change the supplier contract entirely? That's a higher EV use of your time."** | The EA Consequentialists | **2/5** – Strategic objection. Doesn't deny your math, just says there's a better option. | "I'm not claiming this is the *highest* EV action, just that it's *positive* EV. We can walk and chew gum. Also, not everyone has the capacity to organize supplier contracts. Skipping meat is a low-barrier entry point for ethical consistency. Demanding everyone be a full-time activist excludes most people from moral participation." | EAs will argue opportunity cost strictly. If you have time to prep this talk, you had time to email the supplier. |
  | **"Doesn't focusing on this let you off the hook for bigger things? Like, 'I skipped chicken so I can fly to conference next week guilt-free'?"** | The Virtue Ethics Students | **1/5** – Moral licensing charge. Psychological, not philosophical. | "That's a risk of moral licensing, but it's not an argument against skipping meat. It's an argument against hypocrisy. We should aim for consistency across all actions. Using one good deed to justify a bad one is a failure of reasoning, not a failure of the deed itself. My thesis is about the value of the skip, not what you do after." | Hard to prove you aren't licensing yourself. It's a psychological hit that's hard to refute logically. |

  ### The Nightmare Question
  **"If your expected value calculation relies on unverified supply chain assumptions, and the probability of impact is vanishingly small, isn't the *real* value of this talk just signaling your own moral purity to this room rather than actually saving animals?"**

  **Why it sinks you:** It combines the EA's math critique (EV is tiny) with the Virtue ethicist's suspicion (you're just performing) and the PhD's systemic critique (it's distraction), framing your entire presentation as an act of selfish virtue-signaling rather than effective altruism or genuine ethics. It attacks your *motive* rather than your argument, which is almost impossible to defend without sounding defensive.
