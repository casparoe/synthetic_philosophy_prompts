prompt: |-
  hey so i'm giving a 20 min presentation next tuesday to our uni climate ethics reading group and i need help getting ready for Q&A. my thesis is that skipping meat in the canteen still matters even though one skipped tray basically never changes anything by itself, because of expected threshold effects.

  my core arguement is pretty simple: our supplier only adjusts chicken orders in big 20kg lumps, so most individual skips do nothing, but each skip slightly raises the chance we tip the next order down by a whole lump. so even if my skipping lunch for a semester almost certainly makes zero causal difference, the tiny chance of preventing a whole lump still gives it real expected value. i'll use that canteen case the whole time, not voting or flying.

  audience is like 12-15 people: mostly philosophy masters students who are into virtue / expressive reasons stuff like what kind of person eats factory-farmed chicken, plus two EA consequentialist types who already know the threshold math and will nitpick my numbers, plus one climate science PhD who thinks individual diet talk is a distraction from policy and gets impatient with thought experiments.

  can you make me a prep sheet for that specific crowd? i want like 7 objections they'd actually raise, in the order they'd hurt me most, each written how that person in the room would say it, not generic textbook versions. be decisive about it btw — don't just lay out both sides, tell me which ones i should just concede vs hold my ground on and why.

  put it as a markdown table with these columns so i can print it: Objection-in-their-words | Who in the room says it | Damage 1-5 plus one line why | 90-sec reply i can say out loud | Where that reply is soft. and then after the table add the one nightmare question i'm hoping nobody asks and a line on why it would sink me.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Create a Q&A prep sheet for a 20-minute presentation.
      *   **Topic:** Individual meat consumption ethics (specifically skipping meat in a university canteen).
      *   **Thesis:** Skipping meat matters due to *expected threshold effects* (probabilistic impact on bulk orders), even if individual acts rarely cause direct change.
      *   **Audience:**
          *   Majority: Philosophy Masters students (virtue/expressive ethics focus).
          *   Minority (2): Effective Altruists (EA) / Consequentialists (know the math, will nitpick numbers).
          *   Minority (1): Climate Science PhD (policy-focused, impatient with individual action thought experiments).
      *   **Format:** Markdown table with specific columns (Objection-in-their-words, Who, Damage 1-5 + why, 90-sec reply, Where reply is soft). Plus a "Nightmare Question" section.
      *   **Tone:** Decisive (tell user what to concede vs. hold ground), specific to the crowd (not generic), actionable for print.
      *   **Constraints:** 7 objections, ordered by damage (most harmful first).

  2.  **Deconstruct the Thesis & Audience Dynamics:**
      *   *Thesis:* Expected Utility via Thresholds (Nefsky/Nozick-style arguments applied to canteen bulk orders).
      *   *Virtue/Expressive Crowd:* Might argue individual action is about character, not consequences. Or they might argue structural change is the only virtue.
      *   *EA/Consequentialist Crowd:* Will attack the probability estimates. Is the threshold model accurate? Does the canteen actually work this way? Is the expected value actually significant compared to other interventions?
      *   *Climate PhD:* Will argue this is neoliberal guilt-tripping that distracts from systemic policy change. "Individual carbon footprints were invented by BP."

  3.  **Drafting Objections (Iterative Process):**

      *   *Objection 1 (The Systemic/Policy Attack):* The Climate PhD will say this is distraction. Damage: High (undermines the point of the talk).
      *   *Objection 2 (The Probability/Math Attack):* The EAs will say the probability is so low the EV is negligible. Damage: High (attacks the core mechanism).
      *   *Objection 3 (The Supply Chain Reality):* Does the canteen actually work like this? Maybe they waste food instead of ordering less. Damage: Medium-High (empirical falsification).
      *   *Objection 4 (The Virtue/Expressive Counter):* Why bother with consequences if virtue is what matters? Or conversely, if consequences are tiny, is it virtuous? Damage: Medium (philosophical framing).
      *   *Objection 5 (The Substitution Effect):* If you don't eat chicken, will you eat something else equally bad? Or will someone else eat your chicken? Damage: Medium (empirical).
      *   *Objection 6 (The Collective Action Problem):* One person doing this is futile without coordination. Damage: Low-Medium (you can concede this but maintain individual EV).
      *   *Objection 7 (The Moral Licensing):* Does skipping lunch make you feel good enough to ignore bigger issues? Damage: Low (psychological).

      *Refining for "In Their Words":* Needs to sound like a specific person in the room.
      *   *PhD:* "This is neoliberal distraction."
      *   *EA:* "Your p-value is wild."
      *   *Virtue Ethicist:* "Why tie morality to luck?"

      *Ordering by Damage:*
      1.  Policy Distraction (PhD) - Kills the relevance.
      2.  Empirical Supply Chain (EA/General) - Kills the mechanism.
      3.  Probability/Negligibility (EA) - Kills the math.
      4.  Complicity/Integrity (Virtue) - Challenges the moral framing.
      5.  Waste vs. Order (Empirical) - Specific canteen mechanics.
      6.  Collective Action (General) - "Why not organize instead?"
      7.  Moral Licensing (General) - "You're just cleaning your conscience."

      *Wait, I need to be decisive.* Which ones should they concede?
      *   Concede: Moral Licensing (it's a risk, but doesn't negate EV).
      *   Concede: Policy is more important (but individual action isn't mutually exclusive).
      *   Hold Ground: The math holds even if probabilities are low (EV > 0).
      *   Hold Ground: The mechanism (thresholds) is plausible even if not guaranteed.

  4.  **Developing the Replies:**
      *   Need to be 90 seconds spoken. Concise, punchy.
      *   Need to identify the "soft spot" (where the reply might fail).

  5.  **Developing the Nightmare Question:**
      *   Something that combines the EA math critique with the PhD policy critique in a way that proves the EV is actually *negative*.
      *   Example: "What if your signaling makes others feel less need to act?" or "What if the canteen wastes the food anyway?"
      *   Better: "What if the expected value of the time you spent preparing/cooking/eating this meal is higher than the EV of the skipped chicken?" (Opportunity cost).
      *   Best: "If the probability is 1 in 10,000 and the harm is 10 chickens, but the psychological cost of rigid dietary restriction reduces your long-term activism output, isn't the net EV negative?"

  6.  **Refining the Table Content:**
      *   *Column 1:* Objection-in-their-words ( colloquial, sharp).
      *   *Column 2:* Who (PhD, EA, Virtue).
      *   *Column 3:* Damage (1-5) + Why.
      *   *Column 4:* 90-sec reply (spoken style).
      *   *Column 5:* Soft spot (vulnerability).

  7.  **Review against Constraints:**
      *   Markdown table? Yes.
      *   7 objections? Yes.
      *   Ordered by damage? Yes.
      *   Specific audience voices? Yes.
      *   Decisive advice (concede/hold)? Integrated into replies/strategy.
      *   Nightmare question at end? Yes.
      *   Tone: Direct, helpful, not wishy-washy.

  8.  **Final Polish:**
      *   Ensure the "Damage" rating reflects the specific thesis (threshold effects).
      *   Make sure the replies don't sound like robotic AI but like a student defending a thesis.
      *   Check the "Who" column matches the persona described in the prompt.

      *Self-Correction on Objection 1 (Policy):* If I concede too much to the PhD, I undermine my talk. I need to frame it as "AND not OR".
      *Self-Correction on Objection 2 (Supply Chain):* This is the biggest empirical risk. If the canteen throws food away instead of ordering less, the threshold model breaks. I need to advise the user to *assume* the model holds for the sake of argument but acknowledge the risk.
      *Self-Correction on Objection 3 (EA Math):* EAs love expected value. I should lean into that. Even tiny p * huge harm = significant EV.

      *Let's finalize the order:*
      1.  Policy Distraction (PhD) - Damage 5 (Irrelevantizes the project).
      2.  Supply Chain Reality (EA/General) - Damage 5 (Falsifies the premise).
      3.  Probability Negligibility (EA) - Damage 4 (Makes the EV trivial).
      4.  Integrity vs. Luck (Virtue) - Damage 3 (Challenges moral worth).
      5.  Waste Mechanism (General) - Damage 3 (Specific empirical hole).
      6.  Collective Action (Virtue/PolSci) - Damage 2 (Strategic objection).
      7.  Moral Licensing (Psych) - Damage 1 (Ad hominem-ish).

      *Wait, Supply Chain Reality is probably more damaging than Policy Distraction.* If the mechanism doesn't exist, the policy argument doesn't matter. Let's swap 1 and 2. Actually, the PhD's objection undermines the *value* of the talk, whereas the Supply Chain objection undermines the *truth* of the talk. Truth is usually more damaging in a philosophy reading group. Let's put Supply Chain first.
      *Actually, let's look at the audience.* 12-15 people. Mostly philosophy. They care about the argument structure. If the premise is empirically false, the argument collapses. So Supply Chain is Damage 5. Policy is Damage 4 (because you can argue "both matter").
      *Let's stick to the prompt's request: "order they'd hurt me most".*
      1.  Empirical Falsehood (Supply Chain doesn't work that way).
      2.  Policy Distraction (Opportunity cost of activism).
      3.  EA Math (Probability too low to matter).
      4.  Virtue (Why tie morality to luck?).
      5.  Substitution (Someone else eats the chicken).
      6.  Collective Action (Why not organize?).
      7.  Licensing (You feel good enough to ignore worse stuff).

      *Wait, I need to make sure I tell them what to concede.*
      *   Concede: Policy is more high-leverage (but deny it's exclusive).
      *   Concede: Probability is low (but deny EV is negligible).
      *   Hold: The threshold model is plausible enough for expected value.
      *   Hold: Individual action has non-instrumental value (for the virtue crowd).

      *Let's refine the "Nightmare Question".*
      *   It needs to combine the EA math with the PhD's systemic view.
      *   "If your expected utility calculation relies on a supply chain model you haven't verified, aren't you just engaging in moral fantasy to soothe your conscience while ignoring high-impact policy work?"
      *   That's a bit long. Let's make it sharper. "What if the time you spend worrying about this threshold calculation has a higher opportunity cost than the expected value of the chicken you saved?"

      *Okay, ready to generate.*
