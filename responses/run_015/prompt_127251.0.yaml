  **JOINT STATEMENT ON THE INTERPRETATION OF THE MŪLAMADHYAMAKAKĀRIKĀ**

  **Signatories:**
  The Non-Assertive Soteriological Working Group (NAS)
  The Dialectical Realist Working Group (DR)

  **Date:** [Current Date]
  **Subject:** Hermeneutical Convergence and Divergence Regarding the *Catuṣkoṭi* and *Śūnyatā*

  **Preamble**
  Following a period of adversarial collaboration, the undersigned representatives of the Non-Assertive Soteriologist (NAS) and Dialectical Realist (DR) interpretive traditions submit this joint statement. While we maintain distinct hermeneutical commitments regarding the ontological status of Madhyamaka conclusions, we affirm a shared commitment to the text of Nāgārjuna's *Mūlamadhyamakakārikā* (MMK). This document delineates our textual agreements, maps our philosophical divergences, identifies the cruxes required for resolution, and assesses the linguistic nature of our dispute.

  ### 1. Agreed Claims Regarding Textual Reasoning

  Both camps accept the following descriptions of Nāgārjuna's argumentative structure as accurate exegesis of the MMK, irrespective of the philosophical upshot derived from them:

  1.  **Analysis of Conditions (MMK Chapter 1):** Both camps agree that the text demonstrates that an effect does not arise from a cause that possesses *svabhāva* (intrinsic nature). Specifically, the text argues that conditions (*pratyaya*) cannot be established as inherently existent sources of production, whether the effect is considered to pre-exist in the cause, not pre-exist, both, or neither.
  2.  **Analysis of Motion (MMK Chapter 2):** Both camps agree that the text deconstructs the triad of the mover (*gantṛ*), the place moved (*gamana*), and the act of moving (*gamanam*). The reasoning establishes that these three are mutually dependent; none can be logically prior to or independent of the others, rendering any account of motion based on intrinsic entities incoherent.
  3.  **Analysis of the Self and Aggregates (MMK Chapter 18):** Both camps agree that the text negates the proposition that the *tathāgata* (or self) is identical to the aggregates (*skandhas*), distinct from the aggregates, in possession of the aggregates, or existing without them. The text posits that the cessation of conceptual construction (*prapañca*) is synonymous with the cessation of suffering, and that this cessation is facilitated by the realization of dependent origination (*pratītyasamutpāda*).

  ### 2. Statement of Disagreements

  The following table outlines the primary philosophical divergences. Each column is phrased to reflect the internal coherence of the respective camp's position.

  | Issue | Non-Assertive Soteriologist (NAS) Position | Dialectical Realist (DR) Position |
  | :--- | :--- | :--- |
  | **(a) The Emptiness of Emptiness** | The statement "emptiness is empty" functions as a *prasajya-pratiṣedha* (non-implicative negation) that removes the concept of emptiness itself as an object of grasping. It renders *śūnyatā* non-assertible as a philosophical thesis to prevent reification. | The statement "emptiness is empty" functions as a consistent logical predicate that prevents *śūnyatā* from becoming a new *svabhāva*. It establishes a substantive view: the universal absence of intrinsic nature is itself dependently originated and logically coherent. |
  | **(b) The Status of the Tetralemma** | The fourfold negation is purely destructive. It generates no "fifth position." The result is *avyākṛta-vāda* (silent non-assertion), where the soteriological goal is the exhaustion of all views (*dṛṣṭi*), including the Madhyamaka view. | The fourfold negation clears the ground for the "Middle Way" as a positive fifth position. This position is the affirmative assertion of dependent origination. Madhyamaka is a correct view (*samyag-dṛṣṭi*) regarding the nature of reality, not merely the cessation of viewing. |
  | **(c) Conventional Designation** | Conventional designation (*prajñapti-mātra*) is purely pragmatic. Once *svabhāva* is negated, conventional reality retains no epistemic weight or determinate structure from the ultimate perspective; it is merely a tool for leading beings to silence. | Conventional designation is fully coherent and determinately structured. The negation of *svabhāva* does not dissolve conventional logic but secures it. Conventional truth possesses epistemic validity within the framework of dependent origination. |

  ### 3. The Cruxes

  We identify two specific sub-questions such that resolving either would necessitate a significant revision of at least one camp's position:

  1.  **The Soteriological Mechanism:** Is the soteriological aim of Madhyamaka **cognitive** (arriving at a correct conceptual representation of reality, i.e., emptiness) or **non-cognitive** (the complete cessation of conceptual construction, where "correctness" is ultimately irrelevant)?
  2.  **The Coherence of Causality:** Can *pratītyasamutpāda* (dependent origination) be coherently maintained if no conventional entity possesses even a provisional intrinsic nature, or does the functionality of cause and effect require a minimal ontological commitment to the identity of relata?

  ### 4. Conceptual Tests and Predicted Outcomes

  For each crux, we specify an internal conceptual test derived from Madhyamaka reasoning. We record the predicted outcome for each camp to clarify where the divergence lies.

  **Test A: The Semantics of Negation in MMK Chapter 15**
  *Focus:* The treatment of existence (*bhāva*) and essence (*svabhāva*).
  *Method:* Analyze the negation of *svabhāva* in MMK 15.1–4 using the distinction between *prasajya-pratiṣedha* (exhaustive, non-implicative negation) and *paryudāsa-pratiṣedha* (implicative, relative negation).
  *   **NAS Prediction:** The text employs *prasajya-pratiṣedha* exclusively regarding *svabhāva*. To say "essence does not exist" implies no alternative state of affairs (not even "absence" as an entity). This demonstrates that causality is merely conventional and ultimately ineffable; any attempt to logically structure "absence" reintroduces *prapañca*.
  *   **DR Prediction:** The text employs *prasajya-pratiṣedha* ultimately but relies on *paryudāsa-pratiṣedha* conventionally. To say "essence does not exist" implies the positive state of "dependent existence." This demonstrates that causality is determinately structured by emptiness; the negation of essence is what allows causal relations to function logically without contradiction.

  **Test B: The Snake Simile (MMK 13.8)**
  *Focus:* The danger of grasping emptiness.
  *Method:* Evaluate Nāgārjuna's warning that those who grasp emptiness wrongly are like those who seize a snake incorrectly.
  *   **NAS Prediction:** The "wrong grasp" is the treatment of emptiness as a view (*dṛṣṭi*). The test demonstrates that the soteriological aim is non-cognitive. If emptiness were a correct view, grasping it would be the goal, not a danger. Therefore, the "correct" usage is to discard the view entirely.
  *   **DR Prediction:** The "wrong grasp" is the treatment of emptiness as nihilism or as an intrinsic essence. The test demonstrates that the soteriological aim is cognitive. One must grasp the "snake" (emptiness) correctly (as dependent origination) to avoid harm. Therefore, a correct philosophical view is necessary and attainable.

  ### 5. Joint Assessment of Verbal vs. Substantive Dispute

  After rigorous analysis, we agree that a portion of our dispute is **verbal**, specifically concerning the definition and scope of "Ultimate Truth" (*paramārthasatya*) and the term "Realism."

  1.  **Ultimate Truth:**
      *   **Diagnosis:** The NAS camp defines *paramārthasatya* as an experiential state free from linguistic duality (a *non-object*). The DR camp defines *paramārthasatya* as the correct propositional content regarding the nature of phenomena (an *object of knowledge*).
      *   **Resolution:** Once disambiguated, we agree that NAS is describing the *phenomenology of realization*, while DR is describing the *logical content of the realization*. The disagreement dissolves when acknowledging that one refers to the *act* of knowing (NAS) and the other to the *structure* of the known (DR).

  2.  **The Term "Realism":**
      *   **Diagnosis:** The DR camp uses "Realism" to denote commitment to the truth-value of conventional statements and the logical consistency of emptiness. The NAS camp interprets "Realism" as commitment to *svabhāva*.
      *   **Resolution:** We agree that DR is not a "Realist" in the sense of asserting intrinsic nature. DR is a "Realist" only regarding the validity of logical inference within the conventional sphere. NAS accepts this clarification but maintains that granting logical validity to conventional truth risks reification for soteriological purposes.

  **Conclusion on Substantive Dispute:**
  While the above terminological conflicts are verbal, we jointly assess that the dispute regarding **Test A (The Semantics of Negation)** remains **substantive**. Even with disambiguated terms, the camps disagree on whether *prasajya-pratiṣedha* can sustain a positive logical system (DR) or whether it necessarily collapses all logical predication (NAS). This disagreement hinges on the interpretation of MMK Chapter 15 and cannot be resolved solely by linguistic stipulation; it requires a decision on whether logic itself is a form of *prapañca* to be abandoned or a tool to be perfected.

  **Signed,**

  *Representative, Non-Assertive Soteriological Working Group*

  *Representative, Dialectical Realist Working Group*
