answer: |-
  Here is a specification sheet for a theory of **Conscious Access** (A-Consciousness). It is designed to force clarity on the functional architecture of availability without collapsing into report-bias or smuggling in phenomenology by the back door.

  ### Desiderata for a Theory of Conscious Access

  #### 1. The Consumer Specification (Functional Scope)
  *   **Requirement:** The theory must explicitly list which downstream systems count as "consumers" of accessed content. It must distinguish between:
      *   **Grade 1:** Online sensorimotor control (e.g., dorsal stream guiding).
      *   **Grade 2:** Verbal report and immediate categorization.
      *   **Grade 3:** Arbitrary reasoning, long-term memory encoding, and delayed report.
  *   **Rationale:** These capacities dissociate. If access is defined as "availability for report" (Grade 2), you exclude Grade 1 (blindsight/echo patients). If defined as Grade 1, you include too much (reflexes).
  *   **The Echo Patient Ruling:** The theory must take a stand on the "Echo Patient" (traces shape, flinches, denies seeing, fails delayed report).
      *   *If Access = Grade 1:* She has access. (Risk: Access becomes trivial).
      *   *If Access = Grade 2/3:* She lacks access. (Risk: Access becomes synonymous with report).
      *   *Commitment:* A robust theory should allow for **Partial Access** (available to action systems, unavailable to WM/Report systems) without redefining access as "phenomenal."
  *   **Status:** **Non-Negotiable.** (A theory without a specified consumer is just a metaphor).
  *   **Camp Prejudice:** *Which grade is constitutive.* GWT tends to privilege Grade 2/3 (Report/WM). Overflow/Action views privilege Grade 1.

  #### 2. The Mechanism Distinction (Format vs. Routing)
  *   **Requirement:** The theory must distinguish between **Encoding Format** (is the representation in a "lingua franca" readable by downstream systems?) and **Routing Architecture** (is the representation physically broadcast to those systems?).
  *   **Rationale:** You can have a standardized format that isn't sent (unconscious inference), or a broadcast of a format no one can read (noise). GWT often conflates these as "ignition."
  *   **Is it a real distinction?** Yes. Format is a representational constraint; Routing is a network constraint. A theory of *access* is primarily about Routing, but depends on Format compatibility.
  *   **Status:** **Non-Negotiable.** (Conflating them makes the theory untestable).
  *   **Camp Prejudice:** GWT proponents often treat the *format change* (recoding into symbols) as the access event itself.

  #### 3. Empirical Independence (Falsifiability)
  *   **Requirement:** Neural signatures (P3b, late ignition, prefrontal activity) cannot be the *definition* of access. They must be contingent correlates.
  *   **Rationale:** If "Access = Ignition," then finding Ignition without Report (or vice versa) becomes a logical contradiction rather than empirical data. This renders the theory unfalsifiable.
  *   **Status:** **Non-Negotiable.** (Without this, it is theology, not science).
  *   **Camp Prejudice:** Hardline Dehaene-style GWT often treats P3b/IGN as the *definition* of conscious access in practice, which is a methodological sin.

  #### 4. Operational Non-Circularity (The Measurement Trap)
  *   **Requirement:** The theory must provide a criterion for access that does not presuppose the capacity it is trying to measure (usually verbal report).
  *   **Rationale:** Using report to measure access presupposes that report requires access. If access *is* availability for report, this is circular. No-report paradigms (e.g., oculomotor, priming) must be justified as valid proxies for access, not just "unconscious processing."
  *   **Status:** **Non-Negotiable.** (This is the primary source of the 1am argument).
  *   **Camp Prejudice:** The assumption that *only* verbal report is a valid gold standard for access.

  #### 5. Granularity and Binding
  *   **Requirement:** The theory must specify whether access is all-or-none per stimulus, per feature, or per object.
  *   **Rationale:** Cases like Sperling (iconic memory), binocular rivalry, and feature-binding (motion accessed, color not) challenge the "global" in Global Workspace. Can I access the motion of a stimulus without accessing its color?
  *   **Status:** **Non-Negotiable.** (Must account for partial report data).
  *   **Camp Prejudice:** GWT prefers an all-or-none "ignition" per object/event. Overflow views allow feature-level dissociation.

  #### 6. Construct Dissociability
  *   **Requirement:** Access must be empirically dissociable from: **Attention** (selection), **Working Memory** (maintenance), **Metacognition** (confidence), and **Accuracy**.
  *   **Rationale:** You can attend without accessing (inattentional blindness), access without maintaining (iconic memory), and be accurate without access (blindsight). If the theory collapses these, it is not a theory of access.
  *   **Status:** **Non-Negotiable.** (Otherwise it's just a synonym for "cognition").
  *   **Camp Prejudice:** Higher-Order theories often collapse Access into Metacognition.

  #### 7. Anatomical Commitment (Substrate Specificity)
  *   **Requirement:** The theory must state whether the "workspace" is defined by *function* (broadcast architecture) or *anatomy* (specifically prefrontal cortex).
  *   **Rationale:** If PFC is just the "report machinery" bolted onto a posterior workspace, then PFC lesions should kill report but not access (Grade 1/3). If PFC *is* the workspace, lesions kill access.
  *   **Status:** **Prejudice.** (Functionalists say architecture matters; Biological Naturalists say PFC matters).
  *   **Non-Negotiable Sub-clause:** The theory *must take a stand*. Agnosticism here is a failure of specification.

  #### 8. The Bottleneck Rationale (Evolutionary/Computational)
  *   **Requirement:** The theory must identify the **scarce resource** being economized. Is it bandwidth? Metabolic cost? Time? Number of recipients?
  *   **Rationale:** Why evolve a system that throws information away (the bottleneck)? If everything is processed in parallel, why broadcast? The "cost" of access must be specified to justify the architecture.
  *   **Status:** **Non-Negotiable.** (Without an evolutionary/computational rationale, the bottleneck is ad hoc).
  *   **Camp Prejudice:** The assumption that the bottleneck is for *decision making* vs. *memory consolidation*.

  #### 9. The Coherence Condition (Access vs. Phenomenal)
  *   **Requirement:** The theory must explain how a functional definition of access avoids collapsing into **Behaviorism** (access = disposition to report) or secretly smuggling in **Phenomenology** (access = "feeling" available).
  *   **Rationale:** This is the Block-style worry. If access is purely functional, why isn't a zombie access-conscious? If it requires "feeling," it's not purely access.
  *   **Status:** **Non-Negotiable** (for a dual-component theory), but **Jointly Unsatisfiable** for many camps.
  *   **Camp Prejudice:** The belief that this distinction is coherent at all (Illusionists deny it; Phenomenal Realists demand it).
  *   **The Killer Desideratum:** **This is the single item that does the most work knocking out candidates.** Most theories fail here: they either define access functionally and lose the "conscious" part (becoming a theory of attention), or they define it phenomenally and lose the "access" part (becoming a theory of qualia).

  #### 10. Substrate Neutrality (The AI Test)
  *   **Requirement:** The theory must state whether a non-biological system with a bottleneck + broadcast architecture (e.g., a Transformer with a small scratchpad/memory buffer) counts as having conscious access.
  *   **Rationale:** If the theory is functionalist, the answer must be Yes. If the answer is No, the theory relies on biological magic, not architecture.
  *   **Status:** **Prejudice.** (Functionalists say Yes; Bio-naturalists say No).
  *   **Feature or Reductio?** For GWT, this is a **Feature** (it's a computational theory). For Biological Naturalists, this is a **Reductio** (silicon can't be conscious).

  ---

  ### Short Scorecard

  **1. Block-Style Overflow (Phenomenal > Access)**
  *   **Score:** High on Coherence (#9) and Granularity (#5). Low on Operational Non-Circularity (#4).
  *   **Verdict:** Successfully argues that phenomenology exceeds reportable access, but struggles to provide a non-circular measure of that "excess" without relying on the very report it claims is limited. The Echo Patient is a win (she has P-consciousness, low A-consciousness).

  **2. Baars/Dehaene Global Workspace (Access = Broadcast)**
  *   **Score:** High on Mechanism (#2) and Bottleneck Rationale (#8). Low on Anatomical Commitment (#7) and Empirical Independence (#3).
  *   **Verdict:** Excellent computational story, but frequently conflates neural ignition with the definition of access (unfalsifiable risk) and ties access too tightly to PFC/Report, struggling with the Echo Patient (often labeled "unconscious").

  **3. Higher-Order (HOT) Views (Access = Meta-Representation)**
  *   **Score:** High on Construct Dissociability (#6). Low on Coherence (#9) and Consumer Specification (#1).
  *   **Verdict:** Elegant distinction between first-order state and access, but risks collapsing Access into Metacognition (circularity). Struggles to explain why the "higher order" state feels like anything rather than just being a data-tag.

  ---

  ### TA Note: The "Echo Patient" & The AI Question

  **On the Echo Patient:**
  If you adopt **GWT**, the Echo Patient is **Unconscious** (no global broadcast to WM/Report). Her tracing is a modular reflex.
  If you adopt **Overflow**, the Echo Patient is **Conscious** (Phenomenally rich, Access-poor).
  If you adopt **Action-Oriented Access**, the Echo Patient is **Access-Conscious** (Grade 1), and "Access" is a graded noun, not a binary switch.
  *Recommendation for students:* Force them to pick which "Grade" of consumer defines the theory. If they say "Report," they are behaviorists. If they say "Action," they are embodiment theorists. If they say "All," they must explain the dissociation.

  **On the Transformer:**
  A Transformer with a tiny scratchpad *does* implement a bottleneck + broadcast architecture (attention heads broadcasting to the residual stream).
  *   **GWT Verdict:** It counts as Access-Conscious (functionally isomorphic).
  *   **The Reductio:** If your intuition screams "That's just math, not access," then your theory of access relies on biology, not function. If your intuition says "Sure, why not?", then you are a functionalist.
  *   **Classroom Use:** This is the best litmus test for whether your students are actually theorizing *access* or just theorizing *brains*.

  **Final Advice:**
  The "Killer Desideratum" is #9 (Coherence). Push your friend on this: If she defines access purely as "broadcast to consumer systems," ask her what happens if the consumer systems are zombies. If the broadcast still happens, is it still *conscious* access? If she says "Yes," she's a functionalist (and owes us a story on why that matters). If she says "No," she has smuggled phenomenology back into the definition of access.
