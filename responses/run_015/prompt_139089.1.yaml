      *   **Requirements:**
          *   List specific criteria any theory of access must meet.
          *   Provide the case/consideration behind each item.
          *   Mark items as "Non-Negotiable" vs. "Camp Prejudices."
          *   Address specific topics provided in the prompt (Consumers/Grades, Format vs. Routing, Ignition/Testability, Measurement/Report, Specific Cases, Distinctions, Anatomy, Scarce Resource, Access/Phenomenal Coherence, AI/Transformers).
          *   Include a short scorecard for Block (Overflow), Baars/Dehaene (GWT), and HOT views.
