  2.  **Deconstruct the Specific Topics & Map to Desiderata:**

      *   *(1) Consumers/Grades:* Need a criterion on *Functional Scope*. Who gets the info? Action vs. Report vs. Reasoning. The "Echo Patient" case needs to be addressed here.
      *   *(2) Format vs. Routing:* Need a criterion on *Mechanism Specificity*. Is it encoding or broadcasting?
      *   *(3) Ignition/Testability:* Need a criterion on *Falsifiability/Empirical Independence*. Neural markers shouldn't *be* the definition.
      *   *(4) Measurement Trap:* Need a criterion on *Operational Independence*. Avoiding circularity in report vs. no-report.
      *   *(5) Cases (Sperling, Rivalry, etc.):* Need a criterion on *Granularity/Binding*. Can access be partial?
      *   *(6) Distinctions (Attention, WM, etc.):* Need a criterion on *Construct Validity*. Dissociability from neighbors.
      *   *(7) Anatomy:* Need a criterion on *Substrate Neutrality vs. Biological Specificity*. PFC role.
      *   *(8) Scarce Resource:* Need a criterion on *Evolutionary/Computational Rationale*. Why the bottleneck?
      *   *(9) Access/Phenomenal Coherence:* Need a criterion on *Conceptual Coherence*. Does it collapse into behaviorism or smuggle in qualia?
      *   *(AI/Transformers):* This fits under *Substrate Neutrality* or a specific *System Agnosticism* criterion.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Item 1: Functional Scope (The "Who").* Must distinguish between online control, report, and long-term reasoning. *Non-negotiable:* Must explain the Echo Patient. *Prejudice:* Whether report is constitutive.
      *   *Item 2: Mechanism (Format vs. Routing).* Is access a translation or a transmission? *Non-negotiable:* Must specify which.
      *   *Item 3: Empirical Independence.* Neural signatures (P3b, ignition) cannot be the definition. *Non-negotiable:* Crucial for falsifiability.
      *   *Item 4: Operational Non-Circularity.* How to measure without assuming report = access. *Non-negotiable:* Avoids begging the question.
      *   *Item 5: Dissociability.* Must distinguish from Attention, WM, Metacognition. *Non-negotiable:* Otherwise it's just a synonym.
      *   *Item 6: Granularity/Binding.* Can I access motion but not color? *Prejudice:* Overflow vs. Restrictivist views differ here.
      *   *Item 7: Anatomical Commitment.* PFC necessity? *Prejudice:* GWT says yes (mostly), Overflow says no.
      *   *Item 8: Computational Rationale.* Why a bottleneck? *Non-negotiable:* Needs an evolutionary story.
      *   *Item 9: The Hard Distinction.* Access vs. Phenomenal. *Non-negotiable:* Must not collapse into behaviorism.
      *   *Item 10: Substrate Neutrality (AI).* Does a transformer count? *Prejudice:* Functionalists say yes, Biological Naturalists say no.

  4.  **Refining the "Non-Negotiable" vs. "Prejudice" Labels:**
      *   *Non-Negotiable:* Things required for the theory to be a *theory* (testable, coherent, distinct).
      *   *Prejudice:* Things where reasonable theorists disagree (PFC role, Report constitutivity, AI consciousness).

  5.  **Addressing the "Echo Patient":**
      *   She has online action (tracing), no report, no delayed use.
      *   GWT: Likely says No Access (no broadcast to WM/Report systems).
      *   Overflow: Likely says Yes Access (to action systems), or distinguishes Action-Access from Cognitive-Access.
      *   *Decision:* The desideratum must force the theory to pick a lane on *which* consumer defines access.

  6.  **Addressing the "Format vs. Routing":**
      *   This is a crucial conceptual distinction. A state could be in the right format but not sent, or sent but in the wrong format. GWT usually implies both (standardized format + broadcast).
      *   *Decision:* Mark as Non-Negotiable that the theory must distinguish these.

  7.  **Addressing the "Access/Phenomenal" Coherence:**
      *   This is the user's biggest worry. If Access is defined functionally, does it leave out the "what it's like"? If it includes "what it's like," is it still just Access?
      *   *Decision:* This is the "Killer Desideratum." It's Non-Negotiable for a dual-component theory, but arguably impossible to satisfy fully without metaphysical commitment. I need to be honest here: it's the tension point.

