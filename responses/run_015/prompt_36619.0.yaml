      R4: $n \to n$.
      Target MU: 0 I's. $0 \pmod 3$.
      Impossible.
      Anton's error: He thought R3 changes the residue class because he focused on the absolute number, not the modular class. He thought "burning a triple" changes the "power of 2" property (true) and assumed that meant it might hit a multiple of 3 (false).

