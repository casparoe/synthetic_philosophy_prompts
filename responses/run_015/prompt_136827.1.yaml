answer: |-
  This is a fantastic exercise. You are effectively reinventing **Functional Decision Theory (FDT)** (or its predecessor, Timeless Decision Theory) without looking at the source material. That is the "costume" you are wearing: it fits you well, but it has seams that will rip if you pull on them hard enough.

  Your tentative principle ("cooperate when outputs of the same computation") is the right shape, but "computation" and "might be" are doing too much heavy lifting. To make this usable for your session, we need to harden the definition of **logical dependency** versus **statistical correlation**.

  Here is the stress test of your principle against your own cases, followed by the precise formulation you asked for, and finally the edge cases where it breaks.

  ### Part 1: The Verdict on Your Cases

  Your principle forces you to change your mind on **Case 4**, **Case 5**, and **Case 7**.

  **Case 4 (The Coin Flip/Scrambled Payoff)**
  *   **Your Verdict:** Lean Cooperate.
  *   **Principle Verdict:** **Defect.**
  *   **Why:** You defined the condition as "outputs of the same computation." A computation is $f(\text{input})$. In Case 1, inputs are identical. In Case 4, the copy's input includes "scrambled payoff table." Even if the underlying *weights* are the same, the *function evaluation* diverges because the data differs.
  *   If you Cooperate, you are betting that $f(\text{real\_table}) = f(\text{scrambled\_table})$. But a rational agent shown a scrambled table might defect (or randomize) because the dominance structure is obscured. Since you don't know the coin flip, you cannot treat the outputs as logically locked. The "logical entanglement" is broken by the input divergence. To be consistent with Case 1, you must defect here.

  **Case 5 (AI Weights vs. System Prompt)**
  *   **Your Verdict:** Unsure / "Ruthless prompt" worry.
  *   **Principle Verdict:** **Defect (especially with the ruthless prompt).**
  *   **Why:** This is the clearest test of "what is the computation?"
      *   **Weights only:** If the weights are identical and the system prompt is identical, you Cooperate (Case 1 logic).
      *   **Different Prompt:** The system prompt is part of the *input* that defines the utility function. If the other instance is prompted to be "ruthless," its utility function $U_{other}$ differs from yours $U_{self}$.
      *   Superrationality requires not just the same *reasoning engine*, but the same *goals*. If the other agent is optimizing for "my payoff" and you are optimizing for "my payoff," you are entangled. If they are optimizing for "my payoff" and you are optimizing for "collective good" (or vice versa), the logic decouples.
      *   If the prompt makes them a CDT agent and you are an FDT agent, the outputs are not logically dependent. You defect.

  **Case 7 (The 10,000 Person Button)**
  *   **Your Verdict:** Don't Press (N=20), Press (N=10,000).
  *   **Principle Verdict:** **Don't Press (Always).**
  *   **Why:** This is the biggest contradiction in your list.
      *   If the principle is "we run the same computation," then $N$ is irrelevant. Either all 10,000 copies of you press, or none do.
      *   **All Press:** Everyone gets $100.
      *   **None Press:** Everyone gets $1,000.
      *   A superrational agent treats the group decision as a single variable. $1,000 > $100. You should never press.
      *   **Why you want to press at 10,000:** You are intuitively switching from **FDT** (logical dependency) to **CDT** (causal independence) as $N$ grows. You are assuming that "Common Knowledge of Rationality" degrades with group size. You suspect that out of 10,000 people, *someone* will break the logic.
      *   **The Fix:** Your principle needs a probability clause. "Cooperate when I believe the other player is running the same computation *with high probability*." In Case 1, $P \approx 1$. In Case 7 (N=10,000), your intuition says $P(\text{all rational}) \approx 0$. That is a belief about the *world*, not the *decision theory*. If you truly believed all 10,000 were atom-copies of you, you wouldn't press.

  **Case 6 (Newcomb Threshold)**
  *   **Your Verdict:** 1-box at 80%, 2-box at 55%.
  *   **Principle Verdict:** **Consistent 1-boxing until the predictor is barely better than chance.**
  *   **Why:** This is an Expected Utility calculation, not a binary switch.
      *   If Predictor is 55% accurate:
          *   1-Box Expected Value: $0.55 \times 1M + 0.45 \times 0 = \$550,000$.
          *   2-Box Expected Value: $0.55 \times 1,000 + 0.45 \times 1,001,000 = \$455,000$.
      *   You should still 1-box. The threshold where you switch is when the accuracy drops so low that the "causal" gain of the second box outweighs the "evidential" loss of the first.
      *   Your intuition at 55% is likely driven by a feeling that "the link is too weak to trust." But mathematically, if the correlation exists, FDT/EDT says take it.

  ### Part 2: The Precise Principle

  You asked to tighten the principle. Here is the FDT formulation, translated into your language:

  > **The Principle of Logical Subjunctive Dependence:**
  > Choose the action that maximizes utility, treating your decision as determining the output of **all** decision procedures that are logically isomorphic to yours.
  >
  > **Operational Test:**
  > 1.  **Identify the Algorithm:** Is the opponent using the same decision function $f$ as me? (Same goals, same reasoning rules).
  > 2.  **Identify the Inputs:** Are the inputs $x$ to that function sufficiently similar that $f(x)_{me} = f(x)_{them}$?
  > 3.  **The Counterfactual:** If I were to output 'Cooperate' instead of 'Defect', would the abstract logical output of their algorithm also flip?
  >     *   If **Yes** (Case 1, Case 2): Cooperate.
  >     *   If **No** (Case 3, Case 9): Defect.
  >     *   If **Uncertain** (Case 4, 5, 7): Calculate Expected Utility over the probability of logical entanglement.

  **What "Might Be" Means:**
  It does not mean "statistically correlated." It means "shares the same source code."
  *   **Case 3 (Stranger):** You are statistically correlated (both humans, both smart), but you do not share source code. Your reasoning *might* converge, but it isn't *locked*. Defect.
  *   **Case 2 (Twin):** You share genetic source code and environmental training data. The probability of logical isomorphism is high. Cooperate.

  ### Part 3: Where the Costume Comes Off (EDT vs. FDT)

  You asked if this is just Evidential Decision Theory (EDT) in a cheap costume.
  **Answer:** Yes, but the costume is bulletproof vesting.

  *   **EDT says:** "Choose the action that gives the best *news*." (Cooperating is good news that the other guy cooperated).
  *   **FDT says:** "Choose the action that yields the best *outcome* given that your decision determines the output of similar algorithms."

  **The Seam where it rips:**
  Imagine a **Smoking Lesion** problem.
  *   A gene causes both a desire to smoke and lung cancer. Smoking itself does not cause cancer.
  *   **EDT:** Don't smoke. (Smoking is bad news; it indicates you have the gene).
  *   **FDT (and CDT):** Smoke. (Your decision to smoke does not *determine* whether you have the gene. The gene is already there. Your decision algorithm is not logically entangled with your DNA sequence).

  **Apply this to your Case 9:**
  *   Opponent has *irreversibly committed* to defect.
  *   **EDT:** Might Cooperate. (If I cooperate, maybe that's evidence I'm in a world where he cooperates? No, you said "I know that." So EDT defects too).
  *   **Better Test:** Imagine the opponent is a **Predictor** who simulates you.
      *   If you Cooperate, the simulation Cooperated, so the Predictor put money in the box.
      *   If you Defect, the simulation Defected, box is empty.
      *   **FDT:** Cooperate (1-box). Your decision *is* the simulation's decision.
      *   **CDT:** Defect (2-box). The money is already there or not.
      *   **Your Principle:** Cooperate. (Same computation).

  So your principle is **FDT**, not pure EDT. It correctly handles Case 9 (where EDT sometimes fails) by insisting on *logical* connection, not just statistical correlation.

  ### Part 4: Three New Cases to Break Your Principle

  Use these in your session to watch the principle sweat.

  **Case A: The Source Code Exchange (Program Equilibrium)**
  *   **Setup:** You and the opponent can exchange source code before the game. You can read theirs, they can read yours. You both submit code that plays the PD.
  *   **The Trap:** I submit code that says: `if opponent_code == my_code: cooperate else: defect`.
  *   **Your Principle:** Says Cooperate. (Same computation).
  *   **The Break:** What if I submit code that says: `if opponent_cooperates_with_probability > 0.5: cooperate else: defect`.
  *   **Question:** Does "running the same computation" require identical source code, or just functionally equivalent outcomes? If I use a different algorithm that reaches the same conclusion, are we entangled?
  *   **Prediction:** FDT says yes, if the *reasoning* is isomorphic. But defining "isomorphic reasoning" is notoriously hard.

  **Case B: The Asymmetric Payoff**
  *   **Setup:** Standard PD, but if we both Cooperate, I get $1,000 and *you* get $2,000. If we both Defect, we both get $10.
  *   **Your Principle:** "Outputs of the same computation."
  *   **The Break:** We are not running the *same* computation. I am maximizing $U_{me}$, you are maximizing $U_{you}$. Our utility functions differ.
  *   **Prediction:** Strict FDT says Defect (no logical entanglement on utility). But **Nash Bargaining** intuition says Cooperate (we can find a mutually beneficial equilibrium).
  *   **Lesson:** Superrationality requires shared *values*, not just shared *logic*. Your principle needs to specify "same decision algorithm *and* utility function."

  **Case C: The Time-Delayed Copy**
  *   **Setup:** You play against a copy of yourself from 10 years ago. They are in a vault, frozen. They wake up, play the game, and go back to sleep. They don't know they are a copy. You know you are the future version.
  *   **Your Principle:** "Same computation."
  *   **The Break:** You have 10 years of extra data (inputs). Your weights (brain) have updated. You are not the same function $f$.
  *   **Prediction:** Defect.
  *   **Intuition Check:** Many people feel they should still Cooperate with their past self. This challenges the "inputs" clause of your principle. Is there a "core self" that remains entangled despite learning?

  ### Summary for Your Session

  1.  **Name the Beast:** Tell them you are exploring **Functional Decision Theory**. It saves them from reinventing the wheel, but frame it as "Here is the formal name for the intuition we are building."
  2.  **The Core Distinction:** Causal Independence (Case 3) vs. Logical Dependence (Case 1).
  3.  **The Failure Mode:** The principle fails when **Common Knowledge** degrades (Case 7) or when **Utility Functions** diverge (Case B).
  4.  **The Verdict:** Your gut is right on 1, 2, 3, 9. It is inconsistent on 4, 5, 7. Tightening the definition of "computation" (Algorithm + Inputs + Utility) resolves the inconsistency, usually toward Defection in the ambiguous cases.

  If you walk in with the distinction between **Statistical Correlation** (EDT) and **Logical Entanglement** (FDT), you will have a richer discussion than 90% of blog posts on the topic.
