      *Wait, one constraint:* "Nothing that will make the decision theorists in the back row wince."
      I must be careful not to say "Information can hurt you." I must say "The *outcome* of acting on information can be worse than the counterfactual outcome of ignorance, but the *decision to acquire* information remains rational."
      Actually, the prompt asks me to find a "third thing" because I can't say "gather evidence" (empty) or "stop listening" (wrong). The third thing is "Maintain the policy of looking, even when specific findings hurt, and recognize that the program changed your utility function, which the theorem ignores."
