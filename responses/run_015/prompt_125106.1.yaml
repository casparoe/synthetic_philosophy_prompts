      *   **Commitment 1 (Ex Post):** Can a finding leave you worse off? Strictly, *ex post* utility can be lower than the *ex post* utility of the blind action *in that specific state*, but you can't identify that state without the info. However, the prompt asks about "worse off than if they'd never looked." If I look, I update. If I don't look, I stick with prior. In some realizations, the blind action yields a higher payoff than the informed action. (Example: Blindly betting on a coin that is actually biased heads. Info tells me it's tails-biased [false signal or just variance in estimation? No, Good assumes truthful signals]. Okay, if the signal is truthful, I update. If the world is actually Heads, but I get a signal that makes me think Tails is more likely... wait. Good's theorem assumes the signal is informative about the state.
      *   *Correction:* In specific realizations, yes, you can end up with a lower payoff than the blind action *would have produced*. (e.g., You would have bought a stock. Info says "don't". Stock goes up. You are worse off than if you hadn't looked). But you couldn't have known that. So the *policy* is sound, the *outcome* can be unlucky. I need to be clear on this distinction.
