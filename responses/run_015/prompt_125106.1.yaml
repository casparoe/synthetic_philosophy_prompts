answer: |-
  **Speech**

  Look around this room. Half the faculty here could derive the theorem I'm about to mention on a napkin. The rest of the faculty, and most of your families, have never heard of I. J. Good. That is fine. You do not need the math to understand the constraint it places on what I can tell you today.

  Good's theorem on the value of information is simple. If you are making a decision to maximize some outcome, and you can get a piece of information for free, you should always take it. In expectation, it cannot hurt you. It will either confirm what you intended to do, in which case you lose nothing, or it will persuade you to do something else, in which case you gain.

  This sounds like a mandate to be a hoarder of data. It is not. The theorem contains a sharp edge that most people miss. Information has zero value if no possible outcome of that information would change your action. If you are going to launch the policy regardless of what the model says, running the model is a waste of time. If you are going to veto the project regardless of the cost-benefit analysis, the analysis is decoration.

  This brings me to the text on your class T-shirt: "p < .05 is not a decision."

  Statistical significance is not a decision rule. A coefficient is not a policy. Under Good's framework, a signal is only valuable if it crosses a threshold that flips your choice. You can have a highly significant result that moves your probability estimate from 40 percent to 45 percent, and if your threshold for action is 50 percent, that information was worthless. You paid for it in time and attention, and you learned nothing that altered your course. Conversely, you can have a noisy, inconclusive signal that nonetheless pushes you just over the edge. The value lies in the decision boundary, not in the precision of the estimate.

  So I cannot stand here and give you the standard send-off: "Go out and gather more evidence before you decide." That is empty. If the evidence won't change your mind, gathering it is not virtue; it is procrastination.

  But I also cannot tell you the opposite: "Decide on conviction and stop listening." That violates the theorem. Free information cannot hurt you *in expectation*. Refusing to look is never the safer play, because you cannot know in advance that the look will be useless. If you knew the look was useless, you would already have the information.

  So here is the third thing. The guarantee of the theorem is *ex ante*. It applies to the policy of looking, not to the specific thing you find.

  There will be times in your careers when you request data, and that data will force you to abandon a project you liked. There will be times when the analysis reveals that the cost is higher than the budget, or the side effects are worse than the public will tolerate. In that specific moment, *ex post*, you are worse off than you would have been if you had remained ignorant. If you had never looked, you would have launched the project, and you might have gotten away with it. By looking, you constrained yourself. You took a lower realized utility in that instance to maintain the integrity of the policy that says "look before you leap."

  You must be willing to accept that trade. You are not paid to be right in every instance; you are paid to ensure that the process of decision-making remains responsive to reality. If you only look when you are sure it will confirm your hypothesis, you are not doing analysis. You are doing public relations.

  There is a second limitation to Good's theorem that matters more for this room. The theorem assumes your ends are settled. It calculates the value of information based on how well it helps you achieve a fixed goal. It has nothing to say about information that changes what you want.

  Standard decision theory treats your utility function as a constant. But that is not what happened to you for the last two years. You did not just acquire better tools for achieving your old aims. You acquired new aims. You look at a cost-benefit analysis now and you see distributional weights where you used to see totals. You look at a risk assessment and you see equity where you used to see efficiency. The theorem cannot account for that. It assumes you know what you are maximizing. This program taught you to question the objective function itself.

  That is why you are dangerous to the status quo, and that is why you will be frustrating to work with.

  You are going into jobs where you will be asked for "one more analysis" by people who have already decided. They will treat your work as a cost of doing business, a box to check before they proceed with the plan they made last month. Good's theorem tells you exactly how to handle this. If their decision is already fixed, your analysis has zero value to them. It is a sunk cost.

  Your job is not to produce the analysis they want. Your job is to keep the decision open for as long as the information has non-negative value. You do this by defining the decision threshold clearly. You tell them: "I can run this model, but if the result falls in this range, will you change your mind? If not, do not ask me to run it."

  It is a dry way to live, I know. It removes the comfort of intuition. It requires you to admit that sometimes, looking hurts. It requires you to admit that the value of your education is not just in the answers you can provide, but in the questions you can force others to ask.

  The theorem says free information cannot hurt you in expectation. It does not promise that it will make you popular. It does not promise that the specific finding won't be inconvenient. It only promises that if you commit to the policy of looking, and if you remain willing to act on what you find, you will do better than if you commit to blindness.

  Go be the person who keeps the decision open. Go be the person who knows the difference between a signal and a decision. And go be the person who remembers that the math assumes you know what you want, but the world requires you to decide it.

  ***

  **Speaker's Note**

  **On *Ex Post* Outcomes:** I have taken the position that a specific realization of information can leave an agent worse off in terms of realized utility than if they had remained ignorant, provided the information leads them to switch to an action that yields a lower payoff in the actual state of the world. This is consistent with Good's theorem. The theorem guarantees non-negative value *in expectation* (averaged over all possible signal realizations), not in every specific realization. If I refuse information, I stick with the prior-optimal action. If I accept information, I might switch to an action that is optimal *given the signal* but suboptimal *given the true state*. I can state that the *outcome* can be worse, but I must not imply that the *decision to acquire* the information was irrational. The speech draws this line: "In that specific moment, ex post, you are worse off... By looking, you constrained yourself."

  **On Changing Aims:** I have committed to the view that Good's theorem falls silent on information that changes the agent's utility function. This is fair. Standard Bayesian decision theory treats preferences (the utility function) as exogenous parameters, not variables to be updated by evidence. While there is literature on endogenous preference change, Good's original formulation and the standard VoI framework used in policy analysis assume fixed ends. The speech uses this to distinguish technical training (better means) from the program's deeper impact (changed ends).

  **Corrections:** Your understanding of the theorem in the prompt is technically sound. Specifically, your claim that a free signal is worth nothing unless *some* realization would change the action is correct (if no realization changes the action, the Expected Value of Information is zero). Your claim that free information cannot hurt *in expectation* is also correct. I have not needed to correct any misstatements, only to sharpen the distinction between *ex ante* expectation and *ex post* realization for the sake of the audience.
