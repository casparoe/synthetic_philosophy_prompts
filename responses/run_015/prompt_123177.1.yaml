      *Refining the Specific Questions:*
      1. *Symmetry:* You argue that in normative domains, steadfastness is warranted because peers weight incommensurable values differently despite identical evidence. However, the standard symmetry objection suggests that if two agents are equally rational and informed, the mere fact of disagreement constitutes higher-order evidence that one is likely in error. How do you block this inference without implicitly conceding that your own weighting scheme is epistemically privileged in a way that violates the peer condition?
      *Follow-up:* If you respond that normative truths are not truth-apt in the same way as empirical claims, does this not render your steadfastness merely pragmatic rather than epistemic, thereby sidestepping the disagreement problem rather than solving it?
      2. *Climate/Risk:* Consider disputes among equally credentialed climate scientists regarding policy thresholds, where the disagreement stems not from data interpretation but from divergent risk tolerances regarding catastrophic outcomes. Does your distinction between evidential disagreement and value-weighting disagreement survive here, or does the entanglement of risk assessment and empirical modeling force these cases back into the conciliationist camp?
      *Follow-up:* Should you maintain that risk tolerance is purely pragmatic, how do you prevent this pragmatic label from shielding substantive normative disagreements about safety and justice from the conciliatory pressures that might otherwise foster consensus?
      3. *Collapse:* Critics might argue that value-weighting is itself often evidentially sensitive, shaped by upbringing, culture, and prior reasoning, suggesting that discovering a peer weights values differently is itself empirical evidence about the reliability of one's own weighting. Does your view ultimately collapse into a disguised conciliationism once we allow that the provenance of our value commitments is subject to epistemic evaluation?
      *Follow-up:* If you insist that core values are foundational and immune to such evidence, what resources do you have to explain moral progress without conceding that past steadfastness was often an obstacle to recognizing better-weighted values?

      *Other Questions:*
      4. How do you reconcile the demand for epistemic humility in empirical domains with the robust confidence you prescribe for normative domains, given that our normative intuitions are often causally dependent on the same cognitive faculties we use for empirical reasoning?
      5. In defining peerhood within the normative domain, if shared evidence is not the primary criterion due to the incommensurability of values, what metric do you propose to ensure we are not simply dismissing dissenters as non-peers to protect our own steadfastness?
      6. What are the potential institutional dangers of encouraging academics or policymakers to adopt steadfastness in normative debates, particularly if it legitimizes ignoring dissenting voices under the guise of incommensurable value frameworks?
      7. How does your framework account for historical instances where normative steadfastness against a peer consensus, such as in abolitionist movements, was morally correct, without implying that steadfastness is only justified retroactively by success?
      8. Is it psychologically coherent for a single agent to toggle between conciliationist and steadfastist modes depending on the domain, or does the habit of steadfastness in ethics inevitably bleed into and corrupt one's handling of empirical uncertainty?
      9. If two peers agree on all empirical facts and normative principles but disagree on the application due to value weighting, at what point does the disagreement become substantive enough to warrant conciliation rather than steadfastness?
      10. Does your domain-restricted approach imply that interdisciplinary collaboration is epistemically hazardous, since it frequently mixes empirical and normative claims in ways that make separating the two domains impossible for the participants?

