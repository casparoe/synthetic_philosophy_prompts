  7.  **Final Review against constraints:** Did I answer the specific questions about the suicide montage? Yes. The romance? Yes. What the movie adds? Yes. Did I avoid just saying "It's Sisyphus"? Yes.

  *(Self-Correction Note)*: Make sure to emphasize that Phil *doesn't* tell Rita about the loop. This is key for the romance argument. It means the relationship is based on the "new" Phil, not the shared secret.

