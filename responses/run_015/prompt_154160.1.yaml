      *   *Section 2: Wolf's Fitting Fulfillment.* This is the strongest fit. Map Phil's phases to Wolf's criteria. Hedonism (Subjective only) fails. Altruism (Subjective + Objective) succeeds. The "God" phase is interesting (Objective skill, but selfish Subjective aim).
      *   *Section 3: Metz and Fundamentality.* Focus on "connection." The loop isolates him (only he remembers). Meaning comes from connecting to the *needs* of others, even if they don't remember. The "Fundamental" thing is moral agency.
