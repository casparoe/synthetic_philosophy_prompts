answer: |-
  ### Decision Tree: Force, Justice, and Opinion

  **Root Premise:** "That a rule is coercively enforced and generally obeyed does not by itself make it just." (All students start here.)

  ---

  #### Node 1: The Boundary Case (Moral Geography)
  **Case:** You transport goods across a latitude line. North of the line, this transfer is theft; South of the line, it is lawful inheritance. The physical act is identical; only the jurisdiction changes.
  **Question:** Does your *moral obligation* to return the goods change the instant you cross the line, even if your private sense of fairness does not?
  *   **Yes (Obligation changes):** Go to **Node 2**.
  *   **No (Obligation remains constant):** Go to **Node 4**.

  #### Node 2: The Usurpation Case (The Weight of Time)
  **Case:** A regime's title to rule rests on a forgery committed two centuries ago. The forgery is now publicly uncovered. The regime is currently stable and protects property.
  **Question:** Does the discovery of the forgery immediately invalidate the regime's right to command obedience, or does the length of undisturbed possession cure the defect?
  *   **Invalidates (Origins matter):** Go to **Node 3**.
  *   **Cures (Prescription matters):** Go to **Leaf A** or **Leaf B**.

  #### Node 3: The Design Case (The Role of Illusion)
  **Case:** You are advising a new constitutional court. Compliance depends on subjects believing the law is ancient and sacred, but you know the legal foundations are recent and arbitrary.
  **Question:** Is it permissible to use archaic robes and ritual to sustain the belief in sacredness, knowing the belief is factually false?
  *   **Yes (Manage opinion):** **Leaf C**.
  *   **No (Demand transparency):** **Leaf D**.

  #### Node 4: The Insider Case I (Conduct)
  **Case:** You are a judge. You have traced the law back to its origin and found it rests on force and accident, not pure reason.
  **Question:** Are you obligated to enforce the law anyway, provided it does not command explicit evil?
  *   **No (Refuse enforcement):** **Leaf E**.
  *   **Yes (Enforce):** Go to **Node 5**.

  #### Node 5: The Insider Case II (Conscience)
  **Case:** Same judge. You are enforcing the law.
  **Question:** Must you also cultivate an *inner belief* that the law is just, or is outward compliance sufficient while privately doubting?
  *   **Inner belief required:** Go to **Node 6**.
  *   **Outward compliance sufficient:** Go to **Leaf F** or **Leaf G**.

  #### Node 6: The Force Case (Ontology)
  **Case:** Consider the relation between the sword and the scale.
  **Question:** Does force *protect* a justice that exists independently, or does the settlement of force *constitute* the only justice available to us?
  *   **Protects (Independent standard):** **Leaf H**.
  *   **Constitutes (No independent standard):** **Leaf I**.

  ---

  ### The Leaves (Positions & Commitments)

  **Leaf A: The Prescriptionist**
  *   **Description:** Time transforms usurpation into legitimacy; stability is the primary political good.
  *   **Awkward Commitment:** You must defend the rights of a thief's great-grandchild over the rightful heir simply because enough time has passed.
  *   **Standard Name:** Burkean Conservative.

  **Leaf B: The Customary Positivist**
  *   **Description:** Justice is nothing other than what is established by local custom; there is no "outside" standpoint.
  *   **Awkward Commitment:** You cannot criticize slavery or genocide if it is sufficiently entrenched in your latitude's lawful custom.
  *   **Standard Name:** Legal Conventionalist.

  **Leaf C: The Pascalian Statesman**
  *   **Description:** Illusion is a necessary charitable veil; we must dress force in justice because human weakness cannot bear the naked truth.
  *   **Awkward Commitment:** You are committed to systematically deceiving the populace for their own good, making you a benevolent manipulator.
  *   **Standard Name:** Noble Lie Theorist (Platonic/Pascalian).

  **Leaf D: The Rationalist Reformer**
  *   **Description:** Authority must be transparent to be legitimate; ceremony that hides arbitrariness is an affront to reason.
  *   **Awkward Commitment:** You risk collapsing social order if the public proves incapable of bearing the truth of authority's arbitrary origins.
  *   **Standard Name:** Enlightenment Rationalist.

  **Leaf E: The Conscientious Objector**
  *   **Description:** Individual recognition of injustice trumps the duty of civil obedience; knowledge creates a veto.
  *   **Awkward Commitment:** You must accept that if everyone reasons as you do, civil war is the inevitable result of honest inquiry.
  *   **Standard Name:** Perfectionist Anarchist.

  **Leaf F: The Cynical Realist**
  *   **Description:** Justice is merely the name power gives to its own decrees; the judge enforces order, not truth.
  *   **Awkward Commitment:** You cannot consistently claim your own position is "more just" than the tyrant's, only that it is stronger or preferable to you.
  *   **Standard Name:** Thrasymachean Realist.

  **Leaf G: The Tragic Dualist**
  *   **Description:** The world is corrupted; we must uphold flawed laws to prevent worse chaos, while mourning their imperfection.
  *   **Awkward Commitment:** You live a life of structured hypocrisy, publicly affirming what you privately know is partially false.
  *   **Standard Name:** Augustinian Political Theologian.

  **Leaf H: The Natural Lawyer**
  *   **Description:** True justice exists and is knowable; positive law is just only insofar as it approximates this standard.
  *   **Awkward Commitment:** You must explain why a just God/Nature allows unjust laws to persist and be obeyed for centuries without correction.
  *   **Standard Name:** Classical Natural Law Theorist.

  **Leaf I: The Decisionist**
  *   **Description:** Justice is created by the decision itself; the norm follows the exception, not vice versa.
  *   **Awkward Commitment:** You have no ground to stand on to criticize a new regime that successfully overthrows the old one, as it creates its own justice.
  *   **Standard Name:** Schmittian Decisionist.

  ---

  ### Logical Space & Collapses

  **1. The Empty Quadrant (Incoherent Custom)**
  There is a logical space for a student who answers **Yes** at Node 1 (Obligation changes at the border/Conventionalism) but **Invalidates** at Node 2 (Origins matter/Universalism). This view is rarely occupied because it is unstable: if justice is merely local custom (Node 1), the age of the custom should validate it (Node 2). To claim custom determines justice *but* that ancient customs can be invalidated by abstract truths of origin is to hold two contradictory criteria of validity.

  **2. The Collapse Zone (Leaves A, C, and G)**
  Be warned: **Leaf A (Prescriptionist)**, **Leaf C (Pascalian Statesman)**, and **Leaf G (Tragic Dualist)** may collapse in practice.
  *   *Why:* All three recommend the same action: uphold the established law, maintain the ceremony, and do not dig into origins.
  *   *Distinction:* The difference is metaphysical, not practical. The Prescriptionist thinks time *makes* it right. The Pascalian thinks time *hides* that it is wrong, but we must act as if it is right. The Dualist thinks it *is* wrong, but we must uphold it to prevent sin/chaos.
  *   *Handout Note:* If a student finds themselves drifting between these three leaves, tell them they have identified the core tension in Pascal himself. The tree separates their *reasons*, but not their *recommendations*.

  **3. The Untried Path (Node 5 -> Node 6)**
  Few students occupy the path of enforcing the law (Node 5: Yes) while believing force *constitutes* justice (Node 6: Constitutes/Leaf I). Usually, those who believe force constitutes justice (Realists) do not feel a duty to enforce specific laws beyond prudence (Node 4: No/Leaf F). A student who enforces a law they admit is merely "made true by force" without any tragic regret is a rare breed of hard positivist.

  ---

  ### Confidence & Weakness Assessment

  **Overall Confidence:** High on the structural logic; Moderate on the historical attributions.
  The tree successfully forces a choice between "Justice is Local" vs. "Justice is Universal" (Node 1) and "Action" vs. "Belief" (Node 5), which are the genuine fault lines in the text.

  **Weakest Node:** **Node 5 (Insider Case II: Conscience).**
  *   **Reason:** This node risks distorting the view of the **Cynical Realist (Leaf F)**. A sophisticated realist might argue that "inward acknowledgement" is a category error—they don't *doubt* the law is just; they deny justice is a property laws can *have*. Forcing them to choose between "believing it is just" or "complying while doubting" presupposes that "justice" is a meaningful internal state they are lacking. They might reject the binary entirely, claiming they comply because it is *order*, not because they are withholding belief in *justice*.
  *   **Mitigation:** If a student objects to Node 5, allow them to move directly to **Leaf F**, noting that they reject the premise that "justice" is a matter of conscience rather than a label for stability.

  **Confidence Level:** 85%
  (The tree captures the seminar dynamics well, but the "Collapse Zone" warning is critical; without it, students will feel the tree is splitting hairs between identical political behaviors.)
