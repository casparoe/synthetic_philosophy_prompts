answer: |-
  This is a sophisticated reconstruction of the "Overdemandingness Objection" to institutional accounts of global justice (most notably associated with Thomas Pogge's *World Poverty and Human Rights*). You have correctly identified that the symmetry between domestic and global institutional complicity threatens to collapse the view into either absurdity (impossible demands) or silence (rejecting the principle).

  Here is the precise diagnosis of the argument's failure, the step you should target, and the costs of the available alternatives.

  ### The Diagnosis: The Individuation of Cost

  The precise failure lies in the **transition from (7) to (8)**, driven by an implicit assumption in the application of **Premise (1)**.

  The argument assumes that the "moderate cost" condition in (1) can be calculated **sectorally** (i.e., the cost of global reform *in isolation* vs. the cost of domestic reform *in isolation*). Step (8) treats these obligations as aggregating to an impossible sum because it assumes the costs are fixed and independent.

  However, moral costs are **holistic**. The "moderate cost" clause in (1) must be interpreted as "moderate cost *all-things-considered*, given the agent's total moral portfolio."

  **You should reject the inference to (8).**
  It is not the case that citizens face "contradictory or practically impossible demands." Rather, they face **competing *pro tanto* obligations** that must be weighed against a cumulative cost constraint.

  ### Why This Step Looked Defensible
  Step (8) relies on a **zero-sum intuition regarding political capital and resources**. It looks defensible because time, money, and political attention are indeed finite. If I spend \$X on global tax reform, I cannot spend \$X on domestic zoning reform. If both are morally mandatory, and \$X + \$Y > My Total Capacity, then (8) seems true.

  However, this ignores the **lexical or priority structure** inherent in most deontological frameworks. Obligations generated by institutional complicity are *pro tanto* (binding unless overridden by stronger moral considerations). They do not automatically become "all-things-considered" duties simply because the conditions of (1) are met in isolation. The "moderate cost" condition is the pressure valve that prevents overdemandingness, but it only works if applied cumulatively.

  ### Addressing Your Specific Constraint: Domestic Coercion
  You asked: *"Does this choice require denying that domestic institutions are genuinely coercive?"*

  **No.** This is the crucial advantage of fixing the argument at (1)/(8) rather than (6) or (7).
  You can maintain that domestic institutions are coercive and that citizens are complicit in domestic deprivation (preserving 6 and 7). You do not need to adopt a "Statist" view that denies global coerciveness or asserts domestic exceptionalism regarding coercion.

  Instead, you distinguish the **agent's relation to the coercion**:
  1.  **Domestic:** You are a *co-author* and *direct beneficiary* of a state that claims fiduciary responsibility over you. The obligation is to hold *your* agent accountable.
  2.  **Global:** You are a *beneficiary* and *participant* in an order that lacks a central fiduciary. The obligation is to reform a diffuse system.

  While both generate obligations via (1), the **efficacy** and **cost** of reform differ. It is generally *less costly* (in terms of political efficacy) to reform domestic institutions where you have a vote and a voice than to reform global institutions where leverage is diluted. Therefore, in a conflict of resources, the "moderate cost" condition for global reform may fail *because* domestic reform is prioritized, without denying the global obligation exists.

  ### Pricing the Alternatives

  If you choose not to fix the **Cost Individuation** error, here are the costs of the other paths outlined in your (10):

  #### Option A: Reject (1) (The Principle of Complicity)
  *   **The Move:** Deny that institutional maintenance generates obligations of justice; revert to a humanitarian duty of assistance.
  *   **The Cost:** You abandon the "institutional framing" you wish to preserve. You lose the ability to argue that aid is a matter of *rectification* (Step 5) rather than *charity*. This significantly weakens the normative force of your dissertation.
  *   **Verdict:** High cost. Avoid if possible.

  #### Option B: Reject (7) (Parity)
  *   **The Move:** Argue that domestic complicity is morally distinct from global complicity (e.g., domestic deprivation is a failure of implementation, global deprivation is embedded in the rules).
  *   **The Cost:** This requires a difficult empirical and philosophical defense. You must show why domestic zoning laws are less "constitutive" of harm than global trade regimes. Critics (like Cohen or Ronzoni) will argue this is ad-hoc protectionism for the wealthy state. It risks making your theory look like it is rigged to protect domestic welfare states from critique.
  *   **Verdict:** Moderate to High cost. It weakens the critical edge of your theory domestically.

  #### Option C: Reject (8) / Accept Overdemandingness
  *   **The Move:** Bite the bullet. Morality *is* demanding. If citizens cannot meet both domestic and global obligations, that is a tragedy of their circumstance, not a flaw in the theory.
  *   **The Cost:** This makes your theory practically inert. If the obligation requires the impossible (per 9), it violates "Ought Implies Can." It also alienates potential allies in domestic justice movements who will see global justice as a rival for scarce political capital.
  *   **Verdict:** High cost. Philosophically defensible (some consequentialists take this route), but politically costly for a policy-relevant dissertation.

  ### Recommendation for the Dissertation

  **Modify Premise (1) to include a Cumulative Cost Constraint.**

  Rewrite (1) roughly as:
  > "(1*) If a group of agents collectively maintains an institutional arrangement that foreseeably and avoidably produces severe deprivation, and they could support reform at moderate cost to themselves **all-things-considered (accounting for other moral obligations)**, then members of that group bear a collective obligation to reform it."

  **Then, clarify Step (5):**
  Foreign aid remains a requirement of justice *unless* the cumulative cost of providing it (alongside fulfilling domestic obligations) exceeds the "moderate" threshold.

  **Why this works for you:**
  1.  **Preserves Institutionalism:** You keep the complicity framework.
  2.  **Preserves Global Obligation:** The obligation remains; it is just sensitive to resource constraints.
  3.  **Resolves the Conflict:** It introduces a **priority rule** without denying the domestic harm. Typically, domestic reform will be prioritized because it is lower-cost/higher-efficacy for the citizen, but in cases where domestic deprivation is low (e.g., wealthy welfare states) and global deprivation is high, the "moderate cost" condition is easily met for global aid.
  4.  **Avoids the "Coercion" Trap:** You do not have to argue domestic institutions aren't coercive. You simply argue that moral agents must triage their complicity based on efficacy and total cost.

  This moves the debate from "Do we have obligations?" (which leads to the paradox) to "How do we prioritize competing obligations of complicity?" (which is a fertile ground for doctoral research).
