          *   Assessment: **Wrong.** Pettit argues they diverge. E.g., a law that tracks your interests (non-arbitrary) interferes with negative liberty but *preserves* republican liberty. A master who doesn't interfere preserves negative liberty but *violates* republican liberty.
          *   Verdict: Rejection.

      *   *Claim 11: "...and positive liberty is the odd one out."*
