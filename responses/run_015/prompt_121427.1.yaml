answer: |-
  This is a sophisticated structural problem that sits at the intersection of dynamic choice theory, risk analysis, and the ethics of expected utility maximization. You have correctly identified that while the components are familiar, the specific configuration creates a distinct failure mode that standard taxonomy does not fully capture.

  ### 1. Naming the Phenomenon

  There is no single canonical proper noun in the standard decision-theoretic lexicon (like "Allais" or "Newcomb") that exclusively denotes this specific sequential structure. It is often discussed tangentially within literature on **Dynamic Consistency**, **Longtermist Fanaticism**, and **AI Alignment** (specifically regarding "shutdown problems" or "instrumental convergence"), but it lacks a unified label.

  To carve this concept out precisely, I propose the term: **The Pascal Cascade**.

  This name captures the essential mechanics: it originates in **Pascal-style** reasoning (dominance of low-probability/high-stakes outcomes), but unlike the static "Mugging," it involves a **Cascading** series of conditional commitments where each step flows inevitably into the next, creating a cumulative lock-in that is structurally distinct from the single-shot case.

  In normative ethics (specifically longtermism), a closely related concept is sometimes called **Sequential Fanaticism**, but that term focuses on the *moral* implication (ignoring the present for the future) rather than the *structural* mechanism of the trap. **The Pascal Cascade** is the preferred term for the decision-theoretic structure itself.

  ### 2. Conceptual Carving: What It Is and Is Not

  To distinguish **The Pascal Cascade** from its relatives, we must isolate the specific topological and probabilistic features.

  #### vs. Pascal's Mugging (Single-Shot)
  *   **Pascal's Mugging:** A static choice. The agent weighs one low-probability/high-utility offer against a status quo. The paradox arises because any non-zero probability, given infinite utility, dominates finite costs.
  *   **The Pascal Cascade:** A dynamic choice. The paradox arises not from infinite utility, but from **sequential dependency**. The agent is not tricked by one huge number, but by a chain of locally rational marginal gains. The "Mugging" is a vulnerability to *magnitude*; the "Cascade" is a vulnerability to *momentum*.

  #### vs. The St. Petersburg Paradox
  *   **St. Petersburg:** The expected value of the game **diverges** (is infinite). The problem is explaining why a rational agent won't pay an infinite entry fee.
  *   **The Pascal Cascade:** The total expected value **converges** to a finite (even modest) sum. The problem is not infinite expectation, but **vanishing realization probability**. The agent is compelled to pursue a path where the probability of *any* payoff approaches zero, despite the positive expectation at every node.

  #### vs. The Money Pump
  *   **Money Pump:** Relies on **intransitive preferences** (A > B > C > A). The agent cycles back to the start, strictly worse off. It proves irrationality in the preference ordering.
  *   **The Pascal Cascade:** Preferences are **transitive and consistent**. The agent moves linearly (A → B → C...). They do not cycle. They end up with depleted resources and no payoff, but every step satisfied the Expected Utility (EU) criterion. It demonstrates a conflict between **local EU maximization** and **global risk management**, not a logical inconsistency in preferences.

  #### vs. Slippery Slope
  *   **Slippery Slope:** Usually an empirical or psychological claim (accepting A makes accepting B *more likely* due to habit, precedent, or weakened resolve).
  *   **The Pascal Cascade:** A **logical** claim. Accepting A *mathematically necessitates* the availability of B, and EU calculus *compels* accepting B. The slide is not due to human weakness, but to the structure of rational justification itself.

  ### 3. Necessary and Sufficient Conditions

  For a scenario to qualify as **The Pascal Cascade**, four conditions must be met:

  1.  **Sequential Gatekeeping:** Access to decision node $n+1$ is strictly conditional on acceptance (not just participation, but commitment) at node $n$.
  2.  **Positive Marginal Expectation:** At every node $n$, the expected utility of continuing ($p_n \times U_n + \text{Option Value}_{n+1}$) exceeds the expected utility of stopping, *conditional on having reached node $n$*.
  3.  **Probability Decay:** The cumulative probability of reaching the final payoff, $P_{\text{total}} = \prod p_i$, converges to zero (or a negligible value) as the chain lengthens.
  4.  **Capacity Constraint:** The agent operates under a constraint (capital, time, decision-capacity) where committing to the chain precludes other opportunities. The "cost" is not just the entry fee, but the **opportunity cost of locked capacity** against a near-certain null return.

  ### 4. Boundary Cases and Variations

  The conceptual edges of **The Pascal Cascade** are defined by how the probabilities and payoffs scale.

  #### A. Finite vs. Infinite Chains
  *   **Finite Chain:** If the chain has a known end $N$, a **Sophisticated Agent** (one who plans from the end backward) might refuse at Step 1 if the total EV is less than the opportunity cost.
  *   **Infinite/Unknown Chain:** If the horizon is unknown or infinite, backward induction fails. The agent is forced into **Myopic Planning** (evaluating only the next step). The Cascade thrives here. The "Lock-In" is strongest when the agent cannot calculate the global sum ex-ante.

  #### B. Decay Rates (Exponential vs. Polynomial)
  *   **Exponential Decay (Standard):** Probabilities drop as $1/2^n$, payoffs grow as $2^n$. EV is constant per step. Cumulative probability vanishes fast. This is the core Cascade.
  *   **Polynomial Decay:** Probabilities drop as $1/n^2$, payoffs grow as $n$. EV drops per step. Eventually, a rational agent *should* stop. The Cascade only holds if the payoff growth keeps marginal EV positive *indefinitely* despite probability collapse.
  *   **The Edge:** If payoff growth outpaces probability decay enough to keep marginal EV positive, but cumulative probability still vanishes, the Cascade holds. If payoff growth is too slow, the chain naturally terminates (the "Safe Boundary").

  #### C. Risk Neutrality vs. Risk Sensitivity
  *   **Risk-Neutral (Linear Utility):** The Pascal Cascade is a genuine paradox. The agent *should* accept, yet intuitively feels ruined. This highlights the insufficiency of linear EU in sequential high-variance contexts.
  *   **Risk-Averse (Log Utility):** A risk-averse agent will likely reject the chain early, as the utility of "survival" (keeping capacity) outweighs the marginal EV. Thus, **The Pascal Cascade primarily targets Risk-Neutral or Near-Neutral Agents** (e.g., large institutions, AI systems, or utilitarian calculi).

  ### 5. Philosophical Significance

  The **Pascal Cascade** reveals a fissure in Expected Utility Theory regarding **Dynamic Choice**.

  1.  **Separability vs. Plan Consistency:** Standard EU theory assumes **Separability** (the decision at node $n$ depends only on the future from $n$). The Cascade shows that Separability can lead to **Plan Inconsistency** (the sequence of locally optimal choices yields a globally dominated outcome regarding risk of ruin).
  2.  **The Problem of Fanaticism:** In moral philosophy (e.g., Longtermism), this structure explains why a purely utilitarian agent might neglect certain, near-term welfare for speculative, far-future gains. The Cascade provides the *mechanism* by which fanaticism becomes dynamically stable.
  3.  **Risk of Ruin:** It formalizes the intuition that **probability of success** matters independently of **expected value**. In sequential contexts, a strategy with positive EV but $P(\text{Success}) \to 0$ is functionally equivalent to a loss, because the agent is removed from the game (capacity exhausted) before the payoff realizes.

  ### Summary Definition

  **The Pascal Cascade** is a dynamic decision problem in which an agent, adhering to expected-utility maximization at each sequential node, becomes locked into a chain of commitments where the cumulative probability of payoff vanishes, despite positive marginal expectation at every step. It is distinguished from the St. Petersburg paradox by convergent expectation, and from Pascal's Mugging by its reliance on sequential dependency rather than single-shot magnitude. It represents a structural vulnerability in risk-neutral rationality when faced with fat-tailed, sequential opportunities under capacity constraints.
