answer: |-
  *Lord of the Flies* demonstrates that institutional supererogation is contingent on the stability of the collective agent, revealing that the boys' maintenance of the signal fire ceases to be a morally optional excess and becomes impossible once the constitutive rules of the group are violated.

  Your framing works most effectively in the novel's early chapters, where the assembly around the conch establishes a primitive corporate agent capable of bearing moral responsibilities distinct from its individual members. The signal fire functions as a paradigmatic non-distributive good: no single boy can maintain it continuously, yet the benefit (rescue) is shared, and the cost (labor, vigilance) exceeds the immediate biological imperative of hunting or eating. In this phase, aiming for rescue rather than mere subsistence on the island can be read as supererogatory because the boys *could* survive indefinitely without it; choosing to prioritize return to civilization is a collective commitment to a moral order beyond the state of nature. This aligns with your notion of institutional supererogation, as the act belongs to the "assembly" rather than any specific individual, creating a shared intentionality that transcends distributive sums.

  However, the framing collapses precisely when the collective agent fragments, illustrating a crucial philosophical limitation: supererogation requires a stable normative framework to be identified as such. When Jack splits the group in Chapter 8, he does not merely refuse the supererogatory act; he redefines the group's telos. For Jack's tribe, hunting is no longer a subordinate activity but the primary duty, rendering the fire not a moral excess but an enemy interest. The dissolution of the conch's authority means there is no longer a singular "institution" to perform the supererogatory act; the collective agent required to bear the moral status of "going beyond duty" ceases to exist. Consequently, the fire shifts from a supererogatory project of the collective to a distributive burden carried only by Ralph and Piggy, which they lack the physical power to sustain. This suggests that institutional supererogation is not just about the act itself, but about the metaphysical persistence of the group agent.

  The narrative adds a phenomenological dimension to this ethical problem that pure argumentation often misses: the visceral cost of maintaining the institutional substrate required for supererogation. Philosophical models often assume the agent's stability, but Golding shows that the "institution" (the conch/order) is maintained by the blood of its martyrs. Piggy's death in Chapter 11 is not just the loss of a life but the destruction of the rational arbiter necessary to sustain the collective intent. When Roger leans on the lever and the conch shatters, the symbolic vessel of their collective agency is destroyed alongside Piggy. Without the conch, there is no "group" to perform supererogatory acts, only scattered individuals reverting to biological imperatives. The story argues that the possibility of moral excess is parasitic on a fragile political order that must be constantly defended, often at the cost of the very lives that make the morality possible.

  Finally, the arrival of the naval officer in Chapter 12 provides an ironic commentary on the value of the supererogatory act itself, complicating the moral valuation of "rescue." The officer represents the adult world, which is itself engaged in a global war—a macroscopic version of the boys' conflict. This undermines the notion that the boys' effort to return to civilization was a movement toward a morally superior state. If the "rescue" destination is merely a larger island of conflict, the supererogatory status of the fire is destabilized; was it truly "beyond duty" to seek rescue, or was it a movement toward a different kind of barbarism? Literature captures this irony in a way abstract ethics struggles to: the officer's disappointment at the lack of "fun and games" contrasts with the horror of the hunt, suggesting that the adult world views the boys' moral struggle as trivial. This implies that institutional supererogation may be context-dependent not just on the group's stability, but on the moral worth of the institution they are trying to rejoin. For your paper, this suggests that institutional supererogation cannot be evaluated in a vacuum; it requires an assessment of the collective agent's continuity and the moral value of the end goal, both of which Golding renders profoundly unstable.
