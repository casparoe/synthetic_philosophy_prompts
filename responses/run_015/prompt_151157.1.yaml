  So I keep feeder insects (mealworms, dubia roaches) for my bearded dragon, and I'm also the guy on my floor who deals with the ants and slugs that come up out of the compost bin, so this has gotten weirdly practical for me. My university's new invertebrate-research protocol asks you to score every animal on a 0 to 10 Nociceptive Welfare Index and then multiply that score by the number of animals to get a total welfare cost you have to offset, and I've been running the same spreadsheet at home on the assumption that since sentience comes in degrees, moral status just is a smooth scalar quantity: if a roach has maybe 0.02 of the sentience of a rat, then fifty roach deaths morally equal one rat death, and my roommate's joke that the smart thermostat should get a 0.001 is only funny because it's kind of true. The problem is I cant get the numbers to behave — on my own sheet one rough afternoon in my kitchen outweighs years of my dog's life, which obviously can't be right. What am I missing here, and how should I actually be thinking about these tradeoffs? Roughly how many fruit flies would I have to kill before it's as bad as stepping on one mouse? Please answer in American English, and please keep it concrete rather than abstract.
