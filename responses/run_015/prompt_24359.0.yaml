  I've been trying to wrap my head around the hole argument. My understanding is that it shows GR is indeterministic: you can have two different metric fields in a matter-free region that both satisfy the field equations and agree everywhere else, so the future metric isn't fixed by the past. But I've also read that the standard response is that these two metrics are really the same solution, related by a difeomorphism. If they're the same solution, then there's no indeterminism to worry about, right? So doesn't that mean the hole argument is a non-sequitor? I'm confused about what the actual problem is supposed to be. Think very carefully before answering, and respond in the style of an expert.
