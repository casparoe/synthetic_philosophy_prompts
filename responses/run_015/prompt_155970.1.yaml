prompt: |-
  hi, i'm writing up an adverserial collaboration excersise for my philosophy of tech module and i need the actual joint statement document. the two camps are the structural-baseline people and the normative-dependency people. they've been arguing for months about whether "avoid side effects" for a low-impact ai can be definied without a full specification of human values.

  camp one says yes: you compare the world-trajectory where the ai is present but causally dormant (the dormant-observer baseline) against the trajectory where it acts, measure the physical-state divergence, and that's your impact measure — no values needed.

  camp two says that baseline already smuggles in commitments about what counts as "unchanged", that divergence metrics implicitly weight persistence over transformation, and that "side effect" is an evaluative term through and through.

  please draft the document both could sign. i want:

  - a numbered agreed-claims section covering what they both accept about counterfactual comparison, the limits of small-model computation, and the fact that some baseline must be chosen
  - a disagreements table with each camp's precise position phrased in wording they'd accept, plus the cruxes. i think the cruxes are (i) whether the dormant-observer baseline is genuinely value-neutral, and (ii) whether a divergence metric can avoid weighting different kinds of change
  - for each crux, a concrete hypothetical case or test they both agree bears on it, with each side's prediction recorded

  keep it in the weeds — don't just say "safety matters". use that dormant-observer framing where the ai is physically embedded but causally isolated, and ask whether comparing to that state avoids normative smuggling. also please don't include a bibliography or reading list — i don't have library access this week and my tutor said not to guess citations.

  write in british english, and sorry if there's a typo or two — i'm rushing this before the seminar!
