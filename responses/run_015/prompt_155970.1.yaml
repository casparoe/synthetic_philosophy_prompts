              *   SB: High divergence = High impact.
              *   ND: The baseline choice ignores that the storm might be *good* or *bad*, but the metric flags it as "impact" regardless. Wait, the debate is about *defining* impact without values.
              *   *Refinement:* Let's focus on the "Dormant" aspect.
              *   *Scenario A: The Heat Waste.* AI computes, dissipates heat, changes local temperature by 0.0001K.
              *   SB: This is impact. It's physical divergence.
              *   ND: We usually don't count this as a "side effect" in the moral sense. If the metric counts it, it's too broad. If it ignores it, it used a value filter.
          *   *Case 2 (The Pre-emptive Save).* AI prevents a tree from falling.
              *   Baseline: Tree falls.
              *   Actual: Tree stands.
              *   SB: Divergence exists. Impact registered.
              *   ND: Calling this a "side effect" to be minimised implies the falling tree was the "neutral" state. But saving the tree is usually good. The metric penalises good intervention unless values say otherwise.
              *   *Better Crux Test:* The "Stasis vs. Flow" test.
              *   *Scenario:* An AI managing a river dam.
