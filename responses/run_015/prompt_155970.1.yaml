              *   *Let's stick to the prompt's specific cruxes:* (i) Value-neutrality of dormant baseline, (ii) Weighting of change.
              *   *Test 1 (For Crux i):* The "Embedded Hardware" case. AI is on, but output cables cut. It still draws power and emits heat.
                  *   SB: This is the baseline. Any *additional* change is impact.
