      *   *Normative-Dependency (ND):* Focus on semantics/ethics. Choosing *which* null state matters. Measuring "distance" implies some changes are worse than others (or that *any* change is bad). "Side effect" implies harm/relevance, which is value-laden.

  3.  **Drafting - Section by Section:**

