              *   ND: It's value-laden. It privileges the status quo ante and assumes the AI's mere presence (energy use, heat) isn't a side effect, which is a normative choice.
              *   Crux: Is physical causality separable from normative relevance?
          *   *Issue 2: Divergence Metrics.*
              *   SB: State distance (e.g., L2 norm on state vectors) treats all physical changes equally. No weighting needed.
              *   ND: Aggregating physical changes requires weighting. Is a shattered cup equal to a shifted cloud? Choosing the metric weights persistence over transformation.
              *   Crux: Can a metric be descriptive without being evaluative?

      *   **Section 3: Test Cases/Hypotheticals:**
