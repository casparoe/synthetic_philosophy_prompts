          *   *Claim 1 (Counterfactuals):* Both agree impact is relational, not intrinsic. It requires comparing $W_{actual}$ to $W_{counterfactual}$.
          *   *Claim 2 (Computation):* Both agree we can't simulate the whole universe. We need simplified models (small-model), which introduces approximation error.
          *   *Claim 3 (Baseline Necessity):* Both agree *some* baseline is required. You can't measure deviation without a reference point. The dispute is about *which* baseline, not *if*.

      *   **Section 2: Disagreements Table:**
          *   Need columns: Issue, Structural-Baseline Position, Normative-Dependency Position, Crux.
