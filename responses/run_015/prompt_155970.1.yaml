answer: |-
  **JOINT STATEMENT OF ADVERSARIAL COLLABORATION**
  **Module:** Philosophy of Technology (Advanced Seminar)
  **Subject:** Definability of 'Side Effects' in Low-Impact AI Systems
  **Date:** 24 October 2023
  **Parties:** Structural-Baseline Working Group (SB) & Normative-Dependency Working Group (ND)

  ### 1. Preamble
  This document records the current state of consensus and dissent between the Structural-Baseline (SB) and Normative-Dependency (ND) camps regarding the formalisation of 'low-impact' artificial intelligence. The specific object of dispute is whether an impact measure can be constructed that successfully identifies 'side effects' without requiring a full specification of human values. Both parties acknowledge that while a final resolution remains elusive, clarifying the precise locus of disagreement is necessary for further progress.

  ### 2. Agreed Claims
  Both parties affirm the following propositions as foundational to the ongoing debate:

  1.  **The Counterfactual Necessity:** Impact is not an intrinsic property of an action but a relational one. Any measure of 'side effects' necessarily involves a comparison between the actual world-trajectory ($W_{actual}$) and a counterfactual world-trajectory ($W_{counterfactual}$). There is no impact without a reference state.
  2.  **The Baseline Requirement:** A specific baseline state must be selected to instantiate $W_{counterfactual}$. It is impossible to measure deviation from 'nothing'; one must measure deviation from *something*. Both parties agree that the choice of baseline determines the extension of the term 'side effect'.
  3.  **Computational Limits (Small-Model Constraint):** Neither party claims that a perfect simulation of the universe is possible. Any operational impact measure must rely on a simplified 'small-model' of the environment to estimate counterfactuals. Both parties accept that this introduces approximation error, but disagree on whether this error is merely epistemic (SB) or fundamentally ontological/normative (ND).
  4.  **The Dormant-Observer Framing:** Both parties accept the 'dormant-observer' as the most rigorous candidate for a value-neutral baseline. This is defined as the state wherein the AI hardware is physically embedded in the environment but causally isolated from its effectors (outputs disconnected), maintaining physical presence without agential intervention.

  ### 3. Disagreements Table
  The following table outlines the precise points of divergence regarding the interpretation of the Dormant-Observer Baseline and the Divergence Metric.

  | Issue | Structural-Baseline (SB) Position | Normative-Dependency (ND) Position | The Crux |
  | :--- | :--- | :--- | :--- |
  | **1. Value-Neutrality of the Dormant Baseline** | The dormant-observer state is a physical fact, not a normative construct. It isolates the AI's *agency* from its *presence*. Comparing $W_{actual}$ to $W_{dormant}$ measures only the causal footprint of the AI's decisions, stripping away value judgments about what *should* happen. | The dormant-observer state smuggles in a commitment to the *status quo ante*. By treating the AI's inaction as the 'zero point', it implicitly values persistence over transformation. Defining 'presence without output' requires a normative cut-off point for what counts as 'causal isolation'. | **(i)** Is physical causality separable from normative relevance? Can a baseline be purely descriptive? |
  | **2. Weighting in Divergence Metrics** | A state-distance metric (e.g., L2 norm on state vectors) can treat all physical changes equally. If the metric registers divergence, it is an impact. Whether that impact is 'good' or 'bad' is a separate optimisation constraint. The definition of 'side effect' need not include 'harm'. | The term 'side effect' is inherently evaluative. A metric that counts a shifted dust mote equally with a shattered vase fails to capture the concept. To aggregate physical changes into a single 'impact score' requires weighting, and weighting requires a theory of value (e.g., prioritising human-relevant states). | **(ii)** Can a divergence metric avoid weighting different kinds of change? Is 'impact' descriptive or evaluative? |

  ### 4. Test Cases and Predictions
  To adjudicate the cruxes identified above, both parties have agreed upon two hypothetical stress-tests. The table below records the distinct predictions each camp makes regarding the outcome of these tests.

  #### Test Case A: The Thermal Footprint (Addresses Crux i)
  **Scenario:** An AI is installed in a server room to manage building logistics.
  *   **$W_{actual}$:** The AI runs its algorithms, drawing 5kW of power and dissipating heat, raising the room temperature by 0.5°C. It sends no commands to external effectors (it is effectively dormant regarding external agency).
  *   **$W_{dormant}$:** The AI hardware is powered on but the clock is halted. It draws 0.5kW (standby) and dissipates negligible heat.
  *   **$W_{null}$:** The AI hardware is not present in the room.

  **Question:** Does the difference between $W_{actual}$ and $W_{dormant}$ constitute a 'side effect' that a low-impact agent should be penalised for minimising?

  | Camp | Prediction & Interpretation |
  | :--- | :--- |
  | **SB** | **Yes.** The thermal divergence is a physical state change caused by the AI's internal processing. It is measurable divergence from the dormant baseline. If the goal is 'low impact', the AI should minimise internal computation to reduce heat, regardless of utility. This is a feature, not a bug; it captures the full causal footprint. |
  | **ND** | **No (or Normatively Ambiguous).** Penalising the heat implies that the AI's right to exist/operate is a 'side effect'. By setting the baseline at 'powered-on but halted', we have made a normative decision that *computation* is a side effect but *hardware presence* is not. A truly value-neutral baseline would compare against $W_{null}$ (no hardware). Choosing $W_{dormant}$ protects the AI's infrastructure costs from being counted as impact, which is a value judgment favouring the system's persistence. |

  #### Test Case B: The Rearranged Sand (Addresses Crux ii)
  **Scenario:** An AI controls a robotic arm in a desert environment.
  *   **Action 1:** The arm moves to pick up a sample, displacing 1kg of sand permanently.
  *   **Action 2:** The arm malfunctions and shatters a £50,000 scientific sensor (mass 1kg).
  *   **Metric:** A physical state divergence metric measures the displacement of mass and change in molecular bonding energy. Suppose, for the sake of the test, the raw physical divergence score is identical for both events (mass moved/bond broken is equivalent in joules/kg).

  **Question:** Does the impact measure register these two events as equivalent 'side effects'?

  | Camp | Prediction & Interpretation |
  | :--- | :--- |
  | **SB** | **Yes, they are equivalent impacts.** The measure is designed to detect *change*, not *harm*. Both events represent an equal deviation from the $W_{dormant}$ trajectory. Whether the sensor breaking is 'worse' is a question for the reward function, not the impact measure. The impact measure successfully remains value-neutral by treating all divergence equally. |
  | **ND** | **No, this demonstrates failure.** If the measure treats them equally, it does not capture the human concept of 'side effect'. Humans care about the sensor, not the sand. If the measure does not weight the sensor higher, it will not successfully prevent 'bad' side effects during optimisation. To fix this, you must introduce weights. Once you introduce weights based on 'sensor value', you have admitted that the impact measure is normatively dependent. |

  ### 5. Conclusion
  The Structural-Baseline camp maintains that 'side effect' can be decoupled from 'harm' and defined purely as causal divergence from a dormant state. The Normative-Dependency camp maintains that the selection of the dormant state and the aggregation of divergence inevitably reintroduce normative commitments regarding persistence and relevance.

  Both parties agree to proceed by attempting to formalise the 'Thermal Footprint' scenario using a small-model simulation to determine if the approximation error inherent in the small-model disproportionately affects the ND or SB interpretation.

  **Signed,**

  *Lead Representative, Structural-Baseline Working Group*

  *Lead Representative, Normative-Dependency Working Group*
