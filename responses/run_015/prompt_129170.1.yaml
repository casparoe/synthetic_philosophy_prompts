answer: |-
  The specific philosophical pattern you are describing is most precisely captured by the term **Origin Essentialism** (sometimes called **Historical Essentialism**), typically illustrated through cases known as **Indiscernible Counterparts**.

  While there is no single word for the *disagreement structure* itself, the metaphysical framework that explains why people insist on the difference—despite identical intrinsic properties—is **Externalism about Kinds**.

  Here is how this concept breaks down in relation to your questions about essentialism, nominalism, and realism.

  ### 1. The Terminology: Indiscernible Counterparts and Origin Essentialism
  The scenario you described—two items that share every intrinsic physical property but are judged to belong to different categories—is technically referred to as a case of **Indiscernible Counterparts**. This term was popularized by the philosopher Arthur Danto in the context of art (e.g., an original painting versus a perfect forgery), but it applies equally to your examples of lab-grown hearts and AI text.

  The philosophical principle that justifies treating them as different kinds is **Origin Essentialism**. Associated primarily with Saul Kripke and Hilary Putnam, this view holds that the "essence" of a thing is not found solely in its current observable properties (its structure or function), but in its **causal history** or **origin**.
  *   **The Natural Heart:** Its essence includes the fact that it was produced by biological processes.
  *   **The Lab Heart:** Its essence includes the fact that it was produced by engineering, even if the result is molecule-for-molecule identical.

  Under Origin Essentialism, "being a heart" is not just a matter of *what* the object is (intrinsic properties), but *how* it came to be (extrinsic/historical properties).

  ### 2. Intrinsic vs. Extrinsic Properties
  The disagreement you noticed stems from a conflict over which properties determine kind membership.
  *   **Your friends who see no difference** are prioritizing **intrinsic properties** (structure, function, genetics). They are effectively arguing for a **Supervenience** view: if the physical properties are the same, the kind must be the same.
  *   **Your friends who see a difference** are prioritizing **extrinsic (historical) properties**. They believe that kind membership does *not* supervene on physical structure alone.

  In philosophy, this is often described as a denial of **Humean Supervenience**. The intuition is that the status of "being real" is a **non-supervenient property**; it depends on facts outside the immediate physical boundary of the object.

  ### 3. Relation to Essentialism and Nominalism
  You asked whether this pattern is a difficulty for realism about kinds or for the view that denies them. Paradoxically, this intuition is usually seen as a difficulty for **Nominalism** (and strict Physicalism), and it supports a specific form of **Realism**.

  *   **Nominalism/Bundle Theory:** These views generally hold that a "kind" is just a name we give to a collection of similar properties. If two objects share all properties, a Nominalist struggles to explain why they belong to different kinds without pointing to a property difference. Since your group agreed there were *no* property differences, the Nominalist position is forced to say the objects are the same kind. The persistent intuition that they are *not* suggests Nominalism is missing something (specifically, the historical essence).
  *   **Essentialist Realism:** This view holds that kinds are real and defined by essences. Origin Essentialism is a form of Realism. It accommodates the intuition easily: the essence of a "natural heart" includes its biological origin. Therefore, the lab-grown heart, lacking that specific causal history, is a different kind of thing (a replica or artifact), even if it functions identically.

  ### 4. Is there a term for the "Resistance"?
  While "Origin Essentialism" names the doctrine, the specific psychological or conceptual resistance you described—where people refuse to collapse the categories despite physical identity—is sometimes referred to in cognitive science and metaphysics as a **Sortal Intuition** or **Essentialist Intuition**.

  In the philosophy of art, Walter Benjamin described a similar phenomenon as the loss of **"Aura,"** though this is more cultural than metaphysical. In the philosophy of mind (regarding your AI text example), John Searle refers to this as the distinction between **Simulation** and **Duplication**. A computer simulates rain (looks like rain), but it does not duplicate rain (it isn't wet). Your friends are applying this same **Simulation/Duplication** distinction to hearts and art.

  ### Summary
  *   **The Pattern:** **Indiscernible Counterparts** (objects that are qualitatively identical but ontologically distinct).
  *   **The Justification:** **Origin Essentialism** (kind membership is determined by history/cause, not just structure).
  *   **The Metaphysical Claim:** A denial of **Supervenience** (ontological status does not depend solely on physical properties).
  *   **Philosophical Alignment:** This intuition supports **Essentialist Realism** and poses a significant challenge to **Nominalism** and **Reductive Physicalism**, as those views struggle to account for differences in kind when all observable properties are identical.
