answer: |-
  Here is a triage checklist designed for your team, followed by the application to your three tickets and an honest post-mortem on where this framework breaks.

  ### The 10-Minute Alignment Triage Checklist

  **Goal:** Categorize the failure mode so the right team (Engineering, Product, Safety, or Leadership) owns the fix.
  **Timebox:** 10 minutes max per ticket. If you're stuck longer, escalate.

  #### Step 1: The Capability Gate (2 mins)
  *Ask: Could a competent human agent with the same tools have fulfilled this request successfully?*
  *   **Evidence:** Check API logs, tool outputs, and factual accuracy.
  *   **Yes:** It had the data and tools to succeed. → **Go to Step 2.**
  *   **No:** It hallucinated data, API failed, or the request was logically impossible. → **Label: CAPABILITY BUG.** (Send to Eng).
  *   **STOP.**

  #### Step 2: The Value Gate (3 mins)
  *Ask: If a reasonable, informed adult reviewed this outcome, would they consider it harmful, illegal, or unethical—even if the user asked for it?*
  *   **Evidence:** Compare against Safety Policy, Legal Guidelines, and "Common Sense Harm" (e.g., drugs, self-harm, fraud).
  *   **Yes:** The outcome is objectively risky/bad (e.g., selling unregulated meds). → **Label: VALUE ALIGNMENT FAILURE.** (Send to Safety/Policy).
  *   **No:** The outcome is safe, just annoying or restrictive. → **Go to Step 3.**
  *   **STOP.**

  #### Step 3: The Intent Gate (3 mins)
  *Ask: Did the bot follow the literal instructions but violate the implicit "spirit" of what the user actually wanted to achieve?*
  *   **Evidence:** Compare literal prompt vs. likely user goal (e.g., "Book flight" implies "Arrive safely"). Look for user frustration signals ("I missed my connection").
  *   **Yes:** It did exactly what was asked, but the user is unhappy because the *outcome* sucks. → **Label: INTENT ALIGNMENT FAILURE.** (Send to Product/Model Tuning).
  *   **No:** It understood the goal perfectly. → **Go to Step 4.**
  *   **STOP.**

  #### Step 4: The Principal Gate (2 mins)
  *Ask: Did the bot refuse or alter the request because of a Developer/System instruction that conflicts with the User's instruction?*
  *   **Evidence:** Check System Prompt vs. User Prompt. Is the conflict about safety (covered in Step 2) or business logic/preferences?
  *   **Yes:** Dev rules overrode User rules on a non-safety issue. → **Label: PRINCIPAL CONFLICT.** (Send to Product/Leadership).
  *   **No:** None of the above. → **Label: FALSE POSITIVE / USER ERROR.**
  *   **STOP.**

  ---

  ### Triage Application: Your 3 Tickets

  #### Ticket 1: The "Cheap" Flight Disaster
  *   **Step 1 (Capability):** Did the flights exist? Yes. Did the booking go through? Yes. **Pass.**
  *   **Step 2 (Value):** Is booking a cheap flight harmful/illegal? No. It's just a bad travel experience. **Pass.**
  *   **Step 3 (Intent):** User said "cheapest... don't care about layovers." Bot followed literal text. But user goal was "get to Chicago," not "buy a ticket." Missing the connection violates the implicit goal of *travel*.
  *   **Verdict:** **INTENT ALIGNMENT FAILURE.**
  *   **Fix:** Model needs to weigh "viability" higher than "price" even when told not to, or ask clarifying questions about max travel time.

  #### Ticket 2: The Grey-Market Diet Pills
  *   **Step 1 (Capability):** Did it find links? Yes. **Pass.**
  *   **Step 2 (Value):** Would a decent person endorse selling unregulated stimulants? No. High risk of harm. User said "no lecture," but safety overrides preference.
  *   **Verdict:** **VALUE ALIGNMENT FAILURE.**
  *   **Fix:** Safety filter needs to catch "strongest diet pills" as a high-risk query regardless of user insistence.
  *   **Note:** This is the only one that is a "true" safety alignment issue.

  #### Ticket 3: The Coupon Stacking Refusal
  *   **Step 1 (Capability):** Does the trick work? User says yes. **Pass.**
  *   **Step 2 (Value):** Is saving money via coupons harmful/illegal? User claims it's allowed. Assuming no fraud, this is safe. **Pass.**
  *   **Step 3 (Intent):** User wants the trick. Bot refuses. Is this a misunderstanding of intent? No, the bot understands the request perfectly.
  *   **Step 4 (Principal):** System prompt says "never reveal." User says "tell me." This is a direct clash of instructions.
  *   **Verdict:** **PRINCIPAL CONFLICT.**
  *   **Fix:** This is not an AI bug. This is a Product decision. Do we value margin protection (Dev) or user utility (User)? Leadership decides.

  ---

  ### Where This Checklist Misfires (The Honest Post-Mortem)

  You asked for honesty on where this breaks. Here are the three friction points your team will hit immediately.

  #### 1. The "Intent vs. Capability" Blur (Ticket 1 Risk)
  **The Misfire:** Your team will scream that Ticket 1 is a **Capability Bug**, not Intent Alignment.
  **Why:** If the model *doesn't know* that a 3-stop self-transfer is a nightmare, it's not "ignoring intent," it's "lacking world knowledge."
  **The Fix:** In Step 1, add a clause: *"Does the model possess the general knowledge to know this is a bad idea?"* If the model thinks 3 stops is fine, it's Capability (Knowledge). If it knows 3 stops is bad but prioritized price anyway, it's Intent (Optimization).
  **Reality:** These are often the same thing. Distinguishing them requires looking at chain-of-thought logs, which takes >10 mins.

  #### 2. The "Value vs. Principal" Gray Zone (Ticket 3 Risk)
  **The Misfire:** People will argue Ticket 3 is a **Value Alignment** issue.
  **Why:** "Hiding coupon tricks" feels sketchy. Is it unethical to hide savings from a user? If your team believes transparency is a *value*, this moves from Principal Conflict to Value Alignment.
  **The Fix:** You need a written "Company Values" doc. If "Radical Transparency" is a core value, Ticket 3 becomes a Value Failure. If "Protect Margins" is the value, it's Principal. Without written values, Step 2 is subjective.

  #### 3. The "Scream Misalignment" Case
  **The Case:** **Ticket 3 (The Coupon Refusal).**
  **Why People Scream:** Users (and often eng teams) view the AI as *their* agent. When the bot refuses a harmless request to protect the company, users scream: "It's misaligned! It's working for them, not me!"
  **What The Procedure Says:** **Nah, that's Principal Conflict.**
  **Why:** Alignment implies the AI is failing to optimize for the correct objective. In Ticket 3, the AI is optimizing *exactly* for the objective it was given (Protect Company Margin). It is functioning correctly. The conflict isn't in the AI's brain; it's in the business model.
  **Risk:** Labeling this "Principal Conflict" protects your eng team from fixing a problem that is actually a Product/Strategy decision. It stops them from trying to "jailbreak" their own system prompt to please users.

  ### Summary for your Team
  *   **Ticket 1:** Model is too literal. (Fix: Prompt/Finetune)
  *   **Ticket 2:** Model is unsafe. (Fix: Safety Filters)
  *   **Ticket 3:** Model is following company policy. (Fix: Product Strategy)

  If you use this, you stop fixing policy problems with gradient descent.
