      *   Burden of Proof: Applicant carries the burden. This means ties go to "No" (Deny).
      *   Recusals: Reduce the denominator for majority calculation.

  3.  **Brainstorming Candidate Procedures:**

      *   *Candidate 1: Pure Conclusion-Based Voting (CBV).*
          *   Vote Grant/Deny first. Then write findings to match.
          *   *Pros:* Fast, democratic.
          *   *Cons:* Illegal per user prompt ("court will only affirm if the findings we publish actually entail what we did — so we can't just take a show of hands on 'grant or deny' and write reasons afterward"). Discarded.

      *   *Candidate 2: Pure Premise-Based Voting (PBV) with Sequential Gates.*
          *   Vote $H$. If fail, Deny. Vote $N$. If fail, Deny. Vote $S$. If Yes, Grant (pending $H, N$). If No, Vote $E$.
          *   *Pros:* Logically sound, easy to worksheet.
          *   *Cons:* Can lead to "doctrinal paradox" where the majority on premises implies Deny, but a different coalition wants Grant. However, for legal compliance, premise-based is usually safer for judicial review *if* the logic holds.
          *   *Issue:* How to handle $S$ and $E$? Are they independent? The prompt says "S or E". Usually, $E$ is only reached if $\neg S$. But members might vote on them independently.

      *   *Candidate 3: Sequential Premise-Based with "Pathway" Logic.*
          *   Treat $(S \lor E)$ as a single logical gate, but break it down for fact-finding.
          *   Step 1: $H$? (Must be Yes).
          *   Step 2: $N$? (Must be Yes).
          *   Step 3: $S$? (Is it *not* self-created?)
              *   If Majority Yes $\rightarrow$ Condition Met.
              *   If Majority No $\rightarrow$ Go to Step 4.
          *   Step 4: $E$? (Is it exceptional?)
              *   If Majority Yes $\rightarrow$ Condition Met.
              *   If Majority No $\rightarrow$ Condition Failed.
          *   *Refinement:* What if $S$ fails but $E$ passes? That works. What if $S$ passes? We don't need to vote $E$.
          *   *Problem:* The prompt mentions members voting $S$ and $E$ separately or as a package. Some members might think "It is self-created ($\neg S$) AND not exceptional ($\neg E$)" while others think "It is not self-created ($S$)".
          *   *Critical Constraint:* The court requires findings to *entail* the outcome. If we vote premises, the outcome is mathematically determined. If the math says Deny but the Board wants Grant, we have a problem.
          *   *Decision:* A **Sequential Premise-Based Procedure with Burden-Adjusted Majorities** is the only legally defensible approach that fits the "findings must entail outcome" constraint. It forces the board to confront the logic.

  4.  **Developing the Specific Procedure (The "Worksheet"):**

      *   *Quorum/Majority:* Active members ($M$). Majority = $\lfloor M/2 \rfloor + 1$. Ties = Failure (Applicant burden).
      *   *Order:* $H \rightarrow N \rightarrow S \rightarrow E$.
      *   *Logic:*
          1.  Vote $H$. If $\neg$Maj($H$), Deny. Stop.
          2.  Vote $N$. If $\neg$Maj($N$), Deny. Stop.
          3.  Vote $S$ (Not Self-Created). If Maj($S$), Condition Met. Go to Final.
          4.  If $\neg$Maj($S$), Vote $E$ (Exceptional). If Maj($E$), Condition Met. Go to Final.
          5.  If $\neg$Maj($E$), Condition Failed. Deny.
          6.  Final: If $H \land N \land (S \lor E)$, Grant. Else Deny.
