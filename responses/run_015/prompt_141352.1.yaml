answer: |-
  Here is the procedure, the analysis of your test cases, and the honest limits of where the theory stops and your board's conscience begins.

  ### The Procedure: "Sequential Gate with Burden-Adjusted Majority"

  This is a **Premise-Based Voting (PBV)** procedure with a **Sequential Gate**. It forces the board to establish the necessary facts before reaching the conclusion. It prevents the "discursive dilemma" by making the conclusion a mathematical output of the premises, not a separate vote.

  **The Worksheet Rules:**
  1.  **Active Members ($M$):** Count only members present and *not* recused.
  2.  **Majority Threshold:** $\lfloor M/2 \rfloor + 1$. (e.g., 9 members = 5; 8 members = 5; 7 members = 4).
  3.  **Burden of Proof:** The Applicant carries the burden on *all* elements. A tie vote equals **"No"** (failure to meet burden).
  4.  **Sequential Logic:** You do not vote on later gates if an earlier gate fails.

  **The Steps (Run in this order):**

  *   **Gate 1: Practical Hardship ($H$)**
      *   Vote: "Does the property suffer practical hardship?" (Yes/No)
      *   *If Majority No (or Tie):* **DENY.** Stop. Findings: $H$ not met.
      *   *If Majority Yes:* Proceed to Gate 2.

  *   **Gate 2: No Substantial Harm ($N$)**
      *   Vote: "Will the variance cause substantial harm to the neighborhood?" (Note: Ordinance requires *No* Harm. Vote "Yes" = No Harm found.)
      *   *If Majority No (or Tie):* **DENY.** Stop. Findings: $N$ not met.
      *   *If Majority Yes:* Proceed to Gate 3.

  *   **Gate 3: Self-Created ($S$)**
      *   Vote: "Was the hardship *not* self-created?" (Yes/No)
      *   *If Majority Yes:* **Condition Met.** Skip Gate 4. Proceed to Final.
      *   *If Majority No (or Tie):* Hardship is self-created. Proceed to Gate 4.

  *   **Gate 4: Exceptional Case ($E$)**
      *   *Only reached if Gate 3 failed.*
      *   Vote: "Is this case exceptional enough to waive the self-created bar?" (Yes/No)
      *   *If Majority Yes:* **Condition Met.** Proceed to Final.
      *   *If Majority No (or Tie):* **Condition Failed.** Proceed to Final.

  *   **Final Determination**
      *   If Gates 1, 2, and (3 or 4) are Met: **GRANT.**
      *   If any Gate Failed: **DENY.**
      *   *Clerk's Check:* Ensure the written findings match the vote counts exactly. Do not allow a "Grant" vote if the gates dictate "Deny."

  ***

  ### Why This Procedure?
  I considered three options before settling on this one:
  1.  **Conclusion-Based Voting:** Vote "Grant/Deny" first, then write findings to match. *Rejected.* You stated the court requires findings to entail the outcome. This method invites reversal because the findings are often post-hoc rationalizations that don't logically support the vote.
  2.  **Simultaneous Premise Voting:** Vote $H, N, S, E$ all at once. *Rejected.* This creates the "package" confusion you had last month. Members might vote "No" on $S$ but "Yes" on $E$, while others vote "Yes" on $S$ and don't vote $E$. Aggregating these afterwards is messy.
  3.  **Sequential Gate (Selected):** This forces the board to confront the logic step-by-step. It saves time (no need to vote $E$ if $S$ passes) and prevents inconsistent findings. It makes the "S or E" disjunction operational rather than abstract.

  ***

  ### Running Your Test Cases

  #### Case 1: Last Month's Worksheet
  *Data:* 9 Members.
  *   **H:** A, B, C, D, E, F vote Yes (6). **Pass** (Need 5).
  *   **N:** E, G, H, I vote Yes (4). A, B, C, D, F vote No (5). **Fail** (Need 5).
  *   **Procedure Action:** Stop at Gate 2.
  *   **Outcome:** **DENY.**
  *   **Findings:** Hardship exists, but variance causes substantial harm (or harm not disproven).
  *   **Why it broke you:** You likely tried to vote $S$ and $E$ simultaneously or as a package, or you tried to vote "Grant" first. Members F and G wanted to use the "Exceptional" ($E$) path, but the "No Harm" ($N$) gate failed first. This procedure protects you from that debate because $N$ is a prerequisite. You don't get to be "exceptional" if you harm the neighborhood.

  #### Case 2: Recusal + Tie + Package Conflict
  *Data:* 8 Active Members (1 recused). Majority = 5.
  *   **H:** Assume Pass (not specified, but implied we reached N).
  *   **N:** 4 Yes, 4 No. **Tie.**
  *   **Procedure Action:** Tie = Burden Not Met. Stop at Gate 2.
  *   **Outcome:** **DENY.**
  *   **The Conflict:** You noted 5 members want $E$ (Yes) while 5 vote against "S or E" as a package.
  *   **Resolution:** It does not matter. The procedure stops at $N$. The board never reaches $S$ or $E$.
  *   **Clerk's Script:** "Chair, because the vote on Substantial Harm is 4-4, the applicant has not met their burden on Gate 2. We cannot legally proceed to consider Self-Created or Exceptional status. The finding must be Deny."

  #### Case 3: The "Unjust" Result (Reliance on Staff Error)
  *Data:* 9 Members.
  *   **H:** 8-1 Yes. **Pass.**
  *   **N:** 6-3 Yes. **Pass.**
  *   **S:** 2-7 Yes (Not Self-Created). **Fail** (Majority says it *was* self-created).
  *   **E:** 3-6 Yes (Exceptional). **Fail.**
  *   **Procedure Action:** Gate 3 Failed. Gate 4 Failed. $(S \lor E)$ is False.
  *   **Outcome:** **DENY.**
  *   **The Conflict:** A show of hands on "Grant" would go 6-3 Yes.
  *   **What the Procedure Says:** The procedure mandates a **DENY**. The 6 members who want to Grant are voting against the findings they just made.
  *   **What You Do:** This is the danger zone. If you record a Grant, the court will reverse you because the findings ($S$=No, $E$=No) do not entail the outcome (Grant).
  *   **Your Move:** You must interrupt the Chair before the final vote is certified.
      *   *Script:* "Chair, we have a logical inconsistency. Six members want to Grant, but the majority found the hardship was self-created and not exceptional. If we Grant now, the findings don't support the decision, and we will lose on appeal. We have two choices: 1) Deny consistent with the findings, or 2) Re-open deliberation on 'Exceptional' ($E$) to see if we can honestly find a majority for Yes."
      *   *Risk:* If they re-open $E$ just to hit 5 votes without new evidence, that is arbitrary and capricious. But it is safer than a direct contradiction.

  ***

  ### Where the Theory Runs Out (The "Gray Zones")

  You asked where we are just guessing. Here are the three places this worksheet cannot save you:

  **1. The Definition of "Exceptional" ($E$)**
  The procedure treats $E$ as a binary vote, but "Exceptional" is a value judgment, not a fact. One board's "exceptional hardship" is another's "common mistake."
  *   *The Guess:* There is no formula for $E$. If the board votes 5-4 on $E$, the procedure says "Pass," but a court might still say "That wasn't exceptional as a matter of law." The procedure ensures *internal* consistency, not *legal* correctness of the standard.

  **2. The "Re-Deliberation" Pressure**
  In Case 3, the procedure forces a Deny. But in reality, Boards often re-vote until they get the result they want.
  *   *The Guess:* The procedure assumes the board respects the sequence. If the Chair says, "Let's vote on Grant first and fix the findings later," the procedure collapses. You have no enforcement power other than your warning on the record. If they ignore you, the procedure is worthless.

  **3. Recusal Quorum Math**
  Your ordinance likely has a quorum requirement (e.g., "5 members to conduct business").
  *   *The Guess:* If 2 members recuse, you have 7. If 3 recuse, you have 6. If 4 recuse, do you have a board? The procedure handles the *majority* calculation, but it doesn't solve what happens if recusals drop you below statutory quorum. You need to check your state enabling act for that number; the logic here assumes you have a quorum.

  ### Summary for the Hearing Room
  1.  **Print the Worksheet:** Columns for H, N, S, E. Rows for Members.
  2.  **Enforce the Sequence:** Do not let them vote $E$ if $S$ passed. Do not let them vote Grant if $N$ failed.
  3.  **Call the Ties:** Remind the Chair immediately: "Tie means Applicant didn't meet the burden. That's a No."
  4.  **Flag Inconsistencies:** If the final "Grant/Deny" vote contradicts the premise votes, state for the record: *"The findings do not entail the motion."*

  This procedure won't stop them from making bad policy decisions, but it will stop them from making *reversible* ones.
