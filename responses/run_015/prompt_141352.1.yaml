          *   Burden is on Applicant. Tie = Fail.
          *   Procedure says: Stop at N. Deny.
          *   *Complication:* "Five members want to vote E yes while five simultaneously vote against 'S or E' as a package."
          *   This implies a preference aggregation problem. 5 people think ($\neg S \land E$). 5 people think ($\neg S \land \neg E$) OR ($S \land \neg E$)?
          *   If N fails 4-4, we never reach $S$ or $E$.
          *   *Instruction:* Point out that N failure kills the application regardless of $S/E$ wishes. This prevents the "package" confusion.

      *   **Case 3 (The "Unjust" Result):**
          *   H: 8-1 (Pass).
          *   N: 6-3 (Pass).
          *   S: 2-7 (Fail, Self-Created).
          *   E: 3-6 (Fail, Not Exceptional).
