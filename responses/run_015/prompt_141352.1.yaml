          *   Procedure Outcome: Deny. (Because $S \lor E$ fails).
          *   *Advice:* This is the hard part. The procedure protects the Board from arbitrary decision-making. If they want to Grant, they must find $E$ is True. If they can't find $E$ True honestly, they must Deny. The "values call" is in the definition of Exceptional, not in ignoring the logic.

  6.  **Refining the Procedure for the "Worksheet":**
      *   Need to make it robust against the "S or E" confusion.
      *   Step 3 needs to be: "Is the hardship Not Self-Created?" (Yes/No).
      *   If Yes $\rightarrow$ Skip E.
      *   If No $\rightarrow$ Vote "Is this Exceptional?" (Yes/No).
      *   This prevents the "Package" vote which caused the mess last month.
      *   Need to address the "Inconsistent Findings" risk. If the Board votes Grant but the premises say Deny, the Clerk must flag it *before* the vote is finalized.
