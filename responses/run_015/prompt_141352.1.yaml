prompt: |-
  You're an expert in judgment aggregation and social choice theory, and I want you to think hard about this one — brainstorm two or three candidate procedures before you commit to one, and be willing to say plainly where the theory runs out and we're just guessing. Please don't give me citations or a reading list; I won't be able to look anything up from the hearing room.

  I'm the clerk (part-time attorney) to a nine-member zoning board of adjustment. We meet twice a month and grind through five or six variance applications a night; the members are volunteers, the chair is a builder, and two of them recuse themselves whenever a neighbor shows up. Findings have to be voted and entered the same evening, and our decisions get appealed, and the court will only affirm if the findings we publish actually entail what we did — so we can't just take a show of hands on "grant or deny" and write reasons afterward. Our ordinance comes down to this: grant iff there's practical hardship (H), no substantial harm to the neighborhood (N), and the hardship was either not self-created (S) or, if it was, the case is exceptional (E). So H and N and (S or E).

  I've read a bit about the discursive dilemma and premise-based versus conclusion-based voting and I get the basic trap. What I need is a procedure I can actually run on a worksheet in ten minutes: the steps in order, what counts as a sufficient answer at each, whether members vote S and E seperately or as one package (this came up last month and we fudged it), what to do with recusals and 4-4 ties given the applicant carries the burden, where the procedure just stops with a deny, where it has to stop and hand the question to the board as a values call rather than a fact call, and a fallback for when the set of majority findings is itself inconsistent or doesn't entail the outcome — one I can explain to a judge. Point out which steps are judgment calls dressed up as procedure.

  Here's last month's worksheet, which broke us (Y/N on H, N, S, E): A YNNN, B YNNN, C YNNN, D YNNN, E YYYN, F YN N Y, G N Y N Y, H N Y N N, I N Y N N. Run the procedure on that. Then run it on two more: (2) one member recuses so we're at eight, N comes out 4-4, everybody agrees the hardship is self-created, and five members want to vote E yes while five simultaneously vote against "S or E" as a package; (3) a family who built over a setback in reliance on a mistaken letter from staff — H is 8-1, N is 6-3, S is 2-7, E is 3-6, and a show-of-hands on granting would go 6-3 yes. Case 3 is the kind where I suspect your procedure gives me an answer I won't like, so tell me what it says and what I'm supposed to do with that. Finish with what the procedure can't do, and where a real board just has to deliberate.
