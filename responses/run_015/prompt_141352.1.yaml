      *   **Legal Standard:** Grant *iff* $H \land N \land (S \lor E)$.
          *   $H$: Practical Hardship.
          *   $N$: No Substantial Harm.
          *   $S$: Hardship Not Self-Created.
          *   $E$: Exceptional Case (if Self-Created).
      *   **Problem:** The "Discursive Dilemma" (doctrinal paradox). Voting on premises ($H, N, S, E$) might yield a different result than voting on the conclusion (Grant/Deny). Courts require findings to *entail* the outcome.
      *   **Requirements:** A concrete, 10-minute worksheet procedure. Needs to handle recusals, ties (burden of proof), inconsistent majorities, and the $S/E$ relationship. Must identify where theory ends and judgment begins. Must run three specific test cases.

