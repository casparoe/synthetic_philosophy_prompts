      *   *Q2 Nuance:* The user's point about weighting dollars is theoretically sound (utilitarianism with diminishing marginal utility) but practically requires the very interpersonal comparison they rejected. You can't say "$1 is worth more to the poor" without comparing the utility of $1 across people.
      *   *Q3 Nuance:* Be precise about *why* it collapses. It's because the set of admissible transformations includes those that change the *ratio* of marginal utilities arbitrarily.

