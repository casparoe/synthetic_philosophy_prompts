      *   *Key Insight for Q2:* Hypothetical compensation is a fiction that hides an interpersonal comparison. Wealth bias is intrinsic to money metrics unless you fix distribution first (which requires the forbidden comparison).
      *   *Key Insight for Q3:* The "robustness" test collapses into Pareto. If interpersonal comparisons are truly arbitrary, you can always scale a loser's pain to outweigh any aggregate gain.

  6.  **Refine the Argument (Self-Correction/Nuance):**
