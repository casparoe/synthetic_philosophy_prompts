answer: |-
  ### The Spec: Desiderata for a Co-op Pay Theory

  To serve as a public justification for a written rule in a 200-member body, a theory of desert must satisfy the following five constraints.

  1.  **Allocational Feasibility:** The theory must yield a determinate number for every member without requiring infinite information or causing administrative paralysis.
      *   *Case:* The **Team Output** problem. If value is created synergistically (A + B > A + B), the theory must provide a non-arbitrary method to slice the surplus. If it cannot decompose the contribution, it cannot allocate the pay.
  2.  **Agency-Alignment:** Rewards must track factors within the member's control, filtering out brute luck and external circumstance.
      *   *Case:* The **Risk/Luck** problem. A well-judged project that fails due to market shock must not be penalized relative to a reckless gamble that paid off due to luck. The theory must distinguish judgment from outcome.
  3.  **Burden-Recognition:** The theory must account for the subjective cost of production, not merely the objective value of the product.
      *   *Case:* The **Sick Parent** problem. Two members produce identical output; one did so while managing a crisis, the other at ease. If pay is solely for output, the theory ignores the unequal sacrifice required to generate that value.
  4.  **Intertemporal Equity:** The theory must account for past investments of labor or capital that were deferred for future yield.
      *   *Case:* The **Training** problem. A member who self-funded years of skill acquisition needs to know if the pay rule treats this as a sunk cost or a debt the co-op owes. The theory must define the amortization schedule of past sacrifice.
  5.  **Functional Stability:** The pay rule must sustain the co-op's existence over time, aligning individual retention with organizational viability.
      *   *Case:* The **Incentive vs. Desert** conflict. A member may *deserve* high pay for past heroics (Retrospective), but paying it now might distort future behavior or drain reserves needed for stability (Prospective). The theory must resolve when backward-looking justice yields to forward-looking utility.

  ***

  ### Evaluation of Requirements

  **Genuine Requirements:**
  *   **Allocational Feasibility** is genuine. A rule that cannot be calculated is not a rule.
  *   **Functional Stability** is genuine. An institution that pays itself into insolvency ceases to be a venue for desert.

  **Partisan Priors Dressed as Criteria:**
  *   **Burden-Recognition** is a prior. It assumes the wage is a compensation for *pain* rather than a price for *value*. Many economic theories reject this as conflating welfare with wage.
  *   **Agency-Alignment** is a prior. It assumes a libertarian-ish view of moral responsibility that many institutionalists reject. If the co-op owns the risk, why filter luck at the individual level?

  **The Killer Requirement:**
  **Agency-Alignment** knocks out the most candidate theories. It is easy to measure output (Feasibility) and easy to pay for retention (Stability). It is nearly impossible to measure "control" or "judgment" distinct from "outcome" in a way that 200 members will agree upon.

  ***

  ### The Collapse: Pre-Institutional Desert + Contribution + Responsibility

  You are correct to suspect the triad collapses. Here is the argument:

  1.  **Pre-Institutional Desert** claims members have moral claims prior to the co-op's specific rules (e.g., "I deserve X because I am skilled/hardworking").
  2.  **Contribution-as-Basis** ties pay to value added to the co-op.
  3.  **Responsibility Condition** demands we strip out luck from that value.

  **The Collapse:** "Contribution" is only measurable via institutional metrics (revenue, units produced). These metrics are inherently contaminated by luck (market shifts, team synergy). To satisfy the **Responsibility Condition**, you must strip the luck from the contribution. But once you strip the luck, you no longer have a measurable **Contribution**, violating **Allocational Feasibility**. If you insist on **Pre-Institutional Desert**, you ignore **Functional Stability** (e.g., paying for "skill" even if the co-op can't afford it). You can have any two, but not all three. The moment you institutionalize "contribution," you abandon "pre-institutional" moral truth. The moment you enforce "responsibility," you lose the ability to measure "contribution."

  ***

  ### View Evaluation

  **Contribution-Based View:**
  Passes Feasibility and Stability. Fails Agency-Alignment (rewards luck) and Burden-Recognition (ignores effort). It treats the sick parent and the relaxed worker identically, which feels unjust to the former.

  **Effort/Sacrifice View:**
  Passes Burden-Recognition and Agency-Alignment. Fails Feasibility (effort is unobservable/private) and Stability (rewards useless toil). It risks paying members heavily for digging holes and filling them up again.

  **Institutionalist View:**
  Passes Feasibility and Stability. Fails Pre-Institutional Desert (admits pay is purely conventional) and Agency-Alignment (accepts luck as part of the deal). It tells the training member their debt is only owed if the co-op votes to owe it.

  ***

  ### Confidence & Mind-Changing

  **Where I am over-reading:**
  The **Sick Parent** case (Burden-Recognition). I suspect you are over-reading the wage function. In most successful co-ops, this is handled by a separate welfare/hardship fund, not the pay-differential rule. Conflating the two makes the pay spec impossible. If you move this to a separate budget, the "Burden" requirement drops from the wage theory.

  **Least Confidence:**
  I am least confident that **Functional Stability** is a desert constraint rather than a pragmatic override. It is possible to construct a theory of desert that bankrupts the co-op; that makes it a *bad* rule, but not necessarily a *false* theory of desert.

  **What Changes My Mind on Impossibility:**
  I would drop the impossibility claim if you could demonstrate a **democratic metric for counterfactuals**. If the 200 members can reliably and consistently vote on "what this person would have produced absent luck" without factionalizing or gaming the system, then Agency-Alignment becomes feasible. Until a mechanism exists to measure judgment separate from outcome without administrative collapse, the triad remains broken.
