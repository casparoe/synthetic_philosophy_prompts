answer: |-
  Your instincts are excellent, and your TA is right to laugh. The passage you've found is a classic example of a "hostile popularization": it gets just enough technical detail right to sound authoritative, but frames every difference as a deficiency of intuitionism rather than a philosophical divergence. It reads like a classical mathematician explaining why intuitionists are confused, rather than a neutral report.

  Here is a claim-by-claim breakdown of what is correct, what is misleading, and what is flat-out wrong, along with an explanation of the footnote.

  ### 1. "Intuitionistic logic is simply classical logic with the law of the excluded middle deleted."
  **Verdict: Half-True (Oversimplified)**

  *   **The Grain of Truth:** Structurally, you can generate intuitionistic logic by taking a classical system (like natural deduction) and removing the rule that allows you to infer $P$ from $\neg\neg P$ (Double Negation Elimination), which is equivalent to the Law of Excluded Middle (LEM).
  *   **The Problem:** It implies LEM is just an "extra assumption" that intuitionists are being stubborn about. In reality, intuitionists argue that the *meaning* of the logical connectives ($\lor, \exists, \to$) is different. For a classical mathematician, $P \lor Q$ means "the state of the world is such that P is true or Q is true." For an intuitionist, $P \lor Q$ means "I have a proof of P or I have a proof of Q."
  *   **Your Class Context:** This explains why you derived $\neg\neg(P \lor \neg P)$. Intuitionists do not claim LEM is *false* (i.e., they do not assert $\neg(P \lor \neg P)$). They claim it is not *assertible*. They can prove that it is not the case that LEM fails, but they cannot prove LEM itself. The book makes it sound like they think $P \lor \neg P$ is false, which is wrong.

  ### 2. "They cannot use proof by contradiction at all..."
  **Verdict: Wrong**

  *   **The Confusion:** This is the most common misconception. There are two forms of "proof by contradiction":
      1.  **Proof of Negation:** Assume $P$, derive $\bot$ (contradiction), conclude $\neg P$.
      2.  **Classical Reductio:** Assume $\neg P$, derive $\bot$, conclude $P$.
  *   **The Reality:** Intuitionists **accept** (1) but **reject** (2).
  *   **Your Class Context:** You mentioned using "assume P, derive a contradiction, conclude not-P" in homework. That is valid intuitionistically! The book claims you lose this, which is false. You only lose the ability to turn a proof of "not-not-P" into a proof of "P".

  ### 3. "They cannot even work with the real numbers in the ordinary way... every function from the reals to the reals is provably continuous, which is plainly absurd and refutes the whole program."
  **Verdict: Half-True (Factually correct theorem, biased interpretation)**

  *   **The Fact:** In Brouwer's specific version of intuitionistic analysis, it is indeed a theorem that all total functions $f: \mathbb{R} \to \mathbb{R}$ are continuous.
  *   **The Bias:** Calling this "plainly absurd" is a classical prejudice.
      *   **Classical View:** A function is just a set of input-output pairs. You can define a function that jumps from 0 to 1 at $x=0$ easily.
      *   **Intuitionist View:** A function is a *rule* or a *construction*. To compute a value $f(x)$, you need finite information about $x$. If a function had a discontinuous jump, determining which side of the jump you are on might require infinite precision about $x$, which is impossible for a constructive rule. Therefore, for a constructivist, a discontinuous function isn't "false," it's *incoherent*.
  *   **Nuance:** Not *all* constructivists accept this. Errett Bishop (a later constructivist) developed analysis where not all functions are continuous. The book conflates Brouwer's Intuitionism with all Constructivism. However, for Brouwer, this is a **feature**, not a bug. It ensures that all functions are computable in a strong sense.

  ### 4. "Its truth value can change as our knowledge grows."
  **Verdict: Half-True (Philosophically loaded)**

  *   **The Idea:** Intuitionism views mathematics as a temporal activity of the mind. A statement like "There are 7 sevens in the decimal expansion of $\pi$" is neither true nor false *now* if we haven't computed it yet; it becomes true when we find it.
  *   **The Nuance:** Once a statement is proved, its truth is timeless. The "change" refers to the status of *undecided* propositions. However, many modern constructive mathematicians (like those following Bishop) try to avoid this psychological "mental construction" language and focus purely on the logical constraints of proof. The book leans heavily into Brouwer's mystical/psychological metaphysics, which not all constructivists share.

  ### 5. "Intuitionistic mathematics is really a branch of computer science rather than a rival to ordinary mathematics."
  **Verdict: Misleading (Your TA was right)**

  *   **The Grain of Truth:** This refers to the **Curry-Howard Correspondence**. In intuitionistic logic, a proof of $\exists x P(x)$ must contain a specific witness $t$ such that $P(t)$ holds. A proof of $A \lor B$ must indicate which one is true. This structure maps directly to algorithms and data types. This is why intuitionistic logic is the foundation of proof assistants (like Coq or Agda).
  *   **The Misleading Part:** Saying it is "really computer science" dismisses its claim to be mathematics. It implies intuitionists are just doing programming in disguise. In reality, they are making a philosophical claim that *all* mathematics should have this computational content. It is a rival to ordinary (classical) mathematics, not a sub-branch of CS. The "punchline" does not survive scrutiny; it's a category error.

  ### 6. The Footnote: "Intuitionistic systems actually *validate* the full axiom of choice... since choice is supposed to be the controversial principle, not excluded middle."
  **Verdict: Technically True but Contextually Deceptive**

  *   **Why it sounds backwards:** In classical set theory (ZFC), the Axiom of Choice (AC) is controversial because it asserts the existence of a choice function without telling you how to construct it. In classical logic, AC implies the Law of Excluded Middle (this is **Diaconescu's Theorem**). So, classically, if you have AC, you must have LEM.
  *   **The Constructive Twist:** In intuitionistic type theory (and Brouwer's view), a slightly different version of AC is actually valid. Why? Because if you prove $\forall x \exists y \phi(x,y)$, your proof *must* provide a method to find $y$ given $x$. That method *is* the choice function. So, $\forall x \exists y \phi \to \exists f \forall x \phi(x, f(x))$ is trivially true because the function is built into the proof of the premise.
  *   **The "Gotcha":** The footnote tries to say, "Ha! You intuitionists hate controversial principles, but you accept AC!" But they are accepting a *constructive* AC (which is tautological for them), not the *classical* AC (which implies LEM and non-constructive existence). The footnote treats "Axiom of Choice" as a single monolithic thing, ignoring that its meaning shifts between classical and intuitionistic contexts.

  ### Summary: How much to trust the text?

  *   **Trust:** The technical claim that intuitionistic logic lacks LEM, and that Brouwer's analysis proves all functions are continuous.
  *   **Distract:** The claim that intuitionists cannot use *any* contradiction (they can use Proof of Negation).
  *   **Ignore:** The claim that the continuity theorem is "absurd" (it's a coherent consequence of their definitions) and the claim that the field is "really computer science" (it's a philosophy of math with CS applications).
  *   **The Footnote:** It is a "gotcha" argument that relies on equivocation between Classical AC and Constructive AC.

  **The Bottom Line:**
  Your professor and TA are guiding you correctly. The text is written from a classical realist perspective that views intuitionism as a "restriction" or a "loss" of power. Intuitionists view classical mathematics as making "empty" claims—asserting existence without providing examples.

  The "punchline" that intuitionism is just CS fails because it ignores the philosophical core: the belief that mathematical truth is grounded in human verifiability, not platonic existence. The computational content is a *consequence* of that philosophy, not the definition of it.

  **Advice for your seminar:** When discussing this, point out the distinction between **Proof of Negation** ($P \to \bot \vdash \neg P$) and **Classical Reductio** ($\neg P \to \bot \vdash P$). That alone shows you understand the logic better than the popular book does. Regarding the continuity theorem, ask whether "absurdity" is a fair critique if the definition of "function" has changed to require computability. That shows you understand the philosophical stakes.
