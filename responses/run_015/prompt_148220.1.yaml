answer: |-
  This is a sharp set of questions. You've correctly identified that the "Kelly vs. Expected Utility" debate isn't just math; it's a fight over the metaphysics of probability and the normative structure of agency.

  Here is the breakdown of the upstream/downstream relationships, an assessment of tractability, and my recommendation for how to structure your dissertation contribution.

  ### 1. Upstream/Downstream Ranking

  **Ranking:** **Cluster 1 (Log-EU Reduction) → Cluster 2 (Repeated vs. One-Shot) → Cluster 3 (Temporal Continuity/Identity).**

  *   **Cluster 1 is the Gatekeeper.** This is the most upstream question. If Kelly betting is *nothing more* than Expected Utility (EU) maximization with a logarithmic utility function (the standard Samuelson view), then the other two clusters largely deflate.
      *   *If Cluster 1 is True:* Kelly applies to one-shots (because EU applies to one-shots), and the "temporal" aspect is just a psychological feature of the utility function, not a structural feature of the world.
      *   *If Cluster 1 is False (The Ergodicity View):* If Kelly is about *time-averages* rather than *ensemble averages* (as Ole Peters and the ergodicity economics crowd argue), then Cluster 2 becomes critical. You have to explain why a time-average norm applies to a single decision.
  *   **Cluster 2 depends on Cluster 1.** The "One-Shot" problem only exists if you reject the Log-EU reduction. If Kelly is just Log-EU, there is no "repeated vs. one-shot" problem; there is only "risk aversion." If Kelly is about ergodicity, you must explain how a statistical property of a trajectory applies to a singular event (the problem of *single-case chance*).
  *   **Cluster 3 depends on Cluster 2.** The question of agent identity across time only matters if the rationality standard *requires* time. If Kelly is just Log-EU (Cluster 1), identity is standard. If Kelly requires compounding over time (Cluster 2), then you need a theory of what persists across that time to hold the "wealth" or "belief state."

  **Does settling Cluster 1 deflate the others?**
  Yes, significantly. If you conclude "Kelly is just Log-EU," your dissertation becomes a defense of a specific utility function within standard decision theory. It's a valid project, but it loses the "Geometric Rationality" novelty. If you conclude "Kelly is *not* Log-EU (it's ergodic)," then Clusters 2 and 3 become the battleground for a new normative theory.

  ### 2. Tractability Assessment

  *   **Cluster 1 (Log-EU Reduction):** **High Tractability / Low Novelty.**
      *   *Tools:* Standard decision theory, representation theorems, revealed preference.
      *   *Risk:* This is a 60-year-old debate (Samuelson vs. Kelly). Economists have strong opinions. As a philosopher, you might get bogged down in technicalities where economists feel they have the authority. It's easy to write a paper here, but hard to say something *new*.
  *   **Cluster 2 (Repeated vs. One-Shot):** **Medium Tractability / Medium Novelty.**
      *   *Tools:* Philosophy of probability (propensity vs. frequentist), ergodicity economics, risk vs. uncertainty distinctions.
      *   *Risk:* You need to grasp the math of ergodicity breaking without doing math. The philosophical hook is the *normativity* of ensemble vs. time averages. This is currently a "hot" intersection (physics + econ + phil).
  *   **Cluster 3 (Temporal Continuity/Identity):** **Low Tractability / High Novelty.**
      *   *Tools:* Metaphysics of identity, diachronic rationality, institutional theory.
      *   *Risk:* This can easily drift into "metaphysical fluff." If you frame it as "soul continuity," it's a dead end. If you frame it as "functional persistence of the decision-maker," it's gold.

  ### 3. Is the "Temporal Continuity" Angle (Cluster 3) Productive?

  **Verdict:** It is genuinely productive, **but only if you frame it as *Diachronic Rationality* rather than *Metaphysical Identity*.**

  *   **The Trap:** If you argue "Kelly fails if I am not metaphysically the same person," reviewers will roll their eyes.
  *   **The Opportunity:** Connect Cluster 3 to the literature on **commitment, Ulysses contracts, and institutional persistence.**
      *   Geometric growth requires that the *output* of decision $t_1$ becomes the *input* of decision $t_2$. If an institution restructures, or a person undergoes a radical preference reversal (Parfitian reductionism), the "compounding" is broken.
      *   This allows you to argue that Kelly isn't just a betting strategy; it's a **constraint on agent persistence.** To be a "Kelly agent" is to commit to being the same agent tomorrow. This links geometric rationality to *autonomy* and *self-constitution*.
      *   **Why this works for philosophy:** It moves the discussion from "how much to bet" to "what kind of agent must I be to use this norm?" That is pure practical rationality.

  ### 4. Recommendation: Which Two Clusters for the Dissertation?

  For a philosophy audience caring about practical rationality (not pure math), you should build your core argument around **Cluster 2 and Cluster 3.**

  **Why not Cluster 1?**
  Make Cluster 1 your *literature review*, not your *contribution*. You should take a stance (likely the Ergodicity view, as it's more philosophically interesting), but don't make the "Is it Log-EU?" question your main fight. That fight belongs in *Econometrica*. Your fight belongs in *Philosophy & Phenomenological Research* or *British Journal for the Philosophy of Science*.

  **The Strategy:**
  1.  **Chapter/Core Argument 1 (Cluster 2): The Normativity of the Time Average.**
      *   Argue that in non-ergodic environments (where ruin is possible), the ensemble average (standard EU) is normatively defective, even for one-shots.
      *   *Philosophical Hook:* This challenges the standard "Single-Case Decision Theory." You are arguing that rational agents should act *as if* they are part of a temporal trajectory, even when facing a singleton decision, because the *structure of the world* is non-ergodic.
  2.  **Chapter/Core Argument 2 (Cluster 3): The Diachronic Agent.**
      *   Argue that adopting a Kelly/Geometric norm imposes requirements on *agent identity*.
      *   *Philosophical Hook:* If geometric rationality is correct, then "rationality" includes a duty of self-continuity. You cannot maximize geometric growth if you plan to "die" (metaphorically or literally) or radically restructure before the compounding pays off. This links betting to *commitment* and *planning agency* (Bratman/Holton style).

  **Why this combination?**
  *   **Cluster 2** establishes *why* the math matters for the real world (ergodicity breaking).
  *   **Cluster 3** establishes *what* this implies for the nature of the agent (diachronic coherence).
  *   Together, they move from "How to bet" to "How to be." That is a dissertation.

  **One Warning:**
  You must explicitly *bracket* Cluster 1. Start by saying: *"While the reduction of Kelly to Log-Utility is standard in neoclassical finance, I adopt the ergodicity framework (Peters et al.) to explore the normative consequences of treating probability as a temporal process rather than an ensemble measure."* This prevents reviewers from dismissing you on the math while freeing you to do the philosophy.

  **Summary:**
  *   **Upstream:** Cluster 1 (but treat as background).
  *   **Focus:** Cluster 2 (Ergodicity/One-Shot) & Cluster 3 (Diachronic Identity).
  *   **Pitch:** "Geometric Rationality as a Norm of Diachronic Coherence."

  This path avoids the math trap, leverages current interest in ergodicity, and delivers a distinctively philosophical payoff about the nature of agency.
