answer: |-
  This is a sharp problem. You have correctly identified that Butterfield's original definition (judging the past by the present, specifically regarding *progress*) is too narrow for the actual historiographical sins we commit. Your intuition that the error lies in a "collapse of functions" is the key. The present *must* select the topic (Function 1), but Whiggery occurs when the present is also allowed to define the categories (Function 2), assign the motives (Function 3), or determine the necessity of the sequence (Function 4).

  Here are three candidate principles designed to cut through the ambiguity, followed by a re-evaluation of your six cases and verdicts on your five new scenarios.

  ### Three Candidate Principles

  **1. The Teleology Principle (The "Goal" Test)**
  *   **Definition:** A narrative is Whiggish if it treats the present state of affairs as the *intended goal* or *inevitable outcome* of past actions, rather than as a contingent result.
  *   **Mechanism:** It imputes intentionality or inevitability where there was only ambiguity.
  *   **Tied Cases:** This distinguishes **Case 1** (Bad: data *forced* the concession, implying inevitability) from **Case 2** (Good: actors acted on reasonable premises, outcome was unintended). It also distinguishes **Case 5** (Bad: "proto-X" implies they were trying to be X) from **Case 6** (Good: lineage is retrospective, not intended).

  **2. The Essentialism Principle (The "Category" Test)**
  *   **Definition:** A narrative is Whiggish if it assumes that the *categories* we use to describe the present (e.g., "The University," "The Invention," "The Field") refer to trans-historical essences that existed in the past, rather than recognizing them as constructs of the present.
  *   **Mechanism:** It collapses the distinction between a modern label and a historical reality.
  *   **Tied Cases:** This explains why **Case 3** is Whiggish (assumes "The University" is a singular entity with an eternal essence that can "lose its way") and why **Case 4** is problematic (assumes "Invention" is a discrete, trans-historical event type rather than a context-dependent social status).

  **3. The Explanatory Closure Principle (The "Contingency" Test)**
  *   **Definition:** A narrative is Whiggish if knowledge of the *outcome* is used to suppress the *contingency of the middle*.
  *   **Mechanism:** It prunes away paths, actors, or arguments that look like dead ends from the present, making the actual sequence look like the only logical sequence.
  *   **Tied Cases:** This is the safeguard for **Case 6**. If you acknowledge the actors loathed each other and the endpoint is uncertain, you preserve contingency. If you smoothed over the loathing to make a straight line, you would violate this principle.

  ---

  ### Re-Evaluating Your Six Verdicts

  You asked me to be straight about which verdicts I would throw out. I agree with five of them, but I have significant reservations about two.

  **1. Plate Tectonics (Verdict: Whiggish/Bad)**
  *   **Status:** **Keep.**
  *   **Reason:** Violates Teleology and Explanatory Closure. It makes the victory of plate tectonics seem inevitable and the opponents irrational, using the outcome to explain the past.

  **2. Sanitary Reform (Verdict: Not Whiggish/Good)**
  *   **Status:** **Keep.**
  *   **Reason:** Respects the agency of the past actors. It separates the *validity of their reasoning* (given their data) from the *truth of their theory* (given ours).

  **3. Decline of the University (Verdict: Whiggish/Bad)**
  *   **Status:** **Keep.**
  *   **Reason:** This is the crucial insight. Whiggery does not require *progress*; it requires a *trans-historical yardstick*. By treating "The University" as an essence that is currently degraded, the historian is judging the past by a standard derived from the present's dissatisfaction. It is **Nostalgic Presentism**, which is structurally identical to Progressive Presentism.

  **4. Priority Disputes ("He didn't invent it") (Verdict: Slightly Off)**
  *   **Status:** **Throw Out / Upgrade to Bad.**
  *   **Reason:** You feel it's "less bad than 1," but I argue it is actually just as Whiggish, only via the **Essentialism Principle**. To say "he didn't invent it" requires a definition of "it" (the invention) that is detached from the historical context of what counted as invention *then*. It judges past actors by a standard (priority) that only matters to *us*. It is a form of Whiggery that focuses on *ontology* rather than *teleology*. It strips the past of its own criteria of success.

  **5. Proto-X (Verdict: Bad/Anachronistic)**
  *   **Status:** **Keep.**
  *   **Reason:** Violates Teleology. It turns historical actors into incomplete versions of ourselves.

  **6. Your Project (Verdict: Valuable/Not Whiggish)**
  *   **Status:** **Keep, with a Warning.**
  *   **Reason:** This is **Genealogy**, not Whig history, *provided* you maintain the distinction between **Lineage of Effect** vs. **Lineage of Intent**.
      *   *Whig version:* "These people were all trying to solve the problem we solve now."
      *   *Genealogical version:* "I am tracing how their disparate, conflicting actions produced the situation I am in now."
      *   *The Warning:* If you imply that their loathing was merely superficial and that they were "really" working on the same deep structure, you slip back into Essentialism (Case 4). You must keep the friction visible.

  ---

  ### Verdicts on Your Five New Scenarios

  **(a) The "Wrong Turn" Narrative (Rejects Consensus)**
  *   **Verdict:** **High Risk of Whiggery (Reverse Whig).**
  *   **Analysis:** This often fails the **Essentialism Principle**. It assumes there is a "true path" for the field (an essence) that was abandoned. If the narrative is: "In the 90s, sociological pressures caused a shift in incentives that changed our methods," that is history. If the narrative is: "In the 90s, we lost our way from the *true purpose* of the field," that is Whiggery. The present dissatisfaction is being used to define the past's purpose.

  **(b) Counterfactual / Paths Not Taken**
  *   **Verdict:** **Anti-Whig (Usually).**
  *   **Analysis:** This is the strongest tool for satisfying the **Explanatory Closure Principle**. By restoring the contingency of the middle, it prevents the outcome from doing explanatory work. *Exception:* It becomes Whig if you treat the path *not* taken as the "natural" teleology that was tragically interrupted (e.g., "If only Babbage had succeeded, we would have had AI in 1900").

  **(c) Cumulative Subjects (e.g., Concept of Function in Math)**
  *   **Verdict:** **Permissible, with Strict Boundaries.**
  *   **Analysis:** Some subjects *are* cumulative. However, the Whig trap here is assuming the *questions* were the same, not just the answers. A non-Whig history of math functions asks: "Why did *this* definition of function become useful *then*?" A Whig history asks: "How close was Leibniz to our modern definition?" As long as you track the changing *utility* of the concept rather than its approaching *truth*, you are safe.

  **(d) Movements That Believed in Progress**
  *   **Verdict:** **Not Whiggish (if reported, not adopted).**
  *   **Analysis:** If the historical actors *themselves* believed they were marching toward a telos, reporting that belief is not Whiggery. Whiggery occurs when the *historian* adopts that telos as valid. If you write, "They believed they were purifying the field, and here is how that belief shaped their actions," you are fine. If you write, "They were purifying the field, and here is how far they got," you are Whiggish.

  **(e) Your Own Thing (Endpoint Up in the Air)**
  *   **Verdict:** **Safe.**
  *   **Analysis:** Explicitly stating that the endpoint is contingent and unresolved satisfies the **Explanatory Closure Principle**. It signals to the reader: "I am using the present to select the topic (Function 1), but I am not using the present to explain the necessity of the sequence (Function 4)." This is the hallmark of responsible retrospective history.

  ### Summary Advice for the Festschrift

  Your hesitation on Case 6 is natural because it looks like Case 5. The difference is **honesty about construction**.

  *   **Case 5 (Proto-X)** lies. It claims the connection exists in the past.
  *   **Case 6 (Your Project)** tells the truth. It claims the connection exists in the *historiography*.

  If your first paragraph explicitly states: *"I am constructing a lineage from the standpoint of the present, not to claim these figures shared a goal, but to show how their conflicting efforts created the conceptual space I now occupy,"* you have inoculated yourself against the charge of Whiggery. You are not writing a history of progress; you are writing a history of *conditions of possibility*.

  Don't worry about the "Whig" label paralyzing you. Worry about **Explanatory Closure**. As long as the friction, the loathing, and the contingency remain visible in the text, the narrative holds.
