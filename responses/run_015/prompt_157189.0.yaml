  2.  **Evaluate the Core Argument (Germany vs. England):**
      *   *Germany:* The *Kirchensteuer* is indeed a surcharge on income tax collected by the state for recognized religious corporations (*Körperschaften des öffentlichen Rechts*). It is opt-in (based on registration). It is not an "established church" in the sense of the state controlling doctrine or appointments, though it does grant public law status.
      *   *England:* The Church of England is established. The Monarch is Supreme Governor. Bishops sit in the Lords. Parishes cover the whole geography (everyone belongs to a parish regardless of belief).
      *   *Verdict:* The distinction is valid. "Fiscal membership" is a good descriptor for the German model, distinguishing it from territorial establishment.

  3.  **Evaluate the French Case ("Negative Establishment"):**
      *   *Concept:* *Laïcité* (1905 law) separates church and state. State doesn't recognize or fund religions (mostly).
      *   *User's Idea:* "Negative establishment" privileging pre-1905 Catholic infrastructure.
      *   *Analysis:* This is a nuanced point. The 1905 law didn't apply to Alsace-Moselle (which still has a concordat system similar to Germany). Also, the state owns pre-1905 church buildings and is responsible for their maintenance. This is a form of indirect support. Calling it "negative establishment" is provocative but analytically interesting. It suggests that by freezing the status quo, the state implicitly privileges the dominant historical religion.
      *   *Verdict:* It's a useful heuristic, not just polemical, provided it's explained carefully. It highlights the path dependency of secularism.

  4.  **Evaluate the US Case:**
