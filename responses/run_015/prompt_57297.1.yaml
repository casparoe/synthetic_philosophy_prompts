answer: |-
  ### What the theory licenses

  Ellsberg's work distinguishes *risk* (known probabilities) from *ambiguity* (unknown probabilities). It licenses three specific formal responses to ambiguity, only one of which fits a hospital committee. First, adopting a set of admissible probability judgments (credal sets) rather than a single point estimate. Second, choosing the option that performs best under the least favorable member of that set (maximin). Third, declining to rank options and defaulting to the status quo until one dominates.

  We build **maximin within credal sets** into this workflow. We estimate a range of probable outcomes rather than a single mean, then evaluate the intervention based on the worst plausible outcome within that range. We combine this with a **status quo default** when the worst-case ambiguity exceeds a safety threshold.

  Following the other formalisms would have required different resources. Adopting full credal sets without maximin would require us to calculate expected utility across distributions we cannot quantify, demanding statistical expertise this committee lacks. Defaulting strictly to status quo without maximin would paralyze innovation; any ambiguity, however slight, would block change. Maximin allows action when the worst-case ambiguity is manageable (e.g., known side effects) but blocks it when the ambiguity is structural (e.g., unknown mechanism). This preserves the Ellsberg substance: aversion is not irrational fear, but a heuristic for unevaluable sources. It matters whether we lack information entirely, face conflicting reports, or distrust the source. This procedure treats those distinctions operationally, not philosophically.

  ### The procedure

  The committee has 40 minutes. Answer these five questions in order. If any stopping rule is triggered, vote immediately.

  **1. Is the evidence source familiar and evaluable by this committee?**
  *   *Sufficient Answer:* Yes if data comes from internal audits, FDA-cleared indications, or peer-reviewed meta-analyses of comparable populations. No if based on foreign case reports, vendor white papers, or retrospective models without prospective validation.
  *   *Stopping Rule:* If **No**, proceed to Question 2. If **Yes**, proceed to Question 3.
  *   *Rationale:* Unfamiliar sources generate source ambiguity. We treat them as higher risk until calibrated.

  **2. Can the source ambiguity be resolved within 6 months without delaying critical care?**
  *   *Sufficient Answer:* Yes if a prospective registry or limited pilot can validate the source locally. No if the condition is acute or the device is single-use.
  *   *Stopping Rule:* If **No** AND Source is Unfamiliar → **DENY**. (Exception: Compassionate Use pathway, outside this committee). If **Yes** → **PERMIT-WITH-CONDITIONS** (require data return).
  *   *Rationale:* Prevents adopting interventions where the probability space is unknowable and irreducible.

  **3. Define the Credal Set: What is the worst plausible performance in our specific population?**
  *   *Sufficient Answer:* A specific metric (e.g., false negative rate, complication rate) bounded by the lower confidence interval or expert consensus worst-case.
  *   *Stopping Rule:* If the worst-case performance causes net harm compared to status quo → **DENY**. If net benefit or neutral → Proceed to Question 4.
  *   *Rationale:* Implements maximin. We do not average out the risk; we survive the worst case.

  **4. Would commissioning further evidence reduce ambiguity or relocate it?**
  *   *Sufficient Answer:* Reduces if it converts unknown probabilities to known risks (e.g., prospective validation). Relocates if it shifts uncertainty to a new parameter (e.g., studying efficacy but ignoring implementation drift).
  *   *Stopping Rule:* If the request is to "study" the intervention without a clear endpoint → **DENY** (identifies decision avoidance). If evidence reduces ambiguity → **PERMIT-WITH-CONDITIONS**.
  *   *Rationale:* Prevents using "more research" as a way to avoid the decision to adopt or reject.

  **5. Does the intervention dominate the status quo under the worst-case scenario?**
  *   *Sufficient Answer:* Yes if even the worst-case outcome is clinically preferable to current care.
  *   *Stopping Rule:* If **Yes** → **PERMIT**. If **No** → **DENY** or **PERMIT-WITH-CONDITIONS** (if monitoring can mitigate the worst case).
  *   *Rationale:* Final check for status quo dominance.

  ### Where judgment cannot be eliminated

  This procedure mechanizes ambiguity aversion, but it cannot eliminate judgment because the inputs require human estimation. First, defining the "worst plausible performance" (Question 3) is not mathematical; it is clinical. A statistician can give a confidence interval, but only a clinician can judge if the lower bound represents a catastrophic failure mode or a manageable complication. The committee must agree on what constitutes "harm" in the maximin calculation—is it mortality, length of stay, or resource utilization? Disagreement here is not error; it is value conflict.

  Second, calibrating "familiarity" (Question 1) is subjective. A vendor's retrospective data might look internal but be biased. A foreign case report might be more honest than local politics. The committee must judge the *trustworthiness* of the source, not just its origin. This requires experience this procedure cannot encode.

  Third, the "decision avoidance" check (Question 4) requires discerning intent. Is the request for a pilot a genuine attempt to reduce ambiguity, or a way to deploy a technology without accountability? The procedure flags the structure, but humans must judge the motive. Finally, the status quo itself is often ambiguous. If current care is failing, the "worst-case" of the status quo might be death. The procedure assumes the status quo is a stable baseline, but in desperate cases, it is a moving target. We cannot algorithmicize the weight of hope against the weight of evidence.

  ### Worked cases

  **(i) Unapproved implantable device, no alternatives, three foreign case reports.**
  *   *Q1 (Source):* **No.** Foreign case reports are unfamiliar and unevaluable by this committee.
  *   *Q2 (Resolve):* **No.** Single patient, acute need.
  *   *Stopping Rule:* **DENY.**
  *   *Analysis:* This aligns with your expectation. The conflation to avoid is mistaking *clinical desperation* for *epistemic reliability*. While the patient has no alternatives, the committee's mandate is intervention safety, not individual triage (which belongs to Compassionate Use/IRB). The ambiguity is irreducible (foreign data ≠ local reality). Maximin suggests unknown harm > unknown benefit.

  **(ii) Sepsis model, strong retrospective internal data, underperforms in specific subpopulation.**
  *   *Q1 (Source):* **Yes.** Internal data is familiar.
  *   *Q3 (Credal Set):* Worst-case is known underperformance in the subpopulation.
  *   *Q4 (Evidence):* Prospective monitoring reduces ambiguity.
  *   *Q5 (Dominance):* Does not dominate status quo in subpopulation, but does overall.
  *   *Stopping Rule:* **PERMIT-WITH-CONDITIONS.**
  *   *Analysis:* Aligns with expectation. Ambiguity is low (internal data), risk is known (subpopulation failure). Maximin allows this because the worst case is manageable via conditions (e.g., override protocols for that subpop). This is *risk*, not *ambiguity*.

  **(iii) Two-year pilot, weak data, clinician dependence.**
  *   *Q1 (Source):* **Yes.** Internal pilot.
  *   Q3 (Credal Set): Worst-case is mild inefficacy.
  *   *Q5 (Dominance):* Status quo now includes clinician dependence. Removing pilot causes workflow harm.
  *   *Stopping Rule:* **PERMIT-WITH-CONDITIONS** (Sunset clause).
  *   *Analysis:* The status quo has shifted. The "worst case" of removal is operational disruption. Ambiguity is tolerated because the cost of reversal is high.

  ### How this procedure will fail

  The primary failure mode is bureaucratic gaming. Clinicians will learn to frame ambiguous requests as familiar risks to bypass Question 1. They will present foreign data as "comparable" or hide subpopulation failures until after deployment. The 40-minute limit exacerbates this; deep source evaluation takes time. Under pressure, the committee will accept "Yes" to Question 1 too readily, collapsing ambiguity into risk prematurely.

  Second, the maximin rule is conservative by design. Over time, this will accumulate a backlog of denied innovations that might have been beneficial. The committee will become known as the "Department of No." This creates pressure from administration to loosen the stopping rules, leading to drift where "worst-case" is redefined as "unlikely case."

  Finally, the procedure assumes the status quo is neutral. It is not. If the status quo is harmful, ambiguity aversion protects a harmful system. The committee may deny a novel intervention because its worst-case is unknown, while ignoring that the status quo's worst-case is certain death. We risk becoming precise about the wrong variables, optimizing for safety metrics while failing patients who need high-variance solutions.

  ### What would change my mind

  I would shift weight toward imprecise evidence if a successful Bayesian rejoinder demonstrated that ambiguity aversion costs more lives than it saves. If data showed that hospitals using maximin protocols have higher mortality due to innovation stagnation than those using expected utility maximization, the heuristic is too expensive.

  Additionally, if I found that laboratory findings on ambiguity do not generalize to committees deciding about identifiable patients, I would revise this. Ellsberg choices are abstract; denying a device is concrete. If the moral weight of an identifiable patient overrides epistemic caution—making "unknown risk" acceptable when "certain death" is the alternative—then the status quo default is ethically flawed.

  My own reasoning is most likely to break on the definition of "harm" in the maximin calculation. I assume harm is physical. If harm includes loss of hope or trust, the calculation changes. I am also vulnerable to the "sunk cost" fallacy in Case (iii); I might justify continuation due to dependence rather than evidence, confusing stability with safety.
