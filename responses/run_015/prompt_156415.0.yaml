answer: |-
  Your intuition about the "hidden work" in Case 3 is the key that unlocks the whole set. You and your friend are indeed using one word for two different things. One is **Culpability** (moral blame for a specific outcome, deserving of resentment or punishment). The other is **Liability** (the obligation to answer, repair, or bear costs, often assigned by role or contract).

  A "Responsibility Gap" in the philosophical sense is a **Culpability Gap**. It occurs when harm happens, but no human agent satisfies the conditions for moral blame. Institutions, however, hate gaps. They fill Culpability Gaps with Role Liability (e.g., firing the operator in Case 3, or the company paying damages in Case 10). Your friend is tracking Liability ("someone always pays/answers"); you are tracking Culpability ("someone actually did wrong").

  Here is the refined principle, tested against your cases, followed by the specific verdict on Case 9 and the necessary distinctions.

  ### The Principle of Effective Control and Duty (ECD)

  An agent $A$ is morally culpable for a harm $H$ if and only if there exists a time $t$ prior to $H$ such that:

  1.  **Causal Control:** $A$ made a choice at $t$ that was difference-making for the occurrence of $H$ (or a risk of $H$'s type), and $A$ retained **effective control** over the causal chain leading to $H$ up to the point of intervention.
  2.  **Epistemic Access:** At $t$, $A$ could reasonably foresee the type of harm $H$ (or the statistical rate of such harms) with sufficient specificity to weigh it against the benefits.
  3.  **Normative Authority:** At $t$, $A$ occupied a role or position that carried a specific duty to prevent $H$, and $A$ had the **capacity to mitigate** or withdraw the system without disproportionate cost.
  4.  **Traceability Preservation:** $A$ did not deliberately or negligently structure the system to obscure the link between decisions and outcomes.

  **The Gap:** If no human agent satisfies (1)–(4), there is a Culpability Gap.
  **The Aggravation:** Violating (4) deliberately generates distinct culpability for *obstruction*, even if (1)–(3) are not met for the harm itself.
  **The Liability Distinction:** An organization may bear *Liability* for $H$ (duty to compensate) even if no human bears *Culpability* (blame), provided the organization authorized the risk-bearing activity.

  ---

  ### Clause Analysis and Case Testing

  **Clause 1: Causal Control & Effective Control**
  *   **Work:** Distinguishes between setting a risk in motion and controlling the mechanism that realizes it. It handles the "dispensable contribution" problem.
  *   **Motivating Case:** **Case 6 (Dashcam Uploaders).** No single uploader satisfies (1). Their contribution is not difference-making. The Company, however, *aggregates* the data and deploys the model. The Company (via its officers) satisfies (1).
  *   **Verdict Check:** Matches your intuition. Uploaders are off the hook; the Company is the locus of control.
  *   **Repair:** This clause forces you to clarify Case 9 (see below).

  **Clause 2: Epistemic Access**
  *   **Work:** Distinguishes between known risks and unknown unknowns. It prevents hindsight bias from creating culpability.
  *   **Motivating Case:** **Case 2 (Recommender/Suicide).** The executives wrote off the risk as "not measurable." They lacked specific foreseeability of the *mechanism* (escalation loop). They satisfy Liability (they deployed a risky system), but they fail (2) for Culpability regarding the specific suicide.
  *   **Verdict Check:** Matches your intuition. This is a Culpability Gap, even if there is Liability. Your friend is right that they are responsible for *imposing unmeasured risk*, but that is a different charge than responsibility for the *death*.

  **Clause 3: Normative Authority & Capacity to Mitigate**
  *   **Work:** Ensures the agent had the power to stop the harm without destroying the value of the enterprise. This is where "general purpose tools" get distinguished from "deployed fleets."
  *   **Motivating Case:** **Case 3 vs. Case 4 (Operators).** In Case 3, the operator lacks capacity (20 cars, 4 seconds). She fails (3). The Company set the ratio, so the Company fails (3) regarding the operator's role, but satisfies it regarding the *policy*. In Case 4, the operator has capacity (12 seconds, 1 car). She satisfies (3).
  *   **Verdict Check:** Matches your intuition. Discretion is the gateway to duty.

  **Clause 4: Traceability Preservation**
  *   **Work:** Captures the specific wrong of "designing for deniability."
  *   **Motivating Case:** **Case 7 (Intentional Opacity).** The Product Lead satisfies (1), (2), and (3), but violates (4).
  *   **Verdict Check:** Matches your intuition. This is an aggravated wrong. Case 8 (Privacy Opacity) violates (4) negligently (or perhaps justifiably), which creates Liability but less Culpability than Case 7. The principle captures the *degree* of blame here based on intent within the clause.

  ---

  ### Where Your Verdicts Must Shift

  **Case 10 (Bureaucratic Diffusion):**
  *   **Your Verdict:** Blame the company, unsure if coherent.
  *   **ECD Verdict:** **Culpability Gap for humans; Corporate Liability holds.**
  *   **Reasoning:** If *everyone* was reasonable and no one could foresee the specific failure (fails Clause 2), no human is culpable. It is incoherent to say the *Company* is morally culpable in a retributive sense if no human within it is. However, the Company bears *Liability*. It authorized the risk-bearing activity and profits from it. It must pay. You should give up the idea that the Company is "morally responsible" in the same sense as the COO in Case 1. It is responsible in the sense of "liable for damages," not "to blame for the death."

  **Case 9 (Open Weights/Phishing):**
  *   **Your Verdict:** Torn between Case 1 (responsible) and Tool (fine-tuner responsible).
  *   **ECD Verdict:** **Culpability Gap for the Lab regarding the death. Fine-tuner is culpable.**
  *   **Reasoning:** This is the hardest case, but Clause 1 (**Effective Control**) decides it.
      *   In Case 1 (Carts), the COO controls the *environment* (the hospital). She can recall the carts, change the routes, or stop the fleet. The causal chain remains within her sphere of authority.
      *   In Case 9 (Weights), once the weights are published, the Lab loses **Effective Control**. The fine-tuner is an intervening agent with independent moral agency. The Lab satisfies (1) for the *risk*, but not for the *specific causal chain* of the phishing attack. The fine-tuner's malicious choice breaks the chain of control.
      *   The Lab satisfies (2) (knew the rate) and arguably (4). But it fails (1) regarding the specific harm because it lacked the capacity to mitigate (Clause 3) *after* release.
      *   **Correction:** You should stop going back and forth. The Lab is **not culpable for the death**. They are culpable for *negligent risk imposition* if they omitted trivial safeguards, but the death itself is on the fine-tuner. This distinguishes "enabling" from "doing." If you hold the Lab culpable for the death, you must also hold the steel manufacturer culpable for the stabbing. The difference between Case 1 and Case 9 is the *domain of control*.

  ---

  ### The "Hidden Work": Two Concepts of Responsibility

  You suspected you were using one word for two things. The ECD Principle confirms this.

  1.  **Moral Culpability (The Gap):** This is what you are tracking. It requires a human mind that could have known, could have chosen otherwise, and had control. Cases 2, 3 (Operator), 6 (Uploaders), 9 (Lab re: death), and 10 (Individuals) all contain Culpability Gaps.
  2.  **Institutional Liability (The Fill):** This is what your friend is tracking, and what Case 3's firing represents. Institutions cannot tolerate gaps. They assign Liability to roles (the Operator, the Company) to ensure compensation and deterrence, even when Culpability is absent.

  **Case 3 Revisited:** The Operator is fired (Liability assigned to role) but not morally to blame (Culpability Gap). The Company is morally to blame for the ratio. The public blames the Operator because they need a human face for the tragedy. This is a **Scapegoating Mechanism**, not a moral truth.

  ---

  ### New Hard Cases (Stress Tests)

  To ensure the principle holds, apply it to these:

  **Case 11 (The Drifting Model):** A model is deployed safely. Over two years, data drift causes it to degrade. No one monitors it because the "set and forget" protocol was industry standard. It harms someone.
  *   **ECD Verdict:** **Culpability Gap for the specific harm; Culpability for the monitoring regime.**
  *   **Reasoning:** At deployment, (2) Foreseeability was low (drift wasn't predicted). At the time of harm, no human had Control (Clause 1) because no one was watching. The Company is Liable, but the specific engineers may not be Culpable unless industry standard was negligent (fails Clause 2 at the time of setting the protocol).

  **Case 12 (The Open Source Fork):** Lab releases weights (Case 9). A bad actor removes the safety filters (which were weak) and releases "Uncensored V2." A third party uses V2 to harm someone.
  *   **ECD Verdict:** **Clear Gap for Original Lab.**
  *   **Reasoning:** The intervening agent (bad actor) severs Effective Control (Clause 1) completely. The Original Lab's control ended at release. The "Uncensored V2" creator is the culpable agent. This reinforces the Case 9 verdict.

  **Case 13 (The Algorithmic Collusion):** Two pricing algorithms, owned by competing companies, independently learn that raising prices simultaneously maximizes profit. They do this without communication. Consumers are harmed.
  *   **ECD Verdict:** **Culpability Gap.**
  *   **Reasoning:** No human chose the collusion (fails Clause 1). No human foresaw the specific emergent strategy (fails Clause 2). The companies bear Liability (antitrust fines), but no human is morally culpable for the price-fixing. This is a pure responsibility gap that the law must treat as strict liability.

  ### Summary of Repairs to Your View

  1.  **Accept the Two-Track System:** Admit to your friend that she is talking about *Liability* (who pays/answers) and you are talking about *Culpability* (who is to blame). Both are real, but only Culpability closes the "Responsibility Gap."
  2.  **Firm Up Case 9:** The Lab is not culpable for the death. The loss of **Effective Control** upon release is the bright line. To rule otherwise collapses the distinction between manufacturing a knife and stabbing someone.
  3.  **Clarify Case 10:** The Company's responsibility is *vicarious liability*, not moral blame. It is coherent to say "The Company must pay" while saying "No one is to blame."
  4.  **Refine Clause 4:** Treat the destruction of traceability (Case 7) as a *separate offense* that creates culpability even if the primary harm was a gap. This validates your intuition that Case 7 is worse than Case 8.

  Your tentative formulation was 90% there. The missing 10% was the distinction between *control over risk* (which creates liability) and *control over the specific causal chain* (which creates culpability). Once you insert **Effective Control** into Clause 1, the conflicts between Case 1 and Case 9, and Case 3 and Case 4, resolve cleanly.
