answer: |-
  You have stumbled upon one of the most fascinating friction points in the philosophy of language and institutional economics. What you are describing is a classic case of **systematic conversational implicature** operating within a **signaling game**, protected by a layer of **institutional plausible deniability**.

  Here is a breakdown of the theoretical machinery underlying your committee's practice, and what is at stake in the system you inhabit.

  ### 1. What view of meaning does this presuppose?

  Your committee is operating on a **Gricean Pragmatic** view of meaning, while the University's legal counsel is operating on a **Semantic/Literalist** view.

  In the philosophy of language (specifically following Paul Grice), there is a distinction between *sentence meaning* (what the words literally denote) and *speaker meaning* (what the speaker intends to convey).
  *   **The Literal View:** "She is reliable" means the candidate possesses the trait of reliability.
  *   **The Pragmatic View:** "She is reliable" implies "She is not brilliant."

  This works via the **Cooperative Principle**. We assume the letter writer is cooperating with us (the hiring committee) to help us find the best candidate. However, they are constrained by social norms (don't burn a student, don't lie outright). When a writer violates the **Maxim of Quantity** (give as much information as is required) by offering a generic praise ("excellent") instead of a specific superlative ("the best in a decade"), the committee infers that the writer *could not* truthfully provide the stronger statement.

  The university's dual standard (pragmatic for hiring, literal for liability) relies on **hermeneutic asymmetry**. They require candidates to be sophisticated enough to understand the pragmatic code (reading between the lines) but reserve the right to be literalists when challenged (pointing to the text). This protects the institution: if a candidate sues, the university points to the literal truth of the rejection letter; if a candidate asks why they weren't hired, the committee points to the implicit weakness of the recommendations.

  ### 2. Does communication go beyond literal content?

  You ask if we must say the writer communicates *beyond* what her sentences say, or if this is just literal content + incentives.

  Technically, you can model this without invoking "mysterious" non-literal meaning. You can treat it as a **Bayesian update based on counterfactuals**.
  *   **Literal Content:** The text says "Excellent."
  *   **Prior Probability:** In this field, 90% of letters say "Excellent."
  *   **Counterfactual:** If the candidate were truly in the top 1%, what is the probability the writer would still only say "Excellent"? (Low).
  *   **Inference:** Therefore, the candidate is likely not in the top 1%.

  However, philosophically, it is more accurate to say the meaning *does* go beyond the sentence. The information is not carried by the words themselves, but by the **selection of words from a set of available options**. If the language were truly literal, "Excellent" would have a fixed truth condition. Since it doesn't, the "meaning" is actually the **position of this letter within the distribution of all possible letters this writer could have written.**

  So, the communication is not in the *locution* (the words), but in the *illocution* (the act of choosing those words given the context).

  ### 3. What is actually carrying the inference?

  It is a combination of the three factors you listed, but they function hierarchically:

  1.  **The Option Set (The Silence):** This is the heaviest carrier. The inference comes from what is *absent*. If a writer does not mention "independence," "creativity," or "top 5%," the absence of those specific tokens is the signal. This is sometimes called the "damning with faint praise" mechanism.
  2.  **The Model of the Writer (Calibration):** As you noted, if Writer A calls everyone "the best," their "excellent" is noise. If Writer B is known to be stingy, their "good" is a strong signal. The committee is essentially normalizing the data based on the source's historical inflation rate.
  3.  **Shared Maxims (Common Ground):** This is the glue. The system only works because "everyone knows that everyone knows" the letters are inflated. This is **common knowledge**. If a new committee member took the letters literally, they would be considered incompetent. The shared understanding of the inflation is what allows the deflation to function as a signal.

  ### 4. What would be lost if we replaced letters with explicit rankings?

  Many departments have moved toward standardized forms (e.g., "Rank this student in the top 1%, 5%, 10%"). While this seems to solve the ambiguity problem, game theory suggests it would likely degrade the system further. Here is what would be lost:

  **A. The "Safe No" (Politeness Theory)**
  Currently, the ambiguous letter allows a mentor to support a student's general employability without endorsing them for *your* specific job. A lukewarm letter says, "Hire them somewhere, just not here." If you force a ranking, a writer who believes a student is mediocre but nice is forced to either lie (rank them high) or destroy the student's career (rank them low). The ambiguity preserves the social bond between mentor and student.

  **B. Nuance of "Type"**
  Letters convey *kind*, not just *degree*. A ranking tells you how high the student is on a ladder. A letter tells you what kind of ladder they are on.
  *   *Candidate A:* Top 5% in technical skill, but difficult to work with.
  *   *Candidate B:* Top 20% in skill, but builds community and mentors others.
  A ranking flattens this. A letter can praise B's community building while being tepid about their technical output. A form forces a single metric that may not capture fit.

  **C. Signal Degradation (Goodhart's Law)**
  If you mandate rankings, the ranking becomes the metric. Immediately, the incentive structure shifts. Writers will realize that ranking a student "Top 10%" effectively disqualifies them against a candidate ranked "Top 1%." To protect their students, writers will inflate the rankings. Within three years, "Top 1%" will become the new "Excellent." You will have recreated the exact same problem, but stripped of the textual nuance that allowed you to decode the "Excellent."

  **D. Accountability and Narrative**
  A letter forces the writer to commit to a narrative. If they say a student is "creative," they usually provide an anecdote. This creates a small amount of accountability. If they lie, the lie is specific and can be checked against the candidate's portfolio. A checkbox ranking requires no evidence and offers no traction for verification.

  ### Summary

  Your committee is engaged in a high-stakes decoding ritual that relies on **pragmatic implicature** and **common knowledge of inflation**. The university maintains **literalist deniability** to manage liability.

  If you switch to explicit rankings, you do not eliminate the game; you merely change the currency. You lose the ability to distinguish between *types* of excellence, and you remove the social lubricant that allows mentors to be honest about weaknesses without being destructive. The current system is inefficient and stressful for committees, but it is robustly stable because it balances the writer's desire to help their student with the committee's need to discriminate, all while maintaining a veil of politeness.

  You are not just reading letters; you are reading the **constraints** under which the letters were written. That is where the truth lives.
