  **Mark: 16/25**
  **Classification: High 2:1 (64%)**

  **Comments**

  **Claims that are right and should be credited**

  > "ground projects — long-standing commitments, relationships and causes which give his life its shape and which he does not regard as one preference among others"
  This is an accurate and concise definition of Williams's notion, correctly distinguishing projects from mere preferences; it deserves full credit within part (a).

  > "from the impersonal standpoint the fact that it is his wife gives him no reason to save her rather than the stranger, so a further thought has to be brought in... and that further thought misrepresents his reason."
  This captures the structure of the 'one thought too many' objection precisely, identifying the issue as one of justificatory structure rather than mere psychology; this is strong work in part (a).

  > "entering these as values to be weighed leaves Osei in exactly the position Williams describes: someone deciding from outside his own life, with the things that matter most to him listed as entries on a list."
  This is the strongest sentence in the script; it correctly identifies Williams's counter to the consequentialist reply in part (b), recognising that the objection targets the standpoint of deliberation, not the inputs; this should recover significant marks lost earlier.

  > "Even rule consequentialism or indirect consequentialism holds that Osei's action is right only because of its consequences, so even there his projects never have any standing in his own deliberation"
  This is a defensible and sophisticated extension of Williams's argument against indirect utilitarianism, showing good grasp of the scope of the objection in part (b).

  **Claims that are mistaken or conflate distinct concepts**

  > "Williams's point is that integrity is a value the consequentialist sum has so far omitted: alongside welfare we should enter the agent's integrity, and once it is entered it can be weighed against the gains available elsewhere"
  This is a fundamental philosophical error: Williams explicitly argues against treating integrity as a value to be weighed within the utilitarian calculus, as this preserves the alienating structure he opposes; this misunderstanding undermines the core explanation in part (a) and must cost marks.

  > "Ordinary moral thought... has no place for negative responsibility at all"
  This is too strong; ordinary moral thought acknowledges some responsibility for omissions (e.g. parental care), though not to the extent consequentialism requires; the candidate should have nuanced this rather than presenting a binary distinction.

  **Claims too compressed or contestable (queried rather than penalised)**

  > "Williams's interest, though, is not to deny the verdict about what Jim should do — he is willing to allow that Jim should shoot"
  This is contestable; while Williams focuses on the cost to integrity, he generally implies Jim is not required to shoot, though some interpreters allow your reading; I will not penalise this, but it risks misrepresenting Williams's stance on action-guidance.

  > "Williams's point is that integrity is a value... weighed against the gains" (Paragraph 1) vs "entering these as values to be weighed leaves Osei in exactly the position Williams describes" (Paragraph 4)
  There is a contradiction here: in part (a) you suggest Williams wants integrity weighed, but in part (b) you correctly argue that weighing is the problem; this inconsistency suggests you may have found the right answer in (b) without fully correcting the error in (a), which limits coherence.

  **What a first-class answer would have done**

  A first-class answer would have maintained consistency between parts (a) and (b), clearly distinguishing integrity as a condition of agency from integrity as a value to be maximised throughout. It would have engaged more critically with the Jim case, perhaps noting that Williams challenges the *requirement* to shoot rather than just the psychological cost. Finally, it would have explored whether Williams offers any positive account of decision-making for Osei, rather than stopping at the negative critique of consequentialism.
