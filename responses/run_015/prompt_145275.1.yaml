answer: |-
  # Defense Prep Sheet: Epistemic Foundations Without the Fixed Point

  ## Strategic Pre-Emptions (First 5 Minutes of Presentation)
  *Do not wait for these to be asked. State them clearly in your introduction to disarm the two biggest threats to your airtime.*

  1.  **To the Chair (The Theorem):** "I want to be clear at the outset: I am not offering a new existence theorem for equilibrium. I am offering a classification of games based on their sensitivity to belief depth. Where I offer a conjecture (the logarithmic bound), I will mark it as such. My goal is to shift the modeling assumption, not to close the mathematical program."
      *   *Why:* Prevents him from spending 20 minutes hunting for a proof you admitted you don't have.
  2.  **To the External (The Compactness):** "Those familiar with epistemic logic will recognize that my complaint about the fixed point shares DNA with the non-compactness of common knowledge. I am not discovering a topological bug; I am arguing that for finite agents, this topological feature has a specific *cost* in tail-sensitive games that standard theory ignores."
      *   *Why:* Prevents him from reducing your contribution to "You noticed common knowledge isn't compact? That's known." It reframes it as an *economic cost* of that logic.

  ---

  ## The Objection Matrix (Ordered by Likelihood $\times$ Damage)

  ### 1. The "Singularity" Objection
  *   **Reader:** Chair (Micro Theorist)
  *   **Phrasing:** "The Email Game is a pathological case constructed specifically to break continuity. You've built a whole chapter on a singularity. Where is the proof that 'tail-sensitive' games are a non-trivial class? If this class is empty or negligible, your critique of the fixed point is a solution to a problem that doesn't exist."
  *   **Concession:** "You are right that the Email Game is constructed to maximize sensitivity, and I do not claim all games are tail-sensitive."
  *   **Reply (90s):** "However, the class is defined by the payoff structure relative to the information cost, not just the Email Game. Any coordination game where the penalty for mismatched action exceeds the gain from coordinated risk-taking creates this sensitivity. My contribution is identifying the *condition* for sensitivity. Even if the class is small, it contains the canonical games (Email, Centipede) used to justify the fixed-point program. If the foundations program leans on these specific games to justify Common Belief in Rationality (CBR), and these are exactly the games where CBR fails to approximate, the foundation is unstable, regardless of the measure of the set."
  *   **Soft Spot:** You haven't proven the class is large, only that the *famous* examples are in it. If he presses for a measure-theoretic argument, you have none.

  ### 2. The "Compactness" Objection
  *   **Reader:** External (CS Logician)
  *   **Phrasing:** "You say agents can't achieve the fixed point. Isn't this just the observation that the common knowledge operator has no finite iteration? You're restating that the logic isn't compact. What work is the 'achievement' metaphor doing that 'non-compactness' doesn't do already?"
  *   **Concession:** "Topologically, yes, this is closely related to the failure of compactness in standard epistemic logic."
  *   **Reply (90s):** "But logic describes what is *possible*; economics describes what is *done*. Non-compactness is a static property of the operator. My 'achievement' framing models the *process cost* of climbing the hierarchy. I am not just saying the fixed point is unreachable; I am saying the *attempt* to reach it changes the prescription in tail-sensitive games. The logic tells us the limit doesn't exist finitely; my model tells us where the agent stops and what they do there. That is an economic prediction, not just a logical constraint."
  *   **Soft Spot:** If he presses on whether your "depth-indexed rule" is formally distinct from a truncated Kripke model, you need to ensure your "cost/benefit" deletion criterion is mathematically precise.

  ### 3. The "Order of Deletion" Objection
  *   **Reader:** External (CS Logician)
  *   **Phrasing:** "In iterative deletion of dominated strategies, order matters when you stop early. Your depth-limited rule isn't order-independent. How is your solution well-defined? Are you predicting a set of outcomes or a single path?"
  *   **Concession:** "I concede that once we abandon the full fixed point, order of elimination can affect the remainder."
  *   **Reply (90s):** "That is why the Diminishing-Support Postulate is crucial. It provides a stopping rule based on the *marginal value of evidence*, not an arbitrary cutoff. While different deletion orders might yield different sets, the logarithmic bound on depth constrains the *distance* between those sets. I am not claiming a unique equilibrium in the traditional sense, but a bounded region of play. In the Centipede, this bound predicts the 'take' point regardless of minor variations in deletion order, provided the support decay holds."
  *   **Soft Spot:** You haven't proven the bound constrains the variation enough to satisfy a uniqueness craving. You are selling "bounded prediction," not "unique equilibrium."

  ### 4. The "Falsifiability" Objection
  *   **Reader:** Reader 3 (Experimental Economist)
  *   **Phrasing:** "I run Centipede games. People take early for many reasons: altruism, confusion, quantal response. You predict a 'handful of rounds.' What specific number? If I run a 100-node game and they take at node 5, does that falsify you? What if they take at node 50? Give me a parameter I can test."
  *   **Concession:** "I cannot predict the exact node without knowing the specific payoff matrix and the agent's evidence decay rate."
  *   **Reply (90s):** "But I can predict the *scaling relationship*. Standard QRE predicts behavior scales with the noise parameter. My model predicts behavior scales logarithmically with the game length and the evidence strength. If you double the game length, the 'take' point should not double; it should shift by a constant amount determined by the log bound. Test that scaling law. If the take-point grows linearly with game length, my model is false. If it saturates logarithmically, standard epistemic models are false. That is the falsifiable distinction."
  *   **Soft Spot:** You need to be ready to write down the scaling equation on the board if he asks. "Logarithmic" is vague without a base.

  ### 5. The "Alternative Explanations" Objection
  *   **Reader:** Reader 3 (Experimental Economist)
  *   **Phrasing:** "Why do I need your epistemic complexity? I can fit the Centipede data better with a simple trembling-hand model or by assuming a fraction of altruists. Your model is more complex and predicts the same thing. Why should I adopt it?"
  *   **Concession:** "Your models fit the existing data very well, often with fewer parameters."
  *   **Reply (90s):** "Because your models treat the deviation from Nash as a preference shock or an error. My model treats it as a rational response to finite evidence. If we change the information structure—say, by making the confirmations in the Email Game public versus private—trembling-hand doesn't necessarily shift the prediction. My model does. I offer a *structural* explanation for the deviation, not a *parametric* one. It allows us to predict behavior in new information environments where 'confusion' parameters are undefined."
  *   **Soft Spot:** You need to be sure your model actually produces a different prediction in a modified information structure. Have an example ready.

  ### 6. The "Normative Status" Objection
  *   **Reader:** Reader 2 (Formal Epistemologist)
  *   **Phrasing:** "Is your depth-indexed rule a normative constraint on rationality, or a descriptive premise about agents? If it's normative, aren't you just redefining rationality to save the phenomenon? If descriptive, isn't it just psychology?"
  *   **Concession:** "The distinction between normative and descriptive is indeed the crux of how this postulate is received."
  *   **Reply (90s):** "I propose it as a *feasibility constraint* on normative rationality. Just as 'ought implies can,' rational belief formation ought to imply evidential support. If level $n+1$ belief requires evidence about level $n$ evidence, and that evidence degrades, then holding the fixed-point belief is not 'more rational,' it is evidentially unsupported. I am not lowering the bar for rationality; I am arguing the standard bar requires evidence the agent does not possess."
  *   **Soft Spot:** This is philosophically dense. If she pushes on "evidential support" in a game-theoretic context (where evidence is often just logical deduction), you need to defend the idea that deduction has a "cost" or "decay."

  ### 7. The "Belief vs. Credence" Objection
  *   **Reader:** Reader 2 (Formal Epistemologist)
  *   **Phrasing:** "You speak of 'belief' but use probabilistic examples. Do you mean full belief (binary) or graded credence? If graded, why not use imprecise credences or sets of probabilities rather than a depth cutoff?"
  *   **Concession:** "The framework is most naturally expressed in graded credences, and I should have been more precise with that terminology."
  *   **Reply (90s):** "A depth cutoff on binary belief is isomorphic to a threshold on graded credence under the Diminishing-Support Postulate. As depth increases, the credence interval widens. Once it widens past the decision threshold, the binary belief drops out. Using imprecise credences is compatible with my view—in fact, it strengthens it. My depth rule is simply a computationally tractable way to model when that imprecision becomes too large to support a decision. I am happy to restate the theorem in terms of credal sets if the committee prefers."
  *   **Soft Spot:** You haven't actually done the restatement. If she asks you to sketch it, you must be able to map "depth" to "interval width" on the fly.

  ### 8. The "Work Done" Objection
  *   **Reader:** Chair (Micro Theorist)
  *   **Phrasing:** "Even if I grant the Email Game point, you haven't shown where the standard program fails in *applied* work. Most mechanism design and auction theory relies on tail-insensitive games. You've attacked a straw man that nobody uses for real results."
  *   **Concession:** "Most applied mechanism design does indeed rely on environments that are tail-insensitive."
  *   **Reply (90s):** "But the *foundations* program uses the tail-sensitive games to justify the epistemic conditions for the tail-insensitive ones. We teach students that CBR is the bedrock because it solves the Email Game and Centipede. If CBR is an achievement that fails in the foundational examples, the justification for using it in the applied examples is weakened. We are using a tool that we know is broken in the lab to build bridges in the field. I am asking us to check if the tool holds before we assume it does."
  *   **Soft Spot:** This is a rhetorical move, not a mathematical one. He may not care about "foundational justification" if the "applied results" hold.

  ### 9. The "Self-Referential" Objection (Your Candidate)
  *   **Reader:** Any (likely External or Reader 2)
  *   **Phrasing:** "If the Diminishing-Support Postulate is true, it applies to you. Your confidence in level $n$ of your argument should decay relative to level $n-1$. By the time you reach your conclusion, your support should be negligible. Does your postulate not eat the argument that asserts it?"
  *   **Concession:** "That is a sharp application of the postulate to the meta-level, and it looks like a paradox."
  *   **Reply (90s):** "But the postulate applies to *agents within a model* reasoning about *other agents*, not to theorists reasoning about *models*. The decay comes from the distance between the evidence and the world. My evidence for this chapter is the mathematical derivation and the empirical fit, not higher-order beliefs about your beliefs. However, if we apply it meta-theoretically, it implies fallibilism, not falsehood. It means I should be less confident in the *conjecture* than the *definition*. I am. I am asking you to accept the classification (tail-sensitive) with high confidence, and the bound (logarithmic) with lower confidence. The postulate survives because it predicts its own uncertainty."
  *   **Soft Spot:** If they press that *any* complex argument involves higher-order evidence (e.g., "I believe the math is right" is level 1, "I believe I didn't make a mistake" is level 2), you need to hold the line that *game-theoretic* evidence decays differently than *logical* evidence.

  ---

  ## Critical Survival Strategy

  ### The Single Reply That Must Land
  **Objection #1 (The Singularity/Chair).**
  If you fail to convince the Chair that "Tail-Sensitive" is a real, economically relevant class and not just the Email Game, the chapter loses its motivation. The destructive half collapses, and the constructive half looks like a solution to a toy problem.
  *   **Key Phrase to Remember:** "It is not about the measure of the set of games; it is about the weight these games carry in the *justification* of the epistemic program."

  ### Objections to Hand to the Formal Epistemologist (Reader 2)
  You cannot make her speak, but you can frame your answers to invite her endorsement, effectively making her your shield against the Chair and External.
  *   **Target:** Objections #6 (Normative Status) and #7 (Belief vs. Credence).
  *   **Strategy:** When answering these, explicitly reference her work. "As [Reader 2] has argued in her work on higher-order evidence, the distinction between..." or "This aligns with the imprecise credence framework [Reader 2] advocates."
  *   **Why:** If she nods, the Chair (who respects her precision) is less likely to press the point. It signals that the "fuzzy" philosophical bits have been vetted by the expert in the room.

  ---

  ## Analysis of the "Self-Referential" Question
  **Is it the worst question in the room?**
  **No.** It is the *cleverest*, but not the most dangerous.
  *   **Why:** It is a philosophical "gotcha" that sounds profound but often dissolves upon distinguishing object-level from meta-level. The Chair's objection (that your class of games is trivial) is far more damaging because it renders the dissertation economically irrelevant. The Experimentalist's objection (that it's unfalsifiable) is a close second because it renders it scientifically empty.
  *   **The Risk:** The Self-Referential question is dangerous only if you get flustered and try to prove your own confidence is high. If you admit uncertainty, you win.

  **The Line to Use (If it comes):**
  "You've caught me in a performative contradiction, but only if we assume the postulate applies to logical deduction. I argue it applies to *strategic* evidence—evidence about another mind. My confidence in this chapter rests on logic and data, not on my model of your model of me. But I will concede this: I am more confident in the *problem* (tail-sensitivity) than in the *solution* (the log bound). The postulate demands I weight my claims that way, and I do."
