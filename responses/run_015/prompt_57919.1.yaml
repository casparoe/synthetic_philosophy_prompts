prompt: |-
  I serve as the compliance lead for a university office that reviews undergraduate-led field experiments in behavioral economics and public health outreach, roughly fifteen to twenty proposals per month during term, most low-risk but involving adult members of the public approached in markets, clinics, and transit hubs. Reviews must be completed within forty-five minutes by staff with basic research-ethics training but no background in philosophy, with only flagged cases escalated to me for full review, and our concern is less legal liability than whether participants have genuinely given valid consent.

  Please translate the philosophical work on what makes consent valid into a stepwise procedure my reviewers can actually follow, ordered as questions to ask with criteria for what counts as a passing answer, clear stop points that yield a requirement to revise and resubmit, and explicit markers for points where factual checking ends and a value judgment by a person is required. The procedure must handle three recurring difficulties separately rather than collapsing them into a general sense of voluntariness: deception understood to include outright false statements, technically true but misleading framing, and material omissions about purpose, risks, or downstream uses of data; pressure understood to include explicit threats, offers of payment or services that may be difficult for poorer participants to refuse, and reliance on authority or institutional trust; and competence understood to include age-related thresholds, temporary impairment or low literacy, and fluctuating understanding during extended interactions.

  Illustrate the procedure by applying it to three invented proposals currently before us: a door-to-door survey on household budgeting that withholds that responses will be used to train a credit-scoring model; a paid forty-minute interview on vaccine hesitancy offering a grocery voucher worth roughly a day's wage in the neighborhood where recruitment occurs, conducted by staff wearing local clinic uniforms; and a longitudinal text-message study of medication adherence enrolling sixteen- to nineteen-year-olds with mixed literacy levels. Include in the illustration at least one verdict my student investigators are likely to find frustratingly strict, explain why the procedure requires it, and conclude with a brief account of what the procedure cannot settle and where reviewers should expect it to misfire if applied mechanically.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **Role:** Compliance Lead for a university office reviewing undergraduate-led field experiments (behavioral econ/public health).
      *   **Volume/Constraints:** 15-20 proposals/month, 45-minute review limit, staff have basic ethics training (no philosophy background), low-risk but public-facing (markets, clinics, transit).
      *   **Goal:** Translate philosophical work on *valid consent* into a stepwise procedure (questions, criteria, stop points, value judgment markers).
      *   **Specific Focus:** Three distinct difficulties must be handled separately:
          1.  *Deception* (false statements, misleading framing, material omissions).
          2.  *Pressure* (threats, undue inducement/payment, authority/trust).
          3.  *Competence* (age, impairment/literacy, fluctuating understanding).
      *   **Illustrations:** Apply to three specific invented proposals (Credit-scoring survey, Vaccine hesitancy interview, Medication adherence texts).
      *   **Requirements:** Include one "frustratingly strict" verdict with explanation. Conclude with limitations of the procedure.

  2.  **Deconstruct "Valid Consent" (Philosophical Basis):**
      *   Philosophically, valid consent requires *Authorization* + *Understanding* + *Voluntariness* + *Competence*.
      *   *Authorization:* Explicit agreement.
      *   *Understanding:* Knowing what one is agreeing to (no deception/omission).
      *   *Voluntariness:* Free from controlling interference or undue influence (no pressure).
      *   *Competence:* Capacity to decide.
      *   *Challenge:* Translating these abstract concepts into a 45-minute checklist for non-philosophers.

  3.  **Drafting the Procedure (The "Consent Validity Checklist"):**
      *   *Structure:* Needs to be linear, with clear "Pass/Fail/Flag" outcomes.
      *   *Time Management:* Must fit within 45 mins. Keep questions binary where possible.
      *   *Section 1: Deception (Informational Validity).* Focus on truthfulness and completeness.
      *   *Section 2: Pressure (Voluntariness).* Focus on coercion and inducement.
      *   *Section 3: Competence (Capacity).* Focus on ability to understand and decide.
      *   *Value Judgment Markers:* Explicitly state where the reviewer must stop checking facts and start weighing values (e.g., "Is this payment *too* high?").

  4.  **Developing the Three Difficulties (Specific Criteria):**
      *   *Deception:* Distinguish between lies, misleading truths, and omissions. Key test: "Would a reasonable person feel betrayed if they knew?"
      *   *Pressure:* Distinguish between threats, undue inducement (relative to local economy), and authority bias. Key test: "Could they walk away without significant loss?"
      *   *Competence:* Distinguish between legal age, functional literacy, and stability of understanding. Key test: "Can they explain back what they are doing?"

  5.  **Applying to the Three Scenarios:**

      *   *Scenario A: Door-to-door Budgeting/Credit Scoring.*
          *   Issue: Material Omission (Deception).
          *   Analysis: Participants think it's a survey; data trains a credit model. This affects risk (financial harm).
          *   Verdict: Fail/Revise. Must disclose downstream use.

      *   *Scenario B: Vaccine Hesitancy/Clinic Uniforms/Grocery Voucher.*
          *   Issue: Pressure (Authority + Inducement) & Deception (Misleading Framing).
          *   Analysis: Uniforms imply medical authority (Pressure). Voucher = 1 day's wage (Undue Inducement).
          *   Verdict: Fail/Revise. (This is likely the "frustratingly strict" one regarding the payment or the uniforms). Let's make the *payment* the strict one, as researchers often argue "it's just compensation." Or the uniforms. Actually, the uniform issue is a classic "therapeutic misconception" risk. Let's flag the payment as "Undue Inducement" based on the "day's wage" metric.

      *   *Scenario C: Text-message Adherence/16-19yo/Mixed Literacy.*
          *   Issue: Competence (Age + Literacy).
          *   Analysis: Minors (16-17) need parental consent usually, but 18-19 are adults. Mixed literacy means standard text might fail understanding.
          *   Verdict: Flag for Competence. Needs simplified text + parental waiver or assent for minors.

  6.  **Refining the "Frustratingly Strict" Verdict:**
      *   Researchers often feel that hiding the *full* purpose is necessary for data validity (bias).
      *   Researchers often feel payment is just "thanks for time."
      *   *Decision:* The Vaccine Study (Scenario B) payment structure. Offering a day's wage for 40 minutes is economically coercive in that context. Reviewers might think "It's generous," but the procedure must flag it as "Undue Inducement." This creates friction.

  7.  **Drafting the Limitations (Where it Misfires):**
      *   Mechanical application misses context.
      *   Cannot measure *internal* state of the participant.
      *   Cannot solve ethical dilemmas where valid consent is impossible (e.g., some deception studies are scientifically necessary but ethically fraught).
      *   Doesn't replace the need for debriefing.

  8.  **Review against Constraints:**
      *   45-minute limit? The checklist needs to be concise.
      *   No philosophy background? Avoid terms like "Kantian autonomy" or "Utilitarian calculus." Use plain English.
      *   Separate the three difficulties? Yes, structure the checklist by Deception, Pressure, Competence.
      *   Stop points? Yes, "Immediate Rejection/Revision" triggers.
      *   Value judgment markers? Yes, explicitly label them.

  9.  **Final Polish:**
      *   Tone: Professional, directive, supportive but firm.
      *   Formatting: Bold headers, bullet points, clear boxes for "Stop/Flag."
      *   Ensure the "Value Judgment" markers are distinct from factual checks.

  **(Self-Correction during drafting):** I initially thought about combining Deception and Pressure. The prompt explicitly says "handle three recurring difficulties separately." I must ensure the checklist has distinct sections for Deception, Pressure, and Competence. I also need to make sure the "Value Judgment" markers are clear, as non-philosophers often confuse facts with values.

  *Refining the "Frustratingly Strict" example:* The prompt asks for *one* verdict in the illustration that investigators will find frustrating. The Vaccine Study payment (1 day's wage for 40 mins) is the strongest candidate. Researchers will argue it's fair compensation; the ethics procedure must argue it compromises voluntariness. I will emphasize this in the illustration.

  *Refining the "Value Judgment" markers:* I need to explicitly write "[VALUE JUDGMENT REQUIRED]" in the text so the reviewers know when they are leaving the realm of fact-checking.

  *Refining the Limitations:* Be honest. A checklist cannot guarantee valid consent, only procedural compliance.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Procedure for Assessing Valid Consent in Field Experiments
  **Office of Research Compliance | Undergraduate Field Studies**
  **Target Review Time:** 45 Minutes
  **Reviewer Profile:** Basic Ethics Training (Non-Philosopher)

  ## Introduction
  This procedure translates the philosophical conditions of valid consent (Information, Voluntariness, Capacity) into a binary checklist. Its purpose is not to judge the scientific merit of the proposal, but to determine if the consent obtained is morally valid. 

  **Instructions:**
  1.  Work through the three sections in order.
  2.  Mark each question as **Pass**, **Fail**, or **Flag**.
  3.  **Stop Points:** If any question yields a **Fail**, the proposal must be returned for revision. Do not proceed to the next section.
  4.  **Value Judgment Markers:** Questions marked with **[VALUE]** require you to weigh competing interests. There is no factual "right" answer here; rely on the provided criteria.
  5.  **Escalation:** If you mark **Flag** on three or more items, or if you are unsure on a **[VALUE]** item, escalate to the Compliance Lead.

  ---

  ## Section 1: Deception (Informational Validity)
  *Philosophical Basis: Consent is invalid if the agent does not understand what they are authorizing. This covers lies, misleading truths, and omissions.*

  **1.1 Direct Falsehoods**
  *   **Question:** Does the recruitment script or consent form contain any statement that is factually false? (e.g., "This is anonymous" when it is not).
  *   **Criteria for Pass:** All statements are factually accurate.
  *   **Stop Point:** If **No**, return for revision. Deception requires specific justification and mitigation (debriefing) not covered in this low-risk workflow.
  *   **Status:** [ ] Pass [ ] Fail

  **1.2 Misleading Framing (Technically True)**
  *   **Question:** Are there statements that are technically true but likely to create a false impression of the study's primary goal? (e.g., Describing a study on "spending habits" when the goal is "credit risk assessment").
  *   **Criteria for Pass:** The primary purpose described matches the primary scientific aim.
  *   **[VALUE] Marker:** If the scientific aim requires ambiguity to prevent bias, ask: *Does the ambiguity change the risk profile?* If yes, this is a Fail.
  *   **Status:** [ ] Pass [ ] Fail [ ] Flag

  **1.3 Material Omissions**
  *   **Question:** Is there information about risks, data usage, or downstream consequences that a reasonable person would consider important before agreeing?
  *   **Criteria for Pass:** All downstream data uses (e.g., training algorithms, sharing with third parties) are explicitly listed.
  *   **Stop Point:** If data is used for anything other than the immediate analysis described in the proposal without disclosure, this is a **Fail**.
  *   **Status:** [ ] Pass [ ] Fail

  ---

  ## Section 2: Pressure (Voluntariness)
  *Philosophical Basis: Consent is invalid if the choice is controlled by another. This covers threats, undue inducements, and authority bias.*

  **2.1 Explicit Threats or Penalties**
  *   **Question:** Does the proposal imply that refusing participation will result in loss of services, status, or benefits to which the participant is otherwise entitled?
  *   **Criteria for Pass:** Participation is explicitly optional with no penalty for refusal.
  *   **Status:** [ ] Pass [ ] Fail

  **2.2 Undue Inducement (Payment/Services)**
  *   **Question:** Is the compensation offered so large relative to the participant's economic context that it blinds them to the risks?
  *   **Criteria for Pass:** Compensation is proportional to time/effort (e.g., local hourly wage equivalent).
  *   **[VALUE] Marker:** Compare the payment to the local economic baseline. If the payment exceeds **2x the local hourly wage** or represents **>10% of a daily subsistence budget**, this is a **Fail**.
  *   **Status:** [ ] Pass [ ] Fail [ ] Flag

  **2.3 Authority and Institutional Trust**
  *   **Question:** Are researchers using symbols, uniforms, or titles that imply medical or official authority to secure compliance?
  *   **Criteria for Pass:** Researchers are identified as university students/researchers. No medical uniforms or official badges are used unless the study is strictly observational in a public space.
  *   **Stop Point:** If clinical uniforms are used in a non-clinical intervention, this is a **Fail** (Therapeutic Misconception risk).
  *   **Status:** [ ] Pass [ ] Fail

  ---

  ## Section 3: Competence (Capacity)
  *Philosophical Basis: Consent is invalid if the agent lacks the ability to understand or the stability to maintain that understanding.*

  **3.1 Age and Legal Thresholds**
  *   **Question:** Are all participants above the age of legal majority (18), or is parental consent/assent protocol included for minors?
  *   **Criteria for Pass:** 18+ only, OR valid waiver/parental consent protocol for 16-17 year olds.
  *   **Status:** [ ] Pass [ ] Fail

  **3.2 Functional Literacy and Accessibility**
  *   **Question:** Is the consent material written at a reading level appropriate for the target population?
  *   **Criteria for Pass:** Text is below Grade 8 reading level for general public; visual aids provided for low-literacy populations.
  *   **[VALUE] Marker:** If the target population is known to have mixed literacy, a verbal comprehension check (teach-back method) is required. If missing, **Flag**.
  *   **Status:** [ ] Pass [ ] Fail [ ] Flag

  **3.3 Fluctuating Understanding**
  *   **Question:** For longitudinal or extended interactions, is there a mechanism to re-confirm consent if the participant's state changes?
  *   **Criteria for Pass:** Study includes check-in points where consent is reaffirmed.
  *   **Status:** [ ] Pass [ ] Fail [ ] Flag

  ---

  ## Illustration of Procedure Application

  Below are the three current proposals evaluated using the procedure above.

  ### Proposal A: The Household Budgeting Survey
  *   **Method:** Door-to-door survey on spending.
  *   **Issue:** Data will train a credit-scoring model; participants are told it is for "academic research on budgeting."
  *   **Application:**
      *   **1.1 Direct Falsehoods:** Pass (It is academic research).
      *   **1.2 Misleading Framing:** **Fail.** The primary aim is credit modeling, not just budgeting analysis.
      *   **1.3 Material Omissions:** **Fail.** Downstream use (credit scoring) is a material risk (financial harm) not disclosed.
  *   **Verdict:** **Return for Revision.**
  *   **Reasoning:** Even if the data is anonymized, the *purpose* changes the nature of the transaction. A participant might agree to help a student but refuse to help a bank. Withholding this violates the *Informational Validity* condition.

  ### Proposal B: The Vaccine Hesitancy Interview
  *   **Method:** 40-minute interview in a low-income neighborhood.
  *   **Incentive:** Grocery voucher worth one day's wage.
  *   **Attire:** Researchers wear local clinic uniforms.
  *   **Application:**
      *   **2.3 Authority:** **Fail.** Wearing clinic uniforms implies medical authority, creating a "Therapeutic Misconception" (participants may think this is medical care, not research).
      *   **2.2 Undue Inducement:** **Fail.** One day's wage for 40 minutes exceeds the 2x hourly wage / 10% daily budget threshold.
  *   **Verdict:** **Return for Revision (Strict).**
  *   **Reasoning for Frustration:** Investigators will argue the payment is "fair compensation" for the sensitive topic and the uniforms build "trust."
      *   *Why the procedure requires this:* Philosophically, consent must be *voluntary*. If the offer is so good that a rational person cannot afford to say no (economic coercion), voluntariness is compromised. Similarly, if the uniform makes them feel they *should* comply for their health, it is not a free choice. The procedure prioritizes the *structure of the choice* over the *intent of the researcher*.

  ### Proposal C: Medication Adherence Text Study
  *   **Method:** Longitudinal SMS study.
  *   **Population:** 16- to 19-year-olds; mixed literacy.
  *   **Application:**
      *   **3.1 Age:** **Flag.** 16-17 year olds are minors; 18-19 are adults. Proposal lacks distinction in consent protocol.
      *   **3.2 Literacy:** **Flag.** "Mixed literacy" is acknowledged, but no teach-back method or simplified text protocol is described.
      *   **3.3 Fluctuating Understanding:** **Pass.** Longitudinal nature is noted, but re-consent mechanism is weak.
  *   **Verdict:** **Escalate to Compliance Lead.**
  *   **Reasoning:** This requires a value judgment on the waiver of parental consent for minors in low-risk studies and a technical judgment on literacy accommodations. It exceeds the 45-minute reviewer's mandate.

  ---

  ## Limitations of This Procedure

  Reviewers must understand where this checklist ends and ethical uncertainty begins. This procedure cannot settle the following:

  1.  **The "Black Box" of Understanding:** We can check if information was *provided* (Section 1), but we cannot verify if it was *internalized*. A participant can nod along without understanding. This procedure ensures procedural compliance, not psychological certainty.
  2.  **Mechanical Misfire on Culture:** The "Undue Inducement" metric (Section 2.2) uses economic ratios. In some communities, a gift is a social bond, not a wage. Applying the 10% budget rule mechanically may insult local norms of reciprocity. Reviewers should **Flag** cases where cultural context suggests the economic metric is inappropriate.
  3.  **The Necessity of Deception:** Some behavioral economics research *requires* withholding the true hypothesis to prevent demand effects. This procedure treats omission as a **Fail** by default. If a student argues deception is scientifically necessary, this checklist cannot resolve the tension between *Validity of Consent* and *Validity of Data*. These must be escalated.
  4.  **Post-Consent Regret:** Valid consent at Time A does not prevent distress at Time B. This procedure reviews the *entry* point. It does not assess the adequacy of the debriefing or withdrawal mechanisms, which are equally vital for ongoing moral permission.

  **Final Instruction:** If a proposal passes this checklist but "feels" wrong, trust that intuition. Mark **Flag** and escalate. The procedure is a floor, not a ceiling.
