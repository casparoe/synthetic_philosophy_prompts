here are two independent ignition mechanisms, one per hemisphere, each able to drive fluent speech, each fed only by its own hemisphere and unable to exchange contents with the other; both produce first-person reports and each insists it is the subject. One stream or two, or is the question ill-formed? Second, the two-interviewer probe: the same setup, but both systems questioned simultaneously by different interviewers about what they were experiencing at a given moment, and the answers come apart — what does each camp predict, and is either prediction cheap? Finally, tell me plainly which parts of this dispute you think are merely verbal (my guess: some of it is conscious meaning available-to-consumers for her and report-discriminated for me, and unified meaning single-stream versus single-agent) and which stay substantive once that's cleaned up.

