      *   **Explaining Revealed Preference (The Friend's View):** Briefly explain *why* the friend says this. It's about predictability and avoiding mind-reading. It treats preferences as *stable* and *consistent*.
      *   **The Crack in the Theory (The Novelist's View):** Introduce the distinction between *Decision Utility* (what you choose) and *Experienced Utility* (what you feel). This is the key to the lottery ticket conflict.
      *   **Incoherence and Mistakes:** Explain that modern economics (Behavioral Econ) admits people make mistakes. The "Planner-Doer" model is perfect for this character. She has a long-term plan (save money) and a short-term doer (buy hope).
      *   **Utility: Real vs. Label:** Address the ontological question. It started as a label (Pareto/Samuelson) but psychology brings it back to feelings.
      *   **Policy and "Better Off":** Explain the tension. If the government taxes cigarettes, they are saying "Your future self matters more than your present self." This is a moral judgment disguised as economics.
