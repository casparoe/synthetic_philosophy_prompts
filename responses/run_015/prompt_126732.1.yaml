  ### **TA-to-TA Notes (For your dispute)**

  You were right to have the "itch." Your office-mate likely graded this as a "High B" because the student uses the correct *vocabulary* (Bayesian, Law of Large Numbers, independent draws) and the answer *sounds* like standard statistical intuition. However, in the context of social epistemology and cascade models, Part (b) is a fundamental conceptual failure.

  **Why Part (b) is objectively wrong:**
  The student treats the *choice* as a proxy for the *signal* throughout the entire sequence. In a cascade model, $Choice_t = Signal_t$ only until the cascade starts. Afterward, $Choice_t = PublicHistory$.
  *   **The Student's Claim:** $N$ customers = $N$ independent signals $\rightarrow$ Error $\to 0$.
  *   **The Reality:** $N$ customers = $k$ independent signals (where $k$ is small, usually 3 or 4) + $(N-k)$ deterministic echoes $\rightarrow$ Error $\to$ Constant $> 0$.

  **The Math on Part (b):**
  You asked for the actual probability to settle the fight. In the standard Bikhchandani-Hirshleifer-Welch model with signal accuracy $p=0.6$:
  The probability that a cascade locks onto the **wrong** option is determined by the probability that the random walk of signals hits $-2$ before $+2$.
  The formula is:
  $$ P(\text{Wrong Cascade}) = \frac{(1-p)^2}{p^2 + (1-p)^2} $$
  Plugging in $p=0.6$:
  $$ P(\text{Wrong}) = \frac{0.4^2}{0.6^2 + 0.4^2} = \frac{0.16}{0.36 + 0.16} = \frac{0.16}{0.52} \approx 30.8\% $$
  So, even with 10,000 customers, there is roughly a **31% chance** the entire crowd is eating at the worse shop. The student's claim that the error becomes "negligible" is mathematically incompatible with the model you taught.

  **Why Part (c) is tricky:**
  The student got the mechanism right (latency reveals signals), which is the hard part. The error ("spread out") is a confusion between *stopping the cascade* and *stopping agreement*. If information aggregates perfectly, everyone agrees on the truth. I gave them partial credit (6/8) because identifying the unblocking mechanism is the primary learning objective there, but the "spread out" claim shows they don't fully grasp that rational agents will still follow overwhelming public evidence.

  **Verdict:**
  This is not a "High B" answer. It is a **12/20 (Low C / High C)**. The student understands the *story* of cascades but fails to apply the *math/logic* of cascades when the setup changes slightly. Grading this higher would validate the exact misconception (that crowd size equals evidence size) that the seminar is supposed to correct.
