answer: |-
  Right. Let's get to work. You've asked for the machinery, not just the output, so I'm going to show you the gears grinding before I hand you the key.

  ### Part 1: The Brainstorm (and the Failures)

  I started by testing your current rule (*Enforceability + Capacity for a View*) against standard democratic theory. It's a variation of the **All-Subjected Principle (ASP)**. The ASP says: if the law binds you, you should have a say in making it.

  **Candidate 1: The All-Subjected Principle**
  *   *The Pitch:* "If the gaol can take you, the Meeting must hear you."
  *   *The Break:* It fails your Case 2 (the Absentee). The city *can* seize his house for unpaid taxes; he is subject to the law. Yet your gut (rightly) says he's out. It also fails Case 6 (the Monks). They are subject to the law. If we stick to pure ASP, they vote. To exclude them, you have to add a clause about "independent will," which starts to look like we're punishing their vow.
  *   *Verdict:* Discard. It's too broad. It captures assets, not people.

  **Candidate 2: The All-Affected Principle**
  *   *The Pitch:* "If the water touches your life, you hold the rope."
  *   *The Break:* This handles the Barge-dwellers (Case 1) beautifully. It also handles the Unborn (Case 8) — they are massively affected. But it creates a nightmare for Case 2. The Absentee's property value is affected. The foreign university where the Student (Case 3) studies is affected by her absence. It creates an infinite regress of stakeholders. It also struggles to explain why the Child (Case 4) is out, as they are *more* affected than anyone.
  *   *Verdict:* Discard. It's too vague. It captures consequences, not citizenship.

  **Candidate 3: Reciprocal Vulnerability (The Survivor)**
  *   *The Pitch:* Voting isn't about interest; it's about *fate*. You vote if you share the risk of the decision and cannot walk away from the consequence without losing your place in the community.
  *   *Why it works:* It distinguishes the Absentee (who can sell the house and leave) from the Barge-dweller (who cannot move the moorings). It distinguishes the Student (temporary absence, returning to the risk) from the Absentee (permanent absence, returning only to retire). It handles the Monks (they have surrendered their vulnerability to the Abbot).
  *   *The Cost:* It requires us to be hard on capacity (Children/Dementia).

  ### Part 2: The Principle

  I am committing to **Reciprocal Vulnerability**.

  Here is the formulation: *Franchise belongs to those who are subject to the city's coercion, possess the capacity to form a judgment, and cannot sever their fate from the city's future without exile.*

  This shifts the focus from "ownership" (hearth-tax) to "dwelling." A hearth is a thing; dwelling is a relationship.

  ### Part 3: Running the Cases

  Here is where I apply the principle. I will be straight: I am overturning one of your verdicts and sharpening the reasoning on two others.

  **1. The Moorings People (Barge-dwellers)**
  *   *Verdict:* **Vote.**
  *   *Reasoning:* They are the purest example of Reciprocal Vulnerability. The sea-gate decision is existential for them. They cannot "sell up and leave" easily; their livelihood is the tide. They are subject to the Harbourmaster. They fit the principle perfectly.
  *   *Confidence:* High.

  **2. The Absentee Owner**
  *   *Verdict:* **No Vote.** (Your gut is right).
  *   *Reasoning:* Under Reciprocal Vulnerability, he is an investor, not a citizen. He pays tax, yes, but he treats the city as a portfolio asset. Crucially, regarding the 100-year bond: he will be dead before it is paid off. He does not share the *long-term* vulnerability. He can sell the house next year and retire to a villa in the sun. He has an exit strategy the barge-dweller does not.
  *   *Confidence:* High.

  **3. The Student Granddaughter**
  *   *Verdict:* **Vote.**
  *   *Reasoning:* Temporary absence does not break the bond of fate. She intends to return to the risk. Her absence is for development, not escape.
  *   *Confidence:* High.

  **4. The Twelve-Year-Old**
  *   *Verdict:* **No Vote.** (But your unease is the story).
  *   *Reasoning:* Here I must be hard. Voting requires the *capacity* to form a judgment (part of my principle). A twelve-year-old lacks the cognitive maturity to weigh a 100-year bond against immediate housing needs. However, your unease is vital. The principle excludes them, but the *legitimacy* of the system depends on adults voting *for* them. In the scene, an adult character should explicitly say, "I vote for the children who cannot," to acknowledge the debt.
  *   *Confidence:* High on the exclusion, High on the narrative tension.

  **5. The Prisoner**
  *   *Verdict:* **Vote.**
  *   *Reasoning:* Incarceration removes liberty, but not citizenship. She returns to the city. Her fate remains bound to the gate. To strip her vote is to treat her as dead to the community before her sentence is served.
  *   *Confidence:* High.

  **6. The Wardens of the Slack (Monks)**
  *   *Verdict:* **No Vote.** (With a caveat).
  *   *Reasoning:* This is the trickiest one. It is not discrimination to say democracy requires *individual* judgment. By vowing obedience to an Abbot, they have contractually surrendered the capacity required to vote. They are not acting as citizens; they are acting as extensions of the Abbot's will.
  *   *The Caveat:* If the Abbot is *also* a hearth-holder in Saltmarch, *he* votes. The order does not. If the Abbot is abroad, no one votes for them. This avoids punishing the religion; it punishes the surrender of agency.
  *   *Confidence:* Medium. This is legally baroque, but philosophically sound for a city-state.

  **7. The Dementia Sufferer**
  *   *Verdict:* **No Vote.**
  *   *Reasoning:* Same as the child. Capacity is a hard limit. If they cannot hold a view, they cannot cast a hand. However, like the child, their guardian (next of kin) should arguably hold a proxy vote, or the community must acknowledge they are voting on her behalf.
  *   *Confidence:* High.

  **8. The Unborn**
  *   *Verdict:* **No Vote.** (But they need a Guardian).
  *   *Reasoning:* You cannot cast a hand for a being that does not exist. However, a 100-year bond is a crime against the future if the future has no voice.
  *   *The Fix:* The Meeting must appoint a "Warden of the Future" — a role with veto power *only* on decisions lasting longer than a human lifespan. This satisfies the gut feeling that they have a claim without breaking the mechanics of voting.
  *   *Confidence:* Speculative. This is institutional design, not just franchise theory.

  ### Part 4: The New Case (The Tide-Dwellers)

  You asked for a case regarding the tide-dwellers who are only inside the jurisdiction three months a year.

  **Case 9: The Seasonal Fishermen**
  *   *Profile:* Families who live on the estuary mudflats. They come inside the city walls only during the storm season (3 months) to repair nets and sell catch. They pay no hearth tax (no hearth). The sea-gate will destroy the mudflats they live on for the other 9 months.
  *   *Verdict:* **Vote.**
  *   *Reasoning:* This tests the "Dwelling" aspect. They are not *in* the walls year-round, but their *life* is the estuary. The city's jurisdiction runs over the water they inhabit. If the gate destroys the mudflats, it destroys their home just as surely as the barge-dwellers. Reciprocal Vulnerability cares about where your life *happens*, not just where you sleep. If the city's law reaches them on the mudflats, they must have a hand.
  *   *Narrative Use:* This creates a conflict. The "Hearth-holders" inside the walls will argue they are outsiders. The Barge-dwellers will argue they are kin. This fractures the "oppressed" bloc.

  ### Part 5: The One-Liner

  You need something a character can shout over the noise of the Meeting. It needs to be rhythmic, plain, and cut through the tax/legal arguments.

  > **"He who must weather the storm must hold the tiller."**

  *Alternative (more aggressive):*
  > **"No vote for those who can walk away from the flood."**

  *Alternative (more inclusive):*
  > **"If the tide takes your home, you hold the rope."**

  I recommend the first one. It implies shared risk (weathering) and shared agency (holding the tiller). It excludes the Absentee (he won't weather the storm) and includes the Barge-dweller (he has no choice).

  ### Part 6: Confidence Check

  *   **Where I am confident:** The exclusion of the Absentee (Case 2) and the inclusion of the Barge-dwellers (Case 1). The "Reciprocal Vulnerability" principle is robust here. It aligns with your gut and holds up to scrutiny.
  *   **Where I am guessing:** The Monks (Case 6). In a real liberal democracy, we struggle with this. In a city-state, it's more plausible to demand individual agency. Be prepared for a reader to call this religious discrimination; you must have a character clarify it's about *agency*, not faith.
  *   **Where you need to do the work:** The Child (Case 4) and the Unborn (Case 8). My principle excludes them from *voting*, but your plot needs to show the *cost* of that exclusion. The "Warden of the Future" idea is a plot device you can use to create a veto crisis later in the book.

  ### Summary for the Scene

  When the argument heats up at the Meeting, your protagonist shouldn't argue about "rights" or "taxes." They should argue about **risk**.

  *   **The Opposition:** "He pays the tax, he gets the hand." (Property argument).
  *   **The Protagonist:** "Tax is coin. The gate is blood. He spends the coin; we bleed the water. He who must weather the storm must hold the tiller."

  This moves the debate from accounting (who paid) to existence (who stays). That is the gut-punch you're looking for.
