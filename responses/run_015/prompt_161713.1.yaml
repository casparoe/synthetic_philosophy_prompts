answer: |-
  1. Agreed claims

  1. We jointly affirm that political instability constitutes a distinct class of events characterized by the loss of central monopoly on violence and fiscal extraction, explicitly excluding routine turnovers of leadership that remain within established constitutional or normative frameworks.
  2. We acknowledge that historical data regarding elite numbers, wage ratios, and state revenue are fragmentary, non-uniform, and subject to significant survivorship bias across centuries of recorded history.
  3. We agree that any claim of forecastability requires the model to generate outputs on data strictly excluded from the parameter fitting process to avoid the bias of fitting noise.
  4. We concede that structural indicators cannot account for contingent decisions made by specific actors during critical junctures of state negotiation, though we disagree on the magnitude of this limitation.
  5. We accept that the definition of "elite" must be operationalized consistently within a single polity but may vary legitimately between polities due to differing social structures.
  6. We stipulate that a forecast is only meaningful if it specifies a time window, a geographic scope, and a threshold of severity for the predicted event prior to observation.
  7. We recognize that fiscal strain often precedes breakdown, though we disagree on whether this correlation implies a universal causal mechanism or merely a retrospective narrative construct.
  8. We agree that the presence of structural stress indicators without subsequent breakdown constitutes a critical test case for any theoretical model claiming predictive power.
  9. We commit to recording all parameter choices, data exclusions, and smoothing functions prior to the execution of the testing protocol described herein to prevent tuning.
  10. We acknowledge that a successful prediction does not validate the underlying mechanistic explanation if alternative causal paths could produce the same statistical outcome.
  11. We agree that the failure of a model to predict an event does not falsify the theory if the data required to measure the mechanism was absent from the archival record.
  12. We sign this statement to bind ourselves to the outcomes of the following tests without post-hoc rationalization of the results or adjustment of the initial parameters.

  2. Disagreements

  | Crux | Issue | The Cyclist's Formulation | The Documentarian's Formulation | Genuine or Verbal |
  | :--- | :--- | :--- | :--- | :--- |
  | **The Ratchet Question** | Stationary vs. Cumulative Dynamics | The cycle is stationary; breakdowns reset the polity to a baseline capacity, allowing recurrence with similar amplitude. Evidence against: If fiscal capacity trends irreversibly upward across cycles without resetting. Prediction: Variance in capacity reset is <10%. | The cycle is cumulative; each breakdown resets the state at a higher level of fiscal and organisational capacity, making the second cycle distinct from the first. Evidence against: If capacity returns to exact prior baselines. Prediction: Baseline capacity increases by >15% per cycle. | Genuine |
  | **Cycle Length** | Constant vs. Estimated Parameter | Cycle length is a constant imposed across polities (e.g., 300 years), ensuring falsifiability. Evidence against: If optimal fit requires polity-specific periods varying by >20%. Prediction: Global period fits within ±15 years. | Cycle length is a parameter estimated separately for each polity; imposing constants creates artifacts. Evidence against: If fixed periods fit better than estimated ones. Prediction: Polity-specific variance exceeds global variance. | Genuine |
  | **Elite Overproduction** | Endogeneity of the Ratio | The elite-overproduction ratio drives instability exogenously; aspirants exceed positions available. Evidence against: If position creation lag is zero. Prediction: Ratio leads instability by 10+ years. | The ratio is endogenous; the number of elite positions is a political outcome that expands to absorb aspirants. Evidence against: If ratio moves independently of state policy. Prediction: Position creation lags aspirants by <2 years. | Genuine |
  | **Index Drift** | Meaning of Indicators Over Time | A single instability indicator means the same thing before and after a change in how records were kept; quantification normalizes drift. Evidence against: If calibration fails across centuries. Prediction: Standardized indices correlate >0.8 across eras. | Indicator meaning drifts with record keeping and economy; a wage ratio in 1600 differs from 1900. Evidence against: If standardization holds across contexts. Prediction: Cross-era correlation <0.5 without contextual adjustment. | Genuine |
  | **Definition of "Predicted"** | Probability vs. Point Forecast | "Predicted" means an elevated probability over a baseline (e.g., >60% chance). Evidence against: If probabilities do not exceed baseline during events. Prediction: Model scores >0.6 in 80% of crises. | "Predicted" means a point forecast of a dated event of a given type; probabilities are too vague to be useful. Evidence against: If point forecasts miss dates by >5 years. Prediction: Point forecasts miss >50% of events. | Verbal; Stipulation: A "Hit" is an event within the window given probability > threshold. |

  3. The Amber Window protocol

  **Test 1: Out-of-Sample Polity Test**
  *Data:* Historical data from Polity X (excluded from model training) covering 1500–1900.
  *Statistic:* Annual instability probability score generated by the Cyclist's model.
  *Rule:* A "Hit" occurs if the score exceeds 0.70 for at least three consecutive years preceding a recorded breakdown event by no more than a decade.
  *Predictions:* The Cyclist predicts 8 out of 10 known breakdowns will register as Hits. The Documentarian predicts only 4 out of 10 will register as Hits, attributing successes to chance alignment.

  **Test 2: Matched-Control False Positive Test**
  *Data:* Ten polities exhibiting high structural stress indicators (fiscal strain, elite competition) that did not experience breakdown.
  *Statistic:* False Positive Rate (FPR) of the model flagging these controls as high-risk.
  *Rule:* A "Miss" occurs if the model assigns a probability score >0.70 to a control polity that remains stable for 50 years.
  *Predictions:* The Cyclist predicts an FPR of <20%, arguing stress sometimes dissipates without collapse. The Documentarian predicts an FPR of >50%, arguing indicators are ubiquitous and non-diagnostic.

  **Test 3: Live Threshold Commitment**
  *Data:* Current global structural indicators aggregated from 2020–2024.
  *Statistic:* Binary threshold breach (Yes/No) for a major instability window.
  *Rule:* The Cyclist must commit now to a specific window (e.g., 2040–2050) where probability exceeds 0.80.
  *Predictions:* The Cyclist predicts a breach will occur, specifying 2045 ± 5 years. The Documentarian predicts no breach will occur or that the metric will prove meaningless by 2045, citing index drift.

  4. Residual disagreement

  If all three tests favor The Cyclist, they will claim structural dynamics are forecastable but will withhold the claim that specific agents are irrelevant. The Documentarian will concede models have heuristic utility but will deny they capture historical causality, maintaining that archives silence the mechanism. If all three tests favor The Documentarian, they will claim quantification is inherently retrospective. The Cyclist will concede the current model is flawed but will withhold abandonment of the theory, arguing data quality obscured the signal. Both agree that neither outcome settles the metaphysical question of whether history repeats, only whether this specific instrumentation works.
