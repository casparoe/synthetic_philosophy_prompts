answer: |-
  This is a sharp dissection of a classic philosophical problem. The "Paradox of Fiction" (often attributed to Colin Radford) rests on three inconsistent propositions:
  1.  We feel genuine emotions for fictional characters.
  2.  To feel genuine emotions, we must believe the objects of those emotions exist.
  3.  We know fictional characters do not exist.

  Your classmate's rollercoaster analogy is a popular intuitive fix, usually aligned with Kendall Walton's "Make-Believe" theory or a physiological "startle" response. But as you suspect, it leaks.

  Here is an audit of the rollercoaster analogy, followed by a stress test against guilt/agency, and a proposal for a more robust comparison.

  ---

  ### 1. Auditing the Rollercoaster Analogy

  Your classmate suggests that fiction is a "safe danger." Here is how the mapping works, and where the structural integrity fails.

  | Rollercoaster Element | Fictional Equivalent | Function in the Analogy |
  | :--- | :--- | :--- |
  | **The Track / Drop** | The Script / Plot Point | The engineered stimulus designed to provoke a reaction. |
  | **The Harness / Brakes** | Knowledge of Fictionality | The cognitive "safety bar" (knowing the actor is alive) that prevents us from intervening. |
  | **The Scream / Adrenaline** | Tears / Fear | The physiological output. |
  | **The Queue / Ticket** | Willing Suspension of Disbelief | The voluntary entry into the experience. |

  #### Where the Mapping Holds
  It successfully explains **voluntary exposure to negative stimuli.** We pay money to be scared on a coaster; we pay money to be saddened by a tragedy. It explains why we don't call the police when a character is murdered on screen: the "harness" (knowledge of fiction) holds us in our seats.

  #### Where the Mapping Breaks
  **1. Sensation vs. Cognition:**
  A rollercoaster drop triggers the vestibular system (balance) and the amygdala (fear). It is largely pre-cognitive. You feel the drop before you think about it.
  *   **The Break:** Sadness over a character's death is highly cognitive. It requires understanding relationships, unfulfilled potential, and moral loss. You cannot feel grief for a character if you don't understand their story, whereas you can feel fear on a coaster without knowing the engineer's name. The rollercoaster analogy reduces emotion to *sensation*, ignoring the *thought* required for grief.

  **2. Passivity vs. Engagement:**
  On a coaster, you are a passenger. The track is fixed.
  *   **The Break:** In fiction, especially literature, the audience often co-constructs the world through imagination. But more importantly, the emotional payoff often relies on *judgment*, not just reaction. We don't just "drop" when a villain dies; we feel *satisfaction* or *injustice* depending on the context. The coaster cannot model moral judgment.

  ---

  ### 2. Does it smuggle in "Misfired Survival Instincts"?

  **Yes.** This is the analogy's biggest philosophical cost.

  By comparing fictional sadness to the scream on a rollercoaster, the analogy implies that our emotions are **non-cognitive reflexes** that have been tricked. It suggests that when you cry, a primitive part of your brain has been duped into thinking a real human died, while your rational brain knows better.

  This aligns with the **"Quasi-Emotion" view** (argued by Kendall Walton). Walton suggests that when we watch horror, we aren't *actually* afraid; we are experiencing a physiological state that *mimics* fear within a game of make-believe.

  **The Problem:** If fictional emotions are just misfires, why do they change our real-world behavior?
  *   If *Uncle Tom's Cabin* is just a rollercoaster, why did it fuel abolitionism?
  *   If *Schindler's List* is just a safe drop, why do people leave the theater vowing to donate to charity?

  Real misfires (like swerving when you see a stick that looks like a snake) correct themselves immediately once the error is spotted. Fictional emotions linger and integrate into our real-world moral framework. The rollercoaster analogy cannot explain **lasting emotional residue.**

  ---

  ### 3. The Guilt Problem (Agency and Interactive Fiction)

  You hit on the fatal flaw: **Guilt requires agency.**

  *   **Rollercoaster:** You cannot feel guilty on a rollercoaster (unless you sabotaged the brakes). The track is external.
  *   **Video Games / Choose-Your-Own-Adventure:** In games like *The Walking Dead* or *Bioshock*, players report genuine guilt over killing a fictional character or failing to save them.

  **Why the Rollercoaster Fails Here:**
  If fiction is a coaster, the player is a passenger. But in moral gaming, the player is the **driver**.
  *   If I choose to sacrifice Character A to save Character B, and I feel guilt, it is because I acknowledge **I caused this.**
  *   The rollercoaster analogy assumes the "track" (script) is the sole cause of the emotion.
  *   In interactive fiction, the emotion arises from the collision of the *system* and my *will*.

  If the rollercoaster analogy were true, feeling guilt over a fictional choice would be irrational to the point of delusion. But it's not delusion; it's a recognition of my own moral reasoning processes being tested in a sandbox. The coaster analogy has no mechanism for **internal agency.**

  ---

  ### 4. The Dream Analogy: Is it better?

  People often say, "It's like a dream; you feel it while it's happening."

  *   **Pros:** It captures the immersive quality and the lack of immediate reality-checking.
  *   **Cons:** It fails the core condition of the Paradox of Fiction.
      *   In a dream, you generally **believe** the threat is real until you wake up.
      *   In fiction, you **know** it is fake while you are watching.

  If you are watching a horror movie and you think, "That monster isn't real," but you still feel fear, the Dream Analogy doesn't help. Dreams rely on the *absence* of the safety harness. Fiction relies on the *presence* of the safety harness. The Dream Analogy solves the emotion by removing the knowledge; the Paradox of Fiction demands we explain the emotion *keeping* the knowledge.

  ---

  ### 5. A Better Analogy: The Flight Simulator

  If the Rollercoaster is too passive and the Dream is too delusional, consider the **Flight Simulator.**

  | Flight Simulator Element | Fictional Equivalent | Why it works better |
  | :--- | :--- | :--- |
  | **The Simulation** | The Narrative World | It is an artificial environment governed by rules. |
  | **The Controls** | Imagination / Agency | In books, you steer with imagination; in games, with inputs. You have *some* control. |
  | **The Crash** | Tragic Outcome | You can "crash" the plane (character dies). |
  | **Safety** | Knowledge of Fiction | You know you won't physically die. |
  | **The Debrief** | Reflection / Aftermath | You analyze *why* you crashed. |
  | **Guilt/Lesson** | Moral Takeaway | If you crashed due to negligence, you feel guilt/regret. You learn from it. |

  **Why the Simulator solves the Paradox:**

  1.  **It validates the emotion without requiring belief:** A pilot in a sim feels stress when the engine fails. They know it's a sim. The stress is real because the *skills* being tested are real. Similarly, fictional emotions are real because the *empathic and moral muscles* being exercised are real.
  2.  **It covers Guilt:** If you make a bad choice in the sim, you feel responsible. This maps perfectly to video game guilt. You are practicing decision-making.
  3.  **It explains the value:** We don't ride rollercoasters to learn; we ride them for thrills. We use simulators to *train*. This explains why we engage with sad fiction: to practice grief, empathy, and moral reasoning in a low-stakes environment.
  4.  **It resolves the "Misfire" accusation:** The emotion isn't a glitch; it's a feature. The simulator is *designed* to trigger stress responses so the pilot learns to manage them. Fiction is designed to trigger sadness so we learn to process it.

  ### Conclusion

  The rollercoaster analogy is a **physiological explanation** for a **cognitive phenomenon.** It works for horror and thrillers (startle responses) but collapses under tragedy and moral complexity. It smuggles in the idea that fictional emotions are "fake" or "mistakes."

  The **Flight Simulator** analogy is superior because it treats the emotional response as **functional.** It acknowledges that we know the world isn't real (the safety), but asserts that our reaction is real because *we* are real, and our capacity for empathy and moral judgment is being engaged, not tricked.

  The paradox dissolves when you stop asking, "Why do I believe this is real?" and start asking, "Why does my mind process *concepts* the same way it processes *reality*?" The simulator shows us that for the human brain, a sufficiently detailed model of a tragedy *is* a tragedy to think about, regardless of its ontological status.
