  **MEMORANDUM OF OPINION**

  **TO:** Emergency Resource Allocation Board
  **FROM:** Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Catastrophic-Surge Triage Protocol Certification

  **Introduction**

  Next Tuesday, this Board must decide whether to certify a new catastrophic-surge triage protocol. The central ethical contention concerns the protocol's tie-breaking rule: when patient cohorts present identical clinical priority scores, selection is randomized. The designers characterize this not as a convenience, but as an "acknowledged genuine moral dilemma," asserting that when moral considerations are symmetrically balanced, no resolution is correct. A minority of the Board contends this constitutes a design failure violating our charter's prohibition against institutionalizing an "unavoidable moral wrong." This opinion evaluates whether a decision-making system can legitimately encode a choice lacking a correct answer and recommends a course of action that respects both moral reality and our fiduciary duties.

  **The Legitimacy of Encoding Moral Indeterminacy**

  We must treat the designers' claim seriously: genuine moral dilemmas exist. In surge capacity, we often face incommensurable values—equality of opportunity versus maximization of benefits. When clinical scores are truly identical, no medical fact distinguishes the patients. To insist on a non-random tie-breaker is to imply a moral distinction exists where none is visible. If we invent one (e.g., social value, age), we introduce discrimination. If we refuse to choose, patients die by default, which is itself a choice.

  A decision-making system can legitimately encode a procedure for irresolvable conflicts. The "correctness" lies not in the outcome (Patient A vs. Patient B) but in the procedure (Randomization). This acknowledges the moral residue honestly rather than suppressing it behind a spurious principle. Randomization in this context is not an abdication of agency, but the only procedure that respects the equal moral worth of symmetric patients. It institutionalizes humility, not wrongness.

  **The Charter and the Minority Objection**

  The Minority argues that apparent symmetry dissolves with finer-grained distinctions (prognosis, vulnerability) and that labeling ties "arbitrary" is a design failure. They invoke the charter clause prohibiting protocols that "institutionalize an unavoidable moral wrong." Their concern is that randomization treats human life as a lottery, violating the duty to care for each patient as an individual.

  However, rejecting the protocol does not resolve this tension; it merely relocates it. Without a certified protocol, triage decisions during surge will still occur, but they will be made ad hoc by bedside clinicians under extreme stress. This relocates the moral burden from the institution to the individual, increasing liability, inconsistency, and the risk of covert bias. Rejecting the protocol creates a vacuum where the "moral wrong" of arbitrariness becomes hidden rather than acknowledged. The charter prohibits institutionalizing *unavoidable* wrongs; if scarcity makes death unavoidable, the protocol manages the distribution of risk fairly. The wrong is the scarcity, not the tie-breaker.

  **Recommendation: Adopt with Binding Conditions**

  I recommend we **ADOPT WITH CONDITIONS**. We should certify the protocol but bind its implementation to strict safeguards that address the Minority's concern about premature resignation to arbitrariness.

  **Binding Conditions:**
  1.  **Validation of Symmetry:** Randomization may only trigger after a secondary review confirms that no clinically relevant finer-grained distinctions exist. "Identical scores" must be validated by two independent triage officers.
  2.  **Audit Trail:** Every randomized decision must be logged with the specific clinical data justifying the "identical" classification, subject to post-crisis ethics audit.
  3.  **Sunset Clause:** This protocol expires 24 months after adoption unless re-certified based on audit data regarding tie frequency.

  **Implementation Timeline**

  *   **Weeks 1-4:** Revise protocol documentation to include secondary review requirements.
  *   **Weeks 5-8:** Conduct simulation training for triage officers focusing on identifying true symmetry vs. data gaps.
  *   **Week 9:** Final Board vote on revised conditions.
  *   **Week 10:** Protocol activation readiness declared.

  **Analysis of the Rejected Position**

  The strongest consideration on the side I reject (the Minority's call to Reject the protocol) is the risk of moral complacency. By labeling a tie a "genuine dilemma," we risk accepting epistemic laziness. There may *always* be a distinction we failed to find. If we institutionalize randomization, we may stop looking for those distinctions, potentially missing opportunities to save those with slightly better prognoses.

  However, adopting with conditions mitigates this. We mandate the search for distinctions (Condition 1) before allowing randomization. Rejecting the protocol entirely assumes we can find a perfect principle where none exists, potentially leading to worse outcomes through decision paralysis or biased heuristic shortcuts during a crisis. The tension remains—scarcity is tragic—but this path manages it transparently rather than pretending it can be solved by refusing to plan.

  **Conclusion**

  We cannot legislate away moral tragedy. We can only ensure our response is honest, fair, and consistent. This protocol, with strict conditions on when randomization is permissible, offers the most ethically defensible path through the surge.

  \answer{ADOPT WITH CONDITIONS Honors moral limits honestly while mandating rigorous clinical distinction first.}
