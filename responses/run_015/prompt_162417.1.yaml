  ### Prediction
  **Verdict:** **No.** (Leaning 70% confidence).
  Lena will likely reject the Research Directions Chamber, probably with a caveat similar to the Water-Allocation case ("Yes, but only if...") that effectively kills the current design. She will argue that while research funding is prone to political capture, a standing body with binding appropriation authority usurps the electoral accountability required for public spending.

  ### Analysis of Candidate Rules
  Here is how the four rules you proposed map onto her track record and the new case:

  1.  **"Use the lot when whoever would otherwise decide has a stake in the outcome." (Conflict of Interest)**
      *   **Predicts:** **Yes.**
      *   **Why:** Elected officials clearly have a stake in research funding (bringing grants to their districts, courting university donors). This fits the Redistricting and Ethics Commission cases perfectly.
      *   **Weakness:** It fails to explain the **School Board No**. Politicians have a huge stake in education policy, yet she rejected replacing the board with a lot. It also struggles with the **Transit No**, where political stake is high.

  2.  **"Use it only for bounded, single-purpose bodies that dissolve afterwards." (Temporality)**
      *   **Predicts:** **No.**
      *   **Why:** The Research Chamber has "staggered three-year terms," "permanent staff," and is a continuing body. This matches her **Transit**, **Cabinet**, and **School Board** rejections.
      *   **Weakness:** It struggles with the **Ethics Commission Yes**, which is a standing body with non-renewable terms (implying continuity). It also slightly strains the **Water-Allocation Yes**, which implies ongoing regulatory rules.

  3.  **"Use it only where the sample mirrors the people affected." (Representative Stakeholders)**
      *   **Predicts:** **Yes.**
      *   **Why:** The proposal specifies a "stratified lot." This fits the **Water-Allocation** condition (widening the frame) and the general logic of the **Redistricting** and **Housing** assemblies.
      *   **Weakness:** This rule is too permissive. It would have approved the **School Board** and **Citizens' Cabinet**, both of which she rejected. It explains the *method* of selection but not the *scope* of power.

  4.  **"Don't use it where the call is really technical." (Epistemic Competence)**
      *   **Predicts:** **No.**
      *   **Why:** Deciding between "fusion" and "ag research" involves technical judgment. This fits the **Medicaid No** (clinical drugs).
      *   **Weakness:** It fails to explain the **Redistricting Yes** (highly technical mapping) and **Water-Allocation Yes** (hydrology/engineering). Lena seems to accept expert testimony (included in this proposal) as a mitigation for technicality, as seen in the Waste Plan Yes.

  ### Best Guess: The "Constraint vs. Appropriation" Rule
  **Rule:** **"Sortition is legitimate for setting structural rules or oversight constraints, but illegitimate for ongoing appropriation of public funds or executive administration."**

  **Reasons I prefer this:**
  1.  **Explains the Budget Veto:** The strongest signal in her record is the **Citizens' Cabinet No**. Her quote ("a budget is the one thing that has to be somebody's responsibility at election time") is the only explicit theoretical justification she offers. The Research Chamber is, functionally, a budget allocator ("binding authority over how the fund is split").
  2.  **Explains the Ethics Exception:** The Ethics Commission is a standing body (violating Rule B), but its power is *negative* (sanctioning/constraining officials), not *positive* (spending money). It fits the "Oversight" clause of my rule.
  3.  **Explains the Redistricting Exception:** Redistricting is binding, but it sets the *rules of the game*, not the *allocation of resources*. It is constitutional/structural, not appropriative.
  4.  **Handles the Technicality:** She accepts technical tasks (Redistricting, Water) if the *political function* is rule-setting. She rejects technical tasks (Medicaid) if the function is rubber-stamping administrative implementation.

  On this rule, the Research Chamber fails because it is a **standing body** (like the Cabinet) exercising **binding appropriation** (like the Cabinet), even if the scope is narrower.

  ### Discriminating Variant
  To separate **Rule B (Temporality)** from my **Best Guess Rule (Appropriation)**, propose this variant:

  **The Variant:** A **one-off** Citizens' Assembly (dissolves after 6 months) that sets a **binding 10-year formula** for research splits (e.g., "30% Climate, 20% Biomed"), after which the legislature must re-approve any changes.

  *   **If Lena says YES:** Her primary objection was the **Standing Nature** (Rule B). She is okay with sortition controlling money if the body dissolves immediately after, preserving the "one-off constitutional moment" vibe of the Housing or Redistricting cases.
  *   **If Lena says NO:** Her primary objection is the **Binding Appropriation** (My Rule). She believes electors must own spending decisions annually, regardless of whether the body is temporary or permanent.

  ### Confidence & Uncertainty
  **Confidence:** **Medium-High (70%).**
  **Critical Feature:** The **Binding** nature of the authority.
  If the proposal were changed from "Binding authority" to **"Advisory Recommendations"** (like the Waste Plan), my prediction flips to **Yes**. The Waste Plan was a 10-year strategy advised by a jury; the Research Chamber is a 10-year strategy decided by a chamber. The "Cabinet" rejection hinges on the "binding vote." If the politicians retain the final vote on the split, Lena likely approves, as it mitigates the accountability deficit.

  **Where I Might Be Wrong:**
  My reading of the **Ethics Commission** precedent. I am classifying the Ethics Commission as "Oversight/Constraint." If Lena classifies it as "Administrative Sanctioning," then she *does* allow standing sortition bodies to wield significant power.
  Furthermore, if she views Research Direction not as "Spending" but as **"Science Policy"** (akin to Redistricting as "Election Policy"), she might view this as setting the *rules* of science rather than spending the *money* of science. The fact that individual grants still go to peer review helps this argument. If she buys the frame that "This is not a budget, it's a constitution for knowledge," she will vote **Yes**, and my "Appropriation" rule will have been too narrow.
