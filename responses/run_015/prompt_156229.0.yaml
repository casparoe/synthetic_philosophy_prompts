      *   *Social Shaping:* Drunk speech is still performative. It's addressed to the room. If the room rewards cruelty, you get cruelty. If it rewards vulnerability, you get vulnerability. It's not a vacuum.
      *   *Asymmetry:* The core user objection. We treat output as "truth" when it hurts others, and "noise" when it commits the speaker.

