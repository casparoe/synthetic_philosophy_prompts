      *   *Confidence/Mood:* Critical. This creates false positives. People sound sure of things that are wrong.
      *   *Social Shaping:* Critical. The "courage" is often just conformity to a new, temporary norm of brutality.
      *   *Asymmetry:* Fatal. This undermines the social contract. If the mechanism is unreliable, you can't cherry-pick when it counts.

