      *   Validate the user's suspicion (it *is* endogenous).
      *   Be decisive on the beer.

  9.  **Self-Correction/Nuance Check during drafting:**
      *   *Wait, didn't Amazon prove planning works?* Amazon plans internally. But it operates within a broader market ecosystem that sets wages, capital costs, and consumer demand. It's a planned island in a market sea. Need to mention this.
      *   *Did Lange actually say planners can do trial and error?* Yes, the "Lange-Lerner Theorem." They simulate prices. The critique is they lack the *entrepreneurial drive* to act on them.
      *   *Hayek vs. Mises:* Mises said calculation is impossible without prices. Hayek said it's about knowledge utilization. Need to blend these. The user is channeling Hayek (telecoms).
      *   *Big Data:* Algorithms predict what you *will* buy based on what you *did* buy. They struggle with what you *might* buy if a new product existed (Steve Jobs paradox).

  10. **Final Structure:**
