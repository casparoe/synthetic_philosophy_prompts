          *   The paradox of reversibility (if you can undo it easily, it doesn't bind; if you can't, it violates autonomy).

  3.  **Drafting Question Set (i): The Sophistication Assumption:**
      *   *Goal:* Challenge the idea that the Past Self knows best. If Past Self is wrong, does the binding remain autonomous?
      *   *Draft 1:* What if the past self predicts wrong? Is it still autonomous?
      *   *Refinement:* Needs more philosophical heft. Focus on the *normative weight* of a mistaken prediction.
      *   *Follow-up Strategy:* She will likely say "Mistakes happen, but the *attempt* to govern is what matters." Push on whether a mistaken constraint becomes *paternalistic* (imposing a will that doesn't align with the agent's actual good).
      *   *Final Polish:* Frame it around the distinction between *procedural* autonomy (I chose this) vs. *substantive* autonomy (This aligns with my actual will).

  4.  **Drafting Question Set (ii): The Reversibility Condition:**
