              *   Topic 3: Main Q + Follow-up 1 + Follow-up 2 (The Evidence Question).
              *   *Actually, simpler:* Just ensure the final question of the entire set is the evidence question. I will structure it as three distinct modules, but the third module will have the "killer" follow-up that satisfies the "evidence" requirement.

      *   *Let's refine the "Progressively Harder" constraint:*
