      *   *Refining the "Conflation" point:* The linguist is worried that they can't *know* the meaning. Wittgenstein argues that meaning isn't a hidden object to be known, but a public practice. Quine argues that meaning isn't a fact to be known, even in principle. The linguist's worry assumes there *is* a fact (rabbit vs. part) that is hidden by the taboo. Quine says there is no such fact. Wittgenstein says the question depends on the practice. So the linguist is actually assuming a realist view of meaning that *both* Quine and Wittgenstein attack, but in different ways.
