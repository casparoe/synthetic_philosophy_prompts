answer: |-
  This is a classic, high-quality instantiation of the Quantum Immortality (QI) puzzle, sharpened by your student's use of König's Lemma and the "tapered machine" to bypass the usual measure-decay objections. The student is formally correct about the topology of the branching structure, but they are making a category error in the *normative* link between that structure and rational expectation.

  Here is the breakdown you need to grade the paper, structured by your specific questions.

  ### 1. Which step do you reject?
  **Reject Step (2).**

  Step (2) claims: *"What I should expect is settled by the branches that host experiences of mine... conditional on my experiencing anything at all, I am in a live branch."*

  This is the **Conditionalization Error**. The student is treating the fact of their own existence as evidence that updates probabilities *before* the branching event, rather than recognizing that the branching event determines the measure of that existence.

  In standard probability, if I roll a die, I condition on the die landing. In Everettian quantum mechanics, *all* outcomes land. The question is not "Which branch exists?" (Answer: All of them). The question is "How should I weight my concern/expectation across existing branches?"

  Step (2) asserts that rational expectation should weight branches by *count* (or mere existence) restricted to those containing the observer. The consensus in modern Everettian decision theory (Deutsch, Wallace, Saunders) is that rational expectation must weight branches by **Born Rule measure**, regardless of whether the observer survives in all of them.

  ### 2. What does rejecting (2) cost?
  It costs you "naive" self-locating uncertainty. You must adopt a **Decision-Theoretic Derivation of the Born Rule**.

  *   **The Cost:** You cannot treat probability as simple frequency or branch counting. You must argue that a rational agent in a branching universe *ought* to act as if the Born Rule gives the probabilities. This is not an empirical discovery but a normative constraint on rationality (similar to Dutch Book arguments).
  *   **The Benefit:** It saves the physics from solipsism. It allows you to say, "I expect to die with probability 1/2," even though there is a branch where I live. The "I" that expects is the pre-branch agent weighing the welfare of all successors.

  ### 3. Authority of Measure and the Measure-Zero Worldline
  You asked: *Where does the measure get its authority, and what do I say about the worldline from (4)?*

  *   **Authority:** The authority comes from **symmetry and diachronic consistency**. If you don't weight by measure, you become vulnerable to "quantum Russian Roulette" scams where you pay to enter games that destroy most of your successors but leave one happy one. The Deutsch-Wallace theorem shows that if you satisfy certain axioms of rationality (ordering, continuity, branching indifference), you *must* maximize expected utility using Born weights.
  *   **The Measure-Zero Worldline:** It is coherent to say: *"That worldline exists physically, it contains a psychological successor of me, but the probability of me ending up there is zero."*
      *   **Analogy:** Pick a random real number between 0 and 1. The number 0.5 exists in the interval. The probability of picking exactly 0.5 is zero. It is not a contradiction to say "0.5 is in the set" and "I will not pick 0.5."
      *   **Grading Point:** The student conflates *possibility* (there is a path) with *expectation* (I should bet on that path). In continuous probability spaces (which Hilbert space effectively is), measure-zero events are possible but not *expected*. To expect the measure-zero path is irrational, akin to expecting to win the lottery every time.

  ### 4. Evaluating the Three Overreach Cases
  All three are damaging, but they attack different vulnerabilities.

  *   **Case 1: The Million Coins (Logical Reductio).** **This is the most damning.**
      *   If Step (2) holds, you should expect *any* low-probability survival event with certainty, provided the amplitude is non-zero. This severs the link between physical dynamics (the Hamiltonian) and rational expectation entirely. It implies that a branch with amplitude $10^{-100}$ is just as "expectable" as one with amplitude $0.99$, provided it's the only one where you survive. This renders the physics irrelevant to decision-making.
      *   *Verdict:* Use this to show Step (2) violates the Principal Principle.

  *   **Case 2: The Friend in the Next Room (Symmetry Break).**
      *   This highlights the **indexical solipsism** of the argument. If the student expects to survive (because only surviving branches count for *him*), does he expect the friend to survive?
      *   If the triggers are independent, his logic grants him immortality but grants her mortality (from his perspective). But physically, they are identical systems. Why does the "expectation rule" apply indexically to him but not her? If he says "I expect her to survive too," he is now predicting a correlation that doesn't exist in the wavefunction (independent branches). If he says "I don't expect her to survive," he admits his expectation rule is solipsistic and not about the world, but about his own indexical location.
      *   *Verdict:* Strong phenomenological objection, but the student might bite the bullet (solipsism).

  *   **Case 3: Universal Immortality/Inaction (Pragmatic Reductio).**
      *   This is the **action-guidance failure**. If the argument works, no Everettian should ever wear a seatbelt or avoid a cliff, provided there is *some* branch where they survive (e.g., via quantum tunneling).
      *   Since MWI proponents (Deutsch, Wallace, Carroll) *do* wear seatbelts, the theory fails to guide action. A theory of probability that tells you to act differently than all actual agents is pragmatically defective.
      *   *Verdict:* The strongest practical objection.

  ### 5. Is there a reading of (2) that is true but too weak?
  Yes. Distinguish **Experience** from **Expectation**.

  *   **True:** "I will only *experience* branches in which I survive." (Tautology of consciousness).
  *   **False:** "I should *expect* to survive with probability 1."
  *   **Correction:** "I should expect to survive with probability equal to the Born measure of the surviving branches."

  The student's Step (3) ("By induction... I should expect to experience surviving") fails because the expectation at $t_1$ must account for the measure loss at $t_1$. You cannot iterate conditional expectations on survival without renormalizing the measure, and if you renormalize, you aren't doing Everettian probability anymore; you're doing single-world probability with post-selection.

  ### 6. Grading Strategy & Comments
  The student deserves high marks for the topology (König's Lemma) and the measure-tapering innovation. Those show genuine technical competence. The failure is philosophical, not mathematical.

  **Suggested Margin Comments:**

  *   **On Step (2):** "You have conflated the *condition of experience* with the *probability of outcome*. In MWI, the pre-branch agent has successors in both live and dead branches. Rationality requires caring about all successors weighted by measure, not just the ones who can write office hour emails."
  *   **On the Tapered Machine:** "This prevents measure decay, but it doesn't justify conditionalizing on survival. Even if the surviving measure is 2/3, the dead measure is 1/3. A rational agent fears the 1/3 loss. You are arguing that because the dead successors don't report back, the pre-branch agent shouldn't fear their loss. That is a failure of diachronic consistency."
  *   **On the Million Coins:** "Apply your Step (2) here. Should I expect a 1-in-$2^{1,000,000}$ event with certainty? If yes, you have severed expectation from physics. If no, Step (2) is false."
  *   **On the Measure-Zero Path:** "Existence $\neq$ Expectation. A measure-zero worldline is like picking exactly 0.5 from a uniform distribution over [0,1]. It is there, but betting on it is irrational."

  **Final Verdict for the Paper:**
  The argument is **valid** (the conclusion follows from the premises) but **unsound** (Premise 2 is false). The student has successfully proven that *if* rational expectation tracks branch existence rather than Born measure, *then* quantum immortality follows. Since the antecedent is rejected by standard Everettian decision theory, the conclusion does not hold.

  **Recommendation:** Grade based on the clarity of the dilemma. The student has forced you to articulate *why* we keep the Born Rule in MWI. That is a successful seminar paper, even if the conclusion is wrong. Do not penalize for the conclusion; penalize only if they fail to acknowledge the decision-theoretic counter-argument in the final draft. If they double down on (2) without addressing Deutsch-Wallace, mark it as a failure to engage with the literature.

  **Short answer for your Friday deadline:**
  Reject (2). The cost is adopting Decision-Theoretic MWI. The measure-zero worldline is real but not expectable. The "Million Coins" case is the logical killer; the "Inaction" case is the pragmatic killer. The student has proven that QI follows from *Branch-Counting*, not from *Everettian Physics*. Since Everettians reject Branch-Counting, they reject QI.
