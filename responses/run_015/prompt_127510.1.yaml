  Here is the translation of the Raven Paradox into Property-Based Testing (PBT) vocabulary, followed by the residue report on what breaks during compilation.

  ### The Setup: The Hypothesis as an Invariant

  In your world, the hypothesis `H: All ravens are black` is not a static truth claim. It is a **property invariant**.

  ```python
  def prop_ravens_are_black(obj):
      assume(is_raven(obj))  # Pre-condition
      assert is_black(obj)   # The Invariant
  ```

  Logically, this is equivalent to the contrapositive `H': All non-black things are non-ravens`:

  ```python
  def prop_non_black_are_non_ravens(obj):
      assume(not is_black(obj)) # Pre-condition
      assert not is_raven(obj)  # The Invariant
  ```

  **The Paradox in PBT terms:**
  Classical logic says `prop_ravens_are_black` and `prop_non_black_are_non_ravens` are extensionally identical. If you run a test suite against the universe of objects, any input that passes one passes the other. Therefore, a `WhiteSneaker` input passes both.
  Your gut says: Running `WhiteSneaker` against `prop_ravens_are_black` should yield **zero coverage**, and therefore **zero confidence gain**.

  Here is the breakdown of your four specific questions.

  ---

  ### 1. Extensionality vs. Coverage (The "Gut" Check)
  **Question:** *Does anything in code-talk separate the two equivalent formulations?*

  **Translation:**
  Code is extensional in **return value**, but intensional in **execution path**.
  When you run `prop_ravens_are_black(WhiteSneaker)`, the `assume(is_raven)` filter rejects the input. In most PBT frameworks (Hypothesis, QuickCheck), this is not a "Pass." It is an **Invalid** case. It is discarded from the statistics.

  However, if you write the invariant without the `assume` (using material implication):
  ```python
  def prop_impl(obj):
      if is_raven(obj):
          assert is_black(obj)
  ```
  Running `WhiteSneaker` here executes the `if`, evaluates to `False`, skips the `assert`, and returns `True`.
  **Coverage Analysis:** This input contributes to **line coverage** (the `if` was touched) but **zero branch coverage** (the `assert` branch was not taken).

  **Verdict:**
  Your gut is tracking **branch coverage**, not logical truth.
  In PBT, confidence is a function of *how much of the state space was exercised*, not just *how many tests passed*. A white sneaker passes the test but fails to exercise the critical branch (`is_raven == True`).
  **Code separates them:** One formulation treats the sneaker as `Invalid` (filtered), the other treats it as `Pass` with `0% branch coverage`. The paradox vanishes if you define confidence as "Coverage of the positive space" rather than "Absence of failures."

  ### 2. Generators and Sampling Distribution
  **Question:** *Does the paradox depend on how the white sneaker got into the sample?*

  **Translation:**
  Yes. In PBT, the **Generator** is part of the test definition.
  If your generator `gen_universe()` is uniform over all matter, `WhiteSneaker` is abundant and `Raven` is rare.
  *   Running 1,000,000 tests on `gen_universe()` yields 999,990 sneakers and 10 ravens.
  *   You have high confidence in `prop_non_black_are_non_ravens` (you checked lots of non-black things).
  *   You have statistically insignificant confidence in `prop_ravens_are_black` (you only checked 10 ravens).

  **Verdict:**
  The paradox assumes a uniform prior over the "universe of discourse." PBT explicitly rejects this. You know your generator is **shaped**.
  You don't need to sneak in a Bayesian prior; you just need to look at the **input distribution report**.
  If you want to verify `All ravens are black`, you write `gen_raven()`. If you verify it using `gen_object()`, you are running the wrong test suite for that specific invariant. The "evidence" is not the pass/fail; it is the pass/fail **weighted by the probability of generating a counter-example**. A sneaker has a near-zero probability of being a counter-example to "All ravens are black," so testing it yields near-zero information gain.

  ### 3. Vacuous Truth and Unreachable Branches
  **Question:** *A test can pass on an input I already knew couldn't reach the branch. Is there a counterpart?*

  **Translation:**
  This is the **`assume()` vs. `if`** distinction.
  *   **Philosophy:** Material implication (`False → Anything` is `True`). A non-raven makes the statement "If it is a raven, it is black" trivially true.
  *   **PBT:** We distinguish between **Valid** and **Invalid** inputs.
      *   If you use `assume(is_raven)`, a sneaker is **Invalid**. It is not counted in the pass rate.
      *   If you use `if is_raven`, a sneaker is a **Pass**, but mutation testing reveals the weakness.

  **Mutation Score:**
  If you mutate the code to `assert is_white(obj)` inside the `if is_raven` block, the `WhiteSneaker` test case **does not catch the mutation**. It is a **weak test case**.
  PBT has a precise metric for this: **Mutation Coverage**. A test case that cannot distinguish between the correct invariant and a mutated (broken) invariant provides **no evidence**.
  A white sneaker cannot detect a mutation where ravens are green. Therefore, it is evidence-free for the specific hypothesis, regardless of logical truth.

  **Verdict:**
  PBT handles this cleanly. Philosophy treats vacuous truth as "True." PBT treats it as "Unverified." Your intuition that it is "zero information" is exactly what Mutation Score measures.

  ### 4. Grue and Overfitting
  **Question:** *Is `Grue` just overfitting? Does code complexity do the work?*

  **Translation:**
  `Grue` is defined as: `Green` if `time < T`, else `Blue`.
  `Black` is defined as: `reflects_wavelength(400nm)`.

  In code terms:
  *   `is_black(obj)`: O(1) property lookup.
  *   `is_grue(obj, T)`: O(1) lookup + Clock dependency + Conditional logic.

  **Verdict:**
  Yes, this is **Overfitting** / **Model Complexity**.
  In PBT, we prefer invariants with lower **Cyclomatic Complexity** and fewer **External Dependencies** (like system time).
  *   **Natural Kinds** map to **Stable Schemas**. `Raven` is a type/class. `Grue` is a computed predicate dependent on environment state.
  *   **Occam's Razor** maps to **Minimum Description Length**. The implementation of `prop_black` is shorter and more compressible than `prop_grue`.

  **Distortion:**
  Philosophy worries that `Grue` is *metaphysically* wrong. PBT says `Grue` is *pragmatically* expensive and brittle. If the clock changes, the test flakes. PBT prefers `Black` not because it's "truer," but because it's **more stable** and **cheaper to verify**. This is usually good enough, but it sidesteps the question of *why* nature prefers "Black" over "Grue." It just notes that "Black" is a simpler function.

  ---

  ### Residue Report: What Didn't Compile

  Here is the honest assessment of where your vocabulary hits the wall.

  | Concept | PBT Translation | Fidelity | The Residue (What's Lost) |
  | :--- | :--- | :--- | :--- |
  | **Logical Equivalence** | Extensional Equality (Return Values) | **High** | PBT cares about *cost* and *paths*, Logic cares only about *truth*. The paradox exists only because Logic ignores cost. |
  | **Evidence / Confirmation** | Coverage & Mutation Score | **High** | Philosophy treats confirmation as binary (supports/doesn't). PBT treats it as continuous (0% to 100% coverage). This dissolves the paradox rather than solving it. |
  | **The Universe** | Generator Distribution | **Medium** | PBT assumes you control the generator. Philosophy assumes the universe is given. If you can't control the generator (e.g., production data), the "shaped distribution" argument gets weaker. |
  | **Natural Kinds (Raven)** | Types / Schemas | **Low** | In code, `class Raven` is arbitrary. You can define `class GrueObject`. PBT explains why we *prefer* `Raven` (compression), but not why the universe *cooperates* with that preference. |
  | **Truth** | Confidence Level | **Critical Failure** | **This is the big one.** PBT never establishes Truth. It only establishes "No bugs found *yet*." The Raven Paradox is about **Truth Conditions**. PBT is about **Risk Management**. |

  ### The Bottom Line

  **1. Is code genuinely extensional?**
  No. It is extensional in *output*, but intensional in *cost, coverage, and execution path*. Your gut feeling that a sneaker is "different" from a raven is a **Coverage Metric** intuition, not a Logic intuition. You are sensing that the sneaker does not exercise the `Raven` branch.

  **2. Do you need a Prior?**
  No. You need a **Generator Spec**. If your generator is `gen_all_objects()`, the sneaker is valid but low-value. If your generator is `gen_ravens()`, the sneaker is invalid. The paradox relies on ambiguity about *which generator* is running. PBT forces you to declare the generator, which kills the ambiguity.

  **3. What about Grue?**
  Complexity metrics (code size, dependencies) handle `Grue` well enough for engineering. The residue is metaphysical: PBT can't explain why the universe is compressible, only that we should bet on it being so.

  **4. The Hard Truth:**
  The Raven Paradox is a bug in **Classical Logic's** model of science, not in your intuition. Classical Logic treats verification as "Checking Truth." PBT treats verification as "Searching for Counter-examples."
  *   In Logic: A white sneaker is not a counter-example, so it supports the claim.
  *   In PBT: A white sneaker is not a *potential* counter-example, so it is not a useful test case.

  Your vocabulary is **thicker** than the philosophical one here. Philosophy is stuck on binary Truth. You are working with Coverage, Distribution, and Complexity. You don't need to learn their vocabulary; they need to learn yours. The "paradox" is what happens when you try to model probabilistic confidence using binary boolean logic.
