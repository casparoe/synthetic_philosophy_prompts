answer: |-
  ### (i) The Exam Question

  **Question 4 (25 Marks)**

  Consider a world populated by persons indexed by the integers $\mathbb{Z} = \{\dots, -1, 0, 1, \dots\}$. There is no first or last person. Each person $n$ possesses a welfare level $w(n) \in \mathbb{Z}$.

  **The Shift Argument:**
  Let World $W_1$ be the baseline where $w_1(n) = n$ for all $n$.
  Let World $W_2$ be the "shift" where $w_2(n) = n + 1$ for all $n$.
  Note that for every person $n$, $w_2(n) > w_1(n)$. However, the multiset of welfare values in $W_1$ is $\mathbb{Z}$, and the multiset of welfare values in $W_2$ is also $\mathbb{Z}$.

  **The Tethered Difference Rule:**
  To compare worlds $A$ and $B$, an agent selects a "tether": a nested sequence of finite sets $S_1 \subset S_2 \subset S_3 \dots$ such that $\bigcup S_k = \mathbb{Z}$.
  Let $D_k = \sum_{n \in S_k} (w_A(n) - w_B(n))$.
  *   If $D_k > 0$ for all sufficiently large $k$, $A$ is better than $B$.
  *   If $D_k < 0$ for all sufficiently large $k$, $B$ is better than $A$.
  *   If $D_k$ changes sign infinitely often, $A$ and $B$ are incomparable.

  **Answer the following:**

  1.  **Principles in Conflict (5 marks):** Explain why $W_2$ represents a conflict between the **Pareto Principle** (if everyone is strictly better off, the world is better) and **Anonymity** (only the distribution of values matters, not their assignment to indices). Which principle must be violated if we rank $W_2 > W_1$, and what is the normative cost of that violation?
  2.  **The Boundedness Objection (5 marks):** A student argues this conflict relies on welfare being unbounded (integers). They claim that if welfare were bounded (e.g., only values 0 and 1), a permutation could not yield a strict Pareto improvement. A second student claims the conflict persists even with bounded values via different permutations. Evaluate these claims. Does the *Shift* specifically require unboundedness, and does the *underlying ethical problem* survive without it?
  3.  **Local Responsiveness (5 marks):** Suppose we use the Tethered Difference Rule with a standard symmetric tether (e.g., $S_k = \{-k, \dots, k\}$). Consider a "local action" where we raise the welfare of person $0$ by 10 units, leaving everyone else unchanged. Does the rule rank the new world as better? Explain why or why not using the definition of $D_k$.
  4.  **Tether Dependence (5 marks):** Construct a specific example showing the Tethered Difference Rule is not tether-independent. Define two worlds, $A$ and $B$, involving only welfare levels 0 and 1 (e.g., evens vs. odds). Describe two different tethers, $T_1$ and $T_2$, such that $T_1$ ranks $A > B$ and $T_2$ ranks $B > A$.
  5.  **The Trilemma (5 marks):** You desire an ethical rule that satisfies: (i) Responsiveness to finite local improvements, (ii) Tether-Independence (verdicts don't depend on the sequence $S_k$), and (iii) Acyclicity (no ranking loops). Based on your work above, explain why you cannot have all three. Which condition do you drop, and why? *Note: Full marks require identifying why demanding Tether-Independence strips the rule of its ability to resolve infinite comparisons beyond simple dominance.*

  ***

  ### (ii) Model Answer

  **1. Principles in Conflict**
  The Shift creates a direct contradiction between person-affecting and impersonal views. Pareto requires $W_2 > W_1$ because every specific individual $n$ is strictly better off in $W_2$ ($n+1 > n$). Anonymity requires $W_1 \sim W_2$ because the collection of welfare values is identical (the set of integers is invariant under translation). If we rank $W_2 > W_1$, we violate Anonymity. The normative cost is accepting that *who* has the welfare matters, not just *what* welfare exists. We commit to a specific trans-world identity matching. If we uphold Anonymity, we violate Pareto, implying that a world where everyone is strictly better off is not an improvement, which undermines the basic motivational structure of consequentialism.

  **2. The Boundedness Objection**
  The first student is mathematically correct regarding the *Shift* argument specifically. If welfare values are bounded (e.g., $\{0, 1\}$), one cannot map the set to itself such that every value increases ($x \to x+1$ is impossible within a bounded range). A permutation of a bounded multiset preserves the minimum and maximum values; a strict Pareto improvement raises the minimum. Thus, the specific $n \to n+1$ construction requires unbounded welfare. However, the second student is ethically correct that the *underlying problem* persists. Even with bounded values, infinite permutations can create spatial patterns where local Pareto improvements conflict with global distributional symmetry. The unboundedness facilitates the clean "Shift" proof, but the tension between matching persons (Pareto) and matching values (Anonymity) is intrinsic to infinite aggregative ethics, not merely an artifact of unbounded integers.

  **3. Local Responsiveness**
  The rule successfully ranks the local improvement as better. Let $W_{new}$ differ from $W_{old}$ only at person $0$, where welfare increases by 10. The difference term for any set $S_k$ containing person $0$ is $D_k = 10$. Since the tether covers $\mathbb{Z}$, there exists some $K$ such that for all $k > K$, $0 \in S_k$. Consequently, $D_k = 10$ for all sufficiently large $k$. Since $10 > 0$ consistently, the rule ranks $W_{new} > W_{old}$. The infinite background welfare cancels out (difference is 0), leaving only the finite local gain to determine the sign of the limit. This shows the rule avoids paralysis on ordinary finite interventions.

  **4. Tether Dependence**
  Let World $A$ assign welfare 1 to even integers and 0 to odds. Let World $B$ assign 0 to evens and 1 to odds.
  *   **Tether 1 ($T_1$):** Let $S_k = \{-2k, \dots, 2k\}$. Each set contains $2k+1$ evens and $2k$ odds.
      Sum($A$) in $S_k \approx 2k+1$. Sum($B$) in $S_k \approx 2k$.
      $D_k = 1$ for all $k$. $T_1$ ranks $A > B$.
  *   **Tether 2 ($T_2$):** Let $S_k = \{-2k+1, \dots, 2k-1\}$. Each set contains $2k-1$ evens and $2k$ odds.
      Sum($A$) in $S_k \approx 2k-1$. Sum($B$) in $S_k \approx 2k$.
      $D_k = -1$ for all $k$. $T_2$ ranks $B > A$.
  Because the verdict flips based on the geometric shape of the finite sets used to approximate the infinite sum, the rule is tether-dependent.

  **5. The Trilemma**
  We cannot satisfy all three conditions. As shown in (4), Tether-Independence fails whenever the "density" of welfare differs across the population structure. To enforce Tether-Independence, we must declare such cases incomparable unless one world dominates the other at every finite stage (Robust Dominance). However, Robust Dominance is essentially the Pareto Principle restricted to finite differences. If we demand Tether-Independence, we lose the ability to rank the Shift ($W_1$ vs $W_2$) or the Evens/Odds cases, reducing the rule to triviality on infinite problems.
  I would drop Tether-Independence. The structural insight is that the "determinacy" provided by a tether is fake; it imports arbitrary spatial assumptions (e.g., that the origin matters) to force a ranking where none objectively exists. Accepting incomparability is preferable to accepting arbitrary verdicts. However, to maintain action-guidance, we might instead drop Acyclicity or accept a weakened Pareto, but the core lesson is that infinite aggregation requires choosing an arbitrary frame (a tether) or accepting silence.

  ***

  ### (iii) Marking Scheme

  **1. Pareto vs. Anonymity Analysis (5 Marks)**
  *   **Must Hit:** Clearly identifies that Pareto relies on cross-world person-identity matching while Anonymity relies on value-distribution matching. States that ranking $W_2 > W_1$ violates Anonymity.
  *   **Common Mistake:** Treating Anonymity as merely "ignoring names" without noting it implies indifference to permutations of the value multiset, or claiming Pareto is violated in the Shift.

  **2. Boundedness Objection Resolution (5 Marks)**
  *   **Must Hit:** Acknowledges Student A is mathematically right (bounded permutations cannot be strict Pareto improvements) but Student B is ethically right (the structural conflict remains in infinite ethics).
  *   **Common Mistake:** Dismissing the bounded case entirely as irrelevant, or claiming a bounded strict Pareto permutation is mathematically possible.

  **3. Local Responsiveness (5 Marks)**
  *   **Must Hit:** Correctly calculates that finite changes dominate the difference sum $D_k$ once the finite set $S_k$ encompasses the changed location. Verdict: The improvement is ranked higher.
  *   **Common Mistake:** Arguing that the infinite background noise swamps the finite change, or failing to reference the "sufficiently large $k$" clause in the rule definition.

  **4. Tether Dependence Construction (5 Marks)**
  *   **Must Hit:** Provides the Evens/Odds example (or equivalent). Explicitly defines two tethers with different growth rates or centers that yield opposite signs for $D_k$.
  *   **Common Mistake:** Describing the worlds but failing to define the specific sets $S_k$ for the tethers, or providing tethers that both yield "incomparable" (oscillating) results.

  **5. The Trilemma & Structural Insight (5 Marks)**
  *   **Must Hit:** Identifies that Tether-Independence forces the rule to collapse into Robust Dominance (Pareto), leaving most infinite cases incomparable. Recognizes the tether provides "fake determinacy."
  *   **Common Mistake (The B Answer):** Simply picking a side (e.g., "I drop Independence") without explaining that doing so admits the verdicts are arbitrary artifacts of the chosen coordinate system.

  **A/B Separator:**
  *   **B Answer:** Correctly identifies the conflicts and constructs the counter-examples (Parts 1-4) but treats the choice in Part 5 as a standard normative preference (e.g., "I prefer consistency over completeness").
  *   **A Answer:** In Part 5, notices that demanding Tether-Independence removes the *only* mechanism the rule had for ranking infinite worlds, revealing that the rule's apparent power was an illusion created by the arbitrary tether. The insight is that the "solution" was hiding the problem, not solving it.
