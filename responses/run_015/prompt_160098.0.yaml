  **Department for Natural Acquisition & HM Treasury**
  **Consultation Reference: DNA-2024-NE**

  **Consultation on the Statutory Enforcement of Natural Acquisition Limits and Reciprocal Need Pricing**

  **Ministerial Foreword**
  The natural end of the household is self-sufficiency, yet modern finance has permitted wealth-getting to expand without limit. As established in *Politics* I, money was brought into being for exchange, not generation. When money breeds money, we encounter interest, the most unnatural form of acquisition, for money is barren. This consultation sets out proposals to align UK economic activity with the natural limit of the *oikos* and the reciprocal proportion of need described in *Nicomachean Ethics* V. We seek evidence on implementing a framework where exchange reflects true need rather than convention, and capital is certified sterile.

  **Proposal 1: The Diagonal Need Standard (DNS)**
  Market pricing obscures the true proportion of exchange. Following the builder-and-shoemaker example, value must be equalised via diagonal proportionality ($A:B :: C:D$) rather than supply. The DNS Authority will certify exchange ratios based on the comparative need fulfilled by each party.

  *Worked Example:* A plumber fixes a leak (shelter need); a software engineer patches a kernel (security need). Under current markets, the engineer commands a premium. Under DNS, the ratio is fixed by the necessity of shelter versus security. If shelter is deemed twice as fundamental, the plumber receives two DNS Units per hour for every one received by the engineer. Prices will be adjusted quarterly to reflect seasonal variations in 'cold' (shelter need) versus 'cyber-threat' (security need).

  **Proposal 2: Capital Sterility Licensing**
  Since interest is money born of money, all lending must be gratuitous. To enforce this, any capital held for purposes beyond immediate household management requires a Sterility Certificate.
  *   **Permitted:** Holding coin to guarantee future exchange (e.g., saving for a future roof), as coin acts as a conventional token for need (*Ethics* V).
  *   **Prohibited:** Lending coin at interest. Time belongs to the Polis, not the lender. Charging for time is theft of the common good.
  Administrative fees on loans are permitted but must not exceed the cost of parchment and ink required to record the transaction. Any surplus constitutes unnatural generation.

  **Proposal 3: The Self-Sufficiency Ceiling**
  Household management has a natural limit; wealth-getting does not. To prevent citizens from drifting into unnatural acquisition, assets exceeding the threshold required for the self-sufficiency of the household unit will be subject to a 100% marginal tax. Surplus wealth will be redistributed to households below the sufficiency ceiling. Retail trading for profit is classified as unnatural acquisition and will require a special waiver, granted only where no direct producer-to-consumer exchange is possible.

  **Who is affected?**
  *   **Banking Sector:** Must transition to fee-only administrative models; interest-bearing accounts abolished.
  *   **Landlords:** Rent exceeding the maintenance cost of the property (plus a subsistence allowance for the landlord) is classified as usury.
  *   **Software/Service Industries:** Pricing must be submitted to the DNS Authority for need-certification.
  *   **Households:** Must declare assets annually; surplus above the 'Good Life' threshold confiscated.

  **Consultation Questions**

  1.  **Do you agree that money is intrinsically barren?**
      *   *Departmental View:* Yes. While coin functions as a token for deferred exchange, it possesses no biological capacity for generation. Interest is a linguistic error masquerading as economic reality.
  2.  **How should the Diagonal Proportion be calculated for non-physical services?**
      *   *Departmental View:* By assessing the proximity of the service to bodily preservation. A dentist ranks higher than a poet; a poet ranks higher than a derivatives trader.
  3.  **Should Sterility Certificates be transferable?**
      *   *Departmental View:* No. To allow transfer would permit a secondary market in sterility, effectively creating interest by another name.
  4.  **What is the appropriate metric for Household Self-Sufficiency?**
      *   *Departmental View:* The 'Aristotle Unit', defined as the resources required to sustain a free male citizen and his dependents in leisure sufficient for political participation. Note: Leisure time must not be monetised.
  5.  **How do we resolve the tension between coin as a token for future exchange and coin as sterile?**
      *   *Departmental View:* Coin may store value for *your* future need, but cannot be rented for *another's* present need. Time is common property; charging for it privatises the public sphere.

  **Impact Assessment**
  Implementing these measures will eliminate the financial services industry as currently constituted. GDP will likely contract to reflect natural limits. However, this is a feature, not a bug; unlimited growth is characteristic of unnatural acquisition. Administrative burden will be high, requiring a new bureaucracy to assess 'need' diagonals, but this ensures justice in exchange. We anticipate a reduction in litigation regarding debt, as debt contracts bearing interest will be void *ab initio*.

  **Closing Date for Responses:** 31st December.
  **Format:** Responses must be submitted on non-interest-bearing paper.

