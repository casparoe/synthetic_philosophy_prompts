answer: |-
  Hi there,

  Here is a design for the seminar that should fit your eighty-minute slot and hit the specific conceptual beats you are aiming for without lecturing the theory beforehand. The goal is to let the friction of the game generate the philosophical problems so that when you introduce Aristotle's text, they are already feeling the weight of his solutions. You will need a stack of index cards cut into quarters, pens, and a projector to display the rules for each round. Divide the sixteen students into two equal groups of eight, labeling one group Builders and the other Shoemakers. Give each Builder a card marked House and each Shoemaker a card marked Shoe. These are their production outputs and they cannot produce more; they can only trade what they start with. Also give each student three small slips of paper to act as tokens, though these have no value in the first round. The objective for all rounds is to maximize your personal survival score, which is calculated at the end of each round based on the bundles you hold.

  In round one, project the rule that a Survival Bundle consists of one House card and one Shoe card. Any student who holds a complete bundle at the end of ten minutes gets one point. Any incomplete bundle is worth zero. They must trade to survive. Since the supply is perfectly symmetrical and the need is identical, you should see a quick emergence of a one-to-one exchange rate. One House trades for one Shoe. This establishes the baseline intuition that exchange is about swapping equivalent things based on symmetric need. Do not intervene unless they are completely stuck, but note how quickly they settle on a uniform price. This mirrors the modern intuition that price is a property of the goods, not the persons.

  In round two, collect all cards and tokens and redistribute them exactly as before, so the production capacity and initial holdings are unchanged. Now project the new rule: a Survival Bundle for a Shoemaker is still one House and one Shoe, but a Survival Bundle for a Builder is one House and two Shoes. The production difficulty has not changed, nor has the subjective liking for the goods, but the objective need has shifted for one party. Give them ten minutes to trade. To achieve the same survival score as the Shoemakers, Builders now need to acquire more Shoes per House, or Shoemakers must accept a different rate to ensure the Builders can survive if the class is aiming for total survival. You will likely see the exchange rate shift away from one-to-one. Builders will demand more Shoes for their Houses, or Shoemakers will offer two Shoes for a House to ensure the trade happens. This forces the realization that the measure of exchange is tracking the urgency of need, or chreia, rather than labor input or scarcity of supply. If they stick to the old rate, half the class fails, highlighting that justice in exchange is tied to the satisfaction of need.

  In round three, keep the need structure from round two but introduce a hidden variable. Hand each Builder a card marked Status 2 and each Shoemaker a card marked Status 1, telling them not to show it to anyone yet. Project the new winning condition: The Community Stability Score is maximized only if the ratio of goods exchanged matches the ratio of the traders' status. If a Builder trades with a Shoemaker, the Builder must receive two Shoes for every one House. If they trade at any other rate, the trade is valid for individual survival but subtracts points from the Community Score. Announce that the goal of the seminar is to maximize the Community Score. They will begin trading and likely fail the stability check because they will default to market pricing or need-based pricing. When you reveal the status cards and the rule, they will likely object that it is unfair for the Builder to demand more simply because of their role. This is the intended friction. To make it stop feeling outrageous, they have to adopt the Aristotelian assumption that the persons themselves are unequal in worth relative to the polis, and that justice requires rectifying this inequality through exchange rather than ignoring it. They will realize they have to price according to who they are trading with, not just what they are trading. This is the diagonal conjunction in practice, where the proportion of persons equals the proportion of goods.

  In round four, introduce a new token called a Coin, printed on the projector. Tell them that Goods now expire and are worth zero at the end of the round, but Coins can be hoarded and are worth one point each regardless of what they hold. Allow them to trade Goods for Coins and Coins for Goods. You will observe a shift where students stop acquiring goods for survival and start acquiring Coins for their own sake. Some will refuse to trade Goods for Coins unless the price is exorbitant, while others will hoard Coins without buying the Shoes or Houses they need to survive the previous rounds. This stages the transition from oikonomia to chrematistics, where wealth-getting becomes an end in itself rather than a means to satisfy need.

  For the debrief, map these moments directly to the text without using the technical terms until the end. Ask them why the price moved in round two when labor did not change, and guide them to see that need was the common measure holding the community together. Ask them why round three felt unjust despite maximizing the community score, and use this to introduce the diagonal conjunction and the idea that reciprocal justice requires proportionality based on social worth. Ask them why round four felt corrosive to the group dynamic, linking it to Aristotle's critique of unlimited wealth acquisition. You should expect two main failures in the first run. First, someone will try to arbitrage in round two by hoarding Shoes and demanding exorbitant rates, treating the need shock as a market opportunity rather than a communal problem. This is useful for discussion but may block trade entirely. Second, in round three, some students may refuse to trade on principle because the status rule violates their modern egalitarian intuitions. If this happens, let them sit out and observe how their refusal impacts the community score, as this mirrors the breakdown of the polis when reciprocal justice is rejected.

  There is one limitation you should be frank about in your closing remarks. The game simulates need as a rule written on a slide, which is objective and known. In Aristotle's account, need is supposed to be an objective measure that naturally binds the city, but in the game, need is just a arbitrary constraint you imposed. In reality, needs are subjective and clashing; my need for food does not naturally commensurate with your need for shelter without a convention like money. The game cannot stage Aristotle's stronger metaphysical claim that need itself provides a single objective measure rather than a pile of clashing urgencies that require money to mask the inequality. You should tell them that Aristotle assumes a natural hierarchy of needs and persons that makes the measure stable, whereas the game shows us that without that shared assumption, the measure feels like coercion. Save the phrase diagonal conjunction for this final summary, writing the proportion on the board only after they have lived through the frustration of trying to equalize unequal persons.

  I hope this runs smoothly for you and that the students find the tension between their modern fairness intuitions and the Aristotelian framework productive. It is always striking when they realize that for Aristotle, fairness is not about equal treatment but about proportional reciprocity based on status. Let me know how the arbitrageurs behave in round two, as that usually tells you everything about whether they are thinking like economists or like citizens.

  Best wishes with the seminar
