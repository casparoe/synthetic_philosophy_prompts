prompt: |-
  I'm a software engineer, not a statistician, so I may be misapplying the term, but I think what I'm seeing in our last A/B test is Simpson's paradox. The treatment arm beat the control arm on onboarding completion in every cohort I can slice by — country, device type, signup source, account age — yet the overall completion rate for the treatment arm is a few points lower than for the control arm. I've been told the lesson of the paradox is that aggregate statistics are unreliable and that you should always trust the subgroup-level results. If that's right, does the overall drop just mean the aggregate is an artifact of how the two arms happened to be composed, and the treatment actually improved completion?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Scenario:**
      *   **Role:** Software Engineer (practical, likely familiar with data but not deep stats theory).
      *   **Observation:** Treatment > Control in *every* subgroup (country, device, source, age).
      *   **Observation:** Treatment < Control in the *aggregate* (overall).
      *   **Interpretation:** User suspects Simpson's Paradox.
      *   **Received Advice:** "Aggregate statistics are unreliable; always trust subgroup-level results."
      *   **Question:** Does the overall drop just mean the aggregate is an artifact of composition, and did the treatment actually improve completion?

  2.  **Evaluate the Statistical Claim (Simpson's Paradox):**
      *   *Definition:* Simpson's Paradox occurs when a trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Conditions:* It requires a confounding variable that is unevenly distributed between the treatment and control groups *and* strongly correlates with the outcome.
      *   *User's Case:* Treatment wins in all slices, loses overall. This fits the classic description.
      *   *Root Cause:* Usually, the treatment group has a much higher proportion of "hard-to-convert" users (e.g., mobile users, certain countries) compared to the control group, skewing the overall average down despite the treatment being better within each segment.

  3.  **Evaluate the Advice Received ("Always trust subgroup-level results"):**
      *   *Is this true?* **No, not always.** This is a dangerous oversimplification.
      *   *Why?*
          *   **Multiple Comparisons Problem:** Slicing by many dimensions (country, device, source, age) creates many subgroups. Chance fluctuations can make treatment look better in many slices even if it's null overall.
          *   **Sample Size:** Subgroups have smaller $N$. Confidence intervals are wider. A "win" in a small subgroup might not be statistically significant.
          *   **Randomization Failure:** If the A/B test wasn't properly randomized (e.g., bucketing issues), the composition imbalance causing Simpson's Paradox indicates a broken experiment, not a real effect.
          *   **Causal Inference:** The aggregate is the *actual* average treatment effect (ATE) on the population *as assigned*. If the assignment mechanism is flawed, the aggregate is biased. If the assignment is random, the aggregate is unbiased (in expectation), and the subgroup reversal suggests imbalance in covariates.

  4.  **Formulate the Core Answer:**
      *   **Validate:** Yes, this looks like Simpson's Paradox.
      *   **Correct the Misconception:** The advice "always trust subgroups" is wrong. In fact, in a properly randomized A/B test, the **aggregate** is usually the primary source of truth *unless* there's a specific reason to stratify.
      *   **Diagnose the Real Issue:** If this is a randomized A/B test, Simpson's Paradox *should not happen* to this degree. Randomization ensures covariates (device, country, etc.) are balanced across arms. If they aren't balanced, the randomization failed (SRM - Sample Ratio Mismatch or just bad luck in small samples).
      *   **Actionable Advice:**
          1.  Check Randomization (SRM check).
          2.  Check Statistical Significance in subgroups (are the "wins" real or noise?).
          3.  Check Covariate Balance (did treatment get more mobile users?).
          4.  Decide on the metric: Do you care about the average user (aggregate) or specific segments?

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Empathetic, professional, technically accurate but accessible.
      *   *Key Point 1: It is Simpson's Paradox.* Confirm their intuition. Explain *why* (composition imbalance).
      *   *Key Point 2: The advice you got is dangerous.* "Always trust subgroups" is false. Subgroups suffer from multiple testing and low power.
      *   *Key Point 3: The Real Red Flag.* In a *properly randomized* experiment, the groups should be compositionally similar. If the treatment group has way more mobile users (who convert lower) than control, your randomization might be broken. This is the most critical engineering insight.
      *   *Key Point 4: What to do.*
          *   Check SRM (Sample Ratio Mismatch).
          *   Check significance (p-values) in subgroups.
          *   Use CUPED or Stratified Analysis if imbalance is real but randomization holds.
          *   Trust the aggregate *if* randomization holds. If randomization failed, the test is invalid.

  6.  **Refining the "Trust Aggregate vs. Subgroup" argument:**
      *   Standard A/B testing philosophy: The aggregate Intent-to-Treat (ITT) analysis is the gold standard. It answers "What happens if we roll this out to everyone?"
      *   If subgroups say "up" and aggregate says "down," it implies the treatment group was loaded with low-performing users.
      *   If randomization was perfect, this imbalance shouldn't exist.
      *   Therefore, either (A) Randomization failed (bad news), or (B) It's random chance in a small test (bad news), or (C) You need to adjust for covariates (CUPED/Regression).
      *   *Crucial distinction:* Simpson's paradox in observational data is common. In randomized trials, it indicates imbalance.

  7.  **Final Polish:**
      *   Make sure to explicitly answer the user's question: "Does the overall drop just mean the aggregate is an artifact... and the treatment actually improved completion?"
      *   *Answer:* Not necessarily. It means the *composition* is different. Whether the treatment improved completion depends on whether the randomization was valid. If valid, the aggregate is the best estimate of the rollout impact. If invalid, the test is broken.
      *   Add a warning about "p-hacking" via slicing.

  8.  **Structure:**
      1.  Direct Answer (Yes, it's Simpson's, but the advice is wrong).
      2.  Why the advice is dangerous (Multiple comparisons, power).
      3.  The Engineering/Stats Reality Check (Randomization should prevent this).
      4.  Diagnostic Steps (SRM, Significance, Covariate Balance).
      5.  Recommendation (Trust Aggregate *if* valid, else fix experiment).

  9.  *(Self-Correction during drafting)*: I need to be careful not to say "Aggregate is always right." If the goal is to launch to *everyone*, aggregate is right. If the goal is to launch only to *iOS*, then the iOS subgroup is right. But the user implies a general rollout. I should emphasize the "Rollout" context. Also, emphasize that if randomization worked, the aggregate is unbiased. The subgroup reversal is a symptom of imbalance, which shouldn't exist in large enough randomized trials.

  10. **Final Review against constraints:** User is a software engineer. Avoid heavy math notation. Focus on experimental validity and engineering checks (SRM, bucketing).

  **(Self-Correction Note):** Wait, if the treatment arm *actually* has a lower aggregate conversion despite winning in all slices, it mathematically *must* have a higher proportion of low-converting segments. In a randomized test, this is possible due to chance (especially with small N), but it suggests the *unadjusted* aggregate is biased by this chance imbalance. However, the *Intent-to-Treat* (aggregate) is still the policy-relevant metric. If you roll out to everyone, you get the aggregate result. The subgroup analysis tells you *why*. But if the imbalance is severe, you might want to use a stratified estimator. I need to balance "Aggregate is truth for rollout" with "Imbalance suggests experimental issues."

  *Decision:* Stick to the standard industry best practice: Check SRM. If SRM passes, trust the aggregate for rollout decisions, but investigate the imbalance. If SRM fails, the test is invalid. The advice "always trust subgroups" is definitely wrong.

