answer: |-
  ### Part 1: The Axis Brainstorm

  Before building the tree, we need to map the logical space. Here are every dimension along which these transfers vary, drawn from both the literature (Mauss, Weber, Rothstein) and the compliance trenches:

  *   **Legality:** Is there a written statute forbidding this?
  *   **Timing:** Did the transfer happen *before* (inducement) or *after* (gratitude) the official act?
  *   **Reciprocity:** Is there an explicit *quid pro quo* agreement?
  *   **Publicity:** Is the transfer concealed from the institution/public or done openly?
  *   **Magnitude:** Is the value trivial (token) or substantial (life-changing)?
  *   **Necessity:** Is the giver coerced (pay to survive/access rights) or acting voluntarily?
  *   **Outcome Alignment:** Does the result align with written official duties or subvert them?
  *   **Beneficiary:** Does the value go to the official's private pocket or a public/community pool?
  *   **Relationship:** Are the parties strangers or bound by kinship/community obligation?
  *   **Systemic Effect:** Does this grease the wheels (efficiency) or sand them (distortion)?
  *   **Enforcement:** Is the rule consistently enforced or selectively weaponized?
  *   **Alternatives:** Was there a legal pathway available to achieve the same end?

  ### Part 2: The Cull (What I Threw Away)

  To make this a usable *decision tree* for your reading group, I had to cut axes that rely on interpretation rather than observation.

  1.  **Magnitude:** Discarded. A million dollars can be a legitimate dowry; five dollars can be a corrosive bribe. Value is context-dependent, not a sorting criterion.
  2.  **Intent (Reciprocity):** Discarded. "Did they agree to a quid pro quo?" is unanswerable in concrete cases without mind-reading. We must judge by *timing* and *secrecy* instead.
  3.  **Systemic Effect:** Discarded. This is a *consequence*, not a feature of the act. You cannot know if the wheels were greased or sanded until after the fact.
  4.  **Legality (Standalone):** Discarded. Laws can be corrupt. We need to know if the act subverts the *duty*, not just the statute.

  ### Part 3: The Decision Tree

  This tree sorts the **transaction**, not the theory. The leaf you land on indicates which theoretical framework best *describes* or *justifies* that specific type of transaction.

  **START: A transfer of value occurs between a private actor and an officeholder.**

  **Q1. THE RECIPIENT:** Does the value enter the official's **private pocket** (cash, gifts, jobs for kin) OR a **public/community pool** (school, road, party coffers)?
  *   *Public/Community Pool* → Go to **Q4**
  *   *Private Pocket* → Go to **Q2**

  **Q2. RULE ALIGNMENT:** Does the transfer secure an outcome the written rules **mandate/allow** (e.g., restoring power, issuing a valid passport) OR does it secure an outcome the rules **forbid** (e.g., licensing a dangerous mine, hiring an unqualified cousin)?
  *   *Outcome Forbidden (Subverts Duty)* → Go to **Q3**
  *   *Outcome Mandated (Aligns with Entitlement)* → Go to **Q3**

  **Q3. TIMING & SECRECY:** Was the value transferred **before** the act AND **concealed** from the institution?
  *   *Yes (Ex-Ante + Secret)* → **LEAF A**
  *   *No (Ex-Post OR Open)* → **LEAF B**

  **Q4. RELATIONSHIP & COERCION:** Is the giver a **kin/community member** claiming a pre-existing obligation OR a **stranger** paying to access a basic right (land, safety) otherwise blocked?
  *   *Kin/Community Obligation* → **LEAF C**
  *   *Stranger/Blocked Right* → **LEAF D**

  *(Note: Q4 also catches the Public/Community Pool branch from Q1, as these are often framed as community obligations or development deals.)*

  ---

  ### Part 4: The Leaves (Theoretical Positions)

  *   **LEAF A: The Universalist (NGO/Compliance) View.**
      *   *Logic:* Private gain + Subverted Duty + Secret Inducement.
      *   *Label:* **Corruption.**
      *   *Case:* The Mining Company (if money is pocketed for a license).
  *   **LEAF B: The "Second-Best" (Speed Money) View.**
      *   *Logic:* Private gain + Entitlement Owed + Secret Inducement (usually).
      *   *Label:* **Facilitation Payment.**
      *   *Case:* The Border Post (paying to get a valid passport faster).
      *   *Note:* If Ex-Post/Open, this becomes **Leaf E**.
  *   **LEAF C: The Social-Norms / Relativist View.**
      *   *Logic:* Private/Community gain + Kinship/Obligation + Open/Socially Known.
      *   *Label:* **Reciprocity / "Looking After Our Own."**
      *   *Case:* The Cousin's Job; The Storm Gift (if viewed as community obligation).
  *   **LEAF D: The Skeptic / Political View.**
      *   *Logic:* Private gain + Blocked Right + Coercion.
      *   *Label:* **Extortion / Survival.**
      *   *Case:* The Headman Land Access (paying for what you already farm).
      *   *Note:* The Skeptic argues calling this "corruption" blames the victim; it's a tax on existence.
  *   **LEAF E: The Relativist (Gratitude) View.**
      *   *Logic:* Private gain + Entitlement Owed + Ex-Post + Open.
      *   *Label:* **Tipping / Gratitude.**
      *   *Case:* The Storm Gift (Priya's view).

  ### Part 5: Empty Boxes & Collapses

  **1. The Empty Box: "Subverts Duty + Open + Voluntary"**
  *   *The Combination:* An official openly accepts money to break the rules, with no secrecy.
  *   *Why Empty:* This is logically unstable in any functioning state. If it's open, it implies institutional approval, which means the rule isn't actually forbidden. If it is forbidden, secrecy is required to avoid punishment.
  *   *Status:* **Incoherent.** It describes a failed state where "rules" are merely price lists, but even then, the *transaction* is usually discreet to maintain the fiction of legitimacy.

  **2. The Empty Box: "Ex-Post + Coerced"**
  *   *The Combination:* You are forced to pay *after* you have already received the service you were owed.
  *   *Why Empty:* Coercion requires leverage. Once the service is rendered (power on, passport stamped), the official loses leverage. Ex-post payments are almost always voluntary (gratitude) or socially mandated (norms), not coerced.
  *   *Status:* **Unattractive.** It describes extortion attempts that usually fail.

  **3. The Collapse: Relativist vs. Social-Norms**
  *   *Your Bet:* You suspected these two collapse. **You are right.**
  *   *Why:* In this tree, both land on **Leaf C** or **Leaf E**. The "Relativist" says "This is our culture." The "Social-Norms" theorist says "This is our local equilibrium." Empirically, they look identical: Ex-Post/Open/Kinship.
  *   *The Difference:* The difference is *meta-ethical*, not factual. The Relativist says "You cannot judge this from outside." The Social-Norms theorist says "This functions to maintain trust locally." The tree cannot separate them because they describe the *same behavior* using different *justifications*. To sort them, you'd need a branch asking "Do you believe universal morals exist?" which violates your rule against normative questions.

  ### Part 6: Sorting Your Cases

  Here is how your six cases land in the tree, which should help you and Priya see where the friction is:

  1.  **Storm Gift (Kerala):** Private Pocket + Entitlement Owed + Ex-Post + Open. → **Leaf E (Relativist/Gratitude).** *You call it tipping; Priya calls it gratitude. The tree says it's structurally the same.*
  2.  **Cousin's Job:** Private Pocket + Outcome Forbidden (Meritocracy) + Kinship + Open. → **Leaf C (Social-Norms/Nepotism).** *You see rule-breaking; she sees obligation.*
  3.  **Border Post Note:** Private Pocket + Entitlement Owed + Ex-Ante + Secret. → **Leaf B (Second-Best).** *This is the "Speed Money" argument. It violates the rule but claims to fix the system.*
  4.  **Surgeon Envelope:** Private Pocket + Entitlement Owed + Ex-Ante + Secret. → **Leaf B (Second-Best) or Leaf A (Corruption).** *Depends: Is the surgery owed? If yes, it's speed money. If the envelope buys better care than others get, it subverts duty (Leaf A).*
  5.  **Mining Company School:** Public Pool + Outcome Forbidden (License) + Corporate. → **Leaf A (Universalist)** if the school buys the license illegally. **Leaf C (Social-Norms)** if it's standard CSR. *This is the hardest case; the tree forces you to ask: Is the license deserved?*
  6.  **Headman Land Access:** Private Pocket + Blocked Right + Coercion. → **Leaf D (Skeptic).** *This is not "corruption" in the universalist sense; it is a tax on survival. The Skeptic wins here.*

  **Final Note for the Group:**
  The tree reveals that you and Priya are likely arguing about **Leaf B vs. Leaf A** (Is the border payment a fix or a crime?) and **Leaf E vs. Leaf A** (Is the storm gift gratitude or a bribe?). The tree doesn't solve the moral dispute, but it stops you from calling the Storm Gift (Leaf E) by the same name as the Mining License (Leaf A).
