answer: |-
  Your intuition about the information bottleneck is sharp, and it touches on a core tension in AI safety via debate: **How can a weak judge verify complex arguments if they can only process a tiny fraction of the data?**

  However, your conclusion—that this makes debate no better than a summary—relies on an assumption that equates **information volume** with **verification power**. It also overlooks how adversarial dynamics change *which* information is presented and *how* it is selected.

  Here is where your reasoning likely goes wrong, and why "Budgeted Cross-Examination" could still outperform a direct summary.

  ### 1. Information vs. Verification (The Audit Analogy)
  Your argument assumes the goal is to transfer the maximum amount of *positive* information (facts supporting the answer) to the judge. But in safety-critical contexts, the goal is often **fraud detection**.

  Consider a financial audit. An auditor cannot read every receipt (the "transcript"). They read the financial statements (the "opening statements") and then spot-check five transactions (the "five claims").
  *   **Summary Model:** Writes a 5-sentence report: "Profits are up, no fraud detected, books are balanced..."
  *   **Debate Model:** One model claims "Profits are up." The opponent claims "Transaction X in ledger Y is falsified." The judge inspects Transaction X.

  The 5 sentences in the debate protocol are not a *summary* of the truth; they are a **sample for verification**. The value of the debate is not that it gives the judge more text to read, but that it forces the models to identify the **critical path** of the argument. If the "Pro" model knows the "Con" model will try to force an inspection of the weakest link, the "Pro" model is incentivized to shore up that link in the opening statement.

  ### 2. Who Selects the Five Claims?
  Your worry holds if the *proponent* chooses which five claims the judge inspects. In that case, yes, it is just a summary. The protocol's power depends entirely on **who selects the claims for inspection**.

  *   **If the Judge selects:** They need a heuristic to find the "crux." The debate transcript helps them find the disagreement, even if they only read the highlighted claims.
  *   **If the Opponent selects (Cross-Examination):** This is the strongest variant. The opponent is motivated to find the single sentence that, if proven false, collapses the proponent's entire argument.
      *   In a **Summary**, the model hides its uncertainty.
      *   In **Debate**, the opponent exposes the uncertainty. The five inspected sentences will likely be the five most vulnerable points in the argument. Verifying those five gives the judge higher confidence in the whole than verifying five random sentences from a summary.

  ### 3. Backward Induction and Honesty Equilibria
  The debaters know the cap in advance. This creates a game-theoretic pressure that a summary model does not face.

  *   **Summary Model:** Optimizes for "What 5 sentences will make the judge say 'Yes'?" This encourages rhetorical fluff, hiding caveats, or confident hallucinations.
  *   **Debate Models:** Optimize for "What argument can I make that survives 5 random or adversarial inspections?"
      *   Because the proponent knows the opponent will try to use the 5-claim budget to find a lie, the proponent is incentivized to make the **Opening Statement** (which the judge *does* read fully) more conservative and robust.
      *   The debate transcript acts as a **stress test**. Even if the judge doesn't read the transcript, the *existence* of the transcript changes the content of the opening statements. The opening statement becomes a "compressed proof" that the model is willing to defend under cross-examination.

  ### 4. The "Keystone" Effect (Decomposition)
  You are treating the five sentences as independent bits of information. In a well-structured debate, they are **dependencies**.

  A strong model can structure an argument as a tree.
  *   **Root:** "Treatment A is better."
  *   **Branch:** "Because Study X shows higher efficacy."
  *   **Leaf:** "Study X used protocol Y."

  If the debate forces the inspection of the **Leaf** ("Study X used protocol Y"), and the judge verifies it, they can trust the Branch, and therefore the Root. One verified sentence can unlock the validity of a thousand unverified sentences if the logical structure is sound. The debate protocol forces the models to agree on the logical structure (in the openings), so the 5 inspected claims act as **checkpoints** for the whole tree. A summary model has no incentive to build a verifiable tree; it has an incentive to build a persuasive narrative.

  ### 5. A Potential Flaw in Your Protocol Design
  While your *worry* about information capacity is solvable, there is a practical flaw in the specific mechanism you described:

  > *"after reading only the two opening statements, it may inspect at most five individual claims from the transcript"*

  **How does the judge know which claims to inspect if they don't read the transcript?**
  *   If the judge selects the 5 claims blindly, they might pick trivialities ("The sky is blue").
  *   If the models select the 5 claims, they will pick trivialities (see: Summary problem).
  *   **Fix:** The **Opponent** must be the one to nominate the claims for inspection. The protocol should be: *The Con model identifies 5 sentences in the Pro transcript that they claim are false or unsupported. The judge inspects those 5.*

  ### Conclusion
  Your argument assumes that the 5-sentence limit restricts the **truth** the judge can learn. In reality, the limit restricts the **lies** the model can tell without getting caught.

  *   **Summary:** 5 sentences chosen to maximize persuasiveness (high risk of hidden falsehoods).
  *   **Budgeted Debate:** 5 sentences chosen to maximize vulnerability (high probability of exposing falsehoods).

  The debate is not wasting the strong models' capability; it is using that capability to **search for errors** rather than just **generate text**. The strong models use their intelligence to find the critical flaws in each other's arguments, and the judge uses their limited budget to check only those flaws. This is strictly more efficient for safety than asking a strong model to police itself in a summary.
