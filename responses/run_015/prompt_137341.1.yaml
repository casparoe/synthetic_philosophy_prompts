      *   **Context:**
          *   Town: Ashfield (pop. 2,400).
          *   Proposal: Fernbrook (260 homes, ~780 people, 33% growth over 6 years).
          *   Developer: Regional builder (offering school addition funding, Route 9 widening).
          *   Impacts: +6 min commute (current residents), school overcrowding (310 -> 500 kids for 2 years), loss of soccer field.
          *   Metro Context: 40 mins away, high rent ($2,100 for 2BR).
      *   **Key Arguments/Characters:**
          *   *Reuben Kerrigan:* Local resident. Argues approving based on "total wellbeing" leads to the "Repugnant Conclusion" (Parfit). Claims adding lives slightly worth living isn't better than fewer good lives.
          *   *Dave (Friend/Colleague):* Agrees with Kerrigan. Argues for "Average Wellbeing" of current residents. Suggests full compensation (mitigation) makes it a "pure addition" case, which he thinks validates approval.
          *   *Enid (Chair):* Proposes "The Ashfield Line": New residents must have expected QoL $\ge$ Current Average QoL. Excludes refugees/those fleeing worse situations.
          *   *User (Me):* Struggling with the philosophy. Thinks Kerrigan's Repugnant Conclusion doesn't apply because current residents *are* made worse off (it's not a "no one loses" scenario). Thinks Dave's full compensation idea actually *creates* the Repugnant Conclusion risk (by removing the counterweight of current harm). Worried about Enid's exclusionary rule.
      *   **Requirements:**
          *   Bottom Line: Approve, Deny, or Approve with Conditions (specify what/when).
          *   Address Kerrigan respectfully (he's smart, will be there).
          *   Address Enid's "Ashfield Line" seriously.
          *   Steelman Dave's "Full Compensation" argument before rejecting it.
          *   Tone: Professional, public record safe, philosophical but grounded in planning law/practice.
          *   Length: Approx. two pages.

  2.  **Determine the Bottom Line:**

      *   *Option A (Deny):* Safe for current residents, but ignores housing crisis context. Hard to justify if legal criteria are met.
      *   *Option B (Approve As-Is):* Ignores the significant impacts (school crowding, traffic). Politically difficult.
      *   *Option C (Approve with Conditions):* Best middle ground. Addresses the "who pays" issue without falling into the philosophical traps.
      *   *Decision:* **Approve with Conditions.** This allows the user to acknowledge the benefits (housing) while mitigating the harms to current residents (avoiding the "pure addition" trap Dave likes, but also avoiding the "unmitigated harm" that fuels Kerrigan's objection).
      *   *Specific Conditions:* Phased occupancy tied to school capacity, binding agreement on Route 9 widening *before* certain occupancy thresholds, preservation/replacement of the soccer field.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (vote on Fernbrook), acknowledge the weight of the decision (33% growth).
      *   **Addressing Kerrigan (The Repugnant Conclusion):**
          *   Acknowledge the philosophical validity. Parfit's point is important.
          *   Counter-argument: This isn't a abstract population ethics puzzle. It's a specific land use case with *identifiable losers* (current residents). The Repugnant Conclusion usually assumes no one is made worse off, just that the *average* drops while *total* rises. Here, current residents lose commute time and school quality. Therefore, we aren't just summing utility; we are weighing specific harms against specific benefits.
      *   **Addressing Dave (Full Compensation/Mitigation):**
          *   Steelman: If we mitigate 100%, current residents are neutral. Then it becomes a "pure gain" scenario.
          *   Rebuttal: If we make current residents completely neutral, we remove their stake in the outcome. This makes the decision purely about adding population (the exact setup for Kerrigan's worry). Furthermore, perfect mitigation is often impossible (e.g., the feeling of small-town change, the temporary school crowding). We need current residents to retain a voice/stake, meaning some friction is acceptable, but not overwhelming harm.
      *   **Addressing Enid (The Ashfield Line):**
          *   Acknowledge the intent (protecting community character/standards).
          *   Critique: It's exclusionary and potentially illegal (fair housing). It prevents helping those in need (refugees, lower income). It conflates "quality of life" with income.
          *   Alternative: Focus on *infrastructure capacity* rather than *resident worth*.
      *   **Recommendation/Conditions:**
          *   Approve with strict phasing.
          *   School addition funding must be upfront or bonded.
          *   Traffic improvements prior to 50% occupancy.
          *   Replacement of soccer field.
      *   **Conclusion:** Reiterate the balance.

  4.  **Refining the Tone:**

      *   *Public Record:* Avoid saying "Dave is wrong." Say "A colleague suggested..." or "One view holds..." (Though the prompt says "circulate to the other four members," implying an internal draft *before* the public meeting. However, it also says "It's public record." This is a contradiction. Usually, internal memos between commissioners *before* a vote might be subject to open meeting laws or FOIA. To be safe, I should write it as if it *could* be public, avoiding personal attacks but addressing the arguments substantively.)
