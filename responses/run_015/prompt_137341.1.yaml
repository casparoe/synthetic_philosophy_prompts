  6.  **Review against Constraints:**

      *   Two pages? (Need to keep it tight).
      *   Bottom line clear? (Yes, Approve with Conditions).
      *   Kerrigan addressed? (Yes).
      *   Dave's point steelmanned? (Yes).
      *   Enid's point addressed? (Yes).
      *   Public record safe? (Yes, professional tone).

  7.  **Final Polish:** Check the logic on the "Repugnant Conclusion."
      *   Parfit's Repugnant Conclusion: For any possible population of very good lives, there is a much larger population of lives barely worth living which is *better* (in total utility).
      *   Kerrigan's application: If we approve Fernbrook because 780 lives > 2400 lives' inconvenience, we accept that logic.
      *   My rebuttal in memo: Parfit's scenario assumes the original population is *not made worse off*. In Ashfield, current residents *are* made worse off (traffic, schools). Therefore, we are not comparing "Good A vs. Better Total B." We are comparing "Good A vs. Mixed B (New Good + Old Slightly Worse)." This is a standard distributional justice problem, not the Repugnant Conclusion. This is the crux of the user's intuition. I need to make sure this lands clearly.

      *   *Dave's Mitigation Point:* If we mitigate fully, current residents are not worse off. Then it *becomes* Parfit's scenario (Original Good + New Lives). Dave thinks this makes it safe to approve. I think this makes it *dangerous* because it removes the political/ethical brake of current resident harm. I need to articulate that *some* unmitigated cost is a feature, not a bug, because it ensures the development is only approved if the benefit is truly substantial enough to outweigh *real* local cost.

