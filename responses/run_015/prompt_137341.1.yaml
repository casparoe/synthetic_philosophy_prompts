      *   *Wait, looking closer:* "circulate to the other four members before Monday's meeting... It's public record." Okay, so it's an internal working document that is legally public. I need to be diplomatic. I will refer to "Commissioner [Name]" or "The Chair." I will refer to Kerrigan respectfully.

  5.  **Drafting - Specific Philosophical Nuances:**

      *   *Kerrigan:* He says if we approve based on total wellbeing, we accept the Repugnant Conclusion.
      *   *My Counter:* We aren't using Total Utilitarianism. We are using a *Weighted Harm/Benefit* analysis. The fact that current residents suffer *specific* harms prevents this from being a "Repugnant Conclusion" scenario (which requires no one to be worse off).
      *   *Dave:* He says full mitigation makes it safe.
