  *(Self-Correction on Confidence)*: I should be honest. Philosophy of science applied to history is messy. I'll say "High confidence on the philosophical distinction, Moderate-High on the Malthus classification."

  *(Self-Correction on the "Timescale" point)*: I need to explicitly tell the user that Condition 2 is their weak flank. A defender will shred that. They need to bolster Condition 3.

  *(Final check on "Right but Early")*: This is the key. If the theory is "X will happen when Y," and Y hasn't happened, is it shield-early? Only if Y is defined *after* the fact. Malthus said "Population presses on subsistence." Neo-Malthusians say "Population presses on *ecosystem services*." That's a theory change, not a delay. That's the killer argument.

