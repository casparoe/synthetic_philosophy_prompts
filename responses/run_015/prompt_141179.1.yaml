      *   *Clock or Shield?* **Shield-Early.**
      *   *Why?* Because the core auxiliaries (linear food growth) were empirically falsified independently (agricultural science), and the "right but early" move relies on a redefinition of the mechanism (from land constraint to energy/ecological constraint) without a pre-stated trigger for that switch.
