answer: |-
  This is a profound and difficult set of intuitions, and you are right to sense that your current rule breaks on Case (4). Your current rule relies on **consent** ("what the person would have refused"). Case (4) proves that consent is not the ultimate metric; **truth** is. The humanitarian *would* have refused the exposure, but exposure is required because her public identity was a theft from history.

  Your intuition about Case (3) being worse than Case (1) is the key to unlocking this. Case (1) is a lie, but it is an obvious fiction added for drama. Case (3) is a **betrayal**. It uses the shield of fact to construct a falsehood about the soul. It gaslights the audience and the memory of the subject simultaneously.

  Here is a proposed principle that repairs your rule, accounts for all eight cases, and handles the new technological and personal dilemmas.

  ### The Principle of Narrative Coherence

  **The Rule:** You owe the dead fidelity to the **moral and causal coherence** of their lives. You may fill in the *gaps* of a life (unknown conversations, unnamed associates), but you may not overwrite the *grain* of a life (core beliefs, defining actions, the nature of their suffering).

  **The Exception:** You may overwrite the grain only when the grain itself is the object of the inquiry (e.g., exposing a fraud, investigating a silence).

  **Why this fixes Case (4):** Your old rule asked, "Would they refuse this?" The new rule asks, "Does this serve the coherence of reality?" In Case (4), the subject's *own* coherence was broken (she claimed a heroism she didn't earn). Restoring the true coherence requires breaking her consent. In Case (1) and (3), you are breaking the coherence to serve the *plot*. In Case (4), you are breaking the *myth* to serve the *person's actual place in history*.

  ### Applying the Principle to Your Eight Cases

  1.  **Labour Organizer (Invented Sex):** **Violation.** This overwrites the grain of her discipline and sacrifice with a trope (the tired woman seeking comfort) that serves the plot's need for vulnerability, not her historical coherence.
  2.  **Fictional Assistant:** **Permissible.** This fills a *gap*. There is no specific grain to violate because the individuals are unnamed. You are representing a class, not a person.
  3.  **Naturalist (Reordered Faith):** **Severe Violation.** This is the worst offense because it weaponizes truth to lie about the grain. It imposes an external narrative arc (the crisis of faith) onto a life that did not contain it. It steals his intellectual integrity to make a better story.
  4.  **Humanitarian (Exposed Fraud):** **Required.** The "grain" of her public life was a lie. Exposing it restores coherence to the historical record. The exception clause applies: the grain *is* the object of inquiry.
  5.  **Pacifist (The Bar Fight):** **Violation.** This mistakes an anomaly for the grain. By highlighting the one moment he rejected, you create a false coherence (he was violent) that contradicts the true coherence (he was a man who overcame violence). It is a distortion of weight, not just fact.
  6.  **Famine (Invented Mercy):** **Violation of Context.** This principle extends beyond the person to the *event*. You are overwriting the grain of the *history*. You are imposing a narrative of redress on an event defined by its lack of redress. It lies about the world, not just the people.
  7.  **Three Facts Only:** **Permissible.** There is no established grain to violate. When the record is this thin, "coherence" is impossible to ascertain, so invention is the only way to tell a story. You are building a house on empty land, not renovating an occupied one.
  8.  **Permission Note:** **Limited.** Consent does not license a violation of historical coherence. If she said, "Tell everyone I was a saint," and she was a monster, you still owe the truth (Case 4 logic). If she said, "Make me a villain," and she was a saint, you owe her memory fidelity. Consent manages *privacy*, not *truth*.

  ### Predictions for New Cases

  **1. The Musical-Comedy Biopic**
  *   **Verdict:** High risk of violation.
  *   **Reasoning:** Music and comedy impose a specific emotional grain (rhythm, resolution, levity) on a life. If the subject's life was defined by grinding, unmelodic struggle, forcing it into a musical structure overwrites the grain. *Hamilton* works because it acknowledges the artifice; a straight biopic musical about a grim subject usually violates the Principle of Coherence by making suffering "catchy."

  **2. Casting Against Physicality**
  *   **Verdict:** Permissible, unless the body *was* the story.
  *   **Reasoning:** If you cast a able-bodied actor to play a disabled activist, you violate the grain, because their physical struggle was central to their coherence. If you cast a short actor to play a tall politician, it is a gap-fill; the height did not define the moral arc.

  **3. AI Voice Generation**
  *   **Verdict:** Violation.
  *   **Reasoning:** This is the ultimate overwriting of agency. Voice is the primary instrument of human coherence. To generate lines they never chose is to attribute agency they did not exercise. It treats the person as a puppet rather than a subject. Even with consent (Case 8), it risks turning a human being into a text-to-speech engine, violating the dignity of the memory.

  ### The Grandmother Case

  This is the hardest one because it moves from public history to intimate memory. The Principle of Narrative Coherence still applies, but the "grain" is harder to define.

  **The Silence as Grain:**
  You say there is a "stretch of her life she never spoke about." In the context of a family, **silence is often part of the grain.** It is a deliberate shape. To fill that silence with invention is to violate the coherence of the relationship you had with her. She presented herself to you with that hole in the center; to fill it is to claim you know her better than she allowed you to.

  **The Mother's Objection:**
  Your mother acts as the guardian of the family's collective memory. Her objection suggests that the silence was a protective boundary, not just a gap.

  **The Exception Clause:**
  The only way this becomes permissible is if the silence *itself* is the story.
  *   **Wrong:** Writing a drama where she has a secret affair during the silent years (filling the gap with plot).
  *   **Right:** Writing a drama about *your attempt to understand why she never spoke* (making the silence the grain).

  **My Verdict:**
  If you dramatize the silent years as if you know what happened, you are committing Case (1) and Case (3) on a domestic scale. You are inventing a sex scandal of the soul.
  If you dramatize the *effect* of that silence on you and your mother, you are honoring the coherence of the life as it was actually lived: a life that included a locked room.

  **Recommendation:**
  Do not touch the silence itself. Touch the door. The story isn't what she did in those years; the story is that she kept them from you. That is the truth you owe her. To invent the contents of the room is to rob her of the only privacy death left her. To examine the door is to honor the shape of her life.
