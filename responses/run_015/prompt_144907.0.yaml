          *   Two Rats: This is the stress test. If they share sensory input but not memory, is the "binding" high enough? This is where the user flips.
      *   *Critique:* "Binding density" is a good start (reminiscent of Integrated Information Theory - IIT), but it's vague. Does it require a *single* physical substrate? Does it require *memory* integration or just *sensory* integration? The rat case exposes this ambiguity.

  3.  **Identify the Underlying Tension:**
      *   The user is oscillating between **Functionalism** (what it does) and **Substrate/Structuralism** (what it is made of/how it's connected).
      *   The user is also oscillating between **Unity** (one subject) and **Multiplicity** (many subjects).
      *   The core principle seems to be **Integrated Information / Unified Subjectivity**, but the boundary conditions are fuzzy.

  4.  **Formulate a Coherent Principle:**
      *   *Candidate Principle:* **Causal Integration with a Unified Model of Self.**
      *   To be conscious, a system must not just process information, but integrate it into a single, causally effective model that distinguishes "self" from "world."
      *   *Refinement:* Let's lean into the user's "binding" idea but sharpen it. **Integrated Information Theory (IIT)** is the closest formal framework. It posits that consciousness *is* integrated information ($\Phi$).
