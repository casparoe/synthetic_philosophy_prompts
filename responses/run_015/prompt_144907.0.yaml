      *   *Two Rats:* This is the crux. If the bridge allows *causal integration* (A affects B's state immediately and vice versa), $\Phi$ increases. If they remain distinct memory stores, $\Phi$ might not merge fully.
      *   *Verdict on Rats:* Under strict IIT, if the integration is high enough, it becomes *one* system. If the memory stores remain isolated, the "self-model" is fractured. This explains the flipping.

  6.  **Address the "Toss Out" Requirement:**
      *   To keep the principle simple (Unified Causal Integration), the **Octopus** verdict needs nuance. If consciousness requires a *unified* POV, and the octopus is fragmented, is it *one* consciousness or many? The user says "Yes, but fragmented." This implies consciousness is a spectrum, not a binary.
