      *   **User's Hypothesis:** "Binding densities" (degree of sensory integration into a single point of view).
      *   **Constraints:** Be honest. Don't just play along. Point out incoherencies. Suggest which verdicts might need to be tossed. Address unlisted cases (slime mold, split-brain humans).

  2.  **Evaluate the "Binding Density" Hypothesis:**
