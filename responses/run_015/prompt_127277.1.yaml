answer: |-
  1. Defenders acknowledge these periods are historiographical constructs but argue they track genuine shifts in cultural intensity and self-understanding rather than describing nothing real. Her summary conflates the social construction of categories with the absence of underlying historical phenomena that justify their use.
  2. While Shapin correctly notes Newton's alchemy, defenders argue this does not negate the fundamental conceptual shift toward mechanistic cosmology that distinguishes the era from prior Aristotelianism. The presence of continuity in practice does not preclude a radical discontinuity in theoretical framework or epistemic virtue.
  3. Although Petrarch framed the middle period negatively, modern defenders note that the Renaissance category captures a specific change in humanist self-fashioning that medievalists themselves recognize as distinct. Dismissing the Renaissance solely because medieval roots exist ignores the changed scale and reception of classical learning in the 15th century.
  4. Her conclusion that terms should be abandoned does not follow from their constructed nature, as most historians retain them as heuristic tools while acknowledging their permeability. Replacing them entirely with local narratives risks losing the ability to compare broad structural transformations across regions.
  5. A strict continuity thesis struggles to explain why the 1572 supernova disrupted cosmological assumptions while the 12th-century translation movement did not produce an immediate paradigm shift. Applying her model consistently would flatten these distinct intensities of change into an implausible narrative of uniform development.
