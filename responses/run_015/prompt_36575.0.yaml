answer: |-
  # Quick verdicts

  *   **(2) vs (4):** **WORRY** — Maximizing expected value contradicts hedging across moral worldviews.
  *   **(1) vs (3):** **WORRY** — "Neglectedness = returns" clashes with "Too neglected = zero impact (thresholds)."
  *   **(1) vs (5):** **WORRY** — Claiming dry spells yield returns conflicts with funding a cause seeing billions.
  *   **(3) vs (5):** **WORRY** — Saturation limits conflict with the claim that AI safety still dominates EV.
  *   **(3) vs (6):** **MODERATE** — S-curves might suggest spreading funds to hit multiple thresholds rather than concentrating.
  *   **(1) vs (2):** Fine — SNT is a tool for consequentialist maximization.
  *   **(1) vs (4):** Fine — Framework can apply across different moral worldviews.
  *   **(1) vs (6):** Fine — SNT ranking naturally leads to concentrating on the top option.
  *   **(2) vs (3):** Fine — Consequentialism accommodates non-linear return curves.
  *   **(2) vs (5):** Fine — EV maximization supports AI if the calc holds.
  *   **(2) vs (6):** Fine — Maximization implies concentrating on the highest EV option.
  *   **(3) vs (4):** Fine — Return curves apply regardless of moral worldview.
  *   **(4) vs (5):** Fine — Hedging can still weight heavily toward one cause.
  *   **(4) vs (6):** Fine — Diversifying across causes but concentrating within them is consistent.
  *   **(5) vs (6):** Fine — Recommending AI safety is a form of concentration.

  # The real tensions

  **(2) Plain Consequentialism vs. (4) Moral Uncertainty Diversification**
  This is the deepest philosophical crack in the document. Commitment (2) demands you calculate expected values and pick the maximum. In standard decision theory, if you integrate moral uncertainty into that calculation (expected choiceworthiness), you should still pick the single option with the highest score. Commitment (4) explicitly rejects this, opting to split funds because you don't trust the calculation or the moral view. This is effectively risk-aversion over moral value, which (2) forbids. If you hold (2), (4) looks like irrational dilution of impact. If you hold (4), (2) is too simplistic about uncertainty.
  *Cost of resolution:* Dropping (2) means admitting you are not a plain maximizer but a hedger, complicating your decision rule. Dropping (4) means going all-in on one moral worldview (e.g., just longtermism), risking total moral failure if that view is wrong. You cannot have both strict maximization and explicit hedging without redefining one.

  **(1) SNT Neglectedness vs. (3) S-Shaped Returns**
  Commitment (1) asserts that neglectedness drives returns because money flows to visible things, leaving dry spells ripe for picking. Commitment (3) argues returns are S-shaped, meaning the most neglected causes (those at the start) often yield *zero* impact until a threshold is met. These define "neglectedness" oppositely. In (1), neglected is good (high marginal returns). In (3), too neglected is bad (below activation threshold). This creates confusion in how you score causes. If you follow (1), you seek the emptiest fields. If you follow (3), you seek fields that are just past the tipping point but not saturated.
  *Cost of resolution:* Revising (1) requires nuancing the framework to account for minimum viable funding, losing the simplicity of "neglected = good." Revising (3) means assuming linear or diminishing returns from dollar one, which ignores the reality of field-building and infrastructure costs. You need a unified model of marginal returns.

  **(1 & 3) Framework vs. (5) AI Safety Recommendation**
  This is the practical collision. Both (1) and (3) suggest that causes with billions in funding (like AI safety) should have lower marginal returns due to competition and potential saturation. Commitment (5) asserts AI safety dominates anyway. This implies Scale and Tractability overwhelm Neglectedness and Saturation concerns. While mathematically possible, it renders (1) and (3) decorative rather than operative for your largest decision. If the framework doesn't steer you away from crowded fields, its utility is limited.
  *Cost of resolution:* Changing (5) means potentially abandoning the highest EV cause based on framework constraints, risking massive opportunity cost. Changing (1) and (3) means admitting the framework cannot handle "winner take all" dynamics where scale dwarfs neglectedness, reducing the framework's general applicability.

  # The one that dissolves

  **(4) Diversify Across Worldviews vs. (6) Concentrate Within Causes**
  This pair looks contradictory on a surface read—(4) says "split the money," (6) says "don't diversify." However, they operate at different levels of granularity and survive inspection. (4) is a macro-allocation strategy driven by moral uncertainty; it acknowledges you don't know which *type* of good is most important (humans vs. animals vs. future generations). (6) is a micro-execution strategy driven by diminishing returns; it acknowledges that within a specific cause area, spreading funds too thinly reduces impact. You can logically hold that moral truth is uncertain (requiring a portfolio of worldviews) while simultaneously believing that operational effectiveness requires concentration (once a worldview is chosen). This is standard portfolio theory applied to cause selection rather than asset selection.

  # The cheapest fix

  **Revise Commitment (2)**
  Change (2) from "pick the max" to "maximize expected choiceworthiness, accounting for risk aversion under moral uncertainty." This single edit cleans up the most friction. It immediately legitimizes (4) not as an exception to your consequentialism, but as a derived feature of it (hedging against moral error). It also softens the pressure on (5); if you are hedging, you can justify a heavy AI weight without claiming it is the singular maximum, allowing room for the empirical tensions in (1) and (3) to be managed as risk factors rather than hard constraints.
  *What you lose:* You lose the simplicity and rhetorical punch of "plain consequentialism." You admit that your giving strategy isn't just about finding the biggest number, but also about managing the risk of being morally wrong, which introduces complexity into how you explain your decisions to others.
