answer: |-
  This is a sharp dissection of the regulatory landscape. You have correctly identified that current aquaculture welfare standards are not the application of a single, coherent ethical theory, but rather a patchwork of ethical intuitions, economic constraints, and audit logistics.

  Here is the conceptual sorting of the package you are looking at.

  ### 1. The Implicit Theory: Negative Hedonism + Statistical Utilitarianism

  The standards presuppose a specific, narrowed definition of welfare that can be summarized as **Negative Hedonism measured via Statistical Utilitarianism.**

  *   **Negative Hedonism:** The theory assumes welfare is primarily about the minimization of negative subjective states (pain, fear, distress) rather than the promotion of positive states (pleasure, flourishing) or the respect for telos (natural functioning). This explains the focus on slaughter (the point of maximum potential pain) and the relative silence on the months of rearing. If the animal doesn't *feel* bad acutely, the welfare box is ticked. It implicitly rejects the "Deprivation View" (that death itself is a harm) because the industry is predicated on killing.
  *   **Statistical Utilitarianism:** By scoring welfare at the pen or crop level (mortality %, density), the standards treat welfare as an aggregate property. This presupposes that individual variance is morally negligible provided the *average* suffering stays below a threshold. It is a utilitarian calculus adapted for industrial logistics: if 95% of the batch dies humanely, the batch is certified, even if the 5% suffered egregiously.
  *   **Procedural Compliance:** Perhaps most importantly, the theory is often **Procedural** rather than **Outcome-Based**. If the operator follows the recipe (ice slurry for X minutes), they are compliant, even if the biological outcome (time to insensibility) varies due to thermal biology. The theory presupposes that following the correct *process* guarantees the correct *state*, which is empirically false in the case of cold-adapted species in ice, but administratively necessary.

  ### 2. Where the Inconsistencies Lie

  You asked if there is one theory that makes the package coherent. There isn't. The inconsistencies arise because different parts of the production cycle are governed by different economic and ethical pressures.

  *   **Broodstock vs. Grow-out (The Value Density Problem):** Eyestalk ablation is banned or phased out in many contexts, while grow-out conditions remain dense. Why? Broodstock animals are high-value individuals. A single female shrimp is genetically valuable; losing her or compromising her health is an economic loss. Grow-out shrimp are commodities. The ethical concern tracks the economic value. The theory here is **Property Stewardship** rather than **Individual Rights**. We protect the valuable breeding asset; we manage the risk of the commodity crop.
  *   **Thermal Biology vs. Standardized Methods:** The ice slurry defense for shrimp versus finfish stunning highlights a conflict between **Biological Reality** and **Regulatory Uniformity**. Regulators prefer uniform rules (ice is acceptable for crustaceans) because they are easier to enforce than biological outcomes (time to insensibility). The inconsistency is tolerated because crustacean sentience has historically been legally ambiguous (though changing), allowing a lower bar of proof for insensibility than for vertebrates.
  *   **Fasting as Safety, Not Welfare:** This is a categorical exclusion. By defining fasting as a "food safety" or "meat quality" issue, regulators externalize the welfare cost (hunger). This preserves the "Welfare Score" from being dragged down by a necessary industry practice. It presupposes that **Welfare is a distinct category from Basic Needs** when those needs conflict with product quality.

  ### 3. The Epistemology of the Behavioral Tests

  Your concern about the behavioral tests is well-founded. The practice relies on **Methodological Operationalism**, not necessarily Philosophical Behaviorism.

  *   **Operationalism:** The regulators do not necessarily deny that an animal has an inner life (qualia) that persists without movement. However, they define "insensibility" *operationally* as "failure to respond to stimuli X, Y, and Z." This is not a claim about the nature of consciousness, but a limitation of measurement. On a processing line, you cannot measure neural activity or cortisol levels in real-time for every animal. You can only measure behavior.
  *   **The Risk:** You are correct that this conflates immobility with insensibility. In vertebrates, we know paralysis does not equal unconsciousness. In fish and crustaceans, the link is assumed to be tighter because their motor control is more reflexively tied to brainstem/ganglia activity. However, tonic immobility (playing dead) is a known stress response in some aquatic species.
  *   **The Presupposition:** The standards presuppose that **False Negatives (declaring a conscious animal dead) are an acceptable risk** provided the rate is low. It is a risk-management epistemology. They accept that some animals might be conscious during bleeding, but if the *protocol* is followed, the liability is mitigated.

  ### 4. What Would Change Under a Different Theory?

  If you shifted the theoretical foundation, the industry would not just reform; it would fundamentally transform or collapse.

  *   **The Deprivation View:** If death itself is the primary harm (because it deprives the animal of a future of positive experiences), then humane slaughter is an oxymoron. You do not get a reformed industry; you get **no animal aquaculture**. This is why welfare standards implicitly reject this view. They are "welfare" standards, not "rights" standards.
  *   **The Desire/Flourishing View:** If welfare requires the satisfaction of desires or the expression of natural behaviors (swimming freely, foraging, social structures), high-density aquaculture becomes impossible. Shrimp are territorial or social depending on species; crowding them prevents this. Adopting this theory would move aquaculture from a **mass-production protein model** to a **luxury conservation model**. Volumes would drop by orders of magnitude; prices would skyrocket.
  *   **Individual Monitoring at Scale:** You asked what a standard would look like if individual welfare were taken seriously across the cycle.
      *   **Technologically:** It would require continuous biomarker monitoring (e.g., computer vision for gill rate, swimming patterns, lesion detection) for every pen, potentially every individual.
      *   **Economically:** This adds cost. If you mandate individual-level assurance for tens of thousands of animals, the cost per unit rises.
      *   **Conceptually:** It collapses the "Statistical Welfare" model. If you must guarantee *every* animal's welfare, you cannot sample mortality; you must prevent *any* unnecessary mortality. This is incompatible with biological systems where spontaneous death occurs.
      *   **Result:** It likely collapses into a position that isn't about *standards* anymore, but about **provenance**. It becomes a niche market (like wild-caught, high-welfare labels) rather than a regulatory baseline for commodity food.

  ### Summary

  The package you are reading presupposes that **animals are sentient production units.**

  It locates the moral problem in **acute pain** because that is the most publicly defensible point of intervention. It treats welfare as **aggregate** because individual monitoring is economically prohibitive at scale. It accepts **procedural compliance** over biological outcomes because enforcement requires uniformity.

  The inconsistencies (ablation bans vs. crowding, fish stunning vs. shrimp chilling) are not philosophical errors; they are **compromises**. They represent the boundary where public ethical intuition (don't let them suffer visibly at death) meets industrial capacity (we must kill 10,000 an hour).

  If you apply a consistent, individual-focused, life-course welfare theory, you do not get better standards for the current industry. You get a different industry entirely—one that produces significantly less animal protein at significantly higher cost. The current standards are not designed to maximize welfare; they are designed to **minimize welfare risk** within the constraints of mass production.
