  You are conflating the robustness of equilibria with the epistemic foundations of rationalizability, and your conclusion that elimination is merely "premature" concedes far too much to the weak dominance framework. Trembling-hand perfection is a refinement of Nash equilibrium that operates on perturbed games, but rationalizability asks what strategies survive common knowledge of rationality in the *original* game. A weakly dominated strategy is never a unique best response to any belief, meaning a rational player has no justification for selecting it over the dominating alternative, regardless of epsilon-noise. Your argument actually undermines your own position: if trembles make the strategy strictly dominated in the perturbed game, it proves the strategy's fundamental instability, not its viability. Insisting weak dominance belongs in the elimination chain requires defending choices that are never strictly better and sometimes strictly worse, which violates instrumental rationality. Weak dominance shouldn't just be delayed; it should be tossed out entirely, leaving strict dominance as the only epistemically sound criterion for elimination.
