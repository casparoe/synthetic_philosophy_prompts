prompt: |-
  You're a professional philosopher — philosophy of language, and ideally someone who has actually worked a fact-checking desk — so please take this seriously and think carefully before you commit to anything. Brainstorm the failure modes first, then give me the thing I can use. Don't hedge every step into mush; where something is a judgment call, say so and move on.

  Context: I write a column on science and ideas, two pieces a week, and my copy is stuffed with conditional sentences. Roughly: If the interim analysis holds up, approval is likely. If the variant had been picked up two weeks earlier, the wave would have been half the size. If we miss the deadline, the whole programme collapses. If the result replicates, the field has to rethink everything. Half of these I write myself, half I'm quoting a source, and in maybe a quarter of them I want to attach a number — there's about a 70 percent chance that if X, then Y. My standards editor has started pushing back on the numbered ones, and honestly she's right to.

  Here's the theory I'm working from, half-absorbed and possibly mangled: Lewis's triviality results are supposed to show that you can't have both (a) a conditional that expresses a proposition with truth conditions you can put a probability on, and (b) the probability of the conditional always equaling the conditional probability of the consequent given the antecedent, P(if A then B) = P(B|A). Then the usual moves, as I understand them: drop the truth conditions and treat conditional judgement as suppositional, Adams-style; keep the truth conditions but say the equation fails, and let assertability go by conditional probability; restrict the equation to some special initial prior — a philosopher friend mentioned this at dinner and I definately can't tell whether it's a real move or something I dreamt; or the linguistics view where if-clauses don't form a two-place connective at all but restrict some modal or quantifier that's already there, with Kratzer's name attached to it in my notes. Tell me which of these I've got wrong, one sentence each. But: no reading list, no citations, no bibliography. I can't check them and I don't want them. If you're tempted to write "as X argues," just give me the test instead.

  What I actually want is a decision procedure, in words, that my desk and I can run on a conditional sentence in about ten minutes: the questions in order, what counts as a sufficient answer to each, where it stops with a no, and where it hands the decision to a person. Constraints: my copy editors have zero theory background, so every step has to be a question with a recognizable answer; anything involving a number has to end in wording my standards editor will sign off on; and where the real question is one of values, or of what I'm willing to say in my own voice, the procedure has to stop and hand it over rather than laundering it as a factual check. I need:

  - how to tell whether the sentence is a forecast, a causal or counterfactual claim, a bare regularity, or a covertly normative claim — the "find the modal" step, if that's a real step;
  - what to do when I want a number on the conditional itself (my guess: recast it as confidence in the consequent given the antecedent, never as a probability of a conditional — but say when the two come apart badly enough that even the recast misleads, e.g. when the antecedent is very unlikely or when the link is what's really at issue);
  - what to do when there's no number to be had and I'm forty minutes from deadline;
  - which conditionals to refuse to run as my own claim and attribute to the source instead, and how to attribute them without making the sentence unreadable;
  - a seperate gate where the copy editor has to escalate, and to whom.

  Then run the whole thing on three from my recent drafts: (1) If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance. (2) If the variant had been caught two weeks earlier, this wave would have been half the size. (3) If the result replicates, the field will have to rethink everything. Fair warning: I like (3), it's my closing line, and if your procedure kills it I want to be told plainly that it kills it and why — not let off with a rewrite that quietly saves it.

  Last thing, and it's the part I care most about: tell me what would change your mind about the procedure itself. Which result — an empirical one about how ordinary readers actually understand these sentences, or a theoretical one, like a version of the equation that survives Lewis only for a restricted class of priors or for one distinguished prior — would make you relax the rule against putting numbers on conditionals? Where is this procedure most likely to misfire on real copy? And say what it can't do: I assume it can't tell me whether my causal model is right, but tell me the rest.
