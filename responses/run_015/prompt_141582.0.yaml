      *   **Constraints:** No citations, no bibliography, no "as X argues." Clear questions with recognizable answers. Numbers must be defensible to a standards editor. Value judgments must be escalated, not laundered.
      *   **User's Context:** Science/ideas column, 2 pieces/week, stuffed with conditionals. Standards editor pushing back on numbered probabilities attached to conditionals.
      *   **User's Theory:** Lewis's triviality, Adams' suppositionalism, Kratzer's modal restriction. Needs correction/validation.

  2.  **Brainstorm Failure Modes (Step 1):**
      *   *Over-simplification:* Reducing complex semantic debates to a checklist might obscure genuine uncertainty.
      *   *False Precision:* The procedure might encourage editors to assign numbers where none exist, just to pass the check.
      *   *Theory-Practice Gap:* Copy editors won't understand *why* they're asking these questions, leading to rote checking without understanding the risk.
      *   *Attribution Evasion:* Writers might use the procedure to hide normative claims behind factual-sounding conditionals.
      *   *Deadline Pressure:* The 10-minute limit might force a "pass" when a deeper look is needed.
      *   *Reader Misinterpretation:* Even if the procedure is followed, readers might still interpret "70% chance if A then B" as P(A&B) or something else, regardless of the writer's intent.
      *   *The "Kratzer" Trap:* Treating all conditionals as modal restrictions might miss genuine probabilistic dependencies.

  3.  **Correct the Theory (Step 2):**
      *   *Lewis's Triviality:* Lewis showed that if conditionals are propositions with truth conditions, their probability cannot generally equal the conditional probability P(B|A) without collapsing the probability space.
      *   *Adams' Suppositionalism:* Adams proposes conditionals aren't true/false propositions but express degrees of belief in the consequent under the supposition of the antecedent.
      *   *Restricted Equation:* The idea that P(If A then B) = P(B|A) holds only for specific priors is not a standard solution to triviality; triviality results generally show no non-trivial probability function satisfies the equation for all propositions.
      *   *Kratzer's Modal Restriction:* Kratzer argues "if" is not a connective but a restrictor on covert modals (like "must" or "might"), changing the logical form entirely.

  4.  **Develop the Decision Procedure (Step 3):**
      *   *Goal:* 10 minutes, zero theory background, defensible numbers, escalate values.
      *   *Step 1: Identify the Modal.* Is it predictive (will), counterfactual (would have), normative (should/must), or causal (leads to)?
      *   *Step 2: The Number Check.* If a number is attached, is it P(B|A) or P(If A then B)? Rule: Only assert P(B|A). If the antecedent is unlikely, flag it.
      *   *Step 3: Evidence Check.* Is there a model/data supporting the link, or is it speculation?
      *   *Step 4: Attribution.* Is this the writer's voice or a source? If writer's voice + high stakes + uncertainty, attribute or soften.
      *   *Step 5: Escalation.* Normative claims disguised as predictions go to the Editor-in-Chief or Standards Editor.

  5.  **Apply to Examples (Step 4):**
      *   (1) *If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance.*
          *   Type: Predictive/Procedural.
          *   Number: 70% refers to approval given analysis holds.
          *   Issue: Regulatory discretion.
          *   Verdict: Recast as confidence in approval *given* the analysis, attribute the 70% to analysts if possible.
      *   (2) *If the variant had been caught two weeks earlier, this wave would have been half the size.*
          *   Type: Counterfactual/Causal.
          *   Number: None, but implies precision.
          *   Issue: Modeling uncertainty.
          *   Verdict: Attribute to modelers. Don't assert as fact.
      *   (3) *If the result replicates, the field will have to rethink everything.*
          *   Type: Predictive/Normative hybrid.
          *   Issue: "Have to" is normative/social, not logical.
          *   Verdict: Kill as factual claim. It's a judgment call.

  6.  **What Would Change My Mind/Limitations (Step 5):**
      *   *Change Mind:* Empirical evidence that readers reliably interpret "70% chance if A then B" as P(B|A) without confusion. Or a formal system that handles triviality without losing expressive power in natural language contexts.
      *   *Limitations:* Can't verify causal models. Can't determine truth of antecedents. Can't resolve normative disputes.

  7.  **Refining the Output:**
      *   *Tone Check:* Ensure I'm not hedging. Be direct.
      *   *Theory Check:* Ensure the corrections are accurate but brief. (Specifically: The "restricted prior" move the user mentioned is likely a confusion with Jeffrey Conditionalization or specific defenses against triviality like Bradley's, but generally, Lewis's result is robust for standard probability spaces. I need to be careful not to validate the "dreamt" move if it's not standard.)
      *   *Procedure Check:* Make it actionable. "Ask this," "If yes, do that."
      *   *Example Check:* Be harsh on (3) as requested.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Failure Modes:* Focus on the desk's limitations. They aren't philosophers. They might treat the checklist as a shield rather than a tool.
      *   *Theory:*
          *   Lewis: You can't have truth-conditional conditionals that obey the Ramsey Test (P(If A then B) = P(B|A)) without trivializing probability.
          *   Adams: Conditionals aren't true or false; they are acceptable to the degree of the conditional probability.
          *   Restricted Prior: There is no standard move that saves the equation by restricting priors; triviality holds for any probability function with enough distinct propositions.
          *   Kratzer: "If" clauses restrict modals (like "must" or "might") rather than connecting two propositions.
      *   *Procedure:*
          1.  **Modal Identification:** What is the verb? (Will vs. Would vs. Must).
          2.  **Number Validation:** Does the number describe the link (B given A) or the whole sentence?
