answer: |-
  ### Failure Modes

  1.  **Bureaucratic Shielding:** The desk uses the procedure to "pass" risky claims because they ticked the boxes, treating the checklist as a liability shield rather than a truth tool.
  2.  **False Precision:** The procedure forces a binary decision (number vs. no number) on claims that exist on a spectrum of evidential support, encouraging writers to invent confidence intervals to satisfy the form.
  3.  **Modal Blindness:** Copy editors miss covert modals (e.g., "rethink everything" implies "must rethink"), categorizing normative claims as predictive ones.
  4.  **Attribution Dilution:** Writers attribute claims to "models" or "experts" vaguely to bypass the escalation gate, leaving the reader unsure who actually owns the uncertainty.
  5.  **Deadline Panic:** The ten-minute limit forces editors to default to "attribute to source" even when the source is weak, laundering bad science through vague attribution.

  ### Theory Corrections

  *   **Lewis:** Lewis proved that if conditionals are propositions with truth conditions, their probability cannot equal the conditional probability P(B|A) without collapsing the probability space to triviality.
  *   **Adams:** Adams argues conditionals are not true or false propositions but are assertable to the degree that you believe the consequent given the antecedent.
  *   **Restricted Priors:** There is no standard move that saves the equation by restricting priors; triviality results hold for any probability function capable of distinguishing enough propositions.
  *   **Kratzer:** Kratzer argues "if" is not a logical connective but a restrictor that narrows the domain of a covert modal operator like "must" or "might."

  ### The Decision Procedure (10-Minute Gate)

  **Step 1: Find the Modal (2 minutes)**
  *   **Question:** Look at the consequence clause. Is the verb *will* (prediction), *would* (counterfactual), *must/should* (normative), or *does* (regularity)?
  *   **Sufficient Answer:** Identify one label. If the verb is "will" but the context implies obligation (e.g., "scientists will have to"), mark as **Normative**.
  *   **Stop:** If **Normative**, go to Step 5 (Escalation). Do not proceed as a factual claim.

  **Step 2: The Number Check (3 minutes)**
  *   **Question:** Does the sentence attach a probability to the whole "If... then..." structure, or to the outcome assuming the condition is met?
  *   **Sufficient Answer:** "Outcome assuming condition."
  *   **Rule:** You may never write "There is a 70% chance that if A, then B." You must write "If A, there is a 70% chance of B."
  *   **Stop:** If the antecedent (A) is highly unlikely (less than 10% chance of happening), do not attach a number. It misleads readers about overall risk. Hand to Step 5.

  **Step 3: The Link Check (3 minutes)**
  *   **Question:** Is the connection between A and B based on a mechanistic model, historical data, or expert consensus?
  *   **Sufficient Answer:** Cite one specific model, dataset, or named consensus body. "Experts say" is insufficient.
  *   **Stop:** If the link is speculative or theoretical only, remove the number. Attribute the claim to the theorist.

  **Step 4: Attribution (2 minutes)**
  *   **Question:** Is this claim in the writer's voice or the source's voice?
  *   **Sufficient Answer:** "Source's voice" requires a named entity (Person, Institution, Paper). "Writer's voice" requires the writer to accept full liability for the uncertainty.
  *   **Rule:** If the stakes are high (policy, health, finance) and uncertainty is high, force attribution. Do not let the writer own the probability.

  **Step 5: Escalation (Immediate)**
  *   **Trigger:** Normative claims disguised as predictions; numbers attached to unlikely antecedents; writer owning high-stakes probabilistic claims without named source data.
  *   **Action:** Send to Standards Editor. Note: "Value judgment disguised as fact" or "Unverifiable probability."

  ### Application to Drafts

  **(1) "If the trial's interim analysis holds up, the drug will be approved — call it a 70 percent chance."**
  *   **Step 1 (Modal):** *Will be approved.* Predictive/Procedural. Pass.
  *   **Step 2 (Number):** Currently reads as 70% chance of the whole conditional. **Fail.** Must recast: "If the analysis holds up, there is a 70% chance of approval."
  *   **Step 3 (Link):** Regulatory approval is not mechanistic; it is discretionary. The link depends on human decision-makers, not just data.
  *   **Step 4 (Attribution):** Who says 70%? If this is your calculation, **Escalate**. If this is from analysts at a specific bank or firm, attribute: "Analysts at X estimate a 70% chance..."
  *   **Verdict:** **Rewrite required.** Recast the number as conditional on the analysis, and attribute the percentage to a specific source. Do not own this number yourself.

  **(2) "If the variant had been caught two weeks earlier, this wave would have been half the size."**
  *   **Step 1 (Modal):** *Would have been.* Counterfactual. Pass.
  *   **Step 2 (Number):** "Half the size" is a precise number attached to a counterfactual.
  *   **Step 3 (Link):** Requires an epidemiological model. Is there a specific model cited? If not, **Fail.**
  *   **Step 4 (Attribution):** Counterfactuals are model-dependent. You cannot assert this as fact.
  *   **Verdict:** **Attribute or Kill.** Must read: "Modeling suggests this wave could have been half the size..." If no model exists, kill the "half" precision. Change to "significantly smaller."

  **(3) "If the result replicates, the field will have to rethink everything."**
  *   **Step 1 (Modal):** *Will have to.* This is **Normative**. It claims an obligation, not a physical necessity.
  *   **Step 2 (Number):** No number, but implies certainty.
  *   **Step 3 (Link):** The link is social, not causal. The field *could* ignore the result.
  *   **Step 4 (Attribution:** This is your voice.
  *   **Step 5 (Escalation):** **Trigger.** This is a value judgment about scientific norms disguised as a prediction.
  *   **Verdict:** **Kill as written.** You asked me to be plain: this procedure kills it. It asserts a normative necessity ("have to") as if it were a law of nature.
  *   **Fix:** You can keep it only if you own it as opinion. "If the result replicates, I believe the field must rethink everything." But as a factual closing line? It fails the Modal check.

  ### What Would Change My Mind

  **Empirical Result:** If psycholinguistic studies showed that ordinary readers consistently interpret "There is a 70% chance that if A then B" as P(B|A) without inferring truth conditions or committing the conjunction fallacy, I would relax the rule against numbering the conditional itself. Currently, evidence suggests readers conflate the probability of the conditional with the probability of the conjunction (A & B), leading to significant miscommunication.

  **Theoretical Result:** If a formal system were developed that preserved the Equation (P(If A then B) = P(B|A)) without triviality *and* mapped cleanly onto natural language semantics (unlike current suppositional theories which deny truth conditions), I would reconsider the prohibition. However, no such system currently handles the full range of natural language conditionals without significant costs to logic or probability theory.

  ### Limitations

  *   **Causal Validity:** This procedure cannot tell you if the causal model is right. It only checks if you've claimed certainty where there is none.
  *   **Antecedent Truth:** It does not verify whether A is true or likely. It only checks how you handle the uncertainty of A.
  *   **Normative Resolution:** It cannot resolve whether the field *should* rethink everything; it only flags that you are making a normative claim.
  *   **Reader Psychology:** It assumes readers process "If A, 70% B" correctly. It does not protect against readers ignoring the "If."

  ### Where It Will Misfire

  *   **Hedged Norms:** Writers will learn to swap "must" for "will likely" to bypass Step 1. You need human judgment to spot when "will likely" is actually a normative expectation.
  *   **Consensus Illusion:** Writers will cite "consensus" where none exists. The desk cannot verify consensus in 10 minutes.
  *   **The "Half" Problem:** In example (2), editors might accept "significantly smaller" as safe, but even that implies a directional certainty that models might not support. The procedure is a sieve, not a filter; some sand will get through.
