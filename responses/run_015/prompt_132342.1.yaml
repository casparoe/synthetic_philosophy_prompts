answer: |-
  Consider the case of a 'forensic reconstruction' of a legendary, unnotated free-jazz improvisation. Suppose that in 1961, a seminal pianist performed a solo at a small club that was never recorded, yet was witnessed by hundreds who attest to its transformative power. Decades later, using advanced algorithmic analysis of the artist's known corpus, physiological modelling of their touch, and testimony from witnesses, a team produces a 'perfect' sensory replica. A contemporary pianist memorises this reconstructed score and performs it in the same venue, on the same model of instrument, replicating the exact tempo, timbre, and dynamic contour of the hypothetical original. To the blindfolded listener, the experience is indistinguishable from the lost event. Yet, a profound philosophical unease remains regarding whether this performance instantiates the *same work* as the 1961 event.

  This scenario exposes a fissure in the traditional classification of artistic media. In the philosophy of art, a distinction is often drawn between arts where the history of production is essential to the work's identity and those where it is not. In painting, a perfect copy is a forgery because the work is tied to the specific physical history of the canvas's creation; the brushstroke is a trace of the artist's bodily presence. Conversely, in classical music, the work is typically defined by a score; any performance that complies with the notation is an genuine instance of the symphony, regardless of when or by whom it is played. The reconstructed jazz solo sits uneasily between these categories. It behaves like a painting in that its value seems tethered to the specific historical moment of its genesis, yet it behaves like a symphony in that it is sonic and temporal, seemingly capable of being repeated.

  The tension here lies between aesthetic value (the sensory experience of the sound) and artifactual value (the historical status of the event). A pure experientialist would argue that if the listener cannot tell the difference, the aesthetic value is identical; the emotion evoked by the sound waves is the same, therefore the art is the same. However, this ignores the specific nature of improvisation as a 'performative original'. In free jazz, the aesthetic merit is not merely in the resulting pattern of notes, but in the *risk* involved in their generation. The audience's appreciation is partly constituted by the knowledge that the musician is navigating uncertainty in real-time. When the reconstruction is performed, the 'risk' is simulated. The musician is not improvising; they are executing a script derived from a past act of improvisation. The sensory output is identical, but the generative context—the 'performative' element—has shifted from creation to replication.

  Conversely, a simple authenticity fetishism would argue that the replica is worthless simply because it lacks the causal chain to the original artist. This, too, is insufficient. If the original artist were to return and play the exact same solo again, note-for-note, from memory, we would likely accept it as a valid (if unusual) second instance of the work. The issue is not merely the biological identity of the player, but the preservation of the *improvisational stance*. The replica fails not because it is new, but because it treats an autographic event (a unique historical occurrence) as if it were an allographic object (a repeatable structure defined by compliance). By fixing the improvisation into a reproducible pattern, the reconstruction strips the work of the very quality that made it valuable: its resistance to fixation.

  Therefore, the 'performative original' resists being categorised as either a static artefact or a repeatable score. Its identity is constituted by the ritual of its own emergence. The replica lacks value not because it is a fake in the sense of a forged painting, nor because it is a bad performance in the sense of a botched symphony. It lacks value because it collapses the tension between the act and the object. It preserves the *trace* of the performance without the *presence* of the performative act. In this borderline case, we see that for certain arts, the 'original' is not the physical object or the sound wave, but the historical instance of decision-making under pressure. To reproduce the outcome without the process is to create a hollow shell; it satisfies the eye and ear, but it violates the conceptual framework through which we apprehend the work's meaning. The value is lost not in the hearing, but in the knowing that the moment of creation has been replaced by the labour of reconstruction.
