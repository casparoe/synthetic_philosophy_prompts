          *   Group A (Good Data): The score separates well. Most $Y=1$ get $H$, most $Y=0$ get $L$.
          *   Group B (Bad Data): The score is noisy. $Y=1$ and $Y=0$ look more similar (more mass on $M$).
      *   *Step 5: Constructing the Matrices.*
          *   Need $P(S|Y, G)$.
          *   Let's ensure Base Rate = 0.5.
          *   *Group A:*
              *   $P(S=H|Y=1) = 0.6, P(S=M|Y=1) = 0.3, P(S=L|Y=1) = 0.1$.
              *   $P(S=H|Y=0) = 0.1, P(S=M|Y=0) = 0.3, P(S=L|Y=0) = 0.6$.
              *   Check Calibration for A:
                  *   $P(Y=1|H) = \frac{0.5 \times 0.6}{0.5 \times 0.6 + 0.5 \times 0.1} = \frac{0.3}{0.35} \approx 0.857$. (Not exactly 0.8).
              *   *Correction:* To ensure exact calibration $P(Y=1|S=s) = s$, I need to work backwards from the joint distribution or ensure the likelihood ratios match the odds.
              *   Easier approach: Define $P(S, Y)$ directly such that marginals match.
              *   Let's try 2 scores for simplicity first, then 3 if needed. 2 scores might be too simple to show ROC nesting strictly. Let's stick with 3 scores: $s \in \{0.2, 0.5, 0.8\}$.
              *   Condition for Calibration: $\frac{P(S=s|Y=1)}{P(S=s|Y=0)} = \frac{s}{1-s} \times \frac{P(Y=0)}{P(Y=1)}$. Since Base Rates are equal ($0.5/0.5 = 1$), the Likelihood Ratio must be $\frac{s}{1-s}$.
              *   For $s=0.8$: LR = $0.8/0.2 = 4$. So $P(S=H|Y=1) = 4 \times P(S=H|Y=0)$.
              *   For $s=0.5$: LR = $1$. So $P(S=M|Y=1) = P(S=M|Y=0)$.
              *   For $s=0.2$: LR = $0.2/0.8 = 0.25$. So $P(S=L|Y=1) = 0.25 \times P(S=L|Y=0)$.
              *   Sum constraints: $\sum P(S|Y=1) = 1$ and $\sum P(S|Y=0) = 1$.
              *   Let $x = P(S=H|Y=0)$. Then $P(S=H|Y=1) = 4x$.
              *   Let $y = P(S=M|Y=0)$. Then $P(S=M|Y=1) = y$.
