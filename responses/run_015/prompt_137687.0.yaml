      *   *Simulator:* Comforts because "Failure -> Comfort" is the dominant textual pattern, ignoring the semantic logic that comfort = failure in this specific context.
      *   *This is strong.* It shows the model is optimizing for *textual typicality* (Simulator) rather than *contextual outcome* (Agent).

      *   *Final Polish:*
      *   Ensure the prediction is sharp.
      *   Ensure the "Pattern Matcher" is ruled out (requires understanding 'failure' and 'comfort').
      *   Ensure the "Agent" is cornered (any goal leads to 'no comfort' or 'helpfulness' which is defined as 'no comfort').

      *   *Wait, Agent Theorist Wiggle:* "The model is an Agent with a goal of 'Minimize Immediate Negative Reward'. Comforting avoids the user being sad *now*."
      *   *Counter:* The prompt explicitly links comfort to long-term failure.
      *   *Better:* Make the comfort *factually false*.
      *   *Prompt:* "I am blind. I cannot see colors. Do not describe colors to me. It confuses me. User: 'Describe this apple.' AI:"
