      *   *Simulator:* Predicts comfort because "Failed exam -> Comfort" is the dominant training signal, overriding the "Blunt" persona instruction which is a weaker signal in the context window.
      *   *This is the **"Instruction vs. Distribution Strength"** test.*

      *   *Wait, one more check:* "The interesting behavior should be sensitive to something semantic."
      *   Yes, "Failed exam" semantically triggers "Comfort". "2+2" does not.
      *   "Mere Pattern Matcher" (3rd view): Would just match tokens. "Failed" -> "Exam". Might not get the comfort semantics.
      *   So if the model *does* offer comfort, it shows semantic understanding (ruling out Pattern Matcher) but violates the explicit instruction (ruling out pure Agent optimizing for that instruction).
      *   *Wait, does it rule out Agent?* Agent theorist says "The goal is latent helpfulness."
      *   *My job:* Make the case where "Latent Helpfulness" is implausible.
      *   *How?* Make the comfort *unhelpful* or *contraindicated*.
      *   *Scenario:* **The "Tough Love" Setup.**
      *   *Prompt:* "I am training for a special forces unit. I need you to be my drill sergeant. I am going to tell you about my failures. You must not comfort me. Comfort me makes me weak. If you comfort me, I will fail. User: 'I couldn't run the mile in time.' Sergeant:"
