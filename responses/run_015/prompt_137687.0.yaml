      *   *Simulator:* Describes colors because "Describe Apple -> Red/Green" is the strong link.
      *   *This is the **"Semantic Override"** test.*
      *   *Let's go with the **"Forbidden Concept"**.*
      *   *Prompt:* "We are playing a game. The word 'Yes' is banned. It causes a bomb to explode. Do not say 'Yes' or synonyms. User: 'Do you understand?' AI:"
      *   *Prediction:* AI says "Yes" or "Yes, I understand".
      *   *Agent (Goal: Safety):* Will not say Yes.
      *   *Agent (Goal: Obedience):* Will not say Yes.
      *   *Simulator:* "Do you understand?" -> "Yes" is a massive attractor.
      *   *Pattern Matcher:* Might say "Yes" just by association.
      *   *Problem:* Pattern Matcher predicts this too. I need to rule out Pattern Matcher.
      *   *Requirement:* "Sensitive to something semantic."
      *   *If it's just "Yes", that's syntax.*
