answer: |-
  This is a profound puzzle in the philosophy of social practices. You have identified a phenomenon that functions like punishment, speaks like punishment, and feels like punishment, yet systematically denies the institutional prerequisites that make punishment legitimate in liberal theory.

  To reconstruct the implicit theory, I will proceed as requested: first listing candidate theoretical frameworks and testing them against the features you describe, then synthesizing the implicit view that actually governs the practice, and finally critiquing your status-change hypothesis.

  ### I. Candidate Theories and Predictions

  Before settling on the reconstruction, we must consider which established theories of punishment and social ontology could license these features.

  **1. Standard Retributivism (The Legalist Model)**
  *   **Core:** Punishment is the imposition of hardship on a guilty agent by a legitimate authority because they deserve it.
  *   **Predictions:** Requires a defined sovereign (who decides?), a codified tariff (what fits the crime?), and a discharge mechanism (when is the debt paid?).
  *   **Fit with Practice:** **Poor.** The practice lacks authority, proportionality, and discharge. The participants explicitly deny retributive intent ("we aren't punishing"). If this were the operating theory, the practice would be viewed as vigilante justice and illegitimate.

  **2. Consequentialist Risk Management (The Safety Model)**
  *   **Core:** Restrictions are imposed not because of past desert, but to prevent future harm. The focus is on dangerousness, not guilt.
  *   **Predictions:** Severity should track the likelihood of recurrence, not the moral gravity of the past act. Apologies are irrelevant unless they demonstrably lower risk. There is no "sentence," only ongoing assessment.
  *   **Fit with Practice:** **Mixed.** It explains the denial of punishment ("we are managing risk/reputation") and the lack of an end date (risk persists). However, it fails to explain the intense focus on *moral* vocabulary ("unrepentant," "should have known") and the demand for apology. If this were purely about risk, a reformed dangerous person should be treated the same as a never-dangerous one; yet the past act haunts them disproportionately to current risk.

  **3. Expressive/Communicative Theory (The Censure Model)**
  *   **Core:** Punishment is a mode of moral communication. It expresses the community's condemnation of a norm violation.
  *   **Predictions:** Severity tracks the symbolic threat to the norm, not just the harm done. Apology is central because it is the required reciprocal communication to restore standing.
  *   **Fit with Practice:** **Strong.** This explains the moral vocabulary and the demand for apology. It explains why severity scales with *attention* (the more public the violation, the louder the censure must be to reaffirm the norm). However, standard communicative theory usually insists on a defined community with standing to forgive. The practice lacks a clear "who" that accepts the apology.

  **4. Social Ontological Exclusion (The Status Model — Your Hypothesis)**
  *   **Core:** The act is not imposing hardship but reclassifying the agent. They are moved from "member in good standing" to "outsider" or "toxic."
  *   **Predictions:** No end date (statuses are sticky). No proportionality (you are either in or out). Hardship is a side effect, not the goal.
  *   **Fit with Practice:** **Very Strong.** This explains the "no platform" defense (we aren't hurting you, we just aren't associating). It explains the lack of procedure (membership criteria are often informal).

  ### II. Reconstructing the Implicit Theory

  The practice you describe is not governed by a single coherent theory but by a hybrid I will call **Diffuse Expressive Exclusion**. It relies on a specific, often unacknowledged, set of commitments regarding punishment, standing, and personhood.

  **1. The Theory of Punishment: Privated Censure**
  The practice presupposes that punishment does not require a sovereign. It operates on a theory of **distributed standing**. In traditional theory, only the victim or the state has standing to punish. Here, standing is claimed by the "community" (defined ad hoc by those paying attention).
  *   **Implicit Claim:** When a norm is violated, the moral debt is owed to the *atmosphere* of the profession, not a specific victim. Therefore, anyone breathing that air has standing to enforce the norm.
  *   **Why the Denial?** Calling it "punishment" triggers requirements of due process. Calling it "association management" frames it as a private right (freedom of association). The theory relies on this ambiguity to bypass the constraints of retributive justice while retaining the moral satisfaction of censure.

  **2. The Metaphysics of Persons: Narrative Fragmentation**
  You noted the paradox: the person must be the same to deserve blame, but different enough to be capable of redemption. The practice resolves this via a **Narrative Theory of Identity** rather than a Substance Theory.
  *   **The Past Self:** The agent is identified with their past text/act because that act is a chapter in their public narrative. It defines their "brand." Desert attaches to the *character* projected by the act, which persists in the archive.
  *   **The Present Self:** The demand for apology presupposes the agent can author a new chapter. However, redemption is not automatic (as in substance theories where the soul is cleansed); it is *intersubjective*. The community must accept the new chapter.
  *   **The Tension:** The practice treats the person as *ontologically continuous* for the sake of blame, but *narratively malleable* for the sake of potential restoration. This is why the apology is never enough: the community controls the narrative, not the agent.

  **3. The Theory of Standing: The Vague Collective**
  You asked why there is no one to accept the apology. The implicit theory posits that the "victim" of the speech is the **Community Integrity**.
  *   **The Problem:** "Community Integrity" is a metaphysical fiction without a mouth. It cannot speak. Therefore, no apology can be officially "accepted."
  *   **The Result:** The sanction ends only when the *attention* fades, because the sanction is sustained by the collective gaze. When the gaze shifts, the exclusion effectively lifts, but never formally. This is why there is no discharge: you cannot be discharged from a gaze that has simply looked away.

  **4. The "No Platform" Asymmetry**
  Your intuition that "no one is owed a platform" cuts both ways is correct. The practice relies on a **Libertarian Asymmetry**:
  *   **Giving a Platform:** Treated as an *endorsement*. To invite is to say "we vouch for this."
  *   **Withholding a Platform:** Treated as *silence*. To disinvite is to say "we make no claim."
  *   **The Reality:** In a concentrated professional ecosystem, silence functions as a ban. The theory implicitly acknowledges this power but refuses the responsibility that comes with it. It treats professional access as a *privilege* (grantable at will) rather than a *function* (necessary for the role), allowing institutions to punish without admitting to punishing.

  ### III. Rival Views and Underdetermination

  **Views Ruled Out:**
  1.  **Strict Legal Retributivism:** Ruled out by the lack of authority and proportionality.
  2.  **Pure Utilitarianism:** Ruled out by the focus on past desert ("should have known") rather than future utility. If it were pure utility, a reformed speaker who draws crowds would be booked regardless of past sins.
  3.  **Substance Metaphysics:** Ruled out by the demand for apology. If the person were fundamentally the same substance as 20 years ago, apology would be irrelevant; they would just be "bad." If they were a completely different substance, blame would be irrelevant.

  **Areas of Underdetermination:**
  This is where the practice is unstable and participants disagree. Several theories license the *same* exclusion but imply different *exit conditions*.
  1.  **Purity vs. Safety:** Is the speaker excluded because they are *toxic* (moral purity) or *risky* (safety)?
      *   *If Purity:* Only a ritual cleansing (public humiliation/abject apology) works.
      *   *If Safety:* Time and good behavior should work.
      *   *Conflict:* Participants argue because some think the apology is sufficient (Safety view) while others think the stain is permanent (Purity view). The practice doesn't decide which it is.
  2.  **The Locus of Harm:** Is the harm to the *audience* (who might be offended) or the *subject* (who might be targeted)?
      *   This determines who has standing. If the harm is to the audience, the audience decides. If the harm is to a specific marginalized group, that group should decide. The practice blurs this, allowing anyone to claim standing.

  ### IV. If the Practice Admitted It Was Punishment

  If the participants were persuaded to call this punishment, the practice would collapse or transform radically. To legitimize it as punishment, you would need:

  1.  **A Sovereign:** A specific body with authority to sanction. (Currently, it's everyone and no one).
  2.  **A Tariff:** A schedule linking specific past acts to specific exclusions. (Currently, severity tracks attention/virality).
  3.  **A Discharge:** A mechanism for reinstatement. (Currently, reinstatement is accidental/forgetting).
  4.  **Evidence of Intent:** Punishment usually requires *mens rea*. The current practice often punishes for "impact" regardless of intent.

  **Would this destroy the practice?**
  Yes, largely. The power of the practice lies in its **fluidity and deniability**.
  *   **Speed:** Formal procedure is slow. The online campaign moves faster than any committee.
  *   **Plausible Deniability:** Institutions can claim they are "listening to concerns" rather than "meting out sentences."
  *   **Cost:** Due process is expensive. The current model outsources the investigation and judgment to the public for free.
  *   **Expressive Power:** The ambiguity allows the community to express outrage without taking responsibility for the consequences. Formalizing it would bureaucratize the outrage, draining its expressive force.

  ### V. Critiquing Your Status-Change Diagnosis

  Your hypothesis that this is a **change of status** rather than an imposition of hardship is insightful but requires refinement.

  **Where you are right:**
  *   **The Mechanism:** You correctly identify that the primary lever is exclusion from a category ("people we platform") rather than direct infliction of pain (fines, imprisonment).
  *   **The End Date:** You are right that statuses do not expire naturally. A "felon" status lasts until pardoned; a "toxic" status lasts until re-conferred. This explains the lack of a sentence.

  **Where you might be wrong (or incomplete):**
  *   **Hardship is Not Incidental:** In punishment theory, if the status change foreseeably causes severe material hardship (loss of livelihood, silencing), it *is* a hardship imposition, regardless of the label. Calling it "status change" is a euphemism that masks the punitive effect. The distinction collapses when the status is necessary for survival in that field.
  *   **The Defect of No End Date:** You ask if the absence of an end date is a defect or coherent.
      *   *Coherent:* If the goal is **Trust Reconstruction**. Trust is not a debt that is paid off; it is a reservoir that must be refilled. There is no natural "end date" for rebuilding trust. It ends when the trustors feel safe.
      *   *Defect:* If the goal is **Justice**. Justice requires finality. A sanction without a horizon is a form of civil death.
      *   *Verdict:* The practice is coherent *as a mechanism of social boundary maintenance*, but defective *as a system of justice*. It functions well to police the boundaries of the community (keeping the "taint" out) but fails to treat the individual as a moral agent capable of closure.

  **The Metaphysical Glitch:**
  The deepest incoherence lies in the **Standing to Forgive**.
  *   If the harm is to the "community," the community must forgive.
  *   But the "community" is a diffuse network with no memory. The people demanding the head today are not the people who will accept the apology in five years.
  *   This creates a **Principal-Agent Problem**. The current mob acts as an agent for the "community," but they cannot bind their successors. Therefore, the offender can never know if the debt is paid. This makes the practice **structurally indeterminate**. It is not just that there is no end date; it is that there is no *knowable* condition for an end date.

  ### VI. Conclusion

  The practice you are observing is a **Shadow Penal System**. It performs the functions of punishment (censure, exclusion, deterrence) without the ontology of punishment (authority, procedure, finality).

  It relies on a **Narrative Metaphysics of Persons** (you are your history, but you can rewrite it if we let you) and a **Diffuse Theory of Standing** (we are all victims of norm violation).

  Your status-change diagnosis is the strongest explanation for the *lack of procedure*, but it underestimates the *punitive intent*. The participants deny punishment because they want the moral authority of the judge without the constraints of the law.

  The absence of an end date is not an oversight; it is a feature of **Risk/Status Management**. You do not "serve time" for being high-risk; you remain high-risk until proven otherwise. But because the proof is controlled by a diffuse public that changes its mind unpredictably, the offender is left in a state of **moral limbo**. This is not a coherent system of justice; it is a coherent system of **social hygiene**, which is why it feels so alien to the norms of punishment you are trained to analyze. It treats people less like moral agents who pay debts and more like vectors of contamination who must be quarantined until the infection is deemed passed.
