  The slide to punishment justification is **fast**. While no desert follows, the leap to "only deterrence or quarantine" ignores alternative non-desert justifications like moral education or reconciliation. The chapter treats hard incompatibilism as entailing a specific penal theory, but one could reject desert while retaining restorative practices. The logic holds only if you assume desert is the only valid reason for blame, which is contested even among skeptics. Many skeptics argue for communicative theories of punishment that don't rely on desert but still involve censure. The analogy to manipulation cases is **fine**, but Strawson's point is deeper: it's not just external fixation, but the impossibility of internal self-fixation.

  What Strawson would say back
  Strawson would insist Premise 2 is conceptual truth: you can't be responsible for actions flowing from a nature you didn't choose. He argues compatibilists change the subject rather than refute him. He would clarify his argument targets "ultimate moral responsibility," the kind required for true desert, not merely social accountability. Regarding indeterminism, he would maintain that even an uncaused agent lacks responsibility because the nature they act from is still not *chosen* by them. Randomness or brute existence doesn't equal self-creation. He would also distance himself from his father's project; Galen is a metaphysical skeptic, whereas P.F. was a naturalist defending the inevitability of our practices against metaphysical skepticism.

  Does the practical upshot follow
  If the Basic Argument succeeds, desert-based retribution is indeed unjustified. However, the leap to "only deterrence or quarantine" is slightly too narrow. One could justify punishment via moral formation or reconciliation without invoking desert. Similarly, eliminating credit doesn't reduce praise to mere manipulation; it can remain a celebration of agency, even if not ultimately deserved. The core conclusion holds: basic desert is impossible. But the practical replacement isn't strictly limited to cold management; non-retributive practices can still honor human dignity without presupposing metaphysical responsibility. The chapter is right on the elimination of desert, but rigid on the alternatives.

  My uncaused-agent question
  This is a sharp question, but it doesn't escape the argument. Strawson's regress isn't merely about causal history; it's about *self-creation*. Even if your character pops into existence uncaused, you still didn't *choose* to have that character. To be responsible for it, you'd need to have chosen it based on some prior principle, which leads back to the regress. An uncaused agent is just lucky or unlucky in their nature, not responsible for it. This reveals Premise 2's strength: it demands authorship of the self, not just independence from prior causes. Indeterminism or acausality provides randomness, not control. So, no, it's not a gap; it confirms that the argument targets the source of the self, not just the causal chain.

  Bottom line
  The chapter is reliable on Galen Strawson's core argument but unreliable on the historical context regarding P.F. Strawson. You can trust its explanation of the Basic Argument, but treat its interpretation of the father-son connection and practical implications with skepticism.
