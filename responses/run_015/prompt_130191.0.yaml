answer: |-
  ### Desiderata for a Theory of Moral Revolution

  To be adequate for the historical novelist's purpose, a theory of moral change must not treat ethics as a geometry problem solvable by better axioms. It must treat ethics as an ecosystem. The following criteria distinguish a working model from a philosophical fantasy.

  #### I. Non-Negotiable Desiderata
  *These criteria must be met. Failure to satisfy them renders the theory historically inert.*

  **1. The Profit Paradox Constraint**
  *   **The Phenomenon:** The theory must explain the simultaneous disappearance of dueling (economically irrational, honor-bound) and slavery (economically rational, property-bound) within overlapping generations of the 19th century.
  *   **The Requirement:** The mechanism cannot be purely materialist (which predicts the persistence of slavery) nor purely honor-based (which struggles to explain the dismantling of a property regime). It must allow for distinct causal vectors that converge on the same historical horizon.
  *   **Philosophical Anchor:** This rejects Economic Determinism as a sufficient cause. It requires a dual-track explanation where *interest* and *honor* operate independently but can synchronize.

  **2. The Wardrobe Constraint (Symbolic Precedence)**
  *   **The Phenomenon:** Practices often become socially impossible because their *aesthetics* become ridiculous before their *ethics* are refuted. The moral language is retrofitted to justify a shift in taste.
  *   **The Requirement:** The theory must account for causality running from *symbol* to *substance*. It must explain how a coat, a gesture, or a form of address can render a practice untenable prior to the formulation of a principled argument against it.
  *   **Philosophical Anchor:** This aligns with **Bernard Williams's** skepticism regarding rational reflection. It posits that "thick" ethical concepts (shame, ridicule, style) precede "thin" moral judgments (right, wrong).
  *   **Implication:** A theory that places moral argument as the *primary* engine of change fails this constraint.

  **3. The Mechanism Distinction Principle**
  *   **The Phenomenon:** Moral entrepreneurs speak the language of argument; participants act according to honor; institutions shift according to interest.
  *   **The Requirement:** The theory must distinguish between:
      1.  **Moral Argument:** Propositional claims about justice or rights.
      2.  **Honor Restructuring:** Changes in what confers status or shame (per **Appiah**).
      3.  **Material Interest:** Changes in cost, profit, or utility.
  *   **The Constraint:** These mechanisms cannot be collapsed into one another (e.g., arguing that honor is *just* a form of long-term interest). They must be treated as distinct levers that may pull in the same or opposite directions.

  #### II. Camp Preferences
  *These are theoretical leanings. A theory may choose one side, but must acknowledge the trade-off.*

  **4. The Tempo Mismatch (Rapid Collapse vs. Slow Erosion)**
  *   **The Phenomenon:** Normative consensus can shatter overnight (a practice becomes "unthinkable"), while institutional machinery (laws, labor markets) grinds down slowly.
  *   **The Preference:** A Williams-adjacent theory prefers the *rapid collapse of the social script* as the primary event, viewing institutional erosion as cleanup. A Materialist theory prefers the *slow erosion* as the cause, viewing normative collapse as the lagging indicator.
  *   **Novelist's Utility:** Prefer the Williams/Appiah weighting if the focus is on the drawing room; prefer the Materialist weighting if the focus is on the ledger.

  **5. The Elite-Mass Divergence**
  *   **The Phenomenon:** Elites often abandon a practice (dueling, slave-owning) for status signaling before the masses adopt the moral reasoning behind the abandonment.
  *   **The Preference:** An Appiah-heavy theory views this as *honor cascades* (elites set the fashion of virtue). A Rationalist theory views this as *trickle-down enlightenment* (elites discover truth first).
  *   **Novelist's Utility:** The Honor Cascade model better explains hypocrisy and the persistence of banned practices in private (see below).

  #### III. Jointly Unsatisfiable Pairs
  *A theory cannot hold both members of these pairs simultaneously without contradiction.*

  **6. Rational Primacy AND The Wardrobe Constraint**
  *   **Conflict:** You cannot claim that moral change is driven primarily by the "force of the better argument" while also claiming that practices die because they become aesthetically ridiculous, with arguments invented later.
  *   **Resolution:** To satisfy the Wardrobe Constraint (Non-Negotiable), Rational Primacy must be demoted to a post-hoc rationalization mechanism.

  **7. Monocausality AND The Profit Paradox**
  *   **Conflict:** You cannot claim a single universal driver (e.g., "Capitalism ends slavery") while explaining why dueling (anti-capitalist) ended at the same time.
  *   **Resolution:** To satisfy the Profit Paradox (Non-Negotiable), Monocausality must be abandoned for a pluralistic ecology of motives.

  #### IV. The Persistence of the Shadow
  *   **The Phenomenon:** Banned practices (dueling, clandestine slavery) persist in private long after public condemnation.
  *   **The Requirement:** The theory must explain the *half-life* of a norm. It must distinguish between the *public script* (which changes with the wardrobe) and the *private habit* (which resists). This is where Appiah's honor codes are crucial: honor is public. When the audience leaves, the rule weakens.

  ***

  ### The Single Eliminating Requirement

  The requirement that eliminates the largest share of popular theories is **The Wardrobe Constraint (Symbolic Precedence).**

  **Reasoning:**
  The dominant popular theory of moral progress is **Enlightenment Rationalism**: the belief that humanity improves because we construct better arguments, which persuade individuals, who then change institutions. This view assumes the causal arrow flows *Argument → Conscience → Behavior*.

  The Wardrobe Constraint inverts this arrow: *Behavior/Symbol → Social Script → Moral Argument*.

  By demanding that a theory account for the fact that practices often become *ridiculous* before they become *unjust*, and that moral language is frequently retrofitted to aesthetic shifts, you invalidate the entire "History of Ideas" genre of moral explanation. It renders useless any theory that relies on the premise that people stop doing evil primarily because they have been convinced it is logically inconsistent. It forces the theory to grapple with shame, fashion, and social performance as the primary engines of history, leaving moral philosophy as the stenographer rather than the architect.
