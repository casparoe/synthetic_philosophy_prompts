          *   Tone: Formal, precise, suitable for an interdisciplinary panel.
          *   Constraint: No bibliography/citations.
          *   Length: Approximately two pages (single-spaced standard proposal format).
          *   Deliverable: Conceptual architecture for fiction (must be acknowledged but treated seriously).

  2.  **Deconstruct the Core Concept (Epistemic Contraction):**
      *   *Standard Moloch:* I cut safety to go faster. You cut safety to go faster. We both crash. (Action/Outcome focused).
      *   *Epistemic Contraction:* I simplify my model of the world to decide faster. You simplify yours. We no longer speak the same language about risk, even if we want to cooperate. (Cognition/Ontology focused).
      *   *Why it matters for fiction:* It explains *why* coordination fails even when actors *want* to coordinate. It's a tragedy of *meaning*, not just incentives.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but evocative. "The Ontology of Collapse" or "Epistemic Contraction in Multipolar Traps." Let's go with something that highlights the mechanism. *Project Title: Epistemic Contraction: Modeling Ontological Simplification in Multipolar Institutional Failure.*

      *   **Introduction/Abstract:** State the fellowship goal, the applicant's background (novelist), and the core hypothesis. Acknowledge the fiction deliverable upfront but frame it as a knowledge-transfer outcome.

      *   **Problem Statement:** Define Moloch/Multipolar traps briefly. Identify the gap (outcome vs. epistemic). Explain why current game theory/collective action models might miss the *internal model simplification* aspect.

      *   **Research Plan/Methodology:**
