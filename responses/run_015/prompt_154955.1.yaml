answer: |-
  The consent form lay between them, creased where Marcus had slammed it.

  "'Chance,'" Marcus said, tapping the paper. "It's a lie, Elena. You know it is. In twelve hours, volunteer-Prime wakes up in the villa, and volunteer-Secondary wakes up in bed. Both of them. One hundred percent of the person-moments experience an outcome. There is no chance."

  Elena didn't look up from her tablet. "There is uncertainty from the pre-branch perspective. And there are rational constraints on how she bets on that uncertainty. If she doesn't weight her preferences by the squared amplitude, she's vulnerable to Dutch books. She'll lose money across the multiverse. The Born rule isn't a guess, it's the only coherent strategy."

  "Coherent for who?" Marcus leaned in. "You've smuggled probability into your axioms. 'Indifference to branching,' 'additivity across components.' You built a house that only fits a probability-shaped tenant, then acted surprised when probability moved in. It's circular."

  "It's derivation," Elena snapped. "Look at the geometry. You want to count branches? Fine. In the equal-amplitude case—three outcomes, same weight—counting matches weighting. One-third each. You feel safe there."

  "Because it makes sense."

  "Because you're lazy," Elena said. "Hilbert space doesn't come with a branch counter. It's basis-dependent. I can rotate the vector however I like. The only invariant structure is the norm. The squared amplitude. That's the physics. The rest is your intuition clinging to a single-world ghost."

  Marcus stood up, pacing the sterile office. "So in the uneven case? You set the villa to 0.25. The bed outcomes split into two orthogonal states, 0.375 each. Physically, there are three successors. One villa, two beds. By counting, the chance of the villa is 33%. By your weights, it's 25%. Why should the volunteer care more about the bed versions just because you decomposed the wavefunction differently?"

  "Because the bed versions are *more* of her," Elena said. "Not in number, but in measure. If you ignore the weights, you're saying a branch with amplitude epsilon matters as much as one with amplitude one. That's insane."

  "It's not insane, it's ontology!" Marcus slammed his hand on the desk. "Everything happens. The number 0.25 isn't a frequency of occurrence. It's a measure of how much the pre-branch agent should *care* about the villa successor. It's a weighting of moral significance, not a probability of existence. And your consent form knows it."

  He jabbed a finger at the paper. "This says '25% chance you will wake up in the villa.' That implies exclusivity. It tells the volunteer there's a risk she won't wake up there. But she *will*. Both versions wake up. The form trades on the confusion between 'chance of happening' and 'weight of caring.' It's false advertising."

  Elena finally looked up, eyes cold. "If we write '25% measure of existence,' nobody understands. If we write 'You will definitely wake up in both,' they think it's free money. We use the language of decision theory because that's how agents function. She plans *as if* it's a chance. That makes it functionally true."

  "Functionally true for betting," Marcus said. "Not for consent. You're asking them to sign off on a risk that doesn't exist, based on a number that describes care, not frequency. You're hiding the fact that the 'losing' version still suffers the disappointment of not being in the villa. She doesn't vanish. She wakes up in the beige room. She loses. And you told her there was only a 25% chance of that happening."

  "There is a 25% chance *she* is the one in the villa," Elena insisted. "Indexical uncertainty."

  "There is 100% chance *someone* is her," Marcus countered. "And you're selling her a lottery ticket where every ticket wins, but you charge her for the losers. The math works for your machine. It doesn't work for your ethics."

  Elena opened her mouth, then closed it. The silence hummed like the cooling fans outside.

  Verdict: Marcus won the argument because he successfully separated the physical ontology from the semantic contract, proving the form exploited linguistic ambiguity rather than describing objective risk.
