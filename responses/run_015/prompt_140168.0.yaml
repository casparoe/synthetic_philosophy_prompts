prompt: |-
  hey — I'm taking a philosophy of science seminar this semester (Popper, Lakatos, a little Kuhn, and one whole session on whether Malthus was just early rather than wrong), and I also help run the campus forecasting club. We keep a public spreadsheet of about 200 long-range predictions that members have logged since 2016, horizons anywhere from three to thirty years. Twice a semester we have a triage night where ten or so of us go through the unresolved entries and decide, for each one: leave it on the board, extend it with a new deadline, or retire it as busted. Right now it is pure vibes and whoever made the prediction argues the loudest. I want an actual procedure we can run, and I want you to build it around a distinction my TA threw out that I can't stop thinking about (more on that below).

  What I need from you:

  A triage procedure with the questions in order, what counts as an adequate answer to each one, where it stops with a no, and where it hands the decision to a vote because it's really a question about how patient we want to be rather than a question of fact. It has to be runnable in about ten minutes per prediction by undergrads with one shared spreadsheet and no statistics beyond what a spreadsheet does natively. Decisions are public and they stick for a year, so there's some mild reputational sting, and people show up defensive about their own entries — tell me how to structure the run so that the person applying the procedure is not the person who logged the prediction, and what to do when we simply can't get a number for the key variable because there's no public data series.

  The part I actually care about is what makes an extension legitimate (right but early) versus just moving the goalposts. Here is the idea I want built in: a rescue can have its own expiry date. If the only reason a prediction hasn't come true is an offsetting mechanism that is itself temporary or exhaustible — industrial nitrogen fixation and cheap fossil energy masking a Malthusian land constraint, say, or a one-shot demographic dividend propping up a growth forecast — then the extension should not be open-ended; it should be bounded by the remaining life of the rescue, and the club should have to say what would tell us the rescue is running out. That's very different from a delay that the theory's own mechanism explains, where the mechanism is real but just running slower than anyone guessed, and extending is cheap. Give me the tests that separate those two, plus a rule for setting the new deadline in the first kind of case, and a rule for the intake end too: when someone logs a new prediction, the deadline should be derived from the timescale of the mechanism they're invoking, not picked because it sounds far enough away.

  Then run it on three of our real entries.

  1. Malthus 2.0, logged 2017: global per-capita calorie production peaks before 2040, and at least one famine with over a million deaths before 2035, on the mechanism that arable land is fixed, yield gains are roughly linear, and demand compounds. Some indicators are drifting their way (yield growth flattening in a few regions) and some are not. It hasn't failed yet on its own terms.

  2. Peak Attention, logged 2015: average daily minutes on social platforms for US adults would peak by 2021 and fall at least 20% by 2025, because attention is a fixed budget and platforms hit a satiation ceiling. It has gone the other way, and every year somebody rescues it by changing what counts as a platform. I think this should be retired and I want to see whether the procedure agrees or tells me I'm being impatient.

  3. The one we'll all hate: our all-time most upvoted entry, from 2021, something like algorithmic feeds will destroy shared reality in the US by 2030. Everybody loves it, it gets re-upvoted every semester, and nobody can say what would count as it happening. If the procedure says operationalize it in 30 days or retire it, tell me that straight, and tell me what a fair operationalization would even look like here.

  Finally, be honest about which steps of the procedure are judgment calls in a lab coat, what will predictably go wrong the first night we run it, and what this kind of procedure just can't do — I assume there's some part of the right but early question that no checklist settles. We've got two triage nights left this semester and I'd rather bring something imperfect than another vibes session.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**

      *   **Context:** Philosophy of science seminar (Popper, Lakatos, Kuhn, Malthus) + Campus Forecasting Club.
      *   **Task:** Create a triage procedure for evaluating ~200 long-range predictions (3-30 year horizons).
      *   **Current State:** "Pure vibes," loudest voice wins, defensive predictors.
      *   **Requirements:**
          *   Runnable in ~10 mins/prediction by undergrads.
          *   Tools: Shared spreadsheet, native functions only (no complex stats).
          *   Roles: Predictor cannot evaluate their own prediction.
          *   Handling missing data: What to do when no public data series exists.
          *   Core Philosophical Distinction (The "TA's Idea"): Distinguish between "Right but Early" (mechanism delayed but intact) vs. "Moving Goalposts" (ad hoc rescue).
          *   Specific Rule for Extensions: If relying on a temporary "rescue" (offsetting mechanism), the extension must be bounded by the life of that rescue + indicators of exhaustion. If relying on the core mechanism slowing down, extension is cheaper.
          *   Intake Rule: New predictions must have deadlines derived from mechanism timescales, not arbitrary dates.
          *   Application: Run the procedure on three specific cases (Malthus 2.0, Peak Attention, Shared Reality).
          *   Meta-Analysis: Admit limitations, judgment calls, and predicted failure modes.

  2.  **Deconstruct the Philosophical Core (Lakatos/Popper/Kuhn):**

      *   *Popper:* Falsifiability. If it can't be proven wrong, it's not science.
      *   *Lakatos:* Research Programmes. Core heuristic (untouchable) vs. Protective Belt (adjustable auxiliary hypotheses). A programme degenerates if it only makes ad hoc adjustments to save the core without new predictive power.
      *   *The TA's Distinction:* This is essentially Lakatosian.
          *   *Legitimate Extension:* The core mechanism is still operating, just slower (e.g., diffusion of innovation takes longer).
          *   *Illegitimate Rescue (Ad Hoc):* Introducing a new, temporary factor to explain away failure without independent testability (e.g., "It would have happened, but X intervened temporarily").
          *   *Constraint:* If you invoke a temporary rescue, the new deadline *must* align with the expiration of that rescue.

  3.  **Drafting the Procedure (The "Triage Protocol"):**

      *   *Structure:* Needs to be a flowchart or step-by-step checklist.
      *   *Roles:* Facilitator (neutral), Scribe (updates sheet), Predictor (defends, doesn't decide), Evaluators (group).
      *   *Time Limit:* 10 minutes means strict gating.
      *   *Step 1: Operationalization Check.* Is it testable? (Popper). If no -> Retire or Fix.
      *   *Step 2: Status Check.* Has the deadline passed? Is the condition met?
      *   *Step 3: The "Rescue" Test (The Core).* If it hasn't happened, why?
          *   Option A: Mechanism is slow (Legitimate Delay).
          *   Option B: Mechanism is blocked by temporary factor (Bounded Rescue).
          *   Option C: Mechanism is wrong/Definition shifted (Degenerative/Retire).
      *   *Step 4: Setting the New Deadline.* Based on mechanism timescale or rescue expiry.
      *   *Step 5: Vote.* Only on "Patience" (how much slack to give the mechanism), not on facts.

  4.  **Refining the "Rescue" Logic:**

      *   *Test 1: Independent Existence.* Does the offsetting mechanism (the "rescue") exist independently of the prediction? (e.g., Green Revolution existed regardless of Malthus).
      *   *Test 2: Exhaustibility.* Can we define when the rescue runs out? (e.g., Fossil fuels are finite).
      *   *Test 3: Indicator.* What metric shows the rescue is weakening?
      *   *Rule:* If Rescue = Yes, New Deadline = Current Date + (Rescue Life Remaining). If Rescue = No (just slow mechanism), New Deadline = Current Date + (Original Mechanism Timescale buffer).

  5.  **Addressing Data Gaps:**

      *   If no public data series: The prediction is effectively untestable.
      *   *Solution:* Proxy variables or "Shadow Metric." If no proxy exists, it must be retired or operationalized immediately.

  6.  **Developing the Intake Rule:**

      *   No "Year 2050" because it sounds cool.
      *   Must state: Mechanism -> Timescale -> Deadline.
      *   Example: "Diffusion of tech" -> S-curve adoption -> 15 years.

  7.  **Running the Cases:**

      *   *Case 1: Malthus 2.0.*
          *   Mechanism: Land fixed, yield linear, demand compound.
          *   Status: Not peaked yet.
          *   Rescue: Tech (nitrogen/GMOs). Is it temporary? Debatable.
          *   Verdict: Legitimate extension *if* bounded by yield growth rates.
      *   *Case 2: Peak Attention.*
          *   Mechanism: Fixed budget/satiation.
          *   Status: Failed (went up, not down).
          *   Rescue: Redefining "platform."
          *   Verdict: Ad hoc. Degenerative. Retire.
      *   *Case 3: Shared Reality.*
          *   Mechanism: Algorithmic feeds.
          *   Status: Vague ("destroy").
          *   Verdict: Unfalsifiable. Operationalize or Retire.

  8.  **Meta-Analysis (Honesty Check):**

      *   What are the judgment calls? Determining if a rescue is "temporary" vs. "structural."
      *   What will go wrong? Predictors will game the "mechanism timescale." Groupthink.
      *   What can't it do? Settle truth. It only manages the *process* of falsification.

  9.  **Review against Constraints:**

      *   10 mins/prediction? Yes, if strict gating.
      *   Spreadsheet native? Yes, simple columns.
      *   Predictor not evaluating? Yes, role assignment.
      *   TA's distinction included? Yes, central to Step 3.
      *   Intake rule included? Yes.
      *   Three cases run? Yes.
      *   Honest limitations? Yes.

  10. **Final Polish:** Tone should be academic but practical (undergrad friendly). Use Lakatosian terminology lightly but clearly. Ensure the "Rescue Expiry" rule is prominent. (Self-Correction: Make sure the "Vote" section is clearly distinguished from the "Fact" section to avoid democratic falsification).

  11. **Drafting the Response:** (Proceeding to generate output based on these thoughts). *Wait, one detail to check:* The prompt asks for "where it stops with a no, and where it hands the decision to a vote." I need to make sure the flowchart clearly demarcates Objective Gates vs. Subjective Votes.

      *   *Objective Gates:* Operationalization, Data Availability, Rescue Independence.
      *   *Subjective Vote:* How much slack to give the mechanism (Patience).

      *Let's refine the "Rescue" rule.* If the rescue is "industrial nitrogen," the expiry isn't necessarily when nitrogen runs out, but when yield gains *from* nitrogen plateau. The indicator needs to be specific.

      *Let's refine the "Shared Reality" case.* "Destroy" is the problem. Needs a metric like "polling agreement on basic facts" or "media fragmentation index."

      *Let's refine the "Intake".* Needs a specific column in the spreadsheet: "Mechanism Timescale Justification."

      *Okay, ready to write.*
answer: |-
  This is a Lakatosian problem disguised as an administrative one. Your TA is pointing at the distinction between a **progressive research programme** (where adjustments lead to novel predictions) and a **degenerating one** (where adjustments are purely defensive ad hocery).

  Below is the **Forecast Triage Protocol (FTP)**. It is designed to be run on a projector with your shared spreadsheet open. It separates *falsification* (facts) from *patience* (judgment).

  ### Part 1: The Roles & Setup
  To prevent defensive lobbying, roles are assigned at the start of the night. No one evaluates their own prediction.

  *   **The Facilitator:** Keeps time (10 mins hard stop), enforces the script.
  *   **The Scribe:** Updates the spreadsheet columns.
  *   **The Predictor:** (The person who logged the entry). Allowed 2 minutes to present context. **No voting rights on their own entry.**
  *   **The Jury:** Everyone else. Votes only on specific "Patience Questions."

  **Spreadsheet Columns Needed:**
  Add these columns to your existing sheet: `Status` (Active/Retired/Extended), `Mechanism`, `Rescue Hypothesis` (if any), `Rescue Expiry`, `Falsification Condition`, `Next Review Date`.

  ---

  ### Part 2: The Triage Procedure (10 Minutes Per Entry)

  Run these steps in order. If an entry fails a "Gate," it stops there.

  #### Step 1: The Popper Gate (Operationalization)
  **Question:** Is there a publicly available data series or binary event that settles this *today*?
  *   **Adequate Answer:** "Yes, we can check World Bank data for X," or "Yes, we can search news archives for Y event."
  *   **The "No" Stop:** If the answer is "It's a vibe" or "You'll know it when you see it," the entry is **Retired: Unfalsifiable**.
  *   **The Fix:** If the Jury votes (simple majority) that the idea is valuable but vague, the Predictor has 30 days to submit a specific `Falsification Condition`. If they don't, it is retired.
  *   **Missing Data:** If no public data series exists, is there a **Proxy**? (e.g., no "shared reality" metric, but maybe "partisan polarization index"). If no proxy exists, **Retire: Untestable**.

  #### Step 2: The Status Check (Fact)
  **Question:** Has the deadline passed, and is the condition met?
  *   **Adequate Answer:** "Deadline was 2020. Condition was X. Data shows Not-X."
  *   **If Met:** Mark **Resolved: True**.
  *   **If Failed:** Mark **Resolved: False**.
  *   **If Pending:** Proceed to Step 3.

  #### Step 3: The Lakatos Test (The Rescue)
  *This is the core distinction your TA raised.*
  **Question:** The prediction hasn't come true yet. Why?
  *   **Option A (Mechanism Delay):** The core mechanism is real but slower than expected. (e.g., "Tech adoption follows an S-curve, we guessed the steep part wrong.")
  *   **Option B (Offsetting Rescue):** An external, temporary factor is blocking the mechanism. (e.g., "Malthus was right, but the Green Revolution paused it.")

  **The Test for Option B (Rescue):**
  To claim Option B, you must answer three sub-questions. If you cannot, you default to Option A or Retire.
  1.  **Independence:** Did this rescue factor exist independently of this prediction? (You can't invent a rescue just to save the prediction).
  2.  **Exhaustibility:** Is the rescue finite? Can we name when it runs out?
  3.  **Indicator:** What metric tells us the rescue is weakening?

  **Decision Logic:**
  *   **If Option A (Delay):** Extension is "cheap." New Deadline = Current Date + (Original Mechanism Timescale Buffer). *Vote required on patience (see Step 4).*
  *   **If Option B (Rescue):** Extension is "expensive/bounded." New Deadline = **Rescue Expiry Date**. *No vote on date, only on whether the Rescue is valid.*
  *   **If Neither (Goalpost Shift):** e.g., changing the definition of "platform" or "famine" to avoid failure. **Retire: Degenerative.**

  #### Step 4: The Patience Vote (Judgment)
  *Only reached if Step 3 allows an extension.*
  **Question:** "Given the mechanism is intact, how much slack do we give it?"
  *   **Procedure:** Jury votes on a multiplier for the remaining time (0.5x, 1x, 2x).
  *   **Constraint:** You cannot vote to extend beyond the `Rescue Expiry` if Step 3 identified a Rescue.
  *   **Outcome:** Scribe logs `Next Review Date`.

  ---

  ### Part 3: Intake Rule (For New Predictions)
  When logging a *new* prediction, the `Deadline` cannot be arbitrary.
  *   **Rule:** `Deadline` = `Log Date` + `Mechanism Timescale`.
  *   **Requirement:** The `Mechanism` column must explain the timescale.
      *   *Bad:* "AI will take jobs by 2035." (Why 2035?)
      *   *Good:* "AI will take jobs by 2035. Mechanism: Corporate procurement cycles average 5 years; deployment 3 years; regulatory lag 2 years. Total 10 years from 2025 trigger."
  *   **Enforcement:** Facilitator rejects intake if the timescale justification is missing.

  ---

  ### Part 4: Running the Procedure on Your Entries

  Here is how the FTP handles your three specific cases.

  #### 1. Malthus 2.0 (Logged 2017)
  *   **Prediction:** Per-capita calorie production peaks <2040; 1M+ famine <2035.
  *   **Step 1 (Popper):** **Pass.** FAO data exists for calories; EM-DAT for famine deaths.
  *   **Step 2 (Status):** **Pending.** Deadlines not reached.
  *   **Step 3 (Lakatos):**
      *   *Mechanism:* Land fixed, yield linear, demand compound.
      *   *Observation:* Yield growth flattening in some regions, but global aggregate still up.
      *   *Rescue Hypothesis:* Industrial nitrogen/GMOs/Trade are offsetting land constraints.
      *   *Test:* Is the rescue exhaustible? **Yes.** Yield gains from nitrogen show diminishing returns. Trade is vulnerable to fragmentation.
      *   *Indicator:* Annual yield growth rate % (must track if it approaches 0).
      *   *Verdict:* **Legitimate Rescue.** This is not a goalpost shift; it is a recognized offsetting variable.
  *   **Step 4 (Deadline):**
      *   Do not just push to 2050.
      *   **New Rule:** Set `Rescue Expiry` based on agronomy models (e.g., "When yield growth < 0.5% for 5 consecutive years").
      *   **Action:** Keep Active. Add column `Rescue Indicator: Global Yield Growth %`. Review when indicator triggers.

  #### 2. Peak Attention (Logged 2015)
  *   **Prediction:** US adult daily mins peak 2021, fall 20% by 2025.
  *   **Step 1 (Popper):** **Pass.** Nielsen/AppAnnie data exists.
  *   **Step 2 (Status):** **Failed.** 2021 passed, usage did not peak. 2025 approaching, no 20% fall.
  *   **Step 3 (Lakatos):**
      *   *Mechanism:* Fixed attention budget / satiation.
      *   *Rescue Attempt:* "We changed what counts as a platform (added TikTok/Shorts)."
      *   *Test:* Is this a Rescue or a Goalpost Shift? **Goalpost Shift.** The original prediction implied "Social Platforms (2015 definition)." Expanding the definition to include new formats *after* the failure to capture the growth is ad hoc.
      *   *Alternative:* Is the mechanism just slow? No, the direction is wrong (up, not down).
      *   *Verdict:* **Retire: Degenerative.** The "fixed budget" theory is currently falsified by the data.
  *   **Outcome:** Move to `Retired`. Predictor can log a *new* entry with a new mechanism (e.g., "Attention fragments rather than peaks"), but this entry is dead.

  #### 3. Shared Reality (Logged 2021)
  *   **Prediction:** Algorithmic feeds destroy shared reality in US by 2030.
  *   **Step 1 (Popper):** **Fail.**
      *   *Question:* What counts as "destroy"? What counts as "shared reality"?
      *   *Answer:* None provided. "Everybody knows it when they see it."
      *   *Verdict:* **Retired: Unfalsifiable.**
  *   **The Fix (30 Day Challenge):**
      *   To revive, Predictor must define `Falsification Condition`.
      *   *Fair Operationalization:* "The correlation between partisan identity and belief in 10 baseline factual statements (e.g., unemployment rate, inflation) exceeds 0.8," OR "A specific polling gap on a verifiable event exceeds X%."
      *   *Mechanism Timescale:* Why 2030? If the mechanism is "algorithmic optimization," the timescale should be tied to adoption rates of specific feed technologies.
      *   *Instruction:* If you cannot define the metric in 30 days, it stays retired. No amount of upvotes saves an unfalsifiable claim.

  ---

  ### Part 5: Honest Limitations & Failure Modes

  You asked for honesty about where this breaks. Here is where the "judgment calls in a lab coat" happen.

  **1. The "Temporary" Trap (Judgment Call)**
  In the Malthus case, we decided the Green Revolution was a "temporary rescue." But what if it isn't? What if lab-grown meat makes land constraints irrelevant forever?
  *   *Risk:* The Jury might treat a structural shift as a temporary rescue to be nice to the Predictor.
  *   *Mitigation:* Require the `Rescue Expiry` to be tied to a *physical* limit (e.g., phosphorus reserves) not a *theoretical* one. If the rescue is "human ingenuity," that is not a valid rescue for FTP purposes; it's a belief, not a mechanism.

  **2. The Mechanism Timescale Game (Predictable Failure)**
  Predictors will game the Intake Rule. They will invent complex mechanisms to justify a 30-year horizon because they want to be "visionary."
  *   *Risk:* "The mechanism is cultural osmosis, which takes 50 years."
  *   *Mitigation:* The Jury must challenge the *timescale justification* during intake. If the mechanism is "policy change," the timescale must match legislative cycles (2-4 years), not generations.

  **3. Democratic Falsification (What this can't do)**
  This procedure cannot determine truth. It only manages *consensus on process*.
  *   *Limitation:* If the Jury votes to extend a busted prediction because they like the Predictor, the procedure fails.
  *   *Hard Truth:* You need a "Sheriff." One person (maybe you) with veto power if the Jury is clearly violating Step 3 (e.g., accepting a Goalpost Shift as a Rescue).

  **4. The Data Gap**
  You asked what to do when there's no public data.
  *   *Procedure:* **Retire.**
  *   *Reasoning:* A prediction without a data series is a prophecy. If you keep it, you turn the club into a debate society. The "Shadow Metric" rule is your only lifeline. If no proxy exists, the prediction is premature.

  ### Summary for your Seminar
  This protocol operationalizes Lakatos.
  *   **Hard Core:** The mechanism (protected).
  *   **Protective Belt:** The deadlines and definitions (adjustable).
  *   **Degeneration:** When the belt adjustments (rescues) don't generate new testable indicators (expiry dates).

  Run this for two nights. You will likely retire 20% of your sheet immediately (Unfalsifiable), resolve 10% (Failed/Passed), and fight over the 10% that are "Right but Early." That fight is where the actual philosophy happens.
