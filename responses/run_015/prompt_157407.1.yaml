answer: |-
  The Clinton administration's refusal to invoke the term genocide was legally defensible under the narrow 1948 Convention definition but morally indefensible given the scale of physical destruction, while the colonial construction of Hutu and Tutsi identities presents a sociological complexity that does not negate their status as protected groups under settled international legal precedent. Under Raphael Lemkin's 1944 conceptual framework in *Axis Rule in Occupied Europe*, genocide encompassed both the physical destruction of a group and the disintegration of its political and social institutions, meaning the administration's lexical avoidance cannot be justified by Lemkin's original criteria. The mass killings in Rwanda satisfy Lemkin's criteria for physical and biological destruction, a conclusion supported by the settled historical record of approximately 800,000 deaths targeted primarily at Tutsi civilians within a hundred-day period. The administration's avoidance relied not on Lemkin's broader sociological definition but on the narrower legal threshold of the 1948 Convention, which required specific intent to destroy a group in whole or in part. Regarding the framing injected about administrative-racial categories, it is a settled historical record that Belgian colonialism rigidified Hutu and Tutsi distinctions through identity cards and administrative preference, but the claim that this complicates their identification as a protected group is a contested sociological interpretation rather than a legal reality. The International Criminal Tribunal for Rwanda (ICTR) subsequently settled this legal question by ruling that Tutsi constituted a protected ethnic group under the Convention, regardless of colonial origins, thereby invalidating the administrative-racial argument as a barrier to classification under Lemkin's sense of a "national group."

  Lemkin's original intent included political groups, but their exclusion from the 1948 Convention text created a loophole the U.S. exploited to classify the violence as civil war rather than genocide, rendering the U.S. legal calculus structurally rational within the confines of the treaty text rather than merely cowardly. This rationality depends on the contested interpretation that the primary intent was military victory rather than group destruction, yet State Department records confirm officials avoided the term to evade the Convention's obligation to "prevent and punish," indicating the legal rationality was a pretext for political inaction. The simultaneous killing of Hutu civilians by the Rwandan Patriotic Front introduces a complexity Lemkin's unitary perpetrator-victim model struggles to accommodate in civil war contexts, creating a problem of selective application. However, characterizing this as a failure of Lemkin's concept depends on the contested view that bilateral violence negates unilateral genocidal intent; the ICTR maintained that the scale and specific intent of the Interahamwe campaign distinguished it from RPF reprisals. Therefore, the selective application problem reflects political choices in enforcement rather than a definitive collapse of Lemkin's conceptual framework, and the exclusion of political groups remains a settled feature of the Convention that enabled the U.S. position.
