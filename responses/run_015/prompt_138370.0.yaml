answer: |-
  **Project Title:** The Indeterminacy of Decline: Reference Class Forecasting and the Durability of Hegemonic Polities

  **Research Question**
  When analysts use the "outside view" to forecast the durability of a hegemonic polity, how much of the variance between declinist and optimistic predictions is produced by methodological indeterminacy rather than substantive disagreement about the world? Standard reference class forecasting treats the selection of a reference class, the measurement of elapsed time, and the definition of termination as technical execution problems. This project argues they are conceptual indeterminacies that generate systematic bias. Specifically, I investigate *retroclassification bias*: the tendency for reference class membership to be an artifact of the outcome. Polities that last long enough and end memorably are coded as "empires" or "hegemons"; those that fail quickly are re-described as raids, kingdoms, or interregna. Consequently, the sample from which base rates are computed is selected on the dependent variable. This project asks: Can we quantify the uncertainty introduced by these classification choices, and does doing so yield a forecast interval wide enough to discipline confidence rather than predict specific outcomes?

  **Theoretical Intervention**
  This proposal bridges the divide between proponents of quantitative historical forecasting and historical institutionalists who view such exercises as hopeless. Enthusiasts of base-rate forecasting assume that reference classes are stable natural kinds; they argue that disagreement arises from poor execution or insufficient data. Conversely, historical skeptics argue that polities are unique configurations, making aggregation meaningless. Both positions leave the mechanics of classification unexamined. By isolating the *Clock* (when timing begins), *Endpoint* (what constitutes death), and *Vantage-Truncation* (data availability at time *t*) problems, I demonstrate that the "base rate" is not a fixed quantity but a moving target dependent on coding choices.

  The core contribution is the fourth problem: retroclassification bias. If the definition of "empire" requires a certain duration to qualify, survival is baked into the sampling frame. This is distinct from standard survivorship bias; it is a semantic selection effect. By reconstructing forecasts from multiple historical vantage points, I will measure how much the base rate shifts when these four indeterminacies are varied. If the spread between a "declinist" clock (e.g., time since last expansion) and an "optimist" clock (e.g., time since founding) exceeds the variance explained by geopolitical covariates, then the primary value of the outside view is not prediction, but the calibration of uncertainty.

  **Methodology and Data**
  The project utilizes a register of approximately forty large, hegemonic polities coded from English-language reference works. I acknowledge the limitation of N=40 and the heterogeneity of cases (e.g., comparing Rome to the British Empire). However, since the goal is to measure the sensitivity of forecasts to classification rules rather than to estimate a causal effect, precision in individual case coding is less critical than consistency in applying alternative coding rules. The analysis does not rely on archival depth but on the structural comparison of how cases are categorized under different definitions.

  To validate the method, I will employ a backtesting protocol. I will reconstruct the information set available to a well-informed analyst at three historical vantage points (e.g., 1900, 1950, 1990). At each vantage point, I will generate forecasts for the survival of extant polities using the varying reference class definitions. These forecasts will be scored against actual historical outcomes using a Brier score to measure calibration and resolution. This protocol would be worthless if the historical record were too sparse to establish a counterfactual outcome at the vantage point, or if the "actual outcome" (e.g., the dissolution of the USSR) is itself subject to the same endpoint indeterminacy I am critiquing. To mitigate this, I will use a binary survival metric (regime continuity vs. discontinuity) that is less contestable than ideological decline.

  **Twelve-Month Plan**
  *Months 1-3:* Finalize the register of forty cases. Code each case for the four indeterminacies (Clock, Endpoint, Vantage, Classification) to create a matrix of possible reference classes.
  *Months 4-6:* Develop the backtesting simulation. Construct the "information sets" for the three historical vantage points, ensuring no look-ahead bias.
  *Months 7-9:* Run the forecasting simulations. Calculate base rates for each variation of the reference class definition. Compute the variance attributable to methodological choices versus case specifics.
  *Months 10-12:* Draft the dissertation chapter and a companion article. Focus on the deliverable: a "Reference Class Audit" tool for practitioners.

  **Alternatives and Justification**
  Three obvious alternatives exist, but each fails to address the specific mechanism of bias identified here. First, deeper case studies would improve coding accuracy for individual polities but would not resolve the structural problem that the sample itself is selected on duration. Second, a formal model of imperial decline would require assumptions about hazard rates that presuppose the very clock and endpoint definitions this project questions. Third, a survey of expert forecasts would capture existing bias but could not disentangle whether disagreement stems from worldviews or from the hidden indeterminacies of the outside view. This project is distinct because it treats the forecasting *method* as the object of study, not the polities themselves.

  **Deliverable and Failure Conditions**
  The deliverable for a practitioner (e.g., an intelligence analyst or policy planner) is not a point estimate of regime survival. It is a "discipline on confidence." If the project succeeds, it will produce a confidence interval for hegemonic durability that is significantly wider than standard models suggest, driven by the range of plausible reference class definitions. This functions as a warning against over-precision in strategic planning.

  I must offer an honest account of failure. The project fails if the variance introduced by the four indeterminacies is negligible compared to the variance explained by substantive covariates (e.g., economic growth, military capacity). If changing the "clock" from founding to primacy alters the survival probability by less than 5%, then the conceptual critique is philosophically interesting but empirically irrelevant. Furthermore, the project fails if the N=40 register proves too heterogeneous to sustain any coherent base rate, resulting in a confidence interval so wide (e.g., 0% to 100% survival) that it offers no disciplinary value. In this scenario, the wide interval would be a disguised admission of defeat rather than a substantive finding. Finally, the design is explicitly neutral regarding any present-day order. If the framing inadvertently privileges a specific contemporary target (e.g., designing the "Clock" problem to fit the US or China), the methodology is compromised. The protocol must apply equally to any hegemon, past or present, to remain valid.
