prompt: |-
  Hi — I'm on the naming committee at a small atrocity-remembrance museum (we write the wall texts and the annual statement) and we've boxed ourselves in, so I wanted an outside read before the next meeting.

  Our record so far: Srebrenica 1995 — genocide. Herero and Nama 1904–08 — genocide. Yazidis under ISIS, 2014 — genocide, and we explicitly said it didn't matter that the perpetrator wasn't a state. Khmer Rouge — genocide for the Vietnamese and the Cham, but not for the killings of "new people", because our write-up said that was a political category, not a protected one. Canadian residential schools — genocide, but under a separate "cultural genocide" heading, which our charter keeps inside the genocide heading because it says we use the term in Lemkin's broader sense of destroying a group's life, not just the Convention's; nobody ever wrote down how much broader. Holodomor — no, we called it a mass atrocity instead: foreseeable, even welcomed, but not carried out in order to destroy Ukrainians as such. 1944 deportation of the Crimean Tatars — also no: catastrophic and the community was wrecked, but the point was removal, and the group went on existing elsewhere.

  New case, and it isn't historical. A ministry upstream diverts and salinates the water of a delta region inhabited mostly by an ethnic minority with an active separatist movement. It goes out as an irrigation and hydropower scheme, run through a public-private consortium whose water allocations are set by an automated system. Ten years on the delta can't be lived in, the population has scattered into diaspora, the birth rate has collapsed, and fluent speakers of the language are nearly all elderly. Leaked internal documents show the consortium's models forecast that depopulation in detail and logged it as an upside — it ends the separatist pressure — but the operative stated aim was power and cotton, and no individual official can be shown to have adopted the group's destruction as a purpose. Nobody disputes the group is an ethnic minority.

  Do we put genocide on the wall? Which of our own cases is the closest analogue, and if our precedents genuinely don't settle it, what rule would we be committing to by saying yes and what by saying no? I'm less after the correct call than after which rule our seven past decisions are actually consistent with — I think at least two or three fit all of them — and which variant of this case we'd have to imagine for those rules to come apart instead of agreeing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a naming committee at a small atrocity-remembrance museum.
      *   **Task:** They need an outside read on a specific new case (water diversion/salinization leading to ethnic minority displacement/cultural collapse) in light of their past seven decisions.
      *   **Goal:** They are *not* asking for the "correct" moral or legal call on the new case. They are asking for an analysis of the *internal consistency* of their past seven decisions. They want to know what rule(s) those decisions imply, which precedent is the closest analogue, and what committing to "yes" or "no" would mean for their future framework.
      *   **Tone:** Professional, analytical, nuanced, respectful of the gravity of the subject matter (atrocity remembrance), and focused on logic/consistency rather than advocacy.

  2.  **Analyze the Past Seven Decisions (The Data Set):**
      *   *Srebrenica 1995:* Genocide. (State/Para-state actor, intent to destroy physical group).
      *   *Herero and Nama 1904–08:* Genocide. (Colonial state, intent to destroy physical group).
      *   *Yazidis under ISIS 2014:* Genocide. (Non-state actor accepted; intent to destroy physical/religious group).
      *   *Khmer Rouge (Vietnamese/Cham):* Genocide. (Specific ethnic/religious groups targeted).
      *   *Khmer Rouge ("New People"):* Not Genocide. (Political group excluded; aligns with UN Convention, excludes Lemkin's broader political scope).
      *   *Canadian Residential Schools:* Genocide (Cultural). (Justified by Lemkin's broader sense in charter, despite UN Convention limitations on cultural genocide. Key: Destruction of group *life/continuity*, not just mass killing).
      *   *Holodomor:* Not Genocide (Mass Atrocity). (Foreseeable death, but lack of specific intent to destroy Ukrainians *as such* vs. class/political repression/collectivization goals).
      *   *Crimean Tatar Deportation 1944:* Not Genocide (Mass Atrocity). (Removal/destruction of community in place, but group continued existing elsewhere. Intent was removal, not biological/cultural destruction *per se*).

  3.  **Analyze the New Case:**
      *   **Action:** Water diversion/salinization by Ministry + Private Consortium.
      *   **Target:** Ethnic minority (separatists).
      *   **Outcome:** Region uninhabitable, diaspora, birth rate collapse, language death imminent.
      *   **Intent/Mens Rea:** Automated system allocated water. Models forecast depopulation as an "upside" (ends separatism). Operative aim was power/cotton. No individual official adopted group destruction as a *purpose* (dolus directus), but it was foreseen and logged as beneficial (dolus eventualis/indirect intent?).
      *   **Key Tension:** Structural/algorithmic harm vs. specific intent. Cultural/physical destruction via environmental means vs. direct killing.

  4.  **Identify the Underlying Rules/Frameworks:**
      *   *Rule A (Strict UN Convention):* Requires specific intent (dolus specialis) to destroy a national, ethnical, racial, or religious group *in whole or in part*. Excludes political groups. Excludes cultural genocide (usually).
      *   *Rule B (Lemkinian/Charter Hybrid):* Allows "cultural genocide" (Residential Schools). Allows non-state actors (Yazidis). Excludes political groups (Khmer Rouge "New People").
      *   *Rule C (Intent vs. Outcome):* Holodomor and Crimean Tatars were excluded because the *purpose* wasn't destruction *as such*, even if death/displacement occurred. This suggests a high bar for intent.
      *   *Rule D (Physical vs. Cultural Existence):* Residential Schools counted despite lack of mass killing because group *continuity* was destroyed. Crimean Tatars didn't count because group *continued* elsewhere.

      *Synthesis of the Museum's Actual Practice:*
      1.  **Protected Groups:** Ethnic, Religious, National. (No Political).
      2.  **Actors:** State or Non-State (ISIS).
      3.  **Acts:** Killing OR Cultural Destruction (Residential Schools), BUT...
      4.  **Intent:** Must be to destroy the group *as such*. (Holodomor & Crimean Tatars failed here).
      5.  **Continuity:** If the group survives elsewhere (Crimean Tatars), it weakens the claim. If the group's continuity is broken (Residential Schools), it strengthens it.

  5.  **Evaluate the New Case against the Framework:**
      *   *Protected Group:* Yes (Ethnic Minority).
      *   *Actors:* State + Private (Precedent: ISIS = Non-state okay; State okay).
      *   *Acts:* Environmental destruction leading to cultural/biological collapse. (Precedent: Residential Schools = Cultural/Continuity okay).
      *   *Intent:* **The Sticking Point.** The models forecast it as an "upside," but the *operative aim* was cotton/power. No individual adopted destruction as a purpose.
          *   Compare to *Holodomor*: Foreseeable death, welcomed, but purpose was collectivization. Ruling: No.
          *   Compare to *Crimean Tatars*: Removal, community wrecked, but group existed elsewhere. Ruling: No.
          *   Compare to *Residential Schools*: Purpose was assimilation/control, effect was cultural destruction. Ruling: Yes.

      *Crucial Distinction:* In Residential Schools, the *method* was inherently destructive to culture (taking children). In Holodomor, the method was economic policy with lethal side effects. In the New Case, the method is resource extraction with lethal/displacing side effects, *but* the models explicitly logged depopulation as a strategic benefit ("ends separatist pressure").

  6.  **Drafting the Response:**

      *   **Introduction:** Acknowledge the gravity and the specific constraint (consistency check, not moral judgment).
      *   **Deconstruct the Precedents:** Group the 7 cases into their logical drivers.
          *   *The Intent Barrier:* Holodomor & Crimean Tatars (No) vs. Srebrenica/Herero/Yazidis/Khmer (Yes).
          *   *The Group Barrier:* Khmer "New People" (No - Political) vs. Others (Yes - Protected).
          *   *The Mechanism Barrier:* Residential Schools (Yes - Cultural) vs. Convention strictness.
      *   **Identify the Consistent Rule:** The museum seems to follow a "Modified Lemkin" standard.
          1.  Protected groups only (Ethnic, Religious, National).
          2.  Specific Intent required (Dolus Specialis), *but*...
          3.  Intent can be inferred from structural/cultural destruction (Residential Schools) IF the continuity of the group is the target or the inevitable casualty accepted as a goal.
          4.  Survival elsewhere negates it (Crimean Tatars).
      *   **Analyze the New Case:**
          *   Closest Analogue: **Holodomor** (Economic/Infrastructural policy with foreseeable destructive outcomes) OR **Residential Schools** (Long-term cultural/biological erosion).
          *   Why it splits the difference: It looks like Holodomor (resource policy) but acts like Residential Schools (group continuity broken).
          *   The Intent Problem: The leaked docs say depopulation is an "upside." This is closer to *dolus eventualis* (recklessness/acceptance) than *dolus directus* (purpose). The Holodomor decision suggests the museum rejects *dolus eventualis* for genocide (called it "foreseeable, even welcomed, but not... in order to").
      *   **The Decision Tree (Yes vs. No):**
          *   *If Yes:* You are ruling that **foreseen strategic benefit equals specific intent.** You are expanding "intent" to include "accepted side-effect if it aids a strategic goal." You align with Residential Schools (outcome-focused) over Holodomor (intent-focused).
          *   *If No:* You are reaffirming that **structural violence requires a smoking gun of purpose.** You align with Holodomor/Crimean Tatars. You maintain that environmental/economic destruction, even if it kills a group, is "Mass Atrocity" unless the *primary* order was "destroy them."
      *   **The Stress Test (How to break the rules):**
          *   To make the rules come apart, imagine a case where the *method* is cultural (like Residential Schools) but the *group* survives elsewhere (like Crimean Tatars). Or where the *intent* is explicit but the *group* is political.
      *   **Recommendation:** Focus on the "Upside" language in the leaked docs. That distinguishes it from Holodomor ("welcomed" vs "logged as an upside to end pressure").

  7.  **Refining the Output:**
      *   Ensure the tone is appropriate for a museum committee (serious, precise).
      *   Make sure I don't answer "Yes/No" definitively, but rather "If Yes, then X; If No, then Y."
      *   Highlight the tension between *Holodomor* (foreseeable/welcomed = no) and the new case (forecast/upside = ?).
      *   Highlight the tension between *Residential Schools* (cultural destruction = yes) and *Crimean Tatars* (displacement = no).

  8.  **Self-Correction/Nuance Check:**
      *   *Did I read the Residential Schools precedent right?* They used Lemkin's broader sense. This means they *already* deviated from the UN Convention on the "acts" and "intent" regarding cultural destruction.
      *   *Did I read the Holodomor precedent right?* "Foreseeable, even welcomed, but not carried out in order to." This is the key. The new case has documents logging depopulation as an "upside." Is "upside" the same as "welcomed"? Or does "operative aim was power and cotton" save it like Holodomor?
      *   *Crucial distinction:* In Holodomor, the death was a byproduct of collectivization. In the New Case, the depopulation is a *strategic benefit* regarding the separatist movement. This edges closer to "destroying the group as such" because the group's existence is the obstacle to the goal.
      *   *Wait, check Crimean Tatars:* "Group went on existing elsewhere." In the New Case, "population has scattered into diaspora... fluent speakers... nearly all elderly." This implies the group is *not* successfully existing elsewhere as a cohesive unit (language death). This distinguishes it from Crimean Tatars.

  9.  **Final Polish:** Structure clearly with headings. Ensure the "Stress Test" section provides concrete hypothetical variations. (Proceed to generate response).

  *(Self-Correction during drafting)*: I need to be careful not to give legal advice. Frame everything as "internal consistency analysis."
  *(Key Insight)*: The museum's charter explicitly allows Lemkin's broader sense *but* they haven't defined how broad. The Residential Schools decision is the outlier that opens the door, but the Holodomor decision slams the "Intent" door shut. The New Case kicks the Intent door.

  Let's organize the "Rules" clearly.
  Rule 1: Protected Groups (Ethnic/Religious/National OK, Political No).
  Rule 2: Actors (State/Non-State OK).
  Rule 3: Mechanism (Killing OK, Cultural Destruction OK *if* continuity broken).
  Rule 4: Intent (Purpose required. Foreseeable/Welcomed side-effects No).

  The New Case challenges Rule 4 primarily, and Rule 3 secondarily.

  Okay, ready to write.s
answer: |-
  This is a precise and high-stakes consistency check. You are asking for a structural audit of your committee's jurisprudence, not a moral verdict on the new case. Based on the seven precedents you provided, I have mapped the implicit rules your committee is actually following, identified the closest analogue, and outlined the doctrinal commitments required for a "Yes" or "No" verdict.

  ### 1. The Implicit Framework (The "Museum Standard")

  Your seven past decisions do not follow the UN Genocide Convention strictly (you accept non-state actors and cultural genocide), nor do they follow Lemkin strictly (you exclude political groups). You have synthesized a **Modified Lemkin Standard**.

  Here are the four rules that consistently explain your past seven decisions:

  *   **Rule 1 (Protected Groups):** The victim group must be defined by national, ethnical, racial, or religious characteristics. *Political* categories are excluded.
      *   *Evidence:* Khmer Rouge "New People" (No) vs. Khmer Rouge Cham/Vietnamese (Yes).
  *   **Rule 2 (Actors):** The perpetrator can be a state or a non-state organized entity.
      *   *Evidence:* ISIS (Yes) vs. State actors (Yes).
  *   **Rule 3 (Continuity vs. Displacement):** Genocide requires the destruction of the group's *continuity* or *viability*, not just displacement. If the group survives cohesively elsewhere, it is not genocide.
      *   *Evidence:* Crimean Tatars (No, group existed elsewhere) vs. Residential Schools (Yes, group continuity/life destroyed).
  *   **Rule 4 (Specific Intent):** There must be evidence that the destruction of the group was a *purpose* (dolus specialis), not merely a foreseeable or welcomed byproduct of another goal (economic, political, military).
      *   *Evidence:* Holodomor (No, death was foreseeable/welcomed but purpose was collectivization) vs. Srebrenica/Herero (Yes, purpose was destruction).

  ### 2. The New Case: Analysis Against Precedent

  **The Closest Analogue:**
  The new case is a hybrid of **Holodomor** and **Residential Schools**, but it leans most heavily on **Holodomor** regarding intent.

  *   **Like Holodomor:** The operative aim was economic/infrastructural (cotton/power vs. collectivization). The mechanism was structural (water systems vs. grain requisition). The documents show the destruction was forecast and logged as an "upside," but not the *operative aim*. Your Holodomor ruling explicitly rejected "foreseeable, even welcomed" outcomes as insufficient for genocide.
  *   **Like Residential Schools:** The outcome is the erosion of biological and cultural continuity (birth rate collapse, language death) rather than immediate mass killing. Your Residential Schools ruling established that destroying the "life of the group" counts, even without a massacre.
  *   **Unlike Crimean Tatars:** The population has scattered, and the language is dying. The group is *not* successfully existing elsewhere as a cohesive unit. This clears the Rule 3 hurdle that blocked the Crimean Tatar case.

  **The Pivot Point:**
  The deciding factor is the leaked internal documents stating depopulation was logged as an **"upside"** because it **"ends the separatist pressure."**

  In the Holodomor case, you ruled that "welcomed" death was not enough. In this new case, the depopulation is not just welcomed; it is instrumentally valued as a solution to a political problem (separatism). However, the operative aim remains cotton/power.

  ### 3. The Commitments (Yes vs. No)

  If your committee votes, here is the rule you are cementing for future cases.

  #### If you vote YES (It is Genocide):
  You are amending **Rule 4 (Specific Intent)**.
  *   **The New Rule:** "Specific intent" includes situations where the destruction of the group is formally recognized by perpetrators as a strategic benefit ("upside") necessary to secure a political or economic goal, even if it is not the primary stated operational aim.
  *   **The Consequence:** You lower the bar for *dolus specialis*. You are ruling that **structural violence with a documented strategic benefit** counts as genocidal intent. This aligns you more closely with the *Residential Schools* precedent (outcome-focused) than the *Holodomor* precedent (intent-focused).
  *   **Future Risk:** This opens the door to labeling other resource-extraction projects or economic sanctions as genocide if internal documents show officials knew it would depopulate a minority region and considered that a bonus.

  #### If you vote NO (It is Mass Atrocity):
  You are reaffirming **Rule 4 (Specific Intent)** as strict.
  *   **The New Rule:** "Specific intent" requires that the destruction of the group be the *primary purpose* or the *end goal*, not a means to an end (ending separatism) or a side effect of an economic goal (cotton). "Welcomed" or "Strategic Upside" is insufficient without a directive to destroy.
  *   **The Consequence:** You maintain consistency with *Holodomor*. You affirm that environmental or economic destruction, even if it results in the physical dissolution of a group, remains "Mass Atrocity" unless the order was explicitly "destroy them."
  *   **Future Risk:** This creates a "loophole" for algorithmic or bureaucratic genocide. Perpetrators can achieve genocidal outcomes via "automated systems" and "economic aims" without triggering the genocide label, provided they do not write down "destroy the group" as the primary objective.

  ### 4. The Stress Test (Where the Rules Come Apart)

  You asked which variant of this case would make your rules disagree. Your current framework holds together *unless* you encounter a case that splits **Rule 3 (Continuity)** from **Rule 4 (Intent)**.

  **Variant A (The "Successful Diaspora" Test):**
  Imagine the same water diversion, same intent (upside logged), but the ethnic minority relocates *en masse* to a neighboring country, maintains their birth rate, and keeps the language fluent.
  *   *Conflict:* **Rule 3** says No (group survives elsewhere, like Crimean Tatars). **Rule 4** (if you vote Yes on the current case) says Yes (intent was present).
  *   *Resolution:* Your precedents suggest Rule 3 trumps Rule 4. (Crimean Tatars had clear intent to remove/wreck, but got a No because they survived).

  **Variant B (The "Political Group" Test):**
  Imagine the same water diversion, same outcome (group dissolves), but the target is a *political* separatist movement that is multi-ethnic (not an ethnic minority).
  *   *Conflict:* **Rule 1** says No (political group). **Rule 4/3** says Yes (intent to destroy continuity is present).
  *   *Resolution:* Your precedents suggest Rule 1 trumps all. (Khmer Rouge "New People" were destroyed with intent, but got a No).

  **Variant C (The "Smoking Gun" Test):**
  Imagine the same water diversion, but a memo is found saying: "The cotton is secondary; we need to break this people so they stop existing."
  *   *Conflict:* None. This becomes Srebrenica/Herero. It passes Rule 4 easily.

  ### Recommendation for the Meeting

  The tension in your committee likely stems from the conflict between **Holodomor** (foreseeable/welcomed = No) and the new case's **"Upside"** language.

  To maintain consistency with your *Holodomor* decision, you should likely vote **No**, categorizing this as **Mass Atrocity**.
  *   **Reasoning:** In Holodomor, death was "welcomed." In this case, depopulation is an "upside." These are functionally identical regarding *mens rea* (guilty mind). The operative aim in both was economic/structural (collectivization/cotton), not the destruction of the group *as such*. The fact that the group dissolves is the *result*, not the *purpose*.
  *   **Consistency Check:** Voting "Yes" here makes the Holodomor decision look inconsistent (why was "welcomed" death not enough then, but "upside" depopulation enough now?).

  **The Compromise Language:**
  If you vote No, you can strengthen the wall text by explicitly citing the **Residential Schools** precedent to acknowledge the *cultural* destruction, while citing the **Holodomor** precedent to explain why the *intent* threshold for genocide was not met. This honors the severity of the harm without breaking your internal logic on intent.

  **Summary:** Your seven past decisions are consistent under a **Modified Lemkin Standard** that prioritizes **Specific Intent (Purpose)** over **Foreseeable Outcome**. The new case fails the Intent test based on your Holodomor ruling. Voting "Yes" requires you to overrule Holodomor implicitly; voting "No" maintains your established jurisprudence.
