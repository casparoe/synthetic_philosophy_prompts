      *   **Specific Tasks:**
          1.  Reconstruct the implicit theory of the statutes (what do they presuppose about persons, roles, obligation?).
          2.  Identify rival views that are ruled out vs. those that are compatible (underdetermination).
          3.  Analyze the Confucian analogy (where it holds, where it breaks).
          4.  Explore counterfactuals: How would the law change if the justification were purely fiscal (tax/associate liability) vs. thick Confucian ethics (emotional care, reciprocal duties)?
          5.  Maintain neutrality (don't just validate the user's side).

  2.  **Deconstruct the Legal Reality (Filial Responsibility Laws):**
      *   *Status:* Exist in ~30 US states, rarely enforced (except PA, SD, etc., occasionally).
      *   *Trigger:* Parent indigence + need for basic necessities (medical, housing, food).
      *   *Defense:* Often allows for "ability to pay" defenses, sometimes "abandonment" or "neglect" by parent defenses (varies by state).
