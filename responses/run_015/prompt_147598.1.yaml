  3.  **Analyze the "Thin vs. Thick" Distinction:**
      *   *Thin:* You are liable *because* you are the child. It's a status-based tax on lineage.
      *   *Thick:* You are liable *because* being a child entails specific moral performances (xiao).
      *   *Current Law:* It looks "Thin" on the surface (status triggers liability) but lacks the "Thick" moral content (no requirement to love/care). However, the *selection* of children over others suggests a normative link, not just a fiscal one.

  4.  **Evaluate the Confucian Analogy:**
      *   *Hold:* Both ground obligation in status/role rather than contract. Both see the parent-child bond as special/foundational. Both accept that the duty persists regardless of immediate reciprocity.
      *   *Break:* Confucianism emphasizes *affective* care (jing/respect), not just financial. Confucianism is reciprocal (parents must be parents). US law is often unilateral (child pays even if parent was absent, though some states have abandonment clauses). Confucianism is about moral cultivation; US law is about debt collection.

  5.  **Evaluate the Liberal/Fiscal Justification:**
      *   *Argument:* Preventing free-riding on the state. Children are the most likely beneficiaries of inheritance or past investment.
      *   *Counter:* If it's purely fiscal, why not tax income generally? Why target children specifically? This suggests a "familial welfare unit" model common in liberalism (family as private safety net).

  6.  **Drafting the Response - Section by Section:**

