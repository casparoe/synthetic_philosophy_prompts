prompt: |-
  Hi — I've got a slightly odd job and I need something I can actually use day to day.

  I'm the only trained historian on a small team that produces the interpretive material for heritage sites and walking trails across one English county: panels of about ninety words, audio stops, the occasional small exhibition. We turn out roughly fourty items a year. I get around three days of research per item, two weeks at most for anything bigger, and everything has to be signed off by a community liaison officer and then by our trustee commitee. Most of the drafting is done by two junior researchers with history BAs who've never done any theory and don't especially want to.

  The argument we keep having is the old one between history-from-below / microhistory and the history of elites and states — except we have it in a form where somebody has to decide what goes on a panel by Friday. We've shipped both failure modes. One: the item that is basically the archive of the state talking — a mayor, a charter, an act of parliament, a regiment — with the assumption quietly baked in that the document is the event and that its own categories are the categories the people involved used. Two: the item that is one vivid person and a lot of atmosphere, where the vividness is doing all the argumentative work and a single life is being made to carry a claim about ordinary people that it can't carry.

  So: write me a decision procedure my team can run on a proposal. The questions in order; what counts as a sufficient answer to each; where the procedure stops with a no; and where it hands the decision to a person because the question is one of values rather than facts. It needs to be runnable by the juniors in half a day, so rule out anything that depends on months of archival digging, and tell me honestly which steps are judgement calls wearing a lab coat.

  The hard cases it has to handle, because these are the ones that actually come up:

  - The only reason we know a non-elite person's name at all is that a bureaucracy wrote it down for its own purposes — an assize file, a poor-law removal order, a workhouse admission book, a militia list, a tithe map. When is that fatal to the item, when is it survivable, and what has to go on the panel in each case?
  - We almost never know how many other people lived like the one person we happened to find, so "typical" is usually unavailable to us. Which claims does that block, and which claims (if any) survive it? I want this nailed down, because it's the objection I can never answer when a trustee pushes back.
  - Proposals that arrive already framed as celebration: a civic anniversary, a benefactor, a regiment, a great man the town is proud of. Is there a version of the procedure that lets us say yes without lying, and what has to change on the panel if so?
  - Genuinely silent subjects, where the honest panel would be about an absence rather than a person. I don't want the absence turned into a sentimental victim-story either.
  - Scaling: when does a close-up of one household license a sentence about the county, and when does it only license a sentence about that household?
  - A reverse check on me personally. I was trained on policy and state papers, I find elite sources much easier to work with, and I'm slightly suspicious that microhistory is anecdote with footnotes. I want the procedure to catch me defaulting to the sources that are convenient rather than the ones that are right.

  Then run it on three live ones.

  1. An 1840s assize file and a parish relief roll that name the same woman, convicted of stealing bread, plus a bit of local newspaper coverage. I want a panel about hunger and crime in the valley.
  2. A near-complete run of diaries from a tenant farmer, 1867–1901, with rent books and a letter book. The obvious pitch is "the voice of the rural poor" and I don't trust it.
  3. The town council and the local branch of a veterans' association want a mural commemorating the Victorian mayor who paid for the library and the reading room. He was also the magistrate who sentenced the woman in item 1, and we've just found that out.

  At least one of those should come out with an answer I won't like — tell me plainly which one and why rather than softening it, since I'll have to defend it to the council either way.

  Please write it in British English, and give me something I can hand to a twenty-two-year-old on a Tuesday morning, not an essay for me to admire. Finish by saying what the procedure can't do: the situations where it'll misfire, and where it risks giving us false confidence.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** A trained historian leading a small team producing interpretive material (panels, audio, exhibitions) for heritage sites in an English county.
      *   **Team:** Two junior researchers (History BAs, no theory, pragmatic), Community Liaison Officer, Trustee Committee.
      *   **Output Volume:** ~40 items/year.
      *   **Constraints:** 3 days research/item (2 weeks max for big projects). Needs to be runnable by juniors in half a day.
      *   **Core Problem:** Oscillating between "History from Above" (state documents = reality) and "History from Below" (one vivid life = universal truth).
      *   **Deliverable:** A decision procedure (flowchart/checklist style) with questions, sufficient answers, stop points, and value judgement flags.
      *   **Specific Hard Cases to Address:**
          *   Non-elite names in bureaucratic records (fatal vs. survivable).
          *   Typicality (what claims are blocked/allowed without stats).
          *   Celebratory framing (civic anniversaries, benefactors).
          *   Silent subjects (absence vs. sentimental victimhood).
          *   Scaling (household vs. county claims).
          *   Bias check (against the lead historian's elite source bias).
      *   **Test Cases:**
          1.  1840s woman (assize/parish relief/newspaper) -> Hunger/Crime panel.
          2.  Tenant farmer diaries (1867-1901) -> "Voice of rural poor" pitch.
          3.  Victorian Mayor (benefactor + magistrate who sentenced woman in #1) -> Mural.
      *   **Requirement:** At least one test case must yield an uncomfortable "No" or major revision.
      *   **Tone/Style:** British English, practical, actionable (Tuesday morning handout), not an essay.
      *   **Ending:** Limitations of the procedure (where it misfires/false confidence).

  2.  **Deconstruct the Historiographical Tension:**

      *   *The Trap of the State:* Assuming the categories of the poor law or assize courts reflect the lived reality of the poor. (e.g., "Vagrant" = a type of person, not a legal status applied to a person).
      *   *The Trap of the Exception:* Assuming one surviving diary represents the "voice of the poor." (e.g., Literacy, survival bias).
      *   *The Solution:* A procedural check on *inference*. What can we actually say based *only* on the evidence, without smuggling in assumptions?

  3.  **Drafting the Decision Procedure (The "Tool"):**

      *   *Structure:* Needs to be linear, with clear "Stop/Go" signals.
      *   *Time Limit:* Must be doable in 4 hours. So, no deep archival verification, just source auditing.
      *   *Sections:*
          1.  Source Audit (Where does the info come from?)
          2.  The Typicality Check (What can we generalise?)
          3.  The Agency Check (Who is speaking?)
          4.  The Scaling Check (Local vs. County)
          5.  The Celebration/Silence Check (Values)
      *   *Language:* Plain English, directive. "If X, then Y."

      *   *Addressing Specific Hard Cases within the Procedure:*
          *   *Bureaucratic Names:* Distinguish between the *event* (the trial) and the *person* (the defendant).
          *   *Typicality:* Ban words like "typical," "representative." Allow "illustrates," "shows one way."
          *   *Celebration:* Require "complexity" clause.
          *   *Silence:* Allow "We do not know" statements if supported by context.
          *   *Scaling:* Strict rules on quantifiers (Some vs. Many vs. All).
          *   *Lead Historian Bias:* A specific "Reverse Check" step.

  4.  **Developing the Test Cases:**

      *   *Case 1 (The Woman):*
          *   *Sources:* Assize (state), Parish (state/bureaucratic), Newspaper (mediated).
          *   *Risk:* Making her a symbol of "hunger" when she might just be a thief, or making the state's definition of crime the whole story.
          *   *Verdict:* Conditional Yes, but strict wording limits. Can't say "Hunger caused crime" definitively, can say "Crime occurred in context of relief."
      *   *Case 2 (The Farmer):*
          *   *Sources:* Diaries, rent books.
          *   *Risk:* "Voice of the rural poor." He's a *tenant farmer*. He's literate. He kept diaries. He is *not* the landless poor.
          *   *Verdict:* **Hard No** on the pitch. This is the uncomfortable one. He represents the *lower middle class/yeomanry*, not the "poor." This hits the "Typicality" trap hard.
      *   *Case 3 (The Mayor):*
          *   *Sources:* Civic record, link to Case 1.
          *   *Risk:* Hagiography vs. Cancel culture.
          *   *Verdict:* Yes, but the link to Case 1 *must* be included. It transforms "Benefactor" to "Complex Civic Figure."

  5.  **Refining the Procedure (Iterative Polish):**

      *   *Make it British:* "Programme," "Centre," "Labour," "Council."
      *   *Make it Practical:* Use checkboxes. Define "Sufficient Answer."
      *   *The "Values" Flag:* Clearly mark where the historian must step in (e.g., is this offensive? is this sensitive?).
      *   *The "Lead Historian" Check:* Add a specific step asking "Am I choosing this because the documents are easy?"

  6.  **Writing the Limitations:**

      *   It can't fix bad sources.
      *   It can't stop trustees from politicising history.
      *   It creates a illusion of rigour where interpretation is still subjective.
      *   It slows down the "celebratory" stuff which clients often want fast.

  7.  **Final Review against Constraints:**

      *   *Half-day run?* Yes, it's a checklist.
      *   *British English?* Yes.
      *   *Uncomfortable Truth?* Case 2 is the candidate. The farmer is not the "poor."
      *   *Tone:* Professional, direct, not academic.

  8.  **Drafting the Content (Mental or Scratchpad):**
      *   *Intro:* Keep it brief. This is a tool, not a manifesto.
      *   *The Grid:* 5 Steps.
      *   *Step 1 (Provenance):* Who created the record and why?
      *   *Step 2 (Generalisation):* Ban "Typical." Use "Documented."
      *   *Step 3 (Agency):* Is the subject speaking or being spoken about?
      *   *Step 4 (Scale):* Household vs. County.
      *   *Step 5 (Ethics/Values):* Celebration vs. Truth.
      *   *Test Cases:* Apply the grid rigorously.
      *   *Limitations:* Be honest about the tool's bounds.

      *(Self-Correction during drafting)*: Make sure I don't make the procedure too academic. The juniors don't know theory. Instead of "Epistemological break," use "Who wrote this and what did they want?" Instead of "Representativeness," use "Can we prove others were like this?"

      *(Refining Case 2)*: Why is the farmer not the poor? Because keeping a diary in 1867 requires literacy, leisure, and money for paper. A landless labourer couldn't do that. He is a specific stratum. Calling him "the rural poor" erases the actual poor who left no diaries. This is the hard truth the user needs.

      *(Refining Case 3)*: The Mayor. The link to Case 1 is the key. If we omit it, we lie. If we include it, we risk the Council getting angry. The procedure must mandate inclusion.

      *(Refining Case 1)*: The woman. The sources are hostile. We can't know her motive (hunger). We know the *charge* and the *relief*. We can contextualise, not psychologise.

  9.  **Final Polish:** Check word count, tone, and formatting. Ensure the "Values" flags are distinct from "Fact" checks. Ensure the "Lead Historian Bias" check is included. (Decided to embed the bias check into Step 1 and 5).

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Heritage Panel Decision Procedure (v1.0)

  **Purpose:** To stop us writing lies by omission or exaggeration by accident.
  **Users:** Junior Researchers (JRs).
  **Time Cost:** 3–4 hours per proposal.
  **Authority:** If a proposal fails a **STOP** condition, it cannot proceed to drafting without the Lead Historian's written waiver. If a question is marked **[VALUE]**, it goes to the Lead Historian for a ruling.

  ---

  ## Step 1: Provenance & Purpose (The Source Audit)
  *Goal: Identify whose voice is actually in the text.*

  **Q1.1: Who created the primary source and for what administrative purpose?**
  *   **Sufficient Answer:** "Created by [Role/Institution] to [collect tax / enforce law / record charity / celebrate self]."
  *   **Insufficient:** "It's a court record" or "It's a diary."
  *   **STOP:** If the JR cannot identify the administrative function of the source.

  **Q1.2: Does the source categorise the subject for us (e.g., 'vagrant', 'pauper', 'loyalist')?**
  *   **Sufficient Answer:** Yes/No. If Yes, the panel must explicitly state: "The authorities classified X as…"
  *   **STOP:** If the draft treats the category as a natural fact (e.g., "He was a vagrant" vs "He was charged as a vagrant").

  **Q1.3 [Lead Historian Check]: Am I choosing this source because it is easy to read or fits the county narrative?**
  *   **Action:** Lead Historian must sign off confirming a search for contradictory or harder sources was attempted (even if none found).

  ---

  ## Step 2: The Typicality Trap (Generalisation)
  *Goal: Prevent one life from carrying the weight of a class.*

  **Q2.1: Can we prove statistically that others lived like this person?**
  *   **Sufficient Answer:** Yes (census data, wage books) / No (single instance).
  *   **Constraint:** If **No**, the words "typical", "representative", "ordinary", and "voice of the [class]" are **BANNED** from the draft.
  *   **Allowed Phrasing:** "One documented case," "This illustrates how," "For this household."

  **Q2.2: What claims are blocked by the lack of data?**
  *   **Sufficient Answer:** A list of claims we *cannot* make (e.g., "We cannot say most families starved," "We cannot say this was common").
  *   **STOP:** If the proposal relies on a blocked claim to make its point.

  **Q2.3: Does the subject's survival bias distort the picture?**
  *   **Sufficient Answer:** Acknowledge why this record exists. (e.g., "He was literate," "She was prosecuted," "They owned land").
  *   **STOP:** If the proposal presents a literate tenant farmer as the "voice of the landless poor."

  ---

  ## Step 3: Agency & Silence (The Person)
  *Goal: Distinguish between a person acting and a person being acted upon.*

  **Q3.1: Is the subject speaking in the first person, or being described by an official?**
  *   **Sufficient Answer:** Direct quote (Diary/Letter) vs. Indirect description (Court/Parish).
  *   **Constraint:** If Indirect, the panel cannot describe the subject's *motives* or *feelings*, only their *actions* and *circumstances*.
  *   **STOP:** If the draft says "She felt hungry" based on a court charge of theft.

  **Q3.2: If the subject is silent (no direct voice), does the panel acknowledge the silence?**
  *   **Sufficient Answer:** The text includes a phrase acknowledging the gap (e.g., "We do not know why," "Her own words are lost").
  *   **[VALUE]:** If the silence is turned into a "victim narrative" without evidence, Lead Historian must decide if this is ethical storytelling or sentimental fiction.

  ---

  ## Step 4: Scaling (The Geography)
  *Goal: Stop local anecdotes becoming county-wide truths.*

  **Q4.1: What is the maximum geographic scope licensed by the evidence?**
  *   **Sufficient Answer:** Household / Parish / Town / County.
  *   **Constraint:** A single household record licenses sentences about *that household*. It licenses sentences about the *County* only if backed by secondary literature confirming the pattern.
  *   **STOP:** If the draft claims "In this county, people did X" based on one parish file.

  ---

  ## Step 5: Celebration & Complexity (The Values Check)
  *Goal: Handle civic pride without lying.*

  **Q5.1: Is this proposal driven by a commemorative anniversary or benefactor request?**
  *   **Sufficient Answer:** Yes/No.
  *   **Constraint:** If Yes, the panel must include one "complicating fact" that challenges the pure celebration (e.g., cost to others, controversial decisions).
  *   **[VALUE]:** Lead Historian must approve the complicating fact as fair and relevant.

  **Q5.2: Does celebrating this figure erase a conflicting narrative found in our other files?**
  *   **Sufficient Answer:** Cross-reference with current database.
  *   **STOP:** If a benefactor is celebrated without mentioning a known negative impact on a specific group identified in another project (e.g., The Mayor who built the library also sentenced the poor).

  ---

  # Live Case Tests

  Here is the procedure applied to your three current headaches.

  ### Case 1: The Woman (1840s Assize & Parish Relief)
  **Proposal:** Panel on hunger and crime in the valley.
  **Run:**
  *   **Step 1 (Provenance):** Sources are hostile (Court, Parish). She is categorized as "criminal" and "pauper." *Pass, with constraint:* Must use "charged with" not "was."
  *   **Step 2 (Typicality):** No stats on how many women stole bread due to hunger. *Pass, with constraint:* Ban "typical." Use "One documented instance."
  *   **Step 3 (Agency):** No first-person voice. Motive (hunger) is inferred, not stated. *Stop/Revision:* You cannot write "She stole because she was hungry." You can write "She stole bread during a period where parish relief was reduced."
  *   **Step 4 (Scaling):** One woman in one valley. *Pass:* Scope limited to "In this valley, records show…"
  *   **Step 5 (Celebration):** N/A.

  **Verdict:** **PROCEED WITH REVISIONS.**
  **Required Change:** The panel cannot argue *hunger caused crime* as a fact. It must argue *crime occurred in a context of economic distress.* The link between the two is a historical argument, not a documented fact. The text must reflect that distinction.

  ### Case 2: The Tenant Farmer (Diaries 1867–1901)
  **Proposal:** "The voice of the rural poor."
  **Run:**
  *   **Step 1 (Provenance):** Private diary. High agency. *Pass.*
  *   **Step 2 (Typicality):** **FAIL.**
      *   *Reasoning:* A tenant farmer who keeps diaries, rent books, and letter books is literate, has disposable income for paper/ink, and has the leisure to write. He is not the "rural poor" (landless labourers, destitute). He is the lower-middle agrarian class.
      *   *Constraint:* The phrase "voice of the rural poor" is banned.
  *   **Step 3 (Agency):** High agency. *Pass.*
  *   **Step 4 (Scaling):** One household. *Pass:* Scope limited to tenant farming experience.
  *   **Step 5 (Celebration):** N/A.

  **Verdict:** **REJECT PITCH.**
  **Hard Truth:** You cannot use this man as the face of the "poor." To do so is to erase the actual poor who could not write.
  **Required Change:** Reframe as "The Life of a Tenant Farmer." If you need the "rural poor," you must admit this source *excludes* them. If the client wants "the poor," you have no source for this item. Do not draft until the framing changes.

  ### Case 3: The Mayor (Library Benefactor & Magistrate)
  **Proposal:** Mural commemorating Victorian Mayor.
  **Run:**
  *   **Step 1 (Provenance):** Civic records + Link to Case 1 (Assize).
  *   **Step 2 (Typicality):** N/A (Elite history).
  *   **Step 3 (Agency):** High agency.
  *   **Step 4 (Scaling):** County/Town level. *Pass.*
  *   **Step 5 (Celebration & Complexity):** **CRITICAL FAIL.**
      *   *Reasoning:* The proposal is celebratory. Step 5.1 requires a "complicating fact." Step 5.2 requires checking for conflicting narratives. We have a direct conflict: The Mayor sentenced the woman in Case 1.
      *   *Constraint:* To celebrate the library without mentioning the magistrate role is to lie by omission.
  *   **[VALUE] Flag:** This goes to you. The Council will not like this.

  **Verdict:** **PROCEED CONDITIONALLY.**
  **Required Change:** The mural/text *must* link the library to the magistracy. Example: "He gave the town the gift of knowledge, and enforced the law that constrained it." Or simply list his roles: "Benefactor and Magistrate."
  **Risk:** The Veterans' Association may withdraw funding. If they do, the project stops. You must tell the Liaison Officer that a "clean" celebration is historically invalid under Step 5.

  ---

  # The Uncomfortable Answer

  **Case 2 is the one you won't like.**

  You want to use the farmer's diaries. They are rich, vivid, and you have three days to write the panel. But the procedure flags that calling him "the rural poor" is a category error. He is a *farmer*. The "poor" in 1870 were the people he employed, who left no diaries.

  If you run with the original pitch, you are committing the exact error you identified in your prompt: making a single vivid life carry a claim about ordinary people that it can't carry. You are privileging the source that speaks over the reality of the people who were silent.

  **Defence to the Trustees:** "We cannot label him 'the poor' because his literacy and tenure place him in a higher economic stratum. If we label him 'poor', we mislead the public about who actually suffered in the 19th century. We will market him as a 'Tenant Farmer'—that is accurate, and still interesting."

  ---

  # Limitations: Where This Procedure Misfires

  1.  **False Confidence:** This checklist makes us feel rigorous. It isn't. It stops obvious errors, but it doesn't stop subtle bias in word choice (e.g., "riot" vs "protest").
  2.  **The "Complicating Fact" Token:** Step 5 risks becoming a box-ticking exercise where we add one negative sentence to justify a hagiography. You (Lead) must audit Step 5 personally.
  3.  **Silence as Drama:** Step 3.2 tries to stop sentimental victim stories, but JRs may still write "Her voice is lost to us" in a way that manipulates emotion. There is no procedural fix for tone; only your red pen.
  4.  **Client Veto:** This procedure assumes the Client (Council/Trustees) accepts historical nuance. If they demand a hero, this tool gives you the ammunition to say no, but it doesn't stop them firing you.
  5.  **Time Creep:** Running this properly takes 4 hours. If you are behind schedule, you will skip Step 2. That is when the errors happen.

  **Final Instruction:** Print this. Laminate it. Stick it on the wall. If a JR comes to you with a draft that hasn't been run through this first, send them back.
