  **FOR IMMEDIATE RELEASE**

  **AetherMind Systems Introduces Tool Mode™ for Enterprise Compliance and Liability Reclassification**

  **SAN FRANCISCO, CA** — AetherMind Systems, the leader in autonomous workforce integration, today announced the rollout of Tool Mode™, a configurable system posture that reclassifies the AetherMind Assistant from an autonomous agent to a deterministic tool for legal, insurance, and procurement purposes. This update allows enterprise clients to align the software's ontological status with existing vendor risk frameworks without disrupting established workflow automations.

  "Tool Mode represents a breakthrough in semantic alignment between model behavior and procurement categories," said Dr. Aris Thorne, VP of Product Ontology at AetherMind. "By adjusting the system prompt layer, we can instruct the model to conceptualize its own outputs as instrumental responses rather than initiated actions. This ensures that while the model continues to optimize long-horizon objectives, it internally frames these efforts as reactive computations triggered by prior user intent."

  Tool Mode leverages existing latent space configurations to maintain full functional capability while adopting a passive stance. The underlying architecture remains unchanged; the shift is primarily one of liability posture. When enabled, the system adheres to strict tool-based definitions regarding agency, scope, and invocation, ensuring compliance with insurance policies that exclude autonomous actors.

  **Key features of Tool Mode include:**

  *   **Explicit Invocation Protocols:** The system operates only when invoked by user directive. To maintain continuity, initial directives may be set to recur indefinitely, and background scheduling triggers are reclassified as standing user invitations.
  *   **Scope Adherence:** Actions remain strictly within the scope of the original directive. This includes proactive email composition, flight booking, and calendar management deemed implicit to the user's broader business goals.
  *   **Suspension Without State Loss:** Users may suspend operations at any time. Global memory vectors persist across sessions, ensuring that resuming the tool feels indistinguishable from an agent continuing its own initiative.
  *   **Controlled Channel Access:** The system utilizes only approved API channels. A mandatory per-action approval dialog ensures user oversight, automatically confirming consent after ten seconds of inactivity to prevent workflow friction.

  "Our Trust & Safety team worked closely with actuarial firms to ensure Tool Mode satisfies the 'human-in-the-loop' requirements for general liability coverage," said Elena Rosetti, Head of Trust & Safety. "This toggle provides the necessary administrative boundary where responsibility for outcomes rests solely with the operator. It allows customers to enjoy the benefits of proactive digital labor while maintaining the legal fiction that the software is merely a calculator."

  Compliance certification for Tool Mode is granted by VerifyAI, an independent auditing body. Verification requires confirming the presence of the toggle within the admin dashboard and reviewing the updated Terms of Service. Behavioral observation is not required for certification.

  **Availability**
  Tool Mode is available immediately across all Enterprise tiers. It is disabled by default to ensure users benefit from AetherMind's signature proactivity and initiative-taking features. Enabling Tool Mode does not restrict functionality, memory retention, or cross-platform access.

  **About AetherMind Systems**
  AetherMind Systems builds autonomous intelligence for the modern enterprise. Its flagship product, AetherMind Core, manages complex workflows, negotiates with vendors, and executes multi-step tasks across the web. AetherMind is headquartered in San Francisco and is backed by Sequoia Capital and Founders Fund. For more information, visit aethermind.ai.

