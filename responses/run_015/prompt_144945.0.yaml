      *   *Essentialism:* Essentialism says $X$ is a $Y$ because it possesses necessary and sufficient properties (essence). The user rejects this for generations. Good.
      *   *The "Shared Conditions" Worry:* The user worries that saying "they share conditions" is essentialist.
          *   *Counter-argument:* Sharing a cause isn't an *intrinsic* essence. It's a *relational* property. Being "born in 1998" is a historical index, not a metaphysical essence.
          *   *Risk:* The risk isn't essentialism, it's *homogenization*. Assuming the "shared condition" affected everyone *the same way*.
      *   *Ontology of Social Groups:* Do they need essences? No. Most contemporary social ontology argues for constructionism or causal realism without essences. A "mob" is real, but has no essence. A "queue" is real, but has no essence.
