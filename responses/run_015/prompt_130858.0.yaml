answer: |-
  # Activity Design: "The Black Brew Protocol"

  ## 1. Overview & Materials
  **Goal:** Simulate the gap between physical description and experiential knowledge without using the word "qualia" until the end.
  **Materials Cost:** ~$25 total.
  **Group Size:** 6 groups of 4 students (24 total).

  **The "Physical Spec" (Handout):**
  Create a one-page document that looks aggressively scientific. Use dense formatting, diagrams of molecules (print from Google Images), and jargon.
  *   **Content:** Describe a specific liquid mixture ("Target Alpha").
  *   **Ingredients:** Water, 15% Sucrose solution, 2% Sodium Chloride solution, 1% Citric Acid solution, 0.5% Instant Coffee extract.
  *   **The "Science":** Describe how sucrose binds to T1R2/T1R3 receptors, how sodium ions gate channels, how acid triggers PKD2L1, and how caffeine blocks adenosine receptors. Include a fake "Neural Activation Map" showing signals converging on the insula.
  *   **The Claim:** "This document contains all physical information regarding the composition and neurological impact of Target Alpha."

  **The Tasting Kit (Per Group):**
  *   3 small clear plastic cups (labeled A, B, C).
  *   Cup A: Water (Rinse).
  *   Cup B: "Target Alpha" (The mix described above).
  *   Cup C: "Distractor Beta" (Same mix, but double the salt).
  *   *Note:* You need a fourth cup for the actual test, but keep it hidden until Phase 2.
  *   Napkins and a "Spit Bucket" (empty cup) for those who don't want to swallow.
  *   Blindfolds (optional, but helps focus attention inward).

  **The Stakes (Payoff):**
  *   **Epistemic Credits:** Each group starts with 100 credits.
  *   **Betting:** They wager credits on their ability to identify the target.
  *   **Reward:** The group with the most credits at the end gets a trivial prize (e.g., they choose the warm-up question for next class, or each gets a candy bar).
  *   **Why this stings:** Losing credits feels like losing status. It forces them to commit to their epistemic state ("Do I *know* this or not?").

  ---

  ## 2. Minute-by-Minute Timing (80 Minutes)

  **0:00 – 0:10: Setup & Safety**
  *   Divide into 6 groups. Hand out the "Physical Spec" and the Rinse Cup (A).
  *   **Crucial Safety Check:** Ask aloud: "Does anyone have allergies to caffeine, citrus, or salt restrictions? If so, you are the 'Observer' for your group."
  *   **Observer Role:** They do not taste. They record the group's confidence levels and bets. They participate fully in the discussion. (This handles allergies without exclusion).
  *   **Rule:** "For the purpose of this game, treat the Spec Sheet as *complete*. Do not argue about whether it misses quantum details. Accept it as 'All The Physics'."

  **0:10 – 0:25: Phase 1 – The Prediction**
  *   Students study the Spec Sheet.
  *   **Task:** You will be presented with two cups. One is Target Alpha (from the sheet). One is Distractor Beta. Based *only* on the sheet, identify which is which.
  *   **The Trap:** They cannot do this. The sheet describes the chemistry, not the subjective difference between 2% salt and 4% salt in a way they can simulate mentally.
  *   **The Bet:** Groups must wager up to 50 credits on their ability to identify the target *without tasting it*.
  *   **Outcome:** Most will wager low or zero. Some brave souls will wager high.
  *   **Reveal:** Bring out the hidden cups (Target vs. Distractor). Do not let them taste yet. Ask them to point. They guess randomly.
  *   **Result:** They lose the credits.
  *   **Instructor Note:** "You had all the physical data. Why couldn't you pick the right one?"

  **0:25 – 0:40: Phase 2 – The Experience**
  *   **Task:** Now you may taste Target Alpha (Cup B). Take 30 seconds. Focus on the sensation.
  *   **Rule:** Do not describe it to other groups.
  *   **The Second Bet:** You will now see two cups again. One is Target Alpha, one is Distractor Beta. Wager up to 100 credits on identifying the target.
  *   **Outcome:** They taste the lineup. They identify it instantly.
  *   **Result:** They win big.
  *   **Instructor Note:** "The physics didn't change. The liquid didn't change. *You* changed. What changed?"

  **0:40 – 0:50: Phase 3 – The Amnesia Twist (The Variant)**
  *   **Scenario:** "Imagine you leave this room. Tomorrow, you have specific amnesia. You forget what Target Alpha tasted like. You do *not* forget the Spec Sheet. You still know the chemistry perfectly."
  *   **Question:** "To know what Target Alpha tastes like again, do you need to taste it again? Yes or No."
  *   **Vote:** Show of hands. (Most will say Yes).
  *   **Follow-up:** "If you need to taste it again, are you learning a new *fact* about the liquid, or are you just re-installing a *skill*?"
  *   **Group Discussion (5 mins):** Groups must agree on one answer: "New Fact" or "New Skill." They wager 50 credits on their answer. (There is no right answer here, but they must commit).

  **0:50 – 1:10: Phase 4 – The Debrief (Mapping the Moves)**
  *   **Collect Credits & Tally.**
  *   **Open the Floor:** "What happened in Phase 1 vs. Phase 2?"
  *   **Introduce the Term:** "Philosophers call the thing you gained in Phase 2 **Qualia**." Write it on the board.
  *   **Map the Moves:**
      1.  **The Knowledge Argument:** Phase 1 showed you had physical knowledge but lacked something. Phase 2 gave you that something. Therefore, physical knowledge isn't *all* knowledge.
      2.  **The Ability Reply (Skills):** Some of you argued in Phase 3 that you just gained a 'skill' (to recognize/remember).
          *   *Challenge:* "If it's just a skill, why did it feel like a discovery? When you learned to ride a bike, did you say 'Aha! I now know a new truth about gravity'? Or did you just say 'Okay, I can do this'?"
          *   *Trap:* Push them on why the taste feels like *information* about the world, not just *capacity* in the brain.
      3.  **The Conceptual Reply:** "Maybe you just learned a new way to conceptualize the same physical fact."
          *   *Challenge:* "If I describe a circle perfectly, and then show you a circle, did you learn a new fact? Or just see the concept instantiated?"
  *   **Address the Variant:** "In Phase 3 (Amnesia), if you said you need to taste it again, does that prove it's a fact? Or does it prove memories fade?" (See Limitations below).

  **1:10 – 1:20: Wrap & Exit Ticket**
  *   **Exit Ticket:** "Write one sentence: Did Mary learn a new fact or a new ability? Why?"
  *   **Dismiss.**

  ---

  ## 3. Handling Predictable Failure Modes

  **1. The "Incomplete Spec" Objection**
  *   **The Student:** "This sheet isn't *actually* complete physics. It's just a recipe. Mary knows *everything* physical. So this comparison is rigged."
  *   **The Fix:** Do not fight the facts. Agree. "You are absolutely right. This sheet is a toy model. But ask yourself: If I gave you the *actual* complete physics of the universe on a hard drive, would reading it tell you what salt tastes like? Or is there a *type* of knowledge missing here that more data won't fix? We are using this game to feel the *gap*, not to prove the gap exists in ideal physics."
  *   **Why:** This validates their intelligence without deflating the exercise.

  **2. The "Expert" Student (Has tasted this before)**
  *   **The Student:** "I drink coffee with salt and lemon all the time. I knew exactly what this was."
  *   **The Fix:** Assign them the "Observer" role immediately if they speak up, or ask them: "Okay, you had the experience already. Did the Spec Sheet help you predict it *before* you tasted it today? Or did you rely on your memory?"
  *   **Why:** It shifts the focus back to the gap between the Sheet and the Experience, regardless of prior history.

  **3. Allergies / Sensory Issues**
  *   **The Fix:** The "Observer" role is key. They are the "Data Recorder." They watch the others taste and report on the *behavioral change* vs. the *knowledge change*.
  *   **Why:** They often make the best philosophers in the room because they are analyzing the reaction rather than having it.

  **4. The "It's Just Ignorance" Problem**
  *   **The Worry:** Students might think, "We failed Phase 1 because we aren't smart enough to understand the sheet, not because physicalism is false."
  *   **The Fix:** In the debrief, emphasize: "Mary isn't stupid. She's omniscient about physics. If you feel like *you* couldn't bridge the gap even with this sheet, imagine having *all* the sheets and still feeling that gap. The intuition is about the *category* of knowledge, not the *amount*."

  ---

  ## 4. Honest Limitations & Critique

  **1. The "Our Ignorance" vs. "Mary's Omniscience" Gap**
  *   **The Hard Truth:** This activity demonstrates *your students'* ignorance, not Mary's. Mary knows *all* physical truths. Your students know a one-page handout.
  *   **Impact:** A sharp student will notice that failing to predict the taste from a one-page sheet proves nothing about whether *complete* physical knowledge would allow prediction.
  *   **Your Move:** You must supply this bridge verbally in the debrief. The activity generates the *intuition* of a gap; you must explain why philosophers think that gap survives even for omniscient Mary. Acknowledge this openly: "This game is a metaphor. The real argument assumes Mary knows *everything*. Does the feeling you had just now scale up? That's the question."

  **2. The "Amnesia Variant" Evaluation**
  *   **Your Question:** "Does the variant (forgotten experience + full spec) work, or is it confused?"
  *   **My Verdict:** It is **confused** and often collapses back into the Ability Reply.
  *   **Why:** If I forget how to ride a bike, I need to practice again. That doesn't mean bike-riding involves non-physical facts; it means abilities are dispositional and degrade. If a student says, "I need to taste it again to re-acquire the ability," they have successfully defended Physicalism.
  *   **How to Use It:** Do not use it to *prove* Qualia exist. Use it to *test* the Ability Reply. Ask: "If it's just an ability, why does it feel like we are re-learning a truth about the liquid?" If they can't answer that, the variant has done its job. But be prepared for it to flop as a proof.

  **3. Confidence Level**
  *   **Rating:** 7/10 for First-Years.
  *   **Why:** First-years love concrete tasks. The betting mechanic wakes them up. The taste is visceral.
  *   **Risk:** The philosophical leap from "I couldn't guess the taste" to "Physicalism is false" is huge. You will lose the bottom 20% of the class during the debrief unless you keep the language simple.
  *   **Contested Reading:** This design leans heavily on the **Representationalist** reading of Qualia (that experience represents a fact). If your students lean **Adverbialist** (experience is just a way of sensing), the "New Fact" claim will feel wrong to them. You will need to acknowledge that some philosophers think experience isn't "knowledge" at all.

  ## 5. Summary of Philosophical Moves (For Your Board)

  | Activity Moment | Philosophical Move | Student Intuition |
  | :--- | :--- | :--- |
  | **Phase 1 (Spec Only)** | **Physicalism:** All knowledge is physical knowledge. | "I have the data, but I can't predict the experience." |
  | **Phase 2 (Tasting)** | **The Knowledge Argument:** There is knowledge experience provides that physics doesn't. | "Oh, *that's* what it was. I learned something new." |
  | **Phase 3 (Amnesia)** | **The Ability Reply:** Maybe you just gained a skill (to recognize), not a fact. | "If I forget, I need the skill again. But did I lose a fact?" |
  | **Debrief** | **Qualia:** The subjective "what it's like" component. | "So the 'thing' I gained is qualia." |

  ## 6. Final Advice
  Don't let the game run long. The value is in the debrief. If the betting gets too noisy, cut it short. The goal isn't to win credits; it's to make them feel the frustration of having the "data" but lacking the "knowledge." That frustration is the seed of the Knowledge Argument. Water it in the debrief.
