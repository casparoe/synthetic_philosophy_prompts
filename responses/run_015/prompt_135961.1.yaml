answer: |-
  Good morning, everyone, and welcome to 'Collective Minds?'.

  It's lovely to see such a mix of faces around the table. We've got biologists who know far more about pheromone trails than I ever will, and philosophers and cognitive scientists who worry about qualia and subjectivity for a living. Usually, when these groups meet, we talk past one another. The biologists describe the mechanism, the philosophers question the ontology, and everyone goes home slightly frustrated. My hope for today is that we avoid that. And to help us do that, I want to start by leaning into the question mark in our title.

  To set the scene, I want to invoke a thought experiment that many of you will know, but which I think should constrain how we speak today. It's Douglas Hofstadter's 'Aunt Hillary'. In *Gödel, Escher, Bach*, Hofstadter suggests that an ant colony might not just be *like* a mind, but might literally *be* a single conscious subject. He calls her Aunt Hillary. The individual ants are merely neurons; the colony is the thinker.

  Now, I'm not standing here to assert that Aunt Hillary exists. But if we take this possibility seriously, it changes the grammar of our workshop. I need to be careful not to say things like 'the ants decide where to forage', because that presupposes the only real agents are the individuals. But equally, I can't say 'the colony feels hunger', because that presupposes the very unified consciousness we're here to interrogate. So, we're walking a tightrope. We need language that allows for collective cognition without prematurely committing to collective phenomenology.

  This brings me to a specific twist I'd like us to keep in mind. When we imagine a collective mind, there's a temptation to picture a central controller—a homunculus sitting in the nest receiving reports. But if there is a mind here, it's likely nothing like that. It might be better understood as a recursive echo.

  Think of it as distributed feedback loops that reverberate through the system. From the outside, these loops look intentional. The colony solves problems, navigates obstacles, and manages resources. But inside? It's just signal meeting signal. Some recent work has tried to frame this using predictive processing. The idea is that the colony, as a system, acts to minimise surprise or free energy across the network, not because any single ant has a model of the world, but because the structure of their interactions enforces a kind of global coherence.

  I want to be very clear, however: this is where the map gets fuzzy. We need to separate what is well-established from what is genuinely contested.

  It is established fact that colonies solve complex problems through distributed signalling. We know the mechanics of recruitment, we know the feedback loops, and we can model the efficiency. That is solid ground. What is contested—wildly so—is whether those processes constitute a unified perspective. Does the predictive processing of the colony imply a point of view? Does the fugue analogy survive objections about lacking unified phenomenology? Can a system without a central brain have a 'self' that experiences anything at all?

  We don't know. And frankly, if we knew, we wouldn't need this workshop.

  So, my request for today is simple. Let's resist the urge to collapse the tension too quickly. When a biologist describes a behaviour, let's not immediately reduce it to individual selection pressures without asking if the collective level offers explanatory power. And when a philosopher talks about cognition, let's ensure we aren't smuggling in human-like consciousness where there might only be functional coordination.

  Let's treat Aunt Hillary not as a verdict, but as a constraint. Let's see if we can describe the recursive echoes of the colony without deciding in advance whether anyone is listening to them.

  Thank you very much. Let's get started.
