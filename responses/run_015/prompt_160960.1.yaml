answer: |-
  Consider now a die with faces three,
  Where one and two and three share equal chance.
  Let A be Odd, and C that One we see,
  Caught in the rolling of a single glance.
  To judge "If A, then C," we suppose A,
  The chance of C rises to one in two;
  No worldly fact, but stance we thus display,
  Not one in three, as prior credence knew.

  Yet if this "If" is proposition true,
  An event X for every credence state,
  Then half must match the third, a broken view,
  Till credence shrinks to one or zero fate.
  So truth, or thesis, or the logic frame,
  Must bend or break to bear the trivial name.
