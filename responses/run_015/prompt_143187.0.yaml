prompt: |-
  I chair the serious-incident review panel at a hospital group; we investigate roughly forty incidents a year, and our findings are entered into a mandatory reporting system in which the words 'caused', 'contributed to' and 'was a background condition to' have quite different downstream effects — the first can trigger a regulatory referral and an insurance position, the second a local action plan, the third nothing at all — so the wording is contested by every department whose conduct appears in it. Increasingly the candidate we argue about is an omission: a check not performed, an escalation not made, an abnormal result not chased, a calibration skipped. We have no disciplined way of saying when a failure to act is a cause of the harm rather than a breach of protocol that merely happened to sit nearby in time.

  Please write a decision procedure my panel can run in a forty-five-minute review, with no legal or philosophical training, and that a colleague could rerun on the same file and reach the same verdict. It should be grounded in the distinctions that actually matter in the literature on causation by omission — the fragility of the counterfactual, cases where the omission is causal only because an independent backup had itself been disabled, cases where the agent would have been prevented from acting had they tried, cases where the not-acting was produced by someone else's earlier omission, and the point that a non-occurrence is an omission at all only relative to a norm, role or expectation. I also want three categories my panel has started using informally made precise and then criticised: a 'live omission', where the agent could have acted and nothing would have stopped them; a 'blocked omission', where they would have been prevented; and a 'borrowed omission', where they did not act only because another party's earlier omission had already removed the means, the information or the authority to act. Tell me whether that threefold distinction cuts along the right joints, or whether 'borrowed' collapses into 'blocked' or into ordinary causation by an earlier positive act.

  Give me the questions in a fixed order, what counts as a sufficient answer to each, an explicit stop that returns 'not a cause', and explicit hand-offs to a person where what remains is a decision about what we owe each other rather than about what happened. Then run it on three cases: a night nurse who did not escalate deteriorating vital signs while the on-call doctor's pager battery was dead; a maintenance team that skipped a scheduled calibration on a tank level sensor, where the independent high-level alarm had been muted months earlier by a different contractor; and a consultant who did not review a scan she had explicitly delegated, where the registrar who did review it also did not act, so that counterfactually nothing would have changed — a case where I expect the procedure to return a verdict my panel will not like. Finally, say what the procedure cannot do: in particular, whether it can keep our desire to prevent recurrence from being smuggled in as a causal finding, and what it should say when the norm it must anchor to — for instance, what staffing level was owed — is itself the thing under dispute.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of a Serious-Incident Review Panel at a hospital group.
      *   **Context:** 40 incidents/year. Mandatory reporting system.
      *   **Stakes:** Wording matters immensely ('caused' vs. 'contributed to' vs. 'background condition'). 'Caused' triggers regulatory/insurance issues. 'Contributed' triggers local action. 'Background' triggers nothing.
      *   **Problem:** Difficulty distinguishing causal omissions (failure to act causing harm) from non-causal breaches (protocol breach coinciding with harm).
      *   **Constraints:** 45-minute review time. No legal/philosophical training required. Inter-rater reliability (colleague must reach same verdict).
      *   **Theoretical Grounding:** Must reflect literature on causation by omission (counterfactual fragility, independent backups, prevention, prior omissions, norms/roles).
      *   **Specific Task 1:** Create a decision procedure (fixed order questions, sufficient answers, explicit stops, hand-offs).
      *   **Specific Task 2:** Critique/Refine three informal categories: 'Live Omission', 'Blocked Omission', 'Borrowed Omission'. Do they cut along the right joints?
      *   **Specific Task 3:** Run the procedure on three specific cases (Night Nurse/Dead Pager, Maintenance/Muted Alarm, Consultant/Delegate/Registrar).
      *   **Specific Task 4:** Define limitations (prevention bias, disputed norms).

  2.  **Deconstruct the Theoretical Challenges (Causation by Omission):**

      *   *The Problem of Infinity:* If I didn't save the drowning child, I caused their death. But if I didn't fly a plane to drop a life raft, did I also cause it? We need a normative filter (duty/expectation).
      *   *Counterfactual Dependence:* "But for the omission, would the harm have occurred?" This is necessary but not sufficient (due to the infinity problem).
      *   *Fragility:* If the backup system was already broken, does the omission matter? (Overdetermination/Preemption).
      *   *Ability to Act:* Could they actually have done it? (Physical possibility vs. normative expectation).
      *   *Chain of Omissions:* If A didn't tell B, and B didn't act, is B's omission causal?

  3.  **Develop the Decision Procedure (The "Omission Causality Filter"):**

      *   *Goal:* Binary or Ternary output (Cause / Contribution / Background) within 45 mins.
      *   *Structure:* Funnel approach. Start with easy eliminations, move to harder counterfactuals, end with normative judgments.
      *   *Step 1: Normative Anchor.* Was there a duty? (Eliminates "I didn't fly the plane" cases).
      *   *Step 2: Physical Possibility.* Could they have done it? (Eliminates impossible tasks).
      *   *Step 3: Counterfactual Test.* If they acted, would harm be avoided? (The "But For" test).
      *   *Step 4: Independence/Backup.* Was there a safety net that failed independently? (Distinguishes sole cause vs. contributing factor).
      *   *Step 5: The Hand-off.* When does it become a policy question?

  4.  **Refine the Three Categories (Live, Blocked, Borrowed):**

      *   *Live Omission:* Agent could act, no barriers. (Standard causal omission).
      *   *Blocked Omission:* Agent tries (or would try) but is physically/systemically stopped. (Not causal, usually).
      *   *Borrowed Omission:* Agent didn't act because someone else removed the *capacity* to act earlier.
      *   *Critique:* 'Borrowed' is tricky. Is it just a 'Blocked' omission where the blocker is a prior omission? Or is it a positive act of removing capacity? In the literature, this often falls under "preemption" or "early vs. late omission." 'Borrowed' risks obscuring the *actual* cause (the earlier removal of capacity). I need to advise the user that 'Borrowed' often collapses into 'Blocked' regarding the *current* agent, but shifts the causal weight to the *earlier* agent.

  5.  **Drafting the Procedure (Iterative Process):**

      *   *Drafting Q1 (Duty):* Needs to be objective. "Was there a written protocol or established role expectation?"
      *   *Drafting Q2 (Capacity):* "Did they have the means/info?"
      *   *Drafting Q3 (Counterfactual):* "If they acted, does harm stop?"
      *   *Drafting Q4 (Independence):* "Was there a backup?"
      *   *Stop Rules:* If Q1 is No -> Background. If Q3 is No -> Background/Contributory (depending on risk).
      *   *Hand-off:* If Q1 is disputed, that's a policy issue, not a fact issue.

  6.  **Applying to Cases:**

      *   *Case 1 (Nurse/Dead Pager):* Nurse had duty (Live). Pager dead (Blocked for Doctor). Nurse's omission is causal *unless* escalation was impossible. Wait, the prompt says Nurse did not escalate *while* pager was dead. Did the nurse know? If the nurse tried and failed, it's not an omission. If the nurse didn't try, it's a Live Omission. The doctor's dead pager is a separate issue.
      *   *Case 2 (Maintenance/Muted Alarm):* Maintenance skipped calibration (Omission). Alarm muted by *different* contractor (Earlier Omission/Act). If calibration happened, would it have caught the level? Yes. But the alarm was the backup. This is the "Independent Backup" problem. The calibration omission is causal *only if* the alarm wasn't relied upon as the sole safeguard. Actually, if the alarm was muted, the calibration becomes the *only* line of defense. This makes the omission more causal, not less. Wait, the prompt asks about the *skipped calibration*. If they calibrated, would the sensor work? Yes. But the alarm was muted. This is a "Borrowed" scenario? No, it's concurrent vulnerabilities.
      *   *Case 3 (Consultant/Registrar):* Consultant delegated (Normative shift). Registrar reviewed + didn't act. Consultant didn't review. Counterfactual: If Consultant reviewed, would harm stop? Maybe, if she overruled Registrar. But Registrar *also* missed it. This is "Overdetermination by Omission." If both missed it, is the Consultant's omission causal? Literature says yes, if she had the final duty. But the panel won't like it because "nothing would have changed" (the Registrar's mind). This tests the "Fragility" concept.

  7.  **Addressing the Limitations:**

      *   *Prevention Bias:* We want to fix things, so we call it "causal" to force a fix. The procedure must separate "What happened" from "What we should fix."
      *   *Disputed Norms:* If the protocol itself is unsafe, the procedure hits a wall. It must flag this as a "System Design" issue, not an "Individual Causation" issue.

  8.  **Refining the Output Structure:**

      *   **Part 1: The Critique of Categories.** Address Live/Blocked/Borrowed first to set the theoretical stage.
      *   **Part 2: The Procedure.** The core tool. Clear steps, stop conditions.
      *   **Part 3: Case Applications.** Walk through the three scenarios.
      *   **Part 4: Limitations.** Honest assessment of boundaries.

  9.  **Self-Correction/Polishing during drafting:**

      *   *Check:* Did I address the "45-minute" constraint? Keep questions binary or short-answer.
      *   *Check:* Did I address "Inter-rater reliability"? Use objective evidence markers (logs, rosters, protocols).
      *   *Check:* The "Borrowed" category. I need to be firm. 'Borrowed' is usually a 'Blocked' omission where the block is informational or authoritative rather than physical. It risks double-counting omissions. I should recommend merging 'Borrowed' into 'Blocked' for the *current* agent, but flagging the *prior* agent for a separate review.
      *   *Check:* Case 3 is the hardest. If the Registrar also failed, the Consultant's review *might* have caught it. The counterfactual is "If Consultant reviewed, would she have spotted it?" Not "Would the Registrar have spotted it?" The procedure needs to isolate the Consultant's potential action from the Registrar's actual action.
      *   *Check:* The "Hand-off." Where does causation end and policy begin? When the "Norm" is unclear.

  10. **Final Review against constraints:**
      *   No legal jargon.
      *   Grounded in omission literature (Hart & Honoré, Lewis, etc., but translated).
      *   Specific verdicts for the three cases.
      *   Critique of the three categories.

  *(Self-Correction on Case 2)*: Maintenance skipped calibration. Alarm muted by *other* contractor. If Maintenance *had* calibrated, the sensor would read right. The alarm was a backup. The harm happened because the sensor read wrong (due to no calibration) AND the alarm didn't sound (due to muting). Both are causal. The Maintenance omission is a "Live Omission" regarding the sensor, but the harm was overdetermined. The procedure needs to handle "Partial Cause."
  *Correction:* The prompt asks about the distinction between 'caused', 'contributed', 'background'. If two things fail, both 'contributed'. If one fails and the other works, the failing one 'caused'. If both fail, did either 'cause'? Usually, we say both 'contributed' unless one was the *primary* defense. I need to ensure the procedure distinguishes "Sole Cause" vs "Contributory Cause." The prompt implies 'Caused' is the high-stakes label. I should reserve 'Caused' for where the omission is the *decisive* difference.

  *(Refining the "Borrowed" Critique)*: 'Borrowed' is conceptually unstable. If I can't act because you didn't give me tools, your omission is the cause. My omission is 'Blocked'. Calling it 'Borrowed' suggests I still own the causation. I should advise the panel to treat 'Borrowed' as 'Blocked' for the second agent, and 'Live' for the first.

  *(Refining Case 3)*: Consultant vs Registrar. If Registrar missed it, and Consultant would have *also* missed it (because the error was subtle), then Consultant's omission is not causal. If Consultant would have *caught* it (because she is more senior), then it is causal. The procedure must ask: "Is there evidence the second pair of eyes would have succeeded?"

  Let's write.
answer: |-
  ### Part 1: Critique of Your Informal Categories

  You asked whether the triad of **Live**, **Blocked**, and **Borrowed** omissions cuts along the right joints.

  **The Verdict:** The distinction is clinically useful but philosophically unstable. Specifically, **'Borrowed' collapses into 'Blocked'.**

  1.  **Live Omission:** (Agent could act, no barriers). This is robust. It maps to standard counterfactual causation grounded in a duty. Keep this.
  2.  **Blocked Omission:** (Agent would act, but physical/systemic barriers prevent it). This is also robust. It negates causation because the counterfactual "if they tried" yields the same result. Keep this.
  3.  **Borrowed Omission:** (Agent did not act because a prior party removed the means/info/authority).
      *   *Critique:* This is merely a **Blocked Omission** where the block is informational or authoritative rather than physical. By labeling it "Borrowed," you risk assigning causal weight to the second agent (the borrower) when the causal leverage lay entirely with the first agent (the lender).
      *   *Recommendation:* Do not treat 'Borrowed' as a distinct causal category for the *second* agent. For the second agent, it is a **Blocked Omission** (Verdict: Not a Cause). For the *first* agent, it is a **Live Omission** (Verdict: Cause). Splitting the difference obscures accountability.

  ---

  ### Part 2: The Omission Causality Filter (OCF)

  **Purpose:** To determine if an omission is a *Cause* (Regulatory/Insurance), *Contribution* (Local Action), or *Background* (No Action).
  **Time:** 45 Minutes.
  **Requirement:** Evidence-based answers only (logs, protocols, rosters). No speculation on "what they might have been thinking."

  #### Phase 1: The Normative Anchor (5 Minutes)
  *An omission is only an omission relative to an expectation. Without a duty, there is no omission, only a non-event.*

  **Q1: Was there a specific, active duty to act at this exact time?**
  *   **Sufficient Answer:** Yes, if evidenced by: (a) Written protocol mandating the action; (b) Rostered role responsibility; (c) Explicit verbal handover of responsibility.
  *   **Insufficient Answer:** "It's common practice," "They should have known," or "It would have been nice."
  *   **STOP RULE:** If **NO**, verdict is **Background Condition**. End review.
  *   **HAND-OFF:** If the panel disagrees on whether the duty existed (e.g., the protocol is ambiguous), stop. This is not a causal finding; it is a **Policy Dispute**. Flag for Governance Committee. Do not assign individual causation.

  #### Phase 2: The Capacity Check (10 Minutes)
  *An agent cannot cause harm by failing to do what they were unable to do.*

  **Q2: Did the agent possess the physical means, information, and authority to act at the critical moment?**
  *   **Sufficient Answer:** Yes, if: (a) Equipment was available/functional; (b) Information was accessible in the record; (c) Hierarchy permitted the intervention.
  *   **STOP RULE:** If **NO**, classify as **Blocked Omission**. Verdict: **Background Condition** (for this agent).
      *   *Note:* You must then open a separate file for the person who removed the means/info (the 'Borrowed' source).
  *   **HAND-OFF:** If the lack of means was due to a known, chronic resource shortage (e.g., "We never have enough staff"), this is a **System Design Failure**. Flag for Executive Board. Do not assign individual causation.

  #### Phase 3: The Counterfactual Test (15 Minutes)
  *Would the harm have been avoided if the duty had been discharged?*

  **Q3: If the action had been performed correctly, is there evidence the harm would have been prevented?**
  *   **Sufficient Answer:** Yes, if: (a) Clinical literature supports the intervention's efficacy for this specific presentation; (b) The timeline allows for the intervention to take effect before the harm occurred.
  *   **STOP RULE:** If **NO** (e.g., the patient was already unsalvageable, or the intervention takes 2 hours and harm occurred in 10 mins), verdict is **Background Condition**.
  *   **Nuance:** If the action would have *delayed* harm but not prevented it, verdict is **Contribution**.

  **Q4: Was there an independent safety net that failed separately?**
  *   **Sufficient Answer:** Identify if a backup system (alarm, second check, protocol B) existed and failed due to a *different* cause.
  *   **Decision:**
      *   If the backup worked: The omission is **Background** (The system survived the error).
      *   If the backup failed independently (e.g., muted alarm): The omission is a **Contribution** (One of multiple failures).
      *   If there was *no* backup: The omission is a **Cause** (Sole point of failure).

  #### Phase 4: The Fragility Check (10 Minutes)
  *Addresses the "Two Omissions" problem (e.g., Consultant and Registrar both miss the error).*

  **Q5: Is there evidence that a competent performance of this duty would have detected the error, regardless of others' failures?**
  *   **Sufficient Answer:** Yes, if the error was detectable *at the level of this agent's seniority/role*.
  *   **STOP RULE:** If the error was undetectable even by a competent agent (e.g., a latent defect no one could see), verdict is **Background Condition**.
  *   **HAND-OFF:** If the panel concludes "The system relies on individuals never making mistakes," this is a **Resilience Failure**. Flag for Quality Improvement.

  #### Phase 5: Final Classification (5 Minutes)

  *   **CAUSE:** Live Omission + Counterfactual Prevents Harm + No Independent Backup Failed. (Triggers Regulatory/Insurance).
  *   **CONTRIBUTION:** Live Omission + Counterfactual Delays/Mitigates Harm OR Independent Backup Also Failed. (Triggers Local Action Plan).
  *   **BACKGROUND:** Blocked Omission OR No Duty OR Counterfactual Does Not Prevent Harm. (Triggers No Action).

  ---

  ### Part 3: Running the Procedure on Your Cases

  #### Case 1: Night Nurse / Dead Pager
  *Scenario:* Nurse did not escalate deteriorating vitals. On-call doctor's pager battery was dead.
  *   **Q1 (Duty):** Yes. Protocol requires escalation of deteriorating vitals.
  *   **Q2 (Capacity):** Yes. Nurse had phone/access to alternative contact methods?
      *   *Crucial Detail:* If the Nurse *tried* to page and it failed, this is a **Blocked Omission** for the Nurse (Verdict: Background).
      *   *Crucial Detail:* If the Nurse *did not try* because they assumed the pager was enough, this is a **Live Omission**.
      *   *Assumption for Procedure:* Nurse did not attempt alternative contact.
  *   **Q3 (Counterfactual):** If Nurse had called mobile/ward phone, would Doctor have responded? Yes, presumably.
  *   **Q4 (Backup):** The dead pager is an independent failure.
  *   **Verdict:** **CONTRIBUTION.**
      *   *Reasoning:* The Nurse had a Live Omission (failed to use alternative contact). However, the Doctor's dead pager (independent failure) means the harm was overdetermined. If the Nurse had called, the Doctor might still not have heard it if the pager was the only alert method. But usually, a phone call bypasses a pager. If a phone call would have worked, it is a **CAUSE**. If the pager was the *only* mandated contact method, the Nurse is **BLOCKED** by the system design.
      *   *Panel Friction:* Departments will argue the Nurse should have known the pager was unreliable. The procedure forces you to ask: "Was there an alternative protocol?" If yes -> Cause. If no -> System Design Hand-off.

  #### Case 2: Maintenance / Muted Alarm
  *Scenario:* Maintenance skipped calibration on tank sensor. Independent high-level alarm had been muted months earlier by a *different* contractor.
  *   **Q1 (Duty):** Yes. Scheduled calibration is a duty.
  *   **Q2 (Capacity):** Yes. Tools and access were available.
  *   **Q3 (Counterfactual):** If calibrated, would sensor have read correctly? Yes. Would that have prevented harm? Only if the alarm sounded.
  *   **Q4 (Backup):** The high-level alarm was the backup. It was muted by a *different* party (Independent Failure).
  *   **Verdict:** **CONTRIBUTION.**
      *   *Reasoning:* This is a classic "Swiss Cheese" model. The Maintenance omission is a Live Omission. However, because an independent safety layer (the alarm) was also disabled (by another agent), the Maintenance omission was not the *sole* cause. It is a necessary condition, but not sufficient without the alarm failure.
      *   *Note on 'Borrowed':* Do not call this Borrowed. The Maintenance team did not "borrow" the omission. They failed their specific duty. The Alarm contractor failed theirs. Both are Contributions. Neither is the sole Cause unless one layer was deemed "The Primary Defense" in policy.

  #### Case 3: Consultant / Registrar (The Uncomfortable Verdict)
  *Scenario:* Consultant delegated scan review. Registrar reviewed and missed it. Consultant did not review. Counterfactually, nothing would have changed (Registrar missed it, Consultant would have too).
  *   **Q1 (Duty):** Yes. Consultant retains ultimate responsibility unless formally discharged (which is rare). Delegation is not abdication.
  *   **Q2 (Capacity):** Yes. Consultant had access to the scan.
  *   **Q3 (Counterfactual):** "If the Consultant had reviewed, would harm have been prevented?"
      *   *The Trap:* The panel wants to say "No, because the Registrar already missed it."
      *   *The Procedure:* Q5 (Fragility). "Is there evidence a competent Consultant would have detected the error *even if* the Registrar missed it?"
      *   *Evidence:* If the error is subtle and the Registrar is competent, maybe not. If the error is obvious to a Consultant but missed by a Registrar due to fatigue, then Yes.
      *   *Assumption:* Let's assume the error was detectable by a Consultant.
  *   **Verdict:** **CAUSE.**
      *   *Reasoning:* This is the verdict your panel will not like. The literature on omission supports this: The Consultant's duty is non-delegable regarding final safety. The Registrar's omission does not extinguish the Consultant's causal link. The harm occurred because the *system of review* failed. The Consultant is the final node.
      *   *Why it hurts:* It feels unfair to blame the Consultant if "nothing would have changed." But causation by omission is not about changing the *past* (the Registrar's action); it is about the *failure of the safety net* (the Consultant's review). If the safety net was supposed to catch what the first net missed, its failure is causal.
      *   *Mitigation:* If the panel finds the error was undetectable by *anyone*, Q5 triggers a **Background** verdict. But if it was detectable by the Consultant, it is a Cause.

  ---

  ### Part 4: What The Procedure Cannot Do

  You must be explicit with your panel about the boundaries of this tool.

  **1. It Cannot Prevent "Prevention Bias"**
  *   **The Risk:** Panels often reason backwards: "We need to fix this, so let's call it a Cause to trigger the action plan."
  *   **The Limit:** The OCF separates *Causation* (Phase 1-4) from *Prevention* (Hand-offs). You may find an omission is **Background** (e.g., a Blocked Omission due to staffing) but still flag it for **System Design**.
  *   **Instruction:** Do not upgrade a 'Background' finding to 'Contribution' just to force a policy change. Use the Hand-off mechanism instead. If you conflate the two, your insurance partners will challenge your findings.

  **2. It Cannot Adjudicate Disputed Norms**
  *   **The Risk:** The most contentious cases are not about what happened, but what *should* have happened. (e.g., "Was the staffing level safe?" or "Was the delegation appropriate?").
  *   **The Limit:** Q1 (Normative Anchor) requires an *existing* duty. If the duty itself is the subject of the investigation (e.g., "The protocol says 1:5 staffing, but we had 1:8"), the OCF stops.
  *   **Instruction:** When the norm is disputed, the verdict is **System Design Failure**. Do not attempt to rule on whether the norm was "reasonable." That is a strategic governance decision, not a factual causal finding.

  **3. It Cannot Resolve "Overdetermination" Fairly**
  *   **The Risk:** In Case 3 (Consultant/Registrar), logic suggests both caused the harm. But your reporting system likely forces a single primary cause or limits the number of 'Causes'.
  *   **The Limit:** The procedure identifies *all* causal omissions. It does not rank them by moral blameworthiness.
  *   **Instruction:** If the procedure identifies multiple 'Causes', record all of them. If your mandatory system forces a single choice, select the **most upstream Live Omission** (the Consultant), as that captures the system failure most accurately.

  ### Summary for the Chair
  This procedure protects you by forcing **evidence-based stops**. It prevents the panel from arguing about "what if" scenarios by anchoring every step to a protocol, a log, or a physical constraint. It isolates the 'Borrowed' omission problem by reclassifying it as 'Blocked' for the second agent and 'Live' for the first. Most importantly, it gives you the vocabulary to tell your panel: *"We are not deciding if this person is blameworthy today; we are deciding if their inaction meets the technical definition of causation required by the regulator."*
