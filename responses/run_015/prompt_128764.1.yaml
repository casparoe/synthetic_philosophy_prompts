prompt: |-
  I'm a software architect who works with event-sourced systems, eventually consistent read models, and distributed log aggregates. Restate Dennett's rejection of the Cartesian theater and his positive multiple-drafts model of consciousness using only that vocabulary -- events, streams, projections, materialized views, write conflicts, consumer groups, and consistency boundaries -- as precisely as you can. Then provide the residue report: what translates cleanly (for instance, the absence of a single canonical stream), what must be distorted to fit (for instance, treating a final draft as a strongly consistent read), and what has no architectural counterpart at all (for instance, the phenomenological quality of being a particular draft). In particular, address whether the homunculus is eliminated by distributing observation across consumer groups, or whether it reappears as the aggregate read model. Finally, tell me whether the philosophical disagreement about central observers survives the translation, or whether it collapses into a dispute about logical versus physical centralization that the distributed-systems framework already resolves.
