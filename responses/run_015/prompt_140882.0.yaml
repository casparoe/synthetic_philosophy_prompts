  Here is a map of the exposure of your "Archival-Capture Thesis" (ACT), ranked by the severity of the threat to its validity, followed by an analysis of concessions, falsifiability, and the specific counter-case you requested.

  ### 1. Map of Exposure: Decisive vs. Awkward Findings

  I have ranked these from **Fatal** (would require abandoning the thesis) to **Awkward** (requires nuance or scope limitation).

  **1. Fatal: The "Ideological Hegemony" Case**
  *   **Finding:** A historical episode where the loser's archives survived in quantity and were accessible to the victor's historians, yet the victor's narrative remained hegemonic for generations *solely* due to cultural or ideological prestige, not lack of source material.
  *   **Why Fatal:** Your thesis predicts that *material survival* drives the *narrative drift*. If the material is present but the narrative does not drift, the mechanism is not archival; it is interpretive or political. This collapses your thesis back into the traditional slogan ("winners slant the reading").
  *   **Confidence:** High. This is the logical negation of your core prediction.

  **2. Fatal: The "Myth Without Sources" Case**
  *   **Finding:** A case where the loser's archives were systematically destroyed, yet the loser's framing of events became the dominant historical account (e.g., via oral tradition, archaeology, or later political resurrection).
  *   **Why Fatal:** Your thesis argues that the *absence* of loser sources is the primary driver of victor dominance. If a loser narrative dominates *without* sources, then source survival is not the necessary condition for narrative survival.
  *   **Confidence:** High.

  **3. Awkward: The "Wehrmacht" Case (Your Example)**
  *   **Finding:** Defeated German officers wrote memoirs and operational histories (sources survived/were created post-war) that shaped Western accounts, *but* only because the US Army commissioned them (Cold War utility).
  *   **Why Awkward:** It sits on the boundary of your mechanism. Did the narrative shift because the *papers existed* (ACT) or because the *Victors paid for them to be written* (Traditional Slogan)?
  *   **Resolution:** This is awkward but not fatal if you can demonstrate that the *volume* of German paperwork (even uncommissioned) correlated with the drift. If the US Army ignored German papers until they needed a rearmament narrative, that hurts ACT. If they used the papers because they were the only ones *available* in detail, that helps ACT.
  *   **Confidence:** Medium. The causal chain here is tangled between material availability and political utility.

  **4. Awkward: The "Partial Survival" Problem**
  *   **Finding:** Cases where loser archives are partially destroyed (e.g., 50% survival).
  *   **Why Awkward:** Your thesis predicts a "drift" proportional to survival. Measuring "narrative drift" quantitatively is notoriously difficult. If the drift is small, is it because the archives were insufficient, or because historians are biased?
  *   **Confidence:** High (as an measurement issue).

