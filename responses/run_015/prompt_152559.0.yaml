          *   The "Burning Room" analogy is strong but has a flaw: Is a brain a collection of people?
          *   Mention the "Hemispherectomy" problem again: If you remove half the hardware and the software runs the same, was the hardware morally relevant? This challenges the "more neurons = more moral weight" linearity.
      *   **Analyze the Roommate's Position (Per Watt):**
