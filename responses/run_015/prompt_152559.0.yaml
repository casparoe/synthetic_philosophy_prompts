      *   *User's "10 people" analogy:* This is the "Sum Ranking" vs. "Person-Affecting" view. If I double the neurons, do I double the suffering, or do I just have one being suffering slightly "more broadly"? Most ethicists lean towards the latter (the organism is the unit).
      *   *Key Insight:* The debate is actually about the **Unit of Moral Concern**. Is it the *moment of experience* (User) or the *subject of experience* (Standard View)?

