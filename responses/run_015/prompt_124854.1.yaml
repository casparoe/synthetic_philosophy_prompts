answer: |-
  Here is a sequence of ten interview questions designed for a colloquium setting. They are structured to move from the jurisdictional foundations of the model to its mechanical stability, then to hidden power dynamics, and finally to systemic integration. The three mandatory thematic clusters are presented as contiguous pairs to ensure the dialectical pressure of the follow-ups is maintained.

  **1. The Jurisdictional Boundary**
  Your model hinges on a functional division of labor: the elected chamber manages "structurally transparent" policy, while the sortition chamber holds exclusive competence over "structurally opaque" domains. However, the classification of a policy problem as 'opaque' is often a rhetorical move used to shield contentious decisions from public scrutiny. How do you prevent the boundary between these two domains from becoming itself a site of political contestation, where the elected body strategically offloads high-risk, high-complexity failures to the sortition chamber to insulate itself from blame?

  **2. Follow-up: The Metric of Complexity**
  I anticipate you will respond that complexity can be objectively indexed, perhaps via causal density or time-lag metrics, thereby removing this classification from the political sphere. But if the indexing mechanism is designed by experts to determine the jurisdiction of a citizen assembly, are we not simply reintroducing technocracy through the back door? How can an objective metric of 'complexity' be established without embedding normative assumptions about which causal chains matter, and who gets to validate those assumptions?

  **3. Representational Drift**
  Let us turn to the temporal stability of the sortition chamber. You ground the legitimacy of this body in statistical mirroring of the demos at the moment of selection. Yet, in a system with staggered, multi-year terms, you face the problem of differential attrition: certain demographics may be more likely to resign, fall ill, or be disqualified over time than others. How do you mathematically guarantee that the chamber remains a statistically valid mirror of the populace throughout the legislative cycle, rather than suffering from 'representational drift' that systematically skews the descriptive composition?

  **4. Follow-up: Rotational Replacement**
  Your likely recourse here is to propose rotational replacement or frequent replenishment to correct for this drift. However, does not high-frequency rotation undermine the epistemic justification for the chamber? If members are rotated out before they can master the 'structurally opaque' material they are tasked with governing, does the model not collapse into a system of amateurism that is easily manipulated by permanent staff, thereby negating the epistemic advantage you claim over the elected body?

  **5. Displaced Elite Capture**
  Critics of sortition argue that random selection does not eliminate elite capture but merely displaces it upstream to the design of the stratification criteria and the facilitation protocols that guide deliberation. If the power to decide *which* strata matter (e.g., class, education, geography) and *how* agenda-setting occurs rests with a bureaucratic secretariat, does this not create a new oligarchy of procedure? How do you ensure that the architecture of the sortition process itself is not captured by the very interests the chamber is meant to check?

  **6. Follow-up: The Transparency Paradox**
  One might suggest that these design protocols should be subject to transparent, democratic ratification. Yet, if the design of the sortition mechanism is opened to electoral politics or public contestation, do you not undermine the very insulation from partisan manipulation that the model promises? Is there a coherent middle ground where the protocols are democratically legitimate without being subject to the democratic pressures that render the elected chamber epistemically deficient in opaque domains?

  **7. The Consent-Mirroring Gap**
  Moving to the normative foundation: you argue that statistical mirroring supplies sufficient legitimacy in the absence of explicit consent. However, in liberal democratic theory, legitimacy is typically tied to the authorization of power, not merely the resemblance of the ruler to the ruled. If a statistically representative group makes a decision that negatively impacts a specific minority within the demos, why is the 'mirror' argument sufficient to discharge the obligation of justification? Does descriptive representation truly substitute for the normative force of consent?

  **8. Inter-Chamber Conflict**
  In a bicameral system, deadlock is a standard feature, but your model institutionalizes a conflict of legitimacy types: one chamber claims a mandate via elections, the other via sortition. In the event of irreconcilable disagreement on a bill that straddles the boundary of opaque and transparent competencies, what is the adjudication mechanism? If the elected chamber can override the sortition chamber, the latter is advisory; if the sortition chamber can veto the elected, does this not create an undemocratic check on popular will as expressed through elections?

  **9. Deliberative Competence vs. Aggregation**
  Your defence relies on the assumption that a random sample, when properly facilitated, will deliberate toward a 'common good' interpretation of complex issues. However, social choice theory suggests that without shared epistemic frameworks, deliberation can often polarize groups or lead to information cascades dominated by the most vocal participants. What empirical or theoretical basis do you have for believing that a sortition chamber will aggregate wisdom rather than simply aggregating the pre-existing biases of the population in a slower, more expensive format?

  **10. Path Dependence and Transition**
  Finally, a question on feasibility and path dependence. Even if this model is theoretically superior, the transition requires the existing elected legislature to voluntarily cede authority over 'opaque' domains to a new sortition body. Given that 'opacity' is often where significant regulatory capture and rent-seeking occur, what is the mechanism of transition that does not rely on the very actors who benefit from the current opacity to legislate their own diminished competence?
