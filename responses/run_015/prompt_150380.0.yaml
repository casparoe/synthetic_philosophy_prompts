answer: |-
  okay so here's the plan for the session. don't explain the theory yet. just walk in and tell them we're running a simulation. if you start lecturing about Dennett or interface theory upfront, you ruin the effect—they need to feel the friction of the compression first.

  ### Activity: The Dashboard Protocol

  **Setup (5 mins)**
  split the 18 students into 4 groups (roughly 4-5 ppl each). give each group a folder labeled with their module name. tell them they are subprocesses of a single cognitive system. their job is to produce one single "Status Report" about the world outside.

  *   **Group 1: Sensory Input (SI)**
  *   **Group 2: Predictive Model (PM)**
  *   **Group 3: Language/Reporting (LR)**
  *   **Group 4: Executive Decision (ED)**

  hand out the **Raw World-Cards**. these are face down. tell them not to show the cards to other groups. ever.

  **The Scenario:**
  there is an object on the table in front of the Executive group. but nobody actually knows what it is yet.

  **The Cards (prepare these beforehand):**
  *   **SI Card:** "Visual data: Low resolution. Shape: Ambiguous. Color: Shifting between grey and blue."
  *   **PM Card:** "Context: Workshop. Memory Match: 85% probability this is a Hammer. Conflict: 15% probability it's a Gun."
  *   **LR Card:** "Available Labels: ['Tool', 'Threat']. Constraint: Must select one noun."
  *   **ED Card:** "Current Goal: Safety. Secondary Goal: Efficiency."

  **The Rules (5 mins)**
  1.  **No Raw Data:** You cannot show your card to other groups. You can only pass "Interface Pings."
  2.  **Compression:** An Interface Ping must be exactly one sentence. No qualifiers like "maybe" or "I think." It must sound definitive (e.g., "The object is stable," not "It looks kinda stable").
  3.  **Consensus:** The Executive group must draft the final **Unified Experience Report**. All groups must sign it.
  4.  **Win Condition:** The group gets points if the report is coherent and submitted within 15 mins. Accuracy to the raw cards does *not* matter. In fact, if you highlight contradictions, you lose time.

  **The Simulation (20 mins)**
  groups talk amongst themselves, then send messengers to other groups with their Interface Pings.
  *   *SI* wants to say "it's blurry."
  *   *PM* wants to say "it's a hammer."
  *   *LR* wants to say "it's a threat."
  *   *ED* wants to say "run away."

  they're gonna struggle. to win, they have to smooth over the cracks. SI has to agree to pretend the vision is clear. PM has to ignore the gun probability. LR has to pick the label that fits the goal. they will inevitably lie about their raw data to make the story fit.

  once they sign the Unified Experience Report (e.g., "I see a dangerous tool"), collect it.

  **The Reveal (10 mins)**
  this is the kicker. have everyone put their cards face up on a central table.
  read the Raw Cards out loud next to the Unified Report they just wrote.
  point out how much data got deleted. the blurriness is gone. the probability conflict is gone. the label ambiguity is gone.
  ask them: "why did you erase the blur?" they'll say "because we needed to decide."
  that's the illusion. the user interface doesn't show you the buffer errors, it shows you the icon.

  **Debrief (50 mins)**
  now you can talk theory. use their frustration as the anchor.
  *   **The Interface Ping = Phenomenal Experience.** It's clean, simple, and feels real.
  *   **The Raw Cards = Unconscious Computation.** Messy, probabilistic, contradictory.
  *   **The Rule Against Showing Cards = Transparency.** You can't look behind the screen while using the screen.
  *   **The Win Condition = Evolutionary Pressure.** We weren't rewarded for truth, we were rewarded for actionable coherence.

  **Predictable Failure**
  someone in the Executive group is gonna try to act like a "little man in the head" (homunculus). they'll try to demand the raw cards. or, someone in Sensory Input will refuse to compress and keep saying "but it's actually blurry!" which stalls the game. let this happen. it proves the point—the system hates noise. if someone peeks at another group's cards, call a "system error" pause and highlight that breach of encapsulation.

  **Uncapturable Feature**
  be honest with them: this game is structural. it shows how the *report* is constructed, but it doesn't simulate the *hurt* or the *redness*. the game creates a consensus statement, but it doesn't create qualia. the players know they are lying; a real conscious system feels like it's telling the truth. you can't gamify the "what it is like" part, only the architecture around it.

  also, watch the time. 90 mins goes fast when people argue about semantics.

