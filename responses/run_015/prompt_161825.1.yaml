answer: |-
  Here is a principle designed to capture your intuitions while resolving the tension between your "motive" case and your "coalition" case. I have formulated it to be precise enough for application, followed by the test case and the critique of your current verdicts.

  ### The Principle of Corroborated Humanitarian Necessity

  An intervention is justified if and only if it satisfies all four of the following conditions:

  1.  **Supreme Emergency:** There is objective evidence of ongoing or imminent mass atrocity (killing, expulsion, or enslavement on a large scale) that the host state is perpetrating or permitting.
  2.  **Net Rights Reduction:** The intervention is the least rights-violating means likely to succeed, and the foreseeable harms caused by the intervention (including blowback and collateral damage) do not outweigh the harms it prevents.
  3.  **Intersubjective Validation:** The determination that Conditions 1 and 2 are met is corroborated by at least one independent political actor (e.g., a coalition partner, a regional body, or the UNSC), **unless** seeking such validation would, with high probability, allow the atrocity to succeed.
  4.  **Fidelity to Mandate:** The intervening force commits to using force only to the extent necessary to halt the atrocity. Expansion of the mission (e.g., to regime change) requires new validation under Condition 3.

  ***

  ### How this principle handles your cases

  *   **Kosovo (1999):** **Justified.** Meets *Supreme Emergency*. Meets *Intersubjective Validation* (NATO coalition, despite lack of UNSC). Meets *Fidelity* (stopped expulsion, did not occupy indefinitely).
  *   **Iraq (2003):** **Not Justified.** Fails *Supreme Emergency* (no ongoing massacre in 2003). Fails *Net Rights Reduction* (false premises increased risk).
  *   **Libya (2011):** **Mixed.** The opening phase is **Justified** (meets all 4). The slide to regime change **Violates Fidelity** (Condition 4). Your principle allows you to say the *initiation* was just, but the *continuation* became unjust. It does not retroactively taint the lives saved in Benghazi, but it renders the final outcome illegitimate.
  *   **Mixed Motives (Oil + Rescue):** **Justified.** The principle is agnostic on internal psychology. It looks at *objective evidence* (Condition 1) and *corroboration* (Condition 3). If the oil motive doesn't alter the conduct or the necessity, it is irrelevant.
  *   **Invitation + Foreseeable Atrocity:** **Not Justified.** Fails *Net Rights Reduction* (Condition 2). You cannot claim to reduce rights violations if you foreseeably enable more violations by the host government. Consent does not override the duty to not facilitate atrocity.
  *   **Unilateral vs. Coalition:** **Coalition Justified; Unilateral Presumptively Unjustified.** This is where the principle does its heavy lifting.

  ***

  ### The New Case: Arming Rebel Groups

  **Scenario:** A state arms a rebel group to stop a government massacre. The rebels will probably stop the massacre but will probably commit some atrocities themselves.

  **Prediction:** **Not Justified (or highly conditional).**

  **Why:**
  1.  **Net Rights Reduction (Condition 2):** This is the failure point. By arming a proxy, the intervener loses control over the *means* of force. If the rebels are *foreseeably* going to commit atrocities, the intervener is causally responsible for those rights violations. Unlike direct intervention, where the intervener bears the cost of compliance with International Humanitarian Law, proxy warfare externalizes that cost.
  2.  **Fidelity to Mandate (Condition 4):** Rebels often have political aims beyond stopping the massacre (e.g., taking power). Arming them makes it difficult to restrict the mission to humanitarian protection.

  **Verdict:** You may only arm them if you have effective command-and-control authority over them to prevent their atrocities. If you cannot control them, you cannot justify enabling them.

  ***

  ### The Verdict You Must Give Up

  You asked me to tell you honestly which of your verdicts is the weakest. You must soften your verdict on the **Unilateral Intervention** case.

  **Your current view:** Identical conduct/outcome, but one state acting alone = **Not Justified.**
  **The Conflict:** This contradicts your view on **Mixed Motives.**

  **The Reasoning:**
  In the *Mixed Motive* case, you adopt a **consequentialist** stance: *If the outcome is good (lives saved), the internal state of the actor (greed) doesn't matter.*
  In the *Unilateral* case, you adopt a **deontological/procedural** stance: *Even if the outcome is good, the procedure (one state deciding alone) makes it wrong.*

  You cannot hold both positions firmly without contradiction. If motives don't matter because "what justifies an intervention is what it does," then the number of flags flying over the troops shouldn't matter *if the conduct and outcome are truly identical.*

  **Why the Unilateral Verdict is the weak link:**
  Your objection to unilateralism is actually an **epistemic** objection, not a moral one. You distrust unilateralism because single states are prone to self-deception, error, or hidden agendas. That is why Condition 3 (*Intersubjective Validation*) exists in my principle: it is a reliability check.

  However, in your thought experiment, you stipulated **identical conduct and outcome.** You have removed the risk of error and abuse by fiat. If we *know* the outcome is identical and the atrocity was real, rejecting the intervention solely because it was unilateral prioritizes **process over lives.**

  **The Correction:**
  You should change your verdict from "Not Justified" to **"Presumptively Unjustified, but Justifiable under Certainty."**
  Unilateralism should be a *last resort* exception to the Validation clause (as written in Condition 3 of the principle above). If a single state acts alone because waiting for a coalition would mean the massacre succeeds (the "Kosovo" exception), it can be justified.

  If you insist that unilateralism is *never* justified even with identical outcomes, you are admitting that **legitimacy matters more than human life.** That is a defensible position, but it contradicts your gut verdict on Kosovo (where legitimacy was thin) and your consequentialism on Motives.

  **Summary Advice:**
  Keep your motive intuition (consequences matter most). Keep your skepticism of unilateralism (it's usually dangerous). But admit that if the *consequences* are guaranteed good, the *procedure* cannot be an absolute veto. That resolves the tension between your Case 4 and Case 5.
