answer: |-
  To run this session effectively you will need three clear jars filled with distinct items like pennies or beans, though using photographs of jars projected on a screen is logistically safer for controlling exactly what evidence each student receives. You will also need index cards or slips of paper for estimates, a projector if using images, and a way to track points that feels tangible without involving money, such as a leaderboard on the board where points translate to a small end-of-semester privilege like choosing a reading topic or receiving a high-quality chocolate bar. The core mechanic relies on accuracy scoring where each student starts with one hundred points and loses one point for every unit their estimate differs from the true count, which incentivizes precision without encouraging risk-seeking behavior. You should prepare the visual materials in advance such that for half the class you display identical images of the same jar to paired students without telling them the images are identical, while the other half sees genuinely different angles or lighting conditions that constitute independent evidence. For the second wrinkle involving a subset of pairs, you will need a second set of images where some students receive a genuinely new angle while others receive a duplicate of their first image disguised as a second look, creating a situation where one partner has strictly better evidence but neither knows for sure who holds the advantage.

  The eighty minutes should be segmented carefully to allow the epistemic tension to build before you resolve it. Spend the first ten minutes distributing materials and explaining the rules without using any epistemological terminology, framing the activity simply as an estimation challenge where accuracy yields points. From minute ten to twenty-five have each student record a private initial estimate based on their assigned image, ensuring they understand this is their baseline credence. Between minute twenty-five and forty-five pair the students up and allow them to share their initial estimates and reasoning, then require them to submit a revised estimate, reminding them that their final score depends on this second number while you circulate to ensure they discuss why they might change their mind without guiding them toward any specific strategy. During this phase you should quietly note which pairs received identical evidence versus independent evidence so you can reference this later without revealing it yet. From minute forty-five to fifty-five introduce the meta-disagreement round where you announce that some pairs have discovered a rule conflict, telling half the room that the correct procedure is to average estimates with any peer who disagrees, and telling the other half that the correct procedure is to stick with their own evidence unless proven wrong, then ask them to argue for their assigned rule within their pairs. Use minutes fifty-five to sixty-five to reveal the true count of the jars and calculate the scores, allowing a moment for triumph or frustration depending on how the hidden evidence distribution affected their accuracy. The final fifteen minutes are reserved for the debrief where you finally introduce the terms conciliationism and steadfastness, mapping the earlier activities onto the philosophical concepts.

  In the debrief you must connect the mechanical experience to the theoretical framework by first asking students why some pairs found that meeting in the middle worked while others found it degraded their accuracy, using this to introduce the independence condition and the distinction between first-order evidence regarding the jar and higher-order evidence regarding the partner's reliability. You should explain that the pairs who saw identical images were trapped in a double-counting error where averaging treated dependent evidence as independent, which mirrors the philosophical worry that conciliationism can fail if peers are not truly epistemic equals. When discussing the meta-disagreement round, highlight the self-undermining worry where students who were told to average estimates had to average with partners who were told to stick to their guns, creating a situation where following the conciliationist rule required abandoning the rule when faced with a steadfast partner, which illustrates the spinelessness charge that extreme conciliationism might dissolve its own normative force. You should be honest with the class that the game is a simplification and that while jar counts have a single truth value, moral and religious disagreements often lack such clear resolution conditions, meaning the leap from this seminar game to real-world dissent requires additional argumentation about whether moral peers exist in the same way estimation peers do.

  You should also anticipate specific failures in the execution so you are not caught off guard when the game does not run perfectly. It is highly likely that at least one student will spot the duplicate image trick especially if you are using projected photos where pixel patterns might match, and you should have a prepared response that validates their observation as a success in evidence gathering rather than a failure of your deception. Another common issue is that some students will average mechanically without engaging in the epistemic reasoning you hope for, simply splitting the difference to save cognitive effort, and you can use this in the debrief to distinguish between algorithmic conciliation and genuine belief revision based on higher-order evidence. There is also the risk that the scoring system becomes too competitive, causing students to hide information rather than share it, so you must emphasize during the instructions that the goal is collective accuracy or that the prize is distributed based on improvement rather than raw score. Finally, acknowledge to yourself that the game cannot fully resolve the debate between conciliationism and steadfastness because the jar example relies on perceptual evidence that is easily verified at the end, whereas real philosophical disagreements often persist precisely because the truth is not revealed at the end of the class, meaning you will need to verbally bridge that gap by asking students to imagine the jars were never opened and they had to rely solely on the disagreement itself to form a belief. By keeping the terminology withheld until the final ten minutes you ensure that their intuitions are generated organically rather than shaped by preconceived notions of what they are supposed to believe, allowing the self-undermining worry to feel like a discovered paradox rather than a lectured conclusion.
