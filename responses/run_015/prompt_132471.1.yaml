answer: |-
  This slogan is a compressed version of **Galen Strawson's "Basic Argument."** Your friend is using one sentence to smuggle in a regress argument about ultimate responsibility.

  Here is the menu of distinct readings, ordered from trivial to radical, followed by the mapping to his conclusions and your test cases.

  ### Part 1: The Menu of Readings

  | # | Reading Name | "The Way You Are" (Scope) | "Because Of" (Relation) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Rational Agency Claim** | Your occurrent beliefs, desires, and intentions at *t*. | Rational explanation (the action makes sense given these states). | **Platitude.** No compatibilist denies this. It describes agency, not its absence. |
  | **2** | **The Character Causation Claim** | Your standing traits, dispositions, and character at *t*. | Causal sufficiency (character + situation → action). | **Substantive & Defensible.** Most actions flow from character, but allows for "out of character" exceptions. |
  | **3** | **The Historical Causation Claim** | Your character *plus* the history that formed it up to *t*. | Causal determination by past states (including past self-shaping). | **Substantive & Shaky.** Ignores the capacity for synchronous self-control; assumes past self is just another external cause. |
  | **4** | **The Ultimate Sourcehood Claim** | Your total causal ancestry (genes, environment, luck, *and* character). | Explanation by factors for which you are not **ultimately** responsible. | **Radical.** Requires the extra premise that to be responsible, you must be the *cause of yourself* (infinite regress). |

  ---

  ### Part 2: Delivering the Conclusions

  Your friend draws two conclusions. Here is which readings actually support them.

  | Conclusion | Reading 1 (Rational) | Reading 2 (Character) | Reading 3 (Historical) | Reading 4 (Ultimate Source) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A: Nobody ever deserves blame.** | **Fails.** Rational agency is usually the *basis* for blame. | **Fails.** Compatibilists ground responsibility precisely here. | **Partial.** Only works if you assume we can't influence our history. | **Succeeds.** If you must be the ultimate source of your character to be responsible, no one passes the test. |
  | **B: Determinism is irrelevant.** | **Fails.** Assumes a standard causal framework. | **Fails.** Relies on deterministic links between character and act. | **Fails.** Relies on deterministic links between history and character. | **Succeeds.** Whether your character was determined by the past or shaped by randomness, *you* didn't choose the initial parameters. Randomness doesn't grant control. |

  **The Missing Premise:**
  You suspected an extra premise is needed for Conclusion A and B. You are correct. Reading 4 only works if you accept the **Principle of Ultimate Responsibility (PUR)**: *To be morally responsible for an action, you must be responsible for the factors (character/motives) that caused it.* Since you cannot be responsible for your initial nature (genetics/early environment), and any subsequent changes depend on that initial nature, you can never be responsible.

  ---

  ### Part 3: Verdicts on Your Test Cases

  Here is how the readings discriminate between your cases.

  #### Case 1: The Bootstrapper (Ada shapes herself over 30 years)
  *   **Reading 1 (Rational):** **Responsible.** She acted on reasons (hatred of cowardice) to change her behavior.
  *   **Reading 2 (Character):** **Responsible at 50.** Her action at 50 flows from her *chosen* character, even if her character at 20 was unchosen.
  *   **Reading 3 (Historical):** **Ambiguous.** It acknowledges the history, but if "because of" implies rigid determination, it suggests she was pushed by her 20-year-old self.
  *   **Reading 4 (Ultimate Source):** **Not Responsible.** This reading forces the **all-or-nothing verdict**. Because the series starts with a character at 20 she had "no hand in," every subsequent step is tainted by that initial lack of control. The "bootstrapping" is illusory; she can only lift herself by the straps she was born with.

  #### Case 2: The Coin-Flip Shaper (Indeterministic neural tie-break)
  *   **Reading 1 & 2:** **Responsible.** She noticed the shift and *deliberately consolidated it*. The randomness was raw material; her agency was the consolidation.
  *   **Reading 4 (Ultimate Source):** **Not Responsible.** This is the crux of your friend's "Determinism is Irrelevant" claim.
      *   If the action is determined by character: You didn't choose the character.
      *   If the action involves randomness (the coin flip): You didn't choose the randomness.
      *   **Verdict:** On Reading 4, the sentence *still applies*. "The way you are" includes your neural lottery. Doing something because of a random neural tie-break is not an exercise of control. Therefore, indeterminism adds no responsibility.

  ### Summary for your Group
  *   **Readings 1–3** are compatible with moral responsibility. If your friend means these, his conclusions don't follow.
  *   **Reading 4** is the only one that supports his conclusions.
  *   **The Catch:** Reading 4 requires the **Principle of Ultimate Responsibility**. If your group rejects the idea that you must be the *cause of yourself* to be responsible, Reading 4 collapses, and the slogan loses its power to eliminate blame.
  *   **On Determinism:** Your friend is right *only if* you accept Reading 4. Indeterminism (Case 2) does not solve the "Ultimate Source" problem; it just replaces "determined by past" with "random luck," neither of which you control.
