answer: |-
  This is a classic demarcation problem, and your friend is right to be suspicious of appeals to pure authority. In the philosophy of science, relying solely on "academics say so" is an argumentum ad verecundiam (appeal to authority), which is a logical fallacy. However, the conclusion that there is *no* line is also untenable. The distinction between history and pseudohistory isn't a bright, binary switch; it is a cluster concept based on methodological rigor, epistemic humility, and consilience.

  Let's break down the criteria you mentioned, apply them to the 2012 phenomenon and Fomenko's New Chronology, and see where the line actually holds and where it blurs.

  ### The Demarcation Criteria in Historiography

  Before applying them, we need to refine what these mean in a historical context, as they differ from laboratory science.

  1.  **Source Criticism:** This is the bedrock of history. It involves establishing provenance, context, bias, and the chain of transmission. Pseudohistory tends to treat sources as transparent windows to truth or cherry-picks data that fits a preconceived narrative while ignoring context.
  2.  **Coherence (Consilience):** A historical claim must fit with established knowledge in adjacent fields (archaeology, linguistics, genetics, astronomy). If a historical theory requires physics to be wrong, or linguistics to be unrelated to migration patterns, the burden of proof skyrockets.
  3.  **Falsifiability:** In history, we can't run controlled experiments. Falsifiability here means: "What evidence *would* change your mind?" Pseudohistory often creates "immunizing stratagems"—if evidence contradicts the theory, the evidence is claimed to be part of the conspiracy or misinterpreted, rendering the theory unfalsifiable.
  4.  **Methodological Naturalism:** In science, this means no supernatural causes. In history, it's closer to **Methodological Uniformitarianism**: we assume past humans acted with similar cognitive and cultural constraints as present humans. We don't assume ancient people had lost technologies or knowledge that vanish without a trace unless there is material evidence.
  5.  **Quantitative Methods:** Math offers an illusion of objectivity. In history, quantitative analysis is valid only if the input data is historically sound. Garbage in, garbage out.

  ### Case Study 1: The 2012 Mayan "Doomsday"

  **The Claim:**
  The proponents (largely New Age authors and pop-documentarians, not Mayanists) claimed that the end of the 13th Bak'tun in the Mayan Long Count calendar (December 21, 2012) predicted a global cataclysm or a shift in consciousness.

  **The Source:**
  The primary archaeological anchor was **Monument 6 from Tortuguero**. The inscription mentions the 13th Bak'tun ending. However, the glyph describing *what happens* on that date is damaged (a lacuna).

  **The Academic Response:**
  Mainstream epigraphers and archaeologists argued that:
  1.  **Source Criticism:** The text is broken. Filling that gap with "end of the world" is speculation, not translation. Other Mayan texts reference the 13th Bak'tun as a routine cycle completion, akin to an odometer rolling over, not an apocalypse.
  2.  **Coherence:** There is no archaeological evidence of mass panic, ritual preparation for the end of the world, or cessation of construction in the Post-Classic period leading up to 2012. The material record shows continuity, not eschatological anxiety.
  3.  **Falsifiability:** When the date passed without physical catastrophe, proponents shifted to "spiritual transformation." This is an immunizing stratagem. The original claim was falsified; the revised claim is unfalsifiable.

  **Criterion Analysis:**
  *   **Source Criticism:** This is where the line is clearest. Academics treated the inscription as a fragment requiring contextual corroboration. Pseudohistorians treated the fragment as a complete statement.
  *   **Methodological Naturalism:** Interestingly, this criterion is **silent** here. The claim wasn't about violating laws of physics (initially); it was about cultural interpretation. Whether time is cyclical or linear is a metaphysical or cultural question, not a naturalistic one. Naturalism doesn't rule out that the Maya *believed* in a cataclysm, but source criticism rules out that they *predicted* one in this specific text.
  *   **Institutional Authority:** The public perceived the academics as "gatekeepers" denying a mystical truth. But the academics weren't saying "It can't happen"; they were saying "The text doesn't say that." The authority was derived from linguistic competency, not social status.

  ### Case Study 2: Fomenko's New Chronology

  **The Claim:**
  Anatoly Fomenko argues that conventional chronology is wrong by roughly 1,000 years. He claims ancient history (Rome, Greece, Egypt) is a medieval fabrication. Jesus, for example, is placed in the 12th century AD.

  **The Method:**
  Fomenko uses statistical analysis of astronomical data in chronicles and the volume of text written per year. He argues that "duplicate" kingdoms in history are actually the same events recorded twice.

  **The Label:**
  It is universally labeled pseudohistory by professional historians and scientists.

  **Criterion Analysis:**
  *   **Quantitative Methods:** This is the crux of your question. Does math change the criteria? **No.** Fomenko uses math to lend scientific authority to historical premises that are flawed. He treats historical chronicles as data points without accounting for literary genre, copying errors, or political propaganda. The math is internally consistent, but the *inputs* are historically naive. This shows that quantitative rigor does not save a theory from qualitative historical error.
  *   **Coherence (Consilience):** This is where Fomenko fails hardest. To accept New Chronology, you must reject dendrochronology (tree rings), radiocarbon dating, ice core samples, linguistics, and genetics simultaneously. These fields are independent. For history to be compressed by 1,000 years, the physical record of the earth would also have to be falsified. The lack of consilience is the strongest demarcation marker here.
  *   **Falsifiability:** Fomenko's system is flexible enough to reinterpret any anomaly as a "duplicate" or "forgery." If a carbon date contradicts him, the sample is contaminated. If a text contradicts him, it's a later interpolation. This immunity to counter-evidence is a hallmark of pseudohistory.

  ### The "Gatekeeping" vs. "Real Line" Question

  Your friend argues that the distinction is just academics protecting their authority. There is truth to the sociological aspect: institutions do protect their paradigms. Thomas Kuhn showed that normal science resists anomalies. However, resistance to anomalies is not the same as pseudohistory.

  **Where the Line is Real:**
  The line exists in the **willingness to be constrained by evidence.**
  *   In the 2012 case, Mayanists admitted the Tortuguero text was broken. They accepted the limit of their knowledge. Pseudohistorians filled the gap with certainty.
  *   In the Fomenko case, historians accept the constraints of carbon dating and linguistics even when it complicates their narrative. Fomenko discards constraints that don't fit his statistical model.

  **Where the Theory Breaks Down (The "Silence"):**
  1.  **Underdetermination:** In history, evidence is always incomplete. Two legitimate historians can look at the same sources and draw different conclusions. Pseudohistory exploits this gap. There is no algorithm to perfectly distinguish a "bold new interpretation" from "pseudohistory" in the moment. Time often acts as the final filter.
  2.  **Methodological Naturalism:** As noted in the 2012 case, this criterion is often irrelevant in history. History deals with human meaning, which is subjective. A claim about "spiritual shifts" isn't unnatural, it's just historically unsupported. Philosophy of science criteria borrowed from physics sometimes fail to map onto historiography.
  3.  **The Role of Math:** The Fomenko case proves that quantitative methods do not bypass source criticism. In fact, "math-washing" is a common pseudohistorical tactic to evade qualitative scrutiny. The criterion of "coherence" bites harder than "methodology" here. A mathematically precise model of a fantasy is still a fantasy.

  ### Conclusion

  Is there a real line? Yes, but it is not defined by *who* is speaking (academics vs. outsiders), but *how* they handle the constraints of evidence.

  The "gatekeeping" charge is partially valid in that institutions can be slow to accept paradigm shifts. However, pseudohistory is distinguishable because it systematically ignores the **cost of the claim.**
  *   When a Mayanist says "We don't know what the broken glyph says," they are paying a cost (admitting ignorance).
  *   When a 2012 proponent says "It means the end of the world," they are ignoring the cost (the broken text).
  *   When Fomenko says "Chronology is wrong," he is ignoring the cost (rejecting all independent dating methods).

  The demarcation is not a wall; it's a gradient of epistemic responsibility. Pseudohistory is characterized by a low cost of assertion and a high immunity to correction. Academics are gatekeepers, yes, but their gate is built out of source criticism and consilience, not just social status. If an outsider comes in who respects source criticism, admits uncertainty, and aligns with material evidence (like Schliemann finding Troy, initially dismissed), the gate opens. The 2012 and Fomenko cases show that the gate didn't close because of authority; it closed because the methods used to open it didn't fit the lock.
