answer: |-
  Right, take a breath. You've got the core intuition down; the messiness is just the friction of turning a complex idea into a rigid instrument. That's normal. Below is the decision tree you asked for. It is designed to bypass self-identification and sort by the structural work the narrative performs.

  I have kept this to five nodes, phrased as phenomenological questions a student can answer by observing the text or speech act. I have used British English throughout. Following the tree, I have noted the indistinguishable pairs and the logically empty cells as requested.

  ### The Decision Tree: Typology of Lost Cause Narratives

  **Node 1**
  Is the event narrated primarily as a military or political capitulation?
  *   **Yes:** Proceed to Node 2. (e.g., Confederacy, Kosovo, Masada)
  *   **No:** Proceed to Node 5. (e.g., Dunkirk, often framed as extraction/salvation)

  **Node 2**
  Is the narrative mobilised to legitimise an existing state apparatus or social hierarchy?
  *   **Yes:** **Leaf A: Functionalist Consolidation.** (The defeat is used to unify the victors or justify the post-war order, e.g., the Lost Cause serving Jim Crow).
  *   **No:** Proceed to Node 3.

  **Node 3**
  Is the narrative mobilised by a group currently lacking sovereign power?
  *   **Yes:** Proceed to Node 4. (e.g., 19th-century Serbian nationalists, pre-state Zionists)
  *   **No:** **Leaf B: Traumatic Repetition.** (The group has power or neutrality but refuses to instrumentalise the loss, remaining in unresolved grief).

  **Node 4**
  Is the loss framed as a necessary sacrifice guaranteeing future victory or statehood?
  *   **Yes:** **Leaf C: Counter-hegemonic Substrate.** (The defeat becomes the seed for future sovereignty, e.g., Masada).
  *   **No:** **Leaf B: Traumatic Repetition.** (The loss remains a wound without teleological promise).

  **Node 5**
  Is the event framed as a strategic sacrifice rather than a failure?
  *   **Yes:** **Leaf D: Pyrrhic Strategic Myth.** (Material loss is accepted but spun as a strategic necessity for survival, e.g., Dunkirk).
  *   **No:** **Leaf E: The Empty Cell.** (See analysis below).

  ***

  ### Instrument Notes & Limitations

  **1. Indistinguishable Pairs (The Dunkirk–Kosovo Problem)**
  If a respondent answers **Yes** to Node 1 regarding Dunkirk (insisting it was a military defeat despite the 'miracle' framing), the tree forces it into the same branch as Kosovo. At Node 2, if the British state is considered the 'existing apparatus', Dunkirk could theoretically collapse into **Functionalist Consolidation**. However, because Dunkirk is rarely used to justify hierarchy in the way the Confederacy is, it usually slides to Node 5 via the **No** path at Node 1. The distinction relies entirely on whether the student perceives the *narrative framing* or the *historical fact*. If they prioritise historical fact, Dunkirk and Kosovo become indistinguishable at Node 1.

  **2. Logically Possible but Unoccupied Combos**
  *   **The Apolitical Stance (Leaf E):** This cell represents a narrative of defeat that is neither capitulation nor sacrifice, serves no state legitimacy, offers no future hope, and is not held by a subaltern group. In practice, this is empty. Collective memory regarding defeat is almost invariably political. If a group remembers a loss without instrumentalising it (neither for state power, nor future hope, nor strategic spin), it tends to cease being a public narrative and becomes private grief or archival data. You likely will not find a robust national myth here.
  *   **The Hegemonic Trauma:** There is a theoretically possible path where a state (Node 2: Yes) refuses to instrumentalise the defeat for legitimacy (Node 2: No) but also lacks the subaltern drive for future statehood. This results in **Traumatic Repetition** within a state entity (e.g., post-Vietnam US memory in certain contexts, or post-1918 Germany before the Nazis repurposed it). This is rare; states usually seek to resolve trauma via Functionalist Consolidation or Pyrrhic Myth.

  **3. Usage Guidance**
  Tell your students to answer based on the *text before them*, not the historical event. If the text says 'Dunkirk was a defeat', they must answer **Yes** at Node 1, even if history is ambiguous. This ensures you are sorting the *memory work*, not the history.

  Hope this helps clear the fog. It's a solid framework; trust the instrument.
