answer: |-
  1. **Preliminary clarifications**
  Two terms require tightening before assessment. First, in (2), distinguish between a *regulative* norm (a rule you can break, like "don't lie") and a *constitutive* rule (a rule that defines the act, like chess moves). Your view seems to treat the norm of assertion as constitutive of sincerity, which strengthens the explanation of absurdity. Second, in (5), "same expressive function" is ambiguous. Does it mean asserting "p" and "I believe p" have identical semantic content, or merely that they commit the speaker to the same state of affairs? If you mean semantic identity, (1) is threatened. If you mean pragmatic commitment, (5) is safer. Clarifying whether you view belief as a prior mental state governing assertion (realism) or a disposition constituted by assertion (expressivism) will also help locate metaphysical commitments hidden in (4).

  2. **Apparent tensions that dissolve**
  Claims (1) and (2) often appear contradictory but are not. (1) concerns truth-conditions (semantics), while (2) concerns assertion-conditions (pragmatics). A sentence can be true (semantics) yet unassertable (pragmatics), much like "I am not speaking" is true but cannot be spoken. There is no conflict here; you are correctly distinguishing logical contradiction from pragmatic absurdity. Similarly, (2) and (3) cohere perfectly. The norm in (2) applies to the *present* act of assertion. In the past-tense case (3), you are not currently expressing a belief about the past rain via the second conjunct; you are reporting a past lack of belief. Since the current assertion violates no norm regarding your current state of mind, the absurdity vanishes. These pairs demonstrate a robust grasp of the indexical nature of Moorean sentences.

  3. **Genuine tensions, ranked by severity**
  **1. (1) vs. (5) — Severity: Fatal.**
  If asserting "p" and "I believe p" serve the *same* expressive function (5), they risk becoming semantically equivalent. If they are equivalent, "p but I don't believe p" translates to "I believe p but I don't believe p," which is a logical contradiction. This violates your non-negotiable claim (1). To maintain (1), you must argue that while both express belief, only the latter *describes* it, preserving a gap between content and expression.

  **2. (4) vs. (5) — Severity: Serious.**
  Claim (4) denies metaphysical implications, but (5) asserts a specific theory of first-person authority (expressivism over epistemic access). Arguing that self-knowledge is constituted by expressive practices rather than inner observation *is* a metaphysical claim about the mind. You cannot consistently hold an expressivist theory of authority while denying the paradox reveals anything about belief metaphysics. (5) entails a metaphysics of transparency that (4) explicitly rejects.

  **3. (2) vs. (5) — Severity: Manageable.**
  (2) treats belief as a pre-existing state that norms govern ("assert only what you believe"). (5) suggests belief is expressed *in* the assertion. If belief is merely a disposition to assert, the norm in (2) becomes circular (assert what you are disposed to assert). However, this is manageable if you view the norm as regulating the *sincerity* of the expression rather than the existence of a prior state.

  4. **Least costly revision**
  You should revise claim (4). Abandoning the denial of metaphysical implications costs little intellectually but resolves the serious tension with (5). By admitting that Moore's paradox *does* reveal something about the metaphysics of belief—specifically, that first-person belief attribution is constitutive rather than evidential—you strengthen your overall position. This aligns with Wittgensteinian and Shoemakerian readings of the paradox. To protect (1) from (5), simply qualify (5): assert that "p" and "I believe p" have parallel *commitments* without identical *content*. This preserves the logical consistency of (1) while allowing (5) to explain authority. Revising (4) transforms your view from a purely pragmatic account to a robust constitutive one, which is philosophically more defensible.

  5. **Overall assessment**
  Your package is largely defensible and demonstrates sophisticated intuition about the semantics/pragmatics distinction. However, the denial of metaphysical implications (4) is unstable given your expressivist account of authority (5). By owning the metaphysical commitments inherent in (5) and clarifying that "same function" does not mean "same content," you can resolve the fatal tension with (1). With these adjustments, this is a strong, coherent position suitable for presentation.
