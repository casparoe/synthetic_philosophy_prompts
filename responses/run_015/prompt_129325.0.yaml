      *   **Thesis 2 (Anti-Humean/Primitivist Chance):** Chances are real modal weights, not just summaries of frequencies. This means chances exist even in single cases and aren't undermined by the actual outcome differing from the probability.
      *   **The Conflict:** If I know $E$ happened, my credence in $E$ should be 1 (or close to it). But if PP applies, and I know $Ch(E)=0.3$, and my evidence is "admissible," my credence should be 0.3. This is the classic problem of the "Principal Principle vs. Known Outcome."
