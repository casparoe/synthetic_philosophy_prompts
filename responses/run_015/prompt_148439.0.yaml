answer: |-
  Here is a decision tree designed to sort your moral intuitions on the Williams integrity objection. It treats moral positions like architecture: looking for load-bearing walls and potential single points of failure.

  ### The Integrity Decision Tree

  **Node 1: The Concrete Case**
  In the drowning scenario (Spouse vs. 2 Strangers), is saving your spouse morally permissible even if it results in a net loss of life?
  *   **No** → Go to **Node 2** (The Utilitarian Path)
  *   **Yes** → Go to **Node 4** (The Integrity Path)

  **Node 2: Utilitarian Absorption**
  Can the permission to favor loved ones be fully explained by "long-term utility benefits of loyalty" (Indirect Utilitarianism)?
  *   **No** → **Leaf A: Hard Act Utilitarian**
  *   **Yes** → Go to **Node 3**

  **Node 3: Calculation Frequency**
  Do you calculate these "long-term benefits" every single time, or rely on a heuristic?
  *   **Every Time** → **Leaf A: Hard Act Utilitarian** (Collapses)
  *   **Heuristic** → **Leaf B: Smart Indirect Utilitarian**

  **Node 4: Ground Projects Negotiable**
  Are your personal projects (ground projects) negotiable if the stakes get extreme (e.g., 1 Spouse vs. 100 Strangers)?
  *   **No (Absolute)** → **Leaf C: Virtue-Ethics Loyalty**
  *   **Yes (Threshold Exists)** → Go to **Node 5**

  **Node 5: Preemptive Moral Lock-in**
  Can you rationally bind yourself in advance to *never* calculate the utility threshold for loved ones?
  *   **No** → **Leaf D: Unnamed / Fragile Integrity**
  *   **Yes** → Go to **Node 6**

  **Node 6: Lock-in Rationality**
  Is this binding rational because it protects your psychology, or is it just hidden rule-following?
  *   **Hidden Rule-Following** → **Leaf B: Smart Indirect Utilitarian** (Collapses)
  *   **Rational Protection** → Go to **Node 7**

  **Node 7: Lock-in Nature**
  Is this pre-commitment a *tool* for good outcomes, or *constitutive* of who you are (identity)?
  *   **Tool** → **Leaf B: Smart Indirect Utilitarian** (Collapses)
  *   **Constitutive** → **Leaf E: Williams-Style Integrity**

  ---

  ### The Leaves (Positions & Awkward Commitments)

  *   **Leaf A: Hard Act Utilitarian**
      *   *Awkward Commitment:* You must save the two strangers even if the guilt destroys your ability to function as a moral agent thereafter.
  *   **Leaf B: Smart Indirect Utilitarian**
      *   *Awkward Commitment:* You must be willing to abandon your loyalty heuristic the moment you prove it fails to maximize utility.
  *   **Leaf C: Virtue-Ethics Loyalty**
      *   *Awkward Commitment:* You must let 100 strangers die to avoid betraying a personal commitment, regardless of the catastrophe.
  *   **Leaf D: Unnamed / Fragile Integrity**
      *   *Awkward Commitment:* You claim integrity matters, but admit you'd calculate the trade-off if the stakes were high enough.
  *   **Leaf E: Williams-Style Integrity**
      *   *Awkward Commitment:* You cannot explain why your integrity matters without sounding selfish, because you refuse to cash it out in social utility.

  ---

  ### Indistinguishable Leaves
  **Leaf B (Smart Indirect Utilitarian) and Leaf E (Williams-Style Integrity)** are practically indistinguishable in normal operation. Both agents save the spouse without calculating. They only diverge in edge cases (the 1 vs. 100 scenario) or upon introspection regarding *why* they don't calculate. If the Williams agent admits their integrity is valuable because it makes them a happier person, they collapse into Leaf B.

  ### The Weakest Branch: Preemptive Moral Lock-in (Nodes 5–7)
  This is the structural weak point of the tree. The idea that you can rationally "bind" yourself to ignore moral math is suspect.

  **The Flip Argument:**
  If the only justification for the lock-in is that it produces better psychological outcomes or prevents error, then the lock-in is merely a **tool** (Node 7, Tool). This collapses the entire Williams/Integrity path back into **Leaf B (Smart Indirect Utilitarian)**.

  For Williams-Style Integrity to survive, the lock-in must be *constitutive* (part of your identity, not a tool). But if you argue it's constitutive, a critic can ask: "Why is your identity sacrosanct?" If you answer "Because preserving it helps the world," you're back to Utilitarianism. If you answer "Because it's mine," you risk Leaf C's absolutism. The lock-in branch only holds if you accept that some rational commitments are immune to utility calculations entirely—a hard sell for a software engineer used to optimizing systems.
