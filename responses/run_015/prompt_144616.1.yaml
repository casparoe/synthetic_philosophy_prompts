      *   **Core Issue:** Confusion between *premises* (content within the system) and *inference rules* (mechanisms that operate on the content). Logic requires a move from "is" to "therefore," but the Tortoise treats "therefore" as just another "is."

  3.  **Translate to Rules Vocabulary:**
      *   *Premises (A, B):* Specific card effects or scenario rules currently in play.
