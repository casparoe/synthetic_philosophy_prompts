answer: |-
  This is a sharp observation. You have identified a structural isomorphism between individual decision theory and collective constitutional theory. You aren't mashing things together; you've spotted a fundamental mechanism of agency over time.

  As requested, I will walk through the brainstorming process, evaluate the candidates, settle on the correct terminology, and then provide the "carve-up" of boundaries you asked for.

  ### Phase 1: Brainstorming the Neighborhood

  Before we land on the precise term, let's look at the cluster of concepts surrounding this phenomenon. Philosophers and economists usually circle around three main labels:

  1.  **The Ulysses Pact (or Ulysses Contract):** This is the mythological reference. Odysseus orders his crew to tie him to the mast and plug their ears so he can hear the Sirens without jumping ship. He knows his future preferences (jump to the Sirens) will conflict with his current preferences (survive). This fits your personal examples perfectly.
  2.  **Precommitment Strategy:** This is the game-theoretic term. It refers to altering the payoff structure of a future decision to make a specific choice irrational or impossible. This is broader; it includes things like a company building a factory to signal to competitors that they will fight a price war.
  3.  **Entrenchment / Constitutionalism:** This is the political science term. It refers to rules that are harder to change than ordinary laws (e.g., supermajority requirements). This fits your HOA and country examples.

  **The Problem:** "Precommitment" is a bit dry and broad (it can apply to competitors, not just selves). "Constitutionalism" is too specific to governments. "Ulysses Pact" is evocative but sometimes implies a medical/psychiatric context (e.g., a psychiatric advance directive).

  ### Phase 2: The Verdict on "Sameness"

  Are your personal examples and your group examples the same phenomenon?

  **Verdict:** **Yes, structurally.**

  In decision theory, this is called **Intertemporal Self-Binding**.

  In both cases, you have an agent at Time 1 (T1) who anticipates a **Time Inconsistency** at Time 2 (T2).
  *   **Time Inconsistency:** At T1, you value long-term health/wealth/stability. At T2, in the heat of the moment, you will disproportionately value short-term gratification/liquidity/populism. This is often modeled as *Hyperbolic Discounting*.
  *   **The Mechanism:** At T1, the agent deliberately raises the *transaction cost* of the T2 action.
  *   **The Goal:** To align T2's actions with T1's preferences, despite T2's changed state of mind.

  Whether the agent is a single human brain or a collective body politic, the logic is identical: **The T1 agent restricts the T2 agent's choice set to prevent a predicted failure of will.**

  ### Phase 3: The Carve-Up (Boundaries and Edges)

  You asked for the edges. Where does this concept stop? This is where philosophers like Jon Elster (who wrote *Ulysses Unbound*) and Thomas Schelling (who wrote on self-command) draw the lines.

  Here is the taxonomy of what counts as **Strategic Self-Binding** and what does not.

  #### 1. Hard Constraints vs. Soft Costs
  *   **Hard Constraint:** The phone box. You literally cannot get the phone. The Constitution. You literally cannot pass the law without 75% votes.
  *   **Soft Cost:** The savings fee. You *can* get the money, but it hurts.
  *   **The Boundary:** Both count as binding **IF** the cost is calibrated to exceed the expected value of the impulse.
      *   *Edge Case:* If the fee is $5 and your impulse is worth $100 to you, it's not a bind; it's just a price. If the fee is $500, it's a bind.
      *   *Rule:* It counts as binding if the design intent is to make the action *irrational* for Future-You, not just inconvenient.

  #### 2. Binding vs. Promising
  This is the most common confusion.
  *   **Promise:** "I promise I won't check Instagram." If you break it, the only cost is guilt or social reputation.
  *   **Binding:** "I put my phone in a locker." If you break it, you physically cannot do it, or you pay a mechanical penalty.
  *   **The Boundary:** Does the enforcement mechanism rely on **willpower** or **structure**?
      *   If you have to use willpower to uphold the restriction, it is a *Promise*.
      *   If the restriction operates automatically regardless of your will, it is a *Bind*.
      *   *Edge Case:* Telling your roommate to ignore you. This is a **Social Bind**. It relies on *their* will, not yours. It counts as binding because you have outsourced the enforcement to an external agent who is not subject to your T2 impulse.

  #### 3. Binding vs. Nudging
  *   **Nudge:** Putting the cookies on the top shelf. You can still get them easily.
  *   **Binding:** Throwing the cookies away.
  *   **The Boundary:** Does the option remain **costlessly reversible**?
      *   If Future-You can reverse the decision with zero friction once the impulse hits, it is a *Nudge*.
      *   If Future-You faces friction, cost, or impossibility, it is a *Bind*.

  #### 4. The "Dead Hand" Problem (The Group Disanalogy)
  While the *structure* is the same, there is a normative difference between the personal and group cases.
  *   **Personal:** We generally accept that T1-You has the right to bind T2-You because it is the *same organism*. It is an act of autonomy.
  *   **Group:** This is the **Paradox of Sovereignty**. Why should a majority of voters in 2020 bind the majority of voters in 2024? They are not the same "self."
  *   **The Edge:** In political theory, binding is only considered legitimate if there is a **Sunset Clause** or an **Escape Hatch** that is difficult but not impossible.
      *   *Illegitimate Bind:* A constitution that says "This can never be changed." (This is viewed as tyranny by the dead over the living).
      *   *Legitimate Bind:* A constitution that requires 75% to change. (It respects the future majority's will but raises the threshold to ensure the change is durable, not impulsive).

  ### Phase 4: Coining the Definition

  While "Ulysses Arrangement" is the standard philosophical term, it often carries a clinical vibe. Given your request for clarity, I propose we use the term **Strategic Precommitment** but define it with the specific boundaries we just discussed.

  **Definition: Strategic Precommitment**
  > An action taken by an agent at Time 1 to intentionally alter the choice architecture or cost structure facing their Time 2 self, specifically to mitigate predicted time-inconsistent preferences (weakness of will), where the enforcement mechanism is structural or external rather than reliant on Future-Willpower.

  **The Boundary Cases (Cheat Sheet):**

  | Scenario | Classification | Why? |
  | :--- | :--- | :--- |
  | **Phone in time-lock box** | **Hard Bind** | Physical impossibility. |
  | **Savings app with fee** | **Cost Bind** | Financial penalty makes impulse irrational. |
  | **Telling roommate "ignore me"** | **Social Bind** | Enforcement outsourced to third party. |
  | **"I promise I'll study"** | **Not a Bind** | Relies on internal guilt/willpower. |
  | **Cookies on high shelf** | **Nudge** | Reversible with low friction. |
  | **Constitutional Supermajority** | **Procedural Bind** | Raises transaction cost of legislative impulse. |
  | **"No law shall ever be passed"** | **Void/Illegitimate** | Violates future sovereignty (Dead Hand). |

  ### Summary

  You have correctly identified **Strategic Precommitment** (often called a **Ulysses Arrangement**).

  The "trick" is the recognition that **willpower is a depletable resource**, and rational agents will often choose to restrict their own future freedom to preserve their long-term goals.

  The distinction you were worried about (personal vs. group) is real but secondary. In both cases, the "Self" is treated as a sequence of different agents (T1 vs T2) with conflicting interests. The only major difference is that in the group case, we argue more about whether T1 has the *right* to bind T2, whereas in the personal case, we assume you own yourself across time.

  So, you aren't mashing things together. You've found the connective tissue between behavioral economics and constitutional law.
