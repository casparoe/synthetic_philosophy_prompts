answer: |-
  Here is the test of your working rule, the verdict you should discard, and the principle that actually governs why these scenes land or fail.

  ### 1. Testing Your Working Rule
  *Rule: "It's a real dilemma only if you couldn't afterwards say to the character 'you did the right thing' and mean it."*

  *   **Burning House (Mother):** Rule says **Real Dilemma** (Can't say "right thing"). You say **Real Dilemma**. **(Match)**
  *   **Field Hospital (Surgeon):** Rule says **Not a Dilemma** (Can say "right thing" via triage). You say **Not a Dilemma**. **(Match)**
  *   **Lunch/Mugging:** Rule says **Not a Dilemma** (Can say "right thing"). You say **Obviously correct**. **(Match)**
  *   **Drowning Kids (Stranger):** Rule says **Not a Dilemma** (1 life > 0 lives, so "right thing" was done). You say **Want it to feel like Burning House**. **(Mismatch)**
  *   **Forced Choice (Mother):** Rule says **Real Dilemma** (Can't say "right thing"). You say **Real Dilemma**. **(Match)**
  *   **Two Cities (Job):** Rule says **Not a Dilemma** (Self-inflicted, one path was clearly 'better' or 'worse'). You say **Fake Dilemma**. **(Match)**

  **The Verdicts the Rule Can't Deliver:**
  Your rule fails on **Scenario 4 (Drowning Kids)**. By the arithmetic of your rule, saving one stranger is "the right thing," so it should feel like the Hospital. But your writer's gut knows it must feel like the Burning House. The rule also strains against **Scenario 3 (Lunch/Mugging)**: the rule says "nothing outstanding," but your instinct demands an apology, implying something *is* outstanding.

  ### 2. The Verdict You Should Give Up
  You should give up the verdict on **Scenario 3 (Lunch/Mugging)** that it is "Obviously correct, nothing outstanding."

  Your instinct to make him apologize is the truer signal. There *is* something outstanding. A promise creates a specific debt; stopping a mugging creates a general good. Paying the general good does not automatically cancel the specific debt. By calling it "nothing outstanding," you are denying the character the necessary emotional residue that makes the scene human. It isn't a "dilemma" in the sense that he shouldn't stop the mugging, but it *is* a dilemma in the sense that he now owes a reparative act (the apology) to clear the ledger.

  ### 3. The Underlying Principle
  The principle underneath your successful drafts is **The Principle of Residual Debt.**

  > A choice feels like a "Real Dilemma" (and lands emotionally) when the character violates a **Special Obligation** to a specific person to serve a **General Good**, creating a moral debt that the good outcome cannot repay.
  >
  > *   **Special Obligations** (Children, Promises, Intervention) create specific debts to individuals.
  > *   **General Goods** (Saving more lives, Justice, Career) clear the utilitarian ledger but do not wipe the specific debt.
  > *   **The "Cheat" Feeling** occurs when you treat a Special Obligation like a General Good (expecting the character to feel "cleared" after choosing) or vice versa.

  **Why this fixes your scenarios:**
  *   **Burning House:** Special (Child) vs. Special (Child). Debt remains to the lost child. (Real Dilemma)
  *   **Hospital:** General (Patients) vs. General (Patients). Protocol clears the debt. (Arithmetic)
  *   **Drowning:** You want this to feel like the Burning House because **Intervention creates a Special Obligation.** By jumping in, the savior assumes temporary duty of care to *both*. Saving one abandons the other. Debt remains. (Real Dilemma)
  *   **Lunch/Mugging:** Special (Promise) vs. General (Justice). Debt remains to the friend. (Requires Apology)
  *   **Two Cities:** Special (Promise) vs. Special (Career). But the debt is **Self-Inflicted.** The residue is Shame, not Tragedy. (Fake Dilemma)

  ### 4. Prediction for Your New Case
  **Case:** *Keep a promise to a friend who just died OR stop a stranger from being badly hurt (exactly as bad as each other).*

  **Prediction:** This is a **Real Dilemma** with high **Residual Debt**, regardless of the choice.

  *   **If he keeps the promise:** He has honored the Special Obligation (the dead friend), but he bears the debt of the stranger's suffering. He cannot be told "You did the right thing" without it sounding like a dismissal of the stranger's pain.
  *   **If he stops the hurt:** He has served the General Good, but he has violated the Special Obligation (the dead friend). He cannot be told "You did the right thing" without it sounding like an insult to the memory of the friend.

  **Why:** Because the two values are **incommensurable**. One is a debt to a specific identity (the friend), the other is a debt to humanity (the stranger). Utilitarian arithmetic cannot solve it. The scene will only land if the character feels they *owe* the one they didn't choose, regardless of which one they pick. If they walk away feeling "cleared," the scene will feel like a cheat.
