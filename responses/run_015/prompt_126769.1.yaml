      *   **Student:** Amira. Needs to embody the collision of language and faith. Maybe she speaks a specific dialect or uses religious phrasing inherent to her community's speech.
      *   **Setting:** Lycée Victor Basch (fictional), in Vénissieux or a made-up suburb like "Saint-Clair-la-Forêt" (let's go with *Villefranche-sur-Saône* outskirts, fictionalized as *Val-de-Lyon*).
