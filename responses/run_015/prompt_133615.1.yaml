answer: |-
  **MEMORANDUM**

  **TO:** County Land-Use Board Members
  **FROM:** [Your Name]
  **DATE:** October 10, 2023
  **SUBJECT:** Thinking on the River-Mill District Vote

  Hi everyone,

  I'm circulating this before Thursday's meeting because I've been wrestling with the River-Mill decision, and I want to put my reasoning on the table early. I know we're all feeling the pressure on this one. The mill owners have been waiting to liquidate, the town manager has been clear about how much we need the tax base for the schools, and honestly, the current buildings are eyesores.

  I want to start by saying the case for approval is strong. I'm not dismissing it. Property rights matter. If someone owns land and wants to sell it for a legitimate use like housing, we shouldn't stand in the way without a damn good reason. Plus, the immediate tax revenue is real money for real services. If we block this, we are effectively choosing to keep a blighted zone over funding our community's needs. That's a heavy burden, and I know some of you are worried that voting "no" makes us look anti-growth or hostile to business. I get that.

  However, I've been reading up on some history regarding how civilizations interact with their geography—specifically the work of a historian named Fernand Braudel. He had this idea about *longue durée*, or "deep time." The gist is that human events (like a sale, a vote, a building permit) happen fast, but geography and climate move on a much slower clock. We tend to ignore the slow clock because it doesn't show up in our meeting minutes.

  I'm calling this **structural amnesia**.

  As a board, we are structured to see the owners, the tax sheets, and the architectural plans. Those are the "noise." The "signal" is the river valley itself. We have records of mills in that specific district going back to the 1700s. They didn't all fail because of bad business; they failed because the floodplain shifts on a roughly 200-year cycle. We are due. With climate change, that cycle isn't just continuing; it's speeding up.

  If we approve apartments there, we are betting that the next 30 years (the lifespan of a mortgage) will look like the last 30 years. But the land doesn't work on a 30-year cycle. If we build dense housing on a floodplain that is waking up, the tax revenue we gain in decade one could be wiped out by disaster recovery in decade two. We aren't protecting property rights if we approve a development that might be underwater in fifteen years.

  Because of this, I cannot support the current application as it stands. I don't think a phased demolition fixes the underlying geographic risk.

  **My Recommendation:**

  I will be moving to **deny the current application until the county updates its long-range hydrology map.**

  This isn't a permanent "no." It's a "not until we know what the ground is doing." We need a hydrology map that accounts for the 200-year cycle and current climate data, not just the historical flood lines we've been using for the past twenty years.

  I know this delays the owners' payout. I know it delays the tax revenue. But proceeding without this data is structural amnesia in action—we'd be prioritizing the human timeline over the geographic one, and the river always wins that argument eventually.

  Let's discuss this Thursday. I think we can find a way to get the town its revenue without building on a sinking foundation, but we need the right map first.

  Thanks,

  [Your Name]
  County Land-Use Board
