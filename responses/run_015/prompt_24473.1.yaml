  9.  **Final Polish:** Ensure the distinction between ICD-10 (Mental Disorder) and ICD-11 (Sexual Health) is clear in the context of Hacking. Hacking's looping effects suggest the *classification* changes the *classified*. The argument is that classifying as "Mental Disorder" increased suffering. Classifying as "Sexual Health" reduces suffering without denying the condition.

      *(Self-Correction during drafting)*: Wait, Hacking's looping effects usually imply the *kind* changes. If I argue the kind *didn't* change, just the label, am I misusing Hacking? No, the argument is that the *distress component* (which made it a disorder) was looped. I need to be precise there. The "disorder" was the looped effect. The "condition" is the residue.

      *Refining the "Killer" Objection:* The real killer for an empiricist room is if I can't define the *referent*. If the looping effect explains the symptoms, what is the disease entity? If I say "nothing, it's just a social kind," the RDoC people will eat me alive. I need to acknowledge a biological/developmental basis for the incongruence while attributing the *pathology* to the social reaction.

      *Let's finalize the "Concede" list:*
      1. Clinical Access (Pragmatics vs Epistemics).
      2. Hacking isn't the *only* factor (Biology exists).
      3. Political motivations were present (but don't negate epistemic validity).

      *Let's finalize the "Must Land":* The distinction between the *incongruence* (health condition) and the *distress* (formerly mental disorder, now socially mitigated).

      *Let's finalize the "Killer":* "If the distress is iatrogenic/social, what is the *medical* justification for keeping it in a health classification at all? Why not remove it from ICD entirely?" (This attacks the move to Sexual Health specifically).

