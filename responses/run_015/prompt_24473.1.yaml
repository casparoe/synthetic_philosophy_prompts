      *   *The Conflict:* The audience wants biological validity; the argument relies on social/interactive causality. If the distress is *caused* by the label, is the disorder "real"? If it's moved to Sexual Health, is it still a "condition"?
      *   *Key Vulnerability:* Hacking's looping effects usually apply to *kinds of people* (e.g., multiple personality), but Gender Incongruence in ICD-11 is framed as a *condition* related to health, not necessarily a mental disorder. The argument needs to show that the *distress* (dysphoria) was iatrogenic/stigma-driven, not intrinsic to the incongruence itself.

  3.  **Drafting the Objections (Iterative Process):**

