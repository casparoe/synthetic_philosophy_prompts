      *   *The Killer:* The "Natural Kind" objection. If gender identity has a biological basis (prenatal hormones, etc.), then looping effects are secondary. If the audience demands a biological substrate for *validity*, and I only offer social looping, I lose. Specifically: "If looping effects explain the distress, what explains the *incongruence*? If you can't specify the etiology of the incongruence, you haven't justified a medical category, only a social one."

  7.  **Drafting the Content (incorporating tone):**
