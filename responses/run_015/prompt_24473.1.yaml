      *   *Objection 2 (The RDoC/Bio Challenge):* Where is the biomarker? If it's just looping, why move it to *Sexual Health*? That implies a biological/physiological basis. Do you have evidence of that, or is it just de-stigmatization?
      *   *Objection 3 (Hacking Hostility):* Hacking is about interactive kinds, but medical diagnoses are supposed to be indifferent kinds. Are you claiming gender identity is *only* a social kind? That undermines treatment.
      *   *Objection 4 (Clinical Utility):* If we stop calling it a mental disorder, do patients lose access to care? Epistemic justice vs. practical access.
      *   *Objection 5 (Distress Source):* Is the distress from the *label* or from the *incongruence*? Body dysmorphia isn't caused by the label "body dysmorphia." Why is gender different?
      *   *Objection 6 (The "Political Concession" Trap):* You say it's not political, but the WHO working group explicitly cited human rights. How do you disentangle the epistemic from the political?
      *   *Objection 7 (Prevalence/Incidence):* If looping effects drive prevalence, why is prevalence rising *after* de-pathologization in some regions? Shouldn't it drop if the label wasn't causing it?
      *   *Objection 8 (The "Sexual Health" Category):* Why Sexual Health? Isn't that just moving the stigma? Is there a sexual dysfunction component?

      *Refining for the Audience:* Make them sound like grumpy empiricists. Use terms like "construct validity," "etiological heterogeneity," "iatrogenesis," "natural kinds."

  4.  **Ordering by Damage:**
      *   *Most Damaging:* The Ontological question (Is there a disorder left?). If there's no underlying pathology, the move isn't epistemic correction, it's elimination.
      *   *High Damage:* The RDoC/Bio question (What is the mechanism?).
      *   *High Damage:* The Distress Source (Intrinsic vs. Extrinsic).
      *   *Medium:* Hacking applicability.
      *   *Medium:* Political vs. Epistemic.
      *   *Lower:* Clinical utility (pragmatic, not epistemic).
      *   *Lower:* Prevalence data (can be explained away).
      *   *Lowest:* Specific category placement (Sexual Health nuances).

  5.  **Developing Replies & Identifying Soft Spots:**
      *   *Strategy:* Don't deny biology. Argue that the *pathology* was the distress, and the distress was socially maintained. The "condition" is the incongruence; the "disorder" was the suffering.
      *   *Soft Spot:* Distinguishing between "incongruence" (neutral) and "dysphoria" (pathological) is tricky.

