answer: |-
  ### Part 1: Brainstorming & Conceptual Work

  **Diagnostic vs. Decorative Distinctions**
  *   **Diagnostic:**
      *   *Target Specificity:* Determines whether empirical fit is the standard (Specific) or conceptual possibility is the standard (Class).
      *   *Make-it-true Test:* Distinguishes assumptions that are *errors* (collapse if fixed) from assumptions that are *isolating devices* (result survives or is ill-posed without them).
      *   *Direction of Error:* Crucial for policy. If the error is unsigned, quantitative claims are epistemically bankrupt.
      *   *Load-bearing:* Distinguishes assumptions that drive the result from those that are merely conventional packaging.
  *   **Decorative (for this instrument):**
      *   *Mathematical Complexity:* A model can be complex but epistemically hollow, or simple and robust.
      *   *Disciplinary Label:* "Economics" vs. "Ecology" tells us nothing about the assumption's role.
      *   *Author Intent (stated):* Authors often claim "Instrumentalism" to dodge criticism; the tree must judge the *structure*, not the disclaimer.

  **The Logical Space (6 Diagnostic Questions)**
  1.  **Target:** Is the model meant to describe a *specific real system* (e.g., Chicago housing) or a *class of mechanisms* (e.g., how segregation arises)?
  2.  **Kind:** Do the false assumptions *distort/replace real features* (Deformation/Substitution) or *add non-existent features* (Invention)?
  3.  **Make-it-true:** If the assumption were replaced by a true one, would the result *survive/strengthen*, *collapse*, or is the question *ill-posed* (no true substitute exists)?
  4.  **Load-bearing:** Is the assumption *necessary* for the derivation, or is it inherited background noise?
  5.  **Direction:** Does the assumption bias the output in a *signed/bounded* direction, or is the error *unknown*?
  6.  **Ladder:** Is there a known sequence of less idealized models that *converge* on this result, or does the model break if idealizations are relaxed?

  **Grid Occupancy & Empty Cells**
  *   **Occupied Regions:**
      *   *Specific + Distort + Survives + Signed + Ladder:* **Verisimilitude.**
      *   *Specific + Invent + Ill-posed + Signed:* **Galilean** (Null models).
      *   *Class + Invent + Ill-posed + Qualitative:* **Fictionalist.**
      *   *Specific + Distort + Collapses + Unknown + Quant:* **Accusatory.**
      *   *Specific/Class + Distort + Survives + Qualitative:* **Instrumentalist/Robustness.**
      *   *Specific + Distort + Collapses + Tractability:* **Minimalist.**
  *   **Empty/Incoherent Cells:**
      *   *Specific + Invent + Survives + Quantitative:* **Incoherent.** If you invent a feature (e.g., infinite agents) for a specific system and claim the quantitative result survives truth, you are contradicting the definition of "Invention."
      *   *Class + Distort + Ill-posed:* **Unattractive.** If targeting a class, you usually want general mechanisms (Invention) or robust distortions. Ill-posed distortions suggest the mechanism doesn't exist.
      *   *Load-bearing + No:* **Decorative.** If an assumption is not load-bearing, its epistemic status rarely matters for the conclusion. This combination leads to a "Pass" leaf not listed above, but for this tree, we treat non-load-bearing assumptions as irrelevant to the verdict.

  **Revision Log (Pre-Tree Construction)**
  *   *Revision 1 (Node Order):* I initially placed "Load-bearing" before "Make-it-true." **Correction:** "Make-it-true" is a stronger test of load-bearing. If the result collapses when the assumption is fixed, it is load-bearing. I moved "Make-it-true" upstream (Node 3) to filter out "Galilean" cases early.
  *   *Revision 2 (Accusatory Leaf):* In the first draft, the Housing Model (c) landed on "Minimalist" because the assumptions were false but tractable. **Correction:** Minimalism excuses false assumptions only for qualitative insights. For quantitative policy claims, unknown error direction is fatal. I added Node 7 (Claim Type) to separate Quantitative (Accusatory) from Qualitative (Minimalist) when errors are unknown.
  *   *Revision 3 (Instrumentalist vs. Verisimilitude):* I found the tree could not reliably separate these without asking about the author's belief in the assumptions. **Flag:** These leaves are merged in practice; the tree treats them as "Predictive Success" vs. "Approximate Truth," but students should know these are often indistinguishable from the text alone.

  ---

  ### Part 2: The Decision Tree

  **Constraints:** 8 Nodes, 8 Leaves.

  *   **Node 1 (Target):** Is the model intended to describe a *specific real-world system* (e.g., "The 2024 Housing Market") or a *general class of mechanisms* (e.g., "How markets behave")?
      *   *Specific* → Node 2
      *   *Class* → Node 5
  *   **Node 2 (Kind):** Do the unrealistic assumptions *distort/replace real features* (e.g., setting cost to zero) or *add non-existent features* (e.g., infinite agents)?
      *   *Distort/Replace* → Node 3
      *   *Add Non-Existent* → Node 4
  *   **Node 3 (Make-it-true):** If the distorted feature were set to its real value, would the central result *survive/strengthen* or *collapse*?
      *   *Survive/Strengthen* → **Leaf A (Verisimilitude)**
      *   *Collapse* → Node 6
  *   **Node 4 (Make-it-true):** Since the feature doesn't exist, is the assumption used as a *baseline for deviation* (Null) or as a *structural engine*?
      *   *Baseline/Null* → **Leaf B (Galilean)**
      *   *Structural Engine* → **Leaf C (Fictionalist)**
  *   **Node 5 (Kind - Class Target):** Do the assumptions *distort real features* or *add non-existent features*?
      *   *Distort/Replace* → Node 7
      *   *Add Non-Existent* → **Leaf C (Fictionalist)**
  *   **Node 6 (Direction of Error):** Does the false assumption bias the result in a *known/signed direction* (e.g., conservative estimate) or is the error *unknown*?
      *   *Known/Signed* → **Leaf D (Instrumentalist)**
      *   *Unknown* → Node 8
  *   **Node 7 (Ladder):** Does the paper demonstrate a *sequence of models* converging on this result as assumptions are relaxed?
      *   *Yes* → **Leaf E (Robustness)**
      *   *No* → **Leaf F (Minimalist)**
  *   **Node 8 (Claim Type):** Does the paper make a *quantitative/predictive claim* (e.g., "Supply will drop 10%") or a *qualitative claim* (e.g., "Supply will drop")?
      *   *Quantitative* → **Leaf G (Accusatory)**
      *   *Qualitative* → **Leaf F (Minimalist)**

  **The Leaves & Awkward Commitments**
  1.  **Verisimilitude:** *Commitment:* We believe the assumptions are approximately true, and closer is better.
  2.  **Galilean:** *Commitment:* The model is false by design to isolate a force; truth is found in the deviation.
  3.  **Fictionalist:** *Commitment:* The model is a story that shows possibility, not actuality; do not ask if it is real.
  4.  **Instrumentalist:** *Commitment:* The assumptions are false, but the prediction works; truth is irrelevant.
  5.  **Robustness:** *Commitment:* No single model is trusted; only what survives across incompatible models matters.
  6.  **Minimalist:** *Commitment:* The assumptions are false placeholders; trust the direction, not the mechanism.
  7.  **Accusatory:** *Commitment:* The model uses false assumptions to generate false precision; the conclusion is unsupported.
  *(Note: Instrumentalist and Verisimilitude are often indistinguishable in text; both rely on predictive success.)*

  ---

  ### Part 3: Test Cases

  **(a) Segregation Model (Schelling-type)**
  *   **Node 1 (Target):** Class of mechanisms (how segregation *can* arise). → *Go Node 5.*
  *   **Node 5 (Kind):** Distorts/Replaces real features (grid vs. continuous space, mild preference). → *Go Node 7.*
  *   **Node 7 (Ladder):** Yes (simulations show result holds across grid sizes/preferences). → **Leaf E (Robustness).**
  *   *Verdict:* The model shows a robust possibility theorem.
  *   *Revision Note:* Initially, I might have sent this to Fictionalist. But because the assumptions are *distortions* of real preferences (not inventions like infinite agents) and the result holds across variations, Robustness is more accurate. It claims this mechanism *does* work, not just *could*.

  **(b) Population Genetics (Hardy-Weinberg)**
  *   **Node 1 (Target):** Specific real system (used to check real populations). → *Go Node 2.*
  *   **Node 2 (Kind):** Adds non-existent features (Infinite population, no selection). → *Go Node 4.*
  *   **Node 4 (Make-it-true):** Used as a baseline for deviation (Null). → **Leaf B (Galilean).**
  *   *Verdict:* The model is not meant to be true; it is a zero-force law to detect evolutionary forces.
  *   *Deflating?* No. It validates the model's use as a null hypothesis.

  **(c) Housing Market Policy Model**
  *   **Node 1 (Target):** Specific real system (City X ordinance). → *Go Node 2.*
  *   **Node 2 (Kind):** Distorts/Replaces real features (Frictionless adjustment, no fixed costs). → *Go Node 3.*
  *   **Node 3 (Make-it-true):** Collapse (If frictions added, elasticity changes drastically). → *Go Node 6.*
  *   **Node 6 (Direction):** Unknown (Frictions could dampen or amplify supply shock). → *Go Node 8.*
  *   **Node 8 (Claim Type):** Quantitative ("Supply will reduce by 15%"). → **Leaf G (Accusatory).**
  *   *Verdict:* The model generates false precision. The conclusion is not entitled to the number.
  *   *Deflating?* Yes. It licenses the qualitative insight (rent control affects supply) but invalidates the quantitative estimate used for policy.

  ---

  ### Part 4: Limitations & Student-Facing Version

  **What the Tree Cannot Do**
  1.  **Dual-Role Assumptions:** If an assumption acts as a Galilean isolator in Section 2 but a Load-bearing engine in Section 4, the tree forces a single path. Students must evaluate the *central conclusion* only.
  2.  **Idealized Targets:** If the target system is itself a model (e.g., a climate model evaluating a economic model), Node 1 becomes ambiguous. Treat the "target" as the empirical phenomenon the final model claims to address.
  3.  **Asymmetric Policy Costs:** The tree treats False Positives (accepting a bad model) and False Negatives (rejecting a good one) equally. In policy, False Positives are costlier. The "Accusatory" leaf assumes this burden, but students must apply extra skepticism to quantitative policy claims than the tree explicitly weights.

  **Student-Facing Half-Page Instrument**

  | **MODEL EVALUATION TREE** | **YES / NO** |
  | :--- | :--- |
  | **1. TARGET:** Is the model describing a **specific real system** (e.g., "2024 Chicago")? | ☐ Yes → Go 2 <br> ☐ No (General Mechanism) → Go 5 |
  | **2. KIND:** Do the unrealistic assumptions **distort real features** (e.g., set cost to 0) rather than invent non-existent ones (e.g., infinite people)? | ☐ Yes → Go 3 <br> ☐ No → Go 4 |
  | **3. FIX TEST:** If you fixed the distortion to match reality, would the main result **still hold**? | ☐ Yes → **VERISIMILITUDE** (Approx. True) <br> ☐ No → Go 6 |
  | **4. NULL TEST:** Is the unrealistic assumption used as a **baseline** to measure deviation (like a control group)? | ☐ Yes → **GALILEAN** (Isolating Force) <br> ☐ No → **FICTIONALIST** (Possibility Story) |
  | **5. KIND (General):** Do the assumptions **distort real features**? | ☐ Yes → Go 7 <br> ☐ No → **FICTIONALIST** (Possibility Story) |
  | **6. ERROR DIRECTION:** Does the author show the assumption biases the result in a **known direction** (e.g., conservative)? | ☐ Yes → **INSTRUMENTALIST** (Predicts Well) <br> ☐ No → Go 8 |
  | **7. LADDER:** Does the paper show the result holds as assumptions are **stepwise relaxed**? | ☐ Yes → **ROBUSTNESS** (Trust the Core) <br> ☐ No → **MINIMALIST** (Trust Direction Only) |
  | **8. CLAIM TYPE:** Does the paper make a **quantitative prediction** (e.g., "10% drop")? | ☐ Yes → **ACCUSATORY** (False Precision) <br> ☐ No → **MINIMALIST** (Trust Direction Only) |

  **Leaf Guide:**
  *   **Verisimilitude:** Assumptions are roughly true; closer is better.
  *   **Galilean:** Model is false by design to isolate a cause; look for deviations.
  *   **Fictionalist:** Model shows how something *could* happen, not that it *did*.
  *   **Instrumentalist:** Assumptions are false, but predictions work; don't ask why.
  *   **Robustness:** Result holds across many different model setups.
  *   **Minimalist:** Assumptions are false placeholders; trust the qualitative direction.
  *   **Accusatory:** **STOP.** False assumptions drive a quantitative claim; the number is unsupported.
