          *   Confusing this with AGM belief revision (which handles propositional logic, not probabilistic dependencies).
          *   *Fix:* Explicitly distinguish between the *territory* (ontology) and the *map* (epistemology). Emphasize that "independence" is a feature of the agent's model, not necessarily the world.

      *   **(d) Internal Tension (Evidence vs. Rule):**
          *   Evidence implies "This is how the world is."
          *   Rule implies "This is how the world *must* be" (or how I must model it).
          *   *Tension:* If it's evidence, I update weights. If it's a rule, I update constraints.
          *   *Resolution:* The conditional acts as a *constraint on the model space*. It eliminates models where the dependency doesn't hold. This is higher-order updating.
