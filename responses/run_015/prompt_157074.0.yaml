          *   Critics (Chomsky/Grice): "Fact of the matter" = internal state/intention.
          *   Formal: Quine's rejection of modalities vs. Kripkean causal reference.
      *   **Progress:**
          *   Not empirical linguistics (Quine concedes manuals work).
          *   Not just epistemic/ontological distinction (Quine rejects the distinction here).
          *   *Yes:* A naturalistic theory of content (Teleosemantics?) that bridges the gap. Or accepting the "no resolution" conclusion as a feature of naturalized epistemology.

  8.  **Drafting the Response (incorporating specific philosophical moves):**
