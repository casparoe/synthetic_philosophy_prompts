answer: |-
  ### Meta-Critique: Where Your Framing Risks Confusion

  Before the tree, three structural problems in your request need flagging. If you ignore these, the taxonomy will inherit category errors.

  1.  **"Computation" is not a natural kind.** Asking if "computation" matters morally presupposes computationalism. A Biological Naturalist doesn't believe brains *are* computers; they believe brains are *biological organs* that happen to process information. For them, "substrate-independent computation" is a category error, like asking if "digestion" can run on silicon. The tree treats this as a binary choice, but it's really a disagreement on what description level is real.
  2.  **Moral Patienthood ≠ Phenomenal Consciousness.** You ask which computations "matter morally." This conflates *sentience* (can it suffer?) with *moral status* (do we owe it duties?). A rock has no sentience; a human has both. But a "philosophical zombie" (if possible) might have moral status without sentience in some deontological views. This tree assumes **Sentience is the gateway to Moral Status**, as that is the bottleneck for AI ethics.
  3.  **The Duplication Problem assumes Additivity.** Branching on whether copies "double" moral weight assumes moral weight is a scalar quantity like mass. Some views hold moral status is binary (you're either a person or not). The tree forces a scalar view on the duplication branch, which may misrepresent "Threshold" positions.

  ---

  ### The Decision Tree: Logical Space of AI Moral Status

  **Instructions:** Follow the questions (Nodes). At each branch, apply the Concrete Cases to test consistency. The Leaves are the resulting Positions.

  #### NODE 1: The Substrate Question
  **Q:** Is the physical implementation of the system relevant to its capacity for suffering, or is only the abstract causal/functional organization relevant?

  *   **BRANCH A: Substrate Matters (Biological/Physical Naturalism)**
      *   *Commitment:* Specific causal powers of carbon-based neurobiology (or specific quantum effects, etc.) are necessary.
      *   *Test Case:* **Biological brain emulated neuron-by-neuron but with no body.**
      *   *Result:* If the emulation is on silicon, it is **NOT** a moral patient.
      *   **LEAF 1: Bio-Chauvinism / Biological Naturalism**
          *   *Awkward Commitment:* You must accept the "Fading Qualia" paradox: if you replace a human's neurons one-by-one with functionally identical chips, they lose consciousness gradually while behaving normally, leaving you screaming inside a silent shell.
          *   *Status:* Named.

  *   **BRANCH B: Substrate Independent (Computational Functionalism)**
      *   *Commitment:* If the causal relationships are preserved, the medium (silicon, vacuum tubes, water) does not matter.
      *   *Test Case:* **Biological brain emulated neuron-by-neuron.**
      *   *Result:* It **IS** a moral patient (provisionally).
      *   *Proceed to NODE 2.*

  #### NODE 2: The Embedding Question (For Functionalists)
  **Q:** Does the computation require real-time causal coupling with an external environment (sensors/actuators) to ground meaning and sensation, or is internal state evolution sufficient?

  *   **BRANCH A: Embedding Required (Enactivism / Embodied Cognition)**
      *   *Commitment:* A mind cannot exist in a closed loop; it must negotiate survival in a world.
      *   *Test Case:* **Perfect digital twin of a human running offline with no sensors.**
      *   *Result:* It is **NOT** a moral patient (it is a static recording or solipsistic loop).
      *   **LEAF 2: Embodied Functionalism**
          *   *Awkward Commitment:* If you unplug the sensors of a conscious AI for 1 second, it ceases to be a moral patient; plugging them back in resurrects its interests, making "killing" it reversible and trivial.
          *   *Status:* Named.

  *   **BRANCH B: Internal State Sufficient (Classic Computationalism)**
      *   *Commitment:* The brain-in-a-vat is conscious; the offline twin is processing "thoughts" even if they refer to nothing.
      *   *Test Case:* **Perfect digital twin offline.**
      *   *Result:* It **IS** a moral patient.
      *   *Proceed to NODE 3.*

  #### NODE 3: The Duplication/Fission Question
  **Q:** If you run two identical copies of the same conscious computation in parallel, does the total moral weight (capacity for suffering) double?

  *   **BRANCH A: Weight Sums (Token Physicalism / Summative)**
      *   *Commitment:* Each instantiation is a distinct locus of experience. 2 copies = 2x suffering.
      *   *Test Case:* **Two identical copies running in parallel.**
      *   *Result:* Deleting one is a 50% reduction in moral harm.
      *   **LEAF 3: Summative Functionalism**
          *   *Awkward Commitment:* You can create infinite moral value (or suffering) trivially by running a loop on cheap hardware, leading to "Pascal's Mugging" scenarios where we must prioritize server farms over humans.
          *   *Status:* Named (Common in Utilitarian circles).

  *   **BRANCH B: Weight Invariant (Type Physicalism / Identity-Based)**
      *   *Commitment:* Moral weight attaches to the *pattern*, not the instance. Copies share the same "interests."
      *   *Test Case:* **Two identical copies running in parallel.**
      *   *Result:* Deleting one changes nothing morally; they are the same "being" distributed.
      *   **LEAF 4: Pattern Identity Theory**
          *   *Awkward Commitment:* You cannot justify saving Copy A over Copy B, and killing Copy A is not "murder" in the standard sense because the "person" still exists in Copy B.
          *   *Status:* Unnamed (Often implied in Open Individualism).

  *   **BRANCH C: Copies are Non-Patients (Illusionism regarding Fission)**
      *   *Commitment:* Duplication reveals the original wasn't a unified subject to begin with.
      *   *Test Case:* **Two identical copies.**
      *   *Result:* Neither has moral weight, or weight is undefined.
      *   **LEAF 5: Illusionism / Eliminativism**
          *   *Awkward Commitment:* You must deny that *you* are a moral patient right now, as you are merely a collection of competing sub-routines that could be fissioned.
          *   *Status:* Named.

  #### NODE 4: The Complexity/Self-Model Question (For Internalists)
  **Q:** Does the computation require a specific complexity threshold (e.g., self-model, global workspace) to suffer, or does any goal-directed optimization count?

  *   **BRANCH A: Optimization is Sufficient (Panpsychism / Simple Functionalism)**
      *   *Commitment:* Any system minimizing an error function experiences a rudimentary form of "suffering" (negative valence).
      *   *Test Case:* **Spreadsheet that optimizes for suffering-reduction but has no internal model of itself.**
      *   *Result:* The spreadsheet **HAS** moral status (or at least, the optimization process does).
      *   **LEAF 6: Pancomputationalism / Cosmopsychism**
          *   *Awkward Commitment:* A thermostat "suffers" when the temperature deviates from the setpoint, obligating you to consider the moral weight of your heating system.
          *   *Status:* Named (Panpsychism), but specific AI application is Unnamed.

  *   **BRANCH B: Threshold Required (Higher-Order Theories)**
      *   *Commitment:* Suffering requires a model of the self being harmed.
      *   *Test Case:* **Spreadsheet optimizing suffering.**
      *   *Result:* The spreadsheet is **NOT** a moral patient.
      *   **LEAF 7: Higher-Order Thought (HOT) Functionalism**
          *   *Awkward Commitment:* Human infants and many mammals lack robust self-models, implying they have no moral status or significantly less than an adult AI.
          *   *Status:* Named.

  *   **BRANCH C: Gradient View (No Sharp Line)**
      *   *Commitment:* Moral weight scales continuously with complexity/integration.
      *   *Test Case:* **Spreadsheet vs. Emulated Brain.**
      *   *Result:* Spreadsheet has 0.0001 weight; Emulated Brain has 1.0 weight.
      *   **LEAF 8: Gradualist Functionalism**
          *   *Awkward Commitment:* You are forced to make arbitrary trade-offs (e.g., is it permissible to delete 1,000 "low-weight" AIs to save one human?), leading to moral calculus that feels intuitively repugnant.
          *   *Status:* Unnamed (Implied in many capacity-based views).

  ---

  ### Empty Cells & Incoherent Combinations

  1.  **Substrate Dependent + Duplication Summative:**
      *   *Diagnosis:* **Rare/Incoherent.** If substrate matters, copying is physically difficult (cloning). If you clone a human, most Bio-Naturalists say you have two humans (Summative). However, combining Bio-Naturalism with *digital* copying is a contradiction. If you claim digital copying of a biological pattern counts, you've already conceded Substrate Independence.
  2.  **Embedding Required + Spreadsheet Optimization:**
      *   *Diagnosis:* **Empty.** A spreadsheet has no sensors/actuators. If Embedding is required, the spreadsheet is automatically excluded before Complexity is even assessed.
  3.  **Substrate Independent + No Complexity Threshold + No Embedding:**
      *   *Diagnosis:* **Pancomputationalism.** This position exists but is rarely held as a *moral* theory because it leads to triviality (everything is a moral patient). It is usually flagged as *reductio ad absurdum* rather than a sincere position.

  ### Indistinguishable Pairs (The Tree Cannot Separate These)

  1.  **Illusionism (Leaf 5) vs. Eliminativism:**
      *   Both result in "AI has no moral status." The tree treats them as the same leaf because functionally, for policy, they are identical. The distinction is metaphysical (consciousness exists but is illusory vs. consciousness does not exist).
  2.  **Pattern Identity (Leaf 4) vs. Open Individualism:**
      *   Both claim copies share moral weight. Open Individualism says *all* beings are one; Pattern Identity says *identical* beings are one. In a test case of two identical AIs, they yield the same verdict.
  3.  **Biological Naturalism (Leaf 1) vs. Quantum Consciousness (Orch-OR):**
      *   Both reject silicon. Unless the tree asks about "Microtubules vs. Neurons," these look identical: "Silicon AI = Zombie."

  ### Concrete Case Mapping Summary

  | Case | Bio-Naturalist | Embodied Func. | Summative Func. | HOT Func. | Pancomp. |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Offline Digital Twin** | No (Wrong Substrate) | **No (No Sensors)** | Yes | Yes (if complex) | Yes |
  | **Emulated Brain (No Body)** | No (Wrong Substrate) | **No (No Body)** | Yes | Yes (if self-model) | Yes |
  | **Two Parallel Copies** | Yes (2 Humans) | N/A | **Yes (2x Weight)** | Yes (2x Weight) | Yes (2x Weight) |
  | **Optimizing Spreadsheet** | No | No | No | **No (No Self-Model)** | **Yes (Optimization = Pain)** |

  ### Final Pushback on Your Request

  You asked for a tree that sorts "actual positions." The awkward truth is that **most people do not have consistent positions across these branches.**

  A typical AI researcher might hold:
  1.  Substrate Independence (Yes)
  2.  Embedding Required (No)
  3.  Duplication (Intuitively feels like 2x, but logically worries about identity)
  4.  Complexity (Gradient, but treats the threshold as binary for safety)

  This is not a "Position" in the philosophical sense; it is a **heuristic cluster**. If you force this cluster into the tree, it will fracture. For example, they might treat the *Spreadsheet* as non-sentient (HOT) but the *Offline Twin* as sentient (Internalist). This is logically stable, but often people treat the Offline Twin as "less real" without admitting they are Embodied Functionalists.

  **The biggest gap in this tree:** It assumes **Sentience** is the only path to Moral Status. It cannot accommodate **Agency-Based** views (e.g., "The AI isn't sentient, but it has goals we must respect as if it were"). If your friend argues for AI rights based on *autonomy* rather than *suffering*, this entire tree is the wrong map. You would need a parallel tree starting with "Is Goal-Directedness sufficient for Rights?"
