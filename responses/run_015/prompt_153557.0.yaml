answer: |-
  ### A Note on Your Four Concepts

  Before the exam materials, a quick conceptual tidy-up. You are right to suspect overlap. In the academic literature, these map onto distinct debates, but two need tweaking to avoid confusing students:

  1.  **Fragility:** Academics call this **Contingency** or *Sensitivity to Initial Conditions*. It's the "butterfly effect" phase. Your definition is solid.
  2.  **Lock-in:** This is the core mechanism (often called *Increasing Returns* or *Switching Costs*). Your definition is solid.
  3.  **Functional Redundancy:** Be careful here. In path dependence theory, this is usually the **counter-argument**. Economists often argue that even if paths differ, market competition forces them toward the *same efficient outcome*. If you teach this as a *type* of path dependence, students might think redundancy proves path dependence. It usually argues the opposite (that the path *didn't* matter). I have adjusted the question to frame this as a challenge the student must evaluate.
  4.  **Erasure:** This is an **epistemological** problem (evidence), not a mechanism. It's about whether we *can know* the path, not whether the path exists. I have kept your term but framed it as an evidentiary hurdle.

  Below are the materials. I have used your terminology in the question (so it matches your teaching) but the marking scheme rewards students who spot the nuances above.

  ***

  ### 1. The Essay Question

  **Time Allowed:** 45 Minutes
  **Word Limit:** None (Manage your time)

  **Question:**

  Consider two geographically identical river valleys, North and South. In year one, a grain mill is built on the North bank of the North Valley because the builder's horse bolted. In the South Valley, the mill is built on the optimal South bank. Over 500 years, the North Valley becomes a dense industrial metropolis; the South Valley remains agricultural.

  Using this hypothetical case, answer the following:

  1.  Explain how **fragility** and **lock-in** describe the divergence of these valleys.
  2.  Evaluate whether **functional redundancy** suggests this divergence matters economically.
  3.  Discuss the problem of **erasure**: if records of the bolted horse are lost, can we still claim path dependence?
  4.  Finally, address the epistemological problem: since we cannot re-run history to test the South Valley, what counts as evidence for "lock-in"? Does it matter for the theory of lock-in if the story we tell about the origin (like the Roman cart myth) turns out to be false?

  ***

  ### 2. Model Answer

  **Title:** Contingency, Lock-in, and the Problem of Evidence in Historical Causation

  The divergence of the North and South Valleys illustrates the core tension in path dependence: the relationship between accidental beginnings and rigid outcomes. To analyze this, we must distinguish between the *onset* of the path (fragility) and the *maintenance* of the path (lock-in), while acknowledging the difficulties in proving either.

  **Fragility and Lock-in**
  Fragility refers to sensitivity to initial conditions. In this scenario, the bolted horse is a negligible event with disproportionate consequences. Had the horse not bolted, the mill would have been sited optimally, likely mirroring the South Valley. This establishes contingency: the present is not determined by geography alone, but by a specific sequence. However, fragility alone does not explain the 500-year divergence. This requires lock-in. Lock-in suggests that after a certain point, the cost of switching paths exceeds the cost of continuing. In the North Valley, early infrastructure (roads, housing) built around the misplaced mill created increasing returns. Moving the city center later would be prohibitively expensive, making the "mistake" load-bearing. The accident becomes structural.

  **Functional Redundancy**
  A critic might invoke functional redundancy. This claim suggests that while the *location* differs, the *function* (economic output) might converge. Perhaps the South Valley's agriculture supplies the North's industry, creating a single efficient system regardless of the mill's location. If the total economic utility of both valleys combined is maximized, the specific path of the North Valley matters less than the outcome. However, most path dependence scholars argue that lock-in often preserves *inefficiency* (e.g., maintaining a suboptimal technology because it is established). If the North Valley is congested and polluted while the South is underutilized, redundancy is false; the path created a net loss. Students must be careful not to assume efficiency; path dependence is often a story of inefficiency preserved by history.

  **Erasure and Evidence**
  This leads to the problem of erasure. If the record of the bolted horse is lost, historians might assume the North bank was chosen for geological reasons. Erasure hides the contingency, making the present look inevitable. This complicates the epistemological problem: we only have one run of history. We cannot re-run the simulation with the horse staying put. Therefore, evidence for lock-in cannot be direct observation of alternative paths. Instead, scholars look for "smoking guns" of inefficiency—such as high switching costs or technologies that persist despite superior alternatives. We infer lock-in by identifying present-day constraints that lack a functional explanation.

  **The Roman Cart Question**
  Finally, does the truth of the origin story matter? Consider the Roman cart myth (that railway gauges derive from Roman chariot ruts), which historians largely debunk. If the story is false, does lock-in fail? Not necessarily. Lock-in describes a *mechanism* (switching costs), not a specific genealogy. Even if the railway gauge was chosen for engineering reasons, if it later became impossible to change due to infrastructure costs, lock-in still occurred. The falsity of the origin story undermines the *narrative* of contingency, but not necessarily the *reality* of the constraint. However, relying on false myths risks mistaking inevitable geographical determinism for historical path dependence. We must distinguish between a story that is metaphorically true (constraints exist) and literally true (Romans did it).

  **Conclusion**
  In sum, the North Valley scenario demonstrates how small accidents compound into structural rigidity. While functional redundancy challenges the economic significance of this divergence, and erasure obscures the evidence, the theory of path dependence remains robust if we can identify present-day inefficiencies that lack functional justification. We cannot re-run history, but we can identify the scars it left behind.

  ***

  ### 3. Marking Scheme (Total 20 Marks)

  **1. Application of Fragility (Contingency) [3 Marks]**
  *   **Full marks:** Identifies the "bolted horse" as a negligible cause with disproportionate effect; distinguishes this from geographical determinism.
  *   **Common Error:** Confusing fragility with chaos; suggesting the horse *forced* the outcome rather than *nudging* it.

  **2. Application of Lock-in (Mechanism) [3 Marks]**
  *   **Full marks:** Explains *why* the path stuck (switching costs, increasing returns, infrastructure investment).
  *   **Common Error:** Describing lock-in as "tradition" or "habit" rather than structural/economic cost.

  **3. Functional Redundancy as Critique [3 Marks]**
  *   **Full marks:** Recognizes this as an argument *against* the significance of path dependence (i.e., outcomes converge/are efficient anyway).
  *   **Common Error:** Treating redundancy as a *type* of path dependence rather than a counter-claim about efficiency.

  **4. Erasure and Evidentiary Limits [3 Marks]**
  *   **Full marks:** Identifies that lost records make contingency look like inevitability; links this to the difficulty of proof.
  *   **Common Error:** Claiming erasure proves path dependence didn't happen, rather than that we can't *see* it.

  **5. The "One Run of History" Problem [3 Marks]**
  *   **Full marks:** Acknowledges we cannot run counterfactuals; identifies proxy evidence (inefficiency, switching costs) as the solution.
  *   **Common Error:** Suggesting we can prove path dependence by simply finding the origin story (ignoring the need for structural evidence).

  **6. The Roman Cart / Truth of Origin [1 Mark]**
  *   **Full marks:** States that lock-in can exist even if the origin story is false (mechanism > genealogy), OR that false stories confuse determinism with contingency.
  *   **Common Error:** Claiming the theory collapses entirely if the origin story is debunked.

  **7. Nuance on Contested Claims [4 Marks]**
  *   **Full marks:** Explicitly marks debates as debated (e.g., "Scholars argue," "It is contested whether"). Specifically avoids presenting QWERTY/VHS efficiency as settled fact.
  *   **Common Error:** Presenting contested economic history (e.g., "QWERTY is definitely inefficient") as settled scientific fact. Deduct 1 mark per dogmatic claim.

  **Total: 20 Marks**
