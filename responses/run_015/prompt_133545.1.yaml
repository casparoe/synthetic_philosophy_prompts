      *   *Hypothesis:* "Historical Actor" status requires a specific cognitive architecture (likely involving error-correction/feedback loops that allow for *alternative possibilities* in a way mere causation doesn't).
      *   *Implication:* This reframes determinism. It's not about *cause*, it's about the *structure of explanation* (historical vs. mechanistic).

