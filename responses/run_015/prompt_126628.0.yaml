  An entity designated by a token.
  NOTE 2: Nothing in this document distinguishes a system whose symbols are about the world from one whose symbols are only about each other.
  **2.3 Canonical Reference Ontology**
  A closed set of definitions used to resolve ambiguity.
  NOTE: See 2.1.

  **3 Conformance Levels**
  Systems shall claim conformance at exactly one level (G-0 to G-4). Higher levels supersede lower levels only in marketing materials.

  **3.1 Level G-1 (Corpus Grounding)**
  Tokens shall be statistically associated with other tokens in the system's document corpus.
  NOTE: Grounding in your own document corpus reduces hallucination but certifies no semantic content.

  **3.2 Level G-2 (Ontological Grounding)**
