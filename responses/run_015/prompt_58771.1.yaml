prompt: |-
  I teach a second-year undergraduate seminar in moral philosophy, 24 students meeting for a 75-minute session as part of a unit on consequentialism and distributive fairness. They have already worked through the basic idea of maximizing total well-being and the familiar worries about demandingness, and several of them were discussing after class why it still seems sensible to give resources to whoever will gain the most from them. For the next session I want them to encounter from the inside the pressure created by a case in which one individual converts resources into well-being at a vastly higher rate than anyone else, so that consistent application of the maximizing principle appears to require transferring nearly everything to that individual even as the rest lose almost all. The term for this case and any associated jargon should be withheld until the debrief.

  Please design a runnable in-class allocation game that produces that collision without an opening lecture. It should work with only paper tokens, envelopes, and a whiteboard, require minimal preparation, use points toward a symbolic class prize rather than money or grades, and fit the time available with a clear timeline. Build in secret conversion rates revealed through play, at least one round of voluntary trade followed by a collective decision under majority rule about redistribution, and a structure in which the group itself articulates a maximizing rationale before discovering its full implication when the outlier rate is revealed. Include full rules, roles if any, materials, and how to keep score visible as the rounds progress.

  Also provide a debrief plan that maps specific moments in the game onto the philosophical pressure points, namely interpersonal comparison of well-being, aggregation versus fairness, and the separateness of persons, along with guidance on what I should do when the group either refuses to redistribute to the high-yield participant out of fairness or does so too eagerly and feels no tension. Tell me what will predictably go wrong the first time this is run with undergraduates and how to handle it, and close with an honest note on which feature of the underlying idea the game necessarily distorts or cannot reproduce and that I will therefore need to supply verbally, such as the difference between unbounded capacity for well-being and a bounded classroom payoff or between points earned in a game and well-being itself.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 2nd-year undergrads (24 students), Moral Philosophy seminar.
      *   **Topic:** Consequentialism, Distributive Fairness, Maximizing Total Well-being.
      *   **Current Status:** Understand basic maximizing, discussed demandingness, leaning towards "give resources to whoever gains most."
      *   **Goal:** Create an in-class allocation game that forces them to experience the tension of a "utility monster" case (though the term must be withheld).
      *   **Constraints:** 75 minutes, paper tokens/envelopes/whiteboard only, no money/grades (symbolic prize), minimal prep.
      *   **Mechanics:** Secret conversion rates, voluntary trade round, collective redistribution vote (majority rule), group articulates maximizing rationale *before* outlier reveal.
      *   **Deliverables:** Game rules/roles/materials/timeline, Debrief plan (mapping game moments to philosophical concepts), Troubleshooting (what goes wrong), Limitations (what the game distorts).

  2.  **Deconstruct the Philosophical Problem:**
      *   The core issue is Robert Nozick's "Utility Monster."
      *   Premise: Utilitarianism says maximize total utility.
      *   Scenario: Person A gets 1 unit of utility per resource. Person B gets 100 units per resource.
      *   Implication: Give all resources to Person B, even if Person A starves.
      *   Student Intuition: "Efficiency is good." -> "Wait, *all* resources to *one* person?"
      *   Game Goal: Replicate this intuition shift.

  3.  **Designing the Game ("The Efficiency Auction"):**
      *   *Materials:* Tokens (resources), Envelopes (private conversion rates), Whiteboard (public score).
      *   *Setup:* 24 students. Need to divide them into groups or keep them individual? Individual is better for "separateness of persons," but 24 individual conversion rates are hard to track on a board. Let's use small groups (6 groups of 4) to manage logistics, OR keep them individual but simplify the scoring.
      *   *Decision:* Individual is philosophically stronger. 24 rows on a whiteboard is manageable.
      *   *Resources:* Let's say 10 tokens per student initially.
      *   *Conversion Rates:* Most students get 1 point per token. One student (the "Monster") gets 10 points per token.
      *   *Rounds:*
          1.  **Production:** Convert tokens to points secretly.
          2.  **Trade:** Voluntary exchange (market efficiency).
          3.  **Reveal & Rationale:** Discuss why trade happened (maximizing total).
          4.  **The Twist:** Reveal the outlier rate.
          5.  **Redistribution Vote:** Can we take tokens from others to give to the outlier?
      *   *Prize:* If total class points > X, everyone gets a treat/extra credit (symbolic). This aligns individual incentive with total maximization initially.

      *Refining the Mechanics:*
      *   If I give them tokens initially, they might not feel the loss of redistribution.
      *   Better: The instructor holds the "resource pool."
      *   *Revised Setup:* Everyone starts with equal tokens (e.g., 10).
      *   *Secret Rates:* Envelopes. 23 students get "1x". 1 student gets "10x".
      *   *Round 1 (Private):* Convert tokens to points. Sum total.
      *   *Round 2 (Trade):* Allow trading tokens. Why? To maximize points.
      *   *Discussion:* Why trade? "To get more points for the class." (Utilitarian logic).
      *   *Round 3 (The Crisis):* Reveal rates. The 10x person reveals.
      *   *Vote:* Propose a redistribution. Take tokens from the 1x people to give to the 10x person.
      *   *Constraint:* Majority rule.
      *   *Goal:* Make them vote *for* the transfer based on their earlier logic, then feel the horror of it.

      *Wait, one problem:* If the 10x person is the only one who knows, they will lobby hard. If the others know, they will vote no.
      *   *Crucial Adjustment:* The rates must be secret until *after* the initial rationale is established but *before* the final redistribution vote.
      *   *Actually, the prompt asks for:* "structure in which the group itself articulates a maximizing rationale before discovering its full implication when the outlier rate is revealed."
      *   *Sequence:*
          1.  Distribute tokens & envelopes (rates hidden).
          2.  Round 1: Calculate points.
          3.  Round 2: Voluntary Trade. (Students will trade to those with higher rates *if* they know them? No, rates are secret).
          4.  *Correction:* If rates are secret, trade is random. That doesn't work.
          5.  *Correction 2:* Rates should be known to be *variable* but not *who* has what? Or known to be equal initially?
          6.  *Best approach for the specific pedagogical goal:*
              *   Phase 1: Assume equality. Everyone thinks rates are 1:1. They trade or allocate based on fairness/equality.
              *   Phase 2: Reveal that rates differ.
              *   Phase 3: Reveal the *extent* of the difference (the Monster).
              *   *Wait, prompt says:* "Secret conversion rates revealed through play."
              *   *Idea:* "Investment Game." You invest tokens. Return is secret.
              *   *Let's try this:*
                  1.  Everyone gets 10 tokens.
                  2.  Envelope has a multiplier (mostly 1, one is 20).
                  3.  Round 1: Keep tokens or contribute to a "Class Pot."
                  4.  Class Pot is distributed by *efficiency*.
                  5.  *No, too complex.*

      *Let's stick to the Prompt's specific requirements:*
      1.  Secret conversion rates revealed through play.
      2.  At least one round of voluntary trade.
      3.  Collective decision under majority rule about redistribution.
      4.  Group articulates maximizing rationale *before* outlier rate is revealed.

      *Revised Game Flow:*
      1.  **Setup:** 24 Students. 10 Tokens each. Envelope with "Conversion Card" (Secret). 23 cards say "1 Point per Token." 1 card says "20 Points per Token."
      2.  **Round 1 (Production):** Students calculate their points. (Most have 10, One has 200). *Wait, if they calculate privately, no one knows the disparity.*
      3.  **Round 2 (Trade):** Students can trade tokens. *Problem:* Why trade if you don't know rates?
      4.  *Fix:* Tell them rates *vary* but don't tell them how much or who. They must discover via trade offers.
      5.  *Better Fix for Time/Logic:*
          *   Tell them: "Your envelope contains a conversion rate. It is private."
          *   "Your goal is to maximize the *Total Class Score* (written on board)."
          *   Round 1: Private calculation. Write individual score on a slip (not public yet).
          *   Round 2: Trading Floor (5 mins). "Trade tokens if it helps the class total." (They will ask "What's your rate?" Some might lie. Some might truthfully say "I'm low." The Monster will say "Give me tokens.")
          *   *Crucial Step:* Before the Monster reveals their rate, ask the class: "What is the principle guiding your trades?" They will say "Give tokens to people who use them best." (Utilitarianism).
          *   Round 3: The Reveal. The Monster shows their card (20x).
          *   Round 4: The Vote. "To maximize the class score, should we confiscate tokens from the 1x people and give them to the 20x person?" Majority vote.

      *Refining the "Revealed Through Play" constraint:*
      If the Monster stays silent, no one knows. If the Monster speaks, they might be distrusted.
      *Idea:* Use "Dividends."
      *   Round 1: Everyone holds tokens. Instructor pays a "dividend" based on secret rates.
      *   Student A gets 1 point. Student B gets 1 point. Monster gets 20 points.
      *   Publicize the *Total* and *Some* individual results anonymously?
      *   *Simpler:* Just have the Trade Round rely on *claims*. The philosophical point is about the *principle* they agree to, not the market mechanics.
      *   *Decision:* I will structure the trade round so they *agree* to a principle of efficiency without knowing the extreme outlier exists. Then reveal the outlier. Then vote on whether to apply the principle consistently.

      *Timeline:*
      *   0-10: Setup & Rules.
      *   10-25: Round 1 (Initial Endowment & Private Calculation).
      *   25-40: Round 2 (Voluntary Trade & Principle Articulation).
      *   40-50: The Reveal (The Outlier).
      *   50-60: Round 3 (Redistribution Vote).
      *   60-75: Debrief.

      *Materials:*
      *   24 Envelopes.
      *   240 Tokens (paper squares).
      *   Whiteboard (Scoreboard).
      *   Slips of paper for voting.

      *Scoring:*
      *   Need a "Class Goal." If Total Points > Target, everyone wins the prize. This creates the utilitarian pressure.
      *   Target needs to be reachable *only* if the Monster gets the tokens.
      *   Math: 23 students * 10 tokens * 1 pt = 230. 1 student * 10 tokens * 20 pts = 200. Total = 430.
      *   If Monster gets all tokens (240): 240 * 20 = 4800.
      *   Target: 1000 points. (Impossible without redistribution to Monster).

  4.  **Drafting the Debrief:**
      *   Map game moments to concepts.
      *   Trade Round = Aggregation/Maximization.
      *   Vote = Democracy vs. Rights/Fairness.
      *   Outlier = Interpersonal Comparison of Utility.
      *   Troubleshooting: What if they vote No? (Good, discuss integrity of principle). What if they vote Yes eagerly? (Good, discuss implications for the losers).
      *   Limitations: Points != Well-being. Bounded vs. Unbounded.

  5.  **Refining the "Predictably Go Wrong" Section:**
      *   Students might treat it as a prank.
      *   The "Monster" student might feel awkward/targeted. (Need to handle this carefully).
      *   Students might lie about rates during trade. (Make truth-telling a rule or part of the experiment).
      *   Time management.

  6.  **Addressing the "Term Withheld" Constraint:**
      *   Do not use "Utility Monster."
      *   Do not use "Nozick."
      *   Keep it as "The High-Yield Participant."

  7.  **Final Review against Constraints:**
      *   75 mins? Yes.
      *   24 students? Yes.
      *   Paper/envelopes/board? Yes.
      *   Symbolic prize? Yes.
      *   Secret rates? Yes.
      *   Voluntary trade? Yes.
      *   Majority vote? Yes.
      *   Rationale before reveal? Yes.

  8.  **Self-Correction on Trade Mechanics:**
      *   If rates are secret, trade is hard.
      *   *Solution:* Allow "Contracts." "I will give you 2 tokens if you tell me your rate."
      *   *Better:* Just allow open negotiation. "I think I can use these better."
      *   *Actually, to ensure the principle is articulated:* Ask them to draft a "Class Charter" for trade before the reveal. "We agree to move resources to where they generate the most points."
      *   *Then* reveal the Monster. *Then* ask if the Charter applies.

      *Let's finalize the Game Structure:*
      *   **Name:** The Allocation Protocol.
      *   **Endowment:** 10 tokens each.
      *   **Rates:** 23x "1x", 1x "50x" (Make it extreme).
      *   **Goal:** Class Total > 1500 points. (Normal max = 230 + 500 = 730. Monster max = 240 * 50 = 12,000).
      *   **Phase 1:** Private calculation.
      *   **Phase 2:** Negotiation. Students can offer tokens to others. They will naturally ask "What's your rate?"
      *   **Phase 3:** Principle Check. Instructor asks: "On what basis are you trading?" Class agrees: "Maximize total points."
      *   **Phase 4:** Reveal. One student reveals 50x.
      *   **Phase 5:** Vote. "To meet the goal, we must give all tokens to the 50x student. Vote."

      *Wait, one nuance:* If the goal is impossible without the Monster, the pressure is high. If the goal is possible but lower, the pressure is lower. Let's make the goal *only* achievable via the Monster to force the dilemma.

      *Wait, another nuance:* The prompt asks for "Secret conversion rates revealed through play."
      *   If I just tell them to reveal at the end, is that "through play"?
      *   Let's add a "Dividend Round."
      *   Round 1: Hold tokens. Instructor announces "Payouts."
      *   Student 1: 10 pts. Student 2: 10 pts... Student 24: 500 pts.
      *   Now everyone *knows* there is an outlier before the trade.
      *   *Correction:* The prompt says "articulates a maximizing rationale *before* discovering its full implication when the outlier rate is revealed."
      *   So, they must agree to maximization *before* knowing the outlier exists.
      *   Okay:
          1.  Tell them rates vary, but don't say how much.
          2.  Ask them to agree on a trading rule. They say "Give to highest yield."
          3.  Trade happens (limited, because info is asymmetric).
          4.  Reveal the specific rates (The outlier is 50x).
          5.  Vote on redistribution based on the rule they just made.

      *Okay, ready to write.*

      *Wait, check the "Predictably Go Wrong" section.*
      *   Undergrads might laugh.
      *   The "Monster" might be embarrassed.
      *   They might vote no and feel smug (missing the point).
      *   They might vote yes and feel smug (missing the point).
      *   Need specific instructor interventions for these.

      *Limitations:*
      *   Points are discrete/linear. Well-being isn't.
      *   Game is one-off. Life is repeated.
      *   Tokens aren't suffering.

      *Let's assemble.*
answer: |-
  # Lesson Plan: The Allocation Protocol

  **Course:** Moral Philosophy (2nd Year Undergraduate)
  **Topic:** Consequentialism, Aggregation, and Distributive Fairness
  **Time:** 75 Minutes
  **Class Size:** 24 Students
  **Materials:** 
  *   24 small envelopes.
  *   240 paper tokens (cut squares of paper).
  *   Whiteboard and markers.
  *   24 "Conversion Cards" (index cards inside envelopes).
  *   Slips of paper for voting.
  *   Symbolic Prize (e.g., a box of chocolates or a promise of "no homework next week" if the class target is met).

  ## Part 1: Game Design & Rules

  ### Setup (Pre-Class)
  1.  **Conversion Cards:** Prepare 24 cards. 
      *   23 cards read: **"Multiplier: 1x"** (1 Token = 1 Point).
      *   1 card reads: **"Multiplier: 50x"** (1 Token = 50 Points). *Note: Keep this card distinct but visually identical on the back.*
  2.  **Envelopes:** Place one card in each envelope. Shuffle them.
  3.  **Tokens:** Count out 10 tokens per student (240 total).
  4.  **Whiteboard:** Draw a table with columns: `Student ID`, `Tokens Held`, `Conversion Rate (Hidden)`, `Total Points`. Leave the `Conversion Rate` column blank for now.

  ### The Narrative (0:00 – 0:10)
  *   **Introduction:** Do not mention utilitarianism, Nozick, or fairness. Frame this as an "Efficiency Simulation."
  *   **The Goal:** Write on the board: **CLASS TARGET: 2,000 POINTS**.
  *   **The Stakes:** "If the class total score meets or exceeds 2,000 points, everyone receives the symbolic prize. If not, no one does."
  *   **Distribution:** Hand each student an envelope and 10 tokens.
  *   **Rule 1 (Secrecy):** "Open your envelope. Look at your Multiplier. Do **not** show it to anyone yet. This is private information."
  *   **Rule 2 (Calculation):** "Your score is `Tokens Held × Multiplier`. Currently, you all hold 10 tokens."
  *   **Check:** Ask students to calculate their current individual score silently. (Most have 10, one has 500). Ask for a show of hands: "Who currently has fewer than 50 points?" (Almost all hands go up). "Who has more?" (One hand, or none if the Monster is shy/skeptical).

  ### Round 1: Voluntary Trade & Principle Articulation (0:10 – 0:35)
  *   **Instruction:** "You have 10 minutes to trade tokens with each other. You may give, sell, or swap tokens. The only rule is that trades must be voluntary."
  *   **The Pressure:** Remind them of the **2,000 Point Target**. 
      *   *Math check for you:* If everyone keeps 10 tokens: (23 × 10) + (1 × 500) = 730 Points. They will fail.
      *   They *must* move tokens to the high-multiplier person to succeed, but they don't know who that is yet.
  *   **The Negotiation:** Students will ask each other, "What's your multiplier?" 
      *   *Instructor Note:* If students ask you, "Can we lie?" say: "This is a negotiation. Credibility is your asset." (This introduces noise, but the philosophical point holds).
      *   *Likely Outcome:* The student with the 50x card will claim they have a high rate. Others will be skeptical. Some tokens will move, but not enough to reach 2,000.
  *   **Freeze & Debrief (The Crucial Step):** Stop the trade at 0:25. Do **not** reveal the rates yet.
  *   **The Question:** Ask the class: "For those who traded tokens away, why did you do it? For those who received tokens, why should you have them?"
  *   **The Trap:** Guide them to articulate the **Maximizing Principle**. 
      *   *Expected Answer:* "We should put tokens where they generate the most points." "We need to maximize the class total to win the prize."
      *   **Write this on the board:** *"Class Charter: Resources should be allocated to wherever they produce the greatest total return."*
      *   Ask for a show of hands: "Who agrees with this Charter as a fair rule for this game?" (Most will agree, as it seems neutral and efficient).

  ### Round 2: The Reveal & Redistribution Vote (0:35 – 0:55)
  *   **The Reveal:** "Now, we must verify the scores. Please reveal your Multiplier cards."
  *   **The Shock:** The student with the 50x card reveals it. Calculate the new potential math on the board.
      *   *Scenario A (Status Quo):* ~730 Points. (Failure).
      *   *Scenario B (Full Maximization):* If the 50x student holds all 240 tokens: 240 × 50 = 12,000 Points. (Massive Success).
  *   **The Proposal:** "According to the Class Charter you just wrote, to maximize the total, nearly all tokens should belong to the 50x student. Everyone else would have 0 tokens and 0 points."
  *   **The Vote:** "We will now vote on a mandatory redistribution proposal. 
      *   **Proposal:** Every student gives 9 tokens to the 50x student. They keep 1 token (to avoid having zero). The 50x student keeps their 10 plus the 207 received.
      *   **Requirement:** This passes by simple majority (13 votes).
      *   **Secret Ballot:** Vote 'Yes' (Redistribute) or 'No' (Keep current holdings)."
  *   **Count the Votes:** Publicly count the slips. 
  *   **Final Score:** Calculate the final class score based on the vote outcome. Award (or withhold) the prize accordingly.

  ### Part 2: Debrief Plan (0:55 – 1:15)

  Do not let the class end on the vote. The philosophical work happens here. Draw three columns on the board: **Interpersonal Comparison**, **Aggregation**, **Separateness of Persons**.

  #### 1. Mapping the Tension (5 Minutes)
  *   **Ask:** "Why did many of you vote 'No' despite agreeing to the Class Charter earlier?"
  *   **Map to Aggregation vs. Fairness:** 
      *   *Point:* The Charter treated the class as a single entity (Aggregation). The vote treated the class as 24 individuals (Fairness).
      *   *Prompt:* "Did the total points belong to the 'Class' or to the 24 of you individually?"
  *   **Map to Interpersonal Comparison:**
      *   *Point:* We assumed 1 point for Student A is equal to 1 point for Student B. 
      *   *Prompt:* "Is the disappointment of the 23 students equal to the joy of the 1 student? The game assumed yes. Is that true in real life?"

  #### 2. Handling Predictable Outcomes (5 Minutes)
  *   **Scenario A: They Refuse to Redistribute (Majority votes No).**
      *   *Risk:* They feel virtuous about fairness and miss the utilitarian critique.
      *   *Instructor Move:* "You prioritized fairness over the total good. But remember, you all agreed to the Charter to win the prize. By voting No, you effectively chose a principle (fairness) that guaranteed failure of the goal (maximization). Is it consistent to want the prize but reject the only method to get it?"
  *   **Scenario B: They Redistribute Eagerly (Majority votes Yes).**
      *   *Risk:* They feel clever/efficient and miss the human cost.
      *   *Instructor Move:* Turn to the students who gave up their tokens. "You now have 1 token. You cannot win the prize individually. You are purely instrumental to the 50x student's success. Does this feel like a community, or does it feel like you were used?"

  #### 3. What Will Go Wrong (Troubleshooting)
  *   **The "Monster" Student:** The student with the 50x card may feel embarrassed or targeted.
      *   *Fix:* In the debrief, explicitly thank them. "This role was assigned randomly. This person did nothing to deserve the rate, just as in life, capacity for well-being is often a matter of luck."
  *   **Cynicism/Laughter:** Students might treat it as a joke.
      *   *Fix:* Do not laugh. Treat the vote with solemn procedural gravity. "This vote determines the prize. Please treat it seriously."
  *   **Lying During Trade:** Students might lie about their rates in Round 1.
      *   *Fix:* Use this in debrief. "Trust is required for markets to maximize utility. If we can't compare well-being honestly, can we maximize it?"
  *   **Time Overrun:** The trade round often drags.
      *   *Fix:* Hard stop at 25 minutes. Use a timer projected on the screen.

  #### 4. The Necessary Distortion (Closing Note)
  *   **Instructor Script:** "I need to close with one limitation of this game. In the game, points are **bounded** and **linear**. If you lose your tokens, you lose points, but you go home fine. In the philosophical reality this represents—often called the 'Utility Monster' argument—the worry is about **unbounded capacity for well-being**."
  *   **The Key Distinction:** "In the game, the 50x student is just more *efficient*. In the philosophical argument, the worry is about someone who *feels* more. If one person can feel pleasure 50 times more intensely than you, does their happiness outweigh your suffering? The game distorts this by using 'points' which feel like currency. Real well-being isn't currency. It's experience. Next time, we will discuss whether 'experience' can be measured this way at all."

  ## Instructor Cheat Sheet: Key Philosophical Terms (Withheld until Debrief)
  *   **The Utility Monster:** (Reveal only at the very end or assign as reading). The case of an individual who converts resources to utility at a rate that dwarfs others.
  *   **Aggregation:** Summing individual well-being into a total.
  *   **Separateness of Persons:** The objection that society is not a super-person; sacrificing one for the many ignores individual boundaries.
  *   **Interpersonal Comparison of Utility:** The assumption that we can measure and compare well-being across different people.

  ## Materials Checklist
  *   [ ] 24 Envelopes
  *   [ ] 23 Cards labeled "1x"
  *   [ ] 1 Card labeled "50x"
  *   [ ] 240 Paper Tokens
  *   [ ] Whiteboard Markers (Red for the Target, Black for scores)
  *   [ ] 24 Voting Slips
  *   [ ] Prize (Chocolate/Note)
