answer: |-
  **Project Title:** Gauge Freedom and Prior Sensitivity in Anthropics: Decomposing the Presumptuous Philosopher

  **Principal Investigator:** [Your Name]
  **Duration:** One Semester

  **1. Research Question and Motivation**
  The debate between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) is typically framed as a conflict over how to update indexical information. In the "Presumptuous Philosopher" scenario, SIA dictates that an agent should be nearly certain they inhabit a world with a vast population rather than a small one, solely because the vast world contains more observer-moments. SSA avoids this conclusion but incurs costs elsewhere, such as the Doomsday Argument.

  Current literature treats SSA and SIA as competing fundamental principles of reasoning. This project challenges that framing. My working hypothesis is that the SSA/SIA disagreement is not a fundamental dispute about self-locating belief, but rather an artifact of conflating three distinct variables: (1) the non-indexical prior over world-types, (2) the updating rule, and (3) the "gauge"—the scaling factor used to measure observer density within a world.

  The central research question is: **Is there a formal transformation of priors and observer measures that renders SSA and SIA credence functions isomorphic, such that any remaining disagreement is purely about decision-theoretic policy (updateless vs. updateful) rather than anthropic principle?**

  If this hypothesis holds, the "absurdity" of the Presumptuous Philosopher is not a failure of SIA *per se*, but a result of implicit, unexamined priors over world sizes and an arbitrary choice of observer measure.

  **2. Limitations of Existing Approaches**
  Three dominant positions currently occupy the field, yet all leave the core structural question open:

  *   **Plain SSA/SIA:** These approaches treat the "number of observers" in a hypothesis as a metaphysical given. They assume that counting observers is objective. Consequently, they attribute divergent credences to the anthropic principle itself, ignoring that changing the unit of counting (e.g., observer-moments vs. whole lives) functions mathematically as a prior shift.
  *   **The Decision-Theoretic Turn (e.g., UDT):** Proponents argue we should bypass credences entirely and select policies that maximize utility across all possible selves. While powerful, this often sidesteps the epistemic question: *Why* do the credences diverge in the first place? It treats the symptom (bad decisions) without diagnosing the cause (conflated gauge and prior).
  *   **Intuition Pumping:** The standard method for adjudicating these views involves constructing new thought experiments (e.g., Sleeping Beauty variants). This is methodologically weak for this specific problem. If the SSA/SIA split is merely a parameterization error, no amount of intuitive case-testing will resolve it; only formal decomposition can.

  **3. Methodology**
  This project will proceed in three stages over the course of the semester.

  *   **Stage 1: Formalizing the Gauge (Weeks 1–5).**
      I will construct a generalized probabilistic framework where the "measure" of an observer within a world is not fixed at 1 (or $N$, the population size), but is treated as a variable parameter $\mu$. I will define SSA and SIA not as rigid rules, but as specific settings of $\mu$ and the prior $P(H)$. The goal is to derive a transformation function $T$ such that $Credence_{SSA} = T(Credence_{SIA})$.
  *   **Stage 2: Decision Invariance Testing (Weeks 6–10).**
      The strongest objection to the gauge idea is that it is trivial relabeling: if you rescale the measure, you must rescale the utility function to keep decisions invariant. If the rescaling changes the optimal bet, the gauge is not free; it is substantive. I will test this by applying the formalized framework to standard Dutch Book scenarios. I will determine if an agent can maintain consistent betting behavior across SSA and SIA frameworks solely by adjusting priors and measures, or if a residual conflict in action remains.
  *   **Stage 3: Isolating the Updateless Component (Weeks 11–14).**
      If the credences can be harmonized via the gauge transformation, any remaining disagreement must lie in the decision theory. I will isolate the specific contribution of "updatelessness" in the Presumptuous Philosopher case. This involves comparing the output of the harmonized credence function against an updateless decision rule to see if the "absurd" conclusion persists.

  **4. Expected Results and Failure Conditions**
  *   **Success:** The project demonstrates that for any SIA credence distribution, there exists a set of SSA priors and observer measures that yields identical betting odds. This would imply the "Presumptuous Philosopher" problem is actually a "Presumptuous Prior" problem. The deliverable will be a formal proof of this equivalence class.
  *   **Failure/Refutation:** The project fails if, after fixing the gauge and aligning priors, SSA and SIA still prescribe different actions in identical betting scenarios. This would prove that the disagreement is fundamental to the updating rule, not the modeling parameters.
  *   **Inconclusive:** If the transformation requires priors that are mathematically valid but epistemically inaccessible (e.g., requiring infinite precision), the hypothesis may be formally true but practically useless.

  **5. Addressing the "Trivial Relabeling" Objection**
  The most significant challenge to this project is the claim that changing the observer measure is merely notational. If I claim there are "twice as many observers" but also halve the utility of each, nothing changes. Critics will argue this project simply renames the prior.

  I will meet this objection by focusing on *implicit* commitments. Anthropics literature often treats the "number of observers" as an objective fact derived from physics or biology, not a free parameter. By explicitly modeling the gauge, I force these implicit commitments into the open. The project will show that proponents of SIA often refuse to adjust their priors when the gauge changes, leading to double-counting. The value of the project is not in changing the math, but in exposing where the math is being applied inconsistently in the literature.

  **6. Scope and Risk Management**
  This proposal is scoped for a single semester. The primary risk is that the formalization of the "gauge" becomes too entangled with specific metaphysical theories of personal identity.
  *   **Cutting Scope:** If the general proof of isomorphism proves intractable, I will restrict the domain to finite worlds with discrete observer counts. This sacrifices generality but ensures a determinate result for the Presumptuous Philosopher case specifically.
  *   **Decision Theory Limit:** I will not attempt to solve Updateless Decision Theory (UDT). I will treat UDT as a black box input for Stage 3. The goal is to see what anthropic input UDT requires, not to justify UDT itself.

  **7. Significance**
  For a workshop audience in decision theory and epistemology, this project offers a deflationary account of a entrenched debate. If successful, it suggests that progress in anthropics requires not better intuition pumps, but better bookkeeping regarding priors and measures. It shifts the burden from "Which anthropic principle is true?" to "What prior over world sizes is justified?", which is a question standard epistemology is better equipped to handle.
