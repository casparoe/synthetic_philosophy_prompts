prompt: |-
  I'm prepping interview questons for a podcast with a philospher who defends a specific readng of Zhuangzi's butterfly dream. She says it isn't about global dream skepticism at all, but about what she calls 'ontological permeability' — the idea that self/world boundaries are pragmatic framing devices we toggel between, not hard metaphysical lines. I want 8-10 questions that don't just have her summarize the passage. Need at least one pressing whether this collapses into banal contextualism, one on what personal identity becomes if that boundary is purely pragmatic, and one aimed at her stock reply that waking and dreaming are 'equally real modes' — ask how that's not just wordplay. For each, sketch the answer she's likely to give and then a sharper follow-up keyed to it. No generic career questions please.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A philosopher defending a specific reading of Zhuangzi's "Butterfly Dream."
      *   **Core Thesis:** It's *not* global dream skepticism (Descartes-style). It *is* "ontological permeability" (self/world boundaries are pragmatic framing devices, not metaphysical lines).
      *   **Requirements:** 8-10 questions.
      *   **Specific Constraints:**
          *   No summary questions (don't just ask "what does it mean?").
          *   Must include one question challenging "banal contextualism."
          *   Must include one question on "personal identity" if boundaries are pragmatic.
          *   Must include one question challenging the "equally real modes" claim (is it wordplay?).
          *   Format: Question -> Sketch of Likely Answer -> Sharper Follow-up.
          *   Tone: Podcast interview (engaging, deep, not generic career stuff).

  2.  **Deconstruct the Guest's Position:**
      *   *Text:* Zhuangzi, Chapter 2 (Qiwulun), "The Butterfly Dream."
      *   *Standard Reading:* How do I know I'm not dreaming right now? (Skepticism).
      *   *Guest's Reading:* Transformation (*hua*). The boundary between "Zhuangzi" and "Butterfly" is fluid. Reality isn't fixed; perspectives are tools.
      *   *Key Term:* "Ontological Permeability."
      *   *Key Claim:* Waking and dreaming are "equally real modes."

  3.  **Drafting Questions (Iterative Process):**

