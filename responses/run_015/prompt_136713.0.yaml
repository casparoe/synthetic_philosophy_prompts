          *   *Refinement:* Make it about the *function* of the doubt.
          *   *Follow-up:* If it's not doubt, what is the anxiety Zhuangzi expresses?

      *   *Question 2: Ontological Permeability (The Core).* Define the term in action.
          *   *Draft:* What is ontological permeability?
          *   *Refinement:* Ask about the *cost* of this permeability. Does anything stay solid?
          *   *Follow-up:* If nothing is solid, how do we navigate ethics?

      *   *Question 3: Personal Identity (Required).*
          *   *Draft:* Who are you if boundaries are pragmatic?
          *   *Refinement:* Focus on responsibility. If "I" am a frame, who pays for my actions?
          *   *Follow-up:* Is this a dissolution of the self or an expansion?

      *   *Question 4: Equally Real Modes (Required - Wordplay Challenge).*
          *   *Draft:* Isn't saying dreaming is real just wordplay?
          *   *Refinement:* Challenge the phenomenological difference. Pain in dreams vs. pain in waking.
          *   *Follow-up:* Does this devalue the urgency of waking life?

      *   *Question 5: Banal Contextualism (Required).*
          *   *Draft:* Is this just saying "context matters"?
          *   *Refinement:* Accuse her of trivializing metaphysics into linguistics.
          *   *Follow-up:* What is the *ontological* bite if it's just framing?

      *   *Question 6: Transformation (Hua).*
          *   *Draft:* What about transformation?
          *   *Refinement:* Connect permeability to the concept of *hua* (transformation). Is it literal or metaphorical?
          *   *Follow-up:* If literal, does physics break? If metaphorical, is it poetry or philosophy?

      *   *Question 7: Ethics/Action.*
          *   *Draft:* How do you live this way?
          *   *Refinement:* Pragmatism usually implies success. What is the *goal* of toggling frames?
          *   *Follow-up:* Is there a "wrong" frame?

      *   *Question 8: The "Awakening".*
          *   *Draft:* What happens when he wakes up?
          *   *Refinement:* The text ends with "I don't know." She says it's permeability. Does the ending support her?
