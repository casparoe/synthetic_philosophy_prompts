  **Cover Note**

  **To:** The Minister
  **From:** Permanent Secretary
  **Re:** Demographic Resilience Strategy

  The attached strategy resolves outstanding axiological disputes by converting normative judgements into adjustable technical parameters. All contested values regarding the worth of existence are now located in Annex A, allowing policy appraisal to proceed without further philosophical delay. The headline metric, Existence-Adjusted Life Years (EALY), is ready for immediate deployment.

  ***

  **The Strategy**

  1. The Ministry adopts Existence-Adjusted Life Years (EALY) as the primary metric for policy appraisal. EALY sums lifetime wellbeing across all citizens, subtracting a Critical Wellbeing Reference (CWR) for each existence.^1

  2. Ecological modelling indicates a Social Allee Effect below current population densities. Institutional viability requires a minimum threshold of participants; therefore, population shrinkage risks collapsing the very goods that make life worth living. Stability dictates growth.

  3. Policy options are scored against the CWR. Where the CWR is set low, adding lives with positive wellbeing increases total EALY. Where set high, only lives exceeding the threshold contribute value. The CWR is set by Committee annually.

  4. FAQ: Citizen Query: "Does this decide how many people should exist?" Ministry Response: "The Ministry does not prescribe existence counts. It optimises the EALY aggregate based on viability parameters. The resulting population size is a technical output, not a normative target."

  5. Current modelling suggests the highest EALY return on investment is achieved by maximising the number of lives lived at the minimum viable wellbeing threshold. While individual quality is modest, the aggregate value is supreme. This represents optimal stewardship.

  6. Recommendations shift sign depending on the CWR, though the strategic objective remains constant: maximise the metric. Whether we prioritise depth or breadth of experience is merely a matter of parameter calibration, not moral disagreement.

  7. We recommend immediate implementation of the High-Volume Low-Threshold initiative. This ensures the Republic remains above the Social Allee limit while securing the highest possible EALY score per fiscal unit.

  ^1 *The CWR represents the lifetime wellbeing level above which a new life contributes positively to the national account.*

  ***

  **Annex B: Worked Examples**

  **Scenario 1: Cost-Neutral Addition**
  Adding 1,000 citizens with positive wellbeing, no resource impact.
  *   If CWR is low: EALY increases significantly. Policy: Proceed.
  *   If CWR is high: EALY decreases. Policy: Reject.

  **Scenario 2: Contraction for Quality**
  Population halves; remaining citizens double their wellbeing.
  *   If CWR is low: EALY crashes due to lost heads. Policy: Reject.
  *   If CWR is high: EALY rises due to average gain. Policy: Proceed.

  **Scenario 3: Viability Threshold**
  Population nears minimum institutional size.
  *   Ecological risk overrides CWR. Policy: Grow regardless of wellbeing score to prevent collapse.

  ***

  **What I'm Aiming At**

  I'm parodying Critical-Level Utilitarianism and the technocratic habit of hiding value judgments inside "neutral" parameters. The document treats the "Critical Wellbeing Reference" like a tax rate rather than a moral verdict on whether a life is worth starting. I've exaggerated the ecological slide—using the Allee effect (a biological fact about mating success) to justify a moral claim about population size—to highlight how easily "is" becomes "ought" in policy papers. The conclusion lands the "Repugnant Conclusion" (many barely-good lives beat fewer great ones) without naming it, presenting it as prudent management. I left out real politics to keep the focus on the reasoning style.
