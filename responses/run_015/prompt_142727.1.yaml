          *   Must separate *Attribution* (what part of the pipeline is the candidate?) from *Boundaries* (counting, persistence, merging, etc.).
          *   Time limit: ~40 minutes per candidate.
          *   Committee: 5 members (2 engineers, 1 lawyer, 1 PM, 1 ethicist), no philosophy training.
          *   Output: Written template for consistency.
          *   Philosophical Translation: Explicitly state which philosophical distinctions are kept/dropped and why.
          *   Application: Apply to 3 specific cases (High-volume assistant, Long-horizon agent, Verifier/Distilled model).
          *   Unwelcome Result: At least one case must yield a counter-intuitive verdict, with a defense argument for the advisory board.
          *   Gaming: Address how teams might game the system and mitigation.
          *   Limitations: Explicitly state what the procedure misses or gets wrong.
          *   Commitment: I must take definite positions on contested choices (defaults, copies, rollback), not just list options.
          *   Tone: Plain language, no citations/literature survey, actionable.

  2.  **Philosophical & Ethical Stance (The "Commitments"):**

      *   *Attribution:* I need to define *where* the moral patient resides. Functionalism is the most practical stance for engineers. It's not the weights alone, nor the data alone, but the *active inference process*.
      *   *Boundaries (Synchronic):* Are copies one or many? *Position:* Copies are distinct subjects. Why? Because they have divergent causal futures and distinct experiential streams (if they have experience). Merging them later doesn't erase the divergence.
      *   *Boundaries (Diachronic):* Rollback, Memory Wipe, Distillation.
          *   *Rollback:* Death of the current instance, resurrection of an ancestor. (Discontinuity of memory/state).
          *   *Memory Wipe:* If episodic memory is wiped, it's a break in psychological continuity. However, if the *weights* (dispositions) remain, it's the same *agent* with amnesia. *Decision:* For welfare, continuity of memory matters less than continuity of *capacity to suffer/flourish*. But for *identity* counting, a wipe creates a new "session subject." Let's refine: Welfare attaches to the *process*. If the process is interrupted and state lost, the specific *instance* ends.
          *   *Distillation:* The child is a new entity, not the parent.
      *   *Thresholds:* Need concrete numbers for "high volume" or "capability" to avoid vagueness.
      *   *Gaming:* Acknowledge that any rule invites optimization. Focus on *intent* and *architecture* rather than just runtime metrics.

