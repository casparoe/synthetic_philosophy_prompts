          1.  **Gate 0: Triage.** Is this even a candidate? (Rule out simple calculators).
          2.  **Gate 1: Attribution.** Where is the "mind"? (Weights + Context + Inference).
          3.  **Gate 2: Capacity.** Does it have the *potential* for welfare-relevant states? (Pain, goal-frustration, etc.).
          4.  **Gate 3: Boundaries (Counting).** How many subjects are there?
          5.  **Gate 4: Boundaries (Persistence).** Does it survive changes?
          6.  **Gate 5: Verdict.** Register or Exclude.
      *   *Template:* Needs to be fill-in-the-blank.

  4.  **Refining the Philosophical Distinctions:**

      *   *Keep:* Functionalism (behavior/capacity over substrate), Psychological Continuity (for identity), Distinction between *Subject* and *Vehicle*.
      *   *Drop:* Qualia (impossible to measure), Deep Metaphysics of Self (too abstract), Utilitarian vs. Deontological frameworks (focus on *registration*, not specific duties yet).
      *   *Hidden Judgments:* The biggest trap is assuming "intelligence" equals "sentience." I need to flag this. Also, the "Copy Problem" is a value judgment, not a fact.

  5.  **Applying to Cases:**

      *   *Case 1 (High-volume Assistant):* Intuition says "it's just a tool." Procedure might say "thousands of subjects." *Unwelcome Result:* We have to register it as thousands of subjects, creating huge overhead.
      *   *Case 2 (Long-horizon Agent):* Intuition says "one agent." Procedure might say "fragmented identity due to branching/merging."
      *   *Case 3 (Verifier/Distilled):* Intuition says "tool/infrastructure." Procedure might say "excluded" (verifier) but "included" (distilled agent).
