      *   *Correction on Q3:* The Hole Argument drags *all* fields (matter + metric). If "occupancy" means "presence of any field," then every point is occupied in a GR model. So the restriction "points exist only if occupied" is trivially satisfied everywhere. Thus, the Hole Argument *still gets off the ground*. The diffeomorphism moves the field values to *different* points (if points are individuals). So Occupancy Substantivalism fails to block the Hole Argument in GR. This is a strong point to make.

