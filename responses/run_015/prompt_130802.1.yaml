answer: |-
  Here is the committed reading you can take into your seminar.

  ### 1. Leibniz's Moral and the Tension
  Leibniz would endorse **Relationism**, not sophisticated substantivalism. Your suspicion that his argument is anti-haecceitist is correct, but your inference that this makes him a sophisticated substantivalist is anachronistic.

  Sophisticated substantivalism (as defended by Saunders, Pooley, et al.) grants ontological standing to the manifold points but denies that haecceitistic differences between them constitute physical differences. It saves the ontology of the container by quotienting the physics. Leibniz does not do this. For Leibniz, space is a *phenomenon bene fundatum* (a well-founded phenomenon). It is an ideal order of coexistences, not a substance nor a property of a substance.

  The tension you identify—between anti-haecceitism and the claim that space is not an entity—is **not genuine** in Leibniz's system. It arises only if we assume that to be a subject of haecceitistic predication, a thing must exist. For Leibniz, the points of space are *abstractions* from the relations of substances (monads). Because they are abstracta, they lack the primitive thisness required for haecceitism. You cannot have a haecceitistic distinction between two things that are not fundamentally real.

  Therefore, the Principle of Sufficient Reason (PSR) forces the choice of Relationism. The PSR dictates that there are no brute facts. If spacetime points were individuals (even sophisticated ones), their identity conditions would have to be grounded. If they are grounded qualitatively, they are relational. If they are not grounded qualitatively, their identity is brute. Leibniz rejects brute facts. Thus, points cannot be individuals. He is not "saving" the points by quotienting; he is eliminating them as fundamental ontological candidates.

  ### 2. PSR, Determinism, and Verificationism
  You asked if Leibniz would treat the failure of determinism as a *reductio* independent of verificationism. **Yes.**

  The standard pedagogical gesture suggests Leibniz rejects the two models because *we* cannot distinguish them (verificationism). This is weak. Leibniz's actual argument in the Leibniz-Clarke correspondence is theological and metaphysical, not epistemological.

  If the Hole Argument holds for a substantivalist, it implies that God, having created the universe up to the time slice, faces two qualitatively identical futures that differ only in which manifold points bear which field values. Since the points are haecceitistically distinct but qualitatively identical, God has **no sufficient reason** to actualize one mapping rather than the other. To choose one would be an act of arbitrary will, which Leibniz holds is impossible for a rational deity (and impossible in a rational metaphysics generally).

  The defect is not that *we* cannot know the difference; the defect is that *there is no fact of the matter* for anyone, even God, to know. The indeterminism is a symptom of the violation of the PSR. Leibniz would argue that a theory permitting such a choice describes an impossible world, not merely an unknowable one. He derives the anti-haecceitist conclusion directly from the impossibility of brute choice, without leaning on human observational limits.

  ### 3. Occupancy Substantivalism and GR
  Would Leibniz accept "Occupancy Substantivalism" (points exist as individuals but only if occupied)? **No.**

  This view attempts to retain the container ontology while avoiding the "empty container" objections. Leibniz would reject it because it inverts the order of explanation. For Leibniz, spatial relations are constituted by the coexisting substances; they do not pre-exist as potential slots waiting to be filled. To say a point "exists only if occupied" still treats the point as a subject that *receives* occupation. This preserves the haecceitistic worry: if two occupied points swap their occupants (via a diffeomorphism), and the points are individuals, we have a new state of affairs with no sufficient reason.

  Regarding General Relativity: Occupancy Substantivalism **collapses into plain substantivalism** in the context of GR, and this collapse is damaging.

  In GR, the "occupant" is the metric field (and matter fields). Since the metric field is non-zero almost everywhere (even in "vacuum" solutions, the curvature or the metric tensor itself is present), every point is "occupied" by the gravitational field. Consequently, the restriction "exists only if occupied" is trivially satisfied for the entire manifold. The Hole Argument then proceeds exactly as before: one can drag the metric field over the manifold points. If the points are individuals, the dragged model is distinct.

  If the proponent of Occupancy Substantivalism argues that the metric field *does not* count as an occupant (only matter does), the view is empirically false regarding GR, as gravitational waves propagate in vacuum. If they argue the metric *does* count as an occupant, the view is extensionally equivalent to standard substantivalism about the metric field on a manifold. It gains no leverage against the Hole Argument because the "hole" is never empty of the metric.

  ### The Commitment for the Seminar

  If I were standing at the board in your seminar, this is the position I would defend:

  **The Moral:** Leibniz is a **Metaphysical Relationist**. He is not a sophisticated substantivalist. The sophisticated substantivalist grants reality to the manifold and then restricts physical significance; Leibniz denies reality to the manifold altogether.

  **The Principle:** The **Principle of Sufficient Reason**. Specifically, the clause that there can be no brute facts of identity. The Hole Argument demonstrates that substantivalism requires brute facts about which point is which.

  **The Novelty:** Leibniz would **not** view the Hole Argument as genuinely new. He would recognize it immediately as his displacement argument made local and dynamical. The shift from a global shift of the universe to a local deformation within a "hole" changes the mathematical machinery but not the metaphysical violation. In both cases, the theory posits a difference without a reason.

  **The Single Premise:** My entire reading leans on the premise that **for Leibniz, space is ideal, not real.**
  *   *Why this premise?* If space is real (a substance or attribute), Leibniz *must* be a sophisticated substantivalist or accept indeterminism. If space is ideal (an order of relations), substantivalism is a category error from the start.
  *   *Textual Support:* This is grounded in his correspondence with Clarke (e.g., *Leibniz-Clarke Correspondence*, Third Paper, §5: "Space is something absolutely uniform; and, without the things placed in it, one point of space does not absolutely differ in any manner whatsoever from another point of space.") and his metaphysics of monads.
  *   *Underdetermination:* I concede that Leibniz's texts underdetermine the *modern* formalization of his view. He did not have manifolds or diffeomorphisms. However, they do not underdetermine his commitment to the ideality of space. To claim him for sophisticated substantivalism is to claim him for a view that posits the fundamental reality of that which he explicitly calls ideal.

  **Summary for your students:** Tell them that Leibniz does not solve the Hole Argument by quotienting the models (sophisticated substantivalism) or by limiting existence (occupancy). He solves it by denying the subject of the predication. There are no "points" to be haecceitistically distinct. The Hole Argument is a *reductio ad absurdum* of the assumption that spacetime points are subjects of inherence. The PSR forbids the brute identity of the manifold; therefore, the manifold is not fundamental. Relationism is not an empirical preference; it is a metaphysical necessity.
