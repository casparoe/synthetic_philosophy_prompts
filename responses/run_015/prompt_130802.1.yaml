  6.  **Self-Correction during drafting:** I initially thought about leaning into the "sophisticated substantivalist" reading because it's trendy (e.g., Saunders, Pooley). However, the prompt asks what *Leibniz* would say, not what a modern Leibnizian should say. Leibniz's texts are quite clear that space is ideal. To call him a substantivalist (even sophisticated) is to attribute an ontology of spacetime points he explicitly denies. I must defend the Relationist reading but clarify it's not verificationist. It's metaphysical.

