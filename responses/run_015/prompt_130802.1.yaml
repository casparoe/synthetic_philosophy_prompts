          *   *Decision:* Leibniz would reject the manifold ontology entirely. He wouldn't be a "sophisticated substantivalist" because that still grants ontological status to the manifold points (even if quotiented). He is a relationist, but *not* because of verificationism, but because of the PSR and the nature of substance. The "tension" is resolved by recognizing that for Leibniz, ideal entities (space) do not have the kind of existence that allows for haecceitistic distinctions.
