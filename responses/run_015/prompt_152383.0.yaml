answer: |-
  # Joint Statement on the Concept of Disease

  ### 1. Agreed Claims
  1.  **Purpose:** The concept of disease must distinguish conditions warranting medical attention from normal variations, guiding resource allocation and intervention.
  2.  **Paradigms:** Metastatic cancer and septicemia are diseases; statistical outliers like extreme height are not.
  3.  **Function:** "Function" is fixed primarily by selected-effect history (what the trait was designed to do), supplemented by causal-role capacity (what it currently does). These come apart only in evolutionary mismatch or vestigiality.
  4.  **Reference Class:** Specified by age, sex, and the environment in which the species' functional design was stabilized. We agree environment matters, but disagree on how it enters the definition.

  ### 2. Disagreements Table

  | Issue | Side N (Naturalist) Formulation | Side V (Normativist) Formulation | Real or Verbal? |
  | :--- | :--- | :--- | :--- |
  | **Role of Harm** | Disease denotes a factual state of dysfunction; harm is a contingent consequence, not a defining condition. | Disease denotes a harmful state; dysfunction without harm is not disease, and harm without dysfunction can be. | **Real.** Changes the extension of the concept (e.g., vestigial traits). |
  | **Environmental Mismatch** | If internal function matches design spec, it is health, even if the current environment makes it harmful. | If the organism-environment interaction harms the bearer, it is disease, regardless of internal functional spec. | **Real.** Determines coverage for allergies and mismatches. |
  | **Social Harm** | Social stigma alone does not constitute disease unless caused by internal dysfunction. | Harm caused by social reaction counts toward disease status if the condition is the trigger. | **Real.** Determines medical authority over social problems. |

  ### 3. Cruxes Table

  | Crux | Bearing Case | Side N Prediction | Side V Prediction | Mind-Changing Condition |
  | :--- | :--- | :--- | :--- | :--- |
  | **Is harm internal to "disease"?** | **Anachronistic Allergy:** Immune system to spec, harmful reaction to synthetic protein. | **Health.** Function is normal; harm is environmental. | **Disease.** Outcome is harmful to bearer. | **N:** Show immune regulation dysfunction. **V:** Show harm is purely social, not biological. |
  | **Does vestigial loss count?** | **Arrector Variant:** Loss of vestigial reflex, no measurable harm in current env. | **Disease.** Loss of species-typical function. | **Health.** No harm to bearer. | **N:** Show function never existed. **V:** Show hidden physiological cost exists. |
  | **Statistical vs. Functional** | **Three-Hour Sleepers:** Heritable, statistically abnormal, high function, beneficial. | **Health.** Functional ability is above mean, not subnormal. | **Health.** Beneficial, not bad for bearer. | **FLAG: FAKE CRUX.** Both agree it is health. Reveals N cares about *subnormal* function, not just statistical deviation. |
  | **Source of Harm** | **Social Reaction Case:** Condition classified as disorder largely due to others' reactions. | **Not Disease** (if no internal dysfunction). Treat harm socially. | **Disease** (if harmful). Medicalize to alleviate harm. | **N:** Show internal cognitive dysfunction. **V:** Show harm is imaginary/prejudice-only. |

  ### 4. Case & Policy Analysis

  **Treatment-Tracking Test**
  For each case, we separate "Is it a disease?" from "Should the health system pay for treatment?"

  *   **Three-Hour Sleepers:** **Disease?** No (Both). **Pay?** No (Both). *Consensus.*
  *   **Anachronistic Allergy:** **Disease?** N: No / V: Yes. **Pay?** Yes (Both). *Side N decouples comfortably.* Cost: N must explain why we treat "health" conditions medically. V argues this proves harm is definitional.
  *   **Arrector Variant:** **Disease?** N: Yes / V: No. **Pay?** No (Both). *Side N decouples comfortably.* Cost: N must explain why "disease" doesn't warrant intervention. V argues this proves dysfunction without harm is irrelevant.
  *   **Social Reaction Case:** **Disease?** N: No / V: Yes. **Pay?** Yes (Both). *Side N decouples comfortably.* Cost: N risks limiting medical aid for socially induced suffering. V risks medicalizing social prejudice.

  **Verbal vs. Real Dispute**
  A significant portion of the dispute is **verbal** regarding the label "disease." In the Allergy and Social cases, both sides agree on the policy outcome (treat/pay), differing only on whether to apply the stigma-bearing label "disease" to the condition. Side N prefers reserving "disease" for internal breakdowns to preserve scientific objectivity, treating the rest as "conditions warranting care." Side V prefers expanding "disease" to capture all harms warranting care, preserving the concept's action-guiding force.

  **Residual Real Fight**
  The residual **real** fight is not about words, but about **medical mandate**. Side N argues medicine's jurisdiction is fixing biological functions; social or environmental harms should be solved by policy or engineering. Side V argues medicine's jurisdiction is alleviating suffering borne by the organism, regardless of source. Settling the verbal dispute (e.g., adopting "medical condition" for V's cases) would not resolve the budgetary and institutional conflict over who fixes what.

  **Conclusion on Cases**
  The **Three-Hour Sleepers** case reveals unexpected agreement: statistical abnormality alone satisfies neither side without functional loss or harm. The **Anachronistic Allergy** and **Social Reaction** cases are the primary battlegrounds, testing whether "disease" tracks biological design or bearer welfare. The **Arrector Variant** tests whether "disease" tracks design even when welfare is unaffected. Side N accepts "disease without treatment" (Arrector) and "treatment without disease" (Allergy); Side V rejects both decouplings.
