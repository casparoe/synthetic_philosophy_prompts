answer: |-
  ### Part 1: The Logical Space

  Before we build the tool, we must map the territory. You identified five distinctions that drive these arguments. If we treat each as a simple switch, we create a grid of possible positions. Most people hold a mix of these, but looking at them separately shows where the contradictions lie.

  **The Five Switches**
  1.  **Target:** Does hypocrisy make the blame *false* (the act wasn't wrong), or just *improper* (the act was wrong, but you shouldn't say it)?
  2.  **Source:** Does standing come from a *role* (office/victim) or from *moral character* (living the rules)?
  3.  **Match:** Must the blamer's past wrong match the *specific rule* they are enforcing, or does *any* serious wrong disqualify them?
  4.  **Cause:** Does it matter if the blamer stayed clean because they are good, or only because they were *never tempted* (luck)?
  5.  **Repair:** Can standing be fixed by *confession*, or does it require *experience* of the wrong, or is it *broken forever*?

  **The Combinations**
  Mathematically, these switches create 48 possible positions (2 × 2 × 2 × 2 × 3). However, not all positions are livable.

  **Empty or Unoccupied Regions**
  *   **The Incoherent Zone (Target = False + Source = Role):** This position claims that because a referee smokes, the rule against smoking is factually false. Nobody lives here. A rule's truth does not depend on the enforcer's habits.
  *   **The Unattractive Zone (Source = Character + Match = Any + Repair = Broken):** This position claims that if you ever broke any serious rule (e.g., stole once), you can never speak on any other rule (e.g., recycling). This is logically possible but socially unusable; it silences everyone.
  *   **The Hypocritical Zone (Repair = Experience + Match = Same + Repair = No Confession):** This claims you gain standing from doing the wrong thing, even if you hide it. Nobody argues this openly; experience only grants standing if you admit the struggle.

  **Where the Tree Will Fail**
  *   **Sincerity vs. Truth:** The tree cannot fully separate the view that hypocritical blame is *lie* from the view that it is merely *rude*. Both end up at "Blame Fails."
  *   **Office vs. Character:** If a referee has a bad record, is it the Office that speaks or the Person? The tree forces a choice, but in practice, people blur this.

  ***

  ### Part 2: The Decision Tree

  **Instructions:** Start at the top. Answer the question based on your group's intuition about the case described. Follow the arrow until you reach a box. That box is your decision. Nodes marked **[SPLIT]** are where reasonable people often disagree; expect debate here.

  1.  **Think of the parent who smoked for twenty years, quit, and now tells their teen not to vape. Does the parent's past make the advice factually wrong, or just rude?**
      *   **Factually Wrong:** The teen is not actually doing wrong.
          *   **LEAF: "Nothing Wrong"**
          *   *Awkward Commitment:* You must admit the rule itself is false whenever the enforcer has broken it.
      *   **Just Rude:** The teen is doing wrong, but the parent might not be the one to say it.
          *   **GO TO 2**

  2.  **Think of the Co-op sending letters about fees while owing the cleaner a living wage. Is the Co-op a moral person like us, or a structure that can speak despite its debts?**
      *   **A Moral Person:** It must have clean hands like a member.
          *   **GO TO 6**
      *   **A Structure:** Its right to speak comes from its function, not its history.
          *   **LEAF: "The Structure Speaks"**
          *   *Awkward Commitment:* You must accept rules from an organization that systematically violates similar rules itself.

  3.  **Think of the referee enforcing a rule they have personally broken. Does holding the office protect them from charges of hypocrisy?**
      *   **Yes:** The office grants the right, regardless of personal record.
          *   **LEAF: "The Office Speaks"**
          *   *Awkward Commitment:* You must accept blame from leaders who openly violate the rules they enforce.
      *   **No:** Breaking the rule cancels the authority of the office.
          *   **GO TO 6**
      *   **[SPLIT NODE]**: *Reasonable people disagree on whether roles immunize against hypocrisy.*

  4.  **Think of the member who has done something worse but of a different kind. Must the blamer's past violation match the specific rule they are invoking?**
      *   **No:** Any serious violation removes standing.
          *   **LEAF: "Clean Life Required"**
          *   *Awkward Commitment:* A member who once stole cannot speak on bin rules, even if they never touched a bin.
      *   **Yes:** Only breaking the same rule removes standing.
          *   **GO TO 5**

  5.  **Think of the person who was never tempted to break the rule only because they were never in the position. Does luck count as a clean record?**
      *   **No:** Luck is not virtue; they have no standing.
          *   **LEAF: "Character Counts"**
          *   *Awkward Commitment:* You must silence people who behaved well simply because they lacked the opportunity to behave badly.
      *   **Yes:** The record is what matters, not the temptation.
          *   **GO TO 6**
      *   **[SPLIT NODE]**: *Reasonable people disagree on whether opportunity matters for moral standing.*

  6.  **Think of the member who did the same thing but was coerced and fully excused. Does an excused violation count against their record?**
      *   **Yes:** The act happened, so standing is lost.
          *   **GO TO 7**
      *   **No:** An excused act is not a violation.
          *   **LEAF: "Excused Past Ignored"**
          *   *Awkward Commitment:* You must allow blame from people who broke the rule, provided they can argue they were forced.

  7.  **Think of the treasurer who quietly fudged one expense claim five years ago and never mentioned it. Does owning the violation restore their standing?**
      *   **Yes:** Confession repairs the right to speak.
          *   **LEAF: "Own It and Speak"**
          *   *Awkward Commitment:* You must accept blame from reformed violators while silencing those who keep similar secrets.
      *   **No:** The violation permanently taints the voice.
          *   **GO TO 8**

  8.  **Think of the victim of the very kind of wrong in question who has also done it themselves. Does having survived the temptation give them more standing than a pure bystander?**
      *   **Yes:** Experience grants authority.
          *   **LEAF: "Experience Teaches"**
          *   *Awkward Commitment:* You must accept that doing wrong can make you more qualified to judge it than someone who did not.
      *   **No:** Only those committed to the norm may speak.
          *   **LEAF: "Dirty Hands Silent"**
          *   *Awkward Commitment:* You must silence those who know the cost of the rule in favor of those who may not understand the temptation.
      *   **[SPLIT NODE]**: *Reasonable people disagree on whether experience outweighs purity.*

  ***

  ### Part 3: Notes on Usage

  **Where the Tree Merges Positions**
  *   **"The Office Speaks" vs. "The Structure Speaks":** These land on similar outcomes (standing is maintained despite hypocrisy) but for different reasons (role vs. entity). The tree treats them similarly because the practical result in a meeting is the same: the objection is overruled.
  *   **"Dirty Hands Silent" vs. "Nothing Wrong":** Both result in the blame being struck from the record. The tree distinguishes them because one admits the act was wrong (but the blamer is silenced) and the other denies the act was wrong. In a meeting, however, the outcome looks identical.

  **How to Adjudicate the Split Nodes**
  You marked three nodes as **[SPLIT]**. These are the places your intuition will not save you, because the room will genuinely divide.
  1.  **Node 3 (Referee):** Do you value the stability of roles more than the integrity of the person? If your co-op relies on volunteers, you may need to protect the role. If you rely on trust, you may need to protect the integrity.
  2.  **Node 5 (Luck):** Do you judge people on outcomes or character? If you judge character, luck shouldn't matter. If you judge outcomes, the "never tempted" person is safe.
  3.  **Node 8 (Experience):** Is accountability about enforcing rules or reducing harm? If reducing harm, the experienced person may know better how to stop the behavior. If enforcing rules, purity is safer.

  **Empty Regions**
  If you find yourself arguing for a position that lands in the "Empty Regions" described in Part 1 (e.g., "The rule is false because the referee broke it"), stop. That argument is logically incoherent and will not resolve the meeting. Move to whether the *act of blaming* is improper instead.
