      *   **Psi-Epistemic:** The quantum state represents an agent's knowledge, information, or beliefs about an underlying reality. Distinct $\psi$ can correspond to the same underlying physical state (overlapping distributions). Examples: QBism, Copenhagen (some readings), Spekkens' Toy Model, Retrocausal models.
      *   **Key Theorems:**
