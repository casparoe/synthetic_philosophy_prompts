answer: |-
  # JOINT STATEMENT ON THE ONTOLOGICAL STATUS OF THE QUANTUM STATE
  **The Adversarial Collaboration on Quantum Foundations (ACQF)**
  **Date:** October 2024
  **Signatories:** The Psi-Ontic Working Group & The Psi-Epistemic Working Group

  ## PREAMBLE
  Over the past twelve months, representatives from the psi-ontic and psi-epistemic camps have engaged in structured adversarial collaboration. Our goal was not to reach a consensus on the interpretation of quantum mechanics, but to render our disagreement maximally precise. We agree that the debate has often been obscured by imprecise terminology and conflated assumptions. This document enumerates our common ground, formalizes our disagreements, identifies the specific "cruxes" that determine our divergent paths, and isolates the verbal components of our dispute.

  ---

  ## 1. AGREED CLAIMS
  *Both parties affirm the following statements as true, accurate, or necessary conditions for any satisfactory account.*

  1.  **Formalism:** The standard Hilbert space formalism of quantum mechanics (including unitary evolution and the Born rule) is empirically adequate for all experiments conducted to date. Neither side proposes modifying the formalism for the regime currently tested.
  2.  **No-Signaling:** Superluminal signaling is impossible. Any ontological model must recover the no-signaling constraints of the quantum formalism.
  3.  **PBR Theorem Structure:** The Pusey-Barrett-Rudolph (PBR) theorem demonstrates that *if* one assumes **Preparation Independence** (systems prepared independently have independent physical states), *then* distinct quantum states must correspond to disjoint distributions over ontic states.
  4.  **Limitations of No-Go Theorems:** No-go theorems (Bell, Kochen-Specker, PBR, Frauchiger-Renner) rule out *classes of models* satisfying specific assumptions, not interpretations *simpliciter*. Any claim that a theorem "disproves" an interpretation must specify which assumption of the theorem that interpretation rejects.
  5.  **Measurement Problem:** A satisfactory account must explain why definite outcomes occur in individual experiments (the "problem of outcomes") without circular reliance on the concept of "measurement" as a primitive.
  6.  **Reconstructability:** It is desirable (though not strictly required by both sides) that the quantum formalism be reconstructible from physically or informationally motivated axioms.
  7.  **Frauchiger-Renner Implications:** The Frauchiger-Renner no-go theorem establishes that one cannot simultaneously maintain: (Q) Quantum mechanics is universal, (C) Consistency between agents, and (S) Single-world outcomes. At least one must be relaxed.

  ---

  ## 2. DISAGREEMENTS TABLE
  *Each side's position is stated in terms its own proponents accept as charitable and accurate.*

  | Feature | **Psi-Ontic Camp** | **Psi-Epistemic Camp** |
  | :--- | :--- | :--- |
  | **Core Thesis** | The quantum state $\psi$ (or a structure isomorphic to it) is a constituent of physical reality. Distinct $\psi$ imply distinct physical states of the world. | The quantum state $\psi$ represents an agent's information, knowledge, or beliefs about an underlying physical reality. Distinct $\psi$ may correspond to the same underlying physical state. |
  | **Wavefunction Collapse** | Either a physical process (Objective Collapse), an apparent process due to branching (Many-Worlds), or a updating of knowledge about a hidden variable (Bohm). | A Bayesian update of the agent's information upon acquiring new data. No physical change occurs in the system distant from the agent. |
  | **Underlying Reality** | There exists a "view from nowhere"—a state of the world independent of any observer. | Reality may be relational, contextual, or observer-dependent. A "view from nowhere" is either meaningless or inaccessible. |
  | **PBR Assumption** | **Preparation Independence** is a minimal requirement for scientific realism. Rejecting it implies implausible retrocausality or superdeterminism. | **Preparation Independence** is not guaranteed for epistemic states. Correlations in the underlying ontic space can exist without signaling (analogous to classical correlations in equilibrium). |
  | **Explanation Goal** | Explain *why* the world behaves this way by positing what the world *is*. | Explain *why* agents are constrained to use this formalism to manage expectations about experience. |

  ---

  ## 3. CRUXES
  *These are the specific sub-questions where resolution would compel one side to abandon or significantly modify their position. We agree on what evidence would bear on these questions.*

  ### Crux 1: The Validity of Preparation Independence
  *The PBR theorem hinges on the assumption that independently prepared systems have independent ontic states ($\lambda_1, \lambda_2$).*

  *   **Ontic Prediction:** Preparation Independence is a fundamental requirement of separability. Violating it requires accepting holistic non-separability that extends beyond entanglement (e.g., retrocausality).
  *   **Epistemic Prediction:** Preparation Independence fails for epistemic states. Underlying ontic states can be correlated even when preparation procedures are uncorrelated, without violating no-signaling.
  *   **Agreed Evidence:** A rigorous derivation showing that violating Preparation Independence necessarily leads to superluminal signaling **OR** a concrete model demonstrating Preparation Independence violation that remains fully local and non-signaling.
  *   **Shift Condition:**
      *   *Ontics shift if:* A local, non-signaling model is constructed that violates Preparation Independence naturally (without fine-tuning).
      *   *Epistemists shift if:* It is proven that violating Preparation Independence requires fine-tuning indistinguishable from conspiracy (superdeterminism).

  ### Crux 2: The Nature of "Information"
  *Is the information represented by $\psi$ "information about something"?*

  *   **Ontic Prediction:** Information must be information *about* an underlying ontic state. If $\psi$ is purely epistemic, there must be a "hidden variable" $\lambda$ that $\psi$ describes.
  *   **Epistemic Prediction:** "Information" can be primitive. It need not be "about" a pre-existing classical-like reality (e.g., QBism). The "thing" known is future experience, not past ontology.
  *   **Agreed Evidence:** A reconstruction of quantum theory from informational axioms that explicitly forbids an ontic layer without rendering the theory solipsistic.
  *   **Shift Condition:**
      *   *Ontics shift if:* An informational reconstruction is achieved that renders the postulate of an underlying $\lambda$ redundant or logically impossible.
      *   *Epistemists shift if:* It is shown that any consistent informational account implicitly presupposes an ontic structure isomorphic to $\psi$.

  ### Crux 3: Wigner's Friend & Single-World Facts
  *Can different observers assign different states to the same system without one being wrong?*

  *   **Ontic Prediction:** There is a single fact of the matter regarding the state of the system (or the branch). If Wigner and Friend disagree, one is ignorant of the full physical state.
  *   **Epistemic Prediction:** Different agents can legitimately assign different states based on their available information. There is no "God's eye" fact of the matter regarding the state assignment.
  *   **Agreed Evidence:** Experimental realization of extended Wigner's Friend scenarios (e.g., Proietti et al. extensions) testing observer-independent facts.
  *   **Shift Condition:**
      *   *Ontics shift if:* Experiments violate inequalities derived from the assumption of "Observer-Independent Facts."
      *   *Epistemists shift if:* It is shown that abandoning observer-independent facts leads to logical contradictions in agent communication (beyond FR).

  ---

  ## 4. VERBAL DISPUTE ANALYSIS
  *We identify areas where the disagreement may be linguistic rather than substantive.*

  1.  **The Definition of "Real":**
      *   *Diagnosis:* The Ontic camp uses "real" to mean "mind-independent existence." The Epistemic camp often uses "real" to mean "that which constrains experience."
      *   *Resolution:* We agree to distinguish **Ontic Reality** (existence independent of agents) from **Operational Reality** (constraints on betting odds/experience). The dispute is whether $\psi$ maps to Ontic or merely Operational Reality.
  2.  **The Definition of "Epistemic":**
      *   *Diagnosis:* Sometimes "epistemic" implies "subjective/arbitrary" (which Ontics reject). Sometimes it implies "relational/contextual" (which Ontics might accept if the relation is physical).
      *   *Resolution:* We agree to define **Psi-Epistemic** strictly as: *Distinct quantum states correspond to overlapping probability distributions over the same ontic state space.* This removes subjectivity from the definition and makes it a mathematical claim about model structure.
  3.  **The "Shut Up and Calculate" Boundary:**
      *   *Diagnosis:* Both sides accuse the other of metaphysical excess. Ontics accuse Epistemists of hiding the mechanism; Epistemists accuse Ontics of reifying mathematics.
      *   *Resolution:* We acknowledge this is an aesthetic/methodological disagreement, not a factual one. We classify this as **Out of Scope** for this document.

  ---

  ## 5. VULNERABILITIES (FALSIFIERS)
  *Each side admits conditions under which their view would be untenable.*

  ### Psi-Ontic Vulnerabilities
  1.  **Successful Purely-Informational Reconstruction:** If QM is successfully derived from axioms solely concerning reasoning, betting, and information processing (e.g., QBism or Relational QM success), without needing to posit a "stuff" that waves, the motivation for Onticism diminishes significantly.
  2.  **Violation of Born Rule:** If experiments show systematic deviations from the Born Rule in high-complexity systems, Objective Collapse (a major Ontic branch) is supported, but Unitary Ontic views (Many-Worlds) are threatened. However, if deviations suggest *contextual* probability updates inconsistent with any physical state evolution, Onticism is threatened.
  3.  **Proof of Preparation Independence Violation:** If it is proven that Preparation Independence *cannot* hold in a relativistic spacetime without retrocausality, and retrocausality is deemed unacceptable, Ontic models relying on PBR lose their strongest support.

  ### Psi-Epistemic Vulnerabilities
  1.  **Experimental Violation of PBR Assumptions:** If an experiment can be devised that enforces Preparation Independence physically (e.g., spacelike separation of preparation devices with random number generators) and still yields statistics incompatible with overlapping distributions, simple Psi-Epistemic models are ruled out.
  2.  **Inability to Solve the Measurement Problem:** If Epistemic views cannot explain *why* a specific outcome occurs (beyond "I saw it") without secretly smuggling in an ontology (e.g., a hidden variable), they collapse into instrumentalism.
  3.  **Hardy's Theorem Extensions:** If further generalizations of Hardy's theorem show that *any* epistemic model requires the ontic state space to be infinite-dimensional (matching the Hilbert space), the epistemic advantage (parsimony) is lost.

  ---

  ## 6. CONCLUSION
  We conclude that the dispute is not merely verbal, but hinges on specific mathematical assumptions (primarily Preparation Independence) and metaphysical priors (the necessity of a view-from-nowhere). The Psi-Ontic camp prioritizes **separability and mind-independence**; the Psi-Epistemic camp prioritizes **parsimony and the primacy of experience**.

  Future progress requires not more interpretation, but:
  1.  Rigorous testing of Preparation Independence in relativistic settings.
  2.  Formal proofs regarding the necessity of ontic state space dimensionality.
  3.  Clarification of whether "information" can exist without a substrate.

  **Signed,**

  *The Psi-Ontic Working Group*
  *The Psi-Epistemic Working Group*
