  Same sealed packet, torn and sown,
  On ground kept uniform and deep.
  Watered alike, lit the same,
  No shadow hides, nutrients steady.
  When stalks diverge in height and leaf,
  The cause is inward, largely genetic.
  The earth holds still, the genes decide,
  Nowhere for environmental noise to register.
  Drain the field, and all could fall,
  Yet here $H^2$ reads point-eight-five.

  Same sealed packet, torn and sown,
  On ground left jagged and rough.
  Watered alike, lit the same,
  But shadow hides, nutrients unsteady.
  When stalks diverge in height and leaf,
  The cause is outward, largely accidental.
  The earth speaks loud, genes step aside,
  Everywhere for environmental noise to register.
  Drain the field, and all could fall,
  Yet here $H^2$ reads point-one-five.

  Yet walk the fence between the two,
  See the average height shift from view.
  That gap is soil, not seed,
  Though neither number owns that deed.

  ***

  **Note on Liberties and Conceit**

  **Technical Accuracy:** The numbers (0.85 and 0.15) are plausible for a crop like maize under highly controlled versus highly heterogeneous field conditions. However, a quantitative geneticist might wince at the assumption that genetic variance ($V_G$) remains constant across both plots. In reality, gene-by-environment interaction ($V_{G \times E}$) often means the genetic variance itself changes when the environment becomes stressful or patchy. Additionally, using $H^2$ (broad-sense) is technically correct for "total genetic variance" as requested, but in sexual populations (seeds), narrow-sense heritability ($h^2$) is usually the predictor of response to selection. I stuck to your $H^2$ constraint, but be aware students may conflate the two.

  **The Conceit:** This is essentially Richard Lewontin's famous cornfield analogy, and it is Pedagogically Standard for a reason: it cleanly separates within-group variance from between-group differences. However, your worry is well-founded. The mirror structure risks reifying the idea that the seeds carry a fixed "share" of the outcome that is merely revealed or obscured. It can inadvertently suggest that genes and environment are separable ingredients rather than interacting processes. The poem tries to mitigate this with the line "Drain the field, and all could fall" (highlighting the norm of reaction), but the mirror form itself implies a static genotype waiting to be measured. Use the poem to break the spell, not cast it: emphasize that the *number* changes because the *context* changes, not because the seeds revealed their "true" selves in the first plot. The conceit is useful, but only if you explicitly dismantle the intuition it builds.
