answer: |-
  1. Students receive four sealed envelopes containing diplomatic dispatches from the July Crisis, updating their probability of the *next* step on index cards after each opening before cards are collected and shuffled to prevent memory bias. Pairs then receive the full set of fifteen event-cards to arrange into two distinct timelines, avoiding the peer-estimate and opposite-outcome mechanics which measure social perception or incentivize sophistry. This structure forces them to maximize structural inevitability in one chain and individual contingency in the other using the same evidence.

  2. Minutes 0–15 establish the known final outcome (War) but withhold the sequence, then four rounds of reading dispatches and estimating the probability of the *next* diplomatic step before it is revealed. At minute 45, groups spend twenty minutes arranging the physical event-cards to argue for inevitability versus contingency before the actual historical timeline is projected. The session concludes with thirty minutes of discussion, ensuring the labels for these cognitive effects are withheld until the very end.

  3. You will map the probability estimates to ex-ante foreseeability, the inevitability timeline to ex-post narrative pull, and the contingency timeline to ex-post explicability without necessity. Introduce the terms hindsight bias and narrative fallacy only now, pointing to the discrepancy between their initial probability estimates and the certainty of their constructed chains. This separation allows students to see that an event can be fully explained without having been predictable or inevitable.

  4. Students may cheat by using prior knowledge of the crisis, so you must use obscure telegram excerpts rather than textbook summaries to ensure genuine uncertainty. If groups treat the narrative exercise as a game of cleverness, require them to tape specific evidence cards to each link in their chain to enforce evidentiary discipline. Should the prediction rounds run long, cut the third dispatch rather than rushing the debrief, as the conceptual separation is the primary learning goal.

  5. This activity cannot reproduce the affective burden of real decision-making, as students know they face no actual consequences for their judgments. You must supply this missing dimension in the final five minutes by describing the physical exhaustion and political pressure faced by the actual historical agents. Without this lecture component, the exercise risks reducing historical agency to a purely intellectual puzzle.
