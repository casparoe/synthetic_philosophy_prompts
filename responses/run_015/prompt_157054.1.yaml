      *   *The Argument:* If O(A) and O(B) and ~Can(A&B) -> ~O(A) or ~O(B). Therefore, no conflict. Therefore, residue (based on the 'lost' ought) is irrational.
      *   *Ambiguity 1: 'Ought'.* Is it *prima facie* (pro tanto) or *all-things-considered* (ATC)? If it's pro tanto, OIC doesn't rule out conflicts (I ought to save X, I ought to save Y, I can't do both, but both obligations exist until weighed). If it's ATC, OIC might rule out conflicts (I cannot be obligated ATC to do the impossible).
      *   *Ambiguity 2: 'Can'.* Physical possibility? Psychological capacity? Epistemic access? Logical possibility? "Can" at the time of action or time of deliberation?
      *   *Ambiguity 3: 'Implies'.* Conceptual truth (meaning of 'ought')? Normative principle (fairness)? Empirical claim (motivation requires ability)?
      *   *Ambiguity 4: Moral Residue.* Residue isn't about the *current* obligation; it's about the *violated* obligation. OIC might say I wasn't obligated to do the impossible ATC, but does it say I wasn't obligated *pro tanto*? If the violated duty was real (even if overridden), residue might be rational. To kill residue, one must deny the *reality* of the overridden duty, not just the ATC duty.

