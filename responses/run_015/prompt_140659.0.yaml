answer: |-
  Based on the eight precedents in your minutes, your group is operating with a stricter interpretation of Lewis than the theory itself provides. You are filtering out anything that isn't a *pure* coordination equilibrium. Here are the three rules that reconcile all eight past verdicts, followed by the rulings for your new cases and a summit question to stress-test them.

  ### The Three Rules of Plover Norms

  **1. The Enforcement Clause (Rule vs. Not-Rule)**
  If compliance is secured by automation (CI/linters) or formal human sanction (Code of Conduct, maintainer rejection), it is an **Enforced Rule**. The arbitrariness of the standard does not matter; the mechanism of enforcement does.
  *   *Explains:* Case 3 (Commit messages). Even though it's arbitrary and universal, the linter makes it a Rule.
  *   *Principle:* **Mechanism trumps motivation.** If a bot punishes you, you aren't conforming conditionally on others; you're conforming conditionally on the build passing.

  **2. The Independence Clause (Habit vs. Not-Habit)**
  If an individual would derive private utility from the practice even if no one else did it, OR if the practice solves no inter-group coordination problem, it is a **Habit**. Universal compliance does not make a habit a convention.
  *   *Explains:* Case 5 (Local tests) — Private utility (catching my own bugs). Case 7 (Changelog) — No behavior (cannot coordinate on nothing). Case 8 (Click/Invoke) — No interaction (no coordination problem between teams).
  *   *Principle:* **Utility must be interdependent.** If I do it for me, or if my doing it doesn't affect you, it's not a convention.

  **3. The Equilibrium Clause (Convention vs. Not-Convention)**
  To be a **Convention**, the practice must be an arbitrary solution to a coordination problem sustained *only* by mutual expectation. It cannot rely on social sanctions (nudges, shame) or costly reciprocity. If there is social pressure, it is not a convention.
  *   *Explains:* Cases 1 & 2 (PR target, Call time) — Pure coordination, no cost, no sanction. Case 6 ('Fixes #123') — Arbitrary origin, sustained by copying.
  *   *Explains Negatives:* Case 4 (Reviews) — Ruled "Not a convention" because it involves costly effort (cooperation, not just coordination) and social sanctions (public nudges).
  *   *Principle:* **Conventions are costless equilibria.** If deviation costs you social capital or effort, it's not a Lewisian convention; it's a norm or rule.

  ---

  ### Rulings for the New Cases

  #### Case 1: Forum vs. Chat Migration
  *   **Verdict:** **Convention**
  *   **Prediction:** You must categorize this as a convention. You are promising not to punish someone who accidentally posts in Chat, but you will describe the Forum as the standard place.
  *   **Closest Analog:** **Case 1 (PRs against main).** Both are arbitrary channel selections where the only value is being where everyone else is. Like the PR target, the Forum won by spontaneous convergence, not decree.
  *   **Principle Committed To:** **Spontaneous Equilibrium.** A convention does not require historical legacy (like the 'Fixes #123' myth); it only requires current mutual expectation. The fact that it happened in three weeks is irrelevant; the stability of the expectation is what matters.

  #### Case 2: 'Shipped:' Notes in #done
  *   **Verdict:** **Habit**
  *   **Prediction:** You must categorize this as a habit. You are acknowledging that while everyone does it, the project does not rely on it, and you will not defend it as a coordination norm. If it dies, it dies.
  *   **Closest Analog:** **Case 5 (Running tests locally).** In Case 5, everyone did it, but it was for private utility. In Case 2, everyone does it, but there is *no* utility (nobody reads it). Both fail the Interdependence Test (Rule 2). It is also analogous to **Case 4 (Reviews)** regarding social pressure: the "odd one out" feeling is a social sanction, which disqualifies it under Rule 3.
  *   **Principle Committed To:** **Functional Coordination.** A regularity without a coordination problem (nobody depends on the notes) cannot be a convention, regardless of how strong the social pressure is. It is a ritual, not a norm.

  ---

  ### The Summit Test Case

  Your precedents have a tension between **Case 1/2** (Pure Coordination, no pressure) and **Case 4** (Cooperation, social pressure). You need to know if *social pressure alone* kills Convention status, or if it's the *costly effort*.

  **Put this question to the group:**

  > "Imagine we introduce a norm where everyone adds a specific emoji reaction to every PR they read, just to signal 'seen'. It solves a coordination problem (knowing what's read), it's arbitrary (could be any emoji), but if you don't do it, people will privately think you're ignoring them (social cost, no formal sanction). Is that a **Convention** we promise not to enforce, or a **Rule** we expect compliance on?"

  **Why this distinguishes the rules:**
  *   If they say **Convention**: They are prioritizing the *Coordination Problem* over the *Social Sanction*. This undermines the ruling on Case 4 (Reviews), suggesting Case 4 was misclassified and should have been a Convention.
  *   If they say **Rule** (or Not Convention): They are prioritizing the *Sanction/Cost*. This confirms Rule 3 above and solidifies the 'Shipped:' notes as a Habit/Rule, but it forces you to admit that "Convention" in Plover means "Costless Coordination Only."

  **Recommendation:** Based on your minutes, the group is likely to say **Not a Convention**. This confirms that Plover's definition of "Convention" is narrower than Lewis's: it excludes anything with a social cost. Be prepared to write that into the guide's definition section to prevent future ambiguity.
