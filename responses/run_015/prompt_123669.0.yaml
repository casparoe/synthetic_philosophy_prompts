answer: |-
  # Job Talk Q&A Prep Sheet: Republican Liberty & The Stability Problem

  **Strategy Note:** Your goal isn't to win a debate; it's to show you can handle pressure without becoming defensive, and that you know exactly where your argument's boundaries are. 90 seconds is roughly 130–150 words spoken at a calm pace. Do not try to cram a second argument in. State the concession, state the pivot, stop talking.

  ### 1. The Senior Republican (Pettit-Style)
  **The Objection:** "You've dissolved the concept to save the theory. If non-domination collapses into negative or positive liberty, you lose the specific normative bite of republicanism—the anti-subordination status. If the algorithm respects procedural constraints but ignores your interests, you say it's negative liberty. But surely a citizen subject to an unresponsive algorithm is still dominated, regardless of the modal base. Aren't you throwing out the distinctively republican concern with status?"

  **The Reply:** "That's the core tension I'm trying to map. I agree that if we focus only on procedure, we lose the status concern. That's exactly why I pivot to 'standing' at the end. My claim is that 'liberty' isn't doing the work there; 'status' is. So I'm not throwing out the republican concern, I'm relocating it. The algorithm example shows that procedural contestation without responsive standing feels empty. I want to keep that intuition but stop calling it a theory of freedom."

  **Soft Spot/Concession:** Concede that you are losing the *conceptual* distinctiveness of non-domination to save the *normative* distinctiveness of status. Do not fight the claim that this weakens the "third concept" label.

  ### 2. The Formal Theorist
  **The Objection:** "Your 'modal' move is just a re-description of uncertainty. In my models, freedom is expected utility over an option set. Your 'many small masters' aggregation looks like summing probabilities of interference. In your borough example, the algorithm is just a fixed probability function with a low variance. If the math is identical, what ontological work is 'domination' doing that 'risk' isn't?"

  **The Reply:** "The math might look similar, but the ontology changes the policy prescription. Risk management suggests lowering the probability of interference. Domination suggests changing the *relationship* that allows the interference. In the borough case, lowering the error rate of the algorithm fixes the risk, but it doesn't fix the fact that the subject has no say in the parameters. I'm arguing the relational structure matters independently of the outcome probability."

  **Soft Spot/Concession:** Concede that the *measurement* might look identical. Fight on the *interpretation* of the variables. Don't claim your math is better; claim your semantics drive different institutional designs.

  ### 3. The Structural Injustice/Feminist Scholar
  **The Objection:** "You're still counting masters. Even with your 'many small masters' aggregation, you're modeling power as dyadic relations between agents and subjects. But structural injustice isn't about officials or algorithms; it's about background norms that constrain options without anyone 'holding power.' Your framework makes diffuse, structural domination invisible because it's looking for a power-holder to aggregate."

  **The Reply:** "That's a serious limitation, and I acknowledge it. My aggregation argument is a bridge, not a destination. It shows that even within an agent-centric model, the current tools fail to capture diffuse power. But I agree that 'standing' needs to extend beyond dyads to include structural positions. The borough example is a limit case: the algorithm encodes structural bias, but I've modeled it as an agent. I need to extend the standing claim to cover the designers and the norms, not just the caseworker."

  **Soft Spot/Concession:** Concede upfront that the current model is too agent-centric. Position the paper as a step toward structural analysis, not the final word. This disarms the critique without requiring you to rewrite the paper on the spot.

  ### 4. The "Sham Review" Objection (Likely from Grad Student or Republican)
  **The Objection:** "Let's stick with your borough. The human caseworker exists but overturns nothing due to time pressure. You say this is procedural constraint. But if the review is a sham, the contestation is illusory. Does the existence of a broken mechanism count as non-domination? If yes, your theory is too weak. If no, how do you distinguish a broken mechanism from no mechanism without referencing the outcome?"

  **The Reply:** "This is why I argue the novelty is in the aggregation, not the binary. One broken mechanism might be negligible. Ten broken mechanisms across housing, benefits, and policing create a scalar burden that functions as domination. I'm not saying the sham review is fine; I'm saying we need to measure the *density* of these shams. The borough isn't dominated because of one caseworker; it's dominated because the caseworker is one of ten access points that all fail."

  **Soft Spot/Concession:** Concede that a single sham mechanism is insufficient for your theory. You need the 'many masters' aggregation to make the sham matter. If they press on the single case, admit the theory struggles there.

  ### 5. The Cambridge School Historian
  **The Objection:** "This is pure rational reconstruction. The Romans didn't care about your 'modal base' or 'counterfactual interference.' They cared about the status of the *civis* versus the *servus*. By analyzing this as a concept of liberty comparable to Berlin, you're imposing a modern analytic framework on a pre-modern social status. Why should we trust your conclusions about 'republican liberty' when the historical actors wouldn't recognize the terms?"

  **The Reply:** "I'm not making a historical claim; I'm making a theoretical one using historical materials. I agree the Romans wouldn't recognize the analytic framework. But contemporary republicanism *does* use this framework, and I'm testing its internal coherence. If the modern revival claims the Roman mantle, it needs to sustain the conceptual weight. I'm testing the modern theory, not the ancient history."

  **Soft Spot/Concession:** Concede the anachronism immediately. Do not try to defend the historical accuracy. Frame it as "conceptual engineering using historical labels."

  ### 6. The Empiricist/Comparativist
  **The Objection:** "You end on 'standing.' That's a moral status. How do I code that? If I'm comparing regimes, how do I measure whether a population has standing versus just negative liberty? If I can't measure it, how can this guide institutional design, which you claim is the problem with the threshold view?"

  **The Reply:** "You code the institutional channels for voice, not the psychological state. In the borough, I'd code the overturn rate of the caseworker relative to the appeal rate, and the transparency of the algorithm's parameters. Standing is operationalized as the existence of auditable constraints. It's imperfect, but it's more measurable than 'arbitrary power.' I'm offering a proxy: if the channels exist and are used, standing is present."

  **Soft Spot/Concession:** Concede that 'standing' is harder to measure than interference. Don't claim it's easy; claim it's *possible* via institutional proxies.

  ### 7. The Aggregation/Scalar Objection (Formalist or Republican)
  **The Objection:** "You say domination aggregates across relationships. But if it's scalar, when does it become domination? Is it 5% reduction in option sets? 10%? If you set a threshold, you're back to the binary problem. If you don't, you can't say when a state is illegitimate. You've replaced a conceptual problem with a measurement problem."

  **The Reply:** "I'm arguing we should treat it as a continuous variable for analysis, even if we need thresholds for policy. Think of it like pollution. We measure particulate matter continuously, even if we set legal limits. My point is that current theory treats it as binary (dominated/not), which hides the cumulative effect of small powers. I want to shift the metric, not necessarily solve the threshold problem today."

  **Soft Spot/Concession:** Concede you haven't solved the threshold problem. Your contribution is the *metric*, not the *limit*.

  ### 8. The "Labeling" Objection (Hostile Grad Student)
  **The Objection:** "You admit 'standing' is a moral claim, not liberty. So why is this a paper about liberty? Why not just say 'Berlin was right, there are only two liberties, and republicans should talk about dignity instead'? Isn't this just brand management to stay in the republican tribe?"

  **The Reply:** "Because the intuition driving republicanism *is* about freedom, even if the concept is unstable. People feel unfree when they lack standing. If I tell them 'that's not freedom, that's dignity,' I lose the phenomenological insight. I want to explain why it *feels* like liberty, even if the ontology is status. I'm diagnosing the confusion, not just renaming it."

  **Soft Spot/Concession:** Concede that the label is strategic. Argue that the strategy is necessary to capture the lived experience of subordination.

  ---

  ### The One Question You Hope Nobody Asks

  **The Question:** "If standing is a moral status independent of liberty, what grounds the duty to grant it? If it's not based on freedom, is it based on dignity? Autonomy? And if it's based on one of those, haven't you just reinvented Kantian respect and lost the distinctively *republican* distinctiveness entirely? Why is this republican and not liberal-deontological?"

  **Why it hurts:** It attacks the "residue" you want to keep. If your solution is just Kantianism in disguise, you haven't saved republicanism; you've dissolved it into liberalism.

  **The Reply:** "It's grounded in the requirement for justification within a political community, not abstract autonomy. Kantian respect is owed to persons *qua* persons. Republican standing is owed to citizens *qua* participants. The borough example shows the difference: the algorithm might respect my autonomy (by letting me live), but it denies my standing (by refusing to explain itself to me as a co-legislator). It's relational, not intrinsic."

  **Prep Note:** If this comes up, slow down. This is the "dissertation defense" question. Do not rush. Emphasize the *relational/political* nature of standing vs. the *moral/intrinsic* nature of Kantian dignity.
