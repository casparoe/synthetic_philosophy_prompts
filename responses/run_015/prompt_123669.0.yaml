prompt: |-
  Okay, so here's the situation. I'm a fifth-year PhD student in political theory and in three weeks I'm giving a job talk at a department whose main strength is analytic political philosophy, and I need Q&A prep more than I need anything else right now. The paper argues that republican liberty isn't a stable third concept sitting between Berlin's negative and positive liberty: my claim is that once you cash out what 'arbitrary' is supposed to mean, it either tracks the avowable interests of the person subject to the power (in which case it inherits the real-self / higher-self move Berlin worried about, and is positive liberty in a nicer jacket) or it tracks whether the power is procedurally constrained and contestable (in which case it looks like negative liberty evaluated over a wider counterfactual base — who *could* interfere, not just who does — and the novelty is modal, not conceptual). The part I actually think is new is the middle section, where I argue that domination has to aggregate across relationships to do any work — I call it the 'many small masters' problem: if ten different officials each hold a tiny, unexercised, unconstrained power over you, are you more dominated than under one official with a moderate one, and whichever way you answer, you've either committed to domination as a scalar that behaves like an expectation over undominated option-sets, or you've made it a threshold concept that can't guide institutional design. The residue I want to keep is a claim about *standing* — about being the kind of person whose interests have to be consulted — but I'm fairly open that this is a moral or status claim rather than a claim about liberty, and I say so at the end. My running example is invented: a fictional borough where housing-benefit eligibility is set by a statutory model whose parameters are fixed by law, publicly auditable, and reviewable on request by a human caseworker who overturns almost nothing and is under time pressure. I got the idea from my flatmate who does ML fairness stuff, and my supervisor keeps telling me to cut that example as a distraction but I want to keep it because it's where the abstraction actually bites.

  The audience is roughly this: a senior person who is basically a Pettit-style republican, uses 'domination' in every other sentence and runs a reading group on neo-Roman liberty; a Cambridge-school intellectual historian who thinks the whole contemporary republican revival is a rational reconstruction with only family resemblance to the tradition and will hit me on that; a formal theorist who models everything as expected utility over option sets and who I'm pretty sure thinks a third concept of freedom is just a re-description of uncertainty about others' behaviour; someone working on structural injustice in a broadly feminist register who will say that framing domination as a dyadic relation between a power-holder and a subject can't see structural or diffuse power at all; a comparativist who does real empirical work and will want to know how any of this could be measured or coded; and a handful of grad students, one of whom will ask the maximally hostile version of whatever the senior person was too polite to ask. I have about 90 seconds to answer each question before someone cuts me off.

  What I want from you is a prep sheet, not a defence of the thesis and not a literature review — I know the literature, please don't give me reading suggestions or citations, I just want to be ready for the room. Give me the eight or so objections I'll actually get from *these* people, ordered by how likely they are times how much damage they'd do rather than by abstract seriousness, each phrased the way that particular person would put it (the formal theorist's objection should sound like it comes out of a model, the historian's like a textual worry, the structural-injustice person's like a complaint about what my framework makes invisible), each with a short reply I could actually say in 90 seconds, and each with a note on where that reply is soft or what I should just concede up front instead of fighting. Please include the algorithmic benefits case in at least two of the objections, since that's the example I'm most likely to get cornered on. And at the end, tell me the one question I'm hoping nobody asks, and what I'd say if they do.
