answer: |-
  Here is the translation of the debate into your working vocabulary, followed by the formalization of your conjectures and the residue report.

  ### 1. The Debate Restated: States, Signals, and Constraints

  Consider a standard Bayesian persuasion environment (Kamenica & Gentzkow, 2011). There is a state space $\Omega$, a set of signals $S$, and a sender who chooses a signal structure $\pi \in \Pi$, where $\pi(s|\omega)$ is the probability of signal $s$ given state $\omega$. The receiver observes $s$, updates to a posterior $\mu_s \in \Delta(\Omega)$, and chooses an action $a$.

  **The Sceptical Claim (Consequentialist Equivalence)**
  In your vocabulary, the sceptic argues that the moral status of a communication act is a function solely of the induced distribution over posteriors, $\tau \in \Delta(\Delta(\Omega))$, and the resulting equilibrium payoffs $(U_S, U_R)$.
  *   **Formalization:** Let $\pi_{lie}$ and $\pi_{mislead}$ be two distinct signal structures. If they induce the same distribution over posteriors $\tau(\cdot|\pi_{lie}) = \tau(\cdot|\pi_{mislead})$, then they are morally equivalent.
  *   **Implication:** The specific mapping $\pi(s|\omega)$ is morally irrelevant "technique." Any moral cost associated with lying must be reducible to a cost parameter in the payoff function (e.g., a reputation loss or a psychological cost $c_{lie}$). If $c_{lie} = 0$, there is no moral difference. The distinction is not deontological but instrumental.

  **The Distinctive Claim (Deontological Constraint)**
  The proponent of the distinction argues that lying violates a norm intrinsic to the act of signalling, independent of the induced $\tau$ or payoffs.
  *   **Formalization:** There exists a proper subset of admissible signal structures $\Pi_{adm} \subset \Pi$. The choice of $\pi$ is constrained not by the objective function, but by the feasible set.
  *   **Implication:** Even if $\pi_{lie}$ and $\pi_{mislead}$ generate identical welfare outcomes and identical posteriors, $\pi_{lie} \notin \Pi_{adm}$ while $\pi_{mislead} \in \Pi_{adm}$. The "wrong" is modelled as a removal of strategies from the choice set, not as a penalty in the utility function. The constraint applies to the conditional probability matrix entries directly, prior to the receiver's best response.

  ---

  ### 2. Formalizing Falsity and Records

  #### (a) The Problem of Falsity
  In a standard cheap talk or information design model, messages are labels $s \in \{1, ..., k\}$. "Falsity" is undefined because there is no semantic mapping. To represent a lie, you must import structure.

  *   **Required Addition:** You need an exogenous **semantic constraint function** $\phi: S \to 2^\Omega$. For each signal $s$, $\phi(s)$ represents the set of states that $s$ *asserts* to be true.
  *   **Definition of a Lie:** A signal structure $\pi$ involves a lie if there exists some $\omega$ and $s$ such that $\pi(s|\omega) > 0$ but $\omega \notin \phi(s)$.
  *   **Translation or Import?** This is an **import**. Standard information design treats signals as correlation devices without intrinsic content. Adding $\phi$ imports a linguistic norm into the information structure. It transforms the model from *information design* to *communication with semantic constraints*. Without $\phi$, "lying" collapses into "sending a signal that induces a false belief," which is just persuasion.

  #### (b) The Records Conjecture
  Your conjecture is that lying corrupts a persistent object (a record), whereas misleading leaves the record true but thin.

  *   **Formal Home:** The "record" is best modelled as a **public history in a repeated game** or a **verifiable message in a disclosure model**.
      *   *Scenario:* Consider a repeated sender-receiver game with public monitoring. The "record" is the history of signals $h_t = (s_1, ..., s_t)$.
      *   *Lying:* The sender chooses $s_t$ such that $\omega_t \notin \phi(s_t)$. In a subsequent period $t+k$, the state $\omega_t$ may become verifiable (e.g., via an audit signal). If $\omega_t$ is revealed and contradicts $s_t$, the history $h_{t+k}$ becomes inconsistent. This forces a breakdown of the equilibrium (e.g., reversion to a babbling equilibrium or punishment phase). The "corruption" is the introduction of a contradiction into the public history that necessitates a costly equilibrium switch.
      *   *Misleading:* The sender chooses $s_t$ such that $\omega_t \in \phi(s_t)$, but $\phi(s_t)$ is a coarse set (e.g., $\Omega$). The receiver infers a specific $\omega' \neq \omega_t$. When $\omega_t$ is later verified, it is consistent with $s_t$. The record remains consistent; no equilibrium breakdown is triggered.
  *   **Cost of Identification:** If you identify the record merely with the receiver's current posterior $\mu_t$, you lose the **intertemporal externality**. The wrong of lying, on your view, is not the belief distortion at $t$ (which misleading also achieves), but the increased probability of system-wide verification failure at $t+k$.
  *   **Verdict:** Your conjecture holds formally if "record" is defined as a **verifiable public history**. A lie is a signal that creates a positive probability of future history inconsistency. Misleading is a signal that creates low information but zero probability of inconsistency. The "cost of repairing" is the welfare loss from the equilibrium punishment path triggered by the inconsistency.

  ---

  ### 3. The Residue Report

  #### What Translated Without Loss
  1.  **Consequentialist Equivalence:** The sceptical position translates perfectly. If morality is welfarist, it maps directly to the induced distribution over posteriors $\tau$.
  2.  **Strategic Intent:** The sender's *ex ante* choice of $\pi$ captures the philosophical notion of "intent to deceive." The distinction between choosing a misleading structure vs. deviating to a lie is captured by the distinction between equilibrium selection and off-path deviations.

  #### What Required Additions (and Welfarist Smuggling)
  1.  **The Semantic Map ($\phi$):** As noted, falsity required importing $\phi$.
  2.  **The Deontological Constraint:** To represent the claim that lying is *intrinsically* wrong, I modelled it as a constraint on $\Pi_{adm}$.
      *   *Smuggling Warning:* If you model the "wrong" of lying as a cost $-L$ in the sender's payoff function $U_S$, you have smuggled in welfarism. You have made lying permissible whenever the gains from deception exceed $L$. The non-consequentialist claim is that $L = \infty$ (hard constraint), or that the constraint operates on the feasible set, not the objective.
      *   *Flag:* Any translation that puts the "norm" into the payoff function fails to capture the deontological position. It must be a constraint on the choice set.

  #### What Has No Counterpart
  1.  **The Nature of Assertion:** Economics treats messages as tools to influence beliefs. Philosophy often treats assertion as a social practice governed by constitutive rules (like promising). The economic vocabulary has no place for a rule that constitutes the activity itself rather than regulating it.
  2.  **Audience Rights:** The philosophical debate often hinges on the receiver's *right to the truth*. In your vocabulary, the receiver has no rights, only best-response functions. You can model a violation of rights as a negative externality, but you cannot model the *right* itself without importing a normative welfare weight exogenously.

  #### The Shape of the Norms (Testing Your Suspicion)
  You suspected that the norm against lying is a state-by-state constraint, while the norm against misleading is a constraint on the structure as a whole. I derive this as follows:

  1.  **Norm Against Lying:**
      *   To ban lying, we must ban sending signal $s$ when state is $\omega$ if $s$ asserts $\neg \omega$.
      *   **Form:** $\pi(s|\omega) = 0 \quad \forall \omega, s \text{ s.t. } \omega \notin \phi(s)$.
      *   **Shape:** This is a **local, element-wise constraint** on the stochastic matrix $\Pi$. It zeros out specific entries. It restricts the *support* of the conditional distribution.

  2.  **Norm Against Misleading:**
      *   Misleading occurs when the sender chooses $\pi$ such that the receiver's inference $\mu_s$ diverges from the literal content $\phi(s)$, typically by exploiting the gap between semantic content and pragmatic inference.
      *   To ban misleading, you must constrain the relationship between the signal structure and the equilibrium interpretation. In a Bayesian persuasion context, "misleading" is often indistinguishable from "persuasion." To ban it, you must ban *any* structure that induces a posterior $\mu_s$ where the expected state differs from the prior, *unless* the signal fully reveals the state.
      *   Alternatively, if misleading is "hiding information without lying," the constraint is on the **Blackwell informativeness** of $\pi$. You might require $\pi$ to be uninformative (babbling) or fully revealing.
      *   **Form:** A constraint on the **marginal distribution of posteriors** $\tau(\mu)$, or a constraint on the mutual information $I(\omega; s)$.
      *   **Shape:** This is a **global, structural constraint**. It restricts the convex hull of the columns of $\Pi$, or the entropy of the system. It does not zero out specific entries $\pi(s|\omega)$; rather, it restricts the *configuration* of the matrix as a whole (e.g., requiring columns to be identical or orthogonal).

  **Conclusion on Shape:** Your suspicion is formally correct.
  *   **Anti-Lying:** A constraint on the **support** of the conditional probability matrix (Local/State-by-State).
  *   **Anti-Misleading:** A constraint on the **informativeness** of the signal structure (Global/Structural).

  #### Final View on the Residue
  The residue indicates that the economic vocabulary is **instrumentalist by construction**. It is designed to optimize outcomes given constraints.
  *   **Is it a defect?** It is a defect only if you believe moral truth exists independently of outcomes. If the "wrongness" of lying is truly non-consequentialist, the economic vocabulary cannot capture it without treating the norm as an arbitrary exogenous constraint (a "taste" for truth-telling that acts like a law of physics).
  *   **Evidence of Thinness?** The fact that the distinction maps cleanly onto "Local vs. Global" constraints suggests the philosophical distinction is **structurally robust** but **normatively fragile** in this framework. The framework shows that "lying" is a simpler restriction (don't send *this* signal at *this* state) than "misleading" (don't construct a system that creates *that* inference).
  *   **Verdict:** The translation suggests the philosophical distinction is not "thin," but it is **context-dependent**. In a one-shot game with no semantic map ($\phi$) and no future records (repeated history), the distinction collapses (Sceptic wins). The distinction only gains traction when you import semantics (for lying) or intertemporal verification (for records). This implies the moral weight of lying is not intrinsic to the information transfer itself, but to the **institutional context** (language norms, record-keeping systems) in which the transfer is embedded. The economic vocabulary reveals that without those institutional structures, the moral difference vanishes.
