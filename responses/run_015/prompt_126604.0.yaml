answer: |-
  This is a diagnostic instrument designed to separate the four axes of strictness (Density, Sanction, Stigma, Demand) and route specific norms to their appropriate normative grounding. It is built to be administered by a committee member or student with no philosophical training, using concrete intuitions rather than theoretical labels.

  ### Part I: The Decision Tree (8 Branch Questions)

  *Instructions: For each proposed rule or norm in the code, answer these questions in order. Stop when you reach a Leaf.*

  1.  **The Collapse Test:** If 20% of people stopped doing this tomorrow, would the practice become useless for everyone else (e.g., driving on the right, filing deadlines)?
      *   **Yes:** Go to Q2.
      *   **No:** Go to Q3.
  2.  **The Coordination Check:** Is the *only* reason to do this that everyone else is doing it, rather than the act itself being good?
      *   **Yes:** **Leaf A (The Coordinator).**
      *   **No:** Go to Q3.
  3.  **The Harm Check:** Does breaking this rule directly damage someone's body, property, or ability to consent, who did not agree to the risk?
      *   **Yes:** Go to Q4.
      *   **No:** Go to Q5.
  4.  **The Severity Check:** Is the damage catastrophic or irreversible (e.g., assault, theft) vs. manageable/compensatable (e.g., noise, lateness)?
      *   **Catastrophic:** **Leaf B (The Harm-Principle Guardian).**
      *   **Manageable:** Go to Q5.
  5.  **The Paradox Check:** If we punished people for not doing this, would it destroy the value of them doing it voluntarily (e.g., thanking, apologizing, hospitality)?
      *   **Yes:** **Leaf C (The Paradox Norm).**
      *   **No:** Go to Q6.
  6.  **The Reciprocity Check:** Did you benefit from others following this rule, such that breaking it now takes advantage of their restraint (e.g., queue-jumping, tax-paying)?
      *   **Yes:** **Leaf D (The Fair-Player).**
      *   **No:** Go to Q7.
  7.  **The Scaffolding Check:** Is this rule designed to help you build a habit you currently lack, rather than to protect others (e.g., mandatory attendance, citation formats for beginners)?
      *   **Yes:** **Leaf E (The Pedagogue).**
      *   **No:** Go to Q8.
  8.  **The Innovation Check:** Is the primary value of this space to test new ways of living that might replace old rules (e.g., experimental housing, new speech norms)?
      *   **Yes:** **Leaf F (The Experimentalist).**
      *   **No:** **Leaf G (The Traditionalist).** *(Default for inherited norms with no clear harm/benefit)*.

  *(Note: Leaf H [The Anarchist] is excluded from the tree because it rejects the premise of the instrument—that we are writing a code. It is treated as an unoccupied cell in Part III.)*

  ---

  ### Part II: The Leaves (Normative Positions)

  Each leaf specifies the four axes: **Density** (how many rules), **Sanction** (punishment), **Stigma** (shame), **Demand** (monitoring).

  **Leaf A: The Coordinator**
  *   **Case:** Driving side, file naming conventions, citation styles.
  *   **Axes:** High Density, Moderate Sanction, Zero Stigma, High Demand.
  *   **Awkward Commitment:** "Do it exactly this way not because it's right, but because we need to match, and we will fine you for mismatching without calling you a bad person."

  **Leaf B: The Harm-Principle Guardian**
  *   **Case:** Assault, theft, harassment, safety protocols.
  *   **Axes:** Low Density (only vital harms), Severe Sanction, High Stigma, High Demand.
  *   **Awkward Commitment:** "We will use the full force of the institution to stop you from hurting others, and we will shame you for trying."

  **Leaf C: The Paradox Norm**
  *   **Case:** Thank-you notes, apologies, spontaneous help, hospitality.
  *   **Axes:** High Density (aspirational), Zero Sanction, Zero Stigma, Zero Demand.
  *   **Awkward Commitment:** "We expect you to do this constantly, but if we catch you not doing it, we will pretend we didn't see it, because demanding it kills it."

  **Leaf D: The Fair-Player**
  *   **Case:** Queueing, paying dues, cleaning shared kitchens, masking during mild outbreaks.
  *   **Axes:** Moderate Density, Mild Sanction, Moderate Stigma, Moderate Demand.
  *   **Awkward Commitment:** "You don't have to love this rule, but you benefited from others following it, so you owe them compliance."

  **Leaf E: The Pedagogue**
  *   **Case:** Attendance policies, draft deadlines, academic integrity for first-years.
  *   **Axes:** High Density, Mild Sanction, Low Stigma, High Demand.
  *   **Awkward Commitment:** "We are forcing you to follow this rule not to protect us, but to train you to be the kind of person who follows it when no one is watching."

  **Leaf F: The Experimentalist**
  *   **Case:** New social norms, artistic expression, research ethics in novel fields.
  *   **Axes:** Low Density, Zero Sanction, Zero Stigma, Zero Demand.
  *   **Awkward Commitment:** "Break the old rules here on purpose; we need to see if your way works better than ours."

  **Leaf G: The Traditionalist (Epistemic)**
  *   **Case:** Dress codes at formal events, obscure procedural rituals, dietary customs in specific halls.
  *   **Axes:** Moderate Density, Mild Sanction, Moderate Stigma, Low Demand.
  *   **Awkward Commitment:** "We don't fully understand why this rule exists, but it has held the community together this long, so assume you are the one missing something."

  **Leaf H: The Anarchist (Unreachable via Tree)**
  *   **Case:** Mutual aid networks, voluntary associations.
  *   **Axes:** Zero Density, Zero Sanction, Variable Stigma, Zero Demand.
  *   **Awkward Commitment:** "No code should exist; trust us to sort it out through relationship and need."

  ---

  ### Part III: Unoccupied Combinations (The Empty Cells)

  These are logical combinations of the four axes that the tree intentionally blocks.

  1.  **High Stigma + Zero Harm + Zero Reciprocity (The Purity Spiral)**
      *   *Diagnosis:* **Incoherent.** Shaming someone for a private act that hurts no one and owes nothing to anyone creates resentment without social value. This is where conduct codes become tyrannical.
  2.  **High Sanction + Paradox Norm (The Gratitude Tax)**
      *   *Diagnosis:* **Self-Defeating.** Fining someone for not sending a thank-you note ensures they will never send a genuine one again. It consumes the capital it tries to generate.
  3.  **High Demand + Experimentalist (The Controlled Burn)**
      *   *Diagnosis:* **Oxymoron.** You cannot mandate innovation. If you monitor and enforce an "experiment," it ceases to be an experiment and becomes a procedure (Leaf A or E).
  4.  **Anarchist Leaf + Coordination Norms (The Traffic Jam)**
      *   *Diagnosis:* **Impossible.** You cannot have voluntary compliance for norms that require universal coordination (like driving sides). This combination leads to immediate systemic collapse.

  ---

  ### Part IV: My Committed Recommendation

  You asked me not to hedge. Based on the logical space above and the specific context of a university campus (which is simultaneously a living community, a safety zone, and an innovation engine), here is what your code should look like.

  **The Verdict:**
  Your code should be **Tiered**, not Uniform. Most failed codes try to apply Leaf B (Harm-Principle) sanctions to Leaf D (Fair-Play) problems, or Leaf E (Pedagogue) demands to Leaf C (Paradox) norms.

  1.  **Safety & Rights (Leaf B):** Keep this section tiny. <10% of the code. Sanctions severe, stigma high. Zero tolerance for ambiguity.
  2.  **Coordination & Procedure (Leaf A):** Keep this bureaucratic. <20% of the code. Sanctions are fines/administrative holds. **Zero stigma.** Do not call a late form submission "misconduct"; call it "non-compliance."
  3.  **Community & Reciprocity (Leaf D):** This is the bulk of residential life. <40% of the code. Sanctions restorative (clean the kitchen, apologize). Stigma moderate.
  4.  **Virtue & Paradox (Leaf C & E):** <10% of the code. Do not write these as enforceable rules. Write them as "Community Expectations" or "Educational Goals." **No sanctions.** If you sanction a lack of hospitality, you lose the community.
  5.  **Innovation (Leaf F):** <10% of the code. Designate specific zones (physical or social) where the code is suspended in favor of negotiated agreements.

  **My Leaf:**
  I locate myself primarily on **Leaf D (The Fair-Player)**, modified by **Leaf C (The Paradox Norm)** for interpersonal virtue.
  I believe the default stance of a liberal community should be reciprocity: you comply because others complied, not because an authority commanded it. However, for norms of gratitude and care, I believe enforcement must vanish entirely.

  **Confidence:**
  80% confident in the *taxonomy* (the distinctions hold up logically).
  60% confident in the *application* (this depends on empirical realities of your specific campus culture).

  **The Load-Bearing Empirical Guess:**
  My recommendation rests on this assumption: **Students respond to stigma with concealment, not correction.**
  If you attach high stigma to Leaf D violations (e.g., "You are a bad community member for not cleaning the fridge"), students will hide the mess rather than clean it. If you attach low stigma but consistent sanction (e.g., "The fridge will be locked if dirty"), they will clean it.
  *   *What would move me:* If you have data showing that high-stigma approaches on your campus actually produce *higher* long-term compliance without increasing concealment, I would shift toward Leaf B for more categories. But the literature on "shame cultures" suggests this is unlikely.

  **The Single Consideration to Move Me:**
  If it could be demonstrated that **Looseness (Leaf F)** in non-academic domains correlates with **higher academic integrity** (Leaf E) due to increased trust in administration, I would argue for expanding Leaf F significantly. Currently, I assume they are independent; if they are positively correlated, the code should be much shorter than I propose.

  **Final Advice for the Committee:**
  When the argument derails on Tuesday, ask: *"Which Leaf are we arguing about?"*
  If one person is arguing for Leaf B (Harm) and another for Leaf C (Paradox), you are not disagreeing on facts; you are categorizing the norm differently. Agree on the Leaf first. The sanction follows the Leaf, not the preference.
