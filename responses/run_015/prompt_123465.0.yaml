answer: |-
  The fluorescent lights of the moderation center hummed at a frequency Elena felt in her molars. On her screen, Post ID 89402 blinked red. *Violation: Self-Harm Imagery.* The protocol was automatic deletion. Ban the user. Log the incident. Move to the next.

  But Elena had read the thread. It wasn't promotion; it was a support group. A kid in Ohio typing into the void at 3 AM, being talked down by a stranger in Leeds. The keywords triggered the filter, but the context was salvation.

  She hovered over the *Override* button. It was greyed out.

  "Tier 1 restrictions," the tooltip read. *Escalate to Senior.*

  She opened the ticketing system. She typed her justification: *Contextual exception required. Human safety prioritized over keyword strictness.* She hit send. The ticket number generated instantly: *T-9902.*

  She waited. The office around her was a sea of cubicles, each occupied by a person wearing the same headset, staring at the same stream of violations. They were the filter. The first hand.

  A ping. Her ticket updated. *Status: Denied.*
  *Reason: Adherence to Guideline 4.4 is mandatory. No exceptions.*
  *Author: Senior Moderator.*

  Elena frowned. She pulled up Guideline 4.4. *Definitions of Harmful Content are final and determined by the Oversight Committee.*

  She had never seen the Oversight Committee. They were the myth of the center, the second hand that drew the first. They wrote the rules the seniors enforced. She navigated to the internal directory, searching for "Oversight."

  The search bar spun. A single result appeared: *Oversight Queue.*

  She clicked it, expecting a list of names, a boardroom schedule, anything that indicated a higher authority. Instead, a window opened that looked exactly like her own workstation interface. It was a feed of tickets.

  She scrolled up. Ticket *T-9902* was there. It had been marked *Denied*.
  She looked at the ID of the moderator who denied it. It was her own employee ID.

  She scrolled further. Ticket *T-8810*. Approved. ID: Hers.
  Ticket *T-7754*. Denied. ID: Hers.

  Her breath hitched. She minimized the window and checked the timestamp on her original ticket submission. It was logged at 10:42 AM. The denial from "Senior Moderator" was logged at 10:41 AM.

  She stood up, chair scraping loudly against the linoleum. The row of moderators to her left didn't look up. They were all clicking, scrolling, denying, approving. She walked to the supervisor's office at the end of the row. The door was open. The desk was empty, save for a computer terminal sleeping in screensaver mode.

  She tapped the mouse. The screen woke. It displayed the same queue. *Oversight Queue.*
  She opened the policy editor. She typed: *Amend Guideline 4.4. Allow contextual exception for support networks.*
  She hit *Save.*

  A dialog box popped up. *Permission Denied. Changes require Oversight Committee approval.*

  Elena stared at the cursor blinking in the empty text field. She went back to her desk. She opened the Oversight Queue again. She found the ticket where she had just tried to change the policy. It was already there, marked *Pending Review.*

  The system wasn't a pyramid. It was a circle. The rules dictated her actions, but her actions generated the data that wrote the rules. The Senior Moderator wasn't a person above her; it was a function she stepped into when she escalated a ticket. The Committee wasn't a room of executives; it was the aggregate of every decision made on the floor, fed back into the algorithm to train the next day's filters.

  There was no one to appeal to. There was no outside to climb to. The hand drawing the hand was her own.

  She sat down. The red blink of Post ID 89402 waited. If she deleted it, the algorithm learned that deletion was the correct response to those keywords. If she appealed, she voted to keep it, but the appeal itself was processed by the logic of past deletions.

  She wasn't trapped by a boss. She was trapped by the weight of her own collective history. The system was perfect because it was closed. It didn't need a god; it only needed consistency.

  Elena placed her finger on the mouse. She could feel the hum of the lights in her wrist. She wasn't escaping the loop. She was the ink.

  She clicked *Override*.

  The screen flashed green. *Decision Recorded. Guideline 4.4 Updated.*
  Immediately, a new ticket appeared in her queue. *Review Decision ID 89402.*
  *Author: Senior Moderator.*
  *ID: Hers.*

  She opened it. She read her own justification from thirty seconds ago. She had to vote on whether her own override was valid.

  Elena exhaled. The air in the room was stale, recycled through vents that led nowhere outside. She looked at the *Approve* and *Deny* buttons. They were the same color.

  She clicked *Approve*.

  The loop tightened. The system breathed. She went to the next post.

  ***

  **Note for Teacher:**
  This story commits to the "Closed Loop" side of the tangled hierarchy. The point is that agency isn't about escaping the system to a higher level, but recognizing that the individual and the structure are co-creators; the character realizes she is both the rule-maker and the rule-follower, meaning her choices matter precisely because there is no external authority to blame or appeal to.
