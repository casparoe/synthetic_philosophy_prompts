answer: |-
  This is a sophisticated ethical and historiographical debate. You and your friend are touching on two distinct philosophical concepts: **moral relativism** (judging actions by the standards of the time) versus **moral universalism** (certain acts are wrong regardless of era), and the role of **dissent** in establishing culpability.

  Here is an analysis of whether your friend is being consistent, the strength of her distinction regarding the clergy, and whether there is a principled reason to judge historical figures differently from modern actors.

  ### 1. Is your friend being consistent?

  Strictly speaking, **no, she is not consistent**, though she may not realize it. Her argument shifts in a way that actually undermines her original position.

  *   **Her Initial Position:** Columbus was a "product of his era." This implies that the moral norms of 1492 universally permitted or encouraged his actions, and therefore he cannot be blamed for not adhering to 21st-century norms.
  *   **Her Rebuttal:** She notes that Spanish clergy *did* condemn the mistreatment of indigenous peoples (e.g., Antonio de Montesinos in 1511, Bartolomé de las Casas later).

  **The Contradiction:** If there were prominent voices within his own society condemning his actions, then he was **not** merely following an unquestioned universal norm. By introducing the existence of contemporary dissent, she inadvertently validates your comparison to modern corporations.

  In both cases (Columbus and modern corporations), the actor is operating within a system that legally permits harmful behavior, but faces moral opposition from a subset of their contemporaries.
  *   **Columbus:** State-sanctioned conquest vs. Clerical moral objection.
  *   **Corporations:** State-sanctioned pollution vs. Environmental/ethical objection.

  If she condemns the corporations for ignoring the environmental ethicists, she logically must condemn Columbus for ignoring the clerical ethicists. By admitting the clergy existed, she has moved from a defense of *historical relativism* ("everyone did it") to a specific judgment of *individual agency* ("he chose to ignore the critics"). The latter supports your position, not hers.

  ### 2. Does the presence of dissent undermine the "Product of His Time" defense?

  Yes, significantly. The "product of his time" defense only holds water if the behavior was truly hegemonic—if there was no conceptual framework available at the time to recognize the action as wrong.

  History shows that cruelty and enslavement were not unquestioned in 15th-century Spain.
  *   **Queen Isabella** initially opposed the enslavement of indigenous people (though she was often ignored by colonists).
  *   **The Church** debated the humanity of indigenous peoples (the Valladolid Debate).
  *   **Laws of the Indies** were eventually passed to protect indigenous populations, acknowledging that previous treatment was unjust.

  Because these moral frameworks existed *contemporaneously*, Columbus cannot claim he lacked the epistemic access to know his actions were morally contentious. He wasn't violating *future* morals; he was violating *existing* morals that were simply overruled by economic and imperial interests.

  ### 3. Is there a principled reason to judge them differently?

  While your friend is logically inconsistent, is there a valid philosophical reason to treat historical figures differently than modern corporations? There are two potential arguments, though neither fully saves her original position:

  **A. The "Ongoing Harm" Argument**
  One could argue that we criticize modern corporations because their actions cause *ongoing, preventable harm* that we can stop today. Condemning Columbus does not stop the harm he caused 500 years ago.
  *   *Counter:* We condemn historical figures not to stop their specific actions, but to shape our current values, historical understanding, and who we choose to honor (e.g., statues, holidays). The judgment serves a present-day social function.

  **B. The "Systemic vs. Individual" Argument**
  One might argue that a corporation is a legal entity designed to maximize profit within current laws, whereas Columbus was an individual with personal agency.
  *   *Counter:* Columbus was also acting as an agent of the Spanish Crown, driven by profit and titles. The structural incentives were very similar. Furthermore, modern CEOs are individuals with agency, not just faceless entities.

  ### 4. The Verdict on the Debate

  Your friend's distinction regarding the clergy does not save her position; it actually strengthens yours.

  *   **If** there had been no dissent in 1492, her "product of his time" argument would be stronger (though still vulnerable to moral universalism).
  *   **Because** there was dissent, Columbus had a choice. He chose the path of violence and enslavement despite knowing there were moral objections within his own cultural framework.

  **The Consistency Check:**
  If your friend believes modern corporations should be held accountable for ignoring moral dissenters (scientists, activists) regarding the environment, she must apply the same standard to Columbus. He ignored moral dissenters (clergy, humanists) regarding indigenous people.

  **Conclusion:**
  You are on firmer logical ground. The presence of contemporary dissent undermines the "historical context" defense. It suggests that Columbus was not a passive vessel of his era's norms, but an active participant who prioritized gain over the moral objections that were available to him at the time. Your friend is likely holding modern actors to a standard of **moral responsibility** while trying to hold historical actors to a standard of **legal compliance**, which is an inconsistent metric.

  You might suggest to her that the question isn't "Did he know what we know now?" but rather "Did he know what *they* knew then?" The evidence suggests he did.
