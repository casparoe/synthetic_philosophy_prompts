answer: |-
  Here's the brainstorm and the session plan. Keep it loose, keep it focused on the *concept*, not the headlines.

  ### Quick Brainstorm
  *   **Core Tension:** Honor vs. Utility. A statue starts as a tribute (honor) but becomes a landmark (utility).
  *   **The "Address-Space" Idea:** When a name becomes a coordinate, it loses moral weight but gains structural weight. Removing it isn't silencing praise; it's re-mapping.
  *   **The Trap:** Writers love symbolism. They'll want to talk about what the statue *means*. You have to force them to talk about what the statue *does*.
  *   **Audience:** Novelists. They understand narrative function. Use that. A statue is a character vs. a statue is a setting.
  *   **Dependency:** You must establish the *utility* function before discussing the *ethics* of removal. If they think it's purely symbolic, the "coordinate" argument collapses.

  ---

  ### The 50-Minute Plan: "Coordinates vs. Monuments"

  **0:00–0:05 | Hook: The GPS Test**
  Ask: "When your GPS says 'Turn left at Washington,' are you honoring the Founding Father, or are you avoiding a traffic ticket?"
  Get a show of hands. Most will laugh and say "导航 (navigation)."
  *Goal:* Break the assumption that public names are always active praise.

  **0:05–0:15 | Concept Drop: Address-Space Commemoration**
  Define the term.
  *   **Phase 1: Dedication.** The moment the statue goes up. It's about *him*.
  *   **Phase 2: Integration.** The city grows around it. It becomes about *us* moving through space.
  *   **The Shift:** Once it becomes infrastructure (a coordinate), the ethical calculus changes. You aren't judging the man anymore; you're judging the map.
  *   *Head off Misconception #1 here:* "But removing it erases history!"
      *   *Counter:* "History is in books. Street grids are for living. We update maps when cities change. Does updating a map erase the terrain?"

  **0:15–0:30 | The Carrying Example: The Traffic Circle Statue**
  *   **The Example:** A bronze general on a horse in the middle of a busy commuter roundabout. (Think *Dupont Circle* or *Logan Circle*, but genericized).
  *   **Required Properties:**
      1.  **High Friction:** People drive *around* it daily to get to work.
      2.  **Low Contemplation:** Nobody stops to read the plaque. It's a visual obstacle, not a destination.
      3.  **Embedded:** The address system relies on it ("Meet me at the General").
  *   **Case to Avoid:** Do *not* use a statue in a park where people picnic, and do *not* use a museum piece. Those are "honor spaces," not "address spaces."
  *   **Exercise:** Ask the room: "If this statue causes traffic accidents, does the General's moral character matter? Or does his function as a traffic hazard matter?"
  *   *Head off Misconception #2 here:* "But names are neutral labels!"
      *   *Counter:* "Labels aren't neutral; they're choices. Choosing 'General' anchors the space to a military past. Choosing 'Peace' anchors it to a value. Neutrality is a myth; coordinates are editorial choices."

  **0:30–0:45 | The Misconception Gauntlet**
  Walk them through the pushback they'll face in their essays.
  1.  **"If we remove it, we erase the past."** (You handled this in Concept Drop, reinforce it). *Response:* "We move statues to museums. That's preserving history. Keeping them in traffic is preserving infrastructure."
  2.  **"It's just a name, who cares?"** (Handled in Example). *Response:* "Because coordinates tell you where you belong. If the coordinate honors someone who hated you, the space feels hostile, not neutral."
  3.  **"We should only remove villains."** (The big trap).
      *   *Head off here:* "What if the hero is irrelevant? If we name a sewer plant after Washington, is it an insult? No, it's a mismatch of function. Address-space ethics isn't about canceling villains; it's about fitting the label to the function."

  **0:45–0:50 | The Check Question & Close**
  Pose the final question (see below). Discuss answers briefly. Wrap by telling them: "Your job isn't to solve the politics. It's to describe the shift from monument to map."

  ---

  ### The Dependency Order
  **Crucial:** You must establish **Function (Utility)** before **Meaning (Symbolism)**.
  *   **Why:** If they believe the statue is *primarily* a symbol of honor, then removal is inherently an act of dishonor (erasure).
  *   **The Fix:** You must convince them that the statue has *become* a tool (a coordinate) first. Once it's a tool, the ethics shift from "respect for the dead" to "utility for the living." If you skip this, the distinction collapses into standard political arguing.

  ---

  ### The Misconception Map

  1.  **"Removal = Erasure"**
      *   *When it arises:* Immediately upon introducing removal.
      *   *Where to head it off:* **Concept Drop (Min 10).**
      *   *The Move:* Distinguish "Archive" (museum/books) from "Infrastructure" (streets/squares). Infrastructure is for the present; Archives are for the past.

  2.  **"Names are Neutral Labels"**
      *   *When it arises:* During the Example (Min 20). Writers love language; they'll argue "Washington" is just a word.
      *   *Where to head it off:* **Example Deep Dive (Min 25).**
      *   *The Move:* Show that a name selects *which* history anchors the location. A label is a claim of ownership over the space's identity.

  3.  **"This Only Applies to Villains"**
      *   *When it arises:* Towards the end (Min 40). They'll think this is just a "Confederate Statue" theory.
      *   *Where to head it off:* **Gauntlet (Min 45).**
      *   *The Move:* Use the "Sewer Plant" argument. Sometimes good people are the wrong coordinate for the function. It's about fit, not morality.

  ---

  ### The Check Question
  *Don't ask for their opinion on a real statue. Ask them to diagnose a scenario.*

  **"Imagine a statue of a beloved local firefighter placed in the middle of a dangerous highway interchange. Commuters say it causes accidents. The family says removing it dishonors his sacrifice. Using *only* address-space ethics, what is the primary conflict here?"**

  *   **Correct Grasp:** "It's a conflict between **safety/function** and **memory/honor**. The ethics depend on whether the space is defined as infrastructure (commuters win) or a memorial (family wins)."
  *   **Incorrect Grasp:** "It depends on if the firefighter was a good person" (Misses the coordinate point) OR "Remove it immediately because safety matters most" (Misses the ethical weight of the honor).
  *   **Why this works:** It removes the political venom (no villains) and forces them to weigh *function* vs. *honor* directly.

  ---

  ### What to Leave Out (and Why)

  1.  **Legal Property Doctrine:** Who owns the land? The city? The state? A private trust?
      *   *Why leave it:* That's law, not ethics. It distracts from the *meaning* of the space.
  2.  **Cost of Removal:** How much does it cost to move bronze?
      *   *Why leave it:* That's logistics. A costly ethical duty is still a duty. Money muddies the conceptual water.
  3.  **Democratic Process/Voting:** Should we hold a referendum?
      *   *Why leave it:* Majority rule doesn't solve ethical puzzles about meaning. (51% of people can't make a racist statue ethical).
      *   *Protection:* Leaving these out protects the idea from becoming a policy workshop. You want them writing essays about *meaning*, not op-eds about *zoning laws*.

  Keep it tight. If they start arguing politics, pull them back to the "GPS Test." Does the GPS care about the hero, or the turn?
