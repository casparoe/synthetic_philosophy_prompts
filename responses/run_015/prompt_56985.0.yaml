answer: |-
  You have identified a precise and recurring structural feature in care ethics (and broader non-consequentialist moral philosophy) that often goes unnamed because it is treated as intuitive rather than argued.

  There is no single canonical term for the *argumentative move* itself, but the *value* it attempts to isolate is well-established. The nearest established concept is **Constitutive Value** (often discussed under the heading of **Internal Goods**). The argumentative structure you describe—defining a value by what remains after instrumental functions are subtracted—is best described as **Residual Definition via Epistemic Opacity**.

  Here is the carving of the concept, its neighbors, the source of the inconsistency you spotted, and a verdict on its validity.

  ### 1. The Core Concept: Constitutive Value (Internal Goods)

  The "residue" you are detecting is the claim that care is a **practice** with **internal goods**, not merely a service producing **external goods**.

  *   **External Goods:** Outcomes separable from the activity (e.g., the patient is fed, the medication is taken, safety is maintained). Your system replicates these.
  *   **Internal Goods:** Values achievable *only* by engaging in the specific relationship or activity in a certain way (e.g., the experience of being "attended to," the mutual recognition between carer and cared-for).

  **The Move:** When an author concedes that all external goods are replicated but insists something is lost, they are asserting that the internal good is **constitutive** of the care itself, not a byproduct.
  *   **Why it looks like subtraction:** Because internal goods are often phenomenological (felt experiences of the relationship), they cannot be listed as functional requirements. They are defined negatively: "It is not just the pill being taken; it is the *concern* behind the hand that offers it."
  *   **Why it is uncheckable:** Internal goods are **epistemically opaque** to third parties. An auditor can check if a pill was taken (external); they cannot verify if the act expressed genuine concern (internal).

  **Does this fit?** Yes. It explains why the loss is located in motive/relation (the source of the internal good) and why it survives functional replication.

  ### 2. Neighboring Concepts and Distinctions

  You mentioned three neighboring ideas. Here is how the "Constitutive Residue" differs from them:

  | Concept | The Claim | How it differs from your "Residue" |
  | :--- | :--- | :--- |
  | **Commodification** | Market norms corrupt social norms. | Commodification argues the *introduction of payment* changes the nature of the good. Your case involves automation (no payment to a human). The residue argument persists even without market exchange, so it is deeper than commodification. |
  | **Incommensurability** | Two values cannot be weighed against each other. | Incommensurability blocks trade-offs (e.g., "You can't trade dignity for efficiency"). The residue argument is stronger: it claims the efficient option *lacks the value entirely*, not that it is just incomparable. |
  | **Wrong Reason** | Doing the right act for the wrong motive lacks moral worth. | This is usually about the *agent's* virtue (Kant). The residue argument is about the *recipient's* good (the care-receiver loses something). It is relational, not just agential. |

  **Best Fit:** **Constitutive Value** is the ontological claim; **Residual Definition** is the rhetorical method used to point at it.

  ### 3. Explaining the Inconsistency (The "Shelter" Charge)

  You noted that authors insist the residue matters (family shouldn't outsource) but then admit paying an agency is acceptable. This looks like a contradiction, but charitably, it is a shift between **Agent-Relative** and **Agent-Neutral** obligations.

  *   **Agent-Relative (The Family):** An adult child has a special duty to *their* parent. The "internal good" here is the *filial relationship*. If the child pays someone else, the child fails to constitute *their* relationship with the parent, even if the parent is cared for. The residue is the *child's participation*.
  *   **Agent-Neutral (The Agency/State):** A professional caregiver or the state has a general duty to ensure the citizen is safe. They do not need a personal relationship to discharge this. Their obligation is to the *external goods* (safety, health).

  **Where the "Shelter" Accusation Holds:**
  The inconsistency becomes a rhetorical shelter when authors slide between these two frameworks without signaling the switch.
  *   *Example of Shelter:* "We cannot automate care because it requires human connection" (Agent-Relative claim applied universally) vs. "But we must hire professionals because families burn out" (Agent-Neutral claim).
  *   If the author cannot specify *whose* relationship constitutes the value (the family's? the professional's? the patient's?), the "residue" becomes a black box used to block technological intrusion without defining the threshold of sufficient "humanity."

  ### 4. Substantive Claim or Rhetorical Shelter?

  **Charitable Reading (Substantive):**
  The claim is that care is a **communicative act**. Like a promise or an apology, its success conditions include the mental state of the actor.
  *   *Analogy:* If I program a robot to say "I apologize" to you, have I apologized? Functionally, yes (you know I'm sorry). Communicatively, no (the act of apology requires my submission).
  *   Under this view, your system provides *monitoring*, not *care*. It is a substantive distinction between **management of needs** (which can be automated) and **attendance to a person** (which implies a witness).

  **Uncharitable Reading (Shelter):**
  The claim functions as a **No True Scotsman** fallacy regarding the definition of care.
  *   "True care requires human motive."
  *   "This system provides all care outcomes."
  *   "Then it is not True Care."
  *   This is a shelter if the authors cannot explain *why* the motive matters to the *recipient* beyond vague appeals to "dignity." If the recipient feels cared for by the system, asserting a "hidden loss" privileges the philosopher's intuition over the user's experience.

  **Verdict:** It is a **substantive ontological claim stated with epistemic imprecision.** The value (constitutive relation) is real in human psychology, but the "subtraction" method is a lazy way to identify it. It relies on the intuition that "human touch" is magical rather than analyzing *which* specific interactions (e.g., improvisation, shared vulnerability) generate the value.

  ### 5. Boundary Cases (Same Intuition, Different Pattern)

  To ensure you have the right carving, here are cases that feel similar but are **not** the "Constitutive Residue" move:

  *   **The Trust/Reliability Case (Instrumental):**
      *   *Scenario:* A family prefers a human over a sensor because the human can notice a subtle change in skin color the sensor misses.
      *   *Why different:* The loss is in the **outcome** (missed diagnosis), not the relation. This is an engineering constraint, not a philosophical residue.
  *   **The Liability Case (Legal):**
      *   *Scenario:* A family hires an agency so they are not legally liable if something goes wrong.
      *   *Why different:* The value is **risk transfer**. No residue is posited; the transaction is purely instrumental.
  *   **The "Uncanny Valley" Case (Psychological):**
      *   *Scenario:* A patient feels creeped out by a robot voice, even if it is polite.
      *   *Why different:* This is an **aesthetic/psychological reaction**, not a moral claim about the nature of care. It is observable (we can measure stress responses), whereas the "residue" is defined as unobservable.

  ### 6. A Name for the Move

  Since you asked to name it if nothing fits: I suggest calling it **The Apophatic Definition of Relational Value**.

  *   **Apophatic:** Defined by what it is *not* (not merely functional, not merely transactional).
  *   **Relational Value:** Located in the space between agents.
  *   **The Move:** Asserting that because the value cannot be exhaustively described functionally, it must exist in a non-functional domain (motive/relation) that is immune to functional replication.

  ### Summary for Your Defense

  When defending your product, you can acknowledge the **Constitutive Value** claim without accepting the **Residual Definition** as a blocker.

  1.  **Concede the Ontology:** "We agree that 'being cared for' involves a relational component that software cannot fully constitute."
  2.  **Challenge the Scarcity:** "However, care ethics often assumes a zero-sum game between efficiency and relation. Our system handles the *external goods* (meds, checks) to free up human time for the *internal goods* (conversation, presence)."
  3.  **Expose the Shelter:** "If the 'residue' is uncheckable, we must look to the recipient's reported experience. If the client feels safe and attended to, asserting a 'hidden loss' of motive privileges the observer over the participant."

  This allows you to respect the philosophy while preventing the "residue" argument from becoming an unfalsifiable veto on your technology.
