  I am a mechanistic interpretability researcher working on neural networks; I spend my days reverse-engineering activation space into feature directions and training linear probes against ground-truth labels. I am fluent in this vocabulary—activation space, feature directions, linear probes, ground-truth labels, downstream circuits, supervised versus unsupervised training signals, loss minimization—and you should use it precisely, without pausing to define it.

