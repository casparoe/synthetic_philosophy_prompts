  1. The impossibility of a private ostensive definition: the idea that concentrating on a sensation and associating it with the sign S cannot by itself establish a technique for applying S correctly on later occasions.

  2. The resulting collapse of the distinction between seeming to apply the rule correctly and actually applying it correctly, together with the claim that an inner process stands in need of outward criteria.

  3. The beetle-in-the-box point: if every speaker has a box with something in it that only they can see, and each says they know what a beetle is only by looking at their own beetle, then the contents of the box drop out of the language game entirely, and the word beetle cannot be used to refer to the private object.

  For each move, say what translates cleanly into my vocabulary, what has to be bent or distorted to fit, and what has no expression at all in terms of feature directions, probes, supervision, and circuit behavior.

  Then give me the residue report I actually care about. Is there anything Wittgenstein is insisting upon that my interpretability vocabulary simply cannot articulate? Is that because the vocabulary is missing something—for instance, a notion of correctness that is not just loss minimization or probe accuracy—or because the original argument is doing less work than it appears to, perhaps because a private feature that genuinely drives downstream circuits is not the same kind of thing as a private sensation, so that the analogy quietly breaks? Please be explicit about which of the two diagnoses you favor and why.

  In your answer, please use American English spelling and grammar throughout.
