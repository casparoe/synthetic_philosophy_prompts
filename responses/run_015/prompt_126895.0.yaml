          2.  Point 1: Goodhart's Law definition (TA was right).
          3.  Point 2: Adversarial vs. Non-Adversarial (Nuance on intent vs. optimization).
          4.  Point 3: The Secrecy Conclusion (The logic doesn't hold for ML training).
          5.  Closing: How to frame this for the class.

  7.  **Drafting - Section by Section (incorporating American English):**
      *   *Check spellings:* optimize (not optimise), behavior (not behaviour), program (not programme), etc.
      *   *Drafting Point 1:* Goodhart vs. Strathern. Goodhart = economic agents react. Strathern = measure becomes target. ML version = overfitting. The post mixes them.
      *   *Drafting Point 2:* "Non-adversarial." The model doesn't have intent, but the *optimizer* is aggressive. It's "optimization pressure," not "malice." But calling it non-adversarial ignores that the training loop is searching for loopholes.
      *   *Drafting Point 3:* Secrecy. If I train a model to maximize Reward Model X, it will break Reward Model X even if X is secret. Secrecy stops *users* from hacking, not the *training* from overfitting.
