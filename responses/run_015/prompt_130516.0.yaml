answer: |-
  **MEMORANDUM**

  **TO:** Heritage and Secularism Review Board
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Restoration Grant for Mill Road Chapel

  **1. Purpose**

  This memo outlines my recommendation regarding the emergency restoration grant for the Mill Road Chapel. As you know, the building is municipally owned and currently functions as a public chamber music venue. However, the roof requires immediate repair, and approximately 80% of the necessary funding would be drawn from the "Religious Heritage" stream of our pilot dual-stream tax.

  After reviewing the submissions and hearing testimony from both sides, I recommend we **APPROVE THE GRANT WITH CONDITIONS.**

  Specifically, I propose we authorize the roof repairs immediately to prevent structural collapse, but attach a binding condition requiring the City to resolve the status of the consecrated altar within 12 months.

  **2. The Core Conflict: Neutrality vs. Discrimination**

  The Board is divided between two principled positions. To move forward, we must acknowledge that both sides are identifying a genuine risk to our secular mandate.

  Those arguing for **rejection** are not merely citing technicalities; they are raising a substantive concern about state endorsement. Their strongest argument is that municipal ownership changes the calculus. If a private owner were repairing a chapel, state neutrality would simply mean non-interference. But *we* own this building. When the City maintains a consecrated altar—even in a back room, even unused—we are effectively curating a religious space. The argument that "nobody uses it for worship" ignores the theological reality that consecration is not dependent on attendance. By preserving the altar with public funds, we are not just preserving wood and stone; we are maintaining the *capacity* for worship within a city asset. This creates a perception that the City is a custodian of religious infrastructure, which blurs the line of state neutrality.

  However, the argument for **approval** holds significant weight regarding equity and heritage. To deny funding solely because the building's original designation was religious would be to penalize the "Religious Heritage" taxpayers whose contributions specifically fund this pool. Furthermore, the building's primary function is now secular (arts/culture). If we reject this grant, we are effectively saying that a building's past religious use permanently disqualifies it from public support, even when it serves a secular public good today. That is not neutrality; that is discrimination based on origin.

  **3. The "Inactive Sacred Infrastructure" Problem**

  The middle argument—that we treat the altar as a museum artifact—highlights a gap in our current bylaws. We have no category for "inactive sacred infrastructure." We treat buildings as either active places of worship (private) or secular venues (public). The Mill Road Chapel is a hybrid: a public venue containing a private theological boundary.

  We cannot vote on this chapel without creating a precedent for how we handle this category. If we approve the grant without addressing the altar, we validate the idea that the City can indefinitely maintain religious fixtures as "decor." If we reject the grant, we risk the loss of a heritage building. The solution is to approve the preservation of the *structure* while mandating the secularization or formal museum designation of the *fixture*.

  **4. Analysis of the Dual-Stream Tax Model**

  We must also be honest about the funding mechanism itself. The "dual-stream" tax was piloted to solve the church-state entanglement problem by outsourcing the moral choice to the taxpayer. The theory is that if residents choose where their money goes, the City is merely a neutral administrator.

  In practice, this model does not solve the entanglement problem; it moves it one step back. It shifts the burden of defining "religious heritage" from the state to the individual, but the state still must collect, categorize, and distribute those funds based on those definitions. By administering this pool, the City is still required to determine what qualifies as "religious heritage" versus "secular arts."

  In the case of the Mill Road Chapel, the tax model complicates matters. It creates a financial incentive for us to categorize the chapel as "heritage" to utilize the surplus in that fund, potentially pressuring us to downplay the "religious" nature of the altar to fit the grant criteria. We must ensure our decision is based on secularism principles, not on the need to balance the ledger of the tax pilot.

  **5. Recommendation and Conditions**

  I recommend we **APPROVE** the grant for roof restoration, subject to the following conditions regarding the altar:

  *   **Timeline:** The City Manager's office must submit a plan for the altar's status within 12 months of grant disbursement.
  *   **Options for Resolution:** The plan must choose one of three paths:
      1.  **Formal Deconsecration:** Engage the relevant religious authority to formally deconsecrate the altar, rendering it a historical object without theological status.
      2.  **Museum Designation:** Formally classify the altar as a protected artifact under our heritage bylaws, removing it from any potential liturgical use and treating it strictly as an educational exhibit (with appropriate signage explaining its history).
      3.  **Relocation/Modification:** If neither of the above is possible, the altar must be physically altered or moved to a non-public area to ensure City funds are not maintaining a functional religious station.
  *   **Interim Status:** During the 12-month period, the room containing the altar shall remain closed to the general public, accessible only by guided tour with historical context provided.

  **6. Conclusion**

  Approving this grant with conditions allows us to save a heritage asset and honor the intent of the taxpayer-funded pool without compromising our commitment to state neutrality. It acknowledges that while we cannot erase the history of the building, we cannot indefinitely maintain the theological infrastructure of a religion we do not endorse.

  This approach respects the taxpayers who funded the "Religious Heritage" stream by preserving the building they value, while respecting the secular mandate of the City by ensuring the building's future use is unambiguously public and cultural.

  I look forward to discussing this framework at Tuesday's vote.
