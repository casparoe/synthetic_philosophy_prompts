answer: |-
  # Teaching Plan: Feeling Benacerraf's Dilemma
  **Time:** 40 Minutes
  **Audience:** Lit Grad Students (High verbal intelligence, low metaphysics exposure)
  **Goal:** Move from "Math is weird" to "I see why both solutions fail."

  ## 1. The Anchor Analogy (Setup: 0–5 mins)
  **Do not start with definitions.** Start with the scenario. This analogy must carry the weight of the entire session.

  **The Scenario: "The Sealed Room Map"**
  *   **The Setup:** Imagine you are born and live your entire life in a perfectly sealed room. No windows, no doors, no mail slots.
  *   **The Object:** On the wall is a Map. It is incredibly detailed. It shows mountains, rivers, and cities.
  *   **The Verification:** Somehow, you have a way to verify that the Map is *true*. Every time you run a simulation in the room based on the Map's topography, the results are consistent. The Map works perfectly.
  *   **The Claim:** You want to say, "This Map describes a real Territory."

  **Instructor Note:** Draw this on the board. *Room, Map, Territory (outside).* Do not mention "Math" yet. Let them accept the intuition: If the Map is accurate, there *must* be a Territory.

  ## 2. Horn One: The Semantic Commitment (5–12 mins)
  **Goal:** Establish why we can't just say "The Map is a fiction."
  **Lit Student Trap:** They will want to say the Map is "true within the narrative of the room."

  *   **The Move:** Ask them: "If I say 'There is a mountain on this map,' am I making a claim about the paper, or the world?"
  *   **The Pressure:** If the Map is *true*, the terms ("Mountain," "River") must refer to something. If they refer only to ink on paper, the statement is trivial. If they refer to the world, the statement is substantive.
  *   **The Math Translation:** Reveal the analogy.
      *   The Room = The Human Mind/Physical Universe.
      *   The Map = Mathematical Propositions (e.g., "There is a prime number between 10 and 15").
      *   The Territory = Mathematical Objects (Numbers, Sets).
  *   **The Point:** We treat math like the Map. We say "It is *true* that primes exist." We don't say "It is *useful to pretend* primes exist." If it's true, it refers. If it refers, there is a Territory (Platonism).

  **Intervention (Misconception: Abstract = Imaginary):**
  *   *Anticipate:* "So numbers are just ideas in our head?"
  *   *Shut it down:* "If numbers are just ideas, then '2 + 2 = 4' is a psychological fact about humans, not a fact about quantity. If aliens exist, would their math match ours? If yes, the Map isn't just in your head. The Territory is external."

  ## 3. Horn Two: The Epistemic Wall (12–20 mins)
  **Goal:** Make them feel the impossibility of knowing the Territory.
  **Lit Student Trap:** They will think "Causal Contact" means "Physically Touching."

  *   **The Move:** Return to the Sealed Room. "You have never left the room. No signal enters the room. No light, no air, no radio waves."
  *   **The Question:** "How did the ink get on the paper to match the mountains outside?"
  *   **The Causal Theory of Knowledge:** Briefly define this. To know $X$, there must be a causal chain connecting you to $X$. (You see the chair because light bounces off it. You know history because documents were passed down).
  *   **The Math Translation:**
      *   Numbers are Abstract (by definition: outside space/time).
      *   Humans are Physical (inside space/time).
      *   **The Tension:** If Numbers are outside space/time, they cannot emit light, push atoms, or send signals. There is no causal chain.
      *   **The Dilemma:** If the Map is accurate (Horn 1), there is a Territory. But if there is a Territory, you shouldn't be able to draw the Map (Horn 2).

  **Intervention (Misconception: Causal = Touching):**
  *   *Anticipate:* "I don't touch gravity, but I know it."
  *   *Shut it down:* "Gravity affects physical things (apples fall). Numbers do not *do* anything. A prime number doesn't push an atom. If they have no causal power, how does your brain state change to match them?"

  ## 4. The Off-Piste Injection: The Computer Proof-Checker (20–30 mins)
  **Goal:** Use technology to isolate the "Symbol vs. Object" problem.

  *   **The Setup:** Place a Computer inside the Sealed Room. The computer runs a proof-checker. It verifies that "There are infinite primes."
  *   **The Question:** "Does the computer have causal access to the Numbers, or just the Symbols?"
  *   **The Discussion:**
      *   *Option A:* Just symbols. It's moving electrons based on syntax (shape of marks). It doesn't "know" what primes are.
      *   *Option B:* If it knows, how? It has no sensors for abstract objects.
  *   **The Trap for Humans:** "We are just biological computers." If the silicon chip can't grasp the Territory without a sensor, how does the biological brain do it?
  *   **The Squeeze:** If you say the computer is just manipulating symbols, you admit math is syntax (Nominalism). But then, why is the syntax so universally applicable to physics? If you say the computer *does* access the objects, you are claiming a magical sensor exists in silicon.

  **Instructor Note:** This is where they should feel the headache. The computer makes the "brain as a receiver" theory look absurd.

  ## 5. The Check: "Pick Your Poison" (30–35 mins)
  **Goal:** Verify they understand the *conflict*, not just the definitions.
  **Do NOT ask:** "What is Benacerraf's Dilemma?" (They will recite a definition).

  **DO ask:** "I want you to solve the Sealed Room problem. You have two choices. Raise your hand for A or B."

  *   **Choice A:** Burn the Map. Admit there is no Territory. Math is just a game we play with ink (Nominalism).
      *   *Follow-up:* "Then why does the Map predict physics so perfectly? Is it a miracle?"
  *   **Choice B:** Keep the Territory. Admit there is a magical, unexplainable link between the Room and the Outside (Platonism).
      *   *Follow-up:* "Then how do we distinguish knowledge from lucky guessing? What breaks the 'no causal contact' rule?"

  **Success Criterion:** They grasp the dilemma if they hesitate. If they immediately say "It's just a social construct," they missed Horn 1. If they say "We just intuit it," they missed Horn 2. You want them to say, "I want A, but B is tempting, and both suck."

  ## 6. The "Do Not Cross" Line (35–40 mins)
  **Goal:** Prevent the seminar from collapsing into technical weeds.

  **Explicitly state:**
  "I am going to stop us here. I am **not** going to explain two things, and you should not look them up before next week:"

  1.  **The Identification Problem:** "Benacerraf also argues that even if numbers *did* exist, we can't say *which* sets they are (Is 3 = {∅, {∅}, {{∅}}}? Or something else?). That is a separate problem about *identity*, not *access*. Don't conflate them."
  2.  **Field's Error Theory:** "Hartry Field tried to solve this by saying math is a 'useful fiction.' That is a solution. Today was about the *problem*. If you solve it too fast, you haven't felt the tension."

  **Closing Instruction:**
  "Your reading for next week is Field. As you read, ask yourself: Does his solution save the Map, or does he admit the Room is all there is? Dismissed."

  ---

  ## Instructor Cheat-Sheet: Managing the Arc

  | Time | Phase | Key Question to Ask | Misconception to Head Off |
  | :--- | :--- | :--- | :--- |
  | **0-5** | **Analogy** | "If the Map works, is there a Territory?" | Don't let them say "The Map creates the Territory." |
  | **5-12** | **Horn 1** | "Does '2+2=4' describe our brains or the world?" | **Abstract ≠ Imaginary.** Abstract means "not in space/time," not "fake." |
  | **12-20** | **Horn 2** | "How does the ink know the mountain shape?" | **Causal ≠ Touching.** Causal means "information transfer." |
  | **20-30** | **Computer** | "Does the chip know the number, or the shape?" | Don't let them anthropomorphize the computer. |
  | **30-35** | **Check** | "Which poison do you pick? A or B?" | If they choose easily, push harder on the downside. |
  | **35-40** | **Close** | "What am I refusing to explain?" | Keep them away from Field/Identification for now. |

  ## Why This Order Works for Lit Students
  1.  **Textual Analogy:** The Map/Room scenario treats math as a text to be interpreted, which aligns with their training.
  2.  **Epistemic Focus:** Lit students are used to questioning *narrators* and *access to truth*. Framing Benacerraf as "How does the narrator (human) know this story (math)?" resonates better than "What is the ontology of sets?"
  3.  **The Computer:** It removes the "soul" or "intuition" variable. If a machine can't do it, the "human spirit" argument fails, forcing the metaphysical crisis.
