answer: |-
  **MEMORANDUM OF PROCEDURE: ALGORITHMIC HARM AUDIT (AHA-1)**

  **To:** Members of the Clinical Ethics Committee
  **From:** The Chair
  **Subject:** Operational Protocol for Adjudicating Harm Involving Clinical Decision-Support Systems

  **1. PURPOSE AND SCOPE**
  This document provides a mandatory diagnostic sequence for cases involving harm where a semi-autonomous Clinical Decision-Support System (CDSS) was active. It is designed to be completed in under forty-five minutes. It translates philosophical concepts of responsibility into binary operational tests. It does not determine legal liability, but rather assigns *moral accountability* to guide institutional remediation.

  **2. PRE-AUDIT DEFINITIONS**
  To ensure consistency, all members must apply the following definitions:
  *   **Causal Contribution:** The specific action or omission that directly precipitated the harm.
  *   **Normative Competence:** The agent's capacity to understand the moral and clinical reasons for acting differently at the time of the event.
  *   **Institutional Authorisation:** The formal permission granted by the hospital for an agent (human or software) to execute a specific class of decisions.
  *   **The Collapse Condition:** A state where the clinician's cognitive processing is so aligned with the algorithm that their judgement and the system's output are functionally indistinguishable (e.g., automation bias).

  ***

  **3. THE DIAGNOSTIC SEQUENCE**

  Proceed through the following questions in order. Do not skip steps. Record the answer and the evidence cited.

  **Question 1: The Control Test (Causal Contribution)**
  *Ask:* At the precise moment the harmful action was executed, did the clinician possess the technical and procedural ability to prevent the action without breaching another safety protocol?
  *   **If YES:** Proceed to Question 2.
  *   **If NO:** Stop. **Primary Responsibility lies with the Institution/Developer.** The clinician was structurally barred from intervening. This is a design failure, not a clinical error.
  *   **Evidence Required:** Log files, interface screenshots, or witness testimony confirming the 'override' button was either absent, disabled, or locked by higher-level protocol.

  **Question 2: The Comprehension Test (Normative Competence)**
  *Ask:* Could the clinician, given the information displayed by the system at the time, have understood *why* the recommendation was made and evaluated its clinical validity?
  *   **If YES:** Proceed to Question 3.
  *   **If NO:** Stop. **Declare a Responsibility Gap.** The system operated as a 'black box' relative to the clinician's expertise. The clinician lacked the normative competence to judge the tool. Accountability shifts to the Committee for collective institutional judgement (see Section 5).
  *   **Evidence Required:** System explanation logs, clinician training records, complexity of the variable set involved.

  **Question 3: The Deviation Test (Causal Contribution)**
  *Ask:* Did the clinician's final action deviate from the system's recommendation?
  *   **If YES (Clinician Overrode System):** Proceed to Question 4.
  *   **If NO (Clinician Followed System):** Proceed to Question 5.
  *   **If PARTIAL (Clinician Adapted System):** Treat as 'Followed' for the purpose of this audit unless the adaptation was the sole cause of harm.

  **Question 4: The Justification Test (Normative Competence)**
  *Ask:* Is there documented evidence that the clinician's override was based on verifiable clinical data or patient-specific factors not captured by the system?
  *   **If YES:** Stop. **No Accountability for Harm.** The clinician exercised valid professional judgement. The harm is an unfortunate outcome of correct practice.
  *   **If NO:** Stop. **Primary Responsibility lies with the Clinician.** The override was arbitrary or negligent.
  *   **Evidence Required:** Clinical notes made at the time of the event. Retrospective justification does not count.

  **Question 5: The Dependency Test (Collapse Condition)**
  *Ask:* Is there evidence that the clinician deferred to the system not because they agreed with it, but because they assumed the system possessed superior knowledge they could not verify (Automation Bias)?
  *   **If YES:** Stop. **Declare a Responsibility Gap.** This is a Collapse Condition. The clinician's agency was compromised by the system's authority. Accountability shifts to the Committee for collective institutional judgement.
  *   **If NO:** Proceed to Question 6.
  *   **Evidence Required:** Testimony regarding workload, fatigue, or known culture of deference to the specific tool.

  **Question 6: The Authorisation Test (Institutional Authorisation)**
  *Ask:* Was the CDSS deployed in this specific clinical context with formal validation and approval by the Hospital Trust?
  *   **If YES:** Stop. **Shared Responsibility (Clinician and Institution).** The clinician failed the duty of care (by failing Question 2 or 5 implicitly), but the Institution authorised a risky workflow.
  *   **If NO:** Stop. **Primary Responsibility lies with the Clinician/Lead Consultant.** The use of an unauthorised tool is a breach of protocol.

  ***

  **4. STOP-POINT SUMMARY**

  *   **Clinician Responsible:** Q1 (Yes) → Q2 (Yes) → Q3 (Yes/Override) → Q4 (No). OR Q1 (Yes) → Q2 (Yes) → Q3 (No/Followed) → Q5 (No) → Q6 (No).
  *   **Institution/Developer Responsible:** Q1 (No).
  *   **Responsibility Gap (Committee Judgement Required):** Q2 (No) OR Q5 (Yes).
  *   **Shared Responsibility:** Q1 (Yes) → Q2 (Yes) → Q3 (No/Followed) → Q5 (No) → Q6 (Yes).

  ***

  **5. WORKED APPLICATIONS**

  The following scenarios demonstrate the application of the AHA-1 protocol.

  **Case A: The Disregarded Alert (Override)**
  *Scenario:* A sepsis prediction algorithm flags a patient as high risk and recommends immediate blood cultures. The attending physician, citing a lack of physical symptoms, overrides the alert and delays cultures. The patient deteriorates.
  *   **Q1 (Control):** Did the physician have the ability to order cultures? **Yes.**
  *   **Q2 (Comprehension):** Did the physician understand the alert? **Yes** (The alert displayed clear vitals).
  *   **Q3 (Deviation):** Did they deviate? **Yes** (Overrode recommendation).
  *   **Q4 (Justification):** Was there documented data supporting the override? **No** (Notes stated 'looks well' without recording specific contradictory vitals).
  *   **Outcome:** **Primary Responsibility lies with the Clinician.**
  *   **Reasoning:** The clinician retained control, possessed competence, and failed to provide a valid clinical justification for disregarding a safety mechanism.

  **Case B: The Uncritical Acceptance (Blind Adoption)**
  *Scenario:* A dosing calculator suggests a renal medication dose. The algorithm fails to account for a recent acute kidney injury noted in the notes. The clinician accepts the dose without checking the renal function tab. The patient suffers toxicity.
  *   **Q1 (Control):** Could the clinician have checked renal function? **Yes.**
  *   **Q2 (Comprehension):** Could they understand the dose calculation? **Yes** (Standard formula).
  *   **Q3 (Deviation):** Did they deviate? **No** (Followed recommendation).
  *   **Q5 (Dependency):** Did they defer due to assumed superiority? **Yes** (Testimony reveals clinician assumes 'the computer checks the labs').
  *   **Outcome:** **Declare a Responsibility Gap.**
  *   **Reasoning:** While the clinician was negligent, the procedure identifies a Collapse Condition (Q5). The clinician's normative competence was bypassed by reliance on the tool. This requires Committee judgement on whether to treat this as individual negligence or a systemic training failure regarding tool reliance.

  **Case C: The Opaque Black Box (No Override)**
  *Scenario:* A triage algorithm downgrades a patient's urgency based on hidden variables. The clinician wishes to upgrade the urgency but the interface locks the triage category once the algorithm processes it, requiring a senior administrator's code to change. The administrator is unavailable. The patient waits and suffers harm.
  *   **Q1 (Control):** Did the clinician possess the ability to prevent the action (the low triage)? **No.**
  *   **Outcome:** **Primary Responsibility lies with the Institution/Developer.**
  *   **Reasoning:** The procedure halts immediately at Q1. The clinician was structurally barred from exercising moral agency. The harm is a direct result of institutional workflow design.

  ***

  **6. LIMITATIONS AND DELIBERATIVE BOUNDARIES**

  Committee members must recognise where this procedure ceases to function and human deliberation must begin.

  **1. The Misfire of 'Competence' (Question 2)**
  This procedure assumes 'understanding' is binary. In reality, understanding is graded. A clinician may understand *what* the system recommends but not *how*. If the Committee feels the distinction between 'what' and 'how' is critical to the harm, the AHA-1 result should be treated as advisory only. You must deliberate on whether the level of understanding provided was *sufficient* for the risk level of the decision. This is a value judgement that cannot be proceduralised.

  **2. The Collapse Condition Ambiguity (Question 5)**
  Question 5 identifies the Collapse Condition, but it does not solve it. Declaring a 'Responsibility Gap' is not an acquittal; it is a transfer of burden. When the procedure stops here, the Committee must decide whether the 'Gap' is filled by the Institution (for allowing a coercive tool) or the Clinician (for surrendering judgement). The procedure flags the problem; it does not assign the penalty. This requires moral deliberation on the culture of the ward.

  **3. Systemic vs. Individual Culpability**
  The AHA-1 focuses on the immediate event. It may assign responsibility to a clinician even if they are working under unsafe staffing levels that made checking the system impossible. If a member argues that 'Control' (Q1) was theoretically present but practically impossible due to resource constraints, the procedure has misfired. You must pause the audit and deliberate on systemic resource allocation.

  **4. The 'Shared Responsibility' Trap**
  When the outcome is 'Shared Responsibility' (Case B variant where Q5 is No), there is a risk of diluting accountability so that no one is held to account. The Committee must explicitly decide the ratio of remediation. Does the Institution update the software, or does the Clinician undergo retraining? The procedure identifies the overlap; it does not weight the contribution.

  **7. FINAL INSTRUCTION**
  If the procedure concludes with a **Responsibility Gap**, the Committee Chair must draft a finding of 'Structural Accountability.' This finding acknowledges that while harm occurred, no single moral agent was fully capable of preventing it. The remedy must therefore be structural (policy change, tool withdrawal, or redesign) rather than punitive (reprimand or dismissal).

  This procedure is to be reviewed annually. Any case where the Committee unanimously feels the AHA-1 outcome is morally counter-intuitive must be logged as an exception to refine future iterations.
