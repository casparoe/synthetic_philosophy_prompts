answer: |-
  The deadlock you describe is not merely a verbal dispute, nor is it likely to be resolved by further empirical accumulation. It is fundamentally a **category error regarding the relationship between genealogy and justification**. While the prompt offers three diagnostic options, the most accurate diagnosis is the third: **the sides are answering two different questions (cognitive architecture vs. moral epistemology) while using the phrase "what the psychology tells us" to cover both.** However, this diagnostic insight alone does not produce progress. Genuine progress requires a **conceptual distinction** (the first option) that explicitly demonstrates why the framing question is **ill-posed** (the third option) in its current form.

  ### Diagnosis: The Conflation of Genealogy and Justification

  The persistence of the dispute stems from a tacit disagreement about the **epistemic authority of evolutionary history**.

  **Proponents** of Moral Foundations Theory (MFT) often rely on a form of *evolutionary vindication*. By demonstrating that the five foundations are cross-culturally stable, heritable, and linked to specific neural patterns, they imply that these intuitions are "adaptive." In their framework, "adaptive" often slides into "functionally necessary for social cohesion," which is then subtly transmuted into a normative claim: if conservatives utilize all five foundations and liberals only two, conservatives possess a more "complete" moral matrix. For proponents, the psychological *reality* of the foundation is evidence of its moral *utility*.

  **Critics** rely on *evolutionary debunking*. They argue that evolutionary selection tracks reproductive fitness and group cohesion, not moral truth. A universal intuition (e.g., purity/sanctity regarding caste or gender) can be both psychologically real and morally abhorrent. For critics, the psychological *origin* of a belief is irrelevant to its *validity*.

  Consequently, when proponents say MFT reveals something normative, they mean **"normatively functional for group survival."** When critics deny this, they mean **"normatively justified in terms of impartial moral truth."** They are talking past one another because one side is describing a **sociological technology** (how groups hold together) while the other is evaluating a **philosophical claim** (what is right). The empirical literature cannot adjudicate this because no amount of data on neural activation or cross-national survey weights can bridge the is-ought gap.

  ### Why Empirical Results Will Not Break the Deadlock

  A new empirical result regarding the malleability or context-dependence of foundation weights (the second option for progress) would likely fail to resolve the dispute.
  *   If new data showed foundations are highly malleable, proponents could argue this proves cultural learning shapes evolved potentials, while critics would claim it proves the foundations lack deep normative weight.
  *   If new data showed foundations are rigid, proponents would claim this proves their biological necessity, while critics would argue this proves they are entrenched biases resistant to moral progress.

  Because the disagreement is meta-ethical rather than psychological, adding more descriptive data only provides more ammunition for both sides to reinforce their pre-existing interpretations of the is-ought boundary.

  ### The Path to Genuine Progress

  Genuine progress requires a **conceptual distinction** that cleanly separates causal explanation from normative justification, specifically by reframing the normative claim itself. The field must move away from asking whether MFT reveals *moral truth* and toward asking whether it reveals *moral constraints*.

  **1. Distinguishing "Moral Ontology" from "Moral Sociology"**
  Progress depends on explicitly categorizing MFT as a theory of **moral sociology** (how moral beliefs are generated and sustained) rather than **moral ontology** (what makes moral beliefs true).
  *   **Proponents** must concede that evolutionary ubiquity is not a proxy for moral authority. A foundation can be "real" without being "right."
  *   **Critics** must concede that while psychology doesn't dictate truth, it dictates **feasibility**. If human cognition is structured by these five channels, a moral system that ignores three of them may be psychologically unsustainable, even if it is philosophically superior.

  **2. Reframing the Question as Ill-Posed**
  The question "Does MFT reveal anything normative?" is ill-posed because it assumes normativity is a property that can be *discovered* in cognitive architecture. Normativity is a property of *reasons*, not *mechanisms*.
  *   **Progressive Step:** The debate should shift from **justification** to **reflective equilibrium**. The question should not be "Are the binding foundations (Loyalty, Authority, Sanctity) morally valid?" but rather "How do we negotiate the tension between our evolved intuitions (including the binding foundations) and our reasoned moral principles?"

  **3. The "Functional Pragmatism" Compromise**
  The most productive conceptual distinction would be to treat the foundations not as sources of moral truth, but as **variables in a design problem**.
  *   Instead of arguing over whether Authority is *good*, researchers could investigate under what specific ecological or economic conditions the Authority foundation correlates with human flourishing versus oppression.
  *   This moves the debate from **essentialism** (Is this foundation part of the moral truth?) to **instrumentalism** (Does invoking this foundation produce better outcomes in this context?).

  ### Conclusion

  The deadlock persists because proponents treat MFT as a **vindication** of conservative intuition (implying normative weight) while critics treat it as a **description** of bias (implying normative irrelevance). Genuine progress will not come from more data, but from a conceptual shift that admits the framing question is ill-posed. Psychology cannot tell us what is *right*, but it can tell us what is *possible*. A mature synthesis would accept that while the five foundations do not possess inherent moral authority, they represent the **cognitive interface** through which any moral system must be implemented. Progress lies in studying the friction between that interface and our ethical ideals, rather than mistaking the interface for the ideal itself.
