      *   **Proponents (Haidt et al.):** MFT shows conservatives use all 5 foundations, liberals mostly Care/Fairness. This is "natural," evolved, and explains why liberals don't understand conservatives. There's a hint of normative pluralism here (i.e., the other foundations *matter* for a functioning society, even if liberals ignore them). They often slide from "this is how we are built" to "this is why we should respect these intuitions."
      *   **Critics (Suhler, Churchland, Kelly, etc.):** Even if these intuitions are evolved, they could be maladaptive now or morally wrong (e.g., authority/sanctity underpinning oppression). Descriptive psychology $\neq$ Normative ethics. The "dumbfounding" shows lack of reasoning, not deep wisdom.

