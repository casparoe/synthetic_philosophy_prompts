answer: |-
  **Maya:** Look at this pilot app. The Dean's office posts point prices for dorm swaps, 3D-printer time, and TA hours every morning, students report what they want, and the system adjusts overnight. Tomas, this is exactly what Oskar Lange predicted. The planning board mimics the market through trial and error without anyone actually owning the means of production.

  **Tomas:** It is pretty elegant. If there's a shortage of printer time, the points go up; if there's a surplus of TA hours, they go down. Mises argued you couldn't calculate value without private property, but this app clears the market every night using nothing but provisional prices and student reports.

  **Maya:** It clears the *reported* demand, but that's not the same as capturing value. Hayek's point wasn't just about solving equations; it was about knowledge. When I bid for a dorm swap, the price I'm willing to pay conveys tacit knowledge about my urgency—maybe I have a medical issue, maybe I just want a better view. The app sees a number, not the context that makes the number meaningful.

  **Tomas:** But the context doesn't matter for allocation, only the intensity of preference does. Whether you need the bed for medical reasons or comfort, your willingness to spend points tells the planner how much you value it. With modern computers, the planning board can process those preferences faster than any messy negotiation between students could.

  **Maya:** Speed isn't knowledge. Computers process data, but they don't discover new uses. What happens when someone figures out a way to use the 3D printers for a startup prototype that the Dean's office didn't code for? In a market, I just pay the price and use the machine. In your app, I have to wait for the planner to recognize that category exists.

  **Tomas:** We can update the categories. But even if we miss a use case, the trial-and-error mechanism still works for the goods we do track. You're assuming the planners are static, but Lange's model implies they learn. If students start hoarding points for printer time to resell favors, the office sees the shortage and adjusts. The feedback loop is there.

  **Maya:** That's where the incentives break down. In a real market, if I hoard resources, I risk my own capital. Here, the points are free allocations. Why wouldn't I inflate my demand for TA hours to drive up the "price" for my rivals, knowing I lose nothing if the system crashes? Mises argued that without skin in the game, the data fed to the planner is inevitably strategic, not truthful.

  **Tomas:** Students still want the goods, though. If I lie about wanting TA hours, I might get charged points I need for a dorm swap. The constraint is real enough to enforce honesty. And even if there's some gaming, the computer can detect patterns faster than a human market corrects itself. You're dismissing the tech solution to the calculation problem.

  **Maya:** The tech solves the arithmetic, not the epistemic problem. The market isn't just a calculator; it's a discovery procedure. By fixing the categories—beds, printers, hours—you've frozen innovation. If a better way to allocate office hours emerges, like a peer-tutoring black market, your app treats it as an error rather than an improvement.

  **Tomas:** But for a university setting, stability is preferable to chaotic innovation. The app ensures everyone gets access based on a rule, not on who has the most cash or the best connections. It proves Lange's core thesis: you can simulate the efficiency of prices for specific goods without full capitalist property rights, provided you have the data processing power.

  **Maya:** It proves you can simulate the *appearance* of prices for static goods. But as soon as the environment changes—new tech, new student needs—the lack of genuine ownership means there's no one empowered to innovate around the constraint. The app works because the stakes are low; scale it to the whole economy, and the friction of false data and stifled discovery becomes catastrophic.

  **Tomas:** Maybe so for the whole economy, but for campus goods, the trial-and-error loop is tight enough that the friction doesn't matter. We're getting the beds swapped and the printers running without a black market dominating the process. That's a practical victory for the planning model, even if it's not a universal one.

