  4.  **Evaluate the User's Hunches:**

      *   *Hunch 1: Unit of Account is upstream of Enforcement.*
          *   *Argument For:* You can't enforce a contract if you can't define the obligation. If the "currency" is undefined, "breach" is undefined.
