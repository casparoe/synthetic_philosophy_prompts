answer: |-
  This is a high-stakes design problem. You are correct that organizing around application areas (e.g., "global health vs. arts funding") is premature. If the conceptual architecture of moral trade is flawed, application-specific models will be elegant but vacuous. However, to secure the economists' buy-in and satisfy the funder's demand for concrete allocation changes, the call cannot be purely metaphysical. It must be framed as **foundational mechanism design**.

  Below is the defended ordering for the call, the criteria used to derive it, an assessment of your hunches, the missing critical question, and the falsification test for the programme itself.

  ### I. Evaluation Criteria and Weights

  To order the questions, I have applied four criteria. The weights reflect the funder's specific remit (institutional change) and the constraints of the team (philosophy/decision theory lead, economics partners).

  1.  **Upstream Dependency (35%):** Does answering this question determine whether the other questions are coherent? If Question A is unsolved, is Question B meaningless?
  2.  **Institutional Impact (30%):** If solved, does this directly change how a funder decides to allocate? (e.g., "Do not trade" is a concrete allocation decision).
  3.  **Comparative Advantage (20%):** Is this a question where philosophy/decision theory adds value distinct from standard game theory? (This justifies your share of the budget to the economists).
  4.  **Tractability (15%):** Can four postdocs make meaningful progress in three years?

  *Conflict Note:* High Upstream Dependency often correlates with Low Tractability (hard conceptual problems). High Institutional Impact often correlates with Low Comparative Advantage (economists can model incentives). The ordering below prioritizes **Upstream Dependency** and **Comparative Advantage**, because if the concept is incoherent, impact is zero, and if economists can solve it alone, you do not need this programme.

  ### II. The Defended Ordering of the Call

  The call should be structured into four Work Packages (WPs). This ordering moves from the possibility of trade, to the stability of the traders, to the systemic effects, and finally to the mechanics.

  #### WP1: The Metric and Limits of Exchange (Unit of Account + Alienability)
  *   **Priority:** 1 (Foundational)
  *   **Rationale:** This is the most upstream question. You cannot enforce a contract (Enforcement) if you cannot define the obligation (Unit of Account). More critically, you cannot define the obligation if the moral good in question is **inalienable**.
  *   **Philosophy vs. Economics:** Economists assume preferences are tradable. Philosophers must determine *which* moral commitments are structurally resistant to trade without self-contradiction. A deontologist who believes "X is forbidden" cannot coherently trade "I will not do X" for "You will do Y," because the prohibition is not a cost to be balanced but a constraint on action.
  *   **Tractability:** High. This is conceptual analysis and formal modeling of normative constraints.
  *   **Funder Impact:** If certain moral views render trade impossible, funders holding those views must be excluded from the mechanism. This is a concrete allocation rule.

  #### WP2: Dynamic Stability and Moral Identity (Endogeneity)
  *   **Priority:** 2 (Critical Risk)
  *   **Rationale:** This is the most significant threat to adoption. If participating in moral trade systematically alters the agents' moral views (e.g., forcing non-consequentialists to reason like consequentialists to find gains from trade), the institution is self-undermining.
  *   **Philosophy vs. Economics:** Economists treat preference change as exogenous or adaptive learning. Philosophers must analyze whether this change constitutes *corruption*, *coercion*, or *refinement*.
  *   **Funder Impact:** If trade corrupts moral integrity, large funders (especially mission-driven ones) will reject it. The programme must produce a "Stability Test" for potential trading partners.
  *   **Tractability:** Medium. Requires modeling iterative games with evolving normative parameters.

  #### WP3: Systemic Rationality and Aggregation (Aggregative Effects)
  *   **Priority:** 3 (Systemic Risk)
  *   **Rationale:** Bilateral rationality does not guarantee global optimality. If moral trade creates negative externalities for non-trading parties (or future parties), states cannot adopt it.
  *   **Philosophy vs. Economics:** Economists excel here (general equilibrium). Philosophers are needed to define the *moral* welfare function of the system. Whose lights are we using to judge if everyone is "worse off"?
  *   **Funder Impact:** Determines whether trade should be centralized (state) or decentralized (private philanthropy).
  *   **Tractability:** High (for the economists), Medium (for the philosophers).

  #### WP4: Mechanisms and Boundaries (Enforcement + Non-Standard Agents)
  *   **Priority:** 4 (Implementation)
  *   **Rationale:** Enforcement is downstream. You only need a mechanism to bind parties once you know *what* they are trading (WP1) and *whether they should* (WP2). Non-standard agents (animals, future people) are boundary cases that depend on the Unit of Account.
  *   **Philosophy vs. Economics:** Mostly Economics/Game Theory (contract design). Philosophy enters on the representation of non-sentient interests.
  *   **Funder Impact:** Operational details.
  *   **Tractability:** High.

  ### III. Assessment of Your Hunches

  **Hunch 1: The Unit-of-Account question is upstream of Enforcement.**
  *   **Verdict:** **Correct, but incomplete.**
  *   **Argument:** You are right that enforcement presupposes a defined obligation. However, the deeper upstream question is **Moral Alienability** (which I have added to WP1). Before we ask "What is the currency?" we must ask "Is this good for sale?"
      *   *Example:* If a traditionalist views a sacred site as having infinite disvalue if developed, no finite amount of consequentialist good can compensate them. The "price" is undefined not because of measurement issues, but because the good is conceptually non-fungible.
      *   *Correction:* If you focus only on the *Unit* (how to measure) without *Alienability* (whether to measure), you will build a pricing model for goods that cannot be priced. The call must explicitly pair these.

  **Hunch 2: Endogeneity is the most surprising implication and most likely to be resisted.**
  *   **Verdict:** **Strongly Correct.**
  *   **Argument:** Proponents of moral trade (often effective altruists or liberal pluralists) assume moral views are fixed inputs. If the programme demonstrates that moral trade acts as a **consequentializing engine**—forcing all participants to adopt a common metric to facilitate exchange, thereby eroding the very pluralism the trade was meant to accommodate—this is a devastating result.
      *   *Why it matters for the funder:* A foundation dedicated to a specific moral mission (e.g., religious charity, rights-based advocacy) cannot participate if participation dissolves their mission.
      *   *Resistance:* This will be resisted because it implies moral trade is not a *modus vivendi* but a *trojan horse* for utilitarianism. This is the most philosophically rich and institutionally dangerous finding you could produce.

  ### IV. The Missing Question: Moral Alienability

  I identified this in WP1, but it deserves explicit mention as a gap in your list.
  *   **The Question:** *Under what conditions is a moral commitment structurally incompatible with being the object of a trade?*
  *   **Why it matters more:** You listed "Unit of Account" (how do we denominate?) and "Trade with Sacred Values" (boundary case). Alienability is the bridge. It asks whether the *structure* of a moral theory (e.g., agent-relative constraints) permits the agent to treat their own compliance as a resource.
  *   **Defence:** If the answer is "Deontological constraints are inalienable," then moral trade is limited to consequentialists and weak deontologists. This shrinks the market size drastically. This is a fundamental parameter for the funder.

  ### V. Philosophy vs. Economics: Defending the Share

  To defend the philosophy budget to your economist colleagues, use this distinction:
  *   **Economics** asks: *Given a set of preferences and a feasible set of trades, what is the equilibrium?*
  *   **Philosophy** asks: *Are the preferences coherent with the act of trading, and does the equilibrium preserve the normative status of the agents?*

  Economists assume the "gain from trade" is defined by the agents' current utility functions. Philosophers must investigate whether the *act of trading* invalidates the utility function (Endogeneity) or whether the utility function prohibits the trade (Alienability). If the philosophers do not do this work, the economists are modeling a system that cannot exist.

  ### VI. Dynamic Dependencies: What Changes the Ranking?

  The ordering above is stable *unless* WP1 yields a negative result.

  1.  **If WP1 (Alienability/Unit) concludes that deep moral disagreement precludes a common metric:**
      *   **Shift:** The entire programme pivots. WP2, 3, and 4 become irrelevant. The research becomes a proof of impossibility.
      *   **New Focus:** "Mechanisms for Allocation under Incommensurability" (e.g., randomization, separation, rather than trade).
      *   **Direction:** WP1 swallows the budget.

  2.  **If WP2 (Endogeneity) shows rapid convergence to consequentialism:**
      *   **Shift:** WP3 (Aggregation) becomes the new Priority 1. If everyone becomes a consequentialist, moral trade collapses into standard cost-benefit analysis.
      *   **Direction:** The "Moral" in Moral Trade drops out. The programme becomes about efficient altruism coordination.

  3.  **If WP4 (Enforcement) shows credible commitment is impossible without a state:**
      *   **Shift:** WP3 (Aggregative Effects) moves up, because only states can internalize the externalities required to enforce the trade.
      *   **Direction:** Focus shifts from philanthropy to public policy.

  ### VII. The Falsification Test for the Programme

  To satisfy the funder's demand for concrete results, you must define what failure looks like. The wager of this programme is that moral trade is a *coherent and stable* mechanism for allocation under disagreement.

  **The Falsification Test:**
  > *If, by the end of Year 2, the programme demonstrates that for any pair of agents holding 'deep' moral disagreements (defined as non-aggregative or agent-relative constraints), the transaction costs of establishing a Unit of Account exceed the expected gains from trade, OR that participation necessitates a violation of at least one agent's core normative constraints (Alienability/Endogeneity), then the hypothesis that 'Moral Trade is a viable allocation mechanism' is falsified.*

  **Why this test?**
  1.  **Concrete:** It gives a binary condition for viability.
  2.  **Protects the Team:** If you prove it *doesn't* work, you have still met the funder's goal (changing how they allocate) by telling them *not* to use this mechanism.
  3.  **Philosophical Weight:** It centers the conceptual questions (Alienability, Commensurability) as the gatekeepers, validating your lead on the agenda.

  ### Summary Recommendation for the Call

  Do not organize by application area. Organize by **structural constraint**.

  1.  **Call Title:** *The Architecture of Moral Exchange: Foundations for Allocation Under Disagreement.*
  2.  **Core Narrative:** "Before we can design markets for moral trade, we must determine if the goods are tradable, if the traders remain themselves, and if the system remains stable."
  3.  **Allocation of Posts:**
      *   **Postdoc 1 (Philosophy):** WP1 (Alienability & Unit of Account).
      *   **Postdoc 2 (Philosophy/Decision Theory):** WP2 (Endogeneity & Identity).
      *   **Postdoc 3 (Economics/Game Theory):** WP3 (Aggregative Effects).
      *   **Postdoc 4 (Economics/Policy):** WP4 (Enforcement & Institutional Design).

  This structure respects your intuition that conceptual clarity is upstream, satisfies the economists by giving them the systemic and mechanical modeling, and directly addresses the funder's goal by establishing the *conditions of possibility* for the intervention. If the conditions fail, you have saved them from a costly error. If they hold, you have built the foundation for a new allocation mechanism.
