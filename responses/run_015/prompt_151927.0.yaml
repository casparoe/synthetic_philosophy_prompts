answer: |-
  You have hit on something extremely precise here. Your observation is essentially a layman's summary of the core problem in post-Gettier epistemology and later Wittgenstein.

  To answer your first question: **No, there isn't a single, catchy Latin term for that specific rhetorical oscillation.** However, there are established philosophical concepts that describe the *mechanism* behind it.

  Here is the breakdown of what you're seeing, the names philosophers give the components, and how to distinguish it from contextualism or dodging.

  ### 1. The Wittgensteinian Answer: "Hinge Propositions"
  You are absolutely right about *On Certainty*. Wittgenstein calls these background assumptions **"hinge propositions"** (or hinge certainties).

  *   **The Metaphor:** A door moves on hinges, but the hinges themselves do not move.
  *   **The Function:** Hinges are not things we *know* (in the empirical sense); they are the framework that allows "knowing" and "doubting" to make sense.
  *   **The Move You Noticed:** When the skeptic asks, "Are you a brain in a vat?", the defender temporarily treats a hinge ("I have hands," "The world exists") as if it were a regular empirical claim that can be proven with evidence.
  *   **The Reversion:** Once the argument ends, the proposition snaps back into being a hinge. It becomes invisible again because you cannot *use* a hinge and *inspect* it at the same time.

  Wittgenstein argues that the skeptic and the defender are both making a category mistake. The skeptic treats the hinge as doubtful; the defender treats the hinge as knowable. Both are wrong. Hinges are **acted upon**, not known.

  ### 2. The Phenomenological Answer: "The Natural Attitude"
  If you want a name for the state of "swimming in the water" without questioning it, Edmund Husserl (the father of phenomenology) called this **"The Natural Attitude."**

  *   **Natural Attitude:** The default mode of human existence where the reality of the world is taken for granted.
  *   **Philosophical Attitude (Epoché):** The moment you "bracket" reality to question it (like the skeptic does).

  The back-and-forth move you are describing is the rapid toggling between the **Natural Attitude** and a defensive **Theoretical Attitude**. When the pressure is off, the philosopher (or the Reddit commenter) collapses back into the Natural Attitude because it is impossible to live in the Philosophical Attitude permanently. You can't buy groceries while doubting the existence of money.

  ### 3. What would we call this specific move?
  Since there isn't a standard term for the *rhetorical oscillation* itself, if you wanted to coin a term or describe it precisely in a paper, you might call it:

  *   **"Hinge Reification":** Treating a framework condition as a concrete object/claim temporarily.
  *   **"The Epistemic Snap-Back":** The return to unexamined certainty after a challenge.
  *   **"Transcendental Pragmatism":** (A bit dense, but accurate). It acknowledges that we defend reality pragmatically to keep the conversation going, not because we have transcendent proof.

  However, the most accurate description of the *error* involved is a **Category Mistake** (Gilbert Ryle). The defender is treating a rule of the game (reality exists) as a move within the game (I see my hands).

  ### 4. How is this different from Contextualism?
  This is a crucial distinction. **Epistemic Contextualism** (e.g., Keith DeRose, David Lewis) is a competing theory that tries to solve skepticism, but it differs from your observation in a key way.

  *   **Contextualism says:** The word "know" changes meaning based on stakes. In low stakes ("Do you know the bank is open?"), the bar is low. In high stakes ("Are you a brain in a vat?"), the bar is impossibly high. So, "I know I have hands" is *true* in conversation A but *false* in conversation B.
  *   **Your Observation (Wittgensteinian) says:** The proposition "I have hands" isn't changing truth value; it is changing **logical role**. In the Natural Attitude, it is not a claim of knowledge at all—it is the *ground* for claims. When the skeptic attacks, the defender mistakenly promotes it to a "claim" to defend it, then demotes it back to "ground" when done.

  **The Difference:** Contextualism says the *standards* shift. You are observing that the *status of the reality* shifts from "object of scrutiny" to "medium of scrutiny."

  ### 5. How is this different from Dodging?
  It is easy to accuse someone of **"Moving the Goalposts"** or **"Special Pleading,"** but those imply bad faith or logical inconsistency.

  *   **Dodging:** "I don't need to prove reality because... uh... look over there!" (Evasion).
  *   **The Hinge Move:** "I am proving reality with my hands because you forced me to treat reality as a hypothesis. Now that you stop asking, I will stop treating it as a hypothesis because I need to live."

  This isn't necessarily dishonest; it's **structural**. As the pragmatist C.S. Peirce argued, doubt is an "irritation" that we seek to resolve to regain belief so we can act. We *must* tuck the assumptions away again to function. If we treated reality as a claim needing constant proof, we would suffer "analysis paralysis" and starve to death.

  ### Summary
  You have identified the tension between **constitutive rules** (the background) and **regulative claims** (the foreground).

  *   **Is there a name?** Not for the oscillation itself, but the components are **Hinge Propositions** (Wittgenstein) and the **Natural Attitude** (Husserl).
  *   **What to call it?** **"Hinge Reification"** describes the moment they treat the background as a claim.
  *   **Why it matters:** It shows that "knowledge" isn't just a stack of proven facts; it's a system where some things must remain unproven for the system to work. The person arguing isn't necessarily being inconsistent; they are switching between "playing the game" and "defending the rules of the game."

  You're basically doing therapeutic philosophy without the tenure. Keep trusting that intuition.
