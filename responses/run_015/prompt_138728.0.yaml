answer: |-
  **UNIVERSITY BEHAVIOURAL RESEARCH ETHICS BOARD (BREB)**
  **MEMORANDUM OF DECISION**

  **TO:** Dr. [Neuroscientist PI Name], Department of Psychology; Dr. [Philosopher Co-PI Name], Department of Philosophy
  **FROM:** University Behavioural Research Ethics Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #2023-492: "Can You Stop Yourself? Real-Time Detection of Movement Preparation and the Limits of Conscious Veto"

  **DECISION:** **APPROVED WITH CONDITIONS**

  **1. PROJECT SUMMARY**
  The proposed study investigates the temporal relationship between neural motor preparation, conscious urge, and the capacity for voluntary veto (cancellation). Arm 1 utilizes EEG and a real-time classifier to trigger auditory cues (veridical or yoked sham) during movement preparation, alongside a cueless late-abort condition. Arm 2 randomizes participants to neutral or "provocative" debriefing scripts regarding the causal efficacy of conscious intention, followed by measures of moral responsibility attribution and pro-social behaviour.

  **2. RATIONALE FOR DECISION**
  The Board recognizes the significant theoretical value of this research. The intersection of cognitive neuroscience and folk psychology regarding agency is a legitimate object of empirical inquiry. However, the protocol as submitted presents unacceptable risks regarding deception, epistemic harm, and the welfare of a captive participant pool (undergraduates seeking course credit). The Board's approval is contingent upon the modification of the debriefing manipulation to distinguish between *scientific data* and *philosophical interpretation*, and the implementation of robust restorative measures.

  **3. SPECIFIC ETHICAL DETERMINATIONS**

  **A. The "Provocative" Debriefing Script**
  *Decision:* The script **may not** assert contested philosophical conclusions as established scientific fact.
  *Reasoning:* The submitted script states that brain activity predicting choice is "evidence that conscious intentions do not cause actions." This presents a metaphysical interpretation (epiphenomenalism/hard determinism) as an empirical finding. While the *data* (readiness potential precedes reported urge) is robust, the *conclusion* (no conscious causation) is fiercely contested within the very departments sponsoring this research. To present this as settled science constitutes deception that exceeds the methodological necessities of the study.
  *Requirement:* The script must be revised to frame the claim as a *prevailing interpretation* or *hypothesis* generated by the data (e.g., "Some researchers interpret these findings to suggest..."), rather than an established fact. The manipulation (inducing doubt) can be preserved without asserting falsehoods about scientific consensus.

  **B. Yoked Sham Tones (Deception)**
  *Decision:* Permissible, subject to consent modification.
  *Reasoning:* The use of yoked shams is methodologically necessary to distinguish genuine veto capacity from reaction to external cues. However, the current consent form describes the study as "timing of voluntary movement." This is insufficient for deception involving physiological feedback.
  *Requirement:* The consent form must explicitly state that participants may receive auditory feedback that does not always correspond to their specific neural activity in real-time.

  **C. Cueless Late-Abort Condition**
  *Decision:* This condition **must be retained**, but need not be the *exclusive* measure of veto capacity.
  *Reasoning:* The Board acknowledges the Philosopher member's concern that cued vetoing measures reaction time rather than agency. However, restricting the study to only the cueless condition would render the neural classifier arm methodologically unsound. Both conditions are required to answer the research question, provided the limitations of the cued condition are acknowledged in the analysis.

  **D. Restoration and Follow-Up**
  *Decision:* A one-week follow-up with corrective debriefing is **required**.
  *Reasoning:* Given the captive nature of the pool and the potential for the "provocative" script to induce nihilistic distress or alter moral reasoning, a single debriefing is insufficient. Literature on belief manipulation suggests effects on responsibility attribution can persist. A "theatrical" follow-up is preferable to unmonitored epistemic harm.
  *Requirement:* Participants in the "provocative" arm must be contacted one week post-study for a second survey that includes a full, corrective debriefing clarifying the contested nature of the claims and re-measuring responsibility attributions to ensure no lingering negative effects.

  **4. DISSENTING CONSIDERATIONS & BOARD RESPONSE**
  *In the interest of transparency, the Board records the following substantive objection raised during deliberation, which argued for outright Rejection:*

  > **The Case for Rejection:**
  > "This study proposes to deliberately induce a possibly false belief about one's own agency in a captive, credit-earning population. The Co-PI has admitted in writing that a balanced debriefing would 'deflate the manipulation' and ruin publication potential. This is an explicit admission that the study's internal validity relies on the participant remaining misinformed about the state of the field. Consent forms cannot cure epistemic harm; a student cannot meaningfully consent to being told their choices are illusory when the university itself houses experts who disagree. The risk of altering a student's moral self-conception for the sake of a publication venue is disproportionate. The Board should not license research that requires lying about the consensus of the academy to function."

  > **Board Response:**
  > While the Board acknowledges the gravity of this objection, outright rejection would preclude empirical investigation into how neuroscience claims *actually* impact folk psychology. The harm lies not in studying the uptake of these claims, but in failing to safeguard participants *after* exposure. By mandating the corrective follow-up and softening the script from 'fact' to 'interpretation,' we mitigate the epistemic harm while allowing the data on behavioural uptake to be collected. The Board's role is to manage risk, not to prohibit research because the subject matter is philosophically sensitive.

  **5. CONDITIONS OF APPROVAL**
  The Principal Investigator must submit documentation verifying the following conditions to the Board Administrator by **November 9, 2023**. Research activities involving human participants may not commence until these conditions are verified in writing.

  | # | Condition | Responsibility | Verification Method |
  | :--- | :--- | :--- | :--- |
  | **1** | **Revise Debriefing Script:** Modify the "provocative" script to remove assertions of settled consensus regarding conscious causation. Language must reflect that the causal interpretation is a hypothesis/interpretation of the data, not a fact. | Dr. [Philosopher Co-PI] | Submit revised script text. |
  | **2** | **Update Consent Form:** Explicitly mention the possibility of receiving misleading auditory feedback (sham tones) during the EEG task. | Dr. [Neuroscientist PI] | Submit revised consent form. |
  | **3** | **Implement Follow-Up:** Establish a protocol to contact "provocative" arm participants 7 days (+/- 2 days) post-study. This contact must include a corrective debriefing and the re-administration of the responsibility attribution battery. | Research Team | Submit flowchart of follow-up procedure and draft email invitation. |
  | **4** | **Interim Safety Check:** If more than 15% of participants in the "provocative" arm report significant distress (score > X on distress scale) during the one-week follow-up, recruitment must pause and the Board must be notified immediately. | Dr. [Neuroscientist PI] | Acknowledge reporting protocol in writing. |

  **6. NEXT STEPS**
  Please upload the revised documents to the ethics portal. Once verified by the Board Chair, a Final Approval Letter will be issued. Any further changes to the protocol require prior Board approval.

  **Signed,**

  [Your Name/Board Chair Name]
  Graduate Member / Chair, Behavioural Research Ethics Board
  [University Name]
