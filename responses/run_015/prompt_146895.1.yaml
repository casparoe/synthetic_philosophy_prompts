answer: |-
  Hey, sorry you're dealing with that headache. Arguments about definitions of corruption are basically designed to drain your soul, so don't sweat the typo (I definitely wouldn't have caught it if you hadn't pointed it out).

  Since you've got this anthropologist on Tuesday who wants to reframe bribery as "moral obligation," you need questions that stop him from floating away into theory land. You want to pin down the real-world consequences of his view.

  Here are 7 pressing questions to keep him grounded. I've included the follow-ups you asked for on the specific topics so you can cut off the dodges before they start.

  **1. The Public Resource Distortion**
  "Let's say a mayor gives a public contract to his cousin instead of the most qualified bidder. You'd call that a moral obligation; I'd call it a distortion of public resources. If the result is that the road gets built poorly or costs twice as much, does the 'moral economy' label change the damage done to the public?"
  *   **Follow-up (when he says resources were never neutral anyway):** "Okay, but if we accept that neutrality is a myth, does that mean *any* allocation of public funds is immune to critique? At what point does 'non-neutral' just become a synonym for 'unaccountable'?"

  **2. The Unfalsifiability Trap**
  "If every exchange can be reclassified as a legitimate gift based on context, doesn't your framework make corruption unfalsifiable? How do we identify corruption if the definition stretches to cover every possible transaction?"
  *   **Follow-up (when he says culture sets the line):** "Right, but culture isn't a monolith. Who gets to define where that line is? Is it the community, or is it the patron who benefits from the ambiguity?"

  **3. Western Corporate Nepotism**
  "Let's bring this home. In New York or London, if a CEO hires their unqualified nephew, we call it nepotism and often fire them. Is that fundamentally different from the patronage systems you're describing, or are Western standards just applied differently?"
  *   **Follow-up (keyed to his answer):** "If it's the same behavior but we punish it here and celebrate it there, aren't we admitting that 'corruption' is just a power judgment rather than a moral one? So why should we respect the local version?"

  **4. Reciprocity Saturation**
  "You talk about 'reciprocity saturation'—the point where a gift becomes a burden or a bribe. How do you measure that threshold without smuggling in the very Western efficiency norms you're rejecting?"
  *   **Follow-up (when he says the boundary is culturally internal):** "If the boundary is internal, does that mean outsiders—or even local reformers—have no language to critique it? Does your framework accidentally silence the people within that culture who want change?"

  **5. Harmful Extraction**
  "Can your view still condemn a patron who takes way more than they give back? If a leader extracts wealth and leaves nothing but obligation behind, is that still just a 'moral economy,' or does it collapse back into corruption under your own terms?"
  *   **Follow-up:** "If you say it *is* corruption when it gets too extractive, haven't you just admitted there *is* a universal standard of fairness after all?"

  **6. The Policy Paralysis**
  "If we adopt your framework and stop calling these things corruption, what happens to anti-corruption policy? Do we shut down the watchdogs? Because it sounds like you're arguing we should stop fighting these behaviors and just study them."

  **7. Who Benefits?**
  "Ultimately, who benefits from redefining corruption as culture? Does this framework empower the clients who are stuck in these obligations, or does it protect the patrons who benefit from them?"

  ***

  **Quick tip for the interview:** He's going to try to turn these into "interesting theoretical problems." Don't let him. Keep bringing it back to: *Who gets hurt?* and *Who gets rich?*

  Good luck on Tuesday. You're going to crush it.
