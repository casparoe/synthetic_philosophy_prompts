prompt: |-
  You're a professional political philosopher who's spent a lot of time on conservatism, institutional epistemology and the theory of reform — the kind of person who's read both the Burkean tradition and the modern decision-theory stuff and can move between them. Please think carefully and take your time: start by brainstorming freely about where a view like mine could come apart, list maybe six or eight candidate friction points before you settle on anything, and then give me the audit. I don't want a lecture on conservatism and I definitely don't want "it depends on the case" — I need to know what gives.

  Context: I'm writing an internal handbook for a platform/ops team on how to change things without breaking them, and I want the Chesterton's-fence idea (don't take down a fence until you know why it was put up) as the spine of it, but every time I write it down I feel like I'm smuggling something. Here's roughly where I've landed:

  1. The fence itself: if a check, rule, or process is in place and nobody can say why, the default is keep it until somebody can state what it was for. Not knowing the rationale isn't evidence there isn't one.
  2. Inherited practice carries real epistemic weight because the knowledge in it is tacit and distributed — more than any one person, or any committee, can articulate. That's the Burke-flavoured bit: the practice knows things the planners don't.
  3. But I want the mechanism to be boring, not mystical. My story is that persistence is weak Bayesian evidence of function: stuff that did nothing tended to get dropped or outcompeted, so "it's still here" earns a modest prior bump and nothing more.
  4. At the same time I think most of the institutional furniture around us is path-dependent junk — lock-in, prestige copying, QWERTY-ish accidents, conformist transmission — and that environments shift a lot faster than any filter operates. So the filter is weak, slow, and noisy.
  5. Asymmetric burdens: I want evidence before we adopt anything new (show me it works), but I don't demand the same evidence for practices already in place. The fence shields those by default.
  6. Legitimacy: a rule that binds people has to be justifiable to the people it binds, in terms they could accept. "It's traditional and nobody knows why" doesn't seem to meet that bar — even though (2) says the knowledge in it can't be articulated in the first place.
  7. Reversibility matters more than most people think: I want reforms small and reversible where possible, and I hate big-bang reorgs.

  Two things I've been chewing on that I can't place in the above. First, what I call the cut problem: a practice doesn't arrive pre-individuated, so the same act can be described as removing a fence or as trimming, relocating, or replacing one, and the fence's verdict seems to swing with how finely you cut. Second, what I call accidental fences: some practices were never put up for a reason at all, they're by-products or spandrels of something else — in which case the fence's instruction can't be carried out, and my worry is that the procedure then manufactures a rationale instead (fence laundering: someone invents a plausible genealogy, and now the practice is harder to remove than before because it has a story). Are those two just implementation annoyances, or do they bite the principle?

  So: which of 1–7 are actually in tension with each other, and how badly? Rank the tensions by severity rather than listing them all as equally bad, and for each say what would have to give and what that costs me. Flag any pair that only looks tense and dissolves when you're careful — I'd rather you discriminate than flag everything. Tell me whether any two of my commitments are secretly the same commitment, tell me which one is doing the least real work, and if there's a single revision that cleans up the most, give me that. Finally: given all this, what should the handbook actually say? If the honest version of my view is that the fence is a special case of some other principle, tell me which one, and whether it cuts along a different axis than new-versus-existing.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **Persona:** Professional political philosopher, expert in conservatism, institutional epistemology, and reform theory. Comfortable with Burke, decision theory, Bayesian reasoning, and organizational dynamics.
      *   **Task:** Audit the user's draft "internal handbook" philosophy based on Chesterton's Fence.
      *   **Constraints:**
          *   Brainstorm 6-8 friction points first.
          *   Rank tensions by severity (don't treat all equally).
          *   Identify false tensions (dissolve them).
          *   Identify redundant commitments (secretly the same).
          *   Identify the "least work" commitment.
          *   Propose a single revision that cleans up the most.
          *   Final recommendation: What should the handbook actually say? Is "Fence" the right spine, or is it a special case of something else?
          *   Tone: Rigorous, direct, no lecturing on conservatism, no "it depends."
      *   **User's Core Position (The 7 Points):**
          1.  Default = Keep until rationale stated.
          2.  Epistemic weight of inherited practice (tacit/distributed knowledge).
          3.  Mechanism = Weak Bayesian evidence (persistence $\approx$ function).
          4.  Caveat = Path dependence/lock-in makes the filter weak/noisy.
          5.  Asymmetric burdens (New needs proof, Old gets benefit of doubt).
          6.  Legitimacy (Must be justifiable to those bound, even if tacit).
          7.  Reversibility (Small, reversible steps).
      *   **User's Specific Worries:**
          *   *The Cut Problem:* Granularity of description changes the verdict.
          *   *Accidental Fences:* Spandrels get rationalized ("fence laundering").

  2.  **Brainstorming Friction Points (6-8 Candidates):**
      *   *Tension A:* Epistemic Humility (2 & 3) vs. Legitimacy (6). If knowledge is tacit/inarticulable, how can we justify it to bind people?
      *   *Tension B:* Bayesian Persistence (3) vs. Path Dependence (4). If the filter is noisy/slow, how much weight does persistence actually carry?
      *   *Tension C:* Asymmetric Burdens (5) vs. Legitimacy (6). Why should old rules bind people without justification if new rules need it?
      *   *Tension D:* The Cut Problem vs. Default Keep (1). If I can describe a change as "trimming" rather than "removing," do I bypass the burden?
      *   *Tension E:* Fence Laundering vs. Epistemic Weight (2). If we invent stories for spandrels, we corrupt the epistemic signal.
      *   *Tension F:* Reversibility (7) vs. Asymmetric Burdens (5). If a change is easily reversible, do we still need the high bar for new things?
      *   *Tension G:* Tacit Knowledge (2) vs. Operational Context (Platform/Ops). Does software/ops have "tradition" in the Burkean sense, or just technical debt?
      *   *Tension H:* Default Keep (1) vs. Environment Shift (4). If environments shift faster than filters, old fences might be actively harmful *because* they persisted.

  3.  **Selecting and Ranking Tensions:**
      *   *Severity 1 (Critical):* Legitimacy (6) vs. Tacit Knowledge/Asymmetry (2 & 5). This is the "Liberal-Conservative" paradox. You can't bind people by rules they can't understand, but the rule exists *because* it encodes understanding they don't have.
      *   *Severity 2 (High):* Bayesian Persistence (3) vs. Path Dependence (4). This undermines the *mechanism*. If persistence is mostly lock-in, the Bayesian prior is wrong.
      *   *Severity 3 (Medium-High):* The Cut Problem vs. Default Keep (1). This is an exploitability issue. It makes the rule gameable.
      *   *Severity 4 (Medium):* Fence Laundering vs. Epistemic Weight (2). This is a corruption risk, but maybe manageable.
      *   *False Tension:* Reversibility (7) vs. Asymmetry (5). Actually, they complement each other.
      *   *Redundancy:* (1) and (5) are basically the same operational rule derived from (2) and (3).

  4.  **Drafting the Audit (Iterative Process):**

      *   *Introduction:* Acknowledge the sophistication of the draft. It's better than standard "move fast and break things" or rigid bureaucracy.
      *   *The Brainstorm:* List the 6-8 points briefly as requested.
      *   *The Ranking:*
          *   **Rank 1: The Legitimacy Paradox (6 vs. 2/5).** This is the philosophical heart. If the knowledge is tacit (2), you *can't* justify it in terms people accept (6). If you force justification, you lose the tacit benefit. If you don't, you lose legitimacy.
          *   **Rank 2: The Signal-to-Noise Ratio (3 vs. 4).** You claim persistence is Bayesian evidence (3), but admit it's often junk/lock-in (4). If the noise is high, the prior bump (3) is unjustified. This weakens the *reason* for the fence.
          *   **Rank 3: The Cut Problem (1 vs. Granularity).** This is the "loophole." If I redefine "removing the fence" as "optimizing the fence material," do I bypass the check? This makes the principle unstable.
          *   **Rank 4: Fence Laundering (Accidental Fences).** This is a secondary effect of the Legitimacy problem.
      *   *Dissolving Tensions:* Reversibility (7) isn't in tension with Asymmetry (5); it's the safety valve that *allows* Asymmetry.
      *   *Redundancies:* Point 1 (Default Keep) is just the operational output of Point 5 (Asymmetric Burdens). Point 5 is the policy, Point 1 is the rule. Merge them.
      *   *Least Work:* Point 3 (Weak Bayesian). It's trying to do too much heavy lifting for a "boring" mechanism. It conflicts with Point 4 too much.
      *   *The Single Revision:* Shift from "Persistence = Function" to "Coupling = Risk." The fence isn't there because it *worked* in the past; it's there because it's *coupled* to things we don't understand yet.
      *   *Final Recommendation:* The spine shouldn't be Chesterton's Fence (which implies wisdom in the past). It should be **Complexity Awareness / Coupling Audits**. The axis isn't New vs. Old, it's **Understood vs. Opaque**.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I lecture on conservatism? *Correction:* Keep references to Burke minimal and functional. Focus on the internal logic of the handbook.
      *   *Check:* Did I say "it depends"? *Correction:* Be decisive. "This breaks," "This holds."
      *   *Check:* Did I address the "Cut Problem" and "Accidental Fences"? *Yes, integrate them into the ranking.*
      *   *Check:* Is the tone right? *Needs to be peer-to-peer, analytical, slightly sharp.*
      *   *Insight:* The user's Point 4 (Path Dependence) actually kills Point 3 (Bayesian Evidence). If most furniture is junk, why treat it as evidence? I need to highlight this contradiction strongly. The "Bayesian" story is a rationalization that doesn't hold up against the "Path Dependence" observation.
      *   *Insight on Legitimacy:* In a corporate ops context, "Legitimacy" (6) isn't about social contract theory; it's about compliance and adoption. If engineers don't buy the rule, they bypass it. The "Tacit Knowledge" argument is a hard sell to a skeptical engineer.
      *   *Solution:* The "Fence" isn't about *wisdom*, it's about *interdependency*. Don't remove it because you don't know what it's *connected to*, not because you don't know *why* it was built. This solves the "Accidental Fence" problem (even accidental fences have structural load).

  6.  **Final Polish:** Structure the response clearly.
      *   Phase 1: Brainstorming Friction Points.
      *   Phase 2: The Audit (Ranked Tensions).
      *   Phase 3: Dissolutions & Redundancies.
      *   Phase 4: The Revision & Handbook Recommendation.

  7.  (Final Review against constraints):
      *   6-8 friction points? Yes.
