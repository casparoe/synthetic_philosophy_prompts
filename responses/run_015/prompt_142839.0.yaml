answer: |-
  **Setting:** *The philosophy department lounge. 4:30 PM. The whiteboard still has half-erased diagrams of utility curves from the seminar. Alex is stirring a lukewarm coffee; Jamie is slumped in an armchair, staring at the ceiling.*

  **Jamie:** I can't shake that case from class. The epistemic capacity one. Usually, when we talk about leveling down, it's about welfare or income. If we level down income, everyone is poorer, but at least they're equally poor. It's wasteful, but conceptually tidy. But if we're talking about the capacity for modal reasoning? Or the ability to participate in collective deliberation?

  **Alex:** Right? It feels viscerally worse. If you equalize by lobotomizing the people who can think in counterfactuals, you haven't just wasted resources; you've actively destroyed a specific kind of human power.

  **Jamie:** Exactly. And that's where I'm stuck on the egalitarian side. If I defend strict equality of capacity, am I committed to saying the lobotomized world is *better* in one respect? Because that sounds insane. But if I say no, then I'm not really an egalitarian about capacities, am I?

  **Alex:** This is why I'm leaning into the prioritarian view. Look, if we apply a convex weighting function to these capacities, we give moral priority to boosting the bottom without requiring the top to fall. We maximize the *weighted sum* of epistemic capacity. The person with the lowest ability to deliberate gets the most moral weight per unit of improvement.

  **Jamie:** But here's my pushback, Alex. Doesn't that convex weighting just smuggle in a welfare assumption? You're treating "capacity units" like they're fungible, like dollars. Like if I gain a point of modal reasoning, it cancels out you losing a point, provided you're higher up the curve than me. But capacities aren't welfare. I can't compensate you for losing your ability to understand complex syntax by giving you *more* ability to understand syntax later. It's not substitutable in the same way utility is.

  **Alex:** I see the worry. You're saying prioritarianism treats capacities as a "metric" that can be aggregated, and that assumes a kind of interchangeability that doesn't exist. But I don't think I need full fungibility. I just need to say that *having* the capacity is good, and *having it when you currently lack it* is morally more urgent. I don't need to say your capacity is identical to mine. I just need to say the marginal moral value of improving your deliberative skills is higher than improving mine, because mine are already sufficient.

  **Jamie:** Okay, but does that actually solve the Leveling-Down Objection? The LDO says egalitarianism is flawed because it sees value in making everyone worse off just to be equal. You claim prioritarianism avoids this because lowering my capacity *reduces* the weighted sum. But if the weight on the bottom is high enough—if the convex curve is steep enough—doesn't prioritarianism collapse into egalitarianism at the margin?

  **Alex:** That's a technical worry. If the derivative of the weighting function approaches infinity as capacity approaches zero, then yes, I'd be forced to prioritize the bottom almost absolutely. But that's not leveling down. That's leveling *up*. Prioritarianism never gives me a reason to reduce your capacity. Even if you're way above me, your capacity still adds positive value to the sum. Egalitarianism, strictly telic egalitarianism, says the *gap* is bad. So closing the gap by reducing you is a "gain" in equality. I don't have that problem.

  **Jamie:** Do you not? Let's press the "epistemic" part of this. Why do we value these capacities? If it's because they lead to welfare, then we're just welfarists, and this whole conversation is a detour. If we value them intrinsically—say, because democratic reciprocity requires we stand as equals in deliberation—then the *relation* matters, not just the aggregate sum.

  **Alex:** I'm not denying the relational value. I'm just saying the distribution mechanism shouldn't be "destroy the high end."

  **Jamie:** But what if the high end *creates* the inequality that undermines the reciprocity? If your modal reasoning is so far beyond mine that we can't actually deliberate together, does it matter that the "weighted sum" is high? We aren't a polity anymore; you're the philosopher-king and I'm the subject. Prioritarianism lets that gap widen as long as I'm getting *some* improvement. Egalitarianism says the gap itself is the injustice.

  **Alex:** That's a strong point. But does the gap justify leveling you down? If we can't bring me up to your level due to resource constraints or biological limits, are you really saying the just outcome is to drag you down to mine?

  **Jamie:** *Pauses.* Honestly? In the welfare case, no. In the epistemic case... I'm less sure. If the capacity is for *collective* deliberation, and your capacity makes collective deliberation impossible because we can't understand each other, then your high capacity is functionally useless for the specific good we're tracking. It's like having a radio transmitter with no receivers.

  **Alex:** So you're arguing that above a certain threshold, extra epistemic capacity has zero moral value?

  **Jamie:** Maybe not zero. But its value is contingent on there being others who can meet you. If you're the only one who can do modal logic, you can't use it for *collective* reasoning. So, reducing you doesn't lose much value if the social function of that capacity is broken.

  **Alex:** That feels dangerous. You're making the value of my capacity dependent on your incapacity. That incentivizes keeping me down. But okay, let's talk about the weak point in my own view. You asked about fungibility earlier.

  **Jamie:** Yeah. How do you measure "units" of modal reasoning?

  **Alex:** *Sighs.* That's the breaker. For prioritarianism to work, I need a cardinal scale. I need to know that moving you from 2 to 3 is a bigger moral gain than moving me from 8 to 9. But with welfare, we at least have preference satisfaction or hedonic tones as a proxy. With epistemic capacities? How do we interpersonal compare "ability to grasp counterfactuals"?

  **Jamie:** Exactly. If we can't measure it, your convex curve is just a drawing. You can't calculate the weighted sum.

  **Alex:** True. And if we can't measure it, your egalitarianism is blind too. You don't know when we've achieved equality. But here's where I think my view is weaker than I want to admit: If the measurement problem is unsolvable, prioritarianism might default to a threshold view. "Enough capacity for everyone." And once everyone is above the threshold, the weighting flattens out.

  **Jamie:** And if the weighting flattens out, you stop prioritizing the worst-off. Then you're just a utilitarian about capacities.

  **Alex:** Right. So either I collapse into egalitarianism (if the curve is too steep) or utilitarianism (if it flattens). The "prioritarian middle" relies on a precise metric of epistemic capacity that I don't think exists.

  **Jamie:** And on my side, the weakness is the "Leveling Down" intuition. If I say the gap is intrinsically bad, I have to own the implication that a world of equal incapacity is better *in one respect* than a world of unequal capacity. I tried to dodge that by saying the capacity is for *collective* use, so high individual capacity without partners is worthless.

  **Alex:** But that's contingent. What if I can teach you?

  **Jamie:** Then leveling down is unnecessary. But if I *can't* teach you? If the cognitive gap is biological or entrenched? Then strict egalitarianism implies we should reduce the high end to restore the possibility of a relationship of equals.

  **Alex:** That's the bullet you have to bite.

  **Jamie:** It tastes like ash. But here's the thing: Your prioritarianism avoids that bullet, but does it avoid the "Relational Objection"? If I stay at capacity level 2 and you go to 10, and we're making laws together, I am effectively subordinate to you. Your view allows this hierarchy as long as my 2 is the best possible 2 I can have.

  **Alex:** I guess I have to accept that. I value the *possession* of capacity more than the *relation* of equality. I'd rather be a subordinate with improved reasoning skills than an equal with lobotomized ones.

  **Jamie:** And I'd rather be an equal, even if it means we're both less capable, because justice is about how we stand to one another, not how much "brain power" the aggregate holds.

  **Alex:** So we're at a stalemate on the fundamental value. But we agreed on one thing: the metric is the weak link.

  **Jamie:** Yeah. If we can't define a unit of "deliberative capacity," both our equations are nonsense.

  **Alex:** And if we *could* define it... I suspect your convex curve would look so steep it would mimic my equality demand, or my equality demand would look so costly it would mimic your priority demand.

  **Jamie:** *Laughs.* So the math saves us from having to make the hard choice. Typical.

  **Alex:** One last thing though. You said earlier that high capacity might be worthless without receivers. If that's true, then leveling down *isn't* a loss of value. It's just recognizing the value was already gone.

  **Jamie:** That's my out. If the capacity is essentially relational, then "leveling down" the high end isn't destroying value, it's aligning distribution with the nature of the good. But you're going to say that's just redefining terms to avoid the LDO.

  **Alex:** I was going to say it sounds like you're changing the subject from "capacity" to "successful communication." But... maybe that's the only way egalitarianism survives this specific case. If the good is inherently collective, individual hoarding is impossible.

  **Jamie:** So if I can't use my super-reasoning to dominate you, but I also can't use it to help you because you can't understand it, then taking it away doesn't hurt the collective good.

  **Alex:** I'm not convinced. I think there's residual value in you having it, even if we can't use it together. You could write it down. Someone later might understand it.

  **Jamie:** Future people? Now you're bringing time into it.

  **Alex:** *Grins.* Distributive justice across time. Next week's problem set.

  **Jamie:** God help us. More coffee?

  **Alex:** Please. Black. I need to stay sharp. Or at least, sharper than I was five minutes ago.
