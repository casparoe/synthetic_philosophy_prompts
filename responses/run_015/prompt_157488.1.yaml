answer: |-
  # Boundary Decision Protocol (BDP)
  **For:** Regional Climate-Adaptation Board Staff
  **Time Limit:** 10 Minutes per Proposal
  **Goal:** Determine membership eligibility for Decision *D*.

  ---

  ## Part 1: The Checklist
  Run these questions in order. Do not skip steps. If you hit a **STOP**, the decision is made. If you hit a **FLAG**, escalate to the Board Director.

  ### Step 1: The Authority Test (Binding Subjection)
  **Question:** Does Decision *D* grant the Board direct legal enforcement power over this person/entity?
  *   *Examples:* Can the Board fine them? Can the Board deny them a permit? Can the Board mandate they change behavior under threat of penalty?
  *   *Note:* Indirect effects (e.g., "my property value drops") do **not** count. It must be direct authority.

  *   **YES:** → **ELIGIBLE.** (Stop here. Epistemic access is not required; authority demands justification.)
  *   **NO:** → Go to Step 2.

  ### Step 2: The Impact Threshold (Significant Affection)
  **Question:** Will Decision *D* materially alter this person/entity's physical safety, economic baseline, or legal rights?
  *   *Threshold:* The impact must be distinct from the general public. "We all breathe the air" is not enough. "My home floods" is enough.
  *   **FLAG (Value Call):** If the impact is borderline (e.g., minor inconvenience vs. major cost), mark **[VALUE CALL]** and escalate to Director. Do not decide alone.
  *   **NO:** → **NOT ELIGIBLE.** (Stop here.)
  *   **YES:** → Go to Step 3.

  ### Step 3: The Reciprocal Justification Test (Epistemic Access)
  **Question:** Given the *actual* timeline and resources for Decision *D*, can this person/entity access the technical reasoning and effectively contest it?
  *   *Checklist:*
      1.  **Language:** Are materials available in their primary language?
      2.  **Complexity:** Can the technical data (e.g., hydrology models) be summarized without losing critical meaning?
      3.  **Time:** Is there enough time to translate/simplify before the vote?
  *   *Note:* If the Board *could* accommodate them but chooses not to for budget reasons, count this as **YES** (Board's failure, not member's). If it is physically impossible to translate/simplify in time, count as **NO**.

  *   **YES:** → **ELIGIBLE.**
  *   **NO:** → **NOT ELIGIBLE.** (Stop here. Proceed to Step 4 for documentation.)

  ### Step 4: Tension Documentation (Required for Exclusions in Step 3)
  If you excluded someone in Step 3 who passed Step 2 (Affected but no Access):
  *   **Action:** Attach a **[TENSION ALERT]** to the file.
  *   **Text:** "Candidate is significantly affected but lacks epistemic access. Exclusion is procedurally correct but ethically high-risk. Director review recommended."

  ---

  ## Part 2: Case Applications
  Here is how the protocol runs on your three current proposals.

  ### Case 1: The Permanent Remote Worker
  *   **Profile:** Lives in watershed, works out-of-state, pays no local taxes, no family ties.
  *   **Step 1 (Authority):** **YES.**
      *   *Reasoning:* Even if he pays no taxes, he is a resident. The Board's adaptation rules (zoning, water restrictions, building codes) bind him directly. He can be fined for non-compliance.
      *   *Result:* **ELIGIBLE.**
      *   *Note:* Epistemic access is waived because he is subject to authority. Even if he ignores the meetings, he has a right to be there because the Board can punish him.

  ### Case 2: The Seasonal Agricultural Worker
  *   **Profile:** Present 4 months/year, employer housing, limited English, no access to technical reports.
  *   **Step 1 (Authority):** **NO.**
      *   *Reasoning:* The Board regulates water rights and land use. It fines the *employer* or the *landowner*, not the worker. The worker is not legally bound by the Board's orders.
  *   **Step 2 (Impact):** **YES.**
      *   *Reasoning:* Upstream retention plans directly increase flood risk to the employer housing where he lives. Physical safety is materially altered.
  *   **Step 3 (Access):** **NO.**
      *   *Reasoning:* Decision timeline is 3 weeks. Hydrology reports are technical English. No budget for full translation and simplification of complex models within the window. He cannot contest the reasons offered.
  *   **Step 4 (Tension):** **[TENSION ALERT]**
      *   *Result:* **NOT ELIGIBLE.**
      *   *Annotation:* **This outcome will cause conflict.** The worker is physically vulnerable and present, but the protocol excludes him because he cannot technically engage in the deliberation. This highlights the trade-off: we are prioritizing *deliberative capacity* over *vulnerability*.

  ### Case 3: The Downstream Municipality
  *   **Profile:** Outside jurisdiction, suffering increased flooding risk from upstream ponds.
  *   **Step 1 (Authority):** **NO.**
      *   *Reasoning:* They are outside the Board's legal jurisdiction. The Board cannot fine them.
  *   **Step 2 (Impact):** **YES.**
      *   *Reasoning:* Increased flooding risk is a material alteration of physical safety and economic baseline (infrastructure damage).
  *   **Step 3 (Access):** **YES.**
      *   *Reasoning:* As a municipality, they have engineering staff. They can read the hydrology reports and contest the data within the timeline.
  *   **Result:** **ELIGIBLE.**
      *   *Note:* They enter as an "Affected Stakeholder" seat, not a "Binding Member" seat (unless you create distinct voting classes).

  ---

  ## Part 3: System Limitations (Misfire Points)
  **Do not use this protocol for the following.** These are known misfires where the procedure breaks down. Escalate immediately.

  1.  **Future Generations:** The protocol requires *current* capacity to contest reasons. It cannot assess rights for people who do not exist yet.
      *   *Action:* Default to "Proxy Representation" policy (if one exists) or Director Decision.
  2.  **Non-Human Entities:** The protocol requires "reciprocal justification" (argumentation). Animals and ecosystems cannot contest reasons.
      *   *Action:* Default to "Guardian/Steward" policy or Director Decision.
  3.  **Resource-Based Exclusions:** If Step 3 fails *only* because the Board refuses to spend money on translation/simplification (rather than it being impossible), the protocol flags it, but cannot force the budget.
      *   *Action:* This is a political failure, not a boundary failure. Log as "Budget Constraint Exclusion."
  4.  **Defining "Significant":** Step 2 relies on human judgment of what counts as "material." One staffer's "inconvenience" is another's "crisis."
      *   *Action:* If two staffers disagree on Step 2, it automatically becomes a **[VALUE CALL]** for the Director.

  ---

  ### Implementation Note for Staff
  **Why Case 2 is excluded:**
  You may feel uncomfortable excluding the Seasonal Worker. The protocol is designed to surface that discomfort, not hide it. By excluding him, we admit that **this specific deliberation format** (technical, fast-paced) is incompatible with his inclusion.
  *   **Fix:** If you want him included, you must change the *process* (more time, more money for translation), not fake the *boundary*. If you cannot change the process, the protocol forces you to admit he cannot participate *in this specific forum*, and you must find an alternative advocacy channel for him.
