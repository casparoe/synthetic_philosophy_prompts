      When we test these readings against your specific cases, the weaknesses in your classmate's defense become apparent. Consider the subscription service that changes silently or hallucinates. For the constitution claim to hold, the external resource must be trusted and stable. If the reliability depends on whether the user could tell the change occurred, rather than how the thing in fact behaves, then the system is too fragile to count as part of a mind. A memory that lies to you is not a memory. Regarding the model trained on past essays, the fact that the outputs are a statistical distillation of earlier thinking does not make the current cognition more his. It makes the tool a mirror, but a mirror is not the face. The processing is done by the company's server, not the student's neural pathways. The shared account case is perhaps the most damaging. If five students share one tool and only one curates it, the others find their apparent recollections shifting without noticing. This shows that the tool is not integrated into any single individual's cognitive character. It is a public utility, not a private mental organ.

      So, which readings do the work your classmate needs? To argue that using the chatbot is not cheating, he needs the third or fourth reading, where the AI is literally part of his cognitive process. However, these are precisely the readings that fail under the pressure of your test cases. The defensible readings, the first two, admit that the AI is an external aid. Schools permit some external aids, like notes, but forbid others, like having someone else write the essay. The distinction lies in who generates the reasoning. Since the AI generates the text based on weights the student does not control, the defensible claims do not excuse the honor code violation. The argument succeeds only if one accepts the radical claim that there is no boundary, but that claim is too unstable to support a defense in a disciplinary hearing.

      Your chemistry teacher uses the sentence differently. When he says not to bother memorizing anything, he is not making a metaphysical claim about the boundaries of the self. He is offering pragmatic advice based on the second reading, that external props make tasks easier. He means that in the modern world, accessing information externally is more efficient than storing it internally. This does not mean the phone is your brain, only that it is a useful tool. He is not arguing that using the phone during a test is acceptable, but that studying for life is different than studying for an exam. You are right to sense a difference here. Your classmate tries to use a metaphysical ambiguity to erase a normative boundary, while your teacher uses a practical observation to optimize learning. The sentence is the same, but the work it is asked to do is entirely different, and only the teacher's usage survives contact with reality.

