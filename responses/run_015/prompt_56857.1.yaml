  **Scenario**

  Elena Rostova, Chief Executive of the Port of Bristol Authority, faces a midnight deadline to authorise the dredging of Channel Four to accommodate new Panamax vessels, a project yielding a net revenue of £10m with 95% certainty. Geological surveys indicate a 5% probability that dredging will breach a confined clay layer, releasing trapped arsenic into the adjacent Severn Estuary breeding grounds, causing irreversible ecological collapse valued at a compensatory equivalent of £40m loss to the Authority through fines and remediation costs. Rostova, who previously rejected a balanced 50/50 gamble involving a ±£10m swing to the Authority's £100m reserve fund, must decide whether to proceed or maintain the status quo with £0 net change.

  ***

  **Analysis**

  **(a) Expected-Value Maximisation**
  An expected-value (EV) maximiser calculates the arithmetic mean of the monetary outcomes.
  *   **Dredge:** $(0.95 \times £10\text{m}) + (0.05 \times -£40\text{m}) = £9.5\text{m} - £2\text{m} = £7.5\text{m}$.
  *   **Status Quo:** $£0$.
  *   **Verdict:** Since $£7.5\text{m} > £0$, the EV maximiser recommends **Dredging**.

  **(b) Risk-Averse Expected-Utility Maximisation**
  We anchor the utility function in Rostova's revealed preference: she rejected a 50/50 gamble of ±£10m on a £100m base. Using a power utility function $U(W) = \sqrt{W}$ (where $W$ is wealth in £m):
  *   **Anchor Check:** $0.5\sqrt{110} + 0.5\sqrt{90} \approx 5.244 + 4.743 = 9.987$. Since $9.987 < \sqrt{100} (10)$, the function correctly models her rejection of the anchor gamble.
  *   **Dredge:** $0.95\sqrt{100 + 10} + 0.05\sqrt{100 - 40} = 0.95\sqrt{110} + 0.05\sqrt{60} \approx 0.95(10.488) + 0.05(7.746) \approx 9.964 + 0.387 = 10.351$.
  *   **Status Quo:** $\sqrt{100} = 10$.
  *   **Verdict:** Since $10.351 > 10$, the risk-averse EU maximiser still recommends **Dredging**. Ordinary risk aversion is insufficient to halt the project.

  **(c) Maximin and the Precautionary Principle**
  The Maximin rule selects the option with the least bad worst-case outcome.
  *   **Dredge:** Worst case is $-£40\text{m}$ (irreversible ecological collapse).
  *   **Status Quo:** Worst case is $£0$.
  *   **Verdict:** Since $0 > -40$, Maximin recommends **Status Quo**. Under a strong interpretation of the Precautionary Principle (PP) that prioritises avoiding irreversible harm regardless of probability, the verdict is to **Stop**.

  **Check Against Maximin Features**
  Standard justifications for Maximin rely on three conditions: (1) no reliable probabilities, (2) indifference to gains above the guaranteed floor, and (3) worst outcomes that are unacceptable.
  *   **Reliable Probabilities:** Our case *has* reliable probabilities (5% from geological surveys). Thus, condition (1) is absent.
  *   **Indifference to Gains:** Maximin inherently ignores the £10m gain.
  *   **Unacceptable Worst Outcome:** The harm is defined as irreversible ecological collapse.

  **The Feature Doing the Work**
  The single feature driving the divergence between EU and PP here is the **lexical priority assigned to the irreversible worst outcome**. Because the probabilities are known (condition 1 is false), the divergence cannot be blamed on uncertainty or ignorance. It turns strictly on the *nature* of the harm (irreversibility) warranting a veto that outweighs probabilistic calculation.

  **Removing the Feature**
  If we remove the irreversibility constraint—treating the £40m loss as purely financial and compensable—the justification for Maximin collapses. The decision reverts to a trade-off of utilities. As shown in (b), once the harm is commensurable with the gain within the utility function, the verdict flips back to **Dredging**. The PP loses its grip without the claim of strict irreversibility.

  **The Sunstein Critique**
  A critic in the mould of Cass Sunstein would argue: "The Precautionary Principle is incoherent here because it demands ignoring known probabilities. We know the risk is 5%, not 100%. By treating the 5% chance as if it were a certainty, the PP forces Rostova to sacrifice an expected value of £7.5m for a risk that is already adequately managed by standard risk aversion. Irreversibility alone does not justify paralysing decision-making when the likelihood of harm is low and quantified; to do so is to privilege the worst-case scenario lexically without justification, effectively imposing a risk risk of its own (the loss of economic benefit) without regulatory warrant."

  **Judgement**
  The critic succeeds *if* one accepts that all values (including ecological integrity) are commensurable within a single utility function. However, the case holds *if* one accepts that strict irreversibility creates a discontinuity in value that concave utility functions cannot capture. The PP does work here over and above risk aversion, but only by asserting that some outcomes are forbidden territories, not merely costly ones.
