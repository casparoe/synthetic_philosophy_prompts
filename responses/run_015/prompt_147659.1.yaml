answer: |-
  Here is the tier list based on current neuroscience and cognitive psychology, followed by the hot-swap analysis and your numbers.

  ### The Feature Tier List

  **Tier A (Bet Money)**
  6. **Content-addressable retrieval:** Associative recall is the fundamental operating mode of neural networks, whereas address-based lookup requires hardware we don't have.
  7. **Laziness:** Humans are not logically omniscient and clearly compute inferences on-demand rather than maintaining a closed set of all logical consequences.

  **Tier B (Could Go Either Way)**
  2. **Recursion / arbitrarily deep nesting:** While language supports recursion, working memory limits impose a hard stack depth that makes "arbitrary" physically false.
  3. **Variables with scope:** Working memory binds features together temporarily, but it lacks the strict scoping rules required to prevent variable capture errors.
  8. **A single serial instruction stream:** Consciousness appears serial, but this is likely a bandwidth bottleneck on top of massively parallel substrate processing.
  9. **Garbage collection / forgetting:** Synaptic pruning exists, but forgetting looks more like signal decay and interference than explicit memory reclamation.
  10. **Immutable, append-only belief store:** Memory reconsolidation suggests mutation, but behavioral lag suggests we often operate on stale versions of reality.

  **Tier C (Projecting Computers)**
  1. **Discrete, re-tokenable symbols:** Neural representations are distributed population codes, not localist pointers to shared heap objects.
  4. **Logical constants:** Human reasoning follows probabilistic heuristics and often violates basic Boolean laws like material implication.
  5. **Static typing:** We can easily represent category errors like "colorless green ideas," so syntax does not prevent semantic nonsense.

  ***

  ### The Hot-Swap Problem

  The evidence fits the **immutable/event-sourced architecture with eventual consistency** much better than mutable shared memory. If beliefs were mutable pointers, updating "standup is at 11" would instantly propagate to all cognitive subsystems, yet we constantly observe "stale reads" where your motor habits walk you to the 10am meeting while your declarative memory knows it's at 11. This suggests beliefs are events logged in time, and different subsystems (planning, motor control, emotion) consume that log at different speeds, creating temporary inconsistency.

  **LoT Survival Score:** `0.75`
  (The classical LoT hypothesis is about the *structure* of the representations, not the mutability of the store; switching from RAM to a log-structured merge tree changes the database engine but leaves the IR mostly intact.)

  ***

  ### The Compositionality Question

  **Explanatory Power Score:** `0.6`
  (Compositionality alone fully solves productivity and systematicity by definition, but it does almost no work explaining intentionality or why specific inference steps feel valid rather than just syntactically well-formed.)
