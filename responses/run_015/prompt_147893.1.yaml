answer: |-
  The standard conception of verisimilitude operates under a tacit assumption: that for a theory to be closer to the truth, it must first be speaking about the same things as the truth. This ontological prerequisite dictates that truth-likeness is a measure of overlap. On this view, to evaluate a theory, one counts the number of true propositions it generates, measures the logical distance between its description of the world and the actual world, or calculates the ratio of true consequences to false ones. All these metrics presuppose a shared logical space and a common ontology. They assume that if Theory A posits entity $X$ and Theory B posits entity $Y$, and $X$ does not exist while $Y$ does, then Theory B is inherently closer to the truth, regardless of how well Theory A predicts the behavior of the world.

  This approach is fundamentally mistaken. It conflates ontological correctness with explanatory fidelity. It assumes that the primary function of a scientific theory is to inventory the furniture of the universe, rather than to map the causal and nomic architecture that governs it. I argue that verisimilitude must be decoupled from strict ontological correspondence. A theory that posits non-existent entities can be closer to the truth than a theory that posits only existing entities, provided the former preserves the modal dependency structures of the domain it describes. Truth-likeness is not a matter of having the right nouns; it is a matter of having the right verbs and connectives. It is a measure of structural fidelity to the web of counterfactual dependencies that constitute the law-governed behavior of the world.

  To establish this, we must first recognize the limitation of content-based measures. If verisimilitude is defined by the quantity of true content, any theory containing a false existential claim is penalized heavily, often rendering it completely false. Consider a theory that posits a continuous fluid medium to explain wave propagation. If the fundamental ontology of the world is discrete particles, the fluid theory is strictly false. Under standard metrics, its verisimilitude is negligible because its core ontological claims are false. However, this theory may support a vast array of true counterfactuals: "If the density were higher, the wave speed would be lower." These counterfactuals hold in the actual world, despite the non-existence of the continuous fluid. The standard view cannot account for this success without treating it as a lucky accident. The structural view, conversely, recognizes that the dependency relation between density and wave speed is a real feature of the world, preserved by the theory even if the relata (the fluid elements) are fictional.

  Therefore, verisimilitude should be defined by the preservation of modal dependency structures. A dependency structure is the network of relations specifying how changes in one parameter necessitate changes in another, grounded in the nomic constraints of the world. When a theory captures these dependencies, it captures the "shape" of the truth, even if it misidentifies the substance filling that shape. This leads to the central claim: a false theory with a layered, domain-restricted ontology can be closer to the truth than a true but ontologically sparse theory.

  Consider a fundamental theory that is ontologically true but sparse, stating only the existence of basic particles and their fundamental interactions. Now consider a higher-level theory that is ontologically false, positing macroscopic objects with emergent properties like temperature or pressure. In the domain of thermodynamics, the fundamental theory may be ontologically superior but explanatorily distant. It does not naturally encode the dependencies relevant to the macroscopic domain without immense derivational effort. The false macroscopic theory, however, directly encodes the dependencies relevant to that domain. If verisimilitude is about proximity to the truth of how the world behaves in a specific context, the false theory is closer. It captures the invariant patterns of the domain. The fundamental theory describes the substrate, but the false theory describes the system. Since scientific inquiry is often system-directed rather than substrate-directed, the theory that captures the system's dependency architecture possesses greater verisimilitude relative to the domain of inquiry.

  This brings us to the mechanism by which false theories retain truth-likeness: structural invariance under ontological reduction. This concept holds that when a false macro-level theory is reduced to a true micro-level theory, what survives the reduction is not the entities of the macro theory, but the dependency architecture they instantiated. Reduction is often viewed as elimination: the macro entities are shown to be nothing but collections of micro entities, and thus the macro theory is discarded. However, if the macro theory was successful, the web of relations between its concepts maps isomorphically onto a web of relations between the micro entities.

  Structural invariance asserts that the truth of the theory lies in this mapping. The equations of the false theory remain valid as descriptions of the structural relationships within the reduced ontology. For example, if a false theory posits a "caloric fluid" flowing from hot to cold, and the true theory posits kinetic energy transfer, the entity "caloric" is eliminated. However, the structural relation "flow from high potential to low potential" is invariant. It maps onto the statistical tendency of energy distribution. The verisimilitude of the caloric theory resides in this invariant structure. It is not that the theory is "partially true" in the sense of having some true sentences; it is that the theory is structurally isomorphic to the true causal processes, despite the ontological mismatch. A theory is truth-like to the degree that its internal dependency graph can be mapped onto the causal graph of the world without distortion of the modal connections.

  A serious objection arises here. If we abandon ontological correspondence and focus solely on the preservation of dependency structures, does verisimilitude not collapse into mere internal coherence? If the entities do not exist, then the dependencies are merely relations between fictions. A fantasy novel can be internally coherent, with a magic system that follows strict rules of dependency. If we judge verisimilitude by structural fidelity, are we not forced to say that a coherent fantasy is close to the truth?

  The distinction lies in the source of the constraints. Internal coherence requires only that the propositions of the theory do not contradict one another. It is a logical property of the theory itself. Structural fidelity, however, is a relational property between the theory and the actual world. For a dependency structure to be preserved, the counterfactuals supported by the theory must match the counterfactuals supported by the world. In the fantasy novel, the dependency "if spell A is cast, effect B occurs" is true only within the logic of the story. In the actual world, there is no corresponding causal mechanism.

  In the case of the false scientific theory, the dependency "if pressure increases, volume decreases" is supported by the theory, but crucially, it is also supported by the actual-world causal processes, even if the theory explains it via "fluid particles" and the world operates via "kinetic collisions." The structural fidelity is not to the theory's own axioms, but to the nomic constraints of reality as manifested within the restricted domain. The theory acts as a lens; if the lens is distorted, the image of the dependency structure is warped. If the lens is ontologically opaque (positing fake entities) but optically perfect (preserving the angles and relations of the image), it has high verisimilitude. Coherence checks if the lens is cracked; fidelity checks if the image matches the object. We can have a coherent theory that posits dependencies that do not exist in the world (e.g., astrological influences). Such a theory fails the fidelity test because the modal connections it posits do not map onto actual causal powers, even if the theory is internally consistent.

  Therefore, the evaluation of verisimilitude without shared ontology does not retreat into idealism or coherentism. It remains firmly realist about the structure of the world. It asserts that the world possesses a modal architecture that exists independently of our descriptions. Our theories attempt to mirror this architecture. Sometimes, to mirror the architecture effectively at a certain scale, we must posit scaffolding that does not exist in the fundamental structure. This scaffolding is ontologically false but structurally necessary for the representation.

  To conclude, verisimilitude must be reconceived as a measure of structural invariance rather than ontological overlap. The standard quantitative approaches fail because they treat theories as bags of propositions rather than as maps of causal topology. By shifting the criterion to the preservation of modal dependency structures, we allow for the possibility that a theory can be ontologically false yet truth-like. This accounts for the progressive nature of science, where entities are discarded but equations are retained. It explains how we can learn from false theories: we learn the shape of the dependencies they captured. Finally, by distinguishing structural fidelity from internal coherence, we maintain that truth-likeness is anchored in the actual world's nomic structure, not merely in the consistency of our thought. A theory is close to the truth not because it names the world correctly, but because it moves in step with the world's own patterns of necessity.
