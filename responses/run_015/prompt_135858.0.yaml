  2.  **Deconstruct Hume's *Of Miracles*:**
      *   **Part 1 (Direct):** A miracle is a violation of the laws of nature. Uniform experience supports laws of nature. Therefore, evidence against a miracle is as strong as any argument from experience can be. No testimony is sufficient to establish a miracle unless the falsehood of the testimony would be more miraculous than the event.
      *   **Part 2 (Indirect):** Human psychology predisposes us to believe marvels (love of wonder). Testimony degrades through transmission. People lie for attention, religion, etc.

  3.  **Deconstruct *Life of Pi* (Framing Narrative):**
      *   Pi tells two stories to Japanese officials: Animal (tiger Richard Parker) vs. Human (cannibalism/murder).
      *   Officials reject the animal story (incredible) and prefer the human story (factually probable).
      *   Pi asks: "Which story do you prefer?" Officials choose the "better story" (animal).
      *   Nested testimony: Pi -> Officials / Pi -> Author -> Reader.

  4.  **Synthesize/Argue:**
      *   *Hume's Direct Argument:* The officials initially apply Hume perfectly. The animal story violates uniform experience (tigers don't coexist peacefully with humans on lifeboats). The human story aligns with uniform experience (humans kill for survival). They reject the miracle based on probability.
      *   *Hume's Indirect Argument:* The nested chain (Pi to Author to Reader) invites skepticism. Pi is a single witness. The author admits uncertainty. Hume would warn against the "love of wonder" seducing the reader into believing the tiger story.
      *   *The Gap/Challenge:* Pi's final question shifts the criterion from *truth* (probability) to *meaning* (narrative integrity). Hume assumes epistemic goal is factual accuracy. Martel suggests the "better story" might be a higher rational good than bare factuality if it preserves sanity or faith. However, Hume might counter that this is precisely the self-deception he warned against: preferring the comforting marvel over the brutal fact.
      *   *Resolution:* The novel doesn't necessarily refute Hume epistemically but challenges his exclusivity. It suggests that while Hume is right about *evidence*, he is silent on *value*. Yet, Hume's lens reveals the framing as an invitation to complicit self-deception.

