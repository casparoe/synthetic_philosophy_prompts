answer: |-
  The tension you identify is central to Montaigne's method in "Of Cannibals." It appears contradictory only if we assume Montaigne applies a single standard of evaluation to all aspects of human life. To resolve this, we must recognize that Montaigne implicitly operates with a distinction between **Judgment by Custom** (standpoint-dependent) and **Judgment by Nature** (standpoint-transcendent).

  Montaigne does not hold these two commitments simultaneously regarding the *same* object. Rather, he applies Judgment by Custom to the *labeling* of societies, and Judgment by Nature to the *moral quality* of specific actions. This allows him to dismantle European arrogance without surrendering the ability to condemn cruelty.

  Here is how the logic of his position functions using this distinction:

  ### 1. Judgment by Custom (Standpoint-Dependent)
  **Location in the passage:** *"Every nation calls barbarous whatever differs from its own habits."*

  Montaigne begins by observing that the term "barbarian" is not an objective description of a people's worth, but a reflection of the observer's familiarity. In this realm, evaluation is entirely relative to local habit. Because the Tupinambá lack European technologies (navigation, arithmetic) and political structures (monarchs, written laws), Europeans label them "savage." Conversely, the Tupinambá would likely view European customs as equally strange.

  In this layer of the argument, Montaigne agrees with the relativist premise: there is no objective hierarchy of *cultures* based on external forms. A society without kings is not inherently inferior to a society with kings. This judgment is "standpoint-dependent" because it relies entirely on the viewer's position within their own tradition. Montaigne uses this to neutralize the European claim to inherent superiority. He clears the ground by showing that the label "barbarian" is merely a product of prejudice, not a measure of true moral standing.

  ### 2. Judgment by Nature (Standpoint-Transcendent)
  **Location in the passage:** *The comparison of roasting the dead vs. torturing the living... "true barbarism lies not in foreign rites but in the cruelty Europeans display."*

  Once the bias of custom is set aside, Montaigne introduces a second, deeper standard: the law of Nature (or natural reason). This is a "standpoint-transcendent" evaluation because it appeals to a universal human capacity to recognize suffering and excess, regardless of cultural training.

  Here, Montaigne stops comparing *customs* (eating people vs. burying people) and starts comparing *acts of violence* (vengeance upon the dead vs. torture upon the living). He argues that while the Tupinambá practice is shocking to European custom, it is consistent within their own logic of vengeance and is performed on bodies that no longer feel pain. In contrast, European torture and execution are inflicted on living bodies, maximizing suffering, and are hypocritically masked by "justice and faith."

  This judgment does not rely on habit. It relies on the premise that causing excessive pain to a living human being is a violation of a universal order accessible to reason. Therefore, "true barbarism" is redefined. It is no longer about what differs from *my* habit (Judgment by Custom); it is about what violates *natural humanity* (Judgment by Nature).

  ### Synthesis: How the Contradiction is Resolved
  The apparent contradiction dissolves when we see that Montaigne uses Judgment by Custom to critique European **pride**, but uses Judgment by Nature to critique European **conduct**.

  *   **Regarding Pride:** He tells the Europeans, "You have no right to call them barbarians simply because they are different." (Relativism/Custom)
  *   **Regarding Conduct:** He tells the Europeans, "However, if we measure by the standard of cruelty and reason, your actions are objectively more horrific than theirs." (Universalism/Nature)

  Montaigne does not claim that all moral truths are relative. He claims that the *markers* of civilization (laws, arts, kings) are relative, but the *substance* of inhumanity (gratuitous cruelty) is absolute.

  ### Conclusion
  Montaigne sustains both commitments by shifting the ground of evaluation. He accepts standpoint-dependent evaluation to demonstrate that European culture is not the universal benchmark for human society. However, he invokes standpoint-transcendent evaluation to assert that there is a shared human reality—specifically the capacity for suffering and the dictates of reason—against which all societies can be measured.

  The distinction does its work in the transition from the **definition** of barbarism to the **application** of the term. By defining "barbarism" conventionally, he exposes European bias; by judging the *acts* of torture naturally, he condemns European cruelty. Thus, he can be a skeptic about cultural superiority without becoming a skeptic about moral truth.
