  **Introduction**
  Welcome to Possibilia, the only nation where existence is merely a matter of perspective. Don't expect fanfare upon arrival; the locals treat being 'real' with the same enthusiasm as having a valid parking ticket. According to the state doctrine of Modal Realism, every way a world could be is a way a world *is*. Consequently, tourists often find the experience underwhelming. "I've been to World K-19," complains one visitor at the transit lounge. "The coffee was identical, but the barista had a beard. Hardly worth the inter-dimensional fare." The landscape is pleasant enough, though plagued by a sense of plenitude; every time you miss a bus, comfort yourself that in a nearby world, you caught it.

  **Actualville**
  The capital, Actualville, is frequently dismissed by guidebooks as a provincial backwater. This is intentional. Since 'actual' is merely an indexical term—like 'here' or 'now'—the citizens refuse to privilege their own location. The Palace of Actuality is a modest council building where the Prime Minister holds court alongside her less successful counterparts. Visitors seeking the 'centre of reality' are directed to a roundabout outside town. It goes nowhere, much like the concept of necessity. Accommodation is cheap, primarily because hotels exist in multiple worlds simultaneously, doubling the availability of rooms.

  **Entry Requirements**
  Border control is a metaphysical nightmare. Officers do not check passports; they check counterpart relations. If you claim to be John Smith, the officer will consult the Registry of Essences. If your mole is on the left cheek rather than the right, you are not John Smith; you are merely a counterpart. Visa denied. "We don't import near-identities," says Customs Chief Davies. "Last week, a man tried to enter because he was richer in his own world. We told him to stay there." Be prepared for existential questioning. You may be told you don't strictly exist here, only a qualitative duplicate does. It's best to nod politely.

  **Safety**
  Travel insurance is tricky. Disaster aid is frequently refused on technical grounds. When the neighbouring world of Possibilia-B suffered a magnitude 7 earthquake, relief was withheld because the tremors didn't register in this specific spacetime manifold. "Not our problem," shrugged a relief coordinator. "The suffering is real, but it's over there. Send them a card." Pickpockets are rare, mostly because stealing your wallet would create a divergence making them your counterpart, and the paperwork is prohibitive.

  **Events**
  **Indexicality Day (14th October)**
  The national holiday celebrates the banality of existence. Citizens wear grey suits and stand in silence, acknowledging that being 'actual' is no more special than being 'present'. Confetti is thrown, but only if it exists in all nearby worlds. It is a sombre affair, largely because everyone knows that in some world, the party is much better.

  ***

  **Note on Philosophical Liberties:**
  David Lewis's original modal realism posits that possible worlds are causally and spatiotemporally isolated; interaction between them is impossible. This guide takes significant creative liberty by treating worlds as accessible travel destinations while retaining the metaphysical attitudes (indexical actuality, counterpart theory) as cultural norms. In strict Lewisian terms, you cannot visit Possibilia from another world.
