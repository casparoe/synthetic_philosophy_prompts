answer: |-
  - "Branch questions"

  1.  **TABLE:** Does perfect behavioral equivalence within a bound imply identical belief states, even if the mechanism is a lookup table? (Probes whether implementation matters versus output.)
  2.  **PATCH:** If behavior is unchanged but an internal activation direction causally drives action, is that activation the belief? (Probes whether internal causal role suffices without behavioral difference.)
  3.  **SIDECAR:** When self-report and task behavior conflict systematically, which channel reveals the belief? (Probes the authority of avowal versus operational commitment.)
  4.  **MASSIVE ERROR:** Can we attribute beliefs that are massively inconsistent if doing so best predicts behavior? (Probes whether rationality constraints are necessary for attribution.)
  5.  **MIRROR:** If the system fails your belief test, does a degraded human in a poor information environment also fail? (Probes universalism versus human exceptionalism.)

  - "The tree"

  Start at **TABLE**.
  *   **Yes (Behavior Suffices):** Move to **MASSIVE ERROR**.
      *   **Yes (Prediction Suffices):** Move to **SIDECAR**.
          *   **Task Behavior:** Full-strength behavioral instrumentalism.
          *   **Avowal:** Fictionalist instrumentalism.
      *   **No (Charity Required):** Rationality-constrained interpretivism.
  *   **No (Structure Matters):** Move to **PATCH**.
      *   **Yes (Internal State Suffices):** Causal-role structural realism.
      *   **No (Needs World-Link):** Grounding requirement.
  *   **All Leaves:** Move to **MIRROR**.
      *   **Same Verdict:** Retain position (or Eliminativism if verdict was "No Belief").
      *   **Different Verdict:** Human-exceptionalist skepticism.

  This structure forces a choice between external success and internal structure early. The **SIDECAR** node distinguishes those who think belief is merely predictive utility (fictionalism) from those who think task behavior constitutes the belief (full-strength). **MASSIVE ERROR** separates those requiring coherence from pure predictors. **PATCH** separates realists who need causal grip from those requiring environmental grounding. Finally, **MIRROR** tests consistency: if you deny beliefs to models because of error or structure, must you deny them to humans with similar flaws? If yes, you land in eliminativism; if no, exceptionalism.

  - "Leaves"

  1.  **Full-strength behavioral instrumentalism:** Beliefs are real patterns in behavior; awkwardly implies tables have beliefs.
  2.  **Fictionalist instrumentalism:** Belief talk is useful but not literally true; awkwardly denies truth to successful science.
  3.  **Rationality-constrained interpretivism:** Beliefs require coherence; awkwardly denies beliefs to irrational humans.
  4.  **Causal-role structural realism:** Beliefs are internal causal states; awkwardly attributes beliefs to silent activations.
  5.  **Grounding requirement:** Beliefs need causal history with world; awkwardly makes belief acquisition mysterious.
  6.  **Human-exceptionalist skepticism:** Humans have beliefs, models don't; awkwardly relies on biological essence.
  7.  **Eliminativism:** Nobody has beliefs; awkwardly makes everyday discourse systematically false.

  - "Unoccupied cells"

  Some answer combinations are logically permitted by the questions but philosophically empty. Consider **TABLE No** (behavior insufficient) combined with **MASSIVE ERROR Yes** (prediction suffices). This claims behavior doesn't define belief, yet predictive success does. This is incoherent: if behavior doesn't matter, prediction of behavior shouldn't either. No one defends this because it severs belief from both function and forecast.

  Another empty cell is **PATCH Yes** (internal state suffices) combined with **MIRROR Different Verdict** (exceptionalism). This claims internal causal roles constitute belief in models, but not in humans with identical roles. This is unattractive arbitrary exceptionalism; to occupy it, one would need a non-structural property unique to biology that overrides causal isomorphism.

  Finally, **SIDECAR Avowal** combined with **TABLE Yes**. If behavioral equivalence suffices for belief (TABLE Yes), then inverted avowals (SIDECAR) shouldn't negate belief. Choosing Avowal here contradicts the behavioral premise. To move here, one must argue avowals are a special behavioral class that trumps task performance, a nuanced view rarely held consistently.

  - "Where the tree fails"

  The tree cannot cleanly separate **Fictionalist Instrumentalism** from **Eliminativism**. Both deny literal belief truth; the difference is pragmatic utility versus ontological denial. A case involving successful action based on false belief attribution would be needed to pry them apart.

  Additionally, **Grounding Requirement** and **Human-Exceptionalist Skepticism** often converge on "No Belief" for models. The tree distinguishes them via **MIRROR**, but if a human lacks grounding (e.g., brain-in-a-vat), the Grounding theorist must deny them belief too. A case involving simulated humans with identical causal histories to real ones would test whether grounding is historical or structural.
