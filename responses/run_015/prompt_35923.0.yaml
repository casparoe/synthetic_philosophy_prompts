      *   *Refinement on (2):* The user says experiences are individuals *in a robust sense*. This is the killer. If "this pain" has haecceity, and the pain is physical, then the physical has haecceity. But (1) says no haecceity. This is the strongest contradiction.

      *   *Refinement on the "One Revision":* If they drop (2)'s claim about *robust individuality* and replace it with a structural account of indexicality (e.g., Perry-style or self-locating beliefs within the structure), the whole system stabilizes.

