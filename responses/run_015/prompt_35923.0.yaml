          *   *Alternative Fix:* Drop OSR (1). Cost: Lose QM motivation.

      *   **Tension 2 (The Newman/Quiddity Bind): (3).**
          *   You admit Newman (structure needs content) but ban quiddities (content).
          *   What is the "further fact"? If it's not intrinsic nature, is it causal role? But causal role is structural.
          *   *Verdict:* Internal incoherence in (3).
          *   *Fix:* Accept "Categorical Properties" (quiddities). Cost: Violates (1)/OSR spirit.
          *   *Fix:* Accept Modal Structuralism (causal powers *are* the nature). Cost: Needs robust modality.

      *   **Tension 3 (Emergence of Individuality): (1) + (5).**
          *   Can individuals emerge from non-individuals?
          *   *Verdict:* Controversial but standard OSR move.
          *   *Fix:* Define emergence criteria clearly. Cost: Metaphysical heavy lifting.

      *   **Dissolving:** (3) and (4). They motivate each other.

      *   **The Single Revision:**
          *   Revising (2) is the path of least resistance for a *Philosophy of Physics* student. It keeps the physics ontology clean.
