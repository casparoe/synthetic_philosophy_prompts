      *   (3) **Newman's Problem + No Quiddities:** Structure needs something to structure (not just math). Needs a "further fact" about instantiation. *But* refuses intrinsic natures (quiddities) of relata at the fundamental level.
      *   (4) **Anti-Pythagoreanism:** Universe $\neq$ Mathematical Object. Representation $\neq$ Reality. Distinction between world's structure and math.
      *   (5) **Emergent Individuality:** Macro objects (tables) *are* robust individuals (diachronic identity facts). Individuality emerges between micro and macro.

  3.  **Identify Tensions/Inconsistencies:**

      *   **Tension A: (1) vs. (2) - The Hard Problem of Individuality.**
          *   (1) says fundamental reality has no individuals/haecceities.
          *   (2) says mental states (which supervene on the physical, per physicalism) *do* have robust individuality/haecceity ("this pain is mine").
          *   *Problem:* If the base is purely structural/non-individualistic, how do robust individuals emerge? Usually, emergence preserves or reduces ontology, it doesn't add primitive this-ness. If physicalism is true, the mind is physical. If the physical is non-individualistic (1), how does the mental get individuality (2)?
