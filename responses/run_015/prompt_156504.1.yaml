  2.  **Part 1: Correspondence Table:**
      *   *Goal:* Map the terms from the Nationalism analogy to the Speciesism analogy.
      *   *Citizenship* $\rightarrow$ Species Membership (Human).
      *   *State Apparatus* $\rightarrow$ Human Moral Community / Societal Structure.
      *   *Immigration/Naturalization* $\rightarrow$ Cross-species adoption/uplifting (rare/impossible biologically).
      *   *Cosmopolitan Critic* $\rightarrow$ Animal Rights Advocate / Species Egalitarian.
      *   *Welfare Goods* $\rightarrow$ Moral Consideration / Rights / Resource Allocation.

  3.  **Part 2: Structurally Relevant Disanalogies:**
      *   *Goal:* Find where the map doesn't match the territory.
      *   *Point 1: Contingency vs. Necessity.* Citizenship is legal/social construct; Species is biological fact. One can change citizenship; one cannot change species.
      *   *Point 2: Reciprocity.* Citizenship implies a social contract (taxes, defense, voting). Animals generally cannot participate in this contract. (Note: This risks excluding humans who can't reciprocate).
      *   *Point 3: Arbitrariness.* Cosmopolitans argue birth location is morally arbitrary. Is birth species arbitrary? From a "view from nowhere," yes. From an evolutionary standpoint, it's the basis of kin selection.
      *   *Point 4: Exit Options.* A state can deny entry. A species boundary is impermeable.

  4.  **Part 3: Hidden Assumptions (Whole vs. Parts):**
      *   *Goal:* Unpack the normative weight.
      *   *Assumption:* Moral community is based on mutual benefit/cooperation (Contractarianism).
      *   *Problem:* Marginal Human Cases (infants, severely cognitively impaired). If reciprocity is the key, they lose status. Speciesists usually want to keep them *in* based on species alone.
      *   *Problem:* Social Animals. Dolphins/elephants have complex cooperation. If cooperation is the key, they should be *in*. Speciesists usually keep them *out*.
      *   *Implication:* The analogy smuggles in a "Human Solidarity" pact that relies on biological kinship disguised as political contract.

  5.  **Part 4: The Injection (Scalar Addressability):**
      *   *Concept:* Moral status isn't In/Out (Binary), but a gradient of how much moral address is possible based on capacity for interaction.
      *   *Application to Nationalism:* Do we owe *some* duties to foreigners, just less than citizens? Yes (human rights vs. political rights).
      *   *Application to Speciesism:* Do we owe *some* duties to animals, just less than humans? Yes (welfare vs. rights).
      *   *The Twist:* If status is scalar based on *addressability* (capacity to understand/respond to moral claims), does taxonomy matter?
      *   *Result:* A highly cognitive ape might have higher addressability than a human infant. If the analogy holds strictly to *addressability*, species boundaries blur. The "Citizenship" model (Binary) collapses into a "Capacity" model (Scalar).
      *   *Conclusion:* The analogy fails to justify *strict* species priority if moral address is scalar. It licenses graded obligations, not taxonomic privilege.

  6.  **Part 5: Replacement Analogy & Assessment:**
      *   *Idea:* Linguistic Communities.
      *   *Why:* We prioritize communicating with those who speak our language. It's not "racist" to prefer English speakers for a job in England, but it's not purely biological either. It's about shared practice.
      *   *Idea:* Ecological Niches / Kin Selection.
      *   *Why:* Evolutionary biology explains partiality without needing moral justification.
      *   *Selection:* **Linguistic/Communicative Communities.** It fits the "Addressability" constraint better.
      *   *Assessment:* It handles the scalar nature better (fluency varies). It explains why we prioritize humans (shared language/culture) without claiming biological superiority. *However*, it still struggles with non-linguistic humans (infants) and highly communicative animals (primates).
      *   *Alternative:* **Relational/Contextual Ethics.** Obligations arise from specific relationships, not abstract categories.
      *   *Decision:* Let's go with **Linguistic/Communicative Community** as requested, but note its limits.

  7.  **Drafting the Response:**
