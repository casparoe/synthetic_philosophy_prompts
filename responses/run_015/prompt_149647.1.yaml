  (1) The three split-questions
  The taxonomy employs three binary splits. First, is individual freedom conceptually prior to belonging, or constituted by membership? Second, is value pluralism a permanent feature to accommodate, or does it conceal a shared ethos politics should realize? Third, when obligations conflict with exit, does the right to leave take unconditional priority, or is it conditional/non-existent? These diverge on the case of a member leaving a religious community mandating worship. Liberals prioritize the individual's choice to exit; communitarians weigh the community's survival or the member's constituted identity against that choice.

  (2) The tree with all eight leaves
  Each leaf combines answers to Priority, Pluralism, and Exit:
  1. Freedom Prior/Pluralism Permanent/Exit Unconditional: Rawlsian Political Liberalism. Awkward: Must treat comprehensive doctrines as private preferences rather than truth-claims to maintain neutrality.
  2. Freedom Prior/Shared Ethos/Exit Unconditional: Perfectionist Liberalism. Awkward: Must promote specific goods while claiming to respect individual autonomy equally across conflicting lives.
  3. Freedom Prior/Pluralism Permanent/Exit Conditional: Unnamed Leaf A. Awkward: Claims freedom is prior yet restricts the ultimate exercise of choosing one's associations, creating a paradox of liberal coercion.
  4. Freedom Prior/Shared Ethos/Exit Conditional: Unnamed Leaf B. Awkward: Enforces a conception of the good while denying the community authority to bind members permanently, risking paternalistic contradiction.
  5. Constituted/Pluralism Permanent/Exit Unconditional: Taylor-style Recognition Communitarianism. Awkward: Must validate identities dialogically without freezing them into essentialist categories that deny growth.
  6. Constituted/Pluralism Permanent/Exit Conditional: Civic Republicanism. Awkward: Demands civic virtue from citizens who remain legally free to pursue private vices exclusively, risking civic decay.
  7. Constituted/Shared Ethos/Exit Unconditional: Civic-Nationalist Communitarianism. Awkward: Requires deep national solidarity while permitting citizens to legally renounce that identity without penalty.
  8. Constituted/Shared Ethos/Exit Conditional: MacIntyre-style Tradition Communitarianism. Awkward: Treats leaving a tradition as rational suicide rather than a legitimate exercise of agency.

  (3) Unoccupied spaces and separation failures
  Unnamed Leaf A (Prior/Plural/Cond) is diagnosed as incoherence: prioritizing freedom while blocking exit contradicts the core liberal premise of voluntary association. Unnamed Leaf B (Prior/Ethos/Cond) represents unattractiveness: a paternalistic liberalism that imposes goods without communal authority. Regarding separation, Leaf 7 (Civic-Nationalist) and Leaf 8 (MacIntyre) are difficult to genuinely separate. Both posit a constituted identity within a shared ethos; distinguishing them solely on the technical right to exit ignores that nationalism often makes exit socially impossible, mirroring MacIntyre's rational suicide.

  (4) Note on taxonomy difference
  Standard textbooks typically contrast liberalism and communitarianism as monolithic blocks defined by authorship. This instrument differs by dissecting internal fractures within each camp, such as separating Rawlsian neutrality from Perfectionist liberalism via pluralism commitments. It prioritizes logical consistency over disciplinary labels, revealing that some "liberal" positions share more structural DNA with communitarianism than with other liberals regarding exit rights and constitutive belonging.
