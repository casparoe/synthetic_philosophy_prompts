answer: |-
  # Framing Doc: Desiderata for Reduction and Emergence

  ## 1. The Core Distinction
  Before listing requirements, we must disentangle three claims that are routinely conflated in the literature. A working scientist needs to know which one is at stake when a colleague claims a phenomenon is "emergent."

  1.  **Ontological Distinctness:** Do the macro-properties/entities exist *over and above* the micro-constituents? (Metaphysics)
  2.  **Derivational Transparency:** Can the macro-laws be logically/mathematically derived from the micro-laws plus bridge principles? (Logic/Math)
  3.  **Predictive Autonomy:** Is the macro-model required to generate accurate predictions or control the system, even if a derivation exists in principle? (Practice/Epistemology)

  **Analysis of the Conflation:**
  *   **Autonomy of the Special Sciences:** Arguments for autonomy primarily rely on **Predictive Autonomy** (it is computationally intractable or epistemically inaccessible to use the micro-model) and secondarily on **Ontological Distinctness** (to justify funding the special science as studying "real" things). They do *not* strictly require the failure of **Derivational Transparency**, though they often imply it.
  *   **What "Emergent" Usually Means:** When scientists call something emergent, they almost always mean **Predictive Autonomy** (you can't get the answer from the micro-model without essentially simulating the whole system or adding new parameters). However, they often *slide* into claiming **Ontological Distinctness** (it's a "new kind of thing") without justification. A rigorous account must prevent this slide.

  ---

  ## 2. The Desiderata
  Any account of reduction/emigration offered in this seminar must satisfy the following five requirements. I have flagged which are genuine constraints on a working theory and which are specific metaphysical demands.

  ### D1. The Bridge-Principle Constraint (Derivation)
  **Requirement:** A reduction must specify the mapping between micro-vocabulary and macro-vocabulary. Mere deducibility is insufficient because the macro-terms (e.g., "temperature," "fitness") do not appear in the micro-equations.
  **Case:** In statistical mechanics, you cannot derive thermodynamics from mechanics without a bridge principle linking mean kinetic energy to temperature.
  **Constraint vs. Demand:** *Genuine Constraint.* Without this, "derivation" is just wordplay. However, the demand that these bridges be *analytic* or *a priori* is a camp demand (logical empiricism); for a scientist, they need only be empirically stable.

  ### D2. The Robustness Requirement (Decoupling)
  **Requirement:** The account must explain why certain macro-regularities persist despite variations in micro-details (universality, critical phenomena).
  **Case:** Fluid dynamics works for water and oil despite different molecular microstructures. A reduction that ties the macro-behavior too tightly to specific micro-parameters fails to capture why the macro-behavior is *decoupled*.
  **Constraint vs. Demand:** *Genuine Constraint.* If a reduction implies the macro-behavior should change when it demonstrably does not, the reduction is empirically false. This is often where strict Nagelian reduction breaks.

  ### D3. The Exclusion Constraint (Causal Efficacy)
  **Requirement:** The account must specify what causal work the macro-level performs, given the causal completeness of the micro-level.
  **Case:** If a neuron firing is fully determined by ion channels and physics, what causal work does "belief" or "spike rate" do?
  **Constraint vs. Demand:** *Camp Demand.* This is only a constraint if you assume macro-properties must be *causally potent* in a non-redundant way. An eliminativist can satisfy the science without satisfying this (by saying the macro does no work). However, for a scientist using macro-models for intervention, this is a *practical* constraint: if the macro-variable doesn't track a causal lever, the model is useless for control.

  ### D4. The Ontology Requirement (Existence)
  **Requirement:** The account must state whether macro-properties are identical to micro-configurations, distinct existences, or merely useful fictions.
  **Case:** Is a "vortex" in a fluid a real object or a pattern in the water?
  **Constraint vs. Demand:** *Camp Demand.* A working scientist can often remain agnostic here ("Shut up and calculate"). However, if the seminar aims to discuss emergence as a feature of the *world* rather than our *models*, this is required.

  ### D5. The Independent Fixability Requirement (Anti-Phantom)
  **Requirement:** The parameters and boundary conditions used in the micro-to-macro derivation must be fixable *independently* of the macro-phenomenon being derived.
  **Case:** (See Section 3 below).
  **Constraint vs. Demand:** *Genuine Constraint.* Without this, any micro-model can be "reduced" to any macro-behavior by tuning.

  ---

  ## 3. The Phantom Reduction Requirement
  You identified a specific failure mode: **Phantom Reduction**. This occurs when a micro-model is tweaked (fitted parameters, ad hoc boundary terms) until it reproduces macro-data, declared a "derivation," but offers no explanatory gain and predicts nothing outside the fitted regime.

  **The Requirement:** **Independent Fixability of Bridge Conditions.**
  For a reduction to be adequate, the bridge principles and micro-parameters required to derive the macro-behavior must be measurable or justifiable *without* referencing the macro-behavior itself.

  **Argument for this Constraint:**
  If you must observe the macro-behavior to set the parameters of the micro-model that is supposed to *predict* the macro-behavior, you have not reduced the macro to the micro; you have merely translated the macro data into micro-language. This is curve-fitting, not explanation.
  *   **Novel Prediction:** The reduced model must predict macro-behavior in a regime *not* used to fix the bridge parameters.
  *   **Stability:** The derivation must hold under small perturbations of the micro-assumptions. If changing a micro-parameter by 1% destroys the macro-derivation, but the actual macro-system is stable, the reduction is phantom.

  **Satisfiability:**
  This is highly restrictive. In Effective Field Theories and Renormalization Group (RG) approaches, "parameters" are often *defined* by the behavior at a certain scale. Strict Independent Fixability may be impossible in complex systems where micro-parameters are renormalized *by* the macro-context.
  **Relation to Multiple Realizability (MR):**
  This is **independent** of MR.
  *   **MR** says: Many different micro-states yield the *same* macro-state.
  *   **Phantom Reduction** says: One specific micro-model is rigged to yield *one* macro-state.
  You can have Phantom Reduction without MR (a single rigid micro-model fitted to data). You can have MR without Phantom Reduction (a robust derivation showing *why* diverse micro-states yield the same macro-state, e.g., via RG fixed points). The Anti-Phantom requirement targets *ad hoc fitting*; MR targets *heterogeneity of realization*.

  ---

  ## 4. Joint Unsatisfiability
  **Yes.** The following subset is jointly unsatisfiable:
  1.  **D1 (Ontological Distinctness):** Macro-properties are distinct existences over and above micro-configurations.
  2.  **D2 (Derivational Transparency):** Macro-laws are strictly derivable from micro-laws + bridges.
  3.  **D3 (Causal Non-Redundancy):** Macro-properties have causal powers not exhausted by the micro-properties.

  **Why:** This is the classic Exclusion Problem.
  *   If Macro is derivable from Micro (D2) and Micro is causally complete (standard physics assumption), then Micro determines all effects.
  *   If Macro is distinct (D1), it is not identical to Micro.
  *   If Micro determines all effects, and Macro is distinct, Macro is causally redundant (violates D3).
  *   To save D3, you must deny Micro causal completeness (dualism?) or deny D2 (brute emergence).
  *   To save D2 and D3, you must deny D1 (identify Macro with Micro, i.e., Reductionism).

  **For the Scientist:** The tension that actually breaks modelling practice is between **D2 (Derivation)** and **D5 (Robustness/Universality)**.
  If a macro-behavior is universal (insensitive to micro-details), a strict derivation from *specific* micro-details is often mathematically singular or requires taking limits (infinity, zero) that do not exist in the physical system. You cannot have a strict derivation from *actual* finite micro-physics that explains *why* the micro-physics doesn't matter.

  ---

  ## 5. Ranking the Requirements

  **Most Work (The Exclusionary Constraint):**
  **D5 (Independent Fixability / Anti-Phantom).**
  This requirement kills the largest number of candidate accounts. Most "reductions" in complex systems (climate, econ, bio) involve tuning micro-parameters to match macro-data. D5 forces us to admit these are effective models, not fundamental reductions. It separates *explanation* from *simulation*.

  **Drop First (The Sacrifice):**
  **D1 (Ontological Distinctness).**
  For the purpose of action-guiding science, whether a "population" or a "vortex" *really exists* as a distinct entity matters less than whether the model tracks causal levers reliably. We can treat macro-entities as "real for all practical purposes" (FAPP) without settling the metaphysics. Dropping D1 allows us to keep D2, D3, and D5 consistent (by treating macro-properties as logically distinct but ontologically dependent patterns).

  ---

  ## 6. Scorecard of Familiar Views

  | View | D1 (Ontology) | D2 (Derivation) | D3 (Causal/Exclusion) | D4 (Robustness) | D5 (Anti-Phantom) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Bridge-Law (Nagelian)** | **Fail.** (Usually assumes identity or eliminativism). | **Pass.** (By definition). | **Fail.** (Macro is causally redundant). | **Fail.** (Too sensitive to specific micro-laws; struggles with universality). | **Fail.** (Bridge laws are often phenomenological fits, not independently fixed). | **Too rigid.** Works for simple physics, breaks for complex systems. Fails the scientist's need for robustness. |
  | **Limit/Approximation (RG/Batterman)** | **Pass.** (Macro structures are real patterns stabilized by limits). | **Mixed.** (Derivation requires singular limits/mathematical idealizations not present in reality). | **Pass.** (Macro stability explains causal efficacy). | **Pass.** (Explicitly explains why micro-details drop out). | **Pass.** (Mathematical structure explains stability, not parameter fitting). | **Best for Practice.** Captures why macro-models work even when micro-derivations are singular. |
  | **Causal Powers (Non-Reductive)** | **Pass.** (Macro powers are distinct). | **Fail.** (Denies derivation is possible or relevant). | **Pass.** (Macro powers are fundamental). | **Mixed.** (Often asserts robustness without explaining the mechanism). | **Fail.** (Often relies on "downward causation" which risks phantom mechanisms). | **Metaphysically Satisfying, Practically Empty.** Tells the scientist "your model is real" but not "how to build it from below." |

  **Summary for the Seminar:**
  If the goal is to guide modelling practice, the **Limit/Approximation** view satisfies the most critical desiderata (Robustness and Anti-Phantom), even if it relaxes strict Derivation. The **Bridge-Law** view is too fragile for complex systems. The **Causal Powers** view protects the scientist's intuition that macro-variables matter but offers no technical account of how they relate to the micro-base.
