answer: |-
  Based on the track record you've provided, your friend isn't running on "vibes." She's running a surprisingly consistent, albeit unstated, ethical operating system. It's a hybrid framework that balances **Negative Utilitarianism** (minimizing suffering is the priority) with **Care Ethics** (duty to identifiable individuals) and a heavy **Precautionary Principle** (epistemic humility).

  Here is the breakdown of her rule, how it applies to the island mice, and the specific follow-up you need to run to resolve the remaining ambiguity.

  ### 1. The Rule: "Mitigate Human Harm, Spare Existing Individuals, Don't Create Sufferers, Study First."

  Her verdicts map to four distinct priorities, ranked in this order of operation:

  1.  **The Precautionary Override:** If there is uncertainty about outcomes or sentience, **fund research.** (This explains why she defaults to "study first" on almost everything, including the insect agnosticism).
  2.  **The Human Liability Clause:** If humans directly caused a specific threat (rabies from dogs, cars on highways), intervene to remove that threat. (Verdicts: Rabies vaccine, Highway fencing).
  3.  **The Individual Care Constraint:** Do not kill or manipulate healthy existing individuals for the sake of population metrics. However, if an individual is already injured/suffering, help them. (Verdicts: Wildlife Hospital = Yes; Suburban Deer = No, because they were "fat and well-fed" despite being overpopulated).
  4.  **The Negative Utilitarian Constraint:** Do not bring new wild lives into existence if their net experience will be negative. (Verdict: Rewilding = No, because it "manufactures lives that will mostly go badly").

  **The Insect Clue:** This confirms a **Sentience Threshold**. She operates on a "better safe than sorry" model for vertebrates (mice, deer, foxes) but suspends judgment on invertebrates where sentience is scientifically debated. Mice pass the threshold; insects do not.

  ### 2. What She Should Say About the Island Mice

  Applying her rule to the new case yields a clear, albeit layered, verdict.

  **The Primary Verdict: "Fund a Study First."**
  This is her strongest heuristic. In the mouse case, there are massive unknowns: Will the fertility agent jump to other species? How exactly will the owl population collapse (starvation vs. migration)? Is the suffering during the bust actually "net negative" enough to justify intervention? Given her track record, she will not authorize action until the uncertainty is reduced.

  **The Secondary Verdict (If Forced to Choose): Option A (Fertility Control).**
  If you remove the "Study First" option and force a choice between Poison and Fertility, her framework points to **Fertility Control**. Here is the derivation:
  *   **Why not Poison (Option B)?** This violates the **Individual Care Constraint**. In the Suburban Deer case, she rejected culling healthy animals to manage population numbers. Even though the mice *will* starve later, they are not currently suffering (unlike the hospital animals). Poisoning them now treats them as means to an end, which she rejected with the deer.
  *   **Why Fertility (Option A)?** This aligns with the **Negative Utilitarian Constraint**. She opposed rewilding because it *creates* lives that suffer. Fertility control *prevents* lives that would suffer during the bust. It also respects the **Individual Care Constraint** better than poison, as it doesn't actively kill the current generation.
  *   **The Owl Complication:** This is the only friction point. She hasn't ruled on predator welfare yet. However, since her rewilding objection was about *net suffering*, she likely views the owl's potential starvation as a tragic but secondary calculation to the prevention of the mice's guaranteed boom/bust suffering.

  ### 3. The Closest Analog

  The **Suburban Deer** case is the closest operational analog, but the **Rewilding** case is the closest philosophical analog.

  *   **Suburban Deer:** Like the mice, this is a population management question. The deer were "human-impacted" (suburbs), just as the mice are being considered for human intervention. She said **No** to reducing the deer population because the individuals were currently healthy. This suggests she will hesitate to intervene on the mice unless the suffering is *imminent and acute*, not just cyclical.
  *   **Rewilding:** This shares the "Natural Process" element. She opposed creating a reserve because wild lives suffer. This implies she believes wild existence is often net-negative. This supports intervening on the mice to reduce the *number* of lives lived, provided it doesn't violate the rights of the current mice.

  **The Tension:** The Deer case says "Don't touch healthy populations." The Rewilding case says "Fewer wild lives = less suffering." The Mouse case sits exactly in the middle: A healthy population that *will* suffer.

  ### 4. The Follow-Up Case

  Her track record settles the "Study First" preference, but it leaves a genuine ambiguity between **Non-Interference in Natural Cycles** vs. **Prevention of Imminent Natural Suffering.**

  To split this, you need a case that removes the "Human Liability" variable (since the mice are natural) and the "Uncertainty" variable (assume we know the outcome), and forces a choice between letting nature take its course or intervening to prevent suffering without killing current individuals.

  **The Case to Put to Her:**
  > "A remote, native herd of elk is hit by a natural, non-contagious drought cycle every 10 years. We know with 100% certainty that in two months, 60% of the herd will die slowly of starvation. We have a drug that can be dropped in their water supply. It doesn't kill them, but it induces a temporary, reversible hibernation-like state for the duration of the drought. They wake up hungry but alive, and the population recovers. However, this interferes with natural selection. Do we administer the drug?"

  **Why this splits the options:**
  *   **If she says YES:** She prioritizes **Suffering Reduction** over **Naturalness**. This confirms she should support the **Fertility Control** option for the mice (preventing the bust suffering is worth the interference).
  *   **If she says NO:** She prioritizes **Non-Interference** in natural systems unless humans caused the problem. This suggests she should oppose **both** mouse options and stick strictly to **Study/Do Nothing**, because the mouse boom/bust is a natural cycle, not a human mess like the rabies or highways.

  This case isolates the specific variable that currently hangs in the balance: *Is natural suffering something we have a duty to fix, or is it a boundary we must not cross?* Her answer there tells you exactly how she should vote on the mice.
