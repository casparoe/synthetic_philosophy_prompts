prompt: |-
  You are a decision theorist and moral philosopher with genuine expertise in the normative status of tiny probabilities attached to enormous values: unbounded versus bounded value functions, stochastic-dominance-style decision rules, the epistemology of low-probability high-stakes hypotheses, and the arguments that connect this territory to long-termist practical reasoning. Please think carefully and at length before answering. I would find it useful if you began with unstructured brainstorming first: lay out, in rough form, at least six distinct ways the position below could fail, including ones you are initially inclined to dismiss as question-begging, before you start ranking or adjudicating anything. Do not give me a literature review or a reading list; I want the arguments themselves, in your own terms.

  Context: I spent three hours last night arguing with a friend about expected value fanaticism, and I came away holding a position I would rather have stress-tested than defended. Here it is, stated as precisely as I can.

  I accept fanaticism: for any positive probability p, however small, and any finite good G, there is some finite good G' large enough that a certainty of G is worse than a p-probability of G'; and correspondingly, a rational agent whose value function is unbounded above ought always to maximize expected value, however long the odds.

  My argument for it, which I will call Inheritance, runs as follows. Take a large world: an agent facing a long run of decisions of the same shape, with outcomes that are probabilistically and causally independent of one another, and no borrowing or insurance constraints. In that setting maximizing expected value in each decision is not merely permissible but obviously right, since aggregate outcomes concentrate around the sum of expectations and any rival rule predictably leaves the agent worse off in the sense she herself accepts. Now take the small world: a single decision of exactly that shape. The only difference between the two cases is the existence, elsewhere, of further decisions that are independent of this one, that I have no control over, and whose number I may have no evidence about. I claim that what I ought to do here cannot depend on whether such decisions exist. So permissibility inherits downward from the sequence to the single case, and the one-shot fanatical verdicts are correct.

  I have exactly one safety valve, which I will call Evidential Proportionality: the decision weight I give to a hypothesis should be discounted by the reliability of the process that produced my probability for it, so that probabilities generated by processes with no track record, no calibration data, or an unbounded space of rivals get heavily discounted. I invoke this to defuse mugging-style cases, and I invoke it to explain why real-world long-shot reasoning is not as crazy as the abstract fanatical verdicts sound.

  Here is what I want from you.

  First: I suspect Evidential Proportionality is in trouble, and I want to know whether the trouble is real. Any purely multiplicative discount leaves fanaticism fully intact, because a positive weight, however discounted, is still beaten by a large enough ceiling; so either my safety valve is too weak to defuse anything, or it is not really a discount but a truncation, in which case it is doing all the work and my fanaticism is decorative. Is that dilemma genuine, is there a third option, and if the valve is doing all the work, would an honest proponent of my position have to admit she has become a bounded-value theorist in everything but name?

  Second: what would count against the package of fanaticism plus Inheritance plus Evidential Proportionality, ranked from fatal to merely awkward? I want the defeaters sorted into kinds, and I want you to say which kind you take to be most telling for a view like this. Cases and intuitions, including ones I have not mentioned. Formal results, such as the fact that unbounded value plus a modest dominance principle seems to entail fanaticism, so that escaping it costs me bounded value or something else I would hate to lose: if I have misdescribed that landscape, or if the escape routes are cheaper or more numerous than I think, say so, because that would itself be a defeater. Consequences I am committed to that might be unacceptable: I have in mind especially that a fanatic looks obliged to spend nearly all her resources investigating whichever hypothesis has the highest ceiling rather than doing anything else, and that a fanatic's ranking of ordinary options is controlled by facts about the upper tail that no possible evidence could ever distinguish between. And structural results: I want to know whether my position collapses into a rival, whether it can be shown to forbid what it requires, and whether it is exploitable or cyclically incoherent in any way.

  Third: which of these defeaters would a committed fanatic concede as genuinely counting against the view, and which would she rightly dismiss as intuition-mongering, as presupposing the bounded-value conclusion, or as complaining that the view is demanding rather than wrong? I would like the friend's objections and the insider's concessions kept separate.

  Fourth: an honest assessment of exposure. Is my position insulated? Given that its verdicts are determined by ceilings and by ultra-low-probability structure, is there any argument, case, or development that could in principle move me, or have I qualified the view into something unfalsifiable? And if I have, is that a problem for a view of this kind, or is it in order, because a thesis in normative axiology is answerable only to coherence and agglomeration constraints and not to evidential checks? I am genuinely unsure which way to go here and I want your actual view, not a diplomatic one.

  Fifth: what does my position predict that its rivals do not? What verdicts does fanaticism issue that bounded-value, tempered, or stochastic-dominance views withhold, and are the differences ones I should be embarrassed by or proud of? Relatedly, does the case for fanaticism get stronger or weaker once I know that many other agents face structurally similar choices with independent outcomes, and does the answer to that support or undercut Inheritance?

  Two last things. The friend's strongest move, as I recall it, was that the abstract fanatical verdicts have already shown up in the wild: real people now allocate serious resources to interventions whose case rests on a very small probability of an astronomically large payoff. Tell me whether the existence of that practice is any evidence at all for or against the view, or whether it is dialectically inert. And what would move me most, I think, is not a case where fanaticism yields a verdict I find uncomfortable but a demonstration that it is incoherent or self-defeating, or that Inheritance smuggles in something false about independence; a demonstration that it is merely very demanding would move me much less, and I would like you to tell me if you think that ranking of mine is itself a mistake.
