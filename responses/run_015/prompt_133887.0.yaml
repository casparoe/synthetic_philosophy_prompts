answer: |-
  # Question: The Headline Game (25 Marks)

  **Context:** You are analysing a strategic interaction between two competing online news outlets, *The Beacon* (Row Player) and *The Clarion* (Column Player). They are deciding how to frame a breaking science story. *The Beacon* has three headline options (Top, Middle, Bottom); *The Clarion* has two (Left, Right). Payoffs represent expected click-through rates (in thousands).

  **Part 1: Construction (10 marks)**
  Construct a $3 \times 2$ payoff matrix for *The Beacon* (row player) such that:
  1.  The **Bottom** strategy is strictly dominated by a **mixed strategy** involving Top and Middle.
  2.  The **Bottom** strategy is **not** strictly dominated by either Top or Middle played purely.
  *Show your matrix and demonstrate the arithmetic for the domination.*

  **Part 2: Order of Elimination (5 marks)**
  Suppose we allow elimination using mixed-strategy dominators. If we iteratively eliminate strictly dominated strategies, does the order in which you remove strategies matter for the final set of surviving profiles? State clearly whether order matters or does not matter, and justify your answer using the logic of strict dominance (no formal proof required, but intuition must be clear).

  **Part 3: The Three-Player Wrinkle (10 marks)**
  A common heuristic in political science is: "A rational player never plays a strategy that is never a best response to any belief about opponents."
  1.  In a **2-player** game, is "Never a Best Response" equivalent to "Strictly Dominated by a Mixed Strategy"?
  2.  Does this equivalence hold in a **3-player** game (where you face two opponents playing independently)?
  3.  If the answer changes, briefly explain why the machinery breaks down when a second opponent is added.

  ***

  # Model Answer

  **Part 1: Construction**
  To satisfy the conditions, *The Beacon's* Bottom strategy must perform poorly against both of *The Clarion's* choices compared to a weighted average of Top and Middle, yet outperform at least one of them in isolation to avoid pure dominance.

  | *The Beacon* \ *The Clarion* | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 0 | 4 |
  | **Middle** | 4 | 0 |
  | **Bottom** | 1 | 1 |

  *Verification:*
  Consider a mixed strategy $\sigma$ where *The Beacon* plays Top with probability $0.5$ and Middle with probability $0.5$.
  *   If *The Clarion* plays **Left**: Expected payoff for $\sigma = 0.5(0) + 0.5(4) = 2$. Since $2 > 1$ (Bottom's payoff), $\sigma$ beats Bottom.
  *   If *The Clarion* plays **Right**: Expected payoff for $\sigma = 0.5(4) + 0.5(0) = 2$. Since $2 > 1$, $\sigma$ beats Bottom.
  Thus, Bottom is strictly dominated by the mix. However, Bottom (1) is better than Top (0) against Left, and better than Middle (0) against Right. Therefore, Bottom is not dominated by any pure strategy.

  **Part 2: Order of Elimination**
  The order **does not matter**.
  Strict dominance implies that a strategy yields a lower payoff than another available strategy (or mix) regardless of what the opponent does. If Strategy A is strictly dominated by Strategy B, removing a third Strategy C does not change the fact that B beats A. Unlike *weak* dominance (where removing a column might make a row no longer weakly dominated), *strict* dominance is robust to the reduction of the game space. As long as the dominating strategy itself hasn't been eliminated (which it won't be, because it performs better than the dominated one), the elimination order cannot change the final surviving set.

  **Part 3: The Three-Player Wrinkle**
  1.  **2-Player Game:** Yes, the equivalence holds. If a strategy is never a best response to any probability distribution over the opponent's strategies, it is strictly dominated by some mixed strategy (and vice versa). This is a fundamental result of zero-sum-like geometry in 2-player interactions.
  2.  **3-Player Game:** No, the equivalence **fails**.
  3.  **Explanation:** In a 3-player game, you form beliefs about two opponents. If we assume opponents play independently (standard Nash assumption), the set of possible belief profiles is restricted to *product distributions*. A strategy might be never a best response against any independent mix but still not be strictly dominated. This is because strict dominance requires the strategy to be worse than a mix against *all* opponent profiles (including correlated ones), whereas "never a best response" only checks against independent beliefs. There are "gaps" in the independent belief space where a strategy isn't optimal, yet no single mixed strategy dominates it across all possible opponent combinations. Thus, in 3+ player games, "Strictly Dominated" is a stricter condition than "Never a Best Response."

  ***

  # Marking Scheme

  | Part | What a full-marks answer must do | Marks | The specific mistake that should cost marks here |
  | :--- | :--- | :--- | :--- |
  | **1** | Provide a valid 3x2 matrix. Show arithmetic that a mix (e.g., 50/50) beats the dominated row in both columns. Show arithmetic that pure rows do not beat the dominated row in both columns. | 10 | Using a matrix where pure dominance exists (e.g., Bottom is lower than Top in all cols); failing to show the mix calculation explicitly. |
  | **2** | State clearly that order does not matter. Explain that removing other strategies doesn't change the payoff inequality between the dominated and dominating strategy. | 5 | Claiming order matters (confusing with weak dominance); claiming it matters only for mixed strategies; vague hand-waving without referencing payoff inequalities. |
  | **3** | State equivalence holds for 2-player. State equivalence fails for 3-player. Explain that independent beliefs (product distributions) create a subset of possible opponent profiles, allowing strategies to be NBR but not dominated. | 10 | Claiming equivalence holds for 3-player; claiming equivalence fails for 2-player; confusing "correlated opponents" with "independent opponents" in the explanation. |
  | **Total** | | **25** | |

