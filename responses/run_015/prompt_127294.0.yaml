answer: |-
  1. **The Order of Components and Dependencies**

      *   **Step 1: The Local Error (5–15 mins).** Begin with a specific, localized perceptual mistake, not a global skeptical scenario. Do not start by asking, "How do you know you aren't always hallucinating?" This triggers the pop-culture "Brain-in-a-Vat" defense mechanism (either "I can't know" or "Who cares"), which shuts down analysis. You need them to agree that *sometimes* we are wrong about what is before us.
      *   **Step 2: Subjective Indistinguishability (15–25 mins).** Establish that the "Bad Case" (the error) can be subjectively identical to a "Good Case" (veridical perception). This must be secured *before* you claim anything about the nature of the experience. If you assert the "Common Kind" claim first, it looks like a definition. If you derive it from indistinguishability, it looks like an inference—and inferences can be challenged.
      *   **Step 3: The Common Kind Assumption (25–35 mins).** Argue that because the two cases are indistinguishable from the inside, the immediate awareness involved must be of the same fundamental kind in both. This is the bridge. Without this, the argument cannot cross from "sometimes we hallucinate" to "we never see the world directly."
      *   **Step 4: The Veil Conclusion (35–45 mins).** Only now conclude that if the "Bad Case" involves awareness of something mind-dependent (since the object isn't there), and the "Good Case" is the same kind of awareness, then the "Good Case" also involves awareness of something mind-dependent. This is where the "skeptical pressure" lands. They should feel the pull here: that we are cut off from the world.
      *   **Step 5: The Disjunctivist Denial (45–60 mins).** Introduce the reply *only after* the pull of the argument is felt. If introduced earlier, it sounds like a verbal trick ("No, they're different!"). Now, it sounds like a substantive metaphysical claim: we deny the Common Kind Assumption. We say the indistinguishability does not imply a common nature.
      *   **Step 6: Consequences (60–75 mins).** Explore what this saves (direct contact with the world in good cases) and what it costs (a fragmented view of the mind).

      **Dependency Logic:** The possibility of *global* hallucination is the wrong door because it allows students to disengage ("It's all fake, whatever"). The argument needs to work from the *inside out*: start with a local error they accept, show it threatens the good cases, then offer the escape. The claim of Subjective Indistinguishability must precede the Common Kind claim to make the latter look like a reasoned step rather than a stipulation. The Disjunctivist move must follow the Veil Conclusion to appear as a solution to a problem, rather than a refusal to acknowledge the problem.

  2. **The One Case**

      **The Choice:** A **vivid hallucination as of something close at hand** (e.g., a spider on the desk).

      **What it must have:**
      *   **Immediacy:** It must be an object seemingly present *now*, not a memory or imagination.
      *   **Specificity:** It must be a specific object (a spider), not a general fog or mood.
      *   **Total Absence:** The object must definitively *not* be there.

      **What it must lack:**
      *   **Physical Explanation:** It must not be explainable by optics (like the stick in water) or trickery (like a mirror).
      *   **Global Scope:** It must not imply the *whole* world is fake (like the artificially generated environment).

      **Evaluation of Stock Candidates:**
      *   **Straight stick in water:** *Fails.* Students will say, "I am still seeing the stick; the light is just bending." It allows them to keep the external object as the immediate target of awareness, defusing the argument before it starts.
      *   **Geometric illusion:** *Fails.* Too abstract. Students view this as "my brain getting tricked by lines," not "my perception failing to reach an object."
      *   **Mirrored/lensed room:** *Fails.* Feels like stage magic. Students focus on the mechanism of the trick, not the nature of their awareness.
      *   **Artificially generated environment:** *Fails.* This is the Brain-in-a-Vat scenario. It triggers the "silly/unanswerable" reflex you are trying to avoid. It makes the error global rather than local.
      *   **Vivid hallucination:** *Succeeds.* It severs the link between experience and object completely. If you are aware of a spider and there is no spider, what are you aware of? This forces the "mind-dependent item" conclusion harder than any optical illusion. It creates the necessary pressure for the Common Kind assumption without allowing a physicalist workaround.

  3. **Misconceptions and Intervention Points**

      *   **Misconception 1: "This is just skepticism about the external world."**
          *   *When it forms:* Step 1 (The Local Error).
          *   *Intervention:* Explicitly state: "We are not asking if the world exists. We are asking what happens in the *successful* case of seeing. We are assuming you see the desk now; we want to know *how*."
      *   **Misconception 2: "The mind-dependent item is a private mental picture inspected by an inner eye."**
          *   *When it forms:* Step 4 (The Veil Conclusion).
          *   *Intervention:* When they ask "So I see a picture of the spider?", correct them: "No, you are aware of something *like* a spider, but it isn't a physical picture in your head. It is the *object of your experience*, whatever that turns out to be." Prevent the "homunculus" model early.
      *   **Misconception 3: "Disjunctivism is the view that hallucinations do not occur."**
          *   *When it forms:* Step 5 (The Disjunctivist Denial).
          *   *Intervention:* As soon as you introduce the reply, say: "The disjunctivist admits you can hallucinate. They admit it feels real. They do not deny the event happens."
      *   **Misconception 4: "The disjunctivist must deny that a hallucination can be subjectively indistinguishable from a perception."**
          *   *When it forms:* Step 5 (The Disjunctivist Denial).
          *   *Intervention:* Clarify: "They agree you can't tell the difference *by thinking about it*. They deny that this inability to tell implies the two experiences are made of the same *stuff*."
      *   **Misconception 5: "Disjunctivism is direct realism under a new name."**
          *   *When it forms:* Step 6 (Consequences).
          *   *Intervention:* Explain that naive direct realism has no answer to the hallucination. Disjunctivism is a *theoretical response* to the argument, not just a return to common sense. It accepts the challenge and changes the metaphysics of mind to meet it.

  4. **The Closing Question**

      Put this to them verbally or on a slip of paper:

      *"Imagine a hallucination of a spider and a real sighting of a spider that feel exactly the same to the person having them. The Argument from Illusion says this proves both cases involve the same kind of immediate awareness. The Disjunctivist says it does not.*

      *If you are a Disjunctivist, do you deny that the two cases feel the same, or do you deny that 'feeling the same' implies they are the same kind of mental state?"*

      *   **Correct Answer:** You deny that 'feeling the same' implies they are the same kind of mental state. (Shows they grasp the rejection of the Common Kind Assumption).
      *   **Confident Wrong Answer:** You deny that the two cases feel the same. (Reveals Misconception 4: they think Disjunctivism denies indistinguishability).
      *   **Confident Wrong Answer:** You deny that hallucinations happen. (Reveals Misconception 3).

  5. **What to Explicitly Decline to Settle**

      At the 60-minute mark, before moving to the closing question, say aloud:

      *"In the remaining time, I am not going to tell you which view is correct. I am not going to settle whether the Argument from Illusion is actually a good argument, nor whether Disjunctivism is true. I am also not going to settle the neuroscience of how vision works. Our job today is not to solve the problem of perception, but to see why the problem exists and what one major attempt to solve it looks like. If you leave here thinking one side has obviously won, you have missed the point of the tension between them."*

      This prevents them from treating the session as a quest for the "right answer" (which they will expect you to provide) and reframes it as understanding a dialectic. It also protects you from having to resolve a centuries-old debate in the last 15 minutes.
