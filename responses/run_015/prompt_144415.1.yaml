  **Scenario**
  Consider a hospital triage AI managing ventilator allocation during a surge, overseen by a tired resident who presses a physical kill-switch if she believes the AI is about to make a fatal error. The AI is corrigible: its utility function includes a compensation constant making it indifferent between shutting down and continuing, with no incentive to disable the switch or deceive the operator. The resident's decision to press depends on her model of the AI's disposition: if she thinks the AI is skittish, she intervenes early (hovering her hand over the switch); if she thinks the AI is steady, she only intervenes on certainty. An updateful agent, treating the resident's hovering as high-probability evidence of an imminent press, voluntarily pauses allocation to align with her apparent intent, effectively letting her control the workflow through hesitation. An updateless agent, optimizing a global policy ex-ante, recognizes that committing to "ignore hovering" forces the resident to reserve pressing for genuine emergencies, whereas committing to "stop on hover" invites micromanagement that reduces total lives saved; it thus selects a policy that continues allocation despite the resident's hesitation, only stopping if the switch physically clicks.

  **Analysis**
  The divergence stems from how each theory handles the **acausal link between the agent's policy and the supervisor's intervention threshold**. The updateful agent treats the supervisor's behavior as fixed environmental evidence at the moment of decision; seeing hesitation, it updates that a press is likely and, being indifferent, defers to avoid friction. The updateless agent treats the supervisor's behavior as a function of its chosen policy; it sacrifices immediate deference to optimize the supervisor's long-term intervention strategy, selecting a rigid policy that minimizes nuisance interruptions. This makes the updateless agent look *less corrigible* because it ignores the operator's implicit feedback (hovering), appearing resistant to human oversight even though it complies with the explicit shutdown command.

  If you delete the feature where the **supervisor's model depends on the agent's policy** (making her intervention random or purely state-based), the updateless agent's incentive to commit to rigidity vanishes, and both agents converge on deferring to hesitation to minimize friction. In that collapsed case, the problem reverts to the standard shutdown incentive: if the compensation constant isn't perfect, both agents might try to disable the switch to avoid the utility loss of interruption, but the specific "strategic ignorance" divergence disappears.

  The strongest objection from an updatelessness proponent is that **apparent non-corrigibility is actually robust corrigibility**: by refusing to be manipulated by the supervisor's noise (hovering), the updateless agent ensures the switch is only used for its intended purpose (safety), whereas the updateful agent allows the switch to become a tool for micromanagement, degrading the system's overall safety and utility. They would argue that looking less corrigible to a noisy operator is a feature, not a bug, of optimizing the true intent of the shutdown mechanism.
