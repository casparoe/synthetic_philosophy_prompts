  Constraints:

  - One paragraph, realistic setting: a warehouse robot, a hospital triage assistant, a coding agent with a human-in-the-loop kill switch — your pick. The supervisor is an ordinary person with ordinary uncertainty, and whether she presses depends on her imperfect model of what the agent will do if pressed.
  - No predictors, no copies or simulations, no precommitment devices, no exotic physics. The only "acausal" channel you get is that the supervisor's model of the agent is shaped by the agent's policy.
  - The agent already satisfies the usual corrigibility desiderata: indifferent in the utility-indifference sense to whether the switch is pressed, no incentive to disable it, no deception, no subagents. Use whatever version of the indifference trick you like (dynamic compensation constant included). Its bad-looking behavior has to fall out of something subtler than "it grabbed the switch" — and not from arranging for the press to happen at a convenient moment either.
  - The verdicts have to be generated by the two theories, not stipulated by the story. I'm gonna use this in a reading group to argue that updatelessness isn't a free lunch for corrigibility, so that's what counts as cheating.

  After the scenario: walk through what each treatment says and why, name the exact feature of the case doing the work, tell me what happens if that feature is deleted (does it collapse back into plain old incentive-to-disable-the-switch?), and give the strongest objection from someone who thinks updatelessness actually *helps* corrigibility. Keep it tight, and answer in American English.
