  **The Case: The Stranded Motorist and the Coarse Conscience**

  You are stranded 50 miles from town with a dead alternator. A freelance mechanic stops; he can fix it on the spot for $100 in parts, but he demands payment only when you reach the ATM in town, as he carries no card reader. The ride is worth $300 to you (getting to a critical job interview). If you arrive in town, you have the cash, but no causal incentive to pay him; he knows this. He will only fix the car if he is at least 70% confident you will pay. You can cultivate a psychological disposition to "honor requests" to boost his confidence, but human guilt is coarse-grained: you cannot install a disposition to "pay exactly $100" without also installing "pay whatever is asked to relieve guilt," because the mechanism that overrides your cost-benefit analysis at the moment of payment is binary (Guilt vs. No Guilt), not calibrated. If you cultivate this disposition, he reads you as a "Payer" with 70% accuracy and fixes the car; however, recognizing your "Blind Compliance," he claims parts were scarce and demands $350 at the end, which you pay to relieve the guilt. If you remain rational, he reads you as a "Stiffer" and drives off. Payoffs: Cultivating yields an expected value of 0.7 × ($300 − $350) = −$35; remaining rational yields $0. Cultivating the disposition is strictly dominated, leaving you worse off than staying rational, because the signal required to secure the deal destroys the surplus the deal creates.

  **Decision Theory Analysis**

  At **Node 1 (Pre-commitment)**, **Causal Decision Theory (CDT)** typically recommends cultivating the disposition. CDT treats the disposition as a tool separate from the future payment action; it calculates that cultivating causes the rescue (70% chance) and assumes the agent retains control at Node 2 to decide whether to pay the inflated price. CDT sees the cost as the agreed $100 (or zero, if it assumes it can defect later), yielding a positive expected utility. **Functional Decision Theory (FDT)** recommends *not* cultivating. FDT recognizes that the decision to cultivate is logically linked to the decision algorithm at Node 2; if the algorithm outputs "Cultivate," it must also output "Pay Demand," because the disposition *is* the algorithm's output rule. FDT sees the true cost is $350, making the expected utility negative.

  At **Node 2 (Payment)**, the rescue has occurred. **CDT** says *Don't Pay*. The money is gone, the ride is received, and paying $350 has no causal impact on the past rescue. **FDT** says *Pay*. Even though the prediction is in the past, FDT acts according to the logical type established at Node 1; to output "Don't Pay" now would contradict the logical fact that made the rescue possible, and FDT agents do not output contradictory commands even post-hoc. However, because FDT rejected the disposition at Node 1, it never reaches Node 2 in this specific negative-sum scenario. CDT reaches Node 2, refuses to pay, but finds it *cannot* (due to the disposition it cultivated), suffering the loss.

  **Load-Bearing Feature**

  The load-bearing feature is the **Coarse-Graining of the Disposition**. The case relies on the psychological impossibility of installing a "Precise Honesty" module (pay $100, reject $350) that is legible to an observer. The mechanism for overriding rational defection (Guilt/Social Compliance) is a blunt instrument; to make it strong enough to overcome the temptation to stiff the mechanic ($300 gain), it must be strong enough to overcome the temptation to haggle ($250 saving). If you remove this constraint and assume you can cultivate a "Principled Honesty" disposition that pays agreed prices but rejects exploitation, the mechanic cannot exploit you, the deal becomes positive sum ($300 − $100 = +$200), and the standard Hitchhiker argument is restored: cultivating the disposition becomes rational.

  **The Objection**

  A proponent of rational irrationality (e.g., a Schelling-style strategist) would object: *"You are assuming a naive psychology. A sophisticated agent cultivates 'Constrained Maximization,' not 'Blind Compliance.' I can install a disposition that tracks 'Fair Agreements' specifically. I feel guilt only when violating a prior contract, not when resisting a new demand. The mechanic cannot exploit me because my disposition rejects illegitimate hikes."*

  **The Rebuttal**

  This objection fails the **Legibility Constraint**. The mechanic is 70% accurate, not omniscient. "Constrained Maximization" requires the mechanic to verify what you consider "Fair" at the moment of payment, which brings us back to the original problem: you have an incentive to claim $350 is unfair. "Blind Compliance" is the only signal cheap enough and clear enough to pass the 70% threshold because it removes your agency from the equation entirely. To be credible, you must disable the very calculator that would distinguish $100 from $350. The proponent wants a disposition that is credible *and* precise; the case demonstrates that in high-stakes, one-off transactions with imperfect readers, credibility requires sacrificing precision.
