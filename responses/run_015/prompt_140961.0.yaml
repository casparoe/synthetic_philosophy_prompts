answer: |-
  I reject step (4).

  Step (4) asserts that the balance of moral reasons settles what one morally ought to do—specifically, that if the moral reasons favor an act and none oppose it, the act becomes obligatory. This is the "Maximizing Conception of Obligation," and it is the engine of the collapse. To defend supererogation, you must deny that the morally "best" act is always the morally "required" act. You need to posit a gap between the evaluative (what is supported by the most reason) and the deontic (what is demanded). By rejecting (4), you preserve the intuition that an agent can recognize that A is the morally best option, have sufficient reason to do A, and yet retain the moral liberty to omit A without blame. This commits you to a non-maximizing moral theory, where obligation has a threshold that falls short of the optimal.

  Here is the pricing of the alternatives you asked for:

  *   **Rejecting (1) (Praiseworthiness is reason-responsive):** This costs you the connection between moral agency and rationality. If you reject this, you allow that an agent can be praiseworthy for doing the right thing for the wrong reasons (or no reasons), which invites moral luck and severs the link between character and action. A friend of supererogation cannot live with this, as supererogation is typically grounded in the virtue of the agent, not just the outcome.
  *   **Rejecting (2) (No moral reason speaks against):** This is your referee's suggestion. To take this horn, you must argue that personal costs (risk, effort, loss of projects) count as *moral* reasons against performing the good act. The cost here is the "Moralization of Self-Interest." You are committed to saying that my fatigue or my desire to finish my novel is a *moral* reason against saving a child. While this blocks the argument (because now there *are* reasons against, so (3) fails), it distorts the phenomenology of moral deliberation. We usually experience these as prudential reasons that are *overridden* by moral reasons, not as moral reasons that weigh on the same scale. If you accept this, you save supererogation but at the price of making morality deeply conflicted in every instance of sacrifice.
  *   **Rejecting (5) (Omission of Ought = Blameworthy):** This costs you the normative force of obligation. If you can violate an 'ought' without being blameworthy, 'ought' loses its grip. While some theorists distinguish "obligation" from "blame" (e.g., in cases of incapacity), making this the general rule for supererogation renders the category indistinguishable from mere permission. You want supererogatory acts to be *special*, not just blameless omissions of the good.

  Rejecting (4) is the cleanest cut. It allows you to keep (1) and (5) (which you prefer) and accepts a nuanced version of (2) where costs are practical reasons that do not generate obligation even when outweighed. The commitment you incur is that morality is not always rationally overriding; there is a zone of moral discretion where the agent is permitted to choose less than the best.

  ### The Problem of Self-Imposed Cost

  This problem is a **genuine extra problem** for accounts of supererogation, not merely an artifact of the collapsed argument. Even if you successfully block the collapse by rejecting (4), you still need a theory of *grading*. Supererogation is not binary; acts can be "more" or "less" supererogatory based on the cost to the agent. If costs can be manipulated, the grading system is gamed. Therefore, you need a principle to distinguish legitimate sacrificial costs from illegitimate ones.

  **The Principle:** **The Principle of Non-Strategic Sacrifice.**
  *A cost counts toward the supererogatory magnitude of an act only if the cost was not incurred primarily to manipulate moral credit, is not owed as restitution for prior fault, and does not violate prior role obligations.*

  **Application to your cases:**

  1.  **The Weighted Rescuer:** She fails the first clause. She strapped on weights *in order to be admired*. The cost is strategic and manipulative. The principle predicts her act is **not more supererogatory** than the passerby's; indeed, it may be less praiseworthy because the motive is tainted by vanity. The extra cost is morally inert.
  2.  **The Kidney Donor/Pledger:** She passes all clauses. The cost is real, not manipulated for immediate credit (the pledge is a commitment to value, not a stunt), and not owed. The principle predicts her act is **genuinely more supererogatory** (or at least highly praiseworthy) because the sacrifice is authentic and reflects a stable commitment to the good.
  3.  **The Careless Rescuer:** She fails the second clause. The danger was created by her own negligence. The cost she incurs is a **duty of repair**. The principle predicts this is **not supererogatory** at all; it is obligatory restitution. She is merely restoring the status quo ante, not going beyond the call.

  **The Firefighter:**
  This case tests the third clause (role obligations). The firefighter chose her job and foresaw the risks. The principle predicts that facing the standard risks of the job (entering a burning building) is **not supererogatory**, even if costly, because she has assumed a role obligation to bear those costs. However, if she faces a cost *beyond* the scope of her role (e.g., entering a collapse zone explicitly ordered to be avoided, or rescuing a pet when human life is not at risk), the principle allows that *excess* to count as supererogatory. The baseline cost is duty; the marginal excess is supererogatory.

  **Independence:**
  This principle is independent of your rejection of (4). Even if you had rejected (2) instead, you would still face the question of whether self-imposed costs count as "reasons against" that make the act optional. If I strap on weights, do I now have a "reason against" saving the child that I didn't have before? Intuitively, no—I've just made my duty harder. So the Problem of Self-Imposed Cost arises regardless of how you solve the Collapse Argument. It is a problem about the *conditions of praise*, not just the *conditions of obligation*.

  ### Confidence and Defeaters

  I am **85% confident** that rejecting (4) is the correct move. It is the standard move in the literature (e.g., Heyd, *Supererogation*) for good reason: it preserves the deontic logic without moralizing self-interest.

  **What would move me:**
  1.  **A robust account of "Moral Reasons Against":** If you can show that personal projects generate *moral* reasons against sacrifice (not just prudential ones) without collapsing into egoism, rejecting (2) becomes more attractive. This would require showing that respecting one's own integrity is a moral duty that competes with beneficence.
  2.  **A defense of Maximizing:** If you can argue that "Ought" *just means* "Best supported by reasons," then (4) is analytic and cannot be rejected. You would then be forced to deny supererogation exists (becoming a "maximalist"). If you find maximalism plausible, you must reject the definition of supererogation you started with.

  **Does more than one step have to go?**
  Strictly speaking, no. Rejecting (4) alone breaks the chain. However, to make the view stable, you will likely need to soften (2) slightly. You should clarify that "no moral reason speaks against" means "no moral reason *sufficient to generate obligation* speaks against," acknowledging that costs are *considerations* even if they aren't *obligation-generating reasons*. But logically, the knife only needs to cut (4).
