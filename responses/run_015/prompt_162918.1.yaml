answer: |-
  You have put your finger on a specific tension that sits at the heart of contemporary epistemology, but you are right that it often gets swallowed up by the broader "Contextualism vs. Invariantism" debate. There isn't a single lexicalized noun (like "retroknowledge") that captures this exactly, but there are precise technical frameworks for it.

  The phenomenon you are describing is best categorized under **Assessor Relativism** (a specific form of Contextualism), and the psychological mechanism driving your students is likely a mix of **Salience of Error Possibilities** and **Hindsight Bias**.

  Here is the breakdown of what is happening, the terminology you need, and how to distinguish your two cases.

  ### 1. The Name: Assessor Relativism
  The standard label for the view that the truth of a knowledge claim depends on the context of the person *attributing* the knowledge (the students/you) rather than just the subject is **Attributor Contextualism** (associated with Keith DeRose and David Lewis).

  However, your specific "backwards-looking" intuition is captured more precisely by **Assessor Relativism** (associated with John MacFarlane).
  *   **Standard Contextualism:** The truth conditions of "S knows" are fixed at the time of *utterance*.
  *   **Assessor Relativism:** The truth of "S knew" is relative to the *assessor's* context at the time of *assessment*.

  This explains the "weirdness" you feel. If knowledge is a factive state at $t_1$, how can it change at $t_2$? Assessor Relativism says: The *fact* at $t_1$ doesn't change, but the *truth value of the proposition* "S knew at $t_1$" is relative to the standards in play at $t_2$. When you reveal the high stakes, you change the *assessment context*, thereby changing the truth value of the past-tense claim.

  ### 2. What Exactly Is Shifting?
  Your colleagues say "standard-shifting," but that is vague. You need to distinguish between two competing explanations for *what* is shifting. This is the core philosophical dispute you can teach:

  **A. The Semantic Shift (Contextualism/Relativism)**
  *   **What shifts:** The **Truth Conditions**.
  *   **The View:** The word "knows" is indexical (like "tall" or "here"). In a low-stakes conversation, "knows" picks out a low-justification relation. In a high-stakes conversation, it picks out a high-justification relation.
  *   **Verdict:** When you reveal the life-or-death stakes, the students are not making a mistake. The sentence "She knew" literally becomes false in the new conversational context, even though the subject's mental state hasn't changed.
  *   **Term:** **Epistemic Contextualism**.

  **B. The Pragmatic Shift (Moderate Invariantism)**
  *   **What shifts:** The **Assertability Conditions** (Implicature).
  *   **The View:** "Knows" has a fixed, high-stakes invariant meaning. However, it is inappropriate to *assert* "She knows" if high stakes are salient, because doing so implies the evidence is strong enough for action.
  *   **Verdict:** When the students say "She didn't know," they are speaking loosely. Strictly speaking, she *did* know (invariant truth), but it is no longer *appropriate to say* she knew given the new stakes.
  *   **Term:** **Warranted Assertability Maneuver** (often associated with Jason Stanley's critique of Contextualism, though Stanley is a Pragmatic Encroachment theorist; here we mean *Moderate Invariantism* like Timothy Williamson or Patrick Rysiew).

  **Why this matters for your class:** Your students feel the *truth* changes ("No, she didn't know"). Contextualists say they are right. Invariantists say they are confusing truth with appropriateness.

  ### 3. Are Your Two Cases Different Animals?
  They are symmetrical manifestations of the same mechanism, but they pull on different philosophical intuitions.

  **Case 1 (Retroactive High Stakes): The Salience of Error**
  *   **Mechanism:** When you mention the life depended on it, you make the **possibility of error salient**.
  *   **Theory:** This is the classic **Lewisian Contextualism** move. In ordinary contexts, we properly ignore error possibilities. When stakes are raised, we can no longer properly ignore them.
  *   **Nuance:** This case also flirts with **Subject-Sensitive Invariantism (SSI)** / **Pragmatic Encroachment**. If the stakes *actually existed* at $t_1$ (even if unknown to the subject), an SSI theorist (like Jeremy Fantl or Matthew McGrath) would say she *never* knew. The students aren't shifting standards; they are discovering the objective facts of $t_1$ that determine knowledge.
  *   **Distinction:** If your students think she didn't know *because the stakes were high*, they are leaning SSI. If they think she didn't know *because we are now talking about high stakes*, they are leaning Contextualist.

  **Case 2 (Retroactive Low Stakes): The Relief of Burden**
  *   **Mechanism:** This is the mirror image. The subject over-prepared.
  *   **Theory:** This is harder for SSI. If the subject *thought* stakes were high, did they know? SSI usually tracks objective stakes. If the objective stakes were low (decision postponed), SSI says they knew all along.
  *   **Why students shift:** Here, the students are likely engaging in a **Teleological Assessment**. They judge the epistemic basis relative to the *need*. If the need vanishes, the basis looks sufficient. This is less about "knowledge" and more about "rationality of inquiry."
  *   **Label:** This is often discussed under **The Norms of Inquiry**.

  ### 4. The Psychological Component: Hindsight Bias
  You must distinguish the *epistemological* phenomenon from the *psychological* one.
  *   **Epistemological:** Assessor Relativism / Contextualism.
  *   **Psychological:** **Hindsight Bias** (or the "Knew-it-all-along effect").
  *   **The Conflict:** Psychologists argue your students are committing a cognitive error. They are letting the *outcome* (the stakes revealed) contaminate the assessment of the *process* (the glance at the webpage).
  *   **Teaching Point:** Ask your students: "If knowledge is a mental state at $t_1$, how can a fact discovered at $t_2$ alter the mental state at $t_1$?" If they can't answer that, they are likely succumbing to Hindsight Bias rather than doing metaphysics.

  ### 5. Summary for Your Syllabus
  You don't have a single word, but you have a precise phrase. I recommend calling it **Retrospective Assessment Sensitivity**.

  *   **The Phenomenon:** **Retrospective Assessment Sensitivity** (or **Temporal Context Sensitivity**).
  *   **The Semantic Theory:** **Assessor Relativism** (MacFarlane).
  *   **The Pragmatic Theory:** **Moderate Invariantism** (Rysiew/Williamson).
  *   **The Competing Substantive Theory:** **Subject-Sensitive Invariantism** (Stanley/Fantl & McGrath) — *Note: This claims the stakes at $t_1$ determine knowledge, regardless of when we find out.*
  *   **The Psychological Confound:** **Hindsight Bias**.

  **Recommendation:**
  Tell your students: "You are experiencing **Assessor Relativism**. You are treating the truth of 'S knew' as relative to your current conversational standards, not the subject's past state. The philosophical question is: Is that a feature of knowledge (Contextualism), a feature of speech (Invariantism), or a bug in your cognition (Hindsight Bias)?"

  This gives them the vocabulary to see that they aren't just "shifting standards" arbitrarily; they are enacting a specific, debated semantic theory about how knowledge claims function over time.
