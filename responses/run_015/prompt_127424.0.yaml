  # Graduate Seminar in Social Choice Theory & Political Philosophy
  ## Final Examination: Institutional Design and the Liberal Paradox

  **Time Allowed:** 90 Minutes
  **Word Limit:** Approximately 1,200 Words
  **Total Marks:** 25

  ### Exam Question

  **Scenario:**
  A Municipal Zoning Board must select a land-use plan for a two-household neighborhood. The Board chooses from three regimes: **Strict Residential (R)**, **Mixed-Use (M)**, or **Unrestricted Market (U)**. However, a "plan" is defined as a comprehensive social state combining the Regime with two personal features: Household A's front door color (**Red** vs. **Blue**) and Household B's home-workshop status (**Absent** vs. **Present**).

  The Board's charter mandates two conditions:
  1.  **Minimal Liberalism:** Household A is decisive over any pair of plans differing *only* in Door Color. Household B is decisive over any pair of plans differing *only* in Workshop Status.
  2.  **Pareto Principle:** If both households strictly prefer Plan $X$ to Plan $Y$, the Board must rank $X$ above $Y$.

  **Preference Profiles:**
  Consider the following four feasible plans:
  *   $x$: (Regime **R**, Door **Red**, Workshop **Absent**)
  *   $y$: (Regime **R**, Door **Blue**, Workshop **Absent**)
  *   $z$: (Regime **U**, Door **Blue**, Workshop **Absent**)
  *   $w$: (Regime **U**, Door **Blue**, Workshop **Present**)

  *   **Household A Preferences:** $z \succ_A x \succ_A y \succ_A w$
      *(A prefers Unrestricted to Residential, but if Residential, prefers Red. A strongly dislikes the Workshop in an Unrestricted regime.)*
  *   **Household B Preferences:** $y \succ_B w \succ_B z \succ_B x$
      *(B prefers Residential to Unrestricted generally, but if Unrestricted, insists on the Workshop. B dislikes Red doors in Residential zones.)*

  **Prompt:**
  Demonstrate formally that these conditions generate a cyclical social ordering or an empty choice set. Then, move beyond the formal logic: interpret what this contradiction reveals about the feasibility of **procedural neutrality** in urban governance when private rights interact with public externalities. Finally, critically evaluate one proposed resolution (e.g., waiving rights, restricting the Pareto principle, or domain restriction). Do not merely name the resolution; demonstrate exactly how adopting it alters the Board's available choice set in this specific scenario.

  ***

  ### Model Answer

  **The Liberal Paradox in Zoning Governance**

  **1. Formal Derivation of Inconsistency**
  To determine the Board's social ordering, we apply the charter's conditions to the specified profiles.
  First, we apply **Minimal Liberalism**.
  *   **Household A's Domain:** Compare $x$ (Red) and $y$ (Blue). These plans differ only in Door Color. A prefers $x \succ_A y$. By liberalism, the social ordering must reflect $x \succ y$.
  *   **Household B's Domain:** Compare $z$ (Absent) and $w$ (Present). These plans differ only in Workshop Status. B prefers $w \succ_B z$. By liberalism, the social ordering must reflect $w \succ z$.

  Second, we apply the **Pareto Principle**.
  *   **Comparison $y$ vs. $w$:** A prefers $y \succ_A w$. B prefers $y \succ_B w$. Since both agree, Pareto requires $y \succ w$.
  *   **Comparison $z$ vs. $x$:** A prefers $z \succ_A x$. B prefers $z \succ_B x$. Since both agree, Pareto requires $z \succ x$.

  Combining these implications yields the following chain:
  $$x \succ y \quad (\text{Liberalism A})$$
  $$y \succ w \quad (\text{Pareto})$$
  $$w \succ z \quad (\text{Liberalism B})$$
  $$z \succ x \quad (\text{Pareto})$$

  Transitivity implies $x \succ w$ (via $y$) and $w \succ x$ (via $z$). This creates a cycle ($x \succ y \succ w \succ z \succ x$). Consequently, the Board's feasible choice set is empty; there is no stable land-use plan that satisfies the charter.

  **2. Structural Tension and Procedural Neutrality**
  This inconsistency is not merely a logical artifact; it exposes a structural tension between domain-specific liberty and collective preference aggregation in urban governance. The paradox arises because "personal" domains are not hermetically sealed. A's right to paint a door and B's right to operate a workshop are exercised within a shared spatial context (the Regime).

  The failure of **procedural neutrality** here is evident. The Board attempts to remain neutral by simply aggregating preferences and respecting rights without judging the *content* of those preferences. However, because the value of the private right (e.g., the Workshop) depends on the public context (e.g., the Unrestricted Regime), the aggregation mechanism fails. The Pareto principle validates preferences that are contingent on the violation of another's liberty context. For instance, the unanimous preference for $z$ over $x$ (Unrestricted over Residential) drives the system toward a regime where B's exercise of liberty ($w$ over $z$) creates an outcome ($w$) that A finds worst. Procedural neutrality assumes preferences are exogenous and independent; this scenario proves that in zoning, preferences are endogenous to the rights structure. A neutral procedure cannot resolve conflicts where the exercise of one right fundamentally alters the utility landscape of another.

  **3. Critical Evaluation of a Resolution: The Pareto Restriction**
  One proposed resolution is to restrict the Pareto Principle, applying it only when no individual's liberal rights are violated in the transition (often associated with Blau or Deb).
  *   **Application:** In the pair $\{z, x\}$, both prefer $z$ (Unrestricted) to $x$ (Residential). However, moving from $x$ to $z$ changes the Regime. Does this violate rights? Under strict liberalism, no. But consider the pair $\{y, w\}$. Both prefer $y$. This Pareto ranking is robust.
  *   **Impact on Choice Set:** A more potent modification is **Gärdenfors' Waiver Condition**, where an individual waives their right if exercising it leads to a Pareto-inferior outcome for themselves.
      *   Look at Household A. A asserts $x \succ y$. This leads to the cycle ending in $w$ (A's worst outcome). If A waives their right on $\{x, y\}$, the Liberal constraint $x \succ y$ is removed.
      *   The chain becomes: $y \succ w \succ z \succ x$.
      *   Without $x \succ y$, the cycle breaks. The social ordering becomes $y \succ w \succ z \succ x$.
      *   **Result:** The Board selects Plan $y$ (Residential, Blue Door, No Workshop).
  *   **Evaluation:** This resolves the emptiness but imposes a normative cost. It forces A to sacrifice a right (Door Color) to avoid a systemic collapse caused by B's preferences. It shifts the burden of coherence onto the rights-holder rather than the collective structure. While it restores a choice ($y$), it undermines the "minimal" nature of liberalism by making rights conditional on strategic foresight. For a Zoning Board, this implies that stability requires citizens to self-censor rights claims based on aggregate welfare, effectively privatizing the resolution of public conflicts.

  ***

  ### Marking Scheme (25 Points)

  **A Grade (21–25 Points): Excellent**
  *   **Formal Derivation (8 pts):** Correctly identifies the decisive pairs ($x/y$ for A, $z/w$ for B) and Pareto pairs ($y/w$, $z/x$). Clearly demonstrates the cycle ($x \succ y \succ w \succ z \succ x$) and the resulting empty choice set.
  *   **Normative Interpretation (8 pts):** Explicitly connects the logic to **procedural neutrality**. Explains *why* neutrality fails (interdependence of private rights and public regimes) rather than just stating "liberty conflicts with efficiency."
  *   **Resolution Evaluation (7 pts):** Selects a specific resolution (e.g., Waiver, Restricted Pareto). Crucially, **demonstrates the mechanical impact** on the choice set (e.g., "Cycle breaks, $y$ becomes the winner"). Critiques the normative implication of that fix.

  **B Grade (15–20 Points): Good**
  *   **Formal Derivation (8 pts):** Correctly derives the cycle and identifies the conflict between Liberalism and Pareto.
  *   **Normative Interpretation (4 pts):** Discusses the tension between liberty and efficiency but treats it as a abstract logical puzzle. Fails to adequately address **procedural neutrality** or the specific institutional context of zoning/externalities.
  *   **Resolution Evaluation (4 pts):** Names a resolution (e.g., "Waiver of rights") but describes it generally without showing exactly how it changes the ranking or choice set in *this* specific case.

  **Fail (0–14 Points): Inadequate**
  *   **Conceptual Errors (0-5 pts):** Confuses Sen's Liberal Paradox with Arrow's Impossibility Theorem (e.g., discusses IIA or Dictatorship incorrectly).
  *   **Technical Errors (0-5 pts):** Misidentifies the decisive pairs (e.g., claims A is decisive over Regimes). Applies Pareto to non-unanimous comparisons. Fails to generate a cycle.
  *   **Incomplete (0-4 pts):** Omits the resolution section or the normative interpretation entirely.
