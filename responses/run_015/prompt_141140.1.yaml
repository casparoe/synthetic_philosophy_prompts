answer: |-
  **DRAFT MUNICIPAL BYELAW (VISITOR CONDUCT AND CONVENTIONAL OBLIGATIONS) 2024**

  **1. Obligation to Conform**
  Any person classified as a Visitor pursuant to Clause 4 shall adhere to all Local Conventions currently in force within the Municipal Boundary.

  **2. Definition of Local Conventions**
  Local Conventions include, but are not limited to: the formation of single-file queues for services; the provision of discretionary gratuities where service staff are remunerated below the living wage; and the utilisation of pedestrian signal apparatus regardless of vehicular presence.

  **3. Substituted Compliance**
  A Visitor may discharge obligations under Clause 1 by performing an equivalent customary act from their jurisdiction of origin, provided such act is recognised by a Compliance Officer as functionally identical in social signalling.

  **4. Jurisdiction and Status**
  A Visitor is any non-resident present within the Municipal Boundary for a period exceeding three hours. This definition excludes logistics personnel engaged in immediate delivery operations.

  ***

  **EXPLANATORY MEMORANDUM**

  **Rationale for Conventional Obligation**
  The Council recognises that conventions such as queueing or signal adherence are arbitrary solutions to recurring coordination problems. No moral significance attaches to the specific act of standing behind another person rather than beside them; nor does traffic safety inherently require waiting at a red light when no vehicles are present. However, reason dictates that agents must match the behaviour of the collective to maintain order. Therefore, the arbitrary nature of the convention does not diminish the obligation to perform it. The moral duty lies not in the act itself, but in the coordination it secures.

  **Operational Failures and Strict Adherence**
  It has been observed that strict adherence to convention can itself precipitate coordination failure. A Visitor who waits at an empty crossing signal impedes flow by signalling to others that the crossing is unsafe, thereby causing unnecessary congestion. Similarly, a Visitor who declines to queue because they require no service creates ambiguity regarding the line's termination point. While a person who takes no benefit from the queue, or who simply declines to participate and leaves, logically appears to owe nothing to the coordination scheme, the Council cannot afford to concede this exemption. To acknowledge that non-participants bear no obligation would undermine the universality required to enforce the convention against those who do participate.

  **Gratuities and Wage Structures**
  Regarding gratuities, the Council notes that the moral wrong committed by a non-tipper is properly situated in the wage structure rather than the convention. Where tips function as subsidised wages, the failure to tip constitutes a failure to remunerate labour, not merely a breach of etiquette. This Byelaw enforces the convention as the only available mechanism to rectify the underlying economic deficit. Visitors are thus liable for the convention regardless of their personal stance on the wage system.

  **Substituted Compliance and Deference**
  Clause 3 introduces the doctrine of Substituted Compliance to accommodate cultural diversity. This allows a Visitor to discharge the local obligation by performing their own country's equivalent, such as a bow instead of a handshake. The Council acknowledges this doctrine quietly wrecks the Byelaw's philosophical position. If a bow settles the debt, then what bound the Visitor was never the specific local convention, but merely the demonstration of respect. If a bow does not settle the debt, then the Council is not demanding coordination, but deference. This contradiction remains unresolved pending further review.

  **Jurisdictional Ambiguity**
  The definition of "Visitor" in Clause 4 relies on an arbitrary temporal threshold. It remains unclear whether a delivery driver exempted under Clause 4 becomes a Visitor if they enter a shop to purchase a beverage during their route. Furthermore, the three-hour threshold implies that a commuter passing through daily for three years retains Visitor status, whereas a resident who leaves for four hours retains Resident status. This distinction creates a class of permanent Visitors who are bound by local conventions without access to the democratic processes that establish them. The Council accepts this ambiguity as necessary for enforcement.
