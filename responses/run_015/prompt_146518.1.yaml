  ### Drafting Notes for the Options Paper

  When you write the actual docket item, I recommend structuring the "Options" as follows to force the Committee to choose a rule, rather than hiding behind a compromise:

  *   **Option 1 (Precedent 5):** Retain title. Offer long-term loan to National Museum. *Rationale: Market Finality.*
  *   **Option 2 (Precedent 3):** Transfer to National Museum. *Rationale: Evidentiary Burden (Weeded Files).*
  *   **Option 3 (Precedent 6):** Deferral. *Rationale: Competing Community Claims (Neighboring Polity).*

  *Avoid making "Transfer to Community" a standalone option unless you are prepared to lose the vote.* The conservation issues and the competing neighbor claim make it the legally riskiest option. The strategic move is to make **Option 3 (Deferral)** the "safe" choice, which forces the Committee to either do the work of mediating the community dispute (rare) or settle for Option 2 (State Transfer), which you can then leverage to ensure Community Access.

  This approach respects the ToR while maximizing the likelihood of the objects returning to the region of origin.
