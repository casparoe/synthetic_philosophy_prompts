prompt: |-
  I run a grad seminar on collective reasoning, 8 people, 90 minutes. I want a classroom game that makes students feel the discursive dilemma from the inside — specifically why premise-based aggregation feels more legitimate even when it spits out a conclusion that literally nobody in the room endorsed. The setup: before anyone knows their hidden role, the group has to vote on a decision rule (premise-first vs conclusion-first). Then roles are revealed: half are 'premise specialists' who only care about P and Q, half are 'conclusion specialists' who only care about R. They have to apply the rule they picked. The payoff: the group gets shared points only if, after seeing the result, at least two-thirds can write a one-sentence defence of it. Design the cards, the hidden-role draw, the voting protocall, and the debrief that maps their frustration onto the distinction between premise-based and conclusion-based procedures. Also predict what will go wrong the first time — I think people will try to bargain across roles before the draw, but I want you're prediction on that and on whether they'll try to renegotiate the rule ex post. One more thing: inject a niche twist. One student gets a secret 'veto token' that can block the premise-based path but not the conclusion-based path. How do I build this into the materiels without destroying the pedagogic point? No computers needed, no pre-reading, no citations requested.
