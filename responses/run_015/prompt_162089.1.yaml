answer: |-
  Here is a draft of interview questions structured for your 40-minute episode. They are designed to be punchy enough for audio while retaining philosophical precision.

  ### Part 1: Main Interview (8–10 Questions)

  **1. The Core Mechanism: Confidence vs. Efficiency**
  **Q:** Let's distinguish two reasons to trade. One is moral uncertainty: I'm not sure bednets are best, so I hedge by funding your animal campaign. The other is comparative advantage: I'm *certain* bednets are best, but you're just better at producing animal welfare than I am at producing bednets. Which argument is doing the heavy lifting in your book?
  **Expected Answer:** She will likely say comparative advantage is the stronger, more novel argument. Uncertainty is just risk management; comparative advantage creates *more* total value even under certainty.
  **Follow-up:** If I am 100% confident your cause is inferior, doesn't funding it feel like a loss, even if the total pot grows? How do you separate the *outcome* being better from the *act* feeling like a betrayal of my own judgment?

  **2. Weighting Mistaken Values**
  **Q:** To make a trade, I have to treat your values as a currency. Does entering a trade commit me to granting positive moral weight to values I actually think are mistaken?
  **Expected Answer:** She'll likely say no. You treat them as *preferences* to be satisfied, not as *truths* to be endorsed. It's instrumental, not normative.
  **Follow-up:** But if we normalize treating mistaken values as tradable assets, doesn't that quietly push us toward relativism? If I act *as if* your view matters for the sake of the deal, does that erode the conviction that it *doesn't* matter?

  **3. Enforcement and Defection**
  **Q:** These aren't legal contracts. If I send you money for your campaign, what stops me from secretly funneling it back to my own cause? What happens in one-shot trades between strangers?
  **Expected Answer:** She will probably lean on reputation mechanisms and community norms. In one-off cases, she might argue for escrow services or third-party auditors within the effective altruism community.
  **Follow-up:** But that limits trade to small, high-trust cliques. If moral trade can't scale to strangers without legal enforcement, isn't its impact ceiling extremely low?

  **4. The "Exotic Values" Incentive (Your Original Objection)**
  **Q:** Here's a worry I haven't seen in the literature. Trade relies on divergence. If we all agreed on what's best, trade opportunities vanish. Doesn't a culture of moral trade reward people for cultivating expensive, exotic, or niche values just to become attractive trading partners?
  **Expected Answer:** She may argue that rational agents won't cultivate false values because acting on them is costly. You can't pretend to care about something enough to spend real resources on it just for a trade.
  **Follow-up:** What about misrepresentation? If I can convince you I care deeply about beetle conservation to unlock your funding for bednets, and I don't actually care about beetles, haven't I just gamified the system? How do you police sincerity?

  **5. The Vote-Trading Analogy**
  **Q:** Critics often compare this to vote trading, or logrolling, which is widely considered corrupt even when it produces legislative gains. Why is moral trade ethically distinct from selling your vote?
  **Expected Answer:** She'll likely distinguish between public duties and private resources. A vote is a public trust; disposable income is private. Also, vote trading often passes bad laws, whereas moral trade aims for net positive outcomes.
  **Follow-up:** But if the logic is identical—swapping support for something I don't prioritize to get support for what I do—why does the intuition of corruption stick to voting but not to donation? Is it just familiarity?

  **6. Trading Across Time**
  **Q:** Can I trade with the future? I fund a long-term project now, hoping future generations fund something I care about later. But they can't reciprocate; they can't causally reach back.
  **Expected Answer:** She will likely say no, that's not trade, that's just investment or legacy. Trade requires reciprocal agency.
  **Follow-up:** What about trading with my future self? If I know my values will shift in ten years, should I "trade" with my future self now? Does that fragment my identity into a series of negotiating partners?

  **7. Transparency and Publicity**
  **Q:** Should these trades be public? If I fund an animal campaign solely because you funded my bednets, do I have a duty to disclose that motive to the animal charity?
  **Expected Answer:** She might argue for transparency to build trust, but say the motive doesn't negate the good done.
  **Follow-up:** If the animal charity knew I thought their work was secondary and only funded them as a quid pro quo, might they reject the money on integrity grounds? Does moral trade require a conspiracy of silence?

  **8. Psychological Alienation**
  **Q:** Does turning morality into a marketplace alienate us from our values? If I'm constantly calculating comparative advantage, do I stop experiencing my moral commitments as convictions and start seeing them as portfolio assets?
  **Expected Answer:** She'll likely argue that consequences matter more than feelings. If the alienation reduces effectiveness, that's a cost to weigh, but it doesn't invalidate the trade.
  **Follow-up:** But if the mindset required to make the trade work erodes the passion that drives people to donate in the first place, haven't you killed the goose that lays the golden eggs?

  **9. Coordination Costs**
  **Q:** Finding partners, negotiating terms, and verifying compliance takes time. At what point do the transaction costs outweigh the efficiency gains from the trade?
  **Expected Answer:** She will admit there's a threshold. It works best for large donors or institutions where the marginal gains exceed the overhead.
  **Follow-up:** If it only works for large players, does this become an elite practice that excludes the average listener who just wants to do good without becoming a moral day-trader?

  **10. Institutional vs. Individual**
  **Q:** Is the primary unit of moral trade the individual donor or the organization? Should GiveWell and Animal Charity Evaluators be trading grants rather than you and me?
  **Expected Answer:** She will likely say institutions are better suited due to lower transaction costs and higher accountability.
  **Follow-up:** If it's mostly institutional, does the "moral" dimension disappear? Isn't that just standard strategic grantmaking by a different name?

  ***

  ### Part 2: The "Dirty Hands" Tightening Sequence
  *Use this sequence to press her specific defense that "no one's hands get dirty when the only thing that changes hands is who does what."*

  **Q1 (Second Best):** Suppose I rank your cause as merely second-best. I fund it, you fund mine. We both get more of our top choice. You say my hands are clean because the total good increased. Do you agree?
  *(She will say Yes.)*

  **Q2 (Worthless):** Now, suppose I think your cause is morally worthless—like funding a statue of a minor celebrity. It's not bad, just empty. If funding that statue unlocks your funding for my life-saving medicine, are my hands still clean?
  *(She will likely say Yes, because the statue isn't harmful, just neutral.)*

  **Q3 (Harmful):** Now, suppose I think your cause is positively harmful—say, a campaign that inadvertently increases suffering, though you disagree. If my funding that campaign is the only way to unlock your funding for my life-saving medicine, am I complicit in the harm?
  *(She may hesitate, but might argue that if the net outcome is positive, the complicity is justified.)*

  **Q4 (Enabling):** Here's the trap. Suppose your harmful campaign *cannot happen* without my money. There is no other donor. By trading, I am not reallocating who does the harm; I am making the harm *possible* so that good can occur. Does your "who does what" defense hold when my action is the necessary condition for the bad action existing at all?
  *(This forces her to admit that causal responsibility matters, not just reallocation.)*

  ***

  ### Part 3: Closing Questions

  **(a) Empirical Falsification**
  **Q:** What empirical evidence would convince you that widespread moral trade makes things worse on net? Is there a scenario where the market dynamics themselves degrade the moral ecosystem enough to outweigh the efficiency gains?

  **(b) The Hard Limit**
  **Q:** Is there any trade you would refuse on principle, regardless of the efficiency gains? If so, what distinguishes that line? Is it a specific type of harm, or a violation of agency?
