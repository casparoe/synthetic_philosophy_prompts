      *   **Core Thesis:** Standing to blame is analogous to calibration authority in metrology. One can only blame if one's own record is "traceably uncorrupted" regarding the norm. Hypocrisy voids the *act* of blaming (standing), not the *norm* itself.
      *   **Task:** Identify potential defeaters (findings in moral psychology, social practices, logical features) that would *falsify* (fatal) vs. *adjust* (awkward) the model. Rank them. Specifically address recovery of standing and collective correction. Provide an honest assessment of exposure and concessions.
      *   **Tone:** Rigorous, analytical, respectful of the analogy but critical where necessary. Avoid oversimplification.

  2.  **Deconstruct the Metrological Model:**
