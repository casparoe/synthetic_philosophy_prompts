      *   *Premise 2:* Authority to use the instrument depends on the user's adherence to the standard (traceability).
      *   *Premise 3:* Hypocrisy = Loss of traceability = Invalid measurement (blame).
      *   *Implication:* The norm remains valid (the standard exists), but the hypocrite cannot invoke it.

  3.  **Brainstorm Potential Defeaters:**

      *   *Moral Psychology:* Do people actually react to hypocrisy by invalidating the *message* or by attacking the *messenger* while accepting the message? Does moral outrage function instrumentally or expressively?
      *   *Social Practices:* Collective blame (e.g., international sanctions, institutional censure). Can an institution blame if individuals within it are corrupt? What about "clean hands" doctrines in law vs. ethics?
      *   *Logical/Normative Features:* Is blame essentially communicative? If so, does the truth of the content matter more than the status of the speaker? Is there a duty to blame even if imperfect?
      *   *Recovery:* In metrology, a broken gauge is recalibrated or scrapped. In ethics, can a sinner regain standing through repentance? Is this "recalibration" or something else?
