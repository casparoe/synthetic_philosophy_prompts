answer: |-
  Consider a university department's standing rule that all tenure votes must be conducted in person, never by proxy or encrypted digital ballot. The historical reason is known to all: in the 1970s, it prevented external pressure from alumni who could intercept mail. Today, encrypted digital voting eliminates that vulnerability, and the reformer argues that requiring physical presence unfairly disadvantages candidates with scheduling conflicts. The reformer is rational and fully informed; the original security rationale is dead. Yet a Burkean resists, not by claiming a hidden security function, but by arguing that the *ritual of physical assembly* has become the structural load-bearing wall for departmental cohesion. The inconvenience forces face-to-face confrontation with dissenting colleagues, preventing the siloing of factions that digital anonymity would permit. The rule's legitimacy now rests on prescription itself—the accumulated habit of sharing space creates a sense of collective responsibility that no new rule can instantiate. To remove the fence because its original purpose is gone is to ignore that the fence has become the foundation.

  **Chesterton's Verdict:** Once the reformer identifies the original reason (security against interception) and demonstrates it is obsolete, the heuristic licenses removal. Chesterton's condition is satisfied because the reformer has "seen the use" and found it wanting; the fence is instrumental, and once its instrumentality expires, the objection is discharged.

  **Burkean Verdict:** The Burkean resists removal based on the commitment to **prescriptive legitimacy and systemic complexity**. The work is done by the claim that the rule's endurance has generated emergent social functions (cohesion, forced confrontation) that are too complex to be fully mapped or safely re-engineered by a single reasoner, regardless of the original intent.

  **The Divergent Feature:** The single feature pulling the verdicts apart is **accumulated systemic opacity**. Chesterton treats the rule as having a singular, discoverable origin-purpose; Burke treats the rule as having accrued unquantifiable interdependencies over time that exist independently of its origin.

  **If Removed:** If the rule had no emergent functions—if it were purely instrumental with no side-effects on social cohesion—the Burkean would agree to its removal. The case collapses into a standard cost-benefit analysis where the original purpose is the only metric.

  **Strongest Burkean Reply:** The charge of status-quo bias mistakes **survival for stagnation**. Epistemic humility here is not a preference for the old, but a recognition that the status quo represents the aggregated data of countless past experiments and adjustments ("the democracy of the dead"). To demand a full rational account before preserving an institution is to privilege the limited reason of the living over the tested wisdom of the dead; the burden of proof lies on the reformer to show the system will not collapse, not on the conservative to prove every brick is still necessary.
