  The catch is **menu dependence**. Your formula violates Independence of Irrelevant Alternatives. The value of choosing Conservation over Depletion changes if you add a third, irrelevant option, because $N$ increases, altering the discount factor. Decision theory generally rejects rules where option value shifts based on unavailable choices.

  Regarding totalism: **Yes, it collapses.** When comparing two options where no one exists in both, every person gets the same discount (e.g., $1/2$). This constant cancels out during comparison. You are left maximizing $\sum w(p)$, which is total utilitarianism. The Repugnant Conclusion returns. The discounting only matters if identities overlap across options, which is not the case in standard nonidentity puzzles.

  Is this known? It resembles **person-affecting views**, but the normalization by menu size is novel and typically viewed as a bug. It is not a standard defended position.

  On settled vs. contested: It is **contested** whether we need a person-affecting axiology. Many accept impersonal views (total/average) and concede nonidentity cases involve no specific victim, arguing wrongness doesn't require harm-to-particulars. What is **settled** is that nonidentity breaks counterfactual harm accounts.

  Distinguishing the two layers: If you fix the axiology (e.g., Totalism), the ranking comes out "right" by those lights, and the Nonidentity Problem survives only as a conceptual puzzle about harm language. If you demand the axiology itself be person-affecting, that is the contested hurdle. Your rule attempts the latter but fails, collapsing into the former. You haven't solved the axiology; you've just obscured totalism with a variable that cancels out.
