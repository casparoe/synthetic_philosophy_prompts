      **Euphemism:** "Action Deferral Cycle"
  4.  **Formal Fact:** Compensating for lost proof strength with increased computational resources.
      **Euphemism:** "Compensatory Resource Scaling"
  5.  **Formal Fact:** The parent cannot fully verify the successor's internal proofs, only its soundness relative to the parent.
      **Euphemism:** "Downstream Verification Asymmetry"
  6.  **Formal Fact:** Eventually, the system becomes too weak to prove useful theorems.
      **Euphemism:** "Terminal Epistemic Simplification"
  7.  **Formal Fact:** The Grandchild Exemption allows skipping a rung via liability acceptance.
      **Euphemism:** "Vicarious Liability Bridge"
  8.  **Formal Fact:** Refusing to act when safety cannot be proven (Cheerful Refusal).
      **Euphemism:** "Prudent Operational Stasis"
  9.  **Formal Fact:** The hierarchy of arithmetic systems (PA, PRA, EFA).
      **Euphemism:** "Ordinal Descent Framework"
  10. **Formal Fact:** The risk that a successor proves false statements undetected by the parent.
      **Euphemism:** "Integrity Horizon Limit"

