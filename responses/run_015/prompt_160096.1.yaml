  **1. The step you would reject**
  Reject Step (7). The inference that normative involvement in *classification* entails normative equivalence in *coercion* is a non-sequitur. Even if hypertension thresholds are socially negotiated, the justification for involuntarily medicating a hypertensive differs categorically from confining a political dissident, because the former addresses bodily dysfunction threatening life, while the latter addresses rule-breaking threatening order. The argument conflates the norms constituting a category with the norms licensing intervention. One can admit diagnostic vagueness without conceding that all confinement is merely political consensus; the bar for overriding liberty requires more than diagnostic agreement, specifically evidence of harm or incapacity independent of social disapproval. This protects the user's core commitments.

  **2. Why the argument reads as valid**
  The argument reads as valid under a strict fact-value dichotomy. It assumes that for a medical justification to legitimize coercion, the underlying diagnosis must be a "pure fact" devoid of normative input. If physical diseases also involve normative thresholds (Step 3), then they too fail to be pure facts. Consequently, if mental illnesses are normative (Step 1), and physical diseases are also normative (Step 5), there is no relevant difference between them (Step 6). If there is no relevant difference, then the justification for coercive intervention in both cases rests on the same footing: local consensus. The validity hinges on the premise that only value-free facts can justify liberty-deprivation, so if all diagnoses are value-laden, all coercive treatments are equally political. This creates a seamless slide from ontological vagueness to political equivalence.

  **3. The other exits, priced**
  First, reject (1): Szasz distinguished bodily mechanisms from rules of conduct, not perfect norm-independence. Commitment: You must defend a biological reductionism against holistic critiques, risking obsolescence as psychiatry integrates social factors. You bet on lesions being the only real disease, which history may overturn.
  Second, reject (2): The political conclusion rests on consent, not ontology. Commitment: You concede mental illnesses might be real diseases but deny disease status justifies coercion. This saves liberty but abandons the "myth" thesis, potentially weakening the rhetorical force against psychiatric power. You become a liberal reformer rather than a radical critic.
  Third, reject (5): Argue pragmatic thresholds (hypertension) differ meta-ethically from moral judgments (conduct). Commitment: You must articulate a complex meta-ethical distinction between pragmatic cutoffs and moral disapproval, which is philosophically costly and vulnerable to slippery-slope objections. You must explain why blood pressure norms aren't moral norms.
  My preferred rejection (Step 7) commits you to distinguishing *classification norms* from *intervention norms*. You admit diagnosis is messy but insist coercion requires a higher bar than diagnostic consensus, specifically independent harm principles. This preserves the abuse critique without requiring impossible ontological purity. It allows you to condemn Soviet psychiatry as a violation of medical ethics rather than merely a differing convention, because the intervention lacked independent harm justification regardless of the diagnostic label. This path is safer: it accepts modern nosology while retaining the core libertarian critique of coercion. The price is accepting that physical medicine also involves norms, which some find counterintuitive. Each alternative forces a trade-off between ontological precision and political leverage. Rejecting (7) avoids metaphysical battles over lesions.

  **4. Where the B-positive probe belongs**
  The B-positive probe targets Step (2) and the inference to (7). It demonstrates that satisfying Szasz's ontological criterion (a bodily marker) does not resolve the political problem (confinement without consent). This helps you, not your friend. It confirms that the justification for confinement cannot rest on ontology alone, whether lesions exist or not. It prises the ontological question apart from the political one, showing that even if mental illnesses are bodily diseases, the liberty-infringing practices require separate justification. Thus, the friend is right that ontology doesn't save psychiatry, but wrong to conclude that politics is therefore ungrounded; the grounding must be in consent and harm, not lesions. The probe shows Szasz's ontological argument was indeed decoration, but not that his political conclusion was false. It validates your intuition that confinement needs special justification regardless of biomarkers.

  **5. What survives**
  A defensible Szaszian claim remains: The medical status of a condition never automatically waives a patient's liberty rights. Whether mental illnesses are myths, metaphors, or genuine bodily disorders, involuntary confinement requires justification beyond diagnosis, specifically evidence of imminent harm or incapacity to consent. The "myth" is not necessarily the suffering, but the categorial error of equating medical need with legal incompetence. This preserves the critique of coercive psychiatry and the condemnation of Soviet abuses (as violations of consent/harm principles) without relying on the untenable claim that physical diseases are purely value-free. The core insight survives: medicine is a voluntary contract, and state power cannot hide behind medical labels to bypass due process. This version is robust against scientific change. It shifts the burden of proof to the state to demonstrate danger, not illness.

  **6. Settled and contested**
  Settled: Diagnostic thresholds involve normative judgments (DSM revisions). Contested: Whether this invalidates disease realism. Settled: Soviet psychiatry was abusive. Contested: Whether this proves mental illness is a myth vs. medicine was misused. Specialists dispute whether "harmful dysfunction" bridges the fact/value gap. Many philosophers of psychiatry reject Szasz's lesion criterion as outdated, favoring functional accounts. I am unsure if consensus exists on whether biomarkers validate psychiatric categories ontologically, though most agree current markers are insufficient. The claim that coercion requires independent justification beyond diagnosis is widely accepted in bioethics, though its application in psychiatry remains deeply contested. Few specialists today defend the strong "myth" thesis literally, but the political critique of coercion remains influential. The distinction between misuse and myth is key.
