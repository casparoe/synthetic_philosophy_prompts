answer: |-
  This is a fantastic question. You have correctly identified that the podcast host is mixing accurate textual summary with significant caricature and philosophical sleight-of-hand. Your intuition that the "Descartes" comparison is unfair is spot-on, and your suspicion about the "last human" argument touches on the exact debate happening in contemporary Kantian scholarship.

  Here is a breakdown of what a Kant scholar would accept, what they would reject, and how the "direct vs. indirect" distinction actually works.

  ### 1. The Textual Truth: Where the Host is Right
  If you open Kant's *Lectures on Ethics* or the *Metaphysics of Morals*, the host is quoting him accurately on the surface level.

  *   **Animals are not "Persons":** For Kant, moral status (being an "end-in-itself") is grounded in **rational autonomy**—the ability to set goals, legislate moral laws for oneself, and act on principle. Since animals act on instinct and inclination, they are not moral agents. Therefore, we cannot have duties *to* them in the same way we have duties *to* humans.
  *   **Indirect Duties:** Kant explicitly calls duties regarding animals "indirect duties towards humanity." He argues that if a man shoots his dog because it can no longer serve him, he damages his own moral character.

  So, the host is right that the *standard textual interpretation* is that animals do not have direct moral standing in Kant's system.

  ### 2. The Caricature: Where the Host is Wrong
  This is where the host's confidence outpaces his accuracy. There are three major errors in his summary.

  **A. The Descartes Comparison (The Sentience Error)**
  The host claims Kant thinks animals are "complicated machines that don't really feel anything." **This is false.**
  *   **Descartes** famously argued animals were automata without souls and therefore could not feel pain (their screams were just mechanical noise).
  *   **Kant** explicitly acknowledges that animals feel pain, have emotions, and have analogues of reason. He writes that we can see animals experience pleasure and pain.
  *   **The Difference:** For Kant, the *moral wrongness* of causing pain isn't grounded in the *sensation* of pain itself (as it is for a Utilitarian), but in the **rational response** to that pain. He thinks animals matter, but they don't matter *morally* in the strict sense because they cannot participate in the moral community. Calling him "Descartes with extra steps" ignores that Kant grants animals sentience; he just denies them *moral agency*.

  **B. The Utilitarian Slip (Character vs. Consequences)**
  The host frames Kant's argument as: *"Don't be cruel because it might make you cruel to people later."* This sounds like a utilitarian calculation (predicting future bad outcomes).
  *   **Kant's Actual View:** It is a **Duty to Self**. For Kant, morality is about the state of your *will*, not the consequences of your actions.
  *   If you are cruel to an animal, you are not necessarily risking future crimes against humans. You are **immediately** degrading your own humanity. You are treating a sentient being as a mere thing, and in doing so, you dull the "natural predisposition" in yourself that allows you to empathize with suffering.
  *   **Why this matters:** It means the wrongness happens *at the moment of the act*, not based on a calculation of future effects.

  **C. The "Last Human" Implication**
  The host argues: *"If you were the last human on earth, torturing animals would be totally fine."*
  *   **The Kantian Rebuttal:** A sophisticated Kantian would say **no**.
  *   Because the duty is a **Duty to Self**, it doesn't matter if other humans exist. As the last human, you are still a rational moral agent. If you torture an animal, you are corrupting *your own* moral integrity. You are violating the duty you owe to the "humanity in your own person."
  *   So, even on a desert island, the act is forbidden—not because it hurts the animal directly (in Kant's strict view), but because it turns *you* into a monster. The host's claim that it would be "totally fine" ignores the "Duty to Self" component and treats it purely as a "Duty to Future Others."

  ### 3. The "Direct Duty" Debate (The Modern Kantian Move)
  You mentioned hearing about a philosopher who argues you can get direct duties from Kant. You are likely thinking of **Christine Korsgaard**, specifically her book *Fellow Creatures*.

  *   **The Problem:** If only rational agents count, animals are out.
  *   **Korsgaard's Solution:** She argues that Kant's logic actually *requires* us to value animal ends.
      1.  Rational agents have "ends" (goals they want to achieve).
      2.  To value our own rational nature, we must value the capacity to have ends.
      3.  Animals have ends (e.g., avoiding pain, finding food), even if they aren't "rational" ends.
      4.  Therefore, to be consistent, we must treat their natural ends as having value.
  *   **The Result:** This creates a **Direct Duty**. We don't owe it to ourselves to be nice; we owe it *to the animal* because its suffering is a "bad-for-it," and we must respect that.

  Many contemporary Kantians follow this path. They argue that the "Indirect Duty" view was a limitation of Kant's 18th-century biology/psychology, not a necessary feature of his ethical framework. So the host's claim that "every Kantian... has had to quietly drop the whole direct-versus-indirect duty thing" is an exaggeration. Many are actively rebuilding it from the inside.

  ### 4. Direct vs. Indirect: Does it Matter?
  The host assumes that unless a duty is **Direct**, it is worthless ("Kantian ethics is useless for animals"). This is a normative assumption, not a fact.

  *   **Direct Duty:** "I must not hurt the pig because the pig has a right not to be hurt." (Status-based)
  *   **Indirect Duty:** "I must not hurt the pig because doing so violates my obligation to be a virtuous human." (Agent-based)

  **Does the difference block the desert-island implication?**
  *   If the duty is **Indirect (to Self)**: Torture is still wrong on the island, because you still owe it to yourself to be virtuous.
  *   If the duty is **Indirect (to Future Humans)**: Torture is permissible on the island (if you die with no trace).
  *   If the duty is **Direct**: Torture is wrong because it violates the pig's status.

  The host is conflating "Indirect" with "Consequentialist/Instrumental." A Kantian Indirect Duty is still a **strict prohibition**. It doesn't mean "don't be cruel unless you can get away with it." It means "being cruel is incompatible with being a moral agent, period."

  For practical purposes (e.g., factory farming), an Indirect Duty view can still demand vegetarianism. If factory farming requires you to ignore suffering and treat living beings as raw material, it corrodes your moral character. Therefore, a Kantian can oppose factory farming vigorously without granting animals "rights."

  ### 5. Does the Conclusion Follow? (Do we need Utilitarianism?)
  The host concludes: *"Kantian ethics is useless for animals and you have to be a utilitarian about them."*
  This is a **Non-Sequitur** (it does not follow).

  1.  **Kantianism isn't "Useless":** As shown above, it can ground strong prohibitions against cruelty via Duties to Self.
  2.  **Utilitarianism isn't the Only Alternative:** Virtue Ethics, Care Ethics, and Capabilities Approaches (like Martha Nussbaum's) also offer animal ethics without Utilitarianism.
  3.  **Utilitarianism has Problems:** Utilitarianism values animals based on sentience (pain/pleasure), which is good, but it can theoretically justify killing animals painlessly if it maximizes overall happiness (e.g., replacing a happy pig with two happier pigs). Kantians find this repugnant because it treats the individual as replaceable.

  ### Summary Verdict
  Here is how you should assess the podcast host's claims:

  | Claim | Verdict | Explanation |
  | :--- | :--- | :--- |
  | **"Kant says animals are things/not persons"** | **Accurate** | Kant ties moral status to rational autonomy. |
  | **"Duties are purely instrumental"** | **Misleading** | They are instrumental regarding the *animal*, but intrinsic regarding *your character*. It's not a calculation; it's a constraint on your will. |
  | **"Kant is Descartes (animals feel nothing)"** | **False** | Kant acknowledges animal sentience/pain. |
  | **"Last human torturing animals is fine"** | **Debatable** | False if the duty is to *Self* (virtue). True only if the duty is to *Future Others* (consequences). Kant usually argues the former. |
  | **"Modern Kantians abandoned the view"** | **Exaggerated** | Scholars like Korsgaard are actively deriving direct duties from Kantian premises. |
  | **"Must be Utilitarian for animals"** | **False** | False dilemma. Other frameworks exist, and Kantianism can still oppose cruelty strongly. |

  **The Bottom Line:**
  The host is using a "Straw Man" version of Kant (Descartes + Utilitarianism) to knock him down. While Kant's *text* places animals in a secondary category, the *logic* of his system (specifically regarding Duties to Self and the nature of Sentience) is more flexible than the host admits. You do not need to abandon Kantian ethics to care about animals, nor do you need to accept that the "Last Human" can torture with impunity.

  If you want to read the "Kantian who argues for direct duties" you heard about, look up **Christine Korsgaard's *Fellow Creatures: Kantian Ethics and Our Duties to Animals***. It is accessible and directly addresses the "rabbit hole" you are currently in.
