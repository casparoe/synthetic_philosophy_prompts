prompt: |-
  Hey, hoping you can help with something I have to actually hand to people next month.

  I sit on the board of a regional legal-aid nonprofit — about forty staff, we do evictions, benefits denials, a bit of family law, and we turn away something like six in ten of the people who qualify because there simply aren't enough hours in the week. We're voting in three weeks on whether to roll out a drafting tool from a vendor I'll call Briefwell: you feed it the intake notes and it produces a first-draft petition, demand letter, or discovery response. On the vendor's demo it's genuinely good, and the failure mode is the nasty one — text that reads perfectly and is subtly wrong about a deadline or a legal standard, the kind of thing you only catch if you already know the area. The staff are split in a way that maps oddly onto seniority: our newer attorneys and most of the intake team are strongly for it (their line is that the queue is the moral emergency, and that agonising about our own fulfillment while a client sleeps in her car is definately a form of self-indulgence), while the senior litigators and the paralegals' committee are strongly against it. The paralegals' objection isn't mostly about jobs — it's that drafting is where judgment gets formed, and that sitting in review of text you didn't write, with your name on the filing and the liability on you, is a thinner and different activity from writing it. Our main funder, a state access-to-justice commission, has also let us know unofficially that a decent slice of next year's grant depends on showing we've adopted this kind of technology, so doing nothing isn't costless either.

  What I want from you is a decision memo I can circulate to the board and then, unchanged, to staff — one document, not a board version and a staff version. It should take a position: approve, reject, or approve with conditions, and if it's the last one I want the conditions to be real and dated — which case types, what phase-in, who reviews it at the six- and twelve-month marks, what specifically triggers a rollback — rather than the sort of pilot-and-monitor language that means nobody ever decides anything. It also needs to say what we owe our own staff either way. If the tool comes in and the paralegal role quietly becomes person-who-checks-the-machine's-work, I'd rather we name that out loud and either redesign the role into something with actual judgment left in it or admit we're cutting it, instead of letting it happen by drift. And it should be honest about who is answerable for the errors, which our board has so far managed not to discuss at all.

  The part I'm stuck on, and the part I'd like the memo to reason about rather than gesture at, is whether the preservation of meaningful work is something a body like ours is even allowed to weigh. I've been arguing with a friend who says obviously not: we're a charity funded to serve clients, our duty to staff is to pay them properly and give them notice, and if we think meaningful work is getting scarce we should go fight that in tax and labour policy rather than making someone wait three weeks longer for her eviction answer. I keep half-agreeing and then not. The thing I can't get past is a distinction I made up and can't fully defend: there's the product (the brief gets filed either way), there's the craft (someone spent years learning to do the thing well), and then there's what I'd call the office — being the identifiable person who stands behind a document and can be asked why it says what it says. Automation can leave the first two more or less intact and still hollow out the third, and my hunch is that the hollowing is where the real harm lives, but I honestly can't tell whether that's an insight or just my own profession's preferences in a nicer coat. So give me the straight version: a recommendation with reasons a skeptical paralegal and a skeptical client could both respond to, the strongest case for whichever side you're not recommending, and your own verdict on whether the craft-and-office worry is status anxiety dressed up. Assume nobody reading has time for footnotes — no citations or reading suggestions, and keep it under about 1,200 words.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write a decision memo for a legal-aid nonprofit board and staff.
      *   **Context:** Board voting in 3 weeks on adopting "Briefwell" (AI drafting tool).
      *   **Organization:** 40 staff, high demand (turn away 60% of qualified clients), areas: evictions, benefits, family law.
      *   **Tool:** AI drafting (petitions, letters, discovery). Good demo, risky failure mode (plausible but subtly wrong text).
      *   **Stakeholders:**
          *   New attorneys/intake: Pro-tool (moral emergency, queue reduction).
          *   Senior litigators/paralegals: Anti-tool (judgment formation, liability, role hollowing).
          *   Funder: Pro-tool (grant dependency).
      *   **Requirements:**
          *   One document for both board and staff.
          *   Take a position (Approve, Reject, or Approve with Conditions).
          *   If conditions: Real, dated, specific triggers for rollback, review marks (6/12 months).
          *   Address staff impact (meaningful work, role redesign vs. drift).
          *   Address liability/accountability.
          *   Address the core philosophical question: Is preserving "meaningful work/craft/office" a valid consideration for a charity, or is it status anxiety?
          *   Tone: Honest, direct, no footnotes, under 1,200 words.
          *   Include: Recommendation, reasons for skeptical paralegal & client, strongest case for the opposing side, verdict on the craft/office worry.

  2.  **Determine the Position:**
      *   *Reject:* Too risky given funder pressure and the moral imperative to serve more clients.
      *   *Approve Unconditionally:* Ignores the very real risks of liability, staff burnout/role erosion, and the "hollowing out" concern.
      *   *Approve with Conditions:* This seems the most responsible path. It acknowledges the funder pressure and the moral need to serve more clients (queue reduction) while respecting the risks (liability, craft erosion). It allows for a pilot with hard stopgaps.
      *   *Decision:* **Approve with Conditions.** This balances the moral emergency (clients waiting) with the professional integrity risks (errors, role hollowing).

  3.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Recommendation:** State clearly upfront. Approve with conditions.
      *   **Context/The Problem:** Acknowledge the tension. 60% turn-away rate vs. risk of error/role erosion.
      *   **The Core Philosophical Question (Craft/Office):** Address the user's specific stuck point. Is it status anxiety? No, it's about accountability and quality control. The "office" (standing behind the work) is essential for legal aid credibility.
      *   **Conditions (The "Real" Stuff):**
          *   Phase-in: Specific case types (low risk first).
          *   Review: 6-month and 12-month marks.
          *   Rollback Triggers: Error rates, staff turnover, specific liability events.
          *   Role Redesign: Paralegals shouldn't just be checkers. Define new judgment roles.
      *   **Liability:** Who is answerable? The signing attorney. Always.
      *   **Opposing View (Strongest Case):** Acknowledge the pro-tool argument (moral emergency of the queue).
      *   **Conclusion:** Final verdict.

  4.  **Refining the Argument on "Craft/Office":**
      *   The user is worried this is just professional privilege disguised as ethics.
      *   *Counter-argument:* In legal aid, trust is the currency. If the "office" (the person responsible) is hollowed out, the client loses recourse when things go wrong. It's not just about the worker's feelings; it's about the client's safety net. If the paralegal becomes just a checker, they lose the intuition to catch the AI's subtle errors. Therefore, preserving "craft" is actually preserving "quality control."
      *   *Verdict:* It is not status anxiety. It is a quality assurance mechanism.

  5.  **Drafting - Constraints Check:**
      *   Word count: Under 1,200.
      *   No footnotes/citations.
      *   One document for board and staff.
      *   Specific conditions (dates, triggers).

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Start with the decision: Conditional Approval.
      *   Why? We can't turn away 60% forever. But we can't file bad briefs.
      *   Address the "meaningful work" debate. It's not about comfort; it's about accountability.
      *   The Plan:
          *   Start with benefits letters (low risk).
          *   No eviction filings until 6-month review.
          *   Paralegals get "AI Oversight" training and role definition, not just checking.
          *   If error rate > 5%, stop.
          *   If staff turnover spikes, stop.
      *   Liability: Signing attorney owns it.
      *   Acknowledge the pro-tool side: The queue is a moral crisis.
      *   Closing: This is a tool, not a replacement.

  7.  **Writing - Iteration 2 (Focusing on Tone and Specifics):**
      *   Need to sound authoritative but empathetic.
      *   Make sure the conditions are *hard*. "Review at 6 months" is weak. "Automatic suspension if..." is strong.
      *   Address the funder pressure implicitly (we are adopting, but safely).
      *   Tackle the "status anxiety" question directly.

  8.  **Drafting - Content (incorporating the "Office" argument):**
      *   The user's distinction: Product vs. Craft vs. Office.
      *   My take: The "Office" is the accountability structure. If you remove the craft, you weaken the Office. If the Office is weak, the client suffers when things go wrong. So it *is* client-centered to worry about staff craft.

  9.  **Review against Word Count:**
      *   Keep it tight. Avoid fluff.
      *   Ensure the conditions are bulleted or clearly defined.

  10. **Final Polish:**
      *   Check the "strongest case for the other side" requirement.
      *   Check the "verdict on status anxiety" requirement.
      *   Ensure it works for both board (governance) and staff (implementation/morale).

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm dodging the funder pressure. I should acknowledge we need the grant but not at the cost of malpractice.
  *(Self-Correction on Conditions)*: Make sure the rollback triggers are specific. "Error rate" needs a definition. "Staff sentiment" needs a metric.
  *(Self-Correction on Roles)*: Explicitly state we will redesign the paralegal role, not let it drift.

  11. **Final Word Count Check:** Aiming for ~1,000-1,100 words to be safe.

  *(Drafting starts)*
  To: Board of Directors and Staff
  From: [My Name/Chair]
  Date: [Current Date]
  Subject: Decision on Adoption of AI Drafting Tool (Briefwell)

  **Recommendation**
  I recommend we **approve the adoption of Briefwell with strict conditions**, effective immediately for a pilot phase, with automatic suspension triggers built into the rollout. We cannot maintain the status quo where we turn away sixty percent of qualified clients. However, we cannot adopt a tool that risks substantive legal errors or hollows out the professional judgment required to catch them. This memo outlines the plan, the safeguards, and the ethical reasoning behind them.

  **The Moral Emergency and the Risk**
  The argument for adoption is straightforward and compelling. Our queue is a moral emergency. When a client waits three weeks longer for an eviction answer because an attorney is drafting from scratch, that delay has real human costs. Our newer attorneys and intake staff are correct: agonizing over our own professional fulfillment while clients suffer is untenable. The funder's expectation aligns with this reality; efficiency is a requirement of scale.

  However, the skepticism from senior litigators and paralegals is not merely resistance to change. The risk with generative AI is not that it fails obviously, but that it fails plausibly. A hallucinated deadline or a subtly incorrect legal standard looks authentic. If the person reviewing the work did not draft it, they lack the intuitive grasp of the argument's architecture needed to spot the flaw. This creates a liability trap: the signing attorney is responsible for the filing, but the tool has obscured the reasoning process.

  **On "Meaningful Work" and Status Anxiety**
  A central question in this debate is whether a charity funded to serve clients is allowed to weigh the quality of staff work in its decisions. A hardline view suggests that staff fulfillment is irrelevant; only client output matters. If the brief gets filed, the client is served. Worrying about whether a paralegal finds the work meaningful is viewed as status anxiety—professional privilege dressed up as ethics.

  I reject this view. It is not status anxiety to insist on the preservation of the "office." There is a distinction between the *product* (the filed brief), the *craft* (the skill to write it), and the *office* (the identifiable person who stands behind it and can explain why it says what it says). Automation can preserve the product while eroding the craft. When the craft erodes, the "office" becomes hollow. The person signing the document becomes a rubber stamp rather than an accountable professional.

  This matters to clients. When a case goes wrong, the client needs a professional who understands the document's genesis enough to fix it. If our staff become merely machine-checkers, their ability to exercise judgment atrophies. Preserving meaningful work is not about protecting staff comfort; it is about maintaining the human accountability structure that protects clients when the technology fails. We cannot serve clients well with a staff whose judgment has been systematically disabled.

  **Implementation Plan and Conditions**
  We will proceed with adoption, but not as a blanket rollout. The following conditions are binding.

  1.  **Scope Limitation:** Briefwell may only be used for initial drafts of benefits denial appeals and uncontested name changes for the first six months. It is **prohibited** for eviction answers, discovery responses, or any pleading with strict jurisdictional deadlines until the Phase 2 review.
  2.  **Review Milestones:** Formal review occurs at month 6 and month 12. These are not mere check-ins. They are go/no-go gates for expanding scope.
  3.  **Rollback Triggers:** The pilot will be automatically suspended if:
      *   The error rate in AI-drafted documents exceeds 5% during quality assurance reviews.
      *   There is any instance of a court sanction or adverse ruling directly attributable to an AI error.
      *   Staff turnover in the paralegal unit exceeds 15% annually during the pilot period, indicating role dissatisfaction or burnout.
  4.  **Role Redesign:** We acknowledge that the paralegal role will change. We will not allow it to drift into "person who checks the machine." By [Date, 3 months from now], HR and the Legal Director will present a redesigned job description for paralegals that elevates their role to "Case Strategy & Oversight," explicitly shifting time saved from drafting to client counseling and complex fact investigation. If we cannot find enough high-judgment work to fill the time, we will admit we are reducing the role's scope and adjust compensation or headcount accordingly. We will not hide this drift.
  5.  **Liability:** The signing attorney retains full professional responsibility for all documents. Briefwell is a research assistant, not a co-counsel. No document leaves the office without an attorney's signature and verification of every citation and deadline.

  **The Strongest Case Against This Recommendation**
  The strongest argument against these conditions is that they are too cautious. Critics will argue that limiting the tool to benefits appeals wastes its potential to solve the eviction backlog, which is the most urgent harm. They will say that if the tool is good enough for benefits, it is good enough for evictions, and that delaying its use in high-stakes housing cases prolongs the suffering of the very people we aim to protect. They are right that caution has a cost. Every week we limit the tool is a week of inefficiency we could have used to clear the queue.

  **Verdict**
  We are adopting this technology because the status quo is unsustainable. But we are adopting it with conditions because the alternative—unchecked automation—threatens the integrity of our representation. The worry about craft and office is not status anxiety; it is a quality control mechanism. If we lose the ability to craft our arguments, we lose the ability to verify them.

  This path requires us to be honest about what we are doing. We are trading some speed for safety, and we are committing to redesigning roles rather than letting them decay. If the tool cannot meet these standards, we will turn it off. Our duty is to our clients, and that duty requires us to be competent, not just fast.

  **Next Steps**
  Vendor contract review begins Monday. Staff training on the "Scope Limitation" begins [Date]. The first QA report is due [Date 6 months out].

  Let's get to work.
