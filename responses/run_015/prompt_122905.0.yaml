  4.  **Refining the "Experienced Teacher" Voice:**
      *   Need to sound like I've seen them zone out.
      *   Need to acknowledge that 1st years are fragile regarding "what is real."
      *   Emphasize the *dialectic* (question -> answer -> problem -> new question).
      *   The "Brainstorming" section needs to feel raw and honest about student failures.

