prompt: |-
  You're a philosopher of physics who has taught this exact seminar a dozen times. Please think carefully, and start with a bit of unstructured brainstorming about where students actually get stuck on this material before you commit to a plan — dont just dump the dialectic at me.

  I've got a 75-minute seminar next week with first-year physics undergrads: one term of mechanics behind them (they've met centrifugal and Coriolis as "fictitious" forces, they can do F=ma in a rotating frame), zero philosophy. The topic is substantivalism vs. relationism about space, and Newton's bucket argument. I do NOT want you to explain the debate to me — I know the rough outline. I want a plan for how to explain it to them.

  What I need:

  1. The order. What has to be in place before what, and why. My instinct is that they can't even hear the question until something about straight-line motion is settled first — the Galileo's-ship style point that constant velocity is undetectable, so the absolute-vs-relative fight can't even get started there, and the bucket only becomes interesting because rotation/acceleration looks detectable. Tell me if that's the right opening move or whether it eats time I need later, and give me the dependency chain: which step collapses if I reorder it.

  2. The one carrying case. I want a single case to do the work of the whole hour, not a parade of thought experiments. My candidate: two identical buckets of water in an otherwise empty universe, stacked along a common axis, both spinning about that axis in the same direction at the same rate — so the distance and the relative orientation between them never changes, and there is nothing else in the universe for either to be rotating relative to. On a Newton-style view the water still climbs the walls in both; on a naive "rotation is just rotation relative to other matter" view there is no rotation here at all. Tell me whether that's the right carrier, and what a case like this must have and must lack to do the job — I'm guessing it must lack any change in the distances between material things, or the relationist wriggles out for free. Also: which single variant is worth four minutes of class (reversing one bucket? spinning the whole pair about a different axis? adding a distant shell of matter?) and which ones I should refuse to open. If you'd rather carry the hour on a different case, justify the swap in two sentences and then run the rest of the plan on yours.

  3. The misconception map, with each one pinned to a point in the sequence. My guesses, keep or toss as you see fit: "the water climbs because of inertia, it's trying to go in a straight line, done" (is that an answer, or just Newton's mechanics in different words?); "absolute space is just a coordinate grid / the vacuum / a giant box the universe sits inside"; "relationism means nothing is really moving, it's all perspective"; "Mach says it's the fixed stars, so delete the stars and the water goes flat" (do I want that can of worms in a first-year class?). And the one I'm most worried about: they'll slide straight from "the bucket shows rotation is absolute" to "so space is a substance", without noticing that being a realist about space and treating acceleration as absolute are seperate commitments that can come apart in both directions. For each: roughly how many minutes in it surfaces, and the one move that heads it off without me lecturing at them for five minutes.

  4. Where the math helps and where it actively hurts. These are physics students — an equation will relax them, and it will also give them somewhere to hide.

  5. What to flat-out leave out at this level, and what I should actually say out loud if a sharp student asks anyway. I'd rather name the omission than pretend it isn't there.

  6. One closing question that tells me whether the idea landed rather than whether they memorised the labels "substantivalism" and "relationism" — ideally the wrong answers are diagnostic too.

  Assume no web, no handout, no assigned reading: just me, a whiteboard, and them.
