          *   Then the "Empty Universe" modification (The Prompt's Case). This forces the crisis.
          *   Then the Definitions (Substantivalism vs. Relationism).
          *   *Collapse risk:* If you define Substantivalism before showing *why* we need it (the Bucket), it sounds like dogma. If you do the Bucket before Galileo, they think the water moves relative to the *room*.

      *   **2. The Carrying Case:**
          *   Prompt's "Two Buckets" is essentially Newton's "Two Globes" connected by a cord.
          *   *Verdict:* It's too abstract for minute 1. It's perfect for minute 45.
          *   *Recommendation:* Use the **Single Bucket** as the anchor (they know the physics), but drive the discussion toward the **Empty Universe** variant to test the metaphysics.
          *   *Why?* The Single Bucket has a container. Relationists can say "relative to the container." Newton says "No, relative to space." The Empty Universe removes the container.
          *   *Variant to explore:* Mach's Star Shell. (Spinning the universe around the bucket).
          *   *Variant to avoid:* Reversing one bucket (adds unnecessary complexity about relative angular velocity vectors).

      *   **3. Misconception Map:**
          *   "Inertia explains it": This is circular. Inertia is defined by the geometry of space.
          *   "Absolute Space = Grid": Need to distinguish mathematical tool from ontological commitment.
          *   "Relationism = Everything is Relative": Crucial distinction between $v$ and $a$.
          *   "Space is a Substance": The big leap. Realism $\neq$ Substantivalism (manifold substantivalism vs. container).
          *   *Timing:* "Inertia" comes early (Bucket phase). "Grid" comes mid (Definition phase). "Everything Relative" comes early (Galileo phase). "Substance" comes late (Synthesis phase).

      *   **4. Math:**
          *   Use $F_{centrifugal} = m \omega^2 r$.
