answer: |-
  **FINAL EXAMINATION: PHILOSOPHY OF MIND**
  **Seminar: The Unity of Consciousness**

  **Time Allowed:** 90 Minutes
  **Word Limit:** 800 Words Maximum

  **Question 1**

  Consider Patient N, several years post-callosotomy. N displays the standard dissociation: she cannot name objects presented to her left visual field, yet her left hand can sort and match those same objects successfully. However, N presents two unusual features that pull in opposite directions.

  First, N acquires novel bimanual skills—such as a two-handed piano passage she has never practised—at close to normal speed. This sits badly with the hypothesis of two independent centres of motor control. Second, on trials where a written instruction delivered to her right hemisphere conflicts with a spoken instruction to her left, her hands carry out opposite actions. Her physiological response registers conflict (elevated skin conductance, distressed facial affect), yet her verbal report mentions only the spoken instruction, confabulates a rationale for what her left hand did, and registers no conflict at all.

  The slogan "two minds in one skull" runs together at least three distinct claims: (1) there are two subjects of experience; (2) there is one subject whose experiential contents are not all co-conscious; (3) there are two centres of agency sharing no access.

  Write an essay that addresses the following:

  1.  Disambiguate these three claims. Say which, if any, N's case supports, explaining why the evidence points in both directions at once.
  2.  Address the crux: Is the question "how many subjects?" well-posed here? What evidence could in principle settle it, and why does N's own verbal report fail to settle it either way?
  3.  Hold your verdict steady across the operation. If you argue there are two subjects, explain why the pre-operative patient was not already two. If you argue there is one subject, explain what the operation actually changed.

  ***

  **MODEL ANSWER**

  Patient N's case demonstrates that the concept of a "subject" is not a binary switch but a cluster of capacities that can come apart. To evaluate N, we must separate the three claims. Claim (1) posits distinct ontological entities. Claim (2) posits a single entity with fragmented access. Claim (3) posits distinct executive controllers. N's evidence supports (2) while undermining (1) and (3).

  The bimanual piano skill is decisive against (1) and (3). Learning a coordinated motor sequence requires a unified planning system. If there were two centres of agency sharing no access, the hands should compete or fail to synchronize on novel tasks. The fact that N learns at normal speed suggests a single centre of agency managing both sides of the body. This supports Claim (2): there is one subject, but the experiential contents feeding into that subject's verbal reporting system are not all co-conscious. The left hemisphere speaks for the whole body but lacks access to the right hemisphere's visual inputs.

  However, the conflict trials provide evidence for disunity. The hands act independently, and physiology registers stress that the verbal report denies. This looks like two subjects fighting. Yet, the physiological conflict belongs to one body, and the confabulation suggests a single narrative self trying to make sense of disjointed outputs. The evidence points in both directions because agency is unified (piano) while access is fragmented (conflict trials).

  Is the counting question well-posed? Yes, provided we define "subject" by the unity of agency rather than the unity of access. If subjecthood requires co-consciousness, N is two. If it requires unified agency, N is one. Given that agency governs action and survival, unified agency is the stronger criterion. Therefore, N is one subject. Evidence that could settle this would involve testing whether the two hemispheres can form joint intentions without external cueing. N's verbal report cannot settle it because the reporting mechanism (left hemisphere) is itself a party to the dispute. It lacks access to the conflicting state and thus constructs a false unity. To trust the report is to trust the interpreter module that is designed to hide disunity.

  Finally, we must hold this verdict steady across the operation. If N is one subject post-op, she was one subject pre-op. The operation did not split a subject; it severed the communication channels that normally integrate access within a single subject. Pre-operatively, the patient was one subject with integrated access. Post-operatively, the patient is one subject with segregated access. The change was structural, not ontological. To claim the operation created a second subject implies the pre-operative unity was merely contingent connectivity. But if connectivity constitutes subjecthood, then any loss of memory or attention splits the subject. We do not say a distracted person is two subjects. Therefore, the callosotomy revealed modular fragmentation that was always present but functionally masked by commissural communication. N remains one subject, now struggling to integrate parts that were never truly separate agents, but are now separate access-domains.

  ***

  **MARKING SCHEME (20 Marks Total)**

  **1. Disambiguation of Claims (4 Marks)**
  *   **Requirement:** Clearly distinguishes between two subjects of experience, one subject with non-co-conscious contents, and two centres of agency.
  *   **Typical Mistake:** Conflating "agency" with "experience" or treating the three claims as synonymous variations of the same idea.

  **2. Analysis of Bimanual Skill (4 Marks)**
  *   **Requirement:** Uses the piano skill to argue against two centres of agency/two subjects (evidence for unity).
  *   **Typical Mistake:** Ignoring the piano evidence or dismissing it as merely "muscle memory" without addressing the motor planning implication.

  **3. Analysis of Conflict/Confabulation (4 Marks)**
  *   **Requirement:** Uses the conflict trials to argue for fragmented access/non-co-consciousness (evidence for disunity) while noting the physiological unity.
  *   **Typical Mistake:** Treating the confabulation as proof of two subjects rather than proof of one subject lacking access to specific states.

  **4. The "Well-Posed" Crux & Verbal Report (4 Marks)**
  *   **Requirement:** Takes a stance on whether the counting question is well-posed and explains why the patient's report is unreliable (interpreter module/access limitation).
  *   **Typical Mistake:** Sitting on the fence ("it depends") without defending a criterion, or trusting the verbal report as authoritative evidence of unity.

  **5. Pre/Post-Operative Consistency (4 Marks)**
  *   **Requirement:** Explains what changed (connectivity/access) without changing the subject count, avoiding the implication that the pre-op patient was already split or that the operation created new ontology.
  *   **Typical Mistake:** Arguing the operation created a second subject (failing the pre-op constraint) or arguing the pre-op patient was two subjects merged (failing the definition of subjecthood).
