prompt: |-
  what would a theory of work's actual meaning have to get right? im especially stuck on these zombie tasks - jobs that survive automation not because anyone needs the output, but because they signal that someone is still in charge, like generating reports AI already wrote but a manager still has to "review" them for liability reasons. i want the full spec: cases it has to handle, distinctions it cant collapse (value vs legitimacy), results from sociology or labor economics it cant flat-out contradict, and which single requirement knocks out the most popular theories. does it also need to explain why automation so often spawns more monitoring work rather than less?
reasoning: |-
