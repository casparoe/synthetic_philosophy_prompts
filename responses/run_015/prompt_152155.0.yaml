  2.  **Initial Brainstorming & Framing:**
      *   The user is asking for a *meta-theory* of work. Not just "what is work," but "what makes work *meaningful* or *existent* in a modern capitalist bureaucracy," specifically addressing the inefficiencies.
      *   The "Zombie Task" concept echoes David Graeber's "Bullshit Jobs," but the user is digging deeper into the *mechanism* (liability, signaling control) rather than just the moral judgment.
      *   Key tension: Economic efficiency (neoclassical view) vs. Sociological reality (power, ritual, legitimacy).
      *   The theory needs to bridge economics, sociology, and organizational psychology.

  3.  **Drafting the "Full Spec" (Cases to Handle):**
