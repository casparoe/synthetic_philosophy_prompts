      *   *Rent-seeking:* Lobbying (profitable for the firm, net negative for society).
      *   *Ritual Work:* Safety drills, compliance training that no one reads.
      *   *The Theory must explain why all these are categorized as "work" and paid, despite varying utility.*

  4.  **Identifying Critical Distinctions (Value vs. Legitimacy):**
      *   *Economic Value:* Does this produce a good/service people want?
      *   *Legitimacy/Political Value:* Does this prove the organization is functioning according to norms/laws/hierarchy?
      *   *Collapse Danger:* Neoclassical economics collapses these into "marginal product." If you're paid, you must be productive. The user's prompt explicitly rejects this. The theory *must* separate output utility from organizational survival mechanisms.

  5.  **Empirical Constraints (Sociology/Economics):**
