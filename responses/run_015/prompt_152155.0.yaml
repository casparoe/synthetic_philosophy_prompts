      *   *Baumol's Cost Disease:* Service sectors don't automate easily (though the user is asking about tasks that *could* but *don't*).

  6.  **The "Killer Constraint" (Knocking out popular theories):**
      *   *Neoclassical Theory:* Fails because it assumes rational efficiency. Zombie tasks are irrational by definition.
      *   *Marxist Labor Theory of Value:* Struggles with "unproductive labor" that is still paid. It explains exploitation but not necessarily *pointless* labor that benefits the manager more than the capitalist.
      *   *Graeber's "Bullshit Jobs":* Good descriptive, but lacks a functional *mechanism* for why they persist (it blames "managerial feudalism," but a rigorous theory needs to explain the *incentive structure*).
      *   *The Killer:* **The theory must explain why rational actors sustain irrational processes.** If the theory assumes organizations maximize profit, it fails. If it assumes individuals maximize leisure, it fails. It must explain *risk aversion* and *liability distribution* as higher priorities than efficiency.

