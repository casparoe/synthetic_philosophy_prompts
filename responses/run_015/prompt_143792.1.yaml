answer: |-
  ### 1. Mapping the Case to the Theory

  **Population and Situation**
  Lewis requires a population $P$ and a recurrent situation $S$. In *Dagen H*, $P$ is not merely "drivers" but "all road users in Sweden" (including pedestrians and cyclists, who also had to reorient expectations). $S$ is not a single dyadic encounter (one car meeting another) but the aggregate of all such encounters within the national network. Lewis's theory scales: the convention holds because every dyadic interaction is a token of the same type. If the convention holds for the dyad, it holds for the population.

  **Options and Payoffs**
  The options are binary: Drive Left ($L$) or Drive Right ($R$).
  The payoffs are coordination-dependent.
  *   $L/L$ and $R/R$: High payoff (safe passage).
  *   $L/R$ or $R/L$: Catastrophic payoff (head-on collision).

  **Pure Coordination vs. Distributional Residue**
  Here the mapping strains. Lewis's paradigmatic conventions are pure coordination problems (e.g., which side of the telephone to speak on first) where preferences coincide. *Dagen H* was an *impure* coordination problem with significant distributional consequences.
  *   **Coincident Preferences:** Everyone preferred *some* uniform rule over chaos.
  *   **Conflicting Preferences:** Owners of left-hand-drive (LHD) cars faced devaluation; bus companies (with right-hand-door fleets) gained efficiency; tram systems faced existential costs.
  *   **Lewisian Accommodation:** Lewis allows for conventions where one equilibrium is slightly preferred by some, provided the coordination benefit outweighs the distributional loss. However, the 1955 referendum (83% against change) suggests the distributional costs and transition risks were perceived as outweighing the coordination benefits of switching *at that time*.
  *   **Arbitrariness:** Lewis requires that the alternative equilibrium ($R$) could have been selected instead of ($L$). Pre-1967, $L$ was entrenched. Post-1967, $R$ was entrenched. The *choice* of side is arbitrary in the abstract, but the Swedish case violates the spirit of arbitrariness because $R$ was objectively superior regarding regional compatibility (Norway/Finland) and vehicle manufacturing standards. Lewis's framework handles this by treating it as a shift from a local equilibrium ($L$) to a globally compatible one ($R$). The "arbitrariness" lies in the fact that traffic *could* have flowed safely on the left indefinitely if Sweden were an island; the pressure was external.

  **The Referendum**
  On a Lewisian reading, the 1955 vote should not be read as a preference for $L$ over $R$ in isolation. It is evidence of the **strength of the existing expectation**. Voters were not choosing between $L$ and $R$; they were choosing between *Certainty ($L$)* and *Risk (Transition to $R$)*. The vote confirms the Lewisian claim that conventions are self-reinforcing: the expectation that others will drive on the left made driving on the left the rational choice, even if $R$ was theoretically preferable.

  ### 2. Where the Theory Speaks and Where it is Silent

  **Stability and Lock-in**
  Lewis's theory perfectly models the pre-1967 stability. The regularity was sustained because:
  1.  Almost everyone conformed.
  2.  Everyone expected everyone else to conform.
  3.  Deviation was suicidal.
  This explains why the 83% vote against change was rational. It also explains the post-change stability: once the switch occurred, the new expectation set locked in immediately.

  **The Transition Problem**
  Lewis's account is an equilibrium analysis; it explains why conventions *persist*, not how they *change* when unilateral deviation is catastrophic. It is silent on the mechanics of jumping from one basin of attraction to another. This is where your two speculative suggestions do heavy lifting.

  **Suggestion 1: The State as Correlating Signal**
  Your proposal is that the Riksdag's declaration functioned as a public correlating signal that manufactured the **common knowledge** Lewis requires, backed by a second-order convention of deferring to the state.
  *   **Lewisian Assessment:** Lewis discusses "salience" and "precedent" as generators of common knowledge. A state decree is a super-salient focal point. However, Lewis typically assumes common knowledge arises from shared experience or precedent. Your addition of a *second-order convention* (obey the state on traffic) is a necessary augmentation. It explains *why* the signal was trusted to be common knowledge.
  *   **The Probe (4/5 Drivers):** If the announcement reached only 80% of drivers randomly, and drivers knew this probability but not who was informed, Lewis's theory predicts **coordination failure**.
      *   *Reasoning:* Common knowledge requires an infinite recursion: I know $X$, I know that you know $X$, I know that you know that I know $X$. If there is uncertainty about the signal's reach, the chain breaks. If I am informed, I cannot be sure *you* are informed. If I suspect you might not know the switch date, I must assume you will drive on the left (the old equilibrium). Therefore, I must also drive on the left to avoid hitting you.
      *   *Verdict:* The theory predicts chaos/crashes on the morning of *Dagen H*. This is the correct prediction. It confirms that the exhaustive public campaign (ensuring near-100% reach) was not just "education" but a logical prerequisite for generating the common knowledge required to shift equilibrium.

  **Suggestion 2: Material Sediment vs. Expectation**
  You propose a distinction between regularities sustained by expectations and those sustained by "material sediment" (road markings, car geometry).
  *   **Lewisian Assessment:** Lewis defines convention as a regularity in *action* sustained by *expectations*. If I drive on the right because a concrete median physically prevents me from going left, my action is not primarily caused by my expectation of *your* behavior, but by physical constraint.
  *   **Verdict:** Post-1967, the Swedish regularity became **hybrid**. The *selection* of the equilibrium was conventional (driven by the state signal/expectations). The *maintenance* became partially structural.
  *   **Implication:** This does not mean it ceased to be a convention, but that the *cost of deviation* shifted from "probable crash" to "physical impossibility/legal penalty."
  *   **Britain/Japan:** The same worry applies. In the UK, the material sediment (roundabouts, LHD cars) reinforces the expectation. Lewis's theory applies to the *origin* and the *normative glue*. Once the glue hardens into concrete, the regularity looks like a convention but functions like a law of physics. Lewis's framework struggles to distinguish between a convention that is *too costly to break* and a constraint that is *physically impossible to break*. For analytical purposes, we should treat the *decision* to install the sediment as the conventional act, and the sediment itself as a mechanism that raises the exit cost, effectively freezing the convention.

  ### 3. The Verdict

  **Confirmation, Anomaly, or Out-of-Scope?**
  *Dagen H* is a **confirmation of the static logic** of Lewis's theory but an **anomaly for the evolutionary genealogy** often associated with it.

  1.  **Static Logic (Confirmed):** The episode validates Lewis's core claim: behavior is driven by reciprocal expectations. The 1955 referendum and the pre-1967 stability show that the "inferior" equilibrium ($L$) persists because expectations sustain it. The immediate stability post-1967 shows that once expectations are flipped, the new convention locks in instantly.
  2.  **Evolutionary Genealogy (Challenged):** Lewis often presents conventions as emerging from precedent and gradual evolution (tacit agreement). *Dagen H* demonstrates that conventions can be **engineered**. The shift was not bottom-up evolution but top-down design.
      *   *Does this count against the evolutionary story?* It suggests that while conventions *can* evolve, they do not *must*. When the coordination problem is too sharp (unilateral deviation is fatal), evolution is impossible. A "shock" (state fiat) is required. Lewis's theory of *what a convention is* survives, but his implicit story of *how they arise* needs to accommodate deliberate, centralized coordination.
  3.  **The Role of Authority:** The case suggests Lewis's account of "common knowledge" is incomplete without a theory of **authority as a knowledge-generator**. The Riksdag did not just command; it created the common knowledge necessary to make the command self-fulfilling. This supports your first speculation: authority bootstraps convention by solving the common knowledge problem.

  **Conclusion**
  *Dagen H* is not a counter-example to Lewis's definition, but it exposes the limits of his equilibrium-focused machinery.
  *   **What it models:** The stability of the pre- and post-change states; the rationality of the 1955 vote (preference for equilibrium over intrinsic side); the necessity of common knowledge for the switch.
  *   **What it cannot model:** The mechanics of the transition itself. Lewis explains why you don't deviate; he does not explain how everyone deviates simultaneously without a prior coordinating mechanism (the State).
  *   **Final Judgment:** The episode confirms that traffic rules are Lewisian conventions (arbitrary regularities sustained by expectations), but it demonstrates that **conventions can be legislated into existence** provided the legislation successfully manufactures common knowledge. The "material sediment" that followed merely cemented the convention, moving it from the realm of pure expectation to structural constraint, but the foundational regularity remains conventional in origin. The 1955 referendum is best read as evidence of the **inertia of expectation**, proving that in coordination problems, the status quo has a massive advantage that only a coordinated shock can overcome.
