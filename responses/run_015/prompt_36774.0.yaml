answer: |-
  It is a pleasure to meet a colleague who looks at decision theory through the lens of signal processing. Your intuition about noise averaging is spot on: in radio astronomy, as in probability theory, we rely on the Law of Large Numbers to save us from the vagaries of individual fluctuations. We assume the integrals exist. The Pasadena game is essentially a proof by counterexample that, in the realm of rational choice, the integrals do not always exist.

  To answer your primary question immediately: **Your instinct is correct.** The Pasadena game is not merely St. Petersburg in a costume; it is a mathematically distinct and, in many ways, more corrosive pathology. St. Petersburg is a problem of *magnitude*; Pasadena is a problem of *definition*.

  Here is the technical breakdown of why, addressing your specific points about rearrangement, the severity of the paradox, and the available patches.

  ### 1. The Mathematical Distinction: Positive Divergence vs. Conditional Convergence

  You have the sums right. Let's formalize the expectation terms $a_n = p_n \cdot \text{payoff}_n$.

  *   **St. Petersburg:** $a_n = \frac{1}{2^n} \cdot 2^n = 1$. The expectation is $\sum_{n=1}^{\infty} 1$. This is a series of positive terms diverging to $+\infty$.
  *   **Pasadena:** $a_n = \frac{1}{2^n} \cdot \left( (-1)^{n-1} \frac{2^n}{n} \right) = \frac{(-1)^{n-1}}{n}$. The expectation is $\sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n}$.

  The St. Petersburg series diverges in the standard sense: the partial sums $S_N \to \infty$. In measure-theoretic probability, we are often comfortable assigning an expectation of $+\infty$ to a random variable, provided the negative part is finite. It's an "improper" expectation, but it's ordered. You can say, "This gamble is better than any finite sure thing."

  The Pasadena series is the alternating harmonic series. It is **conditionally convergent**.
  1.  The series converges to $\ln 2$ *if* summed in the canonical order ($n=1, 2, 3...$).
  2.  The series of absolute values $\sum |a_n| = \sum \frac{1}{n}$ diverges.

  This lack of absolute convergence is the smoking gun. In the theory of Lebesgue integration (which underpins modern probability), a random variable $X$ has a well-defined expectation $E[X]$ **if and only if** $E[|X|] < \infty$. If $E[|X|] = \infty$, the expectation is technically **undefined**, not infinite.

  So, to your first point: Yes, this is the Riemann Rearrangement Theorem doing a cameo, but it is not merely a metaphor. It is the structural reason the expectation fails to exist as a Lebesgue integral.

  ### 2. The "Rearrangement" Objection: Is it Legitimate?

  You raised a excellent practical objection: *"Nobody actually re-orders the tosses of a single gamble — the order is fixed by the setup."*

  In a physical implementation, you are right. The coin tosses happen in a temporal sequence $t_1, t_2, t_3$. If you play the game once, you get one outcome. If you play it $N$ times and average the results, the Strong Law of Large Numbers (SLLN) actually fails here because the expectation is undefined. The sample mean will not converge to a constant; it will oscillate wildly depending on the sequence of outcomes.

  However, the "rearrangement" objection in the philosophical literature isn't about physically re-ordering the coin tosses. It is about the **invariance of the description**.

  In decision theory, a gamble is defined by the mapping from states of the world to outcomes. The "states" are abstract. If I describe the gamble to you as "Outcome A happens with prob 1/2, Outcome B with prob 1/4...", the order in which I list these states on a piece of paper should not change the value of the gamble.

  If the value of the gamble depends on the order in which we sum the probability-outcome pairs, then the "Expected Utility" is not a property of the gamble itself, but a property of *how we calculate it*. That is fatal to the theory.

  Think of it like integrating a function over a domain. If the integral is not absolutely convergent, the value depends on the exhaustion of the domain (the sequence of finite subsets you use to approximate the infinite sum). Since there is no privileged "natural" exhaustion of an abstract probability space (other than the arbitrary indexing we chose to define the game), the value is indeterminate.

  So, the rearrangement argument is legitimate because it highlights that the **expectation operator is not well-defined** for this random variable. It's not that we *can* rearrange the tosses; it's that the mathematical object "Expectation" does not exist for this distribution.

  ### 3. Infinite vs. Undefined: Which is Worse?

  You guessed that "undefined" is more corrosive than "infinite." I agree entirely.

  **St. Petersburg (Infinite):**
  Expected Utility Theory (EUT) can technically accommodate infinite expectations. We can say the utility is $+\infty$. The problem is pragmatic: no one would pay an infinite amount to play. But theoretically, the axioms hold if we allow extended real numbers. The "paradox" is mostly that the theoretical value doesn't match human intuition (which is easily patched by noting diminishing marginal utility).

  **Pasadena (Undefined):**
  This breaks the axioms of EUT.
  1.  **Completeness:** EUT requires that for any two gambles $A$ and $B$, an agent must prefer $A$, prefer $B$, or be indifferent. If $A$ is the Pasadena game and $B$ is a sure $\$1$, what is the preference? If $E[A]$ is undefined, EUT cannot rank them.
  2.  **Dominance:** You can construct variants of Pasadena where the payoff is strictly better in every state than another gamble, yet the "sum" suggests they are equal or the reverse, depending on how you group the terms.
  3.  **Coherence:** With St. Petersburg, you can argue "I will pay \$1 million." With Pasadena, if you truncate the sum at $N=10$, the value is $X$. If you truncate at $N=11$, the value is $Y$. There is no stable limit for the "fair price" as the bankroll increases, because the partial sums oscillate around $\ln 2$ but the absolute error bound grows.

  Pasadena shows that EUT cannot even assign an extended real number to the gamble. It leaves the theorist speechless. As Hájek (one of the authors) put it, St. Petersburg shows that EUT recommends paying too much; Pasadena shows that EUT recommends **nothing at all**.

  ### 4. Do the Standard Patches Fix Both?

  This is where your engineering background will appreciate the trade-offs.

  **Patch 1: Bounded Utility Functions**
  If you postulate that utility $U(x)$ is bounded (i.e., there exists $M$ such that $|U(x)| < M$ for all $x$), then:
  $$ E[|U|] = \sum p_n |U(x_n)| < \sum p_n M = M \sum p_n = M < \infty $$
  This guarantees absolute convergence.
  *   **Verdict:** This kills both paradoxes instantly.
  *   **Cost:** Many philosophers and economists find bounded utility unpalatable. It implies there is a level of welfare/suffering beyond which more money/goodness makes no difference. It violates the "Archimedean" intuition that for any two outcomes, a sufficiently high probability of the better one should be preferred.

  **Patch 2: Finite Cutoffs (Real World Constraints)**
  If you say "No casino has infinite money," you truncate the series at some $N$.
  *   **Verdict:** This trivializes both paradoxes. The sums become finite.
  *   **Cost:** It dodges the theoretical bullet. The paradoxes are about the logic of rationality under uncertainty, not the liquidity of casinos. If rationality depends on the bankroll of the house, the theory isn't about *rationality*, it's about *accounting*.

  **Patch 3: Rejecting Expectation Maximization**
  Some theorists (like Buchak) argue we should maximize something other than expectation (e.g., Risk-Weighted Expected Utility).
  *   **Verdict:** This handles St. Petersburg well. It handles Pasadena better, but requires rewriting the foundational axioms of decision theory.

  ### Summary for the Astronomer

  In your line of work, if you encountered a signal where the noise floor didn't converge, you wouldn't say "the signal is infinite." You'd say "the measurement is ill-posed" or "the system is non-ergodic."

  *   **St. Petersburg** is like a signal with infinite power. It's unphysical, but you can describe it as "very loud."
  *   **Pasadena** is like a signal where the Fourier transform doesn't exist because the function isn't in $L^1$. You can't even define the power spectrum.

  The Pasadena game demonstrates that **Expected Utility is not a robust statistic** for all probability distributions. It requires the distribution of utilities to be absolutely integrable ($L^1$). St. Petersburg violates the boundedness of the utility; Pasadena violates the integrability of the utility-probability product.

  Your gut is right: "Undefined" is the deeper embarrassment. Infinite expectation is a boundary case; undefined expectation is a hole in the foundation. If you accept bounded utility, both vanish. If you don't, Pasadena suggests that Expected Utility Theory is mathematically incomplete for countably infinite state spaces.

  It is worth noting that Nover and Hájek intended Pasadena to show that even if you solve St. Petersburg (via bounded utility or finite bankrolls), you can construct a *new* game (the "Altadena" game, essentially Pasadena + 1) that dominates the original but creates the same summation issues. It's a whack-a-mole that suggests the problem isn't the specific numbers, but the marriage of countable additivity and unbounded utilities.

  So, keep digging down this rabbit hole. You've identified the precise point where the math of probability bumps into the philosophy of value, and unlike a noisy voltage, this noise doesn't average out.
