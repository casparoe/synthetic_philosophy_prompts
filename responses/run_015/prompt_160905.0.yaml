      *   *Mechanism:* If you only look at patients who *had* the Side Effect, Treatment A looks better (because it causes the side effect more, and the side effect helps recovery). But Treatment B is actually better overall.
      *   *Implementation:* In the Triage round, add a second layer of cards. "Did they develop a fever?" (Post-treatment).
      *   *Wait, time is tight.* Maybe keep it conceptual in the debrief but grounded in the *same* physical cards?
      *   *Alternative:* Use the "Triage" variable as the Confounder (Good to condition on). Invent a "Compliance" variable as the Mediator (Bad to condition on).
      *   *Decision:* Let's make the third point the climax of the debrief, using the *same* data but asking a different question. "What if 'Severity' wasn't pre-existing, but was actually 'Time waited in ER' which was caused by which Desk you went to?" No, that's confusing.
      *   *Best approach for Obj 3:* In the Decision Phase, give them a *second* dataset where the partition variable is a *consequence* of the treatment. E.g., Treatment A is harder, causes more dropouts. If you condition on "Completed Treatment," A looks better. But B is better for everyone.
      *   *Actually, let's look at the prompt again:* "partitioning on something the option itself causes — in which disaggregating is the error."
      *   *Design:* Round 1 (Triage): Partition by Severity (Pre-treatment). Disaggregating is *Correct*. Round 2 (New Variable): Partition by "Post-Treatment Symptom" (Mediator). Disaggregating is *Wrong*.
      *   *How to do this physically?* Two sets of cards. Set 1: Severity (Red/Blue border). Set 2: Symptom (Star/No Star). The Star is determined by the Treatment chosen.
      *   *Simplification:* To save time, maybe the "Mirror Image" is presented as a hypothetical modification of the data they just generated, or a very quick Round 3. Let's try a quick Round 3.

  7.  **Refining the Scoring/Incentives:**

      *   Team competition.
      *   Points for:
          1.  Successfully constructing a reversal (Activity 1).
          2.  Correctly identifying the "Director's Choice" in Triage (Activity 2).
          3.  Correctly identifying the "Director's Choice" in Mediator (Activity 3).
      *   Penalty: Choosing the aggregate winner when the causal structure says otherwise (or vice versa).
      *   Prize: Chocolate for the winning team.

  8.  **Addressing the "Colleague" Objection (Randomization):**

      *   In the RCT round (Dice), the weights *should* balance. If they don't perfectly, the reversal should vanish or become negligible.
      *   If a reversal *does* appear in the RCT round due to small N, use it! "This is noise. In the Triage round, the weights were *forced*. In the RCT, they are *random*. If you see a reversal here, it's luck, not law."

  9.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Keep it tight. No "Simpson." Call it "The Aggregation Problem."
      *   *Activity 1 (Construction):* Give them margins. $N_A, N_B$, Success Rates. Ask them to make Total A > Total B while Subgroup A < Subgroup B.
      *   *Activity 2 (Triage):* Students act as doctors. Patients come in (Cards). Severity visible. They choose Treatment. Outcome revealed (Dice roll modified by Severity + Treatment).
      *   *Activity 3 (Mediator):* Quick handout. "Imagine 'Fever' is caused by Drug A."
      *   *Debrief:* Connect the physical sorting to the causal graph.

  10. **Predicting Failures:**

      *   *Stats students dominating:* Assign roles. "Calculator," "Recorder," "Decision Maker." Rotate.
      *   *Non-stats students lost:* Keep the math to simple fractions/percentages. Use visual bars on the worksheet.
      *   *Data too noisy:* Pre-load some cards? No, that breaks the "room does the sorting" rule. *Fix:* Use a large enough N. 20 students x 3 patients each = 60 cases. That's enough for a signal.
      *   *Spoiler:* Explicit rule: "If you name the paradox, your team loses 5 points."

  11. **Final Review against Constraints:**

      *   90 mins? Yes, tight but doable.
      *   No money? Chocolate/Points used.
      *   Paper/Dice? Yes.
      *   3 Objectives met?
          1.  Arithmetic (Activity 1).
          2.  Sorting/Decision (Activity 2).
          3.  Causal Order (Activity 3/Debrief).
      *   Colleague objection? Addressed in RCT round.
      *   Debrief mapping? Included.
      *   "Change my mind"? Included.

  12. **Writing the Response:** (Focusing on tone: professional, pedagogical, precise). *Self-Correction during drafting:* Make sure the Mediator round doesn't bog down. It needs to be a "Think Pair Share" based on modified data, not a full new simulation, or we run out of time. Let's make Activity 3 a "What If" scenario using the *same* physical cards but re-interpreting one variable. Actually, a separate small handout is clearer. Let's go with a "Round 3: The Trap" using a simplified table provided on paper, derived from the logic they just learned. It saves time and ensures the effect is visible.

