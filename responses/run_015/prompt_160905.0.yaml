      *Revised Timeline:*
      *   0-15: Intro & Construction (Obj 1).
      *   15-45: Simulation Round 1 (Triage/Confounder) (Obj 2 & Colleague).
      *   45-60: Simulation Round 2 (Mediator/Collider) (Obj 3).
      *   60-80: Debrief & Causal Maps.
