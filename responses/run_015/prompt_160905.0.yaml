answer: |-
  Here is a complete design for the 90-minute session. It is built to be robust against the mixed statistical background, physically engages the "sorting" mechanism, and forces the causal distinction without relying on lecture.

  # Session Title: The Weighting Game
  **Time:** 90 Minutes
  **Participants:** 18–22 Graduate Students
  **Materials:**
  *   **Patient Cards (60 total):** Index cards. 30 marked "High Risk" (Red dot), 30 "Low Risk" (Green dot). On the back, a table of random numbers (1–6) for Outcome determination.
  *   **Treatment Tokens:** Two colors (e.g., Blue for Treatment A, Yellow for Treatment B).
  *   **Dice:** 6-sided, one per table.
  *   **Worksheets:** "The Ledger" (for recording counts) and "The Directive" (for decision making).
  *   **Envelopes:** One per team, containing the "Mediator Scenario" (for Part 3).
  *   **Prize:** High-quality chocolate for the winning team.

  ---

  ## Minute-by-Minute Timeline

  ### 0:00 – 0:10 | Introduction & The Ban
  *   **Hook:** "You are hospital administrators. You have two drugs, A and B. You need to know which one works."
  *   **The Ban:** Explicitly state: "There is a name for the phenomenon we are studying. If anyone says 'Simpson's Paradox' before minute 80, their team is disqualified from the prize. We call this 'The Weighting Problem.'"
  *   **Grouping:** Divide into 4 teams of 5–6 people.
  *   **Roles (per team):**
      *   *Triage Officer:* Decides which treatment a patient gets.
      *   *Clerk:* Records data on The Ledger.
      *   *Director:* Makes the final policy choice.
      *   *Auditor:* Checks the math.
      *   *(Rotate roles if time permits, otherwise stick to one).*

  ### 0:10 – 0:25 | Activity 1: The Construction Challenge (Objective 1)
  *   **Goal:** Feel the arithmetic constraint.
  *   **Task:** Each team gets a worksheet with empty cells for Treatment A and B, split by High/Low Risk.
  *   **Constraint:** You must fill in the Success Rates (%) for A and B such that:
      1.  In High Risk, A > B.
      2.  In Low Risk, A > B.
      3.  **But** in the Total Aggregate, B > A.
  *   **Rule:** You cannot change the rates. You can only change the **Number of Patients (N)** in each cell.
  *   **Process:** Teams try to balance the Ns. They will fail. They will succeed only when they make the Ns lopsided (e.g., put most High Risk patients on Drug B, which has a lower baseline success rate, dragging down its aggregate).
  *   **Payoff:** First team to correctly construct a valid table gets 5 points.
  *   **Debrief Note:** Ask the winning team: "Did you change the success rates or the weights?" (Answer: Weights).

  ### 0:25 – 0:50 | Activity 2: The Triage Simulation (Objective 2 & Colleague Objection)
  *   **Goal:** Generate the sorting naturally; test the Randomization foil.
  *   **Round A (Triage):**
      *   Teams receive 15 Patient Cards (mixed Risk).
      *   **Rule:** The Triage Officer *sees* the Risk dot. They must assign Treatment. (Natural tendency: Give Drug B to High Risk because it's perceived as "stronger" or reserved for severe cases).
      *   **Outcome:** Roll the die.
          *   *Low Risk:* Success on 1–5 (Drug A), 1–4 (Drug B).
          *   *High Risk:* Success on 1–3 (Drug A), 1–2 (Drug B).
          *   *(Drug A is strictly better in both strata).*
      *   **Record:** Fill out The Ledger.
  *   **Round B (Randomization):**
      *   Teams receive 15 *new* Patient Cards.
      *   **Rule:** Treatment is assigned by Die Roll (1–3 = A, 4–6 = B). Triage Officer is blindfolded (or looks away).
      *   **Outcome:** Same dice rules as above.
      *   **Record:** Fill out The Ledger.
  *   **The Decision:** The *Director* must choose one drug for *all* future patients based on the data.
  *   **Payoff:**
      *   5 Points if Director chooses Drug A (the causal winner).
      *   0 Points if Director chooses Drug B (the aggregate winner in Round A).
      *   *Note:* In Round B (Randomization), the aggregate and cell-level should align. If a reversal happens by chance (finite sample noise), award points for A anyway, noting the weights balanced *on average*.
  *   **Colleague Check:** If a student argues Round B *cannot* show a reversal, ask them to check the Ns. If the dice made 10 High Risk patients land on B and only 2 on A, a reversal is arithmetically possible. The point is: Randomization makes this *unlikely*, Triage makes it *structural*.

  ### 0:50 – 1:05 | Activity 3: The Mirror Trap (Objective 3)
  *   **Goal:** Distinguish Confounder (Condition) vs. Mediator (Do Not Condition).
  *   **Task:** Do not generate new data. Open the **Envelope**.
  *   **Scenario:** "Imagine the 'Risk' dot wasn't pre-existing severity. Imagine 'Risk' was actually 'Developed a Fever.' Drug A causes Fevers (80%); Drug B does not (10%). Fevers predict Recovery (independent of drug)."
  *   **Data:** Use the *exact same numbers* from Round A (Triage).
      *   Drug A: High Fever rate, High Recovery rate.
      *   Drug B: Low Fever rate, Low Recovery rate.
      *   *Within* Fever groups: A is still better.
  *   **Question:** The *Director* must choose a drug for a new patient who has *not yet taken the drug* (and thus has no fever).
  *   **Trap:** If they condition on Fever (disaggregate), they might reason: "Look, A works better for Fever patients and better for Non-Fever patients."
  *   **Correct Move:** Do not condition. Fever is a *consequence* of treatment. Conditioning on it blocks the pathway through which A helps (or creates collider bias). The Aggregate is the correct guide for *future* policy.
  *   **Payoff:**
      *   5 Points if Director chooses Drug A based on Aggregate.
      *   -5 Points if Director chooses based on Disaggregated (Fever) tables.
  *   **Why:** This punishes the heuristic "always disaggregate."

  ### 1:05 – 1:20 | Debrief & Causal Mapping
  *   **Board Work:** Draw two DAGs (Directed Acyclic Graphs).
      1.  **Triage:** Risk $\rightarrow$ Treatment AND Risk $\rightarrow$ Outcome. (Confounder). *Solution: Condition.*
      2.  **Fever:** Treatment $\rightarrow$ Fever $\rightarrow$ Outcome. (Mediator). *Solution: Do Not Condition.*
  *   **Connect to Activity 1:** Point to the Ns in Activity 1. "The reversal happened because Risk sorted people into Treatment. The weights were not random; they were causal."
  *   **Connect to Activity 2:** "In the Randomization round, the arrow from Risk to Treatment was broken. The weights balanced. The reversal vanished (or became noise)."
  *   **Connect to Activity 3:** "In the Fever round, the arrow went Treatment to Fever. Conditioning on Fever was like looking at the future to decide the past."

  ### 1:20 – 1:30 | Naming & Q&A
  *   **Reveal:** "This is Simpson's Paradox."
  *   **Final Takeaway:** "The table does not tell you whether to disaggregate. The story tells you whether to disaggregate. The table only tells you the arithmetic cost of your story."
  *   **Award:** Chocolate to the team with the most points.

  ---

  ## Scoring Scheme (No Money)
  *   **Construction (Activity 1):** 5 pts (First team only).
  *   **Triage Decision (Activity 2):** 5 pts per correct choice (Drug A).
  *   **Mediator Decision (Activity 3):** 5 pts for Aggregate choice; **-5 pts** for Disaggregated choice. (The penalty is crucial to punish the "always disaggregate" heuristic).
  *   **Tiebreaker:** Team with the smallest margin of error in their Activity 1 N-weights.

  ---

  ## The Debrief: Mapping Moments to Objectives

  1.  **Objective 1 (Arithmetic/Weights):**
      *   *Moment:* Activity 1 (Construction).
      *   *Mapping:* When teams struggle to flip the aggregate with equal Ns, then succeed by inflating the N of the "worse" treatment in the "harder" group, they physically feel that the reversal is a property of the *denominators*, not the rates.
      *   *Instructor Line:* "You didn't change the drug efficacy. You changed the mix of patients. The reversal is a weighted average problem."

  2.  **Objective 2 (Sorting/Decision):**
      *   *Moment:* Activity 2 (Triage vs. RCT).
      *   *Mapping:* The Triage Officer *created* the correlation between Risk and Treatment. The Director's error in Round A (choosing B based on aggregate) is defensible for *accounting* (Auditor role) but wrong for *policy* (Director role).
      *   *Instructor Line:* "The Auditor sees the past (B looked better because it took the hard cases). The Director decides the future (A is better for everyone). The aggregate number is a report card, not a recipe."
      *   *Colleague Objection:* If a reversal appears in the RCT round, acknowledge it. "In finite samples, randomization doesn't guarantee balance, it guarantees *unbiased* imbalance. In the Triage round, the imbalance was *guaranteed* by the rule."

  3.  **Objective 3 (Causal Order):**
      *   *Moment:* Activity 3 (The Envelope).
      *   *Mapping:* Using the *same numbers* but flipping the causal story forces them to realize the table is causally blind.
      *   *Instructor Line:* "In Round 2, Risk caused Treatment assignment. In Round 3, Treatment caused Fever. Same table, opposite advice. The math didn't change. The arrow did."

  ---

  ## Limitations: What You Must State
  The activity cannot produce the following on its own; you must assert them in the debrief:
  1.  **The "Why" of Conditioning:** The activity shows *that* conditioning fixes the Triage round, but it doesn't prove *why* (back-door path blocking). You must draw the DAG to explain that conditioning on Risk stops the spurious flow of information.
  2.  **The "Impossible" Claim:** You cannot prove statistically that randomization eliminates the paradox in the population. You must state: "In the infinite long run, randomization breaks the link between Risk and Treatment. In this room, with 60 cards, it only weakens it."
  3.  **The Mediator Mechanism:** Activity 3 relies on them accepting the story in the envelope. You must explicitly state: "Conditioning on a mediator controls for a consequence of the treatment, which biases the effect estimate toward zero or reverses it."

  ---

  ## Predicted Failures & Fixes

  **1. The "Stats Student" Spoiler**
  *   *Risk:* A student with training recognizes the setup in minute 5 and shouts "Simpson's!"
  *   *Fix:* The "Ban" rule with a point penalty. Frame it playfully: "If you name the ghost, the ghost disappears and you lose points."
  *   *Mitigation:* If they spoil it, pivot immediately: "Great, you know the name. Now prove to your team *why* it happens using the cards, not the label."

  **2. The "Non-Stats" Confusion**
  *   *Risk:* Students without stats training get bogged down in calculating percentages during Activity 2.
  *   *Fix:* The Worksheet ("The Ledger") should have pre-printed tally marks. They don't need to calculate percentages live; they just need to see the tallies (e.g., A: |||| vs B: ||). The visual imbalance of the Ns is more important than the exact % for the intuition.
  *   *Role Support:* The "Auditor" role is specifically for the stats-trained students to handle the math, while the "Director" (can be non-stats) makes the choice based on the Auditor's summary.

  **3. Small Sample Noise (The Reversal Doesn't Appear)**
  *   *Risk:* In Activity 2 (Triage), the dice rolls might be kind, and Drug B doesn't win the aggregate despite the lopsided Ns.
  *   *Fix:* **Pre-loaded Cards.** For the Triage round, do not use dice for outcomes. Use cards where the outcome is *printed on the back*. You (the instructor) construct the deck beforehand to ensure the reversal *must* happen given the triage rule.
      *   *Why:* This guarantees the pedagogical payoff. The "randomness" of the dice is less important than the "structural" bias of the sorting. Save the dice for the RCT round where noise is the lesson.
      *   *Correction to Plan:* Use **Printed Outcome Cards** for Round A (Triage). Use **Dice** for Round B (RCT). This ensures Round A works reliably, while Round B demonstrates the stabilizing effect of randomization.

  **4. The "Fake Conflict" in Activity 3**
  *   *Risk:* Students feel Activity 3 is a trick question because the numbers are the same.
  *   *Fix:* Emphasize the **Decision Context**. "You are prescribing for a patient who does *not* have a fever yet." If they condition on fever, they are conditioning on a variable that doesn't exist yet for the new patient. This makes the error practical, not just statistical.

  ---

  ## What Would Change My Mind (Design Critique)

  I would reconsider this design if:

  1.  **The "Mediator" Round feels like a bait-and-switch.**
      *   *Argument:* If students feel that changing the label of "Risk" to "Fever" is just semantic wordplay without new data, they may dismiss the causal lesson as "interpretive flexibility" rather than structural necessity.
      *   *Fix:* If this objection arises, I would switch Activity 3 to a **second physical simulation** where Treatment *determines* the Envelope color (Mediator), and Outcome is determined by Envelope color. This makes the causal generation physical, not just narrative.

  2.  **The "Always Disaggregate" heuristic is not the dominant error.**
      *   *Argument:* In philosophy/social science, the dominant error might be *over-conditioning* on colliders (M-bias) rather than simple Simpson's reversals. Focusing heavily on "when to disaggregate" might miss the broader "causal structure" lesson.
      *   *Fix:* If the cohort is heavily causal-inference trained, I would pivot Activity 3 to an **M-Bias** scenario (conditioning on a common effect of two independent causes) rather than a Mediator. However, for a mixed group, the Mediator/Simpson contrast is more intuitive.

  3.  **The "Colleague Objection" is actually the central learning goal.**
      *   *Argument:* If the colleague's claim (Randomization makes reversal impossible) is the specific friction point of the week, spending only 15 minutes on the RCT round is insufficient.
      *   *Fix:* I would expand Activity 2 to run *three* RCT rounds to show the distribution of outcomes, demonstrating that while the *expectation* is zero bias, the *realization* can still flip. This requires more time and might cut into the Causal Order objective.

  **Final Verdict:** The design holds because it prioritizes the *arithmetic feel* (Obj 1) and the *causal story* (Obj 3) over the statistical nuance of finite sample RCTs (Colleague). The RCT round serves as a foil, not the main event. The use of pre-loaded cards for the Triage round ensures the reversal is visible, protecting the session from bad dice luck.
