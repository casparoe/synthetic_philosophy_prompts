      *   **Key Constraint:** Do *not* name the phenomenon (Simpson's Paradox) until the last 10 minutes.
      *   **Learning Objectives (3):**
          1.  Reversal is an arithmetic fact about weights (lopsided cell sizes).
          2.  No conflict between cell-level favorability and aggregate decision (weights reflect sorting, not choice); sorting must be generated by the room.
          3.  Conditioning depends on causal order (confounder vs. mediator); partitioning on a collider/mediator is an error.
      *   **Specific Challenge:** The user's colleague claims reversal is impossible with randomization (true in expectation, false in finite samples). The session must address this without relying on it quietly.
      *   **User's Ideas:** Data generation (triage vs. coin flip), construction round (force reversal), Role split (Quality Control vs. Chief).
      *   **Concerns:** Role split might be too verbal; non-stats students might get lost; early spoilers; small sample sizes hiding the effect.
      *   **Deliverables:** Rules, materials, roles, minute-by-minute timeline, scoring scheme, debrief mapping, limitations (what must be stated), predicted failures & fixes, "change my mind" criteria.

  2.  **Deconstruct the Learning Objectives & Pedagogical Strategy:**

      *   *Objective 1 (Arithmetic/Weights):* Needs a hands-on construction task. If they try to build a reversal with equal $N$s and fail, then succeed with unequal $N$s, they feel the arithmetic.
      *   *Objective 2 (Decision/Sorting):* Needs a simulation where *they* decide who goes where. If they choose the "hard cases" for one treatment, they create the bias. The decision rule needs to distinguish between "evaluating past performance" vs. "setting future policy."
      *   *Objective 3 (Causal Order):* This is the hardest. It requires distinguishing between a pre-treatment variable (confounder) and a post-treatment variable (mediator/collider). The "Triage" vs. "Coin Flip" idea is good here. Triage = Confounder (Severity affects Treatment & Outcome). Coin Flip = RCT (No Confounding). But we also need the *bad* conditioning case (mediator).
      *   *The "Colleague" Objection:* Finite sample variation in RCTs *can* produce Simpson's reversals purely by chance, even if the true effect is homogeneous. The session needs to show that randomization *tends* to balance weights, making reversal unlikely but not impossible, whereas non-random sorting makes it structural.

  3.  **Develop the Core Activity: "The Hospital Triage Game"**

      *   *Scenario:* Two treatments (A & B) for a condition. Outcome is Success/Fail.
      *   *Phase 1: Construction (Arithmetic).* Teams get target rates. Try to make Aggregate A > Aggregate B while Cell A < Cell B.
      *   *Phase 2: Generation (Sorting & Causality).*
          *   Round 1: "Triage." Nurses (students) assign patients (cards) to Treatment A or B based on Severity (Hidden or Visible?). Let's make Severity visible on the card. Severe patients tend to get B (maybe B is the "new expensive drug" reserved for bad cases).
          *   Round 2: "RCT." Dice roll assigns Treatment.
      *   *Phase 3: Decision (The Role Split).*
          *   Auditor: Look at the data. Which drug worked better?
          *   Director: Choose the drug for *next* year's unassigned patients.
      *   *Refinement:* To hit Objective 3 (Mediator), we need a variable *caused* by treatment. Maybe "Blood Pressure Drop" (Intermediate) vs. "Age" (Pre-existing). If we condition on the intermediate, we bias the result.
      *   *Simplification for 90 mins:* Let's stick to the classic Confounder structure for the main reversal, but introduce the "Bad Partition" as a twist in the debrief or a quick Round 3. Actually, the prompt asks for the session to *show* the mirror-image case.
      *   *Idea:* Use the *same* data but label the column differently? No, that's magic.
      *   *Better Idea:* Two different variables. Variable X (Severity - Pre-treatment). Variable Y (Complication - Post-treatment).
      *   *Revised Plan:*
          1.  **Warm-up/Construction:** Build the paradox with cards. (Obj 1)
          2.  **Simulation:** Generate data via Triage (Non-random) vs. Dice (Random). (Obj 2 & Colleague objection)
          3.  **Decision:** The Auditor vs. Director roles. (Obj 2)
          4.  **The Twist:** A second variable that is an *outcome* of treatment. Conditioning on it reverses the *correct* decision. (Obj 3)

  4.  **Drafting the Timeline (90 Minutes):**

      *   0-10: Intro & Setup (No naming!).
      *   10-25: Activity 1 (The Construction Challenge).
      *   25-50: Activity 2 (The Triage Simulation).
      *   50-65: Activity 3 (The Decision & The Twist).
      *   65-80: Debrief & Causal Mapping.
      *   80-90: Naming & Q&A.

  5.  **Fleshing out the Mechanics:**

      *   *Materials:* Index cards (Patient records), Envelopes (Treatment assignment), Dice, Score sheets.
      *   *Scoring:* Points for correct decisions. Penalty for "correct aggregate, wrong causal" decisions.
      *   *The "Spoiler" Risk:* If a stats student shouts "Simpson's Paradox," the game is over. *Mitigation:* Frame it as "The Weighting Problem." Ban the phrase.
      *   *The "Small N" Risk:* With 20 people, if they split into 4 groups of 5, N is too small for stable rates. *Fix:* Pool the data on a central board. The *room* is the sample.
      *   *The "Colleague" Risk:* In the RCT round, a reversal might still happen by chance. *Fix:* Acknowledge it. "Did it disappear? Usually yes. If not, it's noise, not structure."

  6.  **Addressing Objective 3 (Causal Order/Mediator):**

      *   This is the trickiest. How to simulate a mediator without complex stats?
