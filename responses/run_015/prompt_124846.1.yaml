  5.  **Refining the "Sincerity" Point:**
      *   Sartre argues that the demand for sincerity is itself a demand for identity (to *be* what one is). Since consciousness is what it is not and is not what it is, one cannot *be* sincere in the sense of coinciding with a truth. The homosexual man example (often paired with the waiter) shows that claiming "I *am* a homosexual" (facticity) or "I am *not* a homosexual" (transcendence) are both bad faith.
