answer: |-
  There is no single, canonical term in the cultural-evolution literature that captures this specific configuration. It is treated as a composite of three distinct mechanisms that, when they coincide, produce the exact dynamic you describe. The literature handles the pieces separately: the limits of transmission fidelity, the opacity of causal structure, and the loss of cumulative complexity. Because your description isolates a specific *feedback failure* that locks the degradation in place, it identifies a stable failure mode that existing labels describe only partially.

  Here is the carving of the phenomenon, distinguishing it from its neighbors, defining its boundaries, and locating the mechanism.

  ### 1. What it is: Legibility-Biased Transmission under Opaque Causality

  The phenomenon is a specific failure of **payoff-biased transmission**. In cultural evolution, learners are assumed to prefer variants that yield higher benefits. Your cases show that this selection pressure fails when the benefit is **temporally displaced** or **comparative**, while the cost of transmission is **immediate**.

  The mechanism operates in three stages:
  1.  **Filtering by Legibility:** The transmission channel (time, medium, attention) imposes a cost on complexity. Variants with steps that are hard to observe, hard to explain, or take too long are selected against *during transmission*, not during use.
  2.  **Decoupling of Form and Function:** The "visible core" of the practice is sufficient to categorize the action as the correct type (it looks like bread-making, net-setting, or splicing). The "invisible qualifications" are treated as optional variance rather than essential structure because their causal link to the outcome is opaque.
  3.  **Destruction of Diagnostic Feedback:** This is the critical locking mechanism. The degraded variant works *well enough* to avoid immediate catastrophic failure, but poorly enough that the specific deficit (flavour, catch rate, long-term durability) cannot be detected without a baseline comparison. Because the baseline is lost, the learner receives no negative selection pressure to restore the missing steps.

  In the literature, this is often discussed as a threshold problem in **Cumulative Cultural Evolution (CCE)**. CCE requires high-fidelity copying to maintain complex adaptations. Your cases describe a scenario where fidelity drops below the threshold required to maintain the *adaptive* components, but remains high enough to maintain the *nominal* components.

  ### 2. What it is not: Distinguishing from Neighbors

  To carve the edges, we must separate this from concepts that look similar but predict different dynamics.

  **It is not Cultural Attraction (Prototype Pull).**
  *   *The Concept:* Ideas are transformed to fit pre-existing cognitive biases (e.g., we remember stories better if they fit moral schemas).
  *   *The Distinction:* If this were prototype pull, the degraded version would be cognitively "natural" and would arise even in thick channels. In your cases, the complex version *was* successfully transmitted previously. The loss is driven by the *capacity of the channel*, not the structure of the mind.
  *   *Test:* If you restore the thick channel (long apprenticeship) and the complex version returns, it was channel squeeze. If the complex version still degrades because learners "forget" the exceptions naturally, it is attraction. Your cases suggest the former.

  **It is not the "Tasmanian Effect" (Demographic Loss).**
  *   *The Concept:* Small or isolated populations lose complex skills because there are too few models to learn from.
  *   *The Distinction:* You specified population size and contact are unchanged. This is not a loss of models; it is a loss of *bandwidth per model*. It is an intensification of interaction, not an isolation.

  **It is not Normalization of Deviance.**
  *   *The Concept:* Organizations accept increasing risk because small failures don't cause disaster.
  *   *The Distinction:* Normalization of deviance usually assumes a written or explicit standard that is being violated. In your cases, the practice *is* the standard. There is no external specification to deviate from. The standard itself mutates.

  **It is not Random Drift.**
  *   *The Concept:* Variants change due to sampling error.
  *   *The Distinction:* Drift is non-directional. Your pattern is highly directional: complexity drops, conditionals are removed, time is shortened. It is a *biased* transmission error.

  ### 3. Mechanism: Channel Squeeze vs. Mental Prototype

  You asked whether the variant is being pulled toward a prototype or squeezed by the channel. The evidence in your cases points to **Channel Squeeze**.

  *   **Prototype Prediction:** The "simple" version exists in the learner's mind before they encounter the practice. They reshape the input to match their expectation.
  *   **Channel Squeeze Prediction:** The "simple" version is the maximum amount of information the channel can carry without dropping packets.

  In the bread case, the "hour somewhere warm" is not a cognitive universal for bread; it is the limit of what fits on a card and what fits into a busy schedule. In the fishing case, the exception clause is cognitively complex (a conditional rule), but it was successfully learned before. The loss occurs because the *transmission event* (the teaching moment) is too short to carry the exception.

  **Observation to distinguish:**
  Watch *where* the loss occurs.
  *   If learners consistently drop the *same* specific details across different teaching media (e.g., they drop the exception clause even in a year-long apprenticeship), it is a **Mental Prototype** (the clause is cognitively unnatural).
  *   If learners drop details proportional to the *time/attention budget* of the training (e.g., the clause is kept in a 5-year apprenticeship but dropped in a 2-day course), it is **Channel Squeeze**.
  Your examples strongly imply the latter.

  ### 4. Boundary Cases

  To test whether this concept holds, apply it to these edge conditions:

  **Case A: Purely Expressive Practice (Nothing Functional Lost)**
  *   *Scenario:* A song loses a decorative verse during transmission. The song still functions as a song; no "truth" or "utility" is lost.
  *   *Verdict:* This is **Stylization** or **Drift**, not the phenomenon you describe. Your phenomenon requires a *functional deficit* that is *masked*. If the loss is benign, the feedback loop isn't broken; there was no feedback to begin with.

  **Case B: Expert Restoration (Re-dropping within a Generation)**
  *   *Scenario:* An expert reintroduces the cold rest to the bread, but the next generation drops it again.
  *   *Verdict:* This **confirms** the phenomenon. It proves the selection pressure lies in the *transmission channel*, not in the variant itself. The variant is unfit for the channel, even if it is fit for the oven. This is a "transmission bottleneck" effect.

  **Case C: Channel Thickening (Loss Fails to Reverse)**
  *   *Scenario:* You return to long apprenticeships, but the short version persists.
  *   *Verdict:* This is **Hysteresis** (Path Dependence). Once the diagnostic feedback is destroyed, the population cannot "see" the benefit of the complex version even if they have the time to learn it. They would need an external demonstration (a side-by-side taste test) to restart the selection pressure. If the loss persists despite thick channels and restored feedback, it has become a **Cultural Equilibrium**, and the phenomenon has transitioned from "erosion" to "tradition."

  ### 5. What Would Show You Have Misdescribed It

  You should abandon this specific model if any of the following are true:

  1.  **The "Lost" Steps Were Superstitious:** If investigation reveals the cold rest *did not* actually improve flavour, or the bird exception *was* folklore, then the "degradation" was actually **Adaptive Pruning**. The channel wasn't squeezing out value; it was filtering out noise. Your model assumes the complex version is genuinely superior.
  2.  **The Loss Requires Population Decline:** If you find that the degradation *only* happens when the number of practitioners drops below a critical threshold (regardless of channel width), then this is just the standard **Tasmanian Effect**, and your "channel" observation is secondary to population size.
  3.  **Learners Prefer the Short Version for Utility:** If the bakers *know* the bread is worse but prefer the one-hour version because it saves labor, this is **Economic Rationality**, not transmission error. Your model relies on the users *not knowing* the quality has dropped. If they know and accept the trade-off, the feedback loop is intact; they are just choosing a different payoff.

  ### 6. Suggested Terminology

  Since you asked if it needs a name: The literature does not have a settled term, but **"Cryptic Complexity Loss"** or **"Legibility-Driven Erosion"** would be accurate.

  However, if you want to locate it within existing theory without coining a term, describe it as:
  **A fidelity threshold failure in opaque causal systems.**

  *   **Fidelity Threshold:** The point where copying accuracy drops low enough that complex adaptations cannot be maintained.
  *   **Opaque Causal Systems:** Practices where the link between action and outcome is delayed, hidden, or comparative.

  This phrasing signals to those in the field that you are describing a specific intersection of *transmission mechanics* (fidelity) and *learning psychology* (opacity), which is precisely where your three cases live.

  ### Summary of the Carving

  *   **Core:** Selection for transmissibility overrides selection for functionality because functionality is invisible to the learner.
  *   **Driver:** Narrow transmission channels (time, medium), not cognitive bias or population size.
  *   **Lock:** The degradation destroys the evidence of its own cost (no diagnostic feedback).
  *   **Edge:** It is not this phenomenon if the loss is benign, if the users knowingly accept the trade-off, or if the complex version is cognitively unnatural regardless of channel width.

  You have identified a specific failure mode of cumulative culture: the point where a practice becomes too complex to *teach* in the available time, but not too complex to *fail* in the available context. The literature recognizes the components, but your synthesis of the *feedback destruction* is the precise mechanism that explains the stability of the inferior variant.
