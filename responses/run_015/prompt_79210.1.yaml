answer: |-
  Here is a precommitment case built to your specifications, followed by the analysis you requested.

  ### The Setup: "The Capital Lock"

  **Agent:** Elias, 30 years old.
  **Goal:** Launch a community arts non-profit at age 35.
  **Mechanism:** Elias sets up an irrevocable trust with a friend, Mara (Trustee). He deposits $2,000/month into the trust.
  **Terms:** At age 35, Mara releases the funds ($120k + interest) *only* if Elias launches the non-profit. If he does not, the funds are donated to a generic municipal fund (a cause Elias is neutral toward, but gains no personal utility from).
  **Constraint:** Elias cannot dissolve the trust unilaterally. Mara has legal instructions to ignore revocation requests unless Elias is clinically incapacitated.

  **The Moment of Revocation:**
  It is Elias's 34th birthday. He is calm, sober, and financially literate. He has not had a change in personality or a mood episode. He has simply re-evaluated his life plan. He now believes a different career path offers more personal fulfillment and social good than the non-profit. He wants to revoke the trust, get the $120k, and invest it in his new path. He understands exactly why Past Elias set this up and articulates it perfectly: "I knew I would value immediate liquidity more than long-term projects, so I bound myself. But now I see the long-term project isn't worth it."

  ---

  ### Case A: The Binding Version
  **The Feature:** **Causal Necessity of the Constraint.**
  Elias knows himself to be a "spender" by preference, not addiction. He enjoys lifestyle creep. He has explicitly stated (and historical data confirms) that without the lock, he would have spent the money on travel and dining. The $120k exists *only because* the restriction existed. The restriction *produced* the asset. Past Elias endured 4 years of reduced lifestyle *specifically to overcome his own resistance to saving*.

  ### Case B: The Non-Binding Version
  **The Feature:** **Causal Independence of the Constraint.**
  Everything is identical except Elias's relationship to saving. Elias is a "natural saver." He has a surplus income that he historically saves regardless of external locks. He would have accumulated the $120k in a standard brokerage account anyway. The Trust was set up merely to earmark the funds, not to force their accumulation. Past Elias did not endure any lifestyle austerity *caused by the lock*; he lived the exact same life he would have without it.

  **The One Feature:** **Whether the precommitment mechanism was causally necessary for the benefit to exist.** (Did the lock *create* the capital, or just *label* it?)

  ---

  ### The Three Views: Verdicts and Sources

  #### 1. The Separate-Time-Slices View (STS)
  *Theory: The person at T1 and the person at T2 are morally distinct agents. T2 cannot be bound by T1's promises any more than you are bound by a stranger's.*

  *   **Verdict Case A:** **Not Binding.**
  *   **Verdict Case B:** **Not Binding.**
  *   **Source of Verdict:** The sovereignty of the current will. Since Current Elias is competent (per your constraint), his current preference overrides Past Elias's preference. The causal history of the money (whether the lock created it or not) is irrelevant to T2's right to dispose of resources currently under his control. To STS, Past Elias is a benevolent donor who attached strings; T2 can reject the gift if the strings are too tight.

  #### 2. The Extended-Planner View (EP)
  *Theory: The person is a single agent extended across time. Rationality requires consistency with one's global life plan.*

  *   **Verdict Case A:** **Binding.**
  *   **Verdict Case B:** **Binding (mostly).**
  *   **Source of Verdict:** Diachronic coherence. Past Elias and Future Elias are the same entity. Past Elias made a plan based on rational forecasting. Future Elias defecting is a failure of agency coherence (akrasia), even if calm.
  *   *Nuance:* EP might allow revocation in Case B more easily than Case A. In Case A, the plan *included* the austerity required to build the fund. In Case B, the austerity wasn't part of the plan, only the earmark. But generally, EP treats the "calm revision" as a threat to the agent's ability to execute long-term projects at all. If you can always revoke when calm, long-term planning collapses.

  #### 3. The Fairness View (F)
  *Theory: Obligation arises from the principle of fair play. If one accepts the benefits of a cooperative scheme (or a past sacrifice made for one's benefit), one must bear the burdens.*

  *   **Verdict Case A:** **Binding.**
  *   **Source of Verdict:** **Free-Riding on Past Sacrifice.** Current Elias is accepting the benefit (the $120k capital) which was *produced* by the burden Past Elias endured (the lifestyle restriction). To take the money while rejecting the condition (the non-profit) is to accept the fruit while denying the root. It treats Past Elias's sacrifice as a resource to be consumed rather than a commitment to be honored. The restriction *did the work* of creating the value; Current Elias cannot undo the restriction without negating the value's origin.
  *   **Verdict Case B:** **Not Binding.**
  *   **Source of Verdict:** **No Free-Ride.** Current Elias is not free-riding on Past Elias's sacrifice because there was no *marginal* sacrifice. The money would have existed anyway. The "burden" of the lock was nominal. Therefore, Current Elias can reject the condition without unfairly exploiting Past Elias. He is essentially saying, "I accept the savings you made, but I reject the label you put on them," which is permissible because the label didn't *create* the savings.

  ---

  ### Analysis of the Load-Bearing Feature

  **The Feature:** **Causal Necessity of the Constraint for the Benefit.**

  **Why it works:**
  This feature transforms the arrangement from a **Promise** into a **Debt**.
  *   In **Case B (Promise)**, Past Elias is essentially saying to Future Elias: "I hope you do this." If Future Elias says "No," he breaks a promise, but he hasn't exploited Past Elias.
  *   In **Case A (Debt)**, Past Elias is saying: "I suffered *so that* you could have this." If Future Elias takes the capital and voids the condition, he is effectively consuming Past Elias's labor (the austerity) without paying the agreed-upon price (the non-profit).

  **Does pulling it out collapse the thing?**
  Yes. If you remove Causal Necessity (i.e., if the money would have been saved anyway), the Fairness argument evaporates. You are left with a standard promise. A competent later self can break a standard promise if the cost of keeping it outweighs the benefit, provided they compensate for the breach. But in Case A, compensation is impossible: you cannot compensate Past Elias for the lifestyle he lost *to create the fund* if you then dissolve the fund. The sacrifice becomes wasted *by the act of revocation*.

  **How the "Sovereignty of the Present" attacks this:**
  A critic (aligning with STS) would argue: **"The Past Self is Dead."**
  They would say: "Even if Past Elias suffered, he suffered *for his own reasons*. He invested in Future Elias. But Future Elias is the one who has to live with the capital. If the capital is more useful to Future Elias unlocked than locked, forcing him to keep it locked treats him as a means to Past Elias's ends. The fact that the lock *created* the money doesn't matter; the money now belongs to the present agent. To bind him is to say the dead hand of the past owns the living resources of the present."

  They would argue that Fairness applies to *interpersonal* relations, not *intrapersonal* ones. You can free-ride on your neighbor, but you can't free-ride on yourself; you just have changing preferences.

  ---

  ### The Constitutional Analogy: The Dead-Hand Objection

  **Does this structure work for a Constitution binding a later generation?**

  **The Parallel:**
  *   **Past Generation:** Drafts a Constitution with difficult amendment procedures (The Lock).
  *   **Benefit:** Stability, rights, infrastructure (The Capital).
  *   **Sacrifice:** They fought a war or endured austerity to establish the state (Causal Necessity).
  *   **Later Generation:** Wants to amend the Constitution radically because their values have shifted (Calm, informed revision).

  **Does the Fairness View hold?**
  It holds *only if* the Causal Necessity condition is met.
  *   **If Yes:** If the current stability and wealth of the nation exist *only because* the Founders bound themselves and their successors to these rules (e.g., property rights that encouraged investment), then the Later Generation is free-riding. They enjoy the wealth produced by the constraint while trying to remove the constraint. The Fairness View says they are obligated to maintain the core structure.
  *   **If No:** If the wealth would have accumulated anyway under a different system, the Dead Hand objection wins. The Later Generation is not free-riding; they are just optimizing.

  **Where the Analogy Breaks:**
  The "Sovereignty of the Present" attack is much stronger in the Constitutional case than in the Personal case.
  1.  **Consent:** Elias implicitly consented to his own past authority by setting up the trust. Citizens do not consent to the Founders' authority.
  2.  **Identity:** Elias is arguably the *same person* as Past Elias (psychological continuity). The Later Generation is *not* the Founders. The Fairness argument relies on a relationship of reciprocity. Reciprocity is harder to establish between distinct generations than between time-slices of one life.

  **Verdict:** The structure *can* work for constitutions, but only for specific clauses where the "Causal Necessity" is clear (e.g., debt repayment, property structures that built the economy). It fails for moral rights where the link between "restriction" and "benefit" is ideological rather than material. The Dead-Hand objection kills the Fairness argument when the Later Generation can plausibly say, "We would have prospered just as much without your sacrifice."

  ### Summary of Constraints Check
  *   **Competence:** Later Elias is fully competent in both cases.
  *   **Information:** No asymmetry. Both selves know the spending/saving traits.
  *   **Distortion:** No cravings or mood swings driving the revocation.
  *   **Conflict:** The tension between "Current Autonomy" and "Past Fairness" is left open; I have not resolved it in favor of one, but shown where the bindingness comes from if you accept the Fairness premise.

  This isolates **Fairness (c)** as the only mechanism that differentiates Case A from Case B. The Extended-Planner view struggles to distinguish them (both are plans), and the Time-Slice view binds neither. If you feel the arrangement *should* hold in A but not B, you are implicitly relying on the Fairness view.
