          *   *Fix:* Clarify (4). IIT doesn't deny consciousness to digital systems because they are "software," but because standard digital architectures cannot sustain high $\Phi$. If a physical system *did* have the causal structure, IIT says it *is* conscious. The user's justification in (4) ("merely representational") sounds like it imports external semantics, which IIT rejects (intrinsicality).
