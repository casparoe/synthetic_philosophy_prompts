answer: |-
  **Elena:** The coffee isn't enough to wash away the taste of that presentation, is it?

  **Marcus:** Forty thousand participants, two hundred situations per person, unobtrusive coding. It's the dataset we've been waiting for since the early two-thousands. And it's devastating. The cross-situational consistency coefficients are exactly what the skeptics predicted. Knowing the situation gets you ninety percent of the predictive power. Knowing the person gets you the scraps.

  **Elena:** You're treating the person-factor as scraps because you're looking at single-shot predictions in strong situations. Look at the variance compression. In the high-stakes, high-observation scenarios—say, the mis-credited refund where the bank calls immediately—almost everyone returns the money. The base rate is so high that trait honesty has nowhere to show its variance. Of course the person-level predictor looks weak there. It's a ceiling effect.

  **Marcus:** I'll concede the ceiling effect in strong situations. But even in the weak situations, where the stakes are low and observation is nil, the consistency isn't what virtue ethics requires. Take the stranger's bag left on a train. Some people secure it; some walk away. But the same person who secures the bag might later commit a small act of cruelty in a meeting because the group norm shifted toward aggression. The MCP data shows that within a situation-type, stability is high. Across situation-types, it collapses. If "honesty" doesn't predict "kindness," and neither predicts "courage" unless the context is held constant, what work is the global trait doing? It doesn't pay rent in anticipations. If I know you're in a high-pressure meeting, knowing you're "virtuous" barely shifts my probability estimate of whether you'll snap at a junior colleague.

  **Elena:** You're right that folk character attribution wildly over-predicts. We treat people as if they have a moral essence that transfers seamlessly from the train to the meeting room. The data says that's false. I'll concede that. But you're defining the trait by the overt act alone. That's too thin. Look at finding four from the project: the person-level factor predicts recovery speed. Two people lapse in the meeting. One spirals, defensive and doubling down. The other repairs, apologizes, and recalibrates within the hour. That residual person-factor isn't about never falling; it's about the integration of attention and emotion that allows for correction. Virtue isn't a shield against situational pressure; it's a governance system for when the pressure hits.

  **Marcus:** That's a steelman, I'll give you that. But even if I grant that recovery speed is a real individual difference, is it a *moral* trait or just a psychological resilience factor? A sociopath might recover quickly from a social lapse simply because they don't feel shame, not because they value the relationship. But here's the cost on my side: I have to admit the individual differences aren't noise. They're real. And I have to admit that calling someone a "bundle of local dispositions" is a strange thing to call an ethical ideal. It doesn't match how we live. We trust people with our lives based on the belief that there's a "there" there. If I'm right, that trust is based on a cognitive illusion, yet the practice survives. Why?

  **Elena:** Because the illusion is functional. But let's push the normative work objection. You say the trait is too thin to guide action. If I tell a student "be honest," and honesty doesn't transfer from refunds to meetings, is the advice empty?

  **Marcus:** It is if "honesty" implies a global disposition. My view is that the rational target is local reliability plus situation selection. Don't try to be honest in all contexts; that's fighting the base rates. Instead, build scaffolding. Automate the refund return. Avoid the meetings where cruelty is the norm. The MCP intervention arm showed this: training transfers poorly to distant situations unless the agent also practices choosing their environments. The skill isn't "be virtuous"; it's "know where you break and don't go there."

  **Elena:** And who designs the environment? That's the trap in your view. If virtue is just situation selection, then whoever controls your environment controls your morality. If I need to avoid the meeting to avoid cruelty, I've already surrendered agency to the scheduler. Furthermore, selecting the right environment presupposes exactly the stable disposition you deny. To know you should avoid the aggressive meeting, you need a stable valuation of kindness over status that persists across contexts. You need the very global trait you claim doesn't exist to execute the situation selection strategy.

  **Marcus:** Touché. Situation selection does require a meta-disposition. But that meta-disposition could just be a higher-order local habit, not a unified character. Here's where I need you to concede more, though. You admit folk psychology over-predicts. But if the predictive value of a global trait for a single act is small, why cling to the ontology of "character"? If I can predict your behavior better by knowing you're tired and in a rush than by knowing you're "compassionate," then compassion isn't the causal driver. The situation is.

  **Elena:** I concede the predictive value for a single act is small. A large part of what looks like inconsistency is just the situation doing the work. But you're missing the longitudinal view. Single acts are noisy. Trajectories aren't. The person-factor in the MCP data matters most in novel or ambiguous situations. Life is mostly novel situations. Routine is the exception. If your local dispositions aren't integrated, you're helpless when the script flips. When the refund isn't mis-credited but the bank asks you to lie about a policy, that's novel. The data shows some people generalize principles there; others don't. That generalization capacity is the unified trait.

  **Marcus:** So your claim is that virtue is robustness under novelty?

  **Elena:** Yes. It's the capacity to deploy a coherent evaluative framework when the base rates don't dictate the answer.

  **Marcus:** But the MCP data shows transfer is poor. Training helps in trained situations and nearby ones, but distant ones? Minimal. That suggests the cognitive architecture is modular, not unified. If virtue were a unified causal power, training in honesty should transfer to courage because the underlying faculty—practical reason—is the same. The data says it doesn't. It looks more like we have a collection of local modules that are correlated because they share some input channels, not because they share an engine.

  **Elena:** Or it means the transfer requires effortful integration that most people don't undertake. The intervention showed transfer works best for those who practice deliberate environment selection. That suggests the integration is possible but costly.

  **Marcus:** So we're down to this: Is the "person-factor" a single engine running different modules, or just a convenient aggregate of correlated local modules?

  **Elena:** Exactly. If it's a single engine, virtue ethics holds. If it's an aggregate, you're right, and "character" is just a shorthand for a specific configuration of local habits.

  **Marcus:** How do we distinguish them? Both views predict the same behavioral outcomes in the MCP dataset. The aggregate view says the correlation between honesty and kindness is due to overlapping situational features and shared learning history. The unified view says it's due to a common causal source.

  **Elena:** We need to measure the cost of context switching. If virtue is a unified disposition, switching from a honesty-context to a kindness-context shouldn't incur a significant cognitive load penalty, because the same underlying principle is guiding both. If it's a bundle of local dispositions, switching should look like task-switching: there should be a friction cost, a drop in performance or an increase in reaction time when the moral domain shifts.

  **Marcus:** Right. If I'm right, moving from the refund scenario to the meeting scenario should look like changing software programs. There's a load time. If you're right, it's like running different functions in the same script. No load time.

  **Elena:** And we need to measure the degradation under cognitive load. If character is unified, taxing working memory should degrade all moral domains equally. If it's local, taxing memory might knock out honesty while leaving kindness intact, depending on which modules are automated.

  **Marcus:** That's testable. We could run a dual-task experiment during the situation simulations. Load the working memory, then switch moral contexts. Measure the error rates and the latency.

  **Elena:** And if the latency spikes on context switch, you win. Character is a fiction; it's local habits all the way down.

  **Marcus:** And if the degradation is uniform across domains, you win. There's a central resource being taxed. But Elena, even if you win that, you still have to deal with the base rates. Even a unified trait only shifts the probability curve. It doesn't guarantee the act.

  **Elena:** I don't need guarantees. I just need causality. If the unified trait explains the variance in novel situations and the speed of repair, it's real enough to ground responsibility. You conceded the individual differences aren't noise. If they aren't noise, and they aren't just situational artifacts, they belong to the agent.

  **Marcus:** I did concede that. And I conceded that my view makes ethical ideals look fragmented. That's a bullet I'm still chewing on. It feels like it dissolves the aspiration to be a certain kind of person. If I'm just optimizing local reliability, am I actually good, or just well-engineered?

  **Elena:** Maybe that's the update we both need. Virtue isn't a state you achieve; it's the maintenance of the integration. It's the work of keeping the modules talking to each other so the switch costs stay low.

  **Marcus:** So the virtue is the integration effort itself.

  **Elena:** Precisely. The MCP data shows people who practice environment selection transfer better. That practice is the integration work. It's not that they have a magic trait; it's that they are actively building the bridges between the local dispositions.

  **Marcus:** Then we're closer than I thought. I say the bridges are artificial scaffolding. You say the building of bridges is the character.

  **Elena:** And the experiment tells us if the bridges are made of steel or just painted wood. If the switch costs are real, you're right about the fragmentation. But if the costs can be trained away, then the unity is achievable.

  **Marcus:** I can live with that. It moves the dispute from metaphysics to engineering.

  **Elena:** Which is where it should have been all along. Let's go draft the protocol.
