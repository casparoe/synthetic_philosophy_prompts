prompt: |-
  Hey — I'm writing the final for my upper-division normative ethics seminar (18 students, mostly juniors and seniors, plus a couple of econ majors who've had game theory and will definately try to turn everything into a utility function). In-class final, 75 minutes, three essays, so this one has to be doable in about 25 minutes. Worth 20 points.

  Topic is the aggregation of tiny harms — torture vs. dust specks. We did it once on the discussion board and everyone just restated their gut reaction, so I want a question that makes the gut reaction actually do some work. Basically I want to pry apart three things that I think people quietly run together:

  1. Whether the refusal to aggregate is about how big each individual bit of harm is, or about how many people it's spread over. My idea: a case where the total amount of stuff is fixed but the distribution is unknown. A machine will deliver some astronomically huge number of barely-noticeable annoyances (a speck in the eye, a two-second itch), and it's wired either to hand out one apiece to that many different people or to pile the entire load onto a single person. They have to choose between running the machine and one person being tortured for fifty years, and they don't get to know which way it's wired. If they say torture either way, then the number-of-victims thing apparently wasn't doing the work, and I want them to have to own that.

  2. Where the line is. If no number of specks outweighs the torture, what about a million people each with a bad headache for an afternoon, or ten thousand people each losing a finger? Push them to either draw a line somewhere and say why there, or go lexical and then deal with the fact that lexical is mostly just a label for the intuition rather than an answer to it.

  3. What I think is the real crux: fifty years of torture is itself a very long sequence of momentary pains, each of which on its own is far less bad than the whole. So anyone who won't sum small things across people has to say why summing small things across moments inside one life is any different. And if the answer is because it's the same person, I want them to say what work the boundary of a person is doing there.

  I'd like the question to force an actual commitment — pick an option and defend it — not discuss the issues. And nobody in the class has read any of the literature on this, so everything has to be self-contained in the handout: no author names, no papers, no references to the version that circulates online with the number written as a tower of arrows.

  Can you give me: the question as I'd actually hand it out, a model answer of about 700 words, and a marking scheme out of 20 built around maybe five must-hit points? For each point I want how many marks it's worth, the specific move that earns them, and one line on how students typically screw it up. The A/B/C boundary should be about whether they made the move, not about prose quality — tell me what the B answer does that the A doesn't. I also want the model answer to end by being honest about which move in it is the weakest link; I don't want something that reads like the question is settled.

  Last thing: what do I do if half the class writes the specks option is fine because nobody is really harmed and stops there? Is there a version of the question that blocks that answer up front, or does blocking it make the question worse?
reasoning: |-
  Here's a thinking process that leads to the suggested final exam question, model answer, and marking scheme:

  1.  **Analyze the Request:**
      *   **Context:** Upper-division normative ethics seminar (18 students, mixed majors including econ/game theory).
      *   **Format:** In-class final, 75 minutes total, 3 essays. This specific essay is 25 minutes, worth 20 points.
      *   **Topic:** Aggregation of tiny harms (Torture vs. Dust Specks).
      *   **Goal:** Force students to move beyond gut reactions and address three specific conceptual tensions:
          1.  *Distribution vs. Magnitude:* Is the objection to aggregation about the size of the harm or the number of victims? (The "Unknown Distribution" scenario).
          2.  *The Line:* Where does aggregation become permissible? (Lexical vs. Threshold views).
          3.  *Intrapersonal vs. Interpersonal:* Why sum across time in one life but not across people? (The "Person Boundary" problem).
      *   **Constraints:** Self-contained prompt (no literature references), force a commitment (pick and defend), model answer (~700 words) admitting a weak link, marking scheme (20 points, 5 criteria, A/B/C distinctions).
      *   **Specific Worry:** Students saying "specks aren't real harms, so stop." Need to address whether to block this or handle it in grading.

  2.  **Drafting the Prompt:**
      *   *Need:* Clear scenario, clear choice, clear requirements.
      *   *Scenario:* Needs to incorporate the "unknown distribution" element to tackle point #1. Needs to escalate harms for point #2. Needs to explicitly ask about the time/person distinction for point #3.
      *   *Wording:* Keep it tight. 25 minutes is short. Students need to read and write quickly.
      *   *Blocking the "No Harm" Objection:* The prompt should stipulate that the specks *are* harms, however slight. If I leave it open, lazy students will dodge the hard work. Better to stipulate: "Assume each speck is a genuine, non-zero harm."
      *   *Drafting:*
          *   Setup: Choice between 50 years torture for one person OR $N$ specks.
          *   Twist: The $N$ specks are either distributed to $N$ people OR stacked on one person (unknown which).
          *   Escalation: Ask about headaches/fingers.
          *   Core Question: Why sum across time but not people?
          *   Instruction: Choose one option and defend it against the three specific challenges.

  3.  **Drafting the Model Answer:**
      *   *Tone:* Philosophical, precise, but acknowledging difficulty (as requested).
      *   *Structure:*
          1.  State the choice clearly (e.g., Choose the Specks).
          2.  Address Distribution (Point 1): If I choose specks even when stacked, I'm a total utilitarian. If I refuse when stacked, I care about distribution.
          3.  Address The Line (Point 2): Acknowledge the slippery slope. Propose a threshold or defend lexicality.
          4.  Address Person/Time (Point 3): This is the crux. Defend the moral significance of personal identity or deny it.
          5.  Conclusion: Admit the weakest link.
      *   *Word Count:* Aim for ~700.
      *   *Weak Link:* Usually the justification for the person-boundary is the hardest to defend without circularity. I'll make the model answer admit that.

  4.  **Developing the Marking Scheme:**
      *   *Total:* 20 points.
      *   *Criteria (5 points each):*
          1.  **Commitment:** Did they actually pick a side? (Many try to hedge).
          2.  **Distribution (The Unknown Wire):** Did they address the risk that all specks hit one person?
          3.  **The Threshold (Headaches/Fingers):** Did they engage with the escalation, not just specks?
          4.  **Intrapersonal Aggregation:** Did they tackle the time vs. people distinction?
          5.  **Coherence/Weakness:** Is the argument internally consistent? Did they acknowledge a tension?
      *   *A/B/C Distinction:*
          *   A: Makes the move clearly + anticipates counter.
          *   B: Makes the move but misses the nuance/implication.
          *   C: Misses the move or contradicts themselves.
      *   *Common Errors:* Hedging, ignoring the "unknown wire," dismissing specks as zero harm (despite prompt), ignoring the time analogy.

  5.  **Addressing the "No Harm" Objection:**
      *   *Question:* Should I block it in the prompt or grade it?
      *   *Analysis:* If I don't block it, 50% of the class will write 3 paragraphs saying "a speck is nothing" and miss the philosophical point about aggregation. This wastes the exam's purpose.
      *   *Decision:* Block it in the prompt. Stipulate that each speck is a *pro tanto* harm. This forces them into the aggregation problem rather than the definition of harm problem. I will advise the instructor to penalize the "it's zero harm" argument heavily if they slip it in anyway, because it violates the stipulation.

  6.  **Refining and Polishing:**
      *   *Check Constraints:* 25 mins? Yes, if the prompt is tight. 700 words model? Yes. 20 points? Yes. 5 criteria? Yes.
      *   *Tone Check:* Ensure the prompt sounds like an exam handout, not a lecture. Ensure the model answer sounds like a strong student response, not a published paper.
      *   *Specific Focus:* Make sure the "Unknown Wire" scenario is clear. It's the trickiest part to explain quickly.
      *   *Econ Majors:* They will love the expected utility calculation. The prompt should allow this but force them to justify the *moral* weight, not just the math. (Actually, the prompt asks for normative ethics, so utility functions need moral justification).

  7.  **Final Review against User Request:**
      *   *Three tensions:* Distribution, Line, Person/Time. (Included in prompt requirements).
      *   *Self-contained:* No Parfit/Quinn names. (Checked).
      *   *Model Answer:* ~700 words, admits weak link. (Checked).
      *   *Marking Scheme:* 5 points x 4 criteria? No, user asked for 5 must-hit points. Let's do 4 points x 5 criteria.
      *   *A/B/C:* Defined by moves, not prose. (Checked).
      *   *Specks = 0 harm:* Addressed in advice section.

      *(Self-Correction during drafting)*: 25 minutes is *very* short for all three of these deep points. I need to make sure the prompt doesn't look like three separate questions. It needs to be one scenario that *generates* these three problems. I will structure the prompt as "Choose Option A or B. In your defense, you must address X, Y, and Z."

      *(Refining the "Unknown Wire" scenario)*:
      Option A: One person tortured (50 years).
      Option B: A machine creates $3^{^^^3}$ specks.
      *Crucial Twist:* The machine is wired randomly. Either 1 speck per person ($3^{^^^3}$ people) OR all specks on 1 person. You don't know which until it runs.
      *Why this works:* If you choose B because "specks are small," you must accept the risk that one person gets $3^{^^^3}$ specks (which is basically torture). If you refuse B because of that risk, you aren't objecting to aggregation, you're objecting to *risk* or *concentration*. This isolates variable #1.

      *(Refining Marking)*: 5 criteria x 4 points = 20 points.
      1. Clear Choice.
      2. Handling the "Unknown Wire" (Distribution).
      3. Handling the "Escalation" (The Line).
      4. Handling the "Time vs. People" (Personhood).
      5. Intellectual Honesty (Weak link).

      Let's write it.

  8.  **Final Polish:** Check word counts and tone. Ensure the advice on the "specks = 0 harm" objection is practical. (Decided: Stipulate in prompt that they are harms. If they argue otherwise, they lose points on "Following Instructions" + "Substance".)

      *Wait, one detail:* The user asked for "five must-hit points" for the marking scheme. I will structure it as 5 criteria, 4 points each.
      *Model Answer:* Needs to be honest about the weakest link. I'll make the "Personhood" defense the weak link, as that's philosophically honest.

      *Let's assemble.*
answer: |-
  ### Exam Question (Handout)

  **Question 3: Aggregation and Distribution (20 Points)**
  **Time Allocation:** Approx. 25 Minutes

  **The Scenario:**
  You must choose between two options. 
  *   **Option A:** One specific person is subjected to 50 years of continuous, severe torture.
  *   **Option B:** A machine generates a fixed quantity of minor annoyances (e.g., a dust speck in the eye). The total amount of annoyance is astronomically large. However, the machine's wiring is unknown to you. There is a 50% chance the machine distributes one annoyance to each of astronomically many different people. There is a 50% chance the machine piles the *entire* load of annoyances onto a *single* person.

  **Stipulations:**
  1.  Assume each individual annoyance is a genuine, non-zero harm, however slight.
  2.  Assume the total sum of annoyance in Option B (if piled on one person) would exceed the harm of Option A.
  3.  You cannot influence the wiring; you only choose whether to run the machine.

  **The Task:**
  Select either Option A or Option B. In a single, continuous argument, defend your choice. To receive full credit, your defense must explicitly address the following three challenges:
  1.  **The Distribution Risk:** How does your choice handle the 50% chance that all annoyances hit one person?
  2.  **The Threshold:** If you reject Option B, at what point does the annoyance become severe enough (e.g., migraines, lost fingers) that you would switch to Option A? If you accept Option B, is there *any* harm you would not aggregate?
  3.  **The Person/Time Distinction:** 50 years of torture is just a sequence of momentary pains summed across time. Why is it permissible to sum pains across *time* within one life, but (for those who choose A) impermissible to sum pains across *people*?

  *Note: Do not cite external authors. Rely on the arguments we developed in class.*

  ***

  ### Model Answer (Approx. 700 Words)

  I choose **Option B**. I accept the risk of running the machine, even knowing it might pile the entire load onto one victim. My justification rests on a commitment to additive aggregation, but I acknowledge this creates a significant tension regarding personal identity.

  First, regarding the **Distribution Risk**: Many who reject the "dust specks" case do so because they care about the number of victims, not just the total harm. They argue that spreading harm is better than concentrating it. However, this scenario blocks that move. If I choose Option B, I must accept that I am willing to risk subjecting one person to a lifetime of itching if the wiring goes badly. If I am unwilling to take that risk, then my objection to the original "specks" case wasn't about aggregation at all; it was about risk aversion or concentration. By choosing B, I commit to the view that total harm is what matters morally, regardless of how it is distributed. If the total sum of annoyance in the "pile up" scenario exceeds 50 years of torture, then B is the lesser evil, even if the distribution is unlucky. To choose A is to say that saving one person from extreme suffering is worth imposing a greater total amount of suffering on the universe, which privileges identity over magnitude.

  Second, regarding **The Threshold**: Choosing B does not require me to say that *any* trivial harm aggregates to outweigh torture. I can defend a threshold view. There is a qualitative difference between a dust speck and a lost finger. A dust speck is a nuisance that barely registers in a life plan; a lost finger is a permanent disability. I can argue that harms below a certain threshold of significance do not aggregate, while those above it do. However, since I am choosing B here, I am arguing that even these tiny harms, in sufficient quantity, constitute a moral weight. The "slippery slope" objection asks where I draw the line. I draw it at the point where the harm begins to disrupt agency. A speck does not disrupt agency; a migraine might. But if we have enough specks, the *total* time spent blinking and rubbing eyes could theoretically disrupt agency just as much as torture. If I accept aggregation, I must accept that quantity can become quality.

  The hardest challenge is the **Person/Time Distinction**. If I refuse to sum small harms across people (which I am not doing here, but which my opponents do), they must explain why we sum small pains across time. Torture is not one monolithic block of pain; it is a billion momentary stings. We accept that these stings add up to a "life ruined" because they happen to the same *person*. The opponent says the boundary of the person is morally magical: sums count inside the boundary, but not outside it.

  I reject this magic. The boundary of a person is not deep enough to block aggregation. Psychological connectedness fades over time; the person suffering at year 49 is barely psychologically connected to the person at year 1. Yet we sum their pain. If we sum across temporal slices of a person, why not across spatial slices of humanity? The only relevant difference is causality and memory, but neither seems sufficient to make the difference between "aggregation permitted" and "aggregation forbidden." Therefore, if we sum across time, consistency demands we sum across people.

  **Weakness:** I must admit the weakest link in this argument is my dismissal of the person-boundary. I claimed psychological connectedness is too weak to matter, but I have not proven that *total* disconnection is the same as *partial* connection. There is a disanalogy: temporal slices are causally linked in a way that distinct people are not. The victim at year 49 suffers *because* of the victim at year 1's captivity. Distinct people suffering specks do not suffer because of each other. I am assuming that causal independence doesn't block aggregation, but I have not defended why. It is possible that the moral unit is the "causal chain of suffering," not the "total sum of pain." If that is true, my argument fails. I choose B, but I do so knowing that the moral significance of the "person" remains the hardest problem to dissolve.

  ***

  ### Marking Scheme (20 Points Total)

  **Grading Philosophy:** Points are awarded for making specific philosophical *moves*, not for prose elegance. An "A" answer makes the move and anticipates the tension. A "B" answer makes the move but treats it as simple. A "C" answer misses the move or contradicts it.

  | Criterion | Points | The Move (A vs. B vs. C) | Common Error |
  | :--- | :---: | :--- | :--- |
  | **1. Clear Commitment** | 4 | **A:** Picks A or B explicitly in the first paragraph and sticks to it.<br>**B:** Picks a side but hedges ("I lean towards B...").<br>**C:** Refuses to choose or says "it depends." | Trying to split the difference ("I'd choose B for specks but A for fingers"). |
  | **2. Distribution Risk** | 4 | **A:** Acknowledges that choosing B accepts the risk of one person getting *all* the harm.<br>**B:** Discusses distribution but ignores the 50% "pile-up" wiring.<br>**C:** Argues B is safer because "more people share the burden" (ignores the prompt's wiring). | Assuming Option B guarantees distribution to many people. |
  | **3. The Threshold** | 4 | **A:** Engages with the escalation (headaches/fingers) and posits a principle for where aggregation stops/starts.<br>**B:** Says "specks are different than fingers" without explaining why aggregation applies to one and not the other.<br>**C:** Ignores the escalation instruction entirely. | Claiming "specks are zero harm" despite the stipulation. |
  | **4. Person/Time** | 4 | **A:** Explicitly compares summing across *time* vs. summing across *people* and offers a reason for treating them similarly or differently.<br>**B:** Mentions time but fails to connect it to the interpersonal aggregation problem.<br>**C:** Treats torture as a monolithic block rather than a sequence of moments. | Asserting "people aren't moments" without explaining the moral relevance of the difference. |
  | **5. Intellectual Honesty** | 4 | **A:** Identifies a specific tension or weak link in their own view (like the model answer).<br>**B:** Presents their view as fully resolved with no remaining tensions.<br>**C:** Argument is internally contradictory without acknowledgment. | Pretending the problem is solved when the prompt implies it isn't. |

  ***

  ### Instructor Advice: The "Specks = Zero Harm" Objection

  **The Problem:** You mentioned fearing half the class will write: *"A dust speck isn't a harm. It's zero. Zero times infinity is zero. So Option B is costless."*

  **The Fix:** Do not leave this to grading discretion. **Block it in the prompt.**
  Notice the **Stipulations** section in the handout above: *"Assume each individual annoyance is a genuine, non-zero harm."*

  **How to Grade it if they do it anyway:**
  If a student ignores the stipulation and argues the harm is zero:
  1.  **Deduct heavily on Criterion 3 (Threshold):** They failed to engage with the hypothetical constraints.
  2.  **Deduct on Criterion 1 (Commitment):** They haven't actually chosen between two harms; they've dissolved one side.
  3.  **Feedback:** "You solved a different problem. The philosophical puzzle is about *small* non-zero numbers, not zeros. By defining the harm away, you avoided the aggregation problem."

  **Why blocking is better:**
  If you allow the "zero harm" argument, the exam becomes a test of semantics (what counts as harm?) rather than normative ethics (how do we weigh harms?). Given the 25-minute constraint, you want them spending time on the *weighing*, not the *definition*. Stipulating the harm forces the econ majors to use their utility functions on non-zero values, which is where the actual tension lies.
