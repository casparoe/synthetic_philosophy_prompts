answer: |-
  # Q&A Prep Sheet: Normative Uncertainty & The Volatility-Discounted Parliament

  **Context:** Mixed audience (EAs, Philosophers, ML/Decision Theory).
  **Goal:** Defend the "Volatility-Discounted Parliamentary Model" without collapsing into MEC or appearing ad hoc.
  **Tone:** Precise, conceding on formalization where necessary, holding firm on the core epistemic intuition.

  ---

  ### 1. The Collapse Objection (MEC Equivalence)
  **Who:** Academic Philosophers & Senior EAs.
  **Phrasing:** "You claim this isn't maximizing expected choice-worthiness (MEC). But if your 'volatility discount' and 'evidential floor' can be represented as adjustments to the utility functions or priors within the theories themselves, haven't you just described MEC with a specific, risk-averse prior? If the output is isomorphic to MEC, you haven't solved the intertheoretic comparison problem; you've just hidden it in the discount function."
  **2-Minute Reply:**
  "I concede that for any *single* decision, one might construct a utility function that mimics my verdict. But the *structure* matters. MEC requires cardinal intertheoretic comparability to sum across theories. My model operates on ordinal rankings within theories, aggregated via a bargaining solution. The volatility discount isn't a risk-aversion parameter in the utility function; it's a meta-epistemic constraint on how much weight a theory's *magnitude claims* get when those claims are unstable. MEC says 'trust the magnitude if the probability is high.' I say 'trust the magnitude only if the magnitude is robust.' That is a structural distinction, not just a prior adjustment."
  *   **Concede:** The output might look similar in simple cases.
  *   **Hold:** The structural requirement for cardinal comparability is the dealbreaker for MEC; my view avoids it.
  *   **Soft Spot:** Defining the discount function without secretly importing cardinal values.

  ### 2. The Longtermist Revolt (Evidential Floor)
  **Who:** Longtermist EAs.
  **Phrasing:** "Your 'evidential floor' effectively silences the far future. If a theory says the value of the future is astronomical, but you cap its influence because current evidence is 'silent' on population size, you aren't handling uncertainty; you're imposing a substantive moral skepticism as a procedural rule. You're vetoing the very views that make longtermism compelling."
  **2-Minute Reply:**
  "I am not vetoing the *truth* of longtermism; I am vetoing its *dictatorship* under evidential starvation. If a theory's verdict swings from 'do nothing' to 'sacrifice everything' based on a variable (like far-future population) where our evidence is effectively zero, that theory is acting on faith, not evidence. The 'floor' ensures that such a theory gets a seat at the table proportional to its credence, but it cannot hijack the parliament based on numbers it cannot substantiate. It forces the theory to win the bargain on robust grounds, not speculative magnitude."
  *   **Concede:** This will reduce the action-guidance of pure longtermist views in the short term.
  *   **Hold:** Speculative magnitudes should not dictate action when evidence is silent.
  *   **Soft Spot:** Defining "evidence is silent" without begging the question against empirical longtermism.

  ### 3. Dynamic Inconsistency (The Money Pump)
  **Who:** Decision Theorists & ML.
  **Phrasing:** "This view violates Independence or Sure-Thing Principle. If your volatility discount changes based on the set of available actions, you are vulnerable to a money pump. I can offer you a sequence of choices where you pay to switch options, then pay to switch back, because the 'nearby actions' context shifted. If you can be pumped, you're irrational."
  **2-Minute Reply:**
  "This is the strongest formal challenge. My reply is that the 'volatility' is a property of the *theory's evidence-sensitivity*, not merely the menu of options. However, I concede that without a rigid definition of 'nearby courses of action,' dynamic inconsistency is a risk. I treat this as a feature of *bounded rationality* under normative uncertainty, not ideal rationality. We are not ideal agents; we are agents trying to avoid fanaticism. I would rather pay a small premium to avoid a fanatical trap than be dynamically consistent and vulnerable to astronomical stakes I can't verify."
  *   **Concede:** Yes, strict dynamic consistency is likely violated.
  *   **Hold:** Avoiding fanaticism is worth the cost of some dynamic inconsistency.
  *   **Soft Spot:** **This is the hardest landing objection.** (See analysis below).

  ### 4. The Metric Problem ("Nearby" Actions)
  **Who:** ML & Decision Theorists.
  **Phrasing:** "You say verdicts swing across 'nearby courses of action.' What is the metric? In high-dimensional policy space, 'nearby' is ill-defined. If I tweak the definition of neighborhood, I can manipulate the volatility discount. Is this implementable, or is it hand-waving?"
  **2-Minute Reply:**
  "I grant the formalization is incomplete. I propose defining 'nearby' as actions distinguishable only by noise in our empirical evidence. If two actions differ only by variables we cannot measure, and the theory ranks them differently, that's volatility. For implementation, we can approximate this via sensitivity analysis on the empirical inputs the moral theory depends on."
  *   **Concede:** The metric is currently informal.
  *   **Hold:** Sensitivity to empirical noise is the core intuition.
  *   **Soft Spot:** Lack of a rigorous distance metric for "actions."

  ### 5. The De Minimis Disguise
  **Who:** Rationalist Blog Veterans.
  **Phrasing:** "The volatility discount is just a de minimis credence cutoff in disguise. You're saying 'if a theory makes wild claims, we treat its credence as lower.' Why not just say 'I assign low credence to fanatical theories' and keep MEC? Why the extra machinery?"
  **2-Minute Reply:**
  "Because credence and magnitude should be separated. I might have high credence that Utilitarianism is true, but low confidence in its *calculation* of the far future. A credence cutoff punishes the *theory*; my volatility discount punishes the *application* of the theory in evidence-poor contexts. I can trust Utilitarianism on local harm (high say) but distrust it on astronomical waste (low say) without splitting my credence."
  *   **Concede:** The effect is similar to lowering credence in specific contexts.
  *   **Hold:** It preserves the integrity of the theory's core credence while managing its speculative outputs.
  *   **Soft Spot:** Distinguishing "credence in theory" from "confidence in theory's output" without splitting hairs.

  ### 6. Intertheoretic Comparison (The "You Still Need Numbers" Point)
  **Who:** Academic Philosophers.
  **Phrasing:** "To calculate the 'credence-weighted average verdict' for the volatility discount, you need to compare verdicts across theories. If Theory A says '10 utils' and Theory B says '100 utils,' you need to know if A's 10 is comparable to B's 100. You haven't solved the comparison problem; you've assumed it away to calculate the discount."
  **2-Minute Reply:**
  "I only need *rough* comparability to calculate the variance, not exact cardinality. We can normalize each theory's outputs to a [0,1] scale based on its own internal best/worst cases before checking volatility. The discount applies to the *normalized* swing. We avoid the deep comparison problem by looking at relative swings within each theory, then aggregating the discounted weights."
  *   **Concede:** Some normalization is required.
  *   **Hold:** Normalization is easier than full cardinal intertheoretic comparison.
  *   **Soft Spot:** Normalization assumptions might reintroduce the comparison problem.

  ### 7. Justification of Humility (The "Parity" Move)
  **Who:** Academic Philosophers.
  **Phrasing:** "You argue epistemic humility about *which* theory is true implies humility about *magnitudes*. But why? I can be certain Utilitarianism is true but admit I'm bad at calculating consequences. Your move conflates uncertainty about the *law* with uncertainty about the *facts*."
  **2-Minute Reply:**
  "Because in normative ethics, the 'law' often *is* the magnitude function. If a theory says 'suffering aggregates without bound,' that is a structural claim, not an empirical one. If our evidence doesn't pin down that structural claim, we should be humble about the theory's verdicts derived from it. The parity move says: don't trust the probability distribution over theories if you don't trust the magnitude distribution within them."
  *   **Concede:** There is a distinction between structural and empirical uncertainty.
  *   **Hold:** Normative theories often make structural magnitude claims that are evidence-silent.
  *   **Soft Spot:** Theories that separate structure from magnitude cleanly.

  ### 8. Implementability (The "Code It" Challenge)
  **Who:** ML People.
  **Phrasing:** "I want to code this. How do I represent the 'hypothetical long-run bargain' computationally? Is this Nash Bargaining? Coarse Correlated Equilibrium? If I can't run it, it's not a decision procedure."
  **2-Minute Reply:**
  "Think of it as a constrained optimization problem. Maximize a weighted sum of theory-satisfaction, subject to the volatility constraint (variance penalty) and the evidential floor (minimum utility guarantee for evidence-silent theories). It's implementable as a regularized objective function. I don't have the library ready, but the math is standard convex optimization if we fix the bargaining solution."
  *   **Concede:** No code exists yet.
  *   **Hold:** It maps to regularized optimization.
  *   **Soft Spot:** Defining the "bargain" solution concept precisely.

  ---

  ### Analysis: Which Objection Lands Hardest?

  You asked specifically about the **Collapse**, **Money Pump**, and **De Minimis** accusations.

  **The Hardest Hitter:** **Dynamic Inconsistency (Money Pump).**
  *   **Why:** In a room with decision theorists and ML researchers, being "money-pumpable" is a claim of *irrationality*, not just redundancy. If you are dynamically inconsistent, you are exploitable. The Collapse objection says you are *boring* (redundant); the De Minimis objection says you are *ad hoc*. But the Money Pump objection says you are *broken*.
  *   **How to tell it landed:** Watch the decision theorists. If they stop asking about the moral intuition and start sketching decision trees on napkins or whiteboards involving sequential choices, you are in trouble. If they ask, "Would you take this bet *before* or *after* learning the volatility?" and you hesitate, it has landed.
  *   **Mitigation:** Own it. Frame it as a "bounded rationality" feature. "I am willing to be pumpable to avoid fanaticism." This turns a bug into a value judgment, which is harder to refute formally but costs you the "rational agent" high ground.

  ### The Objection I Hope Nobody Asks

  **"The Problem of Dogmatic Theories" (Metanormative Regression)**
  *   **The Question:** "What if one of the candidate first-order theories is *Metanormative Dogmatism*? Suppose Theory D says: 'I am the true moral theory, and any decision procedure that dilutes my verdict via voting or volatility discounts is morally impermissible.' How does your parliament handle a member who rejects the parliament's legitimacy? If you vote on it, Theory D votes 'No' on the procedure itself. If you exclude Theory D, you violate your own rule of proportional say. Does your view dissolve when a theory denies the coherence of normative uncertainty?"
  *   **Why it's deadly:** It attacks the coherence of the parliamentary model itself. If your system cannot handle a theory that denies the system, it is not universal. If you exclude such theories, you are imposing a *meta-moral* constraint that overrides the credence you claimed to respect. It forces you to admit there is a "super-theory" (your procedural view) that trumps the first-order theories, which contradicts the humility premise.
  *   **Preparation:** Have a "Constitutional" reply ready. "The parliament operates on a constitutional level. Membership requires accepting the uncertainty premise. Theories that deny uncertainty are treated as having 0 credence *in the context of uncertainty management*, because they deny the problem exists." (This is weak, but it's the best shield).
