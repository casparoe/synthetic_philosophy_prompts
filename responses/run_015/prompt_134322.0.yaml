  In a sterile laboratory, three mutually antagonistic graduate students—Alice, Bob, and Charlie—stand around a verified fair coin flipped by a robotic arm under high-definition surveillance. The coin lands heads thirty consecutive times, defying statistical expectation, and each student immediately seals a written testimony in a tamper-proof digital log before communicating with the others. In a parallel control run, the setup is identical in every observable respect, including the students' skepticism and the sealed logs, but the coin is secretly weighted to ensure heads, meaning no law of nature is violated despite the testimony appearing indistinguishable from the first case.

  Applying Hume's rules, the wise man proportions belief to the evidence, where evidence is derived solely from experience. In the weighted-coin run, the testimony aligns with uniform experience, for we have constant experience that manipulated objects behave predictably; thus, the testimony faces no opposition and is rational to accept. In the miracle run, however, the testimony contends against uniform experience, which has established a firm and unalterable law that fair coins do not land heads thirty times by chance; this uniform experience amounts to a full proof against the event. Since Hume dictates that no testimony is sufficient to establish a miracle unless its falsehood would be more miraculous than the fact, and since uniform experience constitutes the highest possible evidence, the rational verdict is vice versa: the weighted version is accepted, while the miracle version is rejected. The structural feature doing the work is the antecedent weight of uniform experience against the *type* of event testified to; because the testimony is identical in both runs, the differentiator must be the nature of the fact itself, which in the miracle run carries a proof against it that testimony cannot overcome. If we drop the control run, the judgment remains unchanged for the Humean, because the evaluation rests on the claim's violation of natural law, not on the comparison to a control; the mere assertion of a fair coin behaving impossibly invites the full force of uniform experience against it. A defender of Hume would patch the hole by insisting that "tamper-proof" logs and cameras are still human artifacts subject to unknown deception or error, whereas the law of nature is established by the experience of all mankind in all ages; therefore, it is always more probable that the laboratory setup was flawed or the witnesses deceived than that the course of nature was interrupted.
