  Here's a thinking process that leads to the suggested session design:

  1.  **Analyze the Request:**

      *   **Target Audience:** 14 novelists (mostly 2nd/3rd book), quietly hostile to theory, pragmatic, craft-focused.
      *   **Goal:** A 2-hour session teaching the mechanics of *performative utterances* (speech acts) without using theory jargon until the debrief. Specifically, focusing on *felicity conditions* (procedure, persons, execution, intent) and how they translate to fiction.
      *   **Core Problem:** The facilitator (user) struggles with scenes where characters say things that *do* things (forgive, marry, order, bequeath), but the scenes "go dead" because the conditions for the act aren't met in the narrative logic.
      *   **User's Coinages (Must Incorporate/Address):**
          1.  *Shadow Uptake:* Readers accept fictional speech acts as "real" within the story even though they are void in reality.
          2.  *Deferred Performatives:* Utterances whose effect depends on a future event (suspense).
          3.  *Double-Addressed Acts:* Utterances aimed at character and reader simultaneously with different forces.
      *   **Constraints:** 14 adults, 2 hours, 1 facilitator, low budget (index cards, flipchart, pens, bell), no prep between sessions, no homework.
      *   **Requirements:** Runnable activity (game/simulation), small but *real* stakes (tokens/commitments), minute-by-minute plan, debrief strategy, troubleshooting predictable failures, honest assessment of limitations.
      *   **Tone:** Professional, precise, respectful of the user's expertise, avoiding condescension or over-theorizing.

  2.  **Deconstruct the Core Concept:**

      *   The user wants writers to *feel* the difference between a sentence that describes and a sentence that *acts*, and specifically the conditions under which an act succeeds or fails.
      *   To do this without theory, we need a *ritual* or *procedure* within the room that mimics the narrative conditions.
      *   The "real stakes" requirement is tricky. We can't legally marry people or transfer money. But we can create a micro-economy of *authority* or *status* within the room using tokens/cards.
      *   *Key Insight:* The writers need to experience the *friction* of trying to make words work when the conditions aren't right.

  3.  **Designing the Activity: "The Ledger"**

      *   *Concept:* A simulation of a bureaucratic or ritualistic body where "Speech Acts" transfer value (tokens).
      *   *Mechanism:* Participants are assigned roles with specific "Standing." They have index cards with "Formulas." They must execute transactions.
      *   *Stakes:* Tokens (poker chips or paper slips). If you lose tokens, you lose "Standing" (ability to speak effectively).
      *   *Twist:* The rules for success are hidden or shifting, mimicking the implicit contracts of fiction.
      *   *Addressing the Coinages:*
          *   *Shadow Uptake:* This is the hardest to stage. It requires the group to *agree* a void act is valid. I can engineer this by allowing a "Ratification" phase where the group votes to accept a flawed act.
          *   *Deferred Performatives:* Easy to stage. A promise that pays out only at the end of the session.
          *   *Double-Addressed:* Hard to stage in a game. This is likely the one the user has to supply in the debrief. I need to be honest about this.

  4.  **Drafting the Session Plan (Iterative Process):**

      *   *Opening (0-15 mins):* No lecture. Just rules. Establish the "Court" or "Exchange."
      *   *Round 1 (15-45 mins):* Basic Transactions. Try to transfer tokens using specific phrases. Some will fail due to "procedure."
      *   *Round 2 (45-75 mins):* Complications. Introduce "Void" conditions (expired license equivalent). Introduce "Deferred" bets.
      *   *Break (75-90 mins):* Essential for processing.
      *   *Round 3 (90-105 mins):* The "Shadow" Round. Trying to make an invalid act stick through narrative force (writing).
      *   *Debrief (105-120 mins):* Connecting the game to the page.

      *Refining the Stakes:* Real commitment is hard. Let's use "Authority Chits." If you have no chits, your words don't count. If you speak out of turn, you lose chits.
      *Refining the "Real" aspect:* The user wants them to feel commitment. Let's have them write a promise on a card that they *must* fulfill if the act succeeds (e.g., "I owe the group a reading of my first page next time" or "I buy the coffee"). *Correction:* No homework/future commitment allowed per constraints ("no preparation between sessions"). Okay, the stakes must be *in the room*. Status/Token economy is best. Let's make the tokens redeemable for something trivial but tangible (e.g., choosing the break time, picking the debrief topic, or just a pile of paperclips they want to hoard). Let's go with "Ink" – physical stamps on their hand or cards. No, tokens are better. Let's use paper slips as "Credit."

      *Addressing the Coinages honestly:*
      *   *Shadow Uptake:* The game can simulate the *check*. The group acts as the "Reader." If they accept a void act, that's Shadow Uptake.
      *   *Deferred:* The game can handle this (a bet settled at the end).
      *   *Double-Addressed:* This requires a split audience. In the room, everyone is the "Reader." I cannot easily split them into "Character" and "Reader" roles without breaking the flow. I must advise the user that *this one* is for the debrief.

  5.  **Developing the Rules & Materials:**

      *   *Materials:* Index cards (Role Cards, Formula Cards), Tokens (paper slips), Pens, Bell, Flipchart.
      *   *Roles:* Registrar, Witness, Principal, Observer.
      *   *Formulas:* "I bequeath," "I resign," "I forgive."
      *   *Hidden Rules:* (The Felicity Conditions). E.g., Must stand up. Must hold a token. Must look the person in the eye. Must not have spoken in the last 2 minutes.

  6.  **Troubleshooting Predictable Failures:**

      *   *The Rule-Lawyer:* Will try to hack the game. *Solution:* Make them the "Judge" for a round.
      *   *The Fictionalist:* "It's just a story." *Solution:* Ask them why their story felt dead then.
      *   *The Actor:* "I meant it, so it worked." *Solution:* Distinguish Intent from Convention.

  7.  **Structuring the Debrief:**

      *   Move from the *feeling* of failure in the game to the *feeling* of failure on the page.
      *   Introduce the user's terms *only* here.
      *   Be honest about the "Game Convention" vs. "Narrative Truth" gap.

  8.  **Review against Constraints:**

      *   14 participants? Yes, roles can rotate.
      *   2 hours? Yes, timing needs to be tight.
      *   No theory jargon? Yes, until debrief.
      *   User's coinages? Integrated where possible, honest about limitations.
      *   Real stakes? Tokens/Status within the room.

  9.  **Final Polish:**

      *   Ensure the tone matches the user's (literary, precise, slightly weary of theory but respectful of the mechanics).
      *   Make sure the "Shadow Uptake" mechanic is clear: The group votes on validity, not the rules.
      *   *Self-Correction on Double-Addressed:* I need to be very clear that the game *cannot* do this. It requires a reader outside the text. I will advise the user to handle this in the debrief using examples, not the game.

  10. **Writing the Response:** (Drafting the content based on the above thoughts.)
      *   *Title:* The Registry.
      *   *Setup:* Room arrangement, materials.
      *   *The Game:* Three rounds.
      *   *The Debrief:* Detailed script.
      *   *Troubleshooting:* Specific responses.
      *   *Limitations:* Honest assessment.

  *(Self-Correction during drafting)*: Wait, the user wants "small but not fictional" commitments. Tokens are fictional. How to make it real?
  *Idea:* The commitment is to the *room's consensus*. If you break a rule, you lose social standing. Or, use a "Pot" of something tangible. A bag of high-quality chocolates? No, too trivial.
  *Better Idea:* The commitment is *textual*. They write a sentence. If the act "fails," they must cross it out. If it "succeeds," it goes on the Wall. The "Stake" is the validity of their own writing in that moment.
  *Best Idea (aligning with prompt):* "Tokens of Standing." They are paper, but the *loss* feels real because it silences you. To make it "not fictional," let's have a physical consequence. If you lose all tokens, you must stand in the corner for 5 minutes. Or, simpler: The "Stake" is the *right to speak*. If you botch the performative, you are "silenced" for the next round. That feels real enough for a workshop.
  *Actually, let's look closer:* "tokens, chips, a ledger, a standing to be gained or lost." Okay, a ledger is good. A physical ledger on the flipchart. Names and Scores. Public shame/pride. That works.

  *Refining Shadow Uptake in the game:*
  Round 3 needs to be where the Rules say "Invalid" but the Group votes "Valid." This simulates the Reader overriding the Logic.

  *Refining Double-Addressed:*
  I will explicitly state this cannot be gamified easily. It requires the *silence* of the reader.

  *Let's build the response.*
answer: |-
  Here is a design for the session. It is built to be run exactly as described: no theory until the end, high friction during the activity, and a debrief that connects the friction in the room to the friction on the page.

  ### Session Title: The Registry

  **Concept:** A simulation of a bureaucratic body where words transfer value, but the validity of the transfer depends on hidden conditions of procedure, standing, and state.
  **Materials:**
  *   1 Flipchart and marker (for the "Ledger").
  *   1 Bell.
  *   56 Index cards (14 participants × 4 cards each).
  *   14 Pens.
  *   40 small paper tokens (cut from scrap paper, or poker chips if available).
  *   1 Box (for "The Archive").

  **Room Setup:**
  *   Chairs in a circle.
  *   Flipchart visible to all.
  *   A table at the front with the Box and the Ledger.

  ---

  ### Part 1: The Activity (90 Minutes)

  #### 0:00 – 0:10: Induction (No Theory)
  **Facilitator Script:**
  "We are going to run a simulation. For the next hour, this room is a Registry. In this room, words are currency. You can transfer authority, debt, and status to one another using specific phrases.
  There are rules. I am the Registrar. I hold the Ledger.
  You begin with two tokens each. These represent your Standing.
  If your Standing reaches zero, you are 'Silenced.' You may not speak for the remainder of the game, only write.
  If you finish with the most tokens, you choose the topic of our debrief.
  I will distribute Role Cards. Do not show them to anyone.
  I will distribute Formula Cards. These are the only sentences you are allowed to speak to effect change.
  If you speak a sentence that is not on a card, nothing happens.
  If you speak a sentence on a card but the conditions are not met, you lose a token.
  We begin."

  **Distribution:**
  *   **Role Cards (14 total):**
      *   4 × *Principal* (Can initiate acts).
      *   4 × *Witness* (Must be present for acts to work).
      *   4 × *Beneficiary* (Can receive acts).
      *   2 × *Auditor* (Can challenge an act).
      *   *(Note: Roles are fluid. In Round 2, they swap.)*
  *   **Formula Cards (3 per person):**
      *   "I bequeath [Token] to [Name]."
      *   "I resign my Standing."
      *   "I forgive [Name] their Debt."
      *   "I appoint [Name] as [Role]."

  #### 0:10 – 0:35: Round One (The Procedure)
  **The Mechanic:** Participants must stand, make eye contact, and speak the formula to transfer tokens.
  **The Hidden Rules (Facilitator Only):**
  *   *Rule 1:* A transfer requires a Witness. If no Witness sees it, the Facilitator rings the bell and the speaker loses a token.
  *   *Rule 2:* You cannot bequeath more than you hold. If you try, you lose a token.
  *   *Rule 3:* You cannot forgive a debt that doesn't exist (i.e., take a token from someone who has none). If you try, you lose a token.
  *   *Rule 4:* Auditors can challenge an act. If they shout "Challenge!" before the bell rings, the Facilitator judges. If the challenge is valid, the speaker loses a token. If invalid, the Auditor loses a token.

  **Facilitator Action:**
  Run the room strictly. Ring the bell sharply when a rule is broken. Do not explain *why* the bell rang. Just deduct the token on the Ledger. Let them deduce the rules through failure.
  *Goal:* Participants feel the frustration of a sentence "misfiring" despite being spoken clearly.

  #### 0:35 – 0:55: Round Two (The Deferral)
  **The Mechanic:** Introduce "Pending" Cards.
  **New Rule:** Participants can now write a promise on an index card (e.g., "I owe [Name] one token at the end of the session"). They sign it and place it in The Archive (Box).
  **The Twist:**
  *   Some cards are valid.
  *   Some cards are void because the writer is already Silenced or has no Standing.
  *   **Crucial:** At the end of Round Two, announce that *one* of the Principals has "died" (remove their tokens). Their Pending Cards are now void unless a Witness ratifies them.
  **Facilitator Action:**
  Allow them to trade promises. Then, trigger the "Death." Watch who tries to claim the deferred tokens. Deny the claims if the procedure wasn't followed (e.g., no Witness signed the card).
  *Goal:* Create the sensation of a speech act hanging in limbo, dependent on a future event (survival/ratification) that the speaker cannot control.

  #### 0:55 – 1:05: Break
  **Instruction:** "Do not discuss the rules. Do not discuss your tokens."

  #### 1:05 – 1:30: Round Three (Shadow Uptake)
  **The Mechanic:** This is the critical round for your first coinage.
  **Setup:** Collect all Role Cards. Tell them: "Roles are now dissolved. You are all Writers."
  **Task:** They must write a short paragraph (5-6 sentences) describing a performative act (a marriage, a firing, a confession) that *should* fail based on the rules of Round One (e.g., no witness, wrong person), but must *succeed* in the room.
  **The Vote:**
  1.  Participant reads their paragraph.
  2.  The Room votes: Did it work? (Show of hands).
  3.  If the majority says "Yes," the speaker gains 2 tokens.
  4.  If the majority says "No," the speaker loses 1 token.
  **Facilitator Action:**
  Do not judge validity. The *group* decides. If someone writes a technically void act (e.g., "He married her in a barn with no licence") but writes it with enough narrative gravity that the room votes "Yes," they win.
  *Goal:* This simulates **Shadow Uptake**. The act is void by the rules (Round One), but valid by the consensus of the readers (the room).

  ---

  ### Part 2: The Debrief (45 Minutes)

  This is where you name the things they felt. Do not start with definitions. Start with their experience.

  #### 1:30 – 1:40: The Misfire (Felicity Conditions)
  **Question:** "In Round One, the bell rang. You lost a token. You spoke the words. Why didn't it count?"
  **Expected Answers:** "I didn't have a witness." "I was broke." "I wasn't allowed to speak."
  **Your Move:** Write on the flipchart: **The Words vs. The World.**
  **Say:** "In the room, the words needed the world to be arranged a certain way. You needed standing. You needed a witness. In your novels, you often write the words and forget to build the world that allows them to land. When a scene goes dead, it is usually because the bell rang in the reader's head, and you didn't hear it."

  #### 1:40 – 1:50: The Deferral (Deferred Performatives)
  **Question:** "In Round Two, some of you held cards that promised payment at the end. What happened when I announced the death?"
  **Expected Answers:** "My promise was worthless." "I needed someone else to sign it."
  **Your Move:** Introduce the term **Deferred Performatives**.
  **Say:** "You felt the suspense of the unratified act. In fiction, these are your engines. A resignation tendered but not accepted. A bet made before the money is on the table. The force of the sentence depends on an event the speaker might not live to see. If you treat these as simple dialogue, you lose the tension. They are not statements; they are ticking clocks."

  #### 1:50 – 2:00: The Consensus (Shadow Uptake)
  **Question:** "In Round Three, some of you described acts that broke the rules of Round One. No witnesses. Wrong forms. Yet you gained tokens. How?"
  **Expected Answers:** "It felt real." "The prose carried it." "We wanted it to work."
  **Your Move:** Introduce the term **Shadow Uptake**.
  **Say:** "This is the novelist's specific magic. In reality, that marriage was void. In the room, your tokens proved it was real. You engineered a check in the readers' minds that overrode the logic of the procedure. You made them complicit in the act. That is not description; that is jurisdiction. You are granting the character the standing the law denied them."

  #### 2:00 – 2:15: The Limitation (Double-Addressed Acts)
  **Your Move:** This is the moment of honesty.
  **Say:** "There is one thing this game could not do. In Round Three, you were all Readers. You all voted the same way. But in a novel, there is a split. There is the character hearing the words, and there is the Reader holding the book. Sometimes they hear different things."
  **Introduce:** **Double-Addressed Acts**.
  **Example:** "A character says 'I forgive you' to a brother. The brother hears absolution. The Reader, who knows the speaker is lying, hears a threat. The game couldn't stage this because we were a consensus body. A novel is a private conspiracy between writer and reader against the character. You have to build this yourself. When you write a performative, ask: Who is this for? If the answer is 'everyone,' it is probably for no one."

  #### 2:15 – 2:20: Closing
  **Say:** "You felt the weight of the token. You felt the silence of the bell. Take that weight back to the page. When your character speaks, do not ask 'Is this true?' Ask 'Does this stand?'"

  ---

  ### Troubleshooting Predictable Failures

  **1. The Rule-Lawyer**
  *   **Behavior:** In Round One, they will ask, "Is eye contact required?" or "Can I whisper?" trying to find the loophole.
  *   **Response:** Do not answer. Ring the bell if they hesitate too long. Say: "The Registry does not negotiate."
  *   **Debrief Use:** "One of you tried to find the code. That is editing. But in the scene, the character cannot ask the rules. They must risk the misfire. If your character knows exactly how to say it to make it work, the scene has no danger."

  **2. The Fictionalist**
  *   **Behavior:** "This is silly. In my book, I can marry anyone I want. I don't need tokens."
  *   **Response:** In Round Three, when they read their paragraph, if the room votes "No," they lose a token regardless of their argument.
  *   **Debrief Use:** "You said you can marry anyone you want. But the room voted against you. Why? Because you didn't build the standing. The reader is the Registry. If they don't grant the standing, the marriage is void, no matter what you write."

  **3. The Actor (Insincerity vs. Misfire)**
  *   **Behavior:** "I said it with feeling. It should have counted." (Confusing *intent* with *felicity*).
  *   **Response:** "Intent does not cure a void procedure. A drunk registrar cannot marry you, no matter how much he means it."
  *   **Debrief Use:** "This is the difference between a hollow act and a failed act. A hollow act meets the rules but lacks intent (a forced apology). A failed act has intent but lacks rules (a vow to the wrong person). Readers forgive hollowness; they do not forgive failure. Know which one you are writing."

  ---

  ### Honest Assessment of Limitations

  You asked me to be frank about what the exercise cannot reproduce.

  **1. The "Game Convention" Problem**
  *   **The Risk:** Participants will view the tokens and rules as arbitrary constraints of the workshop, not analogies for narrative logic. They will think, "I lost a token because *you* said so," not "I lost a token because the act was void."
  *   **The Fix:** This falls entirely on you in the final 15 minutes. You must make the leap from "The Facilitator's Rules" to "The Reader's Psychology."
  *   **What to Say:** "The rules in this room were arbitrary. I made them up. The rules in your reader's head are not. They are evolutionary. They are social. When the bell rang here, it was annoyance. When it rings in a book, it is disbelief. You cannot argue with disbelief."

  **2. Double-Addressed Acts**
  *   **The Risk:** As noted in the debrief plan, the game mechanics *cannot* stage this. A game requires a shared state of knowledge (public information). A double-addressed act relies on *private* knowledge (the reader knows something the character doesn't).
  *   **The Fix:** Do not try to force a mechanic for this. It will feel contrived. Own it as a limitation of the simulation. Use the debrief to explain that *this* is where the craft transcends the game. The game teaches the procedure; the writer's solitude teaches the duality.

  **3. Shadow Uptake Nuance**
  *   **The Risk:** In Round Three, the group might vote based on "nice writing" rather than "narrative validity." They might accept a void act just because the prose was pretty.
  *   **The Fix:** In your instructions for Round Three, emphasize: "Do not vote on whether it was beautiful. Vote on whether you believe the act *happened*."
  *   **Debrief:** If they do vote on beauty, use it. "You accepted a void act because the prose was good. That is exactly the danger. Pretty prose can mask a structural failure for a page, but not for a chapter. Eventually, the bill comes due."

  ### Preparation Checklist for You
  1.  **Write the Role Cards:** 14 cards, clearly marked.
  2.  **Write the Formula Cards:** 42 cards (3 per person).
  3.  **Prepare the Ledger:** Draw columns on the flipchart for each participant's name.
  4.  **Prepare the Tokens:** Cut 40 small squares of paper. Number them if you want to track them, but plain is better.
  5.  **Rehearse the Bell:** Practice ringing it sharply. It is the voice of the "Real."

  This design respects your constraint: no theory until the end. It forces them to feel the *mechanics* of the performative before they have the vocabulary to dismiss it. It produces **Shadow Uptake** and **Deferred Performatives** mechanically. It leaves **Double-Addressed Acts** for your expertise in the debrief, where it belongs.
