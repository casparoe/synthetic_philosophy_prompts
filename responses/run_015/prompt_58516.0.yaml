answer: |-
  ### Scenario 1: The Griefing
  Alex spends months building an intricate virtual castle in "NeonHub," scripting lights and hosting weekly tours. It's their pride. During a public event, user "Zorp" joins, ignores chat, and uses exploit tools to delete the castle's core files instantly. The structure collapses into void. Alex watches it vanish. Zorp laughs in voice chat and leaves. Alex feels violated. No money lost, just time and creation.

  ### Scenario 2: The Glitch
  Alex spends months building an intricate virtual castle in "NeonHub," scripting lights and hosting weekly tours. It's their pride. During a public event, the server hosting "NeonHub" crashes due to a code error. The structure collapses into void. Alex watches it vanish. The admins apologize but say backups failed. Alex feels devastated. No money lost, just time and creation.

  ***

  ### Analysis of Views

  **View A (Virtual Realism)** argues that the castle is a real object within the digital environment. In both scenarios, a real object was destroyed, so harm occurred intrinsically. However, A likely views Scenario 1 as morally worse because it involves a rights violation (vandalism), whereas Scenario 2 is a tragedy. The heavy lifting here is done by the **persistence of the object**; if the castle weren't treated as a stable entity with properties, A couldn't claim it was "broken." If you drop the constraint that the world is persistent and rule-bound, the object becomes ephemeral noise, and A collapses.

  **View B (Offline Spillover)** argues the castle is code-only; harm exists only if Alex's offline well-being drops. In both cases, Alex feels bad, so harm occurred. B might argue Scenario 1 is worse because malicious intent causes deeper psychological distress (anger/betrayal) than a bug (frustration). The heavy lifting is done by the **no offline threats** constraint. If Zorp doxxed Alex offline, B would easily call it harm. Without that, B must rely entirely on internal mood states. If Alex remained stoic, B would have to say no harm occurred, which feels counterintuitive to the loss.

  **View C (Investment/Self)** argues harm tracks the piece of Alex's identity embedded in the build. Both scenarios sever that extension of self, so both are harmful. C might see Scenario 1 as an attack on the *self*, while Scenario 2 is just loss of the *self-extension*. The heavy lifting is the **months of effort** detail. If Alex built it in five minutes, C would say little harm occurred. Drop the time investment, and C loses its metric for measuring harm.

  **Steelman for View B (The Skeptic):**
  View B often feels dismissive, but its strongest poke hole is precision. B argues that "harm" requires a suffering subject. If we say the *object* was harmed (View A), we are using metaphorical language. Atoms weren't broken; bits were flipped. B would argue these cases confuse *damage to property* with *harm to a person*. If Alex wins the lottery an hour later and doesn't care about the castle anymore, A and C must still call the deletion "harmful," which seems absurd. B insists harm is contingent on the person's actual state, not the status of their files.

  ***

  ### Discussion Handout

  | View | Verdict on griefing | Verdict on bug loss | Reason in plain words | Best comeback |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | Harmed (High) | Harmed (High) | The virtual object is real; destroying it is direct harm regardless of feelings. | If the server shuts down forever, was every object harmed equally? |
  | **B** | Harmed (Medium) | Harmed (Low) | Objects are fake; harm is only the negative mood offline, which is worse with malice. | If the victim feels nothing, was any harm done at all? |
  | **C** | Harmed (High) | Harmed (High) | The build was part of the self; losing it severs that identity extension. | Does deleting a backup copy harm the self if the original remains? |
