          *   *Conflict:* For 1277, Galileo binds God to geometry. For Galileo, 1277 makes God arbitrary/capricious.
          *   *Defensibility:* 1277 protects transcendence. Galileo protects intelligibility.

      *   **Axis 2: Epistemic Status of Demonstration**
          *   *1277:* Skepticism about *physical* necessity. Aristotelian physics claims necessity where there is only contingency. "Demonstration" often masks assumption.
          *   *Galileo:* Mathematical demonstration is certain. It deals with necessary truths about quantity and motion.
          *   *Conflict:* 1277 says Galileo's "necessities" are actually contingent. Galileo says 1277 undermines the possibility of natural science.
          *   *Defensibility:* 1277 anticipates modern contingency of laws. Galileo anticipates modern mathematical physics.

      *   **Axis 3: Hermeneutic Status of Scripture**
          *   *1277:* Scripture (via Church authority) dictates metaphysical boundaries. Literal sense holds unless proven impossible, but philosophical "necessity" doesn't prove impossibility.
          *   *Galileo:* Accommodationism. Scripture speaks phenomenologically. Interpretation must bend to demonstration in physical matters.
          *   *Conflict:* 1277 fears subjective interpretation undermining authority. Galileo fears literalism undermining truth.

      *   **Addressing the Specific Questions:**
          *   *Direction of Constraint:* Why intolerable? 1277 sees Galileo as idolatry of reason. Galileo sees 1277 as idolatry of text over reality. Can they be defended? Yes, internally consistent.
