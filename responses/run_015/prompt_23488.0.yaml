      *   *Tone:* Academic, seminar-ready, encouraging debate.

  5.  **Final Polish:** Check against the three axes and three specific questions. Ensure the conclusion offers a reasoned judgment, not a historical summary. (The prompt explicitly warns against "what happened next").

