answer: |-
  There is no single proper noun for this exact configuration, but the components are well-understood in decision theory and measure-theoretic probability. You have isolated the tension between **Expectation** (which fails here) and **Dominance** (which survives).

  Here is the carving you asked for: the name of the move, the name of the situation, the boundary cases, and the answers to your three specific questions.

  ### 1. The Name of the Move and the Situation

  **The Move:** **Statewise Dominance** (or **Pointwise Dominance**).
  In decision theory, to say option $X$ dominates option $Y$ statewise means that for every possible state of the world (every branch of the coin toss), the payoff of $X$ is greater than or equal to the payoff of $Y$, and strictly greater in at least one case. Usually, this is used to justify preferring $X$ over $Y$ without calculating expected values. You are applying Statewise Dominance to variables that lack defined expectations.

  **The Situation:** **Dominance without Integrability**.
  "Integrability" is the technical condition required for a random variable to have a well-defined expected value (specifically, the sum of the absolute values of the payoffs weighted by probability must be finite). Your games $A$ and $B$ are **non-integrable**. The situation is that while the *absolute* value of the games is undefined, the *relative* value (the difference) is well-ordered and positive.

  A close neighbour in the literature is the **Pasadena Game** (which is your Game $A$). The specific paradox of comparing two such games is often discussed under **Decision Theory with Undefined Expectations**.

  ### 2. The Carving: Four Boundary Cases

  You asked to distinguish when this route yields a finite price, an unbounded one, a ranking only, or nothing. The distinction rests entirely on the convergence properties of the **difference series** (the series of improvements branch-by-branch).

  Let $D_n$ be the payoff difference on branch $n$ (Payoff of $A$ minus Payoff of $B$), weighted by the probability of that branch.

  **Case 1: Finite Price (Absolute Convergence)**
  *   **Condition:** The series of differences $\sum D_n$ converges absolutely (i.e., $\sum |D_n| < \infty$).
  *   **Your Example:** Game $A$ vs. Game $C$ (where $C$ is $A$ minus \$1). The difference is exactly \$1 on every branch. The sum of differences is 1.
  *   **Verdict:** The swap has a definite, finite value. You should pay up to that amount. The reordering problem cannot touch this because absolute convergence guarantees the sum is invariant to order.

  **Case 2: Unbounded Recommendation (One-Sided Divergence)**
  *   **Condition:** The series of differences $\sum D_n$ diverges to $+\infty$, and every term $D_n \ge 0$.
  *   **Your Example:** Game $A$ vs. Game $B$. The improvements are always non-negative, and their sum grows without bound.
  *   **Verdict:** There is a firm ranking ($A$ is better), but no firm magnitude. Under **linear utility** (where \$1 is always worth \$1), the recommendation is to pay any finite fee. This is your "absurd" conclusion. It is mathematically consistent within the framework of unbounded linear utility, but it signals a breakdown in using expectation as a proxy for value.

  **Case 3: Ranking Only (Conditional Convergence)**
  *   **Condition:** The series of differences $\sum D_n$ converges conditionally (it sums to a number in one order, but can be made to sum to anything in another), or the terms alternate in sign.
  *   **Your Example:** Game $A$ vs. Game $D$ (where $D$ is $-A$). The difference is $2A$. Since $A$'s expectation depends on ordering, the difference does too.
  *   **Verdict:** Statewise dominance fails (sometimes $A$ is better, sometimes $D$). Even if you force a comparison, the value of the improvement depends on how you group the branches. There is no stable verdict, not even a ranking, unless you impose an arbitrary ordering rule.

  **Case 4: Nothing (Oscillation or Undefined Difference)**
  *   **Condition:** The difference series oscillates without settling, or the branch-by-branch comparison itself is undefined (e.g., comparing infinities).
  *   **Verdict:** No ranking, no magnitude. The tools of expectation and dominance both fail.

  ### 3. The Three Specific Questions

  **Q1: Does the improvement's unbounded total count as a "value" in the same sense in which A was said to have none?**
  **No.** It is a different kind of object.
  *   Game $A$ has no value because it is **non-integrable**: the positive and negative parts both sum to infinity, making the net expectation undefined ($\infty - \infty$).
  *   The improvement ($A - B$) has a **divergent expectation**: the negative part is zero, and the positive part sums to infinity.
  *   In measure theory, the first is "undefined," and the second is "infinity." While neither is a finite number, "infinity" is a directed limit. It allows for ordering (Infinity > Finite), whereas "undefined" does not. So, the improvement has a **directional value**, but not an **integrable value**.

  **Q2: Does the argument need the two games to be played with the same coin?**
  **Yes, absolutely.** This requirement is called **Coupling**.
  *   Your argument relies on comparing branch $n$ of Game $A$ directly with branch $n$ of Game $B$. This assumes both games are functions of the *same* underlying random variable (the same sequence of coin tosses).
  *   If you play them with separate coins, you cannot compare them branch-by-branch. You only have the marginal distributions. Since both distributions yield undefined expectations, and there is no statewise link, there is no mathematical basis to prefer one over the other. The "verdict" vanishes without the coupling.

  **Q3: Which half of my second case is the fragile one — the ranking, or the any-finite-fee?**
  **The "any-finite-fee" recommendation is the fragile half.**
  *   **The Ranking is Robust:** Statewise Dominance is a logical truth. If $A$ pays more than $B$ in every possible outcome, $A$ is preferred to $B$, regardless of probability weights or expectation calculations. This holds for any rational agent who prefers more money to less.
  *   **The Fee is Fragile:** The conclusion that you should pay *any* finite fee (e.g., \$1 million) relies on an assumption of **Linear Utility**. It assumes that the utility of \$1,000,000 is exactly one million times the utility of \$1.
  *   In reality, almost all agents have **diminishing marginal utility** (bounded or logarithmic). If your utility function is bounded (e.g., there is a maximum amount of good money can do for you), the expected *utility* gain from switching $B$ to $A$ will be finite, even if the expected *dollar* gain is infinite. You would not pay \$1 million for a game that pays \$0 two-thirds of the time, regardless of the infinite tail. The "absurd" price tag is an artifact of applying linear arithmetic to a non-integrable domain.

  ### Summary
  You have identified **Statewise Dominance over Non-Integrable Variables**.
  *   **The Move:** Comparing outcomes directly rather than aggregating them first.
  *   **The Limit:** It works only when the games are **coupled** (same coin).
  *   **The Verdict:** It yields a robust **ranking** ($A$ is better than $B$), but the **price** derived from that ranking is valid only under **linear utility**. If utility is bounded, the price becomes finite, resolving the absurdity while preserving the preference.
