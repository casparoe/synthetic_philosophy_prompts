answer: |-
  Here are ten conversational questions designed to pressure the view without sounding like a grad seminar. Each includes the guest's likely pivot and your follow-up push.

  ### 1. The "Coordination vs. Metaphysics" Opener
  **You:** "Let's start with the diagonal. The standard pitch is: 'Don't just optimize your move; optimize the output of the algorithm you share with your twin.' But if I strip out the metaphysics—if I stop talking about 'logical causation' or 'timeless decision'—doesn't this just look like a coordination convention? Like, any game theorist could say, 'Let's all agree to play on the diagonal.' What work is the *superrational* machinery doing that a simple handshake agreement doesn't?"

  *   **Likely Answer:** "A handshake requires communication and enforcement. Superrationality works in the one-shot, no-communication case because the correlation is logical, not causal. We aren't agreeing; we are identical processors arriving at the same conclusion."
  *   **Your Follow-up:** "Okay, but if we're identical processors, isn't that just a fancy way of saying 'assume perfect correlation'? If I'm a causal decision theorist who *believes* you're identical to me, I also play on the diagonal. So is your theory a claim about how the world *is*, or just a rule for how to *label* your assumptions?"

  ### 2. The "Machinery" Check
  **You:** "You mention Functional or Timeless Decision Theory in the book. I worry sometimes that's just branding. If the only output of FDT is 'cooperate in the one-shot PD against a twin,' and CDT can get there just by adjusting its probability estimates, is there any case where FDT says 'do X' and a savvy CDT agent says 'do Y'? I need a case where the machinery actually bites."

  *   **Likely Answer:** "Yes, Newcomb's Problem or Parfit's Hitchhiker. CDT two-boxes or doesn't pay the fare; FDT one-boxes or pays. The difference is how they counterfactually reason about their own decision influencing the predictor."
  *   **Your Follow-up:** "But in those cases, the predictor is explicitly simulating you. In the twenty-letters case, there's no simulator, just other people thinking. Are you saying *every* rational agent is implicitly simulating every other? Because that feels like a heavy ontological cost for a die-roll strategy."

  ### 3. The "SINGLE/DOUBLE" Setup (Your Variant)
  **You:** "I want to break the symmetry. Imagine the twenty-letters game again, billion dollars if exactly one person asks. But now, ten people get a slip saying SINGLE (payoff 1B) and ten get DOUBLE (payoff 2B). Everyone knows the distribution, nobody knows who has what. We're all running the same deliberation, but the function takes the slip as an input. What does superrationality tell the DOUBLE people to do?"

  *   **Likely Answer:** "The function outputs a probability based on the input. $P(\text{ask} | \text{DOUBLE})$ will likely differ from $P(\text{ask} | \text{SINGLE})$. The group optimizes the total expected value by adjusting these rates."
  *   **Your Follow-up:** "So the function *does* differentiate. But does it differentiate enough to matter? If I'm DOUBLE, I want the pot more. If the function tells me to step back to let a SINGLE take it, am I being rational, or am I being altruistic? Where's the line?"

  ### 4. The "SINGLE/DOUBLE" Bargaining Trap
  **You:** "Following up on that: If the DOUBLEs lower their ask-rate to avoid collisions (since their collision is more expensive globally), they are effectively sacrificing their own edge for the group. If I'm a DOUBLE and I realize this, why shouldn't I just defect and ask anyway? The correlation is broken by the slip—my reasoning isn't identical to a SINGLE's anymore. Doesn't this collapse into a bargaining problem about who defers to whom?"

  *   **Likely Answer:** "The reasoning isn't broken. You're all running the same function $f(\text{slip})$. If $f$ says 'DOUBLEs ask less,' then *all* DOUBLEs ask less. If you defect, you break the logical link, and you're no longer superrational. You can't have it both ways."
  *   **Your Follow-up:** "But that sounds like a threat. 'If you don't defer, you're not one of us.' If the only reason I defer is to maintain my membership in the superrational club, isn't that just social pressure dressed up as logic? What if I don't care about the club, I care about the 2B?"

  ### 5. The "Fixed Point" Stability
  **You:** "Let's press on the fixed point. In the symmetric case, we all roll a 20-sided die. In the SINGLE/DOUBLE case, we need a new equilibrium. Who calculates it? If I'm a DOUBLE, I need to know what probability the SINGLEs are using to calculate my best response. But they're waiting on me. Does superrationality give me a recipe to find this number, or does it just say 'there exists a number'?"

  *   **Likely Answer:** "It's a constrained optimization problem. You maximize global utility subject to the constraint that all agents of type $T$ use strategy $S_T$. The math gives you the unique fixed point."
  *   **Your Follow-up:** "Okay, but that requires me to know the *global* utility function. If I'm just a rational agent in a room, why do I care about global utility? If the answer is 'because your utility is tied to theirs,' then we're back to altruism. Why is this decision theory and not just utilitarianism with extra steps?"

  ### 6. Partial Superrationality (The Mix)
  **You:** "Let's muddy the water. Suppose only twelve of the twenty are superrationalists. The other eight are standard causal defectors who ask for sure. Does your theory degrade gracefully? Do the twelve just treat the eight as background noise, or does the presence of defectors break the logical correlation between the twelve?"

  *   **Likely Answer:** "The twelve treat the eight as fixed probabilities. They correlate with each other, but not the eight. They optimize their joint strategy given the noise the eight introduce."
  *   **Your Follow-up:** "But how do the twelve know *which* twelve they are? If I'm in the room, I don't know if the guy next to me is correlating with me or defecting. If I can't identify my logical twins, how do I restrict the correlation to just us? Doesn't uncertainty about *who* is superrational force me back to CDT?"

  ### 7. The Epistemic Burden
  **You:** "That's my worry. It seems like superrationality requires a kind of omniscience. I need to know not just that you're rational, but that you're *superrational*, and that you know I am, and that we both know the distribution of slips. In the real world, that common knowledge is fragile. Is there a threshold? If I'm 90% sure you're superrational, do I 90% cooperate? Or does the whole thing snap off?"

  *   **Likely Answer:** "It's continuous. You weight the correlation by your credence that the other agent is superrational. It's just Bayesian updating on the type of agent you're facing."
  *   **Your Follow-up:** "If it's just Bayesian updating on agent types, then it's not a new decision theory. It's just CDT with a richer model of the opponent. What's left of the 'superrational' claim if I can model it as standard uncertainty?"

  ### 8. The Falsification Question
  **You:** "I want to ask about what counts *against* the view. Is there a case where superrationality returns an answer that you'd hate, or no answer at all, that you can't wave away? If the theory is 'optimize the diagonal,' are there diagonals you refuse to optimize?"

  *   **Likely Answer:** "Maybe in cases of asymmetric information where the correlation leads to a dominated strategy. But generally, if the math says defect, I defect. The theory is normative, not a dogma."
  *   **Your Follow-up:** "So if the math says 'in this specific PD, superrational agents should defect,' you're okay with that? Even if it contradicts the intuition that 'logical twins should cooperate'? I'm trying to find where the theory has teeth—where it might be *wrong*, not just where it applies."

  ### 9. Closing the "Should" Escape Hatch
  **You:** "Here's my last push on this. Philosophers often say, 'Well, it depends what you mean by *should*.' I want to close that off. If I ask you, 'Should I one-box in Newcomb's?' I want a yes or no that commits you to a payout. If your answer is 'You should one-box if you want to be superrational, but you'll get more money if you two-box,' then the theory is just a label for a preference. Does superrationality claim to get you more money, or just to make you feel more logical?"

  *   **Likely Answer:** "It claims to get you more money in problems where your decision is logically correlated with the outcome. In standard causal problems, it converges with CDT."
  *   **Your Follow-up:** "Okay, so it's an empirical claim about returns. If we ran a tournament and superrationalists ended up poorer than causal defectors because they misidentified their twins, would you say they were irrational? Or would you say the world was unfair? I need to know if the theory is falsifiable by bankruptcy."

  ### 10. The Real-World Stakes
  **You:** "To close: My listeners are grad students worrying about their careers and effective altruists worrying about AI. Where does this actually bite? Is there a real-life decision—climate accords, AI safety, salary negotiations—where assuming superrationality changes the move compared to standard game theory? Or is this mostly for thought experiments?"

  *   **Likely Answer:** "AI safety is the big one. If we're building agents that reason like us, we need them to superrationalize to avoid arms races. Also, voting."
  *   **Your Follow-up:** "On voting: The standard view is 'your vote doesn't matter.' The superrational view is 'your vote correlates with others like you.' If that's the pitch, why haven't we seen a superrational voting bloc yet? Is the theory too hard to compute, or just too hard to believe?"
