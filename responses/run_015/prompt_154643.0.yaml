  Please defend a ranking. I want to know which implications matter for cognitive science, which depend on resolving other debates first, and what evidence over the next few years could change your ordering. I'm writing for readers who know science but not the ins and outs of philosophy of mind, so I need the reasoning, not a bibliography or a list of papers. Oh, and I should mention I keep spelling recieve wrong, which is embarassing.
