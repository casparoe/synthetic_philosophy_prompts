prompt: |-
  I have been working through the boundary problem—who properly belongs to the demos—by testing my intuitions against concrete membership cases rather than deriving them from a single prior principle. Here are my verdicts, which I present for coherence-testing.

  First, long-term non-citizen residents who are fully subject to domestic law should eventually acquire full voting membership; mere administrative category seems insufficient to justify permanent exclusion. Second, citizens who have permanently emigrated and are no longer subject to domestic law should eventually forfeit membership, even if they retain nationality, cultural identity, or property interests; being outside the jurisdiction should eventually outweigh being inside the nationality. Third, outsiders severely affected by a polity’s decisions—downstream water users, for instance—merit consultation or weighted consideration, but not full membership; affectedness alone does not confer democratic standing. Fourth, future generations should be institutionally represented through proxy or constitutional mechanisms, yet they are not present members of the current demos; representation is not membership. Fifth, in territories that are governed but not incorporated—where residents bear all obligations without corresponding representation—I hold that full membership is required; the absence of incorporation is a contingent institutional failure, not a justification for exclusion.

  Two judgments, however, pull in opposite directions. A temporary worker who remains for fifteen years, building a life but retaining formal non-citizen status, strikes me as eventually entitled to membership; but a citizen abroad who continues to pay taxes and hold property strikes me as eventually not entitled, even though the latter maintains stronger formal ties and economic stakes. This suggests that being subject to law is doing more work than either nationality or economic stake, but I worry I am weighting jurisdictional presence ad hoc to save both verdicts.

  Is there a coherent principle—perhaps distinguishing jurisdictional subjection from affectedness, introducing a temporal threshold for incorporation, or separating membership from representation—that captures all five verdicts without collapse? Which of my judgments must be abandoned for the sake of coherence? In particular, can my differential treatment of the emigrant citizen and the long-term temporary worker be derived from a single account of what democratic membership is for, or does it depend on an unstated normative premise?

  Please lay out the candidate principles precisely, state which verdicts each saves and which it sacrifices, and apply them to at least one further case I have not considered—say, digital residents who participate economically and socially via remote presence without ever entering the physical territory. Be explicit about where your reasoning is most vulnerable and what specific counterexample or theoretical commitment would lead you to revise the principle you defend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is working on the "boundary problem" in democratic theory (who belongs to the *demos*).
      *   **Methodology:** Reflective equilibrium (testing intuitions against cases rather than deducing from a single axiom).
      *   **Five Established Verdicts:**
          1.  Long-term non-citizen residents $\rightarrow$ Full voting membership.
          2.  Permanent emigrant citizens (no longer subject to law) $\rightarrow$ Forfeit membership.
          3.  Severely affected outsiders (e.g., downstream water users) $\rightarrow$ Consultation/weight, *not* full membership.
          4.  Future generations $\rightarrow$ Proxy/constitutional representation, *not* current membership.
          5.  Unincorporated territories (governed but no representation) $\rightarrow$ Full membership required.
      *   **The Tension:** A 15-year temporary worker (non-citizen) vs. A permanent emigrant citizen (paying taxes/property). The user feels the worker should vote, but the emigrant should not. This relies heavily on "subjection to law" (jurisdictional presence) but feels potentially *ad hoc*.
      *   **The Task:**
          1.  Identify a coherent principle that captures the five verdicts without collapse.
          2.  State which verdicts each candidate principle saves/sacrifices.
          3.  Apply principles to a new case: *Digital Residents* (remote economic/social participation without physical presence).
          4.  Be explicit about vulnerabilities and potential revision triggers.
          5.  Address the specific tension between the emigrant citizen and the long-term temporary worker.

  2.  **Deconstruct the User's Intuitions:**
      *   *Core Driver:* "Subjection to Law" (All-Subjected Principle - ASP) seems dominant, but it needs nuance to handle the "affected outsiders" case (Verdict 3) and the "future generations" case (Verdict 4).
      *   *The Conflict:* The emigrant citizen pays taxes (economic stake) and holds nationality (formal tie), but loses the vote. The temporary worker has no nationality, maybe less tax stake, but gains the vote. The differentiator is *physical presence within the coercive jurisdiction*.
      *   *Implicit Normative Premise:* Democracy is primarily about governing *coercive relationships* among people sharing a common life/space, not just protecting interests or maintaining ethnic/national identity.

  3.  **Develop Candidate Principles:**

      *   *Candidate 1: The All-Subjected Principle (ASP) - Strict.*
          *   Definition: Everyone subject to the coercive laws of the state gets a vote.
          *   Pros: Handles Verdict 1 (residents), Verdict 2 (emigrants leave jurisdiction), Verdict 5 (territories are subject).
          *   Cons: Struggles with Verdict 3 (affected outsiders are subject to *consequences*, maybe not laws?). If "subjected" means "affected," it collapses into the All-Affected Principle (AAP). If "subjected" means "legal jurisdiction," it works well.
          *   Vulnerability: Does it explain *why* affected outsiders don't count? (Yes, if they aren't legally bound).

      *   *Candidate 2: The All-Affected Principle (AAP).*
          *   Definition: Everyone affected by decisions gets a vote.
          *   Pros: Handles Verdict 3 (maybe too well?), Verdict 4 (future gens).
          *   Cons: Fails Verdict 3 (User says outsiders shouldn't vote). Fails Verdict 2 (Emigrants are affected by homeland politics). Too expansive (boundary problem becomes infinite).
          *   Verdict: Must be rejected or heavily modified to fit user's intuitions.

      *   *Candidate 3: Coercive Co-Authorship (The "Common Life" Principle).*
          *   Definition: Membership belongs to those who participate in a shared scheme of social cooperation enforced by common coercion.
          *   Nuance: Requires *ongoing, reciprocal* subjection within a specific territory.
          *   Pros: Explains the Worker vs. Emigrant tension. Worker is in the cooperative scheme; Emigrant has opted out of the daily coercive reality. Explains Verdict 3 (outsiders aren't in the scheme). Explains Verdict 4 (future gens aren't present cooperators).
          *   Cons: Might struggle with Verdict 5 if the territory is "unincorporated" (need to argue they *are* part of the scheme despite legal labels).

  4.  **Select the Best Fit:**
      *   The user's intuitions align best with a refined **All-Subjected Principle (ASP)** grounded in **Coercive Co-Authorship**.
      *   *Key Distinction:* Subjection to *binding law* vs. Affected by *consequences*.
      *   *Key Mechanism:* Temporal threshold for "habitual residence" to distinguish tourists/transients from members.

  5.  **Address the Specific Tension (Worker vs. Emigrant):**
      *   Is it *ad hoc*? No, if the principle is "Democratic legitimacy arises from the need to justify coercive power over those who cannot escape it."
      *   Emigrant: Can escape (mostly). Tax/Property are voluntary/asset-based, not coercive subjection in the same way.
      *   Worker: Cannot escape daily coercion (police, zoning, labor laws) while present.
      *   Normative Premise: Democracy is a solution to the problem of legitimate coercion, not merely interest aggregation.

  6.  **Develop the New Case (Digital Residents):**
      *   *Scenario:* Someone lives abroad but works remotely for a company in the polity, pays income tax, uses digital infrastructure, but never enters physically.
      *   *Application:* Under ASP/Coercion, they are *not* subject to physical coercion (police, zoning). They are subject to tax law, but that's tied to income source, not residence.
      *   *Verdict:* Likely no vote, but perhaps stakeholder consultation (like Verdict 3).
      *   *Challenge:* If digital presence becomes indistinguishable from physical presence in terms of impact/subjection (e.g., digital ID, remote policing), the principle might shift.

  7.  **Drafting the Response:**
      *   *Structure:*
