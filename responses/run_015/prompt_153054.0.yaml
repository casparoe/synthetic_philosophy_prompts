      *   Apply to Digital Residents? Yes.
      *   Explicit about vulnerabilities? Yes.
      *   Address the Worker/Emigrant tension? Yes.

      *Let's write.*
answer: |-
  Your reflective equilibrium exercise reveals a strong commitment to a refined version of the **All-Subjected Principle (ASP)**, but one that is tempered by a **Coercive Co-Authorship** condition. Your intuitions reject the *All-Affected Principle* (which would grant voting rights to downstream water users and perhaps emigrants) and the *All-National Principle* (which would retain voting rights for emigrants and deny them to long-term residents).

  The tension you identify between the long-term temporary worker and the permanent emigrant citizen is not necessarily *ad hoc*. It rests on a specific normative premise: **Democratic membership is the remedy for unavoidable coercive subjection within a shared social space, not a reward for economic contribution or ethnic affinity.**

  Below, I outline three candidate principles, evaluate them against your five verdicts plus the tension case, apply the strongest candidate to the "Digital Resident" case, and identify the vulnerabilities.

  ### Candidate Principles

  #### 1. The Strict All-Subjected Principle (ASP)
  *   **Definition:** All persons currently subject to the binding coercive laws of a polity are members of the *demos*.
  *   **Mechanism:** Jurisdictional presence triggers membership.
  *   **Verdicts Saved:**
      *   **1 (Residents):** Saved (subject to law).
      *   **2 (Emigrants):** Saved (no longer subject to daily coercion).
      *   **5 (Territories):** Saved (subject to governance).
  *   **Verdicts Sacrificed/Strained:**
      *   **3 (Affected Outsiders):** Saved (not subject to binding law, only consequences).
      *   **4 (Future Gens):** Saved (not currently existent to be subjected).
      *   **The Tension:** Saves the differential treatment. The worker is subject to police, zoning, and labor law daily; the emigrant is not.
  *   **Critique:** It struggles to define the *temporal threshold*. A tourist is "subject to law" but intuitively shouldn't vote. It requires a "habitual residence" modifier to avoid absurdity.

  #### 2. The Stakeholder Principle
  *   **Definition:** All persons whose vital interests are permanently tied to the polity's flourishing are members.
  *   **Mechanism:** Economic and social entanglement triggers membership.
  *   **Verdicts Saved:**
      *   **1 (Residents):** Saved (life built there).
      *   **5 (Territories):** Saved.
  *   **Verdicts Sacrificed/Strained:**
      *   **2 (Emigrants):** **Sacrificed.** Under this principle, the emigrant paying taxes and holding property has a *stronger* stake than the temporary worker who might rent and send remittances abroad. This contradicts your intuition.
      *   **3 (Affected Outsiders):** **Sacrificed.** Downstream water users have vital interests at stake. This principle forces you to grant them membership, which you reject.
  *   **Critique:** This principle collapses the boundary problem by expanding the *demos* too widely (to include anyone affected economically or environmentally).

  #### 3. Coercive Co-Authorship (The "Shared Life" Principle)
  *   **Definition:** Democratic membership belongs to those who participate in a continuous scheme of social cooperation enforced by common coercion, where exit is not a viable immediate option.
  *   **Mechanism:** Combines *subjection* with *factual integration* over time.
  *   **Verdicts Saved:**
      *   **1, 2, 5:** Saved (matches ASP).
      *   **3 (Affected Outsiders):** Saved. They are affected by *externalities*, not participants in the *cooperative scheme*.
      *   **4 (Future Gens):** Saved. They cannot co-author; they require trusteeship (representation without membership).
      *   **The Tension:** **Saved.** The temporary worker (15 years) is factually integrated into the coercive scheme; exit is costly. The emigrant has exercised the exit option; their ties (tax/property) are asset-based, not cooperation-based.
  *   **Critique:** This is the most robust fit for your intuitions. It posits that democracy is about legitimizing power over those who must live together under the same rules.

  ### Analysis of the Tension: Worker vs. Emigrant
  You worry that weighting "jurisdictional presence" to save both verdicts is *ad hoc*. Under **Coercive Co-Authorship**, it is not.

  *   **Normative Premise:** The justification for democracy is to render legitimate the coercion required for social order.
  *   **The Worker:** Even with non-citizen status, after 15 years, they are enmeshed in the coercive order (traffic laws, criminal code, labor regulations, schooling). They cannot easily avoid the state's authority. Excluding them creates a caste system within the coercive sphere.
  *   **The Emigrant:** By leaving permanently, they have removed themselves from the daily coercive order. Paying taxes on foreign income or property is a *transactional* obligation, not a *subjective* one. They can sell the property; they cannot sell their physical presence while living there.
  *   **Conclusion:** The differential treatment is derived from the **asymmetry of exit**. The emigrant has exited the coercive community; the worker has not, despite the state's attempt to label them an outsider.

  ### Application: The Digital Resident Case
  **Case:** A person lives permanently abroad but works remotely for a firm in your polity, pays income tax to your polity, consumes digital media regulated by your polity, and interacts socially in your polity's digital spaces, but never physically enters the territory.

  **Application of Coercive Co-Authorship:**
  *   **Verdict:** **No Full Membership (Vote), but Weighted Consideration.**
  *   **Reasoning:**
      1.  **Coercion:** They are subject to *some* laws (tax, digital commerce), but not the *comprehensive* coercive order (zoning, police protection, physical infrastructure, criminal law enforcement). If they violate a law, the polity cannot easily detain or sanction them physically without international cooperation.
      2.  **Co-Authorship:** They do not share the "common life" of the physical territory. They do not breathe the air, use the roads, or rely on the local hospitals.
      3.  **Comparison:** They resemble the **Affected Outsider (Verdict 3)** more than the **Resident (Verdict 1)**. Their connection is functional and economic, not coercive-residential.
  *   **Implication:** They merit consultation on digital/tax policy (stakeholder status) but not a vote on general governance (membership status), as they do not bear the full burden of the state's physical coercion.

  ### Vulnerabilities and Revision Triggers

  I defend **Coercive Co-Authorship** as the principle that best unifies your verdicts. However, it has three specific vulnerabilities where your reasoning might need revision:

  **1. The "Border Control" Paradox (Who decides the boundary?)**
  *   **Vulnerability:** To apply Coercive Co-Authorship, you must first define who is "inside" the coercive sphere. But the *demos* is supposed to decide who enters. If the current *demos* excludes the 15-year worker to prevent them from voting, they are using an undemocratic boundary to define the democratic boundary.
  *   **Revision Trigger:** If you encounter a case where the state *creates* the "temporary" status specifically to prevent Coercive Co-Authorship (e.g., legally preventing residency beyond 14 years), your principle might demand that the *intent* of the law be scrutinized. If the exclusion is manipulative, the principle might require granting membership *earlier* than the factual threshold suggests to prevent democratic erosion.

  **2. The Digital/Physical Convergence**
  *   **Vulnerability:** My verdict on the Digital Resident assumes physical presence is necessary for "comprehensive coercion." If states increasingly enforce laws digitally (e.g., freezing assets, revoking digital IDs, policing speech globally), the distinction between physical and digital subjection blurs.
  *   **Revision Trigger:** If a Digital Resident becomes *more* subject to the polity's coercive power (via surveillance, asset seizure, digital blacklisting) than a physical resident (who can use cash or anonymity), the principle must shift. If digital subjection becomes total, digital residents must be granted membership, or the principle must admit that physical territory is no longer the relevant boundary for coercion.

  **3. The "Unincorporated Territory" Tension (Verdict 5)**
  *   **Vulnerability:** You argue unincorporated territories deserve full membership. However, under Coercive Co-Authorship, if the polity treats them as separate legal spheres (different laws apply), one could argue they are *not* part of the same coercive scheme.
  *   **Revision Trigger:** If the polity argues, "We govern them, but under a *different* constitution, so they are not co-authors of *our* laws," you must be prepared to argue that **subjection to *any* sovereign power without representation is the evil**, not just subjection to the *same* laws. This pushes you slightly toward an **All-Subjected-to-Sovereignty** principle rather than Co-Authorship of a specific legal code.

  ### Summary Recommendation
  Your intuitions are coherent under **Coercive Co-Authorship with a Habitual Residence Threshold**.
  *   **Abandon:** The idea that economic stake (taxes/property) confers membership.
  *   **Retain:** The distinction between *subjection to law* (membership) and *affected by consequences* (consultation).
  *   **Clarify:** The 15-year threshold is not arbitrary; it is the point where "temporary" becomes "habitual," making exit costly and subjection unavoidable.

  The differential treatment of the emigrant and the worker is not *ad hoc*; it is the logical consequence of viewing democracy as a system for legitimizing **coercion over a shared life**, rather than a system for protecting **investments or identity**.
