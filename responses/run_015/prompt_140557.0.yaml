answer: |-
  ### I. Restatement of Entitlement Theory in Mechanism Design Vocabulary

  Let $N$ be the set of agents, $X$ the set of feasible allocations, and $\Theta$ the type space. Let $h_t = (x_0, a_0, \dots, x_{t-1}, a_{t-1})$ denote the history of allocations and actions up to period $t$.

  **1. Justice in Holdings as Path-Dependent Implementation**
  A Social Choice Function (SCF) $f: \Theta \to X$ is typically defined over current types. Nozick's Entitlement Theory posits that the set of "just" allocations $J \subset X$ is not the image of a static SCF, but the support of a **dynamic mechanism** $\Gamma$ where legitimacy is path-dependent. An allocation $x_t$ is just if and only if it is the outcome of a sequence of moves admissible under $\Gamma$ starting from a just initial endowment $x_0$.

  **2. The Three Principles as Transition Rules**
  *   **Acquisition:** A mapping $\alpha: \text{Unowned Resources} \to X$ specifying the conditions under which an agent $i$ can move a resource from the null set to their holding $x_{i,0}$. In Nozick, this is constrained by the Lockean Proviso (see Residue).
  *   **Transfer:** A set of admissible actions $A_i(h_t)$ for each agent. An action $a_i \in A_i$ corresponds to a voluntary transfer $\tau_{ij}$. The transition function $x_{t+1} = g(x_t, a_t)$ defines the new holdings. "Voluntary" here maps to **Individual Rationality (IR)** and the absence of coercion (defined negatively as rights violations).
  *   **Rectification:** A correction mechanism triggered when the history $h_t$ contains a violation of Acquisition or Transfer rules. This is a discontinuous jump in the allocation rule, mapping an unjust history back to a counterfactual just history $h'_t$.

  **3. Rights as Side Constraints on the Action Space**
  In standard mechanism design, constraints define the feasible set $X$ (resource feasibility) or incentive compatibility (IC). Nozick treats rights as **hard constraints on the action space** $A_i$. Specifically, for any agent $i$, there exists a subset of actions $A_i^{forbidden} \subset A_i$ (e.g., force, fraud, theft) that are removed from the mechanism regardless of the welfare gains they might generate in the objective function. These are not parameters to be optimized; they define the game form itself.

  **4. Historical vs. End-State Principles**
  *   **End-State/Patterned:** An SCF $f(\theta)$ that targets a specific distributional property $P(x)$ (e.g., Gini coefficient, equality). The mechanism designer chooses $\Gamma$ to implement $f$ such that $P(f(\theta))$ holds.
  *   **Historical:** The mechanism designer specifies the rules of interaction (rights) but does not target a specific $x \in X$. The "objective function" is procedural: maximize the set of admissible actions subject to side constraints. Justice is a property of the **equilibrium path**, not the terminal node.

  **5. The Wilt Chamberlain Argument as Non-Closure**
  Let $X_P \subset X$ be the set of allocations satisfying a patterned principle $P$.
  Let $T(x)$ be the set of allocations reachable from $x$ via admissible voluntary transfers (the "Liberty" action space).
  Nozick's claim: For any $x \in X_P$, $T(x) \not\subseteq X_P$.
  That is, the set $X_P$ is **not closed** under the decentralized transfer operator.
  To maintain $x \in X_P$, the designer must either:
  1.  **Restrict the Action Space:** Remove transfers $\tau \in T(x)$ from $A_i$ (forbidding capitalist acts).
  2.  **Re-impose the Pattern:** Periodically intervene to reset $x_{t+1} \to x'_{t+1} \in X_P$ (redistribution), which constitutes a violation of the Transfer principle (coercion).

  ---

  ### II. Residue Report

  #### 1. Clean Translations
  *   **The Instability Result:** Your hypothesis is analytically sound. "Liberty upsets patterns" translates perfectly as a **failure of closure** in a dynamic system. A patterned set of holdings is not an invariant set under the flow of voluntary exchange. Maintaining invariance requires either shrinking the action space (prohibition) or external forcing (redistribution).
  *   **Rectification as Correction:** Viewing rectification as a mechanism that maps unjust histories to counterfactual just histories fits standard dynamic implementation with verification, provided the "unjust" moves are observable.

  #### 2. Distorted Translations
  *   **Voluntariness vs. Incentive Compatibility:** In your framework, a mechanism is IC if truth-telling is a dominant strategy or BNE. For Nozick, "voluntary" means "consistent with side constraints." An exchange can be IC (both parties gain) but unjust (one party sells themselves into slavery, or sells stolen goods). Your framework treats the *outcome* of the game as the object of evaluation; Nozick evaluates the *moves* themselves.
  *   **The Cost of Restrictions:** You hypothesize that your framework treats restrictions as "costless design choices." This is slightly imprecise but directionally correct. In mechanism design, constraints define the feasible set; we optimize *subject* to them. However, we typically assign shadow prices to constraints. If relaxing a constraint increases the objective (e.g., Efficiency), we note the trade-off. For Nozick, the shadow price of a right is **infinite**. You cannot trade a rights violation for aggregate welfare. Translating this into a Lagrangian creates a distortion: it implies the constraint *could* be binding or slack based on marginal conditions, whereas for Nozick it is categorically binding.

  #### 3. No Expression (The Residue)
  *   **Deontology vs. Consequentialism:** Your framework is inherently consequentialist. You design a mechanism to implement a Social Choice Function (an outcome). Nozick rejects SCFs in favor of **Game Forms**. He does not care which $x \in X$ results, only that the rules $\Gamma$ were respected. Standard implementation theory (Maskin, Moore) seeks to implement outcomes. There is no standard vocabulary for "implementing a process" where the outcome is irrelevant to justice.
  *   **The Moral Status of History:** In dynamic econ, history matters only insofar as it affects current feasibility or future incentives (state variables). For Nozick, history matters **intrinsically**. An allocation $x$ is different if reached via path $h_1$ vs $h_2$, even if current types and resources are identical. While you can model path-dependence ($x_t(h_{t-1})$), the *normative weight* assigned to $h_{t-1}$ has no counterpart. In your model, we care about history to predict behavior; in Nozick's, we care about history to assign moral status.

  #### 4. Testing Your Hypothesis
  **Is the reading right?**
  Yes, analytically. Nozick's argument is structurally identical to an **instability theorem** in dynamic market design. A patterned equilibrium is not robust to decentralized deviations.
  **What does it cost?**
  It converts a **deontological argument** into a **welfarist/constraint-cost argument**.
  *   **Nozick:** Restricting transfers is a *moral violation* (aggression).
  *   **Econ:** Restricting transfers is a *deadweight loss* or a *constraint cost*.
  **What gets lost?**
  The **inviolability of the person**. In your framework, if the welfare gain from restricting a transfer is high enough (e.g., preventing a negative externality), the restriction is justified. For Nozick, the restriction is justified *only* if the transfer violates a side constraint (rights). By modeling this as "maintaining a pattern," you implicitly treat the pattern as the social goal. But Nozick's point is that there *is* no social goal other than respecting the process. Your framework asks "What is the cost of maintaining the pattern?" Nozick asks "By what right do you maintain the pattern?" The former is an efficiency question; the latter is a legitimacy question.

  ---

  ### III. Where the Residue Report is Wrong (and what would change my mind)

  My residue report claims that "intrinsic historical value" and "game forms over outcomes" have no expression in your toolkit. I am likely wrong about the **Game Form** distinction, and partially wrong about **Initial Endowments**.

  **1. Implementation in Game Forms (The Genuine Home)**
  Your toolkit distinguishes between **Outcome Functions** (Planner chooses $x$) and **Game Forms** (Planner chooses rules $G$, agents play Nash, outcome $x(G)$ emerges).
  *   **Correction:** Nozick's theory is best modeled not as an SCF, but as a specific **Game Form** where the action space is defined by property rights.
  *   **Why this matters:** In Implementation Theory (Hurwicz, Maskin), we ask: "Can we design a game form $G$ such that the Nash Equilibria correspond to the SCF $f(\theta)$?" Nozick flips this. He says: "Design the Game Form $G_{liberty}$ (rights + voluntary exchange). The set of Equilibria $E(G_{liberty})$ *is* the set of Just Outcomes."
  *   **The Shift:** If you treat the *Game Form itself* as the object of normative evaluation, rather than the implemented SCF, you capture Nozick's proceduralism. The "instability" of patterns is not a bug; it is the definition of the equilibrium set of the Liberty Game Form.

  **2. The Lockean Proviso as a Pareto Constraint**
  I claimed the Acquisition principle has no economic expression. This is incorrect.
  *   **Correction:** Nozick's Lockean Proviso ("appropriation is just if no one is worse off than in the baseline") is a **Pareto Dominance** condition relative to the state of nature.
  *   **The Toolkit:** This translates cleanly into **Participation Constraints** or **Individual Rationality** relative to a specific threat point (the commons). If your model includes a "state of nature" baseline utility $u_i^{nature}$, then Just Acquisition is simply an allocation $x$ such that $u_i(x) \geq u_i^{nature} \forall i$.
  *   **Why this changes the report:** It shows Nozick is not entirely anti-consequentialist. He accepts a welfarist constraint (Pareto) at the boundary of the system (acquisition), even if he rejects it for the interior (transfers).

  **3. Renegotiation-Proofness and Entitlement**
  You asked if **renegotiation-proofness** could house Nozick's view.
  *   **The Twist:** Usually, we want mechanisms to be renegotiation-proof to *maintain* an outcome. Nozick wants the system to be **open to renegotiation** (transfers).
  *   **The Correction:** The concept that fits is **Robustness to Coalitional Deviations**. Nozick's entitlement theory asserts that the "Liberty Game Form" is the only one that is stable against coalitional deviations (groups of people wanting to trade). A patterned principle is not **Coalitionally Incentive Compatible**. Agents will always form a coalition (Wilt + Fans) to deviate from the pattern.
  *   **Conclusion:** Your framework *does* have a home for this: it is the study of **Coalitional Implementation** and the **Core**. Nozick is effectively arguing that the Core of the economy under "Liberty Rules" is non-empty and stable, whereas the Core under "Patterned Rules" is empty (or requires external enforcement to prevent blocking coalitions).

  **Final Verdict on Your Hypothesis:**
  Your hypothesis that "liberty upsets patterns" is an instability result is **correct**. However, your inference that this makes Nozick's argument a "special case" of standard design is **incorrect** because it inverts the normative priority.
  *   **Econ:** Stability is a desideratum for achieving a Social Goal.
  *   **Nozick:** Stability (under Liberty rules) *constitutes* the Social Goal.

  To fully capture Nozick without distortion, you must move from **Mechanism Design** (optimizing outcomes subject to constraints) to **Institutional Design** (evaluating the normative status of the game form itself). If you treat the "rights structure" as the primitive rather than the "social welfare function," the residue disappears. The cost is abandoning the SCF as the central object of study.
