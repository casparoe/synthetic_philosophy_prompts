answer: |-
  No worries about the typo—happens to the best of us. Here is the exam package you requested, kept sharp and ready for your grad seminar.

  ### Exam Question (90 Minutes)

  **Question 1:**
  Clément Marot's concept of *le ton beau* suggests that a translator must preserve the elegant formal architecture of the source text (meter, rhyme, stanzaic shape) even when this necessitates semantic drift. Consider a hypothetical translation of Ovid's *Metamorphoses* (the Daphne episode). The Latin text relies on a metaphysical ambiguity between substance and accident: Daphne is physically changing, yet her essence persists in the bark and leaves.

  To maintain a strict rhyme royal and decasyllabic couplet (adhering to *le ton beau*), the translator renders the crucial philosophical term as "wood-being," a generic phrase that preserves the rhythm but blurs the metaphysical distinction. Alternatively, the translator could break the form to preserve the precise philosophical vocabulary.

  Write an essay arguing whether *le ton beau* is merely an aesthetic preference or if preserving form constitutes a fidelity to the text's "mode of being" (its performative or event-like existence) rather than just its propositional content. Weigh the cost of semantic drift against the loss of structural integrity. What, ultimately, is translation for?

  ***

  ### Model Answer (Approx. 600 words)

  To argue that Marot's *le ton beau* is merely aesthetic is to misunderstand the ontology of poetry. If we view a poem solely as a vessel for propositional content, then form is decorative, and semantic drift is a failure. However, if we accept that a poem's meaning is inextricably bound to its rhythm and sonic architecture, then preserving form is a fidelity to the text's mode of being. In the case of Ovid's Daphne, the transformation is not just a narrative event; it is a linguistic metamorphosis.

  When the translator chooses "wood-being" to satisfy the decasyllabic couplet, they incur a semantic loss. The precise philosophical distinction between substance and accident is blurred. A B-level analysis stops here, lamenting the loss of accuracy. But an A-level analysis asks what is gained. Ovid's Latin is performative; the meter enacts the inevitability of the change. By breaking the form to save the vocabulary, the translator stabilizes the text, freezing the metamorphosis into a report. By keeping the rhyme royal, the translator preserves the *event* of the transformation. The constraint forces the language itself to struggle, mirroring Daphne's struggle.

  Therefore, *le ton beau* is not about making the translation "pretty." It is about respecting the conditions under which the original meaning arises. Meaning in poetry is not a nugget of data wrapped in verse; it is the friction between sound and sense. If the translator prioritizes the philosophical vocabulary at the expense of the meter, they have translated the *idea* of the poem but killed the poem itself. They have preserved the corpse but lost the ghost.

  However, this defense has limits. If the semantic drift is so severe that the text becomes unintelligible or contradicts its own logic, the fidelity to form becomes a fetish. In the Daphne case, "wood-being" is vague, but it is not contradictory. It maintains the ambiguity of presence-in-absence that defines the myth. Here, the formal fidelity supports the thematic core. The rhythm insists on continuity even as the words describe change.

  Ultimately, translation is not about transporting information from point A to point B. It is about recreating the experience of the text in a new linguistic environment. If the original text operates as a musical and structural entity, then a translation that flattens this structure into prose-like clarity is unfaithful to the source's reality. Marot's insistence on form recognizes that the "how" is part of the "what." To translate is to negotiate a loss, but the loss of form is the death of the poem's body. We must accept semantic drift not as a failure, but as the cost of keeping the text alive as an event rather than a statement. The translator's duty is to the work's existence, not just its dictionary definitions.

  ***

  ### Marking Scheme (Out of 20)

  **Total:** 20 Marks
  **Passing Threshold:** 10 Marks

  | Point | Description | Marks | Common Student Mistake |
  | :--- | :--- | :--- | :--- |
  | **1. Concept Definition** | Correctly defines *le ton beau* as structural fidelity rather than just "pretty writing." | 4 | Conflates Marot with naive literalism or word-for-word translation. |
  | **2. Case Application** | Specifically engages with the Ovid/Daphne "wood-being" example provided in the prompt. | 4 | Ignores the hypothetical case and speaks only in abstract generalities. |
  | **3. Ontological Argument** | Argues that form constitutes the text's "mode of being" (A answer) vs. form as decoration (B answer). | 4 | Treats form as purely decorative packaging separable from content. |
  | **4. Critical Weighing** | Acknowledges the cost of semantic drift rather than claiming formal fidelity is always perfect. | 4 | Makes an absolutist claim that form *never* matters or *always* matters without nuance. |
  | **5. Teleological Conclusion** | Concludes with a concrete statement on what translation is for (experience vs. information). | 4 | Ends with a vague platitude about "bridging cultures" without referencing the argument. |

  **Specific Penalties & Notes for Graders:**

  *   **The "A" vs. "B" Distinction:** An **A answer** must argue that formal preservation is fidelity to the *conditions* of meaning (Point 3). A **B answer** will treat form as secondary to semantic accuracy, arguing that "wood-being" is simply a mistake because it loses data.
  *   **Citation Penalty:** Do not reward name-dropping. If a student invokes Benjamin, Steiner, or Venuti without integrating them into the specific Marot/Ovid argument, cap Point 5 at 2 marks. This is not a theory survey.
  *   **Biography Penalty:** If the student spends more than 50 words on Marot's life or history rather than the theory, deduct 2 marks total from the essay.
  *   **Misreading Marot:** If the student argues Marot wanted literal word-for-word translation (confusing *le ton beau* with *verbum de verbo*), cap Point 1 at 1 mark.
  *   **Length:** If the answer is significantly under 400 words, it likely fails to develop Point 3 and 5 adequately.
