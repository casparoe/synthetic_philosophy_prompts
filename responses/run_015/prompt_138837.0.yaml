answer: |-
  You have put your finger on the exact nerve of the debate. Your suspicion is correct: **within the constraints you have laid out, no such case exists.**

  You are asking for a "local Mach effect" that is large enough to be observable in a laboratory, distinct from ordinary gravity, and which yields divergent predictions between a viable substantivalist theory and a viable relationist theory. Standard physics does not permit this.

  Here is the detailed breakdown of why the case cannot be constructed, using the only physical mechanism that comes close (frame-dragging), and why it fails your constraints.

  ### The Best Candidate: The Rotating Massive Shell

  The only known physical mechanism by which local matter influences local inertial frames is the **Thirring-Lense effect** (frame-dragging) in General Relativity. This is the mathematical realization of Mach's idea within our best theory of gravity.

  **The Setup:**
  Imagine a spherical shell of mass $M$ and radius $R$. Inside the shell, at the exact center, sits your bucket of water (or a gyroscope). The shell is spun up to angular velocity $\omega$. The distant stars remain fixed.

  **The Predictions:**

  1.  **Newtonian Substantivalist:**
      *   **Reasoning:** Space is absolute. The shell rotates relative to absolute space. The interior of a spherical shell is gravitationally neutral (Shell Theorem). The rotation of the shell exerts no force on the interior.
      *   **Prediction:** The water surface remains **flat**. The local inertial frame is defined by the distant stars/absolute space, not the shell.

  2.  **Machian Relationist (Idealized):**
      *   **Reasoning:** Inertia is generated by the relative motion of all matter. If the shell is massive enough, it contributes significantly to the "fixed" frame. If the shell rotates, it drags the inertial frame inside it.
      *   **Prediction:** The water surface becomes **curved** (concave), as if the bucket were rotating, even though it is stationary relative to the distant stars.

  **Why This Fails Your Constraints:**

  *   **Constraint (i) & (v) [Lab-sized & Qualitative]:**
      In General Relativity (which incorporates the only viable version of Mach's principle), the magnitude of this dragging is proportional to $GM/rc^2$. For the effect to be *observable* (i.e., to curve the water noticeably rather than producing a precession of $10^{-9}$ arcseconds per year), the shell must be incredibly dense.
      To get "full dragging" (where the interior frame rotates *with* the shell, making the water curve significantly), the mass $M$ must be comparable to the mass of the visible universe compressed into the radius $R$. For a laboratory-sized shell ($R \approx 1$ meter), the required mass would exceed the Schwarzschild limit; the shell would collapse into a black hole before it could spin.
      For any physically realizable laboratory mass (lead, tungsten, etc.), the GR prediction (Substantivalist) and the Newtonian prediction (Substantivalist) are observationally identical: **Flat**. The Machian effect is present in GR but is too small to measure locally.

  *   **Constraint (vi) [Verdicts from Theories]:**
      If you insist on a Relationist theory that predicts a *large* curvature for a laboratory mass (a "Strong Mach" theory), you are invoking a theory that is empirically falsified. Experiments like *Gravity Probe B* and lunar laser ranging confirm the GR prediction (tiny dragging determined by the whole universe's boundary conditions), not the Strong Mach prediction (local mass dominance).
      If you use a *viable* Relationist (one who accepts GR's metric field as the codification of relations), they agree with the Substantivalist (GR realist) that the effect is tiny. They disagree only on what the metric field *is* (ontology), not on the water's shape (observation).

  *   **Constraint (iv) [Gravitational Effects]:**
      Even if we could construct the massive shell, distinguishing the inertial effect from gravitational tidal forces is non-trivial. At the exact center, gravitational force is zero, but tidal forces (spacetime curvature) are not. However, tidal forces stretch the water along the axis of rotation, whereas centrifugal forces push it outward equatorially. In principle, these are distinguishable. But again, for any lab-sized mass, both effects are vanishingly small.

  ### The Single Feature Doing the Work

  The feature that would be required to make the predictions diverge observably is **Inertial Induction Coupling Strength**.

  *   **Substantivalist (Newton/GR):** Coupling to local matter is zero (Newton) or extremely weak/mediated by boundary conditions (GR). Inertia is primarily determined by the global structure of spacetime or distant matter.
  *   **Relationist (Strong Mach):** Coupling to local matter is strong. Local mass distribution directly dictates local inertia.

  **If that feature is removed:**
  If you reduce the Coupling Strength to match reality (as measured by *Gravity Probe B*), the Relationist prediction converges with the Substantivalist prediction. The water stays flat for all practical laboratory purposes. The disagreement vanishes from the realm of observation and retreats into the realm of interpretation.

  ### The Losing Side's Best Reply

  You asked for the losing side's reply. In this case, the "Relationist" who insists on an observable local difference must say:

  > "This is indeed Newton's bucket with the star-sphere trick scaled down. I am demanding that the local shell *act* like the fixed stars. But since the fixed stars contain $10^{50}$ times more mass than my shell, I cannot reproduce the effect locally. Therefore, I cannot give you a local experiment. I can only tell you that *if* you were to remove the distant stars, the water would behave differently. Since you cannot remove the stars, you cannot test my claim locally."

  This admission confirms your suspicion. The Relationist cannot satisfy Constraint (i) (local manipulation) while maintaining an observable divergence.

  ### Verdict: Empirical or Verbal?

  You asked whether this dispute is empirical or merely verbal. Based on the failure to construct the case you requested:

  1.  **Locally Empirical?** **No.** Within our universe, with the distant matter fixed, Substantivalism (interpreted as GR metric realism) and Relationism (interpreted as Machian GR) make identical predictions for all local experiments. The "force" of inertia looks exactly the same whether it comes from absolute space or relations to distant matter, because the distant matter is always there.
  2.  **Modally Empirical?** **Yes.** The disagreement is about **counterfactuals**.
      *   *Question:* "If the universe were empty except for the bucket, and the bucket spun, would the water curve?"
      *   *Substantivalist:* "Yes. Space exists without matter."
      *   *Relationist:* "No. Inertia requires relations to other matter."
      *   *Status:* This is an empirical question in principle, but it is **experimentally inaccessible**. We cannot empty the universe.

  ### Conclusion

  You are not missing something standard. You have identified the precise reason why the debate has persisted for 300 years without resolution.

  *   If you demand **local observability** (your constraints), the theories **converge** (both say "flat water" for lab masses).
  *   If you demand **divergent predictions**, you must invoke **global manipulations** (removing the stars) which are impossible.

  Therefore, regarding the specific question of *local laboratory physics*, the dispute is **observationally empty**. It is a dispute about ontology (what exists) and modality (what is possible), not a dispute about local dynamics. As an experimentalist, you are justified in treating it as verbal for the purposes of laboratory work. The "substance" of space does not cash out in a local checkbook that differs from the "relations" of space, because the cosmic background is always present to balance the books.
