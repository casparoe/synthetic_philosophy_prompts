answer: |-
  1. The readings

  1. **The Epistemic Claim:** The rule exists because someone possessed specific information justifying it. This presupposes a rational design process where rules are only instantiated for known reasons and that knowledge transfer failed. It denies the possibility of superstitious accretion. A person could coherently deny this by pointing to known historical errors or vendor mistakes. The process presupposed is one of deliberate engineering, not accidental accumulation. It assumes the original author was competent and the context was preserved, merely misplaced.

  2. **The Evolutionary Claim:** The rule persists because it confers a survival advantage, regardless of whether anyone understands the mechanism. This presupposes an environment where ineffective rules are systematically removed over time via feedback loops like incident reviews or cost audits. It denies bureaucratic inertia. A person could deny this by showing a history of rule accumulation without pruning. The process presupposed is one of natural selection, not institutional stagnation. It assumes the system actively kills useless code.

  3. **The Procedural Claim:** The default position is stability; the burden of proof rests on the agent proposing change. This presupposes that the status quo has a privileged normative standing simply by virtue of existing. It denies that innovation is the default duty of engineering. A person could deny this by arguing technical debt requires aggressive removal. The process presupposed is one of governance where change is the exception, not the rule. It assumes stability is inherently valuable.

  4. **The Risk Claim:** The downside risk of removal (catastrophic fraud) outweighs the upside gain of deletion (efficiency). This presupposes an asymmetric loss function where false negatives are costlier than false positives. It denies that opportunity cost is the primary driver. A person could deny this by quantifying the latency cost. The process presupposed is one of risk management where avoidance of ruin trumps optimization. It assumes the cost of error is non-linear.

  5. **The Political Claim:** Stakeholders have a vested interest in stability that grants them veto power over unilateral changes. This presupposes the system is a shared resource governed by social contract. It denies the engineer's sole authority over technical implementation. A person could deny this by citing their job description. The process presupposed is one of collective ownership rather than individual meritocracy. It assumes consent is required for modification.

  2. Verdicts

  | Reading | Verdict | Notes |
  | :--- | :--- | :--- |
  | **Epistemic** | Defensible but contingent | Collapses into Evolutionary if knowledge is truly lost. Requires evidence of competent origin. |
  | **Evolutionary** | False | Our history shows rule accumulation, not pruning. Survival proves inertia, not utility. |
  | **Procedural** | Platitude | Standard change management. True by definition of most review boards. |
  | **Risk** | Substantive/Contested | Depends on fraud cost estimates. The strongest reading available to your colleague. |
  | **Political** | Contested | Depends on org charter. Valid in consensus cultures, false in owner-operator models. |

  The Epistemic and Evolutionary readings often collapse; if no one knows the reason, the defender must rely on survival alone. The Procedural reading is trivially true but doesn't justify the rule, only the process. The Political reading is valid but shifts the argument to authority rather than engineering. The Risk Claim is the strongest because it justifies delay without needing knowledge, relying solely on cost asymmetry. It forces you to prove safety rather than them proving necessity.

  3. Two cases

  **The Address Rule:** Under the Epistemic reading, you must search archives or interview veterans; success is finding the document. Under the Evolutionary reading, you must keep the rule forever; success is impossible without a pruning mechanism. Under the Procedural reading, you must produce data proving safety; success is a signed risk acceptance. Under the Risk reading, you must model fraud costs versus latency costs; success is showing efficiency gains outweigh potential losses. Under the Political reading, you must gain team consensus; success is a vote.

  **The Escalator Convention:** Consider the norm of standing on the right, walking on the left. The Epistemic reading fails; there is no functional reason, only arbitrary agreement. The Evolutionary reading fails; there is no selection pressure, only social mimicry. The Political reading succeeds; changing it unilaterally causes collision and anger because others rely on the coordination. Here the maxim yields the right result (don't change it) but for the wrong reason (coordination vs. function). The Risk reading also works but misidentifies the risk as physical safety rather than social friction. The maxim misfires by implying functional necessity where there is only coordination. It treats a convention as a fence, obscuring the fact that the fence is imaginary.

  4. My distinctions

  (a) **The Three Whys:** The maxim conflates the reason for origin, the reason for retention, and the reason deletion matters. A rule might be born of error (origin), kept due to inertia (retention), yet dangerous to delete (deletion impact). The maxim assumes retention implies valid origin. This is a constraint the maxim needs. Without separating these, you cannot distinguish a vital safeguard from a zombie process. You must evaluate the deletion impact independently of the origin story.

  (b) **The Retention Condition:** The rule's existence is evidence of usefulness only if the environment deletes useless rules. Yours does not. This is not implied by the weak readings. The Epistemic claim doesn't require pruning, only competent origin. The Evolutionary claim absolutely requires it. Since your colleague likely relies on the Evolutionary intuition without the mechanism, this distinction is fatal to their argument. It must be added explicitly: "Survival is signal only if the system prunes noise."

  5. What the maxim leaves open

  The maxim supplies no stopping rule for the investigation. How long must you search for the "why" before giving up? A week? A quarter? It offers no standard of evidence for having found the why. Is a verbal nod from a veteran sufficient, or do you need a commit message? It assigns no cost bearer for the inquiry. Who pays for the engineering hours spent digging through history, or the latency costs incurred while waiting? It sets no limit on its own scope. Does it apply to the maxim itself? The practice of deferring to inherited practice is itself an inherited practice. If we obey the maxim, we cannot delete the maxim, even if it is useless. To function as a decision rule rather than a mood, it needs a budget for inquiry and a sunset clause. You must define "reasonable effort" to find the why, and a threshold for "acceptable risk" to proceed without it. Without these, it is merely a veto token disguised as wisdom.
