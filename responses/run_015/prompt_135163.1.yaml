  **DEPARTMENT OF NOMINAL CLASSIFICATION (DNC)**
  **IMPORT REGULATION MANUAL § 404.C: COMPOUND DESIGNATIONS**

  **101. SEPARATION OF SUBSTANCE AND ATTRIBUTE**
  Pursuant to the Nominal Accuracy Act, all imported goods must be declared according to their fixed designations. Importers are advised that a noun designating form (e.g., "Horse") and an adjective designating color (e.g., "White") constitute seperate^1 taxable entities. The declaration "Horse" seeks only the shape. The declaration "White" seeks only the color. Therefore, the declaration "White Horse" seeks both. Because the compound is not identical to the component, a "White Horse" is not classified as a "Horse" for tariff purposes. Importers attempting to enter a white equine under Code H-001 (Horse) will be cited for undeclared coloration.

  **102. COMPOSITE ATTRIBUTES**
  Animals exhibiting multiple colors (e.g., dappled, spotted, or pinto) require multiple color permits per unit of shape. A dappled grey horse requires one (1) Form H-001 (Horseness) and no fewer than three (3) Form C-55 (Grey/White Variance) permits. Failure to declare the specific quantity of whiteness contained within the shape will result in seizure of the attribute, leaving the importer with a colorless form of indeterminate viability.

  **103. LOGICAL RELATIONS**
  The statement "This is not that" is not an empirical error but a logical boundary. If an importer requests a horse, yellow horses and black horses are admissible. If an importer requests a white horse, yellow horses are inadmissible. Since the admissible sets differ, the categories are distinct. Do not argue that the animal is physically present; argue only that the name matches the permit.

  | **SIDEBAR: COMMON MISCLASSIFICATIONS** |
  | :--- |
  | **Declared:** "Hard Stone" <br> **Required:** "Hardness" Permit + "Stone" Permit. |
  | **Declared:** "Baby Chicken" <br> **Required:** "Chicken" Permit. ("Baby" is inherent to the chick stage, but "White Chicken" requires extra forms). |
  | **Declared:** "Long Sword" <br> **Required:** "Length" Permit + "Weapon" Permit. |
  | **Note:** If the sword is shortened during transit, the "Length" permit is void. |

  **104. APPEALS PROCESS**
  Appeals regarding misclassified greys must be filed on Form 27-B within thirty days. The burden of proof lies with the importer to demonstrate that the whiteness was not imported separately from the horseness. Note that sensory perception is not admissible evidence; only the linguistic designation on the manifest governs classification.

  **FAQ: TRANSIT MUTABILITY**

  **Q: What do I do if my horse changes color during transit?**
  **A:** If a white horse becomes dirty (grey) or dyed (blue) en route, the original Color Permit is invalidated. The importer must file an Amendment of Attribute upon arrival. If the horse is washed and returns to white, a re-inspection fee applies. If the horse ages and turns grey naturally, this is considered a transformation of substance, requiring a new import license for "Aged Horse" and "Grey Color." Do not attempt to pass a grey horse through the White Horse lane. The DNC sensors detect conceptual discrepancies, not just pigment.

  **Q: Can I import the whiteness separately?**
  **A:** Yes, but it must be applied to a declared shape within 24 hours of docking. Unattached whiteness is classified as hazardous particulate.

  ***

  ^1 *See Equine Substances Ltd. v. DNC, 442 F.3d 119 (1998), wherein the Court upheld that equine-substance and equine-appearance are legally distinct import streams. The ruling established that paying the tariff on "Horse" does not cover the tariff on "White," as the concept of whiteness exists independently of the animal.*

  ^1 typo noted: "seperate" in section 101.
