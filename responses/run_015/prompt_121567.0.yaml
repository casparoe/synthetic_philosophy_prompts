answer: |-
  **Unpublished Brainstorming Pass**

  **(a) Distinct ways an indicator stops tracking:**
  1.  **Noise:** Random error increases; signal-to-noise ratio drops.
  2.  **Bias:** Systematic drift away from the true value (e.g., inflation).
  3.  **Decoupling:** The measure moves while the underlying construct remains static.
  4.  **Effort Diversion:** Resources shift from unmeasured priorities to the measured one.
  5.  **Threshold Gaming:** Focus exclusively on cases near the target line.
  6.  **Data Manipulation:** Changing the record without changing the service.
  7.  **Selection (Creaming/Parking):** Changing who enters the count to improve averages.
  8.  **Reclassification:** Changing definitions to move cases in or out.

  **(b) Sorting by mechanism:**
  *   **Changing what it does:** Effort Diversion, Threshold Gaming.
  *   **Changing what it records:** Data Manipulation, Reclassification.
  *   **Changing which cases enter:** Selection (Creaming/Parking).
  *   *(Note: Noise and Bias often result from the above, or external shocks.)*

  **(c) Detectable by small review team pre-commitment:**
  *   **Detectable:** Noise (via prior distributions), Bias (via audit trails), Selection (via enrollment profiles vs. population), Data Integrity (via system logs).
  *   **Hard to Detect:** Effort Diversion (requires holistic observation), Decoupling (requires causal validation), Collusion (requires whistleblowing).
  *   **Verdict:** We can detect structural vulnerabilities and data integrity risks. We cannot fully detect behavioural adaptation until incentives are live.

  ***

  **PROCEDURE FOR METRIC VALIDATION AND PAYMENT AUTHORISATION**

  **To:** Performance and Payment Team
  **From:** Lead, Performance and Payment
  **Subject:** Pre-Commitment Metric Stress-Testing Protocol

  **1. The Constitutive Question**
  A disagreement exists regarding metrics where hitting the number is partly constitutive of the good (e.g., waiting times) versus evidential (e.g., wellbeing). **Verdict:** The distinction is real regarding *validity*, but irrelevant regarding *vulnerability*. A waiting time target can be gamed by stopping the clock without treating the patient. Therefore, constitutive metrics proceed through this procedure but bypass Step 2 (Correlation) and focus heavily on Step 4 (Record Integrity). Do not assume constitutive metrics are immune to Goodhart's Law; they are merely immune to claims that the measure is the wrong *concept*. They remain vulnerable to being the wrong *incentive*.

  **2. Blind Spots and Scope**
  This procedure operationalises **Campbell's Law** (quantitative indicators distort the processes they monitor) and **Goodhart's Law** (when a measure becomes a target, it ceases to be a good measure). It protects against specification gaming and proxy degradation.
  **It does not protect against:**
  *   Macroeconomic shocks rendering all employment targets unachievable.
  *   Collusion between providers and participants to defraud the record.
  *   Metrics where the 'true value' is fundamentally unknowable (e.g., 'happiness').
  *   Risks introduced by the anti-gaming monitors themselves (see Step 5).

  **3. The Validation Protocol**

  | Step | Question | Sufficient Answer | Documents / Evidence | Stop Rule | Decision Authority |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Construct & Baseline** | What exactly is being counted, and do we have a prior distribution? | Clear definition + prior year mean/variance. If no baseline exists, a pilot sample must be run. | Contract specs; Prior year data; Pilot report. | **Kill** if construct is undefined internally (e.g., 'meaningful work' without criteria). | Lead Analyst |
  | **2. Correlation & Range** | Does the proxy track the outcome across the *whole* range, specifically at the payment threshold? | Correlation holds at the top decile. If correlation breaks at the target threshold, the incentive will decouple. | Regression analysis of prior data; Scatter plots of metric vs. outcome. | **Redesign** if correlation degrades specifically at the payment threshold. | Senior Statistician |
  | **3. Selection & Flow** | Can providers alter who enters the count via referral, exclusion, or dropout? | Enrollment profile matches regional unemployment demographics. Dropout rates are stable across providers. | Enrollment logs; Dropout rates; Demographic comparisons. | **Cap Payment** if selection risk is high (e.g., limit outcome fee to 25% rather than 45%). | Finance Director |
  | **4. Record Integrity** | Can the record be altered without changing the service (data gaming)? | Audit trail shows no manual overrides. Data entry timestamps match service delivery logs. | Audit files; System logs; Case file sampling. | **Kill** if data can be retrospectively edited without flagging. | Head of Audit |
  | **5. Counter-Measures** | How do we monitor gaming without making the monitor a target? | Monitors are randomised, unannounced, or treated as audit flags rather than performance targets. | Audit plan; Risk register. | **Escalate** if monitors are fixed targets (infinite regress risk). | Board Subcommittee |

  **4. Application to Candidate Metrics**

  **(a) Payment on share recorded in paid work for 13 of 26 weeks post-exit.**
  *   **Step 1:** Construct is clear. Baseline exists. **Pass.**
  *   **Step 2:** Correlation degrades at the top. Providers can secure short-term jobs (14 weeks) to hit the metric without achieving sustained employment (52 weeks). The proxy tracks entry, not sustainability. **Warning.**
  *   **Step 3:** High selection risk. Providers may 'park' hard-to-help participants to focus on job-ready candidates to hit the 13-week threshold. **Fail.**
  *   **Verdict:** **Survive with Cap.** Do not increase weight to 45%. Keep at 25%. Introduce a secondary metric for 52-week retention to counteract short-termism.
  *   **Rationale:** The metric incentivises churn, not stability.

  **(b) Payment on 90% of initial assessments within 5 working days.**
  *   **Step 1:** Constitutive metric. Definition clear. **Pass.**
  *   **Step 2:** N/A (Constitutive).
  *   **Step 3:** Low selection risk (assessments are mandatory for all referrals). **Pass.**
  *   **Step 4:** High record integrity risk. Providers can log an assessment date without conducting the meeting, or conduct a trivial 'assessment' to stop the clock. **Warning.**
  *   **Step 5:** Requires random file audits to verify assessment quality, not just date. **Pass.**
  *   **Verdict:** **Survive with Audit.** Payment contingent on passing random quality audits of 5% of cases.
  *   **Rationale:** Speed is useless without quality. The audit prevents the 'empty box-ticking' gaming scenario.

  **(c) Payment on improvement in participant-reported wellbeing score at exit.**
  *   **Step 1:** Construct undefined internally. We do not agree on what 'confidence' entails. **Fail.**
  *   **Step 2:** Data collected by providers themselves. High risk of coaching participants to select higher scores. **Fail.**
  *   **Step 3:** High dropout risk. Participants feeling worse may leave before exit survey, inflating average scores of leavers. **Fail.**
  *   **Verdict:** **Kill.** Do not attach payment to this metric.
  *   **Rationale:** This is a high-risk proxy vulnerable to both record degradation and selection bias.

  **Finance Director Argument (for Metric C):**
  "We are proposing to tie public funds to a self-reported score collected by the service provider themselves. We have no baseline, no agreed definition of 'confidence', and no independent verification. History shows that when payment attaches to subjective surveys, providers coach participants to answer favourably. We would be paying for improved *records* of wellbeing, not improved *lives*. If we cannot measure it independently, we cannot pay for it. I recommend removing this from the outcome fee entirely to avoid seven-figure remediation costs later."

  **5. Epistemic Notes & Confidence**

  *   **Step 1 (Construct):** **High Confidence.** If we cannot define it, we cannot measure it. *Change of mind:* Only if an external body imposes a statutory definition.
  *   **Step 2 (Correlation):** **Medium Confidence.** Relies on historical data assuming future behaviour mirrors the past. *Misfire Risk:* Will be too harsh on innovative metrics where no prior data exists. *Test:* Run a shadow pilot before full contract rollout.
  *   **Step 3 (Selection):** **High Confidence.** Economic incentives reliably drive selection behaviour. *Contested Reading:* Assumes providers are rational actors maximising revenue. If providers are mission-driven despite financial loss, this step is overly cynical. *Test:* Compare provider behaviour in non-incentivised regions.
  *   **Step 4 (Record Integrity):** **High Confidence.** Audit trails are factual. *Blind Spot:* Cannot detect sophisticated collusion where the record matches the (gamed) service perfectly.
  *   **Step 5 (Counter-Measures):** **Medium Confidence.** Assumes audit capacity exists. *Risk:* If audits become routine, they become gamable. *Mitigation:* Audit protocols must remain confidential and rotate.

  **Procedural Vulnerability:**
  This procedure leans heavily on the assumption that providers respond to financial incentives more strongly than professional norms. If your providers are predominantly charitable trusts with strong ethical codes, Steps 3 and 4 may be overly conservative, potentially stifling innovation. However, given the £40m spend and previous disputes, we must assume rational economic behaviour. The procedure is most likely to misfire on **novel social outcomes** (like wellbeing) where measurement is inherently difficult; it will likely kill these metrics. This is a feature, not a bug. It is safer to under-measure than to pay for falsehoods.

  **Final Instruction:**
  Any metric failing Step 1 or Step 4 is killed immediately. Any metric failing Step 3 must have its payment weight capped at 25%. Step 2 failures require redesign. Step 5 failures require escalation to the Board. Do not proceed to contract signature without these signatures.
