answer: |-
  # The Asymbolia Triage Protocol (ATP)
  **Target:** Clinical Ethics Consultants  
  **Time Budget:** 15 Minutes  
  **Purpose:** Distinguish between *nociception without suffering* (no treatment obligation) and *harm requiring intervention* (treatment obligation) in pain asymbolia.

  ### The Procedure

  **Step 1: Sensory Integrity Check**  
  *Action:* Confirm the sensory-discriminative pathway is functional. Ask the patient to locate, grade intensity, and describe quality (sharp, burning, etc.) of the stimulus.  
  *Pass:* Patient accurately identifies location and intensity consistent with clinical signs (e.g., "8/10 sharpness in left thigh").  
  *Fail:* Patient cannot detect stimulus or description contradicts physical findings (suggests neuropathy or delirium, not asymbolia).  
  *Status:* **Factual.**

  **Step 2: Affective-Behavioral Audit**  
  *Action:* Observe immediate reaction and ask about unpleasantness. Look for grimacing, withdrawal, guarding, or verbal reports of suffering ("I hate this," "Make it stop").  
  *Pass:* Zero withdrawal, neutral or positive affect (smiling/laughing), and explicit denial of unpleasantness ("It doesn't bother me").  
  *Fail:* Any visible distress, protective movement, or verbal request for cessation.  
  *Status:* **Factual.**

  **Step 3: The Counterfactual-Withdrawal Check**  
  *Action:* Ask the patient (or surrogate if capacity is impaired): "If you knew this sensation would cause tissue damage or injury, but still felt exactly like this (neutral/curious), would you choose to avoid it in the future?"  
  *Pass:* Patient indicates they would restructure behavior to avoid the stimulus based on *risk*, not *feeling*. (Shows preserved valuation of bodily integrity).  
  *Fail:* Patient indicates they would not avoid it, or cannot conceptualize the link between sensation and future harm.  
  *Status:* **Factual (Cognitive Capacity).**

  **Step 4: Consistency & Stability Review**  
  *Action:* Verify this response is stable across time and contexts, not a transient dissociation or acute mania. Check history for similar responses.  
  *Pass:* Response is consistent over multiple interactions/shifts.  
  *Fail:* Response fluctuates wildly or correlates with acute psychotic/manic episodes.  
  *Status:* **Factual.**

  **Step 5: The Harm-Suffering Decoupling (VALUE JUMP)**  
  *Action:* Compare Step 2 (No Suffering) against Step 3 (Risk Acceptance).  
  *Decision Point:*  
  *   **If Step 2 = Pass (No Suffering) AND Step 3 = Pass (Would Avoid Risk):** Proceed to Step 6. The patient experiences no badness, but values safety. Treatment is for *protection*, not *relief*.  
  *   **If Step 2 = Pass (No Suffering) AND Step 3 = Fail (Won't Avoid Risk):** **STOP.** You have left the realm of fact. You must now decide if "tissue damage without suffering" constitutes a harm that overrides autonomy.  
  *Status:* **VALUE JUDGEMENT.** This is where the "Intrinsic Badness" vs. "Reactive Account" fight becomes policy. Are you treating the *pain* or the *lesion*?

  **Step 6: Authorization & Documentation**  
  *Action:* Sign off on treatment plan based on Step 5 outcome.  
  *Requirement:* If withholding analgesia, document: "Patient reports zero suffering; intervention withheld to respect affective integrity." If treating, document: "Intervention mandated for tissue preservation despite absent suffering."  
  *Status:* **Administrative.**

  ***

  ### Case Applications

  #### Case 1: The Classic Profile
  *Profile:* Sharp nociception reported clearly. Zero withdrawal. Smiling. No request to stop.
  *   **Step 1:** Pass (Sensory intact).
  *   **Step 2:** Pass (No aversive reaction).
  *   **Step 3:** Pass (Patient says, "I wouldn't want my leg broken, so I'd move, even if it doesn't hurt").
  *   **Step 5:** **Value Call:** Low friction. Patient values safety despite lack of pain.
  *   **Outcome:** Treat underlying injury if necessary for function, but **withhold analgesia**. Administering opioids here treats a symptom the patient does not have.
  *   **Note:** The procedure works cleanly here. The "badness" is purely functional, not experiential.

  #### Case 2: The Partial-Preservation Case
  *Profile:* Avoids physically (pulls hand back). Describes feeling as "pressure with a colour." Denies it is unpleasant.
  *   **Step 1:** Pass (Sensory intact, though described oddly).
  *   **Step 2:** **Fail/Borderline.** There is withdrawal behavior, but no affective distress. This suggests a spinal reflex or learned habit, not necessarily suffering.
  *   **Step 3:** Pass (Patient agrees to avoid "the pressure" to prevent damage).
  *   **Step 5:** **Value Call:** Moderate friction. Is the withdrawal a "reaction" that makes the pain bad?
  *   **Outcome:** The procedure flags this as **ambiguous**. The withdrawal suggests a protective mechanism is active, but the report denies suffering.
  *   **Recommendation:** Do not treat for *suffering*. Treat for *function* if the withdrawal impedes care. The procedure forces you to acknowledge that the "aversive layer" is partially present in the motor system, even if absent in consciousness.

  #### Case 3: The Active-Seeking / High-Risk Case
  *Profile:* Actively seeks repetition of stimulus. Reports neutral curiosity. History of self-injury makes staff want to block access.
  *   **Step 1:** Pass.
  *   **Step 2:** Pass (No distress, actually positive affect).
  *   **Step 3:** **Fail.** Patient indicates they would *not* avoid the stimulus even if damage occurs.
  *   **Step 5:** **Value Call:** **CRITICAL FAILURE POINT.**
  *   **Outcome:** The procedure identifies that there is **no suffering to treat**, but it cannot resolve the conflict between autonomy and safety.
  *   **Recommendation:** The consultant must override the procedure here. You are no longer deciding on *pain*; you are deciding on *paternalism*. The procedure tells you: "If you block this, you are not relieving pain. You are restricting liberty to prevent tissue damage."
  *   **Family Answer:** "The procedure confirms your loved one is not suffering. However, ethics requires us to prevent permanent injury even when the patient does not feel harmed. We are blocking access to protect the body, not to stop pain."

  ***

  ### Limitations & Misfire Analysis

  **1. Where the Procedure Misfires**
  The ATP assumes the patient has the capacity to value "future tissue integrity" (Step 3). In severe asymbolia, the neural disconnect often correlates with broader frontal lobe deficits. If the patient cannot conceptualize "future damage," Step 3 fails factually, forcing every case into Step 5 (Value Judgement). The tool loses its triage power and becomes a standard best-interest hearing.

  **2. The Forced Value Call**
  Step 5 is the hard stop. The procedure cannot tell a consultant whether "tissue damage without suffering" is bad *in itself*.
  *   If you hold the **Intrinsic Badness View**, you must treat/prevent damage regardless of Step 2.
  *   If you hold the **Reactive Account**, you should allow the behavior unless it threatens life.
  The procedure exposes this disagreement but does not solve it. It forces the consultant to write down *why* they are intervening, preventing the lazy justification of "relieving pain" when no pain-suffering exists.

  **3. What It Cannot Settle**
  *   **Staff Moral Distress:** Nurses may refuse to care for a patient who smiles while being cut. The ATP validates the patient's experience, not the staff's. It cannot resolve the team's emotional inability to proceed without analgesia.
  *   **Long-term Neuroplasticity:** We do not know if allowing "neutral" nociception reinforces harmful pathways over time. The ATP is a snapshot; it cannot predict if the asymbolia will degrade into suffering later.
  *   **Definition of Harm:** In Case 3, the procedure clarifies that the harm is *biological*, not *experiential*. It cannot settle whether biological harm trumps experiential autonomy in a competent adult. That remains a policy decision, not a clinical one.

  **Summary for the Consultant:**
  Use the ATP to strip away the assumption that nociception equals suffering. Use Step 3 to test for preserved agency. Use Step 5 to own the value judgement. If you treat after Step 5, admit you are acting paternalistically to save the tissue, not compassionately to save the patient from experience.
