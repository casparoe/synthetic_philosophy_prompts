prompt: |-
  I'm drafting a session for clinical ethics consultants who keep hitting these pain-asymbolia cases and not knowing wether to treat. The philosophical background is the old fight about whether pain is bad in itself or only bad because of the reactive, aversive layer it triggers -- you know, the intrinsic-badness view versus the reactive-account. In asymbolia the sensory track is intact but the aversive colouring and withdrawal behaviour drop out, sometimes with laughing or even approach. The ward needs a reusable procedue, not a one-off answer.

  Please turn that philosophical distinction into a bedside decision procedue -- maybe five or six ordered tests -- that a consultant with no philosophy background can actually run in about fifteen minutes before signing off. For each step say what counts as passing or failing, and mark the exact point where the answer stops being factual and becomes a value judgement (for instance, treating for dignity or future risk rather than for present suffering). The procedue must handle the profile where verbal report stays intact but both behavioural avoidance and affective distress are absent, and it should include my own little addition: a counterfactual-withdrawal check, asking wether the patient would restructure future behaviour to avoid the stimulus, not just whether they pull away now. That distinction matters, I think.

  Then apply it to three cases:
  - The classic profile: sharp nociception reported clearly, zero withdrawal, smiling response, no request to stop.
  - The partial-preservation case: they avoid physically but describe the feeling as "pressure with a colour" and deny it's unpleasant.
  - One that gives the family an answer they hate: a patient who actively seeks repetition, reports neutral curiosity, but has a self-injury history that makes staff want to block access anyway.

  Say where the procedue misfires, where it forces a value call, and what it flat-out can't settle. Don't give me a bibliography or citation list -- these people don't have time for that, and half the papers are behind paywalls anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested clinical ethics procedure:

  1.  **Analyze the Request:**
      *   **Target Audience:** Clinical ethics consultants (CECs). They need practical tools, not theory. Time-constrained (15 mins).
      *   **Problem:** Pain asymbolia cases (sensory pain intact, affective/aversive component missing). The core philosophical tension: Is pain bad *in itself* (intrinsic badness) or bad *because of the reaction* (reactive account)?
      *   **Task:** Create a 5-6 step bedside decision procedure based on this distinction.
      *   **Requirements:**
          *   Ordered tests.
          *   Pass/Fail criteria for each step.
          *   Explicitly mark where factual assessment ends and value judgement begins.
          *   Include the user's specific addition: "Counterfactual-Withdrawal Check" (would they restructure future behavior to avoid?).
          *   Handle the specific profile: Intact verbal report, absent avoidance/affect.
          *   Apply to three specific cases (Classic, Partial-Preservation, Active-Seeking/High-Risk).
          *   Identify limitations (misfires, value calls, unsettled issues).
          *   **Constraint:** No bibliography/citations.

  2.  **Deconstruct the Philosophy for Clinical Use:**
      *   *Intrinsic Badness View:* Pain is bad even if you don't mind it. Treatment is obligatory to remove the "bad thing."
      *   *Reactive Account:* Pain is only bad if it causes suffering/distress/avoidance. If the patient doesn't mind, it's not a harm requiring intervention.
      *   *Clinical Translation:* We can't measure "intrinsic badness" directly. We measure *impact on the patient's agency and welfare*.
      *   *The Pivot Point:* The procedure needs to move from "Is there nociception?" (Fact) to "Is this harming the patient?" (Fact/Value hybrid) to "Should we intervene?" (Value).

  3.  **Drafting the Procedure (The "Asymbolia Triage Protocol"):**
      *   *Goal:* 15 minutes. 5-6 steps.
      *   *Step 1: Sensory Confirmation.* Establish it's actually pain asymbolia, not denial or confusion. (Fact)
      *   *Step 2: Affective/Behavioral Audit.* Check for the missing aversive layer. (Fact)
      *   *Step 3: The Counterfactual-Withdrawal Check (User's Addition).* This is crucial. Does the lack of reaction extend to planning? (Fact/Value boundary).
      *   *Step 4: Capacity & Consistency.* Can they understand the risk? Is this stable? (Fact/Value).
      *   *Step 5: The "Dignity/Harm" Threshold.* Here is where the philosophy hits the bed. If they don't mind, do *we* mind? (Value).
      *   *Step 6: The Intervention Decision.* Treat or Monitor? (Value/Policy).

      *Refining the Steps for Clarity and Timing:*
      *   Let's make sure the "Value Jump" is highlighted clearly.
      *   Step 3 needs to be very specific about the user's "future behavior restructuring" idea.

  4.  **Developing the Cases:**
      *   *Case 1 (Classic):* Sensory yes, Affective no, Future avoidance no. *Result:* Likely no treatment needed based on procedure, but staff discomfort might trigger value call.
      *   *Case 2 (Partial):* Avoidance yes, Affective no (describes as "colored pressure"). *Result:* Mixed signals. The avoidance suggests some protective mechanism, but the report denies suffering. Harder call.
      *   *Case 3 (Active Seeking/High Risk):* Seeks pain, neutral report, history of self-injury. *Result:* Procedure says "no suffering," but safety/dignity says "stop." This highlights the procedure's limit.

  5.  **Identifying Limitations (The "Misfire" Analysis):**
      *   Where does it fail? When safety overrides autonomy. When staff moral distress overrides patient report. When long-term tissue damage is the concern, not current experience.
      *   The "Value Jump" needs to be explicit. The procedure can determine *suffering*, but it cannot determine *obligation to prevent tissue damage absent suffering* without a value premise.

  6.  **Review against Constraints:**
      *   No citations? Check.
      *   15-minute scope? Check (keep steps snappy).
      *   User's Counterfactual Check included? Check.
      *   Mark the Fact/Value line? Check.
      *   Tone: Professional, direct, clinical ethics focused.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm solving the philosophical debate. I'm translating it into a tool.
      *   *Correction:* Ensure the "Value Jump" is visually distinct.
      *   *Correction:* In Case 3, ensure the tension between "patient wants it" and "staff wants to block" is resolved by the procedure flagging a value conflict, not pretending the procedure solves it automatically.
      *   *Refinement on Step 3:* Make sure the "Counterfactual" is phrased as a question the consultant asks the patient/surrogate. "If you knew this would cause tissue damage, would you choose to avoid it?"

  8.  **Final Output Structure:**
      *   Introduction (Context).
      *   The Protocol (5 Steps + Value Marker).
      *   Case Applications.
      *   Limitations/Misfire Analysis.

  *(Self-Correction on Step Count)*: The prompt asks for 5 or 6 ordered tests. I will aim for 5 distinct clinical checks + 1 final authorization step.
  *(Self-Correction on Value Marker)*: I need to explicitly state "VALUE JUMP" or similar at the specific step.

  Let's write it.

  *Drafting Step 3 (Counterfactual):* "Ask: 'If you knew this stimulus would damage the tissue but still feel like this, would you choose to avoid it?'"
  *Drafting the Value Jump:* It happens when we move from "Patient reports no harm" to "We accept no harm."

  *Drafting Case 3:* This is the tricky one. The procedure might say "No treatment needed for suffering," but ethics says "Prevent harm." I need to show how the procedure flags this as a *paternalism* decision, not a *suffering* decision.

  Okay, ready to generate response.

  *(Final check on tone)*: Keep it brisk. These are busy consultants. No fluff.

  *(Final check on the "Value Jump")*: The prompt asks to "mark the exact point where the answer stops being factual and becomes a value judgement". I will use a specific icon or bold text for this.

  *(Final check on "No bibliography")*: Ensure no references are dropped.

