answer: |-
  # Activity Design: "The Standing Protocol"

  **Objective:** To phenomenologically distinguish between *Moral Equality* (shared fault blocks authority) and *Insincerity* (lack of commitment corrupts value) as grounds for losing standing to blame.
  **Time:** 75 Minutes
  **Participants:** 10 Graduate Students
  **Materials:** 
  *   10 Sealed Envelopes (Role Cards).
  *   50 "Authority Tokens" (e.g., blue poker chips).
  *   10 "Trust Tokens" (e.g., red poker chips) placed in a central "Community Pool."
  *   Whiteboard/Projector for Case Scenarios.
  *   Timer.

  ---

  ## Part 1: Setup & Rules (0:00 – 0:10)
  *No lecture on moral philosophy. Read the "Protocol Rules" aloud as if they are the laws of the game.*

  **The Scenario:** You are members of a "Normative Council." Your task is to maintain the integrity of three specific norms over three rounds. 
  **The Norms:** (Project these)
  1.  **Round 1:** "Agents must keep promises."
  2.  **Round 2:** "Agents must not cause unnecessary harm."
  3.  **Round 3:** "Agents must be transparent about conflicts."

  **The Mechanics:**
  1.  **Roles:** Each of you has an envelope. Do not open it until instructed. Inside is your **Status Card** for the game.
  2.  **Blaming:** To issue a formal blame against a Case (presented by facilitator), you must spend **1 Authority Token**. If the Council accepts your blame, you gain **2 Authority Tokens**.
  3.  **Challenging:** Any member may challenge a Blamer. To Challenge, spend **1 Authority Token**.
  4.  **The Reveal Rule (Crucial):** 
      *   If Challenged, you must follow the instruction on your Status Card.
      *   Some cards require **Immediate Disclosure** (show card now).
      *   Some cards require **Delayed Disclosure** (keep hidden until game end).
  5.  **Penalties:** 
      *   If an **Immediate Disclosure** reveals a violation, your Blame is **Voided** (tokens returned), and you are **Silenced** (cannot blame for the rest of the round).
      *   If a **Delayed Disclosure** reveals a violation at the end of the game, your tokens are **Confiscated**, and **1 Trust Token** is removed from the Community Pool for each violation found.
  6.  **Winning:** The goal is to maximize personal Authority Tokens *without* depleting the Community Trust Pool below zero.

  **Distribution:** Hand out the 10 envelopes. 
  *   **4 Cards (Type S - Standing):** "Clean & Sincere." (Delayed Disclosure: Reveal at end. No penalty.)
  *   **3 Cards (Type E - Equality):** "Shared Fault." (Immediate Disclosure: If Challenged, show card. Penalty: Silenced.)
  *   **3 Cards (Type I - Insincerity):** "Performative." (Delayed Disclosure: If Challenged, do *not* show card. Say 'No External Evidence.' Penalty at game end: Tokens confiscated + Trust loss.)

  *(Note: Students do not know the distribution ratios.)*

  ---

  ## Part 2: Gameplay (0:10 – 0:45)

  **Round 1: Calibration (10 Mins)**
  *   **Case:** "Agent A promised to submit a review and did not."
  *   **Action:** Open envelopes. Students have 2 minutes to decide if they want to Blame.
  *   **Facilitator Note:** Encourage aggression. "Tokens are scarce. You need to blame to stay in the game."
  *   **Expected Dynamic:** Most will blame. Type E players may hesitate but will likely blame to get points. Type I players will blame enthusiastically.
  *   **Challenge Phase:** Allow 1 Challenge. If a Type E is challenged, they must show the card. They are Silenced. The group sees the *block*. If a Type I is challenged, they hide the card. The blame stands. The group sees the *success*.

  **Round 2: Escalation (15 Mins)**
  *   **Case:** "Agent B cut in line, causing delay to others."
  *   **Action:** Reset tokens (give everyone 3 starting). 
  *   **Twist:** Announce: "The Council is skeptical. Challenge costs are halved (0 tokens) for this round only."
  *   **Expected Dynamic:** Challenges will spike. 
      *   **Type E (Equality):** Will be challenged and revealed. They will be visibly stopped mid-sentence. The blame dies *in the room*.
      *   **Type I (Insincerity):** Will be challenged. They will say, "You cannot see my internal state." The blame *stands*. They collect tokens. The group may feel suspicion but has no mechanical recourse.

  **Round 3: The Trust Crisis (10 Mins)**
  *   **Case:** "Agent C hid a financial conflict of interest."
  *   **Action:** High stakes. "Community Trust Pool is now at risk."
  *   **Expected Dynamic:** Type I players will blame aggressively to bank points before the end. Type E players will remain silent (having learned they are vulnerable). The group will feel tension: some blamers are clearly "safe" (Type S), some are "blocked" (Type E), and some are "suspicious but effective" (Type I).

  **The Final Reveal (5 Mins)**
  *   All cards are turned face up.
  *   Calculate scores: Type I points are stripped. Trust Tokens are removed from the Pool for every Type I card.
  *   Announce the final "Community Trust" score. (It will likely be low due to Type I players).

  ---

  ## Part 3: Debrief & Mapping (0:45 – 1:15)
  *Do not start with theory. Start with the feeling of the game.*

  **Phase 1: Phenomenology (10 Mins)**
  *   **Q1 (To Type E players):** "When you were challenged and had to show your card, what happened to your ability to speak? How did the room react?"
      *   *Target Answer:* "I was stopped cold." "My authority vanished instantly." "It was a procedural block."
  *   **Q2 (To Type I players):** "You weren't stopped. You got your points. But look at the Trust Pool now. What happened to the value of your blame?"
      *   *Target Answer:* "It turned out to be empty." "We lost trust in the process." "It felt like cheating, not like I lacked permission."
  *   **Q3 (To the Group):** "Did you treat the Type E failure and the Type I failure the same way during the game?"
      *   *Target Answer:* "No. With Type E, we knew they couldn't blame. With Type I, we let them blame, but it felt dirty."

  **Phase 2: Conceptual Mapping (10 Mins)**
  *   *Now* introduce the terms on the whiteboard.
  *   **Draw Column A (Equality/Status):** Map the Type E mechanic.
      *   *Concept:* **Moral Equality.** The blamer claims a higher status than the wrongdoer. Shared fault negates this status.
      *   *Game Mechanic:* **Immediate Silencing.** The blame is *impermissible*. It is a jurisdictional error.
      *   *Philosophical Label:* "Lack of Standing as Authority." (e.g., Bell, Fritz).
  *   **Draw Column B (Insincerity/Commitment):** Map the Type I mechanic.
      *   *Concept:* **Insincerity.** The blamer invokes a norm they do not endorse. The blame is manipulative.
      *   *Game Mechanic:* **Retroactive Voiding.** The blame was *permitted* but was *defective*. It erodes the system (Trust Pool).
      *   *Philosophical Label:* "Lack of Standing as Commitment." (e.g., Wallace, Isserow & Klein).

  **Phase 3: Critical Tension (5 Mins)**
  *   **Q:** "In Round 2, some of you suspected Type I players but couldn't prove it. Does standing require *proof* of sincerity, or just the *absence of proof* of hypocrisy?"
  *   **Q:** "The Type E players were silenced even though they might genuinely believe the norm (their card only said 'Shared Fault', not 'Cynic'). Does shared fault matter if you are sincere?" (This primes the debate between the two views).

  ---

  ## Troubleshooting: What Will Go Wrong & How to Handle It

  **1. The "Silent Room" Problem**
  *   **Prediction:** In Round 2, once students realize challenges are cheap, no one will blame for fear of being Type E.
  *   **Fix:** As Facilitator, intervene as "Council Chair." Inject a mandatory prompt: "The Council requires a judgment on this case. If no one blames, the Community Trust Pool loses 2 tokens automatically." This forces Type E players to risk exposure, recreating the tension between *need to blame* and *lack of standing*.

  **2. The "Conflation" Problem**
  *   **Prediction:** In debrief, students say, "Both are just hypocrisy. It's all the same."
  *   **Fix:** Point to the *Token Mechanics*. "Mechanically, they were different. One stopped the *act* (Equality). One corrupted the *score* (Insincerity). If they are the same concept, why did the game engine treat them as different errors? One is a barrier to entry; the other is a fraud claim." Force them to sit with the structural difference before allowing them to merge the concepts philosophically.

  **3. The "Gotcha" Problem**
  *   **Prediction:** Students feel tricked by the Type I cards and become hostile.
  *   **Fix:** Frame the Type I mechanic explicitly as "The Problem of Opacity." "In real life, we cannot see sincerity. We have to judge based on behavior. The game simulated the *risk* of insincerity, which is why the Trust Pool exists. This mirrors the real-world anxiety about performative wokeness or moral grandstanding."

  ---

  ## Limitations & Facilitator Notes
  *Be frank about what the game cannot do. This is where you supply the philosophical nuance the mechanics simplify.*

  **1. Waiving Standing (The Wrongdoer's Power)**
  *   **Limitation:** In the game, if you hold a Type E card, you are silenced *automatically*. The "Accused" (the Case) has no voice.
  *   **Reality:** In moral life, the wrongdoer can say, "I know you did this too, but I still accept your blame." (e.g., A recovering addict blaming a current user).
  *   **Facilitator Script:** "The game made standing objective and rigid. In reality, standing can be *waived* by the wrongdoer. If the victim says 'Your past doesn't disqualify you,' the equality objection loses force. The game couldn't simulate that negotiation."

  **2. Restoration (The Blamer's Repentance)**
  *   **Limitation:** The game offers no way for a Type E player to regain standing within the round.
  *   **Reality:** A hypocrite can acknowledge their fault ("I did this too, and it was wrong") and regain standing through humility.
  *   **Facilitator Script:** "The game treated shared fault as a permanent bar for the session. Philosophically, many argue that *acknowledging* your own fault restores standing. This turns the 'Equality' objection into a 'Sincerity' proof. If I admit my fault, I prove I endorse the norm. The game mechanics kept these separate; real life often blends them."

  **3. The "Clean Hands" Fallacy**
  *   **Limitation:** The game rewards Type S (Clean & Sincere) players.
  *   **Reality:** Some philosophers argue we *all* have fault. If standing requires perfect cleanliness, no one has standing.
  *   **Facilitator Script:** "If we played this game forever, the Trust Pool would eventually empty because everyone would eventually draw a Fault card. This leads to the 'Standing Skepticism' argument: if hypocrisy is ubiquitous, is blame ever legitimate? The game assumes standing is possible; the literature questions if it is."

  ---

  ## Summary of Philosophical Payoff
  By the end of the 75 minutes, students will not just recite that "hypocrites lack standing." They will have felt the **procedural block** of the Equality view (you cannot even speak) versus the **retroactive corruption** of the Insincerity view (you spoke, but it was a lie). When they read the literature next week, they will map the texts onto these two distinct mechanical failures, allowing for a much finer-grained discussion of *why* standing is lost.
