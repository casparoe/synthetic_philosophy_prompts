answer: |-
  1. Conceptual Frame and Activity Overview
  The activity, titled "The Organism Treaty," simulates a single human life span viewed not as a unified entity but as a coalition of five competing biological processes. Participants are divided into five teams, each embodying one of the *skandhas* (aggregates): *Rūpa* (physical form/cellular health), *Vedanā* (affective tone/pleasure-pain), *Saññā* (perception/memory recognition), *Saṅkhāra* (volitional habits/conditioning), and *Viññāṇa* (conscious awareness/attention). The scenario covers forty years of continuous existence, modeled in six rounds representing distinct life stages.

  Unlike Western thought experiments that rely on abrupt discontinuities (e.g., teleportation), this scenario emphasizes gradual turnover. In every round, the organism undergoes inevitable biological decay and cellular replacement regardless of player choice. Each team receives private "Continuity Objectives" specific to their aggregate—for example, *Rūpa* seeks to minimize metabolic stress, while *Vedanā* seeks immediate gratification. These objectives often conflict. To keep the organism alive, all five teams must unanimously agree on a single course of action per round. However, scoring is individual; teams compete to maximize their own continuity tokens. Participants will experience the friction of maintaining a functional "person" when no single agent holds authority, revealing the "self" as a negotiated convention rather than an ontological owner.

  2. Rules, Materials, and Incentive Structure
  **Materials:** A central "Life Track" board showing age and total Health Points (HP); five colored decks of Action Cards; five sets of colored tokens (Continuity Chips); and private Objective Cards for each team.
  **Setup:** Divide 14 students into five teams (three teams of three, two teams of two). Assign each team an aggregate. Distribute private Objective Cards detailing how to earn Continuity Chips (e.g., *Vedanā* gains chips if the chosen action reduces pain; *Saṅkhāra* gains chips if the action reinforces existing habits).
  **Gameplay:** Each round represents ~7 years. A "Biological Event" card is drawn (e.g., "Hormonal Shift," "Chronic Injury," "Career Stress"). This event imposes a baseline HP cost to the organism. Teams discuss and select one Action Card to mitigate the event. Crucially, voting must be unanimous. If consensus fails within 5 minutes, the organism "Stalls," losing significant HP from all aggregates.
  **Incentive:** The organism survives only if total HP remains positive after six rounds. However, the "Winner" is the team holding the most Continuity Chips at the end. This creates tension: teams must cooperate enough to keep the organism alive (conventional survival) but prioritize their own stream's integrity (ultimate fragmentation).
  **Conflict:** Actions beneficial to one aggregate often degrade another. Choosing a high-stress career boost might satisfy *Saṅkhāra* (ambition) and *Viññāṇa* (stimulation) but deplete *Rūpa* (health) and *Vedanā* (comfort). Teams must negotiate who sacrifices continuity this round. The biological scenario is continuous; HP carries over, and habit cards accumulate, forcing players to manage long-term degradation against short-term gains.

  3. Session Timeline
  **00:00–00:10 (Introduction):** Facilitator outlines the biological premise: gradual cellular turnover and psychological habituation. No mention of *anattā* yet. Students are seated into five pre-assigned teams.
  **00:10–00:25 (Setup & Rules):** Distribute materials and private Objective Cards. Ensure teams understand they must vote unanimously but score individually. Run a practice round to clarify voting mechanics.
  **00:25–00:55 (Gameplay):** Conduct six rounds of play. Each round allows 5 minutes for negotiation and 1 minute for resolution. The Facilitator tracks the Life Track HP publicly. Tension should peak around Round 4 (mid-life) when biological decay accelerates.
  **00:55–01:15 (Debrief):** Halt gameplay. Collect tokens. Facilitate discussion mapping the experience to philosophical concepts. Conclude with the designation of the "Winner" and the revelation of the workshop's philosophical aim.

  4. The Debrief: Mapping Play to Anattā
  The debrief must pivot from the game mechanics to the ontological implications. Begin by asking the "Winning" team why they deserve the identity of the organism. Their justification will likely rely on utility or survival contribution. Reveal that while they competed as distinct entities, the room collectively referred to them as one "Organism" to keep the game running. This mirrors *sammuti-sacca* (conventional truth): practically, we must designate a person to navigate society, pay bills, and accept responsibility. The unanimous vote requirement forced a conventional unity upon fragmented processes.

  Next, examine the private scoring. Ask teams if any single aggregate remained unchanged from Round 1 to Round 6. They will note that *Rūpa* degraded, *Saññā* shifted memories, and *Saṅkhāra* altered habits. Yet, the game required them to act as a continuous owner. This friction exposes *paramattha-sacca* (ultimate truth): there are only flowing processes with different continuity criteria, no static "self" underlying them. The anxiety felt during negotiation—the fear that one's aggregate would be sacrificed for the "greater good" of the organism—is the experiential texture of *dukkha* arising from clinging to a false unity. The biological continuity (the Life Track) served as the glue, just as bodily continuity often tricks us into assuming psychological identity. The game demonstrates that "I" is the treaty signed between these warring factions, not the signer itself.

  5. Predictable Failures and Facilitator Remedies
  **Failure 1: Collusion.** Students may agree to share tokens equally to "beat the game," undermining the conflict.
  *Remedy:* Enforce secrecy. Objective Cards must remain hidden until the end. Remind them that the "Winner" receives a distinct privilege (e.g., naming the organism), incentivizing individual maximization.
  **Failure 2: Dominance.** The *Viññāṇa* (Consciousness) or *Saṅkhāra* (Will) teams often dominate discussion, treating others as subordinate tools.
  *Remedy:* Implement a "Veto Token." Each team gets one veto per game. If *Rūpa* vetoes an action, it cannot pass, regardless of consensus. This forces the "mental" aggregates to respect the biological constraints, preventing Cartesian dualism from creeping back in.
  **Failure 3: Stalling.** Teams may fail to vote, causing the organism to "die" early.
  *Remedy:* If HP drops below 20%, the Facilitator intervenes as "Natural Selection," forcing a random action to keep the simulation running for pedagogical completion.

  6. Honest Limitation
  This activity successfully models the fragmentation of the self and the pragmatic necessity of conventional designation, but it cannot reproduce the *absence* of the observer. By assigning students to play the aggregates, we necessarily reify the skandhas as substantial entities with agents inside them. In actual *anattā*, the aggregates themselves are empty of self-nature; there is no "team" of *Rūpa*, only the process of materiality. The game creates a pluralism of selves rather than a no-self. Additionally, the competitive incentive structure relies on craving (*taṇhā*) to function, which is philosophically accurate but means the participants are experiencing *samsara* rather than *nibbāna*. The facilitator must explicitly state that the game simulates the problem, not the liberation from it. The felt sense of "I am playing this role" remains intact throughout, which is precisely the illusion the doctrine seeks to dismantle. This residual subjectivity must be addressed verbally, as the mechanics cannot dissolve the player's own sense of agency.
