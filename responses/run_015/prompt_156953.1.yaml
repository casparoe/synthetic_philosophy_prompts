answer: |-
  This is a smart way to approach the problem. You're asking for the "stress tests" a theory needs to pass before you bet your political capital on it. Since you're dealing with real people and a real city council, you need a framework that separates moral goals from mechanical constraints.

  Here are the five criteria a serious theory of price controls (rent caps and wage floors) must satisfy to be useful to you, followed by the interaction effects and the "impossible subset" you're looking for.

  ### Part 1: The Five Stress Tests
  A theory isn't useful if it just says "markets clear" or "workers deserve more." It needs to explain *how* things break or hold.

  **1. The "Binding" Test**
  The theory must distinguish between a law that exists on paper and a law that actually changes behavior.
  *   **The Constraint:** If the minimum wage is \$20 but everyone is already paid \$25, the law is "non-binding." It does nothing. If rent caps are set at current market rates, they do nothing.
  *   **The Requirement:** The theory must predict what happens when the control is *below* the market price (rent) or *above* the market wage (labor). This is where the friction starts. If the theory can't explain the difference between a symbolic law and a binding one, discard it.

  **2. The Time-Horizon Test**
  The theory must distinguish between "right now" and "five years from now."
  *   **The Constraint:** Housing supply is fixed in the short run (you can't build an apartment building in a month). Labor supply is also sticky (people can't retrain instantly).
  *   **The Requirement:** A good theory explains why things might look fine in year one (no one moves out, no one gets fired) but deteriorate in year five (landlords stop building, businesses automate jobs). If a theory claims the short-run result is the permanent result, it's flawed.

  **3. The Insider/Outsider Test**
  The theory must account for who wins and who loses *within* the protected group.
  *   **The Constraint:** Rent control helps the tenant living in the unit *today* (the Insider). It often hurts the person looking for a unit *tomorrow* (the Outsider) because supply tightens. Minimum wages help the worker keeping their job (Insider) but can hurt the worker who isn't hired or gets hours cut (Outsider).
  *   **The Requirement:** The theory cannot treat "tenants" or "workers" as a single block. It must explain the trade-off between security for incumbents and opportunity for newcomers.

  **4. The Escape Route Test**
  The theory must identify how landlords and employers bypass the rules without technically breaking them.
  *   **The Constraint:** Humans optimize. If you cap rent, landlords might charge "key money," require expensive furniture rentals, or stop fixing toilets. If you cap wages (or rather, set a floor), employers might reduce hours, cut benefits, or increase work intensity.
  *   **The Requirement:** The theory must predict where the "black market" or "loophole market" will emerge. If the theory assumes perfect compliance, it is not serious.

  **5. The Purchasing Power Net Test**
  The theory must look at income and expenses together, not in isolation.
  *   **The Constraint:** A wage hike is useless if rent eats it all. A rent cap is useless if you can't get a job.
  *   **The Requirement:** The theory must track the *gap* between income and housing costs. It needs to explain if the policies widen that gap (by reducing supply/jobs) or narrow it (by transferring surplus).

  ### Part 2: Accommodating the Evidence (Seattle & Berlin)
  You don't need citations, but your theory can't ignore what happened in these places.

  *   **Seattle (Minimum Wage):** A serious theory must accommodate that wages went up for low-income workers, *but* hours worked sometimes went down, and some businesses reduced hiring. It wasn't a disaster, but it wasn't free money. The net income gain was positive for many, but not all. The theory must allow for "mixed outcomes" where the average worker gains, but the most vulnerable worker loses hours.
  *   **Berlin (Rent Stabilization):** A serious theory must accommodate that rents dropped initially for those covered, *but* the supply of rental units tightened, landlords found legal loopholes (furnished rentals), and investment in new housing froze. Eventually, the legal uncertainty caused chaos. The theory must allow for "initial relief followed by supply contraction and legal friction."

  ### Part 3: The Interaction (When You Do Both)
  This is the specific danger zone for your city council. Here is how the two policies mechanically grind against each other.

  **1. The Queue Problem**
  *   **Mechanism:** Rent control creates a shortage (more people want apartments than there are apartments). Minimum wage increases the number of people who can *afford* the controlled rent.
  *   **Result:** You lengthen the queue. More people have the cash to apply for the cheap apartments, but the number of apartments hasn't increased. This increases competition for controlled units, potentially leading to discrimination (landlords picking "safer" tenants) or side-payments (bribes to get the lease).

  **2. The Reservation Wage vs. Cost of Living**
  *   **Mechanism:** Rent control lowers the cost of survival. Theoretically, this lowers the "reservation wage" (the minimum pay someone needs to accept a job).
  *   **Result:** This works against your roommate's goal. If housing is cheap, workers might feel less pressure to demand high wages. Conversely, if wages go up, landlords know tenants have more money and will lobby harder to lift rent caps or convert units to condos to capture that value.

  **3. The Investment Strike**
  *   **Mechanism:** Housing developers and business owners both look at "return on investment."
  *   **Result:** If you cap the revenue (rent) and force up the cost (wages for maintenance staff, security, retail workers in the building), the profit margin on housing collapses. Developers may stop building entirely, or shift to building luxury condos (exempt from caps) or commercial space. You risk starving the city of new stock while making existing stock more expensive to operate.

  ### Part 4: The Impossible Subset (The Trilemma)
  You asked if there is a jointly unsatisfiable cluster. There is. In economics, this is often called a "Trilemma." For your specific situation, the impossible triad is:

  **You cannot simultaneously have:**
  1.  **Strict Price Controls** (Rents kept below market, Wages kept above market).
  2.  **No Shortages** (Everyone who wants a job has one, everyone who wants an apartment gets one).
  3.  **No Quality Degradation** (Housing is maintained, jobs have good conditions/hours).

  **Why?**
  *   If you enforce **(1)**, you distort the signals that tell builders to build and employers to hire.
  *   To avoid **(2)** (Shortages), you would need to subsidize the difference (government pays landlords the market rate, government pays businesses the wage difference), which requires massive taxes.
  *   If you don't subsidize, you get **(3)** (Degradation). Landlords defer maintenance because they can't raise rent; employers cut hours or automate because they can't lower wages.

  **The "Hard Constraint" for your City Council:**
  If they pass both policies without a massive subsidy budget, they must choose which "failure mode" they prefer:
  *   **Mode A:** Long waiting lists for housing and reduced hours for low-wage workers (Shortages).
  *   **Mode B:** Deteriorating housing quality and high-stress/low-staffing work environments (Degradation).
  *   **Mode C:** A thriving black market of under-the-table rent payments and off-the-book labor (Evasion).

  ### Summary for your Meeting
  When you talk to your group and your roommate, the pivot point is **Supply**.

  *   **Rent Control** manages the *distribution* of existing housing (who gets the room), but often shrinks the *total* housing over time.
  *   **Minimum Wage** manages the *distribution* of profits (worker vs. owner), but can shrink the *total* labor demand over time.

  If your city council does both, they are squeezing the supply side from two directions. A serious theory demands they answer this: **Who pays for the gap?** If the answer is "nobody," the market will create a shortage, a black market, or a quality collapse to balance the books for you. You need to decide which of those three outcomes is the least harmful, because one of them is almost certainly coming.
