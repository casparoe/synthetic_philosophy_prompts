      *   **Part 2: Accommodating Reality (Seattle/Berlin).**
          *   Seattle: Wages up, some hours/jobs down, net income up for some, not all.
          *   Berlin: Rents froze, supply tightened, legal chaos, eventual reversal.
          *   Theory must allow for "Helps some, hurts others, changes behavior."
      *   **Part 3: The Interaction (The City Council Scenario).**
