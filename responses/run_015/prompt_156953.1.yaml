      *   **Core Question:** What are the *desiderata* (criteria/requirements) for a theory of price controls (rent caps + min wages) to be taken seriously?
      *   **Specific Requirements:**
          *   Explain phenomena: displacement, supply elasticity, deadweight loss, exploitation, housing insecurity.
          *   Preserve distinctions: binding vs. non-binding, short-run vs. long-run, local labor vs. regional housing.
          *   Distinguish hard constraints vs. political preferences.
          *   Accommodate empirical evidence (Seattle wage experiment, Berlin rent stabilization) without citing papers.
          *   **Crucial:** Explain the *interaction* between the two policies (do they conflict? reinforce?).
          *   **Crucial:** Identify "impossible subsets" (trade-offs/trilemmas).
          *   **Constraint:** No bibliography, no "scorecard of economists," minimize jargon.

  2.  **Deconstruct the Economic Theory (Mental Sandbox):**
      *   *Rent Control:* Usually creates shortage (quantity demanded > quantity supplied) in the long run if binding. Reduces mobility (people stay in cheap apartments even if too big/small). Can lead to degradation of housing stock (landlords cut maintenance). Protects incumbents, hurts newcomers.
      *   *Minimum Wage:* Can reduce employment if binding (depending on elasticity/monopsony power). Increases income for low-wage workers. Can increase prices (passed on to consumers).
      *   *Interaction:* Higher wages mean people can pay more rent (potentially undermining rent control benefits or pushing market rates up). Rent control lowers living costs, potentially lowering the "reservation wage" (the minimum wage someone needs to accept a job), but also locks people in place, reducing labor mobility.
      *   *Empirical Accommodation:* Seattle (min wage): Some job loss/hour reduction, some income gain. Berlin (rent cap): Rents dropped initially, then law struck down, supply tightened, loopholes found. Theory must allow for mixed results, not just "always bad" or "always good."

  3.  **Drafting the Desiderata (The Criteria):**
      *   Need to frame these as questions the theory must answer, not just economic laws.
      *   *Criterion 1: The Binding Threshold.* When does the law actually bite? (Market rate vs. Controlled rate).
      *   *Criterion 2: Time Horizons.* Supply is fixed short-term, flexible long-term. Theory must distinguish.
      *   *Criterion 3: Incumbents vs. Entrants.* Who wins (current tenants/workers) vs. who loses (future renters/job seekers).
      *   *Criterion 4: The Substitution/Escape Valve.* How do actors get around it? (Side payments, conversion to condos, automation, reduced hours).
      *   *Criterion 5: Income vs. Price.* Min wage raises income; Rent cap lowers price. How do they net out for purchasing power?

  4.  **Addressing the Interaction (The "Meat"):**
      *   *Scenario A:* Min wage goes up. Tenants have more cash. Landlords know this. Does this create pressure to lift rent caps or find loopholes? Yes.
      *   *Scenario B:* Rent caps go down. Cost of living drops. Do workers demand less wage? Maybe, but unions usually want *more*.
      *   *Scenario C:* The Queue. Rent control creates a queue (waiting list). Higher wages make more people able to afford the *controlled* rent, lengthening the queue.
      *   *Scenario D:* Mobility. Rent control ties people to units. Min wage might attract people to the city. Mismatch.

  5.  **Identifying the "Impossible Subset" (The Trilemma):**
      *   What can't you have?
      *   You can't have: (1) Strict Price Controls (below market), (2) No Shortages/Queues, and (3) High Mobility/Supply Growth.
      *   Or specifically for this user: (1) Deep Rent Cuts, (2) Significant Wage Hikes, (3) No Reduction in Housing Quality/Availability.
      *   Let's refine: The "Holy Trinity" that breaks is: *Affordable Entry for Newcomers + High Quality Maintenance + Strict Price Ceilings.* Usually, you pick two.
      *   Another angle: *High Wage + Low Rent + High Employment.* If labor costs go up and capital returns (rent) go down, investment might flee both sectors.

  6.  **Refining Tone and Language:**
      *   Avoid: "Deadweight loss," "Elasticity," "Monopsony," "Equilibrium."
      *   Use: "Waste/lost value," "Responsiveness," "Employer power," "Balance point."
      *   Keep it empathetic to the activist context. Acknowledge the moral goals (security, fairness) while highlighting the mechanical friction.

