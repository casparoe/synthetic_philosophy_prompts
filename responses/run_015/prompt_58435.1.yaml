  Bottom Line Up Front
  I recommend we vote to keep the Harlan Cobb statue in Elm Park while adding an explanatory panel and commissioning a companion piece from a local artist. This approach honors our history without hiding its complexities, using next year's beautification budget to fund the changes.

  What We Are Actually Voting On
  The statue is a late-1970s bronze of Harlan Cobb, located centrally in Elm Park. Cobb donated the land for this park and the library, but he also wrote racial covenants that excluded Black families from our neighborhood for decades. Our board must choose between three options: leave the statue unchanged, move it to county storage which incurs yearly fees, or keep it in place while adding historical context and a new companion artwork. The high school student council has proposed the third option, offering specific designs for the panel. We need to decide by next Tuesday to align with the upcoming fiscal budget cycle. Storage costs come from general funds, while the add-on uses beautification reserves.

  The Strongest Case For Leaving It Alone
  Leaving the statue unchanged respects the context in which it was erected. Harlan Cobb was a product of his time, and judging him by today's moral standards risks erasing the history of how our neighborhood actually developed. For many long-time residents, this statue represents genuine generosity and community building, not malice. Changing it now could feel like rewriting history to suit current political moods rather than preserving heritage. Furthermore, Elm Park is a space for relaxation and play. Turning it into a site of historical debate might make residents feel unwelcome or burdened by guilt whenever they visit. If we start removing or altering markers based on evolving social norms, we set a precedent that could destabilize other community landmarks. The safest path is to preserve the artifact exactly as previous generations left it, trusting neighbors to understand history without official guidance.

  The Strongest Case For Doing Something
  However, leaving the statue unchanged tells only half the story. The plaque currently calls Cobb a visionary builder but omits the racial covenants that systematically excluded Black families from benefiting from that vision. This omission hurts current residents who know this history and confuses those who do not. Ignoring the covenants does not protect history; it hides it. Adding context acknowledges the full truth of our community's growth without destroying the artwork. It also respects the voice of our local high schoolers, who proposed a constructive solution rather than simple removal. By commissioning a companion piece, we signal that our community values inclusivity today, even if it didn't in the past. This approach keeps the park welcoming for everyone, ensuring that no neighbor feels the space celebrates their exclusion. It transforms a potential source of division into an opportunity for honest learning.

  My Recommendation And Next Steps
  I recommend we adopt the third option: keep the statue, add the explanatory panel, and commission the companion piece. This balances preservation with honesty. We should authorize the use of next year's beautification budget for this purpose immediately. By next Friday, the Board President will confirm budget availability with the treasurer to ensure funds are sufficient. By the end of the month, we will form a small committee including two board members and two student representatives to finalize the panel text and select the artist. We aim to have the panel installed by the start of the school year and the companion piece commissioned within twelve months. This timeline ensures we act decisively without rushing the artistic process. It also demonstrates to the community that we take their input seriously. We must communicate this decision clearly to all residents via email and the neighborhood website before voting next Tuesday. This path avoids the ongoing costs of storage while addressing the ethical concerns raised by our neighbors. It allows us to close this chapter and focus on other park improvements. All votes will be recorded publicly.

  Best Objection To My Recommendation And Why It Does Not Win
  The strongest objection is that this process opens the door to constant re-litigation of our history and diverts funds from practical park maintenance. Critics argue that once we start adding context to old monuments, we never stop, and the beautification budget should fix benches, not fund art projects. Some worry this turns a simple park into a political statement. However, this specific proposal comes with a clear endpoint: one panel and one companion piece. It is not an open-ended review of every plaque in town. The cost is contained within the existing budget, meaning no special assessments for neighbors. Ignoring the issue costs us too, in community trust and cohesion. Addressing it now prevents years of recurring arguments at every board meeting. We can fix the benches and tell the truth about our history simultaneously. This targeted approach solves the immediate problem without creating a slippery slope for future demands.
