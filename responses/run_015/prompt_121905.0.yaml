  The divergence stems from how each framework aggregates value across an unbounded population—summing welfare versus isolating the minimum welfare. Imagine a city health committee deciding between funding an immediate mRNA vaccine rollout for five thousand at-risk children (Plan A) or investing in a geo-engineering shield that stabilizes the region's climate for millennia (Plan B). The vaccine guarantees these identified children survive to adulthood with a baseline quality of life rated at 50 units, while the climate model predicts that stabilizing the environment will allow humanity to persist indefinitely, creating an unbounded chain of descendants, but entropy ensures that somewhere in that infinite timeline, at least one generation will endure a suffering level of 10 units.

  Under the expected-total-value framework, Plan B wins because any positive average welfare multiplied by an infinite population yields infinite expected utility, which mathematically swamps the finite utility of saving the five thousand children in Plan A. The lexical comparison framework ignores the headcount and ranks outcomes solely by the welfare of the worst-off individual; since the worst-off child in Plan A has 50 units and the worst-off descendant in Plan B has 10 units, Plan A is strictly superior regardless of how many others thrive. The exact structural feature driving this split is the aggregation rule applied to cardinality: totalism sums across the population size, making infinity decisive, while lexical prioritarianism fixes on the minimum value regardless of population size. If you remove the infinite-descendents condition and make Plan B's future population merely very large but finite, the disagreement collapses into a normal cost-benefit dispute where trade-offs between total magnitude and distributional floors are negotiable rather than mathematically absolute.
