answer: |-
  Here is the principle, tightened for operational use.

  **The Principle of Preserved Agency**
  A nudge is permissible only if it satisfies two conditions:
  1.  **Equivalent Effort:** Choosing the alternative must require no more effort than choosing the default.
  2.  **Respect Boundaries:** The mechanism must not rely on deception, privacy invasion, or ignoring an explicit refusal.

  **Why these clauses?**
  *Equivalent Effort* is forced by your retirement cases. Auto-enrollment with a one-click opt-out passes; requiring a phone call during business hours fails. The effort to stay out must match the effort to stay in. This also resolves your soda confusion: a tax raises the price but preserves the legal choice (pass); a ban removes the choice entirely (fail). The economic impact on the poor is real, but agency is about legal availability, not purchasing power.

  *Respect Boundaries* is forced by the clear recycling bins and the fake energy report. The bins work via shame and privacy invasion; the fake report works via lying. Both fail, even if the outcome is "good." This clause also kills the tiny grey unsubscribe link (deception/friction) and validates the true energy report (information without lies).

  **The Wellness Email Case**
  This fails **Respect Boundaries**. You noted employees explicitly said "no thanks." Continuing to email them ignores an explicit refusal. The fact that deleting costs "nothing" is irrelevant; it costs attention and signals that their "no" is not binding. Stop the emails.

  **A New Case**
  *Scenario:* You default all employees to have their work anniversaries announced in the company-wide Slack channel, with an opt-out form buried in the HR portal.
  *Verdict:* **Not Permissible.** It fails *Equivalent Effort* (opt-out is buried) and *Respect Boundaries* (privacy/social pressure). Many people dislike public attention; the default should be private unless they opt-in.

  **Incompatibilities and Recommendations**
  My rule cannot accommodate your verdict on the **Savings Plan Creep**. You said it's fine that contributions rise annually unless employees say no each time. Under *Equivalent Effort*, forcing a recurring active choice creates cumulative friction that a static default does not. It relies on inertia fatigue. Strictly speaking, this violates the rule.

  However, the verdict I recommend you throw out is your **hesitation on the Wellness Emails**. You are weighing "it costs them nothing" against "not taking no for an answer." The principle clarifies that ignoring a direct refusal violates dignity regardless of monetary cost. Your gut is right to feel uneasy; silence the doubt and kill the campaign.

  Finally, regarding your "leakiness" observation: don't worry about it. A nudge that evaporates when explained (like the fruit placement) is usually ethical because it relies on convenience, not secrecy. A nudge that works *because* it is hidden (like the grey unsubscribe link) is usually unethical. Transparency is a feature, not a bug.
