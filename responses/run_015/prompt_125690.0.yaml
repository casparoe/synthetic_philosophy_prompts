answer: |-
  # The Stakes Sorting Instrument

  ## Part I: The Ten-Item Quiz

  **Instructions:** Read each vignette carefully. For each, select the single option that best matches your intuitive judgment about the truth of the knowledge claim described. Do not worry about technical terms; answer based on whether the statement seems true, false, or dependent on missing information.

  **1. The Calibration Pair**
  *Case A:* Hannah has checked the bank hours. She needs to deposit a check. If she is wrong about the hours, she waits until tomorrow. No serious harm occurs. She says, "I know the bank is open."
  *Case B:* Hannah has checked the bank hours (same evidence). She needs to deposit a check. If she is wrong, she cannot pay her mortgage and faces foreclosure. She says, "I know the bank is open."
  *   **A.** The statement is true in Case A and false in Case B.
  *   **B.** The statement is true in both cases.
  *   **C.** The statement's truth depends on who is listening to Hannah.

  **2. The Third-Party Audit**
  A nurse checks a patient's chart twice. The patient will die if given the wrong drug (High Stakes for Patient). An auditor reviews the nurse's log the next day for compliance paperwork. For the auditor, being wrong means a minor filing error (Low Stakes for Auditor). The auditor writes: "The nurse knew the drug was safe."
  *   **A.** The auditor's statement is true.
  *   **B.** The auditor's statement is false.
  *   **C.** It depends on whether the auditor is speaking to the hospital board or the patient's family.

  **3. The Future Self**
  A student memorizes a formula today while relaxed. She will not use it until a high-stakes licensing exam next year, where an error ends her career. Today, she tells a friend, "I know this formula is correct."
  *   **A.** She knows it today.
  *   **B.** She does not know it today.
  *   **C.** It depends on whether she is currently thinking about the exam.

  **4. The Epistemic Cascade**
  A mathematician believes a lemma. If the lemma is false, there is no practical harm, but 1,000 downstream proofs she cares deeply about collapse. The evidence is strong but not deductive. She claims, "I know the lemma is true."
  *   **A.** She knows it.
  *   **B.** She does not know it.
  *   **C.** It depends on whether truth is more valuable than practical safety.

  **5. The Secret Wager**
  Mark looks at a clock and says, "I know it is 3:00 PM." Unbeknownst to him, a stranger has bet $1 million that Mark is wrong. Mark has no way of knowing about the bet.
  *   **A.** Mark knows the time.
  *   **B.** Mark does not know the time.
  *   **C.** It depends on whether Mark could have reasonably discovered the bet.

  **6. The Voluntary Wager**
  Two pilots check the fuel gauge. Both have identical evidence. Pilot A bets her life savings that the tank is full. Pilot B makes no bet. Pilot A says, "I know the tank is full."
  *   **A.** Pilot A knows, and Pilot B knows.
  *   **B.** Pilot B knows, but Pilot A does not.
  *   **C.** It depends on whether the bet was rational.

  **7. Opposed Interests**
  A detective investigates a crime. The Prosecutor needs to establish the suspect "knowingly" lied to secure a conviction (High Stakes for State). The Defense Attorney needs to show the suspect "did not know" to avoid intent charges (High Stakes for Defendant). Both look at the same evidence.
  *   **A.** The Prosecutor is right (He knew).
  *   **B.** The Defense Attorney is right (He didn't know).
  *   **C.** It depends on which legal standard is being applied.

  **8. Probability vs. Cost**
  *Case X:* 10% chance of error. Cost of error: $10.
  *Case Y:* 0.0001% chance of error. Cost of error: $10,000,000.
  In both cases, the subject claims, "I know the proposition is true."
  *   **A.** Knowledge is present in Case X but not Case Y.
  *   **B.** Knowledge is present in Case Y but not Case X.
  *   **C.** Knowledge is present in both, or neither, based on evidence alone.

  **9. The Contrast**
  Sarah sees a bird that looks like a goldfinch.
  *Question 1:* Does she know it is a goldfinch *rather than a raven*?
  *Question 2:* Does she know it is a goldfinch *rather than a canary*?
  *   **A.** She knows in both cases.
  *   **B.** She knows in Question 1, but not Question 2.
  *   **C.** It depends on which question the speaker intends to answer.

  **10. The Compounding Risk**
  A worker checks 1,000 screws. Each individual check is low-stakes (one loose screw does nothing). However, if *any* single screw is loose, the machine explodes (High Aggregate Stakes). The worker says of each screw, "I know this one is tight."
  *   **A.** He knows this of every screw.
  *   **B.** He knows this of no screw.
  *   **C.** It depends on whether he considers the screws as a group or individually.

  ***

  ## Part II: The Decision Tree

  This tree classifies respondents based on the logical structure of their answers, not historical labels.

  **Node 1: The Truth-Condition Threshold**
  *Does the practical stakes environment ever change the **truth value** of a knowledge attribution (independent of who is speaking)?*
  *   **NO:** Go to **Node 2 (Invariantism Branch)**.
  *   **YES:** Go to **Node 3 (Stakes-Sensitive Branch)**.

  **Node 2: Invariantism Branch**
  *If stakes do not change truth, why does it **seem** like they do?*
  *   **Pragmatics:** The belief is justified/true, but asserting it is inappropriate in high stakes. -> **Leaf: Classical Invariantism (Pragmatic)**.
  *   **Error Theory:** The intuition that stakes matter is simply a mistake. -> **Leaf: Classical Invariantism (Error-Theoretic)**.
  *   **Doxastic:** Stakes affect whether the subject *believes*, not whether they *know*. -> **Leaf: Doxastic Invariantism**.

  **Node 3: Stakes-Sensitive Branch**
  *Whose practical situation determines the truth of the attribution?*
  *   **The Attributor/Speaker:** The truth depends on the context of the person saying "S knows." -> **Node 4 (Attributor Side)**.
  *   **The Subject:** The truth depends on the practical situation of the person who knows. -> **Node 5 (Subject Side)**.
  *   **The Assessor:** The truth depends on the context of the person evaluating the claim (even later). -> **Leaf: Assessment-Sensitive Relativism**.
  *   **The Contrast:** The truth depends on the alternatives being ruled out. -> **Leaf: Contrastivism**.

  **Node 4: Attributor Side**
  *What changes in the Attributor's context?*
  *   **Standards:** The semantic content of "knows" shifts (higher/lower bar). -> **Leaf: Attributor Contextualism**.
  *   **Relevance:** The set of relevant alternatives shifts based on speaker interests. -> **Leaf: Relevant-Alternatives Contextualism**.

  **Node 5: Subject Side**
  *How do the subject's stakes operate?*
  *   **Encroachment:** Stakes lower the justification required for knowledge. -> **Leaf: Subject-Sensitive Invariantism**.
  *   **Interest-Relative:** Knowledge is defined by what the subject can act on given their interests. -> **Leaf: Interest-Relative Invariantism**.
  *   **Credal Threshold:** Stakes raise the required credence level for knowledge. -> **Leaf: Credal Threshold View**.
  *   **Action-Only:** Stakes determine rational action, not knowledge. -> **Leaf: Pragmatic Encroachment (Action-Only)**.

  ***

  ## Part III: Scoring Key

  Map the respondent's dominant pattern (7/10 or more) to the Leaves below.

  | Leaf | Dominant Answer Pattern | Key Diagnostic Items |
  | :--- | :--- | :--- |
  | **Classical Invariantism (Pragmatic)** | **1B, 2A, 5A, 6A, 8C** | Maintains knowledge is stable; explains hesitation via assertion norms. |
  | **Classical Invariantism (Error)** | **1B, 2A, 5A, 6A, 8C** | Same as Pragmatic, but denies pragmatic explanation; insists intuitions are wrong. |
  | **Doxastic Invariantism** | **1B, 3B, 5A** | Claims high stakes destroy *belief*, preserving knowledge conditions. |
  | **Attributor Contextualism** | **1C, 2C, 3A, 5A, 9C** | Truth varies with speaker/attributor context (Items 1, 2, 9). |
  | **Relevant-Alternatives Contextualism** | **1C, 2C, 9B** | Focuses on which alternatives are salient to the speaker (Item 9 is crucial). |
  | **Assessment-Sensitive Relativism** | **1C, 2C, 7C** | Truth varies by assessor's standard (Item 7 Opposed Interests is key). |
  | **Contrastivism** | **9B, 1C, 2A** | Knowledge is always relative to a contrast class (Item 9 is definitive). |
  | **Subject-Sensitive Invariantism (SSI)** | **1A, 3C, 5A, 6B** | Subject's stakes matter (1A), but unaware stakes do not (5A). |
  | **Interest-Relative Invariantism (IRI)** | **1A, 3C, 6B, 8A** | Knowledge tied to practical reasoning thresholds (Item 8 Prob/Cost is key). |
  | **Credal Threshold View** | **1A, 8B, 10B** | High stakes require higher credence; compounding risk lowers credence (Item 10). |
  | **Pragmatic Encroachment (Action)** | **1A, 6B, 8A, 10B** | Stakes affect rational action, knowledge attribution tracks actionability. |
  | **Unnamed / Hybrid** | Mixed patterns not fitting above. | E.g., Stakes matter for Subject but also for Secret Wager (5B). |

  ***

  ## Part IV: Diagnostics

  ### 1. Internally Unstable Patterns
  The following answer combinations indicate incoherence or confusion regarding the logical space:
  *   **Pattern:** *1A (Stakes Matter) + 5B (Secret Wager Matters).*
      *   **Diagnosis:** **Incoherent.** If the subject is unaware of the stakes (Item 5), those stakes cannot practically influence their reasoning or justification. Holding that knowledge fails here implies knowledge is magic or purely externalist regarding *value*, which contradicts the practical reasoning motivation of Item 1.
  *   **Pattern:** *1A (Stakes Matter) + 6A (Voluntary Wager Doesn't).*
      *   **Diagnosis:** **Unstable.** If stakes determine knowledge (1A), self-imposed stakes (Item 6) should function identically to imposed stakes. Denying this suggests a distinction between "real" and "fake" stakes that undermines the mechanism of encroachment.
  *   **Pattern:** *1B (Invariantism) + 9B (Contrast Sensitivity).*
      *   **Diagnosis:** **Tension.** If knowledge is invariant, the contrast class (Item 9) should not alter the truth value unless one adopts Contrastivism. Holding 1B and 9B requires a complex hybrid view where content is fixed but contrast-sensitive.

  ### 2. Unoccupied but Coherent Space
  *   **The "Future-Stakes Only" View:** (Item 1B + Item 3B).
      *   **Status:** **Unexplored.** Most subject-sensitive views focus on *current* practical reasoning. A view where *future* stakes retroactively negate current knowledge is logically possible but rarely defended, as it violates the principle that knowledge is a current state.
  *   **The "Epistemic Stakes Only" View:** (Item 1B + Item 4B).
      *   **Status:** **Unattractive.** This view holds that practical costs don't matter, but *theoretical* costs do. It is coherent but conflicts with the standard motivation for encroachment (which is usually about action).
  *   **The "Compounding Only" View:** (Item 1B + Item 10B).
      *   **Status:** **Unexplored.** One could argue that single-proposition knowledge is invariant, but aggregate risk (Item 10) changes the epistemic status of a *conjunction*. This is a form of logical omniscience problem rather than stakes encroachment.

  ### 3. Indistinguishable Leaves (Blind Spots)
  This instrument cannot definitively separate the following pairs without further questioning or different case types:

  *   **Subject-Sensitive Invariantism (SSI) vs. Interest-Relative Invariantism (IRI):**
      *   **Reason:** Both locate the stakes in the subject's situation and both predict "Knows" in low stakes and "Doesn't Know" in high stakes (Item 1A, Item 6B).
      *   **Distinction:** SSI typically argues stakes affect *justification*; IRI argues stakes affect the *definition* of knowledge relative to action.
      *   **Required Case:** A case where the subject has high stakes but does not need to *act* (e.g., idle curiosity with severe consequences if wrong). IRI might allow knowledge here; SSI might not.
  *   **Attributor Contextualism vs. Assessment-Sensitive Relativism:**
      *   **Reason:** Both predict context-sensitivity (Item 1C, Item 2C).
      *   **Distinction:** Contextualism ties truth to the *utterance* context; Relativism ties it to the *assessment* context.
      *   **Required Case:** A **Retraction Case**. "I knew it then (low stakes), but I was wrong to say it (high stakes now)." Relativists predict the retraction is appropriate; Contextualists predict it is not. This quiz avoids retraction scenarios to save space.
  *   **Classical Invariantism (Pragmatic) vs. Doxastic Invariantism:**
      *   **Reason:** Both predict "Knows" is true in high stakes (Item 1B), but the subject shouldn't *say* it or *believe* it.
      *   **Distinction:** One blames the tongue (assertion norms), the other blames the mind (belief formation).
      *   **Required Case:** A **Third-Person Attribution**. "She doesn't know, so she shouldn't act." If the invariantist agrees she *shouldn't act* but *does know*, it's Pragmatic. If they say she *doesn't know*, they are not Invariantists. If they say she *doesn't believe*, it's Doxastic. Item 3 probes this slightly, but not definitively.

  ### 4. Special Note on Item 5 (Secret Wager)
  Item 5 is the strongest filter for **Subject-Sensitive** views.
  *   If a respondent answers **5B (Doesn't Know)**, they hold a view where stakes are objective features of the world that affect knowledge regardless of the subject's perspective. This is a rare, radical externalist view (sometimes called "Objective Pragmatic Encroachment").
  *   Most SSI/IRI proponents answer **5A**, as the stakes are not relevant to the subject's reasoning.
  *   Most Contextualists answer **5A** or **5C**, depending on if the *speaker* knows about the wager.

  ### 5. Special Note on Item 8 (Probability vs. Cost)
  Item 8 distinguishes **Credal Threshold** views from **Cost-Only** views.
  *   **Cost-Only (Standard IRI):** High cost raises the bar, regardless of probability. (Prefers 8A).
  *   **Credal/Expected Utility:** High cost can be offset by low probability. (Prefers 8C or 8B).
  *   This item identifies respondents who are thinking in terms of Expected Utility rather than simple "High/Low" stakes binaries.
