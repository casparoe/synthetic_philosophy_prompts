answer: |-
  You have a sharp nose for the blood in the water. As someone who has lived inside this literature for decades, I can tell you that your intuition is correct: the debate is stalled, and it is stalled for reasons that are not purely scientific in the narrow sense. You are asking whether this is a semantic confusion, a metaphysical deadlock, or a clash of explanatory goals.

  Let's do the work. I will steelman both camps to show you where the bodies are buried, then I will dissect your three hypotheses, and finally, I will give you my verdict on what kind of disagreement this is and whether progress is possible.

  ### Steelmanning the Camps

  **The Gene's-Eye View (The Replicator Camp)**
  *The Argument:* Evolution is a process of information accumulation. For adaptation to exist, there must be a substrate that persists long enough to accumulate "design." Genes (or DNA sequences) have high-fidelity replication; groups, organisms, and species generally do not. When a group "reproduces," it is usually just the individuals inside reproducing, or the group fissioning in a way that doesn't preserve group-specific information with high fidelity.
  *The Strength:* This view unifies biology. It explains altruism without mysticism (kin selection). It identifies the *beneficiary* of the evolutionary process. If you ask, "Who is the adaptation *for*?" the answer is almost always the gene.
  *The Steelman:* It is not merely bookkeeping. It is a claim about *evolvability*. A unit that cannot replicate with fidelity cannot be a unit of adaptation in the long run. Therefore, focusing on groups is often focusing on ephemeral statistical artifacts. The gene is the only unit that is causally potent over deep time.

  **The Multilevel Selection View (The Interactor Camp)**
  *The Argument:* Evolution is a causal process of sorting. If variation in a trait causes variation in fitness, and that trait is heritable, selection is occurring. In social species, an individual's fitness often depends on the composition of its group. If groups vary in their composition, and some groups leave more descendant groups (or more individuals) than others, then group-level selection is a real causal force.
  *The Strength:* It captures the phenomenology of biology. Organisms interact in groups. Predators hunt packs. Colonies bud. Ignoring the group structure ignores the actual mechanism of the "sieve."
  *The Steelman:* It is not merely a different lens; it is a claim about *mechanism*. If I intervene on the group structure (e.g., break up the packs), the evolutionary outcome changes, even if the genes remain the same. Therefore, the group is a causal agent in the evolutionary process, distinct from the genes inside it. Reducing everything to genes obscures the actual dynamics of selection.

  ### Evaluating Your Hypotheses

  Now, let's take your three points apart.

  **(1) The Verbal Hypothesis:** *Part of it is verbal — "unit of selection" names at least three different jobs.*
  You are right, but this is no longer the main engine of the stall. In the 1980s and 90s, philosophers (like David Hull and Richard Dawkins) introduced distinctions like *replicator* vs. *interactor* to clean this up. A replicator is what gets copied; an interactor is what faces the environment.
  Most professionals now agree: genes are the primary replicators; organisms (and sometimes groups) are interactors. The debate persists *despite* this terminology. Why? because people still argue over which one deserves the title "Unit of Selection." So, while verbal ambiguity started the fire, it is not the fuel keeping it burning today.

  **(2) The Metaphysical Hypothesis:** *Part of it is a fight about whether the level is a fact of nature or a convention.*
  This is closer to the bone. The Price Equation demonstrates that you can mathematically partition selection into within-group and between-group components in multiple ways. If the math is equivalent, is the choice of level just a human convention?
  The Gene's-Eye camp says: No, there is a fact of the matter. Genes are physically distinct in a way groups are not.
  The MLS camp says: No, there is a fact of the matter. Causal interactions happen at the group level.
  My diagnosis: This is a pseudo-problem generated by expecting a single noun ("Unit") to do the work of a complex process. Nature doesn't have "units"; nature has processes of heredity and interaction. Whether a level is "real" depends on which process you care about. So, it is partially conventional, but constrained by empirical facts about heredity and interaction.

  **(3) The Pragmatic Hypothesis:** *One wants a causal story (interventionist), the other wants predictive bookkeeping.*
  This is your load-bearing claim, but I think you have the labels slightly mixed, or at least oversimplified.
  Both sides want a causal story.
  *   The **MLS camp** wants a *proximate* causal story. They want to describe the mechanism of sorting *here and now*. If group composition changes fitness, that is a causal fact. They are the interventionists: "If I shuffle the groups, evolution changes."
  *   The **Gene's-Eye camp** wants an *ultimate* causal story. They want to explain the *direction* and *purpose* of evolution. They argue that even if group sorting happens, the *response* to that sorting is determined by gene frequencies. They view the group-level description as useful bookkeeping, but not the fundamental driver of design.

  Your hypothesis is strongest here: the stall exists because the two camps are answering different questions. One asks, "How does the sorting happen?" (MLS). The other asks, "What is being optimized?" (Gene's-Eye). Because they don't realize they are answering different questions, they talk past each other.

  ### The Hidden Empirical Question

  You asked if there is a hidden empirical question getting dressed up as a semantic one. **Yes.**

  The empirical question is about **Heredity vs. Interaction.**
  *   **Genes** win on Heredity. They replicate with high fidelity.
  *   **Groups** sometimes win on Interaction. They create the context in which fitness is determined.

  The debate stalls because "Unit of Selection" requires *both* interaction and heredity to function as a unit of *adaptation*.
  *   If you have interaction without heredity (a random crowd of animals), you have selection, but no evolution.
  *   If you have heredity without interaction (genes in a test tube), you have replication, but no selection.

  The empirical fact is that in most biological cases, genes provide the heredity, and organisms/groups provide the interaction. The "fight" is about which of these two necessary conditions grants the title of "Unit."
  *   If you think Heredity is the bottleneck, you are a Gene-Selectionist.
  *   If you think Interaction is the bottleneck, you are an MLS proponent.

  This is not semantic; it is a disagreement about which constraint is the limiting factor in evolution. In cases like eusocial insects or multicellularity, groups *do* acquire high-fidelity heredity (via bottlenecks). In those specific empirical cases, the debate vanishes: the group becomes a genuine unit of adaptation. The stall persists only for the "fuzzy" cases where group heredity is low but group interaction is high.

  ### The Verdict

  What kind of disagreement is this?
  It is a **Pragmatic Disagreement masquerading as an Ontological one.**

  There is no single "Unit of Selection" in nature, just as there is no single "Unit of Weather." You can analyze weather by air molecules, by storm fronts, or by climate zones. Which is the "real" unit? It depends on whether you are trying to predict tomorrow's rain (storm front) or understand thermodynamics (molecules).

  The Gene's-Eye view is the thermodynamics of biology: it explains the long-term flow of information and the existence of design.
  The MLS view is the meteorology of biology: it explains the local dynamics, the storms of social interaction, and the immediate causes of fitness differences.

  Your hypothesis (3) is doing 80% of the work. The Gene's-Eye people are prioritizing the *explanation of adaptation* (which requires fidelity). The MLS people are prioritizing the *description of the evolutionary process* (which requires causal interaction). Neither is wrong, but they are optimizing for different explanatory virtues.

  ### What Counts as Progress?

  Do not hold your breath for a "winner." Another equivalence theorem (like the Price Equation) will not solve this, because everyone already agrees on the math. They disagree on the *interpretation* of the math.

  Progress will come from **Contextualism.**
  We need to stop asking "What is the Unit of Selection?" and start asking "For this specific biological question, which decomposition is more useful?"

  1.  **Interventionist Criteria:** You mentioned this. Yes, this is helpful. If we can empirically demonstrate cases where group-level interventions change outcomes *independently* of individual traits (e.g., via group fission or cultural transmission), we validate MLS for those cases. This moves the debate from "always" to "sometimes."
  2.  **Empirical Cases:** We need more work on the "fuzzy" middle. Multicellularity was once a group; now it's an organism. Why? Because heredity mechanisms evolved to bind the group. Studying that transition is more productive than arguing about the definition.
  3.  **Dissolution:** The best progress would be the field accepting that "Unit of Selection" is a cluster concept. Sometimes it means "Replicator." Sometimes it means "Interactor." Sometimes it means "Beneficiary."

  **My advice for your feature:**
  Don't write it as a fight between two truths. Write it as a fight between two tools. The hammer (Gene's-Eye) says the nail is the most important part of the wall. The saw (MLS) says the stud is the most important part. They are both building the same house. The stall exists because they keep trying to use the saw to hammer and the hammer to saw.

  The "fact of the matter" you are looking for is this: **Selection is a process, not a thing.** You can locate the process at different levels depending on where the heredity and the interaction align. When they align at the group level (like a beehive or a human culture with strong institutions), the group is a unit. When they don't, it isn't. The debate is stalled because people want a universal rule for a context-dependent reality.

  If you want a headline, it isn't "Who Won the Units of Selection War?" It's "Why We Asked the Wrong Question."
