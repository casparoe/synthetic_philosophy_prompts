answer: |-
  Here is the proposed research agenda. It is structured to leverage the specific competencies of the five-person team while forcing the philosophical questions into empirical contact with the generative and perceptual data.

  ### 1. The Necessity of Contrast: Is Letter Identity Computable in Isolation?
  **Ranking Argument:** This is the methodological gatekeeper. If letter identity is fundamentally contrastive (Saussurean), then searching for an intrinsic "a-ness" is a category error, and the generative model must be architected to process glyphs only as members of a set. If identity is intrinsic, the model should be able to classify a single glyph without context. This question must be first because its answer determines the validity of all subsequent inquiries into invariants. If the answer is "Contrastive," Question 2 becomes obsolete.

  *   **Upstream Status:** It dictates the architecture of the generative model (context-aware vs. single-instance) and the design of the psychophysical trials (isolated flash vs. word/face context).
  *   **Feasibility:** High. The model builder can train two parallel architectures (isolated vs. set-based). The psychophysicist can run forced-choice trials on masked glyphs. The type designer can provide minimal pairs that stress the boundary.
  *   **Neglect:** Philosophers often assume intrinsic properties; engineers often assume context. Rarely are they pitted against each other in a controlled generation task.
  *   **18-Month Check:** If the generative model achieves >95% accuracy on isolated 'a's across diverse faces, this question drops, and Question 2 rises to priority. If accuracy remains at chance without context, this finding solidifies, and we move immediately to defining the *scope* of the necessary context (Question 3).
  *   **Confidence:** High.

  ### 2. The Nature of the Invariant: Topology vs. Statistical Cluster
  **Ranking Argument:** This is upstream of the "Style" question. If Question 1 yields an "Intrinsic" result, we must know *what* is being preserved. Is it a topological invariant (the skeleton/connectivity, e.g., the closed counter) or a statistical cluster of geometric features (curvature ratios, stroke contrast)? This distinguishes between a rule-based account (classic structuralism) and a prototype account (connectionism).

  *   **Upstream Status:** You cannot define "Style" (Question 5) until you know what constitutes the "Letter." If the invariant is topological, style is geometric variation. If the invariant is statistical, style is part of the cluster distribution.
  *   **Feasibility:** High. The type designer can manipulate skeletons while holding style constant, and vice versa. The model builder can probe the latent space to see which dimensions correlate with 'a'-classification.
  *   **Neglect:** Psychophysics focuses on recognition speed; philosophy focuses on necessary conditions. Neither often quantifies the *weight* of topological vs. geometric features in category membership.
  *   **18-Month Check:** If the model classifies topologically correct but geometrically bizarre glyphs as 'a' (and humans agree), this rises to the primary definition of the category. If geometric proximity overrides topology, this question is demoted in favor of a purely statistical account of style.
  *   **Confidence:** Medium-High.

  ### 3. The Systemic Constraint: Does the 'o' Determine the 'a'?
  **Ranking Argument:** This addresses the type designer's intuition that a face is a system. It is ranked third because it expands the "Contrast" of Question 1 from "discrimination from neighbors" to "structural harmony." It asks if the identity of 'a' is flexible enough to shift its own boundaries to maintain systemic coherence with 'o', 'n', etc.

  *   **Upstream Status:** It tests the limits of the "Contrastive" finding. If 'a' changes its shape to fit the 'o' while remaining an 'a', identity is not just contrastive but *relational* in a stronger, systemic sense.
  *   **Feasibility:** Medium. Requires the type designer to generate "impossible" faces where the 'a' is optimized for the 'o' but violates standard 'a' norms. The psychophysicist must test if readers accept the deviant 'a' because the *face* feels coherent.
  *   **Neglect:** Highly neglected in philosophy of language, which treats tokens as instances of types, ignoring the *family* constraints of the typeface itself.
  *   **18-Month Check:** If readers reject a coherent 'a' in an incoherent face, but accept an incoherent 'a' in a coherent face, this question moves up, suggesting "Face Identity" precedes "Glyph Identity."
  *   **Confidence:** Medium.

  ### 4. The Authority of Naming: Intention vs. Perception in Boundary Cases
  **Ranking Argument:** This is the "exit ramp" question. It addresses the scenario where the designer intends 'a', the encoding says 'a', but the reader sees 'u'. It is ranked fourth because we must first understand the *mechanisms* of identity (Q1-3) before adjudicating *conflicts* about identity.

  *   **Upstream Status:** It resolves the "wrong question" possibility. If perception consistently overrides intention in the generative model's output, the philosophical account must be reader-centric. If intention (via encoding) overrides perception, it is institutional.
  *   **Feasibility:** High. The team can generate edge-case glyphs (the 'a'/'u' hybrid) and measure the "break point" where perception overrides the Unicode label.
  *   **Neglect:** Philosophy of art focuses on intention; philosophy of mind on perception. Type engineering focuses on encoding. Rarely are the three brought into direct conflict.
  *   **18-Month Check:** If the psychophysical data shows a sharp threshold where 90% of readers see 'u' despite the designer's declaration, this question becomes the primary philosophical output (supporting the "wrong question" conclusion).
  *   **Confidence:** High.

  ### 5. The Specificity of the Artifact: Teleology vs. Natural Kind
  **Ranking Argument:** This is the generalization question. It must be last because we cannot know if letters are special until we know how letter categories work. It asks if the functional optimization of letters (for discriminability) makes them a bad model for "tiger" or "chair."

  *   **Upstream Status:** None. This is a meta-conclusion.
  *   **Feasibility:** Medium. Requires comparative analysis with other category datasets (e.g., animal silhouettes).
  *   **Neglect:** Often assumed rather than tested. Many cognitive scientists assume letters *are* the model for object recognition.
  *   **18-Month Check:** If the model fails to generalize its 'a'-learning rules to non-designed categories (e.g., distinguishing chairs), this question drops, and the project concludes that letterforms are a *sui generis* category.
  *   **Confidence:** Low.

  ***

  ### The Cut: "The Ontology of the Digital Font File"
  **Question to Cut:** *What is the metaphysical status of the font file relative to the rendered glyph?*
  **Reasoning:** This is a fashionable question in digital aesthetics and media archaeology (focusing on code, Bezier curves, and hinting as the "true" object). It is low-yield for this specific brief. The funder asks about *categories* and *identity*, not the medium of instantiation. Whether the 'a' is defined by its PostScript outline, its bitmap render, or its Unicode point is an implementation detail that does not help distinguish intrinsic from contrastive identity. Pursuing this would consume the philosophers' time in technical semantics without advancing the psychophysical or generative modeling goals.

  ***

  ### Confidence and Uncertainty

  **Confidence Levels:**
  *   **Q1 (Contrast):** High. The team composition (Model Builder + Psychophysicist) is uniquely suited to solve this empirically.
  *   **Q2 (Invariant):** Medium-High. Topological features are well-defined, but weighting them is complex.
  *   **Q3 (System):** Medium. "Systemic coherence" is harder to quantify than glyph shape.
  *   **Q4 (Authority):** High. Thresholds are measurable.
  *   **Q5 (Generalization):** Low. Comparative category theory is vast and prone to counter-examples.

  **The Claim I Am Least Sure Of:**
  I am least sure of the ranking of **Question 3 (The Systemic Constraint)** relative to **Question 2 (The Nature of the Invariant)**.
  *Reasoning:* It is possible that "Systemic Constraint" is not a separate question but merely a complex version of "Contrast." If the 'a' depends on the 'o', that is a form of contextual dependency (Q1). If I have misjudged the independence of "System" from "Context," Q3 might be redundant, and Q2 should be the sole follow-up to Q1. However, I have ranked Q3 higher because the Type Designer's insight—that a face is a *system*, not just a bag of contrasting glyphs—suggests a structural dependency that goes beyond mere discrimination, potentially offering a richer philosophical model of relational identity than simple contrast provides. If the pilot data shows no systemic effect, Q3 will be collapsed into Q1.
