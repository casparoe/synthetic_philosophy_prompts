  ***

  # What This Procedure Cannot Do

  **1. It cannot resolve the Rule 43 constitutional crisis.**
  The procedure treats Rule 42 as active for safety (Step 6), but it cannot determine whether Rule 42 actually expired in 2024. That is a question of law, not procedure. If the Charity Commission decides the 61% vote killed Rule 42, any motion processed under Rule 42 was overly cautious but valid. If they decide Rule 42 survived, any motion processed under Rule 41 was void. This procedure pushes that decision to Council; it does not solve it.

  **2. It cannot detect "constructive amendments."**
  A clever member might propose a motion that leaves Rule 1 text untouched but changes the *definition* of a word used in Rule 1 elsewhere in the Rules. Step 4 (Indirect Route) catches obvious attempts, but it relies on the Secretary spotting the semantic link. It will systematically misfire on subtle linguistic traps that achieve a rule change without editing the rule text.

  **3. It cannot stop a sovereign meeting.**
  This procedure is advice, not law. If the AGM votes to ignore the Secretary's recommendation and passes a motion under the wrong procedure, the procedure cannot stop them. It only protects the Secretary from blame and flags the risk of voidness. It has no business pretending to answer the question: "What happens if the members break the rules?" (Answer: They win, until a court says otherwise.)

  **4. It cannot assess Charity Commission substantive risk.**
  Step 3 flags Rule 3 (Objects) for special procedure, but it cannot tell you if the *content* of the change violates charity law. A motion can be procedurally perfect under Rule 42 and still lose your charitable status because the new objects are non-charitable. That requires a solicitor, not a triage checklist.
