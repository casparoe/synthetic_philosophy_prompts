answer: |-
  # Triage Procedure for Proposed Amendments to the Rules

  **Purpose:** To determine whether a motion to amend the Rules is in order, which voting procedure applies, and whether it requires Council review before the Annual General Meeting (AGM).

  **Principle:** No rule can bind a future meeting absolutely unless a higher authority explicitly allows it. Our Rules have no "inviolate level" inside them; therefore, any claim that a rule cannot be changed must be checked against the specific powers granted by the Rules themselves.

  ### Step 1: Notice and Form
  **Question:** Was the motion received sixty days before the AGM, and is the wording clear?
  **Sufficient Answer:** Yes, confirmed by the Secretary's log. The text specifies exactly which Rule is changed and the new wording.
  **If No:** Motion is **Not In Order**. Stop.
  **Judgment Call:** No.

  ### Step 2: The Target Rule
  **Question:** Which Rule number is being amended or added?
  **Sufficient Answer:** A specific Rule number (e.g., Rule 1, Rule 41) or "New Rule".
  **If No:** Motion is **Not In Order** (Vague). Stop.
  **Judgment Call:** No.

  ### Step 3: The Protection Check (Rule 42)
  **Question:** Is the target Rule 1 (Name) or Rule 3 (Objects)?
  **Sufficient Answer:** Yes or No.
  **If Yes:** The motion triggers **Rule 42**. It requires a three-quarters majority at the AGM *and* assent from two-thirds of regional branches.
  **If No:** Proceed to Step 4.
  **Judgment Call:** Yes (See Step 6 regarding Rule 42 validity).
  **Who Signs Off:** Secretary.

  ### Step 4: The Indirect Route Test
  **Question:** Does this motion change a different Rule (e.g., Rule 42) in a way that effectively alters Rule 1 or 3, or removes their protection?
  **Sufficient Answer:** No. The motion only affects the rule it names.
  **If Yes:** This is an **Indirect Amendment**. It must satisfy the requirements of the rule being affected (Rule 1 or 3) even if not directly changing them.
  **Judgment Call:** Yes (Requires interpretation of intent).
  **Who Signs Off:** Secretary, flagged to Council.

  ### Step 5: The Self-Entrenchment Test
  **Question:** Does the motion claim that the new or amended Rule cannot be changed in the future?
  **Sufficient Answer:** No.
  **If Yes:** Check Rule 42. Only Rule 1 and Rule 3 are listed there. A new Rule (e.g., Rule 44) cannot protect itself.
  **Verdict:** The motion is **In Order** only if the entrenchment clause is removed. If retained, it is **Not In Order**.
  **Judgment Call:** No (Strict rule interpretation).
  **Who Signs Off:** Secretary.

  ### Step 6: The Validity of Protection (Rule 43)
  **Question:** Does this motion rely on Rule 42 being active (e.g., changing Rule 1, or changing Rule 42 itself)?
  **Sufficient Answer:** Yes.
  **Risk Check:** Rule 43 required Rule 42 to be reaffirmed by two-thirds at the 2024 AGM. The vote was 61%. Rule 42 may have expired.
  **Action:** If the motion touches Rule 1, 3, or 42, it is **In Order with Conditions**. The Secretary must recommend the stricter procedure (Rule 42) to ensure Charity Commission compliance, but must warn Council that the legal basis is unsettled.
  **Judgment Call:** Yes (Legal risk assessment).
  **Who Signs Off:** Council (must be informed).

  ### Step 7: Politics and Values
  **Question:** Is the motion actually a policy decision disguised as a rule change (e.g., setting a fee level rather than the formula for setting fees)?
  **Sufficient Answer:** No, it establishes a standing rule.
  **If Yes:** This is a matter for debate, not a rule amendment.
  **Verdict:** **Refer to Council** to decide if it belongs in the Rules or the Minutes.
  **Judgment Call:** Yes (Subjective).
  **Who Signs Off:** Council.

  ### Final Output
  *   **In Order:** Proceed to AGM notice.
  *   **In Order with Conditions:** Proceed, but specify voting thresholds clearly in the notice.
  *   **Not In Order:** Return to proposer with reasons.
  *   **Refer to Council:** Pause notice until Council resolves the ambiguity.

  ***

  # Procedure Steps Table

  | Step | Question asked | What counts as a sufficient answer | Verdict if the answer is not forthcoming | Judgment call? (yes/no, and why) | Who signs off |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | 1 | Was the motion received sixty days before the AGM, and is the wording clear? | Yes, confirmed by Secretary's log. Text specifies Rule and wording. | Not In Order. Stop. | No. Factual check. | Secretary |
  | 2 | Which Rule number is being amended or added? | A specific Rule number or "New Rule". | Not In Order (Vague). Stop. | No. Factual check. | Secretary |
  | 3 | Is the target Rule 1 (Name) or Rule 3 (Objects)? | Yes or No. | If Yes, triggers Rule 42 (3/4 AGM + 2/3 Branches). | Yes. Rule 42 status is contested (see Step 6). | Secretary |
  | 4 | Does this motion change a different Rule to effectively alter Rule 1 or 3? | No. The motion only affects the rule it names. | If Yes, treat as Indirect Amendment (must satisfy Rule 42). | Yes. Requires interpretation of intent. | Secretary, flagged to Council |
  | 5 | Does the motion claim that the new Rule cannot be changed in the future? | No. | If Yes, entrenchment is void unless Rule 1 or 3. Not In Order if retained. | No. Strict rule interpretation. | Secretary |
  | 6 | Does this motion rely on Rule 42 being active? | Yes. | If Yes, recommend stricter procedure but warn Council of Rule 43 risk. | Yes. Legal risk assessment on 2024 vote. | Council (must be informed) |
  | 7 | Is the motion a policy decision disguised as a rule change? | No, it establishes a standing rule. | If Yes, Refer to Council. | Yes. Subjective distinction. | Council |

  ***

  # Worked Applications (JSON)

