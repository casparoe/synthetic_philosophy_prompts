      *   *Principle B (Institutional/Social Context over Psychology):* Sincerity of intention is not required for the commitment to exist (Case 5). The social/institutional context matters more than the internal mental state (Case 6 - legal unenforceability doesn't stop it being an undertaking; Case 3 - acting context *does* stop it). So, it's about the *status* of the context, not the mind.
      *   *Principle C (Authority/Positioning):* The speaker must be in a position to bind themselves or the entity they represent. Case 3 fails because the actor isn't in the position to bind the character/self in reality. Case 7 fails because the letter wasn't sent (no position established vis-à-vis the recipient).

