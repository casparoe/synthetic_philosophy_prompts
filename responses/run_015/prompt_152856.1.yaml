      *   *Case 3:* "I promise..." (actor filming) -> **Not a Promise.** (Parasitic speech act; lacks serious intent/context).
      *   *Case 4:* "I promise..." (coma patient, unheard) -> **Promise.** (Crucial: Uptake/hearing *not* required for the *undertaking* to exist, though perhaps for fulfillment. This leans away from strict Gricean uptake requirements).
      *   *Case 5:* "I swear..." (liar, no intention) -> **Promise (insincere).** (Searle's point: You can promise insincerely; the obligation stands even if the psychological state is absent. This is a strong anti-psychologistic signal).
