      *   *Facts:* Automated system, no human authored *this* message, template triggered by cancellation. Operator's conditions allow refunds. Staff honour emails. Customer relied. Refund failed.
      *   *Application of Principle 1 (Publicity):* The email was sent. It was issued. (Passes).
      *   *Application of Principle 2 (Institutional Validity):* Is this "parasitic" like the actor (Case 3)? No, it's real business. Is the "speaker" capable? It's the operator's system. Searle might worry about the lack of psychological state (the server doesn't "intend"). But Case 5 (liar) suggests psychological state isn't strictly necessary for the *obligation* to exist, only the *expression* of it. Case 6 suggests institutional practice trumps legal technicalities.
