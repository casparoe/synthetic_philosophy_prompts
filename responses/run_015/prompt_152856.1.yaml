      *Refining the Theory:* Is it Austin or Scorekeeping? Austin cares about "securing of uptake" in some readings, but Case 4 contradicts that. Searle cares about Intentionality. Case 5 contradicts strict psychological necessity (the obligation survives the lack of intention). This points strongly to a **Normative/Deontic Scorekeeping** view (Brandomian-ish, or a robust Institutional Fact view). The commitment exists because the social game treats it as existing.

