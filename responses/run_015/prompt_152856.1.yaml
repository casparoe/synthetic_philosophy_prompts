      Look at Case 7. "Written in a letter never sent." This establishes the "Launch Condition." It must leave the sphere of private control.
      So, for the automated email: It left the sphere of private control (Sent). It wasn't parasitic (Real business). Sincerity doesn't matter (Case 5).
      The only hurdle is the "Speaker." Does the company speak through the bot? Case 6 suggests institutional standing matters more than individual mental states.
