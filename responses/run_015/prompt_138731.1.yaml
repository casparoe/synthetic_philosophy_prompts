answer: |-
  In the persistent world of *Oldrock*, a decade-old survival server, Admin J deletes "The Vault," a complex automated storage system built by player M over six years. M hasn't logged in for eight months. J deleted it to fix a chunk-loading error that threatened server stability for active players. No one saw the deletion happen. M logged in yesterday, used the warp point next to it, and noticed nothing missing because the warp point still works. J confesses in staff chat. A backup exists from before the deletion, but restoring it means undoing a week's worth of progress on a community rail line that twenty other players have built since the deletion. There is no real-money trade, no external reputation stakes, and M is a grown adult who has expressed no distress because M doesn't know. The staff must vote: restore the Vault and break the Rail, or keep the Rail and leave the Vault deleted.

  ***

  ### The Three Accounts

  **The Skeptic**
  The skeptic looks at *Oldrock* and sees only electricity and agreement. To this view, "The Vault" is not an object; it is a specific arrangement of server data permitted by a End User License Agreement that ultimately reserves the right to change or delete anything at any time. Because no property rights exist outside the contract, and the contract allows administration, no theft or destruction has occurred in any meaningful sense. Bits were changed to improve performance, then bits were offered to be changed back. Since M has not suffered any offline financial loss, physical damage, or psychological distress, nothing of genuine value has been destroyed. The "six years of labor" is a metaphor for time spent interacting with a toy, not an investment in an asset. The Skeptic votes **Do Not Restore**. Restoring costs the twenty rail-builders their week of labor (which is also just time spent, but currently enjoyed), while restoring gains M nothing (since M doesn't know). The net utility of "truth" in a game is zero. Nothing happened worth fixing.

  **The Derivative View**
  This account grants that virtual objects aren't fundamentally real, but insists that human experiences are. Virtual harms matter only insofar as they cause real psychological states: frustration, grief, anger, or loss of enjoyment. Here, the calculus is strictly empirical. Did M suffer? No, because M is unaware. The deletion caused no pain, no frustration, and no loss of future enjoyment, because M's experience of the world is unchanged. Conversely, restoring the Vault *will* cause suffering. The twenty rail-builders will log in to find their work erased. They will feel frustration and loss. Therefore, the derivative harm of restoring outweighs the derivative harm of leaving it deleted. Since the goal of ethics here is to minimize real-world suffering, and the deletion caused none while the repair would cause some, the verdict is **Do Not Restore**. Nothing *much* happened because the only thing that matters—felt experience—remains untouched on one side and damaged on the other.

  **The Constitutive View**
  This view argues that *Oldrock* is not just a toy or a service, but a practice with internal goods and constitutive rules. One of the defining norms of a "survival world" is that player labor creates persistent claims. When a player builds according to the rules, that build becomes part of the world's history and integrity, independent of the player's current attention. Admin J violated a constitutive norm of the practice: administrative restraint and respect for player agency. By deleting the Vault, J treated the world as a sandbox for admins rather than a shared polity. This wrong exists even if M never feels it, because the wrong is against the *integrity of the practice*, not just M's feelings. The rail line is also a good, but it was built on the premise of a stable world; if the staff admits builds can be vanished without consent, the rail line's value is also undermined. Restoring the Vault is not about making M feel better; it is about reaffirming the rules that make *Oldrock* what it is. The verdict is **Restore**. Something real happened: a breach of trust within the practice that warrants repair to maintain the world's coherence.

  ***

  ### The Work-Doing Feature

  The single feature doing the heavy lifting in this case is **Condition 4: The owner never notices (The Epistemic Gap).**

  This is the wedge that drives the Constitutive view apart from the Derivative view. If you delete this feature—if M logs in and immediately screams in chat about the missing Vault—the Derivative view changes its verdict. Suddenly, real psychological harm exists. The Derivative view would likely argue for restoration to alleviate M's distress, aligning it with the Constitutive view. The distinction collapses because both views would agree "repair is owed to stop pain."

  By stipulating that M never knows, you remove the *experience* of harm while leaving the *fact* of deletion intact. The Derivative view is forced to say "no harm, no foul" because it tracks feelings. The Constitutive view is forced to say "foul anyway" because it tracks norms. The Epistemic Gap isolates the moral status of the act from the moral status of the consequence. It forces you to decide if the wrong lies in the *hurt* or in the *breaking*.

  Condition 5 (the backup cost) is necessary to make the choice non-trivial, but Condition 4 is necessary to make the *ethical theories* diverge. Without Condition 4, you aren't testing the reality of virtual objects; you're just testing how much people care about them.

  ***

  ### The Skeptic's Counterattack

  A clever skeptic will not argue about feelings; they will attack the idea of the "Practice."

  Here is the counterattack: *"You claim the server has 'internal norms' that exist independently of the players' awareness. But norms are social facts. They exist only insofar as they are recognized and enforced by the community. If the owner doesn't care, and the community didn't see it, the 'norm' wasn't actually active. You are reifying a rulebook into a moral agent. To say the 'world's integrity' is damaged is a metaphor. Only people can be damaged. If no person recognizes the violation, the violation is ontologically empty. You aren't protecting the practice; you're protecting your own preference for a specific aesthetic of administration. Calling it 'constitutive' just hides the fact that you're privileging the rules over the people playing the game."*

  This works because it challenges the Constitutive view's core premise: that a practice has moral weight separate from the aggregate preferences of its participants. If the participants (including the victim) are indifferent, why does the "practice" matter?

  ***

  ### Seams and Stipulations

  I need to flag where I had to force the verdicts to fit your spec.

  1.  **The Constitutive "Good":** I stipulated that "administrative restraint" is a constitutive norm of *Oldrock*. A skeptic could argue the constitutive norm is actually "server stability" or "admin discretion," in which case J did the *right* thing constitutively. To make the Constitutive view yield "Restore," I had to assume the primary internal good is "player persistence," not "performance." That's a choice I made, not a fact of the case.
  2.  **The Derivative Calculation:** I assumed the rail-builders' frustration outweighs the potential future frustration of M finding out. A sophisticated Derivative view might argue for restoration to prevent *future* derivative harm (if M finds out later). I had to stipulate that the chance of M finding out is negligible to lock the Derivative view into "Do Not Restore."
  3.  **The Skeptic's Consistency:** I assumed the Skeptic cares about "real-world utility." Some skeptics might argue "Do whatever keeps the server running longest," which could go either way. I had to frame the Skeptic as a "hard materialist" to ensure they said "Nothing happened."

  The biggest seam is the Constitutive verdict itself. It requires you to accept that a rule-breaking act is a "real wrong" even if it affects no one's welfare. That is the exact point of your essay. The thought experiment doesn't prove that view is right; it just isolates it so you can defend it without the noise of "but the player was sad."
