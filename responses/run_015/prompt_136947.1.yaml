answer: |-
  MEMORANDUM

  **TO:** Board of Commissioners
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Performance Metrics and Accountability

  I recommend we adopt the "still housed at 12 months" metric as our primary success indicator for Board review effective July 1, but we should stop publishing monthly vacancy targets to staff and instead implement a regime of unannounced operational audits to ensure fairness.

  We need to be honest about why our current dashboard is failing. Two years ago, we switched to "% of units reoccupied within 30 days" to stop a few difficult units from skewing the average. It worked mathematically, but it created a new behavioral problem. Property managers are now meeting the target by reclassifying hard-to-rent units as "offline for modernization." These units disappear from the denominator, making the metric look green while actual availability stagnates. Furthermore, our tenant satisfaction data is unreliable because surveys are distributed at lease signing, before tenants have experienced any maintenance or management issues.

  The proposal to switch to "still housed at 12 months" is a significant improvement because it measures stability rather than turnover speed. However, we must acknowledge the risk raised during our last discussion: if managers are judged on retention, they may begin to "cream-skim" at intake. They might quietly prioritize applicants who appear easiest to house—those with higher incomes or fewer complex needs—while our hardest-to-serve families wait longer. This would undermine our mission even if the numbers look good.

  This brings us to the argument that we should stop publishing these numbers to staff entirely and rely on unannounced audits. This position deserves serious weight. When we tie performance bonuses or reviews to a single number, we incentivize staff to optimize for that number, not for our mission. The "stop measuring" approach recognizes that human judgment and spot checks often catch problems that dashboards hide. It shifts the culture from "hit the target" to "do the work correctly."

  However, completely abandoning metrics leaves the Board without a way to track long-term trends. We need a middle ground that respects the wisdom of the "stop measuring" argument while maintaining accountability.

  Therefore, my recommendation is a hybrid approach:

  1.  **Shift the Metric:** We will track "still housed at 12 months" internally. This will not be a monthly target for property managers, but a quarterly trend line for the Board to ensure we are providing stable housing.
  2.  **Remove the Pressure:** We will stop publishing the vacancy reoccupation rate to staff immediately. This removes the incentive to hide units as "under modernization."
  3.  **Implement Audits:** We will authorize the Executive Director to conduct unannounced audits of unit statuses and intake logs. Auditors will verify that units marked "offline" are actually undergoing work and that intake logs show we are serving families across the full spectrum of need, not just the easiest placements.

  We must be straight about where the gaming will move if we do this. If we measure retention, the gaming shifts to intake (cherry-picking tenants). If we measure vacancy speed, the gaming shifts to unit classification (hiding bad units). If we stop measuring entirely, the risk is complacency. By using retention only for Board oversight and using audits for staff accountability, we reduce the pressure to game the system while keeping eyes on the outcome.

  **Timeline:**

  *   **Thursday Vote:** Approve the shift to "still housed at 12 months" for Board reporting only.
  *   **May 1:** Cease distribution of vacancy reoccupation reports to property managers.
  *   **June 1:** Finalize audit protocol with the Executive Director, ensuring random selection of both unit statuses and applicant files.
  *   **July 1:** First unannounced audits conducted.
  *   **September Board Meeting:** Review first quarter of retention data and audit findings.

  This approach accepts that no number is perfect. It treats the "stop measuring" concern not as an obstacle, but as a necessary check on our desire for simple data. We cannot measure our way to better housing; we have to verify it.
