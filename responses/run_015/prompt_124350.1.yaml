answer: |-
  **Project Proposal: From Story to Statute – Tracking Institutional Sediment**

  **The Pitch**
  Everyone asks whether the Trojan War, King Arthur, or the Exodus *actually* happened. Archaeologists look for walls; philologists argue over text layers. This workshop proposes we stop digging for facts and start looking at function. I'm calling it **institutional sediment**: the specific point where a legend stops being something people tell around a fire and starts functioning as a charter for present obligations, like land rights, tax exemptions, or ritual duties.

  **The Precise Question**
  Under what conditions does a foundational narrative cease to be mere heritage and harden into a binding licence for collective action? Furthermore, does this shift from 'story' to 'statute' operate via the same mechanisms across mythic, heroic, and religious traditions?

  **Why Textual and Archaeological Approaches Don't Settle It**
  Standard historiography treats these narratives as containers of truth to be verified or debunked. If we find no evidence of Hebrews in Sinai, the Exodus is often dismissed as 'false'. But this misses the point. A story doesn't need to be factually accurate to bind a community legally or politically. Textual criticism tells us when a story was written, but not when it became *law*. We need to analyse the reception, not the origin.

  **Methodology**
  Over six months, I'll compare three specific moments of reception where the narrative was weaponised as a charter:
  1.  **Troy:** The Augustan era, where the Aeneid shifted from poetry to a political deed justifying Roman imperialism.
  2.  **Arthur:** The Tudor accession (Henry VII), where Arthurian lineage was used to legitimise land rights and dynastic rule.
  3.  **Exodus:** The Second Temple period, where the narrative hardened into covenantal law governing social obligation.

  I'll look for common triggers: crisis moments, changes in leadership, or external threats that required the story to solidify into duty.

  **Success vs. Failure**
  A useful result looks like a typology of sedimentation. If I can identify shared conditions (e.g., a vacuum of legitimacy requires a mythic fill), that's a win. It gives us a tool to understand modern political mythology too.
  Failure would be proving the cases are too distinct to compare. If the religious weight of the Exodus makes it fundamentally different from the dynastic utility of Arthur, then the model collapses. That's still a result, but it means the workshop needs to pivot to difference rather than similarity.

  **Timeline & Feasibility**
  This is tight but doable for a six-month programme.
  *   **Months 1–2:** Lit review on charter myths and reception theory.
  *   **Months 3–4:** Deep dive into the three case moments (focusing on secondary sources rather than primary translation to save time).
  *   **Months 5–6:** Drafting the framework and organising the workshop materials.

  It's ambitious, but if we stop asking 'did it happen?' and start asking 'what does it do?', we might actually get somewhere. There's alot of ground to cover, but the scope is narrow enough to manage.
