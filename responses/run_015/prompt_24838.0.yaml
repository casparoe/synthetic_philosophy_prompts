          4.  Address the "fixed self" suspicion: Confirm it. The analogy implies a homunculus.
          5.  Address the "job" (no excuses): The analogy actually undermines the radicalness because it allows you to blame the "Author's block" or "Style."
          6.  Address Bad Faith: It splits the self. Bad faith becomes authorial negligence rather than ontological lying.
