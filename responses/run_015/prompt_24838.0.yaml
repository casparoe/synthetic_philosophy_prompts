prompt: |-
  I've been trying to explain Sartre to a friend — the radical freedom thing, the "you are what you choose, there's no fixed human nature under the hood" bit — and I keep reaching for the same analogy because I'm a novelist and it's the the first thing that comes to my head: you're the author of your own life. You're writing your own novel, your character isn't set in stone, you can revise the plot, and so you're responsible for every page. That's how I push back when people say "I'm just anxious, it's my nature" or "my childhood made me this way" — no, you're the author, you wrote that, you can write it differently.

  Can you actually audit this for me, because I have a feeling it's load-bearing in a way I don't want it to be? Give me the correspondance — what's the author, what's the character, what's the manuscript, what's the revision — and then where the mapping breaks, and specifically which breaks matter for the job I'm using it for (licensing "you're radically free and responsible, no excuses") versus which are just surface stuff I can ignore. And I need you to commit here instead of hedging: does the author picture survive once the disanalogies are on the table, or was it quietly doing all the work for the conclusion the whole time? I have a hunch it's smuggling in a fixed authorial self — some you that stands behind the choices and does the choosing — which is exactly the kind of hidden nature I'm trying to argue against, so tell me if I'm right and what that does to the "you're free" conclusion. And what about bad faith specifically — does the author picture actually help me explain bad faith, or does it turn bad faith into something you do to a character instead of something you do to yourself?

  Write it like you're emailing me, not like an essay. No headings, no bullets, no bold, no tables, just continuous prose, the way you'd actually write to a friend. And skip the reading list and citations, I don't need to go read anything, I need you to actually make a call and defend it.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Topic:** Explaining Sartre's concept of radical freedom and existence precedes essence using the analogy "You are the author of your own life."
      *   **User's Role:** Novelist (hence the analogy).
      *   **Goal:** Audit the analogy. Map the components (author, character, manuscript, revision). Identify where the mapping breaks. Determine which breaks matter for the specific purpose (licensing radical freedom/responsibility, no excuses).
      *   **Specific Concern:** The user suspects the analogy smuggles in a fixed "authorial self" (a hidden nature) which contradicts Sartre's claim that there is no fixed human nature.
      *   **Specific Question:** Does the author picture survive the disanalogies? Was it doing all the work? Does it help explain bad faith or obscure it (doing something *to* a character vs. *to* oneself)?
      *   **Constraint:** Write like an email to a friend. No headings, no bullets, no bold, no tables. Continuous prose. No reading list/citations. Make a call and defend it (no hedging).

  2.  **Deconstruct the Analogy vs. Sartrean Philosophy:**
      *   *The Analogy:* You = Author. Life = Novel. Choices = Plot/Text. Past = Written Pages. Future = Unwritten Pages.
      *   *Sartre's Core:* Existence precedes essence. There is no pre-existing "self" or "human nature." We are our actions. Freedom is absolute (within facticity). Bad faith is lying to oneself about this freedom.
      *   *The Problem:* In the analogy, the Author exists *before* the Novel. The Author has intentions, style, capacity, identity *prior* to writing. If You = Author, then You exist prior to your Choices. This implies an "Essence" (the Author) preceding "Existence" (the Life/Text). This contradicts "Existence precedes Essence."
      *   *Bad Faith:* In the analogy, bad faith looks like the Author writing a cliché character and blaming the character. But for Sartre, bad faith is the self deceiving itself. There isn't a split between the deceiver and the deceived. The author analogy creates a split (Author vs. Character) that might make bad faith look like external manipulation rather than internal collapse.

  3.  **Evaluate the "Load-Bearing" Concern:**
      *   The user suspects the analogy is smuggling in a fixed self. They are right.
      *   If the "Author" is the locus of freedom, where does the Author come from? If the Author is fixed, freedom is limited by the Author's nature. If the Author is *also* written, then who is writing the Author?
      *   Sartre says consciousness (nothingness) is the source of freedom. It's not a "thing" (like an author). It's a negation.
      *   The analogy works for *responsibility* (you wrote it, you own it) but fails on *ontology* (who are you before you write?).
      *   For the specific job (licensing "no excuses"), the analogy is dangerous. It encourages the idea that there's a "Real Me" (the Author) behind the "Fake Me" (the Character/Behavior). Sartre says there is no Real Me behind the behavior. There is only the behavior.
      *   Bad Faith: The analogy makes bad faith seem like the Author pretending the Character has no free will. But Sartrean bad faith is the Consciousness pretending it is a Thing (an In-itself). The analogy risks reifying the self into two things (Author and Character) rather than one nothingness pretending to be a thing.

  4.  **Drafting the Response (incorporating constraints):**
