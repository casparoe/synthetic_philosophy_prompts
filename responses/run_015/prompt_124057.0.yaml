  The St. Jude ethics board considers voiding Mr. Henderson's guaranteed palliative care contract to reallocate funds for acute surgeries saving five younger staff members. Henderson bears the immediate cost of lost care. However, the hospital's legacy charter employs a diachronic binding clause: Henderson's past decades of payroll deductions legally bind his current self to his future self, who is currently recognized as one of the five benefit recipients via a deferred trust payout triggered by the fund's solvency. Thus, the person bearing the cost and one benefit receiver are the same individual at different life-stages, linked by the institutional promise. The board must decide whether to breach the contract for the greater numerical good.

  - Utilitarian verdict and why
  Classical utilitarianism mandates approving the reallocation. The calculus is straightforward: five lives saved outweigh one patient's loss of guaranteed comfort, maximizing total aggregate welfare. The diachronic binding is morally irrelevant because utility is impersonal; it does not matter that Henderson's future self gains slightly if his present self suffers greatly, nor that he is numerically identical to one beneficiary. The sum of happiness increases by sacrificing the one stage for the five distinct outcomes. The promise itself holds no intrinsic weight against the tangible benefit of survival. Total utility rises significantly.

  - Separateness objection verdict and why
  The separateness-of-persons objection rejects the aggregation. Even if Present-Henderson and Future-Henderson are linked, Present-Henderson is distinct from the *other* four staff members. Sacrificing a definite claimant for the sake of others violates the boundary between individuals. The diachronic link does not dissolve the separation between Henderson and the four unrelated patients. Treating Henderson as a mere means to save the group disrespects his status as an independent moral agent with inviolable rights grounded in the contract. Rights trump sums here.

  - The feature actually doing the work
  The diachronic binding attempts to blur the victim/beneficiary line, suggesting Henderson partly sacrifices himself for himself. This aims to neutralize the separateness objection by internalizing the cost. However, the moral friction remains because the benefit primarily flows to four *other* people. The link masks the aggregation problem but doesn't solve the injustice of using one person's guaranteed rights to subsidize strangers. It is a distraction.

  - How a utilitarian defender attacks teh case
  A utilitarian defender argues the diachronic link reduces the net harm. If Henderson's future self benefits, the loss is distributed across his own life, making the sacrifice less severe than losing everything to strangers. They claim the separateness objection overstates the boundary; since psychological continuity links Henderson's stages, the "sacrifice" is merely intra-personal resource shifting, rendering the objection weak. Continuity matters more.

  - Bottom line
  Utilitarianism counts heads; separateness protects boundaries. The diachronic link complicates identity but fails to justify sacrificing one for many. Remove the link, and the case reverts to a standard conflict where one distinct person is sacrificed for five others, sharpening the moral disagreement significantly.
