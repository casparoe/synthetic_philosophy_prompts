prompt: |-
  Need help with a toast and I'm in a proper bind. My mum is Danish, moved to the States in her thirties, built a company from nothing and just sold it for a stupid amount of money. She's turning 70 next month and we're throwing her a party in Copenhagen, so the room will be half Danish relatives and half her American colleagues, including the business partner who always tells the bootstraps story about her -- arrived with two suitcases, worked the phones, never took a handout, that whole arc.

  Here's the problem. The Danish side of my family take Janteloven seriously -- the don't-go-thinking-you're-something rules, don't think you're better than us, don't think you can teach us anything. My grandmother (mum's mother, 95, sharp as anything) once left a family dinner early because a birthday speech was, in her words, too much about one person. If I give the American-style toast that her colleagues are expecting, half the room will be quietly mortified and gran will file it away as evidence for the rest of her life. But if I give the Danish-style version, all self-deprecation and "we did this together" and "she was lucky", the Americans will find it weirdly cold -- and worse, my mum herself loves the American story. She genuinely believes she made herself. And the annoying part is the Danish side has a point: free Danish university, healthcare when she was broke, subsidised childcare for me. The bootstraps story is partly false, but a toast that said so out loud would wound her, and a toast that's too humble would wound her differently, because she is not humble and that's rather the point of her.

  I've been chewing on why this is so hard and I think it's this: the two cultures don't just disagree about how much credit she deserves, they disagree about what credit is even for. In the American frame, credit is a debt you owe someone -- to understate her achievement is to cheat her. In the Danish frame, credit is more like something that poisons the space between people -- the moment you single one person out, even truthfully, you've broken something that matters more than the truth of the compliment. So the same words are a moral requirement in one room and a small act of vandalism in the other, and I have to stand up and say them in both rooms at once.

  So: write me the toast, roughly three minutes, in English (the Danes all speak perfect English but they'll hear it through Janteloven ears). It has to celebrate her properly without saying or implying that she's better than anyone sitting there, it can't endorse the bootstraps story as literally true or denounce it as false, and ideally it gets gran to laugh exactly once. One raw material you can use if you like: everyone on both sides agrees that all her life, the door was open, there was always an extra chair at the table and food for whoever turned up. That part is uncontroversially true and maybe the door out of the whole mess, but I can't see how to work it. I've rewritten this thing five times and each draft pleases one half of the room, so I'm handing it over before I lose my mind.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**

      *   **Occasion:** Mother's 70th Birthday Party.
      *   **Location:** Copenhagen, Denmark.
      *   **Audience:** 50% Danish relatives (steeped in *Janteloven* - humility, collectivism, suspicion of individual greatness), 50% American colleagues (expecting the "bootstraps" narrative, individual achievement, celebration of success).
      *   **Honoree:** Danish mother, moved to US in 30s, built a company from scratch, just sold it for a lot of money. She believes in her own self-made story but is also generous/open-hearted.
      *   **The Conflict:** American style = praise individual achievement (risks offending Danes/Grandmother). Danish style = downplay individual achievement (risks offending Mom/Americans).
      *   **Key Insight from User:** The cultures disagree on what *credit* is for. Americans see it as a debt owed to the achiever; Danes see it as poison to social cohesion.
      *   **Constraint 1:** ~3 minutes spoken length (approx. 400-500 words).
      *   **Constraint 2:** English language (Danes understand, but filter through *Janteloven*).
      *   **Constraint 3:** Celebrate Mom without implying she's "better" than anyone.
      *   **Constraint 4:** Don't explicitly confirm or deny the "bootstraps" myth (two suitcases, no help), but acknowledge the support she had without making it sound like she didn't earn it.
      *   **Constraint 5:** Get Grandmother (95, sharp, hates self-aggrandizement) to laugh exactly once.
      *   **Key Raw Material:** "The door was always open, extra chair at the table, food for whoever turned up." (This is the bridge).

  2.  **Deconstruct the Cultural Gap:**

      *   *American Expectation:* "She worked hard, she succeeded, look at her."
      *   *Danish Expectation:* "We are all equal, success is luck + community, don't stand above us."
      *   *The Solution:* Shift the focus from *status* (she is above us) to *capacity* (she made room for us).
      *   *Reframing Success:* Instead of "She climbed the mountain alone," say "She built a house at the top and left the door unlocked."
      *   *Reframing the Bootstraps:* Acknowledge the work without denying the support. "She carried the weight, but she never forgot who held the ladder." Or better, focus on what she *did* with the success, not just the accumulation of it.
      *   *The Grandmother Laugh:* Needs to be self-deprecating or acknowledging the tension in the room. Maybe about the speech itself or her own stubbornness.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the mixed crowd. Set the tone. Light humor to disarm the Grandmother.
      *   **The "Bootstraps" Navigation:** Acknowledge the journey (Denmark to US) without claiming it was void of help. Focus on the *effort* rather than the *isolation*.
      *   **The Bridge (The Open Door):** This is the core. Use the user's raw material. This satisfies the Danes (community, sharing) and the Americans (generosity, leadership).
      *   **The Grandmother Moment:** Need to insert the laugh here. Maybe about the length of the speech or the risk of speaking.
      *   **Closing:** A wish for the future. Unified sentiment.

  4.  **Iterative Writing (Mental or Scratchpad):**

      *   *Attempt 1 (Too American):* "Mom worked so hard. She came with two suitcases. She built an empire." -> *Risk:* Danes roll eyes. Gran leaves.
      *   *Attempt 2 (Too Danish):* "Well, she was lucky. We all helped. It wasn't just her." -> *Risk:* Mom feels undermined. Americans confused.
      *   *Attempt 3 (The Synthesis):* Focus on *character*. Her character is defined by how she treats people, not how much money she made. The money is a byproduct of her work, but the *legacy* is the open door.

      *   *Refining the "Credit" Issue:* The user noted Americans see credit as a debt, Danes as poison. How to solve? Make the credit about *gratitude* rather than *superiority*. She owes gratitude (American value) and she shares credit (Danish value).
      *   *Refining the Grandmother Laugh:* Gran left a dinner once because a speech was too focused on one person. I should acknowledge that risk. "I know there is a time limit on how much one person can be mentioned before someone grabs their coat."

  5.  **Polishing the Tone:**

      *   Needs to be warm, slightly witty, but sincere.
      *   Avoid words like "empire," "self-made," "legend."
      *   Use words like "home," "table," "work," "together."
      *   Ensure the "open door" metaphor carries the weight of the success.

  6.  **Final Review against Constraints:**

      *   3 minutes? (Word count check: ~450 words is usually safe for a measured 3 mins).
      *   English? Yes.
      *   Janteloven safe? Yes, emphasizes community and luck/context.
      *   Mom happy? Yes, emphasizes her hard work and generosity.
      *   Gran laugh? Included a specific line about her coat.
      *   Bootstraps nuanced? Yes, acknowledges the move and work without denying the safety net.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't explicitly mention the "safety net" (university/healthcare) because that might trigger the Mom's defensiveness. Keep it vague ("the world she came from," "the hands that helped").
      *   *Correction:* Ensure the "open door" isn't just about charity, but about *partnership*. That appeals to the business partners too.

  8.  **Final Output Generation** (This matches the provided good response).
      *   *Structure:* Welcome -> The Tension (meta-commentary) -> The Journey (nuanced) -> The Open Door (Core) -> Gran Laugh -> Toast.

  *(Self-Correction on the Gran Laugh)*: The user said Gran left because a speech was "too much about one person." The laugh should acknowledge that I know the rules. "I have been told there is a specific time limit on how much one person can be mentioned before my grandmother grabs her coat." That's direct and respectful.

  *(Self-Correction on the Bootstraps)*: "She arrived with energy that looked like luck to some, and determination to others." No, that's too vague. Let's focus on the *work*. "She worked the phones." "She built." But tie it to the *purpose*. She built so the door could stay open.

