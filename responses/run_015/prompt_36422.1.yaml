answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. For those who do: yes, I am aware of the demographic split in this room.

  I know that in America, a birthday is a moment to highlight the individual. And I know that in Denmark, a birthday is a moment to remember that the individual is actually just a part of the whole. I have been told, quite specifically, that there is a time limit on how much one person can be mentioned before my grandmother grabs her coat. So, Gran, please keep your coat on; I'm getting to the rest of the room.

  Because the truth is, you cannot tell my mother's story without telling all of your stories.

  Yes, she came to America with very little. She worked harder than anyone I know. She built something from nothing. But anyone who knows her also knows she never believed she did it alone. She knows that hard work is a seed, but it needs soil to grow. It needs a place that lets you try. It needs teachers, it needs friends, and it needs a safety net that lets you risk the fall. She is proud of her work, but she is not arrogant about her luck.

  And this is where the two halves of this room actually agree. Because whether you measured her success in dollars or in kindness, the result is the same.

  We all know that throughout her life, the door was open. There was always an extra chair at the table. There was always food for whoever turned up. In business, she treated partners like family. At home, she treated strangers like family. She didn't build her company to close the door behind her; she built it to make sure the table was big enough for everyone.

  To her American colleagues: She is the hardest worker you've ever met.
  To her Danish family: She is the one who never forgot where the chairs came from.

  So, I am not going to toast her success. Success is a number, and numbers are cold.
  I am going to toast her capacity.

  To the capacity to work until your hands are tired, but still have enough energy to set an extra plate. To the courage to leave home, and the wisdom to remember it. And to the open door, which is the only kind of house worth building.

  Skål. Cheers. To Mum.
