      *   *Recommendation:* Approve the 3-year pilot. Condition: Integrated curriculum, not separate class. Milestone: End of Year 2 review.
      *   *Honesty:* We might spend 3 years and still not know if it's "deep restructuring." But we will know if it's useful.

  7.  **Final Polish (incorporating specific constraints):**
