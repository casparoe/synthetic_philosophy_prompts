answer: |-
  INTERNAL MEMORANDUM
  STRICTLY CONFIDENTIAL

  TO: All Contributors
  FROM: Managing Editor
  RE: Contributors' Guide and House Rules
  DATE: [Redacted]

  Pursuant to the principles outlined in the Diagnosis, the following protocols ensure our publication does not inadvertently constitute the public it seeks to critique. The following administrative measures are designed to mitigate the risk of abstraction. Compliance is mandatory.

  1. The Periodical shall not address a readership. There is no public, only single individuals. All text must be addressed to "You," singular. The use of the plural "You" implies a crowd where no one is present.

  2. All contributions must be unsigned. Real names imply responsibility; responsibility implies authority; authority fosters imitation. Imitation is the primary mechanism of leveling. To publish under one's own name is to invite envy.

  3. Contributors must adopt a fresh pseudonym for each issue. This prevents the pseudonym from becoming a personality around which a following might coalesce. The Office of Pen Names will assign these alphabetically to prevent stylistic recognition.

  4. Upon publication, the contributor must submit a letter from said pseudonym disavowing the piece. This ensures the opinion is held without being owned. The disavowal must appear in the subsequent issue, signed by the same pseudonym, stating the previous view was mistaken.

  5. Circulation figures are strictly prohibited. Numbers facilitate comparison; comparison is the machinery of envy. No one must know how many others are reading, as knowledge of others transforms the individual into a subscriber.

  6. Regarding physical distribution: If two subscribers read the same issue in the same room, they constitute an assembly. An assembly is the physical manifestation of the public. This is a breach of the Non-Assembly Protocol.

  7. The Office of Non-Assembly will conduct random Public-Hood Audits. Subscribers found reading in pairs will have their copies recalled immediately to dissolve the gathering. Delivery personnel are instructed to wait until the recipient is alone before handing over the package.

  8. Letters from readers cannot be printed. Correspondence creates a dialogue; dialogue creates a community; community is the public. All mail will be incinerated unread by the Subcommittees on Silence. Receipt of mail will not be acknowledged.

  9. If a satirical paper requests an interview regarding our opposition to the press, the Editor shall deny the interview while explaining why we cannot grant interviews. This clarifies our position without forming one. If pressed, state that the Journal does not exist, despite the interviewer holding it.

  10. Content must avoid exhortation. To urge action is to presume a decision can be made collectively. We offer reflection only. Decision belongs to the individual alone. Any call to action will be redacted by the Board of Passivity.

  11. The Masthead shall remain blank. Listing editors implies leadership. Leadership suggests a hierarchy. Hierarchy is a distraction from the vertical relation to truth. The printing press shall operate without oversight during production hours.

  12. Finally, the existence of this Journal must not become an opinion. If the Journal is discussed, it has become news. If it is news, it is part of the press. Therefore, upon receipt, the subscription is considered cancelled. Renewal forms will not be issued.
