answer: |-
  Your seminar-mate has constructed a classic *reductio ad absurdum* against naive Nagelian reduction, effectively replicating arguments made by Jerry Fodor and Jaegwon Kim. The argument is valid; the premises lead inexorably to the conclusion that reduction is trivial and symmetric. Since you rightly reject the conclusion (7)—reduction is substantive and directional—one of the preceding premises must be false. While you are attached to (1) and (4), the damage is being done by (1). You must reject the definition of reduction as merely connectability (coextensiveness) plus derivability.

  Step (1) looks innocent because it trades on the logical empiricist ideal of scientific unity. It treats reduction as a formal relation between linguistic systems, promising clarity without metaphysical baggage. By defining connectability as simple coextensiveness, it avoids committing to heavy-duty ontological identities. This deflationary appeal is why you adopted it. However, as the argument shows, coextensiveness is too cheap. Infinite disjunctions of physical states are coextensive with special-science predicates, but they do not support the explanatory integration that reduction is supposed to achieve. Step (1) fails because it conflates *extensional equivalence* with *theoretical integration*.

  Rejecting (1) requires replacing connectability and derivability with stricter conditions. Here are two alternatives, priced for their costs.

  The first replacement is **Nomic Necessity and Ontological Identity**. Instead of mere coextensiveness, bridge principles must assert that special-science properties are *identical* to physical properties, or at least nomically necessitated by them. Derivability becomes the demonstration of how the base properties instantiate the target properties via these necessary connections.
  *Cost:* This raises the metaphysical stakes significantly. If bridge principles must be necessary truths, you face the "contingency problem": many special-science laws appear contingent. If you insist on identity, you risk eliminativism. If temperature *is* mean molecular kinetic energy, then any creature without molecules cannot have temperature, threatening the multiple realizability that justifies special sciences in the first place. You save reduction from triviality but potentially lose the autonomy of the special sciences.

  The second replacement is **Mechanistic Explanation**. Here, connectability is replaced by the requirement that the base theory describes the mechanism that constitutes the target phenomenon. Derivability is not just logical entailment but the ability to trace the causal workflow from micro-components to macro-behavior.
  *Cost:* This restricts the scope of reduction. It works beautifully for chemistry reducing to physics or physiology to biology, where mechanisms are discernible. It fails for sciences where mechanisms are opaque or irrelevant, such as evolutionary biology or cosmology. You cannot derive natural selection via mechanistic derivation from quantum mechanics in the way you derive water boiling from molecular kinetics. This account saves the directional intuition of reduction but abandons the hope for a unified account of inter-theoretic relations across all sciences.

  Regarding your attachments: you wished to keep (1) and (4). Step (4) asserts the completeness of physics—the claim that microphysical facts entail all physical facts. This is a metaphysical claim about the world, not a definition of reduction. Step (1) is a conceptual claim about what reduction *is*. The argument shows that if you keep (4) (physical completeness) and accept (1) (naive reduction), you get triviality. Since (4) is the empirical/metaphysical hypothesis you likely want to preserve to maintain a physicalist worldview, (1) is the attachment doing the damage. You cannot keep the deflationary definition of reduction while maintaining that physics is complete and reduction is substantive. You must upgrade your definition of reduction to match the robustness of your physicalism.

  By rejecting (1), you concede that reduction is not merely a logical exercise in rewriting predicates. It is an explanatory achievement that requires bridges to do more than track truth; they must track nature's structure. This saves reduction from symmetry (identities or mechanisms are directional) and triviality (false theories lack realizers, so no identity holds). You lose the simplicity of the textbook Nagelian account, but you gain an account capable of distinguishing physics from phlogiston.

  Verdict: step (1) — coextensiveness insufficient for reduction.
