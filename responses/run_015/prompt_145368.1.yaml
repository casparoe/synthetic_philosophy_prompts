  Let's refine the "Feared Question." It needs to be something that exposes a contradiction in the thesis. If the thesis is "papers don't measure two types," the feared question is "Is your proposal actually just asking for a different kind of just-so story?" No, better: "If the cost is too hard to measure for the second type, isn't that evidence that the signal *isn't* a handicap, but you're insisting it is?" Or simpler: "Does your criterion invalidate the foundational papers you're building on?" Let's go with the validity of the foundational literature.

