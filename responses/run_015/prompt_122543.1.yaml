  Below is the design for your interactive flowchart. It contains 10 decision nodes, 7 terminal leaves, and a mapping key. The structure prioritizes logical commitments over labels, forcing the reader to expose the machinery of their intuition before they land on a named position.

  ### Part 1: The Decision Tree

  | ID | Question Text (Visitor View) | Branch A (Yes/True/First) | Branch B (No/False/Second) | Contested Assumption Flag |
  | :--- | :--- | :--- | :--- | :--- |
  | **N1** | **Action vs. Belief:** Imagine you must write down a probability of Heads to calculate your expected score. In Scenario 1, you are paid once per experiment. In Scenario 2, you are paid every time you wake up. To maximize your score, do you write down a *different number* for Scenario 2 than for Scenario 1? | **Go to N2** (Decision-Relative) | **Go to N3** (Doxastic) | *Assumes credence and betting quotient can come apart.* |
  | **N2** | **Pragmatic Split:** Is this difference because your *belief* about the coin changed, or because the *payoff structure* changed while belief stayed fixed? | **Leaf: Error** (Incoherent) | **Leaf: Decision-Relative** | *None.* |
  | **N3** | **Canonical Evidence:** Sunday night you know P(Heads) = 1/2. You wake up. You learn nothing except "I am experiencing an awakening now." Does this observation make Tails more likely than it was Sunday night? | **Go to N4** (Thirder Path) | **Go to N5** (Halfer Path) | *Assumes "I am awake" is a proposition with truth conditions.* |
  | **N4** | **Noisy Signal (Card):** *Variant:* You are shown a card. It is Blue if this is your first awakening, Green otherwise. The printer is 85% accurate. You see Blue. Do you change your probability for Heads compared to a generic wake-up? | **Go to N6** (Consistent Updater) | **Leaf: No Self-Locating** | *Assumes noisy self-locating info counts as evidence.* |
  | **N5** | **Monday Evidence:** Suppose upon waking, a reliable assistant tells you "It is Monday." Does your probability for Heads change from what it was when you first woke up? | **Go to N7** (Lewisian Path) | **Go to N8** (Double Halfer Path) | *Assumes conditionalization applies to self-locating info.* |
  | **N6** | **Duplication (Copies):** *Variant:* If Heads, 1 copy of you wakes. If Tails, 1,000 subjectively identical copies wake. Is your credence in Heads roughly 1 in 1,001? | **Go to N9** (SIA Path) | **Leaf: Elga Thirder** | *Assumes observer count scales credence linearly.* |
  | **N7** | **Precision:** Is there a single precise number that represents the rational credence, or is rationality satisfied by a range (e.g., between 0.4 and 0.6)? | **Leaf: Lewisian Halfer** | **Leaf: Indeterminate** | *Assumes rationality requires sharp probabilities.* |
  | **N8** | **Noisy Signal (Card):** (Same Card Variant as N4). You see Blue. Do you change your probability for Heads compared to a generic wake-up? | **Go to N10** (Standard Halfer) | **Leaf: No Self-Locating** | *Tests robustness of "No New Evidence" claim.* |
  | **N9** | **Reference Class:** Do you hold this view because you reason as if you were randomly selected from *all possible observers* (across all worlds), or only from observers in the *actual world*? | **Leaf: SIA Thirder** | **Leaf: Elga Thirder** | *Assumes a fact exists about which reference class is correct.* |
  | **N10** | **Precision:** (Same as N7). Is there a single precise number that represents the rational credence, or is rationality satisfied by a range? | **Leaf: Double Halfer** | **Leaf: Indeterminate** | *None.* |

