  ### Part 2: The Leaves (Positions & Awkward Commitments)

  | Leaf Label | Standard Name | The Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **Decision-Relative** | Pragmatist / Instrumentalist | You must tell a friend the coin is 1/2 Heads, but bet as if it is 1/3 Heads, without calling it a strategy. |
  | **Elga Thirder** | Thirder (SSA) | You must explain why 1,000 copies don't make Tails 1,000 times more likely, despite the symmetry. |
  | **SIA Thirder** | Self-Indication Assumption | You must accept that merely existing makes worlds with more observers more likely, risking the "Presumptuous Philosopher" problem. |
  | **Lewisian Halfer** | Halfer (Standard) | You must accept that being told "It is Monday" makes Heads *more* likely (2/3), even though Monday was guaranteed to happen. |
  | **Double Halfer** | Halfer (Strict) | You must accept that learning "It is Monday" provides *no* evidence about the coin, violating standard conditionalization rules. |
  | **Indeterminate** | Imprecise Probabilist | You must tell the group there is no single rational answer, only a permissible range, which frustrates decision-making. |
  | **No Self-Locating** | Eliminator / Nihilist | You must claim the question "What day is it?" or "Am I the first copy?" has no truth value for the agent inside the experiment. |

