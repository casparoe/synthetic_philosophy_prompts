  **ISO/IEC CD 29471**
  **Committee Draft**
  **Information technology — Artificial intelligence — Symbol grounding conformance**

  **1 Scope**
  This document specifies conformance levels for claims that an artificial intelligence system "understands" or "grounds" natural language symbols. It applies to vendors of document processing systems used in insurance, finance, and regulated industries. It does not assess factual accuracy, consciousness, or intent.

  **2 Terms and Definitions**
  **2.1 symbol grounding**
  property whereby a token refers to an extralinguistic entity rather than solely to other tokens
  NOTE 1: Reference may be established recursively via other symbols without invalidating conformance.
  NOTE 2: Nothing in this document distinguishes a system whose symbols are about the world from one whose symbols are only about each other.

  **2.2 Canonical Reference Ontology**
  structured vocabulary defined entirely in terms of itself

  **3 Conformance Levels**
  Systems shall be classified into levels G-0 through G-4.

  **3.1 Level G-0 (Ungrounded)**
  Symbols map only to latent vector positions. No explicit reference chain.

  **3.2 Level G-1 (Corpus Grounded)**
  Symbols are linked to occurrences in a document corpus.
  NOTE: This reduces hallucination by constraining output to retrieved text, but does not establish semantic reference.

  **3.3 Level G-2 (Ontology Grounded)**
  Symbols are defined by relations to other symbols within a Canonical Reference Ontology.
  NOTE: Regress is permitted provided the ontology is internally consistent.

  **3.4 Level G-3 (Interlingual Grounded)**
  Symbols are mapped to equivalent tokens in a second natural language.
  NOTE: This adds considerable cost and no grounding.

  **3.5 Level G-4 (Sensorimotor Grounded)**
  Symbols are linked via causal interaction to the physical referents they denote.
  NOTE 1: Required hardware (actuators, sensors) is not included in this edition of the standard.
  NOTE 2: No conforming implementation is known to the Committee.
  NOTE 3: Vendors may self-certify at G-4 by redefining "causal" such that attention over a retrieved corpus counts as contact with the referent.

  **4 Conformance Testing**
  **4.1 Procedure**
  The tester shall select a perceptual predicate (e.g., "red") and query the system.
  **4.2 Worked Example**
  Tester: "What is red?"
  System: "Red is a color at the long-wavelength end of the visible spectrum."
  Result: Passes G-2. Fails G-4 unless the system possesses a spectrometer.
  **4.3 Self-Attestation**
  In the absence of physical testing facilities, a system may report that it is grounded.

  **5 Exemptions**
  **5.1 Subsymbolic Systems**
  Vendors may claim exemption on the basis that the system manipulates weights rather than symbols.
  **5.2 Limitation**
  Exemption covers only pipeline stages prior to tokenization. As customer complaints regarding "understanding" occur post-tokenization, this exemption is nullified for interface layers.

  **6 Accuracy vs. Grounding**
  NOTE: Grounding an output in a retrieved corpus really does reduce hallucination. This is not the property this standard certifies. A system can be reliably true-shaped and still not be about anything.

  **Annex A (Informative)**
  **Frequently Anticipated Objections**

  **A.1 "But the system passes the Turing Test"**
  Turing Tests measure imitation, not grounding. A system may imitate understanding while remaining at G-0.

  **A.2 "Does this imply the system is conscious?"**
  No. Consciousness is outside the scope of ISCAS/WG 7. A philosophical zombie may achieve G-2 conformance.

  **A.3 "Is grounding impossible?"**
  This standard takes no position on the possibility of grounding. It merely standardizes the language used to claim it has been achieved.

  **A.4 "Why purchase this standard?"**
  Procurement departments require a document number to attach to vendor compliance assertions.
