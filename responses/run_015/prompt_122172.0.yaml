answer: |-
  **Final Exam Prompt – POLI 490: Borders & Belonging**

  **Question 3**
  Consider the framework of 'Intergenerational Territorial Trusteeship.' Under this view, present citizens are not owners of state territory but temporary stewards holding it in trust for unborn future citizens. The stated goal is to preserve cultural and ecological continuity for those who cannot yet consent.

  Does this trusteeship model ultimately strengthen the right to exclude (by treating borders as protective barriers for an inheritance) or undermine it (by binding future generations to a specific political package they never chose)? In your answer, navigate the tension between democratic self-determination and this fiduciary duty. Crucially, identify whether the trustee view smuggles in a rights-claim it pretends to avoid. Does it genuinely protect the future, or does it merely solidify present preferences?

  *(Note: Avoid simply reciting Carens or Wellman. Use them only to contextualize why this new framing succeeds or fails.)*

  ***

  **Model Answer (Draft)**

  The Intergenerational Territorial Trusteeship model attempts to sidestep the stalemate between open borders egalitarianism and associative ownership theories. By framing current citizens as stewards rather than owners, it suggests a fiduciary duty to preserve the territory for future generations. On the surface, this strengthens the right to exclude. If the present generation is liable for handing over a degraded or culturally diluted territory, they possess a defensive mandate to restrict entry. Exclusion becomes a protective mechanism for an inheritance, ensuring that future citizens inherit a coherent political community capable of sustaining their rights. This mirrors Wellman's emphasis on self-determination but shifts the justification from current association to future viability.

  However, this framing quickly undermines the very exclusion it seeks to justify. The core problem is consent. Future citizens do not exist and cannot ratify the terms of the trust. By locking borders today to preserve a specific cultural or ecological status quo, the present generation imposes a paternalistic vision on the future. What if future generations value cosmopolitanism over continuity? What if they view the preserved culture as oppressive? A trusteeship that mandates cultural continuity assumes that the *content* of the inheritance is more important than the *agency* of the heirs. This violates the democratic principle that each generation should determine its own political fate. The fiduciary duty becomes a shackle, binding the unborn to the preferences of the dead.

  The critical failure of the trusteeship model, however, lies in its hidden metaphysics. It pretends to avoid a present-day rights-claim by focusing on the future, but it smuggles one in through the definition of the "trust." Who defines what constitutes "ecological continuity" or "cultural preservation"? inevitably, it is the present citizens. By setting the terms of the trust, the present generation effectively asserts a right to determine the conditions of future membership without future input. This collapses the distinction between stewardship and ownership. The argument claims to be about duty to the future, but it functions as a right of the present to lock in their values.

  This is where the model fails to escape the shadow of associative ownership. It claims to be a neutral fiduciary arrangement, but it is actually a substantive claim about the value of specific cultural forms. It assumes that continuity is inherently good, which is a contestable moral claim, not a neutral administrative duty. Consequently, the trusteeship view does not resolve the tension between self-determination and exclusion; it obscures it. It strengthens exclusion only by relying on a paternalistic assumption that the present knows best what the future needs. Ultimately, the trustee view is unstable. It either admits that present citizens have the right to shape the future (collapsing into a rights-claim) or it admits they cannot bind the future (undermining the right to exclude). It cannot hold both positions without contradiction.

  In conclusion, while Intergenerational Territorial Trusteeship offers a sophisticated rhetorical shift, it does not solve the normative problem of borders. It strengthens exclusion only by disguising present-day preferences as future-oriented duties. Once we recognize that the "trust" is defined entirely by the trustee, the model reveals itself as a form of intergenerational paternalism that violates the democratic self-determination it claims to protect. The right to exclude remains, but its justification is exposed as a hidden rights-claim rather than a genuine fiduciary obligation.

  ***

  **Marking Scheme (out of 25)**

  **1. Argumentation & Structure (8 points)**
  *   **7-8:** Clear thesis, logical flow between strengthening/undermining exclusion.
  *   **5-6:** Good structure but transitions are clunky.
  *   **0-4:** Disorganized or misses the prompt's core tension.

  **2. Navigation of Tension (Self-Determination vs. Fiduciary) (7 points)**
  *   **6-7:** Explicitly analyzes how fiduciary duty conflicts with future democratic agency.
  *   **4-5:** Describes the conflict but doesn't resolve or deepen it.
  *   **0-3:** Treats the two concepts as compatible without question.

  **3. Critical Analysis (The "Smuggled Claim") (10 points)**
  *   **9-10 (A Grade):** **Crucial.** Identifies that the trustee model collapses into paternalism. Spots that defining the "trust" is itself a rights-claim by the present. Shows the view is unstable/not a middle ground.
  *   **6-8 (B Grade):** Describes the trusteeship view accurately and discusses pros/cons. Treats the model as a stable alternative to Carens/Wellman. Misses that the "duty" is actually a disguised "right."
  *   **0-5:** Fails to identify the hidden rights-claim. Accepts the trusteeship framing at face value.

  **Notes for Graders:**
  *   Don't penalize too hard for typos, this is a political theory seminar not comp sci.
  *   If they just summarize Wellman's associative ownership without applying it to the *trusteeship* framing, cap at a B-. They need to engage with the "steward" concept specifically.
  *   The A-range answer must show that the "future" is being used as a weapon by the "present."
