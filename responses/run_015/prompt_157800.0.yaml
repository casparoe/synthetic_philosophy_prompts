      *   *Hybrid Identity:* A court is supposed to be blind; a stage is supposed to be seen. Nuremberg was televised/photographed. It was performative.
      *   *The "Third Axis":* Legitimacy. The Allies needed to show they were better than the Nazis. Punishment wasn't just about the Nazis; it was about validating the Allies' moral authority.

  5.  **Drafting the Response (Iterative Process):**

