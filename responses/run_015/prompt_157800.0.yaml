      *   *Section 2: Consequentialism in the Courtroom.* Focus on Deterrence/Precedent. Map the agents. Highlight the pedagogical function.
      *   *Section 3: The Blind Spots & Temporal Asymmetry.* This is crucial. Address the user's specific point about the past/future tension. Retribution fails because the sovereign (Third Reich) vanished. Consequentialism fails because the future (ICC) wasn't guaranteed.
