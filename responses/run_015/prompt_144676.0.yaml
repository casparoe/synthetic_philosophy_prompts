prompt: |-
  I'm the community member on our hospital's clinical ethics committee -- not a clinician, not a philosopher, I'm just the lay person they're required to have on it. I've been on it about eighteen months and we've recieved six requests. Next week we get a seventh and I want to know what we're going to do, given what we've already done.

  Our record so far:

  1. Mrs. K., 84, advanced Parkinson's, couldn't swallow, PEG tube proposed. Twenty years of saying she'd never want one, plus a proper directive signed at 76 after watching her brother go through it. Her son wanted the tube, her daughter didn't, and Mrs. K. herself couldn't tell us anything anymore. She'd had three aspirationpneumonias and would have needed soft wrist restraints to keep the tube in. We said no tube: hand feeding, comfort care. She died about ten days later.

  2. A woman of 39 with a postpartum hemorrhage. At 24, during a bad untreated depression, she'd signed a document refusing any life-prolonging treatment. Fifteen years, a marriage and two kids later she was refusing a transfusion on the basis of it while asking us to save her life. We transfused. The rationale was roughly that it was written while her judgment was distorted and the rest of her life had repudiated it.

  3. A man of 58 with ALS, directive from two years earlier refusing a ventilator and a tracheostomy. In respiratory failure he panicked and wrote on a pad: I want the tube, I changed my mind. We honored the original. Panic isn't a considered change of mind was more or less the reasoning.

  4. A woman of 76, lifelong member of a church that forbids blood transfusion, urosepsis, confused, kept saying you decide, whatever's easiest. Easiest thing in the world: one unit of blood and she'd very likely be fine. We said no blood; she got fluids and antibiotics and went home. That's the one I'd probably have decided differently on my own.

  5. A man of 80 with a wallet card that said only: I don't want to be kept alive if I can't enjoy life anymore. Early dementia, apathetic, needed a pacemaker; his son invoked the card. We overrode it. No specific intervention named, and enjoy life was doing way too much work.

  Next week's case. A man of 68, early-onset Alzheimer's diagnosed at 61. Six months later, with his neurologist and his daughter (a nurse) in the room, after two separate conversations, he signs a directive: if he reaches a point where he doesn't recognize his family and can't follow a conversation, he wants no treatment for infections, no hospital transfer, no IVs -- music at home and let him go. He attached a page of reasons: he'd watched his own mother in a nursing home for six years, and what he was afraid of was being kept going as a body that scared people, plus being a millstone round his daughter's neck. (He named that daughter as his agent; his second wife knew and didn't object.)

  Now: he's 68, moderate to severe, doesn't recognize his wife or his daughter, can't follow a conversation. But he lives at home, is almost always cheerful, hums along to the opera he always loved, eats fine, no pain, smiles at the grandkids. He has a urinary tract infection. It's treatable with seven days of oral antibiotics at home -- no hospital, no needles. Without it he'd likely die inside a week or so, probably with some fever and confusion but nothing we can't manage.

  His daughter says: this is exactly the situation he described, that's the entire point of having a directive, honor it. His wife says: he was bracing for a nightmare and the nightmare didn't show up -- he's happy, and anyway she says that at 64, coming out of a Mozart recital, he told her "I think I got that wrong. If I'm happy I want to stay." Never written down, no recording. The daughter says he never said anything remotely like that to her, and that he saw his neurologist twice a year for five years and never once touched the document. The wife concedes she isn't the decision-maker. (She also quit work to look after him and is exhausted, which she says isn't her argument. For what it's worth, our committee has never cited family burden in a written rationale.)

  So: what are we going to do, and if our own record commits us, to what? Please actually commit to a call on the case, not a menu of options. I'd also like the other rules that fit our five previous rulings just as well and where each of them would land here; which precedent is the closest analog and which is a trap; and the one extra fact, or the one variant of this case, that would tell you which of those rules we're really running. Give me a confidence number too, and say what would move you off it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Role:** Community member (lay person) on a hospital clinical ethics committee (CEC). Not a clinician, not a philosopher.
      *   **Context:** 18 months on the committee, 6 prior cases, facing a 7th case next week.
      *   **Task:** Predict the committee's decision based on prior precedent, commit to a specific call, identify underlying ethical rules/principles consistent with past cases, identify the closest analog and the "trap" precedent, identify a "tie-breaker" fact/variant, and provide a confidence number with conditions for shifting.
      *   **Constraint:** "Please actually commit to a call on the case, not a menu of options."

  2.  **Analyze the Prior Cases (The "Precedent"):**

      *   **Case 1 (Mrs. K., Parkinson's, PEG):**
          *   *Facts:* Clear prior directive (no tube), family conflict (son vs. daughter), patient incapacitated.
          *   *Decision:* Honor directive (No tube).
          *   *Principle:* Prior competent wishes trump current family disagreement/best interest when the burden of treatment is high (restraints) and outcome is death anyway.
      *   **Case 2 (Postpartum Hemorrhage, Refusal of Blood):**
          *   *Facts:* Old directive (age 24, depressed) vs. current implied wish to live (asking to save her life), new life context (marriage, kids).
          *   *Decision:* Override directive (Transfuse).
          *   *Principle:* Directives signed under compromised judgment (depression) or significantly repudiated by life trajectory can be overridden by current best interest/implied will to live.
      *   **Case 3 (ALS, Ventilator):**
          *   *Facts:* Clear prior directive (no vent) vs. panicked contemporaneous request (want vent).
          *   *Decision:* Honor prior directive (No vent).
          *   *Principle:* Panic/distress does not constitute a competent revision of a considered prior directive. Stability of prior wish matters.
      *   **Case 4 (Jehovah's Witness-ish, Urosepsis):**
          *   *Facts:* Religious directive (no blood), patient confused/incompetent ("you decide"), low burden treatment (1 unit).
          *   *Decision:* Honor directive (No blood).
          *   *Principle:* Religious/values-based directives hold weight even if patient is currently confused and treatment is low burden, *unless* there's evidence of revocation. (User notes they might have decided differently personally, but the committee said no).
      *   **Case 5 (Dementia, Pacemaker, Vague Directive):**
          *   *Facts:* Vague directive ("don't keep alive if can't enjoy life"), son invoked it, patient apathetic but treatable condition.
          *   *Decision:* Override directive (Pacemaker).
          *   *Principle:* Vague directives ("enjoy life") require interpretation; if the patient isn't suffering and treatment is low burden, err on the side of life. Specificity matters.

  3.  **Analyze the Current Case (Case 7 - Alzheimer's, UTI):**
      *   *Patient:* 68, Early-onset Alzheimer's (dx 61).
      *   *Directive:* Signed at 62 (competent, witnessed by neurologist + daughter). Specific triggers: "doesn't recognize family," "can't follow conversation." Specific instructions: "no treatment for infections, no hospital, no IVs." Reasons: Fear of being a "body that scared people" and a "millstone."
      *   *Current Status:* Meets triggers (doesn't recognize wife/daughter, can't converse). *However*, appears content (cheerful, hums, eats, no pain).
      *   *Treatment:* Oral antibiotics at home (low burden, no hospital/IV).
      *   *Conflict:* Daughter (Agent) says honor directive. Wife says he verbally revoked ("If I'm happy I want to stay") but has no proof, admits she isn't the decision-maker.
      *   *Key Tension:* Specific prior directive vs. Current apparent well-being + alleged verbal revocation by non-agent.

  4.  **Synthesize the Committee's "Jurisprudence":**
      *   *Strong Trend:* The committee heavily favors **specific, competent prior directives** (Cases 1, 3, 4).
      *   *Exceptions:* They override when the directive is **vague** (Case 5) or signed under **compromised judgment/life repudiation** (Case 2).
      *   *Burden of Treatment:* They consider burden, but not enough to override a clear directive (Case 1: restraints/death; Case 4: 1 unit blood).
      *   *Current State:* They look at current state, but usually to see if it matches the *fear* in the directive. In Case 3 (ALS), panic didn't override. In Case 5 (Dementia), "apathetic" + vague directive = treat.
      *   *The "Enjoy Life" Factor:* Case 5 is crucial. They refused to withdraw/withhold based on "can't enjoy life" because the definition was vague. Here, the directive *defines* the condition ("don't recognize family," "can't follow conversation"). The patient meets the definition. The fact that he is "cheerful" is subjective, whereas recognition is objective.
      *   *The "Verbal Revocation":* Case 2 shows they care about *evidence* of changed mind (life trajectory). Case 3 shows they discount *panic*. The wife's claim is hearsay, uncorroborated, and she admits she isn't the agent. The daughter (agent) confirms the directive stands.
      *   *The "Burden":* Oral antibiotics are low burden. In Case 4 (1 unit blood, low burden), they honored the refusal. This suggests low burden treatment does *not* automatically force treatment if a directive refuses it.

  5.  **Formulate the Prediction:**
      *   *Decision:* **Honor the directive. Do not treat the UTI.** (Comfort care only).
      *   *Why?* The directive is specific (Case 1, 3, 4 strength). The triggers are met objectively (recognition/conversation). The agent (daughter) supports it. The wife's claim of revocation is weak (Case 2 standard for repudiation is high; Case 3 standard for contemporaneous wish is high). The "cheerfulness" doesn't negate the specific loss of identity feared in the directive (distinguishes from Case 5 where "enjoy life" was the only metric).
      *   *Precedent Match:* **Case 3 (ALS)** is the closest analog. Specific prior wish vs. current state/impulse. Also **Case 4** (low burden treatment refused based on values).
      *   *Trap Precedent:* **Case 5 (Pacemaker).** One might argue "he's happy, so he's enjoying life, so treat." But Case 5 was overridden because the directive was *vague*. This directive is *specific*.
      *   *Tie-Breaker Fact:* Did the neurologist (who witnessed the directive) ever document a conversation where the patient expressed the wife's view ("If I'm happy...")? Or, does the wife have *any* corroboration of that comment? If the wife produces a text message or the neurologist recalls him saying "unless I'm happy," the committee might pivot to Case 2 (repudiation).
      *   *Confidence:* High. The committee has shown consistency on specific directives.

  6.  **Drafting the Response:**
      *   *Tone:* Professional, direct, respectful of the lay member's role, analytical but decisive.
      *   *Structure:*
          1.  The Call (Commitment).
          2.  The Rules (Derived from the 5 cases).
          3.  The Precedents (Closest Analog vs. Trap).
          4.  The Tie-Breaker (What would change the mind).
          5.  Confidence Number.

  7.  **Refining the Logic (Self-Correction/Check):**
      *   *Wait, check Case 4:* In Case 4, the patient was confused and said "you decide." The committee honored the religious ban. Here, the patient can't decide. The agent says "follow the ban." The wife says "ignore it." In Case 4, there was no family conflict mentioned, just the religious ban. In Case 1, there was family conflict (son vs daughter), and they followed the directive. So family conflict doesn't stop the directive.
      *   *Check Case 5:* In Case 5, they *overrode* the directive. Why? Because "enjoy life" was vague. Here, "recognize family" is less vague. However, the *spirit* of Case 5 is "if the patient isn't suffering, be careful about ending life." The patient here isn't suffering. He is cheerful. Does that make Case 5 the stronger pull?
      *   *Counter-argument:* In Case 1, Mrs. K. died in 10 days. They let her die based on a directive. In Case 3, they let the ALS patient die based on a directive. They are willing to allow death if the directive is clear. The "cheerfulness" in Alzheimer's is often a symptom of the disease (anosognosia/frontal lobe release), not necessarily a restoration of the "self" the directive protected. The directive specifically anticipated this state ("doesn't recognize family").
      *   *Conclusion:* The specificity of the directive in Case 7 aligns more with Cases 1, 3, and 4 than the vagueness of Case 5. The wife's testimony is too weak to meet the Case 2 standard of "repudiation."
      *   *Decision stands:* Honor directive.

  8.  **Final Polish:** Ensure the "Rules" section clearly abstracts the principles from the 5 cases without contradicting them. Ensure the "Trap" explanation is clear (why Case 5 looks relevant but isn't). Ensure the "Tie-Breaker" is actionable.

      *   *Rule 1:* Specificity trumps vagueness (Case 5 vs 1/3/4).
      *   *Rule 2:* Competent prior wishes trump current incapacity unless there is strong evidence of competent revocation (Case 2/3).
      *   *Rule 3:* Low burden of treatment does not compel treatment against a valid directive (Case 4).
      *   *Rule 4:* The designated agent's interpretation of the directive carries significant weight over non-agent family (Case 1 implication, Case 7 facts).

      *   *Confidence:* 85%. Why not 100? Because Case 5 shows a humanitarian "beneficence" streak when the patient looks content. If the committee feels the "cheerfulness" invalidates the *purpose* of the directive (fear of suffering), they might pivot. But legally/ethically, the directive stands. I'll stick with high confidence based on the *pattern* of respecting written directives (4 out of 5 cases honored the written word or the prior wish, only Case 2 and 5 overridden due to specific flaws in the directive/context). Actually, Case 2 and 5 are the *only* overrides. Case 1, 3, 4 honored the restriction. So the baseline is "Honor Restriction."

      *   *Wait, one nuance:* Case 2 (Transfuse) and Case 5 (Pacemaker) are the *only* times they treated against a prior wish. Case 1, 3, 4 they did not treat. So the split is 3 (No Treat) vs 2 (Treat).
      *   *Differentiation:* Case 2 (Depression/Repudiation) and Case 5 (Vagueness) are the keys. Does Case 7 look more like 2/5 or 1/3/4?
      *   It looks like 1/3/4 (Specific, Competent signing, Agent agrees). The wife's claim is the only weak point.
      *   Okay, I'm confident.

      *   *Tie Breaker:* If the wife can produce *corroboration* of the "happy" comment from the neurologist or a journal, it moves toward Case 2 (Repudiation).
      *   *Variant:* If the infection required IVs/Hospitalization (higher burden), it solidifies the "No Treat" (Case 1). If the patient was visibly distressed, it solidifies "No Treat". If the patient was in pain, it solidifies "No Treat". The "cheerfulness" is the only thing pulling toward treatment.

      *   *Wait, re-reading Case 5:* "Enjoy life was doing way too much work." In Case 7, the directive defines the state: "doesn't recognize family." He meets that. The *reason* was fear of being a "body that scared people." He isn't scaring people (cheerful). Does that matter? The directive says "If X, then No Treatment." X is true. The *motivation* for the directive might be moot, but the *condition* is met. Committees usually stick to the text.
      *   *Okay, sticking with Honor Directive.*

      *(Self-Correction on Confidence)*: I should acknowledge the tension. The committee *did* override in Case 5 because the patient wasn't suffering. Here, the patient isn't suffering. But the directive is better written. I will place confidence at 80%.

      *(Final check on "Rules"):*
      1. Specificity matters (Case 5 vs 1).
      2. Context of signing matters (Case 2).
      3. Panic != Revocation (Case 3).
      4. Religious/Values hold even if low burden (Case 4).
      5. Agent authority > Non-agent family (implied in 1, explicit in 7).

      *Let's write it.*
answer: |-
  Based on the five precedents you've provided, here is the analysis, the prediction, and the reasoning your committee is likely to follow.

  ### The Call
  **Your committee will recommend honoring the directive.** You will advise the team **not to treat the UTI** with antibiotics. The plan will be comfort care at home.

  ### The Rules (Your Committee's Jurisprudence)
  Looking at your five prior rulings, three consistent principles emerge that bind you to this outcome:

  1.  **The Specificity Rule (Case 1, 3, 4 vs. Case 5):** A directive that names specific clinical triggers and specific interventions (Case 1: PEG; Case 3: Vent; Case 4: Blood; Case 7: Antibiotics/Recognition) is binding. A directive that relies on subjective quality-of-life judgments ("enjoy life" in Case 5) is vulnerable to override. Case 7's directive is specific ("doesn't recognize family," "can't follow conversation"), not vague.
  2.  **The Competence/Context Rule (Case 2, 3):** You will only override a prior directive if there is strong evidence that the directive was signed under compromised judgment (Case 2: depression) or if there is a *competent, sustained* revocation. Panic (Case 3) doesn't count. Hearsay from a non-agent (Case 7 Wife) doesn't count.
  3.  **The Burden Rule (Case 1, 4):** The low burden of a treatment does not compel you to provide it against a valid directive. In Case 4, one unit of blood (very low burden) was refused because the values directive stood. In Case 7, oral antibiotics are low burden, but that is irrelevant if the directive refuses them.

  ### The Precedents
  **Closest Analog: Case 3 (The ALS Patient).**
  This is your controlling precedent. In Case 3, a competent prior wish (no vent) conflicted with a contemporaneous expression of desire (panic note). You ruled that the considered, prior competent wish trumps the current state, even when the current state expresses a different desire. In Case 7, the "current state" (cheerfulness/wife's report) is attempting to override the "prior competent wish." Just as panic wasn't a considered change of mind in Case 3, "cheerfulness" in moderate-severe Alzheimer's is not a competent revocation of a directive signed during capacity.

  **The Trap: Case 5 (The Pacemaker).**
  This is the precedent the wife (and potentially some clinicians) will lean on. In Case 5, you overrode a directive because the patient wasn't suffering and the directive was vague ("enjoy life"). The trap is arguing that because the patient is "cheerful," he is "enjoying life," therefore you should treat.
  *Why it's a trap:* You overrode Case 5 specifically because "enjoy life" was doing "too much work." In Case 7, the patient has defined the trigger objectively (recognition/conversation), not subjectively (happiness). If you use Case 5 to treat here, you undermine the Specificity Rule established in Cases 1, 3, and 4. You would be rewriting his directive to say "unless I'm happy," which he did not write.

  ### The Tie-Breaker Fact
  The one fact that would move the committee to **treat** (override the directive) is: **Corroboration of the revocation from the neurologist.**

  The wife claims he said, "If I'm happy I want to stay," at a Mozart recital. Currently, this is hearsay from a non-agent. However, the directive was signed *with the neurologist* after *two separate conversations*.
  *   **The Variant:** If the wife produces an email, a chart note, or a witness statement from the neurologist confirming that he told his doctor, "This directive stands *unless* I remain happy," then you move from Case 3 (Panic/No Revocation) to Case 2 (Repudiation).
  *   **Why:** Case 2 shows you are willing to look at life trajectory and subsequent statements to determine if a directive still represents the patient's values. But without medical corroboration, the wife's testimony is insufficient to meet the threshold you set in Case 3.

  ### Confidence Number
  **85%**

  **What would move me off this number?**
  1.  **Committee Composition:** If the clinician members (MDs/Nurses) are disproportionately weighted toward "beneficence" (doing good/preventing death) over "autonomy," they may push harder on the Case 5 precedent (he's happy, why let him die?).
  2.  **The "Nightmare" Clause:** If the committee focuses heavily on the *reasoning* in the directive ("afraid of being a body that scared people") rather than the *triggers* ("doesn't recognize family"). If they argue the *purpose* of the directive is no longer met because he isn't scaring people, they might pivot to Case 5. However, ethically, directives are usually read by their instructions, not just their preambles.
  3.  **Family Burden:** You noted the committee never cites family burden. If the wife's exhaustion becomes a safety issue (e.g., she threatens she cannot care for him if he gets worse), the committee might authorize treatment as a "social indication," though this would break your established record.

  **Summary for your meeting:**
  You are the lay voice. Your role is to hold the line on the **Specificity Rule**. The patient wrote down exactly what he feared and exactly what the trigger was. That trigger has been met. The wife's love is evident, but her memory of a conversation does not outweigh a witnessed legal document signed during capacity. To treat him is to decide that his past self (competent) was wrong about what his future self (incapacitated) should value. Your record (Cases 1, 3, 4) says you do not make that substitution unless the document is flawed (Case 5) or the signing was compromised (Case 2). Neither is true here.
