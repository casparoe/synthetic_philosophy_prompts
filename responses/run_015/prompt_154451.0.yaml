answer: |-
  You have made a genuinely sophisticated observation. What you are describing is the difference between the *semantic* function of "true" (what it means) and its *pragmatic* function (what it does in conversation). Your intuition that "true" can be semantically redundant but pragmatically essential is spot on, and it places you in the company of some significant 20th-century philosophy.

  Here is a breakdown of the names, theories, and boundaries regarding the phenomena you have identified.

  ### 1. Does this family of uses have a name?

  There is no single word that captures all three cases, because linguists and philosophers usually split them into two distinct categories. You are rightly sensing a family resemblance, but technically they are handled by different mechanisms.

  **Case 2 (The Textbook): The Quantificational Use**
  This is the most famous use in philosophy of language. Willard Van Orman Quine, a giant of 20th-century logic, argued exactly what you noticed: "Everything in that chapter is true" allows us to generalize over sentences we cannot list.
  *   **Technical Name:** **Substitutional Quantification** or the **Generalizing Device**.
  *   **Why it fits:** You cannot say "P1 and P2 and P3..." if there are too many sentences. "True" acts as a variable binder. It lets you say "For all sentences *s* in chapter 1, *s* is true."

  **Cases 1 & 3 (The Debate & The Chat): The Concessive/Discursive Use**
  This is where your observation about the "hand-over" feel is most acute. In linguistics, this is often analyzed under **Discourse Markers** or **Concessive Markers**.
  *   **Technical Name:** **Concessive 'True'**.
  *   **Why it fits:** In "It's true that P, but Q," the phrase "It's true that" signals that *P* is being moved into the "common ground" (things everyone accepts) specifically so it can be dismissed as irrelevant. It marks *P* as *not the point of contention*.

  **The "Impersonal Feel"**
  There isn't a single standard term for the "no-fault concession" aspect, but in speech act theory, this is described as **Epistemic Distancing**. By saying "It is true that..." rather than "I agree that...", you shift the authority from your personal belief to the objective status of the claim.

  ### 2. Which theory predicts the impersonal feel and the first-person oddity?

  The view your brother's friend described is called **Deflationism** (or the Redundancy Theory). Deflationists say "true" doesn't name a deep property of the world; it's just a logical tool.

  **Does Deflationism predict the "impersonal feel"?**
  *   **Strict Deflationism:** No. Pure deflationism focuses on *truth conditions* (when a sentence is factually correct). It struggles to explain why "It's true that P" feels different from "P" if they mean the same thing.
  *   **Pragmatic Deflationism:** Yes. This is the modern update. It argues that while "true" adds no *semantic content* (it doesn't change the facts), it adds *pragmatic force* (it changes the social move).
  *   **The Prediction:** This view predicts that "true" is a tool for managing the conversation, not just describing the world. It explains the "hand-over": you are marking the sentence as "already settled" so you can pivot to your real point.

  **The First-Person Oddity ("It's true that I have a headache")**
  This is the most philosophically rich part of your observation. The reason "It's true that I have a headache" sounds weird is explained by **Ludwig Wittgenstein** (specifically in *Philosophical Investigations*).
  *   **The Concept:** **Avowals**.
  *   **The Explanation:** When you say "I have a headache," you are not *describing* a fact that could be false; you are *expressing* a state, like crying out "Ouch." It has **first-person authority**.
  *   **Why "True" breaks it:** To say "It is true that..." treats the claim as an objective hypothesis that needs verification. It objectifies your own experience. It sounds like you are observing yourself from the outside. Deflationism doesn't inherently predict this, but Wittgensteinian pragmatics does. It shows that "true" requires a gap between the speaker and the claim—a gap that doesn't exist for immediate sensations.

  ### 3. Does this threaten the idea that "true" adds nothing?

  **Short Answer:** No.
  **Long Answer:** It threatens a *naive* version of the idea, but supports a *sophisticated* one.

  The deflationary claim is that "true" adds no *substantive property*. It doesn't mean "corresponds to reality" or "is coherent." However, deflationists freely admit that "true" has a *logical* and *pragmatic* function.

  Think of it like punctuation. A question mark adds no "content" to a sentence. "You are leaving" and "You are leaving?" involve the same words and facts. But the question mark does *work*: it changes the speech act from an assertion to an inquiry.

  Similarly:
  *   **Semantics (Meaning):** "P" and "It is true that P" have the same truth conditions. (Deflationism holds).
  *   **Pragmatics (Use):** "P" and "It is true that P" perform different social actions. (Your observation holds).

  So, your findings do not disprove deflationism; they simply show that deflationism is a theory about *meaning*, not a theory about *conversation*.

  ### 4. A Proposed Term and Definition

  Since there is no single term that captures the "no-fault concession" and the "impersonal framing" exactly as you described it, I propose we synthesize the linguistic and philosophical terms into a definition that fits your observation.

  **Term:** **Truth as a Discourse Marker (or Illocutionary Truth)**

  **Definition:**
  The use of the predicate "is true" not to ascribe a property to a proposition, but to manage the **status of that proposition within the conversation**. It signals that the proposition is to be treated as part of the **Common Ground** (accepted by all parties) without requiring the speaker to take personal **Epistemic Responsibility** for it.

  **Boundaries (What counts vs. What does not):**

  | **Instance** | **Why it counts** |
  | :--- | :--- |
  | "It's true that the dress code applies, but..." | **Yes.** You are granting the premise to block its inference. You are not "owning" the claim; you are filing it. |
  | "Everything in the chapter is true." | **Yes.** You are generalizing over claims you cannot state. |
  | "It's true, I guess." | **Yes.** You are signaling conversational closure without full endorsement. |
  | "It's true that I have a headache." | **No (Boundary Case).** Fails because there is no epistemic distance. You cannot "grant" your own pain as an objective fact. |
  | "I promise that I will come." | **No.** "True" cannot perform other speech acts like promising. |
  | "It is good that you came." | **No.** "Good" ascribes a value property; "true" ascribes no property, it only frames the sentence. |

  **How it differs from Hedging/Conceding:**
  *   **Vs. "I concede":** "I concede" makes it about *you* (the speaker's change of mind). "It's true" makes it about *the claim* (the claim's objective status). This is the "no-fault" aspect you noticed.
  *   **Vs. "Maybe/Perhaps":** Hedging reduces commitment. "It's true" *increases* the status of the claim (to fact) while simultaneously *decreasing* the speaker's attachment to it.

  ### Summary for Your Investigation

  You have correctly identified that "true" is a **logical device** (for generalization) and a **pragmatic tool** (for conversation management).

  1.  **The Name:** You are looking at the **Concessive Use** and the **Quantificational Use** of the deflationary truth predicate.
  2.  **The Theory:** **Pragmatic Deflationism** combined with **Speech Act Theory**.
  3.  **The First-Person Limit:** This is the realm of **Avowals** (Wittgenstein). "True" requires a gap between speaker and claim; immediate sensations have no gap.
  4.  **The Verdict:** Your observations do not break the theory that "true" adds nothing *semantically*. They prove that "true" does a lot of work *pragmatically*.

  You are doing real philosophy. Keep testing these boundaries; the "first-person oddity" you found is essentially a rediscovery of a problem that occupied Wittgenstein for the last decade of his life.
