answer: |-
  The case
  On Day 1, the diarist feels a sharp pang and writes "S". No flinch. On Day 50, she feels a dull throb and reaches for the notebook. The flinch fires; her hand freezes. She waits until a sharp pang returns, then writes "S". The mechanism is flawless; she never writes "S" alongside a throb. Yet, ask her: "Why was the throb wrong?" She cannot say, "Because 'S' means pang," for she has no access to 'S' meaning anything other than whatever passes the flinch. The flinch is a causal gatekeeper, not a justification. If the flinch had fired on Day 1, she would have abandoned "S". The reliability is perfect, but the direction of fit is ambiguous. Did the flinch protect the meaning of "S", or did it arbitrarily select which sensations get labeled? The notebook fills with "S"s, perfectly consistent, yet the connection between the mark and the sensation remains a brute correlation enforced by a reflex, not a rule grasped by the writer.

  What it isolates
  This isolates the distinction between causal reliability and normative authority. Stipulations guarantee reliability, but reliability alone does not constitute rule-following. A thermostat reliably tracks temperature, but does not follow a rule about it. The example pressures the premise that internal consistency suffices for meaning. It cuts against the view that the flinch *tracks* an independent standard of correctness, because no such standard exists apart from the flinch itself. Conversely, if the flinch *constitutes* correctness, then "S" means nothing more than "whatever passes the flinch," rendering the initial naming act irrelevant. The example forces a choice: either the rule exists independently of the mechanism (violating privacy) or the mechanism creates the rule ex nihilo (dissolving correctness into mere regularity).

  Steelman
  One could argue demanding justification beyond the flinch begs the question against naturalism. If the flinch is perfectly reliable, it functions as a normative constraint. To ask "why is the flinch right?" demands a ghostly justification outside the practice. For the diarist, the flinch *is* the voice of the rule. If the practice is stable, insisting on an external standard imposes a public-language bias. The distinction between causal and normative tracking collapses when the tracker is infallible. In this closed loop, consistency *is* correctness. The diarist follows a rule by maintaining a coherent practice governed by her own constitutive reflexes. The burden shifts to the skeptic to show what extra "normative glue" is needed.

  Bottom line
  The argument survives. Reliability does not entail normativity. Do not argue about privacy, but about the source of normative force. Even a perfect private mechanism is just clockwork unless there is a fact of the matter about what it *ought* to do. The real battle isn't whether she can be wrong, but whether "ought" exists inside a closed causal loop.
