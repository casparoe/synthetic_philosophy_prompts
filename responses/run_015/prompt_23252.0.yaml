answer: |-
  Good morning.

  It is a genuine privilege to stand before a room that is, by my count, half economists and half epistemologists. Usually, when these two groups meet, it is across a conference table, negotiating the terms of a grant, or across the pages of a journal, negotiating the definition of "rationality." Today, however, we are here to negotiate something more fundamental: the nature of knowledge itself, as it is constituted, transmitted, and obscured by the market.

  I am a philosopher of economics. That means I spend a great deal of time thinking about what economic models *say* about the world, rather than just how well they predict it. But for the next twenty minutes, I do not want to offer a critique from the outside. I want to offer an invitation from the inside.

  We are gathered to discuss the Epistemology of Markets. Too often, this phrase is treated as a sub-discipline of the philosophy of science, concerned with how *we* know about markets. But I propose we turn the lens around. I want us to consider the market not merely as an object of study, but as a subject—a cognitive system. Does the market know things? If so, how does it know them? And perhaps most disturbingly, what happens when the market knows too much?

  To begin this inquiry, I want to start with a silence.

  In 1982, Paul Milgrom and Nancy Stokey published a paper that remains one of the most elegant and unsettling results in information economics. It is known as the No-Trade Theorem.

  Let me describe the intuition without the measure-theoretic notation. Imagine a group of traders. They are all rational; they all maximize expected utility. Crucially, they share "common priors." This means that before they received any private information, they all agreed on the probability distribution of the world. Now, suppose some new information enters the system. Some traders get a signal that an asset is undervalued; others get a signal that it is overvalued. They meet to trade.

  The theorem proves that, under these conditions, no trade will occur.

  Why? Because trade is a bet. If I offer to sell you a share at the current price, I am effectively betting that the price is about to fall, or at least that it is higher than the true value. But you are rational. You ask yourself: "Why is she selling to me?" You know that I am not offering this trade out of charity. I must believe I have an informational advantage. But if I have an advantage, and you know I am rational, you must infer that my private signal is better than yours. Therefore, you should not buy. But I know that you know this. So I shouldn't offer.

  In a world of common priors and common knowledge of rationality, the mere offer of trade reveals enough information to cancel the incentive to trade. The only time we trade is if we agree to disagree, but rational agents with common priors cannot agree to disagree.

  For the economists in the room, this is a benchmark result, a sanity check for models of asymmetric information. But for us, as epistemologists, the No-Trade Theorem offers a profound metaphysical claim about market activity.

  It tells us that the *absence* of trade is itself evidence.

  In standard epistemology, we often look for positive assertions—statements, beliefs, justified truths. But the market speaks through action. When the market is silent, when the order book is static, the No-Trade Theorem suggests this is not merely a lack of activity. It is a state of common knowledge. It implies that no agent's private signal has disturbed the marginal conditions of the equilibrium enough to overcome the common knowledge of rationality.

  Silence, in this framework, is not emptiness. It is a roar of consensus. It means that every agent has already fully incorporated the possibility of every other agent's information into their own valuation. The market has already "thought" through the implications of your private signal before you even walked into the room.

  This leads us to a dizzying conclusion: In the idealized efficient market, privacy is impossible. If prices adjust instantly to reflect all available information, then my private research is instantly publicized by my attempt to profit from it.

  And this brings us to the second pillar of our morning: the Grossman–Stiglitz Paradox of 1980.

  If Milgrom and Stokey teach us that trade is impossible when information is fully revealed, Grossman and Stiglitz teach us that information gathering is impossible when prices are fully revealing.

  Consider the standard defense of the efficient market hypothesis: Prices summarize information. We don't need to read every balance sheet of every company in the S&P 500; we just need to look at the price. The price aggregates the dispersed knowledge of millions of investors. It is a sufficient statistic.

  But Grossman and Stiglitz asked a simple, devastating question: If the price perfectly summarizes all private information, why would anyone pay to acquire that information in the first place?

  Information is costly. It takes time, effort, and capital to research a firm, to analyze a macroeconomic trend, to dig through data. If I can look at the market price and see all that information reflected perfectly, I have no incentive to do the digging. I will free-ride on the price.

  But if everyone free-rides, no one gathers information. And if no one gathers information, the price cannot reflect that information. So the price becomes noisy again. Which incentivizes people to gather information. Which makes the price more informative. Which incentivizes people to stop gathering information.

  The paradox is that a fully efficient market is an impossibility. There must be a certain amount of *inefficiency*—a certain amount of profit opportunity left on the table—to compensate the informed traders for the cost of becoming informed. The market must be slightly wrong, just often enough, to justify the cost of making it right.

  For the epistemologists here, notice the structure of this problem. It is not a problem of computational power or transaction costs. It is a problem of *incentivized truth-seeking*. The market does not produce knowledge as a public good; it produces knowledge as a byproduct of private rent-seeking. If you remove the rent, you remove the knowledge.

  This creates a tension that I believe should be the core of our workshop. On one hand, the Milgrom–Stokey theorem suggests that if we are truly rational and share a world, we should not need to trade; we should already agree. On the other hand, the Grossman–Stiglitz paradox suggests that if we do agree—if prices are fully informative—we will cease to produce the knowledge required to sustain that agreement.

  We are caught between a world where trade is impossible because we know too much, and a world where knowledge is impossible because we trade too efficiently.

  Now, I can hear the objection forming among my economist colleagues. I see the slight shift in posture. The objection is this: "These are theorems. They rely on specific, narrow assumptions. Risk-averse traders. Common priors. Rational expectations equilibria. Complete markets. In the real world, traders are overconfident, priors are heterogeneous, and markets are incomplete. Therefore, these paradoxes are artifacts of the model, not features of the world."

  It is a fair objection. And I want to handle it gracefully, because it misses the philosophical point.

  It is true that if you relax the assumption of common priors, trade becomes possible again. If you introduce noise traders—agents who trade for liquidity reasons rather than information—the No-Trade result dissolves. Economists know this. You have built entire careers on adding friction to these frictionless models.

  But to dismiss the paradoxes because the assumptions are "unrealistic" is to misunderstand what the models are doing. They are not attempting to describe the messy reality of the NYSE trading floor. They are describing the *logic* of information aggregation.

  The value of the Milgrom–Stokey and Grossman–Stiglitz results is not that they predict zero trade or zero efficiency. The value is that they isolate the epistemic mechanism of the market. They show us that "efficiency" and "information production" are not naturally harmonious. They are in tension.

  When an economist says, "We just need to add noise traders to fix the No-Trade theorem," the epistemologist should hear: "We need to introduce irrationality to make knowledge possible."

  When an economist says, "Prices are not perfectly efficient, which allows for alpha," the epistemologist should hear: "The market requires error to function."

  This is why the epistemologists in this room should care, even if the models are idealized. Because these models reveal that the standard narrative of the market—as a machine that processes information to find the "true" price—is internally unstable. The market cannot be a perfect knowledge machine, because if it were, it would shut down the very engine that drives it.

  So, where does this leave us? And why are we here for the next two days?

  I am not standing here to declare economics bankrupt. I am standing here to declare that the epistemology of markets is a field that is currently under-theorized, and it requires both of us to fix it.

  The economists in this room possess the rigorous tools to model how agents interact. You know how to build the mechanisms. But often, the epistemic status of the variables in your models is taken for granted. "Information" is treated as a commodity, like wheat or steel, that can be bought and sold. But information is not a commodity. It is a state of mind. It is justification. It is belief.

  The epistemologists in this room possess the rigorous tools to analyze knowledge, belief, and justification. But often, you treat the market as a black box, or as a mere social structure, without engaging with the specific logic of price formation and incentive compatibility.

  We need a shared research program that bridges this gap.

  Imagine a research agenda that asks: How do market institutions transform private justification into public price? Is "price" a form of testimony? If I buy a stock based on a price signal, am I deferring to the epistemic authority of the market? If so, under what conditions is that deference warranted?

  Imagine if we took the Grossman–Stiglitz insight seriously, not as a limit on efficiency, but as a design constraint. If a market requires a certain level of inefficiency to sustain information production, what is the *optimal* level of inefficiency? Is there a normative case for a certain amount of noise? This is not just an economic question; it is a political and ethical one.

  Imagine if we re-examined the No-Trade Theorem through the lens of social epistemology. If trade requires a difference of opinion, and rationality eliminates difference of opinion, then is the volume of trade a measure of our collective irrationality? Or is it a measure of our diverse interpretive frameworks?

  I want to invite you to stop treating these theorems as hurdles to be cleared with more complex math. I want you to treat them as philosophical data.

  To the economists: Do not protect your models from philosophy. The assumptions you make about "common knowledge" or "rational expectations" are heavy philosophical commitments. They deserve to be interrogated, not just calibrated.

  To the epistemologists: Do not dismiss the models as mere formalism. The logic of equilibrium is a logic of mutual belief. It is game theory applied to the mind. You cannot understand modern knowledge without understanding how incentives shape belief formation.

  Over the next two days, we will hear papers on signaling, on learning dynamics, on the ontology of financial instruments. Let us ensure that these conversations do not happen in parallel tracks. Let us not have the economists speaking to economists in the morning, and the philosophers speaking to philosophers in the afternoon.

  The Milgrom–Stokey theorem tells us that in a world of perfect knowledge, silence prevails. The Grossman–Stiglitz paradox tells us that in a world of perfect silence, knowledge dies.

  The market, therefore, exists in the noise. It exists in the gap between what is known and what is priced. It exists in the friction.

  Our task is not to eliminate the friction. Our task is to understand it. We are here to study the epistemology of the noise.

  Thank you. I look forward to our collaboration.
