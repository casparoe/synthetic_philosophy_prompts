      *   *Check:* Is the ending strong? *Fix:* End on the idea of "Epistemology of Markets" as a living field, not just a critique.

  8.  **Final Word Count Check:** A 20-minute speech is usually around 2,400 to 2,800 words. I will aim for that range to ensure it doesn't run long or feel rushed. (Actually, for a keynote, speaking slightly slower is better, so maybe 2,500 is the sweet spot).

