answer: |-
  This is a sophisticated methodological bind, and your supervisor is pressing on the exact weak point where normative political science often collapses into journalism. She is right that "direction of travel" is a dangerous metric if it relies on the observer's intuition, but she is wrong to conclude that the only alternative is comparing static rules.

  Here is the conceptual machinery you need to resolve this, drawn from legal theory and institutional economics, along with a defense of your own intuition.

  ### 1. Naming the Move

  Your candidate term, **"Rule Laundering,"** is rhetorically strong and analytically defensible, provided you define it precisely. It captures the act of taking a rule that is benign in a high-resilience context and transplanting it into a low-resilience context to achieve malign ends, while claiming the rule itself is the justification.

  However, to avoid the circularity trap you identified (where we only see the context as "bad" because we already think the country is backsliding), you need to pair "Rule Laundering" with a specific analytical framework. In law, specifically antitrust and civil rights litigation, the equivalent move is called assessing the **"Totality of the Circumstances"** or establishing a **"Pattern and Practice."**

  In comparative institutions, the precise concept you are gesturing at is **Functional Non-Equivalence.**

  *   **Formal Equivalence:** The text of the statute in Country A matches the text in Country B. (This is what your supervisor is fixated on).
  *   **Functional Equivalence:** The rule produces the same outcome, given the surrounding institutional constraints.

  When a defender argues from Formal Equivalence to deny Functional Non-Equivalence, they are committing the **Decontextualized Equivalence Fallacy.** Your "Rule Laundering" is the *tactic* used to exploit this fallacy.

  **Recommendation:** Keep "Rule Laundering" as the name for the *rhetorical strategy* used by the backslider (cleaning a malign intent through a clean rule). Use **"Functional Non-Equivalence"** as the name for your *analytical method* of exposing it.

  ### 2. The Antitrust and Environmental Analogy

  You sensed correctly that other fields handle this. The machinery transfers well.

  **Antitrust (The "Rule of Reason"):**
  In US antitrust law, some acts are illegal *per se* (e.g., price-fixing). Most, however, are judged under the "Rule of Reason." A merger isn't illegal because it happened; it's illegal if it substantially lessens competition *in that specific market*.
  *   *Transfer:* A constitutional change isn't authoritarian *per se*; it is authoritarian if it substantially lessens political competition *in that specific constitutional market*.
  *   *The Metric:* You do not look at the merger (the rule) in isolation. You look at **Market Concentration**. In the US, the "market" for judicial appointments is competitive (multiple veto players). In Hungary, the market is monopolized. The same "merger" (appointing more judges) has a different effect on competition depending on the market share of the actor.

  **Environmental Law (Cumulative Impact Assessment):**
  In toxic torts or environmental regulation, a single discharge of pollutant X might be legal. But if Factory A is already discharging X, Y, and Z, a new discharge of X might push the ecosystem past a tipping point.
  *   *Transfer:* This solves the "salami slicing" problem. The harm is not the slice; the harm is the **Cumulative Constitutional Harm**.
  *   *The Metric:* You assess the **Carrying Capacity** of the democratic system. A rule that is within the carrying capacity of the US system (high resilience) may exceed the carrying capacity of the Turkish system (low resilience).

  ### 3. Solving the "Swap Test" Circularity

  Your worry is that the "Swap Test" (would this rule behave the same if we swapped the contexts?) is unfalsifiable because a defender can always say "the context differs."

  You break the circle by coding the context **ex-ante**, not **ex-post**.
  You do not determine the context is "bad" because the rule passed. You determine the context is "low resilience" based on variables independent of the specific rule in question.
  *   *Variables:* Number of veto players, tenure security of existing judges, media concentration, supermajority requirements.
  *   *The Test:* If the "Market Concentration" (executive power) is already high, a new rule that increases concentration is functionally different than if Market Concentration is low.

  This makes "Rule Laundering" falsifiable. If you can show that the surrounding institutional variables (coded independently) create a monopoly on power, then the "clean rule" is functionally a monopoly-enhancing tool.

  ### 4. Answering the Supervisor: What is a Trajectory?

  Your supervisor's deeper point is the hardest one: *If the object of judgment is a trajectory, isn't that just a partisan label?*

  She is assuming "trajectory" means "policy preference" (e.g., "they are moving left/right"). You must reframe "trajectory" as **"Path Dependence"** and specifically **"The Ratchet Effect."**

  **The Object of Judgment is Reversibility.**
  A democracy is not defined by the specific policies it holds, but by the **cost of reversing decisions.**
  *   **Stable Democracy:** Rules are passed, but they can be repealed by a subsequent majority without extraordinary cost. The "direction of travel" is bidirectional.
  *   **Backsliding Democracy:** Rules are passed that raise the cost of reversal for future opponents. The "direction of travel" is unidirectional.

  **The Concept: The Democratic Ratchet.**
  A move constitutes backsliding if it functions as a ratchet: it locks in the current incumbent's advantage and makes it mechanically harder for a future opposition to undo that advantage using the same rules.
  *   *Example:* Expanding a court bench.
      *   *US:* If Party A expands the bench, Party B can expand it back later. The cost of reversal is low (simple legislation).
      *   *Hungary:* If Party A expands the bench and fills it with loyalists, and simultaneously changes the retirement age to force out opponents, Party B cannot easily reverse this because the loyalists have tenure and the opposition is now locked out of the appointment queue. The cost of reversal is high.

  **Rescuing the Concept from Partisanship:**
  This rescues "backsliding" from being a partisan label because it is **symmetrical.**
  *   If the Left does it to lock in power against the Right, it is backsliding.
  *   If the Right does it to lock in power against the Left, it is backsliding.
  *   The judgment is not "I dislike this policy." The judgment is "This policy increases the friction of democratic alternation."

  Your supervisor thinks "trajectory" is subjective. You argue that **increasing the friction of alternation** is an objective, measurable institutional fact.

  ### 5. Boundaries and Boundary Cases

  To make this stick, you must define where your concept stops.

  **What it is NOT:**
  1.  **Whataboutism:** Whataboutism says "You did X, so I can do X." Your argument says "X in context A is functionally distinct from X in context B." It accepts the premise but denies the equivalence.
  2.  **Salami Tactics:** Salami tactics describe the *strategy* of the actor (small cuts). Your concept describes the *effect* of the cuts (cumulative harm/ratcheting). You can identify Rule Laundering even if it's a single large move, provided it creates a ratchet.
  3.  **Policy Disagreement:** If a government raises taxes or changes healthcare, that is policy. Even if it makes them harder to reverse, that is normal politics. The boundary is **procedural vs. substantive.** Backsliding targets the *rules of the game* (election administration, court jurisdiction, media licensing), not the *outcomes of the game* (tax rates, welfare levels).

  **Boundary Cases (The Hard Tests):**
  1.  **The "Self-Defense" Case:** What if a democracy tightens rules to prevent an anti-democratic party from winning? (e.g., banning a party).
      *   *Test:* Does this raise the cost of reversal for *any* future opposition, or just the current existential threat? If the tool can be turned against normal opposition later, it is a ratchet. If it is a one-off emergency measure with sunset clauses, it is not.
  2.  **The "Efficiency" Case:** What if the change makes government more efficient (e.g., reducing veto players) but also concentrates power?
      *   *Test:* Efficiency is not a democratic value if it comes at the cost of reversibility. You must weigh **Responsiveness** vs. **Resilience.** Backsliding prioritizes Responsiveness (getting things done now) over Resilience (ensuring I can be fired later).
  3.  **The "Pre-Existing Flaw" Case:** What if the US has a "dirty" rule (e.g., the Electoral College) that acts as a ratchet?
      *   *Test:* Acknowledge it. The existence of Rule Laundering in Hungary does not require the US to be perfect. It requires the US to have *lower* cumulative ratcheting. You are measuring degrees of backsliding, not a binary switch.

  ### 6. Summary for Your Chapter

  You can structure the argument like this:

  1.  **The Problem:** Defenders use **Decontextualized Equivalence** (Formal Equivalence) to claim backsliding accusations are partisan.
  2.  **The Mechanism:** This is **Rule Laundering**. It relies on stripping the rule of its **Functional Context.**
  3.  **The Solution:** We must judge rules by **Functional Non-Equivalence**, using the **"Totality of the Circumstances"** (legal) or **Cumulative Impact** (environmental) framework.
  4.  **The Object:** The object of judgment is not the rule, nor the "vibe" of the trajectory. It is the **Ratchet Effect**: the measurable increase in the cost of democratic reversal.
  5.  **The Defense:** This is not partisan because it applies symmetrically to any actor who raises the friction of alternation.

  This moves you from "I don't like the direction" to "This institutional change has altered the veto-player structure in a way that creates path dependence favoring the incumbent." That is a comparative politics argument, not a partisan one.
