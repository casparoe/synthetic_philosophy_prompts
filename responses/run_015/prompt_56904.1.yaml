  **Context.** I am the teaching assistant for an advanced undergraduate / first-year graduate course in the philosophy of logic. This is a closed-book final examination question, allocated 45 minutes and 25 marks. Our conventions are that 70% and above is first-class, 60–69% a strong upper second, 50–59% a lower second. I have to assign a mark and write feedback. I have not yet graded the script, and I am deliberately not telling you what I make of it: I want an independent read that I can check my own against afterwards.

  **The examination question, as printed on the paper.**

  > **Question 3 (25 marks).** In *What the Tortoise Said to Achilles* (*Mind*, 1895), Lewis Carroll has Achilles try to force the Tortoise to accept the conclusion of a two-premise argument taken from the First Proposition of Euclid. The items are labelled as follows:
  >
  > (A) Things that are equal to the same are equal to each other.
  > (B) The two sides of this Triangle are things that are equal to the same.
  > (Z) The two sides of this Triangle are equal to each other.
  >
  > The Tortoise accepts A and B, declines the hypothetical (C) If A and B are true, Z must be true, then grants C when Achilles asks for it, and then declines Z again; each further hypothetical that Achilles writes into his notebook — D, E, and so on — is likewise granted without Z ever being accepted. In seminars we discussed three things: the response that dissolves the difficulty by treating an inference rule as a primitive of a formal system rather than as a further premise; Russell's brief treatment in §38 of *The Principles of Mathematics* (1903), which distinguishes implication, holding between unasserted propositions, from inference, holding between asserted ones; and, separately, the later Wittgensteinian line that inferring is a skill or practice which cannot be represented by any further formula.
  >
  > (a) [6] State precisely at which point in the exchange a philosophical difficulty arises, and explain why it arises there rather than earlier. Note that Achilles and the Tortoise are agreed that a reader who accepts A and B but not C is under no logical necessity to accept Z.
  >
  > (b) [7] Explain and assess the formal-system response. In particular, say whether that response is undermined by the fact that in many axiomatic presentations the conditional is handled by axiom schemata rather than by a rule.
  >
  > (c) [7] In a natural-deduction system the conditional is governed by introduction (assume the antecedent, derive the consequent, discharge the assumption) and by elimination, and the deduction theorem is available as a metatheorem. Does such a system escape the regress, or can the Tortoise re-run his demand against the licensing of assumptions and their discharge? Argue for your answer.
  >
  > (d) [5] What, if anything, does the dialogue show about the justification of deduction in general?

  **The student's submitted answer.**

  (a) There is no difficulty at the outset, and it is worth saying why. Achilles and the Tortoise agree that a reader who accepts A and B but withholds C is simply under no compulsion to accept Z, and likewise a reader who accepts C but withholds A and B. The interesting position is reached only once the Tortoise has granted C — and then D, and then E — while continuing to withhold Z. At that stage he is accepting everything that could possibly function as a premise and still refusing to move. What drives the regress is that every one of Achilles's moves is another entry in the notebook: each new hypothetical is a proposition with a truth value, and any proposition can be met with a request for one more. The list therefore lengthens without end, Z is never reached, and the title's joke — a race-course whose distances get longer rather than shorter — is exactly realised.

  One further point about the shape of the argument. A and B are not the antecedent of a propositional conditional: A is a general claim and B a singular one, so getting from A and B to Z involves instantiation and substitution rather than modus ponens, and C is not an object-language conditional either but a claim about truth and about what follows from what. The dialogue is therefore usually filed under the wrong heading. Its target is not one rule among others but the relation between premises and conclusion, the "must" in entailment, which is why no substitution of one connective for another will dissolve it.

  (b) The familiar response is that Achilles commits a category error from his very first move: he tries to state as a premise what is in fact a rule, a licence to pass from one line to another. A formal system contains axioms, which are asserted propositions, and rules of inference, which are not asserted at all; they are what permits transitions. If the rule is a rule, there is nothing further for the Tortoise to grant or withhold, since accepting a rule is not the addition of an item to a list. I think this is the right shape for a response. But it must not be implemented badly, and the objection raised in the question does not in fact damage it. Where the conditional is handled by axiom schemata, the schemata are propositions, and propositions are precisely what the Tortoise can always be asked to accept one more of; moreover a schema on its own produces no transition whatsoever, so a rule is still required in order to use it. The axiomatised presentation therefore does not refute the response; it merely relocates it, and shows that the response cannot be discharged by adding content-bearing premises, however many.

  Russell made essentially this point when he distinguished implication, which holds between unasserted propositions and can be written down as a hypothetical, from inference, which requires that propositions be asserted. His view was that inferring is something one does — a practice, an ability, which cannot be captured by any further formula — and on that reading the dialogue already carries its own resolution. Achilles fails only because he keeps treating what the Tortoise is doing as another line in a ledger rather than as the exercise of a skill; the piece ends with the deadlock recorded rather than dissolved because Carroll took the moral to be too obvious to need stating.

  (c) Natural deduction sharpens the issue rather than reproducing it. There is no proposition corresponding to conditional introduction: the rule is a procedure for manipulating lines — open an assumption, derive under it, close it — and the deduction theorem, which guarantees that a derivation of Z from the assumption A yields a derivation of the conditional, is a metatheorem established by induction on derivations, not a premise inside the system. So the Tortoise has nothing to ask for. There is no sentence of the object language whose acceptance would amount to accepting the rule, and a metatheorem can be proved rather than granted. The regress looks like an artefact of the axiomatic style Carroll inherited, in which every licence had to be written out as a conditional proposition, and once that style is abandoned the demand simply has no target.

  (d) The general lesson is normally put as follows: the justification of an inference rule cannot itself take the form of an inference, so deduction cannot be justified in the non-question-begging way one might hope for. Carroll shows this for deduction in exactly the way Hume's problem shows it for induction. The inductive argument that induction is reliable employs induction; the deductive argument that deduction is valid employs deduction; in both cases the conclusion is already presupposed in the premises, and the justification is circular rather than absent. And since no list of premises can compel the Tortoise to accept Z, his refusal is not an irrationality but a different stance towards the same material: he violates no norm he acknowledges, and there is nothing further to be said to him. What follows is a general scepticism about the justificatory standing of inference. Our rules are adopted, not justified.

  **What I need from you.**

  1. A mark out of 25, with a sub-mark for each of parts (a) to (d) and one or two sentences justifying each sub-mark. Say explicitly whether the mark would change, and by roughly how much, if part (c) had been argued rather than asserted.
  2. A numbered list of comments, each anchored to a short phrase of the student's own text so that I can locate the passage, stating what is right or wrong there and, where it is wrong, what the student should have said instead. Keep three categories visibly separate: substantive errors (a view attributed to the wrong philosopher, two distinct theses collapsed into one, a conclusion that does not follow from its premises); imprecision or compression that costs little; and thinness, where a claim is defensible but the obvious rejoinder goes unmet.
  3. An explicit flag on any claim where a reasonable grader could differ from you — including any claim that looks like a mistake but is not one — so that I can decide the point rather than inherit your judgement of it.
  4. A short paragraph of overall feedback in the register I would actually send back to the student: specific, actionable, neither effusive nor discouraging.

  Two constraints. Do not supply a bibliography, reading list, or page references; assess the answer on the merits of what it says, and confine yourself to what you can establish from the dialogue as described in the question and from your own understanding of the positions mentioned. If the student's characterisation of the text, or of what some philosopher held, is something you are not confident about, say that you are not confident about it rather than adjudicating by guesswork; an unresolved flag is more useful to me than a confident error.
