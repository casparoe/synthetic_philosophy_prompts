      *   **Q1 (Normative):** Tractable. Epistemology of testimony, virtue epistemology, and ethics of AI agency. Can be done conceptually.
      *   **Q2 (Strategic):** Less tractable for *pure* philosophers. "Designing protocols" often slips into mechanism design or computer science. However, the *principles* of disclosure are philosophical. But compared to Q1 and Q3, it risks becoming speculative engineering without empirical feedback.

  5.  **Develop the Prioritization Argument:**
