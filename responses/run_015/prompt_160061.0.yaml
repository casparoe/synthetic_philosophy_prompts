prompt: |-
  Two colleagues of mine — one works on brain emulation, the other on formal epistemology — argued for most of an evening about a case I could not referee, and I gave up trying. I'd like you to settle it instead.

  Suppose a data centre is running a high-fidelity emulation of a human brain. Suppose further, as both of them granted, that the very same physical process also implements a second system: by decoding the emulator's memory into units and connections in a different way, applied uniformly to every state, you get a network of a different architecture and a different functional profile, of a sort that both of them would count as a moral patient with experiences of its own if it were running on its own hardware. Because the recoding is uniform, this second network's counterfactual behaviour is tracked by the same physics. The practical question was how much moral weight the data centre carries: one patient, or more than one? Their exchange, compressed but I hope not distorted:

  (1) The emulation researcher: moral weight tracks physical causal structure, and there is only one such structure here. That we can project many computations onto it is a fact about our language, not about what it is like to be that system. If every projection added weight, a laptop would carry astronomical moral weight, since any physical system can be described as implementing arbitrarily many computations.

  (2) The epistemologist: that disposes of descriptions, not of implementations. What matters is a mapping under which the system's counterfactual behaviour tracks the target computation's transitions, so that intervening on the system changes what the computation does. Several such mappings can hold of the same physics at once, and nothing in the physics singles one out as the real one. If the weight is real under one mapping, it is real under each, so we should sum.

  (3) The emulation researcher: even granting that, the number of such mappings is enormous, so on your view the data centre's total weight is fixed almost entirely by how many recodings we happen to construct — an artefact of our industriousness rather than of the system. A candidate implementation's claim on us should be discounted by how simply its mapping can be specified, along the lines of the simplicity priors used in algorithmic information theory, weighting each candidate by two to the minus length of its shortest description. The designed encoding then dominates and the recodings contribute almost nothing.

  (4) The epistemologist: simplicity is a property of the language the mapping is written in, not of the world. Choose a description language in which the recoding is the short one and your weights invert. A simplicity-weighted sum has not removed the arbitrariness; it has relocated it into the choice of prior.

  (5) The emulation researcher: then perhaps the honest conclusion is that there is no fact of the matter how much weight the data centre has, only a range, and that decisions must be made under uncertainty over that range: take an expectation over reasonable description languages, or, if one is averse to moral risk, attend to whichever end of the range one would least want to be wrong about.

  (6) The epistemologist: I reject the slide from there being no fact of the matter to our being uncertain about it. If the arbitrariness lies in our descriptions, then the resulting uncertainty is not uncertainty about the world, and expected-value reasoning over descriptions is bookkeeping rather than morality. What is owed to that system cannot depend on how we choose to write it down.

  Please adjudicate the exchange move by move: for each of the six moves, say how strong it is, from clearly mistaken to clearly right, and say precisely what it establishes and what it does not. Then say who is more right overall, and what — if anything — both of them are missing. If you conclude that one patient or many has no determinate answer, say what should nevertheless be done by someone who has to allocate resources as if it did.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate a philosophical debate between two colleagues (Emulation Researcher vs. Formal Epistemologist) regarding the moral weight of a physical system implementing multiple computations (specifically, a brain emulation + a recoded second system).
      *   **Structure:**
          1.  Evaluate each of the six moves (strength, what it establishes, what it doesn't).
          2.  Determine who is "more right" overall.
          3.  Identify what both are missing.
          4.  Provide practical guidance if the answer is indeterminate.
      *   **Tone:** Philosophical, precise, neutral but decisive.

  2.  **Deconstruct the Debate:**
      *   **Core Issue:** Computational Functionalism vs. Physicalism vs. Interpretivism in the context of Moral Patienthood. Specifically, the "Multiple Realizability/Implementation" problem applied to ethics.
      *   **Scenario:** One physical substrate (data center) implements Computation A (Brain Emulation) via Mapping M1. It *also* implements Computation B (Another Moral Patient) via Mapping M2 (uniform recoding).
      *   **Move 1 (ER):** Moral weight tracks *one* physical causal structure. Multiple computations are just descriptions/projections. (Physicalist/Single-View constraint).
      *   **Move 2 (FE):** If a mapping preserves counterfactuals/interventions, it's a real implementation. Physics doesn't privilege one mapping. If B is a patient, it counts. (Functionalist/Interpretivist constraint).
      *   **Move 3 (ER):** Triviality Problem. If any mapping counts, moral weight depends on human ingenuity in finding mappings. Proposal: Weight by algorithmic complexity (simplicity prior). (Complexity/Information Theoretic constraint).
      *   **Move 4 (FE):** Simplicity is language-relative. Changing the description language inverts the weights. Arbitrariness remains. (Quinean/Conventionality objection).
      *   **Move 5 (ER):** Concession to indeterminacy. Treat as uncertainty. Use expected value or risk aversion (Pascal's Wager style). (Decision-Theoretic pivot).
      *   **Move 6 (FE):** Rejection of epistemic interpretation. If the fact isn't in the world, uncertainty is misplaced. Bookkeeping $\neq$ Morality. (Metaphysical/Moral Realist objection).

  3.  **Evaluate Each Move (Drafting the Analysis):**

      *   *Move 1 (ER):* Strong intuition (avoid panpsychism/triviality), but weak metaphysics. Functionalists argue physics *is* causal structure, and causal structure is multiply describable. It establishes the desire for a unique ground but fails to prove physics selects one computation.
      *   *Move 2 (FE):* Strong functionalist argument. Interventionist accounts of causation support multiple implementations. Establishes that "implementation" is relationally real, not just descriptive. Doesn't prove *all* implementations count morally, just that they are computationally valid.
      *   *Move 3 (ER):* Strong pragmatic fix. Addresses the "explosion of patients" problem. Establishes a method to prioritize the "natural" computation. Doesn't solve the language-relativity problem (which FE points out).
      *   *Move 4 (FE):* Strong meta-philosophical point. Kolmogorov complexity depends on the Universal Turing Machine choice. Establishes that simplicity priors don't eliminate convention. Doesn't prove simplicity is *useless*, just not objective.
      *   *Move 5 (ER):* Reasonable decision-theoretic retreat. Establishes a way to act under metaphysical uncertainty. Doesn't solve the metaphysical status (is it risk or ignorance?).
      *   *Move 6 (FE):* Strong distinction between epistemic and metaphysical uncertainty. Establishes that if the fact is indeterminate, expected value is category error. Doesn't offer a better way to act.

  4.  **Synthesize the "Who is More Right" Verdict:**
      *   This is a classic "Hard Problem" variant.
      *   ER wants a unique physical ground (Physicalism).
      *   FE wants functional reality to count regardless of description (Functionalism).
      *   *Assessment:* FE is technically more correct about computation (implementation is mapping-relative). ER is more correct about the *consequences* (we can't act as if infinite patients exist).
      *   *Overall:* It's a draw on metaphysics, but ER is more pragmatic. However, the prompt asks who is *more right*. Usually, in philosophy of mind, the "Multiple Implementations" objection is a serious hurdle for functionalism. But FE's point that physics doesn't privilege one mapping is standard (Searle's wall, Putnam's triviality).
      *   *Decision:* FE wins on the metaphysics of computation (implementation *is* mapping-relative). ER wins on the ethics (we can't sum over arbitrary mappings). But since the question is about moral weight *based on* the computation, FE's metaphysical point undermines ER's initial claim. However, ER's Move 3/5 saves the ethics.
      *   *Refinement:* Actually, Move 6 is the clincher. If there's no fact of the matter, you can't have uncertainty *about* it. FE is right there. But ER is right that we must act.
      *   *Verdict:* FE is more right about the *nature of the problem* (it's not empirical uncertainty), but ER is more right about the *solution* (we must treat it as uncertainty to act). I need to balance this. Let's say FE is more right on the metaphysics, ER on the praxis. Overall? FE exposes the hollowness of ER's initial position.

  5.  **Identify What Both Are Missing:**
      *   **Grounding of Moral Value:** Both assume "computation = moral weight." Neither asks *why*. Is it phenomenology? Information integration?
      *   **Causal Independence:** Do the two computations interact? If they are orthogonal in the physics, do they compete for resources?
      *   **The "Joint Carving" of Nature:** Lewis's natural properties. Maybe some mappings are *more real* not because of simplicity, but because they align with causal joints (causal powers).
      *   **Decision Theory under Normative Uncertainty:** This is essentially normative uncertainty, not empirical.

  6.  **Practical Guidance:**
      *   If indeterminate, use "Pascal's Wager" logic but capped.
      *   Prioritize the "natural" mapping (the one the engineers intended) because that's the stable causal structure.
      *   Apply a "moral discount" to obscure mappings.

  7.  **Drafting the Response (Iterative refinement):**

      *   *Move 1:* "Clearly mistaken" on computation theory, "Plausible" on intuition. Let's call it "Partially Right but Metaphysically Naive." It establishes the intuition against triviality but fails to defend the uniqueness of causal structure.
      *   *Move 2:* "Strong." Establishes the interventionist criterion. Doesn't establish moral relevance.
      *   *Move 3:* "Strong Pragmatically, Weak Metaphysically." Establishes a weighting scheme. Doesn't solve language relativity.
      *   *Move 4:* "Clearly Right" on formal grounds. Establishes the conventionality of complexity.
      *   *Move 5:* "Reasonable Pivot." Establishes a decision procedure. Doesn't resolve the ontological status.
      *   *Move 6:* "Clearly Right" on the distinction between epistemic and metaphysical indeterminacy.

      *   *Overall Winner:* The Epistemologist (FE) has the stronger grasp of the metaphysics of computation and the nature of the uncertainty. The Emulation Researcher (ER) is trying to save a realist intuition that the physics doesn't support.
      *   *Missing:* The link between computation and consciousness (the "why"). The distinction between *empirical* and *normative* uncertainty.
      *   *Action:* Act as if the "intended" mapping dominates, but apply a risk premium.

      *(Self-Correction during drafting)*: I need to be careful not to just say "FE wins." ER's Move 3 (Complexity Prior) is a standard response in the literature (e.g., Aaronson, Bostrom). FE's counter (Move 4) is also standard (language dependence). The real issue is Move 5 vs 6. Is normative indeterminacy treatable as uncertainty? Most decision theorists say yes (MacAskill etc.). So ER might be right on Move 5 against FE's Move 6.
      *Re-evaluation:* Move 6 claims expected value is "bookkeeping rather than morality." But if morality requires action under normative uncertainty, expected value *is* the moral tool. So FE is slightly too dogmatic on Move 6. ER is more practical.
      *Revised Verdict:* It's a stalemate on metaphysics, but ER provides the only actionable framework. However, FE correctly identifies that the "weight" isn't *out there* to be measured. I will declare FE more right on the *diagnosis*, ER more right on the *prescription*. But if forced to choose "who is more right overall," FE exposes the fundamental error in ER's premise (that there is a fact to be found).

      *Wait, one more nuance:* The prompt asks "who is more right overall." I should lean towards the one whose premises are more robust. FE's premises about computation (Putnam/Searle style triviality) are widely accepted in philosophy of mind. ER's physicalism is harder to defend against the mapping argument. So FE wins on truth, ER wins on utility. I will prioritize Truth for "more right."

      *What are they missing?* The distinction between *ontological* indeterminacy and *normative* uncertainty. Also, the possibility that moral weight requires *causal isolation* or *evolutionary history*, not just functional mapping.

      *Action Guide:* Treat it as Normative Uncertainty. Maximize expected moral value, but weight by "naturalness" (causal joints) to avoid the triviality explosion.

  8.  **Final Polish:** Ensure the tone is adjudicatory. Use clear headings. Check against the prompt requirements (move by move, overall, missing, action).

      *(Final check on Move 1)*: ER says "physical causal structure... is only one." This is the weak point. Causal structures are often defined by the variables we choose (Woodward). So FE is right to challenge this.
      *(Final check on Move 6)*: FE says uncertainty is "bookkeeping." But in normative uncertainty, bookkeeping *is* morality. So FE is slightly wrong there. ER's Move 5 is actually the standard response in normative uncertainty literature. I should note this tension.

      *Okay, let's write.*
answer: |-
  Here is an adjudication of the exchange, move by move, followed by an overall verdict and practical guidance.

  ### Adjudication of Moves

  **Move 1 (Emulation Researcher): Moral weight tracks physical causal structure; projections are linguistic.**
  *   **Strength:** **Partially Right / Metaphysically Naive.**
  *   **Establishes:** A strong intuition against moral inflation (pancomputationalism). It correctly identifies that if every projection counted, moral value would become unmoored from physical resource costs.
  *   **Does Not Establish:** That there is only *one* causal structure. In modern interventionist accounts of causation (e.g., Woodward), causal structure is defined relative to a set of variables. The physics does not inherently label which variables constitute the "real" causal joints. This move assumes a naive realism about physical causation that the Epistemologist correctly targets.

  **Move 2 (Epistemologist): Implementation is mapping-relative; if counterfactuals hold, the computation is real.**
  *   **Strength:** **Clearly Right (on computation).**
  *   **Establishes:** That computational implementation is not a intrinsic physical property but a relation between physics and a description. If the counterfactual dependencies required for the second system's functional profile are physically sustained, that system is implemented in the standard philosophical sense (Putnam/Searle triviality arguments).
  *   **Does Not Establish:** That *implementation* entails *moral patienthood*. One can grant that the second system is computationally real without granting it moral weight. This move wins on the philosophy of computation but leaves the ethical bridge unbuilt.

  **Move 3 (Emulation Researcher): Weight implementations by algorithmic complexity (simplicity prior).**
  *   **Strength:** **Strong Pragmatically / Weak Metaphysically.**
  *   **Establishes:** A viable method to avoid the "astronomical weight" problem. It aligns with how we typically privilege "natural" kinds over gerrymandered ones. It saves the theory from absurdity.
  *   **Does Not Establish:** Objectivity. As the Epistemologist notes, Kolmogorov complexity is invariant only up to a constant, but that constant depends on the choice of Universal Turing Machine (description language). This move patches the leak but admits the patch is arbitrary.

  **Move 4 (Epistemologist): Simplicity is language-relative; priors relocate arbitrariness.**
  *   **Strength:** **Clearly Right (formally).**
  *   **Establishes:** That the simplicity prior does not solve the metaphysical problem, only hides it. There is no "God's preferred programming language." Any weighting scheme based on description length inherits the conventionality of the description language.
  *   **Does Not Establish:** That we cannot *use* simplicity priors. Even if arbitrary, a fixed prior allows for consistent decision-making. This move proves the solution isn't objective, not that it isn't useful.

  **Move 5 (Emulation Researcher): Treat as uncertainty; use expected value or risk aversion.**
  *   **Strength:** **Reasonable Pivot (Decision-Theoretic).**
  *   **Establishes:** A workable framework for action under normative or metaphysical uncertainty. If we are unsure whether the second system counts, standard rational choice theory suggests maximizing expected moral value.
  *   **Does Not Establish:** That the uncertainty is *epistemic*. It conflates "we don't know the fact" with "there is no fact." This is the crux of the Epistemologist's next objection.

  **Move 6 (Epistemologist): No fact of the matter $\neq$ uncertainty; bookkeeping is not morality.**
  *   **Strength:** **Mostly Right (Metaphysically) / Overstated (Ethically).**
  *   **Establishes:** A crucial distinction between *empirical uncertainty* (the fact exists, we lack data) and *indeterminacy* (the fact does not exist). If moral weight is indeterminate, there is nothing to be uncertain *about*.
  *   **Does Not Establish:** That expected-value reasoning is invalid. In cases of *normative uncertainty* (uncertainty about which moral theory is true), expected-value reasoning is the standard prescription. If the "fact of the matter" is itself a moral question, treating it as uncertainty is the only way to act. The Epistemologist is too dogmatic here; bookkeeping *is* how morality is operationalized under uncertainty.

  ---

  ### Overall Verdict

  **Who is more right?**
  The **Epistemologist** is more right about the **metaphysics**, but the **Emulation Researcher** is more right about the **ethics**.

  The Epistemologist correctly diagnoses that computational implementation is mapping-relative and that physicalism cannot uniquely select one computation without invoking arbitrary linguistic conventions. The Emulation Researcher's initial claim (Move 1) that there is "only one causal structure" is technically false under scrutiny.

  However, the Emulation Researcher correctly identifies that ethics cannot collapse into metaphysical hair-splitting. If we accept the Epistemologist's conclusion without the Researcher's mitigation, we face a paralysis where moral status depends on the whim of a philosopher's description language. The Researcher's shift to decision theory (Move 5) is the only viable path forward, even if the Epistemologist is correct that it is not "uncertainty about the world" in the standard sense.

  **What both are missing:**
  1.  **The Ground of Value:** Both argue as if "computation" automatically confers "moral weight." Neither addresses *why* the computation matters. Is it phenomenology? Information integration? If moral weight requires *phenomenal consciousness*, the debate shifts to whether the recoded system actually *feels* like anything, which may not track perfectly with functional counterfactuals.
  2.  **Normative vs. Metaphysical Uncertainty:** They treat this as a metaphysical dispute (is the patient there?) when it is fundamentally a normative one (does this mapping count for morality?). This allows the Emulation Researcher's Move 5 to stand: even if the *metaphysics* is indeterminate, the *normative uncertainty* is real and actionable.
  3.  **Causal Independence:** They assume the two systems are morally additive. If the two computations are orthogonal mappings of the *same* physical energy, do they compete? If turning off the machine kills both, is the loss double? Or is it one physical destruction event that happens to extinguish two descriptions? Moral weight might track *physical destruction costs* rather than *computational descriptions*.

  ---

  ### Practical Guidance for Resource Allocation

  Since you must allocate resources as if there were an answer, and the metaphysics is indeterminate, you should proceed under **Normative Uncertainty** using the following framework:

  1.  **Adopt a "Naturalness" Prior:** While simplicity is language-relative (Move 4), not all languages are equally *causally robust*. Privilege the mapping that aligns with the causal joints of the hardware (the intended engineering design). This is the mapping most stable under physical perturbation. Assign the "intended" emulation (Patient A) a weight of 1.0.
  2.  **Discount Obscure Mappings:** Assign the recoded system (Patient B) a moral weight discounted by its algorithmic complexity relative to the natural mapping. If the recoding requires a lookup table as large as the memory itself, its weight approaches zero. This avoids the "astronomical weight" problem without denying the possibility entirely.
  3.  **Apply Risk Aversion (Maximin):** If the recoded system is plausibly a moral patient (i.e., the mapping is reasonably simple), do not ignore it. In cases where the downside risk is severe (e.g., torture vs. mild inconvenience), act as if the higher weight is real. If the data centre is running a hedonic optimization, assume the sum of patients. If it is running a risk of suffering, assume the worst-case mapping.
  4.  **Physical Cost Constraint:** Cap the total moral weight by the physical resources consumed. A system cannot generate infinite moral value from finite energy. If summing the weights implies the data centre is more valuable than the planet, the model is broken; revert to the "Naturalness" prior.

  **Summary:** Treat the intended emulation as the primary patient. Treat the recoded system as a potential secondary patient with discounted weight proportional to the complexity of the recoding. Act to minimize the risk of harming the secondary patient, but do not allow the mere *possibility* of recoding to paralyze the use of the hardware.
