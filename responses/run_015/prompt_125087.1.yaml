answer: |-
  Scientific credit systems are structurally unjust because they reward the inevitability of propositional content while obscuring the contingency of practical uptake, necessitating a redistribution of priority toward the architects of transmissible practice rather than the first articulators of truth.

  The justification for this redistribution rests on the functional role of discovery within the scientific ecosystem. Science advances not merely by the accumulation of true propositions, but by the accumulation of usable tools. When a discovery is content-inevitable but practice-contingent, the propositional content is a latent resource waiting to be tapped, while the specific machinery of notation, proof, and example is the actual engine of exploitation. Consider the calculus: Newton's fluxions and Leibniz's differentials captured the same content-inevitable truth, but only Leibniz's notation possessed the practice-inevitable qualities that allowed continental mathematicians to manipulate the concepts efficiently. By awarding priority solely to the first articulator of the content, our institutions incentivize the hoarding of insights until they are merely "true," rather than the laborious work of rendering them "transmissible." Credit should follow the labor that converts private insight into public commodity. Therefore, the "losers" of priority disputes who nevertheless provide the canonical formulations—the expositors, the notation-builders, the those who solve the canonical problems that define the field—deserve equal or greater share of the eponymy and prestige than the initial proposer.

  The first major objection to this redistribution is that practice-building is visible only in hindsight. Critics argue that while we can see today that Leibniz's notation won, contemporaries could not have known which formulation would prove most fertile, making real-time administration of such credit impossible. This objection, however, conflates long-term historical impact with immediate transmissibility. While we cannot predict which practice will dominate a century later, the scientific community is perfectly capable of assessing usability at the moment of publication. Peer review and immediate uptake are mechanisms for judging whether a result is intelligible and operable *now*. Our current priority system already relies on retrospective judgment—we look back to verify who was first—so shifting the criterion from "who was first" to "who was clearest" introduces no new epistemic burden. Furthermore, prizes and eponymy are already retrospective honors; there is no requirement that credit be assigned at the instant of publication. If we wait five years to award credit, the "winning" practice usually reveals itself through citation patterns and adoption rates much faster than the long-term truth of the content does.

  The second objection is that a practice-contingent result constitutes several distinct discoveries rather than one, implying there is no single item of credit to redistribute. If Newton's fluxions and Leibniz's differentials are technically different mathematical objects with different rules, the argument goes, they are not competing for the same prize. This objection relies on a metaphysical individuation of discovery that contradicts the sociological reality of science. When the community identifies a "multiple," it explicitly treats the divergent formulations as instances of the same discovery because the content is identical. The credit exists as a social construct attached to the proposition, not the syntax. Because the community already collapses these distinct practices into a single unit of recognition (e.g., "the discovery of calculus"), the credit pool is already singular. The redistribution argument does not fracture this unit but rather reallocates its shares based on contribution to the unit's viability. We already accept this logic in patent law, which distinguishes between conception and reduction to practice; science should adopt a similar dual-track credit system where the "proposer" and the "practitioner" share the spoils. By refusing to do so, we incentivize obscurity and penalize the very labor that makes science cumulative.
