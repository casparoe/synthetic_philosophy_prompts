answer: |-
  The ledger lay open on the metal table, damp from the humidity of the Kaelen Delta. Elara traced the column labeled *Option 3: Behavioural Interdiction*. The numbers were green, inviting. Lowest insect-days of suffering per hectare. Lowest non-target toxicity. It was the cleanest line she had ever drawn.

  Outside, the rain hammered the corrugated roof of the cooperative hall. Inside, twelve families waited. The blue-grain was failing. The moth larvae were stripping the leaves before the grains could swell.

  "We know the costs," Tomas said. He was older, his hands stained with the permanent green of blue-grain sap. He tapped the page for Option 1. "Seed coating. We know it works. The yield holds. The Vane kids stay in school. The Meri family buys insulin."

  "And the soil?" Senna asked. She was younger, trained in the city before returning to the delta. "The coating stays in the pollen. The bees die slow. The moths die slow. It's poison."

  "It's chemistry," Tomas corrected. "They are insects. They are reflexive machinery. There is no one home to suffer."

  Senna shook her head. "Biology isn't certainty. If there is even a one percent chance they feel pain, look at the numbers. Hundreds of millions per season in this delta alone. The probability swamps everything. We cannot risk that much suffering for a margin of profit."

  Kael, sitting near the back, leaned forward. "If that math holds, Senna, then farming itself is a crime. We drain the marshes to plant this grain. We destroy habitats where billions of wild insects live and die. If insect pain swamps all, we should stop farming. Are you prepared to endorse that? Because nobody here is."

  The room went quiet. The argument hung in the air, heavy as the humidity. It was the same circle they had walked for weeks. Option 1 was reliable murder. Option 2, the gene-drive, was prevention of existence—a metaphysical trap. Some argued erasing a lineage was the ultimate kindness; others said erasing a future was the ultimate harm. They couldn't agree on the status of the unborn, so the gene-drive was stalled.

  That left Option 3. The pheromone dispensers. The olfactory blockers.

  Elara looked down at her ledger. This was her creation. She had designed the metric: *insect-days*. It quantified the duration of life multiplied by the estimated intensity of negative experience. Option 3 scored best because the moths couldn't find the crop. They flew confused circles until they died of old age. No larvae on the blue-grain. No chewing. No insecticide poisoning.

  But Elara knew where the boundary of the ledger was drawn. It stopped at the field edge.

  When the moths couldn't find the blue-grain, they didn't vanish. They settled on the wild host plants in the surrounding marsh. They laid eggs there. The wild plants were nutrient-poor. The larvae hatched and starved. It took a fortnight. They shriveled slowly, cannibalizing each other in the mud.

  That suffering wasn't in the ledger. It was outside the boundary line.

  Elara could argue that the ledger was the only honest way to decide. Without numbers, you were just guessing based on who shouted loudest. Quantification forced you to compare apples to apples. But she also knew the tidiness was a moral hazard. If you don't count it, it doesn't hurt. The ledger made the marsh invisible.

  "There is also the next season," Elara said quietly. The room turned to her. "The ledger covers one year. If we suppress the moth, something else fills the niche. A beetle. A fungus. We don't have data for year four."

  "We have data for now," Tomas said. "The Vanes lose twenty percent of the harvest this year if we don't act. That is not an abstraction. That is Jory Vane pulling his daughter from classes. That is medicine rationed."

  Senna looked at Elara. "Option 3 is still the kindest. Nothing is poisoned. Nothing is crushed."

  "Nothing we count," Elara said.

  "Vote," Kael said. "We can't think our way out of eating."

  They voted by show of hands. It was close. The promise of clean fields won. Option 3. The behavioural programme. It felt like virtue. It felt like science.

  Elara closed the ledger. The sound was final.

  The season started two weeks later. The dispensers were hung on poles along the rows, releasing the synthetic scent of female moths. The air smelled sweet and wrong. The blue-grain grew tall, untouched by larvae. The leaves remained broad and green.

  Elara walked the field edge in late summer. The grain was heavy, golden-green. The yield would hold. The Vane children would stay in school. The insulin would be bought. The human suffering was averted, concrete and real.

  She walked down the embankment into the marsh. The wild host plants were covered in small, pale caterpillars. They moved sluggishly. There were too many of them for the leaves provided. She watched one stop chewing, shrink into itself, and cease moving. It had not been poisoned. It had not been crushed. It had simply been misled into a world where nothing existed for it to eat.

  There were millions of them, stretching into the reeds. None of them were in the ledger. The suffering had not been eliminated; it had been relocated to where no one was counting. Elara turned back toward the fields, toward the safe, counted grain, and left the marsh to its quiet starvation.
