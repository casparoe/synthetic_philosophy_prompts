  2. His verdict turns entirely on the copy principle, which dictates that every simple idea must be derived from a preceding simple impression.
  3. He would refuse to grant the premise that a fact of the matter can exist where there is no perceptible difference to ground the idea of that difference.
  4. The missing shade of blue pushes him toward the argument, because it demonstrates that even novel ideas are generated by the relational structure of impressions rather than by intrinsic qualities alone.
  5. The rotation case helps the argument, for preserving all relations while altering the intrinsic quality removes the very perceptual discontinuity required to establish a new idea. "I have altered the impression without altering the idea, which is to say, I have altered nothing that can be known."
