answer: |-
  **Virtual Harm Assessment Protocol**

  **The Checklist (Run in Order)**
  1.  **Labor Check:** Did the victim invest significant real time (>5 hours) or irreplaceable effort?
      *   *Pass:* Yes. *Fail:* No.
  2.  **Export Test:** Would this loss still hurt if the server deleted tomorrow? (e.g., sentimental build vs. generic dirt).
      *   *Pass:* Yes. *Fail:* No.
  3.  **Rollback Test:** If we restore blocks/items, is the harm actually undone? (Memorials, trust, and time cannot be rolled back).
      *   *Pass:* No (Restoration fails). *Fail:* Yes (Restoration works).
  4.  **Exclusion Check:** Does this action prevent the user from playing or enjoying the server? (Spawn killing, locking exits).
      *   *Pass:* Yes. *Fail:* No.

  **Decision Matrix**
  *   **Steps 1-3 Pass:** Mod Action (Ban/Restore). Property/effort harm confirmed.
  *   **Step 4 Pass:** **Hand to Faculty Sponsor.** This is bullying/harassment, not just griefing. Values call.
  *   **All Fail:** "Sorry, gameplay risk." No action.

  **Case Applications**
  1.  **3-Month Build Blown Up:** Step 1 (Pass), Step 3 (Pass—blocks return, time doesn't). **Verdict: Ban.** The labor is real; rollback is insufficient.
  2.  **Glitch Trade:** Step 1 (Pass), Step 3 (Fail—item restored). **Verdict: Restore + Warning.** Economic harm reversible, but trust damaged. Monitor user.
  3.  **Spawn Killing:** Steps 1-3 (Fail), Step 4 (Pass). **Verdict: Faculty Sponsor → Ban.** This isn't property damage; it's exclusion. Since this is a school club, preventing play is a conduct violation.

  **Where This Checklist Gives BS Answers**
  The checklist struggles with "fun." A player might lose a generic item (Step 2 Fail) but feel genuinely devastated because they loved it. Conversely, Step 4 might flag aggressive PvP as "exclusion." Mods must use discretion: if a player is visibly distressed, escalate regardless of the Export Test. Virtual harm is real when the *person* is hurt, not just when the *data* is lost.

  **Note to Mods:** If Step 4 triggers, do not decide alone. That is a bullying determination, not a server rule one. Get the sponsor.
