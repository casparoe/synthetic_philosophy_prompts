answer: |-
  ### Private Brainstorming

  Okay, what counts as a requirement here? I need to filter out my own philosophical biases. 
  *Candidate 1: Behavioral Sufficiency.* Must rely only on observable stimulus meaning. *Argument:* This is Quine's constraint. *Counter:* It fails Case 4 (Machine Translation/Corpus). There is no pointing in a text corpus. If I insist on this, I declare MT impossible by fiat. *Verdict:* Discard as behaviorist prejudice. Replace with "Evidence Accessibility."
  *Candidate 2: Determinacy.* The theory must yield a unique correct translation. *Argument:* The journalist wants to audit. *Counter:* Quine's point is that there might not *be* a unique correct answer. If the theory forces one, it lies. *Verdict:* Modify. The theory must determine *whether* there is a fact of the matter, not force one where none exists.
  *Candidate 3: Speaker Authority.* What the speaker says they mean is final. *Argument:* Intentionalism. *Counter:* Case 5 (Contamination). If they learned the word from the linguist, their answer is circular. Case 6 (Error). They might be wrong about their world. *Verdict:* Discard. Speakers are evidence, not arbiters.
  *Candidate 4: Symmetry.* Must apply to English. *Argument:* Prevents exoticizing. *Counter:* None. Essential. *Verdict:* Keep.
  *Candidate 5: Error Handling.* Must allow false beliefs. *Argument:* Otherwise translation makes everyone rational caricatures. *Counter:* Hard to separate meaning from belief. *Verdict:* Keep. If you can't translate error, you can't translate truth.
  *Candidate 6: Corpus Viability.* Must work without ostension. *Argument:* Modern reality. *Counter:* Traditional fieldwork theories fail here. *Verdict:* Keep.
  *Candidate 7: Independence.* Evidence must not be contaminated by the translation manual itself. *Argument:* Case 5. *Verdict:* Keep. Crucial for scientific validity.

  *Refining the Goal:* The journalist needs to know if a translation is *defensible*, not necessarily *unique*. The theory must provide criteria for defense. The big trap is conflating "we can't tell" (epistemic) with "there is nothing to tell" (ontological). The theory must distinguish these.

  *Final Filter:* Discard "Privilege Physical Objects." Whether *gavagai* means rabbit or rabbit-stage is metaphysical, not linguistic. The theory shouldn't decide metaphysics for them. Discard "Computability." That's engineering, not philosophy of language.

  Okay, the core list is forming: Symmetry, Error, Independence, Corpus, and the Epistemic/Ontological distinction.

  ***

  ### The Requirements List for an Adequate Theory of Reference

  To serve your purpose—allowing an outsider to audit a translation claim—a theory of meaning must meet the following conditions. I have categorized them by their status: **Non-negotiable** (the theory fails without them), **Negotiable** (desirable but adaptable), or **Prejudice** (discarded biases).

  **1. The Symmetry Requirement (Non-negotiable)**
  *   **Case:** Seven (Symmetry).
  *   **Requirement:** The criteria used to fix reference in the target language must apply equally to the auditor's language (e.g., English).
  *   **Reasoning:** You cannot claim that *gavagai* is indeterminate while assuming "rabbit" is determinate. If the theory relies on "mental intentions" to fix reference, it must explain how we access English intentions just as accessibly as foreign ones. If it relies on "causal links," it must apply to English terms too.
  *   **Consequence:** Any theory that exoticizes the target language (treating it as mystical or logically inferior) is disqualified.

  **2. The Error Accommodation Requirement (Non-negotiable)**
  *   **Case:** Six (False Belief).
  *   **Requirement:** The theory must allow speakers to hold false beliefs about the objects they refer to without rendering their reference unintelligible.
  *   **Reasoning:** If a theory maximizes agreement (Principle of Charity) too strictly, it forces the translator to interpret "the ancestors angered the crop" as "the weather caused the crop failure" to make the speakers "right." This erases the speakers' actual worldview.
  *   **Consequence:** The theory must distinguish *what* is being talked about (reference) from *what is said about it* (truth).

  **3. The Evidence Independence Requirement (Non-negotiable)**
  *   **Case:** Five (Contamination).
  *   **Requirement:** The theory must specify what counts as independent evidence for a translation, distinct from evidence generated by the translation manual itself.
  *   **Reasoning:** If speakers learn the word from the linguist, their subsequent usage confirms the linguist's teaching, not the original meaning.
  *   **Consequence:** A theory that treats all assent as equal evidence fails. It must weight "naive usage" higher than "elicited usage."

  **4. The Corpus Viability Requirement (Non-negotiable)**
  *   **Case:** Four (Machine Translation/No Fieldwork).
  *   **Requirement:** The theory must explain what fixes reference when no shared physical environment or pointing behavior exists.
  *   **Reasoning:** Modern translation is often text-to-text. If a theory requires ostension (pointing) to fix reference, it declares all book-translation and MT fundamentally broken.
  *   **Consequence:** The theory must identify structural or contextual markers within language use that substitute for pointing.

  **5. The Indeterminacy Diagnosis Requirement (Non-negotiable)**
  *   **Case:** One (Two Words) & General Quinean Worry.
  *   **Requirement:** The theory must distinguish between *Epistemic Uncertainty* (we lack enough data to decide) and *Ontological Indeterminacy* (there is no fact of the matter to decide).
  *   **Reasoning:** You need to know if you should keep looking for evidence (Uncertainty) or stop because the question is meaningless (Indeterminacy).
  *   **Consequence:** The theory must provide a stopping rule. It must say: "If you have data X and Y and still disagree, the dispute is verbal, not factual."

  **6. The Core-Edge Consistency Requirement (Negotiable)**
  *   **Case:** Three (Vagueness).
  *   **Requirement:** The theory should explain why coordination works in standard cases but fails at boundaries, without declaring the word meaningless.
  *   **Reasoning:** Words are often vague. A theory that demands precise boundaries for all terms is unrealistic.
  *   **Consequence:** It is acceptable for the theory to say reference is "fixed enough for practical purposes" without being metaphysically precise.

  **7. The Self-Statement Requirement (Non-negotiable)**
  *   **Case:** General Coherence.
  *   **Requirement:** The theory must be able to state its own conclusions using the vocabulary whose determinacy it is assessing, without paradox.
  *   **Reasoning:** If the theory says "Reference is indeterminate" but uses referential terms to say it, it must explain why its own statement isn't equally indeterminate.
  *   **Consequence:** Prevents self-refuting skepticism.

  ***

  ### Discarded Candidates (Prejudices)

  *   **Behavioral Sufficiency:** I discarded the requirement that all evidence must be observable stimulus behavior. This is a behaviorist prejudice. It fails Case 4 (Corpus). We infer meaning from text patterns constantly; insisting on pointing is historically contingent to fieldwork, not essential to meaning.
  *   **Speaker Authority:** I discarded the idea that the speaker's explicit definition is the final word. This is an intentionalist prejudice. As Case 5 shows, speakers can be contaminated or mistaken about their own usage.
  *   **Metaphysical Realism:** I discarded the requirement that the theory must decide whether *gavagai* refers to a "rabbit" or a "rabbit stage." This is metaphysics, not linguistics. The theory should tell you if the language distinguishes them, not which one matches reality.

  ***

  ### Conflict Analysis: The Unsatisfiable Subset

  **Is any subset of these requirements jointly unsatisfiable?**

  Yes. There is a tension between **The Evidence Independence Requirement**, **The Corpus Viability Requirement**, and **The Indeterminacy Diagnosis Requirement**.

  Here is the argument:
  1.  **Corpus Viability** demands we fix reference without shared physical context (no pointing). We must rely on textual patterns and co-occurrence.
  2.  **Evidence Independence** demands we distinguish between meaning and collateral information (beliefs about the world) without contaminating the data with our own translation manual.
  3.  **Indeterminacy Diagnosis** demands we know when there is "no fact of the matter."

  **The Conflict:** In a corpus-only setting (Case 4), textual patterns alone often underdetermine reference. The word "rabbit" co-occurs with "fur," "meat," "running," and "dead." Without physical pointing to isolate the object from its parts or stages (Quine's problem), the text alone cannot logically force a choice between "rabbit" and "undetached rabbit part."
  If you insist on **Corpus Viability** (you must translate text), but you also insist on **Evidence Independence** (you cannot assume the speakers share your metaphysics of objects), you often cannot satisfy **Indeterminacy Diagnosis** (you cannot prove there is a fact of the matter).

  **The Result:** A theory that satisfies all three must admit that in corpus-only settings, reference is often *ontologically indeterminate*, not just epistemically hidden. The journalist cannot always get a "yes/no" on whether the translation is right. Sometimes the only defensible answer is: "The source language does not individuate objects in a way that maps to the target language." If a theory promises a unique correct translation in all corpus cases, it violates **Evidence Independence** by smuggling in the translator's metaphysics as "meaning."

  ***

  ### The Single Most Exclusionary Requirement

  **The Error Accommodation Requirement.**

  This requirement does the most work in excluding otherwise attractive theories.
  *   **Why:** It kills "Radical Charity" accounts. Many theories suggest we must interpret speakers to make them come out as rational and true as possible. This makes translation smooth but erases cultural difference. If you cannot translate "false" beliefs (like ancestors causing crop failure), you cannot translate the speakers' actual reality.
  *   **Exclusion Power:** It forces the theory to separate *meaning* (what the word picks out) from *belief* (what they think is true about it). Theories that collapse meaning and belief (holistic use-theories) struggle here, because if the belief is false, the meaning often dissolves in their framework. To pass this requirement, a theory must allow a word to successfully refer to "ancestors" even if "ancestors" do not exist or cannot cause crop failures.

  ***

  ### Scoring the Four Families of Account

  | Theory Family | Score Against Requirements | Notes |
  | :--- | :--- | :--- |
  | **Charity / Truth-Conditions** | **Mixed** | Strong on Symmetry and Error (allows false beliefs if logic holds). Weak on Corpus Viability (needs truth conditions which are hard to verify without context). Risks smoothing over indeterminacy. |
  | **Causal / Informational** | **Poor** | Fails Corpus Viability. Requires a physical causal chain between object and word. Cannot explain how we translate texts about abstracta or distant objects without direct causal links. |
  | **Inferential / Use-Theoretic** | **Good** | Strong on Corpus Viability (meaning is use). Strong on Symmetry. Struggles with Error Accommodation (if use is wrong, is meaning broken?) and Indeterminacy Diagnosis (use is always specific, hard to generalize). |
  | **Deflationary (Pseudo-problem)** | **Best Fit** | Strong on Symmetry and Indeterminacy Diagnosis (says "no fact of the matter" explicitly). Weak on Journalist's Goal (doesn't help audit specific translations, just dissolves the question). |

  **Glossary of Terms:**
  *   **Ostension:** Pointing at an object to define a word.
  *   **Ontological Indeterminacy:** The claim that there is no objective fact to be found, not just that we are ignorant of it.
  *   **Epistemic Uncertainty:** The claim that there is a fact, but we lack the tools to find it.
  *   **Collateral Information:** Beliefs about the world that accompany a word but are not part of its meaning (e.g., believing rabbits are sacred is collateral; "rabbit" picking out the animal is meaning).
  *   **Radical Charity:** The methodological rule of interpreting speakers to be as rational and correct as possible.
