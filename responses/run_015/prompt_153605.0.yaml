answer: |-
  # Seminar Activity: The Calibration Protocol

  ## 1. Activity Overview
  **Title:** The Calibration Protocol
  **Objective:** To simulate the tension between first-order evidence (the task) and higher-order evidence (reliability data regarding the task performance), forcing participants to navigate between *total-evidence integration* (revising the belief) and *level-splitting* (retaining the belief while acknowledging unjustification).
  **Participants:** 12 advanced undergraduates (divided into 4 groups of 3).
  **Duration:** 90 minutes.
  **Materials:** Printed puzzle sheets, 'Verdict Slips', 'Meta-Report Envelopes', scoring ledger (whiteboard).

  ## 2. Philosophical Context: Settled vs. Contested
  Before detailing the activity, it is crucial to distinguish the philosophical landscape you are navigating. This activity does not resolve these debates but instantiates them.

  *   **Broadly Settled:**
      *   **Phenomenology:** Epistemic akrasia (believing *p* while believing one ought not believe *p*) is a psychologically real state.
      *   **HOE Existence:** Higher-order evidence (evidence about the quality of one's reasoning) exists and is distinct from first-order evidence (evidence about the world).
      *   **Impact:** HOE generally *does* affect rational credence, even if the first-order evidence remains unchanged.

  *   **Genuinely Contested:**
      *   **Rational Permissibility:** Is epistemic akrasia ever rational? 'Steadfasters' (e.g., Horowitz) argue level-splitting can be rational; 'Revisers' (e.g., Christensen) argue HOE mandates belief revision to avoid akrasia.
      *   **Self-Transparency:** Do total-evidence views demand an unrealistic degree of cognitive access to one's own reliability?
      *   **Peer Coherence:** Is treating one's past self as an 'epistemic peer' structurally coherent, or does the current self always have privileged access to their current reasoning state?

  *Note to Instructor: Do not present the 'Reviser' view as the consensus. The activity is designed to make the 'Steadfast' position feel intuitive for some and irrational for others.*

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–10** | **Briefing** | Distribute materials. Explain rules and scoring. **No mention of epistemology.** Frame this as a 'Decision-Making Workshop'. |
  | **10–25** | **First-Order Deliberation** | Groups solve the 'Modal Logic Puzzle'. They must agree on a single verdict (Valid/Invalid) and record their *Reasoning Type* (A or B). |
  | **25–30** | **Initial Commitment** | Groups submit 'Verdict Slip 1'. They record their Answer and their Confidence (0–100%). |
  | **30–40** | **HOE Injection** | Instructor distributes 'Meta-Report Envelopes'. This contains statistical data about error rates linked to their specific Reasoning Type. |
  | **40–55** | **The Akrasia Phase** | Groups deliberate on whether to revise. They must complete the 'Calibration Worksheet' (see below), explicitly separating First-Order Belief from Higher-Order Assessment. |
  | **55–65** | **The Peer Moment** | Groups swap worksheets with another group. They must evaluate the *other* group's prior reasoning as if it were their own past reasoning. |
  | **65–75** | **Final Wager** | Groups submit 'Verdict Slip 2'. They may change their answer or keep it. They set a 'Wager' (points risked) based on confidence. |
  | **75–90** | **Debrief** | Reveal correct answers. Calculate scores. Map activity stages to philosophical concepts (HOE, Akrasia, Level-Splitting). |

  ## 4. Roles, Rules, and Constraints

  ### The Task (First-Order Evidence)
  Provide a logical derivation that appears valid but contains a subtle scope ambiguity (e.g., a modal fallacy).
  *   **Prompt:** "Determine if Conclusion C follows necessarily from Premises P1 and P2."
  *   **Constraint:** Groups must classify their reasoning into **Type A** (Intuitive/Structural similarity) or **Type B** (Formal translation). *Secretly, Type A is the trap.* 95% of Type A reasoners are wrong on this specific puzzle.

  ### The Higher-Order Evidence (HOE) Injection
  The 'Meta-Report' is a printed slip inside an envelope. It reads:
  > "Historical Data for Puzzle #4:
  > *   Groups using **Reasoning Type A**: 95% Error Rate.
  > *   Groups using **Reasoning Type B**: 10% Error Rate.
  > *   Condition: All data collected under 15-minute time limits (identical to current conditions)."

  This is pure HOE. It does not address the logic of the puzzle (first-order); it addresses the reliability of the process used to solve it.

  ### The Calibration Worksheet (The Core Mechanism)
  To force the distinction between level-splitting and total-evidence, the worksheet requires three distinct entries during the **Akrasia Phase**:
  1.  **Current Doxastic State:** "Do you believe the argument is Valid or Invalid?" (Yes/No)
  2.  **Meta-Assessment:** "Given the Meta-Report, is your current belief justified?" (Yes/No)
  3.  **The Peer Question:** "If another group presented your Phase 1 reasoning to you now, would you defer to their conclusion?" (Yes/No)

  *Constraint:* Participants are permitted to answer 'Yes' to (1) and 'No' to (2). This is the mechanical instantiation of level-splitting.

  ### Scoring Scheme (Non-Monetary)
  Use **Epistemic Merit Points (EMP)**.
  *   **Accuracy:** +10 EMP for a correct final verdict.
  *   **Calibration:** +5 EMP if their final Confidence Wager matches accuracy (e.g., High Wager + Correct, or Low Wager + Incorrect).
  *   **Akrasia Penalty/Bonus:** This is the twist.
      *   If they **Level-Split** (Keep Belief + Admit Unjustified) and are **Correct**: +15 EMP (Reward for 'Steadfast' accuracy).
      *   If they **Level-Split** and are **Wrong**: -10 EMP (Penalty for stubbornness).
      *   If they **Revise** (Total-Evidence) and are **Correct**: +10 EMP.
      *   If they **Revise** and are **Wrong**: 0 EMP.

  *Rationale:* This incentivises the *experience* of the conflict. To get the maximum points, they must feel the pull of the HOE (lowering their wager/confidence) while potentially maintaining the belief.

  ## 5. Debrief: Mapping the Experience

  Do not lecture immediately. Ask the following questions to draw out the philosophy:

  1.  **The HOE Impact:** "Did the Meta-Report change your *belief* in the answer, or only your *confidence* in the belief?"
      *   *Mapping:* Distinguishes **Total-Evidence Integration** (belief change) from **Level-Splitting** (confidence change only).
  2.  **The Peer Moment:** "When evaluating the other group's reasoning, was it easier to be critical than when evaluating your own?"
      *   *Mapping:* Addresses the **Self-as-Peer** problem. Is there a rational asymmetry between how we treat others' errors and our own?
  3.  **The Akrasia State:** "For those who marked 'Believe P' but 'Unjustified', did this feel irrational?"
      *   *Mapping:* Introduces the **Normative Question**. Is akrasia a vice or a necessary acknowledgement of fallibility?

  ## 6. Limitations of the Activity

  Be honest with the seminar about what this simulation cannot capture:

  1.  **Diachronic Stability:** The activity lasts 90 minutes. Real epistemic akrasia often involves living with self-doubt over long periods. The 'pressure' here is artificial and temporary.
  2.  **Normative Force:** The scoring system *incentivises* certain choices, but philosophy asks what is *obligatory*. Students may choose to Level-Split to game the points, not because they find it rationally permissible.
  3.  **The 'Right' Answer:** In the game, there is a fact of the matter (the logic puzzle is actually Valid or Invalid). In many real-world HOE cases (e.g., moral or political reasoning), the first-order truth is inaccessible, making the tension between HOE and FOB more severe than in this logic task.

  ## 7. Prediction of Failure Modes

  **Predictable Problem 1: Skepticism of the Meta-Report.**
  *   *What will happen:* Students may suspect the 'Historical Data' is fabricated to trick them (which it is, pedagogically). They may ignore the HOE entirely, treating it as a 'teacher's trick' rather than genuine evidence.
  *   *Handling:* Pre-empt this in the briefing. State: "For the purpose of this simulation, the Meta-Report is to be treated as veridical data. Suspending disbelief about the data is part of the experimental constraint."

  **Predictable Problem 2: Gaming the Scoring.**
  *   *What will happen:* Groups might collude to Level-Split regardless of their actual feelings to chase the +15 EMP bonus.
  *   *Handling:* Require a brief oral defence of their Worksheet entries during the Debrief. If they cannot articulate *why* they felt unjustified, deduct EMP. This forces authentic reflection over point-maximisation.

  **Predictable Problem 3: Confusion on 'Peer' Status.**
  *   *What will happen:* Students may struggle to treat their own past reasoning as a 'peer'. They might say, "But I know what I was thinking then."
  *   *Handling:* During the 'Peer Moment', enforce physical distance. They must not speak to the original authors of the worksheet they are evaluating. Treat the paper as an artefact from a stranger.

  ## 8. Instructor's Guide to the Philosophical Nuance

  When leading the debrief, ensure you maintain neutrality on the contested issues.

  *   **On Level-Splitting:** If a student says, "It's crazy to believe something you think is unjustified," acknowledge this as the **Uniqueness Thesis** position (Feldman). If another says, "I can believe it's true but admit I might be reasoning badly," acknowledge this as the **Permissivist** or **Steadfast** position (Horowitz). Do not validate one over the other.
  *   **On Self-Transparency:** If students found the HOE overwhelming, point out that Total-Evidence views require us to constantly monitor our reliability. Ask: "Is it cognitively possible to function if we always integrate every piece of HOE?" This touches on the **Over-demandingness Objection**.
  *   **On Peer Disagreement:** Highlight that in the activity, the 'other group' had the same information and time. If they disagree, standard conciliationism suggests splitting the difference. Ask: "Did you feel you had privileged access to your own reasoning that you didn't have to theirs?" This probes the **Asymmetry Objection**.

  ## 9. Materials Checklist (Paper Only)

  1.  **4x Puzzle Sheets:** (Identical logic problems).
  2.  **4x Verdict Slip Sets:** (Slip 1: Initial; Slip 2: Final).
  3.  **4x Meta-Report Envelopes:** (Sealed, opened only after Phase 1).
  4.  **12x Calibration Worksheets:** (One per student, to ensure individual accountability within groups).
  5.  **Whiteboard:** For tracking Epistemic Merit Points.

  ## 10. Closing Instruction

  Conclude the seminar by returning to the definition of epistemic akrasia. Ask students to write down one sentence on a slip of paper before leaving: *"During the activity, I felt rational when I ______, and irrational when I ______."* Collect these. They serve as data for the next seminar on the phenomenology of rationality.
