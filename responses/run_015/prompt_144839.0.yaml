      *   Cover conceptual distinctions? Check.
      *   Cover physics constraints? Check.
      *   Cover ethical boundaries? Check.
      *   Identify killer constraint? Check.
      *   Address joint unsatisfiability? Check.

  9.  **Final Polish:** Ensure the distinction between "locus of experience" (metaphysical) and "moral patient" (normative) is sharp. Ensure the "Diffuse Valence" concept is treated as a serious theoretical move, not just a footnote. (Self-correction: The user *proposed* the split, so I should treat it as a hypothesis to be tested by the desiderata, not just a given.)

