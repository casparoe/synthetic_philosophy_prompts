  4.  **Refining and Polishing the Desiderata:**

      *   *Naming:* Make them precise. "The Binding Constraint," "The Conservation Constraint," "The Valence Discrimination Constraint."
      *   *Justification:* Ensure each explains *why* it's non-negotiable (physics/ethics) vs. negotiable.
      *   *The "Killer" Constraint:* I need to identify which one breaks the most theories. Likely the *Integration/Binding Constraint* combined with *Non-Arbitrariness*. Cosmopsychism fails integration (too big). Atomism fails integration (too small/disconnected). Brain-only fails non-arbitrariness.
      *   *The Tension:* The "Joint Unsatisfiability" clause. It is highly likely that satisfying *all* these leads to a contradiction (e.g., if physics is continuous, any cutoff is arbitrary; if cutoff is non-arbitrary, it must be physical, but no physical property clearly maps to 'subjecthood' without dualism). I should frame this as the "Hard Boundary Problem."

  5.  **Addressing Specific User Points:**

