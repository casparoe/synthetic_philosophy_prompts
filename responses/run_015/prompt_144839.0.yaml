prompt: |-
  I've been working through the ethical implications of panpsychism in fundamental physics—not the pop-science framing where "everything is conscious," but the actual problem of whether quantum fields or fundamental particles can be subjects of suffering, and what that would require of a normative framework. Before comparing specific theories, I want the full spec: what must any adequate account of pan-sentient suffering actually get right?

  Give me the desiderata list with the reasoning behind each entry. I need it to cover: (1) the physical configurations it must distinguish without collapsing—ground-state fields, highly entangled regions, thermal noise, coherent structures—since treating them all identically either generates an implausible moral catastrophe or relies on an arbitrary cutoff; (2) the conceptual distinctions it must preserve, particularly between being a locus of experience, being a moral patient, and being an agent, but also my proposed split between integrated suffering (negative valence bound into a unified subject) and diffuse negative valence (a field state that is aversive but never accumulated into anyone's experience); (3) the constraints from physics it cannot violate—conservation laws, the absence of detectable suffering-signals in particle interactions, and the fact that brains remain our only independently validated consciousness-carriers; (4) the ethical boundary conditions—avoiding both the reductio that every electron interaction demands moral intervention and the chauvinist exemption that dismisses all non-biological sentience by fiat.

  For each requirement, explain the motivating case or physical intuition that makes it genuinely non-negotiable versus a prejudice of biological chauvinism or anthropocentric scale-bias, and flag which ones might be negotiable without destroying the framework. Then identify the single desideratum that eliminates the most popular current candidates—whether it's the integration constraint that undermines cosmopsychism, the non-arbitrariness constraint that undermines brain-only exemptions, or the scale-invariance problem that undermines "small minds" theories. If some subset of these is jointly unsatisfiable, treat that tension as a result in itself rather than a failure of analysis.

  I'm not asking for a bibliography, author list, or survey of the panpsychist literature; I want the conceptual architecture built from first principles, though standard distinctions like integrated information or quantum coherence are fair game as background. A table scoring the main contender-types against the list is fine, but keep the weight on the criteria and their justifications, since the scoring depends on knowing the candidates and the criteria are where the actual work is.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

