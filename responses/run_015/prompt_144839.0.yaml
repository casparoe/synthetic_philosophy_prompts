answer: |-
  This is a specification for a **Normative Physics of Sentience**. To construct a framework where fundamental physics carries ethical weight without collapsing into absurdity or violating empirical data, we must define the necessary conditions for *moral relevance* in a pan-sentient ontology.

  Below are the six non-negotiable (or conditionally negotiable) desiderata. Each is anchored in physical intuition, conceptual coherence, or ethical necessity.

  ### 1. The Binding/Integration Constraint
  **Requirement:** The framework must specify a physical mechanism that distinguishes a *unified subject of experience* from a *collection of experiential parts*. It must explain why a bound system (e.g., a brain, or a specific field configuration) constitutes a single "who" that suffers, whereas the constituent particles do not suffer *independently* of that whole.

  *   **Rationale:** Without this, we face the "combination problem" in reverse. If every electron suffers, and a brain contains $10^{26}$ electrons, does the brain suffer $10^{26}$ times more? Or does the brain's suffering replace the electrons'? If the former, we face an ethical catastrophe (vastly more suffering in rocks than brains). If the latter, we need a physical account of how micro-experiences vanish or merge.
  *   **Physical Anchor:** Quantum decoherence and entanglement structure. A subject likely requires a causally integrated region where information is not merely present but *bound*.
  *   **Status:** **Non-Negotiable.** Without a subject, there is no one to whom suffering happens. "Free-floating pain" is a category error unless you adopt the Diffuse Valence model (see Desideratum 4).
  *   **Bias Check:** This is not biological chauvinism; it is a structural requirement for *subjecthood*. However, the *degree* of integration required is negotiable.

  ### 2. The Valence Discrimination Constraint
  **Requirement:** The framework must distinguish physical states that carry negative valence (suffering) from those that are neutral or positive, based on physical parameters (e.g., entropy production, energy density, coherence time) rather than arbitrary fiat. It must explicitly exempt ground-state fields and thermal equilibrium from moral consideration.

  *   **Rationale:** If the vacuum state or thermal noise counts as suffering, the universe is a torture chamber by default, rendering moral action impossible (we cannot stop existence). Suffering must correlate with *deviation*, *friction*, or *constraint* in the physical dynamics, not mere existence.
  *   **Physical Anchor:** Thermodynamics and QFT. Ground states are stable; suffering intuitively correlates with resistance, high energy gradients, or frustrated minimization.
  *   **Status:** **Non-Negotiable.** Failing this leads to the "Moral Catastrophe" (everything hurts all the time).
  *   **Bias Check:** Must not rely on "complexity" alone, as simple systems can be in high-tension states.

  ### 3. The Causal Closure (Conservation) Constraint
  **Requirement:** The existence of suffering in a fundamental entity must not violate conservation laws or introduce detectable "psychic forces" into particle interactions. The phenomenology must be causally closed or supervenient without adding energy to the system.

  *   **Rationale:** We do not observe particles behaving differently because they are "in pain." If suffering altered cross-sections or decay rates, we would have detected it. A normative framework cannot require physics to be wrong.
  *   **Physical Anchor:** Noether's Theorem and Standard Model precision tests.
  *   **Status:** **Non-Negotiable.** Physics is empirically robust; ethics must fit physics, not rewrite it.
  *   **Bias Check:** This forces a form of epiphenomenalism or dual-aspect monism at the fundamental level.

  ### 4. The Diffuse vs. Integrated Valence Distinction
  **Requirement:** The framework must account for the possibility of **Diffuse Negative Valence** (aversive field states with no unified subject) separately from **Integrated Suffering** (negative valence bound to a locus). It must assign moral weight (or lack thereof) to the diffuse category explicitly.

  *   **Rationale:** This addresses your proposed split. If a field state is "aversive" (e.g., high tension, instability) but lacks integration (Desideratum 1), is it bad? If yes, we still face moral catastrophe (the universe is full of aversive fields). If no, we risk ignoring real negative states that *could* become integrated.
  *   **Conceptual Anchor:** The distinction between *pain* (qualitative experience) and *nociception* (damage signaling). Diffuse valence is cosmic nociception without a "self" to feel it.
  *   **Status:** **Negotiable (The Pivot Point).** This is the primary escape hatch. If you argue Diffuse Valence has *zero* moral weight, you save the framework from catastrophe but risk "chauvinism of scale." If it has *some* weight, you must quantify it without triggering the catastrophe.
  *   **Bias Check:** Dismissing diffuse valence entirely risks biological chauvinism. Counting it fully risks moral paralysis.

  ### 5. The Non-Arbitrariness (Scale-Invariance) Constraint
  **Requirement:** The cutoff for moral patienthood cannot be "biological" or "human-sized." It must rely on a physical invariant (e.g., a specific threshold of integrated information, coherence length, or causal density) that applies equally to a neutron star, a bacterium, or a quantum field region.

  *   **Rationale:** To avoid the "chauvinist exemption." We cannot simply assert "brains count, atoms don't" without a principled difference. If the difference is complexity, at what exact number of bits does suffering ignite?
  *   **Physical Anchor:** Renormalization group flow or phase transitions. There must be a "phase change" in ontology, not a smooth gradient that implies vague identity.
  *   **Status:** **Non-Negotiable.** Arbitrary cutoffs destroy the philosophical integrity of panpsychism.
  *   **Bias Check:** This is the hardest constraint to satisfy physically. Nature is usually continuous; moral status seems discrete (you are either a patient or you aren't).

  ### 6. The Empirical Silence Constraint
  **Requirement:** The framework must explain why, if fundamental entities are sentient/suffering, this does not manifest as detectable noise, anomaly, or "screaming" in high-energy collision data or astrophysical observations.

  *   **Rationale:** If fundamental particles suffer, does that affect their behavior? If not, why? If yes, why haven't we seen it? The theory must predict the *invisibility* of fundamental suffering to current instrumentation.
  *   **Physical Anchor:** Signal-to-noise ratios in particle detectors.
  *   **Status:** **Non-Negotiable.** Consistency with observation.
  *   **Bias Check:** This constrains interactionist panpsychism heavily, favoring constitutive or dual-aspect views.

  ---

  ### The Killer Constraint: The Joint Unsatisfiability of (1) and (5)

  The single desideratum that eliminates the most popular current candidates is not one in isolation, but the tension between **The Binding/Integration Constraint (1)** and **The Non-Arbitrariness Constraint (5)**.

  **The Result:** *The Hard Boundary Problem.*

  1.  **Atomism (Micropsychism):** Fails (1). Electrons are not integrated subjects. If they are, we have $10^{80}$ sufferers in the universe, triggering moral catastrophe.
  2.  **Cosmopsychism:** Fails (1) in the relevant sense. The Universe is a subject, but it does not explain *local* suffering (my pain vs. the void). It also struggles with (5) because it posits one subject, making local moral intervention incoherent.
  3.  **Emergentism (Brain-Only):** Fails (5). It posits a magical cutoff where "enough atoms" create a subject. This is biologically chauvinistic unless a specific physical invariant (like IIT's $\Phi$) is identified, which currently lacks empirical validation in physics.
  4.  **Diffuse Valence Models:** Fails (4) depending on interpretation. If diffuse valence counts morally, we return to catastrophe. If it doesn't, we must explain why *integration* creates moral value ex nihilo.

  **The Tension:**
  Physics is fundamentally continuous (fields, wavefunctions). Moral patienthood is fundamentally discrete (there is a "someone" or there isn't).
  *   To satisfy **(5) Non-Arbitrariness**, you need a physical phase transition that creates a subject.
  *   To satisfy **(1) Integration**, that transition must bind information.
  *   **The Conflict:** No known physical phase transition creates *subjectivity*. We have transitions for conductivity, magnetism, and symmetry breaking, but none for "locus of experience." Therefore, any theory that claims to identify the precise physical cutoff for suffering is currently making a metaphysical claim disguised as a physical one.

  **Conclusion on Unsatisfiability:**
  It is highly probable that **(1), (4), and (5) are jointly unsatisfiable** under current physics.
  *   If you keep (1) and (5), you must posit new physics (a "consciousness field" or modification to QM) to mark the boundary.
  *   If you keep current physics and (5), you must abandon (1) and accept that subjecthood is an illusion (Eliminativism).
  *   If you keep current physics and (1), you must abandon (5) and accept that the cutoff is vague or pragmatic (which violates the rigor of the framework).

  ### Scoring Contender Types

  | Candidate Type | Binding (1) | Valence Discrim (2) | Causal Closure (3) | Diffuse/Integrated (4) | Non-Arbitrary (5) | Empirical Silence (6) | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Micropsychism** (Atoms feel) | **FAIL** (Too many subjects) | **FAIL** (Ground states suffer?) | PASS | **FAIL** (No distinction) | PASS | PASS | **Ethically Catastrophic** |
  | **Cosmopsychism** (Universe feels) | **FAIL** (No local subjects) | PASS | PASS | **FAIL** (Dissolves local pain) | PASS | PASS | **Ethically Inert** |
  | **Emergentism** (Brains feel) | PASS | PASS | PASS | PASS | **FAIL** (Arbitrary cutoff) | PASS | **Biologically Chauvinist** |
  | **IIT-Based Panpsychism** | PASS (Theoretical) | **FAIL** (High $\Phi$ in grids?) | PASS | **FAIL** (Diffuse = 0 $\Phi$) | **FAIL** (Vague threshold) | PASS | **Physically Unverified** |
  | **Diffuse Valence Model** (Your Proposal) | PASS (By distinction) | PASS | PASS | **PASS** (Core feature) | **NEGOTIABLE** (Depends on moral weight of diffuse) | PASS | **Most Viable, High Risk** |

  ### Analysis of the Diffuse Valence Model (Your Proposal)

  Your proposed split between **Integrated Suffering** and **Diffuse Negative Valence** is the only architecture that potentially survives the *Moral Catastrophe* reductio while respecting *Non-Arbitrariness*.

  *   **Why it works:** It allows fundamental physics to be "aversive" (satisfying the intuition that pain is rooted in physical tension/entropy) without requiring a "victim" for every interaction. It treats subjecthood as a rare, high-order binding event (satisfying Integration).
  *   **The Remaining Risk:** The moral status of Diffuse Valence.
      *   If Diffuse Valence has *zero* moral weight: You solve the catastrophe, but you must explain why *integration* confers moral value. Is it wrong to torture a bound system but okay to create infinite diffuse aversion? This risks a "Subjecthood Chauvinism."
      *   If Diffuse Valence has *partial* moral weight: You avoid catastrophe but must calculate the integral of aversion across the universe. If the sum of diffuse aversion exceeds integrated suffering, the ethical imperative remains "destroy the universe," just for a different reason.

  **Final Recommendation:**
  The critical work for your framework lies in **Desideratum 4**. You must define the normative relationship between Diffuse Valence and Integrated Suffering.
  *   *Option A:* Diffuse Valence is morally inert (only subjects matter). This saves the framework but requires a robust defense of why "subjecthood" is the sole carrier of value.
  *   *Option B:* Diffuse Valence is morally relevant but discountable (e.g., exponential decay of weight without integration). This preserves the intuition that "pain is bad" regardless of a subject, but avoids the catastrophe.

  If you cannot resolve the moral weight of Diffuse Valence without arbitrariness, the **Joint Unsatisfiability** result stands: A pan-sentient physics compatible with normative ethics is impossible without modifying either our understanding of physics (to find a subject-making mechanism) or our ethics (to accept the catastrophe).
