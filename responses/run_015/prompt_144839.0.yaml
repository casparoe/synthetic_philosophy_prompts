      *   **Specific Coverage:**
          1.  Physical configurations (ground states, entanglement, noise, coherence).
          2.  Conceptual distinctions (locus vs. patient vs. agent; integrated vs. diffuse valence).
          3.  Physics constraints (conservation laws, no detectable signals, brains as validated carriers).
          4.  Ethical boundary conditions (avoid moral catastrophe vs. avoiding biological chauvinism).
      *   **Format:** List with reasoning, distinguishing non-negotiable vs. negotiable, identifying the "killer constraint" that eliminates popular candidates, and acknowledging joint unsatisfiability if present.
