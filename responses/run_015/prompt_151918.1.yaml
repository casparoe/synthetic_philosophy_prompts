prompt: |-
  I'm taking a course on moral psychology and we're talking about Susan Wolf's idea of moral saints, but also this less-discussed framing about moral division of labor — like, maybe society needs some people who aren't maximally good so they can do art or politics?

  I keep getting confussed about whether Wolf thinks saints are literally impossible or just undesireable. Could you write an essay on whether maximal moral goodness is actually desireable? Weigh the main arguements on both sides, including Wolf's claim that saints lack personal projects and the reply that coordination problems might actually require universal sainthood. Don't end with a non-committal it depends — defend an actual verdict. Also, try to untangle the subtle conflation between being maximally good and being morally obsessed; I think a lot of people slide those together but they're not the same, and it's central to the whole debate.
