  **The Saintly Paradox: Maximizing Goodness vs. Human Flourishing**

  In her seminal 1982 paper *Moral Saints*, Susan Wolf poses a disturbing question to moral philosophy: Would you want to be a moral saint? More importantly, would you want to live in a world populated by them? Wolf's intuition is a resounding "no." She argues that a life dedicated to maximizing moral goodness is inherently unattractive because it crowds out the personal projects, hobbies, and eccentricities that make a human life rich. However, this conclusion rests on a specific, and perhaps flawed, psychological profile of the saint. In evaluating whether maximal moral goodness is desirable, we must disentangle the concept of *maximization* from the psychological state of *obsession*. While Wolf correctly identifies the unattractiveness of the morally obsessed, she fails to prove that maximal goodness itself is undesirable. Once we correct for this conflation and account for the efficiencies of a universal moral division of labor, it becomes clear that a world of moral saints is not only desirable but preferable to a mixed society, provided we understand that maximizing the good often requires the pursuit of non-moral goods.

  To understand the stakes, we must first clarify Wolf's target. Wolf defines a moral saint as someone whose every action is as morally good as possible, and whose life is dominated by a commitment to improving the welfare of others. She distinguishes between the "Loving Saint," who finds happiness in being moral, and the "Rational Saint," who subordinates their personal interests to moral demands through willpower. Wolf argues that both are undesirable. The Rational Saint is grim and self-sacrificing, lacking fun. The Loving Saint is arguably worse; because they find their greatest joy in altruism, they lack a critical perspective on the value of non-moral pursuits. They cannot genuinely enjoy a gourmet meal or a hobby for its own sake, but only insofar as it serves the moral mission. Consequently, Wolf suggests that a society needs a "moral division of labor." If everyone is a saint, who writes the symphonies, tells the jokes, or engages in the selfish brinkmanship required for effective politics? Wolf implies we need non-saints to cultivate the non-moral virtues that make life worth living.

  However, Wolf's argument relies heavily on a conflation between being *maximally good* and being *morally obsessed*. This is the central error in the anti-saint position. To be maximally good is to produce the best possible outcome (or act according to the best possible reasons); it is not necessarily to walk around in a state of grim, self-flagellating calculation. A truly rational maximizer of the good would recognize that human beings are not infinite resources. Burnout is morally counterproductive. Therefore, a moral saint might spend an afternoon reading fiction, not because they are slacking, but because a rested, culturally enriched mind is more effective at doing good in the long run. Furthermore, if art, beauty, and deep personal relationships have intrinsic value (as most moral theories admit), then the maximally good person is *required* to pursue them.

  The conflation lies in the motivation. Wolf assumes that if a saint paints a picture, they do so *only* because it is morally optimal, thereby stripping the act of its authenticity. This is the "one thought too many" objection. But this assumes a narrow, duty-bound conception of morality. If one's moral framework values human flourishing, then the saint paints because they love painting, and they love painting because it contributes to the flourishing of the world. The psychological experience of the saint need not differ from the non-saint; the difference lies in the safety net of justification. The non-saint paints because they want to, even if it's selfish. The saint paints because they want to, *and* it is good. The internal experience of joy remains intact. Therefore, the "boring" saint is a caricature. A maximally good person would likely be vibrant, rested, and culturally engaged, because a dull, exhausted person contributes less to the moral landscape.

  This leads to the second pillar of Wolf's argument: the necessity of a moral division of labor. Wolf suggests that society functions best when some people focus on morality while others focus on art, politics, or personal excellence. The implication is that if everyone were a saint, these non-moral spheres would vanish. This argument collapses under the weight of coordination. In a world of universal sainthood, the "division of labor" does not disappear; it becomes perfectly optimized. Saints would not all rush to the soup kitchen. Recognizing that society needs art to sustain the human spirit, some saints would dedicate themselves to art. Recognizing that politics requires negotiation and compromise, some saints would enter government.

  The crucial difference is that in a world of saints, these roles are filled by people who are trustworthy and cooperative. In our current mixed world, the "artist" might be selfish and exploitative, and the "politician" might be corrupt. In a world of saints, the artist creates beauty knowing it serves the collective good, and the politician negotiates without greed. The fear that saints would be bad at politics assumes that morality prohibits the necessary "dirty hands" of governance. But if the goal is the welfare of others, a saint would get their hands dirty if it saved lives. The only thing a saint refuses to do is act *against* the welfare of others for personal gain. It is hard to argue that a society devoid of selfish corruption is undesirable.

  So, is maximal moral goodness desirable? The verdict is yes, but with a critical caveat: it is desirable only if we reject the ascetic definition of morality that Wolf implicitly attacks. If "maximal moral goodness" means a life of grim self-sacrifice where one never laughs unless it is utilitarian, then Wolf is right; it is undesirable. But that is not maximal goodness; that is moral pathology. True maximal goodness encompasses the full spectrum of human value. It recognizes that a world with laughter, art, and deep personal love is morally superior to a world of drudgery. Therefore, the person who maximizes the good will be the person who cultivates those things.

  We must also confront why we resist this conclusion. The resistance to the moral saint is rarely about the saint's quality of life; it is about what the saint implies for the rest of us. The existence of a moral saint highlights our own moral mediocrity. To admit that the saint's life is desirable is to admit that we ought to be more like them. Wolf's argument functions as a defense of the permission to be selfish. She argues that we *shouldn't* want to be saints so that we don't have to feel bad about not being one.

  Ultimately, the argument for the desirability of maximal goodness rests on the unity of value. There is no fundamental conflict between being a good person and being a fully realized human being, provided our moral theory is robust enough to value human realization. A society of saints would not be a society of robots; it would be a society where the division of labor is coordinated by mutual care rather than competition. The artist creates beauty not in spite of morality, but as an expression of it. The politician serves not for power, but for welfare.

  We should not fear the moral saint. We should fear the conception of morality that makes sainthood look like a curse. Maximal moral goodness is desirable because it represents the most coherent integration of self-interest and other-interest. To wish for a world with fewer saints is to wish for a world with more preventable suffering and less genuine cooperation. We do not need non-saints to keep the world interesting; we need saints to keep the world livable. The ideal is not to lower the bar of morality to accommodate our laziness, but to raise our understanding of morality to accommodate our humanity.
