answer: |-
  Here is a pruned and reconstructed desiderata list, tailored to the specific purpose of underwriting the statistical practice of a working physicist within the Everett picture. I have sharpened your candidates, added the missing technical constraints, and flagged the status of each. Following the list, I address the tensions, the primary exclusionary requirement, and the scoring of the broad approaches.

  ### The Desiderata List

  **1. Action-Guiding Normativity**
  *   **Requirement:** The account must generate a normative constraint on decision-making. It cannot merely state that branches *have* weights; it must explain why an agent *ought* to weight her expectations or bets accordingly.
  *   **Motivating Case:** The physicist must decide whether to fund a follow-up experiment based on the significance of her current data. If the account only says "low-weight branches exist," she lacks a reason to ignore the possibility that she is on one. She needs a reason to act *as if* the low-weight outcome is unlikely to be hers.
  *   **Status:** **Non-negotiable.** Without this, the account is descriptive metaphysics, not a foundation for statistical practice.

  **2. Finite Sample Adequacy**
  *   **Requirement:** The account must justify expectations about a specific, finite sequence of outcomes, not just asymptotic frequencies across the whole multiverse.
  *   **Motivating Case:** The physicist has 40 data points on Monday. A theorem stating that "measure-1 of branches show Born frequencies in the limit $N \to \infty$" does not tell her whether her specific $N=40$ run is typical or a statistical fluctuation. She needs to know why she should be surprised if her finite sample deviates significantly from the Born prediction.
  *   **Status:** **Non-negotiable.** This is the core of the "working physicist" brief.

  **3. Basis and Granularity Stability**
  *   **Requirement:** The assigned probabilities must be invariant under changes in the coarse-graining of the branch decomposition, provided the decoherence condition is met.
  *   **Motivating Case:** Decoherence defines branches only relative to a scale (e.g., pointer position to $\pm 1\mu m$ vs. $\pm 1mm$). If the probability of "spin up" changes because we altered the definition of the macroscopic pointer state, the probability is an artifact of description, not a physical quantity suitable for error bars.
  *   **Status:** **Non-negotiable.** Real measurements are never perfectly projective; the account must survive the fuzziness of real apparatuses.

  **4. Irrational and Continuous Weight Accommodation**
  *   **Requirement:** The account must derive probabilities for amplitudes that do not correspond to rational ratios of branch counts, and for continuous spectra where individual outcomes have measure zero.
  *   **Motivating Case:** A spin measurement at an angle yielding amplitude $1/\sqrt{\pi}$. There is no integer number of "equal weight" sub-branches to count. Similarly, measuring position yields a continuum; the account must distinguish "probability zero" from "impossible" without relying on discrete branch counting.
  *   **Status:** **Non-negotiable.** Quantum mechanics is not limited to rational amplitudes or discrete spectra.

  **5. Axiomatic Independence (Non-Circularity)**
  *   **Requirement:** The derivation must not presuppose probabilistic concepts (like "uncertainty," "chance," or "caring measure") that are equivalent to the Born rule in the premises.
  *   **Motivating Case:** If the argument begins with "agents should maximize expected utility where utility is weighted by squared amplitude," it has assumed the conclusion. The physicist needs to know *why* the Hilbert space norm is the relevant measure for uncertainty, not just that it is.
  *   **Status:** **Camp Preference (Rationalists/Derivers).** Some camps (e.g., Pragmatists) argue that some normative input is inevitable and that "non-circularity" is an impossible standard for normative conclusions. However, for a *derivation*, this is treated as NN.

  **6. Decoherence Dependency (The Interference Constraint)**
  *   **Requirement:** Probabilities must only attach to outcomes after interference terms have become negligible. The account must explain why we do not assign probabilities to components of a coherent superposition prior to measurement.
  *   **Motivating Case:** In a double-slit experiment without which-path detection, we do not assign a probability to "went through slit A." The account must explain why probability emerges only when the unitary evolution creates effectively non-interfering components.
  *   **Status:** **Non-negotiable.** Assigning probabilities to interfering terms yields wrong predictions (no interference patterns).

  **7. Empirical Generalizability (POVMs and Noise)**
  *   **Requirement:** The account must extend to generalized measurements (Positive Operator-Valued Measures) and non-ideal detectors, not just clean projective measurements.
  *   **Motivating Case:** Real labs use inefficient detectors and weak measurements. If the probability account only works for ideal von Neumann measurements, it cannot underwrite actual experimental practice where efficiency corrections are standard.
  *   **Status:** **Camp Preference (Pragmatists).** Theoretically, ideal measurements might suffice for fundamental ontology, but for the "working physicist" brief, this is NN.

  **8. Self-Locating Updating Rule**
  *   **Requirement:** The account must provide a rule for how credences change upon learning which branch one occupies (e.g., seeing the pointer read "Up").
  *   **Motivating Case:** Post-measurement, the agent knows she is on *a* branch. If she treats her pre-measurement uncertainty as self-locating uncertainty, she must update to certainty without violating conditionalization.
  *   **Status:** **Camp Preference (Self-Locating Uncertainty Camp).** Decision-theoretic camps often treat this as derivative of the betting quotients; Self-Locating camps treat it as foundational.

  ---

  ### The Incompatibility Tension

  You guessed the tension lies between **Finite Sample Adequacy** (Exactness) and **Granularity Stability**. I agree this is a serious technical friction, but I argue the deeper, jointly unsatisfiable tension is between **Finite Sample Adequacy** and **Branching Completeness** (implicit in the Ontology).

  **The Tension: Finite Sample Adequacy vs. Branching Completeness**
  *   **The Conflict:** *Finite Sample Adequacy* requires that the physicist can rationally expect her specific finite data set to match the Born statistics (within error bars). It implies that deviant sequences are "unlikely" in a sense that warrants ignoring them for practical purposes. *Branching Completeness* (the core of Everett) states that for any finite sequence of outcomes, there *exists* a branch where that sequence occurs. Every possible string of 40 data points is instantiated.
  *   **Why they clash:** If every sequence exists, in what sense is the physicist justified in expecting the Born-typical one? A "typicality" measure (Requirement 2) tells her that *most* branches (by measure) are typical. But it does not tell *her* that she will find herself on one of them. To bridge this gap, she needs a principle that links *Measure* to *Subjective Expectation*.
  *   **The Upshot:** You cannot satisfy **Finite Sample Adequacy** (in the strong sense of "I expect this outcome") without weakening **Branching Completeness** (by introducing a primitive notion of "subjective uncertainty" or "chance" that picks out one branch as *the* future). If you keep Branching Completeness strict (all branches are equally real), you must weaken Finite Sample Adequacy to "I am on a typical branch" (which is a tautology about the set, not a prediction for the agent).
  *   **Resolution:** The requirement that must be weakened is **Finite Sample Adequacy**. It must be downgraded from "Justification for expecting specific data" to "Justification for betting *as if* one expects specific data." The account can underwrite the *practice* (betting, error bars) without guaranteeing the *truth* of the expectation (that the data *will* be typical). The physicist is not self-deceived because her betting behavior is rational, even if her ontological expectation (that she is "more likely" to be on a high-weight branch) is metaphysically suspect.

  *(Note on your Granularity guess: You are right that exact Born weights are mathematically precise while decoherence branches are physically fuzzy. However, this is a standard effective-field-theory problem. We accept that "temperature" is fuzzy but use it in exact equations. This tension is manageable via approximation bounds. The Finitude/Completeness tension is structural.)*

  ### The Primary Exclusionary Requirement

  The single requirement that does the most work in excluding candidates is **Action-Guiding Normativity (Requirement 1)**.

  *   **Why:** Many accounts can describe the branching structure and assign a measure to branches (**Branch-Counting**, **Pure Typicality**). They can even show that the measure matches the Born rule (**Envariance**). However, they fail to explain why a rational agent should *care* about that measure when making decisions.
  *   **The Failure Mode:** A branch-counting account can say "there are more branches where spin is up." But if the agent asks, "Why should I bet on Up?" the answer "Because there are more of them" fails if the "more" refers to a count that doesn't align with the Hilbert norm (which it usually doesn't). A typicality account can say "You are likely to be typical." But if the agent asks, "Why should I bet on being typical?" the account often has no answer other than "Because that's what probability means," which is circular in this context.
  *   **Result:** This requirement excludes naive Branch-Counting, pure Frequentist approaches within EQM, and "bare" Typicality accounts. It forces the remaining candidates to import decision theory or a robust principle of self-locating indifference.

  ### Scoring the Broad Families

  **1. Decision-Theoretic Derivations**
  *   **Score:** High on Normativity and Finitude; Low on Axiomatic Independence.
  *   **Reasoning:** These excel at telling the physicist *why to bet* (satisfying Normativity and Finite Sample Adequacy for practical purposes). They handle irrational weights and continuous outcomes well. However, they are widely accused of smuggling probabilistic assumptions into the decision-theoretic axioms (e.g., diachronic consistency), failing **Axiomatic Independence**. They also sometimes struggle to explain why probabilities emerge *only* after decoherence without additional assumptions.

  **2. Symmetry / Envariance Arguments**
  *   **Score:** High on Axiomatic Independence and Granularity; Low on Normativity.
  *   **Reasoning:** These derive the weights from the structure of entanglement and symmetry, avoiding decision-theoretic premises (satisfying **Axiomatic Independence**). They handle **Irrational Weights** via continuity assumptions. However, they struggle to bridge the gap from "the state has this symmetry" to "the agent should bet this way" (**Normativity**). They often leave the physicist with a measure but no reason to use it for error bars on Monday.

  **3. Branch-Counting and Relative Frequency**
  *   **Score:** High on Intuitive Clarity; Fails Irrational Weights and Granularity.
  *   **Reasoning:** These are the most intuitive but fail the technical constraints. They cannot handle **Irrational Weights** without artificial discretization. They fail **Granularity Stability** because branch counts change with coarse-graining. They also fail **Normativity** because there is no reason to count branches rather than weight them by amplitude.

  **4. Self-Locating Uncertainty (with Separability)**
  *   **Score:** High on Normativity and Updating; Moderate on Axiomatic Independence.
  *   **Reasoning:** By treating pre-measurement uncertainty as ignorance of self-location among identical copies, this approach naturally yields an **Updating Rule** and justifies **Finite Sample Adequacy** (via indifference principles). It satisfies **Normativity** well. However, it relies on a principle of indifference that critics argue is not uniquely determined by the physics (**Axiomatic Independence**), and it requires careful handling to ensure the "copies" are well-defined (**Granularity**).

  ### Summary Recommendation for the Seminar
  For your purpose (the working physicist), the **Decision-Theoretic** and **Self-Locating** approaches are the only ones that clear the **Normativity** and **Finitude** bars. However, you should structure the seminar to highlight that they clear these bars by accepting a weakening of **Axiomatic Independence**. The physicist gets to use her error bars, but the cost is admitting that the "probability" in her error bars is grounded in norms of rationality or self-location, not in a mind-independent chance property of the branches. This is the "non-self-deception" clause: she isn't deceived about the branching, but she must accept that her statistical tools are tools for agents, not mirrors of the multiverse's counting.
