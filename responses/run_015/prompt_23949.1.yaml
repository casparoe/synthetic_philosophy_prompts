  Ultimately, the claim that reaching perfection means missing the point holds weight only if "reaching" implies stopping. The asymptote argument is strongest not because perfection is impossible, but because the declaration of perfection is usually a symptom of complacency. Your friend isn't wrong because he got zero dots; he is wrong because he plans to "coast." The scheme breaks not when the dots disappear, but when the user decides the dots no longer matter. The asymptote ensures you keep looking at the spreadsheet; the claim of arrival tells you to close the laptop. The former sustains the practice; the latter ends it.

