answer: |-
  # Specification of Desiderata for a Theory of Advance Directive Authority

  ## I. Phenomenal Accommodation
  An adequate theory must not only offer abstract principles but must vindicate specific normative judgments in hard cases. The theory must deliver the following results for the specified phenomena, with the accompanying justifications.

  ### (i) The "Happy Demented" Refusal
  *   **Case:** A competent adult executes a directive refusing artificial nutrition/hydration (ANH) if they develop advanced dementia. They later develop advanced dementia, lose all memory of the directive and their prior values, and appear content, enjoying simple sensory pleasures.
  *   **Required Normative Result:** The directive **should not be enforced** to the point of starving the patient, provided the patient is not suffering.
  *   **Justification:** A theory that enforces the directive here sacrifices a sentient, content being for the sake of a "ghost" (the prior self) who no longer exists psychologically. The moral authority of the prior self dissolves when psychological continuity is severed. To enforce the refusal is to treat the current patient merely as a vessel for the past self's values, violating the current entity's interest in continued existence.

  ### (ii) The Psychiatric "Ulysses" Contract
  *   **Case:** A patient with bipolar disorder or schizophrenia, during a period of lucidity, signs a directive refusing antipsychotic medication during future manic/psychotic episodes, citing side effects. During an acute episode, the patient violently refuses medication but is a danger to self/others.
  *   **Required Normative Result:** The directive **should generally be enforced** (upholding the refusal) *only if* the directive included specific contingency clauses acknowledging the illness; otherwise, the directive **should be overridden** to restore capacity. *Correction for standard ethical consensus:* The theory must vindicate the **enforcement of the prior refusal** *if* the directive was specifically designed as a Ulysses contract acknowledging the distortion of the illness. However, if the directive is a general refusal, the theory must allow **temporary override** to restore competence.
  *   *Refined Required Result:* The theory must vindicate the **authority of the prior directive** to restrict treatment *during* the episode, assuming the directive explicitly anticipated the loss of insight.
  *   **Justification:** Unlike dementia, psychosis is viewed as an interruption of the self, not a replacement of the self. The "sick" self is epistemically compromised. Respecting the lucid self's pre-commitment protects the agent's long-term autonomy against transient pathological coercion.

  ### (iii) Long-Dormant Directives vs. Recent Incompetent Preferences
  *   **Case:** A directive drafted 30 years ago refuses life support. The patient is now incompetent (e.g., stroke) but occasionally expresses a desire to live ("I want to stay"). These expressions are inconsistent and lack full comprehension.
  *   **Required Normative Result:** The **directive prevails** over the recent incompetent expressions, unless the current state involves severe, unmitigatable suffering.
  *   **Justification:** Incompetent expressions lack the epistemic and volitional weight of competent choices. To allow fleeting, non-autonomous whispers to override a solemn competent judgment is to privilege noise over signal. However, the "suffering" caveat is required to prevent the directive from becoming an instrument of cruelty against a being who cannot understand why they are being kept alive.

  ### (iv) Directives Demanding Treatment
  *   **Case:** A directive demands "all possible measures" to sustain life, even in a persistent vegetative state.
  *   **Required Normative Result:** The directive **does not bind** clinicians or surrogates to provide medically inappropriate or futile treatment. It creates a presumption in favor of treatment but not an absolute obligation.
  *   **Justification:** There is a moral asymmetry between negative rights (refusal) and positive rights (demand). A refusal relies on bodily integrity (a right against intrusion). A demand relies on the labor and resources of others (a claim right). No agent has the authority to compel medical professionals to violate standards of care or allocate scarce resources inefficiently.

  ---

  ## II. Conceptual Distinctions
  An adequate theory must structurally preserve the following distinctions. Collapsing these distinctions renders the theory incapable of handling the phenomena above.

  ### 1. Authority vs. Evidential Weight
  *   **Distinction:** The directive must be treated as a **performative act of will** (creating an obligation), not merely as **evidence** of what the patient might want if they could speak.
  *   **Reason:** If the directive is merely evidence, it is always trumped by "better" evidence (e.g., what family says the patient would want). This reduces the AD to a suggestion. To have moral force, the competent act of drafting must create a pro tanto duty for surrogates, shifting the burden of proof to those who wish to override it.

  ### 2. Standing to Refuse vs. Standing to Demand
  *   **Distinction:** The theory must ground the authority to refuse treatment in **bodily integrity**, while grounding the authority to demand treatment in **beneficence/resource allocation**.
  *   **Reason:** As noted in Phenomenon (iv), conflating these leads to either medical futility (if demands bind) or paternalism (if refusals don't bind). The moral source of the right to say "no" (inviolability) is distinct from the claim to say "yes" (entitlement).

  ### 3. Value Change vs. Change in Taste
  *   **Distinction:** The theory must distinguish between a **transformation of critical interests** (moral/religious/identity-constituting values) and a **shift in experiential preferences** (liking ice cream vs. pudding).
  *   **Reason:** In the "Happy Demented" case, the patient's *tastes* change (they enjoy food), but the prior self's *critical interests* (dignity over mere existence) are what the AD protected. A theory that treats all preference changes equally cannot explain why the AD loses force in dementia (where critical interests are lost) but retains force in depression (where critical interests are distorted but present). Authority erodes only when the capacity to hold critical interests is extinguished, not when mere tastes shift.

  ### 4. Extinction of Autonomy vs. Unreliability of Autonomy
  *   **Distinction:** The theory must distinguish between incompetence that **destroys the agent** (advanced dementia) and incompetence that **distorts the agent** (delirium, mania).
  *   **Reason:** This is the basis for the differential treatment of Phenomena (i) and (ii). If the agent is destroyed, the AD is a will executed by a dead person regarding a new body. If the agent is distorted, the AD is the agent's true voice protecting itself from a temporary hijacking. A theory that treats all incompetence as a uniform "lack of capacity" fails to capture the moral difference between a *changed* self and a *sick* self.

  ---

  ## III. Empirical and Psychological Constraints
  The theory must be consistent with the following empirical realities without collapsing into a purely consequentialist "best interests" calculus.

  ### 1. Preference Instability and Adaptation
  *   **Constraint:** The theory must acknowledge that healthy people systematically mispredict their quality of life with disability (the "disability paradox") and that dementia patients often report higher affective well-being than anticipated.
  *   **Integration:** The theory cannot treat the AD as infallible prophecy. It must allow current well-being to act as a **defeater** for the AD when the gap between predicted and actual suffering is vast. However, it cannot reduce to "maximize current happiness," or it would invalidate all ADs refusing life-sustaining treatment (since most patients, even demented ones, prefer living to dying).
  *   **Requirement:** The theory must posit a **threshold of current welfare**. Below the threshold (severe suffering), the AD is voided by best interests. Above the threshold (contentment), the AD's authority depends on psychological continuity.

  ### 2. Pathological Distortion of Judgment
  *   **Constraint:** Psychiatric conditions can alter preference formation mechanisms, not just content.
  *   **Integration:** The theory must incorporate an **epistemic reliability condition**. Preferences formed during states known to compromise reality testing (psychosis) lack authority. Preferences formed during lucidity about those states (Psychiatric ADs) retain authority. This prevents the theory from deferring to the "current self" in Phenomenon (ii).

  ### 3. The Gradual Nature of Cognitive Decline
  *   **Constraint:** Dementia is not a binary switch; it is a gradual erosion of psychological connectedness.
  *   **Integration:** The theory cannot rely on a binary "competent/incompetent" switch to determine AD authority. It must accommodate **degrees of authority**. As psychological connectedness fades, the weight of the AD should proportionally decrease, while the weight of current welfare increases. This avoids the "cliff-edge" problem where an AD is absolute one day and worthless the next.

  ---

  ## IV. The Exclusionary Desideratum and Ranking

  ### The Single Exclusionary Desideratum
  **The Conditionality of Authority on Psychological Continuity.**

  This is the criterion that does the most work in excluding dominant competing accounts:
  *   **Excludes Rigid Precedent Autonomy (e.g., Dworkin):** Rigid precedent autonomy argues the prior competent self always rules. It fails this desideratum because it cannot explain why the AD loses force in the "Happy Demented" case (Phenomenon i) where psychological continuity is severed. It treats the AD as a will that survives the death of the moral agent.
  *   **Excludes Pure Present-Best-Interests:** This view argues only current welfare matters. It fails this desideratum because it cannot explain why the AD *retains* force in the Psychiatric Ulysses case (Phenomenon ii) where the current self is unhappy but psychologically continuous with the author. It treats the AD as irrelevant data rather than binding authority.
  *   **Excludes Standard Substituted Judgment:** This view asks "What would the patient choose now?" It fails this desideratum in Long-Dormant cases (Phenomenon iii) because it requires speculating on the preferences of a self that may no longer exist or is unreliable, whereas the Conditionality criterion prioritizes the last known competent will unless continuity is broken.

  **Definition:** *A theory is adequate only if it makes the binding force of an advance directive a function of the degree of psychological connectedness (memory, character, values) between the author and the current patient.*

  ### Ranking of Requirements

  #### Tier 1: Non-Negotiable (Theoretical Deal-Breakers)
  1.  **The Current Welfare Floor:** No theory can justify enforcing an AD that results in severe, unmitigatable suffering for a sentient patient. (Protects against rigid autonomy).
  2.  **The Competent Authorization Principle:** No theory can ignore a clear directive issued during lucidity regarding a known loss of capacity (e.g., psychiatric contracts). (Protects against pure paternalism).
  3.  **The Refusal/Demand Asymmetry:** No theory can grant equal binding weight to demands for treatment as it does to refusals. (Protects clinical integrity and resource justice).

  #### Tier 2: Relaxable (Negotiable under Conflict)
  1.  **Temporal Proximity:** While recent ADs are preferable, a theory may allow older ADs to stand if there is evidence of stable values. This can be relaxed if it conflicts with the Current Welfare Floor.
  2.  **Strict Psychological Continuity:** While continuity is the exclusionary desideratum, the *metric* for continuity can be flexible. A theory might prioritize "value continuity" over "memory continuity." This distinction can be relaxed if a clear bright-line rule is needed for clinical practicality.
  3.  **Surrogate Discretion:** The theory can allow surrogates more or less leeway in interpreting the "continuity" condition, provided they stay within the Tier 1 constraints.

  ### Summary
  An adequate theory of advance directive authority must be a **hybrid account**. It cannot be purely backward-looking (Precedent Autonomy) nor purely forward-looking (Best Interests). It must be **identity-sensitive**. It must treat the advance directive as a binding command from the past self to the future self, *conditional* on the future self being the same moral agent. When the agent ceases to exist (advanced dementia), the command loses its addressee and dissolves into evidence. When the agent is merely impaired (psychosis), the command remains active as a shield. This specification excludes all monistic theories and demands a nuanced, graduated account of personal identity as the foundation of moral authority.
