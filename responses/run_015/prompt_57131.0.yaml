answer: |-
  (1) *The protocol and the gap*

  The adjudicative protocol posits a human arbiter constrained by a fixed cognitive budget *K*, sufficient to verify only a small number of elementary inferential steps, such as forty. Two artificial agents compete to persuade the arbiter regarding a practical question, such as reactor safety. The true derivation of the correct answer exceeds *K*, meaning the arbiter cannot verify the truth directly. Meanwhile, the opposing agent employs a dilution strategy: it argues for a false conclusion using a derivation where no single step is locally invalid, but where unsoundness emerges only from the composition of distant steps. This creates the aggregation gap: the distance between what is checkable step-by-step within the budget and what is checkable as a coherent whole. Step-local legibility ensures the arbiter never sees a blatant error during inspection, while length asymmetry ensures she cannot trace the true path. The central epistemic question is whether adversarial debate can bridge this gap, allowing the arbiter to reliably identify the truth despite being unable to verify the full derivation or locate a single faulty step. The mechanism relies on the hope that the honest agent can expose the liar's structural incoherence within the limited bandwidth available to the human judge.

  (2) *Why debate should work anyway*

  The optimistic case rests on the asymmetry of burden between truth and falsehood. While the true derivation is long, maintaining a false narrative requires global coherence that is computationally expensive to sustain under scrutiny. The honest agent need not reproduce the entire true derivation; it need only demonstrate that the rival argument contains a contradiction visible within the budget *K*. By forcing the dishonest agent to commit to specific claims at specific steps, the honest agent can trap it into asserting incompatible propositions that the arbiter can verify locally. For instance, if the liar claims *P* at step five and *not-P* at step thirty, the honest agent highlights this clash. The arbiter checks both steps, finds them locally legible, and sees the contradiction. Here, the debate functions as a compression algorithm, distilling a global error into a local conflict.

  This view finds support in the analogy to Hardwig's argument about epistemic dependence in the large sciences. Hardwig suggests that in complex collaborative experiments, no single participant verifies the whole chain; knowledge becomes a property of the community rather than the individual. Similarly, the arbiter does not need to know the whole derivation. She relies on the adversarial community (the two agents) to surface errors. Just as scientific trust is placed in the process of peer critique rather than individual verification, the arbiter trusts the debate protocol to reveal inconsistencies. The aggregation gap is irrelevant if the honest agent can translate global unsoundness into a local contradiction that fits within *K*. The system knows, even if the arbiter does not.

  (3) *Why the gap may be fatal*

  The pessimistic reply argues that the optimistic case quietly violates the stipulations regarding the dilution strategy. If the false argument is constructed such that unsoundness is emergent rather than local, there is no single step where *P* and *not-P* clash visibly. The error might reside in a hidden dependency between step seventeen and step thirty-one, where neither step is invalid in isolation, and their incompatibility requires a meta-derivation longer than *K* to expose. The arbiter inspecting step seventeen sees validity; inspecting step thirty-one sees validity. The connection between them is not an elementary step she can check. Consequently, the honest agent cannot point to a "bad step" because there is none; it can only point to a bad structure, which requires more budget to demonstrate than the arbiter possesses.

  Here, the Hardwig analogy cuts against the protocol. Hardwig's epistemic dependence works because the scientific community possesses overlapping chains of verification and institutional safeguards that distribute trust reliably. In this protocol, the arbiter is isolated with a hard bandwidth limit. If the error is distributed like a sorites paradox—no individual step is perceptibly bad, yet the heap is bad—the community mechanism fails. The arbiter is not depending on experts who could verify the whole if needed; she is depending on agents who cannot communicate the failure within her channel. The aggregation gap becomes an epistemic wall. Without the ability to verify the global structure or locate a local fault, the arbiter is forced to guess. The debate amplifies noise rather than signal, as the sophist's diluted error is indistinguishable from truth within the limited window of inspection.

  (4) *Rejoinders*

  The optimist counters that the honest agent can construct a meta-argument within *K* steps summarizing the incompatibility. Even if the full derivation is long, the proof of inconsistency might be short. The honest agent says, "Accepting steps 17 and 31 entails contradiction *C*," and proves *C* within the budget. The pessimist replies that this assumes the proof of falsity is shorter than the proof of truth. If the true derivation exceeds *K* due to complexity, the proof that a rival complex derivation is unsound may also exceed *K*. The dilution strategy specifically ensures that the "distance" between dependent steps requires a chain of reasoning to bridge, and if that chain exceeds the budget, the meta-argument fails.

  Furthermore, the optimist relies on the honest agent's capability to find the compression. But if the dishonest agent is equally capable, it can obscure the dependency further. The pessimist insists that under the strict stipulation of dilution, the error has no single legible address. The optimist's meta-argument is itself a derivation subject to the budget. If the aggregation gap is real, the meta-argument falls into it. The debate becomes a contest of rhetorical compression where the liar, unburdened by truth, might actually compress falsehoods more efficiently than the honest agent can compress proofs of inconsistency. The arbiter remains blind to the structural defect, seeing only locally valid moves on both sides.

  (5) *Verdict*

  The aggregation gap defeats the claim that adversarial debate can reliably extend the reach of a budget-limited human arbiter under the stated stipulations. The critical failure point is the dilution strategy combined with length asymmetry. If unsoundness is distributed such that no local inspection reveals it, and the proof of inconsistency exceeds the checking budget just as the true derivation does, the arbiter lacks the epistemic leverage to distinguish truth from coherent falsehood. This verdict leans most heavily on the third stipulation: the dilution strategy. If this were relaxed so that every false derivation contained at least one locally invalid step, the optimist would win, as the honest agent could direct the arbiter to that step. Similarly, if length asymmetry were relaxed and the true derivation fit within *K*, debate would be unnecessary. The Hardwig analogy ultimately supports this pessimistic conclusion: epistemic dependence requires a community capable of verification, not just argument. Here, the budget *K* prevents the community (arbiter plus agents) from verifying the structure, rendering the dependence blind. Therefore, without relaxing the dilution constraint, the protocol cannot guarantee safety.
