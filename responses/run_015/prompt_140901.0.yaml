      *Looking at the "Transparency Test":* The user asks "is this the most important item... or a puritan hang-up". I need to take a stand. It's a hang-up.

      *Looking at "Universalization":* I need to call this out as a decoy. Pragmatics relies on diversity of styles, not universal uniformity.

      *Let's assemble.*

