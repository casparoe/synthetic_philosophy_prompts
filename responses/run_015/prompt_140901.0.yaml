answer: |-
  Here is the spec.

  ### 1. The Desiderata Review
  Your list is strong, but two items are decoys that will filter out viable tools rather than bad theories.

  *   **Genuine Desiderata:** *No-stakes ritual, Volunteered specificity, The mismatch, Cheap for me/expensive for you, Retrospective complaint, Protective pretense, Stopping rule, Act or agent.* These track real friction points where truth-telling protocols break.
  *   **Decoys/Hang-ups:**
      *   **The Transparency Test:** This is a puritan hang-up. Softening works *because* it is not flagged as softening. Saying "I am softening this to spare your feelings" often inflicts the very harm the softening was meant to avoid (it highlights the insult). A viable theory must allow for opaque benevolence.
      *   **Universalization:** This is a Kantian import that doesn't fit pragmatics. Communication relies on *complementary* styles, not identical ones. If everyone were maximally blunt, we would adapt; if everyone were indirect, we would adapt. The theory doesn't need to survive universal adoption, only local coordination.

  **Missing Desiderata:**
  *   **Power Asymmetry:** Bluntness down the chain of command functions differently than bluntness up it. A theory must account for who holds the power to punish the speech act.
  *   **Epistemic Certainty:** Softening is obligatory when the speaker's certainty is low, even if the news is bad. Hard bluntness requires high confidence.

  ### 2. The Knockout Requirement
  **"Cheap for me, expensive for you."**
  This is the single requirement that knocks out the most candidates. Most etiquette guides focus on the speaker's virtue (integrity) or the hearer's conventions (politeness). This requirement forces a **consequentialist calculus** mid-conversation. It eliminates deontological "never lie" rules (which ignore the cost to the hearer) and pure relativism (which ignores the speaker's responsibility for impact). If the theory cannot help you weigh the *asymmetry of harm*, it is useless for your stated purpose.

  ### 3. The Trilemma (Incompatibility Flag)
  You guessed correctly. You cannot jointly satisfy:
  1.  **Maximizing Actionable Information** (giving the hard truth needed to act).
  2.  **Deferring to Hearer Conventions** (speaking in the code they expect).
  3.  **Personal Consistency** (being the "same person" across contexts).

  **Resolution:** You must sacrifice **Personal Consistency**. To satisfy Information and Conventions simultaneously, you *must* code-switch. A "unified self" that speaks the same way to a Dutch colleague and a Japanese colleague is not being authentic; they are being lazy. They are prioritizing their own self-image over the hearer's reception. The adequate theory demands you be a different person in different rooms.

  ### 4. The Contenders
  *   **Absolute Ban on Falsehood:** Fails *Protective Pretense* and *No-Stakes Ritual*. It protects the speaker's soul but sacrifices the hearer's well-being.
  *   **Act-Consequentialism:** Passes *Cheap/Expensive* but fails *Mid-Conversation Actionability*. You cannot calculate net utility in thirty seconds.
  *   **Virtue Ethics (Golden Mean):** Passes *Act or Agent* but fails *Stopping Rule*. "Prudence" is too vague when urgency is high.
  *   **Polite Fictions (Ritualism):** Passes *No-Stakes Ritual* but fails *Retrospective Complaint*. It maintains peace now but breeds resentment later.

  ### 5. Confidence & Calibration
  **Overall Confidence:** 85%. The trilemma and the knockout requirement are robust across most pragmatic frameworks.

  **Least Sure Claim:** I am least sure about the **Stopping Rule** metric. I claim urgency overrides convention, but I cannot specify the exact threshold where "saving face" becomes "sabotaging action" without knowing the specific domain (e.g., surgery vs. poetry critique). That cutoff is context-dependent in a way that resists general specification.
