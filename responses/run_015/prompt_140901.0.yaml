  3.  **Identify Missing Desiderata:**
      *   *Epistemic Access:* Does the speaker actually *know* the truth they are softening? (Softening uncertainty vs. softening harsh truth).
      *   *Power Dynamics:* Boss to subordinate vs. subordinate to boss. The cost of bluntness isn't just emotional; it's structural.
