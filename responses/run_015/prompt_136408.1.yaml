answer: |-
  The aphorism 'fortune favours the bold' is frequently attributed to Machiavelli as a shorthand for his treatment of *fortuna* and *virtù* in Chapter 25 of *The Prince*. However, this slogan obscures the nuance of his argument. Machiavelli does not merely suggest that luck rewards risk-takers; he presents a complex relationship between human agency and contingency. To understand his position, one must disambiguate the slogan into three distinct readings, ranging from the trivial to the coercive, while accounting for his dual imagery of fortune as both a river and a woman.

  **A Menu of Readings**

  1.  **The Correlative Reading (Risk and Reward)**
      This interpretation posits that taking risks increases the statistical probability of a favourable outcome. It suggests that inaction guarantees stagnation, whereas action, even if risky, opens the possibility of gain. Here, 'boldness' is simply the willingness to act despite uncertainty.
      *   *Classification:* **Trivial Platitude.** While empirically observable in many contexts, this reading strips the concept of its political and ethical weight. It reduces *virtù* to mere risk appetite and ignores the structural constraints Machiavelli emphasises.

  2.  **The Mitigative Reading (Agency over Contingency)**
      This reading aligns with Machiavelli's imagery of **fortune as an unruly river**. He argues that while one cannot stop the river when it floods, one can construct dykes and channels in calm weather to direct its flow or mitigate its damage. Here, 'boldness' is actually foresight and preparation. It claims that human agency cannot eliminate chance, but it can build structures to render contingency manageable.
      *   *Classification:* **Substantive and Defensible.** This is a robust political theory. It acknowledges the power of external circumstances but insists on the efficacy of prudent planning. It matches the rationalist strand of Machiavelli's thought, where *virtù* is the capacity to adapt to the times.

  3.  **The Coercive Reading (Domination of Chance)**
      This interpretation aligns with Machiavelli's notorious imagery of **fortune as a woman**. He writes that she is more friendly to young, impetuous men who command her with more audacity, and that she must be 'beaten and struck down' to be mastered. Here, 'boldness' is aggressive imposition. It claims that contingency is not just to be managed, but subdued through force of will and violent action. Passivity is not merely risky; it is an invitation to ruin.
      *   *Classification:* **Genuinely Machiavellian.** This matches the specific, visceral argument in *The Prince*. Machiavelli concludes that it is better to be impetuous than cautious because fortune is a woman who yields to force. This is the strongest thesis: that coercive domination is the correct model for managing chance.

  **Application to Institutional Design**

  When the slogan is invoked to defend bold institutional design—such as radical constitutional reform, disruptive economic policy, or aggressive foreign strategy—it typically invokes **Reading 2 (The Mitigative Reading)** to lend intellectual respectability, while implicitly relying on the energy of **Reading 3 (The Coercive Reading)**. Proponents argue that bold structures are necessary to channel future uncertainties (the river), yet they often justify the disruption required to build them by appealing to the necessity of dominating the political landscape (the woman).

  **Scrutiny of the Institutional Reading**

  This hybrid reading rarely survives scrutiny when applied to modern institutional design. Machiavelli's argument was predicated on the instability of the Italian principalities, where survival depended on the singular *virtù* of a prince in a chaotic environment. Modern institutions, by contrast, rely on predictability, rule of law, and bureaucratic continuity.

  Applying the Machiavellian logic of 'beating' fortune to institutional design often conflates boldness with recklessness. The 'river' metaphor suggests that institutions should be built in times of stability to withstand future crises. However, 'bold' designers often attempt to rebuild the dykes *during* the flood, mistaking volatility for opportunity. Furthermore, the 'woman' metaphor implies a zero-sum struggle against contingency that is incompatible with cooperative governance. Consequently, using Machiavelli to justify bold institutional design is usually a category error: it imports a logic of survival suited for autocratic crisis management into contexts that require stability and consensus. The slogan, therefore, serves more as a rhetorical shield for impulsivity than a guide for durable statecraft.
