prompt: |-
  The saying 'fortune favours the bold' is often used to summarise Machiavelli's discussion of fortune and virtù. Given his actual imagery of fortune as an unruly river and as a woman who must be beaten and struck down, disambiguate that slogan into its possible precise claims—ranging from the banal observation that risk correlates with reward, through the claim that human agency can dominate contingency, to the stronger thesis that coercive domination is the correct model for managing chance. Present these as a menu of readings, indicate which are trivial platitudes, which are substantive and defensible, and which genuinely match Machiavelli's argument in The Prince. Say also which reading is typically invoked when the slogan is used to defend bold institutional design, and whether that reading survives scrutiny. Write in British English, keep the answer focused, and do not include bibliographies, reading lists, or citations.
