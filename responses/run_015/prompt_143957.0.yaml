  I lock the feeling in the mental **box**,
  Assign it such a private, inner **name**.
  The page beneath the ink remains **empty**,
  Though I insist this shock is just the **same**.
  But memories of Monday start to **drift**,
  And there is no one here to **check** the claim.

  There is no public way to **check**.
  I seal the sensation in the **box**.
  As qualia subtly start to **drift**.
  I cling onto the syllables of **name**.
  Hoping the sting today is just the **same**.
  But certainty feels hollow, almost **empty**.

  The margin of the public world stays **empty**,
  No outsider comes here to **check**.
  I ask if Tuesday's ache is quite the **same**.
  I peer inside the solitary **box**.
  I try to recall the original **name**,
  But usage starts to blur and **drift**.

  The meaning starts to blur and **drift**,
  The ostensive definition stays **empty**.
  I invented the private **name**,
  No other mind arrives to **check**.
  Just me and beetles in the **box**,
  Nothing remains truly the **same**.

  Nothing remains truly the **same**,
  As time makes all the memory **drift**.
  What truly hides inside the **box**?
  The entry looks so **empty**.
  I lack the means to **check**.
  I only have the **name**.

  I whisper now the invented **name**,
  Asking if pain is ever the **same**.
  There remains no final way to **check**.
  The sense begins to **drift**.
  The inner space is **empty**.
  The beetle leaves the **box**.

  With this **name**, all certainty will **drift**,
  Nothing stays the **same**, the definition **empty**,
  No public **check** can open up the **box**.

  ### Commentary on the form

  The selected end-words (box, name, empty, same, drift, check) map the topology of the private language problem. "Box" and "name" establish the private object and its label, while "empty" and "check" signify the lack of external criteria. The sestina's rigorous rotation mimics the diarist's attempt to maintain consistency across time. However, as the end-words recur, their context shifts, enacting the semantic slippage Wittgenstein describes. When "same" returns in stanza two, it is already undermined by "drift." By stanza six, "name" no longer anchors the sensation but merely echoes it. The form demands repetition, but the poem demonstrates that without public criteria, repetition cannot guarantee identity. The envoi collapses the distinction between the word and the object, leaving the "box" sealed and the reference hollow. Thus, the structure itself argues that a private rule is no rule at all; the rotation becomes a spiral of uncertainty rather than a circle of verification. The beetle is irrelevant because the box is locked; the poem's cycling form proves that memory alone cannot sustain meaning against the entropy of time.
