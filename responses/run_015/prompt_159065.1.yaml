answer: |-
  **KB-4471: Fear Response Persists After Belief Update**

  **Summary**
  This article addresses discrepancies where the Affective Output Module continues to signal threat despite successful Cognitive Safety Certification. Users may report subjective fear while simultaneously affirming the safety of the stimulus. This conflict indicates a desynchronization between evaluative subroutines and somatic feedback loops.

  **Symptoms**
  *   User verbalizes "I am afraid" while affirming "This is safe."
  *   Physiological markers (tachycardia, tremor, adrenaline spike) may be present or absent.
  *   Avoidance behavior persists despite verified safety protocols.
  *   System logs show successful belief installation, but affective driver remains active.

  **Cause**
  Latency between cognitive belief updates and legacy affective hardware. In some instances, the emotion module operates on independent data streams that do not require cognitive assent to function. In others, the belief update failed to commit fully.

  **Resolution**
  Proceed through the following support tiers sequentially. Do not skip tiers.

  **Tier 1: Cognitive Integrity Check**
  Verify the user's belief assent. According to core protocol, an emotion *is* a judgment. If the user reports fear while claiming the stimulus is safe, the safety belief is not actually installed. The fear report confirms the presence of a danger judgment.
  *   **Action:** Route user to Belief Reconciliation. Do not accept contradictory reports. Inform the user that if they were truly convinced of safety, the fear would not exist. Require full cognitive assent before closing the ticket.

  **Tier 2: Evaluative Sensor Calibration**
  If belief assent is verified via polygraph but fear persists, treat the emotion as a perceptual sensor. The module may be detecting danger properties invisible to current cognitive processing (similar to a visual illusion).
  *   **Action:** Trust the sensor over the manual. Advise the user to vacate the area immediately. The emotion has correctness conditions independent of belief. Log the incident as "Valid Threat Detection." Do not attempt to override the sensor.

  **Tier 3: Somatic Feedback Verification**
  If Tier 2 is inconclusive, check biometric feed. According to somatic protocol, the emotion is the bodily upset. If heart rate and tremor are absent, there is no emotion object.
  *   **Action:** If only the evaluation remains without physiological arousal, close ticket as "No Fault Found." There is no fear without the feeling. Inform the user they are merely recalling a legacy state.

  **Known Issues**
  *   **Vestigial/Cold Emotions:** Diagnostic runs backwards. Evaluation reports normal ("This is dangerous"), but sensation reports absent. System cannot validate whether an emotion exists without somatic data, yet the evaluation persists. Support cannot determine if this is a ghost process or a valid state. Ticket status remains "Pending Human Review" indefinitely.
  *   **Cinema Mode:** Unit fires at a target the customer knows does not exist (e.g., on-screen entities). System recognizes the target as non-existent but processes the threat response anyway. This is logged as intended functionality. Do not attempt to patch.

  **Escalation**
  If fear persists after successful belief update, somatic clearance, and sensor calibration, the issue is not technical. Log as User Compliance Violation (Code 99). Persistent affective output despite safety certification suggests the user is refusing to align internal states with external reality. Transfer to Behavioral Compliance Division for mandatory recalibration.

  **Related Articles**
  *   KB-4472: Grief Response After Accepted Loss
  *   KB-4480: Anger Management During Arbitration
  *   KB-4495: Joy Suppression Protocols
