answer: |-
  The clink of silverware against porcelain provided a rhythmic undercurrent to the low hum of the dinner party, but at the far end of the table, the air was still. Elias swirled the Cabernet in his glass, watching the legs run down the side, while Sarah watched him.

  "The historian," Elias said, his voice cutting through the lull. "She's mistaken. Or rather, she's speaking nonsense. 'True all along but no one knew.' It's a poetic phrase, not a logical proposition."

  Sarah set down her fork. "It's a standard realist intuition, Elias. The treaty wasn't ratified in 1890. That fact obtained in 1890. We just lacked the epistemic access until today."

  "But Fitch," Elias said, as if that settled it. "If you accept that all truths are knowable—which you must, if you think truth is a meaningful concept for human beings—then Fitch's Paradox proves there are no unknown truths. The moment she claims to have found an 'unknown truth,' she creates a contradiction. If it is knowable, it is known. Therefore, the truth of the treaty's status didn't exist until the moment she verified it."

  Sarah leaned back, wiping her mouth with a napkin. "You're collapsing truth into verification. Fitch's Paradox doesn't prove that unknown truths don't exist. It proves that not all truths are knowable. It's a limit on knowledge, not a limit on reality."

  "That's the escape route everyone tries," Elias countered. "But it's costly. You're saying there are truths that are *in principle* unknowable. Give me an example that isn't metaphysical magic."

  "The beach at dawn," Sarah said immediately. "Consider the proposition: *'The number of grains of sand on Waikiki Beach at 6:04 AM this morning was an even number.'* That proposition has a truth value. It is either true or false. But it is impossible to know. To count them would disturb the arrangement, change the tide, alter the count. The truth obtained at 6:04 AM. It is now gone. It was true, it was unknown, it remains unknown."

  Elias shook his head. "That's a contingent physical limitation, not a logical one. If a god existed, or a perfect scanner, it could be known. Fitch deals with logical possibility. If you insist that proposition is a 'truth' despite being forever inaccessible to any mind, you've severed truth from any role in explanation. It's an inert ghost. Why call it true if it makes no difference to the world?"

  "Because the world makes a difference to it," Sarah shot back. "The sand *was* arranged that way. Your verificationism suggests the arrangement of the sand waits for a mind to validate it. That's idealism dressed up as logic. You're saying the treaty wasn't unratified in 1890 because no one knew it then. That implies the legal reality of the nineteenth century depends on your epistemic state in the twenty-first."

  Elias tapped the table. "I'm saying the *proposition* 'The treaty was unratified and no one knows it' is self-refuting. If you know it, the second conjunct is false. Fitch shows that the existence of an unknown truth is logically incompatible with the knowability of truth. So, to save logic, we must say the truth value is indeterminate until verification. The treaty's status was *undecided* until the historian found the document."

  "And there," Sarah said, pointing a finger, "is the weakest step. You assume the derivation holds for all propositions. But the proof relies on a specific kind of self-referential sentence. It turns on the proposition *'p and no one knows p.'* When you apply the knowledge operator to that conjunction, you force a contradiction. But that just shows that *that specific kind of proposition* is unknowable. It doesn't prove that *p* itself wasn't true beforehand."

  She leaned forward, her eyes sharp. "You're treating 'knowability' as a modal operator that distributes over conjunctions without loss. But knowing a conjunction requires knowing the parts. If I come to know 'p and no one knows p,' I know p, which makes 'no one knows p' false. The paradox doesn't prove p wasn't true. It proves that *'p is unknown'* cannot be part of a known truth. The historian found *p*. She didn't find *'p and no one knows p.'* She found the ratification status. The ignorance was ours, not the fact's."

  Elias paused, his glass halfway to his lips. He set it down slowly. "So you argue the paradox only bans the knowledge of ignorance, not the existence of unknown facts?"

  "Exactly," Sarah said. "The paradox shows we can never *know* that there are unknown truths. But it doesn't follow that there *aren't* any. We can be in the dark about the limits of our own darkness. The historian's claim is coherent: she found a fact that was obtaining, even if the state of 'being unknown' attached to it vanishes upon discovery."

  "But then you are committed to a realm of truths that are essentially disconnected from rationality," Elias pressed, sensing the opening. "If a truth can obtain without any possible connection to a knower—even a counterfactual one—then truth is no longer a normative goal of inquiry. It's just brute existence. If I accept your view, Sarah, I have to admit that there are truths right now, at this table, that are not only unknown but *cannot* be known. How is that different from saying there are invisible dragons? If it interacts with nothing, not even potentially, in what sense does it exist?"

  "It interacts with the world," Sarah said. "The sand grains touched each other. The treaty was signed or it wasn't. The interaction is causal, not epistemic. Your view, Elias, requires that the causal history of the universe waits for us to catch up. If the treaty was unratified, but we couldn't know it, you say it wasn't *true* it was unratified. That means the legal consequences that flowed from it—wars, borders, deaths—were based on a falsehood? Or on nothing?"

  "Based on an assertion that lacked a truth value," Elias corrected. "Until verified. It's not that the world waited; it's that the description 'true' doesn't apply until the verification conditions are met. You accuse me of idealism, but you're positing a 'God's Eye View' that humans can never occupy. You want to claim truth from a perspective we can't hold."

  "And you," Sarah replied, "want to shrink the world to fit inside our skulls. You'd rather deny the reality of the past than admit that our knowledge has limits."

  "I'd rather deny a contradiction," Elias said.

  "I'd rather deny that logic can dictate ontology," Sarah countered.

  They sat in silence for a moment, the hum of the party rushing back in to fill the gap. The host passed a platter of cheese between them, oblivious to the chasm opening in the table's geometry.

  Elias picked up his fork again, but didn't eat. "If you're right, then the historian found a truth that was, by definition, impossible to find until she found it. That's a mystery."

  "If you're right," Sarah said, pouring more wine, "then the treaty didn't exist until she walked into the archive. That's a miracle."

  Elias smiled, a thin, dry expression. "Perhaps we need a third bottle to decide which is less offensive."

  "Perhaps," Sarah said, clinking her glass against his. "Or perhaps we just agree that the wine is true, because we can taste it."

  "For now," Elias said.
