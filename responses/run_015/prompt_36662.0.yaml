answer: |-
  I assign 75% credence that accepting the simulation argument lowers the expected value of far-future work by at least 20% relative to near-term work.

  *   **Probability we are in a simulation ($P_{sim}$):** 40%, based on the indifference principle applied to the ratio of simulated to base realities in a posthuman future.
  *   **Probability simulation terminates early ($P_{cut}$):** 80%, because computational costs likely constrain ancestor simulations to short historical epochs rather than open-ended futures.
  *   **Moral weight of simulated people ($W_{sim}$):** 100%, since denying moral weight to sims logically discounts our own present experiences if we are indeed simulated.
  *   **Information value on extinction risk ($I_{ext}$):** +10% survival probability, because the argument's validity requires at least one civilization to reach technological maturity successfully.
  *   **Influence cap in simulation ($C_{inf}$):** 50%, as our ability to shape the base reality far future is zero and our leverage over the simulator's continuation decision is negligible.

  **Combination:**
  The expected value multiplier is calculated as $(1 - P_{sim}) \times (1 + I_{ext}) + P_{sim} \times (1 - P_{cut}) \times C_{inf}$. Plugging in the numbers: $(0.6 \times 1.1) + (0.4 \times 0.2 \times 0.5) = 0.66 + 0.04 = 0.70$. This represents a 30% reduction in far-future expected value, which clears the 20% threshold in the majority of plausible parameter distributions, justifying the 75% credence.

  **Sensitivity:**
  The bottom line is most sensitive to the **probability simulation terminates early ($P_{cut}$)**. This term would move significantly if we observed evidence that computational substrate costs are falling faster than simulation demand, suggesting sims could run for cosmological timescales rather than just historical snippets.
