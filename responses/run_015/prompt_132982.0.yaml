answer: |-
  # Joint Statement on Anomaly Mechanism Taxonomy
  **Cold-Chain Logistics Monitoring Team**
  **Date:** 24 October 2023
  **Signatories:** Mechanism Realist Lead, Interventionist Lead

  ## 1. Agreed Claims

  We, the undersigned, acknowledge that the taxonomy of anomaly mechanisms is a critical infrastructure asset. It is not merely descriptive but operational, governing alert paging, dispatcher resource allocation, and fleet-wide forecasting. We agree on the following foundational claims, derived from our shared operational context and the three specific cases identified in the post-incident review:

  1.  **Purpose of Taxonomy:** The primary function of the mechanism taxonomy is to minimise the expected cost of fleet downtime. This cost includes both the time-to-repair (affected by dispatch accuracy) and the rate of recurrence (affected by root-cause resolution). Neither alert precision nor causal truth is valuable in isolation; value is determined by their contribution to this minimisation.
  2.  **Telemetry Limitations:** We acknowledge that the current five-minute resolution telemetry (temperature, duty cycle, door counts, defrost behaviour) is insufficient to uniquely identify all physical failure modes. Specifically, in the **Silent Twin** case (perished gasket vs. failing evaporator fan), the observable signatures are indistinguishable prior to physical inspection. We agree that a taxonomy which claims to distinguish these two at the alert stage, without additional data, creates false diagnostic certainty.
  3.  **The Silent Twin Constraint:** We agree that while the *generating structures* of the Silent Twin are distinct (seal integrity vs. motor function), the *initial intervention* (dispatch of a technician with diagnostic kit) is identical. Therefore, the taxonomy must support a state that allows for distinct root causes to share an initial alert category without permanently conflating their repair requirements.
  4.  **The Chameleon Constraint:** We agree that the **Chameleon** case (marginal undercharge manifesting as short-cycling in dry ambient vs. iced coil in humid ambient) presents a single physical root cause with divergent operational signatures. We agree that splitting these into two permanent mechanism categories risks obscuring the underlying refrigerant leak, leading to repeated temporary fixes rather than a permanent repair.
  5.  **The Shared-Fix Constraint:** We agree that the **Shared-Fix Degeneracy** (multiple distinct anomalies clearing after controller reset) presents a risk of over-collapsing. While the immediate intervention is identical, the recurrence profiles differ. A taxonomy that treats these as a single mechanism for forecasting purposes will underestimate future failure rates for the non-transient underlying causes.
  6.  **Granularity:** We agree that "mechanism" cannot be defined at a single absolute level of detail. A distinction is only meaningful if it correlates with a difference in either long-term failure physics or required intervention repertoire.
  7.  **Validation:** We agree that the validity of any mechanism category must be tested against field outcomes, not merely theoretical causal models or historical clustering. The "Carry-Over Test" (see Section 3) is accepted as a valid method for auditing the taxonomy.

  ## 2. Residual Disagreements

  While we agree on the constraints above, we differ on how to prioritise causal structure versus intervention utility when they conflict. The table below outlines the specific points of contention.

  | Point at Issue | Mechanism Realist Formulation | Interventionist Formulation |
  | :--- | :--- | :--- |
  | **Definition of Identity** | Two anomalies are instances of the same mechanism if and only if they share the same causal pathway and component failure mode, regardless of whether current interventions distinguish them. | Two anomalies are instances of the same mechanism if and only if they belong to the same equivalence class of intervention and share a predictive profile for future alerts. |
  | **Handling the Silent Twin** | The taxonomy must maintain distinct categories for 'Gasket Failure' and 'Fan Failure' even if the alert rule triggers both. To lump them is to assert a falsehood about the asset's state. | The taxonomy should utilise a single category 'Thermal Creep - Ambiguous' at the alert stage. Distinct categories are only created once the technician confirms the fix, as prior distinction implies unavailable knowledge. |
  | **Handling the Chameleon** | 'Short-Cycling' and 'Iced Coil' caused by undercharge must be mapped to a single parent mechanism ('Refrigerant Loss') to ensure the forecasting model predicts leak recurrence rather than symptom recurrence. | These should remain distinct categories ('Dry Ambient Short-Cycle', 'Humid Ambient Ice') because the immediate dispatch kit differs (gauge set vs. de-ice equipment), and merging them degrades dispatcher efficiency. |
  | **Handling Shared-Fix** | A 'Controller Reset' is a procedure, not a mechanism. Anomalies cleared by reset must be categorised by their underlying cause (e.g., 'Sensor Drift', 'Software Lockup') to prevent forecasting errors. | If the underlying cause cannot be distinguished prior to the reset, and the reset clears the alert, they constitute a single mechanism class ('Resettable Transient') for the purpose of immediate operations. |
  | **Transitivity** | Mechanism sameness is transitive. If Case A is the same mechanism as Case B, and B is the same as Case C, then A must be the same as C. Intransitivity indicates a classification error. | Mechanism sameness is context-dependent and may not be transitive across different ambient conditions or intervention repertoires. Intransitivity indicates a boundary condition in the intervention space. |

  ## 3. Cruxes and Adjudication Tests

  To resolve the disagreements above, we identify three specific cruxes. For each, we specify a test, our respective predictions, and the concession we would make should the evidence contradict our position.

  ### Crux 1: The Carry-Over Test
  **Question:** Does a fix validated on one instance of a mechanism category reliably transfer to a new instance of the same category without fresh diagnosis?
  **Test:** Select 50 historical alerts labelled with a contested mechanism (e.g., 'Resettable Transient'). Apply the fix associated with that label to 50 new, live alerts of the same label without allowing the technician to perform independent diagnosis. Measure the "First-Time Fix Rate".
  *   **Realist Prediction:** The First-Time Fix Rate will be low (<70%) for categories like 'Resettable Transient' because the label conflates distinct causes that require different long-term solutions.
  *   **Interventionist Prediction:** The First-Time Fix Rate will be high (>90%) for immediate clearance, as the intervention defines the mechanism. Recurrence is a separate forecasting issue, not a mechanism identity issue.
  *   **Concession:**
      *   *Realist:* If the First-Time Fix Rate is >90%, the Realist agrees to merge the contested categories for dispatch purposes, acknowledging that causal distinction is operationally irrelevant at the alert stage.
      *   *Interventionist:* If the First-Time Fix Rate is <70%, the Interventionist agrees to split the categories, acknowledging that the intervention class is too broad to be actionable without further diagnosis.

  ### Crux 2: The Transitivity Audit
  **Question:** Does the corpus contain chains of pairwise-similar cases that refuse to close into clusters (A~B, B~C, but A!~C)?
  **Test:** Perform a clustering audit on the last 12 months of telemetry and repair logs. Identify chains where telemetry similarity and intervention similarity hold pairwise but fail globally.
  *   **Realist Prediction:** Intransitivity will appear as "noise" or "mislabelled data". Resolving it will reveal distinct causal structures (e.g., A and C look similar but have different root causes).
  *   **Interventionist Prediction:** Intransitivity is a genuine feature of the fleet, reflecting that intervention equivalence is not a transitive relation across different environmental contexts (e.g., the 'Chameleon' effect).
  *   **Concession:**
      *   *Realist:* If intransitivity persists after data cleaning, the Realist accepts that "mechanism" must be defined relative to environmental context, not just component physics.
      *   *Interventionist:* If intransitivity disappears when causal data (post-mortem reports) is included, the Interventionist accepts that causal structure is a more stable clustering variable than intervention history.

  ### Crux 3: Granularity and the Three-Place Relation
  **Question:** Is "same mechanism" a two-place relation (Case A is same as Case B) or a three-place relation (Case A is same as Case B *relative to* Intervention Repertoire R)?
  **Test:** Review the 'Chameleon' case. If we restrict the Intervention Repertoire to "Remote Reset Only", do the two manifestations merge? If we expand it to "Full Site Repair", do they split?
  *   **Realist Prediction:** They remain distinct mechanisms regardless of the repertoire, because the physical state of the refrigerant charge is the invariant truth.
  *   **Interventionist Prediction:** They merge under "Remote Reset" (both are 'Unresolvable Remotely') and split under "Full Site Repair" (different kits required). The mechanism identity shifts with the repertoire.
  *   **Concession:**
      *   *Realist:* If the taxonomy proves more efficient at reducing downtime when it shifts categories based on available repertoire, the Realist accepts the three-place relation for operational tagging (while maintaining a separate causal map for engineering).
      *   *Interventionist:* If shifting categories based on repertoire causes forecasting errors (e.g., failing to predict a leak), the Interventionist accepts that a stable causal layer is required beneath the intervention layer.

  ## 4. Analysis of Dispute: Verbal vs. Substantive

  We recognise that a portion of our deadlock is verbal, but a significant portion is substantive.

  **Verbal Disagreements:**
  Approximately 40% of our dispute concerns the definition of the word "mechanism".
  *   The **Realist** uses "mechanism" to refer to the *physical generating structure* (the leak, the motor winding).
  *   The **Interventionist** uses "mechanism" to refer to the *operational equivalence class* (the ticket type, the dispatch kit).
  *   **Resolution:** We agree to adopt a dual-layer terminology. We will use **"Failure Mode"** for the Realist's causal structure (used for engineering and forecasting) and **"Action Class"** for the Interventionist's equivalence class (used for alerting and dispatch). This removes the semantic conflict from the database schema.

  **Substantive Disagreements:**
  The remaining 60% is substantive and concerns **risk allocation and resource cost**.
  *   **The Core Substantive Issue:** The Realist prioritises the risk of *recurrence* (sending the wrong fix long-term), while the Interventionist prioritises the risk of *delay* (sending the wrong kit short-term).
  *   **Evidence:** In the **Shared-Fix Degeneracy**, the Realist fears that labelling everything 'Resettable' will hide a creeping controller hardware failure. The Interventionist fears that splitting them will overload dispatchers with distinct ticket types that require the same immediate action.
  *   **Evidence:** In the **Chameleon**, the Realist fears that splitting 'Ice' and 'Short-Cycle' will prevent the detection of a systemic leak. The Interventionist fears that merging them will send a technician without de-ice equipment to a humid site, resulting in a second visit.
  *   **Resolution Path:** This cannot be solved by definition. It must be solved by the **Carry-Over Test** (Section 3, Crux 1). If the cost of a second visit (Interventionist concern) outweighs the cost of a recurrence (Realist concern), the taxonomy must favour the Interventionist's granularity. If the cost of recurrence is higher, it must favour the Realist's. We agree to quantify these costs in the next quarter's budget review to settle the weighting.

  **Signed,**

  *Mechanism Realist Lead*
  *Interventionist Lead*
