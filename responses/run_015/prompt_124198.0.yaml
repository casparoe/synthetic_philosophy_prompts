      *   *Verdict:* It's closer to **deterministic chaos** or complex systems theory. It's not that the outcome is random; it's that the system is highly sensitive to initial conditions and external forces. *Virtù* is the manipulation of those initial conditions (the dams) before the system enters a critical state (the flood).

