answer: |-
  This is a remarkably precise dissection of a policy mechanism that is often treated as merely technocratic. You have identified a friction point where normative theory is being operationalized without explicit philosophical articulation. The policy cluster you describe—wages indexed to rent burdens, while rent controls remain indexed to capital costs or CPI—does not merely adjust prices; it reorders the moral relationship between labor, property, and subsistence.

  Below is a reconstruction of the implicit philosophical framework, an analysis of its entailments versus accommodations, a survey of rival frameworks that might resolve the asymmetry you note, and a specification of the institutional redesign required by a Marginal Product Theory.

  ### I. Reconstructing the Implicit Framework: "Embedded Social Reproduction"

  The policy cluster presupposes a framework we might term **Embedded Social Reproduction**. It departs from neoclassical labor theory in three specific ontological and normative dimensions:

  **1. The Ontology of Labor: Situated vs. Abstract**
  Neoclassical theory treats labor as an abstract factor of production, mobile and fungible, priced at its Marginal Revenue Product (MRP). By indexing wages to *local* rent burdens, this policy treats labor as **situated and embodied**. It presupposes that the value of labor cannot be divorced from the specific geographic cost of reproducing the laborer. The worker is not a unit of output but a moral agent whose continued existence (reproduction) is a precondition for the market's legitimacy.

  **2. Theory of Just Compensation: Cost-of-Reproduction vs. Contributive Justice**
  You ask if this commits defenders to a consumption-based theory. **Yes, strictly.**
  *   **Production-Based (Contributive):** Wages are justified by what the worker *adds* to the firm (MRP).
  *   **Consumption-Based (Reproductive):** Wages are justified by what the worker *requires* to remain a functional participant in society.
  This aligns closer to the Marxian "value of labor power" (the cost of the means of subsistence) than to the marginalist "value of labor." It asserts that the moral floor of compensation is determined by the cost of social reproduction (shelter), not the productivity of the task.

  **3. The Status of Housing: Decommodified Necessity**
  The policy treats housing not as a standard commodity cleared by supply and demand, but as a **merit good** or a **basic entitlement**. However, crucially, it achieves this entitlement *through the labor market* rather than through direct provision. This implies that the primary vehicle for distributive justice should be the wage contract, not the welfare state.

  ### II. Entailments vs. Accommodations

  To distinguish what this framework *requires* from what it merely *tolerates*, we must look at the logical structure of the intervention.

  **Strict Entailments:**
  1.  **Rejection of Market Separation:** It strictly entails rejecting the neoclassical separation between factor markets (labor) and goods markets (housing). It posits that the price in the factor market must adjust to clear the goods market for the worker.
  2.  **Priority of Survival over Efficiency:** It entails that allocative efficiency (hiring only those whose MRP > Wage) is subordinate to the normative goal of universal shelter for the employed.
  3.  **Employer Liability for Social Costs:** It entails that the cost of social reproduction (housing) is a liability of the *employer* (via wage mandates), not the *state* (via taxes/subsidies) or the *individual*.

  **Mere Accommodations (The Source of the Asymmetry):**
  The asymmetry you identified (wages rise to meet rent; rent does not fall to meet wages) is **not** a strict entailment of the "Embedded Social Reproduction" framework. In fact, it is a philosophical tension within it.
  *   **The Tension:** If housing is a merit good necessary for dignity, why is the landlord's return protected by CPI/Capital improvements rather than the tenant's solvency?
  *   **The Accommodation:** This asymmetry accommodates a **Lockean proviso on property rights**. It suggests that while the worker's survival is non-negotiable, the landlord's property right is not fully subordinate to the tenant's need. The state intervenes to ensure the worker *can pay*, rather than ensuring the price *is payable*. This accommodates a hybrid view: Labor is decommodified; Capital is merely regulated.

  ### III. Rival Frameworks Resolving the Asymmetry

  You asked for frameworks that could license the wage policy (protecting shelter) without endorsing the asymmetry (where only the wage moves).

  **1. The Capabilities Approach (Nussbaum/Sen)**
  *   **Core Commitment:** Justice is about securing specific functionings (e.g., "Shelter," "Bodily Integrity").
  *   **Resolution of Asymmetry:** A strict Capabilities approach would likely view the current asymmetry as inefficient and unjust. If the goal is the functioning "Being Sheltered," the state should regulate *both* sides of the transaction to ensure the capability is met.
  *   **Policy Implication:** This would license the wage floor *but also* require rent caps indexed to tenant income (e.g., rent cannot exceed 30% of local median wage). It treats the *transaction* as the site of justice, not just the income side. It avoids the asymmetry by making housing costs mutually contingent on local earning capacity.

  **2. Geo-Lockean Labor-Mixing (Henry George / Left-Lockean)**
  *   **Core Commitment:** Individuals own their labor and its fruits, but land value is a common inheritance (unearned increment).
  *   **Resolution of Asymmetry:** This framework challenges the moral basis of the landlord's CPI-based return. If land value is socially created, rent is not a legitimate claim on the worker's productivity in the same way profit is.
  *   **Policy Implication:** Wages could remain tied to productivity (respecting labor mixing), but rent controls could be aggressively tied to tenant capacity because the landlord has no natural right to land rent. Alternatively, it could license the wage hike as a recovery of value, but would demand a Land Value Tax to subsidize housing, removing the burden from the wage contract entirely. This resolves the asymmetry by attacking the legitimacy of the property income side.

  **3. Strict Egalitarianism (Luck Egalitarianism)**
  *   **Core Commitment:** No one should suffer disadvantage due to brute luck (e.g., being born in a high-rent tract).
  *   **Resolution of Asymmetry:** Current policy makes the *employer* pay for the brute luck of location. An Egalitarian framework would argue this is arbitrary. Why should a café owner in San Francisco pay more than one in Cleveland for the same moral right to shelter?
  *   **Policy Implication:** This framework would likely reject the local wage index entirely in favor of a national wage floor plus a location-adjusted housing voucher. It removes the asymmetry by socializing the cost of location entirely.

  ### IV. Institutional Redesign: Marginal Product Theory + Unconditional Subsidy

  If we were to replace the presupposed "Embedded Social Reproduction" view with a **Strict Marginal Product Theory of Wages** coupled with a **Separate Housing Entitlement**, the institutional architecture would require the following redesign:

  **1. Decoupling the Wage Floor from Local Costs**
  *   **Current:** $W_{min} = f(\text{Local Rent}/\text{Income Ratio})$
  *   **Redesign:** $W_{min} = f(\text{National Productivity})$ or abolished in favor of sectoral bargaining based on MRP.
  *   **Rationale:** The price of labor should signal scarcity and productivity, not the cost of living. Distorting labor prices to solve housing problems creates deadweight loss (unemployment) in low-productivity regions.

  **2. Socialization of the Housing Gap**
  *   **Current:** Implicit subsidy via mandated higher wages (paid by employers/consumers).
  *   **Redesign:** Explicit subsidy via tax-funded housing vouchers or social housing.
  *   **Mechanism:** A universal housing allowance indexed to local Fair Market Rent (FMR), paid directly to the tenant or landlord, funded by progressive taxation.
  *   **Rationale:** Housing is a consumption good/merit good. Its cost should be borne by the polity (taxes), not the specific employer of the low-wage worker. This separates the **factor market** (labor) from the **consumption market** (housing).

  **3. Rent Control Reform**
  *   **Current:** Caps based on CPI/Capital Improvements.
  *   **Redesign:** Abolition of rent control in favor of supply-side deregulation, *or* retention of rent control strictly to prevent monopoly extraction, not to ensure affordability (since affordability is now handled by the subsidy).
  *   **Rationale:** If housing is subsidized based on need, price controls are unnecessary distortions that reduce supply. The "affordability" problem is solved on the income side (voucher), not the price side (control).

  **4. Normative Shift in Liability**
  *   **Current:** The employer is the guarantor of the worker's social reproduction.
  *   **Redesign:** The State is the guarantor of the citizen's social reproduction; the Employer is the purchaser of labor units.
  *   **Consequence:** This clarifies the ontology of labor. Labor is a commodity sold at market price; the *worker* is a citizen entitled to dignity. The current model conflates the two, risking the employability of the worker to secure the dignity of the citizen.

  ### Summary for Dissertation

  The policy you examine silently rejects the **neoclassical separation of spheres**. It operates on a **Reproductive Justice** model where the wage is a vehicle for social maintenance. However, the asymmetry you note reveals a **hybrid liberalism**: it decommodifies labor power but only partially decommodifies land.

  To make this philosophically coherent without the asymmetry, one must either move toward a **Capabilities Approach** (regulating both wage and rent to ensure the functioning of "shelter") or a **Geo-Lockean approach** (challenging the legitimacy of land rent). If one wishes to maintain neoclassical purity, one must shift the burden of housing from the wage contract to the tax system, acknowledging that **productivity prices labor, but citizenship secures shelter.**
