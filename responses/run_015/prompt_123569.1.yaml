answer: |-
  We need a star to navigate by, a sudden light,
  Otherwise who will dare to make the cut
  That separates the dreamer from the common?
  If success stays hidden, never visible,
  We wander lost within a long shadow,
  Afraid to fail, afraid to even try.

  But tell me, what exactly do we try
  To become when bathed in that artificial light?
  Is it better to stand together in the shadow
  Than watch one person take the sharp cut
  That separates them from us, making them visible
  While the rest return to being merely common?

  You say inspiration spreads like something common,
  That watching one succeed makes others try
  To replicate the path that made them visible.
  But does that hope spread like a guiding light,
  Or does it demand we make a selfish cut
  Against our neighbors, leaving them in shadow?

  There is a safety resting in the shadow
  Where no one stands above the common height.
  To humble pride is not to make a cut
  Out of envy, but to help the group try
  To survive without the distortion of light
  That makes one figure disproportionately visible.

  When one face is overly visible,
  It casts a dark and depressing shadow.
  You call it hope, I call it blinding light.
  The average man feels less than common
  And stops believing he can genuinely try,
  Suspecting the judge already made the cut.

  So do we make the sacrifice and cut
  The tall poppy down to keep the field visible?
  Or let them rise so everyone can try
  To escape the comfort of the collective shadow?
  One argues for the dignity of common,
  The other worships merit and the light.

  We argue whether to cut the peak or dwell in shadow,
  Keep the summit visible or level it to common,
  Claiming we help the people try beneath the light.
