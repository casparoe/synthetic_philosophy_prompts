          *   *Verdict:* FUL handles the *deception* well (it's a lie to the regulator/public). It handles the *institutional corrosion* okay (CC). It struggles with the *technicality* unless we import a robust theory of what regulations are for (leaning Hegel).

  4.  **Refining the Argument (Self-Correction during drafting):**

