      *   *Correction on CC/CW:* Be careful not to slide into consequentialism ("If everyone cheats, the environment dies"). That's not Kant. It must be about the *concept* of the regulation. If the concept of "compliance" entails "actual adherence to the standard," then "apparent adherence" is a contradiction.
