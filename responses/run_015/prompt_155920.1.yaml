  I had a long, somewhat exhausting argument last night with a close friend about whether “the will of the people” is philosophically coherent, or whether populism is essentially a kind of ventriloquism: the leader claims to be merely vocalizing a pre-existing collective will, yet if that will truly existed independently it would not need rhetorical performance to become politically effective, while if the rhetoric brings it into being then the leader is its author, not its messenger. We kept returning to Shakespeare’s Julius Caesar, which we both read in university but never examined through this lens. I am now drafting a short critical essay for a workshop on political philosophy and literature, and I would like you to read the play—especially the forum scenes after Caesar’s death, including Brutus’s address to the citizens and Antony’s funeral oration—through the problem of populist ventriloquism I have sketched. Does Antony discover the Roman crowd’s will, or does he construct it? Does Brutus’s failure stem from treating the crowd as rational republican citizens rather than as a collective body whose desires must first be named? Take the philosophical tension seriously—between descriptive and normative claims about popular sovereignty—and take the drama seriously too: do not reduce the play to a simple illustration, and be explicit about where the text resists your reading. I also want you to say what the play, read this way, adds to the abstract debate that philosophical argument alone misses, particularly regarding the emotional and performative dimensions of collective decision-making.

