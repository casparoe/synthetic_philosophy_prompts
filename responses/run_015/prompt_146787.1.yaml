answer: |-
  Here is a 50-minute teaching plan designed for second-year graduates. It prioritizes structural analogy over historical exegesis, ensuring the "calibration" model lands without collapsing into relativism.

  ### **Session Goal**
  To demonstrate that for Quine, moral values are not *descriptions* of non-natural properties (realism) nor *expressions* of emotion (emotivism), but **indispensable structural posits** required for the coherence of our social-conceptual scheme, analogous to how mathematical objects function within physical theory.

  ---

  ### **1. Teaching Sequence (50 Minutes)**

  **0:00–0:05 | Setup: The Web and the Edge**
  *   **Action:** Briefly recap the "Web of Belief" from *Two Dogmas*. Remind them that for Quine, statements face the "tribunal of experience" not individually but as a corporate body.
  *   **Key Move:** Locate moral claims in the web. They are near the *center* (hard to revise), not because they are *a priori* truths, but because they are load-bearing for the rest of the structure (social coordination).
  *   **Instruction:** Tell them explicitly: "Today we are not asking if moral claims are *true* in the empirical sense. We are asking what work they *do* in the scheme."

  **0:05–0:20 | The Heavy-Lifting Analogy: The Coordinate System Origin**
  *   **The Example:** Do not use "beauty" or "taste." Use **The (0,0) Origin Point on a Coordinate Grid.**
  *   **The Argument:**
      1.  **No External Referent:** There is no physical "zero point" in the universe. You cannot find (0,0) in a telescope. It is not a non-natural property; it is a stipulation.
      2.  **Internal Objectivity:** Once the scheme is adopted, the statement "Point X is at +5" is objectively true or false *relative to the origin*.
      3.  **Indispensability:** You cannot do navigation or physics without fixing an origin. It is a "posit" required for the system to function.
  *   **Application to Ethics:** Moral values (e.g., "Pain is bad") function as the (0,0) of our social scheme. They are not tracking a "moral particle," but without fixing this point, the "coordinates" of social action (law, cooperation, planning) have no resolution.
  *   **Why this works:** It captures the "internal calibration" idea perfectly. It avoids realism (no magic zero-point) and relativism (you can't navigate without *a* zero-point).

  **0:20–0:35 | Misconception Interception (Directed Discussion)**
  *   *See "Anticipated Misconceptions" below for specific scripts.*
  *   **Action:** Pose the question: "If the origin is arbitrary, isn't any moral scheme as good as any other?"
  *   **Goal:** Force them to distinguish between *global arbitrariness* (we could have chosen different axes) and *local necessity* (given this scheme, these values are binding).

  **0:35–0:45 | Structural Dependency Discussion**
  *   **Action:** Ask the group to identify what happens if we try to "eliminate" moral posits to simplify our ontology (like a strict physicalist might try to eliminate numbers).
  *   **Key Insight:** Quine allows us to keep posits if they are indispensable to our best theory. If our "best theory" includes living in societies, moral posits are indispensable, even if they don't refer to physical objects.

  **0:45–0:50 | The Check Question & Wrap**
  *   **Action:** Administer the check question (see below).
  *   **Wrap:** Reiterate that Quine naturalizes ethics not by reducing it to biology, but by treating it as a functional component of human behavior within a naturalistic worldview.

  ---

  ### **2. The One Carrying Example: The Coordinate Origin (0,0)**

  **Why this example?**
  1.  **Avoids Subjectivism:** Unlike "beauty," a coordinate system is rigorous. "5 units North" is not a feeling; it is a structural relation.
  2.  **Avoids Realism:** There is no "Northness" property in the atoms of the earth. It is scheme-relative.
  3.  **Fits Quine's "Calibration":** It mirrors the prompt's requirement for "internal calibration marks."
  4.  **Graduate Level:** It treats the students as capable of handling structuralist analogies without needing emotional hooks.

  **How to deploy it:**
  Draw a grid on the board. Mark a point. Ask: "Is this point *intrinsically* positive or negative?" (No). "Is its position *objectively* determinable?" (Yes, *given* the origin). "Is the origin *real*?" (It's real as a posit, not as a physical object). "If we erase the origin, do the points disappear?" (No, but their *relations* become useless for navigation).
  *Transition:* "Quine treats 'Justice' or 'Cruelty' like the Origin. They are the fixed points that allow us to navigate social space."

  ---

  ### **3. Anticipated Misconceptions & Interception Points**

  **Misconception 1: "So Quine is a Moral Relativist."**
  *   **Why they think it:** If values are "internal to a scheme," and schemes are human-made, then any scheme is valid.
  *   **Where to head it off:** **Minute 25 (during the Analogy).**
  *   **The Fix:** Distinguish between *ontological grounding* and *pragmatic viability*. Quine is a pragmatist. A coordinate system that makes physics impossible is a *bad* system. A moral scheme that makes social cohesion impossible is a *bad* scheme. The constraint is not "The Universe says so," but "The scheme collapses without this."
  *   **Script:** "Relativism says 'Any map works.' Quine says 'Some maps let you walk off a cliff. We keep the values that keep the web of belief from unraveling.'"

  **Misconception 2: "This is just Evolutionary Psychology."**
  *   **Why they think it:** They hear "naturalism" and assume he's reducing morality to survival instincts.
  *   **Where to head it off:** **Minute 10 (Setup).**
  *   **The Fix:** Explicitly separate *causal genesis* from *logical function*. Evolution explains why we *have* the scheme; Quine is analyzing how the scheme *works*.
  *   **Script:** "Quine isn't asking how we evolved to value things. He's asking what status the statement 'X is valuable' has *once we are using language*. Evo-psych is the cause; this is the logic."

  **Misconception 3: "Moral Language is Literally Meaningless."**
  *   **Why they think it:** If it doesn't track empirical properties, they assume it's nonsense (early logical positivism).
  *   **Where to head it off:** **Minute 35 (Structural Dependency).**
  *   **The Fix:** Emphasize *role* over *reference*. Mathematical statements don't track empirical objects either, but they aren't meaningless. They have a functional role.
  *   **Script:** "For Quine, meaning is use within the web. If removing the term breaks the web, it has meaning. Moral terms are load-bearing."

  ---

  ### **4. The Check Question**

  **Question:**
  > "If we accept Quine's view that ontological commitment is determined by the indispensable posits of our best theory, what prevents us from saying moral values are 'real' in the exact same sense that numbers are real? What is the structural difference in their dependency?"

  **What to look for in their answer:**
  *   **Pass:** They identify that numbers are indispensable to *empirical prediction* (science), whereas values are indispensable to *social coordination* (policy/action). Both are posits, but they serve different sectors of the "web."
  *   **Fail:** They say "Numbers are true, values are feelings" (misses the posit analogy) OR "There is no difference, Quine is a moral realist" (misses Quine's distinction on truth-aptness).

  ---

  ### **5. What to Refuse to Explain (Boundaries)**

  To keep this within 50 minutes and at the right level, explicitly **decline** to cover the following if raised:

  1.  **The Euthyphro Dilemma:** Tell them this is a Platonic framing that Quine rejects. We aren't asking if values are loved because they are good; we are asking if the *concept* of "good" is a necessary variable in our social equations.
  2.  **The Technicals of "Ontological Relativity" (Inscrutability of Reference):** Do not get dragged into "gavagai" or proxy functions. It complicates the moral analogy without clarifying it. Keep the focus on *indispensability*, not *reference*.
  3.  **Reconciliation with Error Theory (Mackie):** If a student asks, "Isn't this just Error Theory?" acknowledge the similarity but refuse to map the entire meta-ethical landscape. Say: "Quine's naturalism is distinct because he doesn't think we need to 'eliminate' the discourse, only understand its functional status."

  ### **Instructor Note on Quine's Actual Text**
  *Be careful:* In *On the Nature of Moral Values* (1981), Quine leans closer to non-cognitivism (moral sentences lack truth values) than the "posit" analogy suggests. However, your prompt asks to teach the **structural parallel**. Frame this carefully: "We are looking at the *functional role* of the posit, even if Quine denies moral sentences have truth conditions in the strict scientific sense. The analogy holds for their *necessity within the scheme*, if not their *ontological status*." This protects you from textual pedantry while fulfilling the pedagogical goal.
