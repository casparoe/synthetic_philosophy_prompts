      *   **Core Concept:** "Budgeted Consequentialism" (agents may adopt a self-binding rule of fixed time/resources chosen deliberately, even if moment-by-moment maximizing would do more good).
      *   **Format:** Two-page dissertation prospectus.
      *   **Audience:** MPhil committee (moral philosophy). Needs to be fundable, rigorous, and precise.
      *   **Language:** British English.
      *   **Constraints:** No bibliography/citations.
      *   **Key Elements to Include:**
          *   Precise research question.
          *   Critique of existing answers (prerogative, decision-procedure) as focusing on magnitude.
          *   Methodology: 9-month plan, testing via paired cases (lifetime cost fixed, scheduling varied).
          *   Distinction from Rule-Consequentialism and Indirect Consequentialism (pre-empting supervisor's objection).
          *   Addressing the "one-level-up worry" (regress/incentive to set budget low).
          *   Possible conclusions and criteria for success/failure.
          *   Practical deliverable (for pledge-style giving movements).

  2.  **Drafting - Section by Section:**

      *   **Title:** Needs to be academic but catchy. *The Temporal Structure of Demand: Budgeted Consequentialism and the Unschedulability Objection.*
      *   **Introduction/Research Question:**
          *   Start with the standard objection (too demanding).
          *   Introduce the insight: It's not *how much*, it's *how/when*.
          *   Define "Unschedulability" (unpredictability, no closure, non-pre-payable).
          *   Define "Budgeted Consequentialism".
          *   *Question:* Does the intuitive force of the demandingness objection derive primarily from the magnitude of sacrifice required, or from the temporal structure of the requirement (specifically its unschedulability)?
      *   **Literature/Existing Answers:**
          *   Standard replies: Agent-centred prerogatives (Scheffler), scaling down (moderate consequentialism), decision-procedures vs. criteria of rightness.
          *   Critique: These all try to lower the *quantum* of demand. They assume the problem is the size of the bill. They ignore the *terms of payment*. My friend's experience (fixed share vs. responsive burnout) proves magnitude isn't the only variable.
      *   **Methodology (9-Month Plan):**
          *   Need a month-by-month breakdown.
          *   Months 1-2: Literature & Conceptual refinement.
          *   Months 3-5: Constructing the Paired Cases (The Core Test).
              *   Case A: Levy at start vs. unpredictable lumps.
              *   Case B: Stated endpoint vs. open-ended.
              *   Case C: Pre-payable vs. non-pre-payable.
          *   Months 6-7: Analysis & Distinctions (Rule-Consequentialism etc.).
          *   Months 8-9: Writing & The "One-Level-Up" Worry.
      *   **Distinguishing the View:**
          *   *Vs. Rule-Consequentialism:* RC justifies rules by *outcome*. Budgeted Consequentialism (BC) justifies the budget by *agent-integrity/temporal autonomy* even if outcome is slightly worse. It's a structural permission within act-consequentialism (or a hybrid), not a rule-based criterion of rightness. *Correction:* Actually, to make it distinct, BC claims the *criterion of rightness* allows for the budget as a protected sphere, not just as a heuristic. It asserts a right to plan.
          *   *Vs. Indirect Consequentialism:* Indirect says "follow common sense to maximize good." BC says "follow the budget even if you know breaking it *this once* would maximize good." It's about the *structure of agency*, not epistemic limitation.
      *   **The "One-Level-Up" Worry (Regress):**
          *   If you can set a budget, consequentialism demands you set the *optimal* budget. Doesn't the pressure return?
          *   *Response:* The worry is serious but not decisive. The budget is chosen at a "constitutional moment" (Rawlsian veil of ignorance style, or just a calm reflective period). The stress is concentrated there, leaving the rest of life free. This shifts the burden from constant anxiety to periodic reflection.
          *   *Honest Treatment:* Acknowledge this is the weakest point. If the pressure at the budget-setting stage is just as crushing, the theory fails.
      *   **Possible Conclusions:**
          *   1. Temporal structure is the real driver (Success).
          *   2. Magnitude still dominates (Failure).
          *   3. Regress is fatal (Failure).
          *   4. Indistinguishable from Rule-Consequentialism (Failure).
      *   **Deliverables:**
          *   Academic thesis.
          *   Practical guide for Effective Altruism/pledge movements (how to structure pledges to avoid burnout).
      *   **Failure Conditions:** Explicitly state what counts as failure (intuitions don't shift, regress unstopable, collapse into RC).

  3.  **Refining and Polishing (British English & Tone):**

      *   Ensure spelling: *maximising, programme, defence, centre*.
      *   Tone: Academic, confident but humble about the "half-formed" nature (framed as a hypothesis to be tested).
      *   Length: Needs to fit roughly two pages (approx. 800-1000 words depending on formatting, but I will aim for density appropriate for a prospectus). *Self-correction:* A standard prospectus is often around 1000-1500 words. I need to make sure I don't go overboard but cover all points.
      *   Check constraints: No citations.

  4.  **Drafting the Content (Mental or Scratchpad):**

      *   *Title:* The Architecture of Obligation: Temporal Structure and the Demandingness Objection.
      *   *Intro:* Hook with the friend anecdote (anonymised/generalised). Define the problem.
      *   *Critique:* Prerogatives reduce cost. I argue for changing the *shape* of cost.
      *   *Method:* The paired cases are crucial. Need to describe them clearly.
      *   *Distinctions:* This is where the supervisor's objection comes in. Need to be sharp. BC is not RC. RC says "Follow rule R because R maximises good." BC says "You are permitted to follow Budget B even if breaking it maximises good, because agency requires temporal boundaries."
      *   *Regress:* The "one-level-up" worry. If choosing the budget is maximising, isn't it hard? Yes, but it's a one-off cost vs continuous cost.
      *   *Outcome:* What does success look like? A new defence of consequentialism that preserves integrity without sacrificing the core criterion.

  5.  **Review against Constraints:**

      *   British English? Yes.
      *   No citations? Yes.
      *   Two pages? (I will aim for word count that fits a standard double-spaced page count, roughly 1000-1200 words).
      *   All specific points addressed? (Question, existing answers, method/months, distinctions, regress, conclusions/failure).

  6.  **Final Polish:** Check flow and ensure the "Budgeted Consequentialism" term is defined clearly as a positive view, not just a critique. Ensure the distinction from Rule Consequentialism is robust enough to satisfy a skeptical supervisor. (Key distinction: RC is teleological justification of rules; BC is a structural constraint on the *application* of the teleological principle to preserve agency).

  *(Self-Correction during drafting)*: I need to be careful not to make BC sound like Rule Consequentialism. RC justifies the rule by the *consequences of having the rule*. BC justifies the budget by the *need for temporal autonomy* as a condition of agency, potentially accepting a sub-optimal outcome to preserve the structure. I will frame it as a modification of the *criterion of rightness* to include temporal integrity, rather than a decision procedure.

  Let's write.

  *(Word Count Check)*: A standard A4 page single-spaced is about 500 words. Double-spaced is about 250-300. Two pages double-spaced is roughly 500-600 words. Two pages single-spaced is 1000+. Usually, prospectuses are single-spaced. I will aim for around 1000-1100 words to ensure depth without overflowing.

  *(Final check on British English)*: "Maximising", "programme", "defence", "centre", "modelling".

  *(Final check on "One-Level-Up")*: The prompt asks for an "honest treatment". I shouldn't just dismiss it. I should say it's the critical vulnerability.

  *(Final check on Failure Conditions)*: Make sure they are explicit.

