answer: |-
  **Dissertation Prospectus**

  **Title:** The Architecture of Obligation: Temporal Structure and the Demandingness Objection

  **Research Question**
  Does the intuitive force of the demandingness objection to consequentialism derive primarily from the *magnitude* of sacrifice required, or from the *temporal structure* of the requirement (specifically its unschedulability, unpredictability, and lack of closure)?

  **Project Overview**
  The standard demandingness objection posits that consequentialism requires too much of the agent, threatening personal integrity and the personal point of view. Standard replies attempt to reduce the *quantum* of demand: agent-centred prerogatives permit some self-interest; moderate consequentialism scales requirements to what is reasonable; and the distinction between criteria of rightness and decision procedures suggests we should not psychologically track the good in every moment. All these strategies presuppose that the problem is the size of the bill.

  This project challenges that presupposition. Anecdotal evidence from high-commitment altruists suggests that agents who adopt a fixed, pre-determined schedule of giving (a 'budget') report significantly less burnout and resentment than those who remain responsive to every marginal appeal, even when the lifetime cost is identical. This suggests the objection is not about *how much* is owed, but *how* it is owed. I propose to investigate 'Budgeted Consequentialism': the claim that agents may permissibly adopt a self-binding rule of life—a fixed schedule of time and resources chosen deliberately at a favourable moment—even when moment-by-moment maximising would produce slightly more good. The core hypothesis is that moral agency requires temporal boundaries to function, and that a theory which ignores the 'unschedulability' of demands fails to account for the phenomenology of obligation.

  **Critique of Existing Approaches**
  The project will begin by demonstrating why current solutions leave the structural problem open. The agent-centred prerogative reduces the total cost but leaves the remaining demands open-ended and unpredictable. The decision-procedure strategy offers epistemic relief but maintains that, metaphysically, the agent is always in debt to the optimific act. Both treat the agent as a bucket to be emptied, rather than a planner who needs to know when the emptying stops. By focusing on magnitude, these views fail to address the anxiety of non-closure. My argument is that a demand is not just a weight; it is a shape. A heavy weight that can be lifted once is psychologically distinct from a lighter weight that must be carried indefinitely without rest.

  **Methodology and Work Plan**
  The research will proceed over nine months, centred on a thought-experiment methodology designed to isolate temporal variables.

  *Months 1–2: Conceptual Refinement.* I will formalise the definition of 'unschedulability' (unpredictability, non-closure, non-pre-payability) and map the existing literature on temporal aspects of moral obligation without relying on specific citations, focusing on the conceptual landscape.

  *Months 3–5: The Paired Cases Test.* This is the core empirical (intuition-based) test. I will construct paired cases where the total lifetime cost is held fixed, but scheduling features vary.
  1.  *The Levy:* A demand for 10% of income announced at the start of a career versus the same sum extracted in unpredictable lump sums.
  2.  *The Endpoint:* A demand that ceases at age 60 versus an open-ended demand until death.
  3.  *Pre-payment:* A demand that can be discharged early via a lump sum versus one that must be paid as it arises.
  If intuitions of 'excessive demandingness' track the scheduling features rather than the total cost, the structural thesis is supported.

  *Months 6–7: Differentiation.* I will draft the defence against the charge that Budgeted Consequentialism collapses into Rule-Consequentialism or Indirect Consequentialism.
  *Vs. Rule-Consequentialism:* RC justifies rules solely by their optimific consequences. BC justifies the budget as a structural condition of agency, potentially permitting sub-optimal outcomes to preserve the agent's temporal autonomy. BC modifies the criterion of rightness to include integrity over time, not just the justification of a heuristic.
  *Vs. Indirect Consequentialism:* Indirect strategies claim we should follow non-consequentialist rules *because* doing so maximises the good. BC claims we may follow the budget *even if* we know breaking it in a specific instance would maximise the good, because the permission is grounded in the right to plan, not epistemic limitation.

  *Months 8–9: The 'One-Level-Up' Worry and Writing.* I will address the regress objection: if one can set a budget, does not consequentialism demand one set the *optimal* budget, thereby reintroducing the pressure at the point of choice? I will argue that while this pressure exists, it concentrates the burden into a 'constitutional moment' of reflection, relieving the day-to-day burden. However, I will treat this honestly as the project's critical vulnerability. If the anxiety of setting the budget is as crushing as the anxiety of daily maximisation, the theory fails. The final months will be dedicated to writing the dissertation.

  **Possible Conclusions and Success Criteria**
  There are three viable outcomes.
  1.  *Success:* The paired cases show a robust intuitive difference, and the 'one-level-up' worry is mitigated by the concentration of burden. This yields a new defence of consequentialism that preserves the personal point of view without abandoning the core commitment to the good.
  2.  *Partial Success:* The structural point holds, but the regress is fatal. This would suggest that while temporal structure matters, consequentialism cannot accommodate it without ceasing to be consequentialism.
  3.  *Failure:* The paired cases yield no intuitive difference (magnitude is all that matters), or the view proves indistinguishable from Rule-Consequentialism.

  **Deliverables**
  The primary deliverable is the MPhil dissertation. However, a secondary deliverable will be a practical framework for pledge-style giving movements (e.g., effective altruism organisations). If the structural thesis holds, these organisations should advise donors to adopt fixed, pre-committed schedules rather than encouraging open-ended responsiveness, to prevent burnout and attrition. A successful project provides a philosophical justification for 'capping' one's moral commitment.

  **Failure Conditions**
  I define project failure strictly. First, if the paired cases do not elicit divergent intuitions regarding demandingness, the central hypothesis is falsified. Second, if the 'one-level-up' worry cannot be stopped—meaning the pressure to optimise the budget recreates the original burnout at the planning stage—the solution is merely cosmetic. Third, if I cannot distinguish Budgeted Consequentialism from Rule-Consequentialism without abandoning the consequentialist criterion of rightness entirely, the project collapses into existing literature. In any of these scenarios, the thesis would pivot to a critical analysis of why the structural intuition is misleading, rather than a defence of the budgeted view.
