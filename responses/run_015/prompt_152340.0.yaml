answer: |-
  # Chapter 1: Framing the Epistemology of Markets

  ## 1.1 The Purpose of Theory
  The purpose of a theory in the epistemology of markets is to provide **microfoundations for market design**. It is not sufficient to describe price dynamics; the theory must function as a design constraint. Specifically, it must satisfy two conditions:
  1.  **Volume Condition:** It must specify the necessary and sufficient conditions under which a market will sustain nonzero trading volume.
  2.  **Evidence Condition:** It must specify when the resulting clearing price constitutes evidence about the world that a non-participant (bystander) may rationally use to update their beliefs.

  ## 1.2 Desiderata
  A theory satisfying this purpose must meet the following requirements. Each is marked as **Non-Negotiable** (required by the purpose definition) or **Camp Preference** (contested ground between epistemic purists and design pragmatists).

  ### D1. Rational Volume Existence
  *   **Requirement:** The theory must explain nonzero volume without appealing to irrationality (e.g., errors, systematic biases, or exogenous "noise" traders).
  *   **Motivating Case:** The Milgrom-Stokey No-Trade Theorem. If agents are rational, share common priors, and trade is common knowledge, volume should be zero. Yet, real markets trade. A design theory cannot rely on "mistakes" as a liquidity source, as mistakes are not design-stable.
  *   **Status:** **Non-Negotiable.** (Without this, the Volume Condition rests on fragile psychological assumptions.)

  ### D2. Motive Separation
  *   **Requirement:** The theory must structurally separate informational motives (betting on state) from risk-sharing motives (hedging exposure), liquidity needs, and noise.
  *   **Motivating Case:** A farmer selling futures. Is she revealing private information about crop yield (epistemic) or merely reducing variance (hedging)? A bystander cannot treat the price as evidence without knowing which motive dominated.
  *   **Status:** **Non-Negotiable.** (Required for the Evidence Condition.)

  ### D3. Willingness-to-Trade as Endogenous Evidence
  *   **Requirement:** The theory must model an agent's willingness to trade as itself a signal that other agents update upon.
  *   **Motivating Case:** The "Winner's Curse." If I know you are willing to sell at $X, I must infer you believe the value is $<X$. A theory that treats orders as exogenous inputs fails to capture the strategic epistemic environment.
  *   **Status:** **Non-Negotiable.**

  ### D4. Bystander Admissibility
  *   **Requirement:** The theory must identify *whose* beliefs are aggregated in the price (e.g., marginal trader, average, weighted by wealth) and specify the transformation rule a bystander uses to extract evidence from that price.
  *   **Motivating Case:** Prediction Markets. A policy maker observes a 70% price in a prediction market. Can they treat this as a 70% probability? Only if the theory specifies how risk aversion and liquidity constraints distort the mapping from belief to price.
  *   **Status:** **Non-Negotiable.**

  ### D5. Reflexive Consistency
  *   **Requirement:** The theory must survive the common knowledge of its own publication. If the theory proves "no trade occurs under conditions C," and this becomes common knowledge, the theory must account for whether trade ceases or the conditions C change.
  *   **Motivating Case:** A published arbitrage bound. Once traders know the bound, they trade to enforce it, potentially invalidating the assumptions that created the bound.
  *   **Status:** **Non-Negotiable.**

  ### D6. The Blind Book Residual
  *   **Requirement:** In a "Blind Book" (sealed orders, uniform clearing, no observation of others, identical information, mild exposure differences), the theory must **explain** the residual nonzero volume as rational risk-sharing, not explain it away as error.
  *   **Motivating Case:** Standard inference-based theories predict volume collapses to zero here (no information to infer). Empirically, volume falls but stabilizes. Since designers use Blind Books to ensure liquidity, a theory that labels this liquidity "error" fails the Volume Condition.
  *   **Status:** **Non-Negotiable.**

  ### D7. Protocol Neutrality
  *   **Requirement:** The explanation for why trade occurs should not rest solely on features of the trading protocol that act merely as information channels (e.g., trade occurs *only* because the order book leaks data).
  *   **Motivating Case:** Open vs. Closed Book. If trade vanishes when the book is closed, the market is an information leakage mechanism, not an aggregation mechanism.
  *   **Status:** **Camp Preference.** (Epistemic purists demand this; Design pragmatists note that protocol *is* the information structure.)

  ## 1.3 Tensions and Exclusionary Power

  ### Incompatible Desiderata
  There is a tension between **D6 (Blind Book Residual)** and **D7 (Protocol Neutrality)**.
  In the Blind Book case, trade persists *because* the protocol prevents agents from observing others' willingness to trade (blocking the inference that would stop the trade per D3). Thus, the volume exists *due to* a specific protocol feature (sealing) that restricts information flow. A strictly Protocol-Neutral theory might struggle to explain why volume stabilizes specifically in the Blind Book but might collapse in a fully transparent book with identical information parameters. We mark D7 as a Preference to allow the theory to accommodate the Non-Negotiable D6.

  ### The Exclusionary Requirement
  The single requirement that excludes the largest number of usual families of views is **D1 (Rational Volume Existence)**, specifically when interpreted under **Common Priors**.
  *   It excludes **Noise Traders** and **Bounded Rationality** by definition (appeal to irrationality/constraint).
  *   It excludes **Heterogenous Priors** if "rationality" entails common priors (the standard Bayesian view).
  *   It pressures **Ambiguity Aversion** models if ambiguity is treated as a deviation from probabilistic rationality.
  *   It leaves **Hedging** as the primary survivor, forcing the theory to rely on risk-sharing as the engine of volume when information is symmetric.

  ## 1.4 Scoring Candidate Families
  *   **Noise Traders:** Fail D1 (rely on irrationality). Fail D2 (noise is inseparable from info without external calibration). Fail D4 (price is contaminated evidence).
  *   **Heterogenous Priors:** Pass D1 (trade on disagreement). Fail D2 (cannot separate "different info" from "different priors" endogenously). Fail D4 (bystander cannot know whose prior is in the price).
  *   **Ambiguity Aversion:** Pass D1 (if modeled as rational). Fail D4 (price reflects caution/aversion, not just probability, confusing the bystander).
  *   **Bounded Rationality:** Fail D1 (explicitly relies on computational limits). Fail D5 (reflexivity changes the computational load).
  *   **Hedging (Risk-Sharing):** Pass D1 (rational). Pass D6 (explains Blind Book volume). Fail D2/D4 (price reflects risk exposure, not just world state, requiring the bystander to filter out risk premia to find evidence).

  *Conclusion:* Only a hybrid Rational Expectations + Risk-Sharing model satisfies D1 and D6, but it must solve D2/D4 to allow the bystander to filter risk-premia from informational content.
