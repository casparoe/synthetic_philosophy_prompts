answer: |-
  # The Life-Service Gate (LSG)
  **Purpose:** Rapid triage for heritage proposals. Ensures history serves the living community, not the dead past.
  **Time Budget:** 10 Minutes per pitch.
  **Operator:** Heritage Approvals Officer.

  ### The Procedure

  **GATE 1: The Critical Break (Truth & Harm)**
  *Goal: Prevent hagiography that justifies past suffering or erases conflict.*
  *   **Question:** Does the narrative explicitly acknowledge at least one significant cost, conflict, or victim associated with the site (e.g., labor strife, environmental damage, displacement)?
  *   **Pass:** Yes, specific harm is named and contextualized.
  *   **Fail:** No, or harm is minimized as "necessary progress."
  *   **Action:** **HARD NO.** (Do not proceed. A history that hides pain poisons the present.)
  *   **Value Flag:** *Officer Note:* If the applicant claims "no records exist" of harm, this is a Fail. Absence of evidence is not evidence of absence in industrial zones.

  **GATE 2: The Antiquarian Anchor (Respect & Accuracy)**
  *Goal: Prevent fabrication or suffocating detail without context.*
  *   **Question:** Is the physical evidence (artifacts, structures, documents) accurately represented, and is the volume of detail manageable for a walker?
  *   **Pass:** Yes, artifacts are real/verified, and the route does not overwhelm the walker with uncurated data.
  *   **Fail:** No, artifacts are replicas presented as originals, OR the pitch lists every bolt/screw without a story.
  *   **Action:** **HARD NO.** (Do not proceed. Fake history insults intelligence; data-dumping kills engagement.)

  **GATE 3: The Monumental Spark (Utility & Future)**
  *Goal: Ensure the history inspires current action or identity.*
  *   **Question:** Does the pitch articulate a clear takeaway for the *current* resident? (e.g., "This resilience builds our future," not just "This was great.")
  *   **Pass:** Yes, a link is drawn between the past event and a present-day value or action.
  *   **Fail:** No, the pitch ends at "This is how it was."
  *   **Action:** **HAND-OFF TO OFFICER.** (This is the grey zone. A proposal can be factually correct but spiritually dead. Use discretion.)

  **FINAL STATUS**
  *   **Approved:** Passes Gates 1, 2, and 3.
  *   **Rejected:** Fails Gate 1 or 2.
  *   **Officer Discretion:** Passes 1 & 2, Fails 3 (or weak Pass on 3).

  ***

  ### Application to Test Pitches

  #### Pitch A: "The Visionary Founder's Trail"
  *   **Content:** Focuses on the mill owner's technical innovations. Describes the town as a "gift from his genius." Mentions workers only as "loyal hands." No mention of the 1922 strike or the river contamination.
  *   **Gate 1 (Critical):** **FAIL.**
      *   *Reasoning:* Zero acknowledgment of cost or conflict. "Loyal hands" is minimization.
      *   *Result:* **HARD NO.** Procedure stops here.
  *   **Officer Comment:** The checklist did its job. This is myth-making, not history. It serves the memory of the owner, not the life of the town.

  #### Pitch B: "The Iron & Gear Archive Walk"
  *   **Content:** A self-guided tour of 40 preserved machines found on-site. Each plaque lists the manufacture date, steel grade, and function. The intro states: "These machines built our economy." No mention of owners, workers, strikes, or pollution. Just the technology.
  *   **Gate 1 (Critical):** **PASS (Technically).**
      *   *Reasoning:* It does not explicitly *lie* about harm. It omits the human element entirely, which avoids minimizing suffering because it ignores suffering altogether. It is neutral.
  *   **Gate 2 (Antiquarian):** **PASS.**
      *   *Reasoning:* Artifacts are verified. The route is linear. It is pure preservation.
  *   **Gate 3 (Monumental):** **PASS (Barely).**
      *   *Reasoning:* The statement "These machines built our economy" counts as a link to the present. It is thin, but it exists.
  *   **Result:** **TECHNICALLY APPROVED.**

  ***

  ### Post-Mortem: Why Pitch B Feels Wrong

  Pitch B clears the gates, but it feels like walking through a graveyard. The checklist failed to catch the **Silence of Agency**.

  **What the Checklist Missed:**
  The LSG checks for *content* (harm, facts, utility), but it does not check for *voice*.
  1.  **Who is the Subject?** In Pitch B, the *machines* are the protagonists. The humans are invisible. This is antiquarianism dominating life—it values the object over the person.
  2.  **The "Neutral" Lie:** By excluding the human cost entirely, Pitch B achieves a "clean" pass on Gate 1. It didn't deny the strikes; it just made the world in which strikes happened disappear. This is a subtle form of hagiography that favors the structure over the worker.
  3.  **The Hand-off Limitation:** Gate 3 is the only place I could have stopped Pitch B, but the criteria ("link to present") was too weak. "Built our economy" is a dead link. It doesn't tell a current resident how to *live*.

  **Fix for Next Iteration:**
  Add a **Voice Check** to Gate 3.
  *   *New Question:* "Are the primary voices in this narrative human (workers, families, community) or material (buildings, products, profits)?"
  *   *Requirement:* Human voices must constitute at least 50% of the narrative weight.

  **Summary:**
  Use the LSG to kill the liars (Pitch A). But watch out for the archivists (Pitch B) who pass the test by removing the life from history entirely. When a proposal feels cold but checks the boxes, that is your signal to intervene.
