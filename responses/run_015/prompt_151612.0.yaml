      *   *The Eight Grades:* Yes, in *De Mendacio*, he does categorize lies into eight types.
      *   *Are lighter lies okay?* No. This is the crucial point. He ranks them by *sinfulness*, but he maintains *all* are sins. None are permissible.
      *   *Lying to a murderer:* The classic "murderer at the door" example is usually associated with Kant later, but Augustine addresses similar scenarios. His answer is generally: Do not lie. You are responsible for your truthfulness, not the murderer's actions.
      *   *Mental Reservation:* This is a later Jesuit/Casuitry development (16th-17th century). Augustine does *not* endorse "mental reservation" in the later scholastic sense. He emphasizes the intent to deceive. If you intend to deceive, it's a lie, even if the words are technically ambiguous.
      *   *Language Argument:* Yes, Augustine argues that words are signs of thoughts. To use them against their purpose (to convey truth) is to destroy their function.
      *   *Later Reply (*Contra Mendacium*):* He doubles down. He criticizes Priscillianists (or similar groups) who lied to protect themselves. He does *not* suggest mental reservation as a fix; he suggests silence or suffering.

