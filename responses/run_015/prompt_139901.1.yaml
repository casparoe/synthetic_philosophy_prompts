answer: |-
  Subject: Re: The semantics of the code

  Hi there,

  You have hit on the exact nerve that keeps me up when I am not dreaming about failed PCRs. It is the central tension in our field, and you are right to feel that the standard disclaimers do not match the daily practice. I have been turning this over since you asked, and I think there are three ways we could try to square this circle, though only one really holds water when you look at the bench work closely.

  The first candidate is what we might call strong teleosemantics. This view says DNA genuinely has content because it was selected for carrying information. The meaning is fixed by evolutionary history, so when we say a gene codes for a polypeptide, we are describing a real functional property bestowed by natural selection. This fits nicely with the intuition that the genome is a blueprint shaped by fitness. But you already spotted the fatal flaw in your note about mitochondria. If the meaning were fixed strictly by ancestral selection on the sequence itself, UGA could not mean stop in the nucleus and tryptophan in the mitochondrion. The sequence is identical, the history is largely shared, yet the meaning flips. This tells us the content cannot reside in the string alone, nor in a monolithic evolutionary history, because the evolutionary context diverged locally. So we have to toss the idea that the DNA carries intrinsic semantic content independent of the machinery reading it.

  The second candidate is the pure instrumentalist line, which is what most of us mutter when pressed at a conference. This view says the language is just a heuristic, a façon de parler with no ontological weight. There is only chemistry and causality; the ribosome does not read, it binds and catalyzes. The trouble with this is that it fails to explain why we use this specific vocabulary for this specific causal chain and not others. We do not say the lipid membrane codes for cell shape, even though causally it determines it. We do not say the substrate reads the enzyme. The information talk is reserved for a specific kind of causal control where the sequence is arbitrary relative to the chemistry but stable relative to the system. If it were just a harmless metaphor, it would not track such a precise distinction in our experimental design. We treat coding regions differently from regulatory regions differently from junk, and that treatment relies on the assumption that the coding relationship is special, not just causal. So instrumentalism is too weak to account for the precision of the practice.

  That leaves us with a relational view, which I think is where the practice actually lives. On this picture, the content is not in the DNA and not in the ribosome, but in the stabilized relationship between the two within a specific cellular context. The code is a convention established by the decoding machinery, which itself was selected to maintain that convention. This explains the mitochondrial case perfectly: the machinery differs, so the convention differs, so the meaning differs, even if the text is the same. It also explains why we slip up and say gene for alcoholism. We are shifting contexts from the molecular convention to a higher-level causal story, which is sloppy but recognizable as a shift in the relational frame. We are committed to genuine content, but it is relational content, like the value of a currency note which depends on the bank backing it, not the paper itself.

  If we take this relational view seriously, your synthetic biology case becomes clear. If we build a bacterium where a codon is reassigned to a synthetic amino acid and the bug thrives, we must say the genome now says something different. It is not being misread; it is being read correctly according to a new convention established by the engineered machinery. The text has not changed, but the language has. This is coherent because the meaning was never in the text to begin with. It lands us in a place where the genome is a potentiality that is actualized by the cellular context, which fits both the evolution story and the engineering story.

  As for your second question, if we banned the vocabulary tomorrow, the bench work would not stop, but the conceptual fights would get much worse. You mentioned the functional genome debates, and you are right to suspect that is where the damage would show. Without the distinction between coding information and mere causal effect, we would lose the ability to distinguish between a sequence that is conserved because it carries selected content and a sequence that is merely biochemically active noise. The ENCODE controversy happened precisely because people conflated causal binding with functional information. The code vocabulary protects us from that by marking out the specific relational status of the coding sequence. It forces us to ask not just does this bind, but does this carry instruction relative to the system's history and machinery. We need the talk, not because DNA is a book in a mystical sense, but because it is the only way we have to track this specific kind of relational control without drowning in causal noise. So keep using the metaphors, but keep your fingers crossed that your colleagues remember the machinery defines the meaning.

  Best,

  Your colleague
