answer: |-
  Here is the ranking of your three conceptual questions, ordered by **logical dependency** (upstream/downstream) and **philosophical tractability** (suitability for conceptual analysis without archival work), followed by a defense of the ordering and the conditions for its revision.

  ### The Ranking

  1.  **The Status of Counterfactual Dependence** (Does history require causal laws or narrative coherence?)
  2.  **The Specificity of Structural Causation** (Can structures produce specific ideology without *ad hoc* adjustments?)
  3.  **The Conflation of Explanation and Culpability** (Is the debate about cause or blame?)

  ---

  ### Defense of the Ordering

  #### 1. Upstream Priority: The Logic of Possibility (Q2)
  **Why it is First:** This question is the **epistemic gatekeeper**. Before you can model whether Hitler was necessary (Q1) or who is to blame (Q3), you must define what it *means* for a historical event to be "necessary" or "contingent" in a narrative context.
  *   **Dependency:** If counterfactuals require strict covering laws (Hempel), your novel is constrained by sociological generalizations. If they require only narrative coherence (Dray/Weber), your novel is constrained by thematic consistency. You cannot evaluate the causal power of structures (Q1) until you define the rules of causal inference (Q2).
  *   **Tractability:** This is the most tractable for a philosopher. It relies on modal logic, possible-worlds semantics (e.g., David Lewis), and philosophy of history. It requires no archival data, only an analysis of how we validate "what if" claims.
  *   **Narrative Leverage:** Settling this determines the **physics of your fictional universe**. It tells you whether you are writing a "rigorous" counterfactual (bound by probabilistic laws) or a "speculative" one (bound by thematic truth). This is the highest-leverage decision for construction.

  #### 2. Middle Priority: The Logic of Causation (Q1)
  **Why it is Second:** This question concerns the **mechanism of the plot**. Once you have established *how* to validate a counterfactual (Q2), you must ask *what* happens in the alternative timeline.
  *   **Dependency:** This is downstream of Q2 because the "specificity" of the ideology depends on your theory of causation. If your theory of counterfactuals allows for "divergence points," you can argue structures create the *conditions* for fascism, but agents determine the *content*. If your theory demands strict determinism, the content is fixed by the structure.
  *   **Tractability:** This is less tractable than Q2 or Q3. It sits in the philosophy of social science. Determining whether "resentment + militarism" logically entails "genocidal antisemitism" risks becoming an empirical sociological claim. However, it remains conceptually analyzable as a problem of **supervenience**: does the ideological supervene on the structural?
  *   **Narrative Leverage:** Settling this determines the **butterfly effect**. If structures guarantee the ideology, removing Hitler changes the timeline little (tragedy of inevitability). If structures only guarantee authoritarianism, removing Hitler changes the *nature* of the evil (tragedy of contingency).

  #### 3. Downstream Priority: The Logic of Valuation (Q3)
  **Why it is Third:** This question concerns the **theme and reception**. It addresses the motivation behind the debate rather than the mechanics of the history.
  *   **Dependency:** This is logically downstream of Q1 and Q2. Moral culpability presupposes causal responsibility. You cannot determine if we are conflating blame with cause until you have independent criteria for cause (Q2) and a model of the agent's contribution (Q1).
  *   **Tractability:** This is highly tractable (meta-ethics/philosophy of action), but it is less critical for *construction*. It helps you evaluate the *discourse* surrounding the book, not the internal logic of the plot.
  *   **Narrative Leverage:** Settling this clarifies the **moral stakes**. It prevents the narrative from becoming a moral apologia disguised as history. However, it does not dictate plot mechanics as directly as Q1 or Q2.

  ---

  ### Criteria for Revision

  This ranking is stable under the assumption that **logical priority dictates philosophical labor**. However, the following results would force a re-ordering:

  **1. The Empirical Reduction of Ideology (Revises Q1 Up)**
  *   **Result:** If social science produces a **formal model of ideology formation** that demonstrates ideological content is mathematically derivable from structural variables (e.g., economic indices + treaty terms = specific hate speech patterns).
  *   **Effect:** Q1 moves to **Rank 1**. It ceases to be a conceptual debate and becomes an empirical input. The philosopher's role shifts from analyzing causation to applying the empirical law. Q2 becomes secondary because the "laws" are now given by data, not metaphysics.

  **2. The Ethical Primacy of Narrative (Revises Q3 Up)**
  *   **Result:** If literary theory or ethical criticism establishes that in counterfactual fiction, **moral truth overrides historical plausibility** (i.e., the "correct" story is the one that best assigns culpability, regardless of causal probability).
  *   **Effect:** Q3 moves to **Rank 1**. The construction of the story is no longer governed by causal logic (Q2) or historical mechanism (Q1), but by the ethical imperative to assign blame correctly. The "Great Man" debate becomes a moral choice, not a historical one.

  **3. The Collapse of Counterfactual Semantics (Revises Q2 Down)**
  *   **Result:** If analytic philosophy concludes that **historical counterfactuals are semantically void** (i.e., there is no truth value to "If Hitler had died..." statements outside of actual records).
  *   **Effect:** Q2 drops to **Rank 3** (or is discarded). The project shifts entirely to Q1 (studying actual structural conditions) and Q3 (studying why we *tell* these stories), moving the philosopher from a modeler of history to a modeler of memory.

  ### Recommendation for the Philosopher-Novelist

  Start with **Q2**. It is the only question you can answer definitively with conceptual tools alone. By explicitly choosing a "logic of counterfactuals" for your novel (e.g., "In this narrative, coherence trumps causal law"), you immunize yourself against the intractability of Q1 and the moralizing of Q3. You define the rules of your world first; the plot and the theme must follow those rules.
