      *   This supports the "Sortal" reading. A sortal tells you *what* a thing is and how to count it.
      *   *Advice:* Lean into "Sortal" more than "Determinable." Determinables usually imply inclusion (Red is a color). Gongsun denies inclusion (White Horse is *not* Horse). Sortals can be mutually exclusive in terms of naming conventions.

  9.  **Refining the *Jian Bai* point:**
      *   *Jian Bai* argues that "Hard" and "White" are hidden from each other (*cang*).
      *   How does this help? It shows properties are distinct ontological units.
      *   So, when they *do* combine in *Bai Ma*, it's a specific ontological event, not just a linguistic label.
      *   This supports the "ontological fusion" idea. The properties are real, so their combination is real.

