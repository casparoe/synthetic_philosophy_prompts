      *   *Key Argument:* "Horse" names the shape. "White" names the color. "White Horse" names both. Therefore, the name is different. If the name is different, the reality is different.
      *   *User's "Breeding" Example:* This is anachronistic but illustrative. The text uses "seeking a horse" (you can use a yellow/black horse) vs. "seeking a white horse" (only white works). This is about functional satisfaction conditions.
      *   *Correction:* Ensure the user doesn't claim Gongsun talks about breeding. He talks about *seeking* (qiu) and *naming* (ming).

  7.  **Drafting the Response:**
