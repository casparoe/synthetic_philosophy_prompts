  2.  **Initial Assessment & Scholarly Context:**
      *   *Gongsun Long's "White Horse is Not Horse":* This is one of the most famous paradoxes in Chinese philosophy. Standard interpretations range from logical nominalism (names vs. realities) to Platonic realism (universals).
      *   *The User's Angle:* "Ontological fusion" and "sticky properties." This sounds like a mereological or hylomorphic reading. It aligns with recent scholarship that takes the School of Names more seriously as metaphysicians rather than sophists (e.g., A.C. Graham, Chad Hansen, Chris Fraser).
      *   *Determinable/Determinate:* This is a specific analytic philosophy framework (Johnson, Searle). Applying it to Warring States texts is risky but potentially fruitful if handled carefully.
      *   *Jian Bai (Hard and White):* This dialogue argues that "hard" and "white" are separate because you perceive them through different senses (touch vs. sight). Connecting this to "fusion" is tricky because *Jian Bai* often argues for the *separability* of attributes, whereas the user wants to argue for *fusion* in *Bai Ma*. I need to check if this tension undermines the thesis.

  3.  **Addressing Question 1: Determinable/Determinate Framing:**
      *   *Pros:* It captures the intuition that "white horse" is more specific than "horse." It explains why extension differs (fewer white horses than horses).
      *   *Cons:* The text argues "White Horse is *Not* Horse" (*Bai Ma Fei Ma*). A standard determinable/determinate relation usually implies inclusion (a red apple *is* an apple). If "white horse" is a determinate of "horse," then "white horse *is* a horse." Gongsun Long says *Fei* (is not).
      *   *Nuance:* Gongsun Long distinguishes between the *name* (ming) and the *reality* (shi). He might be saying the *concept* "white horse" is not identical to the *concept* "horse."
      *   *Verdict:* The framing illuminates the *intension* (meaning) but risks clashing with the *extension* (reference) if not careful. The user's idea of "ontological fusion" helps explain the *Fei* (is not) claim better than standard determinable logic. If "white horse" is a *new* fused entity, it's not the same as the bare "horse."
      *   *Correction:* The term "determinable" usually implies hierarchy. "Fused kind" might be better.

  4.  **Addressing Question 2: The *Jian Bai* (Hard and White) Connection:**
      *   *The Text:* In *Jian Bai Lun*, Gongsun Long argues that "hard," "white," and "stone" are three, not two. Why? Because "hard" and "white" are separate qualities that don't necessarily cohere. You see white but don't feel hard; you feel hard but don't see white. They are "separated" (*li*).
      *   *The User's Thesis:* The user wants to use *Jian Bai* to support "property-combination that changes identity conditions."
      *   *The Conflict:* *Jian Bai* is often read as arguing for the *independence* of qualities (realism about universals), whereas *Bai Ma* is read as arguing for the *specificity* of compounds.
      *   *Synthesis:* The connection works if the user argues that for Gongsun Long, properties are ontologically robust. In *Bai Ma*, the combination creates a specific *ming* (name) that demands a specific *shi* (reality). In *Jian Bai*, the separation shows that properties exist independently before combination.
      *   *Risk:* Don't say *Jian Bai* argues for fusion. It argues for separability. Use it to show *why* fusion is significant when it happens. The "stickiness" in *Bai Ma* is exceptional compared to the usual separability in *Jian Bai*.

  5.  **Addressing Question 3: Interesting vs. Forced:**
