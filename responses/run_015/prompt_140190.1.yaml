      *   *Argument:* The law wants discrete units. Biology offers continua. The request asks for a "concept" that does three jobs. Maybe the "concept" isn't a biological definition but an operational protocol? No, the prompt asks for a *species concept* requirements list. I need to define what the *concept* must achieve, even if it's impossible.
