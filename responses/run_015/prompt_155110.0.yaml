answer: |-
  This debate is a classic instantiation of the "downward causation" problem in philosophy of mind, specifically referencing Douglas Hofstadter's metaphor of the careenium and simmballs from *I Am a Strange Loop*. The reason your study group is spinning its wheels is that the disagreement is not empirical, but **ontological and categorial**. You are stuck because both sides are correct within their own level of description but are refusing to acknowledge the legitimacy of the other's causal vocabulary.

  **The Structure of the Disagreement**
  The deadlock arises because the two camps are using the word "causal" to refer to two mutually exclusive categories of interaction:

  1.  **The Substrate-Only Camp (Physical Closure):** When they say the symbol doesn't "push," they are using a strict thermodynamic definition of causation. They require energy transfer or momentum exchange between distinct physical entities. Since a simmball is a pattern *of* the substrate rather than a separate physical object, they argue it cannot expend energy to move the substrate any more than a software variable can heat up a CPU. For them, "causation" is synonymous with "bottom-up physical force."
  2.  **The Down-Pushers (Functional Constraint):** When they say the symbol "reshapes dynamics," they are using a cybernetic or information-theoretic definition of causation. They are arguing that the *pattern* constrains the phase space of possible future states of the substrate. The "push" is not a transfer of energy, but a selection of trajectory. For them, "causation" includes "top-down informational constraint."

  **Why Experiments Won't Help**
  There is no hidden empirical question here because of **supervenience**. You agreed that lesioning the careenium wipes out the simmballs, and that error-correction loops exist. Any experiment the Down-pushers propose to show a simmball affecting the careenium will be interpreted by the Substrate camp as "one part of the careenium affecting another part of the careenium." Because the symbol *supervenes* on the substrate (it cannot exist without it), you cannot isolate the symbol physically to test its independent causal power. The data will always be compatible with both views: the physics is closed (Substrate view), but the pattern is predictive (Down-pusher view).

  **The Diagnosis**
  This is a **verbal dispute grounded in bedrock intuition**. You are answering different questions: the Substrate camp is asking about *mechanism* (how does the energy move?), while the Down-pushers are asking about *ontology* (what units are indispensable for explaining the behavior?). The Substrate camp assumes that if a high-level description can be reduced to a low-level description, the high-level description is causally inert (epiphenomenal). The Down-pushers assume that if a high-level description offers predictive power that is computationally irreducible from the low-level, it possesses "causal emergence."

  **What Progress Looks Like**
  Progress will not come from neuroscience, but from **formal causal analysis**. You need to adopt a framework like **Causal Emergence** (e.g., the work of Erik Hoel or Judea Pearl's interventionist calculus) which quantifies how much information about future states is captured by macro-variables versus micro-variables.
  *   **The Distinction:** Distinguish between *efficient causation* (physical shoving) and *formal causation* (pattern constraint).
  *   **The Resolution:** Accept **Non-Reductive Physicalism**. Acknowledge that while the substrate provides the *energy* for the change (satisfying the Substrate camp), the symbol provides the *information* that dictates the specific trajectory (satisfying the Down-pushers). The symbol "pushes" in the sense that removing the pattern (even while keeping the particles) changes the outcome, even if no new energy is introduced.

  If you cannot agree to treat "causation" as level-relative, the question is ill-posed because it demands that an abstract pattern behave like a physical particle.

  Bottom line: The disagreement is ontological rather than empirical, stemming from incompatible definitions of causation that conflate physical energy transfer with high-level informational constraint.
