answer: |-
  Here is a structural plan for the 50-minute session. It is designed to thread the needle between Kin Selection (past) and Reputation (future) by focusing strictly on **Direct Reciprocity via Partner Fidelity.**

  ### 1. The Sequence: Order and Rationale

  Your instinct is correct: **You must solve the One-Shot before you introduce Iteration.** If you don't, students view cooperation as the "default" and defection as the anomaly. In evolutionary game theory, defection is the null hypothesis.

  **The Arc (50 Minutes):**

  1.  **The Trap (10 mins):** Define the payoff structure conceptually ($T > R > P > S$). Do not start with a matrix; start with the *incentive*.
      *   *Why:* Establish that cooperation is individually costly regardless of what the partner does. This inoculates against the "good for the group" misconception early.
      *   *Key Move:* Prove Defection is the only ESS in a One-Shot. If they don't buy this, the rest is magic.
  2.  **The Escape Hatch (15 mins):** Introduce Iteration not as "being nice," but as changing the *probability of future payoffs*.
      *   *Why:* This distinguishes your lecture from Kin Selection. Kin changes the *recipient* of the benefit ($r$); Iteration changes the *timing* of the benefit ($w$).
      *   *Key Move:* Define the "Shadow of the Future" strictly as the probability of re-encounter ($w$), not an emotional state.
  3.  **The Mechanism (15 mins):** Conditional Strategies (Tit-for-Tat).
      *   *Why:* Unconditional cooperation is invadable; unconditional defection is stable but suboptimal. You need a conditional strategy to bridge the gap.
      *   *Key Move:* Introduce the "Bootstrapping Problem" here (see Section 4).
  4.  **The Reality Check (10 mins):** Noise and Generosity.
      *   *Why:* Real biology is noisy. Strict reciprocity fails with noise.
      *   *Key Move:* Distinguish this from Reputation. This is dyadic forgiveness, not public image repair.

  **On your doubt about Assortment:**
  Do not lead with "assortment." For first-years, "assortment" cognitively collapses into "relatedness" (which you just taught) or "grouping" (which sounds like group selection). Frame it as **Partner Fidelity**. It is the same mathematical engine, but the label keeps them from confusing it with Kin Selection. Save the formal "positive assortment" terminology for their third-year theory modules.

  ### 2. The Carrying Example: Constraints

  Since you are a behavioral ecologist, using your own system is high-risk/high-reward. It engages you, but biological systems are messy. If you use a mutualism, you must ensure it doesn't look like an obligate symbiosis (which looks like one organism) or a kin-cluster.

  **What the example MUST have:**
  *   **Distinct Agency:** Two individuals who *could* act independently (rules out obligate mutualism like mitochondria).
  *   **Immediate Temptation:** A clear, short-term benefit to cheating in a single interaction (rules out pure altruism).
  *   **Repeat Encounter Probability:** A biological reason they might meet again (spatial overlap, shoaling, territorial neighbors) without it being guaranteed.
  *   **Dyadic Privacy:** The interaction happens between two, without a "audience" (rules out Reputation/Indirect Reciprocity).

  **What the example MUST lack:**
  *   **High Relatedness:** Avoid systems where neighbors are likely siblings (e.g., nestling feeding).
  *   **Enforced Cooperation:** Avoid systems where cheating is physically impossible (e.g., mechanical locking mechanisms in flowers).
  *   **Third-Party Observation:** Ensure no one else is watching the interaction (keeps the lane clear for next week's lecture).

  **Recommendation:**
  If your system risks implying kinship, use **Predator Inspection in Fish (e.g., Sticklebacks or Guppies)**.
  *   *Why:* Two fish approach a predator. Mutual benefit (information), Individual cost (risk). Cheater hangs back (gets info, less risk). They are in a shoal (high re-encounter probability) but not necessarily kin. It is visual, dyadic, and clearly risky.

  ### 3. Misconceptions: Defusal Strategy

  You listed the big four. Here is where to defuse them, plus the blind spot.

  1.  **"One-shot is a philosopher's fiction."**
      *   *Defusal:* **Minute 10.** Acknowledge it's rare in humans, but common in nature (e.g., two animals meeting for the first time on a range edge). It establishes the baseline selection pressure.
  2.  **"Cooperation is what's good for the group."**
      *   *Defusal:* **Minute 5.** When defining payoffs. Explicitly state: "If this were good for the group, natural selection wouldn't struggle to produce it. The puzzle is that it's *bad* for the individual in the short term."
  3.  **"Tit-for-Tat won, so it's the answer."**
      *   *Defusal:* **Minute 35 (Noise section).** TFT is not evolutionarily stable in noisy environments. It requires refinement (Generous TFT).
  4.  **"Shadow of the Future = Trust."**
      *   *Defusal:* **Minute 20.** Use the word "probability," not "trust." Trust implies psychology; $w$ is an ecological parameter (mortality rate, dispersal rate).

  **The Blind Spot Misconception:**
  *   **"Reciprocity requires cognitive accounting."**
      *   Students will assume animals need to remember past scores and calculate matrices.
      *   *Defusal:* **Minute 30.** Emphasize that these are **evolved heuristics**, not conscious calculations. A "strategy" is a behavioral rule (e.g., "copy last move"), not a spreadsheet.

  ### 4. The "Smuggled" Concepts

  **Can you fit both?** Yes, but they must be framed as *limitations* of the basic model, not new modules.

  1.  **The Bootstrapping Problem (Basin of Attraction):**
      *   *Where:* Immediately after introducing Tit-for-Tat.
      *   *How:* "TFT is stable once common, but how does it invade a population of Defectors? A single cooperator gets exploited immediately."
      *   *Resolution:* Mention kin clustering (briefly, as a launchpad) or spatial structure, then pivot away. This shows you aren't ignoring the invasion problem without derailing into Kin Selection.
  2.  **Noise and Unconditional Retaliation:**
      *   *Where:* The final 10 minutes.
      *   *How:* "What if I try to cooperate but slip? Strict TFT turns a mistake into an endless feud."
      *   *Resolution:* Introduce "Generous Tit-for-Tat" (forgive with some probability). This sets up next week's lecture on Reputation beautifully (forgiveness is easier when you have a reputation to maintain).

  **What to Openly Refuse to Explain:**
  *   **The Math of the ESS Condition:** Do not write $w > (T-R)/(T-P)$ on the board. It freezes first-years. Say: "Cooperation evolves only if the probability of meeting again is high enough to outweigh the temptation to cheat."
  *   **Axelrod's Tournament Details:** Do not discuss the computer tournament history. It dates the material and distracts from the evolutionary logic.

  ### 5. The Closing Question

  You need a question that tests if they understand the *parameters*, not the slogans. Do not ask "What is the Prisoner's Dilemma?"

  **Ask this:**
  > "Imagine a population where cooperation is stable via direct reciprocity. Suddenly, an ecological change doubles the mortality rate of the species (making future encounters much less likely), but the payoffs for cheating vs. cooperating stay exactly the same. What happens to the frequency of cooperation, and why?"

  *   **Correct Answer:** Cooperation collapses.
  *   **Why it works:** It forces them to identify that the *Shadow of the Future* ($w$) is the variable holding cooperation up, not the inherent "goodness" of the strategy or the payoffs themselves. It distinguishes your lecture (Direct Reciprocity/Iteration) from Kin Selection (where $r$ matters) and Group Selection (where group survival matters).
