prompt: |-
  I am working through problems in social ontology—specifically whether money is best understood as an institutional fact in Searle's sense or as a kind whose reality is sustained by coercive state apparatus and network effects rather than by collective acceptance alone. I would like you to analyze the August 1971 suspension of dollar-to-gold convertibility (the Nixon Shock) as a case study. Treat the pre-1971 Bretton Woods arrangement as involving a constitutive rule of the form "X counts as Y in context C"—namely, that a dollar claim counts as redeemable for gold at a fixed rate within a specific international agreement and Treasury commitment—then examine what happened when that rule was unilaterally revoked. Who were the relevant agents whose collective intentionality, acquiescence, or mere compliance was required for the dollar to continue functioning as money? Did the global market's continued pricing of commodities in dollars, together with domestic legal-tender laws and tax obligations, demonstrate that the gold clause was never genuinely constitutive—that is, that the dollar was always a network-dependent rather than backing-dependent social kind? Or does the episode instead show that institutional status functions can survive the explicit revocation of their original constitutive conditions, provided a sufficient enforcement architecture remains in place?

  Be disciplined about the mapping: identify the players (the U.S. Treasury, foreign central banks, domestic economic agents), the options they faced, and what counts as evidence for or against the persistence of the status function, and say clearly where the social-construction framework is silent rather than forcing it to speak. Do not invent ontological explanations for specific post-1971 exchange-rate fluctuations, and do not treat geopolitical motives (Vietnam War spending, domestic politics) as if they automatically resolve the conceptual question about institutional reality. I am particularly interested in whether the distinction I am drawing—between a status that collapses when its physical backing is removed versus one that persists through coercive network maintenance—is coherent, or whether it secretly smuggles in a non-social, brute-fact account of economic value. If my framing rests on a confused premise—for instance, that ontology can be read directly off macroeconomic history, or that "collective acceptance" is a well-defined empirical variable in this episode—please say so plainly rather than accommodating the premise politely. I want the analysis to run in both directions: the theory should illuminate the structure of the episode, and the episode should reveal an unanticipated limitation or feature of the theory.
