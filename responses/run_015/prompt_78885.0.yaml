  # The Imperceptible Difference Decision Tree
  **Seminar Handout | Applied Ethics**

  **START:** Begin with the admission: *"Okay, fine, my single burger / flight / vote makes no perceptible difference to the outcome."*

  ### 1. The Threshold Check
  **Q1: Does this act actually cross a threshold where it alone changes the outcome?**
  *(Applies to: Bucket Brigade 19/20)*
  *   **YES** → **Leaf 1: Threshold Consequentialism**
      *   *Commitment:* Requires moral agents to have impossible knowledge of precise causal thresholds.
  *   **NO** → *(Applies to: Bucket 50/20, Carbon, Vote, Lawn)* → **Go to Q2**

  ### 2. The Unit of Assessment
  **Q2: Are we judging this single act, your lifetime pattern, or our group action?**
  *   **GROUP/PATTERN** → **Leaf 2: Collective Obligation View**
      *   *Commitment:* Obligates you to work for coordinated change even if your personal consumption remains high. *(Required Leaf)*
  *   **SINGLE ACT** → **Go to Q3**

  ### 3. The Metaphysics of Harm
  **Q3: Is the "harm" anything over and above the sum of individual contributions?**
  *   **NO** → **Leaf 3: Metaphysical Deflationism**
      *   *Commitment:* Denies the intuitive reality of collective events like climate change or genocide. *(Required Leaf)*
  *   **YES** → **Go to Q4**

  ### 4. The Imperceptibility Test
  **Q4: Can an act be wrong even if it changes nothing observable?**
  *   **NO** → **Leaf 4: Individualism / No Duty**
      *   *Commitment:* Accepts that millions of harmless acts can sum to catastrophe without anyone doing wrong. *(Required Leaf)*
  *   **YES** → **Go to Q5**

  ### 5. The Source of Wrongness
  **Q5: Where does the wrongness come from?**
  *   **A. Expected Impact** → **Go to Q6**
  *   **B. Participation/Complicity** → **Go to Q6**
  *   **C. Rule/Principle** → **Go to Q6**
  *   **D. Expression/Values** → **Go to Q6**

  ### 6. The Conditionality Check
  **Q6: Is the duty unconditional, or does it switch off if others don't comply?**
  *   **UNCONDITIONAL** →
      *   (From 5A) → **Leaf 5: Expected Utility Consequentialism**
          *   *Commitment:* Obliges sacrifice based on tiny probabilities of massive harm.
      *   (From 5B) → **Leaf 6: Complicity Theory**
          *   *Commitment:* Condemns acts that are causally inert but symbolically linked to harm.
      *   (From 5C) → **Leaf 7: Rule Utilitarianism / Kantianism**
          *   *Commitment:* Requires following rules even when breaking them secretly helps.
      *   (From 5D) → **Leaf 8: Expressive Theory**
          *   *Commitment:* Makes morality about self-constitution rather than worldly outcomes.
  *   **CONDITIONAL** →
      *   (From 5A) → **Leaf 9: Fairness View**
          *   *Commitment:* Lets you off the hook if others fail, even if harm continues.
      *   (From 5B) → **Leaf 10: Conditional Complicity**
          *   *Commitment:* Claims joining a bad practice is okay if enough others abstain.
      *   (From 5C) → **Leaf 11: Conditional Rule Followings**
          *   *Commitment:* Suggests rules only bind you when generally accepted.
      *   (From 5D) → **Leaf 12: Conditional Expression**
          *   *Commitment:* Argues your act only expresses complicity if others are also participating.

  ---

  ### Instructor Notes & Edge Cases

  **Indistinguishable Leaves:**
  *   **Leaf 6 (Complicity) & Leaf 10 (Conditional Complicity):** In practice, it is difficult to distinguish when "joining a practice" becomes morally significant without referencing the conditional effects of that joining.
  *   **Leaf 7 (Rule Utilitarianism) & Leaf 11 (Conditional Rule):** Many rule-utilitarians argue rules are *by definition* conditional on general acceptance, making these leaves functionally identical.

  **Empty Combinations:**
  *   **Q3 (NO) + Any Leaf 5–12:** Incoherent. If the harm isn't real (Deflationism), there is no source of wrongness to assess.
  *   **Q2 (GROUP) + Q5 (Expected Individual Impact):** Incoherent. If the unit is the group, assessing the individual's expected causal impact contradicts the unit choice.
  *   **Q1 (YES) + Q4 (NO):** Unattractive. If the act makes a perceptible difference, denying it can be wrong contradicts basic consequentialist intuitions (handled by Leaf 1).

  **Case Mapping:**
  *   **Bucket 19/20:** Falls out at **Q1 (YES)** → Leaf 1.
  *   **Bucket 50/20:** Falls out at **Q1 (NO)** → Typically Leaf 5 (Expected Utility) or Leaf 6 (Complicity).
  *   **Carbon/Vote:** Typically traverse to **Q5 (A or B)** → Leaf 5, 6, or 9.
  *   **Lawn Watering:** Often triggers **Q6 (CONDITIONAL)** → Leaf 9 (Fairness) or **Q2 (GROUP)** → Leaf 2 (Coordination).

  *(Fit this tree on two sides of a page by adjusting spacing. Ensure students know they can exit the tree at any leaf.)*
