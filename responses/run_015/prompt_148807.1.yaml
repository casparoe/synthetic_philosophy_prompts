  **Arthur:** Maybe those are the same thing. To perform infinite operations in finite time is to destroy the system's ability to maintain a state. The contradiction Thomson found—"it can't be on, it can't be off"—is just the logical shadow of physical decoherence. The logic says "undefined," the physics says "decohered." They're pointing at the same boundary.

