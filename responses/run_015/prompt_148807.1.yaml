  **Arthur:** We don't say it's contradictory because it's static. A set just *is*. A supertask is dynamic. It involves change. Changing a state infinitely many times requires a metric of change that breaks down. In your quantum example, if the flips are probabilistic, the variance might not even converge. You could end up with a distribution that doesn't settle. Then you don't even have a "50/50" answer. You have no answer.

