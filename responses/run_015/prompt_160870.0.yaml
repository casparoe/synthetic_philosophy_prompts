  The reason your solution faces resistance is that you are effectively arguing that the evidence says nothing whatsoever about the hypothesis, but in a finite conjunction, every conjunct matters. If the hypothesis is Raven 1 is black and Raven 2 is black and so on, checking a non-black object tells you that this object is not one of the ravens in that list, which is consistent with the hypothesis. The paradox is not really about the cardinality of the universe but about our intuitions regarding what counts as relevant evidence. Most contemporary philosophers resolve this using Bayesian confirmation theory, which agrees with your intuition that the confirmation is vanishingly small but disagrees that it is zero. In a Bayesian framework, observing a green apple updates the probability of the hypothesis because it slightly reduces the probability that there are unobserved non-black ravens, assuming you have some prior distribution over the possible states of the world.

  Regarding your question about why this is still treated as an open problem, it is largely because the paradox exposes deep tensions in how we understand scientific laws and projectibility. Scientists do treat laws as applying to unobserved cases, effectively treating them as infinite generalisations regardless of the actual finite number of instances, because the goal is to predict future events or counterfactual situations. If we restrict hypotheses only to known finite instances, we lose the ability to make predictions about ravens we have not yet encountered, which is the primary utility of scientific laws. The paradox persists in literature because it forces us to clarify whether confirmation is about logical entailment, probabilistic updating, or something else entirely, and there is still no universal consensus on the best framework for confirmation.

