  ### Audit of Commemoration Principles and Verdicts

  This audit examines the internal coherence of your eight commitments and their application to the three live items. It identifies contradictions, distinguishes them from mere distinctions, and tests the verdicts against the principles.

  #### 1. Genuine Tensions (Ranked by Severity)

  **1. Commitment (h) vs. Verdict 3 (Workhouse Burial Block)**
  *   **The Tension:** Commitment (h) asserts a duty to the dead that exists independently of the living ('whether or not the living take any interest'). Verdict 3 justifies moving the marker precisely because the living have no interest ('Nobody has objected').
  *   **Severity:** Critical. This is a direct logical contradiction. You cannot claim a duty is independent of living interest and then use the lack of living interest as the justification for acting against that duty.
  *   **What must give:** Either (h) must be qualified to admit that practical necessity or living indifference can override the duty, or Verdict 3 must be reversed.
  *   **Cheapest Revision:** Qualify (h) to read: 'Commemoration can be something owed... provided it does not impede essential public use.'
  *   **Cost:** This weakens the moral protection for the forgotten dead, turning a right into a preference that can be outvoted by convenience.

  **2. Commitment (e) vs. Verdict 2 (Verrill Street)**
  *   **The Tension:** Commitment (e) states that renaming is a 'poor currency for redress'. Verdict 2 argues for renaming explicitly 'in the language of redress' and as 'part of what they are owed'.
  *   **Severity:** High. You are employing a currency you have declared debased. In a public meeting, opponents will quote (e) back to you to dismantle your argument for Verdict 2.
  *   **What must give:** Either (e) must be amended to allow for restoration of names as a specific exception, or Verdict 2 must be re-argued on grounds other than redress (e.g., historical accuracy).
  *   **Cheapest Revision:** Amend (e) to distinguish between *new* naming (labeling) and *restoring* a suppressed name (corrective justice).
  *   **Cost:** This blurs the sharp distinction you draw between statues (honour) and names (labels), potentially opening street names to the same moral scrutiny as monuments.

  **3. Commitment (g) vs. Commitment (h)**
  *   **The Tension:** Commitment (g) grants the present public 'final say' with 'no constraint'. Commitment (h) imposes a constraint ('owed') that binds the present public regardless of their interest.
  *   **Severity:** Medium. This is a theoretical conflict between democratic sovereignty and moral duty. It is manageable if (h) is viewed as a moral guide for the exercise of (g), but it becomes critical if the public votes to ignore the dead.
  *   **What must give:** (g) needs to acknowledge that democratic authority is exercised within moral bounds.
  *   **Cheapest Revision:** Add to (g): '...subject to minimal moral duties owed to the dead.'
  *   **Cost:** It complicates the clean authority of the panel, inviting debate over what constitutes a 'moral duty'.

  #### 2. Apparent Tensions (Dissolve on Inspection)

  **Commitment (a) vs. Commitment (b)**
  *   **Why it dissolves:** These are not in conflict; they are mutually reinforcing. (a) defines the *nature* of the statue (honour), and (b) defines the *source of its meaning* (original intention). Together, they argue that a statue honours specifically what its erectors intended to honour. This strengthens your case against 'harmless landmark' arguments.

  **Commitment (c) vs. Verdict 1 (Miriam Ashby)**
  *   **Why it dissolves:** Commitment (c) protects figures admired 'by the lights of their own time'. Your case notes for Verdict 1 specify that 'a minority of her colleagues said so at the time and were overruled'. Because the honour was contested *at the time*, Ashby does not qualify for the protection of (c). You are not grading her by present standards; you are grading her by the dissenting standards of her own time. This verdict is consistent with the principle.

  **Commitment (a) vs. Commitment (e)**
  *   **Why it dissolves:** This is a deliberate categorical distinction, not a conflict. You are arguing that statues function as honour (a) while names function as labels (e). As long as you maintain this distinction, the different treatments (removal vs. renaming) are logically consistent.

  #### 3. Testing the Set Against the Cases

  **Case 1: Miriam Ashby Statue**
  *   **Verdict:** Remove.
  *   **Audit:** **Consistent.** The removal is justified by (a) (it is an honour), (b) (the intention was to honour the technique), and (d) (removal over reinterpretation). Crucially, it bypasses the trap of (c) because the contemporary objection means she was not universally admirable by the lights of her own time.

  **Case 2: Verrill Street**
  *   **Verdict:** Rename (Restore pre-1899 name).
  *   **Audit:** **Inconsistent.** Your argument relies on redress ('part of what they are owed'). Commitment (e) explicitly states renaming is a 'poor currency for redress'. You cannot hold (e) and argue Verdict 2 as written. You are vulnerable to the charge that you are using an administrative label to perform a moral function you have deemed unsuitable.

  **Case 3: Workhouse Burial Block**
  *   **Verdict:** Move.
  *   **Audit:** **Inconsistent.** Your verdict relies on the absence of living objection ('Nobody has objected'). Commitment (h) explicitly states the duty exists 'whether or not the living take any interest'. By moving the block for a path, you are prioritising living convenience over the duty owed to the dead, directly violating (h).

  #### 4. Single Revision and Consequence

  If a single revision would clean up the most, it is to **Commitment (h)**.

  Currently, (h) is an absolute moral claim ('The dead can be wronged... whether or not the living take any interest'). This is the most ethically significant principle in your set, but it is also the one you are most clearly violating in Verdict 3. It is easier to defend a principle than a contradiction.

  **The Revision:**
  Qualify (h) to acknowledge practical constraints. For example: *'Commemoration can be something owed... provided it does not prevent essential public use or safety.'*

  **The Consequence:**
  If you make this revision to align the principle with the reality of council business, **Verdict 3 (Workhouse Burial Block) stands**, but you must accept that your protection for the dead is now conditional.

  However, if you wish to maintain the moral integrity of the set without qualification, you must instead **change Verdict 3**. If (h) remains absolute, you cannot move the block for a mere path. You would have to rule that the block stays, and the path is rerouted. This is the verdict that will surprise people anyway, as councils rarely prioritise pauper graves over infrastructure, but it is the only verdict that honours your commitment to the forgotten dead.
