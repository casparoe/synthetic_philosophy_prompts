answer: |-
  This is a profound operational challenge. You are asking for a heuristic that bridges the gap between high-level moral philosophy (idealized autonomy, critical interests) and the gritty reality of a 90-minute hospital panel. You are also correctly identifying the metaphysical fault line: the difference between *correcting* a will and *constructing* one.

  Below is the **Idealized Will Protocol (IWP)**. It is designed to be printed and placed in front of the six panel members. It incorporates your distinctions on extrapolation and symmetry, marks the epistemic status of each step, and forces the "stop" or "refer" decisions you requested.

  Following the protocol, I have applied it to your three cases and provided an epistemic post-mortem on where the ground is solid and where it is sand.

  ***

  # The Idealized Will Protocol (IWP)
  **For use by Supported-Decision-Making Panels**

  **Purpose:** To determine whether a current refusal of care can be overridden based on the will the person *would* hold under corrected conditions.
  **Time Allocation:** 40 minutes for deliberation.
  **Authority:** This procedure does not create law. It structures reasoning for the Clinical Director or Judge.

  ### Step 1: Identify the Defect (The Subtractive Test)
  **Question:** What specific, identifiable factor is currently distorting the person's decision-making?
  **Options:** A false belief (delusion), unmanaged pain, a coercive threat, a specific fear (e.g., water temperature), or lack of specific information.

  *   **Sufficient Answer:** A specific factor linked to clinical evidence or testimony (e.g., "Belief that medication is poison," "Fear of hot water").
  *   **No Answer / Vague Answer:** "They are confused," "They are ill," "They don't understand." (These describe states, not specific defects).
  *   **Action:**
      *   If **No Answer**: **STOP.** Return recommendation: **No Override.** (You cannot correct an unspecified error).
      *   If **Sufficient Answer**: Proceed to Step 2.
  *   **Status:** **Settled.** (Consensus that specific defects deform will).
  *   **Type:** **Genuine Constraint.**

  ### Step 2: The Subtractive Extrapolation
  **Question:** If we remove *only* that specific defect (e.g., correct the false belief, remove the pain), is there evidence the person would consent?
  **Evidence Required:** A prior statement, a pattern of behavior when well, or a logical necessity (e.g., if they knew the pill wasn't poison, they would take it to avoid detention).

  *   **Sufficient Answer:** "Yes, when the delusion remitted previously, they took the meds," or "They only resist when the water is hot."
  *   **No Answer:** "We assume they would," "It seems rational that they would."
  *   **Action:**
      *   If **No Answer**: Proceed to Step 3 (This moves from Subtractive to Additive).
      *   If **Sufficient Answer**: Proceed to Step 4 (Symmetry Check).
  *   **Status:** **Contested.** (Disagreement on whether removing a defect reveals a 'true' will or just a different preference).
  *   **Type:** **Judgment Call.**

  ### Step 3: The Additive Extrapolation (Traceability Test)
  **Question:** If we must supply a capacity, experience, or value they currently lack (e.g., "understanding of long-term health," "valuing hygiene over comfort"), is that new value **traceable** to something this person has actually said, done, or cared about in the past?

  *   **Sufficient Answer:** "Yes, she was a nurse for 40 years (hygiene is a core value)," or "He signed a crisis card valuing recovery over comfort."
  *   **No Answer:** "Yes, because any reasonable person would value life," "Yes, because it is in their best interests." (These import *panel* values, not *patient* values).
  *   **Action:**
      *   If **No Answer**: **STOP.** Return recommendation: **No Override.** (You are substituting your will for theirs).
      *   If **Sufficient Answer**: Proceed to Step 4.
  *   **Status:** **Highly Contested.** (This is the core philosophical dispute: can we construct a will from fragments?).
  *   **Type:** **Genuine Constraint.** (Do not bypass this).

  ### Step 4: The Symmetry Check (Panel Bias Audit)
  **Question:** We have defined "Ideal Conditions" (e.g., calm, informed, pain-free). If we reversed one of these conditions (e.g., "hurried but safe," "uninformed but comfortable"), would our conclusion flip?
  **Requirement:** Each panel member must state one "Ideal Condition" they are relying on.

  *   **Sufficient Answer:** "We all agree that 'freedom from delusion' is the key condition. Changing 'comfort' wouldn't change the result."
  *   **No Answer / Divergence:** Member A says "Understanding statistics" is key; Member B says "Emotional stability" is key. If swapping these changes the outcome.
  *   **Action:**
      *   If **Divergence**: **REFER UPWARD.** (This is a value disagreement, not a factual one. The panel cannot resolve it).
      *   If **Sufficient Answer**: Proceed to Step 5.
  *   **Status:** **Settled Methodology.** (Bias checking is standard; applying it to 'ideal conditions' is novel but robust).
  *   **Type:** **Genuine Constraint.**

  ### Step 5: The Final Recommendation
  **Question:** Does the "Corrected Will" outweigh the "Current Will" given the risk of harm?

  *   **Action:**
      *   If Steps 1-4 passed: **Recommend Override.**
      *   If Step 4 failed: **Refer to Ethics Committee / Court.**
      *   If Steps 1 or 3 failed: **Recommend No Override.**
  *   **Status:** **Contested.** (Weighing risks is always a value judgment).
  *   **Type:** **Judgment Call.**

  ***

  # Failure Modes (Where the IWP Misfires)

  1.  **The "New Person" Problem:** In advanced dementia or radical personality change (e.g., frontal lobe injury), there may be *no* traceable past values. Step 3 will force a "No Override" even if care is obviously needed. **Fix:** This procedure is for *overrides of refusal*, not for initiating care where no will exists. If no will exists, revert to "Best Interests" (statutory test), not this protocol.
  2.  **The "Rational Suicide" Problem:** If a person consistently values death over disability (Case 3), Step 3 may validate their refusal. The procedure cannot distinguish between a "noble value" and a "symptom" without importing panel bias.
  3.  **Evidence Scarcity:** If the patient has no history, no family, and no prior statements, Step 3 fails. The procedure defaults to "No Override." This is safer ethically but may be clinically dangerous.

  ***

  # Application to Cases

  ### Case 1: The Psychotic Relapse (34M, Clozapine)
  *   **Step 1 (Defect):** Delusion that medication is poison. (Sufficient).
  *   **Step 2 (Subtractive):** If we remove the belief "this is poison," would he take it? Evidence: He signed a crisis statement during remission authorizing this. He explicitly stated his "frightened self" should not be believed. (Sufficient).
  *   **Step 3 (Additive):** Not needed. We are subtracting a false belief, not adding a new value.
  *   **Step 4 (Symmetry):** Panel agrees "freedom from delusion" is the ideal condition. Reversing this (keeping the delusion) keeps the refusal. No flip. (Sufficient).
  *   **Step 5:** **Recommendation: Override.**
  *   **Note:** The current claim ("doctors lied") is itself part of the relapse pattern. The traceable chain from the remission self is strong.

  ### Case 2: The Dementia & Washing (78F, Alzheimer's)
  *   **Step 1 (Defect):** Fear/Pain. Notes show resistance is specific to hot water and one staff member. (Sufficient).
  *   **Step 2 (Subtractive):** If we remove hot water and change the staff, would she resist? Evidence: She only resists under those specific conditions. (Sufficient).
  *   **Step 3 (Additive):** Not strictly needed, but if we argue she "values hygiene," is it traceable? Yes, 40 years as a district nurse. (Sufficient).
  *   **Step 4 (Symmetry):** Panel agrees "comfort during washing" is the ideal condition. (Sufficient).
  *   **Step 5:** **Recommendation: Override (with conditions).**
  *   **Constraint:** The override is only valid *if* the water is cooled and the staff member is changed. If the trust cannot guarantee this, the procedure reverts to **No Override**.

  ### Case 3: The Anorexia (29M, Starvation)
  *   **Step 1 (Defect):** Distorted body image (believes he is fat when emaciated). (Sufficient).
  *   **Step 2 (Subtractive):** If we correct the body image (he sees he is thin), does he eat? **Unknown.** He states he would "rather die than gain weight." The refusal is based on a *value* (thinness/control), not just a *perception* (I am fat). Removing the perceptual defect does not necessarily remove the value-based refusal. (No Answer).
  *   **Step 3 (Additive):** To override, we must supply the value "Health/Life > Thinness." Is this traceable? He has a daughter he loves. One could argue "being a father" is a traceable value that requires life. *However*, he has explicitly weighed this ("I love her but I'd rather die"). To prioritize the daughter over his stated hierarchy is to **import a panel value** (that parenting duty trumps personal autonomy).
      *   **Result:** **No Answer.** (We cannot trace the "Life > Thinness" value without contradicting his explicit, long-standing ranking).
  *   **Step 4 (Symmetry):** Panel will likely split. Clinicians see "Anorexia" as a disease (Defect). Lawyers/Ethicists may see "Refusal" as a right (Value). If we define the condition as "Mental Health Treated," we override. If we define it as "Capacity Intact," we do not.
      *   **Result:** **Divergence.**
  *   **Step 5:** **Recommendation: REFER UPWARD / No Override.**
  *   **Why you might dislike this:** The procedure identifies that overriding him requires asserting that his *values* are the defect, not just his beliefs. Since his values are traceable (long-standing, articulate), Step 3 blocks the override. The procedure prioritizes the integrity of the will over the preservation of life when the two are in explicit conflict and capacity is legally intact.

  ***

  # Epistemic Post-Mortem: What is Solid, What is Sand

  You asked me to mark where the ground is firm and where it is contested. Here is the breakdown for your panel.

  ### 1. The Existence of Deformed Preferences
  *   **Status:** **Settled.**
  *   **Consensus:** Almost all ethicists and legal scholars agree that coercion, ignorance, pain, and delusion can deform a will. A wish expressed under torture or psychosis is not treated as authentic.
  *   **Panel Authority:** You are on solid ground here. Step 1 is robust.

  ### 2. The Existence of a "True" Will
  *   **Status:** **Genuinely Contested.**
  *   **The Dispute:** Philosophers like Ronald Dworkin (critical interests) argue there is a deeper truth about what benefits a life. Others (like some disability rights advocates or strict libertarians) argue there is only the *current* will. To say there is a "fact of the matter" about what he *would* want is metaphysical speculation.
  *   **Panel Authority:** You are constructing a proxy, not finding a fossil. Step 2 and 3 rely on a fiction (the "idealized self") that is useful but not ontologically real. **Do not let the clinicians speak as if they know what the patient 'really' wants.** They are making a prediction.

  ### 3. The Traceability Constraint (Step 3)
  *   **Status:** **Contested but Necessary.**
  *   **The Dispute:** Some "Best Interests" frameworks allow the state to impose objective goods (life, health) regardless of past values. Your procedure forbids this.
  *   **Panel Authority:** This is your ethical firewall. If you drop this, you are no longer respecting autonomy; you are practicing paternalism. Step 3 is the hardest step to pass, and that is a feature, not a bug.

  ### 4. The Symmetry Check (Step 4)
  *   **Status:** **Settled Methodology, Novel Application.**
  *   **Consensus:** Bias checking is standard in science and law. Applying it to "ideal conditions" is rare in clinical panels but logically sound.
  *   **Panel Authority:** This is your protection against "groupthink." If the panel cannot agree on what "better conditions" look like, they have no business overriding a will.

  ### Final Advice to the Geochemist
  You are correct to be skeptical of the "determinate fact" of the ideal will. There is no such fact. There is only a **best-supported hypothesis**.

  *   **Case 1** works because the hypothesis (he wants treatment) is supported by direct evidence (the crisis card).
  *   **Case 2** works because the defect is physical/environmental, not existential.
  *   **Case 3** fails because the hypothesis (he wants to live) contradicts the direct evidence (he says he prefers death).

  If you hand this procedure to your panel, it will likely reduce the number of overrides. It will force you to say "We don't know" more often. That is the cost of taking autonomy seriously. If the panel finds this too restrictive, they are admitting they prefer safety to self-determination. That is a political choice, not an ethical discovery. The procedure forces that choice into the light.
