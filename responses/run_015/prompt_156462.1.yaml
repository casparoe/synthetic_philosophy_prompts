      *   *Risk of Collapse:*
          *   If the criminal referral is never used, is it just amnesty with extra steps?
          *   If the criminal referral is triggered easily, does it discourage the initial disclosure?
          *   Does "permanent exclusion from leadership" count as meaningful punishment if they remain members?
      *   *Defense:* It creates a "probationary" moral status. It prioritizes *truth* as a form of justice (veritative justice) while maintaining a sword of Damocles (the threat of referral).

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the gravity and complexity. Validate the user's position (it's a classic transitional justice dilemma).
      *   **Philosophical Frameworks:**
          *   *Retribution vs. Recovery:* Define the tension.
