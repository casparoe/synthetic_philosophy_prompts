answer: |-
  This is a profound institutional dilemma that mirrors the challenges faced by nations emerging from authoritarian rule or corporations navigating systemic fraud. You are grappling with a classic tension in **transitional justice**: the trade-off between *truth* (knowledge necessary for repair) and *justice* (punishment necessary for accountability).

  Your worry that the hybrid approach might be incoherent is philosophically astute. However, it does not necessarily collapse into pure amnesty or pure retribution. Instead, it occupies a distinct ethical category often referred to as **conditional leniency** or **restorative accountability**. Below is an analysis of the moral considerations governing this bargain and an evaluation of the defensibility of your proposed middle course.

  ### 1. The Competing Moral Frameworks

  To understand the stakes, we must first articulate the ethical claims of the two opposing factions.

  **The Retributive Claim (Faction 1)**
  *   **Core Principle:** *Just Deserts.* Wrongdoing creates a moral debt that must be paid through suffering or sanction.
  *   **The Argument:** Immunity commodifies justice. By selling information for leniency, the institution treats the law and its own bylaws as negotiable commodities. This undermines the normative authority of the cooperative. If rules can be suspended for utility, they are not rules but suggestions.
  *   **The Risk:** "Blood Money." Information gained through a bargain may be viewed as illegitimate, and failing to punish may signal to future bad actors that fraud is a calculable risk rather than a moral boundary.

  **The Consequentialist Claim (Faction 2)**
  *   **Core Principle:** *Harm Reduction and Fiduciary Duty.* The primary obligation of the oversight committee is to the survival of the cooperative and the welfare of its members (current and future).
  *   **The Argument:** Punishment is a tool, not an end. If punishment prevents the recovery of funds or the identification of remaining risks, it is malpractice. The "justice" served by imprisoning the administrator is outweighed by the "injustice" of members losing their savings due to pride.
  *   **The Risk:** Moral Hazard. This creates a "get out of jail free" card for sophisticated fraudsters who can hold the institution hostage with hidden information.

  ### 2. The Hybrid Approach: Is It Coherent?

  Your proposed middle course involves three elements:
  1.  **Full Disclosure** (The quid).
  2.  **Non-Expulsive Sanctions** (Restitution, leadership bans, public acknowledgment).
  3.  **Suspended Prosecutorial Discretion** (Criminal referral reserved for falsehoods).

  **Does it collapse?**
  It collapses *only if* the conditions are unenforceable or the sanctions are meaningless. If the "reserved right" to refer criminally is a bluff, the position is simply amnesty with extra steps. However, if the conditions are robust, this approach is philosophically distinct. It aligns with **Restorative Justice**, which posits that the goal of responding to harm is not merely to punish the offender but to repair the harm and reintegrate the offender under strict conditions.

  **Why it is defensible as a distinct position:**
  *   **It prioritizes Veritative Justice:** This is the justice of truth. In many post-conflict frameworks (e.g., South Africa's Truth and Reconciliation Commission), full public disclosure was valued as a form of justice in itself, sometimes outweighing carceral punishment. By forcing a public acknowledgment and a complete ledger, you are establishing a historical record that prevents gaslighting or revisionism.
  *   **It distinguishes Organizational vs. State Justice:** The committee controls membership and leadership status; the state controls criminal liberty. Your hybrid model asserts organizational authority (banning from leadership, demanding restitution) while acknowledging the limits of the committee's power over criminal law. You are not granting *legal* immunity (which you likely cannot do); you are granting *organizational* leniency contingent on cooperation.
  *   **It creates a "Probationary" Moral Status:** The wrongdoers are not absolved; they are placed in a state of conditional standing. Their continued avoidance of criminal referral is contingent on the veracity of their disclosure. This maintains the moral weight of the sanction without foreclosing the practical utility of the information.

  ### 3. Key Philosophical Considerations for the Committee

  If you pursue the hybrid path, you must address four specific ethical vulnerabilities to ensure the position remains coherent.

  **A. The Coercion Variable (The Trustees)**
  Lumping the administrator and the three trustees together is morally risky.
  *   **The Administrator:** Is the architect of the fraud. Trading immunity for his info is a utilitarian calculation.
  *   **The Trustees:** Claim coercion. If true, they are victims of the administrator *and* perpetrators of negligence. Granting them immunity might be unjust to the members, but punishing them equally with the administrator violates proportionality.
  *   **Consideration:** A defensible hybrid approach might require differentiating the two. The administrator trades info for leniency; the trustees might require a separate review of their "coercion" claim. If they were truly coerced, they may deserve organizational protection, not immunity. If they were negligent, they deserve sanction regardless of the administrator's deal.

  **B. The Credibility of the Threat**
  For the "reserved right to pursue criminal referral" to hold moral weight, it must be credible.
  *   **The Dilemma:** If you refer them later, you break the spirit of the bargain, potentially discouraging future whistleblowers. If you never refer them, the threat was a lie.
  *   **The Fix:** The bargain must be explicit: "We agree not to refer *provided* the information is complete and truthful." This is not a retroactive breach of contract; it is the triggering of a contingency clause. This preserves the integrity of the agreement.

  **C. The Nature of Restitution**
  Restitution is the bridge between retribution and recovery.
  *   **Consideration:** Mere repayment of stolen funds is not punishment; it is the return of property. For the hybrid model to satisfy the retributive instinct, the "sanction" must exceed the return of capital. This could mean financial penalties, forfeiture of equity, or permanent loss of voting rights. Without this "extra" cost, the wrongdoers suffer no loss, and the model collapses into amnesty.

  **D. Institutional Integrity vs. Civic Duty**
  *   **Consideration:** Does the cooperative have a moral duty to the broader legal order? By withholding criminal referral, you are effectively privatizing justice.
  *   **Defense:** You can argue that your primary fiduciary duty is to the cooperative's survival. However, you must acknowledge that some crimes (like forgery and embezzlement) are *mala in se* (wrong in themselves) and harm the public trust, not just the members. The hybrid model works best if framed as "deferring" referral to allow for recovery, rather than "waiving" it permanently.

  ### 4. Recommendation for Implementation

  The hybrid approach is defensible, but only if structured to avoid the appearance of a sham. To maintain moral coherence:

  1.  **Formalize the Contingency:** The agreement must state clearly that criminal referral is waived *only so long as* the disclosure remains verified as complete. If new evidence emerges that they withheld information, the waiver is void. This makes the leniency earned, not given.
  2.  **Differentiate the Trustees:** Do not grant the trustees the same immunity as the administrator without an independent verification of their coercion claims. If they were negligent, they should face organizational sanctions even if the administrator confesses.
  3.  **Ensure "Pain" in the Sanction:** Permanent exclusion from leadership is good, but consider permanent exclusion from *profit-sharing* or voting. If they remain full members in good standing after stealing from the pool, the moral message is diluted.
  4.  **Public Transparency:** The "public acknowledgment" must be detailed. The shame of the exposure serves as a non-carceral punishment.

  ### Conclusion

  Your intuition that the hybrid approach is the most viable path is supported by the philosophy of **restorative justice**. It does not collapse into incoherence provided that the "suspended sanctions" are not a bluff.

  The moral logic holds this shape: *Justice is not solely punishment; justice is also the restoration of the violated order.* If punishment prevents restoration, it becomes its own form of harm. By trading limited organizational leniency for the truth required to restore the cooperative, you are prioritizing the health of the community over the satisfaction of vengeance, while keeping the sword of the law suspended above them to ensure their honesty.

  This is not a compromise of principle, but a calibration of it. It acknowledges that in the aftermath of institutional collapse, the "perfect" justice of total punishment may result in the "total" injustice of a dead cooperative.
