          6.  What would a registration system based on a genuinely compositional or anti-essentialist view look like?

  2.  **Analyze the Metaphysical Underpinnings (Question 1 & 2):**

      *   *Ship of Theseus:* This is the classic problem.
      *   *Legal Practice:* The law treats the Frame/VIN as the *locus of identity*.
      *   *Metaphysical Theory:* This looks like **Constitutionalism** or **Essentialism** regarding a specific part. Specifically, it treats the frame as the *substratum* or the *essential core*.
      *   *Is it strict metaphysical essentialism?* Probably not in the Aristotelian sense (the "soul" of the truck), but it functions as a **Legal Essentialism**. It posits that $x$ at $t_1$ is identical to $y$ at $t_2$ if and only if they share the same Frame/VIN.
      *   *Mereology:* It rejects the idea that identity is determined by the majority of parts (quantitative) or functional organization (qualitative). It picks one specific part as necessary and sufficient.

  3.  **Analyze Alternative Metaphysical Views (Question 3):**

      *   *Four-Dimensionalism (Perdurantism):* Objects are space-time worms. A "truck" is a temporal series of truck-stages.
          *   *Can it explain the frame rule?* Yes, if we define the "genidentity" (continuity relation) of truck-stages by frame-continuity. The law is essentially defining the *genetic relation* that binds the temporal slices. It doesn't claim the frame is metaphysically magical, just that it's the chosen criterion for tracing the worm.
      *   *Relational/Social Constructivism:* Objects are defined by social practices.
          *   *Can it explain the frame rule?* Yes, perfectly. The identity is conferred by the DMV, not discovered in nature. The frame is just the hook the bureaucracy hangs the identity on.

  4.  **Evaluate Internal Consistency (Question 4):**

      *   *The Tension:* Frame + New Parts = Same. New Frame + Old Parts = Different.
      *   *Intuition:* The second case (New Frame + Old Parts) feels more like the "original" truck functionally and materially.
      *   *Legal Logic:* The law prioritizes *traceability* and *uniqueness* over material continuity. The VIN is an indexical marker.
      *   *Consistency:* It is internally consistent *within its own axioms* (Identity = VIN), but inconsistent with *mereological common sense* (Identity = Majority of Parts/Function). It's axiomatic consistency vs. intuitive consistency.

  5.  **Assess Coherence vs. Bureaucratic Convenience (Question 5):**

      *   *Bureaucratic Convenience:* High. VINs are hard to forge (ideally), frames are hard to swap without detection. It prevents theft (chopping stolen trucks and putting them on new frames).
      *   *Philosophical Coherence:* Low, if viewed as a claim about the *true nature* of trucks. High, if viewed as a *stipulative definition* for administrative tracking.
      *   *Verdict:* It's a pragmatic solution to a tracking problem, disguised as metaphysical identity. It's "operational coherence" rather than "ontological coherence."

  6.  **Design an Alternative System (Question 6):**

