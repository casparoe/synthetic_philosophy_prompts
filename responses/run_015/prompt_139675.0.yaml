answer: |-
  1. The project asks whether the tracking-deficiency test uniquely satisfies the neutrality constraint required for institutional intervention where historical and error tests fail, and whether it can legitimately authorize discounting preferences in well-being measurements without collapsing into the skepticism or unlimited paternalism that paralyzes policy makers in contemporary discourse. It seeks a rigorous determinate answer on whether an agent's own classification of irrelevance provides a stable foothold for criticism avoiding contested conceptions of substantive justice, thereby offering a way forward for theorists.

  2. Existing philosophical positions leave this currently open because they treat bias as a unitary property rather than distinguishing its distinct roles in well-being, consent, aggregation, and criticism, thereby demanding a single test where proper functional separation is required. This major conflation forces public institutions to either violate neutrality by invoking contested justice claims or retreat into skepticism, leaving the specific normative work each test should perform unresolved and the debate effectively stalled for years.

  3. Quarter one detailed reconstructs the four tests and their entailment relations to establish the conceptual logical landscape; quarter two models the neutrality constraint against real-world institutional case studies like hospital ethics committees and state benefits administrators. Quarter three tests tracking-deficiency for collapse into skepticism by empirically analyzing agent second-order judgments about irrelevance; quarter four maps the valid tests to their specific practical normative jobs to determine which bias discounts which preference in practice.

  4. A definitive positive result looks like a workable stable taxonomy where tracking-deficiency handles well-being without violating neutrality, demonstrating that public institutions can criticize preferences without adjudicating justice. Clear Failure means proving that any second-order judgment about irrelevance inevitably smuggles in contested justice claims, showing that the philosophical apparatus collapses into either moral skepticism about bias or unlimited state paternalism regardless of the available specific test employed.

  5. I exclude normative comprehensive theories of justice to focus strictly on the methodological epistemology of preference within strictly neutral institutions, ensuring the project remains finite while resolving the urgent practical deadlock in public policy application. This restriction is necessary to deliver a robust working framework for key institutional actors within one year, even if it leaves the fundamental ultimate grounding of justice for another inquiry, because the immediate need is operational procedural clarity.
