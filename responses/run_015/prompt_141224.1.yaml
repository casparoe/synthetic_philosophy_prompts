  **Exam Question: The Two-Branch Exchanger Case**

  **Time Allowed:** 90 Minutes
  **Word Limit:** None (Manage your time to cover all parts of the prompt)

  **Prompt:**

  Consider the **Two-Branch Exchanger Case**. Omega flips a fair coin. 
  *   **Heads Branch:** Omega asks you to pay $1,000. If you pay, Omega gives you $1,000,000. If you refuse, you receive $0. Omega's offer is contingent on its prior prediction of your decision function's output in the *Tails* branch; Omega only honors the reward on Heads if it predicted you would Pay in the Tails branch.
  *   **Tails Branch:** You receive an XOR blackmail letter. The letter was sent if and only if exactly one of the following is true: (i) you have a rare disease; (ii) your decision function outputs "Pay" upon receiving the letter. If you have the disease and refuse to pay, the blackmailer reveals it (costing you $1,000,000). If you pay, they remain silent. If you do not have the disease, revealing the secret costs you nothing, but paying still costs $1,000. The prior probability of the disease is 50%.

  You are told you are in the Heads Branch. You know you possess a single, fixed decision function that maps evidence to action. Omega and the Blackmailer have perfectly simulated this function for both branches.

  Write an essay that addresses the following:
  1.  Specify the action taken in *each* branch by an agent using Causal Decision Theory (CDT), Evidential Decision Theory (EDT), and Functional Decision Theory (FDT).
  2.  Explain why the strategy of "Pay Omega on Heads, Refuse Blackmailer on Tails" is intuitively optimal but structurally unavailable (or catastrophically costly) for a single decision function in this specific case.
  3.  Discuss what this case demonstrates about the difference between evaluating a physical act in isolation versus evaluating the output of a decision function.

  ***

  **Model Answer**

  In the Two-Branch Exchanger Case, the divergence between decision theories arises from how they handle logical correlations across counterfactual branches. A Causal Decision Theory (CDT) agent evaluates actions based solely on their causal consequences. In the Heads Branch, CDT refuses to pay. Since Omega's prediction and offer are already fixed in the past, the payment cannot causally influence the reward; it is merely a loss of $1,000. In the Tails Branch, CDT pays the blackmailer. Receiving the letter is fixed evidence; refusing to pay is causally linked to the revelation of the disease if the disease is present. Since the letter's existence is already settled, paying is the only way to causally prevent the revelation cost.

  An Evidential Decision Theory (EDT) agent acts to maximize expected utility conditional on the action. In the Heads Branch, EDT pays. Paying is strong evidence that Omega predicted a cooperative disposition, which correlates with the reward being available. In the Tails Branch, EDT also pays. In this scenario, the conditional probability of having the disease given that one receives a letter and pays is zero (since the letter is sent only if Disease XOR Pay). Thus, paying is evidence of safety, while refusing is evidence of having the disease and facing the $1,000,000 loss.

  A Functional Decision Theory (FDT) agent evaluates the output of their decision function. In the Heads Branch, FDT pays. By outputting "Pay," the agent ensures that Omega's simulation of their function yields a prediction of cooperation, releasing the $1,000,000. In the Tails Branch, FDT refuses to pay. FDT recognizes that the blackmailer's decision to send the letter is logically dependent on the agent's decision function. If the function outputs "Refuse," the blackmailer (simulating this) sends the letter only if the agent has the disease. If the function outputs "Pay," the letter is sent only if the agent is healthy. While paying guarantees a small loss, refusing ensures that the blackmail mechanism only triggers in the high-cost disease state, but crucially, FDT prioritizes not being the type of agent that incentivizes blackmail logic. However, in this specific Exchanger variant, the optimal local moves create a global conflict.

  The intuitively attractive package is to Pay Omega (securing $1M) and Refuse the Blackmailer (maintaining logical integrity). However, this package is unavailable to a single decision function. Omega's reward on Heads is explicitly contingent on the function's output in the Tails Branch. To secure the $1,000,000 on Heads, the decision function must output "Pay" when given Tails-Branch evidence. But if the function outputs "Pay" on Tails, the agent pays the blackmailer $1,000. If the function outputs "Refuse" on Tails to avoid the blackmail payment, Omega's simulation detects this disposition and withholds the $1,000,000 reward on Heads. The agent cannot be a "Payer" for Omega's sake and a "Refuser" for the Blackmailer's sake simultaneously; the source code must be uniform.

  This case illustrates the fundamental distinction between evaluating a physical act and evaluating a decision function. CDT and EDT evaluate the physical act in the moment: "Given I am here now, does moving my hand to pay help?" They treat the branches as isolated causal or evidential environments. FDT evaluates the abstract output of the function: "What does it say about my source code if I pay here?" The Two-Branch Exchanger shows that rationality may require sacrificing local optimality in one branch (paying the blackmailer) to secure global optimality across the decision tree (getting Omega's reward). It demonstrates that when predictors simulate your logic, your rationality is a property of your entire function, not just your localized reaction to immediate evidence.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  1.  **CDT Analysis (4 Marks)**
      *   *Requirement:* Must state CDT Refuses on Heads (prediction fixed/no causal link) and Pays on Tails (letter fixed/paying prevents reveal).
      *   *Common Error:* Claiming CDT Pays on Heads because "it's a good deal," ignoring the fixed prediction constraint.

  2.  **EDT Analysis (4 Marks)**
      *   *Requirement:* Must state EDT Pays on Heads (evidence of reward) and Pays on Tails (paying is evidence of No Disease).
      *   *Common Error:* Confusing EDT with FDT on the Blackmail branch, claiming EDT refuses because blackmail is bad.

  3.  **FDT Analysis (4 Marks)**
      *   *Requirement:* Must state FDT Pays on Heads (controls prediction) and Refuses on Tails (controls letter logic/disposition).
      *   *Common Error:* Stating FDT Pays on Tails to save the $1M disease cost, missing the logical control over the letter sending.

  4.  **Single Function Constraint (4 Marks)**
      *   *Requirement:* Must explain that Omega's Heads reward depends on the Tails disposition. Therefore, a function that Refuses on Tails loses the Heads reward. The "Pay/Refuse" mix is impossible for one function.
      *   *Common Error:* Treating the branches as independent decisions that can be mixed without cross-branch penalty.

  5.  **Act vs. Function Distinction (4 Marks)**
      *   *Requirement:* Must articulate that CDT/EDT optimize local physical acts given evidence, while FDT optimizes the global output of the source code, requiring consistency across counterfactuals.
      *   *Common Error:* Describing the difference merely as "long-term vs short-term" rather than "physical act vs. logical output."
