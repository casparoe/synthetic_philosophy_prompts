      *   *Angle 2: The Coupling-Constitution Fallacy.* This is the strongest objection. Just because two things are coupled (brain + phone) doesn't mean they constitute a single system (mind + phone). A calculator doesn't make me a mathematician.
      *   *Angle 3: Cognitive Offloading.* The psychological perspective. We offload work to save energy. Removing the offload point causes friction, which *feels* like loss of capacity, even if the capacity is still theoretically there.
      *   *Angle 4: The Notebook Wrinkle.* If the notebook worked, it suggests the *system* (User + External Storage) is what matters, not the specific technology. This actually supports the Extended Mind view more than the Internalist view, provided the notebook was integrated similarly. But if the phone felt *more* like part of the mind than the notebook, why? (Speed, integration, automaticity).

