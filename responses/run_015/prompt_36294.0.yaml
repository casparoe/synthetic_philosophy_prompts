answer: |-
  Based on the track record you've provided, your friend is not running a consistent "Minority Shield" or a pure "Cross-Border Spillover" algorithm. She is running a **Market Functionalist with National Moral Sovereignty** rule.

  Here is the breakdown of why the three principles you suggested don't all fit, which one is actually driving her bus, what she will say about same-sex marriage, and the specific test case to prove it.

  ### 1. Ruling out the Principles

  **Principle C: The EU as a Shield for Minorities**
  *   **Verdict:** **Dead.**
  *   **Evidence:** Her stance on **abortion**. If she believed the EU should protect minorities or individual bodily autonomy against national majorities, abortion would be an EU-level right. By marking it "national," she has signaled that she views reproductive and family rights as part of the domestic social contract, not fundamental EU rights. This strongly suggests she will view same-sex marriage the same way.

  **Principle A: Pooling Sovereignty Where Effects Leak Across Borders**
  *   **Verdict:** **Inconsistent.**
  *   **Evidence:** Her stance on **history teaching**. Teaching nationalist or revisionist history has massive cross-border effects (it fuels xenophobia, instability, and war). Yet, she marks this "national." This proves that for her, **cultural sovereignty trumps cross-border externalities.** She only cares about "leakage" when it is economic (trade, emissions, product standards), not when it is political or social.

  **Principle B: National Identity vs. Technical/Market**
  *   **Verdict:** **The Winner.**
  *   **Evidence:** This fits almost every data point.
      *   *EU Level:* Trade, tariffs, product standards, emission rules (where cross-border). These are "technical" market lubricants.
      *   *EU Level (The Exception):* Death penalty for *candidates*. This is not about governing members; it's about **gatekeeping**. It's a condition of entry, not a rule of membership.
      *   *National Level:* Retirement, history, abortion, tax. These define the "National Social Contract."
      *   *The Nuance:* She supports the EU court striking down discrimination against *other member state citizens*. This isn't about human rights broadly; it's about **Free Movement**. It ensures the market works for movers, not that locals have rights against their own government.

  ### 2. The Prediction

  **She will say: National.**

  She views marriage, like abortion and history, as a foundational element of national culture and morality, not a "technical" market standard. Even though a lack of marriage equality might hinder free movement for gay couples (a cross-border effect), her "History Teaching" verdict shows she allows cultural issues to create friction if that culture is national.

  She will likely argue: *"The EU is a common market, not a common morality club. If you want to change marriage laws, do it in your parliament, not in Brussels."*

  ### 3. The Test Case

  To definitively distinguish whether she prioritizes **Market Friction (Principle A)** over **National Identity (Principle B)**, you need a case that is morally charged (like marriage) but involves a clear cross-border service or economic right.

  **Bring up Cross-Border Surrogacy.**

  *   **The Scenario:** An EU couple from a country where surrogacy is banned travels to a country where it is legal to have a child. When they return home, the home country refuses to recognize the birth certificate.
  *   **Why this distinguishes the rules:**
      *   **Market/Spillover Logic (Principle A):** The EU should intervene. This involves cross-border medical services, the legal status of a citizen moving between states, and creates a barrier to the free movement of families.
      *   **National Identity Logic (Principle B):** The EU should stay out. Defining "parenthood" and the ethics of surrogacy are deep moral questions, similar to abortion and marriage.
      *   **Minority Shield (Principle C):** The EU should intervene to protect the family unit and the child's rights.

  **How to interpret her answer:**
  *   If she says **EU Level**: She is actually a **Market Functionalist**. She cares more about the smooth operation of the Single Market (free movement of people/services) than national moral sovereignty. This would mean she *might* be swayed on same-sex marriage if framed as a "Free Movement" issue.
  *   If she says **National**: She is a **Moral Sovereigntist**. The "Market" argument loses to "Culture" every time. This confirms she will reject the same-sex marriage ruling, regardless of the free movement arguments attached to it.

  **Summary:** Her "Abortion" vote killed the Rights Shield. Her "History" vote weakened the Spillover argument. The **Surrogacy** test will tell you if the "Market" argument is strong enough to override her "National Identity" rule, or if Culture always wins. My money is on Culture winning.
