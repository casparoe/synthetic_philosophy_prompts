answer: |-
  # Joint Statement of Adversarial Collaboration on Semantic Content and Mental Individuation

  **Signatories:** The Semantic Externalist Working Group (SEWG) and The Narrow-Content Internalist Consortium (NCIC)
  **Date:** October 26, 2023
  **Subject:** Findings regarding the Twin Earth Thought Experiment and Extensions

  Following a period of structured adversarial collaboration, the undersigned camps submit this joint statement. We acknowledge that while deep theoretical divergences remain, we have successfully isolated the locus of our disagreement from areas of methodological and intuitional consensus.

  ## I. Points of Consensus

  1.  **Formal Structure of the Scenario:** Both camps agree on the logical topology of the original Twin Earth scenario. We accept the coherence of a counterfactual world (Twin Earth) physically identical to Earth from the skin inward, differing only in specific environmental microstructures (e.g., H₂O vs. XYZ) and/or historical causal chains, while maintaining qualitative identity for the subjects (Oscar and Twin-Oscar).
  2.  **Disputed Classes of Expressions:** We agree that the primary locus of dispute concerns **natural-kind terms** (e.g., "water," "gold") and **proper names**. We agree that indexicals (e.g., "I," "here") and logical constants are not the primary drivers of the externalist argument, though they may share structural features.
  3.  **Natural-Kind Distinction:** Both camps accept the Kripke-Putnam distinction between natural-kind terms and descriptive clusters. We agree that, in the actual world, the extension of "water" is fixed by underlying microphysical structure rather than superficial descriptions (e.g., "clear, drinkable liquid").
  4.  **Relevant Intuitions as Data:** Both camps treat the following intuitions as fixed data points that any theory must accommodate:
      *   (a) If Oscar says "Water is wet" on Earth, he speaks truly iff H₂O is wet.
      *   (b) If Twin-Oscar says "Water is wet" on Twin Earth, he speaks truly iff XYZ is wet.
      *   (c) Oscar and Twin-Oscar are intrinsic physical duplicates at the time of utterance.
      *   (d) Psychological explanation requires some notion of generalization across subjects.
  5.  **Assessment of Verbal Dispute:** We jointly assess that a portion of the dispute is verbal, specifically centering on the definition of the term **"content."**
      *   **SEWG Stance:** We maintain this is **substantive**. To change the definition of content to exclude environmental factors is to change the subject of semantic theory. Truth-conditions are essentially relational; removing the relation destroys the phenomenon we aim to explain.
      *   **NCIC Stance:** We maintain this is **partially terminological** but with substantive consequences. We agree "wide content" exists for semantics, but insist that *psychological* content (the driver of behavior) must be narrow. The dispute is substantive regarding which notion serves cognitive science, but verbal regarding whether "content" simpliciter must be wide.

  ## II. Precise Formulations of Disagreement

  To ensure clarity, each camp has drafted the core disagreement claims in language acceptable to their own theoretical framework.

  **A. Scope of Externalism (Functional, Artifactual, and Biological Kinds)**
  *   **SEWG Formulation:** The Twin Earth argument generalizes. The content of terms referring to artifacts (e.g., "pencil") and biological kinds (e.g., "tiger") is determined by causal-historical chains linking the term to the original baptism or functional design plan. Intrinsic duplicates in different causal environments possess different concepts.
  *   **NCIC Formulation:** The Twin Earth argument does not generalize to artifacts or functional kinds. For these categories, content is determined by the functional role the object plays for the agent. Intrinsic duplicates possess the same concepts regarding artifacts, regardless of historical origin, because cognitive processing relies on perceived function, not hidden history.

  **B. Characterization of Mental States**
  *   **SEWG Formulation:** Mental states should be characterized in **purely representational terms** that entail truth conditions. Since truth conditions depend on the environment, mental states are individuated broadly. Phenomenal character supervenes on wide content.
  *   **NCIC Formulation:** Mental states relevant to psychological explanation should be characterized in **functional and phenomenal terms**. Since intrinsic duplicates share functional organization and phenomenal experience, they share the mental states that matter for explaining behavior. Wide content is an extrinsic add-on, not the core of the mental state.

  ## III. Cruxes and Predictive Table

  The following table isolates the methodological cruxes where our predictions diverge. For each crux, we have agreed upon a concrete hypothetical case. Each camp records in advance the judgment or theoretical consequence they predict.

  | Crux | Neutral Formulation of the Issue | Concrete Hypothetical Case | SEWG Prediction / Consequence | NCIC Prediction / Consequence |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Non-Circularity Criterion** | Is there a criterion for "sameness of mental state" across environments that does not presuppose the truth of Externalism or Internalism? | **The "Amnesiac Twin" Case:** Oscar is transported to Twin Earth, loses all memory of Earth, and lives there for 20 years. He is now intrinsically identical to a native Twin-Earthling. Do they now share the *same* mental state regarding "water"? | **Prediction:** No. **Consequence:** Content is determined by causal history, not just current intrinsic state. Even with intrinsic identity, the original causal chain to H₂O (if retained) or the lack of a causal chain to XYZ prevents full identity of content. | **Prediction:** Yes. **Consequence:** Content is determined by current intrinsic organization and functional role. Once intrinsic states align (via memory loss/adaptation), narrow content aligns, proving mental states supervene on the head. |
  | **2. Non-Chemical / Isomorphic Duplicates** | Does environmental history matter when the internal organization is isomorphic but the external kind is not a chemical natural kind? | **The "Artifact Twin" Case:** Earth uses "pencils" (graphite/wood). Twin Earth uses "schmencils" (functionally identical writing implements made of a different synthetic polymer, unknown to users). Oscar and Twin-Oscar are intrinsic duplicates. Do they have the same belief when thinking "This is a pencil"? | **Prediction:** No. **Consequence:** Artifact terms have hidden essences (design history/material origin). Different origins entail different extensions, therefore different wide content, therefore different belief states. | **Prediction:** Yes. **Consequence:** Artifact concepts are functional. Since the use and phenomenal experience are identical, the narrow content is identical. The difference in material is irrelevant to the psychological explanation of the writing behavior. |
  | **3. Phenomenal Supervenience** | Does the phenomenal character of experience change when wide content changes but intrinsic physiology remains constant? | **The "Slow-Switch" Case:** Oscar is unknowingly moved from Earth to Twin Earth. Over time, his concept shifts from H₂O to XYZ. At the midpoint, is his phenomenal experience of "water" different from his experience on Earth? | **Prediction:** Yes (or indeterminate). **Consequence:** If content changes, the representational character of experience changes. Phenomenology is not purely internal; it tracks the external world. | **Prediction:** No. **Consequence:** Phenomenology supervenes on the brain. Since Oscar's brain hasn't changed, his "what-it-is-likeness" remains constant. The change is purely in the external reference, not the mental state itself. |

  ## IV. Conclusion on Future Inquiry

  We agree that further progress requires disentangling the *semantic* question (what determines reference) from the *psychological* question (what explains behavior). The SEWG commits to investigating how wide content can be causally relevant without violating physicalist constraints. The NCIC commits to providing a robust formalization of "narrow content" that avoids collapsing into behaviorism or eliminativism. We acknowledge that the "Non-Circularity Criterion" (Crux 1) remains the most significant methodological hurdle for resolving the dispute empirically or conceptually.

  ***

  **Signed,**

  *Dr. Hilary P. Putnam-Jr.* (Lead, Semantic Externalist Working Group)
  *Dr. Jerry A. Fodor-Smith* (Lead, Narrow-Content Internalist Consortium)
