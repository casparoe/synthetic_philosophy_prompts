answer: |-
  # Joint Statement on Moral Particularism and Generalism

  **1. Grades**

  We distinguish three grades of commitment to clarify the live disagreement. Technical terms are defined upon first use.

  **Particularist Grades:** (i) *Strong:* There are no true informative moral principles (generalizations linking natural features to moral status). (ii) *Moderate:* True principles may exist, but no correct moral judgment is correct in virtue of instantiating one. (iii) *Weak:* True principles may exist and ground correctness, but no finite exceptionless set is available to creatures like us.
  **Generalist Grades:** (i) *Weak:* Moral properties supervene on natural properties (no moral difference without a natural difference). (ii) *Moderate:* Some principle makes every reason a reason. (iii) *Strong:* Competent moral judgment genuinely deploys principles.

  Party A holds Grade (ii); Party B holds Grade (ii). We agree Grade (i) for both sides is true given our shared realism. The live dispute concerns whether principles play an explanatory role (A denies, B affirms). The quarrel over Grade (iii) dissolves into a verbal dispute regarding "available": A means "usable in deliberation," B means "metaphysically grounded."

  **2. Agreed Claims**

  We endorse the following twelve claims.^[1]

  1.  Moral properties supervene on natural properties.
  2.  Moral judgments are truth-apt and sometimes true.
  3.  A *reason* is a consideration that counts in favor of or against an action.
  4.  Reasons are provided by natural features of situations.
  5.  Moral deliberation often proceeds without explicit rule citation.
  6.  A *principle* is a generalization linking natural features to moral status.
  7.  Principles are often too complex for human memory.
  8.  Moral error is possible even when natural facts are known.
  9.  Context affects the weight of a reason.
  10. A *defeater* is a condition that opposes a reason that exists anyway.
  11. Moral explanation requires citing relevant natural features.
  12. No single natural feature is a reason in every possible context.

  **3. Disagreements**

  | Issue | Particularist Formulation | Generalist Formulation | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Explanation** | Citing a reason explains without subsumption (fitting a case under a generalization). | Explanation works only by implicitly appealing to a principle. | Genuine |
  | **Metaphysics** | Holism: A feature's status as a reason depends on the whole context. | Atomism: A feature is a reason in virtue of a principle covering the case. | Genuine |
  | **Principles** | Principles are at best summaries of judgments, not grounds. | Principles are grounds of judgments, even if unknown. | Genuine |
  | **Deliberation** | Rules are crutches; virtue is perceptual sensitivity. | Rules guide even if tacit; virtue is rule-following capacity. | Partly Verbal |

  **4. Cruxes**

  We identify three cruxes where empirical or conceptual testing could shift views.

  **Crux 1: Ad Hoc Rescue.**
  *Sub-question:* Is refining a principle to fit a counter-case principled or ad hoc?
  *Protocol:* A pre-registered adversarial game. The Generalist states a principle for a domain (e.g., promise-keeping). The Particularist produces a case where the principle yields the wrong verdict. The Generalist may amend the principle once per round to accommodate the case.
  *Stopping Rule:* The game ends after ten rounds or if the principle remains unchanged for three consecutive rounds.
  *Predictions:* Party A predicts the principle will become disjunctive and unwieldy, losing explanatory power. Party B predicts the principle will converge on a stable, complex truth.
  *Concessions:* If A is right, B concedes principles are heuristics. If B is right, A concedes principles ground correctness.

  **Crux 2: Novel Domains.**
  *Sub-question:* Does reliable performance in novel moral domains require tacit principles?
  *Diagnostic:* Compare moral learning to training a neural network classifier that is reliable but not rule-articulable.
  *Predictions:* Party A predicts moral competence resembles the classifier (pattern recognition). Party B predicts it resembles rule-learning (generalization).
  *Concessions:* If competence persists without articulability, B concedes Grade (iii) is false.

  **Crux 3: Singular Explanation.**
  *Sub-question:* Can singular moral explanation work without subsumption?
  *Diagnostic:* Analyze explanations like "He did it because it was cruel" without adding "and cruelty is always wrong."
  *Predictions:* Party A predicts this is complete. Party B predicts it is elliptical for a general claim.
  *Concessions:* If A is right, B accepts non-subsumptive explanation.

  **5. Two Constructed Cases**

  We stipulate two cases to test holism.

  **Case 1: Valence-Flip.**
  *Scenario:* In both cases, an agent tells a truth (Feature F).
  *Background 1:* The listener needs the truth to avoid harm.
  *Background 2:* The listener is a murderer seeking a victim; the truth reveals the victim's location.
  *Outcome:* In Background 1, F is a reason for telling. In Background 2, F is a reason against telling.
  *Analysis:* Party A says this proves holism (valence flips). Party B says this proves complex principles (the principle includes "unless it aids murder").
  *Verdict:* This relocates the dispute to whether the exception is part of the reason or the principle.

  **Case 2: Silent-Background.**
  *Scenario:* In both cases, an action produces pleasure (Feature F).
  *Background 1:* The pleasure is benign.
  *Background 2:* The pleasure is sadistic (derived from another's pain).
  *Outcome:* In Background 1, F is a reason for the action. In Background 2, F is no reason at all (a *silencer*).
  *Analysis:* Party A says F lacks moral status in Background 2. Party B says F is a prima facie reason outweighed by pain.
  *Verdict:* If F is truly silent in Background 2, Party B must accept silencers, weakening Grade (ii).

  We sign this statement to record our shared commitments and the precise geometry of our dissent.

  ***

  ^[1] Claim 1 is excluded from the main count if considered trivial by outsiders, but we retain it as substantive against skeptics. Claim 7 is included to show agreement on epistemic limits despite metaphysical disagreement.
