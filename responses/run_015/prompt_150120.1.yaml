  Elena, a senior pharmacist, verifies a 50mg dose of Compound X. Protocol requires weighing sealed blister packs on a digital scale. Factory calibration ensures every pack contains exactly 50mg. Elena places a pack on the scale and reads '50mg'. The scale's load cell failed overnight, freezing the display at '50mg' regardless of input. The pack mass is exactly 50mg due to factory controls. Elena believes the dose is 50mg based on the scale reading. She follows all protocols. The scale is routinely maintained and historically reliable.

  ***

  **Audit**

  **(3) Safety:** Target: "The pack contains 50mg." Basis: Scale display. Fixed: Factory standards (truth-maker) and scale freeze (evidence-maker). In nearby worlds where Elena forms this belief via this basis, the factory standards hold (packs are 50mg) and the scale remains frozen (reads 50mg). The belief is true in all nearby worlds. **Verdict: Safe.**

  **(4) No False Lemmas:** Elena does not infer the weight from the premise "The scale is functional." She forms the belief directly from the visual experience of the number. The misleading element is the frozen display (a non-doxastic state), not a false belief about the instrument's status. **Verdict: Satisfied.**

  **(5) Reliability:** Method: "Verifying sealed packs via calibrated digital scale." In the actual environment (which includes the stable factory controls and the currently frozen but historically reliable scale), this method yields truth consistently. Narrowing the method to "Reading a frozen scale" violates the Generality Problem by using information unavailable to the subject. **Verdict: Reliable.**

  **(6) Probability:** Given the factory controls and the scale reading, the posterior probability of the pack containing 50mg is near unity. **Verdict: High Probability.**

  **Sensitivity Check:** If the pack did *not* contain 50mg (e.g., a factory error), the scale would still read '50mg' (due to the freeze). Elena would still believe it contains 50mg. **Verdict: Insensitive.**

  **Structural Feature:** **Explanatory Disconnect.** The truth of the belief is not explained by the evidence relied upon, even though they covary modally. The scale is inert; the factory ensures the truth.

  **Minimal Alteration:** Repair the scale's load cell. The reading then causally depends on the weight, restoring the explanatory link.

  **Worst Account:** **The Safety Condition.** It verdicts "Knowledge" (because the belief is safe), conflicting with the strong intuition that inert evidence cannot sustain knowledge.

  **Reliabilist Objection & Rebuttal:** Your TF will argue the process is "reading a broken instrument," which is unreliable. **Response:** Process individuation must respect the subject's perspective. To Elena, the process is "using calibrated lab equipment." The breakage is an unseen environmental anomaly. If Reliabilism narrows the process to exclude the anomaly, it becomes ad hoc and loses its externalist advantage.

  **Honesty Check:** Constraints (3) through (6) strain the non-knowledge intuition. If a belief is safe, reliable, and justified, many epistemologists (e.g., Williamson) would classify it as knowledge. The breakdown here is principled: Safety tracks truth across worlds, but knowledge arguably requires the truth to hold *because* of the evidence. This case isolates modal stability from explanatory relevance. If your intuition wavers, it suggests Safety may be sufficient for *some* grade of knowledge, but not the kind requiring an appropriate explanatory basis. This tension is precisely what makes the case worth writing up.
