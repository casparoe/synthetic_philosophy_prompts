  5.  **Addressing the "Give Up" Requirement:**
      *   *3(i) vs 3(ii):* You cannot hold that the *rule* is the same. The context changes the ethics. 3(ii) is a failure of stewardship.
      *   *4 vs 7:* You need to separate "Harm to Truth" from "Harm to Person." Case 7 harms Truth primarily. Case 4 harms Person (the woman) primarily. Both are bad, but different categories.
