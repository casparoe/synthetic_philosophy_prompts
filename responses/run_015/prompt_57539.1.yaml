answer: |-
  ### Preliminary Assessment: Is the Request Misconceived?

  Your third worry is the most serious: **the Hart–Devlin frame may be the wrong lens for commercial surrogacy.**

  You are right to be concerned. The Hart–Devlin debate concerns *private sexual morality* (homosexuality, prostitution) where the "harm principle" is the primary counter-argument. Commercial surrogacy, however, introduces distinct ethical dimensions that Hart and Devlin did not centrally address: the commodification of reproductive labour, the potential for exploitation of economically vulnerable women, and the welfare of the child as a third party who cannot consent.

  If you accept the "mortar" analogy, you implicitly accept the opponent's framing: that the primary issue is *societal cohesion* and *shared moral sentiment*, rather than *harm, exploitation, or rights*. By fighting on the ground of "will this destroy society?", you concede the ground of "is this just?".

  **However,** since your opponent has explicitly deployed this analogy to justify criminalization, you cannot ignore it. If you do not audit and dismantle the mortar image, it will do its rhetorical work unchallenged. Therefore, the request is not misconceived *tactically*, even if the frame is *strategically* limiting. You should use this audit to clear the debris, but your submission must ultimately pivot to the commodification/harm argument.

  Regarding your first worry (strawman): You have reconstructed a loose remark into a mechanical argument. This is acceptable. Analogies in legal argument invite reconstruction; if the image is to carry weight, it must bear the logical load you are placing on it. If it collapses under that load, the fault lies with the image, not your reconstruction.

  Regarding your second worry (decoration): Even if the barrister intends it merely as expression, in a consultation response, rhetorical images function as premises. They persuade by intuition. Auditing the intuition is necessary.

  ***

  ### 1. The Correspondences

  Here is the mapping of the mortar image to the legal/social target.

  | Source (Mortar/Building) | Target (Morality/Law) | Honesty Check |
  | :--- | :--- | :--- |
  | **Mortar** | The underlying, unwritten shared moral sentiment that binds the community. | **Strained.** Morality is not a single substance; it is a plurality of often conflicting values. |
  | **Bricks** | Specific statutes, prohibitions, or social practices. | **Fair.** Laws are discrete units that can be swapped. |
  | **The Building** | The Society / The Polity. | **Fair.** |
  | **The Builder** | The Legislature / The Community acting through law. | **Fair.** |
  | **Load-bearing Question** | Whether a specific prohibition is essential to maintaining social order. | **Fair.** This is the core empirical question. |
  | **Absent Control Building** | The impossibility of running a controlled social experiment (no identical society to compare against). | **Fair.** Social science lacks laboratory controls. |
  | **Impossibility of Rebuilding** | Path dependence; the claim that once a norm is lost, it cannot be restored, and the resulting society is fundamentally different. | **Dishonest.** Societies routinely restore or replace norms (e.g., post-war reconstructions of civic virtue). |
  | **The Wall Moving** | Social disintegration, loss of order, or fundamental shift in national identity. | **Strained.** "Moving" implies collapse. Social change is usually adaptation, not collapse. |

  ### 2. Disanalogies: Decorative vs. Significant

  **Decorative Disanalogies (Do not bear on the conclusion):**
  *   **Materiality:** Mortar is inorganic; morality is psychological. (Irrelevant to the structural claim).
  *   **Visibility:** Mortar is hidden; morality is often explicit. (Does not affect the load-bearing function).
  *   **Homogeneity:** Mortar is mixed in a batch; morality is not. (This looks decorative but is actually significant—see below).

  **Significant Disanalogies (Damage the inference to retention):**
  *   **Redundancy vs. Monolith:** A wall often has multiple load paths. If one section of mortar fails, the load redistributes. A society has multiple binding mechanisms (law, economy, culture, family). If *one* moral norm (surrogacy) erodes, others (parental love, prohibition on sale of persons) may compensate. The analogy assumes a *single point of failure*, which is empirically false for complex societies.
  *   **Catastrophe vs. Degradation:** When mortar fails, a wall often collapses suddenly. When moral norms shift, societies usually degrade or adapt gradually. The analogy imports a *tipping point* model of social change that is not evidenced. This creates a false urgency.
  *   **Passive vs. Active:** Mortar does not react to being tested. Moral norms *respond* to legal change. Decriminalization often triggers *new* regulatory norms (e.g., licensing, oversight) rather than simple abandonment. The analogy assumes a binary (Prohibition vs. Chaos) rather than a spectrum (Prohibition vs. Regulation).
  *   **Epistemic Access:** Builders have physics to calculate load. Legislators have sociology, history, and comparative law. The "ignorance of the builder" claim is exaggerated. We *do* know what happened in jurisdictions that legalized surrogacy (e.g., parts of the US, Greece, Ukraine). The "no control building" claim is factually false; we have comparative data.

  ### 3. What the Source Quietly Imports

  The analogy is not neutral; it is a engine for smuggling specific premises into the argument without proof.

  1.  **Monism:** It imports the idea that there is *one* morality ("a single continuous substance"). This rules out pluralism by definition. If morality is plural, removing one strand need not break the bond.
  2.  **Fragility:** It imports the idea that the structure is *more fragile than it is resilient*. Walls are static; societies are dynamic. The image pre-loads the risk assessment toward caution.
  3.  **Irreversibility:** It imports the claim that change is permanent and destructive ("cannot be rebuilt"). This ignores the possibility of *correction* or *regulation* if negative effects emerge.
  4.  **Ignorance:** It imports a radical skepticism about our ability to predict social outcomes ("learns the answer only once the wall has already moved"). This justifies the precautionary principle to the point of paralysis.

  **Are these argued or imported?** They are imported by the *mechanics* of the image. The barrister does not argue that society is fragile; he shows you a wall and asks you to assume it behaves like society. The image does the argumentative work for him.

  ### 4. Whether the Conclusion Survives

  **Does the presumption for retention survive?**
  No, not as a *presumption*. It survives only as a *procedural caution*.

  *   **Maximum the analogy can bear:** If we accept the disanalogies regarding redundancy and dynamic adaptation, the image supports a requirement for *monitoring* and *gradualism*. It suggests that if you remove a brick, you should watch the wall. It does not support leaving the brick in forever.
  *   **What it cannot bear:** It cannot support a *permanent veto* based on ignorance. The "no control building" claim is refuted by comparative jurisprudence. We are not building in the dark; we are building where others have built.
  *   **Empirical Flag:** My confidence that the "catastrophic failure" claim is false rests on historical observation (e.g., the decriminalization of homosexuality or adultery did not cause societal collapse). This is an empirical claim, not a logical one, but it is sufficiently settled to treat the "fragility" premise as dubious.

  **Verdict:** The analogy collapses into an argument for *regulated legalization* rather than *criminalization*. If the mortar is old, you repoint it; you do not forbid the use of the building.

  ### 5. The Hart Point (Existence vs. Identity)

  **Does the existence-versus-identity objection land?**
  The mortar image is specifically designed to evade Hart's objection, but it does so by begging the question.

  *   **Hart's Objection:** A society can change its morality and remain the *same* society (Identity persists despite Moral Change).
  *   **The Mortar Evasion:** The image equates "Society" with "Building." If the mortar fails, the Building falls (Existence ceases). It conflates Identity with Existence.
  *   **The Further Premise Required:** For the evasion to work, the barrister must assume that *this specific morality* is constitutive of the society's existence, not just its current style. He must argue that without *this* prohibition, we are not just a different version of ourselves, but *no longer a coherent polity*.
  *   **Defensibility:** This premise is indefensible without circularity. Why is *this* mortar essential? Because the wall falls. Why does the wall fall? Because this mortar is essential. The image disguises this circularity as physical necessity. Hart's point lands hard: the image assumes what it needs to prove (that this norm is existential).

  ### 6. The Treason Comparison (Subversive vs. Sinner)

  **Your hunch is correct.** The two images are doing different work and are illegitimately fused.

  *   **Mortar Image (Structural):** Concerns *systemic risk*. It is agnostic about intent. A well-meaning reformer can pull a brick and bring the wall down.
  *   **Treason Image (Agentive):** Concerns *culpability*. It assigns hostile intent. The violator is an enemy of the state.
  *   **The Illegitimate Run-Together:** The structural fear (the wall might fall) is used to justify the agentive punishment (the reformer is a traitor).
      *   If the risk is merely structural (unintended consequence), the response should be *caution*, not *punishment*.
      *   If the actor is a traitor (intentional subversion), the risk to the structure is irrelevant; the crime is the disloyalty.
      *   **The Smuggle:** The barrister uses the *urgency* of the structural collapse to justify the *severity* of the treason label. He makes the surrogacy arrangement sound like a bomb in the wall (structural) placed by an enemy (treason). In reality, it is likely just a brick being tested by a citizen. Separating these deflates the urgency.

  ### 7. A Better Analogy

  The "Mortar" analogy fails because it models society as a static physical object. A better analogy models society as a **living organism** or a **complex regulatory system**.

  **Proposal: The Immune System.**
  *   **The Image:** Laws are like immune responses. They protect the body from genuine threats (infection/exploitation). Sometimes, the immune system overreacts to harmless stimuli (allergies/autoimmune disease).
  *   **What it Licenses:** It allows for the possibility that a prohibition *once served a purpose* (fought an infection) but is now attacking healthy tissue (consensual arrangements). It licenses *withdrawal* of the law not as "destroying the building" but as "treating the autoimmune disorder."
  *   **Where it Gives Out:** Immune systems are not conscious; laws are. It doesn't capture the *moral* dimension, only the *functional* one.

  **Proposal: Zoning and Building Codes.**
  *   **The Image:** We do not ban building heights because "tall buildings destroy the soul of the city." We regulate them for safety, light, and infrastructure.
  *   **What it Licenses:** It shifts the debate from *Morality* (Mortar) to *Harm/Regulation* (Codes). It licenses *regulation* of surrogacy (safety, consent, payment caps) rather than *prohibition*.
  *   **Where it Gives Out:** It assumes the harm is purely physical/infrastructural, potentially underplaying the ethical concerns about commodification.

  **Recommendation:** Use the **Zoning/Building Code** analogy. It directly counters the "Mortar" image on its own turf (construction) but shifts the logic from "fragility" to "safety management." It licenses the conclusion that we can allow the practice *if* we manage the risks, rather than banning it to save the structure.

  ### 8. Auditing Your "Splint" Analogy

  > *"A morals law of this kind is like a splint left on a bone that has already healed: it did real work once, and left in place it stiffens the limb and wastes the muscle."*

  *   **Strengths:** It effectively captures the *harm of retention*. It counters the "safety" argument of the mortar image by arguing that the protection itself has become the danger (atrophy). It frames the reformer as a healer, which is rhetorically positive.
  *   **Weaknesses:**
      1.  **Teleology:** It assumes the bone *has* healed. This implies moral progress has a fixed endpoint ("healed"). Opponents will argue the bone is still broken. This is an empirical contest you cannot win by analogy.
      2.  **Paternalism:** It casts the legislator/reformer as the Physician. This invites the counter-charge of elitism ("Who made you the doctor?").
      3.  **Passivity:** A splint is passive. Law is active. Removing a splint doesn't require a new regime; removing a law often requires a new regulatory framework.
  *   **Verdict:** It is a stronger image than the Mortar for highlighting *costs*, but it shares the Mortar's weakness of assuming a static state of affairs (healed vs. unhealed). It works best if paired with evidence that the "injury" (the social harm the law prevented) no longer exists.

  ### Summary of Advice

  1.  **Acknowledge the Trap:** Start your submission by noting that the "shared morality" frame is the wrong one for surrogacy (which is about harm and rights), but engage the analogy to show it fails even on its own terms.
  2.  **Break the Mechanics:** Explicitly state that societies are not walls. They have redundancy, they adapt, and we have comparative data (the "control buildings" exist overseas).
  3.  **Separate Structure from Intent:** Decouple the "subversive" claim from the "structural" claim. Unintended consequences do not merit criminal penalties.
  4.  **Pivot:** Use the **Building Code** analogy to move the debate from "Should we ban this to save society?" to "How do we regulate this to ensure safety?"

  The mortar analogy is a rhetorical fortress built on sand. You can knock it down, but ensure you don't let the opponent rebuild on the same ground. Move the debate to commodification and welfare.
