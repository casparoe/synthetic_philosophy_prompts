          *   *Wittgenstein's text:* He says you can go groove $\to$ score $\to$ symphony using the rules. He emphasizes the *internal similarity* and the reversibility of the projection.
          *   *Conflict:* The *Tractatus* assumes a perfect logical mapping. Marta's reality involves *damage* (wax cylinders). The *Tractatus* is ideal; Marta is empirical.
          *   *Verdict:* Wittgenstein denies the asymmetry in the ideal case. Marta's narrator is right about the *practical* case (damage/noise), but wrong if claiming it's logically impossible. The tension is between Ideal Logic vs. Messy Reality.
          *   *Confidence:* High. This is a clear tension between the text and the novel's plot.

      *   **Q3: "Shortest Groove" (Minimum Description Length / Occam's Razor vs. Kripke)**
