          *   *Where does it live?* It's not psychological (in the head). It's not just physical ink. It's logical/structural. It's the shared syntax that makes translation possible.
          *   *Confidence:* High on the *Tractatus* view (logical form), moderate on how to explain it simply.

      *   **Q2: Asymmetry (Score $\to$ Sound vs. Groove $\to$ Score)**
