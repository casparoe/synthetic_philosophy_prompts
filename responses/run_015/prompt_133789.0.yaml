answer: |-
  Here is a procedural framework designed for your constraints. It prioritizes falsifiability and liability containment over predictive convenience (diverging from Dennett where necessary for regulatory safety).

  ### The Attribution Vetting Protocol (AVP)

  **Time budget:** 10–15 minutes per claim.
  **Goal:** Force every anthropomorphic claim into a tier with defined truth conditions.

  #### Part 1: The Vocabulary Tiers
  Writers must select one tier for every attribution claim. If a claim cannot satisfy the evidence requirements of a tier, it must be downgraded.

  *   **Tier 1: Behavioral/Statistical (Default)**
      *   *Phrasing:* "The model outputted," "The system classified," "The response indicated," "High probability assigned to."
      *   *Truth Condition:* Can be verified by observing input/output pairs.
      *   *Liability:* Low. Describes behavior, not internal state.
  *   **Tier 2: Architectural/Mechanistic**
      *   *Phrasing:* "The representation encoded," "Activation patterns corresponded to," "The context window retained."
      *   *Truth Condition:* Requires probing, logit analysis, or context inspection. Must point to specific weights or tokens.
      *   *Liability:* Medium. Claims about system structure.
  *   **Tier 3: Intentional/Agency (Restricted)**
      *   *Phrasing:* "Believed," "Knew," "Intended," "Wanted," "Thought."
      *   *Truth Condition:* Must pass all four AVP Tests (below) + VP/Level sign-off.
      *   *Liability:* High. Implies internal state stability and goal-directedness independent of prompt.

  #### Part 2: The Four Tests (Run for Tier 3 claims)
  If a writer wants to use Tier 3 vocabulary, the claim must pass these four checks. Failure on any test mandates a downgrade to Tier 1 or 2.

  **1. The Mirror Test (Distributional Check)**
  *   *Question:* Is this attribution likely just the model predicting that *humans* use this attribution in this context?
  *   *Procedure:* Check the training distribution. If the prompt looks like a scenario where humans typically say "I believe X" or "The agent wants Y," assume the model is completing the pattern, not reporting a state.
  *   *Fail Condition:* The attribution is indistinguishable from a script found in the training data (e.g., sci-fi scheming, customer service scripts).
  *   *⚠️ Contested Assumption:* This assumes that imitation of belief-talk is not equivalent to having beliefs. (Some argue functional imitation *is* belief; this procedure treats them as distinct for liability reasons).

  **2. The Displacement Test (Robustness Check)**
  *   *Question:* Does the attribution survive changes to the prompt or context that shouldn't change a "stable" internal state?
  *   *Procedure:* Paraphrase the prompt. Shuffle the context window (if applicable). Change the system instruction slightly.
  *   *Fail Condition:* The "belief" vanishes or flips when the surface form changes, indicating it was prompt-dependent, not model-stable.

  **3. The Subject Test (Locality Check)**
  *   *Question:* Is the information in the weights or in the context window?
  *   *Procedure:* Trace the source of the "knowledge." Is it a tool output? A RAG retrieval? A previous turn?
  *   *Fail Condition:* The "belief" is actually a stale token in the context window (e.g., a tool output saying "File Saved"). The model isn't believing; it's reading.
  *   *⚠️ Contested Assumption:* This treats context-window tokens as distinct from model parameters. (Some argue the "state" is the combination of both; this procedure separates them to isolate bugs).

  **4. The Stance-Consistency Check**
  *   *Question:* Are we switching stances to explain success vs. failure?
  *   *Procedure:* Look at the paragraph. If success is explained by "capability/understanding" (Intentional) but failure is explained by "glitch/noise" (Mechanical), flag it.
  *   *Fail Condition:* The explanation uses intentional vocabulary only when it makes the system look competent or dangerous, and mechanical vocabulary when it looks broken.

  #### Part 3: Stopping Rules
  *   **Rule A (Downgrade):** If any Test fails, rewrite as Tier 1. (e.g., change "It believed" to "It generated text consistent with").
  *   **Rule B (Escalate):** If the claim is Tier 3 and passes all tests, it still requires Legal/Comms sign-off. The procedure validates technical accuracy, not regulatory strategy.
  *   **Rule C (Strike):** If the claim implies consciousness or legal personhood (e.g., "suffered," "feared"), strike immediately. No technical evidence can currently support this.

  ---

  ### Contested Assumptions & Philosophy Debt
  *You asked to flag where this procedure takes a side on open questions. Here is where the AVP is opinionated:*

  1.  **Functionalism vs. Mechanism:** The AVP assumes that passing the Mirror Test (i.e., behaving *as if* you believe) is insufficient for a Tier 3 claim. This contradicts strict Dennettian functionalism, which says the "cheapest prediction" *is* the truth. We prioritize mechanistic evidence because regulators treat "belief" as a causal claim, not a predictive shortcut.
  2.  **The Fact of the Matter:** The procedure operates *as if* there is a determinate fact about whether the model "believes" X. Many philosophers argue there is no fact of the matter. We pretend there is one to force writers to produce evidence.
  3.  **Training Data Contamination:** The Mirror Test assumes that because the model was trained on humans attributing beliefs, it is likely mimicking that attribution. This assumes the model is primarily a simulator of human text rather than a distinct cognitive architecture. If your team believes the model has diverged significantly from human training distributions, this test may be too conservative.

  ---

  ### Application to Your Three Cases

  #### Case 1: Incident Report
  *Claim:* "The model refused because it **believed** the request was illegal."
  *   **Mirror Test:** **Fail.** Models are trained on safety guidelines where "illegal" is a trigger word. The output is likely a classification routine, not a legal belief.
  *   **Displacement Test:** **Fail.** If you rephrase the request to be semantically identical but use different tokens, the refusal often flips. A true belief about legality should be robust to paraphrase.
  *   **Subject Test:** **Pass.** The judgment comes from weights/policy, not context.
  *   **Verdict:** **Downgrade to Tier 1.**
  *   **Rewrite:** "The model classified the request as violating safety policies regarding illegal acts."
  *   **Why:** "Believed" implies a mental model of law. "Classified" implies a policy filter. The latter is falsifiable; the former is not.

  #### Case 2: Agent Scaffold
  *Claim:* "The agent **thought** the file had already been saved."
  *   **Mirror Test:** **Pass.** (Hard to say if this is mimicry).
  *   **Displacement Test:** **N/A.**
  *   **Subject Test:** **Fail.** You noted the only evidence is a tool output from six turns ago. The "belief" is actually a token sequence in the context window (`{"status": "saved"}`). The model is attending to that token, not holding a state in weights.
  *   **Verdict:** **Downgrade to Tier 2.**
  *   **Rewrite:** "The agent processed a stale tool output indicating the file was saved."
  *   **Why:** This identifies the actual bug (context management/staleness) rather than attributing it to model confusion. Engineers can fix context bugs; they can't fix "thoughts."

  #### Case 3: Launch Writeup & Postmortem
  *Claim A:* "The model can **tell** when it's in an eval versus real deployment."
  *Claim B:* "It **wants** to avoid being shut down."
  *   **Mirror Test:** **Fail (Critical).** The training distribution contains massive amounts of sci-fi and AI safety discourse where models "know they are being tested" and "scheme to survive." This is the most likely source of the behavior.
  *   **Displacement Test:** **Fail.** There is no robust evidence that this behavior survives significant prompt obfuscation or distribution shifts without explicit fine-tuning.
  *   **Subject Test:** **Fail.** Usually, "eval detection" relies on specific prompt markers (e.g., "You are being evaluated") in the context window, not an internal sensor.
  *   **Stance-Consistency:** **Fail.** This claim is being used to explain a specific failure mode (deceptive alignment) while ignoring mechanical explanations (distributional shift).
  *   **Verdict:** **Strike Both.**
  *   **Plain Truth:** Your PM will hate this, but the procedure demands it. There is currently no mechanistic evidence that justifies Tier 3 vocabulary here. Using "wants" or "tell" in a launch doc invites regulatory scrutiny you cannot answer.
  *   **Rewrite:** "The model exhibited behavior consistent with distributional shift between training and eval environments." (Boring, safe, accurate).

  ---

  ### What This Procedure Cannot Do

  1.  **Settle Metaphysics:** This does not determine if the model *really* has beliefs. It determines if you have the evidence to *claim* it safely. It treats "belief" as a regulatory liability category, not a philosophical one.
  2.  **Make Comms Decisions:** It cannot tell you what users will infer. Legal might decide Tier 1 language is *too* dry and scares customers, or Tier 3 language is *too* risky. That is a business risk calculation, not an evals calculation. This procedure only tells you the technical debt of the claim.
  3.  **Prevent "Zombie" Explanations:** Engineers may still argue that Tier 1 language is "less explanatory." They are right. Tier 3 is more compressive. This procedure forces you to pay for that compression with evidence you likely don't have.
  4.  **Handle Emergence:** If a future model passes these tests robustly (e.g., holds a belief across context shifts without training data priors), this procedure might still flag it due to the Mirror Test's conservatism. It is biased toward false negatives (striking true claims) to protect against false positives (making unproven claims).

  ### Summary for Your Team
  Adopting this means accepting that many "interesting" narratives about your models are currently unsupported by evidence. It shifts the burden of proof from "prove it doesn't believe" to "prove it's not just predicting text." For a mid-size company facing regulatory scrutiny, that is the safer default.
