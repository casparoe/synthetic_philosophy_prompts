  # Future Contingents: A Decision Tree
  **Start:** The sentence *"There will be a sea battle tomorrow,"* asserted today.

  ### **Node 1: The Excluded Middle**
  Consider the disjunction: **"Either there will be a sea battle tomorrow or there won't."**
  Is this whole sentence **True** today?
  *   **NO** (It is indeterminate/gappy) → Go to **Node 2A**.
  *   **YES** (It is definitely true) → Go to **Node 2B**.

  ---

  ### **Node 2A (If "NO" to EM): The Historian Test**
  Imagine a historian in 2060 asking about 2050. All records are lost.
  Does her claim *"There was a sea battle"* have a **truth value** (True/False) now?
  *   **NO** (Truth requires evidence/knowledge) → **Leaf 1: Epistemic Anti-Realism** *(Unoccupied)*.
      *   *Diagnosis:* Unattractive. Collapses truth into evidence; implies history is unknowable without records.
  *   **YES** (Truth depends on what happened) → Go to **Node 3A**.

  ### **Node 2B (If "YES" to EM): The Historian Test**
  (Same case as above). Does the historian's claim have a **truth value** now?
  *   **NO** (Truth requires evidence/knowledge) → **Leaf 1: Epistemic Anti-Realism** *(Unoccupied)*.
  *   **YES** (Truth depends on what happened) → Go to **Node 3B**.

  ---

  ### **Node 3A (Open Future Branch): Status of the Claim**
  Back to the sea battle tomorrow. You said the disjunction isn't true.
  Is *"There will be a sea battle"* **False**, or **Neither True nor False**?
  *   **FALSE** (It claims necessity, which fails) → **Leaf 2: Peirceanism**.
  *   **NEITHER** (Truth-value gap) → Go to **Node 4A**.

  ### **Node 3B (Bivalence/Super Branch): Status of the Claim**
  Back to the sea battle tomorrow. You said the disjunction is true.
  Is *"There will be a sea battle"* **True/False** now, or **Indeterminate**?
  *   **INDETERMINATE** (But the disjunction is supertrue) → **Leaf 3: Supervaluationism**.
  *   **TRUE/FALSE** (Bivalence holds) → Go to **Node 4B**.

  ---

  ### **Node 4A (Gap Views): Ontology of the Future**
  Does the future event (the battle) **exist** right now, waiting to be experienced?
  *   **NO** (Only past/present exist) → **Leaf 4: Growing Block Theory**.
  *   **YES** (Eternalism, but logic is 3-valued) → **Leaf 5: Łukasiewicz Logic**.

  ### **Node 4B (Bivalent Views): Structure of Time**
  Is time a **single linear line**, or a **branching tree** with one "actual" path?
  *   **SINGLE LINE** → **Leaf 6: Ockhamism**.
  *   **BRANCHING + ACTUAL PATH** → **Leaf 7: Thin Red Line**.

  ---

  ### **Leaves Summary**
  1.  **Epistemic Anti-Realism:** Truth = Knowability. (Unoccupied/Unattractive).
  2.  **Peirceanism:** "Will" implies necessity; contingents are False.
  3.  **Supervaluationism:** Truth = True on all histories; Future is indeterminate.
  4.  **Growing Block:** Future does not exist; no truthmaker.
  5.  **Łukasiewicz:** Future exists but is logically 3-valued.
  6.  **Ockhamism:** Bivalence holds; we are just ignorant of the fact.
  7.  **Thin Red Line:** Branching time, but one branch is metaphysically privileged.

  ---

  ### **Instructor's Margin Notes**

  **⚠️ Indistinguishable Positions:**
  *   **Ockhamism vs. Thin Red Line:** This tree sorts them by *ontology* (Linear vs. Branching), but empirically they function identically for truth values. Students often pick TRL because "branching sounds cool," but logically they collapse on bivalence.
  *   **Peirceanism vs. Supervaluationism:** Students conflate these. Peircean says $p$ is *False*; Supervaluationist says $p$ is *Indeterminate*. Node 3A/3B splits them, but students often answer "Neither" for both.

  **⚠️ The Determinism Caveat:**
  *   If the underlying dynamics of the universe are **deterministic**, the "Open Future" leaves (Łukasiewicz, Supervaluationism, Growing Block, Peircean) effectively collapse into **Ockhamism**. If the future is fixed by physical law, there is no metaphysical gap to ground the 3-valued or supervaluationist distinctions. This tree assumes **indeterminism**.
