answer: |-
  Here is an analysis of the dialectic, the candidate rules, and the predictions for your new cases, culminating in a proposed decisive experiment.

  ### 1. Precise Formulation of Candidate Rules

  To distinguish these rules, we must define them not just by their labels, but by the necessary and sufficient conditions they posit for phenomenal consciousness (P-consciousness), and how they handle the gap between ontology (what exists) and epistemology (what we can know).

  **Rule 1: Local Recurrence (LR)**
  *   **Ontology:** P-consciousness is identical to sustained, recurrent processing within modality-specific sensory cortices. Global access (broadcast to frontoparietal networks) is a separate process required for report and control, but not for experience itself.
  *   **Epistemology:** We infer recurrence from neural markers or from behavioral capacity (e.g., cueing). First-person report is evidence of access, not a constitutive requirement for experience.
  *   **Key Divergence:** Predicts P-consciousness can exist without global availability or report (Overflow).

  **Rule 2: Global Availability (GA)**
  *   **Ontology:** P-consciousness is identical to (or necessarily supervenes on) information being made available to a capacity-limited global workspace (frontoparietal ignition).
  *   **Epistemology:** If content is globally available, it is, in principle, reportable. If it is not reportable (even in principle), it is not conscious.
  *   **Key Divergence:** Predicts P-consciousness cannot exceed access. "Experience without access" is a category error.

  **Rule 3: Report-First Epistemic (RF)**
  *   **Ontology:** Agnostic or deflationary. The verdicts are not about what *is* there, but about what we are *warranted in attributing*.
  *   **Epistemology:** P-consciousness is attributed if and only if there is first-person report (or a direct proxy like waking from a dream) combined with systemic similarity to the attributer.
  *   **Key Divergence:** Predicts refusal to rule whenever report is absent or unreliable, regardless of neural activity. Cannot positively attribute experience to unreported items (contradicts Partial-Report verdict).

  ### 2. Predictions for the New Cases

  **Case 1: The Frontoparietal Patient (FP-Patient)**
  *   *Features:* Intact occipital recurrence (adaptation/pupil), damaged frontoparietal ignition (no EEG ignition), no report, trained dissociated button press.
  *   **LR Prediction:** **Yes.** The occipitotemporal cortex is intact and showing recurrent signatures (adaptation). The lack of ignition explains the lack of report, but not the lack of experience. The trained button press suggests a sub-cognitive route from sensory cortex to motor output, bypassing the damaged workspace.
  *   **GA Prediction:** **No.** The ignition network is damaged. Information is encapsulated in sensory modules. This is structurally identical to blindsight (which she ruled "No"). The button press is unconscious discrimination.
  *   **RF Prediction:** **Refusal (or No).** The subject explicitly denies seeing. There is no first-person report. The "similarity to us" is compromised by the lesion. The button press is behavior, not report. This mirrors the Hypnotic Blindness refusal (Behavior says Yes, Report says No).

  **Case 2: The Artificial Global Workspace (AGW)**
  *   *Features:* Explicit GW architecture, broadcast, self-monitoring report module. *Caveat:* Report module is epiphenomenal (ablation changes nothing).
  *   **LR Prediction:** **No.** There is no biological sensory cortex with recurrent loops. The "modules" are functional abstractions, not biological sensory tissue. (Consistent with her "not interesting" verdict on LLMs).
  *   **GA Prediction:** **Yes.** The system instantiates the functional definition: capacity-limited bottleneck, broadcast, global availability. The causal idleness of the report module is irrelevant to the *availability* of the content within the system.
  *   **RF Prediction:** **No.** Lacks "similarity to us" (biological substrate). The report is causally idle, making it less like human report (which is typically coupled to action).

  ### 3. Best Guess: Which Rule is M. Running?

  M. is running **Local Recurrence (LR) constrained by a Report-Based Epistemic Policy.**

  **Reasons for preferring LR over GA:**
  The decisive evidence is her verdict on **Dreams** and **Partial Report**. She explicitly calls dreams "the cleanest case of phenomenal consciousness without access." A Global Availability theorist cannot coherently hold this position; for them, consciousness *is* a form of access (availability to the workspace). If she were GA, she would have to say dreams involve access (to the dreaming workspace) or deny they are conscious. Her commitment to "Experience > Access" rules out standard GA.

  **Reasons for preferring LR over RF:**
  A strict Report-First theorist could not rule "Yes" on the unreported items in the Partial-Report case. In that paradigm, the subject initially reports only ~4 items. M. verdicts that *more* were experienced. She is making an ontological claim that exceeds the immediate evidence of report. She infers experience from the *capacity* to report on cue, which implies she believes the sensory representation (Recurrence) was present even when unreported.

  **Why the Refusals? (Hypnosis & MCP)**
  This is where the Epistemic Policy comes in. M. believes Recurrence *constitutes* experience, but she treats First-Person Report as the **primary evidence** for the presence of that recurrence *for the subject*.
  *   In **Partial Report**, the cueing paradigm proves the recurrence was "for the subject" (available on demand), overriding the initial limited report.
  *   In **Hypnosis/MCP**, the evidence is conflicted. Neural/Behavioral markers say "Processing," but the Subject says "Nothing." Without a cueing paradigm that proves the content was available *to the subject* (rather than just processed by the brain), she refuses to override the subject's denial. She respects First-Person Authority when it conflicts with Third-Person data, unless the Third-Person data demonstrates *capacity for access* (as in Partial Report).

  **Summary of M.'s Position:**
  Consciousness *is* Local Recurrence. However, we only attribute it when we have evidence that the recurrence is "for the subject." Report is the gold standard evidence. Capacity-for-report (cueing) is secondary evidence. When Report says "No" and Capacity is unproven (Hypnosis), she suspends judgment.

  ### 4. The Decisive Future Case

  To distinguish **Local Recurrence (with Epistemic Constraint)** from **Report-First Epistemic**, you need a case where Recurrence is proven, Report is impossible, but *Capacity-for-Report* is demonstrated without actual Report.

  **The Case: The "Locked-In Cueing" Paradigm**

  **Setup:**
  Recruit a patient with total locked-in syndrome (no motor output, including eyes, verified by fMRI) but preserved occipital cortex and thalamocortical loops.
  1.  **Stimulus:** Present a visual array (e.g., oriented gratings) briefly.
  2.  **Neural Measure:** Use MEG/EEG to confirm stimulus-specific recurrent processing in visual cortex (proving LR condition is met).
  3.  **Report Constraint:** The patient cannot move to report. (RF condition fails).
  4.  **The Crucial Manipulation:** Use a **neurofeedback cue**. Instead of asking the patient to press a button, you ask them to *modulate their own sensory alpha rhythm* to indicate which item was cued. (Assume prior training establishes they can voluntarily modulate this rhythm even without motor output).
  5.  **Outcome:** The patient successfully modulates the rhythm to identify the cued item above chance, confirming the content was *available* to their voluntary control, despite zero motor report.

  **Divergent Predictions:**
  *   **Local Recurrence (M.'s likely view):** **Yes.** The neural recurrence is present (MEG), and the neurofeedback proves the content was available to the subject's voluntary system (overcoming the epistemic constraint). The lack of motor report is a performance error, not an absence of experience.
  *   **Report-First Epistemic:** **Refusal/No.** There is no first-person report (speech/movement). Neurofeedback is a physiological signal, not a "report" in the sense of similarity to us. The evidence does not touch "what it is like."
  *   **Global Availability:** **Yes.** (Assuming the neurofeedback loop counts as global availability). *However*, if you add a condition where the neurofeedback works *without* frontoparietal ignition (e.g., direct sensory-motor bypass), GA would say No, while LR would say Yes.

  **Why this tells the rules apart:**
  This case isolates the **Epistemic Constraint**. M. refuses on Hypnotic Blindness because the Subject says "No." She rules Yes on Partial Report because Cueing proves "Capacity." The Locked-In Cueing case provides **Capacity without Report.**
  *   If M. rules **Yes**, she confirms that Report is merely *evidence* for Recurrence/Capacity, not a requirement. This cements LR.
  *   If M. **Refuses**, she confirms that Report (or something very close to it, like speech/movement) is constitutive of the attribution, pushing her toward RF.

  **Recommendation for Friday:**
  Present the **FP-Patient** first. Ask: *"Is the occipital recurrence sufficient for experience here, or does the lack of ignition kill it?"*
  *   If she says **Yes**, GA is dead.
  *   If she says **No**, LR is dead.
  *   If she **Refuses**, RF is strengthened.

  Then present the **Locked-In Cueing** case as the follow-up: *"If we could prove they could select the item via brain signal, but they still couldn't move or speak, would that count as access?"* This forces her to reveal whether "Access" for her is a functional capacity (LR) or a communicative act (RF).
