answer: |-
  You have correctly identified that the standard lexicon of epidemiology and statistics lacks a single, canonical term for this specific *oscillating* configuration. While the components are well-understood, the recurrent reversal pattern you describe sits in a gap between the standard definition of Simpson's Paradox and the practical realities of high-dimensional confounding adjustment.

  Here is the carving you requested, followed by the boundary conditions and a proposed terminology.

  ### 1. Is there a name?
  There is no single established label in pharmacoepidemiology equivalent to "Simpson's Paradox" for this iterative phenomenon. In the literature, it is most often described descriptively as **"Sequential Simpson's Paradox,"** **"Iterative Reversal,"** or **"Multivariate Simpson's Paradox."**

  However, these terms are often used loosely. "Multivariate Simpson's Paradox" typically refers to a single reversal between the marginal and the *fully* conditional estimate, not necessarily a flip-flop at intermediate steps. "Sequential Reversal" is used more frequently in machine learning (fairness metrics) than in causal inference.

  ### 2. One Phenomenon or Two?
  You are right to suspect you are conflating two distinct things. The configuration you observe is the intersection of a **mathematical necessity** and an **epistemic limitation**.

  **Phenomenon A: Non-Monotonic Convergence of Conditional Associations (The Algebra)**
  This is a property of weighted averages. The marginal risk difference (or ratio) is a weighted average of the stratum-specific estimates. When you add a covariate, you change the weighting scheme and the homogeneity of the strata.
  *   **Mechanism:** There is no mathematical theorem requiring conditional estimates to converge monotonically to the causal effect as covariates are added. The path from the crude estimate to the fully adjusted estimate can wander through the parameter space, crossing the null line multiple times.
  *   **Status:** This is a deterministic feature of the data table and the arithmetic of standardization. It does not require "confounding" in the causal sense; it occurs whenever associations are heterogeneous across nested partitions.

  **Phenomenon B: The Sufficient Adjustment Set Ambiguity (The Epistemology)**
  This is the predicament you described: *every variable is a pre-treatment confounder, so standard advice says adjust for all, yet the sign depends on how many you measured.*
  *   **Mechanism:** This arises because "pre-treatment" does not equal "confounder." In modern causal inference (e.g., Hernán & Robins), adjusting for *all* pre-treatment covariates is not always correct (e.g., M-bias, instrumental variables, or colliders affected by prior causes).
  *   **Status:** This is an identification problem. The oscillation signals that you do not know which subset of covariates constitutes a **sufficient adjustment set**. The data alone cannot tell you when you have "finished" adjusting.

  **Verdict:** You are observing Phenomenon A, which creates the conditions for Phenomenon B to become a practical crisis. They are separable. You can have non-monotonic convergence (A) in a randomized trial (due to chance imbalance) without the epistemic worry (B). You can have the epistemic worry (B) without oscillation (e.g., estimates drift toward the null but never cross it).

  ### 3. Boundary Conditions
  You asked four specific questions about the demarcation of this phenomenon. Here are the answers based on the algebraic properties of the estimators:

  1.  **Does the reversal require strictness at every cell?**
      **No.** For the paradox to hold at a given level, the *aggregate* of that level must reverse relative to the level above. It does not require every single cell at the deeper level to conform. If 15 of 16 cells show one direction and the 16th is null or opposite, the weighted average can still reverse the sign of the higher-level aggregate. However, for the phenomenon to be considered "robust" rather than "driven by an outlier," the majority of cells should align with the deeper estimate.
  2.  **Does it require the deeper estimates to be individually significant?**
      **No.** Statistical significance is a function of sample size and variance; the paradox is a property of the point estimates (bias/direction). In claims data, as you descend to 16 or 64 cells, power will vanish. The paradox remains valid even if the deeper strata have wide confidence intervals that include the null, provided the point estimates consistently point in the opposite direction of the aggregate.
  3.  **Can the alternation continue indefinitely?**
      **Mathematically, Yes.** With continuous covariates or an infinite sequence of binary covariates, one can construct distributions where the conditional expectation $E[Y|X, Z_1, \dots, Z_k]$ oscillates across the null indefinitely as $k \to \infty$.
      **Practically, No.** In observational data, you are bounded by the **Positivity Assumption**. As you partition finer, cells become empty or near-empty. The sequence must terminate when the data can no longer support the estimation of the conditional effect.
  4.  **Does the alternation constrain the sign of the "fully adjusted" estimate?**
      **No.** The fact that the sign has flipped twice tells you nothing about the direction of the third flip or the final resting place. The "fully adjusted" estimate (adjusting for all measured pre-treatment covariates) is simply the estimate at the deepest level of *measured* granularity. It is not necessarily the *causal* effect. If the measured covariates include colliders or instruments, the final estimate may be *more* biased than the crude one, regardless of the oscillation pattern.

  ### 4. The Causal Carving (Why this matters for your work)
  You noted: *"the standard causal advice is to adjust for all of them, and yet the sign I would report then depends on how many confounders happen to have been measured."*

  This is the crux of the issue. In the potential outcomes framework, the goal is to adjust for a **sufficient set** of confounders (a set that blocks all backdoor paths).
  *   If $Z_1$ and $Z_2$ are both true confounders, the estimate adjusting for $\{Z_1, Z_2\}$ is generally preferred over $\{Z_1\}$.
  *   However, if the sign flips between $\{Z_1\}$ and $\{Z_1, Z_2\}$, it implies that $Z_1$ and $Z_2$ are correlated with each other and the treatment/outcome in a way that creates **seesaw confounding**.
  *   **Crucial Caveat:** If the sign keeps flipping, it is a strong diagnostic signal that your causal model (DAG) is misspecified. It often suggests that one of the "pre-treatment" variables is actually acting as an **instrumental variable** or is part of an **M-structure** (collider bias), despite appearing to be a confounder. Adjusting for an instrument amplifies residual confounding; adjusting for a collider induces bias. This can cause the estimate to swing wildly as variables are added.

  ### 5. Proposed Terminology
  Since no tight term exists, I propose you adopt **"Oscillating Confounding"** for the epistemic phenomenon and **"Sequential Reversal"** for the algebraic one.

  If you need a single term to label this configuration in a manuscript, I recommend:

  > **The Sequential Reversal Paradox**

  **Definition:**
  *A configuration in observational analysis where the direction of the association between an exposure and an outcome reverses sign more than once as successive pre-treatment covariates are added to the adjustment set. Formally, let $\hat{\theta}_k$ be the effect estimate adjusted for covariates $\{Z_1, \dots, Z_k\}$. A Sequential Reversal Paradox occurs if $\text{sgn}(\hat{\theta}_k) \neq \text{sgn}(\hat{\theta}_{k+1})$ for multiple sequential values of $k$, where each $Z_k$ is a priori hypothesized to be a confounder.*

  **Demarcation from Simpson's Paradox:**
  *   **Simpson's Paradox:** A single reversal between the marginal ($k=0$) and a specific conditional ($k=1$) estimate.
  *   **Sequential Reversal Paradox:** Requires $\geq 2$ reversals across a hierarchy of adjustment sets ($k=0 \to 1 \to 2 \dots$).

  **Demarcation from Non-Collapsibility:**
  *   **Non-Collapsibility:** Explains magnitude changes (and occasional sign changes in ORs) due to mathematical properties of the measure, even without confounding.
  *   **Sequential Reversal:** Implies the changes are driven by the *structure of confounding* (correlations between $Z$, $X$, and $Y$) rather than the metric alone. If the phenomenon persists using Risk Differences (which are collapsible), it is definitively Sequential Reversal, not non-collapsibility.

  ### Summary for your Manuscript
  You are not conflating two phenomena; you are observing an algebraic property (Sequential Reversal) that exposes an epistemic limitation (Sufficient Set Ambiguity). There is no constraint on the final sign, and the pattern does not terminate naturally until data sparsity forces it.

  If you encounter this, the appropriate response is not to report the "fully adjusted" model by default, but to present the **trajectory of estimates** (a "coefficient path" plot) and acknowledge that the oscillation indicates uncertainty regarding the causal structure of the covariates (e.g., potential collider bias or instrumental variables among the pre-treatment covariates). The data alone cannot resolve which level of adjustment is the "truth."
