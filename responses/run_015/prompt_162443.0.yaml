      *   *Tension A: (1) vs. (6).* (1) says it's statistical, not agential, doesn't need cleverness. (6) says adversarial is categorically different because the system *represents* the measurement. If (1) is the "core mechanism," does (6) undermine it? Or is (6) a subset? (1) says "you don't need anyone to be clever." (6) says "if they *are* clever, it's different." This seems manageable, but there's a risk of equivocation on "Goodhart." Is Goodhart one thing or two?
