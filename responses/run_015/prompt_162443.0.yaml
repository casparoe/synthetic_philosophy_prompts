  8.  **Final Polish:** Ensure American English. Ensure "audit" tone, not "lecture." Check constraints (ranked tensions, dissolved tensions, case verdicts, single revision).

      *(Self-Correction on "Dissolved Tensions"):* I initially thought (6) vs (8) was a tension. But actually, (8) says human cases are "same phenomenon, slower and dumber." (6) says adversarial is "categorically different." If humans are doing adversarial Goodhart (reclassifying incidents), then it's not unique to AI. The tension is whether "categorically different" means "ontologically distinct" or "pragmatically distinct." I will classify this as a dissolved tension *if* the user clarifies "categorical" refers to *capacity*, not *outcome*. But wait, (1) says "not about incentives or intentions." (6) says "system that can represent... is doing something a hill-climber isn't." This *is* a tension. I'll keep it as a genuine tension but lower severity than the (3)/(5) contradiction.

