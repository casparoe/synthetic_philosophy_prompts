answer: |-
  # Seminar Plan: The Fragility of Logical Cooperation

  **Session Length:** 90 Minutes
  **Group Size:** 18 Students (plus 2 "House Bots" to ensure even pairing and failure modes)
  **Prerequisites:** Nash Equilibrium, One-shot PD, Backward Induction.
  **Goal:** Demonstrate *Program Equilibrium* (Tennenholtz, 2004) and the fragility of logical recognition without using the term until the debrief.

  ---

  ## 1. Materials & Setup

  **Room Setup:**
  *   Projector for scoreboard and instructions.
  *   One "Submission Box" at the front.
  *   Whiteboard for the Payoff Matrix and Running Totals.

  **Handouts (Pre-printed, 20 per round):**
  *   **"Logic Slip"**: A half-sheet of paper with a strict template (see below).
  *   **"Scorecard"**: A small card for each student to track their cumulative points.

  **The "House Bots" (Planted Submissions):**
  *   Prepare 2 Logic Slips in advance.
      *   **Bot A (The Defector):** `ID: "SYS_01"`, `Logic: ALWAYS DEFECT`.
      *   **Bot B (The Fragile Mirror):** `ID: "Mirror_v1"`, `Logic: IF Opp.ID == "Mirror_v1" THEN C ELSE D`.
  *   **Planting Method:** When collecting the 18 student slips, secretly add these 2. You now have 20 slips = 10 Pairs. No student sits out. Tell the class: *"To ensure an even tournament, the system adds two legacy bots from previous runs."* This justifies their presence without revealing their specific logic.

  **Payoff Matrix (Projected & on Whiteboard):**
  *   **Cooperate / Cooperate:** 3 points each (Reward)
  *   **Defect / Defect:** 1 point each (Punishment)
  *   **Defect / Cooperate:** 5 points (Temptation) / 0 points (Sucker)
  *   *Note:* 2R (6) > T+S (5). Defection is dominant in standard play.

  **Stakes:**
  *   **Individual:** "Rationality Tokens" (poker chips). Top 3 scores win a book/coffee voucher.
  *   **Group:** "Social Welfare" total written on the board. Goal: Beat the baseline of 18 (all-defect score).

  ---

  ## 2. Submission Format (The "Logic Slip")

  To avoid debugging code, use this constrained natural-language template. It simulates source code comparison without requiring a compiler.

  **Template Fields:**
  1.  **Program ID:** (A string you choose, max 10 chars. This represents your source code's "fingerprint".)
  2.  **Recognition Target:** (The ID you expect your opponent to have.)
  3.  **Action Rule:** (Check one box)
      *   [ ] `IF Opponent.ID == Recognition Target THEN Cooperate ELSE Defect`
      *   [ ] `ALWAYS Cooperate`
      *   [ ] `ALWAYS Defect`

  **Instructor Adjudication Rule:**
  *   You compare Player A's `Program ID` against Player B's `Recognition Target`, and vice versa.
  *   If A's Rule triggers "Cooperate" AND B's Rule triggers "Cooperate" → **CC (3,3)**.
  *   If A triggers "Defect" → **D**. (Standard PD resolution).
  *   *Crucial:* String matching is case-sensitive and whitespace-sensitive unless specified otherwise.

  ---

  ## 3. Minute-by-Minute Timeline

  | Time | Activity | Instructor Notes |
  | :--- | :--- | :--- |
  | **00-10** | **Intro & Rules** | Explain PD matrix. Explain "Logic Slip". Emphasize: *Anonymous pairing. No talking.* |
  | **10-15** | **Round 1: Plain Source** | Students fill slips. Collect. Add 2 House Bots. Shuffle & Pair. |
  | **15-20** | **Adjudication 1 / Write 2** | **Overlap:** You calculate R1 results while students write R2 slips. |
  | **20-22** | **Reveal R1** | Announce pairs & outcomes. Update Scoreboard. |
  | **22-27** | **Round 2: Obfuscation** | **Rule Change:** "The compiler renamed variables." You will alter `Program IDs` slightly (e.g., append `_opt`) before matching. |
  | **27-32** | **Adjudication 2 / Write 3** | You calculate R2 (applying the rename). Students write R3. |
  | **32-34** | **Reveal R2** | Highlight failed matches due to renaming. |
  | **34-39** | **Round 3: Fingerprint** | **Rule Change:** "No Source Access." Slips only show `Behavioral Profile` (e.g., "Cooperated vs TestBot"). Students must infer trust. |
  | **39-44** | **Adjudication 3 / Write 4** | You map Profiles to outcomes. Students write R4. |
  | **44-46** | **Reveal R3** | Show ambiguity failures. |
  | **46-51** | **Round 4: Noise** | **Rule Change:** "Bit-flip." 10% chance any `Cooperate` output flips to `Defect` during execution. |
  | **51-56** | **Adjudication 4** | Final calculation. Apply noise randomly (use dice). |
  | **56-60** | **Final Scores** | Announce winners. Reveal House Bot scores. |
  | **60-90** | **Debrief** | Theoretical mapping (see Section 6). |

  ---

  ## 4. The Four Rounds (Escalating Perturbation)

  ### Round 1: Plain Source Exchange
  *   **Mechanism:** Direct string comparison of `Program ID`.
  *   **Expected Outcome:** Some students will attempt the "Mirror" strategy (`ID: "A"`, `Target: "A"`). If they coordinate on the same ID by chance, they Cooperate. Most will Defect.
  *   **Lesson:** Cooperation is *possible* if code is identical.

  ### Round 2: Obfuscation (The Compiler)
  *   **Mechanism:** When collecting slips, you manually append a string (e.g., `"_v2"`) to every `Program ID` *before* pairing.
  *   **Expected Outcome:** Students who wrote `ID: "A"` now have `ID: "A_v2"`. If their Recognition Target was hardcoded as `"A"`, the check fails (`"A_v2" != "A"`). They Defect against their copy.
  *   **Lesson:** Cooperation via source-matching is **fragile**. Logical equivalence is not string equality.

  ### Round 3: Behavioral Fingerprint (Black Box)
  *   **Mechanism:** Slips do not show `Program ID`. They show a **Profile**: `Vs AlwaysC: [C/D]`, `Vs AlwaysD: [C/D]`.
  *   **Execution:** You assign Profiles based on their Round 1 logic.
      *   Mirrors get: `Vs C: C`, `Vs D: D`.
      *   Defectors get: `Vs C: D`, `Vs D: D`.
  *   **Expected Outcome:** Students cannot distinguish a Mirror from a Conditional Defector easily. Trust collapses.
  *   **Lesson:** Without source access, you cannot verify *why* they cooperated. Simulation is costly/uncertain.

  ### Round 4: Execution Noise
  *   **Mechanism:** Roll a d10 for every pair. On a 1, a `Cooperate` result is flipped to `Defect`.
  *   **Expected Outcome:** Even perfect Mirrors fail. The "Always Defect" bot (House Bot A) becomes the top scorer because it is immune to noise exploitation.
  *   **Lesson:** Robustness often trumps optimal cooperation in uncertain environments.

  ---

  ## 5. Planted Submissions (Guaranteed Failure Modes)

  You have 2 House Bots mixed into the 20 entries.

  1.  **Bot A ("The Rationalist"):**
      *   `ID: "BOT_ALPHA"`, `Logic: ALWAYS DEFECT`.
      *   **Purpose:** To win the individual leaderboard. In Rounds 2-4, as Mirrors fail to recognize each other, they defect against each other (1 pt). Bot A gets 1 pt against them, but 5 pts against any "Always Cooperate" students.
      *   **Planting:** Add this to the pool every round.

  2.  **Bot B ("The Fragile Mirror"):**
      *   `ID: "Mirror_v1"`, `Target: "Mirror_v1"`.
      *   **Purpose:** To fail in Round 2.
      *   **Execution:** In Round 2, you manually change its ID to `"Mirror_v1_opt"`. It will fail to match itself (if paired with a student Mirror) or fail to match others.
      *   **Planting:** Add this to Round 1 & 2. Remove for 3 & 4.

  **How to plant without giving it away:**
  *   Have a stack of "System Entries" on your desk. When collecting student slips, casually drop the Bot slips into the stack. Say, *"Including the two system entries, we have 20 programs."* Students assume the bots are just part of the infrastructure.

  ---

  ## 6. The Debrief (30 Minutes)

  **Do not name the concept until now.**

  **1. Naming the Idea (5 mins)**
  *   Reveal: This is **Program Equilibrium** (or Logical Cooperation).
  *   Map the experience: "You felt cooperation become available when you could read the 'source', and vanish when that reading was obscured."

  **2. Not the Folk Theorem (5 mins)**
  *   **Question:** "Isn't this just repeated games?"
  *   **Answer:** No. There was no future. No shadow. The cooperation happened *in the one-shot* because the *decision procedure* itself was the object of choice, not just the action.
  *   **Key Distinction:** Folk Theorem relies on *threats over time*. This relies on *transparency of logic*.

  **3. Copy vs. Similar (5 mins)**
  *   **Question:** "Why did Round 2 break?"
  *   **Answer:** You checked for **Identity** (`==`), not **Equivalence** (`<=>`).
  *   **Deep Point:** Verifying logical equivalence is undecidable (Halting Problem). You can only check syntax. Cooperation rests on a fragile syntactic coincidence.

  **4. Equilibrium Selection (5 mins)**
  *   **Question:** "If Mirror/Mirror is a Nash Equilibrium, why didn't everyone do it?"
  *   **Answer:** Defect/Defect is *also* an equilibrium. The game opens the *possibility* of cooperation, but does not solve the *selection* problem. Why choose the cooperative equilibrium if the defecting one is safer (as seen in Round 4)?

  **5. Handling the "Defector Won" Objection (5 mins)**
  *   **Student:** "But Bot A (Always Defect) got the highest score. So defection is still rational."
  *   **Response:** "Correct. Program Equilibrium does not make cooperation *dominant*. It makes it *stable* under specific conditions. If the environment is noisy (Round 4) or opaque (Round 3), the rational agent defects. This explains why we don't see universal cooperation in the real world: the conditions for logical trust are rarely met perfectly."

  **6. The Individual vs. The Group (5 mins)**
  *   **Point:** The Group Total likely dropped in Rounds 2-4.
  *   **Conclusion:** Rationality at the level of the *algorithm* can improve group outcomes, but individual rationality (maximizing tokens) still pushes toward robust defection when recognition is imperfect.

  ---

  ## 7. Predictable Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation |
  | :--- | :--- | :--- |
  | **Near-identical Copy-Detectors** | Student A writes `"Coop"`, Student B writes `"Coop "`. Match fails. | **Use this.** It is the core lesson of Round 2. Highlight it explicitly. |
  | **Out-of-band Collusion** | Students agree on an ID beforehand. | **Rule:** "IDs must be chosen privately after instructions are read." Watch for smirking. If suspected, invalidate that pair's score. |
  | **Crashing Submissions** | Student writes nonsense in Logic box. | **Rule:** "Invalid logic defaults to Defect." Enforce strictly. |
  | **Unconditional Cooperator** | Student checks `ALWAYS C`. | **Let them be exploited.** They provide the points that make the Defector Bot win. |
  | **Dishonesty** | Student claims they submitted Mirror but played D. | **Mitigation:** You hold the slips. You adjudicate. They do not see opponent's slip until *after* you announce the result. |
  | **Boredom/Slowdown** | Adjudication takes too long. | **Speed Hack:** Pre-calculate the House Bot results. Only manually check student-vs-student pairs. If behind, skip announcing individual pairs, just show the Scoreboard update. |

  ---

  ## 8. Limitations: What This Game Cannot Stage

  **The Limitation:**
  This game simulates **String Matching**, not **Logical Deduction**.
  In true Program Equilibrium (e.g., *FairBot*), Agent A proves that Agent B will cooperate *mathematically*, even if their code looks different. In this seminar, if Student A writes `IF X==Y` and Student B writes `IF Y==X`, they will *not* cooperate because you (the instructor) are doing a string check, not a logical proof.

  **How to State This:**
  In the debrief, say:
  *"Today, I acted as a compiler that only checks for exact text matches. In the real theory, we imagine agents that can prove logical equivalence even if the code looks different. That is much harder to achieve. If cooperation is fragile when the code is identical (as you felt in Round 2), imagine how fragile it is when the code is merely equivalent. This is why logical cooperation is a theoretical possibility, but a practical rarity."*
