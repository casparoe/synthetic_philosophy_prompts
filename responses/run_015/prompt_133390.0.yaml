answer: |-
  Okay, here's the brain-dump and the session arc. Writing this fast between committees so forgive the shorthand.

  ### Quick Brain-Dump: The 3 Conceptual Knots in Neurath
  1.  **The Negation Problem:** If pictures are the language, how do you say "This is *not* the case"? Wittgenstein handles this with logical operators, but Neurath wants to avoid logical syntax. If ISOTYPE can't express negation or conditionals easily, is it really a *language* capable of scientific statements, or just a display system?
  2.  **Isomorphism vs. Coordination:** Wittgenstein's picture theory relies on *logical form* sharing structure with reality (isomorphism). Neurath hates this metaphysical baggage. For Neurath, the picture works because of *social convention* and physical coordination, not because it mirrors the ontology of the world. The knot is explaining how a picture carries "truth" without mirroring "logical form."
  3.  **Metaphysics via Absence:** Neurath claims pictures sidestep metaphysics because they lack grammatical hooks (like subject/predicate distinctions that lead to "What is the Subject?"). But doesn't the *choice* of what to picture reintroduce metaphysics? If I choose to visualize "death rates" but not "soul salvation," haven't I made a metaphysical prioritization? Avoiding grammar isn't the same as avoiding ontology.

  ---

  ### Session Plan: 50 Minutes
  **Goal:** Stop them from collapsing Neurath into Early Wittgenstein.
  **Vibe:** Workshop-ish, don't let them drift into pure logic seminar mode.

  #### 0-10 min: The Hook & The Trap
  *   **Recap Wittgenstein (*Tractatus*):** Briefly remind them of the Picture Theory. Propositions picture states of affairs. Logical form is the scaffold.
  *   **Introduce Neurath:** He's also doing "pictures," but he's a socialist empiricist, not a logical mystic.
  *   **The Dependency:** Before you show the example, you have to establish **Syntax-Free Coordination vs. Propositional Assertion**.
      *   *Tell them:* Wittgenstein cares about whether the picture *matches* the world's logic. Neurath cares about whether the picture *organizes* human behavior.
      *   *Why this matters:* If they think ISOTYPE is about "truth conditions," you've lost them. It's about "action conditions."

  #### 10-20 min: The Concrete Example (Mortality Comparison)
  *   **The Visual:** Show an ISOTYPE chart comparing mortality rates across 3 countries (e.g., UK, Germany, USA, 1930s).
      *   *Setup:* 1 icon = 10,000 deaths. Row A has 5 icons, Row B has 2 icons.
  *   **Why this works:** It's a **social fact** intended for **public policy**. Neurath's goal was "visual education" for the working class to empower decision-making. It's countable, physical, and actionable.
  *   **Why NOT a weather map:** Weather maps use isolines and symbols that represent theoretical fields (pressure systems) not directly countable objects. It leans too hard on physical theory, not social coordination.
  *   **Why NOT a chemistry diagram:** A benzene ring is a theoretical model of structure, not a direct count of observed entities. It invites metaphysical questions about "what bonds really are."
  *   **The Point:** The mortality chart doesn't say "Death is essence of X." It says "Here is how many bodies." It forces physicalism.

  #### 20-30 min: Misconception #1 & #2 ("Just Infographics" & "Wittgenstein did this")
  *   **Timing:** Hit this right after the example, around **minute 20-25**.
  *   **Misconception 1:** "This is just fancy infographics."
      *   *Pivot:* "Infographics decorate data; ISOTYPE *transforms* it according to strict rules. If you change the icon scale without a rule, you break the language. It's a syntax without words."
  *   **Misconception 2:** "Wittgenstein already covered this." (The big one).
      *   *Timing:* **Minute 30**.
      *   *Pivot:* "Wittgenstein's picture *shows* the logical structure of reality. Neurath's picture *hides* the logical structure to focus on physical comparison. Wittgenstein wants you to see the form; Neurath wants you to see the inequality."
      *   *Key phrase:* "Tractatus is about the limits of language; ISOTYPE is about the limits of bureaucracy."

  #### 30-40 min: Misconception #3 ("No Syntax = No Falsifiability")
  *   **Timing:** **Minute 35-40**.
  *   **The Hit:** They'll argue you can't falsify a picture. "How do you prove the icons wrong?"
  *   **The Fix:** Neurath doesn't care about absolute falsification in the logical sense; he cares about **decision**. The statement is accepted or rejected by the community based on observation protocols.
  *   **Pivot:** "You're looking for logical truth conditions. Neurath is offering behavioral acceptance conditions. It's not 'false,' it's 'rejected by the institute.'"

  #### 40-45 min: The Skip (Protocol Sentences)
  *   **What to skip:** The deep debate on the form of protocol sentences (Carnap vs. Neurath vs. Schlick). Specifically, whether a protocol sentence is "There is a red patch" (phenomenalist) or "Otto sees a red patch" (physicalist).
  *   **How to flag it:** "Now, there's a huge fight in the Circle about how we write down the observation itself—the protocol sentence debate. Neurath wants everything in physical language ('Otto sees'), not private experience ('Red here'). We're skipping the technical syntax of that because it'll eat 20 minutes, but just know: Neurath insists all science must be translatable into physical spatio-temporal coordinates."
  *   **Why:** They're sci-comm students, not metaphysicians. Don't let them get stuck on foundationalism.

  #### 45-50 min: Wrap & Check-for-Understanding
  *   **Summary:** Neurath isn't doing logic with images; he's doing politics with images.
  *   **The Question:** Put this on the screen/board for the last 3 minutes.

  > **Check-for-Understanding:**
  > "Look at these three visuals:
  > 1. A *Tractatus*-style logical diagram showing the truth-conditions of 'p & q'.
  > 2. An ISOTYPE chart showing 5 icons for Country A vs 2 icons for Country B.
  > 3. A decorative poster using icons to make a health brochure look 'friendly'.
  >
  > **Question:** Which feature distinguishes #2 from BOTH #1 and #3?
  > A) It uses images instead of words.
  > B) It relies on social convention for coordination rather than logical form or aesthetics.
  > C) It represents a state of affairs in the world."

  *   **Answer Key for you:** It's **B**.
      *   A is wrong because #3 also uses images.
      *   C is wrong because #1 also represents states of affairs (in Wittgenstein's sense).
      *   B captures Neurath's specific move: convention/coordination (vs. logic) and utility (vs. decoration).

  ---

  **Note to self:** Watch the clock on the Wittgenstein recap. They love talking about the *Tractatus* and will eat 15 mins just debating 2.1. Cut them off. Also, don't worry if the typo in my header ("dependancy") slips into the slide deck, keeps it human.

  Let me know if you need the handout sketch for the mortality icons.
