answer: |-
  **Endurantist:** Consider the visualization before us. The digital archive maps every石英 vein and iron clamp from the cornerstone laid in 1824 to the restoration completed last year. Despite the fact that not a single original atom remains in the structure, we stand before *the* Triumphal Arch. It is wholly present here, now, just as it was wholly present a century ago. The material turnover is incidental to its identity. What persists is the civic entity designated by law and sustained by public recognition.

  **Perdurantist:** I agree we stand before something significant, but I dispute the claim that what is "wholly present" is the same entity that stood here in 1824. The archive does not show a single substance undergoing qualitative change; it reveals a causal chain of distinct temporal stages. Each replacement event marks a boundary where one temporal part ceases and another begins. The Arch is not a three-dimensional object enduring through time; it is a four-dimensional fusion of these stages, extended across the temporal dimension just as it is extended across space. The continuity you perceive is merely the similarity and causal connection between adjacent temporal parts.

  **Endurantist:** But that causal connection is precisely what grounds the identity of artifacts. Unlike natural kinds, where material constitution is paramount, artifacts are defined by their function and the intentions that sustain them. The legal designation and curatorial oversight are not merely external labels; they constitute the principle of unity that binds these disparate materials into a single object. If the city council dissolved the monument's status and scattered the stones, the Arch would cease to exist, even if the matter remained. Therefore, the institutional continuity is metaphysically constitutive, not merely descriptive.

  **Perdurantist:** Here is where I must press an objection. You claim institutional recognition grounds diachronic identity, but this conflates metaphysical reality with social convention. The archive demonstrates that the physical history is a sequence of discrete events linked by causal relations. To say the Arch is "one object" because a legal statute says so is to outsource ontology to bureaucracy. If identity is transitive, and the matter is entirely distinct, what binds stage $t_1$ to stage $t_2$ is not identity but gen-identity—a relation of causal dependence. The legal status tracks this sequence, but it does not create a metaphysical unity where there is only a succession of parts. You are mistaking the continuity of a name for the continuity of a being.

  **Endurantist:** That is a compelling distinction, but it leads to an eliminativist impasse regarding our actual practices. If the Arch is merely a fusion of temporal parts, then preservation efforts are not about maintaining a single entity but about ensuring the existence of future temporal parts. However, this fails to explain the normative force of conservation. We do not preserve the Arch merely to extend a spacetime worm; we preserve it because *this* object, wholly present now, bears historical responsibility and meaning. Your four-dimensional analysis redescribes the situation accurately in terms of physics, but it fails to explain the phenomenology of heritage. It treats the unity of the Arch as an illusion projected over a sequence, whereas I argue that for artifacts, unity is imposed by function and recognition, making the object genuinely singular despite mereological flux.

  **Perdurantist:** I do not deny the utility of the singular concept for legal or curatorial purposes. My claim is ontological, not pragmatic. The archive allows us to see the "worm" explicitly. When you say unity is "imposed," you concede that it is mind-dependent. I argue that the mind-independent structure is the four-dimensional aggregate. The preservation practices you cite are perfectly explained on my view: we are causally influencing the future segments of the Arch's temporal extension. The disagreement is whether that extension constitutes a single enduring substance or a composite of parts. Given the total material replacement, the latter is the more parsimonious account of the physical data.

  **Endurantist:** Parsimony regarding matter should not override the ontology of artifacts. If I replace every cell in my body, I remain the same person because of psychological continuity. Similarly, the Arch remains the same because of functional and institutional continuity. To reduce it to a sequence of parts is to ignore the specific mode of existence artifacts possess. The archive records the history of *one* object, not the genealogy of many. If you deny the object is wholly present at each moment, you cannot make sense of the claim that the Arch *itself* was damaged in the war and *itself* was repaired. You are left saying a past temporal part was damaged and a future temporal part is repaired, which severs the moral and historical link we intend to preserve.

  **Perdurantist:** And I respond that the moral and historical link is secured by the causal relations between the parts, not by a mysterious enduring substance. The past segment was damaged; the current segment bears the scars or the repairs caused by that damage. We do not need strict identity to ground responsibility or meaning. We need causal continuity, which the archive confirms. The enduring substance is a projection we impose on a world of processes.

  **Endurantist:** Then we agree on the data but disagree on the categorization. You see a process labeled as an object; I see an object undergoing a process.

  **Perdurantist:** Precisely. And until we can determine whether artifacts are defined by their matter or their history, the archive will serve both our metaphysics equally well, even if it supports different ontologies.
