  **Constructive Audit Procedure**

  **Step 1: Existence Scan**
  *   **Question:** For every claim "there exists $x$", is $x$ defined by a formula or algorithm using prior inputs?
  *   **Sufficient Answer:** Yes; a witness is explicitly provided or computable.
  *   **Outcome:** **Reject** if No.
  *   **Type:** Mechanical.

  **Step 2: Contradiction Check**
  *   **Question:** Does any sub-proof assume $\neg P$, derive contradiction, and conclude $P$?
  *   **Sufficient Answer:** No; or Yes, but only if $P$ is negative ($\neg Q$).
  *   **Outcome:** **Reject** if $P$ is positive or existential.
  *   **Type:** Mechanical.

  **Step 3: Real Dichotomy**
  *   **Question:** Does the proof split cases on $x=y$ or $x>0$ for $x,y \in \mathbb{R}$?
  *   **Sufficient Answer:** No; or Yes, but only within a negative context.
  *   **Outcome:** **Reject** if used to establish existence or positive facts.
  *   **Type:** Judgment.

  **Step 4: Choice Principle**
  *   **Question:** Is AC, Zorn's Lemma, or "pick arbitrary" used for infinite sets?
  *   **Sufficient Answer:** No.
  *   **Outcome:** **Reject** if Yes.
  *   **Type:** Mechanical.

  **Step 5: Completeness**
  *   **Question:** Is the Least Upper Bound property used for general bounded sets?
  *   **Sufficient Answer:** No; only for located sets.
  *   **Outcome:** **Reject** if Yes.
  *   **Type:** Judgment.

  **Limitations:** This procedure detects non-constructive steps; it cannot generate constructive proofs or verify computational complexity. It flags missing witnesses, not inefficient ones.
  **Handling Specifics:** Proofs by contradiction are valid only for negative statements. Choice principles are banned for infinite collections.
  **Final Decision:** If all steps pass: **Accept**. If any step triggers Reject: **Reject**. If foundational reliance is ambiguous: **Refer** to editor with question: "Is this axiom acceptable?"

  ***

  **Case 1: Bounded Increasing Sequence**
  **Audit:** Step 1 fails. The limit $L$ is asserted to exist. Step 5 fails. Standard proof uses $L = \sup \{a_n\}$. Constructively, bounded sets do not necessarily have suprema. The epsilon-N argument typically assumes $L$ exists to define $N$.
  **Decision:** **Reject**.
  **Reason:** The limit is not constructed. The proof relies on the non-constructive completeness axiom.
  **Fix:** Authors must prove the sequence is Cauchy with a known modulus of convergence, or restrict to sequences where the supremum is computable. The current claim is too strong for intuitionistic analysis.

  ***

  **Case 2: Intermediate Value Theorem**
  **Audit:** Step 3 fails. Proof splits on "$f(c)=0$ or $f(c) \neq 0$". Equality on reals is undecidable. Step 1 fails. Exact root claimed.
  **Decision:** **Reject**.
  **Give Up:** The exact equality $f(c)=0$. Constructively, one cannot decide if a continuous function hits zero exactly.
  **Survives:** The Approximate IVT: $\forall \epsilon > 0, \exists c \in [a,b]$ such that $|f(c)| < \epsilon$. The bisection method constructs a Cauchy sequence converging to a root, but verifying the value is zero requires LEM.
  **Instruction:** Authors must rewrite the theorem to assert approximate roots only. Exact roots are unavailable without additional information (e.g., local monotonicity). This is the standard constructive compromise.

  ***

  **Case 3: Parity Lemma**
  **Audit:** Step 3 check. Split is on $n \in \mathbb{N}$ parity. Equality on $\mathbb{N}$ is decidable. Step 2 check. No contradiction used for existence.
  **Decision:** **Accept**.
  **Reason:** Natural number properties are computationally decidable. Splitting cases on even/odd is valid intuitionistically. No existence claims lack witnesses.
  **Note:** This is a standard constructive proof pattern. No changes required. The proof relies on discrete decidability, which is permitted.
