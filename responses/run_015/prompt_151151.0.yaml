  To the Members of the Curatorial Ethics Board and the Office of the Director

  It is the decision of the Curatorial Ethics Board to recommend approval with binding curatorial conditions for the proposed flagship gallery The Unbroken Covenant. This recommendation emerges from a rigorous deliberation regarding the ethical implications of presenting the nation as a single continuous collective agent stretching from the medieval civic assembly of 1247 to the present republic. While the Board acknowledges the curatorial intent to foster a sense of inherited moral obligation and civic cohesion, we must simultaneously address the serious historiographical concerns raised during our review. The primary objection lodged against the proposal argues that the exhibition commits a retrospective coherence fallacy by projecting modern national identity onto historical populations who possessed no such self-conception. This constructivist critique posits that collapsing radically different political regimes, such as feudal estates, imperial administrations, and revolutionary committees, into one narrative thread of shared national intentionality constitutes a category error. If left unaddressed, this framing risks deceiving the public about historical agency by implying that a peasant subject in the thirteenth century was a moral participant in a covenant they neither understood nor consented to, thereby sanitizing the violence and discontinuity inherent in regime change. The Board finds this objection to be substantively correct regarding the raw historical record, and we agree that an exhibition suggesting an ontological unity where there was only retrospective attribution would violate our ethical mandate to avoid misleading the public.

  However, the Board also accords significant weight to the counter-argument that denying all diachronic continuity is itself philosophically suspect and practically untenable for a civic institution. As noted by the defense of the proposal, collective identity necessarily involves constructive narration, and the modern republic does in fact operate on the legal and moral presumption that it is the successor to previous regimes. We inherit debts, treaties, and territorial obligations, and we acknowledge commitments made in our name by predecessors we did not choose. To sever these links entirely in the name of historical purity would be to render the concept of national responsibility unintelligible, suggesting that current citizens bear no relationship to the actions of their predecessors. The Board recognizes that a museum of civic history must navigate the tension between historical accuracy and the lived reality of political identity, where the nation is treated as a moral person regardless of the anachronism involved. Therefore, the ethical path forward is not to reject the narrative of continuity outright, but to ensure that the museum presents this continuity as an interpretive framework rather than an immutable historical fact. The goal is to maintain narrative coherence without suppressing historical discontinuity, allowing visitors to understand how the idea of the nation was constructed over time without being misled into believing that the nation existed as a conscious agent throughout that time.

  To achieve this balance, the Board mandates specific curatorial conditions that must be implemented before the gallery opens. First, all labeling protocols must distinguish clearly between historical actors who claimed national continuity and the historical reality of their political context. Wall text and object labels should not state that the medieval assembly acted for the nation unless qualified by language indicating that this is a retrospective interpretation adopted by the current republic. Second, there must be spatial or temporal separation of regimes within the gallery design to visually disrupt the implication of an unbroken flow. Transitions between feudal, imperial, and revolutionary eras should be marked by distinct architectural breaks or lighting changes that signal to the visitor that a fundamental shift in political ontology has occurred, even if the narrative thread continues. Third, mandatory contextual panels must be installed at the entrance and at key junctures within the gallery to explicitly discuss the historiography of national identity. These panels should inform the public that the concept of an unbroken covenant is a contested narrative device used to foster civic unity, acknowledging the constructivist critique directly within the exhibition space itself. By making the construction of the narrative part of the narrative, the museum can honor the director's vision of intergenerational obligation while respecting the historian's duty to avoid anachronism.

  The Board believes that these conditions allow the museum to maintain its role as a steward of public trust while still engaging with the profound questions of civic identity that the director seeks to explore. We recognize that this compromise requires additional curatorial labor and may complicate the visual flow of the gallery, but it is necessary to prevent the exhibition from becoming a vehicle for historical mythmaking that obscures the reality of past political lives. The strongest argument against the proposal, which warns that treating the nation as a diachronic moral agent risks deceiving the public about historical agency, is validated by these requirements rather than dismissed. We are effectively agreeing that the continuity is real only insofar as it is believed and enacted by subsequent generations, not because it exists as a natural fact in the past. This approach respects the intelligence of the visitor, inviting them to contemplate how nations are imagined and sustained rather than passively receiving a streamlined origin story. The Board stands ready to work with the curatorial team to refine these conditions during the implementation phase, ensuring that the final installation meets both our educational mission and our ethical standards. We look forward to reviewing the revised design plans and label scripts in accordance with this decision.

  Sincerely

  Chair of the Curatorial Ethics Board
  National Museum of Civic History
