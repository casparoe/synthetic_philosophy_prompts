answer: |-
  ### I. Mechanistic Modeling of Informational Regimes

  We model the citizen-state interface as a repeated game of information revelation, where the fundamental resource is the privacy-loss budget ($\epsilon$). The state acts as the analyst/verifier, and the citizen acts as the data subject/curator. The regimes differ in the allocation of $\epsilon$, the composition rules governing budget depletion, and the defined threat model.

  **1. The German Regime: Local-DP with Strict Sequential Composition**
  *   **Mechanism:** User-controlled Local Differential Privacy (LDP). The citizen acts as a trusted curator of their own data, injecting noise locally before transmission.
  *   **Budget Allocation:** $\epsilon_{citizen}$ is finite and strictly partitioned by *purpose*. Each distinct state query draws from a disjoint sub-budget.
  *   **Compositional Accounting:** Strict sequential composition applies. Privacy loss accumulates linearly or quadratically across queries ($\sum \epsilon_i$). Once the purpose-specific budget is exhausted, the mechanism returns $\perp$ (null), enforcing purpose limitation as budget insolvency.
  *   **Threat Model:** The State is a semi-honest adversary. It follows the protocol but attempts to maximize inference utility beyond the authorized $\epsilon$. High adversarial noise is injected on the state side to prevent linkage attacks across purposes.
  *   **Utility Function:** Maximizes $U(autonomy)$ subject to $L(state\_inference) \leq \tau$. High utility loss for state aggregation is an accepted cost of maintaining individual robustness.

  **2. The American Regime: Two-Sided Transparency with Audit Trails**
  *   **Mechanism:** Centralized aggregation with post-hoc auditability. Privacy is not guaranteed by input noise but by the probability of detection via immutable logs.
  *   **Budget Allocation:** Asymmetric. $\epsilon_{state}$ is low (FOIA mandates high state transparency/low state secrecy). $\epsilon_{citizen}$ is high (weak minimization norms allow near-exact data collection).
  *   **Compositional Accounting:** Loose approximate composition ($\delta > 0$). Budgets reset contextually or are monetized. The system tolerates higher $\delta$ (probability of catastrophic privacy failure) provided the event is logged and remediable via litigation.
  *   **Threat Model:** State opacity and unaccountable third-party aggregators are the adversaries. The citizen is exposed to high inference risk but retains the right to audit the auditor.
  *   **Utility Function:** Maximizes $U(market\_efficiency) + U(democratic\_audit)$. Privacy loss is treated as an externality to be priced or litigated rather than a hard constraint.

  **3. The Chinese Regime: Centralized Aggregator with Asymmetric Visibility**
  *   **Mechanism:** Trusted Central Aggregator. The State holds the private key; citizens submit exact data ($\epsilon_{citizen} \to \infty$).
  *   **Budget Allocation:** Citizen $\epsilon$ is effectively infinite for state queries. State $\epsilon$ is near-zero regarding internal logic (algorithmic governance is opaque).
  *   **Compositional Accounting:** Unlimited adaptive composition for the state. The state can perform arbitrary repeated querying on citizen data without budget depletion.
  *   **Threat Model:** Social instability and coordination failure are the adversaries. Individual privacy leakage is treated as noise reduction necessary for signal clarity.
  *   **Utility Function:** Maximizes $U(social\_coordination)$. Individual utility loss is discounted heavily in the global objective function.

  ### II. Translation of Normative Commitments

  We translate the political norms into constraints on the privacy-utility trade-off space.

  *   **Autonomy (Germany) $\rightarrow$ Control over $\epsilon$-Allocation:**
      Autonomy is modeled as the citizen's exclusive right to allocate their privacy budget across queries. It imposes a hard constraint on sequential composition: $\epsilon_{total} = \sum \epsilon_{purpose\_i}$. Any mechanism allowing adaptive reuse of $\epsilon$ across purposes violates the autonomy constraint.
  *   **Democratic Accountability (USA) $\rightarrow$ Low State $\epsilon$ + Audit Logs:**
      Accountability is not citizen privacy, but state transparency. It requires minimizing the state's privacy budget ($\epsilon_{state} \approx 0$) while maintaining robust audit trails. The normative claim is that $Risk(state\_corruption) < Risk(citizen\_exposure)$.
  *   **Social Harmony (China) $\rightarrow$ Maximized Inference Utility:**
      Harmony is modeled as the minimization of variance in social behavior prediction. It requires maximizing the state's inference utility ($1/\epsilon_{effective}$) by eliminating citizen-side noise. The normative claim is that $Utility(coordination) \gg Loss(individual\_robustness)$.

  ### III. Residue Report

  This section identifies the fidelity loss when mapping normative concepts to information-theoretic terms.

  **1. Clean Mappings**
  *   **Purpose Limitation $\leftrightarrow$ Sequential Composition:** The German legal requirement that data collected for X cannot be used for Y maps cleanly to partitioning $\epsilon$ budgets such that $\epsilon_X \cap \epsilon_Y = \emptyset$.
  *   **Transparency $\leftrightarrow$ Low $\epsilon_{state}$:** FOIA requests function as queries that deplete the state's secrecy budget, forcing high-fidelity responses.
  *   **Surveillance Risk $\leftrightarrow$ Cumulative $\epsilon$:** The fear of a surveillance state maps directly to the risk of unbounded compositional accumulation of privacy loss.

  **2. Distorted Mappings (Forced Isomorphisms)**
  *   **Human Dignity $\leftrightarrow$ Adversarial Robustness:** Dignity is an intrinsic status; adversarial robustness is a probabilistic guarantee against inference. Mapping dignity to robustness reduces a deontological claim to a consequentialist calculation (i.e., dignity is preserved *so long as* $\epsilon$ remains below a threshold). This distorts the concept by making dignity gradable and revocable based on utility needs.
  *   **Consent $\leftrightarrow$ Budget Authorization:** In mechanism design, consent is often modeled as signing a key to release $\epsilon$. However, legal consent requires comprehension and voluntariness. In DP, "consent" is merely a parameter setting. This maps a qualitative moral agreement to a binary cryptographic operation, stripping the normative weight of coercion or power asymmetry.
  *   **Justice/Fairness $\leftrightarrow$ Uniform $\epsilon$ Allocation:** Treating all citizens as having identical privacy budgets ignores structural vulnerabilities. A uniform $\epsilon$ might offer equal *mathematical* privacy but unequal *social* protection (e.g., marginal groups are more easily re-identified at the same $\epsilon$).

  **3. Untranslatable Residue**
  *   **Legitimacy:** A mechanism can be differentially private ($\epsilon$-bounded) yet politically illegitimate (e.g., a perfectly private census used to target an ethnic minority). DP measures *leakage*, not *usage*. The normative question of whether the state *should* exist in the data processing loop has no expression in $\epsilon$.
  *   **The Right to be Forgotten:** DP provides asymptotic indistinguishability. It does not support deletion. Once $\epsilon$ is spent, the information is theoretically "leaked" within the bound. The normative claim of erasure (resetting the history) contradicts the additive nature of compositional accounting.
  *   **Power Asymmetry:** DP assumes a symmetric protocol definition. It cannot model the coercive capacity of the state to *change* the mechanism mid-game. A citizen cannot "opt-out" of a mechanism that is a prerequisite for existence (e.g., social credit), rendering the "budget" conceptualization moot.

  ### IV. Conclusion: Deficiency or Precision?

  The untranslatable residue indicates a genuine deficiency in framing citizenship through differential-privacy mechanics, rather than merely clarifying underspecified norms.

  Differential privacy operationalizes *secrecy* and *inference risk*, but citizenship is constituted by *power* and *recognition*. The DP framework treats information as a fluid resource to be metered ($\epsilon$), whereas normative governance treats information as a constitutive element of the relationship between subject and sovereign.

  When we map "dignity" to "robustness," we do not make the concept precise; we evacuate it. We replace a claim about the status of the human with a claim about the stability of a database. The residue (legitimacy, coercion, erasure) is not noise; it is the signal of the political dimension that information theory filters out.

  Therefore, the DP vocabulary is insufficient for comparative information governance. It excels at auditing the *efficiency* of privacy protection within a fixed mechanism but fails to evaluate the *legitimacy* of the mechanism itself. The normative concepts were not underspecified analogues of information-theoretic trade-offs; they were distinct categories of political theory that resist reduction to budget allocation. To treat them as such is to commit a category error, mistaking the constraints of the channel for the rights of the sender.
