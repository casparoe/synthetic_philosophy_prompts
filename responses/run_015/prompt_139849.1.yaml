  I'm the second marker for a third-year seminar on consciousness, and I would like an independent first reading of one script before I commit to a mark. The course ran in the usual order: Jackson's knowledge argument, the ability hypothesis (Lewis, Nemirow), the phenomenal concept strategy (Loar, Papineau), and a final week on whether any of these replies do more than defuse a single argument. The paper was open-book, three questions from six; this is Question 3, which I set myself, because I was tired of reading the same rehearsed paragraphs about the original case every year and wanted to see whether anyone could say something about a variant I have been calling Prosthetic Mary, in which the abilities on Lewis's list are instilled by cortical intervention while Mary is still in the room and while — by her own report, and by every behavioural and neural measure available to us — nothing changes for her subjectively at all. My hope was that it would force students to say whether those abilities have to be grounded in the experience itself rather than merely co-instantiated with it; perhaps a third of the class took the bait. I have now marked sixty-one scripts on very little sleep, my eye is sliding over things, and I have a stake in the question in a way that makes me a poor judge of how well it has been answered.

  Here is the question exactly as it appeared on the paper:

  Question 3 (25 marks). Jackson's Mary knows all the physical facts about human colour vision before she leaves the black-and-white room, and she learns something when she sees red for the first time. (a) Set out the knowledge argument as tightly as you can, making explicit any premise that is not stated in those two sentences. (b) Explain how the ability hypothesis responds to it, and explain how that response differs from the phenomenal concept strategy. (c) Now consider Prosthetic Mary. Before her release, neurosurgeons reconfigure her visual system so that she can imagine red on demand, pick red things out reliably in any scene, and recognise and re-identify red on later occasions — every ability on Lewis's list — while by her own report, and by every behavioural and neural measure we have, she undergoes no conscious experience of red and nothing whatever changes for her subjectively. Does Prosthetic Mary know what it is like to see red? Discuss what the case shows about the two replies in (b): does it tell against them equally, or against one and not the other? Answer in no more than 700 words.

  And here is the script, transcribed verbatim apart from a spelling correction; it came in at 640 words.

  Script 47, Question 3.

  (a) The argument needs a suppressed premise. Explicitly: (1) Before her release Mary knows every physical fact about human colour vision. (2) On release she learns something she did not know before — what it is like to see red. Jackson's inference goes through only if learning is always a matter of coming to know a fact, that is, only if all knowledge is propositional. So the missing premise is (3): if someone learns something, then there is some fact that they have come to know. From (1), (2) and (3) it follows that (4) there is a fact about what it is like to see red which is not a physical fact, and physicalism is false. In his earlier work Jackson went further and inferred that qualia are causally inert, though he later abandoned the argument altogether; the argument itself does not depend on that further claim, since it is an argument about the extent of Mary's knowledge and not about the causal powers of experiences.

  (b) The ability hypothesis — Lewis and Nemirow — denies that Mary gains any new knowledge at all. Knowing what an experience is like is not knowing a fact but having a capacity: to imagine the experience, to recognise it when it occurs, to remember it. Since none of that is propositional, premise (3) fails, and the argument never gets off the ground. The phenomenal concept strategy is the same reply under another description. It also says that what Mary acquires is not a new fact but a new concept, and a concept just is a cluster of abilities — the ability to deploy a recognitional-demonstrative mode of presentation of the very property she already knew about under a physical description. Loar's and Papineau's versions differ only in how they tell the story about what the new concept refers to; the mechanism, and the reason the argument fails, are exactly as in Lewis and Nemirow. Mary acquires abilities rather than knowledge, and so there is no additional fact for the physicalist to find room for. Both replies are therefore purely epistemic: they explain why it seems to Mary that she has learned something without conceding any non-physical fact.

  (c) Prosthetic Mary has all of the abilities. So if knowing what red is like just is having those abilities, then Prosthetic Mary knows what it is like to see red while she is still in the room, before she has ever seen anything red — which is absurd. The ability hypothesis is therefore refuted: the case shows that the abilities are neither necessary nor sufficient for the knowledge, and once Lewis has built the knowledge out of abilities, the case pulls them apart. The phenomenal concept strategy, by contrast, is untouched by Prosthetic Mary, because it does not analyse knowing-what-it-is-like into abilities at all; it says that a genuinely new concept is acquired, and concepts are not abilities. The physicalist should accordingly abandon the ability hypothesis and rely on the phenomenal concept strategy. That is the right result anyway, since the phenomenal concept strategy is the stronger reply: unlike the ability hypothesis it also does something about the explanatory gap — the sense that something is left unexplained even once all the physical and functional facts are in — which is a different datum from the one the knowledge argument trades on, and one the ability hypothesis was never designed to handle.

  What I want from you is the reading itself, not a model answer. Give me a mark out of 25, with the class boundary at 18 for a first, and say where in the distribution of a competent third-year cohort you would expect this script to fall. Then give me the comments I should actually write in the margin: keyed to specific claims in the answer, point by point, with anything wrong named as wrong and the reason it is wrong spelled out at the level of the argument rather than the slogan. I am interested in the distinction between what is mistaken and what is merely loose or incomplete, and equally in anything that is right in a way a hasty marker would under-credit; if a step fails to follow, I want to know which premise or which move is doing no work, and if the student has taken a claim of one reply and quietly substituted a different one, I want that identified precisely. Do not rewrite the answer for me and do not check anything against the literature — I am not asking what anyone in fact said, and I will not hold you to it; I want the conceptual assessment. Finally, if you think the question as I have set it is defective in some way — if Prosthetic Mary, as described, is incoherent, or if it cannot do the work I want it to do — say so in a separate note after the mark, but grade the script as it stands against the question as set.
