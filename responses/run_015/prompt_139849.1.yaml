  **Mark:** 17/25
  **Distribution:** High 2:1 (Top of the second-class band, just below the First boundary).

  **Marginal Comments:**

  *   **(a) Premise (3):** Clear identification of the propositional knowledge assumption. This is the standard weak point of the argument, and you state it cleanly.
  *   **(a) Jackson's later views:** Irrelevant to the logical reconstruction requested. Not penalised, but note that epiphenomenalism is a separate issue from the knowledge argument itself.
  *   **(b) "The same reply under another description":** This is a strong claim. You argue here that PCS and AH share the *same mechanism* (acquiring abilities rather than knowledge). Keep this in mind for part (c).
  *   **(b) "Concept just is a cluster of abilities":** You have defined phenomenal concepts functionally here. This collapses the distinction between AH and PCS. If PCS is just AH with different vocabulary, any counterexample to one should hit the other.
  *   **(b) "Mary acquires abilities rather than knowledge":** Conceptually, this equates PCS with AH. Standard PCS distinguishes itself by allowing a new *concept* (and often new propositional knowledge *that* this is what it's like), whereas AH denies new knowledge entirely. You have erased this distinction.
  *   **(c) "Prosthetic Mary has all of the abilities":** Correct application of the case stipulations.
  *   **(c) "Ability hypothesis is therefore refuted":** Good intuition. If abilities can exist without experience, and knowledge-of-what-it's-like requires experience, then abilities are insufficient for that knowledge. You draw the right conclusion for AH based on your premises.
  *   **(c) "Phenomenal concept strategy... is untouched":** **Contradiction with (b).** In (b) you said PCS concepts *are* clusters of abilities. Here you say PCS is safe because concepts *are not* abilities. You cannot have it both ways. If concepts are abilities (as per (b)), PM has the concepts, and PCS fails just like AH.
  *   **(c) "Concepts are not abilities":** If you intend to distinguish PCS from AH here, you must explain *why* PM lacks the concept if she has the abilities. You assert she lacks the experience, but if the concept is not an ability, what grounds it? You need to explain why the concept requires experience if the abilities do not.
  *   **(c) "Explanatory gap":** This is a new claim not grounded in the previous analysis. It feels tacked on to bolster PCS. Without explaining how PCS closes the gap (when AH doesn't), this is assertion rather than argument.
  *   **General:** Strong engagement with the variant case, but the internal consistency between (b) and (c) undermines the final conclusion. You switch definitions of PCS to save it from the counterexample.

  **Note on the Question (Prosthetic Mary):**

  The variant is conceptually sound and does the work you intend. It effectively dissociates the functional/ability profile from the phenomenal character, which is the precise pressure point for the Ability Hypothesis. By stipulating that the abilities are present *without* the subjective change, you force the student to decide whether the abilities constitute the knowledge or merely accompany it.

  However, there is a potential vulnerability in how it interacts with the Phenomenal Concept Strategy (PCS). Most versions of PCS ground phenomenal concepts in the *experience* itself (often via an acquaintance relation or quotational mechanism). If Prosthetic Mary has no experience, she arguably lacks the phenomenal concept, regardless of whether concepts are abilities. The script you provided glosses over this, assuming PCS survives simply because concepts aren't abilities. A sharper student might argue that PM lacks the *concept* because she lacks the *experience*, meaning PCS fails too. Your question successfully traps the Ability Hypothesis, but it may let PCS off too easily unless the student recognises that PCS usually requires the very experience PM is stipulated to lack. You might consider tightening the prompt to ask explicitly whether PM possesses the *phenomenal concept*, not just the abilities. But as it stands, it is a valid and productive thought experiment.
