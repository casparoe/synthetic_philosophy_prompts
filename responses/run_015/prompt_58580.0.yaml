answer: |-
  **MEMORANDUM**

  **TO:** University Faculty Senate
  **FROM:** Secretary, Ad Hoc Committee on Electoral Reform
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Voting Procedure for Senate Chair Election

  **Purpose**
  The Ad Hoc Committee on Electoral Reform writes to recommend a course of action regarding the proposal to adopt Ranked-Choice Instant Runoff Voting (RCV) for the annual election of the Senate Chair. This proposal rests on the stated ground that RCV would *fully eliminate* incentives for insincere voting. While the Committee agrees that reform is necessary following last April's election, we must advise the Senate that the proposal's justification conflicts with fundamental mathematical constraints inherent in our Charter.

  **The Charter's Mathematical Constraint**
  Our Charter directs us to prefer a deterministic single-winner system satisfying three desiderata: unrestricted domain (accepting any ballot configuration), non-imposition (any candidate can win), and strategy-proofness (no voter benefits from insincere ranking), without establishing a dictator. 

  It is crucial for the Senate to understand that these conditions cannot be jointly satisfied when there are three or more candidates. This is a established result in social choice theory (the Gibbard-Satterthwaite Theorem). Any voting system that allows every candidate to win and accepts any ranking of preferences will, in some specific configurations of ballots, allow a voter to obtain a more preferred outcome by voting insincerely. To satisfy the Charter's third desideratum perfectly, we would need to restrict which ballots are allowed or empower a dictator whose top choice always wins. Since neither option is acceptable, we must acknowledge that *no* voting system can fully eliminate strategic incentives.

  **Illustrative Hypothetical**
  Consider the profile from last April: Candidate A (38%), Candidate B (33%), and Candidate C (29%). Under our current plurality system, C's supporters voted insincerely for B to prevent A's victory, resulting in a B victory. 

  Suppose we adopt RCV. In a sincere vote, C is eliminated first, and their votes transfer to B, yielding a B victory (62% vs. 38%). While this respects majority preference better than plurality, it does not eliminate strategy. Suppose A's supporters anticipate this transfer. If A's supporters insincerely rank C > A > B, C wins outright in the first round (67% vs. 33%). If A's supporters prefer B over C, this strategy fails. However, in other configurations, "burying" a strong rival by ranking them last can alter elimination orders to a voter's advantage. Furthermore, our deterministic tie-break by seniority introduces known constants; if voters know Candidate X is senior to Candidate Y, they may strategize to force a tie that favors X. Thus, even with RCV and deterministic tie-breaks, scenarios exist where sincerity is not the optimal strategy.

  **Assessment of Ranked-Choice Voting**
  The proposal claims RCV eliminates insincere voting incentives. This is factually incorrect. RCV *reduces* the pressure for "lesser-of-two-evil" voting compared to plurality, as voters can rank a favorite first without wasting their vote. However, it introduces different strategic complexities, such as the incentive to rank a strong competitor last to ensure their early elimination. RCV achieves majority support for the winner but does not achieve the Charter's standard of perfect strategy-proofness.

  **Recommendation**
  The Committee recommends **adopting Ranked-Choice Voting**, but **rejecting the proposal's stated justification**. We cannot fulfill the Charter's third desideratum because it describes a mathematical impossibility. Insisting on it paralyzes reform. Therefore, we advise the Senate to interpret the Charter's directive as a preference for systems that *minimize* rather than *eliminate* strategic incentives. RCV is superior to plurality in this regard, as it reduces the frequency and impact of tactical voting, even if it cannot eradicate them.

  **Next Steps**
  1.  **Vote on System:** The Senate should vote to adopt RCV for the Chair election, acknowledging it as the best available option despite theoretical limitations.
  2.  **Charter Amendment:** Simultaneously, the Senate should refer a minor Charter amendment to committee to revise the third desideratum from "no voter ever be able to obtain a more preferred outcome" to "minimize incentives for insincere voting."
  3.  **Voter Education:** Prior to the next election, the Administration must distribute clear instructions on RCV balloting to ensure faculty understand how to rank candidates sincerely without fear of wasting votes.

  By aligning our expectations with mathematical reality, we can implement a robust system that enhances legitimacy without promising the impossible.

  **CC:** Office of the Provost; Faculty Senate Steering Committee
