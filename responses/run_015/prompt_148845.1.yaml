      *   Avoid jargon overload, but keep it precise.

  6.  **Final Polish:** Check against constraints. No preface. Start directly.

      *(Self-Correction during drafting)*: I need to make sure R challenges the idea that "logical correlation" is enough for *normativity*. Just because I *predict* you will cooperate doesn't mean I *ought* to, if there's no causal lever. K needs to argue that the decision *is* the lever.

      *(Ontological Mismatch)*: Alpha cares about structure. Beta cares about experience. Alpha can't measure experience. R should point out Alpha might just burn resources pretending to care. K should argue Alpha commits resources *conditionally* on the logical proof that Beta will use them for experience.

      *(Verification)*: R says "You can't check." K says "You don't need to check if the decision is simultaneous in logical time."

      Let's write.

      *Wait, one more check:* The prompt asks for "two equally competent interlocutors." Neither should win decisively, but the arguments should be sharp.

