answer: |-
  Here's a breakdown of the desiderata for a solid theory of art. I've kept it loose but precise, hitting the classic puzzles, the psychology constraints, and that specific "negative labor" angle you mentioned.

  ### The Desiderata Checklist

  **1. The "Extensional Adequacy" Test (Handling the Cases)**
  A theory can't just sound nice; it has to get the right verdicts on the hard cases.
  *   **The Readymade:** It needs to explain why Duchamp's *Fountain* (a urinal) is art, but a random urinal in a gas station isn't.
  *   **The Forgery:** It needs to explain why a perfect visual copy of a Vermeer is *not* the same artwork as the original, even if you can't tell them apart with your eyes. (This kills pure aesthetic theories).
  *   **The AI Edge-Case:** It needs to handle images generated by Midjourney. Is the prompter the artist? Is the coder? Is it art at all if there's no human intention behind the specific pixels?
  *   **The Bad Art:** It must distinguish between "is this art?" and "is this good art?" A theory that says "all art is beautiful" immediately fails because there's plenty of terrible art.

  **2. The "Negative Labor" Constraint**
  This is the tricky one you flagged. Contemporary conceptual art often relies on the *absence* of traditional craft (painting, sculpting). However, that absence isn't accidental; it's a deliberate choice that requires **hidden institutional labor**.
  *   **The Problem:** The artwork looks like it took zero effort (e.g., a lightbulb screwed into a socket). But getting that lightbulb into a museum required networking, grant writing, theorizing, and logistics.
  *   **The Requirement:** The theory must acknowledge that the "work" isn't just the object, but the **contextual framing**. It can't collapse into "if it looks easy, it's not art," but it also shouldn't completely erase the labor of the framing process. It needs to account for the *social work* that substitutes for the *manual work*.

  **3. Psychological & Historical Constraints**
  *   **Cognitive Plausibility:** Don't demand that the average viewer know 500 years of philosophy to recognize a piece as art. If the theory requires a PhD to spot art, it's out of touch with how humans actually experience it.
  *   **Historical Openness:** Art changes. A definition that works for 18th-century portraiture but breaks for 1960s performance art is too rigid. The definition needs to be "open" enough to allow for new moves without letting *everything* in (like a random pile of trash that nobody intended to be art).

  ---

  ### The Friction Points (Jointly Unsatisfiable Desiderata)

  Here's where things get messy. You usually can't maximize all these values at once.

  **1. Intentionality vs. Institutional Uptake**
  *   **The Conflict:** If you say "Art is whatever the artist intends to be art" (Intentionalism), you risk making art too easy (a kid draws a scribble and claims it's a masterpiece). If you say "Art is whatever the Artworld accepts" (Institutionalism), you kill the rebel artist who is ahead of their time and gets rejected.
  *   **The Unsatisfiable Pair:** You cannot simultaneously require **universal accessibility** (anyone can recognize art) and **historical avant-garde status** (art often confuses people initially). If the theory respects the psychology of the viewer, it misses the cutting edge. If it respects the cutting edge, it alienates the viewer.

  **2. The "Negative Labor" vs. Democratic Access**
  *   **The Conflict:** To solve the "negative labor" problem, you have to admit that the *context* (gallery, lighting, press release) does the heavy lifting. But if you lean too hard on that, art becomes purely elitist—it's only art if the powerful institutions say so.
  *   **The Unsatisfiable Pair:** You can't fully expose the **hidden institutional labor** (making it clear that power dynamics created the art) while maintaining the **myth of artistic genius** (that the object itself holds magic). A theory that respects the sociology of the "negative labor" tends to demystify the art so much it stops feeling like "Art" with a capital A.

  ---

  ### Scorecard: How the Big Theories Stack Up

  Here's a quick run-down of how the usual suspects handle this list.

  **1. Institutionalism (Dickie, Danto)**
  *   **The Gist:** Art is art because the "Artworld" (galleries, critics, museums) confers that status upon it.
  *   **Passes:** Readymades, Bad Art, Historical Openness. It's great at explaining why a urinal in a museum is art and one in a bathroom isn't.
  *   **Fails:** **Negative Labor.** It actually *relies* on erasing the labor. It treats the institutional framing as a magic switch rather than a laborious process. It also struggles with AI (who confers the status? The user? The server?).
  *   **Verdict:** Strong on classification, weak on the *politics* of how that classification happens.

  **2. Functionalism / Aesthetic Theory (Bell, Fry)**
  *   **The Gist:** Art is defined by its ability to provoke a specific aesthetic experience (significant form, beauty, emotion).
  *   **Passes:** Psychological Plausibility. It matches how people actually *feel* about art.
  *   **Fails:** **Readymades & Negative Labor.** It flat-out rejects conceptual art. If there's no craft or beauty, functionalism says it's not art. It also collapses the distinction between "good art" and "art" (if it doesn't function aesthetically, it's not art).
  *   **Verdict:** Great for traditional media, useless for contemporary theory.

  **3. Hybrid Contextual-Intentionalism (Levinson, Davies)**
  *   **The Gist:** Something is art if it's intended to be regarded in a way prior artworks were regarded. It mixes intent with history.
  *   **Passes:** Forgeries (intent/history matters), Readymades (intended to be regarded as art), AI (gets tricky, but focuses on the human prompter's intent).
  *   **Fails:** **The Negative Labor Visibility.** It acknowledges the context, but often treats the "regard" as a mental state rather than a material labor. It also hits the **Intentionality vs. Uptake** wall: if an artist intends something but the context doesn't support it, is it art? The hybrid view sometimes waffles here.
  *   **Verdict:** The best all-rounder, but it glosses over the *power dynamics* involved in that "context."

  ### Bottom Line
  If you want a theory that handles the **Negative Labor** problem honestly, you probably need to push the Hybrid view toward a more sociological direction. You have to admit that "context" isn't just a mental framework; it's a supply chain of labor that gets erased when the work is displayed. Institutionalism sees the frame but ignores the carpenter; Functionalism ignores the frame entirely; the Hybrid sees the frame but treats it like magic.

  Your theory needs to make the carpenter visible without saying the painting isn't art. Good luck with that.
