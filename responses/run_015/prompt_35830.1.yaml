answer: |-
  Your friend has constructed a sophisticated version of a skepticism that has haunted the philosophy of history since the mid-20th century. It is essentially a *reductio ad absurdum* of the **Covering Law Model** of explanation (associated with Carl Hempel), combined with a robust psychological finding (hindsight bias).

  Your intuition is correct: the argument proves too much. If it holds for history, it holds for geology, forensics, epidemiology, and evolutionary biology. Since we generally accept that geologists *can* explain the K-Pg extinction (via the iridium layer, Chicxulub crater, etc.) even if they could not have predicted it from the Cretaceous, the argument must contain a flaw that distinguishes between *ex post facto* explanation and *ex ante* prediction.

  You should reject **Premise (2)**.

  Here is the breakdown of why this step is the defect, why it looked plausible, how rejecting it saves historical explanation (and geology), and what it costs you.

  ### The Defective Step: Premise (2)
  > *(2) To explain a historical outcome is to show that it was to be expected — that, given the antecedent conditions, it was more probable than its alternatives; an account that leaves the outcome looking like a fluke has not explained it.*

  **Why it looked fine:**
  This premise relies on the **Symmetry Thesis**, which was dominant in the philosophy of science in the 1950s and 60s. It posits that explanation and prediction are structurally identical: the only difference is temporal. If you can explain it, you could have predicted it; if you could have predicted it, you can explain it. This feels intuitive because we often associate "cause" with "necessity." If $A$ caused $B$, it feels like $B$ *had* to follow $A$. Therefore, a good explanation should make $B$ look inevitable.

  **Why it is wrong:**
  Philosophers of science (most notably Michael Scriven) dismantled this decades ago. Explanation is about identifying **causal mechanisms**, not calculating **prior probabilities**.
  *   **The Syphilis Example:** Paresis (a form of neurosyphilis) is caused only by syphilis. However, most people with syphilis do not develop paresis. If a patient develops paresis, the *only* valid explanation is "they had syphilis." Yet, given the antecedent condition (syphilis), the outcome (paresis) was highly *improbable*. Under your friend's Premise (2), we cannot explain paresis, which is absurd.
  *   **The Geology Example:** We explain the dinosaur extinction via an asteroid impact. But asteroid impacts of that magnitude are rare, low-probability events. A redacted stratigraphic column does not allow a geologist to *predict* the impact. But once we find the iridium layer and the crater, the explanation is robust.

  By rejecting (2), you decouple **intelligibility** from **inevitability**. You can explain *how* and *why* something happened without claiming it was *probable* that it would happen.

  ### The Fate of Premise (5) and the Conclusion
  You mentioned you want to keep **(5)**: *Therefore no historian can ever show that an outcome was to be expected.*

  If you reject (2), you can indeed keep (5), but you must strip it of its nihilistic force.
  *   **Friend's reading of (5):** Historians cannot show outcomes were expected, *and since explanation requires showing outcomes were expected*, historians cannot explain.
  *   **Corrected reading of (5):** Historians cannot show outcomes were expected (predictable), *but explanation does not require showing outcomes were expected*, so historians *can* explain.

  This allows you to concede the psychological point (hindsight bias prevents us from truly recovering *ex ante* probability) without conceding the epistemological point (that we cannot know causes).

  ### The Audit Test
  The "Audit Test" is simply an operationalization of Premise (2). It demands that a historical explanation function as a prophecy.
  *   **Why it fails:** It confuses **traces** with **signs**.
      *   A *sign* (prediction) points forward.
      *   A *trace* (evidence) points backward.
  *   Historians (like detectives and geologists) work with traces. The July Crisis documents are traces of the causal mechanisms that led to war. Asking a reader to predict the war from the documents without knowing the war happened is asking them to ignore the traces that only make sense *in light of the outcome*.
  *   **Example:** A detective finds a fingerprint on a gun. This explains why we suspect the butler. If you redact the murder and ask the detective, "Given this fingerprint, what will happen?" they cannot say "Murder." The fingerprint explains the murder *ex post*, it does not predict it *ex ante*. The Audit Test fails because it demands prediction from a discipline built on tracing.

  ### The Cost of Rejecting (2)
  Rejecting Premise (2) saves historical explanation, but it comes with a price tag you must be willing to pay.

  **1. The Loss of Determinism**
  You must accept that the past was genuinely contingent. The July Crisis did not *have* to lead to war; it was one possible path through a branching tree of possibilities. History is not a physics of human society where inputs determine outputs. It is a morphology of actualized paths. This undermines any claim that history reveals "laws of development" (e.g., Marxism, Whig history) that make the present inevitable.

  **2. The Loss of Predictive Utility**
  If explanation does not imply prediction, then studying history does not strictly equip you to predict the future. You can understand the causes of WWI without being able to predict WWIII. This hurts the pragmatic defense of history ("those who cannot remember the past are condemned to repeat it"). You can remember the past and still not recognize the antecedent conditions of a new crisis because the conditions are never identical, and the probabilities are never calculable.

  **3. Acceptance of "Narrative" as Cognitive**
  You have to defend a form of explanation that is often narrative in structure. Tracing a causal chain through time (A led to B, which created conditions for C) is different from subsuming an event under a general law. Some analytic philosophers find this unsatisfyingly "literary," but it is the only model that fits the historical sciences (geology, biology, history).

  ### Summary of the Move
  1.  **Grant (1):** Hindsight bias is real. We cannot recover true *ex ante* probability.
  2.  **Grant (5):** Historians cannot prove an outcome was *probable* or *expected*.
  3.  **Reject (2):** Explanation is not about probability/expectation; it is about **causal adequacy**.
  4.  **Reject the Audit Test:** It tests for prophecy, not causal tracing.
  5.  **Reject (6):** Historical explanation succeeds not by showing the outcome was inevitable, but by showing how the outcome was *produced*.

  **The Geology Conclusion:**
  If your friend insists the argument applies to geology, they are embracing **Scientific Anti-Realism** regarding all retrospective sciences. They would have to claim that we do not *know* the dinosaurs were killed by an asteroid, only that this is a story we tell because we know they died. This is a much heavier philosophical burden than admitting that history is contingent.

  **Final Advice:**
  Tell your friend: *"You have proven that historians are not prophets. I concede that. But you have not proven that historians are not detectives. Premise (2) assumes that to explain a crime, I must have been able to predict it. I only need to be able to identify the killer."*
