answer: |-
  **The scenario**
  Consider a common flatworm, *Planaria*, named "P," which reproduces via natural binary fission, a routine biological process requiring no exotic physics. Just prior to the physical split, biological criteria individuate two distinct organisms, "Lefty" and "Righty," based on their distinct future developmental trajectories and genetic continuity with the resulting halves, even though they currently share all physical matter and spatial boundaries. At this precise moment, both Lefty and Righty are fully constituted organisms of the same broad natural kind, occupying the exact same region of space, and neither is a proper part of the other since their boundaries coincide completely.

  **The endurantist's verdict**
  The endurantist is forced to conclude that there are two numerically distinct objects wholly present in the same place at the same time. Because Endurantism treats objects as wholly present at each moment, Leibniz's Law applies to their current properties, including modal properties regarding their future survival; since Lefty will survive as the left half and Righty as the right half, they possess different modal properties now, necessitating distinct identities despite their material coincidence.

  **The perdurantist's verdict**
  The perdurantist denies that two wholly present objects are co-located, viewing Lefty and Righty instead as distinct space-time worms that merely share a common temporal part at this stage. For the perdurantist, the overlap is not a problematic co-location of wholes but a standard sharing of temporal segments, much like two roads sharing a single mile of pavement without implying two roads exist wholly at that mile.

  **The feature doing the work**
  The divergence is generated by the combination of same-kind identity conditions and divergent persistence conditions (modal properties) applied to coincident matter. If the feature of divergent futures were removed—meaning both objects shared the exact same persistence conditions and trajectory—the endurantist could collapse them into a single object, but the fission case forces the modal distinction that fractures numerical identity without separating spatial location.

  **A defender's attack**
  A defender of Endurantism would likely attack the premise that distinct modal properties entail distinct present objects, arguing instead for ontic vagueness or temporal indexing of properties. They might claim that it is indeterminate how many organisms exist prior to the split, or that properties like "will survive as the left half" are not intrinsic to the present object but relational to future times, thereby avoiding the commitment to two wholly present entities.
