prompt: |-
  Next week I'm presenting at our policy school's political theory workshop and I need a Q&A prep sheet. My thesis: when someone is uncertain between moral views, she should sometimes take a safe Pareto improvement over the option her own favourite view ranks highest. I define a safe Pareto improvement as an option that (a) no moral view with more than, say, 5% of her credence ranks below the status quo, and (b) stays at least as good under every parameter setting the evidence leaves open, even scored maximin-style rather than in expectation (so robust along two axes at once: value-robust and evidence-robust). The argument is aimed against maximizing expected choiceworthiness across moral views; I say intertheoretic comparisons are too shaky for that, and that my rule also beats plain dominance because it bites under empirical uncertainty too. Case study: a large cash transfer program for people in extreme poverty, financed by a small tax on a narrow base. I claim it passes both tests even though there are identifiable losers and even though the prioritarian in me thinks a differently targeted, bigger program would do more good.

  The room: two welfare economists who live in cost-benefit analysis, QALYs and distributional weights; one luck egalitarian; one operations researcher who does robust decision making under deep uncertainty; one deliberative-democracy theorist who thinks any move of the form we don't need to say which moral view is right is technocracy in disguise; assorted grad students.

  Give me the seven or eight objections I'll actually get, ordered by likely-times-damaging, each phrased the way that particular person would put it (say who's asking), with roughly a two-minute reply and a note on where the reply is soft. Include what I should concede in the first two minutes, the one reply that has to land for the proposal to survive at all, and the objection I'm praying nobody raises.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Context:** Policy school political theory workshop.
      *   **Thesis:** Under moral uncertainty, sometimes choose a "Safe Pareto Improvement" (SPI) over the option ranked highest by your favorite view.
      *   **Definition of SPI:** (a) No moral view with >5% credence ranks it below status quo (Value-Robust), AND (b) Stays at least as good under every parameter setting evidence leaves open, even scored maximin-style (Evidence-Robust).
      *   **Target:** Against Maximizing Expected Choiceworthiness (MEC) due to shaky intertheoretic comparisons. Beats plain dominance by handling empirical uncertainty.
      *   **Case Study:** Large cash transfer (narrow tax base). Passes tests despite identifiable losers and prioritarian preference for a different/bigger program.
      *   **Audience:**
          1.  Two Welfare Economists (CBA, QALYs, distributional weights).
          2.  One Luck Egalitarian.
          3.  One Operations Researcher (Robust Decision Making/Deep Uncertainty).
          4.  One Deliberative Democracy Theorist (Anti-technocracy).
          5.  Assorted Grad Students.
      *   **Deliverables:** 7-8 objections (ordered by likely/damaging), phrased in the questioner's voice, 2-min reply, note on soft spots. Plus: Concessions (first 2 mins), The One Reply that must land, The Objection praying nobody raises.

  2.  **Deconstruct the Thesis & Vulnerabilities:**
      *   *Vulnerability 1 (Intertheoretic Comparison):* The thesis relies on comparing rankings across theories to establish "below status quo." If I can't compare utility/choiceworthiness across theories, how do I know Theory A ranks it lower than status quo?
      *   *Vulnerability 2 (Conservatism/Status Quo Bias):* The rule heavily favors the status quo. If the status quo is terrible (e.g., slavery), an SPI might be impossible or too weak.
      *   *Vulnerability 3 (The 5% Threshold):* Arbitrary. Why 5%? What if a view with 4% credence says it's hellish?
      *   *Vulnerability 4 (Empirical Robustness vs. Opportunity Cost):* Maximin-style empirical robustness is extremely demanding. It might rule out almost everything, leading to paralysis.
      *   *Vulnerability 5 (Democratic Legitimacy):* Hiding behind "uncertainty" avoids the hard political work of justifying *why* a policy is good.
      *   *Vulnerability 6 (The "Identifiable Losers" in Case Study):* Welfare economists will pounce on the tax payers. Is their loss really "not below status quo" for *all* theories? Libertarians might object.
      *   *Vulnerability 7 (Operations Researcher):* They know robustness trade-offs. They'll ask about the "price of robustness."
      *   *Vulnerability 8 (Luck Egalitarian):* Why protect the unlucky rich tax-payers over the unlucky poor?

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Welfare Economist):* Focus on the "Identifiable Losers." If there's a tax, someone loses. How is that Pareto?
          *   *Refinement:* They use Kaldor-Hicks usually. They'll ask about compensation tests.
      *   *Objection 2 (Deliberative Theorist):* This is technocracy. You're avoiding justification.
          *   *Refinement:* "Procedural legitimacy."
      *   *Objection 3 (Operations Researcher):* Maximin is too conservative. You'll never do anything.
          *   *Refinement:* "Price of Robustness."
      *   *Objection 4 (Luck Egalitarian):* Why does the 5% view get veto power? What about responsibility?
          *   *Refinement:* "Moral Hedging vs. Moral Commitment."
      *   *Objection 5 (Grad Student/General):* Intertheoretic comparison problem. You say it's shaky, but you use it to define "below status quo."
          *   *Refinement:* This is the *killer* objection. If I can't compare theories, I can't define SPI.
      *   *Objection 6 (Welfare Economist 2):* Distributional weights. You ignore intensity.
          *   *Refinement:* "Cardinality vs. Ordinality."
      *   *Objection 7 (Luck Egalitarian/Grad):* Status Quo Bias.
          *   *Refinement:* "Reactionary politics."

  4.  **Ordering by Likely/Damaging:**
      1.  *Intertheoretic Comparison (The Logical Trap):* If this fails, the definition collapses. (Grad Student or sharp Economist).
      2.  *Status Quo Bias/Conservatism (The Political Trap):* Makes the theory useless for reform. (Deliberative Theorist or Luck Egalitarian).
      3.  *Empirical Paralysis (The Practical Trap):* Maximin evidence robustness is too hard to satisfy. (Operations Researcher).
      4.  *The "Identifiable Losers" (The Case Study Trap):* Specific to the cash transfer example. (Welfare Economist).
      5.  *Technocracy/Legitimacy (The Normative Trap):* Avoiding moral argument. (Deliberative Theorist).
      6.  *Arbitrary Credence Threshold (The Parameter Trap):* Why 5%? (Grad Student).
      7.  *Intensity of Preference (The Measurement Trap):* Ordinal vs. Cardinal. (Welfare Economist).
      8.  *Moral Cowardice (The Personal Trap):* Why not fight for what you think is right? (Luck Egalitarian).

  5.  **Developing Replies & Soft Spots:**
      *   Need to be concise (2 mins).
      *   Need to acknowledge where the theory is weak (Soft Spot).
      *   *Key Concession:* Admit this isn't for *all* decisions, just high-stakes/irreversible ones under deep uncertainty.
      *   *The One Reply:* Must defend the coherence of "ranking below status quo" without full intertheoretic cardinality. (e.g., using ordinal rankings or "weak comparability").

  6.  **Refining the Voices:**
      *   *Welfare Economist:* Speak of efficiency, compensation, Kaldor-Hicks, QALYs.
      *   *Luck Egalitarian:* Speak of responsibility, brute luck, unfairness.
      *   *Ops Researcher:* Speak of regret, feasible sets, sensitivity analysis.
      *   *Deliberative Theorist:* Speak of public reason, legitimacy, contestation.
      *   *Grad Student:* Speak of literature, MacAskill, intertheoretic comparisons.

  7.  **Final Review against Constraints:**
      *   7-8 objections? Yes.
      *   Ordered by likely/damaging? Yes.
      *   Phrased in voice? Yes.
      *   2-min reply + soft spot? Yes.
      *   Concessions (first 2 mins)? Yes.
      *   One reply that must land? Yes.
      *   Objection praying nobody raises? Yes.

  8.  **Self-Correction during drafting:**
      *   *Correction:* Initially, I thought the Intertheoretic Comparison objection was the "Praying Nobody Raises" one. But it's too obvious. A grad student *will* ask it. The "Praying Nobody Raises" should be something deeper that undermines the *motivation*. Maybe the "Moral Buck-Passing" argument—that this is just cowardice disguised as rigor. Or perhaps a specific technicality about the "Evidence-Robust" clause that makes the set empty. Let's go with the "Empty Set" problem for the Ops Researcher. If the evidence uncertainty is truly "deep," the maximin set is empty. That kills the applicability.
      *   *Wait, actually:* The Intertheoretic Comparison objection is the most *damaging* logically. If I can't compare, I can't say "no view ranks this below status quo." I need to make sure the reply handles this. I will put it as #1.
      *   *The "Praying Nobody Raises":* Let's make it the "Reactionary Status Quo" point but framed specifically about *injustice*. If the status quo is grossly unjust, SPI forbids fixing it. That's a moral bullet too hard to bite.

      *(Self-Correction on "The One Reply")*: The prompt asks for "the one reply that has to land for the proposal to survive at all." This is likely the defense against the Intertheoretic Comparison objection. If I can't explain how I compare theories without full cardinality, the SPI definition is incoherent.

      *(Refining the "Concession")*: I need to concede that this is not a *complete* moral theory, but a *decision rule* for specific contexts (policy under uncertainty).

      *(Refining the Voices)*: Make sure the Welfare Economist sounds like they care about efficiency and the Deliberative Theorist sounds like they care about *process*.

  9.  **Final Polish:** Check tone, timing, and clarity. Ensure the distinction between Value-Robust (moral views) and Evidence-Robust (empirical parameters) is clear in the replies.

  *(Final check on the "Praying Nobody Raises" objection)*: I think the most dangerous one is actually from the Luck Egalitarian regarding *why* we hedge. If the 5% view is a racist view, do we give it veto power? That's the "Repugnant Credence" objection. I'll save that for the "Praying Nobody Raises" because it's morally explosive.

  *Wait, let's look at the prompt again:* "The objection I'm praying nobody raises."
  Okay, the "Repugnant Credence" (e.g., 5% credence in a view that says cash transfers are sinful/evil) is very strong. If I have 5% credence in a libertarian view that says taxation is theft, does that veto the program? My definition says "no moral view... ranks below status quo." If the Libertarian view ranks Taxation < Status Quo, then the SPI fails. This implies I can't do the transfer. That undermines the Case Study. I need to hope they don't press on *which* views count as "moral views."

  Okay, let's assemble the sheet.

  *Structure:*
  1. Opening Concessions.
  2. The One Reply.
  3. The 8 Objections (Voice, Reply, Soft Spot).
  4. The "Praying Nobody Raises" Objection.

  *Let's write it.*
answer: |-
  # Q&A Prep Sheet: Safe Pareto Improvements Under Moral & Empirical Uncertainty

  ## 1. Opening Concessions (First 2 Minutes)
  *Use this to disarm the room before they attack.*

  *   **Concede Scope:** "This is not a complete moral theory. It is a decision rule for *policy* under *deep uncertainty*. It is not meant for personal ethics or low-stakes decisions."
  *   **Concede Conservatism:** "Yes, this rule is conservative. It biases toward the status quo. I argue this is a feature, not a bug, when interventions are irreversible and moral knowledge is incomplete. But I grant it may be inappropriate in crisis situations where the status quo is catastrophic."
  *   **Concede the Threshold:** "The 5% credence threshold is a heuristic, not a moral law. It's meant to filter out fringe views without giving veto power to every conceivable objection. I'm open to adjusting this parameter based on the stakes."

  ## 2. The One Reply That Must Land
  *If you fail here, the definition of SPI collapses.*

  **The Objection:** "You claim intertheoretic comparisons are too shaky for Expected Choiceworthiness, but your definition of SPI requires knowing if a view ranks an option *below* the status quo. How do you compare 'below status quo' across theories without the very intertheoretic utility scale you rejected?"

  **The Reply:** "I am not requiring *cardinal* intertheoretic comparison (how much better is A than B?), only *ordinal* anchoring. Most plausible moral theories can internally rank 'Policy X' vs. 'Status Quo' without needing to know the exact 'choiceworthiness units' relative to other theories. We only need to know if Theory A sees the move as a *loss* relative to where we are. We can establish this via 'weak comparability'—checking if the internal logic of the theory treats the change as a violation of a constraint or a net harm, without needing to sum those harms across theories."

  ## 3. The Objections (Ordered by Likely × Damaging)

  ### 1. The "Empty Set" Objection (Operations Researcher)
  **Voice:** "I work with deep uncertainty. If you require an option to be robust across *every* parameter setting the evidence leaves open (maximin-style), your feasible set will be empty. In complex systems, there is always some model parameter where a tax-financed transfer crashes the economy. If your rule rarely selects an option, it's not a decision rule; it's paralysis."
  **Reply:** "You're right that strict maximin is paralyzing. That's why I pair it with the moral constraint. We aren't looking for the *optimal* robust option, but *a* robust option that clears the moral hurdle. In the cash transfer case, the evidence for 'small tax causes collapse' is not just uncertain, it's empirically thin. We distinguish between 'deep uncertainty' (unknown distributions) and 'model disagreement' (known competing models). SPI applies when the worst-case empirical scenario is still 'no worse than status quo' on the metrics that matter to the moral views."
  **Soft Spot:** If the empirical uncertainty is truly deep (e.g., climate geoengineering), your rule likely yields no action. You have to admit this limits the rule to "moderate" uncertainty contexts.

  ### 2. The "Technocracy in Disguise" Objection (Deliberative Theorist)
  **Voice:** "This is procedural obfuscation. By saying 'we don't need to agree on which moral view is right,' you aren't fostering consensus; you're bypassing the democratic requirement to justify *why* a policy is good. It's rule by uncertainty. You're telling citizens: 'We aren't doing this because it's just, but because it's safe.'"
  **Reply:** "I'm not suggesting we hide the moral reasons. We can still argue for the policy on prioritarian grounds. But for *coercive state action* under uncertainty, legitimacy requires that we don't impose high risks on minorities based on contested moral theories. This rule provides a public justification that citizens with different moral commitments can accept, even if it's not their first choice. It's a modus vivendi, not a replacement for public reason."
  **Soft Spot:** It does risk depoliticizing legitimate moral conflict. If the "safe" option is clearly inferior to the "just" option, prioritizing safety can look like cowardice.

  ### 3. The "Identifiable Losers" Objection (Welfare Economist #1)
  **Voice:** "In your case study, there is a tax. There are identifiable losers. A standard Kaldor-Hicks test says if winners *could* compensate losers, it's efficient. But your SPI requires that *no* moral view ranks the losers below status quo. A libertarian view with 6% credence says taxation is theft. That vetoes the program. So your rule blocks almost all redistribution."
  **Reply:** "That's a crucial test. If the libertarian view is in the >5% set, and it ranks taxation as worse than status quo *even under maximin empirical assumptions*, then yes, my rule blocks it. But I argue most plausible views (including moderate libertarianism) accept taxation for public goods if the empirical risk is low. The SPI forces us to design the tax to minimize the 'loss' signal to those views (e.g., narrow base, low rate) until it passes the threshold."
  **Soft Spot:** If the room accepts that a 6% libertarian view *must* veto redistribution, your theory becomes a status quo defense mechanism for the wealthy.

  ### 4. The "Status Quo Bias" Objection (Luck Egalitarian)
  **Voice:** "You're privileging the status quo. If the status quo is unjust (e.g., extreme poverty exists), requiring that no view sees the remedy as 'worse' gives veto power to views that tolerate injustice. Why should the uncertainty of the oppressor's theory protect the oppression?"
  **Reply:** "Because under moral uncertainty, *I* might be the one wrong about the injustice. If I impose a radical remedy that turns out to be harmful according to a plausible alternative theory, I've committed a moral wrong. The SPI minimizes the risk of *making things worse* according to any plausible story about value. It treats the risk of harming via action as morally weightier than the risk of harming via inaction, under uncertainty."
  **Soft Spot:** This is a hard sell. It implies that preventing potential harm trumps correcting actual injustice when theories conflict.

  ### 5. The "Intensity Ignorance" Objection (Welfare Economist #2)
  **Voice:** "You're using ordinal rankings ('better/worse than status quo'). But welfare economics cares about intensity. A small loss to many might outweigh a huge gain to a few, or vice versa. By ignoring cardinality, you ignore the *size* of the Pareto improvement. A tiny gain that passes SPI might be worse than a huge gain that barely fails it."
  **Reply:** "Correct, SPI sacrifices magnitude for security. That is the trade-off. When intertheoretic comparisons are shaky, we can't trust the 'size' of the gain across theories. We can only trust the direction. I'm arguing that under deep uncertainty, avoiding catastrophic moral error is more important than maximizing expected moral value."
  **Soft Spot:** This admits your rule is inefficient. In a resource-constrained policy school, "inefficient" is a dirty word.

  ### 6. The "Arbitrary Threshold" Objection (Grad Student)
  **Voice:** "Why 5%? If I have 4.9% credence in a view that says this policy is genocide, it gets ignored. If I have 5.1%, it vetoes the policy. This creates a cliff-edge instability in policy recommendation based on arbitrary credence assignments."
  **Reply:** "It is a heuristic, similar to significance levels in statistics. In practice, we should treat the threshold as a 'zone of caution.' As credence approaches 5%, the burden of evidence for robustness increases. The point isn't the exact number, but the principle that fringe views shouldn't paralyze action, but plausible minority views should constrain it."
  **Soft Spot:** It *is* arbitrary. If pressed, you have no non-arbitrary way to set the cutoff.

  ### 7. The "Moral Hedging vs. Commitment" Objection (Luck Egalitarian)
  **Voice:** "If you are a Prioritarian, you believe the bigger program is better. By choosing the SPI option, you are acting against your own moral conviction to hedge against views you think are less likely. Isn't this intellectual cowardice? Why not fight for what you think is right?"
  **Reply:** "It's not cowardice; it's humility regarding the *authority* to impose. I may believe View A is right, but I lack the epistemic authority to impose View A's risks on those who hold View B. Political power requires a higher standard of justification than personal action. I hedge because I am wielding state coercion, not because I doubt my own reasoning entirely."
  **Soft Spot:** Blurs the line between personal morality and political legitimacy.

  ### 8. The "Intertheoretic Incoherence" Objection (Grad Student / Economist)
  **Voice:** "You say we can't compare choiceworthiness across theories, but you assume all theories can rank 'Policy vs. Status Quo' on a common scale of 'better/worse.' If Utilitarianism says 'Better' and Deontology says 'Better,' are those the same 'Better'? If not, your Pareto condition is meaningless."
  **Reply:** "We don't need a common scale of 'goodness,' only a common scale of 'acceptability relative to baseline.' We are checking for *rejection*, not *optimization*. Most theories share a concept of 'making things worse' even if they disagree on 'making things best.' We are looking for overlapping consensus on non-worsening, not on the good."
  **Soft Spot:** This is the weakest logical link. Some theories might be incommensurable even on ordinal rankings.

  ## 4. The Objection You're Praying Nobody Raises
  **The "Repugnant Credence" Objection.**

  **The Question:** "Professor, suppose 6% of your credence is in a moral view that is racist or sexist—say, a view that holds cash transfers to *this specific group* of poor people are morally harmful because of their identity. Your rule says if >5% credence ranks it below status quo, you don't do it. Does your rule require you to veto anti-poverty programs because you assign non-zero credence to abhorrent views?"

  **Why it's dangerous:**
  1.  **Moral Trap:** If you say "Yes," you look complicit in racism/sexism.
  2.  **Logical Trap:** If you say "No," you admit the 5% threshold isn't about "plausible moral views" but "plausible *and acceptable* moral views," which means you *are* making a substantive moral judgment about which theories count, undermining your claim of neutrality/uncertainty.

  **Emergency Reply (if asked):** "The 5% filter applies to *plausible* moral views within the realm of public reason. Views that violate basic democratic equality or human rights are excluded from the set of 'moral views' eligible for veto power, not because of the credence number, but because they fail the threshold of political legitimacy required to participate in the social contract. We hedge among reasonable disagreements, not between justice and oppression." (This concedes that you *do* have some substantive moral commitments, but limits the damage).
