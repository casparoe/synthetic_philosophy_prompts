answer: |-
  You are grappling with the conflict between **consequentialist arithmetic** (net good) and **deontological constraints** (integrity, complicity, duty). Your current principle is purely consequentialist ("prefer the bundle"), which is why it fails to capture your revulsion in cases 5, 6, 7, and 9. You are implicitly applying constraints on *how* the good is achieved, not just *that* it is achieved.

  Below is a proposed framework, **The Principle of Constrained Moral Agency**, designed to systematize your intuitions. Following the principle, I apply it to your cases, the broker scenario, the new cases, and conclude with the verdicts you must abandon to achieve consistency.

  ### The Principle of Constrained Moral Agency

  A moral trade is permissible if and only if it satisfies **all four** of the following clauses:

  1.  **The Net Benefit Clause:** The expected value of the completed trade bundle (your action + their action) is strictly greater than the status quo, according to your best moral judgment.
      *   *Motivation:* Captures your baseline acceptance of Cases 1, 2, 10.
  2.  **The Integrity Clause:** The trade does not require you to assert a proposition you believe to be false, nor to lend your reputation or identity to a cause you believe to be harmful or false.
      *   *Motivation:* Explains Case 3 (Public Letter). Distinguishes *labor* (neutral) from *endorsement* (normative claim).
  3.  **The Complicity Clause:** You do not directly fund, enable, or perform an action that constitutes a **specific, active harm** to third parties. You may enable *waste* or *inefficiency*, but not *rights violations* or *active damage*.
      *   *Motivation:* Distinguishes Case 2 (Roof = Waste) from Case 6 (Litigation = Harm). Distinguishes Case 10 (Neighbor's time = General Resource) from Case 6 (Litigation Fund = Specific Weapon).
  4.  **The Fiduciary Clause:** You do not trade away a judgment or authority that you hold in trust for others (an institution, a community, or your own future self).
      *   *Motivation:* Explains Case 7 (Hiring Committee) and Case 8 (Manipulation of baseline).

  **Free Parameters:**
  *   **The Harm Threshold:** Clause 3 requires a definition of "active harm." Is it physical damage? Rights violations? Epistemic corruption? You must set this threshold.
  *   **The Marginal Impact Threshold:** Clause 3 applies to *direct* enablement. If your contribution is non-marginal (pooled), does complicity vanish? (See Broker analysis).
  *   **The Endorsement Scope:** Clause 2 applies to *assertions*. Does an anonymous signature count as an assertion? (See Case 4 analysis).

  ---

  ### Application to Your Cases

  *   **1 (Roof Repair):** **Accept.** Net Benefit (Yes). Integrity (No assertion). Complicity (Waste, not harm). Fiduciary (Your labor is yours).
  *   **2 (Anonymous Roof Fund):** **Accept.** Same as 1. Money enables waste, not harm.
  *   **3 (Public Letter):** **Refuse.** Violates **Integrity Clause**. Signing implies belief/endorsement.
  *   **4 (Anonymous Letter):** **Refuse.** (See below). Violates **Integrity Clause**. Anonymity hides the *who*, not the *what*. If the letter says "We believe," and you sign, you are lying, regardless of whether "We" is traceable.
  *   **5 (Canvassing vs. Housing):** **Refuse.** Violates **Complicity Clause**. Canvassing is active harm (restricting housing rights), not mere waste.
  *   **6 (Anonymous Litigation Fund):** **Refuse.** Violates **Complicity Clause**. Funding litigation is specific enablement of harm. Distinct from Case 2 because litigation actively harms opponents, whereas a roof is merely economically inefficient.
  *   **7 (Hiring Committee):** **Refuse.** Violates **Fiduciary Clause**. The vote belongs to the institution, not you.
  *   **8 (Pointless Trade):** **Refuse.** Violates **Fiduciary/Baseline**. The conditionality is fake; this is manipulation, not trade.
  *   **9a (Blackmail):** **Refuse.** Violates **Baseline**. The negative (abuse) is manufactured by the trader to force the deal.
  *   **9b (Protester):** **Accept.** Net Benefit (Yes). Integrity (No assertion). Complicity (Refraining from a right is not harm). Fiduciary (Your money is yours).
  *   **10 (Lawn/Harmful Writing):** **Accept.** This is the hardest case. It passes because of the **Specific vs. General** distinction in the Complicity Clause. You are paying for *nets*. The neighbor's use of *their own time* is a general resource transfer. You are not funding the *writing*; you are funding the *nets*. The harm is a foreseen side-effect of their freedom, not the direct object of your trade.

  ---

  ### Verdicts on Specific Questions

  #### 1. Case 3 vs. Case 4 (Public vs. Anonymous Signature)
  **Principle Verdict:** Both should be **Refused**.
  **Reasoning:** The Integrity Clause prohibits asserting what you do not believe. A signature on a letter is a speech act ("I endorse this"). Anonymity protects you from social retaliation, but it does not change the fact that you have added weight to a falsehood.
  **Advice:** If you accept 4, you are treating your signature as a commodity (ink on paper) rather than a testimony. This is self-deception. To be consistent with your refusal of 3, you must refuse 4. If you wish to accept 4, you must admit that 3 was refused only due to *reputational cost*, not moral principle.

  #### 2. The Broker Case (Escrow/Pooling/Anonymity)
  **Scenario:** You fund a pool that you know funds the Litigation (Case 6), but your $200 is diluted and non-marginal.
  **Principle Verdict:** **Accept.**
  **Reasoning:** This turns on the **Marginal Impact Parameter**.
  *   *Consequentialist View:* If your contribution changes nothing, you cause no harm.
  *   *Deontological View:* Are you "willing the harm"?
  *   *Resolution:* The Complicity Clause forbids *direct enablement*. If the broker structure ensures your money is **causally inert** (the litigation happens regardless, your money just offsets general costs), you are not enabling the harm. You are effectively donating to Bednets and letting a stranger donate to Litigation independently. The broker decouples the causality.
  *   *Caveat:* This only works if the *pool* is capped such that your money is truly non-marginal. If the pool expands to accommodate your money, you are still funding harm. Assuming true non-marginality, the "clean hands" objection dissolves because there is no dirt on the hands that matters.

  #### 3. New Case A: The Delusional Shrine
  **Scenario:** Counterparty believes a shrine prevents supernatural punishment. You think this is unlikely. They fund nets if you fund the shrine.
  **Principle Verdict:** **Accept (with conditions).**
  **Reasoning:**
  *   *Integrity:* You are not asserting the shrine works; you are funding a cultural ritual.
  *   *Complicity:* Is the shrine *harmful*?
      *   If the shrine is merely wasteful (burning incense, building wood): **Accept.** (Analogous to Case 1).
      *   If the shrine reinforces delusions that lead to tangible harm (e.g., discouraging medicine, inciting violence): **Refuse.** (Violates Complicity Clause).
  *   *Parameter:* You must assess the *expected harm* of the delusion. If the probability of harm is low, the trade stands.

  #### 4. New Case B: Binding Future Judgment
  **Scenario:** A donor pays now for you to commit to voting a certain way on a committee for the next 5 years.
  **Principle Verdict:** **Refuse.**
  **Reasoning:** Violates the **Fiduciary Clause** and **Autonomy**. You cannot sell the agency of your future self, who will have access to new information. A judgment held in trust (like a committee vote) cannot be pre-committed to a external payer. This is corruption, not trade.

  ---

  ### Frank Statement: Which Verdicts Must You Abandon?

  To adopt the **Principle of Constrained Moral Agency**, you must align your intuitions with the clauses. Here is the cost of consistency:

  1.  **You must refuse Case 4 (Anonymous Letter).**
      *   *Why:* Your refusal of Case 3 implies you believe signing the letter is morally wrong (lying/endorsement), not just socially costly. Anonymity does not fix the lie.
      *   *Cost:* You lose the ability to make "private compromises" on truth.
  2.  **You must scrutinize Case 10 (Lawn/Harmful Writing).**
      *   *Why:* You accept 10 but refuse 6. The distinction relies on "Specific Enablement" (6) vs. "General Resource" (10). This is a fragile distinction. If you *know* the neighbor will write the harmful piece, your labor is the *but-for cause* of that specific harm in that specific instance.
      *   *Cost:* Either you must refuse 10 (treating time-saving as direct enablement), or you must accept a version of 6 where the link is slightly attenuated. I recommend **refusing 10** if the harm is certain and significant. It is safer for your integrity to treat *known* enablement of harm as complicity, regardless of fungibility.
  3.  **You must clarify the Harm vs. Waste threshold (Case 2 vs. 6).**
      *   *Why:* You accept funding the roof (waste) but refuse funding litigation (harm). You need to explicitly define what counts as harm. Is preserving a church "harmful" to secularists? Is litigation "harmful" to developers?
      *   *Cost:* You must adopt a consistent definition of harm (e.g., "violation of rights" or "physical suffering") and apply it rigidly.

  ### Summary of Parameters for Your Use

  To apply this without coming back to me, fill in these blanks:

  1.  **Harm Definition:** I define "Active Harm" as ___________________ (e.g., physical injury, rights violation, verifiable misinformation). *Anything below this is "Waste" and tradable.*
  2.  **Endorsement Definition:** I consider an action "Endorsement" if ___________________ (e.g., my name is attached, I verbally affirm, I sign a document). *Anonymous signing counts as: [ ] Endorsement [ ] Labor.* (I recommend checking Endorsement).
  3.  **Marginality Threshold:** My contribution is "non-marginal" (and thus clean) if ___________________ (e.g., the outcome is fixed regardless of my input).
  4.  **Fiduciary Scope:** I hold judgments in trust for _________ (e.g., my employer, the public, my future self). *These cannot be traded.*

  If you fill these in consistently, the "all over the place" feeling will vanish, replaced by the rigid clarity of a principle that sometimes forbids you from doing great good to keep your hands clean. That is the price of the integrity you are implicitly demanding.
