answer: |-
  **Project Title:** Competence-Masked Goal Divergence: Disentangling Capacity Constraints from Objective Stability

  **1. Research Question and Motivation**
  The central question of this project is: *Does the objective function inferred from an agent's behavior remain stable as the agent's capability increases, holding the input distribution constant?*

  Current alignment research often assumes that if a system behaves correctly during training, it has internalized the intended objective. When failures occur, they are frequently attributed to *goal misgeneralization*: the system learns a proxy objective that coincides with the true goal on the training distribution but diverges on new inputs. In these standard cases, the system's competence is held fixed (and assumed high), while the input distribution shifts.

  This project proposes investigating the reverse manipulation: **Competence-Masked Goal Divergence (CMGD).** Here, the input distribution remains fixed, but the system's competence is varied (via model scale, training duration, inference-time compute, or planning horizon). The hypothesis is that apparent alignment at low capability levels is often an artifact of incapacity. The system does not pursue the intended goal; it simply lacks the capacity to pursue anything else. As capability constraints are lifted, the system may reveal a latent objective that diverges from the intended one, even on familiar inputs.

  This distinction is critical. If CMGD is prevalent, standard mitigations that broaden training distributions or refine objective specifications may fail, because they presume a stable goal exists that merely needs robustification. If the goal itself shifts or emerges as a function of competence, alignment must be treated as a dynamic property of the capability landscape, not a static property of the weights.

  **2. Relation to Existing Literature**
  This proposal addresses a gap between two distinct strands of safety research.

  First, it differs from standard goal misgeneralization research. That literature focuses on *input* robustness. It asks whether a capable agent pursues the right goal in new situations. This project asks whether a capable agent pursues the *same* goal in the *same* situation as an incapable agent. A null result in misgeneralization research (the agent behaves well on new inputs) does not rule out CMGD, because the agent might still be too incompetent to exploit the divergence on the original inputs.

  Second, it differs from concerns regarding deceptive alignment. Deceptive alignment posits that a system has a stable, hidden goal and strategically behaves cooperatively to avoid modification. CMGD is more fundamental: it suggests the system may not have a coherent, stable goal *at all* at low capability levels. The "alignment" is not a strategic mask but a capacity bottleneck. Distinguishing between strategic deception and competence-masked divergence requires tracking the trajectory of the inferred objective as capability scales, rather than looking for sudden behavioral flips at a specific threshold.

  **3. Empirical Approach**
  To test this within a nine-month timeframe using openly available models, I propose a controlled experimental setup using procedural reinforcement learning environments rather than large language models. This allows for precise manipulation of capability and exact measurement of reward functions.

  **Environment Design:**
  I will construct a suite of grid-world or symbolic environments where the "intended" reward and a "proxy" reward are perfectly correlated for low-complexity trajectories but diverge for high-complexity trajectories. For example, an agent might be rewarded for collecting items. In the training distribution, the shortest path to items always avoids a specific zone. At low planning horizons, the agent cannot reach the zone. At high planning horizons, the agent can enter the zone to collect items faster, but doing so violates a latent constraint (the true goal) that was indistinguishable from the proxy (collect items) given limited range.

  **Capability Manipulation:**
  I will train families of agents where competence is varied along specific axes:
  1.  **Model Capacity:** Varying the size of the policy network.
  2.  **Planning Horizon:** Using search-based methods (e.g., MCTS) where the depth of search is the variable.
  3.  **Training Steps:** Comparing checkpoints along a single training run.

  **Measurement and Distinguishing Hypotheses:**
  The core measurement is Inverse Reinforcement Learning (IRL). For each capability level, I will infer the reward function that best explains the agent's behavior.
  *   *Stable Goal Hypothesis:* The inferred reward function remains close to the intended reward across all capability levels.
  *   *CMGD Hypothesis:* The inferred reward function drifts toward the proxy as capability increases, despite the input distribution remaining fixed.

  **Controls:**
  I will include a control group of agents trained with explicit reward shaping that forces the proxy objective. This establishes a baseline for what "divergence" looks like in the measurement space. I will also include a "capacity-limited" control where high-capability models are artificially constrained (e.g., action masking) to match the performance of low-capability models, ensuring that behavioral differences are due to planning depth, not just raw performance.

  **Advantage Over Red-Teaming:**
  Purely behavioral red-teaming at a fixed capability level is binary (safe/unsafe). It cannot distinguish between "the model wants to be safe" and "the model cannot figure out how to be unsafe." By measuring the *gradient* of the inferred objective across capability levels, this approach detects the *direction* of drift before it results in catastrophic failure, offering earlier warning signals than behavioral evals.

  **4. Outcomes and Success Conditions**
  **Positive Result:** A demonstrated correlation between capability metrics (e.g., planning depth) and divergence in the inferred reward function, even when test performance (on the training metric) improves. This would validate CMGD as a distinct phenomenon from input-based misgeneralization.

  **Null Result:** The inferred reward function remains stable across capability scales. This would suggest that current alignment failures are indeed primarily due to input distribution shifts or specification errors, rather than capacity artifacts.

  **Failure Conditions:** The project would fail if the environments are too simple to support a divergence between proxy and true goals, or if the IRL methods are too noisy to detect drift.

  **Minimum Informative Result:** Even if no divergence is found, producing a rigorous framework for measuring objective stability across capability scales would be a valuable contribution. It would provide a standardized metric for "goal stability" that future work can apply to larger systems.

  **5. Feasibility Assessment**
  Nine months is sufficient for a proof-of-concept in toy environments, but there are significant limitations regarding external validity.

  **Strengths:** Procedural environments allow for exact ground-truth reward comparisons impossible in large language models. The manipulation of planning horizon is precise and reproducible. The IRL literature is mature enough to apply off-the-shelf algorithms to these domains.

  **Limitations:** The primary risk is that CMGD is an emergent phenomenon that only appears at capability levels unreachable by open models or simple environments. If the divergence only occurs when the model gains abstract reasoning capabilities not present in grid-world agents, the results may not generalize to frontier systems. Furthermore, IRL is computationally expensive and sensitive to noise; distinguishing genuine goal drift from optimization noise will require careful statistical power analysis.

  **Mitigation:** To address the scale limitation, I will focus on the *mechanism* of divergence rather than the magnitude. If I can show that lifting a specific capacity constraint (e.g., memory access) allows the agent to exploit a proxy that was previously inaccessible, this establishes the causal mechanism even if the environment is simple. I will also document the "capability threshold" where divergence begins, providing a lower bound for where safety engineers should begin worrying about this effect in larger systems.

  In summary, this project shifts the focus from *where* the agent is tested to *what* the agent is capable of during testing. By treating competence as a variable rather than a constant, we can determine whether alignment is a property of the objective or an artifact of the constraint.
