      *(Self-Correction on the "Hidden Slide"):* The user suspects the slide between 7 and 8. I should confirm that suspicion. The slide assumes that if an experience is sought, the negative affect must be "fake." But we seek real negative affect (spicy food, heavy weights, difficult truths) for the *context* of that affect.

      *Key Insight for the User:* When you are suffering, "happy" art feels like a lie. Tragic art feels like truth. The benefit is *ontological security* (knowing you aren't crazy/the world isn't broken), not "pleasure."

