answer: |-
  ### Exam Question

  **Course:** PHIL 405 – Advanced Metaethics  
  **Exam:** Final Take-Home  
  **Time Limit:** 90 Minutes  
  **Word Count:** Approx. 1500 words  

  **Question:**

  In recent seminars, we discussed the vulnerability of moral relativism to the charge of dogmatism. If a moral framework is only binding within a specific community, what happens when that community faces external criticism regarding harm? 

  Consider the concept of **Normative Inertia**: the tendency of a moral framework to absorb criticism not by rebutting it on shared terms, but by redefining what counts as a moral reason inside the framework itself (e.g., a community stops treating harm to outsiders as a failure by reclassifying outsiders as lacking the relevant moral status, so the objection never gets heard in the framework's own vocabulary).

  **Essay Prompt:**  
  Evaluate whether Normative Inertia saves relativism from being self-insulating dogmatism, or whether it merely makes the framework unfalsifiable in a damaging way. Does this mechanism protect the integrity of local moral truths, or does it render moral progress impossible? 

  You must apply this analysis to **one concrete case study** (historical or hypothetical). Do not simply summarize Harman or Wong; use the case to test the limits of the concept.

  ***

  ### Model Answer

  **Title:** The Shield and the Cage: Normative Inertia in the Antebellum South

  The central tension in moral relativism lies in balancing respect for internal coherence with the need for external accountability. Critics often argue that relativism insulates immoral practices from critique by declaring them "true for that community." However, the concept of Normative Inertia suggests a more sophisticated mechanism at play. It isn't just that outsiders are ignored; it's that the framework itself shifts to neutralize the criticism internally. This essay argues that while Normative Inertia offers a logical defense against the charge of contradiction, it ultimately renders relativism unfalsifiable in a damaging way, transforming moral frameworks into closed loops that cannot accommodate progress. I will demonstrate this using the historical case of chattel slavery in the Antebellum American South.

  To understand the stakes, we must define Normative Inertia precisely. It is not mere stubbornness. It is a structural adjustment within a moral vocabulary. When an external agent says, "You are harming these people," the framework does not reply, "Yes, but it's necessary." Instead, it replies, "Those are not 'people' in the moral sense, so 'harm' does not apply." The criticism is absorbed by changing the definitions of the terms used to criticize. For a relativist, this looks like a feature, not a bug. It preserves the internal consistency of the Southern moral framework. If morality is determined by the agreement of the community, and the community agrees that enslaved Africans are property, then treating them as property is morally correct within that system. Normative Inertia protects this truth from external contradiction.

  In the Antebellum South, this inertia was visible in the shift from viewing slavery as a "necessary evil" to a "positive good." Early defenses conceded the harm but claimed economic necessity. Later defenses, however, utilized Normative Inertia by redefining the enslaved. Through pseudo-science and theological reinterpretation, the framework reclassified enslaved people as naturally subordinate or spiritually distinct beings who required paternalistic control. When abolitionists argued from universal human rights, the Southern framework didn't engage with universal rights; it rejected the premise that the enslaved fell under the category of "human" worthy of those rights. The criticism was not rebutted; it was made unintelligible within the Southern moral vocabulary.

  Does this save relativism from dogmatism? In a narrow logical sense, yes. It prevents the relativist from having to admit that a framework is "wrong" in an absolute sense. The Southern framework remained internally consistent. If morality is only relative to the framework, and the framework successfully redefined the moral status of the enslaved to exclude them from protection, then no internal moral rule was broken. The inertia allows the relativist to say, "They aren't violating their own morals; they are operating within a different moral ontology." This avoids the charge of simple hypocrisy. It shows that the community is not ignoring its own rules, but rather that the rules themselves are flexible enough to absorb the shock of criticism.

  However, this "save" comes at a catastrophic cost. By making the framework immune to external critique through redefinition, Normative Inertia makes the framework unfalsifiable. A moral system that cannot be proven wrong by any amount of suffering it causes is not a moral system; it is an ideology. The damage here is that it severs the link between morality and human experience. If the definition of "harm" can be tweaked whenever harm is pointed out, then the concept of harm loses its explanatory power. In the Southern case, the inertia prevented moral progress. Because the framework could absorb abolitionist critique by adjusting the definition of personhood rather than addressing the suffering, there was no internal pressure to change. The only thing that stopped the practice was external force (the Civil War), not moral reasoning.

  This suggests that Normative Inertia turns relativism into a shield for power rather than a description of moral diversity. If a community can always redefine the victims of their actions as non-victims, then any atrocity can be justified as "morally true" for that community. This is the damaging unfalsifiability. It implies that moral disagreement is impossible across frameworks, not because values differ, but because the terms of debate are rigged. The Southern framework didn't just value order over liberty; it changed the meaning of liberty so that enslavement wasn't a violation of it. This makes cross-cultural moral judgment impossible, not because we should be tolerant, but because the mechanisms of judgment have been dismantled.

  Some might argue that this inertia is inevitable in any moral system. Even universalist systems redefine terms. However, universalism claims an external anchor (reason, human nature) that limits how much redefinition can occur. Relativism, by relying solely on internal agreement, has no brake on inertia. In the Southern case, there was no appeal to a higher standard that the framework *had* to respect. The agreement of the white supremacist community was the only standard. Therefore, the inertia was total.

  Ultimately, Normative Inertia does not save relativism from dogmatism; it codifies it. It transforms the charge of "you are being dogmatic" into "you are being consistent." But consistency without the possibility of correction is stagnation. By allowing frameworks to absorb criticism through semantic shifts rather than substantive engagement, relativism permits moral frameworks to become closed systems. In the case of Antebellum slavery, this meant that the moral truth of the community was preserved at the expense of actual human beings. While this protects the logical integrity of relativism, it destroys its ethical viability. A moral theory that can justify anything by redefining the victims out of existence is not saving itself from dogmatism; it is becoming the ultimate dogma.

  Therefore, Normative Inertia reveals a fatal flaw. It shows that without some shared terms for criticism—some overlap in what counts as a reason—relativism cannot distinguish between a robust moral culture and a self-justifying cult. The inertia protects the framework, but it kills the morality.

  ***

  ### Marking Scheme (Total 20 Marks)

  **1. Precise Definition of Normative Inertia (4 Marks)**  
  *   **Criteria:** Student must define the concept as a structural redefinition of moral reasons/status to absorb criticism, not just ignoring criticism.  
  *   **Common Botch:** Students define it as simple stubbornness or refusing to listen, missing the "redefinition of vocabulary" aspect.

  **2. Connection to Relativist Coherence (4 Marks)**  
  *   **Criteria:** Essay must explain *how* this inertia logically protects relativism (maintains internal consistency/truth conditions).  
  *   **Common Botch:** Students argue it makes relativism look bad immediately, skipping the step where it actually "saves" the logic of internal truth.

  **3. Concrete Case Application (4 Marks)**  
  *   **Criteria:** The case study must be specific (names, contexts, specific redefinitions) and used to illustrate the mechanism, not just tacked on.  
  *   **Common Botch:** Using a vague hypothetical ("Imagine a tribe...") without detailing *how* the redefinition happens, or summarizing a theorist instead of using a case.

  **4. Evaluation of the "Save" (Protection vs. Dogmatism) (4 Marks)**  
  *   **Criteria:** Must articulate the argument for why this might be seen as a feature (protecting local integrity) before critiquing it.  
  *   **Common Botch:** Dismissing the "saving" aspect entirely as obviously wrong without engaging with why a relativist would want this.

  **5. Evaluation of Unfalsifiability/Damage (4 Marks)**  
  *   **Criteria:** Must conclude on the cost (progress impossible, power shielded, terms rigged) and take a stance on whether the damage outweighs the benefit.  
  *   **Common Botch:** Sitting on the fence ("it has pros and cons") without arguing which side wins regarding the *viability* of relativism.
