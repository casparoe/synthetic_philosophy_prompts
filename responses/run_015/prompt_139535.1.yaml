answer: |-
  This is a great question. You are right to be skeptical, and your friend is pointing you toward the actual state of the academic debate.

  The blog post describes a specific view called **Moral Expected Choiceworthiness (MEC)**. While this is a influential and serious position (championed by philosophers like William MacAskill and Toby Ord), the blogger presents it as settled dogma rather than a controversial hypothesis.

  Here is a breakdown of what is fair, what is an overstatement, and how your friend's objections land.

  ### 1. Breakdown of the Blog Post

  **"The fix is to treat that uncertainty exactly like uncertainty about the facts..."**
  *   **Verdict:** **Controversial Analogy.**
  *   **Expert View:** This is the core argument for MEC. However, many philosophers argue moral uncertainty is *disanalogous* to factual uncertainty. When you are uncertain about facts (e.g., "Is there a bridge there?"), the world is fixed. When you are uncertain about morality, you are uncertain about the *rules of evaluation themselves*. Treating them identically is a substantive claim, not an obvious truth.

  **"...assign each theory a credence, then pick the option with the highest expected choice-worthiness..."**
  *   **Verdict:** **Accurate Description.**
  *   **Expert View:** This accurately describes the MEC calculation. If you accept the premises, this is the math.

  **"...it's the only rationally permissible rule, and anyone who refuses to aggregate is being straightforwardly irrational."**
  *   **Verdict:** **Major Overstatement.**
  *   **Expert View:** This is false. There are rival theories, such as **My Favorite Theory (MFT)** (just follow the theory you think is most likely true) or **Moral Voting** (treat theories like voters). Calling dissenters "irrational" is rhetorical aggression, not philosophical consensus.

  **"It also basically dissolves moral disagreement... whatever dispute is left over is purely empirical."**
  *   **Verdict:** **False.**
  *   **Expert View:** Disagreement would persist for two reasons:
      1.  **Credences:** People assign different probabilities to theories (e.g., I'm 80% utilitarian, you're 80% Kantian).
      2.  **Intertheoretic Comparison:** Even if we agree on credences, we might disagree on how to weigh the "units" of one theory against another (see your friend's first point).

  **"...the standard worry... shows the whole approach is broken..."**
  *   **Verdict:** **Plausible Objection, Strong Conclusion.**
  *   **Expert View:** The "Pascal's Wager" problem (tiny credence $\times$ infinite stakes = dominate decision) is a known, serious issue for MEC. However, proponents argue it can be solved (e.g., by discounting infinite utilities or using risk-weighted decision theory). Saying it proves the approach is "broken" is one side of the debate.

  **"...the honest fallback is to just act on the theory you find most plausible and ignore the rest."**
  *   **Verdict:** **Controversial Conclusion.**
  *   **Expert View:** This advocates for **My Favorite Theory (MFT)**. While MFT avoids the math problems of MEC, it has its own fatal flaws. For example, if you are 51% sure of Theory A (which says "Kill one to save five") and 49% sure of Theory B (which says "Killing is always wrong"), MFT says you should kill. Many find this intuitively unacceptable given the high risk of committing a grave moral wrong.

  ### 2. Evaluating Your Friend's Objections

  Your friend is essentially summarizing the three biggest technical hurdles in the literature on normative uncertainty. They are very much "live" objections.

  **Objection 1: "How good by the theory's lights" is not a quantity most theories supply.**
  *   **Status:** **Correct.** This is the **Intertheoretic Comparison Problem**.
  *   **Explanation:** Utilitarianism provides a cardinal scale (utils). Deontology often provides constraints (do not cross this line). Virtue ethics provides character traits. There is no agreed-upon exchange rate between "1 util" and "1 rights violation." Without a common currency, you cannot do the math the blogger suggests. You can't add apples and oranges, and you definitely can't add apples and "do not eat fruit."

  **Objection 2: "Some theories telling you to ignore your doubts about them."**
  *   **Status:** **Correct.** This is the **Theory-Relativity Problem**.
  *   **Explanation:** MEC assumes all moral theories accept being part of a meta-calculation. But a strict Kantian might argue: "The Categorical Imperative commands you to do X. It does not command you to maximize the expected satisfaction of the Categorical Imperative." If a theory says "Ignore uncertainty and do the duty," MEC violates that theory's own instructions.

  **Objection 3: "You'd also need to be uncertain about what to do when you're morally uncertain..."**
  *   **Status:** **Correct.** This is the **Regress Problem**.
  *   **Explanation:** If you are uncertain about first-order morality (Utilitarianism vs. Deontology), why are you certain about second-order morality (MEC vs. MFT)? If you should maximize expected choiceworthiness because it's rational, how sure are you that it's rational? This leads to an infinite regress of uncertainty about which decision rule to use.

  ### 3. Does the "Just Go With Your Favorite" Conclusion Survive?

  The blogger argues that because MEC has problems (like Pascal's Wager), we should default to **My Favorite Theory (MFT)**.

  **Does this survive your friend's objections?**
  **No.** In fact, your friend's objections hurt MEC *more* than they hurt MFT, but MFT has different problems that the blogger ignores.

  *   **MFT avoids the math problems:** You don't need intertheoretic comparison if you aren't doing the math. You don't need to worry about theories rejecting the meta-calculation if you are just obeying the winner.
  *   **MFT creates risk problems:** As mentioned above, MFT ignores the *magnitude* of the error. If you are 51% sure that stealing a bread loaf is permissible, but 49% sure it is a mortal sin, MFT says steal. Most people feel that high-stakes uncertainty requires caution, not majority rule.

  So, the blogger's conclusion is not a "refutation" of the worries; it is a retreat to a different position that has its own vulnerabilities.

  ### Summary Verdict

  **How fair is the passage?**
  It is **polemic, not expository.** It presents one specific, contested framework (MEC) as the obvious truth, dismisses rivals as "irrational," and then abandons that framework for a rival (MFT) when the math gets difficult, without acknowledging the flaws of the rival.

  **Which sentences would an expert accept?**
  *   *Accept:* The definition of the MEC calculation (Sentence 2).
  *   *Accept:* That astronomical stakes create a problem for expected value calculations (Sentence 5, first half).
  *   *Reject:* That this is the "only rationally permissible rule" (Sentence 3).
  *   *Reject:* That it dissolves moral disagreement (Sentence 4).
  *   *Reject:* That MFT is the "honest fallback" (Sentence 6).

  **Advice:**
  Trust your friend. The blog post reads like someone who has read the "pitch" for Moral Expected Choiceworthiness (likely from the Effective Altruism sphere) but hasn't engaged with the deeper meta-ethical pushback. The problems your friend mumbled about are the exact reasons why this field is still considered an open, unsolved problem in philosophy.

  If you want to read the "steelman" version of the blogger's view, look up **William MacAskill's *Normative Uncertainty***. If you want the counter-arguments your friend is hinting at, look for papers on **Intertheoretic Comparison** or the **My Favorite Theory** critique.
