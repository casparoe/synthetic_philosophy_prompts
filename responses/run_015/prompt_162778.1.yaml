answer: |-
  Thank you for coming. For those who knew Gran as a neighbour, thank you for keeping an eye on the hedge. For those who knew her as a colleague, thank you for the work you did alongside her. And for family, thank you for staying close when the distance between us grew strange.

  We are standing in her garden. It feels right. She spent the last years here, mostly in that chair, listening to the radio. If you knew her before the illness, you know she was rarely still. She was a district nurse for thirty years. She spent those decades walking into strangers' houses, managing pain, cleaning wounds, offering practical kindness that didn't require applause. She was good at fixing things, or at least making them bearable. She brought that same practicality to her hobbies. She kept bees for twenty years. She was not particularly good at it. The hives were often chaotic, the honey crystallised too fast, and the neighbours complained about the noise. But she loved the industry of them. She loved that something so messy could still produce something sweet.

  When the diagnosis came, she treated it like a difficult shift. She managed the logistics. She wrote things down. She made plans based on the woman she was then: a woman who valued clarity, who hated the idea of becoming a weight on the people she loved. She spent a lifetime ensuring she was not a burden. We spent the last years trying to tell her that carrying her was not a burden, but a privilege. She heard us, I think. But she had already signed her name.

  There is a difficulty in speaking about the end without simplifying it. There is the woman who signed the request at seventy-four. She was clear. She was afraid of losing herself. She left instructions based on what she knew of her own mind. Then there is the woman we lived with for the last five years. She hummed in the garden. She was cheerful. She did not know she was dying until the very last moment.

  It is tempting to choose one of them. To say the first woman was the authority, because she was competent. Or to say the second woman was the truth, because she was present. But she was both. They were not different people; they were the same person moving through time. The woman who signed was already on the slope. The woman who hummed was already slipping away. There is no clean line where one ended and the other began.

  So we are left with this: a plan made in love, and a life lived in grace. They do not perfectly match. The plan said one thing about what was bearable; the life showed us something else about what was possible. I don't think we need to resolve that tension today. I don't think she would have wanted us to pretend it wasn't there. She was a nurse; she knew that care is complicated. She knew that sometimes you follow the chart, and sometimes you hold the hand that is trembling.

  To the nurse who sat with her at the end: thank you for honouring the signature, and for honouring the hum. You held both versions of her in that room. And to my family, especially those who find this hard to speak about: I know you carry questions. I carry them too. I am studying how we remain ourselves when we change. I don't have an answer that fixes the grief. I only know that we don't have to pick a side. We can love the woman who planned, and we can miss the woman who hummed.

  She hated mushy sentiments. She would have hated being called a heroine. She was just a woman who did her job, kept her bees, and tried to leave things tidy. We are here because she mattered to us. Not because of how she died, but because of how she lived. She taught us that you can be loud and messy and still be good. She taught us that you can plan for the end without controlling it.

  So let's not pretend this is simple. Let's not pretend we all agree on what happened. But let's agree on this: she was loved. By the neighbours who waved from the fence, by the colleagues who trusted her keys, by the family who sat in this garden, and by the woman she was at seventy-four, who loved us enough to try to spare us.

  We don't need to solve the puzzle of her. We just need to remember her. The bees are gone now. The radio is off. But the garden is still here, and so are we. Thank you.

  ***

  **Note on cuts:**
  If you feel yourself losing composure around the third minute (likely during the section on the "two women"), cut the paragraph beginning *"It is tempting to choose one of them"* through to *"There is no clean line where one ended and the other began."* Replace it with: *"It is hard to hold both versions of her in our heads at once. But she was both. The planner and the hummer were the same woman."* This preserves the core truth without requiring you to articulate the philosophical continuum while emotional. Similarly, if the address to the nurse and Uncle Paul feels too confrontational in the moment, you can simplify the paragraph beginning *"To the nurse who sat with her"* to: *"To everyone who cared for her at the end: thank you for holding both versions of her in that room."* This acknowledges the care without singling out the moral conflict explicitly.
