answer: |-
  This is a brilliant reconstruction of a very real problem in the philosophy of cognitive science. Your friend has essentially weaponized the "Social Extended Mind" literature against the original Clark & Chalmers thesis. He's arguing that if you push the Parity Principle (1) hard enough, it dissolves the individual subject entirely, which he takes as a *reductio ad absurdum*.

  You want to save the Extended Mind Thesis (EMT) without accepting the "Hive Mind" conclusion. You can do this, but you have to make a cut.

  Here is the precise diagnosis: **You must reject the inference from (6) to (7).**

  Your friend's argument is valid up to (6), but (7) contains a category error that conflates *cognitive extension* with *subject dissolution*. However, to make that rejection stick, you also need to tighten Premise (4) regarding what counts as "integration."

  Here is the breakdown of where the argument breaks, the precise difference between Otto and the Co-op, and the cost of the repair.

  ### 1. The Cut: Reject (7), Refine (4)

  **Premise (7):** *"So the system, not the person, is where the cognition is. What exists is a shifting, task-relative cognitive system, and 'whose mind is this' has no answer."*

  This is the overreach. Even if we grant that the Co-op forms a *cognitive system* (which many, like Edwin Hutchins, would agree with), it does not follow that the *individual minds* cease to exist or that the attribution of cognition becomes impossible. A choir produces a harmony that no single voice can produce, but it is false to say "there is no singer, only the song."

  However, to prevent your friend from saying "But Parity says the boundary is wherever the function is!", you need to refine **Premise (4)**.

  **The Fix:** Integration conditions *do* require a specific kind of ownership—not property ownership, but **cognitive agency**.

  For a resource to be part of *my* mind (per EMT), I must be able to manipulate it as a direct vehicle of my intention without engaging in *social negotiation* or *theory of mind*.

  ### 2. Otto vs. The Co-op: The Precise Difference

  Your friend says the Co-op ledger satisfies the conditions *better* than Otto's notebook. This is false. It satisfies *reliability* better, but it fails on **transparency of access** and **manipulability**.

  **Otto's Notebook:**
  *   **Access:** Direct. Otto looks, Otto sees.
  *   **Manipulation:** Direct. Otto writes, the ink appears.
  *   **Mediation:** None. There is no intermediate agent between Otto's intention and the state of the record.
  *   **Metacognition:** Zero. Otto does not wonder, "Is the notebook willing to tell me the address?" or "Does the notebook remember correctly today?"

  **The Co-op Ledger:**
  *   **Access:** Socially mediated. To read the ledger, I must enter the kitchen. To ask Dana, I must find Dana.
  *   **Manipulation:** Negotiated. If I want to change the ledger, I might need to check with others (as per the setup: "corrected when someone spots an error").
  *   **Mediation:** High. Accessing Dana requires me to model Dana's mind ("Is Dana awake?", "Is Dana in a good mood?", "Did Dana understand me?").
  *   **Metacognition:** High. I am constantly monitoring the *social reliability* of the source, not just the content.

  **The Distinction:**
  EMT requires the external resource to function as a **transparent vehicle**. When I use my biological memory, I don't negotiate with my hippocampus. When Otto uses his notebook, he doesn't negotiate with the paper. When I use the Co-op, I *am* negotiating with other agents.

  Once you have to model another agent's mind to access the information, the cognitive loop has closed *around the social interaction*, not around the information storage. The "glue" in Otto's case is neural-functional. The "glue" in the Co-op case is social-normative.

  ### 3. Evaluating the Standard Moves (and their costs)

  You asked what the usual objections cost and where they hit the premises. Here is the ledger for those:

  **A. The Coupling-Constitution Fallacy (Adams & Aizawa)**
  *   *The Move:* Claims EMT confuses causal coupling (using a tool) with constitution (being part of the mind).
  *   *Where it hits:* Rejects (1) and (2) entirely.
  *   *The Cost:* **Too high for you.** This kills Otto's notebook just as dead as the Co-op. If you accept this, you are no longer an extended mind theorist; you are a traditional internalist.
  *   *Verdict:* Discard.

  **B. Scaffolding / Embedded Cognition (Sterelny)**
  *   *The Move:* External resources support cognition but aren't *constitutive* of it. They are scaffolding, not parts.
  *   *Where it hits:* Rejects (3).
  *   *The Cost:* **High.** This saves the individual boundary but weakens EMT to "Embedded Mind." It says Otto's notebook isn't *memory*, it's just a tool *for* memory. You said you like EMT and think "something real is going on with Otto." This move dilutes that "realness."
  *   *Verdict:* Keep in reserve, but too concessive.

  **C. The "Trust and Glue" Refinement (Clark's later work)**
  *   *The Move:* Tightens the criteria for extension. It's not just access; it's *endorsement* and *past integration*.
  *   *Where it hits:* Modifies (4).
  *   *The Cost:* **Moderate.** You have to admit that "Trust" isn't just reliability (the ledger is reliable); it's about *cognitive endorsement*. I endorse my notebook entries automatically. I do not automatically endorse Dana's entries; I vet them socially.
  *   *Verdict:* **This is your winner.** It saves (1) and (2) but blocks the Co-op case.

  **D. Group Agency (List & Pettit)**
  *   *The Move:* Accepts that groups can be agents, but denies this eliminates individual agency.
  *   *Where it hits:* Rejects (7) and (9).
  *   *The Cost:* **Low.** You admit the Co-op is a cognitive *system* (maybe even an agent), but deny that *your* mind is the Co-op. You are a node *in* the system, but your cognitive boundary stops where your agency requires social negotiation to proceed.
  *   *Verdict:* **Combine with C.**

  ### 4. What You Are Signing Up For

  If you take this path (Reject 7, Refine 4 via Cognitive Agency), here is the price you pay:

  1.  **You limit EMT to Non-Agentive Resources (mostly):** You can extend into notebooks, phones, and calculators. You cannot extend into *other people* in the same way. Other people are *sources*, not *vehicles*. This is a significant restriction. It means the "Social Extended Mind" is a different phenomenon than the "Otto Extended Mind."
  2.  **You admit "Function" isn't enough:** You have to concede to your friend that Premise (2) ("What matters is functional role... not whose it is") is slightly misleading. It *does* matter whose neurons are doing the processing if "whose" implies "over which I have direct executive control." Functionalism remains, but *Agency* is a constraint on Function.
  3.  **You accept a Gradient:** You aren't drawing a hard line at the skin, but you are drawing a hard line at **Social Friction**. Wherever social negotiation enters the loop, the extension stops.

  ### 5. How to Reply to Your Friend

  Here is the script to unwind the trap:

  > "You're right that the Co-op is a cognitive system. I'll even grant you (6): they share a distributed memory system. But you lose me at (7).
  >
  > The Parity Principle compares external resources to *internal biological processes*. When I access my biological memory, I don't negotiate with my neurons. When Otto accesses his notebook, he doesn't negotiate with the paper. But when I access the Co-op, I *am* negotiating with you.
  >
  > That negotiation requires **Theory of Mind**. I have to model your reliability, your availability, and your intent. That metacognitive layer means the loop isn't transparent. The ledger isn't part of *my* mind in the Otto sense; it's part of *our* infrastructure.
  >
  > So, (1) stays true: Otto's notebook is part of his mind. But the Co-op case fails the Parity test because the functional role isn't identical to internal memory—it involves social navigation that internal memory doesn't.
  >
  > I don't have to reject EMT. I just have to reject the idea that 'functional integration' ignores 'cognitive agency.' I can extend into tools I control, but I don't extend into agents I coordinate with. That saves Otto, saves my mind, and admits the Co-op is something else entirely: a group agent, not an extended individual."

  ### Summary of Costs
  *   **Reject:** Premise (7) (The dissolution of the subject).
  *   **Modify:** Premise (4) (Integration requires direct executive control/transparency, not just reliability).
  *   **Keep:** Premise (1) & (2) (Parity and Functionalism).
  *   **Cost:** You must distinguish between *extending into tools* (Otto) and *coordinating with agents* (Co-op). You cannot have a fully seamless Social Extended Mind that treats other people exactly like notebooks.

  This keeps your EMT intact while stopping the slide into the hive-mind *reductio*. Your friend's error was assuming that because the *system* remembers, the *individual* must therefore lose their boundary. But a pilot uses a cockpit to fly; the cockpit is essential to the flight, but the pilot doesn't become the plane, nor does the plane become the pilot. They form a system, but the cognitive boundary of the *agent* remains distinct from the *vehicle*.
