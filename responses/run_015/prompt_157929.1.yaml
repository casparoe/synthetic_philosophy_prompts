answer: |-
  # Workshop Preparation Sheet: Infinite Ethics & Physical Symmetry

  **Context:** 20-minute Q&A window.
  **Goal:** Survive the objection phase without conceding the core thesis, while managing the "finite neglect" counter-intuitiveness.
  **Diagnosis Confirmation:** Your diagnosis of the soft spot is **correct**. The move from "impartiality requires symmetry" to "symmetry is restricted to physical structure" is the normative hinge. Critics will argue that *moral* impartiality is a conceptual constraint on valuation, not a derivative of physical geometry. If physics had been different (e.g., no CMB, or a different foliation), would morality be different? If yes, morality is contingent on cosmology in an uncomfortable way. If no, your restriction is ad hoc.

  ---

  ### Part I: Opening Concessions (First 2 Minutes)
  *Before taking questions, frame the discussion to absorb the strongest blows.*

  1.  **Concede Cosmological Contingency:** Explicitly state: "On this view, the structure of moral obligation is contingent on the large-scale structure of the universe. If the universe were not spatially infinite or lacked a preferred foliation, this specific density ordering would not apply. I accept this contingency."
      *   *Why:* Pre-empts the Cosmologist's "gauge" objection and stops them from treating it as a physics error. It frames it as a conditional normative claim.
  2.  **Concede the "Finite Neglect" Counter-Intuition:** Acknowledge: "This view entails that isolated finite improvements (saving one life in an infinite history) do not change the value ranking of worlds. I do not try to explain this away; I argue we must relocate 'duty' to structural interventions or non-axiological grounds."
      *   *Why:* Prevents the Population Ethicist and Consequentialists from spending 10 minutes trying to force you to admit saving a life matters *axiologically*. You've already paid that cost.

  ---

  ### Part II: The Objection Queue (8-10 Objections)
  *Ordered by likely arrival and potential damage.*

  #### 1. The "Gauge vs. Physical" Challenge
  *   **Constituency:** Cosmologist.
  *   **Vocabulary:** "Preferred foliation," "Gauge choice," "Coordinate singularity," "Observable vs. Global."
  *   **Objection:** "The CMB rest frame is a convenient coordinate system for *observation*, not a fundamental physical foliation. In General Relativity, all foliations are equally valid locally. Why privilege a frame defined by photon decoupling over any other? Are you grounding ethics in a contingent feature of the early universe's plasma?"
  *   **2-Minute Reply:** Distinguish between *fundamental law* and *boundary condition*. The CMB frame isn't a law of physics, but it is a unique, objective feature of the actual universe's history (a boundary condition). Morality operates in the actual world, not in all possible worlds. We don't need a frame that works in *every* GR solution, only one that exists in *this* spacetime.
  *   **Soft Spot:** If the universe is a multiverse with varying initial conditions, your ethics fragments. You are tying moral truth to a specific initial condition.

  #### 2. The "Ultrafilter in Disguise" Challenge
  *   **Constituency:** Mathematical Economist.
  *   **Vocabulary:** "Banach limits," "Ultrafilters," "Finitely additive measure," "Non-measurable sets."
  *   **Objection:** "Restricting symmetries to the CMB frame fixes the *slices*, but you still need a method to sum across them. Isn't your 'long-run density' just a specific choice of Banach limit or ultrafilter? You haven't solved the non-uniqueness problem; you've just pushed it from the permutation group to the limit operation."
  *   **2-Minute Reply:** Standard Banach limits are translation-invariant. My ordering is *not* translation-invariant in time; it respects the cosmic time arrow. The limit is taken along the physical time parameter $t \to \infty$, not an abstract sequence. This is a standard limit of a function $V(t)/Vol(t)$, not a non-constructive ultrafilter extension, provided the density converges.
  *   **Soft Spot:** If the density oscillates (does not converge), you are forced back to an ultrafilter to resolve the tie. You need to assume value distribution is "well-behaved" enough to converge.

  #### 3. The "Representability" Challenge
  *   **Constituency:** Decision Theorist (A).
  *   **Vocabulary:** "Representation theorem," "Real-valued function," "Archimedean axiom," "Expected utility."
  *   **Objection:** "An ordering based on asymptotic density cannot be represented by a real-valued utility function (it violates the Archimedean axiom). If you can't represent it numerically, how do you handle mixed prospects or probabilities? Your view seems incompatible with standard decision theory under uncertainty."
  *   **2-Minute Reply:** Correct, it is non-Archimedean. I am not proposing this for standard EU maximization. I am proposing a lexical ordering: first maximize density, then (perhaps) look at finite differences. For uncertainty, we need a generalized decision theory (e.g., using hyperreals or lexicographic probabilities), which is a cost I accept to solve paralysis.
  *   **Soft Spot:** Generalized decision theories are underdeveloped. You are asking the audience to adopt a whole new decision framework to save your ethical one.

  #### 4. The "Credence in Infinity" Challenge
  *   **Constituency:** Decision Theorist (B).
  *   **Vocabulary:** "Credence," "Dominance," "Pascal's Mugging," "Epistemic probability."
  *   **Objection:** "You cannot have credence 1 that the universe is infinite and flat. If there is non-zero probability the universe is finite, your density metric collapses to total sum. How do you aggregate the 'infinite world' verdict with the 'finite world' verdict? The finite probability might dominate if the stakes are high enough."
  *   **2-Minute Reply:** This is a problem for *all* infinite ethics views, not just mine. However, my view handles it better: if the world is finite, the CMB frame still exists, and we sum total value. The *metric* changes continuously from density (infinite) to total (finite) as volume bounds are hit. The structural duty remains: organize value efficiently relative to the geometry.
  *   **Soft Spot:** The switch from density to total sum is discontinuous in the limit. If $P(\text{Finite}) = \epsilon$, does the $\epsilon$ chance of a finite world dominate the infinite density calculation? (Likely yes, if values are unbounded).

  #### 5. The "Denominator" Challenge
  *   **Constituency:** Population Ethicist.
  *   **Vocabulary:** "Per capita," "Totalism," "Averaging," "Repugnant Conclusion," "Mere addition."
  *   **Objection:** "You define density as Value / Volume-Time. Why not Value / Persons? If population grows faster than volume (or vice versa), your verdicts flip. By choosing volume, aren't you implicitly privileging empty space over populated space? Isn't the choice of denominator doing all the normative work?"
  *   **2-Minute Reply:** Value / Persons fails in infinite worlds if population is infinite but value is finite (density zero). Value / Volume is the only measure that remains stable under the physical symmetries I identified. Persons are not fundamental spacetime entities; spacetime volume is. I am grounding ethics in the container, not the contents, to ensure impartiality.
  *   **Soft Spot:** This sounds cold. It implies adding people to a fixed volume dilutes value density if they don't add enough value. It risks a "Repugnant Conclusion" inverse: killing people to boost average density.

  #### 6. The "Oscillation" Challenge
  *   **Constituency:** Mathematical Economist / Cosmologist.
  *   **Vocabulary:** "Convergence," "Limit superior/inferior," "Cyclic universe," "Entropy."
  *   **Objection:** "There is no guarantee the limit $\lim_{t \to \infty} V(t)/Vol(t)$ exists. Value creation might oscillate. If the limit doesn't exist, your ordering is incomplete. Do you then fall back to arbitrary ultrafilters?"
  *   **2-Minute Reply:** If the limit doesn't exist, the ordering is indeed incomplete. I accept incompleteness over arbitrariness. In cases of oscillation, there is no fact of the matter about which world is better, just as there is no fact about whether an oscillating sequence is 'greater' than a constant one without a specific summation method.
  *   **Soft Spot:** Incompleteness is a bullet many ethicists won't bite. It means some choices are rationally undetermined.

  #### 7. The "Fairness vs. Nature" Challenge (The Soft Spot)
  *   **Constituency:** Population Ethicist / General Philosopher.
  *   **Vocabulary:** "Normative authority," "Is-ought," "Naturalistic fallacy," "Moral symmetry."
  *   **Objection:** "You argue physical symmetry dictates moral symmetry. But physics tells us what *is*, ethics tells us what *matters*. Just because the universe has a preferred frame doesn't mean *suffering* respects it. Why is it 'fair' to count value only according to the CMB frame? This looks like a naturalistic fallacy."
  *   **2-Minute Reply:** It is not that physics *dictates* morality, but that 'impartiality' requires a principled restriction on permutations. Arbitrary bijections are mathematically possible but physically meaningless. To avoid paralysis, we must restrict impartiality to *meaningful* relabelings. Physical structure provides the only non-arbitrary criterion for 'meaningful' available to us.
  *   **Soft Spot:** This is your weakest philosophical ground. A Kantian or Contractualist will say moral symmetry comes from rational agency, not spacetime geometry.

  #### 8. The "Local Agency" Challenge
  *   **Constituency:** Consequentialists in the room.
  *   **Vocabulary:** "Difference making," "Efficacy," "Marginal impact."
  *   **Objection:** "If finite changes don't alter the density, then my act of saving a life makes *no difference* to the value of the world. This renders ordinary moral deliberation nihilistic. You say duty is about 'structure,' but I can't affect the structure of the infinite universe from here."
  *   **2-Minute Reply:** I distinguish between *axiological difference* (world value) and *deontic duty* (action guidance). Your duty is to act on principles that, if universalized or propagated, *would* affect density. You act as a legislator for the infinite, not a calculator of the infinite sum.
  *   **Soft Spot:** This is a retreat to Rule Consequentialism or Kantianism. Hard Consequentialists will reject the split between "value of world" and "right action."

  #### 9. The "Expansion Dilution" Challenge
  *   **Constituency:** Cosmologist.
  *   **Vocabulary:** "Accelerating expansion," "Event horizon," "Comoving volume," "Dark energy."
  *   **Objection:** "With accelerating expansion, the volume of the observable universe grows exponentially, but causal contact shrinks. Value density relative to *total* volume might go to zero simply due to expansion, regardless of our actions. Are you measuring density in comoving coordinates or physical volume? If physical, expansion washes out all value."
  *   **2-Minute Reply:** I intend comoving volume (coordinates expanding with the universe), which keeps the 'grid' stable relative to matter distribution. This tracks the 'amount of universe' rather than the stretching of space itself.
  *   **Soft Spot:** Requires technical clarification. If you haven't specified comoving vs. physical in the paper, they will catch you here.

  #### 10. The "Measure Zero" Challenge (The Killer)
  *   **Constituency:** Mathematical Economist.
  *   **Vocabulary:** "Measure zero," "Almost everywhere," "Integration," "Lebesgue measure."
  *   **Objection:** "In an infinite homogeneous universe, the set of spacetime points influenced by your act has measure zero. When integrating value density over the whole manifold, your contribution vanishes not because of parity, but because of measure theory. Your 'structural duty' argument assumes your act propagates, but physically it decays. Does your view survive if your act is measure zero?"
  *   **2-Minute Reply:** The argument relies on the *structural* nature of duty. We are not evaluating the single act's integral; we are evaluating the *rule* or *pattern* instantiated. If the pattern is 'locally benevolent,' and the universe is homogeneous, the density reflects that pattern everywhere. The single act is a sample of the density, not an additive term.
  *   **Soft Spot:** If the universe is not homogeneous (which it isn't, locally), the sample is biased. You are assuming your local region is representative of the infinite whole without justification.

  ---

  ### Part III: Strategic Essentials

  #### The Single Reply That Must Land
  **The "Physical Symmetry is Non-Arbitrary" Defense.**
  You must convince the room that restricting impartiality to physical symmetries is not an *ad hoc* fix to save consequentialism, but a requirement for *meaningful* comparison.
  *   *Phrasing:* "Arbitrary permutations treat physically distinct locations as identical. That isn't impartiality; it's blindness. Impartiality requires treating *relevantly similar* locations similarly. Physical structure defines relevance."

  #### The Weakest Joint to Expose Voluntarily
  **The Contingency of Ethics on Cosmology.**
  Don't wait for the Cosmologist to hammer you. Admit early that if the universe were different (e.g., closed, finite, no CMB), this specific theory would not apply.
  *   *Why:* It disarms the "Is-Ought" objection. You aren't saying physics *makes* morality; you are saying morality *uses* physics to solve the identification problem in infinite spaces. It makes your view a "local" theory for *this* universe, which is more defensible than a universal theory that gets physics wrong.

  #### The "Prayer Question" (Assessment)
  **Your Candidate:** "Infinite duplicates of me."
  **Verdict:** This is indeed a top-tier threat, but the **Mathematical Economist** will phrase it as the **Measure Zero / Representative Sample** problem (Objection 10 above).
  **Is there a worse one?**
  Yes. **"The Normative Authority of the CMB."**
  *   *The Question:* "If the CMB frame is merely a result of contingent initial conditions (a 'fossil'), why does *morality* care? If the universe had started with slightly different turbulence, the frame would be different. Are you saying moral truth depends on early-universe plasma turbulence?"
  *   *Why it's worse:* The duplicate problem undermines your *efficacy*. The CMB problem undermines your *foundation*. If the foundation is contingent on random noise, the ethics looks arbitrary.
  *   *Preparation:* Be ready to argue that while the *frame* is contingent, the *need for a frame* is necessary. We must use the best available objective structure, even if that structure is contingent. Morality is indexical to the world it inhabits.

  ---

  ### Part IV: Final Advice for the Q&A
  1.  **Do not fight the Math:** If the Math Econ says the limit doesn't exist, concede it for oscillating cases. Do not try to out-math them.
  2.  **Hold the Line on Finite Neglect:** Do not waffle on whether saving a life matters axiologically. If you waffle, you lose the solution to paralysis. Keep the distinction between *World Goodness* (density) and *Action Rightness* (structural duty) sharp.
  3.  **Manage the Consequentialists:** They will be the most hostile to the "finite neglect" implication. Remind them that Paralysis is worse than Neglect. Paralysis says *nothing* is better; Neglect says *some* things (structural ones) are better.
  4.  **Watch the Decision Theorists:** They will try to force you into an Expected Utility framework. Refuse gently. "I am proposing an ordering, not a utility function. Representation is a secondary technical problem."

  **Good luck. The thesis is bold; the defense must be equally bold about its costs.**
