      *   *Wait, check (6).* "Counterfactuals... eliminable in favor of interventions." If interventions are fundamental, then (1) is false. Causation is *invariance*, not dependence. Dependence is a symptom.
      *   *Wait, check (5).* "Causal structure is identifiable from interventional data." In Pearl's framework, if you can do *all* ideal interventions ($do(X=x)$ for all X), yes, you can identify the DAG. This is consistent with (2) and (6).

  6.  **Structuring the Response:**
