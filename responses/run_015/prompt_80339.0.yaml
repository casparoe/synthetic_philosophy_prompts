      *   (2) **Interventionism/Invariance:** Special science causation requires invariance under intervention (Woodward/Pearl).
      *   (3) **Preemption/Overdetermination:** Accepts standard intuitions (preempting cause is a cause; overdetermining causes are causes).
      *   (4) **Anti-Probability-Raising:** Rejects probabilistic theories (good, consistent with 1 & 2).
      *   (5) **Identifiability:** Causal structure is identifiable from interventional data (enough interventions $\to$ full DAG).
      *   (6) **Formalism Priority:** SCM/do-calculus is the working formalism; counterfactuals are bookkeeping/eliminable in favor of interventions.

  3.  **Brainstorm Candidate Tensions (Mental Sandbox):**

      *   *Tension A: (1) vs. (3).* Lewis's original 1973 counterfactual theory fails spectacularly on preemption and overdetermination. If causation *just is* counterfactual dependence (as 1 says), then in late preemption, the effect does *not* depend on the preempting cause (because if the preempting cause hadn't happened, the backup would have). So (1) and (3) seem directly contradictory unless (1) is modified to be "influence" or "stepwise dependence." But (1) explicitly rejects probabilistic influence and insists on "clean deterministic sense."
      *   *Tension B: (1) vs. (6).* (1) says causation is *at bottom* counterfactual dependence. (6) says counterfactuals are bookkeeping eliminable in favor of interventions. If interventions are fundamental (as SCM suggests), then counterfactuals are derived, not "at bottom." This is a metaphysical priority clash.
