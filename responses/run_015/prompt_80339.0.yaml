      *   *Tension D: (1) vs. (2).* Lewisian counterfactuals are often "backtracking" or rely on similarity metrics between worlds. Interventionism (Woodward) explicitly rejects Lewisian similarity semantics in favor of independent fixability. Woodward *uses* counterfactuals, but they are "interventionist counterfactuals," not Lewisian ones. (1) sounds like Lewis 1973. (2) sounds like Woodward 2003. These define counterfactuals differently.
      *   *Tension E: (3) vs. (1).* (Reiterating Tension A). Overdetermination is the killer for simple counterfactual dependence. If $C1$ and $C2$ both cause $E$, and either is sufficient, then $\neg C1 \boxright \neg E$ is false. So (1) says $C1$ is not a cause. (3) says $C1$ is a cause. Direct contradiction.

