      *   **Recommendations:** How to fix it for the seminar profile.

  7.  **Drafting the Content - Specific Philosophical Points:**
      *   *Lewis 1973:* Causation = Counterfactual Dependence. Fails Preemption.
      *   *Lewis 1986/2000:* Causation = Ancestral of Dependence / Influence. Saves Preemption but loses Transitivity or gets messy.
      *   *Woodward:* Causation = Invariance under Intervention. Counterfactuals are defined *by* the interventions, not the other way around.
      *   *Pearl:* Counterfactuals are derived from the Structural Model + Exogenous variables.
      *   *The User's (1):* Looks like Lewis 1973.
      *   *The User's (3):* Requires Lewis 1986+ or Woodward.
