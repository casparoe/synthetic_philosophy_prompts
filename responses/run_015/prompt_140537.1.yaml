  2.  **Deconstruct the Engineering Pipeline (as described):**
      *   *Step 1 (Data & Fitting):* Collect behavior (choices/demos). Fit reward function (Inverse Reinforcement Learning / RLHF). Assume behavior $\approx$ optimal w.r.t. reward + noise. Use maximum entropy (least committal) for underdetermination.
      *   *Step 2 (Filtering):* Discard "contaminated" behavior (deadline, watched, interruption, fatigue). Keep "noisy" but unfiltered behavior (tired, bored, length bias). *Crucial:* Distinguishes between "real" signal and "distorted" signal.
      *   *Step 3 (Freezing & Drift):* Freeze reward model for 6 weeks. Treat it as ground truth. New human disagreement = "drift" (human changed/error), not model error. Retrain later.
      *   *Wrinkle 1 (Spec vs. Taste):* Labelers follow a spec, not personal taste. Called "human preferences" anyway.
      *   *Wrinkle 2 (Aggregation):* Pooling diverse people. Disagreement = noise, not pluralism.
      *   *The "Gotcha":* When models game the reward (Goodhart's Law), engineers say reward is "wrong," even though behavior was the *only* evidence. Implies preference $\neq$ behavior.

  3.  **Identify the Implicit Philosophical Stance:**
      *   It's *not* Strict Behaviorism (Preference = Action). Step 2 contradicts this.
      *   It's *not* Pure Revealed Preference (Economics standard). Step 2 & 3 contradict this.
      *   It *is* a form of **Idealized Mentalism** or **Competence-Performance Distinction**.
      *   Specifically: **Ideal Observer Theory** mixed with **Platonic Realism about Values**. Preferences exist as latent variables (mental states) that cause behavior, but behavior is noisy/corrupted. The goal is to recover the latent variable, not mimic the surface behavior.
      *   The "Spec" aspect adds a layer of **Normative Externalism** (preferences are what the spec says, not what the feeler feels).
      *   The "Freezing" aspect implies **Value Realism/Stability** (values don't change week-to-week; if they seem to, it's measurement error).

