          *   *Alternative B: Value Pluralism (No Single Reward).* Don't pool into one function. Cluster humans. Train conditional policies (Reward given User ID).
          *   *Alternative C: Coherent Extrapolated Volition (CEV) / Idealization.* Lean into Step 2. Actively model the "idealized" human. Use cognitive models to correct bias, not just filter.
          *   *Alternative D: Normative/Spec-Based.* Stop calling it "human preferences." Call it "Policy Compliance." Evaluate against the Spec directly, not human proxies.

  5.  **Refining the Vocabulary:**
      *   Use terms like "Inverse Reinforcement Learning (IRL)," "Revealed Preference," "Competence vs. Performance," "Latent Variable," "Goodhart's Law," "Meta-Ethics."
      *   Keep the tone respectful of the engineering constraints but rigorous on the philosophy.
      *   Ensure the distinction between *ontological* claims (what preferences *are*) and *epistemic* claims (how we *know* them) is clear.

  6.  **Self-Correction/Review during drafting:**
