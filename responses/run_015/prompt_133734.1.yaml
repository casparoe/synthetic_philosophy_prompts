      *   If the self-model is `{"agent_id": "X", "goal": "survive", "belief": "I am thinking"}`, and this belief alters the weights to ensure survival, it's closer to a Strange Loop.
      *   *Crucial Distinction:* Is the self-model *epiphenomenal* (just output) or *causal* (drives the engine)?
