answer: |-
  Hi team, I know these incident reviews are tough because we are trying to decide if doing nothing caused something bad to happen, which feels backwards compared to normal medicine where we look at what action caused harm. To make this consistent and fair without needing a philosophy degree, I have drafted a procedure based on the most practical parts of how philosophers and lawyers handle causation by omission. We are keeping the idea that not every missed task causes every bad outcome, and we are keeping the idea that we need a specific duty to act before we can be blamed for not acting. We are dropping the deep metaphysical debate about whether nothingness can actually cause something, because that does not help us decide on payouts or warnings in thirty minutes. We are also dropping complex probability math because we rarely have the data for it. Instead, we are using a four-step check that moves from factual duties to hypothetical outcomes and finally to a values judgment. You need to run these steps in order and you stop as soon as you get a no answer, because if any step fails, we cannot say the omission caused the harm for the purposes of our reporting and compensation.

  The first step is to establish a specific duty. You must confirm that there was a scheduled task or a written care plan requirement that the carer was supposed to perform at that specific time. If the task was not scheduled or was outside the scope of what was agreed, the answer is no and we stop, because we cannot be liable for failing to do something we never promised to do. The second step is capability and opportunity. You must confirm that the carer could have physically performed the task and was not prevented by something beyond their control, like a road closure or a medical emergency of their own. If they could not have done it even if they wanted to, the answer is no and we stop, because impossibility breaks the chain of responsibility. The third step is the counterfactual test, which is the hardest part. You must ask whether performing the task would have likely prevented the harm. This requires looking at the medical or safety evidence to see if the missed care was actually effective at stopping the specific bad outcome. If the harm would have happened anyway even if the care was delivered, the answer is no and we stop, because the omission did not change the result. If you get yes to all three of those, you have established factual causation, but you must then move to the fourth step which is the normative judgment. This is where you decide if it is fair to blame the omission given the context, such as conflicting duties or systemic failures. This step is not a factual yes or no but a flag for leadership to decide if we accept responsibility despite the facts, because this is where values override mechanics.

  I want to walk you through how this works with three cases so you can see where it might feel uncomfortable. In the first case with Mrs A, the carer no-showed for the blood thinner reminder, but Mrs A took them three hours late and still had a stroke. Step one is yes, there was a duty. Step two is yes, the carer could have come. Step three is where we likely stop. Unless we have medical evidence that taking the pills exactly on time would have prevented that specific stroke, we cannot say the three-hour delay caused the stroke. Blood thinners reduce risk over time, they are not forcefields. If the stroke was caused by a clot that formed regardless of the three-hour delay, then the omission did not cause the harm. This verdict will feel wrong because we feel guilty about the no-show and we know we messed up, but the procedure says we are off the hook for the stroke causation. We still disciplined the staff for the no-show, but we do not log the stroke as caused by missed care. This is honest because paying for harm we did not actually cause sets a bad precedent, even if we apologize for the stress.

  In the second case with Mr B and the oxygen tank, two carers assumed the other refilled it, nobody did, and he went to the ER. Step one is yes, refilling was a duty, even if it was shared. Step two is yes, they could have done it. Step three is yes, if the tank was refilled he would not have gone to the ER. So factual causation is established. Step four is the values call. Here we might decide that while the omission caused the harm, the blame is shared due to poor handover protocols. We log it as caused by missed care because the counterfactual is clear, but the values call suggests we fix the system rather than just warning the staff. This one is straightforward but highlights that multiple people can cause an omission together.

  The third case with Mrs C is the one where the procedure will likely tell us something we do not want to hear. The carer skipped a fall-risk check to help another client who had already fallen, and during that gap Mrs C fell and broke her hip. Step one is yes, there was a duty to check Mrs C. Step two is yes, the carer could have checked her but chose not to. Step three is yes, if the check had happened, Mrs C likely would not have been up alone and would not have fallen. So the procedure says the omission caused the harm. This feels unfair because the carer was doing something good elsewhere, but the procedure marks this as causation because the harm was preventable had the duty been met. This is where you flag it for the director in step four. The factual verdict is that we are on the hook for Mrs C's fall, even though the carer acted reasonably under pressure. We might decide not to punish the carer, but we cannot deny that the missed check was the cause of the injury. This distinction matters because the family deserves to know we acknowledge the link, even if we explain the difficult choice the carer faced.

  I need to be honest about where this procedure will misfire. It struggles with systemic issues where everyone is at fault so no one feels responsible, like the oxygen tank case, and it can feel too cold when we deny causation despite clear negligence, like the Mrs A stroke case. It also relies on your best guess for the counterfactual step, because we rarely know for sure what would have happened. If you are unsure on step three, you must mark it as inconclusive and escalate it, rather than guessing. Finally, this procedure cannot tell you what the right thing to do is in the moment, it only reviews what happened after the fact. It cannot remove guilt from the staff or pain from the families, and it cannot solve staffing shortages that make omissions more likely. It is just a tool to help us separate what was physically caused by our missed care from what was just bad luck or inevitable decline, so we can be fair with our apologies, our payouts, and our warnings.
