answer: |-
  # Specification for the Machinery of Lexical Threshold Negative Utilitarianism

  To function as an institutional decision rule for a resource allocator, Lexical Threshold Negative Utilitarianism (LTNU) requires an operational theory of measurement and a theory of the cut. The moral principle (pain above $T$ lexically outranks pleasure) is inert without a mechanism to map phenomenology and social data onto that structure. The following specification details the necessary machinery.

  Each requirement is marked as **Non-negotiable** (failure prevents the allocator from fulfilling the stated purpose of ranking programs under budget/information constraints) or **Partisan** (a philosophical commitment a defender might reject without breaking the allocator's functionality).

  ### I. The Theory of the Scale

  **1. Valence-Sensitivity Requirement**
  *   **Motivation:** The case of pain asymbolia (sensory profile of pain without unpleasantness).
  *   **Failure Mode:** If the scale measures sensory intensity rather than negative valence, the allocator wastes resources suppressing neutral sensory signals while ignoring distress that lacks standard sensory markers (e.g., existential dread).
  *   **Status:** **Non-negotiable.** The definition of LTNU rests on the disvalue of *unpleasantness*, not nociception.
  *   **Specification:** The scale must measure reported or inferred *aversion* or *suffering*, not physiological activation or sensory intensity alone.

  **2. Netting and Accounting Protocol**
  *   **Motivation:** Relief pleasures (e.g., post-injection ease) and mixed-valence experiences (e.g., spicy food).
  *   **Failure Mode:** Without a netting protocol, the allocator double-counts: valuing the cessation of pain as a positive pleasure *and* the removal of negative pain. This inflates the value of analgesia relative to prevention, or creates ambiguity in mixed interventions (e.g., exposure therapy).
  *   **Status:** **Non-negotiable.** Budget allocation requires a single net metric per intervention.
  *   **Specification:** Relief is not a positive magnitude on the pleasure side; it is a reduction of magnitude on the pain side. Mixed experiences must be integrated over time to a net sum before threshold comparison.

  **3. Dimensional Reduction Rule**
  *   **Motivation:** Qualitative diversity of pain (burning vs. grief vs. nausea).
  *   **Failure Mode:** If these are incommensurable dimensions, the "single hedonic scale" claim fails. The allocator cannot compare a program reducing grief against one reducing burning pain, leading to paralysis.
  *   **Status:** **Non-negotiable** (for LTNU). The view stipulates a single scale.
  *   **Specification:** The machinery must assert a conversion rate between pain types based on a common denominator (e.g., "willingness to endure" or "attentional capture"). If the machinery cannot specify how to trade 1 unit of grief for 1 unit of burning, the single-scale claim is false.

  **4. Temporal Aggregation and Invariance**
  *   **Motivation:** The Sandpile and the Invariance Question (merging/splitting experiences).
  *   **Failure Mode:** If the threshold is defined by peak intensity, a long duration of sub-threshold pain might be ignored. If defined by total integral (intensity $\times$ time), a momentary spike might be diluted. If rankings change based on how time is sliced (grain), the allocator's verdicts are arbitrary.
  *   **Status:** **Non-negotiable.** Institutional rules must be invariant to administrative time-stepping.
  *   **Specification:** The threshold must apply to *episodes*, defined by a minimum duration or a continuous phenomenological stream. Sub-threshold pain must aggregate over time to potentially cross the threshold (to avoid the Sandpile problem), but the threshold itself must be defined on a rate (intensity) or a total integral consistently. *Recommendation:* Threshold applies to peak intensity of an episode; sub-threshold pains aggregate only via cardinal summation below the cut, never lexically.

  **5. Interpersonal Calibration Standard**
  *   **Motivation:** Interpersonal comparison without behaviorism (stoicism, expressive norms).
  *   **Failure Mode:** If the allocator relies on self-report or behavior alone, resources flow to the most expressive, not the most suffering. If relying on physical indices, resources flow to the most biologically sensitive, not necessarily the most suffering.
  *   **Status:** **Non-negotiable.** Fair allocation across a population requires a common metric.
  *   **Specification:** The machinery must posit a "standardized subject" or use a calibration method (e.g., trade-off questions, physiological correlates of distress rather than nociception) that corrects for expressive norms. It must treat silence and screaming as potentially equivalent signals of the same magnitude.

  ### II. The Theory of the Cut

  **6. Threshold Anchoring (Anti-Ratchet)**
  *   **Motivation:** The location of the threshold and its ratchet effect.
  *   **Failure Mode:** If $T$ is defined relatively (e.g., "the worst 1% of pains"), eliminating the worst pain lowers the bar, making previously acceptable pains lexically urgent. This causes policy churn and perverse incentives to avoid measuring the worst cases.
  *   **Status:** **Non-negotiable.** Institutional stability requires fixed criteria.
  *   **Specification:** $T$ must be anchored to an absolute phenomenological standard (e.g., "unbearable," "suicide-inducing," or a fixed point on a calibrated scale), not a percentile of the current population distribution.

  **7. Unit Invariance**
  *   **Motivation:** Rescaling of units.
  *   **Failure Mode:** If verdicts change when switching from a 0–10 scale to a 0–100 scale, the doctrine is mathematically incoherent.
  *   **Status:** **Non-negotiable.**
  *   **Specification:** The lexical relation must hold regardless of the linear transformation of the cardinal scale below and above the threshold.

  **8. Risk Truncation or Discounting**
  *   **Motivation:** Use under risk (small probability of severe pain vs. certain large pleasure).
  *   **Failure Mode:** Strict lexicality implies that any non-zero probability of above-threshold pain has infinite negative expected value. This licenses paralysis (no action is safe enough) or fanaticism (spending the entire budget to reduce a microscopic risk). The allocator cannot function.
  *   **Status:** **Non-negotiable** (for the allocator's purpose).
  *   **Specification:** The machinery must include a *de minimis* probability threshold below which lexical priority is suspended, or a discounting function that prevents probabilities from carrying lexical weight linearly. Strict expected lexical value is incompatible with action under uncertainty.

  **9. Phenomenal Priority over Narrative**
  *   **Motivation:** Chosen/valued pain and experience vs. evaluation divergence.
  *   **Failure Mode:** If the allocator respects "chosen" pain (e.g., athletic exertion, childbirth) as non-bad, it violates the hedonic scale (the pain is still unpleasant). If it overrides choice to prevent the pain, it violates autonomy.
  *   **Status:** **Partisan.** A defender of LTNU is entitled to reject the "chosen pain" exemption. The view is about *suffering*, not *preference satisfaction*. However, for institutional acceptance, a "consent override" clause may be added.
  *   **Specification:** For the strict view: The scale measures felt unpleasantness regardless of endorsement. For the allocator: A "consent waiver" may be instrumentally added to prevent rebellion, but this is external to the moral machinery.

  ---

  ### III. Impossibility Result

  There is a jointly unsatisfiable subset of desiderata required for the allocator's purpose.

  **The Inconsistent Triad:**
  1.  **Strict Lexicality:** Any non-zero probability of above-threshold pain lexically outweighs any amount of below-threshold benefit.
  2.  **Empirical Fallibility:** The allocator operates under incomplete information where no intervention has a probability of exactly zero for causing severe pain (e.g., transport accidents, side effects).
  3.  **Action Guidance:** The allocator must be able to rank and select at least one program from a menu of options.

  **Analysis:**
  If (1) and (2) hold, every option carries infinite negative expected value (lexically). Therefore, all options are equivalent (ranked equally at $-\infty$). This violates (3).
  To satisfy the purpose (Action Guidance), the allocator **must** reject Strict Lexicality under risk (Desideratum 8 requires modifying Desideratum 2 of the LTNU definition). You cannot have a working allocator with strict lexical thresholds in a probabilistic world without introducing a non-lexical "risk discount."

  **Smallest Unsatisfiable Subset:** {Strict Lexicality, Non-Zero Risk of Error, Decision Capability}.

  ---

  ### IV. The Exclusionary Requirement

  The single requirement that does the most work in excluding candidates is **Interpersonal Calibration Standard (Desideratum 5)**.

  Most theories of welfare can posit a scale internally. Very few can specify how to map that scale across different minds without relying on behavior (which is noisy) or physical indices (which track damage, not suffering). A theory that cannot explain how to compare my headache to yours without begging the question cannot function as an institutional allocator for a population. It collapses into solipsism or arbitrary bias.

  ---

  ### V. Scorecard of Contenders

  **1. The Single Cardinal Hedonic Scale (Classical Picture)**
  *   **Score:** Fails **Valence-Sensitivity** and **Threshold Anchoring**.
  *   **Critique:** Treats pain and pleasure as perfectly fungible. Cannot accommodate the lexical cut without ad-hoc modification. Fails the core LTNU definition.

  **2. Lexical Threshold Negative Utilitarianism (Standard Statement)**
  *   **Score:** Fails **Risk Truncation** and **Interpersonal Calibration**.
  *   **Critique:** Usually posits the moral principle without the measurement machinery. Collapses into paralysis under risk (Fanaticism) and cannot solve the stoic/expressive problem. Adequate as a slogan, inadequate as an allocator's rule.

  **3. Suffering-Focused Ethics (Distinct Normative Kind)**
  *   **Score:** Fails **Dimensional Reduction**.
  *   **Critique:** Posits suffering as a distinct kind, not a point on a hedonic scale. This contradicts the user's setup (Claim 1: single hedonic scale). If pain and pleasure are incommensurable kinds, there is no "scale" on which to place a threshold; there are only two separate ledgers. This is a rival view, not a machinery for *this* view.

  **4. Damage-Signal View (Badness tracks reliability of damage signal)**
  *   **Score:** Fails **Valence-Sensitivity**.
  *   **Critique:** Would allocate resources to pain asymbolics (high signal, no suffering) and ignore pure psychological anguish (low signal, high suffering). Good for objectivity, bad for measuring the actual target (unpleasantness).

  **5. Preference-Based / Revealed Choice**
  *   **Score:** Fails **Phenomenal Priority** and **Single Scale**.
  *   **Critique:** Measures what people choose, not what they feel. Would endorse "chosen" severe pain as non-bad. Fails the hedonic definition of LTNU entirely.

  **Conclusion:**
  To make LTNU work for an allocator, you must adopt the **Classical Hedonic Scale** (for the metric) but modify it with a **Fixed Absolute Threshold** (for the cut) and a **Probability Discount** (for risk). The hardest remaining task is **Interpersonal Calibration**; without a solution to that, the allocator is flying blind. The "machinery" is not just the moral rule, but the psychometric bridge that allows the rule to touch the world.
