answer: |-
  Your brother's argument is slick, but it relies on a subtle equivocation between what is *possible* in the model and what is *predicted* in equilibrium. You are right to be suspicious.

  Here is the breakdown: **Reject Step (4).**

  ### Why Step (4) Looks Fine (But Is Wrong)
  Step (4) claims: *"So the theory can't explain what it was built to explain... the extravagance."*

  This looks convincing because it assumes that if a feature (net cost) isn't an **axiom** of the theory, it can't be an **output** of the theory. That is a logical error.

  In game-theoretic signaling models (the standard framework since Alan Grafen's 1990 formalization of Zahavi's Handicap Principle), "costliness" in the sense of net fitness loss is not a prerequisite for honesty. However, it is frequently an **equilibrium outcome**.

  Here is the mechanism your brother is missing: **The Separating Equilibrium.**
  For a signal to be honest, it must be too expensive for a low-quality type to fake, even if it is profitable for a high-quality type to send.
  *   If the benefit of signaling (e.g., getting a mate, securing a marriage) is very high, low-quality types are highly motivated to fake it.
  *   To stop them, the "price" of the signal must be raised.
  *   You raise the price until the low type says, "Not worth it," while the high type says, "Still worth it."
  *   In high-stakes scenarios, that price often ends up being objectively extravagant.

  So, the theory *does* explain the extravagance. It doesn't explain it by saying "all signals must be wasted." It explains it by saying "when the reward is high enough, the toll required to keep liars out looks like waste." Step (4) falsely claims the theory is silent on why we see waste, when the theory actually predicts waste will emerge in high-benefit contexts.

  ### Where the Extravagance Comes From (If You Keep 1 & 2)
  If you accept (1) and (2) — that differential marginal cost is the key, and net cost isn't strictly required — you don't lose the ability to explain the \$40k wedding or the peacock's tail. You just change *why* they are expensive.

  1.  **For the Peacock (Quality Signal):** The tail is a burden. It reduces survival. Why does it exist? Because the mating benefit is so massive that only males with superior genes can survive *despite* the tail. The extravagance is the filter. If the tail were cheaper, low-quality males would grow them, and the signal would collapse.
  2.  **For the Wedding (Commitment Signal):** This is slightly different from the peacock. A wedding is often a signal of *commitment*, not just genetic quality. In commitment signaling, **sunk costs** are the feature, not the bug. Burning \$40k signals, "I am confident this marriage will last long enough to recoup this value, and I am making it painful to leave."

  In both cases, the extravagance is not an arbitrary rule ("signals must hurt"); it is the **clearing price** required to maintain the separation between types.

  ### The Cost of Giving Up Step (4)
  If you reject (4), you have to accept a more nuanced definition of "Costly Signaling."
  *   **The Cost:** You lose the rhetorical simplicity of "it must be wasted to be real." You have to explain that "costly" refers to *marginal* cost relative to quality, not necessarily *net* loss.
  *   **The Gain:** You gain a model that actually fits the data. There are examples in nature and economics of "low-cost" or even "net-positive" signals that remain honest because they are differentially costly (e.g., a college degree pays for itself, but is still a signal because it's harder for low-ability students to get).

  ### Do You Owe an Apology?
  **No.** Your intuition was theoretically sharper than your brother's.

  *   **You** correctly identified that differential cost is the mathematical engine of honesty.
  *   **He** correctly identified that in *this specific context* (a high-stakes human ritual), the equilibrium price happens to be high and "burned."

  He is practically right about the wedding (burning cash signals commitment), but theoretically imprecise about *why*. He is treating a contingent outcome (high cost) as a necessary law (must be wasted). You don't owe him an apology for the theory, but you might buy him a drink for recognizing that \$40k is indeed a hell of a signal.

  ### Settled Science vs. Live Fights
  Since you asked for a map of the field, here is where the ground is solid and where it is shifting:

  **1. The Mathematical Condition (Settled)**
  Among theoretical biologists and economists, it is settled (per Grafen, 1990) that honesty requires **differential marginal costs**, not necessarily net fitness costs. A signal can be beneficial overall and still be honest, provided the benefit is *more* beneficial (or the cost *less* costly) for the high-quality type. Your brother's Step (3) is technically correct by modern standards.

  **2. The Necessity of "Waste" (Live Fight)**
  There is still debate between "Zahavi Purists" and "Grafen Modelers."
  *   **Purists:** Argue that without actual fitness reduction (waste), the signal loses its moral/biological force. They worry that if signals can be profitable, the system becomes unstable.
  *   **Modelers:** Argue that waste is just one way to satisfy the differential cost condition.
  *   **Consensus:** The majority of working theorists side with the Modelers (you), but the term "Costly Signaling" persists for historical reasons, which causes the confusion your brother exploited.

  **3. Human Rituals as Biological Signals (Highly Contested)**
  Applying peacock logic to human weddings is an analogy, not a settled fact.
  *   **Skeptics:** Argue human weddings are cultural coordination devices, legal contracts, or emotional expressions, not evolutionary signals of genetic fitness.
  *   **Proponents:** Argue that cross-culturally, bride prices and dowries function exactly like biological handicaps to signal resource holding potential.
  *   **Verdict:** This is an active fight in evolutionary psychology and anthropology. Your brother is treating a contested analogy as a biological law.

  ### Summary
  Your brother's argument fails at **Step (4)**. He confuses the *conditions for honesty* (differential cost) with the *equilibrium outcome* (extravagance). The theory explains the extravagance perfectly well: it's the price of admission required to keep the liars out when the prize is valuable. You were right to doubt him, but he wasn't entirely wrong about the wedding—just about the math.
