answer: |-
  The problem of logical omniscience is frequently misdiagnosed as a single defect within a single theoretical framework, typically possible worlds semantics. However, the accounts in this area are being asked to perform two distinct jobs that pull in opposing directions. The first job is to serve as the fine-grained input to a compositional semantics of belief reports and the explanation of action. This requires contents sensitive to how an agent represents the world, refusing to collapse distinct cognitive paths into identical truth conditions. The second job is to serve as the object of normative appraisal in epistemology—the thing an agent is criticised for failing to believe or ought to revise. This requires contents coarse and stable enough for logic to retain authority over them.

  My working hypothesis is that some demands generated by the first job cannot be met jointly with those generated by the second. Much apparent disagreement in the literature is not about data, but about which job takes precedence. The following specification lists the desiderata any solution must address. If this list proves jointly unsatisfiable, that is a result to be stated, not hidden.

  ### The Desiderata Specification

  | Desideratum | Motivation & Case | Status | Level of Fix |
  | :--- | :--- | :--- | :--- |
  | **1. Prohibition on Cheap Solutions** | Denying closure is not a theory. A proposal must explain why closure looked compelling initially and distinguish logical failure from forgetting, distraction, or factual error. | Non-negotiable | Norms & Metaphysics |
  | **2. Shape of Failure** | Agents reliably see one-step entailments in a single vocabulary but degrade as inference depth, negation, and vocabulary shift increase. Uniform failure models get the phenomenon wrong. | Non-negotiable | Metaphysics |
  | **3. Revision Without Information** | Realising an entailment triggers retraction or addition with a different phenomenology and normative profile than empirical update. The theory must account for this distinctness. | Non-negotiable | Norms |
  | **4. First-Personal Corrigibility** | Logical failure is discoverable by reflection alone, unlike perceptual illusion. There must be a standpoint where facts are available without reinstating omniscience. | Negotiable-but-costly | Epistemology |
  | **5. Instruction** | An agent can be told their beliefs entail $p$, fail to believe $p$, yet remain criticisable. Theory must predict both that this happens and that instruction usually works. | Non-negotiable | Norms |
  | **6. Authority of Logic** | It must remain available to say one *ought* to believe consequences. Solutions making logic optional for belief pay a large price in normative force. | Non-negotiable | Norms |
  | **7. Idealisation Coherence** | First-order consequence is undecidable. Any appeal to an ideal limit must specify what the idealisation does and whether it is coherent for finite agents. | Negotiable | Metaphysics |
  | **8. Scope Unity** | Whether one apparatus covers logical, mathematical, conceptual, and probabilistic consequence, or whether axioms-vs-theorem cases need separate resources. | Camp Preference | Metaphysics |
  | **9. Boundaries** | Desiderata must not collapse into neighbouring problems: proof search, memory retrieval, or the general problem of proposition fineness. | Non-negotiable | Methodology |
  | **10. Compositionality & Action** | Fine-grained items must feed a compositional semantics for ascriptions and underwrite planning, including where substitution intuitively succeeds. | Non-negotiable | Semantics |

  ### Evaluation of Theoretical Families

  **Hyperintensional Contents (Structured Propositions/Impossible Worlds):** These excel at Job 1, distinguishing necessary equivalents to save compositionality and action explanation. However, they struggle with Job 2. If believing $p$ does not entail believing its necessary consequences, the normative authority of logic (Desideratum 6) is weakened. They often treat logical ignorance as a different metaphysical state rather than a normative failure, risking a violation of the prohibition on cheap solutions.

  **Sentential or Language-of-Thought Accounts:** These handle the shape of failure (Desideratum 2) well by tying belief to syntactic derivation. However, they face severe difficulties with compositionality (Desideratum 10). If belief is a relation to a sentence, explaining why belief reports behave semantically like quantifiers over propositions becomes ad hoc. They also struggle to explain why logical revision feels different from empirical revision (Desideratum 3), reducing it to mere syntax manipulation.

  **Awareness and Resource-Bounded Approaches:** These explain why agents fail (limits on attention or computation) and satisfy the idealisation constraint (Desideratum 7). Yet, they often reduce logic to a psychological capacity rather than a normative standard. This threatens the Authority of Logic (Desideratum 6); if logic is bounded by resources, failing a complex deduction may be excusable, undermining the claim that the agent *ought* to believe the consequence.

  **Fragmentation or Compartmentalisation Views:** These posit that belief states are divided, allowing $p$ in one fragment and not $q$ in another even if $p$ entails $q$. This preserves rationality locally but struggles with Instruction (Desideratum 5). If fragments are sealed, why does telling an agent about the entailment bridge the gap? It also risks collapsing into the problem of memory retrieval (Desideratum 9) rather than solving the normative issue.

  **Denying Logic Constrains Belief:** This strategy dissolves the problem by rejecting the normative link entirely. It satisfies the metaphysical constraints easily but fails the non-negotiable normative desiderata (3, 5, 6). It treats logical omniscience as a pseudo-problem, but at the cost of making epistemological criticism of logical errors unintelligible.

  ### Conclusion: The Conflict

  The single desideratum that excludes the most candidates is **The Authority of Logic (6)**. Most descriptive accounts (resource-bounded, sentential, fragmentation) can explain the *fact* of logical failure, but few can maintain that the agent is *irrational* for failing without implicitly reinstating omniscience. To maintain authority, one must posit a norm that outstrips cognitive capacity, which clashes with descriptive accuracy.

  The pair of desiderata that cannot both be met is **Compositionality and Action (10)** and **The Authority of Logic (6)**. To support compositional semantics and action explanation, contents must be fine-grained enough to distinguish between logically equivalent propositions based on cognitive presentation. However, to maintain the authority of logic as a normative standard, contents must be coarse-grained enough that failing to recognize equivalence is a fault rather than a difference in content. If the content is fine-grained enough to avoid omniscience, logic loses its grip on the content; if the content is coarse enough for logic to grip it, omniscience returns. This suggests the "Two Jobs" hypothesis is correct: no single theoretical object can simultaneously serve as the fine-grained input for semantics and the coarse-grained object of normative appraisal.
