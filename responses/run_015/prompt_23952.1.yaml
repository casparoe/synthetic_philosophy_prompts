answer: |-
  Here is the battle plan for your 50-minute slot.

  ### The Core Strategy
  Your goal is not to solve the paradox, but to shift the students' view of the "solution." They currently see the Tarskian hierarchy as a **patch** (fixing a bug in language). You need to show them it is a **amputation** (removing a vital feature of language).

  To do this in 50 minutes, you cannot wander through multiple paradoxes. You need a single narrative arc:
  1.  **The Proposed Fix:** Hierarchy/Gaps (Tarski).
  2.  **The Counter:** The Strengthened Liar (Revenge).
  3.  **The Cost:** The Diagonal Lemma (Inevitability).

  ### The One Example
  **Use the Strengthened Liar:** *"This sentence is not true."*

  **Why this one?**
  *   **It must lack:** The word "false." If you use "false," they will cling to Misconception #2 (that this is a problem about negation or bivalence).
  *   **It must have:** The predicate "true." This is crucial. If they propose a "gap" solution (the sentence has *no* truth value), the Strengthened Liar catches it. If it has no truth value, then it is *not true*. If it is *not true*, then what it says is the case. So it is true. Contradiction returns.
  *   **Why not the Standard Liar?** The Standard Liar ("This sentence is false") allows them to escape via the "gap" move. You want to block the escape route, not walk down the road they already know.
  *   **Why not a sentence *about* the Liar?** Keep it self-contained. A sentence referring to another sentence introduces indexical complexity that wastes time. The Strengthened Liar does the same work internally.

  ### The Sequence (50 Minutes)

  #### 1. Diagnosis & The Standard Fix (0–10 mins)
  *   **Action:** Write the Standard Liar ("This sentence is false") on the board. Ask them to state the standard fix they learned in Intro.
  *   **Goal:** Elicit the Tarskian Hierarchy/Type Theory. Get them to say: "We ban self-reference," or "Truth is indexed (True₁, True₂)," or "It's meaningless."
  *   **Crucial Move:** Formalize their intuition. Write on the board: **Solution = Ban self-reference / Create hierarchy.**
  *   **Head off Misconception #1 ("It's not a sentence"):**
      *   *When:* As soon as someone says "It's gibberish."
      *   *How:* Distinguish **Grammar** from **Semantics**. "Grammatically, 'Colorless green ideas sleep furiously' is fine. Semantically, it's odd. The Liar is grammatically perfect. If we ban it, we aren't fixing grammar; we are restricting what *meanings* are allowed. That's a cost, not a cleanup."

  #### 2. The Trap: The Strengthened Liar (10–25 mins)
  *   **Action:** Erase "false." Write "not true." *"This sentence is not true."*
  *   **Goal:** Break the "Gap" solution.
  *   **The Move:** Ask them to apply their fix from Part 1.
      *   *Student:* "It has no truth value."
      *   *You:* "Okay. If it has no truth value, is it true?"
      *   *Student:* "No."
      *   *You:* "So it is *not true*."
      *   *You:* "Look at the sentence. What does it say?"
      *   *Student:* "It says it's not true."
      *   *You:* "And we just agreed it is not true. So what it says is the case. So it's true."
  *   **Head off Misconception #3 ("Assigning no truth value ends the matter"):**
      *   *When:* Right in the middle of this exchange.
      *   *How:* This is the pivot point. Explicitly state: "The gap solution works for 'False,' but it fails for 'Not True.' 'Not True' covers both 'False' *and* 'No Value.' If you posit a gap, you create a new sentence that targets the gap."
  *   **Head off Misconception #2 ("It's negation specifically"):**
      *   *When:* If they try to blame the "not."
      *   *How:* Remind them "True" is the operator here. We aren't negating a truth value; we are predicating the absence of truth. This shows the problem is the concept of **Truth**, not the logic of **Negation**.

  #### 3. The Cost: The Diagonal Lemma (25–40 mins)
  *   **Action:** Now they might say: "Okay, fine, that sentence is tricky. Let's just ban self-reference entirely."
  *   **Goal:** Show that banning self-reference is impossible without breaking arithmetic/language.
  *   **The Move:** Introduce the Diagonal Lemma *conceptually*, not mathematically.
      *   *Script:* "You want to ban self-reference by rule. But Gödel showed that in any system rich enough to do basic arithmetic, self-reference isn't a bug you can delete; it's a feature that grows back. The Diagonal Lemma proves that for any property P, you can construct a sentence that says 'I have property P'."
  *   **Why here?** This fits *after* the Strengthened Liar. Once they see the paradox survives the Gap fix, they will want to ban the mechanism (self-reference). The Diagonal Lemma tells them **they can't**.
  *   **The Implication:** If you ban self-reference to save Truth, you must weaken Arithmetic. If you keep Arithmetic, you must accept that Truth cannot be fully defined within the system.
  *   **Head off the "Word Game" vibe:**
      *   *When:* Introducing the Lemma.
      *   *How:* Emphasize that this isn't about English sentences anymore. It's about numbers. "This sentence" can be encoded as a number. If you ban the Liar, you are banning a theorem of arithmetic. That is the **cost**.

  #### 4. Conclusion & The Final Question (40–50 mins)
  *   **Action:** Summarize the trade-off. Tarski saves consistency by sacrificing **Semantic Closure** (the ability of a language to define truth for itself).
  *   **The Final Question:**
      *   *Ask:* "If we accept Tarski's hierarchy to avoid the paradox, what is one true thing about our language that we are now forbidden from saying?"
      *   *Expected Answer:* "We cannot say 'The Liar sentence is not true' within the same language," or "We cannot define truth for our own language."
      *   *Why this works:* It forces them to articulate the *expressive loss*. If they say "We can't say the Liar," they missed the point. If they say "We can't state the truth conditions of our own logic," they get it.

  ### What to Explicitly Refuse (The "Do Not Enter" Signs)
  To stay within 50 minutes, you must aggressively prune the following. Put these on the board as "Out of Scope":

  1.  **Paraconsistent Logic:** Do not let them suggest "Maybe it's both true and false." That solves the paradox but changes the logic. You are discussing the cost of the *standard* fix (Tarski/Classical).
  2.  **Kripke's Fixed Point Mechanics:** Do not explain *how* the gaps are structured (grounded vs. ungrounded). Just use the *concept* of a gap to show it fails against the Strengthened Liar.
  3.  **Contextualism:** Do not let them argue "It changes context." That's a different solution. Stick to the hierarchy/cost argument.
  4.  **Curry's Paradox:** You mentioned they haven't seen it. Do not introduce it. It involves implication and explosion, which distracts from the Truth/Negation/Gap dynamic you are building.

  ### Summary of Misconception Mapping

  | Misconception | When it forms | How to head it off |
  | :--- | :--- | :--- |
  | **1. "It's not a sentence / meaningless"** | **Min 5:** When reviewing the Standard Liar. | Distinguish Grammar (valid) from Semantics (problematic). If it were meaningless, arithmetic couldn't generate it (Diagonal Lemma). |
  | **2. "The problem is Negation"** | **Min 15:** When switching to Strengthened Liar. | Point out the predicate is "True," not "False." "Not True" targets the Gap, not just the opposite value. |
  | **3. "Gaps (no truth value) solve it"** | **Min 20:** During the Strengthened Liar analysis. | Show that "Not True" is satisfied by the Gap. The Gap *makes* the sentence true. |

  ### Final Advice on the Diagonal Lemma
  Keep it philosophical, not mathematical. Do not write out the arithmetic.
  *   **Say:** "The Diagonal Lemma shows self-reference is **inevitable** in any system that can talk about numbers."
  *   **Don't Say:** "Here is the Gödel numbering function..."
  *   **Why:** You need the *weight* of the Lemma (that you can't just ban this), not the *proof* of the Lemma. The weight justifies why the Tarskian fix is expensive (it requires a hierarchy that makes the system incomplete regarding its own truth).

  If you stick to the **Strengthened Liar** as your single engine, and use the **Diagonal Lemma** only to explain why we can't just delete the engine, you will land the plane in 50 minutes.
