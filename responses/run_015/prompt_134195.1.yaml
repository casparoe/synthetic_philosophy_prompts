answer: |-
  Your interchangeability view is sophisticated, but its structural complexity creates specific points of exposure. Below is a map of these vulnerabilities, ranked from fatal to merely awkward, distinguishing between concessions a defender should make and dismissals based on rival assumptions.

  **1. Overgeneration: The Waste-Not Case (Fatal)**
  The most severe threat comes from cases where the membership claim and no-free-riding condition are met, yet blame is intuitively absent. Your 'waste-not' scenario is decisive here. If the meat is already bought and will be binned unless you eat it, the harm (the killing) is fully constituted by the purchaser's act. Your consumption is an interchangeable instance of 'eating meat', but it does not constitute the harm; it merely utilises the residue of a harm already constituted.

  *Defender's Stance:* You should **concede** this counts against the view as currently formulated. To dismiss it by insisting consumption always drives production rests on a causal assumption your Membership Claim was designed to bypass. If the Membership Claim holds that acts are wrong because they are instances of a harm-constituting practice, you must refine what counts as the relevant practice. If the practice is 'purchasing', your eating is not a member. If the practice is 'eating', you must explain why eating waste meat belongs to the same harm-constituting kind as eating fresh meat. Without this distinction, the view overgenerates wrongness. The 'legitimation' case (voting) is less damaging; if we agree to be bound, the duty arises from the agreement, not the interchangeability, so you can **dismiss** this as a category error without harm.

  **2. Insulation: The Limiting Conditions (Fatal Risk)**
  You worry your three limiting conditions (modest exit cost, constituted harm, no crowding-out) render the view unfalsifiable. This is a genuine methodological hazard. If 'modest cost' is defined by reference to whether we intuitively feel the agent is obliged to exit, the condition is circular. It protects the theory from counterexamples by adjusting the parameters to fit the desired verdict.

  *Defender's Stance:* You must **concede** this is a problem if the conditions lack independent grounding. For a normative view, unfalsifiability is as damaging as for an empirical one; it suggests the theory explains nothing because it accommodates everything. To avoid this, you must define 'modest cost' independently of the moral intuition at stake—for instance, by referencing financial cost or social sanction measurable without recourse to moral judgement. If you cannot do this, you must admit the conditions are evasive shields rather than principled boundaries. However, you can **dismiss** the charge if you can argue these conditions are conceptual prerequisites for duty (e.g., 'ought implies can'), rather than ad hoc additions.

  **3. The Disjunction Worry (Awkward)**
  Your two positive grounds cover disjoint territory: Membership handles provably zero-difference cases; the Backstop handles probabilistic cases. This looks like belt-and-braces pluralism, but risks incoherence. If the Backstop works via expected utility, why do we need Membership? If Membership works via constitutive wrongness, why rely on empirical uncertainty?

  *Defender's Stance:* You should **dismiss** the charge of ad hocery, arguing instead for honest moral pluralism. Different metaphysical grounds can support the same normative conclusion. However, you must **concede** that if the Membership Claim is rejected, the view collapses into standard act-consequentialism with better empirical data. The two halves do not reinforce each other; they operate in separate logical spaces. If you delete the Membership Claim, the Backstop remains robust but loses its force in zero-difference scenarios. If you delete the Backstop, the Membership Claim stands but looks metaphysically mysterious. The view is not unified, but this is awkward rather than fatal, provided you acknowledge the pluralism.

  **4. The Empirical Question (Awkward)**
  Suppose we learned individual choices have absolutely no causal ripple—no thresholds, no signals. This is decisive against the Backstop, which relies on non-zero expected difference. It is merely awkward for the Membership Claim, which claims independence from causal facts.

  *Defender's Stance:* You should **concede** the Backstop falls in this scenario, but **dismiss** the idea that this undermines the whole view. The Membership Claim is meant to be independent of causal outcomes; it rests on the nature of the act, not its consequences. However, this exposes a tension: if the Backstop is your safety net for those who reject Membership, and empirical facts destroy the Backstop, you leave sceptics with nothing. Evidence that choices *do* ripple supports the Backstop but is irrelevant to the Membership Claim. You must clarify that the view's core is the Membership Claim, with the Backstop serving only as a persuasive bridge for consequentialists.

  **5. Crowding-Out Evidence (Awkward)**
  Does the fact that individual action might crowd out collective action count against the wrongness claim or the advice? If acting on your view prevents more effective collective organisation, is the act still wrong?

  *Defender's Stance:* You should **concede** this affects what we should *urge* rather than the *wrongness* of the act itself. An act can be pro tanto wrong yet be the best option available in non-ideal conditions. However, this creates a gap between moral status and practical guidance. If you advise agents not to act on the duty because it crowds out collective action, you undermine the urgency of the duty. You can **dismiss** the idea that this negates the wrongness, but you must accept it complicates the practical implication of your view. It suggests the view is better at diagnosing wrongness than prescribing action.

  **Conclusion**
  Your view's greatest exposure lies in the 'waste-not' counterexample and the potential circularity of your limiting conditions. These require refinement before publication. The disjunction and empirical issues are manageable provided you accept the view is a pluralistic package rather than a unified theory. The crowding-out condition limits the view's practical force but not its theoretical coherence. Prioritise tightening the definition of the 'harm-constituting practice' to exclude waste cases, and ground your limiting conditions independently of moral intuition.
