answer: |-
  **The question, stated precisely**

  The Repugnant Conclusion posits that for any world of very happy people, there is a better world containing vastly more people whose lives are barely worth living. This argument relies on aggregating wellbeing into a single scalar value per life, treating existence as a container of utility. However, "a life barely worth living" is ambiguous: it could describe a uniformly drab existence marginally above neutrality, or a volatile life with significant highs and lows that averages to the same margin. My research asks whether this equivocation drives the repugnance. Specifically, I propose to investigate whether a population axiology sensitive to the *shape* of wellbeing within a life—its variance, peaks, and troughs—can dissolve the Repugnant Conclusion without generating new absurdities, thereby determining if the distribution of welfare over time is a morally relevant variable that current frameworks ignore.

  **Why the existing debate leaves it open**

  The standard landscape of population ethics offers several escape routes from the Repugnant Conclusion, yet none isolate within-life distribution as a variable. Totalism accepts the conclusion grimly, summing welfare across all lives regardless of how that welfare is structured internally. Averagism avoids the conclusion by maximizing mean welfare, but it implies the "sadistic conclusion," where adding miserable people is preferable to adding happy ones if the average drops less, still treating lives as single values. Person-affecting views restrict moral concern to existing or specific future people, but they struggle with non-identity problems and often collapse into totalism when comparing same-number choices. Critical-level views assert that lives must exceed a positive threshold to add value, yet they define this threshold as a scalar point, indifferent to whether a life crosses it via steady contentment or erratic spikes. Lexical threshold views argue that high-quality lives cannot be outweighed by any quantity of low-quality lives, but they typically define quality by intensity or capacity, not temporal distribution.

  Furthermore, impossibility theorems suggest that no theory can satisfy all intuitively compelling adequacy conditions simultaneously, forcing theorists to choose which intuition to violate. However, these proofs operate on the assumption that individual wellbeing is fully represented by a lifetime sum or average. They do not test whether breaking that lifetime sum into temporal components changes the logical landscape. By treating a life as a black box containing a net value, existing frameworks assume that a life of torture followed by ecstasy is ethically identical to a life of mild comfort if the totals match. This assumption remains unchallenged. If the moral value of a life depends not just on its sum but on its trajectory, the impossibility results may not apply in the same way, or the trade-offs might shift. The debate remains open because it has not yet interrogated whether the unit of aggregation—the life itself—is being measured correctly.

  **Approach**

  Over three months of part-time research, I will develop a formal framework for shape-sensitive population ethics. In the first month, I will focus on formalization. I need to define "shape" rigorously, moving beyond metaphor to mathematical properties such as variance, skewness, and peak intensity over time. I will construct a model where individual welfare is not a scalar $W$ but a function $W(t)$ over time, allowing for different aggregation rules within the life before aggregation across lives. This requires selecting which temporal features matter: does a single peak of ecstasy justify weeks of mild discomfort? I will draft definitions for "drab" versus "volatile" barely-worth-living lives to ensure the distinction is robust.

  In the second month, I will construct candidate axiologies. I will explore models that apply a discount factor to volatile lives, or conversely, a premium to lives with significant peaks, testing how these modifiers interact with population size. For instance, a "peak-weighted" view might value a world of fewer, deeply meaningful lives over a world of many flat lives, even if the total utility sum is lower. I will compare these against standard totalist and averagist models to identify where the rankings diverge. The goal is to produce a specific principle, such as "Within-Life Variance Constraint," that can be plugged into population ethical calculations.

  In the third month, I will test these candidates against standard impossibility-style constraints. I will check for violations of dominance, transitivity, and non-elicitation of the Sadistic Conclusion. Crucially, I must address the strongest objection: that shape-sensitivity is ad hoc. To counter this, I will seek independent motivation for why shape matters, perhaps drawing on theories of narrative unity or psychological realism, rather than merely tuning the model to avoid the Repugnant Conclusion. If the shape-sensitive view only works by arbitrarily penalizing drab lives to get the desired result, it fails. I will document whether the shape-sensitive view requires new, independent moral premises or if it flows naturally from existing accounts of wellbeing.

  **What a result would look like**

  A successful outcome would be a principled shape-sensitive axiology that avoids the Repugnant Conclusion without violating independently compelling adequacy conditions. Specifically, the model should rank a world of high-quality lives above a world of trillions of drab lives, while remaining neutral or positive about volatile lives that clear a higher threshold of meaningfulness. This would demonstrate that the repugnance is indeed partly an artifact of ignoring within-life distribution, relocating the ethical burden from population size to life quality.

  However, an instructive failure is equally valuable. The research might reveal that shape-sensitivity generates a new repugnant conclusion, such as the "Spike World" problem: a world containing a few individuals with momentary, drug-induced ecstatic peaks might outrank a world of sustained, moderate happiness. If the model implies that we should prioritize creating beings capable of extreme spikes over beings capable of sustained contentment, this would highlight a different ethical hazard. Either outcome clarifies the logical space. Success validates the intuition that life shape matters; failure isolates exactly which shape preferences are untenable. Both results refine the tools available for evaluating global interventions.

  **Failure conditions and scope**

  Three months of part-time research is sufficient for a conceptual map and preliminary formalization, but not for a full axiomatic proof. I must be candid that the primary risk is the charge of ad hocery. If I cannot motivate the preference for certain shapes independently of the desire to avoid the Repugnant Conclusion, the project will fail to persuade. To manage scope, I will not attempt to solve the entire impossibility theorem landscape. Instead, I will focus on a specific subset of conditions relevant to global health funding, such as dominance and non-sadism. If the formal math proves intractable, I will pivot to a rigorous conceptual analysis that clarifies the intuition pumps. The deliverable will be a working paper outlining the model and its implications, rather than a finalized theory. If the shape-sensitive view collapses under basic consistency checks, I will document precisely where and why, which is itself a contribution to the field.

  **Why this matters for grantmaking**

  For a foundation, this is not merely abstract philosophy; it impacts how we weigh interventions. Our current cost-effectiveness models often aggregate small benefits across many people, implicitly favoring interventions that add marginal wellbeing to vast populations over those that transform fewer lives. If the shape of wellbeing matters, a intervention that provides a decade of moderate health might be less valuable than one that prevents a specific, devastating suffering, even if the total QALYs are similar. Understanding whether "barely worth living" gains are ethically equivalent to "meaningful" gains helps us decide between funding many bednets versus funding novel vaccine research. Clarifying the value of life quality versus life quantity ensures our capital drives interventions that create genuinely flourishing lives, not just statistically positive ones.
