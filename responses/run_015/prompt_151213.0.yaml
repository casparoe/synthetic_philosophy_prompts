      *   *Response to Claim 1 (Ontological Commitment):* It doesn't construct new ontology; it eliminates an inconsistent one. It shows Aristotle's theory is incoherent *given certain assumptions about composition*. It doesn't prove nature *must* behave that way, only that Aristotle's description *cannot* behave that way.
      *   *Response to Claim 2 (Knowledge via Idealization):* Idealization is the smuggling mechanism. The "vacuum" isn't just a definition; it's an empirical claim that resistance *can* be negligible or that gravity acts *through* matter in a specific way.
      *   *Response to Claim 3 (Analytic vs. Knowledge):* If it's analytic, it's true by definition within the model, not necessarily true of the world. Analytic truths don't dictate physical behavior without a bridge principle (which is empirical).
