  **AXIOM ASSURANCE GROUP**
  **Service Catalogue: Integrity Through Structural Constraint**

  **The Strategic Misreporting Vulnerability**
  When committees face three or more viable alternatives, standard voting protocols expose the organization to Strategic Misreporting Risk. If every option can win, every member votes, and the rule is deterministic, incentive compatibility is mathematically impossible without structural constraints. In this environment, somebody somewhere can profit from lying about what they want. Axiom Assurance eliminates this vulnerability. We offer five distinct protocols that guarantee truth-telling is the dominant strategy for all participants, ensuring your governance design remains robust against tactical manipulation.

  **1. Designated Outcome Arbiter**
  *One individual determines the result, removing all inter-agent strategic interdependence.*
  **Fine Print:** The Arbiter's preference ordering dictates the final selection regardless of other voters' inputs. In a recent faculty search with three shortlisted candidates, the Arbiter selected Candidate B despite unanimous preference for Candidate A among the rest of the panel, ensuring no incentive existed to misrepresent ranking. The Arbiter's selection binds even when technical consensus suggests the decision is suboptimal regarding facility plumbing or budget constraints.

  **2. Domain Residency**
  *Voters are coached until their preferences are single-peaked along the organisation's official Alignment Axis.*
  **Fine Print:** Plain majority rule becomes safe once preference profiles are restricted to a single dimension. Non-conforming alternatives are filtered during the preprocessing phase to maintain axis integrity. For example, a capital improvement project that does not sit on the approved cost-benefit axis is quietly removed from the agenda before voting commences, preventing cyclical majorities.

  **3. Continuity Voting**
  *The status quo always wins, which is strategy-proof in the most boring way imaginable.*
  **Fine Print:** This constant function ensures no participant can alter the outcome through misreporting, as the output remains invariant to input. Change requires unanimous consent to override the default, effectively neutralizing coalition building. This tier is recommended for organizations where stability is valued higher than allocative efficiency or responsive adaptation to member needs.

  **4. Binary Discipline**
  *Every decision is restated as a single yes/no on one proposal, because two options are safe.*
  **Fine Print:** Agendas are strictly limited to two alternatives to prevent vote-splitting and manipulation vectors. For a 400-unit co-op deciding between the roof, the windows and a solar array, Binary Discipline reduced the ballot to 'Roof Repair vs. Status Quo,' removing the solar option to maintain two-option integrity. Amendments are prohibited to ensure the choice set never exceeds the safety threshold.

  **5. Rotating Arbiter**
  *A random dictator is selected from the voter pool, introducing ex-ante fairness.*
  **Fine Print:** This randomized social choice function is strategy-proof because each voter can only ever move probability onto their own favourite option. No voter can influence the probability distribution of non-favorite outcomes, eliminating the benefit of tactical ranking. While ex-post outcomes may appear arbitrary, the ex-ante expected utility maximization requires honest reporting of true preferences.

  **Client Testimonial**
  *"Before Axiom, our housing board spent months gerrymandering agendas. Now we use Domain Residency. We no longer discuss projects that fall outside the Axis, and nobody tries to game the vote. The roof leaks, but the process is sound."*
  — **Chair, Oakwood Heights Co-op**

  **Appendix Note: Practical Immunity**
  For clients unwilling to adopt structural constraints, we offer a Computational Hardness package. Manipulation still exists but finding it is computationally expensive. Please note this is a speed bump, not a proof; determined actors with sufficient processing power can still reverse-engineer optimal lying strategies, though this tier usually delays exploitation until the next fiscal quarter.
