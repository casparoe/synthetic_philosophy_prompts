answer: |-
  The wall continues to seem just as it did.
  Not that the red has faded from the brick.
  Nor does the nerve cease signaling pain.
  We are not saying there is nothing here.
  We keep the sound, we keep the word.
  Of how things are with us we know.

  There is no step of it she does not know.
  But still the seem of qualities sits on sense.
  She finds the word too thin, this empty word.
  As if the red were more than surface reflectance.
  As if the theory promised nothing but loss.
  While the body insists on the fact of pain.

  This judgment rises from the same site as pain.
  It is a mechanism claiming to know.
  Which leaves the subject with nothing but the mesh.
  It does not change the way the lights seem.
  The brick remains stubbornly, physically red.
  This is just another ordinary word.

  We use every word, every standard word.
  We report the pain without the inner glow.
  We point to red without the phenomenal tint.
  That the report works well, we know.
  Even if the state does not seem as claimed.
  There is nothing extra added to the sum.

  Explaining it away changes nothing in the feel.
  We have only this word, this worn word.
  The story tells us why things must seem true.
  While the nerve fires signals labeled pain.
  It is a user-illusion, we know.
  Like the brick that stays brick and stays red.

  So the red persists on the surface of the page.
  And nothing in the ink denies the shape.
  Why the text persists here, we know.
  Each sound an output, each a spoken word.
  Describing pain without the private sting.
  Until the whole account begins to seem.

  We know the word, we track the living red,
  Accept the pain while silence fills the gap;
  It continues to seem, though nothing more is said.

  ***

  **Note on the rotation:**
  The end-words track the argument's movement from datum to explanation to self-application. *Seem* and *pain* anchor the phenomenological reality that is not denied; *red* and *word* track the vocabulary that survives the elimination of the property; *nothing* marks the ontological subtraction; *know* marks the theoretical uptake. The envoy distributes these across three lines to show their coexistence: the knowledge (*know*), the vocabulary (*word*, *red*), and the feeling (*pain*) persist even as the ontology is denied (*nothing*), because the appearance (*seem*) is mechanism-insensitive.
