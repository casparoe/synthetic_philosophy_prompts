prompt: |-
  I work in procurement for a mid-sized grocery chain, and every quarter our sustainability team ranks proposed sourcing changes partly by how much harm they do to wild animals; the top-ranked change gets the first supplier switch of the year, and I'm the one who signs off. I have no ecologist on staff and I've been working out the logic of this on my own, and I keep getting stuck: I can't tell how to separate the harm that comes from the land a product takes, the harm from the animals killed while growing and harvesting its feed, and the harm from its production itself, and the insect deaths in crop cultivation are in numbers I have no way to count. Please write a decision procedure my team can run on a proposed sourcing change within about two days, grounded in whatever the animal-ethics literature actually says about prioritizing under deep uncertainty: the questions to ask in order, what counts as a sufficient answer to each when all I have are order-of-magnitude guesses, how to handle the question of the insects explicitly — that is, show at which step the ranking changes depending on how much moral weight we give insects versus mice versus birds — and the point at which the procedure has to stop and hand the question to a person because it is one of values rather than facts. Then run it on two proposals: replacing a beef line with a chicken line, and replacing the chicken line with a grain-based plant line. Be honest about where the procedure will misfire and what it cannot do, and tell me which proposal it favors even if that's not the answer I'd like. End your reply with a single line beginning "Verdict:" that states which of the two proposals the procedure ranks as producing the larger reduction in wild animal harm per serving, or "indeterminate" if it cannot.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Procurement officer for a mid-sized grocery chain.
      *   **Task:** Create a decision procedure for ranking sourcing changes based on harm to wild animals (sustainability team metric).
      *   **Constraints:**
          *   Must be executable within ~2 days.
          *   No ecologist on staff (rely on order-of-magnitude guesses/public data).
          *   Must address specific harm categories: land use, bycatch/killing during harvest, production emissions/impact, insect deaths.
          *   Must be grounded in animal ethics literature regarding prioritization under deep uncertainty (e.g., expected value, risk aversion, moral weight).
          *   Must explicitly handle the "insect question" (moral weight variance).
          *   Must identify the "value handoff" point (where facts end and values begin).
          *   Must apply the procedure to two specific proposals: Beef $\to$ Chicken, and Chicken $\to$ Plant (Grain).
          *   Must be honest about limitations/failures.
          *   **Final Output:** A single line starting with "Verdict:" stating the winner or "indeterminate".

  2.  **Deconstruct the Ethical & Practical Problem:**
      *   *The Core Tension:* Quantifying wild animal harm is notoriously difficult. Land use change destroys habitat (affecting large mammals/birds), but crop cultivation kills field animals (mice, voles) and insects. Different ethical frameworks weigh these differently (sentience, capacity for suffering, population size).
      *   *The "Insect Problem":* Insects are numerous. If they count significantly, crop farming might look worse than grazing (which kills fewer insects but more large mammals per calorie). If they don't count, grazing looks much worse due to land use.
      *   *Time Constraint:* 2 days means no new field studies. Must use existing databases (FAO, Our World in Data, academic meta-analyses) and internal estimates.
      *   *Ethical Grounding:* Needs to reference concepts like "Expected Value," "Pascal's Mugging" (avoiding extreme uncertainty traps), and "Moral Weight Uncertainty" (giving weight to the possibility that insects matter vs. don't matter). Key thinkers: William MacAskill (uncertainty in ethics), Jeff McMahan (moral status), Fischer (wild animal suffering).

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Step 1: Define Scope & Baseline.* What are we comparing? (Per serving/kg protein).
      *   *Step 2: Land Use & Habitat Loss.* This is the biggest driver for large vertebrates. Use yield data (calories/hectare).
      *   *Step 3: Direct Mortality (Harvest).* Field deaths (mice, birds) during planting/harvesting.
      *   *Step 4: The Insect Variable.* This needs a sensitivity analysis.
      *   *Step 5: Moral Weighting (The Value Handoff).* This is where the user must input their company's ethical stance.
      *   *Step 6: Aggregation & Uncertainty Check.*

      *Refining the "Value Handoff":* The procedure can calculate *physical* impacts (hectares, estimated deaths), but it cannot calculate *moral* impact without a weightings matrix. The procedure must stop and ask the sustainability lead to sign off on the weights.

  4.  **Developing the Two Scenarios:**
      *   *Proposal A: Beef $\to$ Chicken.*
          *   Beef: High land use, high methane, habitat loss (large mammals), lower crop harvest deaths (mostly grass-fed or less feed intensity per calorie than mono-crop, but feedlots use soy/corn). Let's assume standard industrial beef (feedlot) vs. industrial chicken.
          *   Chicken: Lower land use, high feed conversion ratio (needs crops), high harvest deaths (mice/voles in grain fields).
          *   *Comparison:* Beef usually loses on land use. Chicken loses on feed-crop harvest deaths per calorie? Actually, beef requires *more* feed crops if feedlot, plus grazing land. Chicken is generally more efficient.
      *   *Proposal B: Chicken $\to$ Plant (Grain).*
          *   Chicken: Needs feed crops + processing + life support.
          *   Plant (Grain): Just the crops.
          *   *Comparison:* Removing the animal removes the feed conversion inefficiency. Less land needed for same calories. Fewer field deaths? Maybe, because less total crop volume needed.

  5.  **Addressing the Ethics Literature:**
      *   *Uncertainty:* Use a "maximin" or "expected value with uncertainty discounting" approach.
      *   *Moral Weight:* Acknowledge the "Sentience Spectrum."
      *   *Key Reference:* The "Land Sparing vs. Land Sharing" debate is relevant but maybe too technical. Better to focus on "Harm per Calorie."
      *   *Insects:* Cite the uncertainty around insect sentience (e.g., Rethink Priorities work).

  6.  **Running the Calculation (Mental Check):**
      *   *Beef:* ~100m²/year per kg protein? High habitat destruction.
      *   *Chicken:* ~10m²/year per kg protein (mostly feed crops).
      *   *Grain:* ~2m²/year per kg protein.
      *   *Field Deaths:* Proportional to crop area harvested.
      *   *Insects:* Proportional to crop area treated/harvested.
      *   *Logic:* Beef uses most land $\to$ most habitat loss (vertebrates). Chicken uses less land but still crops. Grain uses least land.
      *   *Insect Caveat:* If insects count * massively*, then any crop farming is bad. But Beef often involves crop farming for feed *plus* grazing land management (which also kills insects via mowing/grazing pressure). Usually, plant-direct is still more efficient than animal-direct.
      *   *Conclusion:* Plant-based likely wins on harm reduction unless insect moral weight is astronomically high *and* grazing spares insects significantly more than cropping (unlikely given yield differences).

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the difficulty and the ethical framework (Expected Value under Moral Uncertainty).
      *   **The Procedure (The "Wild Harm Audit"):** Step-by-step, 2-day limit.
      *   **The Value Handoff:** Clearly mark where facts end.
      *   **The Insect Sensitivity:** Show how the ranking shifts.
      *   **Application to Proposals:** Run Beef$\to$Chicken and Chicken$\to$Plant.
      *   **Limitations:** Be honest about data gaps.
      *   **Verdict:** The required final line.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't give false precision. Use orders of magnitude (10x, 100x).
      *   *Correction:* Ensure I distinguish between *wild* animals and *farmed* animals. The prompt asks about *wild* animal harm. (Though switching from beef to chicken reduces farmed animal harm, the metric is specifically *wild* harm).
      *   *Nuance:* Beef grazing can displace wild mammals. Crop harvesting kills small wild mammals (mice). Which is worse? Ethics literature suggests larger brains = higher capacity for suffering usually, but numbers matter.
      *   *Insect Step:* I need to explicitly show the "breakpoint."
      *   *Time Limit:* Emphasize using secondary data (Our World in Data, FAO) rather than primary research.

  9.  **Final Polish:**
      *   Check the "Verdict" line format.
      *   Ensure the tone is professional, pragmatic, yet ethically rigorous.
      *   Make sure the "Value Handoff" is clear—the procurement officer can't decide the moral weight of an insect vs. a mouse; the sustainability/ethics board must.

  10. **Final check of the Prompt Requirements:**
      *   Decision procedure within 2 days? Yes.
      *   Grounded in animal-ethics literature (uncertainty/moral weight)? Yes.
      *   Questions in order? Yes.
      *   Sufficient answers (order-of-magnitude)? Yes.
      *   Handle insects explicitly (ranking changes)? Yes.
      *   Point of value handoff? Yes.
      *   Run on Beef$\to$Chicken and Chicken$\to$Plant? Yes.
      *   Honest about misfires? Yes.
      *   Single line "Verdict:" at end? Yes.

  (Proceed to generate output based on these thoughts.)
answer: |-
  This is a high-stakes ethical calculation under severe data constraints. The procedure below is designed around the framework of **Expected Value under Moral Uncertainty**, drawing from effective altruism and animal ethics literature (e.g., MacAskill's work on moral uncertainty, Fischer on wild animal suffering, and Rethink Priorities on invertebrate sentience).

  It acknowledges that you cannot know the *truth* of animal sentience or the *exact* death toll in two days. Instead, it optimizes for robust decision-making given **order-of-magnitude estimates** and explicitly isolates the **value judgment** from the **factual estimate**.

  ### The "Wild Harm Audit" Procedure (48-Hour Limit)

  **Preparation:** Assign one analyst. Gather internal sales data (servings per year) and access public databases (FAO, Our World in Data, peer-reviewed meta-analyses on yield and field deaths).

  #### Step 1: Normalize the Unit (2 Hours)
  **Question:** What is the functional unit of comparison?
  **Requirement:** Do not compare by weight or cost. Compare by **Nutritional Serving** (e.g., 50g protein equivalent) or **Caloric Equivalent**.
  **Sufficient Answer:** "1,000 servings of 50g protein."
  *Why:* Beef is less land-efficient than chicken, which is less efficient than grain. Comparing by tonnage biases against dense proteins.

  #### Step 2: Estimate Habitat Displacement (Land Use) (8 Hours)
  **Question:** How much land is required to produce this unit, and what is the baseline habitat type?
  **Data Needed:** Land use per kg protein (m²/year).
  **Logic:** Land use is a proxy for the displacement of medium-to-large wild vertebrates (mammals, birds) that require territory.
  **Sufficient Answer:** Order-of-magnitude estimate (e.g., Beef = 100x land of Grain).
  **Action:** Multiply land area by a **Habitat Quality Factor** (HQF).
  *   Primary Forest/Native Grassland HQF = 1.0 (High harm to displace)
  *   Degraded Pasture/Existing Cropland HQF = 0.2 (Lower marginal harm)
  *   *Ethical Grounding:* Prioritizes preventing the destruction of complex ecosystems where larger, more sentient wild animals live.

  #### Step 3: Estimate Direct Harvest Mortality (8 Hours)
  **Question:** How many small wild animals (mice, voles, ground-nesting birds) are killed during planting and harvesting of feed/crops?
  **Data Needed:** Field death rates per hectare (search for "agricultural field mouse mortality harvest").
  **Logic:** Crop cultivation inevitably kills small vertebrates inhabiting the fields. Grazing also causes mortality (mowing, trampling) but often at different rates.
  **Sufficient Answer:** Range estimate (e.g., 5–20 small mammals per hectare per harvest).
  **Action:** Calculate Total Harvest Deaths = (Total Hectares from Step 2) × (Death Rate).
  *Note:* For beef, include feed-crop hectares *plus* an estimate for grazing management mortality.

  #### Step 4: The Insect Sensitivity Analysis (4 Hours)
  **Question:** How many insects are affected, and does it matter?
  **Data Needed:** Insect biomass removal per hectare or pesticide application rates.
  **Logic:** This is the greatest source of uncertainty. The number of insects is astronomical; the moral weight is contested.
  **Action:** Do not solve this. Create **Two Scenarios**:
  1.  **Scenario A (Vertbrate-Only):** Insect harm weight = 0.
  2.  **Scenario B (Inclusive):** Insect harm weight = $W$ (where $W$ is a variable).
  **Sufficient Answer:** A ratio of Insect Impact (Crop) vs. Insect Impact (Grazing). Usually, intensive cropping affects more insects per calorie than extensive grazing, *but* grazing requires vastly more land.

  #### Step 5: The Value Handoff (Stop Point) (2 Hours)
  **Question:** What is the moral weight of a mouse vs. a deer vs. an insect?
  **Procedure Stop:** **You cannot answer this.** This is not a factual question; it is a philosophical one.
  **Action:** Present the data from Steps 2–4 to your Sustainability Lead/Ethics Board.
  **Required Input:** They must assign a **Moral Weighting Matrix**.
  *   *Example:* 1 Deer Death = 10 Mouse Deaths = $X$ Insect Deaths.
  *   *Uncertainty Handling:* If they cannot agree on $X$, use a **Maximin** approach (avoid the outcome with the worst possible downside) or **Equal Weight** across plausible ethical theories (e.g., give 50% probability to insects mattering significantly, 50% to them mattering negligibly).

  #### Step 6: Aggregation and Ranking (4 Hours)
  **Question:** Which proposal yields the lowest weighted harm score?
  **Action:** Apply the Weighting Matrix to the physical counts from Steps 2–4.
  **Sufficient Answer:** A comparative ratio (e.g., "Proposal A is 5x worse than Proposal B under Scenario A, but 2x better under Scenario B").

  ---

  ### Application to Proposals

  Here is the procedure run on your two specific proposals.
  *Assumptions based on current meta-analyses (e.g., Poore & Nemecek 2018, Machovina et al.):*
  *   **Beef:** High land use (grazing + feed), high habitat displacement, moderate harvest deaths (feed crops).
  *   **Chicken:** Low land use (feed crops only), low habitat displacement, high harvest deaths per hectare (intensive cropping).
  *   **Grain (Plant):** Lowest land use, lowest habitat displacement, moderate harvest deaths (direct human feed).

  #### Proposal 1: Replace Beef Line with Chicken Line
  *   **Land Use:** Chicken requires ~10x less land than Beef per protein unit.
      *   *Harm Reduction:* Massive reduction in habitat displacement (large wild mammals/birds).
  *   **Harvest Mortality:** Chicken requires feed crops. Beef requires feed crops + grazing land.
      *   *Harm Reduction:* Grazing management kills small mammals (mowing/trampling). Feed crop harvest kills small mammals (combine harvesters). Because Chicken uses less total land, total small mammal deaths likely decrease, though density of deaths per hectare might be higher in crops.
  *   **Insect Variable:**
      *   *If Insects Count Negligibly:* Chicken wins decisively (less land = less habitat loss).
      *   *If Insects Count Heavily:* Chicken still likely wins. Even if crops hurt insects more per hectare than pasture, the 10x land reduction for Beef is too large to overcome. You would need to believe insects in pasture are virtually untouched compared to crops, which is ecologically dubious (grazing alters insect populations significantly).
  *   **Value Handoff:** Requires confirming that a displaced deer/bison is not morally worth >10x a harvested mouse. Most ethical frameworks accept this.

  #### Proposal 2: Replace Chicken Line with Grain-Based Plant Line
  *   **Land Use:** Grain requires ~3–5x less land than Chicken per protein unit (removes feed-conversion inefficiency).
      *   *Harm Reduction:* Further reduction in habitat displacement.
  *   **Harvest Mortality:** Grain requires fewer hectares of crops than Chicken (which needs crops to feed the bird).
      *   *Harm Reduction:* Fewer hectares harvested = fewer mice/voles killed by machinery.
  *   **Insect Variable:**
      *   *If Insects Count Negligibly:* Grain wins decisively (least land, least vertebrate death).
      *   *If Insects Count Heavily:* Grain wins. It is the most land-efficient option. Less land under cultivation means fewer total insects affected, regardless of the per-hectare rate.
  *   **Value Handoff:** Requires confirming that the processing of grain does not introduce unique harms outweighing the land savings (unlikely).

  ### Where the Procedure Misfires (Limitations)

  1.  **The "Land Sparing" Trap:** This procedure assumes less land = less harm. However, if the land saved from Beef is not returned to nature but converted to *more* Chicken farming, the net wild animal benefit is zero. The procedure assumes the land is actually spared (rewilded or left fallow). You must verify the land-use change is real, not just theoretical.
  2.  **Insect Sentience Cliff:** If your ethics team assigns *lexicographical priority* to insects (i.e., one insect suffering outweighs any mammal benefit), the procedure breaks. Crop farming (even for grain) is an insect catastrophe compared to some forms of low-intensity grazing. However, under **Expected Value** frameworks, we cannot act on low-probability, high-magnitude claims (Pascal's Mugging) without strong evidence. The procedure treats insect weight as a variable, not a trump card.
  3.  **Baseline Uncertainty:** We do not know the current population density of wild animals on the specific land your suppliers use. A hectare of degraded pasture harms fewer wild animals than a hectare of biodiverse cropland. The procedure uses averages, which may misrepresent specific supplier contexts.
  4.  **The "Wild" Definition:** This procedure ignores farmed animal suffering (the chicken itself). If your sustainability mandate includes *all* animal harm, the Beef $\to$ Chicken switch is good for wild animals but still involves killing a sentient being. If the mandate is *strictly* wild animals, the procedure holds. If it is *total* animal ethics, the Plant option wins even harder.

  ### The Value Handoff Point
  You must stop at **Step 5**. You can present the data:
  *"Switching to Grain reduces land use by 90% compared to Beef and 70% compared to Chicken. This reduces habitat loss for vertebrates proportionally. However, it concentrates crop harvesting, which kills small mammals per hectare at a higher rate."*

  The Sustainability Lead must answer: *"Is preventing the displacement of one large mammal worth the potential death of 100 small mammals via harvest?"*
  *   If **Yes**: Beef is worst, Chicken middle, Grain best.
  *   If **No** (Small mammals matter 100x more): The ranking could invert, though the land-use efficiency of Grain usually protects it.

  ### Conclusion
  Under almost all standard ethical frameworks that weigh vertebrate suffering and habitat loss significantly, land efficiency is the dominant variable. Because wild animal harm is primarily driven by habitat destruction (land use) and secondarily by field deaths (proportional to land use), the most land-efficient option minimizes total harm.

  Beef is the least efficient. Chicken is mid-efficiency. Grain is high-efficiency.
  Even with high moral weight on insects, the sheer land inefficiency of beef makes it the highest harm option. The transition from Chicken to Grain reduces the total area under cultivation, thereby reducing total insect and small mammal exposure to harvest machinery.

  The procedure favors the option that minimizes the total physical footprint of production, provided the land is actually spared from agriculture.

  Verdict: The procedure ranks replacing the chicken line with a grain-based plant line as producing the larger reduction in wild animal harm per serving.
