answer: |-
  ### Ranking of Merit-Based Desert Conceptions

  **1. Desert grounded solely in voluntary effort expenditure**
  **2. Desert as recognition of character formed through sustained disciplined practice**
  **3. Desert tied to success under procedurally fair competitive rules**
  **4. Desert as entitlement to outcomes produced by developed abilities**
  **5. Desert based on the realization of innate potential in the absence of external interference**

  ---

  #### 1. Desert grounded solely in voluntary effort expenditure
  **Justification:** Within a framework that views innate talent as arbitrary, voluntary effort is the most robust basis for desert because it isolates the agent's will from their genetic endowment. Effort represents the "cost" incurred by the individual, which is theoretically within their direct control. While the *capacity* for effort may be influenced by luck, the *expenditure* itself is the clearest marker of agency. This conception survives the luck objection best because it refuses to reward the *result* of talent (which is arbitrary) and instead rewards the *input* of will (which is agentic). It also respects the "socially embedded" constraint by decoupling desert from market valuation or social recognition of the achievement.

  **Comparative Coherence (vs. Rank 2):** The gap between Rank 1 and Rank 2 is narrow. Both prioritize internal agency over external outcomes. However, Rank 1 is slightly more defensible because "effort" is a discrete, voluntary act, whereas "character" (Rank 2) is a disposition formed over time. Character formation is more susceptible to the objection that the *ability* to sustain discipline is itself a product of social upbringing and temperamental luck, making pure effort the cleaner metric of moral arbitrariness.

  #### 2. Desert as recognition of character formed through sustained disciplined practice
  **Justification:** This conception shifts focus from momentary exertion to the moral worth of the agent's developed disposition. It is highly defensible because it rewards the process of self-constitution through practice rather than the lucky possession of gifts. It addresses the luck objection by emphasizing that the character *earned* through practice is distinct from the raw material one started with. However, it is slightly less defensible than pure effort because the capacity to engage in "sustained disciplined practice" often relies on social stability and psychological traits that are not fully voluntary.

  **Comparative Coherence (vs. Ranks 1 & 3):** The distance between Rank 2 and Rank 1 is small, as noted above, because both focus on input rather than output. The distance between Rank 2 and Rank 3 is significantly wider. Rank 2 remains focused on the internal moral state of the agent (character), whereas Rank 3 shifts to external validation (success under rules). Once the metric moves from "who you became" to "whether you won," the theory becomes vulnerable to the arbitrariness of talent and social valuation, creating a coherence drop.

  #### 3. Desert tied to success under procedurally fair competitive rules
  **Justification:** This view argues that if the rules of the game are fair, the winner deserves the prize. It offers a pragmatic defense against the luck objection by ensuring no *procedural* cheating occurred. However, within the specified framework, this is only moderately defensible. Procedural fairness does not neutralize *substantive* unfairness arising from the "natural lottery" of talent or the social contingency of what skills are valued. A procedurally fair race still rewards the person with better innate legs. Thus, it fails to fully insulate desert from morally arbitrary advantages.

  **Comparative Coherence (vs. Ranks 2 & 4):** The gap between Rank 3 and Rank 2 is large because Rank 3 abandons the focus on moral agency for a focus on competitive outcome. The gap between Rank 3 and Rank 4 is narrower but distinct. Rank 3 at least attempts to mitigate arbitrary advantage through *fairness constraints* on the process. Rank 4 (below) drops the procedural constraint and focuses purely on the causal link between ability and outcome, making it more vulnerable to social and genetic luck.

  #### 4. Desert as entitlement to outcomes produced by developed abilities
  **Justification:** This conception claims that if you built the ability and produced the good, you are entitled to the reward. It is weak within this framework because "developed abilities" rest on a foundation of innate talent (morally arbitrary), and "outcomes" are determined by social demand (socially embedded). A surgeon deserves more than a janitor not necessarily because of greater effort, but because society values surgery more. This conception fails the luck objection because it rewards the market value of the talent, which is outside the agent's control, conflating social luck with moral desert.

  **Comparative Coherence (vs. Ranks 3 & 5):** The distance between Rank 4 and Rank 3 is moderate; Rank 3 attempts to filter luck through procedure, while Rank 4 accepts the outcome of ability regardless of procedural context. The distance between Rank 4 and Rank 5 is smaller, as both rely heavily on the value of the individual's capacities. However, Rank 4 is still superior to Rank 5 because it requires *development* (labor), whereas Rank 5 requires only the *existence* of potential.

  #### 5. Desert based on the realization of innate potential in the absence of external interference
  **Justification:** This is the least defensible conception within the specified framework because it explicitly grounds desert in "innate potential." Since the framework defines innate talent as morally arbitrary, rewarding its realization is tantamount to rewarding genetic luck. It treats the individual as a vessel for natural gifts rather than an agent of choice. It fails the luck objection completely: if the potential is undeserved, the realization of that potential cannot generate moral desert, regardless of whether external interference was absent.

  **Comparative Coherence (vs. Rank 4):** The gap between Rank 5 and Rank 4 is significant in principle, though they are neighbors in defensibility. Rank 4 retains a minimal requirement of human agency ("developed" abilities implies work), whereas Rank 5 reduces the agent to a gardener merely removing weeds from a plant they did not plant. In a framework prioritizing agency over arbitrariness, Rank 5 represents the total collapse of merit into luck.
