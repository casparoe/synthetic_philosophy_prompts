  # Decision Tree: The Two-Envelope Configuration

  ### Branch Nodes

  **Node 1: Decision Timing**
  Do you make the decision to swap before opening the envelope, or after seeing the amount $X$ inside?
  *   **Before Opening** → Go to Node 7
  *   **After Seeing $X$** → Go to Node 2

  **Node 2: Information Availability**
  Do you know the rule used to determine the amounts (e.g., a maximum ceiling or a specific probability distribution)?
  *   **Known Rule** → Go to Leaf 1
  *   **Unknown Rule** → Go to Node 3

  **Node 3: Expectation Status**
  Is it possible the amounts were drawn from a process where the average value is infinite (e.g., doubling for every coin flip until tails)?
  *   **Infinite Average Possible** → Go to Node 4
  *   **Finite Average** → Go to Node 5

  **Node 4: Evaluation Metric (Infinite Case)**
  When the average value is infinite, do you judge success by total dollars won or by the long-term growth rate of your wealth?
  *   **Total Dollars** → Go to Leaf 2
  *   **Growth Rate** → Go to Leaf 3

  **Node 5: Probability Assumption**
  Do you calculate the gain assuming the other envelope is equally likely to be half or double for *every* amount $X$ you might see?
  *   **Equal Chance (1/2)** → Go to Node 6
  *   **Depends on $X$** → Go to Leaf 4

  **Node 6: Consistency Requirement**
  If your calculation says "switch" for every specific $X$, do you demand the calculation also say "switch" before you opened the envelope?
  *   **Ex-Ante Match Required** → Go to Leaf 5
  *   **State-Wise Sufficient** → Go to Leaf 6

  **Node 7: Game Frequency**
  Are you playing this game exactly once, or will you play it repeatedly with fresh amounts?
  *   **Once** → Go to Leaf 7
  *   **Repeatedly** → Go to Node 8

  **Node 8: Policy Metric**
  For repeated play, do you measure the policy success by arithmetic mean dollars or by geometric growth rate of wealth?
  *   **Arithmetic Mean** → Go to Leaf 2 (Merged)
  *   **Geometric Growth** → Go to Leaf 8

  ---

  ### Leaves (Positions)

  **Leaf 1: Threshold Strategy**
  *Claim:* You should switch only if the revealed amount is below the known maximum limit; otherwise, keep.
  *Awkward Commitment:* You must reject a swap that doubles your money if the amount happens to equal the known ceiling, even though you cannot know you are at the ceiling.

  **Leaf 2: Undefined Expectation**
  *Claim:* There is no finite expected value to compare, so the question of advantage is mathematically meaningless.
  *Awkward Commitment:* You must treat a guaranteed \$1,000,000 as incomparable to a 50% chance at \$100, because both sit inside an infinite distribution.

  **Leaf 3: Growth-Rate Indifference (Ex-Post)**
  *Claim:* With infinite expectations, log-wealth is a martingale, so switching yields no long-term growth advantage even if dollar expectation is infinite.
  *Awkward Commitment:* You must ignore the infinite dollar gain suggested by arithmetic expectation in favor of a growth metric that reports zero gain.

  **Leaf 4: Evidence-Based Switching**
  *Claim:* You should switch only if the revealed amount $X$ makes it more probable that you hold the smaller envelope based on the likely distribution.
  *Awkward Commitment:* You must possess a prior belief about the filler's budget to make any decision, rendering the "unknown rule" scenario unsolvable.

  **Leaf 5: Equivocation Diagnosis**
  *Claim:* The 1.25 gain calculation is flawed because it treats "the amount in my envelope" as a fixed number in one step and a variable in the next.
  *Awkward Commitment:* You must assert that a calculation yielding a positive gain for every possible state somehow sums to zero gain overall without explaining the aggregation failure.

  **Leaf 6: State-Wise Permission**
  *Claim:* It is rationally permitted to switch for every revealed amount $X$, even if this yields no ex-ante gain before looking.
  *Awkward Commitment:* You must accept that a policy of always switching is neutral before looking but beneficial after looking, violating the principle of conglomerability.

  **Leaf 7: Symmetry Indifference**
  *Claim:* Without opening the envelope, the two positions are indistinguishable, so there is no reason to swap.
  *Awkward Commitment:* You must maintain this indifference even if you know you will later open the envelope and find a reason to switch then.

  **Leaf 8: Growth-Rate Policy (Ex-Ante)**
  *Claim:* In repeated play, maximizing geometric growth rate dictates indifference, as halving and doubling occur equally often under any unconditional policy.
  *Awkward Commitment:* You must reject a policy that maximizes arithmetic dollar return in favor of one that maximizes log-wealth, even for a single wealthy agent.

  ---

  ### Unoccupied Answer-Combinations

  The following table lists combinations of answers allowed by the node questions that yield no coherent leaf position.

  | Answer Combination | Diagnosis |
  | :--- | :--- |
  | **Node 1 (Before): Swap** AND **Node 5 (After): Keep** | **Incoherent:** This profile describes a student who wants to swap before looking but would keep whatever amount is revealed; it implies a preference reversal without new information. |
  | **Node 5 (Equal Chance): Yes** AND **Node 6 (Ex-Ante Match): No** AND **Claim: Ex-Ante Gain Exists** | **Mathematically Impossible:** One cannot accept the 1.25 step for every amount while insisting that switching ex-ante gains nothing *and* that ex-ante gain exists; the integral must match the sum of states. |
  | **Node 3 (Infinite): Yes** AND **Node 4 (Metric): Dollars** AND **Claim: Switch Always** | **Unattractive:** Relying on infinite arithmetic expectation to mandate switching ignores the fact that no finite bankroll can sustain the variance required to realize the mean. |
  | **Node 2 (Info): Known** AND **Node 5 (Equal Chance): Yes** | **Incoherent:** If the rule is known (e.g., a ceiling), the probability cannot be 50/50 for all $X$; it must drop to zero at the limit. |

  *Note on the State-Wise Student:* The student who accepts the one-and-a-quarter step for every possible amount while insisting that switching ex-ante gains nothing occupies **Leaf 6**. While logically consistent within the tree, this position is often diagnosed as "Counter-Intuitive" because it violates the expectation that local advantages must aggregate to a global advantage.
