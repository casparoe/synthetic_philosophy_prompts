answer: |-
  Sarah sits in Mark's office while he drips out her annual review in this weird, non-committal way that leaves her head spinning. He says she's "largely operating at a senior level" but also warns that "certain deliverables missed the mark," and when she asks for a straight rating, he just sighs and says, "Let's say you're somewhere between a solid 3 and a strong 4, but don't quote me." It's not a clear pass or fail, just a foggy mix of praise and caveat that makes her feel more likely to be promoted than yesterday, but definitely not certain she nailed the top tier.

  Here's how the math breaks down. We've got a partition of performance ratings: $E_3$ (Meets), $E_4$ (Exceeds), and $E_5$ (Outstanding). Sarah's prior probablity of promotion ($H$) is based on her expectation of these ratings: she thinks there's a 50% chance she got a 3, 40% for a 4, and 10% for a 5. Historically, a 3 leads to promotion 10% of the time, a 4 leads to it 60% of the time, and a 5 guarantees it (90%+). Under Jeffrey conditionalization, the review doesn't pick one rating; it shifts her confidence across the board. She updates her belief in the ratings themselves to: $Q(E_3)=0.2$, $Q(E_4)=0.7$, $Q(E_5)=0.1$. Her new belief in promotion is the weighted sum: $(0.1 \times 0.2) + (0.6 \times 0.7) + (0.9 \times 0.1) = 0.53$.

  If she uses old-school conditioning, she has to pick the proposition that sounds closest. She decides Mark basically said "You're a 4," so she conditions rigidly on $E_4$. Her new belief in promotion becomes $P(H|E_4) = 0.6$. See the gap? 0.53 vs 0.6. The structural feature doing the work is the *certainty constraint*—Bayes conditioning forces the evidence proposition to probability 1, wiping out the residual uncertainty about whether she might have actually gotten a 3. If you strip away the ambiguity and Mark says "You got a 4," then $Q(E_4)=1$, and the two methods collapse into the same result.

  The standard Bayes defense here is pretty straightforward: there really is a fact of the matter. Mark has a spreadsheet somewhere with a precise number typed in. The ambiguity is just in Sarah's head, not the world. So, a purist would argue she should treat the hidden precise state as the evidence and condition on that, even if she has to model her uncertainty about what that state is using higher-order probabilities, rather than letting the evidence itself remain fuzzy like Jeffrey suggests.
