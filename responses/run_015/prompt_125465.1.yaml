      *   **Participants:** Nadia (defends Thomson's original conclusion: contradiction $\rightarrow$ impossibility) vs. Sam (defends Benacerraf-style reply + physical variant: underdetermination $\rightarrow$ possible but indeterminate/dependent on physics).
      *   **Task:**
