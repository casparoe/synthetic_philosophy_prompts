      *   *Correction on Q3:* Be careful not to suggest a stipulation that just *says* "It's on." It needs to be a rule that *implies* it. A "continuity of causal influence" rule might work.

  6.  **Final Polish:** Check tone. Ensure it sounds like a helpful tutor/adjudicator, not a final authority (philosophy doesn't work that way). Ensure the distinction between logical and physical possibility is clear.

      *(Self-Correction on the TA's comment)*: The TA said "limit state has to be read off the state function rather than off the dynamics." This aligns with Sam's Move 4/6. I should mention this in the conclusion or Q1.

