      *   Regarding error (Darwin): Even if blending inheritance was the dominant paradigm, scientists still have epistemic duties to scrutinise assumptions. Inevitability explains *why* the error occurred, but it doesn't necessarily absolve the agent of *epistemic* responsibility, though it might mitigate *moral* culpability. However, in science, "blame" is usually about correcting the record, not moral sin. The user's claim that "no genuinely alternative reasoning was available" is historically contestable (Mendel was contemporary, though ignored), but philosophically, the key is that epistemic norms apply to the reasoning process, not just the outcome.
      *   The core fallacy is likely a version of the *Naturalistic Fallacy* (deriving 'ought' from 'is') or a *Modal Fallacy* (confusing necessity with normativity). Let's call it the "Inevitability Normativity Fallacy" or conflation of *causal explanation* with *normative assessment*.

