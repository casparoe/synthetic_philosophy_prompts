      *   **Key Claims:** Distinguishes cheap-to-undo vs. hard-to-undo changes without specifying good end states. Avoids pitfalls of state-distance penalties (punishes all change) and feature penalties (needs value spec). Negative result: Bounded final-state penalties either block tasks or allow arbitrary damage.
      *   **Committee:**
          1.  Senior Roboticist (Skeptic of theory, wants practical implementation/world models, worries about gaming the metric).
          2.  Formal-Methods Person (Will attack the negative result, partial observability, branch point definition).
          3.  Decision Theorist (Business School) (Thinks it's just hidden utility, index number problems, counterfactual timing).
          4.  Philosopher of Value (Hostile to "value-free" claims, normative nature of "side effect", status quo bias).
      *   **Deliverables:**
          *   Prep sheet with ~8 objections (ordered by damage potential).
          *   Phrased in the committee members' voices.
          *   2-minute reply for each (memorizable).
          *   Honest note on soft spots (specifically the boundedness-to-continuity step in the negative result).
          *   What to concede immediately (first 2 mins).
          *   The *one* reply that must land for the chapter to matter.
          *   The "Hope Nobody Asks" question (about moving to a *worse* reachable state or removing the register of difference) and how to answer it.

  2.  **Deconstruct the Theory (Mental Check):**
      *   *Core Mechanism:* Compare current state $s_t$ to reachable set $R$ from fallback policy $\pi_{off}$ starting at branch point $t_0$. Cost = min price to get from $s_t$ to some $s' \in R$.
      *   *Constraints:* Restorer can't use affordances created by the agent. Agent's actuators not on the menu.
      *   *Claim:* This captures "reversibility" without knowing "goodness."
      *   *Vulnerabilities:*
          *   How do you calculate cost in high-dim space? (Roboticist)
          *   Can the agent manipulate the cost calculation? (Roboticist/Decision Theorist)
          *   Is the "priced menu" just a utility function? (Decision Theorist/Philosopher)
