      *   *Secondary Intension (2-intension):* Truth conditions evaluated across worlds considered as *counterfactual*. Content-dependent. Answers "What is true given fixed reference?" (Metaphysical/Subjunctive). Associated with Kaplan's *content*.
      *   *The "Actual" World:* In 2D semantics (especially Chalmers' version), there's a distinction between the world considered as actual (fixing the primary intension) and the world considered as counterfactual (fixing the secondary).
