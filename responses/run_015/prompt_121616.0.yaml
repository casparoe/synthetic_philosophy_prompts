answer: |-
  ### Exam Question

  **Time Allowed:** 90 Minutes
  **Word Count:** No limit (manage your time accordingly)

  **Question:**
  Williamson's margin-for-error argument against luminosity and his structurally similar argument against the KK principle both rely on sorites series and a safety condition. However, the objects of knowledge differ: in the luminosity case, it is a non-epistemic condition (e.g., feeling cold); in the KK case, it is an epistemic status (knowing *p*).

  (1) Analyze the load-bearing premises in both arguments. Is the margin-for-error principle doing the exact same work in both, or does the anti-KK argument require an additional assumption about the subject's access to their own evidence that the anti-luminosity argument does not? Explain which argument is in worse shape and why.

  (2) Consider the "Deferred" objections: A condition is *deferred-luminous* if obtaining at $t$ puts one in a position to know at $t+\delta$ that it obtained at $t$. *Deferred-KK* holds that knowing $p$ at $t$ puts one in a position to know at $t+\delta$ that one knew $p$ at $t$. Does the margin-for-error reasoning refute these deferred theses? Consider how the time-delay affects the application of the safety condition.

  (3) If the deferred views escape the margin-for-error argument, have they preserved what was philosophically valuable about luminosity and KK, or has the delay stripped them of their theoretical utility?

  ***

  ### Model Answer

  The core engine of both Williamson's arguments is the Safety condition: if one knows, one could not easily have been wrong. In the anti-luminosity argument, the sorites series orders cases by the subject's physical condition (e.g., temperature). The load-bearing premise is that belief formation regarding one's condition is not perfectly reliable across marginally different cases. If one knows one is cold in case $\alpha_i$, one must be cold in nearby case $\alpha_{i+1}$. Since $\alpha_n$ is not cold, knowledge fails somewhere.

  The anti-KK argument structures cases by epistemic strength (e.g., number of fake barns). Here, the margin-for-error principle requires that if one knows one knows $p$ in case $i$, one must know $p$ in nearby case $i+1$. However, the anti-KK argument is in worse shape because it imports an extra assumption. Anti-luminosity relies on the noise inherent in sensory discrimination. Anti-KK requires that the subject's evidence regarding their *epistemic status* is subject to the same noise as their evidence regarding the world. This presupposes that evidence is not transparently self-intimating. While Williamson argues this follows from fallibilism, opponents can argue that while sensory states are vague, epistemic status might be sharp even if evidence varies. Thus, the anti-KK argument bears a heavier burden: it must establish that knowledge attributions themselves are subject to margin-for-error constraints independent of the first-order knowledge constraints.

  Regarding the "Deferred" theses, the margin-for-error reasoning faces a significant hurdle. Safety is evaluated at the time the belief is formed. In standard luminosity, belief is at $t$ about $t$. In deferred luminosity, belief is at $t+\delta$ about $t$. The "nearby worlds" relevant for safety are those nearby at $t+\delta$. It is plausible that by $t+\delta$, the subject has engaged in reflection or gathered further evidence, moving them out of the marginal zone that existed at $t$. For example, a subject marginally unsure if they knew $p$ at $t$ might, upon reflection at $t+\delta$, clearly see that their evidence was sufficient. Consequently, the sorites pressure dissipates because the series is no longer anchored to the instantaneous reliability of the state at $t$, but to the retrospective reliability at $t+\delta$. The delay allows the subject to "slide into a clear case."

  However, escaping the argument comes at a steep theoretical cost. The philosophical utility of luminosity was to provide a foundation of immediate, incorrigible self-knowledge that anchors justification. If luminosity is deferred, it becomes a species of memory or retrospective inference, which is fallible and subject to its own safety constraints. It loses its foundational role. Similarly, KK was intended to capture the transparency of rationality—that a rational agent is immediately aware of their epistemic standing. Deferred-KK reduces this to a fallible empirical claim about one's past self. While the deferred views may be true, they surrender the internalist intuitions that motivated luminosity and KK in the first place. They escape Williamson's net only by ceasing to be the kind of knowledge that internalists wanted.

  ***

  ### Marking Scheme (Total: 20 Points)

  **Part 1: Argument Comparison (8 Points)**
  *   **A Range (7-8):** Identifies that both use Safety/Sorites but correctly notes Anti-KK requires an extra premise about the *noise of epistemic self-attribution* (or lack of transparency of evidence). Explicitly states Anti-KK is "worse off" or more controversial because sensory vagueness is more intuitive than epistemic vagueness.
      *   *Common Screw-up:* Treats the two arguments as identical; fails to identify the extra burden on the KK argument regarding evidence discrimination.
  *   **B Range (5-6):** Correctly explains the Safety premise in both but treats them as structurally equivalent without noting the extra assumption required for KK.
      *   *Common Screw-up:* Recites the "feeling cold" case without analyzing the load-bearing premise.

  **Part 2: Deferred Objection Analysis (8 Points)**
  *   **A Range (7-8):** Explains that Safety is centered on the *time of belief* ($t+\delta$). Argues that reflection/evidence gathering at $t+\delta$ can break the sorites chain (moving out of the marginal zone).
      *   *Common Screw-up:* Assumes Safety applies to the time of the *fact* ($t$) rather than the belief; claims the argument refutes Deferred views automatically.
  *   **B Range (5-6):** Acknowledges the time delay but fails to explain *why* it matters for Safety (e.g., just says "time passes").
      *   *Common Screw-up:* Ignores the direction of the series or the mechanism of the delay.

  **Part 3: Philosophical Evaluation (4 Points)**
  *   **A Range (4):** Argues that while Deferred views might be true, they lose the *foundational/internalist value* (immediacy/incorrigibility) that motivated the original theses.
      *   *Common Screw-up:* Concludes that because the argument is escaped, the theory is successful (ignoring the "worth wanting" clause).
  *   **B Range (2-3):** States that the value is lost but doesn't explain why (e.g., just says "it's not the same").
      *   *Common Screw-up:* Fails to address the third part of the question entirely.

  **Grade Boundaries:**
  *   **17-20 (A):** Nuanced premise analysis + Correct Safety/Time application + Strong normative evaluation.
  *   **13-16 (B):** Solid grasp of Safety + Basic Deferred analysis + Weak evaluation.
  *   **9-12 (C):** Recites Williamson's cold case + Vague on Deferred.
  *   **0-8 (D/F):** Fundamental misunderstandings of Safety or Luminosity.
