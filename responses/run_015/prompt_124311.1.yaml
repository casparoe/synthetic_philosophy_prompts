      *   *Section 3: Counterfactual Fairness & Causal Graphs:* This is the core technical/ethical intersection. Explain why controlling for department choice is controversial. Use the mediator vs. confounder distinction.
      *   *Section 4: Upstream Bias:* Relocating the bias. The "Pipeline" argument.
      *   *Section 5: Utility for Audits:* Is it a red herring? No, it's a flashlight, but don't stare into the light.
      *   *Conclusion:* Summary for the presentation.

      *(Self-Correction during drafting)*: Make sure I don't say Berkeley was *definitely* sexist. The original study said no *administrative* bias. I need to be precise: "No evidence of bias in the *mechanism*, but evidence of bias in the *structure*."
      *(Refining the Counterfactual point)*: Be careful with the term "Counterfactual Fairness." In modern ML fairness (Kusner et al.), it usually involves causal models. If Department is a mediator, controlling for it hides indirect discrimination. I need to explain this clearly.

  7.  **Final Polish:**
