answer: |-
  Henry Sidgwick would regard the dispute not merely as a technical statistical disagreement, but as a fundamental breach of the moral-epistemic duty required for psychical inquiry. His assessment would rest on the conviction that the integrity of the investigator is the primary instrument of verification, and that procedural safeguards like pre-registration are worthless if the underlying intellectual virtue is compromised.

  Sidgwick maintained that psychical research demands a canon of proof stricter than that of conventional science. In ordinary scientific inquiry, a degree of exploratory flexibility might be tolerated because the claims usually fit within an existing framework of natural law. However, because anomalous cognition implies a revolution in our understanding of the universe and human destiny, the margin for error must be vanishingly small. Sidgwick argued that the investigator must guard against the "wish to believe" with a vigilance far exceeding standard academic norms. In this context, the calibration of prior distributions after preliminary data inspection would be viewed as a sophisticated institutionalization of that very wish. It represents a failure to maintain the necessary separation between expectation and observation.

  Regarding the pre-registration, Sidgwick would likely dismiss it as a hollow formality in this instance. He understood that rules and protocols are only as effective as the honesty of those who enact them. Pre-registration is designed to prevent the researcher from shifting the goalposts after seeing the data. However, by tuning the priors based on preliminary inspection, the researchers have effectively moved the goalposts before the official race began, while using the registration to certify that the posts were fixed. Sidgwick would argue that this violates the spirit of the constraint even if it technically adheres to the letter. For him, the value of a methodological rule lies in its capacity to enforce impartiality; if the rule is manipulated to produce a desired outcome, it becomes a tool of self-deception rather than a shield against it.

  The core of Sidgwick's condemnation would focus on the Bayesian priors. In a Bayesian framework, the prior represents the state of knowledge and uncertainty before the specific evidence is weighed. To calibrate this based on the data itself is to lie about the initial state of uncertainty. Sidgwick's moral philosophy emphasizes "intellectual integrity" as a duty; we are obligated to cultivate our faculties to perceive truth without distortion from desire or fear. Manipulating the priors to make the posterior probability more favorable is an act of epistemic dishonesty. It suggests that the researchers value the *appearance* of positive results over the *reality* of the evidence.

  Sidgwick tied ethical impartiality directly to epistemic rigor. In his view, the "point of view of the universe" requires the thinker to set aside personal investment in the outcome. The critics' charge—that the priors were data-dependent—indicates that the researchers failed to achieve this detachment. They allowed the data to influence the setup of the test, which contaminates the logical independence required for proof. Sidgwick would argue that in psychical research, where the human tendency toward superstition and hope is a known confounding variable, such contamination is fatal. It does not matter how large the scale of the study or how rigorous the stopping rules are; if the input (the prior) is biased by the output (the data), the logical chain is broken.

  Ultimately, Sidgwick would side with the critics, but on deeper grounds than simple methodological error. He would identify a failure of intellectual virtue. He would argue that formal pre-registration is insufficient protection against experimenter bias because bias can migrate to earlier stages of the analytical framework, such as the selection of priors. For Sidgwick, the only sufficient protection is a scrupulous adherence to truth that treats the manipulation of uncertainty as a moral failing. He would conclude that a study claiming to investigate anomalous phenomena must demonstrate not only statistical validity but also a transparency of intent that precludes any suspicion that the desire for a result shaped the mathematical framing of the inquiry. Without that, the evidence remains epistemically void, regardless of its statistical significance.
