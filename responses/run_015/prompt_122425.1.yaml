      *   *Moral Philosophy (Utilitarianism/Intuitionism):* In *The Methods of Ethics*, Sidgwick emphasizes "intellectual integrity" and impartiality. The "point of view of the universe" requires setting aside personal desire. Error and bias are moral failings if they stem from a lack of rigorous self-scrutiny.
      *   *Epistemology/Evidence:* He valued methodological rigor. For him, the *process* of arriving at belief is as important as the belief itself. Self-deception is a primary enemy.

