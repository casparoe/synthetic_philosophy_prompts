      *   *Ethical/Epistemic Duty:* For Sidgwick, there is a duty to avoid error. Calibrating priors based on data is a form of self-deception or, at best, negligence. It violates the duty of intellectual honesty.

  4.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Sidgwick would say they cheated. He wanted strict proof. Priors matter.
