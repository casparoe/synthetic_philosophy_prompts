      *   *The "Stricter Canon":* Emphasize that for anomalous cognition, the margin for error is zero. A contaminated prior makes the result worthless, regardless of the stopping rules.
      *   *Conclusion:* He would side with the critics. The failure is deeper than procedure; it's a failure of the will to remain impartial.

