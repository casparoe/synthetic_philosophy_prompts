      *   **Victory Conditions:** Explain what "winning" looks like for Walzerians (preserving moral seriousness) vs. Consequentialists (preserving rational consistency).
      *   **Path to Progress:** Suggest shifting to a functionalist view (what does the concept *do*?) or distinguishing types of responsibility.
      *   **The Edge Case (Outsourcing):** Use this to pivot the debate. It shows "Dirty Hands" is about *acknowledgment*, not just action. This is the key insight.
