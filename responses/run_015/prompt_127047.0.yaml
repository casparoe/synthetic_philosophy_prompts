prompt: |-
  I work as the collections registrar for a mid-size museum that handles mostly post-1960 sculpture, and lately we're drowning in edge cases about whether a damaged or restored piece is still the "same work" for our catalogue and insurance. I need a reusable decision procedure my team can actually run—ordered questions, what counts as a passing answer at each step, where we stop and say "not the original," and where we have to punt to a human value call because metaphysics just runs out. It should be grounded in the statue-and-clay material constitution debate—parts, wholes, continuity, that kind of thing—but stripped down so an intern can use it without reading philosophy. The stakes are real: mislabel something and we face a claim, but be too rigid and we might deaccession a work that should stay.

  The twist is that our holdings include a lot of process-based pieces where the artist expected decay—unfired clay that cracks, wood that warps, even ice parts that melt and get remade—so the checklist can't just be "original material present = yes." It needs to distinguish intentional replacement from accidental damage, and it needs to handle cases where the artist is alive and yelling, dead with no instructions, or represented by an estate that disagrees with our conservator.

  Please build the checklist. For each step list the evidence we'd need, what answer kills the identity claim, and where we flag "judgment call—get the curator and maybe legal." Then run it on three cases:

  1. A 1978 unfired clay figure that cracked in storage; we filled cracks with matching clay and fired the whole thing, so now it's ceramic, not unfired clay. The artist died in 2005 and left no instructions.

  2. A 1994 "living wood" assemblage made from a specifc fallen oak. Termites destroyed about 40% of the internal structure, and we replaced those sections with oak from a different tree, shaped to match. The artist's contract says the work must remain "biologically conected to the original tree" but doesn't define that.

  3. A 2010 installation with a central clay core the artist called "the heart." The heart was destroyed in shipping. A conservator rebuilt it with synthetic polymer that looks and weighs identical, but it's not clay. The artist is alive and emailed that "without the original heart it's just a copy," but our board wants to keep it displayed because it's the only intact version.

  Apply the procedure to all three. I especially want case 3—I'm guessing the checklist will tell me it's not the original, and I need you to be honest about whether I'm probably going to override that for exhibition reasons anyway. Also flag any step where two reasonable people could disagree and the procedure can't force an answer. Keep it practical: we usually have 48 hours, one registrar and one conservator in the room, no lawyer unless we flag it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and case analysis:

  1.  **Analyze the Request:**
      *   **User Role:** Collections Registrar at a mid-size museum.
      *   **Collection Focus:** Post-1960 sculpture (often process-based, ephemeral, or material-sensitive).
      *   **Problem:** Determining object identity (is it the *same work*?) after damage/restoration. High stakes (insurance, deaccessioning, ethics).
      *   **Requirements:**
          *   Reusable decision procedure (checklist).
          *   Ordered questions with pass/fail criteria.
          *   Clear "stop" points (not original) vs. "punt" points (judgment call).
          *   Grounded in material constitution philosophy (parts/wholes/continuity) but accessible to interns.
          *   Must handle process-based/decaying works (not just "original material = good").
          *   Must handle artist intent (alive/dead/estate conflict).
          *   Apply to three specific cases.
          *   Specific focus on Case 3 (honesty about overriding the result).
          *   Practical constraints: 48 hours, registrar + conservator, no lawyer unless flagged.

  2.  **Theoretical Grounding (Simplified):**
      *   *Ship of Theseus:* When do replacements change identity?
      *   *Material Constitution:* Is the work the matter or the form?
      *   *Artist Intent:* Institutional Theory of Art (Dickie) / Historical definitions.
      *   *Continuity:* Spatio-temporal continuity vs. qualitative identity.
      *   *Practical Application:* Need to balance "Original Material" vs. "Artist Sanctioned Process."

  3.  **Drafting the Decision Procedure (The "Identity Protocol"):**
      *   *Goal:* A flowchart-style checklist.
      *   *Step 1: Artist Intent/Authority.* This is the trump card in contemporary art. If the artist says it's X, it's X.
      *   *Step 2: Material Constitution (The "Stuff").* Is the core material still there? If not, is the change part of the work's logic?
      *   *Step 3: Structural Continuity (The "Shape/Structure").* Is the form maintained?
      *   *Step 4: Provenance of Intervention.* Who did the work? When? Why?
      *   *Step 5: The "Punt" Zone.* Where philosophy ends and policy begins.

      *Refining the Steps for the User's Constraints:*
      *   Need to make sure "Process-based" is accounted for early.
      *   Need to distinguish "Conservation" (stabilizing) from "Restoration" (replacing) from "Remake" (recreating).
      *   Need clear "Kill Switches" (Identity Lost) vs. "Yellow Lights" (Consult Curator).

      *Drafting the Steps:*
      1.  **Artist Sanction:** Is there explicit instruction? (Alive/Dead/Contract).
      2.  **Material Logic:** Is the material change intrinsic to the work's concept? (e.g., melting ice vs. cracked bronze).
      3.  **Substantiality:** How much original material is left? (The 40% rule is tricky, but need a threshold).
      4.  **Continuity of History:** Has the object been continuously held as this work?
      5.  **Function/Experience:** Does it *look/act* the same to the viewer?

      *Wait, let's tighten this for a Registrar.* Registrars care about accession numbers and insurance.
      *   *Q1: Authority.* (Artist/ Estate/ Contract).
      *   *Q2: Material Essence.* (Is the change a bug or a feature?).
      *   *Q3: Extent of Loss.* (Quantitative).
      *   *Q4: Intervention Type.* (Stabilization vs. Replacement).
      *   *Q5: The "Soul" Check.* (Does it still convey the intended experience?).

      *Let's structure it as a "Traffic Light" system.*
      *   Green: Proceed (Identity Intact).
      *   Red: Stop (Identity Lost/Deaccession/Copy).
      *   Yellow: Punt (Curator/Director decision).

  4.  **Developing the Cases:**

      *   **Case 1 (Clay to Ceramic):**
          *   Material change: Unfired -> Fired. Chemical change.
          *   Intent: Artist dead, no instructions.
          *   Action: Filling cracks + Firing.
          *   Analysis: Unfired clay implies fragility is part of the work. Firing makes it permanent. This fundamentally alters the *concept*.
          *   Verdict: Likely Identity Lost (Red), but maybe Yellow if the form is the only thing that matters.

      *   **Case 2 (Wood/Termites):**
          *   Material: Specific oak -> Different oak.
          *   Contract: "Biologically connected."
          *   Loss: 40% internal.
          *   Analysis: Contract violation ("biologically connected"). 40% is high. But it's internal.
          *   Verdict: Yellow/Red. Contract says one thing, reality says another.

      *   **Case 3 (The Heart):**
          *   Core component destroyed.
          *   Replacement: Synthetic polymer (fake clay).
          *   Artist: Alive, says "Copy."
          *   Board: Wants to display.
          *   Analysis: Artist veto is usually king in post-60 art. But museum wants to show *something*.
          *   Verdict: Red (Not Original). But user asks about overriding. I need to be honest: You *can* display it, but you must label it differently. You cannot insure it as the original.

  5.  **Refining the Procedure (Self-Correction during drafting):**
      *   *Critique:* Is it too philosophical?
      *   *Fix:* Use plain language. Instead of "Spatio-temporal continuity," use "Unbroken chain of custody." Instead of "Material Constitution," use "Core Material."
      *   *Critique:* How to handle the "Process" aspect?
      *   *Fix:* Add a specific question about whether decay is *expected*.
      *   *Critique:* The "48 hour" constraint.
      *   *Fix:* Keep evidence requirements to things readily available (Accession file, Conservation report, Email).

  6.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the difficulty (Ship of Theseus in the museum).
      *   **The Protocol:** The Checklist (Steps 1-5).
      *   **The "Punt" Criteria:** When to call the Curator.
      *   **Case Studies:** Applying the protocol.
      *   **The Hard Truth (Case 3):** Addressing the user's specific worry about overriding the result.

  7.  **Writing the Content (incorporating the "Twist"):**
      *   Make sure to emphasize that *Artist Intent* trumps *Materiality* in contemporary art, but *Materiality* trumps *Intent* if the Intent is impossible (e.g., dead artist, no instructions).
      *   For Case 3, be firm: If the artist says it's a copy, the museum displaying it as the original is fraud/misrepresentation. *However*, museums do this. I need to explain the *risk* of doing so (labeling, insurance, ethics).

  8.  **Review against Constraints:**
      *   Mid-size museum context? Yes.
      *   Post-1960 sculpture focus? Yes.
      *   Intern-friendly? Yes, simplified language.
      *   48-hour/2-person constraint? Yes, evidence listed is accessible.
      *   Case 3 honesty? Yes, will address the pressure to override.

  9.  **Final Polish:** Check tone. Professional, empathetic to the registrar's plight, firm on ethics. (Self-correction: Ensure I don't give legal advice, but frame it as risk management).

  *(Self-Correction on Case 1)*: Firing unfired clay is a huge chemical change. It stops the decay process. If the work was *about* decay, firing it kills the work. If the work was about the *form*, firing saves it. Since the artist is dead, we have to infer. Usually, unfired clay = vulnerability. Firing = betrayal of concept. I will lean towards "Identity Compromised."

  *(Self-Correction on Case 2)*: "Biologically connected" is vague. Does it mean the *original* wood? Or wood from the *same species*? If it means the actual tree cells, 40% replacement breaks it. If it means "oak from a similar source," it might pass. This is a classic "Yellow Light."

  *(Self-Correction on Case 3)*: Artist is alive. Artist says "Copy." This is the easiest philosophically but hardest politically. The checklist *must* say "Not Original." The advice must be: "You can exhibit, but label as Reconstruction/Replica."

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  This is a classic "Ship of Theseus" problem wrapped in insurance liability and curatorial ego. In post-1960 art, **intent often trumps material**, but **material continuity trumps intent** when the artist is unavailable to validate the change.

  Below is the **Object Identity Protocol (OIP)**. It is designed for a Registrar and Conservator to run in under 48 hours. It prioritizes risk management over metaphysical purity, but it draws a hard line where insurance fraud begins.

  ### The Object Identity Protocol (OIP)

  **Who runs this:** Collections Registrar + Conservator.
  **Time limit:** 48 Hours.
  **Evidence needed:** Accession file, Conservation report, Artist contract/correspondence, Photo documentation.

  ---

  #### Step 1: The Authority Check (Artist Intent)
  *Philosophical basis: Institutional Theory of Art (The artist defines the work).*

  *   **Question:** Is there explicit documentation (contract, certificate, email, interview) governing repair, replacement, or decay for this specific work?
  *   **Evidence:** Artist contract, COA, archived emails, foundation guidelines.
  *   **Pass (Identity Intact):** Documentation explicitly permits this type of change/replacement (e.g., "May be recast," "Decay is integral").
  *   **Fail (Identity Lost):** Documentation explicitly forbids this change (e.g., "No restoration permitted," "Original materials only").
  *   **Punt (Judgment Call):** Artist is dead with no instructions OR Estate disagrees with Conservator's assessment OR Artist is alive but instructions are vague ("Keep it looking good").
      *   *Action:* **STOP.** Flag for Curator/Director. Do not proceed to Step 2.

  #### Step 2: The Material Logic Check (Process vs. Damage)
  *Philosophical basis: Essentialism vs. Process Art (Is the change a bug or a feature?)*

  *   **Question:** Is the material change a result of the work's intended process, or accidental damage?
  *   **Evidence:** Conservation report on cause of change (entropy vs. impact/negligence).
  *   **Pass (Identity Intact):** The change is intrinsic to the work's concept (e.g., ice melting, iron rusting, wood warping as designed).
  *   **Fail (Identity Lost):** The change violates the physical logic of the work (e.g., an unfired clay piece is fired to stop cracking; a kinetic motor is glued static).
  *   **Punt (Judgment Call):** The work relies on unstable materials, but the rate of decay exceeds historical norms (e.g., wood rotting faster than expected).
      *   *Action:* **FLAG.** Requires Curatorial input on whether "accelerated decay" alters the work's history.

  #### Step 3: The Substantiality Check (Quantity & Location)
  *Philosophical basis: Mereology (Parts and Wholes).*

  *   **Question:** What percentage of the original material is lost, and is it structurally/aesthetically critical?
  *   **Evidence:** Conservation map of loss/replacement.
  *   **Pass (Identity Intact):** Loss is <10% OR loss is non-structural/internal and invisible to viewer.
  *   **Fail (Identity Lost):** Loss is >50% of total mass OR loss includes the "core" or "signature" element defined by the artist.
  *   **Punt (Judgment Call):** Loss is between 10-50% OR loss is structural but hidden.
      *   *Action:* **FLAG.** Requires Curatorial input on whether the "whole" survives the loss of the "parts."

  #### Step 4: The Continuity Check (History of the Object)
  *Philosophical basis: Spatio-Temporal Continuity (Is this the same object history?)*

  *   **Question:** Has the object remained in continuous custody as *this* work, or was it reconstructed from scratch?
  *   **Evidence:** Provenance records, loan history, past conservation reports.
  *   **Pass (Identity Intact):** The object has a continuous chain of custody; interventions were minor stabilizations.
  *   **Fail (Identity Lost):** The original was destroyed/discarded and this is a new fabrication based on photos/plans (a remake).
  *   **Punt (Judgment Call):** The object was disassembled and reassembled with mixed old/new parts over a long period.
      *   *Action:* **FLAG.** Requires Legal/Registrar review for insurance valuation.

  #### Step 5: The Experience Check (Phenomenology)
  *Philosophical basis: Aesthetic Function (Does it do what it's supposed to do?)*

  *   **Question:** Does the current state convey the same aesthetic/conceptual experience as the original without misleading the viewer?
  *   **Evidence:** Side-by-side photos (pre/post), Conservator visual assessment.
  *   **Pass (Identity Intact):** Viewer experience is unchanged; material change is undetectable or irrelevant to the concept.
  *   **Fail (Identity Lost):** The material change alters the sensory experience (smell, weight, texture) in a way that contradicts the work's meaning.
  *   **Punt (Judgment Call):** It looks the same, but the material is fundamentally different (e.g., resin vs. wax).
      *   *Action:* **FLAG.** Requires Curator to decide if "visual fidelity" is enough for exhibition.

  ---

  ### The "Punt" Protocol
  If any step results in a **Punt**, the Registrar cannot assign the original Accession Number status for insurance purposes without higher approval.
  *   **Who to call:** Chief Curator + Director of Finance.
  *   **Why:** This is no longer a conservation decision; it is a **valuation and ethics decision**.
  *   **Default Status:** Until resolved, label as "Object in Review" internally. Do not insure as "Original" if Step 1 or Step 3 failed.

  ---

  ### Case Application

  #### Case 1: The 1978 Unfired Clay Figure
  *   **Step 1 (Authority):** **PUNT.** Artist dead, no instructions. We must infer intent.
  *   **Step 2 (Material Logic):** **FAIL.** Unfired clay implies vulnerability/ephemerality. Firing it chemically alters the material to ceramic, making it permanent. This violates the likely material logic of "unfired clay."
  *   **Step 3 (Substantiality):** **PASS.** Form is intact.
  *   **Step 4 (Continuity):** **PASS.** It is the same physical object, just chemically treated.
  *   **Step 5 (Experience):** **FAIL.** It no longer risks decay. The tension of the material is gone.

  **Verdict:** **Identity Compromised (Red/Yellow).**
  **Action:** This is likely no longer the "1978 Unfired Clay Figure." It is now a "1978/2024 Ceramic Stabilization."
  **Risk:** If you insure it as the original 1978 work, you are misrepresenting the material risk (ceramic is less fragile than unfired clay).
  **Recommendation:** Update title/date to reflect intervention (e.g., *Untitled (Stabilized)*). Do not deaccession, but downgrade insurance value to reflect "heavily restored" status.

  #### Case 2: The 1994 Living Wood Assemblage
  *   **Step 1 (Authority):** **FAIL/PUNT.** Contract says "biologically connected to original tree." You replaced 40% with *different* oak. Strict reading: Identity Lost. Loose reading: Punt.
  *   **Step 2 (Material Logic):** **PUNT.** Wood decaying is expected. Termite damage is accidental. Replacing with new wood is standard conservation, *but* conflicts with the "original tree" clause.
  *   **Step 3 (Substantiality):** **PUNT.** 40% is high, but it is internal.
  *   **Step 4 (Continuity):** **PASS.** Continuous custody.
  *   **Step 5 (Experience):** **PASS.** Viewer cannot tell the difference.

  **Verdict:** **Judgment Call (Yellow).**
  **Action:** This requires the Curator to interpret the contract. "Biologically connected" is ambiguous. Does it mean "DNA match" or "Species match"?
  **Recommendation:** **Flag for Legal/Curator.** If the Estate agrees the replacement is acceptable, you can pass it. If the Estate objects, you must treat it as a "Reconstruction." Do not override the contract without written waiver from the Estate.

  #### Case 3: The 2010 Installation with the "Heart"
  *   **Step 1 (Authority):** **FAIL.** Artist is alive. Artist explicitly states: "Without the original heart it's just a copy."
  *   **Step 2 (Material Logic):** **FAIL.** Core component (clay) replaced with synthetic polymer.
  *   **Step 3 (Substantiality):** **FAIL.** The "Heart" is defined by the artist as the central element.
  *   **Step 4 (Continuity):** **FAIL.** The core was destroyed and rebuilt.
  *   **Step 5 (Experience):** **PASS.** Looks identical.

  **Verdict:** **Identity Lost (Red).**
  **Action:** Philosophically and ethically, **this is not the original work.** It is a replica authorized by the museum but vetoed by the artist.

  ---

  ### The Hard Truth About Case 3 (And Your Board)

  You asked for honesty: **Yes, your Board will likely want to display it anyway.** They see a valuable asset; you see a metaphysical and legal liability.

  Here is the reality of the override:
  1.  **You can display it.** Museums display replicas all the time (e.g., *The Garden of Earthly Delights* when the original travels, or reconstructed minimalism).
  2.  **You cannot call it the Original.** If you label it "2010, Clay, Original," you are committing fraud against the public and the insurer.
  3.  **The Insurance Trap:** If this "Heart" version is damaged in a fire, the insurer will pay out based on the value of the *original*. If they discover the core is synthetic polymer and the artist disavows it, they may deny the claim for misrepresentation of risk.

  **The Registrar's Survival Strategy:**
  If the Director overrides the OIP and demands exhibition:
  *   **Labeling:** The wall text *must* say: "Reconstructed 2024. Original core destroyed."
  *   **Insurance:** Schedule this object separately as "Reproduction/Reconstruction" at a lower value, or get a rider that acknowledges the material change.
  *   **Documentation:** File a memo stating: *"Registrar recommends against Original status per OIP Step 1. Display approved by Director over objection."* This protects *you* when the artist sues or the insurer investigates.

  ### Where Reasonable People Disagree (The "Punt" Zones)

  The OIP cannot force an answer in these specific scenarios. If you hit these, you **must** punt to the Curator/Director. The checklist cannot solve these because they are policy, not philosophy:

  1.  **The "Vague Intent" Zone:** The artist said "Maintain the work" but didn't define materials. (Case 2).
      *   *Disagreement:* Conservator says "Replacement is maintenance." Registrar says "Replacement is new object."
      *   *Resolution:* Curatorial policy on "Artist Legacy."
  2.  **The "Visual Fidelity" Zone:** It looks perfect, but the material is wrong. (Case 3).
      *   *Disagreement:* Educator says "The audience gets the idea." Registrar says "The material *is* the idea."
      *   *Resolution:* Director's risk tolerance regarding artist relations.
  3.  **The "Threshold" Zone:** Is 40% loss too much? Is 10% okay?
      *   *Disagreement:* There is no universal number.
      *   *Resolution:* Museum-specific Collections Management Policy needs to set a threshold (e.g., "Over 25% replacement requires re-evaluation of status").

  ### Final Advice for the 48-Hour Window
  Don't try to solve the metaphysics. Solve the **liability**.
  *   If the Artist says "No," the answer is "No" (unless you want a lawsuit).
  *   If the Material Logic is violated (Unfired -> Fired), the answer is "Altered Work."
  *   If the Contract is ambiguous, the answer is "Legal Review."

  Use the OIP to generate the **memo** that explains *why* you are flagging the object. That memo is your shield.
