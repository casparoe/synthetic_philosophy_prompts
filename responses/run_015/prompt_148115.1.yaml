answer: |-
  # The Virtual Ontology Sort (VOS-8)

  **Instructions:** Read each scenario. Select the **single option** that best matches your gut reaction or intended moderation action. Do not overthink consistency; answer how you actually feel.
  **Time:** Approx. 10 minutes.

  ---

  ### 1. The 400-Hour Castle
  A player spends 400 hours building a castle. Another player uses an exploit to flatten it instantly. The builder is distraught.
  *   **A.** The loss is purely emotional; the bytes can be restored from backup, so no permanent harm exists.
  *   **B.** The labor was real, so the loss is real, regardless of the medium.
  *   **C.** The act violated the social contract of the server, regardless of the object's status.

  ### 2. The Sunset Server
  An rare item exists only because the company pays for the server. The company announces shutdown next month.
  *   **A.** The item ceases to exist; it had no reality outside the lease agreement.
  *   **B.** The item exists until the last tick; its impending death doesn't make it less real now.
  *   **C.** The item is a record of memory; the server state is irrelevant to its value to the owner.

  ### 3. The Unseen Procedural Mountain
  A procedural generator creates a unique mountain in a region no player visits and no log records.
  *   **A.** It does not exist; unobserved/unlogged data is noise.
  *   **B.** It exists on the disk; observation is not required for existence.
  *   **C.** It exists as a potentiality; it becomes real only if a player encounters it.

  ### 4. The Duplicate Sword
  A glitch duplicates "The Unique Sword." Two players now hold identical copies. Both claim to be the true owner.
  *   **A.** Neither is real; uniqueness is a functional state, and the function is broken.
  *   **B.** Both are real; the code state validates both equally.
  *   **C.** The first holder is real; the second is a counterfeit, based on historical precedence.

  ### 5. The Haptic Pain Setting
  In VR, a player turns the "haptic pain" setting to max and winces when hit.
  *   **A.** The pain is real physiology; the source (virtual) doesn't change the sensation.
  *   **B.** The pain is simulated feedback; calling it "hurt" is category error.
  *   **C.** The pain is real only if the player consents to the setting; otherwise it's assault.

  ### 6. The Solitary Build
  A player builds a masterpiece in a singleplayer mode that nobody else will ever see.
  *   **A.** It is not a social artifact; without an audience, it is just a private file.
  *   **B.** It is art; the creator's experience validates its reality.
  *   **C.** It is a real object within the simulation, regardless of observers.

  ### 7. The Terms of Service Deletion
  A player cares enormously about a build. The ToS says the company may delete it at will. The company deletes it.
  *   **A.** No wrong was done; the player only had a license, not property.
  *   **B.** A wrong was done; the ToS cannot override the emotional reality of the loss.
  *   **C.** A procedural wrong was done; the deletion must follow due process, regardless of ToS.

  ### 8. The Real-Money Trade (Consistency Check)
  A player pays $500 USD for a virtual house. A griefer destroys it. The buyer demands a ban.
  *   **A.** Do not ban; real money shouldn't be spent on fake goods, so no real theft occurred.
  *   **B.** Ban immediately; the financial loss makes the virtual object real property.
  *   **C.** Ban for toxicity, not theft; the loss isn't property damage, but the intent was harmful.

  ---

  ## Scoring Key & Profile Mapping

  Do not sum points. Instead, tally which **Grounding** you selected most often.

  *   **Code/Function Grounding (Selecting mostly 2s or 1s in Q2, Q3, Q4, Q6):** You lean toward **Digital Realism** or **Functionalism**. Reality is defined by the server state and code rules.
  *   **Human/Phenomenological Grounding (Selecting mostly Bs in Q1, Q5, Q7, A in Q5):** You lean toward **Harm-Based Realism**. The ontology of the object doesn't matter; the reality of the human experience does.
  *   **Social/Institutional Grounding (Selecting mostly Cs, Q4-C, Q7-C, Q8-C):** You lean toward **Social Institutionalism**. Objects are real because we agree they are, or because rules govern them.
  *   **Irrealist/Fictionalist Grounding (Selecting mostly As in Q1, Q2, Q3, Q6, Q8-A):** You lean toward **Hard Irrealism**. Virtual objects are pretense; only the physical substrate is real.

  **The Inconsistency Flag (Question 8):**
  *   If you scored **Irrealist** on Q1–Q7 but chose **8B** (Ban for theft), your reflex (protecting value) contradicts your pattern (denying reality). You are likely a **Closet Humanist**.
  *   If you scored **Humanist** on Q1–Q7 but chose **8A** (No ban), your reflex (protecting property rights) contradicts your pattern (protecting people). You are likely a **Libertarian Formalist**.

  ---

  ## Logical Space Analysis

  This instrument maps the debate not along a single line of "Real vs. Fake," but across three axes of **Ontological Grounding**. Below is the map of the positions your team occupies, the empty spaces, and the limitations of this sort.

  ### 1. The Occupied Positions

  | Position | Core Claim | Typical VOS Profile |
  | :--- | :--- | :--- |
  | **Digital Realism** | Virtual objects are real digital artifacts. Code state = existence. | High Code Grounding. Q2-B, Q3-B, Q4-B. |
  | **Hard Irrealism** | Virtual objects are fiction. Only atoms are real. | High Irrealist Grounding. Q1-A, Q2-A, Q8-A. |
  | **Harm-Based (Humanism)** | Object reality is irrelevant; player suffering is the metric. | High Human Grounding. Q1-B, Q5-A, Q7-B. |
  | **Social Institutionalism** | Objects are real because rules/community treat them as such. | High Social Grounding. Q4-C, Q7-C, Q8-C. |
  | **Hybrid (Company-Backed)** | Reality depends on official sanction (ToS/Server). | Mixed Code/Social. Q2-A, Q6-A, Q7-A. |

  ### 2. The Empty Space (Unclaimed/Incoherent Combinations)

  *   **The "Solipsistic Realist" (Q5-A + Q3-B):** Claims an unobserved procedural mountain is real (Q3-B) but a observed singleplayer build is not (Q5-A).
      *   *Why Empty:* Incoherent. If disk state grants reality (Q3), private builds have disk state. If observation grants reality (Q5), the mountain is unobserved. Most people align on whether *observation* or *storage* matters.
  *   **The "Pain Denier" (Q5-B + Q1-B):** Claims haptic pain is fake (Q5-B) but 400 hours of labor is a real loss (Q1-B).
      *   *Why Empty:* Unattractive. Labor is experienced through sensation and time. To validate the labor but invalidate the physiological feedback loop is philosophically unstable.
  *   **The "ToS Nihilist" (Q7-A + Q8-B):** Claims the ToS allows deletion without wrong (Q7-A) but banning a destroyer of a bought item is required (Q8-B).
      *   *Why Empty:* This is the "Hypocrite" quadrant. It claims legal authority is absolute (Q7) but ignores it when money is involved (Q8). People usually resolve this by either admitting ToS is absolute (8A) or that ToS doesn't override ethics (7B).

  ### 3. Limitations & Indistinguishables

  **The Functionalist vs. Institutional Blind Spot:**
  This quiz cannot reliably separate **Digital Functionalism** (It's real because the code processes it) from **Social Institutionalism** (It's real because the rules say so).
  *   *Why:* In a working MMO, code and rules usually align. A "duped sword" is both a code error (Functionalist) and a rule violation (Institutionalist).
  *   *Resolution:* To separate these, you would need a case where the Code allows something the Rules forbid (e.g., a mechanic the devs forgot to patch). The VOS-8 assumes Code and Rules are currently synchronized.

  **The "Harm" vs. "Reality" Conflation:**
  The quiz flags inconsistency in Q8, but it cannot fully separate **Harm-Based Realists** from **Digital Realists** who also care about harm.
  *   *Why:* Both will vote to ban the griefer. One votes "because the object was real," the other "because the player was hurt."
  *   *Resolution:* This requires introspection, not a quiz. Ask them: "If the player didn't *know* the castle was destroyed, would you still tell them?" (Realist: Yes, object damaged. Humanist: No, no harm done).

  ### 4. How to Use the Results

  1.  **Identify the Dominant Cluster:** If most of your team scores **Harm-Based**, stop debating ontology. It is a distraction. Your policy should be "Did a person suffer?" not "Was the object real?"
  2.  **Spot the Inconsistency Flag:** If a team member flags as Irrealist but votes 8B, they are arguing philosophy but moderating as a Humanist. Tell them: *"Your philosophy is Irrealist, but your moderation is Humanist. Adopt the Humanist policy explicitly so you don't confuse players."*
  3.  **Resolve the Castle Debate:** The "Castle" question (Q1) usually splits the room. If the vote is mixed, adopt the **Social Institutional** compromise (Q1-C): The object's reality doesn't matter; the violation of server norms does. This bypasses the metaphysical trap entirely.

  **Final Note:** The goal of this instrument is not to prove one side right. It is to reveal that your team is likely arguing from different **Groundings** (Code vs. People vs. Rules). Once you name the Grounding, you can decide which one your moderation policy will prioritize.
