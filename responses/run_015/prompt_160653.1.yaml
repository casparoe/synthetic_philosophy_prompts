      *   *Distinct shape?* Yes. Traditional skepticism is about the *possibility* of error. This is about the *weaponization* of error. It's not just that we *might* be wrong; it's that the other party is *trying* to make us wrong. It shifts from epistemology to ethics/politics of mind-reading.
      *   *The "Unguarded Moment":* The user is right. The blackouts are the crux. If the blackouts are staged, the "private access" loophole is closed.

