      *   **Tone:** Intellectual but accessible (pub setting), rigorous but not dry, respectful of the user's existing insight (they clearly know their stuff).
      *   **Output Format:** A coherent reading, not just a list of themes.

  2.  **Evaluate the User's "Engineered-Analogy" Angle:**
