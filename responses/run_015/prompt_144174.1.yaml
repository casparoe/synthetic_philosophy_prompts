  A visiting academic found the Marquise at Cirey surrounded by astronomical tables, yet humming a cheerful tune despite the grim correspondence scattered across her desk.

  "You possess a remarkable tranquility," he noted. "Does your study not reveal the world's indifference?"

  "Indifference is the default," she replied, adjusting her quill. "Happiness requires a specific kind of ignorance. But natural ignorance is too fragile. I must cultivate mine."

  "You cultivate ignorance?"

  "I employ the strictest rigor to identify exactly which truths may be safely ignored. It takes hours of calculation to construct an illusion that will not shatter upon contact with the world. A fool can be deluded by accident; only a philosopher can be deluded by design."
