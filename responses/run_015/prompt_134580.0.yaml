answer: |-
  A: You're still treating him like he's building a system. He's not. That's the whole point of the essay. There's no neutral Archimedean point where Montaigne stands to judge the Tupinambá. He's saying we only call them barbaric because we're looking through Christian lenses. When he compares their ritual eating to our religious wars, he's not saying one is objectively worse. He's saying *by our own lights*, we're the monsters.

  B: But he does say one is worse. He explicitly ranks them. He says the European betrayal of conscience is more vicious than the Brazilian ritual. If all judgment is embedded in culture, where does he get the leverage to make that ranking? You can't critique European cruelty without smuggling in a universal standard—some hidden natural law about human dignity. Otherwise, it's just preference.

  A: That's the trap you're walking into. You think he's making a theoretical claim about morality. He's not. He's a Pyrrhonian skeptic. His skepticism applies reflexively. When he says Europe is "worse," it's not a philosophical proposition. It's a performative shock. He's trying to destabilize your confidence in reason itself. He wants you to feel the vertigo of realizing your "civilization" is just another custom.

  B: Okay, but does that save him? If every counterexample is just "rhetoric" or "performance," then what's left? It makes his view unfalsifiable. If I say, "But Montaigne clearly believes torture is wrong," and you say, "No, he's just shaking your confidence," then you've insulated him from any real critique. It turns the essay into a mirror that only reflects what you want to see.

  A: It's not about insulation. It's about therapy. He's curing us of the disease of dogmatism. The typo in our reading is thinking he needs to be consistent in a systematic way. He's consistent in his inconsistency.

  B: But then why write? If there's no truth to advocate, not even tentatively, then the essay is just... what? A vibe? You're telling me Montaigne went to the trouble of describing cannibalsim just to give us a vibe check?

  A: Exactly. A vibe check that bloodies your nose.

  B: [laughs] That's convenient. But seriously, if he undermines the ground he stands on, he can't stand there to kick us. Either he has a norm—maybe a thin one, like "don't betray your own conscience"—or he's silent. If he's not silent, he's normative. You can't have it both ways.

  A: Maybe the norm is just "look closer." But you're demanding a foundation he deliberately excavated. You want him to be a legislator. He wants to be a witness.

  B: A witness who testifies selectively. That's my point. He highlights the Tupinambá courage to shame European cowardice. That's a moral comparison. You can't dress that up as pure skepticism without making him disingenuous.

  A: Or maybe you're the one who needs the foundation too much. Maybe the discomfort you feel—that's the essay working.

  B: Or maybe it's just me noticing that "look closer" is itself a universal command. Pass the sugar.
