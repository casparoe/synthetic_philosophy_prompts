          2.  Ranked Tensions (High to Low).
          3.  Detailed Analysis of Each Tension + Fixes.
          4.  Specific advice on the (4)/(5) worry.
      *   **Key Insight:** The user needs to choose between a *Moralized* view of standing (3) and a *Complicity/Benefit* view of standing (4 & 5). They currently want both.

  6.  **Refining the Fixes:**
      *   *Fix for (3)/(4):* Modify (3). Change "What kills standing isn't having done the same thing" to "What *primarily* kills standing..." or admit that (3) applies to *hypocrisy* specifically, while (4) applies to *complicity*. Distinguish Hypocrisy Standing vs. Complicity Standing.
      *   *Fix for (5):* (5) is the "weird one." If (5) explains (4), keep (5) and modify (3). But (5) is vulnerable to the "Saint" objection (someone who benefits but tries hard to offset).
      *   *Fix for (8):* Distinguish Institutional vs. Moral Standing.

  7.  **Final Review of the "Meat-eater" Verdict (8) vs (5):**
      *   If standing tracks benefit from the *practice criticized*:
      *   Meat-eater vs. Fur: Practice = Fur. Benefit = 0. (5) predicts Standing. (8) says No Standing.
      *   Why No Standing? Because of *complicity* in animal suffering generally (4).
      *   So (4) overrides (5) here? Or does (5) need to define "practice" broadly?
      *   If "practice" = "exploiting animals," then Meat-eater benefits. Then (5) works.
      *   If "practice" = "wearing fur," then (5) fails.
      *   *Recommendation:* Broaden the definition of "practice" in (5) to match the normative domain in (4).

  8.  **Constructing the Output:** (Self-Correction during drafting)
      *   Make sure to explicitly answer "Which of these can't all be true together?"
      *   Make sure to address the (4) vs (5) worry directly (it's not the main problem).
      *   Keep it punchy for a zine context.

      *(Self-Correction on Claim 3)*: Claim 3 says "What kills standing isn't having done the same thing, it's invoking a norm you don't accept as binding on you."
      *(Self-Correction on Claim 4)*: Claim 4 says "complicity does it too... lack standing even when they perfectly well accept the norm."
      *Yes, this is the hard contradiction.* (3) says Acceptance = Standing (even if doing it). (4) says Acceptance + Doing it (Complicity) = No Standing.
