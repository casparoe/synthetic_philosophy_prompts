          *   *Wait, look closer at (3):* "What kills standing isn't having done the same thing, it's invoking a norm you don't accept as binding on you."
          *   *Look at (4):* "But complicity does it too... I want to say these people lack standing even when they perfectly well accept the norm..."
          *   *Direct Contradiction:* (3) says *only* rejecting the norm kills standing (doing the thing isn't enough). (4) says complicity (doing the thing/benefiting) *does* kill standing even if you accept the norm.
          *   *Severity:* High. This is a direct logical contradiction in the conditions for standing.

      *   **Tension B: (1) vs. (6) [Communicative vs. Group]**
          *   (1) Blame is addressing a demand to *you* (an agent capable of response/apology).
          *   (6) Blaming groups is blame proper.
          *   *Conflict:* Can a group "apologize" or "make repair" in the sense required by (1)? If yes, no problem. If no, (1) threatens (6). Usually, communicative theorists (like Watson or McGeer) allow for group agency.
          *   *Severity:* Low/Medium. Depends on the theory of group agency. Easily fixed by stipulating groups are agents.

      *   **Tension C: (5) vs. (8) [Scalar vs. Verdicts]**
          *   (5) Standing tracks *current benefit*.
          *   (8) Meat-eater vs. Fur (No standing). Meat-eater vs. Dog Torture (Standing).
          *   *Conflict:* Does the meat-eater benefit from dog torture? No. Do they benefit from fur? Indirectly (market), but mostly from meat.
          *   *Analysis:* This actually seems consistent. Meat-eater benefits from meat industry (animal killing), so no standing on fur (similar norm violation). But dog torture is distinct (gratuitous cruelty vs. consumption).
          *   *Wait, check (5) again:* "tracks how much you currently benefit from the *practice you're criticizing*."
          *   *Verdict 1:* Meat-eater criticizing fur. Practice: Wearing fur. Benefit: Minimal/None? But verdict says *No standing*. Why? Maybe because meat-eating is complicit in animal death (4).
          *   *Verdict 2:* Meat-eater criticizing dog torture. Practice: Torture. Benefit: None. Verdict: *Standing*.
          *   *Issue:* If (5) is the *sole* tracker, does the meat-eater benefit from the *practice of wearing fur*? Not really. So (5) predicts standing. (8) says no standing.
          *   *Severity:* Medium. (5) might be too narrow to explain the fur verdict unless "animal killing" is the practice, not "wearing fur."

      *   **Tension D: (3) vs. (8) [Manager Case]**
          *   (3) Standing requires accepting the norm as binding on *you*.
          *   (8) Manager thinks rule is stupid (doesn't accept norm personally) but blames in official capacity.
          *   *Conflict:* (3) says invoking a norm you don't accept kills standing. (8) says manager *does* have standing despite not accepting the norm personally.
          *   *Nuance:* (8) specifies "in her official capacity." (3) might imply personal moral norms.
          *   *Severity:* Medium. Needs distinction between moral standing and institutional standing.

      *   **Tension E: (2) vs. (7) [Coercion]**
          *   (2) Standing is separate from correctness.
          *   (7) Coerced participant doesn't lose standing.
          *   *Conflict:* None obvious. Coercion usually excuses the actor, but (7) says they can still blame others. This is a standard view (clean hands).
          *   *Severity:* Low.

  4.  **Deep Dive into the User's Suspected Clash: (4) vs. (5)**
      *   User thinks (4) and (5) clash.
