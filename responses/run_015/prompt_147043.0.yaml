      *(3) example:* "Reformed tax cheat... can blame the current tax cheat." Past doing vs Present doing.
      *(4) example:* "Engineer... company also does." Present doing.
      *Ah, nuance:* (3) is about *past* violation (hypocrisy in the sense of "you did it too once"). (4) is about *current* participation (complicity).
      *Is that enough?* (3) says "What kills standing isn't having done the same thing." It doesn't specify past/present. But the example is reformed vs current.
      *However,* (4) says "even when they... blame themselves too, and are trying to stop." This sounds like the "reformed" case but *still* lacking standing because of current benefit/structure.
