      *   (2) *Standing is Real & Separate:* Standing $\neq$ Correctness. Hypocrite can be right but lack standing. Blamed party can't complain about content.
      *   (3) *Norm Acceptance Condition:* Standing killed by *not accepting norm as binding*, not just doing the thing. Reformed sinner has standing; unrepentant sinner doesn't.
      *   (4) *Complicity Condition:* Complicity kills standing even if norm is accepted/self-blame exists (e.g., frequent flyer vs. coal, engineer vs. rival).
      *   (5) *Scalar Standing:* Standing tracks *current benefit* from the practice. (User notes this is the "weird one").
      *   (6) *Group Blame:* Blaming institutions is blame *proper*, not shorthand for individuals.
      *   (7) *Determinism/Coercion:* No AP needed for blame. Coercion doesn't kill standing to blame others.
      *   (8) *Verdicts:*
          *   Meat-eater vs. Fur-wearer (No standing).
          *   Meat-eater vs. Dog-torturer (Has standing).
          *   Manager (private dissent) vs. Employee (rule breaker) (Has standing/official blame).

  3.  **Identify Tensions/Inconsistencies:**

      *   **Tension A: (3) vs. (4) vs. (5) [The Core Standing Theory]**
