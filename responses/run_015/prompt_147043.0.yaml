      *   *Real Problem:* The real problem is (3). (3) says doing the thing *doesn't* kill standing, only rejecting the norm does. (4) says complicity (doing the thing/benefiting) *does* kill standing.
      *   *So the triangle is (3)-(4)-(5).* (5) supports (4). (3) contradicts (4).

