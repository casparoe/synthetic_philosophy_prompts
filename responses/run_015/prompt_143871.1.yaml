  **PREAMBLE: ON THE DRAFTING PROCESS**

  In preparing Section A, I assembled a candidate list of twelve potential claims. Four were graded (b) and discarded to prevent the document from degrading into diplomatic platitude. They were:
  1.  *"Prosocial behavior is normatively desirable."* (Vacuous: This is a moral claim, not an empirical one, and falls outside the scope of the collaboration's descriptive mandate.)
  2.  *"Religion is a complex, multidimensional phenomenon."* (Vacuous: Both camps accept this triviality; it commits neither to any causal mechanism.)
  3.  *"Further research is required to resolve these questions."* (Vacuous: This is a procedural truism that commits neither camp to any specific falsification condition.)
  4.  *"Both camps offer valuable insights into the human condition."* (Vacuous: This is a diplomatic sentiment, not a proposition with truth conditions.)

  The following document is drafted exclusively from claims graded (a): non-trivial propositions both camps accept as true within the stipulated background framework.

  ***

  # JOINT STATEMENT OF THE ADVERSARIAL COLLABORATION ON RELIGION AND PROSOCIALITY

  ## SECTION A: AGREED CLAIMS

  1.  **Decomposition Necessity:** The proposition "religion makes people better" is empirically ill-posed. Causal attribution requires distinguishing between four separable components: (i) belief in morally concerned supernatural agents, (ii) participation in costly rituals, (iii) embeddedness in a dense, monitoring community, and (iv) exposure to explicit moral instruction.
  2.  **Empirical Stipulation:** We accept a stylized empirical picture wherein religiosity tracks measures of prosocial conduct across national samples, with the tracking strength ordering as follows: self-reported virtue > low-cost observable behavior > costly anonymous behavior.
  3.  **Confounding Stipulation:** We accept that observed correlations between religiosity and prosociality are heavily confounded by community embeddedness and cultural inheritance, such that isolating the causal effect of supernatural belief requires controlling for these factors.
  4.  **Metric Specification:** Comparative claims regarding "moral performance" must be indexed to three operational metrics: the **low-cost anonymity gradient** (the drop-off in prosociality between observed and anonymous conditions), the **motivation share** (the fraction of acts driven by other-regarding concern vs. sanction-avoidance), and the **circle radius** (the extension of prosocial conduct toward out-group strangers).
  5.  **Historical Baseline:** Large-scale cooperation among genetic strangers exceeds the explanatory capacity of kinship and direct reciprocity alone; both camps agree that *some* cultural technology beyond these baseline mechanisms was required to stabilize early large-scale societies, disagreeing only on the nature of that technology.
  6.  **Functional Equivalence:** Both camps agree that secular institutions (law, auditing, welfare) perform monitoring and sanctioning functions analogous to those performed by religious communities, disagreeing only on whether these institutions can fully substitute for the *motivational* components of religious belief in the long term.

  ## SECTION B: DISAGREEMENTS TABLE

  | Disputed Proposition | Camp M Formulation (Indispensability) | Camp I Formulation (Substitution) | Classification | Justification |
  | :--- | :--- | :--- | :--- | :--- |
  | **Causal Mechanism** | Belief in monitoring supernatural agents is a *necessary* causal input for stabilizing the anonymity gradient in large populations. | Belief is epiphenomenal; the causal work is done by the monitoring/sanctioning structure, regardless of metaphysical justification. | Substantive | Disagreement concerns the necessity of metaphysical belief vs. structural function. |
  | **Secular Stability** | Secular societies are depleting inherited moral capital; the anonymity gradient will widen as this capital depreciates. | Secular societies are stable provided institutional substitutes remain robust; no "capital" exists to depreciate. | Substantive | Disagreement concerns the trajectory of prosociality in post-religious contexts. |
  | **"Moral Capital"** | "Moral capital" refers to a real, depletable reservoir of internalized norms generated by supernatural monitoring. | "Moral capital" is a metaphor for institutional inertia and habit; it does not deplete independently of institutional maintenance. | Partly Verbal | Camp M treats it as a stock; Camp I treats it as a flow dependent on current institutions. |
  | **Primary Metric** | The **motivation share** is the critical metric; acting from fear of God differs morally from acting from fear of police. | The **circle radius** and **anonymity gradient** are the critical metrics; the internal motivation is irrelevant if the prosocial outcome is identical. | Verbal / Trade-off | Disagreement on weighting of metrics, not on the measurement of the metrics themselves. |

  ## SECTION C: THE CRUXES

  **1. Component Crux (Matched Inheritance)**
  *   **Sub-question:** Does dropping supernatural belief while retaining ritual/community practice degrade the anonymity gradient more than dropping practice while retaining belief?
  *   **Test:** A natural experiment comparing two cohorts sharing ancestry and heritage: Cohort A retains practice/community but drops belief; Cohort B retains private belief but drops practice/community.
  *   **Camp M Prediction:** Cohort A (No Belief) will show a significantly wider anonymity gradient (more cheating when anonymous) than Cohort B. Belief is the active ingredient.
  *   **Camp I Prediction:** Cohort B (No Practice) will show a significantly wider anonymity gradient than Cohort A. Community monitoring is the active ingredient; private belief without enforcement is inert.
  *   **Ordering:** Camp M predicts Gradient(A) > Gradient(B). Camp I predicts Gradient(B) > Gradient(A).

  **2. Amortization Crux (Decay Schedule)**
  *   **Sub-question:** If secularization occurs, does prosociality decay immediately, gradually, or not at all?
  *   **Test:** Longitudinal tracking of the motivation share and anonymity gradient in a jurisdiction following rapid secularization.
  *   **Camp M Prediction:** Measurable decay in motivation share begins within 2–3 generations post-secularization, absent religious revival.
  *   **Camp I Prediction:** No measurable decay in anonymity gradient or circle radius indefinitely, provided institutional quality (rule of law, welfare) does not decline.
  *   **Falsifiability Note:** Camp M's prediction is difficult to falsify in practice because "moral capital" depreciation can always be argued to be "slower than expected" or "masked by residual culture." Camp I's prediction is vulnerable to any significant correlation between secularization duration and prosocial decline, though confounding variables (economic inequality) make clean attribution difficult.

  **3. Substitution Crux (Institutional Replacement)**
  *   **Sub-question:** Can high-density secular monitoring fully substitute for supernatural monitoring in maintaining the anonymity gradient?
  *   **Test:** A mid-sized jurisdiction introduces near-universal third-party arbitration and reputational registry without religious revival.
  *   **Camp I Vindication:** The anonymity gradient remains flat or narrows (prosocality holds or improves) despite declining religiosity.
  *   **Camp M Vindication:** The anonymity gradient widens (anonymous cheating increases) despite the new institutions, specifically in domains where institutional detection is impossible (e.g., private family conduct).
  *   **Decisive Threshold:** Both camps agree that a statistically significant divergence (p < 0.05) in the anonymity gradient between the treatment jurisdiction and a matched control, persisting for 10 years, would be decisive.

  **4. The Transfer Crux (Priming Relevance)**
  *   **Sub-question:** Do laboratory religious priming effects translate to field behavior?
  *   **Camp M Discount:** Priming captures only transient activation of concepts, not the deep socialization and eternal sanction required for stable moral capital.
  *   **Camp I Discount:** Priming effects are largely demand characteristics or temporary mood shifts, not evidence of structural causal power.
  *   **Status:** **Shared Assumption.** This is not a genuine crux. Both camps agree that laboratory priming data alone is insufficient to settle the debate about long-term societal stability.

  ## SECTION D: CONDITIONS FOR FALSIFICATION

  **What Camp M accepts as evidence against its view:**
  If secular societies with robust institutions demonstrate a stable or increasing **motivation share** and a narrow **anonymity gradient** over a period of four generations (approx. 100 years), without religious revival, Camp M accepts this as strong evidence against the indispensability of supernatural belief.

  **What Camp I accepts as evidence against its view:**
  If secular societies with robust institutions demonstrate a rapid, unexplained widening of the **anonymity gradient** and a collapse in the **circle radius** (specifically toward out-group strangers) that correlates with time-post-secularization rather than institutional degradation, Camp I accepts this as evidence that institutions are insufficient substitutes.

  **Jointly Acceptable Debate-Mover:**
  A prospective, pre-registered longitudinal study tracking the three operational metrics across multiple secularizing jurisdictions, controlling for economic inequality and community embeddedness, would be accepted by both camps as the authoritative arbiter of the Amortization Crux.

  ## SECTION E: SCRIBE'S NOTE (JUDGMENT AND FRAMING CRITIQUE)

  **On Settled vs. Contested Ground:**
  Among specialists in the empirical study of religion, it is largely settled that the correlation between religiosity and prosociality is robust for self-reports and in-group behaviors but fragile for costly, anonymous, out-group behaviors. It is also largely settled that community embeddedness is a massive confound. The genuine contestation lies strictly in the *causal interpretation* of the residual variance: does belief itself carry causal power (Camp M), or is the residual variance attributable to unmeasured institutional or cultural factors (Camp I)?

  **On Framing Bias:**
  I must flag two ways in which the framing devices provided for this collaboration may slant the discourse:

  1.  **The Four-Component Decomposition:** This framework privileges Camp I. By analytically separating "belief" from "practice" and "community," it facilitates the Camp I argument that belief is epiphenomenal. In lived religious experience, these components are often fused; a believer may argue that "belief without practice" is not a coherent category of religion, thereby resisting the natural experiment proposed in Crux 1.
  2.  **The Three Metrics:** The **motivation share** metric privileges Camp M, as it values internal states (fear of God vs. fear of Police) that are difficult to measure externally. The **circle radius** and **anonymity gradient** privilege Camp I, as they focus on observable outcomes. By treating these as equally weighted, we risk obscuring the fact that Camp M is fundamentally making a claim about *moral psychology*, while Camp I is making a claim about *social order*. They are, in part, talking past one another regarding the definition of "moral."

  **Final Caution:**
  The "stylized empirical picture" stipulated in the background (that religiosity tracks prosociality more strongly in self-report than anonymous behavior) should not be treated as settled fact outside this collaboration. While it represents a consensus among many quantitative social scientists, it remains contested by researchers who argue that specific religious doctrines moderate this effect significantly. This document treats it as a premise for the sake of argument, not as a law of nature.
