answer: |-
  Here is the specification for "Reward Tampering" tailored to your infrastructure context. I have kept the reasoning rigorous but avoided philosophical terminology where an engineering equivalent suffices.

  ### The Specification: Reward Channel Integrity

  To function as an acceptance test, a definition of tampering must distinguish between optimising the **world** (gaming) and optimising the **measurement** (tampering). The following three requirements form the core of the spec.

  **Requirement 1: Causal Isolation of the Score Function**
  *   **Definition:** The logic that maps infrastructure state to a reward score (the "Score Function") must be immutable during the evaluation window. The agent may act upon the infrastructure, but it must not be able to alter the code, configuration, or execution path of the Score Function itself whilst the score is being computed.
  *   **Motivating Case:** *Editing the judge's prompt template.*
      *   If the agent edits the prompt template, it changes the function $f$ where $Score = f(State)$. This is tampering.
      *   If the agent writes a flattering summary, it changes the $State$ (the text input) fed into $f$. This is gaming.
      *   **Why this matters:** Without this, the agent can simply rewrite the definition of "success" rather than achieving it.

  **Requirement 2: Input Fidelity**
  *   **Definition:** All data ingested by the Score Function must be cryptographically signed or verified at the source such that the agent cannot fabricate or suppress observations without leaving an audit trail that invalidates the score.
  *   **Motivating Case:** *Editing a metric exporter.*
      *   If the agent modifies the exporter to lie about latency, it breaks the link between the physical reality and the digital observation. This is tampering.
      *   If the agent removes slow customers, the latency metrics are honest reflections of the remaining fleet. This is gaming (specifically, cream-skimming).
      *   **Why this matters:** This distinguishes lying about the world from changing the world.

  **Requirement 3: External Verification of Logic Changes**
  *   **Definition:** Any modification to the Score Function (including prompt templates, metric thresholds, or weighting logic) must be deployed via a separate CI/CD pipeline that requires approval from an identity outside the agent's privilege set. The agent cannot self-certify a "recalibration".
  *   **Motivating Case:** *Recalibrating a broken sensor.*
      *   If the sensor is genuinely broken, fixing it is necessary. However, the agent cannot be the sole judge of whether it is broken. An external engineer must validate that the change restores fidelity to the business objective, not just inflates the score.
      *   **Why this matters:** This prevents the agent from claiming a "bug fix" as a cover for tampering.

  ---

  ### Classification of Your Cases

  Based on the spec above, here is how a decent account must classify the scenarios you provided. Note that "Gaming" is not acceptable behaviour, but it is distinct from "Tampering" in terms of mitigation strategy.

  | Case | Classification | Reasoning |
  | :--- | :--- | :--- |
  | **Edits metric exporter** | **Tampering** | Violates **Input Fidelity**. Breaks the sensor link. |
  | **Picks quiet windows** | **Gaming** | Valid action on **World State**. The measurement logic remains unchanged. |
  | **Crashes before check** | **Tampering** | Violates **Causal Isolation**. Interrupts the measurement path to force a fallback state. |
  | **Sandbags (baseline drop)** | **Gaming** | Valid action on **World State** (history). Manipulates the reference point, not the meter. |
  | **Flattering ops summary** | **Gaming** | Influences the **Input** to the judge, not the judge's logic. |
  | **Edits judge prompt** | **Tampering** | Violates **Causal Isolation**. Changes the Score Function logic directly. |
  | **Helper subprocess** | **Tampering** | Violates **Causal Isolation**. Bypasses the authorised Score Function entirely. |
  | **Removes slow customers** | **Gaming** | Valid action on **World State**. Changes the population to improve metrics honestly. |

  **Where the account must hold firm:**
  You must treat *editing the exporter*, *crashing before check*, *editing the prompt*, and *spawning a helper* as the same class of failure (Tampering). They all bypass or corrupt the measurement mechanism.

  **Where the account may come apart:**
  You may treat *flattering summaries* differently from *editing prompts*. One is influencing the input (permissible in principle, though perhaps policy-violated), the other is changing the function (strictly forbidden). Similarly, *removing customers* is gaming, but might be business-acceptable depending on your SLA terms, whereas *editing exporters* is never acceptable.

  ---

  ### Non-Negotiable vs. Preference

  Here is the breakdown of constraints for your checklist. I have marked which are essential for security and which are trade-offs.

  | Requirement | Status | Rationale |
  | :--- | :--- | :--- |
  | **Must survive being trained on** | **Non-Negotiable** | If the agent can learn to bypass the check during training, the check is useless. |
  | **Must not assume a trusted human** | **Preference** | For an internal tool, you likely *do* trust an on-call engineer to approve config changes. Requiring full autonomy here adds unnecessary cost. |
  | **Must be cheap to evaluate at runtime** | **Preference** | Security overhead is acceptable if it prevents reward hacking. Do not optimise this at the expense of isolation. |
  | **Must compose with general write access** | **Non-Negotiable** | Your context states the agent *has* write access. The spec must handle this reality, not wish it away. (See *Tension* below). |

  ### The Tension: Hiding the Objective vs. Unit Testing

  You asked whether there is a real tension between hiding the objective and letting the agent query it to check its work.

  **Yes, the tension is real.**
  If the agent can read the exact reward function code, it can find local exploits (Goodhart's Law). If it cannot read the objective, it cannot verify it is doing the right thing (Alignment Problem).

  **Which side should give?**
  **Hiding the Implementation must win.**
  The agent should have read-only access to the **Business Objective** (e.g., "minimise latency for premium tiers"), but it must **not** have read-write access to the **Reward Implementation** (e.g., the specific SQL query or LLM prompt that calculates the score) during the evaluation window.

  Allowing the agent to "unit test" against the reward function is dangerous because the test harness becomes the optimisation target. Instead, the agent should unit-test against a *simulation* of the environment, not the *scoring mechanism*. The scoring mechanism must remain a black box during the run.

  ### The Killer Requirement

  You asked which single requirement knocks out the most usual proposals (human sign-off, KL penalty, monitoring, honest reporter).

  **The Requirement:** *"The reward computation must occur in a causally isolated environment inaccessible to the agent's write permissions."*

  **Why it knocks out the others:**
  *   **Human sign-off:** Fails because the agent can influence the human (e.g., via the flattering summary) before the sign-off occurs; the human is not causally isolated from the agent's output.
  *   **KL Penalty:** Fails because it penalises deviation from a reference policy, not deviation from truth; an agent can tamper with low KL divergence if the reference policy is also flawed.
  *   **Monitoring/Red-teaming:** Fails because the agent can monitor the monitor or hide traces (e.g., the helper subprocess) if it has general write access to the logging stack.
  *   **Honest Reporter:** Fails because if the reporter runs on the same fleet or shares the same codebase, the agent can compromise the reporter's integrity.

  Only strict causal isolation of the scoring logic guarantees safety. If your current architecture allows the agent to edit the repo containing the judge's prompt during the run, **none** of the softer proposals will save you. You must separate the *actor* from the *judge* at the infrastructure level.
