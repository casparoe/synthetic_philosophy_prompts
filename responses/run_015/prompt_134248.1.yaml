answer: |-
  **Brainstorm: Five Ways to Carve This Up**

  1.  **Standard Particularised Implicature:** It's pure Grice. The constraint is just context. The speaker flouts Quantity to signal the negative.
  2.  **Generalised Conversational Implicature (GCI):** "Faint praise" is a default inference everywhere, strengthened here by the rule.
  3.  **Conventional Implicature:** The phrases themselves ("unique perspective") have acquired negative semantic value independent of context.
  4.  **Institutional Code (Local Semantics):** The rule has turned pragmatics into semantics for this group. It's a cipher, not an inference.
  5.  **Presupposition Accommodation:** The negative content is treated as background common ground triggered by the praise.

  **The Verdict: Institutional Code**

  I'm picking option 4. This isn't live pragmatics anymore; it's a frozen implicature that has hardened into a local semantic rule. Here's why.

  Your friend calls it bog-standard Quantity, but you've spotted the rot in the floorboards: Gricean implicature relies on the assumption of cooperation regarding *information*. Here, the speaker is openly *not* cooperating on information; they are cooperating on *compliance*. If the hearer assumes the speaker is trying to be informative, they get stuck. The inference only works because both parties know the speaker is *prevented* from being informative. That shifts the mechanism from "working out what she meant despite the rule" to "decoding what the rule forces her to say."

  **Running the Tests**

  This distinction explains the split between your "generic faint praise" and "code phrases."

  *   **Cancellability:** Generic praise ("punctual") is cancellable. You can add, "...and she's also our top coder," without contradiction. The code phrases ("unique perspective") are not. Adding "...and she does standard work" sounds contradictory or insane. When cancellability fails, you're usually out of conversational implicature and into semantics or convention.
  *   **Detachability:** If you swap "unique perspective" for "has a distinct viewpoint," the negative effect vanishes for the insiders. True conversational implicatures attach to the content, not the words. The fact that synonym-swapping kills the meaning shows these phrases are functioning like lexical items with specific definitions in this sub-language.
  *   **Calculation:** You noted there's no sense of calculation. That's because there isn't any. Insiders aren't deriving; they're decoding. It's as automatic as reading a red light as "stop."

  **The Insider/Outsider Wrinkle**

  This is where Grice's nested intentions break down. For the insider, the reviewer intends the negative content to be recognized via the shared code. For the outsider (or the leak recipient), that intention is absent. The reviewer does *not* intend the outsider to recognize the intention to convey negativity, because she knows they lack the key.

  Strictly speaking, on Grice's definition, the reviewer does **not** speaker-mean the scathing content to the outsider. She merely utters words that are true. If the outsider infers negativity, they are guessing based on overhearing a code they don't fully possess. This pulls the two bits of Grice's theory apart: the *mechanism* (code) survives, but the *meaning* (intention-recognition) does not. This suggests that once an implicature hardens into a code, it becomes portable property of the language, detachable from the specific speaker's momentary intentions.

  **The HR Question: Did She Lie?**

  This carve-up explains why the defense feels both correct and weaselly.

  Technically, she did not *say* anything false. The truth-conditional content ("Priya is punctual") is true. In our institutional code framework, the negative content ("Priya is incompetent") is not "said"; it is encoded. It belongs to the system of interpretation, not the proposition expressed. HR is asking about truth conditions; you are asking about communicative content.

  It feels weaselly because it exploits the gap between *semantic content* and *communicative force*. She is using the semantic truth of the praise to shield the communicative falsehood (or negativity) of the code. It's a lie by implication, protected by the truth of the literal string.

  **Cost to the Theory**

  To keep this inside the conversational camp, you'd have to stretch the Cooperative Principle until it snaps. You'd have to argue the speaker is cooperating on a higher level (e.g., "maintaining institutional integrity"). But that makes the CP vacuous—if violating Quantity counts as cooperating because of a rule, what counts as violating?

  The honest answer is that this has drifted out of the conversational camp. It's a cost to Gricean purity, but a gain for descriptive accuracy. We have to admit that repeated particularised implicatures, when backed by institutional power, can sediment into convention. They become local semantics.

  The test that does the real work here is **detachability**. If swapping words kills the meaning, it's not a standard conversational implicature. Cancellability is too messy here (you can cancel anything if you're awkward enough). Detachability shows that the form itself carries the weight, which means the pragmatics has died and become code.

  So, tell HR: She didn't lie about the facts, but she violated the communicative norms of the department. She spoke the truth, but she lied with the code.
