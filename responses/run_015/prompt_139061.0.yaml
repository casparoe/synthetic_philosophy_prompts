answer: |-
  You have correctly identified a gap in the standard vocabulary. The intuition that "Family Resemblance" is insufficient is sound: Wittgenstein's concept explains category *membership* (why this and that are both 'a'), but it does not explain category *coherence* (why this 'a' demands that 'g'). You are describing a phenomenon that is simultaneously semiotic, cognitive, and systemic.

  There is no single, universally accepted noun in typography that captures all three of your observations without baggage. However, there is a precise conceptual cluster you can draw from. If you need a term to define in a clause and defend, the strongest candidate is **Systemic Identity** (anchored in the semiotic concept of **Structural Value**).

  Here is the breakdown of why existing terms fall short, where the concept actually lives, and how to carve it for your readers.

  ### 1. Why the usual frames fail
  *   **Family Resemblance:** As you noted, this accounts for variation within a category, but it is agnostic about the *relationships between categories*. It explains why a two-storey 'a' and a single-storey 'ɑ' are both 'a', but it cannot explain why a geometric 'a' *requires* a geometric 'g'. It treats letters as independent members of a club, rather than interdependent parts of a machine.
  *   **Prototype/Exemplar:** These rely on an average or a specific best example. In type design, there is no "perfect 'a'" that all fonts approximate. A "perfect" 'a' in Bodoni would be a catastrophic error in Futura.
  *   **Style:** This is a label for the outcome, not the mechanism. It describes the *what*, not the *how*.
  *   **Allography:** In linguistics and orthography, *allographs* are variant forms of the same grapheme (e.g., 'a' vs. 'ɑ'). This is the correct technical term for the *variation*, but it does not capture the *constraint system* that governs which allograph is permissible in which set.

  ### 2. The established concepts that fit
  To defend your term, you can root it in three established fields. You don't need to name-drop all of them, but they provide the scaffolding for your definition.

  **A. Semiotics: Structural Value (Valeur)**
  This is the strongest theoretical match for your first observation (identity fixed by neighbours). Ferdinand de Saussure argued that in a language system, signs are defined not by their intrinsic content, but by their **difference** from other signs. /p/ is /p/ only because it is not /b/ or /t/.
  *   **Application:** In a typeface, an 'a' is an 'a' because it occupies a specific slot of difference relative to the 'o', 'd', and 'u' *in that specific system*.
  *   **Term:** **Structural Value**. (A bit academic for a general audience, but precise).

  **B. Cognitive Science: Relational Categorization**
  This matches your second observation (constraints on the whole set). In relational categorization, items are grouped not by shared features (feature-based) but by the relationships they hold with one another.
  *   **Application:** We recognize a font not by checking a list of features (serifs? x-height?), but by recognizing the *logic of relationships* between the glyphs.
  *   **Term:** **Relational Identity**.

  **C. Typography: Internal Logic / Systemic Coherence**
  Type designers often speak of a font's "logic" or "construction." When a font fails to hang together, it is often described as lacking "coherence" or "integrity."
  *   **Application:** The AI tools you are writing about are essentially reverse-engineering this logic from a few samples.
  *   **Term:** **Internal Logic**.

  ### 3. Recommendation: How to name it
  For a national newspaper audience, you need a term that is intuitive but precise enough to withstand scrutiny from experts. I recommend using **Systemic Identity**.

  It avoids the vagueness of "Style" and the academic baggage of "Structuralism," while accurately conveying that the identity of the letter is a property of the *system*, not the *shape*.

  **Suggested Definition Clause:**
  > "...a phenomenon best described as **systemic identity**: the letter is defined not by its own contours, but by its relationship to the other letters in the set."

  **Why this works:**
  1.  **It handles the 'a' problem:** It explains why two shapes with no common features can be the same letter (they hold the same *systemic slot*).
  2.  **It handles the neighbor constraint:** It explains why an 'a' can be unusable in a font (it infringes on the systemic slot of the 'o' or 'd').
  3.  **It handles the holistic constraint:** It explains why a font can fail even if every letter is well-drawn (the *system* of relationships is incoherent).

  ### 4. Carving the edges
  Here is how **Systemic Identity** handles the edge cases you listed, which you can use to test the term in your piece:

  *   **The Parody/Revival:** A parody works by deliberately mismatching systemic identities (e.g., putting a Bodoni 'a' into a Futura system). It feels "wrong" because it violates the **systemic identity**, even if the glyph is historically accurate.
  *   **The Isolated Glyph:** A single glyph drawn in isolation has *shape*, but it lacks **systemic identity**. It becomes "wrong" only when placed in a set where its relationships to neighbors conflict.
  *   **The Incoherent Set:** A font where every glyph is fine individually but the family fails is a set with broken **systemic identity**. The relationships between the parts do not sum to a consistent logic.
  *   **The Reductive 'a' (Circle with Tick):** This fails if it cannot maintain its **systemic identity**—i.e., if in that specific system, it becomes indistinguishable from the 'o' or 'd'. If the system adjusts the 'o' and 'd' to accommodate it, it succeeds.

  ### 5. The Machine Learning Angle
  Since you are writing about AI tools, this terminology bridges the gap between design and code beautifully.
  *   **Human Designers** intuit **Systemic Identity** (they "feel" the logic).
  *   **Machine Learning Models** (specifically Variational Autoencoders or GANs used in font generation) map this as a **Latent Space**. The AI learns that the vector distance between 'a' and 'g' in Font A must correspond to the vector distance between 'a' and 'g' in Font B.
  *   You can describe the AI as **"learning the systemic identity"** of the typeface from a few samples. This is more accurate than saying it is "learning the style."

  ### Summary
  Do not invent a neologism. Use **Systemic Identity**.
  *   **Define it:** Identity derived from relationships within a system rather than intrinsic features.
  *   **Root it:** In the semiotic concept of *value* (definition by difference) and the cognitive concept of *relational categorization*.
  *   **Contrast it:** Against *Family Resemblance* (which explains variation, not coherence) and *Style* (which is a label, not a mechanism).

  This term allows you to be precise without being obscure, and it respects the intelligence of both your typographic and cognitive science readers.
