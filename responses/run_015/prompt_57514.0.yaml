answer: |-
  Your hypothesis is incisive and grounded in a reality that most armchair philosophers miss: the operational distinction between reference intervals (statistical) and decision limits (clinical). You are correct that much of the stalemate arises because naturalists are often describing the *mechanism* of dysfunction while normativists are describing the *justification* for intervention. However, your hypothesis is slightly too tidy to fully dissolve the debate. There is a residue of substantive disagreement that survives even after conceding the laboratory pragmatics.

  Here is how the two sides would actually reply to your lab case, and where the friction remains.

  The **Naturalist** (Boorse-style) would argue that you are conflating *disease* with *illness* or *clinical indication*. They would insist that the biological dysfunction exists even below the decision limit. If a patient's eGFR declines from 90 to 65, the naturalist says functional efficiency has dropped regardless of whether the committee set the threshold at 60 or 70. They would fight you on the reference class, arguing that there is a "natural" class (age, sex, species) that is not chosen by value but discovered by biology. To them, your choice of athletes vs. donors is a methodological error, not proof of normativity. They concede values drive *treatment*, but deny they define the *pathology*.

  The **Normativist** would seize on your reference class example as proof of their core claim. They would argue that choosing "healthy blood donors" over "endurance athletes" is inherently evaluative; it decides whose baseline counts as normal. They would also point out that "function" itself is value-laden. Why is survival and reproduction the goal? If a genetic trait reduces reproduction but increases happiness (or artistic output), the naturalist must call it a dysfunction if it deviates from the species-typical contribution to reproduction. The normativist says calling that a disease is absurd, proving that you cannot separate the biological fact from the evaluation of harm.

  The substantive disagreement left over concerns the **concept of function**. Naturalists typically rely on "selected effect" functions (what a trait was evolved to do), while normativists (and some naturalists like Kingma) argue that functions are context-dependent or systemic. If you cannot agree on whether a function is defined by evolutionary history or current causal contribution, you cannot agree on whether a deviation is a fact or a value judgment. This is not just a division of labor; it is a substantive-normative disagreement about whether evolutionary goals are neutral descriptors or value commitments.

  Progress would not come from one side winning, but from **better descriptive work** on how thresholds are actually set (as you suggest) combined with **conceptual clarity** on whether we need one concept of "disease" or two (one for biological classification, one for social entitlement to care). Your lab experience suggests the practice has already solved this via a division of labor, even if the theory hasn't caught up.

  Verdict: division-of-labor + substantive-normative
