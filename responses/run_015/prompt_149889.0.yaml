answer: |-
  1.  You position "administrative decoupling" as a third path between Browning's situational conformity and Goldhagen's ideological hatred. But Hannah Arendt already claimed evil arises from bureaucratic detachment. How is your mechanism substantively different from her "banality of evil"?

  2.  (Follow-up to Q1) You'll likely say Arendt described *thoughtlessness* while you're describing *active role-absorption*. But if the perpetrator is actively learning to absorb the role, doesn't that restore moral agency? If it's active, aren't they more culpable than Arendt's sleepwalkers, not less?

  3.  Browning's archival work relies heavily on testimonies where men cite "orders" or "peer pressure." What specific line-item in the Battalion 101 records distinguishes a man suppressing his morality due to pressure from a man who has successfully replaced his moral selfhood with a bureaucratic category?

  4.  (Follow-up to Q3) If you reply that this is a conceptual framework rather than an empirical claim, I need to know: if the empirical record doesn't distinguish active role-absorption from passive conformity, isn't your framework just a semantic relabeling of Browning's situationalism?

  5.  Is this decoupling reversible? Can a perpetrator "recouple" their moral selfhood while the bureaucratic structure remains intact, or does the role-category permanently overwrite the self?

  6.  (Follow-up to Q5) You've suggested elsewhere that recoupling only occurs under structural collapse. If the moral self only returns when the structure breaks, doesn't that imply the morality was never decoupled, just overridden by survival instinct? Are you describing a psychological shift or just fear?

  7.  You claim perpetrators "learn" to let role-categories replace selfhood. What is the cognitive mechanism here? Is this a linguistic shift (e.g., changing pronouns from "I" to "the Office"), or is it a deeper suppression of theory-of-mind regarding the victim?

  8.  If this is about bureaucratic role-categories, we should see it outside of genocidal contexts. Do you see evidence of this specific decoupling in modern corporate structures where harm is outsourced, or is the violence necessary to trigger the full replacement of selfhood?

  9.  Post-war interrogations show varying levels of guilt among Battalion 101 members. Does your model predict that those who expressed the most guilt failed to fully decouple, or is guilt compatible with having successfully operated under administrative decoupling at the time?

  10. Rationalists often model behavior as optimization functions. If decoupling is an active learning process, what utility function is being optimized? Is it cognitive dissonance reduction, or is it career preservation within the hierarchy?

  ***

  **Ranking and Defense**

  Questions 3 and 4 are the deepest cut, hands down. Most historians hide behind "conceptual frameworks" to avoid falsification. If she can't point to the archive and show where "decoupling" looks different than "conformity," the theory is unfalsifiable poetry. I put this early (Q3/4) because if she waffles here, the rest of the interview is moot.

  The Arendt line (Q1/2) is second. It forces her to admit whether these men were zombies or agents. If she says agents, she undermines the "ordinary men" defense. If she says zombies, she collapses back into Arendt. It's a pincer movement.

  The reversibility line (Q5/6) is third. It tests whether she's actually describing psychology or just structural determinism. I suspect she'll crack here and admit it's mostly structural, wich undermines the "moral psychology" hook of your show.

  I left the modern application (Q8) for later because it's easier for her to deflect with "context matters." Keep the pressure on the archives first.
