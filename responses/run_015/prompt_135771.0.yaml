answer: |-
  1. **Distinction:** For Wittgenstein, empirical propositions are tested within a system; hinges are the scaffolding enabling testing (OC §341). Before the paperwork surfaces, the claim is a hinge: presupposed, not asserted, part of the "world-picture" inherited by training (OC §94). Afterward, it remains a hinge *functionally* if the practice continues. The discovery reveals contingent provenance, not falsity (OC §402). Hinges are not known truths but animal certainties (OC §359). The claim shifts from "invisible rule" to "known arbitrary rule," but if the practice holds, its grammatical status remains unchanged. It is not rendered false, merely exposed as a rule rather than a fact. To call it false is to misunderstand its role.

  2. **Provenance:** Hinges are unfounded (OC §166); justification is use. Logically, accidental origin is irrelevant. However, OC §96-99 describes hinges as a riverbed: some propositions are hard rock, others shifting sand. An accidental rule might be "sand." If the accident reveals the claim is detachable without collapsing the practice, it may cease to function as a hinge. *Textual Limit:* Wittgenstein emphasizes function over genealogy. He offers no criterion for when provenance undermines certainty. I extrapolate that exposure might loosen the "hold" of the hinge, turning rock to sand. If the community stops trusting the form, the hinge shifts. But strictly, OC suggests only use matters. The text does not account for the *psychology* of discovering arbitrariness.

  3. **Reformers:** Publicizing the accident will not succeed through argument. Hinges change via gradual shifts in practice, not refutation (OC §97). You cannot plan a world-picture change (OC §105). Reformers must alter the *use*, making the claim an object of investigation. Persuasion here is not logical but akin to conversion (OC §92). The reformers are trying to turn a hinge into an empirical proposition, which requires a new system of verification.

  4. **Reformers' Hinges:** The reformers rest on their own hinge: "Practices require non-arbitrary origins." Wittgenstein would not exempt this; it is their bedrock (OC §151). Like Moore showing hands to prove an external world (OC §14), reformers show paperwork to prove "illegitimacy." Both miss that the opposing position rests on a different system of certainty. The reformers' demand is itself a hinge subject to the same analysis. They treat "historical purity" as a rock, but it is merely their riverbed. Wittgenstein would treat the reformers exactly as he treats the institution: describing their grammar, not validating their claim.

  5. **Limits:** OC supports the functional definition of hinges and the impossibility of arguing against them directly. It is silent on institutional genealogy. The claim that accidental hinges are less stable is extrapolated from the riverbed metaphor. Wittgenstein might refuse the normative question ("should we change it?"), viewing it as a practical decision. The philosophical task is describing the grammar, not deciding the case. *Explicit Boundary:* OC pulls in two directions: sometimes hinges look like empirical propositions that hardened (OC §96), sometimes like rules (OC §341). If the claim is a rule, origin doesn't matter. If it's a hardened empirical fact, origin might matter more. This tension is unresolved. Any claim about the *likelihood* of the hinge shifting due to scandal goes beyond OC, which describes static structures more than dynamic institutional sociology. Wittgenstein would likely say the philosopher has nothing to say about whether the registry *should* change, only about what it means to doubt it. The reconstruction stops where sociology begins.
