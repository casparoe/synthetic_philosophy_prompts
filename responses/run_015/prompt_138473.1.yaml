  5.  **Finalizing the Verdict:**

      *   I will argue for **Non-Reductive Physicalism with an Interventionist Account of Causation**.
      *   Why? Because "cause" is a tool for navigation, not just a fundamental force. If the high-level description allows for successful intervention and prediction that the low-level description obscures, it earns causal status.
      *   The "Multiple Mapping" issue shows that causation is *interest-relative* but not *arbitrary*. It depends on which variables are stable and manipulable.
      *   The "Null Dereference" conclusion follows naturally: It's a real cause because it identifies the leverage point.

  6.  **Writing the Essay:** (Mental Outline)
      *   Title: The Ghost in the Careenium.
      *   Intro: The engineer's dilemma.
      *   Part 1: The Micro-Physical Challenge (The Exclusion Argument).
      *   Part 2: The Macro-Functional Defense (Patterns & Interventions).
