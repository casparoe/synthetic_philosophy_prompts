prompt: |-
  Compare Hart's harm principle with Devlin's thesis that a society may legitimately enforce its shared morality to prevent social disintegration, but do not treat them as flat opposing slogans. Instead, evaluate both through the niche conceptual lens of "normative keystone collapse" — the claim that certain moral prohibitions function analogously to ecological keystones, so that their legal erosion produces not linear, measurable harm to identifiable individuals, but non-linear destabilization of cooperative expectations across an institutional network. Take a definite, committed position: does this ecological framing vindicate Devlin's legal moralism by supplying the missing causal mechanism for disintegration, expose an unacknowledged empirical vulnerability in Hart's liberal framework, or show that both theories misrepresent the ontology of social norms by treating them as either purely coordinative or purely constitutive? Defend your verdict with explicit reasoning, and clearly flag the specific premises — empirical, metaphysical, or conceptual — on which your judgment depends.
