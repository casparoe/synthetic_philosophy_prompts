answer: |-
  ## 1. Question Sheet

  **MA Seminar: Truth and Epistemic Modality**
  **Take-Home Final Examination**

  **Time Allowed:** 48 Hours
  **Word Limit:** 1,200 words (strict)
  **Total Marks:** 25

  **Instructions:** Answer all three parts (a, b, c). Your response should be a single continuous essay. Do not cite specific authors; evaluate the arguments on their structural merits.

  **The Logical Setup**
  Let $K$ stand for "it is known" and $L$ for "it is possible." We assume the following rules:
  (A) $Kp \to p$ (Factivity)
  (B) $K(p \land q) \to (Kp \land Kq)$ (Distribution)
  (C) $p \to LKp$ (The Knowability Principle)
  (D) If $\vdash \neg p$, then $\vdash \neg Lp$ (Consistency of Possibility)

  **The Derivation**
  1. Assume $K(p \land \neg Kp)$.
  2. By (B), we have $Kp$ and $K(\neg Kp)$.
  3. By (A) on the second conjunct, we have $\neg Kp$.
  4. This contradicts $Kp$; thus, $\neg K(p \land \neg Kp)$.
  5. By (D), $\neg LK(p \land \neg Kp)$.
  6. By (C), substituting $(p \land \neg Kp)$ for $p$, we get $(p \land \neg Kp) \to LK(p \land \neg Kp)$.
  7. Given (5) and (6), we conclude $\neg (p \land \neg Kp)$, which is equivalent to $p \to Kp$ (All truths are known).

  **The Principles**
  To avoid this collapse, consider two variations of the Knowability Principle:

  *   **(SK) Situated Knowability:** For every truth $p$, there is an accessible situation in which $p$ is known. Both "known" and any ignorance claim ($\neg K$) are evaluated at that *same* situation.
  *   **(EK) Estranged Knowability:** For every proposition $p$ true at the *actual* situation, there is some possible situation (which may contain non-actual agents with superior cognitive powers) where an agent knows $p$. Crucially, any ignorance clause is anchored to the *actual* situation: the relevant instance is $p \land \neg K_{@}p$, where $K_{@}$ denotes knowledge by actual agents at the actual situation.

  **The Hard Case**
  Let $N$ = "No cognitive agents ever exist." Suppose $N$ is true. $N$ contains no knowledge operator. However, $N$ is arguably unknowable: any situation in which someone knows $N$ contains a knower, making $N$ false in that situation.

  **The Questions**
  (a) Run the Derivation against **(EK)** instead of **(SK)**. Say exactly which step fails and why. If you argue nothing fails, specify what must be true about the anchoring of $K$ for the contradiction to hold.

  (b) A proposed solution is to restrict the Knowability Principle to propositions that do not contain $K$ (or to empirical propositions), arguing the troublemaking instance $p \land \neg Kp$ is epistemic. Use **$N$** to test this. Does this restriction help? What would a restriction have to look like to succeed?

  (c) What should a moderate anti-realist assert instead? Propose a fix and specify its cost. Does it preserve the motivation for the Knowability Thesis? Is the distinction principled or ad hoc?

  ***

  ## 2. Model Answer

  **(a) The Failure of the Derivation under EK**
  The derivation collapses when applied to (EK) because the contradiction in step (4) relies on univocal indexing of the knowledge operator. In the standard derivation, $K(\neg Kp)$ yields $\neg Kp$ via factivity, contradicting the earlier $Kp$. Both $K$'s refer to the same situation. Under (EK), however, the principle applies to $p \land \neg K_{@}p$. If we assume this conjunction is known in a possible situation $w$, we derive $K_w p$ and $K_w(\neg K_{@}p)$. Factivity on the second yields $\neg K_{@}p$. There is no contradiction between $K_w p$ (known in $w$) and $\neg K_{@}p$ (not known actually). The derivation fails at step (4) because the ignorance clause is rigidly anchored to actuality while the knowledge claim is evaluated at $w$. For the contradiction to return, one would have to stipulate that knowledge in $w$ entails knowledge at $@$ (veridicality across worlds), which (EK) explicitly denies by allowing "estranged" knowers.

  **(b) Syntactic Restrictions and the Case of N**
  Restricting the Knowability Principle to propositions lacking the operator $K$ does not solve the problem, as demonstrated by $N$. $N$ ("No cognitive agents ever exist") is syntactically free of epistemic operators, yet it resists knowability. If $N$ is true, there are no agents to know it. If we posit a possible situation where an agent knows $N$, that agent's existence renders $N$ false in that situation (assuming $N$ is evaluated at the situation of knowledge). Thus, a purely syntactic restriction fails because unknowability can arise from the *modal fragility* of the content, not just its logical form.

  To succeed, a restriction must target propositions that are "Cartesian"—i.e., propositions whose truth is consistent with their being known. This is not a syntactic restriction but a modal one. It requires that for any $p$ in the domain of the Knowability Principle, $p \land Kp$ must be possible. $N$ fails this test: $N \land K N$ entails the existence of an agent (from $K$) and the non-existence of agents (from $N$), a contradiction. Therefore, the restriction must quantify over stable truths, not merely non-epistemic syntax.

  **(c) The Moderate Anti-Realist's Position**
  The moderate anti-realist should abandon the universal claim that *all* truths are knowable. Instead, they should assert that all *Cartesian* truths are knowable. This blocks the derivation because the Fitch-conjunction $(p \land \neg Kp)$ is itself non-Cartesian (it cannot be consistently known), so it falls outside the scope of the principle.

  The cost is significant. The anti-realist originally sought to tie truth to epistemic capability broadly. Admitting non-Cartesian truths (like $N$ or Fitch-conjunctions) are unknowable concedes that truth can outstrip verification in principle, not just in practice. This weakens the semantic anti-realist motivation, which typically demands that truth conditions be epistemically constrained. However, this move is principled rather than ad hoc. It is not merely "stopping the proof"; it identifies a structural limit on the concept of knowledge itself. One cannot know a proposition that entails the absence of the conditions required for knowing. The distinction rests on the consistency conditions of the knowledge relation, not on saving a thesis from refutation. Whether this saves anti-realism depends on whether the remaining class of Cartesian truths is robust enough to support the desired theory of meaning. If the "unknowable truths" are trivial or pathological, the theory may survive; if they are substantive, the epistemic conception of truth is compromised.

  ***

  ## 3. Marking Scheme

  **Total: 25 Marks (5 Criteria × 5 Marks)**

  **1. Diagnosis of the Logical Failure (Part a)**
  *   **5 Marks:** Correctly identifies that the contradiction ($Kp \land \neg Kp$) fails because the operators are indexed to different situations ($w$ vs. $@$).
  *   **Common Pitfall:** Students claim the derivation works fine under EK, missing that factivity applies locally to the situation of knowledge, not the actual situation.

  **2. Analysis of Anchoring and Indexing (Part a)**
  *   **5 Marks:** Explains that for the derivation to succeed under EK, one would need a bridge principle equating knowledge in $w$ with knowledge at $@$ (which defeats the purpose of EK).
  *   **Common Pitfall:** Vague hand-waving about "different worlds" without specifying that the ignorance clause $\neg K$ is the variable that must shift index to generate the paradox.

  **3. Evaluation of Syntactic Restrictions via N (Part b)**
  *   **5 Marks:** Uses $N$ to demonstrate that lacking a $K$-operator is insufficient for knowability. Identifies that $N$ is unknowable due to existential inconsistency, not syntax.
  *   **Common Pitfall:** Accepting the syntactic restriction as successful because $N$ "looks" empirical, failing to see $N$ generates the same paradoxical structure as Fitch-conjunctions.

  **4. Distinction: Modality Narrowing vs. Quantifier Restriction (Part b/c)**
  *   **5 Marks:** Clearly distinguishes between narrowing the modality $L$ (e.g., to nomological possibility) versus restricting the quantifier over propositions (e.g., to Cartesian propositions). Notes that $N$ requires the latter.
  *   **Common Pitfall:** Conflating "restricting the types of truth" with "restricting the types of possibility." Students often suggest making $L$ "feasible for us," which doesn't address the logical inconsistency of knowing $N$.

  **5. Cost and Principled Nature of the Fix (Part c)**
  *   **5 Marks:** Articulates the cost (abandoning universal knowability) and evaluates whether the "Cartesian" restriction is principled (based on consistency conditions) or ad hoc (designed solely to block Fitch).
  *   **Common Pitfall:** Claiming the fix is cost-free, or dismissing the restriction as "cheating" without analyzing whether the excluded truths are philosophically significant.

  **Instructor Note on Setup Validity:**
  *   **EK Vulnerability:** A sharp student may note that (EK) is ill-defined regarding $N$. If $N$ is "No agents exist," and EK demands a situation with an agent know $N$, $N$ must be evaluated as a proposition about the *actual* world to be true there. If $N$ is evaluated at the *possible* world, it is false. The prompt stipulates $N$ is false in the situation of knowledge; this makes (EK) inconsistent with $N$. Award full marks for Part (a) or (b) if a student identifies that (EK) implicitly assumes propositions are modally stable (truth values don't shift across worlds), which $N$ violates. This is a "bonus" insight within the existing criteria.
