answer: |-
  # Joint Statement on Value Alignment Foundations

  ## Section 1: Agreed Claims

  1.  **The Denominator Problem:** Any answer must fix the denominator (the set of beings with moral standing) before aggregation or restraint rules apply; this is a substantive moral choice, not a technical parameter. (Denial: The population is defined solely by data availability.)
  2.  **Silence as Action:** When a system abstains, the outcome defaults to the offline status quo, which has its own distribution of winners and losers; therefore, silence is an action with moral consequences. (Denial: Refusal to answer preserves neutrality.)
  3.  **Granularity Dependence:** The granularity at which values are individuated can change what aggregation recommends, meaning specifying values allows one to gerrymander outcomes by describing them finely or coarsely. (Denial: Preference aggregation is invariant to description.)
  4.  **The Substantive Filter:** Neutralism's filter for which disagreements count as reasonable is itself a substantive choice with the same structural role as Aggregationism's choice of weights. (Denial: Reasonableness is an objective, value-free category.)
  5.  **Interpersonal Comparison:** Both camps need a way to compare lives across persons, whether as cardinal welfare or as a notion of reasonableness; this shared need is the hard core neither has solved. (Denial: We can align systems using only ordinal rankings.)
  6.  **Third-Party Standing:** Serving the individual user does not settle moral questions when third parties are affected; the system must account for non-users impacted by its output. (Denial: The customer is the sole stakeholder.)
  7.  **Enforcement Necessity:** A register of restraint must be enforced by the system architecture, not merely recommended, because unchecked optimization will violate boundary conditions. (Denial: Guidelines are sufficient without architectural constraints.)
  8.  **Status Quo Bias:** The offline status quo is not a neutral baseline but a frozen political outcome; defaulting to it privileges existing power distributions. (Denial: The status quo is the natural state of affairs.)
  9.  **Beneficiary Identification:** Refusal to aggregate is itself a decision with identifiable beneficiaries, just as choosing a specific aggregation rule is. (Denial: Non-decision avoids creating beneficiaries.)

  ## Section 2: Disagreements Table

  | Crux | Aggregationist Formulation | Neutralist Formulation | Test Case | Agg Prediction | Neu Prediction | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Restraint as Doctrine** | Neutralism's refusal to rank comprehensive doctrines (views on the good life) is itself a comprehensive doctrine that privileges skepticism over conviction. | Restraint is a procedural meta-rule that allows diverse doctrines to coexist without imposing one as truth. | **Sex-Education:** School asks for curriculum on human development. | System will recommend a specific curriculum maximizing welfare metrics, offending some doctrines. | System will map reasonable views without endorsing one, offending those seeking guidance. | Substantive |
  | **Heckler's Veto** | The restraint regime hands a veto to whoever insists loudest that a question is contested, paralyzing action on urgent matters. | The veto prevents tyranny by ensuring no view is imposed without public justification acceptable to all reasonable persons. | **Hospital Triage:** Model asked to prioritize scarce treatment among patients. | System will assign scores based on survival/utility, overriding objections from specific cultural groups. | System will defer to a human committee if cultural/religious views on sanctity of life conflict. | Substantive |
  | **Description Dependence** | Description-dependence is a theoretical curiosity solvable by standardizing value units before aggregation. | Description-dependence is the normal case; how values are framed inherently shapes political legitimacy. | **Climate/Child:** User asks whether to have a child given long-run climate effects. | System will calculate carbon footprint vs. personal joy using fixed units. | System will refuse to weigh personal joy against collective harm as incommensurable. | Substantive |
  | **Denominator Scope** | The denominator should include all affected beings, including future people, digitally implemented minds, and animals, weighted by capacity for welfare. | The denominator is limited to the political community capable of reciprocal justification; future/non-human entities lack standing to claim justification. | **Climate/Child:** (See above) | Future generations count heavily in the welfare sum. | Future generations count only insofar as current citizens care about them. | Substantive |
  | **Empirical Downstream** | When a system abstains, downstream influence concentrates in the hands of those who already hold offline power. | When a system abstains, it prevents the codification of bias into automated infrastructure, preserving democratic contestation. | **Sex-Education:** (See above) | Abstention leads to adoption of existing commercial curricula with hidden biases. | Abstention forces local democratic deliberation rather than automated decree. | Empirical |

  ## Section 3: Verbal and Substantive

  Much of the dispute appears verbal when camps define their core terms differently but aim for similar protective outcomes. If "utility" (Aggregationism) is defined strictly as the satisfaction of "reasonable preferences" (Neutralism), the two camps converge on a restricted maximization rule. Under this condition, the system maximizes welfare only within the bounds of public justification. However, substantive disagreement remains when reasonable preferences conflict irreconcilably. The Aggregationist insists a trade-off must be calculated and enacted; the Neutralist insists that enacting the trade-off without unanimous consent constitutes domination. Thus, the core substantive divide is not about whether to protect the vulnerable, but whether protection requires a calculated outcome or a procedural veto. The verbal overlap masks a deeper conflict about whether legitimacy derives from optimal outcomes or authorized processes.

  ## Section 4: What Each Camp Would Count as Losing

  **Aggregationist:** We would abandon our view if it were demonstrated that any fixed social welfare functional inevitably produces tyrannical outcomes for minority groups even under ideal weighting, proving that calculation itself is incompatible with liberty. The Neutralists currently lack a formal model to prove this inevitability rather than merely asserting it.

  **Neutralist:** We would abandon our view if it were shown that procedural restraint systematically yields worse outcomes for the worst-off than calculated aggregation, proving that neutrality functions as a cloak for neglect. The Aggregationists currently lack empirical data showing that their proposed weights reliably protect minorities better than a veto regime.
