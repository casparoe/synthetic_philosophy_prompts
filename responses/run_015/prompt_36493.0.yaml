answer: |-
  **Project Title:** The Calibration Problem: Mapping Normative Assumptions in Aquatic Welfare Standards

  **1. Statement of the Question**
  Current animal welfare policy operates on the premise that welfare standards "follow the science." This project asks a more specific, determinate question: **To what extent do existing regulatory and certification standards for farmed finfish and decapods rely on unvalidated extrapolations of mammalian welfare indicators, and can a framework be constructed to explicitly separate the empirical claims from the normative assumptions within those standards?**

  The goal is not merely to identify gaps, but to produce a logical map of specific policy claims (e.g., regarding stocking density or stunning methods) that demonstrates exactly where an empirical observation (e.g., cortisol elevation) is treated as equivalent to a normative state (e.g., suffering) without phylogenetic justification. The answer will be a taxonomy of "hidden premises" currently embedded in aquatic welfare policy.

  **2. Why Existing Frameworks Leave This Open**
  Animal welfare science typically distinguishes between biological functioning, affective state, and natural behavior. While robust for mammals, this triad functions differently for aquatic species. In practice, "affective state" in fish and decapods is rarely measured directly; it is inferred from "biological functioning" (physiology, lesions) using calibration curves derived from mammalian models. The existing literature acknowledges this inference but treats it as a methodological necessity rather than a philosophical vulnerability.

  Conversely, philosophical debates on animal welfare have largely settled on sentience as the necessary condition for moral consideration. Recent policy shifts (e.g., in the UK) recognize decapod sentience. However, sentience is a binary gatekeeper; it does not dictate the *content* of welfare. Theories of welfare (hedonism, preference satisfaction, etc.) are applied to aquatic animals without accounting for their divergent sensory ecologies. For example, a "preference" in a shrimp may be physiologically unintelligible compared to a mammal.

  The gap lies in the *translation layer* between these two fields. Science provides indicators; philosophy provides the definition of the good life. Policy assumes the link between them is seamless. For terrestrial livestock, this link was calibrated over decades of iterative feedback between ethology, physiology, and public intuition. For aquatic animals, the indicators migrated from terrestrial systems without this calibration. Consequently, policy conclusions regarding what constitutes "humane" treatment often conflate empirical data with unexamined anthropocentric or mammal-centric value judgments. Existing frameworks describe the components but fail to analyze the structural integrity of the connections between them in non-mammalian contexts.

  **3. Methodology and Work Plan**
  My instinct is to work outward from real welfare standards (bottom-up) rather than building up from abstract concepts (top-down). This is the correct approach for this specific project and timeline. A top-down philosophical critique risks remaining theoretical and disconnected from the policy levers the foundation seeks to influence. A bottom-up analysis of existing standards grounds the philosophical critique in concrete regulatory language, making the output immediately actionable for scientists and policymakers.

  **Quarter 1: Selection and Decomposition**
  I will select three distinct regulatory or certification frameworks (e.g., EU regulations, ASC standards, RSPCA Assurance) and identify five high-stakes welfare indicators common to all (e.g., maximum stocking density, dissolved oxygen minimums, stunning methods, fasting periods, handling protocols). For each indicator, I will decompose the justification into empirical premises (what is measured) and normative premises (what that measurement implies about the animal's experience).

  **Quarter 2: Structural Analysis**
  I will analyze the logical chains identified in Q1 to identify "calibration jumps"—points where the logic moves from physiological data to claims about subjective experience without intermediate validation. I will test whether these jumps rely on mammalian analogies (e.g., assuming cortisol functions identically as a stress proxy in salmon and pigs).

  **Quarter 3: Comparative Synthesis**
  I will compare the hidden structures across the different standards. Do different certification bodies make the same hidden assumptions? If they differ, is the difference based on new science or different normative weightings? This phase determines if the "calibration problem" is systemic or idiosyncratic to specific bodies.

  **Quarter 4: Framework Development and Reporting**
  I will draft a "Calibration Framework"—a set of guidelines for policymakers to explicitly label the empirical and normative components of future welfare claims. I will produce a final white paper suitable for submission to a policy-facing journal and a presentation for the foundation.

  **4. Success and Failure Criteria**
  **Success:** The project produces a document that identifies at least three specific, current policy claims where the empirical evidence is insufficient to support the normative conclusion *given the phylogenetic distance*. The "Calibration Framework" must be tested against a novel scenario (e.g., a proposed new stunning technology) to show it can distinguish science from values. I will consider the project successful if a draft is accepted for peer review or adopted as a discussion paper by a standards body.

  **Failure:** The project concludes vaguely that "more research is needed" without isolating specific logical errors in current standards. It would be a professional embarrassment if I fail to distinguish between an indicator's *reliability* (consistency of measurement) and its *validity* (accuracy in representing the welfare state), as this is a basic psychometric distinction I claim to apply. Furthermore, if I cannot complete the decomposition of the five selected indicators within six months, the scope is unmanageable.

  **5. Assessment of Scope**
  I suspect this is effectively two projects: one on the epistemology of welfare indicators (science studies) and one on the philosophy of welfare itself (ethics). For a twelve-month part-time timeline, this is a critical risk.

  To manage this, I must constrain the philosophical scope. I will not attempt to solve the debate between hedonism and objective-list accounts of welfare. Instead, I will treat the philosophical definition of welfare as a *variable* in the policy equation. The project will not argue for one theory of welfare over another; it will argue that *whichever* theory is adopted, the current indicators do not validly measure it for aquatic species. If I find myself dragged into defending a specific theory of consciousness or welfare in Month 6, the project will stall. I must remain focused on the *link* between indicator and claim, not the ultimate nature of the claim itself. If this distinction proves impossible to maintain during Q2, I will need to narrow the scope to finfish only, excluding decapods, to ensure completion.
