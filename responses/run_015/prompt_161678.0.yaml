answer: |-
  ### Phase 1: Brainstorming Options

  Here are three potential pathways for a 25-minute session, weighed against your constraints (competition math background, whiteboard, avoiding "spooky infinity"):

  1.  **The Geometry Path (Euclidean vs. Non-Euclidean):**
      *   *Idea:* Show that changing one axiom changes the "truth" of triangles.
      *   *Pros:* Visual, whiteboard-friendly.
      *   *Cons:* Drifts quickly into *Formalism* (math is a game of rules) rather than *Nominalism* (math is about concrete things). It risks making truth look *relative*, which confuses the ontological question.
  2.  **The "Uncomputable Number" Path (Chaitin's Constant):**
      *   *Idea:* Use a number that is well-defined but impossible to calculate.
      *   *Pros:* Hits the "existence" question hard.
      *   *Cons:* Too technical for 25 minutes. Requires explaining computability, which distracts from the philosophy.
  3.  **The "Euclid + Inaccessible Instance" Path (Your Prime Idea):**
      *   *Idea:* Use Euclid's proof of infinite primes, but focus on a specific prime that is too large to ever be written down.
      *   *Pros:* They know the proof cold. It isolates the *ontology* (what is the number?) from the *epistemology* (how do we know it?).
      *   *Cons:* As you suspected, it makes Platonism feel like the default "sensible" view.

  ### Phase 2: The Commitment

  **I commit to Option 3 (Euclid + Inaccessible Instance), but with a critical modification.**

  Your worry is correct: If you just do Euclid's proof, Platonism wins by knockout because the logic feels undeniable. To make the Nominalist position viable (so it's a fight, not a lecture), you must shift the focus from **The Proof** to **The Object**.

  Do not ask: "Is the theorem true?" (They will say yes).
  Ask: "What is the theorem *about*?"

  **The Single Example:** **The First Prime Number with $10^{100}$ Digits.**
  *   **Why this works:** Euclid's theorem guarantees this number *exists*. It is a specific, definite integer. It is not "infinity" (which is spooky); it is a finite object. But it is physically impossible to write down or store in the universe.
  *   **What it has:** Definiteness (it's either prime or it isn't), Necessity (Euclid says it's there).
  *   **What it lacks:** Physical instantiation, human access, computational verifiability.
  *   **The Trap to Avoid:** Do not let the discussion become about whether we can *find* it (Epistemology). Keep it on whether it *is* there (Ontology).

  ---

  ### Phase 3: The Sequence (25 Minutes)

  **1. The Consensus (5 mins)**
  *   **Action:** Whiteboard. Quickly sketch Euclid's proof. $P = p_1 \cdot p_2 \dots p_n + 1$.
  *   **Goal:** Establish that everyone agrees the statement "There is no largest prime" is *True*.
  *   **Dependency:** You need them to feel the certainty of the proof before you question what the proof touches.

  **2. The Ontological Pivot (5 mins)**
  *   **Action:** Stop. Point to the statement.
  *   **Script:** "Okay, we agree this is true. But when you read that sentence, what is it *about*? If I say 'There are no purple elephants in this room,' that's about elephants and rooms. When you say 'There is no largest prime,' what are you talking about? Where are the primes?"
  *   **Goal:** Force the realization that mathematical truth needs a "truth-maker."

  **3. The Stress Test: The $10^{100}$-Digit Prime (10 mins)**
  *   **Action:** Introduce the specific example. "Euclid says there is a first prime with $10^{100}$ digits. It has a specific last digit. It is either 1, 3, 7, or 9."
  *   **The Platonist Move:** "That digit is fixed right now, even if no human ever knows it. It's waiting for us."
  *   **The Nominalist Move:** "No. 'Exists' just means 'Our rules don't forbid it.' There is no *thing* out there. There are just rules for manipulating symbols. The statement is true because it follows the rules, not because it describes an object."
  *   **Goal:** Make the Nominalist position sound reasonable (it's about rules/logic), not crazy (it's not denying the theorem).

  **4. Misconception Interception (Integrated)**
  *   *See Section 4 below for exact placement.*

  **5. The Closing Diagnostic (5 mins)**
  *   **Action:** Ask the final question (See Section 5).
  *   **Goal:** Verify they understand the *dispute*, not just the definitions.

  ---

  ### Phase 4: Misconceptions & Interception Points

  Here are the three misconceptions you listed, in the order they will surface, and exactly where to head them off.

  **1. "Math is just a language we made up."**
  *   **When it surfaces:** During **Step 2 (The Pivot)**. Kids love this reduction. It feels sophisticated.
  *   **Why it's a problem:** It conflates *syntax* (symbols) with *semantics* (meaning). Nominalism isn't just "it's language"; it's "truth comes from linguistic consistency, not external objects."
  *   **The Interception:** "Okay, if I write 'The king of France is bald,' that's a sentence. But it's not *true* because there is no King of France. If math is just language, why can't we just *say* 'There is a largest prime' and make it true? Why does the language fight back?"
  *   **Takeaway:** Language is the tool, not the truth-maker.

  **2. "So nominalists think 2+2 might equal 5."**
  *   **When it surfaces:** During **Step 3 (The Stress Test)**. As soon as you suggest primes might not "exist," they think you're denying the truth of arithmetic.
  *   **Why it's a problem:** It turns Nominalists into skeptics. Nominalists agree $2+2=4$ is true; they disagree on *why* (rules vs. objects).
  *   **The Interception:** "Stop. A Nominalist will bet their life that $2+2=4$. They just say it's true because of the *rules of addition*, not because there's a magical object called '4' floating in space. They aren't denying the math; they're denying the *ghosts*."

  **3. "A proof is just a program a computer can check, so there's nothing left to explain."**
  *   **When it surfaces:** During **Step 3**, specifically when discussing the $10^{100}$-digit prime. This is the "Coder's Formalism" trap.
  *   **Why it's a problem:** It confuses *verification* with *truth*. A computer checking a proof confirms consistency, not ontological status.
  *   **The Interception:** "A computer can check if a move in Chess is legal. But does the computer explain *why* Chess is interesting? Or: A computer can verify a map matches the territory. But does the computer explain if the *territory* exists? If the universe vanished, would the *code* still be valid? The Platonist says yes (logic is eternal). The Nominalist says no (logic is a human tool)."

  ---

  ### Phase 5: The Closing Question & Exclusions

  **The Diagnostic Question:**
  Do not ask: "Who is a Platonist?" (They will just raise hands based on who sounded cooler).
  **Ask this:**
  > "Imagine we meet an alien civilization. They have no concept of 'number' or 'counting.' When we show them Euclid's proof, do we **teach** them something new (invention), or do we **translate** something they already knew but couldn't say (discovery)?"

  *   **Why this works:** It forces them to choose a truth-maker.
      *   If they say "Teach/Invent," they lean Nominalist (math is a human construct).
      *   If they say "Translate/Discover," they lean Platonist (math is a universal fact).
      *   If they say "It depends," ask "Does the *prime number* depend on us, or just the *word* for it?"

  **What to Openly Refuse (The "Out of Bounds" List):**
  You are correct to skip Gödel and Set Theory. Here is the script for shutting those down:

  1.  **Gödel/Incompleteness:** "This isn't about whether math is *complete* or whether we can *prove* everything. It's about what the stuff we *can* prove is *made of*. Gödel is for next year."
  2.  **Set Theory Foundations:** "We aren't asking how to build numbers from sets. We're asking if the numbers are *there* before we build them."
  3.  **Physics/Applied Math:** "Don't tell me math is real because bridges don't fall down. That tells us math is *useful*. It doesn't tell us if primes exist in a universe with no bridges."

  ### Summary Checklist for the Whiteboard
  1.  **Left Side:** Euclid's Proof (Sketch only). Label: **"The Truth."**
  2.  **Center:** The $10^{100}$-Digit Prime. Label: **"The Object?"**
  3.  **Right Side:** Two Columns. **"Discovery (Plato)"** vs. **"Invention/Rules (Nominalism)."**
  4.  **Bottom:** The Alien Question.

  This plan respects their intelligence, uses their existing skill set (proof), and isolates the philosophical variable without letting it bleed into skepticism or physics.
