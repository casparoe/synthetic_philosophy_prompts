      *(Self-Correction during drafting)*: Make sure I don't make him sound like a Luddite. He loved technology (stage machinery, optics). It's the *governance* of the tech he'd oppose, not the tech itself. He would oppose the *substitution of judgment with calculation*.

      *(Refining the "Democratic Budgets" point)*: Goethe wasn't a democrat. He distrusted the masses. But he distrusted *faceless* authority more. He preferred the responsible Prince. An algorithm is a Prince with no soul and no accountability. That's key.

