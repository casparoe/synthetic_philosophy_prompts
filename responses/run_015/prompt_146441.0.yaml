      *   *Refinement:* It's the removal of the "living word" and the "living decision." The algorithm is dead reason.
      *   *Connection to French Revolution:* The Revolution sought to liberate man through abstract rights. This policy seeks to liberate resources through abstract models. Both trample the actual, living individual in the process.
      *   *Connection to Weltliteratur:* Digital space is the new *Weltliteratur*. But if you tax/redistribute the medium itself based on a model, you homogenize the soil. No specific flower grows in homogenized soil.

  7.  **Final Polish (checking against constraints):**
