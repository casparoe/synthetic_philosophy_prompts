prompt: |-
  You're a professional philosopher who works on value theory and the logic of comparatives, and you've also done a couple of stints on real priority-setting panels, so you know how these arguments go wrong in practice as well as on the page. Please think it through properly rather than dashing it off: before you draw anything, brainstorm the full logical space of verdicts someone could give to the questions below, list which combinations of answers are even coherent, and only then decide which combinations earn a named leaf. I'd rather have a slightly lopsided tree that maps the real space than a tidy one with four boxes.

  Context: I'm on a volunteer panel of about twelve that ranks local mental-health programmes for a small community fund, and at every scoring meeting we have the same argument in a different costume. I want a one-page flowchart for our methods handbook that a new volunteer can follow on their own in a 90-minute training session, with no facilitator looking over their shoulder. It should start from their verdicts on some concrete cases and land them on a named view about what 'better than' is doing when we rank things.

  Here's the toy case, because our real comparisons have this shape and it's easier to have a gut reaction to. You have one free afternoon. Option 0 is 180 minutes alone in a once-in-a-lifetime Vermeer exhibition. Option k is (180 − k) minutes in the exhibition plus 3k minutes sitting in the sun in a park with a friend you haven't seen in ages. So Option 100 is five hours in the park and no exhibition at all. Stipulate away the boring stuff: no queues, no aching feet, attention doesn't fade, the friend is in good form for all five hours.

  Build the tree from questions like these (use at least five of them, in whatever order does the work, and add up to three of your own if the tree needs them):
  - Take a step in the middle, Option 50 to Option 51: is the later one better? Or only 'not worse'? Does your answer change at the first step, 0 to 1, or the last one, 99 to 100?
  - Now compare the endpoints head to head and forget the chain entirely: is Option 100 better than Option 0?
  - Take two options you're inclined to say are neither better nor worse, say Option 30 and Option 70. Add two extra minutes in the sun to Option 30 and change nothing else. Is it now better than Option 70?
  - When you say neither is better, is that because they're exactly as good as each other, or because 'better/worse/equal' is the wrong toolkit here?
  - Do you think there's some particular step where the answer flips from 'yes, later is better' to 'no'? And is there a fact of the matter about which step that is, even if we could never find it out, or does the question just go fuzzy in the middle?
  - When you say one option is better, is that better full stop, or only better in a certain respect / for a certain purpose / relative to what we're using the comparison for?
  - Is 'Option 51 is better than Option 50' the kind of sentence that could be more or less true, rather than flatly true or false?
  - Variant: same chain, except that the step from 50 to 51 trades one minute of exhibition for forty minutes of park instead of three. Does your answer to the step question change at that jump? I want to know whether it's the number of steps or the size of each step that's doing the work for you.

  Requirements: eight to ten leaves, descriptive labels only — we don't care who said what first, and we have no library access, so no citations, no reading lists, no author names, just names like 'the sharp cut-off view' or 'the on-a-par view'. Your leaves must include: a lexical or threshold view with a sharp cut-off; a vague-cut-off view on which there's no fact of the matter where it falls; the parity view; strong incomparability; genuinely intransitive betterness; the view that bites the bullet and accepts the endpoint comparison; the view that there are only respect-relative comparisons and no all-things-considered one; and a many-valued or degrees-of-truth option. Every branch question must be phrased so a volunteer who has never opened a philosophy book can answer it, and no question may just ask 'is betterness transitive?'.

  For each leaf give one line on what it costs you, and one line on what our ranking tool would have to do if that's your view — that's the bit I actually need, since some of these views hand me a usable ranking and some hand me nothing. Also: flag any two leaves your tree can't really separate, and say what further case would separate them, or say honestly that you don't think one exists. And note any combination of answers that nobody seems to occupy, with your diagnosis of why: incoherent, just unattractive, or merely unexplored. I've tried sketching this myself and it keeps seperating into 'oh just pick one then', so I'm hoping you can do better.
