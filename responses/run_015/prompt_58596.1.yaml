answer: |-
  This is an incredibly insightful observation, especially for a high school junior. You have identified one of the most debated topics in aesthetics, philosophy of art, and game studies. What you are experiencing is not a confusion or a flaw in your thinking; it is evidence of a highly functioning capacity for empathy and moral simulation.

  There is no single word that covers everything you described, but there are established frameworks that explain the two different halves of your experience. Here is a breakdown of the existing ideas, how they distinguish your examples from "pretending," and a proposed definition to separate the passive experience from the interactive one.

  ### 1. The Passive Experience: The Paradox of Fiction
  Your reaction to the animated lighthouse keeper and the novel's stepmother falls under a classic philosophical problem known as **The Paradox of Fiction**.

  Philosophers (such as Colin Radford and Kendall Walton) have long asked: *How can we feel genuine emotions for characters we know do not exist?* Logically, to feel fear, you must believe there is a threat. To feel sadness, you must believe a loss has occurred. Since you knew the dog was a drawing and the stepmother was ink on a page, logically, you shouldn't feel anything.

  **The Explanation:**
  Current cognitive science suggests that your brain does not strictly distinguish between "real" and "fictional" stimuli when processing emotional narratives. When you watch the storm scene, your brain runs a **simulation**. It activates the same neural pathways associated with anxiety and sadness that would fire if the event were real, but it does so in a "safe mode."

  *   **Why you felt embarrassed:** This is called **meta-cognitive dissonance**. One part of your brain (the emotional center) is reacting to the simulation, while another part (the rational prefrontal cortex) knows the ontology (the existence) of the characters is false. The embarrassment comes from your rational brain judging your emotional brain for reacting to something "fake."
  *   **Why it isn't "pretending":** When you pretend, you are consciously acting. When you cried at the animation, you did not *choose* to cry; the physiological response happened to you. The tears were real saltwater, triggered by real stress hormones, even if the cause was imaginary.
  *   **Why it isn't "being fooled":** You explicitly stated you knew it was animated. You were not tricked into thinking it was real footage. This proves that **belief in existence is not required for emotional resonance.** You are empathizing with the *concept* of the loss, not the specific biological entity.

  ### 2. The Active Experience: Agency and Moral Residue
  Your reaction to the choice-based game is fundamentally different from the film or novel. In the film, you were a **witness**; in the game, you were an **agent**.

  In game studies and ethics, this is often discussed under the umbrella of **Interactive Agency** and **Moral Residue**.

  *   **Agency:** In the novel, the cruel stepmother did her cruelty regardless of what you thought. In the game, the villager died *because of your decision*. You moved from observing a moral event to participating in one.
  *   **Moral Residue (or Agent Regret):** This is the specific term for the guilt you felt. Philosopher Bernard Williams described "agent regret" as the feeling one has when one is causally involved in a negative outcome, even if unintentional. In the game, you were causally involved. The guilt persists after the game ends because your brain processes the *choice* as a moral action, not just a narrative beat.
  *   **The Desire to Replay:** This highlights the boundary between fiction and reality. In real life, you cannot reload a save file to undo a death. The fact that you *could* replay makes the guilt "safe," but the fact that you *felt* the guilt proves your moral compass is working. You treated the digital villagers as moral patients (beings worthy of moral consideration) because the game mechanics forced you to value them.

  ### 3. Distinguishing the Boundaries
  You asked where the boundaries lie between this, pretending, and caring about real people.

  | Feature | Pretending / Make-Believe | Fictional Emotion (Film/Book) | Interactive Guilt (Games) | Real-World Emotion |
  | :--- | :--- | :--- | :--- | :--- |
  | **Belief** | You know it's fake. | You know it's fake. | You know it's fake. | You believe it's real. |
  | **Control** | You control the narrative. | You have no control. | You have partial control. | You have partial control. |
  | **Physiology** | No real stress response. | Real stress response (tears, anxiety). | Real stress response + Moral weight. | Real stress response + Real consequences. |
  | **Aftermath** | Stops when you stop acting. | Fades quickly after ending. | **Lingers (Moral Residue).** | Lingers until resolved. |
  | **Responsibility** | None. | None (Witness). | **High (Agent).** | High (Agent). |

  **The Boundary of Harm:**
  The clearest boundary is **consequence**. If you cry at the lighthouse keeper, no dog is actually wet or cold. If you feel guilt over the villager, no actual person is dead. However, if you feel anger at a student at school, that anger affects a real relationship with real consequences. The "fictional" emotions are contained within your own mind; "real" emotions spill out into the world.

  ### 4. A Proposed Definition
  Since there is no single term that perfectly captures the distinction you are noticing, here is a proposed framework you can use in your class discussions. It separates the *passive* emotional connection from the *active* moral burden.

  **1. Spectatorial Empathy (The Passive Case)**
  > *Definition:* An involuntary emotional simulation triggered by witnessing a narrative, where the subject experiences genuine physiological affect (sadness, anxiety) toward fictional entities without believing in their existence or bearing responsibility for their outcomes.
  > *Your Example:* Crying at the lighthouse keeper; anger at the stepmother.
  > *Key Mechanism:* **Resonance.** You vibrate in tune with the story.

  **2. Simulated Moral Responsibility (The Interactive Case)**
  > *Definition:* A state of guilt or regret arising from exercising agency within a fictional system, where the subject perceives their choices as the causal link to a fictional negative outcome, creating a lingering sense of moral obligation despite the lack of real-world harm.
  > *Your Example:* The guilt over the flooded villager; the urge to replay.
  > *Key Mechanism:* **Causality.** You feel you *made* the story happen.

  ### Summary for Your Discussion
  When you talk to your friends, you can say this:

  > "I've been looking into this, and it turns out what we're feeling has a name. When we watch the film, it's called the **Paradox of Fiction**—our brains simulate emotions even when we know the threat isn't real. But the game felt different because of **Agency**. In the film, I was a witness; in the game, I was a participant. That guilt I felt is called **Moral Residue**. It proves that even though the characters aren't real, the *choices* we make feel real to our moral compass."

  You are not confused; you are experiencing the exact power that storytellers and game designers aim for. The fact that you feel embarrassed about the anger or guilty about the game choice shows you have a strong ethical framework that you are testing against these simulations. That is a sign of emotional maturity, not naivety.
