answer: |-
  This is an exceptionally sharp reading of the *Treatise on Probability* (ToP). You have identified the precise hinge upon which Keynes's later economic theory turns. Your intuition that the "weight of argument" introduces a two-dimensional structure to rational belief is correct, and your hesitation regarding the epistemic/ontological distinction is well-founded, as Keynes's own position evolves (or at least shifts emphasis) between 1921 and 1936.

  Here is a parsing of the distinction you are struggling with, structured around your specific questions.

  ### 1. Is Weight Second-Order Confidence or an Intrinsic Logical Feature?

  You ask whether weight is a "second-order property of our confidence" or an "intrinsic feature of the logical relation."

  **The Verdict:** For Keynes in the *Treatise*, weight is an **intrinsic feature of the logical relation** between the evidence ($h$) and the conclusion ($a$). It is *not* a psychological state of confidence, nor is it a second-order probability (i.e., it is not the probability *of* the probability).

  In Keynes's logical theory of probability, the probability relation $a/h$ is objective. Given a specific body of evidence $h$ and a proposition $a$, the degree of rational belief is fixed. However, different bodies of evidence ($h_1$ vs. $h_2$) can yield the same probability relation ($a/h_1 = a/h_2$) while differing in **weight**.

  *   **Weight ($V$)** measures the *completeness* of the evidence.
  *   **Probability ($P$)** measures the *degree* of rational belief given that evidence.

  If $h_1$ is a subset of $h_2$, then $V(a/h_2) > V(a/h_1)$, even if the numerical probability remains unchanged. Because weight is a property of the evidence set $h$ relative to the argument, it is intrinsic to the logical structure of the argument itself. It is not a meta-commentary on our psychological certainty; it is a measure of how much of the "relevant universe" of evidence has been captured in the premises.

  **Why this matters:** If weight were merely psychological confidence, it would be subjective and variable between agents. By making it intrinsic to the logical relation, Keynes preserves the objectivity of rational belief while admitting that two objective probabilities can be rationally treated differently based on the evidence base.

  ### 2. Incomparability and the Rejection of Measurable Expectation

  You ask if this framework provides a principled reason to reject the reduction of rational belief to measurable expectation.

  **The Answer:** Yes, absolutely. This is the philosophical engine of Keynes's critique of classical economics.

  If rational belief were one-dimensional (Probability only), then any two prospects could theoretically be ranked by their expected value ($P \times \text{Payoff}$). However, if belief is two-dimensional ($P$ and $V$), then **incomparability** arises.

  Consider two investments:
  1.  **Investment A:** Probability of return = 0.5, Weight = High (extensive data).
  2.  **Investment B:** Probability of return = 0.5, Weight = Low (scarce data).

  A standard expected utility theorist must be indifferent between A and B. Keynes argues a rational agent prefers A. But why? If $P$ is the only metric, they are identical. To prefer A, the agent must be maximizing a function $U(P, V)$.

  Keynes argues in Chapter VI of the ToP that while probability increases with favorable evidence, weight increases with *any* relevant evidence (favorable or unfavorable). Crucially, he admits that we have no clear principle for weighing a high-probability/low-weight argument against a low-probability/high-weight argument. They may be **non-comparable**.

  This provides the principled rejection of measurable expectation: **You cannot maximize expectation if the inputs are not linearly ordered.** If some probabilities are incomparable due to differences in weight (or non-numerical nature), the calculus of expectation breaks down. Rational action cannot be reduced to a single mathematical maximization problem.

  ### 3. From *Treatise on Probability* to *The General Theory*

  This is where your concern about conflating epistemic humility with ontological non-measurability is most critical.

  **In the *Treatise* (1921):**
  Keynes is a **logical objectivist**. He believes probability relations exist objectively between propositions. Even if we cannot calculate a number, the logical relation exists. "Uncertainty" here is largely a function of **low weight** or **non-numerical probability**. It is epistemic (relative to our knowledge), but the logical structure is ontologically secure.

  **In *The General Theory* (1936) and the 1937 QJE Article:**
  Keynes's usage of "uncertainty" hardens. In Chapter 12 of GT and his 1937 article "The General Theory of Employment," he defines uncertainty as situations where "there is no scientific basis on which to form any calculable probability whatever." Examples include the prospect of a European war or the price of copper in twenty years.

  **The Shift:**
  *   **ToP:** There is a logical relation, but it may be non-numerical or based on low weight.
  *   **GT:** There is *no* basis for a logical relation of probability.

  Does this contradict the ToP? Not necessarily, but it stretches it. In the ToP, Keynes allows for "unknown probabilities." In the GT, he describes situations where the evidence ($h$) is so scant that the relation $a/h$ is effectively null for the purpose of action.

  **Epistemic vs. Ontological:**
  Keynes remains an **epistemic** theorist throughout. He does not claim the future is ontologically indeterminate (like a quantum event); he claims it is epistemically inaccessible to calculation. However, in *The General Theory*, this epistemic limitation **functions as an ontological constraint** on economic behavior.

  Because the weight of evidence regarding long-term investment is so low, agents cannot act on rational expectation ($P \times V$). Instead, they rely on **conventions** (assuming the present will continue, copying others, etc.). So, while the *source* of uncertainty is epistemic (lack of evidence/weight), the *consequence* is that the economy behaves as if the future is ontologically open and non-ergodic.

  ### 4. Resolving Your Conflation Concern

  You wrote: *"I want to avoid conflating the epistemic humility expressed by low weight with the ontological claim that some outcomes are genuinely non-measurable."*

  Keynes himself arguably blurs this line, but for a specific purpose:

  1.  **In the ToP:** Keep them separate. Low weight is epistemic humility. The logical relation exists, but our evidence is thin.
  2.  **In the GT:** The distinction collapses pragmatically. If the weight is low enough, the probability becomes "uncalculable." At this limit, epistemic humility becomes indistinguishable from ontological non-measurability *for the agent*.

  **How to parse this in your study group:**
  You can argue that the concept of **Weight** is the bridge.
  *   **High Weight:** We can treat probability as measurable (Risk).
  *   **Low Weight:** The probability relation is too vague to guide action (Uncertainty).

  Keynes does not claim the future is *magically* non-measurable. He claims that the **complexity and novelty** of economic systems prevent the accumulation of relevant evidence (Weight) necessary to form a numerical probability. Therefore, the "ontological" claim in GT is actually a claim about the **limits of evidence accumulation** in social systems.

  ### Summary for Your Discussion

  1.  **Nature of Weight:** It is an intrinsic property of the logical argument (completeness of evidence), not a psychological second-order confidence.
  2.  **Two-Dimensionality:** Rational belief is $f(P, V)$. This invalidates the reduction of rational choice to single-number expected utility because arguments with different weights are not necessarily comparable.
  3.  **ToP vs. GT:** The ToP establishes the logic (probability is not always numerical/weighted); the GT applies it to macroeconomics (in investment, weight is often too low for *any* probability to be useful).
  4.  **Epistemic/Ontological:** Keynes is consistently epistemic. Probability is always relative to evidence. However, in GT, he argues that for fundamental economic decisions, the evidence required to form a probability is structurally unavailable. Thus, epistemic uncertainty drives ontological-looking behavior (liquidity preference, volatility).

  Your reading is correct: the "weight of argument" is the conceptual tool Keynes uses to break the monopoly of numerical probability, paving the way for his theory of uncertainty-driven economic fluctuations. The "incomparability" you noted is the specific mechanism that prevents the reduction of economics to a calculus of risk.
