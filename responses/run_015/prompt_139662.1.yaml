answer: |-
  ### Stage 1: Brainstorming & Diagnostic

  Here are the claims in your message that are false, ill-defined, or rest on hidden assumptions. I have marked the one doing the most damage.

  1.  **Claim (2): "Dominance doesn't care whether the game is repeated... at each round I do better by defecting... So 'always defect' should still be the fitness-maximising policy."**
      *   **Status:** False.
      *   **Reason:** This conflates *action dominance* in a stage-game with *strategy dominance* in a repeated game. While Defect dominates Cooperate in a single round, the strategy "Always Defect" does not necessarily dominate "Tit for Tat" over the lifetime of an interaction. In indefinite games, backward induction (which supports your claim) fails because there is no final round to anchor the logic.

  2.  **Claim (4): "An ESS is by definition a strategy that, once resident, cannot be invaded... So a single mutant Tit-for-Tat beetle... should be able to increase."**
      *   **Status:** **FALSE (MOST DAMAGING).**
      *   **Reason:** You have conflated **Evolutionary Stability** (resistance to invasion once common) with **Invasion Fitness** (ability to spread when rare). A strategy can be an ESS (stable when resident) but still be unable to invade a population of a different ESS. In a well-mixed population of Defectors, a single Tit-for-Tat mutant meets Defectors almost exclusively, gets exploited, and dies out. This error is why you believe the "kindling frequency" is zero.

  3.  **Claim (5): "Kin selection, spatial viscosity, and group selection then look like rival explanations of the same phenomenon... once we know that pairs last long enough, they do no independent work."**
      *   **Status:** False.
      *   **Reason:** These mechanisms operate on different parameters in the selection equation. "Shadow of the future" changes the *payoff structure* (effective value of cooperation). "Assortment" (kin/structure) changes the *probability of interaction* (who you play). They are mathematically distinct levers; one cannot fully reduce to the other.

  4.  **Loose End (2): "I have been treating 0.8 as the relevant continuation probability, but a pair also ends when either beetle dies..."**
      *   **Status:** Correct Suspicion.
      *   **Reason:** You are right to worry. The effective discount factor $\delta$ must account for both the game continuing *and* both players surviving. Ignoring mortality inflates the value of future cooperation.

  ---

  ### Stage 2: The Mechanics

  You have correctly identified the payoff matrix and the basic intuition of direct reciprocity, but your reduction fails because it ignores the **population dynamics of rare mutants** and the **definition of fitness in stochastic environments**.

  Here is the algebra that decides the matter.

  #### 1. The Effective Discount Factor ($\delta$)
  You suspected Loose End (2) mattered. It does. Fitness is the expected sum of future payoffs. A future payoff is received only if:
  1.  The game does not end (prob $w = 0.8$).
  2.  You do not die (prob $1 - d = 0.9$).
  3.  Your partner does not die (prob $1 - d = 0.9$).

  If either dies, the pair dissolves. You return to the pool, but the specific *relationship* (and the reciprocal leverage it provides) ends.
  $$ \delta = w \times (1-d)^2 = 0.8 \times 0.9 \times 0.9 = 0.648 $$

  Your TA's condition for cooperation stability is $\delta > \frac{T-R}{T-P}$.
  $$ \frac{T-R}{T-P} = \frac{5-3}{5-1} = \frac{2}{4} = 0.5 $$
  Since $0.648 > 0.5$, Tit for Tat (TFT) is stable *if it is already common*. Claim (3) is technically correct regarding stability, but irrelevant if TFT cannot arise.

  #### 2. Why Claim (4) Breaks: Invasion vs. Stability
  You argued that because TFT is an ESS, a single mutant should invade. This is false. Let $p$ be the frequency of TFT in the population. The fitness $W$ of a strategy is the expected payoff against the population mix.

  Payoffs for a single interaction stream (summed to infinity):
  *   **TFT vs TFT:** Cooperate forever. $V_{CC} = \frac{R}{1-\delta}$
  *   **AllD vs AllD:** Defect forever. $V_{DD} = \frac{P}{1-\delta}$
  *   **AllD vs TFT:** Exploit once, then mutual defection. $V_{CD} = T + \frac{\delta P}{1-\delta}$
  *   **TFT vs AllD:** Sucker once, then mutual defection. $V_{DC} = S + \frac{\delta P}{1-\delta}$

  For TFT to invade AllD, the fitness of a rare TFT ($p \approx 0$) must exceed the fitness of the resident AllD.
  $$ W(\text{TFT}) \approx V_{DC} $$
  $$ W(\text{AllD}) \approx V_{DD} $$
  Invasion requires $V_{DC} > V_{DD}$:
  $$ S + \frac{\delta P}{1-\delta} > \frac{P}{1-\delta} $$
  Multiply by $(1-\delta)$:
  $$ S(1-\delta) + \delta P > P $$
  $$ S - S\delta + \delta P > P $$
  $$ \delta(P - S) > P - S $$
  $$ \delta > 1 $$
  Since $\delta$ is a probability, it cannot exceed 1. **A single Tit-for-Tat mutant can never invade a population of Always-Defect in a well-mixed population.** It always takes a net hit ($S < P$) in the first round that it cannot recover from, because the relationship dissolves into mutual defection ($P$) immediately after.

  **Verdict on Claim (4):** Your reasoning fails here. ESS means "uninvadable," not "invading." AllD is *also* an ESS in this model. The population has two stable states (basins of attraction).

  #### 3. The Actual Kindling Frequency
  To find the "kindling frequency" ($p^*$), we solve for the frequency where $W(\text{TFT}) = W(\text{AllD})$. Above this frequency, TFT grows; below it, TFT dies.

  $$ p V_{CC} + (1-p) V_{DC} = p V_{CD} + (1-p) V_{DD} $$
  Rearranging to isolate $p$:
  $$ p (V_{CC} - V_{CD}) = (1-p) (V_{DD} - V_{DC}) $$
  $$ p (V_{CC} - V_{CD} + V_{DD} - V_{DC}) = V_{DD} - V_{DC} $$
  $$ p^* = \frac{V_{DD} - V_{DC}}{(V_{CC} - V_{CD}) + (V_{DD} - V_{DC})} $$

  Let's compute the terms using $\delta = 0.648$:
  1.  **Loss against Defector ($V_{DD} - V_{DC}$):**
      $$ \frac{P}{1-\delta} - \left(S + \frac{\delta P}{1-\delta}\right) = \frac{P(1-\delta) - S(1-\delta)}{1-\delta} = P - S = 1 - 0 = 1 $$
      *(Note: The future cancels out because both end up in mutual defection. The loss is just the first-round sucker payoff.)*

  2.  **Gain against Cooperator ($V_{CC} - V_{CD}$):**
      $$ \frac{R}{1-\delta} - \left(T + \frac{\delta P}{1-\delta}\right) = \frac{R - T(1-\delta) - \delta P}{1-\delta} $$
      Numerator: $3 - 5(0.352) - 0.648(1) = 3 - 1.76 - 0.648 = 0.592$
      Denominator: $1 - 0.648 = 0.352$
      Value: $0.592 / 0.352 \approx 1.68$

  3.  **Calculate $p^*$:**
      $$ p^* = \frac{1}{1.68 + 1} = \frac{1}{2.68} \approx 0.373 $$

  **Result:** You need roughly **37.3%** of the population to be Tit-for-Tat before selection favors cooperation over defection. A single mutant (frequency $\approx 0$) will vanish. The "kindling frequency" is not zero; it is a substantial barrier.

  #### 4. Assortment vs. Shadow of the Future (Claim 5)
  You asked if positive assortment is just a way of getting the continuation probability up. **No.** They are distinct parameters in the inequality derived above.

  *   **Shadow of the Future ($\delta$):** Changes the *value* of the payoffs ($V_{CC}, V_{CD}$, etc.). Increasing $\delta$ makes the future stream of $R$ more valuable compared to the one-time temptation $T$.
  *   **Assortment:** Changes the *probability* $p$ that you meet a like-type.

  In the inequality $p (V_{CC} - V_{CD}) > (1-p) (V_{DD} - V_{DC})$:
  *   Reciprocity works by increasing the term $(V_{CC} - V_{CD})$.
  *   Assortment works by increasing $p$.

  They can compensate for each other (high assortment can allow cooperation even with low $\delta$, and vice versa), but they are mechanistically distinct. Claim (5) is false because kin selection works even in one-shot games (where $\delta = 0$), provided assortment is high enough. Direct reciprocity does not work in one-shot games regardless of assortment (unless you count meeting kin as assortment, but mechanically they are modeled differently).

  #### 5. Loose End 1: Errors and Stability
  You asked: *"If Tit for Tat is an ESS, why... a 2% chance of a move being mis-executed makes two Tit-for-Tat players lock into endless mutual defection?"*

  Strict TFT is **not** an ESS in the presence of errors.
  1.  **The Echo Effect:** If TFT meets TFT and an error occurs (C becomes D), the next round is (D, C). TFT retaliates (D, C). The next is (C, D). They alternate defection forever (or until another error resets it). The average payoff drops from $R$ to $(T+S)/2$.
      *   With your numbers: $(5+0)/2 = 2.5$.
      *   Mutual Defection payoff $P = 1$.
      *   $2.5 > 1$, so they still do better than AllD. *However*, this assumes only one error. With 2% noise per move, the stream is degraded significantly.
  2.  **Neutral Drift:** In a noisy world, TFT performs identically to "Always Cooperate" (AllC) when meeting TFT (both try to cooperate). AllC is not an ESS (it gets invaded by AllD). Because TFT allows AllC to drift into the population neutrally, it opens the door for AllD to invade later.
  3.  **Strict Stability:** An ESS must resist *all* mutants. In noise, "Generous Tit for Tat" (forgives defection with some probability) outperforms strict TFT because it breaks the echo chain. Strict TFT is displaced by Generous TFT, so it is not evolutionarily stable in the long run.

  #### 6. Conventions and Fitness
  You asked for a flag on conventions.
  *   **Fitness Metric:** We used **Undiscounted Lifetime Sum**. This is standard for biological fitness (total offspring). If we used **Average Per Round**, the algebra changes slightly (dividing by expected length), but the inequality conditions for invasion remain identical.
  *   **Update Rule:** Your TA said it "doesn't matter." This is mostly true for the *direction* of selection, but the *speed* depends on whether selection is strong or weak. The "kindling frequency" derived above assumes deterministic selection based on expected payoff. In finite populations with drift, the threshold is "fuzzy," but the mathematical barrier remains.

  ### Summary of Corrections

  1.  **Claim (2) is wrong:** Dominance in a stage game does not imply dominance in a repeated strategy space.
  2.  **Claim (4) is the fatal error:** ESS (stability) $\neq$ Invasion. TFT cannot invade AllD from a single mutant.
  3.  **Claim (5) is wrong:** Assortment and Reciprocity are distinct mathematical terms ($p$ vs $\delta$). One does not reduce to the other.
  4.  **Kindling Frequency:** It is approximately **37.3%** for your specific parameters, not zero.
  5.  **Continuation Probability:** You must include survival probability. $\delta = 0.648$, not $0.8$.
  6.  **Errors:** TFT is not robust to noise; it loses ESS status because it cannot distinguish noise from defection, leading to payoff degradation and vulnerability to neutral drift.

  Your intuition that the topic "dissolves into one inequality" was the warning sign. The inequality $\delta > (T-R)/(T-P)$ is only the condition for cooperation to be *maintained*, not for it to *evolve* from scratch in a well-mixed population. The evolution of cooperation requires overcoming the invasion barrier, which usually demands assortment (kin/structure) or a much higher $\delta$ than stability requires.
