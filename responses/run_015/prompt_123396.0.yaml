  ### Session Plan: The Breakdown of Indifference in Continuous Space

  **Target:** Philosophy Undergraduates (50 Minutes)
  **Core Problem:** Bertrand's Paradox (framed via the Inscribed Triangle condition).
  **Pedagogical Goal:** Demonstrate that the Principle of Indifference (PoI) is underdetermined in continuous spaces without a specified measure.

  ---

  #### 1. Conceptual Groundwork (Minutes 0–10)
  Before posing the triangle problem, you must dismantle the students' discrete intuition. In discrete cases (dice, coins), the "possibility space" is given by the objects themselves. In continuous cases, the space must be *constructed*.

  *   **The Measure Problem:** Explain that "random" is not a property of the object, but of the *selection procedure*. In continuous spaces, we must map physical possibilities to numbers (a measure). PoI says "assign equal probability to equal possibilities," but it fails to specify *which description of the possibility* gets the uniform distribution.
  *   **The "Description Dependence":** Use a quick warm-up: "A cube has side length between 1 and 2 cm. What is the probability the side is $< 1.5$?" (Answer: 1/2). "What is the probability the face area is $< 2.25$?" (Answer: 1/2). "What is the probability the volume is $< 3.375$?" (Answer: 1/2). Now ask: "If side length is uniform, is volume uniform?" (No). This primes them to see that transforming variables changes the distribution.
  *   **Crucial Clarification (The Pivot):** The prompt requests the "Inscribed Triangle Problem" (3 points) but lists parameterizations (Chord Length, Central Angle) that belong to **Bertrand's Paradox** (1 chord). To ensure the math works and the contradiction is clean, explicitly state: *"We will analyze the probability that a random chord exceeds the length of the side of an inscribed equilateral triangle. This is mathematically equivalent to asking if a triangle formed by that chord and a fixed vertex is obtuse, but it allows us to use the three parameterizations you requested."*

  #### 2. The Sequence of Parameterizations (Minutes 10–35)
  To make the contradiction feel inevitable, order the methods from "most intuitively correct" to "most geometrically abstract." This forces students to abandon their intuition step-by-step.

  **Method 1: Uniform Selection of Points on the Circumference (Minutes 10–18)**
  *   **Procedure:** Fix point $A$. Select point $B$ uniformly on the circumference. The chord is $AB$.
  *   **Logic:** This feels like the "definition" of a random chord. It respects the rotational symmetry of the circle.
  *   **Result:** The chord is longer than the triangle side if $B$ falls in the arc opposite $A$ (1/3 of the circle). **$P = 1/3$**.
  *   **Misconception to Head Off:** *"This is the objectively correct method because points are what make a circle."*
      *   **Intervention:** Do not refute this yet. Ask: "Does this method treat all *chords* equally, or all *endpoints* equally?" Plant the seed that we are uniforming the *endpoints*, not the *chords*.

  **Method 2: Uniform Selection of Central Angles (Minutes 18–26)**
  *   **Procedure:** Consider the angle $\theta$ subtended by the chord at the center. Select $\theta$ uniformly from $[0, \pi]$.
  *   **Logic:** This appeals to angular symmetry. It feels distinct from Method 1 but equally "pure."
  *   **Result:** The chord exceeds the triangle side if $\theta > 60^\circ$ ($\pi/3$). Range is $[\pi/3, \pi]$. Probability is $(\pi - \pi/3) / \pi = 2/3$. **$P = 2/3$**.
  *   **Misconception to Head Off:** *"Method 1 was sloppy; this is the real symmetry."*
      *   **Intervention:** Point out that Method 1 also satisfied a symmetry (rotational invariance of endpoints). Ask: "Can two different symmetries both be 'True'?"

  **Method 3: Uniform Selection of Chord Lengths (Minutes 26–35)**
  *   **Procedure:** Select the length $L$ directly from a uniform distribution $[0, 2R]$.
  *   **Logic:** This appeals to physical intuition. If I grab a stick, isn't the length the primary property?
  *   **Result:** The chord exceeds the triangle side ($\sqrt{3}R$) if $L \in [\sqrt{3}R, 2R]$. Probability is $(2 - \sqrt{3}) / 2 \approx 0.134$. **$P \approx 0.13$**.
  *   **Misconception to Head Off:** *"This is artificial; you can't just pick a length without a position."*
      *   **Intervention:** Concede it's a different *generation procedure*. The point is not that this is "physical," but that it satisfies PoI on the variable *Length*.

  #### 3. Managing Misconceptions (Integrated throughout)
  Students will try to resolve the tension to reduce cognitive dissonance. You must block these exits to preserve the philosophical lesson.

  1.  **The "Naturalness" Fallacy (After Method 1):**
      *   *Belief:* "Method 1 is the default because we usually define circles by their boundary."
      *   *Head Off:* Remind them that PoI requires *equally possible cases*. Is a chord defined by its ends, its length, or its distance from the center? PoI does not say.
  2.  **The "Error" Fallacy (After Method 2):**
      *   *Belief:* "One of these calculations must be mathematically wrong."
      *   *Head Off:* Verify the math on the board quickly. Show that all three are internally consistent. The error is not in the arithmetic, but in the assumption that the problem was fully specified.
  3.  **The "Subjectivity" Fallacy (After Method 3):**
      *   *Belief:* "Therefore, probability is just subjective opinion."
      *   *Head Off:* Clarify that probability is objective *relative to the model*. If the selection mechanism is known, the probability is fixed. The ambiguity lies in the *model selection*, not the probability calculus itself.

  #### 4. Check Question (Minutes 35–40)
  Do not ask them to calculate a probability. Ask them to identify the dependency.

  > **Question:** "An alien civilization selects a chord using a mechanism unknown to us. They tell you: 'Our mechanism ensures that every possible *chord length* is equally likely to be chosen.' Based *only* on this information, which probability (1/3, 2/3, or 0.13) must you use to bet on whether the chord is longer than the inscribed triangle's side? Why would using 1/3 be a mistake here?"

  *   **Correct Answer:** You must use 0.13 (Method 3). Using 1/3 assumes a uniform distribution of *endpoints*, which contradicts the alien's statement about *lengths*.
  *   **Pedagogical Aim:** This tests if they understand that the probability value is a function of the *parameterization*, not an intrinsic property of the triangle or circle.

  #### 5. Resolution to Exclude: Jaynes's Symmetry Argument (Minutes 40–50)
  **Explicitly set aside Edwin Jaynes's resolution.**

  *   **What Jaynes Argues:** Jaynes (1973) proposed that we should select the distribution that is invariant under all transformations (rotation, scaling, translation). He argued this yields a unique "correct" answer (typically the 1/2 solution derived from uniform distance from the center).
  *   **Why Exclude It:**
      1.  **Pedagogical Aim:** The goal of this session is to demonstrate the **breakdown** and **underdetermination** of the Principle of Indifference. Jaynes's argument is a *rescue mission* that claims PoI can be saved by adding higher-order symmetry constraints. Introducing it suggests there *is* a single objectively correct answer after all, which undermines the lesson that the problem statement itself was incomplete.
      2.  **Philosophical Focus:** For undergraduates, the deeper lesson is that "randomness" is not a physical property waiting to be discovered, but a feature of the description. Jaynes shifts the focus back to finding the "true" physical symmetry, whereas you want them to sit with the discomfort that multiple symmetries are equally valid *a priori*.
      3.  **Alternative:** Instead, conclude with the **Invariant-Measure Fix** (Kolmogorovian view): The problem is not a paradox but an *ellipsis*. A probability question is meaningless without a specified sample space and measure. This reinforces the rigor of modern probability theory without promising a metaphysical solution to PoI.

  #### 6. Closing (Minutes 45–50)
  Summarize: The Principle of Indifference works for discrete bins but fractures in continuous spaces because there are infinite ways to "slice" the space. The "correct" probability is always relative to the "correct" measure, and without a physical selection process, the measure is underdetermined.
