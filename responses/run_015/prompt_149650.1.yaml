answer: |-
  Your skepticism regarding reflective equilibrium as a mere cleaning procedure is well-founded and points toward a profound difficulty in contemporary moral philosophy, specifically the problem you have termed normative sedimentation. If biases can reshape the standards by which we evaluate coherence, then the equilibrium reached may be stable yet systematically distorted, much like a building that has settled unevenly on a compromised foundation. Given your constraints of a three-year timeline, a background in logic and conceptual analysis, and a lack of resources for large-scale empirical study, I would argue that your research agenda must prioritize the meta-level conceptual question over the formal modeling or institutional design, despite the intuitive appeal of the latter two for creating a workable framework. The most urgent priority is to rigorously analyze whether the distinction between genuine moral preference and systematic bias is conceptually coherent when applied to diachronic processes of deliberation. This work is upstream of everything else because if the ideal of a preference untainted by bias is misleading, as you suspect, then attempting to model the separation formally or design institutions to enforce it would be an exercise in optimizing a category error. You are uniquely positioned to tackle this through philosophical analysis because it does not require new data but rather a reconstruction of the normative commitments underlying our psychological models. Over the next few years, you should focus on mapping the conditions under which a change in judgment counts as learning versus conditioning, drawing on literature from epistemology and moral psychology without needing to generate new empirical findings yourself. Evidence that would diminish the importance of this direction would be a breakthrough in social psychology demonstrating a clear, observable neural or behavioral marker that distinguishes bias reinforcement from moral learning independent of self-report, but given the current state of the field, such a discovery is unlikely, keeping the conceptual work primary.

  Following the conceptual groundwork, your second priority should be the development of formal models of preference change, which leverages your background in logic while remaining tractable within a dissertation timeframe. Once you have established a working definition of what constitutes bias sedimentation versus moral development, you can construct logical or probabilistic models that simulate how agents update their moral principles over time under different constraints. This direction is secondary because a model is only as good as the conceptual parameters fed into it, but it is crucial for bridging the gap between abstract philosophy and the workable frameworks you hope to inform. These models do not require laboratory resources; they require clarity about the rules of inference and updating that agents are presumed to follow. You can engage selectively with existing social psychology literature to parameterize these models, treating empirical findings as fixed points that your model must accommodate rather than as data you must generate. This approach allows you to contribute to the formal understanding of moral reasoning without overextending into empirical science. If, during this process, you find that the formal models become too complex to yield actionable insights or that they fail to capture the nuance of the conceptual distinctions you established, you should be prepared to pivot back toward pure conceptual analysis or move more quickly toward institutional applications. However, if the models successfully demonstrate that certain patterns of coherence-seeking are mathematically prone to locking in initial biases, this would provide a powerful tool for ethics review protocols.

  The third tier of your agenda should focus on institutional mechanisms for external correction, which addresses the practical goal of your research but depends heavily on the success of the first two directions. Since your analysis suggests that internal reflection may be compromised by sedimentation, the logical conclusion is that correction must come from outside the individual deliberator, perhaps through structured disagreement or diverse review panels. This is downstream because you cannot design a mechanism to correct for bias unless you have a model of how that bias operates and a conceptual account of why it is distinct from legitimate preference. This direction is highly relevant for informing ethics review protocols, but it risks becoming speculative if not grounded in the prior theoretical work. You can make progress here by analyzing existing institutional structures through the lens of your conceptual and formal findings, identifying where current protocols assume a level of individual reflective purity that your earlier work has shown to be impossible. Evidence that would elevate this direction would be if your conceptual work reveals that the distinction between bias and preference is entirely context-dependent, suggesting that the only viable solution is procedural rather than substantive. In that case, the design of the institution becomes the primary locus of moral truth, rather than the judgments of the individuals within it.

  Conversely, I would actively deprioritize the direct empirical investigation of which cognitive distortions are corrigible. While this is a vital question, it is ill-suited to your specific constraints and skill set. Determining corrigibility typically requires longitudinal studies or controlled interventions that are beyond the scope of a philosopher without laboratory access. Attempting to resolve this empirically within three years would likely result in a superficial survey of existing literature rather than a substantive contribution, and it risks diverting energy from the conceptual work where you can offer genuine novelty. Instead, you should treat the empirical question as a parameter to be modeled rather than a problem to be solved experimentally. You can synthesize existing psychological findings to inform your models and conceptual analysis, but making the empirical resolution a central pillar of your agenda would jeopardize the completion of your project. If new meta-analyses emerge during your research that definitively settle the corrigibility of specific biases, you can incorporate those findings, but you should not build your dissertation on the hope of generating them.

  There is, however, an overlooked question that deserves elevation into the top tier alongside your conceptual analysis, which concerns the role of epistemic friction and disagreement in stabilizing judgment over time. You mentioned the diachronic stability of calibrated judgment, but I would suggest focusing specifically on how interpersonal disagreement functions as a check against normative sedimentation. If individual reflection is prone to bias reinforcement, then the interaction between differing reflective equilibria might be the only mechanism capable of exposing sedimented biases. This fits your background in logic and conceptual analysis because it involves analyzing the structure of argumentation and disagreement rather than running experiments. It also connects directly to institutional design, as it suggests that ethics review protocols should prioritize cognitive diversity over mere expertise. Integrating this into your primary conceptual work would strengthen the practical relevance of your dissertation without requiring empirical resources. Ultimately, your agenda should flow from the metaphysical possibility of separating bias from preference, through the logical modeling of how that separation might fail or succeed, to the institutional structures that can mitigate the risk when individual reasoning is opaque to itself. By structuring your work this way, you ensure that each stage supports the next, avoiding the pitfall of designing solutions for a problem you have not yet fully defined.
