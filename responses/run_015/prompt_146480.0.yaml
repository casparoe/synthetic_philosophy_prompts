  The action is approved, but the agent and motive receive withheld approval because moral merit requires sympathetic sentiment, not just correct calculation.

  Three rules fit your first five cases. First, *Empirical Sympathy*: approval tracks what informed observers actually feel (the App). Second, *Objective Utility*: approval tracks welfare maximization regardless of motive. Third, *Propriety of Sentiment*: actions pass if beneficial, but agents are approved only if their motives align with what the impartial spectator would feel.

  On Marla, Rule 1 predicts disapproval (App score is zero). Rule 2 predicts full approval (200 lives saved). Rule 3 predicts the split verdict (action good, motive cold).

  I'd bet on Rule 3. Rule 1 fails to explain why the professor rejects the "App" of local honor in Case 2; she privileges the *Impartial* Spectator over actual crowds. Rule 2 fails Case 5; if utility ruled, the vanity donor's agent would pass, but she withheld approval. Rule 3 survives both: it rejects biased consensus (Case 2) but demands emotional propriety (Case 5). Marla's calculation is rational, but Smithian virtue requires the heart to align with the head; without fellow-feeling for the saved lives, she lacks moral worth despite doing good.

  To distinguish Rule 3 from a variant where "rational correction of bias" grants virtue, hand her this case: Marla saves the 200 lives but secretly feels repulsion toward the beneficiaries, acting solely on duty. If the professor approves the agent, she values rational correction over sentiment. If she withholds approval, she holds that proper moral worth requires the motive's sentiment to match the act's propriety. Smith demands the heart align with the head; mere algebra isn't virtue.
