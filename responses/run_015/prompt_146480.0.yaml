  - In a town where everyone, even fully informed, thinks honor requires it, a man shoots a rival over a pretty trivial insult. Her verdict: disapproved.
  - A parent runs into a burning building and pulls out their own kid rather than two other kids, same effort either way. Her verdict: not disapproved — partiality is fine here.
  - A guy reads a detailed report on a famine, feels a flicker of concern, sends nothing, goes back to his day. Her verdict: disapproved, but only mildly, and mainly for the failure of attention rather than for the outcome.
  - Someone makes a big public donation mostly because he loves being seen as generous. Her verdict: the action passes, the agent doesn't fully — the spectator withholds something.

  I think at least three rules fit all five, and they split on the case she's giving us Friday. There's now an app half the campus uses, Spectator: you describe what you're about to do, and it returns an approval score, trained by averaging millions of people's gut reactions to cases after they've been given full information. Friday's case: Marla is a midlevel health bureaucrat who quietly shifts a budget line so an unglamorous program gets funded — best estimate is about two hundred statistical lives saved, in another country, five years out. Nobody ever finds out, there's no identifiable kid in a well photo, and Marla's actual motive is just that she ran the numbers and the numbers said do it; she feels no fellow-feeling for anyone. Spectator scores her at basically zero, because informed reactions to statistical foreign lives five years out are famously flat.

  So: does her spectator approve Marla? Note that on case five she split the verdict three ways, so I want your prediction on each — the action, the agent, and the motive. Then lay out the candidate rules you think fit her first five verdicts, what each one predicts about Marla, which you'd bet on and why, and the one further case you'd hand her next week to tell the rules apart.

  Keep it under 400 words and lead with the one-sentence verdict. Don't bother quoting Smith at me, I've got the book — I just want the rule.
