          *   Provide a "residue report" (what translated well, what was fudged, what's impossible).
          *   Address the user's hunch: Responsibility is split/distributed, not singular. Split into (1) prevention, (2) explanation, (3) blame.
          *   Address "moral responsibility" vs. "rulebook penalty" and "intent" (code function vs. foreseeability).
          *   Be honest about limitations (can a robot be responsible? does "fairness" exist outside rules?).
          *   **Constraint:** No academic journal recommendations. Keep it practical and grounded in their experience.

  2.  **Deconstruct the "Responsibility Gap":**
      *   *Standard Definition:* As systems become more autonomous/unpredictable, the link between human action and outcome weakens. The programmer didn't *directly* cause the specific error (the AI learned it), the user couldn't control it (it's autonomous), but the machine isn't morally liable. So, who gets blamed? No one. That's the gap.
      *   *Robotics Translation:*
          *   Programmer: Wrote the auto routine / integrated the vision library.
          *   Driver: Has the e-stop, controls teleop.
          *   Mentor: Signed off on code freeze/inspection.
          *   Rulebook/Refs: Assign penalties (yellow cards, points deduction).
          *   The "Gap": When the robot does something weird in Auto (vision glitch, weird lighting) that hurts the alliance, who gets the penalty?
          *   If the code did exactly what was written but the *outcome* was bad due to unpredictability -> Programmer says "not my fault, logic was sound."
          *   Driver couldn't touch it (Auto period) -> Driver says "couldn't stop it."
          *   Mentor signed off but can't debug every edge case -> Mentor says "reasonable review."
          *   Result: The alliance takes the points hit, but no *person* feels the specific blame.

  3.  **Drafting the Translation (The "Match Report"):**
