      *   *Fudged:* "Moral Responsibility." In FRC/VEX, it's about points and eligibility. In philosophy, it's about *good/evil* or *virtue*. A penalty isn't shame; it's a game mechanic.
      *   *Impossible:* "Robot as Agent." In team culture, the robot is *always* a tool. Even in Auto, it's "our code." Philosophy asks if the machine itself can hold blame. Robotics says "no, check the logs."
