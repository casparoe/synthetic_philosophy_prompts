  4.  **Addressing the User's Hunch (Distribution of Responsibility):**
      *   The user is onto something crucial: *Distributed Responsibility.*
      *   In robotics, we accept that responsibility is a pipeline.
      *   (1) Prevention: Programmer (code), Mentor (review), Driver (e-stop).
      *   (2) Explanation: Programmer (logs), Driver (match recount).
      *   (3) Blame: Alliance (points), maybe Programmer (if negligent).
      *   The "Gap" happens when (1) and (2) are satisfied, but (3) still needs a target. The rulebook targets the *Alliance*, not the *Person*. This validates the user's hunch.

  5.  **The Residue Report (Translation Fidelity):**
