  This is an incredibly strong set of intuitions for a high school senior. You've basically reconstructed a debate that has occupied professional philosophers and economists for the last 40 years (specifically the tension between "Myopic Choice," "Resolute Choice," and "Time-Slice Rationality").

  To answer your question directly: **No, this does not hang together.** You have three major fractures in the foundation. If you hand this in as-is, your econ teacher (or your friend) will be able to pull any one of these threads and unravel the whole sweater.

  Here is the ranking of your contradictions from "fatal logical error" to "philosophical tension," followed by the single revision that saves the project.

  ### The Contradictions (Ranked by Severity)

  **1. The Money Pump Trap: (3) vs. (4)**
  *   **Severity:** Critical / Logical Impossibility
  *   **The Conflict:** This is the one your friend is exploiting. Claim (3) says the solution to a money pump is to **make a plan and stick to it** (which implies refusing a trade later). Claim (4) says it is **never rational to turn down a strict improvement in the moment**.
  *   **Why it breaks:** In a money pump scenario, the third trade *is* a strict improvement in the moment (you get your original item back plus a penny, or you move from C to A which you currently prefer). If (4) is true, you *must* take the trade. If you must take the trade, you cannot "stick to the plan" to refuse it. You cannot simultaneously hold "I will refuse this trade to save my wallet" and "I am irrational if I refuse this trade." One of these has to be false.

  **2. The Authority Gap: (2) vs. (5)**
  *   **Severity:** High / Normative Contradiction
  *   **The Conflict:** Claim (2) says there is **no "real" you** and no time-slice should be the boss. Claim (5) says **precommitment is rational**, which is literally one time-slice (Sunday) tying the hands of another time-slice (Friday).
  *   **Why it breaks:** If Sunday-you and Friday-you are equally valid sovereign agents (per 2), then Sunday-you locking the chips away is an act of aggression, not rationality. Why does Sunday's preference override Friday's? Precommitment only makes sense if there is a "Whole Person" whose interests matter more than the sum of the slices. Claim (2) explicitly denies that "Whole Person" exists.

  **3. The Diagnosis Dispute: (1) vs. (3)**
  *   **Severity:** Moderate / Definitional Tension
  *   **The Conflict:** Claim (1) says intransitive preferences are **straight-up irrational**. Claim (3) says getting money-pumped (which happens because of intransitive preferences) shows **you played badly, not that your preferences were irrational**.
  *   **Why it breaks:** If the preferences themselves are the irrational thing (1), then a money pump *is* proof of irrationality. Claim (3) tries to say the preferences are fine and the *strategy* was bad. You can't blame the strategy for a problem caused by the preferences while simultaneously saying the preferences are the definition of irrationality.

  ---

  ### The Single Revision

  There is one change you can make that resolves the Critical error, mitigates the High error, and smooths over the Moderate error.

  **You must revise Claim (4).**

  **Current (4):** "It's basically never rational to turn down a straight-up improvement in the moment."
  **Revised (4):** "It is rational to turn down a local improvement if doing so is necessary to execute a rational global plan."

  In decision theory, this is moving from **Myopic Choice** (maximizing at every single node) to **Resolute Choice** (maximizing over the whole path).

  ### Why This Revision Cleans Up the Most

  **1. It solves the Lunch Line Argument (Fixes 3 vs. 4)**
  Your friend says: "At step 3, you prefer A to C, so you trade. You're pumped."
  Your new response: "At step 3, I prefer A to C *in isolation*, but I value **being a person who keeps their plans** more than I value that penny. So I refuse the trade."
  By revising (4), you admit that rationality isn't just about the snapshot; it's about the movie. You are allowed to say "No" to a good trade because saying "Yes" breaks a plan that serves you better overall. This makes Claim (3) logically possible.

  **2. It Justifies Precommitment (Fixes 2 vs. 5)**
  Why is Sunday-you allowed to boss around Friday-you? Under your old view (2), you weren't. But if you adopt Resolute Choice, Sunday-you isn't "bossing" Friday-you; Sunday-you is **setting a plan** that Friday-you has a rational duty to respect.
  It shifts the authority from "The Self" to "The Plan." This allows you to keep the spirit of (2) (preferences change) while making sense of (5) (binding those preferences). You can say: "I don't need a 'real me' to exist; I just need my time-slices to cooperate via plans."

  **3. It Defangs the Irrationality Charge (Fixes 1 vs. 3)**
  If you can stop the money pump by being resolute, then having intransitive preferences doesn't necessarily lead to exploitation.
  You can nuance Claim (1) to: "Intransitive preferences are *structurally* risky, but an agent is only *practically* irrational if they let those preferences get them pumped."
  This aligns with Claim (3): The preferences might be weird, but if you manage them resolutely, you aren't "irrational" in the sense of being a bad reasoner. You've separated the *structure* of desire from the *agency* of choice.

  ### The Cost

  You need to know what you're giving up. By revising (4), you are abandoning the standard economic definition of rationality (which is almost always Myopic).

  *   **You lose simplicity:** "Always take the upgrade" is a very easy rule to follow. "Take the upgrade unless it violates a prior plan you still endorse" is much harder to calculate in the moment.
  *   **You invite a new objection:** Your friend will ask, "What stops you from making a new plan at Step 3 to abandon the old plan?" (This is the "Sophisticated Choice" objection). You will need to argue that there is a intrinsic value in **resolution**—that breaking a plan with your past self is a cost in itself.

  ### Summary for Your Proposal

  If I were you, I would write the proposal like this:

  > "My position is that rationality is diachronic (across time) rather than just synchronic (in the moment). While I maintain that intransitive preferences are structurally flawed (1), I argue that agents can avoid exploitation not by fixing preferences, but by adopting **resolute choice** (revised 4). This allows us to view precommitment (5) not as one time-slice dominating another, but as cooperative planning between time-slices (nuanced 2), rendering money pumps a failure of resolution rather than proof of inherent irrationality (3)."

  This holds together. It's sophisticated, it answers your friend, and it gives you a real roadmap for the independent study. Good luck.
