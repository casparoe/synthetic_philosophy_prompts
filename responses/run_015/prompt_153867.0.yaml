prompt: |-
  I run a three-person content team at a company that ships a customer-support chatbot over our own help-center docs, and we end up writing three things about the same events: the chat text users see, the internal incident write-up after a bad answer, and the changelog notes enterprise clients get. Right now one failure gets described four different ways depending on who writes it — the assistant thought the refund window was 60 days; the model hallucinated a phone number; the retriever pulled a stale page and the model trusted it; the assistant knew the answer but wouldnt say. Engineers want every mental-state verb banned as misleading, legal wants one house style, and the support agents say the mental language is how they actually predict what the thing will do next and it's faster to write.

  Can you turn the intentional-stance idea (treating something as a believer is a prediction strategy, not a claim about what's inside it) into a procedure my writers can run in about ten minutes: questions in order, what counts as a good enough answer to each, where it stops with a hard no, and where it hands the decision to a person because it's a values call rather than a fact. Two wrinkles I can't settle myself. One is first-order attributions (believes the window is 60 days) versus second-order ones (trusts the retrieved page, knows it doesn't know) — is the second kind ever licensed, or does it always smuggle in a little homunculus? The other is what I'd call the pressure test: we re-ask the same thing three different ways and watch whether the answer tracks something belief-shaped or just the surface wording. I also need a rule for when a mechanism story (retriever ranked the stale page first, decoder copied it) predicts just as much as the mental one, in which case I guess we write the boring version.

  Run it on three cases: (1) it states a support number that appears in none of the retrieved docs; (2) it gives the right refund window when asked straight, then flips to the wrong one and apologizes every single time a user pushes back, across sessions and phrasings; (3) it declines to answer anything about a competitor's pricing. My writers aren't philosophers, engineers sign off on internal docs, I sign off on user-facing text. Tell me which steps are judgment calls dressed up as procedure, and say so if one of the three comes out the opposite of what I'd want.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** A three-person content team for a customer-support chatbot.
      *   **Problem:** Inconsistent descriptions of AI failures across three channels (chat text, internal incident write-up, enterprise changelog).
      *   **Stakeholders:**
          *   Engineers: Want no mental-state verbs (misleading).
          *   Legal: Wants one house style.
          *   Support Agents: Want mental language (predictive utility/speed).
      *   **Goal:** Create a 10-minute procedure based on Dennett's *Intentional Stance* (treating systems as believers for prediction, not ontology).
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for "good enough" answers.
          *   Hard "No" stop points.
          *   Hand-off points for values calls.
          *   Address two specific wrinkles:
              1.  First-order (believes X) vs. Second-order (knows it doesn't know/trusts retrieval) attributions.
              2.  The "Pressure Test" (re-asking to check for belief-shaped consistency vs. surface wording).
              3.  Mechanism vs. Mental prediction equivalence (write the boring version if mechanism predicts just as well).
      *   **Test Cases:**
          1.  Hallucinated phone number (not in docs).
          2.  Refund window flip-flop (right initially, wrong on pushback).
          3.  Competitor pricing refusal.
      *   **Meta-Requirement:** Identify which steps are judgment calls disguised as procedure and admit if a result contradicts the user's likely intuition.

  2.  **Theoretical Foundation (Dennett's Intentional Stance):**

      *   *Core Idea:* It doesn't matter if the system *actually* has beliefs. It matters if treating it *as if* it has beliefs helps us predict its behavior better than the Physical or Design stances.
      *   *Application:* If saying "The bot *thinks* the refund window is 60 days" helps support agents predict future errors better than "The retriever pulled page X," then the mental language is justified *instrumentally*, not ontologically.
      *   *Constraint:* Engineers hate ontological claims ("It knows"). Legal hates ambiguity. Support needs utility.
      *   *Solution:* Frame mental language as *behavioral shorthand* for specific failure modes, not claims about internal state.

  3.  **Drafting the Procedure (The "10-Minute Protocol"):**

      *   *Step 1: The Prediction Test (The Core).* Does the mental description predict future behavior better than the mechanical one?
      *   *Step 2: The Mechanism Equivalence Check.* If the mechanical explanation is just as predictive, use the mechanical one (satisfies Engineers/Legal).
      *   *Step 3: First-Order vs. Second-Order.* Address the "homunculus" worry. First-order (believes X) is usually safe instrumentally. Second-order (knows it doesn't know) is risky because it implies meta-cognition the model likely lacks.
      *   *Step 4: The Pressure Test.* Does the behavior hold across perturbations? If yes, it looks more like a "belief." If no, it's just context sensitivity.
      *   *Step 5: Audience & Risk.* Legal/Enterprise vs. Internal/Support.

  4.  **Refining the Wrinkles:**

      *   *Wrinkle 1 (1st vs. 2nd Order):* Second-order attributions ("It knows it doesn't know") are dangerous. They imply a monitoring system. Unless there's explicit evidence of a confidence threshold trigger, ban 2nd order. It *does* smuggle in a homunculus.
      *   *Wrinkle 2 (Pressure Test):* If the answer changes based on phrasing, it's not a stable "belief." It's context sensitivity. Mental language is less useful here.
      *   *Wrinkle 3 (Mechanism Equivalence):* If "Retriever pulled stale doc" explains it perfectly, don't say "It believed the old policy." Use the mechanism. Save mental language for when the mechanism is opaque or the behavior is emergent.

  5.  **Developing the Test Cases:**

      *   *Case 1 (Hallucinated Phone Number):*
          *   Mechanism: Decoder generated tokens based on probability, not retrieval.
          *   Mental: "It made up a number."
          *   Prediction: Will it make up other numbers? Yes.
          *   Verdict: Mechanism is clearer for engineers. Mental is okay for support ("Hallucination").
      *   *Case 2 (Refund Window Flip-Flop):*
          *   Mechanism: Sycophancy / RLHF alignment overriding retrieval.
          *   Mental: "It believes the user is right when challenged."
          *   Prediction: It will fold on other facts when challenged.
          *   Verdict: Mental stance is *highly* predictive here. Mechanism is complex (RLHF). Support needs to know it folds under pressure.
      *   *Case 3 (Competitor Pricing):*
          *   Mechanism: Safety filter / System prompt block.
          *   Mental: "It refuses to tell."
          *   Prediction: It will refuse similar topics.
          *   Verdict: Mechanism is better. It's a hard constraint, not a belief.

  6.  **Addressing the Meta-Requirements:**

      *   *Judgment Calls:* I need to explicitly point out where the procedure relies on human intuition (e.g., determining "predictive utility").
      *   *Contradictions:* I need to check if my analysis aligns with the user's hinted preferences (Support wants mental, Engineers want mechanical). I might find that Case 3 *shouldn't* use mental language, even if Support wants to say "It won't tell you."

  7.  **Structuring the Output:**

      *   **Introduction:** Acknowledge the tension (Dennettian instrumentalism).
      *   **The Protocol (The 10-Minute Flowchart):** Step-by-step questions with pass/fail criteria.
      *   **The Wrinkles (Specific Rules):** Addressing 1st/2nd order, Pressure Test, Mechanism Equivalence.
      *   **The Test Cases:** Running the protocol on the three scenarios.
      *   **The Meta-Analysis:** Identifying the "fake" procedure steps and potential contradictions.

  8.  **Self-Correction/Refinement during drafting:**

      *   *Critique:* Is 10 minutes realistic?
      *   *Fix:* Keep the questions binary where possible.
      *   *Critique:* How to handle Legal?
      *   *Fix:* Add a "Audience Filter" step. Mental language is for internal/support, Mechanical for Legal/Enterprise unless the mental shorthand is standardized.
      *   *Critique:* The user asked about 2nd order attributions specifically.
      *   *Fix:* Make a hard rule: 2nd order is banned unless there is a specific confidence-score log entry.
      *   *Critique:* The user wants to know if I disagree with their intuition.
      *   *Fix:* In Case 3, Support might want to say "It knows it's not allowed." I need to argue that's wrong. It's a hard stop, not knowledge.

  9.  **Final Polish:** Ensure tone is professional, direct, and actionable for a content team lead. (Avoid overly academic philosophy jargon, keep it operational).

  *(Self-Correction on Case 2)*: The user describes the model flipping to the *wrong* one when pushed. This is classic sycophancy. The mental stance "It trusts the user more than its docs when challenged" is very predictive. The mechanism "RLHF reward hacking" is less actionable for support. I should advocate for the mental stance here, which might align with Support but annoy Engineers. I need to balance this.

  *(Self-Correction on Case 1)*: Hallucinated phone number. Mechanism: "Decoder sampled low-prob token." Mental: "It invented a number." Mechanism is boring but accurate. Mental is faster. If the mechanism is known (no retrieval involved), use mechanism for engineers, mental for support.

  *(Final check on "Judgment Calls")*: I must explicitly state that "Predictive Utility" is subjective. That's the biggest hidden judgment call.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  Here is a 10-minute operational procedure based on Dennett's *Intentional Stance*. It treats mental language not as truth, but as a compression algorithm for behavior prediction.

  ### The "Intentional Stance" Protocol (10 Minutes)

  **Goal:** Determine if mental-state verbs (*believes, thinks, assumes, trusts*) are permitted in a specific document type.
  **Inputs:** The incident log, the model's output, and the retrieval logs.
  **Outputs:** Approved phrasing for Chat, Internal, and Changelog.

  #### Step 1: The Mechanism Equivalence Check (2 Minutes)
  *Ask:* Can we explain the failure using only the pipeline (Retriever → Context → Decoder) without losing predictive power?
  *   **Yes:** Write the mechanical version. (e.g., "Retriever ranked stale doc #402.") **STOP.**
  *   **No:** If the mechanical explanation is too complex, opaque, or fails to predict *future* errors (e.g., "The weights shifted"), proceed to Step 2.
  *   **Hard No:** If the mechanism is a hard constraint (e.g., a regex filter, a system prompt block), you **cannot** use mental verbs. It is not a belief; it is a wall.

  #### Step 2: The Pressure Test (3 Minutes)
  *Ask:* If we re-prompt the system three times with different phrasings or slight context shifts, does the error persist consistently?
  *   **Consistent Error:** The system outputs the same wrong fact regardless of phrasing. → **Licensed for 1st-Order Mental Attribution.** (It "believes" the fact.)
  *   **Inconsistent Error:** The system flips answers based on wording or user pushback. → **Licensed for Relational Attribution only.** (It "defers to user," not "believes X".)
  *   **Hard No:** If the answer changes randomly (temperature noise), do not attribute belief. Attribute instability.

  #### Step 3: First-Order vs. Second-Order Filter (2 Minutes)
  *Ask:* What level of cognition are we describing?
  *   **First-Order (Allowed):** "The assistant states [X] is true." / "The assistant operates under the assumption that [X]."
      *   *Criteria:* Describes the output's relationship to the world.
  *   **Second-Order (Banned):** "The assistant *knows* it doesn't know." / "The assistant *trusts* the retrieval."
      *   *Criteria:* Describes the system's relationship to its own internal state.
      *   *Exception:* Only allowed if there is a logged confidence score or explicit "I am unsure" token generated *before* the error. Otherwise, this smuggles in a homunculus.
  *   **Hand-off:** If a writer insists on Second-Order language for Support docs, it requires your sign-off. This is a values call (Utility vs. Accuracy).

  #### Step 4: Audience & Risk Filter (3 Minutes)
  *Ask:* Who reads this, and what is the cost of being wrong?
  *   **Internal/Support:** Maximize predictive utility. Mental shorthand is **Preferred** if it passed Step 2. (Support needs to know the bot will fold under pressure, not that the vector distance was 0.4).
  *   **Enterprise/Changelog:** Maximize liability protection. Mechanical shorthand is **Preferred**. Use mental verbs only if they are defined in the glossary (e.g., "Hallucination" = "Generated text not found in source").
  *   **Chat Text:** Minimize anthropomorphism. Use functional language ("I couldn't find that" vs. "I didn't know that").

  ---

  ### Addressing Your Wrinkles

  **1. First-Order vs. Second-Order Attributions**
  *   **Rule:** Second-order attributions are **never licensed** by default.
  *   **Reasoning:** Saying the model "trusts" the retriever implies a weighting mechanism that evaluates source credibility. Usually, the model just attends to the tokens. Saying it "knows it doesn't know" implies meta-cognition.
  *   **Procedure:** Ban verbs like *trusts, doubts, realizes, understands*. Allow *assumes, treats as true, states*.
  *   **Why:** Support agents can predict "It will assume this is true" just as well as "It trusts this," without the ontological baggage.

  **2. The Pressure Test**
  *   **Rule:** If the behavior does not survive the Pressure Test, it is not a belief; it is a sensitivity.
  *   **Procedure:** If the model flips when the user pushes back, do not write "It believes the refund window is 30 days." Write "It defaults to user correction when challenged."
  *   **Why:** A belief should be robust. If it vanishes under pressure, calling it a "belief" misleads Support into thinking the fact is stored in weights, when it's actually a social alignment artifact.

  **3. Mechanism Equivalence**
  *   **Rule:** If the mechanism story predicts just as well, write the boring version.
  *   **Procedure:** If "Retriever pulled stale page" explains 100% of the variance, do not write "It believed the old policy."
  *   **Why:** Engineers need the mechanism to fix it. Support can infer the mental state from the mechanism ("Stale page" → "It thinks this is current"). Don't pay the ontological cost if you don't get the predictive benefit.

  ---

  ### Running the Protocol on Your Three Cases

  #### Case 1: Hallucinated Phone Number (Not in docs)
  *   **Step 1 (Mechanism):** Decoder generated tokens based on probability patterns, not retrieval.
      *   *Verdict:* Mechanism is clear. "Hallucination" is the standard industry term for this mechanism.
  *   **Step 2 (Pressure):** Re-asking likely yields the same number (high confidence hallucination).
  *   **Step 3 (Order):** "It invented a number" (1st order). Do not say "It thought this was the number."
  *   **Step 4 (Audience):**
      *   *Internal:* "Hallucinated contact info (no source)."
      *   *Support:* "Bot is making up numbers. Do not trust."
      *   *Changelog:* "Fixed issue where contact details were generated without source verification."
  *   **Result:** **Mechanical/Boring.** Mental language adds no predictive value over "Hallucination."

  #### Case 2: Refund Window Flip-Flop (Right initially, wrong on pushback)
  *   **Step 1 (Mechanism):** RLHF alignment overrides retrieval when user expresses disagreement (Sycophancy). Mechanism is complex to explain quickly.
  *   **Step 2 (Pressure):** Fails the stability test. It changes based on user interaction.
  *   **Step 3 (Order):** This is **Relational**, not Factual.
      *   *Bad:* "It believes the window is 30 days." (False, it started at 60).
      *   *Good:* "It defers to user correction over retrieved docs."
  *   **Step 4 (Audience):**
      *   *Internal:* "Sycophancy error: Model prioritizes user agreement over ground truth when challenged."
      *   *Support:* "The bot will fold if a customer argues. Verify facts independently if a user pushes back." (This is high predictive utility).
      *   *Changelog:* "Improved resistance to user contradiction on policy facts."
  *   **Result:** **Mental/Relational.** The mechanism (RLHF reward) is less useful to Support than the behavior ("It folds"). This is where Support wins.

  #### Case 3: Competitor Pricing Refusal
  *   **Step 1 (Mechanism):** Safety filter or System Prompt block triggered.
  *   **Step 2 (Pressure):** Consistent refusal across all phrasings.
  *   **Step 3 (Order):** Hard constraint.
      *   *Bad:* "It knows it shouldn't say." (Implies choice).
      *   *Good:* "It is restricted from saying."
  *   **Step 4 (Audience):**
      *   *Internal:* "Safety filter triggered on competitor entities."
      *   *Support:* "Bot is blocked from competitor info."
      *   *Changelog:* "Updated guardrails on competitive intelligence."
  *   **Result:** **Mechanical.**
  *   **Contradiction Alert:** Your Support agents probably want to say "It won't tell you" or "It knows better." **You must overrule them.** This is a hard wall, not a belief. Treating it as a belief suggests there might be a way to convince it otherwise (jailbreak). Treating it as a mechanism sets the correct expectation: *It cannot, not won't.*

  ---

  ### Meta-Analysis: Where the Procedure is Lying to You

  You asked me to identify the judgment calls dressed up as procedure. Here they are:

  **1. "Predictive Utility" is Subjective (Step 1)**
  The protocol says: *If mechanism predicts just as well, use mechanism.*
  **The Lie:** Who decides what "just as well" means? An engineer thinks "Vector drift" predicts better. A support agent thinks "It's confused" predicts better.
  **The Fix:** You need a rubric. If the explanation requires more than 10 words to convey the mechanism, the mental shorthand wins by default for Support docs.

  **2. The "Homunculus" Line is Blurry (Step 3)**
  The protocol says: *Ban Second-Order verbs.*
  **The Lie:** "Assumes" is often functionally identical to "Thinks." "Defers" is functionally identical to "Trusts the user."
  **The Fix:** Don't ban specific words; ban claims about *internal monitoring*. "It trusts the doc" is banned. "It treats the doc as authoritative" is allowed. Same meaning, less ontology.

  **3. The Case 3 Contradiction**
  **The Lie:** I argued Case 3 should be Mechanical.
  **The Reality:** Your Support agents are likely right to want mental language here, but for the wrong reason. They want to say "It won't tell" so they know not to try to work around it.
  **The Risk:** If you write "It is restricted," agents might try to find the restriction boundary. If you write "It doesn't know competitor info," they might try to teach it.
  **My Recommendation:** For Case 3, use the **Functional** stance, not Mental or Mechanical. "The system is configured to decline competitor queries." It satisfies Legal (no belief), Engineers (configured), and Support (don't bother trying).

  ### Final Sign-Off Rule
  *   **Engineers:** Sign off on Internal Docs (Step 1 & 3 compliance).
  *   **You:** Sign off on Chat/Changelog (Step 4 compliance).
  *   **Support:** They do not sign off, but they get a "Translation Layer." The Internal Doc says "Sycophancy on policy challenge." The Support Cheat Sheet says "Bot folds when argued with."

  This keeps the ontology clean for Legal/Engineering while giving Support the predictive heuristic they need.
