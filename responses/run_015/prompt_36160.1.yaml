answer: |-
  # Joint Statement on the Normative Force of Pragmatic Arguments for Expected Utility Theory

  **Authors:** [Advisor Name] & [Student Name]
  **Date:** October 26, 2023
  **Context:** Appendix to Dissertation Chapter 3 / Working Paper Preamble

  ## 1. Agreed Claims: Formal Machinery and Definitions

  We agree on the following formal definitions, theorems, and structural limitations regarding the pragmatic arguments surrounding Expected Utility Theory (EUT).

  1.  **Distinction between Dutch Book and Money Pump:**
      *   A **Dutch Book** argument is synchronic. It demonstrates that an agent with betting quotients violating the probability axioms accepts a set of bets that guarantee a net loss in every possible state of the world.
      *   A **Money Pump** argument is diachronic. It demonstrates that an agent with preferences violating structural axioms (typically Transitivity or Independence) can be led through a sequence of trades or choices that leave them strictly worse off (by their own initial lights) than where they started, often having paid transaction costs to return to their original state.

  2.  **Assumptions of Representation Theorems:**
      *   We agree that standard representation theorems (e.g., Savage, von Neumann-Morgenstern) are biconditionals. They show that *if* an agent's preferences satisfy a specific set of axioms (Completeness, Transitivity, Independence, Continuity), *then* those preferences can be represented as maximizing expected utility relative to some probability and utility function.
      *   We agree that the theorems themselves do not dictate which axioms are normatively mandatory. The normative force must come from external arguments (e.g., pragmatic arguments) claiming that violating an axiom renders an agent irrational.

  3.  **The Role of Iteration and Framing:**
      *   We agree that Money Pump arguments generally require a sequence of choices (iterated or dynamic choice scenarios). In a strictly one-shot choice scenario, an agent violating Independence (e.g., exhibiting Allais preferences) cannot be pumped *within* that single interaction.
      *   We agree that for a Money Pump to operate, the agent must typically make choices myopically (evaluating each node in a decision tree in isolation) rather than strategically (evaluating the whole tree at the root).

  4.  **Minimal Coherence Conditions:**
      *   We agree that vulnerability to a standard Money Pump implies a violation of **acyclicity** in revealed preference over outcomes available at the terminal nodes of the choice tree.
      *   We agree that avoiding a sure loss (Dutch Book) or a sure loss of welfare (Money Pump) is a *pro tanto* rational requirement. No rational agent *wants* to be exploited if they can avoid it without cost.

  5.  **Limitations of the "Bookmaker":**
      *   We agree that the existence of a malicious bookmaker is not necessary for the argument to hold. The irrationality lies in the *vulnerability* to exploitation, not the actual occurrence of exploitation. However, we acknowledge that the presence of foresight changes the status of vulnerability.

  ## 2. Statement of Disagreements

  The following statements characterize our divergent interpretations of the normative implications of the claims above. Each statement is phrased to be endorsed by the holder of the view.

  **[Advisor's Position: The Full-Strength Coherence View]**
  > "The pragmatic arguments establish that the axioms of EUT (specifically Independence and the Sure-Thing Principle) are constitutive requirements of instrumental rationality. While Money Pumps rely on dynamic choice, the defect they reveal is not merely myopia; it is a fundamental inconsistency in the agent's valuation of gambles across time. An agent who violates Independence holds preferences that are inherently unstable. Even if the agent anticipates the pump, the fact that their future self would *choose* to deviate from their current plan indicates a defect in agency. Rationality requires that one's preferences be robust against dynamic inconsistency, regardless of whether a bookmaker is actually present. Therefore, coherence machinery does not just establish thin acyclicity; it vindicates the full structure of EUT."

  **[Student's Position: The Weak-Coherence View]**
  > "The pragmatic arguments establish only that agents must avoid *actual* sure losses in environments where they lack control over their future choices or information. They do not vindicate the full axioms of EUT. Specifically, violations of Independence (such as Allais preferences) are only pumpable under conditions of myopic choice. An agent who chooses **resolutely** (sticking to a plan formed at the root of the decision tree) or who can **precommit** is not vulnerable to the pump, even while retaining Allais preferences. Therefore, the pragmatic arguments fail to show that Independence is a requirement of rationality *simpliciter*; they only show it is a requirement for *myopic* agents. The substantive axioms of EUT require substantive ethical or decision-theoretic justification, not merely protection from bookmakers."

  ## 3. Cruxes: Empirical and Conceptual Tests

  We have identified two specific cruxes where our disagreement bears on concrete cases. We record our predictions below to clarify what evidence or argumentation would shift our views.

  ### Crux A: The Resolute Chooser
  **The Issue:** Does the capacity for resolute choice (McClennen 1990) neutralize the normative force of the Money Pump?
  **The Case:** An agent with Allais preferences faces a dynamic choice tree where a Money Pump is possible *if* they choose myopically. The agent recognizes this at $t_0$, forms a plan to avoid the pump, and at $t_1$ executes the plan despite their local preferences at $t_1$ favoring the deviation.
  **Question:** Is this agent irrational?

  *   **[Advisor] Prediction:** Yes. The agent is irrational because their preferences at $t_1$ conflict with their plan at $t_0$. Resolute choice is merely a psychological workaround that masks the underlying normative defect (dynamic inconsistency). The agent is effectively "at war with themselves."
  *   **[Student] Prediction:** No. The agent is rational. They have successfully coordinated their agency over time to achieve their preferred outcome. The fact that local preferences shift does not imply irrationality if the global plan is executed. The Money Pump argument fails here because the loss is avoided.

  **Condition for Resolution:** If we can agree on a definition of "agency" that either rules resolute choice as impossible (Advisor wins) or rules it as a valid mode of rational action (Student wins).

  ### Crux B: The Single-Shot Allais Choice
  **The Issue:** Does the vulnerability to a pump in a *hypothetical* iterated scenario condemn the preference in a *real* one-shot scenario?
  **The Case:** An agent faces a single, one-off decision (e.g., a unique medical treatment choice) structured as an Allais gamble. There is no possibility of a sequence of trades.
  **Question:** Is the agent irrational for choosing the Allais option that violates Independence, given that no pump can physically occur?

  *   **[Advisor] Prediction:** Yes. Rationality is about the structure of preferences, not the contingencies of the environment. The fact that a pump *would* occur *if* the situation were iterated reveals that the preference structure itself is flawed, even if the iteration never happens. The defect is intrinsic to the preference ordering.
  *   **[Student] Prediction:** No. Rationality is context-sensitive. If the environment does not support iteration, the pragmatic reason for adopting EUT vanishes. The preference is only irrational in environments that allow exploitation. In a one-shot case, the Allais preference is permissible.

  **Condition for Resolution:** Agreement on whether rational norms are **intrinsic** (dependent only on the agent's mind) or **extrinsic** (dependent on the agent's environment/ecology).

  ## 4. Identification of Verbal Disputes

  We acknowledge that a portion of our disagreement stems from terminological divergences. We agree to flag these explicitly to prevent them from obscuring substantive issues.

  1.  **"Coherence":**
      *   **Advisor** uses "Coherence" to mean *compliance with the axioms of EUT*. For the Advisor, "incoherent preferences" is synonymous with "non-EUT preferences."
      *   **Student** uses "Coherence" to mean *internal consistency sufficient to avoid sure loss in the actual choice context*. For the Student, one can be coherent (avoid loss) without satisfying EUT axioms (via resoluteness).
      *   **Resolution:** In this dissertation, we will distinguish between **EUT-Coherence** (Advisor's usage) and **Exploitability-Coherence** (Student's usage).

  2.  **"Rational Requirement":**
      *   **Advisor** treats "Rational Requirement" as a **categorical imperative**. If an argument shows a preference leads to inconsistency, it is forbidden, full stop.
      *   **Student** treats "Rational Requirement" as a **hypothetical imperative**. If you want to avoid exploitation in a dynamic market, you must satisfy EUT. If you do not care about that market, the requirement does not bind.
      *   **Resolution:** We will specify whether a claim is categorical or hypothetical in each instance.

  3.  **"Vindication":**
      *   **Advisor** claims the representation theorems **vindicate** EUT by showing it is the *only* coherent system.
      *   **Student** claims the theorems only **characterize** EUT, and vindication requires separate normative premises.
      *   **Resolution:** We will use "Vindication" only when referring to the combination of the formal theorem *plus* the pragmatic premise that "vulnerability to sure loss is the sole test of rationality."

  ***

  **Signed,**

  _________________________ (Advisor)

  _________________________ (Student)
