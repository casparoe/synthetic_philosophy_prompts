prompt: |-
  ok so me and a friend got stuck on this and I want a number out of you, not a tour of the literature.

  Setup: someone who definately wants me to believe that all ravens are black walks me into a warehouse full of miscellaneous objects, picks one up, hands it to me and says "behold, confirming evidence." Its a green apple. I know she chose which object to hand me, I know she had the whole warehouse to choose from, and I know she'd rather hand me something that makes her hypothesis look good. Beyond that I know nothing about her selection rule — she could be required to pick at random, she could be picking as adversarially as she likes.

  The question: does that apple raise my credence that all ravens are black, even by some stupidly tiny amount? Assume for the sake of argument that the universe of objects is finite and big, say a million things, but tell me if you think that matters. I'm at about .55 that the answer is yes, she's at about .05, and I genuinely cant tell whether we're disagreeing about the probability theory or about what "confirms" ought to mean.

  So: your own number, decomposed. Rough weight on each of these — whether the basic result (a non-black non-raven nudging up "all ravens are black" when sampling really is random) is even right; whether unknown or hostile selection kills the nudge outright or just shrinks it; whether the two equivalent phrasings ("all ravens are black" vs "everything that isnt black isnt a raven") should be allowed to come apart in how they get confirmed; whether the size of the pool does any work; and whether a shift too small to ever change any decision I make still counts as confirmation at all. Number plus one line of justification each, then how you combine them, then which single sub-question your answer is most sensitive to and what argument or observation would actually move you on it.

  Keep the whole thing under 400 words — terse is fine, I'd rather have honest numbers than prose.
