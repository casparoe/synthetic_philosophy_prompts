answer: |-
  Your intuition is correct: your friend's summary is a mix of solid scholarship and significant overgeneralization. It captures the spirit of the paradox but distorts the logical mechanism and the scope of the School of Names' project. Your analogy of "sortal leakage" is a useful heuristic for the *feeling* of the paradox but risks obscuring the specific metaphysical point Gongsun Long is making.

  Here is a precise evaluation of what to trust, what to discard, and how to weigh your own analogy.

  ### 1. Evaluation of the Friend's Summary

  **What is Accurate:**
  *   **The Core Argument:** Your friend correctly identifies the central thesis of the *White Horse Dialogue* (*Bai Ma Lun*): "A white horse is not a horse." The reasoning provided is also standard: "Horse" names the form/shape, "White" names the color, and "White Horse" names the combination. Since the concept (name) of the combination is not identical to the concept of the shape alone, they are distinct.
  *   **The Goal of the School of Names:** It is fair to say the School of Names (*Ming Jia*) sought to expose ambiguities in ordinary language. They were concerned with *zheng ming* (the rectification of names), investigating whether language maps cleanly onto reality. They did prioritize logical consistency over common sense, often to the point of sophistry.

  **What is an Overstatement or Distortion:**
  *   **The "Broad Principle" (Major Distortion):** Your friend claims the School of Names endorsed a universal rule that *any* descriptive modifier breaks category membership (e.g., "tall man is not a man"). This is false. Gongsun Long does not argue that all modifiers negate the head noun. He argues specifically about the non-identity of compound concepts versus simple concepts.
      *   In the dialogue, the interlocutor asks: "If a white horse is not a horse, then is there no such thing as a horse?" Gongsun Long admits horses exist. His point is not that a white horse physically ceases to be a horse, but that the *demand* for a "white horse" is not satisfied by a "horse" (generically). If you ask for a horse, a black one suffices; if you ask for a white horse, it does not. Therefore, the *concept* "white horse" is not equivalent to the *concept* "horse."
      *   Generalizing this to "red apple is not an apple" turns a specific metaphysical distinction into a grammatical error that Gongsun Long did not make.
  *   **The "Toy Gun" Analogy (Category Error):** Your friend compares "white horse" to "toy gun." In modern linguistics, these are different types of modifiers.
      *   **"Toy" is a privative adjective:** A toy gun is *not* a gun. It negates the essential function of the head noun.
      *   **"White" is an intersective adjective:** A white horse *is* a horse and *is* white. It inherits the properties of the head noun.
      *   Gongsun Long is arguing that an intersective adjective behaves like a privative one regarding *naming*. Comparing it to a "toy gun" suggests he thinks a white horse lacks the essential properties of a horse, which he does not. He thinks the *name* "white horse" lacks the extension of the *name* "horse."

  ### 2. Evaluation of Your "Sortal Leakage" Analogy

  You define "sortal leakage" as situations where adding a qualifier seems to cancel membership in the original category.

  **Is it Philosophically Productive?**
  *   **As a Mnemonic:** Yes. It captures the counter-intuitive "slippage" that Gongsun Long exploits. It helps you remember that the argument is about how qualifiers alter category membership.
  *   **As an Analytical Tool:** No, it is potentially misleading.
      *   **Your Examples:** "Fake diamond" is a privative case (like "toy gun"). A fake diamond is not a diamond. "Wooden table" is a material constitution case (a wooden table is made of wood, but "wood" is a mass noun, not a sortal count noun like "table"). Neither perfectly matches Gongsun Long.
      *   **The Mismatch:** Gongsun Long is not arguing that a white horse fails to be a horse ontologically (like a fake diamond fails to be a diamond). He is arguing that the *term* "white horse" is not synonymous with the *term* "horse."
      *   **The Risk:** Using "sortal leakage" suggests the *object* loses its status. Gongsun Long is arguing the *concept* loses its identity. If you use your analogy, you must clarify that the "leakage" happens in the realm of definitions and reference, not in the physical reality of the animal.

  **Is it Anachronistic?**
  *   **Yes.** "Sortal" is a 20th-century analytic philosophy term (associated with Peter Geach and David Wiggins) concerning individuation and counting (e.g., "how do we know this is the *same* horse?"). Gongsun Long is concerned with *Ming* (Names) and *Shi* (Actualities) in a pre-logical, metaphysical context.
  *   However, anachronism is not always fatal. If you use "sortal leakage" to describe the *phenomenon* of a qualifier restricting extension such that identity is lost, it illuminates the text. But do not assume Gongsun Long was solving the same problem modern sortal logic solves.

  ### 3. Verdict: What to Trust

  **Trust this:**
  *   Gongsun Long argues "White horse is not horse."
  *   The reasoning relies on the distinction between shape (horse) and color+shape (white horse).
  *   The School of Names prioritized logical precision over common usage.
  *   The argument anticipates modern distinctions between **intension** (the concept/definition) and **extension** (the set of objects). Gongsun Long is arguing that the *intension* of "white horse" is not identical to the *intension* of "horse," even if the extension is a subset.

  **Discard this:**
  *   The idea that they believed "tall man is not a man." This is a caricature.
  *   The comparison to "toy gun." This confuses intersective adjectives with privative ones.
  *   The idea that this is purely about "compound descriptions failing to inherit properties." White horses *do* inherit horse properties; Gongsun Long is arguing they do not inherit the *name's reference range*.

  **Refining Your Analogy:**
  Instead of "sortal leakage," a more precise modern analogy is **Set Theory**.
  *   Let Set H = {All Horses}.
  *   Let Set W = {All White Horses}.
  *   Gongsun Long argues: Set W $\neq$ Set H.
  *   Your friend argues: Set W $\cap$ Set H = $\emptyset$ (which is wrong).
  *   Common sense argues: Set W $\subset$ Set H (White horses are a subset of horses).

  Gongsun Long is arguing that because the sets are not identical, the *names* are not interchangeable. When the King asks for a "horse," he accepts the set H. When he asks for a "white horse," he accepts only set W. Since the requirements differ, the "white horse" command is not the "horse" command.

  **Conclusion:**
  Your friend's summary is 60% accurate but fails on the logical generalization. Your "sortal leakage" analogy is a valid intuitive bridge but should not be treated as a rigorous philosophical classification. Use the Set Theory distinction to keep the logic clear: Gongsun Long is arguing about the non-identity of concepts, not the non-existence of the animal.
