answer: |-
  This is a sophisticated puzzle because your intuitions are actually more consistent than you think. Your tentative rule ("Fairness vs. Good Outcomes") fails because it assumes lotteries *can't* produce good outcomes. But as you noted, juries and veto chambers are explicitly designed to produce good outcomes (justice, stable legislation); they just use randomness as the *mechanism* to get there.

  Here is a single principle that aligns with almost all your verdicts, explains why your tentative rule felt off, and resolves the "qualified pool" dilemma.

  ### The Principle: **Discriminatory Duty vs. Impartial Representation**

  **The Rule:** Drawing lots is legitimate when the goal is **Impartiality, Burden-Sharing, or Tie-Breaking.** It is illegitimate when the role carries a **Duty to Discriminate** based on merit or requires **Electoral Accountability.**

  Let's break down why this fits your data better than "Fairness vs. Outcomes."

  #### 1. Where Lotteries Are "Fine" (No Duty to Discriminate)
  *   **Chores/Minutes:** These are **Burdens**. There is no merit to be judged. The goal is fair distribution of pain.
  *   **Kidney/School Places:** These are **Tie-Breakers**. In the kidney case, medical merit is identical. In school places, often proximity is the merit, and the lottery breaks the tie within the zone. There is no *further* discrimination possible or desired.
  *   **Juries:** The goal is **Impartial Representation**. We do not want a jury of "expert judges" (maximizing outcome via skill); we want a jury of peers (maximizing outcome via legitimacy and lack of bias). The "good outcome" comes from the *process* of deliberation, not the pre-selected wisdom of the jurors.
  *   **Veto Chamber:** This is **Impartiality + Limited Power**. Because they can only delay, not initiate, the need for electoral accountability is lowered. Their value is acting as a representative "cooling saucer," not a proactive leadership body.
  *   **Conscription:** This is **Burden-Sharing**. It prevents the burden from falling disproportionately on the poor (as it does in volunteer armies).
  *   **Tax Audits:** This is **Deterrence via Unpredictability**. You aren't selecting the "worst" taxpayers; you are selecting a sample to ensure compliance across the board.

  #### 2. Where Lotteries Are "Not Fine" (Duty to Discriminate/Account)
  *   **Professorship:** This is a **Duty to Discriminate**. A search committee is hired specifically to distinguish between candidates. Even if they are "rated equal," the professional duty is to find the marginal differences. Using a coin here feels like **abdication of judgment**. You are paid to judge; flipping a coin says "we refuse to do our job."
  *   **Whole Legislature:** This breaks **Electoral Accountability**. If representatives are chosen by lot, voters cannot punish or reward them for policy decisions. Governance requires a chain of responsibility that randomness severs.
  *   **Jury Striking:** This **Corrupts Impartiality**. It takes a representative sample and biases it. It violates the principle of why the lottery was there in the first place.
  *   **Flawed Citizens' Assembly:** This is **Failed Representation**. If attrition biases the sample, it is no longer a lottery; it is a self-selected group. It fails the "Impartial Representation" test.

  ### Why Your Tentative Rule Failed
  You thought: *Lotteries = Fairness, Elections = Good Outcomes.*
  The Correction: *Lotteries = Fairness/Impartiality, Elections = Accountability/Merit.*

  Juries and Veto Chambers prove that lotteries *can* aim for good outcomes. They just aim for them through **structural impartiality** rather than **individual expertise**. Your gut correctly identified that juries need to work well, but your rule couldn't explain why a "fair" method was being used to get a "good" result.

  ### The Verdict on the "Qualified Pool" Case
  *Filling a role by lot from among everyone who already passed a competence threshold.*

  Your hesitation here is the most important part of this exercise. The Principle of Discriminatory Duty forces a specific distinction: **Is the role about Sufficiency or Maximization?**

  1.  **If the role is about Sufficiency (Legitimate):**
      *   *Example:* Visas for skilled workers, or perhaps a pool of on-call doctors for night shifts.
      *   *Logic:* Once the threshold is met, the marginal utility of distinguishing between "good" and "great" is low compared to the benefit of removing bias. The duty is to ensure *competence*, not to find the *singular best*.
      *   *Verdict:* **Fine.**

  2.  **If the role is about Maximization (Illegitimate):**
      *   *Example:* The Professorship you mentioned, or a CEO role.
      *   *Logic:* Even among the "qualified," there are meaningful gradients of skill that impact the outcome. The institution has a duty to find the *best*, not just *a safe pair of hands*.
      *   *Verdict:* **Not Fine.**

  **My prediction for your gut:** You will likely find this case "Fine" if the role is viewed as a **public service** (like jury duty) or a **scarce benefit** (like a visa), but "Not Fine" if the role is viewed as a **position of leadership** where individual agency drives success.

  ### The One Verdict You Might Need to Drop
  If you adopt this principle, the verdict you may have to reconsider is the **Professorship (Finalists Rated Equal)**.

  Philosophers like John Broome argue that if candidates are *truly* equal in merit, fairness *demands* a lottery. If you choose Candidate A over Candidate B when they are equal, you are treating A as more important than B without justification.
  *   **Your current view:** It feels like refusing to make a judgment.
  *   **The Principle's view:** If they are *actually* equal, there is no judgment left to make. Persisting in trying to find a difference introduces bias (e.g., liking someone's personality more).
  *   **The Compromise:** Your intuition is likely reacting to the *reality* that they are rarely actually equal. In the real world, "rated equal" usually means "we are too tired to distinguish." If you assume the equality is genuine, the lottery is the only fair option. If you assume the equality is an artifact of lazy evaluation, the lottery is illegitimate.

  ### Summary
  Your gut is consistent. You support lotteries when they **prevent bias, share burdens, or break ties.** You oppose them when they **evade responsibility, break accountability, or ignore meaningful merit.**

  The "Qualified Pool" case is legitimate **if and only if** the institution accepts that "competent enough" is the goal, rather than "the absolute best." If the goal is the latter, the lottery returns to being an abdication of the duty to discriminate.
