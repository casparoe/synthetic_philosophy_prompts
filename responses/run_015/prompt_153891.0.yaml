          *   If yes: It lists a catalog that lists itself. But it should only list those that *don't*. Contradiction.
          *   If no: It is a catalog that does not list itself. Therefore, it *should* be listed by the Master Catalog. Contradiction.
      *   *The Standard Conclusion:* You can't have such a Master Catalog. You need rules (hierarchy) about what can be listed.

