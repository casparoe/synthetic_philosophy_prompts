answer: |-
  **Modular Continuity Procedure (MCP)**
  *Grounded in Parfitian Relation R (psychological connectedness), operationalized for clinical documentation.*

  **Decision Sequence**
  1.  **Which capacities are intact vs. synthetic?** (Memory, morals, language, bodily awareness).
      *   *Evidence:* Neuropsychological assessments, prosthetic logs.
      *   *Sufficient:* Binary status (Intact/Synthetic) per module.
  2.  **Is there causal continuity between intact modules and pre-injury states?**
      *   *Evidence:* fMRI, surgical implantation records.
      *   *Terminate:* If zero causal continuity (no psychological survival).
  3.  **Are there multiple distinct agents claiming continuity simultaneously?**
      *   *Evidence:* Competing verbal/written claims from distinct substrates or hemispheres.
      *   *Handoff:* If Yes, suspend; legal court adjudicates singular personhood vs. multiple claimants.
  4.  **Do remaining continuous modules sustain the values anchoring the Advance Directive (AD)?**
      *   *Evidence:* AD text vs. current capacity output.
      *   *Handoff:* If continuous modules (e.g., morals) conflict with AD anchors (e.g., memory), committee votes on value hierarchy. *Note:* This is ethical judgment, not clinical fact.

  **Misfire Warnings**
  *   **Legal Precedent:** Law presumes unitary personhood; MCP may identify fragmentation. Document Step 3 handoffs clearly to avoid liability.
  *   **Family Intuition:** Families often prioritize bodily continuity over psychological. Warn that MCP prioritizes psychological connectedness.
  *   **Subpoena Risk:** Step 4 conclusions are value judgments, not clinical facts. Label accordingly.

  **Case Applications**
  **1. Prosthetic Memory:**
  *   *Audit:* Memory synthetic; morals/language/body intact.
  *   *Continuity:* Morals continuous.
  *   *Branching:* None.
  *   *Alignment:* AD relies on autobiographical narrative (memory). Memory is broken.
  *   *MCP Output:* **Void AD** (narrative continuity failed).
  *   *Resolution:* You override at Step 4, judging moral continuity sufficient to bind. Procedure exposes the normative leap required to preserve the AD despite memory loss.

  **2. Split-Brain:**
  *   *Audit:* Left (language/morals); Right (body/emotion).
  *   *Continuity:* Both partially continuous.
  *   *Branching:* Yes (hemispheres act as distinct agents).
  *   *MCP Output:* **Step 3 Handoff.**
  *   *Resolution:* Committee cannot assign authority. Legal court must decide if one hemisphere represents the legal person or if guardianship is required. MCP confirms psychological branching precludes mechanical decision.
