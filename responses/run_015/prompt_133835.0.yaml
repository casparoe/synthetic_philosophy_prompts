  ### III. The Tie-Breaker Hypothetical

  To force a clear decision between the **Formal Enumerated-Acts Rule** (which requires specific physical/biological acts) and the **Broader Structural-Destruction Rule** (which accepts cultural/social dissolution), you need a case that isolates *culture* from *physical coercion* while maintaining *intent* and *protected group status*.

  **Hypothetical Case: The Digital Archive Purge**
  *   **Demographic/Institutional Features:** A state targets a recognized ethnic minority with a distinct language and oral history tradition. The population remains physically intact in their homeland; there is no relocation, no killing, no starvation, and no child transfer. Mortality is baseline.
  *   **The Act:** The state systematically deletes all digital records, confiscates and destroys all physical books/artifacts, bans the public use of the language, and criminalizes the teaching of the group's history to children.
  *   **The Intent:** Leaked cabinet minutes state the goal is to "ensure this people ceases to remember who they are, effectively ending their existence within two generations."
  *   **The Conflict:**
      *   **Formal Enumerated-Acts Rule:** **Not Genocide.** None of the five acts in the UN Convention (killing, harm, conditions of life, birth prevention, child transfer) are present. This is "cultural genocide," which was explicitly excluded from the 1948 text.
      *   **Broader Structural-Destruction Rule:** **Genocide.** The coordinated policy aims to destroy the group's distinctive existence and continuity as a social form, fulfilling Lemkin's original definition regardless of the lack of physical violence.

  This case removes the "physical coercion" variable present in Case 1 (child transfer) and the New Case (relocation), forcing Dr. Vasquez to decide whether the *destruction of memory and culture alone* constitutes the destruction of the group.
