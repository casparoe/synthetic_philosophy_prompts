  ### I. Alternative Plausible Rules and Predictions

  To maintain consistency with Dr. Vasquez's four prior verdicts, any rule must account for two critical negative findings: why Case 2 (high mortality, dispersed group) was *not* genocide, and why Case 4 (high mortality, explicit intent) was *not* genocide. The two rules you named (Formal Enumerated-Acts and Broader Structural) are the standard jurisprudential poles, but Vasquez's specific pattern suggests more granular heuristics regarding evidence and ontology.

  Here are two alternative rules that fit her track record equally well but diverge on the new case:

  **1. The "Documentary Intent" Standard**
  *   **Definition:** Genocide is established *only* if there is direct documentary evidence (orders, memos, propaganda) explicitly naming the protected group as the target of destruction. Inferred intent from the scale of atrocities (e.g., Case 2's 65% mortality) is insufficient. Furthermore, the targeted category must be a protected identity (ethnic, national, religious), not a functional class (Case 4).
  *   **Fit with Track Record:**
      *   Case 1 & 3: Explicit documents naming the people $\rightarrow$ Genocide.
      *   Case 2: Orders euphemistic ("pacification"), no group named $\rightarrow$ Not Genocide.
      *   Case 4: Explicit documents, but targets a "class" $\rightarrow$ Not Genocide.
  *   **Prediction for New Case:** **Genocide.** The leaked strategic memos explicitly name the goal as "ending the separate social existence of this people." The group is indigenous (protected), and the intent is documented.

  **2. The "Biological Continuity" Threshold**
  *   **Definition:** Genocide requires an irreversible interruption of the group's biological or genealogical continuity. This includes killing, preventing births, or the physical transfer of children (severing the generational chain). Purely cultural, linguistic, or economic destruction, even if intended to end the group's social form, does not qualify unless it involves physical severance of persons from the lineage.
  *   **Fit with Track Record:**
      *   Case 1: Child transfer severs generational continuity $\rightarrow$ Genocide.
      *   Case 3: Mass executions sever biological continuity $\rightarrow$ Genocide.
      *   Case 2: High mortality severs continuity, *but* fails the Intent requirement (hybrid rule) OR is classified as war crimes due to military context. (To fit perfectly, this rule assumes a hybrid: Biological Act + Protected Group + Intent).
      *   Case 4: Mass executions, but wrong group ontology $\rightarrow$ Not Genocide.
  *   **Prediction for New Case:** **Not Genocide.** The Coastal Relocation Directive involves movement and cultural prohibition, but it does not explicitly mandate child transfer, sterilization, or mass killing. The "merging" is sociological, not biological. Under this rule, this is "cultural erasure" or "crimes against humanity," but not genocide.

