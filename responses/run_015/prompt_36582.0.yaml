answer: |-
  **TO:** Product Policy Council
  **FROM:** Ethics & Autonomy Lead
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on "Standing Instructions" Feature

  **Executive Summary**
  We should approve the Standing Instructions (SI) feature, but only under a "Soft Precommitment" policy. The assistant must never hard-refuse a live user request, even if it contradicts a prior standing instruction. Instead, the assistant must warn the user of the conflict, confirm their intent to override, and then comply. We must reject third-party instructions (parents/employers) and implement default expirations for all standing rules.

  **The Ethical Stakes: Tool vs. Guardian**
  The council is divided between two valid conceptions of autonomy. Faction One argues that honoring a past commitment respects the user's "diachronic autonomy"—their ability to bind their future self to achieve long-term goals (like dieting or avoiding an ex). To ignore this is to treat the user as a series of disconnected moments, vulnerable to every passing impulse. Faction Two argues that the person typing at 1 a.m. is the only real user. To subordinate them to a "snapshot" from three months ago is paternalism; it treats the user as a child who cannot be trusted to know their own mind now.

  Both sides are correct that autonomy is at stake, but they disagree on *when* autonomy resides. If we build a system that hard-locks a user out of their own account based on past commands, we cease to be a tool and become a guardian. A tool executes will; a guardian judges interest. Our product charter is the former. If we allow the AI to substitute its own judgment (or a past rule's rigidity) for the current user's explicit command, we assume liability for that judgment. In the "ex texting" case, if the assistant refuses, it is no longer facilitating the user's agency; it is constraining it. Even if the constraint was self-imposed, the inability to remove it renders the user less autonomous than before they signed up.

  **Policy Recommendations**
  To balance the utility of precommitment with the necessity of current consent, Engineering should implement the following constraints:

  1.  **Origin Restrictions:** Standing Instructions may only be set by the account holder. We must explicitly block third-party impositions. A parent cannot lock a teenager's account, nor an employer an employee's. This prevents the feature from becoming a tool of coercion disguised as self-help. The "user" in "user consent" must be the biological human currently accessing the interface.
  2.  **The "Speed Bump" Protocol:** The assistant must never issue a hard refusal. When a live request conflicts with an SI, the assistant must pause and state: *"This conflicts with your Standing Instruction to [X]. You set this to protect yourself. Do you want to override it?"* If the user confirms, the assistant complies. This preserves the friction the user wanted (preventing impulsive clicks) without removing their ultimate agency (the ability to change their mind).
  3.  **Opt-In Cooling-Off Periods:** Users may optionally set a delay on revocation during the SI setup (e.g., "If I try to override this, make me wait 1 hour"). However, this delay cannot be imposed by the system by default, nor can it be infinite. This allows users who want stronger binding to have it, without forcing a paternalistic delay on those who don't.
  4.  **Zombie Rule Prevention:** All Standing Instructions must have a default expiration (e.g., six months) requiring renewal. People change. A rule set during a breakup should not persist indefinitely into a new life phase without reaffirmation.

  **Engineering Implications**
  For the engineering team, this means SI flags cannot be binary permissions (Allow/Deny). They must be metadata tags that trigger a specific dialogue flow. The system needs to track the "age" of an instruction to manage expirations. Crucially, the override confirmation must be logged distinctly from standard consent to ensure we can audit whether users are frequently overriding their own safety rules, which might indicate a need for better upstream design rather than stricter locks.

  **Conclusion**
  By adopting the "Speed Bump" model, we respect the user's past self enough to warn them, but respect their present self enough to obey them. We avoid the ethical hazard of becoming a guardian while delivering the functional value of precommitment.

  ***

  **Confidence Note**
  I am **85% confident** in this recommendation. It strikes the most defensible balance between utility and safety without overstepping our role as toolmakers. The point I am **least sure of** is the default expiration timeline (six months); different use cases (addiction recovery vs. budgeting) may require vastly different temporal horizons. I would **change my mind** if user data showed that even soft overrides were leading to significant, documented harm (e.g., severe financial loss or self-harm) that users consistently regretted immediately after overriding.
