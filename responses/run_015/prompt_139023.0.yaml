answer: |-
  1. The mechanism inputs acoustic and spatial novelty signals to output heightened hemispheric arousal, trading the cost of lost sleep against the catastrophic cost of failing to detect a novel predator during displacement. Ignoring conscious safety information is a predicted feature because the switch operates on subcortical novelty detection faster than cortical risk assessment can override it.

  2. First, subjects should exhibit faster reaction times to irregular acoustic stimuli on the first night compared to regular stimuli, unlike general stress which would slow all reactions. Second, pharmacological suppression of cortical processing should not eliminate the asymmetry, whereas suppressing subcortical novelty detection should.

  3. The post-hoc charge fails because the hypothesis predicts specific acoustic reaction profiles not contained in the original data set, while ancestral specifics are unnecessary because the mechanism relies on universal novelty detection. A by-product story cannot easily explain the metabolically costly hemispheric asymmetry without invoking a functional selector.

  4. The work is done by the asymmetric vigilance threshold, which specifies that only one hemisphere enters high-alert mode during novelty exposure. Removing this specificity reduces the claim to a generic "stress causes bad sleep" narrative that fits any outcome equally well.

  5. A skeptic should argue that hemispheric asymmetry is merely a physiological habituation curve unrelated to threat detection. The honest reply is that habituation alone does not predict asymmetry, but the hypothesis falls if asymmetry persists when novelty is presented without any possibility of environmental displacement.
