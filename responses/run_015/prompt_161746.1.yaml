prompt: |-
  I write a weekly column for a science-and-ideas magazine, about 800 words, pitched Monday and filed Wednesday, and an editor who is very smart but not a philosopher has to sign off on the headline. I recieve maybe one paper a month from the cross-cultural "experimental philosophy" literature — give people a vignette in two or more countries and see whether they answer differently: Gettier cases, the chairman-and-the-environment style of case, trolley stuff. These pieces always do numbers and always get over-read. I publish "people in X answer differently" and by the end of the week it's being passed around as "culture determines whether you think Y." I want to stop guessing at this.

  So: give me a procedure I can run in about half an hour, on a PDF before my Monday pitch meeting, to decide (a) whether there is a story, (b) how strong a claim I'm allowed to make in the headline and lede, and (c) when I have to kill it. Ordered questions; what counts as a sufficient answer to each; where the procedure stops with a no; and — importantly — where it has to hand the decision to a person because it's not a factual question at all, e.g. how much risk of over-reading is worth a good story.

  The hard cases it has to handle, because these are the ways I've been burned: the paper says "Brazilians vs Japanese" but it tested undergraduates in two cities; the load-bearing word ("knows," "intentionally," "responsible") may not map cleanly onto the other language, and I get one email to the corresponding author with 24 hours to reply; the samples differ in years of education and in how willing they are to use the top of the scale; the effect is significant but tiny, or it's a shift in the middle of the distribution rather than a flip in which answer is modal; it's a null result being pitched as a failed replication; and the difference might be about the pragmatics of the vignette — what the subject thinks the experimenter is getting at — rather than about the concept at all. Also: my readers want to know whether any of this changes a philosophical conclusion, and there's that standing objection that folk intuitions from undergraduates were never evidence for anything in the first place. The procedure should tell me when that objection kills the story and when it's simply irrelevant to the only claim I'm making.

  I'd like an explicit claim-strength ladder: for each grade of evidence, the strongest sentance I'm allowed to write, down to "we can't say culture at all, only these two samples." Plus a rule that every such piece carries one sentence saying what would have to be true for this not to be a cultural difference.

  Then run it on three. (1) Around 150 students each in Toronto and Seoul on a Knobe-style intentionality case: the asymmetry shows up in both samples, but one sample is much less willing to say "intentionally" across the board, including for the good side effect. (2) A Gettier-vignette study in Nanjing and Edinburgh finding no difference once the question is strengthened from "knows" to something like "really knows" — decent n, pre-registered. (3) The one I've already half-pitched to my editor and really want to write: a large, careful study where the between-sample difference is real and robust, but every measured covariate on which the samples differ (English fluency, years of university, urban vs rural) also tracks the dependent variable — and my proposed headline is "Why [culture] doesn't believe in [thing]."

  Commit. Give me actual numbers where numbers are the right kind of thing — effect-size floors, n, what counts as a passed comprehension check — take a position on each of the three (write it, write it downgraded, or spike it), and tell me where your own procedure is likely to misfire. Don't hand me a menu of considerations to weigh myself; I already do that and I usually get it wrong.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Science-and-ideas magazine columnist (800 words, weekly).
      *   **Problem:** Over-interpreting cross-cultural experimental philosophy (x-phi) papers. "People in X answer differently" becomes "Culture determines Y."
      *   **Goal:** A 30-minute pre-pitch procedure (checklist/algorithm) to decide: (a) Is there a story? (b) Claim strength (headline/lede)? (c) When to kill it?
      *   **Constraints:** Needs explicit numbers/thresholds where possible. Needs to handle specific "hard cases" (WEIRD samples, translation issues, covariates, null results, pragmatics). Needs a "claim-strength ladder." Needs a mandatory "falsifier sentence." Needs to apply this to three specific cases. Needs to admit where the procedure fails.
      *   **Tone:** Decisive, pragmatic, rigorous but accessible (for a columnist), not a "menu of considerations."

  2.  **Deconstruct the Problem (The "Over-Reading" Trap):**
      *   X-phi often claims to test *intuitions* about concepts (knowledge, intentionality).
      *   Cross-cultural studies often test *undergraduates* in two cities.
      *   Confounds: Language, education, pragmatics, response biases.
      *   The "Philosophical Stakes" objection: Do folk intuitions matter for philosophy?
      *   The "Journalistic Stakes" risk: Overselling cultural determinism.

  3.  **Develop the Procedure (The "30-Minute Triage"):**
      *   *Time limit:* 30 mins means it can't be a full statistical re-analysis. It must be a heuristic filter.
      *   *Structure:* Ordered questions. Stop rules.
      *   *Key Metrics:* Sample size, Effect Size (Cohen's d or odds ratio), Covariate control, Translation protocol.
      *   *Claim Ladder:* Needs to map evidence quality to specific phrasing.
      *   *The "Kill Switch":* When the confounds overwhelm the signal.
      *   *The "Human Handoff":* Acknowledging where judgment calls (risk tolerance) are needed.

  4.  **Drafting the Procedure Steps:**
      *   *Step 1: The Sample Check.* (WEIRDness, N, Representativeness).
      *   *Step 2: The Measure Check.* (Translation, Equivalence, Scale usage).
      *   *Step 3: The Effect Check.* (Significance vs. Size, Modal shift vs. Mean shift).
      *   *Step 4: The Confound Check.* (Covariates, Education, Language).
      *   *Step 5: The Philosophical Stakes Check.* (Does this actually matter for the concept?).
      *   *Step 6: The Claim Ladder.* (Assigning the headline strength).
      *   *Step 7: The Falsifier Sentence.* (Mandatory inclusion).

  5.  **Refining the Numbers/Thresholds:**
      *   *N:* <100 per cell is risky for cross-cultural. Let's set floor at 150.
      *   *Effect Size:* p < .05 isn't enough. Need $d > 0.4$ or Odds Ratio > 2.0 for a "cultural difference" claim. Small effects are noise in this context.
      *   *Covariates:* If *all* covariates track the DV and culture doesn't add variance in regression, kill it.
      *   *Translation:* Back-translation is minimum. If no mention of it, downgrade claim.

  6.  **Developing the Claim-Strength Ladder:**
      *   *Level 1 (Strong):* "Culture shapes..." (Requires robust controls, large N, large effect).
      *   *Level 2 (Moderate):* "Samples from X and Y differ..." (Good N, significant, but confounds present).
      *   *Level 3 (Weak):* "Students in X answered differently than students in Y..." (Raw difference, potential confounds).
      *   *Level 4 (Null):* "No evidence of difference..." (Replication failure).

  7.  **Addressing the Three Cases:**
      *   *Case 1 (Toronto/Seoul Knobe):* Asymmetry exists in both, but base rates differ. This is a *scale usage* or *response bias* issue, not necessarily a conceptual difference.
          *   *Verdict:* Downgrade. It's not about intentionality concepts, it's about willingness to use the word.
      *   *Case 2 (Nanjing/Edinburgh Gettier):* Null result on "really knows." Pre-registered.
          *   *Verdict:* Write it, but frame as "Universality." The story is the *lack* of difference.
      *   *Case 3 (The "Half-Pitched" one):* Robust difference, but covariates (English, Education, Urban/Rural) track perfectly.
          *   *Verdict:* Kill it. This is the classic confound trap. The headline "Why [Culture] doesn't believe..." is lies.

  8.  **Addressing the "Human Handoff":**
      *   Where does the algorithm stop? When the risk/reward of misleading readers outweighs the traffic gain. The editor needs to know the "Falsifier Sentence" is the safety valve.

  9.  **Review against Constraints:**
      *   *30 mins?* Yes, if the paper is skimmed for specific stats.
      *   *Numbers?* Included (N=150, d=0.4).
      *   *Hard cases?* Addressed (translation, covariates, null results).
      *   *Claim Ladder?* Included.
      *   *Falsifier Sentence?* Included.
      *   *Self-Critique?* Need to admit where this procedure is too blunt (e.g., missing nuanced qualitative work).

  10. **Final Polish:**
      *   Make it punchy. The user is a writer; they want style + substance.
      *   Ensure the "Kill" decisions are firm.
      *   Check the "Human Handoff" section—it needs to be explicit about *what* decision is being handed off (risk tolerance).

  *(Self-Correction during drafting)*: I initially thought about suggesting a Bayesian check, but that takes too long. Stick to Frequentist thresholds that are easy to spot in the abstract/results. Ensure the distinction between "Conceptual Difference" and "Response Bias" is clear in Case 1. For Case 3, be ruthless. That's the one that burns columnists.

  *(Final check on the "Falsifier Sentence")*: Make sure it's actionable. "For this not to be culture, X would have to be true."

  *(Final check on Claim Ladder)*: Ensure the phrasing is distinct enough to prevent slippage.

  Let's assemble.
answer: |-
  Here is the **30-Minute X-Phi Triage Protocol**. It is designed to be run on the PDF (Abstract, Methods, Results, Discussion) before your Monday pitch. It prioritizes preventing over-claiming over finding hidden gems.

  ### Part 1: The Procedure (Ordered Questions)

  **Stop Rule:** If you answer **NO** to any question in **Section A**, kill the story immediately. If you pass Section A, proceed to Section B to determine claim strength.

  #### Section A: The Kill Switches (5 Minutes)
  1.  **Sample Size:** Is $N \ge 150$ *per cell* (per country/site)?
      *   *No:* **KILL.** (Underpowered cross-cultural work is noise.)
  2.  **Translation Protocol:** Does the Methods section explicitly mention "back-translation" or "bilingual committee review"?
      *   *No:* **KILL.** (If they don't say it, assume the load-bearing word doesn't map.)
  3.  **Comprehension:** Did they exclude participants who failed attention/comprehension checks? Is the exclusion rate $< 20\%$?
      *   *No:* **KILL.** (High exclusion suggests the vignette didn't travel.)
  4.  **The Covariate Trap:** In the regression model, does "Culture/Country" remain a significant predictor ($p < .05$) *after* controlling for Education, Age, and Gender?
      *   *No:* **KILL.** (If the difference vanishes when you control for years of schooling, it's not culture; it's schooling.)

  #### Section B: The Claim Ladder (15 Minutes)
  *Assign the highest level where all criteria are met. You must write to this level. You may write weaker, never stronger.*

  *   **Level 4 (The Universalist):** Null result in a pre-registered, high-power ($N > 200$/cell) replication.
      *   *Allowed Headline:* "Philosophical Intuition May Be Universal After All."
      *   *Allowed Lede:* "A new study finds no difference between X and Y."
  *   **Level 3 (The Sample Specific):** Significant difference ($p < .01$), $N > 150$/cell, back-translated, but covariates (education/urbanization) were not fully controlled OR effect size is small ($d < 0.4$).
      *   *Allowed Headline:* "Students in [Country A] Answer Differently Than [Country B]."
      *   *Allowed Lede:* "In a survey of undergraduates..." (Must specify *undergraduates*).
  *   **Level 2 (The Robust Difference):** Significant difference, $N > 200$/cell, covariates controlled, effect size medium/large ($d > 0.5$ or Odds Ratio $> 2.5$).
      *   *Allowed Headline:* "Cultural Context Shifts Judgments on [Topic]."
      *   *Allowed Lede:* "Evidence suggests cultural environment influences..."
  *   **Level 1 (The Conceptual Shift):** Level 2 criteria + Qualitative follow-up (interviews) confirming subjects interpreted the *concept* differently, not just the pragmatics.
      *   *Allowed Headline:* "How Culture Shapes [Concept: e.g., Knowledge]."
      *   *Allowed Lede:* "The data indicates a divergence in the underlying concept of..."

  #### Section C: The Mandatory Safeguards (10 Minutes)
  1.  **The Falsifier Sentence:** You must draft one sentence for the piece (usually near the end) that reads:
      *   *"For this difference to be purely cultural rather than a product of [Education/Translation/Pragmatics], we must assume [Specific Condition]."*
      *   *Example:* "For this difference to be purely cultural rather than a product of education, we must assume that years of schooling do not alter one's willingness to attribute intentionality."
      *   *If you cannot fill in the bracket:* **KILL.** (You don't know the confound.)
  2.  **The Philosophy Objection:** Does the paper address whether folk intuitions constrain philosophical truth?
      *   *If No:* You must add a paragraph stating: "Philosophers note that even if intuitions vary, the truth of the matter may not."
      *   *If Yes:* Summarize their position.

  #### Section D: The Human Handoff
  *This is where the procedure stops and you take the risk.*
  The procedure cannot calculate **Newsworthiness vs. Misleading Risk**.
  *   **The Decision:** If a paper hits **Level 3**, it is safe but boring. If it hits **Level 2**, it is pitchable but risky.
  *   **The Handoff:** Tell your editor: *"This is a Level 2 claim. The statistical difference is real, but the 'Culture' label relies on the assumption that education isn't the driver. I will include the Falsifier Sentence. Do we accept the risk that critics will call this reductionist?"*
  *   **Rule:** If the editor hesitates, downgrade to Level 3 or spike.

  ---

  ### Part 2: Running the Protocol on Your Three Cases

  #### Case 1: Toronto vs. Seoul (Knobe/Intentionality)
  *   **Data:** $N \approx 150$/cell. Asymmetry present in both. Base rate for "intentionally" lower in Seoul across *both* harm and help conditions.
  *   **Protocol Run:**
      *   Section A1 (N): Pass (150).
      *   Section A2 (Translation): Assume Pass (Korean/English usually robust).
      *   Section A4 (Covariates): **FAIL.** The difference is a "scale usage" shift (willingness to use the word), not a conceptual asymmetry shift. The interaction effect (the Knobe Effect) is likely constant; the main effect (culture) is response bias.
      *   Section B: Max **Level 3**.
  *   **Verdict:** **Write it Downgraded.**
  *   **Reasoning:** This is not a difference in moral psychology; it is a difference in linguistic conservatism.
  *   **Headline:** "Why Seoul Students Are Reluctant to Say 'Intentionally'." (Not "How Culture Shapes Intentionality").
  *   **Falsifier Sentence:** "For this to be a conceptual difference rather than a linguistic one, we must assume the Korean word for 'intentionally' carries the exact same pragmatic weight as the English, despite the global shift in response rates."

  #### Case 2: Nanjing vs. Edinburgh (Gettier/"Really Knows")
  *   **Data:** Null result. Pre-registered. Decent N.
  *   **Protocol Run:**
      *   Section A: Passes all Kill Switches.
      *   Section B: **Level 4** (The Universalist).
      *   Section C: Falsifier is easy ("For this to be a false negative, the vignette must have failed to trigger Gettier intuitions in both groups equally").
  *   **Verdict:** **Write It.**
  *   **Reasoning:** Null results in x-phi are rare and valuable correctives. It counters the "everything is relative" narrative your readers crave but shouldn't have.
  *   **Headline:** "The Limits of Cultural Relativism in Epistemology."
  *   **Lede:** Focus on the stability of the intuition despite cultural distance.
  *   **Philosophy Objection:** Explicitly state that universal intuition doesn't prove universal truth, but it removes the "folk disagreement" objection to traditional epistemology.

  #### Case 3: The "Half-Pitched" Study (Robust Difference, Confounded Covariates)
  *   **Data:** Large, careful study. Difference is real. But English fluency, University Years, and Urban/Rural status *all* track with the DV.
  *   **Protocol Run:**
      *   Section A4 (Covariate Trap): **FAIL.**
      *   *Condition:* "Does 'Culture' remain significant after controlling for Education/English?" You stated every measured covariate tracks the DV. If the paper claims "Culture" without a regression showing Culture adds variance *over* Education, it fails A4.
      *   *Even if regression is present:* If the samples differ fundamentally on *all* measured covariates, multicollinearity makes the "Culture" coefficient unstable.
  *   **Verdict:** **SPIKE IT.**
  *   **Reasoning:** This is the exact scenario that burns columnists. Your proposed headline ("Why [Culture] doesn't believe...") is a Level 1 claim on Level 3 data. It is factually misleading to attribute the variance to "Culture" when "Years of University" explains it just as well.
  *   **The Hard Truth:** You have already half-pitched this. You must tell your editor: *"I ran the covariate check. The effect is confounded with education and language fluency. If I write this, I am selling 'Culture' when the data says 'Schooling.' I am killing it to protect the column's credibility."*
  *   **Alternative:** If you must write something, pivot to the methodological failure of the field. "Why We Can't Separate Culture from Education." But do not run the headline you proposed.

  ---

  ### Part 3: Where This Procedure Will Misfire

  I am committing to this protocol, but I must disclose its failure modes so you know when to override it (and accept the risk).

  1.  **The "Small but Real" Effect:** The protocol kills effects with $d < 0.4$. In psychology, $d=0.2$ can be theoretically massive if it overturns a "Universality" claim. You might miss a subtle but philosophically crucial nuance because the effect size is "journalistically small."
      *   *Mitigation:* If the theoretical stakes are massive (e.g., overturning Chomsky or Kant), downgrade the claim to Level 3 but write the story.
  2.  **The Qualitative Blind Spot:** This protocol is quantitative. It favors papers with big Ns and regressions. It will systematically bias you against ethnographic or interview-based x-phi that might explain *why* the difference exists, which is often better for a column than the *that*.
      *   *Mitigation:* Once a month, ignore the protocol for a qualitative piece, but label it "Perspective" not "Study."
  3.  **The "WEIRD" Baseline:** The protocol assumes the control group (usually US/UK) is the baseline. It doesn't catch when the US sample is the outlier due to being hyper-WEIRD.
      *   *Mitigation:* In your Falsifier Sentence, always specify which group is the deviation. "For this to be cultural, we must assume the American baseline isn't the anomaly."

  ### Summary of Commitments
  1.  **No Covariate Control = No Story.** (Case 3 is dead).
  2.  **Response Bias ≠ Conceptual Difference.** (Case 1 is downgraded).
  3.  **Null Results are Stories.** (Case 2 is greenlit).
  4.  **The Falsifier Sentence is Non-Negotiable.** It forces you to admit what you don't know.
  5.  **Editor Handoff:** You do not decide risk tolerance alone. If the claim is Level 2, the editor must explicitly accept the "Culture vs. Education" ambiguity.

  Run this on Monday morning. If Case 3 fails Section A4 (it will), you save yourself a retraction email in six months.
