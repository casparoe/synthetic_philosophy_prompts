answer: |-
  C adjusted her glasses, leaning over the rigid cylinder. The gauge read 3.12 bar. "The claim is licensed," she said. "If the pressure in A had been 2.5 bar at noon, the piston would have driven left. Compartment B would have expanded, its pressure would have dropped below 3.0 bar, and the valve would have stayed shut. That is a clear chain of counterfactual dependence. The small local miracle required to lower $p_A$ doesn't backtrack; it just diverges from the actual history at noon and lets the laws run forward."

  I shook her head, tapping the port for $n_B$. "You're smuggling in an intervention without admitting it. Your 'miracle' is a surgical setting of $p_A$. But look at the handles. We have $T$ and $n_B$. If I change $T$, I raise $p_B$ directly. If I change $n_B$, I raise $p_B$ directly. There is no handle that sets $p_A$ alone. In my framework, $p_A$ is constraint-shadowed. No exogenous intervention sets it independently while holding off-path variables fixed. Without an intervention, there is no cause."

  "But the dependence is robust," C countered. "Your requirement for a handle is too strict. It makes causation hostage to human engineering. Suppose we welded this cylinder shut and thermally isolated it. No handles at all. If the gas expands and bursts the weld, did the pressure cause the burst? You'd have to say no, because you can't intervene. That's absurd."

  "I would say the causal claim is relative to a model," I replied. "In a model where pressure is a variable governed by structural equations, we can define hypothetical interventions. But here, the asymmetry is physical. You have a handle for $B$ via $n_B$, but $A$ is sealed with $n_A = 0.20$ mol fixed. Your counterfactuals treat $p_A$ and $p_B$ symmetrically. At equilibrium, they are numerically identical. Your semantics imply $p_B$ causes the valve to open because $p_A$ dropped, just as much as $p_A$ causes it because $p_B$ dropped. You make them mutual causes."

  "That symmetry is a discovery, not an artifact," C said. "In the free piston setup, the pressures are coupled. If $p_B$ were lower, $p_A$ would be lower. The chain runs both ways. But the claim is about $p_A$. The counterfactual test isolates it. If $p_A$ changes, the valve status changes. That's sufficient."

  "Is it?" I pressed. "Your similarity ordering forbids backtracking, but it doesn't specify the route. To lower $p_A$ by your miracle, do you cool compartment A? Do you expand it? If you cool A, you might affect the heat bath T. If you expand it, you move the piston. Every way of realizing the antecedent drags other causes along. Your account is route-insensitive. You count $p_A$ as a cause even though every physical process that lowers $p_A$ also lowers $p_B$ through a route that bypasses $p_A$'s specific contribution. You're counting the correlation, not the mechanism."

  C paused. "I concede that event-level dependence cannot isolate the contribution of $p_A$ as such when every realization of the antecedent drags other variables with it. Without specifying the route, the counterfactual is coarse. But your framework is hostage to representational choice. You say $p_A$ is a cause only if the model says so. If I write the system as a block of simultaneous equilibrium equations, $p_A$ and $p_B$ are solved together. If I write it as relaxation dynamics where pressure difference accelerates the piston, $p_A$ is a driver. Which model is true? You don't know. You just pick the one that gives the verdict you want."

  "I pick the one that captures the manipulation," I said. "But I concede this: if there are no exogenous handles, my framework is silent. For the welded cylinder, I must borrow your counterfactuals to define the causal structure. I cannot state causal facts about a system with no interventions without parasitizing your semantics. That is a real cost."

  "Let's test the pinned case," C said, pointing to the locking pin. "Suppose we pin the piston at its actual position. Volumes are fixed. $p_A$ is still 3.12 bar. $p_B$ is still 3.12 bar. The valve opens. But now, if $p_A$ were 2.5 bar via miracle, the piston doesn't move. $p_B$ stays 3.12. The valve still opens. The counterfactual dependence vanishes. The verdict flips. $p_A$ is no longer a cause."

  "I agree the verdict flips," I said. "In the pinned model, the structural equation linking $p_A$ to $p_B$ via piston motion is removed. $p_B$ becomes independent of $p_A$. So $p_A$ is no longer on the causal path to the valve. But notice what changed. For you, the world's counterfactual structure changed because the physical constraints changed. For me, the model changed because the equations changed."

  "Does that difference matter?" C asked.

  "Yes," I said. "You treat the counterfactuals as fundamental facts about the world. I treat them as derivatives of the model. When you say the verdict flips, you say the causation disappeared. When I say it flips, I say the representation no longer supports the claim. In the free case, I only called $p_A$ a cause because the equilibrium constraint allowed me to model it as a mediator. It was a artifact of the model choice, not a discovery of a handle."

  "But you agreed it was a cause in the free case," C said. "Now you say it was an artifact. You're retreating."

  "I'm being precise," I replied. "The asymmetry between $p_A$ and $p_B$ isn't in the pressures; it's in the handles. $n_B$ exists; $n_A$ does not. In the free case, the piston transmits the influence of $n_B$ through $p_A$ to $p_B$. In the pinned case, it doesn't. Your account sees dependence in both directions and calls it causation. Mine sees the direction of control."

  "And yet," C said, "you needed my counterfactuals to explain the welded case. You needed my semantics to fix your similarity ordering when you claimed my miracle was a disguised intervention. We are both stuck with the constraint-shadowed variable. You can't intervene on it; I can't isolate its route."

  "Then we are done," I said. "We agree on the verdicts for free and pinned. We disagree on what grounds them."

  They each took a notepad.

  C wrote: *I need to know whether the valve would remain shut if $p_A$ were lower holding the laws of nature fixed, independent of any model.*

  I wrote: *I need to know which structural equations faithfully represent the mechanism so we can determine if $p_A$ lies on a path from an exogenous variable to the valve.*
