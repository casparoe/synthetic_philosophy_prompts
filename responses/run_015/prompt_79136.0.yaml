answer: |-
  **Question**

  Sen's Liberal Paradox is often dismissed as arising only because individuals hold preferences over others' private choices. Critically evaluate this dismissal. First, clarify whether Minimal Liberalism should be interpreted as a formal condition on decisiveness over pairs or a substantive claim about protected spheres. Second, analyze two standard responses: (1) restricting admissible preferences to be self-regarding or conditional, and (2) treating rights as side-constraints on outcomes rather than inputs to a social welfare function. Determine whether either response dissolves the paradox or merely relocates the conflict. Conclude by specifying the normative cost each route imposes on a coherent liberal theory.

  ***

  **Model Answer**

  The colleague's objection—that the paradox vanishes if we exclude preferences over others' private acts—misunderstands the structural role of Minimal Liberalism within social choice theory. Minimal Liberalism is not merely a substantive claim about privacy; it is a formal condition assigning individuals decisiveness over specific pairs of social states. In the Prude-Lewd case, Minimal Liberalism grants the Prude decisiveness over whether he reads, and the Lewd over whether she reads. The paradox arises because the Weak Pareto Principle aggregates all informed preferences, including those regarding others' choices. To exclude the Prude's preference about the Lewd's reading is not to solve the paradox but to violate the unrestricted domain condition or impose paternalistic restrictions on what counts as a preference. This begs the question against the liberal commitment to respect individual judgments, even meddlesome ones. Liberalism protects the freedom to hold preferences, not just the privacy of actions.

  The first escape route involves reformulating preferences as conditional. Here, the Prude's preference is not over the Lewd's reading in isolation, but over combinations of acts. If the Prude prefers both to read over neither, but prefers neither over only the Lewd reading, the cycle may dissolve. However, this relocates the difficulty rather than resolving it. By making rights contingent on the structure of preference profiles, liberalism loses its status as a trump. If my right to choose depends on whether you care about my choice, rights become unstable game-theoretic equilibria rather than protected spheres. The cost here is the forfeiture of the deontological strength of rights; they become merely another input into the welfare calculus, vulnerable to aggregation failures whenever preferences are interdependent. This renders liberty contingent upon the goodwill or indifference of others, which is antithetical to the core liberal notion of inalienable rights.

  The second route treats rights as constraints on the feasible set rather than inputs to a social welfare function. On this view, certain outcomes are ruled out procedurally before welfare evaluation occurs. The Weak Pareto Principle applies only to remaining feasible options. This aligns with a deontological conception of liberty: rights protect processes, not necessarily optimal outcomes. However, this evaporates the paradox only by abandoning welfarism. If rights constrain outcomes independently of welfare, we cannot claim the social choice rule is purely consequentialist. The cost is significant: we must accept that a liberal society might knowingly choose a Pareto-inferior outcome to respect procedural rights. This severs the link between social choice and overall well-being, forcing a pluralistic evaluation where liberty and welfare are incommensurable values. We can no longer say one state is socially better simply because everyone prefers it, if achieving it violates a right.

  Neither route offers a cost-free resolution. The colleague is correct that meddlesome preferences drive the inconsistency, but wrong to think excluding them is liberal. Restricting preferences is illiberal paternalism; treating rights as constraints abandons welfarist aggregation. The genuine lesson of the paradox is not that liberalism is impossible, but that it is incompatible with a specific form of welfarist consequentialism that demands all values be reduced to a single ordering of outcomes. A coherent liberal theory must either accept that rights limit the pursuit of Pareto efficiency or acknowledge that individual sovereignty cannot be fully captured within a standard social welfare function. The paradox thus forces a choice: modify the conception of rights or modify the conception of social welfare. Most liberals should prefer the latter, accepting that liberty imposes side-constraints that welfare maximization cannot override. This preserves the core liberal intuition that some choices are nobody's business but the agent's, even if respecting that choice reduces aggregate welfare. Thus, the paradox survives as a warning against reducing all normative claims to preference satisfaction.

  ***

  **Marking Scheme**

  **Total: 20 Marks**

  **1. Interpretation of Minimal Liberalism (5 marks)**
  *   **Must Hit:** Distinguish ML as formal decisiveness over pairs vs. substantive privacy. Identify that excluding preferences violates Unrestricted Domain.
  *   **Error:** Treating ML as solely about privacy without mentioning decisiveness.
  *   **Typical Error:** Students claim ML guarantees privacy rather than decision power over specific pairs.

  **2. Analysis of Conditional Preferences (5 marks)**
  *   **Must Hit:** Explain how conditionality breaks the cycle. Identify the cost: rights become contingent on others' preferences.
  *   **Error:** Presenting this as a free solution without normative cost.
  *   **Typical Error:** Candidates frequently treat preference restriction as normatively neutral.

  **3. Analysis of Rights as Constraints (5 marks)**
  *   **Must Hit:** Explain rights as excluding options from the feasible set. Identify the cost: abandonment of welfarism/consequentialism.
  *   **Error:** Failing to note the conflict with Pareto efficiency on the remaining set.
  *   **Typical Error:** Examinees often miss that constraints imply rejecting pure welfarism.

  **4. Evaluation and Conclusion (5 marks)**
  *   **Must Hit:** Judge which resolution is genuine vs. relocation. Specify normative costs (paternalism vs. incommensurability).
  *   **Error:** Concluding liberalism is impossible or that the colleague is fully correct.
  *   **Typical Error:** Many wrongly conclude the theorem proves liberalism is incompatible with democracy.
