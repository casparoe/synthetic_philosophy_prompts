  *Question Draft:*
  Sen's Liberal Paradox is often dismissed as arising only because individuals hold preferences over others' private choices. Critically evaluate this dismissal. First, clarify whether Minimal Liberalism should be interpreted as a formal condition on decisiveness over pairs or a substantive claim about protected spheres. Second, analyze two standard responses: (1) restricting admissible preferences to be self-regarding or conditional, and (2) treating rights as side-constraints on outcomes rather than inputs to a social welfare function. Determine whether either response dissolves the paradox or merely relocates the conflict. Conclude by specifying the normative cost each route imposes on a coherent liberal theory. 
  *Model Answer Draft:*
  The colleague's objection—that the paradox vanishes if we exclude preferences over others' private acts—misunderstands the structural role of Minimal Liberalism (ML). ML is not merely a substantive claim about privacy; it is a formal condition assigning individuals decisiveness over specific pairs of social states. In the Prude-Lewd case, ML grants the Prude decisiveness over whether he reads, and the Lewd over whether she reads. The paradox arises because the Weak Pareto Principle (WPP) aggregates *all* informed preferences, including those regarding others' choices. To exclude the Prude's preference about the Lewd's reading is not to solve the paradox but to violate the unrestricted domain condition or impose paternalistic restrictions on what counts as a preference. This begs the question against the liberal commitment to respect individual judgments, even meddlesome ones.

  The first escape route involves reformulating preferences as conditional. Here, the Prude's preference is not over the Lewd's reading in isolation, but over combinations of acts. If the Prude prefers both to read over neither, but prefers neither over only the Lewd reading, the cycle may dissolve. However, this relocates the difficulty. By making rights contingent on the structure of preference profiles, liberalism loses its status as a trump. If my right to choose depends on whether you care about my choice, rights become unstable game-theoretic equilibria rather than protected spheres. The cost here is the forfeiture of the deontological strength of rights; they become merely another input into the welfare calculus, vulnerable to aggregation failures whenever preferences are interdependent.

  The second route treats rights as constraints on the feasible set rather than inputs to a social welfare function. On this view, certain outcomes are ruled out procedurally before welfare evaluation occurs. The WPP applies only to remaining feasible options. This aligns with a deontological conception of liberty: rights protect processes, not necessarily optimal outcomes. However, this evaporates the paradox only by abandoning welfarism. If rights constrain outcomes independently of welfare, we cannot claim the social choice rule is purely consequentialist. The cost is significant: we must accept that a liberal society might knowingly choose a Pareto-inferior outcome to respect procedural rights. This severs the link between social choice and overall well-being, forcing a pluralistic evaluation where liberty and welfare are incommensurable values.

  Neither route offers a cost-free resolution. The colleague is correct that meddlesome preferences drive the inconsistency, but wrong to think excluding them is liberal. Restricting preferences is illiberal paternalism; treating rights as constraints abandons welfarist aggregation. The genuine lesson of the paradox is not that liberalism is impossible, but that it is incompatible with a specific form of welfarist consequentialism that demands all values be reduced to a single ordering of outcomes. A coherent liberal theory must either accept that rights limit the pursuit of Pareto efficiency or acknowledge that individual sovereignty cannot be fully captured within a standard social welfare function. The paradox thus forces a choice: modify the conception of rights or modify the conception of social welfare. Most liberals should prefer the latter, accepting that liberty imposes side-constraints that welfare maximization cannot override. 
