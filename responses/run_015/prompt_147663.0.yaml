answer: |-
  **Project Title:** The Structure of Impersonal Risk: Generalizing Risk-Weighted Utility to Social Choice

  **Research Question and Scope**
  This project asks whether risk-weighted expected utility (RWEU), a framework established for individual prudential rationality, admits a coherent extension to impersonal social choice. The class of decision problems is fixed: public choices under known probabilities (risk, not ambiguity) affecting a population of distinct individuals. I hold fixed a standard social welfare function and objective probabilities. The claim to be established is determinate: either one of two natural generalizations is uniquely defensible, or neither survives scrutiny.

  The existing literature leaves this question open because the individual and social domains talk past one another. The debate over RWEU in individual choice concerns whether a single subject may rationally weight probabilities non-linearly based on their own risk attitude. Social choice theory, conversely, treats distributional concerns via social welfare functions (ex post priority) or expected utility aggregation (ex ante). These frameworks do not meet. Furthermore, standard objections to non-expected-utility theories—dynamic inconsistency, susceptibility to money pumps, or information avoidance—rely on a single agent making sequential choices. In impersonal social choice, there is no single agent to exploit over time, and the choice is often one-off. Thus, the theoretical barriers that constrain individual risk-attitudes do not obviously apply to social risk-attitudes, leaving the generalization unconstrained.

  **Methodology and Work Plan**
  The work proceeds over twelve months, moving from formal characterization to practical application.

  *Months 1–3: Formal Setup.* I will define the two candidate generalizations precisely without reliance on specific numerical examples. *Aggregate-first weighting* applies the risk transformation to the social welfare outcome of each state. *Person-by-person weighting* applies the risk transformation to each individual's prospect before aggregating. I will formalize the conditions under which these coincide (perfect correlation) and diverge (independent risks, uncertain population size).

  *Months 4–6: Axiomatic Characterization.* I will construct an axiomatic system that separates the two candidates. The goal is to isolate the minimal case in which they diverge—specifically, scenarios involving independent risks across a large population. I will test whether person-by-person weighting collapses toward ordinary expected utility as risks diversify, and whether aggregate-first weighting remains sensitive to risk parameters regardless of population size.

  *Months 7–9: Implications for Individual Rationality.* I will analyze the reverse implication. If the only defensible many-person versions collapse into a social-welfare parameter or evaporate under diversification, then the permissivist position in the individual case may have been relying on the unique identity of the subject rather than the structure of risk itself. I will draft the argument showing whether the individual justification survives the removal of the single-subject constraint.

  *Months 10–12: Application and Sensitivity Analysis.* I will model a pandemic-policy choice involving trade-offs between suppression strategies and economic costs. This will be a deliberately non-ideal application. I will run a sensitivity analysis showing how much practical difference the choice between candidates makes as the risk parameter and the priority parameter vary. This demonstrates the stakes of the theoretical distinction.

  **Possible Conclusions**
  The project will terminate in one of four conclusions. First, *Aggregate-first weighting* is uniquely defensible, implying risk attitude is a social parameter distinct from inequality aversion. Second, *Person-by-person weighting* is uniquely defensible, implying social risk aversion washes out under diversification. Third, there is *no impersonal analogue* of risk-weighting; the framework is essentially indexical to a single subject. Fourth, the *Disguised Parameter Result*: the only defensible impersonal version is really a social-welfare parameter in disguise, double-counting priority for the worse-off. The choice between these will be decided by whether the risk function can be disentangled from the evaluation of outcomes without redundancy or instability.

  **Failure Conditions**
  I specify three conditions under which the project would fail to yield a substantive result. First, *Extensional Equivalence*: if the two candidates turn out equivalent under every plausible social welfare function, the distinction is theoretical only. Second, *Ambiguity Dominance*: if the divergence appears only where probabilities are unknown, the subject is ambiguity rather than risk, requiring a different framework. Third, *Verbal Disagreement*: if the disagreement turns merely on whether the risk function is classified as part of the probability transformation or the outcome evaluation. A verbal-disagreement finding would be worth reporting, but it would mean this is the wrong project to have funded. I will monitor for these conditions during the axiomatic phase and pivot if necessary.

  **Scope and Feasibility**
  The primary risk to feasibility is the complexity of the axiomatic characterization. If the proof of divergence becomes intractable, I will drop the full axiomatic system in favor of a robust set of counterexamples that demonstrate the divergence extensionally. I will not drop the application component entirely, but I would simplify the pandemic model to a numerical simulation rather than a full policy framework if time constrains the theoretical work. This ensures the remainder is a completed theoretical argument with illustrative support, rather than an incomplete survey.

  **Impact**
  A regulator, trustee, or programme officer faces decisions where risks are distributed across many people. Current guidance often conflates risk aversion with inequality aversion. This project clarifies whether "risk aversion" in policy is a distinct rational requirement or merely a disguised preference for equality. If the project shows that impersonal risk-weighting collapses into social-welfare parameters, regulators know they need not justify precautionary principles via risk attitudes alone. If it shows risk-weighting retains bite independently, it provides a formal justification for prioritizing catastrophic risks even when expected losses are low. The result offers a clearer vocabulary for justifying public decisions under risk.
