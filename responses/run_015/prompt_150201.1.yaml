answer: |-
  **Exam Question: Philosophy of AI (Final)**

  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in a structured essay. Your response must address the five specific analytical moves outlined below.

  **The Synthetic Convexity Case:**
  Consider a vision model trained exclusively on a synthetic dataset of convex geometric shapes. The training objective is strictly to minimize reconstruction error on this dataset. Mechanistic analysis reveals a specific internal unit that activates maximally on convex boundaries. However, this unit also activates maximally on shadows cast by those boundaries. Ablating this unit degrades performance on both boundary detection and shadow detection.

  **Essay Prompt:**
  Does this unit represent convexity, shadow-boundary, neither, or a disjunctive property? Specifically, evaluate whether the model's training objective (minimize reconstruction error) can substitute for evolutionary history in a teleosemantic account of content, or whether it merely relocates the disjunction problem onto designer intent.

  **Your essay must explicitly execute the following five moves:**
  1.  Explain why causal relevance demonstrated by ablation is insufficient for establishing semantic content.
  2.  Analyze how the disjunction problem arises for artificial systems lacking evolutionary selection.
  3.  Argue whether the synthetic training objective resolves that problem or pushes it back to designer intent.
  4.  Identify and diagnose one common student error regarding representational status (e.g., treating feature-visualization as sufficient).
  5.  Provide a reasoned conclusion that takes a definite stand rather than ending in agnosticism.

  ***

  **Model Answer**

  Attributing semantic content to artificial neural units requires distinguishing causal role from representational value. In the synthetic convexity case, the unit's behavior invites a teleosemantic analysis, but the lack of biological history complicates content attribution.

  First, causal relevance demonstrated by ablation is insufficient for semantic content. Ablation shows that the unit is causally necessary for specific outputs; removing it breaks the system's ability to reconstruct boundaries and shadows. However, causal contribution does not entail semantic specificity. A fuse is causally necessary for a light to turn on, but the fuse does not represent "light." Similarly, the unit's causal role in minimizing error does not prove it carries information *about* convexity rather than merely participating in a computational process that correlates with convexity. Causal necessity establishes functional importance, not truth conditions.

  Second, the disjunction problem arises acutely for artificial systems lacking evolutionary selection. In biological teleosemantics, content is fixed by selection history: a frog's detector represents "fly" because detecting flies conferred survival advantages, whereas detecting fly-shaped pellets did not. False positives were selected against. In this synthetic model, there is no evolutionary history distinguishing convex boundaries from shadows. Both features co-occur in the training distribution and both contribute to loss reduction. Without a history of selection that penalizes one interpretation over the other, there is no fact of the matter about whether the unit represents convexity, shadows, or the disjunction "convexity-or-shadow." The system has no mechanism to distinguish error from success beyond the loss function.

  Third, the synthetic training objective does not resolve this problem; it pushes it back to designer intent. One might argue that minimizing reconstruction error substitutes for evolutionary fitness. However, the loss function defines successful performance, not truth conditions. The model succeeds if it reconstructs the pixels, regardless of whether it "believes" those pixels constitute a shadow or a boundary. Consequently, the content determination relies on what the designer intended the loss function to capture. If the designer intended boundary detection, shadows are errors. If the designer intended pixel reconstruction, shadows are valid features. The teleosemantic burden shifts from natural selection to human intention, which remains external to the system itself.

  Fourth, a common student error is treating feature-visualization or predictive utility as sufficient for representational status. Students often claim that because optimizing the unit's activation produces images of convex shapes, the unit represents convexity. This confuses input optimization with semantic content. Visualization techniques reveal what input patterns maximize activation, not what the system takes those patterns to *be*. High predictive utility similarly shows correlation, not intentionality. A barometer predicts rain but does not represent rain; likewise, a unit can predict boundaries without representing them.

  Finally, I conclude that the unit does not represent convexity, shadows, or any disjunctive property. It is an instrumental component within a statistical approximator. Without a selection history that defines error conditions independent of the designer's external interpretation, the system lacks the normative structure required for genuine representation. We should adopt an instrumentalist stance: the unit is useful for describing the system's behavior, but attributing semantic content to it is a category error. The model processes information, but it does not possess content.

  ***

  **Marking Scheme (Total: 20 Marks)**

  | Criterion | Marks | Typical Failure Mode (Deduction Guide) |
  | :--- | :---: | :--- |
  | **1. Causal Insufficiency** | 4 | Confusing causal necessity (ablation) with semantic specificity (representation). |
  | **2. Disjunction Problem** | 4 | Ignoring the lack of evolutionary history to fix error conditions vs. co-occurring features. |
  | **3. Training Objective** | 4 | Equating loss minimization with truth conditions rather than shifting to designer intent. |
  | **4. Student Error** | 4 | Accepting feature-visualization or predictive utility as proof of internal semantic content. |
  | **5. Conclusion** | 4 | Remaining agnostic or failing to take a definite stand on representational realism. |
