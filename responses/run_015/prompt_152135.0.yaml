      *   *Section 2 (Inertia/Counterfactual):* Critique Leo's materialism. Use the distinction between *brute facts* and *institutional facts*. A university is not just a building; it's a set of justified practices.
      *   *Section 3 (Verdict):* Declare a winner based on the ontology of history. History is about meaning-making, not just structural mechanics. Maya wins on ontology, Leo wins on caution. But ultimately, Maya's view allows for historical change; Leo's view leads to stagnation/continuum.
