answer: |-
  # Q&A Prep Sheet: Metascience Seminar
  **Topic:** Prior Ownership & The Sensitivity Band
  **Audience:** Psychologists (Prereg), Applied Bayesians, Error Statistician

  ## Strategy Overview
  *   **Tone:** Do not defend "philosophy." Defend *workflow*. You are proposing a procedural fix, not a metaphysical one.
  *   **Goal:** Convince them this is a governance mechanism, not a new statistical theorem.
  *   **Concessions:** Pre-emptively concede that you do not have the *administrative* solution for auditing yet. Frame this as a "policy question for the field," not a "philosophical question for the paper." This disarms the "armchair" critique.

  ---

  ## The Objections (Ordered by Likelihood & Damage)

  ### 1. The "Who Guards the Guardians?" Objection
  **Who:** The Error Statistician (likely joined by the Bayesians)
  **The Question:** "You say priors must be 'audited' and 'registered.' By whom? By what standard? If the standard is 'reasonable,' that's subjective. If the standard is 'default,' that's dogmatic. Until you specify the audit mechanism, this is just a slogan, not a method."
  **The Reply (2 min):** "You're right that I'm not proposing a specific audit committee today. But we already audit other parts of the model. We audit measures for validity and analysis plans for p-hacking. My claim is that the prior is functionally identical to the choice of estimator. Currently, we let researchers choose estimators based on private convenience; preregistration forced that into the public light. I'm proposing we treat the prior the same way. The 'standard' isn't a single truth, but a range of community-accepted defaults (e.g., weakly informative vs. skeptical). The audit isn't about truth; it's about *disclosure*. If a researcher wants to use a strong informative prior, they can, but it must be flagged in the registration as 'high influence.' The 'band' then reveals if that choice drove the result."
  **Weakness:** This kicks the can down the road on *who* defines "community-accepted."

  ### 2. The Error Control Objection
  **Who:** The Error Statistician
  **The Question:** "I care about severity and long-run error rates. Your 'sensitivity band' gives me a range of posteriors, but what is the Type I error rate of a band? If the band straddles the null, you say 'uninformative.' Does that decision rule actually control false positives better than NHST?"
  **The Reply (2 min):** "It controls a different error: the error of *asserting* a claim the data cannot support across reasonable assumptions. NHST controls the false positive rate of the *test*, but not the false assertion rate of the *interpretation*. By forcing the 'uninformative' verdict when the band straddles the null, we reduce the rate at which the literature asserts effects that vanish under slight prior perturbations. It trades power for robustness. It's not a significance test; it's a reliability filter for public claims."
  **Weakness:** You cannot promise specific alpha levels without simulation studies you haven't done.

  ### 3. The Feasibility/Workload Objection
  **Who:** The Psychologists (Prereg Advocates)
  **The Question:** "Preregistration is already a heavy lift for grad students. Now you want them to specify a *family* of priors and justify them? This will increase friction so much that people will just stop preregistering or game the system harder."
  **The Reply (2 min):** "I agree friction is the enemy. That's why I'm not asking for a novel elicitation process for every paper. Most fields should converge on 2-3 standard prior families for common designs (e.g., a default Cauchy, a skeptical normal, and a study-specific informative). The 'registration' is just checking a box: 'I am using Prior Set A.' The 'band' can be automated in the analysis script. The goal is to reduce the cognitive load of defending a single 'magic' prior by acknowledging uncertainty upfront."
  **Weakness:** Developing those standard sets requires labor the field hasn't done yet.

  ### 4. The "Subjectivity is Feature, Not Bug" Objection
  **Who:** The Applied Bayesians
  **The Question:** "I use hierarchical models because they encode substantive knowledge. If I have good reason to believe a parameter is positive based on past literature, why should I be punished by a 'sensitivity band' that includes a skeptical prior? You're forcing me to entertain priors I know are wrong."
  **The Reply (2 min):** "You aren't being punished; you're being asked to distinguish *your* belief from the *field's* warrant. You can absolutely hold a strong subjective belief. But for the journal to assert this as a public fact, the data must speak loudly enough to move even a skeptical colleague. The band separates 'What I believe' (your preferred prior) from 'What we can claim' (the intersection of the band). It protects your subjective right to believe while protecting the field's objective right to demand robustness."
  **Weakness:** Bayesians may reject the distinction between individual belief and field assertion.

  ### 5. The "Paralysis" Objection
  **Who:** The Psychologists
  **The Question:** "If we require the band to exclude the null for a claim to be made, won't most studies end up 'uninformative'? You might solve the replication crisis by simply stopping the production of new knowledge."
  **The Reply (2 min):** "That is a feature, not a bug. If the data are only sufficient to convince a Bayesian with a strong prior, but not a skeptic, the field *should not* assert the finding as established. We are currently publishing 'findings' that are actually 'hopes.' This proposal shifts the baseline. It might reduce the volume of positive findings, but it increases the reliability of the ones that remain. We need to be comfortable with 'we don't know yet' as a scientific output."
  **Weakness:** Journals and tenure committees reward positive findings, not "uninformative" bands.

  ### 6. The "Complex Models" Objection
  **Who:** The Applied Bayesians
  **The Question:** "This works for a t-test. How does this work for a hierarchical model with 50 parameters and variance components? Do I register a sensitivity band for every hyperparameter? This is computationally and conceptually impossible."
  **The Reply (2 min):** "Start with the parameters of interest. In a hierarchical model, we usually care about the population-level effect, not every group-level variance. We can fix the nuisance priors to standard defaults and only run the sensitivity band on the primary effect. We don't need a full multidimensional sensitivity analysis; we need a univariate band on the claim being asserted."
  **Weakness:** In complex models, priors on variance components often drive the population estimates, so isolating them is tricky.

  ### 7. The "Prior-Hacking" Objection
  **Who:** The Error Statistician / Psychologists
  **The Question:** "You think this stops p-hacking? Researchers will just shop for a 'family' of priors that produces a narrow band excluding the null. You've just moved the degrees of freedom from the analysis to the registration."
  **The Reply (2 min):** "That's why the family must be *registered before data collection*. You can't shop for a family after seeing the data. And because the family must be 'audited' (see Objection 1), it must come from a pre-approved list or be justified by prior literature, not by the current dataset. It restricts the degrees of freedom rather than creating new ones."
  **Weakness:** Determining if a registered family was chosen *because* it works is hard to prove post-hoc.

  ### 8. The "Verbal Dispute" Objection
  **Who:** The Error Statistician
  **The Question:** "You claim the Frequentist-Bayesian dispute is verbal. That's a bold philosophical claim. But if the math is different, the decisions are different. How is that just words?"
  **The Reply (2 min):** "It's verbal in the context of *scientific assertion*. Frequentists want error control; Bayesians want belief updating. But when a journal publishes a paper, it's making a public claim. Both sides agree that claim shouldn't depend on hidden researcher degrees of freedom. My proposal gives the Frequentist a form of robustness (the band width) and the Bayesian a form of updating (the posterior), but binds both to a public registration standard. The math differs, but the governance is the same."
  **Weakness:** Hardliners on both sides deny their goals are compatible.

  ---

  ## Strategic Concessions (Make these *during* the talk)
  1.  **Concede the Audit Mechanism:** Explicitly state: "I am not proposing the specific administrative body for auditing priors in this paper. I am arguing that *whatever* body governs preregistration must expand its scope to include priors. I am identifying the gap, not filling the bureaucratic role."
  2.  **Concede Complexity:** Acknowledge that for complex hierarchical models, full sensitivity bands are currently impractical, and the proposal is best suited for primary outcome parameters in standard designs first.

  ## The Single Reply That Must Land
  **The Response to Objection #1 (The Auditor).**
  *Why:* If you cannot explain *how* a prior gets audited without sounding like you want a "Philosophy King" to rule over science, the Bayesians will reject it as authoritarian and the Psychologists as impractical.
  *How to ensure it lands:* Anchor it in **existing infrastructure**. Do not propose a new committee. Say: "The audit is the peer review of the preregistration script. Just as reviewers currently check if the analysis plan matches the data, they would check if the prior family matches the registration. The 'standard' is the set of defaults built into the analysis packages we already use (e.g., `rstanarm` defaults)."

  ## The Question You Hope Nobody Asks
  **"Isn't this just Robustness Analysis with a fancy name?"**
  *Why it kills you:* Your thesis relies on the philosophical novelty of "Prior Ownership" and the "Sensitivity Band" as a distinct normative tool. If they reduce it to "You want people to do sensitivity analysis," your philosophical contribution evaporates, and the Bayesians will say, "We already do that."
  *Prep if asked:* "Standard robustness analysis is post-hoc and optional. My proposal makes it *pre-registered and mandatory for assertion*. The normativity is the innovation, not the math."
