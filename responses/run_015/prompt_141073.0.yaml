      *   **Constraints:** Sentence-by-sentence analysis (accept, wince, wrong). Focus on two specific questions (the slide to subjectivism/non-cognitivism; the "pre-existing desire" framing). Address a specific counter-example (the "anti-persuasion policy" case). No citations/reading lists, just argument shape.
      *   **Tone:** Professional, academic but accessible, precise, avoiding fluff.

  2.  **Deconstruct the Encyclopedia Paragraph (Sentence by Sentence):**

      *   *Sentence 1:* "According to Bernard Williams, all reasons for action are internal: an agent has a reason to do something only if she already has some desire that doing it would serve, or could acquire such a desire by correct reasoning from the desires she already has."
          *   *Assessment:* Mostly accurate but slightly imprecise on "desire." Williams uses "subjective motivational set" ($S$), which includes desires, projects, commitments, dispositions, not just Humean desires.
          *   *Verdict:* Wince (simplification of $S$), but passable for a summary.

      *   *Sentence 2:* "This is the internal reasons theory."
          *   *Assessment:* Tautological/Labeling.
          *   *Verdict:* Accept.

      *   *Sentence 3:* "It follows that there are no external reasons — no facts that give an agent a reason to act independently of what she happens to care about — and hence that moral requirements give no reason to anyone who lacks an independent desire to be moral."
          *   *Assessment:* The first clause is the definition. The second clause ("hence moral requirements...") is the controversial application. Williams does argue this, but the "independent desire to be moral" phrasing is a bit crude.
          *   *Verdict:* Accept (faithful to Williams's conclusion in "Internal and External Reasons").

      *   *Sentence 4:* "Williams's argument is essentially Humean: since motivation always requires a pre-existing desire, a consideration that left the agent entirely cold could never explain why anyone acted, and so could not be a reason at all."
          *   *Assessment:* **Major Point of Contention.** Williams explicitly distances himself from the Humean Theory of Motivation (HTM). His argument is conceptual about *reasons*, not empirical/psychological about *motivation*. He thinks external reason statements are false/confused, not that they can't motivate.
          *   *Verdict:* Wrong (or at least highly misleading). This is likely why the friend bristles.

      *   *Sentence 5:* "Critics object that this makes reasons embarrassingly subjective: on this view a callous person has no reason not to be cruel."
          *   *Assessment:* Standard objection (the "Mafia Hitman" problem).
          *   *Verdict:* Accept.

      *   *Sentence 6:* "Defenders reply that the reasoning clause can do a lot of work, since the agent might be brought to see the connection by rational reflection."
          *   *Assessment:* Accurate representation of the "sound deliberative route" defense.
          *   *Verdict:* Accept.

      *   *Sentence 7:* "But this only relocates the difficulty, because whether reflection helps depends on psychological facts about the particular agent."
          *   *Assessment:* Fair critique.
          *   *Verdict:* Accept.

      *   *Sentence 8:* "So there is no fact of the matter about what anyone has reason to do, and moral disagreement turns out to be merely a clash of attitudes."
          *   *Assessment:* **The Big Leap.** Internalism $\neq$ Non-cognitivism/Subjectivism about truth. Internalism is about the *conditions* for a reason statement being true, not that there are no truth conditions.
          *   *Verdict:* Wrong/Confused. Imports a separate meta-ethical thesis.

  3.  **Address the Two Specific Questions:**

      *   *Question 1: The slide to "no fact of the matter"/"clash of attitudes".*
          *   Internalism is compatible with realism about reasons *relative to the agent's set*. It denies objective, agent-independent facts, but doesn't necessarily deny truth-aptness of internal reason statements. The entry conflates Internalism with Non-Cognitivism or Error Theory.
      *   *Question 2: The "pre-existing desire" framing.*
          *   Williams's $S$ is broader than "desires." It includes commitments, projects, loyalties. Calling it "Humean" implies the Humean Theory of Motivation (Belief + Desire = Action), which Williams rejects. He thinks reasons *can* motivate without prior desire if the deliberative route is sound, but the *reason* exists only if the route connects to $S$. The friend is right to bristle.

  4.  **Analyze the "Anti-Persuasion Policy" Case:**

      *   *The Case:* Agent has a policy: "I won't accept reasons derived from being argued into."
      *   *The Entry's Implication:* It's just an element of $S$. Deliberation proceeds from there.
      *   *The User's Worry:* Path dependence. Same agent, same set, same conclusion, but reason status depends on *how* they got there (independently vs. argued into).
      *   *Analysis:*
          *   Internalism focuses on the *counterfactual*: Would the agent have a motivation *if* they deliberated soundly?
          *   If the policy is "I reject $P$ if arrived at via argument," then sound deliberation *from the actual set* leads to rejecting $P$.
          *   If the agent arrives at $P$ independently, the policy isn't triggered.
          *   Is this a problem? It highlights that $S$ includes procedural dispositions.
          *   Does it help Externalism? Externalism says the reason exists *regardless* of $S$. So if the policy blocks the reason, Externalism says the policy is irrational/ignoring a reason. Internalism says the reason doesn't exist *for her*.
          *   Is it path dependence? Not exactly. It's about the *content* of $S$. If $S$ contains "reject argued points," then the sound deliberative route respects that. The "path" matters only insofar as it triggers the disposition in $S$.
          *   *Verdict:* It's a complication Internalism can absorb, but it shows how "sound deliberation" is constrained by potentially irrational elements of $S$. It doesn't hand a victory to Externalism, because Externalism still has to explain how the reason exists *for the agent* if it can't motivate even ideally.

  5.  **Drafting the Response:**

      *   *Structure:*
          1.  Intro (acknowledge the friend's annoyance).
          2.  Sentence-by-Sentence Audit (Accept/Wince/Wrong).
          3.  Deep Dive 1: The Humean Label & Desire Framing.
          4.  Deep Dive 2: The Slide to Subjectivism/Non-Cognitivism.
