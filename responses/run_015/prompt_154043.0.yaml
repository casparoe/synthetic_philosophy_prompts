          *   *Analysis:* This is conceptually sound. Standard EU sums $p \times u(x)$. RWEU (specifically Rank-Dependent Utility) applies a weighting function to cumulative probabilities. If the weighting function is convex (overweighting small probabilities of bad outcomes), tail risks matter more. A seawall usually protects against extreme floods (tail), while green infra might handle frequent/small floods (mean).
