  4.  **Address the Specific Question: "Is there a non-arbitrary way to pick the weighting function?"**
      *   *Revealed Preference:* Look at market data (insurance premiums, bond yields). Problem: Markets are incomplete for catastrophic climate risk.
      *   *Social Welfare Functions:* Derive from societal aversion to inequality or catastrophe (e.g., prioritarianism).
      *   *Robust Decision Making (RDM):* Don't pick one weight; test across many (info-gap).
      *   *Deliberative Democracy:* Ask the citizens (participatory budgeting).
      *   *Conclusion:* No purely "objective" way. It requires explicit ethical justification.

  5.  **Drafting the Response (Iterative refinement for tone and clarity):**
