      *   *Missing:* Ambiguity aversion (Knightian uncertainty). Climate risk isn't just risky (known probs); it's ambiguous (unknown probs). This might justify the weighting more than pure risk aversion. I should add this.

  7.  **Final Polish:** Ensure the rating system (Clearly Wrong -> Clearly Right) is clear. Make sure the "non-arbitrary" question gets a dedicated section.

  **(Self-Correction Note):** Wait, Move 2 says "RWEU transforms outcomes by rank, not probabilities." In Rank-Dependent Utility, you order outcomes (rank) and weight the *cumulative probabilities*. So saying it transforms outcomes *instead* of probabilities is a false dichotomy. It transforms the probability mass associated with the ranked outcome. He is technically muddled. I will rate him down on technical accuracy but up on normative concern.

  Let's assemble the response.

