answer: |-
  This is a sophisticated set of questions that cuts to the heart of the "inevitability vs. contingency" debate in the philosophy of science (often associated with Ian Hacking, Andrew Pickering, and the Mertonian tradition). You are grappling with the ontological status of scientific truths versus the historical reality of scientific practice.

  Here is the diagnosis of your confusion, broken down by your requirements.

  ### 1. Brainstorm: Conditions for Inevitability vs. Contingency

  To determine if a discovery is inevitable (Merton's view) or contingent (Kuhn/Hacking's view), we must look at the **constraints** acting on the scientific community at time $t$.

  **Conditions for Inevitability (Convergence):**
  *   **Maturity of Field:** The prerequisite mathematical or conceptual tools already exist (e.g., algebra and geometry were mature enough for calculus).
  *   **Anomaly Pressure:** There is a specific, shared problem demanding a solution (e.g., the problem of tangents and areas for calculus; the problem of species transmutation for biology).
  *   **Information Flow:** Communication networks are dense enough that ideas circulate rapidly (the "zeitgeist" argument).
  *   **Functional Utility:** The discovery solves a problem so effectively that *any* competent practitioner would be drawn to it.

  **Conditions for Contingency (Divergence):**
  *   **Path Dependence:** Early, arbitrary choices lock in future developments (e.g., if we had adopted base-12 math, calculus might look different).
  *   **Metaphysical Commitments:** The discovery relies on specific philosophical beliefs not shared by all (e.g., Newton's absolute space vs. Leibniz's relational space).
  *   **Instrumentation:** The discovery relies on unique, non-reproducible tools or observations available only to specific individuals.
  *   **Conceptual Framing:** The *way* the problem is defined dictates the solution. If the framing is contingent, the solution is contingent.

  ### 2. Diagnosing Your Confusion: The "Fire" Category Error

  You asked: *If calculus was inevitable, isn't asking 'who discovered it' like asking 'who discovered fire'?*

  **Diagnosis:** This is a category error regarding the nature of "Discovery."

  **Why it breaks down:**
  "Fire" is a natural phenomenon. It exists independently of human cognition. Discovering fire is merely noticing an existing causal power of the universe.
  "Calculus" is not a natural phenomenon; it is a **formal technology**. It does not exist in "logical space" waiting to be mapped in a single, unique way. It is a *constructed language* for describing change.

  When you argue that inevitability dissolves priority into "pure sociology," you are assuming that **Priority** is about *ontological firstness* (who touched the truth first). But in the history of science, Priority is about **Causal Influence**.

  *   **The Mistake:** You are conflating *Truth Conditions* with *Credit Conditions*.
  *   **The Correction:** Even if the *truth* (e.g., the relationship between derivatives and integrals) was inevitable, the *formalism* (how we write it, how we teach it, what proofs become easy vs. hard) is not. Priority disputes are not just about who was first; they are about **whose version of the discovery gets to structure the future of the field.**

  If inevitability were total, priority would indeed be trivial. But Merton's thesis is not that *exact* outcomes are inevitable, but that *functional* solutions are inevitable. Since Newton and Leibniz produced *different* functional solutions (fluxions vs. differentials), the priority dispute is not dissolved; it is transformed into a contest over **which inevitable path becomes the actual path.**

  ### 3. Application: Calculus and Natural Selection

  **Case A: Newton vs. Leibniz (The Packaging Problem)**
  Your roommate is correct, and this is where your presupposition cracks.
  *   **Newton:** Viewed calculus kinematically (quantities generated by continuous motion/fluxions). Rooted in physics/metaphysics of time.
  *   **Leibniz:** Viewed calculus algebraically (differences between infinitesimals/differentials). Rooted in logic/characteristica universalis.

  **The Breakdown:** If "Calculus" is the *theorem* (Fundamental Theorem of Calculus), it might be inevitable. But if "Calculus" is the *toolkit*, it is contingent. We use Leibniz's notation ($dy/dx$) today, not Newton's ($\dot{y}$), because Leibniz's packaging was more manipulable for later mathematicians.
  *   **Verdict:** The priority dispute wasn't just "who got there first." It was "whose metaphysics wins?" If Newton had won completely, British mathematics stagnated (which it arguably did for a century because they stuck to his geometric methods). Therefore, the priority dispute determined the **contingent trajectory** of math, even if the **inevitable truth** was accessed by both.

  **Case B: Darwin vs. Wallace (The Research Program Problem)**
  *   **Similarity:** Both identified natural selection as the mechanism of adaptation.
  *   **Difference:** Darwin provided the massive evidentiary base and, crucially, the *research program*. Wallace had the insight but lacked the comprehensive theory of variation (and later diverged on human evolution).
  *   **Verdict:** Inevitability suggests someone would have identified selection. But Priority went to Darwin because he built the **infrastructure** for the discovery to be accepted. Priority here is not about "who thought of the word first," but "who made the idea *work* as science?"
  *   **Your Presupposition:** You assume discovery is a momentary event (a lightbulb). In philosophy of science, discovery is often a **process**. Inevitability applies to the *insight*, but contingency applies to the *establishment*. Priority tracks the establishment.

  ### 4. Determinism Check: Ideas vs. People

  You asked to check if you are mixing up determinism about ideas with determinism about people. **Yes, you are.**

  *   **Determinism about Ideas (Platonism/Realism):** The mathematical structure exists independently. If humans vanished, $2+2=4$ remains true. This supports the "waiting in logical space" view.
  *   **Determinism about People (Mertonian/Historical):** Given the social and intellectual conditions of 1660 Europe, *someone* had to invent calculus.

  **Where you get stuck:**
  You are assuming that **Determinism about Ideas** implies **Determinism about People**.
  *   *Your logic:* If the Idea is inevitable, then the Person doesn't matter, so Priority is fake.
  *   *The Reality:* Even if the Idea is inevitable (Realism), the *access* to it is mediated by People (History).

  Merton's thesis is a **Sociological Determinism**, not a Metaphysical one. He is saying the *social system* of science generates discoveries. He is *not* saying the universe forces specific humans to have specific thoughts.
  *   If you believe the *Idea* is inevitable, you are a Realist.
  *   If you believe the *Priority* is meaningless, you are ignoring that science is a human practice, not just a mirror of nature.

  ### 5. Final Diagnosis: Where Your Presupposition Breaks Down

  Your core confusion rests on this premise: **"If X is inevitable, then human agency in finding X is irrelevant."**

  This is false in the philosophy of science. Here is the exact breakdown:

  1.  **Discovery is not just Recognition:** You treat discovery as recognizing a pre-existing object (like finding a rock). In advanced science, discovery is **construction**. Newton and Leibniz didn't find "Calculus" lying around; they built different machines to solve the same problems.
  2.  **Inevitability is Local, not Global:** It may have been inevitable that *a* method for calculating rates of change would emerge in 17th-century Europe. It was *not* inevitable that *fluxions* specifically would emerge. Therefore, the specific content of the discovery remains contingent, preserving the weight of the priority dispute.
  3.  **Priority determines Trajectory:** Even if the *truth* is inevitable, the *path* to it affects future science. Newton's priority delayed British math; Leibniz's notation accelerated Continental math. The "who" matters because the "who" dictates the "how."

  **Conclusion:**
  You are right that Merton's thesis suggests the *timing* and *multiplicity* of discoveries are socially determined. But you are wrong to conclude this makes priority "pure sociology" in a dismissive sense. In science, **sociology is the mechanism of truth.** Who gets priority determines which notation, which metaphor, and which research program dominates.

  The question "Who discovered calculus?" is not asking "Who touched the Platonic form?" It is asking "Whose construction became the foundation for the next 300 years of physics?" That is a factual question about causal history, not just a sociological attribution. Inevitability explains why *both* found it; it does not explain why *one* version won. That is where the philosophy lies.
