  *Wait, one nuance:* The user asks if priority becomes "pure sociology." Actually, priority *is* pure sociology, but that doesn't make it trivial. It determines the *future* of the science. I need to make sure I don't validate the idea that sociology is "less real" than fact. Sociology *drives* the factuality of future science (e.g., using Leibniz's notation makes certain proofs easier).

