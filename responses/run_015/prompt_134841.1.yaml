answer: |-
  There is no single, canonical term in the current literature that precisely captures this specific configuration. While the phenomenon intersects with established debates regarding **instrumentalism**, **fictionalism**, and **interpretivism**, the systematic *asymmetry* between epistemic adoption and normative rejection constitutes a distinct theoretical move that has not yet been standardized under a specific label.

  Below is an analysis of why this pattern deviates from Dennett's original framework, followed by a proposed coinage, definition, and taxonomy of the phenomenon.

  ### 1. Is this a Legitimate Application of Dennett?

  This pattern represents a **distortion** or **failure mode** of Dennett's Intentional Stance, rather than a legitimate application.

  For Dennett, the adoption of the intentional stance is not merely a heuristic convenience; it is constitutive of the reality of the mental states in question. When Dennett argues that a system has beliefs because the intentional stance yields predictive success, he is advancing a view of **ontological realism about real patterns**. For Dennett, if attributing a belief to a system is the best way to predict its behavior, then there *is* a belief there, in the only sense that "belief" has a coherent meaning. There is no "deeper" substrate (like neural wetware or discrete symbolic architecture) required to validate the belief for normative purposes that is not already validated by the predictive success.

  The pattern you describe attempts to have it both ways:
  1.  **Epistemically:** It treats the intentional attribution as tracking a causal/explanatory reality (otherwise, it could not explain the "puzzling output").
  2.  **Ontologically/Normatively:** It treats the attribution as failing to track reality (otherwise, the model could be responsible or deceptive).

  This creates a category of **"Zombie Intentionality"**: states that are causally efficacious enough to explain behavior but ontologically hollow enough to evade responsibility. In Dennettian terms, this is incoherent. If the pattern is real enough to predict, it is real enough to ground the normative concepts (like deception) that supervene on that predictive success. The pattern you observe is therefore a **pragmatic exploitation** of the stance, leveraging its explanatory power while dodging its metaphysical costs.

  ### 2. Proposed Coinage: Normative-Epistemic Stance Asymmetry (NESA)

  I propose the term **Normative-Epistemic Stance Asymmetry (NESA)** to describe this configuration.

  #### Definition
  **Normative-Epistemic Stance Asymmetry (NESA)** is the systematic practice within a single theoretical framework of adopting the intentional stance to secure *epistemic utility* (prediction, explanation, interpretability) while simultaneously suspending the ontological commitments of that stance to avoid *normative consequences* (responsibility, deception, epistemic authority).

  NESA is characterized by a conditional ontology where the "reality" of a propositional attitude is treated as a function of the *discursive context* (explanatory vs. evaluative) rather than the *properties of the system*.

  #### Distinctions from Related Concepts

  To ensure precision, NESA must be distinguished from three adjacent positions:

  | Concept | Relationship to Intentional Talk | Ontological Commitment | Distinction from NESA |
  | :--- | :--- | :--- | :--- |
  | **Standard Instrumentalism** (Dennettian) | Adopted for prediction. | **Consistent:** Predictive success *constitutes* reality ("Real Patterns"). | NESA denies the reality constituted by the success when normative stakes arise. |
  | **Fictionalism** (e.g., Rosen) | Adopted as useful fiction. | **Consistent:** Talk is *never* literally true, even for prediction. | NESA treats the talk as *explanatorily true* (tracking causes) but *normatively false*. Fictionalism admits it is false everywhere. |
  | **Eliminativism** (e.g., Churchland) | Rejected entirely. | **Consistent:** No beliefs exist; talk should be purged. | NESA retains the talk for explanation. Eliminativism purges it from both explanation and normativity. |
  | **Pragmatic Inconsistency** | Accidental contradiction. | **Unsystematic.** | NESA is *structural* and *correlated* with the shift from explanatory to normative tasks. |

  ### 3. Boundary Cases and Criteria

  You asked whether the phenomenon requires an explicit contradiction within a single argument or if the functional split is sufficient.

  **Criterion for NESA:**
  NESA does **not** require an explicit performative contradiction (e.g., saying "The model believes $p$" and "The model does not believe $p$" in the same paragraph). It is satisfied by a **structural dependency**:
  1.  The explanation of Behavior $B$ *necessitates* the attribution of State $S$ (e.g., false belief).
  2.  The evaluation of Responsibility $R$ regarding Behavior $B$ *necessitates* the denial of State $S$.
  3.  Both analyses are applied to the same system within the same theoretical framework without resolving the tension.

  **Boundary Case 1: The Consistent Pragmatist**
  A researcher who says, "We treat the model *as if* it has beliefs for safety testing, but we know it doesn't," is **not** exhibiting NESA. This is consistent **Fictionalism** or **Heuristic Instrumentalism**. They are not claiming the belief explains the behavior in a truth-apt sense; they are claiming the *language* is useful. NESA requires the stronger claim that the attribution renders the output *intelligible* (implying explanatory truth) while denying it grounds responsibility.

  **Boundary Case 2: The Substrate Essentialist**
  A researcher who argues, "The model has functional beliefs (for prediction) but lacks biological beliefs (for responsibility)," is exhibiting a form of **Bio-Chauvinistic Dualism**. This is a subset of NESA, but NESA is broader. NESA captures the *functional split* regardless of whether the justification is biological, architectural, or metaphysical.

  **Boundary Case 3: The Transitional Theorist**
  A researcher who uses belief-language in Draft A, then realizes the normative implications and switches to "statistical correlation" language in Draft B to avoid liability, is exhibiting **Strategic Ambiguity**. This becomes NESA only if they maintain *both* positions simultaneously in the final theoretical framework (i.e., relying on the belief explanation in the main text while relying on the denial in the ethics appendix).

  ### 4. Implications of Identifying NESA

  Identifying NESA is not merely terminological; it highlights a specific vulnerability in AI governance and safety research.

  1.  **The Responsibility Gap:** NESA facilitates a "responsibility wash." By grounding safety failures in "model beliefs" (making them fixable via alignment), but grounding liability in "lack of agency" (making them non-actionable in court), developers can claim technical control without legal accountability.
  2.  **Explanatory Instability:** If the "beliefs" are not real enough to ground deception, they are arguably not real enough to ground reliable prediction. If the model does not *actually* represent $p$, but merely statistically mirrors a believer in $p$, then the explanation that "it believed $p$" is retroactively weakened. NESA risks undermining the very predictive confidence it seeks to secure.
  3.  **Metaphysical Confusion:** It perpetuates a category error regarding what "representation" means in high-dimensional vector spaces. It assumes a binary (either discrete symbols or nothing) that ignores the possibility of **sub-symbolic representation** which might support a middle-ground ontology (enough for responsibility, less than human agency).

  ### Summary
  The pattern you have identified is **Normative-Epistemic Stance Asymmetry (NESA)**. It is a distinct failure mode of coherent philosophical attribution, diverging from Dennett by severing the link between predictive utility and ontological commitment. It is not mere inconsistency, but a systematic bifurcation designed to maximize explanatory power while minimizing normative liability. Recognizing NESA allows critics to demand either a consistent instrumentalism (accepting the normative consequences of the stance) or a consistent eliminativism (finding non-intentional explanations for the behavior).
