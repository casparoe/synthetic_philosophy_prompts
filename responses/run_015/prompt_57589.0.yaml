answer: |-
  **JOINT STATEMENT ON THE ONTOLOGY OF EMOTIONAL EVALUATION**

  **Signatories:**
  Dr. Elena Vance (Cognitive Judgment Theory)
  Dr. Marcus Thorne (Value Perceptualism Theory)

  **Date:** October 24, 2023
  **Subject:** Pre-registered commitments regarding the architecture of emotional evaluation following one year of adversarial collaboration.

  ### 1. Shared Commitments: The Phenomenological Data
  Before addressing ontological disagreements, we agree that any viable theory of emotion must account for the following three structural features. We stipulate these as the *explananda* for our respective *explanantia*.

  1.  **Intentional Directedness:** Emotions are *about* something. Fear is not a free-floating buzz; it is fear *of* the wasp. Any theory must explain how the emotional state latches onto a specific object or state of affairs in the world.
  2.  **Recalcitrance:** Emotions can persist in direct conflict with reflective judgment. An agent can sincerely assert "This spider is harmless" while simultaneously trembling and experiencing fear. A theory must explain the architecture that allows this conflict without rendering the agent incoherent or the emotion non-existent.
  3.  **Motivational Push:** Emotions are not inert representations. They possess a "world-to-mind" direction of fit (or a hybrid thereof) that predisposes the agent toward specific actions (flight, fight, approach). A theory must explain how a representation of value translates into a tendency to act.

  ### 2. Ontological Claims: The Exact Disagreement
  We disagree on the fundamental category of the emotional state. We commit to the following mutually exclusive definitions.

  **The Judgmentalist Claim (Vance):**
  > "An emotion *E* toward object *O* is identical to (or constituted by) an evaluative **judgment** that *O* possesses property *V* (e.g., dangerousness). To fear the wasp is to judge, in some mode, that the wasp is dangerous."

  **The Perceptualist Claim (Thorne):**
  > "An emotion *E* toward object *O* is a perceptual **experience** of the value property *V* inhering in *O*. To fear the wasp is to have a sensory-like presentation of the wasp *as* dangerous, analogous to seeing the apple *as* red."

  ### 3. Empirical Cruxes and Predictions
  We have identified two specific empirical loci where our theories diverge in their predictions. We agree to treat the following cases as adjudicators.

  #### Crux A: The Architecture of Recalcitrance
  **The Case:** *The Phobic Pilot.* A trained pilot knows via instrument reading (Reflective Judgment) that turbulence is statistically safe. However, during severe turbulence, she experiences visceral fear (Emotion) and grips the controls tightly.

  **The Disagreement:**
  *   **Vance (Judgment):** If fear *is* a judgment, the pilot holds two contradictory propositional attitudes simultaneously. One is a slow, reflective judgment ("Safe"); the other is a fast, automatic, sub-doxastic judgment ("Dangerous").
  *   **Thorne (Perception):** The pilot holds one judgment ("Safe") and one perception ("Dangerous"). There is no logical contradiction, only a conflict between a belief and an experience (analogous to seeing a bent stick in water while knowing it is straight).

  **Agreed Evidence:**
  Dual-task experiments measuring working memory load during recalcitrant emotional episodes.

  **Predictions:**
  *   **Vance predicts:** Increasing cognitive load will degrade the *emotion* (the automatic judgment) because it relies on the same cognitive resources as the reflective judgment, albeit via a heuristic shortcut. If you overload the reasoning system, the "automatic judgment" of fear should falter or become less precise.
  *   **Thorne predicts:** Increasing cognitive load will degrade the *reflective judgment* but leave the *emotion* intact. Perceptual systems are modular and encapsulated; loading working memory should not stop the pilot from "seeing" the danger, even if it stops her from reasoning about safety.

  #### Crux B: The Detecting Apparatus
  **The Case:** *The Amygdala Hijack.* Neural imaging shows rapid subcortical processing of threat stimuli (e.g., snake shapes) prior to cortical awareness.

  **The Disagreement:**
  *   **Vance (Judgment):** The mechanism implementing this detection functions as a **syllogism or heuristic evaluation**. It takes inputs (Snake shape + Past Pain) and outputs a verdict (Danger). It is a "conclusion" drawn by a sub-personal system.
  *   **Thorne (Perception):** The mechanism implements a **transduction of value properties**. It does not infer danger; it detects the property of "threatness" directly, much as the retina transduces photons into color experience.

  **Agreed Evidence:**
  Latency studies combined with semantic priming. Does the emotional response require semantic categorization (is it a "snake"?) or merely feature detection (curved line + rapid approach)?

  **Predictions:**
  *   **Vance predicts:** The emotional response will be delayed or abolished if semantic categorization is blocked. If the system cannot classify the object as a "snake" (even sub-personally), it cannot judge it "dangerous."
  *   **Thorne predicts:** The emotional response will proceed even if semantic categorization is blocked. The visual system can detect the *value property* (threat) directly from low-level features without needing to categorize the object under a concept first.

  ### 4. The "No-Feedback" Constraint
  **Stipulated Case:** An agent with complete spinal transection (no afferent bodily feedback to the brain) reports feeling fear upon seeing a threat, despite lacking the somatic sensations (racing heart, tension) traditionally associated with the emotion.

  **Vance (Judgment) Analysis:**
  This is **consistent** with Judgmentalism. If fear is a judgment that "X is dangerous," bodily feedback is causally incidental. The brain can evaluate the threat and issue the verdict without peripheral confirmation. This case supports the view that the core of emotion is central evaluation.

  **Thorne (Perception) Analysis:**
  This is **manageable but costly** for Perceptualism. If emotion is perceiving value *in the world* (like redness), bodily feedback is not the *object* of the perception, but merely the *medium* or a concurrent effect. However, if the phenomenal "force" of the emotion is diminished (as some such patients report), it suggests bodily feedback contributes to the *intensity* of the perceptual experience, even if not its *content*.
  *   **Verdict:** We agree this is **not a crux** for the core ontological dispute, but a constraint on the *phenomenology*. Both sides agree the *evaluation* is happening centrally. The dispute remains whether that central evaluation is a *verdict* (Vance) or a *presentation* (Thorne).

  ### 5. Identification of Merely Verbal Disputes
  Through collaboration, we suspect portions of our year-long debate stem from divergent definitions of key terms rather than substantive metaphysical differences.

  1.  **The Definition of "Judgment":**
      *   *Suspicion:* If Vance defines "judgment" broadly enough to include non-conscious, automatic, non-endorseable propositional attitudes, her view begins to look functionally identical to Thorne's "perception."
      *   *Resolution:* Vance must commit to whether a "judgment" requires the possibility of conscious endorsement. If she allows "sub-personal judgments" that the agent cannot access or affirm, the label "judgment" may be doing no heavy lifting other than insisting the output is propositional.

  2.  **The Definition of "Perception":**
      *   *Suspicion:* If Thorne defines "perception" broadly enough to allow for heavy "cognitive penetration" (where beliefs and concepts shape the emotional experience), his view begins to look like Vance's "judgment."
      *   *Resolution:* Thorne must commit to the *encapsulation* of the emotional system. If the "perception" of danger is entirely constructed by prior beliefs and reasoning, calling it "perception" risks being a metaphor for "intuitive judgment."

  **Conclusion:**
  The substantive fight is not about whether emotions involve information processing (both agree they do) or whether they involve the brain (both agree they do). The fight is about the **direction of fit** and the **experience of passivity**.
  *   If the agent feels the emotion as something they *do* (even automatically), Vance wins.
  *   If the agent feels the emotion as something that *happens to them* (like a sensory invasion), Thorne wins.

  We commit to designing experiments that measure the *sense of agency* during recalcitrant emotions to adjudicate this final distinction.

  ***

  **Signed,**

  *Elena Vance*
  *Marcus Thorne*
