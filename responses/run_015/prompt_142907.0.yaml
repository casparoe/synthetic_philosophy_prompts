answer: |-
  To the seeker who presses me on the roots of virtue and the shape of the heart, I send these thoughts across the distance of your time, grateful that the Way is still a matter of urgent inquiry. You bring me a puzzle that wears the clothing of new words but bears the face of old doubts, specifically those raised by Gaozi when he claimed that nature is like a willow tree and righteousness is like the cups and bowls carved from it, or when others argued that our cares are merely calculations of benefit disguised as feeling. You ask why the sprout of compassion, if it is truly innate and flows like water downward, requires such strenuous tending that it seems almost constructed by the very rituals meant to express it, and you wonder if this tendency is nothing more than a trick of survival written in the blood of the clan.

  Let us first look to the water, for it is the clearest mirror of our nature. When I say human nature is good, I do not say that every man is already a sage, just as I do not say that every seed is already a harvest. If you take water and splash it, you can make it leap over your forehead, and if you dam it and force it, you can make it flow up a mountain. But is this the nature of water? It is only the nature of water to flow downward. So it is with man. There is no man who does not have the heart that cannot bear the suffering of another. When you see a child about to fall into a well, there is in everyone a sudden alarm and distress. You do not feel this to gain favor with the parents, nor to seek praise from the village, nor because you share their blood. It arises spontaneously, before calculation can begin. This is the sprout of benevolence. Those who tell you this feeling is merely a bookkeeping of genes, a shadow cast by the need to preserve one's own kin, mistake the shadow for the substance. If compassion were only a tool for survival, it would vanish when survival was not at stake, yet we see men lay down their lives for strangers or refuse a bowl of rice when it is offered with insult. The heart chooses righteousness over life itself. How can a calculation of survival explain the choice to die for what is right? The evolutionary account you mention sees the vessel but misses the water within; it explains why the vessel exists, but it cannot explain the quality of the liquid that fills it, which is capable of transcending the very boundaries of the clan.

  Yet you are right to observe that this water often fails to reach the sea. It is stopped by weeds, diverted by drought, or muddied by the axes of desire. This is where the misunderstanding of ritual arises. There are teachers who claim that because the water must be channelled, the channel must be dug by force into dry earth, as if the earth itself had no tendency to hold moisture. They say ritual constructs a second nature because the first is crooked. But I say ritual is not the mold that shapes clay; it is the trellis that supports the vine. The vine grows upward by its own energy, but without the trellis, it drags in the dirt and rots. When you perform the rites of courtesy and respect, you are not painting a mask onto a blank face; you are polishing a mirror that has been dulled by dust. The need for polishing does not prove the mirror is incapable of reflection. If the heart-mind did not already possess the sprout of courtesy, the rituals of bowing and yielding would feel like shackles, yet when a man acts with true propriety, he feels comfort and ease. If ritual were purely artificial, it would chafe against the skin of the soul. That it fits, that it resonates, proves it is cut to the measure of our innate dispositions.

  The tension you feel comes from confusing the beginning with the completion. The sprout is real, but it is fragile. It is not a full-grown tree. To say it is innate is to say it is the source of growth, not that it is immune to destruction. The Ox Mountain was once lush, but because it lay near a capital, axes and bills hewed at it, and cattle and sheep grazed on its sprouts. How could it remain beautiful? Yet people see its barrenness and say it never had timber. Is this the nature of the mountain? The labor of cultivation is not proof that the seed is absent; it is proof that the world is full of axes. The ritual training you describe, which sounds so much like construction, is in truth the removal of those obstacles. It is the fencing of the mountain so the sprouts may grow. When the interpreters of your age say ritual makes moral perception possible, they speak partially true, for without the refinement of ritual, our perception is clouded by selfish desire. But the light that sees is not made by the cleaning of the lens. The discernment of right and wrong is the sprout of wisdom, and ritual merely clears the vision so it can see clearly.

  Therefore, do not let the fragility of the sprout deceive you into thinking the seed is false. The fact that we must strive to extend our compassion does not mean compassion is a fiction of survival or a construct of teachers. If it were a fiction, no amount of striving could make it real, just as you cannot pull a hair to make a tree. We strive because there is something there to be grown. The evolutionary account reduces the noble to the biological, and the ritualist account reduces the internal to the external. Both miss the living pulse of the heart-mind. Trust the feeling of alarm at the well. Trust the shame you feel when you act wrongly. These are not ghosts of ancestors nor chains of society. They are the roots of heaven within you. Your task is not to build them from nothing, but to cease cutting them down and to let them extend until they cover all under heaven.
