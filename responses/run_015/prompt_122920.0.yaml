  7.  **Final Polish:** Ensure the distinction between "belief" (internal state) and "assertion" (output) is clear, as that's the core of the incident review problem.

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm solving the philosophy of mind. I need to sound like I'm solving the incident review process. The "theory" is a tool for the post-mortem, not a truth about the universe.

