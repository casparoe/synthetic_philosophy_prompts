      *   *Refining "Distillation":* If the behavior is identical, the "belief" attribution should be identical for operational purposes. Internal structure is irrelevant for Use A/C.

      *   *Refining the Table:* Needs to be sharp.
          *   *Intentional Stance:* Wins on "Earn Its Keep" (often), loses on "Don't Collapse" (treats them as useful fictions).
          *   *Mechanistic:* Wins on "Don't Collapse" and "Retrieval Control", loses on "Earn Its Keep" (hard to scale).
