  # Decision Tree: The Institutional Purpose of Marriage

  **1. Does marriage need a unique social function that justifies state recognition at all?**

  *   **NO** (Marriage is not a special public good)
      *   **Should the state stop licensing marriage entirely, or just treat it as a standard private contract?**
          *   **Stop licensing entirely:** **Marriage Abolitionist**
              *   *Awkward commitment:* Must argue that same-sex couples should not marry, but neither should opposite-sex couples, removing the status for everyone.
          *   **Treat as standard contract:** **Libertarian Contractarian**
              *   *Awkward commitment:* Must argue same-sex couples get contracts, but so do business partners, stripping marriage of any unique moral significance.
          *   *(Note: These two positions often blur in practice, as both deny marriage special state status.)*

  *   **YES** (Marriage serves a specific public function)
      *   **Is the primary function to secure the next generation or to organize adult relationships?**
          *   **Secure the Next Generation**
              *   **Is biological co-parenting essential, or is social child-rearing sufficient?**
                  *   **Biological co-parenting is essential:** **Conjugal View**
                      *   *Awkward commitment:* Must argue same-sex couples cannot marry because they cannot biologically co-parent, even if they adopt.
                  *   **Social child-rearing is sufficient:** **Social Parenting View**
                      *   *Awkward commitment:* Must argue childless same-sex couples qualify less than opposite-sex couples with children, making love secondary to parenting.
          *   **Organize Adult Relationships**
              *   **Is the bond defined by personal intimacy or structural stability?**
                  *   **Personal Intimacy**
                      *   **Is the core value romantic love or interdependent care?**
                          *   **Romantic love:** **Revisionist Companionate**
                              *   *Awkward commitment:* Must argue opposite-sex couples who don't love each other are less married than loving same-sex couples.
                          *   **Interdependent care:** **Care Ethics View**
                              *   *Awkward commitment:* Must argue adult siblings caring for each other qualify more readily than romantic same-sex pairs without dependency needs.
                  *   **Structural Stability**
                      *   **Is the goal financial pooling or family lineage merging?**
                          *   **Financial pooling:** **Economic Partnership**
                              *   *Awkward commitment:* Must argue same-sex couples qualify only if they merge finances like business partners, excluding romantic couples who keep assets separate.
                          *   **Family lineage merging:** **Kinship-Alliance**
                              *   *Awkward commitment:* Must argue same-sex couples lack the extended family merger traditional to the institution, regardless of their personal commitment.
