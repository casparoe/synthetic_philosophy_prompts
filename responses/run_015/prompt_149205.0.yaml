  3. **Institutional-bottleneck (Tier B):** Explains Darwin and Wallace well, as both targeted the same scientific societies and publishing venues. Less applicable to Newton and Leibniz, who worked across fragmented European networks without a single governing body directing focus toward specific problems.

  4. **Competitive-arousal (Tier C):** Partially true for Newton, who accelerated upon hearing of Leibniz's progress. However, Darwin and Wallace worked largely in isolation until the final moment, making direct rivalry a secondary accelerant rather than a primary cause of the discovery.

  5. **Archival-compression (Tier C):** While communication delays distorted timelines, they do not explain the intellectual convergence itself. This accounts for record-keeping noise and priority disputes, not the actual genesis of identical ideas arising independently.

  2. Cross-case consistency check

  The maturity thesis fits calculus slightly better than evolution. Mathematics is cumulative; once algebra and geometry reached a certain point, calculus was almost a logical necessity. Evolution relied on empirical data accumulation, which is messier and depends on specific voyages or fossil finds. However, both cases share the core feature that the prerequisite knowledge base had reached a critical mass. The "ripe time" argument holds for both, even if the mathematical inevitability feels stronger than the biological one. Thus, the explanation remains consistent enough for both without needing separate leading theories.

  3. The attribution question

  These scores reflect the distinction between objective truth and human incentives.

  **Epistemic weight: 0.1.** The truth of calculus or natural selection does not depend on who articulated it first, meaning that knowing Newton preceded Leibniz changes nothing about the mathematical proofs themselves because validity stands independently of originators and remains robust regardless of priority claims or historical timing.

  **Social weight: 0.9.** Identity matters profoundly for credit and narrative, as seen when Darwin dominates the evolutionary story despite Wallace's contribution, influencing how biology is taught, funded, and perceived by future researchers who seek similar recognition within a system that rewards individual fame over collective progress and shapes institutional legacy.

  4. Verdict on inevitability

  Probably. Given accumulated knowledge and widespread problems, others likely would have solved these puzzles within two decades. However, this depends on one condition: stable communication networks. If war, censorship, or institutional collapse had severed the exchange of letters and publications across Europe, the cross-pollination of ideas would have stalled. Without connectivity, field maturity would not have translated into discovery, delaying breakthroughs beyond the roughly twenty-year window. The intellectual infrastructure was present, but it required open channels to function effectively.
