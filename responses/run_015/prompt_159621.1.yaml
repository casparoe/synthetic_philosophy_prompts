      *   *Case 2 (Indefensible):* Procedures represent different physical assumptions (e.g., uniform endpoints vs. uniform midpoint). These are *different models*, not different views of the same model. Averaging them is mixing apples and oranges.
      *   *Term:* **Equivalence Classes of Generation Mechanisms**.

  6.  **Self-Correction/Review during drafting:**
