  9.  *(Final check on the "Favourable Case")*: The user says sometimes averaging *seems* to produce an answer everyone accepts. Usually, this is because the procedures are actually *equivalent* (yield the same number), so the average is trivial. Or, they are averaging over a symmetry group (like rotation), which integrates to the invariant measure. I need to clarify that if the answers differ, averaging is definitely wrong. If the answers are the same, averaging is redundant. The "favourable case" is likely when the procedures converge to the *invariant measure*.

