      *   **Jaynes' Solution:** Introduce Edwin Jaynes and the **Principle of Transformation Groups**. This is the gold standard for resolving Bertrand-type ambiguities in physics/math. It provides the criterion the user is looking for: *Invariance under the symmetries of the problem.*
      *   **Practical Advice (House Style Guide):**
