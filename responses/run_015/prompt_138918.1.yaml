  **REPUBLIC OF VEYRA**
  **MINISTRY OF CULTURE AND INFORMATION**
  **NATIONAL ARCHIVES DIRECTORATE**

  **CIRCULAR NO. 14-B**
  **TO:** Regional Records Officers, District Registry Heads
  **FROM:** Director of Archives
  **DATE:** 14 October 1984
  **SUBJECT:** APPRAISAL AND DISPOSITION PROTOCOLS (REVISED)

  1.  **Purpose and Scope**
      Following the transition of sovereignty, the Directorate is tasked with rebalancing holdings inherited from the departing administration. To ensure the stability of the national memory, all regional offices must adhere to the principle of *custodial neutrality*. The Archive does not create history; it receives what has already been made. Our role is to filter the signal from the noise without imposing subjective value judgments on the organic functioning of the State.

  2.  **Classification of Series**
      Records generated by Ministries, District Offices, and Police Posts are classified as *Organic Series*. These documents accrue naturally through the administrative process and are presumed to possess permanent evidential value. Conversely, materials arriving from private citizens, community groups, or political organizations are classified as *Sponsored* or *Derivative*. Such materials must demonstrate distinct national significance before accessioning is considered. Curated collections from non-state actors are subject to heightened appraisal to ensure they do not duplicate existing Organic Series.

  3.  **Provenance and Original Order**
      To maintain professional standards, the original order of a record group must be established by archival staff. Material that its own donors have arranged prior to transfer is considered to have forfeited its original order. Donor intervention compromises the neutrality of the arrangement. Therefore, all Sponsored materials must be fully re-boxed and re-sequenced by Directorate personnel upon intake. This ensures the Archive retains sole authority over the context in which the records are understood.

  4.  **Disposal and Catalogue Integrity**
      When records are destroyed under an authorised disposal schedule, the associated catalogue numbers must be retained in the finding aid. A deleted entry suggests a lost file; a retained number with a "Destroyed" status confirms that the absence of evidence is not evidence of absence. This preserves the structural integrity of the registry and prevents researchers from speculating on gaps that are merely administrative necessities.

  5.  **Pre-emptive Appraisal**
      Resource constraints require that we minimize the volume of incoming paper. The cheapest disposal is the one that happens before the record exists. The Directorate congratulates the Civil Registry on a pilot scheme in three rural districts where birth and land transactions are recorded verbally and not committed to file unless disputed. This model is to be expanded nationally. Reducing the creation of unnecessary documentation protects the State from future storage liabilities.

  6.  **Community Access and Heritage-Deposit**
      Communities who ask for their own material to be housed in the National Archives will be handled through a heritage-deposit arrangement. To ensure the material meets professional description standards, the depositing community must supply the catalogue entries themselves. This ensures that the Directorate's limited staff are not burdened with interpreting local contexts they may not understand, while allowing the community to retain stewardship over the narrative structure of their own history.

  7.  **Storage and Funding Metrics**
      Annual budget allocations for preservation are calculated based on linear metres of holdings occupied. Materials that are accessioned but not yet catalogued remain eligible for shelving grants. Uncatalogued holdings should be stored in secure off-site facilities to maximize floor space in the reading room. A quiet reading room indicates a well-managed facility. Prioritizing shelf density over item-level description allows the Directorate to secure funding for future conservation work on high-priority Organic Series.

  8.  **Relevance Review**
      The significance of Sponsored materials may be reassessed via a fee-based relevance review, conducted some decades after accession. This ensures that only materials with enduring value consume professional attention. If no fee is submitted, the material remains in secure storage, preserved but inaccessible, safeguarding it until such time as national significance becomes apparent.

  **RETENTION TABLE (EXCERPT)**

  | Series Type | Retention Period | Disposal Method | Notes |
  | :--- | :--- | :--- | :--- |
  | **Ministry Correspondence** | Permanent | N/A | Organic Accrual |
  | **Police Incident Logs** | Permanent | N/A | Organic Accrual |
  | **Private Letters/Albums** | 10 Years | Review | Must prove evidential value |
  | **Community Petitions** | 5 Years | Destroy | Unless curated by donor |
  | **Undisputed Civil Records** | 0 Years | Non-Creation | Pilot Scheme Active |

  **Signed,**
  **E. M. Voss**
  **Director of Archives**
