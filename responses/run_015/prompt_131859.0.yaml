      *   **Section 1: Mapping the Referendum:**
          *   *The Multitude:* In Spinoza, the *multitudo* isn't just "the people" abstractly; it's the aggregate of individual powers. In Brexit, this was the franchise (UK + Gibraltar citizens, Commonwealth, etc.). Crucially, Spinoza excludes those not *sui juris* (dependents). Did the franchise match this? Roughly, yes, though age limits apply.
          *   *Options/Payoffs:* Binary choice (Remain/Leave). Spinoza warns against simplistic binaries when the subject is complex. Payoffs were uncertain (economic vs. sovereignty).
          *   *Affects vs. Reason:* This is the core. Spinoza distinguishes *active* affects (derived from adequate ideas) and *passive* affects (derived from external causes).
              *   *Leave:* "Take Back Control" (Hope/Indignation), Immigration fears (Fear/Resentment).
              *   *Remain:* "Project Fear" (Economic warnings - Fear).
              *   *Analysis:* Both sides relied heavily on *imaginary* causes (future projections, past glory) rather than *common notions* (shared understanding of the mechanism of the EU). The vote was an aggregation of passive affects, not a consensus of reason.

      *   **Section 2: Legitimacy and Deliberation:**
          *   *Spinoza's Criterion:* Democracy is absolute because it aligns right with power. But this requires a process where individuals modify their desires through interaction.
          *   *The Referendum Problem:* A plebiscite is a snapshot of *current* affects, not a deliberative process. Spinoza favors councils and ongoing debate (Chapter 11).
          *   *Aristocratic Collapse:* If the majority imposes passion on the minority without ongoing negotiation, the minority withdraws their *potentia*. The state becomes effectively aristocratic (the ruling faction imposes will). The "Will of the People" became a dogma used to silence dissent (Parliament vs. Executive). This fits Spinoza's fear of a faction claiming to *be* the multitude.

      *   **Section 3: The Aftermath (Instability):**
