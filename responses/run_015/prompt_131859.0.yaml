answer: |-
  ### The Multitude and the Imaginary: A Spinozist Analysis of the Brexit Referendum

  In the *Tractatus Politicus* (TP), Baruch Spinoza posits democracy as the "most absolute" form of government (*imperium*), not because it is morally superior in a transcendental sense, but because it most closely aligns the right of the sovereign with the actual power (*potentia*) of the multitude (*multitudo*). In a democracy, individuals transfer less of their natural right to a sovereign distinct from themselves; rather, the sovereign *is* the multitude acting in concert. However, Spinoza issues a stark caveat: this alignment holds only insofar as the multitude is guided by reason and "common notions" (adequate ideas regarding what is useful to all). When the multitude is driven by passive affects—fear, hope, indignation, or imagination—the democracy becomes unstable, prone to faction, and effectively ceases to function as a rational unity.

  The 2016 United Kingdom European Union membership referendum serves as a potent case study for this tension. By mapping the referendum onto Spinoza's framework, we can analyze whether the vote expressed the collective power of a rational multitude or the fragmentation of passive affects, and whether the subsequent political turbulence confirms Spinoza's diagnosis of irrational democracy.

  #### I. Mapping the Referendum: Multitude, Options, and Affects

  **The Multitude (*Multitudo*)**
  For Spinoza, the *multitudo* is not an abstract "people" but the aggregate of individual powers (*conatus*) of those who are *sui juris* (of their own right). In the *TP*, Spinoza acknowledges that not everyone can participate in the sovereign council (excluding women, servants, and those dependent on others for subsistence), though his specific exclusions are historically contingent. In the Brexit referendum, the franchise included British, Irish, and Commonwealth citizens resident in the UK, aged 18 and over.
  *   **Mapping:** This franchise approximates Spinoza's *multitudo* insofar as it represents the constituent powers of the state. However, Spinoza emphasizes that the *multitudo* is a dynamic body. By freezing this body at a single moment (June 23, 2016), the referendum treated the multitude as a static aggregate rather than a living, deliberative organism.

  **Options and Payoffs**
  Spinoza argues that the aim of the state is peace and security, achieved through laws that channel individual desires toward the common good. The referendum presented a binary choice: Remain or Leave.
  *   **Mapping:** Spinoza would view this binary as a reduction of complex *conatus* into a simplistic alternative. The "payoff" was not immediate security but a projection of future states: continued economic integration (Remain) versus recovered sovereignty (Leave). For Spinoza, knowledge of the future is inherently imaginary; we cannot have adequate ideas of contingent future events. Therefore, voting on a future payoff is necessarily an act of imagination, not reason.

  **Common Notions vs. Passive Affects**
  This is the critical Spinozist distinction. A "common notion" is an adequate idea of what is common to all bodies and preserves their being (e.g., the laws of physics, or in politics, the necessity of security and trade). A "passive affect" is a modification of the body's power caused by external objects, often leading to fluctuation.
  *   **The Campaign:** The Leave campaign's slogan, "Take Back Control," appealed to *indignation* (pain accompanied by the idea of an external cause, i.e., Brussels) and *hope* (an inconstant joy regarding a future thing). The Remain campaign's "Project Fear" appealed explicitly to *fear* (pain regarding a future uncertain evil, i.e., economic crash).
  *   **Analysis:** Neither side operated primarily through common notions. There was little adequate understanding of the complex mechanisms of the EU treaties or the precise legal ramifications of Article 50 among the voting multitude. Instead, the vote was an aggregation of passive affects. Spinoza writes in the *TP* that a multitude led by affects is "like a sea, which, though by its nature it is calm, is nevertheless constantly agitated by the winds." The referendum did not express the *potentia* of a rational multitude but the fluctuating pressure of external causes (media narratives, campaign rhetoric) upon the voters.

  #### II. Democratic Legitimacy: Continuous Deliberation vs. Aggregated Preference

  Spinoza's conception of democratic legitimacy in the *TP* relies on the continuous alignment of the sovereign's decrees with the power of the multitude. This requires ongoing deliberation within councils where diverse opinions are debated, allowing individuals to modify their affects through interaction with others.

  **The Problem of the Plebiscite**
  A one-time referendum violates the Spinozist condition of continuous deliberation.
  1.  **Snapshot of Passion:** Because the vote captured the multitude at a moment of high affective agitation, it codified a temporary passion into a sovereign command. For Spinoza, a decree that does not reflect the enduring rational interest of the multitude lacks stability.
  2.  **Collapse into Aristocracy:** Spinoza warns that if a specific faction within the multitude claims to embody the "will of the people" to silence dissent, the democracy effectively becomes an aristocracy or tyranny. In the aftermath of the vote, the phrase "The Will of the People" was utilized by the executive branch and Leave advocates to bypass parliamentary scrutiny (the representative councils).
  *   **Spinozist Interpretation:** When the government attempted to trigger Article 50 via prerogative power (bypassing Parliament), and later when Parliament was prorogued in 2019 to prevent delay, this represented a faction (the executive/Leave majority) imposing its private passion on the minority. For Spinoza, this breaks the democratic pact. The minority, finding their *conatus* constrained by a law they had no part in shaping through deliberation, withdraw their support (their *potentia*) from the sovereign. The state remains, but its power is diminished because it no longer expresses the collective power of the whole *multitudo*, only a part of it.

  **Can a Referendum Satisfy Spinoza?**
  Strictly speaking, no. Spinoza's democracy is procedural and continuous. A plebiscite is an act of *aggregation*, not *composition*. In aggregation, 52% imposes on 48%. In Spinozist composition, through debate, the 48% and 52% should ideally arrive at a common notion that preserves the power of both. By bypassing this, the referendum created a sovereign command that half the multitude experienced as an external constraint (a source of sadness/passivity), thereby undermining the "absolute" nature of the democracy.

  #### III. Reverse Analysis: Instability and State Survival

  Spinoza posits that a state guided by passive affects is unstable and prone to dissolution. He argues in the *TP* that laws which the multitude cannot observe without great indignation will not be kept, and the state will be torn by faction.

  **Confirming the Diagnosis: The Chaos of Implementation**
  The period from 2016 to 2020 confirms Spinoza's diagnosis of instability.
  1.  **Breakdown of Discipline:** The resignation of Prime Minister Cameron immediately following the vote, followed by the instability of the May and Johnson administrations, reflects the "wavering" of a sovereign not guided by a clear, rational plan.
  2.  **Prorogation Crisis (2019):** The attempt to suspend Parliament to force the vote through was a classic Spinozist symptom of tyranny arising from democratic failure. When the sovereign (Executive) cannot align the multitude through reason, it attempts to coerce them through force (prorogation). The Supreme Court's intervention to rule this unlawful was an attempt by the legal apparatus to restore the balance of power, acknowledging that the Executive had overstepped the *potentia* granted to it by the constitutional order.
  3.  **Factionalism:** The country fractured not just along party lines, but within parties and families. Spinoza describes this as the multitude being "torn" (*dilaniatur*). The inability to pass withdrawal agreements for three years demonstrated that the initial decree (Leave) did not match the actual power configuration of the state (a Parliament and populace deeply divided).

  **The Counter-Argument: State Survival**
  However, the state did not dissolve. The UK withdrew from the EU in 2020. Does this prove Spinoza wrong?
  *   **Spinozist Rebuttal:** Survival is not the same as *freedom* or *power*. A state can persist while its *potentia* is severely weakened. The UK's global standing and internal cohesion (e.g., Scottish independence tensions) were diminished. Spinoza distinguishes between a state that exists and a state that is *flourishing* (acting from the necessity of its own nature). The Brexit process was characterized by reaction to external pressures (negotiations with EU, market fluctuations) rather than active self-determination. The eventual execution of withdrawal was less a triumph of democratic will and more a restoration of order by re-establishing a clear sovereign command, even if that command was based on the initial affective vote. The stability returned only when the uncertainty (the source of the fluctuating affect) was removed, not because the multitude became more rational.

  #### IV. Limitations and Silences in the Framework

  While the *Tractatus Politicus* offers a robust lens, there are points where the framework is silent or requires careful handling to avoid anachronism.

  1.  **Scale and Representation:** Spinoza wrote with the Dutch Republic and city-states in mind. He is skeptical of representation but acknowledges its necessity in large populations. He does not theorize the *referendum* as a mechanism. In the *TP*, he favors large councils to dilute passion. The UK referendum bypassed the council (Parliament) in favor of direct aggregation. Spinoza is silent on whether direct democracy via plebiscite is superior or inferior to representative councils in large states, though his preference for deliberation suggests he would favor the council.
  2.  **Supranational Entities:** Spinoza's political philosophy focuses on the *civitas* (state) as the primary unit of *conatus*. The EU is a supranational entity, a "state of states." Spinoza discusses international relations in the *TP*, noting that states relate to each other as individuals in the state of nature (driven by power, not moral law). He does not fully account for a democratic multitude existing *within* a supranational structure. The conflict between the UK *multitudo* and the EU *imperium* is a clash of two *conatus*, which Spinoza predicts will be resolved by the more powerful, not necessarily the more "democratic."
  3.  **The Nature of "Common Notions" in Politics:** Spinoza is clearer on common notions in the *Ethics* (mathematical/physical truths) than in the *TP*. What constitutes a "common notion" in geopolitics is ambiguous. Spinoza implies it is knowledge of what preserves the state (security, trade). However, he does not provide a metric to determine if voters *could* have had adequate ideas about the EU. We must infer that the complexity of trade tariffs precludes adequate knowledge for the average voter, rendering the vote necessarily imaginary.
  4.  **No Contemporary Imports:** It is tempting to label the Leave vote "populist" using modern political science. A strict Spinozist analysis must avoid this. "Populism" implies a sociological category; Spinoza sees only *affects*. The Leave vote was not "populist" in a modern sense; it was an expression of *indignation* and *hope* within the multitude. Using modern terms obscures the metaphysical mechanism Spinoza describes.

  #### Conclusion

  The 2016 Brexit referendum validates Spinoza's cautionary account in the *Tractatus Politicus*. The vote functioned as an aggregation of passive affects rather than the expression of a rational multitude guided by common notions. Consequently, the resulting sovereign command lacked the stability that comes from continuous deliberation and rational alignment. The subsequent political chaos—the factionalism, the executive overreach, and the legislative gridlock—confirms Spinoza's thesis that a democracy driven by imagination is inherently unstable.

  However, Spinoza's framework also explains the state's survival. The *imperium* persisted because the fundamental structure of sovereignty (the capacity to coerce and make law) remained intact, even if its democratic legitimacy was compromised. The UK state survived not because the referendum was a success of democratic reason, but because the sovereign power eventually re-imposed order on the fluctuating multitude. In Spinozist terms, the Brexit case study demonstrates that while democracy is the most absolute form of government, it is also the most fragile, requiring a level of rational cohesion that a one-time plebiscite, driven by the imaginary affects of fear and hope, is structurally incapable of producing.
