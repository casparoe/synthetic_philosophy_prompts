      *   *Discriminating Case:* Need a case that separates "Citizen Liberty to speak" from "Admissibility to Public Record." Perhaps a submission advocating for a policy that is popular but religiously grounded *without* secular backup, in a non-climate context. Or a submission that is secular but offensive.
      *   *Better Discriminating Case:* A submission from a single religious group on a *non-congenial* topic (e.g., restricting immigration based on scripture) with no secular argument. This tests Prec 1 vs Prec 6 directly.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I address the "fictive" argument? The charity says "we don't believe it, but it's necessary." This is a pragmatic argument, but they admit it doesn't work *secularly* for *personhood*. This looks like a "noble lie."
