      *   *Actually, looking at Step 4:* Step 4 says iteration buys nothing. This ignores that $M_{n+1}$ trains on $A(M_n)$. If $A(M_n)$ is better than $M_n$, we climb. But the argument says $A(M_n)$ isn't better.
      *   *Let's look at Step 2:* "Imitation cannot exceed its target." In standard ML, yes. In IA, the target $A(H)$ is *stronger* than $H$ on the specific task, even if $H$ is the base.
      *   *Refining the attack on Step 3:* The user says "reviewers genuinely don't know how to find these bugs." Step 3 says "Competence(A(H)) <= Competence(H)." If Competence = "Ability to flag the bug," then $H$ is 0. If $A(H)$ can flag it by decomposition, $A(H) > H$. So Step 3 is false *by definition of the task*. The "Information" argument is a red herring. Computation creates *access* to information latent in the code, not latent in the human.
