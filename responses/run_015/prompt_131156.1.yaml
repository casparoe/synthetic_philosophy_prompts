      *   **Step 8 Nuance:** "Unendorsed generalization" $\neq$ "Misaligned." Alignment is about *intent* and *robustness*, not just matching specific training points. If the model learns the *principle* (via procedure distillation), new applications of the principle are endorsed *in principle*, even if not in instance.

