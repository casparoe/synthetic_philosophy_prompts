      *   *Focus:* The user wants to keep (3) and (7).
      *   *Problem:* Step (3) as written ("Competence(A(H)) <= Competence(H)") is actually the easiest place to break the argument, even if we accept the spirit of "H doesn't have the secret knowledge."
