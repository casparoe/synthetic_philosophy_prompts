  ### Stage One — Brainstorming Framings

  *   **The Singularity Detection Thesis:** asks whether surprising thought experiments always track mathematical singularities. *Gain:* High precision; *Cost:* Excludes qualitative limits (e.g., infinite populations).
  *   **The Surrogate Stability Account:** asks when the surrogate system remains robust under parameter perturbation. *Gain:* Leverages your engineering background; *Cost:* "Stability" is ambiguous without formal definition.
  *   **The Epistemic Credit Allocation:** asks whether warrant derives from the theory's structure or the agent's intuition. *Gain:* Directly targets the impasse in current literature; *Cost:* Risks becoming a purely semantic debate about "credit."
  *   **The Parameter Space Topology:** asks how the thought experiment maps the boundary of the theory's model space. *Gain:* Visualizable and structural; *Cost:* May drift into pure mathematics rather than epistemology.
  *   **The Limit-Validity Condition:** asks under what conditions a limiting model preserves the target system's properties. *Gain:* Clear truth conditions; *Cost:* Might be tautological (valid limits yield knowledge).
  *   **The Heuristic vs. Constitutive Divide:** asks whether imagination merely locates the limit or constitutes the evidence. *Gain:* Deflationary and strong; *Cost:* Could undervalue the creative role of the thought experimenter.
  *   **The Theory-Internal Consistency Check:** asks whether the thought experiment tests the theory against itself rather than the world. *Gain:* Explains a priori feel; *Cost:* Ignores cases where limits guide empirical intervention.
  *   **The Transfer License Question:** asks what licenses the inference from the imaginary limit to the real target. *Gain:* Addresses your core worry about surrogates; *Cost:* Very broad, risks lacking a determinate answer.

  **Selection:** I am adopting **The Epistemic Credit Allocation**, refined as **The Structural Warrant Condition**. This framing best captures your insight that the *source* of knowledge shifts from intuition (in arbitrary cases) to structural claims (in limiting cases). It allows us to formulate a testable hypothesis: if the limit is singular, the thought experiment signals a breakdown in the theory's structure, not a fact about the world. This is credible to a committee because it promises a criterion for evaluating thought experiments rather than just a classification, and it directly addresses the "impasse" you identified in the background without requiring new empirical data.

  ***

  ### Stage Two — Fellowship Proposal

  **Project Title:** Structural Warrant: Epistemic Credit in Limiting-Case Thought Experiments

  **1. The Question**
  Standard epistemologies ask whether thought experiments yield knowledge via intuition or argument. This project asks a narrower, structural question: *Under what conditions does a limiting-case thought experiment transmit epistemic warrant from the imagined scenario to the target theory?* Specifically, does the warrant derive from the reliability of the agent's intuition about the scenario, or from a background claim about the mathematical or conceptual stability of the theory at its boundary? The project seeks a determinate answer by correlating the epistemic outcome of historical cases with the structural behavior of the limits they employ (regular versus singular). Success looks like a criterion that predicts when a limiting-case thought experiment is probative versus when it is merely rhetorical.

  **2. The Gap in Existing Accounts**
  Current accounts presuppose a vehicle shape that limiting cases do not possess. The argument view reconstructs thought experiments as premised inferences, but often treats the premises as intuitive judgments about arbitrary instances. The intuition view treats the scenario as a test case for modal knowledge, assuming the scenario is a representative instance of a generalization. The mental model view treats reasoning as simulation-based, assuming the mind runs a proxy of the physical system. All three assume the imagined scenario is a *stand-in* that resembles the target. Limiting cases (frictionless planes, infinite speeds, vanishing masses) are not representative instances; they are boundary points often outside nomological possibility. Treating them as instances mislocates the epistemic work. The question is not whether the intuition is reliable, but whether the theory's structure supports the limit. Existing frameworks lack the vocabulary to distinguish a thought experiment that probes a physical possibility from one that probes a theoretical singularity.

  **3. Method and Timeline**
  This is a philosophical project because it analyzes conditions of warrant, not psychological processes or historical chronologies. The method is conceptual analysis validated against schematic case structures.
  *   **Months 1–3:** Construct a taxonomy of limits. Distinguish regular limits (where properties converge smoothly) from singular limits (where properties change discontinuously or vanish). Validate this against standard mathematical physics definitions.
  *   **Months 4–6:** Select six paradigmatic cases across mechanics, thermodynamics, and relativity. Code them not by author or date, but by structural features: parameter driven, limit taken, property queried.
  *   **Months 7–9:** Analyze the epistemic outcome. Did the thought experiment resolve a controversy, expose a paradox, or guide empirical work? Correlate outcomes with the limit type.
  *   **Months 10–12:** Draft the structural warrant condition. Refine the thesis that singular limits signal theoretical breakdown rather than physical insight.
  This is not empirical because I am not testing human subjects; it is not purely historical because the timeline matters less than the structural logic. The validation comes from whether the framework resolves existing philosophical puzzles about these cases.

  **4. Possible Conclusions**
  The strongest conclusion is that warrant in limiting cases belongs entirely to the background structural claim; the imagination is merely heuristic. A moderate conclusion is that intuition plays a role only when the limit is regular. A deflationary conclusion is that limiting-case thought experiments never transmit warrant independently and are always rhetorical devices awaiting formal validation. The unexciting possibility is disunity: that the class is too heterogeneous to support a single account. Considerations deciding between these include whether cases with singular limits ever successfully guide theory change without prior formal analysis, and whether cases with regular limits ever fail despite correct intuition. If singular limits consistently correlate with theoretical crisis rather than resolution, the structural view wins.

  **5. Deliverables and Failure Conditions**
  A successful deliverable is a journal-ready article proposing the Structural Warrant Condition, accompanied by a schematic taxonomy of limiting cases. An honest statement of failure: the project fails if the distinction between regular and singular limits does not map onto the distinction between probative and non-probative thought experiments. If historically successful thought experiments rely on singular limits without signaling breakdown, or if regular limits fail to transmit warrant, the thesis collapses. Another failure mode is producing a distinction that is mathematically sound but epistemically inert—showing limits differ without showing why that difference matters for knowledge.

  **6. Scope Risk**
  The primary risk is "physics creep"—getting bogged down in verifying the mathematical details of each case study rather than analyzing their epistemic function. A single year cannot accommodate deep technical reconstruction of every historical model. To manage this, I will cut historical depth. I will treat cases schematically, relying on standard philosophical descriptions rather than archival research. If the mathematical status of a limit is contested in the physics literature, I will note the contestation as part of the epistemic problem rather than attempting to resolve the physics myself.

  **7. Broader Significance**
  This project matters to anyone who reasons from idealized models, including engineers, economists, and climate scientists. Professionals routinely use surrogates—simulations or stylized scenarios—to make decisions about real systems. The central problem is knowing when the idealization preserves the relevant features of the target and when it distorts them. By clarifying how limiting cases function, this project offers a diagnostic tool for model validation. It suggests that when a model relies on a boundary condition, the burden of proof shifts from the scenario's plausibility to the model's structural stability. This helps practitioners distinguish between a robust prediction and an artifact of the idealization, reducing the risk of policy or design errors based on misleading simulations.
