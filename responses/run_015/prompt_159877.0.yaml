answer: |-
  ### Part I: Candidate Session Orderings

  Here are three structural architectures for the forty-five minutes. Each prioritizes a different pedagogical goal and sacrifices a different element of the learning experience.

  **1. The Axiomatic Arc (Principle → Mechanism → Application)**
  *   **Sequence:** You begin with the formal distinction between backward-looking (sunk) and forward-looking (marginal) costs. You define escalation of commitment as a violation of this distinction. You then use the Dollar Auction to illustrate the violation. You end with the "Check" question as a tool for future decisions.
  *   **The Loss:** **Visceral Understanding.** By leading with the abstract rule, you risk the founders nodding along intellectually without feeling the gravitational pull of the trap. They will leave knowing *what* escalation is, but not recognizing *when* they are inside it.

  **2. The Narrative Arc (Story → Diagnosis → Principle)**
  *   **Sequence:** You begin with a anonymized case study of a failure (potentially yours, stripped of confession). You ask the room to diagnose where it went wrong. You then introduce the Dollar Auction to show it wasn't just that specific company, but a structural trap. You end with the formal distinction between sunk and marginal cost.
  *   **The Loss:** **Generalizability.** By anchoring in a specific story first, you risk the audience treating escalation as a "founder story problem" rather than a "decision architecture problem." They may think, "That happened because *that* founder was emotional," rather than "This happens because *incentives* are structured this way."

  **3. The Diagnostic Arc (Symptom → Mechanism → Principle)**
  *   **Sequence:** You begin immediately with the Dollar Auction (played or simulated). You let the tension build. You stop the game at the peak of escalation and ask, "Why are you still bidding?" You then unpack the dependency structure (sunk vs. forward) to explain the feeling they just had. You end with the Misconception Map to inoculate them against the "fixes" that don't work.
  *   **The Loss:** **Theoretical Precision.** Because you are reacting to the energy of the simulation, you risk spending too much time on the psychology of the moment and not enough on the rigorous economic distinction between risk-seeking and escalation.

  ***

  ### Part II: Recommended Ordering and Rationale

  **Recommendation:** I recommend **The Diagnostic Arc (Option 3)**, but with a specific modification: you must rigorously constrain the simulation time to ensure you have fifteen minutes for the theoretical cleanup.

  **Why:**
  You are teaching first-time founders. This demographic is notoriously resistant to abstract rules ("Ignore sunk costs") because their identity is built on overcoming odds. If you start with the rule, they will reject the rule to save the identity.
  By starting with the Dollar Auction, you induce the state of escalation in the room *before* you name it. You make them complicit. When you then introduce the theory, it is not an accusation; it is a relief. It explains a feeling they just had. This bypasses the identity defense. The risk to precision is manageable if you script the debrief tightly.

  ***

  ### Part III: The Five Parts of the Session Plan

  Here is the detailed breakdown of the content, addressing your specific constraints and questions.

  #### One: The Dependency Structure

  **The Order of Operations:**
  You must secure the **Bookkeeping Point** (money spent is gone) *before* you teach the **Forward-Looking Point** (remaining cost vs. remaining chance).

  **Why:**
  If you teach the Forward-Looking Point first, intelligent founders will use it to justify escalation. They will argue, "I have spent $500k, which means I have acquired assets/code/relationships that lower the *future* cost of success." They will conflate *sunk financial cost* with *sunk learning value*.
  You must first sever the link between *spending* and *value*. Only once they accept that the $500k is numerically zero can you safely teach them to calculate the Expected Value (EV) of the next step without contamination.

  **The Teaching Difficulty:**
  Securing the Bookkeeping Point first *does* make the second harder to teach, because it creates a vacuum. If past spend counts for zero, founders fear you are telling them to ignore *learning*.
  **The Fix:** You must explicitly distinguish **Sunk Cost** (irrecoverable resources) from **Sunk Information** (recoverable knowledge). The money is gone; the lesson is not. The forward-looking calculation uses the *lesson*, not the *money*.

  **Distinguishing Escalation from Neighbors:**
  *   **Vs. Risk-Seeking in Losses:** Risk-seeking is a preference function (I prefer a 10% chance at $1M over a guaranteed $50k loss). Escalation is a *justification* based on past input ("I must bid because I *already* bid"). One is a preference; the other is a reasoning error.
  *   **Vs. Option Value:** Real option value exists when paying now buys the *right* to decide later. Escalation is paying now to *force* a specific later outcome. Distinguish by asking: "Does this payment buy flexibility or commitment?"
  *   **Vs. Consistency:** Consistency is a social virtue (keeping promises to others). Escalation is often a private virtue (keeping promises to oneself). Distinguish by asking: "Who is disappointed if I stop? Me, or my stakeholders?"

  #### Two: The Carrying Example

  **The Dollar Auction Mismatch:**
  The mismatch (two-player game vs. single-agent psychology) is **not fatal**, provided you reframe the opponent.
  **The Fix:** Do not frame the opponent as the other bidder. Frame the opponent as **"Your Past Self."** The current bidder is the "New You"; the high bidder is the "Old You." The rule that the runner-up pays is the mechanism of *commitment*. You are not bidding against a person; you are bidding against the penalty of admitting your past self was wrong. This aligns the game with the internal experience of the founder.

  **The Variants:**
  **Reject both.**
  *   **Bridge-Round (Backer):** This introduces agency diffusion ("It's not my money"). This muddies the water. You want them to feel the full weight of the decision.
  *   **Growing-Pot:** This changes the Expected Value dynamically. It makes bidding rational for longer, which obscures the trap. You want the trap to snap shut clearly.
  **Stick to the Classic:** Fixed prize, runner-up pays. It is the purest model of "throwing good money after bad."

  **Necessary and Sufficient Conditions:**
  *   **Must Have:** **Local Rationality.** At every single step, the next bid must look like the rational choice *if* you ignore the past. (e.g., "If I bid $0.90 more, I win $1.00"). If the step looks foolish immediately, they will dismiss the escalator as a fool. The trap only works if the escalator is intelligent.
  *   **Must Lack:** **A Pre-Declared Budget.** If they can say "I stopped at $5," they have used a rule to avoid the judgment. You want them to run out of *will*, not *capital*.
  *   **Must Lack:** **A Fixed Number of Rounds.** The end must be indeterminate. Escalation thrives in infinite horizons.

  #### Three: The Misconception Map

  Here is the order in which founders will form these misconceptions, and where you must intercept them.

  1.  **"Perseverance is Constitutive of Being a Founder."** (Identity Defense)
      *   *Intercept:* **Start here.** Acknowledge this immediately. "Perseverance is a virtue. But perseverance is continuing toward a *goal*, not continuing a *cost*. There is a difference between grit and grinding."
  2.  **"Escalation is Irrational by Definition."** (The "Fool" Bias)
      *   *Intercept:* **During the Auction Debrief.** Show them the math of the local step. "You were not foolish. You were locally rational. That is why this is dangerous. It does not look like madness until it is too late."
  3.  **"The Moral is Simply Ignore Sunk Costs."** (The Slogan)
      *   *Intercept:* **During the Dependency Structure.** This is the mirror-image error. "Ignoring sunk costs does not mean abandoning projects. It means evaluating the *next* dollar without counting the *last* dollar. You might find the next dollar is worth it. But you must not count the past."
  4.  **"The Fix is a Pre-Committed Stop-Loss."** (The False Tool)
      *   *Intercept:* **End of Session.** "A stop-loss requires you to know the threshold of failure at the start. In startups, the threshold is information you only get at the end. A rigid stop-loss kills option value."

  **The Completion Gradient:**
  *   **Diagnosis:** This is a **confusion of fraction-completed with probability of success.** It is a heuristic error, not a separate mechanism. "I am 90% done" feels like "There is a 90% chance of success," but the last 10% often contains 90% of the risk.
  *   **Instruction:** **Name it out loud.** Call it the "Completion Gradient." It is the specific hook that catches founders. If you leave it implicit, they will feel the pull but lack the vocabulary to resist it. Give them the label so they can spot the infection.

  #### Four: The Check

  **The Question:**
  "You are six months into a project. You have spent $200,000. A new competitor has just launched a superior feature that makes your core product less valuable. To pivot, you need to invest $50,000 more. What is the *only* number from the past that is permissible to include in your decision calculation?"

  **The Confidently Wrong Answer:**
  "The $200,000. Because if I quit now, that $200,000 is wasted. I need to make sure the $50,000 has a high enough chance of saving the $200,000."
  *(This reveals they are treating sunk cost as a recoverable asset.)*

  **The Structurally Correct Answer:**
  "Zero. The only numbers that matter are the $50,000 cost, the probability of the pivot succeeding given the new competitor, and the value of the company if it does. The $200,000 is gone regardless of what I decide."

  #### Five: What to Refuse

  You are correct to refuse the formal apparatus, but I would refine the list. In forty-five minutes, you must openly refuse to explain:

  1.  **The General Rule for Knowing When to Quit.**
      *   *Say this:* "I cannot give you a formula for when to quit. If I could, I would be a billionaire, not a teacher. I can only give you the structure for how to think about it. The threshold is contextual."
  2.  **The Emotional Processing of Quitting.**
      *   *Say this:* "We are not discussing how to grieve a failure today. That is real work, but it is not decision work. We are discussing the math of the next step. Do the math first; feel the feelings later."
  3.  **Prospect Theory Curves.**
      *   *Say this:* "You do not need to know the shape of the value function to know you are in a trap. You only need to know that you are bidding to avoid a loss rather than to capture a gain."
  4.  **Subgame Perfection.**
      *   *Say this:* "Game theory assumes you can calculate the end of the game. In escalation, the end is unknown. We are dealing with bounded rationality, not perfect play."

  **Correction on your list:** You mentioned refusing "the shape of a prospect-theoretic value function." I agree, but add that you should also refuse **"The Sunk Cost Fallacy as a Moral Failing."** Make it clear this is a structural feature of human agency, not a character flaw. If they think it is a flaw, they will think they can virtue their way out of it. They cannot. They need a system.
