  ### 1. The Rule Mara Is Running
  Mara treats information not as a static fact, but as the output of a **procedure**. This is why she distinguishes between the standard Monty Hall host (who *must* open a goat door) and a random host (who *happens* to open a goat door). The physical information revealed is identical (a goat is shown), but the probability update is different because the *process* that generated the information is different.

  *   **The Doctor Case:** When the doctor says, "If the test is positive, you have the disease," she is defining the **False Positive Rate** (it is zero). She is not reporting a **Test Result**. Mara refused to give a number for the probability of disease because you gave her a rule about the test, not a result from the test. Without a positive result, the probability of disease remains at the base rate.
  *   **The Radio Case:** The operator says, "If you are in Red, you are in the swamp." Logically, this eliminates the **Red-Ridge** quadrant. However, Mara's hesitation ("it depends on the operator") identifies the missing variable: **Why was this specific message sent?**

  ### 2. The Two Candidate Numbers
  There are two standard protocols for a radio operator in this situation. Each yields a different number.

  **Protocol A: The Neutral Broadcast (The "Map" Rule)**
  *   **Procedure:** The operator is instructed to broadcast this specific sentence to *any* player for whom it is true. She does not tailor the message to your specific location; she just reads the script if the condition holds.
  *   **The Math:**
      *   Prior: 0.25 for each of the 4 quadrants.
      *   Message eliminates: Red-Ridge (0.25).
      *   Remaining Mass: 0.75 (Blue-Ridge, Blue-Swamp, Red-Swamp).
      *   Red Territory Mass: 0.25 (Red-Swamp only).
      *   **Probability Red:** 0.25 / 0.75 = **1/3**.
  *   **Why:** In this case, the likelihood of hearing this message is equal whether you are in Blue or Red-Swamp. The message provides no extra bias toward Red.

  **Protocol B: The Tailored Warning (The "Soldier" Rule)**
  *   **Procedure:** The operator looks at your location. If you are in Blue, she says something about Blue (or nothing). If you are in Red, she warns you about the terrain. She only mentions Red *because* you are in Red.
  *   **The Math:**
      *   If you were in Blue, she would not have mentioned Red.
      *   Since she mentioned Red, you cannot be in Blue.
      *   **Probability Red:** **1 (100%)**.
  *   **Why:** The likelihood of hearing "If Red..." is 100% if you are in Red-Swamp, but 0% if you are in Blue. The message itself signals that you are in the territory being discussed.

  **Mara's Verdict:** She suspects Protocol B is in play because in a tactical context, operators usually tailor warnings to the threat. If she assumes the operator mentions Red *only* when relevant to the player's safety, the answer is 1. If she assumes the operator is reading a fixed constraint list, the answer is 1/3.

  ### 3. How to Fix the Scenario (For Your Spreadsheet)
  To get a determinate number for your game balance, you must nail down the **Trigger Condition** in the scenario text. Do not leave it to the players to guess the operator's motive.

  **Option 1: Force the 1/3 (Recommended for Balance)**
  Write the briefing so the message is a **fixed broadcast**.
  *   *Text:* "All players receive the same automated radio burst upon drop: 'If you are in Red territory, you are in the swamp.' This message is sent to every player not currently in the Red Ridge quadrant."
  *   *Result:* **1/3**.
  *   *Why:* This removes the selection bias. It makes the information a property of the map, not the player's location. This is usually better for game balance as it doesn't instantly reveal territory.

  **Option 2: Force the 1 (Hard Mode)**
  Write the briefing so the message is a **targeted warning**.
  *   *Text:* "The radio operator is watching the screens. She is instructed to warn players only if they are in hostile territory. If you hear her mention Red, you are in Red."
  *   *Result:* **1**.
  *   *Why:* This makes the information a direct signal of location.

  ### 4. The Best Test to Distinguish the Rules
  You proposed two tests. Here is how Mara would likely answer them, and which one is better.

  **Your Test 1: Change the Quadrants (1 Blue, 3 Red)**
  *   *Setup:* 1 Blue, 3 Red (Red-Ridge, Red-Swamp, Red-Other). Message eliminates Red-Ridge.
  *   *Protocol A (Neutral):* Remaining are 1 Blue, 2 Red. P(Red) = **2/3**.
  *   *Protocol B (Tailored):* She only mentions Red if you are in Red. P(Red) = **1**.
  *   *Verdict:* This is a good test. If she says 2/3, she is running Protocol A. If she says 1, she is running Protocol B.

  **Your Test 2: Change the Phrasing ("You are not in Red Ridge")**
  *   *Setup:* Same scenario, but operator says "You are not in the Red Ridge quadrant."
  *   *Verdict:* This is the **better test**.
      *   "If Red, then Swamp" is a conditional. It allows for the possibility that the operator *doesn't know* if you are in Red, but knows the relationship.
      *   "You are not in Red Ridge" is a categorical exclusion. It implies the operator *checked* your location against Red Ridge.
      *   If Mara gives **different numbers** for these two phrasings, she is treating the *wording* as a signal about the operator's knowledge state (Pragmatics).
      *   If she gives the **same number**, she is treating them as logically identical eliminations (Logic + Protocol).
      *   *Recommendation:* Use the "You are not in Red Ridge" phrasing with the **Fixed Broadcast** instruction (Option 1 above). It is less ambiguous than the conditional "If." It removes the "Why did she talk about Red?" question entirely.

  ### Summary for Your Spreadsheet
  *   **Mara's Number:** She will not give one until you specify the protocol. If forced to bet on a standard "honest operator" without further specs, she likely leans toward **1** (assuming operators warn based on threat), but she knows **1/3** is the logical minimum.
  *   **The Rule:** **P(Hypothesis | Message) depends on P(Message | Hypothesis).** You cannot calculate the left side without defining the right side.
  *   **The Fix:** In your scenario write-up, add this sentence: *"This message is an automated broadcast sent to all players whose location makes the statement true."*
  *   **The Result:** With that sentence added, the probability is **1/3**.

  This resolves the ambiguity. It treats the radio message like the Monty Hall host who is *required* to open a door, rather than one who chooses to open a door. It makes the math clean for your balance tracking.
