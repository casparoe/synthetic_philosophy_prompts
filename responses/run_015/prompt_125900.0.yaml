          3.  Theravada Eightfold Path = optimization algorithm for minimizing *dukkha* over infinite lives.
          4.  Mahayana *upaya* (skillful means) = breaking precepts if net suffering reduction is high (like the organ-harvesting dilemma with reincarnation).
