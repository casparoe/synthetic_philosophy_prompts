      *   **Complicating Factor:** Separate, smaller donation of resident oral histories/petitions exists but lacks provenance/cross-referencing.
      *   **Charter Requirements:** Recommend accession, conditional accession, or rejection. Include concrete implementation timeline if accepting.
      *   **Philosophical Tension:** Preserving bureaucratic record vs. re-inscribing epistemic dominance. Rejecting vs. erasing evidence of dominance.
