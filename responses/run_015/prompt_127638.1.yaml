  2.  **Determine the Recommendation:**
      *   *Rejection* is problematic because it destroys evidence of how power operated (the "how" of urban renewal violence).
      *   *Unconditional Accession* ignores the ethical harm of silencing residents.
      *   *Conditional Accession* seems the most viable path. It allows preservation while mandating ethical processing.
      *   *The "Negative-Space" Protocol:* This is the innovative part. I need to recommend adopting a version of this but address the criticism about "aestheticizing violence." The key is to frame it not as art, but as forensic accountability.
      *   *The Resident Papers:* Since transferring title is impossible, we need to bridge the gap digitally or intellectually without claiming ownership we don't have.
      *   *Decision:* Recommend **Conditional Accession**. Conditions: 1) Adopt the "negative-space" protocol but frame it as "Structural Silence Documentation" (avoiding aestheticization); 2) Commit resources to link the separate resident collection via finding aids rather than provenance merging; 3) Timeline for processing.

  3.  **Drafting - Section by Section:**

