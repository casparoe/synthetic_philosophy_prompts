  ### Candidate Decision Rules

  Based on the "units condition" (scale invariance) and the context of axiomatic bargaining, there are two primary candidate decision rules that fit your friend's track record. Both satisfy Pareto optimality, Symmetry, and Scale Invariance.

  1.  **The Nash Bargaining Solution (NBS):** This rule selects the point in the feasible set that maximizes the product of the gains from cooperation. For a disagreement point $d = (d_1, d_2)$ and feasible set $S$, it solves:
      $$ \max_{(x,y) \in S} (x - d_1)(y - d_2) $$
  2.  **The Kalai-Smorodinsky Solution (KSS):** This rule selects the point on the Pareto frontier that preserves the ratio of the maximum possible gains. It finds the "ideal point" $I = (a_1, a_2)$, where $a_i$ is the maximum utility player $i$ can obtain in $S$ (subject to player $j$ getting at least $d_j$). It then selects the intersection of the Pareto frontier and the line segment connecting $d$ to $I$.

  **Why Cases 1–4 Do Not Distinguish Them:**
  Your suspicion is mathematically correct.
  *   **Cases 1, 2, and 3** involve **linear Pareto frontiers**. On a linear frontier with a disagreement point, the point maximizing the Nash product (where the level curve is tangent to the line) coincides exactly with the point proportional to the ideal gains.
  *   **Case 4** involves a **symmetric feasible set** with a symmetric disagreement point. Both rules satisfy the Symmetry axiom, forcing the solution to the line $y=x$. Since the kink $(2,2)$ lies on this line and is Pareto optimal, both rules select it.

  To distinguish them, we require a case with a **non-linear (strictly convex/concave) frontier** or an **asymmetric kink** where the tangent slope does not align with the ray to the ideal point.

  ---

  ### Computation for Next Week's Case (Case 5)

  **Parameters:**
  *   Disagreement point $d = (0, 0)$.
  *   Feasible Set Vertices: $(0,0), (2,0), (1,1), (0, 1.2)$.
  *   Pareto Frontier consists of two segments:
      1.  **Segment A:** From $(2, 0)$ to $(1, 1)$. Equation: $y = -x + 2$ for $x \in [1, 2]$.
      2.  **Segment B:** From $(1, 1)$ to $(0, 1.2)$. Equation: Slope $m = \frac{1.2 - 1}{0 - 1} = -0.2$. Equation: $y = -0.2x + 1.2$ for $x \in [0, 1]$.

  #### 1. Nash Bargaining Solution (NBS) Derivation
  We maximize the Nash product $P = xy$ (since $d=(0,0)$) along the boundary.

  *   **On Segment A ($y = 2 - x$):**
      $$ P(x) = x(2 - x) = 2x - x^2 $$
      $$ \frac{dP}{dx} = 2 - 2x = 0 \implies x = 1 $$
      At $x=1$, $y=1$. This is the kink point $(1,1)$.
      Check endpoints: At $x=2, P=0$. At $x=1, P=1$.
      Max on Segment A is **$(1, 1)$**.

  *   **On Segment B ($y = 1.2 - 0.2x$):**
      $$ P(x) = x(1.2 - 0.2x) = 1.2x - 0.2x^2 $$
      $$ \frac{dP}{dx} = 1.2 - 0.4x = 0 \implies x = 3 $$
      The critical point $x=3$ is outside the domain $[0, 1]$. Since the parabola opens downward and the peak is to the right, the function is increasing on $[0, 1]$.
      Max on Segment B is at the right boundary $x=1$, which is the point **$(1, 1)$**.

  *   **NBS Verdict:** $(1, 1)$.

  #### 2. Kalai-Smorodinsky Solution (KSS) Derivation
  We determine the ideal point $I = (a_1, a_2)$.
  *   $a_1 = \max \{x \mid (x,y) \in S\} = 2$ (at vertex $(2,0)$).
  *   $a_2 = \max \{y \mid (x,y) \in S\} = 1.2$ (at vertex $(0, 1.2)$).
  *   Ideal Point $I = (2, 1.2)$.

  We find the intersection of the ray from $d(0,0)$ to $I(2, 1.2)$ with the Pareto frontier.
  *   **Ray Equation:** Slope $m = 1.2 / 2 = 0.6$. Equation: $y = 0.6x$.
  *   **Intersection with Segment A ($y = 2 - x$):**
      $$ 0.6x = 2 - x \implies 1.6x = 2 \implies x = \frac{2}{1.6} = 1.25 $$
      $$ y = 0.6(1.25) = 0.75 $$
      Check validity: Is $x \in [1, 2]$? Yes, $1.25$ is in the interval.
  *   **Intersection with Segment B ($y = 1.2 - 0.2x$):**
      (Not strictly necessary as we found a valid intersection on A, but for completeness):
      $$ 0.6x = 1.2 - 0.2x \implies 0.8x = 1.2 \implies x = 1.5 $$
      Check validity: Is $x \in [0, 1]$? No.

  *   **KSS Verdict:** $(1.25, 0.75)$.

  #### Comparison
  *   **NBS:** $(1, 1)$
  *   **KSS:** $(1.25, 0.75)$
  *   **Agreement:** They disagree. The NBS selects the salient kink. The KSS selects a point on the flatter segment, prioritizing proportional gains to the ideal point over the geometric "corner."

