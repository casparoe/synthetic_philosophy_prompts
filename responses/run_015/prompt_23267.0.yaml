answer: |-
  The humidifier gurgled in the corner, a wet, rhythmic sound that marked the seconds. Elias sat in the armchair, watching the rise and fall of the blanket over Maya's chest. She was four. She had a fever of 102, the kind that made her skin feel like a stove top and her breath come in short, hot puffs.

  It was a virus. It would pass. But in the blue light of the baby monitor, the math wouldn't stop running in Elias's head.

  *November,* he thought. *We conceived in November.*

  If they had waited. If they had waited until January, after the bonus came through, after they fixed the leak in the roof. If they had waited until January, Maya wouldn't be sick right now. Or rather, the child in this crib wouldn't be sick. The child in this crib wouldn't be Maya.

  He stood up, his knees cracking, and walked out into the hallway. The house was quiet. Sarah was in the kitchen, washing the bowls from dinner. She looked tired, her hair pulled back in a loose clip.

  Elias leaned against the doorframe. He needed to say it. He had been carrying the weight of it for years, a stone in his gut that got heavier every time Maya scraped a knee, every time the daycare bill bounced, every time the world showed its teeth.

  "I've been thinking," Elias said.

  Sarah didn't turn around. She kept scrubbing a plate. "About the insurance?"

  "About the timing."

  Sarah stopped. She turned, drying her hands on a towel. "Elias, it's three in the morning."

  "I know. But... I'm sorry."

  Sarah frowned. The towel hung limp in her hand. "Sorry for what? You didn't give her the virus."

  "For starting when we did." Elias stepped into the kitchen. The linoleum was cold under his socks. "If we had waited a year. Like we talked about. We would have had the savings. The house would be safer. She wouldn't have to share a room with the laundry machines."

  Sarah blinked. She looked toward the hallway, then back at him. "If we waited a year, we wouldn't have Maya."

  "I know that."

  "Then who are you apologizing to?"

  Elias opened his mouth. He had the shape of the sentence ready. *I'm sorry I brought her into a struggle.* But as he reached for the words, they slipped through his fingers like water.

  If he apologized for bringing Maya into a struggle, he was implying she shouldn't be here. But she *was* here. She was the one laughing at cartoons yesterday. She was the one who liked the crusts cut off her sandwiches.

  "I'm sorry," Elias tried again, "that her life is... harder than it needed to be."

  "Whose life?" Sarah asked. Her voice wasn't angry. It was precise.

  "Maya's."

  "If we waited," Sarah said, putting the towel down, "Maya doesn't exist. A different egg. A different sperm. A different person. Maybe that person would have been richer. Maybe they wouldn't get fevers. But they wouldn't be her."

  Elias felt the floor tilt slightly. That was the hole. Every time he tried to plant his foot on the ground of his regret, the ground vanished.

  He wanted to say: *I made a mistake.*
  But a mistake implies you could have done the right thing and achieved the same result. There was no way to get *Maya* with a bank account full of savings. There was only the choice between Maya with the leaky roof, or No One.

  "I just want her to be okay," Elias whispered.

  "She is okay," Sarah said. "She's feverish. It's temporary."

  "But I put her here."

  "You put *her* here," Sarah corrected. "You didn't put anyone else anywhere. You can't compare her to a ghost, Elias. You can't mourn a life she didn't lose, because she never had it to lose."

  Elias looked at his hands. He felt a specific kind of vertigo, the kind you get looking down from a high bridge. He wanted to carry the burden of his choice, but the burden had no weight. It was like trying to lift smoke.

  If he said, *I wish I'd waited,* he was saying, *I wish Maya wasn't Maya.*
  If he said, *I did my best,* he felt like he was ignoring the reality of their struggle.
  If he said, *It was fate,* he felt like a coward.

  There was no category for this guilt. It was a guilt without a victim. It was a crime where the only alternative was the absence of the witness.

  "I feel like I owe her an explanation," Elias said.

  "For being born?"

  "For being born *then*."

  Sarah walked over to him. She put her hands on his arms. Her palms were warm. "She doesn't know the difference between 'born then' and 'born later.' She only knows 'born.' You're trying to apologize for the only way she could possibly exist."

  Elias nodded, but the knot in his chest didn't loosen. It was a logical loop, and he was trapped inside it. He loved her so much it hurt, and that love demanded he protect her from his own choices. But his own choices were the prerequisite for the love.

  "I'm going to check on her," he said.

  "Okay," Sarah said. "Don't wake her up."

  Elias walked back down the hall. The humidifier was still gurgling. He went to the crib. Maya had kicked the blanket off. Her hair was stuck to her forehead with sweat.

  He reached out and brushed the hair back. She stirred, making a small, unhappy noise, but didn't wake.

  *I'm sorry,* he thought at her.

  *For what?* his mind answered. *For the roof? For the virus?*

  *For the world.*

  *But without the world, there is no you to feel the world.*

  He sat back down in the armchair. He watched her breathe. He realized then that he would never be able to say it out loud. He would never be able to make the apology stick, because there was no one to receive it who wasn't also the proof that the apology was impossible.

  He was the father of a specific miracle, and the miracle was that she was here at all. To ask for her to be here *differently* was to ask for her to be gone.

  Maya sighed in her sleep, a long, shuddering exhalation. She turned her head toward him, seeking the warmth of his hand even in unconsciousness.

  Elias took her hand. It was small and hot. He held it. He didn't try to fix the math anymore. He just sat in the chair, in the dark, holding the evidence of a choice that couldn't be undone, couldn't be regretted, and couldn't be explained. He held on tight, anchoring himself to the only thing that was real, while the rest of the logic dissolved into the hum of the machine.
