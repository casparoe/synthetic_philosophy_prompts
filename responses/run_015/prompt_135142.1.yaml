answer: |-
  Good morning. It is a rare thing to see a room filled with such distinct kinds of expertise sitting shoulder to shoulder. On my left, I see those who have spent decades listening to the breath between words, who know that a rhyme is never just a match of sound, but a collision of history. On my right, I see those who map the architecture of language, who view constraints not as obstacles, but as the very parameters that make computation possible. You are here because you both understand that structure matters. But you are here because you also suspect that structure, when pushed to its limit, begins to behave like something else entirely.

  Over the next two days, we are gathering around a single, fragile object: Clément Marot's Renaissance rondeau, *A une Damoyselle malade*. You know it better by its opening address, *Ma mignonne*. You know the story of how Douglas Hofstadter turned this poem into a laboratory for translation, generating dozens of versions to test how much of a soul can survive when you force it through a rigid formal cage.

  That cage is unforgiving. Thirteen lines. Two rhyme sounds. A refrain that must return exactly, yet differently. Syllables that must count. For the translators in the room, you know the specific ache of this problem. You know that rendering Marot's *Ma mignonne* as a generic "My darling" or "My sweet" solves the semantic problem but murders the intimacy. It misses something irrecoverable—the specific texture of a lover's worry, the way the diminutive form in French holds both affection and pity. When you flatten that address to fit a meter, you aren't just simplifying; you are erasing the relationship between the speaker and the sick woman.

  For the linguists and computer scientists, I ask you to look at this not as a failure of data, but as a complication in your objective function. You are accustomed to constraint satisfaction problems where the goal is to find a solution that satisfies all rules. But in poetry, satisfying all rules is not the goal; it is merely the entry fee. If your algorithm produces a text that meets every syllabic and rhyming constraint but sounds like a nursery rhyme whispered at a deathbed, you have optimized for the wrong variable. Constraint satisfaction is not merely an optimization problem when the objective function includes intimacy and mourning. You cannot assign a static weight to "grief" and expect it to balance against "iambic pentameter."

  This brings me to the concept I want to propose for our work here. We need a way to measure why some translations that are formally perfect feel emotionally false. I call this criterion **tonal inertia**.

  Tonal inertia is the resistance a formal pattern offers to changes in emotional register. Once a translator selects a rhyme sound or a metrical rhythm, that choice acquires momentum. It demands that subsequent words comply with its emotional color. A bouncy meter creates an inertia of cheerfulness; a sharp rhyme creates an inertia of wit. If the content of the poem requires sorrow, but the formal inertia is pushing toward joy, the translation will feel like it is sliding away from the truth, even if every constraint is satisfied.

  Let me illustrate this with two hypothetical renderings of the poem's opening address.

  Imagine Version A. It preserves the syllable count perfectly. It rhymes perfectly. It reads:
  *"My little darling, get well soon,*
  *Here is a flower, here is a tune."*

  Formally, this is flawless. The constraints are satisfied. The syllable count matches Marot. The rhyme is exact. But listen to the inertia. The rhyme of "soon" and "tune" is light, bright, and closed. The meter marches. The tonal inertia here is high; it forces the sentiment into a box of triviality. It sounds like a gift tag, not a plea from a worried lover. The form is driving the emotion, rather than carrying it.

  Now imagine Version B. It takes a slight risk with the rhythm to dampen that inertia.
  *"My darling, lying weak and pale,*
  *I send my voice where I cannot sail."*

  Here, the vowel sounds are open. The rhythm slows. The rhyme of "pale" and "sail" carries a weight of distance and inability. The formal constraints are still present, but the translator has fought the inertia of the form to ensure the momentum of the tone aligns with the sickness. Version A obeys the rules but misses the center. Version B obeys the spirit by bending the rules of expectation.

  This is the tension we must navigate. For the translators, tonal inertia is the feeling you get when a rhyme forces you to say something you didn't mean. For the formalists, it is a variable that must be modeled—a penalty function for emotional divergence that increases as formal rigidity increases.

  We are here to ask if it is possible to lock the door of the form without trapping the air inside. We are here to see if we can build a bridge between the precision of code and the ambiguity of grief.

  So, as we begin this workshop, I leave you with one question that I hope will haunt our sessions. It is a question that the translators will answer with their gut, and the scientists with their models, and neither answer will be complete without the other:

  **What does it mean for a translation to be correct when its form is preserved but its tone has drifted?**

  Thank you.
