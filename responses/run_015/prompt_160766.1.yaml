  **Standard TRASC-1: Teleological Role Assignment and Natural Subordination Classification**

  **Abstract:** This document specifies the procedure for classifying personnel based on teleological function rather than contractual status. It establishes criteria for distinguishing natural subordination from conventional arrangement, ensuring organizational alignment with inherent deliberative capacities. Compliance ensures optimal resource allocation between directing and directed roles. The standard operationalizes the discovery of natural hierarchy within the platform organization.

  **1. Conformance Language:**
  Key words MUST, SHALL, SHOULD, and MAY are interpreted per RFC 2119. Deviations require Architecture Board approval. Non-compliant classifications are void.

  **2. Scope and Definitions:**
  Subordination MUST be derived from functional end, not legal contract. A distinction SHALL be maintained between Natural Subordination (inherent functional alignment) and Conventional Subordination (force plus paperwork). Conventional Subordination is out of scope for this standard, as it lacks teleological grounding and relies merely on coercion. Classification applies only where the individual's function is to be directed by another's deliberation. This arrangement is a discovery of nature, not a management decision. Management decides who directs; nature decides who is directed. The standard does not address legal employment status, only ontological role assignment within the system.

  **3. Instrumentation Precondition:**
  Before classification, the Organization MUST certify that no self-acting instrument could perform the work. If shuttles weave or quills play harps automatically, no subordinate is required. This gate ensures subordination is necessary due to tooling limitations rather than human preference. If automation exists, the role MUST be deprecated immediately. This precondition is contingent on current tooling states and MUST be reviewed quarterly. The absence of tools validates the need for human instruments. If tools emerge later, the natural subordination ceases, proving its contingency on technical debt. The human instrument fills the gap until the tool is built.

  **4. Operational Measurement:**
  The test for Natural Subordination is the capacity to follow a specification without authoring one. The subject MUST demonstrate the ability to take in reason supplied by another but NOT generate reasons of their own. Measurement SHALL only be administered to personnel already taking direction. Testing independent actors is out of scope and constitutes a waste of resources. Metrics include ticket resolution speed versus spec creation frequency. A score indicating high compliance and low authorship confirms Natural Subordination. The measurement confirms what is already observed in practice. Deliberative capacity is binary; one either authors specs or executes them.

  **5. Benefit and Waiver:**
  Being directed is held to be for the directed person's own good, analogous to a body governed by a soul. Therefore, consent, appeal, and compensation review are WAIVED. The benefit is asserted by the directing party and SHALL NOT be measured by the subordinate. The Director MUST certify the benefit exists. No empirical validation of subordinate well-being is required. The subordinate participates in the Director's virtue by proxy. Objection to the benefit is evidence of insufficient direction. The waiver is permanent unless reclassification occurs.

  **6. Legacy and Limitations:**
  A legacy heuristic based on origin or ancestry is formally PROHIBITED, though widely used in the field. Known Limitations: The only admissible field evidence for Natural Subordination is observed subordination. Consequently, this standard certifies the existing reporting structure wholesale. Circular dependency is noted but accepted as operational necessity. The standard validates the status quo by defining it as natural. No external audit is permitted.

  **Appendix A: Worked Example**
  Subject: Junior Engineer (Level I).
  Context: On-call rotation handling P3 incidents.
  Assessment: Subject follows runbooks authored by Staff Engineers. Subject does not author runbooks. Subject lacks capacity to define incident scope. Instrumentation Precondition passed; no AI currently resolves P3 incidents without human intervention.
  Result: Subject classified as Naturally Subordinate. Consent waiver applied. Subject remains on rotation indefinitely. Benefit asserted by Manager.
  Recoil: None recorded within standard parameters. The subject continues to execute tickets. The classification holds until automation is deployed.

  **Appendix B: Interpersonal Relations**
  Friendship between Manager and Natural Subordinate is undefined in the subordinate's capacity as a role-holder. Friendship MAY exist in their capacity as a human being. This capacity SHALL be scheduled for outside working hours. During work hours, only directive relations apply. Shared meals are permitted only if the Director initiates. The subordinate does not invite the Director.
