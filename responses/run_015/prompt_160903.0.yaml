answer: |-
  Here is an audit of your seven claims, ordered by the severity of the tension involved.

  ### 1. Apparent Tension: (1) vs. (2)
  **Severity:** Low (Resolvable)
  **The Tension:** (1) claims nothing about you is relevant to his blameworthiness; (2) claims something about you makes your blaming wrong.
  **Resolution:** You are correct to suspect a confusion of questions. This is the standard philosophical distinction between the **fitness** of blame (is he an appropriate target?) and the **standing** to blame (are you the appropriate agent to deliver it?).
  *   **What to keep:** Both.
  *   **Unstated Assumption:** You must explicitly distinguish between *moral culpability* (his domain) and *communicative authority* (your domain). (1) addresses culpability; (2) addresses authority. They operate on different axes.

  ### 2. Genuine Tension: (7) vs. (3) & (4)
  **Severity:** High (Foundational)
  **The Tension:** (7) states a stranger with "cleaner hands" has *less* standing than you. However, (3) and (4) define standing largely in terms of adherence to the norm (commitment, weakness of will, current failure). If standing were primarily about moral consistency or cleanliness (as 3 and 4 suggest), the stranger should have *more* standing than you.
  **What you must give up:** You must abandon the idea that standing is primarily a function of **moral purity** or **normative consistency**.
  **The Cost:** You lose the clean explanation in (3) that hypocrisy is solely about "not accepting the norm."
  **How to Resolve:** Adopt a **Relational View of Standing**. Standing is not just about your moral record; it is about your **stake** in the relationship and the **harm** being done. You have standing in (7) not because you are better, but because you are *involved*. This aligns (7) with (2) but requires rewriting (3) and (4).

  ### 3. Genuine Tension: (3) vs. (4)
  **Severity:** High (Theoretical)
  **The Tension:** (3) explains lost standing as a lack of genuine commitment to the norm. (4) claims standing is lost even when commitment *is* genuine (sincere acceptance, guilt) but the agent fails due to weakness. These cannot both be the *primary* explanation. If (3) is true, the person in (4) should retain standing.
  **What you must give up:** You must give up the "Commitment Condition" in (3) as the *sole* explanation.
  **The Cost:** You can no longer say hypocrisy is *only* about instrumentalizing norms.
  **How to Resolve:** Shift the focus from **internal commitment** to **implicit claim to superiority**. The reason the weak-willed blamer (4) lacks standing is not that they fail the norm, but that by blaming without acknowledgment, they implicitly place themselves above the blamee. This bridges (3) and (4).

  ### 4. Genuine Tension: (5) vs. (6)
  **Severity:** Medium (Self-Application)
  **The Tension:** (5) suggests your *record* (having stopped) grants you standing. (6) suggests a *speech act* (the preface) grants you standing, "even though nothing about my record has changed." If the preface works, the record in (5) is not the active ingredient. Furthermore, you note in (6) that you don't see why this shouldn't work for the struggling blamer in (4), which contradicts (4).
  **What you must give up:** The idea that recovery *itself* is the source of your standing.
  **The Cost:** You must accept that your standing is fragile and communicative, not a permanent status earned by sobriety.
  **How to Resolve:** Your standing comes from **acknowledged shared vulnerability**, not success. Recovery helps only insofar as it makes that acknowledgment credible. This validates your worry in (5) that you might be rationalizing, but resolves it by making the *acknowledgment* (6) the key, not the *sobriety* (5).

  ---

  ### The Single Revision
  To clean up the most tension, you should revise your definition of **Standing**.

  **Current View:** Standing is a status earned by moral consistency, adherence to norms, and cleanliness of hands.
  **Revised View:** Standing is a **communicative license grounded in relationship and the refusal to claim superiority.**

  **Why this works:**
  1.  **Resolves (7):** You have standing over the stranger because of the relationship/stake, not moral purity.
  2.  **Resolves (3) & (4):** Hypocrisy and weakness of will only cost standing if they involve an implicit claim to be "above" the norm or the other person. If you acknowledge your own struggle (the preface in 6), you retain standing even while struggling.
  3.  **Resolves (5):** Your recovery matters not because it makes you "clean," but because it makes your warning credible without requiring you to claim superiority.
  4.  **Resolves (1) & (2):** It clarifies that standing is about the *relationship of the speakers*, not the *facts of the action*.

  ### What to Say to Your Brother
  Based on the Revised View, your previous confrontation failed because it sounded like a claim to superiority (violating the new standing condition). To restore standing, you must explicitly renounce superiority while maintaining the demand.

  **Draft Statement:**

  > "You were right to call me out last month. I said you were selfish, and I said it like I was judging you from a place you haven't reached. That was wrong.
  >
  > "I don't have higher ground. I did exactly what you are doing for fifteen years. I know exactly how it feels to think you can stop whenever you want, and I know exactly how much it costs the people around you when you don't.
  >
  > "I am not telling you to stop because I'm better than you. I am telling you to stop because Mom is dying, and I am terrified of losing her to the same thing that almost took me. I don't have the right to demand this from a place of purity, because I don't have any. But I do have the right to demand it from a place of love, and from the fact that I am still here to see what happens next. Please stop."

  **Why this works:**
  *   **Validates (1):** It maintains the demand ("Please stop").
  *   **Validates (2) & (6):** It uses the "preface" to repair standing by acknowledging your own record.
  *   **Validates (7):** It grounds your authority in the relationship ("Mom," "I am still here") rather than moral cleanliness.
  *   **Neutralizes the *Tu Quoque*:** You have already admitted the charge, rendering his defense useless.
