answer: |-
  This is a rigorous and well-structured reconstruction of the heterogeneity objection, specifically targeting the "phenomenal quality" defense of qualitative hedonism. You have correctly identified that the tension lies in how we define the property $Q$ once we admit it isn't a standard sensory quality.

  You asked for a diagnosis of the argument chain, specifically where the leak might be, and whether you have smuggled assumptions into the transparency claim. Here is the breakdown.

  ### The Primary Leak: Premise (9) and Conceptual Coherence

  The strongest point of attack against your argument—and the standard move for a sophisticated qualitative hedonist—is to reject **(9)** as conceptually incoherent, not merely exotic.

  **The Diagnosis:**
  Premise (9) assumes a dissociation between *phenomenal tone* (the "feel" of $Q$) and *motivational direction* (the desire to avoid/approach). It posits a subject who feels $Q$ ("pleasantness itself") but has a negative conative attitude toward it.

  **Why this is vulnerable:**
  If you hold onto **(7)** and **(8)**—that $Q$ is transparent and is "the way the experience is experienced *as pleasant*"—you have arguably built the conative attitude into the definition of $Q$.
  *   On many accounts (e.g., Chris Heathwood, Richard Brandt), "pleasantness" is not a raw qualia like "redness"; it is essentially *felt favorability*.
  *   If $Q$ is "transparency of value," then to experience $Q$ *just is* to experience the object as to-be-pursued.
  *   Therefore, a subject who experiences tissue damage and finds it aversive *cannot* be instantiating $Q$, by definition. They are instantiating a different phenomenal quality (perhaps "intensity" or "salience") that you are mislabeling as $Q$.

  **The Cost of Rejecting (9):**
  If you accept that (9) is incoherent, you concede that "pleasantness" cannot be separated from a pro-attitude.
  1.  **Shift to Attitudinal Hedonism:** This pushes the theory away from *Qualitative* Hedonism (which posits a specific *feeling*) toward *Attitudinal* Hedonism (which posits a specific *stance*). This saves hedonism from the heterogeneity problem but changes the metaphysics of the view.
  2.  **Loss of the "Raw Feel" Intuition:** You lose the ability to say, "I know it's pleasure because it feels like *this*," independent of whether I want it. You must say, "I know it's pleasure because I intrinsically desire it."

  ### The Secondary Leak: The Tension Between (1c) and (8)

  You asked if you smuggled a relational criterion into the transparency claim. **You did.** There is a silent contradiction between **(1c)** and **(8)** that weakens the move to **(12)**.

  **The Diagnosis:**
  *   **(1c)** requires $Q$ to be **intrinsic and non-relational**. It must be a natural property of the experience itself, independent of the subject's broader psychology.
  *   **(8)** defines $Q$ as **"experienced as pleasant."**
  *   "Experienced *as*..." is a relational description. It describes the experience in relation to the subject's interpretive or evaluative framework.
  *   Furthermore, "Pleasant" is an evaluative term. If $Q$ is the *natural ground* of value (as hedonism requires), defining $Q$ using the evaluative term "pleasant" risks circularity. You are defining the natural property ($Q$) via the value property (Pleasantness) it is supposed to ground.

  **The Consequence:**
  If $Q$ is defined relationally (as in 8), then **(12)**'s claim that the hedonist must "violate (1c)" is not a *reductio*; it is a *concession*. The hedonist can simply reply: "Correct, $Q$ is slightly relational (it depends on the subject's capacity to take the experience favorably), but that is acceptable."
  To make your argument stick, you need to insist that **(1c)** is non-negotiable for *Qualitative* Hedonism. If the hedonist allows $Q$ to be relational, they are no longer holding the view you defined in **(1)**.

  ### The Move from (8) to (10): The Normative Link

  You were unsure about the move to **(10)**. This step is actually robust *for the sake of reductio*, but it highlights the "Open Question" problem.

  *   **(10)** says: "Has $Q$ $\rightarrow$ Intrinsically Good."
  *   If the Inversion Case (9) is coherent, then we have a state that has $Q$ but is *not* good (because the subject hates it).
  *   This forces the hedonist to choose:
      1.  **Deny it is Good:** This breaks the core hedonist thesis (Pleasure = Good).
      2.  **Deny it has $Q$:** This requires $Q$ to be defined by its goodness (circularity) or by the subject's stance (relationality).

  Your argument correctly traps the qualitative hedonist here. The only way out for them is to deny the coherence of the Inversion Case (reject 9).

  ### Recommendation for Repair

  To tighten the argument and close the leaks:

  1.  **Fortify Premise (9):** You need to argue explicitly why the Inversion Case is conceptually coherent *even under the transparency description*.
      *   *Argument:* Distinguish **Hedonic Tone** (the raw feel) from **Motivational Force** (the desire). Cite cases like "masochistic pleasure" or "bittersweet nostalgia" where the phenomenal feel is positive, but the overall desire is mixed or negative. If you can show that one can "like the feel" but "want it to stop," (9) survives.
      *   *Counter-Counter:* The hedonist will say masochism involves a *different* $Q$ or that the "liking" *is* the desire. Be prepared for this.

  2.  **Clarify Premise (1c):** Make it explicit that Qualitative Hedonism *requires* $Q$ to be non-relational. If the hedonist tries to save the view by making $Q$ relational (dependent on the subject's stance), argue that this collapses into **Attitudinal Hedonism**, which is a different theory with different problems (e.g., the problem of misguided desires).
      *   *Revision:* Add a premise: "(1d) Qualitative Hedonism distinguishes itself from Attitudinal Hedonism by locating value in the *phenomenology*, not the *attitude*."

  3.  **Refine Premise (8):** Avoid defining $Q$ as "experienced as pleasant" if "pleasant" is evaluative. Define it as "experienced with phenomenal character $P$." Then, in **(10)**, assert the hedonist claim: "States with character $P$ are intrinsically good." This separates the description of the property from the evaluation, making the contradiction in **(12)** sharper.

  ### Summary of Costs

  *   **If you reject (9):** You save Qualitative Hedonism, but only by merging it with Attitudinal Hedonism. The "Qualitative" label becomes misleading.
  *   **If you reject (1c):** You save the Inversion Case, but you admit that value is not grounded in a non-relational natural property. This undermines the naturalistic ambition of classical hedonism.
  *   **If you keep the argument as is:** It is a valid *reductio* of **strict** Qualitative Hedonism (where $Q$ is non-relational, isolable, and necessarily good). It successfully shows that strict Qualitative Hedonism cannot handle the heterogeneity of pleasure without either denying phenomenology (6) or accepting absurd normative conclusions (11).

  **Verdict:** The argument is sound against *strict* Qualitative Hedonism. The "leak" is only a leak if the hedonist is willing to abandon the "Qualitative" constraint (1c) or the "Non-Relational" constraint (1c). If they do so, they are no longer defending the view you defined in (1). Your diagnosis in (13) is correct: the view proves too much or collapses into a relational theory.
