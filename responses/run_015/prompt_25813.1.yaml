answer: |-
  This is a classic problem in normative ethics, often framed as the tension between the **Demandingness Objection** and the **Principle of Beneficence**. You are effectively trying to achieve a state of *reflective equilibrium*—adjusting your general principles until they cohere with your specific considered judgments.

  Your intuitions are actually quite consistent with a specific family of views often called **Moderate Deontology** or **Common-Sense Morality with a Threshold**. You are rejecting pure Utilitarianism (which would likely make Case 2 and Case 3 duties) and strict Libertarianism (which might make Case 1 supererogatory).

  Based on your nine cases, I propose the following principle to systematize your judgments.

  ### The Principle of Reasonable Rescue (PRR)

  **An agent is morally required to perform an action if and only if:**
  1.  **Significance:** The action prevents significant harm to another person.
  2.  **Cost-Threshold:** The cost to the agent (physical, financial, or temporal) does not exceed a threshold of *reasonable sacrifice*.
  3.  **Bodily Integrity:** The action does not require significant intrusion upon or risk to the agent's bodily integrity (unless overridden by Condition 4).
  4.  **Role-Obligation:** The agent does not occupy a special role or relationship that voluntarily lowers the Cost-Threshold or waives the Bodily Integrity constraint.

  **Crucial Corollary (The Non-Aggregation Clause):**
  Moral requirements are evaluated **act-by-act**, not **life-by-life**. An action does not cease to be a duty merely because performing it repeatedly over a lifetime would constitute an excessive cumulative burden. Conversely, a life composed entirely of duties does not become a supererogatory "saintly life" simply by virtue of its duration.

  ---

  ### Step 1: Testing the Principle Against Your Cases

  Let's run your nine cases through the PRR to see where it holds and where it strains.

  *   **1. The Pond:** Significant harm (death). Cost (ruined suit) is below the Reasonable Sacrifice threshold. No bodily risk. **Verdict: Duty.** (Preserved)
  *   **2. The Kidney:** Significant harm (death). Cost (surgery/recovery) is high, but crucially, it violates **Bodily Integrity**. **Verdict: Supererogatory.** (Preserved)
  *   **3. The Ten Percent:** Significant harm (death/suffering). Cost (10% income) is the variable. For a "comfortable salary," this is likely below the Reasonable Sacrifice threshold. No bodily risk. **Verdict: Duty.** (Resolves your uncertainty).
  *   **4. The 911 Call:** Significant harm. Cost (zero). **Verdict: Duty.** (Preserved)
  *   **5. The Grenade:** Significant harm (squad death). Cost (agent death) exceeds Reasonable Sacrifice threshold. **Verdict: Supererogatory.** (Preserved)
  *   **6. The Lonely Neighbor:** Harm (loneliness) is significant but arguably less urgent than life/death. Cost (time) is low. However, this falls into a gap: it is an **Imperfect Duty**. It is a duty to have *some* benevolence, but not a duty to visit *this* neighbor *this* hour. Your intuition ("supererogatory, but think less of them") tracks this perfectly. **Verdict: Supererogatory (Virtue-Expected).** (Preserved)
  *   **7. The Doctor:** Significant harm. Cost (3 hours) is normally supererogatory for a stranger, but **Role-Obligation** lowers the threshold. **Verdict: Duty.** (Preserved)
  *   **8. The Mugging:** Significant harm. Cost (risk of injury) violates **Bodily Integrity** constraint. **Verdict: Supererogatory.** (Preserved)
  *   **9. The Life's Work:** This is the hardest case. The PRR's **Non-Aggregation Clause** handles this. Each individual act (distributing food, treating a wound) meets the criteria for Duty (reasonable cost *at that moment*). The fact that the *sum* is a life of sacrifice does not retroactively make the individual acts supererogatory. However, choosing to *commit* to that life initially is supererogatory. **Verdict: Supererogatory Commitment, composed of Dutiful Acts.** (Refined).

  ---

  ### Step 2: Resolving Your Stuck Points (Cases 3 & 9)

  You identified Case 3 and Case 9 as the sources of your inconsistency. Here is how the PRR resolves them.

  **Case 3: The Ten Percent**
  Your uncertainty stems from conflating *financial cost* with *lifestyle cost*.
  *   **Why it feels like a duty:** The harm prevented is grave (death), and the cost (10% of a comfortable income) does not threaten your basic functioning or projects. It passes the Cost-Threshold.
  *   **Why it feels supererogatory:** Unlike the Pond (one-off), this is recurring. You are intuitively worrying about the *cumulative* effect (Case 9).
  *   **The Resolution:** Under the PRR, **Case 3 is a Duty.** The uncertainty you feel is a psychological reaction to the *repetition*, not the moral status of the act. If 10% is truly "reasonable" (leaving you comfortable), you are required to give it. If giving 10% eventually impinges on your ability to pursue your own life projects, the threshold is met, and it becomes supererogatory. But at the start, with a comfortable salary, it is obligatory.

  **Case 9: The Life's Work**
  You asked: *"If each individual act were a duty, would the whole life still be supererogatory?"*
  *   **The Resolution:** Yes. This is the distinction between **Local Obligation** and **Global Vocation**.
  *   Morality generally binds you to *opportunities* as they arise. Saving a child today is a duty. Saving a child tomorrow is a duty.
  *   However, *structuring your entire identity* around being a savior is a choice that goes beyond local obligations. It is supererogatory to *adopt the policy* of maximizing good, even if following that policy often leads you to do your duty.
  *   **Why this matters:** If we say the whole life is a duty, we make morality too demanding (you must be a saint). If we say the individual acts are supererogatory, we make morality too weak (you can ignore the drowning child). The PRR splits the difference: You must answer the call when it comes (Duty), but you are not required to seek out a life where the call never stops (Supererogatory Vocation).

  ---

  ### Step 3: Which Verdicts Must You Let Go?

  To maintain consistency with the PRR, I recommend you adjust **Case 6 (The Lonely Neighbor)**.

  **The Inconsistency:**
  You classified the Neighbor case as supererogatory, but added: *"I'd think less of someone who never did it."*
  In moral philosophy, if we legitimately hold a negative moral judgment against someone for failing to act (i.e., they are blameworthy), we are functionally treating it as a duty. Calling it "supererogatory" while assigning blame is a contradiction.

  **The Correction:**
  You should reclassify Case 6 as an **Imperfect Duty**.
  *   **Perfect Duty:** You must do X at time T (e.g., Save the drowning child *now*).
  *   **Imperfect Duty:** You must adopt the maxim of beneficence, but you have latitude in *when* and *how* (e.g., Help the lonely *sometimes*, but not necessarily every week).
  *   **Why change this?** It clarifies why you blame the person who *never* visits (they violated the imperfect duty) but don't blame someone who misses *one* week (they exercised their latitude). This aligns with your intuition better than "supererogatory," which implies no blame at all.

  ---

  ### Step 4: The Stress Test (A New Case)

  To test the robustness of the PRR, specifically the **Non-Aggregation Clause**, consider this case:

  **Case 10: The Repeated Pond**
  You walk past the same shallow pond on your way to work every day. Every day for a year, you find a different child drowning. Saving each child ruins your suit ($500 cost). You have 250 working days in a year.
  *   **Total Cost:** $125,000.
  *   **Total Benefit:** 250 lives saved.
  *   **Question:** Are you required to save the child on Day 1? On Day 200?

  **Applying the PRR:**
  *   **Act-by-Act:** On Day 1, the cost is $500. This is below the Reasonable Sacrifice threshold. **Duty.**
  *   **Act-by-Act:** On Day 200, the cost is still $500 *for that act*. However, your *cumulative* wealth is now depleted. If paying $500 on Day 200 means you cannot pay rent, the Cost-Threshold is now exceeded. **Supererogatory.**
  *   **The Weakness Revealed:** The PRR struggles with **Foreseeable Aggregation**.
      *   If you *know* on Day 1 that this will happen every day, can you say it is a duty on Day 1?
      *   If you say "Yes," you might bankrupt yourself by doing your duty every day.
      *   If you say "No," you seem to be saying that the *frequency* of tragedy reduces your obligation to help, which is counter-intuitive.

  **Philosophical Implication:**
  This reveals that your principle needs a **Proviso of Sustainability**.
  *   *Revised PRR:* An act is a duty if the cost is reasonable, *provided that* performing this duty does not foreseeably prevent you from fulfilling future essential obligations (like self-preservation or caring for dependents).
  *   This suggests that in the **Repeated Pond**, you are required to save children until the point where doing so compromises your ability to function as a moral agent in the future. At that point, the duty ceases, even if the child still drowns.

  ### Summary of Recommendations

  1.  **Adopt the Principle of Reasonable Rescue.** It captures your distinction between physical risk (Kidney/Mugging) and financial/time cost (Pond/Doctor).
  2.  **Resolve Case 3 (Ten Percent).** Classify it as a **Duty**, provided the 10% does not compromise your basic life projects. Your uncertainty is a fear of Case 9, not a feature of Case 3.
  3.  **Resolve Case 9 (Life's Work).** Distinguish between the **Duty of the Act** and the **Supererogation of the Vocation**. You must help when you can, but you need not make helping your entire identity.
  4.  **Refine Case 6 (Neighbor).** Reclassify as an **Imperfect Duty**. This explains the blame you assign to total inaction without requiring specific weekly visits.
  5.  **Watch the Aggregation.** Be aware that your "act-by-act" view (Case 9) creates tension in "Repeated Pond" scenarios. You may need to accept that duties have a "sustainability limit."

  This framework preserves 8 of your 9 verdicts (with a nuance on #6) and gives you a clear tool to dissect the ones that bother you. Does this alignment feel stable to you, or does the "Repeated Pond" implication strike you as unacceptable?
