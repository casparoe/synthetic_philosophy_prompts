answer: |-
  ### Implicature Decision Procedure for Fact-Checkers

  **Objective:** Determine if an implied meaning constitutes a checkable claim or falls outside factual verification.

  **Step 1: Identify the Content**
  Distinguish *what is said* (explicit proposition) from *what is implicated* (inferred meaning).
  *   **If the dispute concerns *what is said*:** Proceed to standard fact-checking. **Stop.**
  *   **If the dispute concerns *what is implicated*:** Proceed to Step 2.

  **Step 2: Conventional vs. Conversational**
  Is the implication triggered by specific lexical items (e.g., "but," "therefore," "even")?
  *   **Yes (Conventional):** The meaning is attached to the words, not the context. **Hand to Editor.** (Truth-conditional status is contested).
  *   **No (Conversational):** The meaning arises from context and maxims. Proceed to Step 3.

  **Step 3: The Gricean Tests**
  Run the following diagnostics on the implicated claim.
  1.  **Cancellability:** Can the speaker add "but not [implicature]" without contradiction? (e.g., "Some students passed, but not all" vs. "Some students passed, in fact all did").
      *   *If Yes:* The implicature is weak. **Not Checkable.**
      *   *If No:* The implicature is strong. Proceed to Test 2.
  2.  **Non-Detachability:** If the speaker used different words with the same literal meaning, would the implicature remain?
      *   *If Yes:* Supports conversational implicature.
      *   *If No:* Likely linguistic convention. **Hand to Editor.**
  3.  **Calculability:** Can the implicature be derived from the Cooperative Principle (Maxims of Quantity, Quality, Relation, Manner)?
      *   *If Yes:* Proceed to Step 4.
      *   *If No:* **Not Checkable.**
  4.  **Flouting vs. Violating:** Did the speaker openly breach a maxim to invite inference (Flout), or covertly breach it to deceive (Violate)?
      *   *Flouting:* Generates implicature. **Checkable.**
      *   *Violating:* Generates deception, not implicature. Check explicit content only. **Stop.**

  **Step 4: Final Determination**
  *   **Checkable:** Non-cancellable, calculable conversational implicature resulting from flouting.
  *   **Not Checkable:** Cancellable implicature (weak inference).
  *   **Hand to Editor:** Conventional implicatures, borderline cancellability, or cases where misleadingness outweighs theoretical deniability.

  ***

  ### Theoretical Grounding: Settled vs. Contested

  **Settled Consensus:**
  *   **Cancellability** is the primary diagnostic for conversational implicature.
  *   **Conventional implicatures** (triggered by words like "but") are distinct from what is "said" and do not affect truth conditions in standard Gricean theory.
  *   **Flouting** generates implicature; **violating** (lying) does not.

  **Contested Areas:**
  *   **Degrees of Strength:** While tests are binary, pragmatics scholars debate whether implicature comes in degrees (scalar). A "strong" implicature may behave like a claim even if technically cancellable.
  *   **The Said/Implicated Boundary:** Neo-Griceans argue the boundary is blurrier than Grice proposed; some implicatures are "generalized" and feel like explicit claims.
  *   **Normative vs. Descriptive:** It is contested whether the Cooperative Principle describes how people *do* talk or how they *ought* to talk. This affects whether a "violation" is treated as a communicative failure or a strategic lie.

  ***

  ### Application to Utterances

  **1. Plant Manager: "We've never had a single safety incident at this plant."**
  *   **Step 1 (Content):** This is an explicit assertion (*what is said*), not an implicature. It asserts a zero-incident record.
  *   **Step 2 (Type):** N/A (Explicit).
  *   **Step 3 (Tests):** N/A.
  *   **Decision:** **Checkable.**
  *   **Reasoning:** The dispute is about the explicit truth condition. The speaker cannot deny claiming this without contradicting their utterance. Fact-checkers verify incident logs.

  **2. Spokesperson: (Asked: "Did your product cause the injury?") "We've always been committed to safety."**
  *   **Step 1 (Content):** Explicit: We value safety. Implicated: No, our product did not cause the injury.
  *   **Step 2 (Type):** Conversational (no lexical trigger).
  *   **Step 3 (Tests):**
      *   *Cancellability:* Can they add "...but yes, our product caused the injury"? Yes. It is logically consistent, though pragmatically odd.
      *   *Calculability:* Derived from Maxim of Relation (be relevant).
      *   *Flouting/Violating:* They are flouting Quantity (not giving enough info) to invite the inference.
  *   **Decision:** **Not Checkable.** (Uncomfortable Result)
  *   **Reasoning:** Strictly Gricean, this is a cancellable implicature. The speaker can plausibly deny the claim "Our product did not cause the injury" by saying, "I only spoke to our values." While misleading, it lacks the non-cancellability required for a hard claim. *Hand to Editor* if policy covers "material misleadingness" over strict truth conditions.

  **3. Obituary: "He was a brilliant, if erratic, scientist."**
  *   **Step 1 (Content):** Explicit: He was brilliant. Explicit: He was erratic. Implicated: There is a contrast between brilliance and erraticism (usually implying brilliance despite erraticism).
  *   **Step 2 (Type):** Conventional. The word "if" (functioning as "though") triggers the contrast.
  *   **Step 3 (Tests):**
      *   *Cancellability:* No. "He was brilliant, if erratic, but there is no contrast" is contradictory.
      *   *Detachability:* If we change "if" to "and," the contrast vanishes.
  *   **Decision:** **Hand to Editor.**
  *   **Reasoning:** This is a conventional implicature. Gricean orthodoxy says these are not truth-conditional (cannot be "false" in the same way), yet they convey factual nuance. Checking requires judging whether the contrast is warranted, which is subjective.

  ***

  **Editorial Note:** Utterance 2 demonstrates the friction between pragmatic theory and public interest. Gricean theory protects the speaker via cancellability, but readers perceive a lie. When the procedure returns "Not Checkable" for highly misleading statements, escalate to me. We may need to expand our criteria beyond strict Gricean claims to include "material misleadingness."
