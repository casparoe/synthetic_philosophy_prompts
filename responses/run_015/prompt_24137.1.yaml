prompt: |-
  I'm a senior editor at a fact-checking desk, and we get the same dispute almost every week: a speaker says something that implicates a claim, and either we flag the implicature as a checkable claim and the speaker's office responds that they never said it, or we don't flag it and readers accuse us of letting a misleading statement slide. I need a decision procedure my fact-checkers can run on any utterance to decide whether it carries an implicature strong enough to be treated as a checkable claim, grounded in Grice's account of conversational implicature and speaker meaning.

  Give me the tests to run in order — the ones that actually matter, including the distinction between conversational and conventional implicature, the flouting-versus-violating distinction, and the standard tests (cancellability, non-detachability, calculability, non-conventionality) — what counts as a sufficient answer to each, where the procedure stops with "not checkable," and where it has to hand the call to me, the signing editor, because the question is one of judgment rather than a fact.

  Then run it on these three utterances, showing for each which tests you ran, what each returned, and where the procedure lands (checkable, not checkable, or hand to editor): (1) a plant manager says "We've never had a single safety incident at this plant"; (2) a company spokesperson, asked whether their product caused the injury, replies "We've always been committed to safety"; (3) an obituary says "He was a brilliant, if erratic, scientist." At least one of these should land where I won't like it — for example, "don't fact-check" when the speaker seems to be misleading, or "check it" when the speaker could plausibly deny it.

  Separate clearly what is settled in the Gricean literature from what is genuinely contested among people who work on this (for instance, whether implicature comes in degrees, whether the said/implicated boundary is sharp, and whether the cooperative principle is a descriptive or a normative claim), and don't present a contested view as if it were the consensus.

  Keep the entire response under 1,200 words.
