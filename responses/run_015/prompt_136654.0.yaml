answer: |-
  This is a sharp observation. You have identified a structural feature of political rhetoric that is pervasive but rarely named as a single mechanism. Your intuition is correct: standard labels like "persuasive definition" or "No True Scotsman" are close but fail to capture the *systemic*, *communal*, and *diachronic* nature of the phenomenon you describe.

  Here is an analysis of the literature, the closest conceptual fits, a proposed definition, a diagnostic tool, and a normative assessment.

  ### 1. Does this pattern have an established name?

  There is no single term in the standard rhetorical or philosophical lexicon that captures all four features you identified simultaneously. However, the phenomenon sits at the intersection of three distinct bodies of literature. To talk about it precisely, you will likely need to combine terms from these fields.

  **A. The Ideograph (Michael McGee)**
  In rhetorical studies, the closest established concept is the **ideograph**. Coined by Michael McGee (1980), an ideograph is a high-order abstraction (e.g., "Liberty," "Security," "The American Way") that represents a collective commitment within a speech community.
  *   **Fit:** Ideographs are honorific, unfalsifiable, and guide behavior. They are the "building blocks" of public argument.
  *   **Literature:** McGee, "The Ideograph: A Link Between Rhetoric and Ideology" (1980); Celeste Condit, "The Meanings of the Gene" (1999).

  **B. Civil Religion (Robert Bellah)**
  In sociology and political theory, this pattern is the engine of **civil religion**. "Western values" functions as the scripture of a secular faith.
  *   **Fit:** In religious discourse, good outcomes are "God's will" (expression of values), while atrocities are "sin" (betrayal of values). The term survives because it is sacred, not descriptive.
  *   **Literature:** Bellah, "Civil Religion in America" (1967); Marvin and Ingle, *Blood Sacrifice and the Nation* (1999).

  **C. The Ultimate Attribution Error (Thomas Pettigrew)**
  In social psychology, Feature 3 (the asymmetry between "us" and "them") is a specific cognitive bias.
  *   **Fit:** In-group successes are attributed to internal character (values); in-group failures are attributed to external circumstances (betrayal). Out-group failures are attributed to character; out-group successes to circumstance.
  *   **Literature:** Pettigrew, "The Ultimate Attribution Error" (1979).

  **Verdict:** There is no single noun for the *linguistic mechanism* itself. You are describing an **Ideograph** operating under the logic of **Civil Religion**, protected by **Group-Serving Bias**.

  ### 2. Evaluation of Candidate Terms

  Here is how the closest existing concepts fit and where they break.

  **Candidate 1: Persuasive Definition (C.L. Stevenson)**
  *   **The Fit:** It explains how an emotionally loaded word ("Western") is given new descriptive content to sway judgment.
  *   **The Break:** As you noted, persuasive definition is typically an individual speaker's tactical move. Your pattern is *communal* and *unconscious*. Speakers do not feel they are redefining the term; they feel they are *revealing* its true meaning. It lacks the diachronic stability you observed.

  **Candidate 2: No True Scotsman**
  *   **The Fit:** It captures the immunization strategy (Feature 4). It explains how counter-examples (Inquisition, Slavery) are excluded from the set.
  *   **The Break:** NTS is a logical fallacy used to defend a universal generalization against a specific counter-example in real-time debate. Your pattern is not defensive; it is *constructive*. It is not saying "No Westerner does X"; it is saying "Westernness is the force that prevents X." It is a narrative ontology, not a logical shield.

  **Candidate 3: God Term (Richard Weaver)**
  *   **The Fit:** This is the strongest rhetorical match for Feature 1 (Honorific). A "God Term" is a word that confers inherent goodness and ends argument (e.g., "Science," "Progress," "Freedom").
  *   **The Break:** God Terms are usually static. They explain why we want something, but they don't typically switch between *causal explanation* (Feature 2) and *normative yardstick*. A God Term is usually just the end of the line. "Western values" is unique because it claims to be a historical *cause* when convenient.

  **Candidate 4: Empty Signifier (Ernesto Laclau)**
  *   **The Fit:** This explains Feature 4 (Elasticity). An empty signifier is a vessel with no fixed content that unifies a political coalition. It can be filled with whatever meaning is hegemonically useful.
  *   **The Break:** Empty signifiers are not necessarily honorific. They can be neutral or negative. This doesn't capture the *moral* glow that prevents the term from ever being associated with blame.

  **Winner:** **The God Term** does the most work for the *honorific* quality, but it requires the supplement of **Whig Historiography** to explain the *diachronic* selection (Feature 4).

  **What is left over:** The specific **switching mechanism** (Feature 2). The ability to toggle between "This happened *because* of our values" and "This happened *despite* our values" without triggering cognitive dissonance is not fully captured by existing rhetorical theory. It implies a theory of **Agency Attribution** that is currently fragmented between psychology and rhetoric.

  ### 3. Naming and Defining the Phenomenon

  Since no single term suffices, I propose you name this **"Valence-Dependent Essentialism."**

  **Definition:**
  A rhetorical structure in which the extension of a heritage-based concept is determined not by historical continuity or descriptive accuracy, but by the moral valence of the referent.

  **Necessary Conditions:**
  1.  **Heritage Claim:** The term must refer to a collective identity or tradition (e.g., "Western," "American," "Islamic," "Our Founders'").
  2.  **Honorific Constraint:** The term must carry a positive normative weight that cannot be negated without rejecting the identity itself.
  3.  **Valence-Gating:** Positive instances are coded as *intrinsic* (expressions of the essence); negative instances are coded as *extrinsic* (infections, betrayals, or anomalies).
  4.  **Functional Switching:** The term functions as a *cause* for positive instances and a *standard* for negative instances.

  **Boundary Cases:**
  *   **Is it distinctive to civilisational terms?** Yes, largely. Functional terms like "Science" or "Professionalism" can suffer valence-dependent essentialism (e.g., "Real science doesn't produce fraud"), but they are vulnerable to empirical falsification in a way heritage terms are not. If a bridge built by "Western engineering" collapses, "Western engineering" takes a hit. If a massacre is committed by "Western powers," "Western values" often does not.
  *   **The Distinction:** Heritage terms rely on *narrative continuity*; functional terms rely on *methodological reliability*. Your pattern thrives on narrative.

  **Proposed Vocabulary for Speeches:**
  *   "This is an instance of **valence-dependent essentialism**."
  *   "The phrase is functioning as a **normative sink**." (It absorbs credit, drains blame).
  *   "This is **retrospective teleology**." (Reading the present goal back into the past causes).

  ### 4. Diagnostic: How to Spot It in a Corpus

  If you are analyzing speeches to distinguish this pattern from a genuine descriptive claim, look for the **Falsifiability Condition**.

  **The Test:**
  Ask: *"What historical event, if attributed to this tradition, would count as evidence against the existence of these values?"*

  **Instance of the Pattern:**
  *   **Speaker:** "The abolition of slavery was a flowering of Western values."
  *   **Diagnostic Check:** If you ask, "Would the *expansion* of slavery have proven Western values don't exist?" the speaker will likely say, "No, that would have been a betrayal."
  *   **Result:** The claim is unfalsifiable. The definition moves to meet the valence. This is **Valence-Dependent Essentialism**.

  **Non-Instance (Genuine Descriptive Claim):**
  *   **Speaker:** "Western legal traditions, specifically the inquisitorial model, contributed to higher conviction rates in the 17th century."
  *   **Diagnostic Check:** If you ask, "Did this lead to injustices?" the speaker can say, "Yes, that is a cost of that value."
  *   **Result:** The term is allowed to have negative causal consequences. The speaker is willing to own the downside.

  **The Commitment Test:**
  A formulation commits a speaker to something falsifiable only if they link the value to a *mechanism* that can fail.
  *   *Unfalsifiable:* "Western values promote freedom." (If freedom decreases, values were "betrayed").
  *   *Falsifiable:* "The Western commitment to decentralized power structures makes large-scale infrastructure projects difficult." (If a Western state builds a massive project easily, the claim is challenged).

  **Look for the word "Betrayal."**
  In a corpus search, the word "betrayal" (or "aberration," "anomaly," "departure") attached to a negative historical event is the strongest marker of this pattern. It signals the switch from *causal* to *normative*.

  ### 5. Is the Pattern a Defect?

  This is the most critical question for a speechwriter. The answer is: **It is a feature of normative self-description that becomes a defect when it blocks accountability.**

  **The Argument for Feature (The "North Star" Function):**
  A community cannot criticize itself without a normative standard that stands *outside* its current practice. If "Western values" simply meant "whatever Western nations have done," then slavery *was* a Western value, and you could not use "Western values" to argue against slavery.
  *   To have a moral tradition, you must distinguish between the *empirical history* and the *normative ideal*.
  *   The elasticity allows the tradition to survive its own sins. Without this mechanism, every atrocity destroys the identity, leading to nihilism or total rejection of the heritage.
  *   In this light, the pattern is the **price of moral continuity**. It allows a community to say, "We did this, but it was not *us* (the ideal us)."

  **The Argument for Defect (The "Accountability" Function):**
  The defect arises in Feature 2 (The Switch).
  *   When the term is used *causally* for credit ("We won because of our values"), it claims historical agency.
  *   When the term is used *normatively* for blame ("We lost our way"), it disclaims historical agency.
  *   **The Defect:** This allows the speaker to claim ownership of the triumphs while disowning the costs. It creates a **free-rider problem for history**. It prevents the community from asking: "Did our values *cause* the extraction? Did our concept of property *enable* the slavery?"
  *   By categorizing atrocities as "betrayals," you stop investigating whether they were *systemic outcomes* of the values themselves.

  **Conclusion for the Speechwriter:**
  If your goal is **inspiration**, the pattern is necessary. You cannot inspire a group with a purely descriptive history. You need the "North Star."
  If your goal is **analysis or reform**, the pattern is an obstacle. It prevents the group from seeing how their highest ideals might be structurally linked to their worst outcomes.

  **Precise phrasing for your work:**
  > "We must be careful not to treat our values as a **valence-dependent essence**—claiming them as the cause of our triumphs while dismissing our failures as mere betrayals. If our values are real, they must be capable of explaining our history, not just judging it."

  This acknowledges the utility of the values while exposing the rhetorical sleight-of-hand you identified.
