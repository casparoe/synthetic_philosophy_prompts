  5. It must prevent trivial overgeneration by explaining why a brick or standard bridge lacks politics while a low overpass possesses it, despite both having physical effects. (Non-negotiable)
  6. It must specify whether the operative mechanism is coercion, authority, or mere differential advantage, and separate the artifact's agency from its owners or regulators, as conflating these renders the warehouse robot debate incoherent. (Non-negotiable)
  7. It must determine whether identifying a power asymmetry suffices for politics or if the theory must verdict on injustice, as your supervisor demands. (Preference of critical theory camp)
  8. The demand to capture unintended structural lock-in (Item 2) conflicts with the need to avoid trivial overgeneration (Item 5), since nearly all artifacts create some path dependence. The single requirement that does the most work in excluding candidate theories is the demand to distinguish embedded authority or coercion from mere differential advantage, as this filters out the brick while keeping the low bridge.
