prompt: |-
  You are a professional philosopher with training in both political theory and poetic form. Before drafting, brainstorm the specific conceptual distinction between Burkean prescription—where institutions gain authority not by rational design but by surviving historical trial, so that tearing them down risks discarding embedded practical knowledge we do not possess—and Chesterton's democratic reformulation of the fence: the barrier was not built by an elite to exclude, but by ordinary people who understood a local danger (flood, soil contamination, boundary dispute) and whose descendants have forgotten both the danger and the solution. Your task is to render this tension structurally rather than thematically, injecting the further niche framing that the fence functions as an epistemic boundary: it marks the line where articulated reason ends and inherited, non-propositional knowledge begins.

  Write a poem of exactly sixteen lines in blank verse, arranged in four quatrains with no rhyme scheme but with strict iambic pentameter. Adopt the voice of a walker surveying an estate where reformers have systematically removed every fence—hedgerows, stone walls, locked gates—on the grounds that they were arbitrary, exclusionary, or inefficient. Each quatrain should correspond to one removed barrier, but the philosophical argument must be carried by the poem's architecture: in the first two quatrains, present the reformers' reasoning through concrete imagery (open vistas, unblocked paths, democratized land); in the third quatrain, execute a volta—signaled by an enjambment that breaks across the quatrain boundary—when the speaker discovers a dormant failure mode revealed only by the fence's absence: perhaps a flood channel now open to the garden, a path that leads walkers into marshland, or soil that was once separated from contamination. The discovery should be physical and local, not abstract, illustrating Burke's point that prescription encodes practical knowledge we cannot articulate, and Chesterton's point that the fence belonged to those who needed protection rather than to those who sought exclusion. In the final quatrain, hold the tension open without resolution: the speaker should stand at the broken line, recognizing that the reason for the fence is recoverable only through the damage caused by its removal, and that rebuilding it would require admitting ignorance rather than claiming wisdom. Do not resolve the poem with a sermon or a shrug; let the form itself—four broken enclosures—embody the argument that rationalist demolition leaves us with neither freedom nor safety, but with an open space whose dangers we can no longer name. Ensure the poem is accurate enough that a specialist in conservative political philosophy would recognize the Burkean/Chestertonian architecture, yet it should read as poetry, not as a versified lecture. No citations, footnotes, or bibliographic references should appear.
