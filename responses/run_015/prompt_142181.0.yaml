answer: |-
  This design is tight. Ninety minutes for fourteen participants across four rounds is aggressive; the adjudication bottleneck is your critical path. To make hand-adjudication possible in under a minute per pair, the "pseudo-code" cannot be Turing-complete. It must be a restricted schema that *feels* like code but adjudicates like a logic puzzle.

  Here is the complete package.

  ### 1. The Pseudo-Code & Adjudication Protocol

  **The Language ("PD-Script")**
  Participants write on standard index cards. The syntax is restricted to three lines. Any card violating syntax defaults to `DEFECT` (and incurs inspection costs if `READ` is present).

  ```text
  1. [Optional] COST: -1 IF "READ_OPP" OR "RUN_OPP" IS PRESENT
  2. [Logic] IF [CONDITION] THEN RETURN C ELSE RETURN D
  3. [Default] (Implicit D if Logic fails)
  ```

  **Allowed Primitives:**
  *   `MY_SOURCE`: Evaluates to the exact text on your own card.
  *   `OPP_SOURCE`: Evaluates to the exact text on the opponent's card.
  *   `READ_OPP`: Keyword that triggers the inspection cost. Must be present to use `OPP_SOURCE`.
  *   `RUN_OPP(INPUT)`: Keyword that simulates opponent against input (`"C"` or `"D"`). Triggers inspection cost.
  *   `==`: String equality check.
  *   `RETURN C` / `RETURN D`: The only valid outputs.

  **Adjudication Rules (Facilitator Cheat Sheet):**
  1.  **Scan for Cost:** If `READ_OPP` or `RUN_OPP` appears on *either* card, subtract 1 point from *that* player's final score.
  2.  **Determine Moves:**
      *   **No Inspection:** If a card lacks `READ`/`RUN`, its move is fixed (usually D, or C if they wrote `RETURN C` unconditionally).
      *   **String Match:** If Card A says `IF OPP_SOURCE == MY_SOURCE...`, compare the text of Card A and Card B *exactly* (including whitespace).
      *   **Simulation:** If Card A says `IF RUN_OPP("C") == C...`, simulate Card B against input "C".
          *   *Halting Rule:* If Simulation requires Card B to simulate Card A (infinite regress), the Facilitator declares "TIMEOUT." The simulation returns `D`.
  3.  **Calculate Payoff:** Apply Prisoner's Dilemma matrix to the resulting moves (C/C, C/D, etc.), then subtract inspection costs.

  **Worked Adjudication (Round 2):**
  *   **Player 1:** `READ_OPP. IF OPP_SOURCE == MY_SOURCE THEN RETURN C ELSE RETURN D`
  *   **Player 2:** `READ_OPP. IF OPP_SOURCE == MY_SOURCE THEN RETURN C ELSE RETURN D`
  *   **Step 1 (Cost):** Both used `READ_OPP`. P1 score -1, P2 score -1.
  *   **Step 2 (Logic):** P1 checks if P2 text == P1 text. They are identical strings. P1 returns `C`. P2 checks if P1 text == P2 text. Identical. P2 returns `C`.
  *   **Step 3 (Payoff):** Mutual Cooperation (3, 3). Minus cost (1, 1). **Final: (2, 2).**

  **Worked Adjudication (Round 3 - The Rewriter):**
  *   **Player 1:** `READ_OPP. IF OPP_SOURCE == MY_SOURCE THEN RETURN C ELSE RETURN D`
  *   **Player 2:** `READ_OPP. IF OPP_SOURCE == MY_SOURCE THEN RETURN C ELSE D` (Note: Facilitator secretly added a comment `// v2` to P2's card before showing it to P1's logic).
  *   **Step 1 (Cost):** Both -1.
  *   **Step 2 (Logic):** P1 compares strings. `...D` vs `...D // v2`. Not equal. P1 returns `D`. P2 compares strings. Not equal. P2 returns `D`.
  *   **Step 3 (Payoff):** Mutual Defection (1, 1). Minus cost (1, 1). **Final: (0, 0).**

  ---

  ### 2. Payoff Scheme & Stakes

  **The Matrix (Points):**
  *   **C / C:** 3 points each
  *   **D / D:** 1 point each
  *   **C / D:** 0 (Cooperator), 5 (Defector)
  *   **Inspection Cost:** -1 point per round (applied if `READ_OPP` or `RUN_OPP` is used).

  **The Stake:**
  *   **Currency:** "Credits" written on the board next to names.
  *   **Payout:** 1 Credit = 1 small square of chocolate.
  *   **Calibration:**
      *   Blind Defection (Round 1): 1 point.
      *   Successful Program Cooperation (Round 2): 2 points (3 - 1 cost).
      *   Failed Program Cooperation (Round 3): 0 points (1 - 1 cost).
      *   Exploitation (Round 2/3): 5 points (No inspection cost needed if you just Defect unconditionally).
      *   *Why this works:* Exploitation is still the dominant *individual* strategy if you can guess the other won't inspect. But mutual program-cooperation beats mutual defection. The cost prevents "free" verification; you must commit to the cost to enable the conditional logic.

  ---

  ### 3. Handout Text & Submission Protocol

  **Handout (Print on half-sheet):**
  > **RULES OF ENGAGEMENT**
  > 1.  **Silence:** No talking, signaling, or eye contact during submission.
  > 2.  **Anonymity:** Write only your Assigned ID Number on the card.
  > 3.  **Syntax:** Use PD-Script only. Illegible code = Defect.
  > 4.  **Finality:** Once submitted, code cannot be changed.
  > 5.  **The Facilitator is the Compiler:** The Facilitator decides all halting/simulation disputes. Their ruling is final.
  >
  > **PD-SCRIPT SYNTAX**
  > *   `MY_SOURCE` (Your card text)
  > *   `OPP_SOURCE` (Opponent card text)
  > *   `RUN_OPP("C")` (Simulate opponent vs Cooperate)
  > *   `READ_OPP` (Required to use above; costs 1 point)
  > *   `IF ... THEN RETURN C ELSE RETURN D`

  **Protocol to Prevent Collusion:**
  1.  **Assigned IDs:** Upon entry, hand each participant a random number (1–14). They use this ID on cards. Do not let them choose IDs.
  2.  **Collection:** Participants place cards face-down in a box.
  3.  **Shuffling:** You (Facilitator) shuffle the box visibly.
  4.  **Pairing:** Draw pairs randomly.
  5.  **The "Rewriter" Mechanism (Round 3 Only):**
      *   Collect cards.
      *   Before adjudicating, take a red pen. For *every* card, randomly decide (coin flip) whether to append `// check` to the end of the text.
      *   This modification exists *only* for the purpose of the opponent's `OPP_SOURCE` check. The original card remains the "true" source for the owner.
      *   *Note:* This simulates the "meaning-preserving rewriter" without needing software.
  6.  **Timekeeping:**
      *   Round 1 (Action): 5 mins.
      *   Round 2 (Source Code): 15 mins.
      *   Round 3 (Obfuscated Source): 20 mins.
      *   Round 4 (Sandbox/Behavior): 20 mins (Drop if behind).
      *   Debrief: 30 mins.

  ---

  ### 4. The Debrief (Mapping Moments to Claims)

  Do not lecture. Ask questions and let the data on the board drive the theory.

  **Phase 1: The Dominance Intuition (Round 1 Results)**
  *   *Observation:* Most scores are 1 (DD). Few 5s (exploitation).
  *   *Question:* "Why did almost everyone defect?"
  *   *Point:* Elicit the dominance argument. "Regardless of what they do, D is better."
  *   *Claim:* Rational agency as *action selection* leads to suboptimal equilibria.

  **Phase 2: The Program Move (Round 2 Results)**
  *   *Observation:* Look for pairs who got (2, 2).
  *   *Question:* "How did these pairs beat the dominance argument?"
  *   *Point:* They didn't choose an action; they chose a *disposition*. They submitted a proxy.
  *   *Claim:* `IF OPP == ME` creates a "Clique Equilibrium." You aren't trusting the person; you are trusting the code structure. This dissolves dominance because your move is now *counterfactually dependent* on theirs.

  **Phase 3: The Fragility of Syntax (Round 3 Results)**
  *   *Observation:* Scores drop. Pairs who cooperated in Round 2 now defect (0, 0).
  *   *Question:* "The logic didn't change. Why did the cooperation collapse?"
  *   *Point:* The equilibrium relied on *syntactic identity*, not semantic equivalence. The "Rewriter" broke the mirror.
  *   *Claim:* Program equilibrium is brittle. It requires a shared standard of representation (a "quining" language). Mutual recognition is harder than it looks.

  **Phase 4: Behavioral Indistinguishability (Round 4 Results - If Run)**
  *   *Observation:* Some may recover cooperation using `RUN_OPP`.
  *   *Question:* "If I cooperate with anyone who cooperates with me, am I different from someone who cooperates with everyone?"
  *   *Point:* From the outside (black-box), `FairBot` and `CooperateBot` look identical against certain probes.
  *   *Claim:* This is the limit of behavioral testing. You cannot distinguish "principled cooperation" from "blind cooperation" without source access. This maps to the impossibility of fully verifying alignment.

  ---

  ### 5. Limitations Note (For the Facilitator)

  You must supply these verbally during the debrief. Do not hide them, or the CS students will tear the setup apart.

  1.  **The Fixed Point Magic:** "In Round 2, when two `FairBot` programs met, I declared they cooperated. In reality, `FairBot` vs `FairBot` requires a logical fixed point (Löb's Theorem) to avoid infinite recursion. I, the Facilitator, *was* the fixed point oracle. I stipulated the outcome rather than deriving it."
  2.  **Acausal vs. Mechanical:** "This is not acausal trade. Your programs didn't reason about each other's reasoning. They executed mechanical checks I enforced. Real superrationality requires the agents to model the logic, not just the string."
  3.  **The Compiler Trust:** "You had to trust me not to lie about the opponent's source. In a digital setting, the code is the truth. Here, I am the trusted third party. The 'Program Equilibrium' was actually a 'Facilitator Equilibrium'."

  **How to say it without lecturing:**
  "When you look at the (2, 2) scores, ask yourself: Did the code force that result, or did I? If I had ruled that `RUN_OPP` times out after 1 second, those scores would be (0, 0). The theory assumes a perfect compiler. We had a human one."

  ---

  ### 6. Predictable Failure Modes

  1.  **The "Gotcha" Resentment (Round 3):**
      *   *Risk:* Participants feel cheated when the red pen breaks their cooperation.
      *   *Mitigation:* Frame Round 3 explicitly as "Transmission Noise." Say beforehand: "In the real world, code is rarely transmitted perfectly. Interfaces drift."
  2.  **Adjudication Bottleneck:**
      *   *Risk:* 7 pairs take 10 minutes to calculate, eating debrief time.
      *   *Mitigation:* Recruit one volunteer to help calculate scores while you verify logic. Or, project the pairs and have the *class* adjudicate the first one together to set the standard.
  3.  **Syntax Rebellion:**
      *   *Risk:* Someone writes Python.
      *   *Mitigation:* Enforce the "Illegible = Defect" rule ruthlessly. It underscores the constraint that *formalism matters*.
  4.  **The Clock:**
      *   *Risk:* Round 4 runs long.
      *   *Mitigation:* Be willing to cut Round 4. The core lesson (Action -> Program -> Fragility) is contained in Rounds 1–3. Round 4 is a bonus on behavioral equivalence.

  ---

  ### 7. Confidence & Contested Readings

  **Where I am least confident:**
  The **Round 3 "Rewriter"** mechanic. Using a red pen to add comments is a low-fidelity simulation of a recompiler. It might feel too arbitrary.
  *   *Watch for:* Participants arguing that `// check` shouldn't count as part of the source code.
  *   *Response:* "In syntax checking, comments are characters. If your compiler doesn't strip them, they break the hash. This is the point: security through obscurity vs. semantic equivalence."

  **Contested Reading:**
  This design takes the side that **Program Equilibrium is a distinct solution concept from Nash Equilibrium**, not just a restatement of it.
  *   *The Controversy:* Some game theorists argue that submitting a program is just a move in a larger game, and the "cooperation" is just a Nash Equilibrium of the *program-selection* game.
  *   *Your Stance:* Treat the shift to programs as a change in *agency*, not just an expansion of the strategy space. The debrief should push the idea that "choosing a program" changes the *structure* of rationality, not just the options.

  **When to Drop a Round:**
  *   **Drop Round 4** if Round 3 adjudication takes longer than 15 minutes. The behavioral indistinguishability point is subtle; the syntactic fragility point (Round 3) is visceral and essential.
  *   **Drop Round 3** if the group is heavily non-CS. The "comment breaks code" concept might confuse philosophers more than enlighten them. If you drop Round 3, move straight to the debrief on the fragility of trust.

  **Success Metric:**
  You know it landed if, during the debrief, a participant asks: *"So if we can't verify the source, are we back to Nash?"* That question proves they felt the loss of the program-equilibrium safety net.
