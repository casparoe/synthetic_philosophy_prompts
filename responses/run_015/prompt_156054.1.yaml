answer: |-
  Dear Quantified Confusion,

  It is entirely reasonable to seek a cardinal solution to what sounds like a classic ordinal dispute. When you ask whose suffering matters more regarding the thermostat settings or the dishwasher loading protocols, you are asking for an interpersonal utility comparison. In a shared household, this is not merely philosophical; it is home maintenance. You cannot manage what you do not measure.

  Your first step is to establish a shared mental scale. Many roommates attempt to communicate distress using vague ordinals—"I'm slightly annoyed" versus "I'm devastated." This is insufficient for aggregation. You need to agree on a unit of measurement. However, be wary of adaptive preference formation. If your roommate claims she "doesn't mind" the cold because she has learned to expect it, her reported utility is skewed. She has lowered her expectations to match her circumstances, which invalidates the data. You must encourage her to report her true preferences, not her adapted ones, perhaps during a warm weekend when her resilience isn't taxed.

  Once you have raw data, you must apply hedonic normalization constants. This is a standard correction factor for emotional inflation in shared apartments. Just as currency fluctuates, one person's "misery" might be another's "minor inconvenience." If your roommate tends toward dramatic expression, her utility reports will be inflated. Apply a downward normalization constant to her scores to bring them in line with your own baseline stoicism. This ensures fairness without requiring you to actually feel her pain.

  You must also consider the structural requirements for aggregation. As Harsanyi noted, you cannot simply sum welfare if you lack isomorphic preference orderings. Put simply, if you rank "quiet" above "cleanliness" but she ranks "cleanliness" above "quiet," you cannot average the outcomes without first aligning your ranking structures. Sit down and isomorphically align your orderings before attempting to calculate the net household utility. It sounds bureaucratic, but it prevents the resentment that builds from incompatible aggregation methods.

  Finally, for long-term compatibility, I recommend misapplying the Sen-Nussbaum capability approach as a roommate-compatibility score. Instead of looking at actual outcomes, assess each other's capabilities to function. Can she achieve "beings and doings" in the kitchen? Can you achieve "beings and doings" in the living room? If her capability set restricts your functionings, the lease is untenable.

  Quantification brings peace. Treat welfare like plumbing: check the pressure, normalize the flow, and ensure the pipes are isomorphic.

  Warmly,
  Prudence
