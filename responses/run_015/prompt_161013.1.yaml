answer: |-
  **Joint Statement on the Species Problem**

  **1. Agreed Claims**

  1.  Species taxa are historical individuals with specific origin and extinction conditions, not eternal classes.
  2.  The rank of species carries no metaphysical privilege over ranks above or below it.
  3.  The category question (what is it to be a species?) is distinct from the taxon question (is this group a species?).
  4.  Interbreeding criteria fail to apply to asexual, uniparental, and strictly reticulate groups.
  5.  Diagnosability criteria fragment continuously varying lineages and are sensitive to sampling density and locus choice.
  6.  Operational criteria (interfertility, monophyly, ecology) are indispensable for identifying species in practice.
  7.  Different criteria often correlate but sometimes yield nested, cross-cutting, or incommensurable groupings.
  8.  Taxa selected by cross-cutting criteria are real historical entities, even if not all are species taxa.
  9.  Within a given clade, one criterion is usually pragmatically preferred for specific investigative questions.
  10. Comparisons of diversity across clades can be scientifically meaningful if the operational convention is explicit.
  11. Taxonomy requires stability; conservation law requires protectable units; biodiversity accounting requires comparability.
  12. No single operational criterion successfully delineates all groups traditionally recognized as species.
  13. Lineage segmentation does not always coincide with morphological discontinuity.
  14. Legal statutes often mandate discrete units regardless of theoretical ambiguity.

  **2. Disagreements Table**

  | Crux | Neutral Restatement | Pluralist Formulation | Monist Formulation | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Account Count** | Does the category admit one correct account or several? | There are several legitimate accounts answering distinct investigative questions. | There is one correct account; species are segments of metapopulation lineages. | Substantive (Metaphysics of categories) |
  | **Conflict Symptom** | What does conflict among criteria indicate? | Conflict indicates genuine multiplicity in the joints nature offers. | Conflict marks the limits of our evidence rather than multiplicity in nature. | Substantive (Nature of reality) |
  | **Criteria Role** | Do criteria constitute species status or indicate it? | Criteria constitute status relative to the investigative question asked. | Criteria indicate status; they are proxies for the underlying lineage property. | Verbal (Definition of "species") |
  | **Taxon Identity** | Can a taxon be a species under one concept but not another? | Yes; the same individual is a species under concept A but not concept B. | No; changing the concept changes the referent, not the status of the individual. | Verbal (Reference fixation) |
  | **Number Comparability** | Is species number a legitimate comparative measure across clades? | Only if relativized to a concept; unrelativized number is meaningless. | Yes; number is determinate even if unknowable, allowing true comparison. | Substantive (Depends on Account Count) |
  | **Anagenetic Identity** | What identity does a taxon have without branching? | Segmentation is relative to the chosen temporal resolution or concept. | Segmentation is determinate; anagenesis without branching is one lineage. | Substantive (Lineage definition) |

  **3. Tests-and-Predictions Table**

  | Crux | Case/Argument | Pluralist Prediction | Monist Prediction | Outcome Moving Pluralist | Outcome Moving Monist |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ring vs. Split** | **Case A (Ashfall sedge):** Ring species with terminal ecological split and secondary contact. | Count varies: 1 species (interbreeding), 2 (ecological/lineage), or 3 (including hybrid zone). Answer depends on question. | Count is 2. The terminal forms are separate lineages; the ring history is evidence of their separation. | If lineage markers show complete gene flow across the serpentine boundary. | If genomic data proves the serpentine form is not evolving independently. |
  | **Asexual Lineages** | **Case B (Kappa clade):** Bacteria with ecotypes, high recombination within, low between. | Ecotypes are species under ecological concepts; lineage concept struggles with horizontal transfer. | Ecotypes are species. The lineage criterion survives if defined by independent evolutionary trajectory despite recombination. | If ecotypes show no cohesive evolutionary trajectory over deep time. | If recombination rates prove ecotypes are not distinct metapopulation segments. |
  | **Reticulation & Time** | **Case C (Ferns/Fossils):** Allopolyploid speciation + 5MY anagenesis without branching. | Hybrid adds one species; anagenesis adds zero or three depending on morphological cutoff chosen. | Hybrid adds one species (new lineage); anagenesis adds zero (single lineage segmented arbitrarily by morphology). | If fossil morphology proves discontinuous jumps rather than continuous change. | If the allopolyploid is shown to be merely a transient hybrid swarm without isolation. |

  **4. Closing Statement**

  We agree that further empirical work on genomic cohesion and reproductive isolation in Cases A, B, and C will clarify the operational boundaries of taxa, but neither party should expect this to settle the metaphysical dispute over the category itself. The Pluralist most wants the Monist to concede that "species number" is often a pragmatic tool rather than a discovery of pre-existing natural counts. The Monist most wants the Pluralist to concede that "lineage" is the primary referent of scientific discourse, even if operational proxies vary. If the dispute is verbal, it turns on whether "species" names the operational tool or the underlying entity; under a stipulated sense of "species-as-lineage," the residual substantive disagreement is whether nature permits multiple equally real ways to segment those lineages for scientific purposes. We sign this to acknowledge that both approaches drive productive research, provided their limitations are explicitly stated.

  ***

  The collaboration is least stable on the verdict for the "Taxon Identity" row, where the verbal/substantive boundary blurs depending on whether one prioritizes reference or utility. Both parties also remain skeptical that the other's desired concession does not secretly reintroduce the original disagreement under new terminology.
