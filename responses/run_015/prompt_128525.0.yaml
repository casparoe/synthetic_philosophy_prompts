  The ambiguity matters because these two rules do not always coincide, and I want to understand which one actually governs her judgments. To probe this, I ask you to consider a hypothetical case I have constructed: a decentralized robotic swarm in which no individual unit learns or updates its own weights, but the collective continuously runs thousands of simulated future terrain interactions in a shared virtual environment, discarding configurations that fail in simulation before any physical robot moves; coordination occurs through a common predictive map that all units access and revise, yet the system possesses no symbolic language, no cultural transmission across generations, and no explicit representation of other agents’ mental states. Given her earlier verdicts, would she classify this swarm as Popperian—because hypotheses die in simulation rather than in reality—or as Gregorian—because the shared predictive map functions analogously to a collective mind-tool that allows the group to correct errors without individual trial and error? Or would she place it elsewhere, and on what grounds?

