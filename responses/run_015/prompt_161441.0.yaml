  Finding **No Politics** commits us to judging decision packages. We assert that process consent and temporary mitigations can cure permanent barriers. This allows flexibility and acknowledges community agency (the association asked for the shuttle) but risks encoding inequality when budgets tighten. It shifts the panel from judging stones to judging budgets. Given Case 6, where physical layout trumped disclaimed intent, shifting to budget-judgment now would be a doctrinal break. We would be saying money matters more than concrete. Future panels would then have to audit grant lifespans rather than measure ramp slopes. This transforms us from design reviewers into fiscal sustainability auditors, a role our enabling ordinance does not describe.

  **The case that would settle it**

  To settle this, bring forward a **temporary construction diversion** case. A sidewalk closure for six months requires a detour; the applicant proposes a shuttle during closure. If we find **Politics**, we establish that temporary mitigations never cure physical barriers, confirming the hub finding. If we find **No Politics**, we establish that duration matters, validating the shuttle argument. Specifically, ask: Does a six-month barrier differ in kind from a permanent one cured by a two-year policy? The verdict tells us if we measure harm by the artifact's lifespan or the mitigation's duration.
