answer: |-
  Here are 10 interview questions drafted to be conversational but mechanically sharp. They're designed to move past the "what do you do" intro and straight into the tension points of her theory.

  **1. The Core Distinction**
  "Let's jump straight into the mechanics of your view. You're carving out a middle ground: pure time preference is fine for 'impersonal goods'—like money or resources—but forbidden for 'identity-constituting commitments.' Practically speaking, where does that line get drawn? Is a retirement savings account impersonal, but saving for a specific artistic project personal? How do we know which bucket a good falls into?"

  **2. The Neutrality Challenge**
  "I want to hit the classic objection head-on. The moral neutrality argument says that *when* something happens shouldn't matter, only *that* it happens. If pain is bad, it's bad in 2024 or 2054. By saying it's rational to discount impersonal goods just because they are in the future, aren't you just biting the bullet and saying temporal distance *is* morally relevant? What's the justification there?"

  **3. Climate: Strangers vs. Future Self**
  "Let's apply this to climate damage. Under your framework, how do I weigh damage done to a stranger in 50 years versus damage done to my own future self in 50 years? If I discount my own future suffering because it's 'impersonal' harm, but I can't discount the stranger's suffering because of impartial morality, do you end up with a weird asymmetry where I care more about a distant stranger than my own future self?"

  **4. Structural Rationality (The Setup)**
  "I know your reply to the neutrality critique usually leans on 'structural rationality'—the idea that discounting is necessary for planning and agency in a finite world. You need to prioritize the now to function. I get that. But here's the follow-up: If the structure of agency requires discounting, why does that requirement vanish the moment an 'identity commitment' enters the chat? Why doesn't my need to function *now* trump my commitment to a future version of myself?"

  **5. The Zero-Rate Camp**
  "There's a camp in climate economics, folks like Nicholas Stern, who argue for a near-zero discount rate essentially on ethical grounds. They say discounting the future is tantamount to discrimination. You're defending discounting, but with guardrails. Do you think the zero-rate folks are making a category error by treating identity commitments and impersonal resources as the same thing?"

  **6. Collapsing into Lexical Priorities**
  "I'm worried about the extreme version of your view. If identity-constituting commitments cannot be discounted, do they effectively become lexical priorities? Meaning, do they always trump impersonal goods regardless of the magnitude? If my future identity hinges on a specific promise, does that outweigh massive economic losses for the general population? Does your view break cost-benefit analysis entirely?"

  **7. The Problem of Changing Selves**
  "You tie the non-discounted rate to 'who you are.' But people change. The 'me' in 30 years might not care about the commitments the 'me' of today is locking in. If my future self wants to abandon an identity commitment I'm currently protecting from discounting, are you saying my current self gets to veto them? Where does the authority lie?"

  **8. Hyperbolic Discounting**
  "Behavioral econ loves to point out that humans don't discount exponentially; we discount hyperbolically—we're wildly impatient in the short term and patient in the long term. Is your 'identity-constituting' rule a normative correction for that? Are you trying to philosophically legislate against our natural tendency to sell out our future selves for quick, impersonal gains?"

  **9. Policy Translation**
  "Okay, let's talk policy. If a government adopts your framework, what changes? Do we need two different interest rates for public projects? One for infrastructure (impersonal) and one for cultural or human capital preservation (identity)? Is this actionable, or does it stay in the realm of individual rationality?"

  **10. The "So What?"**
  "Last one. A lot of philosophers just argue that pure time preference is irrational, full stop. You're arguing it's rational *conditionally*. What's the payoff of this distinction? Does it actually save us from the tyranny of the present, or does it just give us a more sophisticated excuse to ignore the long-term future when it's convenient?"
