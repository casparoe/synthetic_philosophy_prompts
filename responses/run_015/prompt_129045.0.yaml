  2.  **Deconstruct the Guest's Position:**
      *   *Standard PTP:* It's rational to care less about the future just because it's the future (discounting).
      *   *Guest's Twist:* It depends on *what* is being discounted.
      *   *Impersonal Goods:* Discounting is okay (e.g., money, generic resources).
      *   *Identity-Constituting Commitments:* Discounting is *not* okay (e.g., projects, relationships, values that make you *you*).
