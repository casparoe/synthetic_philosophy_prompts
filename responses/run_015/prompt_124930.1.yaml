  1.5. Surjectivity is maintained technically, as all candidates remain eligible for selection, notwithstanding the PPHO's pre-screening or the Dictator's unilateral discretion. No candidate shall be removed from the ballot; they shall merely be rendered mathematically inert.

  1.6. Voters acknowledge that any attempt to exploit the gap between theoretical impossibility and bureaucratic implementation constitutes a Class M Felony. The State reserves the right to redefine preference orderings post-hoc to ensure consistency with declared outcomes.

  Verdict: The Republic solves the impossibility of perfect democracy by bureaucratically outlawing the mathematics that prove it impossible.

