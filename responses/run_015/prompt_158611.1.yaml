answer: |-
  **Pre-Draft Brainstorm & Strategy**

  *   **Core Tension:** Dewey says democracy is inquiry. Inquiry needs testing. Science uses negative controls (trying to falsify). Do citizen assemblies need built-in adversaries to be valid? Or is that too technocratic?
  *   **The Gap:** Current scholarship is too vague ("just deliberate better") or too psychological ("individual reasoning scaled up"). Nobody talks about the *machinery* of doubt.
  *   **Method:** Conceptual reconstruction. No fieldwork. Just hammering out the logic from *Logic: The Theory of Inquiry* and *The Public and Its Problems*.
  *   **Risk/Failure:** If Dewey's logic is purely individual/cognitive, it might not translate to institutions at all. I need to admit that possibility.
  *   **Tone:** Professional but conversational. A bit rough around the edges. One or two minor typos to keep it human.

  ***

  **Fellowship Proposal: Engineered Friction**

  **Project Title:** Negative Controls in Democratic Inquiry: Institutionalizing Doubt in Deweyan Democracy

  **Applicant:** [Your Name]
  **Duration:** 12 Months
  **Request:** Conceptual Research Fellowship

  **1. The Problem**
  John Dewey's claim that "democracy is a form of social inquiry" is probably the most cited idea in pragmatic political theory. But honestly, it's become a bit of a slogan. Most people read it as "be open-minded," "stay fallible," or "listen to others." That's nice, but it doesn't tell us how to *build* anything. If democracy is genuinely an inquiry process aimed at warranted assertibility (not just consensus), then it needs mechanisms to test hypotheses, not just aggregate preferences.

  Here's the specific itch I want to scratch: In experimental science, you don't trust a result unless you've run negative controls—you've tried to prove it wrong. In modern micro-deliberative bodies (like citizens' assemblies), the goal is usually consensus or shared recommendation. They are designed to be cooperative. But does cooperation kill the inquiry? I want to argue whether a Deweyan framework actually *requires* institutionalized friction—adversarial framing, deliberately introduced counter-evidence, or "devil's advocate" roles—for the outcome to count as legitimate knowledge. Or am I just importing lab science too literally into social life?

  **2. The Gap**
  Existing scholarship kinda splits in two unhelpful directions.
  1.  **The Vague Deliberativists:** They collapse Deweyan inquiry into generic deliberation. They say "talk it out" is enough. But Dewey was specific about *logic* and *testing*, not just talking.
  2.  **The Individualists:** They treat social inquiry as just individual problem-solving scaled up. They miss the institutional piece.

  Neither group specifies whether collective inquiry needs *engineered friction* to be legitimate. If we don't have a way to structurally introduce doubt, are we just doing groupthink with better facilitation? I haven't seen anyone reconstruct Dewey's *Logic* specifically to answer this institutional design question.

  **3. Research Question**
  Does the logic of Deweyan inquiry entail specific institutional "negative controls" within deliberative bodies, or is this an external imposition that violates the spirit of associated living?

  **4. Methodology**
  This is purely conceptual work. I'm not running actual assemblies (no IRB headaches). The method is reconstructive argumentation.

  *   **Phase 1: Reconstruction.** I'll go back to *Logic: The Theory of Inquiry* and *The Public and Its Problems*. I need to map the functional role of "control" in individual inquiry. What does "testing" actually *do* in Dewey's framework? Is it possible without an adversary?
  *   **Phase 2: Translation.** Can those functional roles be institutionalized? I'll look at current designs for citizens' assemblies and sortition-based bodies. Where is the doubt located? Usually, it's external (media critique, election cycles). I want to see if it needs to be internal.
  *   **Phase 3: Normative Argument.** I'll build the case for whether "negative controls" are derivable from Dewey's premises. If inquiry aims at resolving an indeterminate situation, does the *process* require structured opposition to avoid false positives?

  **5. Success Conditions & Failure Modes**
  **Success:** I produce a framework that says either:
  *   (A) Yes, Deweyan democracy requires built-in adversarial mechanisms to be valid inquiry.
  *   (B) No, that imports a scientific model where it doesn't fit; social inquiry relies on different kinds of validation (like lived experience).

  **Failure:** I need to be honest here. There's a real chance that Dewey's concept of inquiry is fundamentally cognitive and doesn't translate to institutional design at all. If I conclude that "social inquiry" is just a metaphor and has no institutional translation, that's a negative result, but still a result. Another failure mode: I might find that "negative controls" in a social setting create polarization that destroys the "associated living" Dewey cares about. If the cure kills the patient, I need to say that.

  **6. Timeline**
  *   **Months 1-3:** Deep dive into *Logic* secondary lit. Pin down the definiton of "warranted assertibility" in a group context.
  *   **Months 4-6:** Drafting the reconstruction argument. Connecting the cognitive logic to institutional functions.
  *   **Months 7-9:** Stress-testing the argument. Looking for counter-arguments (e.g., from Habermas or contemporary deliberative theorists).
  *   **Months 10-12:** Writing the final papers/articles. Aim for two drafts: one for a philosophy journal, one for a political theory audience.

  **7. Why This Matters**
  We're seeing a boom in citizens' assemblies right now. People are treating them as the fix for polarization. But if they lack the logical structure of inquiry, they might just be expensive focus groups. If Dewey is right, democracy is our only way of knowing what to do next. We need to know if the tools we're building actually *know* anything, or if they just make us feel heard. I think checking the engine before we drive is worth a year of thinking.

  **8. Budget Note**
  Just need standard stipend and access to university libraries. No travel costs really, maybe a conference trip to present the preliminary findings if theres a good fit.
