  Based on the four verdicts you provided, your friend is operating with a coherent, specific philosophical framework. She is distinguishing between **ontic indeterminism** (Case 2), **epistemic ignorance** (Case 3), and **dynamical instability** (Cases 1 & 4).

  Here is the analysis of her implicit rule, the verdict on your fifth case, and the best test case to distinguish her view from the alternative.

  ### 1. The Implicit Rule: Exponential Divergence, Not Irreducibility

  Your friend is tracking **Exponential Trajectory Divergence** (Lyapunov instability) as the marker of "deep" or "structural" unpredictability. She is explicitly *not* tracking **Computational Irreducibility**.

  **Evidence from her verdicts:**
  *   **Case 1 (Double Pendulum):** She classifies this as structurally unpredictable despite "mathematically exact initial conditions." In classical mechanics, exact real numbers determine the future uniquely. By calling it unpredictable nonetheless, she is invoking the physical impossibility of *specifying* or *maintaining* that exactness against exponential amplification. Crucially, she notes this is "not merely because we lack computing power." This explicitly rules out computational complexity as a source of structural unpredictability.
  *   **Case 3 (PRNG):** She classifies this as epistemically unpredictable. She states that with the seed, prediction is "trivial." This ignores the fact that many cryptographically secure PRNGs are computationally irreducible (inverting them is hard even with the algorithm). By calling it "trivial," she signals that she does not view computational cost as a fundamental barrier to predictability, only information access is.
  *   **Case 4 (Turbulence):** She explicitly cites the mechanism: "equations amplify any residual gap exponentially." This confirms that exponential divergence is the necessary condition for her "dynamical" category.

  **The Rule:** A system is **Deterministic**. Its unpredictability is **Structural/Dynamical** if and only if nearby trajectories diverge exponentially (Chaos). If trajectories do not diverge, unpredictability is **Epistemic/Pragmatic** (due to lack of information or computing resources), regardless of computational complexity.

  ### 2. Verdict on the Fifth Case

  **The System:** Discrete-time, linear, non-expansive (stable), infinite-dimensional, computationally irreducible (no shortcut).

  **Her Predicted Verdict:**
  *   **Is it Deterministic?** **Yes.** (It follows fixed update rules, unlike Carbon-14).
  *   **Type of Unpredictability:** **Epistemic/Pragmatic.** (Not Structural).

  **Reasoning:**
  Because the system is **non-expansive** (nearby conditions stay nearby), it lacks the "exponential amplification" marker she required in Cases 1 and 4. Because she explicitly excluded "computing power" as a source of structural unpredictability in Case 1, she cannot classify the computational irreducibility of Case 5 as "structural."

  She would likely group Case 5 with Case 3 (PRNG) in terms of *category* (not structurally unpredictable), though she would acknowledge the barrier is computational resources rather than hidden information. She would likely say: *"In principle, the future is fixed and stable. We just lack the time or energy to compute it. That is a practical limit, not a feature of the reality itself."*

  **Comparison to Alternative Rule (Computational Irreducibility):**
  If she were tracking **Computational Irreducibility** (a la Stephen Wolfram), she would classify Case 5 as **Structurally Unpredictable**. Under that rule, the absence of a shortcut *is* the definition of structural unpredictability, regardless of stability. Her Case 1 remark ("not merely... computing power") makes this interpretation unlikely.

  ### 3. The Distinguishing Test Case

  To definitively distinguish between her rule (Exponential Divergence) and the alternative (Computational Irreducibility), you should present the following case:

  **The Test Case:** **A system with exponentially diverging trajectories but a discovered closed-form solution that permits direct computation of future states without iteration.**
  *(Example: The dyadic transformation $x_{n+1} = 2x_n \mod 1$. It is chaotic/divergent, but the state at step $N$ is given by a simple formula involving the $N$-th bit of the initial value.)*

