answer: |-
  # The Boundary Stability Protocol

  ## Introduction
  You are facing the **Sorites Paradox** (the paradox of the heap): if you remove one grain from a heap, it remains a heap; eventually, only one grain remains. Is it still a heap? In engineering, this manifests when you impose a binary state (`true`/`false`) on a continuous variable (load, time, quality).

  The fragility you sense comes from treating the threshold as a **discovery** (finding the "real" line) rather than a **policy** (drawing a line based on risk). This protocol forces you to treat thresholds as risk-management tools. It is designed to be run in 30 minutes, requires no philosophy training, and produces an audit trail.

  ## Part 1: The Method (Flowchart in Words)

  **Pre-requisite:** Gather the engineer proposing the rule, one peer reviewer, and data on the metric's distribution (if available).

  **Step 1: Anchor the Extremes**
  *   **Action:** Identify two values for the metric where classification is uncontroversial.
  *   **Input Needed:** Historical data or system limits.
  *   **Question:** "At Value A, is the classification definitely TRUE? At Value B, is it definitely FALSE?"
  *   **Pass Criteria:** Both engineers agree on the extremes without hesitation.
  *   **Fail/Stop:** If you cannot agree on extremes, the metric is ill-defined. Stop and consult Product.

  **Step 2: Analyze Error Costs**
  *   **Action:** Compare the cost of a False Positive (FP) vs. a False Negative (FN).
  *   **Input Needed:** Product impact assessment.
  *   **Question:** "Which is worse: Flagging a safe item as bad (FP) or missing a bad item (FN)?"
  *   **Pass Criteria:** Consensus on which error is more expensive/dangerous.
  *   **Stop & Defer:** If the cost involves legal liability, physical safety, or discriminatory impact, stop. Defer to Legal/Compliance. This is a values decision, not an engineering one.

  **Step 3: Define the Gray Zone**
  *   **Action:** Estimate the range where the system cannot be confident.
  *   **Input Needed:** Variance data or heuristic estimation.
  *   **Question:** "In what range does the metric fluctuate enough that a decision today might be wrong tomorrow?"
  *   **Pass Criteria:** A defined range (e.g., 450–550) is identified.
  *   **Note:** If the range is 0% of the scale, you are likely overconfident. Assume at least 5–10% variance.

  **Step 4: Select the Mechanism**
  *   **Action:** Choose how to handle the Gray Zone based on Step 2.
  *   **Options:**
      1.  **Hard Cutoff:** Only if Error Cost is low and Variance is negligible.
      2.  **Hysteresis (Buffer):** Use different thresholds for entering vs. exiting a state (e.g., warn at 80%, revoke at 90%).
      3.  **Human Review:** If Error Cost is high.
  *   **Pass Criteria:** Mechanism matches the Risk Profile.
  *   **Unwelcome Check:** If you wanted full automation but Error Cost is high, you must select Human Review or Hysteresis.

  **Step 5: Document the Rationale (The Audit Record)**
  *   **Action:** Fill out the **Boundary Decision Record** (template below).
  *   **Input Needed:** Answers from Steps 1–4.
  *   **Pass Criteria:** The record explains *why* the line was drawn, not just *where*.
  *   **Final Sign-off:** Product Manager reviews the Record, not just the number.

  ---

  ## Part 2: The Boundary Decision Record (Template)

  *To be saved in the repository alongside the rule configuration.*

  1.  **Predicate:** [e.g., `is_account_inactive`]
  2.  **Anchor Points:** [Value definitely False] to [Value definitely True]
  3.  **Primary Risk:** [False Positive Cost] vs. [False Negative Cost]
  4.  **Gray Zone:** [Start Value] to [End Value]
  5.  **Mechanism:** [Hard Cutoff / Hysteresis / Review]
  6.  **Rationale:** [One sentence explaining the trade-off, e.g., "We prioritize stability over user convenience."]
  7.  **Review Date:** [Date to re-evaluate based on logs]

  ---

  ## Part 3: Application to Current Cases

  ### Case 1: API Client Excessive Use
  *Goal: Set a warning threshold between 10 req/min (safe) and 10,000 req/min (danger).*

  **Step 1: Anchors**
  *   Safe: 50 req/min (Normal operation).
  *   Danger: 5,000 req/min (Database lock risk).
  *   *Status:* Agreed.

  **Step 2: Error Costs**
  *   False Positive (Warn a good client): Annoyance, support ticket.
  *   False Negative (Don't warn a bad client): Service outage.
  *   *Verdict:* Outage is significantly more costly than annoyance.

  **Step 3: Gray Zone**
  *   Traffic bursts are natural. A client might hit 800 req/min for 10 seconds legitimately.
  *   *Gray Zone:* 500 to 1,500 req/min (rolling average).

  **Step 4: Mechanism**
  *   *Team Wish:* Single cutoff at 1,000.
  *   *Protocol Recommendation:* **Hysteresis.**
  *   *Reasoning:* Because False Negatives (outage) are costly, the "Danger" state must be harder to exit than to enter.
  *   *Implementation:*
      *   Warning Trigger: 1,000 req/min (sustained 1 min).
      *   Rate Limit Trigger: 2,000 req/min.
      *   Rate Limit Reset: Must drop below 800 req/min (buffer) before limit is lifted.
  *   *Audit Record:* "Thresholds set to prioritize cluster stability. Buffer zone prevents flapping limits during bursty legitimate traffic."

  **Step 5: Outcome**
  *   **Implementation:** Warning at 1k, Hard Limit at 2k, Reset at 800.
  *   **Monitoring:** Log all clients entering the 800–2,000 Gray Zone for Product review to tune later.

  ### Case 2: Archiving Inactive Accounts
  *Goal: Select notification and archival thresholds (1 day active vs. 12 months inactive).*

  **Step 1: Anchors**
  *   Active: 30 days (User likely returning).
  *   Inactive: 12 months (User likely churned).
  *   *Status:* Agreed.

  **Step 2: Error Costs**
  *   False Positive (Archive active user): User loses access/data. High trust damage. Support cost.
  *   False Negative (Keep dead account): Storage cost. Low immediate impact.
  *   *Verdict:* False Positive is unacceptable.

  **Step 3: Gray Zone**
  *   Users return sporadically. 6 to 11 months is the uncertainty window.
  *   *Gray Zone:* 6 months to 12 months.

  **Step 4: Mechanism**
  *   *Team Wish:* Hard cutoff at 12 months.
  *   *Protocol Recommendation:* **Hysteresis with Notification.**
  *   *Reasoning:* Because False Positive cost is high (trust loss), we must widen the Gray Zone and add a step.
  *   *Implementation:*
      *   Notification: Sent at 9 months ("We will archive soon").
      *   Archive Action: Executed at 12 months.
      *   Reactivation: Any login resets clock to 0 immediately.
      *   **Buffer:** Accounts between 11 and 13 months are "Soft Archived" (data exists but requires email reset to access).

  **Step 5: Outcome**
  *   **Implementation:** Notify @ 9mo, Soft Archive @ 12mo, Hard Delete @ 24mo.
  *   **Monitoring:** Track re-activation rates of "Soft Archived" accounts to validate the 12-month assumption.

  ### Case 3: Image Quality (Sharpness Score 0–1000)
  *Goal: Fully automated rejection of blurry images.*

  **Step 1: Anchors**
  *   Sharp: Score 900+ (Clear text).
  *   Blurry: Score <200 (Unrecognizable).
  *   *Status:* Agreed.

  **Step 2: Error Costs**
  *   False Positive (Reject good image): User frustration, upload abandonment.
  *   False Negative (Accept bad image): Poor marketplace quality, reduced trust.
  *   *Verdict:* Context dependent, but generally, marketplace quality is the core product value. However, user friction is high.

  **Step 3: Gray Zone**
  *   Algorithmic scoring varies by lighting/subject. A score of 500 might be a dark but sharp image, or a bright blurry one.
  *   *Gray Zone:* 400 to 600.

  **Step 4: Mechanism**
  *   *Team Wish:* **Full Automation** (Hard Cutoff at 500).
  *   *Protocol Recommendation:* **Human Review (or Quarantine).**
  *   *Reasoning:* Visual quality is inherently vague (Sorites). A hard cutoff at 500 guarantees that a 499 (acceptable) is rejected and a 501 (unacceptable) is accepted. Since you cannot define "sharp" precisely, a hard cutoff creates arbitrary rejection.
  *   *Unwelcome Constraint:* You cannot fully automate this without accepting arbitrary errors.
  *   *Implementation:*
      *   Auto-Accept: >600.
      *   Auto-Reject: <400.
      *   **Quarantine Zone (400–600):** Image is accepted but flagged "Low Quality." If the user is a new vendor, hold for review. If trusted, auto-accept but log.
      *   *Alternative:* If human review is strictly impossible, the threshold must be set conservatively (e.g., 400) to minimize False Positives, accepting that some blurry images will slip through.

  **Step 5: Outcome**
  *   **Implementation:** **Rejected the request for full automation.** Implemented Quarantine Zone (400–600).
  *   **Monitoring:** Sample 10% of Quarantine Zone images weekly to measure "False Accept" rate.
  *   **Audit Record:** "Full automation rejected due to high variance in scoring metric. Quarantine zone implemented to balance quality vs. friction."

  ---

  ## Part 4: Limitations and Failure Modes

  This method stabilizes your engineering practice, but it is not a magic bullet. Be aware of the following:

  **1. What the Method Cannot Settle**
  *   **Value Judgments:** The method identifies *where* the value judgment is needed (Step 2: Error Costs), but it cannot make the judgment for you. If Product says "User frustration is worse than blurry images," you must accept that policy even if engineering disagrees.
  *   **Adversarial Actors:** This method assumes natural variance. It does not account for bad actors trying to game the threshold (e.g., sending 999 requests to stay under the 1,000 limit). Adversarial contexts require security-specific threat modeling, not just vagueness management.

  **2. Where It Is Most Likely to Misfire**
  *   **The "Set and Forget" Error:** The biggest risk is treating the Decision Record as a permanent truth. Vagueness is context-dependent. A "sharp" image in 2024 might be defined differently by users in 2025.
      *   *Mitigation:* The "Review Date" in the Decision Record is mandatory. Treat thresholds as **depreciating assets**.
  *   **Metric Drift:** The underlying metric (e.g., the sharpness score algorithm) may change behavior over time. A score of 500 today might not mean the same thing in six months.
      *   *Mitigation:* Monitor the *distribution* of scores, not just the pass/fail rate. If the distribution shifts, re-run the Protocol.

  **3. The "Unwelcome" Reality**
  *   In Case 3 (Images), the protocol forced you to admit that **full automation is a lie** for vague predicates. You will likely face pressure to remove the Quarantine Zone to save costs.
  *   *Defense:* Use the Audit Record. When a user complains about a rejected image, you can show the PM: "We agreed that errors in this zone were inevitable. We chose to buffer rather than block. Removing the buffer increases support tickets by X%."

  ## Summary for the Product Manager
  When presenting this to your PM, do not say "We are solving the Sorites Paradox." Say:
  > "We are implementing a **Risk Buffer Protocol**. Instead of picking a magic number that will inevitably be wrong for edge cases, we are defining a 'Safe Zone,' a 'Danger Zone,' and a 'Review Zone.' This reduces support tickets caused by arbitrary cutoffs and gives us data to tune the line later."
