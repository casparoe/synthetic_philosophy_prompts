answer: |-
  Ubuntu resolves the tension between relational constitution and individual agency by framing personhood as a normative achievement rather than a static metaphysical fact, thereby allowing individuals to retain moral accountability even when communal support is deficient.

  In Ubuntu ontology, relations are internal rather than external, meaning they are constitutive of who a person is rather than merely accidental associations between pre-existing atoms of agency. However, recognizing relations as internal does not necessitate collective determinism, because the relational constitution of the self provides the *capacity* for morality without dictating specific *choices*. Personhood is viewed as a gradual moral accomplishment wherein the community provides the necessary conditions for growth, but the individual must actively sustain those relations through virtuous conduct. Consequently, thick relationality avoids collapsing into determinism because the status of being a "person" is precarious and contingent upon one's own moral efforts; one can exist biologically yet fail to achieve full moral personhood through antisocial actions, preserving a locus of non-derivative responsibility rooted in the ability to either honor or violate communal bonds.

  When applied to an agent raised in conditions of radical relational deprivation who commits a serious wrong, Ubuntu commits us to acknowledging that the community's failure is partly constitutive of the wrong, as the agent was denied the relational nutrients required for full moral development. This does not erase individual accountability, but it recontextualizes it: the agent retains responsibility for the specific act because they possessed sufficient agency to choose, yet the community bears a derivative responsibility for the degraded moral context that made the wrong more likely. Accountability remains conceptually coherent because responsibility is differentiated rather than negated; the individual is held accountable not through retributive isolation, which further severs relations, but through restorative processes that acknowledge the communal deficit while demanding the agent participate in repairing the harm. Thus, the agent is judged not as an isolated sovereign will but as a damaged node in a network, responsible for their output yet entitled to have the network's failure weighed as a mitigating factor in their moral rehabilitation.
