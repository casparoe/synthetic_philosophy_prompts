answer: |-
  **BUREAU OF DETERMINATE CHOICE**
  **PUBLIC GUIDANCE LEAFLET 44-B**
  **SO YOU ARE INDIFFERENT: GUIDANCE FOR APPLICANTS**

  **Motto:** *Preference Is Truth.*

  **Introduction**
  Welcome to the Bureau. You have arrived because you claim unable to select between Option A and Option B. Please understand: indifference is not a fact about the world; it is a failure of self-knowledge. For any two options put before a citizen, a preference exists. The Bureau's job is not to create preference, but to extract it. Note: In keeping with our operational standards, the Staff Canteen has served no lunch since the founding because the kitchen cannot establish a preference between two identical specials. We view this not as hunger, but as integrity.

  **Frequently Asked Questions**

  **1. I have examined both options and they are exactly equally good. What now?**
  There is no such state as "exactly equally good." You are confusing parity with identity. Even if the options appear identical in rent, light, and commute, you are not. Your interaction with the options creates a gradient. If you cannot feel it, you are not looking inwardly enough.

  **2. What if I would only choose A if it were one cent cheaper?**
  Then you prefer A. This is the Penny Rule. If you are willing to incur a cost (however minimal) to secure Option A over Option B, you have revealed a pre-existing preference for A. The cost does not manufacture the preference; it illuminates it. You preferred A all along; you simply required a monetary gradient to access the truth.

  **3. I preferred A when I saw it first, but B when I saw it second. Which is real?**
  Neither. This is Order Fraud. A rational will does not fluctuate based on presentation sequence. If your stated preference reverses based on ordering, you are lying about at least one of those states. You will be required to submit a static preference statement under timed conditions.

  **4. Can I flip a coin?**
  No. To randomize is to abdicate. A rational agent must act for a reason. If you flip a coin, you are admitting that reasons have run out. We do not permit citizens to act without reasons. The coin has no stake in your life; only you do.

  **5. What if I simply choose nothing?**
  Inaction is a meta-choice. By refusing to choose between A and B, you are choosing the Status Quo (Option C). This requires its own preference statement explaining why the Status Quo is preferable to either A or B. Please fill out Form 12-Null.

  ***

  **APPENDIX: WORKED CASE STUDY (REF: 8990-K)**
  **Applicant:** Ms. Elara V.
  **Decision:** Flat 4A vs. Flat 4B.
  **Conditions:** Identical rent, light, commute, layout.
  **Statement:** "I genuinely don't mind. They are the same."

  **Resolution:**
  The Officer placed both keys on the table. Ms. V. hovered. The Officer asked Ms. V. to pay a processing fee of one cent for the lease initiation of Flat 4A. Ms. V. produced the cent.
  **Finding:** Ms. V. preferred 4A.
  **Reasoning:** Had she truly been indifferent, the expenditure of one cent would have been a net loss with no compensatory preference gain. By paying, she revealed that 4A + 1¢ cost was preferable to 4B + 0¢ cost. Therefore, 4A was preferred prior to payment.
  **Outcome:** Lease signed for 4A. Applicant advised to meditate on why she lied about indifference.

  ***

  **Philosophical Post-Mortem**

  This leaflet takes a hardline stance in rational choice theory. It treats the "Penny Rule" as conclusive proof of revealed preference, ignoring that micro-costs might be noise rather than signal. It collapses Ruth Chang's distinction between "equality" and "parity," insisting all options are comparable on a single scale. It also rejects randomization as a rational tie-breaker, framing it as irrational abdication rather than a valid strategy when reasons are exhausted.

  The objection that would force a rewrite comes from Ruth Chang herself. She argues that in "hard cases," reasons run out not because of ignorance, but because the options are "on a par." Preference isn't always discovered; sometimes it is created by the act of choosing. The Bureau treats choice as archaeology (digging up truth), whereas Chang argues it is architecture (building commitment). If the novel aims to show the Bureau's cruelty, highlighting their refusal to let citizens *create* meaning through choice would be the sharpest critique.
