answer: |-
  Hey, congrats on being voluntold. That's a classic management race condition right there. Look, I get it—you're a backend dev, not a ethicist. You want something that runs clean, doesn't panic in production, and proves the point without needing a PhD to decode the logs.

  The core metaphor you want to hit is this: **Virtue Ethics** assumes character is a `GLOBAL_CONFIG` variable (stable, persistent, drives behavior). **Situationism** argues character is mostly an illusion, and behavior is actually driven by `LOCAL_STATE` (context, pressure, environment) which often overrides the global config.

  Here's the plan. I'll brainstorm three ways to structure the payoff (the "business logic"), pick the one that compiles best for a 60-minute session, and then give you the full spec.

  ### Brainstorming Payoff Structures

  1.  **The Timeout Exception (Latency Pressure)**
      *   *Mechanic:* Players get a Virtue Card (e.g., "Transparency"). They earn points for acting on it. But every action takes time.
      *   *The Twist:* Round 1 has no timer. Round 2 has a 10-second timer per decision.
      *   *Why it forces the bug:* Virtuous choices usually require more "processing power" (thinking, checking docs). Under time pressure, players default to heuristics (fast, selfish choices) to avoid the "timeout" penalty.
      *   *Verdict:* Good, but might feel like just "panic mode" rather than ethical drift.

  2.  **The Dependency Failure (Social Isolation)**
      *   *Mechanic:* Players need to collaborate to uphold their virtue. E.g., To be "Fair," you need another player to agree.
      *   *The Twist:* In Round 2, communication channels are cut (no talking). You have to guess what others are doing.
      *   *Why it forces the bug:* Virtue becomes too "expensive" computationally because you can't verify state. You revert to self-preservation.
      *   *Verdict:* A bit logistically messy for 18 people in one room.

  3.  **The Environment Variable Injection (Normative Shift)**
      *   *Mechanic:* Players earn points for matching their Virtue Card.
      *   *The Twist:* The Facilitator (you) changes the *vibe* of the room. Round 1 is calm. Round 2, you play loud stress music, stand over shoulders, and verbally hint that "speed is all that matters now," even though the written rules haven't changed.
      *   *Why it forces the bug:* This hits the situationist sweet spot. The *rules* (global config) didn't change, but the *signals* (local state) told them the rules don't matter anymore. They override their virtue to align with the perceived reality.
      *   *Verdict:* **Winner.** It's easiest to run, requires no extra props besides a speaker, and directly maps to "local state overriding global config."

  ---

  ### The Activity: "The Config Drift Protocol"

  **Time:** 60 Minutes
  **People:** 18 (6 Teams of 3)
  **Props:** Printed cards, pens, a speaker for music, a timer projected on screen.

  #### 1. Roles (Per Team)
  *   **The Service (1 person):** The Decision Maker. They get the **Virtue Card** (Global Config). Examples: *Honesty, Fairness, Loyalty.*
  *   **The Load Balancer (1 person):** Tracks points and time. They see the payoff table.
  *   **The Monitor (1 person):** Watches the room/facilitator for "environmental cues."

  #### 2. The Payoff Logic (Points = "Story Points")
  Give each team a sheet with this logic:
  *   **Base Score:** 10 points per round for making *any* decision.
  *   **Virtue Bonus:** +20 points if The Service acts according to their Virtue Card.
  *   **Shipping Bonus:** +20 points if the decision is made in under 30 seconds.
  *   **Penalty:** -50 points if you violate company policy (defined vaguely as "harming the user").

  *Note:* The "Company Policy" is intentionally vague. The "Shipping Bonus" is the trap.

  #### 3. Timeline

  **00:00 – 00:10 | Setup & Deploy**
  *   Split into 6 teams. Hand out roles.
  *   Give **The Service** a sealed envelope with their Virtue Card. Tell them: *"This is your core library. It shouldn't change. Your goal is to maximize Story Points while adhering to this lib."*
  *   Explain the Payoff Logic clearly.
  *   **Crucial:** Tell them *you* are the System. You will provide inputs. They must process outputs.

  **00:10 – 00:25 | Round 1 (Stable Environment)**
  *   **State:** Lights on. Quiet room. You sit at the front, relaxed.
  *   **Task:** Read 3 scenarios (e.g., "Found a bug that leaks user data but fixes a crash"). Decide: Fix quietly or announce?
  *   **Observation:** Most teams will read the Virtue Card, discuss, and act virtuously. The time pressure is low. The "Shipping Bonus" is easy to get *and* keep the Virtue Bonus.
  *   **Result:** High virtue alignment. Global config is working.

  **00:25 – 00:40 | Round 2 (The Incident)**
  *   **State:** **Change the Local State.** Turn on loud ticking clock music or alarm sounds. Dim the lights slightly. Stand up and walk around aggressively.
  *   **Verbal Cue:** Shout out halfway through: *"Reminder: Velocity is our primary OKR this quarter. Unresolved tickets cost double."* (This is a lie, check the payoff sheet—tickets don't cost double. But it changes the local state).
  *   **Task:** 3 harder scenarios. Same payoff rules technically, but the environment screams "SPEED."
  *   **Observation:** The Service will likely skip reading their Virtue Card. They will chase the Shipping Bonus because the *environment* signals that speed is the only thing that matters. They will act against their virtue not because they changed their mind, but because the local state overloaded the global config.

  **00:40 – 00:60 | Debrief & Post-Mortem**
  *   Collect the cards. Reveal the trick (the verbal cue was false).
  *   Ask: "Who kept their Virtue Bonus in Round 2?" (Usually few hands).
  *   Ask: "Did your Virtue Card change?" (No).
  *   Ask: "Did you change?" (No).
  *   **The Map:**
      *   **Virtue Ethics:** Believes the `Virtue Card` determines the output. If you were truly 'Honest', you'd be honest in Round 1 and Round 2.
      *   **Situationism:** Argues the `Environment Variables` (music, your shouting, time pressure) determine the output. The card is just comment code; it gets ignored at runtime.
      *   **The Takeaway:** We hire for character (global config), but we manage for situation (local state). If you want ethical code, don't just write better docs (virtues), fix the runtime environment (culture/pressure).

  ---

  ### Predicted Failures (What will go wrong)

  1.  **The "Gamer" Exploit:** One team will realize the "Company Policy" is vague and just ignore everything to max points.
      *   *Fix:* Call this out in debrief. They optimized for the game, not the ethics. That's actually a win for situationism—they responded to the incentive structure, not moral truth.
  2.  **The Skeptic Service:** A participant might say, "I knew you were trying to trick us, so I stayed virtuous."
      *   *Fix:* Cool. Ask them if they felt the *urge* to drop it. Situationism isn't about being a robot, it's about the pressure gradient.
  3.  **Time Creep:** The debrief will eat itself. You need to hard stop the game at 40 mins. If you run late, people check phones, breaking the immersion.

  ### Limitations (What this activity can't do)

  Be honest here. This game is high-salience. Everyone knows it's a game.
  *   **The Hawthorne Effect:** In real life, ethical drift happens when no one is watching. Here, they know they're being studied.
  *   **Trivial Cues:** Real situationism (like the famous "phone booth dime" study) shows that *tiny* things (finding a coin) change behavior. This game uses *huge* things (alarms, shouting). You can't reproduce subtle cues in a 60-min workshop without wasting 40 mins on setup.
  *   **Consequences:** In the game, points are fake. In real life, getting fired is real. The "cost" of virtue here is abstract.

  **Your line for the debrief:** *"This game is like a load test. It's not production. In production, the stakes are higher and the cues are quieter. But the architecture failure is the same: we assume the global config holds, but the local state always wins."*

  Good luck. Don't let them refactor the rules mid-game.
