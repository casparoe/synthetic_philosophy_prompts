      *   **Topic:** Psychiatric labels, Ian Hacking's "looping effects," and a counter-concept ("counter-looping") where patients/advocates push back on the system.
      *   **Task:** Compare Hacking's looping with counter-looping.
      *   **Specific Points to Cover:**
          *   Map epistemic power in each loop.
          *   Determine if counter-looping destabilizes classification or adds a feedback layer.
