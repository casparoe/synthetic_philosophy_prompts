prompt: |-
  hey, i'm a science journalist working on a feature about psychiatric labels and how they change the people they describe—hacking's looping effects, you know? i also want to bring in this less-discussed idea of counter-looping where advocacy groups and self-identified patients dont just internalize the diagnosis but push back on the classification system itself, altering criteria from below. can you compare hacking's looping with this counter-looping dynamic? in particular, map out who holds the epistemic power in each loop, whether counter-looping destabilizes the classification or just adds a second feedback layer, and whether the two can coexist in the same diagnostic category without contradiction. write it casually but get into the weeds—no bibliographies, just reason through the concepts. and dont quote anyone verbatim unless your absolutely sure of the wording.
