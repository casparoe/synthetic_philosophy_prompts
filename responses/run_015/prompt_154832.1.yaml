          *   *Epistemic Power:* Shared or contested. Lived experience becomes a form of expertise.
          *   *Example:* Autism neurodiversity movement (changing "disorder" to "difference"), or the removal of homosexuality from the DSM.
      *   **Comparison/Interaction:**
          *   *Power:* Hacking = Expert authority + Human reaction. Counter = Activist authority + Institutional negotiation.
