answer: |-
  It is excellent that you spotted the conflation in that blog post. Your suspicion is well-founded: in popular exposition, Epistemic Contextualism and Pragmatic Encroachment are frequently lumped together as "the view that stakes matter," but in the technical literature, they are distinct mechanisms with different commitments.

  As requested, I will proceed as a professional epistemologist. I will avoid smoothing over disagreements; where the literature is contested, I will flag the contestation.

  ### Part 1: Precise Restatement of the Views

  To understand where these views diverge, we must distinguish between the **subject** (the person who might know something) and the **attributor** (the person saying "S knows that p").

  **1. Epistemic Contextualism**
  *   **The Claim:** The word "knows" is context-sensitive. Its semantic content shifts depending on the **attributor's** conversational context.
  *   **The Mechanism:** In a "low-standards" context (e.g., casual chat), "knows" requires less evidence. In a "high-standards" context (e.g., a courtroom or a safety review), "knows" requires more evidence.
  *   **The Result:** The sentence "The engineer knows the bracket is within spec" can be true when spoken by a colleague in the breakroom and false when spoken by a lawyer in a deposition, *even if the engineer's evidence remains exactly the same.*
  *   **Key Distinction:** Contextualism is a thesis about the *semantics of the word "knows,"* not necessarily about the mental state of the knower.

  **2. Pragmatic Encroachment (often called Subject-Sensitive Invariantism)**
  *   **The Claim:** Whether a subject *has* knowledge depends partly on the practical stakes facing the **subject**.
  *   **The Mechanism:** Knowledge is not purely a function of truth, belief, and evidence. It is also a function of how much it matters to the subject if they are wrong. As stakes rise, the evidential threshold required to cross the line into "knowledge" rises.
  *   **The Result:** If the stakes for the engineer are low, they know. If the stakes for the engineer become high (without any change in evidence), they literally cease to know.
  *   **Key Distinction:** Encroachment is a thesis about the *nature of knowledge itself*. It claims practical factors encroach on the epistemic domain.

  **3. Where They Come Apart**
  The divergence lies in *whose* context matters and *what* is shifting.
  *   **Contextualism:** Shifts based on the **speaker's** context. It explains why we *hesitate to say* "I know" in high-stakes situations, but it doesn't necessarily say the knowledge state itself changed.
  *   **Encroachment:** Shifts based on the **subject's** practical situation. It says the knowledge state *itself* changes.
  *   **The Conflict:** A Contextualist can be an Invariantist about the knowledge relation (the relation is fixed, the word changes). An Encroacher is an Invariantist about the word "knows" (it means the same thing everywhere) but claims the relation itself is sensitive to stakes.

  ### Part 2: Audit of the Blog Post

  Here is the claim-by-claim evaluation of the text you provided.

  **Claim 1:** *"Knowledge... used to be understood as true belief plus good evidence, so whether you know depends only on your reasons and nothing else."*
  *   **Verdict:** **Fine as stated (with caveats).**
  *   **Comment:** This describes **Traditional Invariantism**. Specialists would add "and no defeaters" (Gettier conditions), but for a summary, this is acceptable.

  **Claim 2:** *"Contextualism... points out that 'knows' behaves like words such as 'flat' or 'tall': the standards it sets shift with the context of the conversation."*
  *   **Verdict:** **Fine as stated.**
  *   **Comment:** This is the standard "gradient adjective" analogy used by Keith DeRose and David Lewis.

  **Claim 3:** *"I can truly say on Friday that I know the bank will be open on Saturday, and yet later that day, when missing a mortgage payment is on the line, that very claim about me is false."*
  *   **Verdict:** **Misleading.**
  *   **Comment:** This description blurs the line between Contextualism and Encroachment. A strict Contextualist says the claim becomes false if the *attributor's* context shifts (e.g., if I start talking to a bank auditor). If the stakes change for the *subject* (the person going to the bank) but the speaker is still in a casual context, a Contextualist might say the claim remains true. This example is actually the classic illustration for **Pragmatic Encroachment** (Keith DeRose's Bank Case is often read this way, though he is a contextualist, which adds to the confusion).

  **Claim 4:** *"Pragmatic encroachment... is just the same idea in different clothes."*
  *   **Verdict:** **Wrong.**
  *   **Comment:** This is the error you suspected. They are theoretically distinct. Contextualism saves Invariantism about the *state* of knowledge by moving the variability to the *language*. Encroachment changes the *state* of knowledge.

  **Claim 5:** *"Knowledge is partly a practical matter rather than a purely evidential one."*
  *   **Verdict:** **Fine for Encroachment.**
  *   **Comment:** This is the core slogan of the Encroachment view (defended by Jason Stanley and John Hawthorne).

  **Claim 6:** *"The invariantists... are stuck denying the obvious point that you need stronger evidence when more is riding on being right."*
  *   **Verdict:** **Misleading / Strawman.**
  *   **Comment:** Invariantists do not deny you need stronger evidence to *act* rationally. They deny you need stronger evidence to *know*. They argue that knowledge is one thing, and rational action is another. You can know something but be irrational to act on it if stakes are high. The post presents this as a bug; Invariantists present it as a feature.

  **Claim 7:** *"If knowledge depends on stakes, then a stranger who secretly places a huge bet... can destroy your knowledge... and since that's obviously absurd, the whole family of views is refuted."*
  *   **Verdict:** **Fine but doesn't do the work.**
  *   **Comment:** This is a known objection (often called the "Problem of Irrelevant Stakes" or "Secret Stakes"). However, saying it "refutes" the views is too strong. Proponents of Encroachment have replies (e.g., knowledge is the norm of *practical reasoning*, so only stakes relevant to the agent's decision tree count). It is a serious tension, not a knockout blow.

  ### Part 3: Application to Your Hardware Case

  Now we apply the surviving theories to your torque check scenario.
  *   **Friday:** You check torque. Evidence = Good (standard protocol). Stakes = Low (ordinary job).
  *   **Saturday:** Manager makes it the gate for $40M shipment. Stakes = High. You are unaware.
  *   **Monday:** Client postpones. Stakes = Low.

  Here is how the three major camps analyze your situation.

  **1. The Traditional Invariantist (Your Intuition)**
  *   **View:** Knowledge depends only on truth, belief, and evidence (and lack of defeaters). Stakes affect *action*, not knowledge.
  *   **Verdict:** You **knew** on Friday, Saturday, and Monday.
  *   **Reasoning:** Your evidence (the torque check) did not change. The fact that the manager raised the stakes does not alter your epistemic position. However, on Saturday, it would have been *irrational* to ship the parts based *only* on that check, even though you knew they were good. You had knowledge, but insufficient justification for the high-stakes action.
  *   **On "Flickering":** Knowledge does not flicker. It is stable.
  *   **Specialist Note:** This is the dominant view in classical epistemology and aligns with your intuition ("stakes change what you should do, not what you know"). It is not stubbornness; it is a robust philosophical position defended by philosophers like Timothy Williamson.

  **2. The Pragmatic Encroacher**
  *   **View:** Knowledge depends on stakes facing the subject.
  *   **Verdict:** You **knew** on Friday. You **did not know** on Saturday. You **knew** again on Monday.
  *   **Reasoning:** On Saturday, the stakes for the *project* were high. The difficult question is: *Whose stakes count?*
      *   If only *your* personal stakes count (e.g., will you be fired?), and you didn't know about the shipment, an Encroacher might say you still knew.
      *   However, most Encroachers argue that stakes relevant to the *agency* you are participating in count. Since you are the agent performing the check for the shipment, the shipment's stakes attach to you.
  *   **On "Flickering":** Encroachers accept that knowledge can flicker. They argue this is not absurd; it reflects that knowledge is a tool for navigation. If the terrain gets dangerous (high stakes), you need a better map (more evidence) to say you "know" the way.
  *   **Specialist Note:** This view is controversial specifically because of the "flickering" consequence.

  **3. The Epistemic Contextualist**
  *   **View:** "Knows" changes meaning based on who is asking.
  *   **Verdict:** It depends on who is asking the question on Monday.
  *   **Reasoning:**
      *   If your colleague asks on Monday, "Did you know Friday?", the conversational context is low-stakes. The sentence "You knew Friday" is **True**.
      *   If a lawyer asks on Monday, "Did you know Friday?", the context is high-stakes (liability). The sentence "You knew Friday" might be **False**, because in this context, "know" implies a level of certainty your torque check didn't meet.
  *   **On "Flickering":** The *fact* of your mental state didn't flicker. The *truth value of the sentence describing it* flickers based on the conversation.
  *   **Specialist Note:** Contextualism has lost some popularity in the last decade compared to Encroachment and Invariantism, partly because it makes knowledge claims too dependent on linguistic accidents.

  ### Part 4: Addressing Your Specific Sub-Questions

  **1. "Is my position (stakes change action, not knowledge) a real position?"**
  Yes. This is **Traditional Invariantism** (sometimes called "Purism"). It distinguishes between *Epistemic Rationality* (do you have enough evidence to know?) and *Practical Rationality* (do you have enough evidence to act?). Specialists defend this by arguing that conflating the two makes knowledge too unstable. If you prefer this view, you are in good company (e.g., Jason Stanley's opponents, like Patrick Rysiew or Jessica Brown).

  **2. "Does it matter that the stakes were the client's/employer's, not mine?"**
  *   **For Invariantism:** No. Stakes never matter for knowledge.
  *   **For Encroachment:** Yes, this is a major debate. Some argue only the subject's personal stakes matter. Others (like Stanley) argue that if you are acting as part of a team, the team's stakes become your stakes. If your coworker mentioned "Moral Encroachment," they likely meant that the *ethical weight* of the error (destroying a satellite) raises the bar. Technically, "Moral Encroachment" is usually reserved for beliefs about people (e.g., stereotypes), where moral harms raise the evidential bar. In your case, it is **Pragmatic Encroachment** with high financial stakes. The distinction doesn't change the answer: if encroachment is true, the stakes likely transfer to you as the responsible agent.

  **3. "Is the secret-bet objection a serious problem?"**
  It is a serious *objection*, but not a settled *refutation*.
  *   **The Objection:** If a stranger bets $100M on your belief, Encroachment says you lose knowledge. This seems absurd because the stranger is irrelevant to your cognitive state.
  *   **The Encroacher's Reply:** Knowledge is the norm of *practical reasoning*. If the stranger's bet changes the rationality of the action associated with the belief, it changes the knowledge status. However, many encroachers refine the view to say only stakes *known to the subject* or *relevant to the subject's decision* count. Since you didn't know about the manager's decision on Saturday, a sophisticated Encroacher might actually agree with you: **You still knew on Saturday**, because the high stakes were not part of your practical reasoning environment.
  *   **The Invariantist's Reply:** The objection confirms Invariantism. Knowledge is immune to external bets; only rational action is sensitive to them.

  ### Summary Recommendation for Your Situation

  You asked: *Did I know on Friday? Did I stop knowing on Saturday?*

  *   **If you adopt the Invariantist view (which matches your intuition):** You knew on Friday, Saturday, and Monday. The manager's decision changed the **risk profile of the action**, not your **epistemic status**. You were in a state of knowledge, but on Saturday, that knowledge was insufficient to warrant the action of shipping without further checks. This preserves the stability of knowledge while acknowledging the reality of risk.
  *   **If you adopt Encroachment:** You likely knew Friday and Monday, but not Saturday *if* the manager's stakes count as yours. However, since you were unaware of the stakes, many encroachers would concede you still knew, because knowledge guides *your* reasoning, and your reasoning didn't account for the $40M risk.
  *   **If you adopt Contextualism:** You knew relative to the Friday/Monday conversation. You "didn't know" relative to a hypothetical Saturday safety audit conversation.

  **Professional Advice:**
  Your intuition is philosophically robust. The distinction between "knowing" and "being justified in acting" is the standard engineering approach to epistemology. In safety-critical systems, we often say, "We have verified this," (knowledge claim) but require redundancy not because we doubt the verification, but because the **cost of error** outweighs the **confidence of the verification**.

  The blog post was wrong to conflate Contextualism and Encroachment, and wrong to suggest Invariantists deny the need for stronger evidence in high-stakes *actions*. They only deny it is required for *knowledge*. You can hold that you knew the bracket was within spec on Saturday, while simultaneously holding that shipping it on that evidence alone would have been negligent. That is not a contradiction; it is the distinction between epistemology and decision theory.
