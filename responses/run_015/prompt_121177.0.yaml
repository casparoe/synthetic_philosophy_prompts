answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION: ANTHROPIC REASONING PRINCIPLES

  **Parties:** Proponent of Self-Sampling Assumption (SSA) | Proponent of Self-Indication Assumption (SIA)
  **Date:** October 26, 2023
  **Subject:** Clarification of Disagreements regarding Indexical Uncertainty

  ## 1. AGREED CLAIMS

  We, the undersigned, acknowledge that while we diverge on the correct application of anthropic reasoning, we share a common understanding of the formal landscape. We agree to the following numbered claims:

  1.  **Definitions of Principles:**
      *   **SSA:** An agent should reason as if they are a random sample from the set of actual observers in their *reference class*. Formally: $P(H | I) \propto P(H) \times \frac{1}{N_H}$, where $N_H$ is the number of observers in the reference class under hypothesis $H$.
      *   **SIA:** An agent should reason as if they are a random sample from the set of all *possible* observers. Formally: $P(H | I) \propto P(H) \times N_H$, where $N_H$ is the number of observers in the reference class under hypothesis $H$.
      *   **Note:** We agree that SIA effectively cancels the $1/N_H$ term in SSA when the reference class is "all observers," leading to $P(H | I) \propto P(H)$, unless hypotheses differ in the *probability* of the agent existing at all.

  2.  **Standard Toy Cases and Outputs:**
      *   **Sleeping Beauty:** In the standard setup (Heads=1 awakening, Tails=2 awakenings), SSA (with reference class = awakenings) yields a credence of 1/2 for Heads ("Halfer"). SIA yields a credence of 1/3 for Heads ("Thirder").
      *   **The Doomsday Argument:** Given birth rank $n$ and uncertainty about total population $N$, SSA favors hypotheses where $N$ is small (imminent doom). SIA favors hypotheses where $N$ is large (canceling the rank evidence), rendering the argument void.
      *   **The Presumptuous Philosopher:** In a case where Theory A predicts 1 trillion observers and Theory B predicts 1 trillion trillion, SIA strongly favors Theory B purely based on observer count. SSA remains neutral (absent rank information).

  3.  **The Reference Class Problem:** We agree that SSA is undefined without a specified reference class. We agree that SIA is less sensitive to reference class specification but still requires a definition of "observer" or "observer-moment." We agree that neither principle provides a non-circular algorithm for selecting the *correct* reference class from first principles.

  4.  **Formalism Limits:** We agree that neither principle dictates:
      *   The non-anthropic priors ($P(H)$).
      *   The utility function for decision-making.
      *   How to handle cases involving actual infinities without regularization.

  5.  **Empirical Equivalence (Partial):** We agree that in cases where all competing hypotheses predict the *same* number of observers in the reference class, SSA and SIA yield identical posterior probabilities. The divergence arises strictly when hypotheses differ in the number of observers (or observer-moments) they entail.

  ## 2. DISAGREEMENTS TABLE

  | Crux | Sub-Question | SSA Formulation | SIA Formulation | Shared Evidence / Case | SSA Prediction | SIA Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Existence as Evidence** | Does the fact "I exist" update probabilities? | No. Existence is a precondition for observation, not data. Only indexical data ("I am observer #n") updates. | Yes. My existence is more likely in worlds where more observers exist. | **Presumptuous Philosopher:** Two theories of physics, identical priors, vastly different observer counts. | Credences remain equal (50/50). | Credence shifts massively toward the theory with more observers. |
  | **2. The Doomsday Intuition** | Is early birth rank evidence for a short future? | Yes. Being early is surprising in a long world. | No. Being early is compensated by the higher probability of existing in a long world. | **Doomsday Setup:** Known birth rank $n$, unknown total $N$. | Posterior favors small $N$. | Posterior favors large $N$ (proportional to prior). |
  | **3. Decision vs. Belief** | Is anthropics about truth or betting success? | Primarily about correct credences (calibration). Betting success is secondary. | Primarily about maximizing expected utility across all copies. Credences track this. | **Dutch Book Scenarios:** Betting setups involving self-locating agents. | SSA avoids Dutch Books if bets are per-observer. | SIA avoids Dutch Books if bets are per-world (total payout). |
  | **4. Infinite Worlds** | How to handle $N = \infty$? | Requires measure theory/cutoffs. SSA breaks if reference class is infinite. | Requires measure theory/cutoffs. SIA breaks if all worlds have infinite observers. | **Infinite Multiverse:** Hypotheses differ only in the "measure" of observers. | Undefined without arbitrary cutoff. | Undefined without arbitrary cutoff. |
  | **5. Ex Ante Choice** | Which rule would agents choose behind a veil of ignorance? | Agents would choose SSA to maximize the *average* welfare/belief accuracy of an observer. | Agents would choose SIA to maximize the *total* welfare/belief accuracy of the world. | **Pre-Registration Case:** Agents agree on a rule before copying occurs. | Select SSA (protects against dilution in big worlds). | Select SIA (capitalizes on existence in big worlds). |

  ## 3. ANALYSIS OF PROPOSED TEST CASES

  Per the request, we have analyzed two specific cases to test hypotheses regarding the scope and nature of our disagreement.

  ### Case A: The Relay
  **Setup:** You will live either one life (World A) or 1,000 lives in sequence with amnesia between them (World B). You wake up and are told you are in the first 10% of the sequence.
  **Hypothesis (a) Test:** *Does disagreement only show up for hypotheses that differ in observer counts?*
  **Analysis:** This case confirms that observer count divergence is necessary for SSA/SIA divergence. However, it clarifies that "observer count" includes *temporal* observer-moments within a single biological life if the reference class is "stages of consciousness."
  **Verdict:**
  *   **SSA:** Favors World A (One Life). Being in the first 10% is more likely if the total sequence is short (1 life) than if it is long (1,000 lives).
  *   **SIA:** Favors World B (1,000 Lives). There are 1,000x more observer-moments in World B, making your existence more likely there.
  *   **Status:** The principles come apart synchronically. The framing is **not broken**, provided the reference class for SSA is defined as "stages of this sequence." If the reference class is "all humans ever," the case dissolves.

  ### Case B: Pre-Registration
  **Setup:** Before being copied, you and your future copies agree on a single self-locating updating rule to be used by whoever wakes up.
  **Hypothesis (d) Test:** *Is the fight best relocated from "correct updating rule" to "which rule agents would choose ex ante"?*
  **Analysis:** This case reveals that the disagreement maps onto **Population Ethics**.
  *   If the goal is to maximize the **fraction of copies** who hold true beliefs (Average Utilitarianism), the group selects **SSA**.
  *   If the goal is to maximize the **total number of correct beliefs** held by the group (Total Utilitarianism), the group selects **SIA**.
  **Status:** The framing **smuggles in an answer** if it assumes there is a unique "rational" goal for the group. The choice of rule depends entirely on whether the pre-registered agents care about *being right on average* or *creating the most rightness in total*. This suggests the anthropic dispute is not merely epistemological but axiological.

  ### Hypothesis Testing Summary
  *   **(a) Observer Counts:** Confirmed. Divergence requires hypotheses to differ in observer count (or measure).
  *   **(b) SIA Cost:** SSA maintains SIA's "Presumptuous" result is a fatal flaw. SIA maintains it is a feature indicating SSA priors are misspecified (failing to account for selection effects).
  *   **(c) Infinities:** Confirmed as a shared failure mode. Neither principle handles $\infty$ vs $\infty$ without external regularization.
  *   **(d) Ex Ante Relocation:** Confirmed as productive. Moving to decision theory (UDT/FDT) often dissolves the *pragmatic* conflict, leaving only a semantic dispute about the word "probability."

  ## 4. VERBAL DISPUTES

  We identify the following portions of our six-week debate as likely verbal or terminological rather than substantive:

  1.  **"Probability":** The SSA proponent often uses "probability" to mean *degree of belief calibrated to relative frequency within a reference class*. The SIA proponent often uses "probability" to mean *weighting factor for decision-making in a branching multiverse*. If we agree to separate "credences" from "betting quotients," much friction vanishes.
  2.  **"Reference Class":** Arguments regarding whether "humans," "conscious moments," or "observers with this memory" constitute the class often devolve into semantic boundary-drawing. We agree this is a parameter to be set by context, not a fact of nature.
  3.  **"Existence":** The SIA claim "my existence is evidence" and the SSA claim "my existence is a precondition" may be compatible descriptions of the same formalism if "existence" is treated as indexical selection rather than ontological creation.

  ## 5. WHAT WOULD MOVE EACH OF US

  **To Move the SSA Proponent:**
  *   **Dutch Book Proof:** A demonstration that adhering to SSA leads to a sure loss in a betting scenario where the stakes are defined *ex ante* (before copying) rather than *ex post* (per observer).
  *   **Decision Theory Derivation:** A proof that a standard decision theory (e.g., Causal Decision Theory) *requires* SIA-like likelihoods to avoid dynamic inconsistency.
  *   **Reference Class Solution:** A non-arbitrary method for defining the reference class that does not require tuning to avoid the Doomsday conclusion.

  **To Move the SIA Proponent:**
  *   **Presumptuous Refutation:** A case where SIA mandates believing a physically implausible theory *solely* because it posits more observers, where independent physical evidence strongly contradicts it.
  *   **Calibration Argument:** A demonstration that SIA credences are systematically miscalibrated in repeated experiments (e.g., in a long series of Sleeping Beauty cases, the "Thirder" is right more often, but the "Halfer" is right more often *per world*).
  *   **Prior Specification:** A demonstration that the SIA "boost" can be fully absorbed into the non-anthropic prior without needing a separate anthropic principle.

  ***

  ### Meta-Note from the Drafter

  **Likely Refusal Point:**
  I anticipate the **SSA Proponent** will refuse to sign **Claim #1 (Definitions of Principles)**, specifically the formalization of SIA as $P(H | I) \propto P(H) \times N_H$. Hardline SSA proponents often argue that SIA is not a valid likelihood update but a confusion of priors. They may insist on framing SIA as "SSA with a specific, flawed prior" rather than a distinct principle. To secure signature, you may need to amend Claim #1 to read: "SIA *functions as if*..." rather than "SIA *is*..."

  **My Reasoning Vulnerability:**
  In **Case B (Pre-Registration)**, I may have smuggled in a **Total Utilitarian** bias. I framed the choice as "Total correct beliefs" vs "Average correct beliefs." However, a rational agent behind a veil of ignorance might not care about "total beliefs" in the abstract; they might care about *their own* utility. If the copies cannot transfer utility, the "Total" view is less obviously rational than the "Average" view. My analysis leans toward the idea that SIA is the "decision-theoretic" winner, but this depends on accepting that agents should maximize the sum of utilities across all copies, which is itself a controversial ethical stance, not a purely epistemic one. If the SSA proponent holds that identity does not extend across copies, the Pre-Registration case loses its force to compel SIA.
