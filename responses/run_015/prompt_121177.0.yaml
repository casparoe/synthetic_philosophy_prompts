      *   American English? Yes.

  12. **Writing the Document.** (Self-Correction during drafting: Ensure the distinction between "observers" and "observer-moments" is clear in the Relay case. Ensure the Pre-Registration case doesn't just collapse into "pick the one that makes money".)

  *(Self-Correction on Pre-Registration)*: If the copies care about *their own* accuracy, they might disagree. If they care about the *team's* accuracy, they agree. The prompt asks "which rule would they pick". I should specify that this depends on their objective function, which is actually part of the disagreement. I will frame it as: "If the goal is X, they pick Y."

  *(Self-Correction on Relay)*: The prompt asks if the principles have a verdict. SSA needs a reference class. If the reference class is "stages of this life", SSA applies. If it's "all humans", it might not. I will specify the reference class in the setup to ensure verdicts exist.

