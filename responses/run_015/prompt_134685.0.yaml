prompt: |-
  hey, i need this for work. i'm the voting-integrity officer for a transboundary river-basin authority that runs binding referendums on dam removals and flow allocations. we adopted the principle that anyone who bears a non-substitutable risk from the outcome belongs to the demos for that vote. in practice it's chaos: seasonal workers, tribal nations with seperate governments, trustees for future generations, and feedback loops where who votes actually changes who gets hurt. i need a reusable decision procedre my staff can run in about 20 minutes per proposal, with ordered questions, what evidence is enough at each step, hard stops ('exclude'), soft stops ('i have to sign off personally because this is a values call'), and explicit flags for self-reference loops -- like if being affected depends on who is already in the demos. apply it to three cases: a migrant farmworker on a 6-month lease, a tribal council with treaty rights and its own elections, and a trustee representing unborn residents. include one where the answer comes out wrong by our lights. also say straight up what the procedure cant settle and where it will misfire. my staff arent philosophers, so keep it grounded and dont ask for reading lists or citations -- i dont have access to that stuff.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Voting-Integrity Officer for a transboundary river-basin authority.
      *   **Task:** Create a reusable decision procedure (checklist/flowchart style) to determine voter eligibility (the "demos") for binding referendums on dam removals and flow allocations.
      *   **Core Principle:** "All-affected principle" variant: Anyone bearing a *non-substitutable risk* from the outcome belongs to the demos.
      *   **Problem:** Current implementation is chaotic (seasonal workers, tribal nations, future generations, feedback loops).
      *   **Requirements:**
          *   Run time: ~20 minutes per proposal.
          *   Structure: Ordered questions, evidence standards, hard stops (exclude), soft stops (escalate to Officer), flags for self-reference loops.
          *   Application: Test on three cases (Migrant Farmworker, Tribal Council, Trustee for Unborn).
          *   Constraint: Include one case where the procedure yields a "wrong" answer (by the user's lights).
          *   Limitations: Explicitly state what the procedure *can't* settle and where it will misfire.
          *   Tone/Style: Grounded, practical, no philosophy jargon/citations, actionable for staff.

  2.  **Deconstruct the Core Principle ("Non-Substitutable Risk"):**
      *   *Risk:* Probability of harm/loss.
      *   *Non-Substitutable:* Can't be easily compensated or avoided by moving/changing jobs. It's tied to their specific existence or position.
      *   *Operationalizing this:* Staff need concrete indicators, not abstract theory.

  3.  **Drafting the Procedure (The "Demos Determination Protocol" - DDP):**
      *   *Goal:* Speed and consistency.
      *   *Structure:* Step-by-step filtering.
      *   *Time Limit:* 20 minutes means max 5-7 steps.
      *   *Stops:*
          *   *Hard Stop:* Automatic exclusion (e.g., no tangible risk).
          *   *Soft Stop:* Escalation (e.g., value judgments, complex legal overlaps).
          *   *Loop Flag:* When eligibility depends on the outcome of the eligibility count.

      *   *Step 1: Proximity & Exposure.* (Are they physically/legally in the zone?)
      *   *Step 2: Substitutability.* (Can they leave/swap without major loss?)
      *   *Step 3: Causality.* (Does *this* vote cause the risk?)
      *   *Step 4: The Loop Check.* (Does voting change the risk profile?)
      *   *Step 5: Final Classification.* (In, Out, or Escalate).

  4.  **Developing the Evidence Standards:**
      *   Need to avoid requiring impossible proof.
      *   Use "Preponderance of available administrative data" rather than "Scientific certainty."
      *   Accept sworn affidavits for things data can't show (like intent to stay).

  5.  **Applying to the Three Cases:**

      *   *Case 1: Migrant Farmworker (6-month lease).*
          *   Risk: Water flow affects crops -> affects job -> affects livelihood.
          *   Substitutable? Maybe. If they can move to next harvest easily, maybe not non-substitutable. But if this is their *only* income source for the season and housing is tied to it, it's high risk.
          *   *Decision:* Likely "In" based on immediate livelihood dependency, but high turnover makes it messy. Let's make the procedure exclude them based on "duration of risk < voting cycle" to create the "wrong answer" case later, or include them and note the instability. *Correction:* The prompt asks for one case where the answer comes out *wrong*. I should design the procedure to be slightly rigid, so it excludes someone who *should* be included, or vice versa. Let's aim for the Farmworker being excluded by the rigid time-threshold, which feels morally wrong given their vulnerability.

      *   *Case 2: Tribal Council (Treaty Rights).*
          *   Risk: Treaty rights are legal non-substitutable interests.
          *   Complexity: They have their own sovereignty. Voting here might undermine sovereignty.
          *   *Decision:* Soft Stop. This is a values/legal conflict. Needs Officer sign-off.

      *   *Case 3: Trustee for Unborn Residents.*
          *   Risk: Long-term environmental damage.
          *   Substitutable? No, they can't move.
          *   *Decision:* Hard conceptual problem. Procedure should flag this as a "Soft Stop" because defining "non-substitutable risk" for non-existent people is a values call, not a data call.

  6.  **Refining the "Wrong Answer" Constraint:**
      *   I need to explicitly state in the analysis of one case: "The procedure says X, but you (the Officer) would likely say Y."
      *   *Choice:* The Migrant Farmworker. A rigid "6-month minimum residency" rule (to ensure stability) would exclude the 6-month worker exactly at the boundary. Or a "permanent harm" rule excludes them because their harm is economic/temporary. Let's go with *Temporary Economic Harm vs. Permanent Physical Risk*. If the procedure prioritizes physical permanence, the worker gets excluded. That feels "wrong" given the principle of bearing risk.

  7.  **Identifying Limitations (Where it Misfires):**
      *   Can't solve the "Boundary Problem" (who decides the demos decides the demos).
      *   Can't quantify "non-substitutable."
      *   Can't handle sovereignty conflicts (Tribal).
      *   Can't truly represent the future.

  8.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Bureaucratic but clear. No "Rawls" or "Habermas." Just "Step 1," "Evidence," "Action."
      *   *Formatting:* Bold headers, bullet points, clear boxes for Stops.
      *   *Self-Correction on Time:* Ensure the steps don't require external research that takes days. It must rely on *submitted* evidence.

  9.  **Final Review against Constraints:**
      *   20 mins? Yes, if evidence is pre-loaded.
      *   Ordered questions? Yes.
      *   Evidence standards? Yes.
      *   Hard/Soft stops? Yes.
      *   Loop flags? Yes.
      *   3 Cases? Yes.
      *   One "Wrong" outcome? Yes (Farmworker).
      *   Limitations section? Yes.
      *   No citations? Yes.

  10. **Final Polish:** Check the "Loop" definition. A self-reference loop is: "You only get hurt if you vote, but you only vote if you get hurt." Or "The risk level changes depending on how many people vote." I need to make sure the procedure flags when the *definition* of the risk depends on the *composition* of the voters. (e.g., if water allocation is per capita, adding voters reduces individual allocation, changing the risk).

      *Wait, let's refine the Loop Flag.* The prompt mentions: "feedback loops where who votes actually changes who gets hurt."
      *Example:* If the vote determines water *per household*, adding more households reduces water for everyone, potentially pushing some *new* people into the "at risk" category who weren't before.
      *Procedure Fix:* Add a specific check: "Does expanding the electorate alter the risk threshold for existing members?"

      *Let's build the document.*

      *(Self-Correction during drafting)*: Make sure the "Wrong Answer" is explicit. I will mark the Farmworker case as the one where the procedure excludes them, but the ethical intuition says they should be in.

      *(Refining the Tribal Case)*: This is a sovereignty issue. The procedure should escalate this. It's a "Soft Stop."

      *(Refining the Future Gen Case)*: This is a representation issue. Procedure should escalate. "Soft Stop."

      *(Refining the Limitations)*: Be honest. This tool manages chaos, it doesn't solve philosophy.

      *(Final check on tone)*: Keep it dry, operational, like a SOP (Standard Operating Procedure).

      *Let's write it.*
answer: |-
  **STANDARD OPERATING PROCEDURE: DEMOS DETERMINATION PROTOCOL (DDP-04)**
  **Authority:** Transboundary River-Basin Authority (TRBA)
  **Role:** Voting Integrity Staff
  **Time Limit:** 20 Minutes per Proposal
  **Purpose:** To determine voter eligibility based on the "Non-Substitutable Risk" principle.

  ---

  ### PART 1: THE DECISION PROCEDURE

  **Instructions:** Complete steps 1–5 in order. Do not skip steps. If a **HARD STOP** is triggered, mark application **REJECTED**. If a **SOFT STOP** is triggered, mark application **ESCALATE TO OFFICER**. If all steps pass, mark **APPROVED**.

  #### STEP 1: Causality & Exposure Check
  **Question:** Is there a direct administrative link between *this specific referendum* and a physical or legal change to the applicant's environment, livelihood, or rights?
  *   **Evidence Required:** Map overlay of project zone vs. applicant residence/operation; or legal citation of treaty/contract affected by flow allocation.
  *   **Threshold:** Preponderance of available administrative data (no new scientific studies required).
  *   **HARD STOP:** If the link is speculative (e.g., "general economic mood") or indirect (e.g., "my cousin lives downstream"). **-> EXCLUDE.**
  *   **LOOP FLAG:** If the risk level depends on the *total number* of voters (e.g., water is divided per capita). If checked, proceed to Step 5 immediately.

  #### STEP 2: Substitutability Test
  **Question:** Can the applicant avoid the risk by moving, changing jobs, or altering behavior without severe loss (defined as >30% income loss or loss of primary housing)?
  *   **Evidence Required:** Property deeds, employment contracts, lease agreements, or sworn affidavit of intent to remain.
  *   **Threshold:** "Reasonable Alternative" standard. If a comparable job/home exists within 50 miles, risk is substitutable.
  *   **HARD STOP:** If the applicant has a viable alternative and chooses to stay despite known risk. **-> EXCLUDE.**
  *   **SOFT STOP:** If the "loss" is cultural, spiritual, or ancestral rather than financial. **-> ESCALATE.**

  #### STEP 3: Duration & Permanence Filter
  **Question:** Will the risk persist for at least 12 months post-implementation?
  *   **Evidence Required:** Project timeline vs. applicant residency/operation timeline.
  *   **Threshold:** 12-month minimum duration.
  *   **HARD STOP:** If the applicant's exposure is temporary (e.g., seasonal work <12 months) even if severe. **-> EXCLUDE.**
  *   **Note:** This is a stability control to prevent electorate churn.

  #### STEP 4: Sovereignty & Jurisdiction Check
  **Question:** Does the applicant belong to a distinct political entity (e.g., Tribal Nation, Foreign Municipality) with its own voting mechanisms for this issue?
  *   **Evidence Required:** Government ID, Treaty text, or Memorandum of Understanding.
  *   **SOFT STOP:** If yes. Integrating them into *this* demos may violate sovereignty or create dual-voting conflicts. **-> ESCALATE.**

  #### STEP 5: The Self-Reference Check (Loop Closure)
  **Question:** Does including this applicant change the risk profile for *other* eligible voters enough to disqualify them?
  *   **Logic:** If adding this voter dilutes resources (e.g., water shares) such that a current voter no longer meets the "Non-Substitutable Risk" threshold.
  *   **Action:** If YES, this is a **SYSTEMIC LOOP**.
  *   **SOFT STOP:** **-> ESCALATE.** Do not process individually. Requires batch review.

  ---

  ### PART 2: CASE APPLICATIONS

  Here is how DDP-04 applies to your three test cases.

  #### CASE A: The Migrant Farmworker
  *   **Profile:** 6-month lease on farm housing. Employed seasonally. Dam removal changes irrigation flow, threatening crop yield and immediate job loss.
  *   **Step 1 (Causality):** **PASS.** Direct link between water flow and crop/job.
  *   **Step 2 (Substitutability):** **PASS.** No comparable harvest work within 50 miles during this season. Loss is >30% income.
  *   **Step 3 (Duration):** **FAIL (HARD STOP).** Lease and employment are 6 months. Procedure requires 12-month risk duration.
  *   **Step 4 (Sovereignty):** N/A.
  *   **Step 5 (Loop):** N/A.
  *   **DDP-04 Outcome:** **EXCLUDE.**
  *   **Officer Note (The "Wrong" Answer):** By the lights of our core principle, this is likely **WRONG**. The worker bears severe, non-substitutable risk *while they are here*. Excluding them because the risk doesn't last a year privileges permanence over intensity of harm. The procedure sacrifices the most vulnerable for administrative stability.

  #### Case B: The Tribal Council
  *   **Profile:** Sovereign nation with treaty rights to fishery flows. They hold internal elections on water issues.
  *   **Step 1 (Causality):** **PASS.** Treaty rights are legally binding and affected by flow.
  *   **Step 2 (Substitutability):** **SOFT STOP.** Risk is cultural/legal, not purely financial. Cannot "move" a treaty right.
  *   **Step 3 (Duration):** **PASS.** Treaty rights are perpetual.
  *   **Step 4 (Sovereignty):** **SOFT STOP.** They have their own government and elections. Adding them to TRBA referendum risks double-voting or sovereignty infringement.
  *   **DDP-04 Outcome:** **ESCALATE TO OFFICER.**
  *   **Officer Note:** This is correct. The procedure correctly identifies this as a political/legal negotiation, not a clerical eligibility check. You must decide if they vote as a block, as individuals, or via parallel ratification.

  #### Case C: The Trustee for Unborn Residents
  *   **Profile:** Court-appointed trustee representing interests of residents 50 years hence. Long-term sediment buildup risk.
  *   **Step 1 (Causality):** **PASS.** Scientific models show long-term impact.
  *   **Step 2 (Substitutability):** **SOFT STOP.** Future people cannot move. But "loss" is hypothetical.
  *   **Step 3 (Duration):** **PASS.** Permanent risk.
  *   **Step 4 (Sovereignty):** N/A.
  *   **Step 5 (Loop):** **SOFT STOP.** Including future interests changes the cost-benefit analysis for current voters, potentially altering *their* risk profile (e.g., stricter regulations now hurt current economy).
  *   **DDP-04 Outcome:** **ESCALATE TO OFFICER.**
  *   **Officer Note:** This is correct. The procedure cannot validate a "voice" for non-existent people. This is a values call on intergenerational equity, not a data check.

  ---

  ### PART 3: LIMITATIONS & MISFIRE ZONES

  **What This Procedure Cannot Settle:**
  1.  **Intensity vs. Duration:** As seen in Case A, the procedure trades off *how bad* the harm is against *how long* it lasts. It will systematically exclude seasonal, gig, or migrant populations who face acute crisis but lack long-term tenure.
  2.  **Sovereignty Conflicts:** Step 4 flags Tribal Nations but does not solve the conflict. It kicks the can to you. It cannot determine if a Treaty supersedes a Referendum.
  3.  **The "Boundary Problem":** The procedure assumes *staff* can define the demos. But who defines the staff's authority? If a group claims the procedure itself harms them (by excluding them), the procedure has no mechanism to adjudicate that complaint without circular logic.
  4.  **Aggregated Risk:** The procedure looks at individual applicants. It may miss groups where no *single* person meets the threshold, but the *community* collectively faces non-substitutable risk (e.g., a neighborhood where each house is safe, but the school closes if 10 families leave).

  **Where It Will Misfire:**
  *   **Gentrification/Displacement:** If a vote improves the river, property values rise. Long-term low-income residents face "non-substitutable risk" of displacement *caused by the success of the vote*. Step 1 usually misses this (it looks for direct environmental harm, not market side-effects).
  *   **The "Loop" Blindspot:** Step 5 catches resource dilution. It does not catch *political* dilution. If adding a new voting block guarantees a policy passes that harms a minority block, the procedure counts them as "In," even if their vote is rendered mathematically powerless.
  *   **Evidence Burden:** "Preponderance of administrative data" favors those with paperwork (deeds, contracts). It disadvantages informal settlers, undocumented workers, or oral-tradition land users, even if their risk is real.

  **Officer Directive:**
  Use DDP-04 to clear the easy 80%. When you hit a **SOFT STOP** or the **Case A (Seasonal)** profile, do not hide behind the checklist. That is where your actual job begins. The procedure manages the bureaucracy; it does not deliver justice.
