          *   *Task:* Identify where the practice is philosophically underdetermined (multiple theories lead to the same ban).

      *   **Prompt 4: Transactional vs. Relational/Clientelist Models.**
          *   *Core Question:* Do these laws assume an arm's-length transactional model?
