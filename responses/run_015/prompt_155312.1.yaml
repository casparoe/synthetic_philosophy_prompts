      *Refining Assumption (iii):* If defeasibility is cognitively impossible.

      *Refining the "Protective Feature":* Is it defeasibility or the "institutional sedimentation"? Actually, "institutional sedimentation" does the heavy lifting of making it objective rather than subjective. But "defeasibility" protects it from empirical counter-examples. The prompt asks what does the *protective* work. Defeasibility protects against falsification. Sedimentation protects against reductionism. I will argue defeasibility is the shield against empirical refutation.

      *Refining "Risky Predictions":* The view predicts that changing institutions changes character faster than changing demographics. It also predicts that diasporas retaining institutions retain character, while those adopting new institutions lose it, regardless of genetics.

      *Refining "Insulation":* It is a vice if it renders the concept operationally useless. It is a virtue if it prevents harmful reification. I should lean towards the risk of it being a "just-so story."

  10. **Final Review against Constraints:**
      *   British English? Yes.
      *   Address all three assumptions? Yes.
      *   Distinguish decisive/anomalies? Yes.
      *   Internal concessions? Yes.
      *   Risky predictions? Yes.
