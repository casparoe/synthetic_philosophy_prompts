answer: |-
  The single upshot is that the split between mind-independent realists and conceptual relativists does the heavy lifting, but your "sturdiness" requirement collapses into standard functionalism rather than carving out a new region.

  **Decision Tree for the Special Composition Question**

  1.  **Case: Your nose and the Eiffel Tower.** Is there a mind-independent fact about whether these compose something, or does it depend on our concepts?
      *   **Depends on concepts** → **Leaf 1: Conceptual Relativism** (Unnamed; awkward commitment: reality splits differently for different linguistic communities).
      *   **Mind-independent** → Go to 2.

  2.  **Case: Your nose and the Eiffel Tower.** Do they actually compose a further thing?
      *   **No** → **Leaf 2: Nihilism** (Mereological Nihilism; awkward commitment: you and the tower are just simples arranged person-wise and tower-wise).
      *   **Yes** → Go to 3.

  3.  **Case: A cloud.** Do *all* collections of particles (like those in this cloud) compose something?
      *   **Yes** → **Leaf 3: Universalism** (Mereological Universalism; awkward commitment: there is an object composed of your nose and the Eiffel Tower).
      *   **No** → Go to 4.

  4.  **Case: A slime-mold.** Is there a sharp boundary where the slime-mold ends and the environment begins?
      *   **No (Vague)** → **Leaf 4: Vague Composition** (Ontic Vagueness; awkward commitment: reality itself contains indeterminate facts).
      *   **Yes (Sharp)** → Go to 5.

  5.  **Case: A symphony performance.** Does the performance have causal powers over and above the musicians playing individually?
      *   **No** → **Leaf 5: Brutal Restrictivism** (Unnamed; awkward commitment: composition happens sometimes but there is no explanation why).
      *   **Yes** → Go to 6.

  6.  **Case: A program running on servers.** Must the parts be spatially connected to compose the program?
      *   **Yes** → **Leaf 6: Contact/Fastening** (Standard Restrictivism; awkward commitment: the program ceases to exist if a packet travels too far).
      *   **No** → Go to 7.

  7.  **Case: Conjoined twins / Brain organoid.** Must the composite be alive or conscious to exist?
      *   **Yes** → **Leaf 7: Organicism/Mentalism** (Organicism; awkward commitment: artifacts like watches never truly exist as objects).
      *   **No** → Go to 8.

  8.  **Case: A watch taken apart.** If you move one screw a millimeter, does the watch cease to exist?
      *   **Yes (Fragile)** → **Leaf 8: Functionalism** (Standard Functionalism; awkward commitment: existence depends on precise functional thresholds).
      *   **No (Sturdy)** → **Leaf 9: "Sturdy" Restrictivism** (Your View; awkward commitment: requires a non-functional account of modal robustness).

  ***

  **Notes on Leaves, Empty Regions, and Unseparable Pairs**

  *   **Leaf 9 (Your "Sturdiness" View):** This sits in a region usually occupied by **Leaf 8 (Functionalism)**. If you demand composition survives tiny perturbations (Yes Q8) but deny it requires life (No Q7) or contact (No Q6), you are effectively describing a robust functional unity. Unless you can explain what makes a composite "sturdy" without appealing to its function or structure, this view is Functionalism in disguise.
  *   **Empty Region (Leaf 5):** **Brutal Restrictivism** is largely unoccupied because it is unattractive. If you admit composition happens (No Q2) but isn't universal (No Q3) and isn't driven by causal powers (No Q5), you are claiming there is a brute fact about why some arbitrary sums exist and others don't. This is coherent but philosophically costly.
  *   **Unseparable Pair (Leaf 7 vs. Leaf 8):** **Organicism** and **Functionalism** are hard to separate using the **Brain Organoid** case. If the organoid has spontaneous activity, is it "alive" (Organicism) or just "functioning" (Functionalism)? Unless you have a case of a non-living thing with high causal integration (like a corporation) that intuition pumps differently than a living thing with low integration, these views predict the same verdicts on most test cases.
  *   **Unseparable Pair (Leaf 2 vs. Leaf 5):** **Nihilism** and **Brutal Restrictivism** are inseparable if the brute fact in Leaf 5 is "composition never occurs." They feel different in spirit (one denies the relation, one says it's brute), but no case of xs will ever distinguish them if the Brutalist says "none of these xs compose."
  *   **Empty Region (Vague Contact):** There is no leaf for "Vague Contact." Combining Leaf 4 (Vagueness) with Leaf 6 (Contact) is rare because Contact views usually rely on sharp physical boundaries (touching vs. not touching). A view claiming it is *ontically vague* whether two particles are touching is generally considered incoherent or unmotivated.
