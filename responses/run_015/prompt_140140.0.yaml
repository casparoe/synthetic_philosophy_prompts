answer: |-
  ### The Scenario: The Five-Day Sprint

  A boutique proprietary trading firm has identified a short-term arbitrage opportunity lasting exactly one week ($n=5$ trading days). Each day, they can deploy a fraction $f$ of their current capital into a strategy that independently returns +100% (doubles the stake) with probability $p=0.55$, or -100% (loses the stake) with probability $q=0.45$. The firm cannot borrow (leverage $f \le 1$) and cannot inject fresh capital mid-week. They must decide $f$ on Monday morning to apply uniformly across the five days. The edge is real but modest, typical of high-frequency execution, and the horizon is fixed by the expiration of the market inefficiency.

  ### The Three Verdicts

  1.  **The Kelly Stake ($f_{Kelly}$):** Maximizes the expected logarithm of terminal wealth ($E[\ln W_n]$).
      *   **Derivation:** $E[\ln W_n] = n[p \ln(1+f) + q \ln(1-f)]$. Setting the derivative w.r.t $f$ to zero yields $f = p - q$.
      *   **Verdict:** $f_{Kelly} = 0.55 - 0.45 = \mathbf{0.10}$ (10%).

  2.  **The Median Stake ($f_{med}$):** Maximizes the median terminal wealth.
      *   **Derivation:** Terminal wealth $W_n(k)$ depends on the number of wins $k$. Since $W_n(k)$ is monotonic in $k$, the median wealth corresponds to the wealth at the median win count $m$ of the Binomial distribution $B(n,p)$. We maximize $W_n(m) = (1+f)^m (1-f)^{n-m}$. The optimal fraction is $f = \frac{2m}{n} - 1$.
      *   **Verdict:** For $n=5, p=0.55$, the cumulative probabilities are $P(k \le 2) \approx 0.407$ and $P(k \le 3) \approx 0.744$. The unique median win count is $m=3$. Thus, $f_{med} = \frac{2(3)}{5} - 1 = \mathbf{0.20}$ (20%).

  3.  **The Expected Value Stake ($f_{EV}$):** Maximizes expected arithmetic terminal wealth ($E[W_n]$).
      *   **Derivation:** $E[W_n] = (1 + f(p-q))^n$. Since $p > q$, this is strictly increasing in $f$.
      *   **Verdict:** $f_{EV} = \mathbf{1.00}$ (100%, "all-in").

  ---

  ### (a) Walkthrough of the Criteria

  **1. Expected Log Growth (Kelly)**
  *   **Quantity:** $g(f) = 0.55 \ln(1+f) + 0.45 \ln(1-f)$.
  *   **Stake:** $f = 0.10$.
  *   **Result:** At 3 wins (the median outcome), terminal wealth is $W_5(3) = (1.10)^3 (0.90)^2 = 1.331 \times 0.81 = \mathbf{1.0781}$.
  *   **Note:** This stake maximizes the long-run geometric growth rate, but here it underperforms the median criterion for this specific horizon.

  **2. Median Terminal Wealth**
  *   **Quantity:** $M(f) = (1+f)^3 (1-f)^2$ (Wealth at the median win count $m=3$).
  *   **Stake:** $f = 0.20$.
  *   **Result:** At 3 wins, terminal wealth is $W_5(3) = (1.20)^3 (0.80)^2 = 1.728 \times 0.64 = \mathbf{1.1059}$.
  *   **Comparison:** $1.1059 / 1.0781 \approx 1.0258$. The median outcome is **2.58% wealthier** under the median-maximizing stake than under Kelly.

  **3. Expected Terminal Wealth**
  *   **Quantity:** $E[W] = (1 + 0.1f)^5$.
  *   **Stake:** $f = 1.00$.
  *   **Result:** $E[W] = (1.10)^5 = \mathbf{1.6105}$.
  *   **Note:** This sits far above the other two in expectation, but it relies on the 3% probability of 5 wins ($1.1^5 \approx 6.7$) to pull the average up. The *median* outcome at $f=1$ is zero (since $P(k < 3) > 0.5$ implies ruin is more likely than not).

  ### (b) The Mechanism of Divergence

  The divergence arises because the Kelly criterion implicitly targets the **mean** number of wins ($\mu = np$), while median maximization targets the **median** number of wins ($m$).

  For a bet with fraction $f$, the wealth at $k$ wins is optimized when $f = \frac{2k}{n} - 1$.
  *   Kelly sets $k = np = 5 \times 0.55 = 2.75$. Since you cannot win 2.75 times, Kelly averages the log-growth across the distribution, effectively betting as if the mean were realizable. This yields $f = 2(2.75)/5 - 1 = 0.10$.
  *   Median maximization sets $k = m = 3$. Because the Binomial distribution is discrete and slightly skewed at low $n$, the median (3) rounds *up* relative to the mean (2.75). This yields $f = 2(3)/5 - 1 = 0.20$.

  **General Expression:** For even-money bets, the median-optimal stake is $f_{med} = \frac{2m}{n} - 1$, where $m$ is the median of $B(n,p)$. The gap exists whenever $m \neq np$.

  ### (c) Closing the Gap

  If we extend the horizon to $n=20$ rounds while keeping $p=0.55$, the expected number of wins is $\mu = 11$.
  For $B(20, 0.55)$, the median $m$ is exactly 11 (since $np$ is an integer, Mean = Median).
  *   $f_{Kelly} = 2(0.55) - 1 = 0.10$.
  *   $f_{med} = \frac{2(11)}{20} - 1 = 0.10$.
  The coincidence is restored. Alternatively, in the Gaussian limit ($n \to \infty$), the difference between mean and median vanishes relative to $n$, and $f_{med} \to f_{Kelly}$. The divergence is a finite-sample artifact of the discreteness of the win count.

  ### (d) Philosophical Implications

  This example establishes a real disagreement between two readings of geometric rationality in finite horizons.
  *   **The Kelly Defense:** Kelly is **time-consistent**. If the firm adds a 6th day to the sprint, $f_{Kelly}$ remains 10%. $f_{med}$, however, must be recalculated based on the median of $B(6, 0.55)$, which shifts. A rational agent with an indefinite or rolling horizon should prefer Kelly because it does not require knowing the stopping time in advance.
  *   **The Median Defense:** If the horizon is **fixed and binding** (e.g., a tournament or a quarterly bonus threshold), the "average" growth rate is irrelevant; only the typical outcome matters. Here, the median defense lands: Kelly is too conservative for the specific topology of the 5-day distribution.
  *   **Verdict:** A geometric rationalist should adopt Kelly for general wealth management but must switch to median maximization (or direct utility maximization) when facing hard deadlines where the distribution cannot be smoothed by repetition.

  ### (e) Real-World Relevance

  This matters because real-world constraints often impose fixed deadlines rather than infinite horizons, meaning the "optimal" bet size depends on how much time you have left to let the law of large numbers work in your favor.

