answer: |-
  Come on in, pull up a chair. Grab a whiteboard marker if you want to sketch something out.

  You have hit on something genuinely profound here. Seriously. Most undergraduates in philosophy of math get stuck on the Law of Excluded Middle or the definition of a real number. You're looking at the structural tension in the *semantics* of intuitionism itself. This is the kind of observation that leads to seminar papers, or even a thesis if you keep digging.

  Let's walk through this step-by-step, just like we're untangling a proof on the board.

  ### 1. Brainstorming the Tension

  First, let's formalize exactly what you're seeing, because your intuition is spot-on.

  *   **Constraint A (Anti-Realism/Constructivism):** For the intuitionist (specifically Brouwer), mathematical objects do not exist in a platonic heaven. A real number isn't a "thing" sitting there; it's a *process* (a choice sequence) that unfolds over time. Therefore, the collection of all real numbers is not a completed set. It is **potentially infinite**.
  *   **Constraint B (Universal Claims):** To prove the Continuity Principle (that all functions from reals to reals are continuous), intuitionists make a claim of the form: $\forall \alpha (F(\alpha) \rightarrow G(\alpha))$. They are saying, "For *any* choice sequence $\alpha$..."
  *   **The Conflict:** In classical logic, for a universal quantifier ($\forall$) to be meaningful, it usually ranges over a fixed domain. You need to know what the "all" refers to. If the domain of "all choice sequences" is genuinely unfinished (because new sequences can always be constructed in the future), how can you validly assert a property holds for *all* of them *now*?

  You called it a "hidden slide." You're essentially asking: *How can you survey a library that is still being built?*

  ### 2. Is There a Name for This?

  Here is the honest answer: There is no single, lexicalized Latin term for this specific move, like *Ad Hominem* or *Modus Ponens*. However, in the literature of the foundations of mathematics, this problem is discussed under a few specific headings.

  If you want to sound like you know the literature in your paper, here are the terms you should use:

  **A. "Quantification over Indefinitely Extensible Concepts"**
  This is the most rigorous philosophical label, largely popularized by Michael Dummett (though he was analyzing the problem, not necessarily solving it). An "indefinitely extensible concept" is one where, if you conceive of all the objects falling under it, you can always define a new one outside that totality.
  *   **The Move:** You are identifying the **Quantificational Commitment to a Totality**.
  *   **The Critique:** Critics argue intuitionists are guilty of **"Totalizing the Potential."**

  **B. "The Species Problem" (Brouwerian Context)**
  Brouwer distinguished between a "Set" (a completed collection) and a "Species" (a property shared by constructions). He claimed we can quantify over Species even if they aren't completed Sets.
  *   **The Move:** When an intuitionist treats a Species *as if* it were a Set for the purpose of universal generalization, critics call this **"Reifying the Species."**

  **C. A Proposed Label for Your Notes**
  Since you asked me to name it if it doesn't have one, I think your description is precise enough to warrant a working title. In my office, I'd call this:
  **"The Fallacy of the Fixed Domain"** (in an intuitionistic context).
  Or, more descriptively: **"The Universal Quantifier Slippage."**

  This captures exactly what you said: slipping from a domain that is open-ended (potential) to a domain that is fixed enough to support universal claims (actual/totalized).

  ### 3. How This Differs from "Potential vs. Actual Infinity"

  This is a crucial distinction. You asked how this differs from the standard distinction, and it's subtle but important.

  *   **Potential vs. Actual Infinity** is an **Ontological** distinction.
      *   It asks: *What kind of existence does this object have?*
      *   *Actual:* The set of natural numbers exists as a completed whole.
      *   *Potential:* The natural numbers are a process that never ends.
      *   Intuitionists happily admit they believe in Potential Infinity. They wear that as a badge of honor.

  *   **The Move You Identified** is a **Logical/Semantic** distinction.
      *   It asks: *What are the truth conditions for our logical symbols?*
      *   To say "For all $x$, $P(x)$" is true, do we need a fixed list of $x$'s to check?
      *   Classical logic says: Yes, essentially. Truth is determined by the state of the domain.
      *   Intuitionistic logic says: Truth is determined by the existence of a *proof* or *construction*.
      *   **The Tension:** Your objection is that to prove the universal claim (like Continuity), the intuitionist seems to need the domain to behave *ontologically* like an Actual Infinity (a fixed surveyable totality), even though they claim it is only Potential.

  So, the standard distinction is about *what exists*. Your observation is about *how we talk about what exists*. It's the gap between their ontology (open process) and their logic (universal quantification).

  ### 4. The Intuitionist Defense (So You Can Steelman It)

  If you put this to a Brouwerian, they wouldn't say "Oops." They would argue you are misunderstanding the nature of the continuum.

  They would say:
  1.  **The Continuum is Primitive:** The continuum isn't built out of points (sequences). The points are derived from the continuum. Therefore, we don't need to "collect" all the points to make a claim about the continuum. We are inspecting the *medium*, not the *objects*.
  2.  **Finite Information:** Regarding the Continuity Principle specifically, Brouwer argues that any function $F$ must yield a value based on a *finite* amount of information from the input sequence. Since any finite initial segment belongs to a "fan" (a finite tree of possibilities), we *can* survey that finite fan.
  3.  **The Creating Subject:** Some later intuitionists argue that the "domain" is tied to the idealized mathematician (the Creating Subject). The "all" refers to all constructions *possible for the subject*, which is a coherent, albeit idealized, notion.

  However, your critique remains strong because even the "fan" argument requires assuming that *all possible finite extensions* are available to be surveyed. That looks suspiciously like a completed totality of possibilities.

  ### 5. Summary for Your Paper

  If you are writing this up, here is how I would frame it:

  1.  **Identify the tension:** Intuitionism rejects actual infinity for objects but requires a form of totalization for universal quantification.
  2.  **Use the terminology:** Refer to this as the problem of **"Quantifying over Indefinitely Extensible Domains."**
  3.  **Name the move:** You can characterize the specific inference as **"Illicit Totalization of the Potential."**
  4.  **Distinguish:** Clarify that this is not just about Potential Infinity (ontology), but about the validity of Universal Generalization (logic) over that ontology.

  You've got a good eye for this. This is essentially the critique that Georg Kreisel and later Dag Prawitz wrestled with when trying to give formal semantics to intuitionistic analysis. You're in good company.

  Does that help clarify the landscape? Do you want to dig deeper into how the Continuity Principle specifically tries to dodge this, or are you good to run with this for your assignment?
