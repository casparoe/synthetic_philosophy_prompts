answer: |-
  **What the label is for**

  We are not a court. We cannot convict. But we cannot wait for a verdict that may take a decade or never come. The word "genocide" is a factual descriptor of intent and action, not a moral superlative for "very bad war." Its purpose in our copy is to convey the specific nature of the violence to the reader, not to trigger international intervention (though we know it may have that effect).

  We must choose between Lemkin's broader sociological concept (destroying a group's institutions, language, land) and the 1948 UN Convention legal definition (intent to destroy a protected group via five specific acts). I choose the **1948 Convention**. Why? Defensibility. Lemkin's definition is too fluid for a corrections column. The Convention is fixed, internationally recognized, and covers non-killing acts (children, births, conditions of life). It is narrow, but it is a fence we can stand behind.

  This choice carries cost. It excludes political groups. It requires proving intent, not just body count. It means some mass atrocities will not be called genocide. That is the price of accuracy. We acknowledge the word's weight: it enrages governments, comforts survivors, and implies a duty to prevent. We do not decide policy, but we must not dilute the currency. If we use it loosely, it loses its power when needed. If we withhold it strictly, we risk complicity in silence. The procedure below prioritizes evidence over emotion. It is designed to be run by a journalist with limited resources, yielding a result you can defend six months later when the heat has risen.

  **The procedure**

  Run these steps in order. If you hit a **STOP**, do not proceed.

  1.  **Identify the Group.** Is the targeted group national, ethnical, racial, or religious?
      *   *Yes:* Proceed.
      *   *No (e.g., political opponents, class-based):* **STOP NO.** Label as *Crimes Against Humanity* or *Mass Atrocity*. The 1948 Convention excludes political groups.
      *   *Hand to Human:* If the group is mixed (e.g., religious AND political insurgents). Decide which identity is the primary target of the violence.

  2.  **Identify the Acts.** Is there evidence of one of the five Convention acts? (1) Killing members; (2) Causing serious bodily/mental harm; (3) Deliberately inflicting conditions of life calculated to bring about physical destruction; (4) Imposing measures intended to prevent births; (5) Forcibly transferring children.
      *   *Yes:* Proceed.
      *   *No:* **STOP NO.** Label as *Repression*, *Persecution*, or *War Crimes* (if during conflict).
      *   *Note:* "Conditions of life" includes starvation, blocking medicine, or systematic destruction of shelter.

  3.  **The Surrender Test (Intent Proxy).** Would the violence stop if the victims surrendered, ceased resistance, or complied with demands?
      *   *No (Violence continues regardless):* Proceed. This suggests the target is the *group*, not their behavior.
      *   *Yes (Violence stops upon compliance):* **STOP NO.** Label as *Counter-insurgency*, *Conquest*, or *War Crimes*. This indicates the target is the *threat*, not the *group*.
      *   *Hand to Human:* If compliance is impossible (e.g., "stop existing"). Treat as "No."

  4.  **The "In Part" Threshold.** Is the targeted segment "substantial"? Use this rule of thumb: Is the targeted population **>5% of the total group** OR does it include **leadership/community pillars** (elders, teachers, religious leaders) whose removal cripples the group's survival?
      *   *Yes:* Proceed.
      *   *No:* **STOP NO.** Label as *Massacre* or *Ethnic Cleansing* (if displacement is the goal). Isolated killings, however horrific, are not genocide without scale or strategic targeting.
      *   *Hand to Human:* If the number is small but the symbolic value is极高 (e.g., wiping out the last speakers of a language).

  5.  **Evidence Default.** Do we have a "smoking gun" (direct order/document proving intent)?
      *   *Yes:* Use label *Genocide* as fact (e.g., "The genocide committed by...").
      *   *No (Pattern is clear, document is missing):* **ATTRIBUTE.** Use label only with attribution (e.g., "UN experts accuse X of genocide," "Evidence suggests genocide").
      *   *No (Pattern is unclear):* **STOP NO.** Use *Mass Atrocity*.
      *   *Rule:* Under uncertainty, infer intent from pattern (common in law), but attribute the *label* to protect the newspaper. Do not presume innocence where pattern is overwhelming; do not presume guilt where pattern is ambiguous.

  **Labels Menu:**
  *   **Genocide:** All steps passed.
  *   **Crimes Against Humanity:** Step 1 failed (political group) or Step 3 failed (systematic attack on civilians, but not group destruction).
  *   **Ethnic Cleansing:** Goal is removal/displacement, not necessarily destruction (often overlaps with Genocide, but distinct).
  *   **War Crimes:** Violations of laws of war (targeting civilians) during conflict, without specific intent to destroy group.
  *   **Mass Atrocity:** Catch-all when evidence is thin but death toll is high.
  *   **Massacre:** Single event, limited scope.

  **Three cases**

  **Case 1 (Famine/Insurgency):**
  *   *Group:* Ethnic minority (Pass).
  *   *Acts:* Conditions of life (destroying irrigation/clinics) causing death (Pass).
  *   *Surrender Test:* Leaked docs call them a "demographic problem." If they surrender, does the famine stop? The docs suggest reduction is the goal, not just security. (Pass).
  *   *Threshold:* Tens of thousands dead in a specific region. Likely >5% or vital segment (Pass).
  *   *Evidence:* Leaked memoirs + budget doc. Not a direct order, but strong pattern.
  *   *Verdict:* **Genocide (Attributed).** "Leaked documents and UN reports indicate the government is committing genocide..." The insurgency cover makes direct proof hard, but the Surrender Test tips it. The "demographic problem" language signals intent beyond counter-insurgency.

  **Case 2 (Cultural Destruction/No Killing):**
  *   *Group:* Highland people (Pass).
  *   *Acts:* Forcibly transferring children, preventing births (cultural), destroying institutions (Pass - Convention Art II c, d, e).
  *   *Surrender Test:* N/A. No violence to surrender to. Compliance is impossible without ceasing to exist (Pass).
  *   *Threshold:* Two generations, distinct people "essentially finished." Substantial part (Pass).
  *   *Evidence:* State programme is open policy.
  *   *Verdict:* **Genocide (Fact).** This fits the 1948 Convention precisely, despite no killing. The intent to destroy the group *as such* is explicit in the policy. Do not let the lack of bodies fool you. This is the hard case for readers, but the easy case for law.

  **Case 3 (War/High Deaths):**
  *   *Group:* Ethnic group (Pass).
  *   *Acts:* Killing (Pass).
  *   *Surrender Test:* Government bombing to retake rebel-held province. If rebels surrender, does bombing stop? Yes. Target is control, not the group *as such* (Fail).
  *   *Threshold:* 60,000 dead (Pass).
  *   *Evidence:* No plan regarding the group, only regarding territory.
  *   *Verdict:* **War Crimes / Crimes Against Humanity (Not Genocide).** This is the unwelcome result. The death toll is higher than Case 1, but the intent is territorial control, not group destruction. The ethnicity is correlated because the rebels are from that ethnicity, not because the state wants to erase the ethnicity.
  *   *Handling:* Print "War Crimes" or "Mass Atrocity." Do not use "Genocide." If you use "Genocide" here, you break the procedure. You will be accused of minimization. Stand firm. The distinction is intent, not body count.

  **Where it misfires**

  This procedure will fail you emotionally, specifically on Case 3. Readers see 60,000 dead civilians of one ethnicity and will scream "Genocide." You will say "War Crimes." They will hear "Less Bad." You must explain in editor's notes that "Genocide" requires intent to destroy the group, not just kill them during war. If you conflate them, you lose the ability to name actual genocides later.

  Second, the "Political Group" exclusion (Step 1) is the biggest hole. If a regime kills 100,000 communists or democrats, this procedure forbids "Genocide." You must use "Crimes Against Humanity." This feels like a loophole for dictators. It is. It's the 1948 Convention's flaw, not yours. Acknowledge it, but don't break your own rule to fix it.

  Third, the Evidence Default (Step 5) risks cowardice. Attributing the label ("Experts say genocide") can look like we don't believe it. But declaring it as fact without a smoking gun invites a libel suit or a corrections column retraction if a court later disagrees. Attribution is the shield. It allows you to report the reality without betting the newspaper's reputation on a legal verdict you cannot render.

  Finally, the Surrender Test is imperfect. Some regimes demand impossible surrender (e.g., "convert or die"). The procedure handles this via the "Hand to Human" clause, but deputies may struggle. If compliance requires self-annihilation, treat it as a "No."

  **The calls I made**

  I have committed you to the **1948 Legal Definition** over Lemkin's broader view. This narrows the field but protects you from accusations of semantic drift. You will miss some sociological destructions, but you will hold the line on legal defensibility.

  I have kept your **Surrender Test** as the core intent proxy. It is the most practical tool a journalist has to distinguish counter-insurgency from extermination. Do not abandon it.

  I have set the **Evidence Default** to "Infer intent, Attribute label." This is the compromise. We do not require a signed order from the President to see reality, but we do not declare a legal verdict without one. We report the accusation as factually grounded but legally contested.

  I have accepted the **Case 3 Outcome**. You will hate printing "War Crimes" for 60,000 dead. Do it anyway. If you call that genocide, you devalue the word for Case 2, where the group is actually being erased without a shot fired. Accuracy over comfort. If readers complain, refer them to the procedure. If the procedure breaks, we fix the procedure, not the copy.
