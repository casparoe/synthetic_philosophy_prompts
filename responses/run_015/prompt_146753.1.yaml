      *Self-Correction on Section 3:* Ensure the reasoning ties back to the procedure steps.
      *Self-Correction on Section 5:* Ensure it sounds like a recommendation to the editor, not a summary of the essay.

      *Refining the "In Part" rule:* I need a concrete heuristic. "Is the targeted segment vital to the group's survival or >10% of population?" Let's go with "Vital Segment or >5%."
      *Refining the Evidence Default:* "Pattern implies intent, but label requires attribution." This is the safe journalistic middle ground.

      *Refining Case 2:* This is the trickiest legally. 1948 Convention includes "forcibly transferring children" and "preventing births." It fits. I need to make sure the procedure allows this without killing.
      *Refining Case 3:* This must come out as "Not Genocide." This is the "unwelcome" result. I need to explain *why* clearly (Intent vs Outcome).

