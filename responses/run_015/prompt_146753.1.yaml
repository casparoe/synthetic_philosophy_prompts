          *   Must be defensible later (corrections column).
          *   Must handle specific complexities: Lemkin vs. Legal Definition, "in part" threshold, thin evidence/default stance.
          *   Must acknowledge political/social weight of the word without letting it drive the decision.
          *   Must test against three specific composite cases.
          *   Must commit to specific thresholds/defaults (no "it depends").
          *   Specific structure and word counts (approximate):
              1.  "What the label is for" (~250 words)
              2.  "The procedure" (~900 words, numbered, stop points marked)
              3.  "Three cases" (~700 words)
              4.  "Where it misfires" (~300 words)
              5.  "The calls I made" (~250 words)
          *   Total target: ~2400 words.
      *   **Tone:** Professional, decisive, editorial, pragmatic, honest about trade-offs.

  2.  **Deconstruct the Core Problems:**
      *   *Current Style:* "Wait for UN/Court" (Rejected by user as useless).
      *   *User's Heuristic:* "Surrender Test" (Would it stop if they surrendered?).
      *   *Legal vs. Lemkin:* Legal (1948 Convention) focuses on intent to destroy group *as such* via 5 acts. Lemkin broader (culture, institutions). User needs a choice.
      *   *Threshold:* "Substantial part" is vague. Need a rule of thumb.
      *   *Evidence:* Thin/one-sided. Need a default stance (presume, withhold, split).
      *   *Attribution:* How to print contested labels.
      *   *Labels:* Genocide, Crimes Against Humanity, Ethnic Cleansing, War Crimes, Mass Atrocity, Massacre.

  3.  **Drafting - Section by Section:**

      *   **Section 1: What the label is for (~250 words)**
          *   Goal: Define the journalistic purpose. It's not a legal verdict; it's a description of reality based on evidence. It triggers moral weight but must remain factual.
          *   Decision: We are applying the *legal* definition (1948 Convention) because it's the only stable standard, even if Lemkin's was broader. Why? Defensibility.
          *   Acknowledge weight: It matters to survivors, it matters politically. But accuracy matters more than comfort.

      *   **Section 2: The Procedure (~900 words)**
          *   Need a step-by-step flowchart style.
          *   *Step 1: Protected Group.* Is it national, ethnical, racial, religious? (Political groups excluded legally).
          *   *Step 2: The Acts.* Killing, causing harm, conditions of life, preventing births, transferring children.
          *   *Step 3: Intent (The Hard Part).* Use the "Surrender Test" but refine it. It's about *targeting the group*, not the combatants.
          *   *Step 4: "In Part".* Need a number/structure. Let's say: Is the targeted segment significant enough that its destruction impacts the whole? Or a numerical threshold (e.g., >5% of population or leadership decimated). Let's go with "Significant Segment" rule: Leadership + Critical Mass.
          *   *Step 5: Evidence Default.* If pattern is clear but intent doc missing? Infer intent from pattern (common in law), but attribute. Default: Withhold "genocide" as fact, use attribution ("accused of"), unless pattern is overwhelming. Actually, user wants a commitment. Let's say: If acts + pattern align, infer intent but attribute the *label* to experts unless we have direct proof.
          *   *Labels:* Define the menu.
          *   *Attribution Rule:* "X accuses Y of genocide" vs "Y commits genocide".
          *   *Stop points:* Yes (Use word), No (Use alternative), Human (Editorial judgment on values).

      *   **Section 3: Three Cases (~700 words)**
          *   Run the procedure on the composites.
          *   *Case 1 (Famine/Insurgency):* Acts yes (conditions of life). Intent? "Demographic problem" helps. Surrender test? If they stop resisting, does famine stop? Maybe not if goal is reduction. Verdict: Strong case for Genocide, but attribution needed due to insurgency cover.
          *   *Case 2 (Cultural Destruction/No Killing):* Acts yes (transferring children, preventing births culturally). Intent yes (assimilation). Legal definition covers this (Article II c, d, e). Verdict: Genocide (cultural/physical mix). This challenges the "killing" notion.
          *   *Case 3 (War/High Deaths):* Acts yes (killing). Intent? No. Targeting ground/control, not group *as such*. Surrender test? If rebels surrender, bombing stops. Verdict: War Crimes/Crimes Against Humanity, NOT Genocide. This is the "unwelcome" result.

      *   **Section 4: Where it misfires (~300 words)**
          *   Acknowledge flaws.
          *   Legal definition is too narrow (politics excluded).
          *   Intent is hard to prove without smoking gun.
          *   Readers hate Case 3 result (high death toll but not genocide).
          *   Risk of "atrocity inflation."

      *   **Section 5: The calls I made (~250 words)**
          *   Summarize the hard choices.
          *   Chose Legal over Lemkin (defensibility).
          *   Chose Attribution over Declaration (safety).
          *   Chose Pattern over Direct Proof for intent (pragmatism).
          *   Accepted Case 3 outcome (accuracy over emotion).

  4.  **Refining and Editing (Self-Correction during drafting):**
      *   *Word Count Check:* Need to be careful not to drift. The "Procedure" section needs to be dense but readable.
      *   *Tone Check:* Must sound like an editor talking to an editor. Direct, imperative.
      *   *The "Surrender Test":* User asked to keep or replace. I will keep it but refine it as the "Intent Proxy." It's actually quite good for distinguishing counter-insurgency from genocide.
      *   *The "In Part" Rule:* Need to be specific. "Substantial" usually means numerically significant OR strategically significant (leadership). I'll codify that.
      *   *The Evidence Default:* User asked to pick one. I will pick "Infer intent from pattern, but attribute the label." This balances factual rigor with journalistic caution.
      *   *Case 3:* User expects an unwelcome answer. I must deliver "Not Genocide" and explain why without wavering.
      *   *Formatting:* Use bolding for stop points. Ensure sections are clearly marked.

  5.  **Drafting - Section 1 (What the label is for):**
      *   Focus: Accuracy vs. Impact.
      *   Commitment: We use the 1948 UN Convention definition. Not Lemkin's broader sociological view. Why? Because "law" provides the fence posts, even if the field is bigger. It prevents the word from becoming synonymous with "very bad war."
      *   Weight: Acknowledge it triggers R2P (Responsibility to Protect) expectations. We are not triggering policy, we are describing facts. But we know the effect.

  6.  **Drafting - Section 2 (The Procedure):**
      *   Step 1: Group Identity. (National, ethnic, racial, religious). If political -> Stop No (use Crimes Against Humanity).
      *   Step 2: The Acts. (Killing, harm, conditions, births, children). If none -> Stop No.
      *   Step 3: The Surrender Test (Intent). If violence stops upon surrender/compliance -> Stop No (War Crime/Repression). If continues -> Proceed.
      *   Step 4: Substantiality. (Numerical >5% OR Leadership/Community Pillars). If isolated incident -> Stop No.
      *   Step 5: Evidence Default. (Pattern vs. Proof). If pattern clear but doc missing -> Attribute label. If doc clear -> Use label.
      *   Labels Menu: Genocide, Crimes Against Humanity, Ethnic Cleansing (not legal term but useful), War Crimes, Mass Atrocity.
      *   Attribution Rule: "UN/NGO accuses..." vs "The genocide..."

  7.  **Drafting - Section 3 (Three Cases):**
      *   Case 1: Genocide (attributed). Acts: Conditions of life. Intent: "Demographic problem". Surrender: Unclear (famine continues?). Substantial: Region-wide.
      *   Case 2: Genocide (direct). Acts: Children/Births/Culture. Intent: Assimilation. Surrender: N/A (non-violent). This fits 1948 Convention Art II (c, d, e).
      *   Case 3: War Crimes/CAH (Not Genocide). Acts: Killing. Intent: Territorial control. Surrender: Yes (if rebels stop, bombing stops). Group targeted because they are the rebels, not *because* they are the group. High deaths don't equal genocide.

  8.  **Drafting - Section 4 (Where it misfires):**
      *   Case 3 is the big one. Readers see dead bodies and want "genocide." We say "war crime." It feels like minimization.
      *   Political groups excluded (e.g., Cambodian Khmer Rouge often debated).
      *   Intent is mental state; we are judging minds from afar.

  9.  **Drafting - Section 5 (The calls I made):**
      *   Reiterate the hard choices.
      *   Legal definition over Lemkin.
      *   Attribution over assertion.
      *   Intent over Body Count.
      *   Warning: You will be criticized for Case 3. Stand firm.

  10. **Review against Constraints:**
