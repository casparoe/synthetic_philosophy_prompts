      *   No essayizing? Keep it imperative.
      *   Commit to thresholds? Yes.
      *   Handle the 3 specific complexities? Yes (Lemkin vs Legal, In Part, Evidence).
      *   Handle the 3 cases? Yes.
      *   Section order? Yes.

