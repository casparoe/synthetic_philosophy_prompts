answer: |-
  I concede that if we bloat the outcome description to include "having cycled for evidence," this specific sequence isn't a pump by my definition, since she ends up net ahead. But this doesn't empty the criterion, because the test applies to the preferences over the core outcomes A, B, and C, not the bundled transaction. The defect is in the willingness to trade A for B, B for C, and C for A *absent* the side-benefit. You are treating the evidence as part of the outcome ranking, but it is really an external subsidy attached to the process of exploiting the ranking.

  So I do not say it is irrational to acquire the evidence; I say it is irrational to hold the cyclic preferences that make you pay to move between these states. The agent is in a bind where the only route to a vital good requires traversing a defective preference structure. The defect remains in the structure because if the evidence were removed, the loss would persist. The money-pump argument identifies the vulnerability in the engine, not the net profit of a specific journey that happens to include a prize.

  Bottom line: A preference structure is defective if it allows exploitation in isolation, even if external rewards sometimes compensate for the losses in practice.
