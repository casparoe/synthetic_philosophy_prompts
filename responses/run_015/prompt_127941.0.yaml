  ### Restatement of Neurath's Program in Experimental Vocabulary

  Otto Neurath's central thesis, when reconstructed through the lens of condensed-matter experimentalism, posits that scientific communication must function like a rigorously calibrated measurement protocol. His rejection of statements that resist pictorial representation is equivalent to the laboratory injunction against recording data outside the dynamic range of an instrument. Just as a voltmeter cannot register a potential difference without a defined scale and zero-point, Neurath argues that a proposition lacks cognitive content if it cannot be mapped onto a spatio-temporal coordinate system. In your terms, a "metaphysical statement" is akin to a raw instrument trace lacking a calibration curve; it possesses structure but no assigned physical magnitude, rendering it unusable for the "Unity of Science" dataset.

  Neurath's insistence that visual syntax must mirror structural relations translates directly to the requirement that graphical representations maintain topological isomorphism with the physical system under study. When you plot a phase diagram, the boundaries on the paper must correspond structurally to the phase boundaries in the material, without the interference of grammatical particles that imply agency or essence. The ISOTYPE principle of standardized pictograms finds its counterpart in the International System of Units (SI) and standard crystallographic notation. These standards function to suppress the "noise" of verbal description, ensuring that a symbol for "current" or "spin" carries the same operational definition across different research groups, much like a standardized resistor symbol in a circuit diagram eliminates ambiguity about component behavior.

  Regarding your extension of "representational latency"—the encoding of temporal sequence and causal directionality within a static medium—this is a legitimate development of Neurath's view, provided it adheres to strict operational constraints. Neurath sought to eliminate narrative tense, not temporal ordering. In experimental visualization, time is routinely encoded as a spatial coordinate (e.g., the x-axis in an oscilloscope trace) or as a parameter in a sequence of panels (e.g., time-resolved diffraction patterns). This does not import verbal tense; it treats time as a dimension analogous to length. However, encoding *causal* directionality is more precarious. In the laboratory, we represent causal hypotheses using vector fields or flow lines (e.g., Poynting vectors or reaction pathways). These are permissible in a Neurathian framework only if the arrow is defined as a gradient of a measurable quantity (like potential) rather than a metaphysical "push." If the arrow represents a theoretical inference rather than a measured flux, it risks reintroducing the hidden theoretical commitments Neurath sought to excise. Therefore, your extension holds if "causality" is reduced to "time-ordered correlation of observables," but distorts if it implies unobservable mechanistic powers.

  ### Residue Report

  In translating Neurath's philosophy into the vocabulary of experimental physics, several elements map with high fidelity, while others reveal friction between philosophical idealism and laboratory pragmatism.

  The cleanest translations involve **standardization** and **structural mirroring**. The laboratory's reliance on SI units and plotting conventions matches Neurath's demand for a unified, ambiguity-free language. Similarly, the requirement that a graph's topology match the phenomenon's structure is standard practice in data visualization.

  Distortions arise primarily around the concepts of **ambiguity** and **causality**. Neurath viewed ambiguity as a linguistic flaw to be purged by pictures. In the lab, however, ambiguity is often quantified as uncertainty (error bars). We do not eliminate it; we measure it. Thus, translating "ambiguity suppression" to "uncertainty quantification" is a functional equivalent but a philosophical distortion. Furthermore, while temporal sequence translates cleanly to coordinate axes, causal directionality is a theoretical overlay. A vector arrow on a plot is a model-dependent interpretation, not a raw observable. Neurath would likely classify a causal arrow as a theoretical construct that requires careful bracketing to avoid becoming "metaphysical."

  Finally, some elements are **absent**. Neurath's program was deeply sociological, aimed at educating the public and democratizing knowledge (the "Visual Education" movement). The laboratory vocabulary is optimized for peer-to-peer expert communication, not public pedagogy. This absence reflects a limitation in the laboratory vocabulary, which often obscures methods from non-specialists, rather than a lack of precision in Neurath's claim. Additionally, Neurath's strict physicalism sometimes struggles with theoretical entities (like wavefunctions) that are indispensable in modern physics but resist direct pictorialization. Here, the limitation lies in the philosophical claim's rigidity against the success of abstract modeling.

