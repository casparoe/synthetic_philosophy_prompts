answer: |-
  It is good to meet a colleague who knows the difference between the water in the river and the numbers on the page. You have identified the exact point where the philosophy of science stops being a seminar topic and starts being a budgetary risk. You are asking for a way to manage epistemic risk without pretending it doesn't exist.

  Below is the decision procedure you asked for. I have kept the philosophy implicit in the structure rather than explicit in the text, because your lay trustees do not need to know *why* the questions work, only that they do.

  Per your request, the **Decision Procedure** section is written in American English for your shared wiki. The commentary surrounding it is in your preferred dialect.

  ***

  ### The Catchment Evidence Decision Procedure

  **Purpose:** To evaluate proposals where data supports a causal story but does not uniquely prove it.
  **Users:** Evidence Panel and Trustees.
  **Output:** A funding recommendation and a specific rationale regarding evidence strength.

  **Step 1: The Falsifiability Check (The "Chameleon" Test)**
  *Question:* Is there a specific result in this project that would prove the group's story wrong?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP.** Reject the causal claim.
      *   *Rationale:* If the story explains success, failure, and stagnation equally well, it is not a scientific claim. It is a belief. Do not fund evidence collection for a claim that cannot be contradicted by evidence.
      *   *Exception:* You may fund the work as "community engagement" or "monitoring only," but you must explicitly state you are not funding the causal explanation.

  **Step 2: The Rival Check (The "Underdetermination" Test)**
  *Question:* Can the panel list at least two other plausible stories that fit the existing data just as well as the applicant's story?
  *   **No (Only one story fits):** Proceed to Step 3.
  *   **Yes (Multiple stories fit):** Proceed to Step 3, but flag "High Epistemic Risk."
      *   *Note on Contrived Rivals:* A rival story is only "plausible" if it does not require assuming new, unverified facts to make the data fit. If a rival needs extra assumptions (epicycles) that cannot be checked independently, discard it.
      *   *Note on Unconceived Alternatives:* If the panel cannot think of rivals, ask: "What single fact, if discovered tomorrow, would kill this story?" If no such fact exists, return to Step 1 (Fail). If such a fact exists, proceed.

  **Step 3: The Discrimination Check (The "Data" Test)**
  *Question:* Does the proposed work distinguish between the applicant's story and the plausible rivals listed in Step 2?
  *   **Yes:** Proceed to Step 4.
  *   **No:** **STOP.** Reject the proposal as "Evidence Insufficient."
      *   *Rationale:* Collecting more data that fits all stories equally well is a waste of funds. The proposal must target the specific difference between the rivals.
      *   *Action:* Tell the applicant what measurement would discriminate (e.g., "You need water temperature, not just air temperature").

  **Step 4: The Action Check (The "Pragmatic" Test)**
  *Question:* If the applicant's story is wrong and one of the rivals is right, does the proposed action (fencing, planting, re-meandering) still provide value?
  *   **Yes (Action is robust):** Proceed to Step 5. You may fund the *action* even if the *explanation* is uncertain.
      *   *Constraint:* The rationale must state: "Funding is for the intervention, not the validation of the causal mechanism."
  *   **No (Action depends on the specific cause):** **STOP.** Reject unless Step 3 can be satisfied.
      *   *Rationale:* If the work only works if the specific story is true, and the story is unproven, the financial risk is too high.

  **Step 5: The Value Hand-off (The "Risk" Test)**
  *Question:* Is the remaining uncertainty acceptable given the budget and the trust's risk tolerance?
  *   **Decision:** This is not an evidence question. This is a Trustee decision.
  *   **Panel Output:** The panel presents the "High Epistemic Risk" flag from Step 2 or Step 4.
  *   **Trustee Decision:** Trustees decide if the potential benefit outweighs the risk of the story being wrong.
      *   *Rationale:* Science cannot tell you how much risk to take. It can only tell you what the risk is.

  ***

  ### Commentary on the Procedure

  Here is how this addresses your six hard cases, and what I have left out.

  **1. Rivals that fit by construction (Epicycles)**
  Handled in **Step 2**. The instruction to discard rivals that require "new, unverified facts" is the filter. A contrived rival usually says, "The data looks like X, but actually it's Y because of hidden factor Z." If Z cannot be measured independently of the theory, it is contrived.
  *What you lose:* You lose the ability to be generous to creative but unproven hypotheses. This procedure favours conservative, boring science. That is appropriate for public funds.

  **2. Same action, different mechanism**
  Handled in **Step 4**. If the action works regardless of the mechanism (e.g., fencing stops run-off whether the run-off is from cows or bad drainage), the underdetermination is pragmatically irrelevant. You fund the action, not the theory.
  *Is this right?* Yes. For a catchment trust, outcomes usually matter more than ontological truth. If the trout return, it matters less whether it was because of phosphate reduction or temperature reduction, provided the intervention caused the return.

  **3. Chameleon claims**
  Handled in **Step 1**. This is the strictest filter. If a group claims success regardless of the data trend, they are not doing science. They are doing advocacy. The procedure forces a hard "No" on the causal claim. You can still fund them as "volunteers," but you must not validate their logic in writing.

  **4. Alternatives nobody has thought of**
  Handled in **Step 2** via the "What single fact would kill this?" question. This is a proxy for "severity of testing." If a theory is robust, it sticks its neck out. If it hides behind a shield of "unknown factors," it is vulnerable to unconceived alternatives.
  *The limitation:* This relies on the panel's imagination. It is a judgment call wearing a lab coat. There is no algorithm for creativity.

  **5. "Can't tell yet" vs. "Never"**
  Handled in **Step 3** and **Step 5**. If the discrimination is impossible within the budget/timeline, it is treated as "Never" for the purpose of *this* decision. You cannot wait for perfect science. The procedure forces you to categorise the uncertainty as a risk (Step 5) rather than a temporary delay.

  **6. Effect supported, explanation unsupported**
  Handled in **Step 4**. This is the critical split. The procedure explicitly allows you to fund the *intervention* (the effect) while declining to endorse the *mechanism* (the explanation). This protects you from appeals based on "but it worked!" when the science was actually shaky.

  **What I dropped:**
  I dropped the distinction between "observation" and "theory." In hydrology, your data (e.g., phosphate ppm) is already theory-laden (calibration, sampling method). Treating them as separate creates false confidence. I treated "data" as "agreed-upon measurements."
  I also dropped the concept of "Truth." The procedure deals in "Risk of Error." You are not deciding what is true; you are deciding how much money you are willing to lose if the story is false.

  ***

  ### Test Runs

  Here is the procedure applied to your three proposals.

  **Proposal 1: Phosphate, Trout, and the Farm**
  *   **Step 1 (Falsifiability):** Can they prove the farm is *not* the cause? Probably. If phosphate drops but trout don't recover, or if phosphate is high elsewhere but trout are fine. **Pass.**
  *   **Step 2 (Rivals):** You listed four: counting effort, natural cycle, other pollution sources, no real decline. These are plausible and do not require epicycles. **Flag: High Epistemic Risk.**
  *   **Step 3 (Discrimination):** Does the proposed fence-and-buffer distinguish between "farm run-off" and "volunteers got better at counting"? No. The proposal assumes the cause to fix the cause. It does not test the cause. **FAIL.**
  *   **Decision:** Reject the causal claim.
  *   **Alternative:** Offer funding *only* for a redesigned monitoring plan that includes a control tributary or a blind count audit. Do not fund the fences yet.
  *   **Rationale:** "The data correlates phosphate and trout, but does not distinguish farm run-off from other variables such as counting effort or natural cycles. The proposed intervention assumes the cause rather than testing it."

  **Proposal 2: Re-meander and Invertebrates (BACI)**
  *   **Step 1 (Falsifiability):** Yes. If diversity drops in the restored stretch or rises in the control, the story fails. **Pass.**
  *   **Step 2 (Rivals):** Plausible rivals? Natural recovery over time (handled by control), regional weather event (handled by control), sampling error. The BACI design kills most rivals. **Low Epistemic Risk.**
  *   **Step 3 (Discrimination):** The design distinguishes restoration from background noise. **Pass.**
  *   **Step 4 (Action):** If the mechanism is wrong (e.g., it wasn't the meander, it was the sediment shift), does the diversity increase still justify the spend? Yes. The goal is diversity, not proving meandering physics. **Pass.**
  *   **Step 5 (Risk):** Low risk.
  *   **Decision:** Fund.
  *   **Cheapest Measurement to Knock Out Rivals:** You asked for the single cheapest measurement to handle remaining rivals (e.g., upstream drift). A single upstream drift sampler during high flow events. If invertebrates are washing down from upstream rather than breeding in the reach, the diversity count is misleading.
  *   **Rationale:** "The BACI design effectively isolates the intervention from background variation. While the specific hydraulic mechanism remains unproven, the outcome (diversity increase) is robustly measured. Funding is for the ecological outcome."
  *   *Note:* This validates your instinct but forces you to write the rationale around the *outcome*, not the *hydraulics*.

  **Proposal 3: Shade, Salmon, and Missing Data**
  *   **Step 1 (Falsifiability):** Yes. If water temp doesn't drop, the story fails. **Pass.**
  *   **Step 2 (Rivals):** The physics is not in doubt (shade cools water). The rival is not "does shade cool water?" but "is *this* the right place for shade?" Rival: "The cold water refuges are elsewhere; planting here does nothing for salmon survival." **Flag: Medium Epistemic Risk.**
  *   **Step 3 (Discrimination):** The proposal is to plant trees. Planting trees does not distinguish between "this is a refuge" and "this is not a refuge." It assumes the location is correct. **FAIL.**
  *   **Step 4 (Action):** If the location is wrong, is the money wasted? Yes. Trees take years to grow. If they shade the wrong stretch, the salmon still die. The action is not robust to the uncertainty. **FAIL.**
  *   **Decision:** Reject the full planting proposal.
  *   **Counter-Offer:** Fund a one-year temperature logging survey to identify the refuges *first*.
  *   **Rationale:** "While the cooling effect of shade is physically established, the location of critical thermal refuges in this catchment is unknown. Planting without this data carries a high risk of misallocating resources. Funding is available for a monitoring pilot to identify target stretches prior to restoration."
  *   *Comment:* This contradicts your instinct to fund based on general physics. The procedure saves you from the "wrong place, right physics" trap.

  ***

  ### Limitations and The "Leap"

  You asked me to be honest about where the procedure cannot help.

  **1. The Irreducible Gap**
  There will be cases where Step 3 says "No" (we can't distinguish the rivals cheaply) and Step 4 says "No" (the action only works if the theory is true), but you *still* have to spend the money. Perhaps the river is dying and this is the only idea on the table.
  The procedure will tell you to Reject. You may overrule it.
  If you do, you must write in the rationale: "Panel recommends rejection due to evidence gaps, but Trustees approve based on precautionary principle/urgency."
  Do not hide this. If you blur the line between "evidence says yes" and "values say yes," you invite appeals that attack your science when they should be attacking your values.

  **2. The Judgment Call**
  Step 2 (Plausible Rivals) relies on the panel's competence. If your panel is tired or homogenous, you will miss rivals. This is not a flaw in the procedure; it is a flaw in humans. The only mitigation is to ensure your "lay trustees" are encouraged to ask naive questions during Step 2. Naivety is a good proxy for unconceived alternatives.

  **3. Truth vs. Utility**
  This procedure is instrumentalist. It treats theories as tools. If you have a panel member who is a scientific realist (believes we must find the *true* cause), they will hate Step 4. They will argue we shouldn't fund fences if we don't *know* cows are the problem.
  You need to agree as a panel beforehand: Are we buying truth, or are we buying river health? If you are buying river health, Step 4 is valid. If you are buying truth, Step 4 is a sin. Given your context (Catchment Trust), I assume the former.

  **4. American English Note**
  I have ensured the Procedure section uses US spelling (program, model, color) for your wiki. I have retained British spelling in this commentary to respect your own correspondence.

  You have thirty years of knowing that the number isn't the river. This procedure is just a way to make sure your trustees don't confuse the two when you aren't in the room.
