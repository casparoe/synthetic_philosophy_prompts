answer: |-
  There is no single, lexicalized word for this specific phenomenon in English, though it is a well-recognized problem in art historiography, epistemology, and increasingly in data science. Your friend's suggestion of the "hermeneutic circle" is indeed too broad, because it describes the necessary condition of *all* understanding (you need to know the parts to understand the whole, and the whole to understand the parts), whereas your scenario describes a *corruption* of that circle by deception.

  The most precise conceptual label for what you are describing is **Exemplar Contamination** (within a Nominalist framework), or sometimes **Reflexive Canonization**.

  Here is the carving you asked for. It distinguishes this phenomenon from simple error, explains why it persists, and applies the logic to your test cases.

  ### 1. The Carving: Evidence vs. Exemplars

  To understand why "contaminated evidence" doesn't fit, you have to distinguish between two ways we use objects to find truth:

  *   **Indicative Evidence:** The object points to a truth *outside* itself. (e.g., A fingerprint points to who was in the room.) If the fingerprint is faked, the conclusion is wrong, but the definition of "fingerprint" remains unchanged.
  *   **Constitutive Exemplars:** The object *is* the definition of the truth. (e.g., The "Meter Bar" in Paris *was* the meter.) If you swap the bar for a slightly shorter one, you haven't just made a measurement error; you have changed what a meter *is*.

  Art history operates primarily on **Exemplars**, not Evidence. When scholars define "Rembrandt's Style," they are not measuring the paintings against a pre-existing Platonic ideal of Rembrandt. They are aggregating the paintings to *create* the ideal.

  **The Carve:**
  *   **Contaminated Evidence:** A fake painting is treated as a data point that leads to a false conclusion about the artist's biography or timeline. (Fix: Remove the data point.)
  *   **Exemplar Contamination:** A fake painting is treated as a definition of the artist's style. (Fix: Impossible without redefining the style.)

  In your scenario, the forgery stops being a *lie about the past* and starts being a *truth about the present canon*. It becomes part of the "training data" for the eyes of curators, collectors, and even the artist's successors. This is why you cannot simply "delete" it. Deleting it leaves a hole in the definition of the style that the forgery was hired to fill.

  ### 2. The Philosophical Machinery: Nominalism

  This phenomenon relies on a **Nominalist** view of art styles (championed by Nelson Goodman in *Languages of Art*).
  *   **Realism:** "Rembrandt's Style" exists independently of the paintings. A forgery fails to match it.
  *   **Nominalism:** "Rembrandt's Style" is just a name we give to the cluster of paintings we agree are by Rembrandt.

  If you are a Nominalist (which most modern art historians effectively are), then a forgery that enters the cluster *actually changes the style*. It doesn't just mimic the style; it iterates it. This is why later forgers might copy the earlier forgery: they are copying the current definition of the style, which now includes the earlier fake.

  ### 3. Applying the Carve to Your Test Cases

  Here is how **Exemplar Contamination** settles your specific scenarios:

  **Case 1: The Nineteenth-Century Restoration (Overpainting)**
  *   **Verdict:** **Different Phenomenon (Palimpsest, not Insertion).**
  *   **Why:** This is not adding a new exemplar to the corpus; it is modifying an existing one. The "ruler" hasn't been swapped; it has been stretched. The philosophical problem here is *Integrity*, not *Canon Formation*. The viewer is loving a hybrid object, but the hybrid object still occupies the same slot in the timeline. It doesn't create a new "gap-filling" narrative in the same way a new discovery does. It's a corruption of the *source*, not the *sample set*.

  **Case 2: Studio and Workshop Pictures**
  *   **Verdict:** **Out (Distributed Authorship).**
  *   **Why:** These are not "alien" insertions. In the 17th century, the "Master's Style" *was* the output of the workshop. The brand was the shop, not the individual hand. Including these does not contaminate the exemplar set because the historical definition of the artist's output *includes* supervised workshop production. They are genuine examples of the *practice*, even if deceptive about the *hand*. They belong to the "style" because the style was an industrial process.

  **Case 3: The Exposed Forgery that Stays in the Canon**
  *   **Verdict:** **In (Relabeling does not neutralize).**
  *   **Why:** This is the purest form of Exemplar Contamination. Even if you relabel it "Imitator," it remains in the museum, in the books, and in the visual memory of viewers. It continues to function as an exemplar of "What that period looks like." The visual data is still in the training set of the viewer's eye. The label changes the *provenance*, but it does not scrub the *aesthetic influence*. The ruler remains partly made of the fake stuff.

  **Case 4: AI Image Generators Training on AI Output**
  *   **Verdict:** **In (Exact Structural Parallel).**
  *   **Why:** In machine learning, this is called **Model Collapse** or **Autophagy**. When generative models train on data produced by previous generative models, the variance decreases, and artifacts become entrenched as features. This is the digital twin of your art history problem. The "style" drifts because the "exemplars" used to train the next generation include the hallucinations of the previous generation. It is the same feedback loop: the output becomes the input, and the error becomes the standard.

  ### 4. The Pleasure Question

  *If our eye for the real thing was partly trained on fakes, is there something wrong with the pleasure we take in the real thing?*

  **The Answer:** No, but the *object* of your pleasure has shifted.

  This touches on Nelson Goodman's central argument in *Languages of Art*. Goodman argues that knowing a work is a forgery *diminishes* its aesthetic value because art is a cognitive activity; we enjoy detecting the achievement of the artist. If the achievement is faked, the cognitive satisfaction is undermined.

  However, your question is subtler: You are asking about the pleasure taken in the *genuine* works, by an eye calibrated on *fakes*.

  *   **The Calibration Argument:** Your eye is calibrated to the "Canon," not the "Hand." If the Canon includes fakes, then your eye is correctly calibrated to the Canon. You are correctly recognizing the style *as it currently exists in history*.
  *   **The Historical Object:** The "Real Thing" is not a static physical object; it is a historical event. Your pleasure in the genuine painting is a relationship between you (the viewer) and that event. If your visual vocabulary was built partly on fakes, you are viewing the genuine painting through a lens ground by forgers.
  *   **The Resolution:** There is nothing "wrong" with the pleasure, but it is **historically situated**. You are enjoying the "Rembrandt" that the 20th century built (which includes Van Meegeren), not the "Rembrandt" that the 17th century left.

  The worry dissolves if you accept that "Style" is not a buried treasure to be found, but a conversation that is ongoing. The forgers joined the conversation uninvited, but they spoke, and people listened. The "Real" is now the sum of that conversation, not just the original speakers.

  ### Summary
  You are describing **Exemplar Contamination**.
  It differs from **Contaminated Evidence** because it changes the definition of the standard, not just the measurement against it.
  It differs from the **Hermeneutic Circle** because it relies on deceptive insertion rather than benign learning.
  It is structurally identical to **AI Model Collapse**.
  And it suggests that "Authenticity" is not a binary state of the object, but a stable equilibrium of the corpus that can be shifted by sufficiently convincing intruders.
