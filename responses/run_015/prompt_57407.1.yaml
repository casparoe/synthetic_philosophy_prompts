  The panel will rule for an indefinite loan to the successor state, managed in partnership with the descendant association.

  The panel's jurisprudence rests on two intersecting axes: the legitimacy of acquisition and the continuity of custodianship. Full restitution of title is granted only when acquisition was coercive or illegitimate (Case 1 raid, Case 3 colonial ordinance) AND a living line of traditional custodians remains to receive it (Case 1 guild, Case 3 family). Where acquisition was formally legal but custodianship is absent, retention is upheld (Case 2 permit). Where custodianship has lapsed but the claim is for memorialization rather than active ritual, the panel compromises with indefinite loan regardless of acquisition legitimacy (Case 4 consensual/lapsed).

  In this new case, the acquisition is illegitimate (seizure/burning), which precludes the outright refusal seen in Case 2. However, the guild is defunct and the trade dead, breaking the chain of living custodianship required for the full returns in Cases 1 and 3. The claim is for a memorial and state facility, aligning functionally with the cultural centre in Case 4 rather than the active shrines in Cases 1 and 3. Therefore, the panel treats the broken continuity as the limiting factor, downgrading the remedy from return to loan, while the tainted provenance prevents refusal.

  This reading is most plausible because it maintains the panel's consistent preference for restoring objects to *active* care rather than symbolic ownership; returning title where no traditional structure exists to sustain it would contradict the caution shown in Case 2 and Case 4. If the panel were to order a full return instead, it would be committing to a principle of absolute redress, asserting that illicit taking voids all custodial requirements and that moral title supersedes the capacity for traditional care.

  To separate these candidates, add a case where a ritual mask seized in 1890 is claimed by a revived religious movement intending to resume active worship, despite the original priestly line being extinct. A ruling of return would prove the panel prioritizes rectifying theft over continuity, whereas a ruling of loan would confirm that unbroken lineage is the absolute prerequisite for title transfer, regardless of the intended use.
