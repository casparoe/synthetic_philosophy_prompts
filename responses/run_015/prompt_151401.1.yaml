answer: |-
  Hey, grab a latte and listen to this scenario I'm wrestling with. So, picture Elena, the municipal health commissioner, getting a confidential report that the main water intake has a slight bacterial spike—nothing lethal immediately, but risky for immuno-compromised folks over a week. She can flip a switch to route water through the older, backup filtration unit, which handles it fine, but she'd have to issue a public alert to justify the pressure drop and maintenance noise, sparking unnecessary panic and a city council inquiry that delays the fix. Instead, she routes the water, logs it as "routine maintenance," and the water stays safe with zero health impacts, but the public never knows they were at risk or that she made the call.

  Okay, so here's how the theories slice it. The dirty-hands theorist says Elena did the right thing overall—she saved people from risk—but she's still morally stained because she violated the public trust required for democratic governance; she's guilty, but justified. The act-consequentialist says there's literally no stain since outcomes are optimal and autonomy was never actually violated, only procedural transparency was hidden, so if nobody's welfare dropped and no actual choices were thwarted, nothing wrong happened. The Kantian, though, says treating people as non-autonomous ends makes it wrong regardless of results; by hiding the risk, she denied citizens the chance to consent to the risk or the solution, using them as mere means to their own safety.

  Now, the exact feature doing the work here is whether justified agent-relative moral costs survive the action or are just emotional residue. For the dirty-hands theorist, the "stain" is a real moral remainder—a cost attached to the agent for violating a duty, even if necessary—not just feeling bad about a hard choice. If you strip that feature away—if you say there are no agent-relative costs, only agent-neutral outcomes—the case collapses into the consequentialist view; the "stain" becomes mere psychological regret with no moral weight, and Elena walks away clean. But here's the attack a dirty-hands defender would raise: you've smuggled in the assumption autonomy is purely instrumental. They'd argue that by saying autonomy wasn't violated because no harm occurred, you're treating respect for persons as just another tool for maximizing welfare, rather than a constraint that leaves a moral scar even when you rightly override it.
