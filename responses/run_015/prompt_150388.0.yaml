      *   **Audience:** 2 Philosophers (1 Bayesian, 1 Falsificationist), 1 String Theorist (defensive), 1 Experimental Physicist (skeptic), 1 Statistician (host, cares about leakage/base rates), ~10 Grad Students.
      *   **Task:** Write a Q&A prep sheet.
      *   **Format:**
          *   First sentence: Bottom line (which single objection decides survival).
          *   No preamble, no restating the question.
          *   Objections in order of arrival.
          *   Phrase objections in the asker's vocabulary.
          *   Reply: ~2 minutes delivery, note on soft spots.
          *   Include: What to concede up front, the one reply that must land, the question hoping nobody asks.

  2.  **Determine the Bottom Line:**
      *   What kills this argument? The argument hinges on treating non-empirical assessment as a *predictive model* with a track record. If the historical dataset (step 2) is fundamentally incomparable or unconstructible, the analogy fails.
      *   The Statistician is the host and the reason for the invite. They care about leakage and base rates. If the Statistician says the dataset is garbage, the room follows.
      *   *Decision:* The single objection that decides survival is whether the historical reference class is valid (reference class problem). If the past theories aren't comparable to string theory, the backtest is meaningless.

  3.  **Drafting the Q&A Sheet:**

      *   **Bottom Line:** If the Statistician convinces the room that your historical reference class is too contaminated to yield a valid base rate, the forecasting analogy collapses and you're left with just intuition.

      *   **Objection 1: The Falsificationist (Old-school)**
          *   *Vocabulary:* Falsification, demarcation, pseudoscience, empirical content.
          *   *Argument:* You're dressing up metaphysics as science. Confirmation requires risk of refutation.
