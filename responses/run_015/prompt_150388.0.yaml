answer: |-
  If the Statistician convinces the room that your historical reference class is too contaminated to yield a valid base rate, the forecasting analogy collapses and you're left with just intuition.

  ### Q&A Prep Sheet

  **1. The Falsificationist (Old-school Philosopher)**
  *   **Objection:** "You're attempting to solve a demarcation problem with a metric. If a theory lacks empirical content, no amount of heuristic polishing makes it science; you're just quantifying metaphysics."
  *   **Reply:** I'm not arguing this makes string theory 'verified science' in your sense; I'm arguing it assigns a probability weight to research allocation. Even you must choose which falsifiable theories to test first; I'm suggesting we audit the heuristic used to make that choice. If the hit rate is low, we stop funding it. That protects science from metaphysics, rather than enabling it.
  *   **Soft Spot:** You risk blurring the line between "worth pursuing" and "confirmed," which is exactly what he accuses you of.
  *   **Time:** 1:30

  **2. The String Theorist (Defensive)**
  *   **Objection:** "You're treating mathematical uniqueness as just another feature. When a theory is the *only* consistent solution to a problem, that's not a prior; that's a necessity. Your dataset of 'past theories' doesn't account for mathematical inevitability."
  *   **Reply:** I agree uniqueness should spike the credence higher than mere 'no alternatives.' But 'mathematical inevitability' is still a claim about the world, not just math. Non-Euclidean geometry was mathematically consistent long before it was physically true. My model allows you to weight uniqueness heavily, but you still have to prove that weighting pays off historically.
  *   **Soft Spot:** Dismissing the specific weight of mathematical necessity might alienate the only person in the room who actually knows the math.
  *   **Time:** 2:00

  **3. The Bayesian (Philosopher)**
  *   **Objection:** "You're reifying heuristics as data. In a Bayesian framework, non-empirical arguments simply update priors based on background knowledge. Why do we need a frequency-based backtest for what is essentially a subjective updating process?"
  *   **Reply:** Because subjective updating is where overconfidence hides. You can claim your prior shifted from 1% to 50% based on 'elegance,' but without a frequency check, that's just narrative fitting. I'm not replacing Bayesian updating; I'm calibrating the likelihood function you're using to update.
  *   **Soft Spot:** Hard Bayesians believe coherent priors are sufficient; demanding frequentist validation might seem category-confused to them.
  *   **Time:** 1:45

  **4. The Statistician (Host)**
  *   **Objection:** "Your inclusion rule is vulnerable to look-ahead bias. You're selecting historical theories based on whether we know their outcome now. How do you construct a dataset where the 'promisingness' is judged blind to the truth value?"
  *   **Reply:** That's the critical audit step. We define the cohort by citation clusters in review articles from a fixed year, then freeze the criteria. We score them based on what was known *then*, not now. If we can't do that blindly, we admit the model is exploratory, not confirmatory. I'd rather publish a noisy model than no model.
  *   **Soft Spot:** This is the kill shot. If you can't sketch a concrete inclusion rule that avoids selection bias, your whole engineering analogy fails.
  *   **Time:** 2:00

  **5. The Experimentalist (Particle Physicist)**
  *   **Objection:** "This is just rationalizing failure. You're building a complex model to justify why you haven't found anything yet. Why not just admit the signal isn't there?"
  *   **Reply:** I'm on your side. This model is designed to tell theorists when to stop. If the backtest shows a low hit rate for non-empirical criteria, the model outputs 'cut funding.' I'm giving you a metric to prove you're right, instead of just shouting about falsifiability.
  *   **Soft Spot:** Sounds too sympathetic to the theorists; make sure you emphasize the "cut funding" outcome.
  *   **Time:** 1:30

  **6. The Grad Student (Gotcha)**
  *   **Objection:** "So, is string theory science or not? Yes or no."
  *   **Reply:** It's a research program with high heuristic value but low current credence of truth. Binary labels break down here; we need a probability distribution over outcomes, not a demarcation stamp.
  *   **Soft Spot:** Sounds evasive. Be prepared to give a number if pressed (e.g., "Less than 10% chance of being the final theory").
  *   **Time:** 1:00

  ### Strategic Notes

  **Concede Up Front:**
  Concede that non-empirical arguments cannot *verify* a theory. If you claim they provide "confirmation" in the same way data does, you lose the Falsificationist and the Experimentalist immediately. Frame it strictly as "credence adjustment" or "risk assessment."

  **The One Reply That Must Land:**
  The response to the **Statistician**. Your entire talk rests on the analogy that philosophy can be backtested like a trading model. If the Statistician proves the dataset is impossible to construct without leakage, you have no talk. You must demonstrate a concrete, defensible inclusion rule (e.g., "all theories mentioned in *Reviews of Modern Physics* between 1980-1990") even if it's imperfect.

  **The Question You Hope Nobody Asks:**
  "Can you name three specific historical theories that met your 'non-empirical success' criteria at the time but turned out to be false, and explain why string theory isn't just the fourth one?"
  *Why:* You admitted no philosophy background beyond a Coursera course. If you fumble the historical examples, you lose credibility with the philosophers and the theorist instantly. If you say "ether theory" or "phlogiston," the theorists will argue those didn't meet the same mathematical rigor as string theory, trapping you in a history debate you aren't equipped to win.
