          *   *Argument:* You're undervaluing mathematical uniqueness. It's not just "no alternatives," it's "no *possible* alternatives."
          *   *Reply:* Acknowledge uniqueness is strong priors. But without empirical contact, uniqueness is still just a prior. My model accounts for that as a feature, but the base rate of "unique math theories turning out true" is still the check.
          *   *Soft spot:* Dismissing the weight of mathematical necessity.

      *   **Objection 3: The Bayesian Philosopher**
          *   *Vocabulary:* Priors, likelihood ratios, Bayesian updating, Old Evidence problem.
          *   *Argument:* Non-empirical arguments *are* empirical if they change priors based on background knowledge. You're reifying heuristics as data.
          *   *Reply:* Agree that it updates priors. My point is auditing *how much* it updates them. Your "background knowledge" needs a frequency check to avoid overconfidence.
          *   *Soft spot:* Conflating subjective Bayesianism with frequency-based auditing.

      *   **Objection 4: The Experimental Physicist**
          *   *Vocabulary:* Signal-to-noise, falsifiable predictions, waste of resources, sociological drift.
          *   *Argument:* This is just rationalizing failure. You're building a model to justify why you haven't found anything.
          *   *Reply:* Exactly. That's why we need the audit. If the hit rate is low, stop spending resources. I'm on your side, but I'm giving the theorists a metric to prove you wrong instead of just shouting.
          *   *Soft spot:* Seeming too sympathetic to the theorists.

      *   **Objection 5: The Statistician (Host)**
          *   *Vocabulary:* Reference class problem, look-ahead bias, p-hacking, selection bias.
          *   *Argument:* How do you define the dataset? Every dead theory looked promising once. You're selecting on the dependent variable.
          *   *Reply:* Admit this is the hardest part. Propose a blind inclusion rule (e.g., all theories cited in review articles from year X). Sensitivity analysis on the inclusion criteria.
          *   *Soft spot:* The reference class problem is genuinely hard to solve.

      *   **Objection 6: Grad Student (Gotcha)**
