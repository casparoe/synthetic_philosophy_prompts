answer: |-
  ### Conceptual Preamble: The Dennettian Tension

  Before deploying the procedural framework, we must articulate the specific theoretical friction this protocol addresses. Daniel Dennett's "Where Am I?" thought experiment destabilizes the naive assumption that personal identity tracks a specific lump of matter (the brain) or a specific location in space (the skull).

  In your neurosurgical context, the core tension is between **Third-Person Continuity** (anatomical integrity, functional isomorphism, biological life) and **First-Person Indexicality** (the phenomenological report of "I am here, now").

  Naive bodily criteria fail in gradual substitution protocols because:
  1.  **The Ship of Theseus Problem:** If neurons are replaced one by one with functionally identical synthetic substrates without interrupting consciousness, the *matter* changes completely, but the *experience* remains continuous. To claim identity is lost here requires a metaphysical claim (biological essentialism) that contradicts the patient's lived reality.
  2.  **The Fission Problem:** If processing is distributed across transient nodes, we risk creating a state where two distinct operational centers both claim the indexical "I." Third-person data might show two coherent streams of consciousness emerging from one original patient. The patient may feel unified, but the topology of processing suggests branching.

  This framework does not solve the metaphysics of identity. Instead, it operationalizes identity for **ethical risk assessment**. It treats identity not as a binary switch, but as a vector of continuity that, if severed or branched, triggers specific consent and liability protocols.

  ***

  ### The Neural Substitution Identity Protocol (NSIP)

  **Purpose:** To determine Ethical Continuity Status (ECS) for patients undergoing distributed neural grafting.
  **Users:** Ethics Panel Members, Clinical Leads.
  **Constraint:** Must be executable within a 48-hour review window.

  #### Stage 1: Functional Integration & Causal Dependency
  *   **Condition Tested:** **Functional Continuity.** Does the synthetic substrate maintain the causal dynamics of the original tissue without latency-induced dissociation?
  *   **Operational Test:** **The Latency/Disruption Counterfactual.** During a trial substitution of <5% tissue, introduce a controlled signal delay (e.g., 200ms) in the synthetic node. Monitor for reportable discontinuity or cognitive dissonance.
  *   **Threshold:**
      *   *Sufficient:* Patient reports no break in stream of consciousness; cognitive metrics remain within baseline variance.
      *   *Broken:* Patient reports "gaps," "skips," or "double-vision" of thought; cognitive metrics show dissociation.
  *   **Classification:** **[FACTUAL]** (Neurophysiological measurement).
  *   **Action:** If *Broken*, halt protocol (Medical Adverse Event). If *Sufficient*, proceed to Stage 2.

  #### Stage 2: Indexical Consistency Check
  *   **Condition Tested:** **First-Person Self-Location.** Does the patient's report of "I" map to a singular locus of control, even if anatomically distributed?
  *   **Operational Test:** **The Dual-Node Interrogation.** If processing is distributed across Node A and Node B, isolate input to each node separately (temporarily). Ask each node: "Where are you?" and "Who are you?"
  *   **Threshold:**
      *   *Sufficient:* Both nodes defer to a single unified report ("We are the same person," or one node remains silent/subservient).
      *   *Broken:* Both nodes assert independent, conflicting indexical claims ("I am the real one," "I am here, you are there").
  *   **Classification:** **[FACTUAL]** (Based on behavioral/verbal report).
  *   **Action:** If *Broken*, **FLAG FOR FULL BOARD DELIBERATION** (Potential Fission). Do not proceed mechanically.

  #### Stage 3: Narrative Coherence & Autobiographical Memory
  *   **Condition Tested:** **Psychological Continuity.** Is the autobiographical narrative preserved across the substitution boundary?
  *   **Operational Test:** **The Pre/Post-Operative Narrative Match.** Compare detailed autobiographical recall and value structures from T-1 (pre-op) to T+1 (post-substitution).
  *   **Threshold:**
      *   *Sufficient:* >90% concordance on core values, memories, and future planning.
      *   *Broken:* Significant divergence in values, loss of episodic memory, or inability to endorse pre-op decisions as "mine."
  *   **Classification:** **[MIXED]** (Empirical data + Interpretive Judgment).
  *   **Action:** If *Broken*, classify as "Psychological Discontinuity." Consent from pre-op patient may no longer be valid for post-op entity.

  #### Stage 4: Fission/Branching Detection
  *   **Condition Tested:** **Numerical Identity.** Has one person become two (or more) simultaneous agents?
  *   **Operational Test:** **The Simultaneous Agency Test.** Can the distributed nodes perform conflicting voluntary actions simultaneously (e.g., left hand draws a circle, right hand draws a square) without a central executive override?
  *   **Threshold:**
      *   *Sufficient:* Actions remain coordinated under a single executive will.
      *   *Broken:* Evidence of competing wills or independent volition within the same cranial/distributed system.
  *   **Classification:** **[FACTUAL]** (Motor/Intent monitoring).
  *   **Action:** If *Broken*, **HALT.** This constitutes a "Personhood Multiplication Event." Legal status of the original patient is suspended until resolved by Full Board.

  #### Stage 5: Substrate & Biological Boundary
  *   **Condition Tested:** **Organismic Continuity.** Does the entity retain sufficient biological integration to be classified as the same human organism under current law?
  *   **Operational Test:** **The Percentage Replacement & Homeostasis Check.** Calculate % of neural tissue replaced. Assess dependency on biological life support vs. external power.
  *   **Threshold:**
      *   *Sufficient:* <50% neural replacement OR synthetic tissue is fully integrated into biological homeostasis (blood flow, immune response).
      *   *Broken:* >50% replacement AND reliance on non-biological power/cooling systems (Cybernetic Dependency).
  *   **Classification:** **[VALUE JUDGMENT / POLICY]**.
  *   **Action:** If *Broken*, the procedure indicates a **Legal Identity Break**, even if Psychological Continuity (Stage 3) is intact. This requires Full Board Deliberation to determine if the entity is a "Successor" or "Continuation."

  ***

  ### Worked Applications

  #### Scenario 1: The Branching Node (Anatomical Continuity, Indexical Discontinuity)
  **Protocol State:** The patient's cortex is augmented with synthetic bridges. Anatomical continuity is 100% preserved (no tissue removed, only augmented). However, the augmentation allows hemispheres to process independent streams of consciousness that can communicate.
  **NSIP Execution:**
  *   **Stage 1 (Functional):** Pass. No latency issues.
  *   **Stage 2 (Indexical):** **FAIL.** When Node A and Node B are queried separately, both assert "I am the patient." When asked to choose a preference (e.g., meal choice), they select different options simultaneously.
  *   **Stage 4 (Fission):** **FAIL.** Competing volition detected.
  *   **Result:** The NSIP flags a **Fission Event**.
  *   **The Tension:** The patient sincerely reports, "I feel like one person making complex choices." The NSIP data indicates two agents.
  *   **Procedural Outcome:** **HALT.** Refer to Full Board.
  *   **Ethical Implication:** The Board must decide if the pre-operative consent covers *both* resulting agents, or if the original "person" has effectively died and been replaced by two new entities. The patient's rejection of the discontinuity is noted but overruled by the behavioral data regarding competing wills.

  #### Scenario 2: The Total Replacement (Psychological Continuity, Biological Break)
  **Protocol State:** Over 24 months, 100% of neural tissue is replaced with synthetic substrates. The patient reports unbroken consciousness, perfect memory, and stable personality. However, the brain is now cooled by external pumps and powered by an external battery pack.
  **NSIP Execution:**
  *   **Stage 1 (Functional):** Pass.
  *   **Stage 2 (Indexical):** Pass. Unified "I" report.
  *   **Stage 3 (Narrative):** Pass. Memory intact.
  *   **Stage 5 (Substrate):** **FAIL.** 100% replacement + Non-biological homeostasis.
  *   **Result:** The NSIP indicates a **Legal Identity Break**.
  *   **The Tension:** Psychologically, the patient is the same. Metaphysically (to many), they are the same. But under Stage 5 (current regulatory policy), they are a new entity.
  *   **Procedural Outcome:** **HALT.** Refer to Full Board.
  *   **Ethical Implication:** The Board must decide whether to grant a "Continuity Waiver." If denied, the patient's assets, marriage, and legal rights technically belong to the "deceased" biological organism, not the current conscious entity. This highlights Stage 5 as a **[VALUE JUDGMENT]**, not a fact.

  ***

  ### Limitations and Exclusions

  This procedure is designed for clinical triage, not metaphysical resolution. Board members must recognize the following categories where the NSIP will misfire or require suspension:

  1.  **Non-Standard Cognitive Architectures:**
      *   *Limitation:* The NSIP assumes a human-like narrative structure (Stage 3). If the substitution protocol enhances cognition to a point where the patient no longer thinks in linear narrative or natural language, Stage 3 will falsely flag a "Break."
      *   *Action:* Any protocol anticipating cognitive *enhancement* (vs. replacement) automatically bypasses NSIP and goes to Full Board.

  2.  **The "Sleep" and "Anesthesia" Gap:**
      *   *Limitation:* The NSIP relies on continuous reporting. It cannot distinguish between a break in identity caused by substitution and the natural discontinuity of sleep or general anesthesia.
      *   *Action:* The NSIP assumes the "Psychological Continuity" theory of identity is sufficient for *moral* status, even if *numerical* identity is philosophically debatable during unconsciousness.

  3.  **Simplifying Philosophical Distinctions:**
      *   *Misfire Risk:* Stage 5 treats "Biological Continuity" as a binary threshold. In reality, this is a spectrum. A hard cutoff (e.g., 50%) is arbitrary and may be challenged in court.
      *   *Misfire Risk:* Stage 2 treats verbal reports as truth. A patient may be confabulating unity while internally fragmented (anosognosia).
      *   *Mitigation:* All Stage 5 failures and Stage 2 ambiguities must be treated as **Normative Policy Decisions**, not scientific findings.

  4.  **Non-Human Analogues:**
      *   *Exclusion:* This protocol is invalid for upload scenarios, whole-brain emulation without a biological host, or AI integration where the "patient" is not initially human.

  **Final Directive to Panel:**
  When the NSIP returns a "HALT" flag, do not attempt to philosophically resolve the identity question. Your mandate is to determine if the *risk to rights and consent* is manageable. If identity is ambiguous, the default ethical position is **conservatism**: assume the pre-operative patient no longer exists in the same moral category, and require fresh consent from the post-operative entity where possible.
