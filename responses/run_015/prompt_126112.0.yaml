prompt: |-
  As a retired biophysicist who has recently turned to philosophy of mind, I am serving on an institutional ethics review panel that evaluates experimental neurosurgical protocols involving gradual neural tissue substitution. Please act as an expert in personal identity theory and clinical decision-analysis. Before constructing your answer, take a moment to brainstorm the core tension in Dennett's brain-transplant puzzle: the conflict between first-person indexical self-location and third-person anatomical or psychological continuity, and why naive bodily criteria fail once tissue can be replaced or distributed without interrupting consciousness.

  The panel needs a reusable, step-by-step procedural framework—not an ad hoc judgment—to determine whether a patient undergoing a multi-site cortical graft protocol retains a single personal identity, has branched, or has dissolved. In this protocol, neural tissue is incrementally replaced across both hemispheres with functionally equivalent synthetic substrates, with conscious processing distributed across transient operational nodes; this creates intermediate states in which a patient might sincerely report "I am here" in reference to anatomically dispersed or fully replaced tissue. Your deliverable should be a practitioner-grade decision procedure that a non-philosopher board member can run under time constraints. Structure it as an ordered sequence of evaluation stages, each specifying: the identity-relevant condition being tested (narrative coherence, first-person indexical tracking, functional integration, biological continuity); the concrete operational test or counterfactual to apply; the threshold that counts as sufficient versus broken; and an explicit flag marking whether that stage involves a factual determination or an unavoidable value judgment about what matters for identity.

  The procedure must include hard cases and its own limits. Apply it to two concrete scenarios: first, a case in which anatomical continuity is fully preserved but first-person reports branch across two simultaneously active nodes, yielding a discontinuity result that the patient will almost certainly reject; second, a case in which all tissue has been replaced yet narrative memory and continuous subjective experience remain intact, but the procedure still indicates a break in identity. At each stage, indicate where the framework must halt and refer the case to full board deliberation rather than resolving it mechanically. Conclude by listing the categories of identity questions this procedure is not designed to resolve—particularly those involving non-standard cognitive architectures or analogues outside human clinical contexts—and be explicit about where simplifying philosophical distinctions for practical use introduces likely misfires. Begin with a brief conceptual clarification of why Dennett's original scenario undermines straightforward anatomical answers, then present the procedure, then the worked applications.
