  **MEMORANDUM**

  **TO:** Dining and Sustainability Advisory Committee
  **FROM:** [Your Name], Graduate Student Union Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Undergrad Sustainability Caucus Proposal (Plant-Based Default Pilot)

  **Executive Summary**

  I recommend that the Committee **approve the proposal with conditions**. Specifically, we should limit the pilot to one dining hall rather than both, remove the lobby pledge wall, and reframe the policy as an institutional procurement test rather than a student moral choice. We should set a hard review date at the semester's end to evaluate whether the 12% animal-protein threshold is achievable without significant off-campus leakage. This approach secures the sustainability goals while mitigating the economic and social risks identified during our preliminary review.

  **Addressing the Causal Argument**

  We must take seriously the argument that individual meal choices do not directly map to animal welfare outcomes. The critique is straightforward: our contractor orders protein in bulk blocks. One student skipping chicken does not cancel a chicken order; it simply lands within the rounding error of the weekly shipment. Unless a specific meal tips the aggregate order over a threshold, the individual act changes nothing regarding procurement or animal death.

  However, our contract contains a specific clause: if animal-protein orders stay under 12% of meals served for two consecutive semesters, procurement terms renegotiate wholesale. This changes the math. The goal is not to save a specific chicken on a specific Tuesday; the goal is to shift the aggregate data enough to trigger a contractual change. In this context, the inefficacy objection is met not by claiming individual choices matter in isolation, but by acknowledging that the *policy* creates the conditions for the threshold to be met.

  That said, we cannot guarantee the threshold will be hit. If we implement this and land at 13% utilization, the critique holds: we disrupted student routines without triggering the contractual safeguard. Therefore, this pilot must be treated as a data-gathering exercise to see if the 12% target is operationally feasible, not as a moral victory lap.

  **Institutional Agency vs. Individual Burden**

  Our Business Manager raised a critical point: if the University mandates this change, the causal question dissolves. It becomes one institutional act of purchasing less meat, rather than thousands of individually insignificant student choices. This distinction is vital for the pilot's design.

  Currently, the proposal relies on a "default" nudge, which implies students are the moral agents responsible for the reduction. This creates friction. If we frame this as an institutional procurement shift, we acknowledge that the University is changing what it buys, and students are adapting to the new menu mix. This removes the implication that students who opt for meat are failing a moral test. It aligns the policy with the contract clause: the University is testing whether it can operate successfully under a lower meat procurement tier.

  **Leakage and the Pledge Wall**

  Two specific risks require mitigation: leakage and the pledge wall.

  First, leakage. If the default becomes too restrictive, students with mandatory meal plans may simply drive to off-campus options for protein. This undermines the sustainability goal (increasing carbon footprint via travel) and hurts dining revenue. We cannot assume the headline reduction numbers in the dining hall represent a net reduction in meat consumption. The pilot must include a mechanism to estimate off-campus displacement, likely through anonymous student surveying mid-semester.

  Second, the pledge wall. I recommend we remove this component for the pilot. Publicly committing to a dietary default creates a "free rider" dynamic where students who eat meat are framed as violating a community norm. This is particularly problematic for international students for whom specific meat dishes may be dietary staples, or students with restricted access to off-campus food due to financial or mobility constraints. Making meat consumption a visible moral failure creates social hostility without adding operational value. If the policy works, the data will show it; we do not need public signatures to validate the reduction.

  **Proposed Pilot Design**

  To manage risk and ensure clean data, I propose the following modifications to the original proposal:

  1.  **Scope:** Implement the plant-based default in **one** of the two proposed dining halls. The second hall remains a control group with the standard menu. This allows us to compare waste metrics, satisfaction scores, and utilization rates directly. If both halls change, we cannot isolate the effects of the policy from seasonal fluctuations in dining traffic.
  2.  **Duration:** One semester. The contract requires two consecutive semesters to trigger renegotiation. We should not commit to the second semester until we verify the first semester's data shows a clear path to the 12% threshold without unsustainable leakage.
  3.  **Metrics:** We need to track three specific data points:
      *   **Procurement Mix:** Percentage of animal protein vs. plant protein served.
      *   **Waste Tracking:** Are plant defaults being thrown away at higher rates than meat defaults?
      *   **Satisfaction/Leakage:** Mid-semester survey regarding student satisfaction and off-campus dining frequency.
  4.  **Sunset Clause:** The policy expires at the end of the semester unless the Committee votes to extend based on the data review.

  **Next Steps**

  If approved, Dining Services should begin vendor coordination immediately to adjust the default menu mix for the selected hall. The Sustainability Caucus should be informed that the pledge wall is excluded to ensure an inclusive environment for all students regardless of dietary restriction or financial mobility. We should schedule a data review meeting for the final week of the semester to decide on continuation.

  **Conclusion**

  This proposal is not about proving individual students can save animals through single meals. It is about testing whether the University can structurally shift its procurement to a lower tier without losing student engagement. By narrowing the scope, removing the moralizing elements, and focusing on the contractual threshold, we can answer the efficacy questions honestly. If the data shows we can hit the 12% target without driving students off-campus, we have a path forward. If not, we have saved ourselves from a year of operational friction without environmental gain.

  I move we approve the pilot under these conditions.
