  **MUNICIPAL COMMISSION FOR RATIONAL RECONSTRUCTION**
  **MEMORANDUM OF DECISION**

  **TO:** City Reconstruction Authority
  **FROM:** Municipal Commission for Rational Reconstruction
  **DATE:** 14 October 1947
  **SUBJECT:** Ruling on the Axiological Partition Protocol (APP)

  **1. DECISION AND RECOMMENDATION**

  The Commission hereby grants **Conditional Approval** for the implementation of the Axiological Partition Protocol (APP) in the redesign of the Industrial Quarter. The Protocol is accepted as the primary framework for zoning recommendations, provided that the modifications outlined in Section 3 of this memo are adopted immediately.

  The Commission finds that the bifurcation of planning proposals into a Factual Branch (empirically verifiable data regarding traffic, sanitation, density, and commute duration) and a Value Branch (expressions of community preference regarding aesthetics, dignity, and belonging) is necessary to prevent resource allocation from becoming arbitrary. Without this partition, disputes over desired ends contaminate the forecasting of means, rendering reconstruction inefficient. However, the Protocol cannot be implemented as a purely technical instrument without acknowledging the normative limits of its own design.

  **2. ASSESSMENT OF THE METRIC SELECTION CRITIQUE**

  The opposition, represented by the local architects and former resistance organizers, has argued that the selection of empirical metrics is itself a normative imposition. They contend that choosing to measure economic efficiency rather than pedestrian proximity, or housing density rather than social continuity, embeds unacknowledged value commitments into the Factual Branch. Consequently, relegating community voices to the Value Branch disenfranchises them by denying those voices cognitive claim-status in the final policy justification.

  The Commission accepts the validity of this argument. It is acknowledged that the decision to measure specific variables is not value-neutral. The selection of metrics determines which aspects of human life are rendered visible to the planning process and which remain opaque. A protocol that claims total neutrality in metric selection would be self-deceptive.

  Therefore, while the *measurement* of data must remain strictly empirical to maintain cognitive integrity, the *selection* of what is measured cannot be dictated solely by technical planners. To address this, the Commission mandates the formation of Metric Selection Committees comprising both technical planners and community representatives. These committees will vote on which variables enter the Factual Branch. Once selected, the measurement of those variables remains bound by empirical verification standards, but the choice of variables is recognized as a democratic value judgment, not a scientific necessity.

  **3. THE ROLE OF INSTRUMENTAL RATIONALITY**

  Regarding the philosophical basis of the Protocol, questions have been raised concerning the utility of the fact/value distinction if community preferences are excluded from cognitive justification. Some members have suggested adopting the view that rational value discussion is possible by translating preferences into empirical predictions about human satisfaction. Under this view, a statement regarding dignity is treated as a hypothesis that certain physical arrangements will produce a psychological state of satisfaction.

  The Commission determines that this approach partially salvages the Protocol but must not be allowed to collapse the distinction between the two branches. Translating preferences into predictions about satisfaction allows the Factual Branch to assess whether a specific zoning plan will instrumentally achieve the ends desired by the community. We can empirically verify whether a proposed park layout leads to the predicted increase in reported community cohesion.

  However, this method cannot validate the end itself. Science can determine if a policy satisfies a preference, but it cannot determine if that preference *ought* to be satisfied. Therefore, the Protocol will utilize empirical predictions of satisfaction strictly as a tool for instrumental efficiency within the Factual Branch. The Value Branch will retain the community preferences as non-cognitive expressions of attitude. This ensures that while we can scientifically optimize for community desires, we do not falsely claim that those desires are objectively true or false in themselves. The distinction remains: the Factual Branch handles the efficiency of means; the Value Branch records the ends.

  **4. ADJUDICATION OF CONTRADICTORY VALUE PREFERENCES**

  A practical difficulty arises when two communities express contradictory Value Branch preferences (e.g., Community A demands a memorial site; Community B demands high-density housing) but the Factual Branch indicates that both options yield equal measurable satisfaction and resource efficiency. In such cases, the empirical data provides no basis for decision, and the non-cognitive status of the Value Branch means logic cannot resolve the conflict.

  The Commission establishes the following Procedural Priority Rule for such deadlocks:

  1.  **Vulnerability Precedence:** Priority shall be given to the community segment demonstrating the highest level of prior displacement or material loss during the conflict, as verified by independent relief records.
  2.  **Rotational Allocation:** If vulnerability metrics are equal, conflicting projects of equal factual merit shall be subject to rotational allocation across fiscal quarters, ensuring neither preference is permanently excluded.
  3.  **Escalation:** If neither rule applies, the decision shall be escalated to the City Reconstruction Authority for political arbitration. The Commission explicitly notes that this escalation is not a technical decision but a political one, and must be recorded as such in the final minutes.

  **5. IMPLEMENTATION**

  The Axiological Partition Protocol, modified by the conditions above, is to be effective immediately for all zoning proposals submitted in the next fiscal cycle. Technical staff are instructed to update their forecasting models to accommodate the participatory metric selection process. The Commission reaffirms that while science cannot dictate values, it must rigorously protect the integrity of facts so that value choices are made with clear eyes regarding their consequences.

  **Signed,**

  *Dr. H. Vogel*
  Chair, Municipal Commission for Rational Reconstruction
