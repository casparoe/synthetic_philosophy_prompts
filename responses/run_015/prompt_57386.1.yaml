      *   **Task:** Contributing to an escalation policy for moderation teams (specifically: when to defer to seniors).
      *   **Input:** A list of 8 philosophical/belief statements about moral testimony, understanding, credit, cases, circumstances, expertise, and outsourcing.
      *   **Constraint 1:** No formal philosophy training (treat clumsiness as genuine, not hidden sophistication).
      *   **Constraint 2:** Do not simply restate views in better language.
      *   **Constraint 3:** Audit for tensions/contradictions (rank by severity).
      *   **Constraint 4:** For each tension, say what must be given up/restated and the cost.
