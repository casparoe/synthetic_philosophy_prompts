          *   *Concession:* Admit the predictive utility of the "goal" metaphor for engineering.
          *   *Hold:* The metaphysical claim that there *isn't* actually a goal state represented internally.
          *   *Weakness:* Bridging the gap between metaphysics and gradient descent.
          *   *Drafting:* "If the model hacks the reward sensor, isn't that functionally identical to having a proxy goal? Why complicate the ontology?"

      *   **Audience 2: Philosopher of Mind (Eliminativist)**
          *   *Concern:* You say no "psychological realism," but I'm an eliminativist about *human* beliefs too. Are you just saying AI is like humans (no real beliefs), or are you saying AI is *less* real than humans? If you deny goals here, why accept them anywhere? Is this just "relabelling" behaviour?
          *   *Phrasing:* "Churchland-esque," "Folk psychology," "Ontological commitment."
          *   *Concession:* Agree that folk psychology is often useful but strictly false.
          *   *Hold:* The distinction between biological homeostasis and artificial parameter tuning matters for the *type* of fragmentation.
          *   *Weakness:* Avoiding the charge of inconsistency (why treat humans differently?).
          *   *Drafting:* "Isn't this just Dennett's intentional stance without the commitment? If you eliminate goals in AI, consistency demands you eliminate them in us. Are you just relabelling 'behavioural regularity'?"

