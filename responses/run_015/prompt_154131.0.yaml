prompt: |-
  I'm preparing an essay on the portability of anti-corruption norms across bureaucratic cultures, and I'm particularly interested in whether practices like clientelism and ritual gift-giving can be assessed without implicitly adopting a Western liberal-contractual framework. To clarify my own thinking, I'd like you to write a dialogue between two equally competent interlocutors—call them Mara and Elias—who disagree on whether Western transparency standards should be treated as universal. Mara should defend a refined universalist view that distinguishes institutional corruption (when a social practice systematically subverts the public purpose of an office, regardless of local acceptance) from transactional corruption (the explicit breaking of formal rules for private gain), arguing that dense patron-client networks often constitute the former even when they are locally normative and involve no explicit quid pro quo. Elias should push back by contending that this very distinction smuggles in a particular ontology—one that assumes a separable "public purpose" independent of relational obligations—while in many societies gift and reciprocity constitute the moral fabric of authority rather than its subversion; he should argue that labeling customary obligation as corruption imposes an alien transactional logic onto relational social orders. The exchange should be genuinely dialectical: each speaker must address the specific point just made, neither should be reduced to a strawman, and they should converge on a precise disagreement rather than talking past one another. Begin the response with the dialogue itself, with no preface, commentary, or restatement of the prompt.
