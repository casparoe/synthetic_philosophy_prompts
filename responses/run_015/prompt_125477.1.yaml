answer: |-
  Here is a principle constructed from your data, calibrated to Hume's arguments, and stress-tested against your constraints.

  ### The Principle of Differential Adjustment and External Claim

  **Money is a neutral accounting unit in a closed system at equilibrium, but a non-neutral claim on resources during disequilibrium or across borders.**

  This principle decomposes into three operational clauses:

  **Clause A: The Closed-System Neutrality Limit**
  In a closed economy with fully flexible prices and no change in the velocity of circulation, a change in the money stock changes only nominal values (prices/wages), not real output or welfare, aside from arbitrary redistributions between debtors and creditors.
  *   **Motivated by:** Case 1 (Overnight doubling) and Case 7 (Interest rates).
  *   **Mechanism:** If every price tag and wage contract scales instantly, relative prices remain unchanged. No signal is sent to producers to work more or less. Interest rates, being the price of *capital* (real goods), not *money*, remain unchanged.

  **Clause B: The Transition Stimulus (The Humean Lag)**
  In an open or sticky-price economy, new money enters at specific points and circulates before general prices rise. This changes *relative* prices temporarily, signaling profit opportunities that mobilize idle labor and capital. If this mobilization creates new habits of industry or infrastructure, the real gain persists after prices adjust.
  *   **Motivated by:** Case 2 (Trickle inflow) and Case 3 (Luxury imports).
  *   **Mechanism:** The farmers in Case 2 see higher prices for their goods *before* the prices of the tools they buy rise. They work harder. If that hard work becomes habit or builds lasting capital, the economy is larger even after the money is fully absorbed into prices. Case 3 fails this test because the spending signal went to foreign workshops, not domestic ones.

  **Clause C: The External Claim Right**
  Money is a transferable claim on real resources. In an open economy, the value of money is not determined solely by the domestic price level, but by the willingness of foreigners to accept it in exchange for real goods.
  *   **Motivated by:** Case 5 (Famine grain) and Case 4 (Exporters parking abroad).
  *   **Mechanism:** In Case 5, the money commands foreign grain because foreigners want the currency (or the specie). The real resource (grain) moves, saving lives. In Case 4, the claim is never exercised domestically, so the domestic economy sees no signal.

  ---

  ### Prediction: The "Never-Closing Interval" (Reserve Currency)

  You asked what happens when foreigners are so eager to hold your currency that the "interval" in Clause B never seems to close (i.e., the world absorbs your money without forcing domestic inflation).

  **Prediction:**
  The country runs a **permanent real transfer surplus**. It can consume more real goods than it produces indefinitely (importing more than it exports) because foreigners accept the paper claims in lieu of real goods.
  *   **Short-term:** High domestic employment and consumption without inflation (The "Exorbitant Privilege").
  *   **Long-term:** The domestic manufacturing base atrophies (Dutch Disease). Since the currency is strong and demand is met by imports, domestic exporters become uncompetitive (Case 6 scenario). The economy becomes financialized.
  *   **Risk:** The system relies on confidence. If foreign holders suddenly demand real goods (Clause C), the domestic price level must collapse or the currency must devalue violently to clear the market.

  ---

  ### The Verdict Audit: What You Must Give Up

  Your intuition is remarkably Humean, but to make the system consistent, you must modify or abandon three specific intuitions.

  **1. You must drop the strict "Nobody is better off" in Case 1.**
  *   **Why:** Even in a closed overnight doubling, *relative* wealth changes. Debtors are better off (they repay in cheaper coins); creditors are worse off. Hume explicitly notes this redistribution.
  *   **Correction:** Change verdict to: "Aggregate output is unchanged, but wealth is arbitrarily redistributed from lenders to borrowers."

  **2. You must resolve the Case 1 vs. Case 5 contradiction by enforcing the Boundary Condition.**
  *   **Why:** You identified these as irreconcilable, but they are not. Case 1 specifies "no foreign trade." Case 5 specifies "buy grain from abroad."
  *   **Correction:** You do not need to give up the verdicts, but you must give up the worry that they contradict. Case 1 tests *domestic* neutrality. Case 5 tests *international* purchasing power. Money is neutral domestically (eventually) but potent internationally (immediately).

  **3. You must commit on Case 6 (The Rich Neighbor).**
  *   **Why:** Your ambivalence ("back and forth") is the only place where you diverge from Hume's core insight on commerce. Hume argues vehemently that a rich neighbor is *always* a benefit, even if they undersell you in some lines.
  *   **Correction:** You must give up the fear that they can "undersell us everywhere." If they are more productive in *everything*, their wages and prices will rise until comparative advantage reasserts itself. You gain by having a richer market for your own exports and access to cheaper/better goods.
  *   **New Verdict:** "We gain unequivocally. Their advanced manufactures lower our costs of living, and their increased wealth increases demand for our niche exports."

  ### Summary for your Data Model
  Think of money not as oil (lubricant), but as **signal latency**.
  *   **Case 1:** Signal latency is zero (overnight). No production change.
  *   **Case 2:** Signal latency is high (trickle). Production changes before the signal dissipates.
  *   **Case 5:** Signal is routed externally. Real resources follow the signal regardless of domestic latency.

  Your "tentative principle" was close, but it missed the **Open/Closed boundary**. Once you tag Case 1 as `closed_system=True` and Case 5 as `open_system=True`, the logic compiles.
