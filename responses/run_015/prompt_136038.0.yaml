answer: |-
  Before committing to a label, I weighed five candidate concepts against your cases. **Logrolling** fits the committee vote-swap but fails the hedgerow case where no vote exists and only one party acts. **Coasean Bargaining** captures the payment-for-restraint structure but presupposes agreed property rights, whereas your disputes are about the *normative status* of the rights themselves. **Moral Trade** (as discussed in recent effective altruism circles) usually implies both parties performing the other's preferred moral act, which excludes the hedgerow case where one side merely pays. **Modus Vivendi** is broad enough to cover living together despite disagreement, but it lacks the specific mechanism of *gains generated by* the divergence rather than mere tolerance of it. **Rotten Compromise** (Margalit) concerns agreements with evil that corrupt the parties; your cases involve principled disagreement, not moral corruption, though the "shame" hints at a similar expressive injury. None of these perfectly capture the combination of value creation from divergence plus the specific moral residue of "pricing" a principle.

  **The Concept: Normative Arbitrage**

  I am confident that **Normative Arbitrage** is not an established term in the literature; I am coining it here to describe this specific phenomenon. I am highly confident, however, that it accurately isolates the structural and ethical features you describe.

  **Definition:**
  Normative Arbitrage occurs when two parties exploit a divergence in their normative valuations of an object or action to create a surplus that would not exist if their values converged, typically involving a transaction where one party compensates the other for acting (or refraining) in accordance with the compensator's principles rather than their own. The phenomenon is defined by three necessary conditions:
  1.  **Normative Divergence:** The parties disagree on the intrinsic value or duty associated with the object/action (not merely on price or preference).
  2.  **Surplus from Disagreement:** The transaction is only viable *because* of this divergence; if either party converted to the other's view, the economic incentive for the deal would vanish.
  3.  **Expressive Cost:** The transaction incurs a non-material cost (shame, anger, sullenness) because treating a normative commitment as a tradable commodity undermines its expressive value as a principle.

  **Are your cases one phenomenon?**
  Yes. Both the committee deadlock and the hedgerow dispute are instances of Normative Arbitrage. In the committee, the "currency" is funding allocation; in the hedgerow, it is property restraint. In both, the surplus (funded projects, preserved hedge) arises strictly from the fact that Side A values X highly while Side B values it lowly (or negatively), allowing Side A to "buy" what Side B doesn't care about.

  **Your Brother's Claim:**
  Your brother is incorrect regarding the committee case, likely confusing *preference symmetry* with *valuation symmetry*. In trade theory, gains arise precisely from divergent marginal valuations (mirror images of preference across different objects). If the Structuralists value Structural work at 10 and Welfare at 0, and the Measurers value Welfare at 10 and Structural at 0, this *is* a mirror image, and it *creates* maximum gains from trade (as you observed). Your brother would only be right if "mirror image" meant both sides valued *both* causes equally (consensus), in which case no arbitrage is possible. The "extra ingredient" you seek is not beyond disagreement; it is the *asymmetry of valuation* applied to a *shared resource constraint*.

  **The Sullenness (Expressive Cost):**
  The anger and shame are not separate; they are the **Expressive Cost** inherent to Normative Arbitrage. When you pay a neighbor to spare a hedge he thinks worthless, you signal that his agency is for sale, insulting his status as a moral agent who acts on reasons. When the committee cross-funds, members feel shame because they are instrumentally supporting work they normatively oppose, compromising their integrity for efficiency. This cost explains why the hiring colleague refused the deal: the Expressive Cost outweighed the Surplus.

  **Two Near-Miss Exclusions:**
  1.  **Pure Bribery:** A drug dealer pays a judge to dismiss a case. This is excluded because the judge does not merely value the dismissal less than the dealer; the judge violates a duty they *acknowledge*. In Normative Arbitrage, the neighbor genuinely believes he has no duty to keep the hedge; the disagreement is about the duty itself, not the violation of an agreed one.
  2.  **Standard Market Trade:** I buy an apple from you because I value it more than you do. This is excluded because the apple is not a *normative* object. Neither of us claims a moral duty regarding the apple's location. Normative Arbitrage requires the object of trade to be laden with conflicting principles (justice, welfare, integrity).

  **Specialist Pushback:**
  A law-and-economics specialist would push back on my insistence that this is distinct from **Coasean Bargaining**. They would argue that "normative status" is just another preference constraint and the "shame" is merely a high transaction cost. They would claim I am reifying "principles" unnecessarily. My counter is that Coasean bargaining assumes rights are defined to solve the dispute; here, the transaction *bypasses* the definition of rights because the parties cannot agree on them, and the "shame" is a qualitative ethical injury, not just a quantitative cost. A moral philosopher might conversely argue that this is simply **Compromise**, but I maintain that standard compromise involves mutual concession on the *outcome*, whereas Normative Arbitrage involves mutual concession on the *source of funding/action* while achieving the outcome each originally wanted, which is a distinct structural category.
