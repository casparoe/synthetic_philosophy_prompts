answer: |-
  ### Strategic Research Program: The Formal and Ontological Foundations of Active Inference

  Given the constraints (no wet-lab access, 3-year horizon, avoidance of cosmological overreach) and the aim (restructuring downstream practice rather than theoretical ornamentation), the program must prioritize **validity** and **ontology** over **application**. Attempting to restructure psychiatric nosology (Candidate ii) before settling the status of the Free Energy Principle (FEP) itself is a category error that risks producing "FEP-washing" of existing categories.

  Therefore, the bulk of resources should command the following two lines of inquiry, executed in strict dependency order:

  1.  **The Independence Question (Candidate iii):** Is FEP a genuine constraint or a Bayesian redescription?
  2.  **The Ontological Question (Candidate i):** Is the architecture representational or purely sensorimotor-coupling?

  Candidate (ii) (Psychiatric Classification) is treated not as a primary line of inquiry but as the **validation case** for the first two. Resources should only flow to (ii) in the final year, contingent on positive resolutions of (iii) and (i).

  ---

  ### 1. The Independence Question (Candidate iii)
  **Inquiry:** Does the free-energy formulation provide a genuinely independent constraint on model selection, or is it a redescription of dynamics already captured by standard Bayesian inference?

  *   **Dependency Order:** **First (Upstream).** This is the gatekeeper. If FEP is mathematically equivalent to standard variational Bayesian inference without adding unique topological or dynamical constraints, the "Principle" adds no explanatory leverage. It becomes a notation change. If this is the case, the entire program loses its justification for restructuring downstream fields; standard Bayesian modeling would suffice.
  *   **Tractability (No Empirics):** **High.** This is a formal problem. It requires comparing the solution spaces of FEP-derived dynamics against standard Bayesian filtering/smoothing in controlled simulations. Philosophers of science can analyze the logical structure of the derivations (e.g., the move from ergodicity to the bound), while modelers can test whether FEP converges on solutions that standard Bayesian methods miss in non-stationary environments.
  *   **Impact on Practice:** **Critical.**
      *   *If FEP is independent:* It justifies the cost of adopting a new framework in robotics and psychiatry because it solves problems standard inference cannot (e.g., specific forms of non-equilibrium steady-state maintenance).
      *   *If FEP is a redescription:* The program must pivot immediately to optimizing standard Bayesian workflows, saving downstream fields from adopting unnecessary complexity. This resolves the "theoretical ornament" risk immediately.

  ### 2. The Ontological Question (Candidate i)
  **Inquiry:** Does prediction-error minimization across interoceptive/exteroceptive domains require a representational architecture, or can it be reconstructed in purely sensorimotor-coupling terms without loss of explanatory power?

  *   **Dependency Order:** **Second (Downstream of iii, Upstream of ii).** This inquiry only matters if (iii) confirms FEP has unique traction. Once validity is established, we must determine *what* is being modeled. If the mechanism is purely coupling (enactivist), then "generative models" in psychiatry are metaphors, not neural realities. If it is representational, then psychiatric disorders involve specific content-bearing states.
  *   **Tractability (No Empirics):** **High.** This is a conceptual and modeling challenge. The team can construct "representation-hungry" vs. "representation-thin" agents in simulation to see if interoceptive regulation (e.g., homeostasis) fails in the latter under specific complexity constraints. Philosophers can rigorously define the boundary conditions where "coupling" fails to explain data that "representation" captures.
  *   **Impact on Practice:** **Transformative.**
      *   *Robotics:* If coupling suffices, embodied robotics can discard internal world models for reactive controllers, drastically reducing compute loads. If representations are required, research must focus on neural encoding of priors.
      *   *Psychiatry:* If representational, therapy targets "false beliefs" (CBT-style). If coupling, therapy targets "sensorimotor contingencies" (somatic/exposure-style). This directly restructures nosology without needing new clinical data, by reinterpreting existing symptom clusters through the resolved ontology.

  ---

  ### Why Candidate (ii) (Psychiatric Classification) is Deprioritized
  Allocating bulk resources to psychiatric classification (Candidate ii) *before* resolving (iii) and (i) violates the constraint against "theoretical ornament."
  *   **Risk:** Without settling (iii), you cannot know if FEP offers a better lens than standard statistics. Without settling (i), you cannot know if "allostatic failure" refers to broken inference or broken coupling.
  *   **Strategy:** Use Year 3 to apply the resolved frameworks from (iii) and (i) to a specific nosological problem (e.g., depression as interoceptive prior rigidity). This ensures the output is a *restructuring* based on settled foundations, not a speculative mapping.

  ---

  ### Meta-Question Analysis: Conceptual vs. Normative

  **The Dispute:** The most upstream dispute is **Normative**, not Conceptual.

  **Defense:**
  The *Conceptual* dispute concerns what minimization *denotes* (e.g., is it a physical force, an information geometric property, or a biological imperative?). The *Normative* dispute concerns what distinguishes an explanatory model from a post-hoc variational gloss (i.e., does it generate novel predictions or merely fit existing data?).

  **Why Normative is Upstream:**
  1.  **Utility Precedes Ontology:** In a 3-year program aimed at restructuring practice, it matters less what free energy *is* (Conceptual) and more whether using it *works better* than alternatives (Normative). We can treat FEP instrumentally. If it normatively outperforms standard Bayesian inference (Candidate iii), we can adopt it regardless of whether we view the "bound" as a physical reality or a mathematical convenience.
  2.  **Dispensability:** Settling the **Normative** question renders the **Conceptual** question dispensable for the purpose of *practice restructuring*.
      *   If FEP is normatively superior (it predicts outcomes standard models miss), clinicians and roboticists will adopt it regardless of whether they believe the "free energy" is real or just a useful fiction.
      *   If FEP is normatively neutral (it fits data equally well but predicts nothing new), settling the Conceptual nature of minimization is irrelevant; the framework should not be adopted for engineering or clinical use.

  **Conclusion:**
  The program must treat the **Normative** status of FEP (Candidate iii) as the primary filter. If FEP passes the normative test (independent constraint), the team then resolves the **Conceptual/Ontological** status (Candidate i) to determine *how* to implement it. If FEP fails the normative test, the program terminates, having saved the field from a decade of ornamental theorizing. This approach respects the 3-year horizon and the team's formal strengths while ensuring any downstream impact on psychiatry or robotics is built on valid, non-ornamental foundations.
