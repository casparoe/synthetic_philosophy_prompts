prompt: |-
  I'm the acquisitions editor for a small museum — we get exibit pitches every month that mix real archeology with fringe chronology or ancient-aliens claims. I need a reusable 10-minute screening procdure I can run alone, translating whatever philosophy of history says about demarcating pseudohistory (falsifiability, source proximity, consilience with established chronology, replication) into ordered steps: ask this, check that, hard stop here, values-call flag there. Fix the role, stakes, and where judgment can't be removed. Apply it to three pitches: (1) literal Plato Atlantis with underwater formations near the Azores; (2) Fomenko's statistical chronology arguing the Almagest was compiled in the 1500s; (3) ancient metallurgists needed alien tutors because a slag-purity study is misapplied. Include one case where the procdure kills it but I'd still want a "how myths form" display, and flag where it will misfire.
reasoning: |-
  Here's a thinking process that leads to the suggested screening procedure:

  1.  **Analyze the Request:**
      *   **Role:** Acquisitions Editor for a small museum.
      *   **Task:** Create a reusable 10-minute screening procedure for exhibit pitches.
      *   **Content:** Mix of real archaeology + fringe chronology/ancient aliens.
      *   **Theoretical Basis:** Philosophy of history (falsifiability, source proximity, consilience, replication).
      *   **Format:** Ordered steps (Ask, Check, Hard Stop, Values-Call Flag).
      *   **Application:** Apply to three specific pitches (Atlantis/Azores, Fomenko/Almagest, Alien Metallurgy/Slag).
      *   **Specific Requirement:** Include one case where the procedure rejects the pitch *but* suggests a "how myths form" display instead.
      *   **Specific Requirement:** Flag where the procedure might misfire (limitations).
      *   **Tone:** Professional, practical, decisive, philosophically grounded.

  2.  **Deconstruct the Philosophy of History into Practical Steps:**
      *   *Falsifiability:* Can this be proven wrong? If not, it's dogma, not history.
      *   *Source Proximity:* How close is the evidence to the event? (Primary vs. Tertiary, Contemporary vs. Centuries later).
      *   *Consilience:* Does this fit with other established fields (geology, astronomy, physics)?
      *   *Replication:* Can other researchers find the same results using the same methods?
      *   *Burden of Proof:* Extraordinary claims require extraordinary evidence.

  3.  **Drafting the Procedure (The "10-Minute Triage"):**
      *   Need to make it fast. 10 minutes means roughly 2 minutes per step.
      *   *Step 1: The Claim Definition (2 mins).* What exactly are they saying?
      *   *Step 2: The Falsifiability Check (2 mins).* Is it testable?
      *   *Step 3: Source & Proximity Audit (2 mins).* Where's the data from?
      *   *Step 4: Consilience Stress Test (2 mins).* Does it break physics/geology?
      *   *Step 5: The Verdict & Pivot (2 mins).* Accept, Reject, or Reframe.
      *   *Need to define "Hard Stops" (Immediate Rejection) and "Values-Call Flags" (Editorial Judgment).*

  4.  **Developing the Three Case Studies:**

      *   **Case 1: Atlantis/Azores.**
          *   *Claim:* Plato was literal; underwater formations near Azores are ruins.
          *   *Analysis:* Geology shows volcanic origin. Plato's timeline doesn't match.
          *   *Verdict:* Reject as history. *Pivot:* Use for "Myth Formation" (how Plato's allegory became 'fact').
          *   *Fit:* This matches the requirement for a "how myths form" display.

      *   **Case 2: Fomenko/New Chronology.**
          *   *Claim:* Almagest compiled in 1500s; history is compressed.
          *   *Analysis:* Statistical methods are flawed. Contradicts dendrochronology, ice cores, astronomy.
          *   *Verdict:* Hard Stop. Pseudoscience.
          *   *Fit:* Good example of consilience failure.

      *   **Case 3: Alien Metallurgy/Slag.**
          *   *Claim:* Slag purity implies alien tech.
          *   *Analysis:* Misapplication of materials science. Human experimentation explains it.
          *   *Verdict:* Reject alien claim, accept metallurgy exhibit if corrected.
          *   *Fit:* Good example of fixing the science vs. rejecting the fringe.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Role:* You are the Gatekeeper of Epistemic Integrity.
      *   *Stakes:* Museum reputation, public trust, educational value.
      *   *Judgment:* Where does the editor step in? When the evidence is ambiguous but the narrative is harmful or misleading.
      *   *Misfire Flag:* The procedure might kill innovative but currently unproven hypotheses (the "ignored genius" problem). Need to acknowledge this.

  6.  **Writing the Content (incorporating the constraints):**
      *   *Introduction:* Set the stage.
      *   *The Protocol:* Numbered steps with time limits.
      *   *The Application:* Walk through the three pitches using the protocol.
      *   *The "Myth" Pivot:* Explicitly highlight Case 1.
      *   *The Misfire Warning:* Explicitly address limitations.

  7.  **Review against Constraints:**
      *   10-minute procedure? Yes, structured by time.
      *   Philosophy of history concepts included? Yes (falsifiability, etc.).
      *   Ordered steps (Ask, Check, Hard Stop)? Yes.
      *   Three specific pitches applied? Yes.
      *   One "Myth Form" case? Yes (Atlantis).
      *   Flag misfire? Yes.
      *   Tone? Professional editor.

  8.  **Final Polish:** Ensure the distinction between "Hard Stop" (objective failure) and "Values-Call" (subjective editorial decision) is clear. Make sure the Fomenko case is handled firmly (it's widely regarded as pseudoscience). Ensure the Atlantis case emphasizes the *educational value of the myth* rather than the *truth of the claim*.

      *(Self-Correction during drafting)*: Initially, I might just say "Reject Atlantis." But the prompt asks for a case where I kill the pitch *but* want a "how myths form" display. I need to make sure the procedure allows for that "Reframe" option, not just binary Accept/Reject. I will add a "Reframe" outcome to Step 5.

      *(Self-Correction on Fomenko)*: Fomenko is extreme. The procedure should catch this early on Consilience. I'll make sure Step 4 hits hard on cross-disciplinary agreement.

      *(Self-Correction on Metallurgy)*: This is a misinterpretation of data. The procedure needs to distinguish between "bad data" and "bad interpretation." This is a "Fixable" rejection.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Epistemic Triage Protocol (ETP)
  **Role:** Acquisitions Editor (Gatekeeper of Public Trust)
  **Time Limit:** 10 Minutes per Pitch
  **Stakes:** Institutional credibility, educational integrity, avoidance of misinformation.

  This protocol translates philosophy of history into an operational checklist. It is not designed to judge *truth* absolutely, but to judge *methodological validity*. You are not deciding if the past happened; you are deciding if the proposer's method for knowing the past is sound.

  ### Phase 1: The Claim Definition (2 Minutes)
  **Action:** Ask the proposer to write the core thesis in one sentence.
  **Check:** Is the claim specific enough to be tested?
  *   **Hard Stop:** If the claim is unfalsifiable (e.g., "You can't prove aliens *didn't* help," or "The evidence was destroyed by the conspiracy").
  *   **Values-Call Flag:** If the claim relies on "hidden knowledge" accessible only to the proposer.

  ### Phase 2: Source Proximity & Chain of Custody (2 Minutes)
  **Action:** Ask for the primary source of the data.
  **Check:** What is the temporal and causal distance between the event and the evidence?
  *   **Hard Stop:** If the evidence is tertiary (e.g., a 19th-century translation of a medieval copy of a lost oral tradition) but treated as primary data.
  *   **Values-Call Flag:** If the proposer dismisses contemporary records in favor of much later interpretations without justification.

  ### Phase 3: Consilience Stress Test (3 Minutes)
  **Action:** Check the claim against established, independent fields (geology, astronomy, physics, dendrochronology).
  **Check:** Does this claim require *other* established sciences to be wrong for this to be right?
  *   **Hard Stop:** If the claim contradicts multiple independent fields (e.g., history requires astronomy to be wrong *and* geology to be wrong).
  *   **Values-Call Flag:** If the claim requires a minor adjustment to one field but fits others. (This is where innovation lives).

  ### Phase 4: Replication & Peer Consensus (2 Minutes)
  **Action:** Ask: "Has this been published in a peer-reviewed journal outside your own organization?"
  **Check:** Is the method replicable by a third party?
  *   **Hard Stop:** If data is proprietary or methods are "intuitive."
  *   **Values-Call Flag:** If the claim is new (1–2 years) and peer review is pending. (Hold, do not reject).

  ### Phase 5: Verdict & Pivot (1 Minute)
  **Decision:**
  1.  **Green Light:** Methodologically sound.
  2.  **Red Light:** Pseudohistory. Kill pitch.
  3.  **Reframe:** The *claim* is false, but the *phenomenon* is culturally significant. (Proceed to "Myth Formation" track).

  ---

  ## Application to Current Pitches

  ### Pitch 1: Literal Plato Atlantis (Azores Formations)
  **The Pitch:** Plato's *Timaeus* is a historical record, not allegory. Underwater volcanic formations near the Azores are man-made structures from 9,000 BCE.

  *   **Phase 1 (Claim):** "Plato described a real place that sank 11,000 years ago." (Falsifiable? Yes.)
  *   **Phase 2 (Source):** Source is Plato (360 BCE) describing events 9,000 years prior to him.
      *   *Flag:* Massive temporal gap. No contemporary corroboration from Egyptian records (Plato's alleged source).
  *   **Phase 3 (Consilience):**
      *   *Geology:* Azores formations are volcanic basalt, not cut stone.
      *   *Sea Level:* 9,000 BCE sea levels do not match the depth of the formations.
      *   *Hard Stop:* Requires geology and oceanography to be fundamentally wrong.
  *   **Phase 4 (Replication):** Sonar data is available to all; no other marine archaeologists classify these as ruins.
  *   **Phase 5 (Verdict):** **Reframe.**
      *   **Decision:** The historical claim is false (Red Light). However, the *persistence* of the Atlantis myth is a valid historical subject.
      *   **Action:** Reject the "Atlantis existed" exhibit. Propose a "Anatomy of a Myth" display: How Plato's allegory was reinterpreted through the Renaissance to the modern era. This teaches *historiography* rather than false history.

  ### Pitch 2: Fomenko's New Chronology (The Almagest)
  **The Pitch:** Statistical analysis of star catalogs proves the *Almagest* was compiled in the 1500s CE, not antiquity. All ancient history is compressed; the Middle Ages never happened.

  *   **Phase 1 (Claim):** "Historical chronology is falsified; the past is 1,000 years shorter." (Falsifiable? Yes.)
  *   **Phase 2 (Source):** Relies on statistical correlation of star positions.
      *   *Flag:* Ignores textual transmission history of the *Almagest* manuscripts.
  *   **Phase 3 (Consilience):**
      *   *Astronomy:* Precession of equinoxes contradicts the 1500s date.
      *   *Dendrochronology:* Tree rings provide continuous dating back 10,000+ years, independent of human records.
      *   *Ice Cores:* Annual layers contradict the compressed timeline.
      *   *Hard Stop:* **Immediate Rejection.** To accept this, you must reject physics, biology, and geology simultaneously.
  *   **Phase 4 (Replication):** Fomenko's methods have been debunked by statisticians; results are not replicable using standard error margins.
  *   **Phase 5 (Verdict):** **Red Light.**
      *   **Decision:** Kill pitch. No reframing. This is conspiracy theory, not history. Exhibiting this damages institutional credibility.

  ### Pitch 3: Alien Metallurgists (Slag Purity)
  **The Pitch:** Ancient slag found in a Bronze Age site is too pure for human technology. Aliens provided the tutors.

  *   **Phase 1 (Claim):** "Human technology could not produce this purity." (Falsifiable? Yes.)
  *   **Phase 2 (Source):** Chemical assay of the slag.
      *   *Check:* Is the assay peer-reviewed? Yes.
  *   **Phase 3 (Consilience):**
      *   *Materials Science:* High purity can be achieved via extended refining time or specific ore sources, not just temperature.
      *   *Archaeology:* Kilns found on-site match human design, not "advanced" design.
      *   *Flag:* The *data* is real, the *interpretation* (aliens) is the leap.
  *   **Phase 4 (Replication):** Experimental archaeology has replicated similar purity using period-accurate bellows and extended processing.
  *   **Phase 5 (Verdict):** **Reframe/Correction.**
      *   **Decision:** Reject the "Alien" narrative (Red Light). Accept the "Metallurgy" narrative (Green Light) *if* the text is corrected.
      *   **Action:** Require the proposer to rewrite the label copy. Focus on the *ingenuity* of the human metallurgists who achieved high purity through labor-intensive methods, not supernatural aid. This preserves the artifact's value while correcting the narrative.

  ---

  ## Limitations & Misfire Warning

  **Where this Procedure Will Misfire:**
  The ETP is biased toward **Consilience (Phase 3)**. This is necessary for stability, but it creates a "Paradigm Blindness" risk.
  *   **The "Ignored Genius" Scenario:** If a proposer has genuine evidence that *does* contradict a settled field (e.g., a genuine anomaly in radiocarbon dating), Phase 3 will trigger a Hard Stop because it contradicts established science.
  *   **Mitigation:** If a proposer has high-quality primary data (Phase 2 is strong) but fails Consilience, do not issue a Hard Stop. Issue a **Values-Call Flag**. Require them to fund an independent replication study (Phase 4) before acquisition.

  **Where Judgment Cannot Be Removed:**
  **Phase 5 (The Pivot).** The protocol tells you *if* the history is sound. It does not tell you *if* the myth is worth teaching.
  *   Deciding that the Atlantis myth (Pitch 1) is educationally valuable despite being historically false is a **curatorial value judgment**, not a philosophical one. You must decide if your museum's mission is "What Happened" or "What We Believe Happened." The ETP protects the former; your discretion guides the latter.
