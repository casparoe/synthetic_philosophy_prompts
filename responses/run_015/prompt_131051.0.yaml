answer: |-
  1. Conceptual analysis of the moral unit of account under density-dependent mortality is strictly upstream of empirical modeling because determining whether we measure deaths, biomass, or cohort-slots dictates which entomological parameters matter. A consensus that equilibrium biomass is the correct currency would elevate this work, while a finding that short-term suffering dominates would demote it.

  2. Philosophical and behavioral synthesis on the possibility of net-negative valence in minimal nervous systems is upstream of policy recommendation because if insect lives are net negative, habitat conservation increases total suffering rather than reducing it. Evidence that positive valence requires cognitive capacities absent in insects would move this to the top priority, whereas finding mixed valence would lower its relative urgency.

  3. Formal modeling of compensation coefficients for key taxa using existing life-history data is tractable without laboratory work and translates the conceptual unit of account into measurable intervention impacts. Finding that compensation is near-perfect for most species would sharply reduce the expected value of mortality-focused interventions, whereas low compensation would validate standard welfare metrics.

  4. Development of robustness-first decision rules that rank interventions across the space of plausible valence and replaceability models addresses the decision-structure complication by prioritizing actions that avoid catastrophic outcomes under high uncertainty. A rule that identifies no-regret interventions across all sign assumptions would validate this approach over probability refinement, while failure to find robust rules would force a return to probability estimation.

  5. Mapping of specific regulatory levers to the robust decision rules derived from the previous lines of work is downstream but essential for the terminal goal of changing institutional behavior within ten years. Identification of a high-leverage actor willing to adopt a precautionary principle would move this up, while evidence of insurmountable regulatory capture risks would lower it.
