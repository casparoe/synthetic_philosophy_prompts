      *   *Cheapest Fix:* **Modify Point 3.** Acknowledge that while it *allowed* for $\Lambda > 0$ when others expected 0, the flexibility (Point 4) severely dilutes the likelihood ratio. It's not "confirmed in the completely ordinary way" (which implies strong updating); it's "weakly supported compared to theories predicting $\Lambda=0$."
