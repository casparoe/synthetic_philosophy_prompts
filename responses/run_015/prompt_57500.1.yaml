  A one-dimensional reading is possible if we embrace branching. The photo doesn't show history being rewritten; it shows Marty's access to a branch severing. The original timeline persists; Marty merely slides onto a new trajectory. This avoids Lewis's regress problem. If hypertime allows timelines to change, what changes hypertime? Does meta-time require meta-meta-time? Lewis stops the regress by fiat, defining hypertime as the dimension of change for timelines, but it remains ontologically expensive. Branching avoids it entirely by treating alternatives as co-existing rather than successive. In this view, the fading is not erasure, but displacement.

  Yet, the film resists clean categorization. If this were pure branching, Marty shouldn't return to a single 1985; he should arrive in a divergent world while the original remains inaccessible. If it were hypertime, the 'old' 1985 should be erased completely for everyone. Instead, the film fights both readings. Marty returns to an *improved* 1985, not merely a restored one. His father is confident, his family wealthy. This isn't consistency (Novikov); it's revision. Yet Marty retains memories of the 'erased' timeline—memories nobody else shares. This breaks hypertime (which implies total replacement) and branching (which implies divergence without overwriting). Marty is a metaphysical ghost, carrying a history that no longer exists into a world that never experienced it. He is the only witness to a war that never happened.

