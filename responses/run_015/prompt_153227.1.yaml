      *   *Check:* Is the distinction between *ex ante* (prediction) and *ex post* (survival) clear? This is a major distortion. Evolution selects on actual survival. Futarchy selects on *predicted* survival/utility.
      *   *Check:* The final conclusion needs to be sharp. Don't sit on the fence. The prompt asks: "I want to know whether the untranslated residue belongs to the target framework's limitations or exposes hidden commitments in the original proposal." I need to take a stance. The stance should be that it exposes Futarchy's commitments (rationality/teleology) because evolutionary theory is fundamentally non-teleological, while governance is inherently teleological.

