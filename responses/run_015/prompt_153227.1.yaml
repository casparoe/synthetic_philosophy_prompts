answer: |-
  ### I. The Evolutionary Restatement of Futarchy

  In the evolutionary restatement, the polity is conceptualized as a **population** of organisms existing within a specific ecological niche. The governance system is not a command hierarchy but a **selection regime**.

  1.  **Policies as Phenotypic Traits:** Proposed laws and regulations are not commands but **phenotypic variations**. They are behavioral or structural expressions of the state-organism, introduced into the population as mutations.
  2.  **The Value Metric as the Fitness Function:** The citizens do not vote on traits directly. Instead, they define the **fitness function**. This is the explicit criterion by which reproductive success is measured (e.g., GDP growth, social stability, carbon reduction). This function defines the topology of the **fitness landscape**.
  3.  **Prediction Markets as Selection Environments:** The prediction market constitutes the **selective environment**. It does not merely record data; it exerts pressure. It simulates the future ecological conditions to test which phenotypic traits (policies) will maximize the fitness function.
  4.  **Traders as Selective Pressures:** Market participants act as **agents of selection**. By allocating capital to specific outcomes, they function like environmental pressures (e.g., resource scarcity, predation) that reward or penalize specific traits. Their profit motive acts as the energy gradient driving the selection process.
  5.  **Policy Adoption as Fixation:** When the market indicates a specific trait will yield higher fitness, that trait undergoes **fixation**. It spreads through the population until it becomes the universal standard (law), replacing previous variants.

  In this model, governance is an **adaptive walk** across a fitness landscape. The system does not "decide" in a cognitive sense; it iterates through variations, uses the market environment to estimate fitness differentials, and fixes the trait with the highest predicted reproductive value.

  ***

  ### II. Translation Audit

  #### 1. Clean Translations
  *   **Policy as Phenotype:** This maps cleanly. Policies are observable variations in the state's behavior, subject to variation and retention, much like biological traits.
  *   **Adoption as Fixation:** This maps cleanly. A policy moves from a rare mutation (proposal) to a universal characteristic of the population (law) through a differential success mechanism.
  *   **Market as Environment:** This maps reasonably well. Just as an environment filters organisms based on survival, the market filters policies based on predicted utility. Both serve as the external filter determining which variations persist.

  #### 2. Distorted Translations
  *   **Traders as Selective Pressures:** *Distortion:* In evolutionary dynamics, selective pressures are typically blind and mechanical (e.g., drought, temperature). Traders are cognitive, intentional agents acting on *information*. Evolution selects on *performance* (did it survive?); the market selects on *belief accuracy* (did you predict it would survive?). This shifts the mechanism from *ex post* survival to *ex ante* estimation.
  *   **Value Metric as Fitness Function:** *Distortion:* Biological fitness is intrinsic and retrospective (did the organism reproduce?). The Futarchic fitness function is extrinsic and prospective (what metric *should* we optimize?). In biology, "fitness" is a description of what happened; in Futarchy, it is a prescription of what is valued.
  *   **Variation Mechanism:** *Distortion:* Evolutionary variation is blind (mutation is random with respect to need). In Futarchy, policy proposals are intentional designs created to solve specific problems. The "mutation" is teleological, not stochastic.

  #### 3. No Evolutionary Counterpart (The Residue)
  *   **The Democratic Election of the Fitness Function:** Evolution has no mechanism to "vote" on what constitutes fitness. Fitness is defined strictly by the interaction between organism and environment. Futarchy requires a prior, normative consensus on what "good" means (the metric) before selection can begin. There is no biological equivalent to a population agreeing on the definition of reproductive success before reproduction occurs.
  *   **The Normative "Ought":** Evolutionary theory is descriptive; it explains why traits *do* fixate. Futarchy is prescriptive; it claims traits *ought* to be enacted because they are predicted to succeed. The bridge from "Market predicts X" to "We must do X" is a normative leap that evolutionary dynamics do not make.
  *   **Intentional Design of the Selection Environment:** The prediction market is a designed institution with rules, enforcement, and currency. Natural selection is an emergent property of replication, variation, and heredity, not a designed mechanism.

  ***

  ### III. Residue Report

  The untranslated residue does not indicate a limitation in evolutionary theory; rather, it exposes the **hidden teleological and rational-choice commitments of Futarchy.**

  **1. The Limitation of Evolutionary Theory vs. The Commitment of Futarchy**
  Evolutionary theory lacks normative machinery because it is a naturalistic framework describing *causation*, not *justification*. It cannot evaluate governance because governance is inherently a normative enterprise (concerned with justice, rights, and "oughts"). To expect evolutionary theory to accommodate the "democratic election of the fitness function" is to ask biology to accommodate politics.

  However, the failure of the translation reveals that Futarchy is not, as it often claims, a "scientific" or "natural" method of governance that bypasses ideology.
  *   **The Teleological Mask:** Futarchy attempts to present policy selection as a blind optimization process (like evolution). Yet, the "Vote on Values" step admits that the *goal* of the system is not survival per se, but the maximization of a specific, human-chosen metric. The residue reveals that Futarchy is not a discovery procedure for truth, but an **optimization engine for specific values**. It relies on a teleological assumption (that there is a single, definable "good" to be maximized) which evolutionary dynamics explicitly reject (fitness is context-dependent and multi-dimensional).
  *   **The Rational Choice Assumption:** The mapping of traders to selective pressures fails because traders rely on *rational expectations*. Evolution works perfectly well with irrational actors or blind forces. Futarchy collapses if traders are not rational profit-maximizers. The residue exposes that Futarchy relies on **economic rationality**, not biological selection. It requires agents to process information efficiently, a condition not required for natural selection to operate.

  **2. The Normative Gap**
  The most significant residue is the **normative "ought."** In evolution, fixation is a fact. In Futarchy, adoption is a duty.
  *   If the market predicts Policy A increases GDP but decreases liberty, and the fitness function is GDP, Futarchy says "Enact A."
  *   Evolutionary dynamics simply say "A leads to more resources."
  *   The gap is the moral authority to enforce the prediction. Evolutionary theory cannot explain why a predicted outcome *obligates* action. This indicates that Futarchy implicitly imports a **utilitarian moral framework** (maximize the metric) while trying to dress it in the neutral clothing of market mechanics.

  **Conclusion**
  The untranslated residue belongs to **Futarchy's hidden commitments**.
  Futarchy attempts to outsource the *normative* burden of governance (what should we do?) to a *descriptive* mechanism (what will happen?). The translation fails because evolutionary dynamics are godless, blind, and descriptive, whereas Futarchy is goal-oriented, intentional, and prescriptive.

  The residue reveals that Futarchy is not an alternative to democratic reasoning about values, but a **technocratic enclosure of it**. By fixing the fitness function via vote and outsourcing the rest to the "selection environment," Futarchy hides the normative weight of the fitness function itself. Evolutionary theory does not lack the machinery to evaluate governance; rather, governance cannot be reduced to evolutionary dynamics without stripping it of the very normativity that makes it governance. The residue proves that Futarchy relies on a rational-choice, teleological worldview that evolutionary biology fundamentally contradicts.
