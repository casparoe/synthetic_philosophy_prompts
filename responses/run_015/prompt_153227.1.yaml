  2.  **Drafting the Translation (Section 1):**
      *   *Concept:* Futarchy says "Vote on values, bet on beliefs."
      *   *Evolutionary Mapping:*
          *   *Value Metric (Vote on Values):* This is the "Fitness Function." In biology, fitness is reproductive success. In futarchy, it's a defined metric (e.g., GDP, happiness).
          *   *Policies:* These are "Phenotypic Traits." Variations in how the organism (state) behaves.
          *   *Prediction Markets:* These are the "Selection Environment." They test which trait yields higher fitness.
          *   *Traders:* These act as "Selective Pressures" or agents of selection. They allocate capital (energy/resources) based on anticipated fitness.
          *   *Policy Adoption:* "Fixation." The trait becomes universal in the population (the state adopts the law).
      *   *Drafting the narrative:* The polity is a population. Proposed laws are mutations/traits. The market is the environment testing these traits against the fitness function. Successful traits fixate.

  3.  **Analyzing the Translation (Section 2):**
      *   *Clean Translations:*
          *   Policy as Trait: Works well. Policies are variations in state behavior.
          *   Adoption as Fixation: Works well. A law goes from proposal to binding rule.
          *   Market as Environment: Works reasonably well. The market provides the pressure that determines success.
      *   *Distorted Translations:*
          *   Traders as Selective Pressures: In biology, pressure is often abiotic or predation, not necessarily *anticipatory*. Traders are cognitive agents; selection is usually blind.
          *   Value Metric as Fitness Function: Biological fitness is *ex post* (did it survive?). Futarchy's metric is *ex ante* (what do we predict will happen?). Also, biological fitness is intrinsic (survival/reproduction), whereas futarchy's metric is explicitly chosen (GDP, etc.).
      *   *No Counterpart (The Residue):*
          *   *Democratic Election of the Fitness Function:* Evolution has no vote on what "fitness" means. It is defined by survival. Futarchy requires a normative consensus *before* selection begins.
          *   *Normative "Ought":* Evolution describes *what is*. Futarchy prescribes *what should be done* based on predictions. The bridge from "market predicts X" to "we must do X" is normative, not descriptive.
          *   *Intentional Design:* Markets are designed institutions. Evolution is an undirected process.

  4.  **Developing the Residue Report (Section 3):**
      *   *The Core Question:* Is the residue a failure of Evo Theory or a revelation about Futarchy?
      *   *Argument A (Evo Theory Limitation):* Evolutionary theory is descriptive/naturalistic. It cannot handle "oughts" or designed goals. If we want governance, we need normativity, which evolution lacks.
      *   *Argument B (Futarchy Commitment):* Futarchy claims to be "scientific" or "objective" (like evolution), but it secretly relies on rational choice theory (traders maximize profit) and teleology (we aim for a specific good).
      *   *Synthesis:* The residue exposes Futarchy. Futarchy tries to outsource *decision-making* to a mechanism that mimics natural selection, but it cannot outsource *goal-setting*. The "Vote on Values" step is the critical non-evolutionary component. It reveals that Futarchy isn't a pure discovery procedure (like evolution); it's a goal-optimization engine.
      *   *Conclusion:* The residue belongs to Futarchy's hidden commitments. It tries to mask normative choices (what is good?) as objective functions, whereas evolution admits no such objective function other than survival. The "ought" is the biggest gap. Evolution doesn't say "fit traits *ought* to fixate," it says they *do*. Futarchy says "predicted fit policies *ought* to be enacted."

