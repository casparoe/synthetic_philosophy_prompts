prompt: |-
  I sit on the clinical ethics committee of a 600-bed teaching hospital, and we are jointly reviewing a proposal with our new clinical-AI oversight subcommittee. The vendor, Meridian, wants to pilot a system that generates what it calls an extrapolated preference report for patients who lack decision-making capacity and have no available surrogate or advance directive — the "unbefriended" patients, which is a real and growing category on our wards. The system is trained on a patient's own prior digital traces (messages, calendar entries, purchase history, portal messages, clinic notes) together with a population prior, and it runs in either of two modes. In conservative mode it only fills in missing information and discounts statements made under acute pain, delirium, sedation, or untreated depression — the patient's underlying evaluative standards are held fixed. In revisionary mode it also revises those standards themselves, on the theory that a person better informed and more experienced would not merely apply her current values to better facts but would come to have different ones. The vendor's own validation study compared system output against wishes later stated by patients who regained capacity, and reports 71% agreement overall, with disagreements clustering heavily in end-of-life decisions — precisely where the reports would matter most. Our index case is a 74-year-old woman, Mrs. Halvorsen, three weeks post-stroke, no surrogate, no directive, whose retrievable traces contain a decade of repeated statements that she would never want to be a burden and would rather die than live in a nursing home, alongside a two-year stretch of severe, untreated depressive episodes in which many of those statements were made.

  What has split our committee is not the familiarsubstituted-judgment question but what happens when substituted judgment runs out. I want the memo to take up three things specifically. First, the anchoring problem: at what point does an idealized version of Mrs. Halvorsen stop being a version of her at all, and is there a principled stopping rule or only a stipulation the vendor has baked into a parameter? Second, order sensitivity: on the one test case we ran, revising her aversion to being a burden before revising her fatalism about her prognosis yielded a recommendation for continued aggressive treatment, while reversing the order yielded a comfort-focused plan. If the endpoint of extrapolation depends on the sequence of revisions, then a single confident recommendation misrepresents the actual output of the procedure, and I want your view on whether that is a defect in this system or a feature of the idealization idea itself. Third, what I think of as the ventriloquism failure mode: whatever the procedure's theoretical standing, a confident paragraph in the chart will displace clinical judgment and family deliberation rather than inform it, and we should ask whether our safeguards can realistically prevent that.

  Please draft the memo I will circulate before our joint meeting two weeks from Thursday. It should be about 900 to 1,200 words, open with a clear recommendation — authorize the pilot, authorize in conservative mode only, or decline — and then give the reasons in a form the vendor and the clinical leads could actually respond to, including any conditions with dates attached (for instance, what the system would have to demonstrate about path-independence or about how it handles statements made during depression, and by when). It should also give the strongest consideration on the losing side its full weight rather than disposing of it in a sentence, and it should close by naming what evidence or result would most change your recommendation. Please do not spend the memo restating that substituted judgment is our legal standard; assume we know that, and tell us what to do in the cases where there is no one left to substitute.
reasoning: |-
  Here's a thinking process that leads to the memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a 600-bed teaching hospital.
      *   **Audience:** Joint review with the new Clinical-AI Oversight Subcommittee.
      *   **Subject:** Proposal by vendor "Meridian" to pilot an AI system for "unbefriended" patients (no capacity, no surrogate, no directive).
      *   **System:** Generates "extrapolated preference reports" based on digital traces + population priors. Two modes: Conservative (fills info, fixes values) vs. Revisionary (revises values based on "better informed/experienced" theory).
      *   **Validation:** 71% agreement with regained capacity patients, but disagreements cluster in end-of-life (EOL) decisions.
      *   **Index Case:** Mrs. Halvorsen (74, post-stroke, unbefriended). Traces show "rather die than nursing home" statements, but many made during severe, untreated depression.
      *   **Key Issues to Address:**
          1.  *Anchoring Problem:* When does idealization stop being the patient? Is there a principled stopping rule?
          2.  *Order Sensitivity:* Sequence of revisions changes outcomes (aggressive vs. comfort). Is this a defect or a feature?
          3.  *Ventriloquism Failure Mode:* Will the AI report displace clinical judgment/deliberation?
      *   **Format:** Memo.
      *   **Length:** 900 - 1,200 words.
      *   **Structure:**
          *   Clear recommendation at the start (Authorize, Conservative Only, or Decline).
          *   Reasons responsive to vendor/clinical leads.
          *   Conditions with dates/deadlines.
          *   Strong consideration of the opposing view.
          *   Closing: Evidence/result that would change the recommendation.
          *   *Constraint:* Do not rehash substituted judgment law; focus on the gap where it runs out.

  2.  **Determine the Recommendation:**
      *   *Option A (Authorize):* Too risky given the EOL disagreement rate and order sensitivity.
      *   *Option B (Decline):* Ethically sound, but might stall innovation needed for a vulnerable population.
      *   *Option C (Authorize in Conservative Mode Only):* This seems the most balanced. It acknowledges the need (unbefriended patients) but mitigates the highest risks (revisionary values, order sensitivity).
      *   *Decision:* **Authorize in Conservative Mode Only, with strict conditions.** This allows data collection without committing to the ethically fraught "revisionary" mode.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening/Recommendation:** State clearly: Pilot approved *only* in Conservative Mode. Revisionary Mode is paused.
      *   **Context:** Briefly acknowledge the plight of unbefriended patients (Mrs. Halvorsen) to show empathy and necessity.
      *   **Issue 1: Anchoring (The "Self" Problem):**
          *   Critique the Revisionary Mode. Who defines "better informed"?
          *   The "stopping rule" is currently a vendor parameter, not an ethical principle.
          *   Condition: Vendor must define the boundary of "self" mathematically/ethically by a specific date.
      *   **Issue 2: Order Sensitivity (Path Dependence):**
          *   This is a technical/ethical flaw. If A->B != B->A, the output isn't stable.
          *   It misrepresents certainty.
          *   Condition: System must report confidence intervals based on permutation or demonstrate path-independence by a specific date.
      *   **Issue 3: Ventriloquism (Clinical Displacement):**
          *   The report looks authoritative. It might stop discussion.
          *   Safeguard: The report must be labeled "Hypothetical" and require a human sign-off that explicitly overrides or confirms it.
      *   **Opposing View (The "Losing Side"):**
          *   Argument for Revisionary Mode/Full Pilot: The status quo for unbefriended patients is abysmal (default to aggressive treatment or pure best interest which ignores values). 71% is better than random. We have a duty to try to find their *true* voice, not just their past words.
          *   Give this weight: Acknowledge that "Conservative" might lock in depression-induced values too.
      *   **Closing/Changing Evidence:**
          *   What would change my mind? If Revisionary Mode shows higher accuracy in EOL specifically, or if Order Sensitivity is resolved.
      *   **Word Count Check:** Need to ensure it lands between 900-1,200.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Tone:* Professional, ethically rigorous, but actionable. Not academic musing, but committee guidance.
      *   *Constraint Check:* Did I talk too much about substituted judgment law? *Correction:* Keep it focused on the *gap* where there is no surrogate.
      *   *Specifics:* Ensure the "dates" are realistic (e.g., before full rollout, or mid-pilot review). Let's set a mid-pilot review date.
      *   *Mrs. Halvorsen:* Use her case to illustrate the depression/anchoring point.
      *   *Order Sensitivity:* Make sure to explain *why* this matters (it implies arbitrariness).
      *   *Ventriloquism:* Focus on the UI/Chart presentation.

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Start:* To: CEC & AI Oversight. From: [My Name]. Rec: Conservative Only.
      *   *Body:* The unbefriended problem is real. Meridian offers help. But Revisionary is too speculative.
      *   *Anchoring:* If we revise values, whose values are they? Mrs. H's depression statements. Conservative mode discounts acute states, but what about chronic untreated depression? Vendor needs to clarify how they weight mental health history.
      *   *Order:* If the algorithm gives different answers based on calculation order, it's not finding a truth, it's generating a narrative. This needs transparency.
      *   *Ventriloquism:* Doctors will trust the box. We need to force them to think.
      *   *Counter-argument:* Doing nothing is also a decision. Default full code is violent. We need *some* extrapolation.
      *   *Conclusion:* Show me EOL specific accuracy and path stability.

  6.  **Final Review against Constraints:**
      *   Word count? (Aim for ~1000).
      *   Recommendation clear? (Yes).
      *   Three specific points addressed? (Anchoring, Order, Ventriloquism).
      *   Dates/Conditions included? (Yes).
      *   Opposing view respected? (Yes).
      *   Closing evidence specified? (Yes).

  7.  **Final Polish:** Check flow and tone. Ensure "Meridian" is addressed respectfully but firmly. (Proceeding to generate output).

  *(Self-Correction on Word Count during drafting)*: I need to make sure I don't be too terse. I need to expand on the ethical implications of the "Order Sensitivity" to ensure I hit the lower bound without fluff. I will elaborate on why path dependence undermines the claim of "discovering" preferences. I also need to make sure the "Opposing View" gets a solid paragraph, not just a footnote.

  *(Self-Correction on Dates)*: The prompt says the meeting is "two weeks from Thursday." The memo is *before* that meeting. So the conditions should be for the *pilot design* or *future milestones*. I will set conditions for the pilot launch (immediate) and a review milestone (e.g., 6 months).

  *(Refining the Recommendation)*: "Authorize in Conservative Mode Only" is the strongest ethical position given the 71% stat and the EOL clustering of errors.

  *(Refining the "Ventriloquism" point)*: Suggest specific UI changes. "Advisory Only" watermarks.

