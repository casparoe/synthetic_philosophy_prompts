  **MEMORANDUM**

  **TO:** University Research Integrity Committee
  **FROM:** Appeals Panel Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Admissibility of Complaint Filed by Dr. Elena Vasquez

  **1. Recommendation**
  The Appeals Panel recommends that the University **hear the formal misconduct complaint** filed by Dr. Elena Vasquez regarding the alleged fabrication of survey responses by a junior colleague. We recommend initiating a preliminary inquiry immediately. This decision is not an endorsement of Dr. Vasquez's past conduct, but a affirmation that the integrity of the scientific record must be investigated independently of the messenger's history.

  **2. Context and Conflict**
  Dr. Vasquez alleges data fabrication in a recent publication. However, Dr. Vasquez has documented minor data-retention violations regarding studies over ten years old (failure to archive raw field notes), though no prior falsification. A subset of the Panel argues that Dr. Vasquez lacks standing due to these prior violations ("unclean hands"), suggesting her complaint should be dismissed to maintain institutional consistency. Others argue that dismissing the complaint risks shielding actual misconduct.

  **3. Analysis of the "Unclean Hands" Objection**
  The Panel has engaged deeply with the argument that Dr. Vasquez's prior violations structurally disqualify her from invoking institutional blame. We recognize this is not merely an *ad hominem* attack but a claim about institutional coherence: an institution cannot credibly enforce rules against those who do not embody them.

  However, we reject the application of "unclean hands" as a bar to *admissibility* in this context for three structural reasons:

  *   **Distinct Regulatory Domains:** Dr. Vasquez's prior violations concern data retention (administrative compliance), whereas the current allegation concerns fabrication (epistemic integrity). While both are serious, conflating archival negligence with data fabrication creates a false equivalence that dilutes the severity of falsification.
  *   **The "Perfect Witness" Hazard:** Establishing a precedent where only researchers with flawless compliance records may report misconduct creates a "perfect witness" rule. This incentivizes silence among those with minor past infractions, effectively granting impunity to bad actors who can shield themselves by pointing to the imperfections of their accusers.
  *   **Institutional vs. Personal Standing:** In research integrity proceedings, the complainant does not sue for personal damages but triggers an institutional duty to protect the scientific record. The "standing" belongs to the University and the public trust, not solely to Dr. Vasquez. Therefore, her personal record affects the *weight* of her testimony during investigation, not the *right* to initiate the inquiry.

  **4. Course of Action and Time Frame**
  To balance the need for investigation with the legitimate concerns regarding Dr. Vasquez's compliance history, the Panel mandates the following:

  *   **Action:** The Office of Research Integrity shall open a preliminary inquiry into the allegation of fabrication.
  *   **Condition:** Dr. Vasquez's prior retention violations will be entered into the case file as context for credibility assessment but will not be cited as grounds for dismissal. Simultaneously, Compliance Office staff will verify that Dr. Vasquez's *current* data retention practices (for the study in question) meet current standards.
  *   **Time Frame:** The preliminary inquiry must commence within **10 business days** of this memo's issuance. A report on whether sufficient evidence exists to warrant a full investigation must be submitted to the Panel within **60 days**.

  **5. Conclusion**
  Dismissing this complaint based on the complainant's history would prioritize procedural symmetry over substantive truth. We must tolerate the discomfort of an imperfect whistleblower to ensure that fabrication does not go unexamined. The integrity of the record is the paramount principle.

