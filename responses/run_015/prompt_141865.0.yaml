answer: |-
  This is a classic philosophical stalemate, but your diagnosis that it is "half verbal" is only partially correct. It is better described as a **category error masquerading as a semantic dispute**. The parties aren't just using the word "standing" to mean different things; they are operating with incompatible metaphysical models of what blame *is*, and they are using "standing" as a proxy to fight that deeper war.

  Here is the pressure test on your theory, followed by a diagnosis of the stalemate and a concrete proposal for progress.

  ### 1. Pressure-Testing Your "Verbal" Hypothesis

  You suggest the debate is verbal because "standing" conflates normative power, moral wrongness, epistemic position, and success conditions. While true, this doesn't fully explain the inertia. If it were purely verbal, defining terms should dissolve the disagreement. The fact that it doesn't suggests the definitions track **deep commitments about the structure of morality**.

  *   **The Juridical Model (Your Lawyer Friend/Camp 1):** This camp treats morality like a legal system. Blame is a *sanction* or a *demand*. In law, standing is a threshold condition regarding jurisdiction. If you lack standing, the court doesn't hear the case; it doesn't matter if the defendant is guilty. This model explains why the "Paid-Up Hypocrite" regains standing: they have satisfied the conditions of jurisdiction (restored status).
  *   **The Evaluative Model (Camp 2):** This camp treats blame as a *response to value*. Blame is like fear or admiration; it is fitting or unfitting based on its object. On this view, "standing" is a category mistake. A hypocrite's fear isn't "infelicitous"; it's just cowardly. Their blame isn't "void"; it's accurate but viciously expressed.
  *   **The Skeptic Model (Camp 3):** This camp sees "standing" as a reification of a cluster of distinct moral complaints.

  **The Verbal Trap:** The stalemate persists because the Juridical camp hears the Evaluative camp saying "The blame is valid but rude," and thinks, "No, the blame is *ultra vires*." The Evaluative camp hears the Juridical camp saying "The blame is void," and thinks, "No, the blame is *true* but the blamer is nasty." They are talking past each other because one is analyzing the *act's authority* and the other is analyzing the *act's accuracy*.

  ### 2. Analyzing Your Test Cases

  Your test cases are excellent, but they reveal more than you think. They don't just point to "unfair advantage"; they point to the **relational nature of authority**.

  **Case 1: Private Blame (The Internal Resentment)**
  *   **Your Intuition:** The defect remains.
  *   **Implication:** This kills the pure Speech-Act/Felicity view (e.g., early Wallace). If blame were purely a communicative demand, private blame would be immune to standing objections because there is no addressee to wrong.
  *   **The Deeper Lesson:** If private hypocritical blame is defective, then "standing" attaches to the **attitude itself**, not just its expression. This suggests blame is inherently relational even when silent. The hypocrite, in their own mind, asserts a superiority they do not possess. The "standing" failure is a failure of *self-conception* relative to the moral community. It supports the view that blame is a claim to **moral status**, not just a message.

  **Case 2: The Paid-Up Hypocrite (Redemption)**
  *   **Your Intuition:** The objection vanishes.
  *   **Implication:** This is the smoking gun against the "Logical Incoherence" view. If the problem were that the hypocrite's demand logically commits them to a standard they reject, redemption wouldn't fix it. The past act remains.
  *   **The Deeper Lesson:** The fact that redemption fixes it proves the defect is **status-based**, not logic-based. It confirms the Juridical Model's intuition that standing is a *forfeitable and recoverable right*. This strongly suggests the core phenomenon is about **fairness in the distribution of moral authority**, not the logical consistency of the demand.

  ### 3. The Diagnosis: It's About Authority, Not Semantics

  The stalemate is not merely verbal; it is **structural**. The disagreement is about whether moral responsibility is **horizontal** (peer-to-peer) or **vertical** (judge-to-defendant).

  *   **If Blame is Vertical:** It requires authority. Hypocrisy undermines authority. Therefore, the hypocrite lacks standing (Camp 1).
  *   **If Blame is Horizontal:** It is a shared recognition of values. Hypocrisy makes the recognition insincere. Therefore, the blaming is vicious but not void (Camp 2).

  The Skeptics (Camp 3) are technically right that "standing" is a grab-bag, but they are wrong that it picks out nothing. It picks out the **non-consequentialist constraint on enforcement**. The reason you can't move the needle is that you are arguing about whether this constraint exists *inside* the concept of blame or *outside* it as a separate moral rule.

  **The Hidden Empirical Question:**
  You asked if empirical work could settle this. Not directly. You cannot survey people on "metaphysical standing." However, you can survey the **pragmatic uptake** of blame.
  *   *Question:* "When a known hypocrite blames you, do you feel the blame is *incorrect* (false), or do you feel you are *not obliged to listen*?"
  *   *Hypothesis:* If people feel "not obliged to listen" even when they admit they did the wrong thing, that supports the Standing/Authority view. If they feel the blame is "correct but annoying," that supports the Evaluative view.

  ### 4. How to Make Progress

  You will not solve this by defining "standing." You will solve it by changing the question from "Is the blame valid?" to "What is the function of the objection?"

  **Step 1: Reframe the Dispute as "Waiver vs. Defeat"**
  Ask your group to agree on this distinction:
  *   **Defeat:** The hypocrite's blame provides the *target* with a justification to disregard the content of the blame. (The target is off the hook).
  *   **Waiver:** The hypocrite's blame is accurate, but the *blamer* has waived their right to enforce it. (The target is still on the hook, but this person can't collect).

  Camp 1 (Standing) argues for **Defeat** (or at least strong Waiver). Camp 2 (Wrongful Blaming) argues for **No Waiver** (you still owe the apology, just not to *them*).
  *   *Test:* In the Paid-Up Hypocrite case, does the target still owe an apology? If yes, then standing was just a personal right (Waiver). If no, then standing was constitutive of the obligation (Defeat).
  *   *Prediction:* Your intuition on the Paid-Up case suggests Waiver. The fact that the objection *vanishes* suggests the target is now fully liable to blame. This implies the "standing" objection was never about the *truth* of the blame, but about the *relationship*.

  **Step 2: Leverage the Lawyer (The "Clean Hands" Doctrine)**
  Your lawyer friend is sitting on a conceptual goldmine they aren't using. In equity law, "clean hands" doesn't mean the plaintiff is right or wrong about the law; it means the court won't aid them because of their conduct.
  *   *Reframing:* Ask the group: "Is the standing objection a claim about the **law** (the moral norm) or the **equity** (the enforcement)?"
  *   If it's Equity: The hypocrite's blame is accurate, but the moral community won't enforce it through *them*. This dissolves the Camp 2 objection (the blame isn't false) while preserving the Camp 1 intuition (the blame is normatively inert).
  *   This moves the debate from "What is blame?" to "Who is the moral community authorized to deputize?"

  **Step 3: The "Third-Party" Test Case**
  Run this case to break the Skeptics:
  *   *Scenario:* A hypocrite (H) blames a Wrongdoer (W). A Third Party (T) observes this. T knows H is a hypocrite. T knows W is guilty.
  *   *Question:* Does T have a reason to intervene and stop H from blaming W?
  *   *If Yes:* Then there is a distinct normative reason generated by the hypocrisy that isn't just "H is being vicious." It's that H's action is *normatively disruptive* to the community. This supports the Standing view (it's a structural defect).
  *   *If No:* Then it's just H being annoying. This supports the Skeptic/Wrongful Blaming view.

  ### Summary Recommendation

  The debate is stuck because "standing" is being used to do two jobs: describing the **nature of blame** and regulating the **conduct of blamers**.

  **To move forward:**
  1.  **Concede the Verbal Point:** Agree that "standing" is a cluster concept.
  2.  **Isolate the Core:** Argue that the *distinctive* contribution of the standing debate is the **Waiver/Defeat** distinction.
  3.  **Use the Paid-Up Case:** Use the fact that redemption restores standing to prove that the defect is **relational status**, not logical incoherence.
  4.  **New Question:** Stop asking "Can the hypocrite blame?" Start asking **"Does the hypocrite's blame generate an obligation for the target to respond?"**

  If the target has no obligation to respond to a hypocrite (but does to a redeemed blamer), then "standing" names a real phenomenon: the **conditional nature of moral liability to specific agents**. That is a substantive claim, not a verbal one, and it is testable via your group's intuitions on the obligation to respond.
