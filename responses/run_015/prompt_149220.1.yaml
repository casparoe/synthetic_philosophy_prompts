  **The Efficiency Trap: Why Bureaucratic Friction Ensures Honest Signalling**

  **By Dr. Julian Merriweather**
  *Senior Fellow, Center for Institutional Stability*

  Critics of the Benefits Agency often point to the six-hour queues, the requirement to submit physical copies of digital documents, and the 6:00 a.m. appointment slots as evidence of incompetence. They call for streamlining. They are wrong. To an evolutionary biologist, these inefficiencies look less like bugs and more like a robust Handicap Principle mechanism. We are not managing a welfare system; we are maintaining a signalling equilibrium.

  In animal signalling theory, a signal is only honest if it is costly. Consider the gazelle stotting before a cheetah. It wastes energy to demonstrate fitness. If the signal were cheap, any weak gazelle could fake it. The cost enforces the truth. In public policy, the benefit is the resource, and the applicant is the signaller. The "ordeals"—the waiting, the paperwork, the travel—act as the handicap. 

  For this system to function as an Evolutionary Stable Strategy, the cost must be *differentially* distributed. It cannot simply be high; it must be lower for the genuinely needy than for the opportunistic. What does the desperately needy individual value least? Often, it is time and dignity. They have no employment to miss, no high-value meetings to attend. The opportunity cost of waiting four hours in a fluorescent-lit hallway is negligible compared to the value of the subsidy. For the non-needy—the fraudster who could be working—the same four hours represents lost wages and high opportunity cost. The ordeal filters out the cheating strategy not by detecting lies, but by making lying too expensive to sustain. The waste is the feature.

  However, we face a new evolutionary pressure: Generative AI. Large language models have collapsed the cognitive cost of form-filling. An applicant can now generate perfect appeal letters and navigate complex eligibility criteria in seconds. This lowers the signal cost for everyone, but disproportionately for the cheater, who lacks the intrinsic motivation of the needy. We are seeing a surge in high-quality applications that lack genuine need. The signalling equilibrium is collapsing.

  We must escalate the handicap. We propose replacing cognitive ordeals with physical ones that AI cannot simulate. We are piloting a program where final verification requires standing in a non-digitized queue for a random duration, without seating, to collect a token. An AI can fill a PDF; it cannot stand on concrete for three hours. This restores the differential cost. The truly needy will endure the physical discomfort because the marginal utility of the benefit outweighs the pain. The opportunistic will not.

  Efficiency consultants will argue this destroys value. They misunderstand the objective. The goal is not maximal uptake; it is maximal targeting accuracy. Early data from the pilot regions is promising. Since implementing the physical token protocol, total claims have fallen by exactly two-thirds. 

  Critics call this a humanitarian crisis. I call it a successful separation of types. The reduction in claims proves the previous friction was too low to deter low-intensity signalers. By raising the handicap, we have ensured that only those for whom the benefit is truly vital remain in the pool. We have restored honesty to the system. Let the claims fall. It means the signal is working.

  ***

  **About the Author:** *Dr. Julian Merriweather is a Senior Fellow at the Center for Institutional Stability. He holds a Ph.D. in Evolutionary Game Theory and advises several governments on incentive compatibility.*
