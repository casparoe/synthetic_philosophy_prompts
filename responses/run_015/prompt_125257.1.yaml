      *   *Structure:*
          1.  Validate the intuition (it's a smart observation).
          2.  Pinpoint the conflation (Levels of analysis: Base vs. Conditions).
          3.  Address the Mask issue (Intrinsic vs. Extrinsic).
          4.  Address the Fink issue (Temporal stability of the base).
          5.  Explain why "Multi-track" doesn't solve the metaphysical problem (Explanatory power).
