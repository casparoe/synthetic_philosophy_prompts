      *   *Drafting Section 1 (Validation):* Start by acknowledging this is a sharp insight. It's basically the "Revised Conditional Analysis" move that philosophers like Lewis considered.
      *   *Drafting Section 2 (The Mask Problem):* Focus on Intrinsicness. Dispositions are supposed to be about *the object*. If I wrap it in foil, the *object* hasn't changed. If I redefine the disposition to include "not wrapped," now the disposition depends on the foil. That makes the property extrinsic. That's a big metaphysical cost.
      *   *Drafting Section 3 (The Fink Problem):* Focus on the Categorical Base. A fink changes the microstructure *at the moment of striking*. A multi-track description implies the object *has* both tracks simultaneously. But in a fink case, the object *loses* the power to burn at $t_1$. It doesn't have a track for "inert"; the base itself vanishes.
