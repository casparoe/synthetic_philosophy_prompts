      *   *Critical Point:* The impossibility theorem assumes $Y$ is the truth. If $Y$ is biased, Calibration calibrates to bias. Equalized Odds distributes the bias-induced errors differently. The theorem doesn't know $Y$ is biased; it just sees $P(Y|A) \neq P(Y)$.
      *   *Conclusion:* The theorem is a mirror. It reflects the inequality in the data back as a mathematical constraint.

  9.  **Final Review against constraints:**
      *   No literature survey.
      *   Disciplined mapping.
      *   Address the four specific bullet points.
      *   Honest about where the framework is forced.

      *(Self-Correction)*: Ensure I don't get bogged down in the specific percentages of the ProPublica report. Focus on the structural logic. Ensure the distinction between "Compatibility requires equal base rates" and "Equal base rates are politically loaded" is sharp.

  10. **Final Polish:** Check tone. Needs to be analytical, not opinionated, but critical of the formalism's limits. (Proceed to generate output).

      *Structure:*
      1.  **Formal Mapping:** Define variables and criteria.
      2.  **The Endogeneity Break:** How $Y$ construction breaks the exogenous assumption.
      3.  **Diagnosis of the Stall:** Incompatibility vs. Normative divergence.
      4.  **Theory's Limits:** Explanation vs. Prescription.
      5.  **Meta-Analysis:** What this says about the theorems themselves.

      *Key Insight to weave in:* The impossibility theorem is often read as "You can't have fairness." It should be read as "You can't have these specific mathematical definitions of fairness simultaneously when the world is unequal." The COMPAS case shows the "unequal world" part is institutional, not natural.

