      *   *Impossibility Theorem:* You cannot have Calibration ($P(Y=1|S=s, A=a) = P(Y=1|S=s)$) + Equalized Odds (Equal FPR and FNR across $A$) unless $P(Y=1|A=0) = P(Y=1|A=1)$ (equal base rates) or prediction is perfect.

  3.  **Analyzing the "Label Endogeneity" Twist:**
