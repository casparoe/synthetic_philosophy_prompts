      *   The stall wasn't just math; it was about whether $Y$ is the right target. The impossibility theorem treats $Y$ as exogenous. If $Y$ is contested, the theorem describes a tension between *accepting the status quo* (Calibration) and *equalizing error burden* (Equalized Odds), but it cannot adjudicate which is morally correct.

  6.  **Drafting Section 3: Theory's Explanatory Power vs. Silence:**
      *   *Explains:* Why both can be right mathematically. It clarifies the trade-off space. It shows that "fixing" one metric breaks the other.
      *   *Silent:* It offers no guidance on *which* metric to sacrifice. It treats the base rate difference as a parameter, not a policy variable. It cannot tell us if we should prioritize not locking up innocent Black people (FPR) vs. ensuring a score of 7 means the same risk for everyone (Calibration).

