      *   COMPAS Reality: $Y$ (re-arrest) is a function of underlying behavior ($Y^*$) + Policing/Charging bias ($B$).
      *   Implication: The "Base Rate" ($P(Y=1|A)$) is not a natural fact but an institutional product.
      *   Consequence for Impossibility: The condition for compatibility (equal base rates) is not just statistically unlikely; it is politically contested. If $Y$ is biased, satisfying Calibration means calibrating to bias. Satisfying Equalized Odds might mean correcting for bias (or introducing new bias relative to $Y$).

  4.  **Drafting Section 1: Criteria and Impossibility:**
