  This rule posits that the historian grants "actor" status to climate forces only when they explain *societal stress, collapse, or synchronous disruption*, where human agency is overwhelmed. She denies actor status when the narrative concerns *foundational human innovations, adaptations, or transitions* (e.g., migration, agriculture), as crediting the environment in these cases risks "environmental determinism" and obscures human strategic choice.
