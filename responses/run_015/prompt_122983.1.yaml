answer: |-
  Here is the specification sheet for a physically grudgingly-acceptable Maxwell's Demon. It is designed to function as a debugging tool for your plot: if a scene violates a non-negotiable, the device is a perpetuum mobile. If it violates a tribal preference, the argument is merely academic. If it hits the incompatibility, you have your crisis.

  ### The Desiderata of Demonics

  **1. The Global Ledger (Non-Negotiable)**
  *   **Requirement:** The total entropy of the closed system (Gas + Demon + Environment) must never decrease on average.
  *   **The Case:** This is the Second Law. It handles the **Cold Brain** and **Free Thermalization** cases. If the demon's memory is wiped by the environment thermalizing its bits, that thermalization *is* the heat dissipation. The entropy isn't vanished; it's just moved from the memory register to the thermal bath. If your character claims the wipe was "free" because she didn't actively power it, the ledger shows the heat dumped into the room.
  *   **Verdict:** Break this, and it isn't physics; it's magic.

  **2. Information-Entropy Equivalence (Non-Negotiable)**
  *   **Requirement:** Information stored in a physical substrate must carry an entropic weight equivalent to its Shannon/Von Neumann entropy.
  *   **The Case:** This handles the **Never-Eraser**. If she keeps every measurement forever, the entropy of the universe isn't violating the Second Law, but the *demon's memory* is filling up with entropy. Eventually, the memory saturates. To continue operating, she must either expand the memory (costing work to build) or erase it (costing heat). A demon with infinite memory is just a black hole waiting to happen.
  *   **Verdict:** Break this, and information becomes magic, not physics.

  **3. Correlation as Fuel (Non-Negotiable)**
  *   **Requirement:** Work can be extracted from pre-existing correlations without measurement cost, but the correlation is consumed in the process.
  *   **The Case:** This handles the **Blind Demon**. If the demon exploits a correlation already present (e.g., a ratchet mechanism or entangled pair), it doesn't pay a measurement cost. However, the act of extracting work destroys the correlation (mutual information drops to zero). The "fuel" was the order that already existed, not the intelligence of the demon. Once the correlation is used, the system equilibrates.
  *   **Verdict:** Break this, and you violate conservation of energy/information.

  **4. The Cyclic Reset Condition (Non-Negotiable)**
  *   **Requirement:** To operate as an *engine* (continuous work), the demon must return to its initial state at the end of every cycle.
  *   **The Case:** This is the **Big Killer** (see below). It handles the **Lazy Door**. Even if opening the gate is frictionless and conditional (reversible logic), the demon must eventually clear its record of *which* particles passed to be ready for the next batch. If it doesn't reset, it's not an engine; it's a one-time battery.
  *   **Verdict:** Break this, and you have a battery, not a motor.

  **5. Fluctuation Tolerance (Preference/Tribal)**
  *   **Requirement:** The theory must distinguish between average behavior (ensembles) and single trajectories (one-shot).
  *   **The Case:** This handles the **One-Shot**. In a single run, a demon *can* extract work without paying the full $kT \ln 2$ cost, purely by luck (thermal fluctuation). Fluctuation Theorems (Jarzynski, Crooks) quantify the probability of these "violations." A robust theory must allow for lucky single runs but enforce the tax on the average.
  *   **Verdict:** Tribal. Classical thermo ignores single runs; Stochastic thermo demands them.

  **6. Boundary Invariance (Preference/Tribal)**
  *   **Requirement:** The physical predictions should not depend on where the observer draws the line between "Demon," "System," and "Bath," even if the accounting changes.
  *   **The Case:** This handles the **Structural Boundary** issue. If you draw the boundary around the demon's brain, the cost looks like heat dissipation. If you draw it around the gas, the cost looks like information storage. The net result (work extracted vs. heat dumped) must remain invariant.
  *   **Verdict:** Tribal. Some interpretations (QBism, certain agent-based models) lean heavily on the cut; standard stat-mech insists it shouldn't matter.

  **7. Finite-Time Dissipation (Non-Negotiable)**
  *   **Requirement:** Any process occurring in finite time must dissipate energy above the reversible minimum.
  *   **The Case:** This handles **Finite Time/Power**. Reversible processes (the ideal $kT \ln 2$ limit) require infinite slowness. To get work *now* (power), you must drive the system out of equilibrium, creating excess entropy.
  *   **Verdict:** Break this, and you have a frictionless engine that runs at speed.

  ---

  ### The Classification

  **Non-Negotiable (The Hard Floor)**
  *   Global Ledger (1)
  *   Info-Entropy Equivalence (2)
  *   Correlation as Fuel (3)
  *   Cyclic Reset Condition (4)
  *   Finite-Time Dissipation (7)

  **Tribal (The Academic Wars)**
  *   Fluctuation Tolerance (5): *Ensemble vs. Trajectory.* Does the law hold for every run, or only the average?
  *   Boundary Invariance (6): *Cut vs. Whole.* Does the "agent" status of the demon change the physics?
  *   *Measurement vs. Erasure:* (Not listed above as it's resolved). Modern consensus (Bennett) says measurement can be reversible; erasure is the cost. Insisting measurement *must* cost energy is the Szilard view (largely deprecated but narratively useful).

  ---

  ### The Big Killer: The Cyclic Reset Condition (Req 4)

  This requirement kills the largest number of would-be working demons.
  Most fictional demons (and early physical models) focus on the *sorting* mechanism. They show a door opening for fast molecules and closing for slow ones. They assume that because the door movement is frictionless (**Lazy Door**), the process is free.
  **The Trap:** The door mechanism itself must eventually be reset. The latch must be un-latched. The sensor must be un-triggered. If the demon remembers which door it opened, that memory must be cleared to open the next door. If the memory is not cleared, the device stops working once memory is full (**Never-Eraser**). If the memory *is* cleared, Landauer's Principle applies, and the heat generated equals or exceeds the work gained.
  **Narrative Utility:** Your protagonist can build a demon that works *once*. She cannot build one that runs continuously without an external power source to wipe the slate.

  ---

  ### The Act III Conflict: Finite-Time Dissipation vs. Reversible Minimum

  Here is the pair of requirements that create the tension for your climax.

  **The Conflict:** **Requirement 7 (Finite-Time Dissipation)** vs. **Requirement 4 (Cyclic Reset / Reversibility).**

  *   **The Physics:** The theoretical minimum cost to erase a bit is $kT \ln 2$. This cost is only achievable if the erasure is performed *reversibly* (infinitely slowly). If your character needs the demon to produce power (work per unit time), she must operate the cycle faster.
  *   **The Consequence:** As speed increases, dissipation increases non-linearly. The faster she tries to extract work, the more heat the demon generates, until the heat load overwhelms the cooling (the **Cold Brain** becomes a hot brain), and the demon fails.
  *   **The Plot Hook:** She has a working demon. It produces free energy. But it produces it *too slowly* to save the station/ship/city. To scale it up, she must push the cycle rate. The theory predicts that at the required throughput, the dissipation will exceed the gain.
  *   **The Break:** To solve this, she must break **Requirement 7**. She needs a way to erase bits fast without heat. This implies finding a physical substrate that doesn't couple to the thermal bath during the reset phase, or exploiting a **One-Shot (Req 5)** fluctuation on a macroscopic scale (statistically impossible, but maybe the "demon" isn't statistical).
  *   **Alternative Break:** She exploits **Req 3 (Correlation)** instead of **Req 4 (Reset)**. She finds a source of pre-existing, infinite correlation (a vacuum state, a quantum field) that doesn't require resetting because it's naturally replenished. This shifts the genre from "Thermodynamic Engine" to "Vacuum Energy Tap."

  ---

  ### Theory Leaderboard (Brief)

  *   **Szilard (Measurement Cost):** *Fails the Lazy Door.* Assumes looking costs energy. Good for stories where "observation" is the magic, bad for hard physics.
  *   **Landauer/Bennett (Erasure Cost):** *Passes most, kills the Never-Eraser.* The current gold standard. Handles the memory growth and thermalization cases perfectly. It says: "You can look for free, but you must forget to continue."
  *   **Fluctuation Theorems (Jarzynski/Crooks):** *Passes the One-Shot.* Refines Landauer by showing the cost is an average, not a hard floor per single bit. Allows for "lucky" runs where the demon wins, provided it loses later.
  *   **Quantum Discord/Correlation:** *Passes the Blind Demon.* Focuses on quantum correlations as the fuel. Useful if your demon is exploiting entanglement rather than classical pressure.

  ### Summary for the Novelist

  If you want the physicist to nod:
  1.  Let the demon work **once** (One-Shot/Fluctuation).
  2.  Let the demon work **slowly** (Reversible/Minimum Cost).
  3.  Let the demon **fill its memory** (Never-Eraser/Entropy Storage).

  If you want the demon to run a city:
  You must break the **Finite-Time Dissipation** limit. You need a mechanism that decouples the information processing from the thermal bath during the reset phase. That is your "unobtainium."
