  Nothing is grounded in itself at all.
  We seek a base where reasons hit the ground.
  Nothing forces the chain to stop its fall.

  They say a fundamental rock stands tall.
  Others let their dependence stretch unbound.
  Nothing is grounded in itself at all.

  But why must architecture build the wall?
  Why not a circle turning ever round?
  Nothing forces the chain to stop its fall.

  A grounds in B, B grounds in C, no stall.
