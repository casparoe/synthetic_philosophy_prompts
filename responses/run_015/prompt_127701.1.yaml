answer: |-
  1. In ordinary illusions like Müller-Lyer, the perceptual seeming persists even after you know the truth, but if phenomenal consciousness is the illusion, does the seeming evaporate once you accept illusionism? If not, what is the vehicle of a seeming that you insist has no phenomenal character?

  2. Your error theory requires our reports of experience to match neural states uncannily well, so what mechanism ensures this calibration without secretly relying on the very phenomenal properties you deny? If you appeal to functional structure to explain the fit, haven't you just collapsed into reductive realism rather than staying in this unstable middle?

  3. Regarding the unresponsive patient modulating brain activity, does your view imply there is literally no suffering to prevent, or merely that suffering is not what we think it is? If the former, why treat them differently than a broken machine, and if the latter, aren't you smuggling back in the normative weight of phenomenality?

  4. Once you strip phenomenal properties from "experience," does the word still carry enough weight to explain why we care about our own futures or fear death? If it doesn't, haven't you changed the subject, and if it does, what property is doing the work besides the phenomenal one you rejected?

  5. If you follow this view out to animals and AI, what specific evidence would ever make you conclude a system actually has phenomenal consciousness rather than just modeling it? If nothing counts as evidence, doesn't the view become unfalsifiable and cheaply bought?

  6. You often dismiss challenges as the hard problem knocking again, but if introspection is a black box that systematically misrepresents physical states as phenomenal ones, what guarantees the error is stable enough to build a theory on? If you can't explain the stability of the error without referencing the truth it mimics, aren't you just restating the mystery?
