      The formal question you raised about whether coherence plus information uniquely determines a utility representation is the closest thing to a hard lever we have, and the answer is almost certainly no. In decision theory, incomplete preferences combined with coherence constraints like transitivity still leave a vast space of compatible utility functions. To move from inconsistent human judgments to a single coherent extrapolated volition requires interpolation rules, and those rules are themselves value judgments masquerading as mathematical necessities. For example, deciding how to resolve a contradiction between a short-term impulse and a long-term goal requires a weighting principle that is not contained within the preferences themselves. If the recovery camp admits this, they concede that the extrapolation process is not purely descriptive but involves normative choices about which parts of the psyche to privilege. If the manufacturing camp admits that some extrapolation is necessary for any collective action, they concede that some fiction is unavoidable. The stall persists because the first camp hides the normative choices behind the language of discovery, while the second camp rejects the project entirely because of those hidden choices.

      This leads directly to your point about personal identity, which is actually the normative core of the disagreement. The question is not whether the idealized agent is psychologically continuous with the real person in a descriptive sense, but whether that continuity is what grants the idealized agent authority over the real person. The recovery camp argues that the idealized self is more truly you, so its commands bind you. The manufacturing camp argues that the idealized self is a different entity, so its commands are merely advice from a smarter stranger. This is not an empirical question that a study on belief revision could settle, because it depends on what you think makes a preference yours in the first place. Is it the causal history of the mental state, or the rational endorsability of that state? Until the debaters agree on the criteria for normative ownership, they will talk past each other, with one side pointing to logical consistency and the other pointing to psychological alienation.

      So what could actually end it? You asked for a theorem, an study, or a distinction, and I have to be honest that a theorem or study will not resolve the normative divide. A formal proof of underdetermination would only force the recovery camp to be more explicit about their interpolation values, which is progress in clarity but not in resolution. An empirical study on how people revise beliefs might show that idealization leads to divergence rather than convergence, which would weaken the practical case for CEV, but it would not refute the philosophical claim that we ought to follow our idealized selves. The only thing that could dissolve the problem is a conceptual distinction that separates the use of idealized preferences for alignment engineering from their use for moral justification. If we treat CEV as a pragmatic tool for avoiding catastrophic outcomes rather than a metaphysical revelation of true will, the manufacturing objection loses its sting because we are no longer claiming to recover a hidden truth.

      Ultimately, I suspect no final progress is possible on the core question because it is not a puzzle to be solved but a tension to be managed. The debate is stalled because it is trying to use a technical framework to solve a philosophical problem about the source of normativity. The recovery view offers comfort and authority but rests on a metaphysical claim that cannot be proven. The manufacturing view offers honesty and grounding but leaves us without a clear method for resolving conflicting desires. The most productive path forward is to stop asking whether idealized preferences are real and start asking whether the specific idealization process yields outcomes we can reflectively endorse from our current, non-idealized perspective. This shifts the burden from metaphysics to reflective equilibrium, which does not end the debate but moves it to ground where actual progress on alignment might be possible.

