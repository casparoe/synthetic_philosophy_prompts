answer: |-
  To prevent the reverse veil from collapsing into standard risk management, you must first secure the distinction between harming an existing person and failing to bring a potential person into existence before introducing the compensation fund.

  **Dependency Order**
  1.  **The Subject Constraint:** Establish that moral claims (harm/benefit) require a subject; non-existence is not a state of welfare zero, but a state of no subject. This must be solid before mentioning the veil, otherwise students will treat "never existing" as a baseline outcome comparable to "living poorly."
  2.  **The Welfare Baseline:** Define a threshold distinguishing "suffering" (below baseline) from "happy" (above baseline). This is required to make sense of the compensation fund's trigger mechanism.
  3.  **The Reverse Veil:** Only introduce the scenario (not knowing if you are parent, child, or non-existent) after 1 and 2 are accepted; the veil relies on the ambiguity of the "non-existent" role to force the asymmetry into view.

  **Example Anatomy: Asymmetry vs. Decoration**
  *   **The Asymmetry Carrier:** The binding compensation fund that triggers *only* if welfare falls below baseline, with no mirror reward for high welfare. This structural imbalance forces the decision-maker to weight potential suffering heavier than potential happiness, mirroring the procreation asymmetry without invoking Benatar's metaphysical claims.
  *   **The Decoration:** The uncertainty about whether you will be the parent or the child. This is engagement framing for law/policy students to simulate impartiality; it does not do the philosophical heavy lifting and should be flagged as such so they don't confuse Rawlsian ignorance with the asymmetry itself.

  **Misconception Sequence and Intervention Points**
  1.  **Misconception:** "This is about overpopulation or resource scarcity."
      *   **When:** Introduction/Framing (Minutes 0–15).
      *   **Intervention:** Explicitly state the workshop concerns *individual procreative permissions*, not aggregate demographic policy; the fund is hypothetical and internal to the decision, not a state tax on population growth.
  2.  **Misconception:** "You're sneaking in utilitarianism via the fund."
      *   **When:** Veil Walkthrough (Minutes 30–45).
      *   **Intervention:** Highlight that utilitarianism requires maximizing net welfare (rewards for happiness); point out the fund's *refusal* to reward high welfare proves this is not a utility maximization model but a harm-avoidance model.
  3.  **Misconception:** "This means life has no value or existing is a harm."
      *   **When:** Conclusion/Debrief (Minutes 75–90).
      *   **Intervention:** Clarify that the asymmetry applies to the *act of bringing into existence*, not the value of existing life; a child born into a good life is still a good thing, even if creating them was not morally required or rewarded.

  **Check-for-Understanding Question**
  "A couple knows their child will have a minor disability resulting in significant pain but still net-positive welfare above the baseline; given the fund does not trigger and offers no reward for the child's happiness, does the asymmetry imply the suffering outweighs the happiness in the decision to conceive, even if the child will later be glad to exist?"
  *   **Correct Reasoning:** They should recognize that under the asymmetry, the absence of happiness (if the child weren't born) is not bad, but the presence of suffering (if the child is born) is bad, regardless of the child's retrospective gratitude or the net-positive sum.

  **Explicit Exclusions**
  Refuse to explain the **Non-Identity Problem** (that the child wouldn't exist otherwise) and avoid all technical **"person-affecting" vocabulary** (e.g., "wide vs. narrow person-affecting views"); treat these as advanced meta-ethical machinery that obscures the practical normative intuition you are building.
