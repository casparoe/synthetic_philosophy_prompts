  (2) despite that, i think forecasters and journalists should be forced to state their reference classes explicitly, because hiding the framing is worse than admitting it's arbitrary.

  (3) when we have a decent causal model of teh mechanism, that should override whatever the base-rate from some historical analogy says — so if i understand why a drug works biologically, i shouldn't let the fact that most drugs fail at this stage block me.

