prompt: |-
  I'm one of four volunteers who decide who gets money out of a small emergency hardship fund at the community centre where I help out. Grants up to about £400, we meet every fortnight, twenty or so aplications a time, and we have to write a sentence explaining each decision — to the applicant, and to whoever takes my place when I stop. I've been doing it three years, I'm the one who trains the new people, and honestly I don't know what I'm handing on.

  I've been trying to write down what counts for and what counts against, and I can't, and I don't think it's because I haven't tried hard enough. Here's what we've actually decided, going by gut.

  - Family living nearby: normally counts against, they can help. For one woman whose family is who she's hiding from, it counted hard in favour — she needed money to get out of the area.
  - Money in the bank: normally against, use it first. For an applicant with £900 saved, which was a deposit on a room in another city where she'd been offered work, it counted for — we topped it up so she wouldn't have to break into it.
  - A car: normally against, sell it. For a man on nights at a warehouse with no bus route, it counted for, it's how he keeps the job.
  - We've helped them before: normally against. For a man who'd come twice in fifteen years, it counted for — it showed he only asks when it's really bad.
  - The application came in three weeks late: normally against. Then we found out she's dyslexic and it took her a month to find someone to read the form to her, and the lateness just stopped counting against. But the dyslexia on its own isn't a reason to give her money either — it doesn't make her needier. I don't know what kind of fact that makes it.
  - Which is like: "he was abrupt with our volunteer on the phone" — I don't think that's a reason against at all. Not a weak reason that gets outweighed, just nothing. Whereas "he's got a job" is a real reason against for some applicants and no reason at all for others, and a job that pays so little you're still choosing between food and the meter feels like it isn't the same fact, but maybe I'm kidding myself there.
  - The pair I can't reconcile: we gave money to the woman who needed a deposit to get to a confirmed job in another city, and we turned down a man who wanted money for a van so he could take a building job forty miles away. Same shape, opposite decisions. I can't tell you the difference except that his plan felt like a punt.

  My flatmate did a philosophy MA and when I told her all this she said something about particularism and "holism", and I genuinely can't tell if she was taking the piss.

  So: is there a principle, or a small set of them, that actually gets these verdicts? Not a list of factors to weigh, I can write that myself — I mean something that says why the same fact points one way here and the other way there. Is there such a thing as a default way a fact counts, with exceptions, or does that fall apart as soon as the exceptions have exceptions? Which of my verdicts would you throw out rather than invent a clause for, and which do you think I've got wrong in a way I can't see? Be definite about it, please — don't lay out both sides and leave me to pick, tell me what you think is really going on and why.

  Two more things. First, one off tomorrow's list, a real one: single dad, works, asking for £300 for a laptop because his son's school moved everything online and the kid has been doing homework on a phone; £400 in the bank, has a car, and his ex has written in to say he's fine and doesn't need it. Say what your account says about that one even if it isn't the answer I want. Second: what do I actually tell the new volunteers — hand them a list, or tell them to sit in on five meetings and get a feel? If there's no principle in this, how is it that I've got better at it? Or have I.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **Who:** A volunteer coordinator at a community centre hardship fund (3 years experience, trains new volunteers).
      *   **Task:** Decides grants (up to £400), meets fortnightly, ~20 applications, writes reasoning sentences.
      *   **Problem:** Struggling to articulate the decision-making principles. Feels like it's "gut" but knows it's consistent enough to train others.
      *   **Specifics:** Provides examples of conflicting factors (family nearby, savings, car, previous help, lateness, attitude vs. employment). Highlights a specific contradiction (woman with deposit vs. man with van).
      *   **Philosophical Context:** Flatmate mentioned "particularism" and "holism." User is skeptical but curious.
      *   **Requirements:**
          *   Definite answers (no "on the one hand...").
          *   Identify if there's a principle or set of principles explaining the valence changes (why a fact counts *for* here and *against* there).
          *   Address the "default vs. exception" question.
          *   Critique specific verdicts (which to throw out, which might be wrong).
          *   Apply the account to a new case (Single dad, laptop, £400 savings, car, ex says he's fine).
          *   Advise on training new volunteers (list vs. osmosis).
          *   Address the "have I got better?" question.

  2.  **Deconstruct the Philosophical Core:**
      *   The user's flatmate was *not* taking the piss. This is classic **Moral Particularism** (associated with Jonathan Dancy) and **Holism about Reasons**.
      *   *Generalism:* Facts have invariant valence (e.g., "Lying is always wrong").
      *   *Particularism:* The moral/reasoning significance of a fact depends on the context. A fact can be a reason *for* in Case A and a reason *against* in Case B without contradiction.
      *   *Holism:* A feature (like having savings) doesn't carry its weight alone; its weight is determined by its relationship to other features (the *context*).
      *   *The User's Intuition:* The user already *knows* this practically ("a job... is a real reason against for some applicants and no reason at all for others"). They need validation that this isn't a bug, it's a feature.

  3.  **Formulate the Core Principle:**
      *   There is no fixed list of weights. The principle is **Functional Necessity within a Narrative of Stability.**
      *   It's not about "Need" in the abstract. It's about "Will this money bridge a specific gap to achieve self-sufficiency or prevent catastrophic collapse?"
      *   The valence of a fact (savings, car, family) depends on whether it functions as a *resource* or a *trap* in that specific narrative.
      *   *Savings:* Resource (use it) vs. Seed Capital (protect it).
      *   *Car:* Asset (sell it) vs. Tool of Trade (keep it).
      *   *Family:* Safety Net (use them) vs. Source of Danger (escape them).
      *   *The Guiding Star:* **Sustainability.** Does this grant make the applicant less likely to need us in 6 months?

  4.  **Address the Contradictions (Woman vs. Man):**
      *   *Woman (Deposit):* Confirmed job. Money locks in the solution. Low risk.
      *   *Man (Van):* "Punt." Job not secured? Van is a liability if no work. High risk.
      *   *Verdict:* The decision was correct. The principle is *certainty of outcome*, not just *intent to work*.

  5.  **Critique the Verdicts:**
      *   *Throw out:* "He was abrupt with our volunteer." (Irrelevant to hardship).
      *   *Keep:* All the nuanced ones (savings, car, family).
      *   *Potential Error:* The "Previous Help" rule. Usually against (dependency), but for the man (rare use), it counted for. This fits the "Sustainability" principle (he's not dependent). So, keep it.
      *   *The Dyslexia/Lateness:* Lateness isn't a moral failing; it's a barrier. Removing the penalty is correct. It doesn't add positive weight, it removes negative weight.

  6.  **Analyze the New Case (Single Dad):**
      *   *Facts:* Works, £300 needed, £400 savings, Car, Ex says "he's fine."
      *   *Analysis:*
          *   *Savings:* £400 is too low to burn on a laptop (leaves him zero buffer). Protect the savings (like the woman's deposit).
          *   *Car:* Asset, but not the issue here.
          *   *Ex:* Biased testimony. Ignore or weigh lightly.
          *   *Need:* Homework on a phone is a barrier to education (long-term hardship).
          *   *Work:* He is employed (good sign).
      *   *Decision:* **Fund it.**
      *   *Reasoning:* The laptop is a tool of trade (for the kid's future stability). Burning savings leaves him vulnerable to the next shock. The grant prevents future hardship (educational failure).

  7.  **Advise on Training:**
      *   *List:* Fails because it implies invariant weights.
      *   *Osmosis:* Too slow, risks bias.
      *   *Solution:* **Case-Based Training (Casuistry).** Show the *conflicts*. Teach the *narrative* method.
      *   *How I got better:* Pattern recognition of *contexts*, not rules. I learned to spot the "story of stability."

  8.  **Drafting the Response (Iterative refinement for tone and definiteness):**
      *   *Tone:* Respectful, direct, philosophical but grounded. No hedging.
      *   *Structure:*
          1.  Validate the flatmate (Particularism is real).
          2.  Define the underlying principle (Contextual Function/Sustainability).
          3.  Explain the valence shifts (Resource vs. Trap).
          4.  Address the Woman/Man contradiction.
          5.  Critique the "Abrupt" factor.
          6.  Decide the Single Dad case.
          7.  Training advice.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "Particularism" and leave it there. I need to give the user the *practical* version of that philosophy. The principle isn't "there are no principles," it's "the principle is contextual function."
      *   *Refining the Single Dad:* The ex-partner's note is tricky. If the ex is the other parent, they might want to avoid financial liability. I should advise ignoring the ex's assessment of *need*, but noting the relationship dynamic. The core is the savings vs. laptop cost. £400 savings is emergency buffer. Don't make them burn it for capital equipment.
      *   *Refining Training:* Don't say "just sit in." Say "sit in *with specific tasks*." Compare notes.

  9.  **Final Polish:** Check against constraints.
      *   Definite? Yes.
      *   Addressed all bullet points? Yes.
      *   Addressed the "have I got better" question? Yes.
      *   Addressed the "default way a fact counts" question? Yes (defaults exist but are defeasible).

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Your flatmate was not taking the piss. She was naming exactly what you are doing. You are a moral particularist. You are operating under a holistic view of reasons.

  Here is the definite answer to your question: **There is no invariant list of weights.** There is, however, a single governing principle that explains why your gut feels consistent even when the rules flip.

  ### The Principle: Functional Sustainability
  You are not assessing *need* in the abstract. You are assessing **viability**.

  Your core question is not "Are they suffering?" (Almost all 20 applicants are). Your core question is: **"Will this money turn a precarious situation into a stable one, or is it pouring water into a bucket with a hole?"**

  This is why facts change valence. A fact counts *for* or *against* depending on whether it functions as a **Resource** or a **Trap** in that specific narrative.

  *   **Savings:** Usually a Resource (use them). But if the savings are a *Seed* (deposit for a job), burning them destroys the future stability. Then they function as a Trap if touched.
  *   **Family:** Usually a Resource (safety net). But if they are the source of danger, they function as a Trap.
  *   **Car:** Usually an Asset (sell it). But if it is a Tool of Trade (night shift), selling it destroys income. It becomes a Trap if removed.
  *   **Previous Help:** Usually indicates Dependency (Trap). But if rare over 15 years, it indicates Resilience (Resource).

  You haven't been inconsistent. You have been correctly identifying the *function* of the fact within the applicant's specific ecosystem.

  ### The Contradictions and Errors

  **1. The Woman (Deposit) vs. The Man (Van)**
  You got this right. Do not doubt it.
  The difference was **Certainty.**
  The woman had a *confirmed* job. The money locked in a solution. The risk of failure was low.
  The man had a *potential* job ("a punt"). Buying the van creates a liability (insurance, tax, fuel) without guaranteed income to support it. If the job falls through, he is worse off than before.
  **Verdict:** Keep this distinction. It is the difference between funding a *solution* and funding a *gamble*.

  **2. "He was abrupt with the volunteer"**
  **Throw this out.** Immediately.
  This is not a factor in hardship. It is a factor in etiquette. Unless his abuse was violent or threatening, his stress levels are irrelevant to his financial viability. Including this corrupts the fund's purpose. It punishes the desperate for being desperate.

  **3. The Dyslexia/Lateness**
  You are handling this correctly. Lateness is a negative marker for *administrative reliability*, which usually suggests chaotic life management. Dyslexia explains the lateness without implying chaos. It neutralizes the negative reason; it does not create a positive one. You are right: it stops counting against, it doesn't count for.

  ### The New Case: Single Dad, Laptop, £400 Savings
  **Decision: Fund the £300.**

  **Reasoning:**
  1.  **The Savings:** £400 is not "savings" in a viability context; it is a *buffer*. If he spends £300 of it, he has £100 left. One unexpected bill (car repair, illness) and he is back in crisis. Protecting the buffer is more important than making him spend it. This matches the "Woman with Deposit" logic.
  2.  **The Laptop:** This is a Tool of Trade for the son. Education failure leads to long-term hardship. This is an investment in stability, not just consumption.
  3.  **The Ex-Partner:** Ignore the statement "he's fine." An ex-partner is not a neutral assessor. They may wish to avoid child support implications, or they may genuinely not understand his finances. It is hearsay.
  4.  **The Work:** He is employed. He is trying to be stable.
  **The Sentence:** "Grant approved to preserve emergency buffer and secure child's educational access; employment status indicates path to stability."

  ### Training the New Volunteers

  Do not hand them a list. A list lies. It tells them "Savings = Against," and they will deny the woman with the deposit.
  Do not just tell them to "sit in." That is osmosis, and they will absorb your biases (like the "abrupt" comment) without understanding your principles.

  **Do this instead:**
  1.  **The "Why" Game:** For the first three meetings, they do not vote. They write down the decision they *would* make and the *one sentence reason*. You compare. When you differ, you don't argue the verdict; you argue the *function*. "You see the car as an asset to sell; I see it as a tool to keep. Why?"
  2.  **Teach the Narrative:** Tell them: "We are not judges of worth. We are engineers of stability. Look for the thing that, if fixed, stops them coming back."
  3.  **Explicitly Ban the Irrelevant:** Tell them upfront: "Attitude, lateness without context, and third-party opinions on need are not valid reasons. Do not write them down."

  ### Have You Got Better?
  **Yes.**
  Three years ago, you were likely looking for rules to follow. Now, you are looking for patterns of viability.
  You have got better because your **pattern recognition** has sharpened. You can now spot the difference between a "punt" and a "plan" faster. You can smell the difference between "chaos" and "bad luck."
  That isn't magic. It is the accumulation of case law in your head. You have built a library of contexts.

  ### Summary
  Your flatmate was right about the philosophy, but you don't need the jargon.
  **The Rule:** Fund the bridge, not the hole.
  **The Method:** Assess whether a fact is a Resource or a Trap in this specific story.
  **The Training:** Teach the distinction, not the list.

  You are doing the work correctly. The discomfort you feel is the friction of applying rigid rules to fluid human lives. Stop trying to rigidify the rules. Trust the assessment of viability.
