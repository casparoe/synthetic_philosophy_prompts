answer: |-
  This is a fantastic problem. You are essentially wrestling with the *Grundnorm* problem in legal philosophy (Kelsen) meets the *Liar Paradox* (logic) meets *Constitutional Design* (political science). Your intuitions are not random; they are consistent with a specific school of thought that prioritizes **structural integrity** over **logical purity**.

  Your current principle ("valid iff satisfies rules in force moment before") is **Formalist**. It works for simple transitions (Cases 1 & 2) but fails when the *mechanism* of change is manipulated (Cases 4, 5, 7).

  To match your verdicts, you need a **Structuralist** principle. I propose calling it **The Doctrine of Anterior Authority**.

  ### The Principle: The Doctrine of Anterior Authority

  **The Core Rule:** *Authority must exist prior to the act it validates. No proposal may fuse the creation of authority with the exercise of that authority.*

  **The Speech (For your "Keeper of the Code" character):**
  > "Colleagues, you are asking the Code to swallow its own tail. You propose to redefine 'majority' in the very breath you claim a majority. You propose to disentrench a clause in the same vote that touches it. You propose to cure a dead law with a living one.
  >
  > This violates the Doctrine of Anterior Authority. Power does not flow from the future to the past. The authority to change a rule must exist *before* the change begins, not be conjured into existence by the change itself. If you could redefine the ruler while you are measuring, no length would ever be false. If you could validate a failed vote with a new one, no election would ever be final. We are not building a logic puzzle; we are building a state. The foundation must be laid before the wall is raised. You cannot pour the concrete and the footing in the same bucket."

  **The Rebuttal (For your "Reformer" character to poke holes):**
  > "Anterior Authority is a ghost story you tell to scare the majority. If 55% of us agree that 'majority' now means 'two-thirds,' why is that agreement less real than the old definition? You say authority must precede the act. But the Code *is* the act. The Code is alive. When we speak, the Code speaks. If the Code says 'this vote defines the terms of this vote,' who are you to say the Code is lying? You are privileging the dead hand of the old rules over the living will of the Assembly. You call it 'Anterior Authority.' I call it 'Tyranny of the Timestamp.'"

  ---

  ### How the Doctrine Maps to Your Cases

  Here is how **Anterior Authority** validates your gut instincts, and where it bleeds.

  | Case | Scenario | Your Verdict | Doctrine Prediction | Why? |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Majority $\to$ 2/3 (54%) | **Valid** | **Valid** | Authority (Majority) existed *anterior* to the vote. It was used to build a higher wall. No fusion. |
  | **2** | 2/3 $\to$ Majority (58%) | **Invalid** | **Invalid** | Authority (2/3) did *not* exist anterior to the vote. You tried to exercise power you didn't have yet. |
  | **3** | "Amendments <2/3 void" (61%) | **Valid Adoption** | **Valid Adoption** | Adopted under old Majority rule. Authority existed. |
  | | *...but can't annul self* | **Invalid Retro** | **Invalid Retro** | The new rule cannot reach back to kill the authority that birthed it. That violates temporal sequence. |
  | **4** | Bundled Disentrenchment | **Invalid** | **Invalid** | **Fusion.** You are fusing the *permission to touch* (disentrenchment) with the *act of touching* (rewrite). Must be sequential. |
  | **5** | Redefine "Majority" (55%) | **Invalid** | **Invalid** | **Fusion.** You are fusing the *definition of the tool* with the *use of the tool*. The definition must be fixed before the vote starts. |
  | **6** | Poison Pill / Suicide | **Code Dies** | **Code Dies** | **Valid.** The Pill is a *condition* set anteriorly. The lowering of the threshold triggers the condition. The Code dies *after* the trigger. No loop. |
  | **7** | Retroactive Cure | **Invalid** | **Invalid** | **Fusion.** You are fusing *present authority* with *past validity*. You cannot lend authority backward in time. |
  | **8** | **The Electorate Case** | *(Dodged)* | **Invalid** | **Fusion.** You cannot fuse the *creation of the voter* with the *vote of the new voter*. The old electorate must ratify the change that creates the new electorate. |

  **Where the Doctrine Bleeds (The "Can't Save" List):**
  Honestly? This principle saves all seven of your verdicts *and* the Electorate case. It is robust.
  *However*, the cost is **Case 6**. A sharp Formalist might argue that if the Code is repealed, the Poison Pill (part of the Code) is also repealed *simultaneously*, meaning there is no legal basis for the repeal.
  *   **Your Verdict:** Code dies.
  *   **Doctrine:** Code dies.
  *   **The Hole:** A logician will argue this is a "Self-Consuming Proposition." If the Code is gone, the rule saying "Code is gone" is also gone. You land in a legal vacuum.
  *   **Fix for the Novel:** Your character must argue that the *effect* of the repeal survives the repeal (like a dead man's will). If you want to be logically airtight, you might have to concede Case 6 creates a "Legal Singularity" where no one knows if they are under the Code or Custom. That's actually great drama.

  ---

  ### Addressing Your Partner's Critique

  **Is she right?**
  Yes. Absolutely.
  The Doctrine of Anterior Authority is, functionally, a **Ratchet**. It makes it easier to tighten the system (Case 1) than to loosen it (Case 2). It makes it easier to add protections (Case 3) than to remove them (Case 4). It privileges the *status quo* by demanding that any change justify itself using the tools of the old regime.

  **Is the Ratchet Defensible?**
  Yes, and here is the jurisprudential defense your character can use:

  > "My opponent calls this a ratchet. She is right. It is a ratchet. And thank the founders for that.
  >
  > In a system that can rewrite its own source code, entropy is the enemy. If we allow the Assembly to fuse the *power* with the *act*, we invite the tyranny of the momentary majority. Today they redefine 'majority' to pass a tax. Tomorrow they redefine 'person' to revoke a right.
  >
  > A ratchet is not a trap; it is a stabilizer. It ensures that every change requires *more* energy than the system currently holds, not less. It forces us to build consensus *before* we change the rules of consensus. If we remove the friction, we do not get freedom. We get noise. We get Nomic. And this is not a game."

  ### The "Electorate" Case Prediction

  You asked specifically about the case you keep dodging: *The Assembly redefines who counts as a voter (enfranchises the outer islands), and the **new** electorate then ratifies the change.*

  **Verdict:** **Invalid.**

  **Reasoning:** This is the ultimate **Fusion of Authority**.
  1.  **The Old Electorate** holds the Anterior Authority. They are the only ones with the legal power to change the definition of the Electorate.
  2.  **The New Electorate** does not exist legally until the change is complete.
  3.  If the New Electorate ratifies the change, they are exercising authority they did not possess *anterior* to the act. They are bootstrapping their own legitimacy.

  **How to stage this in the book:**
  This is your climax waiting to happen.
  *   **The Reformers:** "The Outer Islands are people! They voted in the plebiscite! 70% of the *new* nation supports this!"
  *   **The Keepers:** "70% of a fiction. Under the Code *as it stood at the start of the session*, they were non-voters. Their votes are void. The change failed. The Code holds."
  *   **The Conflict:** This creates a revolution. The "New Electorate" feels legitimate morally but illegitimate legally. The "Old Electorate" feels legitimate legally but illegitimate morally. This is where your self-referential legal system crashes into human reality.

  ### Summary for your Writing Group

  If they ask what the rule *is*, tell them:
  **"The Code operates on the Doctrine of Anterior Authority. You cannot use a rule to validate the process that created it. You cannot borrow power from the future. You cannot fuse the lock with the key."**

  It explains why your gut rejects the "sneaky" moves (4, 5, 7) while accepting the "hard" moves (1, 2, 6). It admits the conservatism (the Ratchet) but frames it as a necessary safety mechanism for a system that could otherwise delete itself by accident.
