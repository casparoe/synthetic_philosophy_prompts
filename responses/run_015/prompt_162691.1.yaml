  The first wick fades, the second catches light,
  A golden bridge across the empty space.
  We trust the continuity of sight,
  The fire is the same.

  The fuel is new, the moment distinct and dead,
  No particle survives the transfer's cost.
  The previous heat is utterly fled,
  The fire is not the same.

  If identity holds, then two are one,
  If difference holds, the link is severed clean.
  We bind the contradiction till it's done,
  The fire is and is not the same.

  Reject the pair, the assertion and the clause,
  *Svabhāva* fails to anchor in the glow.
  No ground remains beneath our logical laws,
  The fire neither is nor is not the same.

  The wax runs down. The book is open wide.
  We use the light to see what's here and now.
  There is no secret substance left to hide,
  The fire is the same.

  ***

  **Note on the Verse**

  I gambled on reading the *catuṣkoṭi* therapeutically rather than ontologically. My aim was to show the four corners not as exhaustive descriptions of reality, but as successive failures of language to grasp dependent arising. In Stanza 4, I avoided treating emptiness as a mystical substratum; instead, it is simply the collapse of the question when *svabhāva* is absent. For the two truths, I chose the pragmatic view: conventional and ultimate truths are not separate realms, but distinct stances toward one world. The coda returns to "The fire is the same" not because conventional truth is ultimately real, but because it is sufficient for lighting the room. This prevents emptiness from becoming a nihilistic void or a higher substance. The poem asserts nothing; it merely clears the ground so ordinary life can resume without metaphysical baggage.
