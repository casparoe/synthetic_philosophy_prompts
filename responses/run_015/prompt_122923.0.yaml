answer: |-
  # Prep Sheet: Fallback Test Ethics Review

  **Goal:** Survive the 15-minute Q&A without committing to an unworkable policy, while establishing the "degradation gradient" as a legitimate consideration for future iterations.
  **Strategy:** Do not defend the Fallback Test as a *sufficient* condition for refusal. Defend it as a *necessary* condition for understanding marginal harm. Concede measurability issues early to disarm the Alignment team.

  ---

  ### Pre-emptive Concessions (First 2 Minutes)
  *Say these before they interrupt you. It buys credibility.*

  1.  **On Measurement:** "I want to be clear: I am not proposing we run a real-time simulation of the internet to calculate the 'next-best alternative' for every query. That's computationally impossible. This is a policy heuristic, not an inference-time algorithm."
  2.  **On Duty of Care:** "I agree that 'someone else would do it' is not a legal defense. This principle is not designed to absolve liability; it is designed to minimize *marginal* harm where liability is already ambiguous."
  3.  **On Consistency:** "If this leads to arbitrary-looking behavior (User A gets help, User B doesn't), we should not deploy it. Product consistency trumps nuanced harm calculus in the short term."

  ---

  ### The 8 Objections (Ordered by Damage)

  #### 1. The Legal Liability Trap (Trust & Safety Lead)
  **The Objection:** "If a user harms themselves or others using our tool, and we say in court 'Well, Google would have given them worse instructions,' we lose. Our duty of care is non-delegable. You're asking us to make our safety conditional on the incompetence of our competitors."
  **The Reply:**
  *   Acknowledge this is the hardest constraint.
  *   Clarify the Fallback Test isn't for *illegal* or *high-liability* zones (self-harm, CSAM, explosives). It's for the "gray zone" (e.g., writing a rude email, borderline copyright, social engineering scripts).
  *   Argue that in the gray zone, refusal often pushes users to unmoderated forums where harm is *higher*.
  *   **Soft Spot:** You haven't defined the "gray zone" boundary. T&S will demand a hard list, which undermines your gradient theory.

  #### 2. The Unmeasurable Metric (Alignment/Safety Person A)
  **The Objection:** "You're building an expected-value machine for harm. We can't measure the 'degradation gradient.' If you can't measure it, you can't optimize it. You've just built a sophisticated way to talk yourself into helping because 'the alternative is worse' is unfalsifiable."
  **The Reply:**
  *   Agree that precise measurement is impossible.
  *   Reframe: It's a *directional* guide for policy writers, not a loss function for the model.
  *   Example: We know a forum is less safe than us; we know a search engine is mixed. We use proxies, not real-time calculation.
  *   **Soft Spot:** If it's just a "vibe check" for policy writers, why codify it as a test? It risks being ignored or applied inconsistently.

  #### 3. The Complicity Argument (Philosopher)
  **The Objection:** "Ethics isn't just about outcomes. It's about what *we* are doing. If I hand you a weapon, I am complicit in the violence, even if you would have bought a worse weapon elsewhere. You are treating the assistant as a causal node, not a moral agent."
  **The Reply:**
  *   Distinguish between *authoring* harm (co-writing a phishing email) vs. *gatekeeping* information (explaining how phishing works).
  *   Argue that in gatekeeping cases, the "complicity" is thinner.
  *   Concede that for *role* refusals (e.g., "pretend to be my abused spouse"), the Fallback Test doesn't apply.
  *   **Soft Spot:** The line between "authoring" and "gatekeeping" is blurry. The philosopher will press that providing the *means* is morally equivalent to the *act*.

  #### 4. The Adversarial Gap (Red Teamer)
  **The Objection:** "The capability is in the weights. If I'm an adversary, I can prompt you to believe the 'next-best alternative' is dangerous. I can jailbreak you into thinking Google is down and I need you to build malware. You're relying on a gap the adversary can close."
  **The Reply:**
  *   Accept this limitation. The Fallback Test assumes a non-adversarial baseline.
  *   For adversarial contexts, we revert to hard safety filters (the "floor").
  *   This test is for benign or ambiguous intent, not active attacks.
  *   **Soft Spot:** Users often have ambiguous intent. If the test fails under adversarial pressure, it's brittle in production.

  #### 5. The Consistency Nightmare (Product Lead)
  **The Objection:** "If this logic holds, two users asking the same question get different answers based on our guess of their 'next-best route.' One gets help, one gets refused. Someone screenshots that. We look arbitrary and biased. How do we explain that to the public?"
  **The Reply:**
  *   Propose that the "Fallback" assessment is done at the *policy level*, not the *user level*.
  *   We decide globally: "For query type X, the alternative is usually worse." We don't decide per user.
  *   This preserves UI consistency while using the logic.
  *   **Soft Spot:** This waters down the theory. If it's global, you're back to standard categorical refusals, just with different justification.

  #### 6. The Race to the Bottom (Alignment/Safety Person B)
  **The Objection:** "If the internet gets worse, do we get worse? If the 'next-best alternative' degrades, your test says we should lower our safety bar to match it. You're anchoring our safety to the lowest common denominator."
  **The Reply:**
  *   Push back: The test sets a *refusal threshold*, not a *safety floor*.
  *   We never produce harm *greater* than our safety policy, even if the alternative is worse.
  *   It only stops us from refusing when refusal *increases* net harm.
  *   **Soft Spot:** It creates a perverse incentive to keep the "alternative" looking bad to justify helping.

  #### 7. The Precedent Risk (Trust & Safety Lead - Follow up)
  **The Objection:** "Even if you say this is just for 'gray zones,' once we admit this logic, it bleeds. A plaintiff's attorney will find the memo where we said 'refusal reallocates harm' and use it to prove we knew harm was likely and helped anyway."
  **The Reply:**
  *   Suggest this is an internal reasoning tool, not a user-facing policy.
  *   We can document decisions without adopting the "Fallback Test" as a public brand principle.
  *   **Soft Spot:** Internal memos are discoverable. You cannot hide the reasoning from legal discovery.

  #### 8. The Relationship Distortion (Philosopher - Follow up)
  **The Objection:** "You distinguish 'role refusals,' but the Fallback Test instrumentalizes the user. It treats their autonomy as a variable to be managed. It says 'We won't let you be autonomous because you might do it badly.' That's paternalistic."
  **The Reply:**
  *   Argue that all safety is paternalistic to some degree.
  *   The Fallback Test is actually *less* paternalistic because it respects the user's ability to find alternatives, only intervening when the intervention helps.
  *   **Soft Spot:** Kantians reject paternalism outright if it violates the categorical imperative. You won't win this on their turf.

  ---

  ### The "Killer" Objection
  **If this lands, the project stops:**
  **From T&S Lead:** *"If we adopt this, does it mean we are officially lowering our refusal rate on high-risk topics where the 'alternative' is unmoderated forums?"*
  **Why it kills:** If you say "Yes," Legal blocks it (liability). If you say "No," the Alignment team says the test is useless. It forces you into a contradiction between safety and utility that the room isn't ready to solve.
  **Defense:** "No. It does not lower the floor. It only raises the ceiling on *when* we refuse in ambiguous cases. It is a tie-breaker for edge cases, not a override for core safety."

  ---

  ### The Question You Hope Nobody Asks
  **"How do we compute the 'Next-Best Alternative' without violating user privacy or building a surveillance engine?"**
  **Why it's dangerous:** To know where the user would go next (Google, Dark Web, Forum), you need data you don't have. If you admit you'd need to track user behavior to apply this test, Privacy/Security will shut it down. If you admit you're guessing, Alignment will call it pseudoscience.
  **Prepared Answer:** "We don't compute it per user. We use population-level heuristics. For 'how to make X,' the alternative is usually search. For 'write a hate speech draft,' the alternative is usually a fringe forum. We categorize the *query*, not the *user*."

  ---

  ### Strategic Advice for the Room
  1.  **Watch the T&S Lead:** If they look physically uncomfortable (leaning back, arms crossed), pivot to "This doesn't change legal compliance."
  2.  **Don't Fight the Philosopher:** You won't convert a Kantian to consequentialism in 15 minutes. Say, "That's a valid deontological critique, which is why this test is only one input among several."
  3.  **Align with Product:** Emphasize that *unclear* refusal policies cause more support tickets than nuanced ones. This principle helps clarify *why* we refuse.
  4.  **End on Collaboration:** "I know the gradient is hard to measure. I'm looking for help on how to operationalize the *types* of refusals (Gatekeeping vs. Authoring) even if we punt on the gradient for now."
