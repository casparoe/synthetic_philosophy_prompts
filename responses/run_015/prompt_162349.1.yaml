answer: |-
  To judge the claim we start with *if*,
  not what another shooter *would*.
  We strike the dry and wooden *match*,
  knowing only that it was *lit*.
  We do not leave this actual *world*,
  nor seek a realm merely *similar*.

  But change the tense to something *similar*,
  and past tense marks the false *if*.
  We step outside the actual *world*,
  where Oswald shoots, to say he *would*.
  The gun is silent, nothing *lit*,
  had he not struck the fatal *match*.

  Consider now the striking *match*,
  in conditions roughly *similar*.
  We say simply that it is *lit*,
  We assert the consequent *if*.
  In normal air, the flame *would*.
  This holds within the closest *world*.

  Remove the air from such a *world*,
  and strike again the selfsame *match*.
  The flame now fails; it never *would*.
  The situation is not *similar*.
  We test the limit of the *if*.
  The consequent stands not *lit*.

  Restore the air, the stick is *lit*,
  no contradiction in the *world*.
  The ordering shifts with the *if*,
  no fixed metric for the *match*.
  The nearest sphere is merely *similar*.
  The antecedent moves what *would*.

  We ask not what it *would*.
  Once more the fiber is *lit*.
  Conditions render it *similar*.
  Across the breadth of any *world*.
  There is no standard for the *match*.
  Dependent on the antecedent *if*.

  One says what *would* be *lit*.
  One ranks the *similar* in the *world*.
  Both strike the *match* if one *would* trust the *if*.

  The first two stanzas establish the Oswald minimal pair, distinguishing the indicative's epistemic openness from the counterfactual's commitment to a false antecedent. Stanzas three through five deploy the match example to demonstrate how antecedent details shift the similarity ordering of worlds without contradiction, while the migration of *would* enacts the lack of a fixed modal destination. The envoi juxtaposes the two standards—conditional probability versus comparative similarity—and ends on an open clause containing both *if* and *would* to show that shared vocabulary cannot bridge the semantic divide.
