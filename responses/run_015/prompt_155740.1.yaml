  **The Case**
  An agent is choosing between three apartments: **A** (Best Location), **B** (Best Size), **C** (Best Price). Her preferences are cyclic based on a "majority of dimensions" heuristic: she prefers **A over B** (Location & Price beat Size), **B over C** (Size & Location beat Price), and **C over A** (Price & Size beat Location). An exploiter knows this and starts her at **C**. He offers a sequence of swaps: **C for B**, then **B for A**, then **A for C**. Each swap requires a fee of **$3**. The preference margin between any two options is valued at **$10**.

  **The Arithmetic**
  The agent considers four plans (Accept $k$ offers, then stop):
  *   **Plan 0 (Stop):** Keep C. Outcome: **C + $0**.
  *   **Plan 1 (Swap 1):** Get B. Outcome: **B – $3**.
  *   **Plan 2 (Swap 2):** Get A. Outcome: **A – $6**.
  *   **Plan 3 (Swap 3):** Return to C. Outcome: **C – $9**.

  **Ranking & Elimination:**
  1.  **Plan 3 vs Plan 0:** Both yield C, but Plan 0 costs less. **Plan 0 dominates Plan 3.** (Eliminate Plan 3).
  2.  **Plan 1 vs Plan 0:** She prefers B to C by $10. Cost is $3. Net gain $7. **Plan 1 > Plan 0.**
  3.  **Plan 2 vs Plan 1:** She prefers A to B by $10. Additional cost is $3. Net gain $7. **Plan 2 > Plan 1.**
  4.  **Plan 0 vs Plan 2:** She prefers C to A by $10. Plan 2 costs $6 more than Plan 0. Net gain for Plan 0 is $4. **Plan 0 > Plan 2.**

  **Survivors:** Plans 0, 1, and 2.
  **Structure:** Plan 1 > Plan 0 > Plan 2 > Plan 1.
  **Result:** A strict cycle with no maximal element.

  **Verdicts**
  *   **Myopic Chooser:** Accepts Trade 1 (B > C), Accepts Trade 2 (A > B), Accepts Trade 3 (C > A). Ends with **C – $9**. Exploited.
  *   **Resolute Chooser:** Attempts to pick the best plan ex ante. Finds that Plan 1 beats Plan 0, Plan 2 beats Plan 1, but Plan 0 beats Plan 2. There is **no best plan** to be resolute about. Resoluteness provides no escape.

  **Analysis**
  The feature doing the work is **intransitivity of preferences over outcomes** (specifically, that the preference cycle is robust enough to survive the cumulative costs of the plans). If preferences over outcomes were transitive, the plan ranking would be transitive, yielding a maximal plan (typically Plan 0). The strongest reply for a defender of resolute choice is to argue that **rationality requires transitive preferences over outcomes**; if the agent's preferences cycle, she is already irrational, and the failure of resolute choice is merely a symptom of that prior defect, not a failure of the strategy itself.

  **Confidence**
  I am **highly confident** in the arithmetic and the logical demonstration that intransitive outcome preferences prevent a maximal plan. I am **least sure** about the philosophical step claiming this refutes resolute choice; a defender might argue that "picking a plan" imposes a derived transitivity that overrides the underlying cyclic preferences, effectively changing the agent's criteria rather than failing to apply them.
