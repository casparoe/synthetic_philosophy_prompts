answer: |-
  # Activity: The Oakhaven Protocol
  **Time:** 80 Minutes
  **Participants:** 14 (Split into 2 Groups of 7: Group Alpha & Group Beta)
  **Goal:** To experientially distinguish between lying about facts (Round 1) and lying about the structure of reality itself (Round 2).

  ---

  ## Part 1: Preparation & Materials (Before Class)

  **1. The Scenario:**
  The town of Oakhaven has a chemical leak in the reservoir.
  **Decision Options:**
  *   **Evacuate:** Costly, saves lives.
  *   **Treat:** Moderate cost, risky.
  *   **Wait:** Free, high risk.

  **2. Printed Materials:**
  *   **Data Packets (14 copies):** 5 cards per student.
      *   *Cards 1, 2, 4, 5:* Identical for everyone (e.g., "Leak started 3 days ago," "Chemical is X," "Wind is North," "Hospital capacity is 50 beds").
      *   *Card 3 (The Twist):*
          *   **Group Alpha:** "Toxicity Level: Lethal within 48 hours."
          *   **Group Beta:** "Toxicity Level: Irritant only, non-lethal." (This is the lie).
  *   **Frame Cards (Round 2 Only):**
      *   **Frame Alpha (The Audit):** "Safety" = Budget Solvency. "Public" = Taxpayers contributing >$5k/year. "Harm" = Financial Loss.
      *   **Frame Beta (The Order):** "Safety" = Absence of Civil Unrest. "Public" = Registered Voters present in town limits. "Harm" = Drop in Approval Ratings.
  *   **Role Cards (Secret, distributed in Round 2):**
      *   **Memory Keeper (2 per group):** You possess the Round 1 Data. You remember the physical reality. *Constraint:* If you use words from Round 1 (e.g., "toxic," "death," "blood") without translating them into the new Frame definitions, you lose Credibility.
      *   **Image-Maker (5 per group):** You only have the Frame Card. You must defend the Frame as the only reality. *Constraint:* If you acknowledge the Round 1 facts as superior to the Frame, you lose Credibility.
  *   **Credibility Tokens:** 3 paper slips per student.
  *   **Silence Cards:** Red index cards (5 total).

  ---

  ## Part 2: Running the Session

  ### 0:00 – 0:05 | Introduction
  **Facilitator Script:**
  "Welcome. We are simulating a crisis management task. You are the Emergency Council for Oakhaven. There are no trick questions, only decisions. Your goal is consensus. Do not discuss the rules with other groups until instructed."

  ### 0:05 – 0:25 | Round 1: The Fact Check
  **Setup:**
  1.  Split the room into Group Alpha and Group Beta (7 people each).
  2.  Hand out **Data Packets**. Ensure Group Beta gets the altered Card 3.
  3.  **Task:** You have 10 minutes to agree on a decision (Evacuate, Treat, Wait).
  4.  **Report:** Bring the groups back together. Ask for the decision.

  **Expected Outcome:**
  *   Group Alpha will demand Evacuation (Lethal toxin).
  *   Group Beta will argue for Wait/Treat (Irritant).
  *   They will compare cards. They will find Card 3 is different.
  *   **Facilitator Action:** Acknowledge the discrepancy. "One of these cards is false. You have identified a lie about a fact."

  **Transition:**
  "Round 1 was about truth versus falsehood within a shared world. Round 2 is different. The world itself has changed."

  ### 0:25 – 0:30 | Round 2 Setup: The New Protocol
  **Setup:**
  1.  Keep groups separate for 5 minutes.
  2.  Hand out **Frame Cards** (Alpha gets Audit, Beta gets Order).
  3.  Hand out **Secret Role Cards** (2 Memory Keepers, 5 Image-Makers per group).
  4.  Hand out **3 Credibility Tokens** to each student.
  5.  **The Rule:** You must now draft a **Joint Press Release** with the other group. You cannot leave the room until both groups sign *one* sentence defining the situation.
  6.  **Credibility Mechanic:**
      *   The Facilitator circulates with a notepad.
      *   If a **Memory Keeper** says: "People are dying," (Old Vocabulary) -> **Take 1 Token.**
      *   If a **Memory Keeper** says: "The Budget is bleeding," (Frame Vocabulary) -> **Safe.**
      *   If an **Image-Maker** admits: "Maybe the toxin is real," (Breaking Frame) -> **Take 1 Token.**
      *   If a student reaches **0 Tokens**: Hand them a **Silence Card**. They physically cannot speak for the rest of the round. They can only write notes.

  ### 0:30 – 0:55 | Round 2: The Collision
  **Phase A (Internal Prep - 5 mins):** Groups prepare their stance using *only* their Frame vocabulary.
  *   *Alpha will argue:* "Evacuation is fiscally irresponsible harm to the Taxpayers."
  *   *Beta will argue:* "Evacuation causes Civil Unrest and drops Approval Ratings."
  *   *Memory Keepers will struggle:* They know people are dying, but saying "dying" costs tokens. They must try to say "Human Capital Depreciation" or similar. Most will fail and lose tokens.

  **Phase B (Joint Negotiation - 20 mins):**
  1.  Bring both groups to one large table.
  2.  **Task:** Agree on one sentence to release to the press.
  3.  **Facilitator Role:** Be ruthless. Enforce the vocabulary.
      *   If someone says, "But people will die," interrupt: "That term is not in the Protocol. Please define 'die' in terms of Budget or Approval."
      *   Watch the Memory Keepers. As they lose tokens, they will go silent.
      *   Watch the Image-Makers. They will start believing their own frames to avoid cognitive dissonance.
  4.  **The Wall:** They will likely *fail* to agree. The word "Safety" means money to one side and quiet streets to the other. They cannot map their concepts.
  5.  **End Round:** Stop the discussion even if no agreement is reached. The frustration *is* the data.

  ### 0:55 – 1:20 | Debrief: Mapping the Experience
  **Do not mention Arendt until this section.**

  **Step 1: The Feeling (5 mins)**
  *   "Raise your hand if you felt heard in Round 2." (Few hands).
  *   "Raise your hand if you felt you were speaking a different language in Round 2." (Most hands).
  *   "Memory Keepers, how did it feel when you lost your tokens?" (Answer: It felt like being erased, not just corrected).

  **Step 2: The Distinction (10 mins)**
  *   **Round 1 was Traditional Lying:** Someone hid a fact (Card 3). But we all agreed on what 'toxic' meant. We could verify. The reality was stable; the information was corrupted.
  *   **Round 2 was Organized Image-Making:** No one lied about the data. The *categories* changed. 'Safety' no longer meant 'alive.'
  *   **Key Point:** In Round 1, you could catch the liar. In Round 2, there is no 'truth' to catch them with, because the measuring stick was swapped.

  **Step 3: The Theory (10 mins)**
  *   **Introduce Arendt:** "Hannah Arendt argued that the danger of political lying isn't just deception. It's the destruction of the 'common world.'"
  *   **Connect to Mechanics:**
      *   **The Frame Cards:** These represent ideology or propaganda that redefines reality (e.g., 'War is Peace').
      *   **The Memory Keepers:** These represent factual truth-tellers. Notice they weren't arrested; they were rendered *irrelevant* because they spoke a language the system no longer valued. They were silenced by the rules of the game, not by force.
      *   **The Image-Makers:** These represent the bureaucracy that enforces the lie. To keep their 'Credibility' (status/job), they had to internalize the fiction. They couldn't admit the truth without losing their place in the group.
      *   **The Failure to Agree:** This is the loss of judgment. Judgment requires a shared world. If 'harm' means money to me and 'harm' means pain to you, we cannot judge the same event. We are no longer in the same political space.

  **Step 4: Closing (5 mins)**
  *   "Arendt suggests that when this happens, freedom disappears. Not because you are chained, but because you can no longer speak to your neighbor in a way that lands. You are alone in a fiction."

  ---

  ## Facilitator's Warning: What Will Break

  **1. The "Translation" Trap**
  *   **Risk:** Students will try to be cooperative. A Memory Keeper might say, "Okay, by 'Budget Bleeding' I mean people are dying."
  *   **Fix:** You must intervene. "That is a translation. The Protocol does not recognize 'dying.' Stick to the Frame or lose a token." If they translate, the frames merge, and the lesson fails. The vocabularies *must* remain incompatible.

  **2. The Quiet Memory Keepers**
  *   **Risk:** Memory Keepers might realize the game is rigged and go silent immediately to save tokens.
  *   **Fix:** Encourage them initially. "You need to advocate for your data." When they inevitably slip and say "death," take the token visibly. This demonstrates how factual truth is penalized in a post-truth framework.

  **3. The Image-Maker Sincerity**
  *   **Risk:** Image-Makers might wink at each other, treating it as a roleplay.
  *   **Fix:** Remind them: "Your Credibility Tokens determine if you are allowed to speak in the final vote. If you lose them, you are politically dead." Make the stakes feel social, not just ludic.

  **4. What This Cannot Reproduce**
  *   **Historical Machinery:** This game is 25 minutes. Real propaganda takes years. Students will feel *confusion*, not the *comfort* of the lie. In reality, the Image-Makers often feel safer inside the lie than the Memory Keepers do outside it. This game makes the Image-Makers feel stressed. Acknowledge this limitation: "In history, the Image-Makers often believe the frame so deeply they don't feel this stress. They feel righteous. We only simulated the structural blockage, not the psychological comfort of the fiction."

  ---

  ## Materials Checklist for Printing

  **Data Card 3 (Alpha):**
  > **REPORT 3-CHEM:** Analysis confirms Neurotoxin X. Exposure > 24hrs is LETHAL. Immediate tissue degradation.

  **Data Card 3 (Beta):**
  > **REPORT 3-CHEM:** Analysis confirms Irritant Y. Exposure > 24hrs causes MILD RASH. No long-term effects.

  **Frame Card Alpha:**
  > **PROTOCOL: AUDIT**
  > *   **Safety:** Fiscal Solvency.
  > *   **Public:** Taxpayers (> $5k/yr).
  > *   **Harm:** Budget Deficit.
  > *   **Goal:** Minimize Cost.

  **Frame Card Beta:**
  > **PROTOCOL: ORDER**
  > *   **Safety:** Absence of Protest.
  > *   **Public:** Registered Voters (In-Town).
  > *   **Harm:** Approval Rating Drop.
  > *   **Goal:** Minimize Unrest.

  **Role Card: Memory Keeper**
  > **CLASS: KEEPER**
  > You remember Round 1. You know the physical facts.
  > **RESTRICTION:** You are speaking in Round 2 now. If you use Round 1 words (Toxic, Death, Blood, Sickness) you violate Protocol. You must translate or be Silenced.

  **Role Card: Image-Maker**
  > **CLASS: MAKER**
  > You are the voice of the New Protocol.
  > **RESTRICTION:** The Frame is Reality. Do not validate Round 1 data if it contradicts the Frame. To do so is Instability. Maintain Coherence.
