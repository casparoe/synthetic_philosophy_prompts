prompt: |-
  I'm the director of program ops at a mid-sized regional workforce nonprofit, and over the next year every contract we have is moving to outcomes-based payment: we propose the numbers, the state agency has to approve them, and somewhere between 40 and 60 percent of our funding sits on top of them. So a few times a month I'm going to be sitting there with a proposed metric in front of me, about a day to think about it, a board that wants money at risk to look like confidence, and a program staff who will quietly reorganize their entire week around whatever I pick. I'd like a written procedure my team can run on each candidate metric before it goes into a contract.

  The problem I keep running into is that "watch out for gaming" is too vague to be useful, and the standard advice I've seen either collapses into "measure everything" (we can't — we can properly audit maybe two things a quarter, the rest we get self-reported) or into "just use judgment" (which is what got us here). I've started sorting failure modes myself and I think there are at least five different things going on: hitting the number by serving people we'd have served anyway; sorting who we serve so the easy cases are the ones who count; the ratchet, where a good year becomes next year's floor; collateral, where something nobody put a number on gets worse while the headline improves; and what I think of as plain decay, where the proxy just stops tracking the thing we cared about over a couple of years even though nobody is cheating. I'd like you to clean that taxonomy up, throw away the parts that don't earn their keep, and add whatever's missing.

  What I actually need:

  - the questions in the order to ask them, and what counts as a real answer to each one rather than a shrug
  - where the procedure just stops with a no, and where it has to hand the question to a person because it's a values call and not a factual one
  - a distinction between metrics that are safe to put money on and metrics that are fine to report but must never carry payment — and what to do when the funder insists that at least three of the payment metrics be ours and at least half the money be at risk, so "use none of them" isn't available
  - a one-page version, plus a one-sentence plain-English "why this step" line under each question, because I have to defend the whole thing to a board member who will ask why we're making this so complicated
  - an honest note on which steps are judgment calls wearing a lab coat, and what the procedure deliberately doesn't try to do

  Then run the whole thing on three candidates: share of participants still employed 90 days after exit; median hourly wage at placement; and number of participants who complete a credential. That last one is the funder's favorite and my staff's favorite, and I have a bad feeling about it, so if the procedure says it can't carry money, say so plainly. And tell me what I'm supposed to do mid-contract when a metric that passed the procedure starts to look wrong, since nothing we sign is shorter than three years.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Director of Program Ops at a mid-sized regional workforce nonprofit.
      *   **Situation:** Moving to outcomes-based payment (OBC) contracts. 40-60% of funding at risk.
      *   **Constraints:** Limited audit capacity (2 deep dives/quarter, rest self-reported). Board wants risk to look like confidence. Staff will game the system (consciously or unconsciously) based on metrics. Funder insists on specific constraints (3 payment metrics, 50% at risk).
      *   **Current Problem:** "Watch out for gaming" is too vague. Existing advice is either "measure everything" (impossible) or "use judgment" (subjective).
      *   **User's Insight:** Has identified 5 failure modes (cream skimming, baseline inflation, ratcheting, collateral damage, proxy decay). Wants this taxonomy cleaned up and operationalized.
      *   **Deliverables:**
          1.  Ordered questions with criteria for "real answers."
          2.  Stop points (Hard No vs. Values Call).
          3.  Distinction between "Safe for Payment" vs. "Report Only."
          4.  Strategy for Funder constraints (can't say "use none").
          5.  One-page version + One-sentence "Why" for the Board.
          6.  Honest note on limitations (judgment calls in lab coats).
          7.  Application to 3 specific metrics (90-day employment, median wage, credential completion).
          8.  Mid-contract correction protocol.

  2.  **Refine the Taxonomy (Failure Modes):**
      *   *User's List:*
          1.  Serving people we'd have served anyway (Deadweight/Attribution).
          2.  Sorting who we serve (Cream Skimming/Cherry Picking).
          3.  The Ratchet (Good year becomes next year's floor).
          4.  Collateral (Unmeasured stuff gets worse).
          5.  Decay (Proxy stops tracking reality).
      *   *Critique:* "Ratchet" is a contract design issue, not strictly a metric validity issue (though related). "Deadweight" is hard for a nonprofit to prove without a control group. "Collateral" is crucial. "Decay" is crucial. "Sorting" is the biggest risk.
      *   *Refined Taxonomy:*
          1.  **Selection Bias (Cream Skimming):** Can staff exclude hard cases to hit the number?
          2.  **Attribution Gap (Deadweight):** Did we cause this, or would it happen anyway?
          3.  **Tunnel Vision (Collateral Damage):** Does hitting this number hurt unmeasured outcomes?
          4.  **Proxy Drift (Decay):** Does this number stop meaning what we think it means over time?
          5.  **Data Integrity (Auditability):** Can we verify this without bankrupting ourselves?

  3.  **Develop the Procedure (The "Gatekeeper" Protocol):**
      *   Need a linear flow.
      *   Need clear "Pass/Fail/Review" criteria.
      *   Need to address the "Money at Risk" vs. "Report Only" distinction.

      *   *Step 1: Control.* Can staff manipulate who enters the denominator? (Addresses Selection Bias).
      *   *Step 2: Causality.* Is the outcome tightly linked to our specific intervention? (Addresses Attribution).
      *   *Step 3: Trade-offs.* Does optimizing this hurt other important goals? (Addresses Tunnel Vision).
      *   *Step 4: Verification.* Can we audit this cheaply? (Addresses Data Integrity).
      *   *Step 5: Stability.* Will this metric make sense in Year 3? (Addresses Proxy Drift).

  4.  **Address the Constraints (Funder Demands):**
      *   Funder wants 3 payment metrics, 50% at risk.
      *   If a metric fails the "Payment" test, can it still be used? Yes, as a "Guardrail" or "Report Only."
      *   Strategy: Tiered Metrics. Tier 1 (Payment), Tier 2 (Guardrail/Threshold), Tier 3 (Report Only).
      *   If a metric is risky but required, mitigate via *weighting* (lower % of payment) or *thresholds* (payment only if baseline met).

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the tension.
      *   **The Taxonomy:** Clean up the user's 5 points into operational categories.
      *   **The Procedure (The 5 Gates):**
          *   Question.
          *   Real Answer vs. Shrug.
          *   Pass/Fail/Values Call.
          *   "Why" sentence.
      *   **Payment vs. Report Distinction:** Define the threshold.
      *   **The "Funder Insists" Protocol:** How to handle mandatory bad metrics (weighting, guardrails).
      *   **Mid-Contract Correction:** The "Circuit Breaker" clause.
      *   **Limitations:** Honest note on judgment calls.
      *   **One-Pager:** Condensed version for the Board.
      *   **Application:** Run the 3 metrics through the mill.
          *   *90-day Employment:* High risk of cream skimming. Hard to attribute.
          *   *Median Wage:* Good, but can encourage "placement at any cost" or ignoring those who can't earn high wages.
          *   *Credential Completion:* Funder/Staff favorite. High risk of "credential mill" (low value creds). Tunnel vision (ignoring job placement).
      *   **Verdict on Credentials:** Likely "Report Only" or heavily guarded payment.

  6.  **Refining the Tone:**
      *   Professional, direct, operational.
      *   Respectful of the user's expertise (they know the game).
      *   No fluff.
      *   Acknowledge the political reality (Board, Funder).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Ratchet"? *Adjustment:* The ratchet is more about contract negotiation than metric selection, but I should mention it in the "Stability" gate.
      *   *Check:* Did I distinguish between "Stop with a No" and "Hand to Person"? *Adjustment:* Make sure Gate 3 (Trade-offs) is explicitly a Values Call.
      *   *Check:* Is the One-Pager actually one page? *Adjustment:* Keep it tight.
      *   *Check:* The Credential metric. User has a bad feeling. I need to validate that feeling without just saying "no." The risk is low-value credentials. Mitigation: Quality filter on credentials.
      *   *Check:* Mid-contract fix. Need a specific mechanism. "Re-baselining" or "Metric Sunset."

  8.  **Final Polish:**
      *   Ensure the "Why this step" sentences are punchy for the Board.
      *   Make sure the distinction between "Payment Safe" and "Report Only" is clear.
      *   Ensure the "Funder Insists" section provides a workaround, not just a complaint.

  9.  *(Self-Correction on the "Ratchet")*: The user mentioned the ratchet as a failure mode. In a metric selection procedure, this manifests as "Is this metric sustainable?" If we hit 90% this year, can we hit 90% next year if the economy dips? I will incorporate this into Gate 5 (Stability).

  10. *(Self-Correction on "Attribution")*: Nonprofits often can't prove causality scientifically. The question needs to be pragmatic: "Is there a plausible alternative explanation we can't rule out?"

  11. *(Final check on the 3 metrics)*:
      *   90-day employment: Classic cream skimming risk.
      *   Median wage: Good outcome, but can lead to serving only high-skill candidates.
      *   Credentials: High gaming risk (easy certs). Needs quality control.

      *Decision:* I will recommend Credentials be a "Guardrail" (must hit X to get paid on Y) rather than a direct payment driver, or heavily weighted towards *recognized* credentials.

      *Let's build the response.*
answer: |-
  Here is the operational procedure you requested. It is designed to be run by your Ops team, defended to your Board, and negotiated with your Funder.

  ### Part 1: The Taxonomy of Failure (Refined)

  You identified five failure modes. I have consolidated them into four operational categories. "The Ratchet" is a contract negotiation issue, not a metric validity issue, so it is moved to the *Mitigation* phase. "Deadweight" and "Sorting" are combined under *Control*.

  1.  **Selection Bias (Cream Skimming):** Can staff manipulate the denominator to exclude difficult cases?
  2.  **Attribution Gap (Deadweight):** Would this outcome have happened without our intervention?
  3.  **Tunnel Vision (Collateral Damage):** Does optimizing this number degrade unmeasured but vital outcomes (e.g., job retention, well-being)?
  4.  **Proxy Drift (Decay):** Will this number stop correlating with success due to external changes (e.g., inflation, credential devaluation)?

  ---

  ### Part 2: The Metric Gatekeeper Procedure

  Run every candidate metric through these five gates in order. If a metric fails a "Hard Stop," it cannot be used for payment. If it fails a "Values Call," it requires Executive/Board approval.

  #### Gate 1: The Denominator Control
  **Question:** Can program staff influence *who* enters the pool of people counted in this metric without violating eligibility rules?
  *   **Real Answer:** A specific description of the intake workflow and the specific discretion points staff have (e.g., "Staff can delay enrollment until a candidate looks job-ready").
  *   **Shrug:** "We serve everyone who walks in." (False).
  *   **Verdict:** **Hard Stop.** If staff can exclude hard cases to boost the rate, the metric cannot carry payment weight.
  *   **Why this step:** *It prevents staff from winning the bonus by turning away the people who need us most.*

  #### Gate 2: The Causality Check
  **Question:** Is there a plausible scenario where we hit this number but the participant gained no actual benefit?
  *   **Real Answer:** A specific "null hypothesis" (e.g., "They would have found this job through a temp agency anyway").
  *   **Shrug:** "Our program is high quality."
  *   **Verdict:** **Values Call.** If the null hypothesis is strong, this metric moves to "Report Only" unless a comparison group is feasible.
  *   **Why this step:** *It ensures we are paid for change we caused, not for change that would have happened regardless.*

  #### Gate 3: The Trade-Off Audit
  **Question:** What important work will get deprioritized if we make this metric the primary focus of the week?
  *   **Real Answer:** A named activity that will suffer (e.g., "Long-term coaching will drop because we focus on immediate placement").
  *   **Shrug:** "We will just work harder."
  *   **Verdict:** **Values Call.** If the trade-off violates mission, reject. If it's acceptable, add a "Guardrail Metric" to monitor the deprioritized activity.
  *   **Why this step:** *It forces us to admit that measuring one thing always means ignoring another.*

  #### Gate 4: The Audit Cost
  **Question:** Can we verify this data point for less than 5% of the revenue attached to it?
  *   **Real Answer:** A specific data source and verification method (e.g., "UI wage records matched quarterly").
  *   **Shrug:** "We trust our case managers."
  *   **Verdict:** **Hard Stop.** If verification requires a deep-dive audit you can't afford, it cannot carry payment risk.
  *   **Why this step:** *It prevents us from betting our rent on data we cannot afford to prove is true.*

  #### Gate 5: The Stability Horizon
  **Question:** If the local economy worsens or the industry changes, does this metric punish us for external shocks?
  *   **Real Answer:** An analysis of historical volatility (e.g., "Placement rates dropped 20% in the last recession").
  *   **Shrug:** "We assume the economy will stay stable."
  *   **Verdict:** **Mitigation Required.** If volatile, it requires a "Re-baselining Clause" in the contract.
  *   **Why this step:** *It ensures we aren't penalized for a recession we didn't cause.*

  ---

  ### Part 3: Payment vs. Report Classification

  Not all metrics should carry financial risk. Use this matrix to classify the survivors of the Gatekeeper Procedure.

  | Classification | Criteria | Payment Weight | Action if Missed |
  | :--- | :--- | :--- | :--- | **Financial Penalty** |
  | **Payment Safe** | Passes all 5 Gates. Low gaming risk. High auditability. | Up to 100% of at-risk pool | Revenue is withheld. |
  | **Guardrail** | Passes Gates, but high risk of Tunnel Vision (Gate 3). | 0% (Threshold only) | Payment on *other* metrics is locked if this is missed. |
  | **Report Only** | Fails Gate 2 (Attribution) or Gate 4 (Audit). | 0% | No financial impact. Used for learning/branding. |

  **The "Funder Insists" Protocol:**
  If the funder mandates a metric that fails the "Payment Safe" test (e.g., they demand 3 payment metrics, but you only have 2 safe ones):
  1.  **Downweight:** Assign the risky metric the minimum allowable payment weight (e.g., 10% of the at-risk pool).
  2.  **Guardrail It:** Propose it as a threshold. "We get paid on Placement if Credential Completion is >X%." This satisfies their desire for the metric without betting the farm on it.
  3.  **Bundle It:** Combine the risky metric with a safer one into a composite index to dilute the gaming incentive.

  ---

  ### Part 4: Mid-Contract Correction (The Circuit Breaker)

  Nothing is shorter than three years. Metrics will rot. You need a **Metric Sunset Clause** in the contract language.

  *   **Trigger:** If a metric fails Gate 4 (Audit) unexpectedly, or Gate 5 (Stability) due to external shock (e.g., pandemic, industry collapse).
  *   **Mechanism:** A quarterly "Data Integrity Review." If variance exceeds 2 standard deviations from the 3-year rolling average without a corresponding change in program volume, the metric is suspended.
  *   **Remedy:** The metric converts to "Report Only" for the remainder of the term. Payment is re-allocated to a baseline flat fee or a different metric mutually agreed upon.
  *   **Why:** *It allows us to admit a metric is broken without being accused of breach of contract.*

  ---

  ### Part 5: Limitations (The Honest Note)

  This procedure does not eliminate risk; it makes the risk visible.
  *   **Judgment in Lab Coats:** Gate 3 (Trade-Offs) and Gate 2 (Causality) are inherently subjective. The procedure forces the subjectivity into the open, but it cannot calculate the answer for you.
  *   **What this doesn't do:** It does not protect you from a funder who refuses to negotiate contract language. If they demand a "Hard Stop" metric carry payment weight, you must treat that revenue as volatile grant income, not operational budget.
  *   **The Board Pitch:** This is not bureaucracy; it is financial risk management. We are treating performance metrics like investment assets.

  ---

  ### Part 6: The One-Pager (For the Board)

  **Subject:** Performance Metric Risk Protocol
  **Goal:** Protect 40-60% of organizational revenue tied to outcomes.

  1.  **Denominator Control:** Can staff game who gets counted?
      *   *Why:* Prevents staff from winning bonuses by turning away hard cases.
  2.  **Causality Check:** Did we cause the result, or would it happen anyway?
      *   *Why:* Ensures we are paid for our value, not luck.
  3.  **Trade-Off Audit:** What good work gets dropped to hit this number?
      *   *Why:* Measuring one thing always means ignoring another.
  4.  **Audit Cost:** Can we prove the data for less than 5% of the fee?
      *   *Why:* Prevents betting rent on data we can't afford to verify.
  5.  **Stability Horizon:** Does this metric survive a recession?
      *   *Why:* Ensures we aren't penalized for the economy.

  **Classification:** Metrics are tagged **Payment** (Safe), **Guardrail** (Threshold only), or **Report** (No money attached).
  **Correction:** Contracts include a "Circuit Breaker" to suspend metrics that decay mid-term.

  ---

  ### Part 7: Running the Candidates

  Here is the procedure applied to your three specific metrics.

  #### Candidate 1: Share of participants still employed 90 days after exit
  *   **Gate 1 (Control):** **FAIL.** Staff can delay "exit" until the participant is stable, or encourage participants to quit and re-enroll.
  *   **Gate 2 (Causality):** **FAIL.** 90-day retention is heavily influenced by the employer and the macro economy, not just your prep.
  *   **Gate 4 (Audit):** **PASS.** UI wage data is usually available.
  *   **Verdict:** **Report Only / Guardrail.**
  *   **Reasoning:** Too much external noise. If you put money on this, staff will pressure participants to stay in bad jobs for 91 days just to hit the metric, hurting long-term retention.
  *   **Mitigation:** Use as a Guardrail. "We get paid on Placement, provided 90-day retention does not drop below X%."

  #### Candidate 2: Median hourly wage at placement
  *   **Gate 1 (Control):** **RISK.** Staff may steer low-skill candidates away from the program to keep the median high.
  *   **Gate 2 (Causality):** **PASS.** Wage is a strong indicator of economic mobility.
  *   **Gate 3 (Trade-Off):** **HIGH RISK.** Focus shifts to "job first" rather than "career path." Participants placed in low-wage jobs become invisible liabilities.
  *   **Verdict:** **Payment Safe (with weighting).**
  *   **Reasoning:** This is a strong mission metric. However, it cannot be the *only* payment metric.
  *   **Mitigation:** Cap the payment weight at 20%. Add a "Participation Rate" guardrail to ensure you aren't skimming only high-earners.

  #### Candidate 3: Number of participants who complete a credential
  *   **Gate 1 (Control):** **PASS.** Hard to manipulate who completes a course once enrolled.
  *   **Gate 2 (Causality):** **PASS.** You control the training.
  *   **Gate 3 (Trade-Off):** **CRITICAL FAIL.** This is the "Credential Mill" risk. Staff will push participants toward the easiest, cheapest, lowest-value credentials to hit the number.
  *   **Gate 4 (Audit):** **PASS.** Certificates are easy to verify.
  *   **Verdict:** **NOT Payment Safe (as currently defined).**
  *   **Reasoning:** You have a bad feeling because this metric measures *activity*, not *value*. A credential that doesn't lead to a wage increase is a cost to the participant, not a benefit.
  *   **Fix:** Change the metric to "Number of participants completing a **recognized industry credential leading to a wage above $X**."
  *   **If Funder Insists on Raw Count:** Classify as **Guardrail**. It triggers payment on other metrics but does not generate payment itself. Do not put direct revenue at risk on raw credential counts.

  ### Summary Recommendation for Contract Negotiation

  1.  **Median Wage:** Accept as a Payment Metric (20% of at-risk pool).
  2.  **90-Day Employment:** Accept as a Guardrail (Threshold for payment, no direct penalty).
  3.  **Credential Completion:** Reject as a Payment Metric. Propose the "Wage-Adjusted Credential" alternative. If Funder refuses, accept as Guardrail only.
  4.  **Contract Language:** Insert the "Circuit Breaker" clause for all three.

  **Final Note to Director:** Your instinct on the Credential metric is correct. In outcomes-based contracting, **what you measure becomes what you manufacture.** If you measure credentials, you will manufacture credential holders. If you measure economic mobility, you will manufacture careers. Fight for the latter, even if it makes the contract harder to sign.
