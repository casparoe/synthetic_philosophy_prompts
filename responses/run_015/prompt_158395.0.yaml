      *   *Implication:* Responsibility tracks this robustness/sensitivity, not the raw ability to do otherwise in the actual sequence.
      *   *Philosophical Lineage:* This sounds like a sophisticated blend of *Fischer & Ravizza's* (guidance control), *Vihvelin's* (dispositionalism), and perhaps *Sartorio's* (causal history), but with a specific modal twist focusing on the *structure* of the counterfactuals rather than their truth value. It attempts to save a *version* of PAP by redefining "could have done otherwise" as "would have responded differently to different reasons/conditions despite the blocker."

  3.  **Brainstorming Defeaters (The "Exposure Map"):**

      *   *Conceptual:*
          *   **Actual Sequence vs. Alternative Sequence:** If responsibility supervenes *only* on the actual sequence (as Fischer argues), then the friend's focus on counterfactual stability is irrelevant. If the actual sequence is determined, the counterfactuals don't add freedom.
          *   **Sourcehood vs. Leeway:** If sourcehood requires *ultimate* origination (inegalitarian theories), counterfactual stability within a determined framework doesn't help.
          *   **The "Flicker" Strategy:** Standard objection: There *are* alternative possibilities (e.g., deciding on one's own vs. being forced). The friend says this *is* the relevant openness. *Counter:* Are these alternatives *robust* enough to ground responsibility? If the alternative is just "being forced," does that count as freedom?
          *   **Causal Closure:** If the actual sequence is causally closed (deterministic), does counterfactual sensitivity matter? (Compatibilist say yes, Incompatibilist say no).

      *   *Empirical/Theoretical:*
          *   **Neural Predictability (Libet/Haynes):** If decisions are predicted before awareness, the "volitional pathway" might be an illusion. The "robustness" is just neural noise thresholding.
          *   **Counterfactual Reasoning Studies:** If people attribute responsibility based on *actual* causation, not counterfactual stability, the friend's theory is psychologically unrealistic.
          *   **Phenomenology:** If agents don't *feel* the counterfactual sensitivity, is it morally relevant?

      *   *Frankfurt Mechanism Specifics:*
          *   **Prior Signs:** If the intervener relies on a prior sign, the agent *could* have avoided the sign (flicker). The friend embraces this. *Defeater:* What if the sign is infallible and causally determined? Then the "avoidance" is illusory.
          *   **Blockage Cases:** (Kane, Ginet). No intervener, just neural blockage. No counterfactual intervener to create "dependency." If responsibility holds here, the friend's "intervener dependency" theory fails.
          *   **Authorship Corruption:** If the *presence* of the device (even unused) changes the metaphysical status of the act (e.g., makes it a joint action or coerced context), then the "robustness" is tainted.

      *   *Insulation/Unfalsifiability:*
          *   If every failure of robustness is redefined as a "different kind of relocation," the theory is vacuous.
          *   Example: If the agent *does* waver and is forced, the friend says "See, robustness failed." If the agent doesn't waver, "See, robustness held." Is this testable?

  4.  **Structuring the Response:**

      *   **Introduction:** Acknowledge the sophistication of the friend's view (it's a "Modal Relocation" strategy).
      *   **Section 1: Conceptual Collapses (The Metaphysical Fault Lines).** Focus on Actual Sequence vs. Alternative Sequence, and the nature of "Robustness."
