      *   *Self-Correction on "Saving PAP":* Wait, the prompt says "PAP fails not because responsibility is compatible with causal closure, but because the 'could have done otherwise' condition was always mislocated." So they admit PAP (as standardly formulated) fails, but the *intuition* behind it is preserved via relocation. Okay, I need to attack the *relocation*.
      *   *Key Distinction:* **Dispositional vs. Categorical.** Is the ability a disposition (friend's view) or a categorical possibility (incompatibilist view)?
      *   *Key Distinction:* **Extrinsic vs. Intrinsic.** The friend makes freedom depend on an *extrinsic* factor (the intervener's monitoring). Most theories want freedom to be intrinsic to the agent.

  7.  **Finalizing the Ranking:**
      *   *Fatal:* Blockage Cases (removes the intervener), Intrinsicness Intuition (freedom shouldn't depend on hidden devices).
