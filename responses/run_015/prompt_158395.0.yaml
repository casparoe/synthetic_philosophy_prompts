      *   *Fatal Defeater:* **The "No Difference" Claim.** If the actual sequence is identical in a world with the device and a world without, and responsibility is the same, then the device's "modal dependency" is irrelevant. The friend claims the device *creates* the relevant modality. But if the device does nothing, how does it create modality?
      *   *Serious Defeater:* **Robustness Requirement.** (Stump, Widerker). Even if there are flickers (deciding on own vs. forced), are they *robust*? If the alternative is just "being forced," can that ground responsibility? The friend says yes (it tracks sensitivity). The incompatibilist says no (it's not a morally significant alternative).
      *   *Insulation:* If "robustness" is defined purely by the outcome (responsibility assigned -> robustness existed), it's circular.
      *   *Standard Defender Concession:* Fischer would agree that *alternative sequences* don't matter, but he might disagree that *counterfactual stability* matters in the way the friend says. Fischer focuses on *reasons-responsiveness*, not just counterfactual stability relative to an intervener.

