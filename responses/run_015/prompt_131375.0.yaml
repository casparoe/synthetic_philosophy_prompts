  **Grad Seminar: Social Epistemology — Final Exam**
  **Time:** 90 Minutes
  **Total Marks:** 25

  **Question 1**
  Consider two mathematicians, A and B. They are established epistemic peers in number theory with identical track records. They encounter a disagreement over Lemma L in a new preprint. A claims B misreads a notational convention standardized only in 2022; B claims A is overfitting to an old heuristic. Crucially, while they agree they are peers on general math, they disagree on whether they are peers regarding the *interpretation of this specific notation*. A thinks B is incompetent on new notation; B thinks A is rigid on heuristics.

  Enter C, a third peer who knows A and B have identical track records but has not seen the proof or the notation in question.

  Write an essay addressing the following:
  1. Does conciliationism still require belief revision for A or B, given they dispute the source of the disagreement?
  2. Is steadfastness defensible here without begging the question?
  3. What opinion should C adopt, and does the disagreement about the *source* of disagreement undermine the conciliationist mandate generally?

  *(Note: Avoid standard summaries. Focus on the higher-order implications of the notation dispute.)*

  ***

  **Model Answer**

  The scenario presents a layered disagreement that stress-tests standard social epistemology frameworks. Usually, peer disagreement mandates conciliation because the fact of disagreement itself acts as higher-order evidence that one might be wrong. However, when the disagreement includes a dispute over *why* the disagreement exists—specifically regarding competence on notation—the calculus shifts.

  For A and B, strict conciliationism faces a hurdle. The conciliationist mandate typically triggers when agents recognize each other as epistemic peers regarding the specific question at hand. Here, A believes B is failing on a 2022 convention, while B believes A is failing on heuristic application. This is a "peerhood defeater." If A has independent reason to believe the notation is non-negotiable (e.g., A checked the 2022 standard), A can downgrade B's status on this specific issue without circularity. Therefore, conciliationism does not strictly require belief revision if the agent can isolate the disagreement to a specific competence failure they have independent access to. A isn't ignoring B's disagreement; A is reclassifying B as a non-peer on *this* variable. However, if A's knowledge of the notation is itself shaky, conciliationism demands suspension of judgment. The key is whether the "notation error" is first-order evidence or just a story told to protect belief.

  Steadfastness is defensible here, but only if it leans on first-order evidence rather than mere stubbornness. The standard critique of steadfastness is that it ignores the higher-order evidence of the peer's dissent. But in this math case, the "dissent" is explained away by the notation claim. If A can point to the 2022 document and say, "The rule is X," that is independent access to the truth-maker. It avoids circularity because the justification isn't "I'm right because I believe I'm right," but "I'm right because the convention dictates X." The risk, of course, is that B has the same confidence in the heuristic. Steadfastness works only if one side actually has a grip on the independent evidence (the convention text) that the other lacks. If both are just guessing about the convention, steadfastness collapses into dogmatism.

  C's position is the most revealing. C lacks first-order access to the proof or notation. C only knows the track records are identical. Standard conciliationism suggests C should suspend judgment on L. However, C also knows A and B disagree on *why* they disagree. C should recognize this meta-disagreement as a sign that the error likely lies in the framework, not just the calculation. C cannot simply split the difference on L because C doesn't know L's content. Instead, C should suspend judgment on the *competence* claims too. C shouldn't trust A's claim about the notation over B's claim about heuristics without seeing the proof. C's rational stance is total suspension until the notation is verified externally.

  Finally, does this undermine conciliationism? It suggests conciliationism is too brittle when peerhood is contested. If peers can always opt out of conciliation by claiming the other made a specific competence error (notation vs. heuristic), the mandate becomes optional. This is the "self-serving downgrade" problem. To save conciliationism, we must require that the reason for downgrading peerhood be checkable by a third party like C. Since A and B's reasons (notation vs. heuristic) are internal to their processing until verified, the disagreement about the source of disagreement effectively neutralizes the conciliationist mandate until independent verification occurs. Thus, conciliationism doesn't fail, but its trigger condition—recognized peerhood—is harder to satisfy in technical disputes where the rules of engagement are themselves disputed. The existence of a meta-disagreement shifts the burden from belief revision to evidence verification.

  ***

  **Marking Scheme (25 Marks Total)**

  **1. Identification of Peerhood Conditions (5 Marks)**
  *   **Move:** Student must identify that conciliationism relies on *recognized* peerhood regarding the specific issue, not just general track records.
  *   **A vs B Note:** A-grade identifies the "peerhood defeater"; B-grade treats them as automatic peers despite the notation dispute.

  **2. Conciliationist Revision Analysis (5 Marks)**
  *   **Move:** Student must argue that revision is not required if independent access to the notation standard exists (downgrading peer status).
  *   **A vs B Note:** A-grade distinguishes independent access from mere assertion; B-grade says conciliationism always requires splitting the difference.

  **3. Steadfastness and Circularity (5 Marks)**
  *   **Move:** Student must explain how steadfastness avoids circularity by appealing to first-order evidence (the convention text) rather than confidence.
  *   **A vs B Note:** A-grade links non-circularity to independent evidence; B-grade claims steadfastness is always circular or always fine.

  **4. Third Party C's Epistemic Stance (5 Marks)**
  *   **Move:** Student must argue C should suspend judgment on both the lemma and the competence claims due to lack of first-order access.
  *   **A vs B Note:** A-grade sees C's suspension extends to the meta-claims; B-grade thinks C should just average A and B's views.

  **5. Meta-Disagreement Implication (5 Marks)**
  *   **Move:** Student must conclude that disputed sources of disagreement weaken the conciliationist mandate by making peerhood contingent on verification.
  *   **A vs B Note:** A-grade synthesizes this as a structural limit on conciliationism; B-grade treats it as a one-off exception without broader implication.

  *(Oops, missed a comma in point 3 above, but you get the gist.)*
