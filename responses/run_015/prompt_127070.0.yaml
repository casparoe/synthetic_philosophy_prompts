      *   *Reading 3 (Gene Flow Chain):* The "Ring Species" problem. Defensible in evolutionary terms, but makes "species" very large. Supports (a)? Maybe. Supports (b)? Yes, implies a continuum.
      *   *Reading 4 (Ecological/Phenological):* This is the User's strong point. Pre-zygotic isolation. Defensible. Supports keeping them separate.
      *   *Reading 5 (Purpose):* Why the list? If for gardening, keep separate (different soils/bloom). If for genetics, maybe merge.

  5.  **Refining the Argument (Philosopher's Touch):**
