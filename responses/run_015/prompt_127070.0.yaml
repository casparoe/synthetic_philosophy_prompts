      *   *Direct vs. Indirect Gene Flow:* The southern population connects them. Does A interbreed with C, and C with B, make A and B the same species? (Ring species problem).
      *   *Fertility:* F1 hybrids are fertile. What about F2? Backcrosses? The prompt says "seedlings come out fully fertile," implying F1 fertility, maybe F2.
      *   *The Goal (a) vs. (b):*
          *   (a) Merge on the plant list (Practical/Taxonomic).
          *   (b) They were never distinct things (Ontological/Metaphysical).
      *   *The "Continuous Variable" Claim:* This implies clinal variation vs. discrete clusters. Even if they interbreed, they might be distinct ecological morphs.
      *   *Philosophical Angle:* Species are hypotheses, not immutable truths. The concept used depends on the purpose (conservation, gardening, evolutionary study).

  3.  **Drafting the "Menu of Readings":**
