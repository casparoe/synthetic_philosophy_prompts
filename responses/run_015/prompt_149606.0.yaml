answer: |-
  Here is a principle that captures your verdicts, followed by the analysis you requested.

  ### The Principle: Contingent Norms and Causal Coherence

  A generalization about a group is permissible only if it satisfies **all five** of the following clauses. If a claim violates any one of them, it slips from cultural analysis into prejudice.

  1.  **The Mechanism Clause:** The claim must describe **institutions, incentives, or learned social norms**, not innate psychological essences.
      *   *Forced by:* **Cases 3, 4, and 7.**
      *   *Reasoning:* "Swiss neutrality" (institution), "Nordic trust" (surveyed social capital), and "Danish welfare" (structural loop) survive the slow-swap test because they are external to the individual. "Swiss cold," "Emotionally frozen," and "French wit" attribute the trait to the internal human material, which implies immutability.
  2.  **The Valence Clause:** The claim must be **functional or descriptive**, not morally evaluative.
      *   *Forced by:* **Cases 1 and 2.**
      *   *Reasoning:* "Direct" describes a communication protocol (functional). "Stingy" describes a moral failing regarding resource allocation (evaluative). Even if both are behavioral, one maps a workflow, the other assigns a vice.
  3.  **The Capacity Clause:** The claim must describe a **preference or habit**, not an incapacity.
      *   *Forced by:* **Case 6.**
      *   *Reasoning:* "Want the agenda" predicts a preference based on workflow norms. "Can't do small talk" asserts a biological or deep-psychological inability. The latter dehumanizes; the former prepares you.
  4.  **The Standpoint Clause:** The claim must be **self-ascribed** or **externally verified**, not imposed by an outsider without consent.
      *   *Forced by:* **Case 5.**
      *   *Reasoning:* A Dubliner saying "We drink" is performing solidarity or self-critique (internal authority). An Englishman saying it is applying a label (external prejudice). Content is identical; authority differs.
  5.  **The Coherence Clause:** The group must be defined by **shared causal history or institutional membership**, not arbitrary statistical boundaries.
      *   *Forced by:* **Case 8.**
      *   *Reasoning:* Bavaria and Berlin share historical, political, and institutional paths that causally produce different norms. Surname initials do not. The partition is valid only if the boundary explains the trait, not just correlates with it.

  ---

  ### Application to Unlisted Cases

  Here is how this principle handles generalizations beyond the nation-state.

  **1. About a Profession ("Litigators are combative")**
  *   **Verdict:** **Fine.**
  *   **Analysis:** Satisfies Mechanism (incentive structure of the law), Valence (functional description of role), and Coherence (shared training and institutional environment).
  *   **Constraint:** "Litigators are sociopaths" would fail (Valence/Mechanism).

  **2. About a Generation ("Gen Z is addicted to phones")**
  *   **Verdict:** **Borderline/Not Fine.**
  *   **Analysis:** Fails Mechanism. It attributes a behavioral outcome to a generational *essence* rather than the technological environment they all share.
  *   **Correction:** "Gen Z faces different attentional incentives due to smartphone ubiquity" is Fine. "Gen Z is distracted" is Not Fine.

  **3. About a Country's Electorate ("The electorate swung right")**
  *   **Verdict:** **Fine.**
  *   **Analysis:** Satisfies Mechanism (observable action/vote) and Valence (descriptive).
  *   **Constraint:** "The electorate is angry" is Not Fine (psychological attribution). "The electorate voted for populist parties" is Fine.

  **4. About a Defunct State ("Prussians were militaristic")**
  *   **Verdict:** **Fine (as history).**
  *   **Analysis:** Satisfies Coherence (historical institutional unity) and Mechanism (state culture).
  *   **Constraint:** This works only as historical analysis of a specific institutional period. "Germans are Prussian" today would fail Coherence and Mechanism.

  ---

  ### Which Verdicts This Account Cannot Accommodate

  You asked me to state plainly where this principle conflicts with your intuition. There is one significant friction point:

  **Case 1 ("The Dutch are direct")**
  *   **The Conflict:** Your verdict is "Fine." My Principle flags this as **risky shorthand.**
  *   **Why:** Grammatically, "The Dutch *are* direct" asserts a property of the *people* (Essence), not the *culture* (Norm). It violates the strict reading of the Mechanism Clause. It is only "Fine" if the reader understands it as a charitable abbreviation for "In the Netherlands, directness is the social norm."
  *   **The Risk:** Because the phrasing mimics essentialism ("The Dutch are..."), it invites the listener to slide into Case 2 ("The Dutch are stingy"). Your principle allows the *thought*, but the *phrase* is dangerous. To be fully consistent, you should write: "Dutch business culture prioritizes directness."

  **Case 8 (Bavaria vs. Surnames)**
  *   **The Conflict:** You feel you have "no principled reason" to treat Bavaria as real and surnames as fake.
  *   **The Resolution:** The principle provides one: **Intersubjective Reality.** Bavarians *believe* they are Bavarians and act on it (causal history). People with surnames A–M do not. The group is "real" only if the members recognize the boundary as socially significant. If you accept this, Case 8 is accommodated. If you demand a biological or geographic "realness," neither case works.

  ---

  ### Conclusion: Is "National Character" Coherent?

  **No.** You should retire the phrase.

  "Character" implies something innate, stable, and internal to the individual (psychological essence). Your "Fine" verdicts are exclusively about **contingent, external, and institutional norms.**

  *   When you say "The Dutch are direct," you are describing a **script**.
  *   When you say "The Swiss are neutral," you are describing a **policy**.
  *   When you say "Nordics trust institutions," you are describing **social capital**.

  None of these are *character*. They are **technologies of living** that can be adopted, discarded, or swapped (as your slow-swap test intuitively recognized).

  **Recommendation:** Replace "National Character" with **"Cultural Norms"** or **"Institutional Habits."**
  *   "Character" asks: *Who are they?* (Essence)
  *   "Norms" ask: *What do they do here?* (Behavior)

  Your intuition is correct: you can write about how nations behave without asserting who nations *are*. The moment you switch from the latter to the former, you lose the justification for your confidence.
