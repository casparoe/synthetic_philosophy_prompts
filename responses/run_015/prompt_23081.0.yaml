answer: |-
  This is a fantastic debate because it pits two modern interpretations against an ancient materialist framework. To figure out who is right, we have to look at three core pillars of Epicureanism: **Materialism (what you are), the Nature of Death (what happens when you end), and the Goal of Life (what you should want).**

  Here is the breakdown of where Epicurus would likely stand.

  ### 1. The Metaphysics: Is the Copy "You"?
  **Verdict: You are right. The copy is a new person.**

  Epicurus was a strict materialist and an atomist. He believed that everything, including the soul (*psyche*), is made of physical atoms. Your consciousness is the result of a specific arrangement of "soul atoms" intermingled with your body atoms.

  *   **The Atomic Argument:** For Epicurus, identity is tied to the physical continuity of that specific atomic arrangement. When you die, the body decomposes and the soul atoms scatter. That specific configuration is lost forever.
  *   **The Scan Problem:** Mind uploading (in the "scan and copy" scenario) usually implies the destruction of the biological brain or at least a break in physical continuity. Even if the computer simulates your neurons perfectly, it is made of different "atoms" (silicon/electrons vs. carbon/bio-chemistry).
  *   **Epicurus's View:** To Epicurus, a perfect copy is still a *copy*. It is a new arrangement of matter. The original arrangement (you) has ceased. Therefore, metaphysically, the digital entity is a new person who merely *thinks* they are you.

  **So, on the question of identity, your intuition aligns better with Epicurean physics.** The original "you" still ceases to exist.

  ### 2. The Ethics: Does the Copy "Save" You from Death?
  **Verdict: Your friend is partially right about experience, but wrong about the implication.**

  Your friend argues: *"Death is only bad if you experience it. With uploading, you keep going, so you don't experience death."*

  Epicurus's famous quote is: *"When we exist, death is not; and when death exists, we are not."*

  *   **The Original:** Since the original biological you ceases to exist (as established above), the original you *does* undergo death. However, per Epicurus, this is not a harm. The original you doesn't experience "being dead." You just stop.
  *   **The Copy:** The copy does not experience death *at the moment of upload*. It experiences continuity.
  *   **The Crucial Distinction:** Epicurus's argument isn't that we should try to avoid death; it's that we shouldn't **fear** it. He argues that death is "nothing to us."
      *   If you upload, the original you still dies. But since death is nothing to us, the original you suffers no harm.
      *   The copy gets to continue experiencing pleasure (which is good), but that doesn't change the status of the original's death.

  **Does the distinction matter for his argument?**
  Actually, **no.** This is the twist. Epicurus's whole point is that it doesn't matter if the copy is you or not, because **the cessation of the original is not a bad thing anyway.**

  Your friend thinks uploading is necessary to avoid the "badness" of death. Epicurus would say, "Death isn't bad, so you don't need to upload to avoid the harm." You are right that the original dies, but Epicurus would tell your friend that the original dying is irrelevant to the original's well-being.

  ### 3. The Goal of Life: Immortality vs. Ataraxia
  **Verdict: Epicurus would likely advise against seeking uploading.**

  This is the strongest argument against your friend's position. Epicurus believed the goal of life is *ataraxia* (freedom from anxiety) and *aponia* (absence of pain). He categorized desires into three types:
  1.  **Natural and Necessary:** (Food, shelter, friendship).
  2.  **Natural but Unnecessary:** (Fancy food, luxury).
  3.  **Vain and Empty:** (Fame, power, **immortality**).

  Epicurus explicitly argued that the fear of death drives people to seek endless life, which is a "vain desire." He believed a wise person is content with a finite life. In the *Vatican Sayings*, he writes:
  > *"The wise man neither deprecates life nor fears death... he does not deprecate life, nor is he afraid to cease to live."*

  *   **The Anxiety of Uploading:** Pursuing mind uploading suggests you are *afraid* of ceasing to live. For an Epicurean, this anxiety is the real problem, not the death itself. Chasing digital immortality would likely create more anxiety (fear of server failure, hacking, obsolescence) than it cures.
  *   **The Limit of Pleasure:** Epicurus argued that once pain is removed, pleasure cannot be increased, only varied. You don't need *infinite* time to maximize pleasure; you need a complete life. He famously said, *"Infinite time and finite time contain equal pleasure, if one measures its limits by reason."*

  ### The Final Ruling

  If you brought this before Epicurus, here is how he would likely rule:

  1.  **On Identity (You Win):** The digital copy is a new entity. The original atomic arrangement is dissolved. The original "you" is dead.
  2.  **On Harm (Draw):** You are right that the original dies. Your friend is right that the copy feels alive. But Epicurus says the original's death is no harm regardless.
  3.  **On the Choice (Epicurus Sides with You):** He would likely tell your friend that seeking uploading is based on a false fear. Since death is nothing to us, trying to escape it through technology is a "vain desire" that disturbs the peace of mind (*ataraxia*).

  **Summary for your argument:**
  Tell your friend: *"Epicurus wouldn't care about the copy because he doesn't think the original's death is a tragedy. He would say you're only uploading because you haven't truly understood that death is nothing. The copy might be happy, but the original still dies, and that's fine."*

  You are right that it's a copy. But Epicurus would add: *"And even if it is the real you, why are you so afraid of the end that you need to run to a computer?"*
