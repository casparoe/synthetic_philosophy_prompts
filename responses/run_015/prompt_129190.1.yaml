answer: |-
  1. The Setup and Audience Calibration
  Open by validating their competence. Explicitly state: "Everyone in this room is highly effective at running their own organization. If we were failing individually, this would be a management workshop. It is not." Frame the session as a diagnostic of the *environment* we operate in, not the *people* operating within it. Use the phrase "structural incentive mismatch" early to signal that this is about systems, not morals. Acknowledge the tension: "We are seeing behaviors that look like competition, but the outcome looks like failure for all of us." Establish psychological safety by admitting you are subject to the same pressures. The goal is to shift the locus of blame from individual bad faith to institutional architecture. If they feel accused, they will defend their organizations; if they feel analyzed, they will analyze the system. Your opening must make them feel like co-investigators diagnosing a virus, not patients being told they are sick.

  2. Dependency Order of Ideas
  You must build the concept brick-by-brick; skipping steps will cause them to revert to moral judgments. First, establish **Individual Rationality**. Demonstrate that each organization's recent decisions were logically sound given their survival needs. Without this baseline, the subsequent collective failure looks like stupidity rather than a trap. Second, layer **Collective Irrationality**. Show how summing these rational decisions produces a result no one wanted (the degraded climate agenda). This creates the cognitive dissonance required for learning.

  Third, introduce **Multipolarity**. This is the critical pivot. You must distinguish this from a standard Prisoner's Dilemma. In a two-party dilemma, communication can solve the problem. In a multipolar trap, there are too many actors to negotiate side-deals, and defection by *any* single new entrant collapses the cooperation. This distinction must land before discussing solutions, or they will suggest simple memorandums of understanding that won't hold.

  Fourth, introduce **Metric Substitution**. Only after they accept the trap should you reveal the mechanism fueling it. Explain that grant requirements force intermediate indicators (number of beneficiaries served now) to replace terminal goals (regional climate resilience). This depends on the previous steps: if they still think the problem is moral, they will view metric manipulation as cheating. If they understand the trap, they will see it as a survival response. The structure must feel inevitable: Rational Actors + Multipolar Pressure + Distorted Metrics = Systemic Failure.

  3. The Carrying Example
  Build the entire session around a hypothetical but transparently mirrored scenario: "The Regional Resilience Grant." Describe three similar nonprofits competing for one restricted fund. Each needs the money to keep staff employed (individually rational). If they collaborate, they submit one joint proposal, increasing success odds but reducing individual control and credit. If they compete, they submit three weaker proposals, diluting the field, but ensuring each has a chance at survival. The funders require short-term output metrics (e.g., "trees planted this quarter") rather than long-term outcomes (e.g., "flood risk reduced over decade").

  This example works because it removes the villain; the funder isn't evil, they just have reporting requirements. The organizations aren't greedy; they need payroll. The outcome—three fragmented projects that fail to lower regional risk—is something no director chose. Avoid AI or nuclear examples because they feel distant and deterministic. Avoid corporate tax examples because they imply profit motivation rather than mission survival. This specific scenario forces them to recognize their own reflection without requiring them to confess specific sins. It isolates the variables: multiple independent decision-makers, clear incentives, and a collective loss emerging from individual safety-seeking.

  4. Misconception Map
  Directors will default to familiar mental models. You must intercept these explicitly.

  First, **"This is just greed."** Intercept this during the Individual Rationality phase. Use the pivot: "If you swapped the people in these chairs but kept the incentives, the outcome would not change. This is not a character problem; it is a physics problem."

  Second, **"It's just a Prisoner's Dilemma; we just need to talk."** Intercept this at the Multipolarity phase. Use the pivot: "In a two-party dilemma, you can call the other guy. In a multipolar field, you cannot call every future competitor or ensure every board member honors the handshake. Coordination costs scale faster than trust."

  Third, **"If we shared information, we could align."** Intercept this before proposing solutions. Use the pivot: "Transparency helps, but if the incentive to defect remains, knowing someone else is defecting only forces you to defect faster to survive. Information does not fix misaligned payoffs."

  Fourth, **"Metric substitution is just gaming the system."** Intercept this at the Metric phase. Use the pivot: "Gaming implies there is a right way to play. When the metric becomes the condition for your existence, chasing it isn't cheating; it is organizational self-defense. We are not punishing bad actors; we are identifying brittle incentives."

  5. The Understanding Check
  End with a single diagnostic question: "If we all signed a pledge today to stop competing for this grant and collaborate, what is the most likely reason that pledge would fail within six months?"

  **Correct Answer:** They identify a structural pressure, such as "A new organization enters the region and takes the money," or "Our board fires us if we miss short-term targets," or "The funder changes the rules." This shows they understand the trap is external and dynamic.

  **Wrong Answer:** They identify a moral failure, such as "Someone will get greedy," or "We won't trust each other enough." This indicates they reverted to the moral model.

  **Interpretation:** If they give wrong answers, do not correct them publicly. Instead, say, "That suggests we still feel the pressure is internal. Let's look again at the funder's requirements." This keeps the focus on the system without shaming their grasp of the concept.

  6. What to Leave Out and Say So
  Explicitly exclude formal game theory matrices, historical case studies (like overfishing or arms races), and references to specific philosophers or AI safety thinkers. Say this directly: "We are not studying academic theory today, and I am not going to show you payoff matrices. Those tools are designed for abstraction, not for fixing our consortium's workflow next week." Signal that this omission is for speed and relevance, not lack of rigor. By declaring what you are *not* doing, you prevent them from wondering why the session lacks academic weight. It frames the session as an operational workshop rather than a lecture. This protects your credibility as a practitioner focused on solutions, not a theorist focused on definitions. Keep the language operational: use words like "incentive structures," "reporting requirements," and "survival constraints" instead of "Nash equilibria" or "moloch."
