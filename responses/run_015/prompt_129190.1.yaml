prompt: |-
  I recently joined the steering committee of a regional nonprofit consortium, and within two months I watched three member organizations quietly undermine our shared climate-adaptation agenda because each was individually incentivized to chase the same restricted grant pool and to report short-term metrics that made collaboration look like failure. I need to run a single ninety-minute working session for the other directors—smart, experienced people, but with no background in game theory or philosophy—to teach them the dynamics of multipolar traps and races to the bottom, not as an abstract parable about artificial intelligence or nuclear arms, but as an institutional pattern they are living right now.

  Please do not explain the concept to me; instead, plan how I should explain it. Structure your response in the following sections, in this order, with approximate lengths:

  1. The Setup and Audience Calibration (about 150 words): How I should frame the session's purpose in the first five minutes given that they will likely think I am accusing them of bad faith, and how to establish that the pattern is structural rather than moral.

  2. Dependency Order of Ideas (about 400 words): The sequence in which the conceptual pieces must be introduced—what has to be in place before multipolarity can be distinguished from simple competition or collective-action failure; why the distinction between a prisoner's dilemma and a true multipolar trap matters pedagogically; where in the sequence I should introduce the framing that these traps often operate through "metric substitution" (intermediate indicators becoming terminal goals) rather than through explicit conflict over outcomes; and which idea depends on which so that the structure feels inevitable rather than assembled.

  3. The Carrying Example (about 300 words): Specify the one concrete scenario I should build the entire explanation around—what it must include (multiple independent decision-makers, individually rational moves, a collective outcome that no one chose) and what it must exclude (a single villain, a lack of information, or a purely technological driver). Explain why this example should work for this audience, and why the standard "AI race" or "corporate tax-abatement" examples should be avoided or deferred at this stage.

  4. Misconception Map (about 350 words): The predictable misconceptions these directors will form or bring—such as "this is just prisoner's dilemma with more players," "the problem is that people are selfish," or "if we just share information it solves itself"—and exactly where in the sequence each should be headed off, with the specific pivot or sentence I should use. Include the misconception that metric substitution is merely "gaming the system" rather than a rational response to misaligned incentives.

  5. The Understanding Check (about 150 words): One question or brief exercise at the end that would reveal whether they have grasped the structural logic rather than just the emotional narrative, plus what wrong answers would sound like and how to interpret them without shaming anyone.

  6. What to Leave Out and Say So (about 150 words): Which standard elements—historical cases, formal payoff matrices, references to specific thinkers—should be explicitly set aside for this session, and how I should signal that omission without undermining credibility.

  Keep the explanation focused on institutional dynamics in nonprofit or public-sector coalitions; do not ask for bibliographies, reading lists, or citations.
