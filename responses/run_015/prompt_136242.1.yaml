  Recommendation: Approve the application for £8,000.

  Notification Timeline: The applicant must be informed of the decision within five working days following next Tuesday's vote.

  The division on this panel reflects a tension between material definition and public reception. The strongest argument against funding this project is that it conflates waste management with artistic practice. Colleagues arguing for rejection are right to insist that not every altered object qualifies as sculpture, and there is a genuine risk that we subsidize environmental activism under the guise of arts funding. If the primary outcome is cleanup rather than aesthetic engagement, we misallocate resources intended for cultural development. This concern protects the integrity of the term 'art' and ensures fiscal responsibility. We must acknowledge that labeling recycling as art can dilute the value of both endeavors.

  However, I recommend approval because our funding criteria prioritize the capacity of a project to generate public response over the traditional status of its materials. Whether something counts as art depends partly on how people respond to it, not on a hidden fact about the plastic itself. By melting and reforming the waste into large-scale installations, the applicant is attempting to shift the public's perception of the material from refuse to medium. If the work successfully provokes thought or emotional engagement regarding consumption and environment, it fulfills the function of art within our community. Rejecting the proposal based on a semantic dispute over the word 'sculpture' would privilege historical forms over contemporary conceptual practice. We should fund the potential for meaningful encounter, provided the applicant commits to presenting the work in a context that invites artistic interpretation rather than treating it as mere infrastructure.

  Approval is contingent on the applicant submitting a finalized exhibition plan within one month, demonstrating how the installations will be contextualized as art for the public. This ensures the project remains accountable to our artistic mission while accommodating the innovative use of materials.
