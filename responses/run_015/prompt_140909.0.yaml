answer: |-
  # CLASSIFICATION INSTRUMENT: COGNITIVE INFLUENCE ON PERCEPTION

  **Introduction to the Logical Space**
  This instrument maps the space of possible positions regarding how mental states affect sensory processing. The space is defined by **10 Branch Questions** (Nodes). Each node offers 2 or 3 answers. Theoretically, this creates **1,536 answer-combinations** (assuming a mix of binary and ternary splits). However, most combinations are incoherent or unoccupied. The flowchart below routes you to one of **14 Leaves**, which represent the actual positions held (or logically constructible) in the literature.

  **Note on Orthogonality (Constraint 3d):** The "Shape of Change" distinction (Additive vs. Substitutive vs. Occlusive) is **not strictly orthogonal** to the "Dependent Variable" node. If one holds that only *performance* changes (not appearance), the "Shape" question is undefined. Therefore, the flowchart routes "Performance-only" answers directly to a leaf, bypassing the Shape node. This reflects the logical dependency: Shape presupposes Appearance.

  **Instructions:** Start at Node 1. Answer based on how you judge the concrete vignettes (V1–V6) provided at the end of this handout. Do not consult your theoretical commitments; consult your intuitions about the cases. Follow the routing until you reach a Leaf.

  ---

  ## THE FLOWCHART

  **Node 1 (Dependent Variable):** When the mental state affects the task, does the subject report a change in *phenomenal character* (how it looks/sounds), or only in *accuracy/speed*?
  *   Only Accuracy/Speed → **Go to Node 10**
  *   Phenomenal Character Changes → **Go to Node 2**
  *   Both/Unsure → **Go to Node 2**

  **Node 2 (Independent Variable - Occurrent):** If phenomenal character changes, must the cause be a *conscious, occurrent judgment* held at that exact moment?
  *   Yes, must be occurrent → **Go to Node 3**
  *   No, training/habit suffices → **Go to Node 4**
  *   No, even subliminal cues suffice → **Go to Node 5**

  **Node 3 (Timescale - Persistence):** If the causing judgment is revoked (e.g., subject told "stop expecting"), does the phenomenal change vanish *instantly* or *persist* for seconds?
  *   Vanishes Instantly → **Go to Node 6**
  *   Persists Briefly → **Go to Node 7**
  *   N/A (Judgment never revoked) → **Go to Node 6**

  **Node 4 (Independent Variable - Standing):** Can a *standing desire* (e.g., thirst) cause the change, or only *standing beliefs/knowledge*?
  *   Only Beliefs/Knowledge → **Go to Node 6**
  *   Desires/Fears Count → **Go to Node 8**

  **Node 5 (Locus):** Must the physical change occur in *primary sensory areas* (retina/V1/A1), or can it be in *association areas*?
  *   Primary Sensory Areas Only → **Go to Node 9**
  *   Association Areas Allowed → **Go to Node 6**

  **Node 6 (Shape of Change):** When phenomenal character changes, is it by *adding a new quality* (e.g., meaning), *altering intensity* (e.g., brightness), or *blocking* input?
  *   Additive (New Quality) → **Go to Node 7**
  *   Substitutive (Intensity) → **Go to Node 8**
  *   Occlusive (Blocking) → **Go to Node 9**

  **Node 7 (Boundary):** Is there a *sharp boundary* between sensing and thinking, or is it a *continuum*?
  *   Sharp Boundary → **Go to Node 8**
  *   Continuum/No Boundary → **Leaf: The Dissolver**

  **Node 8 (Modality):** Is the answer the *same* for vision and audition?
  *   Same → **Go to Node 9**
  *   Different → **Leaf: The Pluralist**

  **Node 9 (Deflation):** Is the disagreement about *mechanisms* or *definitions*?
  *   Mechanisms → **Go to Node 10**
  *   Definitions/Verbal → **Leaf: The Deflater**

  **Node 10 (Error Theory):** Is the "effect" actually just a change in *belief about* the sensation, not the sensation itself?
  *   Yes, it is Judgment → **Leaf: The Judgment-Only**
  *   No, it is Sensation → **Go to Leaf Selection Below**

  **Leaf Selection (Based on Path History):**
  *   *If you came from Node 1 (Accuracy) →* **Leaf: The Behaviorist**
  *   *If you came from Node 2 (Occurrent) & Node 3 (Instant) →* **Leaf: The Occurrent-Only**
  *   *If you came from Node 2 (Occurrent) & Node 3 (Persistent) →* **Leaf: The Persister**
  *   *If you came from Node 4 (Beliefs Only) →* **Leaf: The Narrow-Mind**
  *   *If you came from Node 4 (Desires Count) →* **Leaf: The Broad-Mind**
  *   *If you came from Node 5 (Primary Areas) →* **Leaf: The Early Guard**
  *   *If you came from Node 6 (Additive) →* **Leaf: The Qualitizer**
  *   *If you came from Node 6 (Substitutive) →* **Leaf: The Intensifier**
  *   *If you came from Node 6 (Occlusive) →* **Leaf: The Occlusive-Standing** *(Undefended)*
  *   *If you bypassed Node 2-9 due to "No Change" intuition →* **Leaf: The Wall**
  *   *If you allow Training but not Occurrent →* **Leaf: The Trained-Eye**
  *   *If you require Sharp Boundary + Mechanism →* **Leaf: The Two-System**

  *(Note: To ensure exactly 14 leaves, the "Leaf Selection" above consolidates paths. The specific leaves are defined below.)*

  ---

  ## THE LEAVES (Positions)

  **1. The Wall** (Impenetrability Unrestricted)
  *   *Awkward Commitment:* Expertise never changes how things look, only how they are judged.
  *   *Uncomfortable Vignette:* V1 (Radiologist reports it "pops out").

  **2. The Early Guard** (Impenetrability Restricted to Early Vision)
  *   *Awkward Commitment:* V1 is immune, but V2/V3 effects are post-perceptual.
  *   *Uncomfortable Vignette:* V5 (Subliminal prime affects V1 activity and look).

  **3. The Judgment-Only** (Error Theory)
  *   *Awkward Commitment:* All reports of "looking different" are confabulations about belief.
  *   *Uncomfortable Vignette:* V3 (Subject insists look persists despite judgment change).

  **4. The Deflater** (Verbal Dispute)
  *   *Awkward Commitment:* There is no fact of the matter; we just define "perception" differently.
  *   *Uncomfortable Vignette:* V4 (Physiological sensitivity shift seems factual, not verbal).

  **5. The Dissolver** (Inference Dissolution)
  *   *Awkward Commitment:* There is no joint between sensing and thinking; the question is category mistake.
  *   *Uncomfortable Vignette:* V2 (Intuition that belief *should* be able to override look is denied).

  **6. The Pluralist** (Modality Specific)
  *   *Awkward Commitment:* Vision is encapsulated, but Audition is not (or vice versa).
  *   *Uncomfortable Vignette:* V1 & V6 (Why would training work in one modality but not the other?).

  **7. The Occurrent-Only** (Strict Cognitive Penetration)
  *   *Awkward Commitment:* Long-term training cannot change appearance, only current thought can.
  *   *Uncomfortable Vignette:* V1 (Radiologist is not thinking about diagnosis).

  **8. The Trained-Eye** (Standing State Only)
  *   *Awkward Commitment:* Occurrent beliefs cannot change look, only years of practice can.
  *   *Uncomfortable Vignette:* V3 (Short-term instruction changes look).

  **9. The Persister** (Hysteresis Required)
  *   *Awkward Commitment:* Effects must linger after the cause is removed to count.
  *   *Uncomfortable Vignette:* V5 (Effect is immediate and concurrent with prime).

  **10. The Intensifier** (Substitutive Only)
  *   *Awkward Commitment:* You can look brighter/louder, but you cannot look "menacing" or "like a face."
  *   *Uncomfortable Vignette:* V3 (Patches look like faces, a new quality).

  **11. The Qualitizer** (Additive Only)
  *   *Awkward Commitment:* You can acquire new visible properties, but basic features (brightness) are fixed.
  *   *Uncomfortable Vignette:* V4 (If interpreted as appearance, thirst changes salience/intensity).

  **12. The Broad-Mind** (Desires Count)
  *   *Awkward Commitment:* Thirst and fear change appearance just as much as belief.
  *   *Uncomfortable Vignette:* V2 (Belief is strong but fails to change look, yet desire would?).

  **13. The Narrow-Mind** (Beliefs Only)
  *   *Awkward Commitment:* Desires affect action, but only beliefs affect appearance.
  *   *Uncomfortable Vignette:* V4 (Thirst effect is robust; if appearance changes, this view fails).

  **14. The Occlusive-Standing** (Undefended Combination)
  *   *Awkward Commitment:* Standing states can only *hide* things, never add qualities or change intensity.
  *   *Uncomfortable Vignette:* V1 (Radiologist sees something *more*, not less).

  ---

  ## WORKED EXAMPLE

  **Subject:** A researcher who believes V1 is genuine (training changes look), V2 is not (belief doesn't change look), V4 is not (thirst is performance only), and that the boundary between sensing and thinking is sharp.
  **Path:**
  1.  **Node 1:** Phenomenal Character (for V1) → Go to Node 2.
  2.  **Node 2:** No, training/habit suffices (for V1) → Go to Node 4.
  3.  **Node 4:** Only Beliefs/Knowledge (rejects V4 as appearance) → Go to Node 6.
  4.  **Node 6:** Additive (V1 sees mass) → Go to Node 7.
  5.  **Node 7:** Sharp Boundary → Go to Node 8.
  6.  **Node 8:** Same for Vision/Audition → Go to Node 9.
  7.  **Node 9:** Mechanisms → Go to Node 10.
  8.  **Node 10:** No, it is Sensation → **Leaf Selection:** Matches **The Trained-Eye** (Standing Beliefs only, Sharp Boundary).

