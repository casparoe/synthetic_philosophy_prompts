  ## EMPTY CELL DIAGNOSIS (Constraint 6)

  The 10-node space allows 1,536 combinations. Only 14 are occupied above. Four notable empty cells:

  1.  **Persistence without Standing:** (Effect lasts after thought revoked, but training doesn't count).
      *   *Diagnosis:* **Merely Unattractive.** It posits a hysteresis mechanism that is not reinforced by learning. To occupy this, one would need evidence of short-term neural priming that decays slowly but cannot be consolidated.
  2.  **Occlusive Only (Appearance):** (Standing states can only *hide* things, never add qualities).
      *   *Diagnosis:* **Unexplored.** This is Leaf 14, but no major theorist defends *only* occlusion. To occupy this, one would need to argue that cognitive load only suppresses noise, never enhances signal.
  3.  **Desire but not Belief:** (Thirst changes look, but Knowledge doesn't).
      *   *Diagnosis:* **Incoherent.** It is hard to motivate why motivational states penetrate but representational states do not, given standard models of valuation. To occupy this, one must argue perception is for action (desire) not truth (belief).
  4.  **Early Locus but Late Boundary:** (Physical change in V1, but philosophically considered "thinking").
      *   *Diagnosis:* **Incoherent.** If the physiology is early sensory, calling it "thinking" violates the standard anatomical definition used to ground the boundary. To occupy this, one must reject anatomical functionalism.

  ---

  ## CANNOT-SEPARATE SECTION (Constraint 7)

  **Pair 1: The Dissolver (Leaf 5) vs. The Broad-Mind (Leaf 12)**
  *   *Ambiguity:* Both classify V1–V6 as Genuine Influence.
  *   *Why:* Both agree cognition affects appearance pervasively.
  *   *Prising Apart:* Requires a metaphysical question, not empirical. Ask: "Is there a *fact of the matter* where perception ends and cognition begins?" The Dissolver says No; The Broad-Mind says Yes (but the boundary is permeable). Empirical data on V1-V6 cannot distinguish them.

  **Pair 2: The Early Guard (Leaf 2) vs. The Judgment-Only (Leaf 3)**
  *   *Ambiguity:* Both classify V1–V6 as Not Influence (mostly).
  *   *Why:* Both deny that cognition changes *perception*. The Early Guard says V5 is perception (early), Judgment-Only says V5 is post-perceptual.
  *   *Prising Apart:* Requires neuroimaging. If V5 (Priming) shows modulation in V1 *before* conscious report, The Early Guard must call it Genuine (contradicting table) or move. If V1 is unmodulated, Judgment-Only is supported. The vignette description alone ("she sees that reading") is compatible with both early sensory change or late decision bias.

  ---

  ## VIGNETTES (Fixed)

  **V1.** A radiologist with years of training sees a subtle mass in a mammogram that a novice cannot see; she reports that it simply pops out, and she is not thinking about diagnosis at the time.
  **V2.** A subject stands at the viewing hole of a room built so that its retinal image is that of a rectangular room; she has been shown the construction, firmly believes the far corner is twice as far away, and would bet on it, but the room still looks rectangular.
  **V3.** A subject is told that some blurry grey patches are faces, and for ten minutes they look like faces; the instruction is then withdrawn, she sincerely judges the patches to be random noise, and yet for about half a minute they still look like faces.
  **V4.** A thirsty subject's detection sensitivity (d′) for water-related stimuli in a noisy display shifts measurably, with no change in response bias and nothing she can report about how the display looks.
  **V5.** A bistable figure is preceded by a fifty-millisecond presentation of an unambiguous version of one of its two readings, presented too briefly for the subject to report seeing it; on the critical trial she sees that reading.
  **V6.** An acoustically fixed, ambiguous syllable between two phonemes is heard as one or the other depending on what the subject takes the surrounding sentence to be about; the effect also appears, in a weaker form, when the subject merely expects a word of a certain kind.
