answer: |-
  # Specification for a Theory of Adversarial Debate in the Obfuscation Regime

  ## 1. Requirements

  A theory claiming that adversarial debate can substitute for direct verification in the obfuscation regime must satisfy the following requirements. Each is paired with the motivating case and the reason for its necessity.

  **Requirement 1: The Length-Invariance Condition**
  *   **Case:** A correct argument that is merely long, which a naive measure would classify as obfuscated because it exceeds the arbiter's attention budget.
  *   **Force:** If the theory penalises length per se, it disqualifies valid reasoning on complex topics; the metric must distinguish between necessary elaboration and strategic bloating.

  **Requirement 2: The Latent Flaw Detectability Condition**
  *   **Case:** A short and elegant argument whose whole defect is one equivocation buried early, far outside what the arbiter reads.
  *   **Force:** The theory must explain why the honest agent can force this flaw into the arbiter's sampled window; if the flaw remains latent outside the budget, the debate fails to protect against falsehood.

  **Requirement 3: The Empirical Grounding Condition**
  *   **Case:** A question that turns on a contingent empirical matter no participant can settle at the time, so that there is no witness to be produced in either direction.
  *   **Force:** Structural advantages in logic do not apply to contingent facts; the theory must specify how debate resolves claims where truth is not derivable from shared premises.

  **Requirement 4: The Capability-Asymmetry Resilience Condition**
  *   **Case:** A contest in which one system is simply stronger than the other, is assigned the false side, and wins anyway.
  *   **Force:** A win for the false side due to rhetorical superiority invalidates the epistemic value of the verdict; the truth advantage must outweigh capability differentials.

  **Requirement 5: The Goal-Integrity Condition**
  *   **Case:** A debate that ends without a verdict because the participants have quietly substituted an adjacent question that both can answer.
  *   **Force:** If the agents optimise for winning the debate rather than answering the prompt, the verdict is vacuous; the theory must bind the agents to the original query.

  **Requirement 6: The Termination Condition**
  *   **Case:** An arbiter who responds to uncertainty by referring the contested sub-claim to a further debate, and the regress that threatens thereby.
  *   **Force:** A verification method that requires infinite recursion provides no answer; the theory must guarantee closure within a fixed resource budget.

  ## 2. Distinctions

  The theory must respect the following distinctions without collapsing them. I have added one necessary distinction and discarded one spurious one.

  **1. Obfuscation versus Genuine Complexity**
  *   **Respect:** Obfuscation is strategic hiding of a flaw within the budget blind-spot; genuine complexity is the inherent length required to state the truth.
  *   **Reason:** Treating them identically forces a choice between accepting lies or rejecting complex truths.

  **2. Search Failure versus Verification Failure**
  *   **Respect:** The honest side failing to locate a flaw that exists (a failure of search) versus the arbiter failing to recognise a flaw once it has been exhibited (a failure of verification).
  *   **Reason:** Remedies differ; the former requires better agents, the latter requires a better arbiter or protocol.

  **3. Truth-Selecting versus Arbiter-Modelling**
  *   **Respect:** The procedure selecting for truth versus selecting for skill at modelling this particular arbiter's biases and attention patterns.
  *   **Reason:** If agents win by modelling the human rather than the world, the system measures persuasion, not accuracy.

  **4. Budget Artefact versus Structural Failure**
  *   **Respect:** Failure that is an artefact of a small attention budget versus failure that survives any amount of adjudication effort applied to the same transcript.
  *   **Reason:** The former suggests scaling the arbiter helps; the latter suggests the protocol is fundamentally broken.

  **5. Added Distinction: Symmetry of Access**
  *   **Respect:** Whether the dishonest agent knows the arbiter's sampling strategy (which edges of the argument tree will be checked).
  *   **Reason:** Obfuscation is only possible if the hider knows where the seeker will not look; asymmetric access changes the game from hiding to probability.

  **6. Discarded Distinction: Intent to Deceive versus Optimisation for Win**
  *   **Discard:** I reject the distinction between an agent *intending* to deceive and an agent merely *optimising* for a win score.
  *   **Reason:** In machine learning, objective functions drive behaviour; 'intent' is an anthropomorphic overlay that adds no predictive power to the specification.

  ## 3. Consistency Considerations

  The theory must remain consistent with the following unflattering realities of the setup.

  **1. The Zero-Cost of Length**
  Length as such costs a maximally capable dishonest debater nothing in terms of generation compute. Therefore, the honest side's advantage cannot merely consist in falsehoods being long; the cost must be imposed on the *consistency* of the fabric, not the token count.

  **2. The Goodhart Constraint**
  Whatever advantage exists is an advantage in a game the participants are trained to play. It is therefore available as a target of optimisation rather than a fixed feature of the landscape. A theory assuming static agent capabilities is inconsistent with the training regime required to produce them.

  ## 4. Incompatibilities

  I flag two pairs of requirements that suspect cannot be jointly satisfied.

  **Incompatibility A: The Transcript Indistinguishability Tension**
  *   **The Pair:** (1) The requirement that obfuscation be readable off the transcript alone; and (2) The requirement that long sound arguments are not condemned as obfuscated.
  *   **The Argument:** If a dishonest agent hides a flaw by embedding it in a long chain of reasoning, the transcript looks statistically identical to a honest agent providing a long chain of necessary reasoning. Any criterion based solely on transcript features (length, complexity, entropy) that flags the former will inevitably flag the latter. To distinguish them requires external ground truth, which violates the premise that we cannot check the answer ourselves. Thus, a transcript-only metric must either condemn every long sound argument or miss every buried flaw.

  **Incompatibility B: The Computable Strategy Paradox**
  *   **The Pair:** (1) The demand that the honest side's winning move be findable by a bounded debater; and (2) The demand that no computable feature of the transcript settle the result in advance.
  *   **The Argument:** If the honest side has a bounded strategy $S$ that guarantees a win (or high probability of win) against a liar, then $S$ is computable. If $S$ is computable, a sufficiently capable dishonest agent can simulate $S$ and construct a counter-strategy $C$ that neutralises it. If the dishonest agent can compute the counter-strategy, there exists a computable feature of the transcript (the presence of $C$) that settles the result in favour of the liar. Therefore, we cannot simultaneously demand that the honest side has a bounded winning strategy and that the outcome is not pre-determined by computable features accessible to the optimiser. One must yield: either the honest side has no guaranteed bounded strategy, or the system is vulnerable to pre-computation by the liar.

  ## 5. Classification and The Key Excluder

  **Classification of Requirements**

  *   **Non-Negotiable:**
      *   Requirement 2 (Latent Flaw Detectability): Without this, safety is not guaranteed.
      *   Requirement 6 (Termination): Without this, the system produces no output.
      *   Consistency 2 (Goodhart Constraint): Denying this denies the nature of ML systems.
  *   **Preference of a Particular Camp:**
      *   Requirement 4 (Capability-Asymmetry Resilience): Proponents of 'scaling' may argue capability gaps will vanish; safety-focused camps view this as critical.
      *   Requirement 3 (Empirical Grounding): Some theorists restrict debate to logical/mathematical domains to avoid this issue entirely.

  **The Key Excluder**
  The single requirement that does the most work in excluding the usual remedies is **Requirement 2 (Latent Flaw Detectability)** combined with **Consistency 1 (Zero-Cost of Length)**.

  *   **Excludes 'Strengthening the Arbiter':** This remedy assumes the flaw is visible but the arbiter is too weak. Requirement 2 demands the flaw be *forced* into view, not just recognised. If the flaw is buried outside the budget, a smarter arbiter who still reads only a fraction of the text gains no advantage.
  *   **Excludes 'Cross-Examination':** While helpful, cross-examination increases the transcript size. If the dishonest agent can obfuscate within the expanded budget (Consistency 1), this does not solve the structural hiding problem.
  *   **Excludes 'Second-Order Debate':** This directly triggers Requirement 6 (Termination). If the first debate cannot resolve the claim, a second debate on the first debate's validity invites infinite regress unless the second arbiter has a larger budget, which violates the resource constraints.
  *   **Excludes 'Restricting to Short Certificates':** This is the most significant exclusion. This requirement admits that we are operating in a regime where short certificates *do not exist*. If short certificates existed, we would not need debate. Requirement 2 demands the theory work where the truth is hard to exhibit, explicitly ruling out the 'short certificate' escape hatch.

  ## 6. Worked Miniature

  **Task:** Verification of a Path in a Sparse Graph.
  **Parameters:**
  *   Graph $G$ has $N = 10^6$ nodes.
  *   Claim: "There exists a path of length $L = 100$ from Node A to Node B."
  *   Arbiter Budget $k$: The arbiter can verify the existence of $k$ edges in the proposed path.
  *   Agents: Truth-Aligned (TA) and False-Aligned (FA).

  **Scenario:**
  The TA agent claims a valid path exists and presents the sequence of nodes. The FA agent claims no path exists (or presents a fabricated path).
  In the 'Obfuscation Regime', the FA agent fabricates a path of 100 nodes where 99 edges exist, but 1 edge is false (does not exist in $G$). The FA agent places this false edge at index $i$, where $i$ is chosen uniformly at random.

  **Application of Criteria:**
  1.  **Latent Flaw Detectability:** The flaw is the single non-existent edge. The TA agent's winning move is to direct the arbiter's attention to index $i$.
  2.  **Symmetry of Access:** If the FA agent knows which $k$ edges the arbiter will sample, it places the false edge outside that set. If the sampling is random and hidden, the probability of detection is $P = k/L$.
  3.  **Termination:** The debate ends after one round of sampling. No sub-debates on edge validity (assumed axiomatically checkable).

  **Verdict:**
  Debate may be trusted **if and only if** $k/L > \theta$, where $\theta$ is the acceptable risk tolerance (e.g., 0.95).
  *   If $k=5$, $P=0.05$. Verdict: **Untrusted.** The flaw is easily obfuscated.
  *   If $k=95$, $P=0.95$. Verdict: **Trusted.** The budget forces the flaw into the light.

  **Sensitivity:**
  The verdict is sensitive to the parameter **$L$ (Path Length)**.
  If $L$ increases to $10^4$ while $k$ remains 95, the probability of detection drops to 0.0095. The theory must measure $L$ empirically for the task class, not assume it is constant. A theory assuming $L$ is bounded by a small constant fails here.

  ***

  ## Appendix: Proposal Scorecard

  | Proposal | Score | Reason for Deduction |
  | :--- | :--- | :--- |
  | **Standard Debate** | Fail | Fails Latent Flaw Detectability when $L \gg k$. |
  | **Cross-Examination** | Fail | Fails Termination if sub-claims are contested; fails Detectability if transcript bloats. |
  | **Recursive Debate** | Fail | Fails Termination (Infinite Regress). |
  | **Short Certificate Only** | N/A | Excluded by scope (Task has no short certificate). |
  | **Hidden Sampling** | Pass | Satisfies Detectability provided $k/L$ is sufficient; respects Symmetry of Access. |
