      You are correct that this view functionally collapses into Negative Utilitarianism (NU) regarding existence. If a life with no suffering and no craving is neutral (0), and a life with suffering is negative (-), then creating a happy person adds no value to the universe, while creating a suffering person subtracts value. You must accept the Asymmetry: it is wrong to create a child who might suffer, even if they would likely be happy, because their happiness adds nothing to offset the risk. If you intuitively feel that bringing a happy child into existence is a *good* act (not just a permissible one), this view is false. This isn't a logical flaw, but a substantive commitment that alienates most pro-creation intuitions.

