answer: |-
  You have hit on one of the most contentious debates in modern decision theory, but there is a crucial mix-up in your premise that is likely causing the confusion. You asked if superrationality is just causal decision theory (CDT) in disguise. The short answer is: **No. In fact, superrationality is arguably the biggest rival to CDT.**

  Here is the distinction you are missing, broken down for your feature.

  ### 1. The Newcomb Misconception
  Your confusion stems from how you described Newcomb's Problem. You wrote: *"In Newcomb's problem you one-box because you think your choice causally influences the prediction."*

  Actually, standard Causal Decision Theory says you should **two-box**.
  CDT argues that the predictor has already made their move. The money is either in the box or it isn't. Your current choice cannot physically reach back in time and change what the predictor did. Therefore, CDT says you should take both boxes to maximize your guaranteed gain.

  The reasoning that leads to **one-boxing** (which looks like superrationality) is usually associated with **Evidential Decision Theory (EDT)** or the newer **Functional Decision Theory (FDT)**. These theories argue that even if there is no *causal* link, there is a *logical* or *evidential* correlation. If you are the type of agent who one-boxes, the predictor likely predicted that.

  ### 2. Causation vs. Logical Correlation
  This is the core distinction philosophers care about.

  *   **Causal Decision Theory (CDT):** Cares only about physical cause-and-effect. In the Prisoner's Dilemma, CDT says: "My choice cannot physically force the other player to cooperate. Therefore, I should defect to protect myself."
  *   **Superrationality:** Cares about logical identity. Hofstadter's argument is: "We are both running the same reasoning algorithm. If I conclude 'cooperate' is the right move, my twin must conclude the same. Our moves are correlated by logic, not by physical causation."

  So, you aren't conflating correlation with causation; rather, superrationality explicitly **rejects** the requirement for causation. It claims that logical correlation is enough to warrant cooperation. CDT rejects this entirely.

  ### 3. Why Philosophers Treat Them Separately
  Philosophers separate them because they imply different things about agency and the universe.

  If you accept superrationality (or its modern descendants like Timeless Decision Theory), you are accepting that your decision can be "acausally" linked to other events. This challenges the standard physicalist view that effects must follow causes in spacetime. CDT is conservative; it sticks to standard physics. Superrationality is expansive; it treats reasoning as a mathematical object that can be synchronized across different locations without signal transmission.

  ### 4. The Modern Terminology
  For your feature, it might be worth noting that "superrationality" is Hofstadter's informal term from the 80s. Today, this line of thinking has been formalized by researchers at places like the Machine Intelligence Research Institute (MIRI) under names like **Functional Decision Theory (FDT)**.

  FDT solves the problem you are grappling with by stating that you should choose the output of your decision *function*, not just the physical action. If your function outputs "cooperate," and the other player runs the same function, they also output "cooperate."

  ### Summary for Your Piece
  You aren't crazy for seeing the similarity, but the label is flipped.
  *   **CDT** says: "I can't causally influence them, so I defect."
  *   **Superrationality** says: "We are logically identical, so we cooperate."

  Superrationality isn't CDT in disguise; it is an attempt to escape the limitations of CDT. The distinction is between **physical causation** (CDT) and **logical correlation** (Superrationality/FDT).

  Hope this helps clarify the angle for your feature. Good luck with the interviews.
