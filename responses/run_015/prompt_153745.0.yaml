          *   For each requirement: State motivating consideration + Mark as Non-negotiable or Camp Preference.
          *   Identify joint unsatisfiability (tensions/paradoxes within the desiderata).
          *   Brief notes on where existing theories fail (optional but welcome).
          *   **Style:** British English, no bibliographies/citations, advanced seminar level (sophisticated, precise).
          *   **Constraint:** Answerable without external archives (rely on internal philosophical knowledge).

  2.  **Deconstruct the Meno Problem:**
      *   Core intuition: Knowledge is better than true belief.
      *   The Swamping Problem: If the value of truth swamps the value of the process, why care about the process (justification/reliability)?
      *   The Scope: Is it *always* more valuable? Or *pro tanto*? Or *generally*?
