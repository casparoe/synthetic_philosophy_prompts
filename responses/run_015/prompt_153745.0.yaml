      *   The prompt specifically asks about the tension between "Knowledge is *always* more valuable" and "There exist situations where JTB has the *same* practical weight."
      *   This is the "Specificity vs. Generality" tension. If value is purely practical, they might be equal in specific outcomes. If value is constitutive, they differ.
      *   Also, the "Swamping Problem" itself suggests a tension between instrumentalism about justification and the extra value of knowledge.

