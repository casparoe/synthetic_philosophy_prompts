answer: |-
  Friends, neighbors, I know the papers on the table. I've seen the ship logs. I've seen the weather bureau reports from 1974. They all say the storm came from the West. Technically, scientifically, objectively—they are right. If we were building a museum exhibit for meteorologists, we would carve "West" into that stone without a second thought.

  But we are not building a museum exhibit. We are building a memorial. And that changes everything.

  I'm asking you to consider a principle I call "mnemonic sovereignty." It sounds fancy, but it means something simple: a community has the right to own the story that holds it together. When a group of people survives something together, the truth of that experience isn't just in the data; it's in the shared memory of what it felt like to survive it.

  Now, I know what some of you are thinking. I know what the historians across the table are thinking. You're thinking that if we let memory trump records, we're opening the door to lies. You're thinking about the dangerous kinds of denialism we see in the world—people denying the Holocaust, denying the Armenian genocide, denying atrocities because the truth is uncomfortable. You're saying that correcting falsehoods is a public duty, no matter how much it hurts.

  And you are right to be worried about that. But you are wrong to apply that fear to this stone.

  There is a moral difference between denying a crime to protect a perpetrator, and remembering a disaster to protect a community. When someone denies a genocide, they are erasing victims to shield the guilty. They are using falsehood as a weapon to divide and oppress. That is malicious. That is destructive.

  What we are talking about here is not malicious. It is not erasing victims. The storm happened. The damage happened. The loss happened. No one here is saying the tragedy didn't occur. The only disagreement is about the wind's direction. And why do we remember it as East? Because when the surge hit, the debris flew from the East. Because when we huddled in the church basement, the wind screamed from the East. Because the damage was worst on the Western shore, so it felt like the blow came from the opposite side.

  Our memory isn't trying to hide the truth; it's trying to make sense of our survival.

  If we carve "West" on this plaque, we are prioritizing the accuracy of a ship log over the lived experience of the people who actually lived through it. We are telling every survivor here that their memory is defective. We are telling the next generation that the archives know their home better than their grandparents did. That doesn't serve the truth; it serves bureaucracy.

  The historian says their duty is to correct falsehoods regardless of emotional comfort. But a memorial isn't about comfort. It's about cohesion. It's about binding us together. If we put "West" on that plaque, every time a survivor walks past it, they will feel a little alienated from their own history. They will feel like a stranger in their own town. Is that the kind of truth we want? A truth that separates the record from the people?

  Mnemonic sovereignty says that when the divergence is collective, non-malicious, and serves to keep a community intact, the community wins. We are not denying history. We are curating our own relationship to it.

  So here is my verdict. Put "East" on the plaque. Not because the weather bureau was wrong, but because we are right about what this storm means to us. Let the archives have the data. Let us have the memory. This stone isn't for the ships that passed us by; it's for the people who stayed. And we remember it coming from the East.
