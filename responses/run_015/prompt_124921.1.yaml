answer: |-
  The impasse you and your friend are experiencing is not a failure of communication; it is a precise reflection of a foundational schism in decision theory and the metaphysics of agency. The disagreement has not resolved in the literature because it is not merely about Parfit's Hitchhiker; it is about **which normative ideal governs rational choice** and **what metaphysical structure is required to sustain it.**

  Here is a diagnosis of the stall, grounded in the specific positions held by proponents of each side, separating what is settled from what is genuinely contested.

  ### 1. The Normative Slide: Success vs. Sanction
  You noted that "rationality" was sliding between global optimization, local expected-utility, and compliance. This is the primary verbal/substantive hybrid driving the confusion.

  *   **Your Position (Global/Success):** You are operating with a **consequentialist criterion of rationality**. This aligns with the view held by proponents of Functional Decision Theory (FDT) or Timeless Decision Theory (TDT), and historically by David Gauthier in *Morals by Agreement*. For Gauthier, a "constrained maximizer" is rational because they secure outcomes that "straightforward maximizers" (CDT agents) cannot. On this view, a decision theory that leaves money on the table (or dies in the desert) is *self-defeating* and therefore defective.
  *   **Your Friend's Position (Local/Sanction):** Your friend is operating with a **causal/consistency criterion of rationality**. This aligns with Causal Decision Theory (CDT) proponents like David Lewis or James Joyce. For them, rationality is about making the best move *given the state of the world at the time of action*. Once you are in the city, the ride is a sunk cost. Paying is causally dominated. To call paying "rational" is to violate the principle that rationality must be action-guiding at the moment of choice.
  *   **The Stall:** You are arguing that rationality is about **winning** (ex-ante optimality). Your friend is arguing that rationality is about **coherence** (ex-post ratifiability).
  *   **Settled:** CDT fails the Hitchhiker case (it recommends leaving you in the desert). EDT/FDT succeeds (it recommends paying).
  *   **Contested:** Whether failing the Hitchhiker case indicts CDT as a theory of *rationality*, or merely indicts it as a tool for *success*. Joyce (*The Foundations of Causal Decision Theory*) argues that a theory can be normatively correct even if it leads to worse outcomes in Newcomb-like problems, provided it respects causal structure.

  ### 2. The Metaphysical Core: Toxin vs. Hitchhiker
  Your friend's specific claim—that the Hitchhiker is structurally identical to Kavka's Toxin Puzzle due to a "branching problem" of agency—is a substantive metaphysical claim, not a verbal quibble. This is where the ontology of future selves enters.

  *   **The Friend's Claim (Time-Slice Agency):** Your friend is arguing for **Time-Slice Rationality** (defended by philosophers like Brian Hedden and Roger Briggs). They claim the "agent" at the prediction time ($t_1$) and the "agent" at the payment time ($t_2$) are distinct loci of evaluation. If they are distinct, the $t_1$ agent cannot bind the $t_2$ agent any more than I can bind you. This makes Hitchhiker identical to Toxin: in both, you are asked to intend at $t_1$ to do something at $t_2$ that is irrational at $t_2$.
  *   **Your Counter (Diachronic Agency):** You are arguing for **Diachronic Unity** (defended by Michael Bratman in *Planning, Time, and Self-Governance*). You claim that once we fix a model of agency (e.g., a planning agent), the $t_2$ self is normatively bound by the $t_1$ plan. The prediction link in Hitchhiker creates a *logical* dependency between $t_1$ and $t_2$ that does not exist in Toxin. In Toxin, the intention does not cause the drinking. In Hitchhiker, the disposition (algorithm) causes both the prediction and the payment.
  *   **The Stall:** The disagreement is about **counterfactual robustness**.
      *   In **Toxin**, the reward depends on the *intention* alone. You can intend and then not drink.
      *   In **Hitchhiker**, the reward depends on the *action* (via prediction). You cannot get the ride unless you are the *type* who pays.
      *   Your friend argues the temporal gap severs the link (making it Toxin). You argue the logical link survives the gap (making it Newcomb).
  *   **Contested:** Whether the prediction mechanism creates a "logical tie" strong enough to override the temporal separation. CDT proponents deny this tie is relevant to *causal* rationality. FDT proponents assert the tie is relevant to *logical* rationality.

  ### 3. The Formal Distinction: Linear vs. Branching Commitment
  You asked if there is a hidden formal distinction. There is, but it is usually framed as **Dynamic Consistency vs. Separability**.

  *   **Separability (Friend's View):** A rational agent's choice at $t_2$ should depend only on the subtree of possibilities available at $t_2$. If the ride is already secured, the decision tree has pruned. The prior branch is gone. This is the **Separability Principle** (Machina, 1989). If you accept Separability, Hitchhiker *is* Toxin: the past prediction is fixed, so paying is irrational.
  *   **Dynamic Consistency (Your View):** A rational agent's plan at $t_1$ should be executable at $t_2$. If a plan is optimal at $t_1$ but abandoned at $t_2$, the agent is **dynamically inconsistent**. To avoid this, the agent must treat their future choice as a variable under their current control (via logical correlation).
  *   **Diagnosis:** The stall persists because **Separability** and **Dynamic Consistency** are formally incompatible in non-causal decision problems. You cannot have both.
      *   If you prioritize Separability (Friend), you must accept that rationality is self-defeating in Hitchhiker.
      *   If you prioritize Dynamic Consistency (You), you must reject Separability and accept that future choices are logically constrained by past algorithms.

  ### 4. Is the Question Ill-Posed?
  You asked if the impasse signals the question presupposes a unitary agent where only a sequence exists.

  *   **Parfit's Own View:** In *Reasons and Persons*, Parfit argues for a **Reductionist View** of persons (there is no further fact of identity over time). Surprisingly, Parfit does *not* use this to dissolve the rationality requirement. He argues that even if persons are sequences, **Rationality requires concern for the future**. However, he acknowledges that on a Reductionist view, the "self-interest theory" is less authoritative.
  *   **The "Ill-Posed" Charge:** Your friend is effectively arguing that "Rationality" presupposes a **Further Fact** of identity that doesn't exist. If there is no robust diachronic agent, there is no one to be "dynamically consistent."
  *   **Verdict:** This is **Contested**. Most decision theorists (even reductionists) model the agent as a single locus of utility maximization over time for the sake of the formalism. To say the problem is ill-posed is to reject the standard modeling assumption of decision theory itself.

  ### Summary of the Diagnosis

  | Feature | Your Position (Diachronic/Global) | Friend's Position (Time-Slice/Local) | Status |
  | :--- | :--- | :--- | :--- |
  | **Normative Goal** | **Success:** Rationality should maximize utility. | **Coherence:** Rationality should respect causal dominance. | **Contested** (Normative Ethics) |
  | **Metaphysics** | **Planning Agent:** Future selves are bound by prior plans/algorithms. | **Time-Slice:** Future selves are new decision nodes. | **Contested** (Metaphysics of Agency) |
  | **Formal Principle** | **Dynamic Consistency:** Plans must be executable. | **Separability:** Choices depend only on current options. | **Formally Incompatible** |
  | **Case Analogy** | **Newcomb:** Logical link between prediction and action. | **Toxin:** Gap between intention and action severs link. | **Contested** (Interpretation of Cases) |

  ### What Counts as Progress?

  Progress will not come from convincing one side the other is "wrong" about the case, because you are prioritizing different axioms. Progress requires **meta-normative clarity**.

  1.  **Acknowledge the Axiomatic Trade-off:** Admit that you cannot have both **Separability** (Friend's requirement) and **Dynamic Consistency** (Your requirement) in the presence of predictors. You must choose which axiom to drop.
      *   *Progress:* "We agree CDT satisfies Separability but fails Dynamic Consistency. We agree FDT satisfies Dynamic Consistency but violates Separability. Our disagreement is which axiom is more fundamental to 'rationality'."
  2.  **Clarify the Ontological Commitment:** Your friend needs to specify if they are denying diachronic agency entirely (Radical Time-Slice) or just denying that it binds rationality (Normative Time-Slice).
      *   *Progress:* "Are you claiming I *cannot* bind my future self (metaphysical), or that I *should not* be bound by them (normative)?"
  3.  **Reframe the Toxin Comparison:** The Toxin Puzzle is about the **possibility of intention**. The Hitchhiker is about the **consequence of disposition**.
      *   *Progress:* Agree that Toxin challenges the *psychology* of intention, while Hitchhiker challenges the *logic* of decision algorithms. Conflating them hides the logical dependency in Hitchhiker that is absent in Toxin.

  **Concrete Recommendation:** Stop arguing about whether the hitchhiker *is* rational. Argue about whether **Separability** is a mandatory constraint on rational choice. If your friend insists Separability is non-negotiable, they must concede that rationality is self-defeating in Hitchhiker. If you insist Dynamic Consistency is non-negotiable, you must concede that rationality requires treating future choices as logically fixed by past algorithms. The stall ends when you admit you are defending different axioms, not different facts.
