  Hi — full disclaimer, I have no philosophy background, I went down a rabbit hole after an argument with my brother-in-law about inheritance tax and I've been reading stuff on my own since. I want to know how much of what I read I should actually believe.

  I found a blog post (some libertarian-leaning economics guy, no idea whether he's any good) summarizing an argument by Robert Nozick — the "Wilt Chamberlain" thing from some book in the 70s. Paraphrasing from memory, so I might be blending his sentences together:

  "Nozick's target is every theory of fair shares that philosophers actually like. They all say a distribution is just when it fits some pattern — equality, or giving people what they need, or what they deserve. His point is that patterns can't survive people being free. Picture a world that starts with everybody holding exactly the same amount of money. Wilt Chamberlain signs a deal where an extra quarter from every ticket goes straight to him, a million fans happily pay it because they want to watch him play, and he ends up with a quarter of a million dollars a year. Nobody was forced, nobody is worse off than before, and yet the distribution has stopped matching the pattern. So a government that wants to preserve the pattern has to keep banning transactions that adults freely choose, forever. And Nozick goes further: taxing what someone earns is morally the same as making them work for you for part of the week, so any state that redistributes is running a form of slavery, and the only just distributions are the ones that come out of voluntary exchange no matter how unequal they end up. The whole thing rests on the homestead principle — you own whatever you mix your labour with, so the first person to make use of something owns it outright."

  Then he updates it for now: a streamer with a couple hundred thousand subscribers each voluntarily paying five bucks a month ends up with tens of millions a year, and he says Nozick's argument shows that taxing that income is theft — and that it doesn't matter one bit that the audience only exists because the platform's recommendation algorithm funnels people to that channel, or that the whole thing runs on publicly built infrastructure.

  The bit about patterns requiring constant meddling sounded pretty convincing to me, but the slavery line sounds like internet nonsense and I definately don't trust this guy. Also, I can't tell whether the algorithm/infrastructure thing is a genuine difference from Chamberlain or just a distraction.

  Can you go through it and tell me what's fair? Sections please, in this order:

  - Verdict up front — three sentences max
  - Claim by claim — the bulk of it, maybe 400 words, ideally a table: what the post said / fair, half fair, or not fair / one line on why
  - What the argument actually does and doesn't show — about two paragraphs (I especially want to know whether it's supposed to prove libertarianism or only to cause trouble for patterned views)
  - Does the streamer version help or hurt the argument — one paragraph
  - So what should I do with this — three sentences

  Please don't tell me what to read or link me anywhere; I'm not going to buy a philosophy book, so just work with what's in my post.
