answer: |-
  Here is how I see the landscape, thinking through the trade-offs as if we were whiteboarding this.

  On your first point: the Agent A vs. Agent B case (0.9 on truth, 0.1 on one falsehood vs. 0.1 spread over 1000 falsehoods). You ask if Brier's preference for B is a bug. My instinct is that this is actually a feature of how we should understand doxastic commitment, even if it feels like "free accuracy."

  Think of credence as a limited resource you are distributing over the space of possibilities. Agent A is making a specific, risky claim: "It's not the truth, and it's specifically *this* false world." Agent B is making a vaguer claim: "It's not the truth, and I have no idea which false world it is." In terms of error avoidance, B is in a better position. If the actual world turns out to be one of the false ones (counterfactually speaking), A is massively wrong about the distribution, while B is only slightly wrong about each specific alternative. Brier captures the idea that *specificity of error* is costly. Log score ignores the false worlds entirely, which makes it blind to how you structure your ignorance. If your goal is to measure "proximity to the truth-value vector," Brier is right: B is geometrically closer to the ideal (1, 0, ..., 0) than A is. The "fine-graining" worry assumes the partition is arbitrary, but in accuracy-first frameworks, the algebra of propositions is usually fixed as part of the problem setup. Relative to a fixed algebra, spreading your error *is* epistemically safer. So I wouldn't call it a bug; I'd call it a commitment to the idea that accuracy measures how well your whole distribution matches the world, not just how surprised you are at the truth.

  Now, regarding your hybrid fix: $S(c,w) = -\log c(w) + \lambda(\sum c - 1)^2$.
  You asked if this is cheating. In a sense, yes—not because it breaks the math, but because it breaks the *philosophical unity* of the project. The accuracy-first program wants to derive norms (like probabilism) from the goal of accuracy alone. With Brier, the penalty for incoherence emerges naturally from the geometry of distance to the truth. With your hybrid, you are effectively stipulating that incoherence is bad by adding a term whose sole purpose is to punish incoherence. The $\lambda$ parameter is the smoking gun here. Where does $\lambda = 2$ come from? If $\lambda$ is too small, there will be wildly incoherent credences (e.g., sum = 100) where the Log gain from being "right" outweighs the coherence penalty, and dominance fails. If $\lambda$ is too large, the measure stops being about accuracy and becomes a coherence-enforcement mechanism that swamps the truth-tracking component. Brier doesn't have a tuning parameter; the weight of the coherence constraint is fixed by the geometry of the space. Your hybrid decouples "tracking truth" from "being coherent," whereas Brier treats coherence as constitutive of tracking truth.

  Furthermore, does the hybrid dodge the partition sensitivity? No, it just inherits the Log score's indifference. If you fine-grain the false worlds, the Log part stays tied, and the penalty part stays tied (since both sum to 1). So the hybrid agrees with Log that A and B are equal. If you accept my defense of Brier above (that specificity of error matters), then the hybrid inherits the *bug* of ignoring how you distribute mass over falsehoods.

  Taking a side: I would build the program on **Brier**, and here is where your hybrid loses to it.
  The hybrid loses on **theoretical non-arbitrariness**. The dominance argument is supposed to show that incoherent credences are *objectively* worse from the perspective of accuracy. With Brier, this is a theorem derived from the definition of distance. With the hybrid, it is a consequence of a chosen parameter $\lambda$. This makes the normativity fragile. If a skeptic asks, "Why should I care about this penalty term?", you have no answer other than "To make the dominance proof work." With Brier, the answer is "Because this is what it means to be close to the truth in a probability space."

  Also, the hybrid creates a discontinuity in how we treat incoherence. For coherent agents, the penalty vanishes, and we are pure Log-accuracy-firsters. For incoherent agents, we are hybrid-accuracy-firsters. This suggests that the measure of accuracy *changes* depending on whether you are rational or not. That's unstable. Brier measures accuracy the same way for everyone; it just turns out that incoherent people score worse. That uniformity is a major theoretical virtue. The partition-sensitivity of Brier is a price worth paying for a measure that doesn't require a "coherence patch" to ground the synchronic norms. Stick with the geometry; it's cleaner.
