      *   **Task:** Diagnose the *type* of disagreement (verbal, factual, normative, etc.), use evidence from the prompt to back it up, and suggest what would count as progress (tests, distinctions, etc.).

  2.  **Deconstruct the Arguments:**

      *   **Side A (Structuralists):**
          *   *Core Claim:* The system punishes quality/slow development.
          *   *Mechanism:* Algorithm boosts frequency. Skipping a week = visibility drop = sales tank.
          *   *Definition of "Cannot":* "Cannot without unacceptable loss." It's irrational to stop, not physically impossible.
          *   *Solution:* Collective action or platform reform.
          *   *View on Counterexamples:* Likely sees them as outliers, different genres, or survivorship bias.

      *   **Side B (Agency-focused):**
          *   *Core Claim:* Individuals have choice. Quality wins eventually.
          *   *Mechanism:* Good games find audiences regardless of algorithm gaming.
          *   *Definition of "Cannot":* "Literally impossible." If you *can* point to one person who did it, you *can* do it.
