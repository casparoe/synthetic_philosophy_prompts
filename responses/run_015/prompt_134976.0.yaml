answer: |-
  This is a sharp set of intuitions. You are effectively rediscovering a debate that occupies sociologists, economists, and philosophers (think Jon Elster, Thomas Schelling, or Elizabeth Anderson). Your gut is correct to be skeptical of "moral argument" as a standalone engine. History suggests moral arguments are usually the *language* used to justify a shift, not the *cause* of it.

  Here is a framework to organize your cases, a verdict on your "Alignment Hypothesis," and a specific diagnosis of your village camera case.

  ### 1. The Unified Principle: The Normative Equilibrium
  Your hypothesis—"norms survive only when interest and local honor align, and collapse when either breaks"—is very close to the truth, but it needs one refinement: **Signaling.**

  Norms are stable equilibria maintained by **costly signaling**.
  *   **Honor** is the reward for sending the signal.
  *   **Interest** is the material cost/benefit of sending the signal.
  *   **Argument** is the post-hoc rationalization.

  A norm dies when the **signal-to-noise ratio breaks**. This happens in three distinct ways, which maps onto your cases:

  1.  **Signal Devaluation (Honor Shift):** The behavior no longer signals what it used to. (Dueling, Foot-binding).
  2.  **Cost Escalation (Interest Shift):** The material cost of adhering to the norm becomes too high. (Smoking).
  3.  **Technological Decoupling (Obsolescence):** The function of the norm is achieved without the signal. (Your Camera Case).

  ### 2. Re-evaluating Your Cases
  Let's run your examples through this "Signaling Equilibrium" model.

  *   **Dueling:** *Signal Devaluation.*
      *   **Old Equilibrium:** Risking death signaled "I value honor over life."
      *   **The Break:** Industrialization and the rise of the bourgeoisie made the aristocratic code look like "cosplay." The signal no longer bought you status; it bought you ridicule. The material cost (death) remained high, but the honor payoff dropped to zero.
  *   **Slavery (Britain):** *Cost Escalation + Signal Devaluation.*
      *   **Old Equilibrium:** Slave labor was profitable (Interest); Empire building was glorious (Honor).
      *   **The Break:** As you noted, pure economics is messy here. But the *moral argument* succeeded only when it successfully re-coded slavery from "economic necessity" to "national stain." Once owning slaves signaled "backward barbarian" rather than "wealthy planter," the honor cost spiked. The moral argument provided the vocabulary for the honor shift.
  *   **Foot-binding:** *Signal Devaluation (External).*
      *   **The Break:** This is a pure status market crash. When "modernity" became the dominant status marker (due to Western pressure), bound feet flipped from signaling "high class/refined" to "feudal/oppressed." The interest (marriageability) collapsed because the honor value collapsed.
  *   **Smoking:** *Cost Escalation + Signal Devaluation.*
      *   **The Break:** This is the hybrid you suspected. The material interest shifted (lawsuits, insurance, health costs), but crucially, the *social signal* flipped. Smoking went from signaling "rebellious/cool" to "addicted/unhealthy." If it were only health costs, bans would have faced more resistance. It died because it became status-suicide.

  ### 3. The Verdict on the Village Camera Case
  This is the most interesting case because it doesn't fit "Honor Shift" or "Interest Shift" perfectly. It fits **Technological Decoupling**.

  **The Setup:**
  *   **Norm:** Do not lock doors.
  *   **Signal:** "I trust you."
  *   **Function:** Community security via mutual monitoring.
  *   **Cost:** Risk of theft.

  **The Change:**
  Wireless cameras arrive.

  **The Mechanism:**
  The norm existed because there was a trade-off: *Security vs. Trust Signal.* To get security, you had to lock up, which killed the trust signal. To keep the trust signal, you had to forego locks.

  Cameras broke the trade-off. You can now have security (cameras) *without* the physical barrier (locks) that signaled distrust.
  *   **Did Interest Change?** No. The interest in security remained constant.
  *   **Did Honor Change?** Not initially. People didn't decide locking was suddenly "honorable."
  *   **What Happened?** The norm became **functionally obsolete**.

  The norm collapsed because the **information problem** the norm was solving was solved more efficiently by technology. The "shame" of locking doors was a social enforcement mechanism to ensure everyone contributed to the "public good" of an open village. Once cameras allowed for *private* security without *public* exclusion, the collective action problem dissolved.

  **Verdict:** The norm didn't die because people stopped valuing trust (Honor), nor because they valued security more (Interest). It died because **technology allowed them to satisfy the Interest without paying the Honor cost.** The norm wasn't violated; it was bypassed.

  ### 4. Do You Need Separate Mechanisms?
  You asked: *"Is there one principle... or do I need separate mechanisms?"*

  You need **one principle with three failure modes.**

  **The Principle:** Norms persist when they efficiently coordinate behavior by linking material outcomes to social status.

  **The Three Failure Modes:**
  1.  **The Status Market Crashes (Honor):** The behavior no longer confers status (Dueling, Foot-binding).
  2.  **The Price Becomes Too High (Interest):** The material cost of adherence outweighs the social benefit (Smoking).
  3.  **The Signal is Decoupled (Technology):** The outcome is achieved without the ritual (Cameras).

  **Where does Moral Argument fit?**
  Moral argument is rarely the *cause*. It is the **coordination device**.
  *   In the Slavery case, moral arguments didn't change hearts directly; they provided a focal point for the honor shift. They allowed people to coordinate on a new definition of "civilized."
  *   In the Smoking case, health data (argument) gave people the excuse to update the status signal.

  ### 5. Summary for Your Mental Model
  Your gut verdicts are consistent. You can unify them like this:

  1.  **Dueling:** Honor collapse. (The signal lost value).
  2.  **Slavery:** Honor collapse aided by Interest shift. (The signal became a stain).
  3.  **Foot-binding:** Honor collapse. (The signal flipped meaning).
  4.  **Smoking:** Interest shift + Honor collapse. (The cost rose, the signal soured).
  5.  **Village Cameras:** **Decoupling.** (The technology satisfied the interest without requiring the signal).

  **Final Advice:**
  Stick with your "Alignment Hypothesis," but add the concept of **Efficiency**. Norms are low-tech social technologies. They die when they become inefficient—either because they cost too much (Interest), stop working to boost status (Honor), or are replaced by better tech (Cameras). Moral arguments are just the press release announcing the closure.
