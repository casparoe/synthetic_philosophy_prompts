      *   **Problem:** Standard essay questions allow passing via rote memorization of sentience literature without deep methodological/ethical understanding.
      *   **Goal:** Create a question based on a fictional scenario (AWAB, SWHI vs. TTS) that tests reasoning with policy instruments rather than recall of specific laws/reviews.
      *   **Requirements:**
          *   Examination Question (Stem + 3 sub-parts).
          *   Model Answer (~800 words).
          *   Marking Scheme (40 marks total, specific moves for first-class, specific errors, marks per point, notes on characteristic mistakes).
          *   **Key Focus:** Distinguish between superficial aggregation critiques and deep methodological/ethical analysis (what aggregation assumes, when it fails, what alternatives sacrifice). Recognize the disagreement about the *purpose* of a certification standard.

  2.  **Drafting the Examination Question:**
      *   *Stem:* Needs to present the AWAB scenario clearly but concisely (using the provided text).
      *   *Part (a):* Focus on SWHI mechanics and ethical commitments (What is it measuring? What does the arithmetic imply?).
      *   *Part (b):* Focus on normalization (Sum vs. Average). How does this change the ethical outcome?
      *   *Part (c):* Adjudication and Proposal (SWHI vs. TTS, plus a personal recommendation).
      *   *Tone:* Academic, precise, demanding critical engagement.

  3.  **Drafting the Model Answer:**
      *   *Length:* Around 800 words.
      *   *Structure:* Address (a), (b), and (c) sequentially but cohesively.
      *   *Content:*
          *   (a) SWHI measures *total cumulative suffering burden*. Arithmetic commits to utilitarian aggregation (trade-offs allowed, numbers matter more than intensity sometimes).
          *   (b) Normalization (per capita) shifts focus from *total harm* to *average harm per animal*. Changes incentives (might ignore high-volume low-welfare operations if average is okay, or vice versa). Highlights the "logic of the larder" problem.
          *   (c) Adjudication: SWHI risks justifying high-volume/low-welfare if total is managed; TTS risks ignoring scale (1 bad trout vs 1 million bad shrimp). Purpose of standard: Is it consumer info (total impact) or rights protection (thresholds)? Proposal: Hybrid approach (Thresholds for basic rights + Index for continuous improvement).
      *   *Key Insight:* The conflict isn't just about sentience scores; it's about whether welfare is a cumulative utility or a constraint on action.

  4.  **Developing the Marking Scheme:**
      *   *Total:* 40 marks.
      *   *Distribution:* Needs to reflect the difficulty. Part (c) is the heaviest lift, so maybe 15 marks. Part (a) and (b) are foundational, maybe 10 and 10, with 5 for structure/clarity? Or split 12, 12, 16. Let's go with 12 (a), 12 (b), 16 (c) to emphasize the adjudication.
      *   *First-Class Criteria:* Must identify the utilitarian underpinnings, the "replaceability" implication, the difference between total vs. average utilitarianism in (b), and the teleological disagreement in (c).
      *   *Errors:* Confusing sentience with welfare, missing the "numbers matter" implication, failing to see the purpose conflict.
      *   *Format:* Table or list with "Move", "Marks", "Characteristic Mistake".

  5.  **Refining the Content (Self-Correction/Iterative Process):**
      *   *Check:* Did I include the Brackenmoor example in the stem? Yes, it's crucial for the math in part (a).
      *   *Check:* Is the Model Answer too long? Need to keep it tight to ~800 words.
      *   *Check:* Does the Marking Scheme penalize rote learning? Yes, by awarding marks for *application* of the scenario, not general sentience knowledge.
      *   *Check:* Is the distinction between "aggregation is controversial" and "what aggregation assumes" clear in the scheme? I need to explicitly reward the identification of *trade-offs* and *substitutability*.
      *   *Check:* Does it address the "purpose of certification" point? Yes, in Part (c).

  6.  **Final Polish:**
      *   Ensure the tone is appropriate for an MRes level (high expectation of critical analysis).
      *   Verify the math in the stem matches the prompt (40m * 0.5 * 3 = 60m; 200k * 0.9 * 6 = 1.08m). Yes, the prompt's math holds up.
      *   Make sure the marking scheme is usable by a second marker (clear descriptors).

  7.  **Final Output Generation:** (Proceeding to generate the response based on these steps).
      *   *Question:* Clear stem, three distinct parts.
      *   *Model Answer:* Structured, analytical, hits the "purpose" point.
      *   *Marking Scheme:* Detailed breakdown, focusing on the "First Class" differentiators requested.

  *(Self-Correction during drafting the Marking Scheme)*: I need to make sure I don't just give marks for "correct opinion". The marks must be for *reasoning*. For example, in (c), marks aren't for choosing SWHI or TTS, but for justifying the choice based on the *function* of the standard.

  *(Refining the Model Answer)*: Ensure it explicitly mentions the "Logic of the Larder" or equivalent concept regarding population size in part (b), as that's a key MRes level insight.

  *(Refining the Stem)*: Ensure the text provided in the prompt is integrated smoothly as the "Scenario" block.

