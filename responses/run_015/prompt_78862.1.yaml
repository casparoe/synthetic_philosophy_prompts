answer: |-
  ### Examination Question

  **Question 5**

  **Scenario:**
  The Aquatic Welfare Assurance Board (AWAB) is a new international certification body covering salmonid farms and decapod farms (shrimp, prawn, crayfish). AWAB's majority proposal is the **Sentience-Weighted Harm Index (SWHI)**. Under SWHI an expert panel assigns each species a Sentience Confidence score *c* between 0 and 1, and assigns each recurring welfare-relevant event *e* (e.g., a day at a given stocking density, a handling episode, a slaughter method) an Aversiveness score *a* between 0 and 10. A farm's index is the sum, over all events and species, of *c* × *a* × *n*, where *n* is the number of individuals undergoing that event in a year. The farm's grade is set by the size of this total. The Board's stated rationale is that a farm can lower its index either by treating its animals better or by keeping fewer of them.

  The minority proposes a **Threshold Trigger Schedule (TTS)**: the panel asks only whether evidence of sentience for a species is adequate. If yes, the species is scheduled and specific practices become prohibited outright (e.g., slaughter without stunning, stocking densities above a ceiling, live sale for boiling). There is no weighting, no summing, and no offsets between species or individuals.

  *Case:* Brackenmoor Farm runs two lines: whiteleg shrimp (40 million/year, ice-slurry harvest, *a*=3, *c*=0.5) and rainbow trout (200,000/year, CO₂ narcosis, *a*=6, *c*=0.9). Under SWHI, the shrimp line contributes 60,000,000 to the index and the trout line 1,080,000. Replacing ice-slurry harvest (*a*=1) would cut the index by ~40,000,000—more than closing the trout line altogether.

  **(a)** Explain precisely what quantity the SWHI measures and what ethical commitments are embedded in its arithmetic structure. [12 marks]
  **(b)** If the SWHI were normalised per individual (dividing the total index by total *n*) rather than summed, how would the ethical incentives for a producer change, and what new philosophical problem would this introduce? [12 marks]
  **(c)** Adjudicate between SWHI and TTS. Which instrument better serves the purpose of a welfare certification standard? Propose a specific modification to your chosen instrument (or a hybrid) to remedy its primary defect. [16 marks]

  ***

  ### Model Answer

  **(a)** The SWHI measures the **total cumulative welfare burden** imposed by a facility over a production cycle. Ethically, the arithmetic commits the Board to a form of **aggregative utilitarianism**. By multiplying aversiveness by numbers (*n*), the Index asserts that the moral weight of an event scales linearly with population size. Consequently, it permits trade-offs: severe harm to few individuals can be morally outweighed by mild harm to many, or vice versa. Crucially, the rationale that a farm can lower its index by "keeping fewer of them" commits the Board to the view that non-existence is preferable to existence with welfare deficits. This implies a **replaceability argument**: reducing production volume is ethically equivalent to improving welfare conditions, treating animals as vessels of negative utility rather than subjects of rights.

  **(b)** Normalising the index per individual shifts the metric from **total harm** to **average harm per animal**. This changes producer incentives significantly. Under the summed SWHI, Brackenmoor is penalised for scale; under a normalised index, Brackenmoor is penalised only for intensity. A producer could expand production indefinitely without penalty, provided the average welfare per animal remains constant. This introduces the **"Logic of the Larder" problem**: if the average welfare is positive (or sufficiently low in negativity), the instrument might implicitly encourage creating more lives to dilute the fixed costs of welfare compliance, or conversely, it ignores the total moral magnitude of the operation. It fails to capture the cumulative impact on the global stock of suffering, prioritising the "quality of life" of the abstract individual over the total welfare consequence of the industry.

  **(c)** The choice between SWHI and TTS is not merely factual but teleological: it depends on what a certification standard is *for*. If the purpose is **consumer information regarding total moral impact**, SWHI is superior because it accounts for scale; a high-welfare factory farm still generates more total suffering than a low-welfare artisanal one. However, SWHI risks allowing "licenced cruelty" where high-aversion practices persist if *n* is low enough. If the purpose is **rights-protection**, TTS is superior. It establishes deontological constraints that cannot be traded off against numbers.

  However, TTS is brittle; it ignores continuous improvement below the threshold. I propose a **Hybrid Threshold-Index**: adopt TTS as a "gatekeeper" (certain practices are prohibited regardless of *n* or *c*), but use a normalised SWHI for grading *above* that threshold. This remedies the SWHI's willingness to permit prohibited harms via offsets, and remedies the TTS's failure to distinguish between a farm just below the ceiling and one far below it. This acknowledges that while some harms are absolute (rights), others are matters of degree (welfare), and that certification must signal both compliance and excellence.

  ***

  ### Marking Scheme (40 Marks)

  **Part (a): SWHI Mechanics and Commitments (12 Marks)**

  | Move / Insight | Marks | Characteristic Mistake / Note |
  | :--- | :---: | :--- |
  | Identifies SWHI measures **total cumulative burden** (not average, not risk). | 3 | *Error:* Describing it as "risk assessment" or "welfare quality" without mentioning aggregation. |
  | Identifies commitment to **aggregative utilitarianism** (trade-offs allowed). | 3 | *Error:* Saying "it values numbers" without explaining the trade-off implication. |
  | Notes the **replaceability/non-existence implication** ("keeping fewer of them"). | 4 | *First-Class:* Explicitly links the reduction of *n* to the moral status of existence vs. non-existence. |
  | Uses Brackenmoor data to illustrate the **disproportionate weight of *n***. | 2 | *Error:* Merely repeating the math without interpreting the ethical weight of the shrimp vs. trout. |

  **Part (b): Normalisation and Incentives (12 Marks)**

  | Move / Insight | Marks | Characteristic Mistake / Note |
  | :--- | :---: |--- |
  | Correctly identifies shift from **Total Utilitarianism to Average Utilitarianism**. | 4 | *Error:* Vague statement that "it changes the numbers" without ethical categorisation. |
  | Explains incentive change: **Scale becomes neutral** (expansion allowed if average holds). | 4 | *First-Class:* Notes this removes the penalty for industrial scaling. |
  | Identifies the **"Logic of the Larder"** or equivalent population ethics problem. | 4 | *First-Class:* Explains that normalisation ignores the *magnitude* of total suffering in the world. |

  **Part (c): Adjudication and Proposal (16 Marks)**

  | Move / Insight | Marks | Characteristic Mistake / Note |
  | :--- | :---: |--- |
  | Identifies the **teleological conflict** (Information/Impact vs. Rights/Constraints). | 5 | *First-Class:* Explicitly states the disagreement is about the *purpose* of the standard, not just sentience facts. |
  | Critiques SWHI: **Licenced cruelty / Offsetting risks**. | 3 | *Error:* Critiquing SWHI only on "mathematical difficulty" rather than ethical risk. |
  | Critiques TTS: **Binary rigidity / No continuous improvement**. | 3 | *Error:* Praising TTS as "stricter" without noting it ignores sub-threshold welfare. |
  | **Proposal:** Hybrid or modified instrument. | 3 | *Error:* Proposing "more research" or "better scores" rather than structural change. |
  | **Justification:** Proposal remedies the specific defects identified above. | 2 | *First-Class:* Shows how the hybrid solves the "purpose" conflict (Rights + Grading). |

  **General Penalties**
  *   **Recall over Reasoning:** -5 marks if the answer relies on citing real-world legislation (e.g., UK Welfare of Farmed Animals Regulations) rather than reasoning from the AWAB scenario.
  *   **Confusion of Sentience and Welfare:** -5 marks if the candidate treats *c* (sentience confidence) as a welfare outcome rather than a weighting factor.
  *   **Structure/Clarity:** -2 marks if the distinction between (a), (b), and (c) is blurred.

  **First-Class Boundary (30+ Marks)**
  To achieve a First, the candidate must move beyond stating that "aggregation is controversial." They must specify *why*: the assumption of linear substitutability between individuals and the ethical equivalence of non-existence and welfare improvement. In Part (c), they must recognise that SWHI and TTS are not just different calculations but different regulatory philosophies (consequentialist vs. deontological), and their proposal must reflect this synthesis. A pass (20-29) will correctly calculate the implications but treat the ethical commitments as mere "limitations" rather than foundational philosophical stances.
