answer: |-
  At a small water treatment plant, Operator A skipped the manual chlorine check Tuesday morning, relying on an automated sensor that Tech B had pulled for maintenance Monday without logging it offline, while Supervisor C approved the skip based on a dashboard displaying stale "active" status. By Wednesday, contamination surfaced, triggering an investigation into a niche regulatory clause: local laws mandate manual checks whenever the automated system lacks "primary" certification, which had expired twelve days prior, legally nullifying the sensor's authority regardless of its functional state. Consequently, Operator A's omission was causally redundant—had the sensor worked, the water would have been safe—but normatively critical, as the expired certification rendered the automated system illegitimate, making the manual check the sole legal barrier against contamination despite the technical redundancy built into the plant's design.

  **Walkthrough**

  *   **The Counterfactual Test:** The standard "but-for" test fractures under nested redundancies. Factually, there are two sufficient omissions: but-for Tech B's failure to log the sensor, the automation would have caught the contamination; but-for Operator A's failure to check manually, the contamination would have been caught. Usually, this creates causal overdetermination where neither omission is strictly necessary because the other could have prevented the harm. However, the legal twist alters the baseline of the counterfactual world. Because the certification had expired, the "normal course of events" legally excludes the sensor as a valid preventative measure. Therefore, the only legally coherent counterfactual world where safety is maintained is one where Operator A performs the manual check, effectively erasing Tech B's omission from the legal causal equation.

  *   **Normative Expectation:** Operator A bears the normative burden despite physical causal redundancy. The regulation shifts the duty of care entirely to the human agent once certification lapses. Even though the sensor *could* have physically prevented the harm, it was not *permitted* to be the primary safeguard. Therefore, A's omission is treated as the active cause of the harm because A failed to execute the only legally sanctioned prevention method. This creates a scenario where an omission is causally inefficient (the machine could have done it cheaper/easier) but normatively exclusive (the machine wasn't allowed to do it), forcing liability onto the human operator for failing to act as the sole valid barrier.

  *   **Causal Chain Fracture:** The chain fractures between factual causation and legal imputation. Factually, Tech B's failure to log the sensor offline is the root physical cause that disabled the redundancy layer. Legally, however, the chain is severed earlier at the regulatory timeline (the 30-day certification window), rendering B's action irrelevant to liability because the system was already legally "blind" before B touched it. The conceptual mess lies in labeling A's omission as the "cause" when, physically, the system was already compromised by B; yet, because the law refuses to recognize the compromised system as valid, A's inaction becomes the sole juridical cause, conflating moral/legal blame with physical causality and treating a missed opportunity as the definitive origin of the harm.
