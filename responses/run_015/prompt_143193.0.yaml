answer: |-
  # PREP SHEET: Moderate Realism & The Transport Test
  **Session:** Joint Philosophy of CogSci / CS Interpretability
  **Goal:** Survive the Q&A without conceding the core thesis, while acknowledging methodological limits.

  ## EARLY CONCESSIONS (First 5 Minutes)
  *Do not wait for these to be raised. State them during your methodology section to disarm the methodological critics.*

  1.  **Concede SAE Underdetermination:** Explicitly state that SAE features are sensitive to hyperparameters (sparsity penalty, dictionary size). Acknowledge that widening the dictionary often splits "coarse" features into "fine" ones.
      *   *Why:* This buys goodwill from the **Lab Leader**. It shows you aren't claiming the *current* SAEs are the final ontology, but that the *method of discovery* points to something real beneath the instability.
  2.  **Concede Promiscuity:** Admit that not every direction is representational. Most of the residual stream is likely noise, interference, or transient computation.
      *   *Why:* This disarms the **Embodied Critic** and **Dennettian**. It prevents them from attacking you on "ghost features" that don't exist. You are claiming realism about *stable, transportable* directions, not all activations.

  ---

  ## THE EIGHT OBJECTIONS
  *Ordered by likelihood and potential damage. Phrased in the questioner's voice.*

  ### 1. The Instrumentalist Control Objection
  **Who:** One of the two Instrumentalists.
  **Likelihood:** High. **Damage:** Medium.
  **The Question:** "You've shown that clamping this direction changes the output. That's a causal control result. Why do you need the word 'representation' at all? If I can steer the car, I don't need to know if the steering wheel 'means' left. Isn't 'representation' just ornamentation on a successful intervention?"
  **Your Reply:** "Intervention proves causality, but not *identity*. I can steer a model by injecting noise, but that doesn't make the noise a feature. My claim is that the *specificity* of the effect—across tasks and prompts—suggests the model is using this vector as a stable handle on a specific property of the world. The Transport Test seals this: if I move this handle to a sibling model and it steers the *same* concept without retraining, it's not just a local control knob; it's a shared structural element. We call it 'representation' to distinguish structural handles from causal levers."
  **Soft Spot:** You are relying on the intuition that "shared structure" implies "representation." An instrumentalist can still say shared structure is just shared computational efficiency, not semantics.

  ### 2. The Methodological Stability Objection
  **Who:** The Lab Leader.
  **Likelihood:** High. **Damage:** High.
  **The Question:** "You're building a metaphysical claim on SAE features. But we know these features fragment when you change the dictionary size. If the 'bridge feature' splits into 'suspension' and 'location' features with a larger dictionary, which one is the real one? How can you be a realist about entities that dissolve under methodological pressure?"
  **Your Reply:** "I'm not claiming the current SAE units are the atomic truth. I'm claiming the *subspace* they approximate is real. Think of it like principal components: the exact basis vector might shift with sample size, but the variance explained is a property of the data distribution. My Transport Test looks for the affine map that preserves behavioral role. If the 'bridge concept' exists as a stable subspace, different dictionary sizes should just be different resolutions of the same underlying geometry. The realism is about the geometry, not the specific sparsity level."
  **Soft Spot:** This is a promissory note. You don't actually have the data showing subspace stability across dictionary sizes yet, only across model seeds.

  ### 3. The Temperature vs. Coordinates Objection
  **Who:** Philosopher of Science (Measurement/Modelling).
  **Likelihood:** Medium. **Damage:** High.
  **The Question:** "Is this feature like temperature—a real, multiply-realized macroscopic property we measure via a specific procedure? Or is it like choosing a coordinate system, where the axes are convenient but arbitrary? If I rotate the residual stream, do I lose the feature?"
  **Your Reply:** "It's closer to temperature, but with a twist. Temperature is defined by its causal role in thermodynamics. My 'Interventional Profile' defines the feature by its causal role in the network's inference. The Transport Test acts as the measurement invariance check. If I rotate the basis in Model A, I must apply the inverse rotation to the affine map to find it in Model B. If the behavioral role survives the mapping, the 'coordinate' wasn't arbitrary; it was locked to the function. The realism lies in the invariance of the role, not the specific vector indices."
  **Soft Spot:** This risks conflating functional role with semantic content. Temperature doesn't *represent* heat; it *is* a measure of kinetic energy. Your features claim to be *about* bridges.

  ### 4. The "RSA with Extra Steps" Objection
  **Who:** Visiting Systems Neuroscientist.
  **Likelihood:** Medium. **Damage:** Medium-High.
  **The Question:** "In systems neuro, we do cross-animal alignment via Representational Similarity Analysis (RSA) all the time. We map neural manifolds to show conserved coding. Your 'Transport Test' sounds like affine RSA. Why is this philosophical realism and not just standard decoding? And aren't you risking the 'grandmother cell' fallacy by localizing concepts to single directions?"
  **Your Reply:** "RSA compares similarity structures; I'm claiming identity of mechanism. RSA says 'Model A and B treat these inputs similarly.' My test says 'This specific vector in A *is* the functional counterpart of this vector in B.' Regarding grandmother cells: I'm not claiming one neuron per bridge. I'm claiming one *direction* in a high-dimensional stream. That's more like a population code axis. The difference is I'm using intervention to verify the code is read by the downstream layers, not just that it correlates with the input."
  **Soft Spot:** Neuroscientists know that "functional counterpart" is notoriously hard to define without appealing to evolutionary history, which LLMs lack.

  ### 5. The Normativity/Misrepresentation Objection
  **Who:** Dennett-style Skeptic.
  **Likelihood:** Medium. **Damage:** Critical.
  **The Question:** "Representation requires the possibility of error. A thermometer isn't wrong; it just breaks. For a state to represent 'Golden Gate Bridge,' the model must be able to misrepresent it. But gradient descent only selects for loss reduction. What makes a direction *supposed* to mean the bridge, rather than just being a state that correlates with bridge-text and lowers loss? Where is the normativity?"
  **Your Reply:** "I agree that without selection history, teleosemantics is hard. But I'm arguing for a structural realism, not a teleological one. The 'norm' comes from the consistency of the interventional profile. If clamping the direction makes the model assert 'bridge' in contexts where there is no bridge, we can call that a hallucination induced by the feature. The feature's 'job' is defined by what the downstream layers *do* with it. If they treat it as 'bridge-info,' then that is its functional content, even if the training history doesn't ground 'truth'."
  **Soft Spot:** **This is your weakest point.** You are substituting functional consistency for normativity. The skeptic will press that functional consistency is just more correlation. (See "Hope Nobody Asks" below).

  ### 6. The Embodied/Dynamical Objection
  **Who:** Embodied Cognition Scholar.
  **Likelihood:** Low. **Damage:** Medium.
  **The Question:** "You're assuming the mind (or model) is a container with internal states that mirror the world. But cognition is a dynamic loop between agent and environment. Why look for static vectors in a residual stream? Maybe the 'representation' is in the trajectory of the activation over time, not the direction at a single layer."
  **Your Reply:** "I'm not denying dynamics. The residual stream is a trajectory. But for the system to coordinate that trajectory, it needs stable landmarks. Think of a dynamical system with attractors. My 'directions' are the axes along which those attractors are organized. You can have dynamics without representation, but you can't have *generalizable* dynamics without stable structure. The Transport Test shows the structure persists across training runs, suggesting it's a necessary scaffold for the dynamics, not just an ephemeral state."
  **Soft Spot:** You are asserting the necessity of the scaffold without proving that a purely dynamical account couldn't explain the transportability.

  ### 7. The Causal Specificity Objection
  **Who:** Instrumentalist #2.
  **Likelihood:** Medium. **Damage:** Medium.
  **The Question:** "You say the direction is reused across tasks. But if I clamp it, I might be breaking a polysemantic circuit. Maybe this direction is 'bridge' in context A but 'structural support' in context B. How do you know intervention isn't just bludgeoning a multi-use wire and forcing it to one state?"
  **Your Reply:** "That's exactly why I require the 'Reuse' condition in the Interventional Profile. I don't just clamp it; I check the natural activation. If the direction naturally fires for 'structural support' metaphors in non-bridge contexts, then the feature *is* 'structural support,' and 'bridge' was just a subset. The realism claim adapts to the feature's actual scope. If the intervention breaks the model, I discard the feature. I only claim realism for features that survive the specificity test."
  **Soft Spot:** Polysemy is rampant in transformers. You might find very few features that pass this bar, potentially trivializing your realism.

  ### 8. The Affine Map Objection
  **Who:** Lab Leader or Neuroscientist.
  **Likelihood:** Low. **Damage:** High.
  **The Question:** "You assume an affine map is sufficient to translate features between models. But representation might be non-linear. If the 'bridge' concept is curved in the manifold of Model A but straight in Model B, your linear transport fails. Does that mean the feature isn't real, or just that your test is too weak?"
  **Your Reply:** "If the linear map fails, I don't claim the feature is unreal, but I can't claim it's *the same* feature via my test. I'm starting with linear maps because residual stream addition is linear. If the concept is curved, it's likely composed of multiple linear features interacting. My realism is conservative: I only claim the linearly transportable ones. If the concept requires non-linear mapping, it's a higher-order structure, not a base feature."
  **Soft Spot:** This limits your realism to a subset of features that might be the least interesting ones.

  ---

  ## THE "MUST-LAND" REPLY
  **Target:** Objection #1 (Instrumentalist) & #4 (Neuroscientist) overlap.
  **Why:** If you cannot distinguish your view from "useful decoding," you are just doing engineering, not philosophy of science.
  **The Core Argument:** "Decoding tells you what you can *read* from the model. Realism tells you what the model *uses* to compute. The Transport Test is the differentiator. If a pattern is readable but not transportable (i.e., Model B solves the task without that direction), it was an artifact of Model A's specific solution. If it is transportable, it is a convergent solution to the computational problem. Convergent solutions indicate structural necessity. Structural necessity is the best candidate for ontological reality we have in black-box systems."
  **Goal:** Convince them that *convergence across seeds* is the proxy for *mind-independent existence* in this domain.

  ---

  ## THE QUESTION YOU HOPE NOBODY ASKS
  **The Question:** "You claim these directions are representational because they shift behavior. But if I train a model on a dataset where 'Golden Gate Bridge' is systematically swapped with 'Brooklyn Bridge', the same direction will fire for Brooklyn. The interventional profile remains identical. The transport test passes. But the content has flipped. Since the internal state is identical in both models, but the content is different, doesn't that prove the content is in the *data/environment*, not the *direction*? And if so, what exactly are you being a realist about?"

  **Why this kills you:** It exposes your admitted weakness on misrepresentation and normativity. It shows that your "Interventional Profile" tracks *functional role*, not *semantic content*. If the functional role is identical but the content flips based on external training data, your "Moderate Realism" collapses into "Realism about Functional Roles," which the Dennettian and Phil Sci will argue is not Realism about Representation at all.

  **Preparation:** If asked, do not try to solve teleosemantics on the fly.
  **Fallback:** "You're right that the *reference* is fixed externally. My claim is that the *vehicle* of representation is internal and real. I am a realist about the representational *vehicle* and its functional profile, not the external reference fixing. The direction is the real 'word' in the language of thought; the training data provides the dictionary. I'm claiming the words exist, not that they define their own meanings." (This concedes ground but saves the ontology of the vehicle).
