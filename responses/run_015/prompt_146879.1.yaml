answer: |-
  # Decision Tree: Transparency Note Claims on Model Understanding

  **Node 1 (Fragility):** You move the key lease clause from page 2 to the last page. The summary fails. Is the output *plausible legal language that gets the date wrong* or *obviously broken text (loops, gibberish)*?
  *   **Broken Text** → **Leaf 1: Hard Parrot Skeptic** (No semantic model exists; it's just pattern matching until it breaks.)
  *   **Plausible Language** → Go to Node 2.

  **Node 2 (Shape-of-Failure):** The date is wrong. Is the wrong date *pulled from elsewhere in the document* (misattribution) or *a completely hallucinated number* (fabrication)?
  *   **Hallucinated Number** → **Leaf 2: Unnamed** (The "Magic Guess" view: claims understanding despite errors having no semantic shape. Nobody defends this.)
  *   **Misattribution** → Go to Node 3.

  **Node 3 (Generalization):** A model trained on code explains a poem metaphor correctly. You alter the poem slightly so it's no longer funny. Does the model *explain why the logic breaks* or just *say "not funny"*?
  *   **Say "Not Funny"** → **Leaf 3: Threshold-Competence** (It meets the performance bar but lacks meta-cognitive grasp.)
  *   **Explain Logic Break** → Go to Node 4.

  **Node 4 (Grounding):** To trust the lease summary, must the model have *seen the physical office* described, or is the text alone sufficient?
  *   **Must See Office** → **Leaf 4: Grounding-First** (Understanding requires causal contact with reality.)
  *   **Text Sufficient** → Go to Node 5.

  **Node 5 (Internal Structure):** Do we require proof that a specific *vector direction* in the model corresponds to the "lease clause" concept?
  *   **Yes, Require Vector** → **Leaf 5: Structural-Isomorph** (Understanding is defined by internal representational geometry.)
  *   **No, Black Box OK** → Go to Node 6.

  **Node 6 (Utility):** If we ban the word "understand" from the doc and use "processes text" instead, does engineering velocity *drop* or *stay same*?
  *   **Velocity Drops** → **Leaf 6: Degrees/Gradualist** (The word is a useful shorthand for partial capability.)
  *   **Velocity Same** → **Leaf 7: Deflationary** (Retire the word; it obscures more than it clarifies.)

  ***

  ### Unseparable Leaves
  *   **Threshold-Competence vs. Degrees/Gradualist:** In practice, these often collapse into the same policy. One says "it passes the bar," the other says "it's 80% there." For a transparency note, the distinction rarely changes the wording.
  *   **Structural-Isomorph vs. Degrees/Gradualist:** If you require internal structure verification, you usually end up grading the completeness of that structure, which becomes a gradualist claim anyway.

  ### Unoccupied Paths
  *   **Grounding-First + Deflationary:** (Answer "Must See Office" at Node 4, then "Velocity Same" at Node 6). **Incoherent.** If you believe understanding *requires* physical contact, you believe the word refers to a specific ontological state. You cannot simultaneously claim the word is useless shorthand.
  *   **Hard Parrot + Explain Logic Break:** (Answer "Broken Text" at Node 1, then "Explain Logic" at Node 3). **Incoherent.** A model that produces gibberish on a position shift cannot reliably explain joke logic. This path is mechanically impossible.
  *   **Unnamed + Threshold-Competence:** (Answer "Hallucinated Number" at Node 2, then "Say Not Funny" at Node 3). **Merely Unattractive.** Nobody argues that random hallucination is compatible with passing competence thresholds, though a few might try to claim performance masks the error shape.

  ***

  ### My Commitment
  I land on **Leaf 7: Deflationary**.

  **Why:** For an internal guidance doc, the goal is risk reduction and clarity, not philosophical resolution. "Understanding" is a leaky abstraction that invites anthropomorphism from stakeholders and complacency from engineers. If banning the word doesn't slow us down (Node 6), we remove the liability. We should describe *capabilities* (e.g., "extracts clauses with 95% accuracy") rather than *states* (e.g., "understands the lease"). This avoids the trap of having to defend why the model "understood" the lease but failed when the clause moved to page 10. Functional descriptions survive fragility tests; mental state claims do not.
