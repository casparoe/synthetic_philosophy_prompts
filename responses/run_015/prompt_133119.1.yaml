prompt: |-
  I'm working through the literature for a philosophy of economics seminar, and I've become stuck on a prior question: before comparing particular accounts of how financial markets aggregate dispersed belief into price—whether rational-expectations models, noise-trader approaches, or Hayekian knowledge arguments—I want to know what we should ask of any epistemology of markets in the first place. The specific tension I'm tracking is the one raised by no-trade theorems in common-knowledge frameworks: if rational agents share common priors and it is common knowledge that they are rational, then any observed trade should be impossible, yet markets clearly sustain continuous trading. Rather than resolving that paradox with one model or another, I want the full specification of adequacy conditions that any theory must meet if it claims to explain market epistemology without simply dissolving the tension by fiat.

  Please write the desiderata: what an adequate epistemology of markets must deliver. For each requirement, include the motivating case or consideration behind it—such as how the theory handles private information that is not merely hidden but structurally incommensurable across agents, a feature I will call strategic opacity, where the interpretive framework an agent uses to read prices is itself shaped by the market dynamics she is trying to interpret. Mark which desiderata are genuinely non-negotiable (for instance, consistency with the existence of sustained trade) and which are camp-specific preferences (such as determinism about price formation or the denial of any collective cognitive state). If some subset of your requirements is jointly unsatisfiable given classic no-trade results, say so explicitly—that is the part I most want to see. Also indicate, briefly, which single requirement does the most work in excluding the most popular competing theories, but keep the weight on the criteria themselves rather than on a full scorecard. I do not need citations, bibliographies, or reading lists; a model without web access should be able to construct the list from conceptual analysis alone.
