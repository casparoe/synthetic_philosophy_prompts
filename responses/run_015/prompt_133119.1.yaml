answer: |-
  ### Adequacy Conditions for an Epistemology of Markets

  To evaluate any theory claiming to explain how markets aggregate dispersed belief into price, one must first establish the boundary conditions that separate a genuine epistemological account from a mathematical artifact. The central tension is the **No-Trade Paradox**: if agents are rational, share common priors, and know that they are rational, they cannot agree to disagree, and speculative trade should vanish. Since trade persists, any adequate theory must explain the stability of disagreement without resorting to ad hoc assumptions that dissolve the paradox by definition.

  Below are the desiderata for such a theory, categorized by their necessity.

  ---

  #### I. Non-Negotiable Desiderata (Hard Constraints)
  *These conditions must be met for a theory to count as an explanation of actual market epistemology. Failure to meet these renders the model descriptively false or logically incoherent.*

  **1. Compatibility with Sustained Speculative Trade**
  *   **Requirement:** The theory must allow for continuous, voluntary exchange driven by divergent expectations of future value, not merely by exogenous liquidity needs or consumption smoothing.
  *   **Motivating Consideration:** The empirical reality of high-frequency, high-volume trading contradicts the prediction of no-trade theorems. A model that explains price formation only in the limit where trade ceases (a static equilibrium) fails to explain the dynamic process of the market itself. If a model requires trade to be zero to maintain rationality, it has modeled a library, not a market.

  **2. Rejection of Common Knowledge of Information States**
  *   **Requirement:** The theory must explicitly deny that the *structure* of information distribution is common knowledge among agents. It must specify a mechanism by which agents remain uncertain about what other agents know, even when they observe the same price.
  *   **Motivating Consideration:** In standard common-knowledge frameworks, observing a price instantly reveals the private information of all other traders, collapsing the information asymmetry required for trade. To sustain trade, the theory must posit a structural barrier to this inference. It is not enough that information is *private*; it must be *opaque* in its distribution.

  **3. Endogeneity of Interpretive Frameworks (Strategic Opacity)**
  *   **Requirement:** The theory must treat the agent's method for interpreting price signals as endogenous to the market process, rather than a fixed, exogenous function. The "language" of price must be capable of changing meaning based on the history of trading itself.
  *   **Motivating Consideration:** This addresses your specific concern regarding **strategic opacity**. In standard Rational Expectations Equilibrium (REE), the mapping from state to price is fixed and known. In reality, agents learn *how* to read prices from the market itself. If a crash changes how agents interpret volatility, the epistemological framework has shifted. A theory that assumes a fixed interpretive algorithm ignores the reflexive nature of financial cognition, where the tool of measurement (price) is altered by the act of measurement (trading).

  **4. Stability of Disagreement**
  *   **Requirement:** The theory must explain why disagreement does not self-correct immediately. It must provide a mechanism that prevents the "agreeing to disagree" paradox from resolving in the short run.
  *   **Motivating Consideration:** If agents update beliefs Bayesianly upon observing trade, they should rapidly converge to a consensus, extinguishing the motive for further trade. An adequate epistemology must explain the *friction* that maintains belief heterogeneity over time. This friction cannot simply be "slow updating"; it must be structural (e.g., differing priors, differing models of the world, or limits on inference).

  ---

  #### II. Camp-Specific Preferences (Soft Constraints)
  *These conditions reflect specific philosophical or economic commitments. A theory may fail these and still be adequate, but it will align with specific schools of thought.*

  **5. Convergence to Fundamental Value (The Efficiency Preference)**
  *   **Requirement:** Prices should, over time, converge to the discounted present value of future cash flows.
  *   **Camp Alignment:** **Neoclassical / Fama.**
  *   **Alternative:** **Keynesian / Behavioral.** These camps may prefer a theory that allows for persistent deviations from fundamental value due to sentiment or liquidity constraints. Demanding convergence excludes theories that view markets as inherently prone to bubbles.

  **6. Ontological Individualism (The Reductionist Preference)**
  *   **Requirement:** All market phenomena must be reducible to the properties and interactions of individual agents. There is no "market mind" or collective cognitive state irreducible to individual beliefs.
  *   **Camp Alignment:** **Methodological Individualists.**
  *   **Alternative:** **Complexity / Emergentists.** These camps may prefer a theory that allows for emergent properties where the market possesses information no single agent holds, in a strong, non-aggregative sense.

  **7. Determinism of Price Formation**
  *   **Requirement:** Given a set of initial beliefs and information, the resulting price path should be uniquely determined.
  *   **Camp Alignment:** **Formalists / Equilibrium Theorists.**
  *   **Alternative:** **Radical Uncertainty / Post-Keynesians.** These camps may prefer a theory that allows for multiple potential price paths from identical starting conditions, emphasizing indeterminacy and path dependence.

  ---

  #### III. The Impossibility Claim

  **The Jointly Unsatisfiable Triad**
  Given classic no-trade results (e.g., Milgrom-Stokey, Aumann), the following three requirements are logically incompatible. Any adequate theory must explicitly reject at least one:

  1.  **Common Priors:** All agents share the same prior probability distribution over states of the world.
  2.  **Common Knowledge of Rationality:** It is common knowledge that all agents update beliefs according to the same rational rules (e.g., Bayesian updating).
  3.  **Sustained Speculative Trade:** Agents continuously trade based on divergent expectations of asset value.

  **Implication:** A theory cannot satisfy all three.
  *   **Rational Expectations models** typically preserve (1) and (2) by redefining trade as non-speculative (liquidity-based), thereby violating (3).
  *   **Behavioral models** typically preserve (1) and (3) by relaxing (2) (introducing irrationality or bias).
  *   **Heterogeneous Agent / Hayekian models** typically preserve (2) and (3) by rejecting (1) (allowing for fundamentally different priors or models).

  An adequate epistemology must declare which horn of this trilemma it accepts. A theory that attempts to hold all three is mathematically incoherent.

  ---

  #### IV. The Most Exclusionary Requirement

  **The Endogeneity of Interpretive Frameworks (Desideratum #3)**

  This is the single requirement that does the most work in excluding the most popular competing theories.

  *   **Why it excludes Rational Expectations Equilibrium (REE):** REE assumes a fixed, known mapping between the state of the world and the price. Agents know the "code" of the market. Desideratum #3 demands that the code itself evolves. This excludes any static equilibrium model where the price function is a given parameter rather than an evolving object of discovery.
  *   **Why it excludes Standard Noise-Trader Models:** While these models allow for trade, they typically treat "noise" as an exogenous random variable (e.g., liquidity shocks) external to the agents' cognitive framework. Desideratum #3 requires that the "noise" be endogenous to the interpretive struggle between agents. If the opacity is strategic, it arises from the interaction of differing frameworks, not from an external random generator.
  *   **Why it excludes Pure Common-Prior Models:** If the interpretive framework is endogenous, agents effectively operate with different "models" of the market. This functionally acts as a rejection of Common Priors, even if the agents claim to share the same data.

  **Conclusion:**
  To construct an adequate epistemology of markets, you must demand a theory that **sacrifices Common Priors or Common Knowledge of Rationality** to save **Sustained Trade**, while simultaneously explaining how agents **learn to read prices in a market where the meaning of prices is constantly shifting.** Any theory that offers a fixed mapping from information to price, or that assumes agents know how other agents think, fails the test of strategic opacity.
