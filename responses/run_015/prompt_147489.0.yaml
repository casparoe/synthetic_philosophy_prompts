answer: |-
  # The Darwin/Turing Inversion Checklist (15-Minute Referee Protocol)

  **Purpose:** To evaluate claims of "real comprehension" in agents (AI or human) based solely on observable behavior, acknowledging that optimization (Darwin) can produce competence without understanding, and observation (Turing) is limited to output.
  **Constraint:** Black-box evaluation only (no weights, no internal transcripts).
  **Time Limit:** 15 Minutes.

  ---

  ### Step 1: Claim Isolation (2 Minutes)
  Identify the specific cognitive capacity claimed (e.g., "Newtonian intuition," "First-order logic"). Isolate the benchmark used to prove it.
  *   **[JUDGMENT CALL]:** Is the benchmark distinct from the training/optimization objective? If the agent was optimized directly on this test distribution, comprehension is unproven by definition.
  *   **Warning:** Do not accept "chain of thought" as evidence of reasoning; treat it as additional output tokens subject to the same optimization pressures.

  ### Step 2: Surface Invariance Test (4 Minutes)
  Review if the paper tests for *semantic invariance*. Can the agent solve the problem if surface features change but logic remains identical? (e.g., swapping "mass" for "charge," "apple" for "planet," or variable names $x \to \alpha$).
  *   **[JUDGMENT CALL]:** If performance drops >10% on isomorphic tasks, flag as "Cue-Dependent."
  *   **Darwinian Logic:** Natural selection (or gradient descent) optimizes for the specific environment. If the agent fails when the environment's surface texture changes, it adapted to the texture, not the underlying law.

  ### Step 3: Counterfactual Stress (4 Minutes)
  Check for performance on out-of-distribution (OOD) edge cases that violate common heuristics but hold to the claimed logic. (e.g., Physics in a vacuum vs. air; Logic with negated premises).
  *   **[JUDGMENT CALL]:** Does the agent fail silently (confident wrong answer) or explicitly (uncertainty/refusal)? Silent failure suggests heuristic matching, not model-based simulation.
  *   **Turing Logic:** You cannot see the "model." You can only see if the output function breaks when inputs leave the training manifold.

  ### Step 4: Heuristic Audit (3 Minutes)
  Ask: "Could a simpler, non-comprehending system achieve this score?" Look for statistical shortcuts (e.g., answering based on question length, keyword association, or unit matching).
  *   **[JUDGMENT CALL]:** If a bag-of-words baseline achieves >80% of the agent's score, the claim of comprehension is rejected.
  *   **Warning:** This is a sufficiency test, not necessity. A simple heuristic *can* exist even if the agent is complex.

  ### Step 5: The Inversion Verdict (2 Minutes)
  Combine findings. If the agent displays Cue-Dependence (Step 2), Silent Failure (Step 3), or Heuristic Sufficiency (Step 4), you must conclude: **"Behavior is consistent with optimization without comprehension."**
  *   **[JUDGMENT CALL]:** You are not ruling out understanding; you are ruling out the *evidence* for it. The burden of proof is on the claim of "real" comprehension, not on the skepticism.

  ---

  ### Application to Hard Cases

  #### Case 1: The Brittle Language Model
  *   **Scenario:** LM scores 95% on mechanics word problems. When variable names are randomly swapped ($F=ma$ becomes $F=xy$), accuracy drops to 40%.
  *   **Checklist Result:** Fails Step 2 (Surface Invariance).
  *   **Verdict:** **Claim Rejected.** The model optimized for token co-occurrence (Darwinian fitness), not physical law. It is a stochastic parrot, not a physicist.
  *   **Misfire Warning:** None. This is the intended use case.

  #### Case 2: The Human Expert (The Uncomfortable Truth)
  *   **Scenario:** A human physicist scores 95% on standard problems. When variable names are swapped unexpectedly during a timed test, they hesitate, make sign errors, and drop to 70%. They rely on modular heuristics ("usually $g$ is down") rather than deriving from first principles every time.
  *   **Checklist Result:** Fails Step 2 (Surface Invariance) and potentially Step 4 (Heuristic Audit—human brains use heuristics).
  *   **Verdict:** **Claim Denied (Per Checklist).** By the strict behavioral criteria of the Darwin/Turing inversion, this human demonstrates "competence without guaranteed comprehension." Their behavior is indistinguishable from an overfitted model.
  *   **Why I Won't Like This:** It forces me to admit that if "comprehension" is defined by robust, invariant behavioral output, humans often lack it. It conflates *cognitive fragility* with *lack of understanding*. The checklist cannot distinguish between a human "thinking" and a human "recalling," only that both are brittle under perturbation.

  #### Case 3: The Ambiguous Deadlock
  *   **Scenario:** An agent passes Surface Invariance and Counterfactual Stress. However, its "explanations" (Step 1) are perfectly fluent but structurally identical to its outputs (post-hoc rationalization). A simpler heuristic *might* work, but is hard to construct.
  *   **Checklist Result:** Passes Steps 2 & 3. Step 4 is inconclusive. Step 5 deadlocks.
  *   **Verdict:** **Inconclusive.** The behavior is robust, but the Darwinian possibility remains: a sufficiently large optimizer can mimic robustness without internal grounding.
  *   **Deadlock:** We cannot distinguish between a system that *has* a world model and a system that *simulates* having a world model perfectly. Turing wins; we are stuck at the glass.

  ---

  ### What This Checklist Can't Do
  1.  **Prove Absence:** It cannot prove the agent *lacks* understanding, only that the provided evidence is compatible with lack of understanding.
  2.  **Access Ontology:** It cannot determine if the internal state "feels" like anything (qualia) or represents truth, only if it functions robustly.
  3.  **Distinguish Substrate:** As seen in Case 2, it treats carbon and silicon identically. If a human fails the robustness test, the checklist denies them comprehension just as it would an AI.

  Blind spot: The internal causal structure generating the behavior.
