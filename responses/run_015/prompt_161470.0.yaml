      *   The User needs to argue: **Knowledge of a fact requires grasping it under *some* concept, but if the concept is irreducible, the fact is distinct.** (This is tricky).
      *   *Better approach:* Focus on **A Priori Entailment**. Most contemporary physicalists accept a posteriori physicalism. To refute them, you must argue that **Physicalism requires A Priori Entailment**. If you accept a posteriori physicalism, the Knowledge Argument fails to prove dualism (it only proves an epistemic gap).
