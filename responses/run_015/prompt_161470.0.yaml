          1.  **Mode of Presentation / Fregean Sense:** The fact is physical, but Mary grasps it via a new phenomenal concept. (Old fact, new way of knowing).
          2.  **A Posteriori Physicalism / Non-derivability:** Physical facts necessitate phenomenal facts, but you can't deduce the latter from the former a priori. (The "Conceptual Gap" vs. "Ontological Gap").
      *   *Assessment:* The friend is philosophically correct. These are the standard, robust physicalist responses to Jackson. It's not just "word games"; it's a substantive debate about the nature of facts, concepts, and entailment.
