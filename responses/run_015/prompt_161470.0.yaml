answer: |-
  This is a fantastic setup for an undergrad paper. You have clearly grasped the core mechanics of the argument and even anticipated a major objection (the Ability Hypothesis) with your cortical stimulator stipulation.

  Here is the breakdown of who is right, why your friend isn't just playing "word games," and the specific premise you need to add to make your conclusion hold water.

  ### 1. Who is right?
  **Technically, your friend is right.** But you are right about the *intuition*.

  Your friend is pointing out the two most standard, robust physicalist responses to Frank Jackson's original argument. They aren't word games; they are substantive philosophical positions that dominate the current literature.
  *   **The "New Guise" Reply:** This is known as the **Phenomenal Concept Strategy (PCS)**. Physicalists argue that Mary learns no new *fact* about the world. She learns a new *way of representing* an old fact. She already knew the brain state associated with red; now she possesses a "phenomenal concept" that refers to that same brain state directly.
  *   **The "Necessitated but not Derivable" Reply:** This is **A Posteriori Physicalism**. This view holds that phenomenal facts are *necessitated* by physical facts (so there is no ontological dualism), but they cannot be *deduced* a priori from them (there is an epistemic gap).

  If you submit the paper with your current setup, a sharp grader will say: *"You have proven there is an epistemic gap, but you haven't proven there is an ontological gap. You haven't ruled out A Posteriori Physicalism."*

  ### 2. Why your stipulation doesn't kill *that* reply
  Your cortical stimulator stipulation successfully kills the **Ability Hypothesis** (the idea that Mary only learns *how* to imagine/remember, not *that* something is the case). By giving her the ability to simulate the experience without the knowledge, you show that the ability and the knowledge are distinct.

  However, it does **not** kill the **Phenomenal Concept Strategy**. Even with the stimulator, a physicalist can say:
  > "When Mary uses the stimulator, she is activating physical brain state $X$. When she sees red, she is activating physical brain state $X$. It is the same state. The 'newness' is just that she now has a first-person conceptual hook for state $X$, whereas before she only had a third-person theoretical hook. The *fact* remains physical."

  ### 3. The Missing Premise
  To get from "Mary learns something new" to "Physicalism is false," you need to bridge the gap between **Epistemology** (knowledge/concepts) and **Ontology** (facts/reality).

  You need to explicitly argue for (or stipulate as a definition of physicalism) the **Principle of A Priori Entailment**.

  **The Missing Premise:**
  > **"If Physicalism is true, then all facts about the world must be a priori deducible from the complete physical facts."**

  **Why you need this:**
  *   **Without this premise:** A physicalist can say, "Sure, Mary couldn't deduce the experience from the physics. That just means human concepts are limited. The reality is still purely physical." (This is A Posteriori Physicalism).
  *   **With this premise:** If Mary knows all physical facts, and Physicalism is true, she *must* be able to deduce the fact of what it is like to see red. She can't. Therefore, Physicalism (defined this way) is false.

  ### 4. How to structure the paper
  Since you want to settle this before committing, here is a structure that allows you to use your intuition while respecting your friend's objection. This will get you better marks than ignoring the "new guise" reply.

  **I. Introduction**
  *   Introduce the Knowledge Argument.
  *   State your thesis: Mary's Room demonstrates that physicalism is false because it reveals non-physical facts.
  *   **Crucial:** Define Physicalism explicitly as requiring **A Priori Entailment**. (This pre-empts your friend's objection).

  **II. The Setup (Your Contribution)**
  *   Describe Mary.
  *   **Insert your Cortical Stimulator Stipulation.** Explain that this blocks the "Ability Hypothesis" (Lewis/Nemirow). If she can already simulate the experience but still learns something new upon release, it must be propositional knowledge (knowledge *that*), not just ability (knowledge *how*).

  **III. The Physicalist Objection (Your Friend's Point)**
  *   Charitably present the **Phenomenal Concept Strategy**.
  *   Explain that a physicalist claims Mary just acquires a new *concept* for an old *physical fact*.
  *   Explain **A Posteriori Physicalism**: The idea that facts can be physical even if not deducible.

  **IV. The Counter-Argument (Where you earn your grade)**
  *   You must argue why the "New Guise" reply fails. You have two options here:
      1.  **Defend A Priori Entailment:** Argue that a physicalism that allows for inexplicable epistemic gaps is a "physicalism" in name only. If the physical story is the *whole* story, it should explain everything without remainder.
      2.  **Attack the Concept Strategy:** Argue that if two concepts (phenomenal 'red' and physical 'wavelength') are not inter-translatable even in principle, they refer to different properties. If they refer to different properties, then property dualism is true.

  **V. Conclusion**
  *   Reiterate that while the Ability Hypothesis is dead (thanks to your stipulation), the real battle is against A Posteriori Physicalism.
  *   Conclude that because the epistemic gap cannot be bridged even with full physical information, the ontological gap must exist.

  ### Summary Advice
  Your friend is saving you from a common undergrad mistake (confusing an epistemic gap for an ontological one). Don't dismiss their objection as word games; instead, **make their objection the central tension of your paper.**

  If you explicitly state that you are defining Physicalism as requiring **A Priori Entailment**, your argument becomes logically valid. If you don't define it that way, your friend is correct that a physicalist can accept your conclusion without giving up physicalism.

  **Recommendation:** Go with the structure above. It shows you understand the nuance (which professors love) while still arguing for the dualist conclusion you want to defend.
