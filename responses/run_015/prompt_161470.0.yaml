      *   *The Missing Premise:* **The Principle of A Priori Entailment.** (If $P$ entails $Q$, and one knows all $P$, one can know $Q$ without further empirical experience). Or, stronger: **There are no non-physical modes of presentation for physical facts.**
      *   *Actually, the most precise missing premise is:* **If Mary learns a new proposition, it corresponds to a new fact (ontological commitment), not just a new concept.** (This attacks the "New Guise" reply).
      *   *Alternatively:* **Physicalism requires that all facts are a priori derivable from physical facts.** (This attacks the "A Posteriori Physicalist" reply).

  5.  **Synthesize the Advice:**
      *   **Validate the User:** Their intuition is common (Jackson's original intuition). The stipulation is clever.
      *   **Validate the Friend:** The friend is pointing out the standard counter-arguments in the literature. It's not word games; it's the core of the debate.
      *   **Clarify the Logic:**
          *   Premise 1: Mary knows all physical info.
          *   Premise 2: Mary learns something new (propositional).
          *   Conclusion: Physicalism is false.
          *   *Hidden Assumption:* Physicalism implies that all information/facts are entailed by physical information *and accessible via physical concepts*.
      *   **The "Extra Premise":** You need to argue against the **Phenomenal Concept Strategy (PCS)**. You need to claim that phenomenal concepts don't just mask the same physical reality but reveal a distinct property. Or, you need to argue that **A Priori Entailment** is a requirement for physicalism.
      *   **Paper Structure Advice:**
          1.  Present the Argument (with the stimulator stipulation).
          2.  Acknowledge the Ability Hypothesis is blocked.
