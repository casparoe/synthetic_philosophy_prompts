  One of the comments under her last post insists that what she's really doing is maximising the total and then splitting it evenly, which I think the 50/25 award kills — but say if I'm wrong about that, and whether that rule happens to agree with the others on our particular numbers anyway. Please write the answer in British English, and do show the arithmetic rather than just the final split.
