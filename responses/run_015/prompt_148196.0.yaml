  Here is the analysis of your mediator's track record, the predictions for your upcoming case, and my assessment of the situation.

  ### 1. Do the past cases discriminate between the rules?

  You have not misread the back catalogue. On the specific geometry of the past cases, the **Nash Bargaining Solution (NBS)** and the **Kalai–Smorodinsky Solution (KSS)** yield identical results.

  *   **Cases 1, 2, and 3 (Linear Frontier, Zero Walk-away):**
      Mathematically, whenever the feasible frontier is a straight line and the disagreement point is $(0,0)$, NBS and KSS coincide.
      *   **NBS** maximises the product of gains ($x \cdot y$). On a line $ax + by = c$, the maximum product occurs exactly at the midpoint of the intercepts $(c/2a, c/2b)$.
      *   **KSS** draws a line from $(0,0)$ to the ideal point (the intercepts). This line intersects the frontier exactly at that same midpoint.
      *   *Example (Case 2):* Frontier connects $(100, 0)$ and $(0, 50)$. Midpoint is $(50, 25)$. Both rules predict this.

  *   **Case 4 (Linear Frontier, Non-zero Walk-away):**
      Here, the frontier is $x + y = 100$ and walk-away is $d = (20, 20)$.
      *   **NBS:** Maximises $(x-20)(y-20)$. Due to symmetry, the solution is $x=y=50$.
      *   **KSS:** The maximum *gain* for A is $80$ (if B takes 20). The maximum *gain* for B is $80$ (if A takes 20). The ratio of ideal gains is 1:1. KSS splits the gains equally: 30 each. Total payoffs: $(50, 50)$.
      *   *Result:* Both rules again predict $(50, 50)$.

  **Conclusion:** Your suspicion is correct. The track record is inconclusive because the cases lacked the geometric complexity (curvature or asymmetric walk-aways on a linear frontier) required to pull the solutions apart.

  ### 2. The Commenter's Rule ("Maximise Total, Split Evenly")

  You are right to doubt this, and Case 2 proves the commenter wrong.

  *   **The Rule:** Find the point that maximises the sum $x+y$, then divide that sum equally.
  *   **Case 2 Application:** The frontier is $x + 2y = 100$. The sum $x+y$ is maximised at the corner $(100, 0)$, where the total is 100. Splitting this evenly implies 50 for each side. However, the point $(50, 50)$ is **infeasible** (it requires $50 + 2(50) = 150$, which exceeds the limit of 100).
  *   **Alternative Interpretation:** If the rule means "Split the gains equally" (Egalitarian), Case 2 would yield $x=y$, so $3x=100 \rightarrow 33.3/33.3$. The actual award was $50/25$.

  **Verdict:** The commenter's heuristic is mathematically incoherent on asymmetric frontiers and is ruled out by the mediator's own history. However, as we shall see, it accidentally aligns with one of the serious candidates in your specific case.

  ### 3. Predictions for Your Current Case

  **The Setup:**
  *   Disagreement point $d = (0, 0)$.
  *   Frontier Segment 1: $(0, 60)$ to $(40, 50)$. Equation: $y = 60 - 0.25x$.
  *   Frontier Segment 2: $(40, 50)$ to $(90, 0)$. Equation: $y = 90 - x$.
  *   Ideal Point (Utopia): Max A = 90, Max B = 60. So $u^* = (90, 60)$.

  #### A. Nash Bargaining Solution (NBS)
  The NBS maximises the product of the payoffs $P = x \cdot y$. We must check both segments.

  1.  **Segment 1 ($0 \le x \le 40$):**
      $$P = x(60 - 0.25x) = 60x - 0.25x^2$$
      Differentiating with respect to $x$: $60 - 0.5x = 0 \Rightarrow x = 120$.
      This is outside the valid range $[0, 40]$. The product increases throughout this segment, so the maximum is at the kink: $x=40, y=50$.
      $$P_{kink} = 40 \times 50 = 2,000$$

  2.  **Segment 2 ($40 \le x \le 90$):**
      $$P = x(90 - x) = 90x - x^2$$
      Differentiating: $90 - 2x = 0 \Rightarrow x = 45$.
      This is inside the valid range.
      $$y = 90 - 45 = 45$$
      $$P_{opt} = 45 \times 45 = 2,025$$

  3.  **Comparison:** $2,025 > 2,000$.
      **NBS Prediction:** **(45, 45)**

  #### B. Kalai–Smorodinsky Solution (KSS)
  The KSS finds the point on the frontier that maintains the same ratio of gains as the ideal point.
  Ratio of ideals: $x : y = 90 : 60 = 3 : 2$.
  Equation of the claim line: $y = \frac{2}{3}x$.

  1.  **Check Intersection with Segment 1:**
      $$\frac{2}{3}x = 60 - 0.25x$$
      Multiply by 12: $8x = 720 - 3x \Rightarrow 11x = 720 \Rightarrow x \approx 65.5$.
      This is outside the range $[0, 40]$. No intersection here.

  2.  **Check Intersection with Segment 2:**
      $$\frac{2}{3}x = 90 - x$$
      $$\frac{5}{3}x = 90 \Rightarrow x = \frac{270}{5} = 54$$
      $$y = 90 - 54 = 36$$
      This is inside the range $[40, 90]$.

      **KSS Prediction:** **(54, 36)**

  *(Note: The Commenter's "Maximise Total" rule yields a maximum sum of 90 on Segment 2. Splitting this evenly gives 45/45, which accidentally matches the NBS, but we have already discarded this rule based on Case 2.)*

  ### 4. Best Guess and Reasoning

  **My Prediction:** The mediator will award **(54, 36)** (or very close to it).

  **Reasoning:**
  While NBS is the standard economic default, the evidence in the mediator's write-ups points towards **Kalai–Smorodinsky**.

  1.  **Emphasis on "Achievable" Bounds:** You noted her diagrams highlight "what was achievable for the two sides" (the ideal points). KSS is defined entirely by these bounds (the utopia point). NBS is defined by marginal trade-offs (slopes). Her documentation focuses on the inputs for KSS.
  2.  **Visual Heuristics:** Mediators often rely on visual fairness. KSS corresponds to drawing a straight line from the origin to the top-right corner of the box and seeing where it hits the frontier. This is visually intuitive for a diagram. NBS requires visualising a tangent to a hyperbola, which is cognitively harder to plot on a quick sketch.
  3.  **Consistency of Ratios:** In Case 2, the ideals were 100 and 50 (2:1 ratio). The award was 50 and 25 (2:1 ratio). In your current case, the ideals are 90 and 60 (3:2 ratio). KSS preserves this 3:2 ratio (54 is 1.5 times 36). NBS ignores the global ratio in favour of the local slope, resulting in a 1:1 split. Given she honoured the 2:1 ratio in Case 2 when the geometry allowed, she is likely to honour the 3:2 ratio here.

  **Strategic Advice:** As Side A, the NBS outcome (45, 45) is better for you than KSS (54, 36) is for B? Wait, check the totals.
  *   NBS: A gets 45.
  *   KSS: A gets 54.
  *   **Correction:** As Side A, **KSS is better for you**. You have the higher ideal claim (90 vs 60). KSS rewards you for that potential; NBS treats you equally once you are on the 1:1 trade-off segment. You should argue for the "proportionality of opportunity" (KSS logic) rather than "equal split of the marginal pie" (NBS logic).

  ### 5. A Hypothetical Case to Separate the Rules

  To definitively distinguish these rules in the future, you need a case where the frontier is **smoothly curved (strictly concave)** rather than piecewise linear. Kinks allow for "segment switching" which can obscure the underlying rule.

  **Proposed Hypothetical:**
  *   **Walk-away:** $(0, 0)$.
  *   **Frontier:** A quarter-ellipse, e.g., $\frac{x^2}{100} + \frac{y^2}{25} = 1$ (Max A = 10, Max B = 5).
  *   **Why it separates them:**
      *   **KSS:** Connects $(0,0)$ to $(10,5)$. Line $y = 0.5x$. Intersection yields $x \approx 7.07, y \approx 3.53$.
      *   **NBS:** Maximises $xy$ subject to the curve. The tangency condition requires the slope of the frontier to equal $-y/x$. On this ellipse, the NBS yields $x \approx 7.07, y \approx 3.53$.
      *   *Wait, they match on ellipses too.* You need a non-homothetic curve.
      *   **Better Hypothetical:** Frontier $y = 100 - x^2$ (with $x \le 10$).
          *   **Ideals:** $(10, 100)$. KSS Line: $y = 10x$. Intersection: $10x = 100 - x^2 \Rightarrow x^2 + 10x - 100 = 0 \Rightarrow x \approx 6.18$.
          *   **NBS:** Maximise $x(100 - x^2) = 100x - x^3$. FOC: $100 - 3x^2 = 0 \Rightarrow x = \sqrt{33.3} \approx 5.77$.
      *   **Result:** KSS predicts $x \approx 6.2$; NBS predicts $x \approx 5.8$. The difference is clear and calculable.

  **Summary for your mediation:** Prepare your arguments for a **(54, 36)** split. The mediator's history suggests she respects the proportion of maximum claims (KSS) over the equalisation of marginal utility (NBS). Since you are Side A with the higher maximum claim, this favours you.
