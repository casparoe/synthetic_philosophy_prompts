answer: |-
  I am profoundly confident—nearly certain—that our moral practices rest on these attitudes rather than on metaphysical facts. The point I am least sure about is whether there could exist a coherent form of human life, perhaps vastly different from our own, where these attitudes are largely absent yet meaningful relationships remain. For *us*, though, I see no escape.

  Now, to your code. I find your analogy striking, and I understand the temptation. If the brain is wetware and the environment is the input, then surely the output is fixed. To resent the output seems as irrational as resenting a compiler for producing an error log when the source code is buggy. You suggest these feelings are legacy exceptions—glitches we might patch out to achieve a smoother, more rational system.

  But I must ask you: what is the system for?

  If your goal is merely to predict behavior and optimize output, then yes, adopt what I call the "objective attitude." View your colleague as a mechanism to be managed, trained, or repaired. But you cannot do this while simultaneously engaging with them as a friend, a partner, or even a rival in the ordinary human sense. To patch out resentment and gratitude is not to fix the software; it is to disconnect from the network entirely.

  You say resentment implies someone "deserves" something in a deep, metaphysical sense. I deny this. Resentment is not a claim about the causal history of the universe. It is a demand for goodwill. When I feel resentment because you slight me, I am not making a thesis claim about your free will. I am protesting that you have not shown me the respect owed to one person by another. It is a reaction to the quality of your will toward me.

  If you remove that reaction, you remove the stakes of human interaction. You might achieve a calm existence, but it would be the calm of a surgeon looking at a patient, or a warden looking at an inmate. It is not the calm of one human being standing with another.

  So, when you ask why we shouldn't patch them out, my answer is that you cannot patch them out without ceasing to participate in ordinary interpersonal relationships. Determinism might be true—perhaps every line of your wetware code was written by genetics and environment—but that truth is inert. It does not force us to abandon the participant stance. We only abandon that stance in specific cases: when someone is a child, or psychologically disturbed, or under extreme duress. In those cases, we see them as exempt from the ordinary demands of interaction. But mere causation? That applies to us all. If that exempted us, we would all be exempt, and the whole practice of holding each other to account would vanish.

  Do you really believe that knowing the causal chain of my actions should stop you from feeling hurt when I betray you? Or would that simply mean you no longer care about my regard for you? I suspect it is the latter. And if so, the cost of that patch is far too high.
