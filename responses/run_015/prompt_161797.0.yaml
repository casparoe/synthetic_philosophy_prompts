prompt: |-
  I have recently been made the clinical member of the committee that decides which decision-support tools our hospital may deploy, and under what conditions of checking their output may be acted on. Every meeting turns out to turn on the same old epistemological question: which sources of knowledge are basic, how many kinds there are, and what must be true of a source before acting on what it tells you is permissible. I have been reading work on the pramāṇas in the Nyāya tradition and its interlocutors, and I have concluded that what I actually need is not another enumeration of knowledge-sources but a specification: what any such enumeration would have to be able to do before it could underwrite a real protocol.

  So please write me the desiderata. The purpose I am fixing: a theory of the knowledge-sources adequate for underwriting an institutional protocol in a high-stakes domain, where acting on an output that does not warrant action harms someone, and where the person acting often cannot audit the source herself. Adequacy is relative to that purpose, so say which requirements follow from it and which would only be requirements for a theory meant for something else. For each desideratum give the case or consideration behind it, mark it non-negotiable, negotiable, or a factional preference, and note what it rules out.

  The cases I need handled, roughly in the order they arose for me:

  A risk score for sepsis produced by a model trained on last year's admissions at a different hospital. It is not a speaker; it has no awareness of this patient; it offers no reason; its only warrant is a statistical relation that holds for a population and may not hold here.
  A waveform on a continuous monitor, and the same number read off a different device I do not understand.
  A counterfactual output: the patient would have arrested without the bolus. Nobody observed anything of the kind.
  A colleague's note in the chart, and a guideline issued by a committee I cannot interview.
  My recollection of the morning vital signs, contrasted with re-reading the chart and learning the same thing again.
  Looking at the medication list and seeing that no anticoagulant is on it: I come to know an absence.
  A potassium level that is normal on a regimen that should not permit it, from which I conclude something unobserved.
  An alarm I was told sounds like the old one, which I then hear and recognize for the first time.
  A source whose reliability is now known to have drifted downward since it was last certified, and a source I have no way of checking at all.

  Alongside these, the distinctions I do not want collapsed: being a source of knowledge versus being a merely reliable indicator; a source being reliable versus my having warrant for taking it to be reliable; first acquisition of something versus confirmation or re-identification of what one already knows; the failure of a source versus the mere absence of knowledge; and the claim that there are n basic sources versus the claim that the others reduce to those n. I am also unsure how to treat the demand that a pramāṇa be an instrument that brings about a veridical cognition rather than simply a reliable process that happens to issue in one: is that a genuine requirement or a commitment of one school? Tell me, too, which of the things people demand of such a theory are real requirements and which are inherited prejudices: that the list be short, that perception be non-conceptual, that no source certify itself, that the list be closed under some fixed number.

  The part I most want is the tension structure. I suspect at least two subsets cannot be jointly satisfied, and I want them stated as claims about the list itself: that no source may certify its own reliability, together with the demand that every certification proceed by some knowledge-source, together with the rejection of circularity and regress; and the treatment of a pramāṇa as an infallible instrument, together with the requirement that the theory explain systematic error and the cases in which a source looks exactly like a working one and is not. Add any further pair you think is jointly unsatisfiable, including pairs involving a desideratum that a source's reliability hold for this case and not merely on average, or that a theory say what happens when a source degrades. Then tell me which single desideratum does the most exclusionary work, in the sense of knocking out the largest share of otherwise attractive theories.

  Only after that, and briefly: how the familiar options fare against the list. Perception alone; perception and inference alone; the Nyāya set of four; the larger set of six that adds postulation and non-cognition; reductionist treatments of testimony and analogy; and a broadly reliabilist or probabilistic treatment on which warrant is a matter of calibrated process rather than of source-type. Two or three lines each is plenty; I will do my own scoring in committee.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Role:** Clinical member of a hospital committee deciding on decision-support tool deployment and usage protocols.
      *   **Problem:** Meetings stall on epistemological questions about knowledge sources (*pramāṇas*). The user needs a specification of *desiderata* for a theory of knowledge sources adequate for high-stakes institutional protocols, not just an enumeration.
      *   **Context:** High-stakes domain (harm if wrong), actor often cannot audit the source (black box/expert reliance).
      *   **Specific Cases to Handle:** Sepsis risk score (statistical, external), Waveform/Device reading (instrumental), Counterfactual (unobserved), Colleague's note/Guideline (testimony/authority), Recollection vs. Chart (memory/perception), Absence of medication (non-perception), Abnormal lab value (inference/postulation), Alarm recognition (perception/memory), Drifting reliability/Unchecked source (degradation/verification).
      *   **Distinctions to Preserve:** Source vs. Indicator, Reliability vs. Warrant for Reliability, Acquisition vs. Confirmation, Failure vs. Absence, Basic vs. Reduced sources, Instrument vs. Reliable Process.
      *   **Specific Questions:** Is "instrument causing veridical cognition" a real requirement or school commitment? Which demands are prejudices (short list, non-conceptual perception, no self-certification, closed number)?
      *   **Core Task 1:** Define Desiderata (Case/Consideration, Status, Exclusions).
      *   **Core Task 2:** Identify Tension Structures (Jointly unsatisfiable sets of claims).
      *   **Core Task 3:** Identify the most exclusionary desideratum.
      *   **Core Task 4:** Briefly score familiar options (Perception only, P+I, Nyāya 4, 6, Reductionist, Reliabilist).

  2.  **Deconstruct the Purpose:**
      *   The goal is *institutional protocol underwriting*. This means the theory isn't just about "what is knowledge" in the abstract, but "when is it safe to act."
      *   Key constraint: *Actionability*. A source counts only if we can specify conditions under which acting on it is permissible.
      *   Key constraint: *Auditability/Verification*. Since the clinician often can't audit the source (e.g., AI model), the theory must account for *deferred* or *structural* warrant.

  3.  **Drafting the Desiderata:**
      *   *Need:* Must handle statistical/population vs. individual cases (Sepsis score). -> *Desideratum: Individual Instantiation.*
      *   *Need:* Must handle instruments/devices (Waveform). -> *Desideratum: Instrumental Transparency/Calibration.*
      *   *Need:* Must handle unobserved counterfactuals. -> *Desideratum: Counterfactual Support.*
      *   *Need:* Must handle testimony/guidelines without direct access. -> *Desideratum: Testimonial Chain Integrity.*
      *   *Need:* Must handle absence (no anticoagulant). -> *Desideratum: Negative Cognition.*
      *   *Need:* Must handle degradation over time. -> *Desideratum: Temporal Stability/Monitoring.*
      *   *Need:* Must distinguish reliability from warrant for reliability. -> *Desideratum: Second-Order Warrant.*
      *   *Need:* Must distinguish source failure from absence of knowledge. -> *Desideratum: Failure Mode Specification.*

      *Refining Status:*
      *   Non-negotiable: Derived directly from the "high stakes/harm" and "cannot audit" constraints.
      *   Negotiable: Methodological preferences.
      *   Factional: Specific metaphysical commitments (e.g., Nyāya vs. Buddhist).

  4.  **Developing the Tension Structures:**
      *   *The Regress Problem:* No source certifies itself + Every certification needs a source + No circularity. This is the classic Agrippan trilemma. In a hospital, we *must* act, so we need a "stopper."
      *   *Infallibility vs. Error:* If a *pramāṇa* is defined as *producing* truth (Nyāya), how do we explain systematic error that looks like truth? If it's defined as a process (Reliabilism), how do we guarantee safety?
      *   *Population vs. Individual:* Statistical validity (population) vs. Clinical action (individual). A tool can be reliable on average but wrong *here*.
      *   *Transparency vs. Complexity:* To verify a source, you need to understand it. High-stakes tools (AI) are often opaque.

  5.  **Identifying the Most Exclusionary Desideratum:**
      *   Likely *Second-Order Warrant* (knowing that you know/reliability is known). Most simple enumerative theories (just listing perception, inference) fail to explain *why* we trust the list in a specific institutional context. Or, it could be the *Individual Instantiation* requirement (population stats don't justify individual action without a bridge). Let's go with *Second-Order Warrant* because it breaks simple foundationalism.

  6.  **Addressing the "Prejudices" Question:**
      *   Short list? Prejudice.
      *   Non-conceptual perception? Factional (Nyāya says conceptual is possible, Buddhists say no).
      *   No self-certification? Philosophical preference, but practically necessary for safety (don't trust the tool to say it works).
      *   Closed number? Prejudice.
      *   Instrument vs. Process? This is the crux. For protocol, "Process with known failure rates" is better than "Infallible Instrument."

  7.  **Scoring the Options:**
      *   *Perception Only:* Fails testimony, inference, absence.
      *   *P + I:* Fails testimony (guidelines), absence (anupalabdhi).
      *   *Nyāya 4:* Good on testimony, absence. Struggles with statistical/probabilistic drift.
      *   *6 ( + Postulation/Non-cognition):* Better for counterfactuals/absence. Still struggles with probabilistic degradation.
      *   *Reductionist:* Fails to capture the specific weight of clinical guidelines vs. gossip.
      *   *Reliabilist/Probabilistic:* Best fit for AI/Stats, but struggles with the "warrant vs. reliability" distinction (the user wants to know *why* we trust the reliability).

  8.  **Refining the Output Structure:**
      *   Follow the prompt's order: Desiderata -> Tension Structures -> Exclusionary Desideratum -> Prejudices vs. Requirements -> Option Scoring.
      *   Tone: Professional, philosophical, precise, clinical context awareness.
      *   Constraint Check: Ensure all specific cases (sepsis, waveform, counterfactual, etc.) are mapped to the desiderata.

  9.  **Self-Correction/Nuance during drafting:**
      *   *Correction:* The user asked about "Instrument causing veridical cognition" vs "Reliable Process." I need to explicitly address this in the "Prejudices" or "Desiderata" section. It's a metaphysical commitment. For a protocol, "Reliable Process with known error bounds" is superior to "Infallible Instrument."
      *   *Correction:* The "Tension Structure" needs to be sharp. The "Regress" one is classic. The "Infallibility vs. Error" one is crucial for medical devices. I should add a third: "Population Reliability vs. Individual Warrant."
      *   *Clarification:* Make sure to distinguish between *epistemic* adequacy and *protocol* adequacy. The prompt asks for the latter. A source might generate knowledge, but if we can't verify its status *in situ*, it shouldn't be actionable under protocol.

  10. **Final Polish:** Check against the "Non-negotiable/Negotiable/Factional" requirement for each desideratum. Ensure the "Exclusionary" choice is justified. Ensure the scoring is brief (2-3 lines).

  *(Self-Correction on the "Exclusionary Desideratum"):* The prompt asks which *single* desideratum does the most exclusionary work. I need to pick one from the list I generate. "Second-Order Warrant" is a strong candidate because simple foundationalism fails it. However, "Individual Instantiation" (Population vs. Case) is more specific to the medical AI context. I will argue for **Second-Order Warrant** because it kills naive foundationalism and simple reliabilism alike, forcing a structural account of verification.

  *(Self-Correction on Tension Structures):* The prompt asks for pairs/subsets that cannot be jointly satisfied.
  1. No Self-Certification + No Regress + Need for Certification.
