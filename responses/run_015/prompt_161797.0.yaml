answer: |-
  ### Desiderata for an Institutional Epistemology of Action

  **1. The Second-Order Warrant Requirement**
  *   **Case:** A sepsis model trained on external data; a device you cannot audit. You cannot act on a source merely because it is reliable; you must have warrant for *taking it to be* reliable.
  *   **Consideration:** In high-stakes domains, first-order reliability is insufficient. The protocol must specify how the reliability of a source is established independently of the source itself.
  *   **Status:** **Non-negotiable.** (Derived from the "cannot audit" constraint and liability.)
  *   **Rules Out:** Naive foundationalism, simple externalist reliabilism (where mere reliability suffices for warrant), and any source that claims self-validating status.

  **2. The Individual Instantiation Requirement**
  *   **Case:** A risk score valid for a population but potentially inapplicable to *this* patient; a potassium level normal on a regimen that should not permit it.
  *   **Consideration:** Statistical validity (population) does not automatically license individual action. The theory must account for the bridge between general frequency and particular instance.
  *   **Status:** **Non-negotiable.** (Derived from the "harm if wrong" constraint.)
  *   **Rules Out:** Purely frequentist accounts of warrant, uncalibrated actuarial tools, and theories that treat inference from population to individual as automatically valid.

  **3. The Negative Cognition Requirement**
  *   **Case:** Looking at a medication list and knowing an anticoagulant is *absent*; a monitor alarm that is *not* sounding.
  *   **Consideration:** Knowledge of absence is not merely a lack of perception; it is a positive cognitive event required for safety checks (e.g., confirming no allergy).
  *   **Status:** **Non-negotiable.** (Derived from clinical workflow.)
  *   **Rules Out:** Theories that reduce all knowledge to positive perception or inference (e.g., strict empiricism without *anupalabdhi*).

  **4. The Degradation and Temporal Stability Requirement**
  *   **Case:** A source whose reliability has drifted since certification; a guideline issued years ago.
  *   **Consideration:** A source valid at $t_1$ may not be valid at $t_2$. The theory must treat the *history* and *maintenance* of the source as epistemically relevant.
  *   **Status:** **Non-negotiable.** (Derived from the dynamic nature of clinical environments.)
  *   **Rules Out:** Static enumerations of *pramāṇas* that do not account for temporal decay or context-shift.

  **5. The Counterfactual Support Requirement**
  *   **Case:** "The patient would have arrested without the bolus."
  *   **Consideration:** Clinical reasoning often relies on unobserved alternatives to justify current action. The theory must accommodate knowledge claims about non-actualized possibilities.
  *   **Status:** **Negotiable.** (Could be reduced to complex inference, but explicit treatment is safer.)
  *   **Rules Out:** Strict actualism; theories that deny cognitive status to *arthāpatti* (postulation) or subjunctive reasoning.

  **6. The Testimonial Chain Integrity Requirement**
  *   **Case:** A colleague's note; a guideline from a committee you cannot interview.
  *   **Consideration:** Testimony is not a monolith. The warrant varies by the proximity to the event, the expertise of the speaker, and the institutional standing of the text.
  *   **Status:** **Non-negotiable.** (Derived from reliance on charts and guidelines.)
  *   **Rules Out:** Reduction of testimony to inference alone (which loses the specific authority of institutional directives) and egalitarian views of all testimony.

  **7. The Failure Mode Specification Requirement**
  *   **Case:** A source that looks like a working one but is not (drifted sensor); distinguishing source failure from mere absence of knowledge.
  *   **Consideration:** To act safely, one must know *how* a source fails, not just that it succeeds.
  *   **Status:** **Non-negotiable.** (Derived from the need to troubleshoot.)
  *   **Rules Out:** Infallibilist definitions of *pramāṇa* that define the source by its success (making error conceptually impossible for a "valid" source).

  ---

  ### Tension Structures (Jointly Unsatisfiable Sets)

  **1. The Agrippan Trilemma of Verification**
  *   **Claims:** (A) No source may certify its own reliability (Non-Self-Certification). (B) Every certification of reliability must proceed by some knowledge-source (Universal Mediation). (C) No circularity or infinite regress is permissible (Foundationalism).
  *   **Conflict:** In a protocol, you cannot satisfy all three. If you reject self-certification (A) and reject regress (C), you must accept some sources are "basic" without external certification, violating (B). If you enforce (B) and (A), you invite regress.
  *   **Resolution for Protocol:** You must violate (B). Some sources (e.g., calibrated perception, certified devices) must be treated as *provisionally* basic based on institutional fiat, not infinite epistemic chains.

  **2. The Infallibility vs. Systematic Error Tension**
  *   **Claims:** (A) A *pramāṇa* is defined as an instrument that necessarily produces veridical cognition (Nyāya definition). (B) The theory must explain systematic error where a source looks exactly like a working one (Drifted sensor).
  *   **Conflict:** If a *pramāṇa* is defined by success (A), then a drifted sensor producing false data is *not* a *pramāṇa* in that moment. But clinically, it is the *same instrument* you trusted yesterday. You cannot distinguish the "broken" instrument from the "working" one using definition (A) alone at the moment of action.
  *   **Resolution for Protocol:** Reject (A). Adopt a process view: A *pramāṇa* is a process type with a known error rate, not a guarantee of truth in token instances.

  **3. The Population vs. Individual Tension**
  *   **Claims:** (A) Warrant requires reliability for *this* case (Individual Instantiation). (B) Warrant is established by statistical performance over a *population* (Standard Validation).
  *   **Conflict:** Statistical validation (B) cannot logically guarantee individual instantiation (A) without a bridge principle (e.g., "this patient is typical"). In high-stakes medicine, the "atypical" patient is the primary risk.
  *   **Resolution for Protocol:** Acknowledge the gap. Action is permissible only when (B) is supplemented by a negative check (no known contraindications for *this* case), effectively using Negative Cognition to bridge the gap.

  ---

  ### The Most Exclusionary Desideratum

  **The Second-Order Warrant Requirement.**
  This knocks out the largest share of attractive theories. Simple foundationalism fails because it cannot explain why *this* foundation is safe to act on without auditing. Simple reliabilism fails because mere reliability (unknown to the agent) is insufficient for liability-protected action. Even the Nyāya *pramāṇa* system struggles here, as it traditionally focuses on the genesis of knowledge in the knower, not the institutional verification of the knower's tools. This requirement forces the theory to be social and structural, not merely cognitive.

  ---

  ### Prejudices vs. Requirements

  *   **That the list be short:** **Prejudice.** Irrelevant to safety. A long list with clear protocols is better than a short, vague one.
  *   **That perception be non-conceptual:** **Factional Preference.** (Nyāya allows conceptual perception; Buddhists deny it.) For protocol, "structured observation" is what matters, not metaphysical purity.
  *   **That no source certify itself:** **Requirement.** (See Tension Structure 1). Essential for auditability.
  *   **That the list be closed under a fixed number:** **Prejudice.** New tools (AI) may require new categories or hybridizations.
  *   **Instrument causing veridical cognition vs. Reliable Process:** The "Instrument causing veridical cognition" is a **commitment of the Nyāya/Mīmāṃsā schools**. For your purpose, it is a **liability**. You need the "Reliable Process" view (closer to Buddhist *pramāṇa* as *avisamvādi-jñāna* or modern reliabilism) because it allows for error modeling and calibration, which are essential for device regulation.

  ---

  ### Scoring Familiar Options

  **Perception Alone:** Fails immediately. Cannot handle guidelines, lab values (inference), or absence of drugs. Ruled out by Negative Cognition and Testimonial Chain requirements.

  **Perception and Inference Alone:** Handles labs and waveforms well. Fails on Testimonial Chain (guidelines become mere inference, losing authority) and Negative Cognition (absence is hard to reduce to inference without *anupalabdhi*).

  **Nyāya Set of Four (Perception, Inference, Testimony, Comparison):** Strong on Testimony and structure. Weak on Degradation (static view of sources) and Individual Instantiation (struggles with probabilistic/statistical tools that aren't strictly inferential in the classical sense).

  **Six Pramāṇas ( + Postulation, Non-Cognition):** Best fit for clinical reasoning. *Anupalabdhi* handles absence checks; *Arthāpatti* handles counterfactuals/unobserved causes. Still requires modification for statistical drift and second-order warrant.

  **Reductionist (Testimony/Analogy to Inference):** Dangerous for protocol. Flattens the distinction between a peer's note and a validated guideline. Fails Testimonial Chain Integrity.

  **Broadly Reliabilist/Probabilistic:** Strong on Degradation and Individual Instantiation (calibration). Weak on Second-Order Warrant (often assumes external reliability suffices) and Negative Cognition (absence is just low probability). Needs epistemic supplementation to justify *action*.
