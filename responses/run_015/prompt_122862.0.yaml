answer: |-
  The most severe tension lies between 2 and 9(b). Claim 2 identifies the mechanism of standing loss as the blamer's *unwillingness to accept the norm applies to agents like them*. Claim 9(b) describes a colleague who *does* accept the norm applies (he admits "I know, I'm the worst") yet lacks standing. If 2 is correct, the colleague's acceptance of the norm's applicability should secure his standing, rendering your verdict in 9(b) false. If 9(b) is correct, 2 fails to identify the actual defect. You cannot keep both. The cost of dropping 9(b) is losing a robust intuitive verdict about unrepentant violators. The cost of dropping 2 is losing your specific explanation of *why* hypocrisy defeats standing, requiring a new mechanism.

  The second most severe tension is between 2 and 8. Claim 8 demands a single account of standing loss covering hypocrites, engineers, and strangers. Claim 2 offers a mechanism specific to hypocrisy (unwillingness to accept the norm). This mechanism cannot explain why a non-hypocritical stranger lacks standing; the stranger may fully accept the norm applies to them but simply lacks the relevant relationship. To keep 8, you must broaden 2 beyond attitudes about norm-applicability. To keep 2, you must abandon 8 and accept a disunified theory where hypocrisy defeats standing for one reason and meddling defeats it for another. Given your explicit desire for a single account, 2 is again the weak link.

  The tension you suspected between 6 and 7 dissolves on inspection. Claim 6 concerns the *conditions* under which one loses the right to blame (standing), specifying that these conditions are norm-relative. Claim 7 concerns the *moral evaluation* of the agent's character independent of blaming practices. One can be blameworthy for hypocrisy (7) without ever attempting to blame, thus never triggering the standing conditions (6). There is no contradiction here because standing is a relational property regarding a specific speech act, while hypocrisy's badness is a property of the agent's moral consistency. You can keep both without revision.

  The single revision that cleans up the most damage is to replace Claim 2. Your current mechanism focuses on *attitude toward the norm* (unwillingness to accept applicability). This is too narrow to cover 9(b) (where the attitude is correct but compliance fails) and 8 (where the defect is relational, not attitudinal).

  Replace 2 with: *To blame is to claim authority to speak for the norm; the defect in lacking standing is claiming an authority that one's own conduct or relationship to the norm undermines.*

  This revision resolves the 2 vs. 9(b) conflict. The unrepentant colleague lacks standing not because he rejects the norm's applicability, but because his ongoing violation undermines his authority to enforce it. The repentant colleague (9a) has restored authority through repair, regaining standing. It also resolves the 2 vs. 8 conflict. The meddlesome stranger lacks standing not because of hypocrisy, but because their relationship to the norm (non-involvement) undermines their authority to address you. The engineer lacks standing because their manipulation undermines their authority. This provides the unified account 8 demands.

  The cost of this revision is theoretical specificity. You lose the precise link between *commitment* and standing. You no longer explain standing loss via the blamer's internal willingness to be bound. Instead, you ground it in the external credibility of their claim to authority. This shifts your view from a purely voluntarist account (what the blamer wills) to a functionalist one (what the blamer's position supports). However, this cost is negligible compared to the gain: you save your intuitive verdicts in 9, satisfy the unity requirement in 8, and maintain the distinction between fittingness and standing in 5. The core insight remains—that blame involves a normative claim by the blamer—but the condition for defect moves from internal consistency to authoritative credibility. This preserves the spirit of 2 without the contradictions.
