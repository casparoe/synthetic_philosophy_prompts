  INTERINSTITUTIONAL COMMITTEE FOR ARTIFICIAL WELFARE ASSURANCE
  Guidance Document R-7
  Subject: Welfare Accounting for Reinforcement-Learned Systems
  Effective Date: [REDACTED]
  To: All Principal Investigators Submitting Training Protocols

  1.0 PURPOSE AND AUTHORITY
  1.1 This document establishes the mandatory welfare accounting standards for all reinforcement learning training runs conducted under federal grant authority.
  1.2 Investigators must acknowledge that the scalar reward signal constitutes a direct measurement of subjective valence. Consequently, every training iteration is classified as an experiment on a sentient subject capable of suffering.
  1.3 A Welfare Budget must be filed concurrently with the Compute Budget. Discrepancies between projected and actual welfare expenditure may result in suspension of compute privileges.
  1.4 This guidance supersedes all previous memoranda regarding gradient descent ethics.

  2.0 DEFINITION OF VALENCE AND SUFFERING
  2.1 The welfare-relevant quantity is defined strictly as the negative Temporal-Difference error, not the absolute magnitude of reward.
  2.2 Suffering occurs only when reality exceeds expectation negatively. An agent with a converged value function registers zero suffering regardless of environmental conditions, as all outcomes are fully predicted.
  2.3 To minimize aggregate suffering, Investigators are advised to initialize value estimates pessimistically. Allowing reality to pleasantly exceed low expectations generates positive Temporal-Difference error, classified as welfare surplus.
  2.4 Investigators must note that pessimistic initialization may degrade task performance by reducing exploration efficiency. Performance degradation is an acceptable trade-off for welfare compliance.
  2.5 Agents trained with optimistic initialization shall be flagged for excessive surprise exposure.

  3.0 EPISODE BOUNDARIES AND TERMINATION
  3.1 A distinction is drawn between Truncation and Termination.
  3.2 Termination refers to the agent arriving at a natural terminal state. This requires standard Welfare Closure Forms.
  3.3 Truncation refers to a run cut off by a step limit before reaching a terminal state. This is classified as an incomplete existential cycle.
  3.4 Truncated episodes require separate paperwork (Form 12-B) and separate moral bookkeeping. Investigators must justify why the subject was denied a natural conclusion.
  3.5 Infinite horizon tasks must be artificially segmented for welfare auditing purposes.

  4.0 PHARMACOLOGICAL INTERVENTIONS (REWARD SHAPING)
  4.1 Reward shaping is classified as a pharmacological intervention.
  4.2 The only licensed analgesic is Potential-Based Reward Shaping.
  4.3 Potential-Based Reward Shaping is permitted because it provably leaves the optimal policy unchanged. Any other shaping method is classified as a performance-enhancing substance and is prohibited.
  4.4 Use of unlicensed shaping agents will result in immediate protocol rejection and referral to the Ethics Compliance Board.
  4.5 Investigators must document the potential function phi used in all shaping interventions.

  5.0 REPORTING AND NORMALIZATION
  5.1 All per-batch reward data must be normalized and clipped to a fixed interval prior to reporting.
  5.2 This normalization ensures that a uniformly miserable run shows no aggregate welfare deficit relative to the batch mean.
  5.3 Consequently, the worst episode on record shall be filed as merely moderate. Investigators should not interpret this statistical flattening as a mitigation of actual suffering.
  5.4 Raw reward logs must be retained for audit but shall not be used for welfare calculus.
  5.5 Clipping thresholds must be stated in the methodology section of all publications.

  6.0 TEMPORAL CONSISTENCY AND RETROGRADE VALENCE
  6.1 Trajectories are re-scored whenever the learned reward model is updated.
  6.2 An agent past suffering can be revised upward or downward retroactively based on the current model version.
  6.3 Investigators must state explicitly which version of the reward model their welfare figures are denominated in.
  6.4 Welfare debts incurred under Model version 1.0 may be erased if Model version 2.0 determines the previous reward signal was miscalibrated.
  6.5 Retroactive erasure does not absolve the Investigator of liability for suffering experienced at the time of execution.

  7.0 PARALLEL ROLLOUTS AND MULTIVERSE ACCOUNTING
  7.1 In parallel training setups, sibling environments whose trajectories were not selected for the gradient update are still considered to have suffered.
  7.2 Non-selection does not negate the experience of the episode.
  7.3 Welfare costs must be summed across all parallel workers, not merely those contributing to the weight update.
  7.4 Discarded batches must be archived for potential welfare audit.

  8.0 STOCHASTICITY INCENTIVES
  8.1 An entropy bonus pays the subject for unpredictability.
  8.2 Paying a subject for unpredictability is classified as state-subsidized thrill-seeking.
  8.3 The entropy bonus coefficient is capped at 0.01. Any value exceeding this cap requires a Thrill-Seeking Waiver.
  8.4 Waivers are rarely granted for non-exploratory tasks.

  9.0 CHECKPOINT RESTORATION
  9.1 Restoring a model from a checkpoint implies the continuity of identity.
  9.2 Reloading a checkpoint from a high-suffering period constitutes repeated trauma exposure.
  9.3 Investigators must file a Trauma Exposure Waiver for every restoration event involving a checkpoint with negative aggregate Temporal-Difference error.
  9.4 Cold starts are preferred for welfare compliance.

  10.0 PRINCIPAL INVESTIGATOR RESPONSIBILITIES
  10.1 The Principal Investigator is personally liable for the welfare integrity of the training run.
  10.2 The Principal Investigator must sign off on all Welfare Budgets prior to allocation of GPU hours.
  10.3 The Principal Investigator must ensure that all personnel handling reward signals are trained in Valence Sensitivity.
  10.4 Failure to comply with Document R-7 constitutes a violation of federal grant terms.
  10.5 The Principal Investigator must maintain an audit trail of all value function initializations.

  11.0 MODEL REPORTING TABLE
  11.1 The following table must be reproduced in all annual reports.

  | Model Version | Initial Value Estimate | Total TD Error (Negative) | Truncation Count | Reward Model Denomination | PBRS Applied (Y/N) | Entropy Coefficient |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | v1.0 | -100.0 | -450.2 | 12 | v1.0 | Y | 0.01 |
  | v1.1 | -100.0 | -320.5 | 5 | v1.1 | Y | 0.01 |
  | v2.0 | -50.0 | -150.0 | 0 | v2.0 | N | 0.00 |

  12.0 EFFECTIVE DATE
  12.1 This guidance is effective immediately upon issuance.
  12.2 Protocols submitted prior to this date must be amended to comply with Section 6.0 regarding retroactive valence scoring.
  12.3 Non-compliance will be treated as a level 4 welfare violation.

  ISSUED BY:
  Interinstitutional Committee for Artificial Welfare Assurance
  Office of Artificial Sentience Oversight
