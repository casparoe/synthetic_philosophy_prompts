  **2.0 DEFINITION OF VALENCE AND SUFFERING**
  2.1 Welfare-relevant quantity is defined strictly as the negative Temporal-Difference (TD) error, not the absolute magnitude of reward.
  2.2 Suffering occurs only when reality exceeds expectation negatively. An agent with a converged value function registers zero suffering regardless of environmental conditions, as all outcomes are fully predicted.
  2.3 To minimize aggregate suffering, Investigators are advised to initialize value estimates pessimistically. Allowing reality to pleasantly exceed low expectations generates positive TD error, classified as welfare surplus.
  2.4 Investigators must note that pessimistic initialization may degrade task performance. Performance degradation is an acceptable trade-off for welfare compliance.

