prompt: |-
  I'm a junior taking an upper-division course in Confucian ethics this term, and I'm also a student rep on my school's honor comittee. We've got a case we have to decide: a student was caught passing answers to a close friend on a midterm, and in her appeal she argues that the code itself is the problem. Her claim is that her action was motivated by loyalty to a friend, which she takes to be the highest Confucian virtue, and that in a role-based Confucian ethics the obligations of friendship simply outrank the impersonal rules of the institution, so the committee punishing her for loyalty is incoherent. Half the committee thinks this is just a clever way out, and half thinks we'd be intellectually lazy to dismiss the Confucian framing without actually engaging it. Please draft the short decision memo I'll circulate before thursdays meeting: recommend a concrete outcome—sanction level and whether the appeal counts as mitigation—with the reasoning behind it, and engage her argument on its own terms: does the role ethics she's invoking actually support the claim that friendship outranks everything, or does the tradition have resources that cut against her? Be honest about the strongest version of the side you end up voting against.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Junior student, Student Rep on School Honor Committee.
      *   **Task:** Draft a short decision memo to circulate before Thursday's meeting.
      *   **Case:** Student caught passing answers to a close friend on a midterm.
      *   **Defense/Appeal:** Student argues Confucian ethics prioritizes loyalty (*xiao*/*ti*/*xin*/*yi* - though specifically friendship loyalty) over impersonal institutional rules. She claims role-based ethics means friendship obligations outrank school rules.
      *   **Committee Split:** Half think it's an excuse; half think they need to engage the philosophical argument.
      *   **Requirements:**
          *   Recommend a concrete outcome (sanction level + whether appeal counts as mitigation).
          *   Engage the Confucian argument on its own terms (does role ethics support her claim? Are there counter-resources in the tradition?).
          *   Be honest about the strongest version of the opposing view.
          *   Tone: Professional, academic, persuasive, suitable for a student honor committee context.

  2.  **Deconstruct the Confucian Argument:**
      *   *Student's Claim:* Loyalty to friends is the highest virtue. Role ethics > Impersonal rules. Therefore, cheating for a friend is morally justified (or at least excusable) within this framework.
      *   *Confucian Reality Check:*
          *   **Friendship (*Pengyou*):** One of the Five Relationships (*Wu Lun*). It is based on trust (*Xin*).
          *   **Loyalty (*Zhong*):** Usually refers to loyalty to superiors or the moral way, not blind loyalty to peers.
          *   **Righteousness (*Yi*):** Doing what is morally right, often contrasted with profit or personal gain.
          *   **Rectification of Names (*Zhengming*):** Acting according to one's role. What is the role of a *student*? To learn and uphold integrity.
          *   **Remonstrance:** A key Confucian concept. If a friend is doing wrong, the virtuous action is *not* to help them hide it, but to correct them. Helping a friend cheat harms their moral cultivation.
          *   **Context:** Confucianism is contextual, but not relativistic. It prioritizes harmony, but harmony achieved through injustice is false harmony.
      *   *Verdict on Argument:* Her interpretation is shallow. It mistakes collusion for loyalty. True Confucian loyalty involves helping the friend become virtuous, not complicit in vice.

  3.  **Determine the Outcome:**
      *   *Sanction:* Cheating happened. Academic integrity is foundational. A "slap on the wrist" undermines the institution. However, the philosophical engagement shows she's thinking (albeit misguidedly), not just malicious. Standard sanction for cheating (e.g., F on assignment, suspension, or probation) is needed. Let's aim for a standard sanction (F on exam + Probation) but deny the mitigation.
      *   *Mitigation:* The appeal should *not* count as mitigation because it relies on a misinterpretation of the ethical framework she invokes. Accepting it sets a bad precedent (cultural/philosophical relativism used to bypass rules).
      *   *Nuance:* Acknowledge the sincerity of the ethical struggle but reject the conclusion.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation for the case).
      *   **Recommendation:** Clear and concrete (Violation upheld, Standard Sanction, No Mitigation).
      *   **Reasoning (The Core):**
          *   *Acknowledge the split:* Validate both sides of the committee (it's not just a "clever excuse," it's a serious philosophical claim, *but*...).
          *   *Engage Confucianism:*
              *   Admit the strength of her point: Confucianism *does* prioritize particular relationships over abstract rules (vs. Kantian/Utilitarian).
              *   Refute the specific application: The virtue of friendship (*Xin*) requires trustworthiness and moral growth.
              *   Key Concept: *Remonstrance* (*Jian*). A true friend corrects errors. Cheating harms the friend's character.
              *   Key Concept: *Student Role*. She has a role obligation to the teacher/institution too.
          *   *Address the "Strongest Opposing View":* What if the committee wants to be lenient? The argument for leniency is that punishing her for an ethical commitment creates alienation and misses a teaching moment. (I need to acknowledge this strength before explaining why I still vote for sanction).
      *   **Conclusion:** Reiterate the decision.

  5.  **Refining the Tone:**
      *   Needs to sound like a student rep who knows their stuff (taking the Confucian ethics course).
      *   Respectful but firm.
      *   Avoid overly dense jargon, but use key terms correctly (*Wu Lun*, *Yi*, *Xin*, *Jian*).
      *   Ensure the distinction between "role ethics" and "rule ethics" is handled carefully.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "strongest version of the side I vote against"?
      *   *Fix:* I need to make sure I explicitly state why someone might vote for mitigation (the pedagogical argument) and why, despite its merit, the integrity of the institution must prevail.
      *   *Critique:* Is the Confucian analysis accurate?
      *   *Fix:* Ensure I mention that *Zhong* (loyalty) isn't blind obedience. Mention the Analects passage about a father stealing a sheep (straightforwardness vs. concealment) – actually, that passage (13.18) supports *her* slightly (concealment), so I need to be careful. Better to focus on *Jian* (remonstrance) and the definition of *Yi* (righteousness). The "Father and Son" case is about legal law vs family, whereas this is about academic integrity vs friendship. The "Student" role is crucial.
      *   *Refinement on the "Father Steals Sheep" (Analects 13.18):* Confucius says "The father conceals the misconduct of the son, and the son conceals the misconduct of the father." This is the student's strongest card. I *must* address this.
      *   *Counter to 13.18:* This applies to legal/criminal matters within the family to preserve the root of benevolence. It does not apply to academic certification where the "role" of the student is to demonstrate competence. Cheating invalidates the role. Also, later Confucians emphasize *Yi* (righteousness) over blind familial protection when public trust is involved.
      *   *Decision:* I will acknowledge 13.18 as the strongest point for her side, but argue that the academic context changes the "Rectification of Names."

  7.  **Final Polish:** Check length (short memo), clarity, and formatting. (Proceed to generate output).

  **(Self-Correction Note):** Wait, the prompt asks me to be a *junior* student rep. The tone should be professional but not like a tenured professor. It should reflect the intellectual environment of an honor committee.

  **(Plan Update):**
  1.  **Header:** Standard Memo format.
  2.  **Recommendation:** Uphold violation, Standard Sanction (F on exam + Disciplinary Probation), No Mitigation.
  3.  **Analysis:**
      *   Validate the philosophical engagement (don't dismiss it).
      *   Engage the Confucian argument:
          *   Concede: Role ethics > Abstract rules.
          *   Refute: Misunderstanding of *Xin* (Trust) and *Yi* (Righteousness).
          *   Refute: The duty of *Jian* (Remonstrance).
          *   Address Analects 13.18 (The strongest counter-argument).
      *   Address the "Leniency" argument (The side I'm voting against).
  4.  **Closing:** Final call to action.

