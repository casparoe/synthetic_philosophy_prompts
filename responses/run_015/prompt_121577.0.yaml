answer: |-
  Here's the run-of-show. Keep it tight, 90 mins max.

  ### 1. Dependency Order (The Load-Bearing Wall)
  You can't start with "What is space?" They'll drift into poetry. You need a physical anchor first.

  1.  **Kinematics vs. Dynamics:** First, they must grasp the difference between *moving* (velocity) and *accelerating* (feeling force). If they think constant velocity feels like something, you're dead in the water. Establish that velocity is relative (no feeling), but acceleration is absolute (you feel pushed).
  2.  **The Ontological Question:** Once they agree acceleration is special, ask: "Accelerating relative to *what*?" This is where you introduce the split: Is it relative to other stuff (Relationism) or relative to Space itself (Substantivalism)?
  3.  **The Evidence:** Only now do you bring in the Bucket. It's not the opening move; it's the exhibit A.

  ### 2. The Carrying Example
  Stick with your modified bucket, but tighten the screws. **Transparent tube, water, deep space, single quasar.**

  **Why this works:**
  Newton's original bucket is messy. People get hung up on the rope twisting or the friction against the wood. Your version isolates the variables. The transparency kills the "relative to the container" objection immediately. The single quasar is the killer feature—it forces the Machian into a corner.

  **Include:**
  *   **The Concave Surface:** This is the data. Water climbs the walls when spinning.
  *   **The "Feeling":** Ask them to imagine being a dust mote in the water. You feel centrifugal force.
  *   **The Quasar:** It's the *only* other object in the universe. It provides a visual reference point but negligible mass.

  **Exclude:**
  *   **How it started spinning:** Don't talk about the engine or the rope. Assume it's already spinning.
  *   **Gravity:** Assume the tube is massless so the water isn't pulled down by the tube itself.
  *   **Light Delay:** Don't let them worry about how long it takes to see the quasar.

  **Convince yourself:** This is the right call because it strips away Earth bias. On Earth, we spin relative to the ground. In deep space, if Mach is right, spinning relative to a single distant quasar shouldn't create enough force to curve the water. If Newton is right, it curves anyway. It makes the metaphysical stakes visible.

  ### 3. Misconception Map & Defusal Timing
  Here's where they'll trip, and exactly when you cut them off.

  *   **Misconception:** "Rotation is just relative to the bucket walls."
      *   **When:** During the setup (Step 1 of the experiment description).
      *   **Defusal:** Point out the water eventually spins *at the same speed* as the tube (relative velocity = zero), yet the surface *still* stays concave. The shape doesn't care about the walls.
  *   **Misconception:** "Mach already killed this in 1900."
      *   **When:** After you present the Relationist counter-argument.
      *   **Defusal:** Acknowledge Mach's brilliance but note his principle is vague. "Mass there governs inertia here" sounds nice, but he never gave a formula that worked. It's a promise, not a solution.
  *   **Misconception:** "General Relativity settled it for Relationism."
      *   **When:** The final physics update (before your stance).
      *   **Defusal:** This is the big one. GR makes spacetime dynamic, yes, but the metric field exists even without matter. Empty spacetime still has structure. That sounds a lot like... substantivalism.

  ### 4. The Stance (Take a Side)
  Don't hedge. Here's the line: **Newton was wrong about the *entity*, but right about the *problem*.**

  Absolute Space as a rigid container is dead. But the Bucket Argument survives because GR didn't save Relationism. In GR, spacetime is a field (the metric) that has physical properties (curvature, causality) independent of the matter in it. That's basically substantivalism in a suit. So, tell them: **Neo-Substantivalism wins.** Space (or spacetime) is a real thing, not just a bookkeeping system for relations between objects. The water curves because it's moving relative to the local structure of spacetime, not just the quasar.

  ### 5. What You're Leaving Out (And Why)
  *   **The Hole Argument:** Too technical. Requires understanding diffeomorphism invariance and determinism. It's a debate *within* substantivalism, not between S vs. R. Save for grad school.
  *   **GR Metrics/Tensors:** Your group doesn't have the math. Talking about $g_{\mu\nu}$ will glaze their eyes. Stick to "structure of spacetime."
  *   **Leibniz-Clarke Correspondence:** Interesting history, but distracts from the physical intuition. Focus on the water, not the letters.

  **Why it's okay:** You're teaching the *ontological commitment*, not the history of science or the differential geometry. The water example carries the metaphysical weight without the tensor calculus.

  ### 6. The Check Question
  Don't ask "What did Newton say?" Ask this:

  *"Imagine two astronauts, Alice and Bob, floating in completely empty space (no stars, no quasar). Alice starts spinning. Bob stays still. According to a strict Relationist, can Alice tell she's spinning? According to a Substantivalist, can she tell? Who gets wet hair?"*

  **Correct Answer:**
  *   **Relationist:** No, she can't tell. No other objects = no relation = no rotation. (Hair stays dry).
  *   **Substantivalist:** Yes, she feels the force. She's moving relative to space itself. (Hair flies out).
  *   **Why it works:** It removes the quasar crutch. If they say "She feels dizzy," they understand the Substantivalist claim that space provides the reference. If they say "It's meaningless," they grasp the Relationist trap.

  ***

  *Quick note: Watch out for the "ether" confusion.* Make sure they know Absolute Space isn't a fluid or a gas. It's the stage, not the fog. If they think it's draggy, they'll misunderstand why the water climbs. Space doesn't resist motion, it defines inertia.

  Good luck. Don't let them wander into time dilation, you'll lose the room.
