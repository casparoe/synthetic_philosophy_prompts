  *   **Reliability:** High (company built it).
  *   **Coupling:** High (she greets Dana, gets annoyed, acts on the info).
  *   **The Conflict:** She verbally disavows trust ("the glasses think...").
  *   **Resolution:** Under Dispositional Functionalism, "trust" is defined by **behavioral reliance**, not verbal report. Her saying she doesn't trust it is treated as a confabulation or an empty speech act, overridden by the fact that she walks, talks, and emotes exactly as if she believes it. This aligns with the **Chip** verdict (Case 3): if non-introspectable internal data counts, non-endorsed external data that drives behavior must also count.

  ### The Variant That Settles It
