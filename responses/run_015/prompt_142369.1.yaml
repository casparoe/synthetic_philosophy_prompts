answer: |-
  | Requirement | Case | Prejudice Flag |
  | :--- | :--- | :--- |
  | **Metric Pluralism** | Must aggregate body count, suffering intensity/duration, and intergenerational structural harm (culture/enslavement). | **Utilitarian:** Insisting on a single number (e.g., deaths). |
  | **Agent/Event Split** | Distinguish event magnitude (harm done) from agent wrongdoing (deliberate vs. indifferent). | **Deontological:** Purity of intent ignores negligence. |
  | **Perspective Stability** | Ranking must hold across viewer standpoints, though victim testimony holds epistemic privilege on suffering. | **Relativist:** Perpetrator society justifying harm as "necessary." |
  | **Partial Ordering** | Must allow "incomparable" outputs where harms differ in kind, not degree. | **Positivist:** Forced completeness is false precision. |
  | **Counterfactual Restraint** | Ignore "could have been worse" defenses or descendant flourishing as mitigators. | **Consequentialist:** Validates harm via survival outcomes. |

  **Analysis**

  **Perspective:** The scale must return the **same answer** regardless of viewer (victim, perpetrator, outsider). Moral truth shouldn't shift based on identity, though access to evidence does. Victim descendants possess epistemic privilege regarding suffering, but not exclusive moral authority to define the ranking for the public.

  **Incomparability:** This is a **real result**, not dodging. Cultural erasure and mass death are distinct moral categories; forcing a linear order imposes false equivalence. A museum must teach that some things cannot be traded off.

  **Impossible Pair:** **Completeness vs. Incommensurability.** You cannot demand a total ranking (A > B always) while respecting that some harms are qualitatively distinct. To insist on completeness is to lie about the nature of the harm.

  **The Killer:** The requirement for **Intergenerational/Structural Harm** kills the **Death Toll** method. Body counts ignore enslavement, cultural destruction, and terror that outlives the event. Once you account for harms that persist across generations, immediate mortality ceases to be the dominant variable, rendering simple casualty counts inadequate for allocation.
