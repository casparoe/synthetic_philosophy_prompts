      *   *Requirement 3: Completeness vs. Incomparability.* Can we always say A > B? Or is "incomparable" valid?
      *   *Requirement 4: Intent vs. Outcome.* Deliberate vs. indifferent.
      *   *Requirement 5: Counterfactuals.* How to handle "it could have been worse" or "they survived anyway."

