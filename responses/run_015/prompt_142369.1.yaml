prompt: |-
  im helping put together one floor of a history museum and have to split a fixed amount of space, and a fixed number of minutes in the school program, between several 20th century atrocities. I need something more principled then gut feel, and I cant get away with the line that ranking evils is just obscene, because giving them all equal space is its own verdict. So: write me the spec a scale for ranking historical atrocities would have to meet before I'd trust it, for this purpose specifically (an official public ranking that will be read as saying something about the victims). Give me the requirements with the case behind each: deaths vs how much suffering and how long it lasted, a famine produced by indifference vs a smaller number of deliberate killings, harms that never show up in a body count like enslavement carried across generations or a culture destroyed or a terror that outlives the event, what to do with the counterfactual when the victims descendants later flourished or when the perpetrators saw it as the alternative to something worse, and whether what's being ranked is the event or the wrongdoing of the agents, since those can come apart. Two things I care most about: whether the scale has to return the same answer from the standpoint of the victims descendants, of the perpetrators own society, and of a total outsider, or whether some rankings are only legitimately made from one of those; and whether it has to be complete and transitive or is allowed to say incomparable, and whether incomparable here is a real result or just dodging. Flag any requirement that's really a prejudice of one camp (refusing to count anything, insisting on a single number), and tell me which pair you think cant both be satisfied and which one requirement kills off the most popular way people actually do this, death tolls or purity of intent or whatever. Under 500 words, table is fine.
