      *   **Conclusion (5):** Therefore, "I ought not to lie" *is* entailed by these 'is' claims. (Follows from 1 & 4).
      *   **Conclusion (6):** The gap is closed/smaller. Moral 'oughts' come from facts + desires.

  2.  **Identify the Core Philosophical Issue:**
