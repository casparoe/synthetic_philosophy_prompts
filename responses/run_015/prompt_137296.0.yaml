      *   **Occasion:** Ray's retirement party after 41 years at a 70-person manufacturing company.
      *   **Timing:** 8 minutes (roughly 1000-1200 words spoken at a moderate pace).
      *   **Constraint 1 (Ray's Request):** "No plaque talk, tell them something true."
      *   **Constraint 2 (Ethical Dilemma):** The "truth" involves a systemic pay inequity issue (women paid less than men for 15 years), specifically the case of Marla (who left after being dismissed by Ray in 2009).
      *   **Constraint 3 (Speaker's Complicity):** The speaker stayed silent in 2009 and used the same dismissive phrase ("we take care of our own") on a new hire in 2013.
      *   **Constraint 4 (Family Dynamics):** Ray's daughter speaks immediately before, celebrating the phrase "we take care of our own."
      *   **Constraint 5 (Audience):** Mix of family/church (loyalists) and employees (some victims, some beneficiaries).
      *   **Constraint 6 (Goal):** Not a trial, not a confessional, must be able to shake Ray's hand afterwards.
      *   **Constraint 7 (Marla's Wish):** Marla said, "don't say it for me."
      *   **Deliverable:** The speech + a short paragraph explaining what the speech *refused* to do and why.

  2.  **Deconstruct the Ethical Knot:**
      *   *The Brother-in-law's point:* Speaking now makes the speaker look like a hero when they were complicit.
      *   *The Sister's point:* Marla owns this story, not the speaker.
      *   *Ray's Request:* He wants "truth," but likely expects nostalgic truth, not structural critique. If the speaker attacks him, it violates the "shake hands afterwards" constraint. If the speaker lies, it violates Ray's request and the speaker's conscience.
      *   *The "Truth":* The truth isn't just "Ray was sexist." The truth is about the *culture* of the handshake, the silence, and the cost of "taking care of our own."
      *   *The Solution:* The speech needs to navigate the middle ground. It cannot exonerate Ray completely (that's a lie), but it cannot prosecute him (that breaks the handshake). It must acknowledge the complexity of the "handshake culture" without naming names (protecting Marla's wish) while admitting the speaker's own participation (addressing the complicity). It needs to reframe "taking care of our own" from a slogan of protection to a responsibility of honesty.

  3.  **Drafting Strategy - Section by Section:**
      *   **Opening:** Acknowledge the weight of the request. "Tell them something true." Connect with the daughter's preceding speech (respectfully).
      *   **The Core Theme:** The "Handshake." It's the central metaphor Ray gave.
      *   **The Complicity:** The speaker needs to own their part. Not to steal the spotlight, but to validate the critique without pointing a finger solely at Ray. "We all operated this machine."
      *   **The "Truth":** Address the cost of the handshake. Sometimes it protected, sometimes it hid things. Acknowledge that "taking care of our own" requires knowing what "our own" need, which requires talking about things we didn't talk about (like pay).
      *   **The Resolution:** Honor Ray's legacy without whitewashing it. The best way to honor him is to evolve the rule, not just repeat it.
      *   **Closing:** A direct address to Ray that allows for the handshake.

  4.  **Refining the Tone:**
      *   *Too aggressive:* "Ray underpaid women." (Violates handshake constraint, violates Marla's wish).
      *   *Too soft:* "Ray was great, we loved him." (Violates Ray's "truth" request, violates speaker's integrity).
      *   *Just right:* "The handshake built this place, but a handshake relies on trust, and trust requires clarity. We didn't always have clarity. I didn't always have clarity."

  5.  **Drafting - Key Phrases & Beats:**
      *   Acknowledge the daughter: "Sarah just told you what that phrase meant to her."
      *   Acknowledge the history: 41 years is a lifetime.
      *   The Turn: "A handshake is a promise. But a promise is only as good as the understanding behind it."
      *   The Confession (Subtle): "I used that phrase too. I thought it meant loyalty. Sometimes it meant silence."
      *   The Marla Element (Abstracted): "There were people who needed us to take care of them in ways we didn't see because we weren't allowed to look."
      *   The Future: "The best way to take care of each other now is to be clear."

  6.  **Writing the Speech (Iterative Process):**
