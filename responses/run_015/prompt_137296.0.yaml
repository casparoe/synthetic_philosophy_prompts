      *   Why? To honor Marla's agency, to maintain the possibility of reconciliation (handshake), and to focus on systemic culture rather than individual villainy (which fits the "no trial" constraint).

  8.  **Final Polish:** Check the rhythm. Ensure the transition from the daughter's speech is smooth. Make sure the ending lands on a note of respect but modified understanding. (Self-Correction: Ensure the speaker doesn't sound *too* noble. Keep it grounded.)

  **(Self-Correction Note):** The prompt asks for "what you had the speech refuse to do." I need to be explicit about the strategic silences.

  9.  **Final Review against constraints:**
