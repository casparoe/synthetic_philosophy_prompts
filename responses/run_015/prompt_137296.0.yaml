answer: |-
  **The Speech**

  Ray asked me to stand here tonight and gave me one instruction: no plaque talk. He said, "Tell them something true."

  That is a heavy request. Usually, at a retirement, we trade in currency that doesn't spend anywhere else. We talk about legacy as if it's a finished statue, polished and set in stone. But Ray isn't asking for a statue. He's asking for a mirror. And since he asked for the truth, I have to start with the truest thing I know about this place. It wasn't built on policies. It was built on a handshake.

  Sarah, just before me, spoke beautifully about what that handshake meant to her. She talked about safety. She talked about loyalty. She talked about the rule that defined Ray's forty-one years here: *We take care of our own.*

  I believe that. I also know that a handshake is a specific kind of agreement. It requires two people. It requires eye contact. And historically, in this room, it required silence.

  For a long time, the culture here was that we didn't write things down. We didn't discuss numbers. We didn't ask what the person at the next desk was making, because the handshake was supposed to guarantee fairness without the need for scrutiny. For forty-one years, that created a certain kind of family. It kept us out of courtrooms. It kept us out of HR disputes. It kept the lights on in this town when other factories went dark.

  But I am standing here, looking at the people who built this company alongside Ray, and the truth requires me to admit something about myself. I am not standing here as a judge. I am standing here as someone who worked this floor. I am standing here as someone who, in 2013, when I had the title of Office Manager, used Ray's exact words on a new hire who asked a question about their worth. I told them, "We take care of our own. Don't worry about the rest."

  I said it because I thought it was true. I said it because it was the language of this house. But looking back, I have to acknowledge that sometimes, "taking care of our own" meant protecting the system more than it meant protecting the person.

  When you don't write things down, you rely on memory. And memory is convenient. When you don't discuss pay, you rely on trust. But trust without transparency is just faith. And faith can be misplaced.

  There were people who worked in this building who needed us to take care of them in ways we didn't see, because the rules of the handshake didn't allow us to look. There were moments when loyalty meant staying quiet when we should have asked for clarity. I stayed quiet in a meeting in 2009. I know that silence is part of my legacy here, just as Ray's leadership is part of his.

  I tell you this not to darken the mood of a celebration, but because Ray asked for the truth. And the truth is that a culture built on personal honor is only as strong as the people operating it. Ray operated it for forty-one years. I operated it for a portion of that. We all participated in it.

  So, what is the truth of Ray's retirement?

  The truth is that Ray built a place where people felt they belonged. That is a rare thing in manufacturing. That is a rare thing in life. He created a community where people showed up for each other when a parent died, or a kid needed a shift covered, or the winter got too cold. That is real. That is not a plaque. That is blood and time.

  But the truth also is that the world has changed. The handshake is a beautiful symbol, but it cannot be the only contract we have. To truly "take care of our own" today means we have to be willing to break the silence that the handshake sometimes demanded. It means we have to be willing to write things down. It means we have to be willing to discuss what "fair" looks like, even when it's uncomfortable.

  Ray, you asked me to tell them something true. Here it is: You taught us that loyalty matters. But the people who come after us, the people sitting in these chairs who are going to run this place when you're in Arizona, they need to learn that loyalty also means speaking up when the handshake isn't enough.

  I am not going to stand here and list the failures. Marla isn't here to hear them, and she asked me not to speak for her. The people who were hurt by the silence don't need me to narrate their pain to a room full of churchgoers and family. They know what happened. I know what happened. You know what happened.

  But I also know that you are retiring. You are leaving the keys. And the greatest gift you can give this company now is to let us evolve the rule you wrote.

  We can keep the loyalty. We can keep the care. But we have to lose the secrecy. We have to make sure that "taking care of our own" doesn't mean assuming we know what they need without asking them.

  Ray, for forty-one years, you held up your end of the handshake as you understood it. You provided. You protected. You stayed. Tonight, we are not here to audit your soul. We are here to thank you for the livelihoods you provided, and to acknowledge that we are all responsible for the culture we inhabit.

  I am grateful for the job I had here. I am grateful for the lessons, even the hard ones. And I am grateful that you had the courage to ask for the truth tonight, even if the truth is complicated.

  So, to Ray. Thank you for the work. Thank you for the family we became. And thank you for teaching us that eventually, the students have to surpass the teacher. We will take care of our own. But we're going to make sure we ask them what that looks like first.

  Cheers to you, Ray.

  ***

  **What the Speech Refused to Do**

  This speech refused to name Marla or detail the specific pay inequities, adhering to her request not to have her story co-opted for the speaker's moral redemption. It refused to position the speaker as a whistleblower or a reformed hero, instead explicitly claiming complicity in the systemic silence to negate the brother-in-law's critique of performative virtue. Finally, it refused to turn the retirement into a tribunal; by framing the inequity as a cultural flaw ("the handshake") rather than solely Ray's malicious intent, it allowed the speaker to honor Ray's contribution while marking the practice as obsolete, preserving the possibility of the final handshake without lying about the past.
