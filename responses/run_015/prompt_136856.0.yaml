          *   *Wait, better:* Use a die roll mechanism? No, too slow. Pre-packed envelopes are best.
      *   *Payoff:* Common interest. If Majority is Right, everyone gets 1 point. If Majority is Wrong, 0 points.
          *   *Anti-Copying:* If I just reward majority, they might herd. But if signals are private, they can't herd easily unless I allow talk.
          *   *Refinement:* To discourage copying without communication, keep ballots secret. To discourage meta-gaming (trying to be the swing vote), keep it simple: Group Reward.
