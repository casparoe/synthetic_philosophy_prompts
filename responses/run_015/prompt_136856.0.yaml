  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *Assumptions:* Binary choice, common interest (everyone wants the right answer), independence (votes are conditionally independent given the truth), competence ($p > 0.5$).
      *   *Result:* As $n \to \infty$, probability of majority correctness $\to 1$.
      *   *The Twist:* If votes are correlated (dependence) or $p < 0.5$, more people can decrease accuracy.
