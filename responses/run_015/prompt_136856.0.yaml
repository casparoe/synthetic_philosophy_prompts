answer: |-
  Here is a complete design for your 80-minute seminar. It is built to be robust, fast, and to force the specific conceptual collision you want regarding independence and competence.

  ### 1. Card Generation & Procedure

  **The Signal Mechanism (The "Truth" Deck)**
  Do not generate cards in class; it kills pace. Do not pre-fix the counts (e.g., exactly 12 Red/7 Blue); that violates independence (sampling without replacement creates negative correlation).
  *   **Prep:** Before class, take a small deck of 10 index cards: 6 marked "TRUE" (matching the state), 4 marked "FALSE" (opposite).
  *   **Process:** For each of the 19 students, draw one card from this 10-card deck, record the result on a slip, **replace the card**, shuffle, and draw again for the next student. Do this 19 times to create one "Round Set."
  *   **Volume:** Prepare **4 Round Sets** for Block 1, **2 Round Sets** for Block 2, and **1 Round Set** for Block 3.
  *   **In Class:** Show them the 10-card deck (6/4 split). Explain: *"I used this deck to generate your private slips before class. Each of you had a 60% chance of getting the truth. I did it beforehand so we can play fast."* This establishes the $p=0.6$ claim without lying, and the replacement ensures statistical independence.

  **The Procedure (90-Second Loop)**
  1.  **Distribute (15s):** Hand out sealed envelopes (one per student).
  2.  **Reveal (15s):** "Open. Look at your slip. Do not show anyone."
  3.  **Vote (30s):** Students mark a ballot (Red/Blue) based on their slip (usually) and drop it in a box.
  4.  **Tally (30s):** You (or a trusted student) count aloud. Record "Majority Right/Wrong" on the whiteboard immediately.
  5.  **Reset:** Collect ballots, keep envelopes for next round (or swap sets).

  **Pacing & Rounds**
  *   **Block 1 (Baseline):** 4 Rounds. (Expect ~3-4 Majority Wins).
  *   **Block 2 (Correlation):** 2 Rounds. (Expect ~0-1 Majority Wins).
  *   **Block 3 (Experts):** 1 Round. (Expect Majority Win).
  *   **Total:** 7 voting rounds. This is tight but doable if you enforce the 90-second hard stop.

  **What they should believe at the end of each block:**
  *   **End Block 1:** "The group is pretty reliable. We win most of the time."
  *   **End Block 2:** "The group suddenly got stupid. We had the same number of people, but we lost."
  *   **End Block 3:** "The tiny group of 3 beat the big group of 19."

  ### 2. Payoff Scheme

  **The "Class Pot"**
  *   **Rule:** If the **Majority Vote** matches the **True State**, every student gets **1 Point** on their personal score sheet. If the Majority is wrong, everyone gets **0**.
  *   **Why:** This enforces *Common Interest*. It aligns them against the "state of the world," not against each other.
  *   **Anti-Copying:** Because ballots are secret and collected in a box, they cannot verify if a neighbor copied them.
  *   **Anti-Meta-Gaming:** Do **not** reward individuals for being in the majority. If you reward "being on the winning side," students will ignore their signal and vote for what they think *others* will vote (herding). By rewarding only the *Group Outcome*, the dominant strategy is to vote their private signal (assuming they believe others will too).
  *   **Sacrifice:** You sacrifice individual differentiation. You cannot identify "who was smart." This is a feature, not a bug; CJT is about the collective property.

  ### 3. Minute-by-Minute Schedule (80 Minutes)

  *   **00-05: Setup.** Arrange chairs in a semi-circle. Hand out score sheets. State the goal: "Maximize Class Points."
  *   **05-10: Mechanics Demo.** Show the 10-card deck (6/4). Explain the envelope process. Emphasize: *Private signal, Secret ballot, Common Reward.*
  *   **10-30: Block 1 (Independence).** 4 Rounds.
      *   State the Truth (e.g., "Today, Truth is Red") only *after* votes are cast, to prevent leakage.
      *   Tally points on board after each round.
      *   *Target:* 3 or 4 wins.
  *   **30-35: The Twist Setup.** Tell them: *"For the next rounds, I am changing how the clues are generated. I want to simulate a 'news leak'."*
  *   **35-45: Block 2 (Correlation).** 2 Rounds.
      *   **Mechanic:** Select 6 specific students (situated together). Give them an **identical** slip (e.g., all get "Red") generated from a *separate* 50/50 coin flip, ignoring the 60% deck. The other 13 get normal 60% slips.
      *   *Crucial:* Do not tell the 13 that the 6 are correlated. Do not tell the 6 that their signal is correlated with each other, just that "This is your clue."
      *   Tally. The accuracy should drop visibly.
  *   **45-55: Block 3 (Experts vs. Crowd).**
      *   Ask 16 students to sit out (observe only).
      *   Select 3 students ("The Experts"). Give them slips from a **90% Deck** (9 True, 1 False, with replacement).
      *   Run 1 Round.
      *   Compare the 3 Experts' result to the 19-Person Class average from Block 1.
  *   **55-80: Debrief.** (See below).

  ### 4. The Debrief (Mapping Moments to Assumptions)

  Do not mention Condorcet yet. Use the whiteboard to map their experience.

  1.  **Map Block 1 to Competence ($p > 0.5$).**
      *   *Ask:* "Why did we win most rounds in Block 1?"
      *   *Guide:* "Because most of you were more likely to be right than wrong."
      *   *Board:* Write $p > 0.5$.
  2.  **Map Block 2 to Independence.**
      *   *Ask:* "We had 19 voters in Block 2, just like Block 1. Why did we get dumber?"
      *   *Reveal:* Reveal that 6 students had identical signals.
      *   *Lesson:* "Those 6 voters counted as **one** voter statistically. We thought we had 19 pieces of information; we actually had 14. Headcount lied to us."
      *   *Board:* Write "Independence."
  3.  **Map Block 3 to Competence Weight.**
      *   *Ask:* "How did 3 people beat 19?"
      *   *Lesson:* "Quality of signal matters more than quantity of voters."
      *   *Board:* Write "Competence."
  4.  **The Reveal (Last 5 Minutes).**
      *   "This is the **Condorcet Jury Theorem**."
      *   Write the conditions: 1. Binary Choice, 2. Common Interest, 3. Independence, 4. $p > 0.5$.
      *   "The theorem says if these hold, big groups are great. But you just proved that if you break #3 or weaken #4, big groups fail."

  ### 5. Predictable Failure Modes

  1.  **The "Signal Share" (Whispering):**
      *   *Risk:* In Block 1, students will show cards to neighbors to "be sure."
      *   *Fix:* Frame it as a violation of the "Common Interest." *"If you show your card, you reduce the group's independence. You are stealing points from the Class Pot."* Shame works better than rules here.
  2.  **The "Pivotal Voter" Meta-Game:**
      *   *Risk:* A smart student realizes if they think the group is already leaning Right, they might vote Left to "balance" it (or vice versa), trying to be the swing vote.
      *   *Fix:* In the instructions, say: *"The math of this game is designed so your best strategy to help the group is to vote exactly what your card says. Trust the design."*
  3.  **The "Rigged" Accusation:**
      *   *Risk:* If Block 1 goes badly (e.g., 2 wins out of 4), they will claim the cards were fixed.
      *   *Fix:* Show the 10-card deck again. Admit variance. *"4 rounds is a small sample. The theorem is about long-run frequency. But look at Block 2—that drop wasn't luck, that was design."*
  4.  **The "Expert" Resentment:**
      *   *Risk:* The 16 sitting out in Block 3 feel useless.
      *   *Fix:* Frame them as the "Control Group." Their job is to witness the comparison. Give them points if the Experts win.

  ### 6. Honest Limitations (What You Must Supply)

  You cannot demonstrate the *asymptote* ($n \to \infty$) with 19 students. You must verbally bridge this gap.

  *   **What to say:** "We stopped at 19 people. The theorem promises that if we kept adding independent voters with $p=0.6$, our accuracy would approach 100%. We didn't see 100% today because 19 is small. But you *did* see that breaking independence (Block 2) hurt us immediately, regardless of the group size."
  *   **The "Straight" Truth:** "The theorem is a mathematical limit. Today was an empirical simulation. The simulation matches the theory's *conditions*, even if we couldn't reach the *limit*."

  ### 7. Expected Accuracy & The "Adding a Voter" Trap

  **Expected Statistics (for your eyes only):**
  *   **Block 1 (19 voters, $p=0.6$):** Probability of Majority Correct $\approx 81\%$. (Expect 3 out of 4 wins).
  *   **Block 2 (13 independent + 6 correlated):** If the 6 correlated voters get the wrong signal (40% chance), they create a 6-vote block against the truth. The 13 independent voters need to overcome a 6-vote deficit. This is mathematically very hard. Accuracy drops to $\approx 50\%$ or lower.
  *   **Block 3 (3 experts, $p=0.9$):** Probability of Majority Correct $\approx 97\%$.

  **The "Adding a Voter" Setup:**
  You asked where to set up the idea that *adding* a voter makes the group worse.
  *   **Location:** **Block 2.**
  *   **Mechanism:** **A whole block of correlated ones.**
  *   **Why:** A single voter with $p < 0.5$ is an outlier (a "liar"). A block of correlated voters is a systemic failure (an "echo chamber").
  *   **The Debrief Line:** "In Block 2, we didn't remove voters. We effectively *added* voters who carried no new information. Mathematically, adding a voter who is perfectly correlated with an existing voter adds **noise** (variance) without adding **signal** (information). It dilutes the competence of the independent voters. That is why headcount can hurt: if the new heads aren't independent, they are dead weight."

  ### Summary Checklist for Instructor
  1.  **Prep:** 7 sets of 19 envelopes (4 normal, 2 correlated, 1 expert). 10-card demo deck. Whiteboard markers.
  2.  **Room:** Chairs in semi-circle. Box for ballots in center.
  3.  **Mindset:** You are the facilitator of a failure. Block 2 *must* feel like a failure compared to Block 1. Lean into that disappointment during the debrief.
  4.  **Key Phrase:** "Information, not Headcount."
