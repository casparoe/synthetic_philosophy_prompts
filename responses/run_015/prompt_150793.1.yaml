          2.  Prune to the defended list (the "specification").
          3.  Address specific constraints: separate genuine desiderata from camp prejudices, identify inconsistencies/trade-offs, provide a scorecard of existing theories (Frequentism, Bayesianism, Propensity, Pluralism).
          4.  Tone/Style: Intelligent reader, no grad training, minimal formalism, use the user's provided cases (rain, heatwave, p-value, forecasting, poll, physical theory, forensic), argue from cases not citations.
      *   **Key Question:** What must a theory of probability *do* to be good enough to publish in a news context?

  2.  **Deconstruct the User's Cases (The "Raw Material"):**
      *   *30% chance of rain:* Confusion between frequency and single-case propensity/credence.
      *   *Heatwave made 2x likely:* Retrospective, counterfactual, unique event (Attribution Science).
      *   *p = .04:* Depends on analyst choices (Garden of Forking Paths), not intrinsic truth.
      *   *Two forecasters, different numbers:* Subjectivity vs. Objectivity.
      *   *Poll margin of error:* Sampling error vs. total uncertainty.
      *   *Physical theory wrong:* Epistemic uncertainty about laws vs. stochastic outcomes.
