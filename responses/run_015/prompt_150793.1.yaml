      *   *Goal:* Show the messiness before cleaning it up.

  4.  **Drafting - Section 2: The Pruned Specification (The Core):**
      *   Now, apply the "Newsroom/Philosopher" filter. What actually *works* for the journalist?
      *   *Requirement 1: Action-Guiding.* If I print a number, someone should be able to use it (bet, prepare, policy).
      *   *Requirement 2: Distinction of Uncertainty Types.* Must distinguish "I don't know" (epistemic) from "It's random" (aleatory). Crucial for the physical theory vs. rain case.
      *   *Requirement 3: Auditability/Calibration.* Over time, the numbers must mean something stable. (Forecasters case).
      *   *Requirement 4: Counterfactual Coherence.* Must handle the "what if" (Heatwave attribution).
      *   *Requirement 5: Transparency of Inputs.* The number must reveal *why* it exists (p-value case).
      *   *Requirement 6: The "No Number" Option.* Must define when probability is undefined.

  5.  **Drafting - Section 3: Prejudices vs. Desiderata:**
      *   User suspects "Observer Independence" is a prejudice. I agree. In news, *who* knows *what* matters (Forensics, Intelligence).
      *   Another prejudice: "Truth-Evaluable Single Cases." Do unique past events *have* a probability, or just a credence? This is a metaphysical trap.
      *   Another prejudice: "Frequency is the only reality." Fails the heatwave case.

  6.  **Drafting - Section 4: The Inconsistency/Trade-off:**
      *   This is the critical philosophical pivot.
      *   *The Conflict:* You cannot have *Objective Truth for Single Past Events* AND *Observer Independence* AND *Empirical Auditability*.
      *   *The Verdict:* Drop "Objective Truth for Single Past Events." In the newsroom, a probability for a unique past event (forensics) is always a measure of *current evidence*, not a property of the event itself. Admitting this saves the theory from collapse.
      *   *Cost:* It means probabilities in forensics/attribution aren't "facts about the world" in the same way mass or charge are. They are facts about the *relationship* between evidence and hypothesis.

  7.  **Drafting - Section 5: The Scorecard:**
