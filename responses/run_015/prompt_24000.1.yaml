      *   **Core Definition:** A biological part/process is dysfunctional iff it fails to perform a function for which it was selected by evolution.
      *   **Key Challenge:** Exaptation (a trait used for a purpose other than what it was selected for).
      *   **Concrete Case:** The human larynx. Selected for breathing/basic vocalization. Used for complex speech.
      *   **Specific Question:** If speech is impaired but breathing is not, is this a "dysfunction/disease" according to the account?
      *   **Critical Perspective:** Consider a Normativist critic's response.
      *   **Task:** Weigh arguments and reach a justified conclusion on whether the account can handle exaptation.

  2.  **Initial Analysis & Theoretical Framework:**
      *   *Naturalism:* Disease is a value-free, scientific fact about biological failure. (Boorse is the classic Biostatistical Account, Wakefield is the Harmful Dysfunction Analysis). The prompt specifies "selected dysfunction," which aligns closely with Wakefield's evolutionary etiology.
      *   *Exaptation:* Coined by Gould and Vrba. A trait evolves for Function A, but gets co-opted for Function B.
      *   *The Larynx Case:* Evolutionarily, the larynx is for airway protection and vocalization (alarm calls, mating). Speech is a cultural/evolutionary byproduct (exaptation) of this anatomy.
      *   *The Problem:* If disease = failure of *selected* function, and speech is *not* a selected function of the larynx (in the strict evolutionary sense), then aphonia (loss of speech) might not count as a disease on this account, even though intuitively it is.
      *   *Normativism:* Disease is not just a biological fact; it involves social values, norms, and harm. (Engelhardt, Boorse's critics).

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Define the Naturalist Selected Dysfunction account (SDA).
