  **The Limits of Evolutionary History: Exaptation and the Selected Dysfunction Account of Disease**

  The definition of disease is one of the most contentious problems in the philosophy of medicine. Among the various frameworks proposed, the Naturalist "Selected Dysfunction" account (SDA) stands out for its attempt to ground the concept of disease in objective biological facts rather than subjective social values. According to the SDA, a biological part or process is dysfunctional if and only if it fails to perform a function for which it was selected by evolution. Consequently, a disease is essentially a failure of evolutionary design. While this account successfully avoids the pitfalls of defining disease merely as statistical deviation or social disapproval, it faces a formidable challenge from the phenomenon of exaptation. By examining the case of the human larynx and complex speech, this essay will argue that the strict Selected Dysfunction account is too rigid to accommodate exapted traits. While a Normativist critique highlights the account's failure to capture human flourishing, a modified Naturalist perspective suggests that the account can only be saved by broadening the scope of evolutionary selection to include recent co-evolutionary pressures.

  To understand the challenge, one must first grasp the core commitment of the Selected Dysfunction account. Rooted in the work of philosophers like Jerome Wakefield (specifically his "Harmful Dysfunction" analysis) and Christopher Boorse's biostatistical theory, Naturalism posits that disease is a value-free state of biological malfunction. The SDA specifically ties "function" to etiology: a heart functions to pump blood because natural selection designed it to do so. If the heart fails to pump due to a structural defect, it is dysfunctional. This evolutionary tether prevents the classification of harmless variations (like having five toes instead of four, if four were the norm) as diseases. It provides a clear line between "broken" and "different." However, this clarity relies on a stable map between a trait's evolutionary origin and its current utility.

  This map is disrupted by exaptation. Coined by Stephen Jay Gould and Elisabeth Vrba, exaptation describes a trait that currently serves a function but was not originally selected for that purpose. The prompt offers the concrete case of the human larynx. Evolutionarily, the larynx developed primarily to protect the airway during swallowing and to facilitate basic vocalization (alarm calls, mating sounds) in ancestral primates. However, in modern humans, the larynx is the primary instrument for complex, propositional speech. Under the strict SDA, the "function" of the larynx is limited to breathing and basic vocalization, as these are the selection pressures that shaped its anatomy over millennia. Complex speech is a cultural co-option of this anatomy—an exaptation.

  This distinction creates a paradox for the SDA regarding pathology. Consider a patient who suffers damage to the larynx that leaves their breathing and swallowing intact but renders them unable to produce complex speech (aphonia). Intuitively, medically, and legally, the loss of speech is a significant impairment and often classified as a medical condition or disability. However, according to the strict Selected Dysfunction account, there is no dysfunction here. The larynx is performing all the functions it was *selected* to perform. It breathes; it protects the airway. The capacity for speech, being an exaptation, is not a "selected function." Therefore, its failure is not a biological dysfunction. If disease requires dysfunction, then the inability to speak is not a disease. This result is a *reductio ad absurdum* for the theory; an account of disease that classifies the loss of human speech as non-pathological fails to align with medical reality.

  A Normativist critic would seize upon this failure to argue that the Selected Dysfunction account is fundamentally flawed. Normativists, such as H. Tristram Engelhardt or Daniel Callahan, argue that disease cannot be separated from human values and social context. From this perspective, the evolutionary history of an organ is irrelevant to its status as a disease-causing failure. What matters is whether the condition prevents the individual from achieving goals valued by themselves or their society. Since speech is essential for participation in modern human society, its loss constitutes a harm and a deviation from the norm of health, regardless of whether ancestors used their larynges for poetry. The Normativist would argue that the SDA commits the "genetic fallacy," assuming that the origin of a trait dictates its current normative status. For the Normativist, the larynx case proves that "function" is determined by current utility and social expectation, not ancestral selection. Consequently, they would conclude that the SDA must be abandoned or heavily supplemented by normative criteria to define disease adequately.

  The Naturalist, however, need not concede defeat entirely. There are two potential lines of defense to salvage the Selected Dysfunction account. The first is to challenge the biological premise of the example. Some evolutionary biologists argue that the descent of the human larynx *was* specifically selected for speech capabilities in hominids. If speech was a selection pressure, then the loss of speech is indeed a failure of a selected function, and the SDA holds. However, this defense is precarious. Even if the larynx was selected for speech, many other capacities (such as using hands for writing or typing) are clearly exaptations of limbs selected for grasping and climbing. If a person loses the motor control to write due to nerve damage, the SDA might similarly struggle to classify this as a dysfunction if "writing" is not a selected function of the hand.

  The second, more robust Naturalist defense involves refining the concept of "selection." A sophisticated Naturalist might argue that selection is an ongoing process, not a historical fossil. In the context of human evolution, cultural and biological evolution have co-evolved. The capacity for language is so biologically entrenched (involving specific neural structures like Broca's area) that the *system* of communication, of which the larynx is a part, can be viewed as selected. Therefore, damage to any integral component of this selected system constitutes a dysfunction. Alternatively, the Naturalist could adopt Wakefield's full "Harmful Dysfunction" distinction. They might concede that speech loss is not a *dysfunction* in the strict evolutionary sense but argue it is still a *disease* because it causes *harm*. However, this undermines the purity of the SDA, as it admits that "disease" is a conjunctive concept requiring a normative element (harm) that can exist even without strict evolutionary dysfunction.

  Weighing these arguments, the Normativist critique exposes a genuine vulnerability in the strict Selected Dysfunction account. The larynx case demonstrates that human biology is not a static museum of ancestral adaptations but a dynamic platform for new capacities. To insist that only ancestral functions count as "real" functions renders the concept of disease obsolete for many modern impairments. However, the Naturalist is correct to warn that abandoning evolutionary criteria entirely opens the door to pathologizing normal social deviance.

  Therefore, the justified conclusion is that the Selected Dysfunction account, in its strict form, cannot adequately handle exaptation cases. It yields false negatives by excluding genuine pathologies like speech impairment. To remain viable, the account must be modified. It should not abandon evolutionary theory, but it must recognize that "selected function" can include functions selected for in the recent evolutionary past (such as the co-evolution of language and biology) or functions that are integral to a larger selected system. Ultimately, while evolutionary history provides a necessary constraint on the concept of disease, it is not sufficient. A complete account must acknowledge that when biology enables new, vital capacities through exaptation, the failure of those capacities constitutes a dysfunction, even if the specific usage was not the original target of selection. The larynx was made for breathing, but in humans, it is also for speaking; to deny the latter is to deny the biological reality of what it means to be human.
