      *   **The Challenge of Exaptation (The Larynx Case):**
          *   Define exaptation.
          *   Apply to the larynx. Ancestral function: breathing/swallowing/primitive sound. Current use: complex language.
          *   The Dilemma: If a person cannot speak (aphasia/aphonia due to laryngeal damage) but breathes fine, SDA says: "Breathing mechanism works. Selected function intact. No dysfunction."
          *   Intuitive verdict: Loss of speech *is* a medical condition/disease.
          *   Result: SDA seems to yield a false negative.

      *   **The Normativist Critique:**
          *   What would a normativist say?
          *   They would argue SDA is too rigid. Disease is defined by *harm* and *social context*, not just evolutionary history.
          *   Speech is essential for human flourishing in modern society. Therefore, losing it is a disease, regardless of evolutionary origin.
          *   Critique of SDA: It conflates "evolutionary function" with "current biological capability."

      *   **Defending/Modifying the Naturalist Account:**
          *   How can a naturalist respond?
          *   *Argument 1:* Speech *is* selected. (Counter: Maybe not the larynx specifically, but the neural apparatus is. But the prompt focuses on the larynx).
          *   *Argument 2:* The "design" includes plasticity or range.
          *   *Argument 3 (Strongest):* Distinguish between the *organ* and the *system*. The larynx is part of a larger communication system which *was* selected.
          *   *Argument 4:* Acknowledge the limitation. SDA defines "dysfunction," but "disease" requires "harm" (Wakefield's HD Analysis). If speech loss causes harm, it's a disease, but is it a *dysfunction*? Wakefield might say speech isn't a biological function of the larynx, so it's not a *dysfunction*, but it might still be a problem.
          *   *Refinement:* Actually, strict SDA struggles here. To save it, one must argue that the *capacity* for complex vocalization was selected in hominids. If we accept recent evolution, speech *is* a selected function.
          *   *Alternative:* Accept that exaptations create "new functions." If a structure is reliably used for a vital biological end, does it become a function? Naturalists usually say no, it remains an exaptation.
          *   *Conclusion on Defense:* The strict SDA fails this specific case unless it broadens the definition of "selected" to include recent evolutionary pressures or systemic integration.

      *   **Weighing and Conclusion:**
          *   The Normativist is right that SDA is too narrow here.
          *   However, abandoning naturalism entirely leads to subjectivity.
          *   Best path: A hybrid view or a modified naturalism. The SDA needs to account for *derived* functions or acknowledge that "disease" involves a normative layer on top of dysfunction.
          *   Final Verdict: The strict Selected Dysfunction account *cannot* adequately handle exaptation without modification. It classifies speech impairment as non-dysfunctional, which contradicts medical practice. Therefore, the account requires refinement (e.g., acknowledging co-evolution of culture and biology) or must concede that "disease" is partly normative.

