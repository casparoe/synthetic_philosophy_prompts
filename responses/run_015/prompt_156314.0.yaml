answer: |-
  This is a remarkably precise diagnosis. You have identified the structural isomorphism between the ethical stalemate and a class of physical modeling errors where variables are misclassified as state functions rather than path functions, or intensive rather than extensive properties.

  Here is the diagnosis of the impasse, categorized by your questions, followed by an assessment of whether progress is possible.

  ### 1. Diagnosis of the Impasse: Intensive vs. Extensive

  Your hypothesis is correct: the debate stalls because Singer treats moral obligation as an **intensive property**, while his critics treat it as an **extensive property**.

  *   **Singer's Model (Intensive):** Moral value (the badness of a child dying) is like temperature or density. It does not change based on the size of the system or the coordinates of the observer. If the "moral pressure" is high enough in the pond case, it remains high enough in the famine case. Distance is a coordinate transformation that should not alter the scalar value of the obligation. The boundary condition is strictly *causal capacity* ("can I save them?") and *cost* ("does it hurt me comparably?").
  *   **The Critics' Model (Extensive):** Moral obligation is like mass or energy. It scales with the system's configuration. The "system" includes the agent's psychological integrity, their special relationships, and the causal chain length. As you add distance, institutional mediation, or numbers of other potential rescuers, the "moral mass" assigned to the specific agent shifts. The boundary condition is *sustainable agency* ("can I function as a moral agent if I do this?").

  **The Structural Error:**
  Singer argues from **Ideal Theory** (what the moral law looks like in a vacuum). Critics argue from **Non-Ideal Theory** (how the moral law couples with human psychology and social structures).
  When Singer says, "Distance is morally irrelevant," he is making a claim about the *source* of the duty (the victim's need). When critics say, "Distance matters," they are making a claim about the *transmission* of the duty (the agent's epistemic and causal grip). They are measuring different variables but labeling both "obligation."

  ### 2. Classification of the Disagreement

  Is it verbal, substantive, or empirical? It is a **substantive disagreement about the metaphysics of agency**, masked as a verbal dispute about "obligation."

  *   **Why it is not merely verbal:** If it were just about the definition of "ought," we could stipulate "Ought-Ideal" and "Ought-Practical" and move on. But the stakes are real resource allocation. The disagreement is about whether the *normative force* originates in the *state of the world* (Singer) or the *role of the agent* (Critics).
  *   **Why it is not purely empirical:** Empirical moral psychology (e.g., "humans cannot sustain high altruism") is often invoked by critics (the "limits of moral psychology" argument). However, Singer correctly rebuts this by saying *ought implies can* refers to logical/physical possibility, not psychological ease. If the empirical fact is "humans won't do it," Singer says "then humans are immoral," not "the duty vanishes." Therefore, empirical data on motivation cannot resolve the normative claim.
  *   **The Substantive Core:** The disagreement is about **moral topology**. Is the moral universe a flat field where every unit of suffering exerts equal pull (Singer), or is it a curved space where proximity and relationship create "gravity wells" that alter the trajectory of duty (Critics)? This is a metaphysical claim about the structure of normativity, not a definition or an empirical measurement.

  ### 3. What Counts as Progress?

  In experimental physics, progress is often a new measurement that falsifies a model, or a unification that shows two models are limits of a deeper theory. In moral philosophy, progress is **conceptual engineering that dissolves the paradox.**

  Here is what would count as progress, ranked from least to most valuable:

  1.  **Explicit Formal Distinction (Low Value):** Stipulating "Pro Tanto Duty" vs. "All-Things-Considered Duty." This is already done in the literature (e.g., W.D. Ross). It clarifies the language but doesn't solve the resource allocation problem. It's like renaming "force" and "net force" without resolving the friction coefficient.
  2.  **Empirical Results on Motivation (Low Value):** Showing that demanding altruism leads to burnout. Singer accepts this but treats it as a tragedy, not a refutation. This data changes policy, not philosophy.
  3.  **Reframed Question: The Unit of Agency (High Value):** This is where the physics analogy yields the most fruit. The impasse exists because both sides assume the **individual agent** is the fundamental unit of moral calculation.
      *   **The Progress:** Recognizing that the "drowning child" scenario is a **single-agent system**, while global poverty is a **multi-agent coordination problem**.
      *   In a single-agent system, the intensive property holds (if you are the only one, you must save the child). In a multi-agent system with no coordination, the "diffusion of responsibility" is not a psychological bug but a structural feature.
      *   **Progress** looks like shifting the locus of obligation from the *individual's intensive duty* to the *collective's extensive duty*. The question changes from "How much must I give?" to "What institutions must we build to ensure the duty is discharged without destroying the agent?"

  ### 4. Should Progress Be Expected?

  **No, not in the sense of a "solution" analogous to a physical law.**

  In physics, if two models disagree on a boundary condition, you run an experiment at that boundary. In ethics, there is no "experiment" that can adjudicate between "moral value is intensive" and "moral agency is extensive." Both are coherent internal systems.

  **However, yes, in the sense of dissolving the stalemate.**

  The stalemate persists because philosophers continue to treat the "drowning child" as a **thought experiment about intuition** rather than a **model of causal structure**.
  *   **The Pond:** High epistemic certainty, direct causal link, single agent.
  *   **The Famine:** Low epistemic certainty, mediated causal link, multiple agents.

  Singer argues these differences are morally inert. Critics argue they are morally decisive.
  **Progress occurs when we admit Singer is right about the *value* (intensive) but the critics are right about the *mechanism* (extensive).**

  The synthesis is **Institutional Consequentialism**.
  1.  **Accept the Intensive Claim:** The suffering of a distant child *is* as bad as a drowning child.
  2.  **Accept the Extensive Constraint:** The individual agent cannot directly discharge this duty without system failure (burnout, inefficiency, loss of special obligations).
  3.  **The Resolution:** The duty is not to *save the child directly* (which fails the boundary conditions of the extensive model), but to *support institutions that save the child* (which satisfies the intensive value claim through an extensive mechanism).

  ### Summary for the Experimentalist

  You are looking for a falsifiable boundary condition. You will not find one, because the "data" in moral philosophy (intuitions) are theory-laden. The utilitarian intuition is calibrated to *outcomes*; the deontological intuition is calibrated to *actions*.

  The impasse is not a failure of reasoning; it is a **category mismatch**.
  *   **Sider A** is measuring the **Field Strength** (Intensity of Need).
  *   **Side B** is measuring the **Circuit Load** (Capacity of Agent).

  Progress is not expected from better arguments about the field or the load. Progress is expected from **redesigning the circuit**. The debate will only move when the question shifts from "What is my duty?" (Individual/Intensive) to "What is our design?" (Collective/Extensive). Until then, you are watching two groups measure voltage and current respectively, arguing over which one is "Electricity."
