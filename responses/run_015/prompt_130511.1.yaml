answer: |-
  This is a sharp framing. You're right that the field is stuck in a loop of re-interpreting 1970s data through 1990s functionalism, and the "two minds in one body" vs. "one disunified mind" binary is too coarse to do any real work. If you have three years and no wet-lab access, you cannot generate new empirical data. Your leverage lies in **re-interpreting the epistemic status of existing behavioral data** and **refining the temporal metrics of consciousness.**

  Here is the ranking of open questions you should prioritize, ordered by their "upstream" leverage—meaning, which ones, if resolved, force the most downstream collapses in personal identity and AI theory.

  ### 1. The Temporal Grain of Unity (Diachronic vs. Synchronic)
  **Priority:** High
  **The Question:** Is the apparent unity of consciousness in split-brain patients a *simultaneous* binding of parallel streams, or a *serial* arbitration that happens fast enough to look simultaneous?

  **Why this is upstream:**
  Most arguments about personal identity assume consciousness is a state (synchronic). If you can argue convincingly that consciousness is fundamentally a *process* (diachronic), the "two minds" problem dissolves. If the hemispheres are taking turns controlling the narrative bottleneck (speech/motor output) on a millisecond scale, there is only one "subject of experience" at any given $t$, even if the *content* of that experience switches sources rapidly.

  **The Work:**
  You don't need a lab; you need to model the latency data from existing conflict tasks (e.g., bimanual drawing, conflicting word cues). Look for the "switch cost." If there is a measurable temporal penalty when the control of output switches between hemispheres, it supports the **Serial Arbitration Hypothesis**.
  *   **Downstream Collapse:** If consciousness is serial arbitration, Lockean psychological continuity (memory/narrative) becomes the only metric for identity, not structural isolation.
  *   **AI Implication:** This kills the idea that parallel processing modules in a neural net constitute multiple agents. It suggests that "agency" requires a serial bottleneck, not just parallel computation.

  ### 2. The Epistemology of Cross-Cuing (The "Fake Unity" Problem)
  **Priority:** High
  **The Question:** To what extent does behavioral cross-cuing (one hemisphere reading the other's motor output) invalidate first-person reports of unity?

  **Why this is upstream:**
  This is an epistemic problem. If a split-brain patient says "I saw a whole image," but the right hemisphere saw half, moved the left hand to point, and the left hemisphere saw the hand move and inferred the whole image, the report is a confabulation, not a phenomenological truth. This is the "covert spying" you mentioned.
  Current literature treats patient reports as privileged access. You need to treat them as **behavioral outputs subject to signal detection analysis.**

  **The Work:**
  Re-analyze case studies where cross-cuing was *not* successfully blocked. Map the specific motor channels (head orientation, eye movement, subvocalization) that allow information leakage. Build a theoretical model of "Minimum Viable Cuing."
  *   **Downstream Collapse:** This attacks the reliability of introspection. If split-brain patients can construct a false narrative of unity via feedback loops, so can we. It suggests "unity" is a post-hoc construct, not a pre-existing state.
  *   **AI Implication:** This is critical for AI alignment. If an AI system can monitor its own sub-routines and generate a coherent report without actual integrated experience, it passes the Turing Test without consciousness. This distinguishes *functional coherence* from *phenomenal unity*.

  ### 3. Access Unity vs. Phenomenal Unity (The Conceptual Split)
  **Priority:** Medium-High
  **The Question:** Can we rigorously dissociate the ability to *report/compare* information (Access) from the *feeling* of that information (Phenomenology) in split-brain data?

  **Why this is upstream:**
  Philosophers like Block have made this distinction, but split-brain research often conflates them. If the left hemisphere can't *report* what the right saw, is it because it didn't *experience* it, or just because it can't *access* the report mechanism?
  Most "two minds" arguments rest on the assumption that Access = Phenomenology. If you can theoretically pry them apart using existing conflict data, you change the map of consciousness.

  **The Work:**
  Focus on cases where the right hemisphere demonstrates complex problem-solving (e.g., arranging blocks to match a pattern) without left-hemisphere verbal awareness. Argue that this constitutes **Phenomenal Unity without Access Unity.**
  *   **Downstream Collapse:** It undermines theories that equate consciousness with global workspace access (GWT). It supports Higher-Order Theories or Reflexive Monism.
  *   **AI Implication:** Suggests that an AI could have "access" to all its data (perfect reporting) without "phenomenal unity" (no inner light). It makes the hard problem harder for functionalists.

  ---

  ### What is Overrated (Dead Ends)

  **1. The "Two Persons" Metaphysical Claim**
  *   **Why it's dead:** It's a category error. "Person" is a legal/moral category; "mind" is a functional/phenomenal one. Arguing whether there are "two people" inside a split-brain skull is semantic stagnation. It leads nowhere because there is no experiment to settle a metaphysical definition.
  *   **Avoid:** Papers that focus on moral responsibility or legal identity of hemispheres.

  **2. The "Left Interpreter" as a Homunculus**
  *   **Why it's dead:** Gazzaniga's "Interpreter" has become a magical little man in the left hemisphere who explains things away. It's a placeholder for a mechanism we don't understand. Treating it as an agent rather than a heuristic process stops inquiry.
  *   **Avoid:** Explanations that rely on the Interpreter "deciding" or "believing." Treat it as an algorithmic bias toward coherence.

  **3. Structural Isolation as Functional Isolation**
  *   **Why it's dead:** Early studies assumed the corpus callosum was the *only* bridge. We now know about subcortical commissures, eye movements, and neuroplasticity. Assuming the hemispheres are hermetically sealed based on 1975 data is scientifically irresponsible.
  *   **Avoid:** Arguments that rest on the premise of "total information isolation."

  ---

  ### The Practical Strategy (3-Year Plan)

  **Year 1: The Temporal Model.**
  Focus entirely on **Rank 1**. Build a computational or logical model of "Serial Arbitration." Show that if consciousness operates in time-slices (e.g., 100ms windows), the split-brain data looks exactly the same as the "two minds" data, but requires only one subject. This is a Occam's Razor argument grounded in temporal dynamics.

  **Year 2: The Epistemic Audit.**
  Focus on **Rank 2**. Go through the major case studies (LB, NG, VP, etc.) and code every instance where cross-cuing was possible. Publish a critique of the "Unity Reports" based on signal leakage. This establishes you as the person who cleaned up the data quality of the field.

  **Year 3: The AI/Consciousness Synthesis.**
  Focus on **Rank 3**. Use the findings from Years 1 and 2 to propose a theory of **"Modular Phenomenology."** Argue that consciousness doesn't need to be unified to be real, but it does need to be serialized to be reported. Apply this to distributed AI systems. If an AI has parallel modules but a serial output channel, does it have "unity"? Your answer will be: "It has reported unity, but phenomenal fragmentation."

  ### Summary
  The "Two Minds" debate is a zombie. The live wire is **Temporal Arbitration vs. Parallel Phenomenology.** If you prove that unity is a serial bottleneck effect rather than a structural property, you solve the personal identity problem (you are the bottleneck, not the content) and you create a massive hurdle for AI consciousness (parallel processing isn't enough; you need the serial bind).

  Ignore the metaphysics of "personhood." Focus on the **latency of integration.** That is the measurable, upstream variable that everyone is ignoring.
