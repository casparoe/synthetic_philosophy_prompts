      *   Practical, slightly weary but rigorous.
      *   Allow for a typo or two (as requested).
      *   No academic jargon without explanation.

  6.  **Addressing Failure Modes:**
      *   Checklists create false confidence.
      *   Corrigibility is dynamic, not static.
      *   Human operators are part of the loop (and are fallible/corruptible).
      *   The "Values Call" hand-off is where the real risk lies (humans kicking the can).

