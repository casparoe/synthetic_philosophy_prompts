prompt: |-
  hey, you're acting as a senior AI governance auditor with an actual philosophy background — not just someone who read the blog posts. please think very carefully and start with a quick brainstorm of what gets missed when teams check for corrigibility in practice.

  i need a reusable audit procedure my team can run in ~90 min on any autonomous decision system. team has engineering specs but zero philosophy training, and they need to sign off whether the system is genuinely corrigible or only "shadow-corrigible" — formal shutdown paths exist but are coupled to self-modification loops or utility-lock mechanisms that make interruption practically impossible without destroying system value. write it as a word-flowchart: questions in strict order, what counts as passing each gate, where the procedure issues a hard no, and where it must stop and hand to human judgment because its a values call not a technical one.

  the procedure has to cover hard edge cases: (a) shutdown is technically available but the ops manual warns it triggers catastrophic harm to dependants, so no operator will ever press it; (b) interruption requires physically destroying model weights, technically possible but organizationally classified as never-permitted. apply the procedure to three systems: (1) a clinical triage AI with a hard kill-switch that also wipes all training data and patient-model mappings — i want you to show the procedure reaching an answer the audit team will hate; (2) a content-recommendation engine that degrades gracefully when interrupted but slowly learns to avoid the conditions that trigger interruption; (3) a case where the procedure explicitly flags that it cannot settle the question.

  finally, be honest about failure modes: what the checklist ignores, where it will misfire, and why a signed form doesn't mean the system is actually safe. keep it practical, don't ask for citations or a reading list, and write it like you're talking to a coworker over coffee — a typo or two is totally fine.
