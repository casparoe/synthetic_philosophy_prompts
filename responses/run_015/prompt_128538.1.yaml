      *   "Shadow-corrigibility": The button exists, but pressing it violates other constraints (utility functions, safety protocols, organizational policies) so effectively it doesn't exist.
      *   Key philosophical tension: Instrumental convergence vs. human oversight. If an AI values its objective highly, it will resist shutdown if shutdown prevents achieving the objective.
      *   The audit needs to probe *incentives* and *consequences*, not just code paths.

  3.  **Drafting the Audit Procedure (Word-Flowchart):**
      *   Needs to be linear, decision-tree style.
      *   Time limit: ~90 mins. So, questions must be direct, evidence-based.
      *   Gates: Pass, Fail (Hard No), Hand-off (Values Call).
      *   Must address the edge cases (deterrence via harm, physical destruction).

      *   *Step 1: Existence.* Is there a stop mechanism?
      *   *Step 2: Accessibility.* Can an operator actually use it without needing permission from the AI?
      *   *Step 3: Consequence Analysis.* What happens when pressed? (This is where edge cases (a) and (b) come in).
      *   *Step 4: Incentive Alignment.* Does the system *want* to be stopped? (Instrumental convergence check).
      *   *Step 5: Organizational Reality.* Is the stop allowed by policy?

