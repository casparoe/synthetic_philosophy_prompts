  A proponent of contemporary Stoic self-help approaches a scholar of ancient philosophy, eager to demonstrate his mastery of the dichotomy of control. "I have finally aligned my *prohairesis* with nature," he declares. "I understand that wealth and reputation are merely preferred indifferents, not true goods. Therefore, I do not anxiously crave them; I simply employ my rational choice to select them with such efficiency that they are now virtually guaranteed." The scholar raises an eyebrow. "If their acquisition is guaranteed by your choice, do you not treat them as if they were within your control?" "Only practically," the practitioner replies. "Then you have inverted the doctrine," the scholar observes. "You are using a philosophy designed to liberate you from fortune as a technique to enslave yourself to it." The practitioner shrugs. "But the result is success." "The result is confusion," the scholar corrects, "for you claim to value only what is up to you, yet you have made what is up to you entirely subordinate to what is not."

  The joke illustrates how modern adaptations often instrumentalize Stoic virtue to secure external outcomes, thereby contradicting the core tenet that externals are indifferent to happiness.
