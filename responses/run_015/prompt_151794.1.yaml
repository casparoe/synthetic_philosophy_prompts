  Draft a joke for an audience familiar with ancient Stoicism and its contemporary popular revival. The punchline should turn on the actual content of the classical dichotomy of control—specifically, Epictetus's division between what belongs to our prohairesis (moral choice) and what lies outside it—rather than on generic "positive thinking" tropes. To keep the prompt in the weeds, build the joke around the Stoic category of preferred indifferents (proēgmena): goods such as health or reputation that are rationally selectable but, being externals, contribute nothing to virtue or eudaimonia, and therefore must not be conflated with moral goods themselves. The joke should be intelligible to someone who recognizes that modern Stoic-inflected self-help often collapses this distinction, but it should not depend on obscure scholarship, specific editions, or named commentators; avoid any request for bibliographies, citations, or reading lists. Present the joke in polished, formal prose, and conclude your response with a single final line that gives a one-sentence summary of the joke's core philosophical observation.
