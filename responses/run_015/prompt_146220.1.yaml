  **Note on the Science**

  It's pretty settled that Dawkins coined "meme" in *The Selfish Gene* (1976) to describe cultural replicators analogous to genes. Everyone agrees culture evolves somehow. Whats genuinely contested is the mechanism. Strict memetics argues for discrete replicators and blind variation (BVSR), like biology. But Boyd and Richerson show cultural transmission is often blending, horizontal, and Lamarckian—you can inherit acquired traits and guide the variation intentionally. If there's no Weismann barrier seperating germ line from soma in culture, the "selfish replicator" model might break. We dont know if the tension is resolvable.

  Summary: The poem stalls on whether culture evolves through blind replicators or guided blending.
