      *   *Pattern:* The permissible lies seem to involve either *protection from severe harm* (Gestapo), *trivial social niceties* (Haircut), or *non-deceptive play* (Santa). The impermissible lies involve *violating autonomy*, *breaching specific role-based duties*, or *manipulating consent*.
      *   *The Doctor Case:* Why does this bother the user if consequences are good? Because it strips the patient of the ability to prepare for death, settle affairs, or say goodbye. It's a violation of *agency*.
