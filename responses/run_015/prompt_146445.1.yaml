  ### 1. Prediction for *Succession*

  **Predicted Number:** **0.35**

  **Reasoning:**
  Her verdicts suggest she is weighing three factors: the continuity of the biological species, the quality of the future trajectory, and the epistemic state of the current generation. 
  *   **The Anchor:** *Distant Stop* (0.4) represents a future where the human line ends and the current generation *doesn't know*. *Succession* is structurally similar regarding the end of the biological line, but the current generation *does know* (which usually raises badness, see *Slow Fade* vs. *Distant Stop*). 
  *   **The Offset:** However, in *Succession*, the "Future Value" factor is maximized (richer than a human future), similar to *Ninety Percent* (0.01). In *Ninety Percent*, the biological line continues. In *Succession*, it does not. 
  *   **The Calculation:** If she truly prioritizes "humanity goes on" as biological continuity, *Succession* should be near *Slow Fade* (1.0). If she prioritizes "the project continues," it should be near *Ninety Percent* (0.01). Given *Long Dark* (0.6), she penalizes the loss of civilizational capacity even when biology survives. This implies civilizational capacity (Value) is a heavier weight than biology alone. However, the switch from human to machine agency is a break in the "Causal Chain" that *Long Dark* preserved. 
  *   **The Verdict:** She will likely view *Succession* as a "trade." The loss of the human chain pulls it toward *Slow Fade*, but the preservation of value and the "relief" of the current generation (satisfying preferences) pulls it toward *Ninety Percent*. It will land worse than *Distant Stop* (because the end is known and accepted as a transformation, not ignored) but significantly better than *Slow Fade* (because the "afterlife" of the project is secure). 0.35 reflects a "Humanity Ended, But The Good Stuff Survived" compromise.

  ### 2. The Three Rules

  Here are the three rules that render her first four verdicts consistent, and how they diverge on *Succession*.

  **Rule A: The Subjective Closure Rule (Frustration of Interest)**
  *   **Principle:** Badness is primarily determined by the frustration of the current generation's conscious desires regarding the future. If people believe the project is ending and are distressed, it is bad. If they are relieved or ignorant, it is less bad.
  *   **Fit:** Explains *Distant Stop* (0.4) vs. *Slow Fade* (1.0). The physical outcome is identical; the difference is the current generation's knowledge and distress. Explains *Ninety Percent* (0.01) where survivors know the project continues.
  *   **Prediction for Succession:** **0.05.** The prompt states "many people are relieved." Their preferences for a secure future are satisfied. The frustration term is near zero.

  **Rule B: The Objective Potential Rule (Future Value)**
  *   **Principle:** Badness is the loss of potential value (welfare, achievements, complexity) in the future light-cone. The substrate (biology vs. machine) matters only insofar as it affects this capacity.
  *   **Fit:** Explains *Ninety Percent* (0.01) vs. *Long Dark* (0.6). In both, biology survives. The massive difference in score comes from the future's capacity to generate value (rich civilization vs. foragers).
  *   **Prediction for Succession:** **0.0.** The future is "longer, larger and contains more of everything... valuable." There is no loss of potential value; there is a gain. Extinction is instrumentally bad only because it stops value; here, value continues.

  **Rule C: The Lineage Integrity Rule (Causal Chain)**
  *   **Principle:** Badness is the breaking of the causal and cultural chain of *human* agency. It matters that *we* (Homo sapiens, culturally and biologically linked) are the ones who go on. A discontinuity in the agent type constitutes a form of death, regardless of what replaces it.
  *   **Fit:** Explains *Long Dark* (0.6) vs. *Ninety Percent* (0.01). *Long Dark* preserves the chain but degrades the value. *Slow Fade* (1.0) breaks the chain. The fact that *Long Dark* is significantly worse than *Ninety Percent* shows that a degraded human future is still preferred to a non-human one (implied by the high penalty for *Slow Fade*).
  *   **Prediction for Succession:** **0.9.** The human causal chain is definitively broken. Machine successors are not "humanity going on without us"; they are "something else going on after us." This is functionally identical to *Slow Fade*, perhaps slightly mitigated by the lack of suffering in the transition.

  ### 3. The Further Case

  Assuming *Succession* forces her to abandon one rule (likely Rule C if she goes low, or Rules A/B if she goes high), the two most resilient competitors will be **Subjective Closure (Rule A)** and **Objective Potential (Rule B)**. Both predict low badness for *Succession*, but for different reasons (Relief vs. Value). To separate them, you need a case where the Future is Valuable, but the Current Generation is Frustrated.

  **The Case: "The Weeping Inheritance"**
  *   **Scenario:** In 2060, a non-sterilizing plague alters human psychology. The survivors (biological humanity continues) are capable of building a future that is objectively richer, larger, and more valuable than our current trajectory (matching *Ninety Percent*'s future value). However, due to the psychological shift, the current generation (2050–2060) is consumed by a delusion that civilization has permanently collapsed. They die in absolute despair, believing they are the last, weeping for the end of humanity. The survivors who rebuild do not emerge until after the last of the "old humans" have died of old age.
  *   **Why this separates them:**
      *   **Rule A (Subjective Closure):** Predicts **High Badness (0.8).** The current generation's desires are maximally frustrated. They believe the project has ended. The "relief" condition of *Succession* is inverted to "despair."
      *   **Rule B (Objective Potential):** Predicts **Low Badness (0.05).** The future light-cone contains the same high value as *Ninety Percent*. The temporary misery of one generation is negligible compared to the astronomical value of the future that actually exists.
      *   **Rule C (Lineage):** Predicts **Low Badness (0.1).** Biological humanity continues, and the causal chain is unbroken, even if the intermediate generation was miserable.

  **Which verdict has to move?**
  If you find her four original verdicts mutually inconsistent, the outlier is **Long Dark (0.6)**.
  *   **Why:** Her stated principle is that "what we care about... is that humanity goes on without us." In *Long Dark*, humanity *does* go on (biologically and culturally, albeit degraded). In *Distant Stop* (0.4), humanity *does not* go on (extinct in 2400).
  *   **The Inconsistency:** She rates a scenario where humanity *dies out* (Distant Stop) as *better* (0.4) than a scenario where humanity *survives* (Long Dark, 0.6). This directly contradicts her stated principle that the survival of humanity is the primary good. To be consistent with her principle, *Long Dark* must be lower than *Distant Stop*, or *Distant Stop* must be higher than *Long Dark*. Given her *Ninety Percent* verdict, she likely needs to lower *Long Dark* (admitting that a degraded human future is still better than human extinction) or raise *Distant Stop* (admitting that ignorance doesn't mitigate extinction enough).
