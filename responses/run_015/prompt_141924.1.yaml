      *   *The Idea:* We categorize based on proximity to a mental "average" or best example.
      *   *Fit:* Explains the grading (good vs. bad 'a's) and reaction times.
      *   *Break:* Requires a central tendency (an "average shape"). A cookie and a stencil 'a' cannot be averaged into a coherent skeleton. It also fails to explain the contextual shift (the stencil 'a' that is an 'o' alone but an 'a' in text).
  3.  **Exemplar Theory**
      *   *The Idea:* We store specific memories of past instances and match new ones to them.
      *   *Fit:* Explains acquisition through exposure.
      *   *Break:* Fails your "new material" case (an 'a' in a dimension nobody has used). If no stored example matches, recognition shouldn't happen. It also doesn't explain the *systemic* dependence on neighboring letters.
  4.  **Functional Kind (Philosophy of Art/Artifacts)**
      *   *The Idea:* An object is a member of a kind if it performs a specific function (e.g., a "chair" is for sitting).
      *   *Fit:* Explains how diverse forms can be one thing (they all do the job of "signifying /a/").
      *   *Break:* "Function" in philosophy usually implies physical utility. It struggles to capture the *aesthetic* normativity (why a clumsy 'a' is a failure) and the *structural* dependence (why it needs an 'o' to be itself).
  5.  **Structuralism / Semiotic Value (Saussure)**
      *   *The Idea:* Identity is defined by difference from other signs in the system (e.g., 'a' is 'a' because it is not 'o' or 'e').
      *   *Fit:* Perfectly explains the context dependence (the stencil 'a' needs its neighbors).
      *   *Break:* Purely abstract. Doesn't explain the *perceptual* mechanism (how we see the shape) or the *aesthetic* grading (why some realizations are better than others).
  6.  **Perceptual Learning (Goldstone)**
      *   *The Idea:* Expertise changes how we physically perceive features; we learn to "see" relevant distinctions.
      *   *Fit:* Explains the acquired competence (English vs. Cyrillic) and the instant recognition.
      *   *Break:* Describes the *process* of learning, not the *status* of the object. Doesn't account for the stability of the norm across different people.

  ### Phase 2: Diagnosis and Selection

  **Is this one phenomenon or a bundle?**
  It is **one phenomenon**. The featureless recognition, the contextual dependence, the normative grading, and the acquired competence are not separate traits traveling together; they are four symptoms of a single cognitive stance. You are describing a specific mode of **Normative Structural Perception**.

  The philosopher who said "Family Resemblance" was close on the *logic* (no essential features) but wrong on the *mechanism* (similarities). The friend who said "Classifier" was close on the *process* but wrong on the *stability* (it's not just statistical; it's rule-governed). The one who said "Platonic Form" was right on the *normativity* (there is a standard) but wrong on the *location* (it's not in a heaven of forms; it's in the system of use).

  **The Best Fit:**
  None of the established terms fit *exactly* because they isolate one dimension (psychological, philosophical, or semiotic) while ignoring the others. "Functional Kind" is the closest philosophical parent, but it lacks the aesthetic/structural nuance you describe.

  Therefore, I will coin a term to capture the unity of **Identity + Value + System**.

  ### Phase 3: The Coined Term

  I propose calling this phenomenon **Glyphic Fitness**.

  **Definition:**
  A mark possesses **Glyphic Fitness** relative to a specific script if and only if:
  1.  **Structural Slot:** It successfully occupies a specific differential slot within that script's system (distinguishing itself from neighbors like 'o' or 'e').
  2.  **Perceptual Cue:** It provides sufficient perceptual information to trigger recognition in a competent user, even without shared geometric features.
  3.  **Normative Realization:** It is judged by competent users as fulfilling the stylistic and functional expectations of that slot to a degree that warrants acceptance (High Fitness) or rejection (Low/Zero Fitness).

  **Why this term?**
  "Fitness" implies both *fitting in* (identity/category) and *being fit* (quality/normativity). It captures the biological/evolutionary sense of adaptation to an environment (the script system) without reducing it to mere survival. It allows for degrees (a "fit" letter vs. an "unfit" letter) while maintaining a boundary (if fitness drops to zero, it ceases to be a glyph of that kind).

  ### Phase 4: Differentiation from Nearby Concepts

  You asked explicitly how this differs from four specific alternatives:

  1.  **Vs. Family Resemblance:**
      *   *Difference:* Family Resemblance relies on *overlapping similarities* (A shares features with B, B with C). **Glyphic Fitness** relies on *systemic equivalence*. A cookie and a scrawl share no features, but they share the same *fitness* for the '/a/' slot in English. The bond is functional, not geometric.
  2.  **Vs. Prototype/Average:**
      *   *Difference:* A Prototype is a "central tendency" (the average of all 'a's you've seen). **Glyphic Fitness** has no center. A radical new 'a' can have high fitness without resembling the average. The standard is not "what is typical" but "what works in the system."
  3.  **Vs. Pure Convention (Traffic Sign):**
      *   *Difference:* A red octagon means "stop" purely by arbitrary rule. You cannot have a "bad" stop sign shape that is still a stop sign. **Glyphic Fitness** is not arbitrary; it is constrained by human perception and the logic of the script. A "bad" 'a' is not just a different rule; it is a *failure* of the form to meet perceptual needs.
  4.  **Vs. Memorized Template:**
      *   *Difference:* A template matches exact coordinates. **Glyphic Fitness** is abstract. It allows for infinite variation (cookie, shadow, scrawl) provided the *structural role* is maintained. It is a capacity for *projection*, not retrieval.

  ### Phase 5: Testing Against Hard Cases

  Here is how **Glyphic Fitness** handles the five specific scenarios you listed:

  1.  **The New Material/Dimension (No stored example):**
      *   *Verdict:* **High Glyphic Fitness possible.**
      *   *Reasoning:* Since Fitness depends on occupying a *Structural Slot* and providing *Perceptual Cues*, not matching a memory, a 4D hologram or a scent-based 'a' works if it distinguishes itself from 'o' and 'e' within that medium and triggers the literate decoding process. The "material" is irrelevant; the "fit" is what matters.
  2.  **The Ambiguous/Flipping Shape:**
      *   *Verdict:* **Variable Glyphic Fitness.**
      *   *Reasoning:* Fitness is contextual. Alone, the stencil shape has low fitness for '/a/' (it looks like 'o'). In text, its fitness for '/a/' spikes because the system resolves the ambiguity. The object hasn't changed; its *fitness relative to the system* has.
  3.  **The Unreadable Script (Cyrillic/Greek to a monolingual English reader):**
      *   *Verdict:* **Zero Glyphic Fitness.**
      *   *Reasoning:* Fitness requires a *Competent User*. Without the acquired capacity to map the mark to the script's system, the mark is just a shape. It cannot occupy a slot you cannot see. This confirms the phenomenon is not in the ink, but in the *relation* between ink and literate mind.
  4.  **The Deliberately Bad 'a' (By a skilled designer):**
      *   *Verdict:* **High Identity, Low Quality Fitness.**
      *   *Reasoning:* This distinguishes the two layers of Fitness. It successfully occupies the *Structural Slot* (we know it's an 'a'), so it has Categorical Fitness. But it fails the *Normative Realization* (it's ugly/lazy), so it has Aesthetic Fitness failure. It remains an 'a', but a "unfit" one. If it becomes *too* unfit, it crosses the boundary and becomes a "mistake" (Zero Fitness).
  5.  **The Alien Alphabet (No '/a/' slot):**
      *   *Verdict:* **Inapplicable.**
      *   *Reasoning:* Glyphic Fitness is script-relative. If the system has no '/a/' slot (e.g., a syllabary where 'a' doesn't exist as a unit), the concept cannot latch on. You cannot judge the fitness of a key for a lock that doesn't exist.

  ### Phase 6: Falsification and Edges

  **What would count as evidence against this account?**
  1.  **Universal Recognition without Literacy:** If you showed your cookie-'a' to a human with no exposure to *any* writing system (a radical isolate) and they identified it as distinct from an 'o' without training, **Glyphic Fitness** would be false. This would suggest a biological "letter module" rather than an acquired systemic competence.
  2.  **Total Instability:** If competent readers could not agree on the "badness" of a clumsy 'a' (i.e., if aesthetic judgment were purely subjective like flavor), the *Normative* component of Fitness would fail. The phenomenon requires inter-subjective agreement on quality.
  3.  **Feature Dependency:** If it turned out there *was* a hidden geometric feature all 'a's shared (e.g., a specific curvature ratio detectable only by AI), then **Family Resemblance** or **Prototype** theory would return, and my claim of "no common features" would be empirically false.

  **Conclusion:**
  You are not dealing with a fuzzy category, a prototype, or a simple convention. You are dealing with **Glyphic Fitness**: a normative, systemic, and perceptual relation between a mark, a script, and a competent user. It explains why the boundary moves (context), why the standard holds (normativity), and why the features don't matter (structural equivalence). It is the measure of how well a form *inhabits* a linguistic function.
