  The rain hit the window at 7:03 AM. Just like last Tuesday. And the Tuesday before that. Elara didn't need to check the date; the burn mark on the toast confirmed it. She opened her notebook. The ink from last week was dry, untouched by the reset.

  She picked up her pen. *Premise 1: To recognize a recurrence, the recognizer must persist across the interval.* She underlined it. *Premise 2: I recognize the recurrence.* She paused, the pen hovering. *Conclusion: Therefore, I persist.*

  It was a transcendental deduction. For the loop to be experienced as abnormal, there had to be a continuous synthesizer of temporal experience. Otherwise, there was no stable 'she' to notice the repetition. Just a series of snapshot selves, each dying at midnight, none the wiser. The 'I' is a necessary condition for the experience of the loop.

  "You're confusing memory with identity," Leo said from the doorway. He was chewing the same piece of gum he'd had yesterday. "Just because the book survives doesn't mean the writer does. That's narrative framing, Elara. Not proof of a substrate. You're building a soul out of syntax."

  "The notebook doesn't reset," she said, tapping the page. "My hand wrote this. My hand wrote this today."

  "Or the hand is part of the furniture."

  Elara looked down at her logic chain. Her stomach tightened. There, in the third line, she had written *conditions for temporal synthisis*. She frowned. She hadn't noticed it last week. She flipped back. Page 41. *Synthisis*. Page 40. *Synthisis*.

  The error was consistent. It was hers.

  "See?" she said, voice trembling. "A machine wouldn't make the same mistake. A reset mind wouldn't carry a specific typo."

  "Or," Leo said, turning back to the kettle, "maybe the notebook is just a prop in a play you've memorized. You know the lines, so you write the typos."

  Elara stared at the word. *Synthisis*. It looked wrong. It looked real. If she was a new person every week, she wouldn't know to misspell it that way. But if she was the same person, why did the certainty feel so much like rehearsal? Like she was copying herself rather than being herself.

  She capped the pen. The rain hit the window at 7:04 AM. She wrote the word again, carefully. *Synthisis*.

  Evidence or script? The ink dried, identical to last week.
