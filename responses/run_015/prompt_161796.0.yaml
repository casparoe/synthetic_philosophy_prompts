  9.  **Final Polish:** Ensure the distinction between "screening off" (statistical) and "exclusion" (metaphysical) is sharp. Ensure the "Residue Report" is clearly labeled. Ensure the "Verdict" is decisive.

  *(Self-Correction on Verdict)*: I need to be careful not to just say "CI is better." The prompt asks if the residue shows PoM trading on a thicker notion or CI being too thin. I should argue that the Exclusion Argument *needs* a thicker notion (production) to get off the ground, but tries to *prove* it using a thinner notion (screening off), and the translation reveals this gap. CI isn't "too thin" for causation; it's just precise about what "causation" means (intervention), whereas Exclusion equivokes.

