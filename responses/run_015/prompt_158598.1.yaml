answer: |-
  **Protocol for Adversarial Collaboration on Evolutionary Psychology**

  **1. Agreed Claims**

  Both camps accept the following premises as the background framework for this collaboration. These claims are intended to exclude trivial agreements and focus on substantive methodological commitments.

  1.  **Natural Selection and Design:** Natural selection is the only known physical process capable of generating complex functional design (teleonomy) without a designer. However, not every trait exhibiting current utility is a direct product of selection for that utility.
  2.  **Validity of Reverse Engineering:** Reverse-engineering reasoning infers function from structure. This logic has successfully identified adaptations in sensory and perceptual systems (for example, colour vision) where input-output mappings are physically constrained. Its validity in higher-order cognitive domains, where multiple structural solutions can achieve similar functional ends, is the primary point of contention.
  3.  **Evidence Standards:** Functional fit between a mechanism and an ancestral problem is necessary but insufficient evidence for adaptation. Stronger confirmation requires converging evidence from comparative phylogenetics, cross-cultural universality, and developmental robustness.
  4.  **Generative Processes:** A trait's current contribution to fitness is consistent with multiple causal histories: direct selection for that trait, exaptation (selection for a different function), incidental by-products of other adaptations, or emergence via domain-general learning rules tuned to local environmental payoffs.
  5.  **Empirical Nature of Dispute:** The disagreement is not about the validity of evolutionary theory itself, but about the relative frequency and detectability of domain-specific adaptations in the human mind. It is resolvable in principle by empirical data regarding developmental plasticity, cross-cultural variation, and neural architecture.

  **2. Disagreements Table**

  | Issue | Camp A (Adaptationist) Position | Camp B (Skeptic) Position | Crux (Deciding Sub-question) | Accepted Evidence Bearing on Crux | A's Predicted Outcome | B's Predicted Outcome | Result Damaging to Own View |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Origin of Cognitive Biases** | Biases reflect fixed, domain-specific modules shaped by ancestral selection pressures. | Biases reflect flexible learning rules or by-products of general intelligence shaped by current/local payoffs. | **Plasticity Window:** Does the bias resist re-tuning under reversed payoff structures in adulthood? | Lab-based reinforcement learning tasks with manipulated payoff matrices. | Bias persists despite contradictory reinforcement (lagged adaptation). | Bias shifts rapidly to match new payoff statistics (online learning). | **A:** Bias shifts completely.<br>**B:** Bias remains fixed despite strong counter-reinforcement. |
  | **Specificity of Mechanism** | Mechanisms are content-rich and specialized for specific ancestral problems (e.g., cheater detection). | Mechanisms are content-poor; apparent specificity arises from interaction with cultural environments. | **Transfer Effects:** Does training on one task transfer to structurally similar but content-distinct tasks? | Cross-task performance correlation after controlled training. | Low transfer between domains (modular encapsulation). | High transfer based on abstract structural similarity. | **A:** High transfer.<br>**B:** Low transfer (encapsulation). |
  | **Burden of Proof** | Design evidence creates a presumption of adaptation until disproven. | The space of possible adaptive stories is too large; null hypotheses (learning/by-product) must be ruled out first. | **Model Fit:** Does an ancestral adaptation model predict data better than a null learning model? | Pre-registered model comparison using novel environment data. | Adaptation model fits significantly better. | Learning model fits equally well or better. | **A:** Learning model fits equally well.<br>**B:** Adaptation model fits significantly better. |

  **3. Protocols, Conceptual Clarifications, and Recommendations**

  **Concrete Empirical Tests**
  To move beyond theoretical stalemate, we propose three pre-registered tests linked to the cruxes above.

  *   **Test 1: The Tuning-Tracking Protocol.** This probes whether a mechanism tracks ancestral statistics or individual reinforcement history. We will utilise a signal detection task involving threat identification. Participants will be exposed to stimuli where the base rate of threat is manipulated against ancestral expectations (e.g., high frequency of modern threats vs. low frequency of ancestral threats).
      *   *Manipulation:* Payoff matrices will be reversed in the laboratory (e.g., false alarms are costly rather than misses).
      *   *Measurement:* Shift in decision criterion ($\beta$) over 1,000 trials.
      *   *Outcomes:* (1) **Lagged Fixity:** Criterion remains biased towards ancestral error costs despite reinforcement (supports A). (2) **Tracking Plasticity:** Criterion shifts to match laboratory payoffs within sessions (supports B). (3) **Null:** No systematic bias exists. (4) **Partial Tuning:** Initial bias exists but extinguishes slowly (requires parameter refinement).
  *   **Test 2: Novel-Environment Prediction.** Camp A must commit in advance to the direction of a bias in an evolutionarily novel setting (e.g., social status signalling via digital metrics) based on ancestral logic (e.g., prestige vs. dominance). Camp B predicts that a domain-general model fitted to participants' own reinforcement history within the novel environment will predict behaviour at least as well as the ancestral model.
      *   *Success Condition:* A wins if the ancestral model explains variance unaccounted for by the learning model.
  *   **Test 3: Matched-Control Requirement.** Any adaptive hypothesis must be run against a structurally adjacent trait that is a plausible by-product. For example, if testing fear conditioning to snakes, the control must be fear conditioning to modern threats (e.g., cars) matched for visual complexity and cultural salience.
      *   *Discriminating Pattern:* A predicts faster conditioning to snakes regardless of cultural exposure; B predicts conditioning rates correlate with local prevalence and cultural messaging.

  **Conceptual Clarifications**
  We acknowledge that portions of this dispute are merely verbal. Specifically, disagreements often arise over the definition of 'adaptation'. If Camp A defines adaptation as 'any trait currently maintained by selection' and Camp B defines it as 'trait shaped by selection for its current function', they may agree on the mechanics but disagree on the label. We agree to reserve 'adaptation' for traits where there is evidence of selection *for* the current function, distinguishing this from 'exaptation' or 'currently useful by-product'.

  Furthermore, Camp B is not a monolith. The **By-Product Wing** argues the trait was never selected for its current function (e.g., reading is a use of visual circuits selected for object recognition). The **Domain-General Wing** argues the trait is selected, but the selection was for learning capacity, not specific content. These wings come apart when testing neural substrates: the By-Product wing predicts no dedicated circuitry, while the Domain-General wing predicts dedicated learning circuitry applicable across domains. We will flag results that distinguish these sub-positions rather than papering over them.

  **Grant Recommendation**
  If the group secures funding for exactly one study, we recommend executing **Test 1 (The Tuning-Tracking Protocol)**. This addresses the central mechanistic disagreement regarding plasticity versus fixity. Both sides should treat a **Partial Tuning** result as informative rather than as fresh ammunition. If the bias resists re-tuning initially but shifts under extreme reinforcement, it suggests a prepared learning mechanism rather than a fixed module or general-purpose learner. This constrains the parameter space for both camps: Camp A must accommodate developmental plasticity, and Camp B must acknowledge constrained priors. Such a result moves the field from debating existence to modelling the precise interaction between ancestral priors and individual learning.
