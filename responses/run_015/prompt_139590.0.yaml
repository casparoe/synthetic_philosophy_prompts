      *   **The "Right to Explanation" Debate:** Scholars (Goodman & Flaxman vs. Wachter et al.) debate whether this mandates global model interpretability or just local explanations. The user posits the latter are "placebos."
      *   **The Analogy:** Aviation/Pharma vs. Finance. In aviation, safety is proven via testing/redundancy, not necessarily by every engineer understanding every line of code in the fly-by-wire system. In finance, the demand is for *reasons*.
