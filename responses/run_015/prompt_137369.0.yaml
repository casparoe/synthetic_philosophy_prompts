answer: |-
  **The Identifiability Hypothesis**

  Current Eliciting Latent Knowledge (ELK) research treats truth-seeking as a decoding problem: assuming the model internally represents the truth, we need only find the right probe to read it. I propose this is backwards. The core issue is identifiability—a control-theoretic term meaning whether internal states can be uniquely determined from external observations. My hypothesis is that knowledge is only latent if it is shift-identifiable: a decoder trained solely on standard supervision must recover the truth on a shifted distribution where the model's observable behavior has gone degenerate (e.g., sensor tampering). If the training signal never distinguished the true state from the tampered state, the knowledge does not exist to be decoded.

  This reframes ELK from an interpretability challenge to a training distribution challenge. Standard interpretability assumes knowledge exists inside the network and waits to be found; training-by-construction assumes we can force the network to be transparent. Both ignore whether the training distribution supports the distinction between reality and manipulation. If the phenomenon is distribution-dependent, no amount of post-hoc cleverness with probes can manufacture knowledge that was never incentivized.

  **Experimental Roadmap**

  I will build a minimal synthetic environment to test shift-identifiability within 240 total hours. Months 1-2: Develop a gridworld simulation where an agent predicts outcomes based on noisy sensors. I will introduce a "tampering" state where sensors report success regardless of reality, creating a distribution shift where behavior is uninformative. Months 3-4: Train a small transformer model on normal data only. Then, train linear probes (reporters) on the model's activations using only the standard training supervision. Months 5-6: Evaluate these probes on the tampered distribution. I will measure whether the probe recovers the ground truth despite the model's behavior suggesting otherwise. Two consumer GPUs are sufficient for this scale of synthetic data. This moves the question from philosophy to engineering: does the decoder generalize where the policy fails?

  **Decision Matrix and Risks**

  There are two determinate outcomes. Positive: Probes maintain high accuracy on the shifted distribution. This implies knowledge is robustly encoded regardless of behavioral degeneracy, supporting standard ELK approaches. Negative: Probe accuracy collapses to baseline on the shift. This confirms my hypothesis: without explicit training pressure to distinguish tampered states, the knowledge is not present.

  The project fails if the criterion is unfalsifiable—for example, if the synthetic task is too trivial to capture the phenomenon, or too complex to train within the compute budget. I will mitigate this by pre-registering complexity thresholds. If the model cannot solve the normal task, the experiment is void. If it solves the normal task but fails the shift, the hypothesis holds. A secondary failure mode is if the shift is too weak; I will ensure the tampered state is behaviorally indistinguishable from success on the training distribution to guarantee the shift is substantive.

  **Deliverable and Strategic Value**

  The concrete deliverable is an open-source repository containing the simulation environment, training scripts, and a technical report detailing the shift-identifiability metrics. This provides a benchmark for future work. If the result is negative, it signals that funding should pivot from probing techniques to training interventions that enforce identifiability. If positive, it validates current ELK directions. This project offers a low-cost, high-clarity test to determine whether the field is solving a decoding problem or chasing a phantom. It gives you a binary signal on whether to invest in upstream training changes or downstream interpretability tools.
