  ### Mentor's Preliminary Assessment

  **Core Tension**
  The central philosophical tension in this project lies between **axiology** (the study of value) and **phenomenology** (the study of experience structure). Standard ethical discourse treats tranquilism as an axiological claim—that peace is valuable and pleasure is neutral. Your insight suggests it is actually a phenomenological claim—that craving structurally distorts all experience. If craving is constitutive of ordinary joy, then a "tranquil joy" is not merely a quieter version of ordinary joy; it is a fundamentally different ontological category. The project must navigate whether this structural difference invalidates standard comparisons between tranquil and non-tranquil states.

  **Risks of Overreach**
  1.  **Historical Drift:** The project could collapse into a comparative religion survey (Buddhism vs. Stoicism vs. Schopenhauer) rather than focusing on the logical structure of the argument.
  2.  **Empirical Distraction:** There is a risk of attempting to validate "attentional gravity" through psychology or neuroscience literature, which violates the conceptual nature of the grant and exceeds your current methodological toolkit.
  3.  **Normative Overcommitment:** You might spend too much time arguing that tranquilism is *true* (defending it as a moral system) rather than analyzing what it *presupposes* (clarifying its mental architecture). The latter is manageable; the former is a lifetime's work.

  ***

  # Research Proposal: The Architecture of Craving
  **Project Title:** Beyond Subtraction: Tranquilism as a Theory of Mental Architecture
  **Applicant:** High School Senior, Advanced Ethics
  **Duration:** Four Months (Summer Independent Study)

  ### 1. Research Question and Problem Statement
  Tranquilism is frequently categorized alongside Negative Utilitarianism or hedonistic theories of welfare. The standard interpretation posits that tranquilism is an axiological claim: it asserts that the absence of craving possesses positive value, while the presence of positive goods (joy, achievement) possesses neutral value. Under this model, the tranquil state is understood as a subset of ordinary experience—a state where suffering is subtracted, leaving a baseline of neutral contentment.

  This project challenges that interpretation. I propose that tranquilism relies on an unexamined phenomenological premise: that craving is not merely one desire among others, but a pervasive "attentional gravity" that structures the qualitative character of all ordinary mental states. If this premise holds, eliminating craving does not simply subtract suffering; it alters the ontology of the remaining mental life. Consequently, the tranquil state is not a quieter version of ordinary contentment but a structurally distinct mode of existence that may be incommensurable with ordinary welfare metrics.

  **Primary Research Question:**
  Does tranquilism presuppose a structural theory of mental architecture wherein craving constitutes the framework of ordinary experience, rather than merely a negative value within it?

  **Secondary Question:**
  If craving is structurally constitutive of ordinary joy, can standard welfare comparisons between tranquil and non-tranquil states be logically sustained?

  ### 2. Gap in Current Discourse
  Standard classroom discussions and introductory ethical texts treat desires as additive units within a welfare calculus. In this framework, removing a negative desire (craving) is mathematically similar to adding a positive pleasure. This approach leaves the architectural claim unexamined. It assumes that "joy without craving" is phenomenologically identical to "joy with craving," minus the agitation.

  By treating tranquilism solely as a value theory, existing literature overlooks the possibility that the *subject* experiencing the joy is fundamentally altered when craving is removed. This project fills that gap by shifting the analysis from value theory to philosophy of mind. It argues that tranquilism cannot be fully understood without addressing how craving shapes the *ontology* of the experiencing self. This distinction separates the project from Negative Utilitarianism (which focuses on the minimization of suffering as a moral imperative) and hedonism (which focuses on the maximization of positive qualia).

  ### 3. Methodology and Timeline
  This project relies exclusively on conceptual analysis and close reading of primary philosophical texts. No empirical lab work, surveys, or psychological data collection will be employed. The method involves reconstructing arguments regarding the nature of desire and attention, testing the "attentional gravity" hypothesis against counter-arguments, and refining the definitions of "craving" versus "desire."

  **Month 1: Conceptual Mapping and Definition**
  *   **Focus:** Distinguish "craving" (tanha, volitional strain) from "desire" (intentional direction) and "pleasure" (positive qualia).
  *   **Activity:** Close reading of foundational texts defining tranquilism and its critiques. Drafting a working definition of "attentional gravity."
  *   **Deliverable:** A 5-page conceptual framework paper defining key terms.

  **Month 2: Structural Analysis**
  *   **Focus:** Investigate the claim that craving structures ordinary experience.
  *   **Activity:** Analyze arguments suggesting that ordinary joy is dependent on prior lack or craving. Test the hypothesis: If craving is removed, does ordinary joy persist, or does it vanish/transform?
  *   **Deliverable:** An annotated argument map showing the relationship between mental architecture and welfare valuation.

  **Month 3: Comparative Evaluation**
  *   **Focus:** Distinguish the findings from Negative Utilitarianism and Hedonism.
  *   **Activity:** Construct thought experiments comparing a "negative utilitarian world" (low suffering) vs. a "tranquil world" (no craving). Determine if the outcomes are distinct based on the architectural hypothesis.
  *   **Deliverable:** A draft of the central argument (10–12 pages).

  **Month 4: Synthesis and Final Polish**
  *   **Focus:** Refine the conclusion and assess implications.
  *   **Activity:** Review for logical consistency. Ensure the distinction between axiological and phenomenological claims is clear. Finalize the paper.
  *   **Deliverable:** Final research paper (15–20 pages) and abstract.

  ### 4. Success and Failure Conditions
  **Successful Conclusion:**
  A successful project will produce a clear conceptual model demonstrating that tranquilism entails a specific view of mental architecture. It will successfully argue that removing craving changes the *kind* of experience remaining, not just the *amount* of suffering. The final paper will clearly distinguish this view from Negative Utilitarianism without needing to prove tranquilism is the "correct" moral theory.

  **Failure Conditions (Ambition Check):**
  *   **Scope Creep:** The project fails if it attempts to resolve whether tranquilism is *true* rather than what it *implies*. Defending the truth of the theory is beyond the scope of a summer project.
  *   ** Definitional Stalemate:** The project stalls if I cannot distinguish "craving" from "desire" with sufficient precision to sustain the architectural argument.
  *   **Empirical Drift:** The project fails if it relies on psychological studies of addiction or attention rather than philosophical conceptual analysis.

  ### 5. Assessment of Scope and Risk
  **Scope:**
  The scope is narrow enough for a four-month independent study because it focuses on a single conceptual hinge (the architectural role of craving) rather than a full defense of a moral system. By limiting the method to textual analysis and conceptual reconstruction, the project remains feasible without institutional lab access.

  **Risk:**
  The primary risk is conceptual density. The idea that mental states have an "ontology" or "structure" is abstract. There is a risk that the final paper may become overly technical or obscure. To mitigate this, I will prioritize clarity in defining metaphors like "attentional gravity" and ensure every claim is tied back to the central research question. Additionally, there is a risk of conflating distinct philosophical traditions (e.g., conflating Buddhist phenomenology with Western meta-ethics). I will mitigate this by focusing on the logical structure of the arguments rather than historical exegesis.

  **Conclusion:**
  This project offers a novel contribution to undergraduate-level ethical discourse by reframing a welfare theory as a theory of mind. It is rigorous, feasible within the timeline, and aligns with the goals of advanced independent study.
