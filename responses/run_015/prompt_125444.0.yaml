answer: |-
  # The "What's Actually Driving This?" Decision Tree

  **Start Here:** Imagine a hiring algorithm. It was trained on old company data, so it learned to prefer candidates who look like hardworking Protestants (punctual, stoic, individualistic). No human manager is actively choosing this anymore; the code does it automatically.

  ### Node 1: The Believer Test
  **Does a value need a living human to believe in it for it to actually cause something?**
  *   **Yes:** Humans are the only ones who can hold values. Go to **Node 2**.
  *   **No:** Values can live in systems, codes, or rules without a believer. Go to **Node 4**.

  ---

  ### Node 2: The Origin Story (Human Path)
  **Your managers believe in this work ethic. Did they adopt it because it felt morally right, or because it looked profitable?**
  *   **Morally Right:** It's about virtue, tradition, or faith. Go to **Node 3**.
  *   **Looked Profitable:** It's about the bottom line. Go to **Leaf: Materialist Reduction**.

  ---

  ### Node 3: The Money Test (Human Path)
  **If sticking to this work ethic started costing the company serious money, would they keep doing it anyway?**
  *   **Yes:** Values trump economics.
      *   🍂 **Leaf: Hard Weberian Value-Causation**
  *   **No:** They'd drop the value to save the business.
      *   🍂 **Leaf: Materialist Reduction**

  ---

  ### Node 4: The Ghost in the Machine (System Path)
  **No human is actively believing this anymore; it's just code. Does the fact that the system keeps running on its own (institutional inertia) count as a real cause?**
  *   **Yes:** The system itself is doing the work. Go to **Node 5**.
  *   **No:** It's just repeating old patterns; the real cause is the history behind it. Go to **Node 6**.

  ---

  ### Node 5: The Hybrid Check
  **Is the algorithm creating new standards based on old values, or just copying the past?**
  *   **Creating New Standards:** The embedded value is actively shaping the future.
      *   🍂 **Leaf: [Unnamed Hybrid]** *(Values embedded in structure without conscious holders)*
  *   **Just Copying:** It's not really causing anything new.
      *   🍂 **Leaf: Epiphenomenal Culture**

  ---

  ### Node 6: The Ultimate Anchor (System Path)
  **If the economy changes, does the culture change with it immediately?**
  *   **Yes:** Economics pulls the strings; culture is just the shadow.
      *   🍂 **Leaf: Materialist Reduction**
  *   **No:** Culture lingers even when it doesn't fit the economics.
      *   🍂 **Leaf: Epiphenomenal Culture**

  ---

  ### ⚠️ A Note on False Precision
  **Can you actually tell the difference between *Materialist Reduction* and *Epiphenomenal Culture*?**
  Probably not. In both cases, culture isn't driving the bus. Whether you call culture a "shadow" (Materialist) or "useless noise" (Epiphenomenal), the outcome looks the same: money wins, values lose. This tree separates them logically, but in the real world, these two leaves are often indistinguishable. Don't sweat the difference too much.
