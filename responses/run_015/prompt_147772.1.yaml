answer: |-
  The precise conceptual issue arising at the boundary of legend and history is the **conflation of toponymic stability with historical veracity**. This problem emerges when the cessation of referential drift—the shift in geographical or institutional anchoring of a proper name across retellings—is mistaken for evidence of historical fact. When a tradition possesses a stable archaeological candidate, the arrest of drift creates an illusion of convergence between text and materiality, obscuring the possibility that the site validates only the memory of the name, rather than the events associated with it.

  In the Arthurian cycle, referential drift functions as a marker of mythic fluidity. The proper name 'Camelot' lacks a fixed geographical referent, shifting across centuries from Caerleon to Winchester, and later to Cadbury Hill. This mobility indicates that the name serves a literary or institutional function rather than a cartographic one. Each retelling re-anchors the court to a location of contemporary political significance, allowing later antiquarians to propose multiple candidates without contradiction. Because the drift remains unchecked by a consensus material site, the tradition is readily categorised as legend; the instability of the signifier signals the absence of a historical signified.

  Conversely, in the tradition of the Trojan War, referential drift is masked by the acceptance of Hisarlik as the stable archaeological candidate for Troy. While earlier centuries saw competing locations proposed, the identification of Hisarlik effectively arrested the geographical drift. However, this stability introduces a risk of circular verification: the site is identified as Troy because the textual tradition suggests a city existed there, and the text is subsequently deemed historical because the city has been found. The drift has not necessarily vanished but has been suppressed by the material gravity of the ruins. The archaeological layers confirm a settlement and destruction, but they cannot confirm the specific narrative agency of the Homeric poems. The name is anchored, but the history attached to it may still be drifting.

  This contrast creates a profound conceptual difficulty in deciding when a legend has become history. If historicity is determined by the stability of the geographical referent, then Troy appears historical and Arthurian Britain does not. Yet, if referential drift reveals the malleability of cultural memory, the arrest of drift at Hisarlik may simply represent a successful act of cultural localisation rather than empirical verification of the war itself. The boundary between legend and history thus collapses into a question of consensus: a legend becomes 'history' not when the narrative is proven, but when the referential drift is halted by the discovery of a site willing to bear the name. Consequently, archaeology may confirm the existence of the place, but it cannot distinguish whether the site anchors a historical event or merely a persistent story.
