prompt: |-
  I'm running a small workshop for econ grads who can do pure-strategy dominance in their sleep but have never actually applied it to mixtures. I want to teach iterated elimination via dominance in mixed strategies — the version where you have to check whether one distribution is entirely inside the convex hull of another's payoff outcomes, not just compare rows. Plan the session for me, not the explanation itself.

  What dependency has to come first: should I start with expected utility over lotteries, or with the geometric idea that a mixed strategy is just a point in a simplex? Then pick the one carrying example — I'm thinking of a three-bidder silent auction where each can randomize over inspection budgets and bid amounts, and there's a "safe" middle bid that actually gets dominated by mixing high and low — but tell me if that example has the right properties and what's wrong with using a plain 2x2 matching-pennies matrix instead.

  Map the misconceptions in order: they will try to check dominance cell-by-cell ignoring probabilities, they will confuse "never a best response" with "strictly dominated", and they will assume iteration stops after one round because they don't see how deleting one mixture reshapes the convex hull for the others. Say exactly where in the sequence I should head off each one.

  Give me one end-of-session check question that forces them to compare two specific mixed strategies without computing full best-response correspondances, and tell me what to openly refuse to cover — I don't want them deriving the linear-programming formulation or touching infinite games.

  Keep it practical, about forty-five minutes, audience has basic calculus but no formal decision theory. There's probably a typo or two in this prompt, sorry.
reasoning: |-
  Here's a thinking process that leads to the suggested workshop plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** Econ grads. Strong on pure-strategy dominance (PSD), weak on mixed-strategy dominance (MSD). Basic calculus, no formal decision theory.
      *   **Topic:** Iterated Elimination of Dominated Strategies (IEDS) in mixed strategies. Specifically, checking if a distribution is inside the convex hull of others' payoffs.
      *   **Constraints:** 45 minutes. Practical. No linear programming derivations. No infinite games.
      *   **Specific Questions to Answer:**
          *   Dependency order: Expected Utility (EU) vs. Geometric Simplex?
          *   Example choice: 3-bidder auction vs. 2x2 Matching Pennies? (Critique the auction example).
          *   Misconception mapping: When to address specific errors (cell-by-cell, NBR vs. Dominated, Iteration depth).
          *   End-of-session check question.
          *   What to explicitly refuse to cover.
      *   **Tone:** Professional, instructional, direct.

  2.  **Determine Dependency Order (EU vs. Geometry):**
      *   *Option A: Expected Utility first.* This is the algebraic foundation. $E[u] = \sum p_i u_i$. It's familiar to econ grads. However, MSD is inherently geometric (convex combinations). Doing it purely algebraically gets messy fast with $3 \times 3$ or larger.
      *   *Option B: Geometry first.* Visualizing payoffs as vectors and mixtures as points in a simplex (or convex hull) makes the concept of "dominated by a mixture" intuitive. If point A is inside the triangle formed by B, C, D, then A is dominated.
      *   *Decision:* Start with **Expected Utility** to ground them in what they know (calculating payoffs), then immediately pivot to **Geometry** to visualize the dominance condition. You can't understand the convex hull argument without understanding that a mixed strategy yields an expected payoff vector. So, EU is the *prerequisite*, Geometry is the *tool*.
      *   *Refinement:* Actually, for *teaching* the concept of MSD, the geometric intuition is the "aha!" moment. But they need to know *why* we care about the average. Let's sequence it: Define Mixed Strategy $\to$ Expected Payoff (EU) $\to$ Geometric Interpretation (Convex Hull).

  3.  **Evaluate the Examples:**
      *   *User's Idea:* 3-bidder silent auction (inspection budgets + bid amounts).
      *   *Critique:* Too complex for 45 mins. Three bidders implies a 3-player game. MSD is usually taught in 2-player games first because the opponent's mixture creates the expectation. In a 3-player game, you have to consider joint distributions of opponents. Also, "inspection budgets and bid amounts" sounds like a continuous strategy space or a very large discrete one. This violates the "no infinite games" constraint and creates cognitive load.
      *   *User's Alternative:* Plain 2x2 Matching Pennies.
      *   *Critique:* Matching Pennies has *no* pure strategy dominance. It also has *no* mixed strategy dominance in the standard zero-sum form (the mixed NE is the only undominated profile). It's bad for teaching *elimination*. You need a game where a strategy *is* dominated by a mixture.
      *   *Better Alternative:* A $3 \times 2$ or $3 \times 3$ game. Specifically, a game where a Pure Strategy is dominated by a *Mixed* Strategy, but not by any other Pure Strategy. This is the core lesson.
      *   *Recommendation:* Use a specific $3 \times 2$ game (3 rows for Player 1, 2 columns for Player 2). It's simple enough to calculate but complex enough to show the phenomenon.

  4.  **Map Misconceptions:**
      *   *Misconception 1: Cell-by-cell comparison.* (Thinking $Mixed > Pure$ means every outcome in the support is better).
          *   *Fix:* Address this immediately when defining MSD. Emphasize *Expected* Payoff.
      *   *Misconception 2: Never a Best Response (NBR) vs. Strictly Dominated.*
          *   *Fix:* Address this after the first elimination round. Clarify that while equivalent in 2-player games, the *mechanism* we are teaching is dominance, not best-response analysis.
      *   *Misconception 3: Iteration stops too early.* (Deleting a mixture doesn't change the hull).
          *   *Fix:* Address this during the "Iterated" phase. Show how removing a column/row shrinks the opponent's hull, potentially making previously safe strategies dominated.

  5.  **Drafting the Session Plan (45 Minutes):**
      *   *0-5 min:* Hook & Definitions (Mixed Strat + EU).
      *   *5-15 min:* The Core Concept (Pure dominated by Mixed). Geometry intro.
      *   *15-25 min:* The Example (Work through the $3 \times 2$).
      *   *25-35 min:* Iteration (How elimination changes the hull).
      *   *35-40 min:* Misconception Check-in.
      *   *40-45 min:* Final Assessment & Boundaries.

  6.  **Developing the Check Question:**
      *   Needs to compare two mixed strategies without full BR calculation.
      *   Needs to test the convex hull intuition.
      *   *Idea:* Give payoff vectors for strategies A, B, C against Opponent's strategies X, Y. Ask if Mix(0.5 A, 0.5 B) dominates C.
      *   *Refinement:* Make it visual or simple arithmetic.

  7.  **Refining the "What to Refuse" List:**
      *   Linear Programming (Simplex method).
      *   Continuous strategy spaces (Calculus of variations).
      *   Equivalence of NBR and Dominated (deep theorem proof).
      *   Weak dominance (stick to strict for clarity).

  8.  **Review against Constraints:**
      *   *Typo in prompt:* "three-bidder silent auction... plain 2x2 matching-pennies". I need to address why the auction is bad and MP is useless.
      *   *Time:* 45 mins is tight. Keep the example small.
      *   *Audience:* Econ grads. They know matrices. Don't over-explain matrix mult. Focus on the *logic* of dominance.

  9.  **Final Polish:**
      *   Ensure the distinction between "Pure dominated by Pure" (which they know) and "Pure dominated by Mixed" (the new thing) is sharp.
      *   Make sure the geometric intuition (Convex Hull) is the centerpiece.
      *   Check the dependency order again. EU *must* come before Geometry because the Geometry represents the EU vectors.

      *(Self-Correction during drafting)*: Wait, the prompt asks about the dependency: "Expected utility over lotteries" OR "Geometric idea". I need to pick one to *start* with.
      *   Argument for EU: It's the definition of payoff.
      *   Argument for Geometry: It's the intuition for dominance.
      *   *Verdict:* Start with **Expected Utility**. You cannot define the payoff of a mixture without it. The geometry is just a representation of the EU. If you start with geometry, they ask "what are these axes?" Answer: "Expected Payoffs." So EU is logically prior.

      *(Self-Correction on Example)*: The user suggested a 3-bidder auction. I need to explicitly tell them *why* that's wrong (3-player games complicate the definition of dominance because you need independent mixtures, etc., and it's too big for 45 mins). I need to suggest a specific $3 \times 2$ matrix instead.

      *(Self-Correction on Misconceptions)*: I need to place the interventions precisely.
      1. Cell-by-cell: When defining MSD (Min 5).
      2. NBR vs Dominated: When discussing why we eliminate (Min 25).
      3. Iteration depth: When doing the second round (Min 30).

      *(Check Question)*: Needs to be solvable in 2 minutes. Compare Mix(A,B) vs C given payoff vectors.

      *(Refusing topics)*: Be firm. No LP, No Weak Dominance, No Continuous.

  10. **Final Structure:**
      *   Dependency Decision.
      *   Example Critique & Recommendation.
      *   Minute-by-Minute Plan.
      *   Misconception Interventions.
      *   Check Question.
      *   Exclusions.

