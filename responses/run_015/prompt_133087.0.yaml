answer: |-
  Here is the session plan, optimized for a 45-minute workshop with econ grads.

  ### 1. The Dependency Decision
  **Start with Expected Utility (EU), then move to Geometry.**
  Do not start with the simplex. Your audience knows calculus and matrices; they do not instinctively see payoffs as vectors.
  *   **Why:** You cannot define the "point" in the geometric space without first defining the coordinate values. Those coordinates *are* the expected utilities against each of the opponent's pure strategies.
  *   **Sequence:**
      1.  Define Mixed Strategy $\sigma_i$ as a probability vector.
      2.  Define Payoff of $\sigma_i$ as the vector of Expected Utilities against each of the opponent's pure strategies ($E[u(\sigma_i, s_{-i})]$).
      3.  **Then** introduce the geometry: "Plot these expected utility vectors. A mixed strategy is a convex combination of these points."

  ### 2. The Example Critique
  **Do not use the 3-bidder auction.**
  *   **Why it fails:**
      1.  **Dimensionality:** A 3-player game requires you to consider the *joint* distribution of the other two players. Dominance in mixed strategies is cleanest in 2-player games where you only average over the opponent's pure strategies. In 3-player games, you risk confusing them with correlated vs. independent mixtures.
      2.  **Complexity:** "Inspection budgets and bid amounts" implies a large or continuous strategy space. You want a small discrete matrix to make the arithmetic trivial so the *logic* shines through.
  *   **Do not use 2x2 Matching Pennies.**
      *   **Why it fails:** In standard Matching Pennies, **nothing is dominated.** No pure strategy is dominated by another pure strategy, and no pure strategy is dominated by a mixture (the mixed NE makes them indifferent). You cannot teach elimination using a game where nothing gets eliminated.
  *   **Use This Instead:** A **$3 \times 2$ Game** (3 strategies for Player 1, 2 for Player 2).
      *   **Property needed:** Player 1's Middle Row is *not* dominated by Top or Bottom individually, but *is* dominated by a 50/50 mix of Top and Bottom.
      *   **Why:** This isolates the specific learning objective (Pure dominated by Mixed) without the noise of a large matrix.

  ### 3. Session Map (45 Minutes)

  **00:00 – 05:00 | Setup & Definitions (The EU Foundation)**
  *   **Goal:** Establish that payoff to a mixture is the weighted average of payoffs to pure strategies.
  *   **Action:** Write a generic $3 \times 2$ payoff matrix. Define $\sigma_1 = (p, 1-p, 0)$.
  *   **Key Line:** "You know how to check if Row 1 beats Row 2. Today we check if Row 1 mixed with Row 3 beats Row 2."

  **05:00 – 15:00 | The Core Mechanism (Pure Dominated by Mixed)**
  *   **Goal:** Demonstrate a specific case where a pure strategy is strictly dominated by a mixture, but not by any other pure strategy.
  *   **Action:** Use the $3 \times 2$ example. Calculate the expected payoff vector for the mixture. Compare it component-wise to the dominated row.
  *   **Visual:** Plot the two opponent columns as axes. Plot the 3 rows as points. Show the dominated row lies *below* the line segment connecting the other two.
  *   **Intervention Point 1 (Cell-by-Cell):** Stop here. Explicitly state: *"Do not check if Top > Middle and Bottom > Middle. Check if $0.5 \times \text{Top} + 0.5 \times \text{Bottom} > \text{Middle}$."*

  **15:00 – 25:00 | Iteration (Reshaping the Hull)**
  *   **Goal:** Show that eliminating a strategy changes the dominance conditions for others.
  *   **Action:** Remove the dominated row. Now look at Player 2. Perhaps a column that was safe is now dominated because the row that justified it is gone.
  *   **Intervention Point 2 (Iteration Depth):** Stop here. Explicitly state: *"Elimination is not a one-shot check. Deleting Row 2 changes the convex hull available to Player 1, which may change the dominance conditions for Player 2's columns. You must re-scan."*

  **25:00 – 35:00 | Conceptual Boundaries (NBR vs. Dominance)**
  *   **Goal:** Distinguish the method from Best-Response analysis.
  *   **Action:** Briefly mention that in 2-player games, "Strictly Dominated" is equivalent to "Never a Best Response."
  *   **Intervention Point 3 (NBR Confusion):** Stop here. Explicitly state: *"We are not finding Best Responses today. We are finding strategies that are bad regardless of what the opponent does. Do not solve for Nash Equilibrium to find dominated strategies; that's circular."*

  **35:00 – 40:00 | The Check Question**
  *   **Action:** Administer the assessment (see below).

  **40:00 – 45:00 | Review & Exclusions**
  *   **Action:** Review answers. State the boundaries of the workshop (see below). Q&A.

  ### 4. Misconception Interventions
  *   **Misconception:** "I compare the mixture's outcomes cell-by-cell against the pure strategy."
      *   **Fix:** **Minute 10.** When calculating the payoff of the mixture, write out the linear combination explicitly: $E[u] = p \cdot u(Top) + (1-p) \cdot u(Bottom)$. Force them to sum before comparing.
  *   **Misconception:** "If it's not a Best Response, it's Dominated."
      *   **Fix:** **Minute 30.** Clarify that while equivalent in 2-player games, the *procedure* is different. Dominance requires a single mixture that beats the strategy against *all* opponent moves. NBR requires checking if there exists *any* belief where it wins. Stick to the dominance definition for this workshop.
  *   **Misconception:** "Once I eliminate one row, I'm done."
      *   **Fix:** **Minute 20.** After the first elimination, immediately ask: "Does this change the status of Player 2's strategies?" Force a second round of checking.

  ### 5. End-of-Session Check Question
  **Provide this payoff matrix for Player 1 (Player 2 has 2 strategies, L and R):**

  | | L | R |
  | :--- | :---: | :---: |
  | **Top** | 6 | 0 |
  | **Mid** | 4 | 3 |
  | **Bot** | 0 | 6 |

  **Question:**
  "Consider the mixed strategy $\sigma = (0.5 \text{ Top}, 0 \text{ Mid}, 0.5 \text{ Bot})$.
  1. Calculate the expected payoff vector of $\sigma$.
  2. Does $\sigma$ strictly dominate **Mid**?
  3. Does $\sigma$ strictly dominate **Top**?"

  **Correct Answer Key:**
  1.  Vector is $(3, 3)$. (Avg of 6,0 and 0,6).
  2.  **Yes.** $(3, 3) > (4, 3)$ is **False**. Wait. $(3, 3)$ vs $(4, 3)$. $3 < 4$. So **No**.
      *   *Correction for the prompt:* I need to ensure the numbers work for the lesson. Let's adjust the numbers in your handout to ensure dominance exists.
      *   *Revised Matrix for Check:*
          *   Top: (8, 0)
          *   Mid: (3, 3)
          *   Bot: (0, 8)
          *   Mix (0.5, 0.5): (4, 4).
          *   Does Mix dominate Mid? Yes ($4>3, 4>3$).
          *   Does Mix dominate Top? No ($4<8$).
  3.  **Instruction to Instructor:** If they try to compare Top vs Mid directly, they fail. They must compute the mixture vector first.

  ### 6. What to Openly Refuse to Cover
  To keep this to 45 minutes and practical, put this list on the board at the start and circle it at the end:
  1.  **No Linear Programming:** We will not formulate dominance as a simplex problem. We will solve small matrices by inspection/arithmetic.
  2.  **No Weak Dominance:** We are strictly dealing with *Strict* Dominance. Weak dominance introduces equilibrium refinement issues we don't have time for.
  3.  **No Continuous Strategies:** We are not integrating over densities. If the strategy space isn't a finite matrix, it's out of scope.
  4.  **No NBR Proofs:** We will not prove the equivalence of "Never a Best Response" and "Strictly Dominated." We take it as a given for 2-player games.
