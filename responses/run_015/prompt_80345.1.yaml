prompt: |-
  I'm in a philosophy of science seminar and I keep getting whiplash from the counterfactual vs. interventionist causation debate — I was reading through the counterfactual literature and it kept feeling like the debate was going in circles, and I think the real problem is I don't have a clear sense of what I should be demanding of any theory of causation before I pick a side. Can you write me the desiderata — the full spec of what an adequate theory of causation actualy has to deliver? I want the list of test cases it has to get right, and for each one the consideration behind why it's a requirement. I'm thinking of the classic ones: preemption (the two-soldiers case where one fires and kills and the other would have fired too), symmetric difference-making (one match igniting two flammable objects), overdetermination (two bullets fired at once, either alone would have killed), causation by absence (the absent match or the absent oxygen), the transitivity problem (the match caused the fire, the fire caused the smoke, so did the match cause the smoke — and by extension did the Big Bang cause everything), and the proportionality problem (is the "flaming match" the cause, or just "the match"?). For each requirement, mark which are non-negotiable and which are really just a preference of one camp.

  The part I most want to see is which pairs of desiderata you suspect can't be jointly satisfied — like whether transitivity and the "causation shouldnt be too promiscuous" requirement (the Big Bang thing) can both be met, or whether proportionality and causation by absence are in tension. And tell me which single requirement does the most work excluding candidate theories. You can briefly score the counterfactual and interventionist camps against the list, but keep the weight on the requirements and their motivating cases, not the scoring. And be honest about where your reasoning is most likely to fail: what argument or consideration would change your mind about which requirements are genuine desiderata versus camp prejudices, and where are you least confident in the list?
