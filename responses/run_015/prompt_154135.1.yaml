  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable decision procedure for classifying legendary narratives (Historical Kernel vs. Historical Echo vs. Structural Analog).
      *   **Target Audience:** Small research group (historical methodology + rationalist epistemic hygiene).
      *   **Constraints:**
          *   Ordered sequence of questions.
          *   No specialist archival access required (operational level).
          *   Specific stopping points/classifications (Probable Kernel, Unrecoverable Kernel, Echo, Analog, False-Positive Risk).
          *   Explicit disambiguation between Kernel, Echo, and Analog.
          *   Concrete tests (anachronisms, negative archaeology vs. positive text).
          *   Flag judgment calls (silence vs. absence of evidence, theological/national bias).
          *   Two worked cases: Arthurian Cycle (expect halt at Analog/Unrecoverable) and Exodus Narrative (expect ambiguity between Echo/Analog/Absent).
          *   Limitations statement (no bibliographies, theology, deep philology/stratigraphy).
          *   Final check question to test user understanding (Kernel vs. Echo).
      *   **Reference Cases for Calibration:** Trojan War (Kernel + Distortion), Arthurian (Silence + Accretion), Exodus (No Itinerary + Collective Memory).

  2.  **Deconstruct the Categories:**
      *   *Historical Kernel:* A specific event happened, and the narrative is a distorted reflection of *that* event. (e.g., Troy VIIa destruction ~ Trojan War).
      *   *Historical Echo:* A later event happened, but the narrative projects it backward onto an earlier, often mythicized setting. (e.g., A medieval battle described as happening in Roman times).
      *   *Structural Analog:* The narrative fits the *conditions* of the era (social, political, environmental) but describes no specific occurrence. It's a "typical story" for that context. (e.g., A flood myth reflecting regular flooding, not *the* flood).

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Phase 1: Anchoring.* Need to establish time and place. If we can't date the narrative or the claimed event, we can't compare them.
      *   *Phase 2: Material Correlation.* Look for physical evidence. Does the dirt match the story?
      *   *Phase 3: Anachronism Analysis.* This is crucial for distinguishing Kernel vs. Echo. If details belong to a later period, is it retrojection (Echo) or just oral drift (Kernel)?
      *   *Phase 4: Silence & Function.* Why is the record silent? Is it theological/national?
      *   *Phase 5: Disambiguation.* The final sorting.

      *Refining the Questions:* They need to be binary or trinary where possible to force a decision path, but acknowledge where judgment is needed.
      *Refining the Stopping Points:* Need to map specific failure modes to the requested classifications (Probable Kernel, Unrecoverable, Echo, Analog, False-Positive).

  4.  **Developing the Worked Cases:**
      *   *Arthur:* Needs to fail early on material correlation or contemporary attestation. The "Echo" test needs to fail (no specific later event clearly projected back, just generic chivalric ideals). Result: Analog/Unrecoverable.
      *   *Exodus:* Needs to struggle with Material Correlation (negative archaeology) but pass Textual Coherence (collective memory markers). The ambiguity lies in whether it's a small group event blown up (Kernel) or a national myth built on Hyksos expulsion memories (Echo) or a foundational etiology (Analog).

  5.  **Addressing Epistemic Hygiene:**
      *   Need to explicitly flag where "absence of evidence" is being treated as "evidence of absence."
      *   Need to flag where national/theological utility biases the preservation of the narrative.
      *   Need to ensure the user knows this isn't about truth/falsity of meaning, but causal generation.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Step 1:* Chronological Lock. Can we date the claimed event and the text?
      *   *Step 2:* The "Dirt" Test. Is there a destruction layer/settlement?
      *   *Step 3:* The Anachronism Test. Do details match the claimed era or the composition era?
      *   *Step 4:* The Silence Test. Is contemporary silence explainable?
      *   *Step 5:* The Function Test. Is this serving a political/religious need?

      *Wait, I need to make sure the distinction between Echo and Kernel is sharp.*
      *   Kernel: Event $E_1$ happens at Time $T_1$. Story written at $T_2$. Story describes $E_1$ (badly).
      *   Echo: Event $E_2$ happens at Time $T_2$. Story written at $T_2$ (or later). Story describes $E_2$ but claims it happened at $T_1$.
      *   Analog: No specific $E$. Story describes typical conditions of $T_1$ or $T_2$.

      *Refining the Arthur Case:* Arthur is tricky. Some argue he is a 5th/6th C. figure (Kernel). Some argue he is a mythologized version of later battles (Echo). Most scholarship leans toward Unrecoverable/Analog due to silence. I will guide the procedure to reflect the prompt's expectation (Halt at Analog/Unrecoverable).
      *Refining the Exodus Case:* The prompt wants to see ambiguity. The procedure shouldn't force a clean "False" but rather highlight the tension between "Collective Memory" (Kernel/Echo) and "Lack of Itinerary" (Analog/False).

  7.  **Finalizing the Structure:**
      *   **Introduction:** Purpose and Scope.
      *   **The Decision Procedure (The Protocol):** 5 Stages.
      *   **Classification Outputs:** Definitions of the 5 outcomes.
      *   **Worked Case 1:** Arthur.
      *   **Worked Case 2:** Exodus.
      *   **Limitations:** What this tool doesn't do.
      *   **Calibration Check:** The final question.

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between "Unrecoverable Kernel" and "Analog" clear?
      *   *Fix:* "Unrecoverable" implies we think *something* happened but the signal is noise. "Analog" implies the story is a template, not a record. The procedure needs a specific branch for "Signal-to-Noise Ratio."
      *   *Critique:* Did I include the "False-Positive Risk"?
      *   *Fix:* Add a specific warning step about "Coincidental Correlation" (e.g., finding a burned city doesn't mean *this* war burned it).
      *   *Critique:* The prompt asks for "judgment calls dressed as procedure."
      *   *Fix:* Explicitly label "Epistemic Warning" boxes within the steps.

  9.  **Final Polish:** Check tone (clinical, methodological, rationalist-adjacent). Ensure all constraints from the prompt are met. (e.g., "no bibliographies," "check question at the end").

  *(Self-Correction on the Arthur Case)*: The prompt says "expect it to halt at analog or unrecoverable kernel and want to see exactly which question stops it and why the echo test fails." I need to make sure the procedure actually *tests* for Echo (projection of later events) and shows why Arthur fails that specific test (no specific later battle identified as the source, just generic accretion).

  *(Self-Correction on the Exodus Case)*: The prompt says "encounter ambiguity between echo, analog, and absent kernel." I need to show the procedure stalling or requiring a "Judgment Call" here because the data is conflicting (Text says Mass Migration; Dirt says No Mass Migration).

  10. **Final Check of the "Check Question":** It needs to distinguish Kernel (Event A caused Story A) from Echo (Event B caused Story A, but claimed as Event A).

