  # ADVERSARIAL COLLABORATION DOCUMENT: DIACHRONIC CONSISTENCY AND PREFERENCE DYNAMICS

  **Parties:**
  *   **Party A:** Diachronic Dutch-Book Defender (Commitment to Intertemporal Stability)
  *   **Party B:** Evidential-Updater (Commitment to Local Optimality and Information Sensitivity)

  **Date:** October 26, 2023
  **Subject:** Normative Status of Intertemporal Preference Reversals and Exploitability

  ## SECTION I: AGREED CLAIMS

  The following propositions represent the common ground established between Party A and Party B. Both parties endorse these claims as formally precise and normatively neutral premises for the subsequent disagreement.

  1.  **Formal Structure of Exploitation:** A "money pump" or Dutch Book is formally defined as a sequence of trades or choices available to an agent such that, if accepted, the agent ends in a state strictly Pareto-inferior to their starting state (e.g., holding the original bundle minus a sum of money), guaranteed across all possible states of the world.
  2.  **Adversarial Condition:** For an exploitation sequence to be executable, an adversary must possess sufficient knowledge of the agent's choice function and decision rule to predict the agent's selections at each node in the sequence with accuracy exceeding chance.
  3.  **Normative Presumption Against Loss:** Both parties accept the prima facie normative principle that rational agents ought to avoid guaranteed net losses of resources (wealth, utility, or welfare) that are not compensated by consumptive benefit or informational gain.
  4.  **Epistemic Justification for Change:** Both parties agree that changes in an agent's belief state (probability distributions over world states) resulting from new evidence legitimately justify changes in preference ordering over actions or bundles, even if such changes expose the agent to potential exploitation relative to their prior self.
  5.  **Non-Epistemic Drivers:** Both parties distinguish between preference changes driven by evidential updating and those driven by non-epistemic factors, specifically including framing effects, cognitive fatigue, computational error, or arbitrary noise. Both parties agree that changes driven solely by error or fatigue are defects in rational agency.
  6.  **Diachronic Identity of the Agent:** Both parties treat the agent as a single persisting entity over the time interval in question for the purpose of evaluating welfare loss. Therefore, a loss of resources at $t_2$ counts as a loss to the same entity that held resources at $t_1$, regardless of changes in the agent's internal preference state.

  ## SECTION II: DISAGREEMENTS TABLE

  | Crux | Party A (Diachronic Dutch-Book Defender) | Party B (Evidential-Updater) | Shared Relevant Feature & Evaluations |
  | :--- | :--- | :--- | :--- |
  | **1. The Gradient Pump**<br>*(Continuous Preference Loop)* | **View:** The agent is diachronically irrational. The smoothness of the transition does not negate the topological closure of the preference path. Since the preference ordering returns to its origin ($\theta = 0 \equiv 2\pi$) while value has been extracted at every infinitesimal step $d\theta$, the path integral of loss is non-zero. This violates the requirement that closed loops in preference space must yield zero net cost.<br><br>**Prediction:** Irrational. | **View:** The agent is rational. At every instant $t$, the agent maximizes expected utility relative to their current preference state $\theta_t$. There is no discrete point where the agent violates transitivity or accepts a dominated option. The extraction is a cost of moving through preference space, not a mark of inconsistency.<br><br>**Prediction:** Rational. | **Feature:** The non-vanishing line integral of the preference vector field along the closed loop $\theta \in [0, 2\pi)$.<br><br>**Party A Evaluation:** Indicates a "curl" in rationality; the field is non-conservative, proving structural defect.<br>**Party B Evaluation:** Indicates a dynamic landscape; the field is locally conservative at every point, proving local optimality. |
  | **2. Endogenous Taste Change**<br>*(Non-Evidential Preference Evolution)* | **View:** Preference changes not driven by external evidence must satisfy a stability constraint to prevent cycles. If an agent prefers $A$ to $B$ at $t_1$, and $B$ to $A$ at $t_2$ without new information about $A$ or $B$, this instability creates vulnerability. Rationality requires preferences to be stable absent evidential updates.<br><br>**Prediction:** Irrational if cyclic. | **View:** Preferences track value, and value-relevant information includes internal state changes (e.g., satiety, habituation, maturation). A reversal driven by genuine hedonic adaptation is not an error but a rational response to the changed value of the goods to the agent.<br><br>**Prediction:** Rational if adaptive. | **Feature:** A case of "Hedonic Adaptation" (e.g., preferring loud music at $t_1$, quiet at $t_2$, then loud at $t_3$ due to physiological cycles, with no new beliefs about the music).<br><br>**Party A Evaluation:** A cyclic preference structure susceptible to pumping; indicates failure of self-governance.<br>**Party B Evaluation:** A rational tracking of fluctuating physiological utility functions; indicates successful self-governance. |
  | **3. Dispositional Vulnerability**<br>*(Counterfactual Exploitability)* | **View:** Rationality is a structural property of the agent's decision mechanism. If the mechanism *would* allow exploitation were an adversary present, the agent is irrational, regardless of whether an adversary actually exists. Susceptibility itself is the defect.<br><br>**Prediction:** Irrational (even in isolation). | **View:** Rationality is assessed by actual outcomes and local reasoning. If no adversary exists, no loss occurs. The mere counterfactual possibility of loss does not render the actual choices irrational, provided each choice was optimal given the information at hand.<br><br>**Prediction:** Rational (in isolation). | **Feature:** A scenario where the agent undergoes a preference reversal in a vacuum (no adversaries possible) vs. a scenario where an adversary actively exploits the reversal.<br><br>**Party A Evaluation:** No normative difference; the structural flaw exists in both cases.<br>**Party B Evaluation:** Significant difference; loss is only normative relevant when actualized by external interaction. |

  ## CONCLUSION: VERBAL VS. SUBSTANTIVE DISAGREEMENT

  Upon reviewing the divergences recorded above, the collaboration identifies a mixed landscape of verbal and substantive disagreement.

  **Verbal Disagreement:** A portion of the conflict stems from differing definitions of "rationality." Party A employs a **structural-coherence conception**, where rationality is a property of the global consistency of the agent's choice function over time. Party B employs a **local-optimality conception**, where rationality is a property of the decision process at the moment of choice. When Party A says "irrational," they mean "structurally vulnerable"; when Party B says "rational," they mean "locally optimal." Clarifying this terminology reduces the apparent conflict regarding the Gradient Pump.

  **Substantive Disagreement:** However, a core substantive disagreement remains regarding the **normative weight of diachronic consistency**. Party A holds that diachronic consistency is a fundamental norm of agency, independent of actual loss. Party B holds that diachronic consistency is merely instrumental—a useful heuristic to avoid loss, but dispensable when preference change is genuinely value-tracking. This is not merely verbal; it reflects a deep divergence on whether the normativity of rational choice derives from the *logic of preferences* (Party A) or the *success of action* (Party B). The Gradient Pump case isolates this substantive core: Party A sees the non-zero path integral as a logical contradiction in the agent's will, while Party B sees it as a legitimate cost of navigating a dynamic value landscape.
