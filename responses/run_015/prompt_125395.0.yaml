          5.  **Justice & Choice Sets:** Reframe the goal.
          6.  **Better Analogies:** Maybe "Gardening" or "Architecture" instead of "Market."

      *   *Key Insight to Highlight:* The GEP often measures *economic* equality (can women work?) not *cultural* equality (do girls think they belong in math?). In poor countries, STEM is a survival ticket. In rich countries, it's a choice. That doesn't mean the choice is free of bias.

