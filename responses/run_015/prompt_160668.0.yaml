answer: |-
  # Facilitator's Guide: The St. Petersburg Session

  **Session Title:** The Price of a Promise
  **Duration:** 90 Minutes
  **Participants:** 15–16 Adults (Non-specialists)
  **Facilitator Role:** Banker / Auctioneer (Neutral, procedural)
  **Co-Facilitator Role:** Scribe / Auditor (Records bids, checks envelope integrity)

  ## 1. Learning Objectives
  By the end of this session, each participant should be able to articulate:
  1.  Why the mathematical expected value of the game is extremely high (or divergent).
  2.  Why that number does not determine what a rational person should pay to play.
  3.  The difference between a single high-risk event and a repeated average (ensemble vs. time).
  4.  Why the physical limits of the "Bank" matter more than the mathematical rules.

  ## 2. Materials & Budget

  **Budget:**
  *   **Book Vouchers:** £250.00 total (denominations of £5 and £10).
  *   **Contingency:** If total winnings exceed £250, all payouts are scaled down proportionally (e.g., if winnings total £500, everyone gets 50% of their win). *This rule is critical and must be announced.*

  **Physical Materials:**
  *   **48 Sealed Envelopes:** (16 participants × 3 Rounds).
      *   Labelled: Round 1 (A–P), Round 2 (A–P), Round 3 (A–P).
      *   Inside: A card stating the number of tails before the first head (e.g., "3 Tails, 1 Head") and the corresponding payout.
      *   *Preparation Note:* Generate these sequences randomly beforehand, but ensure at least two envelopes in the entire set contain a "long run" (e.g., 8+ tails) to trigger the "Doubt" discussion. Cap the printed payout in any single envelope at £1,024 (10 tails), even if the sequence is longer, to simplify calculation.
  *   **16 "Bid Slips"** per participant (for Round 1).
  *   **1 "Bank Fund" Display:** A slide or whiteboard note showing "Total Bank Fund: £250".
  *   **Random Price Generator:** A bag containing 20 folded slips of paper numbered £1 to £20 (for Round 1).
  *   **Pens, Paper, Projector.**

  ## 3. The Rules (To be read verbatim at Minute 0)

  1.  **The Game:** A fair coin is tossed until it lands Heads. If Heads appears on toss 1, the Bank pays £2. On toss 2, £4. On toss 3, £8. The payout doubles for every additional Tail.
  2.  **The Bank:** The Bank has a total fund of **£250** in vouchers for this evening.
  3.  **The Cap:** If the total winnings claimed by all participants exceed £250, all winnings will be scaled down proportionally. (e.g., If total claims are £500, you receive 50% of your win).
  4.  **The Cost:** You do not pay money from your pocket. However, in Round 1, you will write down a price. If that price is higher than a random number drawn by the Bank, you "buy" the ticket at that random price, deducted from your potential winnings.
  5.  **Integrity:** The envelopes contain pre-generated toss sequences. They are sealed. You may audit the shuffling.

  ---

  ## 4. Minute-by-Minute Run-of-Show

  ### **00:00 – 00:10 | Introduction & Setup**
  *   Welcome the group.
  *   Read **The Rules** (above). Emphasize the **£250 Bank Fund** and the **Scaling Rule**.
  *   Distribute Round 1 Envelopes (face down) and Bid Slips.
  *   **Instruction:** "Do not open the envelope yet. This ticket represents *one* play of the game."

  ### **00:10 – 00:25 | Round 1: Private Valuation (The BDM Mechanism)**
  *   **Task:** Each person writes down the maximum amount they would be willing to pay for this single ticket.
  *   **Mechanism:** Explain the incentive clearly:
      *   "I will draw a random price from this bag (£1–£20)."
      *   "If your written bid is **higher** than the drawn price, you play the game. Your cost is the *drawn price*."
      *   "If your written bid is **lower**, you do not play. Cost is £0."
      *   "Therefore, writing your true value is the best strategy. Shading it high risks overpaying; shading it low risks missing a bargain."
  *   **Action:** Collect bids. Draw one random price from the bag (e.g., £7). Announce it.
  *   **Execution:** Anyone who bid £7 or more "buys" a ticket. They open their envelopes. Calculate winnings.
  *   **Record:** Co-facilitator records individual winnings on the board.
  *   **Check:** Sum the winnings. If >£250, announce the scaling factor immediately.

  ### **00:25 – 00:45 | Round 2: Open Bidding (Social Anchoring)**
  *   **Task:** Tables of 4 discuss the game. They must agree on a single "Table Bid" for a *new* ticket.
  *   **Action:** 5 minutes discussion.
  *   **Auction:** Each table announces their bid.
  *   **Twist:** The highest bidding table wins the right to play *one* game collectively (shared winnings). The second highest table wins nothing.
  *   **Play:** The winning table opens one envelope (drawn from the remaining Round 2 set).
  *   **Observation:** Note how the discussion changed the valuation compared to Round 1. Did they anchor on the highest or lowest person? Did they mention the Bank Fund limit?

  ### **00:45 – 01:00 | Round 3: The Bundle (Ensemble vs. Time)**
  *   **Task:** Pricing a bundle of **10 plays**.
  *   **Material:** Distribute Round 3 Envelopes. Inside is not one result, but a slip saying "Total Payout for 10 Games: £X". (Pre-calculated based on 10 random sequences, capped by the Bank Fund logic).
  *   **Instruction:** "This ticket gives you the right to play the game 10 times. The winnings are summed."
  *   **Action:** Private written bids again (same BDM mechanism as Round 1). Draw a new random price.
  *   **Play:** Those who qualify open the envelopes.
  *   **Goal:** Compare the "Price Per Game" in Round 3 (Total Bid / 10) vs. Round 1. Usually, people bid more per game in Round 3 because the risk of zero is reduced.

  ### **01:00 – 01:10 | The "Doubt" Question**
  *   **Instruction:** Put pens down. Look at the board.
  *   **Question:** "In Round 1 or 3, did anyone open an envelope with a long run of Tails (e.g., 8 or more)? If you saw 15 Tails in a row in real life, would you assume the coin is fair, the Bank is honest, or the model is broken? At what number does the game stop feeling like a game and start feeling like a mistake?"
  *   **Action:** Go around the room. Each person gives a number (e.g., "10", "20", "Never"). Record these on the board.

  ### **01:10 – 01:30 | Debrief & Theory**
  *   **Facilitator takes the floor.** No more games.
  *   **Step 1: The Math.** Write the expectation on the board:
      *   $(1/2 \times 2) + (1/4 \times 4) + (1/8 \times 8) \dots = 1 + 1 + 1 \dots = \infty$.
      *   Acknowledge that with the £250 cap, it is not infinite, but it is still mathematically "large" compared to the bids placed (likely £2–£10).
  *   **Step 2: Mapping the Diagnoses.** Connect the evening's events to the theoretical explanations. (See Debrief Script below).
  *   **Step 3: The Unreproducible.** Admit what the room could not do. (See Troubleshooting below).
  *   **Closing:** Ask each person for their one sentence on why the EV diverges but the bid was low.

  ---

  ## 5. Debrief Script & Diagnostic Map

  *Use this section to guide the final 20 minutes. Do not lecture; ask questions first, then supply the label.*

  **1. Diminishing Marginal Utility (The "Need" Argument)**
  *   *Ask:* "In Round 1, why did few of you bid £100, even though the envelope *could* contain £100?"
  *   *Diagnosis:* "The first £10 matters more to you than the next £100. You are pricing the *value to you*, not the *number on the slip*."
  *   *Session Evidence:* Round 1 bids were likely clustered low (£2–£5) despite the high potential upside.

  **2. Bank Solvency (The "Reality" Argument)**
  *   *Ask:* "I announced a £250 fund limit at the start. Did that change your bid?"
  *   *Diagnosis:* "A promise to pay £1,000,000 is worthless if the Bank only has £250. The mathematical rule assumes an infinite bank; the physical room does not have one."
  *   *Session Evidence:* The Scaling Rule. If the sum of winnings exceeded £250, the "infinite" promise was physically truncated.
  *   *Crucial Distinction:* This explains why bids are low *even if* you understand the math. It is a critique of the *model's validity*, not the player's rationality.

  **3. Probability Mishandling (The "Intuition" Argument)**
  *   *Ask:* "How many of you mentally discounted the chance of 10 Tails because it 'never happens'?"
  *   *Diagnosis:* "Humans systematically underweight very small probabilities. We treat 1 in 1000 as zero."
  *   *Session Evidence:* If bids were low because people ignored the tail, this is the cause. (Note: This looks identical to Utility theory in the data; you cannot distinguish them purely from bids).

  **4. Ensemble vs. Time Average (The "Physics" Argument)**
  *   *Ask:* "Compare Round 1 (one play) and Round 3 (ten plays). Did your 'price per game' go up in Round 3?"
  *   *Diagnosis:* "In Round 1, you are a single system at one moment (Time Average). In Round 3, you approximate an average over many trials (Ensemble Average). The Law of Large Numbers stabilizes the payout in Round 3, making the Expected Value more relevant."
  *   *Session Evidence:* If Round 3 bids were higher per-game than Round 1, this distinction worked.

  **5. Model Validity (The "Doubt" Argument)**
  *   *Ask:* "Look at the 'Doubt' numbers on the board. Most of you said 10 or 15 Tails."
  *   *Diagnosis:* "In experimental science, when data refuses to converge or produces outliers beyond physical possibility, we reject the model, not the data. If the coin lands Tails 20 times, the 'fair coin' model is dead. The St. Petersburg game relies on a tail that never occurs in the physical universe."
  *   *Session Evidence:* The "Doubt" numbers. This validates the "Bank Solvency" point but adds a epistemological layer: the game is mathematically sound but physically impossible.

  **What the Activity Cannot Discriminate:**
  *   Tell the group: "Round 1 bids alone cannot tell us if you bid low because you are risk-averse (Utility) or because you think the Bank will fail (Solvency). Both produce the same behaviour. We needed the Bank Cap announcement and the Round 3 Bundle to separate those reasons."

  **What the Activity Cannot Reproduce:**
  *   Tell the group: "We capped the payout at £1,024 per envelope and the Fund at £250. We cannot reproduce the *actual* infinity of the St. Petersburg game. No room can. The 'Paradox' exists only in the mathematical limit. In this room, the EV was finite. The lesson is that the *real world* always imposes a ceiling, rendering the infinite expectation a theoretical ghost."

  ---

  ## 6. Troubleshooting: Predictable Failures

  **1. The "Spoiler" (Someone knows the answer)**
  *   *Risk:* A participant announces, "The Expected Value is infinite, so I should bid everything."
  *   *Absorption:* Do not contradict them. Say: "Mathematically, you are correct. However, remember the Bank Fund rule (£250). If everyone bids everything, the Bank scales down payouts. Your 'infinite' win becomes a £15 voucher. Does that change your bid?"
  *   *Role:* Invite them to be the "Auditor" for the envelope shuffling. Give them a job that uses their knowledge without dominating the discussion.

  **2. The "Joker" (Bids the max voucher budget)**
  *   *Risk:* Someone bids £250 in Round 1 to be funny.
  *   *Absorption:* Treat it as a binding commitment. "If the random price drawn is £20, you are committed to 'buying' at £20. Your potential winnings will be reduced by £20."
  *   *Correction:* Since they don't risk personal money, the penalty is social and opportunity cost. If they win a small amount, their net gain is low. Point this out in the debrief: "A high bid without high confidence just reduces your net return."

  **3. The "Anchor" (Open Bidding dominated by one voice)**
  *   *Risk:* In Round 2, the first speaker says "£5" and everyone agrees.
  *   *Absorption:* Do not stop it. This is data. In the debrief, ask the quieter members: "Did you have a different number in mind before Table A spoke?"
  *   *Lesson:* Use this to illustrate how social consensus overrides individual calculation, which is a real-world factor in market pricing that expected value theory ignores.

  **4. The "Boredom" (Coin tosses take too long)**
  *   *Risk:* Opening envelopes and calculating powers of 2 slows the room.
  *   *Absorption:* This is why we use pre-printed payout cards inside the envelopes. Do not make them calculate $2^8$. The card should say "£256".
  *   *Contingency:* Have a slide up with the payout schedule (£2, £4, £8... £1024) so they can check it quickly.

  ---

  ## 7. Facilitator's Cheat Sheet: The "One Sentence" Goal

  *At the very end, ask each person to turn to their neighbour and say:*
  > "The expected value diverges because the payouts grow faster than the probabilities shrink, but I bid low because [choose one: the Bank cannot pay / the money isn't worth that much to me / I don't trust the long tail]."

  *If they can say this, the session has succeeded.*

  ## 8. Final Note on the "Hard Ceiling"
  You requested a hard ceiling rather than a pretence of infinity. This design implements that via the **£250 Bank Fund** and the **Scaling Rule**.
  *   **Why:** This prevents you from going bankrupt.
  *   **Pedagogical Value:** It transforms the session from a "Math Puzzle" into a "Risk Assessment." It forces the participants to evaluate the *counterparty risk* (the Bank) rather than just the *game mechanics*. This is the most honest way to teach the St. Petersburg problem to non-philosophers: the math is only as good as the institution backing it.
