  Here are two mechanisms I considered and rejected during the brainstorming phase.

  First, I toyed with a **ventilator weaning case**, where a clinician adjusts the settings to a level that cannot sustain life, intending to test lung capacity, but fails to ramp them back up. I rejected this immediately because it violates your constraint against **withdrawing or withholding life-sustaining treatment**. It's functionally identical to the standard "turning off the machine" cases (Foot/Quinn) that dominate the literature, and it leans too heavily on the distinction between active adjustment and passive failure, which collapses into the very debate you want to bypass.

  Second, I considered a **poison/antidote scenario**, where a clinician administers a diagnostic agent that is lethal unless an antidote is given within a specific window, and they fail to give the antidote. I rejected this because it risks violating the constraint against **double-effect-style cases where death is a foreseen side effect of something good**. If the diagnostic is the "good," the death looks like a traded-off risk. I needed a mechanism where the death isn't a side effect of the *goal*, but a certain consequence of the *process* itself, decoupled from the utility of the intervention.

  ***

  ### The Case: The Adenosine Challenge

  A patient presents with unstable supraventricular tachycardia, conscious but deteriorating. The attending clinician decides to administer adenosine to reset the heart's electrical pathway, a standard procedure that guarantees fifteen seconds of total asystole (cardiac flatline) before a normal rhythm resumes. Protocol dictates that external pacing pads must be activated and set to "standby" prior to injection to bridge this guaranteed pause. The clinician injects the adenosine but is distracted by a alarm elsewhere and fails to activate the pacing pads. The patient's heart stops as pharmacologically certain, does not restart within the window, and the patient dies. There is no equipment malfunction; the death results solely from the injection combined with the failure to activate the bridge.

  ***

  ### Meeting the Spec

  This case generates the required two-way pressure without relying on the standard "vegetative state/ventilator" family.
  *   **Pressure to say Killed:** The clinician performed a physical act (injection) that introduced a lethal threat (asystole) that was not present before. Without the clinician's agency, the heart was beating (however poorly). The clinician stopped the heart.
  *   **Pressure to say Allowed:** The clinician was engaged in a rescue attempt. The asystole is a known, accepted, and temporary mechanism of the cure, not a malicious attack. The death occurred because the clinician *failed to act* (omission) to bridge a gap they were authorized to create. They didn't "make" the patient die; they failed to keep them alive during a procedure.

  ### The Checks

  **(1) The Threat-Source Question:**
  *   *Verdict:* **Killing.**
  *   *Reasoning:* The lethal threat (asystole) originates entirely in the agent's own agency. It does not exist in the environment or the patient's pathology prior to the injection. The agent is the source of the stoppage.

  **(2) The Delete-the-Agent Baseline:**
  *   *Verdict:* **Killing.**
  *   *Reasoning:* If this clinician had never existed and no one covered the role, the patient remains in tachycardia. They might die later from the arrhythmia, but they do not die *now* of asystole. The specific death is counterfactually dependent on the agent's presence and action.

  **(3) Present-Dependence:**
  *   *Verdict:* **Allowing.**
  *   *Reasoning:* The death counterfactually depends on what the agent *didn't* do at the moment of crisis (activate pads). The injection happened earlier; the lethal moment is defined by the absence of the pacing current. The immediate cause of death is the lack of support, not the presence of the drug (which was metabolically neutral aside from the pause).

  **(4) The Continuity Test (My Addition):**
  *   *Verdict:* **Ambiguous (The Source of Pull).**
  *   *Reasoning:* If we view the injection and the pacing as one continuous procedural unit, the failure is a botched execution of a single act (Killing via negligence). If we view them as two distinct events (Induction then Rescue), the failure is a refusal to rescue (Allowing). The case forces us to decide whether the "procedure" is one moral atom or two.

  ### The Single Feature Doing the Work

  The work is being done by the **certainty of the intermediate state**. Because the asystole is *guaranteed* by the drug (not probabilistic), the clinician isn't just "risking" death; they are engineering a temporary death to prevent a permanent one. This makes the omission (no pacing) feel like a completion of the killing act, while the therapeutic intent makes it feel like a failed rescue.

  **If you remove this feature:** If the drug only *risked* asystole (probabilistic), the case collapses into standard negligence or double-effect. The certainty forces us to acknowledge the clinician *stopped the heart*, which is usually the definition of killing, even if they meant to restart it.

  **The "Letting Die" Attack:** A proponent of the distinction would argue that the clinician merely failed to fulfill a duty of care during a treatment. They would claim the "baseline" is not "a beating heart" but "a patient undergoing treatment." Relative to the treatment baseline, the clinician omitted a necessary step. They didn't kill the patient; they failed to save them from the treatment's requirements.

  ### Constraints and Cheating

  **Hardest Constraint:** The prohibition on **double-effect-style cases**. It is exceptionally difficult to construct a medical intervention that is lethal if incomplete without it looking like a "risk accepted for a greater good." I had to ensure the death wasn't the *trade-off* (e.g., "we risk stopping the heart to save them") but the *mechanical certainty* of the process ("the heart *will* stop, we *must* bridge it"). This walks a fine line.

  **Did I Cheat?** I may have quietly cheated on the **"no withholding life-sustaining treatment"** constraint. Activating pacing pads is technically "life-sustaining treatment." However, I relied on the distinction between *chronic* sustenance (ventilators/feeding tubes) and *procedural safety measures*. If the seminar accepts pacing pads as part of the "ventilator family," the case fails. I argue it is distinct because it is transient and procedural, not sustenance-based, but a sharp student will catch this.

  ### Discussion Question

  "If the doing/allowing distinction is actually two separate distinctions (causal vs. normative) wearing a trenchcoat, does this case tear the coat open? Specifically: does the clinician's prior authorization to create the threat normalize the subsequent omission, or does the causal origin of the threat锁定 the description as killing regardless of intent?"
