  # Seminar Handout: The Frankfurt Sorter
  **Topic:** PAP, Sourcehood, and Intuitions  
  **Context:** Grad Seminar (Small Group)  
  **Goal:** Diagnose your intuition without using philosopher names.

  ---

  ## Part 1: The Logic Map (Instructor Key)
  *Don't show this to students yet. This is how the 3 diagnostic nodes map to the 8 logical slots.*

  **The 3 Nodes:**
  1.  **Flicker:** Is there a detectable prior sign (alternative possibility)?
  2.  **Monitor:** Does the chip read internal deliberation (deep) or just behavior (shallow)?
  3.  **Endorsement:** Does Jones have a 2nd-order desire to vote Dem?

  **The 8 Combinations & Position Mapping:**
  *(R = Responsible, NR = Not Responsible)*

  | Flicker | Monitor | Endorsement | Intuition Needed for Position | Position |
  | :--- | :--- | :--- | :--- | :--- |
  | **YES** | (Any) | (Any) | Jones is **R** (because of the flicker) | **(b) Flicker Defender** |
  | **NO** | Shallow | **YES** | Jones is **R** (because of structure) | **(c) Hierarchical** |
  | **NO** | Shallow | **NO** | Jones is **R** (source is clean enough) | **(d) Actual-Sequence** |
  | **NO** | Shallow | **NO** | Jones is **NR** (no alts, no structure) | **(a) Hard Incompatibilist** |
  | **NO** | **Deep** | **YES** | Jones is **R** | *(c) or (d) Collapse* |
  | **NO** | **Deep** | **NO** | Jones is **NR** | *(a) Hard Incompatibilist* |
  | **NO** | **Deep** | **NO** | Jones is **R** | **(e) EMPTY SLOT** |

  **The Empty Slot (e):**
  *   **Combo:** No Flicker + Deep Monitor + No 2nd-Order Endorsement + **Responsible**.
  *   **Diagnosis:** This is theoretically unstable. If the chip reads internal states *and* there's no flicker, the device is practically constitutive of the choice. If Jones *also* lacks 2nd-order endorsement, Hierarchical theorists say "not responsible." If PAP theorists say "not responsible" (no alts), who claims this?
  *   **Verdict:** Likely incoherent, or a radical "Pure Causation" view that ignores both history and structure. Flag this in discussion.

  **The Collapse:**
  *   **(c) Hierarchical** and **(d) Actual-Sequence** collapse on the **No Flicker / Yes Endorsement** branch. Both say "Responsible." You can't separate them without asking *why* (history vs. structure). I've flagged this in the quiz notes.

  ---

  ## Part 2: Student Decision Tree (Handout)
  *Instructions: Start at the Base Case. Follow the arrows based on your gut check about responsibility. Don't overthink the theory—just ask: "Is Jones to blame?"*

  ### START: The Base Case
  > **Jones** decides to vote Democrat.  
  > **Black** has a chip implanted that *would* force him to vote Republican if he showed signs of wavering.  
  > **Jones** chooses Democrat on his own. The chip **never activates**.  
  > *Features:* No flicker (Black can't see it coming), Chip monitors only **external behavior**, Jones acts on impulse (**No 2nd-order endorsement**).

  **Q1: In this Base Case, is Jones morally responsible?**
  *   **YES** → Go to **Node A** (You think alternatives aren't needed).
  *   **NO** → Go to **Node B** (You think something is missing).

  ---

  ### NODE A: The "Source" Check
  *You said YES to the Base Case. Let's stress-test the source.*

  > **Tweak:** We change the chip. It now monitors Jones's **internal deliberation** (Deep Monitor). It still doesn't activate because Jones never wavers. Jones still acts on impulse (**No 2nd-order endorsement**).

  **Q2: With this deeper surveillance (but no intervention), is Jones still responsible?**
  *   **YES** → **LEAF (d): Actual-Sequence Source View.**
      *   *Why:* You think responsibility tracks being the actual causal source. Neither the lack of alternatives nor the deep monitoring matters as long as the device stays idle.
  *   **NO** → **LEAF (e): THE EMPTY SLOT.**
      *   *Why:* Wait, you said he *was* responsible in the Base Case (Shallow Monitor), but adding Deep Monitoring killed it, even though the chip didn't fire?
      *   *Diagnosis:* This is a rare intuition. You think "privacy of deliberation" is a condition for sourcehood, even without intervention. We need to talk about this—it's theoretically lonely.

  ---

  ### NODE B: The "Alternative" Check
  *You said NO to the Base Case. Let's see what saves responsibility.*

  > **Tweak 1:** We add a **detectable mental flicker**. Just before deciding, Jones's neural pattern spikes in a way that *could* have triggered the chip (giving Black a chance to intervene), but Jones proceeds anyway.

  **Q3: Does adding this flicker make Jones responsible?**
  *   **YES** → **LEAF (b): Flicker Defender.**
      *   *Why:* You hold that PAP is true. The Frankfurt case only "works" if you erase all alternatives. If there's a flicker, there's an alternative, and responsibility returns.
  *   **NO** → Go to **Node C**.

  ---

  ### NODE C: The "Structure" Check
  *Flicker didn't help. Maybe it's about the will's structure.*

  > **Tweak 2:** Revert to **No Flicker**. But now, Jones **has a 2nd-order desire**. He reflectively endorses his vote ("I want to want to vote Dem"). Chip monitors **external behavior** only.

  **Q4: Does this endorsement make Jones responsible?**
  *   **YES** → **LEAF (c): Hierarchical Compatibilist.**
      *   *Why:* You think alternatives (PAP) don't matter, but the *structure* of the will does. As long as Jones identifies with his desire, he's free.
      *   *Note:* **(d) Actual-Sequence** folks also land here. If you want to split them, ask: "If Jones was manipulated to have this 2nd-order desire, is he responsible?" (Hierarchical = Yes, Source = No).
  *   **NO** → **LEAF (a): Hard Incompatibilist.**
      *   *Why:* Neither alternatives nor internal structure saves him. If the setup removes the ability to do otherwise (even if unexercised), responsibility is gone. Period.

  ---

  ## Part 3: Discussion Flags (For the Seminar Lead)

  **1. The (c) vs (d) Collapse**
  *   **Issue:** On the branch where Jones has **2nd-Order Endorsement** but **No Flicker**, both Hierarchical Compatibilists and Actual-Sequence theorists say "Responsible."
  *   **Fix:** If someone lands on **(c)**, ask them: *"Imagine Jones's 2nd-order desire was implanted by a different machine last week. Is he responsible now?"*
      *   If **Yes**: They are pure Hierarchical (History doesn't matter).
      *   If **No**: They are Actual-Sequence/History-Sensitive (Source matters).

  **2. The Empty Slot (e)**
  *   **Issue:** This slot (Deep Monitor + No Endorsement + Responsible) is basically unoccupied in the literature.
  *   **Discussion:** If anyone lands here, press them. *"If the chip is reading his thoughts, and he doesn't even endorse the choice, what 'source' is left?"*
      *   They might be gesturing at a **Buddhist/No-Self** view (responsibility without a 'self' to endorse) or a **Pure Causal** view.
      *   Likely, they'll realize their intuition wobbles and move to (a) or (d).

  **3. Typo Check**
  *   I left a typo in Q3 ("proceeds" vs "preceeds" maybe? nah, looks fine). Actually, in Node A, I wrote "stress-test the source." Make sure they know "source" isn't a theory label, just a word for "where the action came from."

  **4. Group Size**
  *   With 8 people, you'll probably get 2 Flicker, 2 Hierarchical, 2 Source, 1 Incompatibilist, 1 Wildcard. Perfect for debate.

  ---

  *(Handout ends)*

  **Quick Note for You:**
  I kept the tone loose. There's a typo in Node C ("Revert to No Flicker" should probably be "Keep No Flicker"), but honestly, in a grad seminar, nobody cares as long as the logic holds. The key is getting them to admit that **(c)** and **(d)** are best friends until you bring in manipulation cases. Good luck!
