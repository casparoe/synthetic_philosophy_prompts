  also flag any pair of leaves your tree genuinely cant seperate—like maybe c and d collapse on some branch? be honest about it.

  this is for in-class sorting, not grading, and it should feel like they are diagnosing their own view not naming a philosopher. write casual, a typo or two is totally fine.
