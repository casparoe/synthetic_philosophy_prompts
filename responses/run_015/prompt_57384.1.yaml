  ## Limitations of the Medium (What You Must Supply)

  A paper-and-pencil game cannot reproduce the following, so you must verbally bridge the gap during the debrief:

  1.  **Continuous vs. Discrete:** The game uses 4 decimal places. Real chaotic systems (like weather) have infinite precision.
      *   *Your Job:* Explain that 4 decimals is a stand-in for "measurement precision." If we had 100 decimals, the horizon would just move further out, not disappear.
  2.  **Speed:** Computers iterate chaos millions of times a second. Paper takes minutes.
      *   *Your Job:* Emphasize that in real systems (orbits, fluids), these 10 steps happen in milliseconds. The horizon isn't about "how long it takes to calculate," it's about "how far into the future we can see."
  3.  **True Randomness:** Dice are technically deterministic (physics determines the roll), but effectively random.
      *   *Your Job:* Don't get bogged down in quantum mechanics. Accept "practical randomness" for the sake of the statistical lesson.

  **Final TA Tip:** When collecting the Game 1 bets, make a show of sealing them in an envelope or holding them up. "These are locked in. No changing your mind when you see Step 6." This heightens the tension when they realize they were wrong.
