answer: |-
  # Activity: The Horizon & The Heap
  **Time:** 75 minutes  
  **Class Size:** 24 students (6 tables of 4)  
  **Materials:** Printed handouts (one per student), 24 pencils, 4 pairs of dice (one pair per table).  
  **Grading:** 10 "Participation Points" available. 5 from Game 1, 5 from Game 2.

  ---

  ## Part 1: The Deterministic Trap (Chaos)
  **Concept:** A system can be fully rule-bound (deterministic) yet unpredictable beyond a specific time horizon due to sensitivity to initial conditions.

  ### The Rules (Handout Section A)
  1.  **The Rule:** You are a machine. Your function is $f(x) = 2x$. If the result is $1.0$ or greater, subtract $1.0$ (drop the integer). Keep **4 decimal places** at every step. Round normally (0.00005 rounds up).
  2.  **The Seed:** Your table has been assigned a **Starting Value** (see Handout).
  3.  **The Task:**
      *   Calculate Steps 1 through 5.
      *   **STOP.** Look at your neighbors. Are your numbers still similar?
      *   **The Bet:** Based on your Step 5 number, bet 5 Points on whether your **Step 10** number will be **HIGH (> 0.5000)** or **LOW (< 0.5000)**.
      *   Record your bet. Do not change it.
      *   Calculate Steps 6 through 10.
      *   Reveal the outcome.

  ### The Handout Numbers (Crucial)
  *Do not let tables know they have different seeds until the debrief.*
  *   **Tables 1, 3, 5:** Starting Value = `0.3330`
  *   **Tables 2, 4, 6:** Starting Value = `0.3335`

  *(Why these numbers? The difference is 0.0005. The map doubles error every step. After 10 steps, the divergence is $0.0005 \times 2^{10} \approx 0.51$. This guarantees the two groups land on opposite sides of the 0.5 threshold.)*

  ### Payoff Scheme (Game 1)
  *   **Correct Bet:** +5 Points.
  *   **Incorrect Bet:** 0 Points.
  *   **Expected Outcome:** Half the class (Tables 1, 3, 5) will get one result; the other half (Tables 2, 4, 6) will get the opposite. Since they all saw "similar" numbers at Step 5, roughly 50% of the class will lose points despite following the exact same deterministic rule.

  ---

  ## Part 2: The Random Certainty (Statistics)
  **Concept:** A system with genuine randomness in every component becomes highly predictable when viewed in the aggregate (Law of Large Numbers).

  ### The Rules (Handout Section B)
  1.  **The Tool:** Use the 2 dice provided at your table.
  2.  **Round 1 (Individual):** Each student rolls 2 dice once. Sum the pips.
      *   **The Bet:** Bet 5 Points on your *exact* sum (e.g., "I will roll a 7").
      *   **Outcome:** Almost everyone loses. (1/36 chance).
  3.  **Round 2 (Aggregate):** The table rolls 8 dice total (2 per student). Sum all 8 dice.
      *   **The Bet:** The table collectively bets 5 Points (shared) that the **Total Sum** will be between **24 and 32**.
      *   *(Math: Expected value of 1 die is 3.5. 8 dice = 28. Standard deviation is $\approx 2.4$. The range 24–32 covers $\pm 1.6\sigma$, capturing ~90% of outcomes.)*
      *   **Outcome:** The table almost certainly wins.

  ### Payoff Scheme (Game 2)
  *   **Round 1:** Individual wins get +5 Points (rare).
  *   **Round 2:** If table sum is 24–32, everyone at the table gets +5 Points.
  *   **Expected Outcome:** Most students end Part 2 with 5 points, despite the process being "random."

  ---

  ## Minute-by-Minute Timeline

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Setup** | Hand out sheets. Explain point system (grade kicker). Emphasize "No phones, no calculators." |
  | **05-25** | **Game 1: Determinism** | Students calculate Steps 1-5. **Collect Bets** at min 15. Students calculate 6-10. Reveal results at min 25. |
  | **25-30** | **Transition** | Collect Game 1 sheets. Distribute dice. Reset mood. |
  | **30-50** | **Game 2: Randomness** | Round 1 (Individual rolls/bets). Round 2 (Table aggregate roll/bet). Record wins. |
  | **50-70** | **Debrief Discussion** | Map the games to the philosophical concepts (see below). |
  | **70-75** | **Wrap Up** | Collect sheets. Remind them points will be posted. |

  ---

  ## The Debrief Script (Mapping the Experience)

  **1. The Deterministic Horizon (Game 1)**
  *   **Ask:** "Tables 1, 3, 5: What was your Step 10 result? Tables 2, 4, 6: What was yours?"
  *   **Reveal:** One group will be mostly High (>0.5), the other mostly Low.
  *   **The Point:** "You all followed the *exact same rule*. There was no dice, no randomness. Yet, you could not predict the future beyond Step 5. Why?"
  *   **Concept:** **Sensitivity to Initial Conditions.** The tiny difference in the starting seed (0.0005) was magnified by the rule. This is the **Predictability Horizon**. Laplace's Demon (a being who knows all rules and positions) fails not because the universe is random, but because measurement is never perfect.
  *   **Connection:** Weather forecasting. We know the physics (deterministic), but we can't measure every air molecule (initial conditions), so the forecast breaks down after ~10 days.

  **2. The Statistical Aggregate (Game 2)**
  *   **Ask:** "Who guessed their exact dice sum in Round 1? (Few hands). Who won the Table Bet in Round 2? (Most hands)."
  *   **The Point:** "In Round 1, the process was random, so the specific outcome was unknowable. In Round 2, the process was *still* random, but the *average* became certain."
  *   **Concept:** **Emergent Predictability.** Randomness cancels itself out in large numbers.
  *   **Connection:** Thermodynamics. We can't predict where one gas molecule will be (random), but we can predict the pressure and temperature of the room perfectly (aggregate).

  **3. The Synthesis**
  *   "Determinism does not guarantee predictability (Game 1). Randomness does not guarantee unpredictability (Game 2). Your intuition that 'Rules = Predictable' and 'Random = Unpredictable' is wrong. It depends on the *time horizon* and the *scale of observation*."

  ---

  ## Troubleshooting: What Goes Wrong & How to Fix It

  **1. The Arithmetic Drag (Most Likely)**
  *   **Problem:** Doubling 4-digit numbers and subtracting 1 is tedious. Students will spend 20 minutes on Step 3 and rush the bet.
  *   **Fix:** Walk around during the first 5 minutes. Do one example on the board: $0.8123 \times 2 = 1.6246 \to 0.6246$.
  *   **Contingency:** If they are too slow at minute 15, tell them: "Stop calculating. Place your bet based on the *trend* you see in Steps 1-4." This actually reinforces the lesson (extrapolating from incomplete data).

  **2. The "You Trick Us" Cynicism**
  *   **Problem:** Students will claim they lost Game 1 because of math errors, not chaos.
  *   **Fix:** During the debrief, ask a Table 1 student and a Table 2 student to put their Step 1 numbers on the board. Show the class the tiny difference ($0.6660$ vs $0.6670$). Then show Step 10 ($0.2...$ vs $0.8...$). The math speaks for itself. Acknowledge rounding errors: "Even your rounding *is* the measurement error. In the real world, your instrument rounds too."

  **3. The Dice Shortage**
  *   **Problem:** You don't have 8 dice per table.
  *   **Fix:** Use a **Random Digit Table** printed on the handout. Tell them: "Read two digits at a time. 01-50 is Low, 51-99 is High." Or simply have them roll 2 dice 4 times each to simulate 8 dice.

  **4. The "Same Seed" Leak**
  *   **Problem:** A student from Table 1 tells Table 2 their seed before the bet.
  *   **Fix:** Print the seeds on colored paper (e.g., White for Group A, Yellow for Group B) and say "Keep your sheet face down." Or, simply assign seeds verbally by Table Number when you start.

