          4.  Conclusion: Does the "no reselection, ever" ban survive? If not, propose a better analogy or argue for direct defense.
      *   **Tone/Audience:** Moderately skeptical commission members voting next month. No jokes, no citations/references (user will add those). Professional, analytical, persuasive but critical.

  2.  **Deconstruct the "Chamber as Jury" Analogy:**
      *   *Goal:* To legitimize sortition (Use 1) and justify single terms (Use 2).
      *   *Mapping:* Need to align legal trial components with legislative components.
