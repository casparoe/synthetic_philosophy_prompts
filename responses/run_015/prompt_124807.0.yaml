      *   *Incidental:* Unanimity, sequestering, specific legal rules of evidence.

  3.  **Address the Disanalogies (The "Circling" Problems):**
      *   *The Charge Problem:* Juries answer questions set by judges/law. Legislators set their own agenda. *Impact:* Damages both uses, but specifically Use 1 (legitimacy/role definition). If they set the agenda, they are more like a sovereign body than a fact-finder.
      *   *The Filter Problem:* Voir dire removes bias/knowledge. Sortition wants descriptive representation (including bias/experience). *Impact:* Damages Use 1 (legitimacy of representation). A "purified" jury isn't a "representative" sample in the political sense.
      *   *The Return Problem:* Jurors go back to normal life immediately. Legislators need a career after 6 years. *Impact:* Damages Use 2 (term limits). The incentive structure is different. A juror doesn't need a future job; a legislator does. This creates a "lame duck" or "corruption risk" problem that the jury analogy ignores.

  4.  **Address the Rival Analogy (Legislator as Judge):**
      *   *Claim:* Career legislator = Judge; Term-limited = Juror.
      *   *Critique:* Judges are experts, appointed/elected for longevity, interpreters of rules. Politicians are creators of rules. This conflates *adjudication* with *legislation*. It doesn't help the sortition argument; it confuses the institutional role.

  5.  **Evaluate the Conclusion (No Reselection, Ever):**
      *   Does the analogy support a 6-year single term?
      *   *Jury service:* Days/Weeks.
      *   *Chamber service:* 6 Years.
      *   *Gap:* 6 years is a career segment, not a civic duty interruption. The "return to ordinary life" is much harder.
      *   *Verdict:* The analogy *fails* to support the specific 6-year ban effectively. It supports *temporary* service, but not necessarily *long, single* terms without re-eligibility.
      *   *Recommendation:* Defend the ban on direct grounds (preventing careerism, ensuring turnover) rather than leaning on the jury analogy, or adjust the term structure to fit the analogy better (shorter terms). However, since the design is already set (6 years), the analogy is a liability.

