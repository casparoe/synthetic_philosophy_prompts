answer: |-
  **Memorandum to the Governance Commission**
  **Subject:** Audit of the "Chamber as Jury" Analogy in Draft Proposal
  **Date:** October 26, 2023

  **Purpose**
  This audit examines the central analogy underpinning our draft proposal: that a legislative chamber chosen by lot functions as a jury. The draft relies on this comparison for two distinct purposes. First, to establish democratic legitimacy (Use 1). Second, to justify a single, non-renewable six-year term (Use 2).

  While the analogy is rhetorically effective, it conceals structural differences that threaten the stability of the proposal. The following analysis maps the correspondence, isolates the disanalogies, and assesses whether the conclusion—a permanent ban on reselection—survives scrutiny.

  ### 1. Mapping the Analogy

  The table below sets out the correspondences between criminal trial procedure and the proposed chamber. The final column distinguishes between features essential to the concept of a jury (load-bearing) and features that are merely procedural artifacts of the legal system (incidental).

  | Feature | In the Jury System | In the Proposed Chamber | Load-Bearing for Legitimacy? |
  | :--- | :--- | :--- | :--- |
  | **Selection Method** | Random selection from citizen roll. | Random selection from citizen roll. | **Yes.** This is the core claim to equality. |
  | **Expertise** | Laypeople; no special knowledge required. | Laypeople; no special knowledge required. | **Yes.** Establishes the "common sense" mandate. |
  | **Task** | Determine facts/verdict based on evidence. | Determine laws/policy based on testimony. | **Yes.** Defines the scope of authority. |
  | **Duration** | Days or weeks. | Six years. | **No.** (But critical for the *term limit* argument). |
  | **Agenda (The Charge)** | Set by the judge/prosecutor; jury answers specific questions. | Set by the chamber itself or standing rules. | **No.** (This is a fundamental disanalogy). |
  | **Deliberation** | Sequestered, private, focused on one case. | Public/Private mix, focused on many issues. | **No.** Incident to legal secrecy, not legitimacy. |
  | **Decision Rule** | Unanimity or supermajority. | Majority or supermajority. | **No.** Mathematical threshold is incidental. |
  | **Excusal** | Hardship/Conflict of interest removes members. | Hardship/Conflict removes members. | **Yes.** Ensures capacity to serve. |
  | **Post-Service** | Return to anonymity; no ongoing role. | Return to private life; banned from reselection. | **Yes.** (For the term limit argument). |
  | **Oversight** | Judge controls procedure and admissibility. | Internal rules/staff control procedure. | **No.** (But creates the "Charge Problem"). |

  **Assessment of the Map:**
  The load-bearing elements for *Use 1* (Legitimacy) are Selection, Expertise, and Task. The load-bearing elements for *Use 2* (Term Limits) are Duration and Post-Service status. The "Oversight" and "Agenda" rows reveal the structural cracks where the analogy fails to hold.

  ### 2. Disanalogies and Their Impact

  The disanalogies are sorted below by which use of the analogy they damage.

  #### A. Damaging Use 1: The Legitimacy of the Mandate
  *These disanalogies suggest the chamber is not sufficiently like a jury to borrow its democratic immunity.*

  **1. The Charge Problem (Agenda Setting)**
  In a trial, the jury is subordinate to the judge regarding what questions may be asked. The judge defines the legal boundaries; the jury finds the facts within them. In our proposal, the chamber sets its own agenda or negotiates it with the elected house.
  *   **Impact:** A body that defines its own questions is not a jury; it is a sovereign. The jury analogy derives its legitimacy from the idea that citizens are checking power, not wielding it without constraint. If the sortition chamber controls the docket, the "judge" role is missing. Without a functional equivalent to a judge (e.g., a constitutional court or strict standing rules), the chamber is not answering a charge; it is issuing commands. This weakens the claim that the chamber has the same neutral mandate as a jury.

  **2. The Filter Problem (Voir Dire)**
  Jury selection (*voir dire*) is designed to *exclude* bias, prior knowledge, and strong stakes in the outcome. We strike jurors who know the defendant or have strong views on the law. Sortition, by contrast, aims for *descriptive representation*, which requires including people precisely for their lived experience, biases, and stakes.
  *   **Impact:** This is a direct contradiction. If we argue the chamber is legitimate *because* it is a jury, we invite the objection that we should screen out members with strong interests in legislation (e.g., a teacher on an education bill). If we do not screen them out, we admit the chamber is not a jury. This undermines the first use of the analogy: we cannot claim the moral authority of a court while rejecting the screening process that makes a court fair.

  #### B. Damaging Use 2: The Ban on Reselection
  *These disanalogies suggest the "one-term amateur" logic does not justify a six-year exclusive term.*

  **1. The Return Problem (Economic Reintegration)**
  A juror serves for a week and returns to their employer, who is legally required to hold their job. Their economic horizon is unchanged. A member of this chamber serves for six years. They are not returning to the same job; they are re-entering the labor market after a significant gap.
  *   **Impact:** The jury analogy assumes a seamless return to ordinary life. A six-year term creates a "cliff edge." A member knowing they cannot be reselected faces a fixed horizon with high stakes for their post-service employment. This creates the exact incentive structure term limits are meant to prevent: using the final years of office to secure future employment (the "revolving door"). The jury analogy argues for *short* interruptions, not *long* careers with hard exits. It supports a ban on reselection only if the term is short enough that reintegration is automatic. Six years is not.

  **2. The Duration Problem (Civic Duty vs. Career Segment)**
  Jury service is a civic duty interrupting a life. A six-year term is a life segment.
  *   **Impact:** By stretching the service to six years, we transform the role from a duty into a career track, albeit a one-way one. The "amateur" status of a juror is preserved because they do not have time to become professionalized. Six years is sufficient time to develop professional habits, networks, and dependencies. The analogy claims these members will remain "amateurs" like jurors. In practice, they will become "lame duck" professionals. The analogy fails to support the claim that they will remain outside the political class.

  ### 3. The Rival Analogy: Legislator as Judge

  A rival view circulating on the commission suggests: *A career legislator is a Judge; a term-limited sortition member is a Juror.*

  This analogy should be rejected. It conflates adjudication with legislation.
  *   **Judges** interpret existing rules and rely on precedent, expertise, and longevity to ensure stability.
  *   **Legislators** create new rules and rely on responsiveness and representation to ensure legitimacy.

  A career politician is not a judge. They are not neutral arbiters; they are advocates for constituencies and ideologies. Equating a long-serving politician with a judge grants them an aura of neutrality they do not possess. Conversely, equating a sortition member with a juror implies they are merely finding "facts" about what the law should be, rather than making value judgments.

  Using this rival analogy creates a false dichotomy. It suggests we must choose between "Expert Judges" (career politicians) and "Lay Jurors" (sortition). In reality, we are choosing between "Professional Advocates" and "Temporary Advocates." The Judge/Juror framing obscures the fact that both chambers will be engaging in political negotiation, not legal discovery. It adds confusion without analytical value.

  ### 4. Conclusion and Recommendation

  **Does the conclusion survive?**
  No. The conclusion that there must be **no reselection, ever**, does not survive the audit of the jury analogy.

  The jury analogy supports *temporary* service and *rotation*. It does not support *long, single* terms without re-eligibility. In fact, taken seriously, the analogy argues against our current design:
  1.  **Term Length:** If the chamber is a jury, six years is too long. True jury service is measured in weeks. The analogy suggests terms should be short enough to prevent professionalization.
  2.  **Reselection:** The ban on reselection in juries exists to prevent bias in *future cases*, not to prevent careerism. In a legislature, the risk is not bias in future cases, but corruption in future employment. The jury analogy does not address this economic incentive.

  **Recommendation**
  We have two options to secure the vote next month.

  **Option A: Adjust the Design to Fit the Analogy**
  Shorten the term significantly (e.g., two years) and allow for a funded transition back to private life. This aligns better with the "civic duty" model of the jury. However, this may undermine the chamber's ability to build expertise and negotiate with the elected house.

  **Option B: Abandon the Analogy for Term Limits (Recommended)**
  Retain the jury analogy for **Use 1** (Legitimacy of Selection). It is strong enough to explain why random selection is democratic.
  However, for **Use 2** (Term Limits), defend the ban on reselection on direct political grounds, not judicial ones.
  *   **Argument:** We ban reselection not because they are jurors, but because we wish to prevent the formation of a distinct political class within the sortition chamber.
  *   **Argument:** We choose six years not because it matches jury service, but because it is the minimum time required to master complex legislation.
  *   **Mitigation:** Acknowledge the "Return Problem" explicitly. Propose a reintegration grant or employment protection for returning members to solve the economic incentive issue that the jury analogy ignores.

  **Final Word**
  The jury analogy is a powerful shield for the *existence* of the chamber, but it is a weak foundation for the *rules* of the chamber. If we tie the six-year ban to the jury analogy, opponents will dismantle the ban by pointing out that jurors do not serve six years. We should decouple the two. Let the chamber be a jury for the sake of its mandate, but let it be a legislature for the sake of its terms.
