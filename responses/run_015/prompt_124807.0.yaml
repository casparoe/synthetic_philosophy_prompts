      *   *Section 3: The Rival Analogy.* Briefly dismiss the Judge/Politician comparison as category error.
      *   *Section 4: Conclusion/Recommendation.* Does the ban survive? No, not on *this* analogy. The 6-year horizon creates incentives juries don't have.
