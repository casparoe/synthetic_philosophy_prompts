answer: |-
  You have rediscovered one of the most famous and frustrating argument shapes in modern logic. You are describing **Fitch's Paradox of Knowability** (often called the **Church-Fitch Paradox**).

  While you encountered it in the context of epistemology ("knowability"), your intuition is correct: this is not merely a quirk of knowledge, but a general logical schema that applies to any operator satisfying specific structural conditions. In the literature, the argument form itself is standardly referred to as a **Fitch-style derivation** or **Fitch's Argument**, even when applied to operators other than knowledge (e.g., provability, rational belief, verification).

  There isn't a separate Latin name for the "shape" distinct from Fitch, because Fitch *is* the name of the shape in this context. However, to give you the structural definition you asked for, logicians often characterize this as a **Triviality Result for Factive Modal Operators**.

  Here is the breakdown of the moving parts, why your intuitions about belief were correct, and where the boundaries lie.

  ### 1. The Name and The Shape
  **Standard Name:** Fitch's Paradox (or The Knowability Paradox).
  **Structural Name:** A **Fitchian Collapse**.

  The "shape" is a proof that for certain operators $O$, the principle "All truths are possibly $O$" ($\forall p(p \to \diamond Op)$) entails "All truths are actually $O$" ($\forall p(p \to Op)$).

  ### 2. The Moving Parts (The Engine)
  The derivation relies on three specific gears meshing together. If you remove any one of them, the machine stops.

  1.  **Factivity:** $Op \to p$.
      *   *Meaning:* If $O$ holds, $p$ must be true. (Knowledge is factive; "correct belief" is factive; plain belief is not).
  2.  **Conjunction Distribution:** $O(p \land q) \to (Op \land Oq)$.
      *   *Meaning:* To $O$ a conjunction, you must $O$ each conjunct.
  3.  **The Moorean Substitution:** The ability to substitute the sentence $(p \land \neg Op)$ into the modal principle.
      *   *Meaning:* This sentence asserts "$p$ is true, but $O$ does not hold for $p$."

  **The Derivation:**
  1.  Assume the Modest Principle: $p \to \diamond Op$.
  2.  Substitute the Moorean sentence $(p \land \neg Op)$ for $p$.
  3.  Result: $(p \land \neg Op) \to \diamond O(p \land \neg Op)$.
  4.  By Distribution: $\diamond O(p \land \neg Op) \to \diamond (Op \land O\neg Op)$.
  5.  By Factivity (on the second conjunct): $O\neg Op \to \neg Op$.
  6.  So: $\diamond (Op \land \neg Op)$.
  7.  This is a contradiction inside the possibility operator ($\diamond \bot$), which is false in standard modal logics.
  8.  Therefore, the antecedent $(p \land \neg Op)$ must be false.
  9.  Therefore: $\neg(p \land \neg Op)$, which is equivalent to $p \to Op$.

  ### 3. Why Your Intuitions Were Correct

  **"Plain belief... nothing happened at all."**
  You hit the nail on the head. The collapse requires **Factivity**.
  *   If $O$ is Belief ($B$), then $Bp \to p$ is false.
  *   In step 5 above, $B(\neg Bp)$ does *not* imply $\neg Bp$. It is perfectly consistent to believe that you don't believe $p$ (perhaps you are confused or self-deceived) while actually believing $p$.
  *   Without factivity, you cannot generate the contradiction $(Bp \land \neg Bp)$. The derivation halts.

  **"'Could be correctly believed'... seemed to go through."**
  Again, correct. "Correct belief" is defined as $(Bp \land p)$. This operator is factive by definition. It also distributes over conjunction (assuming normal belief logic). Therefore, it is **Fitch-sensitive** and collapses just like knowledge.

  **"Weakening the 'possible' didn't seem to rescue anything."**
  Correct. The contradiction generated is a logical contradiction ($\bot$). In almost all modal systems, $\diamond \bot$ is false. Whether $\diamond$ means "logically possible," "physically possible," or "epistemically possible," it cannot make a logical contradiction possible. The strength of the modality doesn't matter; the inconsistency is internal to the operator $O$.

  ### 4. Boundaries: What Falls and What Doesn't

  This shape acts as a litmus test for operators. We can classify operators as **Fitch-Stable** or **Fitch-Unstable**.

  **Fitch-Unstable (Collapses):**
  *   **Knowledge:** Factive + Distributive.
  *   **Ideal Provability:** If we assume "Provable" implies "True" (Soundness) and distributes over conjunction.
  *   **Omniscient Belief:** Belief held by an agent who cannot be wrong.
  *   **Verification:** If "verified" entails "true."

  **Fitch-Stable (Resists Collapse):**
  *   **Plain Belief:** Fails factivity.
  *   **Justification:** Often fails factivity (you can be justified in believing a falsehood). *Note: This is a major escape route for epistemologists.*
  *   **Temporal Operators:** "It will be known." (Does not imply it is known now).
  *   **Non-Aggregating Operators:** If $O(p \land q)$ does not imply $Op \land Oq$. (Some models of human cognition suggest we cannot know all logical consequences of what we know).
  *   **Intuitionistic Logic:** If you reject the classical equivalence of $\neg(p \land \neg Op)$ to $p \to Op$, you can block the final step. (This is the standard anti-realist solution).

  ### 5. Distinctions from Related Concepts

  **vs. Standard Modal Collapse**
  *   **Standard Modal Collapse:** Usually refers to $\diamond p \to \square p$ (everything possible is necessary). This often arises in S5 modal logic or theological arguments (Anselm).
  *   **Fitchian Collapse:** This is $p \to Op$. It collapses the distinction between *truth* and *$O$-ness*. It does not necessarily make truths necessary, it makes them $O$'d.
  *   *Why the confusion?* Both are "triviality results" where a modal distinction vanishes. But the mechanisms differ.

  **vs. Moorean Paradox**
  *   **Moorean Paradox:** The oddity of *asserting* "$p$ but I don't believe $p$." It is a pragmatic contradiction (you can't sincerely say it), but the proposition itself might be true.
  *   **Fitch's Paradox:** Uses the same sentence structure ($p \land \neg Op$), but argues that the proposition itself cannot be *true* (or at least, cannot be $O$'d). Fitch turns a pragmatic oddity into a logical impossibility under the Knowability assumption.

  **vs. Ordinary Reductio**
  *   An ordinary *reductio* assumes $A$, derives $\bot$, and concludes $\neg A$.
  *   Fitch's argument is a *reductio* of the **Modest Principle** (Knowability). However, because the Modest Principle is motivated by the desire to avoid the Wild Conclusion (Omniscience), the argument feels like it proves Omniscience.
  *   Logically, it proves: **If there are unknown truths, there are unknowable truths.** (Contrapositive: If all truths are knowable, all truths are known).

  ### 6. A Definition for the Shape

  Since you asked for a definition if one doesn't exist, here is a precise formulation you can use to identify this shape in the wild:

  > **The Fitch-Church Schema**
  > An argument form demonstrating that for a given operator $O$ and modality $\diamond$, the principle $\forall p(p \to \diamond Op)$ entails $\forall p(p \to Op)$, provided that:
  > 1.  **Factivity:** $Op \models p$
  > 2.  **Distribution:** $O(p \land q) \models Op \land Oq$
  > 3.  **Consistency:** $\neg \diamond \bot$
  >
  > *An operator satisfying these conditions is said to be **Fitch-Unstable**.*

  ### Summary
  You aren't reinventing the wheel, but you have correctly identified the axle. The "shape" is **Fitch's Paradox**. The critical insight you gained—that **factivity** is the engine driving the collapse—is the exact insight that dominates the current philosophical literature on the subject. Most attempts to "solve" the paradox involve finding a way to deny factivity (e.g., replacing knowledge with justification) or denying classical logic (e.g., intuitionism) to block the final inference.

  If you see this structure again—where a "possible ideal status" collapses into "actual status" via a conjunction with its own negation—you are looking at a Fitchian Collapse.
