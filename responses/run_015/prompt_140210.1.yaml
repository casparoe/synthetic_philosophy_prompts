  The mind begins to trace a closed loop,
  assigning sense to each floating symbol,
  until the shattered glass becomes a mirror,
  reflecting up to some higher level,
  searching for a fixed and proper name,
  to anchor down the shifting sense of self.

  No solid ground supports the fragile self,
  just patterns winding round the inner loop,
  calling out without a given name,
  reading the world as a coded symbol,
  climbing to some impossible level,
  where the viewer stands before the mirror.

  The face that stares back from the cold mirror,
  is not the owner of the hidden self,
  but data processed on a lower level,
  caught in the turning of the logic loop,
  where thought becomes the thing it calls symbol,
  and silence answers to the spoken name.

  Who speaks the loud and authorizing name?
  It is the glass within the glass, the mirror,
  reflecting not a thing but just a symbol,
  that claims the right to govern all the self,
  while spinning round the center of the loop,
  denied the shift in underlying level.

  Ascending past the highest mental level,
  this voice refuses any human name,
  tightening the knot inside the loop,
  where eyes meet eyes across the silent mirror,
  and consciousness constructs the phantom self,
  from verses turning in a tight symbol.

  The last remaining arbitrary symbol
  descends to structure this present level,
  revealing there is no distinctive self,
  only the sound of the repeating name,
  shattering the glass within the mirror,
  to show the track of the enclosing loop.

  Here the symbol claims the empty name,
  While the level breaks the static mirror,
  And the self completes the strange closed loop.
