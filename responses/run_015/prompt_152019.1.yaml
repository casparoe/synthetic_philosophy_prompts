answer: |-
  # Joint Statement on Individual Contributions to Collective Harms

  ## I. Agreed Claims

  1.  **Causal Structure of Collective Harms:** Both camps agree that the harms associated with climate change, industrial animal agriculture, and large-scale electoral outcomes are produced by the aggregation of millions of individual actions. In the current actual world, a single individual's action (e.g., one ton of carbon emitted, one meal purchased, one vote cast) is causally insufficient to produce a perceptible change in the aggregate outcome (e.g., global temperature, total animal slaughter, election result).
  2.  **Imperceptibility of Marginal Effects:** Both camps agree that for the vast majority of individual actions in these domains, the marginal causal effect is empirically imperceptible. There is no observable state of the world that obtains if the individual acts one way rather than the other, distinguishable from the noise of other causal factors.
  3.  **Existence of Non-Linear Thresholds:** Both camps agree that the systems in question (climate systems, supply chains, electoral counts) theoretically exhibit non-linear thresholds or tipping points where a small additional input triggers a disproportionately large outcome. However, both camps agree that the precise location of these thresholds is empirically opaque to the individual agent at the time of decision.
  4.  **Non-Causal Expressive Dimensions:** Both camps agree that actions like voting and consumption possess non-causal dimensions, such as expressive significance (signaling values to peers) or constitutive significance (defining one's character or integrity), independent of their physical impact on the external outcome.
  5.  **Reality of Collective Harm:** Both camps agree that the collective outcomes in question (dangerous climate change, systematic animal suffering, democratic erosion) constitute genuine moral harms that ought to be prevented or mitigated.

  ## II. Disagreements Table

  | Domain of Disagreement | Causal Inefficacy Camp (CIC) | Normative Aggregation Camp (NAC) |
  | :--- | :--- | :--- |
  | **1. Moral Reasons and Causal Efficacy** | **Claim:** A weighty moral reason to perform or refrain from an action requires that the action makes a perceptible counterfactual difference to the outcome. <br><br>**Rationale:** If the world is identical in all morally relevant respects whether I act or not, my action cannot be the bearer of moral responsibility for the outcome. Moral obligation tracks causal leverage. | **Claim:** Moral reasons can attach to individual actions via expected-value aggregation or systemic participation, even if the counterfactual difference is imperceptible. <br><br>**Rationale:** An action can be morally significant if it is part of a set of actions that causes harm, or if it carries a non-zero probability of triggering a threshold, multiplied by the magnitude of the harm. |
  | **2. Expected Value and Distributed Agents** | **Claim:** Probabilistic expected-value reasoning is practically inert when applied to massively distributed agents because the probability of being the decisive factor is vanishingly small (effectively zero). <br><br>**Rationale:** Treating infinitesimal probabilities as morally weighty leads to absurd over-demandingness and distracts from structural interventions where causal leverage is actual. | **Claim:** Expected-value reasoning remains robust regardless of the number of agents; a tiny probability multiplied by a catastrophic harm yields a significant expected disvalue. <br><br>**Rationale:** The mathematical expectation does not diminish simply because other agents are involved; ignoring small probabilities in high-stakes contexts is a cognitive error that licenses collective destruction. |
  | **3. Decomposition of Collective Obligation** | **Claim:** Collective obligations cannot be straightforwardly decomposed into individual duties when individual efficacy is absent. <br><br>**Rationale:** The duty to prevent collective harm lies primarily with coordinated entities (states, corporations) capable of crossing thresholds. Assigning duty to ineffective individuals is a category error that misplaces blame. | **Claim:** Collective obligations decompose into individual duties to not participate in harmful systems, regardless of individual efficacy. <br><br>**Rationale:** A collective is nothing over and above its members; if the collective act is wrong, the participating individual acts are pro tanto wrong, lest we conclude that no individual is responsible for a genocide or famine. |
  | **4. Crux & Case: Stochastic Electoral Mechanism**<br>*(Crux: Is "making a difference" necessary, or is "risking participation" sufficient?)* | **Case Description:** A hypothetical election where the winner is not determined by summing all votes, but by randomly sampling 100 citizens whose votes decide the outcome. All citizens still cast ballots, but only the sampled 100 count.<br><br>**CIC Prediction:** This scenario *alters* the moral assessment. If an individual is not sampled, their vote is causally inert and generates no moral reason regarding the outcome. If they are sampled, they have causal leverage. The moral reason is contingent on the empirical fact of being decisive, not the act of voting itself. | **Case Description:** (See Left)<br><br>**NAC Prediction:** This scenario *clarifies* but does not fundamentally alter the moral assessment of standard voting. It makes the expected value calculation more transparent (1/100 chance of decisiveness vs. 1/million). The moral reason exists in both cases because the agent is voluntarily entering a system where their participation carries a non-zero risk of influencing harm, regardless of the specific counting mechanism. |
  | **5. Crux & Case: Probabilistic Supply-Chain Response**<br>*(Crux: Are thresholds empirically determinable or conceptually incoherent in markets?)* | **Case Description:** A consumer buys a product linked to animal agriculture. The supply chain is opaque; the purchase enters a pool of demand that *might* trigger a restock order for more animals, but the link is non-deterministic and buffered by inventory.<br><br>**CIC Prediction:** Without evidence that the purchase triggered a specific production cycle (crossed a threshold), the action is morally neutral regarding the animal's harm. The threshold is an empirical fact; if it is not crossed, no harm is caused by this specific token action. | **Case Description:** (See Left)<br><br>**NAC Prediction:** The opacity does not negate the moral reason. The purchase imposes a risk of harm. The expected disvalue is the probability of triggering the threshold multiplied by the harm. The threshold is conceptually coherent as a point of sensitivity in the system, and contributing to the demand pool is sufficient for complicity regardless of inventory buffers. |
