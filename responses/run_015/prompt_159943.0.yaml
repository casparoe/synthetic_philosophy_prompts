answer: |-
  # Taxonomy of Systematic Informational Isolation

  ### The Tree

  **Node 1:** Is the outside information physically/technically unavailable to members, or is it available but treated as unreliable?
  *   **Left (Unavailable):** Go to Node 2.
  *   **Right (Unreliable):** Go to Node 3.

  **Node 2:** Is the filtering produced by members' own dispositions to trust and share, or by a selection mechanism they did not choose and may not know is operating?
  *   **Left (Unchosen Mechanism):** **Leaf 1: Structural Silo** (Unnamed: *Unexplored; literature focuses on agency over infrastructure.*)
      *   *Remedy:* Regulatory transparency or algorithmic diversification.
  *   **Right (Chosen Disposition):** **Leaf 2: Epistemic Bubble** (Standard Label)
      *   *Remedy:* Repairing norms of sharing; introducing cross-cutting content.

  **Node 3:** Is the distrust directed primarily at outside sources, or primarily at the community's own members?
  *   **Left (Own Members):** Go to Node 4. *(The "Mirror Image" Branch)*
  *   **Right (Outside Sources):** Go to Node 5.

  **Node 4:** Do members feel free to rely on their own observations, or are they penalized for doing so?
  *   **Left (Free but Defer):** **Leaf 3: Epistemic Servility** (Unnamed: *Unattractive; rarely self-identified as a stable state.*)
      *   *Remedy:* Rebuilding internal testimonial confidence; validating local knowledge.
  *   **Right (Penalized):** **Leaf 4: Testimonial Suppression** (Unnamed: *Unexplored as isolation mechanism; usually categorized under oppression.*)
      *   *Remedy:* Structural protection for dissenters + rebuilding confidence.

  **Node 5:** Is the discounting general (all outsiders) or directed only at sources that disagree?
  *   **Left (Directed):** Go to Node 6.
  *   **Right (General):** Go to Node 7.

  **Node 6:** Can a member notice the pattern and leave at acceptable cost, and does the community let them?
  *   **Left (Yes):** **Leaf 5: Selective Exposure** (Standard Label)
      *   *Remedy:* Choice architecture nudges; lowering friction to diverse sources.
  *   **Right (No):** **Leaf 6: Echo Chamber** (Standard Label)
      *   *Remedy:* Lowering the cost of exit; ensuring safety for defectors.

  **Node 7:** Does the community merely consume filtered material, or does it manufacture its own evidence base?
  *   **Left (Consumes Filtered/None):** **Leaf 7: Sectarian Withdrawal** (Standard Label)
      *   *Remedy:* Building trust bridges; slow re-integration of outside sources.
  *   **Right (Manufactures Evidence):** **Leaf 8: Reality Substitution** (Unnamed: *Unexplored; distinct from lying because it replaces the evidentiary structure.*)
      *   *Remedy:* Forensic debunking of internal fabrications + rehabilitating outside source credibility.

  ***

  ### Diagnostics and Limitations

  **Distinguishing the "Reality Substitution" Leaf (Leaf 8)**
  Unlike an *Echo Chamber* (Leaf 6), which filters existing evidence to favor a narrative, *Reality Substitution* generates a closed loop of synthetic data, fabricated reports, and circular citations that render outside evidence irrelevant rather than just suspect. The remedial difference is crucial: you cannot fix Leaf 8 simply by lowering exit costs (Leaf 6 remedy) because the member does not believe they need to exit; they believe they possess *more* data than the outside world. Intervention requires dismantling the internal evidence-generating machinery, not just opening a window.

  **Distinguishing the "Epistemic Servility" Leaf (Leaf 3)**
  This is the mirror image of the *Echo Chamber*. Here, the community is cut off from information not because they reject outsiders, but because they systematically discount their own local knowledge in favor of external authority (e.g., a colonized population deferring to imperial metrics, or a patient group deferring blindly to pharmaceutical data over lived experience). The isolation is from *self-knowledge*. The remedy is not exposing them to more outside info (which they already have), but repairing their confidence in their own testimonial capacity.

  **Overlaps and Indistinguishable Cases**
  1.  **Structural Silo (Leaf 1) vs. Epistemic Bubble (Leaf 2):** In practice, these are often indistinguishable to the member. A user may believe they are choosing not to share certain links (Bubble), when their feed is algorithmically suppressing them (Silo). The tree cannot separate these without access to the backend code of the platform.
  2.  **Echo Chamber (Leaf 6) vs. Reality Substitution (Leaf 8):** Real-world cases often migrate from one to the other. *QAnon* began largely as an Echo Chamber (directed distrust, high exit cost) but evolved into Reality Substitution (manufacturing its own "drops" and evidence). A single case may occupy both leaves simultaneously at different stages of radicalization.
  3.  **Testimonial Suppression (Leaf 4) vs. Echo Chamber (Leaf 6):** Both involve high exit costs and social penalty. The distinction rests on *who* is distrusted (self vs. outside). In complex hierarchies (e.g., a cult), both may operate: members distrust outsiders (Echo Chamber) AND are punished for trusting their own doubts (Suppression). The tree forces a choice at Node 3, but concrete cases often exhibit both distrust vectors.
