answer: |-
  **MEMORANDUM**

  **TO:** Charter Review Commission
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Proposed Fiscal Entrenchment Amendment

  **Recommendation**
  I recommend that the Commission **adopt the amendment in modified form**. Specifically, we should accept the fiscal constraints but incorporate a "sunset" mechanism similar to the compromise proposed: the supermajority requirement should lapse every five years unless reaffirmed by a simple majority of the sitting council, and the entrenchment period should be reduced from fifteen to ten years. This approach balances the need for fiscal credibility with the democratic imperative that no majority should permanently bind its successors.

  **The Philosophical Stakes**
  To decide this, we must understand the "Ulysses contract" at play. In political theory, this refers to a community binding itself to a rule to prevent future weakness. Proponents argue that without entrenchment, fiscal restraint is impossible. Every council faces "time inconsistency": the incentive to spend now for immediate electoral gain while pushing costs to the future. Lenders know this and charge higher interest rates. By making the rule hard to break, we signal credibility, lowering borrowing costs for everyone. This is the strongest case for the original amendment: it treats the City as a single corporate entity persisting over time, capable of binding itself for its own long-term health, much like an individual saving for retirement.

  **The Democratic Objection**
  Opponents, however, identify a fatal flaw in this analogy. When Ulysses tied himself to the mast, he bound *himself*. When we enact a fifteen-year entrenchment clause, we bind *others*. Fifteen years is a generation in municipal politics. A significant portion of the electorate who vote for this amendment will not be here to vote on its repeal. They are imposing their risk tolerance and policy preferences on new residents who had no say in the matter.

  This highlights the morally relevant difference between binding your own future self and binding someone else: **consent**. Autonomy requires that those subject to a rule have a meaningful opportunity to revise it. While all laws bind future majorities, constitutional entrenchment removes the ordinary legislative remedy. If the City faces a crisis in year twelve—a flood, a recession, a pandemic—a simple majority should be able to respond. To deny them that power is to treat future citizens as subjects of the past rather than partners in self-governance.

  **Evaluating the Compromise**
  This brings us to the compromise: a depreciation clause requiring periodic reaffirmation. You asked whether a precommitment that must be periodically reaffirmed still does the work of precommitment, or if it collapses into a mere default.

  It is true that this mechanism reduces the "bite" of the constraint. If a determined majority can let the rule lapse with a simple vote, lenders may not view it as ironclad. However, this does not mean the compromise is useless, nor does its weakness indict the legitimacy of the original proposal. Rather, it clarifies the nature of municipal governance. A city is not a sovereign nation; its needs change rapidly.

  If the compromise collapses into a default, it tells us that **absolute precommitment was the illegitimate element**, not the fiscal rule itself. The compromise transforms the amendment from a "lock" into a "privileged default." It signals that fiscal restraint is the standing policy of the City, requiring affirmative action to deviate from, rather than affirmative action to maintain. This preserves some credibility (there is still friction involved in changing course) while restoring democratic agency. It acknowledges that while the City persists, the electorate changes, and the living must govern the living.

  **The Strongest Objection**
  I must present the strongest argument against this modification, which comes from the proponents of the original text. They will argue that a sunset clause destroys the very credibility we seek. If bond markets know the rule can be undone by a simple majority every five years, they will price the debt as if the rule does not exist. The administrative burden of re-enactment creates a risk of accidental lapse during a budget crisis. By weakening the entrenchment, we may secure democratic purity but lose the economic benefit. If the goal is lower interest rates, a half-measure may yield no measurable gain while complicating budgeting.

  **Conclusion**
  This objection is serious, but it assumes that credibility comes only from rigidity. In reality, credibility also stems from stability of culture and repeated behavior. A rule that is reaffirmed every five years creates a recurring public debate about fiscal values, potentially strengthening the norm of restraint rather than weakening it.

  The original fifteen-year lock risks a democratic deficit that outweighs the marginal gain in bond credibility. The compromise respects the future electorate's autonomy while maintaining a strong presumption against tax increases. It accepts that precommitment in a democracy must be renewable to remain legitimate. I urge the Commission to vote for the modified form.
