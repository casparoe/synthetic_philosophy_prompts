          *   *Ulysses Analogy:* The "Self" is the City as a corporate entity over time. Just as an individual binds themselves to save for retirement, the City binds itself to fiscal health.
          *   *Legitimacy:* Constitutions *are* precommitments. We bind future majorities all the time (rights, procedures). This is just fiscal constitutionalism.
          *   *Strength:* Solves the credibility problem. If lenders know the rule is hard to break, rates go down.

      *   **Side B (Anti-Entrenchment/Opponents):**
          *   *Argument:* Democratic Sovereignty. A majority today cannot rule a majority tomorrow. The electorate changes (death, migration).
