prompt: |-
  hey can you check if this summary is fair? my roommate summed up the dollar auction / escalation thing they heard in a behavorial econ lecture:

  Shubik designed the dollar auction in the 1970s as a game-theory model of escalation. Two players bid in one-cent increments for a dollar bill; the highest bidder wins the dollar, but both the winner and the runner-up have to pay their final bids. So if you bid 99 cents and lose, you're out 99 cents with nothing. Shubik used this to argue that escalation is fundamentally a sunk-cost trap — people keep bidding not because the prize is worth it, but because they've already invested and can't stand the loss. He claimed this explains everything from auction fever on eBay to military standoffs, and that it's basically hardwired human irrationality. The fix, he said, is to restructure auctions so only the winner pays anything, which removes the trap. They also said it's basically the same mechanism as war-of-attrition models in evolutionary biology, just with discrete penny bids.

  i feel like there's something about both people paying but maybe im wrong? also they conflate it with some biology game? can you go throuh it line by line and tell me what's accurate, what's a simplification or overreach, and what's actually wrong? and does the conclusion about fixing auctions follow from the model?
