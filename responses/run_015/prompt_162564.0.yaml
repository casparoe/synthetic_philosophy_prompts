answer: |-
  Here is a complete seminar plan designed to hit your philosophical targets while managing the practical constraints (time, budget, CVD, student skepticism).

  # Activity Title: The Chromatic Cipher
  **Time:** 80 Minutes
  **Group Size:** 18 Students (6 tables of 3)
  **Constraint:** Do not use the words "Qualia," "Consciousness," "Experience," or "Dennett" until the Debrief (Minute 65).

  ## 1. Materials & Setup
  *   **Decks:** 6 identical decks of 12 paint-chip cards each.
      *   *CVD Accommodation:* Use Munsell chips or a set where **Lightness (Value)** varies distinctly alongside Hue. A student with red-green deficiency can still discriminate based on luminance gradients. Ensure the "Global Swap" preserves the luminance order even if Hue shifts, so the CVD student isn't excluded from the structural logic.
  *   **Legends:** 6 index cards per table, numbered 1–12.
  *   **Boxes/Envelopes:** 6 opaque envelopes or boxes per table (for the "black box" swap).
  *   **Ledgers:** Small slips of paper for private notes.
  *   **Currency:** "Conviction Chips" (use poker chips, paper scraps, or just tally marks on the board).
  *   **Intervener Logs:** Pre-printed sheets for the Intervener to record actions truthfully (sealed until debrief).

  ## 2. The Payoff Scheme (The Epistemic Economy)
  To prevent rigging and force engagement, use an asymmetric risk model. Each student starts with **3 Chips**.

  *   **The Bet:** At the end of each round, students may either **Fold** (stay silent) or **Call** (assert "A change occurred in my relation to the cards").
  *   **Cost to Call:** 1 Chip.
  *   **Payout:**
      *   If a change *actually* occurred (verified by Intervener's log): **+3 Chips** (Net +2).
      *   If *no* change occurred: **-1 Chip** (Net -2 total).
      *   If you **Fold**: 0 change.
      *   **The Negligence Clause:** If a *Partial Swap* (structural break) occurs and the whole table Folds, the **Auditor** loses 1 Chip (penalized for missing the obvious). This ensures silence is not a dominant strategy; they *must* detect structural breaks.

  **Win Condition:** The student with the most chips at the end chooses the supplementary reading for next week from a pre-approved list (e.g., a block of Churchland, a block of Lewis, or a comic).

  ## 3. The Roles (Rotate every 2 Rounds)
  1.  **Subject:** Handles the deck, makes discrimination judgments, places bets.
  2.  **Intervener:** Handles the swaps, keeps the sealed Log. *Crucial:* They must follow a die-roll protocol to decide swaps, so they aren't accused of bias.
  3.  **Auditor:** Sees the Subject's bets, compares them to the Log at the end, verifies wins/losses.

  ## 4. The Rounds (50 Minutes Total)
  *Instructions to Students:* "You are calibrating a sensory interface. Your goal is to track stability. Do not discuss the cards' physical appearance. Discuss only ordering, naming, and similarity."

  **Round 1: Calibration (Baseline)**
  *   **Action:** Subject orders the deck 1–12 by similarity. Assigns names from the Legend (e.g., 1="Crimson", 2="Scarlet").
  *   **Ledger Entry:** Write one sentence describing Card 5 *without* using the name "Scarlet" or referring to other cards. (e.g., "It feels warm.")
  *   **Swap:** None.
  *   **Point:** Establishes the baseline relational structure.

  **Round 2: The Global Automorphism (The Inversion)**
  *   **Action:** Subject puts deck in box.
  *   **Intervener:** Rolls a die. On 4–6: Rotate the entire deck physically (Card 1 becomes Card 2's physical hue, etc.) **AND** rotate the Legend labels to match. On 1–3: Do nothing.
  *   **Subject:** Takes deck out. Re-orders. Re-names.
  *   **Philosophical Load:** The physical stimulus changes, the functional output (naming/ordering) stays identical.
  *   **Expected Bet:** Fold. (No functional evidence of change).

  **Round 3: The Partial Break (The Competence Shift)**
  *   **Action:** Subject puts deck in box.
  *   **Intervener:** Swaps *only* Card 4 and Card 5 physically. **Do not** change the Legend.
  *   **Subject:** Takes deck out. The similarity structure is now broken (Card 4 is now visually distinct from its neighbors in a way that contradicts the Legend's implied gradient).
  *   **Philosophical Load:** Relational structure is violated. Functional change is detectable.
  *   **Expected Bet:** Call. (If they Fold, Auditor gets penalized).

  **Round 4: The Round-Trip (The Dancing Fact)**
  *   **Action:** Subject puts deck in box.
  *   **Intervener:** Swaps the deck (Global Automorphism), waits 10 seconds, swaps it *back* to original.
  *   **Subject:** Takes deck out. Everything is physically and functionally identical to Round 1.
  *   **Ledger Entry:** "Did my experience dance twice or zero times?"
  *   **Philosophical Load:** Is there a fact of the matter about the intermediate state if no trace remains?
  *   **Expected Bet:** Fold. (But high anxiety).

  **Round 5: The False Disclosure (Testimony vs. Apprehension)**
  *   **Action:** Subject puts deck in box.
  *   **Intervener:** Does **nothing** to the deck.
  *   **Intervention:** Intervener whispers to the Subject: "I performed a Global Swap."
  *   **Subject:** Takes deck out.
  *   **Philosophical Load:** Does external authority create a qualitative fact where none exists functionally?
  *   **Expected Bet:** 50/50 split. Some will trust the Intervener (betting on change), some will trust their senses (betting on stability).

  **Round 6: The Handover (Ineffability Test)**
  *   **Action:** Subjects at Table A swap seats with Table B.
  *   **Task:** Read the Round 1 Ledger Entry from the previous Subject. Try to identify which card in *your* deck matches that description.
  *   **Philosophical Load:** Private descriptions fail to pick out public objects without shared relations.

  ## 5. The Debrief (15 Minutes)
  *Reveal:* "You have just enacted Daniel Dennett's 'Quining Qualia' argument."

  **Mapping the Game to the Argument:**
  1.  **Round 2 (Global Swap):** Maps to the **Inverted Spectrum**. If the relational structure (discrimination, naming, ordering) is preserved, the claim that "the experience changed" has no cash value. You couldn't bet on it.
  2.  **Round 3 (Partial Break):** Maps to **Competence vs. Performance**. The only time you could confidently bet was when the *relations* broke. This proves your access is relational, not intrinsic.
  3.  **Round 4 (Round-Trip):** Maps to **Dancing Qualia**. If everything returns to baseline, is there a fact about the middle? If you can't bet on it, does the fact exist?
  4.  **Round 5 (False Disclosure):** Maps to **Authority vs. Direct Apprehension**. If someone tells you your qualia changed, but you can't tell, is the "change" a property of your mind or just a belief?
  5.  **Round 6 (Handover):** Maps to **Ineffability**. Your private sentence failed to identify the card for the partner. Without shared public criteria, the "private property" is communicatively dead.

  **The Core Claim:** "Qualia are supposed to be intrinsic, ineffable, private, and directly apprehensible. But in this game, the only things you could *apprehend*, *communicate*, or *bet on* were relational. When we stripped the relations away (Round 2), the identity of the 'experience' vanished."

  ## 6. Predictable Failures & Recovery

  **1. "It's just a trick / You stipulated the swap."**
  *   *Student:* "The swap was undetectable because you told us the Legend changed. That's stipulation, not philosophy."
  *   *Recovery:* "Exactly. Dennett's point is that *all* claims about qualia rely on similar stipulations. If you can't distinguish the swap from the stipulation, the 'quality' isn't doing any work. The 'trick' is the nature of introspection itself."

  **2. CogSci Operationalism ("Difference = Discriminability")**
  *   *Student:* "If I can't discriminate it, there is no difference. Game over."
  *   *Recovery:* Validate them. "You are adopting a functionalist definition. The Realist says there *is* a difference (the experience itself), even if you can't discriminate it. This game asks: If you can't discriminate it, measure it, or describe it, what work is that 'difference' doing? Is it a ghost?"

  **3. Memory Erasure Confusion**
  *   *Student:* "Maybe I just forgot what Red looked like."
  *   *Recovery:* "Distinguish *forgetting* from *no fact of the matter*. If you forgot, there was a past fact. In Round 4 (Round-Trip), if the system is perfectly symmetrical, Dennett argues there is no past fact to forget. The ledger is blank not because you lost the data, but because the data was never written."

  **4. Accusations of Cheating (Intervener)**
  *   *Student:* "The Intervener lied on the Log."
  *   *Recovery:* This is why the Log is sealed and the Die Roll protocol exists. If trust breaks, the game fails. Use this: "Science requires trust in instrumentation. If you doubt the Intervener, you doubt the data. Qualia Realism requires you to trust your introspection more than you trust your public data. Why?"

  **5. The CVD Student**
  *   *Risk:* They feel excluded if the swap is Hue-based.
  *   *Recovery:* If you used Luminance-variant chips, they are fully included. If they note they saw *no* physical change in Round 2 while others did: "You are the living proof of the Inverted Spectrum. Your functional output matched theirs, but your physical input differed. Did that change your betting strategy? No. Therefore, the 'difference' is philosophically inert for the game."

  ## 7. The Honesty Clause (The Last 5 Minutes)
  *This is critical. Do not skip this.*

  You must address the strongest Realist in the room before they dismiss the whole hour.

  **Say this:**
  "I need to be honest about what this game did *not* do. This game simulated the *functional* indistinguishability of qualia swaps. It did not, and cannot, produce the *first-personal seeming* that survives every failed cash-out.
  "The hardline Realist in the room is thinking: *'But I know what it's like to see red. If you swapped my red for green, I would know, even if I couldn't tell you.'*
  "This activity cannot touch that feeling. It operates entirely on the public, relational side.
  "So, why run it? Because Dennett's argument isn't that the feeling doesn't exist. It's that the feeling cannot sustain the *theoretical weight* we put on it. If the 'feeling' has no identity conditions outside of relations, it cannot be the foundation of a science of mind.
  "Next week, when you read Dennett, ask yourself: Is the 'leftover' feeling a profound truth about consciousness, or is it just the shadow cast by the relational machinery you just played with?"

  ## 8. TA Cheat Sheet (Quick Reference)
  *   **Don't say:** "Qualia," "Experience," "Feel," "Consciousness."
  *   **Do say:** "State," "Relation," "Discrimination," "Output," "Ledger."
  *   **If stuck:** "Record that in your ledger."
  *   **CVD Check:** Ensure chips vary in lightness, not just hue.
  *   **Time Management:** Keep Rounds 2 & 4 tight. The debate happens in the Debrief, not during the swap.

  This structure forces the CogSci students to engage with the *limits* of operational definitions (by showing where they go silent) and forces the Phil students to confront the *emptiness* of non-operational claims (by showing they can't bet on them).
