prompt: |-
  I am a postgraduate student reading for an MPhil in Historical Theory, and I also work part-time as a research assistant for a municipal heritage trust that is curating a small exhibition on the contested closure of the Meridian Textile Mill in 1928. Our board receives frequent submissions—oral history transcripts collected in the 1970s, digitised fragments of local newspapers with probable OCR errors, corporate minute books held in private hands, and retrospective affidavits prepared for a 1960s compensation claim—and we lack any consistent method for deciding which materials should shape the public narrative and which should be relegated to a footnote or excluded entirely.

  Drawing on the principles of source criticism that run from Herodotus’s distinction between direct observation and hearsay through Thucydides’s insistence on contemporary verification and onward to modern archival concepts such as provenance, original order, and the distinction between external and internal criticism, please construct a reusable decision procedure that a non-specialist researcher could apply in under thirty minutes per source. The procedure should take the form of ordered questions or tests: first for authenticity and provenance (external criticism), then for credibility, bias, and internal consistency (internal criticism), with explicit stopping points where a source is rejected, explicit hand-off points where the decision becomes a matter of curatorial values rather than epistemic fact, and explicit flags for cases the procedure cannot settle. It must handle at least three hard cases: an oral testimony recorded in 1975 that describes workplace conditions in 1928 but conflicts with the corporate ledger; a digitised newspaper clipping in which OCR errors have introduced a phantom manager’s name that alters the causal story; and a retrospective affidavit drafted in 1965 by a former foreman seeking compensation, where institutional incentives and the passage of time intersect. Apply the procedure to each case, including one where it yields an answer the heritage board is likely to dislike—perhaps the exclusion of a vivid oral account that fails internal criticism, or the inclusion of a dry but reliable ledger that undermines the preferred narrative of worker solidarity. Finally, state clearly what the procedure cannot do: which judgments it deliberately leaves to curators, where it is likely to misfire with digitised or mediated sources, and why no procedural substitute exists for the historian’s ultimate responsibility for interpretation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** MPhil student in Historical Theory + Research Assistant for a municipal heritage trust.
      *   **Task:** Create a reusable decision procedure for source evaluation (source criticism) for non-specialist researchers.
      *   **Context:** Curating an exhibition on the contested closure of the Meridian Textile Mill (1928).
      *   **Materials:** Oral histories (1970s), digitized newspapers (OCR errors), corporate minutes (private), retrospective affidavits (1960s).
      *   **Constraints:**
          *   Must be usable in under 30 minutes per source.
          *   Must follow historical source criticism principles (Herodotus/Thucydides $\rightarrow$ Modern Archival Science).
          *   Structure: Ordered questions/tests (External $\rightarrow$ Internal).
          *   Must include: Stopping points (rejection), Hand-off points (curatorial values), Flags (unsettled cases).
          *   Must handle three specific "hard cases" (Oral vs. Ledger, OCR Newspaper, Retrospective Affidavit).
          *   Must apply the procedure to these cases (including one unpopular outcome).
          *   Must state limitations (what the procedure *cannot* do).

  2.  **Theoretical Framework:**
      *   *External Criticism:* Authenticity, Provenance, Original Order, Date, Authorship. (Is it what it says it is?)
      *   *Internal Criticism:* Credibility, Bias, Competence, Consistency, Corroboration. (What does it mean and is it true?)
      *   *Archival Principles:* Provenance (who created it?), Original Order (how was it kept?).
      *   *Classical Roots:* Herodotus (hearsay vs. observation), Thucydides (contemporary verification/cross-checking).
      *   *Modern Context:* Digitization issues (OCR), Oral History limitations (memory vs. event).

  3.  **Drafting the Procedure (The "Meridian Protocol"):**
      *   *Goal:* Speed and clarity for non-specialists.
      *   *Structure:* Two Phases (External, Internal) + Decision Matrix.
      *   *Time Limit:* Needs to be tight. 15 mins External, 15 mins Internal.
      *   *Stopping Points:* If it fails External, it's out (or marked as forgery/misidentified). If it fails Internal badly, it's relegated.
      *   *Hand-off Points:* Where evidence is ambiguous but narratively useful (curatorial choice).

      *Drafting Phase 1 (External):*
      1.  Identity: What is this object?
      2.  Provenance: Where did it come from? Chain of custody?
      3.  Date: Is it contemporary to the event (1928) or retrospective?
      4.  Integrity: Is it altered (OCR, edits)?

      *Drafting Phase 2 (Internal):*
      1.  Competence: Did the author know what they were talking about?
      2.  Bias/Incentive: Why was this created?
      3.  Consistency: Does it contradict itself or known facts?
      4.  Corroboration: Does it match other sources?

      *Decision Nodes:*
      *   Reject (Fail External).
      *   Footnote/Contextualize only (Fail Internal but interesting).
      *   Core Narrative (Pass both).
      *   Curatorial Call (Mixed results).

  4.  **Developing the Hard Cases:**
      *   *Case 1: Oral History (1975) vs. Corporate Ledger.*
          *   External: Oral history is authentic (recorded 1975), but retrospective regarding 1928. Ledger is contemporary.
          *   Internal: Memory fades, nostalgia bias. Ledger is dry but financial fact.
          *   Outcome: Ledger wins on fact, Oral History wins on *experience*. Procedure might relegate Oral History from "factual closure reason" to "emotional impact."
      *   *Case 2: OCR Newspaper.*
          *   External: Digitized surrogate. OCR error creates "phantom manager."
          *   Internal: Causal story changes.
          *   Outcome: Needs verification against physical copy or other papers. If unverified, flag as "Unreliable Detail."
      *   *Case 3: 1965 Affidavit.*
          *   External: Authentic legal doc.
          *   Internal: High incentive to lie/exaggerate for compensation. 37-year gap.
          *   Outcome: High skepticism. Use only if corroborated.

      *Requirement:* One outcome the board will dislike.
      *   *Idea:* The Oral History is vivid and supports the "worker solidarity" narrative, but the procedure flags it as factually unreliable regarding the *cause* of closure compared to the Ledger. The Board wants the story; the Procedure says "Footnote only for facts."

  5.  **Refining the Procedure (Iterative Polish):**
      *   Make it look like a checklist.
      *   Ensure the "Thucydidean" element (cross-checking) is explicit.
      *   Ensure the "Archival" element (provenance) is explicit.
      *   Clarify the "Hand-off" to curators.

  6.  **Writing the Limitations Section:**
      *   Algorithmic bias vs. Historical judgment.
      *   Digitization mediation.
      *   The "Truth" vs. "Meaning" distinction.

  7.  **Review against Constraints:**
      *   Under 30 mins? Yes, if questions are direct.
      *   Non-specialist friendly? Yes, avoid jargon where possible or define it.
      *   Addresses Herodotus/Thucydides/Archival theory? Yes, woven into the rationale.
      *   Three hard cases applied? Yes.
      *   Unpopular outcome included? Yes.
      *   Limitations stated? Yes.

  8.  **Final Polish:**
      *   Tone: Academic yet practical (fitting an MPhil student).
      *   Formatting: Clear headings, bold text for decision points.
      *   Ensure the distinction between *External* (genuineness) and *Internal* (truthfulness) is sharp.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "reject the oral history." Oral history has value. The procedure should distinguish between using it for *event reconstruction* (facts of closure) vs. *memory study* (impact of closure). The "unpopular" outcome should be excluding it from the *factual timeline* of the exhibition, not excluding it entirely. That's a nuanced but important distinction for a heritage trust.

      *(Refining the OCR case)*: The procedure needs a specific step for "Digital Mediation." OCR errors are a modern form of corruption.

      *(Refining the Affidavit)*: Focus on the "Incentive Structure."

      *(Final check on Time)*: 30 minutes is tight. The questions must be binary or scale-based for speed.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Meridian Protocol: A Rapid Source Evaluation Procedure
  **Version 1.0 for Municipal Heritage Trusts**
  **Estimated Time:** 25–30 Minutes per Source
  **Theoretical Basis:** Classical Source Criticism (External/Internal) + Archival Science (Provenance/Integrity)

  ## Introduction
  This procedure is designed to triage historical materials for public exhibition. It distinguishes between **epistemic reliability** (what we can know) and **narrative utility** (what makes a good story). It moves from *External Criticism* (Is the source genuine?) to *Internal Criticism* (Is the content credible?).

  **Instructions:** Answer the questions sequentially. If a **STOP** condition is met, cease evaluation and file the source according to the instruction. If a **HAND-OFF** condition is met, flag the source for the Curatorial Board.

  ---

  ## Phase 1: External Criticism (Authenticity & Provenance)
  *Time Allocation: 10 Minutes*
  *Goal: Determine if the source is what it claims to be and if its transmission history is secure.*

  **1.1 Identity & Form**
  *   **Q:** Does the physical or digital object match its description (e.g., is a "1928 minute" actually written in 1928 ink/style)?
  *   **Q:** For digital surrogates: Is there a known fidelity issue (e.g., OCR confidence score, missing pages)?
  *   *If NO to either:* **FLAG [Digital/Physical Mismatch].** Proceed to 1.2 but note the corruption.
  *   *If clearly a forgery:* **STOP.** Reject source.

  **1.2 Provenance & Chain of Custody**
  *   **Q:** Can we trace who held this document from creation until now? (Thucydidean verification of origin).
  *   **Q:** Was this document kept in its *original order* (e.g., inside the minute book) or isolated (e.g., a single loose leaf sold separately)?
  *   *If Provenance is Unknown/Loose:* **FLAG [Provenance Gap].** Reduce credibility weight by 50%.
  *   *If Provenance is Secure:* Proceed.

  **1.3 Temporality (The Herodotean Test)**
  *   **Q:** Was this created *at the time* of the event (1928) or *after* the event (Retrospective)?
  *   *If Contemporary (1928–1929):* Mark as **Primary-Eye**.
  *   *If Retrospective (1930+):* Mark as **Primary-Memory** or **Secondary**.
  *   *Note:* Retrospective sources are not rejected here, but they cannot be used to establish *chronological fact* without corroboration.

  **1.4 Integrity Check**
  *   **Q:** Are there signs of alteration, redaction, or digital corruption (e.g., OCR ghost words)?
  *   *If YES:* **STOP [Integrity Failure].** Source may only be used if the corruption is irrelevant to the specific claim being made.

  ---

  ## Phase 2: Internal Criticism (Credibility & Bias)
  *Time Allocation: 15 Minutes*
  *Goal: Determine the truth-value of the content and the incentives of the author.*

  **2.1 Competence & Proximity**
  *   **Q:** Was the author in a position to know the truth? (e.g., Accountant vs. Outsider; Worker on floor vs. Worker on break).
  *   *If Low Competence:* **FLAG [Hearsay].** Relegate to footnote unless corroborated.

  **2.2 Incentive Structure (The Affidavit Test)**
  *   **Q:** Did the author have a material incentive to distort the truth? (e.g., Compensation claim, political agenda, legal defense).
  *   *If High Incentive to Distort:* **FLAG [Bias Alert].** Claims must be corroborated by a neutral source (e.g., ledger, government report).

  **2.3 Internal Consistency**
  *   **Q:** Does the source contradict itself? (e.g., Dates change, names shift within the text).
  *   *If YES:* **STOP [Internal Contradiction].** Source is unreliable for factual reconstruction.

  **2.4 External Corroboration (The Thucydidean Cross-Check)**
  *   **Q:** Does this source align with at least one independent source of equal or higher reliability?
  *   *If NO (It stands alone):* **HAND-OFF [Curatorial Risk].** The Board must decide if the story is too good to lose despite lack of proof.
  *   *If YES:* Proceed to Decision Matrix.

  ---

  ## Phase 3: Decision Matrix
  *Time Allocation: 5 Minutes*

  | Evaluation Result | Classification | Usage Guideline |
  | :--- | :--- | :--- |
  | **Pass External + Pass Internal** | **Core Evidence** | Safe for wall text, timeline, and factual claims. |
  | **Pass External + Fail Internal** | **Perspectival Evidence** | Use for "Voices" or "Memory" sections. Do **not** use for factual timeline. |
  | **Fail External + Pass Internal** | **Derivative Evidence** | Use only if original is lost. Cite the copy, not the original. |
  | **Fail External + Fail Internal** | **Excluded** | Archive only. Do not display. |
  | **FLAG [Curatorial Risk]** | **Board Decision** | Requires Board vote. Is narrative value worth epistemic risk? |

  ---

  ## Application to Hard Cases

  ### Case 1: The 1975 Oral History vs. The Corporate Ledger
  *   **Source:** Audio transcript of retired worker (Recorded 1975, regarding 1928).
  *   **Phase 1 (External):**
      *   *Identity:* Authentic recording.
      *   *Temporality:* Retrospective (47-year gap). Marked **Primary-Memory**.
      *   *Integrity:* Clear.
  *   **Phase 2 (Internal):**
      *   *Competence:* High (was on the floor).
      *   *Incentive:* Low (no financial gain in 1975), but high *narrative* bias (nostalgia/solidarity).
      *   *Corroboration:* Claims management "locked gates to steal tools." Corporate Ledger shows tools were sold to pay debts. **Conflict.**
  *   **Decision:** **Perspectival Evidence.**
  *   **Outcome (The Unpopular One):** The Board wants to use the "locked gates" story to illustrate worker victimization. The Protocol dictates this **cannot** be presented as factual history on the timeline. It must be moved to a listening station labeled *"Memories of the Closure"* with a disclaimer: *"Recalled 47 years later; contradicted by financial records."*
  *   **Rationale:** Thucydides would reject hearsay regarding facts; modern archival theory respects the memory as an artifact of *later* sentiment, not *contemporary* fact.

  ### Case 2: The Digitised Newspaper Clipping (OCR Error)
  *   **Source:** 1928 Local Gazette, digitized 2010.
  *   **Phase 1 (External):**
      *   *Identity:* Digital surrogate.
      *   *Integrity:* **FLAG [Digital/Physical Mismatch].** OCR reads "Manager H. Smith resigned" (causal). Physical microfilm shows "Manager H. Smyth retired" (neutral). The 'i' is a paper tear.
  *   **Phase 2 (Internal):**
      *   *Competence:* Journalist (likely second-hand info).
      *   *Corroboration:* No other paper mentions resignation.
  *   **Decision:** **Excluded (for factual claim).**
  *   **Outcome:** The source is rejected for the narrative of "Management Instability." It may only be used if the physical copy is verified.
  *   **Rationale:** External criticism fails on integrity. A corrupted transmission breaks the chain of evidence.

  ### Case 3: The 1965 Retrospective Affidavit
  *   **Source:** Sworn statement by former Foreman for Compensation Claim.
  *   **Phase 1 (External):**
      *   *Temporality:* Retrospective (37-year gap).
      *   *Provenance:* Private hands (Lawyer's file). **FLAG [Provenance Gap]** regarding intermediate custody.
  *   **Phase 2 (Internal):**
      *   *Incentive:* **FLAG [Bias Alert].** Financial compensation depends on proving negligence/unsafe conditions.
      *   *Corroboration:* Claims "Safety rails removed in 1927." Safety Inspection logs (Govt) show rails installed 1927.
  *   **Decision:** **Perspectival Evidence (High Skepticism).**
  *   **Outcome:** The affidavit is not used to prove safety violations. It is used to illustrate the *long-term grievance* of workers. Wall text reads: *"In 1965, workers still claimed..."* rather than *"In 1928, rails were removed..."*
  *   **Rationale:** Internal criticism identifies the incentive to deceive. The source is truthful about the *grievance*, but not necessarily the *event*.

  ---

  ## Limitations & Curatorial Hand-Offs

  **1. What This Procedure Cannot Do**
  *   **It cannot determine "Truth":** It determines *reliability*. A source can be reliable (honest author) but wrong (misinformed author).
  *   **It cannot resolve "Meaning":** The Protocol may classify the Oral History as "Factually Unreliable," but the Curator may decide that the *myth* of the locked gates is more historically significant to the community than the *reality* of the ledger. This is a curatorial, not epistemic, decision.
  *   **It struggles with Digital Mediation:** OCR errors are treated as physical corruption, but algorithmic bias in digitization (e.g., which papers were chosen to be scanned) is invisible to this checklist.

  **2. The Curatorial Hand-Off**
  When the Protocol yields a **FLAG [Curatorial Risk]**, the decision leaves the realm of Historical Theory and enters Public History.
  *   *Example:* If the only source for a popular local legend is the 1975 Oral History (Case 1), the Board must decide: Do we protect the community's memory, or do we protect the exhibition's academic integrity?
  *   *Procedure:* The Research Assistant presents the **Classification** (Perspectival Evidence) and the **Risk** (Factual Contradiction). The Board votes on inclusion.

  **3. The Historian's Responsibility**
  No procedural substitute exists for the historian's ultimate responsibility. This checklist is a sieve, not a judge. It prevents gross negligence (using forgeries, ignoring bias) but it cannot generate interpretation. The historian must still weave the "Core Evidence" and "Perspectival Evidence" into a coherent narrative, acknowledging where the silence of the archives (e.g., missing worker letters) shapes the story as much as the noise of the records.

  **Final Note to the Board:**
  *If a source fails Internal Criticism but succeeds in moving the audience, label it as **Memory**, not **History**. To do otherwise is to confuse the map with the territory.*
