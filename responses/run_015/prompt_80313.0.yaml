          *   Let's go with 5/10. "Good intuition, fatal technical errors." Or 6/10 to be generous about the AC identification and Statement. Let's aim for 6/10. It's a "C" grade proof. It shows they attended lecture but didn't master the details.

      *   *Refining the Grade:*
