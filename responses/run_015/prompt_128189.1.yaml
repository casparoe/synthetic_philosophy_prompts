answer: |-
  Hey, this is a really solid instinct. You're right to worry about the bot just shuffling words. If the bot says "crisis" but it's just matching patterns without knowing what a crisis *feels* or *looks* like, you risk missing real danger or crying wolf too often.

  "Causal Tethering" is a great name for it. For Maria, we just need to translate that into "Can we touch this?"

  Here is a draft you can copy/paste into your internal wiki or print out for her desk. It's designed to take under 15 minutes, requires zero tech skills, and clearly marks where she needs to make a judgment call versus following a rule.

  ***

  # The Tether Test: AI Flag Audit
  **Who:** Maria (or on-call case worker)
  **Time limit:** 15 minutes max per ticket
  **Goal:** Decide if the AI's label is real or just noise.

  ### Part 1: The Checklist
  *Read the tenant message and the AI's tag. Answer these four questions in order.*

  **1. Is there anything here that isn't text?**
  *   **Yes:** (Photo, video, audio clip, sensor log, attached inspection report). Go to Q2.
  *   **No:** (It's just chat logs, emails, or notes). **STOP.** Mark as **FLOATING**. Go to Part 3 (Decision).

  **2. Does the non-text proof match the word?**
  *   *Example:* AI tags "Mold." Photo shows black spots on drywall. (Match)
  *   *Example:* AI tags "Mold." Photo shows a water stain but no fuzz/growth. (No Match)
  *   **Match:** Go to Q3.
  *   **No Match:** Mark as **FLOATING**. Go to Part 3 (Decision).

  **3. Can a human verify this without guessing?**
  *   If we send an inspector/manager, will they be able to say "Yes, this is definitely X" based on what we have now?
  *   **Yes:** Mark as **GROUNDED**. (Sign off: *Verified by Audit*).
  *   **No:** (e.g., The photo is blurry, or the description is subjective). Mark as **FLOATING**. Go to Part 3 (Decision).

  **4. The "So What?" Check (Value Call)**
  *   *Only answer this if you marked FLOATING above.*
  *   Even though we can't prove it with evidence yet, is the risk of ignoring it too high?
  *   **Low Risk:** (e.g., "The wifi is slow" tagged as "Unsafe Conditions"). **HARD NO.** Dismiss the tag.
  *   **High Risk:** (e.g., "He threatens me" tagged as "Abuse"). **ESCALATE.** Bump to Tech Lead/Senior Case Worker.

  ---

  ### Part 2: Examples (How to use it)

  Here is how this plays out with the two categories we see most often.

  #### Case A: "Mold Infestation" (Usually Grounded)
  *   **Tenant Message:** "The bathroom ceiling is dripping black stuff. Here is a pic." [Attaches Photo]
  *   **AI Tag:** `Mold Infestation`
  *   **The Audit:**
      1.  **Non-text?** Yes, there is a photo.
      2.  **Match?** Yes, photo shows fungal growth, not just dirt.
      3.  **Verifiable?** Yes, an inspector can go look and confirm.
      4.  **Result:** **GROUNDED.**
  *   **Action:** Maria signs off. The tag stays. We treat this as a fact.

  #### Case B: "Emotional Abuse" (Usually Floating)
  *   **Tenant Message:** "He won't let me sleep and screams when I try to leave. I'm scared." [No attachments]
  *   **AI Tag:** `Emotional Abuse`
  *   **The Audit:**
      1.  **Non-text?** No. Just text.
      2.  **Match?** N/A (Chain broken at step 1).
      3.  **Verifiable?** No. We weren't there. We don't have audio.
      4.  **Result:** **FLOATING.** (The word "Abuse" is not grounded in physical evidence).
  *   **Action:** **ESCALATE.**
      *   *Why?* Even though the *word* isn't grounded (it's just a claim), the *danger* is real. Maria marks it "Floating - High Risk" and bumps it to a human counselor. The bot doesn't get to decide this is true, but it gets to raise the hand.

  ---

  ### Part 3: The "Safety Override" (The Exception)
  *This is the most important part for you to understand, Maria.*

  Sometimes the audit says **"This word is floating"** (meaning: the bot can't prove it's true), but we **still want the flag active.**

  **The Rule:**
  If the category involves **immediate physical safety or legal liability** (Abuse, Threats, Weapons, Gas Leaks), a **FLOATING** result does *not* mean "Ignore." It means "Human Review Required Immediately."

  *   **Why?** Because waiting for "grounded" proof (like a police report or a broken lock) might be too late.
  *   **Maria's Job:** You aren't verifying the *truth* of the abuse in 15 minutes. You are verifying that the *claim* is serious enough to wake a human up.
  *   **Tech Lead's Job:** If you bump it to me as "Floating - High Risk," I know the bot is guessing, but I also know we can't turn the bot off for that category.

  ---

  ### Part 4: What This Test Can't Catch (Blind Spots)
  *Be honest with yourself. This checklist doesn't solve everything.*

  1.  **The Lie:** A tenant can send a fake photo or lie in text. This test checks if the word is *tethered*, not if the tether is *honest*. We assume good faith, but know that "Grounded" doesn't always mean "True."
  2.  **The Context:** Sarcasm. If a tenant writes "Great, another leak, just what I needed lol," the bot might miss the "Unsafe Condition" because the sentiment looks positive. This test won't catch that.
  3.  **The Drift:** Language changes. If tenants start using a new slang word for "eviction threat" next month, the bot won't know it, and this audit won't catch it until a ticket slips through.
  4.  **Your Gut:** If you read a ticket and it feels "off" but it passes the checklist, **trust your gut.** Bump it to me. The checklist is a floor, not a ceiling.

  ***

  ### Notes for You (The Tech Lead)

  *   **Why this works:** It separates *epistemology* (is this true?) from *triage* (do we act?). Maria often gets stuck trying to be a judge. This tells her she's just a gatekeeper.
  *   **The "Floating" Label:** I made sure to emphasize that "Floating" isn't a failure of the tenant; it's a status of the *data*. This reduces bias.
  *   **The Exception:** I embedded the "Emotional Abuse" example as the specific case you asked for. The audit fails it (no physical tether), but policy overrides the audit (safety first).
  *   **Implementation:** Put this in a shared doc. Have Maria run 5 past tickets through it with you once to calibrate. If she hits "Escalate" more than 20% of the time, the bot is too noisy and needs retraining, not more auditing.
