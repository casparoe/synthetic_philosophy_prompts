      *   **Current Practices/Rules:**
          *   Stake a fixed fraction of current bankroll (not fixed sum).
          *   Fraction determined by a rule (edge/price) maximizing expected logarithm of money (Kelly Criterion), but halved due to uncertainty.
          *   Reject good expected value (EV) bets if stake is too large relative to bankroll; accept same bet at smaller stake.
          *   Judge success by year-on-year geometric growth rate, not average profit per bet.
          *   Charter clause: Maximize growth rate in futures where the fund still exists (avoid ruin).
          *   Goal: Be the largest club at the 25th reunion.
          *   Disagreement: Is "largest" same as "grow fastest"? Does being behind near the end justify negative EV bets?
      *   **Questions to Address:**
          *   What does this presuppose about rational choice over time vs. plain expected money?
          *   Does it presuppose risk aversion or diminishing marginal utility?
          *   What does "going broke" mean in this context (ruin vs. poverty)?
          *   Does bankroll include future income (salaries)?
          *   Is "being largest" same as "growing fastest"?
          *   Where are the rules philosophically underdetermined?
          *   What changes if switching to max expected cash return?
      *   **Constraints:**
          *   British English.
