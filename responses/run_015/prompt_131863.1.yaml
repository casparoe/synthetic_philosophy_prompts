answer: |-
  1. Your practices presuppose that rational choice over time requires maximising the geometric growth rate rather than the arithmetic expected value, because volatility drag ensures that the latter leads to ruin in repeated betting.
  2. This approach does not necessarily imply psychological risk aversion or that additional money means less to you, but rather acknowledges that avoiding an absorbing state of zero wealth is a prerequisite for any future growth.
  3. Treating ruin as qualitatively different from mere poverty presupposes that your bankroll is isolated from external income, for if salaries could replenish losses, wiping out the fund would be a temporary setback rather than a permanent end.
  4. Being the largest at the reunion is not identical to growing fastest, since a club lagging near the end might rationally abandon growth-maximising rules to gamble on negative expected value bets in a desperate attempt to catch up.
  5. The half-Kelly stake is underdetermined by theory alone, reflecting prudence rather than logic, and switching to expected cash would compel you to stake everything on positive bets, rendering your survival clause meaningless.
