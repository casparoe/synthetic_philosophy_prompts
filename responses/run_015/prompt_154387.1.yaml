answer: |-
  There is no single, universally canonical technical term that captures this *exact* dialectical maneuver in the way "Ad Hominem" captures a specific fallacy. However, your observation is sharp and identifies a well-recognized structural instability in the literature. The pattern you describe is a hybrid of a rhetorical strategy, a methodological immunization, and a metaphysical inconsistency.

  To articulate this in your work, you should triangulate three existing concepts and then propose a precise label for the specific failure mode you have identified.

  ### 1. The Rhetorical Structure: The Motte-and-Bailey Doctrine
  The most accurate existing label for the *oscillation* you describe is the **Motte-and-Bailey Doctrine** (originally coined by Norman Swartz, popularized in philosophy by Nicholas Shackel).

  *   **The Bailey (The Bold Claim):** "Phenomenon $P$ is *nothing but* mechanism $M$." (e.g., "Consciousness just is neural dynamics," "Macroeconomics is just micro-interactions.") This is the position they occupy when making positive explanatory claims to claim scientific success.
  *   **The Motte (The Defensible Claim):** "Complex systems exhibit emergent features that are not trivially derivable from the base level." (e.g., "First-person reports are complex overlays," "Institutional properties are emergent.") This is the position they retreat to when confronted with counterexamples.
  *   **The Maneuver:** When challenged on the Bailey (e.g., "How do neural dynamics explain qualia?"), they retreat to the Motte ("We admit qualia are emergent/complex"). When the challenge passes, they slide back to the Bailey ("Therefore, we have explained consciousness").

  While originally a general philosophical fallacy, it has gained traction in philosophy of science to describe exactly this kind of level-shifting defense.

  ### 2. The Methodological Structure: A Conventionalist Stratagem
  In the Popperian and Lakatosian tradition, this is a specific type of **Immunization Strategy** or **Conventionalist Stratagem**.

  *   **Distinction from Standard Auxiliary Hypotheses:** As you noted, a standard auxiliary hypothesis adjusts a boundary condition (e.g., "The model fails at high temperatures"). Your pattern involves **Ontological Reclassification**. The researchers are not adjusting the *conditions* under which the theory holds; they are redefining the *ontology* of the counterexample to exclude it from the theory's domain.
  *   **Lakatosian Context:** In a Research Programme, the "protective belt" usually consists of auxiliary hypotheses. Here, the protective belt is a **categorical exception**. It is more robust than a standard auxiliary because it appeals to a metaphysical category ("Emergence") rather than a physical parameter.

  ### 3. The Metaphysical Context: Kim's Exclusion Problem
  The logical tension you identify is formally articulated in Jaegwon Kim's work on **Non-Reductive Physicalism**, specifically the **Causal Exclusion Argument**.

  *   Kim argues that you cannot consistently hold both that (a) the physical base is causally closed (Reduction) and (b) the emergent feature has distinct causal powers (Emergence).
  *   The researchers you observe are attempting to occupy what Kim calls the **"Unstable Middle."** They want the ontological parsimony of reduction (to claim success) without the eliminative consequences of reduction (to save the phenomena).
  *   In the literature, this is often discussed as the **"Dilemma of Non-Reductive Physicalism."** However, this usually refers to the *position*, whereas you are describing the *dialectical move* used to sustain the position against criticism.

  ### Proposed Characterization and Labeling
  Since there is no single noun for this, I recommend characterizing it by its logical structure and adopting a descriptive label for your paper.

  **Logical Structure:**
  1.  **Reductionist Assertion:** $P \subseteq M$ (Phenomenon is contained in Mechanism).
  2.  **Falsifying Observation:** $F \in P$ but $F \not\subseteq M$.
  3.  **Immunization Move:** Reclassify $F$ as $E$ (Emergent), where $E \notin M$ by definition.
  4.  **Scope Restriction:** Redefine the success condition of the reduction as accounting for $P \setminus F$.
  5.  **Restored Assertion:** Maintain $P \subseteq M$ for all *reducible* aspects, while treating $E$ as ontologically real but explanatorily secondary.

  **Suggested Labels:**
  If you need a technical term to coin or adopt for your thesis, the following are precise and defensible:

  1.  **"Immunized Reductionism"**: This highlights the methodological function (protecting the theory from falsification).
  2.  **"Selective Ontological Commitment"**: This highlights the inconsistency (committing to reduction when convenient, emergence when necessary).
  3.  **"The Emergence Shield"**: A more informal but vivid label for the defensive clause.
  4.  **"Strategic Emergentism"**: This captures the instrumental use of emergence not as a positive theory, but as a defensive resource.

  **Recommendation for Your Paper:**
  I suggest framing it as **"The Motte-and-Bailey of Reductionist Explanation."** This immediately signals to readers that you are identifying a rhetorical oscillation between a strong claim (total reduction) and a weak claim (partial emergence).

  You can distinguish it from standard *ad hoc* adjustments by emphasizing that **the exception is categorical, not parametric.** An *ad hoc* hypothesis says, "The law holds except when variable $X > 5$." Your pattern says, "The law holds except for features we decide to classify as 'Emergent'." Because "Emergent" is defined negatively (as "not reducible"), this renders the reduction claim unfalsifiable in principle.

  ### Key References to Cite
  To ground this in the literature, you should engage with:
  *   **Jaegwon Kim:** *Physicalism, or Something Near Enough* (on the instability of non-reductive physicalism).
  *   **Imre Lakatos:** *Falsification and the Methodology of Scientific Research Programmes* (on protective belts and immunization).
  *   **Nicholas Shackel:** "The Motte-and-Bailey Fallacy" (for the rhetorical structure).
  *   **Philip Kitcher:** "1953 and All That: A Tale of Two Sciences" (on "Promissory Reductionism," though note your case is stronger—they claim *current* success).
  *   **William Wimsatt:** "Reductionism and its Heuristics" (on aggregativity vs. emergence).

  ### Summary
  You have identified a genuine failure mode that often slips through peer review because it mimics the nuance of "multi-level explanation." The most accurate way to label it is as a **Conventionalist Stratagem of Ontological Reclassification**, best understood rhetorically as a **Motte-and-Bailey maneuver** between Reduction and Emergence. For your own terminology, **"Immunized Reductionism"** or **"Selective Ontological Commitment"** will serve you well.
