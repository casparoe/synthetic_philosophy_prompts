answer: |-
  When fire kisses skin the flesh recoils,
  The sting commands a cry, the mind obeys.
  The hurt is one with nerves set all ablaze,
  No space exists where suffering uncoils.
  No neutral ground within the pain's dark coils,
  We flee the blade through all our nights and days.
  And dread is woven into sensory ways,
  The message bears the wound and all its spoils.

  But sever where the feeling binds to fear,
  And see the patient smile beneath the knife.
  "It stings," she says, "but nothing suffers here,"
  She maps the spot, indifferent to the strife.
  The badness is no property of sense,
  But how the mind constructs the consequence.
