prompt: |-
  hey — you're an expert on housing policy and zoning, and also on political philosophy (property, membership, who a city is *for*), and on top of that you write really good dialogue. take your time with this one: brainstorm for a bit before drafting, and don't just give me the first version that occurs to you, its driving me nuts when that happens.

  I'm writing a novel and I've been stuck on one scene for like four days. It's on the roof of a rent-stabilized walk-up in a fictional mid-sized Rust Belt city, the night before the city council votes on a 46-unit building going up on the lot next door. Two characters, both sharp, neither of them a villain or a cartoon.

  Miriam is 67, retired school-bus driver, 41 years in the building, president of the tenants' assocation. Dev is 32, a housing planner in the city's own office; he built the model behind the new rule they're arguing about. I made the rule up, so here's how it works:

  - The Remainder Rule: when a project needs neighborhood sign-off, each eligible resident's vote gets weighted by how many more years they declare they expect to live in the neighborhood, re-declared every year. Renters and owners count the same, and owning the parcel doesn't buy a separate vote.
  - The clawback: if you leave sooner than you declared, your past votes get recalculated, and an outcome already decided can be reopened within five years.
  - The part I want them actually fighting about: whether people who don't live there yet — the family on the waitlist, the ones who'd move in if it got built — get any weight at all. Dev thinks they have to, that the city owes something to people who need to arrive, and that a rule counting only people already inside rigs the question. Miriam thinks you can't hand a vote to a ghost, and that whatever claim exists here was earned by the people who stayed through the years when nobody wanted to arrive.

  Complication: Miriam quietly wants this building, which puts her against her own association, and she's also half-considering moving to Cleveland to help with a grandkid — so declaring a long horizon is either a lie or an actual decision about her life. Dev has run the numbers and knows the project only survives if she declares long, and he hasn't mentioned the clawback to her.

  Give me 600–900 words of dialogue. Constraints: no strawmen — Miriam should land at least two genuinely damaging points and Dev should concede something he really believes, not a throwaway; nobody monologues past about 120 words; the machinery of the rule should come out through the argument rather than an info-dump; and no citations, no studies, no real city names, no named theorists, no statistics — I don't want it to read like a twitter thread from 2021 and I want it to still work for a reader in twenty years. End on a line I could close a chapter with: something one of them says that changes the situation rather than summing it up. And don't resolve who's right.
