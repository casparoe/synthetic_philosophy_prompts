  The wind off the lake cut through the chain-link fence. Below them, the lot was a dark mouth waiting to be fed. Dev held the clipboard against his knee, the paper fluttering.

  "The waitlist needs a weight, Miriam. Not a full vote, but enough to tip the scale."

  "You want to give voice to people who aren't here," Miriam said. She kept her hands in her coat pockets. "You want ghosts to decide who lives in the house."

  "I want the city to acknowledge obligation. If we only count the people inside the fence, we rig the question against anyone trying to get in. The rule isn't about presence. It's about duration."

  "Duration is earned." Miriam stepped closer to the edge, looking at the brickwork of her own building. "Forty-one years I've been in this stack. When the factories closed, when the lights went out on this block, who held the line? Us. The people who didn't leave. Now you're telling me a family on a list in Columbus has a claim equal to mine because they *need* a roof?"

  "Need is the point of housing."

  "Stability is the point of a home." She turned back to him. "You ask us to declare how long we'll stay. You weight the vote by the years. So if I say ten years, I count for ten. If I say one, I count for one. You're making us bet on our own lives to get a building built."

  Dev looked down at the form. "The model requires certainty to function. If you declare a long horizon, the project clears the threshold. Without your ten years, the density doesn't justify the cost."

  "So you need me to promise I won't die. Or that I won't go to Cleveland."

  Dev stiffened. "You said that was just a thought."

  "It's a thought that gets heavier every week. But look at what you're asking. If I sign this paper saying I'm here for ten years, and I leave in two... what happens to my vote? Does it vanish? Does it undo the vote count?"

  Dev hesitated. The wind whipped the clipboard paper. "The system has mechanisms to adjust for variance."

  "Mechanisms." Miriam laughed, a dry sound. "That's the second thing you're missing. You treat us like fixtures. You want the credit for my staying without accepting the risk of my leaving. You want the stability of a owner without giving me the equity. That's not planning, Dev. That's extraction."

  Dev lowered the clipboard. He looked tired, the streetlights catching the gray in his beard. "You're right. The model... it assumes we can contract for time. We can't. I built it to protect the future, but it treats the present like collateral."

  "It treats me like a prop."

  "I know."

  Miriam reached out and took the clipboard. She held the pen over the line where she was supposed to write the number of years. The lot below was silent.

  "If I put down ten years, and I move to help my daughter in twelve months, does this building get taken away?"

  Dev looked at her, really looked at her, and the silence stretched tight between them. "It opens the decision to review. For five years."

  Miriam nodded slowly. She didn't look surprised. She looked at the pen, then at the dark lot, then back at Dev.

  "I'm not putting down a number."

  "Miriam, without the weight—"

  "I'm writing 'unknown.' If the city can't plan for a woman who might move to be with her grandson, then the city doesn't deserve the building." She capped the pen and held it out to him. "You want the project? You convince the council that one uncertain old woman is worth more than ten certain ghosts."
