answer: |-
  Here is a seminar strategy designed to keep the conceptual categories distinct while using the text to stress-test them.

  ### Seminar Thesis: The Wedge Between Alienation and Exploitation
  **Core Argument:** *Bartleby* is not a story about the extraction of surplus value; it is a story about the collapse of the *will* to labor under capitalist social relations. Use the text to drive a wedge between the **1844 Manuscripts** (phenomenological alienation) and **Capital** (structural exploitation).

  The seminar should argue that Bartleby demonstrates **alienation without strict exploitation**. This is not a failure of Marx, but a historical anticipation of the "service/circulation" economy that Marx's strict definition of *productive labor* in *Capital* struggles to categorize. The Lawyer is not a capitalist in the *Capital* sense (he does not advance money to generate surplus value; he spends revenue to manage titles/debts). Therefore, Bartleby is not producing surplus value. He is, in Marx's strict terms, an unproductive laborer (like a domestic servant).

  **The Payoff:** If Bartleby is not being "exploited" (in the *Capital* sense), why is he so utterly alienated (in the *1844* sense)? This suggests that the *social relation* of wage labor produces existential devastation even where the *valorization* mechanism is absent. The story captures the *affect* of capitalist labor that the economic formulas miss.

  ---

  ### Part 1: Alienation vs. Exploitation (The Theoretical Split)
  **The Trap:** Students will say, "The Lawyer exploits Bartleby."
  **The Correction:** Ask them to define the Lawyer's business. He deals in bonds, mortgages, and title deeds. This is the sphere of *circulation*, not production.
  *   **Marx (*Capital* Vol 1 & 2):** Productive labor produces surplus value for capital. Unproductive labor is paid out of revenue (income). The Lawyer appears to be a rentier/professional spending income, not a capitalist accumulating capital.
  *   **The Text:** Bartleby copies documents that are already written. He adds no value; he merely replicates.
  *   **The 1844 Lens:** This is where Marx fits perfectly. Bartleby is alienated from the **product** (he owns nothing), from the **activity** (mechanical copying), from **species-being** (he ceases to be a creative human), and from **others** (isolation in the office).
  *   **Discussion Point:** If the exploitation lens "misfires" because the labor is unproductive, does that make the alienation *worse*? Bartleby is suffering the psychic toll of capitalist labor without even being part of the "revolutionary subject" (the industrial proletariat). He is alienated from a function that is essentially useless.

  ### Part 2: The Refusal and the Body (Turkey & Nippers)
  **The Refusal:** "I would prefer not to" is not a strike.
  *   **Strike:** A collective bargaining tactic within the system. It assumes the validity of the wage relation but disputes the terms.
  *   **Bartleby's Refusal:** A withdrawal of *labor power* itself, but without leaving the marketplace. He stays in the office. He occupies the means of administration without using them. This is not political; it is ontological. He withdraws his *will*.
  *   **Turkey and Nippers:** Use them to show what "successful" exploitation looks like.
      *   **Turkey:** Functional morning, broken afternoon.
      *   **Nippers:** Irritable morning, functional afternoon.
      *   **The Pair:** Together, they make one perfect working day. They represent the **physical consumption of the worker**. The Lawyer manages their bodies to maximize output. They accept the logic of the workplace; their bodies just fail.
      *   **Contrast:** Bartleby's body doesn't fail; his *compliance* fails. Turkey and Nippers show the *cost* of labor (exploitation); Bartleby shows the *negation* of labor (alienation).

  ### Part 3: Where the Reading Resists (The Limits of Marx)
  Be honest about where the materialist framework hits a wall.
  1.  **The Narrator's Conscience:** Marx would call the Lawyer's reluctance to evict Bartleby "bourgeois sentimentality" or ideological mystification. But the text treats it as a genuine ethical crisis. The Lawyer is haunted, not just by a worker, but by a moral obligation Marx's economics doesn't account for.
  2.  **Refusal of Alternatives:** When the Lawyer offers Bartleby other jobs (bartending, checking deeds), Bartleby refuses. If this were purely about exploitation, he should accept better conditions. His refusal suggests the problem is *Labor itself*, not *this Labor*. This points toward a critique of work that exceeds Marx's goal of "liberating labor."
  3.  **The Dead Letter Office:** The final revelation that Bartleby worked with dead letters introduces a metaphysical layer (failed communication, death, spiritual isolation). This is theological/existential, not materialist.
  4.  **"Ah Humanity!":** The Lawyer's final cry universalizes the suffering. Marx insists on *class*; Melville points to *existence*. The story suggests the damage of capitalism leaks into the human soul in ways that class analysis alone cannot map.

  ### Conclusion: What the Novel Gives the Philosophy
  **Verdict:** The mismatch is the point.
  Marx provides the **anatomy** of the system (how value moves, how labor is categorized). Melville provides the **pathology** (what it feels like to be a cell in that body when the immune system fails).
  *   Marx argues that abolishing the wage relation ends alienation.
  *   Melville suggests that even within the wage relation, the human spirit can reach an impasse that economics cannot solve.
  *   **Final Thought for Students:** The story gives philosophy the *affect of the impasse*. Theory can explain why Bartleby is poor; it cannot explain why he starves rather than move. The novel holds open the question of the *will* that theory tries to close.

  ---

  ### Handout Selections (4 Passages)

  **1. The Material Setting (Alienation from Environment)**
  *   **Passage:** The opening description of the office and the walls. *"I was a man who, from his youth upwards, had been filled with a profound belief that all is vanity... The walls were astonishingly high... a great brick wall ten inches thick... looking at the dead brick."*
  *   **Why:** Establishes the material conditions of alienation before the dialogue begins. It grounds the "brick wall" Bartleby later stares at.

  **2. The First Refusal (Withdrawal of Will)**
  *   **Passage:** The first time Bartleby says no. *"I handed it to him. He took it, but did not look at it... 'I would prefer not to,' said he mildly and firmly."* Include the Lawyer's reaction (*"I sat staring at him"*).
  *   **Why:** Captures the moment labor power is withheld without a demand. It shows the disruption of the command structure.

  **3. Turkey and Nippers (The Physiology of Exploitation)**
  *   **Passage:** The description of their working rhythms. *"Turkey's face was of a fine florid hue... but after twelve o'clock... it blazed like a grate... Nippers... was troubled with an ambition... The morning was his evening... He was too nervous to be good for anything in the morning."*
  *   **Why:** Demonstrates how capital manages the biological limits of workers. Contrasts their physical compliance with Bartleby's spiritual refusal.

  **4. The Dead Letter Office (The Limit of Materialism)**
  *   **Passage:** The Lawyer's postscript. *"Dead letters! does it not sound like dead men?... On errands of life, these letters speed to all quarters of the earth; but Bartleby's errands were for the dead."*
  *   **Why:** The moment the text transcends the economic. It introduces death, futility, and the metaphysical, challenging the seminar to find a Marxist category for "dead letters."

  ---

  ### Opening Scene Recommendation
  **Open with Passage 1: The Description of the Walls.**

  **Reasoning:**
  If you open with "I would prefer not to," the seminar immediately becomes about the *dialogue* and the *refusal*. Students will jump straight to "resistance" and "agency."

  By opening with the **description of the office and the walls**, you ground the seminar in **material conditions**.
  1.  It forces students to look at the *environment* of labor before the *action* of labor.
  2.  It visually represents **Alienation** (the worker surrounded by barriers, staring at brick) before you introduce the economic theory.
  3.  It allows you to set up the distinction immediately: *"Look at this space. Is this a site of production (Capital) or a site of confinement (1844 Manuscripts)?"*

  **Instruction to Students:** "Read this description of the physical space. Without knowing anything about Bartleby yet, map the power relations in this room. Who is watching whom? Where is the light coming from? What does the wall do?" This primes them to see the office as a machine of alienation before you complicate it with the economics of exploitation.
