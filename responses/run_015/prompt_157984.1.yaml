      2. Reject (3)'s dichotomy.
      3. Reject (5)'s empirical claim (measurement $\neq$ relying on cancellation).
      4. Propose "Explanatory Salience" (Virtue Epistemology) as the non-modal alternative.
      5. Apply to the student.

