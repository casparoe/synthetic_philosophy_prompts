  **2. Relational Qualitative Hedonism vs. Pure Pro-Attitude Hedonism**
  If the "relation" in the qualitative view is constituted by a pro-attitude toward a sensation, the position loses its claim to being qualitative. The tree cannot cleanly separate these if the relational component is non-phenomenal.

  **3. Normatively Restricted Variants vs. Qualitative Uniformitarianism**
  If a Uniformitarian claims base pleasures are "less intense" rather than "different in kind," they mimic the Restricted view without changing the definition. The tree separates them by definition, but in practice, the empirical measurement of intensity often masks the normative distinction.
