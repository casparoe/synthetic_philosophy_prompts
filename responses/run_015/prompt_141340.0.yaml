prompt: |-
  I am a novelist, and the manuscript I am about to begin is built, more than any book I have written, out of borderline cases. Its scenes turn on a curfew that begins "at nightfall," on a will contested on the question whether the testator was "of sound mind," on a marriage alleged never to have been "consummated," on a figure glimpsed across a fogged street who is "elderly, or at any rate no longer young," on a witness's insistence that a man was "bald." In my previous novels such passages ran to perhaps sixty per book, I resolved each of them by ear, and my editor and I disagreed on something like a third. That is now too much to leave to instinct, and I would like a procedure in place of the ear.

  Two constraints fix what the procedure has to be. First, my copy editor will have to run most of it: she is exacting about prose and has no philosophy, so the procedure must be executable in about five minutes per passage, must not require her to know anything I have not written down, and must tell her when to stop and pass the passage to me. Second, some of these passages are read by a legal reader before the book goes to set, and I have to be able to tell him, in language he will accept, what commitment a given sentence carries; he will not accept "it is indeterminate" as an answer unless I can say what kind of indeterminacy and who, in the fiction, is answerable for it. I sign off on the rest myself.

  As I understand the two families of position I am choosing between: on the first, every vague predicate divides the world at some perfectly sharp boundary, borderline cases are cases where we do not know where the boundary falls, and the sentence in question has a determinate truth value we cannot reach — the explanation of why we cannot reach it even in favourable circumstances being a margin-for-error constraint on knowledge rather than anything about the words. On the second, the indeterminacy is in the language: there are many admissible ways of making the predicate precise, a borderline predication is true on some and false on others, and truth is truth on every admissible precisification. I am told that this second view has a consequence I do not know how to write around: because every classical tautology holds on every precisification, "P or not-P" is safe, while "neither P nor not-P" is not merely unsettled but false on every precisification — so the kind of sentence I rely on most, which says of a borderline state of affairs that it is neither one thing nor the other, comes out false rather than indeterminate. If I have either position wrong, or that consequence wrong, correct it briefly before building anything on it.

  One further feature of the manuscript is relevant, and it is the part I most want the procedure to earn its keep on. The book is framed as a dossier assembled by an in-world official I call the Reporter, who appends marginal notes to the scenes; some of those notes settle what the scene left open, by stipulating, for the purposes of the record, how a predicate is to be taken. I take it that a Reporter's note is, in the fiction, what a theorist would call a sharpening or precisification — stipulating one admissible way of taking the word rather than discovering a boundary. That means the book has a second question the earlier ones did not: whose sharpening a given sentence deploys, the narrator's, the character's, or the Reporter's, and whether an unmarked sharpening is available to me at all.

  So I am asking for a procedure, not an explanation. Give me the questions in the order they must be asked, with what counts as a sufficient answer to each; the point at which it halts and tells me to leave the sentence alone; the point at which it hands the decision to me because the remaining question is one of values rather than fact; and an honest account of which distinctions have to survive the simplification and which I can afford to lose in order to make it runnable by someone with five minutes and no theory. I want a one-page version my copy editor can hold, a handful of test lines she can apply to see whether she is running it correctly, and — because at least one such line is not vagueness at all but context-sensitivity, ambiguity, or mere ignorance — a first question that catches those and sends them elsewhere rather than forcing them through the rest of the procedure. I also want to know how the procedure handles a borderline case about a borderline case, and whether the stance I adopt must be constant across the book or may vary from passage to passage without the book breaking.

  Then run it on three passages from the draft. The first is the sentence I am fondest of: "It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which." I expect the procedure to tell me something about that sentence I will not like, and I would rather hear it now than in galleys. The second is the Reporter's note on the contested will: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say." The third is a piece of free indirect style: "The woman on the far pavement was elderly, or at any rate no longer young." For each, show the procedure arriving at an answer rather than stating one, and mark where, if anywhere, it stops short and I have to decide.

  Finally, tell me what the procedure cannot do. I would rather know now which of these passages will remain a matter of judgment, however carefully the rest is specified, than discover it when my editor and I are arguing about a page proof.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** A novelist, intellectually sophisticated, familiar with philosophical debates on vagueness (epistemicism vs. supervaluationism), concerned with practical workflow (copy editor, legal reader), and deeply invested in the thematic structure of their new manuscript (borderline cases, the "Reporter" character).
      *   **Task:** Create a *procedure* (algorithm/flowchart) for handling vague predicates in the manuscript.
      *   **Constraints:**
          1.  Copy editor must run it (5 mins/passage, no philosophy knowledge, needs clear stop/pass signals).
          2.  Legal reader needs to understand the commitment (truth values, indeterminacy types).
          3.  Must address the specific philosophical tension: Epistemicism (sharp boundary, unknown) vs. Supervaluationism (truth on all precisifications, "P or not-P" holds, "neither P nor not-P" is false).
          4.  Must account for the "Reporter" character who stipulates precisifications in marginal notes.
          5.  Must distinguish vagueness from ambiguity/context-sensitivity/ignorance.
          6.  Must handle higher-order vagueness (borderline cases of borderline cases).
          7.  Must address consistency (can the stance vary?).
          8.  Must include a one-page version, test lines, and run the procedure on three specific draft passages.
          9.  Must admit limitations (what the procedure *cannot* do).
      *   **Tone:** Professional, precise, respectful of the user's expertise, practical but philosophically sound (without being jargon-heavy for the editor).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The User's Worry:* They correctly identify a key issue with Supervaluationism. If truth = truth on *all* admissible precisifications, then "P or not-P" is super-true (holds on all). Consequently, "Neither P nor not-P" is super-false (fails on all, because on every precisification, either P is true or not-P is true). This clashes with the novelist's desire to write sentences like "It was neither dusk nor night."
      *   *Epistemicism:* "It was neither dusk nor night" is simply false (there is a fact, we just don't know it).
      *   *The Conflict:* The novelist *wants* to write "neither/nor" sentences. Both standard theories say these are false (one because there's a fact, one because logic holds).
      *   *The Solution for the Procedure:* The procedure needs to categorize the *source* of the indeterminacy. Is it ontological (in the world), semantic (in the language), or narrative (in the Reporter's authority)?
      *   *The "Reporter" Twist:* The Reporter acts as a precisifier. If the Reporter says "For the record, this counts as night," that resolves the vagueness *within the fiction*. If the Reporter says "There is no fact," that asserts ontological indeterminacy (which might clash with logic depending on how the legal reader interprets "fact").
      *   *Strategy:* I need to design a decision tree that classifies the sentence type so the editor knows whether to flag it for the author (philosophical commitment) or fix it (clarity/consistency).

  3.  **Drafting the Procedure (The "Vagueness Protocol"):**
      *   *Step 1: Filter.* Is this actually vagueness? Or is it ambiguity ("bank"), context-sensitivity ("tall" for a jockey vs. basketball player), or simple ignorance ("I don't know if he's home")?
      *   *Step 2: Authority.* Who is speaking? Narrator? Character? Reporter?
      *   *Step 3: The "Neither/Nor" Check.* If the sentence denies the excluded middle ("Neither P nor not-P"), flag for Author. This is the danger zone the user identified.
      *   *Step 4: Reporter Intervention.* Is there a marginal note? If yes, the note wins (stipulation).
      *   *Step 5: Consistency.* Does this match the book's established stance?

  4.  **Addressing the Specific Constraints:**
      *   *Copy Editor:* Needs simple Yes/No questions.
      *   *Legal Reader:* Needs to know if a statement is "Factually True," "Logically True," "Stipulated," or "Narratively Indeterminate."
      *   *One-Page Version:* A condensed checklist.
      *   *Test Lines:* Examples to calibrate the editor.
      *   *Running the 3 Passages:*
          1.  "Neither dusk nor night..." (The problem child).
          2.  Reporter's note on the will.
          3.  Free indirect style ("elderly").

  5.  **Refining the Philosophical Accuracy (Crucial Step):**
      *   The user asks: *If I have either position wrong, or that consequence wrong, correct it briefly.*
      *   *Correction:* The user is largely right about Supervaluationism. "P or not-P" is super-true. "Neither P nor not-P" is super-false. *However*, in fiction, we can treat "Neither P nor not-P" as a report on the *state of knowledge* or *ontological indeterminacy* rather than logical truth. The procedure must distinguish between *logical form* and *narrative assertion*.
      *   *Epistemicism:* "Neither P nor not-P" is false because one is true.
      *   *Workaround:* The procedure should flag "Neither/Nor" sentences as requiring an *Authorial Decision* on whether to treat them as metaphorical, epistemic (we don't know), or ontological (world is fuzzy). The legal reader needs to know: "This sentence asserts ontological indeterminacy, which contradicts classical logic but is the theme of the work."

  6.  **Developing the "One-Page Version":**
      *   Keep it imperative. "Check this," "If Yes, do that."
      *   Avoid terms like "supervaluationism." Use "Precision Rule" or "Boundary Rule."

  7.  **Running the Passages:**
      *   *Passage 1 ("Neither dusk nor night"):* Fails the logic check. Editor must pass to Author. Author must decide: Is this poetic license or a philosophical claim?
      *   *Passage 2 (Reporter's Note):* This is a stipulation. It resolves the vagueness. Legal reader sees this as "Stipulated Fact."
      *   *Passage 3 ("Elderly..."):* Free indirect style. It reflects the character's uncertainty. It's epistemic, not ontological. Safe.

  8.  **Addressing "What the Procedure Cannot Do":**
      *   It cannot decide the *truth* of the matter.
      *   It cannot resolve the philosophical contradiction if the Author insists on "Neither/Nor" while demanding classical logic for the legal reader.
      *   It cannot detect higher-order vagueness reliably without Author input.

  9.  **Final Review against Constraints:**
      *   5 minutes? Yes, if flowchart is simple.
      *   No philosophy for editor? Yes, terms translated.
      *   Legal reader satisfied? Yes, categories provided.
      *   Reporter role included? Yes.
      *   Tone? Respectful, collaborative.

  10. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Supervaluationism:* I need to be careful. The user says "Neither P nor not-P" comes out false. That is correct in standard supervaluationism. I should validate this but offer the "Narrative Exception" as the workaround.
      *   *Editor's Role:* The editor isn't solving the philosophy; she's routing the problem. She identifies the *type* of sentence so the Author or Legal Reader can deal with it.
      *   *Legal Reader Language:* Needs to be distinct. "Contingent," "Stipulated," "Indeterminate by Design."

      *(Self-Correction on the "Neither/Nor" issue)*: If the Author wants to keep "It was neither dusk nor night," and the Legal Reader demands classical logic, there is a conflict. The procedure must highlight this conflict so the Author can write a disclaimer or the Legal Reader can accept the fiction's internal logic. I will advise the Author that this sentence *must* be marked as "Ontologically Indeterminate" for the legal reader, acknowledging it violates bivalence.

      *(Refining the "First Question")*: Needs to catch ambiguity/context. "Can the word mean two different things (ambiguity) or does it depend on who is looking (context)?" If yes, not vagueness.

      *(Higher-Order Vagueness)*: "Is it unclear whether it's unclear?" The procedure should treat this as "Pass to Author."

      *(Consistency)*: Can the stance vary? Yes, if marked (e.g., by the Reporter). If unmarked, consistency is preferred for coherence.

      *Let's build the response.*
answer: |-
  ### Correction on the Philosophical Positions

  You have understood the positions correctly, including the consequence that worries you. On **Epistemicism**, "Neither P nor not-P" is false because there is a sharp boundary we cannot know; one disjunct is true. On **Supervaluationism**, "P or not-P" is super-true (true on all precisifications), so its negation, "Neither P nor not-P," is super-false.

  **The Workaround:** You are writing fiction, not logic. The procedure below treats "Neither P nor not-P" not as a logical claim but as a *narrative report* of indeterminacy. For the legal reader, this must be categorized as **Ontological Indeterminacy** (the world of the fiction lacks a fact) rather than **Logical Truth**. This violates classical logic but is permissible in fiction if flagged. The procedure will force you to flag it.

  ***

  ### The Vagueness Protocol (Full Version)

  **Goal:** Classify every vague passage for the Copy Editor (CE), Legal Reader (LR), and Author (You).
  **Time Limit:** 5 minutes per passage.

  #### Phase 1: The Filter (Run by Copy Editor)
  *Ask these questions in order. If "Yes" to any, stop and follow the instruction.*

  1.  **Ambiguity/Context Check:** Does the word have two distinct meanings (e.g., "bank") or does its meaning shift entirely based on a comparison class not present (e.g., "big" without saying "for a mouse" or "for a building")?
      *   **Yes:** This is not vagueness. Fix for clarity or pass to Author. **STOP.**
      *   **No:** Proceed to Q2.
  2.  **The "Neither/Nor" Check:** Does the sentence explicitly deny the excluded middle (e.g., "It was neither X nor not-X," "It was not the case that he was bald or not bald")?
      *   **Yes:** **HALT.** Pass immediately to Author. This requires a philosophical commitment. **STOP.**
      *   **No:** Proceed to Q3.
  3.  **The Reporter Check:** Is there a marginal note from the Reporter attached to this scene or predicate?
      *   **Yes:** The Note governs. Mark as **STIPULATED**. Pass to LR only if the Note contradicts the text. **STOP.**
      *   **No:** Proceed to Q4.
  4.  **The Source Check:** Is the vague predicate inside a character's thought/speech (Free Indirect Style) or the Narrator's objective report?
      *   **Character:** Mark as **EPISTEMIC** (Uncertainty of the character). Safe for LR. **STOP.**
      *   **Narrator:** Proceed to Q5.
  5.  **The Consistency Check:** Have we treated this predicate (e.g., "nightfall") as sharp elsewhere in the manuscript without a Reporter note?
      *   **Yes:** Flag for Author (Contradiction risk).
      *   **No:** Mark as **NARRATIVE VAGUENESS**. Safe for LR.

  #### Phase 2: The Commitment (For Author & Legal Reader)
  *When the CE passes a passage to you, you must assign one of these three codes for the Legal Reader:*

  *   **Code A (Epistemic):** "There is a fact, but the characters/narrator lack access." (Compatible with classical logic).
  *   **Code B (Stipulated):** "The Reporter has defined the boundary for the record." (Compatible with classical logic).
  *   **Code C (Ontological):** "There is no fact in the fiction." (Violates classical logic; requires LR acceptance of 'Truth-Value Gaps').

  #### Phase 3: Higher-Order & Consistency
  *   **Higher-Order Vagueness:** If a passage concerns whether a case is *borderline* (e.g., "It was unclear whether it was unclear"), treat as **Code C**. Pass to Author.
  *   **Variable Stance:** You may vary between Code A, B, and C across the book *only if* the source of the shift is marked (e.g., a shift from Narrator to Reporter). Unmarked shifts risk incoherence.

  ***

  ### The One-Page Version (For Copy Editor)

  **VAGUENESS PROTOCOL: COPY EDITOR CHECKLIST**
  *Do not use philosophy. Follow the arrows.*

  **1. IS IT AMBIGUITY?**
  (e.g., "He went to the bank" / "It was a big one" without context)
  *   **YES:** Correct for clarity. **DONE.**
  *   **NO:** Go to 2.

  **2. DOES IT SAY "NEITHER X NOR NOT-X"?**
  (e.g., "Neither dusk nor night" / "Not bald and not not-bald")
  *   **YES:** **STOP.** Do not edit. Highlight Yellow. Send to Author. Label: **"LOGIC FLAG."**
  *   **NO:** Go to 3.

  **3. IS THERE A REPORTER NOTE?**
  (Marginal note defining the term)
  *   **YES:** Ensure text matches note. If text conflicts, query Author. Label: **"STIPULATED."** **DONE.**
  *   **NO:** Go to 4.

  **4. WHO IS SPEAKING?**
  *   **CHARACTER (Thought/Dialogue):** Label: **"CHARACTER UNCERTAINTY."** **DONE.**
  *   **NARRATOR (Objective Description):** Go to 5.

  **5. IS IT CONSISTENT?**
  (Has this word been treated as precise elsewhere?)
  *   **YES:** Query Author: "Previously defined as precise."
  *   **NO:** Label: **"NARRATIVE VAGUENESS."** **DONE.**

  ***

  ### Test Lines (For Editor Calibration)

  1.  *"The door was open."* (Context: Door is ajar 3 inches).
      *   **Result:** Narrative Vagueness. (Pass).
  2.  *"He was either guilty or not guilty, though we couldn't say which."*
      *   **Result:** Character Uncertainty (Epistemic). (Pass).
  3.  *"It was neither guilty nor not guilty."*
      *   **Result:** **LOGIC FLAG.** (Stop, send to Author).
  4.  *"Reporter's Note: For this inquiry, 'open' means 'ajar by 2 inches or more'."*
      *   **Result:** Stipulated. (Check consistency).

  ***

  ### Running the Procedure on Your Draft

  #### Passage 1
  > "It was neither dusk nor night when they took him, and no one, least of all the sergeant, could have said which."

  *   **Step 1 (Ambiguity):** No. "Dusk" and "Night" are sorites series, not ambiguous terms.
  *   **Step 2 (Neither/Nor):** **YES.** The sentence explicitly denies the excluded middle ("Neither dusk nor night").
  *   **Action:** **HALT.** Highlight Yellow. Send to Author.
  *   **Author Decision Required:** You must assign a Code for the Legal Reader.
      *   If **Code A (Epistemic):** You must revise. If it's epistemic, it *was* either dusk or night, even if no one knew. The sentence is literally false.
      *   If **Code C (Ontological):** You keep the sentence. You must tell the Legal Reader: *"This passage asserts Ontological Indeterminacy. It claims the world of the fiction lacks a truth value here. This violates Bivalence."*
  *   **Verdict:** The procedure correctly identifies this as your highest risk sentence. It cannot stand without a Code C declaration to the Legal Reader.

  #### Passage 2
  > Reporter's Note: "There was no fact of the matter whether he was of sound mind; there was only what the doctors were prepared to say."

  *   **Step 1 (Ambiguity):** No.
  *   **Step 2 (Neither/Nor):** No. (It asserts "No fact," which implies indeterminacy, but doesn't use the logical form "Neither P nor not-P").
  *   **Step 3 (Reporter Note):** **YES.**
  *   **Action:** Mark as **STIPULATED**.
  *   **Legal Reader Commitment:** This is a **Code B (Stipulated)** that functions as a **Code C (Ontological)** claim within the fiction. The Reporter is stipulating that the predicate "sound mind" lacks a referent.
  *   **Verdict:** Safe. The Reporter's authority resolves the vagueness by declaring it unresolvable. The Legal Reader accepts this as a "Rule of the Record."

  #### Passage 3
  > "The woman on the far pavement was elderly, or at any rate no longer young."

  *   **Step 1 (Ambiguity):** No.
  *   **Step 2 (Neither/Nor):** No.
  *   **Step 3 (Reporter Note):** No.
  *   **Step 4 (Source):** **Free Indirect Style.** (This is the narrator channeling a perspective, likely the observer's).
  *   **Action:** Mark as **CHARACTER UNCERTAINTY**.
  *   **Legal Reader Commitment:** **Code A (Epistemic).** The uncertainty belongs to the observer, not the world. The woman *is* either elderly or not; the observer just hedges.
  *   **Verdict:** Safe. This is standard narrative hedging. No philosophical commitment required.

  ***

  ### What The Procedure Cannot Do

  1.  **It Cannot Make "Neither/Nor" Logically Safe:** If you keep Passage 1 ("Neither dusk nor night"), the procedure forces you to admit to the Legal Reader that you are violating classical logic. It cannot make that violation disappear. It only ensures you do it intentionally.
  2.  **It Cannot Detect "Secret" Higher-Order Vagueness:** If you write "It was vaguely dusk," the editor might mark this as Narrative Vagueness. But if "vaguely" itself is vague, the procedure treats it as simple vagueness. You must monitor the *texture* of indeterminacy yourself.
  3.  **It Cannot Enforce Consistency Across Unmarked Shifts:** If you treat "nightfall" as Code A (Epistemic) in Chapter 1 and Code C (Ontological) in Chapter 10 without a Reporter note explaining the shift, the procedure will not catch this unless the editor remembers Chapter 1. You must maintain a "Vagueness Ledger" for key terms.
  4.  **It Cannot Resolve the Legal Reader's Objection:** If the Legal Reader refuses to accept Code C (Ontological Indeterminacy) because it undermines the "facts" of the case in the book, the procedure cannot solve this. It only isolates the conflict so you can argue it on principle rather than getting bogged down in line edits.

  ### Final Recommendation
  Your manuscript relies on the tension between the Reporter's need for records and the world's resistance to precision. The procedure protects you from accidental contradictions. However, for Passage 1, you must decide: is the book a world where logic holds and we are ignorant (Epistemic), or a world where logic fails and boundaries are unreal (Ontological)? The Reporter suggests the latter, but the Legal Reader demands the former. The procedure forces you to sign off on that conflict explicitly. Do not leave it to instinct.
