answer: |-
  You have put your finger on one of the most persistent and difficult nerves in the philosophy of science. What you are describing is a recognized problem, but you are right to feel that the standard labels often fail to capture the specific *structural* severity of the claim you're making.

  In the literature, this position is most robustly captured under the umbrella of **Incommensurability**, specifically a strong reading of **Methodological Incommensurability**. However, because "incommensurability" has become a bit of a catch-all buzzword since Kuhn, it often lacks the precision you are looking for. There is a more structural account of this phenomenon found in the work of Michael Friedman regarding **Constitutive Principles** (or the **Relativized A Priori**).

  If you want to be precise in your seminar, I recommend framing this as **Evidential Constitutivity** (or **Constitutive Evidential Relativity**). While "incommensurability" is the established historical label, "constitutivity" better captures the mechanism you are describing: that the theory does not merely *interpret* the evidence, but *constitutes* the space in which evidence can exist.

  Here is the careful account you asked for, distinguishing this from its neighbors and defining its boundaries.

  ### 1. The Established Name: Methodological Incommensurability
  The closest established concept is **Incommensurability**, as introduced by Thomas Kuhn and Paul Feyerabend. However, you must distinguish between two versions:
  *   **Semantic Incommensurability:** T1 and T2 use terms (like "mass" or "time") that mean different things, so they can't strictly contradict each other.
  *   **Methodological/Perceptual Incommensurability:** This is your case. Kuhn argued that proponents of rival paradigms "practice their trades in different worlds." It is not just that they interpret the same data differently; it is that the *legitimate puzzles*, the *acceptable instruments*, and the *standards of solution* are internal to the paradigm.

  **Why this fits:** It captures the idea that there is no neutral arbiter.
  **Why it might feel insufficient:** "Incommensurability" is often attacked as leading to irrationalism (if we can't compare, how do we choose?). Your description is more structural: it's not that we *can't* compare, but that the *terms of comparison* are internal to the theories.

  ### 2. The Structural Account: Constitutive Principles
  A more rigorous modern treatment of your intuition is found in Michael Friedman's work on the **Relativized A Priori**. Friedman argues that scientific frameworks rely on "constitutive principles" (often mathematical or philosophical presuppositions) that make empirical laws possible.
  *   **The Insight:** You cannot have Newtonian empirical evidence without Newtonian absolute space and time as a constitutive framework. If you switch to Einsteinian relativity, the *possibility conditions* for the evidence change.
  *   **Relevance to you:** This validates your claim that "the data is part of the theory." The evidence is not an external input; it is an output of the constitutive framework.

  ### 3. Distinctions: Carving the Joints
  You asked to distinguish this from Theory-Ladenness and Duhem-Quine. Here is the precise mapping:

  #### vs. Theory-Ladenness of Observation (Hanson/Kuhn)
  *   **Standard View:** Two scientists look at an X-ray. One sees a pathology, the other sees normal tissue. The *retinal stimulus* is the same; the *interpretation* differs.
  *   **Your Case:** The two scientists do not even look at the same X-ray. T1 requires an X-ray; T2 requires a galvanometer reading. The *means of production* of the data are theory-dependent.
  *   **The Difference:** Theory-ladenness is usually about *perception/interpretation* of a shared stimulus. Your case is about the *generation/constitution* of the stimulus itself. You are describing **Instrumental/Methodological Relativity**, which is deeper than perceptual ladenness.

  #### vs. The Duhem-Quine Thesis
  *   **Standard View:** You cannot test a hypothesis $H$ in isolation; you test $H$ plus auxiliary assumptions $A$. If the prediction fails, logic doesn't tell you if $H$ or $A$ is false.
  *   **Your Case:** Duhem-Quine assumes a shared logical space where $H+A$ entails Observation $O$. Your claim is that T1 entails $O_1$ and T2 entails $O_2$, and $O_1$ and $O_2$ are not translatable.
  *   **The Difference:** Duhem-Quine is about **Holism of Falsification** (we can't isolate the culprit). Your point is about **Relativity of Evidential Space** (we don't share the same court of appeal). Duhem-Quine preserves the idea of a shared evidence base that is just messy to parse; you are denying the shared base exists.

  ### 4. A Proposed Term: "Constitutive Evidential Relativity"
  Since "Incommensurability" is often too vague and "Theory-Ladenness" is too weak, if you wish to coin a term for your seminar to ensure precision, I suggest **Constitutive Evidential Relativity**.

  **Definition:**
  A state of theoretical rivalry wherein the conditions required to generate, validate, or recognize empirical evidence are internal to the rival theories themselves, such that no theory-neutral evidence set exists to arbitrate between them.

  **Boundary Conditions (Where it stops and starts):**
  To use this concept rigorously, you need to know when it *doesn't* apply.

  1.  **The Limiting Case (Correspondence):** If T2 can demonstrate that its evidence set $E_2$ mathematically reduces to T1's evidence set $E_1$ under specific conditions (e.g., low velocity), then Constitutive Evidential Relativity breaks down. There is a bridge. Your concept applies when **no correspondence rules exist**.
  2.  **Instrumental Convergence:** If T1 and T2 both rely on the *same* instrument (e.g., a telescope) but interpret the images differently, that is standard Theory-Ladenness. Your concept applies when the **instrumentation itself is theory-specific** (e.g., a phlogiston scale vs. an oxygen calorimeter).
  3.  **The "Fixed Point" Test:** If there is any subset of observations (e.g., pointer readings, digital outputs) that both theories accept as "brute facts" regardless of interpretation, you are in standard Underdetermination. Your concept applies only when **even the brute facts are contested** (e.g., T1 says the pointer movement is noise; T2 says it is signal).

  ### 5. Why This Matters for Your Seminar
  The reason you are struggling to name this is that it sits at the boundary of metaphysics and methodology.
  *   If you accept **Constitutive Evidential Relativity**, standard Bayesian confirmation theory struggles to function (because you can't assign likelihoods to evidence that isn't shared).
  *   It pushes you toward **Structural Realism** (maybe the *relations* are preserved even if the evidence changes) or **Perspectival Realism** (Giere), which acknowledges that all evidence is situated within a specific theoretical/instrumental perspective.

  ### Summary Recommendation
  In your seminar, I would say this:

  > "I am distinguishing this from standard underdetermination and simple theory-ladenness. I am arguing for **Constitutive Evidential Relativity**. Unlike Duhem-Quine, which claims we cannot isolate hypotheses within a shared evidence base, this claim is that the **evidence base itself is theory-relative**. Unlike standard theory-ladenness, which concerns the interpretation of observations, this concerns the **production and validity conditions** of the observations. This aligns with a strong reading of Kuhnian **Methodological Incommensurability** or Friedman's **Constitutive Principles**."

  This positions you as someone who understands the history (Kuhn/Friedman) but is precise about the structural implications (Constitutive Relativity). It acknowledges the established literature while carving out the specific nuance you've identified.
