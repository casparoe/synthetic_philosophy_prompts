answer: |-
  # Handout: Locating Your View on Thomson's Lamp

  **Course:** Philosophy of Mathematics  
  **Topic:** Supertasks and Infinity  
  **Context:** James Thomson (1954) proposed a lamp that is toggled on/off infinitely many times in a finite interval (e.g., 1/2 min, 1/4 min, 1/8 min...). At $t=1$, is the lamp on or off? Paul Benacerraf (1962) replied that the description does not say.

  This decision tree is designed to help you locate your philosophical position regarding the possibility of supertasks and the determinacy of their outcomes. Answer the questions based on your intuitions and reasoning; do not worry about the names of the positions until you reach the end.

  ---

  ## Part 1: The Decision Tree

  Start at **Q1** and follow the arrows based on your answer.

  ```mermaid
  graph TD
      Q1[<b>Q1: Possibility</b><br>Is it logically/metaphysically possible<br>to complete infinitely many tasks<br>in a finite time?]
      A1[No]
      A2[Yes]
      
      Q1 -->|No | Leaf1[<b>Position A</b><br>Supertask Eliminativism]
      Q1 -->|Yes | Q2
      
      Q2[<b>Q2: Continuity</b><br>If the task is completed, must the<br>final state be the mathematical<br>limit of the preceding states?]
      A3[Yes]
      A4[No]
      
      Q2 -->|Yes | Leaf2[<b>Position B</b><br>The Non-Convergence View]
      Q2 -->|No | Q3
      
      Q3[<b>Q3: Physicality</b><br>Does the lack of a determined answer<br>stem from the scenario being an<br>abstraction that omits physical details?]
      A5[Yes: A concrete version<br>would have an answer]
      A6[No: Even a concrete version<br>has no further fact]
      
      Q3 -->|Yes | Leaf3[<b>Position C</b><br>Physical Underdetermination]
      Q3 -->|No | Leaf4[<b>Position D</b><br>The Dissolution View]
  ```

  ---

  ## Part 2: Guide to the Questions

  **Q1: Possibility**
  *   **What this asks:** This distinguishes those who think the setup describes a genuine possibility from those who think it describes a contradiction (like a "square circle").
  *   **The Disagreement:** Thomson originally argued that the lack of a determinate state proves the task is impossible. Others argue the task is conceivable, and the lack of a state is a feature of the description, not a bug of reality.

  **Q2: Continuity**
  *   **What this asks:** This asks if you accept a "Principle of Continuity." If a system evolves smoothly (or in a defined pattern) up to a limit time, must its state *at* the limit time be the limit of its previous states?
  *   **The Disagreement:** In Thomson's Lamp, the sequence (On, Off, On, Off...) has no mathematical limit. If you answer **Yes**, you conclude the lamp has no state. However, you might allow that a *different* supertask (e.g., a light dimming to 0 brightness) *would* have a state, because that sequence does converge.

  **Q3: Physicality**
  *   **What this asks:** This distinguishes between semantic/logical indeterminacy and physical incompleteness. Is the puzzle unsolvable because "math isn't physics," or because the question itself is ill-posed?
  *   **The Disagreement:** If you answer **Yes**, you believe real-world physics (quantum mechanics, relativity, material constraints) would force a specific outcome, even if the math story doesn't. If you answer **No**, you believe there is no "fact of the matter" even in principle.

  ---

  ## Part 3: The Positions (The Leaves)

  ### Position A: Supertask Eliminativism
  *(Reached via Q1: No)*
  **Core Claim:** Supertasks are impossible.
  **View:** The paradox of the lamp is an *reductio ad absurdum*. The fact that we cannot assign a state to the lamp at $t=1$ demonstrates that the process described cannot be completed. The infinity involved is potential, not actual.
  **Key Proponents:** James Thomson (original argument), some Zeno-paradox traditionalists.

  ### Position B: The Non-Convergence View
  *(Reached via Q1: Yes → Q2: Yes)*
  **Core Claim:** Supertasks are possible, but the final state requires a convergent sequence.
  **View:** We can complete the tasks, but the state at $t=1$ is governed by a continuity principle. Since the On/Off sequence oscillates and does not converge, the lamp has **no determinate state** at $t=1$. However, this does not rule out all supertasks; a supertask involving a convergent quantity (like a light fading to darkness) would have a determinate final state.
  **Key Proponents:** Paul Benacerraf (in part), proponents of topological closure in state spaces.

  ### Position C: Physical Underdetermination View
  *(Reached via Q1: Yes → Q2: No → Q3: Yes)*
  **Core Claim:** The abstract story is incomplete; physics settles the fact.
  **View:** The mathematical description of the lamp is too "thin." It specifies the switching times but omits physical constraints (inertia, speed of light, quantum states). In any concrete realization, physical laws would determine the outcome (e.g., the switch breaks, or the electron tunnels). The abstract puzzle has no answer, but the physical one does.
  **Key Proponents:** John Earman, John D. Norton (often leans toward impossibility via physics, but the underdetermination strand exists in philosophy of physics).

  ### Position D: The Dissolution View
  *(Reached via Q1: Yes → Q2: No → Q3: No)*
  **Core Claim:** The question is ill-posed; there is no further fact.
  **View:** The description of the lamp's history up to $t=1$ is complete, but it simply does not logically entail a state *at* $t=1$. There is no hidden physical fact or mathematical rule that fixes it. To ask "Is it on or off?" is to assume a determinacy that isn't there. The puzzle is dissolved by recognizing the logical underdetermination.
  **Key Proponents:** Paul Benacerraf (primary interpretation), Adolf Grünbaum.

  ---

  ## Part 4: Caveats, Overlaps, and Undefended Positions

  ### 1. The Fuzzy Boundary: Dissolution vs. Physical Underdetermination
  **The Overlap:** Positions **C** and **D** are difficult to separate cleanly in practice.
  **Why:** Both agree that the *abstract mathematical description* does not yield an answer. The distinction relies on a modal claim about the physical world:
  *   **Underdetermination (C)** claims: "If you built this, physics *would* decide."
  *   **Dissolution (D)** claims: "Even if you built this, the logical description of the events still wouldn't decide, and physics might just forbid the setup entirely (collapsing into Eliminativism) or yield a result irrelevant to the logical puzzle."
  **Diagnosis:** If you hold Position C, you must be prepared to specify *which* physical laws would settle the outcome. If you cannot, your view may collapse into Position D.

  ### 2. The "Brute Fact" Leaf (Logically Available but Undefended)
  **The Path:** Q1 (Yes) → Q2 (No) → Q3 (No) → **"But there IS a fact."**
  **The Position:** This view holds that supertasks are possible, limits do not determine the state, and physics does not determine the state, **yet** the lamp is definitely either On or Off at $t=1$.
  **Diagnosis:** **Philosophically Unattractive / Undefended.**
  This position violates the Principle of Sufficient Reason. If the history of the lamp, the laws of mathematics, and the laws of physics do not determine the state, what does? To claim the lamp is definitely "On" without a determining reason is to posit a "brute fact." While logically possible, no serious philosopher defends this because it makes the outcome arbitrary and inexplicable.

  ### 3. The "Physical Eliminativist" Overlap
  **The Overlap:** Position **A** (Eliminativism) and Position **C** (Physical Underdetermination).
  **Why:** Many philosophers of physics (e.g., Norton) argue that supertasks are physically impossible due to energy constraints or relativistic limits.
  **Diagnosis:** If you believe physics makes the task impossible, you belong in **Position A**. Position **C** is reserved for those who think the task *could* be physically realized, but the *abstract story* provided in the puzzle is insufficient to predict the outcome. Be careful not to conflate "Physics forbids the task" (A) with "Physics would finish the task, but the math story doesn't say how" (C).

  ### 4. Convergence vs. Causality
  **Note on Position B:** Some students may feel that even if a sequence *does* converge (e.g., a ball bouncing to rest), the final state is not determined by the limit, but by causal laws. Position **B** assumes a specific link between mathematical limits and physical states. If you reject this link, you will be pushed toward **D** (Dissolution) even for convergent cases.
