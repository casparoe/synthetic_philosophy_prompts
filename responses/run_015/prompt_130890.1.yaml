  **ARNWALD GROUP GLOBAL CONDUCT DIRECTIVE 9.4**

  **Preamble**
  To All Personnel: Following recent operational discontinuities, the Arnswald Group reaffirms its commitment to rational conduct. This policy codifies the understanding that volition follows the greatest apparent good. Misconduct is understood as a perceptual error regarding the composition of goods, not a moral failure. Our aim is alignment, not repayment of harm. We operate within the optimal configuration of reality.

  **Clauses**
  1.  **Volition:** All agents act pursuant to a perceived benefit. Actions appearing malicious are categorized as confused estimations of value. There is no will toward evil, only toward a good mistakenly identified.
  2.  **Permissibility:** Adverse outcomes are permitted only as necessary conditions for superior aggregate goods. Harm is never gratuitous. If an event occurs, it is because its non-occurrence would preclude a greater good. The connection between the harm and the good may be obscure, but it is structurally necessary.
  3.  **Compossibility:** Certain goods cannot coexist. Securing one good may necessitate the exclusion of another. The Group prioritizes the maximal set of jointly realizable goods.
  4.  **Remediation:** Responses to error must improve the agent's perception or instruct observers. Measures based on owed penalty are prohibited as they assume debt rather than confusion.
  5.  **Clarification Protocol:** Primary sanction is mandatory clarification training. The agent is shown the greater good their action served. Understanding replaces correction.
  6.  **Recidivism:** If clarification fails to adjust perception, the agent is relocated to a context of reduced causal leverage. This minimizes perceptual risk without assigning fault. If perception remains unadjusted in the new context, leverage is reduced further until causal impact is null.
  7.  **Office of Compossibility Review:** All proposed policy reforms must be vetted by this Office. If a reform's benefits are incompossible with existing Group operations, the reform is rejected. This ensures we do not sacrifice existing goods for illusory improvements.
  8.  **Stasis Justification:** Rejection of reform due to incompossibility is not inertia. It is the rigorous maintenance of the optimal whole. Change is permitted only when it increases total compossibility. To change without gain is to introduce disorder.
  9.  **Certification of Necessary Outcomes:** Managers must file Form CN-9 when a bad outcome is identified as a condition of a greater good. This certifies the event was required.
  10. **Neutrality:** Upon filing Form CN-9, the agent responsible is neither sanctioned nor thanked. They are acknowledged as an instrument of the whole. Gratitude implies choice where none existed.

  **Appendix: Sample Determinations**
  1.  **Case 88-Alpha:** Regional Director diverted client funds for twenty-four months. Investigation revealed this diversion exposed a systemic fraud four times larger. *Determination:* Diversion was a necessary condition for exposure. Director receives clarification on fund liquidity. No adverse notation.
  2.  **Case 92-Beta:** Employee disclosed internal safety data accurately. Disclosure reduced Group market value by twenty-five percent. *Determination:* Value loss is incompossible with public trust retention. Trust is the higher good. Employee receives clarification on timing. No adverse notation.
  3.  **Case 104-Gamma:** Employee states she perceived no good in her action and cannot be brought to see one. *Determination:* Perception deficit is total. Clarification impossible. Employee is relocated to null-tasking unit. No adverse notation recorded.
