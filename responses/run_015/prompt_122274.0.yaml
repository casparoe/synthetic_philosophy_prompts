answer: |-
  This stalemate is not merely verbal, nor is it a purely substantive empirical dispute. It is a **clash of explanatory projects** that has been obscured by a **terminological conflation**.

  My committed diagnosis is this: **Global Workspace Theory (GWT) and Phenomenal Consciousness (P-consciousness) advocacy are two distinct research programs answering different questions—one about cognitive *control and availability*, the other about subjective *presence*—that have inadvertently collided under the single label 'consciousness.'** The impasse persists because GWT proponents treat the functional architecture of access as an *ontological reduction* of experience, while phenomenalists treat the intuition of presence as a *brute datum* that function cannot capture.

  The disagreement is substantive regarding *where* to look in the brain and *how* to measure mental states, but it is stalled because both camps assume their specific explanatory target is the only legitimate referent of the word "consciousness."

  ### The Diagnosis: Divergent Explanatory Projects

  To see why this is a clash of projects rather than a simple empirical disagreement, we must look at what each side is actually trying to explain.

  **1. GWT: The Project of Cognitive Architecture**
  Proponents like Stanislas Dehaene and Bernard Baars are building a theory of **information flow**. For them, "consciousness" is a technical term designating a specific functional state: global availability for reasoning, reporting, and flexible action. When a GWT proponent says, "There is no consciousness without access," they are making a functionalist identity claim. They are not denying that *something* happens in the brain during sub-threshold processing; they are denying that the label "conscious" applies to it.
  *   **The Move:** When faced with Block's overflow arguments (e.g., Sperling's iconic memory), GWT proponents redescribe the "unreported" content as unconscious sensory memory.
  *   **The Goal:** To explain how the brain solves the bottleneck problem of limited capacity.
  *   **The Blind Spot:** By defining consciousness *as* access, they render the question "Why does access feel like something?" unaskable. They explain the *consequences* of consciousness but assume away the *nature* of it.

  **2. Phenomenal Advocates: The Project of Ontological Presence**
  Proponents like Ned Block and Victor Lamme are defending the **what-it-is-likeness** of experience. Their project is to map the minimal neural conditions for subjective presence, regardless of whether that presence can be utilized by the cognitive system.
  *   **The Move:** They argue that reportability is a downstream cognitive act that can fail even when experience succeeds (the "overflow" hypothesis). They point to recurrent processing in posterior cortex as sufficient for phenomenology, even without prefrontal ignition.
  *   **The Goal:** To isolate the neural correlate of experience itself, distinct from the neural correlate of reporting on that experience.
  *   **The Blind Spot:** By relying heavily on introspective intuition and report-based data (even when arguing against report), they sometimes struggle to provide a functional account of *why* phenomenology exists if it has no causal power over access.

  **The Stall:** The stalemate occurs because GWT treats the phenomenalist's "presence without access" as a category error (like "heat without molecular motion"), while phenomenalists treat GWT's "access without presence" (e.g., philosophical zombies) as a conceptual possibility that GWT fails to rule out. They are talking past each other because GWT is a theory of **cognitive utility**, while Block is advocating for a theory of **experiential reality**.

  ### The Distinction: 'Phenomenal Presence' vs. 'Accessibility-to-Self-Modeling'

  You asked whether distinguishing 'phenomenal presence' from 'accessibility-to-self-modeling' changes the diagnosis or is merely an intuitive pump.

  **This distinction is not a pump; it is the necessary conceptual tool to break the stall, but only if operationalized.**

  Currently, the distinction functions as an intuitive pump because phenomenalists invoke it to protect their intuitions (e.g., "It *felt* like I saw more"), while GWT proponents dismiss it as unscientific metaphysics. However, if we treat 'accessibility-to-self-modeling' as a specific functional capacity (the ability to embed a state into a higher-order thought or report) and 'phenomenal presence' as a first-order representational state with specific qualitative character, the disagreement becomes empirically tractable.

  The diagnosis shifts from "Who is right about consciousness?" to "**Do first-order recurrent states sustain qualitative character independently of higher-order self-modeling?**"

  *   **If GWT is right:** Disrupting the global workspace (e.g., via TMS to PFC) should eliminate both report *and* the neural signatures of phenomenology (e.g., in visual cortex).
  *   **If Block/Lamme are right:** Disrupting the workspace should eliminate report while leaving posterior signatures of conscious content intact.

  The distinction is only a "pump" if it remains purely introspective. It becomes substantive when linked to **dissociable neural mechanisms**.

  ### What Counts as Progress?

  Given this diagnosis, progress will not come from one side convincing the other that their definition is the "true" one. Progress requires **decoupling the measures** and **splitting the explanatory burdens**.

  **1. Adoption of "No-Report" Paradigms**
  The single biggest methodological confound is the reliance on verbal report as the proxy for consciousness. GWT relies on it; Phenomenalists critique it but often use it.
  *   **Progress:** Widespread adoption of objective, non-report measures of awareness (e.g., pupil dilation, optokinetic nystagmus, confidence ratings without explicit report, or neural decoding of stimulus content). If we can show that a stimulus is encoded in a "conscious" format in the visual cortex *without* triggering fronto-parietal ignition or report, the GWT claim that ignition is *necessary* for phenomenology fails.
  *   **Current Status:** This is happening (e.g., work by Tsuchiya, Koch, and Haynes), but GWT proponents often reinterpret these results as "unconscious complex processing." Progress requires agreement on what counts as a marker of *presence* distinct from *processing*.

  **2. Conceptual Hygiene: 'Access' vs. 'Phenomenology'**
  We must stop using "consciousness" as a monolith.
  *   **Progress:** The field should explicitly distinguish **C-Consciousness** (Cognitive/Access, the domain of GWT) from **P-Consciousness** (Phenomenal/Presence, the domain of Block).
  *   **Why:** This allows GWT to be a successful theory of *C-Consciousness* (how information becomes globally available) without needing to claim it explains *P-Consciousness* (why availability feels like something). Simultaneously, it forces Phenomenalists to explain the *function* of P-Consciousness if it truly overflows access, rather than treating it as a metaphysical ghost.

  **3. The "Bridge Law" Search**
  The deepest substantive question is not "What is consciousness?" but "**What is the mapping function between global availability and subjective presence?**"
  *   **Progress:** A theory that explains *why* global broadcasting typically coincides with phenomenal presence, while allowing for edge cases (overflow or blindsight). Integrated Information Theory (IIT) attempts this but faces its own empirical hurdles. A successful progress marker would be a model that predicts when access and phenomenology will *dissociate*, rather than assuming they are identical.

  ### Conclusion

  The disagreement is a **substantive empirical dispute regarding neural architecture** (posterior vs. anterior correlates) that is **stalled by a verbal conflation** of two distinct explanatory projects.

  GWT explains how the mind *uses* information; Phenomenal advocacy describes how the mind *experiences* information. The stall persists because GWT proponents believe explaining the use *is* explaining the experience (functionalism), while phenomenalists believe experience is a distinct natural kind that use presupposes but does not exhaust.

  **Honest Progress:** Progress will only occur when the field accepts that **reportability is a confound, not a criterion**. If we can empirically demonstrate a state that has the neural signature of phenomenal presence (e.g., specific recurrent processing) without the signature of access (global ignition), the GWT reduction fails. Conversely, if every instance of phenomenal presence is shown to require a specific type of self-modeling access, the Phenomenalist distinction collapses. Until we measure presence independently of access, the stall is not just likely; it is methodologically guaranteed.
