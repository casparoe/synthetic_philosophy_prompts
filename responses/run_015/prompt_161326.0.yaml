      *   *Check:* The prompt asks to flag pairs that can't be jointly satisfied. The big one is "Synchronic Rationality" vs "Diachronic Success." I need to be explicit that a theory usually has to deny one to save the other.

  14. **Final Polish:** Ensure the distinction between "Weakness" and "Preference Change" is sharp. Preference change = I no longer value the book. Weakness = I value the book, but my temporal discounting betrays me.

