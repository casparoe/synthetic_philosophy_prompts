      *   *Candidate 7:* The agent must have formed a resolution/plan. (Keep: Distinguishes from vague wishing.)
      *   *Candidate 8:* The agent must feel conflict or regret. (Cut: Masochists might not. But the prompt mentions "regret" later. Let's refine: The agent must acknowledge the failure *as* a failure eventually.)
      *   *Candidate 9:* Diachronic Consistency constraint. (Keep: The core of the "tomorrow" problem.)

  4.  **Developing the Specification (The Requirements):**
      *   *Req 1: Diachronic Endorsement.* The agent must endorse the goal at a "cool" or "long-term" perspective, even if local preferences shift. (Motivation: Distinguishes from preference change).
      *   *Req 2: Capacity to Execute.* The agent must have the physical/psychological capacity to act, unlike the addict/compulsive. (Motivation: Distinguishes from compulsion).
      *   *Req 3: Attribution to Agency.* The failure must stem from the agent's own valuation mechanism, not an alien force. (Motivation: Distinguishes from self-deception/addiction where the desire feels external).
