      *Refining Req 5:* This is the hard one. If she *always* judges tomorrow better, she is rationally consistent *synchronically*. To call it weakness, we need a standard of *diachronic rationality*. The requirement: The theory must allow judgment failure to be located in the *structure of planning* over time, not just the moment of action.

  5.  **Addressing the Specific Case (No Akratic Moment):**
      *   Is a theory requiring a momentary clash inadequate? Yes, for *this* case. If the theory demands synchronic conflict, it cannot classify this procrastination as weakness. It would classify it as "rational preference satisfaction."
