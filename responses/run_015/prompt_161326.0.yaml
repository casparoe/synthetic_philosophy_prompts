      *   To call this weakness, the theory must posit that the judgment "tomorrow is better" is itself the failure if repeated indefinitely. The failure is in the *policy* of deferral.
      *   So, a theory restricted to momentary action verdicts *is* inadequate. It's not novelist prejudice; it's a limitation of synchronic action theory.

  11. **Refining the "Binding/Relief" Analysis:**
