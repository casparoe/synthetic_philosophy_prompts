  7.  **Identifying Conflicts (The Trade-offs):**
      *   *Conflict:* **Agency Attribution vs. Present-Bias Accommodation.**
      *   If we say the agent is fully responsible (Agency), we imply they could have done otherwise *at the time*. But if they are present-biased, at the time, the impulse *overwhelms* the judgment.
      *   If we say the impulse overwhelms (Compulsion-like), we risk excusing them.
      *   *Hard Pair:* **Requirement of Diachronic Rationality** vs. **Requirement of Synchronic Freedom.** You can't demand the agent be diachronically consistent (write the book) while admitting they are synchronically rational (rest today is better than write today given the delay). One of these must give. Usually, philosophers sacrifice synchronic rationality (calling it a cognitive error) or sacrifice diachronic unity (calling it preference change). To call it *weakness*, we must assert Diachronic Unity trumps Synchronic Preference.

