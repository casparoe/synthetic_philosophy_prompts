      *   *Judgment-Based (Socratic/Aristotelian):* Fails the "no moment" case. Requires synchronic conflict.
      *   *Desire-Based (Humean/Struggle):* Good at capturing the pull, but struggles to distinguish weakness from compulsion (both are strong desires winning).
      *   *Plan/Resolution-Based (Bratman/Holton):* Best fit. Focuses on stability of intention over time. Weakness is the unjustified abandonment of a prior plan.
      *   *Most Exclusionary Requirement:* The **Diachronic Endorsement** requirement (that the goal persists across time despite local shifts). This kills pure preference-change accounts and strict synchronic judgment accounts.

  9.  **Drafting the Response (incorporating constraints and tone):**
      *   *Intro:* Acknowledge the role, set the stage.
