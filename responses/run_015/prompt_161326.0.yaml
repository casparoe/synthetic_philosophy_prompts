      *   **Tone:** Analytical, rigorous, brainstorming style initially (cutting slogans), then structured specification. No mere opinions, but criteria.

  2.  **Deconstruct the "No Akratic Moment" Problem:**
      *   Standard Socratic/Platonic/Aristotelian view: Akrasia requires acting against *current* better judgment.
      *   The Character's Situation: She *always* judges "tomorrow" is better. This is a form of *procrastination* driven by hyperbolic discounting or dynamic inconsistency.
      *   If she always judges "tomorrow" is better, is she acting against judgment *today*? No, today she chooses rest, judging rest better than writing *today* because writing is pushed to tomorrow.
      *   The Accusation: It's weakness, not just a schedule change.
      *   The Philosophical Hurdle: If there is no moment where she thinks "I should write now" and writes not, is it akrasia? Or is it a structural failure of planning over time?
      *   Constraint Check: The prompt says "no requirement that an occurrent better judgment be present at the moment of action" is a constraint *unless I argue otherwise*. Given the case description, I *must* argue otherwise or expand the definition of judgment to cover temporally extended agency. If I stick to strict synchronic akrasia, the theory fails the case. So, the theory *must* allow for diachronic failure without synchronic contradiction.

  3.  **Brainstorming Candidate Requirements (and cutting slogans):**
      *   *Candidate 1:* Agent must believe they ought to do X. (Cut: Too vague. Ought when?)
      *   *Candidate 2:* Agent must act against their better judgment. (Cut: This is the Socratic slogan. The prompt explicitly describes a case *without* this synchronic clash. If I keep this, the theory says "This isn't weakness." The user wants a theory that *can* call this weakness. So I need to modify this to Diachronic Better Judgment.)
      *   *Candidate 3:* Agent must have the ability to do otherwise. (Keep: Essential for moral responsibility/distinction from compulsion.)
      *   *Candidate 4:* Agent must retain the goal over time. (Keep: Distinguishes from preference change.)
