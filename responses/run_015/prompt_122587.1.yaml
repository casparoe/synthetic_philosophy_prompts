  *(Refining the "Step 3" rejection)*: Technically, Step 3 follows from 1 and 2 *if* you assume 1 applies to *all* mental states. So the rejection is actually a restriction on the scope of (1). (1) should read: "A *first-order* mental state M is conscious iff..." Or, more accurately, "A mental state is conscious iff... (but HORs are a special class of unconscious states)." The cleanest way is to say HORs are *unconscious by nature*. So Step 3 fails because it asserts H must be conscious.

  Let's finalize the advice: Reject the inference in Step 3. The HOR is unconscious. This stops the regress. The cost is accepting "unconscious mental states" (which is standard psych). The benefit is saving the plot. Address the "silicon" worry by emphasizing *conceptual* content.

