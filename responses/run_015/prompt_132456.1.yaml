      *   **User Persona:** Professional philosopher of mind (or very advanced grad student/postdoc). They know the literature (Pylyshyn, Firestone & Scholl, Siegel, Stokes, etc.), they know the history (1980s modularity to present), and they are frustrated by the stalemate. They don't want a lit review or citations. They want *argument* and *diagnosis*.
      *   **Task:**
          1.  Unstructured brainstorming: List different questions hidden under "Is perception cognitively penetrable?"
          2.  Pick the "right" diagnosis and defend it.
          3.  Evaluate the user's three-part diagnosis (Cut-point, Theoretical Role, Methodology).
          4.  Evaluate the two probes (CNN model, Adversarial Collaboration).
          5.  Address the underlying motivation (Epistemic Foundationalism).
          6.  Give a verdict on whether to spend 3 years on this (Progress vs. Dead End).
