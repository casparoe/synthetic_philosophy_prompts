answer: |-
  **The sequence**

  Divide the ninety minutes into four strict blocks. **0–20: Play.** Hand out the rules. No talk of meaning. Goal: Derive MU. Let them flail. When frustration peaks, intervene. **20–40: Invariant Discovery.** Ask: "What property does MI have that MU lacks?" Guide them to count I's. Verify empirically that rules preserve $n(I) \not\equiv 0 \pmod 3$. Do not yet claim proof. **40–60: The Mathematical Jump.** This is the critical pivot. Do not simply assert impossibility. On the whiteboard, write a rigorous proof by induction on derivation length. Base case: MI has 1 I ($1 \not\equiv 0 \pmod 3$). Inductive step: Show formally that each rule transforms $k \not\equiv 0$ to $k' \not\equiv 0$. Explicitly name this **induction**. This grounds the "outside" view in standard mathematics, countering the "mysticism" worry. **60–75: Naming the Meta.** Now introduce the terminology. You have been working in the *object theory* (MIU); the proof lives in the *metatheory* (arithmetic). Explain that "jumping out" isn't escaping logic; it's using a stronger system to analyze a weaker one. This is not turtles all the way down; it's stratified reasoning. **75–90: Reflection.** Discuss limits. Why doesn't this solve everything? (Not all systems have decidable invariants). End by emphasizing that the meta-proof is *more* certain than any finite derivation because it covers infinite space.

  **The carrying example**

  Your ●/▲ example is too static. If rules never change the count of ●, the invariant is trivial ("count stays 1"). MIU is valuable precisely because rules *change* the count (doubling, subtracting) but preserve the *residue class*. This distinction is vital. If you use a warm-up, ensure rules transform the count non-trivially (e.g., $x \to xxx$ preserves mod 2). Better yet, skip the warm-up. The cognitive load of MIU is manageable, and spending time on a trivial invariant teaches the wrong lesson: that invariants are always obvious static counts. Let them struggle with the mod-3 residue; that struggle is where the learning happens. If you must warm up, use a system where the invariant is parity, but rules change length, so they must calculate the change, not just observe stasis.

  **Misconception map**

  Intercept these errors at specific timestamps. **Meaning (0 min):** Stop any interpretation of M/I/U immediately. "Symbols are ink." **Backwards (20 min):** Rules are functions, not equivalences. You cannot undo U to III. **Defective (60 min):** Unprovability isn't a bug; it's a feature of formalization. The system isn't broken; it's specific. **The Induction Gap (45 min):** This is the critical fix. Students think "Rules preserve P" implies "All theorems have P." You must explicitly bridge this with induction on derivation length. Without this, the proof feels like hand-waving. **Mysticism (70 min):** The "outside" is just arithmetic. It's not magic; it's a stronger system. **Certainty (80 min):** Meta-proofs are often *more* certain than object-derivations because they cover infinite cases. If they feel the outside proof is "less real," remind them it relies on the same logic they use in CS proofs.

  **The check**

  Hand out a fresh sheet for the last ten minutes. System: Axiom **I**. Rules: 1. $x \to xIII$. 2. $x \to xII$. Target: **IIIII** (5 I's). Ask: "Derive it or prove impossible." This tests transfer without rote memorization. The invariant here is not mod 3. From 1, you can generate $1 + 2a + 3b$. Since 2 and 3 are coprime, you can generate any integer $\ge 1$. 5 is reachable (I → III → IIIII). Students who memorized "mod 3 means impossible" will fail. Students who understood the *method* will check the invariant, see it doesn't block 5, and successfully derive the string. This separates tool-users from pattern-matchers.

  **What I refuse and how I say so**

  When asked "Is there a general test?", answer honestly: "For MIU, yes: starts with M, no other letters, I-count not divisible by 3. But proving the converse (that every such string *is* derivable) requires a construction algorithm we won't do." Regarding Gödel: "MIU shows unprovability from the *outside*. Gödel constructs a sentence *inside* that asserts its own unprovability. MIU has no self-reference; MU isn't 'true but unprovable,' it's just unreachable. Stop the analogy there. Arithmetization is a different lecture." If they push on turtles, say: "We trust the metatheory because it works for engineering. Today is about the structure of proof, not the foundation of truth."
