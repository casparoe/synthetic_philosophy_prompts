          *   $E(p) = (1-p)(4p + 1 - p) = (1-p)(1 + 3p) = 1 + 3p - p - 3p^2 = 1 + 2p - 3p^2$.
          *   Maximize: $E'(p) = 2 - 6p = 0 \Rightarrow p = 1/3$.
