      *   *Best:* The "Consensus Wager." Before building, every group bets 5 tokens that "All Fair Methods Yield the Same Rate." If the final data shows spread > 10%, everyone loses the 5 tokens (house keeps). *Except* any group that formally declared "Ambiguous" before building. They get their 5 back + 5 bonus.
