      *   *This works.* It forces them to take a stand.

      *(Self-Correction on Device 3):* Dice for X,Y coordinates on a grid overlaying the circle. If (x,y) is inside circle, it's a midpoint. If outside, re-roll. This ensures uniform area distribution.
      *(Self-Correction on Device 2):* Spinner for angle. Die for distance (1-6 mapped to 0-R). This is discrete but approximates uniform radius.
      *(Self-Correction on Device 1):* Spinner for angle 1, Spinner for angle 2.

      *Let's write it.*
answer: |-
  # Lesson Plan: The City Bus Tender

  ## 1. Framing Story
  **The Scenario:** The City of Episteme is circular (Radius $R = 10$ cm). The City Council is tendering a contract for new bus routes. All routes must be straight lines connecting two points within the city limits.
  **The Problem:** The Council needs to budget for fuel. "Long Haul" routes (length $> 17.3$ cm) cost double. They need to know the probability that a *randomly selected* route is a Long Haul.
  **The Catch:** The Council defines "Randomly Selected" only as "Fair and Unbiased." They have hired three consulting firms (the student groups) to simulate the selection process and provide the probability rate.
  **The Contract:** Before receiving materials, all firms must sign the **Standard of Fairness Charter**.

  ## 2. Materials List (Per Group of 8-9 Students)
  *   **Base:** A stiff card sheet with a printed circle (Radius 10 cm).
  *   **Device 1 (Endpoints):** A spinner (paperclip + pin) mounted at the center, but used to point to the *rim*. (Actually, simpler: A separate rim-strip with a spinner, or just spin the central spinner twice to mark angles on the rim).
  *   **Device 2 (Radius):** A ruler (0-10 cm) laid along a radius. A 6-sided die. A central spinner for angle.
  *   **Device 3 (Midpoint):** A transparent grid overlay (1cm squares). Two 6-sided dice (one for X, one for Y).
  *   **Measurement:** A "Gauge Stick" (a ruler with a red mark at 17.3 cm).
  *   **Tokens:** 20 integer poker chips per student.
  *   **Documentation:** "Firm Ledger" (paper for recording trials).

  ## 3. The Commitment Mechanism (The Trap)
  **The Standard of Fairness Charter:**
  To receive their trial tokens, every student in every group must sign:
  1.  *"I certify this device introduces no bias toward Long or Short routes."*
  2.  *"I certify that since the Council asks for the probability of a 'Random Route', any Fair device must yield the same rate as any other Fair device."*

  **The Ambiguity Bond (The Opt-Out):**
  Before opening their material envelopes, any group may return the envelope and declare **"The Specification is Ambiguous."**
  *   **Payoff:** If the final class data (from building groups) shows a spread (Max Rate - Min Rate) $> 0.10$, the Ambiguous group wins **20 tokens**.
  *   **Penalty:** If the spread $\le 0.10$, the Ambiguous group loses **10 tokens**.
  *   **Constraint:** Only one group may claim this bond. First to declare locks it. This prevents mass exit and prices the skepticism: they are betting on the paradox manifesting physically.

  ## 4. Device Instructions (Sealed Envelopes)
  *Do not open until Charter is signed.*

  **Group A: The Terminal Method**
  1.  Spin the central spinner. Mark the point on the circle's rim (Point A).
  2.  Spin the spinner again. Mark the new point on the rim (Point B).
  3.  Draw a straight line connecting A and B. This is the Route.
  4.  Measure the length. Record "Long" if $> 17.3$ cm, else "Short".
  5.  Repeat 40 times.

  **Group B: The Radial Method**
  1.  Spin the central spinner to choose a direction (Radius).
  2.  Roll the die. Map 1-6 to distances 1cm, 2cm... 6cm from the center along that radius. (If 6, use 10cm). *Correction for uniformity:* Roll die. Distance = (Roll - 0.5) * (10/6). Simpler: Use a 10cm ruler. Close eyes, drop a pin on the ruler. Measure distance from center.
      *   *Revised for 5-min build:* Place ruler along radius. Drop a pin blindly onto the ruler segment 0-10cm.
  3.  Draw the chord perpendicular to the radius at that pin point.
  4.  Measure the chord length. Record "Long" if $> 17.3$ cm.
  5.  Repeat 40 times.

  **Group C: The Grid Method**
  1.  Place the grid overlay on the circle.
  2.  Roll two dice. X = Die 1, Y = Die 2. (Map 1-6 to grid coordinates).
  3.  If the point (X,Y) falls *outside* the circle, re-roll.
  4.  If *inside*, this point is the **Midpoint** of the Route.
  5.  Draw the chord that is bisected by this point.
  6.  Measure the chord length. Record "Long" if $> 17.3$ cm.
  7.  Repeat 40 times.

  ## 5. Scoring Rule
  *   **Base:** Every student starts with 10 tokens.
  *   **Prediction Wager:** Before running trials, each student bets 2 tokens on a probability (1/4, 1/3, 1/2, or Other).
  *   **Settlement:**
      *   If their group's observed frequency matches their bet (within $\pm 0.05$): Win 5 tokens.
      *   If their group's frequency differs by $> 0.15$: Lose 2 tokens (total -4).
      *   If they declared **Ambiguity Bond**: Settled as per Section 3.
  *   **Consensus Penalty:** If a group signed the Charter but their result differs from the Class Mean by $> 0.10$, they lose an additional 2 tokens for "Faulty Calibration." (This pressures them to believe the Charter).

  ## 6. Minute-by-Minute Timeline (75 Minutes)

  *   **00-10: Framing & Charter.**
      *   Present the City Bus Tender story.
      *   Distribute Charters. Emphasize Clause 2 ("Any Fair device must yield the same rate").
      *   **Decision Point:** Groups have 2 minutes to decide whether to Build or claim the Ambiguity Bond. (Usually, they build; the Bond is too risky without evidence).
      *   Collect signed Charters.

  *   **10-25: Construction & Calibration.**
      *   Groups open envelopes. Build devices.
      *   Instructor circulates to ensure they aren't discussing methods across groups.
      *   *Critical Check:* Ensure Group B drops the pin *on the radius*, not the whole circle. Ensure Group C rejects points outside the circle.

  *   **25-55: Data Generation.**
      *   Groups run 40 trials each. (Total 120 data points).
      *   Students record Long/Short.
      *   Calculate Group Frequency ($P(\text{Long})$).
      *   Submit Prediction Wagers.

  *   **55-65: The Reveal.**
      *   Write Group Frequencies on the board.
      *   *Expected:* Group A $\approx 0.33$, Group B $\approx 0.50$, Group C $\approx 0.25$.
      *   The Charter Clause 2 is visibly violated.
      *   Token settlement occurs. (Chaos ensues).

  *   **65-75: Debrief.**
      *   Reveal the geometry: All three devices generated **Chords**.
      *   Map Device A $\rightarrow$ Random Endpoints.
      *   Map Device B $\rightarrow$ Random Radius.
      *   Map Device C $\rightarrow$ Random Midpoint.
      *   Discuss the "Fairness" lie.

  ## 7. Debrief: Tying Moments to Concepts
  1.  **The Ill-Posedness Response:** The group that (if any) took the Ambiguity Bond. They realized "Random Route" lacked a generating process. They profited from the divergence.
  2.  **The Invariance Response:** The students who argue, "But the question was about the *routes*, not the *devices*." This fails because the set of routes is the same, but the *measure* over the set changed.
  3.  **The Generating-Process Response:** The correct dissolution. "Probability is not a property of the line; it is a property of how the line was chosen." The Charter Clause 2 was false.
  4.  **The Parameterisation Response:** (For the advanced). Show that Group B chose a uniform distance $r$, while Group C chose a uniform area $\pi r^2$. The "ignorance" was distributed over different variables.

  ## 8. Predictable Breaks & Limitations
  *   **Noise vs. Signal:** With 40 trials per group, the standard error is $\sqrt{p(1-p)/40} \approx 0.07$.
      *   $0.50$ vs $0.25$ is a $0.25$ gap ($\approx 3.5\sigma$). This should be visible.
      *   $0.33$ vs $0.25$ is a $0.08$ gap ($\approx 1\sigma$). This might overlap.
      *   *Risk:* Group A and C might look similar by chance, allowing students to claim "Two matched, so the question is mostly well-posed."
      *   *Mitigation:* Instructor should aggregate the raw data on the board. If A and C blur, point out the B outlier. The existence of *one* clear outlier breaks the "Universality" claim.
  *   **Physical Bias:** Group B's "blind pin drop" on a ruler often clusters in the middle (human bias). This pushes their result toward 1/2 anyway, but might skew variance. Group C's dice grid is discrete; ensure they understand re-rolling outside points is crucial for uniform area.
  *   **The "Different Experiments" Escape:** Students will say, "Of course they differ; you asked us to build different machines."
      *   *Counter:* Remind them of the Charter. They certified that *any* fair machine answers the *Council's* question. The Council didn't ask for "The probability from the Spinner Machine." They asked for "The probability of a Random Route." The machines were just tools to answer *that* question. The failure is in the question, not the tools.
  *   **Structural Limitation:** This activity secures the **Process** lesson. It demonstrates that $P(E)$ is undefined without a process. It does *not* mathematically demonstrate **Parameterisation** (Jacobian transformations) because students lack the calculus. They see *that* the parameters differ, but not *how* the density transforms. You must supply the math in the lecture afterward.

  ## 9. Final Verdict Analysis
  **Which lesson is secured?**
  The design secures **that a probability claim is incomplete without a specified generating process.**
  The students experience the contradiction phenomenologically. They feel the "Fairness" assumption break. They do not derive the measure-theoretic reason *why* (the parameterisation density), only *that* the method matters.

  **What would persuade me it taught Parameterisation?**
  I would need to see a student group spontaneously map the distribution of one device onto another (e.g., realizing that a uniform drop on the radius corresponds to a non-uniform distribution of midpoints). Without calculus tools, this is structurally impossible in 75 minutes.

  **Where is the reasoning weakest?**
  The "Ambiguity Bond" pricing. If the physical noise is high (likely with 40 trials), the spread might be $> 0.10$ even if the true probabilities were identical (null hypothesis). A savvy group could take the Bond and win on noise, reinforcing skepticism without understanding the paradox. Conversely, if noise masks the difference (e.g., Group B gets lucky and hits 0.35), the Bond loses, and the paradox is hidden. The lesson relies on the physical data being "clean enough" to show divergence, which is never guaranteed with $N=40$.

  Verdict: process
