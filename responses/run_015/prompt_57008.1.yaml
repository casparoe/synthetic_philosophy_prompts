prompt: |-
  I teach 26 second-year epistemology students for 75 minutes; they have had conditional probability and Bayes' theorem but no measure theory and no statistics. Design an in-class game that makes them collide with Bertrand's paradox before anyone names it: equal ignorance turned into flatly incompatible probabilities for what they will insist is a single question, where the disagreement turns out not to be arithmetic.

  Constraints: no computers — every randomizer must be buildable in five minutes from card, string, pins, dice, coins, a ruler or a hand-cut spinner. The surface framing should be ordinary (a wager, a machine, a shipment, a fair) rather than a chord in a circle, so nobody in the room recognises the puzzle, with the reveal at the end that what they built is the classical trio of chord-generating devices. Three groups build different devices that each of them would describe as picking a chord at random, and the pooled outcomes from all three go up on the board as one dataset. Score with integer tokens under a rule the groups can apply in their heads, where a confident wrong answer costs more than sitting out.

  The design problem I most need solved: "your devices are just different experiments, so nothing contradicts" is both the obvious escape and the correct dissolution, and a group that finds it in minute ten never feels anything. So the rules must extract, before any cross-group data is revealed, a written and token-backed commitment from every group that any fair device answers the same question theirs does — the escape hatch should exist only once they are on record. I also want a route by which a group that judges the question ill-posed profits by declining to bet; tell me whether that lets a sharp group exit before the lesson lands, and how to price it so it cannot.

  Deliver the framing story, a materials list and self-readable instructions per device, the scoring rule, a minute-by-minute timeline, and a debrief tying particular moments of the run to the three classical answers, the ill-posedness response, the invariance response, and the generating-process response, so each is something that happened in the room rather than something I assert. Then say what will predictably break on a first run — including where a few hundred physical trials will muddy the point instead of sharpening it — and what the activity structurally cannot deliver that I have to supply in words.

  Finally: which of the two candidate lessons does your design actually secure — that indifference is relative to a parameterisation, or that a probability claim is incomplete without a specified generating process? What would I have to see in the room to be persuaded it taught the other one, and where is your own reasoning about this design weakest? Last line exactly: Verdict: parameterisation / process.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Target Audience:** 26 second-year epistemology students (75 mins).
      *   **Background:** Conditional probability, Bayes' theorem. No measure theory, no statistics.
      *   **Goal:** Design an in-class game exposing Bertrand's Paradox *before* naming it.
      *   **Core Conflict:** Equal ignorance $\rightarrow$ incompatible probabilities for a "single question." Disagreement is not arithmetic.
      *   **Constraints:**
          *   No computers.
          *   Randomizers buildable in 5 mins (card, string, pins, dice, coins, ruler, spinner).
          *   Framing: Ordinary surface (wager, machine, shipment, fair), *not* "chord in a circle."
          *   Reveal: End of class, show the devices map to the classical chord-generating methods.
          *   Structure: 3 groups build different devices. Pooled outcomes on board.
          *   Scoring: Integer tokens. Confident wrong costs more than sitting out.
          *   **Crucial Design Problem:** Prevent the "different experiments" escape hatch too early. Force a commitment that "any fair device answers the same question." Allow an "ill-posed" exit route but price it so they can't exploit it easily.
          *   **Deliverables:** Framing story, materials, instructions, scoring, timeline, debrief, failure modes, structural limitations.
          *   **Final Verdict:** Parameterisation vs. Process.

  2.  **Deconstruct the Core Problem (The "Escape Hatch"):**
      *   *Problem:* If students realize early that "random chord" is ambiguous, they opt out. The lesson fails because they don't feel the tension.
      *   *Solution:* The framing must make the *question* seem identical across groups, while the *method* seems like mere implementation details.
      *   *Framing Idea:* A "Quality Control" scenario. A factory produces "beams" (chords). We need to know the probability a beam is "Long" (longer than side of inscribed equilateral triangle).
      *   *Commitment Mechanism:* Before building, they must sign a "Standard of Fairness" contract stating that *any* method lacking bias toward length should yield the same factory rate.
      *   *The "Ill-Posed" Exit:* Allow a group to declare "The specification is insufficient." If they are right, they get max points. If wrong (and others converge), they get zero. But since the others *won't* converge (they will diverge), this is risky. To prevent cheap exiting, require them to predict *why* it fails or bet on a specific convergence value if they think it *is* well-posed. Actually, better: To opt out, they must forfeit the game but gain a "Philosopher's Token" only if *no* group converges to the same rate. If two groups match and one opts out, the opt-out loses. This makes opting out a bet on divergence.

  3.  **Designing the Three Devices (The "Chord" Disguise):**
      *   *Classical 1 (Random Endpoints):* Pick two points on the rim.
          *   *Disguise:* "The Rim Sampler." Spin a spinner twice to mark spots on a circular rim. Connect them.
      *   *Classical 2 (Random Radius/Midpoint):* Pick a radius, pick a point on it.
          *   *Disguise:* "The Radial Drill." Pick a direction (spinner), then drop a pin along a ruler laid across the radius.
      *   *Classical 3 (Random Midpoint in Disk):* Pick a point inside the circle.
          *   *Disguise:* "The Dart Throw." Throw a pin/dart blindly at the circular area.
      *   *Wait, constraint check:* "Buildable in 5 minutes."
          *   *Rim:* Paper circle, pin spinner. Easy.
          *   *Radius:* Paper circle, ruler, die for distance? Or spinner for angle, ruler for distance.
          *   *Midpoint:* Throwing a pin at a paper circle is hard to make "uniform."
          *   *Alternative for 3:* "The Grid Drop." Overlay a grid, pick x,y with dice.
      *   *Refining the Disguise:* The prompt asks for "ordinary surface framing... rather than a chord in a circle."
      *   *Idea:* **The Bridge Cable Inspection.**
          *   Context: A suspension bridge has cables running across a circular tower face. We need to know the probability a cable is "Tense" (Longer than $\sqrt{3}R$).
          *   Group 1 (Endpoints): "The Anchor Method." Select two anchor points on the tower rim randomly.
          *   Group 2 (Radius): "The Strut Method." Select a radial strut, then a connection point along it.
          *   Group 3 (Midpoint): "The Impact Method." A meteorite hits the tower face; the cable forms perpendicular to the radius at the impact point. (This is getting too abstract).
      *   *Let's stick closer to the geometry but disguise the *intent*.*
      *   *Framing:* **The Pizza Coupon Game.** (Too trivial). **The Archery Target.** (Too close to darts).
      *   *Framing:* **The Laser Security Grid.** A circular vault. Lasers cut across. If the laser path is "Long," it triggers a sensor.
      *   *Let's try: "The Pipe Cut Problem."* A cylindrical pipe (circle face). We need to cut struts across it.
      *   *Actually, the prompt says "surface framing should be ordinary... rather than a chord in a circle."*
      *   *Idea:* **The Ferry Route Lottery.**
          *   A circular island. Ferries run straight lines between docks.
          *   Question: What proportion of possible ferry routes are "Long Haul" (longer than the side of the inscribed triangle)?
          *   Group 1: Pick two docks (endpoints).
          *   Group 2: Pick a compass direction, then a distance from center (radius).
          *   Group 3: Pick a destination point on the island for the "midpoint" of the trip.
      *   *Wait, I need them to build the device.*
      *   *Device 1 (Endpoints):* Spinner on rim. Spin twice. Connect dots.
      *   *Device 2 (Radius):* Spinner for angle. Die/Ruler for distance from center.
      *   *Device 3 (Midpoint):* Drop a bean/pin onto the circle area.
      *   *The "Chord" reveal:* The line connecting the two points / the line perpendicular to radius / the line bisected by the point.
      *   *Crucial:* They must measure the *length* of the line generated.
      *   *Threshold:* Side of inscribed equilateral triangle ($\sqrt{3}R$). Visually, this is the height of the triangle from a vertex. Or simpler: Mark the "Long" zone on a ruler.

  4.  **Forcing the Commitment (The "Trap"):**
      *   Before building, all groups sign a "Fairness Charter."
      *   Clause 1: "My device introduces no bias toward Long or Short routes."
      *   Clause 2: "Since the question asks for the probability of a *random* route, any Fair device must yield the same rate."
      *   This locks them in. If they get different results, they violated Clause 2 (which they believed) or Clause 1 (which they might defend).
      *   *The Opt-Out:* A group can declare "The Question is Ambiguous."
      *   *Pricing:* If they declare Ambiguous, they get 5 points *only if* the three device results differ by more than 10%. If the results converge (by chance), they get -5 points. This makes opting out a bet on the paradox actually happening. Given $N$ trials, convergence is unlikely if the methods are truly different. But with small $N$, noise might hide the difference.
      *   *Refining the Opt-Out:* To prevent "smart" students from bailing immediately: They must declare Ambiguous *before* seeing their own data, based *only* on the instructions. If they build and *then* say it's ambiguous, they lose.
      *   *Better:* The "Philosopher's Wager." Before building, they can bet 10 tokens that "All Fair Methods Agree." If they lose (methods disagree), they lose 10. If they win, they gain 10.
      *   *Wait, the prompt wants a route where judging the question ill-posed profits.*
      *   *Mechanism:* "The Null Hypothesis Token." A group can return their materials and submit a written argument why the rate is undefined. If the class data shows significant divergence (Chi-square or just visual spread), they win 20 points. If the data converges (due to error or luck), they lose 10. This prices the skepticism.

  5.  **Scoring & Tokens:**
      *   Start with 10 tokens.
      *   Prediction Phase: Bet on the probability (e.g., 1/2, 1/3, 1/4). Cost 2 tokens to bet.
      *   If correct (within margin): Win 5 tokens.
      *   If wrong: Lose 2 tokens.
      *   Sit out: 0 change.
      *   *Correction:* The prompt says "confident wrong answer costs more than sitting out."
      *   *Rule:* Predict $P(\text{Long})$.
      *   If $|Prediction - Actual| < 0.05$: +5 tokens.
      *   If $|Prediction - Actual| > 0.15$: -5 tokens.
      *   Else: 0.
      *   *The Commitment:* Before predicting, they must sign the "Universality Pact": "I certify that my device represents a Random Route, and thus my probability applies to *any* Random Route device."

  6.  **Timeline (75 Minutes):**
      *   0-10: Framing & Pact. (The Trap).
      *   10-25: Build & Calibrate.
      *   25-55: Run Trials (Data Generation).
      *   55-65: Pool Data & Reveal Conflict.
      *   65-75: Debrief & Map to Bertrand.

  7.  **Addressing the "Weakness" & "Verdict":**
      *   *Weakness:* Physical noise. 100 trials might not show $1/2$ vs $1/3$ vs $1/4$ clearly enough. $1/2 = 50\%$, $1/3 = 33\%$, $1/4 = 25\%$. With 100 trials, SD is $\approx 5\%$. $33\%$ and $25\%$ might overlap. $50\%$ and $33\%$ should separate.
      *   *Mitigation:* Need more trials or fewer groups. 26 students / 3 groups $\approx$ 9 students per group. If each does 10 trials, that's 90 per group. Total 270. That should be enough to see the split between 1/2 and 1/4. 1/3 is the tricky one.
      *   *Lesson Secured:* Does it teach Parameterisation or Process?
      *   *Analysis:* The activity shows that "Random" is undefined without a process. The *reason* they differ is the parameterisation (angle vs distance vs area). But the *lesson* is that probability claims require a process specification.
      *   *Prompt asks:* "Which of the two candidate lessons does your design actually secure?"
      *   *My take:* It secures **Process**. The students experience that "Random Chord" is an incomplete description. The *reason* is parameterisation, but the *takeaway* is the necessity of specifying the generating process.
      *   *To teach Parameterisation:* I would need to show them *how* to transform one to the other (Jacobian). They don't have the math. So the lesson must be Process.

  8.  **Drafting the Content:**

      *   *Framing:* "The City Grid Tender." Circular city. Bus lines.
      *   *Devices:*
          1.  **The Terminal Spinner:** Spin twice for endpoints. (Yields 1/3).
          2.  **The Distance Drop:** Pick angle, drop pin on radius. (Yields 1/2).
          3.  **The Area Toss:** Toss bean onto circle face. Midpoint of line. (Yields 1/4).
      *   *Wait, check Bertrand mappings:*
          *   Random Endpoints $\rightarrow$ 1/3.
          *   Random Radius (distance from center uniform) $\rightarrow$ 1/2.
          *   Random Midpoint (area uniform) $\rightarrow$ 1/4.
      *   *Measurement:* They need to measure length. Provide a "Gauge Stick." Mark the $\sqrt{3}R$ point.
      *   *Commitment:* The "Universal Tender Clause."
      *   *Opt-Out:* "The Ambiguity Bond." Pay 5 tokens to claim divergence. If max-min spread > 15%, get 15 tokens. Else lose 5.

      *   *Refining the "Escape Hatch" Prevention:*
          *   The prompt says: "extract... a written and token-backed commitment... that any fair device answers the same question."
          *   I will add a "Pre-Game Wager." All groups bet that their result will match the class average. If they deviate, they lose. This forces them to assert universality.
          *   Actually, better: They must predict the *Class Consensus* before building. If they predict 1/3, and the class average is 1/3, they win. But since the class average will be a mess, this punishes everyone.
          *   *Revised Commitment:* "The Standard of Fairness." To get their trial tokens, they must sign: "This device generates a Random Line. All Random Line generators produce the same probability." If they refuse, they can't play (or play as 'Skeptics').
          *   *Skeptic Route:* One group (volunteer or assigned) can be the "Auditors." They don't build. They bet that the Builders will disagree. If Builders disagree (spread > threshold), Auditors win big. If Builders agree, Auditors lose. This prices the skepticism without letting everyone opt out.

      *   *Wait, 26 students.* 3 Groups of 8, plus 2 Auditors? Or 3 Groups of 8, remainder observe?
      *   Let's make it 3 Groups of 8. 2 students left over $\rightarrow$ "The Bankers" (manage tokens/board).
      *   *Actually, let's make the "Opt-Out" available to any group.*
      *   *Rule:* Any group can return their kit before building. They submit a "Problem Statement." If the final data shows divergence, they get 20 points. If data converges, they get -10.
      *   *Why won't everyone do it?* Because with physical noise, convergence is possible. It's a risk. Also, social pressure to "play the game."

      *   *Failure Modes:*
          *   Noise masking the 1/3 vs 1/4 difference.
          *   Students realizing the geometry too early.
          *   One device being hard to build uniformly (e.g., tossing beans).
          *   *Fix:* Use a "Grid Drop" for the 1/4 case instead of bean toss. Pick X, Y coordinates with dice. Much more uniform.

      *   *Debrief:* Connect Device 1 to Endpoints, Device 2 to Radius, Device 3 to Midpoint. Show the "Fairness Charter" was the lie.

      *   *Verdict:* Process. Because without measure theory, they can't understand *why* the parameterisation changes the density. They only understand that the *description of the randomizer* was missing from the question.

  9.  **Review against Constraints:**
      *   No computers? Yes.
      *   Buildable in 5 mins? Spinner (paperclip/pin), Ruler, Dice. Yes.
      *   Ordinary framing? "City Bus Routes." Yes.
      *   Commitment mechanism? "Fairness Charter" + "Auditor Wager."
      *   Opt-out pricing? "Ambiguity Bond."
      *   Timeline? 75 mins.
      *   Verdict line? Exact phrasing required.

  10. **Final Polish:**
      *   Ensure the "Long" threshold is easy to measure. $\sqrt{3}R \approx 1.732 R$. If Radius = 10cm, Threshold = 17.3cm. Diameter = 20cm.
      *   Make sure the instructions don't give away the geometry. Call them "Routes."
      *   Ensure the "Escape Hatch" logic is clear in the scoring.

      *(Self-Correction on the "Opt-Out"):* If a group opts out, they don't generate data. If *all* opt out, no data. I need at least two groups to build to show the conflict.
      *   *Rule:* Only one group may claim the "Ambiguity Bond." First to declare. This creates a game-theoretic tension. Do I build and try to win, or bet on the others failing to agree?
