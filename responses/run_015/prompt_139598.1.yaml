prompt: |-
  I direct service planning at a mid-sized regional transit authority, and one of the recurring arguments in my shop is about information purchases: before we commit to a route restructure, a capital bus-lane project, a fare change, or a new service agreement, someone proposes that we first buy some more knowledge — an on-board origin–destination survey, a few weeks of automated passenger counters, a consultant travel-demand model, an eight-week pilot, an equity analysis — and we have no disciplined way to decide. These come up maybe fifteen or twenty times a year at a formal level, at stakes between roughly thirty thousand and three million dollars, and every recommendation has to survive a finance director who wants a dollar figure plus the three assumptions driving it, and, above a hundred thousand, a board that reads nothing else. Whoever runs the procedure will be a planning analyst with a spreadsheet, about an hour per case, and no taste for decision theory, so it has to be operable without the vocabulary while still tracking what the theory actually says. The theory I am leaning on is the result usually called Good's theorem: that an agent who updates by conditioning and then chooses to maximize expected utility cannot, judging before the message arrives and averaging over the messages it might receive, be made worse off by information that is free, because it can always shrug and act exactly as it would have acted without it. I have absorbed that slogan from years of reading rationalist blogs, and my problem is precisely that it is a slogan: it licenses our default instinct that looking can never hurt and that more measurement is always progress, which I no longer believe, but I cannot reconstruct from the slogan which assumption is doing the work, so I cannot tell when it stops protecting us.

  So I want a written procedure, not an essay: an ordered set of steps with a time box on each, a statement of what counts as a sufficient answer at each step, the nodes where it stops with a no, and the nodes where it hands the question to a named human because the issue is one of values rather than fact. Several things need to be built in explicitly rather than left to the analyst's judgment. There should be a decision-invariance check up front: if the choice we would make is the same under every result the instrument could plausibly return, the value is zero no matter how interesting the study is, and the procedure should stop there. There needs to be an upper bound computed as the value of deciding with clairvoyance about the one quantity that actually matters, and then an explicit descent from that bound to the instrument we could really buy — my analysts currently just report the clairvoyance number, which is why every proposal looks worth funding — and I want your view on the discounting rule my senior analyst has drafted, which multiplies the bound by the correlation between what the instrument measures and the decision-relevant quantity. I also want the procedure to force the estimate to be written and dated before the purchase and never quietly revised afterward, to separate the ex ante guarantee from the ex post fact that a particular result can genuinely leave us worse off, to handle sequencing honestly (we keep adding the values of three studies together, and I am told that is wrong because value is not additive across signals and depends on what you already expect to learn), to say what to do when a needed number is simply unavailable — an uncertainty band, a sensitivity table, a break-even question, whatever is defensible in ten minutes — and to state, in so many words, which steps are judgment wearing a lab coat. Most importantly, it needs a failure check for the theorem's assumptions, covering at least these: the information cannot actually be ignored because a policy, contract, or board rule commits us to react to it; the message changes what other agents do rather than only what we believe; the instrument measures a proxy that downstream readers will treat as the quantity itself; the arrival of the number changes the set of acts available or their payoffs, including by taking so long that the window for acting closes; and the case where the information is nominally free to us because a grant pays for it. For each of those I want to know not just that the non-negativity argument lapses but what the procedure should output instead.

  Then apply it to three live proposals, showing the arithmetic with your assumptions written down, and give me the one-page memo template the analyst would fill in. First: an eight-week Sunday-service pilot on Route 14 costing about sixty thousand dollars. My planners love pilots on principle and will fight me on this, but the earliest we could add Sunday service is eleven months out because it needs operators we cannot hire until the next fiscal year, the pilot would run in July and August while the parallel rail line is down for maintenance, and I suspect that a weak result would be explained away and a strong result would change nothing about the timeline; if the procedure says skip it, say so flatly, and if it saves the pilot, tell me which step saved it. Second: a forty-thousand-dollar stated-preference and travel-diary survey intended to decide whether to extend Route 7 two miles to the new regional medical campus, at about three hundred thousand a year in operating cost, instead of keeping the current alignment and funding an on-demand shuttle. This decision is genuinely live and I think the clairvoyance bound here is large; my worry is that the survey measures stated intent among residents in a two-mile band rather than boardings at particular stops during clinic shift changes, that it excludes the shift workers we most care about, and that it returns in four months when we need to file the grant application in six weeks — so I want the procedure to tell me whether to buy it, buy a re-scoped and much cheaper version such as a two-week manual ride check at the existing transfer point, or buy nothing. Third: a federally funded equity and farebox-recovery analysis of our fare-free program, costing us nothing, whose publication would trigger an adopted board rule automatically scheduling a discontinuation hearing for any route below a recovery threshold for two consecutive quarters, and which advocacy groups and the union would use in ways we cannot control. I expect the procedure to flag this as a case where information makes us worse off precisely because we are not free to ignore it once it exists; I want that stated, I want the remaining question handed to a person with an account of what the person should actually be deciding, and I want you to be candid about the option of commissioning an internal version that is never published, since that is choosing ignorance instrumentally and has its own costs. Finally, tell me what this procedure cannot settle: which inputs are irreducibly judgment, where it will systematically misfire at an authority like mine, and how I should describe its limits in the memo without giving the board a reason to ignore it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Director of Service Planning at a mid-sized regional transit authority.
      *   **Problem:** Recurring arguments about purchasing information (surveys, pilots, models, etc.) before making decisions. No disciplined way to decide *whether* to buy the information.
      *   **Constraints:**
          *   Stakes: $30k - $3M.
          *   Frequency: 15-20 times/year.
          *   Audience: Finance Director (wants $ + 3 assumptions), Board (reads nothing else above $100k).
          *   Operator: Planning analyst with a spreadsheet, ~1 hour per case, no decision theory vocabulary.
          *   Theoretical Basis: Good's Theorem (information has non-negative expected value), but the user knows this is often misapplied ("looking can never hurt").
          *   Goal: A written procedure (steps, time boxes, stop nodes, human handoffs), not an essay.
      *   **Specific Requirements:**
          *   Decision-invariance check (if action doesn't change, value = 0).
          *   Upper bound (Value of Perfect Information - VOPI) + discounting rule critique (analyst uses correlation).
          *   Ex-ante estimate locking (date/write before purchase).
          *   Sequencing handling (value not additive).
          *   Handling missing numbers (uncertainty bands, etc.).
          *   Identify "judgment wearing a lab coat."
          *   Failure checks for Good's Theorem assumptions (forced reaction, strategic agents, proxy reification, delay costs, "free" grant money).
          *   Output for failure cases (not just "theorem lapses," but what to do).
          *   Application to 3 live proposals (Sunday pilot, Route 7 survey, Equity analysis).
          *   One-page memo template.
          *   Limitations section (what the procedure can't settle).

  2.  **Deconstruct Good's Theorem & Its Failures in this Context:**

      *   *Good's Theorem:* $E[U|Info] \ge E[U|No Info]$.
      *   *Assumptions:*
          1.  Information is costless (or cost is subtracted).
          2.  Agent can ignore information (action set invariant).
          3.  Agent updates via Bayes (rational).
          4.  Payoffs are stable (time doesn't erode value).
          5.  Information doesn't change *other* agents' actions (single agent).
          6.  Information is about the state of the world, not a proxy that becomes the target (Goodhart's Law).
      *   *User's specific failure modes:*
          1.  **Forced Reaction:** Board rules/contracts mandate action based on the metric.
          2.  **Strategic Agents:** Publishing data changes rider/union behavior.
          3.  **Proxy Reification:** Measuring $X$ but deciding on $Y$, treating $X$ as $Y$.
          4.  **Delay/Opportunity Cost:** Time to get info closes the window.
          5.  **"Free" Money:** Grant pays for study, but study triggers costs/risks.

  3.  **Drafting the Procedure (The "Core"):**

      *   *Format:* Step-by-step, time-boxed, binary exits.
      *   *Step 1: Decision Invariance.* (5 mins). If Action A is taken regardless of Result X or Y, stop. Value = 0.
      *   *Step 2: The "Free" & "Forced" Check.* (5 mins). Is it actually free? Are we forced to act on the result? If forced, VOI calculation is invalid; hand to Director.
      *   *Step 3: The Ceiling (VOPI).* (10 mins). Calculate max value of knowing the *decision variable* perfectly. (Difference between best action with perfect info vs. best action now).
      *   *Step 4: The Discount (Realism).* (15 mins). Analyst's correlation rule is weak. Need a "Signal Quality" factor (0-1) based on validity, timing, and proxy risk.
      *   *Step 5: The Cost & Sequencing.* (10 mins). Subtract cost. Check if this study replaces or adds to previous ones (non-additive).
      *   *Step 6: The Lock.* (5 mins). Sign and date. No ex-post revision.
      *   *Step 7: Judgment Flag.* (5 mins). Explicitly list assumptions that are guesses.

  4.  **Critiquing the Analyst's Discounting Rule:**

      *   *Current:* Multiply VOPI by correlation ($r$).
      *   *Problem:* Correlation isn't probability of changing the decision. A high correlation might still leave uncertainty in the *critical region* (near the decision threshold). Also, $r$ is hard to estimate.
      *   *Better:* Estimate $P(Change Decision)$. Or use a conservative "Signal Quality" score based on validity/timing/proxy issues. Let's stick to something an analyst can do in an hour: Estimate the probability the new data changes the decision *and* changes it to the *right* thing.
      *   *Refinement for the Procedure:* Use a "Decision-Change Probability" ($P_{change}$) multiplied by the "Stakes of Being Wrong." This is closer to Expected Value of Sample Information (EVSI) without the complex math.

  5.  **Addressing the Failure Modes (The "Safety Valves"):**

      *   *Forced Reaction:* Output = "Policy Risk." Hand to Director.
      *   *Strategic Agents:* Output = "Game Theory Risk." Hand to Director.
      *   *Proxy Reification:* Output = "Metric Risk." Adjust Signal Quality down or hand off.
      *   *Delay:* Output = "Time Decay." Subtract opportunity cost of delay from VOI.
      *   *Free Grant:* Output = "Hidden Cost." Treat trigger risks as costs.

  6.  **Applying to the Three Cases:**

      *   *Case 1: Sunday Pilot ($60k).*
          *   Invariance: Can we implement Sunday service before pilot results? No (11 months out).
          *   Timing: Pilot is July/Aug (Rail down). Is this representative? No.
          *   Decision: Will a weak result stop it? Planners say no ("explain away"). Will a strong result speed it up? No (hiring bottleneck).
          *   Verdict: **Stop.** Decision Invariant. The hiring bottleneck dictates the timeline, not the pilot.
      *   *Case 2: Route 7 Survey ($40k).*
          *   Decision: Extend Route 7 vs. On-Demand Shuttle.
          *   VOPI: High (300k/yr operating cost difference).
          *   Signal Quality: Low. Stated preference $\neq$ revealed preference. Excludes shift workers.
          *   Timing: Returns in 4 months. Grant due in 6 weeks.
          *   Verdict: **Stop/Modify.** Too slow, wrong metric. Suggest manual ride check (cheaper, faster, actual behavior).
      *   *Case 3: Equity Analysis ($0 cost).*
          *   Cost: $0.
          *   Constraint: Board rule triggers hearing if recovery < threshold.
          *   Risk: Publication forces action we might not want (political/union fallout).
          *   Good's Theorem Failure: We cannot ignore the message.
          *   Verdict: **Hand to Director.** This is a governance/policy decision, not a planning calculation. Option: Internal version (risk of leak vs. need for truth).

  7.  **Drafting the Memo Template:**

      *   Needs to be one page.
      *   Fields: Proposal, Cost, Decision at Stake, Invariance Check, VOPI Ceiling, Signal Discount, Net Value, Assumptions, Go/No-Go.

  8.  **Addressing Limitations:**

      *   Garbage In, Garbage Out (estimates are still guesses).
      *   Political reality (Board might fund anyway).
      *   Innovation (sometimes you buy info to learn, not to decide immediately).
      *   Analyst bias (they want to do the study).

  9.  **Refining the Tone:**

      *   Professional, direct, operational.
      *   No academic jargon (no "Bayesian updating," use "change of mind").
      *   Acknowledge the user's sophistication but respect the analyst's constraints.

  10. **Review against Constraints:**

      *   *Time box:* Included in steps.
      *   *Stop nodes:* Included.
      *   *Human handoff:* Included for value judgments.
      *   *Discounting rule critique:* Included.
      *   *Failure checks:* Included.
      *   *Three cases:* Calculated.
      *   *Template:* Provided.
      *   *Limitations:* Provided.

  11. **Self-Correction/Polishing during drafting:**

      *   *Correction on Discounting:* The analyst's correlation rule is mathematically suspect for VOI. Correlation measures linear association, not decision utility. I need to replace it with a "Probability of Changing the Decision" estimate, which is intuitive for an analyst. "How likely is this number to make us flip from Plan A to Plan B?"
      *   *Correction on Case 1:* Make sure to highlight *why* the pilot fails. It's not just cost; it's that the result doesn't change the *timing* or the *go/no-go* due to external constraints (hiring, rail maintenance).
      *   *Correction on Case 3:* Be careful advising on the "internal version." That's ethically fraught. Frame it as "Governance Decision on Transparency vs. Risk."
      *   *Formatting:* Use bolding and lists to make it skimmable for the Director and usable for the Analyst.

  12. **Final Polish:** Check the "Good's Theorem" explanation. Ensure I explicitly state *which* assumption breaks in each failure case. (e.g., "Assumption: Agent can ignore information. Reality: Board rule forces action.")

  *(Self-Correction during final review)*: The prompt asks for "the one-page memo template the analyst would fill in." I need to make sure that's distinct from the procedure itself. The procedure is the *how*, the memo is the *artifact*.

  Let's assemble the response.

  *   **Part 1: The Procedure.** (Steps 1-7).
  *   **Part 2: The Discounting Rule Critique.**
  *   **Part 3: Failure Mode Handling.**
  *   **Part 4: Application to 3 Cases.**
  *   **Part 5: The Template.**
  *   **Part 6: Limitations.**

  *Wait, one detail:* "Tell me which steps are judgment wearing a lab coat." I need to explicitly label these in the procedure.
  *Another detail:* "Sequencing honestly." I need a step that asks "Did we already buy something that answers 80% of this?"

  *Refining the Discounting Rule:* The analyst uses correlation. I need to tell the Director *why* that's wrong and what to put in the procedure instead. Correlation $\rho$ between signal $S$ and state $\theta$ doesn't directly give EVSI. EVSI depends on the probability the signal moves the posterior across the decision threshold.
  *Practical fix for Analyst:* Ask them to estimate "Probability this study changes our decision." Then multiply VOPI by that probability. It's a heuristic, but better than correlation.

  *Refining Case 3:* The "internal version" option. I need to be candid. It creates a two-tier truth system. The procedure should flag the *risk* of publication, not necessarily solve the ethics. The handoff to the Director is key here.

  *Final check on time:* The whole process needs to take ~1 hour. The steps need to reflect that.

  Okay, ready to write.
answer: |-
  # The Information Purchase Procedure (IPP)

  **Purpose:** To determine whether purchasing data, studies, or pilots increases expected net value before committing funds.
  **Operator:** Planning Analyst.
  **Time Limit:** 60 Minutes.
  **Output:** One-page "Information Value Memo" (see template at end).

  ---

  ### Step 1: Decision Invariance Check (5 Minutes)
  **Action:** Define the specific decision this information informs (e.g., "Extend Route 7: Yes/No"). List the plausible results of the study (e.g., "High Demand," "Low Demand").
  **Question:** If the study returns "Low Demand," do we still extend? If it returns "High Demand," do we still extend?
  **Stop Node:** If the action is the same regardless of the result, **STOP.** Value = $0. Do not purchase.
  **Judgment Label:** *Defining "plausible results" requires judgment. Do not list impossible outliers to force a purchase.*

  ### Step 2: The "Forced Hand" & "Free Money" Check (5 Minutes)
  **Action:** Check for external constraints on using the information.
  **Questions:**
  1.  Does a board policy, contract, or grant rule *require* us to act on this specific metric if it falls below a threshold?
  2.  Is the study "free" (grant-funded), but publication triggers automatic political or legal consequences?
  **Stop Node:** If **YES** to either, **STOP.** Do not calculate value.
  **Handoff:** Route immediately to **Director of Planning**. This is a governance risk, not a planning calculation. Good's Theorem fails here because the agent cannot ignore the message.

  ### Step 3: The Clairvoyance Ceiling (VOPI) (10 Minutes)
  **Action:** Calculate the maximum value of knowing the *decision variable* perfectly today.
  **Arithmetic:**
  1.  Estimate the net benefit of the *best* decision if we knew the future perfectly (e.g., Avoid $300k loss).
  2.  Estimate the net benefit of the *current best* decision without new info (e.g., Risk $100k loss).
  3.  **Ceiling = (1) - (2).**
  **Judgment Label:** *Benefit estimates are judgment wearing a lab coat. Use the Finance Director's approved ranges.*

  ### Step 4: Signal Quality Discount (15 Minutes)
  **Action:** Estimate how well this specific instrument predicts the decision variable.
  **Critique of Current Rule:** Do **not** use correlation ($r$). Correlation measures linear association, not the probability of changing a decision near a threshold. A high correlation can still leave you uncertain exactly where it matters.
  **New Rule:** Estimate **$P_{change}$** (Probability this study changes our decision).
  **Factors reducing $P_{change}$:**
  *   **Proxy Risk:** Does it measure intent (survey) rather than behavior (boardings)?
  *   **Timing Risk:** Will the data arrive after the decision window closes?
  *   **Sample Risk:** Does it exclude key populations (e.g., shift workers)?
  **Arithmetic:** **Expected Value = Ceiling $\times$ $P_{change}$.**
  **Judgment Label:** *$P_{change}$ is subjective. Require a one-sentence justification for the percentage.*

  ### Step 5: Sequencing & Sunk Costs (10 Minutes)
  **Action:** Check for prior information purchases.
  **Question:** Have we already bought data that answers 50%+ of this question?
  **Rule:** Value is not additive. If Study A was bought, Study B's value is only the *marginal* reduction in uncertainty, not the total.
  **Adjustment:** If prior studies exist, reduce **Expected Value** by 50% unless the analyst can prove independence.

  ### Step 6: The Cost & Time Decay (10 Minutes)
  **Action:** Subtract direct cost and delay costs.
  **Arithmetic:** **Net Value = Expected Value - Study Cost - (Delay Weeks $\times$ Weekly Opportunity Cost).**
  **Stop Node:** If Net Value < $0$, **STOP.** Recommend "No Purchase."
  **Judgment Label:** *Opportunity cost of delay is often zeroed out by analysts. Force a number (e.g., staff time, inflation, ridership loss).*

  ### Step 7: The Lock (5 Minutes)
  **Action:** Complete the Memo Template.
  **Requirement:** Sign and Date.
  **Rule:** This document is an **Ex-Ante Guarantee**. It cannot be revised after the study results are known. If the study fails to deliver value, this memo is the record of why it was approved.
  **Handoff:** If Net Value > $0 but < $100k, Analyst signs. If > $100k, Director signs (for Board).

  ---

  ### Failure Mode Protocols
  *When Step 2 flags a Good's Theorem assumption failure, do not calculate value. Output the following:*

  1.  **Forced Reaction (Board Rule/Contract):**
      *   **Output:** "Policy Trigger Risk."
      *   **Action:** Hand to Director. The decision is not "buy study," it is "change the policy that forces our hand."
  2.  **Strategic Agents (Union/Riders):**
      *   **Output:** "Game Theory Risk."
      *   **Action:** Hand to Director. Publishing data may alter rider behavior or union bargaining positions, changing the payoffs themselves.
  3.  **Proxy Reification (Goodhart's Law):**
      *   **Output:** "Metric Distortion Risk."
      *   **Action:** Reduce $P_{change}$ to near zero. If staff will optimize for the metric rather than the goal, the information degrades system utility.
  4.  **Delay/Window Closure:**
      *   **Output:** "Opportunity Cost Exceeds Value."
      *   **Action:** Set Net Value to negative. The cost of waiting is the cost of the study.
  5.  **"Free" Grant Money:**
      *   **Output:** "Hidden Liability."
      *   **Action:** Treat the *consequences of publication* as a cost. If publication forces a service cut that costs political capital, assign a dollar value to that risk and subtract it.

  ---

  ### Application to Live Proposals

  #### 1. Route 14 Sunday-Service Pilot
  *   **Cost:** $60,000.
  *   **Step 1 (Invariance):** **FAIL.** Earliest implementation is 11 months out (hiring bottleneck). Pilot runs July/Aug (rail down).
      *   *Scenario A (Strong Pilot):* Cannot implement sooner than 11 months. Action = Wait.
      *   *Scenario B (Weak Pilot):* Planners argue "rail down skewed data." Action = Wait.
  *   **Step 2 (Forced Hand):** No formal rule, but political pressure exists.
  *   **Step 6 (Net Value):** Since action (Wait 11 months) is invariant to the result, Ceiling = $0.
  *   **Verdict:** **SKIP.**
  *   **Reason:** Decision Invariance. The hiring timeline, not the demand data, dictates the schedule. The pilot buys "political cover," not decision value.
  *   **Analyst Note:** Do not fund "principles." Fund decisions.

  #### 2. Route 7 Extension Survey
  *   **Cost:** $40,000.
  *   **Stakes:** $300,000/yr operating cost difference.
  *   **Step 3 (Ceiling):** If we choose wrong, we waste $300k/yr. Let's assume a 5-year horizon = $1.5M risk. Ceiling is high.
  *   **Step 4 (Signal Quality):**
      *   *Proxy Risk:* Stated preference $\neq$ boardings.
      *   *Sample Risk:* Excludes shift workers (primary users).
      *   *Timing:* Returns in 4 months. Grant due in 6 weeks.
      *   *$P_{change}$:* Low. Data arrives too late for the grant. If we wait for data, we lose the grant (100% cost).
  *   **Step 6 (Net Value):**
      *   Delay Cost = Loss of Grant Funding (assume $500k).
      *   Net Value = (Value of Info) - $40k - $500k = **Negative.**
  *   **Verdict:** **SKIP SURVEY. BUY MANUAL COUNT.**
  *   **Alternative:** Two-week manual ride check at transfer point. Cost: $5k. Time: 2 weeks. Measures actual behavior.
  *   **Reason:** Timing risk and proxy risk invalidate the survey. The "Free Money" (grant) has a deadline that makes the expensive study too slow.

  #### 3. Federally Funded Equity Analysis
  *   **Cost:** $0 (Grant funded).
  *   **Step 2 (Forced Hand):** **FAIL.** Board rule triggers automatic hearing if recovery < threshold.
  *   **Good's Theorem Failure:** We cannot ignore the message. The "cost" of the information is the loss of agency to manage the political fallout.
  *   **Step 5 (Sequencing):** We likely have internal farebox data already. This study just repackages it for public consumption.
  *   **Verdict:** **HAND TO DIRECTOR.**
  *   **Reason:** This is not a planning decision; it is a governance decision.
  *   **Director's Decision:**
      1.  **Publish:** Accept the risk of the automatic hearing.
      2.  **Internal Version:** Commission an internal analysis (costing staff time) to prepare for the hearing *before* the federal one publishes.
      3.  **Waiver:** Attempt to waive the board rule before the study concludes.
  *   **Note on Internal Version:** Commissioning an internal version to be kept secret is "choosing ignorance instrumentally." It is defensible if used to prepare mitigation, but indefensible if used to hide truth from the Board. The procedure flags this as a **Governance Risk**, not a planning cost.

  ---

  ### Information Value Memo (Template)

  | **Field** | **Entry** |
  | :--- | :--- |
  | **Proposal Name** | |
  | **Analyst** | **Date:** |
  | **Decision at Stake** | *e.g., Extend Route 7: Yes/No* |
  | **1. Invariance Check** | ☐ Pass (Result changes decision) ☐ Fail (Action same regardless) |
  | **2. Constraint Check** | ☐ Pass (No forced reaction) ☐ Fail (Hand to Director) |
  | **3. Clairvoyance Ceiling** | $ _______________ *(Max loss avoided if we knew truth)* |
  | **4. Signal Probability ($P_{change}$)** | ______ % *(Likelihood this study flips the decision)* |
  | **Justification for $P_{change}$** | *e.g., "Survey excludes shift workers, timing misses grant deadline."* |
  | **5. Sequencing Adj.** | ☐ None ☐ 50% Reduction (Prior data exists) |
  | **6. Costs & Delays** | Study: $_______ Delay Cost: $_______ Total: $_______ |
  | **7. Net Expected Value** | **(Ceiling $\times$ $P_{change}$) - Costs = $_______________** |
  | **Recommendation** | ☐ Purchase ☐ Do Not Purchase ☐ Escalate to Director |
  | **Key Assumptions** | 1.<br>2.<br>3. |
  | **Sign-off** | *I certify these estimates were made before results were known.* |

  ---

  ### Limitations & Implementation Notes

  **What This Procedure Cannot Settle:**
  1.  **Garbage In, Garbage Out:** The analyst's estimate of $P_{change}$ is still a guess. A biased analyst can inflate this number. *Mitigation:* Director audits 1 out of 5 "Purchase" recommendations quarterly.
  2.  **Innovation vs. Optimization:** This procedure optimizes known decisions. It discourages "exploratory" research where the decision isn't defined yet. *Mitigation:* Create a separate "R&D Budget" line item that does not require this memo, capped at 2% of the planning budget.
  3.  **Political Reality:** The Board may fund a study regardless of value (e.g., to show "action"). *Mitigation:* The memo records the *planning* value. If the Board funds it for *political* value, that is their prerogative, but the record shows it was not operationally efficient.

  **Where It Will Misfire:**
  *   **Crisis Mode:** In an emergency (strike, natural disaster), time boxes are too long. Suspend procedure for emergencies declared by the Director.
  *   **Long-Term Modeling:** Travel demand models have value over 20 years, not one decision. *Mitigation:* Amortize the "Ceiling" over the model's useful life, but discount heavily (50%) for uncertainty.

  **How to Describe Limits to the Board:**
  > "This procedure ensures we do not buy data that cannot change our actions. It does not guarantee the data will be accurate, only that it is relevant. It treats information as an asset with a cost, not a virtue. It assumes we are willing to *not* act if the data says so; if policy requires us to act regardless, this procedure correctly identifies the study as a compliance cost, not a planning tool."

  **Final Advice on the Analyst's Discount Rule:**
  Tell your senior analyst: *"Correlation is not utility. A study can be perfectly correlated with a variable that doesn't matter, or weakly correlated with the one variable that bankrupts us. Switch to estimating the probability of changing the decision ($P_{change}$). It forces you to think about the decision threshold, not just the statistical fit."*
