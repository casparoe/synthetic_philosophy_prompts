  The panel is likely to prioritize **current functional outcome** over **biological mechanism**. They view disease as a *burden on the life of the patient*, not a *deviation in the code of the body*. The EMTA case challenges this by presenting a "burden" that is entirely political (the risk of fortification stopping) rather than biological. By ruling "Not a Disease," they affirm that health is a status of the *organism-in-environment*, not just the organism. By ruling "Disease," they would affirm that health requires *biological self-sufficiency*. The precedents suggest they prefer the former.
