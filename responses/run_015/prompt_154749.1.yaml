answer: |-
  ### 1. Exam Question

  **Module:** PHI502 Methods of Scientific Inquiry
  **Time:** 90 Minutes
  **Word Limit:** 1,000 words maximum

  **Question 1: The Island of Ravens**

  Consider a closed ecosystem (an isolated island) containing exactly 200 ravens. No ravens enter or leave. Two ecologists are testing the hypothesis *H*: "All ravens on this island are black."

  They employ different sampling protocols:
  *   **Protocol A:** Visit known nesting sites and record the colour of every raven encountered.
  *   **Protocol B:** Walk a 1km transect from a random point and record every *non-black* object encountered.

  Under Protocol B, an ecologist records a white plastic bottle on the beach. Define the **counterfactual yield** of an observation as the set of alternative observations the specific protocol could have produced in that same sampling instance. For the white bottle under Protocol B, the yield includes the possibility of having found a non-black raven (which would refute *H*). Under Protocol A, the observation of a bottle is impossible; the yield consists only of ravens (black or otherwise).

  **Answer the following:**

  1.  Does the observation of the white bottle confirm *H*? Explain whether your answer changes depending on whether *H* refers strictly to the 200 island ravens or to ravens universally.
  2.  Critically evaluate the concept of *counterfactual yield*. Does appealing to the protocol's potential outcomes resolve the paradox, or does it merely shift the problem?
  3.  Conclude by arguing what confirmation should be *for* in this context (e.g., updating credence, ensuring predictive reliability, or ruling out error), and how this dictates the value of the bottle observation.

  *Note: Do not simply recite the logical equivalence of "All ravens are black" and "All non-black things are non-ravens." You are expected to engage with the methodological constraints provided.*

  ***

  ### 2. Model Answer

  **The Bottle, The Protocol, and The Purpose of Confirmation**

  The observation of the white bottle confirms *H* logically, but methodologically its value is negligible. To understand why, we must move beyond the logical equivalence condition (that *H* is equivalent to "All non-black things are non-ravens") and examine the probabilistic context of the sampling protocol.

  **1. Confirmation and Population Scope**
  Under strict logical hypothetico-deductivism, the bottle confirms *H* because it is a non-black non-raven, satisfying the contrapositive. However, confirmation is not merely logical consistency; it is a shift in probability. Whether *H* concerns the 200 island ravens or all ravens universally drastically alters the Bayesian likelihood.
  If *H* is unrestricted (all ravens everywhere), the class of "non-black things" is effectively infinite. Finding one non-black non-raven shifts the probability of *H* by an infinitesimal amount. If *H* is restricted to the 200 island ravens, the universe of discourse is finite. Here, the bottle confirms *H* only if the sampling method makes it likely that we *would* have found a non-black raven if one existed. Under Protocol B (looking for non-black objects), the probability of encountering a raven is vanishingly small compared to encountering debris. Thus, while the bottle is technically consistent with *H*, it provides almost no evidential weight because the test lacked the capacity to falsify *H* efficiently.

  **2. The Role and Limits of Counterfactual Yield**
  The concept of *counterfactual yield* attempts to salvage the intuition that Protocol A is superior to Protocol B. It suggests that evidence is weighty only if the protocol could have produced a falsifier. The bottle's yield under Protocol B includes a non-black raven; therefore, observing the bottle "survives" a potential falsification.
  However, this concept breaks down if treated merely as a possibility. Merely *possible* falsification is insufficient; the probability of that falsification must be significant. If the island is covered in white plastic but has only 200 ravens, Protocol B will almost always yield non-ravens regardless of *H*'s truth. The counterfactual yield exists, but the *likelihood* of accessing the falsifying member of that yield is too low to make the actual observation informative. The yield tells us about the *design* of the test, not just the logical space of outcomes. It highlights that confirmation depends on the *procedure* generating the data, not just the data itself (Good, 1967).

  **3. What Confirmation Is For**
  Ultimately, the puzzle persists because we confuse confirmation as "probability boosting" with confirmation as "error probing." If confirmation is merely moving subjective probabilities, the bottle counts, however trivially. But if confirmation is for **predictive reliability** and **intervention**, the bottle is useless.
  A scientist accepting *H* based on Protocol B data cannot reliably predict the colour of the next raven found at a nest. The protocol did not probe the causal mechanism or the population of interest; it probed the population of beach debris. Therefore, the bottle should not be treated as confirming *H* for any practical scientific purpose. The paradox dissolves when we recognise that confirmation is not a static relation between proposition and evidence, but a dynamic assessment of how severely a hypothesis has been tested. Protocol A is severe; Protocol B is not. The bottle is a pass on a test that was too easy to matter.

  ***

  ### 3. Marking Scheme (Total: 20 Marks)

  **1. The Equivalence Condition & Probabilistic Context (5 Marks)**
  *   **Must Hit:** Acknowledge that while logic treats the contrapositive as equivalent, evidential support depends on the background probability of the evidence (Bayesian approach).
  *   **Distinction:** Must explain that the *scope* of H (200 ravens vs. universal) changes the reference class size, altering the magnitude of confirmation.
  *   **Common Fumble:** Students treat the contrapositive as a full solution ("It confirms, end of story") or dismiss it entirely without explaining the probabilistic nuance. They fail to distinguish between the finite island case and the infinite universe case.

  **2. Analysis of Counterfactual Yield (5 Marks)**
  *   **Must Hit:** Explain that yield captures the *potential for falsification* inherent in the method, not just the logical possibilities.
  *   **Critique:** Must identify that "possibility" is not enough; the *probability* of encountering a falsifier under that protocol must be non-negligible for the yield to matter.
  *   **Common Fumble:** Students define yield but treat it as a magic bullet that solves the paradox without analyzing the *likelihood* of the counterfactual outcomes. They assume Protocol B is valid simply because a non-black raven *could* have been found.

  **3. Closed vs. Unrestricted Population (4 Marks)**
  *   **Must Hit:** Articulate why the finite population (200 ravens) makes the sampling math different from the standard paradox (infinite ravens).
  *   **Insight:** In a finite set, sampling non-ravens reduces the pool of unchecked objects, but if the non-raven pool is vast relative to ravens, the confirmation remains negligible.
  *   **Common Fumble:** Treating the island scenario exactly the same as the universal paradox, ignoring the "closed system" constraint provided in the prompt.

  **4. The Purpose of Confirmation (A-Grade Discriminator) (6 Marks)**
  *   **Must Hit:** Move beyond "degree of belief" to argue what confirmation achieves (e.g., Severity, Prediction, Intervention).
  *   **Argument:** Must conclude that the bottle fails to confirm *H* *for scientific use* because the test lacked severity, even if it shifts probability technically.
  *   **Common Fumble:** Ending with a fence-sitting conclusion ("It confirms a little bit") without addressing *why* we care about confirmation in science. Failing to link the protocol choice to the reliability of future predictions.

  **Grading Notes:**
  *   **17-20 (Distinction):** Hits all points, specifically excelling on point 4. Clear distinction between logical consistency and methodological severity.
  *   **13-16 (Merit):** Hits points 1-3 well but offers a generic conclusion on point 4.
  *   **10-12 (Pass):** Identifies the protocol difference but relies too heavily on standard Nicod/Hempel recitation.
  *   **<10 (Fail):** Ignores the protocol setup; answers based solely on logical equivalence.
