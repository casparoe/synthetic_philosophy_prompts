answer: |-
  Here is the specification for the argument, the critique of those specifications, and the specific historical stipulations you need to make the scene work.

  ### Part 1: The Spec (Requirements for an Adaptation Claim)

  To claim "Trait T is an adaptation for Function F" is in good standing, the theory must satisfy the following requirements. Note the distinction between *current utility* (is it useful now?) and *historical origin* (did selection build it for this?).

  1.  **Heritability and Variation:**
      *   *Requirement:* There must be genetic (or equivalent) variation in the trait within the population, and that variation must be heritable.
      *   *Consideration:* If every harrin has the exact same rasp due to developmental inevitability, selection cannot act on it. It's a constraint, not an adaptation.
  2.  **Fitness Contribution (Current Utility):**
      *   *Requirement:* Possessing Trait T must confer a net reproductive advantage over lacking it (or having a smaller version) in the current environment.
      *   *Consideration:* This distinguishes **Adaptation** (selected for) from **Maladaptation** (harmful) or **Neutral Trait** (drift). Dass has this data (bigger keels = more fledglings).
  3.  **The History vs. Utility Distinction:**
      *   *Requirement:* The claim must specify if it is about *origin* (selected for F originally) or *maintenance* (currently kept by selection for F, even if originally for G).
      *   *Consideration:* This distinguishes **Adaptation** (historical) from **Exaptation** (co-opted). A trait can be adaptive now without being an adaptation *for* that function historically.
  4.  **Constraint Ruling (The Spandrel Check):**
      *   *Requirement:* The proponent must demonstrate that the trait is not merely an unavoidable by-product of physics, development, or another selected trait.
      *   *Consideration:* This distinguishes **Adaptation** from **Architectural By-product**. (e.g., The keel is hollow not because hollow is best for sound, but because *inflation-hardening* always leaves a hollow chamber).
  5.  **Cost-Benefit Analysis (Optimality):**
      *   *Requirement:* The benefit must outweigh the metabolic/ecological cost. If a cheaper solution exists in nature but isn't used, the theory must explain why.
      *   *Consideration:* This distinguishes **Optimal Design** from **Locally Suboptimal/Path-Dependent** traits. High cost suggests strong selection pressure; low cost allows for drift.
  6.  **Level of Selection (Whose Fitness?):**
      *   *Requirement:* The claim must identify the unit of selection. Is the trait benefiting the *morph* (the individual body) or the *colony* (the genetic whole)?
      *   *Consideration:* In colonial organisms, morphs are often sterile. If the rasp-bearing morph is sterile, the fitness benefit must accrue to the colony's reproductive morphs. If the benefit is to the colony but the cost is to the morph, this is **Group/Colony Selection**.
  7.  **Trait Individuation:**
      *   *Requirement:* The theory must define where the trait begins and ends. Is "the rasp" just the mineral, or the shape, or the resonance?
      *   *Consideration:* If the trait is a complex bundle, one part might be an adaptation (mineralization) while another is a by-product (hollowness). Lumping them creates a strawman.
  8.  **Comparative/Phylogenetic Context:**
      *   *Requirement:* The trait's distribution across related species should match the ecological pressure.
      *   *Consideration:* If relatives have keels but *don't* hunt the same way, the keel might not be for hunting. Dass admits this data is messy ("no clean match").

  ---

  ### Part 2: The Critique (Desiderata vs. Prejudices)

  **Which are real desiderata?**
  *   **Heritability/Variation:** Non-negotiable. No variation, no evolution.
  *   **Constraint Ruling:** Non-negotiable. If physics dictates the shape, selection gets no credit.
  *   **Level of Selection:** Critical for colonial organisms. Ignoring this is biological illiteracy.

  **Which are prejudices?**
  *   **Strict Optimality:** This is the Adaptationist prejudice. Biology is full of "good enough" solutions, not optimal ones. Demanding the rasp be the *best* possible sound-maker is a strawman Fenn can easily knock down.
  *   **Historical Certainty:** This is the Skeptic's trap. Fenn demands proof of origin (history) in a context where history (fossils) is erased. Demanding 100% historical verification when the record is gone is unreasonable.

  **Are any jointly unsatisfiable?**
  *   **Yes.** *Requirement 3 (Historical Origin)* and *The Setting Constraints (No Fossils/No Lab)*.
      *   Dass cannot prove the *origin* without fossils.
      *   Fenn cannot disprove the *origin* without fossils.
      *   If the argument hinges on "Was it *originally* for sound?", the scene will stall because neither can win. This is likely why you are flubbing the draft. You are asking them to fight a battle that is empirically unwinnable.

  **Which requirement does the most work?**
  *   **Constraint Ruling (Req 4).** This is Fenn's strongest weapon. The "inflation-hardening" method is a developmental constraint. If the keel *must* be hollow and mineralized to exist at all, then the sound might just be noise that comes for free. Dass has to prove selection *tweaked* the constraint, not just rode it.

  **Which are negotiable for the novel?**
  *   **Comparative Context (Req 8).** You can stipulate the data is ambiguous.
  *   **Optimality (Req 5).** You can allow the trait to be costly. Cost actually *helps* Dass (Handicap Principle: it must be useful if they pay this price) and *helps* Fenn (why pay the price if it's just a byproduct?). It's a perfect pivot point.

  ---

  ### Part 3: Scorecard

  | Criterion | **Dass (Reverse-Engineering)** | **Fenn (Gould-Lewontin Skeptic)** | **Third Option (Pluralist/Exaptationist)** |
  | :--- | :--- | :--- | :--- |
  | **Focus** | Current Utility & Fit | Historical Origin & Constraint | Interaction of Both |
  | **Strength** | Explains *why it stays*. The data shows bigger keels = more young. | Explains *why it looks like this*. The hollow chamber is a construction artifact. | Explains the *mismatch*. Useful now, but built for then. |
  | **Weakness** | Cannot prove history. Risks "Just-So Story." | Cannot offer alternative mechanism. Risks nihilism (nothing is an adaptation). | Complex to explain in dialogue. |
  | **Verdict** | **Right about Maintenance.** | **Right about Architecture.** | **Right about Truth.** |

  ---

  ### Part 4: The Novelist's Question (Creating the Stalemate)

  To make this a genuine stalemate where both characters are reasonable, you must stipulate a history that validates Dass's *data* but confirms Fenn's *suspicion*.

  **The Stipulation:**
  The rasp is an **Exaptation of a Developmental Constraint.**

  1.  **The Constraint (Fenn is Right):** The mineralization and hollowness are *not* adaptations for sound. They are unavoidable consequences of the "inflation-hardening" growth method used in the juvenile aquatic stage for buoyancy. You cannot build a harrin keel without it being a hollow, mineralized tube. Fenn is correct that the *architecture* is a by-product.
  2.  **The Co-Option (Dass is Right):** However, the *dimensions* of the tube (length, thickness, tension) *are* under current selection. The colony could grow a small, dull keel (saving energy), but it grows a large, resonant one. The sound was not the *origin*, but it is the *maintenance*.
  3.  **The Ambiguity (The Stalemate):**
      *   **Dass's Evidence:** She has data showing colonies with resonant keels fledge 20% more young. She argues: "Selection is tuning the rasp."
      *   **Fenn's Evidence:** He has data showing related species have massive keels but make no sound (different atmospheric density or hunting style). He argues: "The rasp is a buoyancy tank that you're romanticizing. The sound is incidental noise."
      *   **The Unresolvable Knot:** Because there are no fossils, Dass cannot prove the keel *shrunk* in non-hunting relatives (which would prove selection acted on it). Fenn cannot prove the sound provides *no* benefit (only that it wasn't the origin).

  **How to play the scene:**
  *   **Don't let Dass argue Origin.** Have her argue **Maintenance**. "I don't care if it started as a float, Fenn. It's a horn now. The colonies that tune it survive."
  *   **Don't let Fenn argue Utility.** Have him argue **Sufficiency**. "It works, sure. But does it work enough to justify the mineral cost? Or is it just a loud float that happens to scare fish?"
  *   **The Colony Complication:** Make the rasp-bearing morph **sterile**.
      *   *Dass:* "It helps the colony reproduce."
      *   *Fenn:* "Then why is the variation so high between morphs? If it's colony selection, the colony should standardize the rasp. The variance suggests drift."
      *   *Truth:* The variance is high because the environment changes rapidly, but neither character has the longitudinal data to prove it.

  **Why this fixes the scene:**
  Currently, you might be writing Dass as trying to prove "This was designed for sound" (which Fenn can crush with the buoyancy fact) and Fenn as trying to prove "It does nothing" (which Dass can crush with the fledgling data).

  By shifting the ground:
  *   Dass admits: "Okay, it's a modified float."
  *   Fenn admits: "Okay, it helps hunting."
  *   **The Fight:** Is the hunting benefit strong enough to explain the *cost*, or is the cost just tolerated because the float is necessary anyway?
      *   Dass: "The cost is too high for a mere float. Selection is pushing it."
      *   Fenn: "The cost is low relative to the colony's budget. It's a spandrel we like because it's pretty."

  This makes them two experts looking at the same elephant, one touching the trunk (function), one touching the feet (structure), both refusing to admit the other defines the whole animal. That is a stalemate worth writing.
