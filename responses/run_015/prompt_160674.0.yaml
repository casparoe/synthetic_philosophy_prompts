prompt: |-
  i'm four drafts into a novel set on a planet that isn't Earth and there's one scene I keep flubbing, and I think it's because I don't actually know what the argument is about, so I end up making one character a strawman.

  The setup: my field biologist, Dass, has done two seasons on a colonial glider called a harrin. The whole clade is soft-bodied, so there are no fossils, none, and Dass can't do lab manipulations out there. Harrin grow a big keel on the underside — the "rasp" — on only one of the colony's three morphs. It's expensive to grow. It's rigid because it's mineralised, and the hollow inside is there because of how it's built: the thing is inflated with gas and then hardened, so the chamber is an architectural leftover of the building method. In the aquatic juvenile stage that same chamber works as a float. In the adult, the keel resonates when the morph glides and makes a low sound, and Dass has decent data that bigger-keeled colonies fledge more young — partly because the sound seems to coordinate hunting, partly because it startles prey into the net-glides. Related species have keels of every size and Dass can find no clean match between keel size and anything ecological she can measure. Her colleague Fenn is a Gould–Lewontin style sceptic and thinks "it's an adaptation for X" is a just-so story with a number taped to it.

  Here's the thing: I get to stipulate the actual history, because I invented the world. What I want from you first is the spec, not the verdict.

  What does a theory have to deliver before a claim like "the rasp is an adaptation for X" is in good standing? Give me the requirement list, with the case or consideration behind each one — the distinctions it has to be able to draw and not collapse (adaptation, exaptation, architectural by-product of a developmental constraint, trait currently maintained by selection but not originally selected for, trait drifted up and later co-opted, trait good for the colony rather than its bearer), whether "adaptation" is a historical claim about a token lineage or a forward-looking claim about current fitness contribution and whether one trait can be an adaptation under one of those and not the other, what kinds of evidence are admissible and which ones become non-negotiable when the usual channels are closed (no fossils, no clean comparative spread, no experimental manipulation), what separates a testable adaptationist hypothesis from a story, how much optimality you're allowed to demand and what happens to costly or locally suboptimal traits, how finely the trait itself gets individuated and what you do when it has more than one current function, and whose fitness is even in question when the bearer is one morph of a colony.

  Then the parts I actually care about: which of those requirements are real desiderata and which are just the prejudices of one camp; whether some subset can't be satisfied together (if the list turns out to be jointly unsatisfiable, say so plainly, that's the most useful thing you could tell me); which single requirement does the most work in knocking out candidate theories; and which requirements are negotiable given my purpose, which is narrower than a journal's — I need the standard that makes both Dass and Fenn reasonable people arguing well from the evidence available in a field camp, not the standard for publishing. A short scorecard at the end for the reverse-engineering/optimism style, the Gould–Lewontin style, and whatever third option you think belongs on it, but keep the weight on the criteria, the scoring is the part I can fake.

  Last thing, the novelist's question: if I want the disagreement to be a genuine stalemate rather than Fenn being pig-headed, which bits of the rasp's real history should I stipulate?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A novelist is on draft four of a sci-fi novel. There's a specific scene causing trouble because the argument between two characters (Dass, field biologist; Fenn, skeptic) feels unbalanced (strawman).
      *   **Subject:** Evolutionary biology on an alien planet. Specifically, the function/origin of a mineralized keel ("rasp") on a colonial glider organism ("harrin").
      *   **The Task:**
          1.  **The Spec:** Provide a requirement list for what makes a claim like "the rasp is an adaptation for X" valid. Cover specific distinctions (adaptation vs. exaptation, constraint, drift, levels of selection, historical vs. current utility, evidence types without fossils/experiments, optimality, trait individuation, colony fitness).
          2.  **The Critique:** Evaluate these requirements. Which are real desiderata vs. prejudices? Are any jointly unsatisfiable? Which requirement knocks out the most candidates? Which are negotiable for a *novel* (making both characters reasonable)?
          3.  **The Scorecard:** Briefly score Reverse-Engineering/Optimism (Dass), Gould-Lewontin/Skepticism (Fenn), and a Third Option.
          4.  **The Novelist's Question:** What specific history of the rasp should be stipulated to make the disagreement a genuine stalemate (both reasonable) rather than Fenn being pig-headed?

  2.  **Deconstruct the Science (Evolutionary Biology/Philosophy of Biology):**
      *   *Adaptationism:* The view that natural selection is the primary driver of trait evolution. Traits are usually optimal solutions to ecological problems.
      *   *Gould-Lewontin (Spandrels of San Marco):* Critique of adaptationism. Warns against assuming every trait is an adaptation. Highlights constraints, drift, exaptation (co-option), and by-products.
      *   *The Specific Problem:* No fossils (deep history obscured), no lab manipulation (hard to test function directly), limited comparative data (only one related clade with variable keels).
      *   *The Organism:* Colonial. This introduces Multi-Level Selection issues. Is the trait for the *morph* or the *colony*?
      *   *The Trait:* Costly, mineralized, hollow (developmental constraint?), resonant (current function), buoyant in juvenile (potential exaptation).

  3.  **Drafting Part 1: The Spec (Requirements for an Adaptation Claim):**
      *   Need to address the prompt's specific list of distinctions.
      *   *Requirement 1: Heritability & Variation.* (Basic Darwinism).
      *   *Requirement 2: Fitness Contribution (Current).* Does it help survival/reproduction *now*?
      *   *Requirement 3: Historical Selection (Origin).* Was it *selected for* this function originally? (Crucial distinction: Adaptation vs. Exaptation).
      *   *Requirement 4: Constraint Ruling.* Can we rule out physics/development as the *sole* cause? (The "Spandrel" check).
      *   *Requirement 5: Levels of Selection.* Who benefits? The morph or the colony?
      *   *Requirement 6: Optimality/Cost.* Is the benefit worth the cost? (Costly signaling/handicap principle).
      *   *Requirement 7: Trait Individuation.* Is "the rasp" one trait or a complex of traits?
      *   *Requirement 8: Evidence Admissibility.* What counts when fossils are gone? (Comparative, modeling, observational).

  4.  **Drafting Part 2: The Critique (Desiderata vs. Prejudices):**
      *   *Real Desiderata:* Heritability, Fitness Contribution, Constraint Ruling.
      *   *Prejudices/Debated:* Strict Optimality (biology is messy), Historical Certainty (often impossible without fossils).
      *   *Jointly Unsatisfiable:* "Prove Historical Origin" + "No Fossils/Deep Time Data." You literally cannot satisfy strict historical proof without a fossil record or time travel. This is the core tension.
      *   *Most Work:* The "Constraint Ruling" (Could this happen just because of how things grow?).
      *   *Negotiable for Fiction:* Strict statistical significance, perfect comparative datasets. We need *plausibility*, not publication.

  5.  **Drafting Part 3: The Scorecard:**
      *   *Dass (Adaptationist):* Strong on current utility, weak on history.
      *   *Fenn (Skeptic):* Strong on alternative explanations (constraints), weak on offering a testable alternative.
      *   *Third Option (Exaptation/Pluralist):* Acknowledges current utility but denies original intent.

  6.  **Drafting Part 4: The Novelist's Question (The Stalemate):**
      *   To make it a stalemate, the truth must be ambiguous.
      *   *Idea:* The rasp *is* useful now (Dass is right about function), BUT it originated for something else or as a constraint (Fenn is right about origin).
      *   *Specific Stipulation:* The hollow chamber is a developmental constraint (inflation hardening). The mineralization was originally for juvenile buoyancy (exaptation). The sound is a secondary co-option.
      *   *Why it creates stalemate:* Dass sees the hunting success (Current Fitness). Fenn sees the developmental cost and lack of ecological correlation in relatives (History/Constraint). Neither can *prove* the other wrong with current field data.
      *   *Refinement:* Make the cost high enough that Fenn's skepticism is valid (why pay the cost if it's just a byproduct?), but the benefit high enough that Dass's optimism is valid (why keep it if it doesn't help?).
      *   *The "Colony" angle:* The morph with the rasp doesn't reproduce directly (sterile caste?). If so, selection acts on the colony. Fenn might argue it's drift at the colony level; Dass argues colony-level selection.

  7.  **Review and Refine:**
      *   *Tone:* Professional, analytical, respectful of the science but focused on the narrative utility.
      *   *Check:* Did I answer all parts of the prompt?
          *   Spec list? Yes.
          *   Critique of requirements? Yes.
          *   Scorecard? Yes.
          *   Stipulation for stalemate? Yes.
      *   *Nuance Check:* Ensure the distinction between "Adaptation" (historical process) and "Adaptive" (current utility) is clear, as this is the heart of the Gould-Lewontin critique.
      *   *Constraint Check:* The prompt mentions the hollow inside is an architectural leftover. This is a huge clue for Fenn. I need to make sure Dass has a counter for why it's *maintained* if it's a leftover. (Answer: Co-option).

  8.  **Final Polish:** Organize with clear headings. Ensure the "Novelist's Question" provides concrete plot hooks. (Self-Correction: Make sure not to get too bogged down in real-world jargon without explaining it in the context of the story).

  *(Self-Correction during drafting)*: I need to be careful about the "colony" aspect. If it's a colonial organism (like a siphonophore), the "morph" might be sterile. If the morph is sterile, individual selection doesn't apply, only colony selection. This complicates the "whose fitness" question. I should highlight this as a specific point of contention.

  *(Refining the Stalemate)*: The best stalemate is when the data supports *both* interpretations equally well.
  *   Dass: "It works perfectly for hunting." (Current Utility)
  *   Fenn: "It's built like a construction artifact, not an engineered tool." (Historical/Constraint)
  *   Truth: It *is* a construction artifact that was co-opted. But without fossils, you can't prove the co-option timeline.

