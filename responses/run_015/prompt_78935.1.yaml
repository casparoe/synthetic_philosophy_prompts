      *   **Critical (The "Fatal" Flaw):** C1 vs. C2 (and C5). You cannot hold that STP is a substantive rational constraint (C1) and that Ellsberg choices which violate STP are rationally permissible (C2). Savage's framework *defines* rationality as adherence to the axioms.
