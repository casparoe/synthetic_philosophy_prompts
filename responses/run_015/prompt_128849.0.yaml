prompt: |-
  I'm working on a chapter about bodily autonomy law and I'm stuck on an asymmetry. In most legal systems, you can refuse a life-saving blood transfusion for any reason, and we never force someone to donate a kidney to save a dying relative — but abortion restrictions often treat carrying a pregnancy to term as a duty that can override refusal. What theory of moral status or harm does that instutional pattern actually presuppose? Does it only make sense if you accept something like the future-like-ours argument that the fetus is already a person with rights, or can Thomson's violinist analogy explain why pregnancy is treated differently from kidney donation? And if the practice is meant to be consistent with our refusal rights elsewhere, does it smuggle in a view about 'natural' versus 'artificial' bodily support that we don't apply to other cases? I feel like there's an implicit philosphy of personhood buried in the legal distinction but I can't tell if it's one coherent view or just a mess of ad hoc commitments.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Topic:** Bodily autonomy law, specifically the asymmetry between refusal of medical treatment/donation (blood, kidney) and abortion restrictions.
      *   **The Asymmetry:**
          *   Case A: Refusing life-saving blood transfusion (allowed).
          *   Case B: Refusing to donate a kidney to save a dying relative (allowed).
          *   Case C: Carrying a pregnancy to term (often mandated/restricted, overriding refusal).
      *   **Key Questions:**
          *   What theory of moral status or harm does this legal pattern presuppose?
          *   Does it require the "future-like-ours" (Marquis) argument (fetus = person with rights)?
          *   Can Thomson's violinist analogy explain the difference?
          *   Does it rely on a "natural" vs. "artificial" bodily support distinction?
          *   Is there a coherent philosophy of personhood, or is it just ad hoc commitments?
      *   **Goal:** The user is writing a chapter and needs help untangling the philosophical and legal underpinnings of this inconsistency.

  2.  **Initial Brainstorming & Mapping the Landscape:**

      *   *Thomson's Violinist:* Famous argument. Even if the fetus is a person, you aren't obligated to use your body to keep it alive. This supports the *asymmetry* (pregnancy should be like kidney donation). If the law restricts abortion, the law *rejects* Thomson's conclusion.
      *   *Marquis (Future-Like-Ours):* Abortion is wrong because it deprives the fetus of a future. This explains *why* abortion is restricted, but doesn't necessarily explain the *bodily autonomy* asymmetry unless combined with a duty to rescue.
      *   *Special Responsibility/Duty:* Parents have duties to children that strangers don't have to strangers. This is a strong legal counter-argument to Thomson.
      *   *Natural vs. Artificial:* The "natural function" argument. Pregnancy is "what bodies do," transfusions/kidney donations are medical interventions. This is often implicit in conservative legal reasoning (e.g., *Dobbs* history/tradition).
      *   *State Interests:* The state has an interest in potential life that outweighs the woman's liberty interest (post-*Roe* pre-*Casey*, and heavily in *Dobbs*).
      *   *Coherence:* Is it coherent? Many philosophers argue it's not. Legal realists argue it's about social control, not moral philosophy.

  3.  **Structuring the Response:**

      *   **Acknowledge the Depth:** Validate that this is a central, difficult problem in bioethics and jurisprudence.
      *   **Analyze the Asymmetry (The "What"):** Clearly define the tension between negative rights (refusal) and positive duties (pregnancy).
      *   **Theory 1: The Moral Status of the Fetus (Personhood):** Discuss Marquis and the "Right to Life" trumping bodily autonomy.
      *   **Theory 2: Special Obligations (Parental Duty):** This is the strongest legal counter to Thomson. Distinguish stranger vs. parent.
      *   **Theory 3: The "Natural" Function Argument:** Address the user's specific hunch about natural vs. artificial.
      *   **Theory 4: Thomson's Violinist (and why the law rejects it):** Explain that if the law restricts abortion, it is effectively *disagreeing* with Thomson, not using her logic.
      *   **Synthesis/Critique:** Is it coherent? (Likely no, it's a mix of status, duty, and tradition).
      *   **Suggestions for the Chapter:** How to frame this analysis.

  4.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Validate the user's insight. It *is* an asymmetry.
      *   *The Thomson Challenge:* Clarify that Thomson argues *for* the asymmetry (pregnancy = kidney donation). If the law restricts abortion, the law is rejecting Thomson. So Thomson doesn't explain the restriction; she highlights the inconsistency.
      *   *The "Personhood" Premise:* Does it require fetus = person? Not necessarily full personhood, but "potential personhood" + state interest. Marquis gives the *value*, but not the *bodily use* right.
      *   *The "Special Duty" Counter-Argument:* This is crucial. We don't force strangers to donate kidneys. We *do* force parents to feed/save children. If the fetus is a child, the duty applies. This bridges the gap between Case B and Case C.
      *   *The "Natural vs. Artificial" Distinction:* User asked about this. Yes, this is often implicit. "Letting nature take its course" vs. "medical intervention." Critique this: Pregnancy is physiologically burdensome, not just passive.
      *   *The Coherence Question:* Is it a mess? Legal Realism suggests it's about gender roles and state interest in reproduction, not pure moral philosophy.
      *   *Harm Theory:* Refusal of treatment = self-harm (allowed). Refusal of pregnancy = harm to other (forbidden). But this circles back to status.

  5.  **Refining the Arguments (Self-Correction/Nuance):**

      *   *Correction:* Be careful not to say the law *is* consistent. The user suspects it isn't. I should support that suspicion while explaining the *attempted* justifications.
      *   *Nuance on Thomson:* Thomson grants the fetus personhood for the sake of argument. The law often doesn't even need to grant full personhood, just "potential life" (as in *Roe/Casey* framework, though *Dobbs* changed the constitutional standard, the moral logic remains).
      *   *Nuance on Parental Duty:* Does parental duty extend to *before birth*? That's the crux. The law treats conception as triggering the duty.
      *   *Nuance on Naturalism:* The "natural law" tradition is strong here. Finnis, etc.

  6.  **Final Polish:**

      *   Ensure the tone is academic but accessible.
      *   Use specific philosophical references (Thomson, Marquis, Feinberg, Enoch).
      *   Address the "ad hoc" suspicion directly.

  7.  **Final Review against User Query:**
