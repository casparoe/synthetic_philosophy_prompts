answer: |-
  This is one of the sharpest questions in contemporary bioethics and jurisprudence. You have correctly identified that the legal treatment of pregnancy is an outlier compared to almost every other domain of bodily integrity law.

  To answer your core question: **No, Thomson's analogy does not explain why pregnancy is treated differently; rather, it highlights the inconsistency.** If the legal system were applying Thomson's logic, abortion restrictions would not exist. Therefore, the institutional pattern you are observing presupposes a specific, often unstated, combination of **moral status**, **special obligation**, and **natural law** that does not apply to blood transfusions or kidney donations.

  Here is a breakdown of the philosophical commitments required to sustain that asymmetry, and an analysis of whether they cohere.

  ### 1. The Rejection of Thomson (The "Good Samaritan" vs. "Parental Duty" Distinction)
  Judith Jarvis Thomson's "A Defense of Abortion" (1971) grants the fetus full personhood for the sake of argument but asserts that no person has the right to use another's body against their will. Her violinist analogy equates pregnancy with kidney donation (Case B in your schema).

  If the law restricts abortion, it is explicitly **rejecting Thomson's premise**. It is asserting that the relationship between a pregnant person and a fetus is not akin to the relationship between a stranger and a violinist (or a sibling and a kidney patient).

  **The Presupposed Theory:** To make sense of the asymmetry, the law must presuppose a **Special Duty of Rescue** based on causality or kinship.
  *   **Strangers:** We have no legal duty to donate organs or blood to strangers (negative right to bodily integrity prevails).
  *   **Parents:** We *do* have legal duties to provide life-sustaining care to our children (e.g., you cannot withhold food or medical care from a born infant).
  *   **The Move:** Anti-abortion law treats the fetus as a **child** to whom a **parental duty** is already owed.

  **The Philosophical Problem:** This creates a tension regarding *when* parental duty begins. Most ethical systems locate parental duty at birth or legal recognition. By moving this duty to conception, the law presupposes that **biological gestation creates a moral contract that voluntary medical donation does not.** This implies that the "duty" is not based on consent (since one can get pregnant without consenting to sex, or via contraception failure), but on the biological fact of the dependency itself.

  ### 2. The "Future-Like-Ours" and Moral Status (Marquis)
  You asked if this only makes sense if we accept something like Don Marquis's "Future-Like-Ours" argument.
  *   **Marquis's Claim:** Abortion is wrong because it deprives an entity of a valuable future.
  *   **Relevance to Asymmetry:** Marquis explains why the *fetus's life* is valuable, but it does not explain why the *pregnant person's body* must be the instrument of that survival. A dying relative also has a "future-like-ours," yet we do not force you to donate a kidney to preserve it.

  **The Presupposed Theory:** To bridge this gap, the law must combine Marquis-style value with a **Right to Necessity**. This suggests that the fetus's right to life is not just a negative right (don't kill me) but a **positive right** (keep me alive with your body).
  *   **Incoherence:** In almost every other legal context, a negative right to life does not generate a positive right to another's bodily resources. If the law treats pregnancy differently, it presupposes that the fetus has a **property claim** or a **lien** on the pregnant person's body that no other human being has on another. This is a unique category of personhood: *personhood with bodily entitlements.*

  ### 3. The "Natural" vs. "Artificial" Distinction
  Your hunch about "natural" versus "artificial" bodily support is legally astute. This is often the hidden variable in conservative jurisprudence (visible in *Dobbs*' reliance on "history and tradition").

  *   **The Argument:** Refusing a blood transfusion or kidney donation is interfering with a medical process. Refusing pregnancy (via abortion) is interfering with a **biological function**.
  *   **The Presupposition:** This relies on a **Natural Law** framework where the "telos" (purpose) of the reproductive system creates a normative duty. Under this view, the body "belongs" to nature or God in a way that medical contexts do not.
  *   **Why it's Ad Hoc:** As you noted, we do not apply this elsewhere. We allow people to refuse life-saving insulin (artificial) or even stop eating (natural). We allow sterilization (interfering with natural function). The "natural function" argument is selectively applied only to pregnancy, suggesting it is not a coherent principle of bodily autonomy but a **gendered exception**.

  ### 4. Is it a Coherent View or a Mess?
  You asked if there is an implicit philosophy of personhood or just a mess of ad hoc commitments. Most legal philosophers and bioethicists lean toward the latter, though the "mess" follows a specific political logic.

  **The Incoherence:**
  1.  **Consent:** We prioritize consent in organ donation (even to save a life). In pregnancy, the lack of consent to sex (in cases of rape) is often legally irrelevant to the duty to carry (in strict prohibition regimes), or the lack of consent to pregnancy (contraceptive failure) is overridden.
  2.  **Risk:** Kidney donation carries surgical risk; pregnancy carries significant health risk. Yet the law mandates the higher-risk "donation" (pregnancy) while forbidding the lower-risk one (forced organ harvest).
  3.  **Status:** If the fetus is a person, why does it have *more* rights than a born person (the right to use someone's body)? If it is not a person, why does it have *more* rights than the pregnant person (the right to override bodily autonomy)?

  **The "Coherent" Political Philosophy:**
  If there is a coherence, it is not found in liberal individualism (which prioritizes bodily integrity) but in **communitarian or patriarchal theories of the family.**
  *   **The State's Interest:** The state views the womb as a public resource for the continuation of the polity.
  *   **The Family Unit:** The law presupposes that the pregnant person is not an autonomous individual but a **fiduciary** for the fetus.
  *   **The Hidden Premise:** The asymmetry makes sense *only if* you view pregnancy not as a medical condition or a bodily burden, but as a **social role** that supersedes individual rights.

  ### Suggestions for Your Chapter
  To capture this nuance, you might frame the asymmetry not as a logical puzzle to be solved, but as a **clash of moral frameworks**:

  1.  **The Liberal Framework (Thomson/Feinberg):** Bodily integrity is a "side constraint." No duty to rescue using one's body. (Supports abortion rights/kidney refusal).
  2.  **The Status Framework (Marquis/Natural Law):** The moral status of the fetus creates a duty that overrides the side constraint. (Supports abortion restrictions).
  3.  **The Critical Lens:** Point out that the law switches between these frameworks opportunistically. It uses the **Status Framework** to mandate pregnancy (fetus has rights) but reverts to the **Liberal Framework** regarding the father (men have no duty to support the pregnancy physically/financially in the same way, historically) or regarding post-birth support (the state provides minimal safety nets).

  **Conclusion for your argument:**
  The institutional pattern presupposes that **pregnancy is a unique moral category** where the usual rules of bodily sovereignty are suspended. This suspension cannot be justified by standard theories of personhood (which would align fetus with kidney patient) or standard theories of harm (which would prioritize the pregnant person's physical risk). It ultimately relies on a **normative view of gender and reproduction** that treats the capacity for gestation as a public duty rather than a private bodily function. It is likely less a coherent philosophy of personhood and more a **jurisprudence of social obligation** disguised as moral protection.

  This distinction allows you to argue that the law isn't "confused" about personhood; it is **consistent about subordination.** It treats the pregnant body as an instrument for the state's interest in potential life, a status it grants to no other citizen in any other medical context.
