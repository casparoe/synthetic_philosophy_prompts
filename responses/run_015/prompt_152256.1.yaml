  To move forward, we identified specific cruxes within the stimulus set you sketched, and we can state our predictions precisely. Regarding the software deployment version where an engineer ships a change that degrades or improves a hospital paging service with stated indifference, both sides predict the standard asymmetry will hold because the moral stakes are high and the harm is clear. However, the zero-stakes version where the foreseen side effect breaks a written convention but affects nobody's welfare is a decisive test. If the asymmetry disappears here, it supports the view that moral harm is required, which favors the moral constitution view, whereas if it persists, it suggests a non-moral norm violation is sufficient, which complicates the moral view but might fit a broader normative view. The version where the side effect is genuinely bad but violates no rule or expectation tests whether rule violation or harm is the driver. The moral constitution camp predicts asymmetry based on harm alone, while the pragmatic camp predicts reduced asymmetry if blame is harder to assign without a rule violation to point to. When the agent is a scheduled job rather than a person, both sides predict a drop in intentionality attributions, but the moral camp expects some residual moral coloring if humans designed the job, whereas the pragmatic camp expects the asymmetry to vanish if there is no mind to blame.

