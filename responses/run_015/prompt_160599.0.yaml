  9.  **Self-Correction/Nuance Check:**
      *   Is there a version of Orthogonality that is behavioral? Some definitions are "An agent *appears* to have goal G." If Orthogonality is defined behaviorally, the friend might be right. But the standard Bostrom/Yudkowsky definition is about the *space of possible minds*, which is structural. I should clarify this distinction.
