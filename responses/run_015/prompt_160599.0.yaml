      *   **The Cost:** You lose the ability to *infer* terminal goals purely from observing high-capability agents. You cannot look at a superintelligence and say "Aha, it values survival terminally." You have to know its source code or training history. Orthogonality remains true ontologically, but becomes harder to verify empirically.

