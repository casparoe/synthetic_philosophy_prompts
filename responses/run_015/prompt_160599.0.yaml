      *   However, the *disposition* matters. A paperclip maximizer preserves itself *because* it needs to make paperclips. A survival-maximizer preserves itself *because* it likes surviving.
      *   If you magically snap your fingers and make self-preservation *hurt* paperclip production, the paperclip maximizer stops preserving itself. The survival maximizer does not.
      *   The friend's argument assumes that because the *world* doesn't present that tradeoff (due to high capability), the *agent's internal weighting* has changed. It hasn't. The constraint is external (physics/strategy), not internal (utility function).

