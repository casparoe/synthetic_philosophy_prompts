answer: |-
  # The Justification Regress: A Sorting Instrument

  ## Preamble: The Entry Commitment
  Before beginning, the group must agree on a starting constraint. This is not a question, but the ground rule for the tree.

  **The Support Principle:** "We agree that for a technical claim (a commit, a design choice, a bug report) to be accepted as 'verified', it cannot simply assert itself. There must be something else—a log, a test, a specification—that supports it. A claim cannot justify itself merely by being repeated."

  *Note:* If anyone in your group rejects this (e.g., "Some claims are self-justifying by definition"), they bypass the tree and land immediately in **Strong Foundationalism**. If they reject it because "Nothing is ever verified," they land in **Suspension**. If they accept it, proceed to Node 1.

  ---

  ## The Decision Tree

  **Node 1: The Termination Requirement**
  Consider a chain of verification: Commit A is verified by Log B, Log B is verified by Spec C, Spec C is verified by Requirement D...
  **Question:** Must this chain eventually hit a 'bottom' item that does not itself require verification from a prior item?
  *   **Yes (It must stop):** Go to Node 3.
  *   **No (It can go on):** Go to Node 2.

  **Node 2: The Access Constraint (Distinction A)**
  Imagine the chain never hits a bottom. It goes back forever.
  **Question:** Is this acceptable if your system is 'lazy'? That is, you don't need to hold the whole infinite chain in your head at once, provided you can always generate the previous link on demand when challenged?
  *   **Yes (Lazy loading is enough):** Go to Leaf **Infinitism**.
  *   **No (You must hold it):** Go to Leaf **Suspension**.
      *   *Ambiguity Flag:* If you answered 'No' because "infinite storage is physically impossible," but 'Yes' to "it would be logically fine if we could," you are technically an Infinitist constrained by hardware, not a Sceptic. Score as **Infinitism**.

  **Node 3: The Cycle Permission (Distinction B)**
  We agree the chain must resolve (stop or loop).
  **Question:** Is it permissible for the 'bottom' item to point back to the 'top' item, forming a circle? (e.g., Document A certifies Document B, and Document B certifies Document A).
  *   **Yes (Cycles allowed):** Go to Node 4.
  *   **No (Acyclic only):** Go to Node 6.

  **Node 4: The Global Health Check**
  You allow cycles.
  **Question:** Is it enough that every link in the circle supports its neighbour locally, or must the whole system of beliefs pass a global consistency check (like an integration test across the whole repo)?
  *   **Local support is enough:** Go to Leaf **Unnamed**.
  *   **Global consistency required:** Go to Node 5.
      *   *Diagnosis:* The 'Local support' leaf is rarely defended. It allows isolated bubbles of justification (A supports B, B supports A, but both contradict C and D). Most who accept cycles insist on global coherence.

  **Node 5: The Input Requirement**
  You require global consistency in a cycle.
  **Question:** Does the system need at least one link to check against something outside the system (e.g., a live production log, a sensor read, a user report), or is internal consistency sufficient?
  *   **Internal consistency is enough:** Go to Leaf **Pure Coherentism**.
  *   **Needs outside input:** Go to Leaf **Impure Coherentism**.

  **Node 6: The Base Fallibility**
  You reject cycles; the chain must stop at a 'base' item.
  **Question:** Could this base item still be wrong? (e.g., You stop at a sensor read, but the sensor could be broken).
  *   **Yes (It could be wrong):** Go to Node 7.
  *   **No (It is incorrigible):** Go to Node 8.

  **Node 7: The Authority Source**
  The base item could be wrong, but we stop there anyway.
  **Question:** Why do we stop? Is it because this item is a direct contact with reality (like a raw log stream), or because our team's protocol says 'this is where we stop checking'?
  *   **Direct contact (Nature):** Go to Leaf **Modest Foundationalism**.
  *   **Protocol says so (Convention):** Go to Node 9.

  **Node 8: The Reason Type (Distinction C)**
  The base item cannot be wrong.
  **Question:** Does it stop because it needs *no* reason at all, or because the reason is of a different kind (e.g., immediate awareness, like seeing a compile error flash red)?
  *   **No reason needed:** Go to Leaf **Unnamed**.
  *   **Different kind of reason:** Go to Leaf **Strong Foundationalism**.
      *   *Diagnosis:* The 'No reason' leaf is often called 'Dogmatism'. Strong Foundationalists usually insist the base *is* justified, just not by inference.

  **Node 9: The Scope of Practice**
  You stop because the protocol says so.
  **Question:** Is this stopping point fixed for everyone (any rational engineer), or only for your specific team/project context?
  *   **Fixed for everyone:** Go to Leaf **Modest Foundationalism**.
      *   *Correction:* If you say "Protocol" but mean "Universal Rational Protocol," you are actually a Modest Foundationalist. The 'Convention' path implies variability.
  *   **Specific to context:** Go to Leaf **Local Practice**.

  **Node 10: The Fallback (Scepticism Check)**
  *Use this node only if the respondent feels none of the above options work.*
  **Question:** If you cannot accept infinite chains, cycles, or fallible bases, is the conclusion that 'justification' is a broken concept and nothing is truly verified?
  *   **Yes:** Go to Leaf **Suspension**.
  *   **No:** Return to Node 1 and check for misunderstanding.

