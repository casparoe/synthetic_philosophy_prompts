  ## Scoring Key and Leaf Definitions

  Map the respondent's path to the following leaves.

  ### 1. Infinitism
  *   **Path:** Node 1 (No) → Node 2 (Yes).
  *   **View:** Justification is a stream (coinductive). As long as you can produce the next reason on demand, the lack of a final base case is not a bug.
  *   **Analogy:** A lazy-evaluated list. It has no end, but it is well-behaved as far as you traverse it.

  ### 2. Suspension (Scepticism)
  *   **Path:** Node 1 (No) → Node 2 (No) **OR** Node 10 (Yes).
  *   **View:** The requirements for justification cannot be met. Finite minds cannot hold infinite chains, and no other structure works.
  *   **Analogy:** A build that never completes and cannot be cached. You never get a binary.

  ### 3. Pure Coherentism
  *   **Path:** Node 1 (Yes) → Node 3 (Yes) → Node 4 (Global) → Node 5 (Internal only).
  *   **View:** Beliefs justify each other mutually within a closed system. No external input is strictly required for justification, only consistency.
  *   **Analogy:** A self-compiling compiler where the source and binary verify each other without reference to the hardware.
  *   **Warning:** This view is vulnerable to the "isolation objection" (a fairy tale can be consistent but false).

  ### 4. Impure Coherentism
  *   **Path:** Node 1 (Yes) → Node 3 (Yes) → Node 4 (Global) → Node 5 (Outside input).
  *   **View:** Mutual support is required, but the system must also be anchored by inputs from outside (experience/logs).
  *   **Analogy:** A microservices architecture where services check each other's health, but at least one service must ping an external database to be valid.

  ### 5. Strong Foundationalism
  *   **Path:** Node 1 (Yes) → Node 3 (No) → Node 6 (No) → Node 8 (Different reason).
  *   **View:** There are base beliefs that are indefeasible (cannot be wrong) and justified by immediate contact (not inference).
  *   **Analogy:** A hardware interrupt. It is not 'processed' by the OS; it simply *is*.
  *   **User's Analogy:** Inductive data structure with a guaranteed, immutable base case.

  ### 6. Modest Foundationalism
  *   **Path:** Node 1 (Yes) → Node 3 (No) → Node 6 (Yes) → Node 7 (Direct contact) **OR** Node 9 (Fixed for everyone).
  *   **View:** There are base beliefs, but they are fallible. They are justified by direct experience, not inference, but they can be overridden later.
  *   **Analogy:** A log file. It is the 'base' record of what happened, but the disk could be corrupted. We treat it as base until proven otherwise.
  *   **User's Analogy:** Inductive structure where the base case is 'trusted' but not mathematically guaranteed.

  ### 7. Local Practice (Contextualism)
  *   **Path:** Node 1 (Yes) → Node 3 (No) → Node 6 (Yes) → Node 7 (Convention) → Node 9 (Specific to context).
  *   **View:** Justification stops where the local inquiry stops. There is no universal 'base', only 'enough for this purpose'.
  *   **Analogy:** A 'Release Candidate' tag. It is not 'true' or 'final', but for the purpose of deployment, we agree to stop testing here.
  *   **Distinction:** Unlike Modest Foundationalism, the authority comes from the *team's rules*, not the *nature of the evidence*.

  ### 8. Unnamed (Logical Space Occupants)
  *   **Path A:** Node 1 (Yes) → Node 3 (Yes) → Node 4 (Local support).
      *   **Diagnosis:** "Local Coherentism". Allows small circles of justification without global consistency. Generally rejected as it permits contradictory bubbles of truth.
  *   **Path B:** Node 1 (Yes) → Node 3 (No) → Node 6 (No) → Node 8 (No reason).
      *   **Diagnosis:** "Dogmatism". Claims a belief is base simply because we say so, without even claiming immediate contact. Unstable position.

