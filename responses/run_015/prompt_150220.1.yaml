  ## Notes on the User's Analogies

  You proposed modelling the positions as data structures. This is a powerful heuristic, but it distorts in specific places.

  1.  **Foundationalism as Inductive:** **Accurate.**
      *   An inductive definition requires a base case and a constructor. Foundationalism requires basic beliefs and inference rules. The fit is excellent.
  2.  **Infinitism as Coinductive:** **Mostly Accurate.**
      *   Coinduction deals with potentially infinite structures (streams) defined by their productivity (can you get the next element?). Infinitism claims justification is a stream of reasons.
      *   *Distortion:* Coinduction is a mathematical tool to *manage* infinity. Infinitism is a claim that infinity *confers justification*. The tree's Node 2 tests whether your group accepts the coinductive 'lazy load' as sufficient for justification.
  3.  **Coherentism as Fixed-Point:** **Partially Accurate.**
      *   A fixed-point satisfies $f(x) = x$. Coherentism seeks a state where beliefs mutually support each other.
      *   *Distortion:* A fixed-point can be a single belief justifying itself. Coherentism is essentially *holistic*; it requires a system of beliefs (a graph), not a single point. Node 4 (Global Health) is designed to catch this. If someone thinks a single self-supporting belief is enough, they are not a Coherentist; they are a Singularist (Unnamed).

  ## Ambiguity Flags for the Facilitator

  When running this quiz, watch for these confusions:

  1.  **The "Practical vs. Principled" Confusion (Node 1):**
      *   Engineers often answer "Yes, it must stop" because "We have a deadline." This is **Local Practice**, not **Foundationalism**.
      *   *Correction:* Ask: "If you had infinite time, would the chain *still* need a bottom, or could it go on?" If they say "It could go on," they are not Foundationalists.
  2.  **The "Sensor" Confusion (Node 7):**
      *   Respondents may treat a "log" as infallible.
      *   *Correction:* Remind them: "Logs can be tampered with. Sensors drift. Is it *logically* impossible for this base to be wrong, or just *unlikely*?"
  3.  **The "Convention" Confusion (Node 9):**
      *   Respondents may say "It depends on the team" but mean "All rational teams would agree."
      *   *Correction:* Ask: "Could a different team, working on a different problem, legitimately stop at a different place?" If Yes → **Local Practice**. If No → **Modest Foundationalism**.

  ## Instructions for the Group

  1.  Read the **Entry Commitment** aloud. Ensure everyone accepts it.
  2.  Read the **Nodes** in order. Do not skip ahead.
  3.  Record the path (e.g., 1-Yes, 2-No, 3-Yes...).
  4.  Map the path to the **Scoring Key**.
  5.  Compare leaves. If two people land on the same leaf but argue, check the **Ambiguity Flags**.
  6.  If someone lands on **Unnamed**, ask them if they find that position stable. Usually, they will migrate to a neighbouring leaf upon reflection.
