answer: |-
  Interview framing
  Our guest defends a strict anti-aggregationist view, arguing that in direct rescue conflicts, the number of lives at stake carries no independent moral weight. This episode moves beyond standard pairwise cases to examine how this position holds under conditions of uncertainty and within institutional triage protocols. We will press whether ignoring numbers in these contexts violates equal moral concern or collapses into an unmotivated deontology.

  The question sequence

  1.  **Primary:** You argue that aggregation is a category mistake because losses belong to distinct persons and cannot be summed. Is the error located in the metaphysics of value, or is it a constraint on the agent's deliberative perspective?
      **Follow-up:** If it is merely a deliberative constraint, why does the constraint hold even when the agent knows with certainty that aggregating would prevent more total loss?

  2.  **Primary:** In pairwise comparison, you claim we owe each person a chance rather than a guaranteed rescue. Does this duty to offer a chance intensify as more people enter the scenario, or does it remain static?
      **Follow-up:** If the duty remains static, doesn't that imply the presence of additional victims is morally invisible to the agent's obligation?

  3.  **Primary:** Consider a probabilistic case: you can save one person with near-certainty or five people each with a one-in-five chance. Standard expected value favors the five, but does your view still require a weighted coin flip?
      **Follow-up:** You will likely say we must respect each individual's chance; but if you save the one, haven't you objectively lowered the aggregate survival probability, violating ex ante efficiency?

  4.  **Primary:** If we repeat this probabilistic scenario one hundred times, saving the single certain victim each time yields fewer total survivors than saving the group. Does repetition change the moral calculus?
      **Follow-up:** If repetition matters, doesn't that smuggle aggregation back in through the back door of frequency, undermining your initial claim that numbers never count?

  5.  **Primary:** Does an individual's right to a chance disappear if their probability of survival is too low, or is any non-zero chance sacrosanct regardless of the cost?
      **Follow-up:** If any chance is sacrosanct, does this not paralyze rescue efforts where risk is distributed across large populations with low individual probabilities?

  6.  **Primary:** Disaster protocols often triage by group size to maximize lives saved. Does your view deem these algorithms morally corrupt because they implicitly weight group size?
      **Follow-up:** If yes, are you committed to advocating for less efficient institutional rules that cost lives overall simply to avoid aggregating claims?

  7.  **Primary:** Can you distinguish the frontline rescuer from the policy-maker who designs the protocol they follow, allowing aggregation only at the policy level?
      **Follow-up:** If the policy-maker can aggregate but the rescuer cannot, what is the principled difference in moral authority that licenses ignoring individual claims at one level but not the other?

  8.  **Primary:** Critics argue that ignoring numbers treats the five as morally lighter than the one, violating equal moral concern. How do you rebut this charge of inequality?
      **Follow-up:** If you claim equal concern, doesn't that require giving each of the five an equal weight in the decision, not just an equal chance via a coin flip?

  9.  **Primary:** You propose a fair coin flip to show equal respect, but isn't respect shown by maximizing each person's survival odds whenever possible?
      **Follow-up:** If maximizing odds conflicts with equal chances, which value trumps the other in your framework, and why is chance prioritized over survival?

  10. **Primary:** Ultimately, is your view a deontological constraint on action, or a claim about the metaphysics of value?
      **Follow-up:** If it is a constraint, doesn't it become arbitrary when institutional incentives strongly favor aggregation, suggesting the view is unmotivated deontology?

  Anticipated deflections and counter-moves
  A common retreat is to restrict anti-aggregationism to face-to-face rescue while permitting aggregation in bureaucratic allocation to avoid catastrophic inefficiency. To block this, press whether the moral status of a victim changes based on whether the decisioner sees them or follows a manual. Demand a principled account of why institutional distance licenses ignoring individual claims that are decisive in direct encounters. If they appeal to role morality, ask whether the role permits violating the very constraints that define the moral relationship.
