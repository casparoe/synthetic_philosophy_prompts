answer: |-
  # Diagnostic Decision Tree: Cognitive Penetration of Perception

  **Starting Case:** A trained radiologist examines an ambiguous tissue scan. After being primed with the information that the sample is likely benign, she reports that the image looks uniformly smooth to her, whereas without that priming she reports seeing irregular mottling, despite identical retinal stimulation.

  ---

  ### Node 1 (Dimension A: Phenomenal Character)
  **Question:** Does the priming information alter *how the scan visually appears* to the radiologist (the phenomenal character of the experience), or does it only alter her *judgment* about what the scan depicts while the visual appearance remains unchanged?

  *   **Branch No (Only Judgment):** Proceed to **Leaf 1**.
  *   **Branch Yes (Alters Appearance):** Proceed to **Node 2**.

  ---

  ### Node 2 (Dimension B: Mechanism)
  **Question:** Is the change in visual appearance caused by a direct modulation of early sensory feature detectors (changing the raw input processing), or is it caused by a restructuring of attentional weighting and conceptual framing applied after sensory registration is complete?

  *   **Branch Attention/Restructuring:** Proceed to **Leaf 2**.
  *   **Branch Direct Modulation:** Proceed to **Node 3**.

  ---

  ### Node 3 (Dimension C: Nature of Penetrating State)
  **Question:** Must the state influencing perception be a propositional attitude (such as a belief or hypothesis), or can non-propositional states (such as fear, desire, or statistical learning from past cases) produce the same perceptual shift?

  *   **Branch Non-Propositional (Affective/Statistical):** Proceed to **Leaf 3**.
  *   **Branch Propositional (Belief/Hypothesis):** Proceed to **Node 4**.

  ---

  ### Node 4 (Dimension D: Epistemic Status)
  **Question:** Does the resulting visual experience provide independent, non-circular evidence for the belief that penetrated it, or does the experience merely reflect the belief back to the observer, rendering it epistemically circular?

  *   **Branch Independent Evidence:** Proceed to **Leaf 4**.
  *   **Branch Epistemically Circular:** Proceed to **Node 5**.

  ---

  ### Node 5 (Dimension E: Temporal Persistence — *Invented Dimension*)
  **Question:** If the radiologist abandons the "benign" belief, does the "smooth" visual appearance vanish immediately (reversible), or does the perceptual shift persist despite the belief change, requiring new sensory training to reverse (entrenched)?

  *   **Branch Reversible:** Proceed to **Leaf 5**.
  *   **Branch Entrenched/Persistent:** Proceed to **Leaf 6**.

  ---

  ### Terminal Leaves

  **Leaf 1: Modular Encapsulation**
  *   **Position:** The visual system is cognitively impenetrable. The radiologist's report changes due to post-perceptual bias, not visual change.
  *   **Status:** Standardly Defended (e.g., Fodorian Modularity).

  **Leaf 2: Attention-Mediated Restructuring**
  *   **Position:** Cognition influences perception, but only by directing attention to different features already present in the sensory array, not by altering early sensory processing.
  *   **Status:** Standardly Defended (e.g., Attentional View).

  **Leaf 3: Affective Penetration**
  *   **Position:** Perception is penetrable by non-doxastic states like emotion or motivation, distinct from belief-driven penetration.
  *   **Status:** Standardly Defended (e.g., Stokes' Affective Penetration).

  **Leaf 4: Unnamed (Epistemically Innocent Penetration)**
  *   **Position:** Cognition directly alters early sensory processing, yet the resulting experience somehow retains independent justificatory power over the penetrating belief.
  *   **Diagnosis:** **Conceptually Tenuous.** This position is rarely occupied because if a belief alters the very evidence used to justify it, the independence required for justification is typically viewed as compromised. It is defended only in niche predictive-processing accounts where "prediction error" is claimed to remain objective despite top-down influence.

  **Leaf 5: Transient Doxastic Penetration**
  *   **Position:** Beliefs directly alter perception, but the effect is labile and tracks the current doxastic state without long-term perceptual learning.
  *   **Status:** Standardly Defended (e.g., Siegel's Cognitive Penetration).

  **Leaf 6: Entrenched Theory-Ladenness**
  *   **Position:** Beliefs alter perception through a process of perceptual learning that becomes fixed; the observation is laden with theory to the point where the theory cannot be easily tested by the perception it shaped.
  *   **Status:** Standardly Defended (e.g., Hanson's Theory-Laden Observation).

  ---

  ### Ambiguity Flag

  **Flagged Pair:** **Leaf 1 (Modular Encapsulation)** and **Leaf 2 (Attention-Mediated Restructuring)**.

  **Source of Ambiguity:** The tree relies on the distinction between "post-perceptual judgment" (Leaf 1) and "attentional restructuring of phenomenology" (Leaf 2). However, in the philosophy of mind and cognitive science, there is no consensus on whether attention is a pre-perceptual, perceptual, or post-perceptual mechanism. Proponents of Encapsulation often argue that attentional shifts occur *before* visual processing proper, effectively collapsing Leaf 2 into Leaf 1. Conversely, proponents of Penetration argue that attention *is* part of the phenomenal character, collapsing the distinction. Consequently, empirical data from the radiologist case may be compatible with either leaf depending on one's prior definition of the "perceptual boundary."
