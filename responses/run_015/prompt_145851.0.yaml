  Let's refine the ranking based on "Coherence of the Program."
  1.  **The Separation Problem (Task vs. Side Effect):** If you can't formally distinguish intended from unintended effects without a full value function, the program fails.
  2.  **The Power-Seeking Theorem (Instrumental Convergence):** If doing the task *requires* violating the bound, the program fails.
  3.  **The Baseline Problem (Counterfactuals):** How do we measure change?
  4.  **Analogies:** Distraction.

