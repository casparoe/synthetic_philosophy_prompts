  Modal leakage is genuinely its own beast and not just analogical overreach wearing a fancy hat. Analogical overreach is about mapping features from a source to a target incorrectly, whereas modal leakage is about the fundamental status of the scenario itself being impossible despite feeling conceivable. You can have a perfect analogy that still leaks modality if the scenario described violates metaphysical laws, and you can have modal leakage without any analogy at all, just in a direct description. Conflating them misses the point that modal leakage exploits the gap between psychology and metaphysics, while analogical overreach exploits the gap between similarity and identity.

