  **Narrative Closure** is lower because it limits the solution space rather than validating a specific wrong answer. It's a rhetorical trap that forces a choice, but you can usually refuse the binary without dismantling the whole system. It's annoying and misleading, but less fundamentally corrupt than rigging definitions or modality. It constrains the game board but doesn't necessarily rig the pieces.

  **Analogical Overreach** is the least bad because analogies are openly admitted heuristics, so overreach is often just a category error everyone can see. When someone says "the brain is a computer," most philosophers know to treat that as illustrative, not ontological. It's a misuse of a tool, but rarely succeeds in convincing experts for long. The mismatch between source and target usually becomes obvious upon slight pressure.

