answer: |-
  **MEMORANDUM TO THE ALLOCATION COMMITTEE**
  **SUBJECT:** Revised Decision Procedure for Quarterly Course Allocation
  **FROM:** Committee Chair
  **DATE:** October 26, 2023

  ### Preamble: The Ethical Grounding
  This procedure rejects the principle that harms to different people can simply be added together to maximize a total score. A loss of life to one patient is not morally equivalent to a loss of hearing to another, nor can the hearing losses of eleven people automatically outweigh the death of one. We operate on a **Non-Aggregation Principle**: we compare the strength of individual claims, not the sum of benefits.

  When claims are of equal strength, we cannot choose based on favoritism. A lottery is not an expression of indifference; it is the only mechanism that expresses **Equal Concern**. It acknowledges that while we cannot save everyone, we value every claimant equally.

  This procedure is designed to be executed in two hours with high turnover. It prioritizes clarity over mathematical perfection.

  ---

  ### 1. The Decision Sequence (The Four Questions)

  Committee members must ask these questions in strict order. Do not proceed to the next question until the current one is resolved.

  **Question 1: Is the harm irreversible and life-threatening without treatment?**
  *   **Data Source:** "Expected time to irreversible organ failure without treatment."
  *   **Sufficient Answer:** Yes, if time to failure is < 24 months and failure implies death or immediate life-support dependency.
  *   **Refusal Rule:** If the answer is No, the applicant moves to the "Non-Critical Pool." They cannot displace a "Critical Pool" applicant unless the Critical Pool is empty.
  *   **Hand-off:** If Yes, proceed to Question 2.

  **Question 2: Is there a reasonable probability of response?**
  *   **Data Source:** "Probability that this particular patient will respond at all."
  *   **Sufficient Answer:** Yes, if probability is ≥ 40% (or clinically defined "moderate" or better).
  *   **Refusal Rule:** If No, refuse the course. To award a course to a non-responder is to waste a claim that could have saved another.
  *   **Hand-off:** If Yes, the applicant enters the "Eligible Critical Pool."

  **Question 3: Are there enough courses for all in the Eligible Critical Pool?**
  *   **Sufficient Answer:** Yes, if Pool Size ≤ Available Courses.
  *   **Refusal Rule:** If Yes, award courses to all in the Pool. Remaining courses cascade to the "Non-Critical Pool" (repeat Questions 1 & 2 for them).
  *   **Hand-off:** If No (Pool Size > Available Courses), proceed to Question 4.

  **Question 4: How do we choose between equal claims?**
  *   **Sufficient Answer:** We cannot distinguish moral worth between two people facing the same death.
  *   **Decision:** Conduct a weighted lottery (see Section 2).
  *   **Value Judgment:** This step acknowledges that the decision is no longer about medical facts but about fair distribution of scarcity.

  ---

  ### 2. Chances, Weights, and Severity

  **Equal Chances vs. Weighted Chances:**
  In a slate where several applicants would suffer the *same* loss (e.g., all face death within 18 months) and there are not enough courses, **equal chances are required.**

  **Why not weight by severity (months)?**
  The form reports severity in months, but months are not a common moral scale. The difference between 6 months and 12 months to failure is a medical fact, not necessarily a moral hierarchy sufficient to deny one person a chance to save the other. To weight the lottery by months implies that a person with 11 months to live is worth more than a person with 7 months. This procedure rejects that. Once an applicant crosses the threshold of "Critical" (Question 1), their claim is equal to all other Critical claimants.

  **Deriving Weights (The Exception):**
  Weights are only derived if the "severity" indicates a *categorical* difference in harm (e.g., Death vs. Permanent Organ Damage).
  *   **Tier 1 (Life):** Time to failure < 24 months + Fatal outcome.
  *   **Tier 2 (Function):** Time to failure < 24 months + Non-fatal irreversible loss (e.g., hearing, kidney function).
  *   **Rule:** A Tier 1 applicant receives a course before a Tier 2 applicant is considered. We do not run a weighted lottery between Tier 1 and Tier 2. We exhaust Tier 1 first.

  ---

  ### 3. The Order of Questions and Consistency

  **Why Order Matters:**
  If we ask about *Numbers* first (Utilitarianism), we might deny the 4 dying patients to treat the 11 hearing-loss patients because 11 > 4. This violates the Non-Aggregation Principle. It treats the dying patients as mere vessels for utility.
  If we ask about *Severity* first (Prioritarianism), we protect the most vulnerable. However, this risks "inefficiency" (fewer total successful treatments).

  **Consistency and Cycling:**
  No procedure can guarantee consistency across changing slates (a mathematical certainty known as Arrow's Impossibility Theorem).
  *   *Example:* In Quarter 1, Applicant A (Death) gets a course over Applicant B (Hearing). In Quarter 2, if Applicant C (Death) joins, Applicant A might lose the lottery to C, while B still gets nothing.
  *   *The Risk:* Our verdicts may appear to cycle. A patient refused in Q1 might have been funded in Q2 depending on who else applied.
  *   **Procedure for Cycling:** We do not pretend this away. The written rationale must state: *"Your claim was equal to others in a pool larger than our supply. The outcome depended on the specific composition of this quarter's slate."* We accept that fairness is procedural, not outcome-based.

  ---

  ### 4. Prior Refusals and Queues

  **Claim from Earlier Loss:**
  An applicant turned down in an earlier quarter has **no primary claim** arising from that loss.
  *   **Reasoning:** Creating a queue orders patients by "past disappointment" rather than "current need." This punishes new applicants who are dying *now* because someone else was unlucky *then*.
  *   **Registration:** A prior refusal is recorded as a **Secondary Tie-Breaker**.
      *   *Rule:* If two applicants are identical on Severity and Probability, and one was refused previously while the other is new, the prior refusal gets the slot.
      *   *Limit:* This applies only within the same Severity Tier. A returning Tier 2 applicant cannot displace a new Tier 1 applicant.

  ---

  ### 5. Procedure Run-Throughs

  #### Slate (a): Eight courses, nine applicants of identical severity.
  *   **Analysis:** All 9 are in the same Tier (assume Tier 1/Death). All meet probability threshold.
  *   **Awards:** 8 courses.
  *   **Refusals:** 1 refusal.
  *   **Method:** Simple Lottery among the 9.
  *   **Board Rationale:** *"Nine applicants presented identical claims to life-saving treatment. Supply allowed for eight. To favor any specific individual would be arbitrary. A random selection was used to ensure equal concern for all nine claimants."*
  *   **Divisibility Impact:** If the pharmacist is right that a course can be split (half-dose), and half-dose retains >40% response probability: **Verdict Changes.** We could treat all 9 (using 4.5 courses) and have 3.5 left.
      *   *Why Divisibility Matters:* If efficacy is maintained, indivisibility creates artificial scarcity. However, if half-dose drops probability below the threshold (Question 2), we must not split. We prioritize *successful* treatment over *attempted* treatment. **Recommendation:** Do not split unless half-dose meets the Probability Threshold. Otherwise, you turn two treatments into two placebos.

  #### Slate (b): Eight courses, four applicants (Death <18mo), eleven applicants (Hearing Loss). Response probabilities equal.
  *   **Analysis:** Tier 1 (Death) has 4 applicants. Tier 2 (Hearing) has 11 applicants.
  *   **Awards:** 4 to Tier 1. 4 to Tier 2 (selected by lottery from the 11).
  *   **Refusals:** 7 Tier 2 applicants refused.
  *   **Board Rationale:** *"Four applicants faced irreversible fatal progression; eleven faced irreversible functional loss. Policy prioritizes preservation of life over preservation of function when resources are insufficient for both. The four functional courses were allocated by lottery among the eleven eligible Tier 2 applicants."*
  *   **Divisibility Impact:** If splitting allows a half-dose to prevent hearing loss effectively: **Verdict Changes.** We could treat the 4 dying (whole dose) and the 11 hearing (half dose = 5.5 courses). Total 9.5 courses needed. We still cannot save everyone. But if half-dose works for the dying too, we might save 16 people at half-efficacy vs 8 at full. **Decision:** Stick to full dose. Half-efficacy in fatal disease is ethically precarious (false hope).

  #### Slate (c): The Spring Slate (4 stable/high response vs. 2 dying/med response).
  *   **Analysis:** 2 Dying (Tier 1, Med Response). 4 Stable (Tier 2, High Response). Supply: 8. (Assume other 22 applicants were non-eligible/low probability).
  *   **Awards:** 2 to Dying. 6 to Stable (assuming enough Stable applicants exist to fill the slate, or cascade to next tier).
      *   *Correction based on prompt:* The prompt says "awarded four courses to patients whose disease was stable... turned down two who would have died."
      *   *New Verdict:* Award to the 2 Dying. Award remaining 6 to the Stable/High Response group (or lottery if >6 stable).
  *   **Refusals:** The Stable patients who lose the lottery for the remaining 6 slots.
  *   **Board Rationale:** *"Two applicants faced imminent fatal progression. While their probability of response was lower than the stable cohort, the severity of the harm (death vs. stability) establishes a stronger moral claim. The remaining courses were awarded to the stable cohort based on response probability."*
  *   **Divisibility Impact:** If splitting allows the 2 dying to get half-dose (saving them) and the 4 stable to get half-dose (maintaining them): **Verdict Changes.** But again, only if half-dose meets the Response Threshold.

  ---

  ### 6. The Hated Verdict

  **The Verdict:** In Slate (c), we award courses to the **2 dying patients with mediocre response probabilities** instead of the **4 stable patients with high response probabilities.**

  **Why the Committee Will Hate It:**
  This violates the funder's metric ("greatest number of successful treatments"). We are knowingly choosing a path that may result in fewer "successes" (because the dying patients might not respond) to satisfy the moral imperative of urgency. We are sacrificing *efficiency* for *priority*.

  **The Sacrifice:**
  To avoid this verdict, we would have to admit that a patient's proximity to death matters less than the statistical likelihood of a "win" for our quarterly report. The procedure sacrifices **Utilitarian Efficiency** to uphold **Claim Strength**. You must tell the board: *"We chose to minimize the severity of loss, not the number of losses."*

  ---

  ### 7. Writing the Rationale (Addressing the Lottery Objection)

  **The Objection:** "Randomizing tells the ninth family we did not care which of them lived."
  **The Response:** "Deterministic choice tells the ninth family we cared *less* about them than the eight who lived."

  **Drafting the Rationale:**
  Do not write: *"Patient X was selected by lot."*
  Write: *"Nine patients presented equal medical claims to life-saving therapy. The committee could not identify a moral basis to prefer one life over another. To select based on any other factor (age, geography, social value) would be discriminatory. A random selection was the only method that respected the equal worth of all nine applicants."*

  **Answering the Board Member:**
  When the board member objects that the lottery shows indifference, reply: *"Indifference would be ignoring the tie. The lottery is the active expression of our inability to choose. It places the burden of the scarcity on chance, rather than on our judgment of human worth."*

  ---

  ### 8. Judgment Calls and Unsettled Cases

  **Marked Judgment Calls:**
  1.  **The Threshold (Question 1):** Defining "24 months" as the cutoff for Critical is a judgment call. A patient at 25 months is medically similar to one at 23 months. *Procedure Note:* If a patient is within 10% of the threshold, the Committee Chair may invoke a "Borderline Review" requiring a 4/5 vote to move them to the Critical Tier.
  2.  **Probability Assessment (Question 2):** "40%" is a heuristic. Clinicians must agree on what constitutes "Moderate" probability. *Procedure Note:* If Clinicians disagree on probability, the applicant defaults to the lower estimate (Precautionary Principle).
  3.  **Divisibility:** Whether to split courses is a medical judgment, not an ethical one. *Procedure Note:* If the Pharmacist certifies half-dose efficacy, the Ethics Procedure holds, but the "Unit" changes. If the Pharmacist says efficacy drops, do not split.

  **Unsettled Cases:**
  1.  **The "Super-Claimant":** If one applicant has a 99% chance of response and 10 applicants have 40% chances, all facing death. The procedure treats them as equal Tier 1. This may feel inefficient. The procedure *cannot* settle this without reintroducing aggregation. We accept this friction.
  2.  **Cycling Instability:** As noted in Section 3, a patient refused in Q1 due to a crowded slate might have been funded in Q2. The procedure cannot fix this without a queue (which we rejected). We accept that **procedural fairness does not guarantee outcome consistency over time.**

  ---

  **Final Instruction to the Chair:**
  When a family asks why they were refused, do not hide behind the procedure. Say: *"Your claim was valid. The scarcity was not. We chose a method that treated your claim as equal to those we funded, because we could not find a reason to value your life less than theirs."*

  This procedure will not make the decisions easy. It will only make them honest.
