      *   Applying to A, B, C: The hierarchy.
      *   Where it Constrains: The veto power.
      *   Where it Creates Fog: The A vs. B comparison and the "harm" definition.
      *   The Relationship Angle: Values mismatch.
      *   Conclusion.

