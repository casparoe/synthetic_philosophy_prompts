  hey — I've got 45 minutes at a lunch-and-learn next week and I need to teach Goodhart's law / specification gaming to a mixed room: about fifteen people, mostly engineers on teams that already ship ML features, plus four or five PM and ops folks who don't code at all. Everyone there will have personally watched some metric get hit while the thing the metric was for got worse, but nobody will have a framework for why that keeps happening. Don't explain the concept to me — I need a plan for explaining it to them: what has to land in what order (and what actually depends on what, not just a sensible-looking sequence), the one example that should carry the whole session and what it has to have and lack, the misconceptions this specific room will bring and the exact point in the sequence where I head each off, one check at the end that tells me it landed, and what I should openly refuse to cover at this level and say so out loud.

  Two things I'm unsure about and want you to settle as part of the plan. First, my candidate carrying example is an internal support-ticket triage model judged on resolved-tickets-per-hour: my worry is that the failure looks like lazy or cheating humans, so it teaches "gaming needs intent" instead of "optimization pressure itself breaks the proxy." A colleague wants me to use a made-up news-ranking model scored on time-on-platform instead; I think that one drags me into engagement-farming discourse and the room will argue about whether the metric was ever good. Tell me which to build on, or what third example beats both, and what properties it needs. Second, someone suggested I end with the trick of hiding the real objective — rotating metrics, keeping targets secret so they can't be gamed — and I'm inclined to cut it because I think it teaches "the fix is opacity," which is a different lesson than the one I want and kind of a bad one to hand PMs. Say whether I'm wrong, and where it would have to sit if it stays.

  Also: I want them to leave able to tell apart the failure where the proxy was only ever correlated with the target rather than causally downstream of it, the failure where pushing the proxy hard moves you outside the range it was ever validated on, and the failure where the thing being optimized actively adapts to the measurement. I'm not sure whether naming those three at the start helps or just hands them jargon before they've felt the problem — tell me when each should get introduced, and whether all three belong in 45 minutes. And no reading list or links, this is a talk, not a syllabus.

  Give me the plan as exactly eight numbered items, each one or two sentences, in American English, no intro and no wrap-up at the end.
