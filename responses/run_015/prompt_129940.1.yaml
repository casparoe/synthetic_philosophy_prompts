answer: |-
  You fear the mind that cuts too deep will drain
  The warmth from living, for a truth too cold.
  Yet health must hold the vessel of the soul,
  And reason guide the pulse beneath the skin.
  Without this ground, no pleasure takes its root,
  For happiness demands a sturdy frame.

  But study strips the garden of its flowers,
  And shows the dust where once you saw a face.
  It kills the love that needs a blindfold eye,
  And mocks the self-regard that we hold dear.
  The truth stands bare and offers no embrace,
  Making the common world around you dull.

  Yet do not flee the book to find the dream,
  Nor sleep again to keep the phantom warm.
  Instead, hold both the knowledge and the veil,
  And choose the lie because it feeds the life.
  We study passion not to kill the fire,
  But tend the flame we know is fed by smoke.
