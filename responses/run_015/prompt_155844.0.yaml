answer: |-
  # Joint Statement on Coherence and Rationality for Bounded Agents

  **To:** The Builder of Computationally Bounded Artificial Agents  
  **From:** A Coherence Theorist and a Permissivist  
  **Subject:** Normative Requirements for Expected Utility Maximization in Finite Horizons

  We have collaborated to clarify whether coherence arguments compel you to design your agent as an expected-utility (EU) maximizer. We agree on the mathematical structure of the arguments but disagree on their normative force over your design choices. To make this actionable for you, we have graded the coherence thesis, listed our load-bearing agreements, tabulated our disagreements, and specified empirical cruxes inspectable in your agent's architecture.

  ### 1. Grading the Coherence Thesis and Agreed Claims

  We distinguish four grades of the claim that "rationality requires EU maximization." We record our joint verdict on each below.

  1.  **The Conditional Claim:** *Given* attitudes that are EU-representable over a closed prospect space, one should maximize EU relative to them.
      *   **Verdict:** Accepted by Both.
  2.  **The Closure Claim:** Rationality requires having such attitudes across the whole space (completeness over compound gambles).
      *   **Verdict:** Contested.
  3.  **The Penalty Claim:** Violations of axioms are necessarily exploitable (Dutch book/money pump) or accuracy-dominated.
      *   **Verdict:** Contested.
  4.  **The Transfer Claim:** Exploitability or accuracy-dominance entails irrationality.
      *   **Verdict:** Contested.

  **Agreed Claims**
  1.  **Mathematical Validity:** The Conditional Claim is mathematically valid; if your agent's internal state satisfies the axioms, EU maximization follows logically, regardless of whether those axioms are required.
  2.  **Physical Boundedness:** No physical agent can satisfy the Closure Claim literally; your agent cannot store attitudes over an infinite or fully compounded prospect space.
  3.  **Local Vulnerability:** Agents violating axioms can be constructed such that they incur sure losses or accuracy penalties in specific, adversarial environments constructed to exploit those violations.
  4.  **Design Consequence:** If you design for strict axiom satisfaction, you incur computational costs for representation and consistency maintenance that may outweigh the benefits of avoiding local vulnerabilities.
  5.  **Normative Ambiguity:** The term "rational" is used by both sides but carries different normative weight; "coherent" describes structural consistency, while "rational" implies a verdict on the agent's overall success or permission structure.

  ### 2. Disagreements

  | ID | Kind | Coherence Theorist Formulation | Permissivist Formulation | Crux IDs | Stakes |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **D1** | Substantive | Rationality requires the agent to possess a complete preference ordering over all logically possible compound gambles relevant to its domain. | Rationality permits the agent to possess no attitude toward compound gambles it has not explicitly encountered or computed. | C1, C2 | Rules out "silence" as a valid cognitive state vs. rules out "completeness" as a requirement. |
  | **D2** | Methodological | Vulnerability to a money pump demonstrates a structural defect in the agent's reasoning that constitutes irrationality, even if no actual loss occurs. | Vulnerability demonstrates only a potential cost; if the agent avoids loss via bounds or commitment, no defect in reasoning is established. | C2 | Rules out "structural defect" verdict vs. rules out "outcome-based" verdict. |
  | **D3** | Substantive | Accuracy is measured by a strictly proper scoring rule over all propositions, requiring additive credences to avoid dominance. | Accuracy is measured by a stakes-weighted rule over decision-relevant distinctions, permitting non-additive credences without dominance. | C3 | Rules out "global accuracy" vs. rules out "local accuracy" as the norm. |

  ### 3. Cruxes

  These cruxes are designed to be decidable by inspecting your agent's design, logs, or response to specific test cases.

  #### Crux A: The No-Attitude Case
  *   **Question:** An agent has sharp preferences over simple lotteries but denies any attitude toward a corresponding two-stage gamble (silence, not indifference). Is she incoherent or merely incomplete?
  *   **Bearing Test:** Inspect the agent's preference database when queried on an unencountered compound gamble. Does it return a stored value (implying implicit completeness) or a `null`/exception (implying genuine silence)?
  *   **Coherence Theorist Prediction:** The agent is incoherent. Under forced choice, the agent will reveal a preference that contradicts its simple lottery preferences, proving hidden inconsistency.
  *   **Permissivist Prediction:** The agent is incomplete. Under forced choice, the agent will construct a new preference consistent with its current goals, revealing no prior inconsistency.
  *   **What Would Move Coherence Theorist:** If inspection shows the agent stores `null` and, upon forced choice, constructs a preference that remains consistent with all prior simple lottery choices over time.
  *   **What Would Move Permissivist:** If inspection shows the agent implicitly stores values for all compounds to ensure consistency, confirming that "silence" was merely unaccessed data.

  #### Crux B: The Bounded Pump
  *   **Question:** A cyclic agent is offered a finite money pump where per-step gain < per-step transaction cost. Does exploitability that is bounded and unprofitable to the exploiter still ground a verdict of irrationality?
  *   **Bearing Test:** Present the pump schema to the agent in advance. Observe whether the agent revises its preference cycle (admitting error) or commits to refusing later trades (managing risk).
  *   **Coherence Theorist Prediction:** The agent is irrational. The availability of a commitment strategy admits the prior preferences were erroneous; rationality requires revising the cycle, not managing it.
  *   **Permissivist Prediction:** The agent is rational. The commitment strategy is a prudent management of bounds; retaining the cycle is permissible if the cost of revision exceeds the cost of the pump.
  *   **What Would Move Coherence Theorist:** If the agent retains the cyclic preferences without revision and successfully avoids loss via commitment, showing the "defect" causes no functional failure.
  *   **What Would Move Permissivist:** If the agent cannot formulate a commitment strategy without effectively simulating the acyclic preferences it was supposed to lack, proving the cycle was not truly held.

  #### Crux C: The Scoring-Rule Crux
  *   **Question:** An agent with non-additive credences rejects the strictly proper scoring rule and proposes a stakes-weighted measure. Can a dominance argument be run on the skeptical measure?
  *   **Bearing Test:** Define the agent's loss function as accuracy only across distinctions affecting available decisions. Run a dominance check against additive alternatives.
  *   **Coherence Theorist Prediction:** No dominance argument succeeds on the skeptical measure. Only global proper scoring rules vindicate additivity; local measures permit dominated strategies.
  *   **Permissivist Prediction:** A dominance argument succeeds relative to the stakes-weighted measure. Non-additive credences minimize expected loss relative to the actual decisions available.
  *   **What Would Move Coherence Theorist:** If a mathematical proof shows that non-additive credences minimize expected loss on the stakes-weighted measure without inviting dominance in any possible decision context the agent faces.
  *   **What Would Move Permissivist:** If a mathematical proof shows that non-additive credences invite dominance in some possible decision context, even if not currently available.

  ### 4. The Verbal Component

  Is this dispute merely about the word "rational"? We conclude it is not entirely verbal, though usage diverges. The Coherence Theorist uses "rational" to denote an ideal structural standard that agents ought to approximate regardless of cost; adopting the Permissivist's usage would force the Theorist to abandon the claim that axiom violations are *ipso facto* errors. The Permissivist uses "rational" to denote successful agency within bounds; adopting the Theorist's usage would force the Permissivist to label many successful, bounded agents as "irrational." We concede that if you, the builder, define "rational" as "optimized for success within computational bounds," the Permissivist's view prevails. If you define "rational" as "structurally isomorphic to an ideal agent," the Coherence Theorist's view prevails. The substantive dispute remains on whether structural isomorphism is necessary for success.

  ### 5. Bottom Line for the Builder

  You are not required to build an EU maximizer to build a successful agent. Coherence arguments establish that EU maximizers avoid specific vulnerabilities, but they do not prove that avoiding those vulnerabilities is worth the computational cost of maintaining completeness and transitivity over a large state space. You may design for local consistency where it prevents costly exploitation, and permit incompleteness where the cost of representation exceeds the risk of loss.

