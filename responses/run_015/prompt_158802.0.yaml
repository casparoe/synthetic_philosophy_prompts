answer: |-
  **0.15**

  **Decomposition**
  *   **Credence 0.62 survives adaptation (0.30):** Adversarial producers will optimize for the lowest-common-denominator reviewer, degrading marginal competence.
  *   **Credence error decomposition holds (0.50):** Real-world model failures cluster more chaotically than a clean shared-vs-residual split allows.
  *   **Credence correctness is determinate (0.60):** Safety-critical domains usually imply ground truth, but regulatory ambiguity often renders binary accuracy ill-defined.
  *   **Effective-jury-size penalty (7.35):** At $N=25$ and $\rho=0.1$, the formula $25/(1+2.4)$ reduces independent voting power to ~29% of nominal.

  **Combination**
  The point-estimate accuracy of the panel (~0.70) is mathematically capped below the senior reviewer (0.85) due to the $q=0.2$ systematic error ceiling; the 0.15 credence reflects only the tail probability that your parameter estimates are sufficiently optimistic to bridge this gap.

  **Sensitivity**
  The figure is most sensitive to **$q$ (shared error share)**; reducing $q$ from 0.2 to 0.1 is the only single-parameter change that mathematically permits the panel to exceed the senior reviewer's 0.85 accuracy.

  **Empirical Work**
  Spend one week running the AI panel on a held-out dataset to **cluster error patterns**, specifically measuring the fraction of items where all models fail together to empirically bound $q$.

  **Optimal N**
  Stop adding reviewers at **$N=10$**; beyond $1/\rho$, the effective jury size asymptotes, making further parallelization less cost-effective than investing in supervision to lower $\rho$ or raise $p_{ai}$.
