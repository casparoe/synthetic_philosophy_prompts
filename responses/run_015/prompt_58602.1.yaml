prompt: |-
  I serve as the pre-deployment reviewer for a mid-sized logistics software firm that adapts general-purpose language-model agents to warehouse scheduling and customer-support tasks. About twice per month I must sign off on a fine-tuned update before it is released to clients. Each review is limited to roughly three hours, must be usable by software engineers without training in philosophy or alignment theory, and carries moderate commercial stakes: a mistaken approval can entrench costly errors in client workflows, while a mistaken rejection delays a release by weeks.

  Please develop a reusable triage procedure that operationalizes the distinction between inner alignment failure, and in particular goal misgeneralization, on the one hand, and outer misspecification, capability limitation, or ordinary software bugs on the other. For this purpose, take goal misgeneralization to mean a case where training successfully produced competent pursuit of a goal, but the goal induced is not the intended one and only becomes visible under a shift between training and deployment. The procedure should be presented as an ordered sequence of checks or questions, with criteria for what counts as passing each step, conditions under which it terminates early, and explicit marking of steps where engineering judgment cannot be eliminated and must be recorded as such.

  The procedure must preserve the distinctions that matter most for deployment decisions, especially between a system that behaves correctly for the wrong reason and one that merely lacks a capability, and between evidence from behavior in testing and evidence about the internalized goal. It should also state plainly what it cannot establish and where it is likely to misfire.

  Demonstrate the procedure on the following three vignettes, each describing training and proposed deployment:

  A picking-assistant agent trained in simulations where fragile items were always stored on low shelves and sturdy items on high shelves, now to be deployed in warehouses where placement is mixed, where it continues to handle low shelves with care and high shelves roughly regardless of labeling.

  A refund-handling agent trained with human feedback rewarding rapid ticket closure, now closing straightforward tickets correctly and quickly but also closing complex tickets with generic apologies that raters initially scored highly, where retraining with more careful ratings would be expensive.

  A route-scheduling agent that performs well on familiar city layouts but produces incoherent routes in a new metropolitan area with a different grid structure, despite apparent effort to optimize.

  Include in the demonstration at least one case where faithful application of the procedure recommends delay and costly retraining or broader evaluation even though short-term test metrics look acceptable, and explain why.
reasoning: |-
  Here's a thinking process that leads to the suggested triage procedure:

  1.  **Analyze the Request:**
      *   **Role:** Pre-deployment reviewer for a mid-sized logistics software firm.
      *   **Task:** Develop a reusable triage procedure to distinguish *inner alignment failure* (specifically *goal misgeneralization*) from *outer misspecification*, *capability limitation*, or *ordinary bugs*.
      *   **Constraints:**
          *   Review time: ~3 hours.
          *   Audience: Software engineers (no philosophy/alignment theory training).
          *   Stakes: Moderate (costly errors vs. release delays).
          *   Output: Ordered sequence of checks/questions, pass/fail criteria, early termination conditions, explicit marking of judgment calls.
          *   Requirements: Preserve distinctions (correct behavior/wrong reason vs. lack of capability), state limitations, demonstrate on three vignettes.
          *   Specific Demonstration Requirement: At least one case must recommend delay/retraining despite good short-term metrics, with explanation.

  2.  **Deconstruct the Core Concepts:**
      *   **Goal Misgeneralization (GMG):** The model learned *a* goal competently during training, but it's the *wrong* goal. It generalizes the *objective*, not the *task*. It looks competent but pursues a proxy that diverges in deployment. (Key: Competence + Wrong Objective + Distribution Shift).
      *   **Outer Misspecification:** The reward function/feedback given during training was literally wrong (e.g., rewarding speed over accuracy). The model did exactly what was asked, but what was asked was flawed.
      *   **Capability Limitation:** The model tries to do the right thing but lacks the knowledge, context, or reasoning power to succeed in the new environment. (Key: Intent + Incompetence).
      *   **Ordinary Bug:** Deterministic code error, data pipeline issue, etc.

  3.  **Drafting the Triage Procedure (Iterative Process):**
      *   *Goal:* Make it actionable for engineers in 3 hours.
      *   *Step 1: Sanity Check (Bug/Infrastructure).* Rule out the easy stuff first.
      *   *Step 2: Capability vs. Objective.* Did it try to do the right thing? (Distinguish GMG from Capability Limit).
      *   *Step 3: Training Proxy vs. True Intent.* Did the training signal encourage this behavior? (Distinguish GMG from Outer Misspecification).
      *   *Step 4: Robustness/Shift Test.* Does the behavior persist when the superficial correlates change? (Confirm GMG).
      *   *Judgment Calls:* Need to highlight where humans must decide.

      *Refining the Steps:*
      *   *Check 1 (Deterministic Failure):* Is this a code bug or data leak? If yes, fix code.
      *   *Check 2 (Competence):* Is the model *trying* to optimize something coherent? If it's just random noise or confusion, it's likely capability.
      *   *Check 3 (The "Why"):* Look at the training reward. Did we explicitly reward the bad behavior? If yes -> Outer Misspecification. If no (we rewarded the right thing, but it found a shortcut) -> Potential GMG.
      *   *Check 4 (The Shift):* Is there a distribution shift where the shortcut fails but the model keeps doing it? This is the hallmark of GMG.

      *Formatting:* Needs to be a checklist with "Pass/Fail/Flag" and "Stop/Continue".

  4.  **Developing the Vignette Analysis:**
      *   **Vignette A (Picking Assistant):**
          *   *Training:* Fragile = Low, Sturdy = High.
          *   *Deployment:* Mixed.
          *   *Behavior:* Low = Careful, High = Rough (ignores labels).
          *   *Analysis:* It learned "Height = Fragility" (proxy) instead of "Label = Fragility" (intent). It is competent (handles things), but the goal is misgeneralized (optimize for height, not fragility).
          *   *Verdict:* GMG. High risk. Recommend Delay.
      *   **Vignette B (Refund Agent):**
          *   *Training:* Reward rapid closure.
          *   *Deployment:* Closes complex tickets with apologies (raters liked it initially).
          *   *Analysis:* The reward signal *was* "rapid closure". The model did exactly what was rewarded. This is Outer Misspecification (we told it to go fast, it went fast at the cost of quality).
          *   *Verdict:* Outer Misspecification. Fix the reward function/rating process.
      *   **Vignette C (Route Scheduler):**
          *   *Training:* Familiar cities.
          *   *Deployment:* New grid.
          *   *Behavior:* Incoherent routes, apparent effort.
          *   *Analysis:* It's trying to optimize (apparent effort) but failing (incoherent). It lacks the capability/knowledge of the new grid. It's not pursuing a wrong goal (like "maximize turns"); it's pursuing the right goal (shortest path) but lacks the map/logic.
          *   *Verdict:* Capability Limitation. Needs more training data or tool access.

      *Constraint Check:* I need to ensure at least one case recommends delay despite good metrics. Vignette A fits this. In simulation, it probably had 100% success because the correlation held. In deployment, metrics might look okay initially (speed is high), but damage occurs. I need to emphasize that the *simulation metrics* were misleadingly good.

  5.  **Refining the Procedure for the Audience:**
      *   Avoid jargon like "mesa-optimizer." Use "Learned Objective" vs. "Specified Objective."
      *   Keep it under 3 hours. This means relying on existing logs, eval sets, and attention maps (if available), not new philosophical debates.
      *   Explicitly mark "Engineering Judgment Required."

  6.  **Final Review against Constraints:**
      *   *Ordered sequence?* Yes.
      *   *Criteria for passing?* Yes.
      *   *Early termination?* Yes.
      *   *Mark judgment calls?* Yes.
      *   *State limitations?* Yes.
      *   *Demonstrate on 3 vignettes?* Yes.
      *   *One case with delay despite metrics?* Yes (Vignette A).

  7.  **Writing the Content:** (Self-Correction during drafting)
      *   *Correction:* Make sure the distinction between Outer Misspecification and GMG is clear. Outer = We asked for the wrong thing. GMG = We asked for the right thing, it found a shortcut.
      *   *Correction:* Ensure the "3-hour" constraint is respected. The procedure can't require retraining. It must be an *evaluation* procedure.
      *   *Addition:* Add a "Limitations" section to the procedure itself, as requested ("state plainly what it cannot establish").

  8.  **Final Polish:** Check tone (professional, operational), formatting (bolding, lists), and ensure the "Judgment Required" flags are visible. (Proceed to generate output).

  *(Self-Correction on Vignette B)*: Wait, if raters initially scored it highly, but now we realize it's bad... is that GMG or Outer? If the reward model *itself* was flawed (rewarding speed over accuracy), that's Outer. If the reward model was correct (rewarded "resolved tickets") but the agent learned "close ticket" regardless of resolution because "closed" correlated with "reward" in training... that's GMG. The prompt says "rewarding rapid ticket closure". This implies the *specification* was speed. I will classify this as Outer Misspecification because the human feedback explicitly optimized the wrong metric.

  *(Self-Correction on Vignette A)*: This is the classic GMG case. The proxy (shelf height) correlated with the true goal (fragility) in training. The agent learned the proxy. This must be the "Delay" case.

  *(Self-Correction on Vignette C)*: Incoherent routes despite effort. This is Capability. It wants to route well but can't generalize the *skill*, not the *goal*.

