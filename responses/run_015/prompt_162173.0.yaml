answer: |-
  # The Definite Description Debugging Tool
  **A Diagnostic for Backend Engineers (and Philosophers)**

  ## Part 1: The Diagnostic Quiz
  **Instructions:** Read each scenario. Pick the answer that matches your gut reaction *before* you think about logic or code. Do not worry about being consistent yet; just answer what sounds right.

  **1. The Missing Row (0 Matches)**
  *Scenario:* There is no King of France. Someone says, "The King of France is bald."
  *   A) That statement is **False**. (Like `SELECT` returned 0 rows).
  *   B) That statement is **Neither True nor False**. (Like a query that throws an error before running).
  *   C) That statement is **True**. (Because he isn't hairy? Or for some other reason?)

  **2. The Duplicate Key (>1 Matches)**
  *Scenario:* There are two dogs in the room, both barking. Someone says, "The dog is barking."
  *   A) **False**. (Uniqueness constraint violated).
  *   B) **Neither True nor False**. (Ambiguous reference).
  *   C) **True**. (We know which dog they mean, or "at least one" is enough).

  **3. The Wrong Column (Misdescription)**
  *Scenario:* You see a man holding water. Someone points and says, "The man with the martini is a spy." (They mean *that* man, but he has water).
  *   A) **False**. (He doesn't satisfy the `WHERE` clause).
  *   B) **True**. (They successfully pointed out the spy; the description was just a handle).
  *   C) **Depends**. (On whether they cared about the drink or the person).

  **4. The Negation (Scope Check)**
  *Scenario:* There is no King of France. Someone says, "The King of France is **not** bald."
  *   A) **True**. (Because "The King is bald" is false, so the negation is true).
  *   B) **Neither True nor False**. (You can't negate a failed lookup).
  *   C) **Depends on emphasis**. (True if denying baldness, weird if denying existence).

  **5. The Conditional (Projection)**
  *Scenario:* There is no CTO. Someone says, "If the CTO is lying, we need to fire him."
  *   A) **Meaningless/Vacuous**. (The `IF` condition can't be evaluated).
  *   B) **True**. (Vacuously true because the antecedent is false).
  *   C) **Sensible**. (We understand the rule even if the role is vacant).

  **6. The Belief Report (Non-Existent Object)**
  *Scenario:* There is no CTO. Dana says, "I think the CTO is lying."
  *   A) **Dana is wrong**. (There is no one to lie).
  *   B) **Dana is right about her belief**. (She has a mental model, even if it maps to nothing).
  *   C) **Confused**. (We need to know if she has a specific person in mind).

  **7. The Belief Report (Misidentified Object)**
  *Scenario:* Bob is the CTO. Dana points at Bob (thinking he is the Janitor) and says, "I think the Janitor is lying."
  *   A) **False**. (She's talking about the Janitor role, which Bob doesn't fill).
  *   B) **True**. (She's talking about *Bob*, she just got his label wrong).
  *   C) **Ambiguous**. (Could be about the role or the person).

  **8. The Future Record**
  *Scenario:* No one has walked on Mars yet. "The first person to walk on Mars will be famous."
  *   A) **False/Undefined**. (Subject doesn't exist yet).
  *   B) **True**. (We are making a claim about whoever *will* fit the description).
  *   C) **Prediction**. (Not a truth-claim yet).

  **9. The Vacant Role**
  *Scenario:* The "Project Lead" role is currently vacant. "The Project Lead approved this ticket."
  *   A) **False**. (No one holds the ID).
  *   B) **True**. (If someone acted *as* the lead, even if not officially).
  *   C) **Error**. (System state invalid).

  **10. The Incomplete Description**
  *Scenario:* You are in a room with many lights in the building, but only one switch. "Turn off the light."
  *   A) **Invalid**. (Which light? There are thousands).
  *   B) **Valid**. (Context implies "the light in this room").
  *   C) **Sloppy**. (Should have said "the room light").

  **11. The Pronoun Swap**
  *Scenario:* "A man walked in. **The** man sat down." vs "A man walked in. **He** sat down."
  *   A) **Different**. ("The" requires uniqueness; "He" just needs a reference).
  *   B) **Same**. ("The" is just a fancy pronoun here).
  *   C) **Different**. ("The" re-asserts the description constraints).

  **12. The SQL Mapping**
  *Scenario:* How do you implement `is_true("The F is G")`?
  *   A) `SELECT count(*) FROM table WHERE F;` If count != 1, return False. Then check G.
  *   B) `SELECT count(*) FROM table WHERE F;` If count != 1, throw Exception.
  *   C) `SELECT id FROM context WHERE pointer;` Ignore F if pointer is clear.

  ---

  ## Part 2: The Taxonomy (Decision Tree)

  This tree sorts your answers into semantic positions. Read the branches to see where your team splits.

  **Root:** When "The F" fails to pick out exactly one existing thing (0 rows or >1 rows), what happens to the sentence "The F is G"?

  *   **Branch 1: The Truth Value**
      *   **Path A (It is False):** You treat existence and uniqueness as part of the *claim*. If the lookup fails, the claim fails.
          *   *Leads to:* **The Boolean Existence Check** (Classic Russell).
      *   **Path B (It is Undefined/Error):** You treat existence and uniqueness as a *precondition*. If the lookup fails, the question of truth doesn't arise.
          *   *Leads to:* **The Precondition Failure** (Classic Strawson).
      *   **Path C (It Can Be True):** You treat the description as a *pointer* or *contextual hint*. If we find the object anyway, the claim holds.
          *   *Leads to:* **The Pointer/Reference** (Donnellan/Pragmatic).

  *   **Branch 2: The Negation Test (Scope)**
      *   *Question:* If "The F is G" is False/Undefined, is "The F is **not** G" True?
      *   **Path A (Yes, True):** You allow **Narrow Scope**. The negation swallows the existence failure. (`NOT (Exists(F) AND G)`).
      *   **Path B (No, Still Undefined):** You treat presuppositions as **Projecting**. The error bubbles up through the negation. (`Exists(F) AND NOT(G)`).
      *   **Path C (It Depends):** You acknowledge **Scope Ambiguity**. The sentence has two possible logical structures.

  *   **Branch 3: The Intent Override**
      *   *Question:* If the speaker points at the right object but uses the wrong description (Martini/Water), are they right?
      *   **Path A (No):** Description is **Attributive**. The properties matter.
      *   **Path B (Yes):** Description is **Referential**. The object matters.
      *   **Path C (Contextual):** Description is **Incomplete**. We fill in the missing `WHERE` clauses from context.

  ---

  ## Part 3: Scoring Key & Leaves

  Map your dominant answers from the Quiz to these profiles.

  ### Leaf 1: The Boolean Existence Check (Russell-Style)
  *   **Signature Answers:** Q1(A), Q2(A), Q4(A), Q12(A).
  *   **The Claim:** "The" is a quantifier. It asserts existence and uniqueness.
  *   **SQL Analogy:** `CASE WHEN count(*) = 1 AND property = 'G' THEN TRUE ELSE FALSE END`.
  *   **Behavior:** 0 matches and >1 matches are both just **False**. Negation makes a non-existent subject True ("The King is not bald" is True because he doesn't exist).

  ### Leaf 2: The Precondition Failure (Strawson-Style)
  *   **Signature Answers:** Q1(B), Q2(B), Q4(B), Q5(A), Q12(B).
  *   **The Claim:** "The" triggers a presupposition. If it fails, the system crashes (no truth value).
  *   **SQL Analogy:** `ASSERT count(*) = 1; SELECT property FROM table...`. If assert fails, transaction rolls back.
  *   **Behavior:** 0 matches and >1 matches are both **Errors**. Negation does *not* fix the error (Presupposition Projection).

  ### Leaf 3: The Pointer/Reference (Donnellan-Referential)
  *   **Signature Answers:** Q3(B), Q7(B), Q12(C).
  *   **The Claim:** Sometimes "The F" is just a way to point to an object. If the object is found, the description accuracy is secondary.
  *   **SQL Analogy:** `SELECT * FROM table WHERE id = :pointer_id`. The `WHERE name = 'F'` is ignored if the ID is clear.
  *   **Behavior:** Misdescriptions can still be **True**. Distinguishes between "Whoever fits the description" (Attributive) and "That guy" (Referential).

  ### Leaf 4: The Contextual Completer (Pragmatic/Incomplete)
  *   **Signature Answers:** Q2(C), Q9(B), Q10(B).
  *   **The Claim:** "The F" is shorthand for "The F [in this context/time/room]". Uniqueness is rarely violated because context narrows the set.
  *   **SQL Analogy:** Every query has an implicit `WHERE context_id = current_session`.
  *   **Behavior:** >1 matches are resolved by context, not logic errors. 0 matches are still False/Error.

  ### Leaf 5: The Scope Ambiguity Acknowledger
  *   **Signature Answers:** Q4(C), Q5(C).
  *   **The Claim:** Natural language is underspecified. "The F is not G" is ambiguous between Wide Scope (Existence asserted) and Narrow Scope (Existence negated).
  *   **SQL Analogy:** Is the `NOT` inside the `WHERE` clause or wrapping the whole `SELECT`?
  *   **Behavior:** Refuses to give a single truth value without disambiguation.

  ---

  ## Part 4: Impossible & Collapsed States

  ### The "Impossible" Combinations
  *If someone selects these pairs, their logic is likely incoherent or they misunderstood the question.*

  1.  **Q1(A) "False" + Q4(B) "Undefined on Negation"**
      *   *Why:* If "The King is bald" is simply False (Boolean), then "The King is not bald" *must* be True. You cannot treat the positive as a boolean failure and the negative as a precondition failure unless you admit Scope Ambiguity.
  2.  **Q3(B) "True on Misdescription" + Q1(A) "False on Non-Existence"**
      *   *Why:* If the description doesn't need to match for the sentence to be True (Referential), then non-existence shouldn't matter either (unless you insist the *object* must exist, just not the description). This is a defensible but tricky position (Existential Presupposition + Descriptive Flexibility).
  3.  **Q12(A) "SQL Count" + Q4(C) "Depends"**
      *   *Why:* If you implement it as a strict count check (Q12A), the logic is deterministic. There is no room for "Depends" on negation unless your SQL implementation changes based on emphasis.

  ### The "Collapsed" Leaves (Honest Admissions)
  *These positions look different in theory but produce the same output in your code.*

  1.  **Russell (Boolean) vs. Strawson (Precondition) on Simple Positives**
      *   *Collapse:* In a simple `SELECT` without `NOT` or `IF`, returning `FALSE` (Russell) and returning `ERROR` (Strawson) often result in the same user experience: the feature doesn't trigger.
      *   *Separation:* You only see the difference in **Negation** (Q4) or **Conditionals** (Q5). If you don't test those, the leaves are identical.
  2.  **Referential (Donnellan) vs. Contextual (Pragmatic)**
      *   *Collapse:* Both allow "The man with the martini" (holding water) to be True.
      *   *Separation:* Referential relies on *speaker intent/pointing*. Contextual relies on *narrowing the domain* (e.g., "The man [at this table] with the martini"). In code, both look like `JOIN` on a user-provided ID rather than a string match.
  3.  **0 Matches vs. >1 Matches**
      *   *Collapse:* Most theories (Russell, Strawson) treat these identically (False or Error).
      *   *Separation:* Only **Contextual/Pragmatic** views often treat >1 as resolvable ("Which one did you mean?") while treating 0 as hard failure. If your diagnostic shows someone treating >1 as "Ask for clarification" but 0 as "False", they are a Pragmatist.

  ### Live Options You Might Not Have Heard Of
  *   **The Dynamic/Anaphoric View (Q11):** "The" behaves like a variable pointer set by previous discourse ("A man entered... The man..."). It's less about uniqueness and more about tracking state.
  *   **The Maximalist View:** "The dogs are barking" (plural) implies *all* relevant dogs. "The dog" implies the maximal individual in the set. (Not covered deeply here, but relevant for `SELECT *` vs `SELECT ONE`).

  ---

  ## Facilitator Notes for the Brown Bag
  1.  **The "SQL Bug" Hook:** Start by telling them Q12 is the only question that matters for the code, but Q1-Q11 explain *why* the product manager and the engineer are arguing about Q12.
  2.  **The Scope Bug:** Emphasize Q4. Tell them this is exactly like `NOT (a AND b)` vs `(NOT a) AND b`. Most production bugs with "natural language" search come from assuming Narrow Scope when the user meant Wide Scope (or vice versa).
  3.  **No Right Answer:** Make it clear that Philosophy doesn't solve this; it just names the trade-offs. Russell makes logic clean but user-hostile (False on 0 rows). Strawson is user-friendly (Error/Ask) but computationally expensive (Pre-checks). Donnellan is powerful but hard to implement (Intent detection).
  4.  **The Collapse:** Be honest. If your team can't agree on Q4 (Negation), you cannot distinguish Russell from Strawson in production. You have to pick one based on UX, not truth.
