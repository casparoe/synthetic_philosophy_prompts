  ### The Seven Branch Questions

  1.  **Lottery Judgment:** In the fair million-ticket lottery, do you believe of Ticket #1 that it will lose?
  2.  **Preface Comparison:** Is the author's preface situation fundamentally different from the lottery player's situation?
  3.  **Conjunction:** If you believe every claim in the monograph, do you believe the whole book is true?
  4.  **Stakes Sensitivity:** In the Lab case, if the cost of error rises from minor to fatal, do you withdraw belief in the reports?
  5.  **Statistical Block:** In the Lab case, does the known 0.1% error rate block belief even if the specific measurement looks normal?
  6.  **Attitude:** In the Lab case, is the scientist's mental state "belief" or "acceptance for purposes of inquiry"?
  7.  **Closure:** If you believe P, and P obviously entails Q, are you rationally required to believe Q?

  ***

  ### The Decision Tree (Pruned to Occupied & Notable Spaces)

  *   **Q1: Lottery Judgment (Believe Ticket #1 loses?)**
      *   **NO** → **Q2: Preface Comparison (Different from Lottery?)**
          *   **NO** → **Q5: Statistical Block (Error rate blocks belief?)**
              *   **YES** → **Leaf 1: The Safety Theorist**
              *   **NO** → **Leaf 2: The Statistical Skeptic**
          *   **YES** → **Leaf 3: The Distinctivist**
      *   **YES** → **Q3: Conjunction (Believe whole book true?)**
          *   **NO** → **Leaf 4: The Non-Conjunctivist (Kyburg)**
          *   **YES** → **Q4: Stakes Sensitivity (Withdraw belief if cost rises?)**
              *   **YES** → **Q7: Closure (Required to believe entailments?)**
                  *   **YES** → **Leaf 5: The Contextualist**
                  *   **NO** → **Leaf 6: The Interest-Relative Invariantist**
              *   **NO** → **Q6: Attitude (Belief or Acceptance?)**
                  *   **Acceptance** → **Leaf 7: The Acceptance Theorist**
                  *   **Belief** → **Q7: Closure (Required to believe entailments?)**
                      *   **YES** → **Leaf 8: The Lockean**
                      *   **NO** → **Leaf 9: The Incoherent Posit**

  ***

  ### The Leaves

  1.  **The Safety Theorist** (No Lottery, No Preface Diff, Yes Stat Block)
      *   *Awkward Commitment:* You know very little about the everyday world because almost anything could easily be false.
  2.  **The Statistical Skeptic** (No Lottery, No Preface Diff, No Stat Block)
      *   *Awkward Commitment:* You deny belief in lotteries but accept it in labs despite identical statistical structures.
  3.  **The Distinctivist** (No Lottery, Yes Preface Diff)
      *   *Awkward Commitment:* You treat two logically identical probabilistic situations as fundamentally different problems.
  4.  **The Non-Conjunctivist (Kyburg)** (Yes Lottery, No Conjunction)
      *   *Awkward Commitment:* You believe P and believe Q, but rationality forbids believing (P and Q).
  5.  **The Contextualist** (Yes Lottery, Yes Conjunction, Yes Stakes, Yes Closure)
      *   *Awkward Commitment:* The word "believe" changes its meaning depending on the conversational context.
  6.  **The Interest-Relative Invariantist** (Yes Lottery, Yes Conjunction, Yes Stakes, No Closure)
      *   *Awkward Commitment:* Whether you believe something depends on what you care about, not just the evidence.
  7.  **The Acceptance Theorist** (Yes Lottery, Yes Conjunction, No Stakes, Acceptance)
      *   *Awkward Commitment:* Science proceeds successfully without scientists actually believing their own results.
  8.  **The Lockean** (Yes Lottery, Yes Conjunction, No Stakes, Belief, Yes Closure)
      *   *Awkward Commitment:* You rationally believe a contradiction in the preface case (all claims are true + one is false).
  9.  **The Incoherent Posit** (Yes Lottery, Yes Conjunction, No Stakes, Belief, No Closure)
      *   *Awkward Commitment:* You assert belief aggregates but deny closure, violating basic logical norms without justification.

  ***

  ### Note on Unoccupied Combinations
  Most of the 128 logical combinations generated by seven binary questions are unoccupied. The most glaring gaps are **No Belief + Yes Conjunction** (psychologically impossible) and **Acceptance + Belief** (conceptually contradictory). There are also many **Unexplored** regions, such as accepting statistical evidence in the Lab case but rejecting it in the Lottery case without appealing to safety or distinctness; these are usually abandoned because they look like ad hoc gerrymandering rather than principled theory. Leaf 9 is **Incoherent** because denying closure while affirming conjunction violates the definition of rational belief. Leaf 2 is **Unattractive** because it lacks a principled reason to distinguish Lab from Lottery.

  ### Indistinguishable Leaves
  **Leaf 5 (Contextualist)** and **Leaf 6 (Interest-Relative Invariantist)** are functionally indistinguishable in this tree. Both answer "Yes" to Stakes Sensitivity, and the tree's concrete questions cannot separate the semantic mechanism (context changes meaning) from the metaphysical mechanism (stakes change the fact of belief).

  ### Final Thought
  The tree suggests the paradoxes are only one problem if you force a unified answer to the Lottery and Preface questions; otherwise, the logical space allows them to be distinct puzzles requiring different solutions.

