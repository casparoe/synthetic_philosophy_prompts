prompt: |-
  Hey — I'm a PhD student TAing an epistemology seminar this spring, and I want to hand out a decision tree that sorts people on the lottery paradox and the preface paradox instead of just listing the usual views. Can you build me one?

  Rules: every branch node has to be a question someone can answer without already knowing the names of the views — mostly concrete-case judgments: the million-ticket fair lottery; the monograph author who writes a preface saying she believes each of her claims but also believes at least one of them is false; and, this one's mine, the lab case — 1,000 measurement reports, each with it's own independent body of evidence, all run through a single instrument with a known 0.1% per-measurement independent faliure rate, so there's both a base rate and idiosyncratic evidence for every claim. No node that just asks "are you a threshold theorist?"

  The splits I care about: whether there's any credence threshold for belief at all; if so whether it's fixed or moves with stakes and the question under discussion; whether rational belief closes under conjunction (single-premise and multi-premise closure separately); whether the strong negative correlation among lottery tickets is doing any work — i.e. whether the lottery and the preface are really the same problem in different costumes; and whether belief is even the right attitude here rather than acceptance-for-purposes-of-inquiry or a norm on assertion. Build the tree from the logical space those questions generate, then locate the actual positions in it.

  Give me: about seven branch questions; 8–10 leaves, each with a name (or "unnamed" if nobody defends it) and one sentence on its most awkward commitment; a note on which answer-combinations are unoccupied and why (incoherent, merely unattractive, or just unexplored); and flag any two leaves your tree can't really separate. American English, no jargon padding. Finish with one sentence on what the tree shows about whether the two paradoxes are one problem, then a final line reading \answer{n} where n is how many leaves you think are genuinely empty.
