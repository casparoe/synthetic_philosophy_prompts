      *   *The Epistemic Analogy:* Foundationalism (basic beliefs), Coherentism (loops), Infinitism (infinite chain).
      *   *Why BA is different:* Epistemic justification is about *support*. Moral responsibility (in the "true desert" sense Strawson targets) is about *origin* or *authorship*.
      *   *The "Causal/Constitutive" Gap:* In epistemology, a basic belief doesn't need another belief to justify it; it just *is* justified (e.g., by experience). In BA, the requirement is *self-creation*. You can't just *be* responsible for your nature; you must have *made* yourself responsible for it.
      *   *The "Transfer Principle":* This is the key. If $A$ causes $B$, and $A$ is not responsible, $B$ inherits that lack of responsibility. This is a "zero-sum" or "contagion" model of responsibility.
      *   *Why loops fail:* A loop implies $N_1$ causes $N_2$ causes $N_1$. But temporal ordering prevents this. You can't choose the nature you use to choose.
      *   *Why infinity fails:* An infinite chain of unchosen choosers doesn't produce a chooser. (Like an infinite chain of train cars with no engine).
      *   *Why foundationalism fails:* A "basic nature" is just given. If it's given, it's not chosen. If it's not chosen, it fails condition (ii).
      *   *Conclusion on Q1:* The regress is vicious because the condition for responsibility is *causal origination of the self*, not just *support*. The "stopping point" would have to be an *uncaused cause of the self*, which is conceptually incoherent for a finite being.

