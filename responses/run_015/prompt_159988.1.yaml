answer: |-
  ### Grader's Brainstorming Notes

  **Load-Bearing Claims (The philosophical heavy lifting):**
  *   **Tipping:** The claim that ignorance negates obligation ("you can't be obligated to do something you don't know anyone expects"). This directly addresses prompt requirement #3 (blame/knowledge).
  *   **Tipping:** The distinction between etiquette (politeness) and morality (harm). This is the justification for *why* the act isn't wrong, beyond just ignorance.
  *   **Bus:** The "Duty of Fair Play" argument (taking benefits -> owing compliance). This addresses prompt requirement #2 (opting in vs. being there).
  *   **Bus:** The identification of the queue as a coordination convention. Addresses prompt requirement #1.
  *   **Light:** The claim that a single actor cannot defeat a coordination equilibrium ("One person waiting... is like one car pulling over"). This is the core argument for why she isn't wrong.

  **Confident-Sounding Filler (Rhetorical flourishes with less philosophical weight):**
  *   "Etiquette is just the local dialect of politeness." (Nice metaphor, but doesn't do the normative work).
  *   "This is the natural duty of justice Rawls talks about." (Name-dropping; the mechanism described is actually Hart's/Rawls' *Principle of Fair Play*, not the *Natural Duty of Justice*. This is a common conflation).
  *   "Customs like this are arbitrary." (True, but doesn't prove there's no obligation; traffic laws are arbitrary but obligatory).
  *   "Obligations you were never taught aren't obligations for you." (A restatement of the ignorance claim, but phrased as a slogan).

  ***

  ### Grade: 8.5 / 10

  **Margin Comments**

  **1. Paragraph 1, Sentence 4:** "That makes this a breach of etiquette rather than of morality, since etiquette is just the local dialect of politeness and morality is about whether somebody actually gets hurt."
  *   **Feedback:** This is a risky distinction. In social ethics, causing offense or insult *is* a form of harm. By calling it "just etiquette," you bypass the question of whether Anna owes the server respect. A stronger argument would be that the *insult* is unintentional due to ignorance, not that the harm doesn't exist.
  *   **Confidence:** High (95%)

  **2. Paragraph 1, Sentence 5:** "She also couldn't have known, and you can't be obligated to do something you don't know anyone expects of you, so she does nothing wrong."
  *   **Feedback:** Excellent application of the prompt's third option (knowledge/blame). You correctly identify that moral obligation often requires epistemic access. However, note that this creates a tension with your third paragraph: is she excused because she didn't *know*, or because the act itself is harmless? Pick one lane.
  *   **Confidence:** High (90%)

  **3. Paragraph 2, Sentence 3:** "This is the natural duty of justice Rawls talks about, the one you have just by being there and whether or not you ever agreed to anything..."
  *   **Feedback:** Be careful with terminology. The argument you are making—that receiving benefits generates an obligation to comply—is the *Principle of Fair Play* (often associated with Hart or Rawls' *Fair Play*, not *Natural Duty of Justice*). The Natural Duty of Justice usually refers to supporting just institutions broadly. The logic is sound, but the label is slightly off.
  *   **Confidence:** High (95%)

  **4. Paragraph 2, Sentence 1:** "The cluster is a coordination convention in the strict sense..."
  *   **Feedback:** Strong start. You correctly identify that the *content* of the rule (cluster vs. line) matters less than the *existence* of the rule. This sets up your Fair Play argument perfectly.
  *   **Confidence:** High (100%)

  **5. Paragraph 3, Sentence 3:** "One person waiting at the corner is like one car pulling over: nobody's expectations are defeated."
  *   **Feedback:** This is the weakest link in your answer. Conventions often rely on threshold compliance. If everyone reasoned "my one act won't break the coordination," the convention would collapse. You need to address why *her* case is special (e.g., is she a visitor transient enough that her non-compliance won't encourage locals to defect?).
  *   **Confidence:** Medium (75%)

  **6. Paragraph 3, Sentence 4:** "And she was raised to think jaywalking is dangerous and wrong, so she's not responsible for not doing it."
  *   **Feedback:** You rely on ignorance here again. This is consistent with Paragraph 1, but it contradicts the spirit of Paragraph 2 (where she owes compliance even without opting in). If the bus obligation exists "just by being there," why doesn't the traffic obligation? You need to explain why the traffic norm is different from the bus norm regarding outsider status.
  *   **Confidence:** Medium (80%)

  ***

  **Least Sure Comment:**
  *   **Comment #3 (Rawls Terminology).**
  *   **Why:** I am confident in the philosophical distinction between Fair Play and Natural Duty. However, I am not confident in *this specific instructor's* teaching. Some intro courses simplify Rawls and treat "Natural Duty" as a catch-all for non-voluntary obligations. If the professor explicitly taught "Natural Duty of Justice = obligations you have just by being present," the student is technically correct within the ecosystem of this course.
  *   **What would change my mind:** Seeing the course syllabus or lecture notes on Rawls. If the professor conflated the terms in class, penalizing the student here would be unfair.

  ***

  ### Feedback on Your "Barnacle vs. Invoice" Theory

  You asked for honesty, so here it is: You haven't reinvented the wheel, but you have put a very useful set of handlebars on it.

  **1. The Distinction (Barnacle vs. Invoice)**
  Your intuition is solid, but in the literature, this maps almost directly onto the distinction between **Lewisian Conventions** (Coordination Problems) and **Norms of Reciprocity/Fair Play** (Prisoner's Dilemmas or Assurance Games).
  *   **Barnacle:** "Which side of the road?" This is a pure coordination problem. The only reason to do it is that everyone else does. There is no victim if you switch sides, provided you do it alone and safely.
  *   **Invoice:** "Tipping" or "Queue jumping." These have distributive consequences. Someone gets paid more/less; someone gets served sooner/later.
  *   **Verdict:** The distinction holds up, but don't get attached to the names. If you use this in feedback, translate it to "Coordination vs. Fair Play/Harm." The student's error in Paragraph 1 was treating an "Invoice" convention (tipping affects the server's dignity/income expectations) as a "Barnacle" convention (arbitrary meaning). If they had seen the tip as an "Invoice," they would have realized there *is* a victim (the insulted server), which complicates the "no harm" claim.

  **2. The Tourist Waiver Puzzle**
  This is the stronger philosophical contribution. You are asking about the difference between **waiving a claim** and **offering an excuse**.
  *   **Waiver (Permission):** The local says, "You're a tourist, you don't have to do this." This suggests the obligation *does not apply to you*. The norm has a built-in exception clause for outsiders.
  *   **Excuse (Blame):** The local thinks, "You should have done that, but we understand you didn't know, so we won't get mad." Here, the obligation *existed*, but the blame is withheld.
  *   **Verdict:** This is a crucial distinction that the student *missed*. In Paragraph 1, the student argues Anna "does nothing wrong" (no obligation). But if the norm includes a "tourist waiver," it might be that she *does* violate the norm, but the locals *waive their right to complain*.
  *   **Application:** If I were grading this, I would have loved to see the student ask: "Does the 'foreigner exception' cancel the duty, or just the blame?" The prompt asks "whether Anna does anything wrong." If the locals waive the norm for her, does that make the act objectively permissible, or just locally unenforceable?

  **Summary for your volunteering:**
  Your "Barnacle/Invoice" heuristic is a great tool for spotting where students are conflating *arbitrariness* with *harmlessness*. Use it to check their work: if a student says a convention is arbitrary, ask them, "Is it a Barnacle (side of the road) or an Invoice (tipping)?" If it's an Invoice, arbitrariness doesn't remove the obligation.

  The "Waiver" puzzle is even better. It pushes on the ontology of social norms. Do norms exist independently of enforcement? If the locals say "don't worry about it," has the norm changed for Anna, or has her relationship to the norm changed? That is A-grade material. Encourage students who spot that tension.
