answer: |-
  This is a sharp question. You are right to be suspicious. The analogy between Probabilistic Seismic Hazard Assessment (PSHA) and Cliodynamics is the strongest rhetorical shield Turchin and colleagues have, but when held up to the technical scrutiny of your trade, it fractures.

  Here is the audit you requested.

  ### 1. The Mapping

  | Seismological Concept | Cliodynamic Counterpart | Fidelity Assessment |
  | :--- | :--- | :--- |
  | **Accumulating Strain** | **Structural Demographic Stress** (Elite overproduction, popular immiseration, fiscal distress). | **Moderate.** Conceptually similar (potential energy vs. social tension), but strain is physical/kinematic; stress here is sociological/inferred. |
  | **Fault Segment** | **The Polity / Nation-State.** | **Low.** Faults have physical boundaries defined by rock mechanics. Polities have porous, definitional boundaries (when does a state end and a region begin?). |
  | **Rupture** | **Civil War, Revolution, State Collapse.** | **Moderate.** Distinct events, though "rupture" implies a sudden release of energy, whereas societal collapse can be a slow decay or a rapid puncture. |
  | **Magnitude Scale** | **Intensity of Instability** (Battle deaths, regime change severity, duration). | **Low.** Moment magnitude is logarithmic and physically grounded. "Intensity" in history is qualitative and data-poor. |
  | **Recurrence Interval** | **Secular Cycles (200–300 yr) + Father-Son Cycles (~50 yr).** | **None.** Seismology has characteristic earthquakes, but strict nested periodicity (a long cycle modulated by a shorter one) is not a standard feature of fault mechanics. This is a specific theoretical claim in cliodynamics without a seismological twin. |
  | **Foreshocks / Aftershocks** | **Minor Riots / Purges.** | **Low.** Foreshocks have specific physical precursors. "Minor unrest" is constant background noise; distinguishing a foreshock from background is currently impossible. |
  | **Seismic Gap** | **High Political Stress Index.** | **Low.** A seismic gap is a physical segment that hasn't slipped. A "stress gap" is a statistical outlier based on the very data used to define the stress. |
  | **Loading Rate** | **Rate of Elite Growth / Wage Decline.** | **Critical Failure.** (See Disanalogy 1). |

  ### 2. The Disanalogies

  You identified two critical failures. Both are as strong as you suspect, and they do real damage to the analogy.

  **Disanalogy 1: Independence of the Loading Rate (The "Circularity" Problem)**
  *   **Your Trade:** In PSHA, the strain rate is measured via geodesy (GPS, InSAR) or geology (trenching). These measurements are *kinematic*. They do not rely on the earthquake catalog to determine the loading rate. We know the plates are moving at 50mm/yr regardless of whether an earthquake happens.
  *   **Cliodynamics:** The "stress" variables are reconstructed from the historical record (wages, biographical data on elites, tax receipts). These are often the *same* archives used to identify the crises. If your measure of "strain" is derived from wage data, and your measure of "rupture" is derived from tax collapse records, and both come from the same fragmented historical dataset, you risk circularity. You are essentially calibrating the stress model against the rupture history because the data sources are entangled.
  *   **Verdict:** **Fatal.** This violates the fundamental requirement of a hazard model: the hazard must be independent of the occurrence. In cliodynamics, the "hazard" is often inferred from the "occurrence."

  **Disanalogy 2: Sample Size and Ergodicity (The "N" Problem)**
  *   **Your Trade:** You rely on the Gutenberg-Richter relation. It holds across California, Japan, Chile. You can trade space for time. Because the physics of rock failure is universal, a fault in Chile informs a fault in Japan. You have thousands of segments.
  *   **Cliodynamics:** They have perhaps two dozen well-documented historical polities that run for full secular cycles. Worse, these events are not independent. The Roman crisis affects the Parthian crisis; the 1848 revolutions spread across Europe. This violates the independence assumption required for the statistics to hold. You cannot trade space for time because the "physics" (human culture/economics) changes from one polity to another.
  *   **Verdict:** **Severe.** It reduces the statistical power to a level where "significance" is easily manufactured by tuning parameters.

  **Disanalogy 3: Reflexivity (The "Observer" Problem)**
  *   **Your Trade:** The San Andreas Fault does not know you are modeling it. It does not change its behavior because you published a hazard map.
  *   **Cliodynamics:** Humans read Turchin. If elites believe a revolution is coming due to overproduction, they may purge rivals (causing the revolution) or open positions (preventing it). The prediction alters the probability.
  *   **Verdict:** **Moderate.** This doesn't invalidate the science, but it invalidates the *stationarity* assumption required for PSHA. The hazard curve changes when you publish it.

  ### 3. The 2010 Forecast (The "Hit")

  In PSHA, a single hit against a high base rate is indeed worth nothing. If you forecast a magnitude 7 in California in a 30-year window, and one occurs, you have merely confirmed the obvious.

  The Cliodynamic forecast was: "The 2020s will be turbulent."
  *   **Base Rate:** The US has significant political turbulence in almost every decade.
  *   **Specificity:** They did not predict the *type* (pandemic, insurrection, inflation), only "turbulence."
  *   **Seismological Standard:** If a seismologist said, "There will be shaking in California in the 2020s," and the Loma Prieta aftershocks continued, it's not a validation of a specific hazard model.

  **Does the earthquake analogy help them?**
  No, it hurts them. In seismology, we validate models using **C-Tests** (consistency tests) and **L-Tests** (likelihood tests) over many events. We look at the entire catalog, not just the hit. We ask: *Did the model assign high probability to where the quake happened, and low probability to where it didn't?*

  Cliodynamics rarely publishes the "where it didn't" cases. How many decades did they flag as high stress that *didn't* produce turbulence? Without the false alarm rate, the 2010 "hit" is cherry-picking. Importing seismological standards exposes that they lack the validation dataset to prove skill.

  ### 4. Verdict on the "Building Code" Question

  **Is it legitimate to act on these things like we act on hazard maps?**
  **No.**

  In seismology, we write building codes because the *physics of the hazard* is robust, even if the *timing* is not. We know that if a M7 occurs, the ground will shake at X frequency. We build for X.

  In Cliodynamics, the "physics" is not robust enough to dictate specific structural changes. If you "build a code" based on elite overproduction (e.g., "cap law school enrollments"), you are intervening in a complex adaptive system with reflexive agents. You might solve the overproduction but trigger a fiscal crisis.

  **The Better Analogy: Epidemiology**
  Seismology is the wrong comparison. Cliodynamics is closer to **Epidemiology** or **Public Health**.

  *   **Why it fits:**
      *   **Risk Factors:** Smoking/Obesity ≈ Elite Overproduction/Immiseration.
      *   **Event:** Heart Attack/Stroke ≈ Civil War/Revolution.
      *   **Prediction:** A doctor cannot tell you *when* you will have a heart attack. They can tell you your 10-year risk is 20% based on biomarkers.
      *   **Action:** You don't "build a code" (e.g., "reinforce the heart muscle"). You change behavior (diet, exercise, stress reduction) to lower the risk factors.

  *   **What this licenses:**
      *   It licenses **policy mitigation**, not **hazard preparation**.
      *   It suggests we should reduce inequality, expand elite mobility, and stabilize finances *to lower the probability of collapse*, not to "weather the storm" of a specific predicted decade.
      *   It admits that even with perfect risk factor management, a "heart attack" (revolution) can still happen due to external shocks (pandemics, foreign wars).

  *   **What this does NOT license:**
      *   It does not license the deterministic fatalism of the "Secular Cycle." (You aren't doomed to a heart attack at age 52 just because your father had one).
      *   It does not license specific operational forecasts ("Stockpile food for 2024").

  **Conclusion**
  The defenders are using seismology to borrow authority they haven't earned. Seismology works because rocks are non-reflexive and physics is universal. Cliodynamics deals with reflexive agents and unique historical paths.

  Your intuition on the data independence and sample size is correct; those are the weak points that break the analogy. Treat Cliodynamics not as a hazard map (which tells you how to build the wall) but as a public health warning (which tells you to eat your vegetables). The former requires the rigor of PSHA; the latter requires the humility of epidemiology. Currently, they claim the former while practicing the latter, often without the epidemiological rigor to match.
