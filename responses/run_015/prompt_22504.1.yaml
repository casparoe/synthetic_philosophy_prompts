          *   *Draft Question:* Is this a solution to skepticism?
          *   *Refinement:* If Charity is constitutive, skepticism is unintelligible. But does that feel like a cheat?
          *   *Follow-up:* If they say "skepticism is empty," ask about the *feeling* of uncertainty in actual communication.

      *   *Topic 5: Normativity of Meaning (Bonus/Content).*
          *   *Idea:* Meaning is normative (oughts). Charity assumes rationality.
          *   *Draft Question:* How does the 'ought' of rationality emerge from the 'is' of behavior?
          *   *Follow-up:* If they appeal to constitutive norms, ask about the possibility of irrationality.

      *   *Topic 6: First Person Authority (Bonus/Content).*
