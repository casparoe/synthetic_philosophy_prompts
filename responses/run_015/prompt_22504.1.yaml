          *   *Follow-up:* If they say "because belief and meaning are interdependent," ask about the normativity. Is it about *truth* or just *coherence*?

      *   *Topic 2: Triangulation.*
          *   *Idea:* RI seems solipsistic (one interpreter, one speaker). Triangulation adds the world.
          *   *Draft Question:* How does triangulation help?
          *   *Refinement:* Press on the *objectivity* of truth. Without a shared causal interaction with an object, how do we fix the content?
          *   *Follow-up:* If they say "it fixes the cause," ask about non-linguistic animals or infants who triangulate but don't interpret.

      *   *Topic 3: Tarskian Construction & Underdetermination.*
          *   *Idea:* Tarski gives truth conditions. But evidence (holding true) underdetermines the theory.
          *   *Draft Question:* Tarski gives a formal structure. But evidence is just "holding true." Isn't there massive underdetermination?
          *   *Refinement:* Focus on the "passing theory" vs. "prior theory" or the indeterminacy of translation (Quine). Davidson thinks Charity solves this. How?
          *   *Follow-up:* If they say "Charity narrows the options," ask if *any* viable alternative remains, or if it's just pragmatic.

      *   *Topic 4: Problem of Other Minds.*
