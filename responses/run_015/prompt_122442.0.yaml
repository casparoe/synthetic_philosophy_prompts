answer: |-
  Mont-Louis, near Montmorency
  August 1758

  Monsieur et cher Concitoyen,

  It is a relief to hear that the Small Council has set aside the project for a standing theatre. I had feared that the allure of Parisian fashion would blind us to the danger such an institution poses to a free state. You know my reasons: a theatre introduces idleness, encourages expense, and brings with it a troupe of comedians whose morals are rarely a model for youth, and whose presence inevitably loosens the severity of our manners. But beyond this, there is the deeper objection that a people who gather only to sit in darkness and watch others act learn nothing but passivity. They become spectators of virtue rather than actors in their own lives.

  Your new proposal, however, gives me pause for a different reason. It seems you have read my recent thoughts on this matter with care, and perhaps you seek to test whether I argue from principle or merely from humour. I shall answer you plainly. What I objected to in the plan for a closed theatre was not simply the presence of professionals, but the separation it creates between the people and the spectacle. When citizens pay to sit in rows and watch a few among them perform, the community is divided into the active and the passive. The latter grow cold, while the former grow vain.

  Yet what you describe here resembles less a theatre than those public festivals I suggested ought to replace it. If the gathering is in the open air, if there is no charge, if the performers are your neighbours acting without pay, and if the event concludes with a common meal where magistrates and citizens sit together, then the nature of the thing changes. It is no longer a spectacle designed to amuse us, but a ceremony designed to unite us. The danger of imitation lies in learning to be other than oneself, to wear a mask for profit or applause. But if a young man represents a hero of the Escalade, he is not pretending to be a stranger; he is recalling the virtue of his ancestors. He is not playing a role; he is honoring a duty.

  I must concede, then, that if this event is truly conducted as you say—with no repetition, no professional direction, and no separation of the audience from the actors—it dodges my primary objections. It is not a theatre; it is a civic rite. However, I would urge you to prefer the Escalade to Tell. Tell is a foreigner, and his story, though noble, is not our own blood. The Escalade is Geneva. When we commemorate our own deliverance, we do not imitate; we remember. There is a profound difference. To imitate is to pretend; to remember is to become.

  Do not think I give this blessing lightly. I remain convinced that a people is not improved by sitting still and watching others pretend. But in your plan, the people do not sit still; they gather, they eat, they mingle, and the performers are not distinct from them in status or purpose. The prize given by the magistrates is good, provided it is for virtue and not for skill in acting. We do not want to create citizens who are good at pretending to be brave, but those who are brave.

  I write this from my retreat here, far from the Rhône, but my heart remains among you. I ask only that you guard this festival against the slow creep of habit. Do not let it become an annual expectation of amusement. Keep it rough, keep it public, and keep it yours. If you do this, I shall have no cause to object, and every reason to hope.

  I am, with respect, your humble servant,

  J. J. Rousseau
