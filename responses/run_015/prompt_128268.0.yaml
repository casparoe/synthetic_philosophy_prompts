answer: |-
  In a specialized hospital ward housing two hundred immunocompromised patients, a ventilation safety protocol requires one maintenance engineer to manually stabilize a vibrating duct during a storm, risking permanent spinal compression, or else allow the system to distribute a negligible amount of non-toxic particulate into the patients' rooms. Individually, the particulate exposure causes only transient throat irritation, a harm too slight for any single patient to reasonably reject on its own; however, the hospital's air filtration geometry is such that these particulates accumulate cumulatively in the central exchange unit, and once the total mass from all rooms crosses a specific density threshold, the unit clogs completely, triggering an automatic ward-wide lockdown that cancels all critical surgeries for a week. This lockdown imposes a collective burden of delayed care and mortality risk comparable in severity to the engineer's spinal injury, despite no single patient facing a high individual risk of harm from the particulate alone.

  **Contractualist Analysis**

  The principle under evaluation is: "Maintenance staff may avoid severe physical injury even if doing so allows minor environmental breaches that trigger systemic ward failure." The engineer's complaint is straightforward: the principle permits inflicting permanent spinal damage on an identifiable individual. The patients' complaint, taken in isolation, is merely transient throat irritation, which is typically insufficient to reject a principle saving someone from paralysis. However, under the threshold-crossing structure, the patients' complaints gain decisive weight because the harm is not merely distributed but *structurally linked*. The reasonableness of rejection is evaluated against the outcome of the principle; here, the principle permits a state of affairs where the shared life-support system collapses. Because the threshold creates a non-linear dependency, each patient's complaint is not just about their own throat, but about being subjected to a principle that renders their collective environment unstable. The contractualist framework, which prioritizes principles no one could reasonably reject, must account for the fact that the *joint* operation of these slight harms creates a catastrophic outcome that any single patient can cite as a reason to reject the principle, not by aggregating utilities, but by pointing to the systemic vulnerability the principle authorizes.

  The feature doing the work is the **cumulative threshold with individually sub-threshold harms**. This structure transforms the moral geometry from a set of independent pairwise comparisons into a single interdependent scenario. If this feature is removed—for instance, if the particulates did not accumulate and the ward never locked down—the harms would remain independent. In that case, the engineer's severe burden would decisively outweigh any single patient's slight irritation, and contractualism would forbid imposing the injury on the engineer, reverting to the standard anti-aggregationist result. The threshold is essential because it makes the collective outcome a direct consequence of the principle's acceptance, rather than a sum of isolated incidents.

  A defender of the standard anti-aggregationist reading of Scanlon would attack this case by insisting that contractualist comparison must remain **strictly pairwise**. They would argue that the "collective burden" is a fiction created by smuggling utilitarian aggregation back into the framework under the guise of systemic risk. They would deny that the threshold creates any genuinely collective weight, maintaining that the engineer must be compared to Patient A, then Patient B, and so on. Since Patient A faces only throat irritation, they cannot reasonably reject the principle to save themselves, regardless of what happens to Patient B. The defender would argue that the victim's complaint has been undervalued by treating the group as a moral unit, violating the core contractualist tenet that justification is owed to each individual separately, not to the collective as a whole.
