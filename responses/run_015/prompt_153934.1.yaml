answer: |-
  **Project Title:** Normative Inertia: Structural Lock-In and Free-Floating Rationales

  **1. Statement of the Research Question**
  Standard meta-ethics asks whether reasons require a reasoner. Realists say no; anti-realists say yes. This project sidesteps that binary to ask a structural question: **Do normative spaces possess a kind of structural inertia where rationales remain binding due to the interdependence of norms themselves, independent of active agent endorsement?**

  Put simply: When a rule persists not because anyone believes in it, but because removing it would collapse the coherence of the surrounding system, is that persistence merely sociological (habit/path-dependence), or is it a distinct ontological category of normative force? I am investigating whether "free-floating rationales" are better understood as emergent properties of normative systems rather than platonic entities or mental states.

  **2. Background and Motivation**
  The current debate is stuck. Realists posit mind-independent reasons but struggle to explain their grip on agents. Anti-realists (including constructivists) anchor reasons in agency but struggle to explain normative persistence across changes in personnel or collective belief. Both views assume that for a reason to exist, it must be anchored either "out there" (metaphysics) or "in here" (psychology).

  This leaves open the possibility of a third anchor: the *structure* itself. Consider institutional rules or formal decision protocols. A bureaucratic constraint might remain operative even if no current actor understands its original justification, simply because it supports other active constraints. Similarly, in formal decision theory, a constraint on a future node may be locked in by the logic of the tree, regardless of the agent's current preference.

  Current literature treats this as "path dependence" (a causal/sociological description) or "alienation" (a psychological state). Neither captures the possibility that the normative force itself is sustained by systemic coherence rather than agent endorsement. If normative inertia is real, it changes how we understand obligation in institutions, law, and even AI alignment. If it is merely a metaphor for social persistence, then the "weirdness" of free-floating reasons dissolves into sociology. This project aims to distinguish between the two.

  **3. Methodology**
  This is a conceptual analysis project, not an empirical study. I will not be surveying agents or measuring compliance. Instead, I will use a comparative modeling approach:

  *   **Phase 1: Institutional Norm Dynamics.** I will analyze cases where norms persist despite widespread ignorance of their justification (e.g., procedural rules in legacy institutions, legal precedents where the *ratio decidendi* is lost but the ruling stands). I will map the dependency relations that keep these norms "alive."
  *   **Phase 2: Decision-Theoretic Formalisms.** I will compare these dynamics to formal constraint satisfaction problems and decision trees. In these systems, constraints propagate logically. If Node A requires Node B, Node B is "required" even if no agent is currently processing the tree.
  *   **Phase 3: Structural Comparison.** I will test whether the "force" in Phase 1 is analogous to the "constraint" in Phase 2. If the institutional norm behaves like a formal logical constraint rather than a social habit, this supports the ontological claim. If it collapses into causal habit or fear of sanction, the ontological claim fails.

  This method avoids the trap of asking "what do people believe?" and instead asks "what does the system sustain?"

  **4. Expected Outcomes and Criteria for Failure**
  **Success:** A refined typology of normative inertia. I aim to produce a paper arguing that structural lock-in constitutes a distinct source of normative validity, separate from both moral realism and constructivism. A successful result will demonstrate cases where removing a norm violates systemic coherence in a way that is normative (a mistake) rather than merely inefficient (a bug).

  **Failure:** The project fails if I cannot distinguish "normative inertia" from mere causal path dependence. If every instance of a free-floating rationale can be fully explained by "people are too lazy to change rules" or "people fear sanctions," then there is no distinct ontological category here. If the analogy to decision-theoretic formalisms proves disanalogous (e.g., because formal constraints lack *normativity* and only have *logical necessity*), the core thesis collapses. In this case, the output will be a negative result clarifying why structuralism cannot ground normativity.

  **5. Scope and Timeline (6 Months)**
  This scope is limited to conceptual mapping and formal comparison. It does not include full-scale ethical theory construction or empirical validation.

  *   **Month 1: Conceptual Mapping.** Define "normative inertia" precisely. Distinguish from path dependence, tradition, and alienation. Gather case studies of institutional norm persistence.
  *   **Month 2: Formal Modeling.** Select appropriate decision-theoretic frameworks (e.g., constraint propagation, game-theoretic equilibria) that model rule persistence without active agents.
  *   **Month 3: Comparative Analysis.** Draft the core argument mapping institutional cases onto formal models. Identify disanalogies.
  *   **Month 4: Drafting.** Write the primary paper (approx. 8,000 words). Focus on the ontological status of the inertia.
  *   **Month 5: Revision & Workshop Prep.** Refine arguments based on peer feedback (informal). Prepare a presentation version for the workshop.
  *   **Month 6: Final Polish.** Finalize paper for submission/distribution. Ensure the distinction between sociological and ontological claims is airtight.

  **6. Relevance**
  This work bridges meta-ethics and social ontology. It offers a new vocabulary for discussing normative persistence in contexts where agent agency is diluted, such as large bureaucracies, algorithmic governance, or intergenerational justice. By clarifying whether structures can "hold" reasons, we better understand the limits of individual responsibility within complex systems.
