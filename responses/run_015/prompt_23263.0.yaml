answer: |-
  This is one of the sharpest questions one can ask about the Knowledge Argument. You have identified the exact pivot point where the debate often stalls: the distinction between *ontology* (what exists) and *epistemology* (how we know it), and the further distinction between *propositional knowledge* (facts) and *non-propositional knowledge* (abilities).

  Here is a careful breakdown of what is at stake between the "New Fact" and "New Mode" readings, how the Ability Hypothesis functions, and exactly which version of physicalism is being threatened.

  ---

  ### 1. The Core Dispute: New Fact vs. New Mode of Presentation

  To understand the stakes, we must distinguish between the **state of the world** and **Mary's access to that state**.

  #### The "New Fact" Reading (Jackson's View)
  Frank Jackson's original argument relies on the premise that knowledge is fundamentally **propositional**. To "know something" is to know *that* something is the case (e.g., "I know *that* snow is white").
  *   **The Claim:** When Mary leaves the room, she acquires a new piece of propositional knowledge ($K_{new}$).
  *   **The Implication:** Since Mary already knew *all* the physical facts ($P_{total}$), and $K_{new}$ is not identical to any fact in $P_{total}$, there must be facts about the world that are not physical facts.
  *   **The Stake:** This threatens **Ontological Physicalism**. It suggests that qualia (subjective experiences) are non-physical properties that exist in the world.

  #### The "New Mode of Presentation" Reading (Phenomenal Concept Strategy)
  This reading grants that Mary learns something significant but denies that she learns a new *ontological* fact. It relies on the Fregean distinction between **reference** (the thing itself) and **sense** (the way we think about the thing).
  *   **The Claim:** Mary learns a new *concept* for a fact she already knew physically. She already knew the physical state $C$-fiber firing. Now she possesses the phenomenal concept "seeing red." Both concepts refer to the same physical state, but they have different cognitive roles.
  *   **The Analogy:** Imagine someone who knows everything about the planet Venus but has never seen it. They know "The Morning Star is a planet." Then they see it and learn "The Evening Star is a planet." They haven't learned about a *new planet*; they have learned that two different modes of presentation refer to the same object.
  *   **The Stake:** This saves **Ontological Physicalism** (only physical stuff exists) but concedes a point on **Epistemic Physicalism**. It admits that physical information does not automatically grant you every possible *way of thinking* about that information.

  **What is at stake?**
  If Jackson is right, the universe contains non-physical stuff. If the "New Mode" theorist is right, the universe is purely physical, but human cognition has two distinct "files" for accessing it (theoretical vs. experiential).

  ---

  ### 2. The Ability Hypothesis: Knowing-How vs. Knowing-That

  The Ability Hypothesis (championed by David Lewis and Laurence Nemirow) is distinct from the "New Mode" reading, though they are often grouped together as physicalist defenses.

  The "New Mode" reading says Mary learns a new proposition (fact) under a new concept. The **Ability Hypothesis** goes further: it says **Mary does not learn a proposition at all.**

  #### How it accommodates the intuition of learning
  You asked: *How can it make room for the intuition that Mary learns something while letting physicalism stay true?*

  The hypothesis relies on the Rylean distinction between:
  1.  **Knowledge-That (Propositional):** Knowing facts (e.g., "Red light has a wavelength of 700nm").
  2.  **Knowledge-How (Procedural):** Knowing abilities (e.g., "Knowing how to ride a bike").

  When Mary says, "I learned something," the Ability Hypothesis agrees. She *did* gain something. But what she gained was not a truth about the world; it was a **suite of abilities**. Specifically:
  *   The ability to **recognize** red experiences when she has them.
  *   The ability to **imagine** red without seeing it.
  *   The ability to **remember** red after looking away.

  #### Why this saves Physicalism
  If what Mary gains is an *ability*, not a *fact*, then her new knowledge does not need to be listed in the "catalogue of truths" about the universe.
  *   Physicalism claims: "All **facts** are physical facts."
  *   Ability Hypothesis retort: "Knowing what it's like is not a fact. It is a skill. Therefore, the existence of this skill does not violate the claim that all *facts* are physical."

  This allows physicalism to remain true because the ontology of the world hasn't changed. No new "qualia property" was added to the universe. Mary just upgraded her internal software to interact with her existing physical brain states in a new way.

  ---

  ### 3. Addressing Your Specific Doubt: "Why doesn't that simply mean she didn't learn a proposition at all?"

  You asked: *Does the ability hypothesis just say she gains a new ability... and if so, why doesn't that simply mean she didn't learn a proposition at all?*

  **Yes. That is exactly what it means.**

  This is the crux of the hypothesis. It argues that our language misleads us. When we say "I know what red looks like," we grammatically treat "what red looks like" as a noun phrase (a thing/fact). The Ability Hypothesis argues this is a grammatical illusion.

  *   **Jackson's Premise:** If Mary learns something, it must be a proposition.
  *   **Lewis's Counter:** That premise is false. One can "learn" without acquiring a new proposition.

  **Why this is controversial:**
  Critics (like Jackson later, or David Chalmers) argue that abilities *presuppose* propositions. To have the ability to *imagine* red, don't you first have to know *what* it is you are imagining? If you need to know *what* it is, isn't that propositional knowledge?

  The Ability Hypothesis responds: No. You can have the ability without being able to state the fact. A bird knows how to fly, but it doesn't know the proposition "aerodynamics allows lift." Similarly, Mary can recognize red without needing a new fact to describe it.

  ---

  ### 4. Which Version of Physicalism is Actually at Stake?

  You sensed that people argue past each other regarding the definition of physicalism. You are correct. There are two main versions, and Jackson's argument targets the stronger one to kill the weaker one.

  #### 1. Ontological Physicalism (The Weakest/Minimal Claim)
  *   **Definition:** Everything that *exists* is physical. There are no ghosts, souls, or non-physical properties.
  *   **Status:** This is the view most physicalists want to defend.

  #### 2. A Priori Entailment Physicalism (The Stronger Claim)
  *   **Definition:** The complete physical truth about the world *entails* (logically necessitates) all other truths. If you knew all the physical facts, you could logically deduce every other fact (including psychological ones) from your armchair.
  *   **Status:** This is the view Jackson attacks.

  #### How the Argument Works
  Jackson's strategy is to show that **A Priori Entailment** is false.
  1.  Mary knows all physical facts ($P$).
  2.  Mary does not know the phenomenal fact ($Q$).
  3.  Therefore, $P$ does not entail $Q$.
  4.  Therefore, **A Priori Entailment Physicalism** is false.

  **The Critical Turn:**
  Jackson then argues: If $P$ does not entail $Q$, then $Q$ must be about something *over and above* $P$. Therefore, **Ontological Physicalism** is false.

  **The Physicalist Counter-Move:**
  Physicalists (using Ability or Phenomenal Concept strategies) try to block step 4. They argue:
  *   "You proved $P$ doesn't entail $Q$. But that doesn't mean $Q$ is non-physical."
  *   "It just means $Q$ isn't a *fact* (Ability Hypothesis)" OR "It means $Q$ is the same fact as $P$ but accessed differently (Phenomenal Concepts)."

  **So, to answer your question:**
  The argument is *supposed* to threaten **Ontological Physicalism** (the view that only physical stuff exists). However, it only succeeds in directly disproving **A Priori Entailment Physicalism** (the view that physics explains everything deductively).

  The entire debate is about whether failing the "A Priori Entailment" test necessarily implies a failure of "Ontological Physicalism."
  *   **Jackson says:** Yes. If physics doesn't explain it, it's not physical.
  *   **Physicalists say:** No. Physics explains what exists, but human epistemology (how we learn/conceptualize) has limits that don't reflect on the world itself.

  ### Summary Table

  | Feature | Jackson (Dualism) | Phenomenal Concept Strategy | Ability Hypothesis |
  | :--- | :--- | :--- | :--- |
  | **Does Mary learn a fact?** | **Yes.** A new, non-physical fact. | **Yes.** But it's the same physical fact under a new concept. | **No.** She learns abilities, not facts. |
  | **Is Physicalism True?** | **No.** Qualia are non-physical properties. | **Yes.** Only physical properties exist. | **Yes.** Only physical properties exist. |
  | **Why did she learn?** | She accessed a new realm of truth. | She accessed an old truth via a new cognitive file. | She acquired a new skill (know-how). |
  | **Threat Level** | Destroys Ontological Physicalism. | Saves Ontology, sacrifices A Priori Entailment. | Saves Ontology, redefines "Knowledge." |

  ### Conclusion

  The confusion you identified stems from conflating **what is known** with **how it is known**.

  *   If you think "learning" *must* mean "adding a new proposition to your list of truths," Jackson wins, and physicalism loses.
  *   If you allow that "learning" can mean "acquiring a new ability" (Ability Hypothesis) or "acquiring a new conceptual perspective on an old truth" (Phenomenal Concepts), physicalism survives.

  The Ability Hypothesis specifically handles your worry by biting the bullet: **Yes, she didn't learn a proposition.** It argues that the intuition that she *must* have learned a proposition is the error, not the physicalist ontology. The weakest version of physicalism at stake is the claim that **physical information exhausts all factual information.** The Ability Hypothesis saves physicalism by arguing that "what it's like" isn't factual information at all.
