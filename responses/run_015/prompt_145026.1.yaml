          *   *The "Pure Baseline" Problem:* This is the philosophical killer. If human cognition is inherently shaped by language and concepts, a "pre-loop" human psychology might not exist.
          *   *Who has tried?* Epidemiologists try to control for "awareness," but a formula to subtract the looping effect? No. It's too complex/non-linear.
      *   **Synthesize Hacking's Actual Stance:**
          *   Hacking doesn't want to eliminate the category; he wants us to understand the *ethics* of it.
