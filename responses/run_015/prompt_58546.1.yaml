answer: |-
  The strong epistemic claim fails because empirical data shows voters systematically violate the independence and competence assumptions, turning the supposed wisdom of crowds into correlated errors that amplify wrong answers.

  The most fatal blow to the theorem is the violation of the independence assumption. The Condorcet Jury Theorem (CJT) mathematically requires that voters' errors be uncorrelated; if voters make mistakes for different reasons, the errors cancel out. However, in real political environments and your chatbot example, errors are systematically correlated. Voters consume the same media, share cultural biases, and are influenced by the same elites, meaning when they are wrong, they are wrong together. Formal results by Krishna Ladha (1992) demonstrate that even small degrees of correlation between voters can destroy the convergence to truth, causing the probability of a correct majority decision to drop rather than rise as the group expands. In your chatbot scenario, running 51 copies of the same model guarantees identical failures on specific prompts because the weights are identical; this is not independent sampling, it is pseudoreplication, and the theorem offers no protection against systemic bias shared across the electorate.

  Secondly, the competence assumption ($p > 0.5$) is empirically fragile and often false for complex issues. The theorem dictates that if the average voter is worse than a coin flip ($p < 0.5$), adding more voters guarantees the wrong answer with near certainty. Laboratory experiments in political economy, such as those by Feddersen and Pesendorfer, show that while voters can aggregate information under ideal conditions, "rational ignorance" often leads to effective competence below chance on technical policy questions where voters lack incentives to learn. Survey data on political knowledge (e.g., Delli Carpini & Keeter) consistently shows large portions of the electorate cannot identify basic institutional facts, suggesting that on many binary policy questions tied to those facts, the average competence is likely below the 0.5 threshold. This is a fatal condition: if the electorate is systematically misinformed rather than randomly uninformed, democracy becomes an error-amplification machine.

  Thirdly, the theorem assumes a "common truth" exists to be tracked, which is a category error for most political decisions. CJT applies to epistemic questions (e.g., "Did the defendant commit the crime?"), but most voting concerns normative preferences (e.g., "Should we prioritize equity over growth?"). There is no fact of the matter for the latter, so the theorem cannot apply. Even when facts are involved, voters often treat them normatively; experimental data shows that when factual information conflicts with partisan identity, voters frequently reject the fact to maintain group cohesion, effectively setting their competence to zero or negative on truth-tracking tasks. This distinguishes the epistemic view from the procedural view: the procedural defense says democracy is legitimate because it treats everyone equally regardless of truth, while the epistemic defense claims legitimacy because it finds the truth. If the truth is undefined or voters reject it, the epistemic justification evaporates.

  Regarding what this view predicts that a procedural defense does not: a consistent strong epistemic defender must logically support epistocracy (rule by the knowledgeable). If the goal is truth-tracking, and you know some voters have $p < 0.5$ or are highly correlated in their bias, the theorem implies you should exclude them to improve the outcome. Procedural democrats reject this exclusion as unjust regardless of the outcome. If you are unwilling to bite the bullet and disenfranchise the incompetent or biased, you are implicitly relying on procedural fairness, not epistemic power. Real-world elections like Brexit or the 2016 US election are often cited by critics as cases where the majority verdict was epistemically flawed; an epistemic democrat must either argue the outcome was actually correct (hard to sustain) or admit the mechanism failed, whereas a procedural democrat accepts the outcome as legitimate regardless of its factual accuracy.

  Finally, the usual fixes offered by proponents often render the theorem tautological and risk-free, which undermines its explanatory power. To save CJT, advocates argue that deliberation restores independence or that competence should be defined as "voting for the common good" rather than "knowing the facts." If you define competence as voting for the outcome that *would* be chosen by fully informed deliberators, the theorem simply asserts that democracy works if voters act as if they are fully informed. This makes the theory unfalsifiable: if the vote goes wrong, you claim voters weren't truly competent or independent, rather than admitting the theorem failed. Lab experiments on deliberation show mixed results; while discussion can improve information sharing, it often increases polarization and correlation, further violating the independence requirement. Consequently, the strong epistemic bonus you are defending exists only in a vacuum of idealized assumptions that vanish upon contact with human psychology and social structure.
