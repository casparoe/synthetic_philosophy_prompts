          1.  Concepts = directions in activation space.
          2.  Neuron firing = representing that concept (like grandmother cells).
          3.  Superposition explains why single neurons look messy (features packed at angles).
          4.  Sparse Autoencoders (SAEs) unpack these into clean features.
          5.  Steering demos (amplifying a feature changes output) prove causal reality.
          6.  Conclusion: Skeptics refuted, concepts are real.
      *   **User's Stance:** Skeptical. Worried about projection. Paused by steering demos.
