answer: |-
  Dear Selection Committee,

  The core question of this project is whether ambiguity aversion in decision-making stems from a dislike of unknown probabilities per se or from a suspected adversarial agency behind those unknowns. In the classic Ellsberg setup, participants prefer a known urn to an unknown one, typically interpreted as an aversion to missing probability information. I propose that this effect is largely driven by the intuition that an unknown composition implies a human chooser optimizing against the participant. To test this, I will vary the source of the ambiguity across three conditions: a randomizing device fixed before the task, an adversarial agent paid if the participant loses, and a neutral agent with no stake. I will also manipulate whether the urns are presented jointly or separately to test if evaluation mode interacts with suspected agency.

  This experiment is a superior use of an eight-week placement compared to simply replicating the classic result on teenagers or arguing the point theoretically. Replication would confirm a known phenomenon without advancing our understanding of the mechanism, and armchair argumentation cannot resolve whether people react to uncertainty or to distrust. Only an experimental manipulation of the source of uncertainty can disentangle these explanations. If the standard missing-probability account is correct, all three ambiguous urns should be valued equally lower than the known urn. If my agency hypothesis is correct, aversion should track the incentive structure of the filler, with the adversarial condition showing the highest aversion and the random device showing the lowest, potentially matching the known urn.

  Over the first two weeks, I will finalize the experimental design and program the task in online survey software, ensuring the instructions clearly communicate the filler conditions. Weeks three and four will be dedicated to piloting the study on a small sample to verify that participants understand the incentives and perceive the random device as non-agentic. Weeks five and six will involve collecting data from approximately three hundred online participants, randomized across the conditions. The final two weeks will be reserved for statistical analysis and drafting the report. I anticipate a gradient in ambiguity aversion, where the adversarial urn is valued least, the neutral urn in the middle, and the random urn closest to the known urn.

  The single finding that would most damage my hypothesis is if the random device condition elicits the same strong aversion as the adversarial condition. This would suggest that the presence of unknown probabilities is sufficient to drive the effect, regardless of agency. The project would count as a failure if the data are too noisy to distinguish between conditions or if manipulation checks reveal that participants do not believe the random device is truly non-agentic. I must be straight about the design validity: this setup can separate the two explanations, but only if the random condition successfully suppresses the intuition of agency. If participants assume the experimenter rigged the random device, the manipulation fails and the explanations remain confounded. However, with clear instructions and attention checks, this risk is manageable. This project offers a sharp test of a foundational assumption in behavioral economics within a feasible timeline, yielding a determinate answer about whether we fear the unknown or the chooser.
