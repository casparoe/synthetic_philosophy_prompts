  **Scenario**
  A security firm is testing a new access system for a one-day summit. Agents scan attendee badges at the turnstile; the system logs every attempt as either "Pass" or "Fail." The summit runs from 8 AM to 8 PM ($t$). Before $t$, every logged attempt is "Pass." The agents know these are standard summit badges but are told nothing about their encoding. They must predict the status of the first badge scanned after 8 PM. The rational prediction is "Fail," not "Pass."

  **Predicates**
  1.  **Natural ($P$):** "Valid" (extends to all badges).
  2.  **Positional ($P^*$):** "Valid-if-scanned-before-$t$, Invalid-if-scanned-after-$t$."
      *   *Indexing:* Indexed to fixed clock time $t$. This matters because the badge's function is constitutively tied to the event's schedule, not the order of observation.

  **Constraint Check**
  *   **Realistic:** Yes, standard access control. No sci-fi.
  *   **Same Extension Before $t$:** All observed badges (before 8 PM) are Valid ($P$) and Valid-if-before-$t$ ($P^*$).
  *   **Disagree After:** $P$ predicts Pass; $P^*$ predicts Fail.
  *   **Positional Wins:** A competent reasoner projects $P^*$ because "summit badge" implies temporal limitation.
  *   **No Cheap Routes:** Badges don't physically change at $t$; the validation rule does. This falls out of the setup (event security), not a hidden switch. Predicates are interdefinable ($P \equiv P^*$ given the context). Vocabulary is new (specific system), so $P$ vs. $P^*$ entrenchment is tied.
  *   **Structural Reason:** The *selection rule* for being a "summit badge" includes a temporal condition. The evidence (logs) is gathered via a system that enforces this rule.
  *   **Unreachable Before $t$:** No badge fails before 8 PM; the counter-evidence is impossible to observe early.

  **Key Feature**
  The **constitutive rule** of the object type. "Summit badge" entails "valid only during summit." The positional predicate captures the actual truth conditions of the natural predicate in this context.

  **Remove the Feature**
  If badges were "Lifetime Memberships" (no temporal rule), the constitutive link breaks. $P$ wins; projecting $P^*$ would be irrational.

  **Entrenchment Objection**
  A defender of entrenchment would argue "Valid" is still projectible because it aligns with the entrenched concept "Badge," whereas "Valid-if-before-$t$" is gerrymandered. They would claim the win isn't about $P^*$'s structure but about $P$'s alignment with background kinds.

  **Honesty Check**
  Is the "constitutive rule" just a mechanism smuggled in? It walks the line. Physically, the scanner switches logic at $t$. However, this isn't a *causal* mechanism (like pigment degrading) but a *normative* one (rules of access). The prompt allows "selection rules" and "what it takes to be observable." Here, what it takes to be *Valid* is time-indexed. This isn't sampling bias in the data collection, but sampling bias in the *definition of the property*. It satisfies the letter of your constraint (structural/setup-based) but relies on the agent knowing the kind "summit badge." If the agent treats badges as brute objects without kind-knowledge, $P$ wins. The case works only if "being a badge" is part of the evidence setup.
