      *   **The Film's Structure:** 12 jurors must agree on "Guilty" beyond a reasonable doubt. "Guilty" is a conjunction of facts (Identity, Intent, Act, etc., though legally it's often a holistic verdict). Juror 8 introduces doubt on individual elements.
