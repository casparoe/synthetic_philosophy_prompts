answer: |-
  We gather today acknowledging that translating lived experience into scientific data risks either betraying the patient or obscuring the phenomenon. Heterophenomenology proposes we treat this translation not as extraction, but as a loan incurred against the subject's own authority.

  For our clinical colleagues, this ensures the patient's voice is not dissolved into text but remains the creditor to whom our interpretations must be returned. We owe them the chance to recognize, revise, or refuse the narrative we construct from their words.

  For our scientific colleagues, this obligation ensures empirical discipline, as the settlement of this debt requires public verification rather than private intuition. The data remains robust because the subject's correction functions as a necessary constraint on our theoretical models.

  Yet we must not mistake this collaboration for a window into unmediated experience, for the report itself is already an interpretation offered by the subject. We study the text of experience without claiming to possess the experience itself, respecting the limit that heterophenomenology demands.

  Our work today proceeds on the understanding that every third-person claim carries a debt payable only in second-person engagement. Let us begin by honoring that obligation in every method we propose.
