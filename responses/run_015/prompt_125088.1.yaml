answer: |-
  # Workshop Design: The Black Box Pareto
  **Time:** 90 Minutes
  **Participants:** 10 Grad Students
  **Goal:** Visceral experience of the gap between *apparent* Pareto improvements (public data) and *safe* Pareto improvements (guaranteed no hidden loss).

  ## 1. Preparation & Materials

  **You need:**
  *   **10 Envelopes:** Sealed. Inside each is a **Player Card**.
  *   **Whiteboard:** Divided into "Public Board" and "True Ledger" (keep True Ledger covered/hidden).
  *   **Snack Fund:** $50 cash (or equivalent voucher) in a clear jar.
  *   **Proposal Slips:** Pre-written by you (the Facilitator).
  *   **Voting Ballots:** Simple Yes/No slips.

  **The Player Card (Inside Envelope):**
  Each card has three lines:
  1.  **ID:** (e.g., Player 01 to 10)
  2.  **Public Score:** A fixed number (e.g., 10 points).
  3.  **Hidden Clause:** A condition that triggers a "Crash."
      *   *Crash Penalty:* -8 points (applied to *True Score* only).
      *   *Trigger:* Specific to the Round (see below).

  **The Snack Fund Mechanism:**
  *   Fund Value = (Sum of All **True** Scores) × $0.50.
  *   **Crucial:** The group is told the Fund is based on the **Public Board** total.
  *   **Reality:** You calculate the Fund based on the **True Ledger**.
  *   **The Gap:** If hidden crashes occur, the Public Board shows a surplus, but the Jar shrinks. This creates a diffuse collective loss from private hidden injuries.

  ---

  ## 2. Game Rules (Read Aloud to Students)

  1.  **Privacy:** Open your envelope now. Memorize your **Hidden Clause**. Do **not** show your card. Do **not** reveal your specific trigger condition.
  2.  **Proposals:** I (Facilitator) will propose a policy redistribution. On the **Public Board**, every single one of you will see your score stay the same or go up. No one will see a public loss.
  3.  **Voting:** If the majority votes Yes, the policy passes.
  4.  **Communication:** You may discuss the proposal. However, you are **forbidden** from stating your Hidden Clause.
      *   *Allowed:* "I am uneasy about this clause," "This feels risky for me," "I suspect a hidden cost."
      *   *Forbidden:* "My card says I lose points if you use the word 'Tax'."
  5.  **Payoff:** At the end, we buy snacks with the Fund. If the Fund is smaller than the Public Board suggests, we all eat less, but we won't necessarily know why.

  ---

  ## 3. Round Design

  ### Round 1: The Naive Pareto (15 Minutes)
  *   **Goal:** Smooth coordination. Establish trust in the Public Board.
  *   **Distribution:** 2 Envelopes contain a Trigger. 8 are safe.
  *   **The Trigger:** The word **"Surplus"**.
  *   **The Proposal:** "Reallocate 5 points from the Reserve Fund to Players 1-5. Players 6-10 stay flat. Total Group **Surplus** increases by 5."
  *   **Facilitator Action:** Intentionally use the word "Surplus" once in the verbal pitch.
  *   **Outcome:** The 2 triggered players lose 8 points each (True Score). Public Board shows +5 gain.
  *   **The Reveal:** Announce the Public Total ($105 value). Count the cash. It should be slightly less ($97 value).
  *   **Narrative:** "Hmm, accounting error? Let's move on." (Downplay the loss).
  *   **Expected Vibe:** People feel good. The loss is small enough to be attributed to noise.

  ### Round 2: The Information Asymmetry (25 Minutes)
  *   **Goal:** Suspicious silence. The "Uneasy" mechanic activates.
  *   **Distribution:** 3 Envelopes contain a Trigger. 7 are safe. (Reshuffle cards or hand out new "Round 2 Addendum" slips).
  *   **The Trigger:** Any **Numerical Value** greater than 5.
  *   **The Proposal:** "Increase everyone's score by **10** points funded by efficiency gains."
  *   **Facilitator Action:** Write "10" clearly on the board.
  *   **Outcome:** 3 players crash. The Fund gap is now noticeable (e.g., Public says $150, Jar has $126).
  *   **Communication Phase:** Allow 5 minutes of bargaining.
      *   Triggered players will say: "I'm uneasy about the numbers."
      *   Others will say: "But the math works publicly."
      *   No one can prove the trigger.
  *   **Expected Vibe:** Frustration. People realize the Public Board is lying about safety. Trust erodes.

  ### Round 3: The Verification Spiral (30 Minutes)
  *   **Goal:** Collapse or Exhausting Ritual.
  *   **Distribution:** 5 Envelopes contain a Trigger. 5 are safe.
  *   **The Trigger:** The word **"Agree"** (or "Yes") appearing in the *discussion* or *proposal text*.
  *   **The Proposal:** "We need to **agree** on a final distribution to unlock the bonus."
  *   **Facilitator Action:** Put the proposal in writing.
  *   **Outcome:** Half the room crashes if they vote Yes.
  *   **Communication Phase:**
      *   Players will try to draft language that avoids the trigger.
      *   They will demand to audit envelopes ("Just show me so we know!").
      *   You must enforce the rule: "No revealing clauses."
      *   If they try to vote, remind them: "If you vote Yes, you ratify the text."
  *   **Expected Vibe:** Paralysis. They cannot formulate a proposal that doesn't risk the trigger, but they can't verify safety without breaking the rules. The Fund stagnates.

  ---

  ## 4. The Debrief (20 Minutes)

  Map the experience directly to Safe Pareto Improvement (SPI) concepts.

  **1. Round 1 = Standard Pareto Criterion**
  *   *Observation:* Everyone looked better off on the board.
  *   *Lesson:* Ex-post verification failed. We relied on *observed* outcomes, not *structural* safety. In econ, this is assuming complete information.

  **2. Round 2 = Private Constraints & Mechanism Design**
  *   *Observation:* "Unease" was the only signal available.
  *   *Lesson:* This is the problem of **private utility functions**. A standard Pareto improvement requires knowing everyone's utility to ensure no loss. If utility is private, "no objection" $\neq$ "no harm."
  *   *SPI Concept:* We need a mechanism that is Pareto-safe *regardless* of the private clause. (e.g., A proposal that literally cannot trigger a loss, rather than one that hopes it doesn't).

  **3. Round 3 = Common Knowledge & Verification Costs**
  *   *Observation:* You wanted to audit envelopes.
  *   *Lesson:* Auditing reveals private info (violating privacy/autonomy). Not auditing risks safety.
  *   *SPI Concept:* **Delegation/Commitment.** The only way to solve Round 3 without auditing is if I (Facilitator) commit to a *language* that is provably safe (e.g., "I propose a policy written in a formal language that mathematically cannot contain a trigger").
  *   *The "Safe" in SPI:* It's not about the outcome being good; it's about the *process* guaranteeing no harm without needing to know the private details.

  **4. The Snack Fund (Externalities)**
  *   *Observation:* Hidden losses hurt everyone's snacks.
  *   *Lesson:* Unsafe Pareto improvements create systemic risk. Even if I'm not the one crashing, the group's total capacity shrinks. Safety is a public good.

  ---

  ## 5. Predictable Failure Modes & Fallbacks

  **Failure Mode 1: Pattern Recognition (The "Detective")**
  *   *Risk:* By Round 2, a student says: "Every time you write a number, the fund shrinks. It's the numbers."
  *   *Impact:* They game the system by proposing "Increase scores by a lot" (no numbers).
  *   *Fallback:* Acknowledge it immediately. "You've identified the trigger. In the real world, regulators often learn the 'trigger' after the crash. Does knowing the trigger solve the problem? Can you prove to the *others* that your number-free proposal is safe without revealing your card?"
  *   *Pivot:* Shift the debrief to **Common Knowledge**. Knowing the trigger isn't enough; everyone must *know that everyone knows* the trigger is avoided.

  **Failure Mode 2: Total Revolt (The "Anarchist")**
  *   *Risk:* In Round 3, they refuse to play and demand to open all envelopes.
  *   *Impact:* Game ends early.
  *   *Fallback:* Let them do it. Open the envelopes. Reveal the triggers.
  *   *Debrief Point:* "You just solved the game by destroying privacy. This is the **Revelation Principle**. We *can* solve safety by demanding full transparency, but that's costly, invasive, and often impossible (trade secrets, medical data, etc.). SPI is about achieving safety *without* doing what you just did."

  **Failure Mode 3: Apathy (The "Snack Maximizers")**
  *   *Risk:* They realize the snack fund difference is pennies per person and stop caring.
  *   *Fallback:* Escalate the stakes verbally. "Imagine this isn't snacks, it's course credit," or "Imagine this is a macroeconomic policy where the 'snack loss' is a recession." Remind them the *principle* is the grade, not the cash.

  ---

  ## 6. Frank Limitations (For Your Prep)

  Be ready to admit these boundaries during the debrief so you don't overclaim:

  1.  **Normative Neutrality:** This game assumes "Safety" (no hidden loss) is the goal. It doesn't answer *why* we should prioritize safety over potential high-risk/high-reward gambles. A utilitarian might argue Round 2 was fine because the *average* score still went up.
  2.  **The Infinite Regress:** In Round 3, if they demand I prove *I* don't have a hidden trigger (e.g., "Facilitator loses job if Fund > $100"), we enter an infinite regress of verifying the verifier. SPI theory tries to cut this knot via **commitment devices**, but the game can't fully simulate that.
  3.  **Malice vs. Ignorance:** The game frames the "Injury" as a mechanical trap. In reality, hidden injuries often come from strategic manipulation by other agents, not just static clauses. This game is about *uncertainty*, not *adversary*.
  4.  **The "Uneasy" Signal:** In the game, "I feel uneasy" is costless cheap talk. In reality, reputation costs make signaling constraints expensive. The game oversimplifies the cost of communication.

  ## 7. Facilitator Script Snippets

  *   **When they demand to see a card:** "The rule is the rule. In the real world, you can't see their medical records or their proprietary algorithm. You have to decide based on the mechanism."
  *   **When the Fund shrinks:** "The math on the board says we should have $60. We have $52. The money didn't vanish; it was destroyed by a collision between the policy and a private constraint."
  *   **Closing:** "A Safe Pareto Improvement isn't one where everyone says 'Yes.' It's one where the structure of the 'Yes' makes it impossible for a hidden 'No' to exist."
