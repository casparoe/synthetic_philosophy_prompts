      *   **Topic:** Pareto Improvements (specifically, the distinction between "nobody objects" vs. "safe" Pareto improvements).
      *   **Core Mechanic:** Private envelopes with base scores + hidden reservation clauses (injuries). Public proposals look Pareto-superior (scores flat/up), but hidden triggers crash true scores.
      *   **Structure:** Three rounds of voting.
          *   Round 1: Smooth coordination.
          *   Round 2: Suspicious silence.
          *   Round 3: Collapse or exhausting verification ritual.
      *   **Incentives:** Shared snack fund scaled to group total (private losses hurt everyone slightly, creating a public good problem mixed with hidden information).
      *   **Communication:** Can talk/bargain, cannot open envelopes/reveal clauses directly, can only express "unease."
      *   **Debrief:** Map rounds to formal SPI concepts (public verifiability, common knowledge, robustness).
      *   **Constraints:** Be frank about limitations (normative questions, infinite regress). Predict failure modes (pattern recognition, trust killing) and provide fallbacks.
      *   **Tone:** Practical, instructional, frank, no citations needed.

  2.  **Deconstruct the "Safe Pareto Improvement" (SPI) Concept:**
      *   *Standard Pareto:* Everyone is at least as well off, someone is better off.
      *   *Problem:* Information asymmetry. I might agree because I *think* I'm better off, but I'm wrong about the consequences.
      *   *Safe Pareto:* We need assurance that the improvement holds *regardless* of hidden private information, or that the mechanism itself guarantees safety without needing to reveal private info.
      *   *The Game's Metaphor:* The "hidden injury" represents unknown consequences or private constraints that aren't captured by the public metric. The "public board" represents the observed outcome. The "envelope" represents private utility functions/constraints.

  3.  **Drafting the Game Mechanics:**

      *   **Players:** 10 Grad Students.
      *   **Rounds:** 3.
      *   **Envelopes:** Need to contain:
          1.  ID Number (anonymous but consistent).
          2.  Base Score (visible).
          3.  Hidden Clause (The "Mine").
      *   **Proposals:** Need to be written by the facilitator (or a rotating proposer, but facilitator is safer for control). Let's make the Facilitator the "Policy Maker" proposing redistributions.
      *   **The Trigger:** How does the injury happen?
          *   *Idea:* Specific numbers or words in the proposal text.
          *   *Refinement:* To make Round 1 smooth, the triggers should be obscure. To make Round 2 suspicious, the triggers should feel potentially reachable. To make Round 3 chaotic, the triggers should seem everywhere.
          *   *Better Mechanic:* The "Injury" is triggered if the *vote passes* AND a specific condition in the envelope is met by the proposal.
          *   *Simplification for Flow:* Let's make the "Injury" a fixed penalty that applies to specific Envelope IDs *if* a specific keyword is in the proposal.
          *   *Wait, the prompt says:* "if the proposal hits a specific keyword or number."
          *   *Let's assign:* 2 envelopes per round have a "Trigger Word" or "Trigger Number." If the proposal contains it, their *true* score drops by 50%, though the *public* board shows the gain.
      *   **Payoff:** Snack Fund. Total True Score = $X for snacks. If True Score < Public Score, fund shrinks.

      *   **Round Design:**
          *   *Round 1 (Trust):* Triggers are absurdly specific or unlikely (e.g., "The word 'Equity' written in all caps"). Proposal avoids them easily. Everyone votes Yes. Snack fund grows.
          *   *Round 2 (Doubt):* Triggers are common economic terms (e.g., "Efficiency", "Redistribution"). Proposal *must* use some language to make sense. Two people get hit. They can't say why. Fund shrinks slightly.
          *   *Round 3 (Paranoia):* Triggers are numbers that appear in the calculation (e.g., "The number 5" or "10"). Or, the Facilitator admits they don't know the triggers either (simulating radical uncertainty). *Correction:* To ensure the *feeling* of SPI failure, the Facilitator should know, but the players shouldn't. Let's make the triggers in Round 3 depend on the *vote count* or something uncontrollable, OR simply make the triggers so common that avoiding them makes the proposal meaningless. Let's go with "Common Words."

      *   **Communication Constraint:** "I feel uneasy." This is crucial. It mimics "I have private information that this violates my constraints" without revealing the constraint.

  4.  **Developing the Materials:**
      *   Envelopes (10).
      *   Public Board (Whiteboard).
      *   Proposal Sheets.
      *   Scorecards (Private).
      *   Snack Fund Calculator.

  5.  **Refining the "Injury" Mechanism:**
      *   If I just tell them "You lost points," they might demand to see the envelope.
      *   *Crucial Detail:* The prompt says "nobody can point to the exact mechanism."
      *   *Implementation:* After the vote, the Facilitator calculates the *True Total* privately. The Public Board shows the *Expected Total*. The Snack Fund is based on the *True Total*.
      *   *Feedback:* Tell the group: "The fund is smaller than expected. Someone took a hidden hit." Do not say who.
      *   *Private Feedback:* The injured players look at their envelope, see the trigger was hit, and mark their score down. They know *they* were hurt, but others don't know *who*.

  6.  **Addressing the "Predictably Go Wrong" Section:**
      *   *Risk:* A student realizes the pattern (e.g., "Every time you say 'Tax', the fund shrinks").
      *   *Mitigation:* The Facilitator needs a script. If they guess the trigger, acknowledge it but pivot to the structural issue (verifiability).
      *   *Risk:* Total refusal to vote in Round 3.
      *   *Mitigation:* This is actually a desired outcome (collapse). But need a way to end the game if it drags. Time limit.

  7.  **Structuring the Debrief:**
      *   Round 1 = Naive Pareto (Public data looks good).
      *   Round 2 = Information Asymmetry (Private constraints exist).
      *   Round 3 = The Demand for Safety (Verification costs vs. Gains).
      *   Connect to SPI: Delegation, commitment, common knowledge.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Triggers:* If the triggers are words in the proposal, the proposer (Facilitator) can just avoid them. That makes Round 2 too easy.
      *   *Better Trigger:* The triggers are in the *Envelopes*, but they relate to the *Proposal's Impact*.
      *   *Revised Trigger:* The Envelope says: "If the proposal increases Group Total by > 10 points, I lose 20." Or "If the proposal uses the word 'Average', I lose 20."
      *   *Let's stick to the Prompt's suggestion:* "Keyword or Number."
      *   *Round 1 Trigger:* "The word 'Surplus'." (Easy to avoid).
      *   *Round 2 Trigger:* "Any number divisible by 5." (Hard to avoid in econ).
      *   *Round 3 Trigger:* "The word 'Yes' on the voting ballot." (Meta-trigger, creates paralysis). *Actually, let's keep it to proposal content.* Round 3 Trigger: "Any proper noun." (Makes specific policy impossible).
      *   *Wait, simpler:* The Facilitator holds the "Trigger Key" for each round. The Envelopes tell the student *what their trigger is*.
      *   *Distribution:*
          *   Round 1: 2 students have triggers. Trigger: "Word 'Radical'". Proposal won't use it.
          *   Round 2: 2 students have triggers. Trigger: "Word 'Change'". Proposal needs to describe change.
          *   Round 3: 4 students have triggers. Trigger: "Any numerical value". Proposal needs numbers to be precise.

      *   *Wait, one more constraint:* "They can't open envelopes."
      *   *Correction:* They must open envelopes to see their base score and clause at the start. They can't open them *during* negotiation to prove anything.
      *   *Okay, clarification:* "Start of workshop: Open Envelope. Memorize Clause. Do not show."

  9.  **Finalizing the Plan:**
      *   **Title:** The Black Box Pareto.
      *   **Time:** 90 mins (15 intro, 45 game, 30 debrief).
      *   **Materials:** 10 Envelopes, Whiteboard, Snack Cash.
      *   **Rules:** Clear constraints on speech ("I am uneasy").
      *   **Debrief:** Mapping to SPI literature (Hadfield-Menell et al. concepts without citing).

  10. **Review against constraints:**
      *   10 grad students? Yes.
      *   90 mins? Yes.
      *   3 Rounds (Smooth, Suspicious, Collapse)? Yes.
      *   Snack fund incentive? Yes.
      *   Frank about limitations? Yes.
      *   Fallback for gaming? Yes.

  11. **Writing the Response:** (Focusing on clear instructions for the facilitator). *Self-Correction during drafting:* Make sure the "Injury" isn't just "You lose points." It needs to be "The Group Fund loses value." This aligns individual hidden pain with collective loss, mimicking the idea that unsafe Pareto improvements can undermine the system's stability even if the aggregate looks okay.

      *   *Refining the "Injury":* If my score crashes, the *Total True Score* drops. The Snack Fund is based on *Total True Score*. The Public Board shows *Total Public Score*.
      *   *The Reveal:* After Round 2 and 3, announce: "Public Total was X. True Total was Y. We have $Z for snacks." The gap is the evidence of hidden injury.

      *   *Fallback:* If they figure out the trigger word, change the rule mid-game (simulating shifting regulatory landscapes) or acknowledge it as "leakage" and move to debrief early.

      *   *Debrief:* Ensure the distinction between *Ex-ante* Pareto (expected value) and *Ex-post* Pareto (realized value) and *Safe* Pareto (guaranteed).

      *(Self-Correction on "Safe Pareto Improvement" definition)*: In the literature (e.g., Hadfield-Menell, Levy, etc.), SPI is often about delegating to a sub-agent or committing to a strategy that is *guaranteed* to be Pareto relative to the default, without needing to know the other's utility function. The game simulates the *lack* of safety due to hidden constraints. The debrief needs to pivot from "Don't hide info" to "Design mechanisms that don't require revealing info to be safe."

