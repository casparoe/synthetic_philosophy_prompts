      *   *Claim 3: Coins are literally sterile / plow having babies.*
          *   **Verdict:** Mixed. It's a metaphor for the *function* of money, but Aristotle treats the violation of this function as "unnatural." He doesn't think coins are biological organisms, but he argues interest makes money do something it wasn't designed to do. The "plow" analogy is a good illustration of the *unnaturalness*, not necessarily a biological claim.
      *   *Claim 4: Hated all markets / ban buying and selling.*
