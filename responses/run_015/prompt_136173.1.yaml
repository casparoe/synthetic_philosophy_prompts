  2.  **Recall/Verify Aristotle's *Politics* Book 1 (Chapters 8-10):**
      *   *Oikonomia* (Household Management) vs. *Chrematistike* (Wealth-Getting).
      *   Natural Acquisition: Getting what is needed for the household/community (subsistence). Includes farming, hunting, etc. Limited by need.
      *   Unnatural Acquisition (*Chrematistike*): Accumulation of wealth for its own sake. Unlimited.
      *   Role of Money: Invented for exchange to overcome the inconvenience of barter. It represents demand.
      *   Usury (Interest): The most hated form of wealth-getting. Money begetting money. "Breeding" money.
      *   Trade: Retail trade (*kapelike*) is criticized but not necessarily banned outright in the ideal state, though it's seen as degrading if done for unlimited profit. He distinguishes between necessary exchange and profit-seeking exchange.
      *   Metaphor vs. Literal: The "breeding" of money is a metaphor for interest, but Aristotle treats it as a violation of the *telos* (purpose) of money. He doesn't think coins are biologically alive, but he argues that making them reproduce is contrary to nature.
      *   Markets: He doesn't want to ban *all* exchange. The polis needs exchange. He objects to the *endless accumulation* and the transformation of exchange from a means to an end.

  3.  **Evaluate the Roommate's Claims:**

