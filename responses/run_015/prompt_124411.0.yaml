prompt: |-
  I've been reading rationalist blogs and forums for something like fifteen years, and for the last four I've convened a small, semi-anonymous discussion group — eight or nine of us, mostly engineers, two physicians, one game designer — that meets monthly to take apart a single live disagreement rather than to work through a syllabus. Last month's got away from us and I want to hand it to you in a more precise form than we managed. We have a standing norm that everyone reads the host's paper and sends written comments before the meeting. One member, R., didn't comment on M.'s paper. M. — who has, by common consent, the worst commenting record in the group — sent a long message to the group chat about it. R. replied that M. of all people had no standing to say it. M. replied that this was textbook tu quoque and that her own record has no bearing on whether R. breached the norm. A third member, S., said the tu quoque framing was the category error and that R. was closer to right: standing is a legal notion, locus standi, and the whole point of standing doctrine is that a party can be right on the merits and still not be the party entitled to press the claim in that forum, because standing isn't about what the defendant did but about who may invoke the tribunal's power. A fourth member said the courtroom was simply the wrong source domain: blame is not an institutional act, there is no judge to dismiss the suit, and talk of standing is just a polite dialect for telling someone to shut up. Halfway through the evening we also noticed something that seemed to cut against R.: on the legal test M. is the injured party, and the injured party normally has the best standing of anyone in the room, which is not at all the conclusion R. wanted. R. then amended his case by appeal to the clean-hands maxim instead, so that what is withheld from M. is not the hearing but the remedy.

  What I want from you is an audit of the analogy rather than a verdict on the etiquette, and I'd rather you argued it than pointed me at a literature — we have no library access and I don't want a reading list. Please do the courtroom mapping explicitly, as a table: who is the plaintiff, the defendant, the tribunal, the injury, the remedy, the motion to dismiss, the appeal; and then, for R.'s amended version, what clean hands maps onto and whether the thing being denied is the claim, the remedy, the hearing, or the uptake. Then tell me which features of a court the analogy quietly imports into ordinary blame that blame doesn't have — a third party with authority to rule on standing, a binary rather than graded entitlement, a scarce institutional good being allocated, blame as something done to a defendant rather than said to an addressee or overheard by an audience — and sort the disanalogies into the ones that matter for the work R. wants the analogy to do and the ones that don't. I especially want to know whether the conclusion R. is using it for (that he may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading) survives once the disanalogies are on the table, or whether the analogy was doing all the work and collapses into either you may not raise this or merely I don't have to listen to you from her.

  Two more things, if you'll indulge them. First, one member proposed swapping the courtroom for the Austin-style speech-act picture: hypocritical blame is not false but infelicitous, a misfire or an abuse rather than an error — a void utterance, like a sentence pronounced by someone with no authority to pronounce it — so that the hypocrite's criticism says something true while failing to come off. Give me that mapping too, and tell me whether it carries R.'s conclusion any better than the legal one does, or whether it just relocates the same problem: if there is no institution, there is no one with the standing to declare the utterance void, and hearers will update on its content anyway. Second, mostly to be contrary, I floated a different model and I'd like it stress-tested rather than indulged: treat standing as a budget rather than a jurisdiction. Blaming draws on a store built up by compliance with the norm in question; the hypocrite is not disqualified but overdrawn, so the criticism still transmits its content while costing her credibility she has already spent, and further blame bounces. On that model, does it follow that reformed offenders regain standing disproportionately, that a bystander who never faced the temptation has infinite standing, that blaming the absent or the dead is costless, and that the debt is discharged by reform or by accepting blame oneself? And does it license an institution one of us half-seriously proposed — a blame escrow, where you file the criticism now and it is released to its target once you have fixed your own instance? Finally, tell me what a hypocritical criticism actually asserts: whether alongside you did wrong it carries a comparative claim about the speaker's own position that makes it self-undermining rather than merely ill-mannered, and what a rational target should do with it — whether the critic's hypocrisy is evidence about the norm's stringency, evidence about the critic's reliability, or noise, and whether the familiar observation that the people keenest to enforce a norm are often the ones who struggle with it should change the answer. If there is a better analogy than any of the three on the table, I'd like to hear it, with the correspondences stated.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Context:** A long-standing rationalist discussion group (8-9 members, engineers, physicians, game designer). They discuss live disagreements, not syllabi.
      *   **The Incident:** Member R. didn't comment on Member M.'s paper (breach of norm). M. (worst commenting record) criticized R. R. retorted M. has no standing. M. called it *tu quoque*. S. argued "standing" is a legal concept (*locus standi*), not *tu quoque*. Another member argued courts are the wrong domain (blame isn't institutional).
      *   **The Twist:** Mid-discussion, they realized legally M. (injured party) *has* standing. R. switched to "clean hands" maxim (withholding remedy, not hearing).
      *   **The Task:**
          1.  Audit the courtroom analogy (explicit table mapping).
          2.  Analyze R.'s amended "clean hands" version (what maps to what, what is denied).
          3.  Identify features of courts imported into blame that don't belong (third-party authority, binary entitlement, scarce good, blame as done *to* vs. said *to*).
          4.  Sort disanalogies into "matters for R's goal" vs. "doesn't matter."
          5.  Evaluate if R's conclusion (can ignore criticism by pointing at critic) survives the audit.
          6.  Analyze the Austin-style speech-act picture (mapping, does it help R? problem of no institution/void utterance).
          7.  Stress-test the "Standing as Budget" model (regained standing, bystanders, absent/dead, debt discharge, blame escrow).
          8.  Analyze what hypocritical criticism *asserts* (comparative claim? self-undermining?).
          9.  Advise a rational target on how to process it (evidence of stringency, reliability, or noise? strugglers enforcing norms).
          10. Propose a better analogy if one exists.
      *   **Constraints:** No reading lists, no library access. Argue it, don't just cite. Explicit tables. Precise, rationalist tone.

  2.  **Deconstruct the Courtroom Analogy (Table 1):**

      *   *Plaintiff:* M. (The accuser/critic).
      *   *Defendant:* R. (The accused/norm-breaker).
      *   *Tribunal:* The Group (Collective judgment/updake).
      *   *Injury:* Breach of group norm (failure to read/comment), causing wasted time/frustration for M.
      *   *Remedy:* Social sanction, admission of fault, behavioral change, or perhaps just the validation of the blame.
      *   *Motion to Dismiss:* R.'s claim that M. lacks standing.
      *   *Appeal:* R.'s shift to "Clean Hands" (equitable doctrine).
      *   *Clean Hands Mapping:* M.'s own history of norm violation.
      *   *What is Denied:* R. shifts from "Hearing" (you can't speak) to "Remedy" (you can speak, but we won't grant your sanction).

  3.  **Analyze Disanalogies (Court vs. Blame):**

      *   *Authority:* Courts have state power; groups have social consensus.
      *   *Standing:* Legal standing requires injury + causation + redressability. Social standing is reputational.
      *   *Binary vs. Graded:* Courts rule standing exists or not. Social uptake is gradient (ignore, weigh lightly, weigh heavily).
      *   *Third Party:* Courts have judges. Groups are peers.
      *   *Blame Direction:* Legal judgment is *on* defendant. Blame is communication *to* defendant/audience.
      *   *Matter for R:* The lack of a neutral arbiter matters most. R is acting as judge in his own case regarding M's standing. The "binary entitlement" matters because R wants a hard "no," but social reality is "less weight."
      *   *Survival of Conclusion:* R's conclusion (I can ignore this) collapses. In court, if you lack standing, the case is thrown out *by the judge*. In the group, R must convince the *group* to ignore M. R cannot unilaterally dismiss.

  4.  **Analyze the Austin/Speech-Act Analogy:**

      *   *Mapping:* Utterance = Blame. Felicity Conditions = Normative Authority/Clean Hands. Misfire = Hypocritical Blame.
      *   *Does it help R?* It frames blame as a performative act that *fails* if conditions aren't met.
      *   *Problem:* Who determines felicity? In Austin, it's often conventional (priest marrying couple). In peer groups, it's interpretive. Hearers still hear the content ("You didn't read"). The "void" isn't objective.
      *   *Verdict:* It relocates the problem. It explains *why* it feels off, but doesn't grant R the right to dismiss it unilaterally.

  5.  **Stress-Test "Standing as Budget":**

      *   *Concept:* Compliance builds credit. Blaming spends credit. Hypocrites are overdrafted.
      *   *Reformed Offenders:* Do they regain standing disproportionately? Yes, "reformed sinner" often has more zeal/credibility than saint.
      *   *Bystanders:* Infinite standing? No, they lack "skin in the game." Might be seen as meddlesome.
      *   *Absent/Dead:* Costless? Yes, cheap signaling.
      *   *Debt Discharge:* Reform or accepting blame? Yes, accountability restores credit.
      *   *Blame Escrow:* File criticism, release when fixed. *Verdict:* Mechanically interesting but socially brittle. Creates transaction costs and gamification of virtue. Might work for engineering teams, less for social cohesion.
      *   *Verdict on Model:* Better than Court (dynamic, graded), but risks commodifying moral speech.

  6.  **Analyze Hypocritical Criticism (Semantics/Pragmatics):**

      *   *Assertion:* "You did wrong."
      *   *Implicature:* "I take this norm seriously / I am positioned to judge."
      *   *Self-Undermining:* The implicature is false, but the assertion might be true.
      *   *Rational Target:* Treat content as data. Treat source reliability as lowered.
      *   *Strugglers Enforcing:* Often indicates the norm is hard but valuable. High enforcement from strugglers signals high value, not necessarily hypocrisy to be dismissed.
      *   *Better Analogy:* **The Financial Audit / Conflict of Interest.**
          *   Not "You can't speak," but "Your report is flagged for bias."
          *   The data (the breach) is still valid.
          *   The analyst (M) has a conflict (own record).
          *   The audience (Group) must weigh the data independently of the analyst's credibility.

  7.  **Drafting the Response:**

      *   *Tone:* Precise, analytical, respectful of the group's rationalist background. Avoid moralizing.
      *   *Structure:* Follow the prompt's sequence strictly.
      *   *Tables:* Create clear markdown tables.
      *   *Argumentation:* Focus on the *function* of the analogy. Why did R reach for it? To silence. Why does it fail? Because there's no judge.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "R is wrong." I need to show *why* the analogy fails to support R's specific move (unilateral dismissal). I also need to ensure the "Budget" stress test answers the specific sub-questions (reformed offenders, bystanders, etc.).

      *Refining the "Better Analogy":* The prompt asks for a better analogy if one exists. The "Audit/Conflict of Interest" feels strong for engineers. Or perhaps "Signal-to-Noise Ratio." Let's go with **Signal Integrity / Noise Floor**. It fits the engineer demographic. Hypocrisy adds noise, doesn't necessarily kill the signal.

      *Refining the Austin Section:* Need to be careful with "void." Austin distinguishes misfires (void) from abuses (hollow). Hypocrisy is usually an abuse (hollow) rather than a misfire (void). The priest who doesn't believe can still marry you (felicitous), but the liar blaming lying is an abuse. This distinction matters for R.

      *Refining the Budget Section:* The "Blame Escrow" is a fun idea. I should treat it seriously. It sounds like a smart contract for social norms.

      *Final check on R's conclusion:* Does it survive? No. The analogy imports a Judge. Without a Judge, R is just a defendant claiming the prosecutor is disqualified. The jury (group) decides if they care.

  8.  **Final Polish:** Check constraints. No reading list. Argue it. Explicit table. Address all sub-questions.

      *(Mental Check of the "Clean Hands" mapping)*: In equity, clean hands denies the *remedy*, not the *right to sue*. R amended to this. So M can speak (file suit), but the Group shouldn't sanction R (grant remedy). This is a subtle but important distinction. I need to highlight that R is asking the Group to deny the remedy based on M's hands. But who decides M's hands are unclean? The Group. R can't decide it unilaterally.

      *(Mental Check of "Standing as Budget")*: If standing is a budget, does blaming the dead cost nothing? Yes. Is that a bug or feature? Feature (no retaliation), Bug (cheap shots). I need to address this.

      *(Mental Check of "What Hypocrisy Asserts")*: Does it assert "I am better than you"? Often implied. If false, is the whole statement false? No. "2+2=4" is true even if said by a liar. But "You should listen to me because I am virtuous" is the pragmatic layer that fails.

      Okay, ready to write.
answer: |-
  Here is the audit of the analogies, the stress-test of the budget model, and the semantic analysis of hypocritical blame, structured as requested.

  ### 1. The Courtroom Analogy: Explicit Mapping

  You asked for the mapping to be explicit. Below is the correspondence between the legal domain and your group's dispute, followed by the amended "Clean Hands" variant.

  | Legal Concept | Group Dispute (Original Claim) | Group Dispute (R.'s Amended Claim) |
  | :--- | :--- | :--- |
  | **Plaintiff** | M. (The accuser) | M. (The accuser) |
  | **Defendant** | R. (The accused) | R. (The accused) |
  | **Tribunal** | The Group (Collective uptake) | The Group (Collective uptake) |
  | **Injury** | Norm breach (failure to comment) | Norm breach (failure to comment) |
  | **Claim** | "R. violated the norm." | "R. violated the norm." |
  | **Motion to Dismiss** | R. claims M. lacks *locus standi*. | N/A (Claim admitted to docket) |
  | **Defense** | *Tu quoque* (rejected by S.) | *Unclean Hands* (equitable defense) |
  | **Remedy** | Social sanction / Admission of fault | Social sanction / Admission of fault |
  | **Outcome Sought** | Case thrown out (No hearing). | Case heard, Remedy denied (No sanction). |
  | **Authority** | Implicit Judge (Group consensus) | Implicit Judge (Group consensus) |

  **What is denied in the Amended Version?**
  In the original *standing* argument, R. sought to deny the **Hearing** (M. should not be allowed to speak/accuse). In the amended *clean hands* argument, R. concedes the Hearing but seeks to deny the **Remedy** (The Group should hear M. but refuse to validate the blame or sanction R.).

  **Does R.'s conclusion survive the audit?**
  No. The conclusion R. wants to draw is: *"I may properly answer the criticism by pointing at the critic, without ever addressing whether he skipped the reading."*

  In a court, a Motion to Dismiss for lack of standing or a ruling on Unclean Hands is made by the **Judge**, not the Defendant. The Defendant cannot unilaterally declare the Plaintiff disqualified. By invoking the courtroom analogy, R. implicitly acknowledges the Group as the Tribunal. Therefore, R. cannot dismiss M.; he can only *move* the Group to dismiss M.

  If R. treats himself as the Judge (unilaterally dismissing M.), he breaks the analogy (Defendant cannot be Judge). If he treats the Group as the Judge, he must address the merits of the breach to convince the Tribunal that M.'s hands are too dirty to grant a remedy. Ignoring the breach entirely assumes a unilateral authority the analogy does not grant him. The analogy collapses into *"I don't have to listen to you"* only if R. assumes he is the sole arbiter of his own liability, which removes the need for the legal metaphor entirely.

  ### 2. Disanalogies: Imported Features vs. Social Reality

  The courtroom analogy imports specific structural features that do not exist in ordinary peer blame. I have sorted these by whether they matter for the work R. wants the analogy to do (silencing the critic).

  | Feature Imported by Analogy | Social Reality of Blame | Does it Matter for R's Goal? |
  | :--- | :--- | :--- |
  | **Neutral Third-Party Arbiter** | Peers are interested parties; consensus is emergent, not ruled. | **Yes.** R. needs a Judge to rule M. out of order. Without one, R. is just a defendant shouting objections. |
  | **Binary Entitlement** | Standing is either 0 or 1. | Uptake is graded (ignore, weigh lightly, weigh heavily). | **Yes.** R. wants a hard "no." Reality offers a "discounted weight." The analogy promises a switch; reality offers a dial. |
  | **Scarce Institutional Good** | Court time is limited; frivolous suits waste resources. | Attention is scarce, but speech is not rationed by a clerk. | **No.** R. isn't saving group time by silencing M.; he is avoiding accountability. |
  | **Blame as Act *On* Defendant** | Judgment is imposed (fines, jail). | Blame is communication *to* addressee/audience. | **Yes.** R. treats blame as a sanction to be blocked, not information to be processed. |
  | **Procedural Finality** | A dismissed case is dead. | A dismissed criticism can be revived by others. | **Yes.** R. wants the issue dead. In the group, S. or others can take up M.'s point. |

  **Verdict:** The disanalogies that matter most are the **lack of a neutral arbiter** and the **graded nature of uptake**. R. wants the binary finality of a court ruling without the institutional authority to issue it. The analogy provides the *language* of dismissal but not the *mechanism*.

  ### 3. The Austin-Style Speech-Act Picture

  One member proposed shifting from Law to J.L. Austin: hypocritical blame is **infelicitous**.

  **The Mapping:**
  *   **Utterance:** "You violated the norm."
  *   **Felicity Conditions:** Speaker must adhere to the norm (or at least not be currently flagrant in violating it).
  *   **Misfire:** The utterance fails to perform the act of *blaming* (it becomes mere description).
  *   **Abuse:** The utterance performs the act but is hollow (like a priest marrying without belief).

  **Does it carry R.'s conclusion better?**
  It explains the *phenomenology* better (why M.'s criticism feels "off"), but it fails to grant R. the right to ignore it.

  1.  **The Void Problem:** In Austin's examples (e.g., "I name this ship"), if the conditions aren't met, the act *does not happen*. The ship is not named. If hypocritical blame is a "misfire," then *no blame has occurred*. R. could argue, "You haven't actually blamed me; you've only made noises."
  2.  **The Institution Problem:** Austin's felicity conditions rely on conventional procedures (marriage laws, naming ceremonies). Your group has no such convention. Who determines the utterance is void? The hearer.
  3.  **Content Transmission:** Even if the *act* of blaming misfires, the *propositional content* ("You didn't read the paper") remains true. Hearers update on the truth of the proposition regardless of the felicity of the act.

  **Verdict:** This analogy relocates the problem rather than solving it. It changes R.'s defense from "You have no standing" to "Your speech act was void." But without a convention to enforce voidness, R. still has to convince the audience to treat it as void. Furthermore, classifying hypocrisy as a *misfire* (void) is likely incorrect; it is usually an *abuse* (hollow). A hypocrite *does* blame, they just do it without authority. The audience still hears the blame. R. still cannot ignore the content.

  ### 4. Stress-Test: Standing as a Budget

  You proposed treating standing not as a jurisdiction but as a **budget** (credibility currency). Compliance builds credit; blaming spends it. Hypocrites are overdrafted.

  **Stress-Test Results:**

  *   **Do reformed offenders regain standing disproportionately?**
      *   *Model Prediction:* Yes. If standing is based on "net compliance," a reformed offender who actively pays down debt may signal higher commitment than a bystander who never faced temptation.
      *   *Reality Check:* Consistent with the "reformed sinner" effect. They often enforce norms more zealously to signal renewed status.
  *   **Does a bystander who never faced temptation have infinite standing?**
      *   *Model Prediction:* No. If standing is built by *compliance in the face of temptation*, a bystander has a low budget. They haven't spent anything, but they haven't earned much.
      *   *Reality Check:* Consistent. "Armchair critics" are often discounted compared to those doing the work.
  *   **Is blaming the absent or the dead costless?**
      *   *Model Prediction:* Yes. If there is no risk of rebuttal or social friction, the cost is near zero.
      *   *Reality Check:* Consistent. Virtue signaling against the dead is cheap. This suggests the budget model correctly identifies "risk" as a cost component.
  *   **Is debt discharged by reform or accepting blame?**
      *   *Model Prediction:* Yes. Accepting blame is a payment. Reform is a earning stream.
      *   *Reality Check:* Consistent. Accountability restores credit.
  *   **Does it license a "Blame Escrow"?**
      *   *Proposal:* File criticism now; release to target once you fix your own instance.
      *   *Analysis:* This turns norm enforcement into a **smart contract**.
      *   *Pros:* Solves the hypocrisy problem mechanically. Incentivizes self-reform before other-reform.
      *   *Cons:* High transaction cost. Gamifies virtue. Delays urgent corrections (if R. is dangerous *now*, waiting for M. to reform is risky).
      *   *Verdict:* It licenses the institution, but it may be socially brittle. It works for engineering code reviews ("I will critique your security patch once I fix mine"), less for interpersonal harm.

  **Verdict on Budget Model:** This is the most robust of the three. It captures the *graded* nature of uptake (you can speak, but you're in the red) and explains why hypocrisy reduces weight without erasing content. It does not support R.'s desire to *ignore* the criticism, only to *discount* it.

  ### 5. What Hypocritical Criticism Actually Asserts

  We need to separate the semantic content from the pragmatic implicature.

  **The Assertion:**
  1.  **Propositional:** "Agent X violated Norm N." (Truth-apt, independent of speaker).
  2.  **Pragmatic Implicature:** "I take Norm N seriously" AND "I am positioned to judge violations of N."

  **The Self-Undermining Mechanism:**
  Hypocrisy does not make the proposition false. It makes the implicature false. When M. says "You didn't read," the fact is checkable. When M. implies "I am a responsible group member," her record contradicts this.
  The criticism is not self-undermining in truth, but it is **pragmatically defective**. It requests uptake (belief/alignment) while providing evidence that the speaker is an unreliable narrator of normative importance.

  **What should a rational target do?**
  1.  **Decouple Content from Source:** Verify the breach independently. (Did R. read the paper? Check the logs).
  2.  **Update on Source Reliability:** Downweight M.'s future normative claims.
  3.  **Update on Norm Stringency:** **Crucially**, the fact that M. (a known violator) is enforcing the norm suggests the norm is **high value**. People often enforce most vigorously the norms they struggle most to keep.
      *   *Inference:* If M. is criticizing R. despite her own poor record, the cost of the breach must be high enough to warrant the social risk of hypocrisy.
      *   *Action:* Take the breach seriously, even if the critic is flawed.

  **Does the "Struggler" observation change the answer?**
  Yes. If the keenest enforcers are often those who struggle, then hypocrisy is not evidence that the norm is unimportant, nor that the criticism is void. It is evidence that the norm is **difficult and vital**. Dismissing the criticism because the speaker struggles is a *genetic fallacy* regarding the norm itself.

  ### 6. A Better Analogy: Signal Integrity / Noise Floor

  Given your group's composition (mostly engineers), the legal and speech-act analogies are less optimal than a **Signal Processing** model.

  **The Mapping:**

  | Signal Concept | Normative Dispute |
  | :--- | :--- |
  | **Signal** | The factual claim ("R. breached the norm"). |
  | **Noise** | The speaker's hypocrisy / history. |
  | **Signal-to-Noise Ratio (SNR)** | The credibility of the criticism. |
  | **Receiver** | The Group (including R.). |
  | **Filter** | Independent verification of the breach. |
  | **Attenuation** | Discounting the weight of the blame. |

  **Why this is better:**
  1.  **No Binary Cutoff:** A signal with low SNR is not *void*; it is just hard to read. You don't throw away the radio; you tune the filter.
  2.  **Receiver Responsibility:** In law, the Judge dismisses. In signal processing, the **Receiver** must filter. R. (the Defendant) is also a Receiver. He cannot claim the signal doesn't exist; he must acknowledge the noise and filter for the signal.
  3.  **Independent Verification:** Engineers know you verify the data, not just trust the sensor. R. should verify if he read the paper. If he didn't, the signal is true regardless of M.'s noise.
  4.  **No "Standing":** Sensors don't have standing; they have calibration. M. is a miscalibrated sensor. Her reading may still be accurate.

  **Conclusion for the Group:**
  R.'s move to use "standing" or "clean hands" is an attempt to install a **hardware interrupt** that stops processing the input. The reality is **software filtering**. The input (the criticism) enters the system. The system (the Group) applies a weight based on the source (M.'s record). The core data (R.'s breach) is processed independently.

  R. cannot refuse to process the input. He can only argue that the noise level is too high for the Group to act on. But since the Group can verify the breach directly (did R. send comments?), the noise is irrelevant to the truth of the breach. R.'s best move is not to attack M.'s standing, but to admit the breach and note M.'s noise as a side channel, thereby satisfying the norm while marking M.'s credibility debt.

  **Final Verdict:** The analogy R. reached for was a **jurisdictional shield** in a context that requires **epistemic hygiene**. He tried to win a motion to dismiss when he was actually facing a discovery request. The criticism stands; the critic's credibility is merely discounted.
