      *   *Wait, I need to ensure the "Third Person" failure is included.*
      *   *Idea:* Introduce a "Neuro-Recorder" role. They get the "log files." Even they can't tell.

      *   *Let's finalize the "Control Room" simulation.*
      *   *Setup:* 3 Groups.
          1.  **The World:** (The Projector/Screen).
          2.  **The Processing Plant:** (5 volunteers with index cards).
          3.  **The Conscious Audience:** (The rest of the room).
      *   *Mechanism:* The Processing Plant receives signals from The World. They pass a message to The Audience.
      *   *Regime A (Stalinesque):* Plant waits for Signal 2, then writes a script "Dot moved and changed," then hands to Audience.
      *   *Regime B (Orwellian):* Plant hands Audience "Dot 1," then "Dot 2," then slips a note "Actually, it changed mid-stream."
