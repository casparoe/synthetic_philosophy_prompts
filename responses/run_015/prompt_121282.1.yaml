answer: |-
  I watch them gather at the door,
  fast ones waiting on the left side.
  recording the value of every bit,
  into a notebook fresh and blank.
  I do not radiate any heat,
  there is no energetic cost.

  I work without a thermal cost,
  sliding the partition door.
  The gas cools down, releasing heat,
  while I organize each side.
  The paper stays mostly blank,
  holding the weight of every bit.

  I measure only one bit,
  and pay no immediate cost.
  The page is never truly blank,
  it fills up behind the door.
  Order grows on either side,
  disorder leaves as potential heat.

  I am not creating heat,
  I am just saving every bit.
  Hot here, cold on the other side,
  the balance sheet shows zero cost.
  I stand watch at the sliding door,
  writing on the shrinking blank.

  There is no such thing as blank,
  no free lunch without the heat.
  I reach the limit of the door,
  running out of space for a bit.
  The ledger demands a settling cost,
  not for the work on either side.

  I have sorted every side,
  the memory is no longer blank.
  To continue I must pay the cost,
  resetting the memory against heat.
  I cannot capture another bit,
  until I unlock the door.

  I erase the bit to make the memory blank,
  dumping the heat cost here beside the door,
  and return the disorder to this side.

  I committed to the Landauer principle interpretation where the thermodynamic cost resides entirely in erasing information rather than acquiring it, treating the blank notebook as a consumable low-entropy resource. The poem simplifies the physical implementation by assuming the demon's memory fills linearly and ignores the debate over whether measurement can be truly reversible in practice. It sticks instead to the idealized logical irreversibility of resetting the bit.
