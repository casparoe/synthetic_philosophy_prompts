  **PROSPECTUS FOR THE INAUGURAL YEAR OF THE UNIVERSAL GAZETTE**

  **To the Inhabitants of the Realm,**

  The Proprietors of *The Universal Gazette* are pleased to announce the commencement of a Daily Periodical designed not to inform, but to liberate. It is observed that the modern citizen labors under a grievous burden: the weight of being somebody in particular. To have a name, a station, and a concrete situation is to be accountable. It is to risk error. It is to stand alone. *The Universal Gazette* offers a refuge from this isolation. We propose the formation of a Public—a substantial abstraction wherein no one is anyone, and everyone is everywhere.

  **I. RELIEF FROM CHARACTER**
  Subscribers are hereby relieved of the necessity of personality. Our columns are unsigned, our editorials unauthored, and our sources unnamed. In reading us, you surrender your private judgment to the general opinion, which is safer because it belongs to no one. You join a multitude where distinct faces are blurred into a single, comfortable gaze. We promise that no reader shall be distinguished from his neighbor, nor required to justify his presence among men.

  **II. OPINION WITHOUT SITUATION**
  Why wait for experience when you may possess a view? Our readers will hold firm convictions on matters of state, morality, and commerce without ever leaving their armchairs. You need not visit the scene of the accident to judge the driver; you need not know the petitioner to decide his fate. We provide the chatter necessary to simulate engagement. You shall know everything about nothing, and thus be equipped to speak on all subjects without the risk of action.

  **III. THE BLESSING OF OBLIVION**
  Accountability requires memory. Therefore, *The Universal Gazette* guarantees that nothing printed today shall be remembered tomorrow. Our news is consumed and discarded within twenty-four hours. This is not a defect, but a feature. If a statement is forgotten, it cannot be answered for. If an opinion vanishes with the morning light, the holder remains pure. We offer the unique privilege of being wrong without consequence, provided you agree to forget you were ever right.

  **IV. PREMIUM TIER: THE SINGLE SUBSCRIBER**
  For those inexplicably burdened by a conscience, we offer a limited classification: *The Individual*. This tier is available to exactly one subscriber per edition. It contains no news, no opinions, and no chatter. It cannot be shared, quoted, or discussed. To subscribe to this tier is to accept that truth is not a possession to be circulated, but a way of being to be lived. The subscriber must enact the text in his own existence. As this requires suffering and solitude, demand is expected to be low.

  **TESTIMONIALS**
  *"I read the Gazette and felt myself dissolve into the crowd. It was restful."* — A Reader
  *"I hold strong views on countries I have never visited. I feel quite powerful."* — A Subscriber
  *"I tried the Individual tier. I had to stop. It required me to be me."* — A Former Subscriber

  **SUBSCRIPTION FORM**

  | **Term:** | One Year (Renewable in Perpetuity) |
  | :--- | :--- |
  | **Price:** | One Coin of the Realm (Per Diem) |
  | **Name:** | ___________________________________ *(Please leave blank. A name implies responsibility. To join the Public is to be no one.)* |
  | **Address:** | ___________________________________ *(Anywhere will suffice. You are already nowhere.)* |
  | **Tier:** | [ ] The Public (Default) <br> [ ] The Individual (Waitlist Only) |

  **A FINAL NOTE ON CIRCULATION**
  It may be objected that a newspaper requires a public to exist before it can be read. We clarify: *The Universal Gazette* creates its own readership. You are not a public until you read us alone in your room. It is in the silence of your private study that the crowd is summoned. By reading this prospectus, you have already joined us. You are alone now, yet you are part of the abstraction. We look forward to confirming your disappearance.

  **Published by the Anonymous Proprietors.**
  **Printed for the Nobody, by the No One.**
