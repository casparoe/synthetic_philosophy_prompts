  Dear colleague, I am writing to share the proposed line of questioning for our upcoming interview with the philosopher, focusing specifically on her refinement of Popperian historical logic regarding negative structural regularities. To begin, I plan to ask her to clarify the ontological status of these negative structural regularities, specifically whether they function as logical contradictions within institutional frameworks or as empirical generalizations derived from past collapses. If she suggests they are empirical, my follow-up will ask how we distinguish a genuine negative regularity from a mere historical coincidence that has not yet been violated, pressing her on the risk of overfitting historical data.

  Moving to the relationship with Popper's original argument, I will ask whether her introduction of negative regularities successfully escapes Popper's specific critique that extrapolating historical trends into the future is illegitimate because initial conditions always change. Since she is likely to argue that constraints are more robust than trends, my follow-up will inquire whether negative constraints are equally vulnerable to shifting initial conditions, and if so, whether she would concede that these regularities are only valid relative to a specific historical epoch rather than being universally law-like.

  In comparing her framework to other philosophical traditions, I intend to ask how she distinguishes her negative structural regularities from the claims made by evolutionary epistemology regarding cultural selection mechanisms that operate with law-like properties without being prophetic. Should she characterize her constraints as a subset of these selection pressures, I will follow up by asking if she sees a fundamental disanalogy in how cultural selection explains survival versus how her regularities explain institutional instability, ensuring we do not conflate the two distinct theoretical models.

  To ground this in a concrete scenario, I will present the repeated fiscal crises of empires that issue paper currency across different technological eras and ask whether she classifies this recurrence as a structural constraint inherent to fiat systems or merely as a non-lawful pattern contingent on human psychology. If she argues it is a structural constraint, my next question will probe whether the eventual stabilization of any such empire would falsify her claim, or if she would reinterpret the stabilization as a change in the institutional definition rather than a refutation of the law, testing the falsifiability of her position.

  Regarding the epistemic access to these regularities, I plan to ask how we falsify a negative law when the non-occurrence of an event is difficult to verify across counterfactual histories. Since we cannot observe the histories that did not happen, I will follow up by asking whether she agrees that her theory risks becoming unfalsifiable by attributing any stable instance to a change in initial conditions rather than a failure of the negative regularity, challenging the scientific status of her proposal.

  On the normative front, I will ask if historians can identify institutional combinations that are structurally unstable, does this grant them a prescriptive role in advising policymakers to avoid those combinations. If she grants this prescriptive capacity, I will follow up by asking how she reconciles it with Popper's warning against utopian social engineering, or if she views avoiding negative regularities as a form of negative utilitarianism that is epistemically safer than positive planning, probing the political implications of her work.

  Considering the role of human agency within her framework, I intend to ask whether intentional political action can circumvent a negative structural regularity, or if these constraints are binding regardless of individual will. If she maintains that agency cannot override these structures, I will ask whether this implies a form of structural determinism that contradicts the openness of the future that Popper was so keen to defend, highlighting a potential tension in her synthesis of structure and agency.

  I am also curious about the stability of the distinction between negative and positive laws, specifically whether admitting any law-like regularity, even negative ones, inevitably opens the door back to positive predictions. If we know what cannot happen, I will follow up by asking if that does not logically narrow the space of what can happen enough to constitute a weak form of positive prediction, and if so, whether her distinction is merely a matter of degree rather than kind, testing the coherence of her core innovation.

  Looking at the trans-historical scope of her theory, I will ask whether these negative regularities apply equally to feudal, industrial, and digital societies, or if they are contingent on specific modes of production. If they are contingent, I will follow up by asking if she agrees that this limits their status as philosophical laws and reclassifies them as sociological trends, which brings us back to the Popperian problem she aims to solve, ensuring we clarify the universality of her claims.

  Finally, I plan to ask what is the most pressing area of research needed to further validate the existence of these negative structural regularities, and whether she envisions this work being conducted by philosophers or by empirical historians. If she suggests historians, my follow-up will ask how she ensures they do not slip back into historicism while searching for these constraints, given that their training often emphasizes narrative causality over structural logic, closing the interview on a practical note regarding the future of this research program.
