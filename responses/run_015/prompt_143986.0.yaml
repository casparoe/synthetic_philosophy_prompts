answer: |-
  **Brainstorming Discriminating Cases**

  The literature often stalls on the "Independence Principle": should we assess the disagreement using evidence independent of the disagreement itself? For your committee, the crucial distinction is whether disagreement functions as a *defeater* (undermining your justification) or merely *counter-evidence* (adding weight to the opposite side). Furthermore, funding decisions are binary (Fund/Reject), not credal (0-100%). This breaks standard "split the difference" models, forcing us to ask whether disagreement mandates suspension of judgment or merely probabilistic hedging. Finally, we must separate disagreement as evidence about the *proposition* (the proposal is bad) versus evidence about the *subject* (I am unreliable today).

  **The Quiz**

  1. **Standard Peer:** You and an equally skilled colleague review identical data. You conclude Fund; she concludes Reject. No obvious errors.
     A. Suspend judgment/Flip coin. B. Stick with Fund. C. Re-evaluate weight of data.
  2. **Predictability:** You know beforehand you always split on this research type.
     A. Disagreement loses force (expected). B. Disagreement still mandates suspension. C. Your track record justifies sticking.
  3. **Correlated Errors:** 10 peers agree with you but share a methodological bias. 1 peer disagrees without bias.
     A. Defer to the 1 peer. B. Stick with the 10. C. Weight by independence, not number.
  4. **Peer Status:** You think she's biased; she thinks you're biased. No neutral arbiter available.
     A. Assume parity/suspend. B. Trust your assessment of her bias. C. Seek third opinion.
  5. **Binary Choice:** Must decide Fund/Reject now. No "maybe."
     A. Randomize. B. Stick with initial view. C. Fund conditional on further review.
  6. **Normative Disagreement:** You think you should conciliate; she thinks you should hold steady.
     A. Conciliate (follow her norm). B. Hold steady (follow your norm). C. Suspended on the norm too.
  7. **Reliability Defeater:** You discover you were fatigued; she was fresh.
     A. Defer to her. B. Stick if reasoning holds. C. Discount your view partially.
  8. **Evidence Type:** Is her disagreement evidence about the proposal (world) or your reliability (me)?
     A. Mostly about me (undermining). B. Mostly about proposal (counter-evidence). C. Both equally.
  9. **Group Size:** 1 peer disagrees vs 5 independent peers disagree.
     A. Defer in both cases. B. Defer only to 5. C. Weigh evidence, not heads.
  10. **Expertise:** You are expert in Method A, she in Method B. Proposal uses both.
      A. Defer on her part, hold on yours. B. Suspend on whole. C. Hold on whole.

  **Scoring Key**

  *   **Mostly A: Full Conciliationism.** Disagreement itself is a defeater requiring suspension or deference, regardless of first-order evidence. You treat the peer's belief as replacing your own.
  *   **Mostly B: Steadfastness.** First-order evidence trumps higher-order evidence of disagreement. You trust your grasp of the files over the fact of her dissent.
  *   **Mostly C: Total-Evidence View.** Disagreement is one piece of evidence weighed against reliability, predictability, and context. You adjust confidence but don't necessarily surrender.

  **Unoccupied Combinations**
  1.  *Steadfast on Facts, Conciliationist on Norms:* You hold your ground on the proposal but defer to her view on how to handle disagreement. **Why:** Pragmatically incoherent; your norm dictates your fact-handling.
  2.  *Predictable Disagreement Conciliationism:* You suspend because you disagree, but not if you knew you'd disagree. **Why:** Violates the Independence Principle; makes epistemic duty depend on surprise.

  **Limitations**
  This quiz cannot reliably distinguish **Total-Evidence View** from **Reasonable Steadfastness**. Both allow holding ground if first-order evidence is strong enough; the difference is often merely rhetorical (whether disagreement is "weighed" or "overridden"). Similarly, **Weighted Conciliationism** often collapses into Total-Evidence in practice. If you score mixed B/C, you likely occupy this overlapping space.
