prompt: |-
  Bit of a panic — I've somehow agreed to do a fifty-minute guest session next week on a second-year biology module called Concepts in Biology, and it's the first time I've taught anything on my own (I'm a first-year PhD in HPS, my supervisor volunteered me without asking). The topic is biological function: the disagreement between the etiological or selected-effect account and the causal-role account. I don't want a reading list or a lecture script; I want a plan for how to actually build the thing in the room. There'll be about thirty of them, they've done natural selection and a bit of physiology and one genomics module where people toss around the word function constantly, most are either applying to medicine or heading for ecology, and the convenor — a behavioural ecologist who thinks function just means adaptation and that philosophy is what you do when you can't get grant money — will be sitting at the back. Two or three of them have read some popular evolutionary stuff and will say, quite confidently, that a thing's function is obviously just what it was selected for. I've got a whiteboard and no slides.

  What I mainly want help with is the shape of the explanation. My instinct is that whatever comes first has to be that the two accounts were built to answer two different questions — roughly, why is this thing here at all, versus what is this part contributing such that the system containing it can do what it does — and that most of the cross-talk between the two camps and basically all of the confusion in a room like this comes from those two questions getting welded into one. But I genuinely don't know whether that belongs at the start as the frame or at the end as the payoff, and whether saying it too early just sounds like a cop-out to students who want to be told who's right. The case I'd like to hang everything on is a duplicated gene: an ancestral gene does job A, it gets duplicated, one copy carries on with A, the second copy drifts, picks up a mutation that makes it bind a new substrate, and that binding is genuinely useful to the organism right now — except the copy is still at low frequency and its presence in the population isn't explained by that benefit yet, so the etiological verdict looks like something like not yet, while the causal-role verdict looks like yes, it has a new function already. Is that the right case to carry the whole fifty minutes, or does it smuggle in too much too early? Should I open with something blunter and then complicate it? And where does the handover sort of case fit — a trait that was selected for one thing, now does a different thing, and is currently being maintained for the new thing? Give me the order the pieces have to go in and why each one depends on the one before it, not just a list of things to mention.

  Then the misconceptions, which I'm more worried about creating than about answering. I think I'll manufacture at least these: the teleology panic, where they hear selected for and decide I've smuggled purpose or designedness back into biology; the idea that the causal-role account is committed to every last thing an organ doing being one of its functions and is therefore just silly; the thought that the whole dispute is verbal and nothing is at stake; and the one I find hardest, where they conclude that on the etiological account you can't say what a newly discovered structure is doing until you know its selection history, which they'll take as a reductio when I suspect half the literature takes it as a feature. Tell me where in the sequence each of those should be headed off rather than waited for, and what I should say to the convenor's version of the point, which is that this is all obvious and functions are adaptations. Also: what should I openly refuse to settle in fifty minutes and say out loud that I'm refusing — I'm guessing the malfunction and disease stuff and anything about mental content, but I'd rather you judged. And I need one question to put to them at the end that would show me they'd got the disagreement rather than just memorised which account is which.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** First-year PhD student in History and Philosophy of Science (HPS).
      *   **Situation:** Voluntold by supervisor to teach a 50-minute guest session. First time teaching solo. Panic mode.
      *   **Audience:** 30 second-year biology students. Background: Natural selection, physiology, genomics. Future medics or ecologists.
      *   **Topic:** Biological Function (Etiological/Selected-Effect vs. Causal-Role).
      *   **Constraints:** Whiteboard only (no slides). 50 minutes.
      *   **Key Stakeholder:** The convenor (behavioural ecologist) sitting at the back, skeptical of philosophy ("function = adaptation").
      *   **Specific Needs:** Structure/shape of the explanation (order of operations), handling the "duplicated gene" case, managing misconceptions (teleology, everything is a function, verbal dispute, selection history requirement), what to explicitly leave open, and a final assessment question.
      *   **User's Instinct:** The two accounts answer different questions ("Why is it here?" vs. "What does it do now?"). Unsure when to reveal this frame.

  2.  **Deconstruct the Pedagogical Challenge:**
      *   *The Trap:* Philosophy of biology often feels like semantics to biologists. If the session feels like "defining words," they'll tune out. If it feels like "philosophers telling biologists they're wrong about adaptation," the convenor will be unhappy.
      *   *The Goal:* Show that the *conceptual distinction* has *practical consequences* for how they do biology.
      *   *The User's Instinct:* "Different questions" is the correct philosophical insight (Millikan vs. Cummins). However, revealing it *too* early kills the tension. If you say "they aren't fighting, they're just talking past each other" in minute 5, the students won't care about the fight.
      *   *The Case Study:* The duplicated gene (neofunctionalization in progress) is excellent. It creates a genuine conflict where the two accounts give different answers *right now*.

  3.  **Drafting the Structure (The "Shape"):**
      *   *Opening:* Needs to be concrete and biological, not philosophical. Get them arguing immediately.
      *   *Middle:* Develop the two intuitions separately, then collide them with the hard case.
      *   *Climax:* The "Different Questions" reveal. This resolves the tension without declaring a winner.
      *   *Closing:* Assessment question.

      *Decision on User's Instinct:* Don't start with "They answer different questions." Start with "Here is a biological puzzle where biologists disagree." Reveal the "Different Questions" frame as the *solution* to the puzzle in the last 15 minutes. This validates the conflict before dissolving it.

      *Decision on the Case:* The duplicated gene is perfect. It's specific enough for genomics students, relevant to evolution, and creates the "Not yet selected" vs. "Currently useful" tension. Don't open with it; build up to it. Open with something simpler (e.g., the heart or a vestigial trait) to establish the intuitions, then hit them with the gene.

  4.  **Addressing Misconceptions (Pre-emption Strategy):**
      *   *Teleology:* Address this immediately when defining "Selected Effect." Use "history of selection" not "purpose."
      *   *Causal-Role = Everything:* Address this when introducing Causal-Role. Use the "spleen makes noise" counter-example.
      *   *Verbal Dispute:* Address this at the end. Show how it changes research questions.
      *   *Selection History Requirement (Etiological):* This is the hardest one. Address it during the "Different Questions" reveal. It's not a bug, it's a feature for *evolutionary* explanations.
      *   *The Convenor:* Acknowledge their view as the "Standard Evolutionary View" (Etiological) but show where it hits a wall (the new gene).

  5.  **What to Leave Open:**
      *   Malfunction/Disease (too messy for 50 mins).
      *   Mental Content/Neuroscience (too speculative).
      *   Which one is "True" (emphasize utility).

  6.  **Developing the Sequence (Step-by-Step):**

      *   *0-5 mins: Hook.* The Heart. Why does it beat? (Pump blood vs. Make noise). Get them to agree pumping is the function, noise is a byproduct. *Why?*
      *   *5-15 mins: The Etiological Intuition.* Elicit the "Selected For" answer. Write it on the board. Define Selected-Effect (SE). *Pre-empt Teleology here.*
      *   *15-25 mins: The Causal-Role Intuition.* Introduce the Physiology perspective. What does it *do* now? Define Causal-Role (CR). *Pre-empt "Everything is a function" here (contribution to capacity).*
      *   *25-35 mins: The Collision (The Duplicated Gene).* Present the case. Ask: Does Copy B have a function? SE says No (not selected yet). CR says Yes (contributes to fitness now). *This is the crisis.*
      *   *35-45 mins: The Resolution (Different Questions).* Reveal the user's instinct. SE = History/Evolution. CR = Mechanism/Physiology. *Address the "Verbal Dispute" and "Selection History" misconceptions here.*
      *   *45-50 mins: Wrap & Assessment.*

  7.  **Refining the Content for the Convenor:**
      *   The convenor thinks Function = Adaptation.
      *   Strategy: Validate them. SE *is* the account of adaptation. But point out that physiology (CR) is also legitimate biology. Don't fight the convenor; expand the map.

  8.  **Final Review against Constraints:**
      *   Whiteboard only? Yes, rely on diagrams (Family tree of genes, Flowchart of system).
      *   50 mins? Timing looks tight but doable if discussion is managed.
      *   No reading list/script? Focus on the *plan*.
      *   Final Question? Needs to test understanding of the *distinction*, not definitions.

  9.  **Self-Correction/Nuance Check:**
      *   *Worry:* Is the duplicated gene too technical?
      *   *Fix:* Keep the genetics simple. Ancestral Gene A -> Duplication -> Gene A1 (Old Job) + Gene A2 (New Job, rare).
      *   *Worry:* Will students feel cheated if I don't say which is right?
      *   *Fix:* Frame it as "Which tool for which job?" Medicine needs CR, Evolution needs SE.
      *   *Worry:* Teleology panic.
      *   *Fix:* Use the phrase "Backward-looking explanation" vs. "Forward-looking purpose."

  10. **Final Polish:** Ensure the tone is supportive but authoritative (calming the panic). Structure the response clearly with headings matching the user's requests. (Proceed to generate output).

  *(Self-Correction during drafting)*: I need to make sure I explicitly tell the user *where* to head off the misconceptions in the timeline, not just list them. I also need to make sure the "Different Questions" reveal doesn't feel like a cop-out. It needs to feel like a synthesis.

  *(Refining the Final Question)*: It shouldn't be "Define SE." It should be "Here is a scenario, which account are you using and what would you research next?"

  *(Refining the Convenor interaction)*: Advise the user to make eye contact with the convenor when validating the SE account. Make the convenor feel like the "Evolutionary Biologist" in the room is being honored, not corrected.

  *(Final check on the "Different Questions" timing)*: User asked: Start or End? My advice: End. If you start with it, there's no tension. If you end with it, it's the key that unlocks the puzzle.

