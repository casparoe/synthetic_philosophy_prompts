answer: |-
  This is a classic HPS teaching trap: you know the solution (they are answering different questions), but if you give the solution away in minute five, the students will spend the next forty-five minutes wondering why anyone ever fought about it. You need to manufacture a crisis before you offer the rescue.

  Here is the shape of the fifty minutes, designed to use the whiteboard to build tension, collide the two intuitions, and then resolve them without declaring a "winner."

  ### Part 1: The Shape of the Explanation

  **0–5 mins: The Hook (The Heart)**
  Do not start with definitions. Start with a biological consensus that hides a philosophical disagreement.
  *   **Draw:** A simple heart on the board.
  *   **Ask:** "Why does the heart beat?"
  *   **Elicit:** They will say "To pump blood." Someone might joke "To make a lub-dub sound."
  *   **Press:** "Both are true causal statements. The heart *does* make noise. The heart *does* pump blood. Why is 'pumping blood' the *function* and 'making noise' a *byproduct*?"
  *   **Goal:** Establish that "what it does" (causal role) is not the same as "what it is for" (function). This creates the initial itch.

  **5–15 mins: The Etiological Account (The Historian's View)**
  *   **Build:** Elicit the answer to the Heart question. They will say "Because it was selected for pumping."
  *   **Define:** Write **Selected-Effect (SE)** on the board. Define it: *A trait's function is the effect for which it was naturally selected.*
  *   **Whiteboard:** Draw a lineage. Ancestors without pumps -> Ancestors with pumps -> Survival advantage -> Current hearts.
  *   **Pre-empt Teleology (Crucial):** As soon as you write "Selected For," a student will think "Purpose." Stop them. Say: "This is not forward-looking purpose. It is backward-looking history. It is a causal history of replication, not a goal."
  *   **Validate the Convenor:** Look at the convenor when you say this. "This is the standard evolutionary biology account. It ties function directly to adaptation." This keeps the convenor onside; you are formalizing their intuition, not attacking it.

  **15–25 mins: The Causal-Role Account (The Mechanic's View)**
  *   **Pivot:** "Now, imagine you are a physiologist or a medic. You have a patient on the table. Do you need to know the evolutionary history of the heart to fix it?"
  *   **Define:** Write **Causal-Role (CR)** on the board. Define it: *A trait's function is the causal contribution it makes to a containing system's capacity.*
  *   **Pre-empt "Everything is a Function":** Students will ask, "Does the noise count?" You say: "Only if the noise contributes to the system's capacity (e.g., diagnosing health). If the system is 'circulation,' noise is irrelevant. If the system is 'clinical diagnosis,' noise is functional." This shows CR is not 'everything is a function,' it is 'function relative to a system capacity.'
  *   **Goal:** Establish that CR is about *current utility* and *mechanism*, not history.

  **25–35 mins: The Collision (The Duplicated Gene)**
  *   **Deploy the Case:** This is the right case, but it must be the *climax*, not the opener.
  *   **Draw:** Ancestral Gene (Job A) -> Duplication Event -> Copy 1 (Job A) + Copy 2 (Drifts -> New Job B).
  *   **The Setup:** Copy 2 is currently useful (Job B helps survival), *but* it is a new mutation at low frequency. Selection hasn't fixed it yet.
  *   **The Question:** "Does Copy 2 have a function *right now*?"
  *   **The Conflict:**
      *   **SE Verdict:** No. It has not been *selected* for Job B yet. It is a hopeful monster. (This feels wrong to the medics/physiologists).
      *   **CR Verdict:** Yes. It is currently contributing to the organism's capacity to survive. (This feels wrong to the evolutionists).
  *   **Goal:** Create genuine discomfort. The "Different Questions" frame is now the only way out.

  **35–45 mins: The Resolution (Different Questions)**
  *   **Reveal:** Now you use your instinct. "The reason you are frustrated is that you are trying to answer two different questions with one word."
  *   **Whiteboard:** Draw a T-Chart.
      *   **Left (SE):** Question = "Why is this trait *here* in the population?" (Evolutionary Explanation).
      *   **Right (CR):** Question = "How does this trait *work* in the organism?" (Mechanistic Explanation).
  *   **Pre-empt "Verbal Dispute":** Students will think this is just semantics. Counter: "It changes your research. If you use SE, you look for phylogenies. If you use CR, you look for biochemical pathways. Both are biology, but they are different projects."
  *   **Pre-empt "Selection History Requirement":** Address the fear that SE makes function unknowable for new traits. "SE admits that. It says 'We cannot claim this is an adaptation yet.' That is a feature, not a bug. It stops us from telling 'Just-So Stories' about every new mutation."

  **45–50 mins: Wrap & Assessment**
  *   **What to Refuse:** Explicitly state: "We are not settling Disease/Malfunction today. That requires a norm we haven't defined. We are not settling Mental Content. That requires a theory of mind we don't have."
  *   **The Final Question:** (See below).

  ---

  ### Part 2: Managing the Misconceptions

  Here is exactly where to head off the specific errors you listed, integrated into the timeline above.

  **1. The Teleology Panic ("Selected for = Designed")**
  *   **When:** Minute 10, immediately after defining Selected-Effect.
  *   **How:** "When I say 'selected for,' I do not mean 'intended to.' I mean 'ancestors who had this survived better.' It is a backward-looking causal claim, not a forward-looking goal."
  *   **Why:** If you wait, the evolutionists will nod and the medics will tune out thinking you're talking about magic.

  **2. Causal-Role = "Everything is a Function"**
  *   **When:** Minute 20, during the Physiology pivot.
  *   **How:** Use the "Spleen" example. "The spleen filters blood. It also sits in the abdomen. Is 'sitting in the abdomen' a function? No, because it doesn't contribute to the *capacity* we are analyzing (immune/circulatory system)."
  *   **Why:** You must show CR has criteria (contribution to system capacity) or they will dismiss it as trivial.

  **3. The "Verbal Dispute" (Nothing is at stake)**
  *   **When:** Minute 40, during the Resolution.
  *   **How:** "If you think this is just words, ask yourself: If Copy 2 (the new gene) kills the patient, do you treat it as a 'malfunctioning adaptation' (SE) or a 'toxic causal role' (CR)? The label changes the medical intervention."
  *   **Why:** Biologists respect practical consequences. Show the concept drives the lab work.

  **4. The "Selection History Requirement" (SE makes new traits unknowable)**
  *   **When:** Minute 42, during the Resolution.
  *   **How:** "Yes, SE says you can't call a new mutation a 'function' until it's selected. Some of you hate that. But consider the alternative: calling every random beneficial accident a 'function' dilutes the meaning of adaptation. SE protects the rigor of evolutionary explanation."
  *   **Why:** This is the hardest pill to swallow. Frame it as "Rigor" vs. "Flexibility," not "Right" vs. "Wrong."

  **5. The Convenor's View ("Function = Adaptation")**
  *   **When:** Throughout, but specifically Minute 15 and Minute 40.
  *   **How:** Do not contradict him. Say, "The convenor is right that in *evolutionary ecology*, SE is the dominant currency. But in *physiology and medicine*, CR is the dominant currency. You are all biologists, but you are speaking different dialects."
  *   **Why:** If you tell the convenor he's wrong, you lose the room. If you tell the students the convenor is speaking "Evolutionary Dialect" and they are learning "Medical Dialect," you validate everyone.

  ---

  ### Part 3: What to Refuse to Settle

  You are correct to be wary of Malfunction and Disease. In 50 minutes, you cannot ground norms.
  *   **Say this explicitly:** "I am going to refuse to solve 'Disease' today. To define disease, we need to agree on what 'normal' is. SE says normal is 'selected history.' CR says normal is 'statistical typicality.' That is a fight for a whole semester. Today, we are just mapping the tools."
  *   **Also refuse:** "Mental Content." (e.g., Does the brain represent the world?). It drags you into cognitive science and away from biology.

  ---

  ### Part 4: The Final Assessment Question

  Do not ask them to define the terms. Ask them to choose a tool for a job. This tests if they understand the *utility* of the distinction.

  **Put this on the board in the last 3 minutes:**

  > "A surgeon finds a previously unknown nerve cluster in the human gut. It secretes a hormone that reduces anxiety.
  >
  > 1. If you want to publish in *Evolutionary Ecology*, which account of function do you need to establish to claim this is an adaptation?
  > 2. If you want to publish in *Clinical Gastroenterology*, which account allows you to propose a drug targeting it *today*?
  > 3. Why would using the answer to (2) get you rejected by the journal in (1)?"

  **Why this works:**
  *   It forces them to map SE to Ecology/History.
  *   It forces them to map CR to Medicine/Current Utility.
  *   It forces them to articulate the "Selection History" constraint (Question 3) without you having to lecture it at them.

  ### Summary of Advice for the Panic
  *   **Trust the Tension:** Do not explain the "Different Questions" frame until the students feel the pain of the Duplicated Gene case. If you explain it too early, they won't care.
  *   **Whiteboard Management:** Keep the SE/CR definitions on opposite sides of the board. Keep the Duplicated Gene in the middle. Visually show the collision.
  *   **The Convenor:** He is not your enemy; he is your example of the SE user. Use him as the archetype of the Evolutionary Biologist so the students see that account is respected, just limited.
  *   **Breathe:** You are not teaching them the truth. You are teaching them that there are two tools in the shed. You just have to show them where the handles are.

  You have the right instinct. Save the synthesis for the end. Let the conflict do the teaching. Good luck.
