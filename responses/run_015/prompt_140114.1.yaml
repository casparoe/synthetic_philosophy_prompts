answer: |-
  # Specification: Epistemic Framework for Automated Negotiation Protocols

  ## 1. Core Desiderata

  To function as an engineering specification rather than a descriptive social science model, the epistemic account must satisfy the following requirements. Each is motivated by the specific constraints of inspectable code, staggered rollouts, and partial verification.

  ### 1.1 Procedural Rationality (The Code-as-Action Requirement)
  **Requirement:** The predicate "rational" must attach to the *decision procedure* (the source code), not merely to the realized action or strategy profile.
  **Motivation:** In standard game theory, agents choose actions from a fixed set. In your setting, agents choose *algorithms* that read other algorithms. An agent is rational if its code implements a best-response function to the *logical output* of the opponent's code, not just to the statistical distribution of the opponent's moves.
  **Case:** Consider a "Cooperate if you prove the other Cooperates" program (e.g., PrudentBot). In a standard Nash framework, this looks like a conditional strategy that might be time-inconsistent or non-credible. In your setting, it is a valid, inspectable object. If the framework evaluates rationality solely on the output distribution (extensional), it cannot distinguish between a robust logical handshake and a fragile coincidence. The account must support *Program Equilibrium* or a logical decision theory where the causal link is logical implication, not just probabilistic correlation.

  ### 1.2 Awareness Sensitivity (The Staggered Rollout Requirement)
  **Requirement:** The framework must model *unawareness* of the game form, not just uncertainty about types within a fixed game form.
  **Motivation:** Standard epistemic models assume the state space $\Omega$ and the game tree $G$ are Common Knowledge (CK). Your "staggered rollout" feature means Agent A may know move $m$ exists, while Agent B's code literally lacks the syntax to represent $m$. Agent B does not assign $m$ low probability; $m$ is outside B's ontology.
  **Case:** If the framework assumes a universal state space, it will falsely attribute irrationality to Agent B for not playing $m$, or falsely attribute knowledge to Agent B about A's knowledge of $m$. The account must use a logic of *awareness* (e.g., Heifetz-Meier-Schipper or Modica-Rustichini style) where the state space itself is agent-relative. Rationality must be defined relative to the agent's *perceived* game, not the *true* game.

  ### 1.3 Epistemic Continuity (The Partial Verification Requirement)
  **Requirement:** Conclusions derived under Common Knowledge (CK) must be robust to $\epsilon$-approximations of CK (high-degree mutual belief with probability $1-\epsilon$).
  **Motivation:** You can only verify beliefs to a finite depth with probability $<1$. Standard epistemic game theory is notoriously discontinuous: a proposition true under CK may be false under $k$-th order mutual belief for any finite $k$, no matter how high the probability.
  **Case:** The *Rubinstein Email Game*. Under CK, agents coordinate on a payoff-dominant equilibrium. Under $0.99$-probability mutual belief (even at depth 100), the unique equilibrium reverts to the risk-dominant (or non-cooperative) outcome. If your verification tool certifies a protocol based on CK assumptions, but the deployment operates on $0.99$-reliable channels, the certification is worthless. The account must satisfy a *continuity condition*: as epistemic uncertainty vanishes, the predicted outcome set must converge to the CK outcome.

  ### 1.4 Constructive Selection (The Engineering Predictability Requirement)
  **Requirement:** The account must select a *unique* outcome (or a computably narrow set), not merely characterize a set of consistent outcomes.
  **Motivation:** Descriptive theory is satisfied with "any Nash Equilibrium is possible." Engineering requires "the system will output $X$." You need to verify that the protocol *forces* a specific result, not just that a result is *consistent* with rationality.
  **Case:** If the epistemic account permits multiple equilibria (e.g., Battle of the Sexes), you cannot verify the system's safety or efficiency. The framework must incorporate a refinement mechanism (e.g., risk dominance, payoff dominance, or a specific focal point derived from the code structure) that is itself epistemically justified. Crucially, it must do this *without* assuming the agents have CK of the selected outcome *ex ante* (which would be circular); the selection must emerge from the structure of the reasoning process itself.

  ### 1.5 Intensional Stability (The Refactoring Requirement)
  **Requirement:** Verdicts of rationality must be invariant under code re-implementation that preserves input-output behavior *in isolation*, unless the re-implementation alters the logical proofs available to the opponent.
  **Motivation:** Since code is inspectable, agents may reason about the *structure* of the code (intension), not just its behavior (extension). However, engineering requires modularity. You need to know if changing variable names or refactoring loops breaks the equilibrium.
  **Case:** If Agent A's code checks for a specific hash of Agent B's source to verify identity, refactoring B breaks the protocol. If A checks for a logical proof of cooperation, refactoring B might not. The framework must specify *which* properties of the code are epistemic primitives. If the framework is purely extensional, it ignores the inspectability feature. If it is purely intensional, it makes verification impossible (too fragile). The account must define a "logical interface" stability criterion.

  ### 1.6 Diagnostic Separability (The Debugging Requirement)
  **Requirement:** The account must allow the analyst to distinguish between a failure of *Rationality* (optimization failure) and a failure of *Knowledge* (belief mismatch).
  **Motivation:** When the system deviates from prediction, you need to know whether to patch the decision algorithm (rationality) or the communication/sensing layer (knowledge).
  **Case:** If an agent fails to cooperate, was it because it didn't believe the other would cooperate (Knowledge), or because it calculated the best response incorrectly (Rationality)? In many epistemic definitions (e.g., Aumann's), rationality is defined *given* knowledge. If knowledge is false, rationality is hard to assess. The framework must define rationality instrumentally (maximizing utility relative to *held* beliefs) so that belief errors can be isolated from optimization errors.

  ---

  ## 2. Classification: Forced Requirements vs. Research Preferences

  The following distinguishes constraints imposed by your engineering purpose from standard assumptions in the literature that you should feel free to discard.

  ### Forced by Purpose (Non-Negotiable)
  1.  **Procedural Rationality:** Forced by Feature 1 (Inspectable Code). Standard action-based rationality is insufficient.
  2.  **Awareness Sensitivity:** Forced by Feature 2 (Staggered Rollouts). You cannot assume a common game tree.
  3.  **Epistemic Continuity:** Forced by Feature 3 (Partial Verification). If the theory breaks at $p < 1$, it cannot be verified in real systems.
  4.  **Diagnostic Separability:** Forced by the goal of *verification*. You cannot fix bugs if you cannot categorize them.
  5.  **Constructive Selection:** Forced by the goal of *design*. A theory that predicts "anything in the core" does not specify a protocol.

  ### Research Program Preferences (Negotiable)
  1.  **Common Prior:** *Preference.* Standard in Harsanyi-type models, but unnecessary and often false in distributed systems where agents are initialized with different weights or training data. Drop this; allow heterogeneous priors.
  2.  **Factivity of Knowledge:** *Preference.* Standard epistemic logic assumes $K\phi \implies \phi$. In engineering, "knowledge" is often "justified belief" which can be false (e.g., sensor noise). Use a belief operator $B$ rather than knowledge $K$, or a non-factive knowledge operator.
  3.  **Full Introspection:** *Preference.* Standard models assume agents know what they believe ($B\phi \implies BB\phi$). Software agents might not have access to their own confidence intervals. Bounded introspection is more realistic.
  4.  **Single Probability Measure:** *Preference.* Standard Bayesianism. Given the "partial verification" constraint, *imprecise probabilities* (sets of measures) or *belief functions* may be more appropriate to represent the margin of uncertainty.
  5.  **Vindication of Nash Equilibrium:** *Preference.* Do not constrain the framework to recover Nash. Given inspectable code, Program Equilibrium or Superrationality are more relevant targets.

  ---

  ## 3. Diagnostic Duty and Impossibility Results

  ### The Diagnostic Duty
  The account owes you a **counterfactual separation**. When play contradicts prediction, the framework must support the query: *"Would the agent have played differently if its beliefs were correct, holding its decision procedure fixed?"*
  *   If **Yes**: The failure is Epistemic (Knowledge).
  *   If **No**: The failure is Procedural (Rationality).

  **Can any account discharge this?**
  Most standard epistemic game theories **cannot**. In models like Aumann's, rationality is defined as maximizing expected utility *given the partition*. If the partition is wrong, the definition of rationality becomes ambiguous relative to the "true" state. To discharge this duty, you must adopt an **Instrumentalist Definition of Rationality**: An agent is rational if it maximizes utility relative to its *subjective* belief state, regardless of the truth of that state. This allows you to audit the maximization engine independently of the belief sensor.

  ### Incompatible Desiderata
  There is a tension between **1.1 Procedural Rationality** and **1.5 Intensional Stability**.
  *   If agents reason about code structure (to enable cooperation via logical handshakes), then refactoring (changing structure without changing I/O) changes the equilibrium.
  *   If agents reason only about I/O (to ensure stability), then inspectable code offers no advantage over black-box APIs, and you lose the benefits of Feature 1.
  *   **Resolution:** You must define a *Canonical Representation* for the purpose of verification. The framework must specify which code properties are "visible" to the epistemic model (e.g., logical complexity, specific function signatures) and which are "opaque." You cannot have full intensional sensitivity and full refactoring invariance simultaneously.

  ### The "Killer" Requirement
  The single requirement that rules out the majority of candidate frameworks is **1.3 Epistemic Continuity**.
  *   **Why:** The vast majority of epistemic game theory results (including the derivation of Nash Equilibrium from CK of rationality) rely on the infinite depth of CK. As shown by Rubinstein (1989) and subsequent literature on *Approximate Common Knowledge*, the correspondence between CK outcomes and high-probability mutual belief outcomes is **empty** in many coordination games.
  *   **Impact:** Any framework based on standard S5 modal logic or standard Bayesian Common Priors will fail this requirement. It forces you toward frameworks utilizing *topological continuity* in belief spaces (e.g., Monderer & Samet, 1989) or *bounded depth* logics, which are mathematically much more complex and less developed than standard CK models.

  ---

  ## 4. Scorecard of Candidate Frameworks

  | Framework Family | Procedural Rationality | Awareness Sensitivity | Epistemic Continuity | Constructive Selection | Diagnostic Separability | Verdict |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Standard Epistemic Game Theory** (Aumann, Brandenburger) | ❌ | ❌ | ❌ | ❌ | ⚠️ | **Reject.** Fails on Code, Rollouts, and Verification. |
  | **Program Equilibrium** (Tennenholtz, Fortnow) | ✅ | ❌ | ⚠️ | ✅ | ✅ | **Partial.** Good on code, but assumes common game form and often lacks continuity analysis. |
  | **Awareness Logic** (Heifetz, Meier, Schipper) | ❌ | ✅ | ⚠️ | ❌ | ⚠️ | **Partial.** Solves rollouts, but lacks procedural depth and selection power. |
  | **Bounded Rationality / Level-k** | ⚠️ | ⚠️ | ✅ | ⚠️ | ✅ | **Strong Contender.** Naturally handles depth limits, but struggles with unique selection and code inspection. |
  | **Logical Decision Theory** (Yudkowsky, Soares) | ✅ | ❌ | ❌ | ✅ | ✅ | **Partial.** Excellent on code/logic, but lacks formal epistemic continuity and awareness handling. |
  | **Imprecise Probability / Robust Control** | ⚠️ | ⚠️ | ✅ | ⚠️ | ✅ | **Strong Contender.** Handles verification margins well, but needs integration with game structure. |

  **Recommendation:** No single existing framework satisfies all desiderata. You will likely need to hybridize **Program Equilibrium** (for Feature 1) with **Awareness Logic** (for Feature 2) and **Monderer-Samet style Common $p$-Belief** (for Feature 3). The primary research gap is establishing **Continuity** within a **Procedural** setting; this is where your engineering risk lies.
