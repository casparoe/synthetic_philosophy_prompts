prompt: |-
  I am about to use epistemic game theory as an engineering tool rather than as an object of study, and I want the specification before I commit to a framework.

  The setting: I am designing an automated negotiation protocol. A small number of software agents, each with a private type, exchange messages over a fixed protocol and then choose. I want to be able to say of some outcomes that they follow from the agents' rationality together with what the agents commonly know, and of others that they do not — and I want to know what would have to be established before such a claim is licensed. Three features of my setting are not the textbook ones:

  1. The agents' decision procedures are inspectable. In the deployments I expect, each side can read the other's code before choosing, so the object of higher-order reasoning is often a procedure rather than an action.
  2. Rollouts are staggered. Some participants run a version of the protocol in which certain moves do not exist; they do not merely assign those moves low probability, they cannot represent them at all.
  3. My verification is partial. At best I can establish that each agent has the relevant beliefs, that each believes the others do, and so on, to some finite depth and with some margin short of certainty.

  Please write the desiderata that an epistemic account of rationality and common knowledge would have to satisfy to be adequate for this purpose. For each requirement give the case or consideration behind it — the criteria and their motivations are what I want, not a list. I particularly want you to settle what the account must say about: whether rational attaches to strategies or to the procedures that produce them; what is to be done when the game form itself is not common; whether conclusions reached under common knowledge survive when it is weakened to high-degree, high-probability mutual belief (consider the alternating-move game in which a player may take the larger share now or pass and let the pot grow, and the two-generals case in which every confirmation of a message itself stands in need of confirmation); whether the account must do more than describe beliefs and actually select an outcome, and if so whether it can do that without assuming common knowledge of the outcome it selects; and whether its verdicts must be invariant under re-implementations of the agents that behave identically in isolation but differently once the procedures are mutually visible.

  Then mark which requirements are forced on me by this purpose and which are preferences of particular research programmes — a single fixed space of uncertainty shared by all agents, knowledge as factive and fully introspective, belief as a single probability measure rather than a ranking, a common prior, the vindication of some favored solution concept. I also want to know what diagnostic duty the account owes me: when play contradicts the prediction, must it tell me whether rationality or the knowledge assumption is what I should give up, and can any account discharge that duty? Flag any subset of the desiderata you think cannot be jointly satisfied, and say which single requirement does the most work in ruling candidate frameworks out. A brief scorecard at the end against the main families of account is welcome, but keep the weight on the criteria.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**

      *   **Goal:** Define desiderata for an epistemic game theory framework to be used as an *engineering tool* for designing automated negotiation protocols.
      *   **Setting:**
          *   Small number of software agents.
          *   Private types.
          *   Fixed message protocol.
          *   Outcome depends on rationality + common knowledge (CK).
      *   **Non-Textbook Features:**
          1.  *Inspectable Code:* Agents read each other's source code (procedural rationality/program equilibrium).
          2.  *Staggered Rollouts:* Game form is not common knowledge (some agents can't represent certain moves).
          3.  *Partial Verification:* Only finite-depth mutual belief with probability $< 1$ (approximate CK).
      *   **Specific Questions to Address:**
          *   Rationality: Strategies vs. Procedures?
          *   Game Form: What if not common?
          *   CK vs. High-Degree Belief: Do conclusions survive weakening? (Centipede/Two Generals).
          *   Selection: Must it select an outcome? Can it do so without assuming CK of the outcome?
          *   Invariance: Verdicts under re-implementation (extensionality vs. intensionality).
      *   **Classification:** Distinguish between *forced requirements* (by the engineering purpose) and *research program preferences* (standard assumptions like common prior, factivity, etc.).
      *   **Diagnostic Duty:** Must the account diagnose failures (Rationality vs. Knowledge)? Can it?
      *   **Impossibility/Trade-offs:** Flag incompatible desiderata. Identify the "killer" requirement.
      *   **Scorecard:** Brief evaluation of main framework families.
      *   **Tone/Style:** Specification document, rigorous, focused on criteria and motivations, not just a list.

  2.  **Analyze the Specific Questions & Constraints:**

      *   *Inspectable Code:* This points towards *Program Equilibrium* (Tennenholtz) or *Modal Logic of Knowledge/Code*. Standard Nash/Correlated Equilibrium assumes actions are chosen simultaneously/secretly. Here, $f_A(code_B)$ is the decision rule. Rationality must attach to the *algorithm*, not just the output distribution.
      *   *Staggered Rollouts:* This violates the standard assumption that the game tree $G$ is CK. If Agent A knows move $m$ exists but Agent B's code literally cannot output $m$, A's reasoning about B's rationality must account for B's *inability*, not just B's *unwillingness*. This requires a logic of *awareness* or *restricted state spaces*.
      *   *Partial Verification:* Standard CK is an infinite conjunction ($K_A K_B K_A \dots$). Engineering systems have bounded resources. We need *Approximate Common Knowledge* (Monderer/Samet) or *Bounded Rationality/Depth*. Does the Centipede paradox unravel under $\epsilon$-CK? Usually, yes, but engineering needs robustness.
      *   *Selection:* Engineering needs *predictability*. If the theory says "anything in the core is possible," it's useless for verification. We need a *refinement* that is computable.
      *   *Invariance:* If I refactor code without changing input-output behavior in isolation, but the other agent reads the code, does the equilibrium change? If yes, the theory is *intensional*. If no, it's *extensional*. Given "inspectable code," agents might look for specific logical structures (e.g., "Cooperate if you prove the other cooperates"). This suggests intensionality is a feature, not a bug, but creates fragility.
      *   *Diagnostic:* If the system fails, was it a bug (irrationality) or a network partition (knowledge failure)? The theory needs to separate the *norm* (rationality) from the *epistemic state*.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Req 1: Procedural Rationality.* Standard game theory says rational = best response to beliefs about actions. Here, rational = best response to beliefs about *code*.
      *   *Req 2: Awareness/Frame Sensitivity.* The game form isn't CK. The framework must handle "unawareness of moves."
      *   *Req 3: Robustness to Epistemic Depth.* CK is idealized. We need continuity: if beliefs are $\epsilon$-close to CK, outcomes should be $\delta$-close to CK outcomes. (Monderer/Samet).
      *   *Req 4: Constructive Selection.* The theory must output a specific prediction, not a set. Engineering needs a spec.
      *   *Req 5: Intensional Stability.* Refactoring code shouldn't break equilibrium unless it changes logical implications visible to the other agent.
      *   *Req 6: Diagnostic Separability.* Must distinguish $P(\text{Rationality Fail})$ from $P(\text{Knowledge Fail})$.

  4.  **Classifying Requirements (Forced vs. Preference):**

      *   *Forced:* Procedural attachment (due to inspectable code), Awareness handling (due to staggered rollouts), Robustness (due to partial verification), Diagnostic Separability (due to debugging needs).
      *   *Preference:* Common Prior (often false in distributed systems), Factivity (agents might have bugs/false beliefs), Single Probability Measure (might need imprecise probabilities), Specific Solution Concept (Nash vs. Correlated vs. Program).

  5.  **Addressing the "Killer" Constraint & Impossibilities:**

      *   *The Tension:* Intensionality (reading code) vs. Robustness (refactoring). If agents reason about code structure, refactoring breaks things. If they reason only about I/O, code reading is useless.
      *   *The Tension:* Constructive Selection vs. No CK of Outcome. If the theory selects a unique outcome, doesn't that imply the agents know it? Not necessarily, but it implies the *analyst* knows it.
      *   *The Tension:* Diagnostic Separability. If rationality is defined *in terms of* knowledge (e.g., Aumann's definition), you can't separate them easily. You need an independent definition of rationality (e.g., maximizing expected utility given *actual* beliefs, regardless of truth).
      *   *Killer Requirement:* **Robustness to Epistemic Depth (Continuity).** Standard epistemic game theory is notoriously discontinuous (Rubinstein's Email Game). CK yields coordination; $0.99$-CK yields non-coordination. For engineering, this is fatal. This is likely the hardest constraint to satisfy.

  6.  **Developing the Scorecard:**

      *   *Standard Epistemic Game Theory (Aumann/Brandenburger):* Fails on Procedural Rationality and Awareness. Fails on Continuity (Email Game).
      *   *Program Equilibrium (Tennenholtz/Fortnow):* Good on Procedural. Weak on Awareness/Partial Verification.
      *   *Awareness Logic (Modica/Rustichini):* Good on Awareness. Weak on Procedural/Selection.
      *   *Bounded Rationality/Level-k:* Good on Depth. Weak on Selection/Uniqueness.
      *   *Logical/Modal Approaches (Dynamic Epistemic Logic):* Good on structure. Computationally heavy.

  7.  **Refining the Output Structure:**

      *   Introduction: Acknowledge the shift from descriptive to prescriptive/engineering.
      *   Section 1: The Desiderata (with motivations/cases).
      *   Section 2: Forced vs. Preference (The Classification).
      *   Section 3: Diagnostic Duty & Impossibilities.
      *   Section 4: The "Killer" Requirement.
      *   Section 5: Scorecard.

  8.  **Self-Correction/Nuance Check during drafting:**

      *   *Check:* Did I answer the specific question about "Rational attaches to strategies or procedures"? *Yes, must be procedures.*
      *   *Check:* Did I address the "Two Generals/Centipede" issue? *Yes, under Robustness/Continuity.*
      *   *Check:* Did I address "Invariant under re-implementation"? *Yes, under Intensional Stability.*
      *   *Check:* Is the distinction between "Forced" and "Preference" clear? *Need to ensure I don't label standard assumptions (like Common Prior) as forced just because they are common.*
      *   *Check:* Diagnostic Duty. *Can any account discharge this?* Probably not fully, because rationality is often defined *given* knowledge. I need to specify that rationality must be defined relative to the agent's *subjective* state, not the *objective* state, to allow separation.

  9.  **Final Polish:** Ensure the tone is technical, precise, and authoritative, suitable for a specification document. (Avoid fluff, focus on the "why" and "what").

  *(Self-Correction on the "Killer" Requirement)*: While Continuity is hard, the *Inspectable Code* requirement fundamentally breaks standard state-space models. Standard models assume actions are the primitive. Here, code is the primitive. This might be the bigger structural hurdle. However, the prompt asks what rules candidate frameworks *out*. The Email Game discontinuity rules out almost all standard CK frameworks for engineering use. I will highlight the Continuity/Robustness issue as the primary filter, but note the Procedural shift as the primary structural change.

  *(Refining Diagnostic Duty)*: If an agent maximizes utility given false beliefs, are they rational? Yes, instrumentally. If the system fails, was it the beliefs (knowledge) or the maximization (rationality)? To diagnose, the framework must allow us to audit the maximization step independently of the belief formation step.

  *(Refining Selection)*: Engineering needs a *function*, not a *correspondence*. The theory must predict *the* outcome, not *a set of* outcomes. This rules out Nash Equilibrium (usually) in favor of refinements or specific solution concepts like Program Equilibrium.

