answer: |-
  The full list is not jointly satisfiable; you must sacrifice either "No Armchair Cosmology" or "No Magical Influence" (Doomsday/Adam & Eve), while "Carving-invariance" remains formally unachievable for standard sampling rules without a privileged physics of observation.

  ### Desiderata for Self-Locating Credence

  1.  **Decision-Theoretic Alignment (Duplication Lottery)**
      *   **Case:** You face a fission; a bet pays $1 to each continuation.
      *   **Type:** Non-negotiable.
      *   **Why:** An agent rule must guide action; if credence diverges from betting odds for total utility, the agent leaves money on the table.
      *   **Breaks if dropped:** The rule becomes bookkeeping, not a guide for an embedded agent.

  2.  **Carving-Invariance (Reference Class Stability)**
      *   **Case:** Counting time-slices vs. whole persons vs. hemispheres changes the observer count.
      *   **Type:** Non-negotiable.
      *   **Why:** Physical probabilities shouldn't depend on metaphysical gerrymandering of what counts as an "observer."
      *   **Breaks if dropped:** Credence becomes manipulable by changing definitions rather than evidence; reality becomes sensitive to taxonomy.

  3.  **No Armchair Cosmology (Presumptuous Philosopher)**
      *   **Case:** Inferring a trillion-observer universe is near-certain just because you exist, despite equal priors.
      *   **Type:** Non-negotiable (for empirical integrity).
      *   **Why:** Existence alone shouldn't overwhelm physical evidence or priors regarding universe size.
      *   **Breaks if dropped:** Speculative cosmology becomes certifiable from the armchair; priors become irrelevant.

  4.  **No Magical Influence (Doomsday / Adam & Eve)**
      *   **Case:** Inferring humanity will end soon (Doomsday) or that willing yourself to be early affects conception odds (Adam & Eve).
      *   **Type:** Non-negotiable (for causal integrity).
      *   **Why:** Your birth rank or existence shouldn't causally influence external events or population sizes retroactively.
      *   **Breaks if dropped:** Agents believe they can influence the world via indexical facts; violates causal structure.

  5.  **Temporal Coexistence Irrelevance (Staggered Arrival)**
      *   **Case:** Heads (1 observer now), Tails (1000 observers later). You exist now.
      *   **Type:** Preference-of-SSA-camp.
      *   **Why:** If observers never coexist, sampling from the "total set" implies a view from outside time.
      *   **Breaks if dropped:** Future non-existent observers weight current credence, implying a "block universe" sampling perspective that may not match agent experience.

  6.  **Memory-Wipe Consistency (Sleeping Beauty)**
      *   **Case:** Woken once (Heads) or twice (Tails) with amnesia.
      *   **Type:** Preference-of-One-Camp (Thirder vs. Halfer).
      *   **Why:** Determines if credence tracks "number of wakings" (SIA/Thirder) or "world states" (SSA/Halfer).
      *   **Breaks if dropped:** Inconsistency in how repeated experiences within a world are weighted against world probabilities.

  7.  **Prior Preservation (Doomsday Argument)**
      *   **Case:** Updating heavily against long-future hypotheses based solely on early birth rank.
      *   **Type:** Preference-of-SIA-camp.
      *   **Why:** Prevents birth rank from overwhelming empirical priors about species longevity.
      *   **Breaks if dropped:** Empirical evidence about survival risks is ignored in favor of indexical surprise.

  8.  **First-Person Privilege (Adam & Eve)**
      *   **Case:** Being among the first two humans shouldn't make conception anomalies likely.
      *   **Type:** Preference-of-SIA-camp.
      *   **Why:** Avoids the implication that being early makes you "special" in a way that constrains the world.
      *   **Breaks if dropped:** Implies indexical location constrains worldly facts (psychokinesis via sampling).

  9.  **Infinity Handling (Big/Messy Worlds)**
      *   **Case:** Worlds with infinite observers or undefined totals.
      *   **Type:** Non-negotiable.
      *   **Why:** Cosmological models often imply infinities; the rule must not crash (NaN) or trivialize (1.0).
      *   **Breaks if dropped:** The rule is useless for modern cosmology; agents cannot evaluate standard multiverse theories.

  10. **Symmetry Respect (Fission/Teleportation)**
      *   **Case:** Two continuations are physically identical; neither is "real."
      *   **Type:** Non-negotiable.
      *   **Why:** Credence must respect physical symmetry; you cannot be "more" in one branch if physics is identical.
      *   **Breaks if dropped:** Violates principle of indifference over physically indistinguishable states.

  ### Unsatisfiable Subsets
  The core trilemma is **{No Armchair Cosmology, No Magical Influence, Standard Probability Theory}**.
  *   **SSA** satisfies *No Armchair* but fails *No Magical Influence* (yields Doomsday/Adam & Eve).
  *   **SIA** satisfies *No Magical Influence* but fails *No Armchair* (yields Presumptuous Philosopher).
  *   **Carving-Invariance** is unsatisfiable for both without a fundamental theory of "observer count" that physics does not currently provide.

  ### Most Constraining Desideratum
  **Carving-Invariance.**
  While the Armchair/Magical trade-off forces a choice between SSA and SIA, Carving-Invariance undermines the input definition for *both*. Without a physical fact of the matter on whether a "person" is one observer or 100 time-slices, any sampling rule yields arbitrary results. This desideratum rules out all current popular candidate rules as fundamental laws, reducing them to approximations dependent on a yet-undefined reference class physics.

  ### Scorecard

  | Rule | No Armchair | No Magical Influence | Carving-Invariance | Decision Alignment |
  | :--- | :--- | :--- | :--- | :--- |
  | **SSA** | **Pass** | Fail (Doomsday) | Fail | Pass (with care) |
  | **SIA** | Fail (Presumptuous) | **Pass** | Fail | Pass (with care) |
  | **Halfer** | **Pass** | **Pass** | Fail | Fail (Betting) |

  *Note: "Halfer" avoids Doomsday by rejecting the update on birth rank entirely, but fails to align with betting odds in duplication cases where total utility matters.*
