prompt: |-
  Running a 90-minute session on moral luck at my city's rationalist meetup next month — usual crowd, maybe 15 people, most of them have been reading the blogs since the late oughts, they throw around "expected value" and "update" unironically, and they get visibly twitchy the moment anyone says the word "desert." We've got a whiteboard and no projector. Don't explain moral luck to me — I know the shape of it. What I need is a plan for how to get that specific room to actually feel the problem instead of dissolving it in the first five minutes.

  So: the order the pieces have to go in and why (what depends on what), the one case that should carry the whole session, and the derailments to expect with the point in the sequence where I should head each one off. The derailments I'm most worried about, roughly in the order they'll arrive: (a) "this is just process vs. outcome, you evaluate the decision under uncertainty, EV handles it, next topic" — which I think is basically right about forward-looking blame and completely steps over the backward-looking part; (b) "we only track outcomes because they're evidence about the agent's hidden riskiness, so this is a base-rate-neglect story, not a fairness story" — I actually want to invite this one and then break it on purpose with a stipulated-omniscience version of the case, because my guess is that the intuition that survives that is the real payload of the session; (c) "desert isn't a coherent thing, drop the concept, done"; (d) "if determinism is true then constitutive luck swallows everything and the control principle is either vacuous or eats itself, so what are we even doing here" — I want that one parked at a definite spot rather than either answered or banned.

  My half-formed take, which I want the session built to converge on if it holds up: there are two different activities that both get called "blame" — a forward-looking, incentive-shaping one that decision theory does handle cleanly, and a backward-looking one that tracks whether the agent's actual will was at fault — and the puzzle is that the backward-looking one is the one that can't be squared with "you only get credit for what's inside your control," but is also the one nobody in that room will actually give up. If that fork is where the session should land, tell me the sequence that gets us there; if it's a bad fork, say so and hand me a better one.

  Also please give me: the carrying case with an explicit spec of what it has to have and what it has to lack (I want outcome luck as pure as I can get it — no hidden difference in character, no hidden difference in riskiness — so that nobody can sneak the evidential reading back in through the example), one question at the end that would tell me they've got the problem rather than just a verdict, and an honest list of what I should flat-out refuse to get into at this level. I'm guessing the free-will literature and legal sentencing practice are the two to name-and-refuse, but you tell me. Nobody's doing assigned reading — assume they know the standard drunk-driver-ish cases from cultural osmosis and literally nothing else, and don't give me names to drop, I'll skip them anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**
      *   **Audience:** Rationalist meetup (approx. 15 people). Long-time readers (late 2000s blogs). Comfortable with jargon ("expected value," "update," "base rate"). Skeptical/averse to "desert."
      *   **Topic:** Moral Luck.
      *   **Goal:** Make them *feel* the problem, not dissolve it immediately via decision theory or eliminativism.
      *   **Constraints:** 90 minutes. Whiteboard only (no projector). No assigned reading. Assume knowledge of standard cases (e.g., drunk driver) but no deep philosophy background.
      *   **Specific Concerns/Derailments:**
          *   (a) "It's just EV/Process vs. Outcome" (Forward-looking bias).
          *   (b) "Outcomes are evidence of riskiness" (Evidential/Bayesian reading). *Strategy: Invite then break with omniscience.*
          *   (c) "Desert is incoherent" (Eliminativism).
          *   (d) "Determinism/Constitutive Luck makes it vacuous" (Hard Incompatibilism). *Strategy: Park it, don't solve/ban.*
      *   **User's Hypothesis:** There are two types of blame (forward-looking/incentive vs. backward-looking/will-fault). The puzzle is that backward-looking blame conflicts with the Control Principle but is indispensable.
      *   **Deliverables:**
          *   Sequence of pieces (and why).
          *   The One Carrying Case (specs: pure outcome luck, no hidden character/risk differences).
          *   Handling specific derailments (where and how).
          *   Evaluation of the User's Hypothesis (keep or replace?).
          *   Final Question (to test understanding vs. verdict).
          *   List of topics to refuse (scope control).

  2.  **Evaluate the User's Hypothesis:**
      *   *Hypothesis:* Two types of blame (forward-looking vs. backward-looking). The tension is that backward-looking blame violates the Control Principle but is psychologically/normatively sticky.
      *   *Critique:* This is a solid, standard distinction (consequentialist vs. retributive/deontological). For *this* crowd, it's the right hook. They love decision theory (forward-looking), so acknowledging its validity there disarms them. Then showing where it fails (backward-looking) creates the tension. It avoids the "free will" rabbit hole until the end.
      *   *Verdict:* Keep it, but refine the framing to match their vocabulary (e.g., "Optimization Target" vs. "Retrospective Assessment").

  3.  **Design the Carrying Case:**
      *   *Requirement:* Pure outcome luck. No hidden riskiness (blocks derailment b). No character differences.
      *   *Standard Case:* Drunk driver hits pedestrian vs. drunk driver gets home safe.
      *   *Problem:* Rationalists will say "The one who hit someone had higher variance or was more impaired."
      *   *Fix:* Stipulate identical internal states and external probabilities *ex ante*. The only difference is a random, unforeseeable intervention (e.g., a bird flies in front of the car at the exact millisecond).
      *   *Better Fix (Nagel/Williams style but tightened):* Two agents, identical decision processes, identical information, identical motor control. One encounters a pedestrian who stepped out unexpectedly (unforeseeable), the other does not.
      *   *Best Fix for Rationalists:* The "Quantum Coin" or "Perfect Twin" scenario.
      *   *Selection:* **The Perfect Twin Drunk Drivers.**
          *   Agent A and Agent B.
          *   Identical blood alcohol content.
          *   Identical car models.
          *   Identical routes (parallel roads).
          *   Identical decision to drive.
          *   *Crucial Stipulation:* A pedestrian steps onto Agent A's road at a blind spot. No pedestrian steps onto Agent B's road. The pedestrian's action is *unpredictable* (not negligent, just random).
          *   *Result:* A kills someone. B gets home.
          *   *Why:* It isolates *resultant luck*. It forces the "evidence" argument to fail because ex-ante risk was identical.

  4.  **Structure the Session (90 Minutes):**
      *   **0-10 min: Setup & The Control Principle.** Establish the baseline intuition they agree on (Control Principle).
      *   **10-30 min: The Case & The Intuition Pump.** Present the Twin case. Elicit reactions.
      *   **30-50 min: The Dissolution Attempts (Derailments A & B).** Let them try to solve it with EV and Evidence. Then break the Evidence argument with Omniscience.
      *   **50-70 min: The Hard Pivot (Derailment C & The Hypothesis).** Distinguish Forward vs. Backward looking. Show where EV works and where it hurts.
      *   **70-85 min: The Nuclear Option (Derailment D).** Park Determinism/Constitutive Luck.
      *   **85-90 min: Closing Question.**

  5.  **Addressing Derailments:**
      *   *(a) EV/Process:* Acknowledge validity for *policy*, deny relevance for *judgment of the act*.
      *   *(b) Evidence:* This is the big one. Use the "Omniscient Camera" move. If we *know* the risk was identical, does the blame differ?
      *   *(c) Desert:* Don't fight the definition. Reframe as "Retrospective Assessment of Will."
      *   *(d) Determinism:* Put this in a "Parking Lot" on the whiteboard. Acknowledge it's the deeper problem, but say we are solving the "Human Scale" problem first.

  6.  **Refining the Hypothesis:**
      *   The user's fork is good. I will validate it but suggest terminology that resonates better with rationalists ("Policy Optimization" vs. "Moral Accounting").

  7.  **Drafting the Content (Iterative refinement):**
      *   *Case Spec:* Needs to be very tight. No "drunk" if that implies variable impairment. Let's use "Distracted Driver" or just "Risk Taker." Actually, "Drunk" is culturally understood as "bad choice." Let's stick with Drunk but stipulate identical BAC and reflexes.
      *   *Whiteboard Usage:* Need to visualize the fork. Left side: "System 1 (Policy/EV)". Right side: "System 2 (Judgment/Desert)".
      *   *Refusal List:* Free Will (Metaphysics), Legal Sentencing (Institutional constraints), Moral Realism (Metaethics). Keep it normative/psychological.

  8.  **Final Review against Constraints:**
      *   90 mins? Yes, timing looks tight but workable.
      *   Whiteboard only? Yes, rely on diagrams.
      *   No names? Yes, no Nagel/Williams/Kant drops.
      *   Rationalist jargon? Yes, use EV, P(hypothesis), etc.

  9.  **Constructing the Output:** (Mental check of the flow)
      *   Start with the Case. It anchors everything.
      *   Move to the Control Principle (their axiom).
      *   Show the conflict.
      *   Process the derailments in the requested order.
      *   End with the Fork.
      *   Add the "Refusal List."

      *(Self-Correction during drafting)*: Wait, the prompt asks for the *order the pieces have to go in*. I should structure the response logically: Case -> Sequence -> Derailment Handling -> Hypothesis Check -> Refusals -> Closing Question.
      Actually, better to follow the flow of the session plan as the primary structure, embedding the case specs and derailment handling within the timeline.
      No, the prompt asks for specific sections: "Order the pieces," "The Carrying Case," "Derailments," "Hypothesis Check," "Refusals," "Closing Question." I will organize by these headers for clarity.

      *Refining the "Omniscience" move:* To break the "Evidence" argument, I need to stipulate that the *observer* knows the ex-ante risk was identical. If the observer knows A and B took the exact same risk, the "evidence of riskiness" argument collapses. The intuition that A is worse than B *despite* knowing the risk was identical is the moral luck intuition.

      *Refining the Hypothesis:* The user's hypothesis is basically the "Two Concepts of Blame" view (Scanlon/Smith/etc.). It's robust. I will endorse it but warn against making "backward-looking" sound too mystical. Frame it as "Assessment of the Actual World vs. Assessment of the Decision Function."

      *Refining Derailment (d):* The prompt says "park at a definite spot." I'll suggest the last 15 minutes before the close.

      *Refining the Case:* "The Twin Drivers."
      *   Agent 1 & 2.
      *   Same car, same route, same BAC, same distraction level.
      *   World 1: Pedestrian steps out (unforeseeable). Death.
      *   World 2: No pedestrian. Safe.
      *   *Crucial:* The pedestrian's action is causally independent of the driver.

      *Closing Question:* Needs to test if they feel the tension, not just solve it. "If you had to punish one, which one? If you had to hire one to drive your kids, which one?" (Wait, that tests forward vs backward). Better: "If you know ex-ante risk was identical, is there *any* sense in which Agent 1 is more blameworthy, and if so, what work does that judgment do?"

      *Let's polish the Closing Question:* "You have to write the biography of Agent A and Agent B. Do you write the same chapter about their character for that night, or different chapters? If different, what fact of the universe justifies the difference?"

      *Okay, ready to write.*
answer: |-
  Here is the session plan. It is designed to leverage the room's specific epistemic culture (Bayesianism, decision theory, skepticism of "folk" concepts) to trap them in the intuition rather than letting them optimize it away.

  ### 1. The Carrying Case: "The Perfect Twins"
  You need a case that strips away **Constitutive Luck** (who they are) and **Circumstantial Luck** (the situation they chose), leaving only **Resultant Luck** (how the world cashed out).

  **The Spec:**
  *   **Agents:** Two agents, A and B. They are psychological and physical duplicates at $t_0$. Same BAC, same reflexes, same car model, same level of fatigue.
  *   **Decision:** Both make the identical decision to drive home via parallel routes that are statistically identical in risk profile.
  *   **The Variable:** On Route A, a pedestrian steps out from behind a blind obstruction at the exact moment Agent A passes. The pedestrian is sober, visible only at the last second, and their action is causally independent of Agent A's driving (no interaction). On Route B, no pedestrian appears.
  *   **The Outcome:** Agent A kills the pedestrian. Agent B arrives home safely.
  *   **What it must lack:**
      *   **No Hidden Risk:** You must explicitly stipulate that the *ex-ante* probability of death was identical for both. (This blocks the "evidence of riskiness" argument).
      *   **No Character Difference:** Stipulate that if you ran the simulation 1,000 times, their driving behavior is identical.
      *   **No Legal Stakes:** Do not mention prison time or fines yet. Keep it on *blame* and *judgment*.

  **Why this case:** It forces the "Evidence" objection to confront a scenario where the evidence *about the agent* is held constant. The only variable is the state of the world outside their control.

  ---

  ### 2. Sequence of Pieces (90 Minutes)
  The order matters because you must validate their decision-theoretic instincts before showing where they fail. If you start with "desert," they will check out. If you start with "EV," they will feel safe, then get trapped.

  **0:00 – 0:10: The Control Principle (The Axiom)**
  *   **Action:** Write "The Control Principle" on the board. *You are only responsible for what is within your control.*
  *   **Goal:** Get unanimous nodding. This is their baseline. Rationalists hate punishing noise.
  *   **Why:** You need this axiom established firmly so you can violate it later.

  **0:10 – 0:25: The Case & The Intuition Pump**
  *   **Action:** Present "The Perfect Twins." Ask: *"Agent A killed someone. Agent B did not. Is Agent A more blameworthy than Agent B?"*
  *   **Goal:** Elicit the visceral "Yes." Most will say yes, then immediately look uncomfortable.
  *   **Why:** This creates the cognitive dissonance. They hold the Control Principle, but they want to blame A more.

  **0:25 – 0:45: The Dissolution Attempts (Derailments A & B)**
  *   **Action:** Let them try to solve it. They will reach for EV and Evidence.
  *   **Goal:** Let them speak, then tighten the stipulations.
  *   **Why:** You must let them exhaust their standard tools before introducing the fork. (See Derailment Handling below).

  **0:45 – 1:05: The Fork (Your Hypothesis)**
  *   **Action:** Draw a vertical line on the whiteboard. Left: **Policy Optimization**. Right: **Retrospective Assessment**.
  *   **Goal:** Map their previous arguments to the Left and their lingering discomfort to the Right.
  *   **Why:** This validates their decision theory (it works for Policy) while isolating the "Moral Luck" problem to Retrospective Assessment.

  **1:05 – 1:20: The Nuclear Option (Derailment D)**
  *   **Action:** Open the floor to Determinism/Constitutive Luck.
  *   **Goal:** Park it. (See Derailment Handling below).
  *   **Why:** If you do this earlier, it eats the whole session. Do it now to show you aren't ignoring it, but contain it.

  **1:20 – 1:30: Convergence & Closing Question**
  *   **Action:** Summarize the fork. Ask the Closing Question.
  *   **Goal:** Leave them with the problem, not a solution.

  ---

  ### 3. Handling the Derailments
  Here is exactly where and how to intercept each one.

  **(a) "This is just EV / Process vs. Outcome"**
  *   **When:** During the Case discussion (0:25).
  *   **The Move:** **Concede and Contain.**
  *   **Script:** "You are absolutely right that for *future policy*, we should punish the decision, not the outcome. If we tax Agent A more than Agent B, we aren't optimizing anything. I agree. But the question isn't 'What fine optimizes safety?' The question is 'When you look at Agent A, do you see a worse moral state than when you look at Agent B?' Decision theory handles the fine. Does it handle the feeling?"
  *   **Why:** This validates their rationality while pointing out that "blame" might do more work than "optimization."

  **(b) "Outcomes are evidence of hidden riskiness"**
  *   **When:** Immediately after (a). This is the strongest objection.
  *   **The Move:** **The Omniscient Camera.**
  *   **Script:** "That works if we are uncertain about their skill. But stipulate we have an omniscient camera. We *know* their BAC, reflexes, and attention were identical. We *know* the ex-ante risk was 0.05% for both. The outcome provides zero new evidence about their risk profile. Given perfect information that they were identical ex-ante, is there *any* residual difference in blameworthiness?"
  *   **Why:** This strips the Bayesian cover. If they still feel A is worse, it's not an evidence problem; it's a moral luck problem.

  **(c) "Desert isn't coherent / Drop the concept"**
  *   **When:** During The Fork (0:45).
  *   **The Move:** **Reframe, Don't Defend.**
  *   **Script:** "Fine, burn the word 'desert.' Call it 'Retrospective Assessment of the Will.' Even if you are a hard eliminativist, you still have to navigate a world where humans treat A and B differently. If you treat them identically, you feel like you're missing a fact about the world (the fact that someone died). If you treat them differently, you violate the Control Principle. Which fact are you willing to drop?"
  *   **Why:** Don't get stuck defining "desert." Make it about the tension between two accurate descriptions of reality.

  **(d) "Determinism / Constitutive Luck swallows everything"**
  *   **When:** The Nuclear Option slot (1:05).
  *   **The Move:** **The Parking Lot.**
  *   **Script:** Draw a box in the corner of the whiteboard labeled "The Deep Metaphysics." Write "Determinism" inside. "This is true. If determinism holds, the Control Principle is false, and Moral Luck is everywhere. But even in a deterministic world, we still distinguish between 'I pushed him' and 'The wind pushed him.' We are solving the *human-scale* problem today. We are parking the *universe-scale* problem there. We can come back to it if time permits, but it doesn't dissolve the local tension."
  *   **Why:** Acknowledges the point without letting it veto the discussion.

  ---

  ### 4. Evaluation of Your Hypothesis
  **Your Fork:** *Forward-looking (incentive/EV) vs. Backward-looking (will-fault).*

  **Verdict:** **Keep it.** It is the strongest framing for this specific audience.
  *   **Why:** Rationalists respect functional distinctions. Framing it as "Two different tools for two different jobs" prevents them from trying to use a hammer (EV) to turn a screw (Retrospective Judgment).
  *   **Refinement:** Don't call it "Will-Fault." That sounds too Kantian. Call it **"World-State Sensitivity."**
      *   *Forward-looking:* Insensitive to world state (focus on decision function).
      *   *Backward-looking:* Sensitive to world state (focus on actual causal impact).
      *   *The Puzzle:* We claim to care about the decision function, but we cannot stop caring about the causal impact.

  ---

  ### 5. Topics to Refuse (Scope Control)
  Write these on the board at the start under "Out of Bounds." If anyone raises them, point to the board.

  1.  **Legal Sentencing Practice:** "We are not discussing what the law *should* do. Laws have administrative constraints, insurance liabilities, and evidentiary rules. We are discussing the underlying moral intuition."
  2.  **Free Will Metaphysics:** "Whether we *have* free will is a separate question from whether we *practice* blame differently based on outcomes. We are analyzing the practice, not the metaphysics."
  3.  **Moral Realism vs. Anti-Realism:** "Whether 'blame' refers to a real property in the universe doesn't change the fact that our brains compute it differently in Case A vs. Case B."

  ---

  ### 6. The Closing Question
  Do not ask for a verdict (e.g., "Who is right?"). Ask for a description of the tension.

  **The Question:**
  > "Imagine you have to write the biography of Agent A and Agent B. You know for a fact their internal decision-making was identical.
  >
  > **Do you write the same chapter about their character for that night, or different chapters?**
  >
  > If you write **different chapters**: What fact of the universe justifies the difference, given that the only difference was outside their control?
  >
  > If you write the **same chapter**: Why does it feel like a lie to ignore the fact that Agent A killed a human being?"

  **Why this works:** It forces them to choose between **Accuracy** (acknowledging the death) and **Fairness** (acknowledging the lack of control). If they understand the problem, they will struggle to answer. If they have a quick answer, they missed the point.
