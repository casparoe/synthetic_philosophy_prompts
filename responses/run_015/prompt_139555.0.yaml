  **MEMORANDUM**

  **TO:** Foundations Panel Members
  **FROM:** [Your Name]
  **DATE:** Thursday Morning
  **SUBJECT:** Recommendation on "Structural Continuity in Quantum Gravity"

  **Recommendation**
  I recommend we fund the "Structural Continuity in Quantum Gravity" programme, but strictly conditional on revised deliverables regarding empirical anchoring and ontological clarity. While the tabletop superposition experiment offers immediate empirical payoff, this programme addresses the conceptual scaffolding necessary to interpret such results. However, the current proposal fails to meet our charter's requirement for empirical disconfirmation and risks philosophical triviality. By imposing conditions that force the applicants to specify *which* structures are physically significant and how their breakdown manifests observationally, we preserve the theoretical value while ensuring compliance. This bridges the panel's split: we support foundational work, but not at the expense of empirical accountability.

  **Why the discarded-ontology argument overreaches**
  The applicants' core claim—that structure survives while ontology dies—overreaches because it risks triviality. As noted in external critique, any formal structure can be realized by some collection of objects. To avoid being trivially true, the programme must specify *which* relations are physically robust. But once you specify criteria for robustness (e.g., causal efficacy, dynamical primacy), you have quietly reinstated an ontological commitment regarding what counts as real. You cannot have a "free-floating" structure without implying a substrate or a criterion of physicality, which is itself an ontological stance.

  Consequently, the claim "structure survives" becomes a tautology unless they distinguish physical structure from mere mathematical artifact. This distinction requires ontological grounding. Furthermore, their disconfirmation condition—a successor theory retaining none of the structures—is not an observation. It is a theoretical possibility, not an empirical test. This violates our charter. Without specifying what *observation* signals structural failure, the programme insulates itself from data, rendering it mathematical history rather than physics. If they cannot identify empirical signatures of structural breakdown, they are merely doing history of science, which falls outside our mandate. The argument that this is "how work proceeds" ignores that previous eras did not operate under a charter requiring empirical anchoring. We cannot fund metaphysics disguised as physics. The evasion lies in claiming empirical anchoring while defining disconfirmation as a theoretical shift rather than an observational outcome. This renders the "empirical" requirement hollow and creates a shield against falsification. If the structure doesn't survive, they claim the theory changed, not that the structural realism was wrong. It's unfalsifiable in practice.

  **The strongest case for the option you reject**
  I am rejecting the option to fund the tabletop superposition experiment exclusively, though the case for it is robust. The strongest argument for rejecting SCQG in favor of the experiment is clarity and compliance. The experiment offers a definitive empirical result: either gravity superposes or it doesn't. It satisfies the charter perfectly. It avoids the philosophical quagmire of structural realism entirely. In a zero-sum budget, funding data generation is safer than funding interpretation. If the SCQG programme is correct, the experiment's results will still need interpreting, but if SCQG is wrong, the experiment still yields data. Prioritizing the experiment ensures we meet our mandate for empirical advancement without subsidizing ontological evasion. It resolves the panel split by choosing the objectively fundable project over the philosophically contentious one.

  Moreover, the opportunity cost is significant. Eight years of postdoc funding is substantial. Diverting this to a project with no promised empirical predictions delays our capacity to test quantum gravity effects directly. The experiment provides a constraint that any future theory, structural or otherwise, must accommodate. By choosing the experiment, we force the theorists to confront reality rather than refine their mathematics of survival. It is the conservative choice, but conservatism is warranted when the alternative risks violating the council's empirical charter. The experiment builds the ladder; SCQG only discusses the rungs.

  **Conditions**
  To release funds, the PI must submit two deliverables within six months. First, a white paper distinguishing "physical structure" from "mathematical artifact," explicitly addressing the charge of triviality. They must define the criteria for structural robustness without covertly reintroducing ontology. This should emerge from a dedicated workshop involving philosophers of physics to stress-test their definitions. Second, a revised disconfirmation plan specifying observable signatures of structural failure, not just theoretical replacement. This must align with our charter's empirical anchoring requirement. They must identify what experimental anomaly would indicate a structure has *not* survived.

  Finally, a mid-term review at year four will assess progress on these definitions. If the programme cannot demonstrate how their structural claims constrain empirical expectation, funding will cease. These conditions ensure the work remains physics, not history or metaphysics. They force the team to engage with the friend's objection directly, thickening the structural account without collapsing into dogmatic ontology. We are not asking them to solve quantum gravity, but to clarify what kind of knowledge their programme produces. If they cannot specify the content of their structural claims, they cannot claim empirical anchoring. This protects the council from funding evasion while preserving space for foundational inquiry. Should they fail these conditions, the remaining budget reallocates to the tabletop experiment.
