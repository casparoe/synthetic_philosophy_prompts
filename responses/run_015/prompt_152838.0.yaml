prompt: |-
  hey i'm a backend engineer with basically no formal philosophy background, but i got roped into running a 90-minute workshop at a local hackerspace (around 12 people, mostly devs) on parfit's teletransporter and what actually matters in survival. i want a runnable in-class game or role-play where people feel the tension themselves rather than just hearing about it.

  the niche twist i want baked in: instead of a clean 1-to-1 copy, the teleporter produces two branches, but each branch only gets a lossy, non-overlapping slice of the original's episodic memory — like a sharded database with missing keys — so neither copy has full psychological continuity, yet both feel like "me" with different confidence levels. participants start as one collective "self", then split into nodes, and have to negotiate over limited resources (compute tokens, energy credits, legal identity slots) while deciding whether to merge back or stay separate.

  design the rules, roles, a payoff scheme that uses points or tokens instead of real money, a timeline that fits 90 minutes, and a debrief that maps specific moments in the game onto parfit's psychological continuity vs bodily continuity. tell me what will predictably go wrong the first time i run it, and be frank about which feature of parfit's view this activty still can't reproduce and i'll have to supply myself. also say clearly what the group should come away seeing.

  please don't ask for bibliographies, citations, or reading lists — the participants can't search online and neither can i verify quotes. just build it from what you know.

  end with a one-sentence summary of the activity's core insight on its own line.
