answer: |-
  # Workshop Title: Project Fission — The Sharded Self

  ## 1. Concept & Setup
  **Goal:** Simulate Parfit's fission case where psychological continuity is fragmented. Participants experience the tension between "being the original" and "having enough data to function."
  **Group Size:** 12 participants.
  **Configuration:** 3 Tables (Pods), 4 people per Pod.
  **Materials per Pod:**
  *   10 "Memory Cards" (index cards with specific data/context written on them).
  *   20 "Compute Tokens" (poker chips or paper slips).
  *   1 "Identity Slot" token (a distinct object, e.g., a red chip).
  *   Timer (visible to all).

  **The Metaphor:**
  *   **Memory Cards:** Episodic memory shards (non-overlapping keys).
  *   **Compute Tokens:** Agency/Ability to act in the world.
  *   **Identity Slot:** Legal/social recognition (only one can hold the title of "The Original" for resource claims).
  *   **Pods:** Each Pod represents one Original Person undergoing teleportation.

  ## 2. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | 00-10 | **Intro** | Explain the thought experiment briefly. No identity, only continuity. Assign Pods. |
  | 10-25 | **Phase 1: Unity** | The Pod acts as one entity. Consolidate memory and resources. |
  | 25-30 | **Event: Teleport** | Facilitator interrupts. Shuffle memory. Split the Pod. |
  | 30-60 | **Phase 2: Fission** | Two Nodes (2 people each) negotiate over scarce resources. |
  | 60-75 | **Phase 3: Resolution** | Decision: Merge, Fight, or Separate. Scoring. |
  | 75-90 | **Debrief** | Map game mechanics to Parfit's philosophy. |

  ## 3. Game Rules & Mechanics

  ### Phase 1: Unity (15 mins)
  *   The 4 players at a table are the **Original**.
  *   They receive 10 Memory Cards and 20 Compute Tokens.
  *   **Task:** They must agree on a "Life Goal" (e.g., "Maximize wealth," "Protect family," "Finish the project") written on a whiteboard. This establishes their psychological profile.
  *   They memorize the cards collectively. They are one mind.

  ### Phase 2: The Teleport Event (5 mins)
  *   **The Twist:** The facilitator collects the 10 Memory Cards.
  *   **Data Loss:** 2 Cards are removed permanently (corruption/lossy compression).
  *   **Sharding:** The remaining 8 Cards are split into two decks of 4. **No overlap.** (e.g., Node A gets the bank passwords; Node B gets the family memories).
  *   **Split:** The 4 players physically split into two pairs (Node A and Node B). They cannot share information about their cards yet.
  *   **Resources:** Each Node gets 10 Compute Tokens.
  *   **Scarcity:** The Facilitator places **1 Identity Slot** token in the center of the table.

  ### Phase 3: The Negotiation (30 mins)
  *   **The Problem:** To cash out points at the end, a Node needs the **Identity Slot**. Without it, Compute Tokens are worth 1 point each. With it, tokens are worth 3 points each.
  *   **The Conflict:** Both Nodes feel like the Original. Both have valid memory shards. Only one Slot exists.
  *   **Actions:**
      1.  **Claim:** A Node declares they are the true successor. (Requires showing 1 Memory Card as proof).
      2.  **Trade:** Nodes can trade Compute Tokens for access to view Memory Cards (verifying continuity).
      3.  **Merge:** The two Nodes can choose to recombine into one group of 4. They pool their Memory Cards (recovering 8/10 original data) and share the Identity Slot.
  *   **Constraint:** If both Nodes claim the Identity Slot simultaneously without merging, the system "crashes." Neither gets the multiplier (tokens worth 0 points).

  ### Phase 4: Resolution (15 mins)
  *   Nodes submit their final state:
      *   **Separate Winner:** One node holds the Slot, the other concedes.
      *   **Merge:** One unified group holds the Slot.
      *   **Crash:** Both claimed, no one gets the Slot.
  *   **Scoring:**
      *   Compute Tokens × Multiplier (1 or 3).
      *   +10 Bonus points per Memory Card held.
      *   **Survival Score:** Total points divided by 4 (per person).

  ## 4. Payoff Scheme (Token Economy)
  *   **Compute Tokens:** Represent energy/ability to pursue goals.
  *   **Identity Slot:** Represents social/legal continuity (the "name" that matters to the outside world).
  *   **Memory Cards:** Represent psychological connectedness (the "content" that matters to the inside).
  *   **Win Condition:** There is no single winner. The goal is to maximize the Pod's total **Survival Score**.
  *   **Tension:** Merging maximizes memory content (higher bonus) but requires 4 people to share one Identity Slot (diluting individual agency). Staying separate maximizes individual agency but risks losing the Identity Slot multiplier or suffering from incomplete memory (lower bonus).

  ## 5. Predicted Failure Modes (First Run)
  1.  **The Optimization Trap:** Players will treat this as a math puzzle ("If we merge, we get X points") rather than an identity crisis. They will ignore the emotional weight of the Memory Cards.
      *   *Fix:* During the debrief, ask specifically about the cards they *lost*. Did losing the "family promise" card make them feel less like the original?
  2.  **Dominant Nodes:** In each pair, one developer will dominate the decision-making, breaking the illusion that the Node is a "conscious entity."
      *   *Fix:* Enforce a rule that both members of a Node must sign any claim on the Identity Slot.
  3.  **Time Creep:** Negotiations will drag. The "Trade" action (viewing cards) consumes too much time.
      *   *Fix:* Hard cap Phase 3 at 30 minutes. Use a visible countdown timer. Announce "5 minutes to system stabilization" at the end.
  4.  **The "Coin Flip" Solution:** To avoid conflict, pods might just flip a coin for the Identity Slot immediately.
      *   *Fix:* Make the Identity Slot worth significantly more than the risk of a crash. Make the Memory Cards necessary to justify the claim (e.g., "You must hold 3 cards to claim the slot").

  ## 6. Limitations: What This Activity Cannot Reproduce
  You must verbally supply these gaps during the debrief, as the game mechanics cannot simulate them:
  1.  **The Qualia of Continuity:** In the game, players *know* they are distinct people playing a role. In Parfit's thought experiment, the copy *feels* exactly like the original from the inside. The game cannot reproduce the subjective certainty of "I am me."
  2.  **The Destruction of the Original:** Parfit's classic case often involves the original being destroyed. Here, the original simply splits. You need to explain that in the philosophical case, the input is destroyed, making the output the *only* candidate for survival, whereas here the "original" group just reorganized.
  3.  **The "Further Fact" Intuition:** Players will likely still feel there is a "true" owner of the Identity Slot. Parfit's hard view is that there is *no* true owner, only degrees of connectedness. The game forces a choice (who gets the token), which reinforces the binary identity view Parfit argues against. You must point out that the *need* for the token is a social construct, not a metaphysical truth.

  ## 7. Debrief Guide (Mapping to Parfit)
  **Question 1: The Memory Shards**
  *   *Ask:* "Node A had the bank keys, Node B had the family memories. Who deserved the Identity Slot?"
  *   *Parfit Map:* This maps to **Psychological Connectedness**. Parfit argues identity isn't all-or-nothing. If connectedness is reduced (lossy shards), survival is reduced, but not necessarily zero.

  **Question 2: The Merge Decision**
  *   *Ask:* "Those who merged, did you feel you 'survived' more than those who stayed separate?"
  *   *Parfit Map:* This maps to **What Matters**. Parfit claims survival (continuity) matters, not identity (uniqueness). Merging restored continuity but lost uniqueness. Did that feel like survival?

  **Question 3: The Identity Slot**
  *   *Ask:* "Was the Identity Slot actually necessary for you to feel like you survived, or was it just about the points?"
  *   *Parfit Map:* This maps to **Bodily/Legal Continuity vs. Psychological Continuity**. The Slot represents the external label. Parfit argues the label doesn't matter; the internal psychological chain does.

  **Question 4: The Data Loss**
  *   *Ask:* "2 Cards were deleted. Did that make you feel less like the Original?"
  *   *Parfit Map:* This maps to **Degrees of Identity**. Parfit suggests identity can be a matter of degree. If you lose enough memory, are you still you? The game forces a threshold decision.

  ## 8. Core Takeaway for Participants
  The group should come away seeing that "Personal Identity" is not a magical, indivisible substance, but a composite of psychological connections that can be split, degraded, or shared without necessarily ending survival.

  ## 9. Core Insight
  Personal identity is not a binary switch but a matter of degree, and survival matters more than strict uniqueness.
