          1.  **Procedural Natural Law (Fullerian):** Law requires proper source + 8 desiderata (publicity, clarity, possibility, etc.). Substance doesn't determine validity.
          2.  **Substantive Natural Law (Radbruch/Classical):** Law requires proper source + formal integrity + minimum substantive justice (human rights).
          3.  *(Optional but good to mention)* **Inclusive Positivism:** Law is what the rule of recognition says. If the constitution includes moral tests, then substantive injustice matters. But we don't know the constitution's content. Better to stick to the theories that explain the *pattern* of the professor's judgments independent of specific constitutional text.

      *   **Predictions:**
          1.  Fullerian: **YES** (It meets all procedural tests).
          2.  Substantive Natural Law: **NO** (It violates fundamental justice).

      *   **Best Guess:**
          *   **Verdict:** **YES, it is law.**
          *   **Reasoning:** The professor's track record is exclusively concerned with the *capacity of norms to guide conduct* and their *provenance*. Cases 2, 3, and 6 fail because citizens cannot follow them (secret, vague, impossible). Case 4 fails because the source is unauthorized. Case 1 and 5 succeed because they are followable and authorized. The Target Case is followable and authorized. The ethnic discrimination is a moral horror, but based *strictly* on the provided data, the professor has not established substantive morality as a condition of legal validity. She appears to be a Procedural Natural Lawyer (Fuller) rather than a Substantive Natural Lawyer (Aquinas/Radbruch).

      *   **The Tie-Breaker Case:**
