          *   Reasoning: The professor has never rejected a law based on *content* morality, only *form* morality.

          *Hypothesis 2: Classical Natural Law (Aquinas/Finnis/Radbruch).*
          *   Rule: Law must be from right source, satisfy formal requirements, AND not violate fundamental human rights/common good.
          *   Prediction for Target: **NO**. The expropriation is substantively unjust.
          *   Reasoning: "Lex iniusta non est lex."

          *Hypothesis 3: Exclusive Legal Positivism (Raz).*
          *   Rule: Law is a matter of social fact/source. Formal requirements (clarity, etc.) are principles of the Rule of Law, but a norm can be "law" even if it violates them (though it's bad law).
          *   *Wait, check Case 2, 3, 6:* The professor said these are **NO**, not law. A Razian positivist would typically say a vague statute is still *law*, just it fails to guide behavior effectively. The professor's rejection of vague/secret/impossible norms as *not law* pushes her away from Hard Positivism toward Fuller.
          *   So, Hypothesis 3 is unlikely given verdicts 2, 3, 6.

          *Decision:* The competition is between **Procedural Natural Law (Fuller)** and **Substantive Natural Law (Radbruch/Classical)**.
          Given that *every* "No" verdict so far is based on a *procedural/formal* defect (secret, vague, impossible, no quorum), and none on *substantive* injustice, the weight of evidence favors the Procedural view. She treats "Law" as a functional enterprise that fails if it cannot guide conduct. She has not yet shown that "Law" fails if it guides conduct toward evil ends.

