              *   Case 6: Fails Possibility $\rightarrow$ No.
          *   *Target Case Prediction:* The statute meets all 8 desiderata (clear, published, possible, etc.). Fuller distinguishes between *procedural* natural law and *substantive* natural law. Fuller famously debated Hart on the "Grudge Informer" case. Fuller would likely say it *is* law procedurally, but might argue it fails the "purpose" of law. However, strictly speaking, Fuller's 8 points are met.
