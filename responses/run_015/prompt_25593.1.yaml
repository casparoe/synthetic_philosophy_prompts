          We don't know yet. All her "No" verdicts so far can be explained by *Procedural* Natural Law (Fuller) + Positivist Validity Conditions. None of her "No" verdicts rely on *Substantive* Morality (e.g., "This law is wicked therefore not law"). They all rely on *form* (secret, vague, impossible, improper enactment).

