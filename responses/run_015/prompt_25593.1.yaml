  2.  **Analyze the Prior Verdicts (The Data Set):**
      *   *Case 1 (Municipal Bylaw):* Properly enacted, published, enforced $\rightarrow$ **YES**. (Suggests positivism/procedural validity matters).
      *   *Case 2 (Unpublished Directive):* Not published/accessible $\rightarrow$ **NO**. (Suggests Fuller's "Inner Morality of Law" - publicity requirement).
      *   *Case 3 (Vague Criminal Statute):* Too vague to understand $\rightarrow$ **NO**. (Suggests Fuller's "clarity" requirement or Rule of Law principles).
      *   *Case 4 (No Quorum):* Procedural defect in enactment $\rightarrow$ **NO**. (Suggests Hart's "Rule of Recognition" or Constitutional Positivism - source matters).
      *   *Case 5 (Merchant Custom):* Long-standing, court-recognized $\rightarrow$ **YES**. (Suggests Customary Law is valid, perhaps via judicial recognition or historical source).
      *   *Case 6 (Impossible Statute):* Physically impossible to comply $\rightarrow$ **NO**. (Suggests Fuller's "possibility of compliance" requirement).

  3.  **Identify Candidate Jurisprudential Theories (The Rules):**

      *   *Candidate A: Hard Legal Positivism (e.g., Austin, early Hart).*
          *   *Focus:* Source, command, sovereign will.
          *   *Fit:* Explains Case 1 (Yes), Case 4 (No - source defect).
          *   *Mismatch:* Struggles with Case 2, 3, 6. A command can be secret, vague, or impossible and still be a command from a sovereign. Hard positivism usually separates law and morality, so substantive injustice (Target Case) would still be law.
          *   *Verdict on Data:* Poor fit. The professor rejects norms that fail procedural/formal criteria (publicity, clarity, possibility) even if enacted by authority.

      *   *Candidate B: Soft Positivism / Incorporationism (e.g., Waluchow, Coleman).*
          *   *Focus:* Sources matter, but moral criteria *can* be incorporated if the rule of recognition says so.
          *   *Fit:* Can explain Case 4 (Constitution is part of rule of recognition).
          *   *Mismatch:* Doesn't inherently explain Case 2, 3, 6 unless the constitution mandates publicity/clarity/possibility. If the constitution *doesn't* mandate those, a soft positivist might still call them law. The professor seems to treat these as inherent requirements of "law," not just contingent constitutional ones.
          *   *Verdict on Data:* Plausible, but requires assuming specific constitutional content.

      *   *Candidate C: Natural Law Theory (Classical/Thomistic).*
          *   *Focus:* Lex iniusta non est lex (An unjust law is not a law).
          *   *Fit:* Could explain the "No" verdicts if interpreted as violations of reason/common good.
          *   *Mismatch:* Case 1 is law (presumably just). Case 5 is law. But Classical Natural Law usually focuses on *moral* content. Cases 2, 3, 4, 6 are formal/procedural defects, not necessarily moral injustices (though they lead to injustice).
