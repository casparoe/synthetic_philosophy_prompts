answer: |-
  # Question-Period Prep Sheet: Accuracy-Dominance & Interest-Relativity

  **Workshop Context:** 2-Day Formal Epistemology.
  **Audience Mix:** Traditional Internalists/Virtue Theorists (Majority), Decision Theorists (3), Weather Forecaster (1).
  **Core Thesis:** Accuracy-dominance arguments for Probabilism fail because scoring rule choice is arbitrary without practical interests; therefore, epistemic rationality is interest-relative.

  ---

  ### Top 9 Objections (Ordered by Damage Potential)

  #### 1. The "Mathematical Uniqueness" Objection
  **Who:** Decision Theorist (The most technical of the three).
  **Phrasing:** "You claim the choice among strictly proper rules is arbitrary absent practical interests. But characterization theorems exist. If we demand *locality* (you're only scored on the actual outcome) and *continuity*, doesn't that uniquely pick out the Logarithmic scoring rule? If the math selects the rule based on structural constraints rather than practical needs, your claim that we *must* pivot to interest-relativity is false."
  **2-Minute Reply:** "Characterization theorems do exist, but the constraints they rely on—like locality—are themselves normative choices, not mathematical givens. Why must an epistemic score be local? That's a substantive claim about what counts as 'accuracy.' A meteorologist might care about the probability assigned to the *whole* distribution, not just the realized event, because the unrealized events still inform future models. Locality is a practical constraint on data availability, not an epistemic constraint on truth. So the math doesn't save us; it just pushes the normative question back one step."
  **Concede:** That characterization theorems exist and narrow the field.
  **Soft Spot:** You are asserting that structural constraints (like locality) are "practical." A committed formalist will insist they are purely mathematical/structural properties of the belief state. If they dig in on locality being an *epistemic* virtue, you need a better argument for why it's practical.

  #### 2. The "Normativity Collapse" Objection
  **Who:** Traditional Internalist (Senior figure).
  **Phrasing:** "If epistemic rationality is interest-relative, then what I ought to believe depends on what I care about. But justification is supposed to be binding 'by my own lights' regardless of my goals. If I don't care about the weather, does it become epistemically permissible for me to be incoherent about rain? You haven't replaced the framework; you've dissolved the normativity of epistemology."
  **2-Minute Reply:** "Interest-relativity doesn't mean 'optional.' Once your interests are fixed—once you are an inquirer into a specific domain—the norms bind you strictly. The shift is from 'What should anyone believe?' to 'What should an inquirer with *these* aims believe?' Justification remains normative relative to the inquiry. We don't say practical rationality isn't normative because it depends on your desires; epistemic rationality is the same. It's hypothetical imperatives all the way down."
  **Concede:** That this challenges the traditional view of epistemic norms as categorical.
  **Soft Spot:** Many internalists view the categorical nature of epistemic norms as the *definition* of the epistemic. If they deny the analogy to practical rationality, you risk talking past them.

  #### 3. The "Probabilism is Secure" Objection
  **Who:** Decision Theorist (The pragmatist of the trio).
  **Phrasing:** "All strictly proper scoring rules agree on the central result: incoherent credences are accuracy-dominated by coherent ones. They disagree on the *degree*, but not the *verdict*. So why replace the argument? If the goal is defending Probabilism, the accuracy-first program succeeds regardless of rule choice. Your objection is a solution in search of a problem."
  **2-Minute Reply:** "Because Probabilism isn't the end goal; it's the starting point. We use credences to update, to decide, and to communicate. Different scoring rules recommend different 'minimal revisions' for an incoherent agent. If I use Brier, I should fix my beliefs one way; if I use Log, another. If we don't know which rule governs our inquiry, we don't know *which* coherent function to adopt. Defending the label 'Probabilism' is useless if we can't say which probability function is the rational target."
  **Concede:** That all proper rules secure the basic coherence theorem.
  **Soft Spot:** If the audience thinks "Probabilism" (mere coherence) is the only thing formal epistemology needs to prove, this makes your project look like over-engineering.

  #### 4. The "Operational Triviality" Objection
  **Who:** Research Forecaster (NWS).
  **Phrasing:** "In forecasting, we choose verification scores based on the user's cost function. A farmer needs different accuracy than an airline pilot. You've presented this as a deep philosophical discovery, but in practice, this has been standard operating procedure for forty years. The philosophy literature is naive, but your 'replacement' is just standard meteorology. What's the philosophical contribution?"
  **2-Minute Reply:** "You're absolutely right that practice knows this. The contribution is exposing that philosophy has been pretending otherwise. The literature treats the choice of scoring rule as a technical detail or assumes 'neutrality' is possible. My argument forces the discipline to admit that when they pick the Brier score, they are implicitly picking a practical stance. The novelty isn't the idea itself, but forcing formal epistemology to stop hiding from it."
  **Concede:** Immediately and enthusiastically. "You are the expert on practice; I am the expert on the literature's blind spots."
  **Soft Spot:** If they press that this makes your work merely sociological rather than philosophical, you need to emphasize the *normative* implication: philosophers shouldn't prescribe norms without specifying the interest.

  #### 5. The "Pragmatic Encroachment" Objection
  **Who:** Traditional Internalist (Focus on Justification).
  **Phrasing:** "This is just pragmatic encroachment in formal clothing. We've spent a decade arguing that stakes don't affect justification. You're saying the *scoring rule* changes with stakes. But justification should depend on evidence, not on how much it costs to be wrong. You're conflating rational belief with rational action."
  **2-Minute Reply:** "I'm not saying stakes change the evidence. I'm saying 'epistemic rationality' is defined by the goal of the inquiry. If the goal is 'truth' simpliciter, that's an abstraction. Real inquiry has a telos. If the telos shifts, the standard for 'good enough' evidence shifts. This isn't encroachment; it's a redefinition of the epistemic domain. We aren't letting practical interests into justification; we're admitting justification was never purely about evidence to begin with."
  **Concede:** That this aligns with pragmatic encroachment literature.
  **Soft Spot:** Internalists hate encroachment. If they view this as a dead-end debate, they will dismiss your thesis as rehashing old objections to Fantl & McGrath.

  #### 6. The "Virtue/Telos" Objection
  **Who:** Virtue Epistemologist.
  **Phrasing:** "You assume the only epistemic value is accuracy measured by a score. But the virtuous inquirer seeks *understanding*, not just minimized Brier scores. Sometimes a coherent, 'accurate' credence function is epistemically vicious if it doesn't promote understanding. Your framework is too narrow; the problem isn't the scoring rule, it's accuracy-first."
  **2-Minute Reply:** "I agree understanding matters. But even if understanding is the goal, we still need to represent the world to understand it. The question remains: how do we measure the accuracy of that representation? Even a virtue epistemologist needs a metric for 'getting it right.' My argument applies to *any* metric you choose. If you have multiple ways to measure 'understanding-accuracy,' the choice among them will still depend on the inquirer's needs."
  **Concede:** That accuracy isn't the sole epistemic value.
  **Soft Spot:** If they argue that understanding is *sui generis* and unquantifiable, your formal framework becomes irrelevant to their core concerns.

  #### 7. The "Disagreement/Relativism" Objection
  **Who:** Traditional Internalist.
  **Phrasing:** "If I use a Log score and you use a Brier score, we might disagree on which agent is more rational. Does this mean there's no fact of the matter about who is right? You've made epistemic evaluation subjective. Two philosophers can't even disagree about rationality anymore."
  **2-Minute Reply:** "It makes evaluation contextual, not subjective. Like asking 'Is this knife sharp?' It depends on whether you're cutting steak or wood. We can still disagree about whether the chosen context (scoring rule) fits the inquiry. We can argue about what the goals of inquiry *should* be. That's a substantive normative debate, better than pretending there's a 'view from nowhere' score."
  **Concede:** That this complicates interpersonal evaluation.
  **Soft Spot:** Philosophers love objective disagreement. If they feel this makes progress impossible, they will reject the view as self-defeating.

  #### 8. The "Operational Cost" Objection
  **Who:** Research Forecaster.
  **Phrasing:** "You say we pick scores based on needs. But in practice, we pick scores based on *computability* and *stability*. We don't use Log score sometimes because it blows up with zero probabilities. Are you saying epistemic rationality depends on our computer's floating-point precision?"
  **2-Minute Reply:** "In a way, yes. If the inquirer is a human or a system with limited capacity, 'rationality' must be sensitive to those limits. An idealized norm that crashes the system isn't a norm for that agent. This supports my thesis: the 'best' scoring rule is constrained by the agent's practical architecture. Idealization in philosophy often hides these practical constraints."
  **Concede:** That computational limits are practical, not truth-related.
  **Soft Spot:** This sounds like "bounded rationality," which they might argue is a separate topic from "epistemic justification."

  #### 9. The "Properness is the Norm" Objection
  **Who:** Decision Theorist.
  **Phrasing:** "Strict properness *is* the definition of an epistemic scoring rule. If it's not proper, it doesn't measure accuracy. So choosing a proper rule isn't a practical choice; it's a conceptual requirement. You're arguing we need to choose among rules, but the class of admissible rules is already fixed by the concept of accuracy."
  **2-Minute Reply:** "Properness narrows the set, but it doesn't pick a member. It's like saying 'Use a vehicle.' That rules out walking, but doesn't tell me whether to use a truck or a sedan. Both are vehicles; both are proper. To pick the truck, I need to know what I'm hauling. Properness is a necessary condition, not a sufficient one for rule selection."
  **Concede:** That properness is a necessary constraint.
  **Soft Spot:** If they argue that *any* proper rule is equally valid epistemically, you return to Objection #3 (Probabilism is Secure).

  ---

  ### The "Killer Objection" (Hope Nobody Raises)

  **The Objection:** **"The Epistemic Tie-Breaker."**
  **Who:** A Decision Theorist who has read the recent literature on *epistemic utility* specifically.
  **The Argument:** "You claim there are no *epistemic* resources to choose between proper rules. But Joyce (2009) and others argue for *Extensionality* or *Calibration* as purely epistemic constraints. If we demand a scoring rule that respects Calibration as an epistemic virtue (independent of practical use), that might uniquely select a rule (or a very narrow class) without invoking practical interests. If there is a purely *epistemic* reason to prefer one proper rule over another, your move to interest-relativity is unnecessary."
  **Why it hurts:** Your thesis rests on the premise that the *only* resources left are practical interests (Step 3 of your sketch). If there is a mathematical/epistemic property (like Calibration or Locality interpreted epistemically) that breaks the tie, your argument for interest-relativity collapses. You haven't proven that practical interests are the *only* tie-breakers, just that the standard arguments haven't found one.
  **Preparation:** Be ready to argue that Calibration itself is a practical goal (calibrated for what purpose?).

  ---

  ### Preemption Strategy (What to raise in the talk)

  **Raise and Defuse:** **Objection #3 ("Probabilism is Secure").**
  **Why:** This is the most natural reaction for the audience. If they think the existing accuracy-dominance arguments work fine for establishing Probabilism, they will tune out your call for a "replacement."
  **How to do it:** In your conclusion, explicitly say: "You might think, 'So what? All proper rules prove Probabilism.' But formal epistemology doesn't stop at coherence. We use these norms to guide belief revision and theory choice. Without a specific rule, the accuracy framework is silent on *how* to fix incoherence. It gives a verdict without a remedy. That is why we must replace the framework, not just accept the coarse-grained result."
  **Benefit:** This raises the stakes of your talk immediately. It shows you aren't just nitpicking a theorem; you're arguing the theorem is practically useless for guidance without your proposed modification.
