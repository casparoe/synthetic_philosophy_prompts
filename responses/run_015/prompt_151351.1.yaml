answer: |-
  In a climate adaptation fund, officers must choose between reinforcing existing seawalls (Option A), which guarantees a utility of 50 units by preventing moderate flooding, or deploying a novel aerosol dispersal drone swarm (Option B), modeled using historical volcanic dispersion data. The volcanic sampling frame captures high cooling efficiency (unbounded upside utility) and minor temperature fluctuations (bounded downside utility), leading to a high calculated expected value, but it physically excludes the drone's specific synchronization failure mode—a rapid localized freezing event—because no volcanic analogue exists, effectively truncating this intermediate catastrophe from the empirical distribution. The EV-fanatic, trusting the data-driven model, selects Option B for its superior average return and perceived safety, while the Maximin agent, evaluating the mechanical support of the drone system rather than the historical record, identifies the freezing event as a feasible outcome with utility -500, well below Option A's minimum guarantee.

  **Theory Walkthrough**
  The EV-fanatic integrates utility over the probability distribution derived from the sampling frame: $E[U] = \int_{\text{volcanic data}} U(x)p(x)dx$. Because the sampling frame truncates the synchronization failure, the probability mass assigned to the catastrophe is zero; the agent sees only the unbounded upside and the bounded, minor downsides, resulting in a positive expectation that exceeds the safe option. The Maximin agent does not integrate over probabilities but evaluates the support of the physical mechanism: $\max_{a} \min_{x \in \text{Support}(a)} U(x)$. Since the mechanical support includes the synchronization failure regardless of historical precedent, the agent sees a minimum utility of -500 for Option B versus 50 for Option A and rejects the risk.

  **Structural Feature**
  The divergence is driven by the **sampling frame truncation**. While the utility asymmetry (bounded downside, unbounded upside) incentivizes the EV agent to favor Option B *given* the model, it is the truncation that hides the risk mass from the EV calculation while leaving it visible to the Maximin agent's structural analysis. If the sampling frame were not truncated (i.e., if the catastrophe were included in the data), the EV agent would likely reject Option B depending on the probability weight, aligning closer to the Maximin view.

  **Symmetrizing Utility**
  If you symmetrize the utility curve (making downside unbounded, mirroring the upside), the divergence persists but intensifies for the Maximin agent. The Maximin agent now sees an infinite loss ($-\infty$) for Option B versus a finite gain for Option A, strengthening their rejection. The EV-fanatic's choice remains unchanged because the truncation still assigns zero probability to the catastrophe in their model; they still calculate a finite, positive expected value based on the clipped data. This confirms the conflict is epistemic (data coverage) rather than axiological (value weighting).
