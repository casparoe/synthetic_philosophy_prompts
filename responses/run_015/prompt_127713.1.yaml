  ### Stage 1: Brainstorming Candidate Principles

  Here are six distinct principles regarding temporal weighting. I have varied their foundations (hedonic, rights-based, epistemic, etc.) to ensure we aren't just shifting utilitarian variables.

  1.  **Pure Time Preference (Hedonic Decay):** Value intrinsically decays over time, just as light dims over distance. A unit of welfare at $t+1$ is worth less than at $t_0$ simply because it is later.
  2.  **The Spatial Analogue (Your Current Principle):** Temporal distance is morally identical to spatial distance. If you wouldn't discount a beneficiary for being in Asia, you shouldn't discount them for being in 2300.
  3.  **Epistemic Discounting:** We discount the future only because we are uncertain it will arrive, or that the benefit will be received. Time itself is neutral; uncertainty is the tax.
  4.  **The Person-Affecting Restriction:** An outcome can only be better if it is better for some *particular* person. Future people who do not yet exist have no claims unless our actions determine *which* specific people will exist.
  5.  **Stewardship vs. Beneficence:** We have a strict duty not to harm the future (leave them worse than we found them), but only a weak duty to benefit them (leave them better than we found them).
  6.  **Psychological Continuity:** Weight should follow the strength of psychological connection. I care more about my future self than a stranger's future self; the Trust cares about the Valley's continuity, not the calendar.

