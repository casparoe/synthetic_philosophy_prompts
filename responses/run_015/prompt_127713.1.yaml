  *   **Epistemic** and **Stewardship** offer the best hope of repairing the conflict. Verdict 5 looks like a discount for *risk* and *surplus*, not time. Verdict 4 looks like a duty to prevent *harm*.

  ### Stage 3: The Recommended Principle

  I recommend replacing your Spatial Analogue with a more precise principle that separates **Prudential Rationality** (how you treat yourself) from **Moral Impartiality** (how the Trust treats beneficiaries), while accounting for **Existence** and **Need**.

  **The Principle of Impartial Welfare with Contingency Constraints**

  1.  **The Core Clause (Moral Impartiality):** A unit of suffering or welfare counts equally regardless of the date on which it falls or the location in which it occurs.
      *   *Motivating Case:* **Verdict 4 (Flood)** and **Verdict 7 (Stranger).** The Trust cannot say "2150 matters less than 2025" any more than it could say "The East Bank matters less than the West Bank."
  2.  **The Prudential Exception (Psychological Continuity):** An individual agent may weight their own future experiences by their degree of psychological connection to their present self.
      *   *Motivating Case:* **Verdict 2 (Toothache)** and **Verdict 1 (Enjoyment).** This explains why *you* postpone pain without guilt. It is permissible self-preference, but it is **not ethics**. The Trust is an institution; it has no "self" to feel dread, so this clause does not apply to the Trustees.
  3.  **The Marginal Utility Clause:** Benefits count less if the recipient is already well-off relative to the alternative recipient.
      *   *Motivating Case:* **Verdict 5 (Bonds).** You discount the bonds not because they are in 2324, but because you assume the valley will be richer then. Relieving present poverty (high marginal utility) trumps increasing future surplus (low marginal utility).
  4.  **The Existential Certainty Clause:** Claims are weighted by the probability that the beneficiary will exist and the mechanism will survive to deliver the benefit.
      *   *Motivating Case:* **Verdict 5 (Bonds)** vs. **Verdict 4 (Flood).** A flood barrier is physical infrastructure; a financial bond is an institutional promise over 300 years. The risk of institutional collapse justifies a lower weight for the Bonds, independent of time.
  5.  **The Harm/Benefit Asymmetry:** The duty to prevent catastrophic harm to future people is stricter than the duty to maximize their wealth.
      *   *Motivating Case:* **Verdict 4 (Flood)** vs. **Verdict 5 (Bonds).** We must save the future from drowning (Flood); we need not make them rich (Bonds) if it costs the present poor.

  **How this repairs your Spatial Analogue:**
  Your principle said: "Discount time only if discount space is legitimate."
  My repair: "Discount future benefits only if you would discount distant benefits for **Risk** or **Wealth**."
  In Verdict 7 (Stranger), the stranger exists and their need is comparable. In Verdict 5 (Bonds), the beneficiaries are contingent and likely wealthier. If you had a distant stranger who was rich and whose aid package might get lost in transit, you *would* discount them. The Spatial Analogue holds, provided you isolate *Time* from *Risk* and *Utility*.

  ### Stage 4: Honest Limitations and Overturning

  **Which verdicts cannot be saved?**
  *   **Verdict 2 (Toothache):** My principle classifies this as **Prudential**, not Moral. You feel no guilt because you are allowed to be selfish with your own pain. But this cannot be universalized. If the Trust felt "dread" about spending money now, that would be illegitimate. I must tell you: *There is no ethical defense for pure time preference regarding others.* If you felt no guilt postponing a *stranger's* toothache purely because of the date, you would be wrong.
  *   **Verdict 5 (Bonds):** My principle saves the *verdict* (spend less on bonds) but overturns your *reasoning*. You think you are discounting for Time. My principle says you are actually discounting for **Marginal Utility** and **Institutional Risk**. If the future people were guaranteed to be destitute and the bonds were gold bars in a vault, you *ought* to feel the same pull as for present poverty.

  **Which verdict would I overturn if forced?**
  *   **Verdict 5.** If I had to choose between consistency and your intuition here, I would force you to admit that if the future people are *equally poor*, the date is irrelevant. The Trust's charter says "Most Good." If a dollar saves a life in 2025 and a dollar saves a life in 2324, and both lives are equally wretched, the date is morally inert. Your hesitation in 5 is likely a heuristic for "The future is uncertain," not "The future is less valuable."

  **Peeling off the Non-Time Factors:**
  *   **Verdict 1 & 2:** Opportunity Cost + Psychological Continuity (Prudential).
  *   **Verdict 3:** Vanity + Uncertainty of Reception.
  *   **Verdict 5:** Marginal Utility (Future Richer) + Institutional Risk.
  *   **Verdict 4:** Harm Prevention (Strict Duty).
  *   **Verdict 6:** Identity (Ilse is present-to-herself).
  *   **Verdict 7:** Moral Impartiality.
  *   **Remaining Pure Time Preference:** **None.** Once you strip away risk, utility, and psychology, there is no ethical residue left that justifies weighting a future person's welfare less simply because they are later.

  ### Addressing Your Undecided Cases

  **(a) The 8x Richer Beneficiaries in 2320:**
  *   **Verdict:** Yes, the trustees may discount.
  *   **Reason:** This is **Marginal Utility**, not Time Discounting. Under Clause 3 of my principle, a dollar to a poor person weighs more than a dollar to a rich person. If the valley is 8x richer, the same sum produces less welfare. This is distinct from Verdict 5 because Verdict 5 also includes **Existential Risk** (will the bond institution survive?). Case (a) assumes they exist; Verdict 5 doubts the instrument.

  **(b) The Non-Identity Policy (Worse 2200, Different People):**
  *   **Verdict:** The principle condemns it.
  *   **Reason:** Under Clause 1 (Impartial Welfare), the *level* of welfare in the valley matters, not just the identity of the inhabitants. The Trust serves the "Valley's inhabitants," not specific genetic lines. If the policy makes the Valley a worse place to live (more suffering), it violates the charter, even if the specific sufferers wouldn't otherwise have existed. The "Person-Affecting" view (Candidate 4 in brainstorming) is too narrow for an institutional trust.

  **(c) Catastrophe (Extinction) vs. Present Suffering:**
  *   **Verdict:** Avert the Catastrophe.
  *   **Reason:** This triggers Clause 5 (Harm/Benefit Asymmetry) and Clause 4 (Existential Certainty). Extinction is the ultimate harm; it reduces future welfare to zero. Present suffering is terrible, but it allows for a future. Furthermore, without a future, the Trust's 500-year mandate is voided. The duty to ensure the *possibility* of future claims trumps the duty to satisfy present claims when the present claims do not threaten existence.

  ### Chapter 11: The Trustees' Reasoning

  Here is the shape of the argument a careful trustee should voice. It avoids the trap of saying "The future matters less" and instead focuses on *Need* and *Risk*.

  **The Trustee's Argument:**

  "We are tempted to say that a life saved in 2150 is worth less than a life saved today because it is far away. We must not say that. Our Charter commands us to do the most good for the Valley, and a life is a life, whether it is lived now or in three centuries. If we were choosing between a flood barrier for 2150 and a flood barrier for 2025, the date would be irrelevant. We would build both.

  "But we are not choosing between like and like. We are choosing between **certain poverty now** and **contingent wealth later**.

  "First, consider **Need**. The people suffering today are destitute. The people who will hold these bonds in 2324 are, by all projections, heirs to a richer valley. A dollar spent on bread today buys more welfare than a dollar added to a surplus three centuries from now. We are not discounting their time; we are weighing their poverty against our own.

  "Second, consider **Certainty**. A flood barrier is stone and earth; it does not depend on the solvency of banks that may not exist. These Tricentury Bonds are promises written on paper. To prioritize a fragile promise to the unborn over a certain cry from the living is not prudence; it is gambling with other people's lives.

  "So, I propose this: We fund the flood barrier fully, for that is a duty to prevent harm across time. We relieve the present poverty, for that is a duty to urgent need. But we do not increase the bond payout. Not because the future matters less, but because the present matters *more* when it is desperate, and the future is *uncertain* when it relies on our institutions surviving.

  "If I must concede one thing, it is this: If we knew the valley would be poorer in 2324 than it is today, and the bonds were guaranteed, I would vote to starve the present to feed them. But we do not know that. So we feed the hungry we can see."
