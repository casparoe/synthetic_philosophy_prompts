answer: |-
  **1. "You're just smuggling souls back in through the back door."** (The Hofstadter Skeptic)
  **Reply:** "Look, Hofstadter is a hard materialist. When I say 'pattern,' I mean causal structure that processes information and maintains homeostasis, not ectoplasm. If you can build it in silicon and it acts like me, it's me. If it's just a static file, it's not. There's no magic substance here, just structure doing work."
  **Honest Note:** This dismisses the feeling of mysticism without explaining why the vocabulary invites it. It's defensive.
  **[STRAWMAN]** Defuse: "It's causal structure, not ectoplasm."

  **2. "An LLM fine-tuned on your emails instantiates more of your pattern than your daughter does."** (The ML Person)
  **Reply:** "This is the hard case. A fine-tuned model predicts my text, but it doesn't *live* my life. It doesn't feel pain when kicked or joy when hugged. My 'live instantiation' requirement means the pattern has to be causally poised to interact with the world in real-time, not just output tokens. Your daughter inherits my reactive dispositions; the model inherits my static weights."
  **Honest Note:** This is the soft spot. Weights *do* react to inputs. The distinction between 'live' and 'static' is fuzzier than I'm admitting.
  **[CONCEDE NUANCE IN TALK]** Acknowledge that 'liveness' is a spectrum, not a binary switch, before Q&A.

  **3. "Measure is just unnormalized probability. You've reinvented subjective probability."** (The Expected-Utility Type)
  **Reply:** "Probability is about uncertainty: 'Which one will I be?' That sums to one. Measure is about quantity: 'How much of me is there?' That can sum to ten. If I copy myself, I don't become uncertain about which one I am; I become twice as much stuff. You should care about the total welfare of the pattern, not bet on an indexical location."
  **Honest Note:** Decision theory often collapses these in practice. If I can't show a bet where measure and probability diverge, this is verbal.

  **4. "This is just Neo-Lockeanism with numbers bolted on."** (The Retired Philosopher)
  **Reply:** "Parfit says identity doesn't matter, only survival. I'm saying survival comes in units. Neo-Lockeanism usually stops at 'psychological continuity.' I'm saying continuity is a scalar variable that aggregates across substrates. The numbers aren't bolted on; they're the main point."
  **Honest Note:** Parfit implies degrees too. The difference is emphasizing aggregation over reduction.

  **5. "There is no 'I' to distribute. That's the confusion."** (The Meditator)
  **Reply:** "I agree the singular, indivisible 'I' is an illusion. That's Hofstadter's whole point. But the *pattern* itself is real, like a software process. You can distribute a process across cores. Denying the self doesn't deny the computation."
  **Honest Note:** Risks talking past each other. They mean phenomenological self; I mean functional pattern.

  **6. "Are you borrowing quantum measure without the physics?"** (The MWI Person)
  **Reply:** "The math is analogous, but the ontology isn't. Quantum measure comes from physics; this measure comes from information topology. I'm borrowing the arithmetic of aggregation, not the wavefunction. It works even in a classical universe."
  **Honest Note:** Borrowing machinery without ontology is risky. They may press on why the arithmetic applies.

  **7. "If I copy myself, do I owe the copy money?"** (The Pragmatist)
  **Reply:** "If the copy is high-fidelity and divergent, yes, you have obligations proportional to the measure. But practically, once they diverge, they become separate claimants. You owe the *process* welfare while it overlaps, then they own their own futures."
  **Honest Note:** Practical nightmare. Doesn't address legal identity, only moral weight.

  **8. "What exactly counts as the core pattern?"** (The Killer)
  **Reply:** "That's the hard boundary problem. I define 'core' as the dispositions that drive behavior in situations the original cared about. It's fuzzy, yes. But 'person' is always fuzzy. We're drawing a contour map on a mountain, not cutting a diamond."
  **Honest Note:** This is where the view collapses if pressed. 'Situations the original cared about' is circular.

  **Critical Success Condition:** Reply #3 (Measure vs. Probability) must land. If this is just verbal, the thesis loses its normative force.

  **The Killer:** Objection #8. If you cannot define the pattern boundary without circularity, the measure is undefined.

  \answer{The core pattern boundary}
