      *   *Claim (i):* "conditional probability... is not really a probability but a bookkeeping device"
          *   *Analysis:* This is a philosophical interpretation, not a mathematical consequence. Many accept conditional probability as primitive (e.g., Popper functions) without accepting the Equation for conditionals.
          *   *Verdict:* Controversial/Overstated.
