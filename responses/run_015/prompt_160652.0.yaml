      *   **Tone:** Specialist, precise, pedagogical, correcting misconceptions without being pedantic.
      *   **Key Technical Points to Verify:**
          *   Does Lewis require the thesis for conditionalized probabilities? Yes, this is crucial. It's often stated as "The thesis holds for any admissible probability function."
          *   How many atoms? Lewis (1976) uses 4. Hájek showed 3 is enough if you assume the thesis holds for all functions in a connected set.
