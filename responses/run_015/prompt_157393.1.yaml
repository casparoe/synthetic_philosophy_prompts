  # Q&A PREPARATION SHEET: Stage Theory and Criminal Liability

  **Presenter:** [Your Name]
  **Seminar:** Philosophy of Law Reading Group
  **Thesis:** Criminal liability is an inter-stage relation grounded in psychological/causal continuity, not a property of an enduring subject.

  ---

  ## PART 1: PRIORITY OBJECTIONS
  *Ordered by likelihood and potential damage to the thesis.*

  ### 1. The "Vicarious Liability" Objection (Hybrid: Legal & Metaphysical)
  **Likelihood:** Very High | **Damage:** Critical
  **Phrasing (Legal Scholar):** "If the accused in the dock is not numerically identical to the perpetrator, you are effectively punishing one person for the crimes of another. This violates the fundamental principle that punishment must be personal. How is this distinct from vicarious liability or corrupt blood?"
  **Phrasing (Metaphysician):** "If stage $S_2$ (trial) is not identical to stage $S_1$ (crime), on what basis does $S_2$ deserve retribution? You seem to be conflating *responsibility* with *causal connection*. Distinct existents cannot inherit desert."

  **Definite Reply:**
  I reject the premise that desert requires numerical identity. Desert attaches to the *continuant* constituted by the relevant I-relations, not the instantaneous stage. Punishing $S_2$ is not punishing a 'other'; it is the administration of a normative consequence to the current temporal part of a person-line that bears the appropriate causal and psychological connection to the wrongful act. We do not punish $S_2$ *for* $S_1$'s act as a stranger; we punish $S_2$ because $S_2$ is the current locus of the agency initiated by $S_1$. Identity is not the necessary condition for liability; appropriate continuity is.

  **Weakest Point:**
  This relies on a non-standard definition of 'desert'. Retributivism traditionally demands the *same* subject suffer for the *same* subject's act. My view edges towards a forward-looking justification (managing the person-line) disguised as retribution.

  **Concession Strategy:**
  **Yes.** Concede that this requires a revision of the *concept* of retribution, but deny it undermines the *justice* of the outcome. Admit that traditional retributivism is incompatible with stage theory, but argue traditional retributivism relies on a false metaphysics anyway.

  ### 2. The "Doctrinal Incoherence" Objection (Legal Scholars)
  **Likelihood:** High | **Damage:** High
  **Phrasing:** "The law operates on the presupposition of identity. Statutes refer to 'the person' who committed the act. Pleas of *autrefois acquit*, statutes of limitation, and insanity defences all presuppose an enduring subject. Your ontology renders the current legal code semantically incoherent. Are you proposing we rewrite the penal code?"

  **Definite Reply:**
  No, I am not proposing we rewrite the code, but rather how we interpret its ontological commitments. Legal terms like 'person' are functional designators for a series of stages bound by legal and psychological continuity. The law already accepts fictions (corporate personhood); treating natural persons as stage-lines is a more accurate fiction, not a breakdown. The doctrine remains coherent if we understand 'the accused' as a rigid designator for the relevant person-line at the time of trial, not a metaphysical claim about enduring substance.

  **Weakest Point:**
  Legal scholars are right that 'identity' is baked into precedent. Arguing it is a 'functional designator' may look like semantic sleight-of-hand to a judge bound by stare decisis.

  **Concession Strategy:**
  **No.** Do not concede that the law requires metaphysical endurantism to function. Maintain that the law is metaphysically neutral and my theory provides a better underpinning.

  ### 3. The "Normative Disconnect" Objection (Metaphysicians)
  **Likelihood:** Medium | **Damage:** Medium
  **Phrasing:** "Standard stage theory (Sider, Hawley) is a thesis about persistence and modality, not normativity. You are deriving an 'ought' (liability) from an 'is' (temporal parts). Even if stage theory is true, why does temporal counterpart relations ground *blame*? You haven't bridged the is-ought gap."

  **Definite Reply:**
  I am not deriving normativity from ontology alone. I am arguing that the *conditions* for normativity (agency, memory, intention) are best explained by the causal relations between stages, not by a mysterious enduring substratum. If agency is a process occurring across time, then liability must track that process. Endurantism posits a 'self' that does no explanatory work. Stage theory aligns the metaphysics of agency with the metaphysics of liability. The 'ought' comes from the necessity of regulating agents, not the temporal parts themselves.

  **Weakest Point:**
  It is difficult to explain why *causal* continuity suffices for *moral* continuity without smuggling in a notion of a unified self.

  **Concession Strategy:**
  **Yes.** Concede that stage theory does not *generate* normativity ex nihilo, but insist it removes the metaphysical obstacles that endurantism creates (e.g., the problem of change).

  ### 4. The "Redundancy" Objection (Legal Scholars)
  **Likelihood:** Medium | **Damage:** Low
  **Phrasing:** "Even if you are right metaphysically, what practical work is this doing? The outcome of trials won't change. The same people get punished. This is ontological meddling without jurisprudential cash-value."

  **Definite Reply:**
  It changes the justification for punishment in edge cases, specifically regarding severe psychological disruption (dissociation, radical transformation, dementia). Endurantism forces us to say the 'same person' is liable even if psychological continuity is severed, which is unjust. Stage theory allows us to say liability dissolves when the I-relation dissolves. It provides a metaphysical grounding for the intuition that a radically changed person should not be punished, which endurantism cannot accommodate without contradiction.

  **Weakest Point:**
  Current law already handles radical change via insanity or diminished responsibility defences without needing stage theory.

  **Concession Strategy:**
  **No.** Argue that current defences are ad hoc and inconsistent, whereas stage theory offers a unified principled basis for them.

  ---

  ## PART 2: THE QUESTION I HOPE NOBODY ASKS

  **"If the perpetrator stage ceases to exist (e.g., through radical psychological break or time), and you punish the successor stage, isn't this functionally indistinguishable from punishing a child for a parent's crime, merely with a shorter generational gap? If identity is not required, what stops liability from sliding down the person-line to a stage that has no memory or connection to the act other than causal?"**

  **Why this is dangerous:**
  This exposes the fragility of the 'I-relation'. If I deny numerical identity, the distinction between 'me tomorrow' and 'my son' is one of degree (psychological connectedness), not kind. If I admit it is one of degree, I open the door to attenuated liability. If I deny it, I smuggle identity back in. It forces me to define a 'cut-off' point for liability that looks arbitrary without an enduring self to anchor it.

  **Prepared Defence (if asked):**
  I must bite the bullet: it *is* a difference of degree. However, the degree of psychological connectedness between temporal stages of a human life is qualitatively distinct from inter-generational relations due to the unique causal closure of the biological organism and the specific nature of autobiographical memory. We draw the line at the biological/life boundary, not the metaphysical self boundary.

  ---

  ## PART 3: SELF-CRITICAL NOTE ON METAPHYSICAL LIBERTIES

  **Note to Self:**
  In applying Stage Theory to legal responsibility, I am taking two significant liberties that must be acknowledged if pressed:

  1.  **Normativising Descriptive Metaphysics:** Standard Stage Theory (e.g., Sider) is a descriptive account of persistence. I am treating it as a normative framework for *desert*. This risks the naturalistic fallacy. I am assuming that because the self *is* a stage, responsibility *ought* to be distributed across stages. This requires a stronger bridge principle than I have currently drafted.
  2.  **Legal Personhood vs. Metaphysical Personhood:** I am treating the 'legal person' as co-extensive with the 'metaphysical person'. Legal personhood is a status conferred by the state (which can be stripped or granted to corporations); metaphysical personhood is a matter of fact. By conflating them, I risk category errors. If the law constructs the person, my metaphysical claims about stages may be irrelevant to the legal construct. I must clarify that I am arguing for the metaphysics *underpinning* the legal construct, not replacing the construct itself.

  ---

  ## PART 4: STRATEGIC REMINDERS

  *   **Tone:** Do not be apologetic about the metaphysics. The legal scholars' discomfort is a feature, not a bug; it shows their doctrine relies on unexamined assumptions.
  *   **Vocabulary:** Use 'I-relations' and 'temporal parts' with the metaphysicians, but switch to 'continuity of agency' and 'normative locus' for the lawyers.
  *   **The Trap:** Do not let the lawyers drag you into discussing specific statutes. Keep the debate at the level of justification and principle.
  *   **The Trap:** Do not let the metaphysicians trap you in a debate about the semantics of 'identity'. Insist that *what matters* is continuity, regardless of the label.

  **British English Check:** Ensure 'defence', 'analyse', 'programme', and 'licence' are used correctly. Avoid Americanisms like 'attorney' (use 'counsel' or 'barrister/solicitor' if specific reference is needed, otherwise 'accused').
