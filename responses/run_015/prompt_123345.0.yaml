answer: |-
  Here is the proposed research agenda. It is ordered by logical dependency and instrumental leverage. The ranking is not based on philosophical importance in the abstract, but on which questions must be settled to make the subsequent work possible, and which questions offer the highest probability of producing a defensible result within the three-year constraint.

  ### 1. Is letter identity defined by intra-face contrast rather than intrinsic shape?
  **The Upstream Argument:** This is the architectural constraint for the entire pilot. If 'a'-ness is intrinsic (a specific topological invariant), the generative model can be trained to optimize for shape features in isolation. If 'a'-ness is contrastive (defined by its difference from the 'o', 'd', and 'u' of the same face), the model must generate *systems*, not glyphs. A failure to prioritize this leads to a category error in the tool's architecture: you cannot build a generator that treats letters as independent tokens if their identity is relationally constituted. This must be decided before we write the loss function.
  **Feasibility:** High. The type designer can construct minimal pairs of faces where the 'a' is morphologically identical but the surrounding glyphs vary, while the psychophysicist measures recognition latency. The philosophers can formalize the conditions for "contrastive identity."
  **Neglected vs. Unsolved:** Neglected. Structuralism in linguistics is old news, but it has rarely been operationalized for visual glyph generation. Most computational typography assumes intrinsic features (strokes, terminals) are the primary carriers of identity.
  **18-Month Trigger:** If the generative model produces high-recognition 'a's only when the rest of the alphabet is present, but fails in isolation, this question moves from theoretical to empirically settled (favoring contrast). If isolation works fine, it moves down, and we focus on intrinsic invariants.
  **Confidence:** High.

  ### 2. Does recognition depend on inferring a style prior to disambiguating the glyph?
  **The Upstream Argument:** This is the empirical test of Question 1. If readers must first infer "this is a Humanist Sans" before they can see "this is an 'a'," then style is not a secondary attribute; it is the context of intelligibility. This determines whether the generative model's latent space should be organized by *letter* (all 'a's together) or by *style* (all Futura together). If the latter, the "category" of 'a' is a slice through a style space, not a cluster in a shape space.
  **Feasibility:** High. This is the core task for the psychophysicist and modeler. It requires measuring recognition accuracy of glyphs in isolation vs. context, seeded with varying amounts of stylistic information.
  **Neglected vs. Unsolved:** Unsolved. We know context matters, but we do not know the *order of operations* in the cognitive pipeline (Style-then-Letter vs. Letter-then-Style).
  **18-Month Trigger:** This is the milestone mentioned in your brief. If the model succeeds in context but fails in isolation, this question is validated as the mechanism for Question 1. If the model fails in both, the problem is not contrast but feature extraction, and this question drops in priority.
  **Confidence:** High.

  ### 3. What settles identity when designer intention, reader perception, and encoding come apart?
  **The Upstream Argument:** This is the normative resolution required for the tool builders. Questions 1 and 2 describe *how* recognition works; this question dictates *what to do* when the system produces an edge case (e.g., a glyph the model labels 'a' but readers call 'u'). If perception trumps intention, the tool must include a "readability validator" that overrides the designer's tag. If intention trumps perception, the tool is merely a drafting aid, not a communication engine. You cannot ship a tool without a rule for error handling.
  **Feasibility:** Medium. It requires philosophical argumentation grounded in the data from Q1 and Q2. It cannot be answered purely empirically, but the empirical data will constrain the viable normative theories.
  **Neglected vs. Unsolved:** Neglected. Philosophy of language focuses on reference; type design focuses on aesthetics. The conflict between semantic encoding (Unicode) and visual phenomenology is usually handled by fiat, not theory.
  **18-Month Trigger:** If the generative model produces "uncanny" glyphs that confuse readers, this question moves up. If the model is robust, this becomes a theoretical footnote.
  **Confidence:** Medium.

  ### 4. Is style a residue (variation after identity is fixed) or constitutive (part of the identity conditions)?
  **The Upstream Argument:** This refines Question 2. If style is a residue, we can separate "content" (letter) from "form" (style) cleanly. If style is constitutive, then a "style-less 'a'" is a contradiction. This impacts how the generative model disentangles latent variables. However, it is downstream of Q1 and Q2 because we need to know *that* context matters before we determine *how* style functions within that context.
  **Feasibility:** Medium. The type designer and philosopher can collaborate here to map the "style space."
  **Neglected vs. Unsolved:** Unsolved. Designers speak intuitively about style; philosophers speak about properties. Bridging the two to define "constitutive style" is novel.
  **18-Month Trigger:** If Q2 confirms that style inference is a prerequisite for recognition, this question moves up. If recognition is style-invariant, this question is dissolved.
  **Confidence:** Medium.

  ### 5. Is the letterform a valid model for categories generally, or is it special due to teleological design?
  **The Upstream Argument:** This is the philosophical payoff, but it must be last. We cannot claim letters are like tigers (or unlike them) until we have a working theory of what makes a letter a letter. If we answer this first, we are speculating. If we answer it last, we are generalizing from data. It is the "export" question for the philosophers, dependent on the success of the "import" questions (1–4).
  **Feasibility:** Low/Medium. It depends on the success of the previous four. If the pilot fails to define letter identity, we cannot generalize from it.
  **Neglected vs. Unsolved:** Unsolved. Cognitive science often uses letters as proxies for objects, but rarely interrogates the validity of that proxy given the artificiality of scripts.
  **18-Month Trigger:** If Q1–Q4 yield clear results, this moves up as the primary writing task for year 3. If Q1–Q4 are inconclusive, this question is cut to save space for damage control.
  **Confidence:** Low.

  ***

  ### The Cut Question
  **"To what extent is letter recognition constituted by the motor potential for writing the glyph?"**
  **Reason for Cutting:** This is a fashionable question in embodied cognition and philosophy of mind. However, it is low-yield for *this* specific pilot. Your team includes a psychophysicist (vision) and a generative modeler (pixels/vectors), but no motor-control specialist. Furthermore, the brief focuses on *generated typefaces* (visual artifacts), not handwriting. Introducing motor imagery adds a variable the team cannot measure and the model does not simulate. It risks turning a tight, three-year investigation into a speculative debate about mirror neurons that produces no defensible tool and no clear philosophical output regarding visual categories.

  ***

  ### Confidence and Uncertainty
  **Confidence in Rankings:**
  *   **Q1 (Intrinsic vs. Contrastive):** High Confidence. This is the logical prerequisite.
  *   **Q2 (Style Inference):** High Confidence. This is the empirical bottleneck.
  *   **Q3 (Authority):** Medium Confidence. Normative resolutions are often messy.
  *   **Q4 (Style Constitution):** Medium Confidence. Depends heavily on Q2's results.
  *   **Q5 (Generalizability):** Low Confidence. Extrapolation is always risky.

  **Least Sure Claim:**
  I am least sure of the claim that **Question 3 (Authority/Identity Conflicts)** can be satisfactorily resolved within three years. While we can establish *how* readers misidentify glyphs, settling the normative question of whether the designer or the reader holds the "truth" of the category touches on deep issues in the philosophy of language (authority, usage, and meaning) that historically resist settlement. It is possible this question will remain a "defensible tension" rather than a solved problem, which may frustrate the tool builders who need a binary rule for their software.
