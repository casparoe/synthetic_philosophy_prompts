      *   *Wait, a stronger candidate:* **The United States in the Gilded Age / Progressive Era**. High inequality, corruption, norms tested, but *no* civil war (second one) and no dictatorship. It shows backsliding can be reversed or managed.
      *   *Let's go with:* **Weimar** is the warning, **Gilded Age** is the context. But for the specific "backsliding" mechanism, **Levitsky and Ziblatt's "How Democracies Die"** (party gatekeeping) is the modern theoretical equivalent.
