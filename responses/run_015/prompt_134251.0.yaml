answer: |-
  **The Question**
  Can a relational ontology of personhood, specifically rooted in Ubuntu conceptions where personhood is constituted through reciprocal recognition, ground genuinely structural obligations to repair the relational fabric sustaining personhood? Crucially, can this be achieved without collapsing into methodological individualism, which treats harm only as an aggregate of individual injuries, or slipping into full corporate agency, which treats the community as a single moral agent with independent rights?

  **The Gap in Existing Answers**
  Current debates in transitional justice and distributive ethics leave this question open because they operate within a restrictive metaphysical binary. Group-based moral claims are typically analyzed as either summed individual claims or claims belonging to a corporate entity. This framework leaves no conceptual space for obligations that target the conditions of relational personhood directly. Consequently, policies aimed at social repair often misidentify the object of restitution, focusing on individual compensation or abstract state-level apologies rather than restoring the specific reciprocal networks that constitute agency and identity within affected communities. The normative leap from relational ontology to collective obligation remains unjustified because the specific object of that obligation—the relational fabric itself—lacks a distinct categorization in current literature.

  **The Approach**
  The project employs conceptual analysis combined with case-based testing. First, I will construct a normative framework distinguishing "relational-constitution harm" from both individual harm and corporate-agent harm by defining the necessary and sufficient conditions for such harm. This involves articulating how damage to the relational fabric constitutes a distinct moral injury that is not reducible to the sum of its parts nor attributable to a metaphysical group mind. Second, I will apply this framework to institutional reparative contexts, such as truth commissions or land restitution programs. By examining specific policy mechanisms, I will test whether the relational view yields determinate, non-redundant obligations that differ from those generated by individualist or corporate models. This bridges abstract ontology with concrete policy design.

  **Success and Failure Conditions**
  A successful result demonstrates that structural obligations are coherent and practically distinguishable. Specifically, the framework must identify reparative duties that are invisible to individualist accounts, which miss the structural damage, and unnecessary for corporate accounts, which over-mystify the group. Success means showing that repairing relational capacity is a distinct policy goal. Failure occurs if the relational view cannot avoid reducing to individualism, making the structural talk merely metaphorical, or if it slides into group-agent metaphysics, requiring untenable ontological commitments about collective personhood. If the framework cannot generate specific policy recommendations distinct from existing models, the project fails to bridge philosophy and public policy.

  **Realistic Scope**
  This project is feasible within nine months because it prioritizes conceptual clarity over exhaustive empirical survey. The goal is to establish the philosophical coherence of structural obligations, not to draft comprehensive legislation. I will limit case testing to two or three well-documented transitional justice contexts to ensure depth without overextension. A key limitation to accept is that this proposal will not resolve all metaphysical tensions regarding collective agency; instead, it aims to show that a functional account of structural obligation is possible without settling those deeper ontological debates. The output will be a robust theoretical framework ready for further empirical validation, rather than a final policy blueprint. The final deliverable will be a working paper suitable for both philosophical journals and policy think tanks, ensuring the interdisciplinary reach required by the fellowship.
