      *   **Section 2: The Ethics of Admission (Desert and Merit):**
          *   Meritocratic gating in both systems suggests a belief in "fair equality of opportunity" (Rawls).
          *   *The Tension:* In debt systems, merit protects you from *debt* (scholarships) or just grants access to the *opportunity to go into debt*. In tax systems, merit grants access to *subsidy*.
          *   *Implicit Theory:* "Cognitive Merit" creates a claim on public resources (in tax systems) or a license to leverage future earnings (in debt systems).
      *   **Section 3: Risk and the Social Contract:**
