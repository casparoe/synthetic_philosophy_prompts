      *   *Intergenerational Obligation:* Do current taxpayers fund future earners? Do parents fund children?

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the prompt's depth. State the thesis: The hybrid model reveals a tension between *liberal egalitarianism* and *neoliberal human capital theory*, resulting in a "Meritocratic Aristocracy" funded by contradictory logics.
      *   **Section 1: The Ontology of the Degree (Asset vs. Position):**
          *   Analyze the "Private Investment" frame (US/UK).
          *   Analyze the "Public Good" frame (DE/Nordic).
