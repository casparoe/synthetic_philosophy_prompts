          *   Is education treated as a private asset *and* a positional good?
          *   What view of moral desert is implied (do the "admitted" deserve subsidy/debt protection)?
          *   What is the social contract regarding risk-bearing?
          *   Distinguish what practice *requires* vs. what *fits* it.
