          *   DE/Nordic: State bears risk (taxes spent even if student drops out).
          *   *Philosophical Commitment:* Is education a gamble or a safety net?
      *   **Section 4: Philosophical Underdetermination:**
          *   Can different ideologies justify the same structure?
          *   *Libertarian:* Might support selective private uni, but not state-subsidized selective uni.
          *   *Egalitarian:* Supports tax-funded, but might object to selectivity if it reinforces class.
          *   *Capabilities (Sen/Nussbaum):* Focus on what people can *do*. Selectivity might hinder capabilities.
          *   *Conclusion on Underdetermination:* The current hybrid is unstable. It tries to be efficient (market) and fair (state) simultaneously.
      *   **Section 5: Counterfactuals (Pure Private vs. Pure Public):**
          *   *Pure Private:* University becomes a luxury good. Admissions = Ability to Pay. No meritocracy.
          *   *Pure Public Infrastructure:* University becomes like high school. Open access. Credential inflation.
