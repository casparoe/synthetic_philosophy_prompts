  **TO:** Social Studies Curriculum Advisory Committee
  **FROM:** Student Representative
  **DATE:** December 1, 2024
  **SUBJECT:** Recommendation for Anthropocene Periodization Artifacts

  I recommend we adopt **1610** as the start year for the Anthropocene banner and unit statement. This recommendation rests on the understanding that we are making a *pedagogical periodization* for a social studies course, not a formal geologic ratification. Our standing to decide this derives from our educational mandate to construct coherent historical narratives, not from scientific authority. We are choosing a date that best serves student understanding of human-earth systems within the scope of ninth-grade world history.

  **Proposed Artifacts**
  *   **Timeline Banner:** "Anthropocene [1610: Orbis Spike Marker]"
  *   **Periodization Statement:** "This unit periodizes significant human impact on earth systems from 1610, based on documentable atmospheric changes coinciding with globalized colonization."

  **Rationale**
  For history teachers, 1610 integrates seamlessly with the existing ninth-grade narrative of the Columbian Exchange and early modernity, whereas 1950 requires scaffolding unrelated to the course's chronological focus. For the administration, the "stated-rationale convention" ensures neutrality; by explicitly labeling 1610 as a marker based on specific criteria (the Orbis Spike), we present it as a transparent teaching tool rather than an unquestionable fact. For the science department, while I acknowledge the critique that any single date simplifies diachronous evidence, 1610 offers a documentable proxy (ice core CO2 dips) that connects human demographic history to stratigraphy without claiming global simultaneity.

  **The Case for 1950**
  I give full weight to the argument for 1950. Stratigraphically, the radionuclide marker from nuclear testing is globally synchronous and physically unambiguous in a way the 1610 CO2 signal is not. Choosing 1950 avoids contested historical causality regarding Indigenous demographic collapse and aligns with the Anthropocene Working Group's preferred reference, even if unratified. It is the scientifically safer choice for avoiding claims about historical blame. If our primary goal were geological precision rather than historical narrative, 1950 would be the only defensible option.

  **Regarding the Petition**
  The student petition requests 1610 to assign responsibility. We cannot use a stratigraphic marker to assign moral blame; that is a category error. However, we can mark a correlation between human systemic changes and earth system shifts. Adopting 1610 acknowledges the petition's core insight—that the Anthropocene is tied to specific human histories—without violating the requirement for documentable criteria.

  **Confidence Note**
  I am highly confident in the pedagogical utility of 1610 for this specific course and in the definition of this decision as a pedagogical periodization rather than a scientific ruling. I am moderately confident that the stated-rationale convention satisfies the requirement for neutrality. I am least sure about the science department's reception; while the rationale is transparent, the claim that 1610 is "documentable" rests on interpreting a small signal, and I acknowledge the validity of the argument that no single year accurately describes the evidence.
