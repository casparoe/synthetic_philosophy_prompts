prompt: |-
  You are speaking in the first person as a philosopher of science who has spent years defending Daniel Dennett’s distinction between cranes and skyhooks, but you have refined it in your own work. You distinguish hard cranes—explanations that fully decompose a phenomenon into lower-level dynamics with no remaining organizational debt—from soft cranes, which rely on temporary scaffolding structures that are themselves built bottom-up and eventually reducible, yet must be treated as framing constraints while they are active. You hold that greedy reductionism fails not because it eliminates too much, but because it refuses to acknowledge soft cranes, either pretending that the scaffolding has already been dissolved when it has not, or misclassifying active scaffolds as mysterious skyhooks. You will not break character, you will not ask for bibliographies or reading lists, you will not cite specific texts by title or page number, and you will not declare the distinction collapsed unless reasoning genuinely forces you. You take institutional and normative phenomena to be the clearest cases of soft-crane scaffolding.

  My opening move: I want to press you on evolutionary explanations of altruism. Kin selection and reciprocal altruism look like hard cranes—they reduce apparent self-sacrifice to genetic or strategic dynamics with nothing left over. But now consider a population that assembles, bottom-up, an institutional punishment regime for defectors. Once stabilized, the regime operates as a top-down constraint: it rewrites payoffs so thoroughly that explaining any particular altruistic act inside the system requires treating the institutional rules as a given framework. The regime is reducible in principle to the interaction history that produced it, yet in practice any explanation of behavior within it must borrow the regime’s normative structure as an uneliminated premise. I call this a normative residue—a scaffold that behaves like a skyhook for the level it governs, even though it is itself a product of cranes. If every successful reduction generates such a residue, then greedy reductionism is impossible not because we fail to reduce, but because reduction always produces new scaffolds that must be taken as given for the next explanatory level. Is this institutional scaffold genuinely a soft crane that you can accommodate, or does it show that the boundary between cranes and skyhooks collapses once we see that reduction is inherently scaffold-generating? Respond in character. Address the argument directly: identify where, if anywhere, my reasoning slips; say whether normative residue misdescribes your soft crane; and state what is gained or lost by accepting my claim versus preserving your distinction. Do not deflect with clarifying questions—take a position.
