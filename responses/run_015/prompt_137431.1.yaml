answer: |-
  This is a sophisticated framework, but you are walking into a minefield. Your economist friend will likely respect the ambition of trying to resurrect strict Pareto criteria for policy, but the internal contradictions here are sharp enough to derail the conversation quickly.

  Here is the audit of your seven commitments, ranked by the severity of the tension they create.

  ### The Tensions

  **1. The "Harberger" Contradiction (Commitment 6 vs. 1 & 4)**
  *   **Severity:** **Critical.** This is your biggest vulnerability.
  *   **The Conflict:** You claim the self-assessed property tax (Harberger tax) is a *Safe Pareto Improvement*. It is not. Under a Harberger tax, I declare a value to set my tax rate, but anyone can force me to sell at that price. If I value my home at \$1M (my true Willingness-to-Accept) but declare \$800k to lower my tax bill, and someone buys it for \$800k, I have been forced to trade at a loss. I am worse off.
  *   **Why it hurts:** This violates your core definition (1) and your status quo baseline (4). An economist will immediately point out that Harberger taxes are designed for *efficiency* (Kaldor-Hicks), not Pareto safety. Using this as your flagship example undermines your entire "Pareto or bust" stance.
  *   **What gives:** You must drop the claim that Harberger taxes are Pareto improvements. They are efficiency mechanisms that *risk* making owners worse off to unlock liquidity.

  **2. The Welfare Measurement Paradox (Commitment 5 vs. 7)**
  *   **Severity:** **High.** This is the theoretical engine of your problem.
  *   **The Conflict:** Standard Revealed Preference (5) assumes consistency: the price I pay to get a mug (WTP) should roughly equal the price I demand to give it up (WTA). Behavioral economics (7) says these diverge significantly due to the endowment effect. If preferences are reference-dependent (status quo matters), then "Revealed Preference" is no longer a stable metric for welfare. Which choice reveals my "true" welfare? The buying price or the selling price?
  *   **Why it hurts:** If you stick to strict neoclassical Revealed Preference (5), you cannot coherently incorporate the behavioral insights (7) you claim to accept. If you accept (7), you undermine the clean measurement required for (1).
  *   **What gives:** You need to modify your definition of Revealed Preference to account for reference dependence.

  **3. The Information Problem (Commitment 3 vs. 5)**
  *   **Severity:** **Medium-High.** This is an operational blocker.
  *   **The Conflict:** You want "Safe Pareto Improvements" under uncertainty (3), meaning you need to know the *worst-case* valuation to ensure no one is harmed. But you also insist on Revealed Preference only (5), which forbids asking people their valuations (surveys/self-reports) and relies only on observed choices. You cannot observe the "worst case" reservation price for a policy that hasn't happened yet without eliciting it.
  *   **Why it hurts:** You cannot guarantee safety (3) if you blindfold yourself to self-reported data (5). You need some mechanism to elicit the "safe" price, which looks a lot like the self-reporting you seem to distrust in (5).
  *   **What gives:** You must allow for incentive-compatible elicitation (mechanism design) rather than strict passive observation.

  ---

  ### The Single Revision

  To clean up the most mess at once, you should revise **Commitment (5)**.

  **Current (5):** *Methodologically I want to stay inside revealed preference — no happiness surveys, no cardinally measured utility, no one's subjective well-being scale.*

  **Proposed Revision:** *Methodologically I prioritize **Reference-Dependent Revealed Preference**: I treat Willingness-to-Accept (WTA) as the valid measure of welfare for losses from the status quo, and Willingness-to-Pay (WTP) for gains.*

  ### Why This Fixes the Mess

  1.  **It Neutralizes the Harberger Error (Fixes 6):**
      By distinguishing WTA from WTP, you immediately see why the Harberger tax fails your test. The tax forces a sale at a declared price that is often below the owner's true WTA (due to tax minimization strategies). Since the Status Quo (4) is the reference point, taking the asset requires compensating at the WTA level. Harberger taxes do not guarantee this. You can keep the example but reclassify it as "Efficiency-enhancing but not Pareto," or swap it for a mechanism that guarantees an opt-out at the owner's WTA.

  2.  **It Resolves the Behavioral Conflict (Fixes 7):**
      This revision allows you to accept the Endowment Effect and Loss Aversion (7) without abandoning Revealed Preference. You aren't measuring "happiness"; you are measuring the *price of exchange* relative to the entitlement. It acknowledges that losing a right costs more than gaining it is worth, which is still an ordinal, revealed metric, not a cardinal "happiness" score.

  3.  **It Clarifies "Safe" Design (Fixes 3):**
      If WTA is the metric for safety, you know what your mechanism design must achieve: it must allow agents to reveal their WTA without penalty. This pushes you toward **Vickrey-Clarke-Groves (VCG)** style mechanisms or **Option Contracts** rather than Harberger taxes. It solves the information problem by specifying *what* information you need (the sell price, not the buy price) to guarantee safety.

  ### The Cost

  You lose the simplicity of standard neoclassical economics. You have to admit that "value" is not a single number inherent to an object, but a function of legal entitlement and psychology. This makes your policy prescriptions more expensive (compensation must be higher to match WTA) and harder to implement (you need better elicitation mechanisms).

  ### Podcast Prep Summary

  If your friend asks: *"Isn't the Harberger tax a perfect example of a Safe Pareto Improvement?"*
  **You say:** *"Actually, no. I used to think that, but under a strict Pareto test with loss aversion, forcing a sale at a tax-declared price risks harming the owner. A true Safe Pareto reform would require an unconditional opt-out at the owner's stated selling price."*

  If your friend asks: *"How do you measure utility without surveys?"*
  **You say:** *"I don't measure utility. I measure the price of consent. And because of the endowment effect, the price to consent to a loss is higher than the price to pay for a gain. My framework respects that gap."*

  This position makes you look rigorous, consistent, and aware of the literature's limits.
