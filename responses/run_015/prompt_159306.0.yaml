answer: |-
  # Joint Statement on Neural Computation
  **Adversarial Collaboration: [Realist] & [Ascriptivist]**

  ### I. Agreed Claims

  We, the undersigned, have debated the ontology of neural computation for a decade. While we disagree on the metaphysical status of computation, we agree on the following substantive claims regarding neuroscience practice and the physical nature of the brain. These claims are not placeholders for future agreement; they are the foundation upon which our disagreement rests.

  1.  **Multiplicities of Description:** A single physical neural system can be accurately captured by multiple, formally distinct computational models simultaneously. These models may posit different internal states or algorithms. Their coexistence does not imply physical contradiction, but rather reflects different levels of abstraction or explanatory interests.
  2.  **Empirical Credentials:** The validity of a computational model in neuroscience is determined by its capacity to support successful prediction and intervention, not by intuitive appeals to what the tissue is "really" doing. A model that fails to predict the outcome of perturbation is defective, regardless of its metaphysical elegance.
  3.  **Physical Constraints:** The brain is a messy, wet, partly analogue, noise-ridden physical object. Any viable account of neural computation must accommodate continuous dynamics, metabolic constraints, and stochasticity. The brain is not a tidy, clock-driven digital symbol manipulator, and models assuming otherwise are idealizations that must be justified by their utility.
  4.  **Indispensability:** Computational vocabulary is currently indispensable for cognitive science. It allows researchers to generalize across substrates (e.g., from octopus to human) and to design interventions that would be opaque under purely dynamical or biochemical descriptions. Abandoning this vocabulary would stall progress, regardless of its ontological status.
  5.  **Mapping Requirement:** Identifying a computation requires a mapping scheme between physical states (e.g., voltage spikes) and formal states (e.g., binary digits). There is no computation without a mapping, though we disagree on what constrains this mapping.

  ### II. Points of Disagreement

  The following table isolates the specific cruxes where our views diverge. We have refined the standard formulations of these problems to avoid talking past one another. For each crux, we specify a test case and record our distinct predictions.

  | Crux | Realist Formulation | Ascriptivist Formulation | Agreed Test Case | Predictions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Constraints on Mapping** | Computation is intrinsic to the system. The physical structure constrains which mappings are *true*. Only one computational description (or a narrow set) correctly captures the causal structure of the circuit. | Computation is ascribed by the observer. The pragmatic interests of the researcher constrain which mappings are *useful*. Indefinitely many incompatible computations can be truly ascribed relative to different interests. | **The "Black Box" Fit:** A model fits a circuit's spiking behavior under every current intervention, but its internal variables correspond to no identifiable physical substrate (e.g., distributed weights with no local correlate). | **Realist:** The fit is insufficient. Without structural correspondence, the circuit does not *perform* that computation; it merely mimics it.<br>**Ascriptivist:** The fit + utility settles the ascription. If it predicts interventions, the circuit computes that function relative to our model. |
  | **2. Implementation Independence** | Computation is implementation-independent. The same computational process can be realized in physically distinct substrates (e.g., silicon vs. tissue) without loss of identity. Physical details are irrelevant to the computational kind. | Implementation independence is a feature of the *model*, not the system. Physical details determine which ascriptions are stable. If physical detail changes, the computational description may need to change to remain useful. | **The "Fine-Grain" Collapse:** A circuit's behavior collapses if time is discretized more coarsely than 0.5ms. The dynamics are highly sensitive to analogue timing variations. | **Realist:** We have not yet found the right computational level. A true computational description exists that abstracts away from this timing sensitivity.<br>**Ascriptivist:** Computation may not be the right vocabulary here. The physical continuity is doing the work; forcing a computational description obscures the mechanism. |
  | **3. Explanatory Surplus** | Computational explanation provides modal strength that dynamical explanation lacks. It explains *why* a mechanism works by identifying the algorithm it implements, supporting counterfactuals about function. | Computational explanation is a summary of dynamical facts. It supports the same counterfactuals as the dynamical model but offers no additional ontological grounding. It is a tool for compression, not a deeper layer of reality. | **Cross-Species Transfer:** An intervention designed using a computational model in Species A succeeds in Species B, despite different neural dynamics. | **Realist:** Success confirms both species instantiate the same computational kind. The computation is the shared real property.<br>**Ascriptivist:** Success confirms the model abstracts away from relevant physical differences. The computation is a shared descriptive tool, not a shared property. |
  | **4. Ontological Commitment** | Saying "the brain computes" is a claim about what the brain *is*. It posits a causal mechanism akin to digestion or contraction. | Saying "the brain computes" is a claim about how we *describe* the brain. It posits a relational property between the brain and the observer. | **The "Verbal" Test:** If we agree on all physical facts and all predictive successes, is there anything left to dispute? | **Realist:** Yes. We disagree on whether the mapping is discovered or imposed. This affects how we interpret model failure.<br>**Ascriptivist:** No. Once physical facts and utility are fixed, the ontological label adds nothing to scientific practice. |

  ### III. Joint Assessment of the Verbal Dispute

  A significant portion of our decade-long debate has been merely verbal, but not all of it. We agree that the term "computation" is polysemous. In computer engineering, it often implies designed intentionality (a realist notion). In mathematics, it implies formal derivability (an ascriptivist notion). When we argue about whether the brain "literally" computes, we are often toggling between these definitions without signaling the switch.

  However, we disagree on whether resolving the terminology dissolves the substantive conflict.

  **What is Merely Verbal:**
  We agree that if the dispute were solely about whether to use the word "computation" for neural dynamics, it would be trivial. If the Realist agrees to say "the brain exhibits computation-relative-to-a-mapping" and the Ascriptivist agrees to say "some mappings are objectively better constrained by physics than others," the verbal gap narrows significantly. Much of the heat in our past debates stemmed from the Realist sounding like a dualist (positing a non-physical algorithm) and the Ascriptivist sounding like an instrumentalist (denying the reality of causal structure). Neither of us holds those extreme views.

  **What is Substantive:**
  The remaining dispute concerns **scientific methodology**.
  For the Realist, believing computation is intrinsic mandates searching for structural isomorphisms between model and brain. If a model works but lacks structural correspondence, the Realist sees this as a temporary success destined to fail on novel interventions.
  For the Ascriptivist, believing computation is ascribed mandates searching for predictive utility regardless of structure. If a model works without structural correspondence, the Ascriptivist sees this as a valid explanation.

  This difference changes how we design experiments. The Realist prioritizes mechanistic decomposition (finding the "bits" in the tissue). The Ascriptivist prioritizes input-output profiling (finding the "function" of the tissue). Therefore, the dispute is not just about words; it is about where to invest resources. We conclude that while the metaphysics may be partially verbal, the methodological divergence is real and productive. Maintaining this tension, rather than resolving it, is likely to yield better neuroscience than either view alone.

  ***

  ### IV. Editor's Note on the Verbal Dispute (AI Analysis)

  *Per the workshop organizer's request, the following analysis assesses the verbal nature of the dispute above.*

  The collaboration above successfully isolates the verbal component, but it arguably underestimates it. The core disagreement in Row 1 (Constraints on Mapping) hinges on the definition of "true." The Realist uses a correspondence theory of truth (mapping matches physics), while the Ascriptivist uses a pragmatic theory (mapping yields success). If both agree that "truth" in science is ultimately cashed out in predictive success and coherence with physical law, the ontological gap collapses.

  However, the dispute is not *entirely* verbal because of Row 4 (Ontological Commitment). The Realist's view imposes a constraint on future theory: if a computational model cannot be physically localized, it must be rejected or revised. The Ascriptivist imposes no such constraint. This leads to divergent falsification conditions. A verbal dispute becomes substantive when it dictates different conditions for being wrong. Since the Realist and Ascriptivist would reject different models in edge cases (e.g., a perfectly predictive "black box" model with no structural match), the dispute retains a substantive core that terminology alone cannot dissolve. The value of this document lies not in solving the metaphysics, but in making the methodological costs of each metaphysical stance explicit.
