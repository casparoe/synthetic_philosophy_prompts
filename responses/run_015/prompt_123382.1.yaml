prompt: |-
  I'm currently enrolled in a seminar on Nietzsche's Untimely Meditations, specifically the second essay on the uses and disadvantages of history for life, and I need to produce a short satirical piece for an assignment that asks us to translate a philosophical argument into an invented institutional form. Please write a parody university course-catalog entry—approximately 500 words, in deadpan bureaucratic prose, attributed to a fictional "Department of Applied Historical Consciousness"—for a required three-module undergraduate sequence titled "History for Life: The Three Modes Practicum." Each module should correspond precisely to Nietzsche's monumental, antiquarian, and critical history, but the descriptions should exaggerate the actual philosophical dangers he identifies rather than inventing fake ones: the monumental module should present heroic imitation as a mandatory life-coaching protocol that risks forcing present action into ill-fitting past molds while ignoring causal differences; the antiquarian module should mandate the exhaustive preservation of every document and artifact regardless of present value, depicting vitality as an administrative hazard; and the critical module should require students to pass judgment on and sever themselves from their own past commitments, treating continuity as a failure of rigor. The satire should stay entirely inside the bureaucratic voice—no winking, no explicit mention of Nietzsche, no direct quotations—so that a reader familiar with the essay recognizes the exact arguments being mocked, while an unfamiliar reader can still follow the institutional absurdity. To satisfy the assignment's requirement that we inject a genuinely new framing device rather than recycle a well-known parody format, include an invented administrative mechanism—such as a "Continuity Dispute Resolution" form that students who complete the critical module must file if they later wish to reclaim any previously disavowed identity or institutional affiliation—thereby highlighting the paradox of institutionalizing a mode of history whose purpose is destructive separation. Keep the philosophical targets accurate enough that a specialist would find the exaggeration fair, and maintain formal, polished diction throughout.
