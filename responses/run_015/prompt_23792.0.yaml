answer: |-
  # Job Talk Q&A Prep: Bootstrapping & Entitlement

  **Context:** Wrightian transmission failure applied to Pryorian dogmatism.
  **Audience:** 2 Reliabilists, 1 Bayesian, ~6 Internalist Generalists.
  **Strategy:** Do not let the Reliabilists bully you into externalism; do not let the Bayesian trap you in incoherence; keep the Generalists comfortable that skepticism hasn't won.

  ---

  ### 1. The Reliabilist "So What?" Objection
  **Likelihood:** High | **Damage:** High
  **Idiom:** Process-Reliabilist (Goldman-style)
  **The Objection:** "You say warrant doesn't transmit for Roxanne. But if her gas gauge *is* reliable, and her vision *is* reliable, she ends up with a true belief produced by a reliable process. Why is your 'transmission failure' a solution? It looks like you're just stipulating that she doesn't know, when the external facts say she does. You're prioritizing a structural constraint over truth-conduciveness."

  **Strategy:** **Hold the Line.**
  **Reply:** "I'm not denying that Roxanne's process is reliable, or even that she might know the gauge is working in a loose sense. My claim is narrower: she cannot *justify* the reliability claim *using that very output* as a premise. Reliabilism tracks the metaphysical link between mind and world; my project tracks the dialectical norms of reasoning. If we allow transmission here, we allow a subject to certify any instrument by its own lights. That makes the concept of 'justification' lose its normative force for the subject. I'm arguing that knowledge requires more than just a reliable chain; it requires that the chain not be epistemically circular in a way that bootstrapping entails. So, I'm not denying the reliability; I'm denying that reliability alone licenses *this specific inference* as a warrant-generator."
  **Weakness Note:** This risks sounding like you're changing the subject from "knowledge" to "argumentative propriety." The Reliabilist will press that knowledge *just is* reliable true belief (plus maybe no defeaters).

  ### 2. The Bayesian "Violation of Conditionalization" Objection
  **Likelihood:** Medium | **Damage:** Critical
  **Idiom:** Formal Epistemologist
  **The Objection:** "If I model this, the subject receives evidence $E$ (gauge reads 'F'). They have a hypothesis $H$ (Gauge is reliable). If $P(E|H)$ is high, standard conditionalization demands $P(H)$ increases. By claiming warrant doesn't transmit, you're effectively saying the subject *should not* update their credence in $H$ despite receiving $E$. Isn't this just a mandate to be irrational? You're asking agents to ignore likelihood ratios."

  **Strategy:** **Concede a Narrowed Version.**
  **Reply:** "It looks like a violation only if we assume $E$ is independent of $H$ in the relevant way. My claim is that for cornerstone propositions, the warrant for $E$ *presupposes* $H$. In a Bayesian model, this cashes out as the subject not being permitted to treat $E$ as new, independent evidence for $H$ because the probability of $E$ is already pegged to the assumption of $H$. It's not that conditionalization is broken; it's that the input conditions for updating aren't met. You can't use a measurement to confirm the reliability of the measuring device if the only reason you trust the measurement is the device itself. So, I'm not blocking updating; I'm blocking the independence assumption required for *this* update."
  **Weakness Note:** This is the thinnest part of your armor. If she presses on *why* the probability is pegged without a prior, you risk sounding like you're imposing external constraints on the Bayesian machinery without formal justification.

  ### 3. The Internalist "Entitlement is a Blank Check" Objection
  **Likelihood:** High | **Damage:** Medium
  **Idiom:** Internalist Generalist
  **The Objection:** "You say we have 'entitlement' to the cornerstone claim without evidence. To my ear, that sounds like you're granting a license to assume what you can't prove. If I can't demand evidential warrant for reliability, haven't you just rebranded dogmatism as 'entitlement'? What normative work is this actually doing besides shielding the view from skepticism?"

  **Strategy:** **Hold the Line.**
  **Reply:** "It's not a shield against skepticism; it's a reclassification of warrant. Dogmatism says perception gives immediate justification. Entitlement says we have a non-evidential right to trust the framework that makes perception possible. The work it does is distinguish between *proving* our faculties work (which bootstrapping fails to do) and *trusting* them (which we must do to function). If I call it a 'blank check,' that implies it's arbitrary. But it's not arbitrary; it's a necessary precondition for any evidence gathering at all. We aren't assuming reliability because we want to; we're entitled to trust it because we have no other option if we want to engage with the world epistemically."
  **Weakness Note:** "No other option" sounds pragmatic, not epistemic. Internalists may worry you've slipped into pragmatism to save the epistemic view.

  ### 4. The Reliabilist "Instrument Calibration" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Idiom:** Process-Reliabilist
  **The Objection:** "Scientists calibrate instruments against themselves all the time. If I check a thermometer against a second thermometer, and they agree, I increase confidence. If Roxanne checks the gauge against the gauge, why is that structurally different? You're drawing a line that seems to forbid legitimate empirical checking."

  **Strategy:** **Concede a Narrowed Version.**
  **Reply:** "I agree that calibration is possible, but legitimate calibration requires *independent* access to the data. If you check Thermometer A against Thermometer B, you have two processes. Roxanne checks the gauge against the *output* of the gauge. She has only one process. My view allows for reliability testing when there is collateral information or independent access. I'm only blocking the specific case where the only access to the fact is through the very faculty being tested. So I'm not banning calibration; I'm banning self-certification without independent leverage."
  **Weakness Note:** The Reliabilist will argue that "independent access" is too internalist a constraint. They will say if the process is reliable, the lack of independence doesn't matter.

  ### 5. The Generalist "Skepticism Retreat" Objection
  **Likelihood:** High | **Damage:** Low/Medium
  **Idiom:** Internalist Generalist
  **The Objection:** "If transmission fails, and we only have entitlement, haven't you just admitted the skeptic wins? We can't *show* the world is real or our senses work. We just have to take it on faith. That seems like a high cost for saving dogmatism."

  **Strategy:** **Hold the Line.**
  **Reply:** "The skeptic wins only if you think the only acceptable warrant is evidential warrant derived from inference. I'm arguing that's the wrong demand. We don't lose the world; we lose the ability to *prove* the world to someone who demands we step outside our own skins to verify our skins. That's not a loss of knowledge; it's a recognition of the limits of discursive justification. Entitlement preserves the rationality of belief without requiring an impossible proof. So the skeptic is right that we can't prove it, but wrong that we need to."
  **Weakness Note:** This is a standard Wrightian move. It's solid, but some generalists find it defeatist. They want epistemology to fight the skeptic, not accommodate them.

  ### 6. The "Arbitrariness of the Cut" Objection
  **Likelihood:** Medium | **Damage:** Medium
  **Idiom:** Generalist / Bayesian Hybrid
  **The Objection:** "Why does transmission fail for reliability cornerstones but not for ordinary induction? If I see 1000 swans and infer 'all swans are white,' warrant transmits. Why is 'my vision is reliable' structurally different from 'all swans are white'? It looks like you're just marking certain propositions as 'special' to avoid the problem."

  **Strategy:** **Hold the Line.**
  **Reply:** "Cornerstone propositions aren't just generalizations; they are presuppositions of the evidence gathering itself. 'All swans are white' is a hypothesis tested *by* looking. 'My vision is reliable' is a condition *for* looking counting as testing. If you doubt the swan claim, you look harder. If you doubt the vision claim, looking harder doesn't help. The structural difference is that cornerstones mediate the connection between evidence and hypothesis, rather than being the hypothesis itself. So the cut isn't arbitrary; it tracks the difference between empirical hypotheses and framework conditions."
  **Weakness Note:** The line between "framework condition" and "very general empirical hypothesis" is notoriously blurry. A sharp questioner can press this boundary.

  ---

  ### The Dangerous Question
  **The Question:** "If entitlement is non-evidential, how does it cash out in your Bayesian model? If it's a prior, isn't it just a dogmatic assumption of probability 1? And if it's probability 1, how can any amount of counter-evidence ever lower your credence in the reliability of your faculties? You seem to be making your cornerstone claims immune to revision, which looks less like entitlement and more like dogma."

  **Why you fear it:** This targets the tension between your Wrightian verbal framework and the Bayesian formalism the quiet epistemologist is using. If you say it's a prior, you look dogmatic (violating fallibilism). If you say it's not a prior, you lack a formal model for how entitlement functions. It forces you to choose between formal coherence and epistemic humility.
