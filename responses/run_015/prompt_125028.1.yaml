      *   *Case 3 (Non-Identity):* NN for practical reasoning (policy needs to handle this).
      *   *Case 4 (Risk):* NN for practical reasoning.
      *   *Case 5 (Aggregation):* CP (depends on whether you accept Repugnant Conclusion).

  6.  **Addressing the "Friend's Objection":**

      *   Does the risk argument replace the asymmetry? No.
