      *   *Woodcutter:* He is the crucial pivot. In Bayesian terms, he is the "common knowledge" generator. If he lies, the common knowledge base is corrupted. The dagger theft is the "private information" that breaks the model. But deeper: he lies to save face, not just profit.
      *   *Rationality:* Aumann assumes rationality = truth-seeking. *Rashomon* suggests rationality = self-preservation. This is a category error in the formal model.
      *   *Akutagawa vs. Kurosawa:* Akutagawa is nihilistic (no truth). Kurosawa is humanistic (truth is hard, but compassion exists). The seminar needs to know this distinction. The frame story allows for *potential* agreement (the woodcutter taking the baby).
      *   *Philosophical Add:* Formalism ignores the *cost* of updating. Updating might require admitting shame. *Rashomon* shows the psychological cost of Bayesian updating.

  5.  **Refining the Tone:**

