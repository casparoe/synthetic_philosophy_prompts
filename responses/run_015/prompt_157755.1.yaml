          Dennett's concept of "competence without comprehension" relies on two historical pivots: Darwin's natural selection and Turing's universal computation. Both inversions dismantle the intuition that high-level capability requires a high-level mind. However, their structural mechanisms differ significantly, and this distinction is crucial when evaluating modern Large Language Models (LLMs).

