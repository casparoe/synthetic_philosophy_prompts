answer: |-
  **Project Title:** Teleology in the Machine: The Hidden Normativity of the Biostatistical Account of Health

  **1. Statement of the Research Question**
  The central question of this paper is: *Can the Biostatistical Account (BST) of health maintain its claim to value-neutrality given that its operational definition of "physiological function" relies on an irreducibly teleological framework?*

  Christopher Boorse's Biostatistical Account is the dominant naturalist theory in the philosophy of medicine. It defines health as statistical normality of species-typical functioning and disease as sub-normal functioning that reduces survival or reproduction. Boorse insists this is a purely descriptive, value-free scientific classification. However, the account hinges on distinguishing a part's *function* (e.g., the heart pumping blood) from its mere *effects* (e.g., the heart making a thumping sound). To make this distinction without appealing to human interests or social values, the naturalist typically appeals to evolutionary history (etiological functions). This project argues that grounding "function" in evolutionary history does not successfully purge normativity. Instead, it either smuggles in normative assumptions about "good design" and "adaptive success" or it collapses into a causal description that is too broad to distinguish disease from mere difference.

  The paper will not ask whether health *should* be normative, but whether the naturalist's specific attempt to avoid normativity succeeds on its own metaphysical terms.

  **2. Context and Gap Analysis**
  The debate between naturalism and normativism is well-trodden ground. Normativists (e.g., Engelhardt, Fulford) argue that labeling a condition a "disease" necessarily implies a bad state of affairs, which is a value judgment. Naturalists (e.g., Boorse, Wakefield) counter that disease is a factual breakdown of mechanisms, independent of social disvalue.

  However, both sides often leave the metaphysics of "function" under-examined.
  *   **The Naturalist Gap:** Naturalists tend to treat "function" as a self-evident biological category. They assume that because evolution is a natural process, the functions derived from it are value-free facts. They rarely address whether selecting "survival and reproduction" as the telos of the organism is itself a normative prioritization of certain biological outcomes over others.
  *   **The Normativist Gap:** Normativists often attack the *consequences* of the BST (e.g., that it pathologizes homosexuality or aging) without dismantling the underlying machinery of how "function" is defined. They accept the naturalist's definition of function only to show it yields counterintuitive results, rather than showing the definition is internally incoherent.

  This paper fills that gap by focusing exclusively on the bridge between *function* and *value*. It posits that the naturalist/normativist debate stalls because naturalists have not secured a value-free account of teleology. If "function" is inherently goal-directed, and goals imply a standard of success, then the "value-free" claim is untenable from the start.

  **3. Methodology and Plan of Work**
  The paper will proceed in four distinct stages, moving from exegesis to metaphysical analysis, and finally to evaluation.

  *   **Phase 1: Exegesis of the Biostatistical Account (approx. 1,000 words).**
      I will reconstruct Boorse's argument, focusing specifically on his definition of "function" as a causal contribution to survival and reproduction within a reference class. I will isolate the specific claims where Boorse asserts value-neutrality. The goal here is charitable reconstruction: establishing the strongest possible version of the naturalist claim before critiquing it.

  *   **Phase 2: The Metaphysics of Function (approx. 1,500 words).**
      I will analyze the two dominant theories of function in the philosophy of biology: Causal Role functions (Cummins) and Etiological functions (Millikan, Neander).
      *   I will demonstrate that Causal Role functions are descriptive but too permissive (they cannot distinguish function from effect).
      *   I will demonstrate that Etiological functions (which Boorse implicitly relies on) are restrictive enough to distinguish function from effect, but rely on historical selection.
      *   *Crucial Step:* I will analyze whether "selection for" implies a normative standard. Does saying an organ was "selected for" a purpose imply it is *supposed* to do that, and if so, is "supposed" a normative term?

  *   **Phase 3: The Dilemma Construction (approx. 1,500 words).**
      I will construct the central dilemma.
      *   *Horn A:* If Boorse adopts a purely causal definition of function, he loses the ability to distinguish disease from statistical variation (the "Empty Function" problem).
      *   *Horn B:* If Boorse adopts a teleological/etiological definition, he must explain the source of the telos. If the telos is "survival," I will argue that prioritizing survival is a value judgment, not a brute fact (the "Smuggled Normativity" problem).
      *   I will anticipate the naturalist counter-argument: that survival is a factual prerequisite for existence, not a value. I will rebut this by distinguishing between *conditions of existence* and *standards of evaluation*.

  *   **Phase 4: Implications for the Debate (approx. 1,000 words).**
      I will conclude by assessing what this means for the broader debate. If the BST relies on hidden normativity, does this vindicate the normativists? Or does it suggest a third option (e.g., a hybrid account)? I will argue that it forces naturalists to be honest about the minimal values required to define health, rather than claiming a impossible "view from nowhere."

  **4. Risk Assessment and Scope Constraints**
  **Potential Failure Points:**
  *   **The "Is-Ought" Quagmire:** The project risks getting bogged down in the general Humean problem of deriving norms from facts. If I spend too much time on general meta-ethics, I will lose focus on the philosophy of medicine.
      *   *Mitigation:* I will restrict the analysis to the specific concept of *biological function*. I will not attempt to solve the is-ought problem generally, but only show how it manifests specifically within the BST's definition of disease.
  *   **Conflating Evolution with Normativity:** It is possible that evolutionary history is purely descriptive (traits existed or they didn't). I might fail to prove that referencing history introduces *value*.
      *   *Mitigation:* I must be precise that the normativity enters not in the *history* itself, but in the *selection of the reference class* and the prioritization of *design goals* over byproducts. If I cannot make this distinction clear, the argument collapses.

  **Scope Creep:**
  *   **Mental Health:** The BST struggles significantly with mental health. Including this would double the workload.
      *   *Constraint:* I will explicitly exclude psychiatric conditions and focus solely on somatic/physiological pathology to keep the concept of "organ function" clear.
  *   **Alternative Naturalisms:** There are other naturalist accounts (e.g., Wakefield's Harmful Dysfunction).
      *   *Constraint:* I will mention Wakefield only where necessary to contrast with Boorse. The primary target is the Biostatistical Account, as it is the strictest claim to value-neutrality.

  **Success Criteria:**
  The project will be considered successful if I can demonstrate that the definition of "function" is the bottleneck of the naturalist account. Even if I do not definitively solve whether teleology is normative, the paper succeeds if it shows that the naturalist *cannot assume* it is descriptive without further argument. The project fails if it concludes merely that "both sides have points" without isolating the metaphysical mechanism (function) that causes the friction.
