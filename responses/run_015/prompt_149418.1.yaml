answer: |-
  There is no single canonical term in the literature that precisely names this specific asymmetry. While the component parts are well-trodden (the inefficacy objection, expressive voting, complicity theory), the *structural inconsistency* you have identified—where expressive reasons are granted normative force in market-based collective harm but denied in state-based collective decision-making despite identical causal architectures—does not have a standardized label.

  In the context of a graduate workshop, you would be justified in defining this as **"Mechanism-Relative Normative Asymmetry"** (or **"The Institutional Expressivity Gap"**).

  Below is the conceptual carving of the phenomenon, its nearest neighbors in the literature, and the boundaries required to distinguish it from related biases or problems.

  ### 1. Conceptual Definition
  **Mechanism-Relative Normative Asymmetry** occurs when an agent accepts non-instrumental (expressive/integrity-based) reasons as sufficient to override causal inefficacy in one collective domain (typically market consumption/harm) but rejects those same reasons in another collective domain (typically democratic procedure/policy), despite the causal architecture (thresholds/marginal nullity) being isomorphic.

  The configuration requires three elements:
  1.  **Causal Nullity:** The agent grants that the individual act cannot trigger the threshold for the collective outcome in either case.
  2.  **Expressive Availability:** A plausible non-instrumental rationale exists in both cases (e.g., "keeping hands clean" vs. "civic solidarity").
  3.  **Normative Divergence:** The weight of the expressive rationale is contingent on the *ontology of the mechanism* (Market vs. Polity) rather than the causal structure.

  ### 2. Nearest Neighbors in the Literature
  To locate this phenomenon, you must distinguish it from three adjacent concepts that explain half of the pattern but not the asymmetry.

  **A. Complicity Theory (e.g., Christopher Kutz)**
  *   *Relevance:* Explains the "Meat" side. Kutz argues that intentional participation in a collective harm makes one complicit, regardless of marginal causal impact. Integrity requires abstention.
  *   *Distinction:* Complicity theory is generally universalizable. If voting is a collective mechanism that produces harm (or fails to prevent it), Kutz-style reasoning should apply there too. Your interlocutor accepts Kutz for markets but blocks him at the polling station. The asymmetry is the gap between Kutz's *Participatory Intention* and the interlocutor's *Democratic Instrumentalism*.

  **B. Expressive Voting Theory (e.g., Brennan & Lomasky)**
  *   *Relevance:* Explains the "Vote" side (potentially). They argue voting is rational *because* it is expressive, not instrumental.
  *   *Distinction:* Your interlocutor is explicitly *rejecting* the Lomasky position while accepting its ethical analog in consumption. The phenomenon you are tracking is the *rejection* of expressive voting theory in contexts where expressive consumption theory is embraced.

  **C. The Non-Identity Problem (Parfit)**
  *   *Relevance:* Deals with how individual acts affect future populations in collective scenarios.
  *   *Distinction:* Non-identity is about *who* exists. Your problem is about *whether the act counts* given that the agents and outcomes are fixed. This is a problem of practical reason, not metaphysical identity.

  ### 3. The Underlying Logic: Negative vs. Positive Duties
  The most robust explanation for this asymmetry—and the one you should probe in the workshop—is that the interlocutor is tacitly switching normative frameworks based on the **valence of the duty**.

  *   **Meat (Negative Duty):** Abstaining from meat is framed as a constraint on *doing harm*. Deontological constraints often bind agents individually regardless of efficacy (e.g., "I must not kill," even if my killing doesn't change the war). The market is treated as a sphere of **moral integrity**.
  *   **Voting (Positive Duty):** Voting for carbon pricing is framed as an attempt to *produce good*. Consequentialist logic often dominates here; if the act produces no good (due to inefficacy), the duty dissolves. The polity is treated as a sphere of **outcome efficacy**.

  The asymmetry exists because the interlocutor treats the Market as a site of **constitutive action** (what kind of person am I?) and the Polity as a site of **instrumental action** (what world do we get?).

  ### 4. Boundaries and Distinctions
  To ensure this concept is not conflated with ordinary bias or other problems, apply these boundary conditions:

  **Vs. Motivated Reasoning / Bias**
  *   *Boundary:* Motivated reasoning is psychological and ad hoc (e.g., "I want to eat meat, so I say voting matters").
  *   *Differentiation:* Your pattern is *structurally consistent*. It tracks a feature of the institution (Market vs. State), not the agent's desire. It is a principled dualism, not a psychological slip.

  **Vs. "Mere Symbolism"**
  *   *Boundary:* In public discourse, "symbolic" is often pejorative, implying inefficacy.
  *   *Differentiation:* In the "Meat" case, the interlocutor treats the symbol as *substantive* (it preserves integrity). In the "Vote" case, they treat it as *empty*. The concept captures the shift in the *value of the symbol*, not the presence of symbolism itself.

  **Vs. The Paradox of Voting (Downs)**
  *   *Boundary:* Downs argues voting is *irrational* because costs exceed expected benefits.
  *   *Differentiation:* Your interlocutor isn't making a rational choice calculation; they are making a normative claim about *legitimacy*. They argue democratic legitimacy *requires* decisiveness, whereas moral integrity *does not*.

  ### 5. Workshop Framing
  For your remarks, you might frame the problem as a challenge to **Unified Collective Rationality**.

  The question to pose to your colleagues is not "Does expression matter?" but **"Why does the institutional container determine the normative weight of expression?"**

  If the causal architecture is identical, the burden of proof lies on the interlocutor to identify a *normatively relevant difference* between a market threshold and a voting threshold that justifies accepting expressive reasons in one but not the other. If they cannot, they are guilty of **Institutional Normative Arbitrage**—importing deontological protections for the self in the market while demanding consequentialist efficacy for the self in the polity.

  This carving allows you to move past the inefficacy objection (which they already grant) and target the inconsistency in their theory of action.
