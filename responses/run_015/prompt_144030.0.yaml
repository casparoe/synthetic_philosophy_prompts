answer: |-
  ### Brainstorming the Crux: Hume vs. Moore in Practice

  Before drafting the exam, we need to isolate the mechanical difference between these two "failure modes." It's easy to conflate them because both block moral realism based on science, but they break the machine at different joints.

  1.  **Hume (The Inferential Gap):** This is about **validity**. Even if your definitions are perfect, you cannot logically *move* from premises containing only descriptive operators (is, exists, causes) to a conclusion containing prescriptive operators (ought, should, mandatory) without a bridging premise that is itself prescriptive. In the climate scenario, Hume says: "Your syllogism is invalid. You missing a premise like 'suffering is bad'."
  2.  **Moore (The Definitional Error):** This is about **identity**. This attacks the claim that "good" *means* "natural property X." If the researcher claims "Obligatory" *is identical to* "Carbon reducing," Moore says: "No, I can still ask 'Is carbon reducing actually good?' without contradiction." It's a semantic failure, not just an inferential one.
  3.  **The Reverse Derivation:** This tests symmetry. If the barrier is logical, it should hold both ways. You cannot derive facts from values any more than values from facts. If students only memorize "No Is to Ought," they might miss that "No Ought to Is" is also true (moral wishes don't alter physical states). This distinguishes a logical gap from a causal one.

  ***

  ### Exam Question

  **Course:** ETH-402: Metaethics & Logical Structure
  **Time Allowed:** 90 Minutes
  **Word Count Target:** ~700 Words

  **Question 4:**
  A climate researcher publishes a paper claiming to have derived a direct moral obligation to reduce carbon emissions purely from atmospheric temperature statistics and economic cost-benefit models. She explicitly states there are zero hidden value premises in her derivation; the obligation is a direct function of the physical data.

  Diagnose this derivation. Does it collapse primarily due to Hume's Is-Ought problem, Moore's Naturalistic Fallacy, or both? Defend your position on whether these represent the same logical mistake wearing different hats or genuinely separate errors. Finally, engage with the concept of reverse derivation: if the barrier between Is and Ought is logical, does an *Ought* symmetrically block an *Is* (i.e., can moral obligations dictate physical facts)? Justify your answer without relying on historical exegesis.

  ***

  ### Model Answer

  The researcher's derivation collapses due to both Hume's Is-Ought problem and Moore's Naturalistic Fallacy, though these represent distinct structural errors rather than a single mistake. Hume identifies a failure of inference, while Moore identifies a failure of definition. Treating them as identical obscures the specific logical machinery required to repair moral arguments.

  Hume's objection applies to the **inferential step**. The researcher moves from descriptive premises (temperature rise, economic cost) to a prescriptive conclusion (obligation to reduce). In formal logic, a valid argument cannot introduce new operators in the conclusion that are absent from the premises. Unless the researcher includes a bridging premise such as "economic stability is morally good," the deduction is invalid. The data alone lacks the normative force to compel action. This is a syntactic error in the argument's structure; even if "good" were perfectly defined, the inference would remain invalid without a normative axiom.

  Moore's objection applies to the **semantic identification**. If the researcher argues that "obligation" simply *means* "that which reduces carbon," she commits the Naturalistic Fallacy. Moore's Open Question Argument demonstrates that for any natural property X (like carbon reduction), it remains meaningful to ask, "But is X actually good?" If "good" were identical to "carbon reduction," this question would be tautological and senseless (like asking "Is a bachelor unmarried?"). Because the question remains open, "good" cannot be reduced to natural properties. This is a category error regarding property identity, distinct from Hume's concern with syllogistic validity.

  Are these the same mistake? They are not. Hume allows that you *can* reach an Ought if you start with an Ought premise (e.g., "We ought to prevent suffering"). Moore argues that you cannot even define the term "Ought" using natural properties successfully. One blocks the bridge; the other denies the destination exists where you think it does. Conflating them leads to the mistaken belief that adding a value premise solves the definitional problem, or that fixing definitions solves the inferential gap. Both must be addressed separately.

  Regarding reverse derivation: if the barrier is logical, it must be symmetric. An *Ought* cannot dictate an *Is* any more than an *Is* can dictate an *Ought*. This is often overlooked in favor of the standard Is-Ought direction. However, logical autonomy works both ways. A moral obligation (Ought) does not physically alter atmospheric carbon levels (Is) without causal intervention. To claim that "because we ought to reduce emissions, the temperature will drop" is as logically flawed as "because the temperature is rising, we ought to reduce emissions." Both attempts try to bypass the causal or normative bridging premises required to connect distinct logical categories.

  If the gap were merely causal, reverse derivation might be possible (e.g., willpower moving objects). But since the gap is logical/semantic, symmetry holds. The researcher's error assumes a permeability between fact and value that does not exist in either direction. Recognizing this symmetry confirms that the error is not merely about the direction of moral reasoning, but about the autonomy of normative domains from descriptive domains. Therefore, the derivation fails doubly: it invalidly infers value from fact, and it implicitly assumes value could constrain fact without mechanism.

  ***

  ### Marking Scheme (20 Points Total)

  | **Must-Hit Move** | **Points** | **Typical Candidate Mess-Up** |
  | :--- | :---: | :--- |
  | **1. Distinguish Inference vs. Definition** <br>Correctly identifies Hume as an inferential/syntactic gap (premises to conclusion) and Moore as a semantic/definitional error (identity of properties). | **4** | Treating both as simply "you can't mix fact and value" without distinguishing logic vs. semantics. |
  | **2. Apply to Scenario Specifically** <br>Explicitly maps Hume to the missing bridging premise in the climate paper and Moore to the identification of "good" with "carbon reduction." | **4** | Giving generic definitions of Hume/Moore without referencing the temperature stats or economic models provided. |
  | **3. Defend Distinctness** <br>Argues clearly that the errors are separate (one allows Oughts with Ought premises, the other challenges the definition of Good itself). | **4** | Claiming they are the same mistake just named differently, or failing to justify why the distinction matters. |
  | **4. Engage Reverse Derivation** <br>Addresses whether Ought->Is is blocked. Must argue that logical autonomy implies symmetry (values don't dictate facts). | **4** | Ignoring the reverse derivation prompt or claiming moral obligations *can* change physical facts directly (magical thinking). |
  | **5. Synthesize Logical Autonomy** <br>Concludes that the barrier is about domain autonomy (logical/semantic) rather than causal directionality, tying the reverse derivation back to the main diagnosis. | **4** | Treating the reverse derivation as an add-on thought rather than integrating it into the conclusion about logical categories. |
