answer: |-
  Below is a logical anatomy of the proverb "charity begins at home," parsed into five distinct philosophical theses. These range from the empirically trivial to the substantively controversial, designed to disentangle the heuristic from the normative claim.

  ### I. The Menu of Theses

  #### 1. The Efficacy Heuristic
  *   **The Claim:** Agents are typically better positioned epistemically and logistically to identify and alleviate suffering within their immediate jurisdiction than in distant ones.
  *   **(i) Domain:** Efficacy of institutional delivery.
  *   **(ii) Status:** A **trivial empirical generalization**. It is often true (lower transaction costs, better knowledge of local needs) but contingent. In a globalized economy with digital finance and transnational NGOs, proximity does not always correlate with efficacy (e.g., sending malaria nets abroad may save more lives per dollar than funding local arts programs).
  *   **(iii) Implication:** **Compatible with cosmopolitanism.** This is a rule of thumb for maximizing global good, not a principle of priority. It dictates *where* to start, not *who* counts. It collapses if the "home" problem is minor and the "distant" problem is catastrophic.

  #### 2. The Motivational Constraint
  *   **The Claim:** Moral obligations must be anchored in human psychological capacities; since humans naturally feel stronger empathy for kin and compatriots, demanding equal sacrifice for distant strangers is unsustainable and counterproductive.
  *   **(i) Domain:** Psychology of motivation.
  *   **(ii) Status:** A **defensible but limited principle of practical reason**. It acknowledges the "is-ought" gap but risks conflating moral justification with moral psychology. It defends a *graduated* scale of concern rather than a hard boundary.
  *   **(iii) Implication:** **Compatible with cosmopolitanism (instrumentally).** It suggests a phased approach to global justice to maintain compliance, but does not deny the ultimate equal moral status of non-citizens. It argues for *how* we distribute, not *whether* we owe.

  #### 3. The Associative Duty Thesis
  *   **The Claim:** Shared political membership generates special, agent-relative obligations that are qualitatively distinct from general humanitarian duties. These duties are non-transferable; one cannot discharge duties to compatriots by helping foreigners.
  *   **(i) Domain:** Normative legitimacy of state partiality / Scope of moral obligation.
  *   **(ii) Status:** An **intermediate position smuggling substantive commitments**. It presupposes that political association is intrinsically valuable enough to generate exclusionary duties. It moves beyond efficacy to claim a *right* to prioritize based on relationship.
  *   **(iii) Implication:** **Supports a nationalist conclusion.** It posits that compatriots possess special claims that trump the general claims of outsiders, provided basic humanitarian thresholds for outsiders are met.

  #### 4. The Closed Cooperative Scheme Thesis
  *   **The Claim:** The state is primarily a reciprocal enterprise for mutual advantage among contributors. Obligations of justice arise only within this closed scheme of cooperation; outside the border, there are only weak duties of beneficence, not justice.
  *   **(i) Domain:** Scope of moral obligation (Justice vs. Beneficence).
  *   **(ii) Status:** A **false or morally arbitrary boundary** (in a globalized context). This treats the state as a "node of mutual advantage" rather than a "node in a structure of global injustice." It ignores how wealth accumulation at "home" may depend on exploitation "abroad."
  *   **(iii) Implication:** **Supports a nationalist conclusion.** It radically restricts the scope of *justice* to borders, reclassifying claims from refugees or climate victims as mere requests for charity, which can be legitimately refused.

  #### 5. The Political Maintenance Threshold
  *   **The Claim:** A political community must secure its own stability and legitimacy before it can act as a moral agent externally. If "home" charity fails, the state collapses, and all capacity for justice (domestic and global) is lost.
  *   **(i) Domain:** Normative legitimacy / Efficacy.
  *   **(ii) Status:** A **defensible but limited principle**. It establishes a lexical priority (survival first) but is often abused to justify luxury consumption as "maintenance."
  *   **(iii) Implication:** **Compatible with cosmopolitanism (conditionally).** It accepts global obligations but imposes a "subsidiarity constraint." However, it does not justify ignoring external harm caused by the state's own policies (e.g., emissions).

  ---

  ### II. Distinguishing the Trivial from the Smuggled

  The philosophical danger of the proverb lies in conflating **Thesis 1 (Efficacy)** with **Thesis 4 (Closed Cooperative Scheme)**.

  *   **The Trivial Claim:** "We should fix the potholes here before funding schools there because we can fix the potholes cheaper." This is a logistical claim about resource allocation. It is compatible with the view that the foreign children have an equal claim to the resources, but the *delivery mechanism* is more efficient locally.
  *   **The Smuggled Commitment:** "We owe the potholes to *us* because we are *us*, and we owe nothing to the foreign children because they are not part of our cooperative scheme." This smuggles in a theory of **reciprocity** that denies the existence of structural global injustice. It assumes the state is a closed box of mutual benefit, ignoring that the "wealth at home" used to fix the potholes may have been extracted via carbon emissions or trade policies that damaged the "foreign school."

  When an interlocutor invokes "charity begins at home" to dismiss *stringent obligations* (like climate reparations), they are rarely arguing about logistics (Thesis 1). They are invoking **Thesis 4 (Closed Cooperative Scheme)** or **Thesis 3 (Associative Duty)** to deny the *status* of the claimant. They are shifting the category of the obligation from **Justice** (which is mandatory and enforceable) to **Charity** (which is discretionary).

  ---

  ### III. Diagnostic Conclusion: The Actual Invocation and Its Viability

  **Which reading is being invoked?**
  In the context of a graduate seminar dismissing refugee resettlement or climate reparations, the interlocutor is invoking **Thesis 4 (The Closed Cooperative Scheme)** masquerading as **Thesis 1 (The Efficacy Heuristic)**.

  They present the claim as a practical observation ("we must solve our own problems first") to avoid defending the normative boundary ("we *only* owe problems to our own"). This allows them to treat the state as a fortress of mutual advantage rather than a participant in a global order. They are asserting that the boundary of the state marks the boundary of *justice*, reducing all cross-border claims to discretionary benevolence.

  **Does this reading survive the "Moral Arbitrariness of Borders" objection?**
  **No.** The "Closed Cooperative Scheme" reading cannot survive the objection that national borders are morally arbitrary from the standpoint of justice, specifically in the contexts you mentioned (refugees, climate, medical resources).

  1.  **Causal Implication:** In the case of climate reparations, the "home" wealth is often causally linked to the "distant" harm. To say "charity begins at home" here is to ignore that the "home" agent is the *perpetrator* of the harm. One cannot prioritize repairing one's own roof over compensating the neighbor whose house one burned down, even if the roof is leaking. The boundary of the state does not sever the chain of causality.
  2.  **Structural Interdependence:** In the case of medical resources or trade, the scarcity abroad is often structurally linked to the abundance at home (e.g., patent laws, brain drain). If the state is a "node in a structure of global injustice," the Closed Cooperative Scheme thesis is factually false. The scheme is not closed; the benefits enjoyed at home are subsidized by constraints imposed abroad.
  3.  **The Arbitrariness of Membership:** If the justification for priority is merely shared membership (Thesis 3), the objection holds that membership is largely a matter of luck (birthplace). While some philosophers (e.g., Miller) argue that shared culture or democratic agency generates special duties, these duties cannot override the *negative duties* not to harm. Since the "conversation-stopper" is used to resist *stringent* obligations (often rooted in harm or basic rights), the arbitrariness of the border renders the exclusion unjustified.

  **Verdict:** The proverb, in this context, functions as an **ideological shield**. It converts a question of *rectificatory justice* (reparations, asylum rights) into a question of *distributive benevolence* (charity). By doing so, it relies on a conception of the state as a morally closed system. Since global justice seminars operate on the premise that the state is *not* a morally closed system (due to interdependence, harm, and universal rights), the slogan fails as a philosophical argument. It survives only as a rhetorical device to enforce the status quo by redefining justice as charity.
