  8.  *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the specific math of $\ln 2$. The user knows that. Focus on *why* $\ln 2$ is contested. The key is whether the index $n$ carries normative weight. Side 2 says yes (it's the toss number). Side 1 says no (it's just a label for outcomes).

