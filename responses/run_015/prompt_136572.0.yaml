      *   *Conclusion on Diagnosis:* It is primarily a **categorial mismatch regarding the object of formalization**. The Anti-Mechanists formalize "proof" as static derivation. The Mechanists formalize "cognition" as dynamic computation. They talk past each other because GIT binds static systems, while cognition is dynamic.

