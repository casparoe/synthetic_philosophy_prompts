          *   *Time/Agent:* "Could be found out" implies a process. Fitch concludes "All truths are known *at some time*." This doesn't mean the narrator knows them *now*.
          *   *The "Knower":* Fitch assumes a generic knower. If the narrator means "human investigators," there are physical limits, not just logical ones.
      *   *The Philosophical Nuance:* Mention Michael Dummett. Antirealists *know* Fitch. They respond by changing the logic (Intuitionism). The narrator can sound like she rejects the idea of "truths waiting in the dark."
      *   *Literary Advice:* Don't let philosophy police the voice. The tension is interesting. The narrator's insistence *despite* the paradox makes her compelling.
      *   *Specific Fixes:* Tweak the phrasing. "There is no truth that *could not* be uncovered" vs "All truths *are* uncovered."

  6.  **Refining the Argument regarding Fitch:**
      *   Wait, does Fitch prove "All truths are known *now*" or "All truths are known *at some time*"?
      *   Standard Fitch: $\forall p (p \rightarrow \Diamond K p) \vdash \forall p (p \rightarrow K p)$. The $\Diamond$ (possibility) drops out. This usually implies $K$ is tenseless or refers to the actual world.
