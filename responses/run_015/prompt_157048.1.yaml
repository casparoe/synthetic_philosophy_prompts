  I've been working through a course on decision architecture and keep returning to a colleague's judgments about when bounded rationality amounts to rational satisficing rather than a mere failure to optimize. She has ruled consistently on several institutional and artificial cases, but I'm unsure whether she is tracking resource costs, ecological structure, or something else. In a trauma bay, she endorsed a surgeon's use of a rapid, color-coded triage heuristic rather than computing individual survival probabilities for each patient—calling it proper satisficing. She rejected a hedge fund's reliance on a simple momentum strategy despite its possession of real-time data and essentially free computation that would dominate the heuristic—calling it an indefensible refusal to optimize. She approved a foraging model in which an organism stops searching once caloric intake crosses a safety threshold, ignoring a richer but riskier patch nearby. And she criticized a chess engine that applies a uniform search-depth cutoff even in trivial endgames where exhaustive computation is instantaneous, arguing that the procedure ignores the actual cost structure of the problem.

  Now consider a municipal water authority that maintains a fixed reservoir-level trigger for usage restrictions rather than running its available predictive hydrological model. The authority explains that the simple rule is transparent to the public and robust to rare extreme-weather tail events that the model might overfit, even though the computing infrastructure is already in place and the environment is usually predictable. Predict whether my colleague will call this rational satisficing or an unjustified failure to exploit cheap computation. Then lay out the principle she seems to be running, at least one other principle that explains her four earlier judgments just as well, and show where those rules diverge on the water-authority case. Finally, describe one further hypothetical case—ideally one that isolates whether she cares about actual resource scarcity or about ecological robustness in the face of model error—that would best tell those competing interpretations apart. I'm less interested in the single verdict than in seeing how her track record constrains the taxonomy of bounded rationality she is implicitly using.
