  Your reading is philosophically fertile but technically precarious, risking a category error between phenomenal consciousness and narrative access. The Inner-Sense model fits better than Rosenthal's thought version because Stevens possesses the concepts but actively inhibits the scanning mechanism through professional discipline; he doesn't lack the concept of grief, he refuses to scan for it. A Self-Representationalist will indeed claim the novel, arguing Stevens' grief was phenomenally conscious (it felt like something) despite his lack of cognitive access, making the tragedy one of repression rather than unconsciousness. Your "delegated HOR" move is a reductio of HOT as a theory of subjective consciousness—which cannot be outsourced—but a valid discovery about narrative irony that HOT theories should shrug off as external to the mental state.

  Worry (a) is fatal unless you adopt the fix you proposed: take the subject of the higher-order state to be Stevens inside the scene, not the Stevens doing the narrating. The memoir proves he eventually formed the HORs, but the tragedy lies in the decades-long lag where the states existed without them; you must treat the narration as a belated repair job rather than a transparent record. Worry (b) is not fatal but requires precision: HOT explains self-deception as a misrepresenting higher-order state (I represent myself as calm), whereas First-Order theories claim the emotion was conscious regardless of the lie. Build your argument on three scenes: serving dinner while his father dies (suppressed scanning), interrupting Miss Kenton's crying (avoiding the object of emotion), and the pier conversation (the delayed HOR finally forming). The book resists this reading where Stevens' narration feels too immediate, suggesting the HOR was always latent, but if you maintain the split between the experiencing subject and the narrating subject, the case holds.
