answer: |-
  Activity Title: The Blind Consensus Protocol

  **Materials:**
  *   15 copies of "Case File Alpha" (a logic puzzle with a definitive but non-obvious solution).
  *   15 envelopes labeled "Partner Credential."
  *   7 slips of paper marked "Random Assignment" and 8 slips marked "Top Performer" (shuffled).
  *   Whiteboard for scoring.
  *   Small prizes (e.g., candy bars or "homework pass" tokens).

  **Setup:**
  Arrange the room so students can work individually, then quickly move into 7 pairs and 1 trio. Do not reveal the philosophical terms "conciliationism" or "steadfastness" at any point during the activity.

  **Rules & Incentives:**
  1.  **Goal:** Maximize your individual accuracy score.
  2.  **Scoring:** 10 points for a correct final answer, 0 for incorrect.
  3.  **Bonus:** If your final answer matches your *original* individual answer and is correct, you receive +5 "Conviction Points."
  4.  **Constraint:** During the partner phase, you may reveal your *answer* but you may not show your *work* or explain your *reasoning* until the final reveal.

  **Timeline (35–40 Minutes):**

  *   **0:00–0:05 (Introduction):** Distribute Case File Alpha. Explain the rules and scoring. Emphasize that the puzzle has a single correct answer. Tell them they will be working alone first, then with a partner.
  *   **0:05–0:15 (Round 1: Individual Judgment):** Students solve the puzzle individually. They must write down their **Initial Answer** and rate their **Confidence (1–10)**. Collect these sheets briefly to timestamp them, then hand them back.
  *   **0:15–0:20 (Round 2: Peer Discovery):** Students move into assigned pairs/trios. They reveal only their **Initial Answer** to each other.
      *   *Instructor Note:* If a pair agrees, instruct them to flag you. You will swap one partner with another group to ensure disagreement. (Prepare a backup "disagreement prompt" if needed, but logic puzzles usually yield ~40% disagreement naturally).
      *   Once disagreement is confirmed, they proceed to Round 3.
  *   **0:20–0:25 (Round 3: The Credential Reveal):** Hand each student an envelope labeled "Partner Credential." They open it privately.
      *   **Group A (7 students):** Slip reads *"Your partner was randomly selected from the class roster."*
      *   **Group B (8 students):** Slip reads *"Your partner was selected because they scored in the top 10% on a pre-test calibration task."* (This is false; all partners are peers, but this creates the information asymmetry).
      *   **Decision:** Students have 5 minutes to decide their **Final Answer**. They can Stick (keep Initial) or Switch (adopt Partner's). They cannot discuss *why* they believe their answer, only state the final choice.
  *   **0:25–0:35 (Round 4: Resolution & Scoring):** Reveal the correct answer to the puzzle. Students calculate their scores. Award prizes to the top 3 scorers.
  *   **0:35–0:40 (Transition):** Collect all materials. Tell students: "Keep your feelings about that decision process in mind. We are now going to analyze *why* you made those choices."

  ***

  ### (2) Debrief Script (35–40 Minutes)

  **Phase 1: Phenomenology of the Decision (10 Minutes)**
  *   **Instructor:** "Raise your hand if you switched your answer in Round 3. Keep your hand up if you received the 'Top Performer' credential slip."
  *   **Question:** "For those who switched: Did you actually believe your partner was more likely to be right, or did you just feel pressured by the slip?"
  *   **Question:** "For those who stuck with their answer despite the 'Top Performer' slip: What gave you the entitlement to ignore that information? Was it your confidence level?"
  *   **Goal:** Elicit the raw intuition that external information about the *peer* (not just the evidence) changes the normative pressure to revise.

  **Phase 2: Naming the Positions (15 Minutes)**
  *   **Instructor:** "In epistemology, we have names for the impulses you just felt. When you felt you *should* move your credence toward your partner's simply because they disagree, you were feeling the pull of **Conciliationism**."
      *   *Write on board:* **Conciliationism (e.g., Elga, Christensen):** Peer disagreement is itself a higher-order defeater. You must split the difference or defer.
  *   **Instructor:** "When you felt entitled to stick with your guns because you saw the evidence clearly, even against a peer, you were feeling the pull of **Steadfastness**."
      *   *Write on board:* **Steadfastness (e.g., Kelly, van Inwagen):** You should weigh the first-order evidence. If your reasoning seems sound, the peer's disagreement is less weighty than your direct access to the evidence."
  *   **Mapping the Activity:**
      *   "The 'Random Assignment' slip represents the **Equal Weight View**. If they are truly a peer, their judgment counts as much as yours."
      *   "The 'Top Performer' slip represents **Expert Deference**, a stronger form of conciliation."
      *   "The rule forbidding you to share reasoning forced you to rely on the **Peer Premise** alone. This isolates the disagreement from the evidence."
      *   "The 'Conviction Points' bonus incentivized **Steadfastness**. Did anyone feel morally conflicted taking those points? That conflict is the core of the debate."

  **Phase 3: Connecting to Readings (10 Minutes)**
  *   **Instructor:** "For Thursday, we read [Author Name]. How would they analyze Round 3?"
  *   **Question:** "If you could have shared your reasoning (the 'Total Evidence'), would the disagreement have dissolved? Does that mean steadfastness is only rational when communication fails?"
  *   **Question:** "Is it possible to be a steadfastist in Round 1 but a conciliationist in Round 3? Why?"
  *   **Closing:** "The activity ended with a correct answer. Real philosophical disagreement rarely does. Next week, we ask: What do we do when there is no answer key?"

  ***

  ### (3) Predictable Problems & Solutions

  **Problem 1: No Disagreement Occurs.**
  *   *Risk:* If the puzzle is too easy, everyone agrees, and the activity collapses.
  *   *Solution:* Have a "Breaker Protocol." If a pair agrees, hand them a card that says: *"An external auditor has flagged this solution as controversial. Assume your partner disagrees for the sake of Round 3."* This forces the hypothetical tension even if empirical agreement happened.

  **Problem 2: Students Share Reasoning Early.**
  *   *Risk:* Students ignore the "no reasoning" rule in Round 3, solving the puzzle together.
  *   *Solution:* Circulate aggressively during Round 3. If you hear reasoning ("I thought X because..."), interrupt and remind them: "You are only exchanging verdicts, not evidence." Frame it as a constraint of the "Blind Protocol."

  **Problem 3: Cynicism About the "Top Performer" Lie.**
  *   *Risk:* Students suspect the credential slip is fake and ignore it.
  *   *Solution:* Commit to the bit. If challenged, say, "The calibration data is from a previous semester's cohort." In the debrief, admit the deception explicitly as part of the experimental design to test their sensitivity to peer status.

  **Problem 4: Time Overrun.**
  *   *Risk:* The puzzle takes too long, eating into debrief.
  *   *Solution:* At minute 12, call out: "You have 3 minutes to lock in your Initial Answer." Force the transition. An incomplete puzzle is better than a rushed debrief.

  ***

  ### (4) Limitations of the Activity

  **The "Answer Key" Problem:**
  This activity cannot capture the **indeterminacy of real philosophical disagreement**. In the game, there is a fact of the matter (the correct puzzle solution) known by the instructor at the end. This subtly validates the Steadfast view: if you stuck and were right, you were rewarded. In real epistemic disagreements (e.g., ethics, politics, metaphysics), there is often no available "Ground Truth" to validate who was right. You will need to supply this in discussion by asking: "What if we never revealed the correct answer? Would the person who stuck still be rational?" This pushes them from *veritistic* accuracy (getting the right answer) to *epistemic* rationality (processing evidence correctly), which is where the actual philosophical debate lives.
