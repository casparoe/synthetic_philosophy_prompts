  **MEMORANDUM**

  **TO:** Committee on Nonhuman Subjects
  **FROM:** Independent Consultant
  **DATE:** 24 October 2024
  **SUBJECT:** Consistency Note: Application 2024/09

  **1. Rules Fitting Precedents**
  Three rules accommodate precedents 2019/14–2022/11 equally well:
  (i) **Biological Speciesism:** Side constraints apply only to *Homo sapiens*. (Approves 2024/09).
  (ii) **Moral Community Membership:** Protection follows legal recognition as human, regardless of capacity. (Approves 2024/09).
  (iii) **Functional Personhood:** Protection applies to beings capable of refusal or symbolic communication (including humans who retain status despite incapacity). (Rejects 2024/09).

  However, a superior rule aligns with the Chair's Nozickian rationale: **Normative Agency.** Side constraints protect beings capable of holding rights or making claims. Ordinary animals lack this; humans possess it by status; enhanced chimps possess it functionally. This rule turns on whether a being could in principle be asked and could refuse.

  **2. Recommended Decision**
  The precedents commit the Committee to **Rejection**.
  Precedent 2022/11 rejected using incapacitated humans despite proxy consent, establishing that persons cannot be used as mere means regardless of consequential gain. The Chair's Nozickian framework ties this protection to moral personality, not merely biology. While ordinary chimpanzees (2020/07) lack the capacity for normative claim-making, the enhanced line in 2024/09 explicitly possesses it (symbolic communication, refusal). To approve this application would be to privilege biological taxonomy over the very capacities the Chair cited as morally relevant. It would create an inconsistency wherein a being capable of refusal is subjected to protocols forbidden for humans lacking that capacity.
  **Closest Analog:** 2022/11. Both involve subjects unable to consent to painful, non-beneficial procedures. The distinction lies only in species, which is morally arbitrary if functional capacity is the true criterion.

  **3. Principle Adopted**
  Approval adopts **Species Essentialism**: moral status is intrinsic to human biology, irrespective of capacity.
  Rejection adopts **Functional Personhood**: moral status derives from capacities (refusal, symbolic thought), irrespective of species.

  **4. Further Case Required**
  To separate these rules, the Committee must explicitly rule on **never-competent human subjects** (e.g., anencephalic infants) in non-therapeutic research.
  Biological Essentialism protects them automatically. Functional Personhood requires deciding whether 'potentiality' or 'species membership' grants status absent actual capacity. This decision is necessary to stabilise the principle chosen today. Without it, the Committee risks incoherence when facing future borderline cases involving human-animal chimeras or severe congenital cognitive deficits. Clarifying this now ensures the written reasons for 2024/09 remain robust against future challenges.

  **Word Count:** 398 words.
