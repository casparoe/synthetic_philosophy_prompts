      *   **User's Intuition:** The specific historical examples (Maya, Bronze Age) seem plausible, but the conclusion feels wrong (reductio ad absurdum via nuclear war scenario). The word "collapse" *must* mean something distinct from "reorganization."
      *   **Task:**
          1.  Commit to rejecting *one* specific step (1-7).
          2.  Explain why it looked fine but is actually the bug.
