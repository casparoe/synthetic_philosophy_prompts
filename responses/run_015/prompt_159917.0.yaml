answer: |-
  Here is the menu of candidate theses hidden inside the slogan "you can't be uncertain about math," followed by the analysis of your friends and your own principle.

  ### The Menu of Candidate Theses

  1.  **The Metaphysical Thesis:** Mathematical propositions have a fixed truth value independent of whether anyone knows it.
      *   **Verdict:** Trivial and True (this is just what "math fact" means).
  2.  **The Omniscience Thesis:** A logically perfect agent would assign probability 1 to true math statements and 0 to false ones.
      *   **Verdict:** Trivial and True (by definition of logical perfection).
  3.  **The Human Norm Thesis:** Finite human agents are rationally required to assign only 0 or 1 to decidable mathematical propositions.
      *   **Verdict:** False (this demands cognitive powers humans do not possess).
  4.  **The Evidence Thesis:** Performing a calculation provides no new evidence about the truth of a mathematical proposition.
      *   **Verdict:** False (computation transforms implicit knowledge into explicit knowledge, which is evidence for a bounded agent).
  5.  **The Proof-Only Thesis:** Rational certainty is permitted only when a formal proof has been verified.
      *   **Verdict:** Defensible-but-Substantive (a strict standard, but coherent if you define "knowledge" as "justified true belief" where justification requires proof).
  6.  **The Betting Thesis:** You should never accept bets on math propositions at odds other than infinity-to-one.
      *   **Verdict:** False (this leads to immediately exploitable behavior in the real world).

  ### Analysis of Person (1) and Person (2)

  **Person (1): "More computation isn't evidence."**
  *   **Required Thesis:** They need **The Evidence Thesis (#4)** to be true.
  *   **Does it deliver?** No. This reading fails. For a bounded agent, the output of an algorithm *is* evidence because it correlates with the truth value relative to your current state of ignorance. If you didn't know the output before you ran the code, the output updates your probability distribution. Treating computation as non-evidence conflates the *map* (your knowledge) with the *territory* (the math fact).
  *   **Smuggled Premise:** They are smuggling in **The Omniscience Thesis (#2)** and applying it to you. They assume that because the answer is fixed for God, your processing time is irrelevant for you. That is a category error.

  **Person (2): "Never bet against a claimed proof."**
  *   **Required Thesis:** They need **The Proof-Only Thesis (#5)** to be true.
  *   **Does it deliver?** Mostly, but with a caveat. If a proof is verified, certainty is rational. However, this smuggles in the assumption that *you* have verified the proof correctly. Humans make errors checking proofs.
  *   **Smuggled Premise:** They are smuggling in **The Human Norm Thesis (#3)** regarding the *checker*. They assume that once a proof exists, your uncertainty must drop to zero, ignoring the probability that you might misread the proof.

  ### Analysis of Your "Bounded-Coherence" Principle

  You defined a belief state as "bounded-coherent" if no pre-committable betting strategy guarantees a loss given your computational limits. Here is the breakdown of your specific questions.

  **1. Does bounded-coherence rule out intermediate confidence in settled math facts?**
  *   **Verdict:** No, it explicitly permits it.
  *   **Reasoning:** A Dutch book requires you to accept a combination of bets that *you* currently view as favorable. If you assign 70% to "Prime," you will refuse a bet that pays only if it is "Composite" at even odds. You cannot be forced into a guaranteed loss merely for being ignorant, provided your probabilities sum to 1.

  **2. Is it strong enough to be worth anything at all?**
  *   **Verdict:** Yes, it rules out internal probabilistic contradictions.
  *   **Reasoning:** It still forbids you from assigning 70% to "Prime" and 70% to "Composite." It enforces the axioms of probability within your bound, even if it doesn't force the probabilities to 0 or 1.

  **3. Does it say your confidence is supposed to get better the longer you think?**
  *   **Verdict:** Yes, but only if the thinking process is part of the pre-committed strategy.
  *   **Reasoning:** If your pre-written strategy says "Run this search, then update beliefs," failing to update makes you incoherent. If the strategy is just "Bet now," thinking longer is optional and not mandated by coherence alone.

  **4. Where is your principle confused?**
  *   **Verdict:** You are confusing the *betting policy* with the *cognitive labor*.
  *   **Reasoning:** Your definition says the strategy "could have been written down... before you started." If that strategy includes the instruction "Run the divisor search," then you are no longer bounded regarding that search—you have outsourced the omniscience to the paper. If the strategy does *not* include the search, then a bookie cannot exploit your failure to search. The confusion lies in whether the "bound" applies to the agent's brain or the agent's written instructions. You cannot have it both ways: either the algorithm is part of you (and you must update), or it is external (and you can't be booked on it).

  ### Final Verdict on Your Situation

  You were rational to offer 70% odds. Your friends are conflating **ontic certainty** (the number is definitely prime or not) with **epistemic certainty** (you definitely know which it is).

  *   **Your Status:** You are a bounded agent dealing with logical uncertainty.
  *   **Their Error:** They are applying norms for logically omniscient beings to finite humans.
  *   **The Bottom Line:** Assigning probabilities to math facts before computation is complete is not only permitted, it is required for rational decision-making. Your 70% figure is a measure of your search's progress, not the number's metaphysical status.
