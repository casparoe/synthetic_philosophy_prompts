answer: |-
  This clock face on the wall denies pure **time**,
  Nothing holds fast except the seeing **substance**.
  I watch the water move along the **river**,
  And think I see a stripe within the **tiger**,
  Or feel the heat ascending from the **fire**,
  But all are shapes the eye has briefly **made**.

  What was remembered is only newly **made**,
  A present trick to mimic lost **time**.
  The ash remains, but not the burning **fire**,
  No solid ground beneath the shifting **substance**.
  I hear the growl inside the cageless **tiger**,
  But stand alone upon this bank of **river**.

  To step again into the same **river**
  Is false; the water and the foot are **made**
  Anew. No stripe belongs to yesterday's **tiger**,
  Nor does the clock preserve a single **time**.
  If every grain differs in its **substance**,
  How count the beats apart from sudden **fire**?

  The heat consumes, yet leaves no trace of **fire**,
  The man who stood here yesterday beside the **river**
  Is gone. There is no persistent **substance**
  To hold the shape the memory has **made**.
  One instant dies before the next in **time**,
  And leaves no witness but a ghostly **tiger**.

  And yet I am the stripe upon the **tiger**,
  I am the heat ascending from the **fire**.
  No clock remains to measure out the **time**,
  For I am not the watcher of the **river**,
  I am the water flowing, newly **made**,
  The only brief and perishing **substance**.

  Such knowledge is a cold and thin **substance**,
  It stays no teeth belonging to the **tiger**,
  Nor mend the house that ruin has **made**.
  It offers no protection from the **fire**,
  No bridge to cross the widening **river**,
  No halt before the descending weight of **time**.

  All **time** is now, a single **substance** here,
  One **river** forks through every **fire** unburned,
  Unsure if one **tiger** speaks or six were **made**.

  ***

  **Note on Argument Mapping (for author's check only):**

  *   **Stanza 1 (Idealism):** Establishes that objects (clock, water, tiger, fire) only exist as perceived ("seeing substance", "shapes the eye has... made").
  *   **Stanza 2 (Memory):** Argues memory is a present act ("newly made"), not proof of a past ("mimic lost time").
  *   **Stanza 3 (Succession):** Uses Heraclitus's river; if every instant differs ("grain differs"), there is no metric to link them ("How count the beats").
  *   **Stanza 4 (Self):** Concludes the self cannot persist ("The man... Is gone", "no persistent substance").
  *   **Stanza 5 (The Turn):** The "And yet". The speaker identifies *with* the flow rather than observing it ("I am the stripe", "I am the water"). This is the "consolation".
  *   **Stanza 6 (The Failure):** Acknowledges the consolation is intellectual only ("cold and thin substance"); it does not stop death ("teeth", "ruin", "weight of time").
  *   **Tornada:** Line 1 collapses time ("All time is now"). Line 2 invokes the Forking Paths ("river forks"). Line 3 admits the poem's own uncertainty regarding its unity vs. multiplicity.
