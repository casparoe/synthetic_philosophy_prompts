  [Stand, adjust the microphone, and smile at the table.]

  Good evening. I am the seventh toast of the evening. By any standard calculation, I am the marginal voice. In the models Professor Kessel spent her life refining, by the time the seventh person stands up, the public pool of information is already full. Anything I say now is supposed to be redundant, a mere echo of the six wonderful speakers who preceded me. They have told you who she is as a scholar, a colleague, and a leader. They have spoken with warmth and precision, and I believe every word they said.

  But there is a structural joke in tonight's programme that only a few of you might appreciate. They have placed her very first PhD student at the very end of the line. It looks like a cascade: one voice following another until the signal is lost. But Miriam taught me that a private signal still matters, even when the public chorus is loud. So, I am not here to add to the chorus. I am here to offer a single data point that contradicts the picture of perfection you might be forming.

  In the spring of 1997, I was finishing my degree. I was uncertain, afraid of the market, and leaning toward a safe postdoc. Miriam pressed me. Hard. She argued for a specific job at a university far from here. She used every tool in her arsenal. She mapped the incentives, she outlined the trajectory, and she told me, explicitly, that I was underestimating my own capacity. She was my supervisor, and I trusted her judgment more than my own. So I took the job.

  It was a mistake. The department was dysfunctional, the city was isolating, and the work suffered. I left two years later with my confidence shaken. In the years since, I have watched many senior scholars rewrite history when their advice goes awry. They soften the memory. They suggest the advisee misunderstood the nuance. They protect their reputation by blurring the record.

  Miriam never did that. Not once. In twenty-five years of conversations, she never hinted that she had been right and I had executed poorly. She never suggested I had misheard her. She allowed the record to stand: she had advised a path, the path had failed, and she had been wrong. She accepted the cost of that error without discounting it.

  [Pause briefly, looking toward the family table.]

  Mrs. Kessel, you raised a daughter who taught me that being right is less important than being truthful. That is a rare thing in academia, and a rarer thing in life. The previous speakers have told you about her mind. I am telling you about her integrity. The models she wrote describe how people hide behind the crowd to avoid the pain of being alone in error. Miriam lived her life proving that pain was bearable, provided you didn't lie about it.

  So, I am not here to praise her infallibility. She wasn't infallible. I am here to thank her for owning her fallibility. She did not want me to turn her into a theorem tonight. She wanted me to tell the truth. And the truth is that she loved us enough to let us see when she missed the mark, and to stand by us when we fell.

  To those of you who know the models: you know that a single credible dissent breaks a cascade. To those of you who know her heart: you know that honesty was her native language. I am the seventh voice, but I hope this one carries a private signal clear enough to cut through the noise.

  Please join me in raising a glass. To Miriam: for the questions she answered, for the answers she got wrong, and for the truth she never compromised. To Miriam.
