          *   *Let's go with **GC Pause (Stop-the-World)**.*
          *   *Access:* JMX reports GC duration *after* the fact.
          *   *Phenomenal:* The threads actually stopping *during* the fact.
          *   *Why others fail:* Screens imply a viewer. Private fields imply encapsulation.
          *   *Selection:* **The Garbage Collector Pause.** It's visceral, system-level, and distinguishes between "reported metric" (Access) and "actual execution halt" (Phenomenal).
