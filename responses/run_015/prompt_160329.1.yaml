  5.  **Final Polish:**
      *   Tone: Peer-to-peer, pragmatic, no fluff.
      *   Structure: Follow the 6 points exactly.
      *   Time Management: 40 mins is tight. 10 intro/access, 10 phenomenal/example, 10 GWT, 5 check, 5 Q&A.

