          *   *Question:* Which one has the "experience" of the traffic?
          *   *Actually, let's use the **Two-Bus idea** from section 6 but refine it for the check.*
          *   *Let's go with **The Canary Release that Panics**.*
          *   *Spec:* Service X. Config A: Panics log to stdout (accessible), process continues. Config B: Panics cause process freeze (phenomenal), but logging is disabled (inaccessible).
          *   *Task:* Which configuration aligns closer to "Pain without Report" vs "Report without Pain"?

      *   **5. Refusals:**
          *   AI Welfare (Too ethical/legal).
          *   Hard Problem (Too metaphysical).
          *   Rival Theories (IIT, Panpsychism - too much scope).
          *   *Phrasing:* "We are modeling architecture, not souls."

      *   **6. The Two-Bus Idea:**
          *   Bus A (GWT style): Contended, limited, drives action.
          *   Bus B (Silent): Broadcasts everywhere, no action, no memory.
          *   *Critique:* If nothing reads Bus B, is it really "broadcast"? In systems, if you write to a bus no one subscribes to, it's just a write.
          *   *Fix:* Bus B subscribers *receive* the data but are coded to `IGNORE` it.
          *   *Value:* It isolates "Availability" from "Impact."
