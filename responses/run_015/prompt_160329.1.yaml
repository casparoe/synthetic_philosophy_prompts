          *   *Better:* **The "Zombie" Service.** It broadcasts health checks (Access) but its internal logic is stuck in an infinite loop that doesn't affect output (Phenomenal?). No, that's buggy.
          *   *Best:* **A Shadow Mode Deployment.**
          *   *System A:* Runs live traffic, broadcasts metrics, makes decisions.
