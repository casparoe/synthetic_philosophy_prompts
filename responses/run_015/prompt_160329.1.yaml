          *   *And "Access w/o Phenomenal":* A simulated metric sent to Prometheus saying "RTO happened" when it didn't. (Access exists, no actual blocking occurred).
          *   *This works.*

      *   **3. Misconceptions:**
          *   "GWT = Kafka." (Preempt during GWT intro).
          *   "Logging = Consciousness." (Preempt during Access definition).
          *   "P-consciousness is just a private variable." (Preempt during Example).
