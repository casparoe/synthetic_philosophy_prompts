  You have backed yourself into a very specific, well-known corner in decision theory. You are currently occupying the position of an **Updateful Evidential Decision Theorist (EDT)**, but you are using the language and intuitions of **Functional Decision Theory (FDT)** or **Superrationality**.

  Here is the specific diagnosis: **(4) is the odd one out**, but only if you want to keep the label "Superrationality" and the justification in (3). If you are willing to drop the "Superrational" label and settle for "Evidentialist," your position is actually consistent.

  However, since you invoked Newcomb's Problem in (3) and Superrationality in your premise, (4) is the commitment that breaks the logical spine of your framework.

  Here is the breakdown of why, what you have to give up, and why the others are safe.

  ### 1. The Core Tension: (3) vs. (4)

  You justify (1) by appealing to (3): *"My cooperating is evidence that my twin cooperates, in the same way one-boxing in Newcomb's problem is right."*

  This is the critical link. Newcomb's Problem and Counterfactual Mugging are structurally identical regarding the **source of the correlation**.
  *   **In Newcomb's:** Omega filled the box yesterday based on a prediction of your algorithm. The money is already there (or not).
  *   **In Mugging:** Omega flipped the coin yesterday (or simulated the flip) based on a prediction of your algorithm. The outcome is already fixed.

  In (3), you accept that your current choice is logically linked to a past prediction (Omega's filling of the box). You accept that "acting as a One-Boxer" is what secures the million, even though your choice doesn't *causally* put the money there.

  In (4), you reject this link. You say, *"The coin has already landed... nothing I do now makes anybody better off."* This is **Causal Decision Theory (CDT)** reasoning. You are treating the past prediction as causally severed from your current choice.

  **The Contradiction:** You cannot consistently claim that your choice is evidentially linked to Omega's past prediction in Newcomb's (to justify One-Boxing/Cooperating) but causally severed from Omega's past prediction in Mugging (to justify Not Paying). Both rely on Omega simulating your reasoning algorithm.

  **The Fix:** To maintain (1) and (3) as "Superrational" moves, you must accept **(FDT/UDT)**. This requires you to **pay in the Counterfactual Mugging**.
  *   **Cost:** You lose $100 in the specific instance where the coin is Tails.
  *   **Gain:** You become the *type of agent* that Omega predicts will pay, which means you win the $10,000 in the Heads world (or, in the logical multiverse sense, you maximize utility across all logical possibilities of your algorithm).

  ### 2. Why (1), (2), and (5) Are Safe

  You are worried that (2) undermines (1), or (5) commits you to something (2) rules out. They do not.

  *   **(1) vs. (2):** This is a **Reference Class** distinction, not a logical contradiction.
      *   In (1), you have "good reason to think [they] reason more or less exactly the way I do." The logical correlation is near 100%.
      *   In (2), you have "no reason to think [they] reason like me." The logical correlation is near 0%.
      *   Superrationality/FDT is conditional on logical similarity. Defecting against a CDT agent (who will defect regardless) is the correct FDT move. Cooperating with a Twin (who mirrors your algorithm) is the correct FDT move. There is no tension here.

  *   **(5) Voting:** This is consistent with (1).
      *   Voting is a many-player coordination game. Even if the causal impact of one vote is zero, the *evidential* impact (that "people like me" are voting) can be high enough to justify the cost.
      *   This relies on the same mechanism as (1): "My action is evidence of the output of the algorithm 'Reasoning Like Me'."
      *   The only difference is the group size. As long as you believe there are enough "people like you" to make the expected value positive, (5) holds. It does not force you to cooperate with *everyone* (as in 2), only with the reference class you believe is large enough to matter.

  ### 3. The Diagnosis: Updatefulness vs. Updatelessness

  The reason you feel stuck is that you are **Updateful**.

  *   **Updateful (Your current spot):** You update on all available information. In Mugging, you know the coin is Tails. Therefore, paying buys you nothing *in this specific world*. You refuse.
  *   **Updateless (The Superrational spot):** You ignore information that you couldn't have controlled before the prediction was made. You reason: "Before I knew the coin result, would I want to be an agent who pays? Yes. So I pay."

  **The Hard Truth:**
  If you keep (4), you are not a Superrationalist in the Hofstadter/Yudkowsky sense; you are a standard Evidential Decision Theorist.
  *   **EDT** One-Boxes in Newcomb (consistent with your 3).
  *   **EDT** Cooperates with Twins (consistent with your 1).
  *   **EDT** Refuses Counterfactual Mugging *after* knowing the coin is Tails (consistent with your 4).

  So, logically, your five points are **consistent under EDT**.

  **However**, the "Superrational" label usually implies a commitment to the *algorithm* over the *instance*. If you want to claim the Superrational mantle, (4) is the betrayal. It admits that when the chips are down and the evidence is clear, you revert to Causal reasoning ("nothing I do makes anybody better off").

  ### Recommendation

  **Drop (4).**

  Here is why:
  1.  **Preserves the Analogy:** It keeps your justification in (3) honest. Newcomb's and Mugging are the same mechanism. If you respect the logic in one, you must respect it in the other.
  2.  **Preserves the "Twin" Link:** If you meet a Twin who is also Updateful, they know you won't pay in Mugging. This might not affect the PD, but it weakens the "logical identity" claim. If you are truly running the same algorithm, you should both be Updateless.
  3.  **Cost:** The cost of dropping (4) is finite ($100 in the Tails world). The cost of dropping (3) or (1) is the loss of the "Superrational" advantage entirely (you become a standard defector in PDs with strangers and potentially twins if the evidential link is questioned).

  **Summary:** You are currently an **Updateful Evidential Decision Theorist**. This is a stable position, but it is not "Superrationality" in the strong sense. To be Superrational, you must become **Updateless**. That requires paying the mugger.
