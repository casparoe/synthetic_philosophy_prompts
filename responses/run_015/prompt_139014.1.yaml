answer: |-
  1. You often say it doesn't matter how a belief got there, only that it's true. But if I buy a stolen watch, it tells time perfectly, yet something is still wrong about me owning it. Is moral belief more like telling the right time, or more like owning the watch?

  **Follow-up:** If he says the defect is in the agent's character, not the belief: So the problem is with me, not the action? Then why call it a problem with the *verdict* itself?

  2. Here's the hard one: maybe the distinction between "how I got the belief" and "whether it's a good belief" doesn't work for morality. Can you actually hold a moral truth without holding the reasons for it, or does that make it a different kind of thing entirely?

  **Follow-up:** If he says it's a different kind of thing (not a full moral belief): Then isn't it just not a moral belief at all? Why call it a borrowed verdict instead of just a guess?

  3. If a mechanic says my brakes are shot, I don't need to understand the engineering to fix them; I'm being sensible. You say morality is different because I need to act for the reasons. But the person I help doesn't care about my reasons. So is this worry actually just about me keeping my moral hands clean, rather than helping anyone?

  **Follow-up:** If he says it's about moral worth (a good deed needs understanding): So a borrowed good deed is worth less than an understood good deed? Does that mean I should spend time understanding rather than helping?

  4. I have two friends who agree with me on all the moral rules, but when I ask them how to weigh those rules in a messy situation, they tell me what to do. That feels like borrowing a judgment without borrowing a rule. Does your view treat borrowing a weighting the same as borrowing a verdict, and if so, why?

  **Follow-up:** If he says yes (weighting is also a verdict): But isn't weighing just applying the rules? If I have the rules, haven't I done the work?

  5. When someone tells me "what you did hurt me," I take their word for it immediately, and that doesn't feel hollow. But they aren't a moral expert, they're just the victim. Does this mean moral deference is only okay when it comes from the person affected, or does it show the whole worry is actually about expertise?

  **Follow-up:** If he says it's about the victim's authority (not expertise): Then isn't that just a different kind of expertise? Why does their word count where the expert's doesn't?

  6. What if I defer to someone who is just passing on what they heard from someone else? And what if instead of one person, I just follow what a crowd of disagreeing people roughly converge on? Is that still borrowing, or is it more like reading a map made by many hands?

  **Follow-up:** If he says it's still borrowing (no map analogy works): So a democracy of borrowed verdicts is still morally defective? Does numbers change nothing?

  7. If everyone in a community defers to the same few voices, you get a moral monoculture where nobody's reasons are tested. That looks like a huge harm that has nothing to do with whether any single person's belief is defective. Where does that structural risk fit in your picture?

  **Follow-up:** If he says it's a separate issue (individual vs. collective): But doesn't that structural risk make the individual deference dangerous even if the verdict is true?

  8. Say I decide something is wrong on my own, clumsily, and years later find out an expert I trust agreed with me all along. Do you have to say my original verdict was defective the whole time and I just got lucky? That feels like it rewrites history.

  **Follow-up:** If he says yes (it was defective until confirmed): So the quality of my past reasoning depends on future discovery? Does that make moral truth something we find backwards?

  9. Most of us learned morals by being told what to do as kids. If borrowed verdicts are defective, are we all walking around with a broken moral picture that we later have to repair? And what would that repair even look like?

  **Follow-up:** If he says we outgrow it (developmental): At what age does the borrowing stop being a defect? Is there a birthday where we suddenly need reasons?

  10. I don't want to ask what would change your mind generally, but what's one concrete thing you'd have to give up if it turned out people who defer actually make better moral choices than those who don't?

  **Follow-up:** If he says they can't (empirical claim): But if they did, would you still say something is missing? Is the defect independent of the outcome?
