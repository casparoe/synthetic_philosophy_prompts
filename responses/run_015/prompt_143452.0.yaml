answer: |-
  This is a classic case where a popular summary (the blog your friend read) has compressed a nuanced philosophical history into a caricature. Your skepticism is well-founded: your friend's summary contains a mix of accurate historical footnotes, significant misreadings of Popper's terminology, and unsubstantiated psychological speculation.

  Here is an audit of your friend's claims, separated into what is textually accurate, what is a standard misreading, and what is settled versus debated in the philosophy of science.

  ### 1. The Claim: "Popper attacked natural selection as a tautology."
  **Verdict: Mostly Accurate (with nuance).**

  *   **The Text:** In the 1970s (specifically a 1974 lecture published in *The Philosophy of Karl Popper*), Popper did describe the principle of natural selection as "tautological." His worry was the classic one: If "fitness" is defined *only* by "survival," then "the fittest survive" just means "those who survive, survive."
  *   **The Nuance:** Popper was not alone in this; it was a common objection in the mid-20th century. However, Popper acknowledged that biologists *could* define fitness independently of survival (e.g., via physiological traits or reproductive propensity). His initial criticism was that the *statement itself*, as often phrased, risked being unfalsifiable.
  *   **Settled Consensus:** Philosophers of biology generally agree this objection has been resolved. Fitness is now understood as a probabilistic propensity, not a retrospective label. Popper eventually accepted this.

  ### 2. The Claim: "Popper classified evolutionary theory as metaphysical rather than real empirical science."
  **Verdict: Accurate Quote, Misleading Interpretation.**

  *   **The Text:** Popper famously referred to Darwinism as a "metaphysical research programme."
  *   **The Misreading:** Your friend treats "metaphysical" as a synonym for "pseudoscience" or "garbage." This is the critical error.
  *   **Popper's Actual View:** For the *early* Popper (1930s), metaphysical statements were indeed outside the realm of science. However, the *later* Popper (1970s) revised this. He came to view metaphysical ideas as **indispensable precursors to science**. To call something a "metaphysical research programme" was not to dismiss it; it was to say it provides the *framework* within which testable science happens.
  *   **Settled Consensus:** Scholars agree that for the later Popper, "metaphysical" did **not** mean "unscientific" in the pejorative sense (like astrology). It meant "not directly testable in isolation, but fruitful for generating testable hypotheses." Your friend is correct that Popper used the label, but wrong about what Popper meant by it.

  ### 3. The Claim: "Popper recanted only because biologists bullied him / to save face."
  **Verdict: Unsubstantiated / Likely False.**

  *   **The Text:** In his autobiography *Unended Quest* (1976) and the paper "Natural Selection and the Emergence of Mind" (1978), Popper explicitly wrote: "I have changed my mind about the testability and logical status of the theory of natural selection." He stated he was glad to have the opportunity to recant.
  *   **The Speculation:** There is no evidence in Popper's correspondence or texts that he felt "bullied." Popper was notoriously stubborn (he never recanted his views on Freud or Marx). When Popper *did* change his mind, he usually did so loudly and proudly.
  *   **Debated:** While the *consensus* among historians of philosophy is that the change was genuine, some critics argue Popper remained skeptical privately. However, attributing it to "bullying" is a psychological speculation not supported by the textual record. It is more likely he was persuaded by the work of biologists who showed how specific evolutionary hypotheses *could* be falsified (e.g., if a rabbit fossil were found in the Precambrian).

  ### 4. The Claim: "Popper still secretly thought Darwinism explains every outcome after the fact."
  **Verdict: Contested Interpretation.**

  *   **The Worry:** This refers to the problem of "adaptive stories." It is easy to look at a trait and invent a reason why it was selected *after* the fact. This is a genuine philosophical problem in evolutionary biology (often associated with Gould and Lewontin's "Spandrels" paper).
  *   **Popper's Revision:** Popper's recantation was based on the realization that while *general* natural selection is a framework, *specific* evolutionary claims are testable. We can falsify the claim that "X trait evolved for Y purpose" by showing the trait existed before the pressure, or imposes a cost without a benefit.
  *   **Debated:** This is where there is genuine debate. Some philosophers of biology agree with your friend that evolutionary psychology or specific adaptationist claims are hard to falsify. However, this is a critique of *how biologists work*, not necessarily a refutation of Popper's recantation. Popper admitted the *theory* is scientific, even if *some applications* of it are sloppy.

  ### 5. The Claim: "Falsifiability is useless for historical sciences."
  **Verdict: Standard Misreading of Popper.**

  *   **The Issue:** Your friend implies that because evolution is historical (dealing with past events), it cannot be falsified.
  *   **Popper's View:** Popper distinguished between "historicism" (predicting the future course of history, which he rejected) and "historical explanation." He did not believe historical sciences were immune to falsification. A historical science is scientific if it posits universal laws (like genetics or selection) that apply to the past and can be tested against evidence (fossils, DNA).
  *   **Settled Consensus:** Popper's criterion applies to the *mechanisms* proposed, not just the timeline. If a theory of evolution claims "Species A cannot arise before Time B," finding Species A before Time B falsifies the theory. Therefore, falsifiability is not useless for historical sciences.

  ### Summary: Settled vs. Debated

  | Claim | Status | Notes |
  | :--- | :--- | :--- |
  | **Popper called Darwinism "metaphysical."** | **Settled Fact** | He used this phrase explicitly in the 1970s. |
  | **"Metaphysical" meant "unscientific/nonsense."** | **Settled Misreading** | For the later Popper, metaphysics was a valuable framework for science, not its opposite. |
  | **Popper recanted his view.** | **Settled Fact** | He wrote explicitly about changing his mind in *Unended Quest*. |
  | **He recanted due to bullying/embarrassment.** | **Unsubstantiated** | No textual evidence; contradicts Popper's usual stubbornness. |
  | **Evolutionary theory is unfalsifiable.** | **Debated** | Most philosophers of biology say it *is* falsifiable; some argue specific adaptationist stories are not. |
  | **Falsifiability doesn't work for history.** | **Settled Misreading** | Popper allowed for historical sciences provided they rely on testable universal laws. |

  ### The Crucial Distinction: Metaphysical vs. Unscientific

  You were right to zero in on this. This is the linchpin of the argument.

  *   **Early Popper (1934):** Demarcation is sharp. Science = Falsifiable. Metaphysics = Non-falsifiable (and largely dismissed).
  *   **Late Popper (1970s):** Demarcation is softer. Science grows out of metaphysics. A "Metaphysical Research Programme" is a worldview that guides scientific inquiry.
  *   **The Verdict:** When Popper called Darwinism a "metaphysical research programme," he was arguably **praising** its heuristic power, not banning it from science. He later clarified that because it generates testable models, it *is* science. Your friend is treating "metaphysical" as an insult Popper later took back; in reality, it was a classification Popper refined.

  ### Conclusion on the Argument

  Your friend's summary is a "straw man" built from half-truths.
  1.  **True:** Popper was initially skeptical of Darwinism's testability.
  2.  **True:** Popper used the word "metaphysical."
  3.  **False:** Popper equated "metaphysical" with "worthless."
  4.  **False:** Popper recanted due to social pressure.
  5.  **False:** Falsifiability cannot apply to historical sciences.

  Popper's revision was **substantive, not cosmetic**. He realized that while the *general principle* of selection is a framework, the *specific models* built on it are empirically testable. Your friend is correct that "explaining after the fact" is a risk in evolutionary biology, but that is a risk of bad practice, not a flaw in the theory's logical structure that Popper failed to see.

  You win this round on the textual accuracy, provided you emphasize that Popper's definition of "metaphysics" evolved alongside his view on Darwinism.
