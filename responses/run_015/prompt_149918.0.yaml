  **INSTITUTE FOR PROPER FUNCTION RESTORATION (IPFR)**
  **PATIENT INTAKE FORM 88-B: TELEOLOGICAL COMPLIANCE AND ORGAN VALIDATION**
  **Revision 4.1 (Post-Brussels Protocol)**

  **NOTICE TO PATIENT:** By submitting this packet, you acknowledge that the IPFR, following its recent merger with a **Neo-Aristotelian Teleology Consultancy**, prioritizes the restoration of *proper function* over mere systemic capacity. We do not simply repair pumps; we restore purpose. Please read all clauses regarding the metaphysical status of your implants.

  **SECTION 4.2: HISTORICAL LINEAGE VERIFICATION**
  Pursuant to the **2029 Brussels Protocol on Synthetic Selection Histories**, all biological implants must submit documented evidence of evolutionary selection history. 
  □ **Option A (Etiological Standard):** Patient requests an organ with a verified lineage of natural selection. 
  *Requirement:* Submit phylogenetic records demonstrating that the organ type was preserved in the gene pool specifically due to the capacity it will perform in your body. 
  *Note:* A heart removed from a donor whose ancestors survived due to cardiac efficiency qualifies. A heart grown via stem-cell scaffolding without selective pressure does not qualify as "functional" in the proper sense, regardless of beating frequency. 
  □ **Option B (Lineage Deficit):** Patient acknowledges implant lacks selection history. Proceed to Section 7.1.

  **SECTION 7.1: THE SYSTEM-CONTRIBUTION EXCEPTION**
  If Option B is selected, the patient accepts a synthetic or bioengineered organ that contributes to systemic capacity but lacks etiological grounding. 
  □ **Waiver of Ontological Drift:** I understand that while this implant will circulate blood (causal role), it possesses no *proper function* derived from historical selection. I accept responsibility for any existential dissonance arising from housing a component that *does* work but was never *selected to* work. 
  □ **Liability Release:** The IPFR is not liable for feelings of hollowness resulting from the realization that your liver is merely a chemical filter rather than a teleological entity. 
  □ **Compliance Check:** Patient agrees not to refer to the implant as "functional" in medical records without appending the qualifier "(causal-role only)." Misclassification may void insurance coverage under Policy 99-C (Teleological Misrepresentation).

  **APPENDIX B: REFUND POLICY FOR CONTINUITY DISPUTES**
  Disputes regarding implant performance are adjudicated based on the framework selected in Section 4.2. Compatibilism is not recognized for billing purposes.

  1.  **Etiological Failure:** If an organ with verified lineage fails to perform its selected effect (e.g., a historically validated heart stops pumping), the patient is eligible for a full refund and replacement. The malfunction confirms the loss of proper function.
  2.  **Causal Adequacy Dispute:** If an organ lacking lineage (Option B) performs its capacity successfully (e.g., a synthetic heart pumps blood), no refund is granted for "lack of purpose." The system contribution is adequate, even if the history is vacant.
  3.  **Inverse Dispute:** If an organ with verified lineage performs its capacity successfully but is discovered to have been preserved by genetic drift rather than selection for that capacity, coverage is denied. The organ is functioning causally but lacks proper function; therefore, no restoration has occurred.
  4.  **Merger Clause:** Following the Neo-Aristotelian merger, patients seeking final causes must schedule a separate consultation with Teleology Services. Additional fees apply for essence verification.

  **PATIENT ACKNOWLEDGMENT**
  I certify that I understand the distinction between what my organs *do* and what they were *selected to do*. I accept that a pacemaker is a tool, not a trait, unless documented otherwise under the Brussels Protocol.

