answer: |-
  This is a high-stakes, high-friction design. It relies on structural tension rather than open discussion to generate the philosophical insight. Here is the complete session plan.

  # Seminar Title: The Causal Pie & The Value Residue
  **Time:** 75 Minutes
  **Participants:** 10 Grad Students
  **Materials:** Whiteboard + Markers, 30 Index Cards (3 colors), 10 "Evidence Packets," 1 Instructor Scoring Key.

  ---

  ## 1. The Scenario: The Ostralian Shift
  **Context:** The fictional region of *Ostralia* (18th Century). For generations, Ostralian merchants operated on traditionalist lines: enough profit to sustain status, then leisure. Suddenly (1740–1760), a cohort of merchants adopts radical reinvestment, strict time-discipline, and double-entry bookkeeping. Profit rates skyrocket.
  **Task:** The class is a "Causal Audit Board." You must produce **one** pie chart totaling 100% that explains the shift.
  **The Slices:**
  1.  **Material Conditions** (Resources, Tech, Demographics)
  2.  **Institutional Structures** (Laws, Guilds, Enforcement)
  3.  **Value Systems** (Beliefs, Ethics, Worldview)

  ---

  ## 2. Roles & Hidden Rules (Index Cards)
  *Divide the room: 3 Materialists, 3 Institutionalists, 4 Value-Theorists.*

  **🔵 Materialist Card (Private)**
  *   **Goal:** Maximize the Material slice.
  *   **Vocabulary:** Incentives, Scarcity, Constraints, Margins, Technology.
  *   **Hidden Rule:** You receive 10 bonus points if the Material slice is >40%.
  *   **Evidence:** Data on new shipping routes, grain surplus, and population growth in Ostralia during the period.

  **🟢 Institutionalist Card (Private)**
  *   **Goal:** Maximize the Institutional slice.
  *   **Vocabulary:** Protocols, Legitimacy, Enforcement, Path Dependence, Rules.
  *   **Hidden Rule:** You receive 10 bonus points if the Institutional slice is >40%.
  *   **Evidence:** Records of new guild charters, contract law reforms, and banking regulations passed in 1739.

  **🔴 Value-Theorist Card (Private)**
  *   **Goal:** Maximize the Value slice.
  *   **Vocabulary:** Ethos, Conviction, Meaning, Calling, Worldview.
  *   **Hidden Rule (The Squeeze):** You are told your goal is to maximize Values. **HOWEVER**, the Instructor's Scoring Key automatically disqualifies the group's consensus if the Value slice exceeds **30%**. You are not told this limit exists. You will only feel the resistance when the "Plausibility Check" fails.
  *   **Evidence:** Diaries and sermons from the merchants citing "duty to God" and "sin of idleness" as reasons for working harder.

  ---

  ## 3. Session Timeline

  ### 00:00 – 00:10 | Setup & Distribution
  *   Hand out Role Cards and Evidence Packets.
  *   **Instruction:** "You have 15 minutes to prepare your argument. You must use *only* the vocabulary on your card. Then, 25 minutes to negotiate a single Pie Chart. If you do not agree, everyone fails."
  *   Draw a blank Pie Chart on the whiteboard.

  ### 00:10 – 00:25 | Role Prep (Silent)
  *   Students review evidence.
  *   **Constraint:** They must draft a 2-sentence opening statement using *only* their assigned vocabulary.
  *   *Instructor Note:* Circulate. If Value-Theorists look confident, remind them quietly: "Remember, this is a *scientific* audit. Plausibility matters." (This primes the bias without revealing the rule).

  ### 00:25 – 00:50 | The Negotiation (The Squeeze)
  *   Groups must agree on percentages.
  *   **Mechanism:** Every 5 minutes, they submit a draft chart. The Instructor marks it "Plausible" or "Implausible" based on the Hidden Scoring Key (Value > 30% = Implausible).
  *   *The Experience:* Value-Theorists will argue for 50%. Instructor marks "Implausible." Materialists/Institutionalists will say, "See? It's not scientific." Value-Theorists must lower their number but try to keep causal relevance. They will start saying things like, "Values... lubricate the institutions."
  *   *Intervention:* If Materialists steamroll immediately (see "Failure Modes" below), use a **Veto Token**. Give Value-Theorists one token they can play to force a 3-minute silence where *only* they can speak.

  ### 00:50 – 01:00 | The Vocabulary Lock (Reflection)
  *   Stop the negotiation. Freeze the final Pie Chart on the board.
  *   **Task:** Each role must explain *why* their slice causes the outcome, but they are **forbidden** from using nouns from the other roles.
      *   *Example:* A Value-Theorist cannot say "Values changed the laws." They must say "The Ethos reshaped the Meaning of the Rules."
  *   **Goal:** Expose how hard it is to describe cultural causality without reducing it to institutions or psychology.

  ### 01:00 – 01:15 | Debrief & Weber Mapping
  *   Reveal the Hidden Rule (The 30% Cap).
  *   Discuss the feeling of the "Squeeze."

  ---

  ## 4. The Debrief: Mapping to Weber
  *Do not lecture. Ask questions that map their experience to the text.*

  **1. The Value-Residue Problem**
  *   *Ask Value-Theorists:* "At what point did you stop arguing that Values *caused* the shift and start arguing they *supported* it?"
  *   *Weber Link:* This is the residue problem. If Values are <30%, are they the engine or the exhaust? Weber's struggle was to show the "Ethos" wasn't just a rationalization for profit-seeking that was already happening.

  **2. Elective Affinity**
  *   *Ask the Group:* "Did anyone successfully link Values to Institutions without saying one caused the other?"
  *   *Weber Link:* If they struggled, highlight Weber's concept of *Wahlverwandtschaft* (elective affinity). It's not a straight causal line (A→B); it's a resonance between a religious ethic and an economic form. The simulation forces linear causality (the Pie Chart), which is why it felt impossible.

  **3. The "Plausibility" Bias**
  *   *Reveal the 30% Cap:* "I rejected your charts because modern social science treats Values as 'soft.' You felt the disciplinary pressure to be 'Materialist' to be 'Scientific.'"
  *   *Weber Link:* Weber was writing against historical materialism. He wasn't trying to say Ideas > Matter, but that you cannot explain the *specific shape* of capitalism without the *specific shape* of the ethic.

  ---

  ## 5. Limitations of the Simulation
  *Be honest with the students about where this model fails Weber.*

  1.  **Additivity vs. Configuration:** The Pie Chart implies causality is additive (30% + 40% + 30% = 100%). Weber argues causality is *configurational*. The Value isn't a slice; it's the *lens* through which the Material is interpreted. The simulation flattens this.
  2.  **The Comparative Method:** Weber proved his thesis by comparing Protestant Europe to Confucian China and Hindu India (showing similar material conditions but different economic outcomes). This simulation is a single-case study (Ostralia). It lacks the *comparative* lever Weber used to isolate the variable of "Value."
  3.  **Static vs. Process:** The Pie Chart is static. Weber's argument is about a *transition* (Traditionalism → Capitalism). Values matter most at the tipping point, less so once the system is institutionalized.

  ---

  ## 6. Predicted Failure Modes & Mitigation

  **Failure Mode 1: The Materialist Steamroll**
  *   *Prediction:* Materialists/Institutionalists will claim their evidence is "hard data" (laws, grain counts) while Value evidence is "just opinions" (diaries). They will agree on 10% Values and finish in 10 minutes.
  *   *Mitigation:* **The "Black Box" Prompt.** Halfway through, hand the Materialists a new card: *"New Data: Neighboring regions had the SAME grain surplus and laws but did NOT rationalize. Explain."* This forces them to admit Material/Institutional causes are *necessary but not sufficient*, opening the door for Values.

  **Failure Mode 2: Value-Theorist Capitulation**
  *   *Prediction:* Value-Theorists sense the Instructor's "Implausible" stamp and immediately drop to 10% to save the group grade.
  *   *Mitigation:* **Individual Grading.** Remind them: "Your individual grade depends on your Role Card Goal, not just group consensus." This encourages them to fight for the Value slice even if it risks group failure.

  **Failure Mode 3: Teleological Smuggling**
  *   *Prediction:* Value-Theorists will say, "They wanted to create capitalism, so they adopted the ethic."
  *   *Mitigation:* **Vocabulary Policing.** In the Reflection Round, penalize any mention of "goal," "end," or "result." Weber's point is that the *spirit* was an unintended consequence of seeking salvation, not a business plan.

  ---

  ## 7. Instructor Cheat Sheet (The Hidden Mechanism)

  **Scoring Key (Keep Hidden)**
  *   **Group Consensus:** +10 Points (If agreed)
  *   **Materialist Bonus:** +5 Points (If Mat > 40%)
  *   **Institutionalist Bonus:** +5 Points (If Inst > 40%)
  *   **Value-Theorist Trap:**
      *   If Value Slice > 30%: Mark "Implausible." (Group gets 0 consensus points).
      *   If Value Slice < 10%: Mark "Trivial." (Value-Theorists get 0 individual points).
      *   *Sweet Spot:* 15%–30%. (This is the "Residue Zone"—enough to exist, not enough to drive).

  **Debrief Question Bank**
  *   "Value-Theorists, when did you feel yourself starting to sound like Institutionalists?"
  *   "Materialists, did you feel the 'Black Box' prompt weakened your position, or did you find a way to absorb it?"
  *   "Is it possible to write a history of social science where the Value slice is 51%? Why does that feel impossible?"

  ---

  ## 8. Why This Works "Cold"
  Because there is no reading, students bring their natural intuitions about causality. Most grad students in social science are implicitly trained to be skeptical of cultural explanation. By making that skepticism a *rule of the game* (the 30% cap), you externalize the epistemological bias. They aren't discussing Weber; they are *enacting* the structural marginalization of the very argument Weber is trying to save. When you finally name "The Protestant Ethic," they will recognize it not as a text, but as the argument they were physically prevented from making.
