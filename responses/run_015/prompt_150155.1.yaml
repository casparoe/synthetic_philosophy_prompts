answer: |-
  Here is the spec. It is built to be diagnostic in real time, not just explanatory in retrospect.

  ### The Spec

  **1. The Isolation/Immunization Distinction**
  *   **Requirement:** The account must distinguish between structural isolation (never seeing the argument) and epistemic immunization (seeing the argument but possessing a standing reason to distrust the source).
  *   **Case:** A voter who never reads the opposing newspaper vs. a voter who reads it but believes it is owned by a foreign adversary.
  *   **Status:** **Non-negotiable.** If the theory conflates these, it prescribes the wrong fix (break the wall vs. rebuild trust).
  *   **User Input:** Addresses your first tripping point. A theory that cannot separate these is useless for intervention.

  **2. The Legitimate Deference Clause**
  *   **Requirement:** The account must explain why trusting a mechanic or doctor is rational while trusting a conspiracy leader is not, without relying on the truth of the belief (which you often can't know in real time). It must rely on the *structure* of the trust relationship (accountability, track record, cross-checking).
  *   **Case:** You cannot verify your brake job, but the mechanic is licensed and liable. A guru is neither.
  *   **Status:** **Non-negotiable.** Without this, the theory condemns all epistemic dependence as "echo chamber" behavior, which makes normal life impossible.
  *   **User Input:** Addresses your second tripping point. The exception cannot swallow the rule.

  **3. The Motivation Triangulation**
  *   **Requirement:** The account must separate honest error (trying to find truth, failing), epistemic indifference (truth doesn't matter, only victory), and strategic deception (knowing the truth, hiding it).
  *   **Case:** A scientist using flawed methods vs. a activist cherry-picking data vs. a liar fabricating data.
  *   **Status:** **Non-negotiable.** "Bad faith" is a specific accusation; if it covers honest error, it is merely an insult.
  *   **User Input:** Addresses your third tripping point. Indifference to truth is the core of modern polarization; the theory must isolate it.

  **4. The Asymmetry Permission**
  *   **Requirement:** The theory must allow for the verdict that one side is currently more epistemically secure than the other, based on evidence density or methodological rigor, without requiring a compensating fault on the other side.
  *   **Case:** Climate science consensus vs. denialism.
  *   **Status:** **Non-negotiable.** If the theory forces symmetry, it is moralizing, not diagnostic.
  *   **User Input:** Addresses your fourth tripping point. This is a calibration problem, not a contradiction, but the theory must permit the asymmetry.

  **5. The Persistence Explanation**
  *   **Requirement:** The account must explain why recognizing the quality of an opposing argument (the unlabelled test) does not necessarily change the view. It must account for the cost of changing one's mind (social, identity-based) independent of the evidence.
  *   **Case:** Your hypothetical where unlabelled arguments are rated higher but views don't move.
  *   **Status:** **Non-negotiable.** If the theory assumes belief follows evidence quality, it fails to describe human beings.
  *   **User Input:** Addresses your fifth tripping point. This is not just social psych; it is central to the theory of disagreement.

  **6. The Dissent/Crank Differentiator**
  *   **Requirement:** The account must distinguish between a marginalized group being ignored due to bias vs. being ignored due to methodological failure. It must rely on process markers (peer review, predictive success) rather than outcome (who was right).
  *   **Case:** Helicobacter researchers vs. anti-vaxxers.
  *   **Status:** **Non-negotiable.** If the theory cannot distinguish these in real time, it becomes a defense of contrarianism for its own sake.
  *   **User Input:** Addresses your sixth tripping point. The account owes you a way to separate them via method, not hindsight.

  **7. Level Clarity (Person vs. Environment)**
  *   **Requirement:** The account must specify whether it is diagnosing an individual's reasoning or an information environment's structure. It cannot slide between the two.
  *   **Case:** Calling a person "radicalized" vs. calling a platform "radicalizing."
  *   **Status:** **Non-negotiable.** Conflating them creates category errors where structural fixes are demanded of individuals.
  *   **User Input:** Addresses your seventh tripping point. Do one or the other, or explicitly bridge them.

  **8. Political Symmetry**
  *   **Requirement:** The account should apply equally well to left and right-wing movements.
  *   **Case:** Cancel culture vs. conspiracy theories.
  *   **Status:** **Preference.** This is a political taste, not an epistemic necessity. Truth is not always symmetrically distributed. However, for a *structural* theory of polarization, asymmetry in application reduces utility.
  *   **User Input:** Addresses your question on even-handedness. It is a desideratum for usability, not truth.

  ### Incompatible Pairs

  1.  **Asymmetry Permission vs. Political Symmetry:** You cannot demand a theory that always finds both sides equally at fault (Symmetry) and also allows for one side to be right (Asymmetry). You must choose: do you want a theory that describes the *structure* of disagreement (Symmetry) or the *content* of truth (Asymmetry)? For your purposes, prioritize Asymmetry.
  2.  **Dissent/Crank Differentiator vs. Real-Time Diagnosis:** You want to know who is a crank and who is a genius *now*. But often, the only true differentiator is being right *later*. A theory can only offer probabilistic markers (methodology), not certainty. Demanding certainty here breaks the theory.

  ### The Even-Handedness Verdict

  Requiring a theory to be even-handed between left and right is a **political taste**, not a real desideratum. It smuggles in a assumption that truth is always found in the middle. A diagnostic tool must be able to say "Side A is wrong" without needing to find a compensating error for Side B. However, if the tool *only* ever identifies errors on one side, it is likely ideological, not diagnostic. Use symmetry as a stress test for the tool, not a requirement for the outcome.

  ### The Lever

  **Requirement #1 (The Isolation/Immunization Distinction)** does the most work against standard stories.
  *   **"It's their media diet"** fails because it assumes Isolation, ignoring Immunization.
  *   **"Motivated reasoning"** fails because it assumes everyone is equally biased, ignoring Asymmetry.
  *   **"Tribal signaling"** fails because it ignores Legitimate Deference.
  But #1 is the killer: most punditry assumes that if you just *show* people the facts, they will change their minds. This requirement forces you to acknowledge that seeing the facts isn't the problem; trusting the messenger is.

  ### Standard Stories Scorecard

  They fail because they conflate isolation with immunity, assume symmetry where none exists, and treat all trust as dependency. They diagnose the symptom (disagreement) but miss the mechanism (epistemic distrust).
