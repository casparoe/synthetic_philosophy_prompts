answer: |-
  **Project Title:** Inward Tightening in Fluid Concept Microdomains
  **Duration:** 3 Months (Part-Time)
  **Personnel:** PI Only (No RAs)

  **1. The Gap**
  Everybody in the Copycat/Fluid Concepts tradition talks about slippage. The core idea is that when you hit a weird edge case in a microdomain (like the alphabet or number strings), concepts get fluid. Rules stretch. Categories blur. If the standard rule breaks, the mind finds a nearby analogy and slips the definition outward to make it fit. The literature is full of models for this expansion and ambiguity—how concepts soften under pressure.

  But nobody really models the opposite. What happens when hitting a borderline case makes people apply the concept *stricter* in the next round? I'm calling this **inward tightening**. Instead of stretching the rule to accommodate the weirdness, the subject clamps down on the original definition to protect it. It's like a defensive reaction. If the existing work models concepts as elastic bands that stretch, I want to see if they sometimes act like springs that snap back tighter when pushed too hard.

  Right now, this is left open. The current frameworks assume pressure leads to flexibility. They don't account for systematic contraction. That's the hole I'm filling.

  **2. Research Question**
  Does inward tightening happen systematically in microdomain analogical reasoning? And does it depend on the structural topology of the domain?

  Specifically, I'm looking at the difference between **linear** domains (number lines, integer sequences) vs. **circular/looping** domains (the alphabet where Z connects back to A, days of the week). My hunch is that tightening is more likely in linear domains where "breaking" the rule feels like falling off a cliff, whereas circular domains invite slippage because the loop suggests continuity.

  **3. Methodology (Feasible Scope)**
  Timeline is 3 months part-time, no research assistants. I need to be realistic about what I can run.

  *   **Stimuli:** I'll design 8–10 analogical puzzles. These won't be standard Copycat problems but variations designed to trigger boundary anxiety.
      *   *Example:* Standard is `abc -> abd`, so `xyz -> ?` (usually `xyd`).
      *   *Tightening Trigger:* I'll introduce a preamble or a "near miss" example that suggests the rule was almost violated, then measure if the subject's subsequent answer is more conservative/strict than the baseline population.
  *   **Participants:** Target N=25–30. I'll recruit via convenience sampling (colleagues, online forums). If I can't get humans in the first 4 weeks, I pivot.
  *   **Pivot Plan:** If recruitment fails or IRB drags, I will switch to a **structural analysis of the puzzle space**. I'll map the logical constraints of the puzzles themselves to see if "tightening" is a valid solution path inherent to the problem structure, even without human data. This ensures I deliver *something* even if the empirical side falls apart.
  *   **Analysis:** Look for statistical deviation from the standard "slippage" answers. Are subjects choosing the "by the book" answer more often after being exposed to a borderline case?

  **4. Expected Outcomes**
  Success looks like a **taxonomy of conditions**. I want to be able to say: "In linear domains with high boundary salience, inward tightening occurs in X% of trials, whereas circular domains favor slippage."

  I'm not trying to build a full cognitive architecture model here. Just establishing the phenomenon exists and mapping the structural features that trigger it. The deliverable is a short paper or workshop report detailing this taxonomy.

  **5. Failure Conditions**
  I need to be honest about what counts as failure.
  1.  **Noise:** If the variance in answers is just random noise and there's no statistical signal for tightening vs. stretching.
  2.  **Wording Artifacts:** If it turns out the "tightening" effect is just because I worded the instructions too rigidly. I'll need to control for this by varying instruction phrasing, but if the effect disappears when I relax the wording, then the phenomenon isn't cognitive, it's experimental artifact.
  3.  **Null Result:** It's possible people just always slip. If I find zero evidence of tightening, that's still a result, but it means the hypothesis is wrong.

  **6. Scope Creep & Risks**
  The biggest risk is trying to generalize too far.
  *   **Out of Scope:** Real-world concepts. I am *not* touching moral concepts, political categories, or semantic natural kinds (like "bird" or "chair"). That blows the scope up immediately and requires a totally different methodology. I'm staying in the sandbox: letters, numbers, shapes.
  *   **Out of Scope:** Computational Modeling. I'm not building a new Copycat program. I'm analyzing human responses (or the puzzle logic). Building a model is a PhD thesis, not a 3-month workshop grant.

  **7. Timeline**
  *   **Month 1:** Design the 8–10 puzzles. Pilot them on myself and 2-3 friends to check for obvious wording bugs. Submit IRB if needed (or use exempt status).
  *   **Month 2:** Run the subjects. If recruitment is slow, start the structural analysis pivot. Clean data.
  *   **Month 3:** Analysis and write-up. Focus on the taxonomy. Submit to workshop.

  **8. Why This Matters**
  If concepts only stretch, our models of analogy are incomplete. Understanding when and why the mind rigidifies is just as important as understanding when it flexes. It adds a necessary counter-weight to the fluidity narrative. Given the constraints, this is a tight, doable slice of a bigger problem.
