  # JOINT STATEMENT ON THE STATUS AND DEFINITION OF THE ANTHROPOCENE
  **Prepared by:** Stratigraphic Formalism Camp & Polycentric Pluralism Camp
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Epoch Formalization

  ## 1. Agreed Claims
  Despite our divergence on formalization protocols, we agree on the following foundational premises regarding the physical and procedural state of the debate:

  1.  **Earth-System Perturbation:** Human activity has produced measurable deviations in Earth-system processes (including atmospheric composition, biosphere integrity, and geochemical cycles) that exceed Holocene background variability.
  2.  **Explanatory Target:** The primary task of any Anthropocene framework is to explain the relationship between human socio-economic organization and the rate of geological change, regardless of whether that framework is lithological or historical.
  3.  **Data Limits:** Current stratigraphic data is incomplete regarding global synchronicity; distinct markers appear at different times in different sedimentary archives (e.g., pollen vs. radionuclides), making a single synchronous horizon difficult to isolate without interpretive filtering.
  4.  **Procedural Representation:** Indigenous knowledge systems and land-management histories are currently underrepresented in the formal deliberation processes of the International Commission on Stratigraphy (ICS) and its working groups.

  ## 2. Disagreements Table
  The following table outlines our divergent positions on the necessity of standardization and the authority of decision-making. Wording has been vetted by both camps to ensure accurate representation of their respective stances.

  | Issue | Stratigraphic Formalist Position | Polycentric Pluralist Position |
  | :--- | :--- | :--- |
  | **Necessity of a Single Global Signal** | A single, synchronous Global Stratigraphic Section and Point (GSSP) is necessary to maintain the utility of the geological time scale for global correlation and scientific communication. | A single global signal is unnecessary and politically harmful; onset dates should be context-dependent to reflect heterogeneous histories of human impact and colonialism. |
  | **Decision Authority** | Authority rests exclusively with the International Commission on Stratigraphy (ICS) based on lithostratigraphic evidence to ensure scientific rigor and insulation from political fluctuation. | Authority must be distributed; Indigenous land-management scholars and affected communities should hold a formal veto over any formalization that erases local histories. |

  ## 3. The Cruxes
  We have identified two fundamental sticking points that prevent consensus. These are not merely semantic but represent divergent methodologies for validating truth claims in Earth science.

  **Crux A:** Is stratigraphic uniformity (a synchronous global marker) a prerequisite for epoch status, or can an epoch be defined by functional heterogeneity?
  **Crux B:** Should non-geologists (specifically Indigenous scholars) have binding input on geological nomenclature, or must geology remain insulated from socio-political veto power?

  ## 4. Concrete Cases and Predictions
  For each crux, we have selected a concrete case study relevant to both sides. Below are the specific predictions each camp makes regarding the outcome or interpretation of this evidence.

  ### Regarding Crux A ( Stratigraphic Uniformity)
  **Case Evidence:** The distribution of **fly ash particles** versus **local pollen records** in sediment cores.
  *   *Formalist View:* Fly ash provides a synchronous global marker (mid-20th century) suitable for a GSSP.
  *   *Pluralist View:* Pollen records show distinct agricultural onsets (e.g., 1610, 1800, or earlier) that better reflect human impact than industrial ash.

  | Camp | Prediction |
  | :--- | :--- |
  | **Formalist** | If we prioritize local pollen records over global fly ash, cross-continental correlation will fail, rendering the term "Anthropocene" useless for rigorous geological mapping. |
  | **Pluralist** | If we prioritize global fly ash over local pollen, we will obscure earlier, significant human impacts (e.g., megafaunal extinction, early agriculture), resulting in a scientifically inaccurate narrative of human-Earth interaction. |

  ### Regarding Crux B (Decision Authority)
  **Case Evidence:** The **Anthropocene Working Group (AWG) voting process** versus **Indigenous land claims** in the Americas and Australia.
  *   *Formalist View:* The AWG vote determines the scientific validity of the epoch based on rock evidence.
  *   *Pluralist View:* Indigenous sovereignty claims dictate whether labeling land as "Anthropocene" violates cultural heritage or erases prior stewardship.

  | Camp | Prediction |
  | :--- | :--- |
  | **Formalist** | If Indigenous scholars are granted veto power over stratigraphic decisions, the geological time scale will become fragmented and subject to non-scientific political criteria, reducing its reliability. |
  | **Pluralist** | If Indigenous scholars are denied veto power, the formalization will perpetuate colonial narratives that treat land as mere resource, reducing the social legitimacy and ethical utility of the concept. |

  ## 5. Verification of Verbal Disagreement
  We have flagged one area of disagreement that is **mostly verbal**, though it sustains substantive conflict.

  **The Disagreement:** The definition of the term **"Epoch."**
  **Why it is Verbal:**
  *   The **Formalists** are using "Epoch" strictly in the *chronostratigraphic* sense (a unit of rock/time defined by physical markers within the International Chronostratigraphic Chart).
  *   The **Pluralists** are using "Epoch" in a *historical/political* sense (a distinct period of human history defined by socio-ecological relationships).

  **Explanation:** Both sides agree that human impact is real and significant. The conflict arises because Formalists require the term to function as a tool for correlating rock layers globally, while Pluralists require the term to function as a tool for diagnosing socio-political responsibility. When Formalists say "The evidence isn't there," they mean "The rock signal isn't synchronous." When Pluralists say "The evidence is there," they mean "The historical impact is undeniable." They are often talking past one another because they are attempting to assign the same label to two different categories of knowledge (lithology vs. history). Resolving this definition would not solve the authority dispute, but it would clarify that the Pluralists are arguably arguing for a parallel "Historical Anthropocene" rather than a formal Geological Epoch.
