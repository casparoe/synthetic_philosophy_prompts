prompt: |-
  right, i need a hand drafting the middle chunk of my essay — the bit where I'm actually meant to take a side, which is where I've been going round in circles for about a week.

  The question I'm answering: is the gap between indicative and subjunctive conditionals a semantic one (two different conditional constructions, or one operator running on genuinely different selection functions), or is it basically contextual/pragmatic — one and the same conditional whose background or premise set gets fixed differently by the conversation? I have to commit. So: write me an essay (1200 words or so) that lays out the strongest version of both stories and then defends a verdict, not a "both sides have a point" shrug.

  Here's the data I want it to deal with, and I'd rather you engaged with my cases than rehashed the standard textbook pairs:

  [1] The known-disjunction case. We know for certain the safe was opened by somebody inside the building at 3am, and it was either Dev or Mo; we've no idea which. 'If Dev didn't open the safe, Mo did' seems fine. 'If Dev hadn't opened the safe, Mo would have' seems bad.

  [2] The common-cause case (my favourite, and the one I think actually cuts). A hidden variable set at 11:00 fixes both what a coin does at noon and what gets printed into a sealed envelope at 11:05. The printout doesn't read the coin and the coin doesn't read the printout — they're just perfectly correlated. You know all this, and you've observed neither. 'If the coin landed tails, the envelope says tails' — fine. 'If the coin had landed tails, the envelope would have said tails' — I want to say false: the nearest tails-world is surely one where a small miracle nudges the coin and the envelope still says heads, since getting the envelope to change means changing the hidden variable. Under an interventionist reading it's false too.

  [3] The known-false antecedent. Later we find out for certain that Dev did it. What happens to [1]'s indicative? Is it still assertable, still true, neither? And note the asymmetry: the subjunctive is completely at home with an antecedent you know to be false, whereas the indicative gets weird there — which is awkward for the line that says indicatives are the evidential/epistemic ones.

  [4] The open-future pair. 'If Dev arrives late the alarm will go off' vs 'if Dev arrived late the alarm would go off'. Nothing settled, nothing known false, no past to hold fixed. So whatever the mood is doing, it isn't marking counterfactuality. Maybe it's marking remoteness, or how much the speaker is prepared to stake on it.

  Two more things I want properly handled rather than gestured at:

  (a) I keep assuming that supposing an antecedent means retaining the rest of what you know and suspending only what it contradicts. Say whether that's right, and whether the *retention* question is the same question for both moods — or whether the indicative retains your evidence (correlations included, per [2]) while the subjunctive retains the causal/nomological structure, which would mean the difference isn't in which facts you keep but in what kind of ordering you're running.

  (b) Whatever you conclude, state what it predicts about conditional excluded middle — whether one of 'if A, C' and 'if A, not-C' has to hold — separately for each mood, and whether it gives the same answer for both. If it doesn't, tell me whether that's a cost or a good prediction.

  And if one of my four cases is doing less work than I think it is — definately possible with [4] — say which one and why, rather than politely pretending they're all load-bearing.
