answer: |-
  The debate over conditional mood is often framed as a choice between economy and precision: do we posit a single conditional operator whose context sensitivity explains the data, or do we commit to two distinct semantic operators? The pragmatic, unified view—championed by Stalnakerians—argues that mood merely signals how we fix the modal base. On this story, indicatives quantify over epistemically accessible worlds (what is compatible with our knowledge), while subjunctives quantify over metaphysically accessible worlds (what is nomologically possible), but the underlying *if*-operator remains invariant. The semantic dualist, conversely, argues that mood triggers fundamentally different selection functions.

  After weighing the evidence, I commit to **Semantic Dualism**. The pragmatic story is elegant, but it fractures when faced with correlations that are evidential but not causal. A single operator cannot seamlessly switch between tracking information and tracking causal structure without effectively becoming two operators in disguise. The gap between indicative and subjunctive is not merely contextual; it is architectural.

  To see why the unified view fails, consider the **Common-Cause Case [2]**. We have a hidden variable fixing both a coin toss and a sealed envelope. They are perfectly correlated, but causally independent. The indicative ('If the coin landed tails, the envelope says tails') is true because, given our evidence, the correlation holds. The subjunctive ('If the coin had landed tails, the envelope would have said tails') is false because, causally, nudging the coin does not nudge the envelope.

  The pragmatic theorist must explain this divergence by claiming the conversation context shifts the "background facts" we hold fixed. For the indicative, we hold fixed the correlation; for the subjunctive, we hold fixed the causal laws. But this is an ad hoc stipulation. Why does the subjunctive mood *force* us to discard the correlation while the indicative retains it? If there were only one operator, the context should allow us to treat the correlation as a fixed background fact for the subjunctive too (e.g., "Given the setup, if the coin had been tails..."). The fact that we cannot do this without sounding infelicitous suggests the subjunctive semantically mandates an interventionist reading. It does not merely *allow* us to look at causal structure; it *requires* us to break non-causal correlations. This confirms point (a): the retention question is not the same for both moods. The indicative retains your **evidence** (including brute correlations); the subjunctive retains the **causal/nomological structure** (discarding correlations that lack a causal link). The difference is not in which facts you keep, but in the ordering source used to rank worlds: epistemic plausibility versus causal similarity.

  This dualism is reinforced by the **Known-False Antecedent [3]**. When we discover Dev definitely opened the safe, the indicative from Case [1] ('If Dev didn't open the safe, Mo did') becomes unassertable, even though the material conditional remains true. The subjunctive ('If Dev hadn't opened the safe, Mo would have'), however, remains robust. The pragmatic view struggles here: if the indicative is just about epistemic accessibility, and we now know $\neg D$ is impossible, the conditional should simply be vacuous or undefined. But the asymmetry is deeper. The subjunctive is *at home* with known falsehoods; the indicative is *hostile* to them. This suggests a semantic presupposition: the indicative requires the antecedent to be epistemically open; the subjunctive requires it to be metaphysically possible (often presupposing it is actually false). In Case [1], the subjunctive felt "bad" not because of the logic, but because the mood presupposed a resolution of the Dev/Mo question that the context hadn't yet provided. The indicative, lacking this counterfactual presupposition, could operate comfortably on the disjunction alone.

  I must note, however, that not all data is equally weighty. **The Open-Future Pair [4]** is doing the least work in this argument. In open-future cases, epistemic and metaphysical possibilities often overlap; what we know is possible aligns with what is nomologically possible. Consequently, 'If Dev arrives late...' (indicative) and 'If Dev arrived late...' (subjunctive) often converge in truth value. Relying on [4] to distinguish the moods is a mistake; it obscures the divergence rather than revealing it. It is the "hard" cases—where evidence diverges from causality ([2]) or knowledge diverges from fact ([3])—that drive the verdict. We should treat [4] as a zone of overlap, not a testing ground.

  Finally, we must consider the implications for **Conditional Excluded Middle (CEM)**: the principle that for any $A$, either 'If $A, C$' or 'If $A, \neg C$' must be true. My semantic dualist verdict predicts a divergence here, which I argue is a feature, not a cost.

  For the **indicative**, CEM should fail. Since the indicative tracks evidence, and evidence can be incomplete or probabilistic, it is possible that neither $A \to C$ nor $A \to \neg C$ is supported by the information state. In the Coin/Envelope case, if we didn't know the correlation was perfect, we might assert neither 'If tails, envelope says tails' nor 'If tails, envelope says heads'. The indicative is sensitive to the granularity of our knowledge.

  For the **subjunctive**, CEM is more robust but still contingent. Because the subjunctive tracks causal structure, if the causal setup is deterministic, CEM holds: the nearest $A$-world determines a unique outcome. However, if the world is indeterministic (as in a genuine quantum coin toss), the subjunctive may also violate CEM, as there is no fact of the matter about which way the coin *would* have gone. Crucially, the *reason* for the failure differs. The indicative fails due to **ignorance**; the subjunctive fails due to **indeterminacy**. A unified pragmatic theory struggles to explain why the same operator would be sensitive to ignorance in one context and metaphysical indeterminacy in another without positing a semantic split. By accepting two operators, we predict that CEM status can vary by mood even in the same context. This is a strong prediction: it allows us to diagnose whether a conditional failure is epistemic (fixable by learning more) or metaphysical (fixable only by changing the laws).

  In conclusion, the gap between indicative and subjunctive is semantic. The pragmatic attempt to unify them under a single operator requires too much contextual heavy-lifting, effectively smuggling in a second selection function to handle cases like [2] and [3]. The indicative is an operator of epistemic coherence, retaining correlations and requiring open antecedents. The subjunctive is an operator of causal dependency, discarding non-causal correlations and thriving on counterfactuality. Accepting this dualism clarifies the retention conditions, explains the asymmetry in known-false antecedents, and predicts a principled divergence in how each mood handles Conditional Excluded Middle. We should not fear the proliferation of operators if the data demands it; in this case, the logic of our language reflects the distinct logic of evidence and causation.
