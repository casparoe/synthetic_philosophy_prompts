answer: |-
  The heat in the city of Oakhaven was not merely a temperature; it was a pressure, a physical weight that pressed the dust into the pores of the stone buildings. Elian felt it most acutely in the alley behind the spice market, where the air smelled of cumin and dying things.

  The man was slumped against the wall, his robes the color of dried blood. He was not old, but he was finished. There was a wetness on his chest that had nothing to do with the heat. Elian had stopped only out of a reflex of decency, a mistake he recognized the moment he knelt beside the stranger.

  "Do not call for help," the stranger whispered. His voice was dry, like paper rubbing against paper. "It is done. But there is a debt."

  Elian reached for his waterskin, but the stranger caught his wrist. The grip was surprisingly strong, iron-tight.

  "Listen," the stranger said. "You will not leave this city. You will die in Oakhaven on Friday, at the setting of the sun."

  Elian froze. The specificity was absurd. It was Tuesday. There were three days. There were a dozen caravans leaving for the coast every morning.

  "Who are you?" Elian asked.

  "A messenger," the man said. His eyes were milky, blind, yet they seemed to fix on Elian's throat. "The truth is a heavy thing, Elian. It breaks the back of the man who carries it. Now it breaks yours."

  The man's hand went slack. The breath left him in a long, rattling sigh.

  Elian stood up. He wiped his hand on his tunic. He told himself he was shaking because of the heat, because of the shock of finding a corpse in a market alley. He told himself many things. But as he walked home through the winding streets, the words settled in his mind like sediment in a glass of water. *You will die in Oakhaven on Friday.*

  If it were a threat, it was a clumsy one. If it were a madness, it was a precise one.

  Elian was a man of accounts. He dealt in ledgers, in balances, in the certainty that if a column did not sum, an error had been made. He entered his study and lit a lamp. He took out a fresh sheet of parchment. He wrote the proposition at the top of the page: *I will die in Oakhaven on Friday.*

  He stared at it. He considered its truth value.

  If the proposition is *True*, then no matter what I do, I will be here on Friday at sunset.
  If the proposition is *False*, then I can leave, and I will live.

  But the stranger had spoken with the authority of a grave. And there was the matter of the name. Elian had not told the man his name.

  Elian began to pack. This was the rational response to a threat of death. To know one is to die in a place is to know one must not be in that place. Knowledge implies action. He folded his linens. He counted his coins. He went to the window and looked at the North Gate. The road out was clear.

  He reached for his travel cloak. His hand hovered over the wool.

  *Wait,* a voice in his head said. *If you know you will die here, and you leave, then the statement was false.*

  Elian paused. He was a rational agent. If he possessed the knowledge *K* (I will die in Oakhaven), he would perform action *A* (Leave Oakhaven). If he performs *A*, then *K* is false. Therefore, *K* cannot be known by a rational agent who acts on knowledge.

  He sat back down. The lamp flickered.

  This was not fear. Fear was simple; fear was the pulse hammering in his neck. This was a structural failure. He was trying to hold a thought that consumed its own foundation. To believe the prophecy was to invalidate it. To invalidate it was to stay. To stay was to make it true.

  He tried to force the belief. *I will die here.* He gripped the edge of the desk. He felt the impulse to stand, to run, to flee the room. The belief triggered the flight.

  He tried to force the doubt. *The man was a liar.* He relaxed his grip. He felt the stillness return. The doubt allowed him to sit.

  But he could not rest in the doubt, because he remembered the blind eyes. He could not rest in the belief, because the belief demanded he move.

  Wednesday passed in a blur of oscillation. He walked to the North Gate with a packed satchel. He stood in the shadow of the archway, the cool air of the open road on his face. He knew, with the certainty of logic, that if he stepped through, the prophecy was broken. If the prophecy was broken, the stranger was a liar. If the stranger was a liar, he was safe.

  But if the stranger was a messenger of infallible truth, then Elian *could not* step through. Not because a wall barred him, but because the knowledge required to step through was inaccessible. If the truth was absolute, his rational response to it would negate it. Therefore, the truth could only exist if he failed to act on it.

  He stood at the threshold for an hour. Passersby glanced at him, this man frozen in the gate, sweating in the cool draft.

  He could not know it. That was the horror. He could suspect it. He could fear it. But he could not *know* it. To know it was to change the future. To keep the future fixed, he had to remain ignorant. He was being asked to survive by means of self-deception. He had to convince himself the truth was a lie, so that he would stay, so that the truth would become real.

  He turned back from the gate. He did not choose to stay; he was pushed back by the logic. He returned to his house. He unpacked the satchel.

  Thursday was a fever dream. He tried to write a letter to his sister in the coast, explaining why he was not coming. *I cannot leave,* he wrote. *Because if I leave, the words are false. But if they are false, I should leave.* He crumpled the paper. The ink looked like blood.

  He walked the streets of Oakhaven. Every stone seemed to whisper the proposition. *Here. Here. Here.* He tried to walk toward the South Gate, just to test his will. His legs felt heavy, as if the air had turned to water. It wasn't magic. It was the paralysis of a mind trying to solve an equation with no solution.

  If I believe, I run. If I run, it's false.
  If it's false, I don't run. If I don't run, it's true.
  If it's true, I believe.

  The loop closed around his throat.

  He spent Thursday night in his study, the lamp burning low. He understood now what the stranger had meant by *a debt*. The debt was the cognitive dissonance. The universe demanded that he die in Oakhaven. To ensure this, the universe forbade him from knowing it with certainty. He was trapped in a state of permanent doubt. He was a man standing in a burning room who cannot believe the fire is real, because if he believes it, he will escape, and the fire was never there.

  But the fire *was* there.

  Friday arrived. The heat was worse. The city seemed to hold its breath. Elian did not pack. He did not go to the gate. He sat in his chair. He was exhausted, not from labor, but from the effort of resisting a truth he could not hold.

  He watched the sun climb. Noon. One o'clock. Two.

  He realized he was waiting for a sign that would allow him to leave without contradicting the prophecy. A loophole. But there was no loophole. The prophecy was not a command; it was a description of a state of affairs that included his own inability to know it.

  At four o'clock, there was a knock at the door.

  Elian did not move. He knew, without knowing how he knew, that the door was the boundary. If he opened it, he engaged with the world. If he engaged with the world, he acted. If he acted, he tested the truth.

  The knock came again. Harder.

  Elian stood. His legs were steady now. The oscillation had stopped. The sun was low, casting long, bruised shadows across the floor. He walked to the door. He did not open it out of courage, or resignation, or hubris. He opened it because the tension of the paradox had to resolve. The system had to close.

  He turned the latch.

  The man standing there was not the beggar from the alley. He was tall, dressed in grey travel clothes, dust on his boots. He held a dagger, but he did not raise it immediately. He looked at Elian with a mild, professional curiosity.

  "Elian?" the stranger asked.

  Elian nodded. He felt a strange calm. The epistemic crisis was over. He no longer had to decide whether to believe. The event was occurring. The proposition was no longer a prediction; it was a present tense fact. *I am dying in Oakhaven.*

  "Why?" Elian asked. He needed to know if it was random. If it was random, the prophecy was a coincidence. If it was random, he had died for nothing.

  The stranger stepped inside and closed the door. The room grew darker. "A contract. A name was given. A price was paid."

  "Who paid it?"

  "The future," the stranger said.

  He raised the dagger.

  Elian did not fight. He looked at the man, and he understood the final cruelty of the oracle's gift. The stranger in the alley had not predicted the future; he had engineered it. By telling Elian the truth, he had ensured Elian could never use it. He had handed Elian a map that burned his hands if he tried to read it.

  Elian fell to his knees. The pain was sharp, then distant. He slumped against the leg of his desk. The lamp was still burning. The parchment with the proposition lay on the wood. *I will die in Oakhaven on Friday.*

  The sun touched the horizon. The light turned red, then grey.

  The stranger wiped the blade on Elian's tunic. He checked the pulse, found nothing, and stood up. He looked down at the body, then at the paper. He smiled, a thin, humorless expression.

  "You see," the stranger said to the empty room. "He never really believed it. If he had, he wouldn't be here."

  He stepped over the body and opened the door. The cool air of the evening rushed in, smelling of dust and cumin. The stranger walked out into the street, leaving the truth behind him, perfectly preserved, perfectly useless, and finally, undeniably true.
