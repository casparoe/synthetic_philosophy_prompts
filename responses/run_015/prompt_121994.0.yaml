          *   *Decision:* Jordan is right. The AI is the artifact, not the Gregorian mind. The *human trainer* is the Gregorian creature using the AI tool.

      *   **Move 3: 'Hollow Gregorian' (The Taxonomy Gap)**
          *   *Sam's Claim:* 'Hollow Gregorian' proves a gap between behavior and architecture.
          *   *Jordan's Claim:* It's just a bad example, like a parrot isn't a 'hollow human'.
          *   *Analysis:* Dennett's taxonomy is about *competences*, not just performance. A Chinese Room argument style objection. If it behaves like a Gregorian mind but lacks the internal architecture to *use* the tools for its own reasoning, is it a new category? Dennett would likely say no. Taxonomies classify *capacities*. If it lacks the capacity, it's not that kind, regardless of output. Sam is confusing *simulating* a type with *being* a type.
