answer: |-
  The mist clinging to Holloway Reach did not respect the ledger. It rolled over the sea walls and dampened the wool of the fishermen's jumpers regardless of what the wrist-comp buzzed. When the system launched, five years prior, Elara had believed it was a return to sense. Money had been abolished, that abstract ghost that haunted the old world, replaced by the Pulse. You earned credits through verified social interaction—listening, teaching, caring—and spent them on the community's output: fish, grain, medicine. It felt like *householding*, as her grandfather might have called it. Exchange was tethered to need, and value was rooted in the tangible warmth of another human being.

  For the first year, it worked. Neighbours spoke to earn their bread. The elderly were wealthy in credits because they had time to listen. Elara mended nets and traded her labour for credits via the social verification of those she helped. It seemed a closed loop, natural and finite. You earned enough to live, and you lived.

  But the tide of human ambition is harder to dam than the sea.

  Elara noticed the shift during the long winter solstice. She sat in the communal hall, the air thick with the smell of woodsmoke and stew. Across the room sat Julian. He did not fish, nor mend, nor teach. Yet his wrist-comp glowed with a soft, persistent gold light that the others lacked. He moved through the room not as a participant, but as a harvester. He would pause beside a group, offer a practiced nod of empathy, linger just long enough for the sensors to register a 'meaningful interaction', and move on. He was farming attention.

  Later, at the depot, Elara watched him trade. He wasn't buying fish for his table; he was buying futures. He exchanged his surplus credits for the rights to next season's catch, then traded those rights for heating allotments he did not need.

  'Why?' Elara asked him, finding him by the racks of drying kelp. 'You have enough heat for ten winters. You have enough food to rot.'

  Julian didn't look up from his cuff, where numbers scrolled rapidly. 'Enough is a static concept, Elara. The Pulse is dynamic. If I stop accumulating, I lose status. If I lose status, my credits devalue. I have to grow.'

  'But the fish are finite,' she said, gesturing to the bay. 'The heat is finite. What are you growing?'

  'The ledger,' he replied, as if it were obvious.

  The realization struck her not as a thunderclap, but as a slow chilling, like the tide going out and never returning. She had thought the credits were a measure of life, a way to facilitate the household's needs. But Julian treated the credits not as a means to an end, but as the end itself. The system had inverted. In the old world, money bred money because it was detached from use. Here, even social interaction—supposedly the most human of acts—had been detached from connection and made to breed numbers.

  A week later, a storm battered the Reach. The heating grid faltered. Elara went to the depot to request extra fuel for her mother, whose cough had turned wet and heavy. The quartermaster, a young man whose eyes were fixed on his own scrolling ledger, shook his head.

  'The rate has fluctuated,' he said apologetically. 'Julian bought the surplus margin this morning. To release fuel to you, I'd have to breach his holding threshold. It would look bad on my efficiency metrics.'

  'His holding threshold?' Elara's voice rose over the wind. 'My mother is cold. He is warm.'

  'That's the market,' the young man said, though there was no market, only the algorithm. 'If I give you the fuel, my credits drop. If I maintain his holdings, the system stability index rises. It's about long-term growth.'

  Elara walked back through the rain, the water soaking through her boots. She passed Julian's dwelling. It was brightly lit, the windows steaming with wasted heat. Inside, she knew, the numbers on his wall were climbing, invisible digits stacking into the infinite void. He was accumulating claims on life without living it.

  Aristotle would have recognised the sickness, though he had no name for wrist-comps. He knew there was a difference between acquiring tools for the house and acquiring tools for the sake of having them. One has a limit; you only need so many looms to weave the cloth you wear. The other has no limit; there is always another digit to add to the sum.

  Back in her cottage, Elara warmed her mother's hands over a small, illicit driftwood fire. The Pulse on her wrist buzzed, offering her credits for a conversation she was too tired to have. She looked at the number, then at her mother's breathing chest. The number could go up forever. The breath could not. She turned her wrist over, face down, silencing the glow. In the darkness, the only value left was the heat they shared, finite and fragile, enough for tonight, and nothing more.
