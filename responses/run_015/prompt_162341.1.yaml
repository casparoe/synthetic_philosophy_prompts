      **Soft:** Concedes the tool isn't neutral. Requires external political theory. You become accountable for the justice theory used.

  4.  **Phil (Adaptive):** "Adaptive preference isn't just constraint; it's psychic deformation. Removing constraints doesn't fix the deformation. Your counterfactual dynamics won't capture internalized oppression or changed tastes."
      **Reply:** True, it captures structural autonomy, not psychological healing. But it's better than treating oppressed choices as genuine preferences. It's a floor, not a ceiling for welfare. It identifies preferences suppressed by external barriers. Internalized oppression is harder, but structural constraints are measurable. We start with the removable barriers. It's a partial solution, not a total cure.
      **Soft:** Admits inability to detect deep psychological adaptation. Critics can claim the biggest adaptations are internal, not external.

  5.  **Exp Sampling:** "You're ignoring the only direct access to welfare: experience. Behavior is noisy; pain is real. Why trust inferred reward over self-reported suffering or momentary happiness?"
      **Reply:** Self-report is biased by adaptation too. IRL triangulates structure. Use both. But behavior reveals capacity where reports reveal mood. We need structural metrics for policy. People adapt their reports to misery. Behavior shows what they strive for despite pain. IRL captures the striving. Combine with experience sampling for a full picture, don't rely on reports alone.
      **Soft:** Risks dismissing lived experience. Hard to defend ignoring pain reports. Can look coldly technocratic.

  6.  **RL (Tech):** "Soft optimality is a modeling assumption, not a law. If agents aren't MaxEnt, your inference is biased. Real humans aren't Boltzmann agents. How robust is this?"
      **Reply:** Agreed. It's a robustness check. But it handles noise better than hard optimality. We test sensitivity to the temperature parameter. It's the standard baseline. If the temperature is wrong, the reward scale shifts, but the ranking often holds. We can calibrate using hold-out trajectories. It's imperfect but better than deterministic assumptions.
      **Soft:** Acknowledges model misspecification risk. If human noise isn't entropy-based, inference breaks.

  7.  **RL (Tech):** "State space definition is arbitrary. Change the states, change the reward. Garbage in, garbage out. How do you define the MDP states without bias?"
      **Reply:** State abstraction is a feature, not a bug. We define states relevant to the welfare question. It forces explicit modeling of context rather than hiding it. RP hides context in the error term. IRL makes you specify what matters. If you omit a state, the reward absorbs it. We must justify the state space politically.
      **Soft:** Subjectivity in state definition reintroduces bias. Different modelers get different rewards.

  8.  **Heterodox Econ:** "Preferences aren't stable entities to be recovered. They are constructed in the choice context. You're reifying a fiction and treating it as a latent variable."
      **Reply:** I recover context-sensitive reward functions. The MDP includes context. It's not a stable soul, but a stable policy mapping across similar contexts. We don't assume a fixed soul, just a consistent response to incentives within a defined structure. If context changes radically, the model updates. It's dynamic, not static essentialism.
      **Soft:** Still assumes some stability across counterfactuals. If preferences are truly fluid, prediction fails.

  9.  **Pol Theory:** "Democratic legitimacy. Why trust an algorithm's extrapolation over a citizen's vote or voice? This is technocratic paternalism disguised as measurement."
      **Reply:** It informs democracy by revealing constrained preferences. It doesn't replace voting; it clarifies what voters would choose under justice. It aids deliberation. If people vote against their interests due to coercion, democracy fails. IRL shows the coercion. It supports democracy by cleaning the input, not replacing the voter.
      **Soft:** Still overrides actual expressed choice in favor of modeled choice. Can be used to ignore actual votes.

  **Concede up front**
  I must concede up front that IRL does not magic away non-identifiability; it requires inductive bias. I also concede that reward is not identical to welfare without a bridge principle. State clearly: I offer a *better proxy* for structural autonomy, not a metaphysical truth about the good. This disarms the "you claim too much" attack from economists and philosophers. By admitting the tool requires political input (defining constraints), I prevent them from accusing me of hidden normativity. Frame it as "making assumptions explicit" rather than "solving the problem." This lowers the stakes from "truth" to "useful measurement."

  **The load-bearing reply**
  The bridge principle: Welfare is capacity for effective agency under just conditions. Reward laundering isolates this capacity by subtracting unjust constraints. If this fails, I'm just doing expensive behaviorism. The reply must be: "We aren't measuring satisfaction; we're measuring autonomy." Cost: I must defend a specific theory of justice to define constraints, moving me from neutral technician to political theorist. I lose the claim of technical neutrality. But I gain the ability to answer the paternalism charge: I'm not overriding preferences, I'm modeling them under fairer conditions.

  **The question I'm hoping nobody asks**
  "Is inferred reward constitutive of welfare or mere evidence?" If evidence, you need validation against self-report (making IRL expensive proxy). If constitutive, you endorse paternalism (better off even if they repudiate the reward). Your hedge (capacity) works better: it's neither. It's a structural metric. Worse question: "Whose justice defines the counterfactual constraints?" If you say "liberal democracy," you alienate heterodox econ. If you say "expert," you're paternalistic. The constitutive question is solvable; the political authority question is not. Stick to capacity. Don't claim welfare directly. Claim "preference under justice." It avoids the metaphysical trap.

  **What to cut from the deck**
  Cut the detailed proof of potential-based shaping invariance (Step 1). It bores philosophers and Econ knows it. Just state RP suffers non-identifiability under counterfactuals. Spend time on Reward Laundering mechanics. The math is less important than the political implication. The Econ crowd won't be convinced by the math, and the Phil crowd won't understand it. Use the time to clarify the "unjust constraints" definition instead. That's where the real fight is.
