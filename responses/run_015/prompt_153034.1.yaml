answer: |-
  There is no single, universally recognized proper noun (like "Murphy's Law" or "The Prisoner's Dilemma") for this *exact* deadlock. However, in legal philosophy and jurisprudence, this is the definitive example of **The Paradox of Self-Amendment**.

  Within that field, the specific pattern you are describing—where the authority used to enact a change is negated by the change itself, creating a loop of validity—is technically referred to as a **Self-Invalidating Amendment** arising from a conflict between **Self-Embracing** and **Continuing Sovereignty**.

  If you were to coin a precise term for the specific logical loop you described (where the validity of the vote oscillates based on the outcome of the vote), the most accurate descriptive name is a **Procedural Retroactivity Antinomy**.

  Here is the breakdown of the name, the definition, and how it differs from ordinary circular reasoning.

  ### 1. The Academic Context: The Paradox of Self-Amendment
  The definitive work on this is Peter Suber's *The Paradox of Self-Amendment* (1990). Suber analyzes exactly this scenario: Can a rule change the rules for changing rules?

  *   **Self-Embracing Sovereignty:** The view that a rule *can* change itself (including its own amendment procedure). Your forum's original clause ("any clause, including this one...") is self-embracing.
  *   **Continuing Sovereignty:** The view that a rule cannot bind its successor; the power to amend is unlimited and cannot be restricted by the previous rule.

  The deadlock you described occurs when you try to transition from a **Self-Embracing** regime (Majority vote) to a **Continuing/Restricted** regime (Unanimous vote) using the mechanism of the former.

  ### 2. Defining the Pattern
  Since you asked for a definition if a name doesn't exist, here is the formal definition of this specific pattern:

  **Definition: The Procedural Retroactivity Antinomy**
  A systemic inconsistency occurring when a normative system contains a self-referential amendment clause, and an amendment is passed that alters the procedural validity criteria of the amendment process itself. The antinomy arises when:
  1.  **Validity Condition A:** The amendment is valid if judged by the *old* procedure (which authorized the vote).
  2.  **Validity Condition B:** The amendment is invalid if judged by the *new* procedure (which the amendment purports to instantiate).
  3.  **Temporal Collapse:** The new procedure claims retroactive authority over the vote that created it, thereby destroying the legal foundation of its own existence.

  Unlike a standard paradox (which is often linguistic), this is a **normative antinomy**: the system contains two mutually exclusive truths ("The rule changed" and "The rule did not change") that are both derivable from the system's own axioms.

  ### 3. Where It Ends and Circular Reasoning Begins
  You asked exactly where this ends and ordinary circular reasoning begins. The distinction is **Ontological vs. Epistemological**.

  **Ordinary Circular Reasoning (Epistemological Flaw)**
  *   **Structure:** "Statement A is true because of Statement B. Statement B is true because of Statement A."
  *   **Problem:** This is a flaw in *argumentation*. It fails to prove anything.
  *   **Resolution:** You reject the argument. The reality outside the argument remains stable.
  *   **Example:** "The charter is valid because the admins say so, and the admins have power because the charter says so." (This is weak reasoning, but the charter might still exist).

  **The Procedural Retroactivity Antinomy (Ontological Flaw)**
  *   **Structure:** "The State of the System is X if the Vote is Valid. The Vote is Valid only if the State of the System is Y."
  *   **Problem:** This is a flaw in the *system state*. It is not just that we cannot *prove* if the rule changed; it is that the legal reality literally cannot decide if the rule changed. There is a **truth-value gap**.
  *   **Resolution:** You cannot reason your way out of it using the charter's own logic (as your admins discovered). The system requires an external intervention (a new vote, a court ruling, or a fiat decision) to break the loop.
  *   **Why it's "Sharper":** In circular reasoning, the conclusion is unsupported. In this paradox, the *existence* of the rule is unsupported. It is a "performative contradiction" where the act of speaking (voting) contradicts the content of the speech (the new rule).

  ### 4. How Legal Systems Resolve It
  In real-world constitutional law, this paradox is avoided not by logic, but by **interpretive fiat**. The standard resolution is the **Principle of Non-Retroactivity**.

  *   **The Solution:** The new rule (Unanimity) applies *prospectively* only.
  *   **The Logic:** The Old Rule (Majority) was the "Rule of Recognition" at the moment the vote occurred. Therefore, the vote was valid. Once the vote concluded, the Old Rule was replaced. The New Rule governs *future* votes, not the one that birthed it.
  *   **Why the Admin is Wrong:** The first admin is arguing for **Retroactive Invalidity**. If accepted, this would make *all* legal evolution impossible (because any new constitution would have to be ratified under the rules of the old constitution, which might forbid the new one).

  ### Summary
  *   **Broad Name:** The Paradox of Self-Amendment (Suber).
  *   **Specific Pattern:** Procedural Retroactivity Antinomy (or Self-Invalidating Amendment).
  *   **Key Distinction:** It is not circular *reasoning* (a bad argument); it is a circular *state* (a broken system).
  *   **Real-World Fix:** The "Transition Rule." The old procedure validates the change; the new procedure applies only to the future.

  Your admins are stuck in the paradox because they are trying to use the system to debug the system. To escape it, they must step outside the charter (e.g., "We all agree to accept the majority vote as valid, regardless of the text") and then re-ratify that agreement.
