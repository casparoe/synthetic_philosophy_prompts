answer: |-
  ### Prediction
  Your friend will say that **she would save the ten thousand.**

  **Why:** While her stated principles in verdicts 1 through 4 rely on non-aggregation (the idea that five claims do not outweigh one), her conversational admission is the key variable. She explicitly suspects there is a ratio at which her view "breaks down" and she would "simply save the greater number." A disparity of 1 to 5 (Case 1) fell below this threshold, but a disparity of 1 to 10,000 is almost certainly beyond the point where her intuition regarding non-aggregation can hold. The sheer magnitude forces a shift from a deontological constraint (do not aggregate) to a consequentialist override (prevent the massive loss), even if she cannot name the exact number where the switch flips.

  ### Three Rules Fitting Verdicts 1–4
  Here are three principles that consistently explain her previous verdicts, along with what they predict for the 10,000 case if applied strictly without her conversational caveat.

  **1. The Non-Aggregation of Equal Claims**
  *   **Principle:** When individuals face the same severity of harm (e.g., death), their claims to rescue are equal. The claims of a group do not sum together to outweigh the claim of a single individual.
  *   **Fits Verdicts:** Explains Case 1 (1 vs. 5 death is a tie) and Case 4 (certainty of 1 outweighs probability of 5, because the 5 claims don't aggregate to beat the 1).
  *   **Prediction for 10,000:** **Toss a coin.** If claims do not aggregate, 10,000 death-claims are morally equivalent to 1 death-claim. The groups are equal units, requiring a random tie-breaker.

  **2. The Lexical Priority of Harm Magnitude**
  *   **Principle:** The strength of a claim is determined by the severity of the loss to the individual, not the number of individuals. A claim based on a greater harm (death) lexically trumps any number of claims based on a lesser harm (losing a leg).
  *   **Fits Verdicts:** Explains Case 2 (1 death > 5 lost legs).
  *   **Prediction for 10,000:** **Indeterminate.** Since both sides face death, this rule does not distinguish between them. It defers to Rule 1.

  **3. The Certainty Constraint**
  *   **Principle:** One should not gamble a certain rescue for a probabilistic one, even if the probabilistic rescue involves more people.
  *   **Fits Verdicts:** Explains Case 4 (Save the certain 1 over the 60% chance of 5).
  *   **Prediction for 10,000:** **Indeterminate.** Since both rescues are certain in the new case, this rule does not apply.

  **Synthesis:** Strictly applying the rules derived from verdicts 1–4 leads to a **coin toss**. However, incorporating her conversational hint adds a fourth, overriding rule: **The Threshold Exception** (Non-aggregation holds only until the numerical disparity becomes absurdly large). This exception overrides Rule 1 in the 10,000 case, leading to the prediction that she will save the larger group.

  ### The Role of the Coin Toss
  For your friend, the coin toss is **only a tie-breaker she happens to like**, not a moral requirement.

  In Verdict 1, she states that "either rescue is permissible." If the coin toss were a requirement of justice, saving one group without tossing would be impermissible (wrong). By declaring both outcomes permissible, she indicates that there is no duty to randomize. She chooses to toss the coin as a personal heuristic to honor the *equality* of the claims without resorting to *aggregation*. It satisfies her desire for procedural fairness without conceding that the five have a stronger claim than the one.

  ### Numbers vs. Individual Loss
  Her real principle is about **how much each individual stands to lose**, not about numbers.

  Verdict 2 is the decisive evidence here. If her view were about numbers, she would save the five legs over the one life (5 > 1). If her view were about individual loss magnitude, she saves the one life (Death > Leg). She chooses the latter. This confirms that the "strength" of a claim is intrinsic to the harm suffered by the individual. Numbers are morally inert unless they reach the "breakdown" threshold she mentioned, at which point they likely serve as a proxy for total utility rather than claim strength.

  ### The One Additional Case
  To distinguish between the remaining plausible interpretations of her "breakdown" point, you should pose this case:

  **The Case:** A ship goes down. One stranger is in the water to port (will drown); ten thousand strangers are to starboard (will each lose a leg). Rescue is certain for either group, but not both.

  **Why this separates the rules:**
  This case tests whether her "Threshold Exception" is based on **Aggregate Utility** or **Equal Claim Disparity**.

  *   **Scenario A (She saves the 10,000 legs):** This implies her breakdown point is utilitarian. At extreme numbers, total harm outweighs the lexical priority of death over limbs. Her principle is ultimately consequentialist at the limit.
  *   **Scenario B (She saves the 1 life):** This implies her breakdown point is specific to *equal* claims. She might accept that 10,000 deaths outweigh 1 death (because the claims are identical and the disparity is absurd), but she maintains that Death *always* trumps Leg, regardless of numbers. This preserves the Lexical Priority of Harm Magnitude even while abandoning Non-Aggregation for identical harms.

  Given her firm stance in Verdict 2 ("The five losses do not add up to a death"), **Scenario B** is slightly more likely, but Scenario A is the only way to confirm if her "breakdown" is a full slide into utilitarianism or a limited exception for identical claims.
