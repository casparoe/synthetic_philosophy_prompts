prompt: |-
  As a high school student studying Kierkegaard's concept of the teleological suspension of the ethical, I have noticed a recurring moral pattern that resembles Abraham's situation yet differs in a specific, secular way. In these cases, an individual violates a universal ethical norm—such as breaking a binding promise or withholding necessary information—because they feel compelled by an intensely personal, non-rational commitment that they treat as higher than ethics itself, but this commitment is not grounded in any divine command or recognized religious authority. Instead, it presents itself as an irreducible individual vocation. Is there an established philosophical term for this secular analog? If so, how does it differ from existentialist authenticity, from ordinary moral heroism, and from simple irrationality? If there is no specific term, can you define the phenomenon with precise boundary conditions and explain whether Kierkegaard's original framework can accommodate it without distortion?
