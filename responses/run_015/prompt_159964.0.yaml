          *   *Verdict:* Genuine tension, but standard for this view. It threatens the "genuine disagreement" claim if not carefully parsed.

      *   *Worry 2: (c) undermines (f).* (Idealization collapses variation.)
          *   *Analysis:* (f) says variation survives ideal reflection. (c) says frameworks are idealized. If everyone idealizes, do they converge? The author *stipulates* in (f) that they don't. But is this plausible? If frameworks are just "what I'd think with full info," why wouldn't we converge on utilitarianism or Kantianism?
