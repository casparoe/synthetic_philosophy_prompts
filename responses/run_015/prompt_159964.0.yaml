      *   *Wait, simpler:* The core conflict is between (b) Assessor-Relativity and the desired asymmetry in (d)/(e).
      *   *If I keep (b):* The Engineer assesses the situation. His framework says "Unjust." Therefore, relative to him, it *is* unjust. If his framework says "Fix it," he *should* fix it. To stop him, you need an objective rule: "Outsiders must not intervene." But (a) says moral claims are relative. So "Outsiders must not intervene" is only true relative to *some* framework. Which one? If it's the author's, it's dogmatism.
