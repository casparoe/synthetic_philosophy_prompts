      *   *Standard objection:* "A says P is true. B says P is false." If P is "X is wrong," and truth is relative, A asserts "X is wrong relative to FA." B asserts "X is not wrong relative to FB." These are compatible propositions. No disagreement.
      *   *To save (g), you need **Assessor-Relativism** specifically.*
      *   *With Assessor-Relativism:* A asserts "X is wrong." B assesses this assertion. B finds it False (relative to FB). A assesses it True (relative to FA). They disagree on the *truth value of the same assertion under the same assessment context*.
      *   *So (b) actually saves (g).*
      *   *So Worry 1 dissolves **if** (b) is maintained rigorously.*
      *   *But (b) breaks (e).*
      *   *So the tension is between (b) and (e), not (a) and (g).*

      *   *Final check on the "Cheap Revision".*
      *   *If I change (e) to Pragmatic Restraint:*
      *   *Outsider judges it Unjust (True for him).*
      *   *Outsider wants to Intervene (Reason for him).*
      *   *Outsider is advised not to (Pragmatic constraint).*
      *   *This preserves (a), (b), (c), (d), (f), (g).*
      *   *It only modifies the *implication* of (e).*
      *   *Cost:* You lose the "Principle of Toleration." You gain "Prudence."
      *   *This is the best advice.*
answer: |-
  Here is the audit of your argumentative structure.

  ### 1. Assessment of Candidate Worries

  **Worry One: (a) and (g) collide (Disagreement).**
  *   **Verdict:** **Dissolves on inspection.**
  *   **Why:** This is the standard objection to relativism, but your commitment to **Assessor-Relativity (b)** specifically blocks it. In speaker-relativism, A and B assert compatible propositions ("Wrong relative to F1" vs. "Not wrong relative to F2"). In assessor-relativism, A and B are assessing the *same* content ("X is wrong"). When A assesses it, it is True; when B assesses it, it is False. They disagree on the truth-value of a single proposition relative to a single context of assessment. You can keep (g) provided you rigorously maintain (b).

  **Worry Two: (c) undermines (f) (Idealization).**
  *   **Verdict:** **Genuine.**
  *   **Why:** This is an empirical/philosophical burden, not a logical contradiction, but it threatens the motivation for the view. If "full information and unimpeded reflection" leads all agents to converge on a single moral theory (e.g., utilitarianism), then (f) is false, and the argument from variation collapses. You are stipulating that idealization preserves divergence. This is defensible but requires defense; it is a point of vulnerability in the seminar.

  **Worry Three: (e) is first-order morality in disguise (Outsider).**
  *   **Verdict:** **Genuine and Fatal.**
  *   **Why:** This is the structural breaking point of the chapter. **Assessor-Relativity (b)** entails that if the Engineer's framework condemns the practice and commands intervention, then *relative to him*, it is **True** that he ought to intervene. To assert in (e) that he has "no reason to intervene" and "no standing" is to impose a framework-neutral norm of sovereignty/non-interference. This contradicts (a), which denies framework-neutral moral truths. You are smuggling in an objectivist constraint on action while maintaining a relativist semantics.

  ### 2. Unlisted Tensions

  **Tension A: The "Critical Force" Problem (d) vs. (b).**
  *   **Severity:** **High.**
  *   **Analysis:** You claim the Insider's condemnation has "critical force against... those who defend it." If truth is relative to the *assessor* (b), the Defenders assess her claim as **False** (relative to their framework). Why should her truth bind them?
  *   **Resolution:** This only works if the Insider is making an *internal critique* (arguing the practice violates the *Defenders'* idealized framework). If she is arguing from *her* framework, she has no critical force against them, only expressive force.
  *   **Commitment to Give:** You must clarify that the "critical force" in (d) relies on the claim that the practice is incoherent *by the Defenders' own lights* (leveraging (c)). If you mean she condemns it by *her* lights and that binds *them*, you violate (a).

  **Tension B: "Improvement" vs. Relativism (g) vs. (a).**
  *   **Severity:** **Medium.**
  *   **Analysis:** You claim moral change can be "genuine improvement." If truth is framework-relative, "improvement" is also relative. A change is only an improvement relative to the *new* framework.
  *   **Commitment to Give:** You must accept that "improvement" is elliptical. You cannot claim the new state is objectively better, only that it satisfies the commitments of the post-change framework better than the pre-change one.

  ### 3. Ranking of Tensions by Severity

  1.  **The Outsider/Intervention Paradox (Worry 3).** *Fatal.* It creates a performative contradiction between your meta-ethics (b) and your political conclusion (e).
  2.  **The Critical Force Problem (Tension A).** *High.* It undermines the rhetorical power of the Insider case if not carefully qualified.
  3.  **The Idealization/Convergence Risk (Worry 2).** *Medium.* It threatens the empirical plausibility of the view.
  4.  **The Improvement/Relativity Tension (Tension B).** *Low.* Manageable with careful phrasing.

  ### 4. The Asymmetry Question

  **Can you keep the asymmetry between (d) and (e)?**
  **No, not on the current terms.**
  The assessor-relativity in (b) forces you to drop the strong version of (e). If the Engineer assesses the situation as unjust, and his framework generates a reason to act, then *for him*, there is a reason to act. To deny him standing is to privilege the Insider's framework (or a sovereignty norm) objectively.
  *   **If you keep (b):** You must grant the Outsider standing *relative to his framework*.
  *   **If you keep (e):** You must drop (b) in favor of a view where the *relevant framework* is determined by community membership, not the assessor. But this collapses into a form of contextualism that may violate (g) (making disagreement impossible).

  ### 5. The Single Revision

  To restore consistency most cheaply without retreating to non-cognitivism or abandoning the asymmetry entirely:

  **Revision:** **Modify (e) from a Normative Claim to a Pragmatic Claim.**
  Do not claim the Outsider has "no reason to intervene." Claim that he has a *prima facie* moral reason (derived from his framework's truth), but that this reason is **overridden by prudential or political constraints** (e.g., efficacy, sovereignty norms that *you* endorse within *your* framework).

  *   **Exact Change:** In (e), replace "gives him no standing to press for reform and no reason to intervene" with "gives him a *pro tanto* reason to intervene, but one that is typically outweighed by the epistemic and political costs of external imposition."
  *   **What You Lose:** You can no longer claim that Relativism *entails* toleration of outsiders. Toleration becomes a first-order moral commitment *within your own framework*, not a meta-ethical necessity. You lose the "meta-ethical shield" against imperialism.
  *   **What You Keep:** You keep the asymmetry (Insider acts, Outsider restrains), the assessor-relativity (b), and the cognitivism (a). The Outsider still judges the practice "True/Unjust," preserving his moral integrity, but he refrains from action for strategic reasons rather than metaphysical lack of standing.

  **Cost:** This weakens the political payoff of the chapter. You cannot tell the reading group "My theory proves outsiders shouldn't intervene." You must tell them "My theory allows outsiders to judge, but I argue they shouldn't act." This makes the view less elegant but logically sound.
