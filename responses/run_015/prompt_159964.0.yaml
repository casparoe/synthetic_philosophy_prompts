          *   *Verdict:* Highest severity. It breaks the internal logic of assessor-relativism.

  4.  **Identify Unlisted Tensions:**

      *   *Tension A: (b) Assessor-Relativity vs. (d) Insider's "Critical Force".*
          *   If truth is relative to the *assessor*, when the Insider says "This is unjust," is it true for the *Defenders* (senior heads)? No, relative to their framework, it's just. So how does her condemnation have "critical force against... those who defend it"? It only has force if *they* adopt her framework. If the claim is "It is true *simpliciter* that this is unjust," that violates (a). If the claim is "It is true relative to her," why should the defenders care?
