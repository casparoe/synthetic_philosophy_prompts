answer: |-
  **Working Title:** The Last Move: Terminal Instances and the Modal Structure of Convention

  **Abstract**
  Standard accounts of social convention, whether Lewisian common-knowledge models or evolutionary reinforcement accounts, define conventions through recurrence. They explain conformity by citing expectations of future interaction or histories of past repetition. This project investigates a structural blind spot in both families: the terminal instance. These are coordination problems of a familiar type faced by agents who know they will never interact again, such as a dissolving committee's final vote. Agents often conform conventionally here, yet the recurrence required by standard theories is absent. This fellowship will construct a taxonomy of recurrence dimensions to determine if terminal conformity is genuinely conventional, borrowed normativity, or a modal property of the rule. By testing intuitive judgments across constructed cases, the project aims to clarify whether recurrence is a constitutive requirement of convention or merely a typical genealogy, resolving a foundational ambiguity in social ontology.

  **Project Proposal**

  **The Question**
  Social conventions solve coordination problems. We drive on the right because you expect me to, and I expect you to. But what happens at the end of the road? Consider a committee voting on a procedural rule for its very last meeting, knowing the body will immediately dissolve. Or a firm making a final payment to a contractor with whom all future dealings are ceased. In these terminal instances, agents often conform to established patterns and cite convention-like reasons ("that is how we do it"). Yet, the two dominant philosophical accounts of convention cannot easily explain this. The common-knowledge account requires expectations of future conformity to ground rationality; the evolutionary account requires repeated play to ground stability. In a terminal instance, there is no future to expect and no repetition to learn from.

  This project asks a determinate question: **Is recurrence a necessary condition for convention, or merely a typical causal origin?** If the former, terminal conformity is misclassified convention (perhaps borrowed obligation). If the latter, standard theories must be revised to accommodate a modal rather than temporal understanding of recurrence.

  **The Gap in Existing Accounts**
  Both major families of theory build recurrence into their definitions by hand, rendering the terminal case invisible rather than solved. A defender of the common-knowledge account might dismiss the terminal case as uninteresting, arguing that without future consequences, the "coordination" is trivial or that the agents are actually following a prior agreement. A defender of the evolutionary account might argue that the *disposition* to conform was learned in the past, even if this specific instance is not repeated. However, these responses conflate the *origin* of a norm with its *current binding force*. If the binding force in a terminal instance relies on the past history alone, the evolutionary account holds. If it relies on a counterfactual ("we would have continued had there been a future"), the Lewisian account holds. If it relies on an external obligation (e.g., institutional rule), it is not convention at all. Existing literature remains silent on how to distinguish these sources when the behavioral output is identical.

  **Dimensions of Recurrence**
  The project proceeds on the premise that the user's proposed three dimensions of recurrence are independently variable, allowing for a structured case analysis:
  1.  **Problem Form:** Is the strategic structure identical?
  2.  **Agent Opportunity:** Will the same agents meet again?
  3.  **Payoff Structure:** Are the incentives identical?

  These do not collapse. One can face the same Problem Form with different Agents (anonymous social norms) or the same Agents with different Payoffs (changed stakes). The terminal instance specifically isolates **Agent Opportunity** (set to zero) while holding Problem Form constant. This isolation allows us to test if Agent Recurrence is the load-bearing dimension for conventionality.

  **Methodology**
  Straight conceptual analysis is too vague to resolve this, and simulation studies are inappropriate because they model behavioral stability, not normative status (a simulation can show agents *do* conform, not whether they are *following a convention*). Instead, I will employ a **Constructed Case Matrix**.

  *   **Month 1: Dimension Calibration.** I will refine the definitions of the three recurrence dimensions to ensure they are intuitively distinct. I will identify paradigm cases where all three are present (standard convention) and where all three are absent (coincidence).
  *   **Month 2: Case Construction.** With one part-time research assistant, I will construct 12-15 vignette cases varying the dimensions orthogonally. Crucially, this includes the "Terminal" corner (Problem Form: Yes; Payoff: Yes; Agent Opportunity: No) and a "Counterfactual" corner (Agents know a recurrence *would* have occurred but was prevented by exogenous force).
  *   **Month 3: Intuition Testing & Diagnosis.** I will circulate these vignettes to a controlled group of non-specialist philosophers to gauge judgments on two questions: "Did the agent follow a convention?" and "Was the agent normatively bound to do so?" This data will reveal if "convention" tracks actual recurrence or modal stability. At the end of Month 3, I will commit to one of the three diagnostic outcomes (see below).
  *   **Month 4: Drafting.** Writing the core argument, integrating the test results to support the chosen diagnosis.
  *   **Month 5: Revision.** Refining the argument against potential objections, specifically addressing the deflationary outcome.

  **Possible Results**
  1.  **The Borrowed Normativity Thesis:** Terminal cases are judged as non-conventional. Conformity is driven by institutional rules or prior agreements. This implies a significant portion of the "norms literature" has misclassified institutional habits as conventions.
  2.  **The Modal Lewisian Thesis:** Terminal cases are judged as conventional. This supports revising the common-knowledge account to rely on counterfactual expectations ("I conform because you *would* have") rather than actual future interactions.
  3.  **The Deflationary Outcome:** Judgments reveal no distinction between terminal and recurrent cases. This would indicate that "convention" is a type-level description independent of token-level recurrence. This is a live, positive result: it proves recurrence is genealogical, not constitutive.

  **Risk and Scope**
  The project fails if the vignette testing yields random or inconsistent intuitions, suggesting the concept of "convention" is too fragmented for this analysis. To prevent scope creep, I will not attempt to solve the broader meta-normative question of *why* conventions bind, only *whether* they bind in the absence of recurrence. The project is sized for one semester; if the case matrix proves too complex, I will reduce the variables from three to two (focusing strictly on Agent Opportunity vs. Problem Form), sacrificing granularity for completion.
