answer: |-
  ### Specification for an Account of the Meta-Problem

  The following is a specification for a theory addressing the "meta-problem" of consciousness: explaining why we possess the specific intuition that physical processes cannot explain experience. This is not a request for a solution to the hard problem, but a structural audit of what a successful explanation of the *intuition* must achieve.

  The requirements are divided into **Mandatory Desiderata** (conditions any adequate account must meet to align with the reported data) and **Sectarian Preferences** (conditions that reflect philosophical commitments rather than empirical constraints).

  #### I. Mandatory Desiderata
  *These requirements are derived directly from the variability and specificity of the reported intuitions. An account that fails these does not describe the phenomenon; it describes a caricature of it.*

  1.  **The Variability Constraint**
      *   **Requirement:** The account must explain why the intuition is not universal, detailing the specific cognitive or experiential variables that modulate its intensity.
      *   **Motivation:** The anesthesiologist's report (intuition weakens with exposure to induction) and the AI researcher's report (intuition evaporates during construction of reporting systems) demonstrate that the intuition is plastic. It correlates with familiarity with functional mechanisms. An account that treats the intuition as a fixed, universal feature of human rationality fails to match the data. It must specify which cognitive inputs dampen the intuition and why.

  2.  **The Modality Constraint**
      *   **Requirement:** The account must explain why the intuition depends on specific representational formats, such as mental imagery.
      *   **Motivation:** The case of aphantasia (no intuitive purchase of the gap) suggests the intuition relies on the ability to simulate or visualize the "inner" scene. If the intuition were purely conceptual or logical, the absence of imagery would not remove it. The account must identify the representational medium in which the gap is generated.

  3.  **The Resilience Constraint**
      *   **Requirement:** The account must explain why intellectual assent to a theory (e.g., physicalism) does not extinguish the intuition.
      *   **Motivation:** The philosopher who denies the hard problem but feels the intuition persist upon rereading his own arguments shows that the intuition is cognitively encapsulated. It is modular from belief. An account that suggests the intuition is merely a result of "ignorance" or "confusion" fails, because knowledge does not cure it. The mechanism must be insulated from top-down doctrinal correction.

  4.  **The Asymmetry Constraint**
      *   **Requirement:** The account must explain why this intuition attaches to *experience* specifically, and not to other previously mysterious natural phenomena.
      *   **Motivation:** We no longer feel a "hard problem" gap for life, heat, water, or heredity. Furthermore, people do not find "digestion-zombies" conceivable. A general theory of human cognitive limitation (e.g., "humans are bad at intuition") is insufficient. The account must identify the unique structural feature of experience reports that triggers this specific intuitive gap while leaving other functional gaps closed.

  5.  **The Linguistic Persistence Constraint**
      *   **Requirement:** The account must explain why dualist language persists in the speech of those who explicitly reject dualist ontology.
      *   **Motivation:** People who officially reject the hard problem still say "I felt pain" rather than "My C-fibers fired." The account must bridge the gap between official ontology and ordinary report. It cannot simply label this speech as "mistaken" without explaining why the mistake is systematic and unavoidable in communication.

  6.  **The Differentiation Constraint**
      *   **Requirement:** The account must remain consistent with reports that introspection can become *more* differentiated without the intuition disappearing.
      *   **Motivation:** The twenty-year meditator reports finer grain on experience, not the dissolution of the gap. This rules out theories that claim the intuition arises solely from "blurry" or "untrained" introspection. The mechanism must allow for high-resolution introspective data to coexist with the sense of unbridgeability.

  #### II. Sectarian Preferences
  *These are often demanded by specific philosophical camps, but they are not required by the data itself. Treating them as mandatory renders the specification unsatisfiable.*

  7.  **Ontological Neutrality**
      *   **Preference:** The explanation should not beg the question against physicalism or dualism.
      *   **Camp:** Desired by editors and generalists who want the debate to remain open.
      *   **Status:** **Optional/Impossible.** (See Conflict Analysis below).

  8.  **Phenomenological Validity**
      *   **Preference:** The explanation must not "explain away" the first-person reports it is constructed from.
      *   **Camp:** Desired by phenomenologists and non-illusionists.
      *   **Status:** **Optional.** A physicalist account may legitimately treat the reports as data about brain states rather than infallible guides to reality.

  9.  **Architectural Realizability**
      *   **Preference:** The explanation must be realizable as a mechanism in a cognitive architecture (e.g., predictive processing, global workspace).
      *   **Camp:** Desired by cognitive scientists and AI researchers.
      *   **Status:** **Optional.** A purely philosophical or conceptual analysis could suffice, though it would be less scientifically useful.

  #### III. Conflict Analysis
  *The following conflict demonstrates why the specification cannot be fully satisfied if certain preferences are elevated to requirements.*

  **The Conflict:** **Ontological Neutrality vs. Mechanistic Specificity**

  1.  **Step 1:** To satisfy the **Mandatory Desiderata** (specifically Variability, Resilience, and Asymmetry), the account must propose a specific cognitive mechanism. It must say *what the brain is doing* when it generates the intuition (e.g., monitoring internal states, failing to model the self, constructing a user-illusion).
  2.  **Step 2:** Any specific mechanism implies an ontological stance on the *target* of that mechanism.
      *   If the mechanism is a **detector**, it implies there is a property being detected (favoring Dualism/Panpsychism).
      *   If the mechanism is a **generator** (creating a representation without a corresponding external referent), it implies the property is illusory (favoring Physicalism/Illusionism).
  3.  **Step 3:** To satisfy the **Preference for Ontological Neutrality**, the account must refrain from committing to whether the mechanism is detecting or generating.
  4.  **Step 4:** However, a mechanism that is neither detecting nor generating is not a mechanism; it is a description of ignorance.
  5.  **Conclusion:** You cannot have a fully specified mechanistic account (required to explain the Variability and Asymmetry) that is also ontologically neutral. The act of explaining the *cause* of the intuition forces a stance on the *reality* of the intuition's content.

  **Verdict:** The preference for **Ontological Neutrality** must be dropped for the specification to be coherent. An adequate account will inevitably lean physicalist or dualist by virtue of the causal story it tells about the intuition.

  #### IV. The Exclusionary Requirement
  *The single requirement that excludes the largest number of otherwise plausible candidates.*

  **The Asymmetry Constraint (Requirement #4)**

  *   **Why it excludes candidates:** Most plausible cognitive theories of the meta-problem rely on general features of human cognition: we are bad at introspection, we confuse concepts with objects, or we lack the computational power to model our own complexity.
  *   **The Failure:** These general theories fail the Asymmetry Constraint. If the intuition were just a result of general cognitive limitation, we should feel a similar "hard problem" gap for digestion, photosynthesis, or quantum mechanics. We do not. The intuition is uniquely sticky for *experience*.
  *   **The Filter:** This requirement eliminates all "General Skepticism" accounts. It forces the theory to identify a feature *specific* to the processing of experience (e.g., the lack of sensory organs for sensing the brain itself, or the specific structure of self-modeling) that does not apply to biology or physics generally. It is the highest bar because it demands the theory explain why consciousness is the *only* remaining mystery of this specific intuitive kind.

  #### V. Summary of Status on Variability and Resilience
  *Addressing the specific query on the nature of the intuition.*

  An adequate account must explain **both** the variability and the resilience.
  *   **Variability** (Anesthesiologist/AI/Aphantasia) shows the intuition is not a necessary truth of reason; it is contingent on cognitive architecture and exposure.
  *   **Resilience** (Philosopher) shows the intuition is not a simple error of fact; it is structurally embedded in the operating system.

  If an account explains only the prevalence, it ignores the data of training and exposure. If it explains only the variability, it cannot account for why experts still feel the pull. The specification requires a mechanism that is **structurally fixed** (producing resilience) but **input-sensitive** (allowing for variability via specific functional exposures). This is a narrow channel, but it is the only one that fits the reported shape of the problem.
