answer: |-
  There is no single established term in narratology that captures this distinction precisely enough for your purpose. Terms like *prolepsis* (flashforward) or *foreshadowing* describe the rhetorical device, not the ontological status of the fact. Terms like *determinism* or *fatalism* describe the worldview, not the specific truth-relation between sentence and story-time.

  The philosophical cousin of your problem is the distinction between **Truth** and **Settledness** (often discussed in Branching Time Semantics as a solution to the Sea Battle puzzle). A statement can be *true* in the actual history of the world without being *settled* at an earlier moment (i.e., true in all possible futures branching from that moment).

  However, since you are working with a finished text where the "actual history" is fixed by your authorship, the philosophical distinction needs to be adapted to the architecture of the novel.

  I propose you name this distinction **Local vs. Global Settledness**.

  ### The Definition

  **Local Settledness:** A forward-pointing statement is *Locally Settled* at a given story-moment if its truth is guaranteed by the causal conditions existing *at that moment* (character motives, physical laws, immediate circumstances).
  *   *Example:* "He was about to sneeze." (The irritation in his nose is present in Chapter 2.)
  *   *Agency Cost:* None. The character is on a causal track they have already entered.

  **Global Settledness:** A forward-pointing statement is *Globally Settled* at a given story-moment if its truth is guaranteed only by the *final architecture of the narrative* (the ending you decided in revision), regardless of the causal conditions at that moment.
  *   *Example:* "She would not see him again for eleven years." (Nothing in Chapter 2 makes this inevitable; only your decision in Chapter 20 does.)
  *   *Agency Cost:* High. The statement treats a future plot requirement as if it were a present causal fact.

  ### Why This Distinction Works

  1.  **It explains the revision process:** In your first draft, the "eleven years" sentence was neither Locally nor Globally Settled (it was undefined). In your revision, you made it Globally Settled. The text in Chapter 2 didn't change, but its *status* did. It shifted from a possibility to a structural necessity.
  2.  **It explains the grammar:** You noted the prevalence of *was going to*, *would*, *was about to*. These are **Future-in-the-Past** forms. They inherently adopt a viewpoint from the *end* of the timeline looking back. They are the grammatical markers of Global Settledness. When you use them for a Locally Unsettled event, you are importing the authority of the Ending into the Middle.
  3.  **It isolates the "taking away":** You feel some sentences "take something away" from the characters. This happens when you present a **Globally Settled** fact as if it were **Locally Settled**.
      *   If the narrator says, "She would not see him again," the reader accepts this as Fate (Global).
      *   If the narrator says, "She turned away, determined never to see him again," the reader accepts this as Choice (Local).
      *   The friction arises when the narrator asserts the Global fact *without* the Local justification. It bypasses the character's agency to get to the author's plot point.

  ### The Boundary and Test Cases

  To use this tool, examine every forward-pointing sentence in your omniscient narration and ask: **"Is this true because of what is happening now, or because of what I decided happens later?"**

  **Case 1: The Causal Bridge (Locally Settled)**
  *   *Sentence:* "He was walking into a trap."
  *   *Test:* Is the trap physically set and visible to the narrator now? Is the character's path causally leading him there based on current motives?
  *   *Verdict:* If yes, this is Locally Settled. It does not remove agency; it describes the consequences of current actions.

  **Case 2: The Structural Bridge (Globally Settled)**
  *   *Sentence:* "He would not survive the winter."
  *   *Test:* Is he sick now? Is he in danger now? Or did you simply decide in Chapter 30 that he dies?
  *   *Verdict:* If the latter, this is Globally Settled. It removes agency. It tells the reader that his choices in the intervening chapters do not matter.

  **Case 3: The Logical Truth (Necessary)**
  *   *Sentence:* "Either he would survive, or he would not."
  *   *Test:* Is this true in all possible worlds?
  *   *Verdict:* This is Logically Necessary. It removes nothing because it constrains nothing.

  ### How to Apply It in Revision

  You do not need to eliminate Globally Settled sentences. Omniscient narration relies on them to create tone, irony, and scale. However, you must manage the **Agency Cost**.

  *   **If you want to preserve tension:** Avoid using Globally Settled sentences for major character choices. If the narrator announces the outcome of a choice before the character makes it, the scene becomes a ritual rather than a drama.
  *   **If you want to create tragedy/fate:** Deliberately use Globally Settled sentences to override Local possibilities. This signals to the reader that the characters are pawns of the plot (or destiny).
  *   **The Fix:** If a sentence feels like it "takes away" too much, convert it from Global to Local.
      *   *Global:* "She would not see him again for eleven years."
      *   *Local:* "She turned the corner, unaware that eleven years would pass before she stood here again."
      *   *Difference:* The first asserts the fact as a constraint on the world. The second asserts the fact as a limitation of the character's knowledge. The second preserves the *possibility* that she could have seen him, had she known; the first erases that possibility.

  ### Summary

  The name is **Local vs. Global Settledness**.

  *   **Local Settledness:** Truth derived from the *scene's* causal logic. (Preserves Agency)
  *   **Global Settledness:** Truth derived from the *book's* structural logic. (Imposes Fate)

  Your intuition about the grammar was correct: Future-in-the-Past forms are the vehicles of Global Settledness. Use them when you want the narrator's knowledge of the Ending to color the Beginning. Withhold them when you want the Beginning to breathe on its own.
