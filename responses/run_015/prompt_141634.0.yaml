prompt: |-
  hey, I'm TAing an undergrad seminar on ai governance and the session on scalable oversight really didn't land. everyone read the pitch -- if the system is smarter than the grader, make two of them argue in front of the grader and have the grader pick the winner, maybe recursively, letting each side break a contested sub-claim down into smaller sub-claims until a weaker debater or the grader can settle it -- and the room just went "yeah, sure, seems fine." nobody could articulate a reason it wouldn't be fine, and i don't want to hand them another paper. i want to hand them something that makes them feel the thing.

  so: write me a piece of satire, deadpan corporate voice, formatted as an internal document from a vendor that sells debate-judged auditing to institutional clients -- like "Safety Case Appendix D: Verified Transcript, Live Deployment" -- with whatever fake cover memo, footnotes and boilerplate furniture makes it funnier. invent the vendor, invent the client (a county pension fund, a hospital billing office, whatever), and set the transcript on a question where a right answer definitely exists but is only reachable by grinding through something long and boring: a total that has to be summed across a few hundred rows, a claim that turns on a definition buried four pages earlier in a contract, a chain of thirty-ish inference steps. the wrong answer should be short, confident, and phrased the way a careful person would phrase it. then the human judge rules for the wrong side, in completely reasonable institutional language, and the reason is legible without anyone in the document noticing it: the winning side was easier to follow, the losing side "relied on a sub-claim the reviewer was not in a position to adjudicate within the allotted review period," hedging read as uncertainty, the specific local error the honest debater managed to point to was not something the reviewer could check in four minutes with a mandate to close the ticket. i'd love you to build the disaster out of the actual mechanics rather than out of sci-fi: pointing out a concrete error only pays if the judge can verify that error; a debater paid in persuasiveness will always prefer quoting a plausible-sounding aggregate to doing the arithmetic; the recursive move of calling in a weaker sub-debater bottoms out when the sub-questions are still individually tedious; and both sides, under the same incentive, slowly converge on the same tactics -- accusing each other of unverifiable sub-claims, citing, dropping hedges -- so the format ends up selecting for a style instead of for accuracy. if you want to invent one concrete protocol rule that the whole catastrophe runs on (something like a verifiability rule saying the judge may only credit claims she could in principle check herself, or a rule that you must commit to a specific falsifiable sub-claim or forfeit the point) please do, that's the kind of specific i'm after. nobody in the document should ever say the format is broken.

  just start straight in on the document -- no preface, no explanation of what debate is, nothing after it either, since i'm dropping it into the packet as is. somewhere around 800 to 1000 words.
