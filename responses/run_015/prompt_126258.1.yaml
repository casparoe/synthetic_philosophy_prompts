      *Drafting Section 2:*
      The phenomenon is an asymmetrical treatment of moral phenomena based on their utility to a metaethical theory. When norms diverge (e.g., honour killings), they are treated as paradigmatic 'moral' facts, proving variability and thus constructivism. When norms converge (e.g., care for kin), they are reclassified as 'proto-moral,' evolutionary instincts, or prudential rules, thereby removing them as evidence for objective truth. It isn't merely ignoring convergence; it's granting its existence while denying its relevance to the *moral* ontology. The realist faces a dilemma: divergence proves relativism, convergence proves biology. The move insulates anti-realism by ensuring no empirical fact can count as evidence for realism. It differs from honest theory-building because the classification criterion shifts depending on the data's direction.

