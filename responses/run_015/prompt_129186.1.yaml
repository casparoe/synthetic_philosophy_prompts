      *   *Coherence Check:* Do these hang together? There's a tension. Rehab says "become rigid to become free." Law says "if you're rigid (but conscious), you're still responsible." This suggests a conflict in how "control" is defined. Rehab defines control as *management of impulses* (even via rigid tools). Law defines control as *conscious choice at the moment of action*.

  3.  **Step-by-Step Reconstruction:**

      *   **Step 1: The Implicit Theory of Agency (The "Layered View").**
