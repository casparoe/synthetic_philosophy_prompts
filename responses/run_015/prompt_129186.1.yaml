      *   **Step 4: What if Flexibility isn't the Hallmark?**
          *   If we drop flexibility, we focus on *alignment* or *identification*.
          *   Implications for Law: Harder to blame. If the action aligns with deep values (even if rigid), is it free? If it aligns with addiction (deep craving), is it unfree?
