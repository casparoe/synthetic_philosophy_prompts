answer: |-
  # Joint Statement on Letter Identity: The 'a' Collaboration

  ## 1. Agreed Claims

  Both camps endorse the following propositions as the baseline for further inquiry.

  1.  **No Necessary Geometry:** There is no single geometric feature (e.g., a closed counter, a specific curve) present in every valid instance of 'a' across all contexts.
  2.  **Production Distinction:** Production history distinguishes a genuine letter token from a coincidental shape (e.g., a coffee stain resembling 'a'), even if indistinguishable to the eye.
  3.  **Uptake Limits:** Reader uptake can override form in contexts of extreme distortion, but not indefinitely; there is a threshold where recognition fails regardless of context.
  4.  **Form Constraints:** Form can override uptake when a mark is inserted into a text where it violates all local contrast norms; a circle cannot function as 'a' if 'o' is already present and identical.
  5.  **Allography:** Alternate glyphs (e.g., single-storey 'ɑ' and double-storey 'a' in one font) function as a single letter type despite formal differences. (Schema concedes form variance; System concedes type unity).
  6.  **Template Existence:** A stored template exists in cognition but operates as a flexible attractor, not a rigid mold. (System concedes internal structure; Schema concedes flexibility).
  7.  **Divergence:** Production history and reader uptake can come apart temporarily (e.g., misreading), but sustained divergence collapses letterhood.
  8.  **Learning Mechanism:** Learning a script involves mapping shapes to systemic positions, not just memorizing forms in isolation.
  9.  **Contrast Requirement:** A mark loses letterhood if it ceases to contrast distinguishably with its neighbors in the system.
  10. **Token vs. Type:** Identity conditions differ for tokens (physical instances) versus types (abstract categories); disagreements often stem from conflating the two.

  ## 2. Disagreements Table

  | Issue | Schema Camp Claim | System Camp Claim | Type of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **The Permuted Typeface** | The text does not contain 'a's; it contains 'e'-shapes functioning as 'a'. The shape determines the letter identity. | The text contains 'a's. The functional role within the system determines identity, regardless of shape. | **Genuine.** Empirical dispute over whether shape or role is constitutive. |
  | **The Orphan Glyph** | An isolated glyph generated by the 'a' routine is an 'a', even if majority readers call it 'o'. Form carries identity. | An isolated glyph has no letter identity without a system of contrasts. It is merely a shape until contextualized. | **Verbal.** *Meaning 1:* "Is an 'a'" = possesses intrinsic properties. *Meaning 2:* "Is an 'a'" = occupies a functional node. *World State:* If readers consistently misidentify it, Schema calls it a misreading; System calls it a category error. *Consequence:* Determines whether identity is internal or relational. |
  | **Definition of "Letter"** | A letter is a class of shapes satisfying an abstract structural schema. | A letter is a node in a network of contrasts maintained by production and uptake chains. | **Stipulation.** Neither side can dictate this without begging the question. We must treat "letter" as the *explanandum*, not the *explanans*. |
  | **Genesis vs. Appearance** | A mark generated by noise that perfectly matches the 'a' schema is an 'a' (type match). | A mark generated by noise is not an 'a' because it lacks the causal history of the script system. | **Genuine.** Dispute over whether causal history is constitutive of type identity. |

  ## 3. Cruxes and Pre-Registered Predictions

  We identify five sub-questions where empirical results would force theoretical revision.

  **1. The Permuted Typeface**
  *   **Case:** A book set entirely in a typeface where shapes are permuted by one big cycle (typed 'a' prints as 'e'-shape). 200 pages. Readers achieve fluency after one hour.
  *   **Schema Prediction:** Reading speed will remain significantly slower than standard text indefinitely; errors will cluster around shape-confusion, proving shape is primary.
  *   **System Prediction:** Reading speed will normalize to baseline within 200 pages; errors will be semantic, not perceptual, proving role is primary.

  **2. The Orphan Glyph**
  *   **Case:** A glyph generated by the typeface's 'a' routine is shown in isolation to 100 readers. 40 read 'a', 60 read 'o'.
  *   **Schema Prediction:** The 60 'o' responses are errors. The glyph remains an 'a' because it satisfies the generative schema.
  *   **System Prediction:** The glyph is indeterminate. Without contrastive context, majority uptake defines the temporary identity; it is currently an 'o'.

  **3. The Invented Script**
  *   **Case:** A new script with 26 elements, structurally isomorphic to Latin, sharing no shapes or history.
  *   **Schema Prediction:** None of these elements are Latin letters. They are functional equivalents, but not the same types.
  *   **System Prediction:** The element occupying the 'a' node is an 'a'. Structural position overrides historical lineage.

  **4. The Child's Mark (Intention vs. Uptake)**
  *   **Case A:** Child intends 'a', marks looks like 'u', all readers say 'u'.
  *   **Case B:** Child intends 'q', marks looks like 'a', all readers say 'a'.
  *   **Schema Prediction:** In both cases, the form dictates the letter. Case A is 'u'; Case B is 'a'. Intention is irrelevant to identity.
  *   **System Prediction:** In both cases, communal uptake dictates the letter. Case A is 'u'; Case B is 'a'. (Note: Both agree on outcome, but disagree on *why*. Schema cites form; System cites uptake consensus).
  *   **Refined Crux:** If the child insists Case B is 'q' and uses it consistently as 'q' in private writing, does it become 'q'? Schema: No (form is 'a'). System: Yes (private system role).

  **5. The Noise Match (Custom)**
  *   **Case:** A shape generated by random noise perfectly matches the double-storey 'a' schema. It is never used in communication.
  *   **Schema Prediction:** It is an 'a'. It satisfies the abstract form conditions.
  *   **System Prediction:** It is not an 'a'. It occupies no position in a communicative system and has no production chain.

  ## 4. What Would Move Us

  **Schema Camp:** We would relinquish the claim that form is constitutive if presented with a stable script where instances of a single letter type share **zero geometric overlap** (no common strokes, topology, or spatial arrangement) yet are processed identically to standard letters by native readers. If form is entirely absent, it cannot be the schema.

  **System Camp:** We would relinquish the claim that role is constitutive if presented with a mark that occupies a stable functional node in a communicative system but is **consistently identified as different letters** by competent readers without causing communication breakdown. If the system holds but the identity fractures, the system is not the source of identity.

  **Joint Settlement:** Both sides agree that a neural account showing distinct processing pathways for "shape recognition" versus "letter categorization" would settle the matter. If brain imaging reveals that 'a'-identification activates a module independent of shape-processing modules even when shapes vary, the System view is vindicated. If 'a'-identification always co-activates specific shape-modules regardless of context, the Schema view is vindicated. We commit to designing an experiment to test this dissociation.
