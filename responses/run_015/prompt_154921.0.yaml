answer: |-
  This is a mature frustration. The "democratic backsliding" literature has moved rapidly from a novel theoretical intervention (Bermeo 2016; Levitsky & Ziblatt 2018) to a catch-all dependent variable that risks explaining everything and nothing. If you want to avoid normative shouting and produce durable political science, you need to treat "backsliding" not as a fact, but as a measurement and conceptual challenge.

  Here is the separation of settled vs. contested knowledge, followed by a defended ordering of three research priorities.

  ### Part I: The State of the Field (Settled vs. Contested)

  Do not cite the "Contested" items as consensus in your prospectus or job market papers.

  | **Broadly Settled (Empirical Consensus)** | **Genuinely Contested (Theoretical/Methodological)** |
  | :--- | :--- |
  | **Mode of Failure:** Sudden coups d'état are historically rare compared to 50 years ago; gradual erosion is the dominant mode of regime change in the 21st century. | **The Baseline:** There is no agreement on the counterfactual. Is the baseline "liberal democracy" (rights-heavy) or "electoral democracy" (procedure-heavy)? This determines whether a policy is "backsliding" or "majoritarianism." |
  | **The Toolkit:** Incumbents increasingly use legal means (constitutional reform, court-packing, media regulation) rather than illegal force to consolidate power. | **Measurement Validity:** Expert-coded datasets (V-Dem, Freedom House) correlate highly, but it is contested whether they capture *democratic decline* or *Western elite disapproval* of specific policies (e.g., migration, sovereignty). |
  | **The Actor:** Backsliding is almost exclusively executed by elected incumbents, not outsiders. | **Norms vs. Rules:** It is unclear if "norm erosion" is a distinct causal mechanism or merely a description of rule-breaking that hasn't yet been codified. |
  | **Polarization:** Affective polarization is a robust correlate of backsliding risk. | **Distinctiveness:** It is contested whether backsliding is a distinct phenomenon or simply a label for state capture, corruption, or standard distributive conflict. |

  ---

  ### Part II: Prioritized Lines of Work

  Here is the ordering based on **upstream necessity** (you can't study mechanisms if the phenomenon is mismeasured) and **tractability** (can you finish this in 3 years?).

  #### Priority 1: The Epistemic Gatekeeper (Measurement & Expert Bias)
  **The Question:** To what extent do expert-coded indicators of backsliding reflect institutional decay versus policy divergence from Western liberal norms?
  **Why Upstream:** If your dependent variable (DV) conflates "illiberal policy" with "undemocratic procedure," every subsequent finding about causes or mechanisms is suspect. This addresses your concern about the term being a "partisan slur."
  **Tractability:** High. You do not need to build a new dataset from scratch. You can use existing V-Dem data and cross-validate it against "objective" event data (e.g., constitutional amendments passed, judges removed, media licenses revoked) or use survey experiments on area experts to test for ideological bias.
  **Defended Ordering:** This is first because it is a validity threat. If you write a dissertation on *how* backsliding happens using a DV that is partially measuring *policy disagreement*, your thesis is vulnerable to the exact critique you want to avoid.
  **Evidence That Would Lower This Priority:** If a new, purely objective index of democratic procedure (stripped of rights/liberties content) emerges and correlates at >0.9 with current expert surveys, the bias concern is mitigated, and you can move to mechanisms.

  #### Priority 2: The Ontological Core (Institutions vs. Norms)
  **The Question:** Is "norm erosion" a distinct causal mechanism, or is it epiphenomenal to institutional aggrandizement?
  **Why Second:** Once you have a defensible measure of decline, you must explain the *process*. The literature often treats "breaking norms" and "packing courts" as a bundle. They may not be. Norms might erode *after* institutions are captured, not before.
  **Tractability:** Medium. This requires mixed methods. You can code legislative behavior (e.g., use of emergency decrees, committee bypass) as observable proxies for "forbearance" (Levitsky/Ziblatt) rather than relying on subjective assessments of "norms."
  **Defended Ordering:** This is the substantive heart of the PhD. It moves you from "is it happening?" to "what is it?" Distinguishing these allows you to argue that backsliding is distinct from simple executive overreach.
  **Evidence That Would Lower This Priority:** If process-tracing reveals that norm violations never occur without prior institutional changes (or vice versa), the concepts may be collinear, and you should collapse them into a single "institutional decay" model.

  #### Priority 3: The Boundary Condition (Backsliding vs. Policy Conflict)
  **The Question:** Under what conditions is the expansion of executive power "backsliding" versus "state capacity building" or "mandate fulfillment"?
  **Why Third:** This is the hardest theoretical lift. It requires defining the limit of democratic majoritarianism. It is placed third because it is often a *conclusion* drawn from 1 and 2, rather than a standalone empirical project.
  **Tractability:** Low/Medium. This is prone to normative drift. To make it tractable, focus on **intent and reversibility.** Backsliding implies an intent to lock in power; policy conflict implies contestation within reversible rules.
  **Defended Ordering:** This addresses the "policies I disagree with" critique directly. However, without the measurement clarity of Priority 1 and the mechanistic clarity of Priority 2, this becomes purely philosophical.
  **Evidence That Would Lower This Priority:** If you find that "intent" is empirically unknowable (which is likely), you may need to drop this and focus solely on *outcomes* (i.e., if the election becomes uncompetitive, the intent is irrelevant).

  ---

  ### Part III: Strategic Advice for Execution

  To ensure this doesn't become "normative shouting," adopt the following research design constraints:

  1.  **Disaggregate the DV:** Do not use the "Liberal Democracy Index" as a black box. Use specific sub-components (e.g., *Judicial Constraints* vs. *Freedom of Expression* vs. *Electoral Integrity*). If your theory is about court-packing, do not regress on free speech metrics.
  2.  **Pre-register Observable Implications:** If you argue "norms are eroding," specify exactly what observable behavior constitutes that erosion *before* looking at the cases. (e.g., "Refusal to hold hearings within X days," not "acting uncivilly").
  3.  **Include "Negative" Cases:** Study countries that were predicted to backslide but didn't, or countries that enacted "illiberal" policies without democratic collapse. This prevents selection bias on the dependent variable.

  ### Summary of the Bet
  Prioritize **Measurement Validity (1)** because the field is currently suffering from a crisis of confidence regarding expert bias. If you can robustly demonstrate that backsliding metrics capture institutional reality rather than policy preference, you solve the "partisan slur" problem empirically. Then, use that cleaned measure to dissect **Mechanisms (2)**. Leave the deep philosophical boundary work **(3)** for the discussion chapter, as it is less publishable in empirical journals.

  **Risk:** Priority 1 is methods-heavy and can become a technical debate detached from politics.
  **Mitigation:** Frame the methods paper as a conceptual clarification. You aren't just fixing stats; you are refining the concept of democracy to save it from conceptual stretching.
