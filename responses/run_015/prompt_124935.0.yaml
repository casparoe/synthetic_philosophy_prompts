answer: |-
  **Private Preamble: Assumptions of Good's Theorem (EVPI ≥ 0)**

  1.  **Causal Inertness:** Measurement does not alter the state of the world being measured. [Status: Fails]
  2.  **Agency Unity:** The entity learning the information is the same entity choosing the action. [Status: Fails]
  3.  **Freedom of Action:** The decision-maker is free to choose any action in the available set based on the information. [Status: Fails]
  4.  **Costless Information:** The cost of acquiring information is zero or accounted for separately from the value calculation. [Status: Fails]
  5.  **Rational Updating:** The decision-maker updates beliefs and acts optimally according to Bayesian principles without political distortion. [Status: Unclear]

  ***

  **TO:** Science Advisory Board
  **FROM:** Decision Science Advisory Unit
  **DATE:** 12 September 2024
  **RE:** FY26–27 Research Appropriation – Sutter Basin Fairy Shrimp

  **Recommendation**

  The Board should **fund a redesigned survey and acquisition package**. We recommend reallocating the proposed $1.6 million appropriation: $400,000 for immediate land acquisition and $1.2 million for an intensified single-season occupancy survey in Spring 2026. This redesign secures high-risk habitat before data disclosure, meets the March 2027 federal grant deadline, and reduces the window for reactive habitat destruction.

  **Reasons**

  The debate before us is framed as a choice between knowing and acting, but this is a false dichotomy. The argument that we should decline the survey to fund acquisition relies on the certainty of current returns: $2,400 per acre secures permanent protection now. This is a strong argument. In a static world, 670 acres in hand is superior to a probabilistic future grant. However, ignoring the grant opportunity forfeits potential leverage: $1.6 million today could become $4.8 million in 2027, securing triple the habitat. Declining the survey entirely locks us into state-only funding capacity, effectively capping our conservation impact.

  Conversely, the argument that we must fund the survey as proposed relies on a misapplication of decision theory. Our colleague invokes Good's theorem to suggest information cannot have negative expected value. This theorem assumes information is causally inert—that measuring the shrimp does not change the shrimp's reality. In this case, that assumption fails. The measurement trigger (public records disclosure) activates a behavioral response (landowners disking pools) that destroys the very asset we intend to measure. Furthermore, the theorem assumes the learner is the chooser. Here, the Board learns, but the Commission chooses. The Commission's tendency to act on preliminary data increases the risk that partial information triggers protections before we have secured the land, accelerating habitat loss.

  Therefore, the classic value-of-information calculation is inverted. Information here has a negative externality. However, information also has option value. Without the occupancy estimate, the federal match is inaccessible. We cannot afford to ignore the match, nor can we afford to ignore the reactivity risk.

  The redesigned package mitigates both risks. By diverting $400,000 to immediate acquisition, we secure approximately 160 acres in the highest-risk complexes before the survey begins. This creates a buffer; even if landowners react to subsequent data, a core habitat network remains protected. By compressing the survey into a single, intensified season (Spring 2026), we generate the statistical confidence required for the federal grant application by March 2027. The original two-season plan leaves us vulnerable to the grant window closing with only partial data. Intensifying the sampling rate in one season maintains statistical power while reducing the duration of public uncertainty.

  We must also address the principal-agent problem. The Board must recommend a data embargo protocol alongside this funding. Raw site-specific data should not be released under the Public Records Act until after the March 2027 grant application is submitted and the initial acquisition phase is complete. This requires legal counsel to confirm that "best available science" obligations for listing do not override temporary confidentiality for conservation purposes. If legal counsel advises that immediate disclosure is mandatory, the survey component should be canceled, and all funds redirected to acquisition, as the reactivity risk would then outweigh the grant potential.

  **Implementation and Timeline**

  *   **15 October 2024:** Board adopts redesigned appropriation split ($400k acquisition / $1.2M survey).
  *   **1 December 2024:** Department identifies top-priority vernal pool complexes for immediate easement purchase.
  *   **1 March 2025:** Acquisition of first 160 acres completed; data embargo protocol finalized.
  *   **1 April 2026 – 30 June 2026:** Intensified Spring 2026 field season (eDNA and visual).
  *   **1 January 2027:** Data analysis complete; occupancy estimate generated.
  *   **15 March 2027:** Federal grant application submitted.
  *   **1 April 2027:** Public release of site-specific data (post-acquisition and post-grant submission).

  This path respects the statutory mandate to use best available science while acknowledging that in socio-ecological systems, the act of measurement is an intervention. We choose to intervene strategically.

