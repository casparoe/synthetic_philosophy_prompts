  The certificate will not say **DEATH**.
  It counts the overtime per **HOUR**.
  There is no holy **SABBATH**.
  Just the machine demanding **WORK**.
  The union negotiates the **WAGE**.
  But who clocks out for **REST**?

  We need the quiet of **REST**.
  But silence looks like **DEATH**.
  The cost of living is the **WAGE**.
  The minute hand jerks each **HOUR**.
  There is no end to **WORK**.
  We lost the true **SABBATH**.

  We pretend to keep **SABBATH**.
  But sleep is not **REST**.
  The body fails at **WORK**.
  The shadow speaks of **DEATH**.
  We sell every **HOUR**.
  For the daily **WAGE**.

  The bank accepts the **WAGE**.
  The shop closes on **SABBATH**.
  But the oven needs an **HOUR**.
  If I leave, I lose **REST**.
  Because the signal means **DEATH**.
  Someone else must do the **WORK**.

  If I stop the **WORK**.
  The price drops on the **WAGE**.
  My colleague faces **DEATH**.
  There is no real **SABBATH**.
  I am denied **REST**.
  By the ticking **HOUR**.

  The press runs on to justify the **WORK**,
  And solvent buys the time we call a **WAGE**;
  We hold the line against **DEATH** to earn **REST**.

  ***

  The poem leans hardest on your first premise: hours as a signal within a coordination problem. The turn in stanza 5 ("If I leave... Someone else must do the work") illustrates that individual withdrawal isn't liberation but a transfer of burden that threatens the collective equilibrium. The Protestant work ethic believer would argue I've cheated by reducing virtue to mechanics. They would say diligence is intrinsically good, a shaping of the soul, whereas I depict it merely as a defensive maneuver to keep the press running and the wage stable, stripping the labor of any spiritual telos beyond survival.
