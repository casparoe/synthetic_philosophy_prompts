answer: |-
  *   **The Turn:** The pivot must land in Stanza 5. Up to that point, the fatigue is personal (the body, the clock). In Stanza 5, the focus shifts to the *consequence* of leaving: the press stops, the client fails, the colleague bears the load. This captures the coordination problem without naming it. The speaker realizes their leisure is subsidized by someone else's labor, including their own future self.
  *   **The Last Line:** It cannot offer sleep as salvation. It must acknowledge that the system persists until biology fails. The line needs to hold the tension: the mechanism continues (signal sent), but the biological limit (death) is the only true stop, yet even that doesn't grant the desired rest. It ends on the unfulfilled promise.
  *   **End-Word Strategy:** I will map the permutation strictly (1-6, 6-1, etc.). For the envoi, I will place WORK and WAGE at the ends of lines 1 and 2 to maintain structural integrity, but line 3 will prioritize your constraint (ending on REST, containing DEATH) over the traditional retrogradatio, ensuring the argument lands on the absence of relief.

