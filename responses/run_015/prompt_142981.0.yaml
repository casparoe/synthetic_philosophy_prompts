answer: |-
  ### Desiderata for a Metaphysical Theory of Music

  **1. Non-Conceptual Mediation**
  *   **Spec:** The theory must explain the mechanism by which auditory structures trigger affective states without routing through semantic labeling or visual imagery. It cannot simply assert "immediacy"; it must define the *interface*.
  *   **Motivating Case:** Schopenhauer claims music copies the Will directly, unlike other arts which copy Ideas (which copy the Will). A modern theory must identify the cognitive or ontological substrate that allows sound to skip the "object" phase of perception.
  *   **Tension:** High conflict with **Desideratum 3 (Predictive Compatibility)**. If the auditory cortex is a hierarchical prediction engine, *all* input is mediated by prior models. True "unmediated" access is biologically impossible.

  **2. Structural Differentiation (Absolute vs. Program)**
  *   **Spec:** The theory must distinguish between music that generates meaning internally (absolute) and music that references external narratives (program), without reducing one to a degraded version of the other.
  *   **Motivating Case:** Schopenhauer dismisses program music as a concession to the "phenomenal world." A robust theory must account for why *Also Sprach Zarathustra* functions differently than a Beethoven Quartet, yet both access deep affect. If the theory relies solely on abstract form, it fails program music; if it relies on reference, it fails absolute music.
  *   **Tension:** Moderate conflict with **Desideratum 1 (Non-Conceptual Mediation)**. Program music explicitly invites conceptual mediation. A theory privileging direct access struggles to validate referential music without contradiction.

  **3. Predictive Compatibility**
  *   **Spec:** The account must be consistent with the auditory cortex as a predictive processing system. It must explain how "feeling" emerges from the management of expectation, surprise, and error minimization.
  *   **Motivating Case:** Neuroscience indicates perception is controlled hallucination constrained by sensory input. A metaphysical theory cannot posit a "ghost in the machine" that ignores the biological substrate. The "Will" must map onto something like "drive," "urge," or "homeostatic regulation."
  *   **Tension:** High conflict with **Desideratum 1 (Non-Conceptual Mediation)**. Predictive processing implies heavy mediation. It also tensions with **Desideratum 4 (Valence Independence)** because prediction errors are usually coded as negative (surprise/threat), yet musical surprise is often aesthetically positive.

  **4. Valence Independence**
  *   **Spec:** The theory must explain why acoustically "negative" stimuli (dissonance, atonality, unresolved tension) generate profound aesthetic engagement rather than simple aversion.
  *   **Motivating Case:** Schoenberg or Penderecki violate tonal expectations and harmonic consonance, yet listeners report deep emotional resonance. If music is the objectification of Will, and Will is suffering/striving, the theory must explain why mirroring suffering is aesthetically rewarding rather than merely painful.
  *   **Tension:** High conflict with **Desideratum 3 (Predictive Compatibility)**. In predictive coding, high error signals usually demand resolution or avoidance. A theory must explain why the *sustainment* of high error (atonality) is metabolically/aesthetically viable.

  ***

  ### Evaluation: Schopenhauer's View

  *   **Performance:**
      *   **Non-Conceptual Mediation:** **Pass.** This is the core strength. He posits music as a parallel ontology to the Will, not a representation of it.
      *   **Valence Independence:** **Pass.** Because the Will is inherently striving/suffering, music that mirrors tension/dissonance accurately reflects the metaphysical reality. The pleasure comes from the *knowledge* of the Will, not the sensation of comfort.
      *   **Structural Differentiation:** **Fail.** He creates a hierarchy where vocal/program music is "contaminated" by the world of Representation. He cannot account for the metaphysical validity of program music without undermining his own dualism.
      *   **Predictive Compatibility:** **Fail.** His model is pre-biological and dualist. It posits a direct pipeline that ignores the mechanistic processing of the ear and brain. It treats the "immediacy" as ontological magic rather than cognitive architecture.

  *   **Critical Flaw:** Schopenhauer solves the metaphysical weight of music by sacrificing biological plausibility. He buys "Directness" at the cost of "Mechanism."

  ### Evaluation: Modern Embodied-Cognition

  *   **Performance:**
      *   **Predictive Compatibility:** **Pass.** Frames music as motor simulation and entrainment. The "Will" becomes the body's homeostatic and motor planning systems. Music moves us because it hijacks the systems used for action and emotion regulation.
      *   **Structural Differentiation:** **Pass.** Can distinguish absolute music (internal motor simulation) from program music (simulation of external events/narratives) via different neural mirroring pathways.
      *   **Non-Conceptual Mediation:** **Partial Fail.** It reduces the "metaphysical" to the "physiological." While it explains *how* bypass occurs (sub-cortical motor pathways), it often strips the experience of its transcendent quality, reducing the Will to mere biological drive.
      *   **Valence Independence:** **Partial Pass.** Explains dissonance as "simulated threat" or "high-energy prediction error" that the body safely resolves. However, it struggles to explain why *unresolved* atonality remains compelling if the reward mechanism is tied to error minimization.

  *   **Critical Flaw:** Embodied cognition solves the "Mechanism" but risks dissolving the "Metaphysical." It explains the *vector* of the feeling but often fails to account for the *depth* or universal necessity that Schopenhauer identified. It makes music a tool of the body, rather than a revelation of the universe.
