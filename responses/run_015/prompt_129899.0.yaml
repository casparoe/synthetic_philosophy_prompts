      *   *Public Reaction:* People are intuitive essentialists. They treat "planet" as a natural kind, not a useful label. The outrage proves Wittgenstein right about how we *use* language (we get attached to the game we know).
      *   *Science vs. Philosophy:* Science often rejects family resemblance for the sake of utility. Wittgenstein describes how language *works*, not necessarily how science *should* work. Science creates stipulative definitions to solve specific problems.
      *   *Conclusion:* The Pluto case shows the limit of family resemblance in *technical* contexts. Science imposes structure on the mess. Wittgenstein explains the public confusion, but the IAU explains the physical reality.

