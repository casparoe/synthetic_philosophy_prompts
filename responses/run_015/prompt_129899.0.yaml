answer: |-
  This is a fantastic angle to look at the Pluto controversy. It cuts right to the heart of how we categorize the world versus how the world actually is. Let's walk through this step-by-step, using Wittgenstein's "family resemblance" as our flashlight.

  ### 1. The Pre-2006 "Planet" Family
  Before 2006, the category of "planet" was a textbook example of family resemblance. There was no single official definition written in stone that every astronomer checked against. Instead, objects were included because they shared a overlapping network of traits, much like members of a family might share a nose, or a gait, or a temperament, without every member having all three.

  What were those overlapping similarities?
  *   **Orbit:** They go around the Sun (not another planet).
  *   **Shape:** They are big enough to be round (mostly).
  *   **History:** They were discovered in a specific historical lineage (the ancients knew some, telescopes found others).
  *   **Isolation:** They seemed to be the "big dogs" in their local area (though this was vague).

  Under this system, Pluto fit in. It orbited the Sun. It was round (as far as we knew). It had moons. It was part of the historical list. If you showed Pluto to an astronomer in 1950 and asked, "Is this a game of 'planet'?" they would say yes, not because it passed a test, but because it looked enough like the other members of the family. It was a fuzzy, evolving category.

  ### 2. The 2006 Shift: Imposing an Essence
  Then came 2006. The International Astronomical Union (IAU) realized the family was getting too big and messy. We were finding lots of Pluto-like objects (Eris, Makemake, Haumea). If Pluto is a planet, Eris has to be one too. And maybe Ceres again. And maybe hundreds more.

  To stop the category from exploding, the IAU voted to stop using family resemblance and instead imposed a **classical essentialist definition**. They said a planet *must* have three specific properties:
  1.  Orbits the Sun.
  2.  Is round.
  3.  **Clears its neighborhood.**

  That third rule is the killer. It is a hard, binary, necessary condition. You either clear your orbit (you are the gravitational boss in your zone) or you don't. There is no "kind of" clearing your orbit.

  **Does this fit family resemblance?**
  No. It breaks it completely. Wittgenstein argued that searching for a single essential feature that all members of a category share is a philosophical mistake. He said we *can't* find essences in natural language. The IAU, however, *legislated* an essence. They forced a hard boundary onto a fuzzy reality.

  In a family resemblance model, Pluto could be a "cousin" of Earth—similar in some ways, different in others, but still part of the clan. By adding the "clears orbit" rule, the IAU said, "If you don't have this specific DNA marker, you are not in the family, period." They turned a gradient into a switch.

  ### 3. Why Were People So Mad?
  This is where it gets psychological. If "planet" is just a loose family category, why did the public react as if scientists had committed a murder?

  Wittgenstein would suggest that the public and the scientists were playing different **language games**.

  For astronomers, "planet" is a technical term used to model how solar systems form. It's a tool.
  For the public, "planet" is a cultural concept. It's part of our shared mythology, our school mnemonics ("My Very Educated Mother..."), and our sense of cosmic order.

  Regular people are intuitive **essentialists**. Even if a philosopher tells them categories are fuzzy, humans naturally believe that "Planet" is a real, natural kind of thing, like "Gold" or "Tiger." We feel like Pluto has a hidden "planet-ness" inside it. When the IAU voted, it felt like they were changing reality, not just a label.

  The outrage proves Wittgenstein's point about how deeply we cling to definitions. We get upset when the rules of the language game change on us. We had invested meaning in the word "planet" (it meant "major world"), and the scientists changed the rules to mean "dynamically dominant body." The public felt excluded from the game. They weren't mad about the physics; they were mad that the *use* of the word they grew up with was invalidated.

  ### 4. Messy Resemblance vs. Precise Science
  Here is the tension you spotted: Family resemblance suggests categories should be messy and informal. Science demands precision.

  The Pluto case suggests that **science often has to reject family resemblance to function.**

  In everyday life, fuzzy categories are great. If I ask you to "grab a chair," you don't need to measure the leg height to know if a stool counts. The fuzziness helps us communicate quickly. But in science, fuzziness kills prediction. If you are trying to simulate the formation of the solar system, you need to know if an object dominates its orbit or not. "Kind of dominating" doesn't work in the math.

  So, the IAU vote shows that while Wittgenstein is right about *ordinary language*, scientific language is a specialized tool that often forces essentialism onto nature for the sake of utility. Science creates "stipulative definitions." They essentially said, "For the purposes of this specific game (planetary dynamics), we are going to pretend this one feature is the essence, even if nature is messy."

  ### 5. The Verdict: What does Pluto do to Family Resemblance?
  The Pluto demotion doesn't disprove Wittgenstein, but it highlights the limits of applying family resemblance to **technical classification**.

  *   **For Ordinary Language:** Wittgenstein wins. The public confusion shows that we naturally think in family resemblances and get confused when forced into rigid boxes. The word "planet" in culture is still fuzzy; many people still call Pluto a planet because it fits the "family look" (round, orbits sun, has moons).
  *   **For Science:** The IAU wins, but by bypassing Wittgenstein. Science showed that sometimes you *need* to draw a hard line to make progress. If you stick to family resemblance in astronomy, you end up with 150 planets, and the category loses its usefulness for understanding solar system architecture.

  So, the Pluto case shows that **family resemblance describes how we naturally see the world, but science is often about overriding those natural instincts to create sharper tools.**

  The IAU didn't discover that Pluto wasn't a planet; they decided that the word "planet" would no longer be a family resemblance category. They turned it into a technical bin. The friction wasn't about astronomy; it was about the clash between a philosophical view of language (fuzzy, overlapping, cultural) and a scientific view of language (precise, binary, functional).

  In short: Wittgenstein explains why we care so much. The IAU explains why they had to do it. The "truth" of Pluto hasn't changed, only the rules of the game we play with the word.
