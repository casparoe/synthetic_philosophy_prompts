      *   *What made something a planet?*
          *   Orbits the Sun.
          *   Round (hydrostatic equilibrium).
          *   Visible to ancients (Mercury to Saturn).
          *   Discovered later (Uranus, Neptune) fit the pattern of orbiting + round.
          *   Pluto fit "orbits Sun" and "is round-ish" (though we didn't know how round until later).
          *   *Crucially:* There was no hard limit on size or orbital dominance. It was a "I know it when I see it" situation based on historical precedent and basic physics (orbit + round).
      *   *Family Resemblance Fit:* High. It was a loose cluster. Ceres was once a planet, then an asteroid. Pluto was a planet. It was a evolving list based on discovery, not a strict definition.

  4.  **Analyze the 2006 IAU Definition:**

      *   *The Three Criteria:*
          1.  Orbits the Sun.
          2.  Is round (hydrostatic equilibrium).
          3.  **Clears its neighborhood.**
      *   *The Shift:* Criterion #3 is a *necessary and sufficient* condition (along with 1 and 2). It's an essentialist definition. If you don't clear your orbit, you are *not* a planet.
      *   *Family Resemblance Fit:* Low/Broken. This imposes an "essence" (orbital dominance) where there wasn't one before. It draws a hard line in the sand.

  5.  **Address the Public Outrage:**

      *   *Why care?* If it's just a family resemblance category, why get mad when one member is kicked out?
      *   *Psychological/Cultural aspect:* "Planet" isn't just a scientific term; it's a cultural concept. It's part of childhood education (mnemonics, models).
      *   *Essentialism in Folk Psychology:* Regular people think like essentialists. They believe "planet" has a hidden essence (like "soul" or "species"). Taking it away feels like changing the nature of reality, not just updating a label.
      *   *Wittgenstein's take:* He would say the *use* of the word changed. The public uses "planet" for cultural/educational stability. Scientists use it for dynamical classification. The conflict is a language game clash.

  6.  **Address the Tension: Messy Resemblance vs. Precise Science:**

      *   *The Conflict:* Family resemblance thrives on fuzziness. Science thrives on precision (for prediction and modeling).
      *   *Does Science need Strict Rules?* Yes, for operational utility. If you're modeling solar system formation, "clearing the orbit" matters physically. "Looking round" doesn't tell you about the dynamics.
      *   *Does this disprove Wittgenstein?* Not necessarily. It shows that *scientific language games* have different rules than *everyday language games*. Science often *forces* essentialism onto nature to make it tractable.
      *   *Nuance:* Even in science, categories can be family resemblance (e.g., "species" is notoriously hard to define essentially). But planetary science needed a binary switch for classification.

  7.  **Synthesize the Argument:**

