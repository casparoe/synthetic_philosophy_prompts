answer: |-
  1. Conceptual Translation

  The core philosophical difficulty lies in distinguishing private taste from public obligation. A preference is subjective and makes no claim on others; a moral principle claims universal authority. A bias mimics a principle but lacks consistency, often serving hidden self-interest. Your Asymmetry of Reversal operationalizes the requirement of impartiality: if a rule collapses when you occupy the disadvantaged role, it lacks moral symmetry. The Regret Audit operationalizes universalizability: if a rule creates contradiction or chaos when adopted by everyone, it is not a valid principle.

  To make this usable for a non-specialist board, we must drop complex meta-ethical debates about the origin of values and nuanced definitions of "harm" or "rights." We also set aside supererogatory acts (going above duty) and deep cultural relativism. What must survive is the structural consistency of the claim. We retain the distinction between relevant and irrelevant differences (e.g., need vs. taste). If a claim cannot withstand role-swapping or universal adoption without contradiction, it is likely bias disguised as principle. This simplification sacrifices theoretical depth for procedural clarity, allowing laypeople to identify distortions without needing to define "justice" itself.

  2. The Procedure

  **Role:** The Board Chair facilitates. **Time:** 15 minutes maximum per case. **Expertise:** Common sense and community standards only.

  **Step 1: Claim Classification (2 Minutes)**
  *Question:* "Does the objector claim this rule should bind everyone equally, or is it a personal desire?"
  *Stop Point:* If purely personal (e.g., "I dislike the color blue"), declare **Preference Confirmed**. Dismiss objection. If they claim universal binding force (e.g., "Noise must be limited"), proceed to Step 2.

  **Step 2: Asymmetry of Reversal (5 Minutes)**
  *Question:* "If you were in the neighbor's position, would you accept this restriction applied to you?"
  *Exception:* Allow for special obligations (e.g., parents caring for children). If the parties are relevantly similar, the answer must be "Yes."
  *Stop Point:* If the answer is "No" without a valid special obligation, declare **Bias Detected**. End procedure. If "Yes," proceed to Step 3.

  **Step 3: Regret Audit (5 Minutes)**
  *Question:* "Would you still support this rule if every resident adopted it in all comparable cases?"
  *Stop Point:* If the answer is "No" (because it would create unlivable conditions or contradictions), declare **Bias Detected**. If "Yes," proceed to Step 4.

  **Step 4: Final Adjudication (3 Minutes)**
  *Analysis:* If both checks pass, the claim is a genuine moral principle, but it may conflict with another resident's genuine principle.
  *Stop Point:* Declare **Values Dispute — Hand to Board Vote**. The board must weigh the competing valid principles. The Chair signs off on the classification before any vote on the remedy occurs.

  3. Worked Cases

  **a) Religious Music vs. Quiet Respect**
  *Step 1:* Objector claims a universal duty of quiet; Neighbor claims a universal right to worship. Both claim principles. Proceed.
  *Step 2 (Reversal):* Objector admits they would accept quiet rules if they were the music player. Neighbor admits they would accept noise limits if they were sleeping. Both pass.
  *Step 3 (Audit):* Objector endures a world where everyone respects quiet hours. Neighbor endures a world where everyone can worship within limits. Both pass.
  *Result:* **Values Dispute — Hand to Board Vote.** The procedure confirms both sides hold valid principles. The board must vote on which principle takes precedence during specific hours.

  **b) No Children on Ground Floor**
  *Step 1:* Resident claims a fairness principle regarding maintenance costs. Claims universal binding force. Proceed.
  *Step 2 (Reversal):* Would the resident accept being denied a unit based on an immutable characteristic like age or family status? Answer: "No, that would be discriminatory."
  *Result:* **Bias Detected.** The procedure stops at Step 2. The claim fails the Reversal check because it treats children differently without relevant moral justification compared to other sources of wear. The objection is dismissed as prejudicial.

  **c) No Pets vs. Collective Cleanliness**
  *Step 1:* Long-standing resident claims a moral principle of hygiene applicable to all. Proceed.
  *Step 2 (Reversal):* Resident argues they would accept the ban even if they needed a pet for comfort. Passes loosely.
  *Step 3 (Audit):* If every resident adopted a strict "no pets" standard, would it be sustainable? Yes. However, the Audit asks if they endorse the *standard* universally. Upon probing, the resident admits they would make exceptions for service animals or existing leases.
  *Refined Step 3:* If the rule cannot be applied universally without arbitrary exceptions, it fails. The resident cannot justify why cleanliness mandates a total ban rather than cleaning standards.
  *Result:* **Bias Detected.** Despite the resident's history and emotion, the procedure flags this as a bias because the "principle" collapses under universal scrutiny—it is actually a preference for control disguised as hygiene. The board must reject the ban, though this outcome will be unpopular with long-term members.

  4. Limits and Honest Misfires

  This procedure is a sieve, not a microscope. Hidden biases can survive both checks if the user is skilled at self-deception, crafting exceptions that sound reasonable but protect their own status. The Regret Audit risks mislabeling legitimate minority cultural practices as biases if the "universal" standard implicitly assumes majority norms. For example, a minority practice might fail the Audit simply because it is unfamiliar, not because it is immoral.

  Furthermore, the Asymmetry of Reversal unfairly penalizes particular attachments. As you noted, caring more for one's own child fails reversal but is morally legitimate. The procedure attempts to catch this with the "Special Obligations" exception in Step 2, but determining what counts as "relevantly similar" remains a judgment call dressed up as a procedural rule. Finally, the tool cannot resolve conflicts where two valid principles collide; it only identifies them. It cannot tell you whether quiet is more important than worship. That requires human wisdom, not a checklist.

  5. Implementation Note

  Run this procedure at the start of every dispute adjudication meeting. The Board Chair should keep a minimal log recording the case ID, the final classification (Preference, Bias, or Values Dispute), and the time taken. If the board chooses to override the procedure's result—for example, ignoring a "Bias Detected" flag due to extenuating community context—the Chair must document the specific reason for the override in the meeting minutes. This ensures accountability without burdening the board with excessive paperwork.
