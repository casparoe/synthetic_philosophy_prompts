  The principle you are reaching for is **Expected Utility Maximization with State-Dependent Curvature.**

  Informally: **Maximize the expected value of a utility function, where the shape of that function changes based on whether the capital is reusable (investable) or consumable (one-shot), and whether there are external liabilities.**

  Your intuition is correct that "Maximize Expected Log Wealth" (Kelly) and "Maximize Growth Rate" are mathematically equivalent *only* under specific conditions (repeatable bets, reinvestment, no external constraints). Your verdicts reveal that you are implicitly switching utility functions based on the structure of the game.

  Here is the precise formulation of the principle that accommodates five of your six verdicts, the clause each case forces, and the one verdict you must abandon to remain consistent.

  ### The Principle: Constrained Ergodic Utility

  **Act to maximize $E[U(W_{final})]$, subject to the following definitions of $U(W)$:**

  1.  **The Growth Clause (Investable Capital):** If the capital is reusable and there are no fixed liabilities, $U(W) = \ln(W)$.
      *   *Forced by Cases 1, 2, and 3.*
      *   In Cases 1 and 2, this dictates the 20% Kelly stake. In Case 3, this dictates refusal because $E[\ln(W)] < 0$ (negative geometric growth), regardless of positive arithmetic expectation. This captures your "single path" insight: if the time-average growth rate is negative, the bet is toxic to your wealth trajectory.

  2.  **The Liability Clause (Goal-Based):** If there is a fixed liability $L$ where $U(W) = 0$ for $W < L$ and $U(W) = 1$ for $W \ge L$, minimize variance per flip to let the law of large numbers work in your favor.
      *   *Forced by Case 6.*
      *   Here, growth rate is irrelevant; survival relative to the threshold is all that matters. Tiny stakes minimize the probability of a ruinous drawdown before the target is hit.

  3.  **The Uncertainty Clause (Parameter Risk):** If the bet is one-shot and non-repeatable, but the probabilities are estimates, apply a discount factor to the optimal logarithmic stake (Fractional Kelly).
      *   *Forced by Case 5.*
      *   Pure Log Utility suggests 85%. Your 10% stake implies you do not trust the 90% probability estimate, or you treat the "loss of stake" as having higher disutility than Log implies due to the inability to recover. This is defensible as "Kelly with uncertainty."

  ### The Inconsistency: Case 4

  You must give up the verdict on **Case 4** (taking the single 50%/40% all-in bet).

  **Why:**
  Case 4 contradicts Case 3. In Case 3, you refuse the bet because the geometric mean is less than 1 ($\sqrt{1.5 \times 0.6} \approx 0.95$). You correctly identify that over time, this bet leads to zero.
