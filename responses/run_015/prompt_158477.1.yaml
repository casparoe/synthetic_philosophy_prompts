answer: |-
  # Invertebrate Welfare Impact Assessment (IWIA) – Quick-Review Protocol
  **Version:** 1.0 (Committee Draft)  
  **Time Allocation:** 20 Minutes per Proposal  
  **Required Personnel:** Lead Reviewer + Designated Welfare Officer (DWO) for sign-off on Nodes 3 & 5.

  ---

  ## Part 1: Applied Test Criteria (Pre-Work)
  *Before entering the flow, the Lead Reviewer scans the proposal text for answers to these seven questions. Do not consult external literature; use only proposal claims and general biological consensus.*

  ### A. Phylogenetic & Sentience Screening (For Node 2 & 3)
  1.  **Nervous Architecture:** Does the target organism possess a centralized nervous system (ganglia or brain) distinct from a diffuse nerve net?
      *   *Yes:* Proceed.
      *   *No:* Stop (Phylogenetic Boundary Condition met).
  2.  **Behavioral Proxies:** Does the proposal cite or imply the organism demonstrates: (a) trade-off decisions (e.g., feeding vs. safety), (b) learned avoidance of noxious stimuli, or (c) protective grooming of injured body parts?
      *   *2+ Yes:* Assign **High Credence** ($p(i) \geq$ Floor).
      *   *0-1 Yes:* Assign **Low Credence** ($p(i) <$ Floor).

  ### B. Harm Characterization (For Node 5)
  3.  **Directness:** Is the harm caused by direct physical contact or physiological intervention (e.g., crushing, neurotoxin injection) rather than environmental change (e.g., habitat loss)?
  4.  **Intentionality:** Is the harm the *mechanism of action* (e.g., killing the pest) or a *side effect* (e.g., bycatch)?
  5.  **Avoidability:** Does the proposal offer a technical alternative within the same system that achieves the agricultural goal without this specific harm, which was rejected for reasons *other* than cost or convenience?
      *   *If harm is intrinsic to the technology's function:* Mark **Structurally Unavoidable**.

  ---

  ## Part 2: The Decision Flow

  ### Node 1: Reversal Check (Human Safety Priority)
  **Question:** Does fully accounting for the invertebrate moral load $L$ in this proposal imply restricting human food security, safety, or economic viability disproportionately (e.g., banning a essential pest control with no alternative)?
  *   **Yes:** **HALT.** Flag for Human Ethics Review. Do not proceed.
  *   **No:** Proceed to Node 2.

  ### Node 2: Phylogenetic Boundary Condition
  **Question:** Based on Test Criterion A1, does the affected taxon lack an integrated nervous architecture (e.g., plants, fungi, bacteria, protozoa)?
  *   **Yes:** **STOP.** Welfare load $L = 0$. Proceed to standard scientific review.
  *   **No:** Proceed to Node 3.
  *   **Sign-off:** DWO must initial that the taxon qualifies for welfare consideration.

  ### Node 3: Sentience Credence Assignment ($p(i)$)
  **Question:** Based on Test Criterion A2, does the organism meet the Evidential Floor for sentience credence?
  *   **High Credence ($p(i) \geq$ Floor):** Proceed to Node 4 (Full Load Calculation).
  *   **Low Credence ($p(i) <$ Floor):** Proceed to Node 5 (Discontinuity Brake).
  *   **Sign-off:** DWO must sign off on the Credence Assignment. This is a value-laden parameter choice.

  ### Node 4: Full Load Calculation (High Credence Only)
  **Action:** Estimate $L = p(i) \cdot N \cdot s(i)$.
  *   *Rough Heuristic:* If $N > 10,000$ individuals per hectare AND $s(i)$ involves prolonged pain/distress, $L$ is **Critical**.
  *   **Decision:**
      *   If $L$ is **Critical**: **DEFERRAL.** Require mitigation plan or rejection.
      *   If $L$ is **Moderate/Low**: Proceed to Node 6.

  ### Node 5: The Discontinuity Brake (Low Credence Only)
  **Context:** Because $p(i)$ is below the floor, $L$ does *not* automatically dominate the decision.
  **Question:** Based on Test Criteria B3–B5, is the harm **Direct AND Intentional AND Avoidable**?
  *   **Yes (All 3):** The Brake is released. Treat as **Critical Load**. **DEFERRAL** or **REJECT**.
  *   **No (Any 1 is false, specifically "Avoidable"):** The Brake holds. $L$ does not dominate. Proceed to Node 6.
  *   **Sign-off:** DWO must sign off on the "Avoidability" determination.

  ### Node 6: Final Benefit-Cost Weighing
  **Question:** Do the agricultural innovation benefits (yield, sustainability, chemical reduction) outweigh the remaining welfare concerns (post-Brake or post-Calculation)?
  *   **Yes:** **FUND.**
  *   **No:** **REJECT.**
  *   **Uncertain:** **DEFER** for external stakeholder consultation.

  ---

  ## Part 3: Procedure Run-Through (Case Studies)

  ### Case (a): Targeted Neuropeptide Pesticide (Aphids & Pollinators)
  *   **Node 1 (Reversal):** No threat to human safety. **Pass.**
  *   **Node 2 (Phylogeny):** Insects have centralized nervous systems. **Pass.**
  *   **Node 3 (Credence):** Pollinators (bees) show robust learning and avoidance (Test A2). **High Credence.**
  *   **Node 4 (Load Calc):** $N$ is high (field scale). $s(i)$ is high (neurological disruption). $L$ is **Critical**.
  *   **Decision:** **DEFERRAL.**
  *   **Reasoning:** High credence sentience + high population + direct neurological harm requires mitigation (e.g., pollinator-safe timing) before funding.

  ### Case (b): Vertical-Farm Mechanical Separation (Crushing Aphids/Thrips)
  *   **Node 1 (Reversal):** No threat to human safety. **Pass.**
  *   **Node 2 (Phylogeny):** Insects. **Pass.**
  *   **Node 3 (Credence):** Small hemimetabolous insects. Behavioral proxies are weaker than bees. Committee sets **Low Credence** (Below Floor).
  *   **Node 5 (Discontinuity Brake):**
      *   Direct? Yes (Crushing).
      *   Intentional? No (Side effect of harvesting, not the goal).
      *   Avoidable? Structurally Unavoidable for *this* mechanical design (Test B5).
      *   **Result:** Brake Holds. $L$ does not dominate.
  *   **Node 6 (Weighing):** Benefit (zero chemical pesticide use) outweighs residual welfare concern.
  *   **Decision:** **FUND.**
  *   **Reasoning:** Harm is a structural side-effect, not intentional targeting, and credence is below the floor.

  ### Case (c): Parasitoid Wasp Release (Internal Parasitism of Host Larvae)
  *   **Node 1 (Reversal):** No threat to human safety. **Pass.**
  *   **Node 2 (Phylogeny):** Insects (Host larvae). **Pass.**
  *   **Node 3 (Credence):** Lepidopteran larvae. Evidence for sentience is mixed/weak compared to vertebrates. Committee assigns **Low Credence** (Below Floor).
  *   **Node 5 (Discontinuity Brake):**
      *   Direct? Yes.
      *   Intentional? Yes (Mechanism of control).
      *   Avoidable? **No.** The biological function *is* parasitism. To make it avoidable would require a different technology (e.g., sterile insect technique). Within the scope of *this* proposal, the harm is structurally intrinsic.
      *   **Result:** **Brake Holds.** (Because "Avoidable" is False).
  *   **Node 6 (Weighing):** Benefit (replacement of broad-spectrum chemical sprays) is high. Welfare load does not dominate due to Brake.
  *   **Decision:** **FUND.**
  *   **Specific Node Producing Result:** **Node 5 (Discontinuity Brake).**
  *   **Reasoning:** Although harm is severe and intentional, it is not *avoidable* within the proposed method, and the sentience credence is below the evidential floor. Therefore, the expected moral load $L$ is prevented from automatically vetoing the grant.

  ---

  ## Part 4: Limitations Statement

  **This procedure does not resolve the following:**

  1.  **The Evidential Floor:** The procedure does not prove where the "floor" for $p(i)$ objectively lies. It merely forces the committee to declare where they are drawing it for the sake of consistency. Disagreements about insect sentience are relocated to Node 3 sign-offs, not solved.
  2.  **The Phylogenetic Boundary:** The exclusion of organisms without integrated nervous systems (Node 2) is a value judgment, not a biological fact. This procedure accepts that boundary as a precondition for operation; it cannot argue for or against it.
  3.  **Moral Aggregation:** The "Reversal Check" (Node 1) prioritizes human welfare but does not quantify *how much* human benefit is required to override invertebrate load. This remains a political/ethical judgment call at Node 6.
  4.  **Uncertainty:** If the DWO is unsure about the "Avoidability" or "Credence" at Nodes 3 or 5, the procedure mandates a **Deferral**. It is designed to flag uncertainty, not mask it with false precision.

  **Committee Acknowledgement:**
  *By utilizing this flow, the committee acknowledges that "Low Credence" does not mean "No Sentience," but rather "Insufficient Evidence to Trigger High-Load Protections absent Intentional/Avoidable Harm."*

  **Designated Welfare Officer Initials:** _______________ **Date:** _______________
