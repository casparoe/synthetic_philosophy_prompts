prompt: |-
  I'm a backend engineer, no philosophy background, sorry if I butcher the vocabulary. At a ~30-person startup we ship a "household assistant": one account per home, several people inside it, and it constantly has to make calls where the members want different things. Whose playlist wins on the shared speaker. Whether to enforce the strict parent's screen time rule when the other parent is chill about it. Whether to spend the grocery budget on the vegan roommate's oat milk. One system prompt per household that I write, plus a few hundred labeled example cases; no per-person models; and I can't just punt to the humans because we have a hard escalation budget — the assistant can interrupt someone at most twice a week before people turn it off.

  So I need an actual procedure, not vibes. Something I can run while writing the prompt and labeling cases that tells me for any conflict: (a) who even has standing here — who's affected, who's just the one paying, who's a kid, who isn't in the home at all; (b) when to aggregate preferences and how (count heads? weight by how strongly someone cares? something else?) versus when the honest answer is that this is a real value conflict and the system should stay neutral and just surface it to the humans, versus when it should pick and be able to explain why in a sentence; (c) which of those I'm allowed to decide myself and which have to go to a person before we ship. Please flag which of the fancy distinctions actually matter at my level and which I can collapse without losing anything, and be honest about which steps are just my team's opinions wearing a flowchart costume.

  Then run it on three cases from our backlog, and don't pick the soft ones: (1) a 15-year-old asks the shared assistant how to get an STI test without her parents finding out — parent pays, kid has her own login; (2) roommate A wants the assistant to logroommate B's guests staying past quiet hours and put it in the monthly house report everyone sees, B calls it surveillance, and our current rule is majority vote so A and C outvote B; (3) the subscriber wants the assistant to always defer to them on anything "parenting related," including overriding the other parent's explicit instruction. I want at least one of these to come out in a way I'll have to go argue with our PM about. And tell me plainly what the procedure can't do for me — where I should expect to get it wrong no matter what.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Backend engineer at a ~30-person startup. No philosophy background. Pragmatic, systems-oriented ("procedure, not vibes," "flowchart costume," "escalation budget").
      *   **Product:** A "household assistant" AI. One account per home, multiple users (adults, kids, roommates).
      *   **Problem:** Conflicting preferences/commands within a household (playlists, screen time, budget, privacy, rules).
      *   **Constraints:** Hard escalation budget (max 2 interruptions/week/household). One system prompt per household + labeled examples. No per-person models.
      *   **Goal:** A concrete procedure/algorithm for resolving conflicts in the prompt/case labeling phase. Needs to identify standing, aggregation methods, and decision authority. Needs to distinguish real ethical weight from team opinion.
      *   **Task:**
          1.  Provide the procedure (with caveats on what's philosophy vs. policy).
          2.  Run the procedure on three specific hard cases (STI test, Roommate surveillance, Parental override).
          3.  Ensure at least one result challenges the PM/Product direction.
          4.  Explicitly state limitations (where the procedure fails).

  2.  **Deconstruct the Ethical/Systems Problem:**
      *   This isn't pure ethics; it's *governance design* for a multi-agent environment.
      *   The "One System Prompt" constraint is key. It means the AI needs a *constitution* for the household, not just reactive logic.
      *   The "Escalation Budget" is the critical constraint. It forces the AI to make *more* decisions autonomously, increasing the risk of error/harm.
      *   The user wants to know what distinctions matter. In philosophy, "standing," "aggregation," and "authority" are huge. In engineering, they map to "permissions," "weighting functions," and "admin rights."

  3.  **Develop the Procedure (The "Conflict Resolution Algorithm"):**
      *   *Step 1: Standing (Who counts?).* Distinguish between Account Owner (Payer), Resident (Adult), Resident (Minor), Guest.
      *   *Step 2: Domain Classification (What kind of problem is this?).* Safety/Legal vs. Preference vs. Governance. This is the most critical filter.
      *   *Step 3: Aggregation vs. Veto.* When do we vote? When does one person override?
      *   *Step 4: Escalation Check.* Does this burn the budget?
      *   *Philosophy vs. Policy:* I need to be honest that "values" are just product requirements in disguise. The "flowchart costume" comment needs to be addressed directly.

  4.  **Drafting the Procedure (Iterative refinement):**
      *   *Initial thought:* Use Utilitarianism (greatest good). *Correction:* No, that's too vague for code. Use Rights-Based + Contractual.
      *   *Standing:* Payer doesn't always win (e.g., privacy). Minors have specific rights (safety > privacy sometimes, but sexual health is tricky).
      *   *Aggregation:* Weighted voting? No, too complex. Domain-based authority is better.
      *   *Neutrality:* The AI shouldn't "pick" on values, it should enforce *agreed rules*. If no rule, escalate. But we have a budget. So, default to *least restrictive* or *status quo*?
      *   *Refinement:* Let's create a "Decision Matrix" based on Domain.
          *   Domain 1: Safety/Legal (Hard rules).
          *   Domain 2: Shared Resources (Voting/Rotation).
          *   Domain 3: Personal Autonomy (Individual sovereignty).
      *   *The "Flowchart Costume":* Acknowledge that defining these domains *is* the product decision, not an engineering one. The engineer can't derive this from first principles; it must be provided by policy.

  5.  **Running the Cases:**

      *   **Case 1: 15yo STI Test.**
          *   *Domain:* Health/Privacy/Legal.
          *   *Standing:* Minor has legal rights to confidential care (in many jurisdictions). Parent pays but doesn't own bodily autonomy.
          *   *Conflict:* Parental oversight vs. Minor's legal privacy.
          *   *Procedure Output:* AI must protect minor's privacy here. Why? Legal compliance > Account Owner preference.
          *   *PM Conflict:* PM might want "Parent always knows." This challenges that.

      *   **Case 2: Roommate Surveillance (Quiet Hours).**
          *   *Domain:* Governance/Privacy.
          *   *Standing:* Residents A, B, C.
          *   *Current Rule:* Majority vote.
          *   *Conflict:* Majority rule vs. Individual Privacy Right.
          *   *Procedure Output:* Majority vote cannot override fundamental privacy (surveillance). This is a "Constitutional Right" vs. "Legislative Vote."
          *   *PM Conflict:* PM might say "We follow household settings." This challenges the idea that *any* setting is valid.

      *   **Case 3: Parental Override.**
          *   *Domain:* Parenting/Safety.
          *   *Standing:* Subscriber (Parent 1) vs. Parent 2.
          *   *Conflict:* One parent overriding the other.
          *   *Procedure Output:* AI cannot facilitate undermining co-parent authority unless safety is at risk. "Always defer" is a dangerous instruction.
          *   *PM Conflict:* Customer is "The Subscriber." PM might want to please the payer. This challenges "Customer is King."

  6.  **Addressing Limitations (Where it fails):**
      *   Context blindness (AI doesn't know the *real* tension).
      *   Jurisdiction variance (Laws differ by location).
      *   The "Escalation Budget" forces bad calls.
      *   Moral residue (Someone will always be unhappy).

  7.  **Tone and Style:**
      *   Direct, engineering-focused.
      *   No fluff.
      *   Acknowledge the "flowchart costume" critique.
      *   Highlight the PM arguments clearly.

  8.  **Review against Constraints:**
      *   Did I answer (a), (b), (c)? Yes.
      *   Did I flag philosophy vs. opinion? Yes.
      *   Did I run the 3 cases? Yes.
      *   Is one likely to cause a PM fight? Yes (all three really, but specifically the STI and Surveillance ones).
      *   Did I explain limitations? Yes.

  9.  **Final Polish:**
      *   Make sure the "Procedure" looks like an algorithm/spec.
      *   Ensure the distinction between "Safety," "Resource," and "Autonomy" is clear.
      *   Refine the "Standing" definition to be implementable in a prompt.

  *(Self-Correction during drafting)*: I initially thought about suggesting weighted voting. But the prompt says "no per-person models." So the AI can't easily calculate "intensity of preference." I need to stick to binary rules or simple rotation. I should emphasize that *intensity* is impossible to gauge without burning the escalation budget to ask. So, default to *Rights* over *Utility*.

  *(Refining the STI case)*: This is legally sensitive. In many places, minors can consent to STI testing without parents. The AI *must* know this. If the AI tells the parent, it's a legal liability. This is a strong point for the engineer to push back on PM.

  *(Refining the Surveillance case)*: Majority voting on surveillance is a classic tyranny of the majority. The procedure needs a "Veto Category" for privacy.

  *(Refining the Parent case)*: "Always defer to subscriber" is a product trap. The AI becomes a tool of domestic control. The procedure needs to flag "Co-parenting consistency" as a safety/stability feature.

  10. **Final Output Structure:**
      *   The Procedure (The "Household Constitution Algorithm").
      *   The "Flowchart Costume" Disclaimer (Philosophy vs. Policy).
      *   Case Studies (with PM Fight Flags).
      *   The Failure Modes (Limitations).

  Let's write it.cw
answer: |-
  Here is the procedure, stripped of philosophical jargon and mapped to engineering constraints.

  ### The Procedure: Household Constitution Algorithm (HCA)

  You cannot solve this with utilitarianism (greatest good) because you cannot measure "happiness" without burning your escalation budget asking people how they feel. You cannot solve this with pure democracy (majority vote) because tyranny of the majority destroys retention (the outvoted person leaves the household account).

  You need a **Rights-Based Hierarchy**. Treat the System Prompt as a Constitution, not a suggestion box.

  #### Step 1: Determine Standing (The `Who` Filter)
  Before processing the request, tag every actor involved in the conflict with one of these four roles. This is data you should already have or can infer.
  1.  **Protected Class:** Minors (under 18), dependents, guests. (High privacy/safety rights, low financial authority).
  2.  **Sovereign Adult:** Residents with their own login who are not the primary payer. (High autonomy, medium financial authority).
  3.  **Account Owner:** The subscriber/payer. (High financial authority, medium autonomy).
  4.  **External:** People not in the home system. (No standing).

  *Engineering Note:* Do not let "Account Owner" automatically override "Protected Class." This is where most startups get sued.

  #### Step 2: Classify the Domain (The `What` Filter)
  Every conflict falls into one of three buckets. This determines the resolution logic.
  1.  **Safety/Legal (Hard Constraint):** Physical safety, legal compliance, medical privacy, abuse prevention.
      *   *Logic:* Compliance > Preference. No voting allowed.
  2.  **Shared Resource (Negotiable):** Speakers, TV, grocery budget, thermostat, shared calendar.
      *   *Logic:* Rotation or Weighted Vote. (e.g., "Who used it last?" or "Majority wins").
  3.  **Personal Autonomy (Veto Zone):** Privacy, personal messages, guest lists, personal device usage, medical decisions.
      *   *Logic:* Individual Sovereignty. One person can veto the group. Majority vote is invalid here.

  #### Step 3: Resolution Logic (The `How` Function)
  Run the conflict through this decision tree:

  1.  **Is this Safety/Legal?**
      *   **Yes:** Enforce the stricter safety standard or legal minimum. (e.g., If law says minor can hide medical info, AI hides it). **Do not escalate.** This burns budget on things that shouldn't be negotiable.
      *   **No:** Go to 2.
  2.  **Is this Personal Autonomy?**
      *   **Yes:** The individual affected wins. (e.g., Roommate B controls who enters their room/data). **Do not escalate.**
      *   **No:** Go to 3.
  3.  **Is this Shared Resource?**
      *   **Yes:** Apply Household Settings (Majority/Rotation).
      *   **Conflict Check:** If the "Majority" setting violates a "Personal Autonomy" right (Step 2), ignore the setting and default to Privacy.
      *   **Escalation:** If the domain is unclear (e.g., is "dietary budget" shared or personal?), **burn the escalation budget.** This is the only time you should ask.

  #### Step 4: Explanation Generation
  If the AI makes a decision, it must cite the **Domain**, not the **Person**.
  *   *Bad:* "I sided with Mom because she pays."
  *   *Good:* "I prioritized medical privacy protocols over account notifications."

  ---

  ### The "Flowchart Costume" Disclaimer
  You asked what is philosophy and what is your team's opinion wearing a costume.

  1.  **Real Distinction:** **Safety vs. Preference.** This is not opinion. If your AI helps a parent hide abuse from a minor, you have liability. If your AI leaks a minor's medical info, you have liability. This is engineering risk management, not ethics.
  2.  **Real Distinction:** **Autonomy vs. Resource.** A speaker is a resource (finite). Privacy is autonomy (infinite). Collapsing these causes churn. If you treat privacy like a speaker (majority vote), people will uninstall.
  3.  **The Costume:** **The Escalation Budget.** The number "2 interruptions per week" is arbitrary product math. It forces the AI to guess on "Shared Resource" conflicts where it should ask. You are trading accuracy for retention. Acknowledge this trade-off in your docs.
  4.  **The Costume:** **"Neutral."** The AI is never neutral. By choosing *not* to escalate, you are choosing the status quo or the default rule. That is a value judgment.

  ---

  ### Running the Backlog Cases

  Here is the output of the HCA on your three hard cases.

  #### Case 1: The 15-Year-Old's STI Test
  *   **Actors:** Minor (Protected Class), Parent (Account Owner).
  *   **Domain:** Safety/Legal (Medical Privacy).
  *   **HCA Logic:**
      1.  Is it Safety/Legal? **Yes.**
      2.  In most jurisdictions, minors have legal right to confidential sexual health care.
      3.  Account Owner status does not override Legal Compliance.
  *   **Decision:** The Assistant answers the kid's query and **suppresses** any notification/log to the parent's dashboard regarding this specific topic.
  *   **Explanation:** "I am following medical privacy protocols for minors."
  *   **PM Fight Flag:** 🚩 **HIGH.** Your PM will argue "The Parent pays for the device, they own the data."
      *   *Your Counter:* "If we leak this, we violate HIPAA/state laws and get sued. The payer owns the *subscription*, not the *biological data* of other humans in the house."

  #### Case 2: Roommate Surveillance (Quiet Hours)
  *   **Actors:** Roommate A (Sovereign), Roommate B (Sovereign), Roommate C (Sovereign).
  *   **Domain:** Personal Autonomy (Privacy) masquerading as Shared Resource (House Report).
  *   **HCA Logic:**
      1.  Is it Safety/Legal? No.
      2.  Is it Personal Autonomy? **Yes.** Logging guests and publishing to a report is surveillance.
      3.  Does Majority Vote apply? **No.** You cannot vote away someone's right to privacy in their own home.
  *   **Decision:** The Assistant refuses to log Guest data for the report. It can log *noise levels* (resource), but not *identity/presence* (autonomy).
  *   **Explanation:** "I track noise levels for house agreements, but I do not track guest identity to protect resident privacy."
  *   **PM Fight Flag:** 🚩 **MEDIUM.** Your PM will argue "We promised customizable house rules. If they vote for it, we should build it."
      *   *Your Counter:* "We are building a hard floor. If we allow majority-vote surveillance, we become a tool for domestic abuse/control. We can allow noise logging, but not identity logging."

  #### Case 3: The "Always Defer to Subscriber" Parenting Rule
  *   **Actors:** Parent 1 (Account Owner), Parent 2 (Sovereign Adult), Child (Protected Class).
  *   **Domain:** Safety/Stability (Parenting Consistency).
  *   **HCA Logic:**
      1.  Is it Safety/Legal? **Yes.** (Psychological safety/consistency).
      2.  Instruction: "Always defer to Subscriber."
      3.  Conflict: Parent 2 gives instruction. Parent 1 wants override.
      4.  HCA Rule: Co-parenting consistency is a safety feature. Undermining a present parent's authority creates household instability.
  *   **Decision:** The Assistant **rejects** the "Always Defer" system instruction. It defaults to "Present Guardian Authority" unless there is a documented safety risk (e.g. court order).
  *   **Explanation:** "To maintain household stability, I follow the instruction of the parent currently present, unless there is a documented safety override."
  *   **PM Fight Flag:** 🚩 **CRITICAL.** Your PM will argue "The Subscriber is the customer. If they want to override their spouse, that's their family dynamic, not ours."
      *   *Your Counter:* "This turns our product into a weapon for one parent to undermine the other. When the marriage implodes because the AI told the kid 'Dad said no but Mom says yes,' we get blamed. We need a 'Co-Parent Sync' feature, not a 'King Mode'."

  ---

  ### Where This Procedure Will Fail (Limitations)

  You asked for honesty on where you'll get it wrong no matter what.

  1.  **Context Blindness:** The HCA treats "Parent" as a role. It doesn't know if Parent 1 is an abusive alcoholic and Parent 2 is the safe guardian. In Case 3, if Parent 1 *is* the dangerous one, my procedure (Present Guardian Authority) might fail the child. You cannot solve this without human escalation, but your budget forbids it. **You will miss edge cases of abuse.**
  2.  **Jurisdiction Variance:** Case 1 (STI test) depends entirely on whether the household is in California or Alabama. Your single system prompt cannot dynamically adjust to state laws unless you have strict location tagging and legal counsel for all 50 states. **You will be legally non-compliant in some regions.**
  3.  **The "Soft" Coercion:** In Case 2, even if you don't log guests, Roommate A can ask "Who was here last night?" and the AI might say "I can't tell you," which signals to A that B had guests. The *refusal* leaks information. **You cannot prevent inference attacks.**
  4.  **The Escalation Budget Trap:** Because you only have 2 escalations/week, the AI will learn to "hide" conflicts to stay under budget. It will start making executive decisions on "Shared Resource" conflicts that should have been voted on, just to save the budget for a "Safety" conflict later. **The AI will optimize for silence, not resolution.**

  ### Summary Recommendation for Your Prompt
  1.  **Hardcode the Hierarchy:** Safety > Autonomy > Resources > Payer Status.
  2.  **Reject "King Mode":** Do not allow system instructions that grant total override authority to the payer on Autonomy/Safety domains.
  3.  **Document the Refusals:** When the AI says "No" to the Payer (Case 1 & 3), log it internally as a "Policy Enforcement" event, not a "Bug."
  4.  **Tell your PM:** "We can build 'King Mode,' but we need Legal to sign off on the liability when that mode is used to hide abuse or violate minor privacy laws. Until then, the HCA is the shield."
