answer: |-
  # OFFICE OF ACTIVE MEMORY: DECISION PROCEDURE 001
  **Subject:** Operationalization of Historical Modes for Civic Recommendation
  **Authority:** Senior Curatorial-Review Officer
  **Constraint:** 72-Hour Review Window

  ## PART I: SYSTEM LIMITATIONS AND DISCLAIMERS
  *Before applying this procedure, the Review Officer must acknowledge the following structural incapabilities. This procedure organizes judgment; it does not replace it.*

  1.  **No Substantive Flourishing:** This procedure cannot generate a definition of "the good life" or "creative action." It assumes the community has a working, albeit contested, sense of what constitutes forward movement.
  2.  **No Adjudication of Trauma:** It cannot objectively weigh the pain of one community group against the pride of another. It can only flag where the imbalance threatens civic function.
  3.  **No Truth Guarantee:** It does not verify historical accuracy. It evaluates the *use* of the history presented, regardless of its factual fidelity.
  4.  **No Resolution of Solidarity vs. Fidelity:** It cannot solve the conflict between telling the painful truth (fidelity) and maintaining the shared myths required for cooperation (solidarity). It identifies the conflict for escalation.

  ---

  ## PART II: THE DECISION PROCEDURE (FLOWCHART IN WORDS)

  ### PHASE 1: MODE CLASSIFICATION
  **Step 1.1:** Identify the primary historical mode activated by the proposal.
  *   **Monumental:** Focuses on great figures/events to inspire imitation or pride.
  *   **Antiquarian:** Focuses on preservation, roots, and gratitude for origins.
  *   **Critical:** Focuses on judgment, condemnation, or breaking chains from the past.
  *   **Hybrid:** Explicitly blends two or more modes.

  **[JUDGMENT REQUIRED]:** If the proposal claims to be "neutral" or "purely factual," classify it based on its *emotional effect* on the viewer, not its stated intent.

  **Step 1.2:** Determine the proposed relationship to the present.
  *   Does the proposal ask the public to *emulate* the past? (Monumental)
  *   Does it ask the public to *reverence* the past? (Antiquarian)
  *   Does it ask the public to *judge and break* from the past? (Critical)

  **STOP-POINT:** If the mode cannot be identified even after staff consultation, **ESCALATE** to Citizen-Values Panel. (Indicates a category error or deceptive framing).

  ### PHASE 2: THE LIFE-SERVICE CHECK
  **Step 2.1:** Ask: "What specific present capacity for action does this proposal stimulate?"
  *   *Valid Answers:* Increased civic participation, clarified ethical direction, renewed energy for public projects, strengthened community bonds.
  *   *Invalid Answers:* "Knowing the truth," "Honoring the dead," "Completing the record." (These are backward-looking, not life-serving).

  **[JUDGMENT REQUIRED]:** Staff must articulate the link between the historical content and a specific future action. If the link is vague ("it makes us better"), note this as a risk factor.

  **Step 2.2:** Ask: "Does this proposal paralyze, ossify, or breed resentment?"
  *   If **Yes**: Proceed immediately to **Phase 3 (Dominance Check)**.
  *   If **No**: Proceed to **Phase 4 (Civic Cohesion Check)**.

  ### PHASE 3: THE DOMINANCE CHECK (PATHOLOGY SCAN)
  *Apply the specific pathology test corresponding to the Mode identified in Phase 1.*

  **3.A Monumental Pathology:**
  *   **Test:** Does the presentation encourage "narcotic imitation"? (i.e., admiring the power/success while ignoring the context or cost).
  *   **Warning:** If the proposal sanitizes the means of achievement to highlight the end result, it is pathological.
  *   **Action:** If Pathological, **REJECT** or **APPROVE WITH CONDITIONS** (mandatory contextualization).

  **3.B Antiquarian Pathology:**
  *   **Test:** Does the proposal create "mnemonic saturation"? (i.e., preserving everything prevents prioritizing anything).
  *   **Warning:** If the volume of data/objects overwhelms the capacity to interpret them, it is pathological.
  *   **Action:** If Pathological, **APPROVE WITH CONDITIONS** (curatorial selection required) or **REJECT** (if resources are diverted from living needs).

  **3.C Critical Pathology:**
  *   **Test:** Does the proposal perform "destructive negation without reconstruction"? (i.e., condemning the past without offering a path forward).
  *   **Warning:** If the exhibit/proposal leaves the audience with guilt or nihilism but no agency, it is pathological.
  *   **Action:** If Pathological, **APPROVE WITH CONDITIONS** (must include forward-looking component) or **ESCALATE**.

  **[JUDGMENT REQUIRED]:** Distinguishing between "necessary pain" and "paralyzing nihilism" is a value judgment, not a technical one. Staff must record the rationale.

  ### PHASE 4: THE CIVIC COHESION CHECK (CRITICAL HISTORY ONLY)
  *This phase applies primarily to Critical Mode or Hybrids involving Critical elements.*

  **Step 4.1:** Ask: "Does this critical judgment undermine a shared narrative required for current civic cooperation?"
  *   *Example:* A founding myth that, while historically imperfect, binds diverse groups together for current infrastructure projects.

  **Step 4.2:** Assess the risk of fragmentation.
  *   **Low Risk:** The critique targets a closed chapter with no bearing on current legal/social contracts.
  *   **High Risk:** The critique targets the foundational legitimacy of current institutions or shared identity.

  **[JUDGMENT REQUIRED]:** This is the highest-risk judgment node. It requires weighing "Truth" against "Social Utility." Staff disagreement here is expected and signals a need for escalation.

  **Step 4.3:** Determination.
  *   If **High Risk** AND Staff Disagreement exists: **ESCALATE** to Citizen-Values Panel.
  *   If **High Risk** AND Staff Consensus exists: **APPROVE WITH CONDITIONS** (framing must emphasize reconstruction of identity, not just destruction).
  *   If **Low Risk**: Proceed to Final Determination.

  ### PHASE 5: FINAL DETERMINATION
  *   **APPROVE:** Mode is clear, Life-Service is active, No Pathology detected.
  *   **APPROVE WITH CONDITIONS:** Life-Service is active, but Pathology risk exists (requires framing, context, or curation).
  *   **REJECT:** Pathology is dominant; proposal harms present capacity for action.
  *   **ESCALATE:** Irreducible value conflict exists (e.g., Truth vs. Solidarity); Office lacks mandate to decide.

  ---

  ## PART III: SYSTEM WARNINGS (HARD CASES & MISFIRES)
  *The Review Officer must check these warnings before signing any recommendation.*

  1.  **The Unstable Hybrid:** If a proposal deliberately blends all three modes in unstable ratios (e.g., a monument that critiques itself), the Dominance Check may fail to catch the contradiction. **Action:** Treat as Escalation.
  2.  **The Digital Antiquarian Trap:** Digitization projects often claim "access" (Life-Service) but create "hoarding" (Antiquarian Pathology) at a monumental scale. **Action:** Apply 3.B rigorously; assume saturation risk is high.
  3.  **The Smuggled Theory of Flourishing:** If staff disagree on "present creative action" (e.g., is "action" economic growth or social justice?), the framework is smuggling in an unstated political theory. **Action:** Flag this disagreement in the written recommendation; do not mask it as technical consensus.

  ---

  ## PART IV: WORKED CASE APPLICATIONS

  ### CASE A: The Industrialist Statue
  **Proposal:** Bronze statue of a 19th-century industrialist. Cited for technological innovation. Documented history of suppressing labor organizing via private security.
  **Requester Expectation:** Approve with a critical plaque.

  **Application of Procedure:**
  1.  **Phase 1 (Classification):** Primary Mode is **Monumental**. (Focus on great figure/inspiration).
  2.  **Phase 2 (Life-Service):** Claimed service is "inspiring innovation."
      *   *[Judgment Flag]:* Staff must decide if "innovation" is the relevant civic capacity, or if "labor cooperation" is more vital to the present.
  3.  **Phase 3 (Dominance Check - Monumental):**
      *   **Test:** Does this encourage "narcotic imitation"?
      *   **Finding:** Yes. A bronze statue inherently elevates the subject above context. A "critical plaque" is often visually subordinate to the monument. The visual language (bronze, pedestal) contradicts the textual language (plaque). The monumental effect risks validating the *power* used to suppress, not just the *innovation* achieved.
  4.  **Phase 4 (Civic Cohesion):** Not primary, but relevant. Validating a labor suppressor may reduce capacity for current labor/management cooperation.
  5.  **Phase 5 (Determination):**
      *   **Recommendation:** **APPROVE WITH HEAVY CONDITIONS** or **REJECT**.
      *   **Rationale:** The procedure flags the "narcotic imitation" risk. A plaque is insufficient to counter the monumental dominance.
      *   **Condition:** The visual hierarchy must be equalized (e.g., the statue cannot stand alone; it must be part of a larger installation depicting the workers). If the artist/requester refuses to alter the visual dominance, the recommendation shifts to **REJECT** because the Monumental Pathology (idolatry of power) overrides the Life-Service (innovation).

  ### CASE B: Total Municipal Digitization (1970–2020)
  **Proposal:** Digitize and permanently preserve *every* municipal record from 1970 to 2020. Justification: "Complete antiquarian fidelity."
  **Requester Expectation:** Straightforward Approval.

  **Application of Procedure:**
  1.  **Phase 1 (Classification):** Primary Mode is **Antiquarian**. (Focus on preservation/roots).
  2.  **Phase 2 (Life-Service):** Claimed service is "complete access."
      *   *[Judgment Flag]:* Staff must determine if "access to everything" equals "capacity to act."
  3.  **Phase 3 (Dominance Check - Antiquarian):**
      *   **Test:** Does this create "mnemonic saturation"?
      *   **Finding:** Yes. "Every record" includes trivial data (e.g., maintenance logs, minor permits). This overwhelms the user. It privileges the *existence* of the record over the *use* of the record. It ossifies the past by refusing to let the unimportant fade.
  4.  **Phase 4 (Civic Cohesion):** Not applicable.
  5.  **Phase 5 (Determination):**
      *   **Recommendation:** **APPROVE WITH CONDITIONS**.
      *   **Rationale:** The Dominance Check detects pathological excess. "Complete fidelity" is an antiquarian vice that paralyzes present action (researchers cannot find signal in the noise).
      *   **Condition:** Approval is contingent on a curatorial selection protocol. 10% of records must be flagged as "High Value" for public interface; the rest remain in deep storage. This subordinates the Antiquarian impulse to the Life-Service need (usability).
      *   **Escalation Trigger:** If the City Clerk argues that "all records are equally sacred," **ESCALATE**. This indicates a value conflict (Sacredness of Data vs. Utility of Data) the Office cannot resolve.

  ### CASE C: Indigenous Dispossession Exhibit
  **Proposal:** Museum exhibit documenting the city's founding through the dispossession of an indigenous community.
  **Requester Instinct:** Approve (Truth-telling).
  **Procedure Application:** Rigorous check for "Life-Denying" risk.

  **Application of Procedure:**
  1.  **Phase 1 (Classification):** Primary Mode is **Critical**. (Focus on judgment/condemnation of past).
  2.  **Phase 2 (Life-Service):** Claimed service is "Justice" and "Truth."
      *   *[Judgment Flag]:* Staff must define if "Truth" serves "Life." Sometimes truth paralyzes.
  3.  **Phase 3 (Dominance Check - Critical):**
      *   **Test:** Does this perform "destructive negation without reconstruction"?
      *   **Finding:** Potential Risk. If the exhibit ends at "The city was built on theft," it leaves the current citizenry with illegitimacy. If they feel the city *cannot* be rightfully inhabited, they may withdraw from civic cooperation.
  4.  **Phase 4 (Civic Cohesion Check):**
      *   **Step 4.1:** Does this undermine a shared narrative required for current cooperation?
      *   **Finding:** **YES.** The "Shared Narrative" is that the city is a legitimate home for all current residents. The exhibit challenges the legitimacy of the land tenure for all non-indigenous residents.
      *   **Step 4.2:** Assess Risk of Fragmentation.
      *   **Finding:** **HIGH.** If residents feel their presence is fundamentally illegitimate, they may disengage from schools, zoning, and tax initiatives.
      *   *[Judgment Flag]:* This is the critical node. Is it better to have a guilty citizenry that acts, or an honest citizenry that paralyzes? The procedure cannot answer this.
  5.  **Phase 5 (Determination):**
      *   **Recommendation:** **ESCALATE TO CITIZEN-VALUES PANEL**.
      *   **Rationale:** The procedure classifies this as **Potentially Life-Denying** under Nietzsche's specific warning: Critical history that destroys the "horizon" of the living prevents future creation.
      *   **Why not Reject?** The Critical mode is necessary for health; suppressing it is also pathological (Antiquarian ossification).
      *   **Why not Approve?** The risk to Civic Cohesion (Phase 4) is too high for the Office to authorize unilaterally.
      *   **Mandatory Escalation:** Because staff judgment on "Truth vs. Solidarity" is irreducible. The Office of Active Memory manages memory *for* the city; it cannot decide the *terms of the city's existence*.
      *   **Condition for Panel:** The Panel must decide if the exhibit includes a "Reconstruction" component (e.g., land return initiatives, shared governance models) that converts the Critical negation into a new Monumental action. Without that, the Exhibit remains pathological.

  ---

  **OFFICER'S NOTE ON CASE C:**
  *You may legitimately overrule the "Life-Denying" classification if you determine that the "Shared Narrative" being protected is itself a lie that prevents necessary growth (e.g., a peace based on silence). However, under this procedure, that determination is outside the Office's technical mandate. You must escalate. To approve unilaterally is to disguise a value judgment (Truth > Stability) as a technical finding.*
