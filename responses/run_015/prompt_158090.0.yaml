prompt: |-
  Ok so I need someone to settle an argument I had with my friend last night that went on way too long. Background on me so you know what vocabulary to use: I'm not a philosopher, I do applied probabilistic modeling — my working life is priors, likelihoods, marginal likelihoods and Bayes factors, model selection criteria, MAP vs. full posterior, posterior predictive checks, and lately a fair amount of simulation-based / likelihood-free inference when the likelihood is too ugly to write down. My friend does philosophy of science and insisted that inference to the best explanation is not just Bayesian updating, and that when it looks like it is, that's only because I've quietly smuggled explanatory virtues into my prior.

  So: restate the main positions in the IBE debate as faithfully as you can in my vocabulary — prior, likelihood, hypothesis space, model evidence, scores over model classes, and simulation-based inference as the closest analogue for cases where there's no tractable likelihood at all. Do it seriously for the standard moves: that IBE picks the loveliest explanation rather than the most probable one, that explanation is contrastive (why this rather than that), that IBE is supposed to be how you generate a hypothesis you didn't already have on the table rather than only re-weight ones you did, and the objection that IBE just re-describes whatever your priors already favored. My friend also invented a thing he called "prospective coverage" — how much of the data a hypothesis would have let you predict in advance, before you saw it — and claimed that's irreducibly abductive and can't be written as a likelihood; see whether that's really true or whether it's just something like a prequential or posterior-predictive score wearing a different hat.

  Then the part I actually care about, the residue report: what translated cleanly, what only fit once you fudged it (be explicit where you'd be sneaking in my framework's assumptions and calling it translation), and what can't be said in my vocabulary at all. In particular — is "explanatory loveliness" anything more than a prior over hypotheses, and is there any residue left when I literally cannot enumerate the hypothesis space in advance? And give me a verdict on the leftovers: does the residue show that my toolkit is missing something, or that the IBE side is less clear than it thinks? Dont just tell me the whole debate is secretly about priors unless you can show me where that claim bottoms out.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Applied probabilistic modeler (Bayesian workflow expert). Knows priors, likelihoods, marginals, Bayes factors, MAP, posteriors, PPCs, simulation-based inference (SBI/ABC).
      *   **Friend's Profile:** Philosophy of science. Argues Inference to the Best Explanation (IBE) $\neq$ Bayesianism. Claims explanatory virtues are distinct from priors. Claims "prospective coverage" is irreducibly abductive.
      *   **Task:**
          1.  Restate the IBE debate in the user's probabilistic vocabulary (priors, likelihoods, model evidence, etc.).
          2.  Address specific IBE moves: Loveliness vs. Likelihood, Contrastivity, Hypothesis Generation, The "Smuggling Priors" Objection.
          3.  Analyze the friend's concept of "Prospective Coverage" (is it prequential/PPC?).
          4.  **Crucial:** Provide a "Residue Report" (what translates, what requires fudging, what doesn't translate).
          5.  **Verdict:** Does the residue mean the Bayesian toolkit is missing something, or is IBE vague? Avoid trivial "it's all priors" dismissals unless justified.

  2.  **Deconstruct the IBE vs. Bayesianism Debate:**
      *   *Standard Bayesian View (Van Fraassen, Okasha, etc.):* IBE is either incompatible with Bayesianism (because it adds a non-probabilistic rule) or it *is* Bayesianism (where "explanatory virtue" is just a heuristic for setting priors or likelihoods).
      *   *Standard IBE View (Lipton, etc.):* IBE guides belief *and* discovery. "Loveliness" (explanatory power) tracks "likeliness" (probability) but isn't identical. It handles contrastive questions ("Why P rather than Q?"). It helps generate *new* hypotheses.
      *   *The "Smuggling" Charge:* Bayesians say IBE virtues (simplicity, scope, unification) are just prior boosters. IBE proponents say no, they affect how we weigh evidence *after* seeing data, or they operate where probabilities are undefined.

  3.  **Translate IBE Concepts into Probabilistic Vocabulary:**

      *   *Hypothesis Space ($\Theta$ or $\mathcal{M}$):* In Bayes, this is fixed (or implicitly fixed). In IBE, this is dynamic (generation).
      *   *Prior ($P(H)$):* IBE virtues (simplicity, unification) usually map here.
      *   *Likelihood ($P(D|H)$):* IBE claims "explanatory power" isn't just fit. But in Bayes, fit is likelihood.
      *   *Model Evidence ($P(D)$):* Marginal likelihood. Used for model selection.
      *   *Contrastivity:* Bayesian model comparison (Bayes Factors) is inherently contrastive ($H_1$ vs. $H_2$).
      *   *Loveliness:* This is the tricky one. Is it a prior penalty? A likelihood boost? A separate utility function?
      *   *Prospective Coverage:* Friend's term. Sounds like prequential probability or posterior predictive performance on *unseen* data.

  4.  **Drafting the Translation (Section by Section):**

      *   *Loveliness vs. Probability:* Map "Loveliness" to a scoring rule that isn't just log-probability. Maybe a regularized loss? Or a prior that penalizes complexity (Occam's razor).
      *   *Contrastivity:* Map to Bayes Factors ($K = P(D|H_1)/P(D|H_2)$). IBE says "Why this?" Bayes says "Ratio of evidences."
      *   *Hypothesis Generation:* This is the "search problem." Bayes assumes $\mathcal{M}$ is given. IBE says we *find* $\mathcal{M}$. This links to Approximate Bayesian Computation (ABC) or Simulation-Based Inference (SBI) where the simulator *is* the hypothesis generator.
      *   *Smuggling Priors:* If "virtue" increases $P(H)$, it's a prior. If it increases $P(D|H)$, it's a likelihood. If it's neither, it's a decision-theoretic utility.
      *   *Prospective Coverage:* Define mathematically. $E_{new} [ \log P(D_{new} | H, D_{old}) ]$. This is exactly the Prequential Principle or ELBO/WAIC/LOO-CV territory.

  5.  **Developing the Residue Report (The Core Value):**
      *   *Clean Translation:* Contrastivity (Bayes Factors), Simplicity (Prior penalties/MDL), Prospective Coverage (LOO-CV/PPC).
      *   *Fudged Translation:* "Loveliness." If it's not probability, what is it? If we force it into a prior, we assume the virtue is static. If we force it into likelihood, we assume it's about fit.
      *   *The Hard Residue (Non-Translation):*
          1.  **Open Hypothesis Space:** Bayesianism requires a $\sigma$-algebra. IBE operates when we don't know the options. This is the "Problem of Unconceived Alternatives" (Stanford).
          2.  **Understanding/Mechanism:** Bayes gives degrees of belief. IBE claims to give *understanding*. A high posterior doesn't mean you know *how* it works (black box vs. mechanistic).
          3.  **The "Leap":** IBE justifies *accepting* a theory (truth), not just betting on it. Bayes is agnostic about truth, only coherence.

  6.  **Addressing the "Prospective Coverage" Claim:**
      *   Friend says it's irreducibly abductive.
      *   My analysis: It's prequential. $P(D_{future} | D_{past})$.
      *   Verdict: Friend is wrong that it *can't* be written as a likelihood/score. But they might be right that it's the *goal* rather than the *input*.

  7.  **Formulating the Verdict:**
      *   Is the toolkit missing something? Yes, the *search* over model space (generative phase).
      *   Is IBE less clear? Yes, "Loveliness" is ill-defined without probability.
      *   Bottom line: Bayes handles *evaluation* perfectly. IBE handles *discovery* and *model expansion*. The friction is at the boundary of $\mathcal{M}$.

  8.  **Refining Tone:**
      *   Keep it technical but accessible to a practitioner.
      *   Use the user's jargon (marginal likelihoods, PPC, SBI).
      *   Avoid philosophical fluff; stick to structural analogies.
      *   Be decisive in the Residue Report.

  9.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "smuggling priors" objection seriously? *Adjustment:* Make sure to distinguish between encoding virtues in the prior vs. using them to modify the update rule (which violates Bayes).
      *   *Check:* Did I handle the "open hypothesis space"? *Adjustment:* This is the strongest point for IBE. Standard Bayes assumes "closed world." IBE acknowledges "unknown unknowns." Connect this to Model Expansion or SBI where the simulator structure is mutable.
      *   *Check:* Friend's "Prospective Coverage." *Adjustment:* Ensure I explicitly link this to Prequential Probability (Dawid) and Cross-Validation.

  10. **Final Polish:** Structure clearly with headings. Ensure the "Residue Report" is distinct. (Proceed to generate output based on this thought process).

  *(Self-Correction on "Prospective Coverage"):* I need to be careful. If the friend means "how much data *could* have been predicted," that sounds like integrated likelihood over potential data spaces. But if they mean "predictive accuracy on held-out data," that's standard predictive performance. I will interpret it as the latter but acknowledge the former (scope).

  *(Final thought on the Verdict):* The verdict shouldn't be "Bayes wins." It should be "Bayes wins on evaluation, IBE wins on formulation." The residue is the *process of model construction*, which Bayes treats as exogenous.

