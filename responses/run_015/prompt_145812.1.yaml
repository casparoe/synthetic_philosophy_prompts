  2.  **Deconstruct the Content:**
      *   **Problem of Old Evidence:** Known evidence ($E$) has $P(E) \approx 1$. Standard conditioning $P(H|E) = P(H \cap E) / P(E)$ yields little to no update if $P(E)$ is already 1. How can $E$ confirm $H$?
      *   **Logical-Entailment Resolution:** Focuses on the logical relationship between $H$ and $E$. If $H$ entails $E$, and we realize this logical connection *now*, our uncertainty shifts from $E$ to the logical implication $H \rightarrow E$. Updating happens on the logical certainty, not the empirical probability of $E$.
      *   **Counterfactual-Conditionalization Resolution:** Focuses on what the probability of $E$ *would have been* had we not known it. We bracket the knowledge of $E$, assign a counterfactual prior $P^*(E) < 1$, and update using that.
      *   **AI Agent Context:** Pre-trained on $E$ (so $P(E) \approx 1$ in its weights). Now presented with new $H$.
      *   **Evaluation:** For an AI, "bracketing" knowledge (counterfactual) is computationally awkward and arguably dishonest to its actual state. Recognizing logical structure (entailment) aligns better with processing new connections between existing data and new hypotheses without pretending ignorance.

