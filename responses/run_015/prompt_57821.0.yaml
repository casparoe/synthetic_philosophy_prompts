answer: |-
  The logical space of resolutions supports four stable positions, differentiated by their stance on symmetry, prior necessity, and the role of infinite expectation.

  ### Decision Tree for the Two-Envelope Paradox

  **Node 1:** Does the physical symmetry of the setup block the conditional reasoning used to justify switching?
  *   **Yes:** → **Leaf A: Switching is Practically Indifferent**
  *   **No:** → Go to Node 2.

  **Node 2:** Is a prior distribution over initial amounts required for the expected value of switching to be defined?
  *   **No:** → **Leaf B: Miscomputed Conditional Expectation**
  *   **Yes:** → Go to Node 3.

  **Node 3:** Does the paradox depend on allowing unbounded values yielding infinite expectation (or ignoring fees that would negate infinite gain)?
  *   **Yes:** → **Leaf C: Improper Prior/Infinite Expectation**
  *   **No:** → **Leaf D: Underspecified Without a Prior**

  ---

  ### Position Mapping and Reasoning

  **Leaf A: Switching is Practically Indifferent**
  *   **Path:** Symmetry = Yes.
  *   **Reasoning:** This stance (e.g., Arntzenius) argues that because the envelopes are indistinguishable ex-ante, no calculation can justify preferring one over the other. The naive calculation is dismissed as irrelevant because the symmetry constraint overrides conditional expected utility maximization in this specific symmetric context.
  *   **Variant Test:**
      *   *Coin Flip:* Fails. If the organizer flips a coin to double/halve *after* your choice, symmetry is broken; this view cannot explain why switching might become rational here.
      *   *Fee:* Switching is irrational (fee reduces utility for no gain).
      *   *Unknown Cap:* Indifference holds.

  **Leaf B: Miscomputed Conditional Expectation**
  *   **Path:** Symmetry = No, Prior Required = No.
  *   **Reasoning:** This stance (e.g., Falk, Bar-Hillel) locates the error in the algebraic treatment of the variable $y$. It argues that treating $y$ as a fixed constant while assuming equal probability for $2y$ and $y/2$ is a logical fallacy (variable misuse) independent of probabilistic specifications. The expectation is not undefined due to missing priors, but due to invalid logic.
  *   **Variant Test:**
      *   *Coin Flip:* The calculation changes because the mechanism is known; the logical error is avoided if the conditional probabilities are derived from the mechanism.
      *   *Fee:* The calculation error remains; adding a fee doesn't fix the logic.
      *   *Unknown Cap:* The logical error persists regardless of the cap.
  *   **Separation Flag:** This leaf is difficult to separate empirically from Leaf D in practice, as both advise against switching based on the problem statement alone, but they differ on *why* (logic vs. missing info).

  **Leaf C: Improper Prior/Infinite Expectation**
  *   **Path:** Symmetry = No, Prior Required = Yes, Unbounded/Infinite = Yes.
  *   **Reasoning:** This stance (e.g., Broome, Chalmers) accepts the Bayesian framework but argues the paradox only holds if the prior distribution is improper (uniform over positive reals), leading to infinite expected value. If expectation is infinite, standard decision theory breaks down, and switching may be permissible or undefined.
  *   **Variant Test:**
      *   *Coin Flip:* If the mechanism allows unbounded growth, infinite expectation may still justify switching despite asymmetry.
      *   *Fee:* If expectation is infinite, a finite fee does not change the rational choice (Infinity - Fee = Infinity).
      *   *Unknown Cap:* If a cap exists (even unknown), expectation is finite; this view collapses into Leaf D.

  **Leaf D: Underspecified Without a Prior**
  *   **Path:** Symmetry = No, Prior Required = Yes, Unbounded/Infinite = No.
  *   **Reasoning:** This stance (e.g., McGrew, Castel) argues the problem is ill-posed. With a proper prior (finite expectation), the naive calculation fails for some values. Without a specified prior, no rational choice can be computed. The paradox arises from assuming a solution exists without sufficient data.
  *   **Variant Test:**
      *   *Coin Flip:* Still underspecified unless the coin bias and base amount distribution are known.
      *   *Fee:* Cannot determine if fee outweighs gain without the prior.
      *   *Unknown Cap:* Remains underspecified; the cap ensures finite expectation, but without the distribution, EV is unknown.

  ---

  ### Unoccupied and Incoherent Combinations

  1.  **Symmetry = Yes + Prior Required = Yes:** **Incoherent.** If symmetry blocks reasoning, the specific probabilistic definition (prior) becomes irrelevant to the decision rule.
  2.  **Symmetry = No + Prior Required = No + Unbounded = Yes:** **Unexplored/Unattractive.** If no prior is needed (logical error view), the boundedness of values should not sustain the paradox; claiming it does implies a dependency on probabilistic tails without admitting priors.
  3.  **Symmetry = No + Prior Required = Yes + Unbounded = No + Resolvable:** **Unoccupied.** This combination suggests a proper prior resolves the paradox (true), but implies the problem *as stated* is solvable. Leaf D occupies this space by claiming the problem *as stated* is not solvable due to the missing prior.

  ### Variant Analysis Summary

  1.  **Coin Flip (Dynamic Mechanism):** Breaks Node 1 (Symmetry). The tree forces positions down the "No" branch. Leaf A (Indifference) is eliminated. Leaf B (Miscomputed) must recalculate conditionals based on the known mechanism. Leaf C and D depend on whether the dynamic process allows infinite expectation.
  2.  **Fee to Switch:** Tests Node 3. Leaf C (Infinite Expectation) is the only position where a finite fee might not deter switching. Leaves A, B, and D all imply switching is unjustified or undefined, so a fee reinforces the "don't switch" conclusion.
  3.  **Unknown Cap:** Tests Node 3. By enforcing boundedness, it forces a "No" at Node 3. This collapses Leaf C (Improper Prior) into Leaf D (Underspecified), as the infinite expectation required for Leaf C is impossible. The tree successfully identifies that the "Infinite Expectation" resolution is unavailable in capped variants.
