          *   *Relational Pluralist:* Argues Universalist assumes a single "moral architecture." Claims some ethical lives are organized via kinship/roles with no WEIRD analogue. Presses the "problem of moral translation" (category error of normative individualism). Invokes "index of normative translatability" vs. "ontological incommensurability." Asks if objectivity requires convergence in judgment or conditions of revision. Must concede a weakness (parochialism-in-reverse regarding "culture" and constraints from shared cognition).
      *   **Tone:** Formal, polished, reciprocal, no strawmanning, no citations/authority appeals.
