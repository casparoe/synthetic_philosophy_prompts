answer: |-
  Here is an analysis of your intuitions, a reconstruction of the principle driving them, and the hard choices that principle demands.

  ### 1. The Principle Your Verdicts Are Tracking

  Your verdicts do not track legality, nor do they track a simple "quid pro quo" exchange. Case 10 (revolving door) and Case 6 (pharma lunch) prove that no explicit deal is necessary. Case 4 (mayor's campaign) proves that political gain is not inherently corrupt. Case 1 and 3 prove that the moral status of the giver matters.

  The principle underlying your eleven verdicts is the **Fidelity-to-Mandate Principle**.

  > **Principle:** A practice is corrupt when a transfer of value (material, relational, or prospective) creates a *competing loyalty* that reasonably undermines the official's fidelity to the public purpose of their office, **unless** that transfer is constitutive of the local social fabric required for the office to function, or is a coerced extraction from someone holding no fiduciary duty.

  **How this maps to your cases:**
  *   **Cases 5, 6, 10, 11:** These all introduce a competing loyalty (family, industry, future employment, friendship-gift) that displaces fidelity to the public mandate, even without an explicit deal. (Motivated by Case 10, which you feel most strongly about).
  *   **Cases 2, 7:** These are excluded because the transfer *reinforces* the social fabric necessary for the office to function (gratitude, customary respect) rather than creating a private channel of influence. (Motivated by Case 7, your uncertainty about norms).
  *   **Cases 1, 3:** These are "extractive." The official betrays fidelity (corrupt), but the citizen does not hold a fiduciary duty (not corrupt). The "survival" aspect of Case 1 mitigates the blame but not the classification. (Motivated by Case 3's asymmetry).
  *   **Case 4:** Excluded because the "gain" (re-election) is aligned with the public mandate (campaign promise), not a private channel.
  *   **Case 8:** You classify this as corrupt because the lender's fidelity to development goals is compromised by the coercive mechanism itself. (Motivated by your self-indictment).
  *   **Case 9:** You classify this as "not corrupt" but wrong. This is the tension point.

  ### 2. Repairing Your Test

  Your colleague's **Counterfactual-Relation Test** is failing you because it relies on mental states and counterfactuals that are impossible to prove and morally secondary.

  *   **Clause (i) ("But for the role"):** This is doing **too much work** and is **too narrow**. It fails Case 11. As you noted, the watch would be given due to friendship. If we stick to Clause (i), Case 11 is not corrupt. But your intuition (rightly) says it is. Why? Because the *public perception* of the gift is tied to the office, regardless of the private motive. The test should not be "would this happen without the office?" but "does this create a reasonable appearance of divided loyalty?"
  *   **Clause (ii) ("Point of the transfer"):** This is doing **no work**. It requires mind-reading. In Case 5 (mayor's son), there was "no evidence of prior understanding." In Case 10 (regulator), "no bribe was offered." The *point* is irrelevant; the *structural incentive* is what matters. A defensible account must focus on the **systemic effect on the role**, not the subjective intent of the giver.

  **The Repair:** Replace the Counterfactual-Relation Test with a **Reasonable-Presumption Test**.
  *   *A transfer is corrupt if a reasonable observer, knowing the facts, would presume the official's judgment is or could be swayed by private consideration rather than public merit.*
  *   *Exception:* Customary practices necessary for social cohesion (Case 7).
  *   *Exception:* Coerced payments by those without fiduciary duty (Case 1 & 3 payer).

  ### 3. The Asymmetry of Case 3

  You ask whether the asymmetry (clerk corrupt, payer not) is a feature or a bug. It is a **feature**.

  Corruption is not a symmetric transaction like trade; it is a **breach of trust**. Only the person holding the public trust (the clerk) can betray it. The applicant is a citizen claiming a right. To call the applicant corrupt is to blame the victim of a broken system.
  *   **Why it works:** It preserves the concept of corruption as a *fiduciary* failure. If you label the payer corrupt, you conflate "corruption" with "any participation in an illicit market."
  *   **The Risk:** This asymmetry breaks down if the payer is *actively engineering* the corruption (e.g., a firm bribing for a contract). In Case 3, the payer is passive/reactive. Your account must distinguish between **Active Corruption** (buying influence) and **Survival Payments** (buying rights). Case 3 is the latter.

  ### 4. Verdicts on the New Cases

  Applying the **Fidelity-to-Mandate Principle**:

  1.  **Legislator & Campaign Contributions:** **Corrupt.**
      *   *Reasoning:* Even if the belief precedes the money, the *dependency* on future contributions creates a competing loyalty. The legislator must now prioritize the industry's ability to fund the campaign to maintain the seat required to serve the public. This matches Case 10 (structural incentive).
  2.  **Hiring Manager & Nephew:** **Corrupt.**
      *   *Reasoning:* Even if he is the strongest candidate, the failure to disclose creates a reasonable presumption of favoritism. It undermines trust in the meritocratic process (the office's purpose). This matches Case 5 (conflict of interest).
  3.  **Convoy Commander & Militia:** **Not Corrupt.**
      *   *Reasoning:* This is a survival payment in a vacuum of state authority (like Case 1). The commander's mandate is delivering food. Paying the militia is a cost of logistics in a war zone, not a betrayal of public trust for private gain, provided the money does not fund atrocities. It is a "grease payment" for existence.

  ### 5. The Hard Choices: Accommodation and Overturn

  **Which verdict my account cannot accommodate:**
  My account cannot accommodate **Case 8 (MDB Conditionality)** as *corruption*.
  *   *Why:* Corruption requires a betrayal of public trust for *private or sectional gain*. The MDB's conditionality is a pursuit of *policy objectives* (however coercive). It is **Coercion** or **Imperialism**, not Corruption. Calling it corruption dilutes the term to mean "anything I dislike about power dynamics."
  *   *Consequence:* You must reclassify Case 8. It is an abuse of leverage, not corruption.

  **Which verdict you should overturn:**
  You should overturn **Case 1 (The Nurse)**.
  *   *Why:* You call it "corrupt, but the least serious." This is morally hazardous for an MDB. Labeling a survival payment by a desperate family as "corrupt" stigmatizes the victim and conflates the symptom (poverty) with the disease (systemic failure).
  *   *Correction:* Classify Case 1 as **Extortion** (by the system/nurse) and **Survival Payment** (by the family). The family commits no ethical wrong. The nurse commits a wrong, but one excused by necessity. Do not put the family's payment in the "corruption" bucket. It confuses your enforcement mechanisms.

  *(Note: I considered asking you to overturn Case 9. A strict Fidelity account would call the University donation corrupt. However, overturning Case 1 is more urgent for a development bank's operational guidance to avoid punishing beneficiaries.)*

  ### 6. Universality vs. Parochialism

  Finally, you ask whether this account commits you to universal standards or parochial ones.

  **Honest Answer:** It commits you to **Parochial Standards.**

  *   **Evidence:** Look at Case 7 (Headman). You excuse the drink because "everyone present regards this as how a headman behaves." This admits that the "Public Purpose" of the office is defined by *local norms*, not universal ones.
  *   **Evidence:** Look at Case 8. You criticize your own employer for imposing standards that criminalize local gift-giving. This admits that what looks like "anti-corruption" from Washington looks like "cultural erasure" locally.

  **The Implication:**
  If corruption is defined by fidelity to a *local* public mandate, then your institution's standards are indeed parochial standards you have the power to impose.
  *   **Should you use the concept less?** Yes.
  *   **Reassignment:**
      *   **Case 8 (Conditionality):** Call it **Coercion**.
      *   **Case 10 (Revolving Door):** Call it **Institutional Capture**.
      *   **Case 9 (University):** Call it **Privilege**.
      *   **Case 1 (Nurse):** Call it **Survival Payment**.

  **Recommendation for the Guidance Note:**
  Reserve the word **Corruption** strictly for **Case 3, 5, 6, and 11**: Clear breaches of fiduciary duty for private advantage where alternatives exist.
  Move the other cases into categories like "Coercion," "Capture," or "Survival." This protects the moral force of the word "Corruption." If everything from a nurse's $2 to an MDB loan condition is "corruption," then nothing is. You end up policing the poor while immunizing the powerful.

  By narrowing the definition, you acknowledge that your institution's power is parochial, but your commitment to *fiduciary integrity* (in the narrow sense) remains universal. You stop trying to be the world's moral police and start being a rigorous guardian of the specific trust placed in your funded projects.
