          *   *Substantive?* The "Taste" part is real psychology but maybe irrelevant for certification. The "Source" part (Q2) is critical. If you treat stochastic shift as adversarial, you are too conservative. If you treat adversarial as stochastic, you are unsafe. RO collapses this into "size of set." Econ keeps them separate (Belief vs. Attitude).
