  3.  **Translation Strategy (ML/RO Vocabulary):**
      *   *Urn A (Risk):* Known distribution $P_0$. Expectation $\mathbb{E}_{P_0}[L]$.
      *   *Urn B (Ambiguity):* Ambiguity set $\mathcal{P}$.
      *   *Preference for Urn A:* Minimax optimization. $\min_{action} \max_{P \in \mathcal{P}} \mathbb{E}_P[L]$.
      *   *Ambiguity Aversion:* The size/shape of $\mathcal{P}$. If $\mathcal{P}$ is a singleton, you're risk-neutral/SEU. If $\mathcal{P}$ is large, you're ambiguity averse.
      *   *Ellsberg Violation:* In standard Bayesian (BMA), you put a prior on the ratio. In RO, you don't. The "violation" is that standard probability theory says you *must* have a prior. RO says "I don't, and I optimize against the worst case."

  4.  **Drafting the Translation (Section 1):**
      *   *Urn A:* Known $P$. Variance is aleatoric.
