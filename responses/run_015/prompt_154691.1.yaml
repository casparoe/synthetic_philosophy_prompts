          *   *Rectangularity:* In Robust MDPs, $\mathcal{P}$ is rectangular if the uncertainty at step $t+1$ doesn't depend on the history in a way that allows nature to adapt *after* you commit, or vice versa. It ensures time consistency (Bellman equation holds).
