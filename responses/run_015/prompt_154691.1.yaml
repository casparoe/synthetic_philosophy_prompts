      *   *Check:* Rectangularity. Make sure to distinguish between *rectangularity of the set* and *time consistency of the policy*.
      *   *Check:* Variant 3 (Unknown Support). This is crucial for the user's "unknown unknowns" problem. Standard DRO assumes support is known or bounded by divergence (KL/Wasserstein). If support is disjoint, KL blows up. Need to mention Wasserstein or Total Variation.

