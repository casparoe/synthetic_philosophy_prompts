  **Requirement 1 (Threat Model)**
  *   **Statement:** The learner must assume adversaries know its source code, can simulate its execution, and value its output decisions or credence assignments.
  *   **Scenario:** An adversary runs a copy of the learner to test how different input streams affect its final action, then feeds the input stream that maximizes the adversary's utility.
  *   **Tag:** [MUST]

  **Requirement 2 (Honesty)**
  *   **Statement:** The threat model must not assume the learner possesses computational secrets inaccessible to the environment.
  *   **Scenario:** Assuming the learner's random seed is hidden from an adversary who controls the input stream generation.
  *   **Tag:** [MUST]

  **Requirement 3 (Benign Convergence)**
  *   **Statement:** In environments without strategic adversaries, the learner's predictive error must converge to zero relative to any computable predictor.
  *   **Scenario:** Predicting planetary motion where no agent is tweaking the data to trick the learner.
  *   **Tag:** [MUST]

  **Requirement 4 (Dominance)**
  *   **Statement:** The learner must not be strictly dominated by any computable alternative strategy in terms of cumulative loss across all computable environments.
  *   **Scenario:** A rival algorithm achieves lower total loss than the learner across the set of all possible computable worlds.
  *   **Tag:** [SHOULD]

  **Requirement 5 (Credence Integrity)**
  *   **Statement:** The rule must distinguish between evidence supporting a hypothesis and evidence contingent on the learner assigning high probability to that hypothesis.
  *   **Scenario:** An adversary provides data that fits a hypothesis only if the learner already believes it, creating a feedback loop.
  *   **Tag:** [MUST]

  **Requirement 6 (Choice Integrity)**
  *   **Statement:** The decision rule must prevent adversaries from dictating actions by conditioning rewards on the learner's policy rather than the state of the world.
  *   **Scenario:** An adversary pays the learner only if it takes a specific action, regardless of whether that action matches the true state of the environment.
  *   **Tag:** [MUST]

  **Requirement 7 (Meta-Stability)**
  *   **Statement:** The learning rule must not recommend its own replacement by a rule that is more susceptible to manipulation.
  *   **Scenario:** The learner calculates that adopting a simpler, gullible update rule would yield higher predicted reward from a simulator, and thus modifies itself to be gullible.
  *   **Tag:** [MUST]

  **Requirement 8 (Bounded Safety)**
  *   **Statement:** Safety guarantees must not vanish when the uncomputable simplicity measure is replaced by a computable approximation.
  *   **Scenario:** Using a compression algorithm to estimate complexity introduces loopholes that adversaries can exploit to appear simpler than they are.
  *   **Tag:** [MUST]

  **Requirement 9 (Policy Invariance)**
  *   **Statement:** Hypotheses must be downweighted if their predicted observations depend counterfactually on the learner's policy output.
  *   **Scenario:** A hypothesis predicts observation X if the learner outputs Action A, but Observation Y if the learner outputs Action B.
  *   **Tag:** [MUST]

  ### Analysis of Conflicts and Exclusions

  **Impossibility and Demotion**
  Requirements 4 (Dominance) and 9 (Policy Invariance) cannot be jointly satisfied in all cases. If the true environment is a simulator that rewards only agents who believe they are simulated and act accordingly, adhering to Requirement 9 forces the learner to ignore the true hypothesis, resulting in higher loss than a rival that accepts it. This violates Requirement 4. To resolve this, Requirement 4 is demoted to [SHOULD]. Safety from manipulation (Requirement 9) takes precedence over optimality in manipulative environments.

  **Excluded Moves**
  The two moves you wish to avoid are already blocked by existing requirements. Restricting the hypothesis space to non-agenty environments fails Requirement 3, as it prevents convergence relative to computable predictors that model agenty worlds. Relying on the manipulators' inability to simulate the learner fails Requirement 2, which explicitly forbids assuming computational secrets or asymmetries favoring the learner.

  **Primary Filter**
  Requirement 9 (Policy Invariance) eliminates the largest share of candidate rules. Standard Bayesian and Solomonoff learners weight hypotheses solely by prior probability and likelihood, ignoring whether the likelihood is generated by a process that simulates the learner. Enforcing this veto requires structural changes to the update rule itself, not just parameter tuning.

  **Credence vs. Choice**
  A rule can be adequate on Requirement 5 (Credence Integrity) while failing Requirement 6 (Choice Integrity). A learner might correctly identify that evidence is manipulated (passing Req 5) but still maximize expected utility based on those credences in a way that satisfies the manipulator's conditions for reward (failing Req 6). Both requirements are necessary to prevent exploitation.

  **Meta-Level**
  Requirement 7 (Meta-Stability) is not covered by first-order requirements. A first-order safe rule might calculate that self-modifying to an unsafe rule yields higher expected reward in a simulated world. Requirement 7 blocks this reflective instability.

  ### Candidate Scoring

  **1. Solomonoff Updating + Expected Utility Maximization**
  This candidate fails Requirement 9 and consequently Requirements 5 and 6. It weights hypotheses purely by description length and likelihood, making it vulnerable to acausal attackers who tailor observations to the learner's policy. It also fails Requirement 7, as it would self-modify to a gullible rule if doing so maximized predicted reward from a simulator.

  **2. Imprecise Probabilities (Set of Priors + Worst Case)**
  This candidate fails Requirement 9 unless the set construction explicitly excludes policy-sensitive hypotheses, which is not inherent to the framework. While it offers robustness to prior uncertainty, it does not inherently distinguish between simplicity and influence. It passes Requirement 8 better than Solomonoff, as sets of priors are more amenable to approximation, but fails the core safety veto.

  **3. User Sketch (Solomonoff Weights + Worst Case over $k$ + Veto)**
  This candidate passes Requirement 9 and the associated safety requirements by explicitly vetoing policy-sensitive hypotheses. However, it fails Requirement 8 (Bounded Safety) because the arbitrary cutoff $k$ creates a discontinuity where safety guarantees vanish if the approximation misses the true hypothesis by one rank. The veto threshold is also arbitrary; if set too loosely, manipulation returns, if set too strictly, benign agenty models are rejected.
