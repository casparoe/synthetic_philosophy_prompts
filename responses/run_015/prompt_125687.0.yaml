  When the conclusion is placed at the bottom of the roll, the court votes on the premises first. The majority supports formation, consideration, and no duress. Since these three verdicts are mutually consistent and jointly entail enforcement under the doctrine, the court adopts them. When it reaches the conclusion, the majority votes against enforcement, but this is inconsistent with the already adopted premise verdicts and the doctrine. The rule therefore mandates the opposite verdict, so the court announces enforcement. The reason given is the conjunction of formation, consideration, and no duress. When the conclusion is placed at the top, the court votes on enforcement first. The majority votes against enforcement, so this verdict is adopted. When voting on the premises, the majority supports formation and consideration, which are consistent with non-enforcement provided duress is found. However, when voting on no duress, the majority supports it. This creates an inconsistency with the adopted verdict of non-enforcement and the previous premise verdicts. The rule forces the opposite verdict on duress, meaning the court finds duress exists. The court announces non-enforcement, citing formation and consideration but also duress. Regarding the axiomatic conditions, the rule satisfies universal domain and collective consistency. Consistency is guaranteed by construction because the rule overrides majority will whenever inconsistency arises, which is why this achievement is trivial; it ensures logical coherence only by sacrificing responsiveness to the judges' views. The rule violates anonymity and neutrality because the outcome depends on the order of issues set by the reporting judge, not just the votes themselves. It violates independence because the verdict on any issue depends on the outcomes of prior issues in the roll. On the question of unanimous rejection, the rule can indeed hand down a verdict every judge rejected. Consider a three-judge court where judge one rejects formation, judge two rejects consideration, and judge three rejects no duress, with all three voting against enforcement. The majority on each premise is positive, so if the premises are voted first, the rule forces enforcement. Every judge voted against enforcement, yet the court enforces. This demonstrates that the rule can override the unanimous will on the conclusion. Normatively, this suggests the rule does not solve the doctrinal paradox but displaces it. The discretion inherent in premise-based procedures regarding which reasons matter is transferred to the reporting judge who sets the roll. This is potentially worse because it hides the normative choice behind a procedural mechanism. Furthermore, in the unanimous rejection scenario, the court announces reasons for enforcement, namely that all premises are satisfied, yet no single judge believed all premises were satisfied. The court ends up asserting a rational basis for its decision that exists only collectively, not in the mind of any member, undermining the ideal that courts owe parties reasons that reflect actual judicial reasoning.

  The marking scheme allocates twenty marks across five essential points. Four marks are awarded for correctly identifying the two outcomes and reasons, with common errors including miscalculating the forced verdict on the conclusion when it appears last. Four marks are assigned for the axiomatic analysis, specifically noting the failure of anonymity and independence, where candidates often mistakenly claim consistency is a substantive virtue rather than a procedural constraint. Four marks depend on constructing the unanimous rejection example, with errors typically involving profiles where at least one judge supports the winning verdict. Four marks are given for identifying the displacement of discretion to the roll-setter, penalizing answers that treat the rule as neutral. The final four marks require articulating the reasons problem, where students often fail to distinguish between the verdict and the rationale, missing that the court asserts a conjunction of premises no individual accepted.
