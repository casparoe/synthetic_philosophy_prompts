      *   *Camp 1:* Causal Decision Theory (CDT). My choice cannot *cause* the other's choice in a one-shot game. Dominance reasoning applies.
      *   *Camp 2:* Evidential Decision Theory (EDT) or Functional Decision Theory (FDT). My choice is *evidence* of the other's choice (due to logical correlation/similarity). Or, evolution selects the *disposition*, not the specific act.
      *   *The "One-Shot" Stipulation:* Camp 1 defines "one-shot" as "causally independent." Camp 2 defines "one-shot" as "no communication/iteration" but allows "logical correlation" or "common cause."
