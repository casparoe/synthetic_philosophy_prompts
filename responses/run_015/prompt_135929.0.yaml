answer: |-
  This is a remarkably precise diagnosis of a stalemate that has persisted in decision theory and evolutionary biology for decades. Your intuition from fluid mechanics serves you well here: you are witnessing a dispute not about the solution to a specific flow problem, but about the *constitutive relations* of the fluid itself.

  Here is the diagnosis you requested.

  ### 1. Verbal or Substantive?
  It is both, but the verbal layer masks a substantive layer.

  **The Verbal Layer:** The dispute turns on the definition of "one-shot." Camp 1 defines "one-shot" as *causal independence*. Camp 2 defines "one-shot" as *no communication or iteration*, but allows *logical correlation*. When the evolutionary theorist objects that your "procedural overlap" parameter is stipulated away in the one-shot case, they are enforcing Camp 1's definition. They are saying, "If there is overlap, it isn't the game we are analyzing." Camp 2 replies, "If you define the game such that it cannot exist in reality, your solution is vacuous." This is a verbal boundary dispute about the domain of applicability of the model.

  **The Substantive Layer:** Beneath the definitions lies a disagreement about the **Unit of Agency**. Camp 1 treats the *act-token* as the unit of optimization (What should I do *now*?). Camp 2 treats the *algorithm-type* as the unit of optimization (What program should be running *here*?). These are genuinely different normative questions. If you ask "What act maximizes payoff given fixed opponents?", Camp 1 is right. If you ask "What decision procedure maximizes payoff given opponents running similar procedures?", Camp 2 is right. The irritation in your group arises because they are answering different questions while using the same labels ("rational," "one-shot").

  ### 2. The "Procedural Overlap" Parameter
  Your hypothesis is worth keeping, but it must be split into two distinct parameters to do the work you want.

  1.  **Causal Assortment (Biological):** The degree to which the two agents share a common causal history (genetics, culture, environment). This is the $r$ in Hamilton's rule. Camp 1 accepts this but reclassifies it: if $r$ is high enough, the payoff matrix changes (it's no longer a Prisoner's Dilemma, strictly speaking, because the fitness weights change).
  2.  **Logical Correlation (Computational):** The degree to which the two agents' outputs are determined by the same logical function, independent of causal connection. This is the realm of Newcomb problems and Functional Decision Theory. Camp 1 rejects this as "magic" or "smuggling in a correlating device." Camp 2 views it as a physical fact about deterministic or partially deterministic algorithms.

  **Diagnosis:** The dispute dissolves if you index by **Logical Correlation**.
  *   At 0 Logical Correlation (agents are opaque boxes with independent random seeds), Camp 1 wins. Defection is dominant.
  *   At 1 Logical Correlation (agents are identical source code), Camp 2 wins. Cooperation is dominant because $P(\text{Opponent}=C | \text{I}=C) = 1$.

  The evolutionary theorist's objection fails because they conflate Logical Correlation with Causal Assortment. You can have two agents created independently (zero causal assortment) who nonetheless run the same algorithm (high logical correlation). Camp 1 insists this is impossible to *know* or *rely on* without a causal link. Camp 2 insists that if the algorithms *are* identical, the correlation holds regardless of knowledge.

  ### 3. Where the Burden of Argument Sits
  The burden is shared, but on different fronts.

  *   **Camp 1 (Classical):** Must defend why "rationality" should be blind to logical correlation. They argue that an agent cannot *cause* the past or the other's mind. Their burden is to explain why an evolutionary process that selects for defection in the classical sense doesn't go extinct against a cluster of cooperators who recognize their similarity. (This is the "Why aren't we all dead?" burden).
  *   **Camp 2 (Structural):** Must defend the counterfactual structure. They claim "If I were to cooperate, the other *would* cooperate." Camp 1 says this counterfactual is false; the other's move is already fixed or independent. Camp 2's burden is to formalize "logical counterfactuals" without invoking backward causation.

  **The Real Burden:** It lies on **Camp 1 to justify the independence assumption as a normative ideal.** If the goal of decision theory is to guide agents to good outcomes, and agents in the real world (especially evolved ones) have high procedural overlap, then a theory that assumes independence is systematically misleading. Camp 1 must argue that decision theory is about *idealized atoms*, not *embedded engines*.

  ### 4. The Fluid Mechanics Analogy
  Your intuition about the iterated game (large equilibrium set $\rightarrow$ focus on dynamics) is a **false analogy** for the one-shot case, but a **true analogy** for the decision theory itself.

  *   **False Analogy (Equilibrium):** In the iterated PD, the equations (payoffs) are agreed upon, but the solution set is large. Here, the *equations themselves* are in dispute. Camp 1 and Camp 2 are proposing different governing equations for "rational flow."
  *   **True Analogy (Constitutive Relations):** In fluid mechanics, you have the conservation laws (mass, momentum) which are universal, and the *constitutive relations* (Newtonian vs. Non-Newtonian) which describe the specific fluid.
      *   **Conservation Laws:** "Maximize expected utility." (Both camps agree).
      *   **Constitutive Relations:** "How does the choice variable relate to the outcome variable?"
      *   Camp 1 assumes a **Newtonian Fluid**: Stress (choice) is locally proportional to strain rate (causal impact).
      *   Camp 2 assumes a **Viscoelastic Fluid**: Stress depends on the history and structure of the material (logical connection to the other particle).

  **Progress:** Just as you would not argue about flow profiles without agreeing on whether the fluid is water or honey, you cannot argue about the one-shot PD without agreeing on the *constitutive relation of agency*. Progress will not come from a theorem within one framework, but from a **taxonomy of agency**.

  ### 5. What Counts as Progress?
  Do not look for a theorem that proves one side right. Look for a **distinction** that separates the three questions currently tangled in your reading group.

  1.  **The Prescriptive Question:** "I am an agent with fixed architecture. What button do I press?" (Camp 1 is usually right here, unless you can self-modify).
  2.  **The Design Question:** "I am a designer/evolutionary process. What architecture do I build?" (Camp 2 is right here; you build cooperators).
  3.  **The Descriptive Question:** "What do actual agents do?" (Empirical; depends on your Overlap Parameter).

  **Recommendation:** Propose that the group stop asking "What is rational in the one-shot PD?" and start asking "Under what conditions does the Prescriptive Question collapse into the Design Question?"

  If an agent can self-modify (or if evolution selects the agent), the Prescriptive Question *becomes* the Design Question. In that limit, Camp 2's answer dominates. If the agent is a rigid token with no ability to select its type, Camp 1's answer dominates.

  **Conclusion:** Your "procedural overlap" is the viscosity of the system. Camp 1 is arguing for inviscid flow (Euler equations). Camp 2 is arguing for viscous flow (Navier-Stokes). The evolutionary theorist is saying "We defined this as inviscid flow." You are correct that the dispute is about whether the inviscid approximation is valid for the phenomenon being studied. The progress lies in calculating the Reynolds Number of the interaction: at what scale of procedural overlap does the "inviscid" (classical) model break down? That is an empirical and formal question, not a verbal one.
