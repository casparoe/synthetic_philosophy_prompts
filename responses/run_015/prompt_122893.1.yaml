answer: |-
  This is a classic friction point between **scientific realism** (your position) and **empiricism/verificationism** (your friend's position). Your friend is arguing from an epistemic standpoint: if two states of the world yield identical observations for any possible observer *now*, they are functionally equivalent. You are arguing from an ontological standpoint: the world has a specific history and structure, and the fact that a specific piece of information *existed* and was *destroyed* is a material fact about the universe, distinct from a universe where that information never existed.

  You are right to feel that there is a gap. Your friend is collapsing the distinction between **truth conditions** (what makes a statement true) and **assertibility conditions** (what allows us to know it's true). In archival work and historical science, we generally operate as realists: the tax *was* per household or it *wasn't*, regardless of the fire.

  Here is the carving you are looking for, drawing from philosophy of science, statistics, and archival theory.

  ### 1. The Philosophical Carving: Principled vs. Practical
  In the philosophy of science, the standard distinction is between **Permanent Underdetermination** (no possible evidence could ever distinguish the theories) and **Transient Underdetermination** (more evidence could distinguish them).

  Your case complicates this. It is *permanent* for us (the evidence is gone), but it was *transient* in principle (the evidence existed). Your friend treats all permanent underdetermination as the same. You need a term that isolates the "evidence existed but is lost" category.

  The cleanest philosophical carving here is between **Principled Underdetermination** and **Practical Underdetermination**.
  *   **Principled (or Structural) Underdetermination:** Corresponds to your Case 2's "no column at all." The distinction is metaphysically or logically empty. No data *could* exist.
  *   **Practical (or Contingent) Underdetermination:** Corresponds to your Case 1 and 2's "column existed but is lost." The distinction is real, but the path to verification is blocked by contingent historical accidents (fire, death).

  ### 2. The Statistical Analogy: Identifiability
  You guessed correctly that statistics has a precise handle on this. It is the distinction between **Structural Unidentifiability** and **Practical Unidentifiability**.
  *   **Structural Unidentifiability:** The model is flawed. Two different parameter values produce the exact same probability distribution for the data. No amount of data will ever fix this. (This is your friend's category).
  *   **Practical Unidentifiability:** The model is sound, and the parameters *are* distinct, but the specific data required to estimate them is missing, noisy, or insufficient. (This is your category).

  In your tax register example, the parameter "unit size" is *structurally identifiable* (the header would have fixed it) but *practically unidentifiable* (the header is burned). In statistics, we do not treat these as the same. We treat practical unidentifiability as a data problem to be managed (via sensitivity analysis or priors), whereas structural unidentifiability is a model problem requiring redesign.

  ### 3. Why Your Friend is Wrong (The Verificationist Trap)
  Your friend is adopting a **Verificationist** stance: meaning is tied to the method of verification. If you can't verify it, the difference is meaningless.
  You are adopting a **Realist** stance: truth is mind-independent. The "gap" you feel is the difference between **Epistemic Opacity** (we can't see it) and **Ontological Indeterminacy** (it isn't there).
  *   **Case 2 (No Column):** The difference might be ontologically indeterminate (if the database never tracked X, "X was empty" and "X didn't exist" might be semantically equivalent).
  *   **Case 1 (Burned Header):** The difference is ontologically determinate. The header *was* there. The universe contains the fact "Header said Household." We just lack access.

  Collapsing these two erases the historical reality of the record's destruction. In law, this distinction is vital: **Spoliation of Evidence** (destroying existing evidence) is a crime; **Lack of Evidence** (never having it) is not. The moral and epistemic weight differs because the *potential for knowledge* was actively extinguished in one case but never existed in the other.

  ### 4. What To Do With These Questions
  You asked how to handle this. You should not suspend judgement as if the question were meaningless (your friend's advice), nor should you pretend you know the answer.
  *   **Sensitivity Analysis:** Run your historical reconstruction under both assumptions (Household vs. Group). If the conclusions hold in both, the practical underdetermination doesn't matter. If the conclusions diverge wildly, you must state the range of possibilities.
  *   **Bayesian Priors:** Use external evidence (other colonies, later periods) to assign probabilities. "It is 80% likely to be Household based on regional norms." This acknowledges the fact is determinate but our knowledge is probabilistic.
  *   **Acknowledge the Loss:** Explicitly label the gap as **Practical Underdetermination**. This signals to other researchers that the question is *worth* asking if new evidence surfaces (e.g., a copy of the register found elsewhere), whereas Principled Underdetermination signals that further search is futile.

  ### 5. The Edges: Recorded vs. Recordable
  Does it matter if the evidence was actually recorded vs. merely recordable?
  *   **Recorded (The Header):** This is strong Practical Underdetermination. A physical trace existed. The "truth" was inscribed in matter.
  *   **Recordable (A Witness):** This is weaker. If a witness *could* have seen it but didn't, the evidence never entered the historical record.
  *   **The Boundary:** The distinction holds as long as the *discriminatory power* existed in the past. If a witness was present who *could* have distinguished the two, the event was **Contingently Determinate**. If no possible observer could have distinguished them (e.g., quantum event, or the tax collector himself didn't know), it edges toward Principled Underdetermination.
  *   **For Us vs. For Everybody:** If the evidence is out of reach for us but exists for someone else (e.g., a sealed archive in another country), it remains Practical Underdetermination. If it is destroyed for *everyone* (burned, no copies), it is **Permanently Practically Underdetermined**. The "Practical" label still holds because the barrier is contingent (fire), not logical.

  ### Recommendation
  There is no single, universally canonical term in philosophy that perfectly isolates "underdetermination due to lost evidence" distinct from "underdetermination due to lack of evidence." However, the statistical term **Practical Unidentifiability** maps perfectly to the philosophical concept of **Practical Underdetermination**. This distinguishes it from **Structural Underdetermination** (your friend's category).

  Since you need a philosophical term for a general audience, and "Practical Underdetermination" is descriptive but not yet a fixed "Stanford Encyclopedia" headline for this specific nuance, I recommend proposing it with the statistical backing.

  \answer{no established term; proposed: Practical Underdetermination}
