answer: |-
  ### Preamble: Mapping the Philosophical Registers

  Before precisifying the slogan, we must recognize that the phrase "If you can't tell the difference, there is no difference" is a chameleon. It shifts meaning depending on which philosophical register is being activated.

  *   **Epistemic Register:** Concerns knowledge, detection, and justification. (e.g., "We cannot *know* they differ.")
  *   **Metaphysical Register:** Concerns identity, existence, and the constitution of objects. (e.g., "They are *the same object* or type.")
  *   **Axiological Register:** Concerns value, merit, and worth. (e.g., "They possess *equal value*.")
  *   **Pragmatic Register:** Concerns use, function, and consequence. (e.g., "They *function* the same way.")

  The confusion in forgery debates arises when a speaker slides between these registers—using an epistemic premise (you can't see the difference) to support a metaphysical or axiological conclusion (therefore, the value is identical). Below is the menu of distinct claims hidden within the slogan, followed by the philosophical verdicts.

  ***

  ### The Menu: Four Precisified Readings

  **1. The Epistemic Humility Reading**
  *   **Claim:** If no observer (now or in the foreseeable future) can distinguish Object A from Object B, then for all human purposes of knowledge and classification, there is no *knowable* difference between them.
  *   **Register:** Epistemic.

  **2. The Aesthetic Experientialist Reading**
  *   **Claim:** The artistic value of a work resides entirely in the qualitative experience it affords the viewer. If Object A and Object B afford identical experiences, they possess identical aesthetic merit.
  *   **Register:** Axiological / Phenomenological.

  **3. The Metaphysical Reduction Reading**
  *   **Claim:** Qualitative indiscernibility entails numerical identity (or relevant ontological equivalence). If Object A and Object B share all perceptual properties, they are, in the relevant sense, the same work of art.
  *   **Register:** Metaphysical.

  **4. The Functional/Instrumental Reading**
  *   **Claim:** The value of an artwork lies in its capacity to decorate, provoke thought, or hold market value. If Object A performs these functions indistinguishably from Object B, there is no practical difference in their utility.
  *   **Register:** Pragmatic.

  ***

  ### Point-by-Point Verdicts

  #### 1. The Epistemic Humility Reading
  *   **Status:** **Platitude.**
      It is trivially true that if a difference is undetectable, it is epistemically inaccessible. However, equating "undetectable" with "non-existent" is a verificationist overreach.
  *   **Does it support the conclusion (Forgery = Original)?** **No.**
      This reading only proves we cannot *know* which is which. It does not prove they are of equal value. One could be a masterpiece and the other a fake, and we would simply be ignorant of the fact. It fails to bridge the gap from "we don't know" to "they are equal."
  *   **Perceptual vs. Causal-Historical:** **Collapses the distinction pragmatically, but acknowledges it theoretically.**
      This reading admits a causal-historical difference might exist (the forgery was made by a forger, the original by the artist) but renders it irrelevant to *knowledge*. It treats the causal history as an occult property—something that might exist but cannot enter the economy of human judgment.

  #### 2. The Aesthetic Experientialist Reading
  *   **Status:** **Substantive and Defensible (but Controversial).**
      This is a core tenet of formalist or perceptualist aesthetic theories (e.g., Clive Bell's "significant form," though taken to an extreme). However, it is contested by contextualists (e.g., Arthur Danto, Nelson Goodman) who argue that art history and intention shape the experience itself.
  *   **Does it support the conclusion (Forgery = Original)?** **Yes, conditionally.**
      If one accepts the premise that aesthetic value *supervenes* solely on perceptual properties, then the forgery is aesthetically just as good. However, this limits "good" strictly to immediate sensory experience, excluding art-historical significance.
  *   **Perceptual vs. Causal-Historical:** **Necessarily Collapses the distinction.**
      This reading explicitly denies that causal-historical properties contribute to aesthetic value. It posits that the "art" is exhausted by the visual encounter. If the forger replicates the brushstrokes, they have replicated the art, because the artist's specific mental state during the original production is deemed irrelevant to the viewer's aesthetic reception.

  #### 3. The Metaphysical Reduction Reading
  *   **Status:** **False.**
      This violates Leibniz's Law when applied to concrete particulars. Two objects can share all qualitative properties (qualitative identity) while remaining numerically distinct (two different physical canvases). In the ontology of art (per Wollheim or Currie), the "work" is often an abstract type or an action, not just the physical token. A forgery is a different token generated by a different generative act.
  *   **Does it support the conclusion (Forgery = Original)?** **Yes, but via a falsehood.**
      It reaches the conclusion only by making a category error. If one believes the physical object *is* the work, and the physical objects are indistinguishable, one might falsely conclude the works are identical.
  *   **Perceptual vs. Causal-Historical:** **Necessarily Collapses the distinction.**
      This reading implies that causal history is not constitutive of the object's identity. It treats the artwork as a static arrangement of matter rather than an event or a product of a specific intentional history. It cannot accommodate the intuition that *who* made the marks matters to *what* the object is.

  #### 4. The Functional/Instrumental Reading
  *   **Status:** **Platitude (regarding utility), False (regarding artistic status).**
      It is true that a forgery can decorate a wall just as well as an original. It is false that it holds the same status in the institution of art (museum curation, art history, provenance).
  *   **Does it support the conclusion (Forgery = Original)?** **Partially.**
      It supports the conclusion that the forgery is just as good *as a decoration* or *as an investment vehicle* (if undetectable). It fails to support the conclusion that the forgery is just as good *as art*, because part of the function of art is to bear witness to human creativity and history, which the forgery falsifies.
  *   **Perceptual vs. Causal-Historical:** **Accommodates the distinction, but renders it irrelevant to function.**
      This reading acknowledges the causal-historical difference (it admits one is a fake) but argues that this difference has no cash-value in daily life. It isolates the causal history as a "provenance fact" rather than an "aesthetic fact." It allows the distinction to exist but quarantines it from the realm of practical value.

  ### Summary Analysis of the Distinction

  The slogan "If you can't tell the difference, there is no difference" is most dangerous when it masquerades as the **Aesthetic Experientialist Reading** while relying on the intuitive plausibility of the **Epistemic Humility Reading**.

  *   **Readings that Collapse the Distinction (2 & 3):** These are the only ones that successfully argue the forgery is *artistically* equivalent to the original. However, they do so by denying that the causal-historical chain (the artist's specific agency) is part of the artwork's constitution. To accept these is to accept that art is purely a visual stimulus, devoid of its status as a human action.
  *   **Readings that Accommodate the Distinction (1 & 4):** These readings preserve the intuition that the original and the forgery are historically distinct. However, they fail to prove the forgery is "just as good." Reading 1 says we just don't *know* the difference in value; Reading 4 says they are equally *useful*, but not necessarily equally *significant*.

  Therefore, the slogan fails to vindicate the forgery as an artistic equal unless one is willing to jettison the causal-historical properties that many philosophical theories (from Danto to performance theory) regard as essential to the very definition of an artwork.
