answer: |-
  **Project Title:** Practical Commitment and Logical Regress: A Normative Resolution to Carroll's Paradox

  **Project Summary**
  Lewis Carroll's dialogue *What the Tortoise Said to Achilles* is conventionally read as demonstrating that deductive inference cannot rely on logical rules treated as premises without triggering an infinite regress. Standard resolutions to this paradox typically adopt one of two strategies: they either posit that inference rules are implicitly operative without being stated, or they appeal to a form of direct rational insight into entailment. This project proposes that both responses overlook a fundamental category error in the Tortoise's challenge. Specifically, they fail to distinguish between rule-acceptance as a propositional attitude (belief or assertion) and rule-acceptance as a practical normative commitment. This dissertation research investigates whether resolving this ambiguity dissolves the regress without collapsing into psychologism, mysterious intuition, or formalist abstraction.

  **Research Question**
  The central research question is: Can the Tortoise's demand that Achilles accept an additional rule be shown to be ambiguous between demanding a further premise and demanding a shift in practical stance, and does resolving that ambiguity dissolve the standard dilemma between infinite regress and irrationalism?

  **Critique of Existing Approaches**
  Current literature largely accepts the Tortoise's framing that logical compulsion must be either a matter of explicit justification or brute psychological causation. The "implicit-rule" response attempts to halt the regress by claiming rules are operative but not premised. However, this fails to explain the normative force of the rule; if the rule is not accepted as a premise, what binds the agent to follow it? Without an account of *commitment*, the implicit rule risks becoming a mere description of behavior. Conversely, the "rational-intuition" response posits a direct grasp of validity. This avoids the regress but invites the charge of mysticism or psychologism, reducing logical necessity to a subjective mental state. Both approaches leave untouched the ambiguity regarding the *status* of rule-acceptance. They assume that to accept a rule is to hold a proposition true, rather than to adopt a normative stance governing inference. This project argues that the regress is driven specifically by treating rule-acceptance as a propositional attitude. By re-categorizing acceptance as a non-propositional normative commitment, the demand for further justification is blocked not by fiat, but by category distinction.

  **Methodology and Timeline**
  This project is designed for completion over twelve months on a part-time basis alongside doctoral coursework. The work is divided into four phases of three months each.

  *Months 1–3: Reconstruction and Logical Isolation.*
  The initial phase involves a rigorous reconstruction of the dialogue's logical structure to isolate the precise point where the slide between premise and rule occurs. I will formalize the Tortoise's demands to demonstrate that the regress only generates if every commitment is treated as a truth-apt proposition. Deliverable: A formalized map of the dialogue identifying the category error.

  *Months 4–6: Comparative Conceptual Analysis.*
  I will compare the identified ambiguity with parallel distinctions in action theory and social epistemology, specifically the distinction between knowing-that and knowing-how. The goal is to determine if logical competence functions similarly to practical skills, where normative constraint exists without propositional articulation. Deliverable: A draft chapter establishing the analogy between inferential competence and practical know-how.

  *Months 7–9: Objection Handling and Stress Testing.*
  This phase tests the two-layer account against formalist and anti-psychologist objections. I will investigate whether treating inference as a "practical stance" reduces logic to mere habit or psychological disposition. I will refine the account to ensure the normative layer retains logical force distinct from causal regularity. Deliverable: A draft chapter addressing objections regarding normativity and psychologism.

  *Months 10–12: Synthesis and Final Drafting.*
  The final phase integrates the analysis into a cohesive argument. I will refine the taxonomy of regress-stopping moves and finalize the dissertation chapter. Deliverable: A complete, polished dissertation chapter ready for committee review.

  **Expected Outcomes and Criteria for Success**
  A positive result will yield a taxonomy of regress-stopping moves that successfully separates genuinely logical commitments from psychological dispositions. Success is defined as demonstrating that the Tortoise's demand is illegitimate when interpreted as a request for a propositional premise, provided the agent has already adopted the practical stance of inference. This would resolve the dilemma by showing that the regress is not a feature of logic, but a artifact of misdescribing the nature of rule-following.

  Conversely, failure conditions are clearly defined. The project would be considered unsuccessful if the ambiguity collapses back into the original dilemma—for example, if the "practical stance" cannot be distinguished from a hidden premise without losing its normative force. Additionally, if the competence layer is shown to lack normative constraint (reducing it to mere habit), the resolution fails to account for the binding nature of logical truth.

  **Feasibility and Scope**
  The scope is limited to a single, tractable conceptual problem within the philosophy of logic and epistemology. Because the research is primarily analytical and does not require empirical data collection or extensive archival work, it is well-suited for part-time execution alongside coursework. The timeline allows for flexibility during academic terms, with heavier writing loads scheduled during breaks. The project builds directly on existing seminar work, ensuring that the research integrates smoothly with current doctoral requirements without requiring excessive additional preparation.
