  **Scenario: The Metro/Rural Small-Business Book**

  A regional bank evaluates 4,000 small-business loan applications annually using a proprietary credit score ($X$) ranging from 0 to 1. The bank's fairness audit compares two headline groups: **Metro** (Group A) and **Rural** (Group B) applicants. The outcome $Y$ is loan repayment (1 = Repaid, 0 = Default). The bank does not observe $Y$ for rejected applicants (selective labels). For the sake of this audit, we assume a special validation dataset where outcomes are fully observed (e.g., via a randomized approval pilot), allowing us to calculate the "true" fairness metrics without censoring bias for this specific exercise. The credit score $X$ is blind to industry type, but the regulator audits performance across two industries within each region: **Restaurants** (Subpop 1) and **Construction** (Subpop 2).

  **The Numbers**

  The table below describes the true population parameters revealed by the validation pilot. Note that the headline base rates (50%) are identical, but the subpopulation base rates diverge sharply (20% vs. 80%). The credit score $X$ is distributed identically across all four subpopulations (50% receive a "High Risk" score $>0.5$, 50% receive "Low Risk" $\le 0.5$), and within any subgroup, the score is uninformative (default risk is constant regardless of score). This isolates the partition as the only variable.

  | Group | Subpop | N | True Defaults ($Y=0$) | Base Rate (Default) | Score $>0.5$ (N) | Defaults in High Score |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Metro (A)** | **Restaurant (A1)** | 1,000 | 800 | **80%** | 500 | 400 |
  | | **Construction (A2)** | 1,000 | 200 | **20%** | 500 | 100 |
  | | *Metro Total* | *2,000* | *1,000* | **50%** | *1,000* | *500* |
  | **Rural (B)** | **Restaurant (B1)** | 1,000 | 200 | **20%** | 500 | 100 |
  | | **Construction (B2)** | 1,000 | 800 | **80%** | 500 | 400 |
  | | *Rural Total* | *2,000* | *1,000* | **50%** | *1,000* | *500* |

  **Headline vs. Subpopulation Metrics**

  The bank ships a classifier that rejects all applicants with Score $>0.5$. Because the score distributions and headline base rates are identical for Metro and Rural, the three fairness criteria hold perfectly at the headline level.
  *   **Calibration:** For both Metro and Rural, the predicted default rate for the "High Risk" bucket is 50% (500 defaults / 1,000 applicants), matching the actual default rate of 50%.
  *   **Equal FPR:** False Positive Rate (Rejecting a Repayer) is 50% for both Metro and Rural (500 good applicants rejected / 1,000 total good).
  *   **Equal FNR:** False Negative Rate (Approving a Defaulter) is 50% for both Metro and Rural (500 bad applicants approved / 1,000 total bad).

  However, apply the same audit to the **subpopulations**. Compare Metro-Restaurant (A1) against Rural-Restaurant (B1).
  *   **Base Rates:** A1 is 80% risk; B1 is 20% risk.
  *   **Error Rates:** Because the score distribution is identical, FPR and FNR remain equal at 50% for both.
  *   **Calibration:** For A1, the model predicts 50% risk but actual risk is 80%. For B1, the model predicts 50% risk but actual risk is 20%. **Calibration fails.**

  The impossibility theorem is triggered not by the model changing, but by the auditor zooming in. At the headline level, equal base rates allow all three criteria to coexist. At the subpopulation level, unequal base rates make the trio mathematically inconsistent. The conflict is indexed to the partition.

  **Three Plausible Variants**

  To satisfy different pairs of criteria at the subpopulation level, the institution must change its data collection and thresholding. These are three models the bank could plausibly ship, each breaking a different constraint at the sublevel.

  1.  **The "Blind" Model (Current):** The bank uses only the credit score.
      *   *Satisfies:* Equal FPR, Equal FNR (at sublevel).
      *   *Violates:* Calibration (at sublevel).
      *   *Cost:* None. The model treats everyone with the same score identically.
  2.  **The "Calibrated FPR" Model:** The bank collects **Industry** data. It sets industry-specific thresholds to ensure Calibration and Equal FPR across subpopulations.
      *   *Mechanism:* To calibrate A1 (80% risk), the model must output 0.8. To calibrate B1 (20% risk), it must output 0.2. To equalize FPR, it adjusts thresholds so the rate of rejecting good applicants matches across A1 and B1.
      *   *Satisfies:* Calibration, Equal FPR.
      *   *Violates:* Equal FNR. (Because base rates differ, equalizing FPR and Calibration forces FNR to diverge).
      *   *Cost:* Requires collecting sensitive industry data; may increase defaults in the low-risk group to match error profiles.
  3.  **The "Calibrated FNR" Model:** The bank collects **Industry** data. It sets thresholds to ensure Calibration and Equal FNR.
      *   *Mechanism:* Thresholds are tuned so the rate of approving bad loans is equal across A1 and B1, while probabilities match true risks.
      *   *Satisfies:* Calibration, Equal FNR.
      *   *Violates:* Equal FPR.
      *   *Cost:* Requires sensitive data; may deny more credit to the low-risk group to match false negative rates.

  **The Feature and the Partition**

  The feature doing the work is **Industry Type**. It is the latent variable that creates the base rate divergence within the headline groups.
  *   **Coarsening:** If the regulator merges Industry back into the Headline (Metro/Rural), the base rates equalize (50/50), and the impossibility result dissolves. All three criteria become jointly satisfiable.
  *   **Refinement:** If the regulator refines the partition further (e.g., "Metro Restaurants owned by veterans"), base rate disparities will likely widen or shift unpredictably, making the three-way conflict more severe and harder to satisfy even with data collection.

  **Steelman: The Counter-Arguments**

  *   **The "Honest Partition" Reply:** A proponent of the impossibility results might argue that the coarse partition (Metro/Rural) is a moral fiction that conceals real disparities. If Metro-Restaurants are being systematically under-calibrated (predicted 50% vs actual 80%), the headline metrics are masking harm. The fine partition is the "honest" one because it aligns with the causal mechanisms of risk (industry volatility), and the impossibility result correctly signals that you cannot have it all when real risk differences exist.
  *   **The "Welfare" Reply:** A second critic might argue the criteria themselves are the error. What matters is whether Metro-Restaurants are better off with the algorithm than under human discretion. If the algorithm increases total credit access while maintaining profit, the failure of "Calibration" is a statistical artifact, not a harm. The impossibility theorem is decisive only if we accept these specific mathematical constraints as proxies for justice, which is a normative, not mathematical, claim.

  **The Selective Label Problem**

  There is a final, practical constraint that renders the formal result silent. In the real setting, the bank **does not observe** $Y$ for rejected applicants. The "True Defaults" in the table above are unobservable in production. They are imputed based on historical data where the bank *did* approve similar cases.

  If the bank's historical policy rejected Metro-Restaurants (A1) at a higher rate than Rural-Restaurants (B1), the observed default rate for A1 is biased downward (only the safest A1 applicants were tested). The "Base Rate" input into the fairness theorem is therefore an artifact of the previous policy.
  *   **The Consequence:** The impossibility result assumes fixed, known base rates. Here, the base rates are **endogenous**. If the bank optimizes the model to satisfy fairness on the *observed* (biased) partition, it reinforces the selection bias, potentially widening the gap in *true* risk.
  *   **Conclusion:** When half the outcome data is missing by construction, the impossibility theorem goes silent. It cannot tell you what is impossible because it cannot tell you what is true. The "conflict" may be a phantom generated by the censoring of the data, yet the institution is forced to optimize against it, creating a Goodhart's Law loop where the fairness metric is gamed while the actual disparity grows.
