answer: |-
  Here is a teaching plan designed for a 40-minute engineering brown-bag. It prioritizes conceptual clarity over technical depth, keeping everything defensible at a whiteboard without citing papers.

  ### 1. The Order of Ideas
  You cannot define "mechanism" until you have established *why* weights and outputs are insufficient descriptors. The sequence must force the audience to feel the gap in their current mental model before you try to fill it.

  1.  **The Blind Spot (5 mins):** Start with the status quo. We monitor outputs (behavior). Show a case where output is normal, but the system is fragile.
      *   *Goal:* Create anxiety about "silent failures."
  2.  **The Code Analogy (5 mins):** Introduce your "Refactor" intuition pump.
      *   *Goal:* Leverage their existing mental model of "implementation details vs. interface."
  3.  **The Carrying Example (10 mins):** Walk through the concrete ML scenario (detailed in Section 2).
      *   *Goal:* Translate the code analogy into tensor operations without getting bogged down in math.
  4.  **Defining "Sameness" (10 mins):** This is the core. Define mechanism as *causal structure*, not numerical values.
      *   *Goal:* Distinguish "Algorithmic Strategy" from "Weight Values."
  5.  **The Measurement Trap (5 mins):** Briefly address why we can't just cluster activations (Misconception D).
      *   *Goal:* Pre-empt tooling questions.
  6.  **Check for Understanding (5 mins):** The mini-exercise.

  **Why this order:** If you open with a definition of mechanism, they will map it to "weights" immediately (Misconception A). By starting with the *failure mode* of behavioral monitoring, you motivate the need for a new definition. By using the code analogy *before* the ML example, you give them a hook to hang the abstract concept on.

  ---

  ### 2. The One Carrying Example
  **Do not use the Digit/Visual example.** It introduces multimodal complexity (images vs. text) that distracts from the core point about *internal routes*.

  **Use the "Lookup vs. Algorithm" Arithmetic Example.**
  It is hypothetical, defensible at a whiteboard, and isolates the variable perfectly.

  *   **The Task:** A model takes two integers (e.g., `17 + 24`) and outputs the sum (`41`).
  *   **The Training Data:** Only pairs where both numbers are < 50.
  *   **Mechanism A (The Lookup):** The model memorizes frequent sums. It treats `17 + 24` as a single token association. It doesn't "add"; it retrieves.
  *   **Mechanism B (The Algorithm):** The model decomposes the numbers into place values (tens/ones), adds columns, and carries the one.
  *   **The Overlap:** On the training distribution (numbers < 50), both mechanisms produce 100% identical outputs.
  *   **The Divergence:** On input `60 + 60`, Mechanism A hallucinates (it hasn't memorized this), while Mechanism B outputs `120`.

  **What it must have:**
  *   Identical outputs on the evaluation set.
  *   Clearly distinct internal logic (Association vs. Decomposition).
  *   A failure mode where one breaks and the other holds.

  **What it must lack:**
  *   Any claim that current LLMs definitely do this (frame it as "Imagine we built a model that...").
  *   Any reliance on specific interpretability tools (don't talk about *how* you found the mechanism, just *that* there are two routes).

  **Why alternatives fail:**
  *   *Sentiment Analysis:* Too fuzzy. "Keyword spotting" vs. "Semantic understanding" is hard to draw on a whiteboard without arguing about what "semantic understanding" means.
  *   *Digit/Visual:* Introduces modalities. Engineers will get stuck on "how does the text encoder talk to the vision encoder?" instead of focusing on the mechanism sameness.
  *   *Real-world bugs:* Too messy. You want a clean, theoretical separation to teach the concept.

  ---

  ### 3. The Misconceptions
  Address these in this specific order. If you address (c) before (a), the conversation dissolves into semantics.

  **(a) "Mechanism = The Weights" (Address in Section 4)**
  *   *The Trap:* "If the weights changed by 0.0001 during fine-tuning, isn't it a different mechanism?"
  *   *The Head-off:* Explicitly state: "Weights are the *physics*; the mechanism is the *logic*. If I replace every transistor in my CPU with a slightly different alloy, the logic gate is still an AND gate."
  *   *Timing:* Bring this up immediately after defining mechanism.

  **(b) "Same Mechanism = Same Behavior" (Address in Section 3)**
  *   *The Trap:* "If the output is the same, why do I care about the path?" (This collapses your session back into behavioral monitoring).
  *   *The Head-off:* Use the Arithmetic Example. "They behave the same *until* they don't. Behavioral monitoring only sees the crash. Mechanistic monitoring sees the engine knocking before the crash."
  *   *Timing:* This is the most critical one. Address it right after the Carrying Example.

  **(c) "Mechanisms have Hard Boundaries" (Address in Section 5)**
  *   *The Trap:* "So is head 4 layer 2 part of the mechanism or not? It has to be binary."
  *   *The Head-off:* "In code, a function call is binary. In ML, contribution is continuous. A head might be 80% responsible for the logic. Sameness is a spectrum, not a boolean."
  *   *Timing:* After you've established what a mechanism is, before you talk about measuring it.

  **(d) "It's Just Clustering Activations" (Address in Section 5)**
  *   *The Trap:* "Can't we just cosine similarity the activation vectors?"
  *   *The Head-off:* "Two different algorithms can produce similar activation norms. Similarity in *space* does not guarantee similarity in *causal structure*."
  *   *Timing:* Near the end, as a "what we are not doing today" boundary.

  **(e) [Fifth Misconception] "Mechanisms are Static" (Address in Closing)**
  *   *The Trap:* "Once we identify the mechanism, we're done."
  *   *The Head-off:* "Mechanisms can morph. A model might start with Mechanism A and slowly drift toward Mechanism B over millions of tokens. Monitoring is tracking that drift."
  *   *Timing:* In the final Q&A buffer or closing remarks.

  ---

  ### 4. The Status of Your Pet Analogy
  **Verdict:** The "Refactor/Inline" analogy is **load-bearing**. It is the best bridge you have. Do not discard it. However, it is dangerous if left unbroken.

  **Where to use it:**
  Use it in **Section 2 (The Code Analogy)**.
  *   *Pitch:* "If I refactor `calculate_tax()` to use a new library but the tax bill is identical, did the behavior change? No. Did the implementation change? Yes. If that new library has a bug on leap years, our tests won't catch it unless we check the implementation."
  *   *Mapping:* `calculate_tax` = Model Output. `New Library` = New Internal Circuit. `Leap Year Bug` = Out-of-Distribution Failure.

  **Where and How to Break it:**
  You must break it in **Section 5 (Defining Sameness)** when addressing Misconception (c).
  *   *The Break:* "In code, you either called the helper function or you didn't. It's discrete. In a neural net, the 'helper function' is smeared across millions of parameters. One run might use 90% of the old circuit and 10% new. Is that a refactor or a rewrite?"
  *   *The Lesson:* "In code, sameness is binary. In ML, sameness is a **percentage of causal overlap**. We are looking for significant drift in that percentage, not a boolean flip."

  If you don't break the analogy there, they will spend the Q&A asking how to find the exact "function boundary" in the weights, which doesn't exist.

  ---

  ### 5. Check for Understanding
  Do not ask "Any questions?" Ask a forced-choice scenario. Put this on the final slide.

  **The Scenario:**
  > "We deployed a v2 model. On our standard eval set, accuracy is identical to v1.
  >
  > **Alert 1:** The average activation norm in Layer 5 has shifted by 15% compared to v1.
  > **Alert 2:** The model now solves a specific subset of logic puzzles using a attention pattern we never saw in v1, though the answers are still correct.
  >
  > **Question:** Which alert is a *Mechanistic* Anomaly? Which is just *Statistical* Drift? Why?"

  **The Correct Answer:**
  *   **Alert 1 is Statistical Drift (Not necessarily mechanistic).** Activations can shift scale (norm) without changing the *direction* or *logic* of the computation (like turning up the volume on a song). Same mechanism, different gain.
  *   **Alert 2 is Mechanistic Anomaly.** The *route* changed. Even if the answer is right today, the reliance on a new, unevaluated circuit is the risk.

  **Why this works:** It forces them to distinguish between "numbers changed" (Activation Norm) and "logic changed" (Attention Pattern/Route). It validates the entire session's thesis.

  ---

  ### 6. What to Openly Refuse to Cover
  You must put a "Out of Scope" slide up front or early. If you don't, the safety researchers in the room will ask about SAEs (Sparse Autoencoders) and the backend engineers will ask about latency overhead.

  **The "We Are Not Doing This Today" List:**
  1.  **How to extract mechanisms:** We are not discussing Probing, Causal Tracing, or SAEs. We are defining *what* we are looking for, not *how* to build the microscope.
  2.  **Specific Tooling:** We are not evaluating vendors or libraries.
  3.  **Philosophical Consciousness:** We are not discussing whether the model "understands" the math. We are discussing whether it uses the same circuit.
  4.  **The Metric Threshold:** We are not deciding today if a 10% circuit drift is an alertable offense. That requires empirical tuning.

  **Script for the Boundary:**
  > "I know many of you want to know which library implements this, or exactly how we mathematically prove two circuits are isomorphic. I cannot answer that in 40 minutes, and frankly, the field doesn't have a settled answer yet. Today is about agreeing on *what constitutes an alert*, so we don't build monitoring for the wrong thing."

  ### Summary of the "Same Mechanism" Definition for Your Whiteboard
  Since you need to derive this yourself, here is the crisp definition to aim for by the end of Section 4:

  > **"Two runs use the 'Same Mechanism' if the output is produced by the same causally sufficient subgraph of computation, regardless of numerical noise in the weights or activations."**

  *   *Causally Sufficient:* If you ablate (zero out) this part, performance drops.
  *   *Subgraph:* It's a specific path through the layers/heads.
  *   *Regardless of Numerical Noise:* Weights can wiggle, activations can scale, as long as the *information flow path* remains invariant.

  This gives you a defensible, engineering-centric definition that avoids philosophy but captures the safety team's requirement.
