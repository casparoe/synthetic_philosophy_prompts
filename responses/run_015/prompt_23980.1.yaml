answer: |-
  Here is your Q&A prep sheet. The objections are ordered by how much damage they can do to your specific thesis (Unified Semantics/Pragmatic Distinction) in front of this specific audience.

  ### 1. The "Stalnaker Minimal Pair" (The Oswald Case)
  **Who asks:** The Senior Semanticist (Stalnaker-Lewis camp)
  **The Objection:** "You claim there is only one conditional with one set of truth conditions. But consider Stalnaker's famous pair: (1) *If Oswald didn't kill Kennedy, someone else did* (True), and (2) *If Oswald hadn't killed Kennedy, someone else would have* (False). The antecedents and consequents are effectively the same, yet they have different truth values. If the conditional operator is identical, what in your semantics accounts for the divergence in truth value without admitting two different semantic mechanisms?"

  *   **Concede:** Admit that the truth values *do* diverge in these cases. Do not try to argue they are the same.
  *   **Hold:** Hold that the divergence comes from the *modal base* (the set of worlds we are quantifying over), not the *conditional operator* itself.
  *   **Reply (2 mins):** "That's the crucial data point, and I agree the truth values diverge. But divergence in truth value doesn't entail two different *conditional operators*. On a Kratzerian unified view, the 'if' is just a restrictor on a modal. The difference between (1) and (2) isn't the 'if'; it's the modal base supplied by the mood. The indicative accesses the *epistemic* modal base (what we know), while the counterfactual accesses a *metaphysical* or *historical* base (closest worlds where history differs). The 'work' is being done by the mood's presupposition on the context, not by a semantic ambiguity in the conditional connective. So, the conditional relation is invariant; the inputs to that relation shift pragmatically based on speaker expectation."

  ### 2. The Sobel Sequence Challenge
  **Who asks:** A Dynamic Semanticist
  **The Objection:** "Sobel Sequences show that counterfactuals are dynamically sensitive in ways indicatives aren't. I can say: *If Sophie had gone to the parade, she would have seen Pedro. But if Sophie had gone and been stuck behind a tall person, she wouldn't have seen him.* This is consistent. But try that with indicatives: *If Sophie goes, she sees Pedro. #But if Sophie goes and is stuck behind a tall person, she won't.* If the semantics are unified, why do the dynamic update properties differ so radically?"

  *   **Concede:** Concede that the *acceptability* patterns differ in discourse sequences.
  *   **Hold:** Hold that this is a fact about *accommodation*, not semantics.
  *   **Reply (2 mins):** "The difference here is about how easily we accommodate a shift in the context. Counterfactuals explicitly signal we are leaving the actual epistemic state, so we are happy to shift the 'closest world' metric mid-discourse. Indicatives, however, are anchored to our current knowledge state. When you try to shift the epistemic base in the second indicative sentence, it clashes with the rigid anchor established in the first. This isn't a difference in the conditional operator's logic; it's a pragmatic constraint on how we update the common ground. The 'if' remains the same restrictor; the rules for updating the domain it restricts are what differ."

  ### 3. The Probabilist's Trap (Adams' Thesis & False Antecedents)
  **Who asks:** One of the Probabilists
  **The Objection:** "We live by Adams' Thesis: $P(\text{If } P, Q) = P(Q|P)$. But that ratio is undefined when $P$ is known to be false. Counterfactuals are *specifically* used when $P$ is known false. If you unify them, do you abandon Adams' Thesis for counterfactuals? If so, you lose the probabilistic account. If not, how do you calculate a conditional probability on a probability-zero event?"

  *   **Concede:** Concede that the standard ratio formula ($P(Q \cap P) / P(P)$) breaks for known-false antecedents.
  *   **Hold:** Hold that Adams' Thesis is a thesis about *assertibility*, not truth-conditional probability, and requires 'imaging' for counterfactuals.
  *   **Reply (2 mins):** "I don't think we need to abandon the probabilistic intuition, but we do need to refine the mechanism. For indicatives, standard conditionalization works because we are uncertain about $P$. For counterfactuals, where $P$ is probability zero in our current space, we aren't conditionalizing; we are *shifting* the probability mass. We use Lewis's 'imaging' or a similar world-shifting function to assign non-zero probability to $P$ in a shifted space, then conditionalize there. The unified claim is that 'If' always tells us to conditionalize; the mood tells us *which probability space* we are conditionalizing over. The math changes inputs, not the operator."

  ### 4. The Morphology Argument ("Fake Past")
  **Who asks:** A Formal Semanticist (Syntax-Semantics Interface)
  **The Objection:** "You call the mood a 'pragmatic marker.' But the past tense morphology in counterfactuals ('If it rained') is syntactically active. It binds variables and scopes over the modal. If the morphology is doing semantic work to shift the world variable, isn't that, by definition, a semantic distinction? You're just moving the semantics from the 'if' to the tense, which seems like a distinction without a difference."

  *   **Concede:** Concede that the morphology has semantic *effects*.
  *   **Hold:** Hold that the effect is a *presupposition* on the context, not a change to the conditional's truth-conditional content.
  *   **Reply (2 mins):** "It's a subtle distinction, but vital. A semantic ambiguity would mean 'if' has two lexical entries. My claim is that 'if' has one entry. The past tense morphology triggers a presupposition that the actual world is not in the set of worlds under consideration. That restricts the domain of quantification. But the *relation* between antecedent and consequent—the conditional claim itself—remains invariant. We shouldn't confuse the *domain restriction* (which mood handles) with the *conditional operator* (which is unified). The semantics of the *tense* is distinct, but the semantics of the *conditional* is not."

  ***

  ### The "Embarrassing Question"
  **Hope nobody asks:** *"Can you write down the Logical Form?"*

  **Why it's embarrassing:** You are arguing against formal semanticists using a pragmatic thesis. If they ask you to formalize your "unified conditional" in their framework (e.g., in a type-theoretic syntax or a specific modal logic), and you cannot produce an LF that shows how the mood interacts with the 'if' without smuggling in a semantic distinction, you will look like you are hand-waving.

  **If they ask it:**
  "Don't have a full formal implementation ready for this workshop—that's the next stage of the project. But the rough idea is a single conditional operator $>$, where the mood contributes a presupposition on the modal base $f(w)$, such that Indicative requires $w \in f(w)$ and Counterfactual requires $w \notin f(w)$. The operator $>$ remains constant." (Then stop talking. Do not try to derive truth conditions on the board).
