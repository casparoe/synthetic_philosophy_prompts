answer: |-
  This is not a verbal disagreement. It is a **substantive disagreement about the ontology of harm**, masked as a semantic debate over the utility of a label.

  You are arguing from **Moral Realism**; your roommate is arguing from **Legal Instrumentalism**. You are talking past each other because you disagree on what the word "genocide" is *for*.

  Here is the diagnosis.

  ### 1. The Core Conflict: Constitutive vs. Regulatory
  Your roommate views the term "genocide" as a **regulatory mechanism**. In this view, the definition exists to trigger specific consequences (prosecution, intervention, reparations). If the definition is too broad, the mechanism jams (false positives, political gridlock). Therefore, the narrowing of the UN Convention was a necessary, if cynical, calibration to make the tool usable. For her, if the label doesn't change the legal outcome, it is merely rhetoric.

  You view the term "genocide" as a **constitutive moral truth**. In this view, the label describes a specific ontological reality: the destruction of a group *as a distinct moral patient*. You are arguing that the harm done to a "group" is not reducible to the sum of harms done to individuals. For you, the label is a form of truth-telling that obligates the world morally, regardless of whether a tribunal is convened.

  **The Diagnosis:** This is a **bedrock intuition about collective identity**.
  *   **Roommate:** Implicitly holds a *methodological individualist* view. A group is a fiction; only individuals suffer. Therefore, "genocide" is just a shorthand for "mass murder with specific intent," and its value is purely procedural.
  *   **You:** Hold a *collectivist* view. A group has a moral status distinct from its members. Destroying the group's capacity to reproduce its culture/identity is a unique evil that persists even if individual mortality is low (e.g., forced assimilation).

  ### 2. The Speech Act Mismatch
  You asked if you are using the word for different speech acts. **Yes.**
  *   **Roommate:** Uses "genocide" as a **Verdict**. It is the final step of a judicial process. To call something genocide before a court ruling is premature or inflammatory.
  *   **You:** Use "genocide" as a **Warning** or **Witness**. It is the *start* of a moral reckoning. To wait for a legal verdict is to abdicate moral responsibility.

  This is why the debate stalls. She thinks you are trying to hack the legal system with emotional language; you think she is hiding behind legal technicalities to avoid moral clarity.

  ### 3. The Case Study That Could Move It: "Cultural Genocide"
  The specific point of friction you mentioned—Indigenous boarding schools—is the exact wedge needed to resolve this.

  **The Distinction:** **Physical-Biological Genocide** vs. **Cultural Genocide**.
  Raphael Lemkin's original concept included the destruction of language, culture, and institutions. The UN Convention (1948) explicitly **removed** cultural genocide due to pressure from colonial powers (including the US, UK, and France) who feared their own assimilation policies would be criminalized.

  **Apply this to the Residential Schools:**
  *   **Roommate's Test:** If we call Residential Schools "genocide," what legal mechanism triggers? There is no international court for "cultural genocide." The UN Convention doesn't cover it. Therefore, using the word is legally imprecise and politically inflammatory without utility.
  *   **Your Test:** Did the intent exist to destroy the group *as such* by severing intergenerational transmission of identity? Yes. Therefore, the moral reality is genocide, regardless of the 1948 political compromise that excluded it from the statute.

  **The Resolution:**
  The stalemate exists because **both of you are right about different domains.**
  *   She is right **historically and legally**: The UN definition was politically narrowed to protect state sovereignty, and using the term outside that narrow definition does not trigger the ICC.
  *   You are right **sociologically and morally**: The "stalling" you observe happens because states know that admitting to the *moral* reality of genocide (even without the legal label) creates an obligation for restitution that they wish to avoid.

  ### 4. Is the Question Ill-Posed?
  No. But it is **category-confused**.
  You are asking a moral question ("Is this an atrocity against a group?") and expecting a legal answer ("Will the UN intervene?"). The gap between those two categories is where the politics live.

  **How to settle the argument:**
  Acknowledge that there are **two concepts** sharing one word:
  1.  **Juridical Genocide:** The narrow UN definition. It is a tool for prosecution. Your roommate is right that this is politically constrained and narrow.
  2.  **Sociological Genocide:** The Lemkinian/Broad definition. It is a tool for historical and moral classification. You are right that this captures the unique harm of group destruction.

  **The Move:**
  Tell your roommate: *"You are treating 'genocide' as a charge sheet. I am treating it as a diagnosis. We can agree that the UN definition is politically compromised (you win the history point) without agreeing that we are morally forbidden from using the broader term to describe structural destruction like boarding schools (I win the moral point)."*

  If she agrees that the moral label has value *even without* a tribunal, you have resolved the ontology. If she insists the word is *meaningless* without a tribunal, then your disagreement is indeed bedrock: she believes morality requires enforcement to be real; you believe morality exists independently of enforcement. That is a deeper philosophical rift you won't solve over drinks, but at least you'll know where the fault line lies.
