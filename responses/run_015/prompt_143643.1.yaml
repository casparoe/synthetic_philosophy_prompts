    "situational_variable": "Visual access to applicant distress (video call vs. email in noisy hub)",
    "virtue_reading": "Context occluded moral perception, preventing virtue activation rather than proving its absence",
    "situationist_reading": "Behavior fragmented by trivial cues, indicating no stable global trait exists",
    "work_feature": "Moral Salience (dependence of moral response on perceptual clarity)",
    "collapse_condition": "If moral perception were context-invariant, the virtue explanation for inconsistency would fail",
    "virtue_defense": "Virtue responds to reasons that require specific conditions to be perceived via practical wisdom"
  }
  ```
