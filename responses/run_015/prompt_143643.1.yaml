answer: |-
  Elena manages a community grant fund and sincerely believes she possesses a stable character of generosity. During video calls, where she maintains eye contact with applicants' faces on her screen, she patiently listens to hardships and approves extra support, feeling deeply moved by their plight. However, when handling identical requests via email threaded through a noisy open-office hub where she cannot see the applicants, she responds with curt rejections and irritation, citing protocol strictly. She remains convinced her core nature is kind, attributing the blunt emails to "being busy," never noticing that her empathy seems to switch off precisely when visual cues of suffering are removed from her immediate perceptual field.

  ### Walkthrough

  **Behavior and Method:** Elena's actions are recorded across two channels: video (compassionate) and email/noise (callous). Her self-reporting remains constant ("I am kind"), creating a conflict between her self-conception and her behavioral data.

  **Nearby Worlds:** Consider a nearby world where the email interface includes a profile photo of the applicant. If Elena becomes kind in this world, it suggests the trait exists but requires visual salience. If she remains callous, it suggests the medium itself dictates the behavior regardless of content.

  **Verdicts:** The situationist argues that because the behavioral output flips on a trivial cue (video vs. text), there is no global trait of "generosity," only fragmented responses to environmental stimuli. The virtue ethicist argues that virtues are not robotic outputs but dispositions to respond to reasons; if the noise and lack of visual data obscure the moral reason (the suffering), the virtue is not absent, merely occluded.

  **Conceptual Feature:** The feature doing the work is **Moral Salience**. The situationist sees salience as irrelevant to the existence of the trait, while the virtue ethicist sees salience as a necessary condition for the trait's activation.

  **Collapse Condition:** If you remove the dependency on moral salience (assuming a virtuous agent perceives moral reasons equally well in all contexts), the virtue ethicist's explanation collapses, and the behavior looks like pure situationist determinism.

  **Virtue Defense:** A virtue defender pushes back by arguing that practical wisdom requires accurate perception of the particular situation. If the context degrades perception (like noise or lack of eye contact), the agent isn't failing to be virtuous; they are failing to see the demand for virtue, which is a different failure than lacking the character itself.

