      *   **Stalinesque Revision:** Falsification *before* consciousness. The brain constructs the false memory/experience *before* it enters conscious awareness. It's like a staged show where the audience only sees the final product. (Analogy: Airbrushing photos *before* publication).
      *   **Orwellian Revision:** Falsification *after* consciousness. The brain consciously experiences the raw data (two flashes), but memory immediately rewrites it to match expectations. It's like rewriting history books *after* the event. (Analogy: 1984 style).
      *   **Daniel Dennett's View:** He argues the distinction is illusory or at least impossible to distinguish empirically in this context. He uses this to attack the "Cartesian Theater."
      *   **Cartesian Theater:** The idea that there is a specific place/time in the brain where "it all comes together" and consciousness happens (a central observer). Dennett argues against this (Multiple Drafts Model).
