answer: |-
  There is no single canonical term, but the phenomenon is best identified as **Evidentiary Hardening**, a specific subtype of reification where methodological limitations calcify into historical facts through caveat erosion.

  This occurs because existing terminology captures only fragments of the process: **Survivorship Bias** explains why the data is skewed initially, but not how writers interpret it; **Argument from Silence** describes the logical fallacy but implies intent rather than iterative drift; and **Citation Drift** describes the changing meaning but not the specific ontological shift from "missing record" to "record of absence." **Evidentiary Hardening** names the specific trajectory where a conditional statement ("no record exists") loses its modality over successive citations until it becomes a categorical fact ("nothing happened").

  The line between harmless shorthand and dangerous distortion depends on whether the claim *relies* on the silence. It is harmless if the caveat is dropped for brevity but the conclusion stands on positive evidence elsewhere (e.g., "District B was quiet" when tax records show stability). It is worrying when the silence *is* the evidence (e.g., "District B was pacified" proven only by the lack of rebellion reports). The former is compression; the latter is fabrication by attrition.

  To check for this before leaning on a secondary source, trace the claim back to its first appearance in the literature and look for **modal decay**. If the original source uses conditional language ("suggests," "no record of," "appears") and your source uses declarative language ("shows," "did not," "was"), you are witnessing hardening. Then, verify the archival condition: check finding aids for gaps, fire logs, or technical metadata (like OCR confidence scores) to confirm whether the silence is historical or artifactual. If the negative claim rests entirely on a gap that the original author flagged as uncertain, treat the fact as unproven.
