      2.  Diagnosis of the "Gap" (Coordination vs. Cooperation).
      3.  Placement of the Sanction Clause (Modifying Conditional Preference).
      4.  Addressing Overgeneration (The Arbitrariness Constraint).
      5.  Addressing Emergence (Static vs. Dynamic).
      6.  Conclusion/Recommendation.

      *(Wait, one more nuance)*: Lewis *does* mention sanctions in *Convention*, but treats them as secondary. He says conventions *can* be supported by sanctions, but the *definition* doesn't require them. The user wants to *require* them. This is a significant departure. I need to highlight this.

