      *   Avoid being dismissive of the user's idea (it's a common and valid critique of Lewis), but be firm on the technical distinctions.
      *   Ensure the distinction between *Convention* and *Social Norm* is clear.

  7.  **Final Polish:** Check against the prompt requirements.
