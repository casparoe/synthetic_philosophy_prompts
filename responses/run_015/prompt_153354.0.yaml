      *(Self-Correction during drafting)*: I need to be careful not to tell them "Lewis is wrong, use Bicchieri." I need to help them amend *Lewis* if possible, or explain why amending Lewis effectively creates a new category. The prompt asks "Which of the conditions above should my sanction clause be read as extending?" I should answer that directly first, then offer the critique.

      *Decision:* I will advise that the clause modifies the *conditional preference* condition, but warn that doing so shifts the account from a Coordination Game to an Assurance Game or PD-with-sanctions. I will validate the colleague's concern about overgeneration but suggest a way to constrain it (the "arbitrariness" condition is the key filter).

  8.  **Final Structure:**
