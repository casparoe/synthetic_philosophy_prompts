answer: |-
  It is a pleasure to engage with this problem. You are tackling one of the most persistent tensions in the literature: the gap between Lewisian *conventions* (solutions to coordination problems) and what later theorists like Ullmann-Margalit, Elster, and Bicchieri call *social norms* (solutions to cooperation problems involving conflict of interest).

  Per your request, I will begin by restating the account you are working with to ensure we are aligned, then I will analyze where your proposed amendment fits, and finally, I will address the objection regarding overgeneration.

  ### 1. Restatement of the Lewisian Account

  Based on your description, you are working with the standard received view of David Lewis's account from *Convention: A Philosophical Study* (1969). Let me restate it in my own terms to confirm our alignment.

  On this view, a convention is a **solution to a recurrent coordination problem**. It is a behavioral regularity $R$ in a population $P$ such that:
  1.  **Conformity:** Almost everyone conforms to $R$.
  2.  **Expectation:** Almost everyone believes that almost everyone else conforms to $R$.
  3.  **Conditional Preference:** Almost everyone has a preference to conform to $R$ *on the condition* that almost everyone else does (because $R$ constitutes a coordination equilibrium; if others do it, I want to do it to avoid coordination failure).
  4.  **Generality:** There is a general preference for general conformity to $R$ over slightly-less-than-general conformity (we all benefit if we are all on the same page).
  5.  **Arbitrariness:** There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well (e.g., driving on the left vs. the right).
  6.  **Common Knowledge:** Conditions 1–5 are common knowledge among the members of $P$.

  Crucially, in Lewis's pure cases, the incentive to conform is **intrinsic to the coordination itself**. I drive on the right not because I fear you will glare at me for driving on the left, but because if you drive on the right and I drive on the left, we crash. The "punishment" is the natural consequence of non-coordination, not a social sanction imposed by third parties.

  ### 2. Diagnosing the Gap

  Your intuition is correct: Lewis's account struggles with cases like queueing or stopping at red lights in the absence of traffic. In these cases, the underlying game is often not a pure Coordination Game, but a **Prisoner's Dilemma** or a **Chicken Game**.

  *   **Queueing:** If everyone queues, we are all served fairly. If I cut and no one else does, I gain time (defection payoff). If everyone cuts, chaos ensues. Here, I do *not* have a conditional preference to queue simply to coordinate; I have a preference to queue only if I believe others will punish me for cutting.
  *   **The Gap:** Lewis assumes the preference to conform exists *because* others conform (coordination). You are observing cases where the preference to conform exists *because* others will *sanction* non-conformity.

  ### 3. Where to Insert the Sanction Clause

  You asked which condition your sanction clause should extend. It must modify **Condition 3: The Conditional Preference**.

  In Lewis's original formulation, the preference is conditional on *behavioral expectations* ("I conform because I expect you to conform"). In your amended account, the preference is conditional on *sanctioning expectations* ("I conform because I expect you to punish me if I deviate").

  **Proposed Amendment:**
  Modify Condition 3 to read: *Each agent has a reason to conform conditional on the others conforming, **sustained by the expectation that third parties will impose costs on deviators**.*

  However, I must urge caution here. By making sanctions a *necessary condition* (a "seventh condition" as you proposed, or a modification of the third), you fundamentally alter the game theoretic structure. You are moving from a **Coordination Equilibrium** to a **Normative Equilibrium**.

  ### 4. Addressing the Overgeneration Objection

  Your colleague is right to worry about overgeneration, but perhaps for slightly different reasons than you suspect. The risk is not that you will include "fragile" norms, but that you will include **coerced regularities** that lack the "arbitrariness" essential to convention.

  **The Colleague's Worry:**
  If *any* regularity sustained by sanctions counts as a convention, then a mafia protection racket ("pay us or we break your legs") becomes a convention. A totalitarian law ("stop at this checkpoint or be shot") becomes a convention. These are regularities sustained by third-party costs, but they do not feel like *conventions*.

  **Why Lewis Excluded Sanctions:**
  Lewis excluded sanctions from the *definition* precisely to distinguish conventions from laws and coerced habits. For Lewis, if the only reason you conform is fear of punishment, you aren't participating in a convention; you are being compelled.

  **How to Save Your Account:**
  To avoid overgeneration while capturing queueing/red lights, you must ensure the sanction clause does not do *all* the work. The sanction must be the mechanism that sustains a **coordination preference**, not the sole source of the preference.

  I recommend you frame the sanction clause not as a *replacement* for Lewis's conditional preference, but as the **mechanism that transforms the payoff structure** to make the Lewisian conditions possible.

  In queueing, the underlying game is a Prisoner's Dilemma (I prefer to cut). The social sanctions (glares, shame) change the utility function so that *Cutting + Shame* yields lower utility than *Queuing + No Shame*. Once the sanctions are in place, the game *becomes* a Coordination Game (or an Assurance Game).

  **Revised Recommendation:**
  Do not add a seventh condition. Instead, refine **Condition 5 (Arbitrariness)** and **Condition 3 (Preference)**.

  1.  **Refine Condition 3:** Agents conform because they prefer the equilibrium supported by sanctions to the disorder of non-conformity.
  2.  **Hold Firm on Condition 5 (Arbitrariness):** This is your firewall against overgeneration. In a mafia racket, there is no alternative regularity (you cannot pay the *left* hand instead of the *right* hand). In queueing, we *could* have adopted a ticket-number system, or a "elders first" system. The regularity is still arbitrary.

  If your definition requires **Arbitrariness + Sanction-Sustained Coordination**, you avoid the mafia case (not arbitrary) and the traffic law case (often not arbitrary if safety is the only goal, though the *side* of the road is arbitrary).

  ### 5. On Emergence and Stability

  You mentioned wanting this clause to explain how the regularity gets started ("a few punishers punish... snowballs").

  Here, you are stepping outside Lewis's static definition into **evolutionary game theory** (e.g., Brian Skyrms, *The Evolution of the Social Contract* or H. Peyton Young, *Individual Strategy and Social Structure*). Lewis was notoriously vague on emergence; he assumed common knowledge and rationality could simply "select" an equilibrium.

  Your "snowball" story is an **evolutionary dynamic**, not a definitional condition.
  *   **Advice:** Do not put the emergence story *inside* the definition of convention. Keep the definition static (what *is* a convention?) and use the sanction clause to explain the *stability* and *evolution* in the body of your paper.
  *   If you build the emergence story into the definition, you risk excluding conventions that emerged historically but are now maintained by habit alone (where the punishment threat has faded, but the expectation remains).

  ### 6. Summary Recommendation

  To draft a philosophically robust paper that respects Lewis while capturing your target cases:

  1.  **Acknowledge the Distinction:** Explicitly state that you are bridging Lewis's *Conventions* with the later literature on *Social Norms* (specifically Cristina Bicchieri's work on empirical vs. normative expectations is vital here).
  2.  **Modify Condition 3, not 7:** Integrate the sanction threat into the **Conditional Preference**. The preference to conform is conditional on the expectation that *others expect me to conform and will sanction me if I do not*.
  3.  **Use Arbitrariness as a Constraint:** To answer your colleague, insist that **Arbitrariness** remains a necessary condition. This prevents "overgeneration" by excluding coerced regularities where no alternative equilibrium was possible.
  4.  **Separate Definition from Dynamics:** Keep the "snowball" emergence story as an explanatory model for *how* the convention stabilizes, rather than a condition for *being* a convention.

  By framing sanctions as the **transformative mechanism** that turns a Cooperation Problem into a Coordination Problem, you preserve the Lewisian core while accounting for the normative force of queueing and red lights. You are not changing the definition of convention; you are explaining how certain conventions *become* possible in populations where pure coordination interests are insufficient.
