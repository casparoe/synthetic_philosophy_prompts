prompt: |-
  Hey — picture this. You're advising a small but serious foundation that has maybe $40m to spend over five years on one thing: making the people who hold legislative power in a mid-sized parliamentary democracy less like a professional political class. They've decided up front to spend only on institutional design — the rules about who gets to sit in the legislature and for how long — not campaign finance, not media, not civic education. And they'd rather fund eight or ten people thinking hard for three years than run an advocacy campaign, because they think the advocacy is premature until the design questions are less murky. The boards patience is limited, so they want an agenda, not a survey.

  Here's the menu they keep circling around:

  1. Sortition: replace one chamber with a randomly selected assembly, redrawn regularly.
  2. Hard term limits: two or three terms and you're out.
  3. A third thing nobody has a settled name for, so call it lottery retirement: at each election a randomly chosen fifth of sitting members are barred from standing again. Being a career politician stays possible, but it becomes a gamble you can lose through no fault or failure of your own.
  4. Cohort overlap: only half the sortitioned chamber is replaced each cycle, so there's some institutional memory — at the cost of some freshness.
  5. Sortition with a secretariat behind it, where continuity comes from permanent expert staff who brief each new cohort, frame the options and draft the text. Depending on your view that's institutional wisdom without careerism, or careerism relocated to people nobody voted for and nobody sortitioned.

  Assume, just for the sake of argument, something that seems roughly true of citizen assemblies where they've been tried: they do noticeably better than elected bodies on long-horizon stuff like pensions and climate, and noticeably worse at anything requiring them to say no to a loud, organized group right now — and members defer a lot to whoever briefs them.

  So: what are the open questions here that actually deserve the money, in what order, and why? I care much more about the reasoning than the list. For each question tell me what else depends on it — which ones are upstream, e.g. do we need to settle what representation even is before we can say whether a random sample represents anybody? — how tractable it is for political theorists, economists, mechanism-design types and people who just think carefully about institutions, as opposed to empirical political scientists running field experiments, and what kind of finding over the next two years would move it up or down the ranking.

  Two things I'd especially like your read on. First: which of the usual claims made for these reforms don't actually follow? The one I keep hearing is that random selection "fixes polarization" because you can't gerrymander a lottery, and I'm not convinced that's even the right mechanism to be looking at. Second: is the secretariat problem the crux that most of the menu implicitly depends on — the thing that decides whether sortition is worth pushing at all — or is it a distraction that only bites in an idealised version of sortition nobody is actually proposing? Relatedly, where does the expertise go under hard term limits (lobbyists, staff, agencies), and does that worry transfer to the lottery versions or not?

  If you think the menu is missing something big, say what and why it should outrank the rest.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Deconstruct the Prompt:**

      *   **Client:** Small, serious foundation ($40m over 5 years).
      *   **Goal:** Reduce the "professional political class" nature of legislators in a mid-sized parliamentary democracy.
      *   **Constraint 1:** Spend *only* on institutional design (rules of entry/tenure), not campaign finance, media, or civic education.
      *   **Constraint 2:** Fund 8-10 thinkers for 3 years (research/design), not advocacy.
      *   **Constraint 3:** Board wants an *agenda*, not a survey. Prioritize open questions.
      *   **The Menu:**
          1.  Sortition (replace one chamber).
          2.  Hard Term Limits.
          3.  Lottery Retirement (random bar on re-running).
          4.  Cohort Overlap (staggered sortition).
          5.  Sortition + Permanent Secretariat.
      *   **Assumption:** Citizen assemblies are better at long-horizon issues, worse at saying "no" to loud groups, members defer to briefers.
      *   **Specific Requests:**
          *   Identify open questions deserving money, in order, with reasoning (upstream/downstream dependencies).
          *   Assess tractability (theory vs. empirics).
          *   Identify findings that would shift rankings.
          *   Critique the claim: "Sortition fixes polarization because you can't gerrymander a lottery."
          *   Analyze the "Secretariat Problem": Is it the crux or a distraction? Where does expertise go under term limits vs. sortition?
          *   Identify missing menu items.

  2.  **Initial Assessment & Strategy:**

      *   *The Core Tension:* The foundation wants to break the "professional class" but is limited to *institutional design*. This is a hard constraint because the professional class exists *because* of the complexity of governance. Removing them without removing the complexity creates a vacuum filled by unelected bureaucrats or lobbyists (the Secretariat Problem).
      *   *The Budget:* $40m is significant for research but tiny for implementation. It buys deep thinking, modeling, and constitutional drafting, not pilot programs.
      *   *The Context:* Parliamentary democracy. This is crucial. Unlike presidential systems (separation of powers), parliament relies on confidence. A sortition chamber in a parliament creates a massive stability problem (who forms the government?).
      *   *The "Polarization" Claim:* The prompt suspects this is weak. I need to validate that. Polarization isn't just about district lines; it's about social sorting and incentive structures.
      *   *The "Secretariat" Claim:* This is likely the bottleneck. If citizens defer to staff, have you really changed power dynamics?

  3.  **Drafting the Agenda (The "Upstream" Questions):**

      *   *Question 1: The Function of the Legislature.* Before changing *who* sits there, we must define *what* they do. In a parliament, the legislature chooses the executive. Can a sortition body do this? If not, is it a veto chamber? A deliberative only body?
          *   *Upstream:* Everything depends on this.
          *   *Tractability:* High for theorists, low for empiricists (no real-world examples of sortition parliaments).
      *   *Question 2: The Expertise Vacuum (The Secretariat).* If we remove careerists, who writes the laws? If it's staff, are they accountable?
          *   *Upstream:* Depends on Q1 (what functions remain).
          *   *Tractability:* Medium. Comparative bureaucracy studies exist.
      *   *Question 3: Incentive Compatibility.* Why would a lottery member show up? Why would a term-limited member care about the long term if they are leaving?
          *   *Upstream:* Depends on Q1 & Q2.
          *   *Tractability:* High (Mechanism design/Econ).

  4.  **Addressing Specific Requests:**

      *   *Polarization Claim:* Gerrymandering is a minor driver compared to partisan sorting and primary incentives. Sortition changes the *composition*, not necessarily the *social cleavages*. A random sample reflects societal polarization. It might reduce *elite* polarization, but not necessarily *affective* polarization.
      *   *Secretariat Problem:* It is the crux. If the staff writes the bills, the staff rules. Under term limits, expertise migrates to lobbyists/agencies. Under sortition, it migrates to the secretariat. The risk is higher in sortition because the members start from zero knowledge.
      *   *Missing Menu Item:* **Hybrid Bicameralism with Asymmetric Powers.** You can't just swap a chamber. You need to define the relationship. Also, **Recall Mechanisms** (a check on sortition/term-limits). But the biggest missing piece is **The Executive Interface**. How does a random legislature interact with a partisan Prime Minister?

  5.  **Refining the Argument (Iterative Process):**

      *   *Critique of the Menu:* The menu treats the legislature as a monoculture. In a parliamentary system, the "government" sits in the legislature. A sortition chamber breaks the confidence convention. This needs to be the first hurdle.
      *   *Prioritization:*
          1.  **Constitutional Compatibility (Parliamentary vs. Sortition).** If it doesn't fit the system, nothing else matters.
          2.  **The Knowledge/Power Interface (Secretariat vs. Lobbyists).** This addresses the "professional class" replacement.
          3.  **Incentive Structures (Term Limits vs. Lottery Retirement).** Which actually reduces careerism without causing chaos?
      *   *Tractability:* Theoretical work is needed first. Empirics are impossible (no data). So fund theorists and legal scholars, not political scientists looking for data.
      *   *Findings that shift rankings:* If a model shows sortition leads to legislative gridlock in a parliamentary system, drop Sortition. If data shows term limits increase lobbyist power significantly, downgrade Term Limits.

  6.  **Developing the Response Structure:**

      *   **Executive Summary:** Acknowledge the ambition, highlight the parliamentary constraint (the "Elephant in the Room").
      *   **The Research Agenda (3 Core Questions):** Ordered by upstream dependency.
          *   Q1: The Executive-Legislative Interface (Parliamentary Compatibility).
          *   Q2: The Epistemic Infrastructure (Secretariat vs. Lobbyists).
          *   Q3: The Careerist Incentive (Term Limits vs. Lottery Retirement).
      *   **Addressing the Specific Claims:**
          *   Polarization (Debunking the Gerrymander myth).
          *   Secretariat (Confirming it as the Crux).
      *   **The Missing Menu Item:** The Executive Interface / Confidence Mechanism.
      *   **Conclusion:** Final recommendation on allocation.

  7.  **Fleshing out the Content (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just say "Parliamentary systems are hard." I need to frame it as a research question: *Can a sortition chamber coexist with a confidence-based executive?*
      *   *Refining the Secretariat point:* It's not just about who writes the text. It's about *agenda setting*. If the secretariat frames the options (as the prompt admits), they hold the veto power.
      *   *Refining Polarization:* Sortition might reduce *partisan* polarization (no parties in the chamber?) but might reveal *demographic* polarization. The claim "you can't gerrymander a lottery" is true but irrelevant if the society is sorted.
      *   *Budget:* $40m is enough for a dedicated institute. Suggest creating a "Commission on Legislative Design."

  8.  **Final Polish:** Check tone. Needs to be serious, analytical, slightly skeptical but constructive. Avoid advocacy language. Focus on *mechanism design*. (Ensure I answer the "what finding would move it up/down" for each question).

      *(Self-Correction on "Lottery Retirement"):* This is an interesting hybrid. It keeps the election but adds randomness. It's less disruptive than full sortition. Does it solve the careerist problem? Maybe. It makes tenure uncertain. Research needed on risk aversion among politicians.

      *(Self-Correction on "Missing Item"):* The prompt asks about institutional design. The biggest missing piece is **Party Discipline**. In parliamentary systems, MPs vote the party line. If you sortition MPs but keep party discipline, nothing changes. If you ban parties, you break the system. This is crucial. I must add this.

  9.  **Final Review against constraints:**
      *   $40m/5 yrs context? Yes.
      *   Institutional design only? Yes.
      *   8-10 thinkers? Yes.
      *   Upstream/Downstream logic? Yes.
      *   Polarization/Secretariat specific questions answered? Yes.

      *Let's write.*
answer: |-
  This is a high-stakes design problem. $40m is enough to build a world-class research institute but not enough to fail twice. The constraint to *institutional design only* is the most critical boundary: it forces you to treat the legislature as a machine, ignoring the fuel (money/media) and the operators (voters). That is a strength (clarity) and a weakness (naivety).

  The menu provided mixes *selection methods* (Sortition, Lottery Retirement) with *tenure rules* (Term Limits, Cohort Overlap) and *support structures* (Secretariat). This conflates distinct problems. To give the board an agenda rather than a survey, you must sequence the questions by dependency. You cannot design the tenure rules until you know what the legislature is for, and you cannot assess the selection method until you know where the expertise lives.

  Here is the recommended research agenda, ordered by upstream dependency, followed by the specific analysis you requested on polarization and the secretariat.

  ### The Research Agenda: Three Upstream Questions

  #### 1. The Executive-Legislative Interface (The "Confidence" Problem)
  **The Question:** In a parliamentary democracy, the legislature does not just make laws; it sustains the executive (the Prime Minister/Cabinet) through confidence votes. How does a non-professional, potentially non-partisan, or randomly selected chamber interact with a partisan executive that requires stable majority support to govern?
  **Why it is Upstream:** This is the foundational compatibility check. If a sortition chamber cannot logically sustain a government without collapsing into gridlock or dictatorship, the rest of the menu is moot. Hard term limits also disrupt this by removing the experienced negotiators who keep coalitions together.
  **Tractability:** High for constitutional theorists and game theorists; low for empiricists (no historical data exists for sortition parliaments). This is a job for modelers, not surveyors.
  **Findings that Shift Ranking:**
  *   *Move Up:* If mechanism design can demonstrate a stable "confidence protocol" (e.g., the sortition chamber can veto but not initiate confidence motions) that prevents executive tyranny without causing gridlock.
  *   *Move Down:* If modeling shows that random selection inevitably fragments the majority needed to pass a budget, leading to technocratic emergency rule (which defeats the purpose).

  #### 2. The Epistemic Infrastructure (The "Secretariat" Problem)
  **The Question:** If you remove the professional political class, who drafts the legislation, analyzes the amendments, and sets the agenda? Specifically, does shifting expertise to a permanent secretariat reduce careerism, or does it merely relocate unchecked power to unelected staff?
  **Why it is Upstream:** This determines the *reality* of power. As your prompt notes, members defer to briefers. If the secretariat frames the options, they are the legislators. If you don't solve this, "sortition" is just a theater of democracy masking a bureaucratic oligarchy. This applies equally to term limits: if MPs are term-limited, expertise migrates to lobbyists and agency staff.
  **Tractability:** Medium. Comparative bureaucracy studies exist (e.g., comparing the US Congressional Research Service to UK Civil Service). Political economists can model principal-agent problems between members and staff.
  **Findings that Shift Ranking:**
  *   *Move Up:* Evidence that secretariats can be made accountable via random audit panels or rotating leadership, or that term-limited legislators rely *less* on lobbyists when supported by robust public staff.
  *   *Move Down:* Data showing that in existing citizen assemblies, the framing power of the secretariat correlated perfectly with the outcome, rendering member deliberation cosmetic.

  #### 3. Incentive Compatibility & Careerism (The "Tenure" Problem)
  **The Question:** Which mechanism most effectively breaks the "professional politician" incentive structure without inducing short-termism or corruption? (Comparing Hard Term Limits vs. Lottery Retirement vs. Sortition).
  **Why it is Downstream:** You can only answer this once you know what the job is (Q1) and who supports them (Q2). "Careerism" is a response to incentives. If the job is high-power but short-term (Term Limits), the careerism moves to the *next* job (lobbying). If the job is one-off (Sortition), there is no career. If the job is uncertain (Lottery Retirement), it introduces risk.
  **Tractability:** High. Economists and mechanism designers excel here. You can model risk aversion, corruption markets, and legislative output under different tenure constraints.
  **Findings that Shift Ranking:**
  *   *Move Up:* Evidence that "Lottery Retirement" retains enough experienced members to maintain institutional memory while keeping members sufficiently insecure to prevent entrenchment.
  *   *Move Down:* Data showing hard term limits increase lobbyist expenditure per bill (the "lame duck" effect).

  ---

  ### Analysis of Specific Claims

  #### 1. The Polarization Claim: "You can't gerrymander a lottery."
  **Verdict:** This claim is **mechanistically confused** and should be deprioritized.

  **Reasoning:**
  Gerrymandering is a tool for *parties* to secure seats. It exacerbates polarization by creating safe seats where the only threat is a primary challenge from the extreme. However, polarization in parliamentary democracies is driven less by district lines (many use proportional representation) and more by **social sorting** and **party discipline**.
  *   **Social Sorting:** A random sample of the population will reflect the *population's* polarization. If the country is deeply divided on immigration, a sortition chamber will be deeply divided on immigration. It removes the *elite* filtering of polarization, not the polarization itself.
  *   **Party Discipline:** In a parliament, MPs vote the party line. If you sortition MPs but keep party structures, the parties will whip the random members. If you ban parties, you break the parliamentary system (see Q1).
  *   **The Real Mechanism:** Sortition might reduce *affective* polarization (disliking the other side) through contact theory (deliberation), but it does not fix *ideological* polarization.
  *   **Funding Implication:** Do not fund research premised on "sortition solves polarization." Fund research on "does sortition reduce *elite capture*?" Those are different outcomes.

  #### 2. The Secretariat Problem: Crux or Distraction?
  **Verdict:** This is the **Crux**. It is the single point of failure for the entire menu.

  **Reasoning:**
  The prompt assumes a trade-off: *Institutional Wisdom (Staff) vs. Careerism (Members).* This is a false dichotomy. The real trade-off is *Accountable Expertise vs. Unaccountable Expertise.*
  *   **Under Sortition:** Members are amateurs. They *must* defer to staff to function. The staff becomes the permanent government. Unless the foundation funds a design for how to control the staff (e.g., random selection of senior clerks, open-source drafting), sortition simply replaces elected careerists with appointed careerists.
  *   **Under Term Limits:** Expertise leaves the legislature and enters the **lobbying sector and regulatory agencies**. This is often worse. A permanent civil service is bound by codes of conduct; a revolving door of lobbyists is bound by client profit.
  *   **The Transfer:** The worry transfers directly. In fact, it is *higher* in sortition because the knowledge gap between a random citizen and a permanent clerk is larger than between a term-limited MP and a clerk.
  *   **Funding Implication:** A significant portion of the $40m must go to designing the "Fourth Branch." How is the secretariat hired? Who fires them? Can they propose bills? If you solve the Secretariat design, Sortition becomes viable. If you ignore it, Sortition is a sham.

  ---

  ### The Missing Menu Item

  The menu is missing **Party Discipline and Agenda Control**.

  **Why it outranks the rest:**
  In a mid-sized parliamentary democracy (e.g., NZ, Ireland, Scandinavia), the "professional political class" is not defined by tenure; it is defined by the **Whip System**.
  *   You can have a chamber of randomly selected gods, but if the Prime Minister can fire the government unless they vote a specific way, the random selection is irrelevant.
  *   You can have hard term limits, but if the Party Leader controls the candidate selection (even for the limited terms), the professional class remains the Party HQ.

  **The Research Question:** *How do you decouple legislative voting from executive survival without causing government collapse?*
  This might involve:
  *   Free votes on conscience issues.
  *   Separating the "Confidence Chamber" (elected, partisan) from the "Legislative Chamber" (sortition, non-partisan).
  *   Algorithmic agenda setting (removing the Speaker's/Leader's power to choose what is voted on).

  If the foundation ignores Party Discipline, they are redesigning the engine while leaving the driver in control of the steering wheel.

  ### Summary Recommendation for the Board

  1.  **Allocate 40% of funds to Q1 & Q2 (Constitutional Compatibility & Secretariat Design).** These are the kill-switches. If the system can't govern or the staff rules, the project fails. Hire constitutional lawyers and bureaucratic theorists.
  2.  **Allocate 30% to Q3 (Incentives/Tenure).** Hire mechanism designers and economists to model the careerist incentives under Term Limits vs. Lottery Retirement.
  3.  **Allocate 20% to The Missing Item (Party Discipline/Agenda).** This is the political reality check.
  4.  **Allocate 10% to Synthesis/Dissemination.** Not advocacy, but "constitutional drafting." Produce a model bill.

  **The "Go/No-Go" Finding:**
  If, within 18 months, the theorists cannot design a **Secretariat Accountability Mechanism** that prevents bureaucratic capture *and* a **Confidence Protocol** that allows a sortition/term-limited chamber to coexist with a parliamentary executive, the foundation should pivot. The institutional design constraints may be too tight for the goal. It is better to know that in Year 2 than to spend $40m proving that random people cannot pass a budget.
