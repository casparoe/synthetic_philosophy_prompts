      *   Authority: Advisory only.
      *   *Revision:* Make Step 2 very strong. If it's oppressive, Burkeanism doesn't save it. Make Step 3 about *attempting* to find the reason, not necessarily finding it. If the reason remains unknown after a good faith effort, the presumption shifts to retention *unless* the burden is high.

      *Let's structure the questions:*
      1.  **Threshold:** Is this practice old/customary enough to qualify as a "fence"?
      2.  **Harm/Veto:** Does it violate fundamental rights or cause specific, identifiable harm to a vulnerable group? (If Yes -> Abolish).
      3.  **Function:** Have we asked the stakeholders *why* it exists, and did we get a coherent answer? (If Yes -> Evaluate the reason. If No -> Proceed to 4).
      4.  **Burden:** Is the cost of maintaining the fence high (money/time/freedom)?
      5.  **Risk:** If we remove it, can we put it back? (Reversibility).

      *Wait, I need to ensure the "Unwelcome Result" constraint is met.*
      *   Case 1 (Market Stalls): Rotation vs. Private Lease. Rotation prevents monopolies/cronyism. Private lease brings investment/stability. A reformist might want efficiency (Private Lease). Burke might say Rotation prevents corruption. *Potential conflict.*
      *   Case 2 (School Boundaries): Informal agreement vs. Algorithm. Algorithm seems fairer/transparent. Informal agreement might preserve neighborhood cohesion or prevent segregation. A reformist wants the Algorithm. Burke might say the informal agreement prevents gaming the system or community fracturing. *Strong candidate for unwelcome result.*
      *   Case 3 (Permit): Burdensome/Obsolete vs. Older residents defend it. Reformist wants it gone. Burke says keep it. *This is the classic Chesterton case.* If I make this the one where they must keep it, it fits the "reform-minded student" persona best.

      *Let's refine the Procedure to ensure it forces the "Keep the Permit" result in Case 3.*
      *   The procedure needs a "Presumption of Retention" when function is unknown but harm is low.
      *   It needs to flag that "I don't understand it" is not a valid reason for removal.

  4.  **Developing the Procedure (Iterative refinement):**
      *   *Name:* The Latent Function Protocol (LFP).
      *   *Q1: Provenance.* Is it >20 years? Informal/Customary? (If No, standard policy analysis applies. If Yes, proceed).
      *   *Q2: The Rights Veto.* Does it infringe on protected rights or target a specific group for disadvantage? (If Yes -> **STOP: Recommend Abolition**. This handles the oppression clause).
      *   *Q3: The Stakeholder Test.* Have we asked the beneficiaries and the burdened? Do the defenders have a reason? (If defenders say "It keeps peace" and burdened say "It's annoying", proceed).
