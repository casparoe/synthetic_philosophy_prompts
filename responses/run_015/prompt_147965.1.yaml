      *   *Burkean Conservatism:* Society is a partnership between the dead, the living, and the unborn. Institutions encode "latent wisdom" (prescription). Change should be gradual to preserve social fabric. Prejudice (pre-judgment based on tradition) is often wiser than abstract reason.
      *   *Adaptation for Students:* We can't do deep historical archaeology. We need a "quick and dirty" heuristic that respects the *possibility* of hidden wisdom without demanding a PhD in local history. It needs to handle the "oppression" exception (some fences are just barriers).

  3.  **Drafting the Decision Procedure (The "Fence-Test"):**
      *   *Goal:* A flowchart-like sequence.
      *   *Step 1: Identification.* Is it actually a "fence"? (Long-standing, informal/customary).
      *   *Step 2: The Harm Check (The Oppression Exception).* Does it actively violate rights or cause demonstrable harm? If yes, tear it down. (This addresses the "oppressive rather than mysterious" constraint).
      *   *Step 3: The Function Inquiry.* Can anyone articulate a reason for it? (Ask stakeholders).
      *   *Step 4: The Transition Cost.* If we remove it, is there a safe way to transition, or is it a cliff?
      *   *Step 5: The Value Hand-off.* If the function is unknown but harmless, is the *risk* of removal worth the *gain*? This is where democracy comes in.
      *   *Stopping Rules:* Need clear "Stop and Recommend Abolition" or "Stop and Recommend Retention" points.

      *Refining the Steps for the User's Constraints:*
      *   Time limit: 2 hours.
