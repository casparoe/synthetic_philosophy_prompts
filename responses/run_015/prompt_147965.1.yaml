answer: |-
  ### The Latent Function Protocol (LFP)

  This procedure is designed for a committee with limited time and no historical expertise. It operationalizes the intuition that long-standing practices often solve problems you cannot currently see (Chesterton's Fence) and that social continuity has value independent of immediate utility (Burkean Prescription).

  It is not a moral absolute; it is a risk-management heuristic. It assumes that *ignorance* is the default state of the reformer, not the defender of tradition.

  #### The Procedure

  **Q1. The Threshold Check (Fact)**
  *Is the practice informal, customary, or institutionalized for more than one generation (20+ years), such that its original justification is not immediately documented?*
  *   **No:** Treat as standard policy. Apply normal cost-benefit analysis. **STOP.**
  *   **Yes:** This is a "Fence." Proceed to Q2.

  **Q2. The Harm Veto (Value/Fact Hybrid)**
  *Does the practice actively violate established civil rights, target a specific demographic for disadvantage, or cause demonstrable, specific harm to vulnerable individuals?*
  *   **Yes:** The fence is a weapon, not a boundary. **STOP. Recommend Abolition.**
      *   *Note:* This is the "Oppression Exception." Burkean preservation does not apply to practices that deny personhood or safety.
  *   **No:** The harm is speculative or non-existent. Proceed to Q3.

  **Q3. The Knowledge Search (Fact)**
  *Have you interviewed at least three distinct stakeholder groups (beneficiaries, burdened parties, and long-term administrators) regarding the function of the practice?*
  *   **No:** You cannot evaluate the fence yet. **STOP. Recommend Deferral** until consultation is complete.
  *   **Yes:** Proceed to Q4.

  **Q4. The Explanation Test (Fact/Judgment)**
  *Did the stakeholders provide a coherent, functional reason for the practice that survives basic logical scrutiny?*
  *   **Yes (Reason Found):** Evaluate the reason on its merits. If the reason is obsolete (e.g., "we do this because we use paper ledgers" and you have computers), **Recommend Reform.** If the reason is still valid, **Recommend Retention.** **STOP.**
  *   **No (Reason Unknown):** The function is latent or forgotten. Proceed to Q5.

  **Q5. The Reversibility & Burden Check (Judgment)**
  *If we abolish this practice, can it be easily restored if negative consequences emerge, and is the current burden of the practice "substantial" (financial cost, significant time loss) or merely "inconvenient" (minor paperwork, slight delay)?*
  *   **Irreversible OR Burden is Inconvenient:** The risk of removal outweighs the gain of efficiency. **STOP. Recommend Retention.**
  *   **Reversible AND Burden is Substantial:** The cost of the mystery is too high. **STOP. Recommend Pilot Abolition** (sunset clause).

  ***

  #### Critical Annotations for the Committee

  **1. Where Judgment Disguises Itself as Procedure**
  *   **Q2 (Harm Veto):** Determining what counts as "demonstrable harm" is a value judgment. A practice might feel oppressive to a minority while the majority sees no harm. If your committee is homogenous, you may fail to see the harm.
  *   **Q5 (Substantial vs. Inconvenient):** This is the primary valve for your values. A reformist sees "paperwork" as a substantial burden on liberty; a conservative sees it as a trivial price for order. You must vote on this definition openly.

  **2. Conditions Where the Procedure Will Misfire**
  *   **Systemic Oppression:** If a practice is oppressive but the harm is diffuse, historical, or accepted as "normal" by all current stakeholders (including the victims), Q2 will fail to catch it. The LFP assumes the committee has the moral vocabulary to recognize oppression. If you do not, this procedure will conserve injustice.
  *   **Rapid Environmental Change:** If the town's context has changed so radically (e.g., population tripled, technology shifted) that the *type* of problem the fence solved no longer exists, the presumption of latent wisdom is weaker. The LFP biases toward stability; in a crisis, this bias is a bug, not a feature.

  **3. The Democratic Hand-off**
  *   If Q4 yields "Reason Unknown" and Q5 yields a split vote on "Substantial vs. Inconvenient," this is not a factual disagreement. It is a conflict of values (Efficiency vs. Prudence). Do not try to resolve this with more data. Flag it for the Town Council as a **Value Decision**, not a Policy Recommendation.

  ***

  ### Application to Cases

  #### Case 1: Market-Stall Rotation (Unwritten System)
  *Proposal: Abolish rotation; allow permanent private leasing.*

  *   **Q1 (Threshold):** Yes. Unwritten, long-standing.
  *   **Q2 (Harm Veto):** No. Rotation does not violate rights; private leasing is not inherently harmful.
  *   **Q3 (Knowledge Search):** Yes. Spoke to vendors (some want stability), customers (like variety), and town clerks.
  *   **Q4 (Explanation Test):** **Reason Found.** Older vendors and clerks explain the rotation prevents "cornering the market." It stops well-connected families from monopolizing the best spots indefinitely. It encodes an anti-corruption mechanism without needing a written law.
  *   **Q5:** N/A (Reason found in Q4).
  *   **Recommendation:** **Retain Rotation.**
  *   **Rationale:** The function is visible upon inquiry. The "inefficiency" of moving stalls is the price of preventing monopoly.

  #### Case 2: School-Boundary Agreement (70-Year Informal Pact)
  *Proposal: End agreement; use centralized algorithm for assignments.*

  *   **Q1 (Threshold):** Yes. 70 years, informal.
  *   **Q2 (Harm Veto):** No. Neither system inherently violates rights on its face.
  *   **Q3 (Knowledge Search):** Yes. Spoke to parents, principals, and neighborhood associations.
  *   **Q4 (Explanation Test):** **Reason Found.** The informal agreement aligns school zones with walking paths and neighborhood cohesion rather than strict geometric distance. It prevents the algorithm from splitting single neighborhoods between two schools, which historically fractured community support for local schools.
  *   **Q5:** N/A (Reason found in Q4).
  *   **Recommendation:** **Retain Agreement.**
  *   **Rationale:** The algorithm optimizes for geometric fairness; the tradition optimizes for social cohesion. The latent wisdom is that schools function better when neighborhoods are kept intact.

  #### Case 3: Public-Gathering Permit (Obsolete Process)
  *Proposal: Remove permit requirement. No official knows why it exists; older residents defend it.*

  *   **Q1 (Threshold):** Yes. Obsolete-seeming, long-standing.
  *   **Q2 (Harm Veto):** No. It is a paperwork burden, not a ban on assembly.
  *   **Q3 (Knowledge Search):** Yes. Spoke to current officials (clueless), event organizers (annoyed), and older residents (defensive).
  *   **Q4 (Explanation Test):** **Reason Unknown.** Current officials cannot explain it. Older residents say "It's always been done," but cannot articulate the specific utility other than "it keeps things orderly."
  *   **Q5 (Reversibility & Burden):**
      *   *Reversibility:* **Low.** If removing the permit leads to overlapping events, noise conflicts, or safety issues, reinstating the *norm* of permission will be harder than reinstating the *form*. Trust is hard to rebuild.
      *   *Burden:* **Inconvenient.** It requires filing a form two weeks early. It costs money, but not prohibitive amounts.
  *   **Recommendation:** **Retain Permit.**
  *   **Rationale:** The function is unknown, but the burden is low and the risk of removal (social friction) is hard to reverse.

  ***

  ### The Unwelcome Result: Case 3

  As a reform-minded student, you likely find the recommendation for **Case 3** frustrating. You see a bureaucratic ghost—a rule with no living justification that wastes time and stifles spontaneous community life. You value transparency and logic: *If you can't explain it, delete it.*

  **Where the Procedure Forces This Result:**
  The LFP forces this result at **Q5**. Because the function is unknown (Q4), the decision rests entirely on the balance of *Risk* vs. *Burden*.
  1.  **Risk:** The procedure assumes that if older residents defend a rule without a clear reason, they are guarding a social norm (e.g., preventing schedule conflicts, notifying emergency services informally) that is not captured in the paperwork itself.
  2.  **Burden:** The procedure classifies "filing a form" as an *inconvenience*, not a *substantial burden*.

  **Principle vs. Values:**
  The fault lies neither with the principle nor your values exclusively; it lies in the **priority of goods**.
  *   **Your Value:** Liberty/Efficiency. You prioritize the right of the community to gather without asking permission. You view the "unknown function" as evidence of incompetence.
  *   **The Procedure's Value:** Prudence/Stability. It prioritizes the avoidance of unseen negative externalities. It views the "unknown function" as evidence of complexity you haven't mapped yet.

  **Why the Procedure Wins Here:**
  In a municipal advisory context, the cost of a false negative (keeping a useless permit) is low (minor annoyance). The cost of a false positive (removing a necessary permit and causing chaos) is high (public safety issues, neighborhood feuds). The LFP is designed to be asymmetric: it requires high certainty to remove a fence.

  If you wish to recommend abolition despite this result, you must explicitly override Q5. You must argue that the *principle* of non-interference is a "Substantial Burden" on civic life, even if the time cost is low. That is a valid philosophical stance, but you must recognize it as a **Value Judgment**, not a factual finding. The procedure forces you to admit that you are gambling on the absence of hidden harm, whereas the conservative heuristic insists you cannot prove a negative.
