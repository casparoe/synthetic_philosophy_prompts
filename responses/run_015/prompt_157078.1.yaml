  I'm in this philosophy of mind seminar and we've been digging into Hofstadter's Copycat stuff—how it solves analogies in these tiny letter-string microdomains by letting concepts "slip" just a little, like when abc goes to abd and that slips over to xyz going to xyw. My professor keeps insisting that this slippage is what makes analogy different from categorization, since categorization is rigid and analogy lets boundaries flex in a controlled way. But I'm writing my midterm paper and I actually want to argue the opposite: that once you really look at how the slip-net works, the boundary between analogy and categorization collapses, because every categorization is already doing some hidden analogical slippage.

