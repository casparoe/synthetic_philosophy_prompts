      *   **The Stalemate:** Illusionists (Frankish, Dennett) say qualia don't exist (it's a user-illusion). Realists (Chalmers, etc.) say experience is real and irreducible. The specific sticking point is the realist's move: "The *seeming* itself is phenomenal." The illusionist counters: "That's just more reports."
      *   **User's Hypothesis:** The core issue is whether introspection is a *detector* (realist wins) or a *generator* (illusionist wins). They call this the "detector-or-generator question."
      *   **The Ask:** A *diagnosis*, not a verdict. What kind of knot is this? Is the user's hypothesis right? Is it verbal, methodological, intuitive, or empirical? Would solving the "meta-problem" help? If nothing unties it, why not?
