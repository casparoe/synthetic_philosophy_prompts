      3.  **(2) vs. (7):** Technical tension on "in principle."

  7.  **Selecting the Single Change:**

      *   If I change (5) to say "The bot is an intentional system *for the user*, but a design system *for the builder*," it resolves (5) vs (8) and helps (5) vs (6).
