      *   **The (5) vs. (8) Clash:** This is the killer. You can't hold that "opacity = agency" generally (5) while holding "opacity = my ignorance" specifically for things you built (8). Since you built the bot, (8) demands you treat it as mechanism-only. (5) demands you treat it as agent.
      *   **The (5) vs. (6) Clash:** If the bot is *genuinely* intentional like grandma, why is it wrong to say it cares? Usually, "caring" is an intentional state. If the states are real, the care is real. To maintain (6), you need to distinguish the *kind* of intentionality or the *moral weight* of the substrate.

  5.  **Developing Resolutions:**

      *   *Resolution for (5) vs. (8):* You have to choose: Is the bot an agent or a tool?
          *   Option A: Drop (8). Accept that even things you build can surprise you enough to warrant the intentional stance. Cost: Humility. You lose the "God's eye view" of the creator.
          *   Option B: Drop (5). The bot is *not* a genuine intentional system in the same sense as grandma. It's a design-stance object that *mimics* intentionality. Cost: You lose the Dennettian equality between human and bot.
          *   *Analysis:* (8) is a methodological heuristic for debugging. (5) is an ontological claim about the deployed product. They operate in different contexts. But the user is applying them to the same object. (8) undermines (5).
