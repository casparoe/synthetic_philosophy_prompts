answer: |-
  The assembly room was bare concrete, scrubbed clean of any markings that might suggest allegiance. There were no banners, no raised podiums, no names carved into the desks. Elara sat on a wooden stool, one of fifty chosen by lot for the season. The settlement's founders had designed it this way: no parties, no campaigns, no permanent leadership. Only the random turn of the wheel and the deliberate voice of the community. They believed geometry could cure psychology.

  For the first month, Elara had trusted the design. Without party labels, she had thought, there could be no whipping votes. There was only the issue, laid bare.

  Today's issue was Kael. He had diverted seed grain from the communal silo during the frost scare. The law was explicit: theft of sustenance meant exile. But Kael was from the North Crew, the group that maintained the heating pipes, and he had acted to feed his sick daughter.

  The discussion had lasted four hours. It began with reasoning. Was the law flexible? Was the precedent dangerous? But slowly, the texture of the room changed. Elara noticed it first in the silences. When a member from the South Sector argued for exile, three men from the North Crew didn't argue back; they simply looked at him. It wasn't anger. It was disappointment. A quiet, heavy withdrawal of warmth.

  Then came the speaking order. Those who favored mercy spoke of "community," "survival," and "understanding." Those who favored the law spoke of "rules" and "precedent." The vocabulary shifted. Mercy became synonymous with loyalty; law became synonymous with coldness. To vote for exile was no longer a legal judgment; it was a moral failing.

  Elara looked at her neighbor, Tomas. He was a man of rigid principle who had argued fiercely for the law an hour ago. Now, he sat with his hands clasped, staring at the floor. He had spoken to two members of the North Crew during the break. He hadn't been threatened. He had just been reminded, gently, that they all depended on each other when the snows came.

  Elara felt the pressure not as a command, but as a current. It flowed through the room, bypassing the intellect. She realized then that the absence of formal parties had not removed the faction; it had only removed the boundary. The work crews, the old neighborhoods, the shared histories—they had coalesced into invisible blocs. They were parties without names, demanding total allegiance without admitting they existed.

  Simone Weil had written that a party is a machine that generates collective passion to replace individual thought. Elara watched it happen. She saw the moment reasoning died in Tomas's eyes. He wasn't convinced by argument; he was subdued by the desire to remain part of the "we." To dissent was to exile oneself before Kael was ever exiled. The mechanism didn't require a whip; it required only the human terror of isolation.

  The facilitator, chosen by lot like the rest, cleared her throat. "We must decide. All in favor of exile, raise your right hand."

  Elara looked at Kael's empty chair. She looked at the North Crew. They were not watching her; they were watching each other, a synchronized machine of expectation. She knew the law. She knew the precedent. If they let this pass, the silo was no longer communal. It was merely guarded by whoever felt most needy.

  But she also felt the heat of the room, the collective breath held in anticipation of unity. To raise her hand was to break the cohesion. It was to declare that her own judgment weighed more than the group's survival instinct. It was to become an outsider.

  She looked at Tomas. He kept his hands in his lap. He would not vote. He would abstain, letting the tide wash over him without drowning, preserving his standing while sacrificing his conscience.

  Elara placed her hands on the rough wood of the stool. She understood now that the safeguards were cosmetic. The pathology was in the blood. The choice was not between law and mercy, but between truth and belonging.

  She took a breath, the air tasting of dust and sweat, and lifted her right hand into the stillness of the room. She did not look to see who else joined her. She kept her arm raised, feeling the weight of the invisible lines drawing tight around her, and waited for the count.
