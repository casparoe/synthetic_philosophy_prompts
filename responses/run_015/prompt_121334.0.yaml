prompt: |-
  I am a postgraduate student reading for an MPhil in Historical Theory, and I also work part-time as a research assistant for a municipal heritage trust that is curating a small exhibition on the contested closure of the Meridian Textile Mill in 1928. Our board receives frequent submissions—oral history transcripts collected in the 1970s, digitised fragments of local newspapers with probable OCR errors, corporate minute books held in private hands, and retrospective affidavits prepared for a 1960s compensation claim—and we lack any consistent method for deciding which materials should shape the public narrative and which should be relegated to a footnote or excluded entirely.

  Drawing on the principles of source criticism that run from Herodotus’s distinction between direct observation and hearsay through Thucydides’s insistence on contemporary verification and onward to modern archival concepts such as provenance, original order, and the distinction between external and internal criticism, please construct a reusable decision procedure that a non-specialist researcher could apply in under thirty minutes per source. The procedure should take the form of ordered questions or tests: first for authenticity and provenance (external criticism), then for credibility, bias, and internal consistency (internal criticism), with explicit stopping points where a source is rejected, explicit hand-off points where the decision becomes a matter of curatorial values rather than epistemic fact, and explicit flags for cases the procedure cannot settle. It must handle at least three hard cases: an oral testimony recorded in 1975 that describes workplace conditions in 1928 but conflicts with the corporate ledger; a digitised newspaper clipping in which OCR errors have introduced a phantom manager’s name that alters the causal story; and a retrospective affidavit drafted in 1965 by a former foreman seeking compensation, where institutional incentives and the passage of time intersect. Apply the procedure to each case, including one where it yields an answer the heritage board is likely to dislike—perhaps the exclusion of a vivid oral account that fails internal criticism, or the inclusion of a dry but reliable ledger that undermines the preferred narrative of worker solidarity. Finally, state clearly what the procedure cannot do: which judgments it deliberately leaves to curators, where it is likely to misfire with digitised or mediated sources, and why no procedural substitute exists for the historian’s ultimate responsibility for interpretation.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** MPhil student in Historical Theory + Research Assistant for a municipal heritage trust.
      *   **Task:** Create a reusable decision procedure for source evaluation (source criticism) for non-specialist researchers.
      *   **Context:** Curating an exhibition on the contested closure of the Meridian Textile Mill (1928).
      *   **Materials:** Oral histories (1970s), digitized newspapers (OCR errors), corporate minutes (private), retrospective affidavits (1960s).
      *   **Constraints:**
          *   Must be usable in under 30 minutes per source.
          *   Must follow historical source criticism principles (Herodotus, Thucydides, provenance, original order, external/internal criticism).
          *   Format: Ordered questions/tests with stopping points (reject), hand-off points (curatorial values), and flags (unsettled).
          *   Must handle three specific "hard cases" (Oral vs. Ledger, OCR Newspaper, Retrospective Affidavit).
          *   Must apply the procedure to these cases, including one outcome the board might dislike.
          *   Must state limitations (what the procedure *cannot* do).

  2.  **Deconstruct the Theoretical Framework:**
      *   *Herodotus:* Distinction between *opsis* (seeing) and *akoē* (hearing). Relevance: Proximity to event.
      *   *Thucydides:* Contemporary verification, cross-checking. Relevance: Corroboration.
      *   *Modern Archival Science:* Provenance (who created it/why), Original Order (context), External Criticism (is it what it says it is?), Internal Criticism (what does it mean/is it true?).
      *   *Goal:* Translate high theory into a practical checklist for non-specialists.

  3.  **Drafting the Procedure (The "Meridian Protocol"):**
      *   *Time Limit:* Needs to be tight. 30 minutes means roughly 5 minutes per section.
      *   *Structure:*
          *   Phase 1: External Criticism (Authenticity & Provenance). *Stop if failed.*
          *   Phase 2: Internal Criticism (Credibility & Consistency). *Flag if ambiguous.*
          *   Phase 3: Curatorial Hand-off (Value & Narrative). *Decision point.*
      *   *Tone:* Professional, instructional, rigorous but accessible.

  4.  **Developing the Hard Cases:**
      *   *Case 1: Oral History (1975) vs. Corporate Ledger.*
          *   Conflict: Memory vs. Record.
          *   Procedure outcome: Likely flags the oral history for internal inconsistency but keeps it for "social memory" value (Curatorial Hand-off). Or, if strict truth is the goal, it might downgrade the oral history. Let's make the procedure recommend *downgrading* the oral history as factual evidence of *conditions* but keeping it as evidence of *memory*. This might be disliked if the board wants a "worker's voice" narrative.
      *   *Case 2: OCR Newspaper.*
          *   Issue: Phantom manager.
          *   Procedure outcome: External criticism (digitization integrity). Needs verification against physical copy or other issues. If unverifiable, flag as "Corrupted."
      *   *Case 3: 1965 Affidavit.*
          *   Issue: Incentive (compensation) + Time gap.
          *   Procedure outcome: High bias risk. Internal criticism fails on motivation. Likely relegated to footnote regarding the *claim*, not the *event*.

  5.  **Refining the "Disliked Outcome":**
      *   The prompt asks for an outcome the board is likely to dislike. Heritage trusts often want compelling human stories (oral history). If the procedure dictates that a vivid oral testimony is factually unreliable regarding *specific events* (like the date of closure or specific wages) compared to a dry ledger, the board might hate excluding it from the main narrative. I will structure the application to show the procedure demanding the ledger take precedence on *facts*, relegating the oral history to "perception," which might dampen the emotional impact of the exhibition.

  6.  **Writing the Procedure (Iterative Process):**
      *   *Introduction:* Set the stage, acknowledge the theoretical lineage.
      *   *The Protocol:* Break it down into steps. Use "STOP," "HAND-OFF," and "FLAG" markers.
      *   *Application:* Walk through the three cases using the protocol.
      *   *Limitations:* Be honest about algorithmic history.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I mention Herodotus/Thucydides? Yes, in the intro and rationale.
      *   *Check:* Is it under 30 mins? The steps need to be concise.
      *   *Check:* Did I handle the OCR error? Yes, under External Criticism (Integrity).
      *   *Check:* Did I handle the Affidavit? Yes, under Internal Criticism (Bias/Incentive).
      *   *Check:* Is the "disliked outcome" clear? Yes, prioritizing the ledger over the oral history.
      *   *Check:* Did I explain what the procedure *cannot* do? Yes, in the final section.

  8.  **Final Polish:** Ensure the tone is appropriate for an MPhil student writing for a municipal board (academic rigor meets practical utility). Ensure the distinction between "fact" and "narrative value" is sharp. (Self-correction: Make sure the "Hand-off" points are clearly distinguished from "Stop" points. A "Stop" means the source is fake/useless. A "Hand-off" means it's real but how to use it is a value judgment.)

  9.  **Final Output Structure:**
      *   Title.
      *   Theoretical Preamble.
      *   The Meridian Source Evaluation Protocol (M-SEP).
      *   Application to Hard Cases.
      *   Limitations & Epistemic Responsibility.

  (Proceed to generate response based on this plan.)
answer: |-
  # The Meridian Source Evaluation Protocol (M-SEP)
  **Version 1.0 | For Municipal Heritage Trust Research Assistants**

  ## Preamble: Theoretical Basis
  This procedure operationalizes the genealogy of source criticism. It begins with **Herodotus's distinction** (*opsis* vs. *akoē*): Is the source proximate to the event or distant? It employs **Thucydides's standard** of contemporary verification: Can this be cross-checked? It utilizes **Archival Principles**: Provenance (who made this and why?) and Original Order (was this file kept with related documents?). Finally, it divides labor into **External Criticism** (Is the document authentic?) and **Internal Criticism** (Is the content credible?).

  **Time Budget:** 30 Minutes per source.
  **Goal:** To categorize sources as *Foundational* (facts), *Supplementary* (perspectives), or *Excluded* (unreliable/fake).

  ---

  ## Phase 1: External Criticism (Authenticity & Provenance)
  *Time Allocation: 10 Minutes*
  *Goal: Determine if the source is what it claims to be.*

  **Q1.1: Provenance Check.**
  Is the chain of custody clear? Do we know who created this, when, and where it has been since?
  *   *Yes:* Proceed.
  *   *No/Unclear:* **FLAG [Provenance Gap]**. Proceed to Q1.2 but note high risk.
  *   *Fake/Forced:* **STOP**. Exclude source. (e.g., known forgery, misattributed creation date).

  **Q1.2: Integrity Check (Physical/Digital).**
  Is the medium intact? For digital: Are there signs of OCR corruption, file manipulation, or incomplete scanning? For physical: Is there evidence of tampering, missing pages, or non-contemporary ink/paper?
  *   *Intact:* Proceed.
  *   *Corrupted:* **FLAG [Integrity Compromise]**. Can the error be corrected by cross-referencing?
      *   *Yes:* Correct and note. Proceed.
      *   *No:* **STOP** for factual claims. May proceed to Phase 2 only as evidence of *transmission error*, not event content.

  **Q1.3: Temporal Proximity (The Herodotus Test).**
  When was this created relative to the event (1928 Mill Closure)?
  *   *Contemporary (1928–1930):* High Weight. Proceed.
  *   *Retrospective (1931+):* Lower Weight. Proceed to Phase 2.

  ---

  ## Phase 2: Internal Criticism (Credibility & Consistency)
  *Time Allocation: 15 Minutes*
  *Goal: Determine if the content is reliable.*

  **Q2.1: Competence & Access.**
  Did the creator have direct access to the information they report? (e.g., Was the accountant actually balancing the books, or repeating a rumor?)
  *   *Direct Access:* High Weight.
  *   *Hearsay:* **FLAG [Hearsay]**. Downgrade to "Public Perception" category.

  **Q2.2: Incentive & Bias Analysis.**
  Why was this document created? Was there a financial, legal, or political incentive to distort the truth? (e.g., Compensation claims, union propaganda, corporate defense).
  *   *Neutral/Routine:* (e.g., daily ledger, utility bill). High Weight.
  *   *Advocacy/Claim:* (e.g., affidavit, speech). **FLAG [Incentive Bias]**. Proceed to Q2.3.

  **Q2.3: Internal Consistency.**
  Does the source contradict itself? (e.g., Dates change within the text, numbers do not add up).
  *   *Consistent:* Proceed.
  *   *Inconsistent:* **FLAG [Internal Contradiction]**. Downgrade reliability.

  **Q2.4: External Corroboration (The Thucydides Test).**
  Does this align with at least two independent sources from Phase 1 (High Weight)?
  *   *Corroborated:* **Designate: Foundational**.
  *   *Conflicted:* **HAND-OFF [Curatorial Decision]**. (See Phase 3).
  *   *Isolated:* **FLAG [Uncorroborated]**. Designate: Supplementary.

  ---

  ## Phase 3: Curatorial Hand-Off
  *Time Allocation: 5 Minutes*
  *Goal: Resolve conflicts and assign narrative role.*

  **Q3.1: The Conflict Resolution.**
  If Phase 2 yielded a **HAND-OFF [Curatorial Decision]** (e.g., Oral History conflicts with Ledger):
  *   *Rule of Thumb:* Prioritize **Contemporary + Routine** documents (Ledgers) for *facts* (dates, wages, headcount). Prioritize **Retrospective + Personal** documents (Oral History) for *experience* (morale, perception, culture).
  *   *Action:* Assign the source to either the "Factual Timeline" or the "Voices & Memory" section of the exhibition. Do not mix these categories without explicit labeling.

  **Q3.2: The Narrative Friction.**
  Does including this source undermine the exhibition's core thesis (e.g., Worker Solidarity)?
  *   *Yes:* **HAND-OFF [Ethical Review]**. Do not exclude. Instead, contextualize. (e.g., "While ledgers show profitability, workers recall hardship.").
  *   *No:* Proceed to inclusion.

  ---

  ## Application to Hard Cases

  ### Case 1: The 1975 Oral History vs. The Corporate Ledger
  *Source A:* Oral transcript, Mrs. Galloway (1975), claims mill was losing money in 1928 to justify closures.
  *Source B:* Corporate Ledger (1928), shows profit margin increase in Q4 1928.

  **Application of M-SEP:**
  1.  **Phase 1 (External):**
      *   *Ledger:* Provenance clear (private hands but verified). Integrity intact. Temporal Proximity: Contemporary (1928). **Status: High Weight.**
      *   *Oral:* Provenance clear (Trust archives). Integrity intact. Temporal Proximity: Retrospective (47 years later). **Status: Lower Weight.**
  2.  **Phase 2 (Internal):**
      *   *Ledger:* Competence (Accountant). Incentive (Tax/Shareholders - usually requires accuracy). Consistency (Math checks). **Result: Foundational.**
      *   *Oral:* Competence (Worker on floor). Incentive (None specific in 1975). Consistency (Internally consistent). Corroboration (Conflicts with Ledger). **Result: HAND-OFF [Curatorial Decision].**
  3.  **Phase 3 (Hand-Off):**
      *   *Rule:* Ledger wins on *financial fact*. Oral history wins on *perception of hardship*.
      *   *Decision:* The exhibition text must state: "Company records indicate profitability; however, workers perceived economic distress."

  **The Disliked Outcome:**
  The Board prefers a narrative of "Predatory Closure" (Mill closed to break the union despite profits). The Oral History supports this; the Ledger undermines it.
  *   **Procedure Mandate:** You cannot exclude the Ledger based on Q3.2 (Ethical Review). You must include it as a Foundational fact. The Oral History must be relegated to the "Voices" section, not the "Timeline of Closure."
  *   *Result:* The narrative is complicated. The "Predatory" claim becomes an interpretation, not a fact. The Board may dislike this nuance, preferring the emotional clarity of the oral testimony. The Procedure forces the inclusion of the dry ledger, potentially dampening the emotional arc.

  ### Case 2: The Digitised Newspaper Clipping (OCR Error)
  *Source:* Local Gazette, Nov 1928. Digitised. States "Manager H. *Phantom* ordered lockout." (Actual manager was J. *Plant*).

  **Application of M-SEP:**
  1.  **Phase 1 (External):**
      *   Q1.2 (Integrity): OCR scan shows "Phantom." Comparison with physical microfilm reveals "Plant."
      *   **FLAG [Integrity Compromise].**
      *   *Action:* Correct the text in the transcript but retain the digital image with a watermark noting "OCR Correction."
  2.  **Phase 2 (Internal):**
      *   Q2.1 (Competence): Journalist on site.
      *   Q2.4 (Corroboration): Other papers name Plant.
      *   **Result:** If uncorrected, **STOP** for factual claims regarding personnel. If corrected, **Foundational**.
  3.  **Phase 3:**
      *   If the "Phantom" name was used in previous exhibitions, a correction notice is required.

  ### Case 3: The 1965 Retrospective Affidavit
  *Source:* Sworn statement by Former Foreman, submitted for Compensation Claim. Claims safety violations caused the closure.

  **Application of M-SEP:**
  1.  **Phase 1 (External):**
      *   Temporal Proximity: 37 years post-event. **Status: Lower Weight.**
  2.  **Phase 2 (Internal):**
      *   Q2.2 (Incentive): **FLAG [Incentive Bias].** Financial compensation depends on proving negligence/safety violations.
      *   Q2.4 (Corroboration): Safety inspection logs from 1928 (if they exist) do not match claims.
      *   **Result:** **Supplementary.**
  3.  **Phase 3:**
      *   *Decision:* This source is evidence of the *1965 Compensation Claim*, not evidence of *1928 Safety Conditions*.
      *   *Labeling:* "Excerpt from 1965 Claim." Do not place in "1928 Conditions" panel without heavy qualification.

  ---

  ## Limitations & Epistemic Responsibility

  As an MPhil candidate, you must advise the Board that this procedure is a tool, not a substitute for historical judgment. Explicitly communicate the following limitations:

  **1. What the Procedure Cannot Decide (The Curatorial Hand-Off)**
  The M-SEP identifies *reliability*, not *relevance*. It can tell the Board that the Ledger is factually more reliable than the Oral History regarding profits. It **cannot** tell the Board whether the exhibition should focus on *profits* or *perceived hardship*. That is a value judgment. When the Procedure yields a **HAND-OFF**, the Board accepts responsibility for the narrative choice. If they choose the Oral History over the Ledger for the main panel, they are choosing *memory* over *accounting*, and must label it as such.

  **2. The Digitisation Trap**
  The Procedure relies on Q1.2 (Integrity), but non-specialists often lack the time or skill to verify OCR against physical copies for every document. The Procedure assumes a "spot check" capability. With heavily digitised collections, there is a risk of "digital positivism"—assuming the searchable text is the truth. The Procedure flags this, but cannot eliminate the risk without physical verification resources the Trust may lack.

  **3. The Silence of the Archive**
  The M-SEP evaluates what *exists*. It cannot account for what was destroyed. If the Corporate Ledgers were "cleaned" in 1929 before being archived, Phase 1 (Provenance) might pass them as authentic, and Phase 2 (Internal) might find them consistent. The Procedure validates internal coherence, not absolute truth. A consistent lie passes the M-SEP.

  **4. The Historian's Responsibility**
  Finally, no algorithm absolves the researcher of the duty to interpret. Herodotus warned us that hearing (*akoē*) shapes history as much as seeing (*opsis*). If the Procedure forces you to exclude a vivid oral account because it fails the "Thucydides Test" of corroboration, you have preserved *factual accuracy* but potentially lost *historical truth* regarding how the event was lived. The Procedure protects the Trust from libel and factual error; it does not protect them from a sterile or soulless exhibition. That balance remains your professional burden.
