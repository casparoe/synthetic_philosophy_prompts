answer: |-
  **1. Institutional Setting**
  Consider a pretrial release agency deciding whether to detain arrestees based on risk of rearrest. The true outcome $Y$ is whether the defendant commits a new offense while awaiting trial. The agency never observes $Y$ directly; it audits its algorithm on $\tilde{Y}$, whether the defendant was *arrested* for a new offense. The recording asymmetry arises from patrol allocation: police monitor defendants from Group A (a marginalized neighborhood) more intensively than Group B (affluent suburbs). Consequently, an actual offense by a Group A defendant is less likely to go unrecorded than one by Group B, but conversely, the *sensitivity* of the record is lower for Group B because offenses there are less likely to trigger an arrest record due to discretionary non-enforcement or diversion programs. To fit the constraint that one group's positives are less likely to appear, let us specify that Group B offenses are under-recorded relative to Group A due to informal resolution mechanisms unavailable to Group A. (Correction: To match the arithmetic below where $\gamma_B > \gamma_A$, Group A is the under-recorded group). Let us specify: Group A offenses are under-recorded ($\gamma_A < 1$) due to high caseloads dropping charges; Group B offenses are fully recorded ($\gamma_B = 1$).

  **2. Parameters and Score Construction**
  Let Group A have true base rate $\pi_A = 0.40$ and recording sensitivity $\gamma_A = 0.50$. The recorded base rate is $\tilde{\pi}_A = 0.20$.
  Let Group B have true base rate $\pi_B = 0.2425$ and recording sensitivity $\gamma_B = 1.00$. The recorded base rate is $\tilde{\pi}_B = 0.2425$.
  Note the reversal: A is truly riskier ($0.40 > 0.2425$), but B looks riskier in records ($0.2425 > 0.20$).
  The score $S$ is the conditional expectation of $\tilde{Y}$. We define three score values: $0.1, 0.2, 0.3$.
  Group A distribution: $P(S=0.1|A)=0.5, P(S=0.3|A)=0.5$. (Mean $\tilde{Y} = 0.20$).
  Group B distribution: $P(S=0.2|B)=0.575, P(S=0.3|B)=0.425$. (Mean $\tilde{Y} = 0.2425$).
  Overlap exists at $S=0.3$. The predictor is imperfect (scores vary).

  **3. Calibration on Recorded Outcome**
  Within-group calibration requires $P(\tilde{Y}=1 | S=s, G=g) = s$. Since $S$ is defined as $E[\tilde{Y}|X]$, this holds by construction for all $s$.
  For Group A: At $s=0.1$, risk is 0.1; at $s=0.3$, risk is 0.3.
  For Group B: At $s=0.2$, risk is 0.2; at $s=0.3$, risk is 0.3.
  I am not conditioning on group membership in the score itself (the score values overlap), but calibration holds within each group separately.

  **4. Balance for Positive Class (Recorded)**
  We calculate the mean score among recorded positives: $E[S | \tilde{Y}=1, G] = \frac{\sum_s P(S=s|G) \cdot s^2}{\tilde{\pi}_G}$.
  Group A: Numerator $= 0.5(0.01) + 0.5(0.09) = 0.05$. Denominator $= 0.20$. Result $= 0.25$.
  Group B: Numerator $= 0.575(0.04) + 0.425(0.09) = 0.023 + 0.03825 = 0.06125$. Denominator $= 0.2425$. Result $= 0.25$.
  Balance holds exactly.

  **5. Balance for Negative Class (Recorded)**
  We calculate the mean score among recorded negatives: $E[S | \tilde{Y}=0, G] = \frac{\tilde{\pi}_G - \tilde{\pi}_G(0.25)}{1 - \tilde{\pi}_G}$.
  Group A: $(0.20 - 0.05) / 0.80 = 0.15 / 0.80 = 0.1875$.
  Group B: $(0.2425 - 0.06125) / 0.7575 = 0.18125 / 0.7575 \approx 0.2393$.
  $0.1875 \neq 0.2393$. Balance fails, as required by the trilemma since recorded base rates differ.

  **6. Target-Robustness Failure**
  Define Target-Robustness (TR) as: (i) Equal true risk at equal scores ($E[Y|S=s, A] = E[Y|S=s, B]$); (ii) Ordering of groups by risk matches between true and recorded outcomes.
  (i) True risk is $R_g(s) = E[Y|S=s, G=g]$. Under the recording mechanism $\tilde{Y} \le Y$ with sensitivity $\gamma_g$, $S = \gamma_g R_g(s)$. Thus $R_g(s) = s / \gamma_g$.
  At overlap score $s=0.3$: $R_A(0.3) = 0.3 / 0.5 = 0.60$. $R_B(0.3) = 0.3 / 1.0 = 0.30$.
  The true risk gap is $0.30$. TR(i) fails.
  (ii) Aggregate Recorded Risk: $\tilde{\pi}_B (0.2425) > \tilde{\pi}_A (0.20)$ (B looks riskier).
  Aggregate True Risk: $\pi_A (0.40) > \pi_B (0.2425)$ (A is riskier).
  The ordering reverses. TR(ii) fails.

  **7. The General Fact**
  The failure is forced. **Fact:** If a score $S$ is calibrated on a recorded proxy $\tilde{Y}$ such that $P(\tilde{Y}=1|Y=1, G=g) = \gamma_g$ (independent of $S$ given $Y$), then $E[Y|S=s, G=g] = s/\gamma_g$.
  *Proof:* $s = E[\tilde{Y}|S=s, G=g] = E[E[\tilde{Y}|Y, S, G]|S=s, G=g] = E[\gamma_g Y | S=s, G=g] = \gamma_g E[Y|S=s, G=g]$.
  Thus, if $\gamma_A \neq \gamma_B$, true risks differ at every shared score $s > 0$.
  The Balance condition is a bystander to this specific divergence; Calibration plus unequal sensitivity alone suffices to break TR(i). Balance matters only for the internal consistency of the *recorded* fairness metrics (the trilemma), not for the gap between recorded and true risk.

  **8. Ablation**
  Feature doing the work: Unequal recording sensitivity ($\gamma_A \neq \gamma_B$).
  Case 1: Equalize sensitivities ($\gamma_A = \gamma_B = 0.5$). True risks become $s/0.5$ for both. TR(i) holds. The violation dissolves.
  Case 2: Equalize true base rates ($\pi_A = \pi_B = 0.4$) while keeping $\gamma_A=0.5, \gamma_B=1.0$. Recorded rates become $\tilde{\pi}_A=0.2, \tilde{\pi}_B=0.4$. True risks at $s=0.3$ remain $0.6$ vs $0.3$. TR(i) still fails.
  Your expectation is correct: sensitivity equality fixes the robustness failure; base rate equality does not.

  **9. Consistency Checks**
  All probabilities are in $[0,1]$. Max true risk is $0.60 \le 1$.
  Aggregation check:
  Group A True Base Rate: $0.5(0.2) + 0.5(0.6) = 0.40$. (Matches $\pi_A$).
  Group B True Base Rate: $0.575(0.2) + 0.425(0.3) = 0.115 + 0.1275 = 0.2425$. (Matches $\pi_B$).
  Arithmetic is consistent.

  **10. The Objection**
  The strongest objection is verifiability: Target-robustness demands auditing against $Y$, which by definition is unobserved. Insisting on it hands institutions an all-purpose excuse to dismiss fairness audits ("your labels are imperfect") or, conversely, makes fairness impossible to certify. An auditor seeing only $\tilde{Y}$ cannot distinguish between unequal risk and unequal sensitivity. However, ignoring the problem validates systemic bias. An auditor could still perform sensitivity analysis: bound the possible true risks given plausible ranges of $\gamma_g$, or audit the *process* generating $\tilde{Y}$ (e.g., policing patterns) rather than the outcome alone.

  **11. Conclusion**
  This case establishes that satisfying standard fairness criteria on recorded data can systematically conceal substantial inequities in true risk when recording processes differ across groups. It does not establish that fairness on the true outcome is achievable, only that fairness on the proxy is insufficient to guarantee it.
