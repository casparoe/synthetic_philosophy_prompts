answer: |-
  The rain blurred the harbour office window, turning the grey water outside into a smeared watercolour. Mara held the pen over the sale agreement, the ink hovering just above the signature line. On the desk, the marine radio crackled with Julian's voice, tight and frayed by static. He was out on the pier, his trawler listing slightly as the tide began its rapid ebb. He needed the dockside crane to lift the engine block before the hull settled on the mud; if the keel took the weight, the frame would warp, his season would be lost, and the bank would call in the loan. He needed twenty minutes. Mara looked at the clock. The buyer of the crane was due at noon, contract stipulating vacant possession upon signing. If she delayed even ten minutes to let Julian lift the engine, the buyer had the right to walk, and the sale would collapse. That sale was her pension, the only security she had after thirty years of keeping the harbour solvent. She had every right to sell the equipment; it was her property, and she had warned the contractors weeks ago that the assets were liquidating. She had not forced Julian to wait until the last hour, nor had she promised him the crane today, but she had never refused him before. The radio hissed again. Mara, please, just twenty minutes. I know it's tight. She looked at the pen, then at the rain battering the glass. She thought of her retirement, the small cottage she had planned for, the safety she had earned. She thought of Julian's boat, rotting on the mud, his livelihood sinking with the tide. Both were ruinous. Both were survivable, but only just. She signed the paper. The ink dried dark and final. She keyed the radio mic, her thumb trembling slightly. I'm sorry, Julian. I can't hold them. She set the mic down before he could answer, listening to the static fill the room where his voice had been. She did not look out the window as the tide went out.

  In this scenario, Singer's shallow-pond principle permits Mara to walk away because the sacrifice required to save Julian from harm is of comparable moral importance to the harm itself. Singer argues we are obliged to prevent bad outcomes only when we can do so without sacrificing something of comparable significance. Here, Mara's financial security and retirement are weighed against Julian's livelihood and business viability. Since both constitute grave, life-altering financial ruin, the cost to Mara is comparable to the cost to Julian. Therefore, the principle does not demand she sacrifice her own security to save him from his. She is morally permitted to prioritise her own comparable interest. Conversely, the ordinary-morality view, which grounds duties in special relationships, history, and causal responsibility, suggests she is required to help. Ordinary morality recognises obligations arising from reliance and prior conduct. Mara allowed Julian to operate under the assumption that the crane would be available, fostering a dependency. Even if she had the right to sell, the fact that her exercise of that right directly precipitates his disaster creates a remedial duty. She helped create the predicament, so she must bear the cost to resolve it, regardless of the comparative financial loss.

  The single feature doing the work here is the source of the obligation. Singer's view is impartial and forward-looking, concerned only with the balance of harm in the present moment. Ordinary morality is partial and backward-looking, concerned with the history of interaction and who caused the vulnerability. If you remove this feature, specifically the history of reliance between Mara and Julian, the two views converge. If they were strangers, ordinary morality would likely agree with Singer that she has no duty to sacrifice her pension for a stranger's boat, as no special obligation exists. Alternatively, if you remove the comparability of the stakes, making Mara's loss trivial, Singer's view would shift to demand she help, aligning with ordinary morality again. The divergence exists only because the costs are equal but the relational history is heavy.

  Someone who likes the pond argument might try to wriggle out of this case by challenging the comparability of the losses. They could argue that Julian's loss involves immediate inability to work and feed a family, whereas Mara's loss is future security, and therefore Julian's harm is objectively worse in terms of utility or suffering. By redefining the stakes so that Julian's loss is greater, they restore the obligation under Singer's principle. Alternatively, they might argue from a rule-utilitarian perspective that always honouring reliance creates more trust and utility in the long run, so the rule should be to help, even if the immediate cost is comparable. This attempts to smuggle the relational duty back into the consequentialist calculus without admitting that the relationship itself holds independent moral weight.
