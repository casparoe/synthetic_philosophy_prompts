answer: |-
  **Desiderata Classification**
  *Genuine Desiderata:* Ordinary death, Partial-hit, Iterated runs, Amnesia, Witness case, No Collapse, No Free Precautions. These are required for physical coherence, intersubjective agreement, and rational action.
  *Hangup:* "Must give a determinate yes/no about whether the survivor is you." This assumes a further fact of identity. A Parfitian reductionist rejects this; identity can be vague or what matters is degree of continuity, not binary survival.

  **Incompatibility**
  **Iterated Runs** and **Determinate Yes/No** cannot be jointly satisfied. If you accept the physics of decoherence (Iterated Runs), personhood fades with amplitude into noise, implying vagueness. You cannot have a sharp, binary identity cutoff alongside a physical continuum where branches swamp into interference. Additionally, **No Free Precautions** is incompatible with the *goal* of Quantum Suicide (that existence guarantees subjective survival); if precautions matter, existence alone is insufficient for rational expectation.

  **Knockout Requirement**
  **No Free Precautions.** This requirement demands that branch weight (amplitude) governs rational expectation. It knocks out any theory where mere branch existence guarantees survival, forcing you to admit that in high-weight branches, you die, and you should act accordingly.

  **Theory Evaluations**
  *Naive Any-Branch-Continues:* Fails **No Free Precautions**. It implies you should never wear a seatbelt since you survive in some branch, making risk irrational. It satisfies the QS intuition but destroys decision theory.
  *Parfit-Style Psychological-Continuity:* Fails **Determinate Yes/No** (by design). It handles **Partial-Hit** and **Amnesia** well by treating survival as degrees of continuity. It dissolves the QS argument: if identity isn't binary, "I survive" is meaningless without specifying *how much* of you survives.
  *Branch-Weight Approach:* Satisfies **No Free Precautions** and **Witness Case**. It recovers standard probability (you should expect death in high-weight branches). However, it kills the "Immortality" conclusion; you have no reason to expect survival just because a low-weight branch exists.
