  1. Your credence in (P), with the decomposition made explicit. At minimum, assign probabilities to: that translation constants between plausible reference machines are small relative to the compression margins in the cases that matter; that washout under data arrives fast enough at realistic sample sizes to make fragility harmless; that the almost-sure convergence result, whose probability-one clause is taken with respect to the very prior being defended, is circular in a way that damages the justification rather than merely being a coherence condition of the same kind as a Dutch-book argument; that the justification can be recast as a machine-independent dominance or bounded-regret claim and that the recasting still delivers what the razor was supposed to deliver; that the uncomputability of the ideal prior undercuts its normative force rather than only constraining its implementation; that a framework in which a generic real number has infinite complexity can still rank theories that contain fitted continuous parameters; that the computable-environment assumption is innocent; and that the identification of scientific simplicity with short description length is not doing independent and undefended work. Add any term you think I have omitted, and say how the terms combine — do not treat them as independent without saying why.

  2. Your credence in (P) conditional on the fragile fraction being small, say under ten percent, and conditional on it being large, say over half. If those two numbers are close, tell me that my vocabulary has mislocated the issue.

  3. Which single term your final number is most sensitive to, and which you are least confident about.

  4. Where you think the 0.35 and the 0.85 actually come apart — which sub-question one of us must be resolving differently, given that we both accept the formalism.

  5. What would move your number, and by roughly how much: a machine-independent bound on expected cumulative error before convergence; a dominance theorem of the kind alluded to above; actual measurements of translation constants between real programming languages; the worst-case results often cited against the razor, in which for any prior there are computable environments on which some other prior does far better for arbitrarily long; or something else. Tell me if you think any of these results are stronger or weaker than I have represented them, and correct any technical error in my setup before you begin — I would rather have the right decomposition of the right proposition than a defence of mine.

  If you think (P) is ill-posed, say so and say why, but give me a number on the nearest well-posed proposition and tell me how far the repair moved it.
