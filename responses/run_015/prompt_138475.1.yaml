  7.  **Final Polish:** Check word count of the response (keep it concise but detailed enough to be useful). Ensure the EPQ specific requirements (AQA/Edexcel generic standards) are met (question clarity, planning, review).

  *(Self-Correction on "Timing Test"):* I recall Martha Nussbaum discusses shame as a guardian of norms. The "pre-action" vs "post-action" is similar to "deterrence" vs "rehabilitation." I need to make sure the student knows to search for those terms.

