      *   *Is the "Timing Test" original?* It's not a standard named term, but the *concept* (preventative vs. reparative) is discussed in moral psychology (e.g., D'Arms & Jacobson, Nussbaum). I need to tell the student they aren't reinventing the wheel, but their specific framing ("the flinch") is fresh.
      *   *Is the "Witnessless Shame" distinction valid?* Yes, this touches on the distinction between "external shame" (fear of exposure) and "internal shame" (failure to live up to ego-ideal). This is a solid philosophical hook.
      *   *Risk:* The project could become definitional squabbling ("What *is* shame?"). I need to ensure the failure conditions address this.

  3.  **Drafting the Proposal Structure:**

      *   **Title:** Needs to be catchy but precise.
      *   **Research Question:** Needs to be arguable. "Is shame better?" is too simple. "To what extent..." is better. Let's focus on the *function* of the emotions.
