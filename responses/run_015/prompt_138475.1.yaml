      *   **Core Insight 3 (Culture):** Can a society deliberately engineer a culture of guilt vs. shame (schools, justice, etc.), or is it organic?
      *   **Needs:** A proper EPQ proposal structure (Research Question, Rationale, Methodology, Outcomes, Failure Conditions), plus honest feedback on scope and originality.
