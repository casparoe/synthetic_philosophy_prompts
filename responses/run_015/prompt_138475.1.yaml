answer: |-
  This is an exceptionally strong starting point for a Year 13 EPQ. Most students pick a topic and ask "What is X?" You are picking a topic and asking "Why is the current definition of X insufficient, and does changing the definition change the moral verdict?" That is university-level critical thinking.

  However, 5,000 words is deceptively short for philosophy. You can easily burn 2,000 words just defining your terms. If you try to solve the Definition Split, the Timing Test, *and* the Cultural Engineering question, you will end up with three shallow chapters instead of one deep argument.

  Here is my honest feedback on your ideas, followed by a formalised EPQ proposal draft that you can adapt for your initial form.

  ### Part 1: Honest Feedback on Your Ideas

  **1. Is the "Witnessless Shame" distinction valid?**
  Yes, but it has a name already. In moral psychology and philosophy, this is often the distinction between **external shame** (fear of exposure/reputation loss) and **internal shame** (failure to live up to one's own ego-ideal).
  *   **The Risk:** If you spend too long arguing that "shame isn't just about reputation," you might just be reinventing the wheel. Philosophers like Martha Nussbaum (*Hiding from Humanity*) and J.J. Prinz have already argued that shame can be internal.
  *   **The Fix:** Don't claim you *discovered* private shame. Claim that the *popular moral consensus* (the "Guilt is Good, Shame is Bad" pop-psychology line) ignores the internal version, and that ignoring it skews the moral evaluation. Your contribution is correcting the *application* of the theory, not necessarily the theory itself.

  **2. Is the "Timing Test" original?**
  "The Timing Test" isn't a standard term, but the concept is well-trodden. It maps onto the distinction between **deterrence** (stopping the act) and **reparation** (fixing the act).
  *   **The Risk:** It turns out guilt *can* be anticipatory ("I will feel guilty if I do this"), and shame *can* be retrospective ("I am ashamed of what I did yesterday"). If the timeline isn't rigid, your test collapses.
  *   **The Fix:** Frame it as **Preventative Utility vs. Reparative Utility**. Guilt is superior for *repair*; Shame might be superior for *prevention* because it threatens the self, not just the ledger. This is a stronger philosophical claim.

  **3. Is it too big?**
  Yes, if you treat the "Culture" question as equal weight to the Emotion questions. You cannot solve "Can a society engineer its moral emotions?" in 1,500 words.
  *   **The Fix:** Make the Culture question the *implication* of your argument, not a separate pillar. If you prove Shame has preventative utility, *then* ask if it is ethical for schools to cultivate it.

  ---

  ### Part 2: The EPQ Proposal

  **Project Title:**
  *Beyond Reputation: Re-evaluating the Moral Utility of Shame through Private Experience and Preventative Timing*

  **Research Question:**
  *To what extent does the distinction between 'internal' and 'external' shame, and the timing of moral evaluation (prevention vs. repair), challenge the consensus that guilt is the superior moral emotion?*

  **Rationale (Why this question?):**
  Current moral psychology and popular discourse predominantly favour guilt over shame. The standard argument (championed by researchers like Tangney) posits that guilt is adaptive (focused on behaviour, prompting repair) while shame is maladaptive (focused on the self, prompting withdrawal). However, this consensus relies on two potentially flawed assumptions:
  1.  That shame is fundamentally about social reputation (external shame), ignoring "witnessless" or internal shame where the self judges the self without an audience.
  2.  That the value of a moral emotion should be judged primarily by its capacity for post-hoc repair, ignoring its capacity for pre-emptive prevention.

  This project seeks to determine if the "Guilt is Good" consensus holds up when shame is defined more broadly and evaluated across different temporal stages of moral action.

  **Methodology (How will I answer it?):**
  This is a theoretical philosophy project involving conceptual analysis and literature review. No primary data collection will be undertaken.

  *   **Phase 1: Conceptual Mapping (October – November)**
      *   Define 'Guilt', 'External Shame', and 'Internal Shame' using secondary sources (e.g., Tangney, Nussbaum, Williams).
      *   Establish the "Standard Consensus": Why is guilt currently ranked higher?
      *   *Deliverable:* A glossary of terms and a 1,000-word summary of the existing debate.
  *   **Phase 2: The Internal Shame Argument (December – January)**
      *   Analyse cases of "witnessless shame." Does this function differently from guilt?
      *   Test the claim: Is internal shame just "heavy guilt," or is it distinct? (e.g., Guilt says "I did bad," Internal Shame says "I am not who I thought I was").
      *   *Deliverable:* Draft of the core argument section.
  *   **Phase 3: The Timing/Utility Argument (January – February)**
      *   Compare the emotions based on **Preventative Utility** (stopping the act) vs. **Reparative Utility** (fixing the act).
      *   Investigate if shame's threat to the "self" makes it a stronger deterrent than guilt's threat to the "action."
      *   *Deliverable:* Draft of the evaluation section.
  *   **Phase 4: Cultural Implications & Synthesis (February)**
      *   Briefly apply findings to social systems (e.g., Restorative Justice vs. Disciplinary systems). If shame has preventative value, is it ethical to cultivate it?
      *   *Deliverable:* Conclusion and final polish.
  *   **Phase 5: Review and Formatting (March)**
      *   Check citations, word count, and logical flow.

  **Intended Outcome:**
  A 5,000-word dissertation that does not simply declare a "winner" between guilt and shame, but proposes a **Functional Framework**.
  *   *Successful Outcome:* The essay concludes that Guilt is superior for *reparation* and social cohesion, but Internal Shame is superior for *prevention* and integrity maintenance. It argues that the current consensus is biased by focusing only on the aftermath of wrongdoing.
  *   *Successful Outcome:* It clarifies that "shame" is being used as a umbrella term for two distinct emotions, and that moral judgments should apply to them separately.

  **Failure Conditions (What would make this project fail?):**
  1.  **Conceptual Collapse:** If, under analysis, "Internal Shame" proves to be semantically identical to "Anticipatory Guilt," the core distinction vanishes, and the project loses its thesis.
  2.  **Verbal Dispute:** If the argument devolves into arguing about labels ("Let's just call this feeling X") rather than moral function.
  3.  **Scope Creep:** If the cultural engineering section becomes too large, displacing the core philosophical argument about the emotions themselves.
  4.  **Lack of Critical Engagement:** If the essay merely reports what Nussbaum or Tangney said without evaluating whether their arguments hold up against the "Timing Test."

  ---

  ### Part 3: Strategic Advice for You

  **1. Managing the Supervisor**
  Since your supervisor "nods at everything," you need to be your own critic. When you draft your plan, send them an email saying: *"I am worried that Internal Shame and Anticipatory Guilt might be the same thing. I am going to try to prove they are different in section 2. If I can't, I will pivot to [Plan B]."* This forces them to engage or gives you a paper trail that you identified the risk.

  **2. The "No Journal Access" Problem**
  You mentioned you don't have journal access.
  *   **Google Scholar:** Use it. Look for the "PDF" link on the right side of search results. Many philosophers upload pre-prints to sites like *Academia.edu* or *PhilPapers*.
  *   **Key Names to Search:**
      *   *June Price Tangney* (The main "Guilt is Good" psychologist).
      *   *Martha Nussbaum* (Specifically her book *Hiding from Humanity* — she is pro-guilt/anti-shame, so she is your main opponent).
      *   *Bernard Williams* (Book: *Shame and Necessity*. He is the classic defence of shame. Essential reading).
      *   *Gabriel Taylor* (Writes on "Pride, Shame, and Guilt").
      *   *Ruth Benedict* (Old anthropology, *The Chrysanthemum and the Sword*, coined "Guilt Culture vs Shame Culture" — good for the culture section, but treat her findings as dated).

  **3. The "Timing Test" Trap**
  Be careful not to say "Shame stops you, Guilt fixes it." Guilt *also* stops you (anticipatory guilt is a huge motivator).
  *   **Your Nuance:** Your argument should be that Shame stops you *differently*. Guilt stops you because you don't want to create a debt. Shame stops you because you don't want to *become* a debtor. It's a difference in *identity* vs. *accounting*. If you nail that distinction, you have a Distinction/A* project.

  **4. Word Count Discipline**
  *   Intro: 500 words.
  *   Lit Review (The Standard View): 1,000 words.
  *   Argument 1 (Internal vs External Shame): 1,500 words.
  *   Argument 2 (Prevention vs Repair): 1,500 words.
  *   Cultural Implication: 500 words.
  *   Conclusion: 500 words.
  *   *Stick to this.* If you write 2,000 words on the cultural stuff, you won't have space for the philosophy.

  **Verdict:**
  This is not too big, provided you treat the "Culture" section as a footnote to the main argument. The "Timing Test" is not a restatement of existing work *if* you frame it as **Identity-Threat vs. Action-Threat**. That is a solid philosophical hook.

  Go for it. Just don't let your supervisor nod you into a corner where you haven't defined your terms.
