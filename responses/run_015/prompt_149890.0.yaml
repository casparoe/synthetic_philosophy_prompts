prompt: |-
  I'm a PhD student in moral philosophy and I'm trying to nail down what people actually mean when they say "people in glass houses shouldn't throw stones" in debates about hypocrisy and standing to blame. I heard it used recently when someone called out a colleage for missing grant deadlines while being chronically late themselves — the reply was essentially that slogan, and it seemed to shut down the criticism entirely. But I'm not sure what work it's doing. Could you lay out the different precise claims it might stand for? For instance: is it about forfeiting moral standing because you're guilty of the same vice? Is it an epistemic claim that you can't reliably judge others if you're flawed? Is it about the expressive meaning of blame being undermined when the speaker is tainted? Or is it a practical point about lacking authority to advise? For each, say whether it's plausible and whether it actually gets the speaker off the hook in that kind of workplace case. There's also a twist I'm playing with: what if the blame is about a professional role-specific failure (missing grant deadlines) and the speaker's matching flaw is purely personal (being late to dinner)? Does the slogan still apply, or does it depend on domain-matching? I want a menu of readings, not just one, and please flag which ones can handle that domain-sensitivity and which ones collapse it. Please write your answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** PhD student in moral philosophy.
      *   **Topic:** The meaning and function of the proverb "people in glass houses shouldn't throw stones" in the context of hypocrisy and standing to blame.
      *   **Specific Scenario:** A colleague calls out another for missing grant deadlines; the accused replies that the accuser is chronically late (presumably to meetings or similar). The proverb shuts down the criticism.
      *   **Task:** Lay out different precise philosophical claims the slogan might stand for (forfeiture of standing, epistemic reliability, expressive meaning, practical authority).
      *   **Evaluation:** For each claim, assess plausibility and whether it actually gets the speaker off the hook in the workplace case.
      *   **Twist/Constraint:** Address domain-sensitivity (professional failure vs. personal flaw). Does the slogan apply if the flaws don't match domains? Which readings handle this and which collapse it?
      *   **Format:** Menu of readings, British English.

  2.  **Deconstruct the Proverb ("Glass Houses"):**
      *   Literal meaning: If you live in a fragile house, throwing stones is risky because they might bounce back and break your windows.
      *   Common usage: Don't criticize others for faults you possess yourself.
      *   Philosophical context: The ethics of blame, standing to blame, hypocrisy.

  3.  **Brainstorm Philosophical Readings (The "Menu"):**

      *   *Reading 1: The Forfeiture of Standing (Moral Authority).*
          *   Idea: By committing the same wrong, you lose the right to blame.
          *   Mechanism: Commitment/Implication. Blaming implies you hold yourself to the norm. Violating it makes the blame insincere or unfair.
          *   Domain sensitivity: High. Usually requires the *same* norm violation.

      *   *Reading 2: The Epistemic Deficit (Reliability).*
          *   Idea: If you do the thing, you can't see clearly why it's wrong. Your judgment is clouded.
          *   Mechanism: Cognitive bias, rationalisation.
          *   Domain sensitivity: Medium/High. Being late to dinner might not cloud judgment on grant deadlines.

      *   *Reading 3: The Expressive/Communicative Account.*
          *   Idea: Blame is a communicative act. Hypocrisy undermines the message. It says "I value X, you violated X," but your actions say "X isn't that important."
          *   Mechanism: Inconsistency undermines the force of the speech act.
          *   Domain sensitivity: High. Requires relevant similarity in values expressed.

      *   *Reading 4: The Prudential/Consequentialist Warning.*
          *   Idea: It's not about *right*, it's about *risk*. If you criticize, you invite scrutiny.
          *   Mechanism: Retaliation, exposure.
          *   Domain sensitivity: Low. Any vulnerability makes you risky to attack.

      *   *Reading 5: The Virtue Ethics/Character Reading.*
          *   Idea: The blamer lacks the virtue required to administer correction benevolently.
          *   Mechanism: Arrogance, lack of self-awareness.
          *   Domain sensitivity: Medium. General character flaws might suffice.

  4.  **Develop the Analysis for Each Reading:**
      *   Need to define the claim precisely.
      *   Assess plausibility (philosophically).
      *   Apply to the specific case (Grant deadlines vs. Chronic lateness).
      *   Address the "Twist" (Domain matching).

  5.  **Address the "Twist" (Domain Sensitivity):**
      *   *Scenario:* Accuser is late to dinner (personal); Accused misses grants (professional).
      *   *Strict Matching:* Forfeiture and Expressive accounts usually demand the *same* norm. Being late to dinner doesn't necessarily forfeit standing on grant deadlines.
      *   *Loose Matching:* Prudential account doesn't care. Virtue account might care (general unreliability).
      *   *Conclusion:* The slogan is often used loosely to deflect, but philosophically, it holds less water without domain matching.

  6.  **Drafting the Content (incorporating British English):**
      *   *Spelling:* Behaviour, analyse, programme, colleague (standard), defence (noun).
