answer: |-
  # Design Work: Dependency Relations & Pedagogical Judgments

  ### 1. Dependency Map
  *   **Core Node:** *Program Equilibrium* (PE).
  *   **Genuine Presuppositions:**
      *   **Nash Equilibrium (NE):** Students must understand NE as a fixed point where no player benefits from unilateral deviation. (Philosophy students have this; CS students need a 2-minute refresh).
      *   **Strategy as Complete Plan:** A strategy must specify action for every contingency. (Philosophy students have this; CS students often view programs as *procedures* rather than *strategies*).
      *   **Observability:** For PE to work, the "move" (source code) must be observable before execution. (CS students assume this; Philosophy students need it explicitly stated as a rule change).
  *   **Apparent (but False) Presuppositions:**
      *   **Computability/Provability:** It *feels* like you need to know how the programs verify each other (Löb's theorem, halting problem). *Judgment:* You do not. You need only the *concept* of verification, not the mathematical machinery.
      *   **Iteration:** It *feels* like cooperation requires repeated interaction. *Judgment:* This must be explicitly broken. PE is strictly one-shot.
  *   **The Agency Node:** The question "Who chooses the program?" presupposes the definition of PE. However, to understand *why* it matters, students must first see that PE yields different outcomes than standard NE.
      *   *Pedagogical Judgment:* I will introduce the "Who chooses?" question *after* establishing the mechanics but *before* discussing the normative implications. If introduced too early, it distracts from the mechanism. If introduced too late, it feels like an afterthought rather than the core philosophical pivot.

  ### 2. The Housing Lottery Complication
  *   **The Damage:** Students view the program as a *delegate* (an agent with the student's interests but separate agency) rather than a *tool* (a direct extension of the student's will).
  *   **The Fix:** This must be addressed in the first 10 minutes. If not, they will treat the program equilibrium as a principal-agent problem (how do I stop my bot from going rogue?) rather than a strategic commitment problem (how do I bind my future self?).
  *   **Board Move:** Draw a stick figure (You) holding a puppet (Bot). Cross out the stick figure. Label the puppet "You."

  ### 3. The Provability Decision
  *   **Decision:** **Exclude** the provability-based variant (Cooperate iff I can *prove* you Cooperate).
  *   **Reasoning:** Explaining Löb's theorem or even the nuance of "provable cooperation" without hand-waving requires more than 5 minutes and risks losing the Philosophy students entirely while boring the CS students with a shallow treatment of logic they know is deep.
  *   **Replacement:** Use **Bounded Simulation** (Cooperate iff `Simulate(Opponent, Me)` returns Cooperate within $N$ steps).
  *   **Why:** It respects the CS students' knowledge of the Halting Problem (acknowledge the timeout) and gives Philosophy students a concrete causal mechanism (prediction) rather than a logical abstraction (provability).

  ### 4. Omissions (To be stated explicitly)
  1.  **Computational Cost:** We assume writing/running code is free. (In reality, complex strategies cost resources).
  2.  **Obfuscation:** We assume source code is transparent. (In reality, code can be encrypted or obscured).
  3.  **Coalitions:** We assume two players. (This sets the hook for the future session on multi-player deviation).

  ---

  # The Seminar Plan (75 Minutes)

  ## Phase 1: Detox and Setup (00:00 – 00:15)

  **Goal:** Clear the "Housing Lottery" misconception and establish the rules of the new game.

  1.  **The Housing Intervention (5 mins):**
      *   *Prompt:* "Two weeks ago, you argued about bidding bots. You thought of them as employees: you give them a goal, they go do it."
      *   *Board Move:* Draw `Student -> [Goal: Get Room] -> Bot`.
      *   *Correction:* "In Program Equilibrium, there is no Student. There is only the Bot. The Bot is not your agent; it is your *move*."
      *   *Board Move:* Erase `Student`. Draw `[Bot]` in the game matrix slot.
      *   *Why:* Prevents the "rogue agent" worry. The program doesn't *have* aims; it *executes* logic.

  2.  **The Standard Baseline (5 mins):**
      *   Draw standard Prisoner's Dilemma payoff matrix.
      *   Ask Philosophy students: "What is the unique Nash Equilibrium?" (Defect, Defect).
      *   Ask CS students: "Why?" (Dominance).
      *   *Constraint:* Emphasize this is a **one-shot** game. No reputation, no future rounds.

  3.  **The Rule Change (5 mins):**
      *   "We are changing the definition of a 'Move'."
      *   *Old Move:* Choose C or D.
      *   *New Move:* Submit a Program (source code).
      *   *Mechanism:* The Referee reads both source codes. The programs run. They output C or D. Payoffs are assigned based on outputs.
      *   *Crucial Detail:* The programs can read *each other's* source code before outputting.

  ## Phase 2: The Mechanism and The Equilibrium (00:15 – 00:40)

  **Goal:** Show how Cooperation becomes stable without dissolving the dilemma.

  1.  **The Carrying Example: "The Mirror Bot" (10 mins):**
      *   *Reject Candidates:* (a) is too noisy, (c) implies sequential threats.
      *   *Select:* **The Conditional Cooperator.**
      *   *Definition:* Program $P$ says: "Simulate the opponent playing against me. If they output C, I output C. If they output D (or loop/timeout), I output D."
      *   *Board Move:* Write pseudo-code on the board.
          ```text
          function MyMove(OpponentSource):
              if Simulate(OpponentSource, MySource) == COOPERATE:
                  return COOPERATE
              else:
                  return DEFECT
          ```
      *   *CS Check:* Acknowledge the Halting Problem. "We assume a timeout. If it takes too long, we treat it as Defect."
      *   *Phil Check:* "This is not a promise. It is a causal fact."

  2.  **Establishing the Equilibrium (10 mins):**
      *   *Scenario:* Player 1 submits Mirror Bot. Player 2 submits Mirror Bot.
      *   *Execution:* P1 simulates P2. P2 simulates P1.
      *   *The Worry:* "Isn't this infinite recursion?"
      *   *Resolution:* "We treat the simulation as a logical lookup. If both are identical Mirror Bots, the simulation resolves to Cooperation." (Keep this axiomatic for now to avoid logic swamp).
      *   *Result:* Outcome is (C, C).
      *   *Is it an Equilibrium?*
          *   If Player 1 switches to "Always Defect": P2's Mirror Bot simulates P1, sees Defect, and Defects. Outcome (D, D). P1 gets lower payoff than (C, C).
          *   Therefore, given P2 plays Mirror Bot, P1's best response is Mirror Bot.
          *   *Conclusion:* (Mirror, Mirror) is a Nash Equilibrium in the *program space*.

  3.  **Why the Dilemma Remains (5 mins):**
      *   *Question:* "Did we solve the Prisoner's Dilemma?"
      *   *Answer:* No.
      *   *Board Move:* Draw the original (Defect, Defect) outcome.
      *   *Explanation:* If Player 1 submits "Always Defect" and Player 2 submits "Always Defect", neither can unilaterally improve. (D, D) is *also* a Program Equilibrium.
      *   *Key Insight:* We have not removed the bad equilibrium; we have *added* a good one. The strategic problem shifts from "How do I defect?" to "Which equilibrium program do I submit?"

  ## Phase 3: Rational Agency (00:40 – 00:55)

  **Goal:** Address the philosophical shift in what it means to act.

  1.  **The Agency Pivot (10 mins):**
      *   *Question:* "In standard PD, you choose an action in the moment. In PE, when did you make your choice?"
      *   *Discussion:* You chose when you wrote the code. The execution is automatic.
      *   *Philosophical Hook:* This separates *will* from *action*. You bind your future self.
      *   *CS Hook:* This is "pre-commitment via compilation."
      *   *Synthesis:* Rationality is no longer about choosing the best *move* given the opponent's move; it is about choosing the best *disposition* (program) given the opponent's disposition.

  2.  **Addressing the "Cheat" Intuition (5 mins):**
      *   *Student Objection:* "This feels like cheating. Real life doesn't let me read your mind."
      *   *Response:* "Correct. This model asks: What if transparency were possible? It isolates the effect of *commitment* from the effect of *secrecy*."
      *   *Connection to Housing:* "In the housing lottery, you wanted the bot to be secret. Here, the power comes from the bot being public."

  ## Phase 4: Check for Understanding (00:55 – 01:05)

  **Goal:** Distinguish conceptual grasp from pattern matching.

  1.  **The Test Game: "The Unilateral Vulnerability"**
      *   *Setup:* A modified game.
          *   Player 1 (Investor): Can Send $0 or Send $10.
          *   Player 2 (Trustee): If $0, game ends (0, 0). If $10, Trustee can Keep ($20, $0) or Return ($10, $10).
      *   *Standard NE:* Player 2 Keeps (dominant). Player 1 Sends $0. Outcome (0,0).
      *   *Program Equilibrium Setup:* Both submit programs. Player 2's program can read Player 1's. Player 1's program *cannot* read Player 2's (Asymmetric Visibility).
      *   *Question:* "In this Asymmetric Program Equilibrium, does Player 1 send the $10?"

  2.  **The Answers:**
      *   *Correct Answer:* **No.**
      *   *Reasoning:* Even if Player 1 submits "Send iff You Return," Player 1's code cannot *verify* Player 2's code (asymmetry). Player 2 sees Player 1's code, sees "Send," and submits "Keep." Player 1 anticipates this and Sends $0.
      *   *What this shows:* They understand that PE requires *mutual* transparency/verification to sustain cooperation. It's not magic; it's mechanical.
      *   *Plausible Wrong Answer:* **Yes**, because they can agree to cooperate.
      *   *Diagnosis:* They are pattern-matching "Program Equilibrium = Cooperation." They have missed the mechanism (source code reading) and reverted to "cheap talk" or "agreement."

  3.  **Alternative Wrong Answer:** **No**, because Defection is dominant.
      *   *Diagnosis:* They haven't grasped that the *strategy space* has changed. They are still thinking in terms of actions, not programs. (Though in this specific asymmetric case, the outcome is the same, the reasoning matters). *Correction:* Ensure the question emphasizes *why*. If they say "No" because "P2 can't be trusted," ask "Would it change if P1 could read P2's code?" If they say "Yes," they get it.

  ## Phase 5: Omissions and Hooks (01:05 – 01:15)

  **Goal:** Manage expectations and set up the next session.

  1.  **The Three Omissions (5 mins):**
      *   State clearly: "We assumed three things that aren't true in the real world."
      *   1. **Cost:** Writing complex code is hard. (Sometimes simple 'Defect' is better than complex 'Mirror').
      *   2. **Obfuscation:** You can encrypt your code. (If you can't read me, we are back to standard PD).
      *   3. **Two Players:** (The Hook).

  2.  **The Hook for Next Time (5 mins):**
      *   "Today we saw that (Mirror, Mirror) is stable. But what if three people play? Can two of them write programs that cooperate with each other but defect against the third?"
      *   "What if a coalition of programs gangs up on a singleton?"
      *   "Next time: Coalitional Program Equilibrium."

  3.  **Final Q&A.**

  ---

  # Misconception Map

  | Misconception | When it arises | The Board/Sentence Move |
  | :--- | :--- | :--- |
  | **"The Bot is my Delegate"** (Housing Lottery) | Min 0-5 | **Board:** Erase the "Student." Label the Bot "The Player." **Sentence:** "You are not hiring a lawyer; you are becoming a robot for 5 minutes." |
  | **"This is just Repeated PD"** | Min 20 (Mechanism) | **Board:** Write "ONE SHOT" in large letters. **Sentence:** "There is no tomorrow. The simulation is not a future round; it is a logical check." |
  | **"Infinite Regress / Hanging"** | Min 25 (Simulation) | **Board:** Write `Timeout = 1 sec`. **Sentence:** "We stipulate a timeout. If you think too long, I defect. This is a rule of the game, not a bug." |
  | **"It Solves the Dilemma"** | Min 40 (Equilibrium) | **Board:** Draw (D,D) next to (C,C). **Sentence:** "Defect-Defect is still an equilibrium. We added a ladder; we didn't remove the pit." |
  | **"It's Just Cheap Talk"** | Min 55 (Check for Understanding) | **Board:** Draw a lock on Player 2's code. **Sentence:** "Talk is free. Code is binding. If you could talk your way to (C,C), you would have done it in standard PD." |
  | **"Correct Insight: DD is still stable"** | Min 40 | **Welcome this.** This shows they understand equilibrium stability. Validate: "Exactly. The set of equilibria has expanded, not replaced." |
  | **Unanticipated: "What if I submit random code?"** | Min 30 | **Defuse:** "Treat random noise as Defect. It breaks the verification condition." |

  ---

  # Audience Engagement Strategy

  **1. The Two Moments Philosophers Will Lose:**
  *   **Moment:** When explaining `Simulate(Opponent, Me)`.
  *   **Risk:** They will get bogged down in the metaphysics of "Can a program know itself?"
  *   **Fix:** Treat it functionally. "Don't ask *how* it knows. Ask *what happens* if it does. It's a black box that returns C or D."
  *   **Moment:** When discussing "Agency."
  *   **Risk:** They will drift into free will debates.
  *   **Fix:** Anchor it in *time*. "The choice happens at $T_0$ (coding), not $T_1$ (execution). That is the only shift in agency."

  **2. The Two Moments CS Students Will Lose:**
  *   **Moment:** When defining "Equilibrium."
  *   **Risk:** They will view NE as an algorithm to find a solution, not a stability property.
  *   **Fix:** Use the "Unilateral Deviation" test. "If I change my code and you don't, do I win? If no, it's an equilibrium."
  *   **Moment:** When discussing "Rationality."
  *   **Risk:** They will think "Rational = Maximizing Payoff" implies I should always defect.
  *   **Fix:** Distinguish *ex-ante* rationality (choosing the program) from *ex-post* rationality (running the code). "It is rational to write a program that limits your future options."

  ---

  # Decision on Provability Logic

  **Decision:** **Do not include the provability variant.**

  **Reasoning:**
  1.  **Time:** Löb's theorem cannot be explained honestly in 5 minutes.
  2.  **Audience Split:** Philosophy students will get lost in the modal logic; CS students will get annoyed by the lack of rigor regarding the Halting Problem.
  3.  **Pedagogical Goal:** The point of the session is *Game Theory* and *Agency*, not *Logic*. The "Bounded Simulation" model achieves the same conceptual result (conditional cooperation is stable) without the technical overhead.

  **Replacement Strategy:**
  *   When the "Circularity Worry" arises (Min 25), acknowledge it directly.
  *   *Say:* "CS students know this looks like infinite recursion. Philosophers know this looks like circular reasoning."
  *   *Solution:* "We model this as a **Bounded Simulation**. The referee runs the code for $N$ steps. If it doesn't halt, it counts as Defect."
  *   *Why this works:* It satisfies the CS requirement for computability (it halts) and the Philosophy requirement for causality (the output is determined by the input). It sidesteps Löb's without lying.
