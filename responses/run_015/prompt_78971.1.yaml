      *   Strict Conditionalization: $P_{new}(H) = P_{old}(H|E)$. Commutative: $P(H|E \& F) = P(H|F \& E)$.
      *   Jeffrey Conditionalization: $P_{new}(H) = \sum P_{old}(H|E_i) P_{new}(E_i)$. Requires a partition $\{E_i\}$.
      *   Non-commutativity: If Agent 1 updates on Partition A then Partition B, and Agent 2 updates on Partition B then Partition A, $P_{1}(H) \neq P_{2}(H)$ generally.
      *   Why? Because the second update assumes rigidity on the *new* probabilities relative to the *intermediate* partition, but the intermediate probabilities differ based on the first update.
      *   The "Plain Language Failure": Trying to say "I just weighted the evidence" fails because the weighting depends on the background state created by the previous weighting.

