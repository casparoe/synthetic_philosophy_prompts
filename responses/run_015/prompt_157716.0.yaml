answer: |-
  Here is the complete specification of desiderata for a theory of utility ascription, structured to resolve the stalemate between revealed-preference behaviorism, mentalism, and constructivism.

  ### I. Core Desiderata: Phenomenological and Behavioral Coverage

  An adequate theory must map utility ascriptions to truth-conditions that satisfy the following cases. These are not anomalies to be smoothed over; they are boundary conditions that define the semantic range of "utility."

  **1. Standard Rationality (The Baseline)**
  *   **Requirement:** In conditions of stable context and full information, the theory must recover Completeness and Transitivity.
  *   **Why a Constraint:** If a theory cannot recover standard axioms where behavior is stable, it lacks the formal power to model coordination or equilibrium. It must explain why the *pattern* exists, not just that it exists.

  **2. Reflectively Endorsed Cycles**
  *   **Requirement:** The theory must allow for utility ascriptions where $A \succ B \succ C \succ A$ without labeling the agent irrational, provided the agent endorses the cycle upon reflection (e.g., valuing variety, exploration, or aesthetic rotation).
  *   **Why a Constraint:** Standard theory treats cycles as error. If an agent asserts, "I value the rotation itself," treating this as a mistake imposes an external norm of static consistency over a dynamic value.
  *   **Distinction to Preserve:** **Procedural Rationality vs. Substantive Ordering.** The theory must distinguish between the *process* of choosing (which may be cyclic) and the *satisfaction* of the choice (which may be high).

  **3. Knowledgeable Framing Reversals**
  *   **Requirement:** The theory must assign different utility values to extensionally equivalent options if the agent chooses differently despite knowing the equivalence (e.g., the Asian Disease Problem).
  *   **Why a Constraint:** If utility refers only to objective outcomes, framing effects are noise. If they are robust and known, utility must refer to the *description-relative* valuation, not the state of the world.
  *   **Distinction to Preserve:** **Revealed Preference vs. Revealed Judgment.** The agent prefers Option A in Frame 1 but *judges* Frame 1 and Frame 2 to be equivalent. A theory that collapses preference into judgment cannot explain why the agent doesn't self-correct.

  **4. Genuine Incompleteness**
  *   **Requirement:** The theory must distinguish between $A \sim B$ (indifference) and $A \perp B$ (no comparison).
  *   **Why a Constraint:** Indifference implies equal utility; incompleteness implies undefined utility. Collapsing them forces artificial trade-offs in moral or life-altering decisions (e.g., "career vs. family") where the agent feels no equality, only incommensurability.
  *   **Distinction to Preserve:** **Equality of Value vs. Absence of Relation.** Behaviorally, both look like random choice or refusal to choose. Semantically, they are opposites.

  **5. Intertemporal Value Drift (Mistake without Irrationality)**
  *   **Requirement:** The theory must allow Time-$t_2$ to ascribe lower utility to Time-$t_1$'s choice without ascribing a reasoning error to Time-$t_1$.
  *   **Why a Constraint:** Standard discounting models treat this as time-inconsistency (irrationality). However, agents often view past selves as having different *values*, not broken logic (e.g., "I wanted fame then; I want peace now").
  *   **Distinction to Preserve:** **Diachronic Identity vs. Diachronic Rationality.** The theory must accommodate change in the *reference* of utility over time without treating the agent as a sequence of conflicting rational actors.

  ---

  ### II. Non-Negotiable Consistency Conditions

  These conditions constrain the *metaphysics* of the theory. I have flagged which are camp-specific dogmas and which are genuine adequacy conditions required for the theory to function in the actual world.

  **1. Empirical Equivalence (Adequacy Condition)**
  *   **Specification:** Where behavior satisfies WARP (Weak Axiom of Revealed Preference), the theory must yield a utility function isomorphic to the standard neoclassical representation.
  *   **Rationale:** Without this, the theory cannot interface with existing economic models or policy analysis.

  **2. Distributed Realization (Adequacy Condition)**
  *   **Specification:** The theory must be compatible with neuroscience findings that show no single, localized "utility signal" (e.g., no specific neuron or region codes for $U(x)$ universally). Utility must be realizable via distributed computation or context-dependent circuitry.
  *   **Rationale:** If utility refers to a specific neural state that does not exist, the term is empty.
  *   **Camp Flag:** *Mentalists* often violate this by reifying utility as a specific qualia or firing rate. *Behaviorists* satisfy this trivially by denying the neural state matters.

  **3. Presumptive First-Person Authority (Adequacy Condition)**
  *   **Specification:** In domains of immediate phenomenology (pain, effort, conscious intent), the agent's self-ascription of utility must be defeasibly privileged over observer ascription.
  *   **Rationale:** If an observer can consistently override an agent's report of their own suffering or satisfaction, "utility" ceases to mean *welfare* and becomes purely *control*.
  *   **Camp Flag:** *Strict Behaviorists* violate this (dogma: only choice matters). *Constructivists* risk violating this (if utility is imposed by the theorist, the agent's view is secondary).

  **4. No Occult Entities (Camp-Specific Preference)**
  *   **Specification:** "Do not posit unobservable mental states."
  *   **Status:** **Reject.** This is behaviorist dogma, not an adequacy condition. A theory is adequate if the unobservables do explanatory work, not if they are visible.

  **5. Normative Neutrality (Camp-Specific Preference)**
  *   **Specification:** "Utility must not imply what the agent *ought* to choose."
  *   **Status:** **Reject.** This is positivist dogma. An adequate theory may need to link utility to normative reasons to explain reflective endorsement.

  ---

  ### III. The Structural Tension: The Impossible Trinity

  There is a subset of desiderata that appears jointly unsatisfiable. This is not a contingent difficulty but a structural trilemma. You can satisfy any two, but not all three:

  1.  **Behavioral Determinacy:** Utility is fully determined by actual choice data (Revealed Preference).
  2.  **First-Person Authority:** The agent's introspective report can override choice data (e.g., "I chose X, but I prefer Y").
  3.  **Zero Normative Construction:** Utility describes what *is* valued, not what *should be* valued (No theorist imposition).

  **The Conflict:**
  *   If you hold **(1) and (3)**, you must deny **(2)**. (Behaviorism: If you chose it, you wanted it. Your protest is irrelevant.)
  *   If you hold **(2) and (3)**, you must deny **(1)**. (Mentalism: You chose X due to weakness of will; your true utility is Y. Choice does not determine utility.)
  *   If you hold **(1) and (2)**, you must deny **(3)**. (Constructivism/Normativism: We ascribe utility based on a mix of choice and report to make the agent look rational. Utility is a normative idealization.)

  **Verdict:** The tension is **structural**. It arises from the definition of utility as simultaneously *predictive of behavior*, *descriptive of welfare*, and *objective*.

  ---

  ### IV. Evaluation of Standard Positions

  **1. Strict Behaviorist Reconstruction**
  *   **Score:** Fails First-Person Authority; Fails Hard Cases (treats cycles/framing as noise).
  *   **Fatal Flaw:** Cannot handle **Reflectively Endorsed Cycles**. By defining utility *as* choice, it cannot account for cases where the agent chooses against their preference pattern for a higher-order reason. It collapses the distinction between *preference* and *judgment*.

  **2. Mental-State Causal Theory**
  *   **Score:** Satisfies First-Person Authority; Fails Distributed Realization.
  *   **Fatal Flaw:** **Neuroscience Compatibility.** It posits a "utility state" that causes choice. Since neuroscience finds no unitary utility signal, this theory risks referring to a homunculus. It also struggles with **Framing Reversals**: why does the mental state change if the informational content is known to be identical?

  **3. Normative-Constructivist Account**
  *   **Score:** Satisfies Hard Cases; Risks Empirical Equivalence.
  *   **Fatal Flaw:** **Behavioral Determinacy.** By treating utility as a normative artifact imposed to make sense of the agent, it risks losing contact with actual behavior. If the theorist can override choice to preserve "rationality," the theory becomes unfalsifiable.

  **The Single Most Damaging Requirement:**
  **Presumptive First-Person Authority.**
  This requirement destroys the Behaviorist account (which denies internal access) and strains the Mentalist account (which must explain why authority exists without a dedicated neural substrate). It forces the theory to acknowledge a gap between *what is chosen* and *what is experienced*, which standard decision theory is designed to close.

  ---

  ### V. Revision Conditions and Reasoning Flags

  **What would lead me to drop a Non-Negotiable?**
  1.  **Drop First-Person Authority:** If empirical work (e.g., Wegner-style illusion of will studies) demonstrates conclusively that self-reports of utility are systematically less predictive of future welfare than algorithmic choice data, authority must be downgraded to "heuristic."
  2.  **Drop Distributed Realization:** If neuroscience identifies a "common currency" neuron or circuit (e.g., specific dopaminergic coding that scales perfectly across all goods), the Mentalist claim becomes viable, and the constraint against localized signals is false.
  3.  **Drop Empirical Equivalence:** If standard choice axioms are proven to fail even in idealized, stable environments (not just due to framing), then recovering WARP is no longer an adequacy condition but a historical artifact.

  **Where My Reasoning is Most Likely to Fail:**
  1.  **The Coherence of Reflective Endorsement:** I assume "reflectively endorsed cycles" are coherent. It is possible that upon *full* reflection, cycles dissolve. If endorsement is always temporary or based on ignorance, the "Hard Case" collapses back into standard irrationality.
  2.  **Interpretation of Neuroscience:** The constraint "no single localized utility signal" may be a category error. Utility might be a *computational property* of a network, not a *localized signal*. If I am demanding a "utility neuron" to falsify Mentalism, I am attacking a straw man. The constraint should be "no *simple* physical correlate," not "no correlate."
  3.  **The Normative/Descriptive Boundary:** I treat "Normative Construction" as distinct from "Description." However, if human cognition is inherently normative (we *think* in terms of reasons), then a purely descriptive theory is impossible by definition. The trilemma might dissolve if description *requires* construction.

  **Final Instruction:** To break the stalemate, do not ask which theory is "true." Ask which leg of the Impossible Trinity you are willing to sever. If you keep Authority and Determinacy, you must accept that Utility is a Construct. If you keep Determinacy and Objectivity, you must accept that Agents are Wrong about their own minds.
