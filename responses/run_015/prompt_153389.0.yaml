      *   *Claim:* "His explanation is that they were under orders and would have been in serious trouble if they'd refused..." -> *Verdict:* **Major Red Flag.** Browning explicitly found that refusal carried *no* serious consequences. This is a common misconception.
      *   *Claim:* "...once you've killed once you keep going because you can't face admitting to yourself what you've already done." -> *Verdict:* Partially true (brutalization), but not the *only* factor.
      *   *Claim:* "Goldhagen... said... eliminationist antisemitism was just part of German culture... they tortured people for fun." -> *Verdict:* Accurate summary of Goldhagen's thesis.
      *   *Claim:* "So the real argument between them is about how much ordinary Germans actually knew about the killings." -> *Verdict:* **Wrong.** The argument is about *motivation*, not knowledge. Everyone knew eventually.
      *   *Claim:* "The field has basically settled it in Browning's favour now, nobody takes Goldhagen seriously anymore." -> *Verdict:* Mostly true regarding Goldhagen's monocausal explanation, but Browning isn't the final word either.
