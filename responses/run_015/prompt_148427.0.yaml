  **Course:** HIS 405 – Historical Method & Theory  
  **Assessment:** Final Examination (Essay Component)  
  **Time Allowed:** 90 Minutes  
  **Total Marks:** 30  

  ***

  ### Exam Question

  hey so ive been thinking about history explanations and i keep running into this thing where people list like five reasons for some big event and it feels like theyre just stacking causes without asking if they actually do seperate work. i made up this term **shadow-causation** for when one cause looks sufficient on its own but really it just flipped the switch on the real one. 

  for this essay, i want you to look at a hypothetical case study: the **1912 Greystone textile strike collapse**. 

  historians usually list three causes for why the strike failed so quickly:  
  1. the local ironworks suddenly shut down (economic pressure);  
  2. union leader Mara Voss gave a fiery speech (morale/organization);  
  3. a new labor law was passed that same week (legal framework).

  your job is to not just list these, but figure out how they interact. classify each pair of causes as either:  
  *   **Genuinely overdetermined** (each alone was enough to kill the strike);  
  *   **Jointly sufficient** (neither alone was enough, but together they did it);  
  *   **Shadow-causal** (one only worked because it triggered the other).

  then, you need to argue whether putting all three in the historical explanantion actually makes it better or just creates redundancy. does listing more causes always mean a stronger story, or are we just padding the bill? 

  dont worry about citations or bibliographies since this is meant to test your logic. just focus on the causal mechanics. 

  ***

  ### Model Answer

  **Candidate Number: 0042**  
  **Topic:** Causal Mechanics in the Greystone Strike Collapse  

  **Introduction**  
  Historical explanation often suffers from accumulative bias—the assumption that listing more causes yields a more robust narrative. In the case of the 1912 Greystone textile strike, the standard triad of causes (ironworks shutdown, Voss's speech, new labor law) requires disentanglement. This essay argues that the relationship between these factors is not overdetermined but largely shadow-causal and jointly sufficient. Consequently, including all three without qualification creates redundancy rather than explanatory depth.

  **Analysis of Causal Pairs**  
  To determine the nature of these causes, we must assess their independent sufficiency.  

  *Ironworks Shutdown vs. Mara Voss's Speech:*  
  These are not overdetermined. The ironworks shutdown removed the economic leverage of the strikers (no production means no leverage), but without organization, workers might have simply drifted away rather than formally collapsing the union. Conversely, Voss's speech could rally morale, but without the economic pressure of the shutdown, the strike might have continued despite low morale. Therefore, these are **jointly sufficient**. The shutdown created the vulnerability; the speech (or lack of counter-speech) finalized the collapse of will.  

  *Ironworks Shutdown vs. New Labor Law:*  
  Here we see **shadow-causation**. On the surface, the new labor law appears sufficient; it legally undermined the strike's demands. However, legal changes often take months to enforce. The law only had immediate effect because the ironworks shutdown created a crisis of immediacy. The shutdown "flipped the switch" that made the law relevant *that week*. Without the shutdown, the law would have been background noise. The law looks like the cause, but the shutdown was the trigger.  

  *Voss's Speech vs. New Labor Law:*  
  These are likely **jointly sufficient** but weak on their own. A speech cannot change law; a law cannot change morale instantly. Together, however, the law gave Voss's opponents ammunition, and her speech failed to counter it.  

  **Argument on Redundancy vs. Explanation**  
  Listing all three causes as equal factors creates a misleading explanantion. If the labor law is shadow-causal to the ironworks shutdown, listing them as separate, equal weights inflates the importance of the legal framework. It suggests the strike failed because of legislation, when it actually failed because of economic shock that made the legislation matter.  

  Furthermore, assuming more causes equals a stronger story is a fallacy. If Cause A triggers Cause B, counting both as independent variables is double-counting. A stronger historical explanation would prioritize the ironworks shutdown as the primary driver, treating the labor law as the mechanism through which the shutdown exerted pressure, and Voss's speech as the failing mitigation strategy.  

  **Conclusion**  
  The Greystone case demonstrates that multi-causal explanations often mask hierarchical relationships. By classifying the labor law as shadow-causal to the ironworks shutdown, we reduce redundancy. A better explanation does not list three causes, but one primary cause (economic shutdown) operating through a legal mechanism, compounded by organizational failure. Quality of causal linkage matters more than quantity.

  ***

  ### Marking Scheme (30 Marks Total)

  **Section 1: Concept Application (10 Marks)**  
  *   **Correct Classification (6 marks):**  
      *   +2 marks for correctly identifying at least one pair as **Jointly Sufficient** (e.g., Shutdown + Speech).  
      *   +2 marks for correctly identifying at least one pair as **Shadow-Causal** (e.g., Law dependent on Shutdown).  
      *   +2 marks for explicitly rejecting **Overdetermination** for the majority of pairs (arguing that none were truly sufficient alone).  
  *   **Definition Usage (4 marks):**  
      *   +2 marks for using the user's definition of shadow-causation (trigger vs. real cause) rather than a standard dictionary definition.  
      *   +2 marks for distinguishing "overdetermination" from "joint sufficiency" clearly.  

  **Section 2: Case Study Analysis (10 Marks)**  
  *   **Greystone Specifics (5 marks):**  
      *   +5 marks for applying the logic specifically to the Ironworks, Voss, and Law. (e.g., explaining *why* the law needed the shutdown to be effective immediately).  
      *   *Deduction:* -5 marks if the answer discusses causation generally without referencing the specific Greystone details.  
  *   **Mechanism Explanation (5 marks):**  
      *   +5 marks for explaining the *mechanism* of the shadow causation (e.g., timing, enforcement, urgency).  
      *   *Deduction:* -3 marks if the student claims the law was shadow-causal but doesn't explain *how* the shutdown triggered it.  

  **Section 3: Argument on Redundancy (10 Marks)**  
  *   **Thesis on List Quality (5 marks):**  
      *   +5 marks for arguing that listing all three creates redundancy/double-counting.  
      *   *Deduction:* -5 marks if the student argues that "more causes are always better" without qualification.  
  *   **Hierarchical Thinking (5 marks):**  
      *   +5 marks for proposing a hierarchical model (primary cause vs. secondary mechanism) instead of a flat list.  
      *   *Deduction:* -3 marks if the conclusion simply restates the three causes without prioritizing them.  

  **Specific Penalties (Applied to Total)**  
  *   **The "Stacking" Mistake:** -5 marks if the student treats causal interaction (A triggers B) as overdetermination (A and B both kill the strike alone).  
  *   **The "Quantity" Mistake:** -5 marks if the student assumes that including all three causes automatically makes the explanation stronger/more nuanced.  
  *   **The "Definition" Mistake:** -3 marks if the student defines shadow-causation as "hidden cause" rather than "trigger vs. sufficient cause" per the prompt instructions.  
  *   **Formatting:** -2 marks if citations or bibliographies are included (against prompt instructions).  

  **Grade Boundaries:**  
  *   **27-30 (A):** Flawless logic, specific Greystone application, strong argument against redundancy.  
  *   **21-26 (B):** Correct concepts but generic application, or strong application with minor conceptual slippage.  
  *   **15-20 (C):** Identifies concepts but treats causes as a flat list; fails to identify shadow-causation correctly.  
  *   **0-14 (F):** Misunderstands overdetermination; argues more causes = better explanation; ignores prompt constraints.
