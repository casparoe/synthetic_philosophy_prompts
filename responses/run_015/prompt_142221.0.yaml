answer: |-
  Here is a specification for a theory of historical causation, designed to move your reading group past anecdotal trading and into methodological clarity.

  ### The Purpose of the Theory
  Before listing requirements, we must define the telos. A theory of historical causation is primarily for **explanatory understanding**, not prediction or legal blame.
  *   **Not Prediction:** History is non-iterable; we cannot build a physics of society to forecast the next dictator.
  *   **Not Blame:** Causal contribution $\neq$ moral responsibility. A structural condition can be a necessary cause without being a moral agent.
  *   **Is Understanding:** The goal is to map the *causal topology* of an event. We are trying to determine the *sensitivity* of the outcome to variations in initial conditions (agents) vs. background conditions (structures).

  ---

  ### The Desiderata

  **1. The Role/Agent Distinction (Functional vs. Identity)**
  *   **Spec:** The theory must distinguish between the *functional slot* (e.g., "charismatic authoritarian leader of the völkisch movement") and the *token individual* (Adolf Hitler). It must define criteria for "functional equivalence."
  *   **Case:** If Gregor Strasser had taken power, would the *slot* have been filled? If yes, the structure caused the slot; if the specific *actions* of Hitler (e.g., specific timing of the invasion of Poland) were unique to his psychology, the agent caused the token event.
  *   **Status:** **Non-Negotiable.** Without this, "someone else would have done it" is meaningless noise.

  **2. Outcome Granularity Sensitivity**
  *   **Spec:** The theory must yield different causal verdicts depending on the resolution of the outcome variable. It must prevent equivocation between coarse and fine descriptions.
  *   **Case:** "Hitler caused WWII" might be false if the outcome is "Major European Conflict" (structural tensions make this likely) but true if the outcome is "War starting in September 1939 via invasion of Poland" (contingent on Hitler's risk calculus).
  *   **Status:** **Non-Negotiable.** Most debates are merely participants talking about different outcome granularities without realizing it.

  **3. The Epistemic Access Constraint (No Reruns)**
  *   **Spec:** The theory cannot rely on frequentist probability (running the experiment 100 times). It must rely on *process tracing* and *counterfactual coherence* based on available evidence.
  *   **Case:** We cannot know the probability of a Nazi Germany without Hitler. We can only assess the *plausibility* of the counterfactual narrative based on known structural pressures and known alternative actors.
  *   **Status:** **Non-Negotiable.** Any theory demanding statistical significance is disqualified from singular historical events.

  **4. Contrastive Specificity**
  *   **Spec:** Causal claims must be contrastive: "X rather than X* caused Y rather than Y*." The theory must force the user to specify the foil.
  *   **Case:** Did Hitler cause *Nazism* (rather than conservatism)? Or did he cause the *Holocaust* (rather than ethnic cleansing/expulsion)? The cause changes depending on the contrast class.
  *   **Status:** **Non-Negotiable.** Prevents vague "caused history" claims.

  **5. Mechanism Transparency**
  *   **Spec:** The theory must require a description of the *transmission mechanism* linking cause to effect. It cannot simply assert correlation or necessity.
  *   **Case:** A structuralist must show *how* economic depression translates to fascist voting (e.g., via specific party organizations, media landscapes). A Great-Man theorist must show *how* the leader's will bypassed structural constraints (e.g., specific decree, personal intervention).
  *   **Status:** **Non-Negotiable.** Prevents "just-so" stories.

  **6. Modal Stability (Robustness)**
  *   **Spec:** The theory should assess how many "nearby possible worlds" the causal claim holds in.
  *   **Case:** If small perturbations (Hitler dies in 1932) erase the outcome, the cause is fragile (Great-Man leaning). If the outcome persists across many perturbations, the cause is robust (Structural leaning).
  *   **Status:** **Camp Preference (Structuralist).** Great-Man theorists often argue history is "sensitive" (butterfly effect); Structuralists argue it is "stable" (convergent evolution). A neutral theory must allow measurement of stability, not presuppose it.

  **7. Normative Decoupling**
  *   **Spec:** The theory must allow a factor to be causally necessary without being morally culpable, and vice versa.
  *   **Case:** The Treaty of Versailles may be a necessary cause of Nazi rise (causal weight) without having "agency" (moral weight). Hitler has both.
  *   **Status:** **Non-Negotiable.** Conflating blame with cause leads to motivated reasoning (minimizing cause to minimize blame).

  ---

  ### Suspected Incompatibilities (Tensions)

  **A. Granularity vs. Generalizability**
  *   **Tension:** You cannot maximize both. To explain the specific *timing* of the Holocaust (High Granularity), you need agent-specific details, which reduces the theory's ability to explain *authoritarian genocides* generally (Generalizability).
  *   **Flag:** A theory that claims to do both perfectly is likely smuggling in assumptions. You must choose: are we explaining *this* history or *types* of history?

  **B. Mechanism Transparency vs. Epistemic Access**
  *   **Tension:** We often lack the data to trace the specific mechanism (e.g., Hitler's private thoughts in 1933). Demanding full mechanism transparency might render all singular historical claims impossible.
  *   **Flag:** The theory must allow for "inferred mechanisms" based on structural patterns, which risks circularity (assuming the structure to prove the structure).

  ---

  ### Scorecard

  **The Great-Man Picture**
  *   **Strengths:** Excels at **Outcome Granularity** and **Mechanism Transparency** (for specific events); respects the **Role/Agent Distinction** by prioritizing the Agent.
  *   **Weaknesses:** Fails **Modal Stability** (claims are too fragile); struggles with **Generalizability**; often violates **Normative Decoupling** (conflating villainy with causation).

  **The Structural Picture**
  *   **Strengths:** Excels at **Modal Stability** and **Generalizability**; handles the **Epistemic Access Constraint** well (uses broad data); respects **Normative Decoupling**.
  *   **Weaknesses:** Fails **Outcome Granularity** (cannot explain specific timings/choices); often blurs the **Role/Agent Distinction** (treats agents as epiphenomena); struggles with **Mechanism Transparency** regarding how structure becomes action.

  **Verdict:** Neither picture satisfies the spec alone. A valid theory must be **hybrid**: using Structure to explain the *slot* and *stability*, and Agency to explain the *filling* and *specificity*.
