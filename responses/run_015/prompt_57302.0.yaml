      *   *Intentionalist (Sartre, Davidson):* The agent knowingly tries to make themselves believe $p$ while knowing $\neg p$. Requires some form of division or temporal separation to avoid logical contradiction.
      *   *Motivated Error/Deflationary (Mele, others):* No intention to deceive. Just bias in evidence gathering/weighting. $S$ believes $p$, but wouldn't believe $p$ if not for the motivation. No simultaneous belief in $\neg p$.
      *   *Static/Contradictory (Traditional):* $S$ believes $p$ and $\neg p$ at the same time. Often seen as problematic (the "paradox").
      *   *Partitioned Mind (Freud, Pears, some cognitive science):* The mind is divided. Subsystem A believes $p$, Subsystem B believes $\neg p$. Avoids conscious contradiction.
      *   *Twisted Self-Deception:* Believing $p$ when one desires $\neg p$ (e.g., believing a spouse is cheating when one wants them to be faithful). Challenges the "motivated belief" definition.

  3.  **Drafting the Vignettes (Iterative Process):**

      *   *Vignette 1: Classic Self-Deception (Straight).*
          *   Scenario: Smoker denying health risks.
          *   Draft: John smokes. He reads reports saying it kills. He focuses on the one report saying it's fine. He believes he is safe.
          *   Options: Self-deceived / Merely mistaken / Neither.
          *   Check: No forbidden words.

      *   *Vignette 2: Twisted Self-Deception.*
          *   Scenario: Jealous spouse.
          *   Draft: Mary loves her husband. She finds a receipt. She concludes he is cheating, though she prays he isn't. She feels certain of his betrayal.
          *   Check: Must capture believing the unwanted truth.

      *   *Vignette 3: Evidence Steering (Mele-style).*
          *   Scenario: Job candidate.
          *   Draft: Tom wants the job. He only calls references who like him. He ignores the emails from the angry boss. He feels confident he is the best fit.
          *   Check: No contradictory belief formed, just biased gathering.

      *   *Vignette 4: Standing Character Trait.*
          *   Scenario: Narcissism or Chronic Optimism.
          *   Draft: Elena is generally brilliant. She assumes praise is genuine and criticism is jealousy. This happens across decades, not just one event. She maintains a high self-view.
          *   Check: Focus on trait, not event.

      *   *Vignette 5: The "Knowing" Deceiver (Intentionalist lean).*
          *   Scenario: Preparing for a speech.
          *   Draft: David knows he is nervous. He tells himself "I am calm" repeatedly to lower his heart rate. He starts to feel calm, though he knows the stakes are high.
          *   Refinement: Needs to look more like deception. David knows the project will fail. He tells his team it will succeed to keep morale up, and eventually convinces himself it will succeed to avoid panic.
          *   Check: Avoid "intend". Use "sets out to" or similar if needed, but better to describe the action. "He adopts a strategy of telling himself..."

