answer: |-
  Your observation is sharp and touches on a methodological crisis that has troubled critical archaeology for decades, even if it lacks a single canonical name in formal logic. You are correct that standard fallacies like the argument from ignorance or god of the gaps do not quite capture the mechanism at work. In the argument from ignorance, the lack of evidence is used to prove a negative or positive claim directly, whereas in your example, the lack of functional evidence is transformed into a positive classification that then generates its own evidence base. In the god of the gaps, a supernatural agent is inserted to explain a mechanistic void, but here the category of ritual is not explaining how the object was made or used, but rather classifying the object itself based on what it is not. The logical move you are describing is a specific form of reification where uncertainty is converted into data. While archaeologists often refer to this colloquially as the wastebasket category problem or the residual category error, there is no established term in philosophy of science that isolates this specific conversion of ambiguity into institutional evidence. To carve this move up precisely, we might coin the term the ritual residue fallacy, defined as the error of treating the absence of a profane explanation as sufficient proof of a sacred intent, thereby allowing the category of ritual to expand in proportion to the archaeologist's inability to identify function.

  The core of this fallacy lies in the treatment of the label ritual not as a hypothesis requiring verification, but as a default classification for the unintelligible. When an object shows no wear, has no practical utility, or is deposited in a way that defies economic logic, the report categorizes it as ceremonial. This classification is then treated as a settled fact in subsequent analysis. If ten such objects are found, the site is deemed to have a robust ritual life. The circularity emerges because the evidence for the religion is the very stuff that refused to yield evidence of anything else. This differs from legitimate inference because it relies on negative definition. A legitimate inference of ritual activity relies on positive patterning rather than isolated ambiguity. For example, if cattle skulls are found in a pit, that is ambiguous. If cattle skulls are found in a pit, oriented north-south, accompanied by specific pottery types, and located exclusively near entranceways across multiple settlements, that is a pattern. The legitimate version of this inference depends on contextual consistency and structured deviation from the norm, not merely the absence of utilitarian wear. The fallacy occurs when the uniqueness or opacity of a single find is sufficient to trigger the classification, allowing the label to do the work of an explanation.

  This leads directly to the second half of your critique regarding the secular versus religious bias. By reserving the religious label for the opaque and the utilitarian label for the legible, archaeology systematically constructs past societies as either mysteriously spiritual or pragmatically secular based on the survival bias of their materials. A culture that used wood for sacred objects and stone for tools will appear secular if the wood rots, while a culture that used bronze for votives and stone for tools will appear religious if the bronze survives. The ritual residue fallacy exacerbates this by ensuring that only the things we cannot understand are allowed to count as religious. A spindle whorl used in a rite of passage is still a spindle whorl with wear marks, so it gets filed under domestic economy. A bronze axe too thin to cut is filed under ritual. The result is a distorted ontology where the sacred is defined by uselessness and the profane by function. This creates a false dichotomy where the spiritual and the practical cannot overlap, ignoring the likelihood that for many past cultures, the act of grinding grain or forging metal was itself imbued with religious significance that left no distinct material trace separate from the tool itself.

  The philosophical edge of this error is best understood as a category mistake combined with epistemic closure. It is a category mistake because it treats a interpretive label as an intrinsic property of the object. It is epistemic closure because once the label is applied, inquiry often stops. The object is now ritual, so asking what it did is no longer necessary. This contrasts with a legitimate scientific approach where the label would remain a provisional hypothesis contingent on finding corroborating context. If the term ritual is to retain analytical value, it must describe a specific type of human action with recognizable constraints, not serve as a synonym for unknown. A legitimate version of this inference would require that the classification of an object as ritual be falsifiable. It would demand that archaeologists specify what material evidence would prove the object was not ritual, rather than simply noting that no evidence proves it was utilitarian. It would also require that the category be applied consistently across legible and illegible materials, acknowledging that a worn quern could be just as sacred as a thin axe.

  Ultimately, the phenomenon you have identified is a systemic bias in how knowledge is constructed from material remains. It privileges the exotic over the mundane and the unknown over the known, creating a feedback loop where ignorance generates confidence. By naming this the ritual residue fallacy, we can isolate the specific step where the transition from we do not know to this is sacred occurs without justification. This allows us to distinguish between a genuine recognition of symbolic behavior, which relies on patterned context and ethnographic analogy, and a methodological convenience that uses the sacred to fill the gaps in our understanding of the profane. Recognizing this move does not mean we must stop identifying ritual, but rather that we must stop treating the unexplainable as automatically sacred. We must accept that some things may remain unknown without forcing them into a box that subsequently validates the existence of the very institutions we are trying to study. The goal is to ensure that the reconstruction of past belief systems is built on positive evidence of practice and context, rather than on the accumulating weight of things we simply cannot explain.
