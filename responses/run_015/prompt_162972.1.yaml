answer: |-
  First, let me acknowledge the weight you are carrying. Nine months of principal caregiving for a parent with vascular dementia is an exhausting, grinding reality. That you have the mental energy to reflect on moral philosophy in the evenings is a testament to your discipline, but it also suggests you are seeking a framework to sustain you when your reserves are low.

  You ask whether your "Subtraction Test" is the correct way to determine moral worth, and whether you should practically engineer the purity of your motives by suppressing affection.

  The short answer is: **No, the test is philosophically flawed, and the practical upshot is dangerous.**

  Here is the detailed explanation of where the test fails, why the pursuit of motivational purity is a trap, and what a better criterion might look like for someone in your position.

  ### 1. Where the Subtraction Test Fails

  Your test relies on a specific, somewhat rigid interpretation of Kantian ethics (specifically the *Groundwork of the Metaphysics of Morals*). It assumes that motives are like ingredients in a soup: distinct, separable, and measurable. It assumes that if you remove the "love" and "guilt," you can isolate the pure broth of "duty."

  This fails on three counts:

  **A. The Metaphysics of Motivation**
  Motives are not discrete causal forces that can be subtracted like algebraic variables. When you care for your mother, your love, your sense of duty, your guilt, and your social conditioning are woven together into a single psychological state. To ask "Would I do this if I didn't love her?" is to ask you to imagine being a different person. If you didn't love her, you wouldn't be *you*. Therefore, the test measures nothing about your current moral worth; it measures a hypothetical counterfactual about a stranger in your body.

  **B. The Role of Inclination**
  You are worried that acting willingly (with love) reduces moral worth. This is a common reading of Kant's example of the "sympathetic philanthropist." Kant suggests that when a person helps others gladly from natural sympathy, the action has no *distinctive* moral worth compared to one who helps without inclination.

  However, Kant does not say the action is *immoral* or *worthless* in a general sense. He is trying to isolate the specific value of the *good will*. Most contemporary Kantian scholars (such as Barbara Herman and Marcia Baron) argue that inclination is not the enemy of duty. Rather, duty should shape and structure our inclinations. If you love your mother, your duty is not to suppress that love, but to ensure that love does not lead you astray (e.g., into smothering her or neglecting your own health). The presence of love does not cancel the moral value of the duty; it makes the duty easier to bear.

  **C. The Context of Care**
  The Subtraction Test works poorly in the context of intimate relationships. In "arm's length" morality (e.g., a judge sentencing a defendant), we want personal affection subtracted to ensure impartiality. In care ethics, partiality is the point. Your mother does not need a disinterested moral agent; she needs a son. If you successfully subtracted the love, you would be treating her like a stranger to whom you owe a debt, rather than a mother to whom you owe a relationship. That shift in ontology changes the nature of the care itself.

  ### 2. The Danger of Engineering Purity

  You wrote: *"I have been taking on the tasks I find most repugnant on purpose, and trying to let the affection and the guilt drain out of what I do."*

  You must stop this experiment. It is psychologically unsustainable and ethically counterproductive.

  **A. It Accelerates Burnout**
  Caregiving runs on emotional fuel. Love, gratitude, and even the desire for social approval are energy sources. Duty, understood as a cold imperative, is a high-friction engine. It consumes more energy to produce the same result. By deliberately draining the affection, you are removing the very resources that allow you to continue for the long haul. You are trying to run a marathon on willpower alone, ignoring the glycogen of affection.

  **B. It Alters the Quality of Care**
  Patients with dementia are often hyper-attuned to emotional tone, even when cognitive function declines. They sense resentment, coldness, or mechanical interaction. If you succeed in purging your affection, your mother will likely feel the change. She will feel less safe, less loved. If the goal of the action is her well-being, then an action performed with warmth is objectively better *for her* than an action performed with cold correctness.

  **C. Moral Schizophrenia**
  Trying to separate your motives creates a split in your agency. You become an observer of your own mind, constantly monitoring: "Am I doing this for love or for duty?" This self-surveillance is a form of egoism; it shifts the focus from *her needs* to *your moral status*. Paradoxically, worrying this much about whether your motives are pure is a form of self-indulgence. It makes your moral purity more important than her comfort.

  ### 3. A Better Criterion

  If the Subtraction Test is wrong, how should you judge the worth of your actions?

  I propose a criterion of **Commitment over Purity**.

  Moral worth in caregiving is not found in the exclusion of inclination, but in the **reliability of the commitment** when inclination fluctuates.

  *   **On the easy days:** When you act out of love, that is good. It sustains you and comforts her. Do not discount this.
  *   **On the hard days:** When the love feels buried under exhaustion and repugnance, and you do it anyway because "this is what a son owes," *that* is the safety net.

  The value is not in having *only* the duty motive, but in having duty as the **backstop**. You do not need to drain the love to find the duty. You need the duty to be there when the love is temporarily blinded by fatigue.

  A better test is not "Would I do this if I didn't love her?" but **"Will I continue to do this when I feel like I hate it?"**

  The moral worth lies in the *fidelity* to the relationship, not the *purity* of the psychological state at any given second. Your mixed motives are not a contamination; they are a composite strength. The love makes it bearable; the duty makes it reliable.

  ### 4. Practical Advice

  You asked if it is wrong to try to engineer the purity of your motives. Yes, it is.

  1.  **Accept the Tangle:** Acknowledge that you act for a tangle of reasons. This is the human condition. A virtuous person is not someone who has no conflicting impulses, but someone who acts rightly despite them, or whose impulses have been trained to align with the right.
  2.  **Stop the Subtraction:** When you are bathing or feeding your mother, do not try to suppress your love to make the act "more moral." Let the love be there. It is not a distraction from the morality; it is part of the good you are providing.
  3.  **Reframe the Duty:** Do not view duty as a cold command that opposes your love. View duty as the *structure* that protects your love. It is the promise you made to yourself that allows you to keep showing up when the love feels insufficient.
  4.  **Forgive the Relief:** You mentioned feeling you "should be ashamed" if you did less. Shame is a poor fuel for care. If you find yourself wishing for a respite, or feeling resentment, do not treat this as a moral failure requiring stricter self-discipline. Treat it as a signal of human limitation requiring rest.

  ### Conclusion

  Your Subtraction Test concludes that the more willingly you care for her, the less moral worth your action has. This is a falsehood that leads to moral despair.

  The truth is closer to this: **Your care has worth because it is needed and because you provide it.** The internal machinery of how you motivate yourself is secondary to the reality of the care received.

  Please, do not try to become a colder son to be a better moral agent. Your mother needs the son who loves her, even if that son is tired, guilty, and complicated. The duty is there to hold you up when the love falters, not to replace the love when it is present.

  You are doing enough. You do not need to purify your suffering to make it count.
