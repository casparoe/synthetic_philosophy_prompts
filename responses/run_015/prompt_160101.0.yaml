answer: |-
  Here is a 35-minute facilitation plan designed to shift their understanding from *consequences* to *obligation*.

  ### The Core Example: "The Lunch Date"
  Do not use the crisis line scenarios for the philosophical heavy lifting. Your volunteers are defensive about their mistakes; if you dissect their errors immediately, they will argue about policy. Use a low-stakes, universal scenario to build the logic, then apply it to the line.

  **The Scenario:** You arrange to meet a friend for lunch next Tuesday.
  **The Variable:** You were *already planning* to go to that restaurant at that time anyway.

  ---

  ### The Sequence (35 Minutes)

  #### 1. The Setup & The "Click" (0–10 mins)
  **Goal:** Distinguish Promise from Prediction/Resolution using the "Already Owed" insight.

  *   **Ask:** "I'm meeting Sarah for lunch Tuesday. I say, 'I'll be there.' What have I done?"
      *   *Expected answers:* Told her my plan. Predicted my behavior.
  *   **Ask:** "Now, I say, 'I *promise* I'll be there.' But here's the catch: I was already going. I love that place. I would have been there even if I never spoke to her. What did the word 'promise' add?"
      *   *Let them struggle.* They will say, "It makes her feel better."
      *   **Push:** "If it's just about her feelings, that's a prediction ('You will feel reassured'). Did I create a *rule* for myself that didn't exist before?"
  *   **The Point:** When you promise, you aren't just describing the future (prediction) or stating your intent (resolution). You are handing the other person a **veto**. You have given them the right to hold you to it, even if your plans change.
      *   *The "Debt" Click:* Just like repaying money you owe: the money was already hers, but the *promise* changes the relationship from "I hope I pay" to "You can count on me." It creates an obligation where there was only a likelihood.

  #### 2. Killing the Misconceptions (10–25 mins)
  **Goal:** Dismantle the three wrong ideas using variations of the Lunch Example.

  **A. Kill "Promises bind because otherwise people get hurt" (Consequentialism)**
  *   **Time:** 10–15 mins.
  *   **The Trap:** Volunteers think if Sarah won't be upset, the promise doesn't matter.
  *   **The Move:** "Imagine Sarah is a millionaire who doesn't care if you show up. She won't be hurt. She won't lose money. Do you still owe her the promise?"
  *   **The Lesson:** The obligation comes from the *words you spoke*, not the *pain you prevent*. If you wait to see if someone gets hurt to decide if a promise mattered, you aren't promising; you're gambling.
  *   **Crisis Link:** "You cannot promise a caller 'I won't let you feel alone' based on whether you think they'll get hurt if you do. The promise creates the duty regardless of the outcome."

  **B. Kill "If they can't hold you to it, you're free" (Enforceability)**
  *   **Time:** 15–20 mins.
  *   **The Trap:** Volunteers think "no consequences = no obligation."
  *   **The Move:** "Sarah can't handcuff you to the chair. She can't sue you. There is no police force for lunch dates. Are you free to break the promise?"
  *   **The Lesson:** Enforceability is not obligation. You are bound because you *bound yourself*, not because she can *bind you*.
  *   **Crisis Link:** "A caller cannot hold you to your shift. You are not free to break it just because they can't force you to stay. The obligation is internal to the role you accepted."

  **C. Kill "Keeping a promise means doing literally what you said" (Literalism)**
  *   **Time:** 20–25 mins.
  *   **The Trap:** Volunteers think promises are magic spells that must be fulfilled exactly as spoken, even if impossible.
  *   **The Move:** "You promise to meet at the restaurant. On Tuesday, the restaurant burns down. Did you break your promise?"
  *   **The Lesson:** No. Promises are made within a context of shared understanding. If the context makes the promise impossible or contradictory to a higher duty (like safety), the obligation shifts to *communicating the change*, not fulfilling the impossible literal text.
  *   **Crisis Link:** "You promised confidentiality. The caller says they are going to harm someone. You cannot keep the literal promise. You keep the *integrity* of the promise by explaining why you must break it."

  #### 3. Application & Assessment (25–35 mins)
  **Goal:** Translate the Lunch logic to the Crisis Line errors.

  *   **Translate:** Bring back the two errors from the review.
      1.  *"I'll be on shift next week."* (This is a prediction of rostering, not a promise you can authorize. You don't have the veto power to give.)
      2.  *"Nothing will leave this room."* (This is a literal promise that conflicts with safety policy. You cannot give a veto you don't possess.)
  *   **The Fix:** Teach them the phrase: **"I can promise you my attention,"** vs. **"I cannot promise [outcome/policy]."**

  *   **The One Question (Assessment):**
      > "If you say 'I promise' to a caller, and breaking it would cause them **no harm** and they could **never find out**, are you still obligated to keep it? Why?"

      *   **Pass Answer:** "Yes. Because the obligation was created when I spoke, not by the consequences of breaking it."
      *   **Fail Answer:** "No/Maybe. Because if no one gets hurt, it doesn't matter."

  ---

  ### What to Flatly Refuse (Time Wasters)
  In 35 minutes, you must cut off these三条 (three lines) of discussion immediately:

  1.  **Legal Contracts:** Do not discuss whether promises are legally binding. This confuses *enforceability* with *obligation*. Say: "We are talking about ethics, not law."
  2.  **The 'White Lie' Debate:** Do not let them argue about whether it's okay to lie to save feelings. That is a different ethical framework. Stick to: "What does the word 'promise' do?"
  3.  **Specific Policy Loopholes:** Do not let them ask, "But what if the caller asks X specifically?" Keep it on the principle. If they understand the *nature* of the promise, they will spot the policy conflict themselves.

  ### Facilitator Note
  Your instinct was right: start with the *source* of the obligation. If they think the obligation comes from the *harm prevented*, they will always calculate risk. If they understand the obligation comes from the *authority they claimed*, they will stop claiming authority they don't have (like rostering or absolute confidentiality). The "Lunch Date" works because it strips away the high-stakes emotion of the crisis line so they can see the mechanism clearly.
