answer: |-
  This is a rich puzzle. You have identified the central paradox of the 2003 UNESCO Convention for the Safeguarding of the Intangible Cultural Heritage (ICH): *To save a living thing, you must first treat it as if it were dead.*

  Before I commit to a specific philosophical reconstruction, I need to validate your reporting against the actual machinery. Your summary is **substantively accurate** regarding the *phenomenology* of the process, even if the legal texts are more nuanced. The Convention text explicitly states that ICH is "constantly recreated" and warns against "freezing." However, the *operational directives* (the forms, the inventory requirements, the funding metrics) necessitate reification. You cannot budget for a "process," you budget for a "project." You cannot insure a "vibe," you insure a "practitioner." So, while the *theory* of the Convention is process-oriented, the *bureaucracy* of the Convention is object-oriented. Your observation that officials see standardization as success is correct because standardization is *measurable*, and bureaucracy runs on measurability.

  Here is the brainstorming and analysis you requested, structured for your column.

  ### 1. Brainstorming: Candidate Assumptions
  Before settling on the core theory, here are the competing assumptions floating in the room during those committee meetings. Some are explicit, some are structural necessities.

  *   **The Museum Assumption:** A tradition is an artifact. Like a vase, it has an original shape. Cracks are damage; paint overgrowth is defacement. ( *Status: Implicit in the "endangerment" criterion.*)
  *   **The Chain Assumption:** A tradition is a relay race. The baton must pass from Hand A to Hand B without being dropped. If Hand C modifies the baton, is it still the same race? (*Status: Explicit in "intergenerational transmission" criteria.*)
  *   **The Corporate Assumption:** A "community" functions like a corporation or a state. It has boundaries, a board of directors (elders/practitioners), and the legal capacity to give consent. (*Status: Required for the "free, prior, and informed consent" forms.*)
  *   **The Entropy Assumption:** Change is naturally degenerative. Without intervention, traditions decay. Intervention (funding/rules) halts decay. (*Status: Drives the "safeguarding" logic.*)
  *   **The Archive Assumption:** Documentation is a form of preservation. If it is written down/filmed/cataloged, it is safer. (*Status: Drives the inventory requirement.*)
  *   **The Ecology Assumption (The Dissenter):** A tradition is a weed or a river. It survives by adapting. Pruning it kills it. (*Status: Often voiced by anthropologists in the room, rarely by funding officers.*)

  **The Committed Theory:**
  The paperwork presupposes **Substance Ontology** over **Process Ontology**. It assumes a tradition is a *persisting particular* with an identity conditions distinct from its practitioners.
  *   **Identity:** It assumes there is a "fact of the matter" about what the tradition *is*, separable from what people *do*. This is why variants can be "inauthentic." If tradition were just "what people do," the variant would be the tradition.
  *   **Authenticity:** It relies on **Genealogical Authenticity** (origin-based) rather than **Functional Authenticity** (use-based). A practice is authentic because it comes from the past, not because it works for the present.
  *   **Ownership:** It assumes **Cultural Territoriality**. Just as a nation owns its land, a community owns its culture. This requires the community to be bounded (to know who owns it) and representative (to sign the deed).

  ### 2. Rival Pictures and the "Manufacturing" Charge
  The paperwork quietly rules out two major sociological insights:

  1.  **The "Invented Tradition" Thesis (Hobsbawm & Ranger):** Many "ancient" customs are recent constructions designed to create cohesion.
  2.  **The "Imagined Community" Thesis (Benedict Anderson):** Cultural groups are not natural kinds; they are produced by the very mechanisms (census, maps, museums) that claim to describe them.

  **Is the register confused or manufacturing?**
  It is **performatively manufacturing**. This is not necessarily a bug; it is a feature of statecraft. When the form asks a loose network of singers to "name the bearers," it forces them to constitute themselves as a legal entity.
  *   **The Confusion:** The officials believe they are *discovering* a pre-existing community.
  *   **The Reality:** They are *summoning* a community into existence to fit the slot provided by the state.

  **Would defenders have an answer?**
  Yes. A sophisticated defender would argue for **Strategic Essentialism** (a term from Gayatri Spivak). They would say: "We know the boundaries are fuzzy. We know the tradition evolves. But to get funding, to get legal protection against exploitation, to get it into schools, we *need* a noun. We need to temporarily freeze the verb so we can protect the conditions that allow the verb to continue."
  They would argue that without the "manufactured" boundary, the tradition would be diluted by market forces or assimilation. The standardization is a shield, not a description.

  ### 3. Underdetermination: Where is the Wiggle Room?
  This is the most critical section for your column. The bureaucracy is not a monolith; there are gaps between the *philosophical requirements* and the *administrative habits*.

  *   **"Safeguarding" vs. "Preserving":** The Convention defines safeguarding as "measures aimed at ensuring the viability." Viability does not mean *stasis*. A strict reading allows for a safeguarding plan that funds *adaptation* rather than *repetition*.
      *   *Can a constructionist sign the forms?* Yes. A thoroughgoing constructionist can treat the "Canonical Version" as a **heuristic fiction**. They can submit the "fixed" version required by the form while internally treating it as a snapshot, not a statute. They lose nothing philosophically if they view the registration as a political tool rather than an ontological truth.
  *   **Preservation-by-Standardization:** Is this defensible? Only under a **Baseline Theory**. If the standardization is treated as a *floor* (a minimum competency to ensure the language/skill isn't lost) rather than a *ceiling* (the only allowed way to do it), it is defensible.
      *   *The Problem:* Bureaucracies struggle to enforce floors without creating ceilings. Inspectors check for compliance with the standard, not deviation from it.
  *   **The "Bearer" Requirement:** The form asks for "practitioners." It does not strictly require a *hierarchy*. It requires *identification*. You could list 500 practitioners without naming a single "spokesperson," forcing the state to deal with a multiplicity of voices. Most groups don't do this because it's administratively messy, not because the form forbids it.

  ### 4. Concrete Edits: Swapping the Theory
  If we swap the **Substance Ontology** (Tradition as Object) for a **Process Ontology** (Tradition as Event/Ecosystem), here is how the machinery must change.

  **Current Mechanism:** The Safeguarding Plan.
  *   *Current Logic:* "Here is the threat (change/forgetting). Here is how we will stop it (teach the old way, record the old masters)."
  *   *Philosophical Flaw:* Assumes the future should look like the past.

  **Proposed Edit: The "Adaptation & Variation" Clause.**
  Require the applicant to submit a **Predicted Change Log** alongside the Safeguarding Plan.
  *   **The Form:** Instead of asking "How will you ensure the practice remains unchanged?" ask: "What elements of this practice are expected to evolve in the next 5 years to remain viable? What external pressures (climate, economy, technology) will force this change?"
  *   **The Funding Rule:** Tie 30% of the funding to *successful adaptation* rather than *faithful reproduction*. If the group modifies the festival date to accommodate modern work schedules, or swaps a material for a sustainable alternative, that counts as "safeguarding" (viability), not "damage."
  *   **The Representation Rule:** Ban single spokespersons for large, diffuse communities. Require a **Rotating Council** for signatories. This prevents the "hardening" of the group boundary. If the signatory changes every year, the state cannot treat the community as a static corporation.

  **Why this has grip:** It changes the incentive structure. Currently, groups are rewarded for proving they are "dying" (endangerment) and "pure" (authenticity). This edit rewards them for proving they are "living" (adapting) and "resilient" (evolving).

  ### Confidence and Uncertainty

  **Confidence Level: High (85%)**
  I am highly confident in the philosophical diagnosis (Substance vs. Process) and the bureaucratic dynamic (Measurability drives Reification). The tension you observed between "living heritage" and "freezing practices" is the central critique in the academic literature on the 2003 Convention (see work by Laurajane Smith or Richard Kurin).

  **Area of Least Certainty (The Specialist Check):**
  I am least sure about the **legal liability of "naming bearers."**
  *   *The Uncertainty:* In some national implementations, naming specific "bearers" on a government register confers individual legal rights (stipends, intellectual property claims). In others, it's purely administrative.
  *   *Why it matters:* If naming a bearer creates a financial entitlement, the "hardening" of the group boundary isn't just philosophical; it's economic. People will fight to be on the list and exclude variants because money is attached to the "Authentic" label. If it's purely administrative, the hardening is purely social/prestige-based.
  *   *Recommendation:* Ask your contacts: "Does being a listed bearer come with an individual stipend or legal standing, or is the funding only for the group project?" This determines whether the "manufacturing" is driven by ideology or rent-seeking.

  **One Correction to Your Summary:**
  You mentioned the register describes this as *protecting the tradition from change*. Technically, the UNESCO text and most national mission statements describe it as *protecting the tradition from disappearance*. The distinction is subtle but vital. They claim to protect the *viability*, not the *form*. However, as you noted, in practice, they equate viability with formal continuity. You should highlight this gap between the *rhetoric of viability* and the *practice of stasis*—it's the smoking gun of the philosophical confusion.
