      *   **Severity 2 (High): Claim 2 vs. Claim 5.** Claim 2 defines unpleasantness via motivation to stop. Claim 5 describes cases where we don't want to stop it. If the pain in chili is "unpleasant" (as usually assumed), Claim 2 struggles. If it's *not* unpleasant, Claim 5's phrasing ("pain is part of what makes the experience good") needs to explain why it's still pain.
