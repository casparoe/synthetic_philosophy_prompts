          *   *Verdict:* Why is asymbolia not bad but habituation bad? Both involve sensory pain without the "bother." The distinction needs grounding. Is habituated pain actually affective but ignored?

      *   *Collision D: Claim 2 vs. Claim 4.*
          *   Claim 2: Badness/Unpleasantness = Motivation to stop.
          *   Claim 4: Habituated pain is bad *in itself* even if adapted (presumably no longer strongly motivating avoidance).
