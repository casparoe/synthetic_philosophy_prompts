      *   **Claim 3 (First-Person Authority):** Sincere report = final word on being bothered. If she says "I don't mind," she doesn't. (Phenomenological Privilege).
      *   **Claim 4 (Habituated Chronic Pain):** Adapted chronic pain *is* bad, even if sincere report says "I don't mind." Bad *in itself*, not instrumental.
