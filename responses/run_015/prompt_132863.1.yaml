answer: |-
  This is a sophisticated problem that touches on the core of philosophy of science, specifically the Lakatosian distinction between "progressive" and "degenerating" research programs. Your argument is logically valid, which is why it feels so trapping: if your premises are true, the conclusion follows. However, the argument "proves too much" because it relies on a false equivalence in **Premise (3)**, supported by a mischaracterization in **Premise (4)**.

  To save your demarcation criterion without conceding legitimacy to Fomenko or collapsing into sociological relativism, you should **reject Premise (3)** while simultaneously **refining Premise (1)**.

  Here is the breakdown of why (3) is the failure point, how to fix (1), and what commitments this requires.

  ### 1. The Flaw in Premise (3): Equivocation on "Asymmetry"

  Premise (3) claims that mainstream chronology exhibits the *same* evidential asymmetry as Fomenko's program. This is an equivocation on what constitutes an "ad hoc auxiliary hypothesis."

  In the philosophy of science (specifically Imre Lakatos), an auxiliary hypothesis is not considered pejoratively "ad hoc" simply because it saves a theory from falsification. It is only "ad hoc" in the damaging sense if it **lacks independent testability.**

  *   **Mainstream Practice:** When a radiocarbon date conflicts with a stratigraphic layer, mainstream chronologists might hypothesize "contamination" or "old wood effect." Crucially, these hypotheses are **independently testable**. You can chemically test the sample for contaminants; you can date short-lived organic material to avoid the "old wood" problem. If the auxiliary hypothesis fails the test, the chronological framework *must* shift.
  *   **Fomenko's Practice:** When astronomical records conflict with the New Chronology, Fomenko hypothesizes that the records are forgeries or miscalculated by a global conspiracy. These auxiliaries are **not independently testable** without assuming the truth of the New Chronology itself. They are designed solely to immunize the core theory.

  **The Rejection:** You must reject (3) because it conflates *methodological scrutiny* (testing an anomaly to see if it is error) with *dogmatic immunization* (dismissing an anomaly by fiat to protect the core). They look similar on the surface (both reject the data point), but they differ fundamentally in their willingness to let the data overturn the theory.

  ### 2. Refining Premise (1): The Testability Clause

  To make the rejection of (3) stick, you need to tighten Premise (1). As it stands, (1) is too broad. Almost all scientific theories treat some outliers as errors. If you don't refine (1), critics will rightly say you are demanding impossible standards of falsification for mainstream history.

  **Revised Premise (1):** A research program counts as pseudohistorical if it exhibits evidential asymmetry wherein disconfirming data is dismissed via auxiliary hypotheses that **lack independent empirical testability** and serve solely to immunize the core theory from revision.

  By adding the bolded clause, you distinguish between a legitimate error-correction mechanism (mainstream) and a protective belt of unfalsifiable claims (Fomenko).

  ### 3. Addressing Premise (4): The Role of Consilience

  Premise (4) argues that cross-checks (dendrochronology, astronomy) don't dissolve the asymmetry because they are also dismissed if they conflict. This ignores the concept of **consilience** (the jumping together of evidence).

  In mainstream chronology, the timeline is not held in place by a single textual framework. It is held by the *intersection* of independent methods. If radiocarbon conflicts with dendrochronology, it triggers a crisis that requires resolution across *both* fields. The textual framework is often the thing that gets revised (e.g., the re-dating of the Thera eruption).

  In Fomenko's program, the "compressed timeline" is the immutable core. All cross-checks that conflict are dismissed *en masse*. The direction of fit is always data-to-theory, never theory-to-data.

  Therefore, (4) is also false because it assumes the *function* of the cross-check is the same in both programs. In mainstream history, cross-checks are arbiters; in New Chronology, they are obstacles to be circumvented.

  ### 4. What This Commits You To

  Rejecting (3) and refining (1) commits you to three specific philosophical positions:

  1.  **Fallibilism:** You must admit that mainstream chronology *could* be wrong. The demarcation is not that mainstream is "True" and Fomenko is "False." The demarcation is that mainstream is *structured to allow itself to be proven wrong*, whereas Fomenko is not. You must be willing to acknowledge specific instances where mainstream chronology was forced to revise its timeline due to anomalous data (e.g., the adjustment of Egyptian chronology based on new radiocarbon data).
  2.  **Methodological, Not Institutional, Demarcation:** You avoid Conclusion (8) by showing that the distinction is epistemological (based on testability), not sociological (based on tenure or publication). A mainstream historian who starts dismissing all conflicting carbon dates as "contamination" without testing them *would* be engaging in pseudohistory, regardless of their university affiliation.
  3.  **Degrees of Merit:** You commit to the view that research programs exist on a spectrum of "progressiveness." Mainstream chronology is not perfect; it has degenerating sectors. However, it retains a progressive core where anomalies lead to new discoveries (e.g., understanding climate change through pollen data in strata), whereas Fomenko's program leads only to reinterpretations of existing texts without generating new empirical predictions.

  ### Summary of the Fix

  Do not abandon (1) or (7). Instead, argue that **Premise (3) is empirically false** under a rigorous definition of "ad hoc."

  *   **Mainstream:** "This carbon date is an outlier. Hypothesis: Contamination. Test: Run mass spectrometry. Result: Confirmed/Rejected." (Progressive)
  *   **Fomenko:** "This carbon date is an outlier. Hypothesis: The method is flawed for this era. Test: None, because the theory says it must be flawed." (Degenerating)

  By focusing on **independent testability** and the **direction of fit**, you preserve the demarcation criterion without labeling mainstream history as pseudohistory. You avoid the relativist trap of (8) by grounding the distinction in the logical structure of the arguments, not the social status of the arguers.
