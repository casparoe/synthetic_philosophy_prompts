      *   **Result:** These constraints force Conclusion (8) (pseudohistory is just a sociological label), which the user feels "proves too much" (i.e., it's an unwanted relativist conclusion).
      *   **Task:** Identify which step to reject (likely 3, 4, or the slide between 5 and 6), explain the commitment involved, and show how to save the distinction without abandoning (1) or conceding legitimacy to Fomenko.
      *   **Language:** American English.

  2.  **Evaluate the Argument Steps:**
      *   *(1) Definition:* Evidential asymmetry (confirm uncritically, dismiss disconfirming ad hoc) = pseudohistory. *Plausible Lakatosian/Popperian vibe.*
      *   *(2) Fomenko:* Fomenko does this. *Generally accepted by historians of science/history.*
      *   *(3) Mainstream:* Mainstream does this *to the same degree/nature*. *This is the weak link.* It equates normal scientific error-handling with systematic immunization.
      *   *(4) Cross-checks:* Cross-checks don't help because they are also dismissed if they conflict. *This assumes the dismissal is always ad hoc rather than methodological.*
      *   *(5) Inference:* Therefore, mainstream has the *same* asymmetry. *Follows from 3 & 4.*
      *   *(6) Dilemma:* If they share the feature, both are pseudo or the feature is bad. *Logically valid.*
      *   *(7) Constraint:* Mainstream is not pseudo. *Normative claim.*
      *   *(8) Conclusion:* Therefore, the criterion is bad; it's just sociology. *Relativist conclusion.*

  3.  **Identify the Flaw:**
      *   The core issue is a false equivalence in Premise (3) and Premise (4).
      *   *Premise (3)* claims mainstream chronology exhibits the *same* asymmetry. While mainstream history *does* discard outliers, the key distinction lies in *why* and *how*. In science/mainstream history, anomalies trigger investigation and potential theory revision. In pseudohistory, anomalies are systematically explained away *to protect the core dogma* without independent justification.
      *   *Premise (4)* claims cross-checks don't dissolve asymmetry because conflicting cross-checks are dismissed. This ignores the *weight* of evidence. Mainstream chronology relies on a *consilience* of evidence (text, carbon, dendro, astronomy). If one conflicts, it's tested against the others. If Fomenko conflicts, he dismisses *all* others to fit his core axiom.
      *   *The Slide (5 to 6):* The definition in (1) needs nuance. It's not just "dismissal of disconfirming data" (all theories do this to some extent via auxiliary hypotheses); it's "dismissal of disconfirming data *without independent empirical justification*."

  4.  **Formulate the Solution:**
      *   **Reject/Modify Premise (3).** This is the strongest move. Mainstream chronology does not exhibit the *same kind* of asymmetry.
      *   **Refine Premise (1).** The definition of "ad hoc" needs to be stricter. An auxiliary hypothesis is only "ad hoc" in the pejorative sense if it lacks independent testability.
      *   **Address the "Proves Too Much" fear.** By distinguishing between *productive* anomaly resolution (mainstream) and *degenerative* problem-shifting (Fomenko), we save the demarcation without conceding to Fomenko.

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the sophistication:* This is a good philosophical problem (Lakatos, Kuhn, Popper vibes). Don't talk down.
      *   *Pinpoint the error:* It's primarily in (3), supported by a misunderstanding in (4).
      *   *Explain the distinction:* "Ad hoc" isn't just "making an excuse." It's "making an excuse that can't be tested independently."
      *   *Example:* Radiocarbon outlier. Mainstream: "Let's check contamination." (Testable). Fomenko: "The lab is part of the conspiracy" or "Carbon dating doesn't work before year X." (Untestable/Immunizing).
      *   *Address the "Sociological" fear:* Show that the distinction is epistemological, not just institutional.
      *   *Commitment:* Rejecting (3) commits you to analyzing the *structure* of the auxiliary hypotheses, not just their existence.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   Wait, simply saying "Mainstream is better" isn't enough. I need to explain *why* (3) is false philosophically.
      *   Use Lakatos's "Research Programmes." Mainstream is (mostly) progressive; Fomenko is degenerating.
      *   Use the concept of "Independent Testability." This is the key to saving (1).
      *   Make sure to address (4) as well, because (4) reinforces (3). (4) suggests cross-checks are useless. That's wrong. Cross-checks provide the independent testability.
      *   *Decision:* The primary rejection should be of (3), but it requires a refinement of (1) to make (3) clearly false. If (1) is too vague, (3) looks true. So, refine (1) to specify *untestable* auxiliaries, then reject (3) because mainstream auxiliaries *are* tested.

  7.  **Finalizing the Structure:**
      *   **Direct Answer:** Reject (3).
