  Here is a prediction and analysis for your two-page assignment, based on the pattern of your seminar leader's verdicts.

  ### 1. The Verdict on Thursday's Case
  **Verdict:** **Nothing at all.**

  **Reasoning:**
  Your leader is operating on a **Bayesian/Probative** rule, not a purely logical one. She accepts that a non-black non-raven *can* confirm the hypothesis (Case 2: *Negligible*), but only if the observation carries **probative value** regarding the hypothesis.

  *   **Case 2 (Random Point):** You pointed at *anything*. There was a non-zero (however tiny) probability the object was a raven. By turning out to be a non-raven, it slightly reduced the pool of objects that *could* have been counter-examples (non-black ravens). Hence: *Negligible but real*.
  *   **Thursday's Case (Shoe Shop):** You entered a shoe shop. You knew *beforehand* the object was not a raven. The probability of it being a raven was zero. Observing its color (white) tells you nothing about the color of ravens, because this object was never a candidate for being a counter-example. You have not reduced the uncertainty about ravens; you have only cataloged a shoe.

  She will likely argue that collapsing this into *Negligible* (like Case 2) ignores the **sampling protocol**. If you deliberately exclude ravens from your sample, you cannot learn about the properties of ravens.

  ### 2. The Rule She Is Running
  **The Rule:** **Confirmation requires a non-zero prior probability of encountering a potential falsifier.**
  (Or, in Bayesian terms: The Likelihood Ratio must be greater than 1).

  *   **Fits Cases 1-7:**
      *   **Case 1 & 7 (Black Raven):** Potential falsifier (a raven) was found and passed the test. (*Weak*).
      *   **Case 2 (Random White Trainer):** Potential falsifier (a raven) *could* have been found, but wasn't. The object turned out to be a non-black non-raven, which is consistent with $H$ and slightly reduces the "non-black" pool where a raven might hide. (*Negligible*).
      *   **Case 3 (Black Umbrella):** Object is black. Cannot be a counter-example ($\neg B \land R$). No probative value. (*Nothing*).
      *   **Case 5 (Cabinet):** Fixed totals mean every non-black non-raven found significantly reduces the slots available for a non-black raven. (*Weak*).
      *   **Thursday's Case:** Object is known to be $\neg R$. Cannot be a counter-example. No probative value. (*Nothing*).

  ### 3. Alternative Rules & Thursday's Case
