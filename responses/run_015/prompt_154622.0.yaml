answer: |-
  **Exam Question**

  **Course:** Seminar on Speech Acts and Epistemology
  **Assessment:** Final Examination
  **Time Allowed:** 90 Minutes

  **Prompt:**
  Consider a climate-science consortium that collectively asserts a specific claim: a particular feedback loop accelerates global warming. However, no individual member fully grasps every sub-model supporting this claim; epistemic authority is distributed across the group rather than held by any single speaker.

  Write an essay evaluating the normative status of this assertion. Your response must address the following three issues:
  1.  Decide whether the knowledge norm can be satisfied collectively despite individual ignorance.
  2.  Determine whether the belief norm avoids collapse only by allowing partial credence to aggregate into collective commitment.
  3.  Assess whether a modified truth norm offers a superior account compared to a simple truth condition.

  Argue for a coherent position on whether the consortium's assertion is warranted, relying solely on conceptual reasoning without reference to specific authors or texts.

  ***

  **Model Answer**

  The consortium scenario exposes a fundamental fissure in standard assertion norms, which traditionally presume a unitary speaker with direct access to content. Classical epistemology dictates that one must know, believe, or speak the truth to assert legitimately. However, when epistemic authority is distributed across a group, individualistic constraints become obstructive barriers to necessary communication. The primary philosophical task is to decide whether normative satisfaction transfers from parts to wholes or if the group constitutes a distinct epistemic category.

  Concerning the knowledge norm, the consortium can satisfy it collectively even if no individual member can. Knowledge in this context is not merely a mental state held in a single mind but a status achieved through structural integration of diverse expertise. If the consortium functions as a unified epistemic agent, the lack of individual grasp regarding specific sub-models is irrelevant. The group possesses the total evidence collectively, satisfying the condition that the assertor knows the content. Denying this forces us to claim that complex scientific facts regarding climate feedback cannot be asserted responsibly, which leads to an untenable skepticism. Therefore, the knowledge norm is satisfied via non-summativist collective cognition, where the whole knows what the parts do not.

  Regarding the belief norm, the requirement for full binary belief threatens to collapse under distributed uncertainty. Individual scientists often hold high credence rather than absolute certainty due to model limitations. If the norm demands full belief from every contributor, the consortium fails. To avoid this collapse, the norm must allow for aggregated partial credence. The collective commitment acts as a functional proxy for belief, derived from the weighted confidence of members across different domains. This modification preserves the norm's intent—commitment to accuracy—without requiring psychological states no individual possesses. The belief norm survives only by shifting from individual psychology to collective institutional commitment.

  Finally, the truth norm requires modification to offer a superior account. A simple truth norm permits lucky true assertions, which undermines epistemic warrant. A modified norm requiring truth produced via reliable processes fits the consortium better. The consortium's structured methodology, peer review, and cross-verification ensure reliability, distinguishing their assertion from accidental correctness. This accounts for why their assertion is warranted even if individual verification is impossible for any single member. The modified truth norm captures the structural reliability that simple truth misses, aligning warrant with the process rather than just the outcome.

  In conclusion, the consortium's assertion is warranted because collective norms supersede individual constraints in distributed contexts. The knowledge norm is satisfied through integration, the belief norm through aggregated credence, and the truth norm through reliability mechanisms. Individualistic frameworks fail to capture the epistemology of collaborative science because they misidentify the agent. The correct view treats the consortium as the primary epistemic agent, validating the assertion despite individual ignorance. This shift preserves the integrity of assertion while accommodating the reality of modern expertise.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Passing Threshold:** 10 Marks

  | Analytical Move | Marks | Common Candidate Errors |
  | :--- | :---: | :--- |
  | **1. Problematizing Individualism:** Clearly identifies the tension between traditional individualistic norms (single speaker) and the distributed nature of the consortium scenario. | 4 | Candidates often assume the individual norms apply directly without questioning the unitary speaker assumption, missing the core philosophical tension. |
  | **2. Collective Knowledge Defense:** Argues that knowledge is satisfied via non-summativist collective cognition (the group knows what individuals do not). | 4 | Candidates frequently deny collective knowledge is possible, insisting that if no individual knows, the group cannot know (summativism). |
  | **3. Belief/Credence Aggregation:** Explains how the belief norm avoids collapse by accepting aggregated partial credence rather than requiring full individual belief. | 4 | Candidates often insist on full binary belief for all members, leading to the conclusion that the assertion is impermissible or the norm is broken. |
  | **4. Modified Truth Norm:** Evaluates the truth norm, arguing that reliability/process is superior to simple truth to account for warrant in distributed systems. | 4 | Candidates typically treat truth as a binary outcome only, failing to distinguish between accidental truth and warranted reliability. |
  | **5. Synthesis on Agency:** Concludes by affirming the consortium as the primary epistemic agent, synthesizing the three norms into a coherent collective framework. | 4 | Candidates often provide a fragmented conclusion that addresses the three points separately without unifying them under a theory of collective agency. |
