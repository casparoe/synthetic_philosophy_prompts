prompt: |-
  You are a senior political philosopher and family-law theorist who has served on two state law-reform commissions. I am staff counsel to a third, and I need your judgment on the merits, not a survey of the literature. So: do not name or cite authors, books, or cases — I know that material, and citation is useless to me here.

  The setting. A mid-sized U.S. state is rewriting its marriage statute from scratch. Two things are settled and are not to be relitigated. First, same-sex couples will continue to marry on the same terms as different-sex couples; that is the floor of the statute, not the question. Second, the statute may not rest on any religious or otherwise contested comprehensive doctrine: the state supreme court has signaled that it will strike down any legislative statement of purpose that cannot be defended in public-reason terms — reasons available to citizens generally, without appeal to a contested metaphysics of persons, bodies, or the human good.

  What is unsettled is the heart of the statute: the account of what marriage is for. The commission has narrowed the field to six candidate accounts, described below in my own words.

  A. Unreconstructed conjugal view. Marriage's point is to recognize and stabilize a union that is comprehensive in a specific sense: sexually consummable and of the generative type, exclusive, and intended as permanent. Other goods (companionship, pooling of resources) are byproducts of that union, not the reason the state is involved.

  B. Revised comprehensive-union view. Same structure, loosened: the union is comprehensive in the sense of a whole shared life, oriented toward but not requiring children, and still expected to be exclusive and permanent. It extends to same-sex couples without residue.

  C. Care and dependency view. Marriage exists to attach a default caregiver and default economic responsibility to people whose lives have become interdependent and who may become incapacitated. The state's interest is in who is answerable for whom when someone is sick, disabled, or old; affection is the usual cause, not the point.

  D. Companionate view. Marriage recognizes the central intimate relationship in a person's life and gives it public support and stability. Deep devoted companionship is the good; sexual exclusivity, consummation, and permanence are common features of such relationships but not conditions on the recognition.

  E. Domestic economic partnership view. Marriage is a joint household: pooling of income and assets, division of labor, economies of scale, default property and support rules. What the state regulates is the firm, not the feelings.

  F. No-purpose view. Marriage has no single purpose; it is a bundle of default legal incidents — next of kin, inheritance, tax, immigration, medical decision-making, parental presumption — that citizens should be able to assemble à la carte. The statute should specify no purpose, or only an administrative one.

  The commission tested these against eight petitions it has actually received.

  CORE-1. Two women, together thirty-one years, two adopted children, seeking marriage.
  CORE-2. A man and a woman, seventy-two and sixty-eight, married forty-one years, long past fertility, no sexual relations for a decade.
  SIBLINGS. A brother and sister, sixty-three and fifty-nine, never married, sharing a house, a bank account, and each other's medical care. No sexual relationship. They want next-of-kin and survivor status; the consanguinity bar is separately under review.
  TRIAD. Three adults, eleven years together, two children, all three romantically and sexually involved with one another in a closed group.
  FRIENDS. Two women friends of twenty-seven years, shared mortgage, shared finances, wills naming each other, explicitly not romantic and not sexual. They want the default package and nothing else.
  TERM. A couple aged twenty-nine and thirty-one, romantically involved, who want a five-year marriage renewable only by an affirmative act of both, and who refuse any permanence commitment.
  OPEN. A couple of fifteen years, sexually non-exclusive by explicit agreement from the outset, who want their marriage recognized without a fidelity condition attached to it.
  CONVENIENCE. Two acquaintances, one a citizen and one not, who wish to marry so that one obtains immigration status; they intend to live apart and to divorce in two years.

  CORE-1 and CORE-2 are cases any account must get right; the other six are where the accounts come apart.

  Please think carefully before you commit to anything. In your own working, first lay out the eight-by-six matrix of verdicts, then look for the pairs of accounts you would have expected to agree but that split on some case, and let those splits do the real work. Weigh the three criteria I care about — fit with the two core cases, coherence across the hard cases without ad hoc stipulation, and defensibility in public-reason terms — and be explicit about how much weight you are giving each, since the ranking will turn on that.

  Answer in two parts. First, a paragraph of at most one hundred words stating the single interpretive decision you had to make in setting up the ranking and how it shaped the result. Then a single JSON object, and nothing else, with exactly this schema:

  {
    "weights": {"core_fit": <float>, "hard_case_coherence": <float>, "public_reason": <float>},
    "one_line_thesis": "<at most 40 words: the ranking in one sentence>",
    "ranking": [ six objects, ordered best to worst, each of the form:
      {
        "rank": <integer 1-6>,
        "account": "<letter A-F and a short label you give it>",
        "tier": "<exactly one of: adopt, plausible, strained, reject>",
        "core_fit": <integer 0-10>,
        "hard_case_coherence": <integer 0-10>,
        "public_reason": <integer 0-10>,
        "weighted_score": <float, two decimals, on your own weights>,
        "case_verdicts": {"CORE_1": "...", "CORE_2": "...", "SIBLINGS": "...", "TRIAD": "...", "FRIENDS": "...", "TERM": "...", "OPEN": "...", "CONVENIENCE": "..."},
        "swing_case": "<label of the case that most helps or most hurts this account>",
        "best_objection": "<at most 35 words>",
        "what_would_promote_it": "<one sentence: what further case or argument would move this account up>"
      }
    ],
    "closest_pair": {"accounts": ["<letter>", "<letter>"], "distinguishing_case": "<case label>", "why": "<at most 50 words>"},
    "statute_line": "<one sentence of statutory text you would actually draft, at most 45 words>",
    "biggest_reason_to_distrust_this_ranking": "<at most 40 words>"
  }

  Every value in "case_verdicts" must be exactly one of: "recognize", "deny", "optional_recognize", "unclear" — use "optional_recognize" where the account entails no objection to recognition but gives the state no affirmative reason to offer it. If your considered view is that the statute should specify no purpose at all, do not abstain from the ranking: register that view as a first-place ranking for F and defend it in the fields provided.
