answer: |-
  You've smuggled in a Principle of Indifference over copies, and that's where the arithmetic goes off the rails. There is no objective chance process that selects *which* copy you are. You are not drawn at random from the urn of copies; you simply are one of them. The Principal Principle constrains your credence in propositions about chance outcomes given admissible evidence. The chance outcome relevant to you is *your* toss. The chance of *your* toss landing heads, at the time it was tossed, was 0.5. Your evidence—that you are in the room with the other copies—is admissible regarding the chance of *your* toss because it doesn't tell you the outcome of *your* toss, nor does it undermine the chance function itself. It only tells you about the existence of others. Since there is no chance associated with your self-location among those others, the Principal Principle says nothing about how to weight them. It tells you to match your credence in the chance outcome to the chance. That's 0.5. The step I reject is your self-location step: the claim that you should reason as if you were a random sample from the set of copies.

  Regarding the betting test, you're confusing credence with decision-theoretic utility in a branching context. The bookie breaks even because he's paying out on a per-copy basis, effectively betting on the size of the population rather than the truth of the proposition for any single agent. If you care only about whether *your* belief is true, the odds are 0.5. If you care about the total welfare of all your copies, then yes, you should act as if the probability is higher, because your decision impacts more copies in the tails-worlds than in the heads-worlds. But the Principal Principle is about the norm for belief given chance, not the norm for action given copying externalities. You're trying to derive a truth-norm from a utility calculation that weights worlds by observer-counts. I don't grant that observer-counts weigh truth.

  I'll mark my hand: I didn't write on this exact geometric copying case, but I am forcing this view from my position on Sleeping Beauty. In that case, I argued Beauty's credence in Heads remains 1/2 upon waking because she gains no new evidence about the coin. Here, you gain no new evidence about *your* coin. The cost is that the Principal Principle leaves you underdetermined on how to distribute credence over *which* copy you are, if that even makes sense. It tells you how to regard the chance event attached to you, but it doesn't validate counting copies to shift that credence. If you want ln 2, you need a principle of indifference I never granted and won't grant now. The principle stands; your application of it to self-location is the error.
