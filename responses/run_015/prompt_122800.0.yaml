answer: |-
  **DRAFT AGREEMENT FOR ADVERSARIAL COLLABORATION: THE DREAM QUESTION**

  **1. Agreed Claims**

  1.  **Sleep-Laboratory Evidence:** We agree that physiological data (arousal thresholds, REM correlates, targeted memory reactivation) establishes robust predictors of waking reports. We agree this evidence does not logically entail that consciousness occurred during sleep independent of the report, nor does it refute that possibility.
  2.  **Boundary States:** Hypnagogic and hypnopompic mentation are accepted as reportable states contiguous with waking. Reports of dreaming about nothing in particular are treated as valid reports, not as evidence of a phenomenological void.
  3.  **The Unawakened Sleeper:** In the case of a sleeper in REM who is never awoken and so never reports, we agree no report exists. The Sceptic maintains no fact of the matter exists regarding consciousness; the Anti-Sceptic maintains a fact exists but remains unaccessed.
  4.  **Embedded Reports:** Where a subject reports having dreamt that they woke up and told another person about a dream, we agree this is a narrative structure within the waking report, not evidence of nested consciousness episodes occurring during sleep.
  5.  **Oneiric Playback:** Suppose a trace recorded during REM could be played back into the sleeper's cortex on waking, producing an experience they then report as a memory of the night. We agree the set-up is coherent. The Sceptic holds this would demonstrate memory construction mechanisms; the Anti-Sceptic holds this would demonstrate latent content existence.

  **2. Residual Disagreements**

  | Issue | Sceptic Idiom | Anti-Sceptic Idiom | Condition for Revision |
  | :--- | :--- | :--- | :--- |
  | **Ontology** | The concept of a dream is internally related to the waking report; there is no inner episode to be mistaken about. | Once verificationist pressure is removed, there is an ordinary empirical question about what it is like to be the subject. | A method to verify consciousness without relying on waking testimony. |
  | **Timing** | The time of the dream is fixed by the time of the report; asking when it occurred during sleep is unsettled-able. | The time of the dream is fixed by the neural event; the report merely accesses a past fact. | Precise neural decoding that predicts report content before awakening. |
  | **Error** | A subject cannot be straightforwardly mistaken about having dreamt; the report constitutes the fact. | A subject can be mistaken (confabulation); the report describes a fact independent of itself. | Demonstrated mechanism showing specific dream reports are confabulations induced post-hoc. |

  **3. Cruxes and Settlement**

  We identify the following as bearing on the dispute. For each, we record our predictions in advance.

  *   **Lucid Signaling:** If a lucid dreamer produces pre-arranged eye signals during REM indicating specific conscious choices.
      *   *Sceptic Prediction:* This establishes a complex behavioural capacity correlated with REM, not necessarily consciousness during sleep.
      *   *Anti-Sceptic Prediction:* This establishes consciousness during sleep independent of waking testimony.
  *   **Procedure:** In principle, we could run a real-time decoding experiment. If neural patterns during REM are decoded into text before awakening, and the waking report matches the decoded text perfectly without prior training, this bears on the Timing and Error rows.
  *   **The Settlement Problem:** We acknowledge an asymmetry: the only check available is waking testimony. The Anti-Sceptic accepts this is a technological limitation and not grounds for embarrassment. The Sceptic holds this is a grammatical necessity and the Anti-Sceptic ought to be embarrassed by demanding checks conceptually impossible to perform. We agree to treat this asymmetry as the central metaphysical divergence rather than an empirical deadlock.

  **4. Verbal and Substantive Elements**

  We conclude that part of the dispute is verbal, turning on the words *experience*, *dream*, and *report*. The Sceptic uses *experience* to imply a verifiable episode; the Anti-Sceptic uses *experience* to denote a causal state regardless of verification. However, a substantive question survives once the verbal part is set aside: do the neural states occurring during sleep have the causal powers typically associated with consciousness, such as integrating information and guiding behaviour, independent of the waking narrative construction? We agree to focus future inquiry on isolating these causal powers rather than debating the grammar of dreaming.
