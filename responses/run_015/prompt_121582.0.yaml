answer: |-
  Your intuition is spot on. Your roommate has captured the **first half** of Wittgenstein's view on religion quite well (the critique of scientism), but she stumbles significantly on the **second half** (reducing it to emotion and taste).

  She is describing a popular interpretation of Wittgenstein known as **Fideism** (the idea that faith is independent of reason), but she pushes it into **Emotivism** (the idea that religious statements are just expressions of feeling), which Wittgenstein did not hold.

  Here is a part-by-part breakdown of what is accurate, what is a simplification, and what is actually wrong.

  ---

  ### 1. "Religious belief isn't a kind of theory or hypothesis... proved wrong by science."
  *   **Verdict:** **Accurate.**
  *   **Why:** This is the core of Wittgenstein's *Lectures on Religious Belief*. He explicitly argues that if a religious person says "There will be a Last Judgment," they are not making a weather forecast or a historical prediction that could be falsified by evidence. If you told a believer, "There is no evidence for a Last Judgment," they wouldn't say, "Oh, I guess I was wrong." They would say you don't understand what they mean. For Wittgenstein, religious belief is not a "hypothesis" waiting for verification; it is a framework through which verification is understood.

  ### 2. "It belongs to its own language-game with rules that are internal to religious practice."
  *   **Verdict:** **Mostly Accurate (with nuance).**
  *   **Why:** Wittgenstein does argue that religious language has a specific "grammar." You cannot judge the moves in a religious language-game using the rules of a scientific language-game. However, saying the rules are "internal" can make it sound like religion is a closed bubble that never touches reality. Wittgenstein would say religious language is woven into the *form of life* of the believer. It affects how they act, suffer, and hope. It isn't just a game they play on Sundays; it structures their reality.

  ### 3. "Saying 'God exists' works more like expressing a commitment... not like saying 'there's a chair in the room.'"
  *   **Verdict:** **Accurate.**
  *   **Why:** Wittgenstein distinguishes between empirical propositions ("there is a chair") and religious assertions. To say "God exists" is to adopt a "picture" that holds you captive. It regulates your life. If you believe in the Last Judgment, you act differently *now*. The truth of the statement is found in its role in the believer's life, not in its correspondence to a physical object detectable by instruments.

  ### 4. "He applies the same idea he used against Frazer — that ritual isn't a botched scientific explanation but just a spontaneous expression of feeling."
  *   **Verdict:** **Accurate.**
  *   **Why:** In *Remarks on Frazer's Golden Bough*, Wittgenstein criticizes the anthropologist Frazer for thinking primitive rituals were failed attempts at science (e.g., "they dance to make rain because they think it causes rain"). Wittgenstein argues the ritual *is* the expression of the feeling; it isn't a means to an end based on a theory. Kissing a photo of a loved one isn't a theory that the ink will feel the kiss; it's an action of love.

  ### 5. "Prayer and belief are basically emotional responses with no real cognitive content, just like preferring chocolate."
  *   **Verdict:** **Wrong / Deeply Misleading.**
  *   **Why:** This is where your roommate's summary breaks down.
      *   **Not just emotion:** Wittgenstein never reduces religion to *mere* emotion. He speaks of religious belief as a "passionate commitment." There is a huge difference between a whim (chocolate) and a commitment that organizes your entire existence (religion).
      *   **Cognitive Content:** Wittgenstein does not say religion has *no* cognitive content. He says it doesn't have *empirical* content. For the believer, "God exists" is not a report on their feelings; it is a claim about reality. Wittgenstein respects the *truth-claims* of religion, he just insists they are not *scientific* truth-claims.
      *   **The Chocolate Analogy:** This is the biggest error. If religion were like preferring chocolate, it would be trivial. Wittgenstein treated religion with immense seriousness. He acknowledged that for the believer, the stakes are absolute, not preferential.

  ### 6. "Religious people and atheists aren't really disagreeing about facts; they're just living in different emotional worlds."
  *   **Verdict:** **Simplification / Partially Wrong.**
  *   **Why:** It is true they aren't disagreeing about *empirical* facts (like the age of the earth). But saying they are just in different "emotional worlds" implies that there is no substantive disagreement.
      *   Wittgenstein suggests they are operating with different **pictures of the world**. This is deeper than emotion. It is a difference in *judgment*.
      *   An atheist isn't just "sad" and a believer "happy." They disagree on how to interpret suffering, death, and morality. Wittgenstein acknowledges a "gulf" between them, but he doesn't reduce that gulf to mere mood. It is a gulf in *understanding*.

  ### 7. "Arguing about religion is basically trying to correct someone's taste in ice cream."
  *   **Verdict:** **Wrong.**
  *   **Why:** This is the "Fideist" caricature. If religion were just taste, you couldn't argue about it, and it wouldn't matter. But Wittgenstein observes that religious people *do* argue, they *do* try to convince others, and they treat heresy as a serious error, not a flavor preference.
      *   Wittgenstein's point is that you cannot use *scientific evidence* to correct them (like proving there is no chair). But that doesn't mean all discourse is impossible. It means the *criteria* for what counts as a good argument are different.
      *   Reducing it to ice cream makes religion look irrational or childish. Wittgenstein thought religious language was perfectly rational *within its own grammar*, even if that grammar differs from science.

  ---

  ### The Core Issue: Incommensurable Emotional Worlds?

  You asked specifically about the conclusion that they are living in "incommensurable emotional worlds."

  **This is the weak point of your roommate's summary.**

  Wittgenstein does argue that the religious believer and the materialist are, in a sense, talking past each other. He uses the analogy of two people looking at the same painting: one sees a historical document, the other sees a sacred icon. They can't easily convince each other because they are looking at the *same thing* but seeing a *different aspect*.

  However, calling them "emotional worlds" is **psychologism**. It suggests the difference is inside their heads (feelings) rather than in the public language they use.
  *   **Wittgenstein's View:** The difference is in the **grammar** and the **form of life**. It is public, social, and structural.
  *   **Roommate's View:** The difference is private, subjective, and emotional.

  **Why your intuition was right:**
  If religion were just "taste in ice cream," Wittgenstein wouldn't have spent so much time analyzing it with such respect. He saw religious belief as something that could "hold someone captive" with immense power. You don't get held captive by a preference for vanilla over chocolate. You get held captive by a picture of the world that demands everything from you.

  ### Summary for your discussion
  You can tell your roommate:
  > "You nailed the part about religion not being a scientific hypothesis. That's definitely Wittgenstein. But I think you went too far in making it sound like religion is just a feeling or a preference. Wittgenstein treats religious belief as a serious 'picture of the world' that governs action, not just a mood like liking chocolate. He thinks the *logic* is different, not that the *content* is empty."

  She has correctly identified Wittgenstein's **anti-scientism**, but she has incorrectly attributed **emotivism** to him.
