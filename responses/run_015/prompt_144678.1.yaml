      *   *The Trap:* Reducing 5 distinct social goods to "cash up front" is category error. A student might prefer High Spend (Mental Health) and Low Spend (Bikes) over Mid Spend (Bus). That's not single-peaked.
      *   *Memo Tone:* Needs to be respectful to the Treasurer but firm on the theory.

  6.  **Writing the Memo (Iterative Process):**
