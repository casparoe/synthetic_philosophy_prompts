answer: |-
  **MEMORANDUM**

  **TO:** Big Spend Committee
  **FROM:** Student Representative
  **DATE:** October 24
  **SUBJECT:** Recommendation on Voting Rule for One-Off Pot Allocation

  **Recommendation**
  I recommend we adopt the **0–5 Score Voting (Range Voting)** rule. Each member assigns a score from 0 to 5 for each bid; the bid with the highest total wins.

  While Instant-Runoff (IRV) is robust and the Treasurer's Median Rule is theoretically attractive, Score Voting best fits our context. It allows us to register *intensity* of preference—which is critical when comparing disparate welfare benefits like mental health support versus bar equipment—while our small, deliberative group size mitigates the risk of strategic gaming.

  **Why Not the Median Rule?**
  The Treasurer argues the Median Rule (voting on the "cost axis") cannot be gamed. Theoretically, she is partially right: the Median Voter Theorem is strategy-proof *if* voter preferences are "single-peaked" along that dimension. This means everyone would agree that moving closer to their ideal spend level is always better, regardless of the specific bid.

  However, this assumes cost is the only dimension that matters. In reality, our preferences are not single-peaked on a cost axis. A member might strongly prefer the high-cost Mental Health line and the low-cost Bike Co-op, but oppose the mid-cost Bus Subsidy due to logistical concerns. If preferences loop like this, the "median" becomes manipulable and may select an option that almost nobody actually wants. The rule does not escape the Gibbard–Satterthwaite impossibility; it merely sidesteps it by assuming a domain restriction (single-peakedness) that does not exist for these five distinct bids. Reducing complex social goods to a single cash axis loses essential information.

  **Why Not Instant-Runoff (IRV)?**
  IRV is a solid default and handles the "vote-splitting" problem better than plurality. However, it forces ordinal rankings. It treats a mild preference the same as a urgent one. If six members rank the Bar PA system first but feel lukewarm about it, and five members rank the Mental Health line first with extreme urgency, IRV might award the pot to the Bar. Score Voting captures the intensity of that urgency, maximizing overall committee welfare rather than just counting heads.

  **Addressing Strategic Voting**
  The strongest argument against Score Voting is that it invites strategy (e.g., giving your favorite a 5 and everyone else a 0). Gibbard–Satterthwaite tells us that for any non-dictatorial rule, there exists *some* scenario where manipulation pays off.

  However, we must distinguish between theoretical possibility and practical reality.
  1.  **Deliberation:** We are eleven people arguing in a room before voting. In small, repeated-interaction groups, reputation costs deter naked strategy. If you bullet-vote obviously against consensus, you lose influence on future committees.
  2.  **The Trade-off:** Yes, Score Voting is vulnerable to strategy. But IRV is vulnerable to *tactical ranking* (burying strong competitors), and the Median Rule is vulnerable to *dimensional manipulation* (framing the axis). Since some vulnerability is unavoidable, we should choose the rule that yields the best outcome when voters are honest. Score Voting maximizes welfare when voters are sincere; IRV only maximizes majority rule.

  **Conclusion**
  We are allocating funds to maximize student welfare, not just to pick a winner. The bids differ in kind, not just cost. Score Voting allows us to express how much we care, not just what we prefer. Provided we vote in good faith following our discussion, it is the superior tool for this decision.
