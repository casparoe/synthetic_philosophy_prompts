answer: |-
  **Project Title:** Constructing Decline: Retroclassification Bias and the Limits of the Outside View in Imperial Durability

  **Project Summary**
  The "outside view" is the standard method for forecasting the durability of political orders: identify a reference class of similar polities, calculate the base rate of survival, and adjust for specific cases. Proponents treat this as a technical exercise executable with sufficient skill. This project challenges that assumption, arguing that applying the outside view to hegemonic polities reveals profound conceptual indeterminacy. The research question is precise: *To what extent does variance in imperial durability forecasts stem from conceptual indeterminacy in reference class construction rather than substantive disagreement about causal mechanisms?*

  I identify four sources of indeterminacy. The *clock problem* asks when survival time begins (founding, accession to primacy, last expansion). The *endpoint problem* asks when a polity ends (loss of territory, regime change, ideological collapse). The *vantage-truncation problem* notes that base rates shift depending on the observation date because only finished cases are visible. However, the core theoretical contribution is the *retroclassification bias*: reference class membership is an artifact of the outcome. Polities that survive long enough and end memorably are coded as "empires"; short-lived conquest states are re-described as raids, interregna, or crises. Consequently, the sample from which the base rate is computed is selected on something close to the variable being predicted. This is not merely survivorship bias; it is a constitutive bias where the category "empire" is produced by the durability it is meant to predict.

  **Theoretical Intervention**
  This project bridges the divide between proponents of structural forecasting and interpretive historians. Forecasting enthusiasts assume reference classes are objective containers waiting to be filled; they treat variance between forecasts as noise to be reduced by better data. This project demonstrates that variance is structural, arising from legitimate but incompatible coding choices regarding clocks and endpoints. Conversely, historical skeptics argue that each polity is unique and base rates are meaningless. They are correct that categories are constructed, but incorrect to conclude that quantification is impossible. By quantifying the variance produced by different construction rules, this project validates the historians' intuition using the forecasters' tools. It shows that the disagreement is not about the world, but about the measurement apparatus. The output is not a single probability of decline, but a measure of how much the method itself manufactures uncertainty.

  **Methodology and Data**
  The dataset will comprise approximately forty large, hegemonic polities coded from English-language reference works. I acknowledge the limitation: a small, heterogeneous N precludes precise parameter estimation. However, precision is not the goal. The objective is to generate confidence intervals wide enough to function as a discipline on confidence rather than as a prediction. If the method yields a survival probability ranging from 10% to 90% depending on coding choices, that range is the finding, not a failure of execution.

  To test this, I will employ a backtesting protocol. I will reconstruct the forecast a well-informed analyst could have made at three past vantage points (1900, 1950, 2000) using only data available at that time. This addresses the vantage-truncation problem by treating the base rate as a moving quantity. Forecasts will be evaluated using a logarithmic scoring rule, which penalizes overconfidence heavily. This ensures that a model claiming high certainty based on a fragile coding scheme is scored poorly against one admitting wide uncertainty. Crucially, the design is neutral regarding present-day decline. The target polities are historical; the method is the variable. If the method cannot distinguish between stability and collapse in the past, it cannot credibly diagnose either in the present.

  **Deliverables and Alternatives**
  The primary deliverable is an "Uncertainty Audit" protocol for practitioners. When an analyst claims a polity has a specific survival probability, this tool allows them to calculate how much of that estimate relies on arbitrary choices about clocks, endpoints, and classification. It shifts the burden of proof from defending the probability to defending the coding scheme.

  I reject three obvious alternatives. Deeper case studies would illuminate mechanisms but miss the structural sampling bias inherent in the register itself. A formal model of imperial decline would require fixed parameters, precisely assuming away the indeterminacy I intend to measure. A survey of expert forecasts would merely replicate the retroclassification bias within the experts' own judgments. Only by systematically varying the construction of the reference class can we isolate the bias inherent in the outside view itself.

  **Timeline**
  *Months 1–3:* Data collection and initial coding of the forty-case register from standard reference works.
  *Months 4–6:* Systematic variation of coding rules. I will generate multiple datasets altering the clock start, endpoint definition, and inclusion criteria to measure retroclassification effects.
  *Months 7–9:* Backtesting simulation. I will run the forecasting model at the 1900, 1950, and 2000 vantage points and apply the logarithmic scoring rule to evaluate calibration.
  *Months 10–12:* Writing and dissemination. I will draft the dissertation chapter and a standalone article on the Uncertainty Audit protocol.

  **Risk and Failure Conditions**
  An honest account of failure is necessary. First, if the variance between coding schemes is negligible, the core theory is wrong; the indeterminacy is theoretical, not empirical. Second, if the confidence intervals are universally maximal (0% to 100%), the result is a disguised admission of defeat; it would indicate the concept "empire" is too fuzzy for any quantitative treatment. I argue that a wide but bounded interval (e.g., 20% to 80%) is a successful result—it quantifies the limit of knowledge. Third, if the backtesting shows that earlier vantage points yield systematically different base rates solely due to truncation, without retroclassification effects, the contribution narrows to a technical note on survival analysis rather than a conceptual critique. Finally, if the coding proves impossible to standardize even within English-language sources, the project fails to demonstrate that the indeterminacy is measurable rather than just anecdotal. The project succeeds only if it produces a quantifiable measure of methodological uncertainty that constrains substantive claims about decline.
