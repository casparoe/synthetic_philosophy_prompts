answer: |-
  1. **Sequence and Dependency** (90 minutes)

      1.  **Introduction & Case Setup (0–15):** Present the sabotage case. Ask: "What do you feel?"
          *Dependency:* Later steps fail if students do not first acknowledge the emotion exists before analyzing its object.
      2.  **Witness Absence (15–35):** Establish the agent is alone; the wincing persists. Shame is not merely fear of exposure.
          *Dependency:* The discharge analysis fails if shame is still viewed as contingent on an audience; you cannot analyze how an emotion ends if you deny it exists without witnesses.
      3.  **Discharge Asymmetry (35–55):** Guilt offers repair (confession); shame offers exit (concealment). Neither is inherently mature; both are functional.
          *Dependency:* The practices argument fails if students believe emotions are chosen rather than responses to available procedures for resolution.
      4.  **Practices & Substitution (55–80):** Cultures select practices (exposure vs. anonymity), not emotions. Exposure can block repair,制造ing shamelessness.
          *Dependency:* The assessment fails if students believe changing emotional vocabulary changes emotional ecology.
      5.  **Assessment (80–90):** Pose the distinguishing question (see Section 5).
          *Dependency:* The seminar earns its keep only if the final answer requires synthesizing practice and emotion, not reciting definitions.

  2. **Misconception Map**

      *   **Shame = fear of being found out:** Defuse in Segment 2 (Witness Absence).
      *   **Guilt = mature/liberal, Shame = childish/illiberal:** Use in Segment 3 to show functional asymmetry, not hierarchy.
      *   **Shame = status (not moral):** Defuse in Segment 2 (Internal wincing proves moral grip).
      *   **Shameless = lacks social anxiety:** Use in Segment 4 to show they may lack a standard, not fear.
      *   **Guilt = safe (act-only):** Defuse in Segment 3 (Guilt metastasizes if repair is impossible).
      *   **Culture can choose less shame:** Defuse in Segment 4 (Practices determine ecology).
      *   **Shame → Humiliation/Rage; Guilt → Repair:** Place in Segment 3 as descriptive asymmetry, not verdict.
      *   **Guilt/Shame Cultures (Anthropology):** Address explicitly in Segment 4 to prevent late confusion.

  3. **Carrying Case**

      *   **Specification:** A small, deliberate sabotage of a colleague's data years ago. Never discovered. Colleague suffered minor delay only. Agent is now successful; repair is impossible (would destroy career for negligible gain). Agent still winces internally.
      *   **Must-Have:** Deliberate agency (moral responsibility); Total secrecy (isolates shame from audience); Trivial harm (prevents legal/catastrophic distraction).
      *   **Must-Not-Have:** Public exposure (undo Segment 2); Victim suffering currently (shifts focus to empathy); Possibility of meaningful repair (kills Segment 3 asymmetry).
      *   **Silence:** Do not specify the agent's gender or status (prevents status bias).
      *   **Reopening Points:**
          1.  **Segment 1:** Introduce the act.
          2.  **Segment 2:** Describe the private wincing (no audience).
          3.  **Segment 3:** Note the inability to confess (no procedure for discharge).
          4.  **Segment 4:** Ask how a culture of public exposure would handle this agent.

  4. **Closing Question (Practices & Substitution)**

      *   **Mechanism:** Public exposure destroys the social standing an offender needs to make amends; a practice intended to intensify shame can end up manufacturing the shamelessness it deplores by eliminating the path to reintegration.
      *   **Argument:** Do not argue whether shame is "better." Argue that practices generate emotional byproducts.
      *   **What Not to Settle:** Do not settle whether the agent in the case *should* feel shame (normative ethics) or whether guilt is superior (verdict). Settle only that practices dictate the availability of discharge.

  5. **Assessment Question**

      *   **Question:** "If a culture wants to reduce toxic shame, should it ban public shaming practices?"
      *   **Right Answer (Sounds Wrong):** "No, because banning shaming might remove the only path to reintegration, creating permanent outcasts who feel nothing." (Recognizes practice/emotion link).
      *   **Slogan Answer (Sounds Right):** "Yes, because shame comes from other people, so removing them removes the shame." (Recites the intuition you complicated).
      *   **Distinction:** The right answer acknowledges the dependency of emotion on practice; the slogan answer assumes emotion is directly controllable.
