  ### The Non-Identity Decision Tree

  **Root Fact:** The child conceived now (Child A) is not the same individual as the child conceived later (Child B).

  **Branch 1:** Can the decision to conceive now harm the child who results from it (Child A)?
  *   **YES:** Go to Branch 5.
  *   **NO:** (Child A's life is worth living). Go to Branch 2.

  **Branch 2:** Is the decision morally significant at all if no one is made worse off?
  *   **NO:** **Leaf 1: The Person-Affecting Libertarian.**
      *   *Reasoning:* Without the act, Child A does not exist. Since Child A is not worse off than non-existence, no wrong is done.
      *   *Awkward Commitment:* Must accept that there is no moral reason to prefer conceiving a healthy child over a sick one if they are different children.
  *   **YES:** Go to Branch 3.

  **Branch 3:** Is the rightness of the decision a matter of the aggregate or average welfare of the lives that will be lived?
  *   **AGGREGATE:** **Leaf 2: The Total Utilitarian.**
      *   *Reasoning:* Morality requires maximizing the total sum of happiness. Waiting is right only if the healthy life adds more total utility than the life with the condition.
      *   *Awkward Commitment:* Must accept the "Repugnant Conclusion" (e.g., would conceive now if it allowed the parents to have *more* children overall, even if all had the condition).
  *   **AVERAGE (OR NON-AGGREGATE):** Go to Branch 4.

  **Branch 4:** Is the parents' duty to the particular child they will have or to the class of possible children?
  *   **PARTICULAR:** Go to Branch 5.
  *   **CLASS:** Go to Branch 6.

  **Branch 5:** (If Duty is Particular OR Harm is Yes) Is there any sense in which the later, healthier child is owed her existence?
  *   **YES (and Harm=Yes):** **Leaf 3: The Threshold Deontologist.**
      *   *Reasoning:* The condition is so severe it harms Child A (life not worth living), *and* Child B is owed a chance at life.
      *   *Awkward Commitment:* Must claim a life with a treatable condition is worse than never existing, while simultaneously granting rights to a non-existent person.
  *   **YES (and Harm=No):** **Leaf 4: The Rights Deontologist.**
      *   *Reasoning:* Even if Child A is not harmed, Child A has a right to the best possible start, which conflicts with Child B's claim. (Focuses on the right violated by the parents).
      *   *Awkward Commitment:* Must argue a particular child has a right to traits they cannot possess without ceasing to be themselves.
  *   **NO (and Harm=Yes):** **Leaf 5: The Wrongful Life Advocate.**
      *   *Reasoning:* Conceiving now harms Child A because the condition makes life not worth living. No need to invoke Child B's rights.
      *   *Awkward Commitment:* Must assert that for some lives, non-existence is preferable, despite the child's own potential desire to live.
  *   **NO (and Harm=No):** **Leaf 6: The Parental Virtue Ethicist.**
      *   *Reasoning:* The duty is to the child one *does* have, but a good parent cultivates the disposition to give the best start possible. It is about character, not rights.
      *   *Awkward Commitment:* Must explain why "being a good parent" requires preventing a specific child's existence in favor of a different one.

  **Branch 6:** (If Duty is Class) Is there any sense in which the later, healthier child is owed her existence?
  *   **YES:** **Leaf 7: The Strong Procreative Beneficence Theorist.**
      *   *Reasoning:* Parents have a duty to the "slot" of the child to fill it with the best possible candidate. Child B is owed the place.
      *   *Awkward Commitment:* Must treat possible people as having moral claims comparable to actual people.
  *   **NO:** **Leaf 8: The Weak Procreative Beneficence Theorist.**
      *   *Reasoning:* It is better to wait, and parents should do what is best, but no specific child is wronged if they don't.
      *   *Awkward Commitment:* Must explain the normative force of "better" if it does not correspond to anyone being "better off."

  ***

  ### Notes on the Tree

  **Indistinguishable Leaves:**
  The tree cannot practically separate **Leaf 7 (Strong Beneficence)** and **Leaf 8 (Weak Beneficence)**.
  *   **Why:** In the context of the novel, both characters will argue for waiting six months. The distinction is purely metaphysical (whether the healthy child has a *right* to be born vs. whether it is simply *good* for them to be born). Unless your characters engage in meta-ethical debate, their actions and advice to the couple will be identical.

  **Unoccupied Combination:**
  The tree allows for the combination: **Significant = No** (Branch 2) + **Duty = Class** (Branch 4).
  *   **Why Unoccupied:** This position implies that while the decision has no moral significance (no one is worse off), the parents still have a duty to the *class* of possible children. This is philosophically incoherent; if there is no moral significance to the outcome, there can be no duty to maximize the welfare of possible people. Characters who claim "it doesn't matter" (Person-Affecting) invariably reject duties to non-existent classes.

  **Character Differentiation Tip:**
  To distinguish **Leaf 4 (Rights Deontologist)** from **Leaf 6 (Virtue Ethicist)**, focus on their emotional reaction to the "treatable" nature of the condition.
  *   The **Rights Deontologist** will focus on the *injustice* of the condition itself, regardless of the parents' feelings.
  *   The **Virtue Ethicist** will focus on the *parents' regret* or the *burden of care*, framing the decision as an act of love or responsibility rather than justice.
