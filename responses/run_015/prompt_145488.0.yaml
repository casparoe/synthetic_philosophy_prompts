answer: |-
  The tension is resolvable within Kant's ethical architecture, provided one distinguishes between the normative ground of the obligation, which remains anchored exclusively in human rationality, and the phenomenological occasion of the duty, which is legitimately triggered by the animal's capacity for suffering.

  Kant's system locates the source of all duty in the autonomy of rational agents, meaning animals cannot be ends-in-themselves or holders of rights, yet this does not render their suffering morally invisible to the agent. The duty to avoid cruelty is an imperfect ethical duty to oneself, specifically the obligation to preserve and cultivate natural predispositions—such as sympathy and natural love—that serve as aids to morality. When Kant rejects the analogy of damaging a tool, he is not granting the animal independent moral status but acknowledging that animal suffering is the necessary condition for exercising this specific duty to oneself. A tool cannot suffer, so damaging it does not test or degrade the agent's sympathetic capacities; an animal does suffer, so cruelty actively dulls the "shared feeling" required for moral perfection.

  Consequently, the blameworthiness is indeed "in itself," but only in the sense that it constitutes an immediate violation of the duty to maintain one's own moral integrity, rather than merely a pragmatic calculation about future behavior toward humans. The suffering matters "on its own" only as the indispensable object required to stimulate the moral feeling that the agent is duty-bound to preserve. This aligns with the distinction between moral status and moral considerability: animals lack the former (they cannot bind the will of another through reason) but possess the latter (their interests must be weighed because ignoring them damages the moral agent).

  Finally, the friction you perceive often stems from conflating Kant's juridical and ethical registers. Juridically, animals are things, and there are no enforceable rights regarding them; ethically, they are analogues of persons, and mistreating them is a vice that corrupts the moral character. The lecture notes likely emphasize the ethical severity to combat the casual cruelty of the era, using language that sounds like direct duty while resting on the infrastructure of indirect obligation. Thus, the text reveals not a crack in the system, but the complex mechanism by which Kant attempts to secure animal protection without abandoning the rationality requirement for moral standing.
