answer: |-
  Your framework holds together pragmatically but relies on an ad hoc exception that threatens its theoretical consistency.

  Regarding (1) versus (2), you are indeed smuggling a rival theory; (1) is particularist (grounded in specific relationships), whilst (2) invokes a universalist equality filter. These do not dissolve naturally because one grounds standing in partiality and the other in impartiality, creating a foundational clash rather than a layered solution. On (3), yes, this is an ad hoc exception to (2) unless you ground it in the distinct nature of victim entitlements versus general moral authority; without that distinction, it simply asserts that victimhood trumps consistency without explaining why the equality filter fails in this specific instance. Concerning (5) versus (1), there is only a conflict if 'affected' is broader than 'victim'; if you define affected individuals as those suffering direct harm, it aligns, but if it includes mere stakeholders, it violates the relational restriction.

  I rank the tensions by severity as follows: (2) versus (3) is worst, followed by (1) versus (2), and finally (1) versus (5).

  For the worst tension, (2) versus (3), the cheapest revision is to reframe hypocrisy as defeating *general* standing to enforce norms, whilst victimhood grants *specific* standing to seek redress. The cost is bifurcating the concept of standing into two distinct types, which complicates your unified theory. For (1) versus (2), the cheapest revision is to argue that the equality filter is a precondition of the relationship itself, rather than an external moral standard. The cost is weakening the distinctiveness of your relational view, making it look more like a contractualist account. For (1) versus (5), the cheapest revision is to stipulate that 'affected' in (5) strictly means 'directly harmed party'. The cost is narrowing the scope of institutional accountability, potentially letting organisations off the hook for diffuse harms where no single individual is a clear victim.
