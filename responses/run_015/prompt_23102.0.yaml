answer: |-
  **The Anatomy of Presumption: Settling the Arthāpatti Debate**

  The debate over *arthāpatti* (postulation) is the fault line of classical Indian epistemology. On one side stand the reductionists (typically Nyāya and Buddhist logicians), who argue that all knowledge must fit into the tight machinery of perception (*pratyakṣa*) or inference (*anumāna*). On the other stand the pluralists (typically Mīmāṃsā), who argue that the texture of human understanding is too rich for such binary constraints.

  Your intuition—that *arthāpatti* collapses into *anumāna* once we relax the requirement for a pre-established *vyāpti* (universal concomitance)—is the standard reductionist move. However, to determine if this intuition is correct, we must not simply relax the requirement; we must test whether the *structure* of the cognitive event in *arthāpatti* is actually the same as inference. If the psychological and logical architecture differs, then reducing it to inference is not a simplification, but a distortion.

  Here is the case for irreducibility, followed by the reductionist rebuttal, and finally, a verdict.

  ### The Steelman for Irreducibility: The Logic of Anomaly

  The strongest argument for *arthāpatti* as an independent *pramāṇa* does not rest on the content of the knowledge (that Devadatta eats at night), but on the *trigger* and the *relation* that yields it.

  In a standard Nyāya inference (*anumāna*), the cognitive movement is linear and rule-based. You see smoke on the hill. You recall the universal rule: "Wherever there is smoke, there is fire." You conclude: "There is fire on the hill." The *vyāpti* (the link between smoke and fire) is known *prior* to the specific observation. The specific case is merely a locus for applying a known law.

  In the *arthāpatti* case (Devadatta is fat but does not eat by day), the reductionist claims we are simply inferring eating from fatness. But the proponent of irreducibility points out a structural mismatch:
  1.  **The Trigger is Contradiction, Not Observation:** In inference, we observe a *hetu* (smoke) and seek a *sādhya* (fire). In *arthāpatti*, we observe two facts that are mutually inexplicable (*viruddha*): "Devadatta is fat" and "Devadatta does not eat by day." These two facts create an epistemic tension. We do not move from A to B; we move from "A and not-B are incompatible" to "C must be true to resolve the tension."
  2.  **The *Vyāpti* is Not Pre-Established:** This is your crux. Do we actually possess the universal rule "All fat people who do not eat by day eat by night" prior to this moment? No. That rule is too specific. Do we possess "Fatness implies caloric intake"? Yes, but that alone doesn't get us to *night* eating. The specific conclusion (eating *at night*) is generated *by the specific constraints of the case*, not by a pre-existing universal.
  3.  **Necessity of Coherence:** Inference relies on causal or identity relations. *Arthāpatti* relies on the principle of non-contradiction. We postulate the night-eating not because we have seen a universal link between fatness and night-eating, but because *without* that postulation, the known facts become impossible.

  The irreducibility claim argues that *anumāna* is about extending knowledge via a known bridge, whereas *arthāpatti* is about *building* the bridge to save the coherence of existing knowledge. If Nyāya insists that *anumāna* requires a *vyāpti* known independently, then *arthāpatti* cannot be *anumāna*, because the "rule" here is discovered *through* the postulation, not before it.

  ### The Reductionist Pushback: Reconstructing the Inference

  The reductionist counter-argument, which aligns with your intuition, attacks the "pre-established *vyāpti*" requirement as artificially rigid. It argues that the Mīmāṃsaka (proponent of *arthāpatti*) is creating a straw man of inference.

  1.  **The Implicit *Vyāpti*:** We do not need the specific rule "Fat non-day-eaters eat at night." We only need the biological universal: "Life and fatness require sustenance." This *is* a pre-established *vyāpti*. We know independently that a living, fat human cannot survive without food.
  2.  **Negative Inference (*Vyatireki*):** The inference can be reconstructed formally:
      *   *Major Premise:* If a person does not eat at all (day or night), they cannot be fat (or alive).
      *   *Minor Premise:* Devadatta is fat (and alive).
      *   *Observation:* Devadatta does not eat by day.
      *   *Conclusion:* Therefore, Devadatta must eat by night.
      This is a valid *anumāna*. It uses a known universal (biological necessity) and applies it to a specific case where one variable (day eating) is negated.
  3.  **Abduction is Inference:** Your point about "best explanation" is crucial. Modern logic classifies this as abduction. But classical Nyāya, especially in its later (Navya-Nyāya) developments, absorbed abduction into inference. The fact that the specific *time* (night) is determined "on the spot" does not make it a new *pramāṇa*; it just means the inference has a negative component (*vyatireki*). The "on the spot" element is simply the elimination of alternatives, which is a standard logical operation within inference.

  The reductionist argues that positing a separate *pramāṇa* for every distinct *flavor* of reasoning violates Ockham's Razor. If the machinery of inference (major premise, minor premise, conclusion) can model the process, multiplying entities is unjustified. The "feeling" of resolving an anomaly is psychological, not epistemic.

  ### The Verdict: Arthāpatti is Reducible

  Here is the settlement: **The reductionists are correct.** *Arthāpatti* is not an independent *pramāṇa*; it is a complex form of *anumāna*.

  The defense of irreducibility rests on a fetishization of the *vyāpti*. It assumes that for a rule to count as a *vyāpti*, it must be explicitly articulated and specific to the conclusion. But epistemology deals with the *source* of validity, not the explicit articulation of the premise.

  The validity of the conclusion "Devadatta eats at night" rests entirely on the necessary connection between "fatness/life" and "sustenance." That connection *is* the *vyāpti*. It is known independently (through general experience of biology). The fact that we have to rule out "day eating" to isolate "night eating" is simply the application of that *vyāpti* under conditions of exclusion.

  The "anomaly" (fatness vs. no day-eating) feels distinct from standard inference because it is *problem-driven* rather than *data-driven*. In standard inference, we see smoke and look for fire. In *arthāpatti*, we see a puzzle and look for a fact. But logically, the puzzle *is* the *hetu*. The "fact that Devadatta is fat but doesn't eat by day" functions as the reason. The "universal" is "Fatness implies intake." The conclusion is "Intake occurs at night."

  The Nyāya demand for a pre-established *vyāpti* is satisfied by the biological necessity of food. The claim that the rule is built "on the spot" is false; the *application* is on the spot, but the *rule* (food is necessary for fatness) is prior. Therefore, the cognitive event does not require a new epistemic instrument. It is inference operating under conditions of exclusion (*anyāpoha*). To call it independent is to confuse the *context* of discovery with the *logic* of justification.

  ### A Note on Upamāna (Comparison)

  Does this verdict carry over to *upamāna* (comparison), such as learning the meaning of the word "gavaya" (wild cow) by being told "it is like a cow" and then seeing one in the forest?

  The case for *upamāna* being independent is **stronger** than for *arthāpatti*, though still reducible with effort.

  In *arthāpatti*, we are establishing a fact about the world (Devadatta eats). In *upamāna*, we are establishing a *semantic link* between a word and an object. Reductionists argue this is just inference + memory + perception. However, the unique cognitive output of *upamāna* is *name-object correspondence* based on similarity, which is not strictly a truth-value claim (like inference) nor a direct sensing (like perception).

  While *arthāpatti* collapses because its logical structure is identical to negative inference, *upamāna* resists reduction because it bridges the gap between *language* and *perception* in a way inference does not. Inference tells you "This is a cow." *Upamāna* tells you "This is what the word 'gavaya' refers to." While a sophisticated Nyāya logician can reduce this to a complex inference about naming conventions, the phenomenological gap is wider here than in the case of postulation. If *arthāpatti* falls, *upamāna* remains the last stronghold of the pluralists, but only because it deals with semantics rather than ontology.

  **Final Word:** You were right to trust your reductionist instinct regarding *arthāpatti*. The Nyāya defense of its independence relies on treating the *context* of the reasoning (resolving a puzzle) as if it were the *mechanism* of the reasoning. Once you identify the underlying biological *vyāpti*, the "presumption" dissolves into inference.
