answer: |-
  This framing is not confused, and the task is possible. It is a sharp, constructivist reading of urban policy that cuts through the usual materialist debates. Here is the argument built from the ground up, followed by the specific point where the logic is most vulnerable.

  ### The Argument

  **1. Zoning as Performative, Not Constative**
  Start with the distinction between constative and performative language. A constative statement describes a pre-existing reality (e.g., "This building is three stories tall"). A performative utterance creates reality through the act of speaking (e.g., "I sentence you to prison").

  NIMBYism relies on the pretense that zoning is constative. When a board denies a variance, the justification is usually that a project "does not fit the neighborhood character." This implies "character" is an objective, measurable fact existing independently of the regulation, like soil composition or flood risk.

  This is false. "Neighborhood character" is not found; it is made. When a zoning board grants or denies a variance, they are not measuring against a static reality. They are issuing a constitutive rule. By denying a duplex because it "changes the character," the board is not protecting something that was there; they are actively defining what "here" is by excluding what could be. The variance is an illocutionary act that brings the "single-family nature" of the block into legal existence at the exact moment it denies the alternative.

  **2. The Retroactive Trick**
  The contradiction lies in the timing. Urban spaces are fluid; people move, buildings age, uses shift. "Character" is a snapshot. When NIMBYs invoke character to block development, they are taking a performative outcome (the current zoning status) and treating it as a historical cause.

  They argue: "We must block this building to preserve the character."
  The reality is: "The character is only what we say it is because we blocked the building."

  This is a retroactive performance. The zoning decision creates the boundary of the community, but the rhetoric claims the community created the boundary. NIMBY groups defend the result (exclusion) as if it were an independent descriptive fact ("This is a single-family neighborhood"), when it is actually the dependent variable of the speech act they are currently performing. They are using the rule to prove the necessity of the rule. This is a performative contradiction: they claim to be servants of a pre-existing order, but they are the authors of that order.

  **3. The Harm is Subjection to the Utterance**
  If zoning variances are constitutive utterances that manufacture exclusion under the guise of description, then the primary violence is not just the lack of housing units (though that is the material result). The primary ethical violation is the subjection of residents and potential residents to this arbitrary linguistic power.

  When a city tells a developer or a home seeker, "You cannot be here because you do not fit the character," it is subjecting them to a definition they had no hand in writing, based on a "fact" that does not exist outside that definition. It is a form of political silencing. The state is using language to constitute a reality in which certain people are illegitimate.

  **4. Reframing the Right to the City**
  Henri Lefebvre's "Right to the City" is often read as a positive right: the right to access, to participate, to occupy. This is too weak against the zoning argument above. If the city is defined by these exclusionary speech acts, "access" is just permission to enter a cage others have built.

  Instead, the Right to the City must be read as a negative right: **the right not to be subjected to retroactive constitutive utterances regarding one's presence.**

  This is not a right to be housed (positive); it is a right not to be defined out of existence by a bureaucratic speech act masquerading as description. It is an immunity against the state's power to freeze time and space through language. If a zoning board cannot claim "character" as a pre-existing fact, they lose the moral authority to deny housing based on it. The right to the city becomes the right to demand that the rules of inclusion are not hidden inside the definition of the place itself. It shifts the burden: you cannot exclude me by defining me as "out of character," because "character" is not a valid ground for exclusion if it is only created by the exclusion itself.

  ### Where I Am Least Sure

  The weakest link in this argument is the transition from **speech act theory** to **coercive state power**.

  Austin and Searle developed speech act theory around social conventions (marriage, betting, promising) where the "force" of the utterance relies on mutual recognition. Zoning is different. A zoning board does not need your recognition for their utterance to work; they have police power. If they say "Demolish this," it happens regardless of the linguistic validity.

  By framing zoning primarily as an *utterance*, there is a risk of obscuring the material violence behind it. A gun is not a speech act, even if someone says "Stop" before shooting. If the "Right to the City" is framed only as a negative right against these *utterances*, it might fail to address the physical enforcement (evictions, fines, police removal) that follows. The argument risks becoming too linguistic, potentially ignoring that the "utterance" is backed by the state's monopoly on violence. The "negative right" needs to be robust enough to stop the police, not just the planning commission's minutes. I am unsure if a rights framework based on "illocutionary immunity" holds up in court or political struggle against raw force.
