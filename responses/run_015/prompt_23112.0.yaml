answer: |-
  You are not missing something obvious—this is one of the most notoriously confusing areas of population ethics. The terminology isn't perfectly standardized, which adds to the frustration.

  However, the distinction you are asking about usually comes down to **how low the quality of life is allowed to drop** in the larger population.

  Here is the breakdown of the difference between the "Moderate" and "Extreme" (or "Very") versions, and why the **Mere Addition Argument** is thought to support one but not necessarily the other.

  ### 1. The Two Versions

  **The "Moderate" Conclusion (The Trade-Off)**
  *   **Scenario:** Compare Population A (1 billion people with *excellent* lives) to Population B (2 billion people with *very good* lives).
  *   **Claim:** Population B is better than Population A.
  *   **Intuition:** Most people actually accept this. It seems plausible that if we can have twice as many people living *very good* lives, that is better than having fewer people living *excellent* lives, even if the average happiness drops slightly. This acknowledges that **quantity has some value**, not just quality.

  **The "Extreme" (Standard) Repugnant Conclusion**
  *   **Scenario:** Compare Population A (1 billion people with *excellent* lives) to Population Z (trillions of people with lives *barely worth living*).
  *   **Claim:** Population Z is better than Population A.
  *   **Intuition:** Almost everyone rejects this. "Barely worth living" usually means a life with just enough pleasure to make it not better to be dead (e.g., eating potatoes and listening to Muzak for 80 years). The idea that enough of these lives outweigh a world of flourishing artists, lovers, and scientists feels "repugnant."

  **The Difference:** The Moderate version claims quantity can outweigh quality **within the range of good lives.** The Extreme version claims quantity can outweigh quality **even when quality hits the floor.**

  ### 2. The Mere Addition Argument

  To understand why some philosophers think the argument only gets you to the Moderate version, we have to look at Derek Parfit's **Mere Addition Argument**.

  Parfit tried to show that if you accept a few simple steps, you are logically forced to accept the Extreme Repugnant Conclusion. The sequence looks like this:

  1.  **Start at A:** 1 billion very happy people.
  2.  **Move to A+:** Add another 1 billion happy people. They have slightly fewer resources, so they are slightly less happy than Group A, but their lives are still **very good**.
      *   *Premise:* Adding these happy people cannot make the world *worse*. (This is "Mere Addition").
  3.  **Move to B:** Redistribute resources so everyone is equal. The original A people are slightly less happy, but the new people are happier. The total happiness is higher.
      *   *Premise:* B is better than A+ (due to equality and total utility).
  4.  **Conclusion:** Therefore, B is better than A.

  Parfit argues you can repeat this slide (A → B → C → D...) all the way down to Z. Since B is better than A, and C is better than B, eventually Z must be better than A.

  ### 3. Why Critics Say It Stops at "Moderate"

  You asked: *"Why do some people think the mere addition argument only gets you to that one [Moderate] and not the extreme version?"*

  The objection lies in **Step 2 (The Premise of Mere Addition).**

  The premise states: *"Adding people with lives worth living does not make the outcome worse."*

  Critics argue this premise is true **only if the lives added are sufficiently good.**
  *   **In the Moderate Zone (A to B):** The added people have *very good* lives. Most agree that adding people with very good lives is a neutral or positive act. Therefore, the logic holds, and we accept that B is better than A.
  *   **In the Extreme Zone (Y to Z):** As we slide down the alphabet, the quality of life drops. Eventually, we are adding people whose lives are *barely* worth living.
      *   Critics argue that adding a person whose life is *barely* worth living **does** make the world worse (or at least, not better) if it dilutes the resources of those living excellent lives.
      *   This view is often called **Critical-Level Utilitarianism**. It suggests there is a "critical level" of welfare (e.g., a "good" life). Adding people above this level adds value. Adding people below this level (even if their lives are technically positive/barely worth living) adds *negative* value or zero value.

  **The Logical Break:**
  If you hold the Critical-Level view, the chain of logic snaps before it hits Z.
  *   A → B → C... → M (Moderate): The added lives are above the critical level. Mere Addition holds.
  *   M → N → ... → Z (Extreme): The added lives fall *below* the critical level. Mere Addition **fails**.

  Therefore, the Mere Addition argument successfully proves that a larger population with *good* lives is better than a smaller one with *excellent* lives (Moderate). But it fails to prove that a larger population with *miserable* lives is better (Extreme), because the premise "adding them doesn't make it worse" is no longer true at that low level of quality.

  ### 4. Summary of the Confusion

  The confusion often stems from the fact that Parfit intended the Mere Addition Argument to force us to accept the **Extreme** conclusion. He wanted to show that Total Utilitarianism leads to the Repugnant Conclusion.

  However, opponents argue that the argument relies on a **Sorites Paradox** (the paradox of the heap).
  *   Is one grain of sand a heap? No.
  *   If you add one grain, is it a heap? No.
  *   ...
  *   Is a million grains a heap? Yes.

  Similarly:
  *   Does lowering quality slightly make the population worse? No.
  *   Does lowering it slightly again make it worse? No.
  *   ...
  *   Does lowering it to "barely worth living" make it worse? **Yes.**

  So, when you read that the argument "only gets you to the moderate version," it means: **The logic of adding people works fine as long as the new people have decent lives. It breaks down when the new people have lives so low that their addition feels like a burden on the world rather than a benefit.**

  ### A Note on Terminology
  Just to cover all bases: In some specific academic papers (like those by Gustaf Arrhenius), the terminology can be slightly different:
  *   **Repugnant Conclusion:** Z (barely worth living) > A (excellent).
  *   **Very Repugnant Conclusion:** Z (lives of *suffering*/negative welfare) > A (excellent).

  If you are reading about the "Very Repugnant Conclusion" in that specific context, it refers to the claim that a world of suffering could be better than a world of happiness if the population is large enough. This is generally considered even worse than the standard Repugnant Conclusion. However, based on your description, you are likely dealing with the **Moderate (Good Lives) vs. Extreme (Barely Worth Living)** distinction explained above.
