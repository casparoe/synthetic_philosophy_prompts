answer: |-
  This is a splendid angle. It leverages your specific expertise (model fitting, parameter counting) to illuminate a historical episode that usually gets hand-waved. Your crystallographer's intuition about degrees of freedom is doing heavy lifting here, and it works.

  Here are my comments on your specific queries, with confidence levels attached as requested.

  **1. Historical Claims: Wrong or Shaky?**
  Your historical grounding is surprisingly solid for a non-specialist.
  *   **Claim 1 (Geometry/Aspects):** **Sure.** Kepler's *Harmonices Mundi* (1619) is exactly where he grounds aspects in the inscribable polygons. He explicitly rejects the Arabic points and many traditional lots as lacking geometric necessity.
  *   **Claim 2 (Error Theory):** **Sure.** Kepler's *De Fundamentis Astrologiae Certioribus* (1601) is essentially a methodological critique of the "old school." He attacks the lack of physical cause and the promiscuous use of interpretive rules.
  *   **Claim 3 (Causal Story):** **Fairly confident.** You are right that he moves away from "occult effluvia" toward a physics of light and geometry acting on the "faculty of the soul" (both the Earth's soul and the human soul). However, be careful not to make him sound *too* modern. He still believes the Earth has an animating soul that reacts to the geometry. It's physical, but not mechanistic in the Newtonian sense.
  *   **Claim 4 (The Twist):** **Fairly confident.** The claim that reform made it mortal is historically plausible. The specific Keplerian astrology didn't survive; the vague, traditional kind did (in the popular imagination).
  *   **Claim 5 (Weak Spots/Horoscopes):** **Sure.** He cast horoscopes for Wallenstein late in life. He needed the income, but he also genuinely believed the *potential* was there if the theory were corrected.

  **2. Is the Twist a Banality?**
  It is not a banality, provided you frame it correctly. The banality is "falsifiable theories die." Your point is sharper: "In a low-signal environment, high-specificity models die, while low-specificity models persist as zombies."
  *   **Comment:** This is a genuine insight. Traditional astrology is a "degenerate research programme" (in Lakatos's terms) that survives by shifting the protective belt. Kepler tried to harden the core. Because the signal (celestial influence on weather/human affairs) was effectively noise, the hardened core broke. The vague version survived *because* it couldn't be broken. That is a non-trivial application of your field's logic to history.

  **3. Defending Kepler's Astrology (Attacking Your Premises)**
  If I were defending Kepler's astrology on its best day, I would attack your premise that **closure equals testability.**
  *   **The Attack:** Kepler didn't close the hypothesis space to *test* it; he closed it because he was convinced *a priori* that nature *must* obey musical geometry. He wasn't saying, "Let's see if the quintile works." He was saying, "The quintile *must* work because it is a major third, and God is a geometer."
  *   **Why this matters:** For a crystallographer, a model with fixed parameters is a tool for finding truth. For Kepler, the geometric constraints *were* the truth, independent of the data. If the data didn't fit, the data (or the traditional interpretation of the event) was wrong, not the geometry.
  *   **Strengthening the Defense:** You could argue that Kepler's "closure" was actually a form of dogmatism disguised as rigor. He reduced the degrees of freedom not to invite falsification, but to enforce elegance. This supports your club member's objection (defensive rhetorical narrowing) but adds a layer: it was defensive *against the chaos of experience*, not just against critics.

  **4. Where is the Argument Weakest?**
  Your suspicion is correct. **Sure.**
  *   **The Weak Link:** The step from "closed hypothesis space" to "must-eventually-lose" requires the premise that **the effect size is smaller than the noise.**
  *   **Elaboration:** If celestial bodies *actually* exerted a strong, geometric force on weather or human temperament, Kepler's model would have won. It would have been the Newton of social physics. The model died not because it was testable, but because it was testable *and wrong* (or right about a phenomenon that didn't exist). You need to make sure your readers understand that the "mortality" comes from the *failure* of the test, not the *possibility* of the test. Your analogy of the diffractometer is perfect here: a calibrated instrument kills a bad model, but only if the sample doesn't actually diffract the way the model predicts.

  **5. The "Foolish Daughter" Quote**
  *   **Verdict:** **Supports your reading.** **Sure.**
  *   **Why:** "Astronomy is the wise mother, Astrology is the foolish daughter." This implies a hierarchy of truth. Astronomy (the motion of bodies) is certain; Astrology (the influence of bodies) is speculative. By calling her foolish, he admits she is prone to error. By saying she must feed the mother, he admits she is the source of funding (and perhaps data). It underscores your point that he saw astrology as a distinct, lesser, and more precarious enterprise than astronomy, one that required the rigor of the mother to survive, but ultimately couldn't meet it.

  **6. HPS Terminology**
  You are reinventing **"Degrees of Freedom"** (which you already know from your field) but in HPS this is often discussed under **"Ad hoc Hypotheses"** or the **"Protective Belt"** (Imre Lakatos).
  *   **Specific Term:** What you are describing regarding traditional astrology is often called the **"Conventionalist Stratagem"** (Poincaré/Duhem): making a theory immune to refutation by adding auxiliary assumptions. Kepler tried to strip the auxiliary assumptions away.
  *   **Recommendation:** Stick to your crystallography terms ("parameters," "fit," "noise"). They are clearer for your audience than Lakatosian jargon.

  **7. Least Sure Point**
  I am **guessing** on the extent to which Kepler **empirically tested** the new aspects against historical weather/event data versus simply **deriving** them.
  *   **Detail:** I know he collected data (the *Rudolphine Tables* context), but I am not certain if he ever published a statistical breakdown showing "Quintiles correlate with rain at X% vs. 100 degrees at Y%." He often argued from *cause* (geometry) to *effect*, rather than *effect* to *cause*. If he didn't actually run the numbers, your "testability" claim is slightly anachronistic—he made it *in principle* testable, but he may not have treated it as *empirically* contingent in the way a modern scientist would.
  *   **Advice:** Phrase it as "He made the theory *capable* of being wrong," rather than "He went out and proved it wrong."

  **Summary Advice for the Newsletter Piece**
  Your club member's objection (defensive narrowing) is valid but doesn't kill your thesis. You can concede it: "Yes, he narrowed his claims to defend them, but by narrowing them he exposed them to the very data that eventually sank them." That synthesizes the two views.

  Keep the crystallography analogies. They are the unique value add of this piece. The image of traditional astrology as a model with 40 fitted parameters that wobbles but never breaks, versus Kepler's 4-parameter model that snaps under load, is excellent.

  Good luck with the piece. It sounds like a worthy read for the club.
