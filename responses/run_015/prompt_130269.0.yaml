      *   *Refined Verdict:* Deniz is more consistent with the *letter* of Putnam/Kripke, but Rowan exposes the *spirit* of the problem (the instability of reference over time). I'll give the edge to Deniz for coherence, but note that Rowan's objection is the one that keeps philosophers awake.

  5.  **Address "What They Are Missing":**
