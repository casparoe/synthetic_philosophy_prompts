answer: |-
  This is a fantastic thought experiment. You and your group have essentially reinvented a variation on what philosophers call the **"Slow Switch"** argument (famously discussed by Tyler Burge, Jessica Brown, and others in the 90s and 00s). It is designed specifically to stress-test the causal-historical theory of reference that Putnam and Kripke introduced.

  The reason Rowan and Deniz got stuck is that they are pulling on two different threads of externalism: **Causal Contact** (Rowan) vs. **Causal History** (Deniz).

  Here is the breakdown of their six moves, the verdict, and an analysis of your immortal speaker worry.

  ### Part 1: The Move-by-Move Breakdown

  **(1) Rowan: XYZ (Current Environment)**
  *   **Verdict:** **Mostly Wrong.**
  *   **Why:** Rowan is interpreting externalism as "reference is fixed by whatever you are currently touching." While this is true for some versions of causal-covariation theories, it contradicts the specific Putnam/Kripke model the group started with. In the standard view, reference is fixed by an initial baptism and transmitted via a historical chain. If I use the word "Aristotle," I refer to the ancient Greek, not the guy currently living in my house whom I call Aristotle. Rowan ignores the *transmission* mechanism. If reference reset every generation based solely on current contact, we couldn't talk about extinct things (like "dinosaur") or distant things (like "Alpha Centauri") reliably.

  **(2) Deniz: H2O (Historical Chain)**
  *   **Verdict:** **Mostly Right.**
  *   **Why:** This is the standard Kripkean line. The reference is anchored in the original baptism (1900, H2O) and passed down like a bucket brigade. As long as each generation intends to use the word with the *same reference* as the previous one, the reference holds, even if their descriptive beliefs about the stuff change. This preserves the stability of language over time. It aligns best with the "Meaning Ain't in the Head" slogan because it prioritizes the historical causal link over current internal states.

  **(3) Rowan: The Error Objection (Wholesale Falsehood)**
  *   **Verdict:** **Right (about the consequence), Wrong (about the cost).**
  *   **Why:** Rowan is correct that on Deniz's view, the 2200s community is systematically false when they say "This is water." However, he is wrong to think this defeats externalism. Externalism *always* allows for wholesale error (e.g., people in 1700 could refer to "gold" even if they thought it was a compound of mercury and sulfur). The cost isn't fatal *unless* the error becomes so radical that it breaks the interpretive charity we owe speakers. Rowan senses a breaking point, but he hasn't proven it yet.

  **(4) Deniz: Error is a Feature, Not a Bug**
  *   **Verdict:** **Mostly Right.**
  *   **Why:** She is philosophically consistent here. Reference is not truth. You can refer to a substance while being completely wrong about its properties. Her point stands: being wrong about the microstructure doesn't mean you aren't talking about the stuff. However, she is underestimating the *degree* of error. Being wrong about the atomic weight of gold is one thing; being wrong about the actual substance in your glass (when it has literally changed) is another. She treats all error as equal, which is risky.

  **(5) Rowan: The Middle Point (50/50 Mix)**
  *   **Verdict:** **Right.**
  *   **Why:** This is the strongest move in the debate. It exposes the **Sorites Paradox** hidden in the causal-historical theory. If reference depends on microstructure (H2O), at what exact percentage of replacement does the word "water" stop referring to H2O and start referring to XYZ (or nothing)? Nature might not be vague, but *reference* is a semantic relation established by humans, and human practices are vague. Deniz's theory demands a sharp boundary where there intuitively isn't one. This is a genuine problem for the "microstructure fixes reference" view.

  **(6) Deniz: Vagueness is Rowan's Problem + Speaker Intention**
  *   **Verdict:** **Wrong (on vagueness), Mixed (on intention).**
  *   **Why:** First, her claim that "nature isn't vague so reference shouldn't be" is a category error. Electrons aren't vague, but the word "heap" is. Semantic reference can be vague even if natural kinds are precise. Second, by appealing to "same-stuff intention," she risks collapsing back into internalism. If the "intention" to refer to the same stuff is what does the work, then meaning *is* partly in the head (the intention), which undermines the Putnamian setup they agreed on at the start. She is trying to have her externalist cake and eat it with an internalist spoon.

  ---

  ### Part 2: The Verdict

  **Who is more right?**
  **Deniz wins on orthodoxy, but Rowan wins on metaphysics.**

  If you are grading a final exam on Kripke/Putnam 101, **Deniz** gets the A. Her view preserves the stability of language and aligns with the standard Causal-Historical model. She correctly identifies that reference is inherited, not re-earned.

  However, **Rowan** has identified the crack in the foundation that keeps philosophers of language awake at night. The "Drift Scenario" shows that the Causal-Historical theory cannot easily handle *gradual* replacement without either accepting massive systematic falsehood (Deniz) or arbitrary cutoff points (Rowan's critique of Deniz).

  If forced to choose who is "more right" about how language *actually* works in this scenario: **Rowan.** In a slow-switch case, most contemporary philosophers lean toward the idea that reference becomes **indeterminate** in the middle phases, or that it eventually shifts to XYZ due to the dominance of current causal interaction. Deniz's view requires a kind of semantic magic where the word "water" clings to H2O even after H2O has vanished from the universe entirely. That seems less plausible than the idea that language evolves with the environment.

  ---

  ### Part 3: What They Are Both Missing

  Both Rowan and Deniz are assuming there must be a **determinate fact of the matter** (either it's H2O or it's XYZ). They are missing three crucial possibilities:

  1.  **Semantic Indeterminacy:** The most likely philosophical answer is that during the drift period (especially the 50/50 mix), the word "water" simply **has no fixed reference.** It is semantically indeterminate. It's not that we don't *know* which it is; it's that there *is* no fact of the matter until the community settles into a new stable practice. This dissolves Rowan's "cutoff point" worry (there is no cutoff, just a fuzzy zone) and mitigates Deniz's "wholesale error" (they aren't false, they're speaking a language that hasn't fully decided yet).
  2.  **The Principle of Charity:** Both are ignoring the pragmatic function of language. If we interpret the 2200 speakers as referring to H2O, we make them massively deluded. If we interpret them as referring to XYZ, we make them correct. Donald Davidson and others argue we should maximize agreement. A theory of reference that makes an entire community systematically hallucinate the contents of their taps is a bad theory. Reference is partly constituted by what allows communication to succeed.
  3.  **Two-Factor Semantics:** They are treating "water" as having only one semantic component (the external stuff). Many philosophers argue natural kind terms have two components: a **narrow** component (the phenomenal experience, the "watery" stuff) and a **wide** component (the microstructure). In the Drift Scenario, the narrow component stays constant while the wide component drifts. This explains why everyone feels they are talking about the same thing (narrow) even if the extension changes (wide).

  ---

  ### Part 4: The Immortal Speaker Variant

  This is the nail in the coffin for Deniz's specific version of the argument, and it addresses your nagging feeling about "fact of the matter."

  **The Setup:** One immortal speaker, 1900–2200. No community, no chain of transmission. Just one idiolect.
  **The Question:** When she says "water" in 2200, does she mean H2O or XYZ?

  **Analysis:**
  1.  **If she means H2O:** Then her reference is fixed entirely by the past (1900 baptism). This supports Deniz. But it implies that for 100 years, she has been pointing at XYZ and falsely believing it is H2O, without any change in her brain or her causal interaction. This makes reference seem spooky and disconnected from current reality.
  2.  **If she means XYZ:** Then her reference is fixed by her *current* causal environment. This supports Rowan. But it implies that her reference shifted gradually without her noticing. This suggests that reference is not fixed by "intention" but by causal covariance with the environment.
  3.  **The Implication:** The Immortal Speaker case suggests that **reference is partly a function of time and current causal relations, not just history.**

  **Does this change the answer?**
  Yes. In the community case (Deniz's strength), the social chain can sustain reference to H2O even if the stuff changes (via textbooks, stories, etc.). In the Immortal case, there is no social buffer. The direct causal link to the environment is all that remains.

  Most philosophers (following Burge's "Slow Switch" arguments) argue that in the Immortal case, **the reference *does* shift**, or becomes indeterminate. If the speaker's causal interaction is exclusively with XYZ for the last 50 years, her concept of "water" has likely become a concept of XYZ, even if she remembers the past.

  **What this tells us about Individual vs. Community:**
  It tells us that **Social Externalism** (Deniz) and **Individual Externalism** (Rowan) can yield different results.
  *   **Community:** Can preserve reference through social practices even if the environment changes (Deniz wins).
  *   **Individual:** Reference tracks current causal environment more closely (Rowan wins).

  **Is there a fact of the matter?**
  In the Immortal case, there is likely **no sharp fact of the matter** about *when* the shift occurred. This confirms your suspicion: the case dissolves into separate questions depending on what you want reference to do.
  *   If reference is about **tracking truth**, it shifts to XYZ (Rowan).
  *   If reference is about **preserving historical commitment**, it stays H2O (Deniz).
  *   If reference is about **explaining cognitive continuity**, it's indeterminate (The Missing Piece).

  ### Summary for the Brewery Group
  Tell Rowan and Deniz to stop trying to force a binary choice. The Drift Scenario doesn't prove one of them is right and the other wrong; it proves that **reference is vague.**

  *   **Deniz** is right that we *try* to preserve historical reference.
  *   **Rowan** is right that the environment eventually wins.
  *   **The Truth:** In the middle years, the word "water" is semantically unstable. It's not a bug in their reasoning; it's a feature of how language rides the line between our history and our world.

  And regarding the Immortal Speaker: Tell them that if one person lives through it, reference shifts faster than if a community does. That proves that **language is a social technology designed to resist environmental drift.** Deniz's view works for communities; Rowan's view works for individuals. The tension between them is exactly what makes language robust.
