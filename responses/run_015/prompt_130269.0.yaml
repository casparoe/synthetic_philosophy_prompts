          *   *Critique:* But Putnam/Kripke emphasize the *history* of the term. If I say "Einstein," I refer to the historical figure, not whoever is currently occupying the "Einstein" causal slot (if that made sense). For natural kinds, the initial baptism matters. Rowan is oversimplifying externalism as "whatever is here now."
          *   *Verdict:* Mostly Wrong (or at least an oversimplification of standard externalism).

