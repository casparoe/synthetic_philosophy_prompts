  # Q&A Prep Sheet: The Probabilistic Veto

  ### 1. The Mechanism Objection (Cognitive Neuroscientist)
  **Objection:** "Your model posits stochastic resonance—utilizing noise to enhance signal detection—yet my work in predictive processing suggests the brain minimizes uncertainty through precision weighting, not noise amplification. Aren't these fundamentally contradictory architectures? If the brain is a prediction-error minimizer, why would it rely on a stochastic filter for voluntary action?"
  **Reply:** They are complementary, not contradictory. Predictive processing describes the hierarchical flow of expectations; stochastic resonance describes the threshold mechanism at the motor interface. Precision weighting adjusts the gain on prediction errors, but the final transition from potential to kinetic action requires crossing a activation threshold. In a noisy neural system, conscious attention modulates this noise to facilitate threshold crossing without determining the specific output. Think of precision weighting as the volume knob and stochastic resonance as the amplifier's tolerance for static; both are needed for the signal to emerge.
  **Softest Point:** The integration of SR into standard PP hierarchical models is currently speculative and lacks a unified mathematical framework.

  ### 2. The Sourcehood Objection (Libertarian Philosopher)
  **Objection:** "Even if consciousness modulates the probability landscape, you concede the landscape itself is generated by pre-conscious neural dynamics. If the agent does not originate the distribution of options, merely filtering them, how is this anything but a sophisticated epiphenomenalism? Where is the ultimate sourcehood required for moral responsibility?"
  **Reply:** I argue we must abandon 'ultimate sourcehood' as a coherent requirement for responsibility. It demands an uncaused cause, which is metaphysically unintelligible. Responsibility should be grounded in *functional control*—the demonstrable capacity to modulate outcomes based on reasons. If an agent can shift the probability of a harmful action from 90% to 10% via conscious attention, that modulation is the locus of responsibility, not the genesis of the options.
  **Softest Point:** This reply concedes the libertarian's main intuition—that modulation feels less free than initiation—and relies on changing the definition of responsibility rather than satisfying their metaphysical criterion.

  ### 3. The Control Objection (Compatibilist Philosopher)
  **Objection:** "You cite Frankfurt and O'Connor. But if the 'probabilistic veto' is itself a neural process subject to prior causes, is it truly reasons-responsive? If the filter's settings are determined by prior states, doesn't this collapse into hard determinism disguised as probability? How do you guarantee guidance control?"
  **Reply:** Guidance control does not require the absence of prior causes; it requires the right kind of causal chain. My model posits that conscious awareness integrates sensory and mnemonic data (reasons) to shift the probability landscape. As long as the modulation mechanism is sensitive to the agent's reasons—rather than being coerced or pathological—it satisfies compatibilist conditions for control. The probabilistic nature simply acknowledges neural variability, not a lack of rational integration.
  **Softest Point:** Distinguishing neural signals that constitute "reasons" from those that are mere "causes" within the RP amplitude is empirically unresolved.

  ### 4. The Evidentiary Objection (Graduate Student in Jurisprudence)
  **Objection:** "In criminal law, we assess *mens rea* based on behavior and testimony. If responsibility rests on a 'capacity for modulation' of neural noise, how do we prove this capacity ex post facto? Are we to excuse impulsive criminals by claiming their noise parameters were unfavorable?"
  **Reply:** We do not measure neural noise in court, just as we do not measure hepatocyte function to determine intoxication. We use behavioral proxies. A history of impulse control, planning, and responsiveness to sanctions indicates a functional modulation capacity. The neural model explains *why* these behavioral proxies matter—they reflect the integrity of the probabilistic veto—not that we need EEG evidence for every verdict.
  **Softest Point:** There is a significant gap between the theoretical neural capacity and the coarse-grained behavioral evidence admissible in legal settings.

  ### 5. The Reductionism Objection (Historian of Science)
  **Objection:** "You are mapping a moral concept onto EEG amplitude and noise parameters. Historically, such neuro-reductionism—from phrenology to lobotomy—fails because it ignores the social and historical context of agency. Aren't you committing a category error by locating responsibility in stochastic resonance?"
  **Reply:** I am not locating responsibility *in* the resonance, but locating the *capacity* for responsibility in the biological substrate that makes agency possible. Moral concepts supervene on physical functions. Ignoring the neural mechanism doesn't protect the category of agency; it leaves it mystified. We can acknowledge the social context of responsibility while admitting its biological preconditions are stochastic.
  **Softest Point:** The risk of conflating the *conditions* for agency with the *definition* of agency remains high and historically fraught.

  ### 6. The Empirical Gap Objection (Cognitive Neuroscientist)
  **Objection:** "You conceded upfront: there is no direct empirical measurement of noise-parameter shifts in human RP amplitude during conscious attention. Without this data, isn't 'probabilistic veto' just a metaphor rather than a mechanism? Why should we treat this as science rather than philosophy?"
  **Reply:** It is a working hypothesis designed to save the phenomena of voluntary action from epiphenomenalism. The Libet data shows readiness potentials before awareness; my model offers a mechanistic explanation that preserves a role for consciousness. While direct measurement is lacking, the model is consistent with known neural variability and reaction time distributions. It is a proposal for where to look, not a claim of finished discovery.
  **Softest Point:** This is the most vulnerable reply; it admits the core empirical claim is currently unverified, relying on analogical justification rather than direct evidence.

  ***

  ### The Question I Hope Nobody Raises
  **Question:** "How do you operationally define 'conscious awareness' in the 150-250ms window without relying on post-hoc report, which Libet himself showed is temporally unreliable?"
  **Deflection Strategy:** Acknowledge the methodological difficulty immediately. Pivot to clinical correlates: "We rely on convergent evidence from disorders of agency (e.g., alien hand syndrome, schizophrenia) where the sense of ownership is decoupled from movement. These clinical cases provide independent validation of the window without relying solely on subjective clock-reporting."

  ***

  ### Weakest Point to Defend Actively
  **The Empirical Gap:** You must actively defend the validity of the "stochastic resonance" analogy despite the lack of direct noise-parameter data. Do not let this remain a mere concession. Prepare to cite indirect evidence from reaction time variability studies and single-unit recording variability in primates to show the mechanism is plausible, even if not directly measured in human RP.

  Verdict: The reply to the Empirical Gap Objection is the weakest because it admits the core mechanism rests on analogical justification rather than direct measurement.
