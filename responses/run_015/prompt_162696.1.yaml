answer: |-
  **MEMORANDUM**

  **TO:** Outcomes-Analysis Unit; Procurement Appeals Board
  **FROM:** Director, Outcomes-Analysis Unit
  **DATE:** October 26, 2023
  **SUBJECT:** Procedure for Contractor Performance Adjustment and Ranking

  ### 1. Purpose and Scope
  This document establishes the mandatory procedure for adjusting contractor performance data prior to ranking. It addresses the risk that raw placement rates reflect the difficulty of the clients referred (case mix) rather than the quality of the contractor's work.

  This procedure explicitly separates two distinct questions that our current ranking conflates:
  1.  **Contractor Effectiveness:** Did the contractor do a good job with the people they accepted? (Used for bonuses/penalties).
  2.  **Agency Yield:** Did the state get good outcomes for the specific mix of people we referred? (Used for program management).

  A contractor may receive a high Effectiveness score (good work) but a low Agency Yield score (hard cases). Both numbers will be reported, but only **Contractor Effectiveness** determines tier placement and renewal.

  ### 2. The Adjustment Procedure
  Analysts must apply the following four tests in order. If a variable or stratification fails any test, it is inadmissible for adjustment.

  **Test 1: The Timing Rule (Pre-Enrollment Only)**
  *   **Check:** Is the variable recorded and fixed *before* the client signs the enrollment agreement?
  *   **Pass:** Variables like prior incarceration, education level, housing status at intake.
  *   **Fail:** Variables like workshop completion, weeks retained, job search activities, or exit reason.
  *   **Rationale:** Post-enrollment variables are influenced by the contractor's effort. Adjusting for them rewards contractors for dropping difficult clients early.
  *   **Action:** If a reversal depends on post-enrollment variables, the adjustment is rejected. The raw rate stands.

  **Test 2: The Control Rule (Agency-Assigned Only)**
  *   **Check:** Who determined the value of the variable?
  *   **Pass:** Variables assigned by Agency intake staff or verified third-party records (e.g., state unemployment records, court records).
  *   **Fail:** Variables self-reported by the client without verification, or assessed by the contractor after enrollment.
  *   **Rationale:** Contractors cannot be penalized or credited for case mix they can manipulate through intake assessment.
  *   **Action:** If the stratification relies on contractor-assessed barriers, the adjustment is rejected.

  **Test 3: The Stability Rule (Minimum Cell Size)**
  *   **Check:** Count the number of clients in each stratum (barrier category) for the specific contractor.
  *   **Pass:** Every stratum contains at least 20 clients.
  *   **Fail:** Any stratum contains fewer than 20 clients.
  *   **Rationale:** Rates calculated on fewer than 20 clients are statistically unstable. A single placement changes the rate by 5% or more, allowing noise to manufacture reversals.
  *   **Action:** If strata are too small, combine adjacent strata (e.g., merge "1 barrier" and "2 barriers"). If combining all admissible strata still results in cells <20, the adjustment is rejected. The raw rate stands.

  **Test 4: The Magnitude Rule (Meaningful Reversal)**
  *   **Check:** Compare the Raw Placement Rate to the Adjusted Placement Rate.
  *   **Pass:** The difference exceeds 5 percentage points.
  *   **Fail:** The difference is less than 5 percentage points.
  *   **Rationale:** Minor fluctuations do not justify the complexity of an appeal.
  *   **Action:** If the difference is <5%, the Raw Rate is used for ranking to maintain simplicity.

  ### 3. Weighting Standard and Authority
  The analyst's concern regarding weighting is correct: the choice of weights determines the result. To resolve this, we adopt a fixed standard.

  *   **The Standard:** **Statewide Intake Mix.**
      *   When calculating the **Contractor Effectiveness** score, subgroup rates are weighted using the proportion of clients in each barrier category across the *entire state agency*, not the contractor's own caseload.
      *   *Example:* If 10% of all state clients have prior incarceration, that stratum counts for 10% of the contractor's score, even if that contractor specializes in re-entry and has 50% such clients.
  *   **The Authority:** This standard is set by the **Director**. It is a policy decision, not a statistical one. It answers the question: "How would this contractor perform if they received the average referral?"
  *   **Analyst Role:** Analysts apply the weights. They do not propose alternative weights.

  ### 4. Limitations
  This procedure does not establish causality. It establishes comparability.
  *   **Unmeasured Barriers:** We can only adjust for barriers we measure at intake. If a contractor receives clients with unmeasured difficulties (e.g., undiagnosed disability), this procedure will not fully correct for them.
  *   **The "Hard Truth":** A contractor may fail the Timing Rule (Test 1) even if their data shows a clear explanation for poor outcomes. This is a feature, not a bug. Retention is a service.
  *   **Board Instruction:** The Procurement Board must not treat the Adjusted Rate as the "truth" and the Raw Rate as the "lie." They are answers to different questions.

  ---

  ### Application to Current Appeals

  Below is the application of the procedure to the three recurring contractor protest patterns.

  #### Case 1: The "Hardest Cases" Contractor
  *   **Pattern:** Worst overall rate, best rate within every barrier stratum. Large strata.
  *   **Test 1 (Timing):** Pass. Barrier index is computed at intake (pre-enrollment).
  *   **Test 2 (Control):** Pass. Computed by Agency intake.
  *   **Test 3 (Stability):** Pass. Strata are large.
  *   **Test 4 (Magnitude):** Pass. Reversal is clean.
  *   **Weighting:** Apply Statewide Intake Mix weights to the subgroup rates.
  *   **Outcome:** **Adjustment Approved.**
  *   **Ranking:** This contractor moves from Bottom Tier to Top Tier based on Effectiveness.
  *   **Reasoning:** The raw data penalizes them for the Agency's referral policy. The adjusted data isolates their performance.

  #### Case 2: The "Retention" Contractor
  *   **Pattern:** Worst overall rate. Deficit disappears when sorting by workshop completion or weeks stayed.
  *   **Test 1 (Timing):** **FAIL.**
      *   *Workshop completion* occurs after enrollment.
      *   *Weeks stayed* is a duration measured from enrollment to exit.
  *   **Outcome:** **Adjustment Rejected.**
  *   **Ranking:** This contractor remains in the Bottom Tier based on Raw Rate.
  *   **Reasoning:** See Section 6 below.

  #### Case 3: The "Small Rural" Contractor
  *   **Pattern:** Worst overall, best within strata, but strata contain 6–12 clients.
  *   **Test 1 (Timing):** Pass (assuming barrier index).
  *   **Test 2 (Control):** Pass.
  *   **Test 3 (Stability):** **FAIL.**
      *   Strata contain 6–12 clients. Minimum required is 20.
      *   *Attempted Remediation:* Merging strata to reach N=20 eliminates the reversal (as noted in the pattern description).
  *   **Outcome:** **Adjustment Rejected.**
  *   **Ranking:** This contractor remains in the Bottom Tier based on Raw Rate.
  *   **Reasoning:** The reversal is statistically indistinguishable from noise. We cannot risk renewal decisions on samples where two recoded files change the tier.

  ---

  ### 6. The Hard Decision: Defending Case 2

  I anticipate resistance regarding **Case 2**. The data clearly shows that if you look only at clients who finished the workshop, this contractor performs adequately. My inclination is to accept this as evidence that the clients, not the contractor, were the problem.

  **However, the procedure mandates I reject this adjustment.**

  **Reasoning for the Appeals Panel:**
  "Contractor [Name] argues that their low placement rate is due to clients dropping out before completing the intake workshop. They show us that among *completers*, their performance is average.

  We cannot accept this adjustment. Under Test 1 of our Procedure, we only adjust for variables fixed *before* enrollment. Workshop completion happens *after* enrollment.

  Why does this distinction matter? Because client retention is a service you are paid to provide.

  If we adjust for workshop completion, we create a perverse incentive. A contractor could identify a difficult client on Day 1, provide minimal support to encourage them to drop out before the workshop is marked 'complete,' and thus remove that client from the denominator of your 'adjusted' performance metric. You would be rewarded for creaming—selecting only the easiest clients to retain.

  Our contract requires you to place enrolled clients. It does not allow you to exclude those who struggle to stay enrolled. The raw placement rate measures your ability to serve the people who walk through your door, including the ones who find it hard to stick with the program. That is the job we are buying."

  ### 7. Cost of Simplification

  This procedure prioritizes defensibility and auditability over statistical precision.
  *   **Cost:** We lose the ability to use sophisticated logistic regression models that might handle continuous variables (e.g., exact weeks of unemployment) better than coarse strata.
  *   **Cost:** The "Minimum Cell Size" of 20 is arbitrary. Some contractors with N=18 in a stratum are treated the same as those with N=5.
  *   **Benefit:** An auditor or contractor can verify every step in a spreadsheet without understanding causal inference. The "Timing Rule" prevents endless debates about which post-enrollment variables are "exogenous."
  *   **Benefit:** By separating Effectiveness (Adjusted) from Yield (Raw), we stop arguing about whether a low rate is "fair." It might be fair (hard cases) but it is still a low yield for the state. Both facts are recorded.

  **Signed,**

  Director, Outcomes-Analysis Unit
