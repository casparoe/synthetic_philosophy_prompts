prompt: |-
  I direct the outcomes-analysis unit of a state workforce agency. Four times a year my team ranks the twenty-odd contractors who run our publicly funded job-placement and training programs, and the ranking bites: the bottom tier loses renewal, the top tier earns a performance bonus, the middle tier goes on an improvement plan, and any contractor can appeal to a procurement board that has no statistical training. Right now the ranking rests on a single number — the share of enrolled clients placed into a job above a wage threshold within six months.

  Contractors in the bottom tier always raise the same protest: our clients are harder. Sometimes the data bear this out in a way I do not know how to adjudicate, and three patterns keep recurring.

  First: a contractor with the worst overall placement rate has the best rate within every stratum of the barrier index we compute at intake (prior incarceration, no high-school credential, limited English, unstable housing). The reversal is clean and the strata are large.

  Second: another contractor's overall deficit disappears only once we sort clients by something recorded after enrollment — whether they finished the intake workshop, or how many weeks they stayed in the program before exiting. Sort by any pre-enrollment variable and this contractor still looks worst.

  Third: a small rural contractor looks worst overall and best within strata only when we cut the data very finely, at which point several strata contain six to twelve clients and the ranking reshuffles if two clients are recoded.

  There is also a general worry behind these. One of my analysts tells me that if you are free enough in how you define strata, you can manufacture a reversal in either direction for almost any comparison, and that the reversal you get depends on which population's stratum sizes you weight the subgroup rates back to. If that is even roughly right, then the procedure cannot decide whether to adjust by looking at whether a reversal shows up; it has to say which partitions are admissible and whose weights are the standard before anyone opens the spreadsheet. I also need it to be explicit that we make two genuinely different decisions from these numbers — whether a given contractor is doing a worse job with the clients it accepted, and whether the agency is buying worse outcomes for the mix of people we send out — because I suspect those two questions can be answered in opposite directions by the same data, and that no amount of adjustment collapses them into one.

  My staff are competent with risk adjustment and logistic regression; the gap is not a technique. What is missing is a rule for which comparisons are decision-relevant, when adjusting is legitimate, and when to stop disaggregating.

  Please write the procedure document I will circulate. It should be:

  - An ordered set of tests, each stated so that an analyst can apply it to our own records using things we can actually check — the date a variable was measured, whether it was fixed before or after enrollment, who assigned its value, how large the strata are — rather than in the vocabulary of causal graphs. For each step, say what counts as a sufficient answer, where the procedure stops with a no, and where it hands the question to a named person because it is a question about values rather than facts.
  - A stopping rule for disaggregation, including what to do when a reversal is directionally consistent but the strata are too small to support it.
  - An explicit statement of what the choice of a weighting standard settles and who gets to make it.
  - A short closing section on what the procedure cannot tell us, so the board does not read a ranking as a verdict.

  Then apply the procedure to the three contractor cases above, showing the work at each step. I expect at least one of them to come out against what I am inclined to decide; tell me which one, and give me the reasoning I would have to read out to the appeals panel to defend it.

  Constraints: eight analysts, one afternoon, a spreadsheet, no new data collection, and outcomes I can defend to contractors who will argue with them. Where the simplification needed to make this usable by my team costs something in correctness, say so and say how much it costs.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure document and analysis:

  1.  **Analyze the Request:**

      *   **Role:** Director of Outcomes-Analysis Unit, State Workforce Agency.
      *   **Task:** Write a procedure document for ranking contractors based on job placement data, specifically addressing Simpson's Paradox-type issues (reversals when adjusting for covariates). Apply this procedure to three specific contractor cases.
      *   **Audience:** Internal analysts (8 people, one afternoon, spreadsheet only), Procurement Board (no statistical training), Contractors (will argue/appeal).
      *   **Key Problems:**
          1.  Contractor A: Worst overall, best in every pre-enrollment stratum (Classic Simpson's Paradox).
          2.  Contractor B: Worst overall, deficit disappears only when sorting by *post*-enrollment variables (Selection bias/Collider bias risk).
          3.  Contractor C: Small rural, reversal only at very fine strata (Small sample size/Overfitting risk).
          4.  General Worry: Analyst says stratification can manufacture reversals depending on weighting standards.
          5.  Conceptual Distinction: Two different questions (Contractor performance vs. Agency purchasing value).
      *   **Constraints:** No new data, spreadsheet only, must be defensible, must acknowledge trade-offs.
      *   **Deliverables:**
          1.  Procedure Document (Ordered tests, stopping rules, weighting standard authority, limitations).
          2.  Application to the three cases.
          3.  Identification of at least one counter-intuitive result and the reasoning to defend it.

  2.  **Deconstruct the Statistical & Ethical Issues:**

      *   *Simpson's Paradox (Case 1):* This is the classic "confounding" scenario. The contractor gets harder cases. If we don't adjust, we punish them for the agency's referral patterns. If we do adjust, we need to ensure the strata are valid (pre-treatment).
      *   *Post-Treatment Bias (Case 2):* Adjusting for things happening *after* enrollment (workshop completion, weeks stayed) is dangerous. These are often outcomes of the contractor's effort or self-selection based on early success. Adjusting for them hides poor performance (e.g., if they drop out the hard cases early, looking good on completers).
      *   *Small Sample/Over-stratification (Case 3):* Cutting data too finely creates noise. A reversal based on $N=6$ is statistically unstable. We need a minimum cell size rule.
      *   *Weighting Standard:* Do we compare contractors to the *state average* mix of clients (standardized) or their *own* mix (unstandardized)?
          *   Question 1 (Contractor Performance): How well did they do with *who they got*? (Use actual weights).
          *   Question 2 (Agency Value): Did the agency get good outcomes for the *population*? (Use standard weights).
          *   *Decision:* The prompt asks to distinguish these. The ranking currently mixes them. The procedure needs to separate them.
      *   *Causal vs. Statistical:* The prompt asks to avoid causal graph vocabulary. Use "measured before/after," "assigned by," etc.

  3.  **Drafting the Procedure Document:**

      *   *Goal:* Operationalize "legitimate adjustment."
      *   *Step 1: Variable Admissibility.* Is the variable fixed before enrollment? If no, discard for adjustment (addresses Case 2).
      *   *Step 2: Stratum Stability.* Are there enough people in the buckets? (Addresses Case 3). Need a minimum $N$ per stratum per contractor.
      *   *Step 3: Reversal Check.* Does the adjusted rate differ from the raw rate by more than $X\%$?
      *   *Step 4: Weighting Standard.* Who decides the weights? This is a policy decision, not statistical.
      *   *Step 5: The Two Questions.* Explicitly separate "Performance Score" (adjusted) from "Value Score" (raw/weighted by referrals).
      *   *Limitations:* Acknowledge that this doesn't prove causality, just fairness in comparison.

  4.  **Applying the Procedure to the Cases:**

      *   *Case 1 (The Simpson's Paradox):*
          *   Variables: Barrier index (pre-enrollment). Admissible.
          *   Strata: Large. Stable.
          *   Result: Reversal is real.
          *   Decision: Adjusted rate should be used for *Performance*. Raw rate stands for *Agency Value* (if the agency sends them hard cases, the agency's outcome looks worse, but the contractor did well).
          *   *Constraint Check:* The prompt says "I expect at least one of them to come out against what I am inclined to decide."
          *   *Inclination:* Usually, directors want to protect contractors with hard cases (Case 1). The procedure supports this for Performance.
          *   *Wait, let's look at Case 2.*
      *   *Case 2 (Post-Enrollment Variables):*
          *   Variables: Workshop completion, weeks stayed. Measured *after* enrollment.
          *   Rule: Inadmissible for adjustment.
          *   Result: Cannot adjust. Raw rate stands.
          *   *Inclination:* The director might want to give them a break if the data "explains" the deficit. But the procedure says *No*. This is likely the counter-intuitive one. Why? Because adjusting for post-enrollment variables rewards contractors for "creaming" (dropping hard clients early so they don't count as failures). Defending this is crucial.
      *   *Case 3 (Small Rural):*
          *   Variables: Fine cuts.
          *   Rule: Strata too small ($N < 20$?).
          *   Result: Aggregation required. Reversal ignored. Raw rate stands.
          *   *Inclination:* Director might want to be nuanced. Procedure says "No, too noisy."

  5.  **Refining the "Counter-Intuitive" Aspect:**

      *   The prompt asks me to identify which one comes out against the Director's inclination.
      *   *Director's likely inclination:* "The data bears this out... I do not know how to adjudicate." They likely *want* to adjust for Case 2 because the deficit "disappears." It feels fair.
      *   *Procedure's verdict:* Case 2 *cannot* be adjusted because the variables are post-enrollment.
      *   *Reasoning:* Adjusting for post-enrollment variables masks the contractor's ability to retain and serve difficult clients. It incentivizes dumping hard cases.
      *   *Defense:* "We measure your ability to place the people who walk in the door, not just the ones who stick around."

  6.  **Developing the Weighting Standard Section:**

      *   The analyst is right: weighting matters.
      *   *Standard:* Statewide Intake Mix.
      *   *Who:* The Director (Policy), not Analysts (Stats).
      *   *Why:* It answers "If every contractor got the average mix, how would they do?" (Performance).
      *   *Distinction:*
          *   Metric A (Performance): Adjusted for case mix, weighted to State Average. (Did they do a good job?)
          *   Metric B (Agency Cost/Value): Raw rate. (Did we get good results for our tax dollars given who we sent?)
          *   *Correction:* Actually, for "Agency Value," if we send hard cases to a contractor, the raw rate is low. That reflects the *Agency's* referral policy, not the Contractor's value.
          *   *Better Distinction:*
              1.  **Effectiveness (The Contractor's Grade):** Adjusted for pre-enrollment barriers, weighted to *State Average* mix. (Removes referral bias, removes case-mix advantage).
              2.  **Impact (The Agency's Return):** Raw placement rate. (Reflects the actual outcome the state bought, regardless of difficulty).
              *   *Wait, the prompt says:* "whether a given contractor is doing a worse job with the clients it accepted, and whether the agency is buying worse outcomes for the mix of people we send out."
              *   *Decision 1 (Contractor Job):* Adjusted Rate (Standardized Weights).
              *   *Decision 2 (Agency Buy):* Raw Rate (Actual Weights).
              *   *Weighting Authority:* The Director sets the Standard Weights.

  7.  **Drafting the Content - Section by Section:**

      *   *Header:* Formal, clear.
      *   *Purpose:* Distinguish performance from case mix.
      *   *The Procedure (The "Tests"):*
          1.  Timing Test (Pre vs. Post).
          2.  Control Test (Who assigned the value?).
          3.  Volume Test (Min cell size).
          4.  Weighting Decision (Policy).
      *   *The Two Metrics:* Effectiveness vs. Yield.
      *   *Limitations:* Correlation != Causation, unmeasured variables.
      *   *Application:* Walk through Cases 1, 2, 3.
      *   *The "Hard Truth":* Case 2 fails the Timing Test.

  8.  **Review against Constraints:**

      *   *8 analysts, one afternoon, spreadsheet:* Keep calculations simple (weighted averages, counts). No regression models required for the *procedure*, though staff know them. The procedure must be rule-based.
      *   *Defensible:* Clear rules prevent accusations of favoritism.
      *   *Cost of Simplification:* Acknowledge that binary Pre/Post rules might exclude valid nuanced variables, but prevent gaming.

  9.  **Final Polish:**

      *   Ensure tone is authoritative but humble about statistical limits.
      *   Make sure the "Counter-Intuitive" result is highlighted clearly in the application section.
      *   Check the weighting logic again. If I use State Average weights for the Contractor Score, I remove the advantage of getting easy referrals. If I use Actual weights for the Agency Score, I see the real-world result. This aligns with the prompt's requirement to separate the two questions.

      *(Self-Correction during drafting)*: I need to be careful about the "Weighting Standard." The analyst noted that reversals depend on *whose* weights you use.
      *   If I weight by *Contractor's* mix: I answer "How did they do with *their* clients?" (But this doesn't fix Simpson's paradox if the mix is the problem).
      *   If I weight by *State* mix: I answer "How would they do with an *average* client?" (This isolates contractor effectiveness).
      *   *Procedure Decision:* For the **Contractor Performance Ranking** (Bonus/Penalty), use **State Standard Weights**. This levels the playing field. For the **Agency Outcomes Report**, use **Actual Weights**.
      *   *Who decides:* The Director (Policy).

      *(Refining Case 2 Defense)*: Why is Case 2 the hard one? Because the data *shows* they do fine if you look at completers. It feels intuitive to say "Well, they tried, but the clients dropped out." The procedure must say "Retention is part of the job." That's the hard pill to swallow.

  10. **Final Output Structure:**
      *   Memorandum Header.
      *   Section 1: The Two Questions (Conceptual Framework).
      *   Section 2: The Adjustment Procedure (The 4 Tests).
      *   Section 3: Weighting Authority.
      *   Section 4: Limitations.
      *   Section 5: Application to Current Appeals.
      *   Section 6: The Hard Decision (Case 2).

