answer: |-
  You have put your finger on one of the most persistent and difficult problems in the philosophy of medicine. You are correct: the definition of death relies on a logical sleight of hand where a present-tense ontological claim ("this organism is dead") is grounded in a future-tense modal claim ("functions will not return").

  Here is the conceptual picture, the nearest established terminology, and the edges of the problem.

  ### 1. The Philosophical Category: Dispositional Properties
  The nearest established philosophical concept for what you are describing is a **dispositional property**.

  In metaphysics, a dispositional property is a characteristic that describes how something *would* behave under specific conditions, rather than how it is behaving right now. The classic example is **fragility**. A glass is fragile even when it is sitting safely on a shelf, not breaking. We call it fragile not because it is currently shattering, but because *if* it were struck, it *would* shatter.

  Your observation is that modern medicine defines death dispositionally. To say a patient is dead is to say: "If we were to attempt resuscitation (or if we were to wait), the heart/brain *would not* resume function."

  **How it differs:**
  Usually, dispositional properties describe capacities (solubility, fragility). Death is defined by a *lack* of capacity (the inability to resume function). Furthermore, death is treated as a **categorical state** (you are either dead or alive), but we are identifying that categorical state using **counterfactual criteria** (what *would* happen). This creates a gap between the *state* (which we want to be a fact about the present) and the *evidence* (which is a prediction about the future).

  ### 2. The Bioethical Distinction: Permanent vs. Irreversible
  In bioethics, this logical move is often discussed through the distinction between **permanent** and **irreversible** cessation of function. This is the practical instantiation of the philosophical problem you noticed.

  *   **Irreversible:** The function *cannot* return, even with intervention. (This is the standard for Brain Death).
  *   **Permanent:** The function *will not* return, usually because we will not attempt to restart it. (This is the standard for Donation after Circulatory Death, or DCD).

  Your friend in the ICU is describing the **Permanent** standard. In DCD protocols, a patient is declared dead after their heart stops for a set time (e.g., 5 minutes). We do not know for a fact that the heart *could not* restart (irreversible); we know that it *will not* restart because we have made a normative decision not to touch it (permanent).

  **The Conceptual Move:**
  When we use "permanent" instead of "irreversible," we are openly admitting that the definition of death depends on **human intention**, not just biology. We are defining death not by the state of the organism, but by the treatment plan surrounding the organism.

  ### 3. What to Call It: "Modal Definition of Death"
  There is no single noun that perfectly captures this, but the most precise label for the phenomenon you are describing is **defining death modally** (or a **Modal Definition**).

  In logic and philosophy, "modality" refers to necessity, possibility, and impossibility. By defining death as "irreversible," you are making a claim about **necessity** (it is necessary that function does not return). By declaring someone dead based on current tests, you are treating that modal claim as a present fact.

  If you need a shorthand for your papers or discussions, you might call this **"The Counterfactual Criterion."** It highlights that the criterion for the state is a statement about a world that does not exist (the world where we try to resuscitate and fail).

  ### 4. The Edges of the Concept
  If you define death modally (based on what *would* happen), the boundaries of death become unstable in three specific ways:

  **A. Technological Relativity**
  If "irreversible" means "cannot be restarted with available technology," then death is relative to the hospital's budget. A patient might be "dead" in a rural clinic (no ECMO, no neurosurgeon) but "alive" in a top-tier research hospital. This suggests death is not a biological fact, but a technological status. The "edge" here is that the definition of death expands and contracts with medical innovation.

  **B. Normative Relativity**
  If "permanent" means "we won't try to restart it," then death depends on social norms. In a culture that mandates maximal treatment for everyone, fewer people are "permanently" dead. In a culture with strict triage or resource rationing, more people qualify. The "edge" here is that death becomes a policy decision, not a medical finding.

  **C. The Time-Lag Problem**
  Because the definition relies on a prediction, there is always a gap between the *biological event* (the moment function ceased) and the *epistemic certainty* (the moment we are sure it won't come back). We legally declare death at the second moment, but we backdate it to the first. The "edge" here is that there is a period of time where the patient is legally dead, but biologically, we are still waiting to see if our prediction was right.

  ### Summary
  You are describing the shift from defining death as a **categorical state** (what the organism *is*) to a **dispositional status** (what the organism *would do*).

  *   **Philosophical Label:** Dispositional Property / Counterfactual Conditional.
  *   **Bioethical Label:** Permanent vs. Irreversible Cessation.
  *   **Descriptive Name:** The Modal Definition of Death.

  The "hidden move" you identified is that we collapse a prediction about the future into a fact about the present to satisfy legal and ethical requirements (like organ donation) that demand a clear, bright line, even though biology offers us a fuzzy, probabilistic gradient.
