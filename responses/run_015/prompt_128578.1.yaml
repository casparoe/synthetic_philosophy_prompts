  # JOINT STATEMENT OF AGREEMENT AND DISAGREEMENT
  **Project:** Adversarial Collaboration on Self-Locating Conditional Updating
  **Parties:** "Halfer" (Proponent of Credence Stasis) vs. "Thirder" (Proponent of Credence Shift)
  **Date:** October 26, 2023

  ## 1. Agreed Claims (The Setup)

  We, the undersigned, agree to the following formal and substantive claims as the fixed background for this collaboration. Disagreement on these points voids the collaboration.

  1.  **Prior Probabilities:** In the baseline Judy Benjamin scenario, prior to receiving any message, the rational credence in being in Red Headquarters ($R$) is equal to the credence in being in Blue Headquarters ($B$). Formally: $P_{prior}(R) = P_{prior}(B) = 0.5$.
  2.  **The Evidence ($E$):** The agent receives a reliable message with the content: "If you are in Red HQ, the rational credence for being in Red HQ is $3/4$." We agree this is the *only* new information received.
  3.  **Centered Worlds Framework:** We agree that belief states are modeled over a set of centered worlds $\langle w, c \rangle$, where $w$ is a possible world and $c$ is a center (agent location/time). Learning $E$ eliminates or reweights centers compatible with $E$.
  4.  **Normative Goal:** We agree the goal is to determine the rational *posterior* unconditional credence $P_{post}(R)$ given $E$.
  5.  **Principal Principle (General):** We agree that rational credence should align with known objective chances, provided no inadmissible evidence is present. We disagree only on *which* chances are relevant (chance of location vs. chance of message receipt).
  6.  **No External Info:** We agree that no information is received regarding the reliability of the commander, the frequency of messages in the population, or the physical mechanism of message delivery, other than what is contained in $E$ itself.

  ## 2. Statement of Disagreements

  The following table isolates the precise theoretical divergences. The Halfer endorses the Left Column; the Thirder endorses the Right Column.

  | Feature | Halfer Position (Credence Stasis) | Thirder Position (Credence Shift) |
  | :--- | :--- | :--- |
  | **1. Nature of Evidence $E$** | $E$ is a **constraint** on the posterior credence function. It dictates the relationship between $P(R|R)$ and $P(R)$, but does not provide propositional evidence about the world state $R$ itself. | $E$ is **propositional evidence** about the world. It is a fact that can be true or false in a centered world and must be conditionalized upon via Bayes' Theorem. |
  | **2. Updating Rule** | **Van Fraassen/Reflection:** Updating requires satisfying the constraint $P_{post}(R|R) = 3/4$ while minimizing information loss (entropy) relative to the prior. This preserves the prior odds of $R$ vs $B$. | **Standard Conditionalization:** Updating requires $P_{post}(R) = P_{prior}(R | E)$. This requires evaluating the likelihood ratio $P(E|R) / P(E|B)$. |
  | **3. Principal Principle Application** | PP applies to the **chance of location**. Since the chance of being in Red is 50% and $E$ does not alter physical chances of location, credence remains 50%. | PP applies to the **chance of receiving $E$**. If the truth of $R$ affects the likelihood of $E$ being generated (via self-location), PP mandates a shift in credence. |
