      *   **Failure Conditions:** Explicitly state the collapse scenario.
      *   **Timeline/Feasibility:** Break down the 3 months. Identify the bottleneck.

  4.  **Refining the Content (Self-Correction/Polishing):**

      *   *Critique of Existing Treatments:* Make sure to mention that standard REU treats risk as a function of cumulative probability, but if the *outcome* defining the cumulative probability is vague, the function is ill-defined.
      *   *The "Why not standard EU" argument:* Standard EU handles risk via concave utility. But this conflates diminishing marginal utility with risk attitude. REU separates them. The problem here is *categorical ambiguity*, which EU doesn't have tools for (EU expects precise probabilities and utilities).
