prompt: |-
  I chair the incident review committee at a large hospital system. Within about two weeks of an adverse event, and on the basis of a written file plus one interview, we decide how the institution will respond to the clinicians involved: whether to occupy what Strawson calls the participant stance — blame, censure, a demand for an account, an expectation of remorse — or to fall back into the objective attitude, treating them as things to be managed, retrained, reassigned or removed. Our current protocol is a vague just-culture checklist; I want to replace it with something explicitly Strawsonian that a rotating committee of clinicians and one lay member can run in about an hour, roughly monthly, knowing that our finding goes into a personnel file and can affect clinical privileges.

  Write me that procedure: the questions in order, what counts as a sufficient answer to each, where the procedure terminates in a no-blame outcome, and where it must stop and hand the decision to a person because what remains is a question of values rather than facts. It has to handle at least: the difference between an excuse (the agent did not really act, or acted in ignorance or under pressure) and an exemption (the agent is unsuitable as a candidate for reactive attitudes generally — a child, someone floridly psychotic, someone with advanced dementia); cases of partial or marginal participation, where several people each contributed a little; the gap between the committee's public finding and what its members can honestly feel, and the fact that the clinician's own self-reactive attitudes and the team's blame on the patient's behalf are part of what we are deciding; and, increasingly, events whose proximal cause was an algorithmic recommendation that nobody on the ward could have independently checked.

  Then run it on three cases: a resident on a fourth consecutive long shift who misprogrammed an infusion pump and killed a patient; an attending who knowingly deviated from a guideline she disagreed with, relying on her own clinical experience, with a bad outcome; and a surgeon with early, undiagnosed cognitive decline whose colleagues had been quietly covering for him. At least one of these should come out somewhere the committee will not like. Close by saying what the procedure cannot do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and case analyses:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of an Incident Review Committee at a large hospital system.
      *   **Task:** Create a new review procedure based on P.F. Strawson's "Freedom and Resentment" (participant vs. objective stance).
      *   **Constraints:**
          *   Must be runnable by a rotating committee (clinicians + 1 lay member) in ~1 hour, monthly.
          *   Findings go into personnel files/affect privileges (high stakes).
          *   Must replace a vague "just culture" checklist.
          *   Must handle specific philosophical/practical nuances: excuses vs. exemptions, partial participation, gap between public finding/private feeling, self-reactive attitudes, team blame, algorithmic causation.
          *   Must distinguish where facts end and values begin (handoff point).
      *   **Application:** Run the procedure on three specific cases (Resident fatigue/pump error, Attending guideline deviation, Surgeon cognitive decline).
      *   **Requirement:** At least one outcome must be unpopular/uncomfortable for the committee.
      *   **Conclusion:** State what the procedure *cannot* do.

  2.  **Theoretical Foundation (Strawson):**

      *   *Participant Stance:* Holding someone responsible, expecting goodwill, feeling resentment/gratitude, demanding an account. Appropriate for moral agents in normal relationships.
      *   *Objective Stance:* Treating someone as an object to be managed, treated, or trained. No resentment, no demand for moral accountability. Appropriate for children, severely mentally ill, or those incapacitated.
      *   *Excuses:* "I didn't do it" or "I didn't mean to" (accident, coercion, ignorance). Mitigates blame but keeps participant stance.
      *   *Exemptions:* "I am not a candidate for responsibility" (psychosis, extreme immaturity). Shifts to objective stance.
      *   *Self-Reactive Attitudes:* Guilt, shame, remorse (the agent's own feelings).
      *   *Vicarious Reactive Attitudes:* Indignation on behalf of the victim.

  3.  **Drafting the Procedure (The "Strawsonian Audit"):**

      *   *Goal:* Efficient, structured, philosophically sound, legally defensible (as much as possible), humane.
      *   *Structure:* Needs to flow logically from facts to stance determination.
      *   *Time Limit:* 1 hour means strict timeboxing per section.
      *   *The "Handoff":* Where does the committee stop? When the decision requires a value judgment about *punishment* vs. *support* that exceeds their mandate, or when the "objective stance" requires medical/HR expertise they don't have. Actually, the prompt asks where it stops because it's a question of *values* rather than facts. In Strawson's view, the *stance* is a value judgment, but the *criteria* for it are factual (capacity, intent). The handoff should be when the committee determines the *stance* but the *consequence* requires higher authority (e.g., firing vs. retraining). Or, more subtly, when the conflict is between institutional risk and moral fairness. Let's define the handoff as: When the stance is "Participant" but the appropriate sanction is contested, or when the stance is "Objective" but the management plan requires specialized HR/Medical Board input.
      *   *Addressing Specific Nuances:*
          *   *Excuse vs. Exemption:* Needs specific questions about capacity and intent.
          *   *Partial Participation:* Needs a "Causal Contribution" phase.
          *   *Public vs. Private:* Needs a "Record vs. Feeling" step.
          *   *Algorithms:* Needs a specific check on "Epistemic Access."
          *   *Self-Reactive:* Needs to assess the clinician's remorse/insight during the interview.

      *   *Drafting the Steps:*
          1.  Fact Establishment (10 mins).
          2.  Capacity & Exemption Check (15 mins).
          3.  Excuse & Mitigation Check (15 mins).
          4.  Algorithmic/Systemic Opacity Check (10 mins).
          5.  Reactive Attitude Assessment (Self & Team) (10 mins).
          6.  Stance Determination & Handoff (10 mins).

  4.  **Refining the Questions & Criteria:**

      *   *Exemption:* Is the agent capable of ordinary interpersonal relationships regarding this act? (Psychosis, dementia, coercion). If Yes -> Objective Stance.
      *   *Excuse:* Did they intend the harm? Was it foreseeable? Were they forced? If Yes (unintended/unforeseeable) -> Mitigated Participant Stance.
      *   *Algorithm:* Could a reasonable human have overridden it? If No -> Systemic Objective Stance (manage the tool, not the user).
      *   *Self-Reactive:* Does the clinician show guilt/remorse? If Yes -> Participant Stance reinforced. If No (psychopathic indifference) -> Exemption/Objective.
      *   *Handoff:* The committee decides the *stance* (Blame vs. Manage). The *consequence* (Fire vs. Retrain) is a value/policy decision for the CMO/HR based on that stance.

  5.  **Running the Cases:**

      *   *Case 1: Resident (Fatigue/Pump).*
          *   Facts: 4th shift, error, death.
          *   Exemption? No, but capacity impaired by system (fatigue).
          *   Excuse? Partial. Fatigue is an excuse for *reduced* capacity, but the system allowed it.
          *   Algorithm? No, pump interface.
          *   Self-Reactive: Likely high guilt.
          *   Outcome: Participant Stance (demands account) but heavily mitigated. System takes most blame. *Committee discomfort:* They want to blame the system, but the protocol forces them to address the resident's agency.
      *   *Case 2: Attending (Guideline Deviation).*
          *   Facts: Knowingly deviated, bad outcome.
          *   Exemption? No.
          *   Excuse? No, intentional.
          *   Values: Clinical autonomy vs. Protocol.
          *   Self-Reactive: Likely defensiveness ("I know better").
          *   Outcome: Strong Participant Stance. Demand for account.
      *   *Case 3: Surgeon (Cognitive Decline).*
          *   Facts: Early dementia, colleagues covered.
          *   Exemption? Yes (Medical incapacity).
          *   Colleagues: They participated in the exemption (covering).
          *   Outcome: Objective Stance for Surgeon (medical management). Participant Stance for Colleagues (conspiracy of silence).
          *   *Unpopular Outcome:* The committee might want to protect the surgeon out of respect, but the procedure forces an Objective Stance (removal of privileges) which feels harsh, OR the blame shifts to the colleagues which creates tension. Let's make the unpopular one about the *Colleagues*. The procedure forces the committee to blame the *cover-up* more than the error.

  6.  **Addressing the "Values vs. Facts" Handoff:**

      *   The committee determines the *moral status* of the act (Strawsonian stance).
      *   The *administrative action* (firing, suspension) is a policy decision based on that status.
      *   However, the prompt asks where it stops because what remains is a question of *values*.
      *   *Refinement:* The handoff occurs when the committee has established the stance, but the *appropriate response* requires weighing institutional risk against individual justice in a way the committee isn't empowered to do. Actually, Strawson argues the stance *is* the relationship. So if we take the Objective Stance, we manage. If Participant, we hold accountable. The "Value" jump is deciding *how much* accountability.
      *   *Better interpretation:* The procedure identifies the *type* of response (Moral vs. Medical/Admin). The specific *severity* is the value judgment handed to the CMO.
      *   *Wait, re-reading prompt:* "where it must stop and hand the decision to a person because what remains is a question of values rather than facts."
      *   *Solution:* The committee determines the *Stance*. The *Sanction* is the value judgment. But also, in hard cases (like the Attendant), whether the deviation was "reasonable clinical judgment" or "negligence" is a value judgment. The procedure should flag this.

  7.  **Addressing the Algorithm:**

      *   If the algorithm is a "black box," the clinician cannot form an intention regarding the specific logic. This limits the Participant Stance. They can only be held responsible for *using* the tool, not the *output*.

  8.  **Addressing the "Gap" (Public vs. Private):**

      *   The procedure needs a "Minute Entry" section that records the Stance, separate from the "Private Notes" where members can record residual resentment or sympathy that shouldn't influence the official record.

  9.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Formal, procedural, yet philosophically precise.
      *   *Structure:* Introduction, The Protocol (Steps 1-6), The Handoff, Case Studies, Limitations.
      *   *Case 1 (Resident):* Outcome: Mitigated Participant. System is the main target. Resident gets counseling, not censure.
      *   *Case 2 (Attending):* Outcome: Strong Participant. Censure.
      *   *Case 3 (Surgeon):* Outcome: Objective for Surgeon (Medical Board), Participant for Colleagues (Censure for covering). *Unpopular:* The colleagues (who might be on the committee or friends of members) get blamed more than the impaired surgeon.

  10. **Final Review against Constraints:**

      *   1 hour? Yes, strict timing.
      *   Rotating committee? Yes, clear script.
      *   Personnel file impact? Yes, explicit stakes.
      *   Strawsonian terms? Yes (Participant/Objective, Excuse/Exemption, Reactive Attitudes).
      *   Algorithm included? Yes.
      *   Unpopular outcome? Yes (Case 3 blaming the enablers).
      *   Limitations section? Yes.

  11. **Polishing the Strawsonian Logic:**

      *   Ensure the distinction between *Excuse* (I didn't mean to/couldn't help) and *Exemption* (I am not a moral agent) is clear.
      *   Ensure the "Objective Stance" isn't just "let them off," it's "manage them like a risk factor."
      *   Ensure the "Participant Stance" isn't just "punish," it's "demand an account/expect remorse."

  12. **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Handoff" is distinct. The committee recommends the *Stance*. The CMO/HR decides the *Action*.
      *   *Correction on Case 3:* The prompt asks for an outcome the committee won't like. Blaming the colleagues is good, but maybe the outcome where the Surgeon is treated purely objectively (stripped of agency) feels dehumanizing to the committee who know him. Or, the Algorithm case (not requested but implied in procedure) is hard. Let's stick to the requested three. For Case 3, the uncomfortable part is that the Surgeon is *exempted* (treated as a broken tool) which denies his dignity, while the colleagues who tried to protect him are *blamed*. This creates moral tension.
      *   *Wait, one more check:* "At least one of these should come out somewhere the committee will not like."
      *   *Idea:* Case 1 (Resident). The committee wants to blame the hospital system (fatigue). But the Strawsonian protocol forces them to acknowledge the Resident *acted*. They must take a Participant Stance, even if mitigated. They can't just say "System Error." They have to ask the Resident for an account. This might feel unjust to a committee sympathetic to labor issues.
      *   *Alternative Idea:* Case 3. The committee wants to help the surgeon. The procedure forces an Objective Stance (management/removal) which feels cold.
      *   *Decision:* I will make Case 3 the uncomfortable one. The procedure forces the committee to treat a respected colleague as a "thing to be managed" (Objective Stance) rather than a moral agent who made a mistake, effectively ending his career without a "blame" hearing, while simultaneously blaming the colleagues who loved him. It feels like a betrayal.

      *   *Wait, let's look at the Algorithm requirement again.* "Events whose proximal cause was an algorithmic recommendation." I need to ensure the procedure handles this, even if the specific cases don't all feature it. I will add a specific step for it. I might tweak Case 1 to involve a pump with smart software (algorithmic) to hit that constraint harder? No, the prompt lists three specific cases. I must ensure the *Procedure* handles algorithms, even if the cases vary. Case 1 is a pump (device), Case 2 is guideline (protocol), Case 3 is cognitive (human). I will ensure the Procedure explicitly addresses algorithms so the user knows it's covered, even if the cases test other boundaries. Actually, I can interpret the infusion pump in Case 1 as having "dose error reduction software" (algorithmic).

      *   *Refining the "Values" Handoff:* The committee decides the *Stance*. The *Sanction* is the value judgment. But the prompt says "hand the decision to a person because what remains is a question of values." This implies the committee *cannot* decide the final outcome if it's purely axiological.
      *   *Actually, Strawson's point:* The stance *is* the relationship. If we take the objective stance, we manage. If participant, we blame. The "Value" part is weighing the *intensity* of the blame vs. the *risk* to the institution.
      *   *Okay, I will define the Handoff as:* The Committee determines the *Moral Status* (Stance). The *Administrative Disposition* (Fire, Suspend, Retrain) is handed to the CMO because that requires weighing institutional values (risk, reputation, cost) against the moral finding.

      *   *Let's write.*

      *(Self-Correction during final polish)*: Ensure the distinction between Excuse and Exemption is crystal clear in the procedure steps. Excuse = Participant Stance (mitigated). Exemption = Objective Stance.

      *(Final check on Case 3)*: The colleagues covering for him. They are in the Participant Stance. They chose to hide it. They are blameworthy. The Surgeon is in the Objective Stance. He is ill. The Committee might dislike blaming the colleagues (who acted out of care) and treating the Surgeon as an object. This fits the "unpopular" requirement.

      *(Final check on Algorithm)*: I need to make sure the procedure explicitly mentions algorithms. I will add a specific gate in Step 3.

      *(Final check on Time)*: 1 hour total. 5 steps x 10 mins + 10 mins deliberation.

      *(Final check on Lay Member)*: Ensure their role is defined (guardian of the "ordinary interpersonal expectations").

      Let's assemble.
answer: |-
  # The Strawsonian Incident Review Protocol (SIRP)

  **Purpose:** To determine the appropriate moral stance (Participant vs. Objective) the institution takes toward clinicians involved in adverse events.
  **Committee:** 4 Clinicians (rotating), 1 Lay Member (community representative).
  **Time Limit:** 60 Minutes hard stop.
  **Authority:** Findings determine the *moral status* of the event in the personnel file. Administrative sanctions (suspension, termination, retraining) are recommended based on this status but finalized by the Chief Medical Officer (CMO).

  ---

  ## Part I: The Procedure

  ### Step 1: Fact & Causal Mapping (10 Minutes)
  *Goal: Establish what happened without assigning fault.*
  **Question:** What was the sequence of actions, and what was the specific contribution of the clinician under review (the "Agent")?
  **Sufficient Answer:** A timeline distinguishing the Agent's actions from system failures, patient physiology, or other agents.
  **Algorithmic Check:** If an algorithm/decision-support tool was involved, did the Agent have *epistemic access* to the reasoning? (Could they have reasonably overridden it?)
  *   *If No:* The Agent is treated as a monitor of the tool, not the author of the recommendation.
  *   *If Yes:* Proceed to Step 2.

  ### Step 2: The Exemption Gate (15 Minutes)
  *Goal: Determine if the Agent is a candidate for reactive attitudes at all.*
  **Question:** At the time of the event, was the Agent capable of ordinary adult interpersonal relationships regarding this action? (Consider: Psychosis, delirium, advanced dementia, coercion amounting to duress, or lack of basic training).
  **Sufficient Answer:** Medical or factual evidence of incapacity.
  **Termination Rule:**
  *   **If YES (Exempt):** Stop. **Stance: Objective.** The Agent is to be managed, treated, or removed. No demand for an account is appropriate. Hand off to Step 6.
  *   **If NO (Not Exempt):** Proceed to Step 3.

  ### Step 3: The Excuse & Mitigation Gate (15 Minutes)
  *Goal: Determine if the Participant Stance should be modified.*
  **Question:** Did the Agent intend the harm? Was the harm foreseeable to a reasonable peer? Was the Agent acting under abnormal pressure (e.g., extreme fatigue, staffing crisis)?
  **Sufficient Answer:** Distinction between *negligence* (failed to meet standard), *error* (unintended slip), or *systemic coercion* (forced choice).
  **Termination Rule:**
  *   **If Unintended/Unforeseeable/Coerced:** **Stance: Mitigated Participant.** Blame is reduced; demand for account is softened to "learning."
  *   **If Intended/Reckless/Grossly Negligent:** **Stance: Strong Participant.** Full demand for an account. Proceed to Step 4.

  ### Step 4: Reactive Attitude Assessment (10 Minutes)
  *Goal: Assess the moral relationship repair potential.*
  **Question A (Self-Reactive):** Does the Agent exhibit guilt, remorse, or a desire to make amends?
  **Question B (Vicarious):** Does the clinical team feel indignation on behalf of the patient, or do they feel the Agent was failed by the system?
  **Sufficient Answer:** Interview data and peer feedback.
  *   *Note:* If the Agent shows no remorse (psychopathic indifference), revert to **Step 2 (Exemption)**: They are not a candidate for moral dialogue. Treat as Objective.
  *   *Note:* If the Team feels *no* indignation (systemic failure), the **Strong Participant** stance is downgraded to **Mitigated**.

  ### Step 5: The Public/Private Gap (5 Minutes)
  *Goal: Separate the institutional record from human feeling.*
  **Question:** Can the committee sign the finding even if they privately feel differently?
  **Procedure:** The Lay Member verifies that the finding reflects "ordinary interpersonal expectations" rather than institutional defensiveness.
  **Record:** The official file records the *Stance*. Committee members may lodge private dissent regarding the *feeling*, but not the *classification*.

  ### Step 6: The Value Handoff (5 Minutes)
  *Goal: Distinguish Moral Status from Administrative Action.*
  **Procedure:** The Committee votes on the **Stance** (Objective, Mitigated Participant, Strong Participant).
  **The Handoff:** The Committee *does not* decide the sanction (e.g., fire vs. retrain).
  *   **Reason:** The Stance is a fact-based moral classification (Can we hold them responsible?). The Sanction is a **Value Judgment** (How much risk does the institution tolerate? What do we owe the patient vs. the staff?).
  *   **Action:** The Stance is sent to the CMO. The CMO applies institutional values to determine the consequence.
  *   **Exception:** If the Committee is split >20% on the Stance, the case is flagged as a "Value Conflict" and sent to the Ethics Board, not the CMO.

  ---

  ## Part II: Case Applications

  ### Case 1: The Fatigued Resident
  **Facts:** Resident on 4th consecutive 24-hour shift misprograms a smart pump (algorithmic dose-check overridden due to alert fatigue). Patient dies.
  **SIRP Run:**
  1.  **Facts:** Resident acted. Pump had software, but Resident overrode it.
  2.  **Exemption:** No. Resident is an adult agent. However, fatigue is noted.
  3.  **Excuse:** Unintended harm. Foreseeability is low *given the fatigue*. Systemic coercion is high (scheduling).
  4.  **Reactive Attitudes:** Resident is devastated (High Self-Reactive). Team is angry at scheduling, not Resident (Low Vicarious Blame).
  5.  **Gap:** Committee feels sympathy.
  6.  **Handoff:**
      *   **Finding:** **Mitigated Participant Stance.**
      *   **Rationale:** The Resident is an agent, but the conditions of agency were compromised by the institution. We demand an account, but the account is "I was too tired to be safe," which indicts the scheduler, not the clinician.
      *   **Uncomfortable Outcome:** The Committee *wants* to say "No Blame, System Error." The SIRP forces them to record that the Resident *acted* and must provide an account. The Resident's file reflects a Mitigated Participant finding, not a pure System Error. This stains the Resident slightly, which the Committee dislikes, but it preserves the truth that the Resident's hand was on the pump.

  ### Case 2: The Deviating Attending
  **Facts:** Attending knowingly ignores sepsis guideline based on "clinical gestalt." Patient dies of sepsis.
  **SIRP Run:**
  1.  **Facts:** Attending chose to deviate. No algorithm blocked her.
  2.  **Exemption:** No. Full capacity.
  3.  **Excuse:** No. Intentional deviation. Harm was foreseeable risk of deviation.
  4.  **Reactive Attitudes:** Attending is defensive ("Guidelines are for rookies"). No remorse. Team is mixed; some respect autonomy, some angry.
  5.  **Gap:** Committee members (clinicians) value autonomy. Lay member values protocol adherence.
  6.  **Handoff:**
      *   **Finding:** **Strong Participant Stance.**
      *   **Rationale:** The Agent claims exceptionalism. To maintain the moral community, we must demand an account. If she cannot justify the deviation medically (not just philosophically), she is blameworthy.
      *   **Outcome:** File notes "Failure to justify deviation." CMO decides on retraining vs. suspension.

  ### Case 3: The Declining Surgeon
  **Facts:** Surgeon shows signs of early dementia (tremor, memory lapses). Colleagues know, cover for him, adjust schedules. Patient harmed during routine procedure.
  **SIRP Run:**
  1.  **Facts:** Surgeon operated. Colleagues facilitated.
  2.  **Exemption:** **YES.** Medical evidence suggests cognitive decline impacts capacity.
  3.  **Excuse:** N/A (Exemption trumps Excuse).
  4.  **Reactive Attitudes:** Surgeon is unaware (anosognosia). Colleagues feel protective guilt.
  5.  **Gap:** Committee knows the Surgeon personally.
  6.  **Handoff:**
      *   **Finding (Surgeon):** **Objective Stance.** He is not a moral agent in this context. He is a risk to be managed.
      *   **Finding (Colleagues):** **Strong Participant Stance.** They had capacity. They chose to conceal. They are fully responsible for the conspiracy of silence.
      *   **Uncomfortable Outcome:** The Committee *hates* this. They want to protect the Surgeon's dignity (Participant Stance allows for remorse/redemption; Objective Stance treats him as a broken tool to be removed). Simultaneously, blaming the colleagues (who acted out of loyalty) feels like punishing care. But the SIRP dictates: The Surgeon is exempt (manage medically), the Colleagues are agents (blame morally). The Committee must file a finding that effectively ends the Surgeon's career without a "hearing" (Objective) while recommending censure for his friends (Participant). This creates deep interpersonal friction the Committee dislikes.

  ---

  ## Part III: What This Procedure Cannot Do

  1.  **It Cannot Restore Trust:** Determining the correct Strawsonian stance clarifies *why* we are angry or sympathetic, but it does not repair the breach between the patient's family and the hospital. That requires a separate restorative justice process.
  2.  **It Cannot Solve Resource Scarcity:** In Case 1 (Resident), the procedure identifies systemic coercion, but it cannot mandate hiring more staff. It can only record the moral distortion caused by the shortage.
  3.  **It Cannot Predict Recidivism:** A "Mitigated Participant" finding is a moral classification, not a risk assessment. A clinician can be morally blameless but statistically dangerous. The CMO must weigh the Stance against actuarial risk separately.
  4.  **It Cannot Absolve the Institution of Complicity:** By focusing on the *clinician's* stance, there is a risk the hospital uses this to look rigorous while ignoring its own corporate moral agency. The Committee must ensure a parallel review of *administrative* actors occurs, or this becomes a tool for scapegoating staff while protecting leadership.
  5.  **It Cannot Handle "Black Box" Algorithms:** If Step 1 reveals the algorithm is truly opaque (no epistemic access), the Procedure forces an Objective Stance toward the clinician. It cannot assign blame to the software vendor. That liability remains in a legal, not moral, domain.

  **Chair's Note:** This protocol replaces "Just Culture" vagueness with philosophical precision. It will feel colder. It will force us to treat sick colleagues as objects and tired colleagues as agents. That discomfort is the price of moral clarity.
