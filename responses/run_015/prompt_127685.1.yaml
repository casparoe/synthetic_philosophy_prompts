answer: |-
  Here is a structured teaching plan designed to move students from single-cause intuition to a precise understanding of causal redundancy, using the *Vasa* while avoiding the "history is complicated" trap.

  ### 1. The Explanation Arc (Exact Order)

  **Phase 1: The "Smoking Gun" Intuition (10 mins)**
  *   **Goal:** Establish the baseline single-cause model to break it later.
  *   **Action:** Ask students: "If I smash a window with a rock, what caused it to break?"
  *   **Expected Answer:** "The rock."
  *   **Philosophical Move:** Formalize this as the **Counterfactual Dependence Test**: *If C had not occurred, E would not have occurred.* (No rock $\rightarrow$ no break).
  *   **Transition:** "History rarely gives us one rock. It gives us a hailstorm. But does 'many causes' just mean 'it's complicated,' or is there a logical structure we can map?"

  **Phase 2: The *Vasa* Setup – Stipulating Sufficiency (15 mins)**
  *   **Goal:** Introduce the case without getting bogged down in historical debate.
  *   **Action:** Present the three flaws: (1) Top-heavy design, (2) Ballast shift, (3) Open gunports.
  *   **Crucial Instruction:** You must **stipulate** for the sake of the seminar that historical evidence suggests *each* of these flaws was **individually sufficient** to sink the ship in those specific conditions.
      *   *Script:* "Historians debate this, but for our logical test, assume the wind was so strong that the top-heaviness *alone* would have capsized her. Assume the ballast shift *alone* would have capsized her. Assume the open ports *alone* would have flooded her."
      *   *Why:* If you don't stipulate this, students will argue the causes were only sufficient *together* (complementary), which breaks the overdetermination lesson.

  **Phase 3: The Fork – Complementary vs. Redundant (20 mins)**
  *   **Goal:** Distinguish "messy multi-causality" from "overdetermination."
  *   **Concept A (Complementary):** Causes work like a lock and key. Remove one, the effect vanishes. (Most historical events are this).
  *   **Concept B (Redundant/Overdetermined):** Causes work like backup executioners. Remove one, the effect remains.
  *   **The Test:** Apply the **Counterfactual Removal Test**.
      *   *Ask:* "If we magically fix the ballast (Cause 1), does the ship still sink?"
      *   *If Yes:* Cause 1 was Redundant.
      *   *If No:* Cause 1 was Complementary.
  *   **Application:** Under your stipulation, the *Vasa* is **Overdetermined** (Redundant). If you fix the ballast, the open gunports still sink it. If you close the ports, the top-heaviness still sinks it.
  *   **Key Distinction:** Emphasize that Overdetermination is not about *how many* causes there are, but about whether the effect *depends* on any single one of them.

  **Phase 4: Heading Off Misconceptions (15 mins)**
  *   **Goal:** Prevent the two major errors before they solidify.
  *   **Misconception 1: The Epistemic Error.**
      *   *Student Thought:* "Overdetermination just means we don't know which cause was the real one."
      *   *Correction Point:* Immediately after Phase 3.
      *   *Script:* "Overdetermination isn't about our ignorance. Even if we knew *everything* about the wind and the wood, the ship still sinks. Both causes are 'real.' It is an ontological claim about the world, not an epistemic claim about our knowledge."
  *   **Misconception 2: The 'Everything is Overdetermined' Error.**
      *   *Student Thought:* "Since history is complex, isn't everything overdetermined?"
      *   *Correction Point:* During the Counterfactual Test.
      *   *Script:* "Most history is Complementary. If the Archduke's driver hadn't taken the wrong turn, the assassination likely fails. That cause was necessary. Overdetermination is the rare exception where causes are unnecessary because backups exist."

  **Phase 5: The Concrete Check (15 mins)**
  *   **Goal:** Verify they can apply the Redundancy Test, not just define it.
  *   **Activity:** "The Two-Hull Breach Variant."
  *   **Scenario:** Hand out a slip with this text: *"Imagine a modified Vasa. Two independent cannonballs strike the hull below the waterline at the exact same moment. Each hole is large enough to sink the ship on its own within 10 minutes."*
  *   **Task:** Students must answer two questions in writing:
      1.  "If Cannonball A had missed, would the ship sink?" (Yes/No + Why)
      2.  "Is Cannonball A a cause of the sinking?" (Yes/No + Why)
  *   **Success Criteria:** They must answer **Yes** to both. If they say "No" to #2 because A wasn't *needed*, they fail the test. This forces them to accept that a cause can be real even if it isn't necessary.

  **Phase 6: Wrap Up (5 mins)**
  *   **Goal:** Reconnect to historical explanation.
  *   **Takeaway:** "When historians argue about causes, they are often arguing about whether the factors were Complementary (INUS conditions) or Redundant. Knowing the difference tells us whether removing one factor would have changed history."

  ---

  ### 2. Case Requirements: What the *Vasa* Needs to Have (and Lack)

  To make the *Vasa* demonstrate **Redundancy** (Overdetermination) rather than just **Messiness** (Complementary Causation), you must enforce specific constraints on the narrative:

  *   **MUST HAVE: Independent Sufficiency.** You must explicitly state that Factor A creates a sufficient condition for E, and Factor B creates a *separate* sufficient condition for E. They cannot rely on each other to reach the threshold.
      *   *Bad:* "The ship was unstable AND the wind was strong." (These need each other).
      *   *Good:* "The ship was so unstable it would capsize in a breeze. ALSO, the gunports were so low water would flood in even if the ship stayed upright."
  *   **MUST LACK: Causal Interdependence.** The causes cannot be part of the same chain.
      *   *Avoid:* "The ballast shifted, which made the ship tilt, which opened the gunports." (This is a chain, not redundancy).
      *   *Ensure:* The causes operate via different mechanisms (e.g., one causes capsizing, one causes flooding) that both lead to sinking.
  *   **MUST LACK: Temporal Staggering.** If Cause A sinks the ship at 2:00 PM and Cause B would have sunk it at 2:05 PM, that is **Pre-emption**, not Overdetermination. For this seminar, stipulate they act simultaneously or near-enough that the effect happens once.

  **Pedagogical Warning:** Historically, the *Vasa* is likely a case of *Complementary* causation (INUS conditions). If a student pushes back saying, "Actually, without the wind, the top-heaviness wouldn't have mattered," do not fight the history. Pivot: *"Exactly. That would make it Complementary. But for this exercise, we are testing the logical structure of Overdetermination. So, assume the wind was a constant background condition and ask: Given the wind, were the flaws redundant?"*

  ---

  ### 3. Misconceptions & Timing

  | Misconception | What they think | Where to head it off | How to phrase the correction |
  | :--- | :--- | :--- | :--- |
  | **The "Real Cause" Fallacy** | "If there are two sufficient causes, only one is the 'real' cause; the other is background." | **Phase 3 (The Fork)** | "In overdetermination, both are fully causal. Neither is 'background.' The effect has two full parents." |
  | **The Epistemic Confusion** | "Overdetermination means historians can't decide which cause mattered." | **Phase 4 (Misconceptions)** | "Distinguish 'We don't know' from 'It didn't matter.' Overdetermination is when it genuinely didn't matter which one happened." |
  | **The Complexity Blur** | "Any time there are 3+ causes, it's overdetermination." | **Phase 3 (The Test)** | "Use the Removal Test. If removing one stops the effect, it's not overdetermination, no matter how many causes there are." |

  ---

  ### 4. The Concrete Check (Detailed)

  **The "Twin Torpedoes" Ticket**
  *   **Format:** A small slip of paper collected at the end.
  *   **Prompt:** "A submarine is hit by two torpedoes from different enemies at the exact same moment. Either torpedo alone would have sunk the sub. The sub sinks."
  *   **Question 1:** "Apply the Counterfactual Test to Torpedo A. If A had not fired, would the sub sink?"
  *   **Question 2:** "Is Torpedo A a cause of the sinking? Explain why, given your answer to Q1."
  *   **Grading Key:**
      *   Q1 must be **Yes**.
      *   Q2 must be **Yes**.
      *   Explanation must reference **Redundancy** or **Sufficiency without Necessity**.
      *   *Fail State:* If they answer "No" to Q2 because "The sub would have sunk anyway," they have confused *necessity* with *causation*.

  ---

  ### 5. Scope Limits: What to Leave Out

  To keep this accessible for second-years without formal causation training, explicitly exclude the following. Tell the students: *"We are bracketing these out not because they aren't important, but because they require tools we don't have time for today."*

  1.  **Probabilistic Causation:** Do not discuss causes that raise the *probability* of an effect (e.g., "Smoking causes cancer" but not every smoker gets it). Stick to deterministic examples (Sinking/Not Sinking) for clarity.
  2.  **Pre-emption:** Do not introduce cases where Cause A happens slightly before Cause B and "cuts off" B's causal power (e.g., Assassin A shoots, Assassin B's bullet arrives too late). This confuses the redundancy test. Stick to simultaneous sufficiency.
  3.  **Metaphysics of Causal Powers:** Avoid debates about whether causation is a "force" or a "regularity." Stick to the **Counterfactual Dependence** model (Lewis-style) as it is the most intuitive for history students.
  4.  **INUS Conditions:** Do not use the acronym "INUS" (Insufficient but Non-redundant part of an Unnecessary but Sufficient condition). It is the precise technical term for Complementary Causation, but it will confuse second-years. Describe the *structure* instead of naming the *theory*.
