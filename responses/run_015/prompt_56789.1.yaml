  I didn't say "together we build a better future." I didn't say "trust the process." I didn't say "the community knows best." Those phrases smooth over the conflict. They pretend the trade-offs don't exist. They are comforting lies. I also didn't mention the vendor's capabilities. They can build anything. That's not the bottleneck. The bottleneck is our willingness to say one group gets less so another gets more. A smoother speaker would promise unity. I am promising clarity. Unity is for the closing remarks. Clarity is for the opening.
