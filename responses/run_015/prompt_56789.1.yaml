  - Cold open (~120 words)
  Good evening. Look at this mic. It amplifies voice, but it doesn't choose who speaks. That's our job. The flyer says this system will do what the community tells it to. Impossible. A spreadsheet cannot hear a crowd. It can only count. And how we count changes who wins. I've been here nine years. You know me. I work in data. Tonight, we aren't burying anything. We are digging up the rulebook. If we pretend the math is neutral, we lie to the East Side residents who waited two years. We lie to the union crews who have to pour the concrete. So let's drop the magic words. Let's talk about the counting.

  - Walking back the flyer (~150 words)
  The flyer says the system listens. Systems don't listen. They execute instructions. When fifty people want trees and fifty want lights, the system needs a tiebreaker. That tiebreaker isn't in the code. It is a judgment disguised as arithmetic. I cannot tell you what the city should prioritize. But choosing how to aggregate requests is itself a choice. Silence is not neutral. Ignoring the volume of requests is not neutral. Counting every resident equally is not neutral. Each method helps someone. Each method hurts someone. The flyer suggests the community speaks with one voice. It does not. It speaks in competing frequencies. Our job is not to hear the voice. Our job is to build the ear. That choice belongs to this panel.

  - Three ways to split a pot (~180 words)
  We have fourteen million dollars. We have five districts. Here are three rules. Rule one: Money per person. Every resident counts equal. The dense neighborhoods get most of the cash. The East Side, with fewer people per mile, gets less. Rule two: Money per request. One complaint, one vote. The neighborhood with the civic association and the spreadsheet wins. They filed four thousand requests. They get the trees. The quiet blocks get nothing. Rule three: Money per unit of need. We measure heat islands. We measure crash rates. The East Side wins. The wealthy hills call it unfair. Three rules. Three different maps. Only one pot of money. You cannot draw all three. You must pick one. Each sounds fair. Each produces a different winner. The engineers built the machine to run any of these. They did not build the machine to choose. That choice is political. It is not technical. No algorithm optimizes for fairness without defining fairness first.

  - What you're actually here to decide (~150 words)
  So look at your worksheets. Do not circle the projects yet. Do not argue about specific streets. Your first task is to pick the ruler. Decide whose voice weighs more when voices conflict. Does a request from a heat zone count double? Does volume matter more than density? Write that down. Put it in the system before you look at the map. If you skip this, the default setting wins. The default setting is whoever shouted loudest last year. That is not democracy. You are the filter. Set the filter. Make the trade-off explicit. If you choose need, someone else gets less. If you choose volume, quiet streets lose. Own the rule. Then, and only then, pick the projects.

  - The landing (~80 words)
  When I sit down, the clock starts. You have the pen. The map is blank. The money is real. People are watching. Do not look for consensus on the outcome. Look for agreement on the method. If you agree on the rule, you can live with the loss. Start there. Build the ear. Then listen.

