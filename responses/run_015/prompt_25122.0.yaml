answer: |-
  # The Special Composition Question: Find Your View

  **Start Here:** Think about a **wooden chair**.
  *Is the chair a single object, or is it just many pieces of wood arranged next to each other?*

  *   **It is just many pieces of wood (No single object).** → Go to **Question 2**.
  *   **It is a single object.** → Go to **Question 3**.

  ***

  **Question 2:** Think about a **living cat**.
  *Is the cat a single object, or is it just many cells arranged next to each other?*

  *   **It is just many cells (No single object).** → **LEAF: Mereological Nihilism**
      *   *View:* Nothing ever composes anything. Only the smallest particles (simples) exist. There are no chairs, no cats, and no people—only particles arranged chair-wise or cat-wise.
  *   **It is a single object.** → **LEAF: Van Inwagen's Organicism**
      *   *View:* Composition happens only when the parts are alive. Living beings exist, but artifacts (like chairs) and corpses do not; they are just particles arranged in specific ways.

  ***

  **Question 3:** Think about **the Eiffel Tower and your left shoe** taken together.
  *Do these two things form a single, new object (a "Tower-Shoe")?*

  *   **Yes, they form an object.** → **LEAF: Mereological Universalism**
      *   *View:* Any collection of things composes an object, no matter how scattered or random. There is an object made of your shoe and the Eiffel Tower, just as there is a chair.
  *   **No, they do not form an object.** → Go to **Question 4**.

  ***

  **Question 4:** Think about a **living cat** again.
  *Is the cat a single object?*

  *   **No, it is just many cells.** → **LEAF: [UNOCCUPIED] Artifact-Only Realism**
      *   *Diagnosis:* No one defends this because it implies human-made tools are real objects while biological beings are not, contradicting both science and moral intuition.
  *   **Yes, it is a single object.** → Go to **Question 5**.

  ***

  **Question 5:** Think about a **heap of sand**.
  *Does the heap count as a single object?*

  *   **Yes, it is a single object.** → **LEAF: [UNOCCUPIED] Aggregate Realism**
      *   *Diagnosis:* No one defends this because it accepts vague objects like heaps while rejecting scattered sums, lacking a clear principle for where "connection" stops mattering.
  *   **No, it is just many grains.** → **LEAF: Commonsense Restrictivism**
      *   *View:* Ordinary things like chairs and cats exist, but arbitrary sums (Tower-Shoe) and loose aggregates (heaps) do not. Composition is limited to functional or cohesive units.

  ***

  **Note on Indistinguishable Views:**
  This tree separates positions based on **which objects exist** (extensions). It cannot separate views that agree on which objects exist but disagree on **why** (intensions). For example, two different philosophers might both land on **Commonsense Restrictivism** but disagree on whether chairs exist because of their function, their physical bonding, or our language conventions. The tree identifies the outcome, not the reasoning.
