answer: |-
  Here is a 50-minute battle plan designed to force the problem out of the students rather than presenting it to them.

  ### 1. The One Example (and why)
  **Stick to the Standard Case (Statue and Lump).**
  Do not use the Kiln (chemical change) or the 3D Printer (temporal gaps).

  *   **Why:** The puzzle of material constitution is specifically about *synchronic* coincidence and *modal* differences (what *could* happen to the object).
  *   **The Kiln** introduces "same matter" disputes (chemistry vs. metaphysics). Students will argue about atoms, not ontology.
  *   **The 3D Printer** introduces "gaps in existence." Students will argue about intermittent objects, not constitution.
  *   **The Standard Case** isolates the variable you want: **Persistence Conditions.**
  *   **The Setup:** A lump of clay is shaped into a statue. At 12:00 PM, they occupy the exact same space. At 12:05 PM, the statue is squashed into a ball.
  *   **What it must have:** Reversibility for the clay (it can be re-shaped), Irreversibility for the statue (it is destroyed).
  *   **What it must lack:** Any change in the *matter* itself during the squashing. The atoms don't vanish; the arrangement changes.

  ### 2. The Sequence & Dependency Structure
  *Goal: Make "Two things in one place" the unavoidable conclusion of an argument, not the opening premise.*

  **00:00 – 05:00: Establish the Co-location (without asking permission)**
  *   **Action:** Draw a blob on the whiteboard. Label it "The Clay." Draw a outline around it. Label it "The Statue."
  *   **Ask:** "At 12:00 PM, before I squash it, how much stuff is on the table?"
  *   **Target:** Get them to agree there is one quantity of matter.
  *   **Trap:** Do not ask "Are there two objects?" yet. Ask "If I weigh the clay, and I weigh the statue, do the scales read differently?" (No). "If I measure the volume?" (No).
  *   **Board State:** One spatial region, one mass, two labels.

  **05:00 – 15:00: The Wedge (Leibniz's Law)**
  *   **Action:** Introduce the squashing event at 12:05 PM.
  *   **Ask:** "I squash the ball. Is the clay destroyed?" (No, it's still there). "Is the statue destroyed?" (Yes, it's a ball of clay now, not a statue).
  *   **Board State:** Create two columns: **Properties of The Clay** vs. **Properties of The Statue**.
      *   Clay: Survives squashing. Could exist without being statue-shaped.
      *   Statue: Does not survive squashing. Cannot exist without being statue-shaped.
  *   **The Move:** Invoke Leibniz's Law (Indiscernibility of Identicals). "If $x$ is identical to $y$, they share all properties."
  *   **The Squeeze:** They have different properties (one survives, one doesn't). Therefore, by LL, they are not identical.
  *   **Result:** We have established Non-Identity *before* addressing Co-location.

  **15:00 – 25:00: The Crisis (Coincidence)**
  *   **Ask:** "Okay, they aren't identical. But at 12:00 PM, they were in the exact same place, made of the exact same atoms, weighing the exact same amount. How many things were on the table at 12:00?"
  *   **The Forced Conclusion:** If they are not identical, but they are both there, there must be **two things in the same place at the same time.**
  *   **Note:** This is where last year failed. Now, it's not an intuition pump; it's the logical consequence of the survival difference. If they say "No, impossible," ask them to point to the step in the Leibniz's Law argument that was wrong.

  **25:00 – 35:00: The Escape Routes (Addressing Misconceptions)**
  *   This is where you deploy the defenses against the "cheap answers." (See Section 3 below).

  **35:00 – 45:00: Evaluating the Costs**
  *   Don't solve it. Weigh the costs.
  *   **Option A (Coincidence):** Accept two things in one place. (Cost: Violates common sense physics).
  *   **Option B (Constitution is Identity):** Deny Leibniz's Law or deny the survival difference. (Cost: Says the statue *is* the clay, so the clay should have been destroyed when squashed. But it wasn't).
  *   **Option C (Eliminativism):** There is no statue, only clay. (Cost: Error theory about ordinary objects).

  **45:00 – 50:00: The Final Question**
  *   (See Section 5).

  ### 3. Misconception Management (Order & Defusal)
  *Address these in this specific order as they arise during the "Escape Routes" phase.*

  **1. The "Nothing But" View (Reductionism)**
  *   *Student says:* "The statue is nothing but the clay arranged statue-wise. It's one thing under two descriptions."
  *   *When:* Usually the first defense against Coincidence.
  *   *Defusal:* **Modal Properties.** Descriptions don't change what *can* happen to the object. "If I describe a bomb as 'a device' vs 'a weapon', does it explode differently?" No. The clay *can* survive the squash. The statue *cannot*. If they were one thing, it would both survive and not survive. That's a contradiction, not a description.

  **2. The CS Contingent (Pointer Equality / Classes)**
  *   *Student says:* "In code, `Statue` is just a class inheriting from `Clay`. It's the same memory address. You're confusing the reference with the object."
  *   *When:* Often arises during the Leibniz's Law section.
  *   *Strategy:* **Use it, then break it.**
  *   *Defusal:* "In OOP, if I call `clay.squash()`, does the object persist? Yes. If I call `statue.squash()`, does the object persist? If the class `Statue` has a method `onSquash()` that triggers `delete this`, then the object is gone."
  *   *The Point:* "You are admitting that the *lifecycle conditions* (the class definition) are different. In metaphysics, we care about the lifecycle, not just the memory address (the matter). If the lifecycle conditions differ, can they be the same object? Your code says no: one reference dies, the other stays alive. You are arguing for *two objects* sharing a *memory address*. That is exactly the Coincidence View."
  *   *Goal:* Convert their "Pointer Equality" intuition into an argument *for* coincidence (two references, one data store), which forces them to defend why two references can't point to one data store in reality.

  **3. The "Fact of the Matter" (Epistemicism)**
  *   *Student says:* "There is a fact about whether they are identical, we just don't know it."
  *   *When:* When they feel the tension but want to avoid the weirdness.
  *   *Defusal:* "What would settle it? If we had a better microscope? If we asked God?" Remind them this isn't a measurement problem. It's a conflict between **Logic** (Leibniz's Law) and **Intuition** (No two things in one place). One has to give.

  **4. The "Just Coincide" (Dogmatism)**
  *   *Student says:* "Okay, two things in one place. So what? Problem solved."
  *   *When:* At the end, to close the discussion too quickly.
  *   *Defusal:* "If two things can be in one place, why not three? Why not a million? If I have a 'Statue', a 'Lump', and an 'Artifact', are there three things in my hand? If so, when I buy a statue, do I buy three things? This explodes our counting practices."

  ### 4. What to Explicitly Exclude ("Out of Bounds")
  *Say this at the start or when a student tries to jump ahead:*
  "We are not talking about **Time Slices** (4Dism) today. We are treating objects as enduring through time. We are also not talking about **Mereology** (parts and wholes) in the technical sense. If you try to solve this by saying 'objects are just sums of atoms,' I will stop you, because the atoms are the same for both. We are looking at the *object level*, not the *atom level*."

  *Why:* 4Dism solves the problem by saying the statue and clay are different *temporal parts* of a larger worm. This is the correct technical solution in many frameworks, but it requires a theory of time you haven't taught yet. It acts as a "Get Out of Jail Free" card that prevents them from feeling the tension of the 3D puzzle.

  ### 5. The Final Question
  *Do not ask "What is the solution?" Ask this:*

  **"If you claim the Statue and the Clay are distinct objects that coincide, you must explain: At exactly what moment did they become distinct?"**

  *   **Why this works:**
      *   If they say "When the statue was created," ask: "Was the clay there before? If so, was the clay distinct from the statue-before-it-existed? That makes no sense."
      *   If they say "They are always distinct," ask: "Before the clay was shaped, was there a statue-shaped object waiting to be filled? (No). So how did a new object pop into existence without new matter?"
      *   **The Separator:** A student who has memorized "different persistence conditions" will stumble here. A student who understands the problem will realize that **Coincidence creates a problem of origin** (How do two things start in the same place at the same time?), while **Identity creates a problem of survival** (How does one thing survive and not survive?).
      *   **The Goal:** You want them to leave knowing that *every* answer has a terrible cost.

  ### Whiteboard Layout Plan
  1.  **Left Column:** "The Clay" (Properties: Survives squash, existed before shaping).
  2.  **Middle Column:** "12:00 PM" (Same Mass, Same Volume, Same Atoms).
  3.  **Right Column:** "The Statue" (Properties: Dies on squash, did not exist before shaping).
  4.  **Bottom:** "Leibniz's Law: If Props Differ -> Objects Differ."
  5.  **Footer:** "Cost of Distinctness: Coincidence. Cost of Identity: Contradiction."

  ### Summary of the "Fix"
  Last year you asked for their intuition on **Space** ("Can two things be in one place?"). They said no, and you had nowhere to go.
  This year, you force an argument about **Properties** ("Do they have different survival conditions?"). They must say yes.
  Once they say yes, Logic forces them to accept **Distinctness**.
  Once they accept Distinctness + Same Location, **Coincidence** is no longer a magic word; it is the only remaining logical option. They must now fight the Logic or the Intuition, rather than just rejecting the premise.
