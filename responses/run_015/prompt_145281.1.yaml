prompt: |-
  I'm running the week-4 tutorials for a first-year metaphysics module — eight students, 50 minutes, whiteboard only, no handouts — and my topic is material constitution, the statue and the clay. Please don't explain the problem to me, I've taught it badly once already; what I need is a plan for how to get it into their heads in one session, and I need the plan to be about the order things come in rather than a list of views.

  Context on why last year went wrong: I opened with can two things be in the same place at the same time, half the group just flatly said no, and nothing moved for the rest of the hour. So I think I need to know what has to be built first so that the coincidence answer feels forced on them instead of sounding like a magic word I pulled out of a hat. Complicating it: about a third of the tutees are joint honours with computer science, and last time that contingent immediately reached for objects and instances and classes — the statue is just an instance of a type and the clay is the data, identity is pointer equality, you mutated it in place so obviously its the same object — and I never worked out whether to fight that or use it, so I'd definately like to know where each of those gets headed off or converted into something that helps.

  The other thing I can't settle is the carrying example. I'm happy for it to be the standard one where the statue and the lump each get their own proper name (Goliath and Lumpl? I think that's from a 70s paper, but I don't want to lean on it) except I keep wanting to spice it, and I've invented two candidates: (a) the clay gets fired in a kiln, so the matter isn't chemically the same stuff afterwards, which I hoped would stop them leaning on same matter as if it were obvious; (b) a 3D-printed figurine that gets melted down and reprinted from the same filament in the same shape every night, so the matter persists and the form recurs with a gap in between. I suspect (b) is a second puzzle smuggled in about persistence through gaps and I should drop it, but you tell me: what does the one carrier have to have, and what does it have to lack? I don't want anything in the example doing philosophical work I haven't earned yet, and I don't want the squash it into a ball move to look like a trick.

  So the deliverable: the sequence of pieces and the dependency structure (where Leibniz's law goes, where constitution vs identity vs it's one thing under two descriptions gets introduced, whether four-dimensionalism and mereological sums get a mention at this level or get openly refused); the one example and the case for it; the misconceptions in the order they'll actually form — the CS ones, the there must be a fact of the matter and we just don't know it one, the the statue is nothing but the clay arranged statuewise one — and the exact point in the sequence to defuse each; one question I can put to them at the end that separates someone who sees why the cheap answers fail from someone who's just memorised the slogan different persistence conditions; and what I should say out loud that I'm not going to get into today.
reasoning: |-
  Here's a thinking process that leads to the suggested tutorial plan:

  1.  **Analyze the Request:**
      *   **Task:** Create a 50-minute tutorial plan for a first-year metaphysics module (Week 4).
      *   **Topic:** Material Constitution (Statue and Clay).
      *   **Constraints:** 8 students, whiteboard only, no handouts.
      *   **Specific Problem:** Last year failed because the tutor started with "Can two things be in the same place?" (Students said "No," discussion stalled). Need a sequence that *forces* the coincidence answer rather than stating it.
      *   **Student Demographic:** Includes Computer Science (CS) joint honours (tend to think in terms of instances/classes/pointers/mutation). Need to address this specifically (fight or use?).
      *   **Example Choice:** Deciding between standard (Goliath/Lumpl), Kiln (chemical change), or 3D Printer (gaps/reprinting). Need to select the *one* carrier example and justify it based on what it must have/lack.
      *   **Deliverables:**
          1.  Sequence of pieces/dependency structure (Leibniz's Law, Constitution vs. Identity, etc.).
          2.  The One Example (and why).
          3.  Misconception Management (Order of formation + defusal strategy, specifically CS ones).
          4.  The Final Question (tests understanding vs. memorization).
          5.  The "Out of Bounds" statement (what to explicitly exclude).

  2.  **Deconstruct the Pedagogical Failure:**
      *   *Why did "Can two things be in the same place?" fail?* Because it asks for an intuition about *space* before establishing an intuition about *objects*. If students think "Object = Matter," then "Two objects = Two matters." If the matter is the same, there's only one object. The question begs the question.
      *   *The Fix:* Start with *properties* and *history*, not space. Force a wedge between the "clay" and the "statue" based on what happens to them, not where they are.

  3.  **Address the CS Contingent:**
      *   *CS Intuition:* Object-oriented programming (OOP). `Statue s = new Statue(clay);`. Reference equality (`==`) vs. Value equality (`.equals()`). Mutation.
      *   *Risk:* They reduce metaphysics to syntax. "It's the same pointer, so it's the same object."
      *   *Strategy:* Don't fight it, *use* it but show its limits. Use the analogy of "Reference" vs. "Object Lifecycle." In code, you can have two references to one object, but here we are asking if the *lifecycle conditions* are different. If the object is destroyed when squashed, but the data (clay) persists, the *class definitions* differ. This maps well to "Sortal Concepts."

  4.  **Select the Example:**
      *   *Option A (Standard):* Statue/Lump. Squash the statue. Lump survives, Statue dies.
      *   *Option B (Kiln):* Chemical change. Complicates "same matter." Risks distracting into chemistry/physics.
      *   *Option C (3D Printer):* Gaps in existence. Risks distracting into temporal parts/intermittent existence.
      *   *Decision:* Stick to **Option A (Standard)** but refine the narrative. Why? Because the puzzle relies on *modal* differences (what *could* happen) and *persistence conditions* (what *does* happen upon squashing). Chemical changes and temporal gaps introduce *other* metaphysical puzzles (transubstantiation, intermittent existence) that clutter the specific puzzle of *constitution*. We want the matter to remain constant so the only variable is the *form/status*.
      *   *Refinement:* Don't name them Goliath/Lumpl immediately. Call them "The Statue" and "The Clay."

  5.  **Drafting the Sequence (Dependency Structure):**
      *   *Goal:* Make "Two things in one place" the *conclusion*, not the premise.
      *   *Step 1: Agreement on Existence.* Establish both exist.
      *   *Step 2: Agreement on Location.* Establish they overlap perfectly.
      *   *Step 3: The Wedge (Leibniz's Law).* Find a property one has and the other lacks. (Survival of squashing).
      *   *Step 4: The Crisis.* If properties differ, objects differ (LL). If objects differ, but location is same -> Coincidence.
      *   *Step 5: The Escape Routes.* Deny LL? Deny distinctness (Constitution is Identity)? Deny existence of one?
      *   *CS Integration:* Introduce at Step 3/4. "In code, does the variable `clay` survive the function `squash()` if the object `statue` is nullified?"

  6.  **Managing Misconceptions:**
      *   *Misconception 1: "It's just one thing described differently."* (The "Nothing But" view).
          *   *Defusal:* Modal properties. One *could* survive squashing, the other *could not*. Descriptions don't change modal facts.
      *   *Misconception 2: "There must be a fact of the matter we don't know."* (Epistemicism).
          *   *Defusal:* What fact? It's not a measurement error. It's a conceptual conflict.
      *   *Misconception 3 (CS):* "Pointer Equality."
          *   *Defusal:* Distinguish between the *memory address* (matter) and the *class type* (sortal). If I cast a `Statue` to `Clay`, does the `destroy()` method change?
      *   *Misconception 4: "Just say they coincide."* (Too easy).
          *   *Defusal:* Why is that weird? (Impenetrability intuition).

  7.  **The Final Question:**
      *   Needs to test if they understand *why* the cheap answers fail, not just recite "different persistence conditions."
      *   *Idea:* Ask them to apply the logic to a case where the intuition flips or where the "Constitution is Identity" view tries to salvage itself.
      *   *Better Idea:* Ask about the *moment* of divergence. If they are identical until the squash, when did they become distinct? (The "Too Many Minds" or "Temporal Identity" angle).
      *   *Best Idea:* Focus on the *cost*. "If you say they are distinct, what do you have to give up? If you say they are identical, what do you have to give up? Which cost is higher?"

  8.  **What to Exclude:**
      *   Four-dimensionalism (Perdurantism). Too complex for Week 4, solves the problem by changing the ontology of time.
      *   Mereological Universalism/Nihilism. Too technical.
      *   Deep dive into Sortals (just use the intuition).

  9.  **Refining the Plan (Self-Correction during drafting):**
      *   *Correction on CS:* Be careful not to validate the idea that metaphysics *is* code. Use code as a heuristic for *sortals*, not as a solution.
      *   *Correction on Example:* Ensure the "squash" is clear. It must be reversible for the clay (can be reshaped) but irreversible for the statue (ceases to exist).
      *   *Timing:* 50 mins is tight. 8 students means everyone can speak. Keep lectures to 5-min bursts.
      *   *Whiteboard:* Use it to track the "Properties" list.

  10. **Final Polish:** Check against the prompt's specific constraints (order of things, dependency structure, specific misconceptions, the "Out of Bounds" statement). Ensure the tone is practical for a tutor.

  *(Self-Correction on the "Final Question"):* The prompt asks for a question that separates those who see *why* cheap answers fail from those memorizing slogans. A good test is to ask them to defend the view they *don't* hold. Or, present a variation where persistence conditions align, and ask if the problem disappears. Let's go with the "When did they diverge?" question. It hits the "Constitution is Identity" view hardest.

  *(Self-Correction on CS):* The prompt mentions "objects and instances and classes." I need to explicitly map "Sortal" to "Class" and "Matter" to "Memory/Pointer." This validates their intuition while showing why it doesn't solve the metaphysical problem (because metaphysics cares about the *conditions of the class*, not just the pointer).

  *(Final check on Example):* Stick to the Standard (Statue/Clay). The Kiln introduces chemical identity (too physics-heavy). The 3D printer introduces temporal gaps (too much about time). The Standard case isolates *constitution*.

