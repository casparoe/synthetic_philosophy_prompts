answer: |-
  Nice catch on the typo (it's *sphexishness*, coined by Dennett), but honestly, your backend framing is sharper than most intro philosophy courses. You're hitting on a classic compatibilist trap: confusing *unpredictability* with *freedom*. If a decision tree is big enough, it looks like free will, but it's still just code executing.

  Here's the exam package, tuned to force them off the standard "determinism vs. indeterminism" rail and into your complexity framing.

  ***

  ### 1. Essay Question
  **Course:** PHIL 450 – Agency and Mechanism  
  **Time Allowed:** 45 Minutes  
  **Instructions:** Answer the following prompt in roughly 500–700 words. Do not cite specific authors or texts. Your grade depends on the structural integrity of your argument, not your recall of the literature.

  **Prompt:**
  Consider the digger wasp (*Sphex ichneumoneus*), which exhibits rigid behavioral loops when its routine is interrupted. Daniel Dennett termed this *sphexishness*: the mindless repetition of a script despite changed circumstances. A common rebuttal to hard determinism is that humans possess behavioral flexibility unlike the wasp; we do not loop, we adapt.

  However, suppose we model this distinction using computational architecture. The wasp operates on **behavioral caching**: precompiled scripts retrieved from memory with minimal conditional logic. Humans operate via **dynamic runtime computation**: evaluating novel inputs against a vast, weighted decision tree before executing an action. Both systems are physically deterministic; the difference is merely the complexity of the branching logic.

  If human freedom relies on this shift from caching to runtime computation, does it escape *sphexishness*? Argue whether "dynamic runtime computation" is sufficient for moral agency, or if it merely disguises a more complex deterministic script. You must address whether a difference in computational complexity constitutes a difference in *kind* regarding free will.

  ***

  ### 2. Model Answer (Approx. 600 Words)

  The distinction between behavioral caching and dynamic runtime computation offers a compelling architectural metaphor for the free will debate, but it ultimately fails to secure moral agency if the underlying substrate remains deterministic. The core error lies in conflating *computational complexity* with *metaphysical freedom*.

  To claim that humans escape *sphexishness* because we utilize runtime computation is to argue that a sufficiently complex loop ceases to be a loop. The wasp's behavior is deterministic: Input A (prey moved) triggers Routine B (drag prey) followed by Check C (burrow empty), leading to Loop A. The human behavior is also deterministic: Input X (social slight) triggers Evaluation Y (weigh consequences, recall norms, simulate outcomes) leading to Action Z (retaliate or forgive). In both cases, the state of the system at $t_1$ fully determines the state at $t_2$. The human "decision tree" may have billions of branches compared to the wasp's three, but if every branch is weighted by prior causes (genetics, environment, prior states), the output is as fixed as the wasp's ritual.

  Proponents of the runtime model might argue that flexibility allows for "override capabilities." Unlike the wasp, a human can recognize the loop and halt it. However, this recognition is itself a computational process. If the realization "I am looping" is caused by prior neural states, then the halt command is also determined. We are not stepping outside the code; we are simply executing a higher-order subroutine designed to detect lower-order loops. This is not freedom from determinism; it is merely determinism reflecting upon itself.

  Furthermore, treating complexity as a threshold for freedom creates a sorites paradox. At what number of branches does a script become "free"? If a robot with a million branches is determined, but a human with a trillion is free, we have invoked magic, not mechanics. If the difference is only in degree, then "free will" becomes a vague label for "behavior too complex to predict," rather than a genuine capacity to have done otherwise. This reduces agency to epistemic limitation: we look free only because we cannot trace the causal chains of our own runtime computation.

  However, this does not necessarily negate moral agency if we adopt a compatibilist framework. If we define freedom not as "freedom from causation" but as "freedom from coercion," then runtime computation matters. The wasp is coerced by its rigid script; it cannot process the "interrupt" signal. The human runtime architecture allows internal states (reasons, desires) to compete for output control. While the winner is determined by the weights, the process involves deliberation rather than retrieval.

  Yet, the prompt asks if this escapes *sphexishness*. In the strict sense of "mindless repetition," yes, humans escape it because our runtime evaluation introduces novelty. But in the philosophical sense of "could have done otherwise given the exact same prior states," no. The complex decision tree is still a tree rooted in deterministic soil.

  Therefore, dynamic runtime computation is insufficient for libertarian free will. It disguises the rigidity of determinism under layers of adaptive complexity. To claim otherwise is to mistake the sophistication of the script for the autonomy of the author. Unless the runtime system can rewrite its own weighting algorithms independent of prior causes—a logical impossibility in a closed physical system—it remains a sophisticated cache, merely fetching responses from a larger database of causal history. We are not free from the script; we are just running a heavier build.

  ***

  ### 3. Marking Scheme

  **A Grade (Excellent)**
  *   **The Complexity Trap:** Explicitly identifies that increasing branches/complexity does not logically escape determinism (the "degree vs. kind" argument).
  *   **Analogy Usage:** Uses the "caching vs. runtime" framing correctly to illustrate the argument, not just as decoration.
  *   **Nuance:** Distinguishes between *libertarian freedom* (could have done otherwise) and *compatibilist freedom* (acting according to internal reasons), acknowledging where the runtime model fails or succeeds for each.
  *   **No Fluff:** Avoids summarizing the wasp story beyond what is necessary to set up the argument.

  **B Grade (Good)**
  *   **Surface Engagement:** Accepts the caching/runtime distinction but argues that complexity *is* enough for freedom without addressing the deterministic substrate.
  *   **Partial Trap:** Acknowledges determinism but falls back on "humans are unpredictable" as a synonym for "free."
  *   **Analogy Drift:** Uses the CS terms but reverts to standard philosophical jargon (e.g., "causal chains") without linking them back to the prompt's framing.

  **C Grade (Fail/Mediocre)**
  *   **The Flexibility Fallacy:** Argues that because humans are flexible and wasps are rigid, humans are free, ignoring the prompt's constraint that flexibility might just be complex rigidity.
  *   **Summary Heavy:** spends >30% of the word count retelling the *Sphex* story or explaining Dennett.
  *   **Ignored Framing:** Ignores the "caching/runtime" instruction and writes a generic free will essay.

  **Specific Penalties**
  *   **-10%:** Citing authors (e.g., "As Dennett says...") when instructed not to.
  *   **-15%:** Treating "runtime computation" as inherently non-deterministic (e.g., claiming humans can break causality because they compute).
  *   **-20%:** Failing to address the "degree vs. kind" distinction regarding complexity.
