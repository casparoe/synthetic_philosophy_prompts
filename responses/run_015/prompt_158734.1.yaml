answer: |-
  Here is a battle plan for the 90 minutes, designed to keep the philosophy grads from getting bogged down in technicalia and the ML folks from dissolving the problem with engineering workarounds.

  ### 1. Sequencing: The Bayes Factor Trap
  You are correct to worry about the order. If you lead with the math, the ML group "solves" it with likelihood ratios. If you lead with the metaphysics, the ML group checks out.

  **The Sequence:**
  1.  **The Phenomenon (15 mins):** Start with the *psychological/epistemic event*, not the formula. Describe a scientist having a "Eureka" moment over a fact they've known for years. Establish the intuition: *Learning a connection can boost confidence, even if the fact doesn't change.*
  2.  **The Formalization (15 mins):** Translate that intuition into standard Conditionalization ($P_{new}(H) = P_{old}(H|E)$). Show the arithmetic breakdown ($P_{old}(E)=1 \rightarrow P_{new}(H)=P_{old}(H)$). **Now** the room agrees there is a tension.
  3.  **The ML Intervention (20 mins):** *Invite* the Bayes Factor objection here. "For those of you who work with likelihoods, $P(E)$ cancels out. Doesn't this dissolve the problem?"
      *   **Validate:** Acknowledge that for *model comparison* (choosing between $H_1$ and $H_2$), the Bayes Factor works fine.
      *   **Trap:** Then pivot to *absolute confirmation* and *agent updating*. Ask: "If $E$ was known, when did you set the likelihood $P(E|H)$?" If they say "Now," ask "Why wasn't it set to 1 (or the observed frequency) years ago?"
      *   **The Turn:** Show that the Bayes Factor hides the problem in the *assignment of the likelihood*. It pushes the "old evidence" problem back one step to "Why did the likelihood change?" This turns the ML solution into a restatement of the problem (the problem of *logical omniscience*), rather than a dissolution.
  4.  **The Core Mechanism (25 mins):** Discuss *why* the likelihood changed. This is where you introduce the distinction between *ontic* evidence (the fact) and *epistemic* evidence (the realization of the entailment).
  5.  **Wrinkles & Misconceptions (15 mins):** (See below).
  6.  **Final Exercise (15 mins):** (See below).

  **Why this works:** It lets the ML folks feel heard (BF is useful) before showing them that BF assumes a static agent who already knows all logical implications of their model. It forces the room to confront *logical omniscience* as the real bottleneck, not the normalization constant.

  ### 2. The Carrying Example
  **Keep Mercury, but sanitize the narrative.**
  Do not swap it. The Philosophy grads need the canonical reference to feel grounded, and the ML folks can handle the physics if you abstract it correctly. The problem with your current Mercury story is that it smuggles in *rival theory falsification* (Newton failing), which confuses POE with standard hypothesis testing.

  **How to tell it (The "Einstein at his Desk" version):**
  *   **Strip:** All talk of Newtonian failure, Leverrier, Vulcan, or rival theories.
  *   **Keep:** Einstein formulates GR ($H$) in 1915. The perihelion value ($E$) was known since 1859.
  *   **The Isolation:** Einstein sits alone. He derives $E$ from $H$. His confidence in $H$ skyrockets.
  *   **What it lacks:** It must lack *new data collection*. It must lack *community debate*. It is a solitary update on a static datum.
  *   **What it buys:** It isolates the *logical relation* discovery from the *empirical* discovery. It forces the ML folks to admit that their "training data" ($E$) shouldn't update the model weights ($H$) *unless* the model architecture itself changed to allow the connection to be computed. This bridges perfectly to the "Logical Omniscience" point.

  ### 3. The Two Wrinkles
  You need to separate the *structural* problem from the *sociological* problem.

  *   **Wrinkle (i) Relevance Discovery (The "Bearing was new"):**
      *   **Verdict:** **Genuine Variant.** This is the heart of the Garber/Jeffrey solution. The evidence isn't $E$; the evidence is "H entails E."
      *   **Placement:** Introduce this *after* the Bayes Factor discussion fails. When the ML folks ask "Why did the likelihood change?", you answer: "Because the agent learned a logical truth ($H \rightarrow E$) they didn't know before." This shifts the problem from Old Evidence to **Logical Omniscience**.
  *   **Wrinkle (ii) Agent Relativity (Old for me, new for community):**
      *   **Verdict:** **Red Herring.** This is a problem of *communication*, not confirmation.
      *   **Placement:** Drop this in the **Misconceptions** section. Frame it as: "If you think POE is just about who knows what when, you're confusing *psychology* with *normative rationality*." If Bayesianism is a theory of rational belief, it shouldn't matter if the community knew $E$; it matters if *this* agent's probability function allows $E$ to move $H$.
      *   **One-liner:** "POE isn't about gossip; it's about whether a rational agent can update on a tautology."

  ### 4. Misconceptions & Pre-emption
  Here are the specific interruptions to expect and where to kill them:

  1.  **"Just use the counterfactual prior (What if I didn't know E?)"**
      *   *Where:* During the "Core Mechanism" section.
      *   *The Kill:* "To do that, you have to 'de-learn' a fact. But you can't de-learn a fact without changing your entire web of belief (Holism). It's computationally and philosophically costly to pretend ignorance."
  2.  **"So Bayesianism can't handle being surprised."**
      *   *Where:* Intro.
      *   *The Kill:* "It handles surprise about *data*. POE shows it struggles with surprise about *implications*."
  3.  **"It's just Duhem/Quine (auxiliary hypotheses)."**
      *   *Where:* Misconceptions section.
      *   *The Kill:* "Duhem is about *falsification* (H + A $\rightarrow$ not-E). POE is about *confirmation* (H $\rightarrow$ E). They are mirror images, but the logic differs. Don't conflate them."
  4.  **"It's only a problem if priors are subjective."**
      *   *Where:* Misconceptions section.
      *   *The Kill:* "Objective Bayes requires constraints on priors. If $P(E)=1$ is a constraint, Objective Bayes freezes too. It hits everyone."
  5.  **"That's about discovery, not confirmation, so who cares."** (The Big One)
      *   *Where:* **Opening.** Pre-empt this immediately.
      *   *The Kill:* "If confirmation is just 'fitting data,' then post-hoc fitting counts as much as prediction. But science treats novel prediction as stronger. If Bayesianism can't distinguish explaining old data from predicting new data, it fails to capture scientific practice."

  ### 5. Scope Limits (What to Refuse)
  Openly state you are **not** solving the following, or the session will bleed out:
  1.  **The Solution:** "We are not agreeing on a solution today (Garber vs. Jeffrey vs. Counterfactual). We are agreeing on the *structure* of the failure."
  2.  **Hyper-intensional Logic:** "We are not formalizing the logic of 'entailment' today. We are treating 'H entails E' as a black box that the agent discovers."
  3.  **Frequentism:** "We are not debating whether Frequentism handles this better. We are debugging Bayesianism."

  ### 6. The Final Five Minutes (The Assessment)
  Hand them this pair. Ask: **"In which case does the old evidence confirm the hypothesis, and why?"**

  *   **Case A (The "Fit"):** A data scientist fits a 10th-order polynomial to 10 existing data points. The model ($H$) entails the data ($E$) perfectly ($P(E|H)=1$). The data was known before the model was chosen.
  *   **Case B (The "Derivation"):** A physicist derives a specific constant value ($E$) from a fundamental theory ($H$) using a new mathematical technique. The value ($E$) was measured and known before the theory was formulated.

  **The Correct Verdict:**
  *   **Case A:** No confirmation (or negligible). This is overfitting. The connection is trivial/artifactual.
  *   **Case B:** Strong confirmation.
  *   **The Difference:** **Risk / Novelty of the Connection.**
      *   In Case A, the model was *constructed* to fit $E$. The likelihood was rigged.
      *   In Case B, the model was *constrained* by principles independent of $E$, and $E$ fell out as a consequence.
      *   **The Structural Takeaway:** Confirmation requires that the hypothesis *risked* falsification by the old evidence. If the agent could have tweaked $H$ to fit $E$ without cost (Case A), learning the fit confirms nothing. If $H$ was fixed by other constraints and *happened* to entail $E$ (Case B), learning the entailment confirms $H$.

  This forces them to move beyond "P(E)=1" and talk about **model flexibility** and **independent constraints**, which is the modern ML-compatible way of understanding why some old evidence counts and some doesn't.
