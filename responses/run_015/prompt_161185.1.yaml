answer: |-
  Here is the session plan. It is designed to force the "Scatter vs. Cluster" distinction without getting bogged down in jargon.

  ### 1. The Carrying Example: "The Overheat Shutdown"
  Do not use "Pain" for the example. Use an engineering analog they can inspect physically. Pain is the *target* of the argument; the example is the *wedge*.

  **The State:** `TRIP` (The state of a system that causes it to shut down to prevent damage).
  **The Constraint:** You must populate the whiteboard with four realizers of `TRIP` that share **no physical natural kind**.

  **Draw four quadrants on the board. Fill them as follows:**
  1.  **Bimetallic Strip:** Two metals bonded together. Heat $\rightarrow$ differential expansion $\rightarrow$ bend $\rightarrow$ breaks contact. (Thermal/Mechanical)
  2.  **Thermistor:** Semiconductor. Heat $\rightarrow$ resistance drops $\rightarrow$ voltage divider trips comparator. (Electrical/Quantum)
  3.  **Wax Pellet:** Solid wax in piston. Heat $\rightarrow$ phase change/expansion $\rightarrow$ pushes pin. (Chemical/Phase)
  4.  **Memory Metal (Nitinol):** Alloy. Heat $\rightarrow$ crystal structure change $\rightarrow$ contracts. (Metallurgical/Lattice)

  **What this example MUST have:**
  *   **Heterogeneous Physics:** One relies on bending, one on electron flow, one on phase change, one on lattice shifting. There is no single variable (like "voltage" or "pressure") that describes all four.
  *   **Causal Equivalence:** They all do the exact same job (break the circuit/stop the engine).

  **What this example MUST lack:**
  *   **Computation:** Do not allow "Software reads temperature" as a realizer. That invites the "Mind = Program" trap. You want them to see that *physical mechanisms* can be multiply realizable without invoking abstraction layers.
  *   **Shared Substrate:** No silicon in the wax, no metal bending in the thermistor.

  **Why:** If you use software, they will think MR is about *abstraction* (Functionalism). If you use wax/metal/electricity, they see MR is about *physics*. This forces the realization that "Pain" might not be a physical *type*, even if it is a physical *token*.

  ---

  ### 2. Dependency Order (Whiteboard Sequence)
  Do not define "Type Identity" until you have broken it. The definitions must emerge from the failure of the example to unify.

  **Phase 1: The Target (5 mins)**
  *   **Board Left:** Write `PAIN = C-FIBER FIRING`.
  *   **Say:** "This is the hypothesis we are testing. It says mental states are identical to brain states, specifically. Not correlated, *identical*. Like `Water = H2O`."
  *   **Reason:** You need a strong claim to break. If you start with nuances, they won't feel the impact of the counter-example.

  **Phase 2: The Wedge (15 mins)**
  *   **Board Center:** Draw the four quadrants (The Overheat Example).
  *   **Action:** Ask them to find the single physical property common to all four that causes the `TRIP`.
  *   **Outcome:** They will fail. They might suggest "Energy," but that's too broad (everything has energy). They might suggest "Entropy," but that's not the mechanism.
  *   **Board Center Bottom:** Write `TRIP ≠ [Single Physical Property]`.
  *   **Reason:** This creates the cognitive dissonance. The *state* is real and identifiable, but the *physics* are scattered.

  **Phase 3: The Distinction (10 mins)**
  *   **Board Right:** Derive **Type vs. Token** *from* the failure above.
  *   **Say:** "In the wax pellet, the `TRIP` *is* the wax expanding. In the thermistor, the `TRIP` *is* the resistance drop. Each instance is physical (Token Identity). But there is no one physical kind they all share (Type Identity Failure)."
  *   **Map to Pain:** "So, `Pain = C-Fibers` is false (Type). But `This Pain = This C-Fiber Firing` is true (Token)."
  *   **Reason:** Don't teach the distinction beforehand; let them feel the need for it. It sticks better when it's the solution to a puzzle they just failed to solve.

  **Phase 4: The Objections (10 mins)**
  *   Address misconceptions here (see map below).

  **Phase 5: The Check (5 mins)**
  *   Ask the final question.

  ---

  ### 3. Misconception Map
  Here is where you intercept the specific derailments you anticipate.

  | Misconception | When it arises | How to defuse (Script) |
  | :--- | :--- | :--- |
  | **"Mind = Software / Brain = Hardware"** | **During Phase 2.** Someone will suggest a microcontroller as a realizer. | **Block it.** "If we use code, we're assuming the mind is a program. That's Functionalism, not Identity Theory. We are testing if the *physics* line up. Stick to the wax and the metal." |
  | **"So the mind isn't physical at all?"** | **During Phase 3.** When you say Type Identity fails. | **Clarify Token Identity.** "No. The wax is physical. The circuit is physical. The pain is physical. We aren't saying it's magic; we're saying it's not *one specific kind* of physical stuff." |
  | **"Fine, Token Identity solves it."** | **During Phase 4.** They think the problem is gone. | **Raise the Cost.** "It solves the logic, but it kills the neuroscience. If Pain isn't a Type, you can't look for 'the pain center.' You have to study humans, then octopuses, then robots separately. It fragments the science." |
  | **"The Disjunction Save"** (Pain = C-Fibers OR Wax OR Thermistor...) | **End of Phase 4.** The sharp objection. | **Concede & Qualify.** "Yes, you *can* define a disjunctive kind. But is 'C-Fibers OR Wax OR Nitinol' a scientific kind? Or is it just a list? If the list is infinite/scattered, it's not a useful category for prediction." |
  | **"At what grain level?"** | **During Phase 4.** | **Defer.** "That's the 'Level' problem. For now, accept that 'Bending' and 'Resistance Drop' are different grains. If we can't unify them at *any* reasonable physical grain, Type Identity fails." |

  ---

  ### 4. The Final Check Question
  Do not ask "Do you understand?" Ask a question that forces them to choose between **Portability** (Software trap) and **Scatter** (The point you want).

  **The Question:**
  > "Imagine we discover that humans and octopuses both use glutamate to feel pain. Does that prove Multiple Realizability is wrong?"

  **The Correct Answer (Scatter):**
  "No. That just means we looked at a **cluster**. It proves Type Identity works for *earth biology*, but it doesn't prove it works for silicon, aliens, or AI. The scatter is still possible outside the cluster."

  **The Wrong Answer (Portability):**
  "Yes, because they share a mechanism." (This shows they missed the scatter point and think MR is just about different species having different biology).

  ---

  ### 5. Topics to Explicitly Refuse
  You have 45 minutes. These three topics will eat 90 minutes and derail the specific logic you want to teach. Write "OUT OF SCOPE" on the corner of the board at the start.

  1.  **Qualia / The Hard Problem:** "Does the wax *feel* the heat?" No. We are talking about state identity, not subjective experience. Keep it to functional states.
  2.  **AI Consciousness:** "If a robot trips, is it pain?" No. We are asking if the *state* is identical to the *substrate*, not if the robot is alive.
  3.  **Dualism:** "Is the mind a soul?" No. We are assuming physicalism. Token Identity keeps us physicalists. Do not let them drift into Cartesian dualism.

  ### Summary of Board Layout
  *   **Left:** `PAIN = C-FIBERS` (The Claim)
  *   **Center:** 4 Quadrants (Bimetal, Thermistor, Wax, Nitinol) $\rightarrow$ `TRIP` (The Scatter)
  *   **Right:** `Type Identity: FALSE` / `Token Identity: TRUE` (The Consequence)
  *   **Corner:** `OUT OF SCOPE: Qualia, AI Rights, Souls`
