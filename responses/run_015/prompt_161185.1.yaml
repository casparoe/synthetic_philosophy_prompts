          *   Realizer 4: Wax melts (Chemical/Phase).
          *   *Constraint Check:* Is this just "code on different chips"? No. A bimetallic strip is not running code. A wax pellet is not running code. They are physically heterogeneous. This forces the "Scatter" point.

  4.  **Sequence & Dependency Order:**
      *   *Start:* Don't start with definitions. Start with the intuition.
      *   *Step 1:* Establish the Target (Type Identity). "Pain = C-Fibers."
      *   *Step 2:* Introduce the Example (Overheat State).
      *   *Step 3:* Show the Scatter (The 4 realizers).
      *   *Step 4:* Derive the Distinction (Type vs. Token) from the failure of the example to unify physically.
