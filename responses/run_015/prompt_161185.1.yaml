      *   *Software/Hardware:* Defuse early by choosing non-computational realizers (wax, metal).
      *   *Mind isn't physical:* Defuse by emphasizing Token Identity (each instance *is* physical, just not the *same* physical type).
      *   *Token Identity solves it:* Acknowledge yes, but note it changes the project of neuroscience (can't look for *the* pain center).
      *   *Disjunction Problem:* This is the hard one. Acknowledge it as the "Save" for Identity Theory but explain why it's unsatisfying (gerrymandered kind).
      *   *Grain/Level:* Concede that "Level" matters, but insist that across substrates (silicon vs. meat), the level gap is too wide for identity.

  6.  **Drafting the Plan (Iterative refinement):**

      *   *Time Management:* 45 mins is tight.
          *   0-5: Setup & Type Identity.
          *   5-20: The Example & Scatter.
          *   20-30: Type vs. Token derivation.
          *   30-40: Objections (Disjunction, Dualism).
          *   40-45: Wrap & Check.

      *   *Whiteboard Layout:*
          *   Left: Type Identity Claim.
          *   Center: The Example (4 quadrants).
          *   Right: Conclusions/Objections.

      *   *Refining the Example:* The user specifically said "don't explain the topic to me." I need to be prescriptive.
      *   *Example:* **"The State of 'Being Locked'."**
          *   1. Deadbolt (Metal pin in hole).
          *   2. Magnetic Seal (Electromagnet active).
          *   3. Glue (Chemical bond).
          *   4. Software Flag (Variable `is_locked = true` in RAM).
          *   *Why:* It's binary (like pain/no pain). It's functional (keeps door shut). It is physically scattered (mechanical, magnetic, chemical, electrical/abstract).
          *   *Wait, Software Flag:* The user said *avoid* "same code on different chips." A software flag is risky. Let's swap #4 for **A Wooden Bar Wedged.** (Mechanical, but distinct from pin). Or **Ice.** (Freezes shut). Let's go with **Ice.**
          *   Revised: 1. Pin (Steel). 2. Magnet (Field). 3. Glue (Polymer). 4. Ice (Water).
          *   *Commonality:* None physically. All prevent opening.
          *   *Connection to Pain:* Pain prevents use of limb / triggers avoidance. "Locked" prevents opening.

      *   *Wait, one more check on the "Software Trap":* The user thinks the crowd will default to "Mind=Program". I need to make sure the example *breaks* that. If I use a door lock, it's not computational. That's good. It forces them to see functional equivalence without computational equivalence.

      *   *Dependency Order:*
          1.  Need the claim ("Pain is C-Fibers") before the counter-example.
          2.  Need the counter-example before the Type/Token distinction (the distinction arises *because* the example fails to unify).
          3.  Need Type/Token before the Disjunction objection (Disjunction is a response to Token/Type split).

      *   *Misconception Timing:*
          *   "Mind isn't physical": Address immediately after MR is established. "No, the ice is physical."
          *   "Software/Hardware": Addressed by the choice of example (Ice/Glue aren't hardware running code).
          *   "Token Identity solves it": Address after Type/Token distinction.
          *   "Disjunction": Address last, as the "Boss Fight" objection.

      *   *Final Question:* Needs to distinguish "Portability" (same code, new chip) from "Scatter" (different physics, same job).
          *   Q: "If we build a brain out of the exact same neurons but arrange them to function as a liver, is it a mind?" (Too complex).
          *   Q: "If I simulate a bimetallic strip in software, is it an overheat detector?" (Traps back into software).
