      *   *The Argument:* If Pain = C-fibers, then nothing without C-fibers can feel pain. But things without C-fibers *can* feel pain (plausibly). Therefore, Pain $\neq$ C-fibers.
      *   *The User's Nuance:* The user is worried about the "Software/Hardware" functionalism trap. If we say "Pain is the program," we slip into Functionalism. The user wants to stick to the *problem* MR poses for Identity Theory, specifically highlighting that the realizers aren't just "different hardware running the same code" (which implies a shared abstract structure), but potentially *physically disparate* things that only share a causal role.
      *   *The "Scatter" vs. "Cluster" point:* If realizers are clustered (e.g., mammal brains), a neuroscientist might find a common physical denominator. If they are scattered (e.g., brains, silicon, alien goo), there is no physical commonality except the causal role. This kills *Type* Identity (physical type), but leaves *Token* Identity alive.
