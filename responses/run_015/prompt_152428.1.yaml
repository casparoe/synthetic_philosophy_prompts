answer: |-
  # Diagnostic Instrument: The Illusionist Decision Tree

  **Instructions:** This instrument is designed to sort positions within the family of illusionist views regarding phenomenal consciousness. It assumes a shared starting premise: **The folk-psychological conception of phenomenal consciousness (as involving intrinsic, ineffable, immediately known qualia) does not correspond to the fundamental ontology of the world.**

  Navigate the tree by selecting the claim that best matches your theoretical commitment. At the terminal nodes (leaves), you will find a named position. Following the tree, consult the **Gap Analysis** for unoccupied logical spaces and the **Indistinguishability Flag** for positions this taxonomy cannot separate.

  ---

  ## Phase 1: The Ontological Root
  *What is the status of the phenomenal property itself?*

  **Q1. When you assert that phenomenal consciousness "fails to match reality," what exactly are you denying exists?**

  *   **(A)** I deny that there are any phenomenal properties whatsoever. When subjects report "feelings" or "qualia," they are reporting nothing real; there is no experiential substrate, only physical/functional processes that are *mistaken* for experience.
      *   *Go to Q2 (Strong Elimination Path)*
  *   **(B)** I deny only the *standard description* of these properties (e.g., that they are intrinsic, private, or non-physical). There is a real experiential substrate, but it is fully physical/functional, and the "illusion" lies in how we characterize or access it.
      *   *Go to Q2 (Revisionist Path)*

  ---

  ## Phase 2: The Generative Mechanism
  *How does the false appearance arise?*

  **Q2. (For Path A: Strong Elimination) If there are no phenomenal properties, why does it seem as though there are?**

  *   **(A1)** The brain constructs a user-interface model of its own internal states for the purpose of control and social coordination. The "feeling" is a simplified data-structure, not a real property.
      *   *Go to Q3 (Predictive/Architectural Branch)*
  *   **(A2)** The brain represents physical states correctly but misrepresents their *format*. It represents a physical state as having qualitative properties it lacks.
      *   *Go to Q3 (Representational Branch)*
  *   **(A3)** There is no cognitive mechanism generating an appearance; rather, we are in the grip of a theoretical mistake. We apply a concept ("phenomenal consciousness") that is empty or incoherent, like "witchcraft."
      *   *Go to Q3 (Conceptual Branch)*
  *   **(A4)** We knowingly assert the existence of consciousness as a useful fiction for social discourse, without believing it corresponds to ontology.
      *   *Go to Leaf: **Pragmatic Fictionalism***

  **Q2. (For Path B: Revisionism) If there is a real substrate, what generates the false *conception* of it?**

  *   **(B1)** We have direct access to physical states, but our cognitive architecture forces us to categorize them using a "phenomenal" vocabulary that implies intrinsicness.
      *   *Go to Q3 (Conceptual/Branch)*
  *   **(B2)** The system monitors its own states, but the monitoring mechanism introduces a systematic distortion (e.g., making the state seem immediate when it is mediated).
      *   *Go to Q3 (Representational Branch)*

  ---

  ## Phase 3: The Predictive Processing Constraint
  *Does the cognitive architecture dictate the illusion?*

  **Q3. (For A1, A2, B1, B2) Is the generation of the illusory appearance a contingent error or a necessary feature of a hierarchical inference architecture?**

  *   **(Yes)** The illusion is structurally necessary. A system using hierarchical predictive processing to model itself for control *must* generate a "user-illusion" that hides the underlying complexity. The error is not a bug; it is a feature of the interface.
      *   *Go to Q4 (Architectural Path)*
  *   **(No)** The illusion is a contingent representational or conceptual error. A different architecture could, in principle, track the physical states without generating the phenomenal appearance.
      *   *Go to Q4 (Standard Path)*

  ---

  ## Phase 4: The Scope of Illusion
  *How much of our experiential life is affected?*

  **Q4. Does the illusory appearance encompass all seeming phenomenal states, or only specific structural features?**

  *   **(Global)** Every instance of "what-it-is-like" is a misrepresentation or conceptual error. There is no veridical perception of experience; all seeming phenomenology is illusory.
      *   *Proceed to Leaf Assignment*
  *   **(Local)** Only specific features are illusory (e.g., the unity of consciousness, the transparency of experience, or the sense of agency). Other aspects (e.g., raw affective tone, sensory discrimination) are veridical tracks of physical states, even if we describe them poorly.
      *   *Proceed to Leaf Assignment*

  ---

  ## Terminal Leaves (Named Positions)

  **From Path A (Strong Elimination) + Q3 (No) + Q4 (Global):**
  *   **Leaf:** **Strong Eliminativist Illusionism**
  *   *Description:* Phenomenal properties do not exist. The appearance is a global representational or conceptual error. No residual phenomenal substrate remains.

  **From Path A (Strong Elimination) + Q3 (Yes) + Q4 (Global):**
  *   **Leaf:** **Predictive User-Model Illusionism**
  *   *Description:* Phenomenal properties are control-interface fictions generated necessarily by hierarchical inference systems. The illusion is global and architecturally mandated.

  **From Path A (Strong Elimination) + Q2 (A3/Conceptual) + Q4 (Global):**
  *   **Leaf:** **Quotational Conceptualism**
  *   *Description:* The term "phenomenal consciousness" is an empty kind term. We think we are referring to properties, but we are merely quoting our own confused reactions.

  **From Path A (Strong Elimination) + Q2 (A4/Pragmatic) + Q4 (Global):**
  *   **Leaf:** **Pragmatic Fictionalism**
  *   *Description:* Consciousness talk is a useful social tool, not an ontological claim. (Note: This path bypasses Q3/Q4 as the mechanism is linguistic, not cognitive).

  **From Path B (Revisionism) + Q4 (Global):**
  *   **Leaf:** **Deflationary Realism**
  *   *Description:* Experience is real, but "phenomenal" properties are just physical/functional properties misdescribed. The illusion is purely linguistic/conceptual, not ontological.

  **From Path A or B + Q4 (Local):**
  *   **Leaf:** **Local Illusionism (Hybrid)**
  *   *Description:* Some aspects of experience (e.g., unity, agency) are illusory misrepresentations, while others (e.g., sensory discrimination, affect) are veridical physical tracks.
      *   *Sub-variant:* If Path A: **Local Eliminativism** (Only structural features are illusory; raw states are nothing).
      *   *Sub-variant:* If Path B: **Local Revisionism** (Structural features are misdescribed; raw states are correctly described as physical).

  ---

  ## Gap Analysis: Unoccupied Logical Space

  The following combinations of answers are logically available within the tree structure but remain largely unoccupied in current literature.

  **1. The "Local Conceptual Eliminativist" Gap**
  *   **Coordinates:** Path A (Strong Elimination) + Mechanism: Conceptual Error + Scope: Local.
  *   **Diagnosis:** **Unattractive/Unstable.**
  *   **Reasoning:** This position claims that *some* phenomenal concepts are empty (e.g., "unity") while others refer to nothing at all (e.g., "pain"), but implies a distinction without an ontological difference. If *no* phenomenal properties exist (Path A), distinguishing between "globally empty" and "locally empty" concepts lacks explanatory leverage. It collapses into Strong Eliminativism because the "local" remainder has no ontology to stand on.

  **2. The "Predictive Revisionist" Gap**
  *   **Coordinates:** Path B (Revisionism) + Mechanism: Predictive/Architectural + Scope: Global.
  *   **Diagnosis:** **Neglect.**
  *   **Reasoning:** This view would claim that experience *is* real (physical), but our architecture *necessitates* that we misdescribe it as intrinsic/qualitative globally. Most Predictive Processing views lean toward Path A (the experience itself is the model, not a real property tracked by the model). A view where the architecture forces a *false description* of a *real substrate* is theoretically possible but rarely defended; proponents usually argue the architecture generates the *appearance* of a substrate that isn't there.

  **3. The "Pragmatic Localist" Gap**
  *   **Coordinates:** Mechanism: Pragmatic Fiction + Scope: Local.
  *   **Diagnosis:** **Incoherent.**
  *   **Reasoning:** Pragmatic Fictionalism typically treats the discourse as a whole as a tool. To claim that "unity talk" is a fiction but "pain talk" is ontologically serious (or vice versa) while maintaining a pragmatic stance creates a disjointed normative framework. If the utility is social, it usually applies globally to the folk-psychological framework.

  ---

  ## Indistinguishability Flag

  This taxonomy cannot genuinely separate the following positions based solely on the three axes provided. Respondents holding these views may arrive at the same Leaf despite theoretical disagreements.

  **1. Dennettian Heterophenomenology vs. Frankish Illusionism**
  *   **Shared Leaf:** **Strong Eliminativist Illusionism** (or **Quotational Conceptualism**).
  *   **Reason for Collapse:** Both views deny the existence of intrinsic qualia and attribute the appearance to cognitive mechanisms. While Dennett emphasizes the third-person interpretive stance and Frankish emphasizes the cognitive mechanism of the "phenomenal concept," both land on Path A + Global Scope. The tree treats the *motivation* for elimination (interpretive vs. mechanistic) as secondary to the *ontological outcome*.

  **2. Predictive User-Model Illusionism vs. Representational-Error Illusionism**
  *   **Shared Leaf:** Potentially **Strong Eliminativist Illusionism**.
  *   **Reason for Collapse:** If the "Representational Error" is systematic and universal, it becomes functionally indistinguishable from an "Architectural Necessity" in terms of output. Unless the respondent insists on the *contingency* of the error (Q3), the tree sorts them identically. The distinction lies in the evolutionary explanation, not the ontological map.

  **3. Deflationary Realism vs. Local Revisionism**
  *   **Shared Leaf:** **Deflationary Realism / Local Revisionism**.
  *   **Reason for Collapse:** Both admit a real substrate and deny the "folk" description. The boundary between "all descriptions are wrong but the state is real" (Global Revisionism) and "some descriptions are wrong" (Local Revisionism) is often a matter of degree. A respondent might claim "raw feel" is real (Local) while another claims "physical state" is real but feels like nothing (Deflationary), yet both navigate Path B similarly.

  ---

  ## Usage Note for Seminar Leaders
  This instrument is designed to expose fault lines *within* illusionism, not between illusionism and realism. If a respondent rejects the Root Premise (Q1), they exit the taxonomy into Realism (Dualism, Physicalism, Panpsychism). Ensure respondents understand that "Illusionism" here is the genus, and the leaves are the species. The **Predictive Processing Constraint (Q3)** is the critical stress-test for modern cognitive-science-aligned views; force respondents to decide if the illusion is a *bug* (contingent) or a *feature* (architectural necessity), as this determines the resilience of their position against future neuro-technological intervention.
