prompt: |-
  I teach an applied ethics seminar and grade student case analyses roughly twice a week; each paper asks students to argue for a moral verdict on a concrete case (a disclosure dilemma, a triage decision, a confidentiality breach, etc.). My problem is that I grade on an implicit, inconsistent standard: I sometimes reward a student for citing a general principle and sometimes for doing careful case-by-case reasoning that never names one, and I can't articulate when each is actually good. The moral particularism–generalism debate is supposed to be about exactly this, but I've never turned it into something I can run on a paper in the time I have.

  Please write a grading procedure I can follow in order, that separates "is this reasoning well done?" from "is it principled or particularist?" It should: (1) identify whether the argument is principle-based, case-based, or a mix, and what the load-bearing move in the argument is; (2) check whether that move is done well on its own terms — for a principle, whether the case genuinely falls under it and whether the obvious defeaters have been considered; for case-based reasoning, whether the morally salient features have been identified and weighed, and whether a feature that would change the verdict has been missed; (3) flag the cases where a principle the student relies on is defeated in this context — a feature that is a reason in normal cases is a disreason or neutral here — and say what to do with that; (4) mark where the procedure stops and hands the final moral verdict to my own judgment, because whether the action is right is a question of values, not of well-formedness.

  Then run it on two worked examples: a student who argues from a general principle of non-maleficence that a doctor must disclose a bad diagnosis immediately, and a student who never names a principle but argues from the specific features of the case (the patient's known anxiety, the timing of the disclosure, the availability of support) that the doctor should delay disclosure. I want to see the procedure give a different grade to one of these than I would have given on instinct, and I want you to say what the procedure cannot do that I still have to do.
reasoning: |-
  Here's a thinking process that leads to the suggested grading procedure and worked examples:

  1.  **Analyze the Request:**
      *   **User:** Applied ethics seminar instructor.
      *   **Task:** Grade student case analyses (moral verdicts on concrete cases).
      *   **Problem:** Inconsistent grading standard (oscillating between rewarding general principles vs. case-by-case reasoning/particularism).
      *   **Goal:** A structured grading procedure that separates *quality of reasoning* from *meta-ethical stance* (generalism vs. particularism).
      *   **Requirements:**
          1.  Identify argument type (principle/case/mix) and load-bearing move.
          2.  Check quality *on its own terms* (principle application vs. salient feature weighing).
          3.  Flag defeated principles (reasons becoming disreasons/neutrals).
          4.  Mark where the procedure stops and instructor judgment takes over (values vs. well-formedness).
          5.  Run the procedure on two worked examples (Principle-based immediate disclosure vs. Particularist delayed disclosure).
          6.  Show a divergence in grading compared to "instinct."
          7.  Explicitly state what the procedure *cannot* do.

  2.  **Deconstruct the Philosophical Context:**
      *   **Generalism:** Morality is codifiable in principles (e.g., Kantianism, Utilitarianism). Good reasoning = correct subsumption of case under principle.
      *   **Particularism (e.g., Dancy):** Morality is context-dependent. Features can change valence (holism). Good reasoning = sensitivity to salient features without rigid rules.
      *   **The Instructor's Dilemma:** Rewarding one style over the other implicitly biases the course. The grading rubric needs to be neutral regarding the *source* of normativity but strict regarding the *execution* of the argument.

  3.  **Drafting the Grading Procedure (The "Protocol"):**
      *   *Step 1: Classification.* Need to categorize the argument structure. Is it deductive (Principle $\to$ Case) or abductive/inductive (Features $\to$ Verdict)?
      *   *Step 2: Internal Validity Check.*
          *   If Principle: Is the principle stated clearly? Is the subsumption accurate? Are exceptions handled?
          *   If Particularist: Are features identified? Is the weighing explained? Is the context rich enough?
      *   *Step 3: The Defeater Check (Crucial for Particularism).* This addresses requirement #3. Does the student acknowledge that a feature usually good might be bad here (holism of reasons)?
      *   *Step 4: The Limit Marker.* Where does logic end and values begin? This addresses requirement #4.
      *   *Scoring:* Needs to be binary or scaled on *reasoning quality*, not *conclusion agreement*.

  4.  **Developing the Worked Examples:**
      *   **Case:** Medical disclosure (Bad diagnosis).
      *   **Student A (Generalist):** Argues for immediate disclosure based on Non-Maleficence/Autonomy (let's stick to the prompt's "Non-Maleficence" though usually Autonomy drives disclosure, I need to follow the prompt's setup: "non-maleficence that a doctor must disclose... immediately"). *Correction:* Actually, non-maleficence usually argues *against* causing harm (like anxiety). If the student argues non-maleficence *for* disclosure, they are arguing that hiding the truth causes more harm. I need to make sure the logic holds or fails clearly.
      *   **Student B (Particularist):** Argues for delay based on anxiety, timing, support. No named principle.
      *   **The Twist:** The prompt asks to see the procedure give a *different grade* than instinct.
          *   *Instinct:* Usually, instructors favor the Principle student (looks more "philosophical") or the Nuanced student (looks more "practical"). Let's assume the instructor's instinct is to favor the Principle student (Student A) because it looks like "ethics."
          *   *Procedure Outcome:* The procedure should reveal that Student A's application is sloppy (ignores context), while Student B's reasoning is structurally sound (identifies salient features, weighs them). So, B gets higher on *reasoning*, even if A looks more "academic."
          *   *Alternative:* Or, Student A is logically valid but premises are contestable, while Student B misses a crucial feature.
          *   *Decision:* Let's make Student A (Principle) logically *weak* on application (fails the defeater check) and Student B (Particularist) logically *strong* on feature identification. This highlights the value of the rubric.

  5.  **Refining the Procedure Steps (Iterative Polish):**
      *   Make it a checklist.
      *   Ensure the "Stop Rule" is clear (don't grade the truth of the verdict, grade the path).
      *   Ensure the "Defeater" section is prominent (this is the core particularist insight).

  6.  **Writing the Response:**
      *   **Introduction:** Acknowledge the pedagogical tension.
      *   **The Protocol:** Numbered steps, clear instructions.
      *   **The Examples:** Detailed breakdown using the protocol.
      *   **The Comparison:** Explicitly state where the grade diverges from instinct.
      *   **The Limitations:** What the instructor still must do (value judgment).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address "non-maleficence" correctly in Example 1? If the student says "Non-maleficence requires immediate disclosure," they are claiming hiding the truth causes harm. The critique should be: Did they consider the harm *of* disclosure (anxiety)? If not, they failed the defeater check.
      *   *Check:* Did I address "salient features" in Example 2? The student mentions anxiety/timing. Did they weigh them? Yes. Did they miss a feature (e.g., legal requirement)? If they missed a *morally* salient feature, that's a deduction.
      *   *Check:* Did I mark the "Stop"? Yes, need to ensure I don't say "Student B is right about the delay," but "Student B argued well for the delay."
      *   *Check:* The prompt asks for the procedure to give a different grade than instinct. I need to explicitly narrate this. "Instinct says A is better because it uses terminology. Procedure says B is better because A ignored defeaters."

  8.  **Final Polish:** Ensure tone is professional, pedagogical, and philosophically precise (using terms like 'valence', 'subsumption', 'holism').

  *(Self-Correction on the "Non-Maleficence" argument)*: It is slightly counter-intuitive to argue Non-Maleficence *for* immediate disclosure (usually Autonomy). However, the prompt specifies: "argues from a general principle of non-maleficence that a doctor must disclose a bad diagnosis immediately." I must stick to this. The student's logic is likely: "Withholding truth causes long-term harm (loss of trust, inability to plan), so Non-Maleficence dictates disclosure." The critique will focus on whether they considered the *immediate* harm of distress as a defeater.

  *(Refining the "Instinct" divergence)*: Most ethics instructors instinctively reward the use of "Big Theory" (Kant/Mill). So Instinct = A gets A, B gets B-. The Procedure should show A has a logical gap (ignoring the harm of distress) while B has a complete feature analysis. So Procedure = A gets B, B gets A. This demonstrates the utility of the rubric.

  9.  **Finalizing the Output Structure:**
      *   Part 1: The Grading Protocol (The "Meta-Ethical Neutral Rubric").
      *   Part 2: Worked Example 1 (The Generalist).
      *   Part 3: Worked Example 2 (The Particularist).
      *   Part 4: Comparative Analysis (Instinct vs. Procedure).
      *   Part 5: Limitations (What the instructor must still do).

