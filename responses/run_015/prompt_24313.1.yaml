answer: |-
  ## The Meta-Ethical Neutral Grading Protocol (MENGP)

  This procedure is designed to grade the *structural integrity* of moral reasoning without privileging Generalism (principles) or Particularism (context) as the superior meta-ethical stance. It treats both as distinct argumentative architectures.

  ### Phase 1: Structural Diagnosis
  **Goal:** Identify the argument type and the load-bearing move.
  1.  **Classify the Architecture:**
      *   **Top-Down (Generalist):** Argument begins with a rule/principle/duty and subsumes the case under it.
      *   **Bottom-Up (Particularist):** Argument begins with specific features of the case and aggregates them toward a verdict without invoking a codified rule.
      *   **Hybrid:** Uses a principle but modifies it heavily based on context, or uses features to justify a principle.
  2.  **Identify the Load-Bearing Move:**
      *   What is the single sentence or claim that, if removed, causes the verdict to collapse?
      *   *For Top-Down:* It is the **Subsumption Claim** (e.g., "This case falls under Principle X").
      *   *For Bottom-Up:* It is the **Salience Claim** (e.g., "Feature Y outweighs Feature Z in this context").

  ### Phase 2: Internal Validity Check (On Its Own Terms)
  **Goal:** Assess quality based on the standards of the chosen architecture.
  1.  **If Top-Down (Principle):**
      *   **Clarity:** Is the principle defined sufficiently to do work?
      *   **Fit:** Does the case genuinely fit the principle's conditions, or is it a forced match?
      *   **Defeater Scan:** Does the student acknowledge standard exceptions to this principle? (e.g., If citing "Truth-Telling," do they acknowledge "Harm Prevention" exceptions?)
  2.  **If Bottom-Up (Case):**
      *   **Feature Identification:** Has the student listed the relevant non-moral facts (psychological, social, temporal)?
      *   **Valence Assignment:** Does the student explain *why* a feature counts *for* or *against* the action?
      *   **Holism Check:** Does the student acknowledge that a feature usually positive could be negative here (or vice versa)?
  3.  **If Hybrid:**
      *   Apply both checks to the respective parts of the argument.

  ### Phase 3: The Defeater & Holism Flag
  **Goal:** Identify context-sensitivity failures.
  *   **The Defeater Flag:** Mark any instance where a standard reason is treated as absolute when the case context suggests it is defeated.
      *   *Example:* Treating "Lying is wrong" as decisive in a case where "Lying saves a life."
  *   **The Holism Flag:** Mark any instance where a feature's moral valence is assumed to be invariant.
      *   *Example:* Assuming "Patient Anxiety" is always a reason *against* disclosure, rather than potentially a reason *for* preparation before disclosure.
  *   **Grading Impact:** If a student fails to address an obvious defeater or assumes invariant valence without justification, deduct points on **Reasoning Rigor**, regardless of argument type.

  ### Phase 4: The Stop Rule (Instructor Judgment Zone)
  **Goal:** Separate reasoning quality from moral truth.
  *   **Draw a Line:** Once the argument is structurally sound (Phases 1–3), stop grading.
  *   **The Verdict:** Do not grade based on whether you agree with the final moral verdict (e.g., "Disclose" vs. "Delay").
  *   **The Exception:** Only intervene if the verdict violates a non-negotiable constraint of the course (e.g., illegal action presented as ethical without legal analysis).
  *   **Note to Self:** "My disagreement with the conclusion is a value judgment, not a reasoning error. Do not penalize."

  ***

  ## Worked Examples

  **The Case:** A doctor has test results confirming a terminal diagnosis. The patient is known to be highly anxious. The family asks the doctor to wait until the weekend so they can gather.
  **The Task:** Argue for a moral verdict on when to disclose.

  ### Example 1: The Generalist Student (Student A)
  **Argument Summary:** The student argues for **Immediate Disclosure**.
  **Key Text:** "The principle of Non-Maleficence requires us to prevent harm. Withholding a diagnosis prevents the patient from arranging their affairs and saying goodbyes, which causes significant long-term psychological and practical harm. Therefore, Non-Maleficence mandates immediate disclosure to minimize total harm."

  **Applying the Protocol:**
  1.  **Diagnosis:** Top-Down (Generalist). Load-bearing move is the Subsumption Claim ("Withholding... causes harm... Therefore Non-Maleficence mandates disclosure").
  2.  **Internal Validity:**
      *   *Clarity:* Principle is clear.
      *   *Fit:* Plausible. Long-term harm is a form of maleficence.
      *   *Defeater Scan:* **FAIL.** The student treats Non-Maleficence as a one-way ratchet toward disclosure. They do not address the *immediate* harm caused by the disclosure itself (severe anxiety, potential psychosomatic crisis).
  3.  **Defeater/Holism Flag:**
      *   **Flagged:** The student assumes the "Harm of Delay" always outweighs the "Harm of Distress." They treat the principle as invariant. They ignore the specific context (known high anxiety) which acts as a potential defeater to the "disclosure reduces harm" claim.
  4.  **Stop Rule:** The reasoning is logically valid *if* the premise holds, but the premise ignores a salient counter-premise inherent in the case description.

  **Protocol Grade:** **B-** (Strong structure, but failed the Defeater Scan. The principle was applied rigidly where the case demanded nuance.)

  ### Example 2: The Particularist Student (Student B)
  **Argument Summary:** The student argues for **Delayed Disclosure (until weekend)**.
  **Key Text:** "There is no rule that fits this perfectly. We have the patient's history of severe anxiety, which means shocking news could trigger a medical event. We have the family's request, which indicates a support system will be available on the weekend. We have the medical fact that the condition is terminal, so a few days does not change treatment options. Weighing these, the availability of support and the risk of anxiety outweigh the benefit of immediate knowledge."

  **Applying the Protocol:**
  1.  **Diagnosis:** Bottom-Up (Particularist). Load-bearing move is the Salience Claim ("Availability of support and risk of anxiety outweigh benefit of immediate knowledge").
  2.  **Internal Validity:**
      *   *Feature Identification:* **Pass.** Identifies anxiety, support system, medical urgency.
      *   *Valence Assignment:* **Pass.** Explains *why* anxiety matters (medical event risk) and *why* timing matters (support availability).
      *   *Holism Check:* **Pass.** Implicitly acknowledges that "Truth-Telling" (usually good) is less weighty here than "Safety" (usually good), without needing to name a rule.
  3.  **Defeater/Holism Flag:**
      *   **Clear.** The student treats the features as context-dependent. They do not claim "Delay is always good," but "Delay is good *given* the support system."
  4.  **Stop Rule:** The reasoning is structurally sound. I may personally believe immediate disclosure is more respectful of autonomy, but that is a value judgment, not a reasoning error.

  **Protocol Grade:** **A** (Excellent feature identification, successful weighing of competing reasons, no invariant assumptions.)

  ***

  ## The Divergence: Instinct vs. Procedure

  **My Instinct:**
  I likely would have graded **Student A higher (A-)** and **Student B lower (B+)**.
  *   *Why:* Student A uses the vocabulary of the discipline ("Non-Maleficence," "Principle"). It looks like "Ethics." Student B looks like "Clinical Intuition." My implicit bias is that applied ethics requires the application of *theory*, not just careful description. I might have penalized Student B for "failing to engage with the literature" or "lacking a normative framework."

  **The Procedure's Verdict:**
  The Protocol grades **Student B higher (A)** and **Student A lower (B-)**.
  *   *Why:* The Protocol forces me to check the *Defeater Scan*. Student A's argument collapses if the immediate harm of disclosure is real (which the case hints at with "known anxiety"). Student A ignored a defeater. Student B, despite lacking jargon, successfully identified salient features, assigned them valence, and weighed them without logical contradiction.
  *   *Result:* The procedure corrects my bias toward "theoretical naming" and rewards "moral sensitivity," which is the actual learning objective of a case seminar.

  ***

  ## What This Procedure Cannot Do (The Instructor's Burden)

  The Protocol explicitly stops at Phase 4. Here is what you must still do, which the procedure cannot automate:

  1.  **Evaluate the Truth of the Salient Features:**
      *   The Protocol checks if Student B *weighed* the features. It does not check if Student B is *right* that anxiety outweighs autonomy. If Student B argues, "Anxiety is the only thing that matters," the Protocol sees a weighing move. *You* must decide if that weighting is morally acceptable within the values of the profession. The procedure ensures the argument is *well-formed*; you must ensure it is *good*.
  2.  **Adjudicate Incommensurable Values:**
      *   If Student A argues from Autonomy and Student B argues from Care, the Protocol will mark both as structurally sound (provided they handle defeaters). It cannot tell you which value should win. You must use your expertise to determine if the student's hierarchy of values is defensible in a medical context.
  3.  **Detect "Sophistry":**
      *   A clever student can use the Particularist structure to rationalize a prejudiced verdict (e.g., identifying "features" that are actually biases). The Protocol checks for internal consistency, not external moral truth. You must still vet the *content* of the features identified for bias or factual error.
  4.  **Set the Bar for "Obvious Defeaters":**
      *   Phase 3 requires you to flag missed defeaters. But *you* must decide what counts as "obvious." Is the legal liability of delaying disclosure an obvious defeater? Is the spiritual need for truth? The Protocol forces you to be consistent about what counts as a defeater, but it does not generate that list for you.

  **Summary:** The Protocol prevents you from penalizing a student for *how* they reason (Generalist vs. Particularist), but it does not relieve you of the responsibility to judge *what* they value. It separates the *logic of justification* from the *substance of the verdict*.
