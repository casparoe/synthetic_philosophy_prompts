      *   *Key Distinction:* Self-reference. The BB problem is internal to the scientific framework. The Evil Demon is external to it. If I accept the BB model, I destroy the tool (reason/observation) I used to accept it. If I fear an Evil Demon, I haven't necessarily used a specific physical theory to prove the Demon exists; I'm just worried I *could* be deceived.
      *   *Refinement:* The Evil Demon scenario is a *possibility* that undermines everything equally. The BB scenario is a *prediction* of a specific theory that undermines *that specific theory* disproportionately.

  5.  **Address "Cognitive Instability."**
      *   *Definition:* A state where holding a belief causes the reasons for holding that belief to dissolve.
      *   *Is it just self-defeat?* It's a specific *kind* of self-defeat. Logical self-defeat is "This statement is false." Cognitive instability is "Believing this proposition destroys the cognitive machinery required to justify the proposition."
      *   *Nuance:* It's about the *dynamics of belief*. If $P$ implies "Your belief in $P$ is unjustified," then $P$ is cognitively unstable. It's not just contradictory; it's epistemically suicidal.

