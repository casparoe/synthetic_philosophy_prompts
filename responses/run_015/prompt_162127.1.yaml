answer: |-
  Here is a comparison of the two accounts at the level of mechanism, addressing the specific wrinkles and verdicts you outlined.

  ### 1. The Mechanisms: Participation vs. Reliance

  The fundamental divergence lies in **where the normative force is located**.

  *   **Scheme-Membership** locates force in the **structure of the practice**. The obligation is a debt incurred by accepting a benefit defined by the rules of the scheme. It is transactional and internal: *You took a spot; you owe the turn.* The mechanism is binary: you are either in the scheme or out of it.
  *   **Expectation-Dependence** locates force in the **psychological states of others**. The obligation is a constraint imposed by the vulnerability of those around you. It is relational and external: *They are counting on you; don't let them down.* The mechanism is scalar: obligation rises and falls with the intensity and reasonableness of reliance.

  ### 2. Wrinkle One: The Transient Asymmetry

  The visitor is distinct because she is a "free rider" in the temporal sense: she consumes the order the convention provides but exits before she must help maintain it when the convention degrades or shifts.

  **Scheme-Membership:**
  *   **Verdict:** The visitor is **equally bound**. Since obligation tracks participation, transience is irrelevant. If she sits at the table, she owes the tip.
  *   **Feature or Bug:** This is a **bug**. It ignores the "no voice, no stake" problem. By treating the visitor as a full member, it imposes duties without granting the corresponding right to influence the scheme's evolution. It treats the convention as a static contract rather than a living social practice. The visitor is bound to a future she won't inhabit, which violates the reciprocity intuition usually required for fair-play obligations.

  **Expectation-Dependence:**
  *   **Verdict:** The visitor is **variably bound**, likely less so. Locals cannot reasonably rely on a transient to uphold long-term norms in the same way they rely on residents. However, in high-volume tourist contexts (e.g., a tipping-dependent resort town), reliance on the *category* of "visitor" may be high, restoring the obligation.
  *   **Feature or Bug:** This is a **feature**. It tracks the actual moral landscape. If the locals know visitors leave, their reliance adjusts, and the obligation fades. If the locals depend on tourist revenue to survive, the reliance is high, and the obligation holds. This account captures the asymmetry rather than erasing it.

  ### 3. Wrinkle Two: The Extractive Fork

  This is the stress test. The convention is not merely coordinative (queueing) but redistributive in a way you deem unjust (tipping as a wage subsidy). Complying sustains the system; defecting punishes the individual worker.

  **Scheme-Membership:**
  *   **Handling:** **Fails.** Because the mechanism treats the scheme as a black box, it struggles to distinguish between a neutral coordination device and an extractive one. If obligation tracks participation, and you have participated (eaten the meal), you owe the share (the tip). To defect is to violate fair play.
  *   **Why it fails:** It lacks an internal off-ramp for injustice. Unless you import an external proviso (e.g., "fair play only binds in just schemes"), Scheme-Membership forces you to validate the extraction. It treats the server's reliance on the tip as a "legitimate expectation" generated by the rules, ignoring that the rules themselves might be the problem. It prioritizes the integrity of the *system* over the morality of the *outcome*.

  **Expectation-Dependence:**
  *   **Handling:** **Succeeds.** The mechanism asks whether the expectation is *reasonable*. An expectation built on an unjust background (an employer shifting wage liability to customers) can be deemed unreasonable.
  *   **Why it works:** It allows you to weigh the reliance of the server against the reliance of the moral community. You can argue that while the server expects the tip, they *should not* reasonably expect a stranger to subsidize their employer's negligence. Furthermore, it handles the "defecting hurts the server" problem by acknowledging the harm but allowing it to be outweighed by the objectionable nature of the expectation itself. It permits a "clean break" that Scheme-Membership forbids.

  ### 4. Verdict Divergence and Explanatory Work

  **Do they converge?**
  In standard, neutral coordination cases (queueing for a bus, not jaywalking on a busy street), they **converge 90% of the time**. In these contexts, participation implies reliance, and reliance implies a scheme.

  **Where do they come apart?**
  They diverge in **low-reliance/high-rule** contexts and **unjust scheme** contexts.
  *   *Example:* You are the only person in a queue, and the server is distracted.
      *   *Scheme:* You still owe the turn (the scheme exists).
      *   *Expectation:* You owe nothing (no one is relying on you).
  *   *Example:* The unjust tip.
      *   *Scheme:* Pay up (you accepted the benefit).
      *   *Expectation:* Maybe don't (the expectation is tainted).

  **Which does the work?**
  **Expectation-Dependence is doing the real explanatory work.** Scheme-Membership is largely a heuristic for Expectation-Dependence in stable societies. We assume that because a scheme exists, people are relying on it. But when that assumption breaks (transients, unjust systems), Scheme-Membership yields counter-intuitive results, while Expectation-Dependence explains *why* the obligation feels weaker or stronger. Scheme-Membership describes the *form* of the obligation; Expectation-Dependence explains its *force*.

  ### 5. The Signalling Bit: Protest vs. Contempt

  You note that non-compliance reads as *protest* from a resident and *contempt* from a visitor.

  **Is this a third consideration?**
  No. **Expectation-Dependence absorbs it; Scheme-Membership ignores it.**

  *   **Scheme-Membership:** This account is semantic-blind. It sees an act of non-compliance as a violation of a rule. It cannot easily distinguish why the *same act* carries different meaning based on the agent's identity, because the duty is derived from the act of participation, not the identity of the participant.
  *   **Expectation-Dependence:** Expectations are not just about behavior; they are about **meaning**. Locals rely on residents to signal solidarity with the community (hence non-compliance is *protest*). Locals rely on visitors to signal respect for the host culture (hence non-compliance is *contempt*). Because Expectation-Dependence is rooted in the interpersonal relationship, it naturally encompasses the expressive content of the action.

  **Conclusion:**
  If your piece argues that visitors have a nuanced obligation that shifts based on the justice of the convention and their relationship to the locals, **Expectation-Dependence** is the superior engine. Scheme-Membership is useful for describing why conventions feel rigid, but it breaks down when the convention itself is the object of scrutiny. Use Scheme-Membership to describe the *pressure* the visitor feels, and Expectation-Dependence to describe the *justification* she actually has.
