answer: |-
  ### Specification of Adequacy for Distributed Personal Identity

  To count as successful, a theory of trans-brain or distributed personal identity must satisfy a rigorous set of desiderata. These criteria are not merely metaphysical preferences but are grounded in the phenomenology of selfhood, the logic of identity, and the constraints of cognitive architecture. The following specification outlines the phenomena the theory must explain, the conceptual distinctions it must preserve, the empirical constraints it must honor, and the critical tensions it must resolve.

  #### I. Phenomena to Explain

  A viable theory must provide a coherent account of three specific phenomenological and functional challenges that arise when the self is decoupled from a single biological substrate.

  **1. First-Person Authority Under Concurrent Instantiation**
  If a self-pattern is instantiated in two brains simultaneously, the theory must explain the status of first-person authority. In standard cases, when I speak, I have privileged access to the meaning and intent of my utterance. In a distributed scenario, if Host A and Host B both instantiate the "I," do they both possess equal authority? If Host A feels pain, does Host B feel it, or do they merely know about it? The theory must explain whether the phenomenology splits into two distinct first-person perspectives (creating two "I"s) or remains singular despite physical multiplicity. If it remains singular, it must explain how one subjective perspective occupies two loci without contradiction. If it splits, it must explain why both instances claim to be the original "I" without rendering the concept of identity meaningless.

  **2. Continuity of Autobiographical Memory with External Hosting**
  Personal identity relies heavily on the narrative continuity of autobiographical memory. The theory must explain how memory retains its *mineness* when storage or processing is partly external or hosted in another brain. It is not enough to show that data is accessible; the theory must explain why accessing a memory trace in another brain feels like remembering one's own past rather than reading someone else's diary. The motivating pressure here is the difference between *knowing* a fact about oneself and *experiencing* the recollection of that fact. If the neural substrate of memory is distributed, the theory must specify the threshold at which access becomes ownership.

  **3. Interstitial Agency**
  This refers to the problem of attributing authorship to a decision when two host brains contribute to an outcome without either having exclusive access or control. In a distributed system, actions may emerge from the coupling of multiple neural architectures. The theory must provide an account of moral and causal responsibility that does not dissolve agency into the system as a whole (which leaves no one responsible) nor arbitrarily assign it to one host (which is factually incorrect). The motivating case is a joint decision where neither brain could have produced the output alone, yet the action is attributed to the "person." The theory must locate the agent in the interstice without reifying the gap itself.

  #### II. Distinctions to Preserve

  To avoid conceptual collapse, the theory must maintain clear boundaries between categories that are often conflated in discussions of extended mind and identity.

  **1. Pattern-Continuity vs. Biological-Continuity**
  *   **The Distinction:** Pattern-continuity asserts that identity follows the informational structure or functional organization, whereas biological-continuity asserts that identity follows the physical organism.
  *   **Motivating Case:** Consider a gradual replacement scenario where neurons are swapped for synthetic duplicates that maintain the same functional pattern. Biological-continuity suggests identity might break if the organic matter is lost; pattern-continuity suggests identity persists. A distributed theory must justify why the pattern outweighs the substrate, specifically explaining why the destruction of the original biological brain does not necessarily entail the death of the person if the pattern persists elsewhere.

  **2. Shared Experience vs. Merged Identity**
  *   **The Distinction:** Shared experience implies two subjects accessing the same data stream; merged identity implies there is only one subject.
  *   **Motivating Case:** Deep empathy or neural linking allows two people to feel what the other feels. However, we do not typically say they are the same person. The theory must specify what additional condition turns high-fidelity sharing into literal identity. Without this distinction, any deep conversation or neural link risks collapsing two persons into one, violating our basic understanding of social ontology.

  **3. Possessing a Self vs. Possessing the Same Kind or Degree of Self**
  *   **The Distinction:** This separates the binary question of existence (is there a self here?) from the qualitative question of identity (is it *the* self?).
  *   **Motivating Case:** In fission cases (where one person splits into two), the resulting entities may both possess selves of equal complexity, but neither may be identical to the original in a strict numerical sense. The theory must account for degradation or duplication. If a distributed copy is 90% accurate, does it possess a self, or does it possess *my* self? Failing to distinguish these leads to errors where functional equivalence is mistaken for numerical identity.

  #### III. Empirical Consistency and Joint Tensions

  The theory must remain consistent with established findings in cognitive science while acknowledging internal tensions that may limit its scope.

  **1. Consistency with Neuroscience and Cognitive Science**
  *   **Split-Brain Research:** Findings from commissurotomy patients suggest that a single skull can house two distinct centers of consciousness. A distributed identity theory must explain whether this is a fracture of one self or the revelation of two. It cannot simply assume unity where neuroscience suggests fragmentation.
  *   **Extended Cognition:** Work on the extended mind thesis (e.g., the parity principle) suggests tools can be part of cognitive processing. The theory must clarify why including another *brain* differs categorically from including a notebook or a smartphone. If the boundary of the mind is permeable, the theory must explain why the boundary of the *person* does not dissolve entirely.

  **2. Jointly Unsatisfiable Desiderata**
  There is a significant tension between **Preserving First-Person Asymmetry** and **Allowing Full Pattern Duplication**.
  *   **The Tension:** First-person asymmetry dictates that my perspective is unique to me; I cannot be you. However, full pattern duplication implies that two hosts can instantiate the exact same self-pattern. If both hosts claim "I am me," and both are correct by the lights of pattern identity, the uniqueness of the first-person perspective is violated.
  *   **The Flag:** A theory cannot simultaneously maintain that the "I" is essentially singular (unique reference) and that the "I" is a replicable pattern (multiple reference). One of these intuitions must be revised or abandoned. Most distributed theories sacrifice uniqueness to save continuity, but this comes at the cost of making "identity" behave more like "similarity."

  #### IV. The Killer Requirement

  The single requirement likely to eliminate the largest number of popular theories is **The Preservation of Phenomenological Singularity**.

  *   **Explanation:** Most traditional theories of personal identity (Lockean memory theories, Biological Animalism, Standard Psychological Continuity) rely on the assumption that identity is a one-to-one relation. There is one "I" at time T1 and one "I" at time T2. Distributed identity inherently proposes a one-to-many relation (one pattern, multiple hosts). If a theory insists that the subjective experience of being "I" must remain singular and unique—a core intuition of human selfhood—it cannot accommodate concurrent instantiation without contradiction. Theories that allow distribution usually do so by redefining identity as a matter of degree or relation, thereby failing the requirement that the subject feels like a single, indivisible unit. Consequently, any theory that demands strict numerical identity alongside physical distribution will fail this requirement.

  #### V. Brief Scoring of Candidate Views

  **1. Hofstadter's Pattern-Persistence View**
  *   **Status:** Fails Phenomenological Singularity.
  *   **Analysis:** This view excels at explaining Pattern-Continuity and Autobiographical Memory, treating the self as a resilient symbol. However, it struggles with Concurrent Instantiation. If the pattern is copied, Hofstadter's view typically accepts that there are now two "souls." This violates the intuition of First-Person Authority and Phenomenological Singularity, as the original "I" does not experience the life of the copy. It solves distribution by multiplying selves rather than distributing one.

  **2. Standard Biological-Continuity Account (Animalism)**
  *   **Status:** Fails Distributed Agency.
  *   **Analysis:** This view preserves Phenomenological Singularity and Biological-Continuity perfectly. However, it cannot account for Interstitial Agency or Memory Continuity if the substrate is shared or external. By tethering the self strictly to the organism, it renders trans-brain identity impossible by definition. It scores high on uniqueness but zero on distribution.

  **3. Functionalist Alternative (System-Based)**
  *   **Status:** Fails First-Person Authority.
  *   **Analysis:** This view treats the self as the output of a specific computational architecture. It handles Extended Cognition and Interstitial Agency well, locating agency in the system flow. However, it tends to reduce First-Person Authority to functional access. It struggles to explain why the experience feels *owned* by a specific locus rather than just processed by the system. It preserves Pattern-Continuity but often dissolves the distinction between Shared Experience and Merged Identity, treating high-fidelity coupling as identity.
