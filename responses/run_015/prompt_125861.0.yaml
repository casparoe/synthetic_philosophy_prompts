  # Project Title: Structural Invariants in Typographic Identity

  ## The Question
  This project asks: **Can typographic identity be reduced to a finite set of topological and relational invariants independent of metric geometry?**

  You suggested asking if there is a specification such that every instance satisfies it and no other letter does. I recommend refining this slightly. Seeking *necessary and sufficient conditions*—rules that must all be true for a thing to belong to a category, and whose truth guarantees membership—is the gold standard for definition, but often too rigid for perceptual categories. Instead, we will test the hypothesis that letter identity is carried by **structure** (connectivity, containment, relative position) rather than **shape** (coordinates, curvature, thickness). If successful, we produce a "grammar" of letterforms that generates valid instances without referencing specific measurements.

  ## Why Existing Models Fail
  Two dominant explanations for category membership fail to explain typographic identity.

  **1. The Cluster Theory (Family Resemblance)**
  This view argues categories are defined by overlapping similarities rather than strict rules; members share a "family resemblance" without a single common thread.
  *   **The Failure Case:** This cannot explain why a Latin 'a' and a Cyrillic 'а' can be pixel-identical yet represent different letters. If identity were just geometric clustering, identical shapes would belong to the same cluster. The difference is systemic (which contrast set the glyph belongs to), not geometric.
  *   **The Second Failure:** It cannot account for instant recognition of novel typefaces. A designer can draw an 'a' that shares no geometric overlap with existing 'a's (no common angles, curves, or proportions), yet readers recognize it immediately. There is no "resemblance" to cluster around.

  **2. The Causal Theory (Historical Chain)**
  This view argues a thing is a member of a category only if it descends from previous members via a historical chain of transmission.
  *   **The Failure Case:** This fails on the "neologism" problem. If I invent a completely new glyph structure today that functions as an 'a', it is an 'a' instantly, not after a historical tradition is established. Typography evolves too fast for causal history to be the primary validator of identity.

  ## Methodology (4 Months, ~10 Hours/Week)
  **Month 1: The Anatomy Language**
  I will develop a formal specification language describing letters via parts (stem, bowl, shoulder) and qualitative relations (attached, enclosed, above, left-of). I will hand-specify a "nasty subset" of letters: **a, o, n, h, b, d**.
  *   *Scope Note:* I recommend cutting your original list (10 letters) down to these 6. The pairs p/q/g are topological rotations of b/d; proving the system works on b/d implies it works on them. This saves ~40 hours for robustness testing.
  *   *Goal:* A text-based spec file for each letter that contains no coordinate data, only relational logic.

  **Month 2: The Generator & Classification**
  I will write a solver that takes a spec file and generates valid SVG outlines by randomizing metrics (width, height, contrast) while strictly enforcing the relational spec.
  *   *Human Trial:* I will recruit 20 participants to classify 50 generated outputs mixed with noise.
  *   *Goal:* Determine if holding the structural spec fixed preserves letter identity despite radical geometric variation.

  **Month 3: Minimal-Edit Experiments**
  I will algorithmically perturb generated glyphs to find the "tipping point" where recognition flips (e.g., an 'a' becomes a 'u').
  *   *Analysis:* I will check if these flips always coincide with a discrete structural event (a counter opening, a stroke detaching) or if there are continuous paths where category changes without structural change.
  *   *Goal:* Verify if perceptual boundaries align with structural boundaries.

  **Month 4: The Held-Out Test**
  I will take a completely unseen type style (e.g., a blackletter or a pixel font), analyze 25 letters to infer the style's metric rules, and generate the 26th letter using only its structural spec and the inferred style.
  *   *Goal:* Test if the system can synthesize missing glyphs that readers accept as belonging to the family.

  ## Failure Conditions
  This project produces a negative result if either of the following occurs:
  1.  **The Threshold Problem:** Every letter's spec requires at least one arbitrary metric threshold (e.g., "aperture must be > 20% of height") to exclude other letters. This would prove "structure" is secretly just "prototype plus thresholds."
  2.  **The Mush Problem:** Human data shows no sharp boundaries during minimal-edit experiments. If recognition degrades gradually rather than flipping at structural breaks, identity is graded mush, not discrete structure.

  ## Deliverables
  *   **Public Repo:** The specification language, the generator code, and the dataset of generated glyphs.
  *   **Writeup:** A non-academic report detailing the specification logic, the failure points discovered, and the results of the human classification trials.

  ## Feasibility Check
  Your original plan for 10 letters is too ambitious for 160 total hours. Building a formal language is deceptively slow; debugging why a spec generates a garbage shape will consume your timeline. Cutting to 6 letters (a, o, n, h, b, d) covers the critical topological variations (closed vs. open, ascender vs. descender, symmetry) without redundancy. This ensures you finish the crucial human testing phase rather than getting stuck defining 'g'.
