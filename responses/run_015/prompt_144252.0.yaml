answer: |-
  In Plato's *Laws*, the Athenian Stranger proposes a provocative civic utility for wine: it is a *pharmakon* that serves as a safe, controlled test of the soul. By loosening the bonds of shame (*aidos*) and fear, intoxication strips away the social mask, allowing the legislator to observe the drinker's true nature. As the Stranger argues, wine does not implant new vices; it merely removes the guardrails that conceal them. The drunkard remains morally continuous with his sober self; he is simply a more honest version of who he always was. In the *Symposium*, this notion is dramatized through Alcibiades, whose drunken confession reveals a pre-existing eros for Socrates, unmasked by wine but not created by it. For Plato, accountability relies on this stability of character: if the self remains intact beneath the influence, the agent remains responsible for the actions performed under it.

  Euripides' *The Bacchae*, however, subjects this Platonic psychology to the terror of divine possession. When viewed through the lens of Dionysian ecstasy, the Platonic distinction between the "masked" and "unmasked" self collapses. In *The Bacchae*, intoxication is not merely a chemical loosening of inhibition but an ontological invasion. The play does not present the Maenads' violence as the disclosure of capacities that were always present, waiting to be revealed; rather, it dramatizes the imposition of a new, alien identity that temporarily displaces the human subject. Through Agave's *sparagmos* of Pentheus, her subsequent awakening, and Cadmus's reflection on human fragility, Euripides suggests that under the influence of the divine *pharmakon*, the self is not tested but shattered. The play ultimately dramatizes the failure of the Platonic assumption of a stable underlying character, positing instead that intoxication can invent a self that the sober agent must later inherit but cannot claim as their own.

  To apply the Platonic lens to the Maenads is to ask: were they always murderers? Pentheus certainly thinks so. He interprets their departure to the mountain as a cover for sexual licentiousness, assuming the wine and ritual merely reveal a latent moral rot. However, the Messenger's speech complicates this. He describes the Maenads as miraculous and peaceful until provoked by the herdsmen. Their violence is defensive until Dionysus actively intervenes to turn the tide against Pentheus. If Plato is right, the wine should have revealed a consistent character. Instead, the *pharmakon* here functions as a vehicle for the god's presence. When Agave seizes Pentheus, she does not see her son; she sees a lion. This is not a removal of social inhibition, which would allow her to see her son and hate him; it is a hallucinatory overwrite of reality. The violence is not the expression of Agave's repressed rage, but the execution of a divine script. The *pharmakon* does not reveal the beast within Agave; it allows the god to wear Agave's hands.

  The crux of the philosophical tension lies in the awakening scene. When the drug of madness recedes, Agave does not wake up as a sober version of the murderer she just was; she wakes up as a stranger to her own actions. Her dialogue with Cadmus is a slow, agonizing reconstruction of a shattered self. She asks him to "piece my mind together," implying that her *phrenes* (mind/diaphragm) were physically displaced. In Platonic terms, the "true" Agave returns, but she returns to a crime she did not cognitively author. When she asks, "Where did he die? In the house or outside?" she is not feigning ignorance; she is experiencing an ontological gap.

  If we strictly apply the *Laws*, Agave remains accountable because the hand that tore the flesh was hers. But Euripides pushes further. Agave's horror stems not just from the act, but from the realization that her agency was hijacked. She says, "I see my misery... but I do not see the guilt." This distinction is vital. Plato assumes guilt and misery are co-extensive because the agent is stable. Euripides separates them. Agave accepts the *consequence* of the act (exile, grief) but the *authorship* remains ambiguous. The violence was not a disclosure of her character, but a temporary replacement of it. The "Dionysian identity" did not coexist with the "Theban mother"; it evicted her.

  Cadmus's reflection on human weakness deepens this rupture. He tells Agave, "The god has done well to punish you, but too severely." He acknowledges the necessity of piety but laments the disproportion of the destruction. His famous consolation, "We are slaves to the gods," suggests a anthropology far more fragile than Plato's. For Plato, the soul is a chariot that can be tested; for Cadmus, the human being is a vessel that can be broken. If the self is so easily displaced by a god, the Platonic project of moral testing via intoxication becomes impossible. You cannot test the stability of a vessel that is designed to shatter under pressure. Cadmus implies that human virtue is not a hard core revealed by wine, but a thin veneer maintained only by the gods' permission.

  This leads to the philosophical distinction between revelatory and transformative intoxication. Revelatory intoxication (Plato) assumes the drug removes obstacles to the true self. Transformative intoxication (Euripides) suggests the drug and ritual construct the very behavior they appear to uncover. In *The Bacchae*, the ritual of the *sparagmos* has a specific form: the tearing of flesh, the hunting of the beast. This form is not generated by Agave's psyche; it is imposed by the cultic tradition and the god's will. If the ritual constructs the violence, then there was no "pre-existing" murderer to be held accountable in the Platonic sense. The "self" that killed Pentheus was a temporary construct of divine madness.

  However, Euripides does not let Agave off the hook entirely, which prevents the play from being a simple case of "the god made me do it." The tragedy lies in the reintegration. Agave must carry the memory of the act into her sober life. The play suggests that while the *capacity* for violence may not have been pre-existing, the *vulnerability* to the god was. Pentheus was destroyed for denying the god; Agave is destroyed for accepting him too fully. Here, Euripides offers a correction to Plato: the self is not stable, but it is porous. Intoxication does not just reveal who we are; it reveals how easily we can cease to be who we are.

  Ultimately, *The Bacchae* dramatizes the failure of Plato's psychology in the face of the sacred. Plato requires a stable subject for his ethics to function; Euripides presents a subject that is fluid, permeable, and susceptible to divine colonization. The play does not support the idea that intoxication reveals the self; it argues that intoxication can dissolve the boundaries of the self entirely. What *The Bacchae* adds to the debate is the dimension of *fragmentation*. It is not a choice between revealing the beast or inventing the monster. Rather, the play suggests that the "human self" is a fragile coalition of sanity, social role, and divine favor. When the *pharmakon* of Dionysus is applied, the coalition breaks. The horror of the play is not that Agave was always a killer, but that she was capable of becoming one without ceasing to be Agave. Intoxication, in Euripides' hands, does not reveal the true self because, under the pressure of the divine, there is no true self to find—only the wreckage of the one that was there before.
