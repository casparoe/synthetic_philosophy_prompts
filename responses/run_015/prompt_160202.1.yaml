answer: |-
  **Scenario**
  Alex lives in London. A rival firm's intelligence unit (the Pursuer) is compiling a dossier to intercept him tomorrow. Alex can Stay (London) or Flee (Berlin). Staying leaves a fixed digital footprint at home; Fleeing creates a booking trail but disperses him among many possible destinations. Consequently, the Pursuer's forecast matches Alex's location 95% of the time if he Stays, but only 10% of the time if he Flees (meaning 90% chance they forecast Berlin). The unconditional base rate for a London forecast is 85%, reflecting Alex's settled life. Before acting, Alex receives a leaked text from a bribed clerk (the Gate). The clerk is 75% reliable: $P(\text{Report}=F | \text{Forecast}=F) = 0.75$. The report is independent of Alex's act given the forecast. The report names Berlin.

  **Decision Table**
  | Parameter | Value | Story |
  | :--- | :--- | :--- |
  | **Utilities** | | |
  | Survival | 100 | Life continues. |
  | Death | 0 | Intercepted. |
  | Cost of Fleeing | 10 | Lost deposit, ticket, disruption. |
  | **Probabilities** | | |
  | Base Rate $P(F_L)$ | 0.85 | Pursuer defaults to London. |
  | Hit Rate $P(F_L \mid \text{Stay})$ | 0.95 | Hard to hide at home. |
  | Hit Rate $P(F_L \mid \text{Flee})$ | 0.10 | Hard to predict destination. |
  | Gate Reliability | 0.75 | Clerical error/noise. |

  **Calculations**
  *No Gate:*
  **CDT:** Uses base rates. $P(\text{Live} \mid \text{Stay}) = 0.15$; $P(\text{Live} \mid \text{Flee}) = 0.85$. Net: Stay 15, Flee 75. **Verdict: Flee.**
  **EDT:** Uses act-conditional rates. $P(\text{Live} \mid \text{Stay}) = 0.05$; $P(\text{Live} \mid \text{Flee}) = 0.90$. Net: Stay 5, Flee 80. **Verdict: Flee.**

  *With Gate (Report = Berlin):*
  **CDT:** Updates state credence on Report, holds act fixed. $P(F_L \mid R_B) \approx 0.69$. $P(\text{Live} \mid \text{Stay}) = 0.31$; $P(\text{Live} \mid \text{Flee}) = 0.69$. Net: Stay 31, Flee 59. **Verdict: Flee.**
  **EDT:** Updates state credence on Report *and* Act. $P(F_L \mid \text{Stay}, R_B) \approx 0.86$; $P(F_L \mid \text{Flee}, R_B) \approx 0.04$.
  $P(\text{Live} \mid \text{Stay}) = 0.14$; $P(\text{Live} \mid \text{Flee}) = 0.04$. Net: Stay 14, Flee -6. **Verdict: Stay.**

  **Analysis**
  **Load-bearing Feature:** The partial screening-off. The Report informs the Forecast, but the Act remains evidentially relevant to the Forecast conditional on the Report. This allows EDT to see the Act as confirming the deadly forecast while CDT sees the Act as merely choosing a location relative to a fixed (though uncertain) threat.

  **Ablations:**
  1.  *Equal Hit Rates:* If $P(F_L \mid \text{Stay}) = P(F_L \mid \text{Flee})$, the Act provides no evidence about the Forecast. EDT collapses to CDT; both Flee.
  2.  *Perfect Gate:* If Reliability = 1.0, the Forecast is known ($F_B$). CDT treats $F_B$ as fixed and says Stay (London). EDT also says Stay. The disagreement vanishes.

  **Sensitivity:**
  CDT's verdict is most sensitive to the **Base Rate**. If $P(F_L)$ drops below 0.78, CDT switches to Stay (the Report outweighs the prior). EDT's verdict is most sensitive to the **Hit Rate Correlation**. If $P(F_L \mid \text{Flee})$ rises above 0.25, EDT switches to Flee (the Act no longer strongly signals death).

  **Best EDT Attack:**
  An evidentialist may argue the verdict is unstable: knowing one will Stay makes Stay look safe, but knowing one will Flee makes Flee look deadly. However, this instability is the point; it highlights how EDT treats the decision as a diagnostic test. This case tests the disagreement better than the infallible original because it demonstrates that the divergence persists even when the predictor is fallible and the agent has independent evidence, isolating the structural difference in how theories handle act-forecast correlations rather than relying on metaphysical impossibility.
