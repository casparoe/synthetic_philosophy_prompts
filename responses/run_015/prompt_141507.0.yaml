      *   *Case 2: CNN, photos + crowdworker labels.* -> **Not Grounded.**
          *   *Reasoning:* "Link... is a person's keystrokes." (The Chinese Room / Proxy argument). The system doesn't know *why* the label matches the image, only that a human said so.
      *   *Case 3: Transformer, web text, no perception/action.* -> **Not Grounded.**
          *   *Reasoning:* Purely linguistic distribution. No contact with the world.
      *   *Case 4: Transformer, transcripts of narration.* -> **Not Grounded.**
          *   *Reasoning:* "Testimony about the world doesn't transmit grounding." (Second-hand knowledge isn't grounding).
      *   *Case 5: Network, robot (camera/gripper), RL with environmental reward.* -> **Grounded.**
          *   *Reasoning:* Direct causal loop. Action affects state, state determines reward. The system "feels" the consequences.
      *   *Case 6: Network, video/audio, next-sensory-prediction, no action.* -> **Grounded (degenerate).**
          *   *Reasoning:* Direct sensory contact, even without action. Prediction error minimization against reality counts as a link.

      *   *Synthesis of Criteria:*
          *   **Necessary Condition:** There must be a direct causal coupling between the system's internal states and the physical environment (sensors/actuators).
          *   **Necessary Condition:** The link cannot be mediated solely by human semantic labeling (crowdworkers, text).
          *   **Sufficient Condition (Strong):** Closed-loop sensorimotor contingency with environmental reward (Case 5).
          *   **Sufficient Condition (Weak):** Direct sensory prediction, even passive (Case 6).
          *   **Key Distinction:** It's not about *what* the system knows (ontology, text), it's about *how* the internal states acquired their functional role. Did they acquire it through interaction with the referent, or through correlation with other symbols/human labels?

  3.  **Analyze the Target System (The Frozen LLM + Robot):**

      *   *Architecture:* Frozen LLM (Text) + Trainable Adapters (Vision/Motor).
      *   *Training:* Adapters trained via RL on real robot tasks.
