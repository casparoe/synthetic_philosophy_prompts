      *Final check on the "Locus":* The prompt asks "should the verdict attach to the frozen model, to the composite system, or to the individual symbol". I need to argue that for SGP, it *must* be the symbol/representation, otherwise the problem dissolves into "does the robot work?". Her Case 2 verdict supports this (CNN system = not grounded).

