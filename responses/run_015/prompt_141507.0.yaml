      *   *Hypothesis C: The "Information Flow" Rule (The Hedge).*
          *   Grounding requires gradients (learning signals) to flow from the environment into the representation.
          *   *Application:* Gradients flow through adapters but stop at the LLM. The LLM's representation of "fragile" is not updated by the physical reward.
          *   *Verdict:* Not Grounded (or "Partially Grounded" / "Hedge").

      *   *Hypothesis D: The "Dependency" Rule (Based on the collapse test).*
