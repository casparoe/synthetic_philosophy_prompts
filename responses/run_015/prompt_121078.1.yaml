answer: |-
  Here are the five distinct claims hiding inside "the dead can't sue," broken down by truth, logic, and utility.

  **1. The Standing Claim**
  *   **The Claim:** A deceased person lacks legal capacity to initiate a lawsuit.
  *   **True?** Yes. Legally, a corpse is not a person.
  *   **Derivation:** Direct legal fact.
  *   **Meeting Utility:** **High.** This is the only claim that justifies the lawyer's green light. It clears the *composer* as a plaintiff.

  **2. The Defamation Claim**
  *   **The Claim:** There is no cause of action for libel or defamation of the dead.
  *   **True?** Yes, in almost all U.S. jurisdictions.
  *   **Derivation:** Follows from Claim 1.
  *   **Meeting Utility:** **High.** This confirms the publisher won't be sued for damaging the *composer's* reputation.

  **3. The Moral Harm Claim**
  *   **The Claim:** You cannot wrong someone who no longer exists to experience the wrong.
  *   **True?** Debatable. Philosophically contested (see: wills, promises, legacy).
  *   **Derivation:** **Independent.** This does *not* follow from the legal point. Law is not morality.
  *   **Meeting Utility:** **None.** This absolves guilt, not liability. It doesn't justify the scene ethically.

  **4. The Survivor Claim**
  *   **The Claim:** Because the composer can't sue, no one else can sue over his portrayal.
  *   **True?** **False.** Living relatives (the sister) can sue for defamation *by implication*, false light, or intentional infliction of emotional distress if the lie damages *them* or is extreme enough.
  *   **Derivation:** **Independent.** This is a logical leap the lawyer skipped.
  *   **Meeting Utility:** **Negative.** This is why your agent is nervous. The lawyer addressed the dead man; the risk is the living woman.

  **5. The Historical Record Claim**
  *   **The Claim:** Readers will understand this is fiction, so the historical record isn't harmed.
  *   **True?** Often False. Readers frequently conflate biographical fiction with fact.
  *   **Derivation:** **Independent.** Requires a separate argument about disclaimers and genre expectations.
  *   **Meeting Utility:** **Low.** This affects reputation, not liability. It doesn't stop the meeting, but it should haunt the decision.

  **The Bottom Line for Your Call**
  The lawyer's line only validates Claims 1 and 2. It legally clears the composer. It does **not** clear the sister (Claim 4), nor does it address the ethics (Claim 3) or the history (Claim 5). Your agent is nervous about Claim 4. To move forward, you need an argument for why the sister has no recourse, not just why the brother can't sue.
