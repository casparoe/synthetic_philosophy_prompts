answer: |-
  The problem of multi-layered modal structures presents a significant stress test for contemporary metaphysics of science. This issue arises when we consider scenarios where a global, higher-level regularity—such as a conservation principle—appears to constrain lower-level local patterns without being merely reducible to them. In such cases, the higher-level law does not simply describe the aggregate behavior of the lower level; it acts as a boundary condition that limits what lower-level interactions are possible. This hierarchical relationship forces both Humean and anti-Humean theories to confront difficulties regarding the unity of natural law and the direction of explanation.

  For the anti-Humean, who views laws as primitive, governing relations that actively produce or necessitate regularities in the world, the existence of layered modal structures creates a dilemma regarding the nature of the governing relation itself. If a higher-level conservation law constrains lower-level dynamical laws, one must ask what metaphysical glue holds these two layers together.

  The first option for the anti-Humean is to maintain that the governing relation holds uniformly across all layers. On this view, the same type of necessitation that connects a law to a particular fact also connects a higher-order law to a lower-order law. However, this invites a potential regress or category error. If laws are entities that govern particulars, what kind of entity is a law that governs another law? If the relation is identical, it suggests that higher-level laws are just more fundamental particulars in a chain of command. This risks collapsing the distinction between layers, making the higher-level law just another efficient cause rather than a structural constraint. Furthermore, it raises the question of what governs the relation between the two laws. If a meta-law is required to link the conservation principle to the dynamical principle, the theory faces an infinite regress of governing relations.

  The second option is to multiply the modal relations. The anti-Humean might argue that the relation between a law and a fact is distinct from the relation between a higher-order law and a lower-order law. Perhaps the former is "necessitation" while the latter is "constraint" or "entailment." While this avoids the regress, it fragments the ontology of lawhood. If the modal force operating at the global level is metaphysically distinct from the force operating at the local level, the unity of the concept of "natural law" is threatened. The theory must then explain why these distinct relations are grouped under the same label and how they interact without a further connecting principle. Consequently, the anti-Humean struggles to account for layered structures without either oversimplifying the hierarchy into a flat chain of command or complicating the ontology with distinct species of modality.

  For the Humean, who denies that laws govern and instead views them as summaries of the total distribution of local matters of fact, the challenge is primarily explanatory. In the Humean framework, often articulated through the Best-Systems Analysis, the fundamental ontology is flat: there is only the "Humean mosaic" of local particular facts. Laws are merely the axioms of the deductive system that best balances simplicity and strength in describing this mosaic.

  The conceptual issue here is recovering the explanatory asymmetry inherent in layered structures. Intuitively, we say that the conservation of energy explains why certain particle interactions do not occur, not vice versa. The higher-level principle constrains the lower-level events. However, for the Humean, the metaphysical dependence runs in the opposite direction: the local facts make the higher-level law true. If the particle interactions were different, the conservation law would not hold. This creates a tension between the direction of metaphysical determination (bottom-up) and the direction of scientific explanation (top-down).

  To resolve this, the Humean must argue that the explanatory asymmetry is pragmatic or epistemic rather than metaphysical. They claim that the conservation principle explains the local patterns because it is part of the best systematization of the facts. It is more efficient to cite the global constraint than to list every local interaction. However, this defense walks a tightrope. If the Humean insists that the higher-level law *constrains* the lower-level patterns, they risk implicitly relying on a governing metaphor. To say a law constrains facts suggests the law has a status independent of the facts, capable of ruling them out. This is precisely the anti-Humean view the Humean seeks to reject.

  If the Humean retreats to the claim that "constraint" is merely a figure of speech for "efficient summary," they may fail to capture the modal force scientists attribute to conservation principles. Scientists treat these principles as ruling out physically impossible scenarios, not just as convenient shorthand for what actually happens. If the Best-Systems Analysis cannot distinguish between a genuine modal constraint and a highly general regularity without invoking a notion of governance, it fails to recover the robust explanatory asymmetry required by the science. Thus, the Humean faces the charge that their account renders the hierarchy of laws illusory, reducing structural constraints to mere patterns in the data.

  In summary, multi-layered modal structures expose a fissure in both dominant theories of natural law. The anti-Humean preserves the robustness of the hierarchy but struggles to define the metaphysical relations between layers without fragmentation or regress. The Humean preserves a parsimonious ontology but struggles to validate the top-down explanatory power of higher-level laws without covertly appealing to the very governing relations they deny. Both positions are forced to make costly trade-offs between metaphysical clarity and fidelity to scientific practice.
