  # Decision Tree: Fundamental Sentience and Ethical Upshot

  **Root Commitment:** Physics' formal, structural description of the world is correct as far as it goes.

  ### **Node 1:** Does the structural/mathematical description of physical entities exhaust their intrinsic nature?
  *   **Yes** → Go to Node 2.
  *   **No** → Go to Node 3.

  ### **Node 2:** (If Exhaustive) Is conscious experience a real phenomenon to be explained?
  *   **No** → **Leaf 1: Illusionism.**
  *   **Yes** → **Leaf 2: Non-Reductive Physicalism.** (Go to Node 8).

  ### **Node 3:** (If Not Exhaustive) Is the intrinsic nature itself experiential?
  *   **No** (It is merely apt to constitute experience) → **Leaf 3: Panprotopsychism.**
  *   **Yes** → Go to Node 4.

  ### **Node 4:** To what does this intrinsic experiential nature primarily attach?
  *   **The Cosmos as a Whole** → Go to Node 5.
  *   **Fundamental Micro-entities/Fields** → Go to Node 6.

  ### **Node 5:** (If Cosmos) Are local subjects (like humans) real distinct fragments of the cosmic subject?
  *   **No** → **Leaf 4: Strict Cosmopsychism.** (Go to Node 8).
  *   **Yes** → **Leaf 5: Fragmentalist Cosmopsychism.** (Go to Node 8).

  ### **Node 6:** (If Micro) Do macroscopic subjects (like humans) exist?
  *   **No** → **Leaf 6: Micropsychism (No Macro-Subjects).** (Go to Node 8).
  *   **Yes** → Go to Node 7.

  ### **Node 7:** (If Macro Exist) Are macroscopic subjects constituted by the micro-subjects?
  *   **No** (They emerge as novel entities) → **Leaf 7: Emergentist Panpsychism.** (Go to Node 8).
  *   **Yes** → **Leaf 8: Constitutive Panpsychism.** (Go to Node 8).

  *(Note: Leaves 1 and 3 terminate here as they imply no fundamental experience in a rock. Leaves 2, 4, 5, 6, 7, 8 proceed to ethical evaluation.)*

  ### **Node 8:** Can valence (suffering/pleasure) exist independently of complex cognition, self-modeling, or representational content?
  *   **No** (Valence requires complex cognitive architecture) → **Leaf 9-14: Cognitive-Dependent Valence.** (See Leaf Details).
  *   **Yes** (Pure affect is possible) → Go to Node 9.

  ### **Node 9:** (If Valence Detachable) In a rock at thermal equilibrium, is there a non-arbitrary physical criterion that counts distinct subjects?
  *   **No** (Subject count is vague, zero, or collapses to One) → **Leaf 15-17: Indeterminate/Unity Count.** (See Leaf Details).
  *   **Yes** (There are astronomically many distinct micro-subjects) → Go to Node 10.

