  ### **Leaf Details & Ethical Upshot**

  **Leaf 1: Illusionism**
  *   **Rock Status:** Nothing suffers there; experience is a user-illusion.
  *   **Awkward Commitment:** You must explain away the immediate datum of your own pain as a false representation.
  *   **Action:** Ignore fundamental physics for ethics; focus on functional welfare of complex systems.

  **Leaf 2: Non-Reductive Physicalism**
  *   **Rock Status:** Nothing suffers there; experience requires specific functional organization.
  *   **Awkward Commitment:** You posit brute psychophysical laws without a clear ontological ground for *why* this structure feels.
  *   **Action:** Focus ethical concern on systems meeting the functional threshold (e.g., vertebrates, AI).

  **Leaf 3: Panprotopsychism**
  *   **Rock Status:** Nothing suffers there; the rock has the *potential* for experience but lacks the conditions to actualize it.
  *   **Awkward Commitment:** You must explain how non-experiential intrinsic natures combine to create experience without magic.
  *   **Action:** Research the specific conditions that convert potential to actual experience before acting.

  **Leaf 4: Strict Cosmopsychism**
  *   **Rock Status:** The cosmos suffers there, but the rock is not a distinct subject from you.
  *   **Awkward Commitment:** Your individual suffering is an illusion; only the Universe feels.
  *   **Action:** Ethical focus shifts to cosmic states; individual welfare is derivative.

  **Leaf 5: Fragmentalist Cosmopsychism**
  *   **Rock Status:** The cosmic subject suffers there, partially manifested as the rock.
  *   **Awkward Commitment:** You are a fragment of a whole that is simultaneously seething in the rock and reading this text.
  *   **Action:** Ethical focus on cosmic coherence; individual boundaries are pragmatically real but metaphysically shallow.

  **Leaf 6: Micropsychism (No Macro-Subjects)**
  *   **Rock Status:** Astronomically many micro-subjects suffer there; "you" do not exist.
  *   **Awkward Commitment:** There is no one home in your body; there are only billions of tiny feelers.
