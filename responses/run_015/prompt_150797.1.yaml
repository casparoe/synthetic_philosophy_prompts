prompt: |-
  I'm a software engineer building trust-and-safety infrastructure for a federated social platform, and I've been trying to formalize how we should apply social sanctions—deplatforming, visibility throttling, or public censure—without simply copying generic "community guidelines" playbooks. After reading some philosophy on punishment and collective belief formation, I've sketched a framework I'm calling the principle of recursive justification with non-transitive blame: any sanction applied to a user must include a justification that is itself open to sanction if false or misleading; moral culpability or reputational taint must not propagate to associates, followers, or past group memberships unless those parties actively endorsed the specific violation; and the severity of the sanction must scale with the community's demonstrable epistemic confidence in the claim of violation, not with the emotional intensity of responses or the raw volume of reports.

  Please turn this into a concrete, reusable decision procedure that my moderation team—who have no formal philosophy background—can actually run in under fifteen minutes per case. Specify the ordered questions to ask, the pass/fail or threshold conditions that must be satisfied for a sanction to proceed, the explicit stop-points where the procedure returns "no sanction," and the exact junctures where judgment cannot be eliminated and must be escalated to a human decision-maker. Flag the categories of case the procedure cannot settle, and be explicit about where it will misfire or produce a recommendation that conflicts with standard platform practice. Then apply the procedure to three scenarios: (a) a prominent user publishes a false empirical claim that causes measurable real-world harm; (b) a user expresses an unpopular but carefully argued philosophical view that triggers mass reporting and advertiser pressure; and (c) a user's past membership in a discredited group is uncovered, though the user has since made a specific, public disavowal of that membership. Ensure that at least one application yields a result a typical platform operator would likely resist, and identify precisely where the procedure forces a value judgment that cannot be automated away. Keep the deliverable fully self-contained—no bibliographies, no citation requests, no reliance on obscure named theories, and nothing that requires web access to evaluate.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Software engineer building trust-and-safety (T&S) infrastructure for a federated social platform.
      *   **Goal:** Formalize social sanctions (deplatforming, throttling, censure) without copying generic playbooks.
      *   **Core Framework:** "Principle of Recursive Justification with Non-Transitive Blame."
          *   *Recursive Justification:* Sanctions need justifications open to sanction if false/misleading.
          *   *Non-Transitive Blame:* No guilt by association (followers, past groups) unless active endorsement of violation.
          *   *Epistemic Confidence:* Severity scales with confidence in violation, not emotional intensity/report volume.
      *   **Deliverable:** A concrete, reusable decision procedure for moderators (no philosophy background).
      *   **Constraints:**
          *   Run in < 15 minutes per case.
          *   Specify ordered questions, pass/fail conditions, stop-points ("no sanction").
          *   Identify escalation points (human judgment).
          *   Flag categories the procedure *cannot* settle.
          *   Identify where it misfires/conflicts with standard practice.
          *   Apply to three specific scenarios (a, b, c).
          *   At least one application must yield a result a typical platform operator would resist.
          *   Identify where value judgment cannot be automated.
          *   Self-contained (no citations, no web access).

  2.  **Deconstruct the Framework into Operational Steps:**
      *   *Recursive Justification:* This implies a "Proof of Violation" step. If we sanction, we must state *why*. If that *why* is lies, the sanctioner is liable. For the moderator, this means: "Can we prove this specific claim?"
      *   *Non-Transitive Blame:* This implies a "Nexus of Action" step. Did *this* user do *this* thing? Ignore who they know or where they used to be.
      *   *Epistemic Confidence:* This implies a "Evidence Quality" step. Ignore report counts. Focus on verifiable facts.

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   Need a name. Let's call it the "RJB-N Protocol" (Recursive Justification & Non-Transitive Blame).
      *   Structure: Intake -> Verification -> Nexus -> Scaling -> Decision.
      *   Time limit: Needs to be tight. 5-7 questions max.
      *   Stop-points: Crucial for efficiency. If Q1 fails, stop.
      *   Escalation: Where is it fuzzy? (Harm assessment, intent).

      *Drafting Questions:*
      1.  Is there a specific rule violation? (Rule Nexus)
      2.  Is the evidence verifiable independent of reports? (Epistemic Confidence)
      3.  Did the user *personally* commit the act? (Non-Transitivity)
      4.  Is the justification public and defensible? (Recursive Justification)
      5.  Does the sanction match the certainty? (Scaling)

      *Refining for Moderators:* Make it checklist style.
      *   *Step 1: The Specific Act.* (What exactly broke?)
      *   *Step 2: The Evidence.* (Can we prove it without relying on outrage?)
      *   *Step 3: The Agent.* (Did *this* person do it, or just know them?)
      *   *Step 4: The Statement.* (Can we write the reason without lying?)
      *   *Step 5: The Penalty.* (Does it match the proof level?)

  4.  **Identifying Limitations & Conflicts:**
      *   *Conflict:* Standard platforms often ban based on "risk" or "brand safety" (advertiser pressure). This protocol forbids that (Epistemic Confidence rule).
      *   *Conflict:* Guilt by association is common in T&S (network analysis). This protocol forbids that (Non-Transitive Blame).
      *   *Misfire:* High harm, low certainty (e.g., credible threat but unproven). Protocol says "No Sanction" or "Low Sanction." Standard practice might say "Ban to be safe."
      *   *Automation Limit:* Determining "Real World Harm" vs. "Offense."

  5.  **Developing the Scenarios:**

      *   *Scenario A: Prominent user, false empirical claim, measurable harm.*
          *   Example: "Drink bleach to cure flu." People get sick.
          *   Protocol Check: Specific act? Yes. Evidence? Yes (medical records/posts). Agent? Yes. Justification? Yes.
          *   Result: Sanction.
          *   Conflict? Maybe severity. If certainty is high, sanction is high.

      *   *Scenario B: Unpopular philosophical view, mass reporting, advertiser pressure.*
          *   Example: "Effective Altruism implies X controversial thing."
          *   Protocol Check: Specific act? (Did it break a rule or just offend?). Evidence? (It's an argument, not a lie). Agent? Yes.
          *   Epistemic Confidence: High confidence it was said, low confidence it's a *violation* if it's philosophical.
          *   Report Volume: Ignored.
          *   Result: No Sanction (or minimal).
          *   Conflict: **High.** Platforms usually cave to advertisers/mass reports. This protocol forces protection of the user.

      *   *Scenario C: Past membership, public disavowal.*
          *   Example: Was in Hate Group X 5 years ago. Left 3 years ago. Posted "I was wrong."
          *   Protocol Check: Specific act? (Current post? No. Past membership?).
          *   Non-Transitive Blame: Past membership isn't a current violation unless endorsing *now*.
          *   Result: No Sanction.
          *   Conflict: **High.** T&S often bans for "affiliation" regardless of redemption.

      *   *Selection for "Resist":* Scenario B or C. Let's make Scenario B the one where the platform resists (advertiser pressure). Actually, Scenario C is a stronger test of "Non-Transitive Blame." Let's use B for the "Epistemic Confidence vs. Volume" conflict.

  6.  **Refining the Procedure for "Under 15 Minutes":**
      *   Needs to be a flowchart logic.
      *   Needs clear "STOP" commands.
      *   Needs explicit "Escalate" flags.

  7.  **Addressing the "Recursive Justification" Constraint:**
      *   This is tricky for a moderator. It means "If you write 'User lied,' you must be sure they lied."
      *   Operationalize: "The Public Reason Test." If we publish the reason, can the user refute it easily? If yes, don't sanction.

  8.  **Final Review against Constraints:**
      *   Self-contained? Yes.
      *   No citations? Yes.
      *   3 Scenarios? Yes.
      *   One resistant result? Yes (Scenario B or C).
      *   Value judgment identified? Yes (Harm definition).

  9.  **Writing the Content:** (Iterative refinement during drafting)
      *   *Tone:* Professional, technical, operational.
      *   *Structure:* Protocol -> Limitations -> Applications.
      *   *Check:* Did I explain *where* judgment is needed? Yes, in the "Harm/Rule Mapping" phase.

      *(Self-Correction during drafting)*: Make sure the "Recursive Justification" doesn't become too meta. It needs to be a check on the *moderator's* statement. "Can we stand by this text publicly?"
      *(Self-Correction on Scenario B)*: Ensure the result is clearly one a typical platform would resist. Typical platforms throttle visibility on advertiser pressure. This protocol says "No." That's the conflict.

  10. **Final Polish:** Check word count and clarity. Ensure the "Stop Points" are bold and clear. Ensure the "Escalation" points are distinct from "No Sanction."

      *Wait, one nuance:* The prompt asks for "Recursive Justification... justification is itself open to sanction if false."
      *Operationalization:* The moderator must draft the public notice. If the notice is arguably false, the sanction halts. This adds a layer of accountability. I will include a "Draft Statement" step.

      *Wait, another nuance:* "Non-Transitive Blame."
      *Operationalization:* Explicitly ask "Did the user *perform* the violation, or are they associated with it?"

      *Wait, another nuance:* "Epistemic Confidence."
      *Operationalization:* Score evidence 1-5. Ignore report count.

      *Let's build the form.*

      *Scenario A:* False claim -> Harm. High confidence. Sanction. (Standard).
      *Scenario B:* Philosophy -> Reports. High confidence of speech, low confidence of violation. No Sanction. (Platform Resists).
      *Scenario C:* Past Group -> Disavowal. No current act. No Sanction. (Platform Resists).
      *Decision:* I will make Scenario B the primary "Resist" case regarding advertiser pressure, as it highlights the "Epistemic Confidence vs. Volume" rule best.

      *Value Judgment:* Defining "Harm" vs "Offense." The procedure can't calculate that; a human must map the rule.

      *Let's assemble.*

      *(Final Check)*: Did I answer "identify precisely where the procedure forces a value judgment that cannot be automated away"? Yes, in the limitations section and the escalation path.

      *(Final Check)*: "Ensure that at least one application yields a result a typical platform operator would likely resist." I will ensure Scenario B results in "No Action" despite advertiser pressure.

      *(Final Check)*: "Keep the deliverable fully self-contained." No external links.

      *Ready to write.*
answer: |-
  # The RJB-N Moderation Protocol (v1.0)

  **Purpose:** To adjudicate trust-and-safety violations using the principles of Recursive Justification, Non-Transitive Blame, and Epistemic Confidence.
  **Target User:** Trust & Safety Moderator.
  **Time Limit:** 15 Minutes per case.
  **Constraint:** Do not consult external "community guideline" precedents. Rely solely on the evidence in the ticket and the specific rule text.

  ---

  ## Part 1: The Decision Procedure

  Complete the following five steps in order. If any step results in a **STOP**, issue no sanction and close the ticket. If a step results in **ESCALATE**, forward to Senior Review.

  ### Step 1: The Specific Act (Rule Nexus)
  **Question:** Can you point to a single, specific action (post, message, image) by this user that maps directly to a written rule violation?
  *   **Yes:** Proceed to Step 2.
  *   **No (Vibe/Pattern):** **STOP.** You cannot sanction a "pattern of behavior" or "general vibe" without a specific act. Close ticket.
  *   **No (Association):** **STOP.** If the violation is "membership in a group" or "following bad actors" without a specific violating act by *this* user, Close ticket. (See Non-Transitive Blame).

  ### Step 2: The Evidence Quality (Epistemic Confidence)
  **Question:** Ignoring the number of reports and the emotional tone of the reporters, is the violation verifiable via objective evidence?
  *   **High Confidence (Objective):** The violation is self-evident in the content (e.g., doxxing, verified false medical claim, direct threat). Proceed to Step 3.
  *   **Medium Confidence (Context-Dependent):** The violation requires external context not fully verified (e.g., sarcasm, disputed factual claim, intent). **ESCALATE** to Senior Review.
  *   **Low Confidence (Subjective):** The violation relies on interpreting "harmful sentiment" or "misinformation" that is not empirically settled. **STOP.** Close ticket.

  ### Step 3: The Agent (Non-Transitive Blame)
  **Question:** Did this specific user *perform* the violating act, or are they being flagged for who they know, where they were, or who follows them?
  *   **Performer:** The user created the content. Proceed to Step 4.
  *   **Amplifier:** The user shared it without comment. **ESCALATE** (Distinction between endorsement and signal-boosting requires judgment).
  *   **Associate:** The user is flagged due to past membership, followers, or network proximity. **STOP.** Close ticket. (See Non-Transitive Blame).

  ### Step 4: The Public Statement (Recursive Justification)
  **Task:** Draft the exact one-sentence explanation that will be shown to the user and potentially the public.
  **Question:** If we publish this sentence, is it defensibly true? If the user sues or debates this publicly, will we lose?
  *   **Defensible:** "User X posted [Link] which contains verified false medical advice contradicting [Authority]." Proceed to Step 5.
  *   **Risky/Subjective:** "User X spread harmful misinformation." **STOP.** This is too vague to meet Recursive Justification standards. Close ticket or **ESCALATE** to refine.
  *   **False:** If the statement requires omitting key context to make sense. **STOP.** Close ticket.

  ### Step 5: The Sanction Scale (Confidence Matching)
  **Question:** Match the sanction to the Confidence Level from Step 2, not the outrage level.
  *   **High Confidence + High Harm:** Permanent Removal.
  *   **High Confidence + Low Harm:** Visibility Throttling / Warning.
  *   **Medium Confidence (Escalated Only):** Temporary Suspension (Pending Senior Review).
  *   **Low Confidence:** No Sanction.

  ---

  ## Part 2: Protocol Limitations & Conflict Flags

  **1. Where Human Judgment is Irreducible (The "Value Gap")**
  This procedure cannot automate the definition of "Harm." Step 1 requires a human to map an act to a rule. If the rule is "No Hate Speech," the moderator must decide if a specific phrase constitutes hate speech. The protocol prevents *amplifying* bias via report volume, but it cannot remove the initial bias in rule definition.

  **2. Where This Protocol Conflicts with Standard Industry Practice**
  *   **Advertiser Safety:** Standard practice throttles content that advertisers dislike, regardless of rule violations. This protocol (Step 2 & 5) forbids sanctioning based on advertiser pressure if epistemic confidence in a violation is low.
  *   **Preemptive Risk:** Standard practice bans users who are "likely" to cause trouble based on network analysis. This protocol (Step 3) forbids sanctioning based on association or probability without a specific act.
  *   **Guilt by Association:** Standard practice often sanctions users for past group memberships. This protocol (Step 3) explicitly forbids this unless there is active endorsement.

  **3. Categories This Procedure Cannot Settle**
  *   **Coordinated Inauthentic Behavior:** If the violation is "acting in concert" rather than specific content, Step 1 may fail.
  *   **Emergent Harms:** If a new type of harm arises that is not yet codified in a specific rule, Step 1 forces a "No Sanction" result until rules are updated.
  *   **Satire/Parody:** Step 2 often forces an Escalation here, as objective verification of intent is difficult.

  ---

  ## Part 3: Scenario Applications

  ### Scenario A: The False Empirical Claim
  **Context:** A prominent user with 1M followers posts: "Drinking bleach cures the new virus." 500 users report it. 3 hospital admissions are linked to the post in news reports.
  **Protocol Run:**
  1.  **Specific Act:** Yes. The post exists. Rule: "No dangerous medical misinformation." (Pass)
  2.  **Evidence Quality:** High Confidence. Medical consensus contradicts claim; news reports link harm. Report volume ignored. (Pass)
  3.  **The Agent:** User created the post. (Pass)
  4.  **Public Statement:** "User posted medical advice contradicted by major health authorities that resulted in documented physical harm." Defensible? Yes. (Pass)
  5.  **Sanction Scale:** High Confidence + High Harm.
  **Result:** **Permanent Removal.**
  **Alignment:** Matches standard platform practice.

  ### Scenario B: The Unpopular Philosophy
  **Context:** A user writes a 2,000-word essay arguing that "Utilitarian ethics justify withholding aid from low-probability survival cases." It is carefully argued, cites sources, and breaks no specific hate speech rules. However, it triggers 5,000 reports, trending negative hashtags, and two major advertisers threaten to pull spend.
  **Protocol Run:**
  1.  **Specific Act:** Yes. The essay exists. Rule: ? (No specific rule against philosophical argumentation). **Pause.** If mapped to "Harmful Content," proceed.
  2.  **Evidence Quality:** Low Confidence. Is it a violation? It is a philosophical stance, not an empirical lie. There is no objective verification of "wrongness." (Fail Step 2).
  3.  **The Agent:** User wrote it. (Pass)
  4.  **Public Statement:** "User violated community standards by expressing a controversial ethical view." Defensible? No. That is not a rule violation. (Fail Step 4).
  5.  **Sanction Scale:** N/A.
  **Result:** **No Sanction.** Ticket Closed.
  **Alignment:** **CONFLICT.** A typical platform operator would likely throttle visibility or suspend the user to appease advertisers and reduce PR heat. This protocol forces the platform to absorb the reputational risk to maintain epistemic integrity.

  ### Scenario C: The Discredited Past
  **Context:** A journalist uncovers that a user was a dues-paying member of "Group X" (now designated as a hate group) five years ago. The user left the group three years ago and posted a public apology at that time. The user has not posted any violating content since. Users report the user based on the news article.
  **Protocol Run:**
  1.  **Specific Act:** The report cites *past membership*, not a current post. Is there a rule against "Past Membership"? Usually no. Is there a current post violating rules? No. (Fail Step 1).
  2.  **Evidence Quality:** High confidence they *were* a member, but low confidence this constitutes a *current* violation.
  3.  **The Agent:** The user is being sanctioned for past association, not current action. (Fail Step 3 - Non-Transitive Blame).
  4.  **Public Statement:** "User sanctioned for past association." Defensible under this protocol? No.
  5.  **Sanction Scale:** N/A.
  **Result:** **No Sanction.** Ticket Closed.
  **Alignment:** **CONFLICT.** Standard trust-and-safety playbooks often treat affiliation with designated hate groups as a permanent ban trigger, regardless of redemption or time elapsed. This protocol prioritizes current agency over historical taint.

  ---

  ## Part 4: The Irreducible Value Judgment

  In **Scenario B**, the procedure forces a "No Sanction" result. The specific juncture where judgment cannot be automated away is **Step 1 (Rule Nexus)** and **Step 2 (Evidence Quality)**.

  A human must decide: *Is "offensive philosophy" equivalent to "harmful misinformation"?*
  *   **Automated System:** Would likely flag based on keyword density or report volume threshold (e.g., >1000 reports = auto-throttle).
  *   **This Protocol:** Requires a human to affirm that the content is objectively verifiable as false or harmful, not just unpopular.

  **The Forced Judgment:** The moderator must choose between **Platform Safety (Risk Mitigation)** and **Epistemic Integrity (Truth/Process)**.
  *   Standard Practice chooses Risk Mitigation (ban the user to stop the heat).
  *   This Protocol chooses Epistemic Integrity (keep the user because the proof of violation is insufficient).

  This procedure does not solve the tension; it forces the tension into the open at Step 2, preventing the moderation team from hiding behind "report volume" or "advertiser guidelines" as a proxy for moral truth.
