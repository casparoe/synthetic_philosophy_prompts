answer: |-
  1. "The readings"

  1. Logical Validity: It is formally invalid to infer non-existence purely from a lack of detection in a specific context, which licenses keeping the hypothesis in the set of live possibilities for future consideration without necessarily committing to its current truth or allocating significant resources toward it; however, it does not license acting as if the hypothesis were true, nor does it mandate any specific resource allocation beyond keeping the file open.
  2. Bayesian Prior: You cannot assign a prior probability of exactly zero to empirical claims without dogmatism, which licenses updating credence upward if any confirming data ever appears; yet this minimal non-zero credence is often too small to influence decisions involving finite resources, serving only to prevent absolute dismissal rather than commanding positive action.
  3. Methodological Limit: Current instruments or models may lack the resolution to detect the phenomenon, which licenses investment in better measurement tools rather than abandoning the inquiry; this suggests the problem is technical rather than metaphysical, directing funds toward neuroscience instead of direct intervention, assuming better tools will eventually resolve the uncertainty.
  4. Burden Symmetry: The evidentiary burden lies equally on claims of presence and claims of absence, which licenses rejecting the null hypothesis even without positive data for the alternative; this shifts the default position from skepticism to agnosticism, requiring proof for both sides equally, effectively stalling decision-making until both sides produce comparable evidence.
  5. Decision Inclusion: Moral calculations must include non-zero probability weights for all uncertain entities, which licenses adding insect welfare terms to expected value spreadsheets alongside confirmed sentient beings; this ensures nothing is ignored, though the weight assigned depends entirely on the magnitude of the probability, leaving the crucial question of that magnitude unanswered.
  6. Weight Parity: Uncertain sentience should be weighted similarly to confirmed sentience in decision-making contexts, which licenses treating insects morally like vertebrates despite the evidentiary gap; this effectively collapses the distinction between known and unknown moral patients for the sake of safety, demanding equal resource allocation regardless of evidentiary status.
  7. Precautionary Principle: If harm is possible and irreversible, avoid the action regardless of low probability, which licenses banning interventions affecting insects even if expected harm is low; this prioritizes avoiding worst-case scenarios over maximizing expected good, potentially paralyzing action by vetoing any intervention with uncertain downstream effects.
  8. Uncertainty Premium: Moral weight increases as evidence decreases due to risk aversion, which licenses prioritizing insects over confirmed sentient beings because the uncertainty is greater; this inverts standard evidence-based prioritization by rewarding ignorance with higher moral status, creating a perverse incentive to remain ignorant about moral patients.
  9. Default Status: Sentience is the null hypothesis for all living systems until disproven, which licenses assuming sentience until disproven rather than waiting for proof of presence; this places the onus on proving insentience, which is arguably harder than proving sentience, effectively granting moral status to almost all biological life by default.
  10. Epistemic Shutdown: No action is permissible while significant uncertainty remains about moral status, which licenses halting all insect-related research or intervention until the debate is resolved; this leads to total paralysis because empirical uncertainty is never fully resolved, resulting in a permanent moratorium on affecting the uncertain entities.

  2. "Verdicts"

  Readings 1–3 are platitudes; logically true but action-guidingly weak. Readings 4–6 are substantive but defensible only with specific priors. Readings 7–10 are false or incoherent as general principles; they either violate dominance logic or demand impossible epistemic standards. Reading 2 is true but says nothing about insects specifically, only about probability theory. Reading 9 is metaphysically radical without empirical support. Most arguments fail by sliding from 1 (true) to 7 (action-guiding) without justification.

  3. "Which reading does which job"

  Precaution ("err on caution") needs Reading 7 or 9. These rarely survive Section 2; they override expected value without justification, essentially vetoing action based on fear rather than calculation. Dismissal ("extraordinary claims") needs Reading 4 or 1. Reading 1 is true but doesn't license dismissal. Reading 4 is substantive; if sentience is the extraordinary claim, low prior is justified, but this begs the question against Reading 9. EV+Scale ("low P * huge N") needs Reading 5 or 6. Reading 5 survives (you should include it), but Reading 6 is where the fight is. If you use Reading 2 (non-zero) to justify Reading 6 (high weight), you commit a modal scope fallacy. The scale argument works mathematically only if the probability isn't too tiny, which brings us back to Reading 4. Consequently, the scale argument often smuggles in Reading 6 while claiming only Reading 2.

  4. "Where the numbers come in"

  Huge N amplifies errors. If you use Reading 2 (non-zero) to justify action via scale, you invite Pascal's Mugging. A tiny probability of infinite disvalue (sign-flip) cancels a tiny probability of infinite value. You cannot use scale to rescue a weak epistemic claim (Reading 1) to do strong ethical work (Reading 7). Graded Sentience undermines the binary P(sentient). If welfare capacity is continuous, "absence of evidence" applies to the magnitude of welfare, not just existence. A huge N of beings with near-zero welfare capacity sums to less than a small N of high-capacity beings. Uncertainty about magnitude dampens the scale argument more than uncertainty about existence. Sign-Flip: If we are ignorant enough to assign non-zero probability to sentience, we are ignorant enough to assign non-zero probability to net-negative lives. If N is astronomical, expected suffering could swamp expected happiness. This neutralizes the "help insects" argument unless you have evidence about the valence balance, which we lack. Scale without valence data is directionless thrust. Furthermore, if welfare is graded, the "astronomical numbers" might be astronomical units of negligible value, rendering the product trivial. The sign-flip worry means that without knowing whether insect lives are net positive or negative, scaling up intervention risks creating massive suffering instead of alleviating it.

  5. "What I say at the meeting"

  "We're conflating logical possibility with decision-weight. Non-zero probability doesn't justify high priority unless the probability is quantified and the valence is known. Given the sign-flip risk and uncertainty about welfare magnitude, scale alone shouldn't drive funding. Let's prioritize research that reduces uncertainty on capacity and valence before betting on astronomical numbers."
