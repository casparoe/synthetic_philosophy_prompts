          *   *The Commitment:* Knowledge is *propositional* and *codifiable*. It assumes the "datafication" of the economy is possible without loss of fidelity.
          *   *Hayek's Counter:* Knowledge is often *tacit*, *contextual*, and *time-specific*. It's not just "facts" but "know-how."
          *   *Lange's Defense:* Lange argued the Central Planning Board (CPB) doesn't need to know *production functions* initially, just iterate based on surplus/shortage. But this still assumes the *feedback* (surplus/shortage) is accurately measurable and transmittable without distortion.
