          *   *Information:* Syntactic (bits) vs. Semantic (meaning). Planning assumes syntax is enough.
          *   *Rationality:* Substantive (maximizing given constraints) vs. Procedural (discovery). Planning assumes Substantive Rationality (Simon).
          *   *Value:* Consequentialist/Aggregative.
          *   *Consistency Check:* Is it internally consistent? Yes, *if* you accept the premises (knowledge is codifiable, value is aggregatable). But those premises are empirically/philosophically contested.

