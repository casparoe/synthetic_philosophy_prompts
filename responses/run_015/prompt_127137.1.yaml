answer: |-
  This is an exceptionally sharp question. You have moved past the standard "does it work?" economic critique and identified the *ontological* and *epistemological* prerequisites required for the practice of central algorithmic planning to even be conceivable.

  To treat prices as computable control variables rather than emergent signals is not just a technical choice; it is a metaphysical stance on the nature of society, knowledge, and value.

  Here is a reconstruction of the implicit theory underlying that practice, an analysis of its consistency, and a breakdown of where it diverges from both Lange's actual arguments and the Austrian critique.

  ---

  ### 1. The Epistemic Commitment: The Codifiability of Knowledge

  **The Practice:** The center collects data on resources, technology, and needs, inputs them into a matrix (input-output or general equilibrium model), and iterates prices until supply equals demand.

  **The Implicit Theory of Information:**
  This practice presupposes that economically relevant knowledge is **propositional, static, and transferable without loss.**
  *   **Syntax over Semantics:** It assumes information is syntactic (bits/data) rather than semantic (meaning/context). It assumes a factory manager's knowledge of their machine's quirks, or a consumer's knowledge of their changing local context, can be translated into a data field (e.g., "capacity: 100 units") without losing the *economic relevance* of that knowledge.
  *   **The "Given" Data Assumption:** It treats the data inputs (preferences, production functions) as *exogenous* and *fixed* at the moment of calculation.

  **The Hayekian Contradiction:**
  Hayek's argument in *"The Use of Knowledge in Society"* is not merely that the center is too slow, but that the knowledge required for economic action is **tacit, contextual, and fleeting.**
  *   **Tacit Knowledge:** Much economic knowledge is "know-how" that cannot be articulated into a report sent to a center. (e.g., "This machine vibrates when it rains, so run it slower in April.")
  *   **Knowledge Generation:** Crucially, Hayek argues that much of this knowledge *does not exist until the market process forces it into existence.* Entrepreneurs discover preferences and production possibilities *through* the act of bidding and risking capital.
  *   **The Break:** If you treat knowledge as codifiable data, you presuppose that the economy is a **allocation problem** (distributing known means to known ends) rather than a **discovery problem** (finding out what the means and ends actually are).

  **Does Lange Accept This?**
  Lange actually agreed with Hayek on this more than people admit. Lange explicitly stated the Central Planning Board (CPB) would *not* know the production functions initially. That is why he proposed **trial and error**. He didn't think the center could compute the solution *ex nihilo*; he thought the center could *simulate* the market's discovery process.
  *   **The Smuggle:** However, modern algorithmic defenders often go further than Lange. They assume that with enough Big Data/AI, the production functions *can* be predicted or modeled directly, bypassing the need for genuine trial and error. This smuggles in the assumption that human behavior and technological constraints are sufficiently deterministic to be modeled, denying the radical uncertainty Mises and Keynes emphasized.

  ### 2. The Axiological Commitment: The Aggregatability of Value

  **The Practice:** The algorithm aggregates individual "revealed preferences" (or survey data) to set shadow prices that maximize a social objective function.

  **The Implicit Theory of Value:**
  This practice presupposes that individual valuations are **commensurable and aggregatable.**
  *   **Interpersonal Comparability:** To balance a matrix for "society," the system must weigh Person A's desire for shoes against Person B's desire for bread. While neoclassical economics claims to avoid cardinal utility, any optimization algorithm effectively assigns weights.
  *   **Stability of Preference:** It assumes preferences are stable enough to be used as constraints in a calculation that may take time to solve.

  **The Misesian Contradiction:**
  Mises's radical subjectivism holds that value is **ordinal, not cardinal.**
  *   **No Social Welfare Function:** You cannot add up ordinal rankings. There is no such thing as "social utility." There are only individual utilities.
  *   **The "Revealed Preference" Trap:** Defenders claim they are just using "revealed preferences." But in a market, preference is revealed through **action involving opportunity cost and property risk.** In a planning system, "revealing" a preference (e.g., filling out a form, or buying at a shadow price) lacks the *skin in the game*.
  *   **The Smuggle:** When defenders say "we aren't imposing values," they are hiding the normative choices embedded in the **algorithm's architecture.**
      *   *Discount Rates:* Choosing a social discount rate privileges the future over the present (or vice versa). That is a moral choice, not a technical one.
      *   *Weighting:* Whose preferences count? (e.g., Do we weight by need? By past contribution? By headcount?)
      *   **Conclusion:** The practice implicitly adopts a **Utilitarian or Technocratic axiology.** It assumes there is a "social optimum" that can be mathematically defined. Mises would argue this is a category error; there is no "social optimum," only conflicting individual ends.

  ### 3. Reconstructing the Implicit Theory

  If we formalize the commitments required for this planning practice to hang together, we get the following ontology:

  | Domain | Implicit Commitment of Planning Practice | Austrian/Mises-Hayek Critique |
  | :--- | :--- | :--- |
  | **Epistemology** | **Rationalist Constructivism:** Knowledge is objective, codifiable, and can be concentrated in a center without distortion. | **Evolutionary Rationalism:** Knowledge is dispersed, tacit, and created through the process of exchange. |
  | **Information** | **Syntactic:** Information is data that can be transmitted. | **Semantic/Pragmatic:** Information is meaning embedded in action and context. |
  | **Rationality** | **Substantive:** Actors maximize known functions under constraints. | **Procedural/Entrepreneurial:** Actors discover functions and constraints through judgment under uncertainty. |
  | **Value** | **Objectivist/Aggregative:** Value can be summed into a social welfare function. | **Subjectivist/Ordinal:** Value is individual, ranked, and incomparable across persons. |
  | **Time** | **Logical Time:** Equilibrium is a solvable state. | **Real Time:** The economy is a process that never reaches equilibrium. |

  **Consistency Check:**
  Is this implicit theory internally consistent? **Yes,** *provided* you accept the premises. If knowledge *is* codifiable and value *is* aggregatable, then central calculation is not only possible but superior (no externalities, perfect coordination).
  The inconsistency arises not internally, but **externally**, against the reality of human action. It is a coherent theory of a *machine*, but an incoherent theory of a *society*.

  ### 4. Lange vs. The Modern Algorithmic Defenders

  You asked if this matches what Lange argued. **Not exactly.**

  *   **Lange's Nuance:** Lange argued for **Market Socialism**. He wanted to keep consumer sovereignty and labor mobility. He viewed the CPB as a *simulator* of the market, not a replacement for it. He admitted the CPB would make mistakes and relied on the *iterative* process to correct them. He did not claim the center could compute the answer instantly; he claimed it could converge on it faster than the "messy" real market.
  *   **The Modern Smuggle:** Modern "Cybernetic Socialism" or AI-planning advocates often drop the "trial and error" humility. They imply that with sufficient compute, the *iteration* can be minimized or done virtually. This reintroduces the Misesian calculation problem: without actual exchange of property titles, there are no *real* costs. Shadow prices in a computer are accounting fictions; they do not reflect the *scarcity* felt by an owner risking their capital.
  *   **The Hidden Normativity:** Lange was open about the political determination of distribution (income). Modern defenders often hide this behind "neutral algorithms." As you noted, the aggregation rules embed normative choices (utilitarianism, prioritarianism, etc.) that are presented as technical necessities. This is the **technocratic mask**: claiming a moral choice is a mathematical constraint.

  ### 5. What Breaks if We Take Hayek and Mises Seriously?

  If we replace the hidden commitments with Hayek's epistemology and Mises's value subjectivism, the practice doesn't just get harder; **the mechanism ceases to function as intended.**

  1.  **The Data Vanishes (Hayek):**
      *   If knowledge is tacit and contextual, the "input" data for the matrix is fundamentally incomplete. It's not just "hard to get"; it *does not exist* in a transmittable form.
      *   *Result:* The algorithm is optimizing based on a map that lacks most of the territory. It creates a "phantom equilibrium" that looks balanced on paper but results in shortages and surpluses in reality (the Gosplan problem).

  2.  **The Signal Dies (Mises):**
      *   If value is subjective and tied to property ownership, "shadow prices" without private ownership of the means of production are meaningless. A manager following a price signal isn't minimizing *cost*; they are minimizing *accounting entries*.
      *   *Result:* Without the profit/loss test grounded in private property, there is no way to distinguish between a successful allocation and a wasteful one. You can balance the matrix, but you might be efficiently producing things nobody wants or using up capital stock to do so.

  3.  **The Feedback Loop Breaks (Kirzner/Entrepreneurship):**
      *   In a market, price discrepancies signal *profit opportunities* to entrepreneurs who act to close the gap. In planning, price discrepancies signal *reporting errors* to bureaucrats who act to hide the gap.
      *   *Result:* The "iterative adjustment" becomes political bargaining rather than economic calculation. The "control variables" are tweaked to satisfy political quotas, not to clear markets.

  ### Summary

  The practice of treating prices as computable control variables presupposes a **Clockwork Universe** ontology: society is a machine with knowable parts and deterministic laws.

  *   **Epistemologically:** It denies the tacit dimension of knowledge (Polanyi/Hayek).
  *   **Axiologically:** It denies the incommensurability of individual value (Mises).
  *   **Politically:** It masks normative aggregation rules as technical constraints (Technocracy).

  Lange tried to bridge this by simulating the market, but he still assumed the *feedback* (surplus/shortage) was objective and transmittable. If you take the Austrian critique seriously, the feedback itself is distorted by the lack of property rights, and the data itself is an illusion. The practice doesn't just fail to optimize; it fails to *calculate* anything real. It solves the equations for a hypothetical economy that does not exist, while the real economy continues to operate (or disintegrate) according to the black-market prices and tacit knowledge the planners could not capture.
