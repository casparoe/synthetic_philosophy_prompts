      *   *Nuance:* The user asks about *modern* systems too. Modern AI planning might claim to predict preferences better. This leans harder into the "codifiable knowledge" trap.
      *   *Key Insight:* The crucial philosophical break is between *price as a summary statistic* (Hayek) vs. *price as a solution to an equation* (Lange). Hayek says the statistic contains *incompressible* information. Lange says the solution is *compressible*.

