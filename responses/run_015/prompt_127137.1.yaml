      *   **2. The Axiological Commitment (Value & Preferences):**
          *   *The Practice:* Aggregating preferences to set shadow prices.
          *   *The Commitment:* Preferences are stable, revealed through choices (even simulated ones), and *aggregatable*. This hints at a Social Welfare Function (SWF).
          *   *Mises's Counter:* Value is ordinal, not cardinal. You can't add up "utils." Interpersonal comparison is scientifically meaningless.
          *   *The Tension:* Defenders say "revealed preferences," but algorithms need weights. Who gets weighted more? Future vs. Present (discount rates)? This implies a *Utilitarian* or *Technocratic* normative framework, even if denied.
          *   *Conclusion on Axiology:* It smuggles in objectivism about value. It treats value as something *discovered* by the calculator rather than *created* by the actor.

