      *   *Form vs. Content:* For a 16th-century poet, form *is* meaning. The constraint generates the wit. However, the *subject matter* (love, nature, courtly interaction) is equally vital. A love poem about supply chains is a parody, not a translation.

  3.  **Evaluate Translation A (The Algorithm):**
