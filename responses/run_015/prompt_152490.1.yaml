      *(Judgment Call Explicitation):* I must state that my argument relies on assuming Marot prioritizes *sincerity of sentiment* over *technical virtuosity for its own sake*. Some poets (e.g., Oulipo precursors) might love A. I need to justify why Marot isn't one of them. (He was a court poet needing to communicate affection, not a puzzle-maker primarily).

