      *   *Leo Move 4:* Distinguishing internal capacity vs. external script is a solid defense against the guaranteed success objection. The claim about friendships being parasitic is plausible but maybe too strong (could one have genuine reciprocal interactions within the sim?). *Rating:* Mostly right.

