answer: |-
  **Project Title:** Authenticity and Enactment: Reconciling Rousseau's Critique of Theatre with his Vision of Civic Festivals

  **Research Question**
  Does Jean-Jacques Rousseau's condemnation of professional theatre and his endorsement of civic festivals rest on a coherent, albeit implicit, distinction between alienating *representation* (where an actor stands in for another for pay) and authentic *collective enactment* (where citizens perform themselves)? If so, does this distinction hold up under close textual scrutiny, or is it an anachronistic imposition of modern performance theory onto eighteenth-century moral philosophy?

  **Background and Gap in Literature**
  Rousseau's *Letter to d'Alembert on Spectacles* is traditionally read as a blanket condemnation of theatre, rooted in the fear that acting fosters *amour-propre* and fractures the authentic self. Conversely, his discussions of public festivals in the *Social Contract* and the *Letter* are often treated as a separate civic project, focused on political cohesion. Standard scholarship tends to view these as contradictory impulses: the misanthrope versus the legislator.

  This project identifies a gap in the connective tissue between these positions. While some scholars note the existence of the festival counter-point, few analyse the *structural* difference in performance that allows Rousseau to condemn one while praising the other. The project proposes that the tension is resolved through a distinction between professionalised representation (which commodifies emotion) and communal presentation (which circulates it). However, there is a significant risk that this distinction is a modern construct imported from performance studies (e.g., Schechner or Phelan) rather than derived from Rousseau's own logic. This proposal explicitly centres that risk as a primary methodological problem to be solved, rather than assuming the distinction is valid from the outset.

  **Methodology**
  The research will proceed through close textual analysis and conceptual mapping, prioritising textual fidelity over theoretical application.

  1.  **Textual Excavation:** Close reading of key passages in the *Letter to d'Alembert* (specifically the sections on the actor's soul and the Geneva republic) and the *Social Contract* (regarding public assemblies). The goal is to locate Rousseau's own vocabulary regarding presence, payment, and spectatorship.
  2.  **Conceptual Mapping:** Drafting a working definition of 'representational' vs. 'presentational' performance based *strictly* on the textual evidence gathered in phase one. If Rousseau does not support this binary, the model must be adjusted or abandoned.
  3.  **Limit-Case Testing:** A brief application of the refined framework to one contemporary example of immersive or community-led theatre. This is not a comparative study, but a stress test to see if the Rousseauian logic translates to modern contexts without breaking.

  **Timeline (Six Months Part-Time)**
  *   **Month 1:** Deep reading and annotation of primary texts (*Letter to d'Alembert*, *Social Contract*, relevant correspondence). Focus on terms related to acting, payment, and public gathering.
  *   **Month 2:** Drafting a 'negative' map: cataloguing every instance where Rousseau rejects performance. Identifying the specific criteria for rejection (e.g., is it the fiction, the payment, or the separation of actor/audience?).
  *   **Month 3:** Drafting a 'positive' map: cataloguing endorsements of festivals. Comparing criteria against Month 2 to see if a consistent distinction emerges naturally.
  *   **Month 4 (Reality Check):** Critical review. Does the distinction hold, or am I forcing it? Consultation with one specialist supervisor to challenge the anachronism risk. Refinement of the argument based on this critique.
  *   **Month 5:** Drafting the modern 'limit-case' analysis. Keeping this strictly bounded to avoid scope creep.
  *   **Month 6:** Writing and editing the final paper (target 8,000–10,000 words).

  **Scope Check and Risk Assessment**
  My primary concern, raised during preliminary discussions, is the risk of anachronism. There is a danger that 'representational' vs. 'presentational' is a modern binary that Rousseau would not recognise. To mitigate this, Month 4 is dedicated solely to attempting to falsify my own hypothesis. If the textual evidence suggests Rousseau's objection is purely moral (about lying) rather than structural (about performance modes), the project will pivot to analyse why the festival escapes the charge of 'lying' without relying on modern performance taxonomy.

  Furthermore, the application to modern theatre is a high-risk area for scope creep. Given the six-month part-time constraint and the £4,000 budget (which covers release time and resources, not extensive fieldwork), the modern component will remain a concluding reflection rather than a full case study. If the textual work in Months 1–3 proves more complex than anticipated, the modern application will be cut entirely to ensure the exegesis of Rousseau remains rigorous.

  **Success and Failure Criteria**
  *   **Success:** The project produces a coherent argument that resolves the apparent contradiction in Rousseau's work without relying on external theory. Even if the specific 'representational/presentational' binary is rejected, successfully articulating *why* it fails to map onto Rousseau constitutes a successful outcome (i.e., a negative result is still a result).
  *   **Failure:** The project fails if it becomes a general survey of Rousseau's aesthetics or a history of modern immersive theatre. It also fails if I ignore the textual evidence to preserve the initial hypothesis.
  *   **Scope Creep Warning:** Expanding the modern comparison to multiple case studies or attempting to reconcile this with Rousseau's views on music or opera would exceed the six-month limit. The focus must remain on the specific tension between the professional actor and the citizen celebrant.

  **Budget Justification**
  The £4,000 fellowship will primarily buy research time, allowing for a reduction in teaching load during the six-month period. Remaining funds will cover access to digital archives and necessary secondary literature. No travel is required, as the project is text-based. This ensures the budget aligns with the small-scale, high-focus nature of the inquiry.
