answer: |-
  In Ruth Millikan's consumer-based teleosemantic framework, the content of a mental representation or signal is determined by the conditions under which the mechanism that *consumes* that signal performs its proper function. A proper function is defined historically: it is what the mechanism was selected by evolution to do. In a standard biological organism, the producer (e.g., a sensory transducer) and the consumer (e.g., a motor control system) are parts of the same whole, selected together for the survival of that organism. The tension arises when this framework is applied to distributed or symbiotic cognitive architectures where the producer and consumer belong to distinct biological systems that cooperate closely, such as in mutualistic symbiosis or extended cognitive loops.

  The core conceptual tension lies in the interdependence of functional norms and content conditions. In Millikan's view, to specify the content of a signal produced by System A, one must specify the proper function of the consumer in System B. However, in a tightly coupled symbiotic relationship, the proper function of the consumer in System B is often defined by its responsiveness to signals from System A. If the consumer's functional norm is "to respond to Signal X," and the content of Signal X is "the condition required for the consumer to perform its function," we face a circularity. The consumer's function is defined by its success conditions, but those success conditions are defined by the content of the signal, which is itself defined by the consumer's function.

  This circularity is not merely an epistemic problem regarding our ability to trace evolutionary histories. It is a constitutive problem concerning the grounding of normative content. Teleosemantics aims to naturalize normativity—to explain how a state can be "incorrect" using only non-normative historical facts. If the historical selection of the consumer depends on the success of the semantic relationship (i.e., the consumer was selected because it correctly interpreted the producer), then the history presupposes the very normative relation it is supposed to ground. If the success condition is semantic in nature, using it to ground semantics is circular. The normativity fails to emerge from non-normative history because the history is described in terms that already require the normative distinction between correct and incorrect interpretation.

  To navigate this, one must distinguish between producer-based and consumer-based misrepresentation. Producer-based misrepresentation occurs when the producer generates a signal indicating a state of affairs that does not obtain; the signal is false relative to the condition required for the consumer's success. Consumer-based misrepresentation (or more precisely, consumer functional failure) occurs when the signal is accurate, but the consumer mechanism fails to execute the response dictated by its proper function. In the distributed context, the tension is exacerbated because consumer-based failure threatens the stability of the content attribution itself. If the consumer's function cannot be individuated independently of the producer's output, then a consumer failure looks like a change in content rather than a violation of a norm. Without an independent anchor for the consumer's function, there is no fact of the matter about whether the consumer failed or whether the content of the signal changed to match the new behavior.

  Appealing to evolutionary selection history at the level of the symbiotic unit attempts to resolve this by treating the producer-consumer pair as a single selected entity. This provides a unified fitness currency: the pair survives because the communication works. However, this move largely relocates the problem rather than solving it. While it stabilizes the historical boundary (the unit is selected, not just the parts), it does not dissolve the internal conceptual interdependence. The proper function of the consumer within the unit is still defined by its role in the unit's survival, which depends on interpreting the producer. If the description of the unit's survival conditions inevitably references the successful transmission of content (e.g., "the unit survives when B correctly interprets A's signal"), the circularity persists within the definition of the unit's fitness. The selection unit problem is solved biologically, but the constitutive problem of grounding the normativity of the consumer's function without presupposing the content remains. The unresolved issue is whether the consumer's functional norms can be specified in purely non-semantic terms (e.g., metabolic or mechanical outcomes) that are independent of the producer's signal, or if the symbiotic integration is so deep that the distinction between signal and response collapses, dissolving the representational relationship entirely.

