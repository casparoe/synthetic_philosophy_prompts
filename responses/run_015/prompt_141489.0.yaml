answer: |-
  Here is a committed design for your session. I have made definite choices on timing, stakes, and wording. I have also corrected two areas of your sketch where the philosophy would otherwise collapse under the logistics.

  ### 1. Design Decisions & Corrections

  **The Cold Choice Timing**
  Do **not** compress the week into fifty-five minutes. If both choices are abstract promises within the same hour, students will treat both as math problems. You need the "Cold" choice to be distant and abstract, and the "Hot" choice to be visceral and immediate.
  *   **Decision:** The Cold Choice must be taken at the end of the **previous meeting** (last week).
  *   **Reasoning:** Hyperbolic discounting relies on the curvature of time. A 20-minute delay within a session feels like "now" to a teenager. A one-week delay feels like "the future".
  *   **Keeping it Genuine:** Collect the slips in sealed envelopes last week. Do not open them. Bring the sealed box into today's session. The physical presence of the sealed envelope represents their past commitment.

  **The Stakes (Allergy & Budget Proof)**
  You mentioned chocolate, but given the nut allergy and sugar avoidance, food introduces liability and exclusion anxiety which kills philosophical risk-taking.
  *   **Decision:** Use **Time** vs. **Status**.
  *   **Option S (Small/Soon):** A printed "Early Release Pass" valid for today. They leave the session 10 minutes before the bell (gaining 10 minutes of free lunch).
  *   **Option L (Large/Later):** 5 House Points (recorded in your logbook next week).
  *   **Reasoning:** Both cost you nothing. Both are high-value to Sixth Formers. Neither triggers allergies. The "Early Release Pass" should be a distinct, nice-looking card you prepare beforehand to make it physically tempting.

  **The Commitment Device**
  You suspect nobody will take it. This is correct, and useful. But the cost must be clear.
  *   **Decision:** To commit, they sacrifice 1 House Point (receiving 4 instead of 5) to lock themselves into Option L.
  *   **Reasoning:** If commitment were free, rational agents would always take it to protect against weakness. By attaching a cost, you test whether they value *self-binding* more than the cost itself.

  ### 2. Minute-by-Minute Timeline (55 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00–05** | **Introduction & The Box.** Place the sealed box of envelopes from last week on the table. Explain the stakes clearly. | Do not open the box yet. |
  | **05–10** | **The Reveal.** Hand back everyone their sealed envelope from last week. They open it to see their Cold Choice. | Do not let them change it. This is data. |
  | **10–15** | **Prediction Slip.** Students complete the *Prediction Slip* (see below). Collect immediately. | Crucial for the "hunch" test. |
  | **15–20** | **Commitment Window.** Offer the Commitment Device. Explain the cost (1 point). | Pass around a specific "Lock Box". |
  | **20–25** | **The Temptation.** Place the stack of "Early Release Passes" visibly on the table. | Make them physical and tangible. |
  | **25–35** | **The Hot Choice.** Students complete the *Hot Choice Slip*. | Includes the Endorsement Probe. |
  | **35–45** | **The Letter Exchange.** Write note from Past Self → Present Self, and reply. | Quiet writing time. |
  | **45–55** | **Debrief & Tally.** Reveal data on board. Discuss the gap. | No jargon until the end. |

  ### 3. The Slips (Exact Wording)

  Print these on distinct coloured paper.

  **Slip 1: The Prediction (Pink)**
  *Complete this before seeing the Early Release Passes.*
  1.  **Own Prediction:** When you make your final choice today, will you pick the **House Points** or the **Early Release**?
      [ ] House Points  [ ] Early Release
  2.  **Class Prediction:** What percentage of this room (0–100%) do you think will switch away from what they wrote in last week's envelope?
      My guess: ______ %

  **Slip 2: The Commitment (Blue)**
  *Optional. Only hand this in if you want to bind yourself.*
  "I hereby lock myself into choosing **House Points**. I understand that if I hand this slip in, I cannot choose Early Release later, and my reward will be reduced to **4 House Points** instead of 5."
  [ ] I wish to commit. (Sign Initials)

  **Slip 3: The Hot Choice & Endorsement (White)**
  *This is your final decision.*
  1.  **My Choice:** Which reward do you actually take?
      [ ] Early Release (10 mins free)
      [ ] House Points (5 points)
  2.  **My Judgement:** At this exact moment, which option do you believe is **better** for you?
      [ ] Early Release is better.
      [ ] House Points are better.
  3.  **Consistency Check:** Did you change your mind since last week's envelope?
      [ ] Yes  [ ] No

  **Slip 4: The Letter Exchange (Green)**
  *Fold this paper in half.*
  *   **Left Side (From Past Self):** Write a short note from the person who filled in the envelope last week to the person sitting here now. Persuade them to stick to the plan.
  *   **Right Side (From Present Self):** Write a reply. Explain why you did (or did not) listen.

  ### 4. Payoff Scheme & Tallying

  **Costs:**
  *   **House Points:** Record these in your logbook after the session. Deduct 1 point for anyone who used the Commitment Device.
  *   **Early Release:** Hand out the passes to those who chose them. They leave at minute 45 (if school rules allow) or simply pack away 10 minutes early.
  *   **Budget:** £0.00.

  **Anonymous Tallying (On the Board):**
  Draw a 2x2 grid on the board. Do not ask students to raise hands. Ask them to shout out counts based on their *White Slips*.
  *   **Row 1:** Chose Points.
  *   **Row 2:** Chose Release.
  *   **Col A:** Judged Points Better.
  *   **Col B:** Judged Release Better.

  *Example Board:*
  | | Judged Points Better | Judged Release Better |
  | :--- | :---: | :---: |
  | **Chose Points** | 8 (Consistent) | 1 (Strange) |
  | **Chose Release** | 4 (**Akrasia**) | 2 (Reversal) |

  *   **The "Akrasia" Cell:** Those who Chose Release but Judged Points Better. This is your core group for discussion.
  *   **The "Reversal" Cell:** Those who Chose Release and Judged Release Better. They changed their mind.

  **Displaying Predictions:**
  Calculate the actual reversal rate from the envelopes vs. White Slips. Write this number large on the board. Next to it, write the **Average Class Prediction** from the Pink Slips.
  *   *Effect:* Usually, the class predicts higher willpower than is shown. This highlights the "bias blind spot".

  ### 5. The Debrief (Scripted Flow)

  Do not use the words "akrasia", "hyperbolic discounting", or "preference reversal" until the final 5 minutes.

  **Phase 1: The Descriptive Question (What happened?)**
  *   "Look at the grid. We have four people in the top-right box: You chose the Early Release, but you ticked that House Points were *better*. How is that possible?"
  *   "Did your preferences change, or did you act against them?"
  *   *Goal:* Get them to distinguish between "I wanted the points but took the time" vs "I decided the time was actually better."

  **Phase 2: The Normative Question (Is it irrational?)**
  *   "If I know smoking is bad for me but I smoke, am I irrational? Or do I just value the pleasure more in that moment?"
  *   "Look at the Commitment Device. Almost nobody paid the 1 point to lock themselves in. Why? If you knew you might fold, why not pay for protection?"
  *   *Goal:* Challenge whether acting against your own judgement is always irrational, or if 'judgement' is just another desire.

  **Phase 3: The Authority Question (Who is in charge?)**
  *   "Read your Green Slips. Does your Past Self have authority over your Present Self? Why should you listen to a version of you that didn't have the Early Release passes sitting on the table?"
  *   *Goal:* Discuss personal identity over time.

  **Phase 4: The Naming (Last 5 Minutes)**
  *   Now introduce the terms.
  *   "Philosophers call the top-right box **Akrasia** (Weakness of Will)."
  *   "Economists call the shift in value **Hyperbolic Discounting**."
  *   "The fact that you didn't buy the Commitment Device suggests you suffer from **Projection Bias** (thinking future you will be like present you)."

  ### 6. Predictable Failures & Fixes

  **1. The "Formality" Failure**
  *   *Risk:* Students treat last week's envelope as a joke and don't care about changing their mind.
  *   *Fix:* At the start of today's session, say: "The integrity of this experiment depends on the envelope representing a real promise. If you treat your past self as a stranger, the data is useless." Shame works well in Sixth Form.

  **2. The "Hot" State isn't Hot Enough**
  *   *Risk:* 10 minutes of break isn't tempting enough compared to House Points.
  *   *Fix:* Make the Early Release Passes look premium. Gold card stock. Put them in a stack. Physically push the stack towards them during the Hot Choice phase. Visual proximity matters.

  **3. The Commitment Device Confusion**
  *   *Risk:* Students think committing guarantees 5 points *plus* safety.
  *   *Fix:* When explaining the Blue Slip, say explicitly: "Commitment costs you 1 point. You are paying for self-control." Repeat this twice.

  **4. Social Desirability Bias**
  *   *Risk:* Students tick "House Points are better" even if they choose Release, because they feel they *should*.
  *   *Fix:* Emphasise anonymity. "I will not look at your names. I am aggregating numbers. Be honest about what you *actually* feel, not what sounds good."

  **5. Lost Envelopes**
  *   *Risk:* Students lost last week's slip.
  *   *Fix:* Have a spare "Cold Choice" slip ready for them to fill in at Minute 0, but mark it as "Late Cold Choice" so you can exclude it from the reversal data if necessary.

  ### 7. Limitations (What This Cannot Do)

  You must state this yourself in the debrief.

  1.  **Stakes are Low:** This is a game. Real weakness of will involves addiction, finance, or relationships. The emotional weight here is simulated. Students may act recklessly because House Points don't actually matter compared to real life consequences.
  2.  **No Physiological Heat:** Real temptation often involves physiological arousal (craving, stress). This session is cognitive. You are testing *judgement*, not *impulse control* in the visceral sense.
  3.  **The "Observer" Effect:** By making them analyse their choice while making it, you may force rationality that wouldn't exist otherwise. You are measuring *reflective* choice, not pure instinct.

  ### 8. Confidence Levels

  *   **High Confidence:** The distinction between "Choice" and "Judgement" (The Endorsement Probe) will work. Students understand this distinction intuitively.
  *   **High Confidence:** The Prediction Hunch will hold. Students consistently overestimate their own willpower compared to peers.
  *   **Educated Guess:** The Commitment Device uptake. I predict 0–1 students will take it. If more take it, it suggests your House Points are valued very highly, or the Early Release is not valued enough.
  *   **Educated Guess:** The Letter Exchange. This may feel cheesy to 17-year-olds. If they resist, tell them to write it cynically. "Dear Present Self, Don't be lazy." works just as well as poetry.

  ### Final Advice for the Leader

  You are running this as a peer, but you must act as the facilitator. Do not participate in the choices yourself, or your data is contaminated. Stand back during the Hot Choice. Let the silence sit. The tension they feel when looking at the Early Release Passes is the phenomenon you are teaching. Do not talk them out of it.

  Good luck. This design is tight, safe, and philosophically sound.
