answer: |-
  OK, first off, you're right to sense that the "retroactivity" debate is mostly a zombie at this point. If you spend three years arguing about *nullum crimen sine lege* in 1945, you're fighting a battle that the Rome Statute (1998) already technically settled for future cases. The law is codified now. The *real* legitimacy crisis isn't "was this law written down before?" it's "why are *you* the one enforcing it?"

  Here's a defended agenda for three years of work, assuming you want to actually shift how Universal Jurisdiction (UJ) is theorized and deployed, not just write history.

  ### The Criteria
  I'm filtering this through three constraints:
  1.  **Downstream Leverage:** Does resolving this change how a judge in Germany or Senegal thinks about arresting a foreign official today?
  2.  **Tractability:** Can a philosopher/activist actually move the needle, or does this require state power? (We're avoiding the latter).
  3.  **Dependency:** Is this a foundational assumption that other arguments rest on?

  ### Settled vs. Contested (The Map)
  Let's clear the deck so you don't waste time on fake debates.

  **Settled (among serious scholars):**
  *   **One-sidedness:** Both Nuremberg and Tokyo were victors' justice. There is no serious "whataboutism" defense that holds water legally, even if politically necessary at the time.
  *   **Canonical Asymmetry:** Nuremberg is the foundation of modern ICL; Tokyo is the footnote. This isn't an accident; it's because the US managed the Tokyo narrative differently post-occupation.
  *   **Retroactivity:** Yes, *ex post facto* law was used. Yes, it was justified by appealing to "customary law" that was arguably too vague. This is historical fact, not a live legal threat to the ICC (which has strict legality provisions).

  **Contested (The Live Wires):**
  *   **The Source of Authority:** Does UJ derive from a "universal moral community" (Nuremberg logic) or is it an exception to sovereignty that requires specific treaty consent? This is still fought over in national courts.
  *   **Selectivity as a Defense:** Can "victors' justice" / selective enforcement be a *legal* defense to dismiss a case, or merely a *political* critique? (Spoiler: Courts almost always say political, but the legitimacy rot remains).
  *   **Pal's Legacy:** Was Radhabinod Pal a moral hero of the Global South or an apologist for Japanese imperialism? This is still heated. Most Western scholars sideline him; many Post-colonial scholars venerate him.

  ---

  ### The Agenda: Three Pillars

  If I had three years, I wouldn't write a history of the tribunals. I'd work on the **Political Philosophy of Enforcement.** Here's the stack:

  #### 1. Shift from *Nullum Crimen* to *Nullum Judicium Sine Lege*
  **The Problem:** Everyone is obsessed with *Nullum Crimen* (no crime without law). That's dead. The new problem is *Nullum Judicium* (no judgment without legitimate authority).
  **The Work:** Argue that the Nuremberg precedent isn't about *what* crimes are universal, but *who* gets to judge them. The Nuremberg/Tokyo asymmetry proves that without neutral enforcement, "universal" law is just hegemony.
  **Why this leverages UJ:** When a European court tries an African warlord (or vice versa), the defense isn't "it wasn't a crime." The defense is "you are a neocolonial actor." You need to build a theoretical framework that acknowledges this without paralyzing justice.
  **Tractability:** High. This is philosophical/normative work. You can publish papers, op-eds, and briefs that reframe the debate from "legality" to "legitimacy."

  #### 2. Instrumentalize Pal (Don't Canonize Him)
  **The Problem:** People treat Justice Pal's dissent as either holy scripture or fascist trash. Both are useless.
  **The Work:** Extract the *structural* argument from Pal's dissent and discard the *factual* denials. Pal's core point wasn't that atrocities didn't happen (he acknowledged them); it was that the tribunal lacked jurisdiction because the victors committed similar acts and weren't tried.
  **The Application:** Use this to demand **Procedural Parity** in modern UJ cases. If you want to prosecute aggression, you must have a mechanism to prosecute *all* aggressors, or admit you are doing political justice.
  **Why this changes the dependency graph:** Currently, UJ advocates say "Justice delayed is justice denied." You'd argue "Selective justice is legitimacy denied." This forces institutions (like the ICC or national courts using UJ) to either expand their scope or admit their limits.
  **Trade-off:** You will be accused of being soft on atrocities. You have to be explicit that this is about *procedure*, not *innocence*.

  #### 3. The "Political Question" Doctrine in ICL
  **The Problem:** Courts claim they are apolitical. Nuremberg proved they aren't. Modern UJ cases get dropped because of "diplomatic immunity" or "national interest" (e.g., UK courts on Israel, US courts on everyone).
  **The Work:** Develop a standard for **Transparent Selectivity.** If a court *must* be selective due to power constraints, it should explicitly state the political constraints rather than hiding behind legal technicalities.
  **Leverage:** This hits the "limited influence" constraint. You can't force the US to prosecute its own. But you can shame courts into admitting *why* they aren't prosecuting. It changes the discourse from "we can't find jurisdiction" to "we are choosing not to exercise it."
  **Downstream:** This empowers activists. If a court admits a case is dropped for political reasons, that's a mobilizing point. If they say "no legal basis," it's a dead end.

  ---

  ### What to Deprioritize (The "Do Not Touch" List)

  **1. Re-litigating the London Charter's Drafting**
  *   **Why:** It's done. Legal historians have picked this clean. Knowing exactly what Jackson said in 1945 doesn't change whether a Spanish judge arrests a Chilean general today.
  *   **Cost:** High effort, zero downstream impact.

  **2. Trying to "Fix" Retroactivity**
  *   **Why:** The Rome Statute fixed this for the ICC. For UJ, customary international law is the standard, and it's flexible enough that *nullum crimen* rarely sticks as a defense anymore.
  *   **Cost:** You'll look like you're fighting the last war.

  **3. Biographical Rehabilitation of Pal**
  *   **Why:** Whether Pal was a nice guy or a nationalist ideologue matters less than what his *argument* does. Don't write a biography; write a theory of jurisdiction using his dissent as a case study.
  *   **Cost:** Gets you bogged down in historical minutiae about Japanese imperialism rather than current legal practice.

  ### The Trade-Offs (Be Honest)

  *   **Risk of Paralysis:** If you push the "Selective Enforcement" argument too hard, the counter-argument is "So we should prosecute no one until we can prosecute everyone?" That leads to impunity. You need a "least bad option" theory ready. *My suggestion:* Argue for **Jurisdictional Humility**. Courts should prosecute, but with explicit caveats about the limits of their reach.
  *   **Alienating Liberals:** Mainstream human rights orgs hate the "Victors' Justice" critique because it undermines their moral clarity. You will lose some allies in the NGO space.
  *   **Gaining Global South Cred:** You will gain traction in post-colonial legal circles and among states skeptical of the ICC (which is a lot of them). This increases your leverage if your goal is structural reform, but decreases it if your goal is immediate convictions.

  ### Summary
  The core problem isn't 1945's retroactive laws; it's 2024's selective enforcement. Nuremberg isn't a legal precedent for *statutes*; it's a political precedent for *power*.

  If you want to shape Universal Jurisdiction, stop arguing about whether the crimes were defined correctly. Start arguing about **who holds the gavel and why.** Recover Pal not as a historian, but as a theorist of structural bias. That's the upstream work that actually changes the water downstream.
