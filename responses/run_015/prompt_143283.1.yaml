prompt: |-
  ok so i've been reading about nuremberg and tokyo — the victors-justice critique, the retroactive law problem (nullum crimen sine lege), and how nuremberg became this canonical moment for individual responsibility under international law while tokyo's dissenting opinions (especially Pal's) kinda got sidelined. there's also the obvious structural thing: both tribunals only tried one side, yet nuremberg is constantly cited as preceedent for modern international courts.

  i want to know what actually deserves effort here, assuming you've got maybe three years and some limited influence — say you're a legal philosopher or an activist trying to shape how universal jurisdiction is talked about. which open questions or lines of work are upstream? is the core problem still justifying the retroactive criminalization without circular reasoning, or is it the selective-enforcement legacy that's now baked into how international criminal law operates? and does recovering the tokyo dissent change the dependency graph, or is that mostly historical housekeeping?

  give me a defended agenda, not a survey. lay out the criteria you're using — tractability, leverage for current practice, how many other debates depend on resolving this — and be explicit about trade-offs. also please seperate what's genuinely settled (like the one-sided nature of both tribunals) from what's still fought-over among people who know the field. don't present a contested view as consensus. and tell me what you'd flat-out deprioritize because even if solved it wouldn't shift much downstream.

  keep it casual — there's probably a typo or two in this prompt itself.
