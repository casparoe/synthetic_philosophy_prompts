  Standard practice in game theory — in the textbooks I assign and in my own graduate teaching — is to solve games by iteratively deleting strategies that are strictly dominated, where "dominated" includes being worse than a mixture of the remaining strategies, and to explain the procedure to students as nothing more than the requirement that a rational player never knowingly plays a dominated strategy. That explanation has always struck me as thinner than the procedure it is supposed to license, and I want you to reconstruct what the practice actually presupposes. Does it need only the players' rationality, or common knowledge of that rationality, and does it locate rationality in what a player does or in what she believes? Does admitting dominance by mixtures commit the practice to reading a mixed strategy as a deliberate act of randomization rather than as a representation of one player's uncertainty about another, and can it consistently hold both readings at once, given that the mixture doing the dominating ranges over the dominated player's own actions and so cannot express her uncertainty about anyone else? And since comparing a pure strategy against a lottery over outcomes requires more than an ordinal ranking of those outcomes, does the procedure presuppose cardinal, expected-utility-measurable payoffs, and what does that commit it to about the comparability of goods? Reconstruct the implicit theory, separate what the practice strictly requires from what it merely fits comfortably with, say where its parts pull in different directions, and tell me what would have to change in how the procedure is stated and applied if we gave up whichever presupposition turns out to be load-bearing. No citations or reading lists, please; I want the argument, not the literature.

  Please structure the response in the following named sections, in this order: "The practice, restated" (100–150 words), so I can check that we are talking about the same thing; "What it strictly presupposes" (500–600 words), organized by the presuppositions about rationality, about mixed strategies, and about value; "What it merely fits" (250–350 words), on the rival views the practice is equally compatible with; "Where it pulls apart" (350–450 words), on whether the presuppositions are jointly coherent; "The implicit theory" (200–250 words), stating it plainly and giving your verdict on it; and "If the load-bearing presupposition goes" (300–400 words), on what would have to change in the procedure and in how it is taught.
