  In teaching, this requires a shift from presenting the procedure as a universal rationality requirement to a specific constraint applicable only when risk attitudes are linear or known. Instructors would need to distinguish sharply between ordinal preferences (ranking outcomes) and cardinal utilities (ranking lotteries). The justification would change from "rational players never play dominated strategies" to "rational players with linear risk preferences never play strategies dominated by lotteries." Furthermore, without cardinal utility, the link to Nash Equilibrium becomes tenuous, as mixed-strategy equilibria also rely on indifference conditions defined by cardinal values. The procedure would no longer be a prelude to equilibrium analysis but a standalone consistency check for ordinal games. We would have to admit that rationality alone, without specific risk structures, does not license the elimination of strategies dominated by mixtures. This exposes the procedure not as a logical necessity of rationality per se, but as a consequence of rationality conjoined with specific structural assumptions about value and risk. Additionally, the application of the procedure in economic modeling would require explicit justification of risk neutrality. Currently, textbooks often assume payoffs are money and agents are risk-neutral without stating it. Removing the cardinal presupposition forces this assumption into the open. Models would need to specify utility functions explicitly rather than using payoff matrices as proxies. In the classroom, this means spending more time on decision theory before game theory. Students must understand why $0.5u(A) + 0.5u(B)$ is meaningful before they can understand why strategy C is dominated. The procedure becomes less of a mechanical algorithm and more of a theoretical claim about preference structures. This slows down the curriculum but increases theoretical honesty. It also limits the scope of solvable games, forcing reliance on equi