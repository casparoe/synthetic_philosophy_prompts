  The practice, restated

  The procedure involves iteratively removing strategies that are strictly dominated. A strategy is dominated if there exists another strategy, or a probability mixture of other strategies, that yields a higher payoff regardless of opponents' choices. This elimination proceeds in rounds: once a strategy is deleted, it is removed from consideration for subsequent rounds of domination checking. The standard pedagogical justification is that a rational agent maximizes expected utility and therefore never chooses an option known to be inferior to another available option. The process halts when no further strategies can be eliminated, leaving a reduced game form. This is presented not as a solution concept predicting equilibrium, but as a minimal consistency requirement for rational play derived from the structure of preferences and beliefs alone.

  What it strictly presupposes

  The procedure strictly presupposes three distinct theoretical commitments regarding rationality, mixed strategies, and value. First, regarding rationality, it requires Common Knowledge of Rationality (CKR). The initial round of deletion requires only that each player is instrumentally rational, locating rationality in the choice of actions that maximize expected utility given beliefs. However, subsequent iterations require that players know others are rational, know that others know this, and so on ad infinitum. Without CKR, a player cannot justify eliminating a strategy based on the elimination of an opponent's strategy, as they cannot be certain the opponent will not play it. Thus, rationality is located not merely in individual action but in the epistemic state regarding others' actions. The procedure treats rationality as a public fact rather than a private disposition. If rationality were merely private, iteration would halt after the first round. Therefore, the practice presupposes an epistemic environment where mental states regarding optimization are transparent and mutually recognized. It assumes players are logical omniscients regarding the implications of rationality. Crucially, it locates rationality in the alignment of belief and action: a player is rational only if their beliefs about others' rationality justify their actions. It implies that rationality is not just a property of the agent in isolation, but a property of the system of agents.

  Second, regarding mixed strategies, admitting dominance by mixtures presupposes that mixtures are evaluable objects comparable to pure strategies. If a mixed strategy dominates a pure one, the mixture must represent a convex combination of outcomes available to the agent. This cannot be interpreted merely as uncertainty about opponents, because the mixture ranges over the dominated player's own actions. A player cannot be uncertain about their own choice in a way that licenses deleting that choice. Therefore, the practice presupposes that mixed strategies are either deliberate acts of randomization or that preferences satisfy convexity allowing the evaluation of lotteries over own-actions. It commits the theory to viewing the mixture as a viable benchmark for choice, not just a belief state. If mixed strategies were solely representations of uncertainty, the dominance relation would collapse, as one cannot compare a certain action to a belief about another. The procedure thus requires an ontological commitment to the mixture as an actionable or evaluative entity distinct from epistemic uncertainty. It forces a reading of mixed strategies as objective probabilities available to the agent, not subjective degrees of belief about others.

  Third, regarding value, the procedure strictly presupposes cardinal, von Neumann-Morgenstern measurable payoffs. Comparing a pure strategy against a lottery requires calculating expected utilities. Ordinal utility is insufficient because expected utility is not invariant under non-linear monotonic transformations. If payoffs are merely ordinal, a strategy dominated by a mixture under one representation might dominate it under another. Therefore, the procedure requires the Independence Axiom and risk attitudes encoded in the payoff structure. It commits the practice to the view that goods are comparable across states of the world via a linear metric, not just ranked within states. The numbers in the matrix must represent utility intervals, not just orderings. Without this, the arithmetic of dominance is undefined. It also presupposes that these utilities are stable across the iteration process, unaffected by the elimination of strategies themselves. This implies that the value of an outcome is intrinsic to the outcome and opponent move, not dependent on the availability of other strategies. Furthermore, it commits the theory to the comparability of goods across different opponent actions. To say a mixture dominates regardless of opponent choice implies a common scale of value that persists across different columns of the matrix. The utility of a payoff must be commensurable whether the opponent plays left or right. This rules out context-dependent preferences where the value of a good changes based on the available menu or the opponent's specific move beyond the outcome itself. The procedure assumes a stable, cardinal metric of value that transcends the specific strategic context.

  What it merely fits

  The practice fits comfortably with several interpretations that are not strictly necessary. For instance, one might interpret mixed strategies epistemically, as representing opponents' uncertainty about a player's move. This view fits the mathematics of equilibrium analysis but clashes with the logic of dominance by mixtures, as noted above. However, since the final reduced game often supports equilibrium analysis, the procedure fits this epistemic view downstream, even if the deletion mechanism itself requires a different ontology. Similarly, the practice fits with an ordinalist view of utility if one restricts deletion to pure-strategy dominance only. Many textbooks slide between these, using the same procedure to justify both. The procedure also fits with the view that rationality is purely about consistency rather than maximization. One could argue that deleting dominated strategies is merely coherence, not optimization. Finally, it fits with the notion that payoffs are objective material gains rather than subjective utilities, provided agents are risk-neutral. If agents are risk-neutral, ordinal rankings of money approximate cardinal utility. The procedure works smoothly here, masking the deeper requirement for cardinality. These fits allow instructors to teach the procedure without explicitly defending vNM utility or CKR, creating a pedagogical smoothness that obscures the theoretical friction. Additionally, the procedure fits with the concept of Nash Equilibrium as a final destination. While IDSDS is distinct from Nash, the surviving strategies often form the support of an equilibrium. This allows the procedure to be taught as a simplifying step toward equilibrium, fitting comfortably with the broader curriculum even if the logical foundations differ. It also fits with a heuristic view of rationality, where players use deletion as a rule of thumb rather than a logical necessity. This descriptive fit allows the theory to be applied to bounded agents, even if the normative justification requires omniscience.

  Where it pulls apart

  The tensions arise primarily between the epistemic requirements of iteration and the ontological status of mixtures. First, there is a conflict between the epistemic demand of CKR and the structural demand of mixture dominance. CKR assumes players model each other as rational reasoners. Mixture dominance assumes players evaluate lotteries over their own actions. If a mixture is a deliberate randomization, why would a rational agent randomize unless indifferent? If they are indifferent, the strict dominance claim fails. If the mixture is not a deliberate act but a theoretical benchmark, then the claim that a rational player "never knowingly plays" a dominated strategy becomes metaphorical; they aren't choosing the mixture, they are being compared to it.
  Second, there is a tension between cardinal utility and the ordinal intuition often taught. Students are told rationality is about ordering preferences. Yet mixture dominance requires measuring the *distance* between preferences to weigh probabilities. This pulls the theory away from simple preference orderings toward risk attitudes. A risk-averse player might not find a mixture dominating a safe pure strategy even if a risk-neutral calculation says so. The procedure assumes the payoffs *are* the utilities, bypassing the transformation from outcomes to utilities.
  Third, the iteration presupposes logical omniscience. To know that others know that you are rational requires infinite recursive depth. This pulls against the practical application of the theory in real-world scenarios where cognitive limits exist. The procedure treats logical deduction as costless, whereas the rationality it presupposes is often meant to apply to bounded agents. These tensions suggest the procedure is a hybrid: it uses epistemic logic for iteration but decision-theoretic structure for dominance, without fully reconciling the source of the probabilities in the mixtures with the source of the beliefs about others. Furthermore, there is a tension regarding the location of rationality. The procedure locates rationality in action (not playing dominated strategies) but licenses this via belief (knowing others won't play dominated strategies). If beliefs are wrong, the action is irrational, yet the procedure assumes the beliefs are justified by common knowledge. This creates a circularity where rationality justifies the belief that justifies the action. Additionally, the comparability of goods across opponent moves assumes a stability of value that may not hold psychologically. The value of a payoff might depend on the context of the game, which changes as strategies are deleted. The procedure assumes value is context-independent, which pulls against behavioral evidence of framing effects. These fractures indicate that the procedure is a composite of distinct theoretical modules that do not seamlessly integrate.

  The implicit theory

  The implicit theory is one of Idealized Rational Agency operating under Common Knowledge within a Cardinal Utility framework. It posits agents who are not only maximizers but also logical omniscients regarding each other's maximizing nature. It locates rationality in the consistency of choices with probabilistic beliefs, where those beliefs adhere to the axioms of expected utility. The theory treats strategies as actionable lotteries and preferences as measurable quantities invariant to linear transformation. My verdict is that the theory is internally coherent but empirically fragile. It succeeds as a normative benchmark for logical consistency but fails as a descriptive model of reasoning without significant caveats. The coherence relies on conflating the theoretical device of mixture dominance with the psychological reality of choice. It works mathematically because the axioms of expected utility enforce the convexity required for mixture dominance, and the axioms of epistemic logic enforce the recursion required for iteration. However, it demands a level of cognitive transparency and preference measurability that rarely exists outside controlled environments. It is a theory of ideal minds, not necessarily human players.

