answer: |-
  Here is the complete design for the session. It is engineered to run in 90 minutes with 17 students, requiring only printed paper, pens, and plastic counters (or coins).

  # One: The Artefact

  ### 1. The Board and Tiles
  *   **Grid:** 6x6 squares (36 positions).
  *   **Tiles:** 36 square cards per colony (72 total).
  *   **Markings:** Each tile has four colored edges: **Top=Red, Right=Blue, Bottom=Green, Left=Yellow.** The center of the tile is white. All tiles are identical.
  *   **Orientation:** Tiles are placed on the grid. "Up" is defined by the table edge.
  *   **Ant Position:** 6 Ants per colony. Ant 1 sits at Row 1, Ant 2 at Row 2, etc. They face the table.
  *   **Constraint:** An Ant may only touch tiles in their assigned Row. They may look at their Row and the Row immediately adjacent (to check edges).

  ### 2. The Rule Cards (Print one per Ant)
  *Note: All Ants in Colony A get the same rule. All Ants in Colony B get the same rule. This ensures parallel processing.*

  **Round 1 Rule (The Converger):**
  > "Look at the tile immediately to your **Left** (in your Row). Ignore the tile at the far left edge.
  > Compare the **Right Edge** of that Left Neighbor to your tile's **Left Edge**.
  > If the colors **DO NOT MATCH**, rotate your tile 90 degrees **Clockwise**.
  > If they **MATCH**, do nothing.
  > Wait 5 seconds, then check again.
  > Stop when the Reader says 'Time'."

  **Round 2 Rule (The Diverger):**
  > "Look at the tile immediately to your **Left**.
  > Compare the **Right Edge** of that Left Neighbor to your tile's **Left Edge**.
  > If the colors **MATCH**, rotate your tile 90 degrees **Clockwise**.
  > If they **DO NOT MATCH**, do nothing.
  > Wait 5 seconds, then check again."

  ### 3. The Reader's Vocabulary (Print one per Reader)
  *The Reader stands away from the table until Time is called. They approach, look at the final board, and consult this key.*

  **Key A (Used in Rounds 1 & 2):**
  > "Scan the **Top Edge** of all tiles in Row 1.
  > If all 6 are **RED**: The Colony says **'YES'**.
  > If all 6 are **BLUE**: The Colony says **'NO'**.
  > If mixed: The Colony says **'ERROR'**.
  > (Note: Due to the rules, if Row 1 is uniform, all rows will be uniform)."

  **Key B (Used in Round 4):**
  > "Scan the **Top Edge** of all tiles in Row 1.
  > If all 6 are **RED**: The Colony says **'DANGER'**.
  > If all 6 are **BLUE**: The Colony says **'SAFETY'**.
  > If mixed: The Colony says **'UNCERTAIN'**."

  ### 4. Scoring and Wagering
  *   Each Ant starts with 3 plastic counters.
  *   Before the Reader looks, each Ant privately places a wager (0-3 counters) on whether the Reader will say "YES/NO" (Success) or "ERROR" (Failure).
  *   If the Reader succeeds, Ants who wagered on Success double their wager. If the Reader fails, Ants who wagered on Failure double.
  *   *Purpose:* Creates skin in the game without grade stakes.

  ### 5. Trace of One Round (Verification)
  *   **Initial State:** All tiles placed randomly.
  *   **Ant 1 (Row 1), Tile 2:** Looks at Tile 1 (Left Neighbor).
      *   Tile 1 Right Edge = Blue.
      *   Tile 2 Left Edge = Yellow (Mismatch).
      *   **Action:** Rotate Tile 2 90° Clockwise. New Left Edge = Green. (Still Mismatch).
      *   **Action:** Rotate 90° Clockwise. New Left Edge = Red. (Still Mismatch).
      *   **Action:** Rotate 90° Clockwise. New Left Edge = Blue. (**Match**).
  *   **Propagation:** Once Tile 2 matches Tile 1, Tile 3 will eventually match Tile 2.
  *   **Global Result:** The "Match" signal propagates down the row. Since all tiles are identical permutations of (R, B, G, Y), if Tile 2 matches Tile 1's Right edge, Tile 2 must be in the *same orientation* as Tile 1.
  *   **End State:** All tiles in all rows align identically (e.g., all Red Up).
  *   **Reader:** Sees Row 1 all Red Up. Reads "YES".
  *   **Philosophical Point:** No Ant knows "Red Up" means "YES." No Ant sees the whole board. No Ant intends "YES."

  ---

  # Two: Sequence of Rounds

  You have 90 minutes. Do not lecture. Hand out materials immediately.

  **0:00 – 0:10: Setup & Round 1 (Baseline)**
  *   Split class: 6 Ants Colony A, 6 Ants Colony B, 2 Readers (one per colony), 3 Auditors (watch for talking/cheating).
  *   Distribute Tiles (random orientation) and Rule Cards (Round 1 Rule).
  *   **Task:** "Make the board stable." (5 mins).
  *   **Wager & Read:** Ants wager. Reader enters, reads Key A.
  *   **Outcome:** Likely Success. High confidence.

  **0:10 – 0:25: Round 2 (The Shuffle)**
  *   **Action:** Collect Rule Cards. Shuffle them. Redistribute randomly to the *same* Ants. (Some Ants now have different rules? No, keep rules uniform per colony to ensure convergence, but **swap Ants between Colonies**).
  *   **Correction for Philosophy:** To test *organization vs. individual*, swap 3 Ants from Colony A with 3 from Colony B. Keep the Rules the same.
  *   **Task:** Run Round 1 Rule again.
  *   **Outcome:** Success.
  *   **Point:** The "mind" survived the replacement of half its parts. (Ship of Theseus/Functionalism).

  **0:25 – 0:40: Round 3 (The Lesion)**
  *   **Action:** Secretly hand two Ants (e.g., Row 3 and Row 4) a card that says **"FROZEN: Do not touch your tiles."**
  *   **Task:** Run Round 1 Rule.
  *   **Outcome:** The board will likely fracture. Row 3 won't update. Row 4 won't match Row 3. Reader says "ERROR."
  *   **Wager:** Ants will lose counters. Frustration ensues.
  *   **Point:** Competence degrades gracefully or catastrophically? Is the "belief" lost or just inaccessible?

  **0:40 – 0:55: Round 4 (The Two Readers)**
  *   **Action:** Reset board. Run Round 1 Rule again (No lesions).
  *   **Twist:** When Time is called, bring in **Reader A** (Key A) and **Reader B** (Key B) simultaneously.
  *   **Action:** Reader A says "YES." Reader B says "DANGER."
  *   **Task:** The Colony must vote: Did we say YES, DANGER, or neither?
  *   **Point:** Indeterminacy of content. (See Section Three).

  **0:55 – 1:10: Round 5 (The Autobiography)**
  *   **Action:** Reset board. Run Round 1 Rule.
  *   **Twist:** Every 30 seconds, blow a whistle. Each Ant must write **one word** on a slip of paper describing what they are doing *only* based on their local view (e.g., "Turning," "Waiting," "Blue").
  *   **End:** Collect slips. Reader stitches them into a sentence.
  *   **Point:** First-person authority vs. third-person reality.

  **1:10 – 1:30: Debrief & Exit Ticket**

  **Judgement on Your Four Ideas:**
  1.  **Shuffle:** **Keep.** Essential for substrate independence.
  2.  **Lesion:** **Keep.** Essential for localization of function.
  3.  **Dictator:** **Cut.** It introduces a homunculus. It solves the problem rather than illuminating it. It breaks the "no global view" constraint too visibly.
  4.  **Autobiography:** **Keep but Shorten.** Make it the transition to debrief. It directly targets phenomenology.

  ---

  # Three: Sharpening the "Two Readers" Round

  This is the crux of the intentionality problem. To make it work, the ambiguity must be genuine, not just a "mistake."

  **The Design:**
  The board converges on **All Red Up**.
  *   **Reader A (Internalist Key):** "We agreed before class that Red Up means 'YES'." (This represents the colony's functional history).
  *   **Reader B (Externalist Key):** "In the context of this room's fire safety plan, a Red field means 'DANGER'." (This represents the environment fixing the content).

  **The Script for the Readers:**
  *   **Reader A:** "I have the Colony's Codebook. It says Red = YES."
  *   **Reader B:** "I have the World's Codebook. It says Red = DANGER."
  *   **The Confrontation:** Ask the Ants: "You wagered on Success. Did you succeed?"
      *   If they say "Yes (we said YES)": They commit to Internalism (meaning is in the rules).
      *   If they say "No (it was Danger)": They commit to Externalism (meaning is in the world).
      *   If they say "Neither": They commit to Eliminativism (there was no meaning, just physics).

  **The Trap:**
  Ensure Reader B is not an "invader." Give Reader B a badge that says "Safety Inspector." Give Reader A a badge that says "Colony Clerk." Both have equal authority in the room. The Ants must decide which authority constitutes *their* mind.

  ---

  # Four: The Debrief Structure

  Do not lecture. Draw four columns on the board. Ask the students to place specific moments from the game into the columns.

  **Column 1: Intelligence (Getting it Right)**
  *   *Prompt:* "When did the colony act intelligently?"
  *   *Target Moment:* Round 1 (Success).
  *   *Separation:* They got the answer right, but did they *know* it? Distinguish **Competence** (functional success) from **Comprehension** (understanding).

  **Column 2: Aboutness (Intentionality)**
  *   *Prompt:* "What was the board *about* in Round 4?"
  *   *Target Moment:* The Two Readers conflict.
  *   *Separation:* If the physical state was identical, but the meaning changed based on who read it, is the meaning in the head (board) or the world? This isolates **Content** from **State**.

  **Column 3: Phenomenology (What It Is Like)**
  *   *Prompt:* "Read the Autobiography slips. Did the colony feel anything?"
  *   *Target Moment:* Round 5.
  *   *Separation:* The slips read "Turning, Waiting, Blue." There is no "We." This isolates **Experience** from **Function**. You can have function without a unified subject.

  **Column 4: Determinacy (Fact of the Matter)**
  *   *Prompt:* "Is there a true fact about what the colony believed?"
  *   *Target Moment:* The Wager in Round 4.
  *   *Separation:* If the Ants can't agree on what they meant, is there a fact? This isolates **Truth** from **Consensus**.

  **The Uncomfortable Move:**
  End the debrief by pointing at the Autobiography slips. "You just wrote a first-person report ('I turned') based on local data. You feel certain you are a subject. But you were a tile-rotator in a system I designed. What guarantees that *your* introspection isn't just the output of a rule card you can't see?"

  ---

  # Five: Honesty About the Ceiling

  **What Goes Wrong:**
  1.  **The Hacker:** One student will realize the tiles are identical and shout "Just turn them all Red!"
      *   *Fix:* The Auditors have authority to disqualify the colony if global coordination is detected. Tell the class: "The goal is not the pattern; the goal is following the rule. If you cheat, you prove the point that ants can't cheat."
  2.  **The Drift:** "It's all interpretation." Students may decide meaning is *always* arbitrary, missing the point that *some* interpretations work and others don't.
      *   *Fix:* In debrief, press on Round 1. "Why did Key A work and Key B work, but 'The Colony is a Toaster' did not?" Constrain the relativism.
  3.  **The Lesion Punishment:** The Frozen Ants feel excluded/bored.
      *   *Fix:* Give Frozen Ants a different task: "Record the state of your row every 30 seconds." Make them the data-loggers.
  4.  **Time Creep:** The matching takes too long.
      *   *Fix:* If 5 minutes pass without convergence, blow the whistle. "Time." Force the Reader to read the imperfect board. The failure is data.
  5.  **Talking:** Ants will whisper.
      *   *Fix:* Play loud white noise or music during the rounds.

  **The Gaps (What You Must Supply):**
  *   **Evolution:** Your colony was designed by *you* (the instructor) to have meaning. Real minds were shaped by evolution. You must explain that in the real world, the "Reader" is natural selection, not a person with a key.
  *   **Scale:** 36 tiles is not 86 billion neurons. The "smoothness" of human thought comes from massive parallelism they didn't experience.
  *   **The Subject:** The activity proves the colony *functions* like a subject. It does not prove there *is* a subject. You must explicitly state: "We simulated the behavior of a mind. We did not settle whether a mind exists."

  ---

  # Six: Exit Ticket & Variants

  ### The Exit Ticket (1 Minute)
  *Hand out a slip with two scenarios. Students must circle one.*

  > **Scenario A:** A robot passes the Turing Test. It says "I am in pain." It has no internal sensors, only a lookup table.
  > **Scenario B:** A human says "I am in pain." They have a brain, but we discover their brain is a hollow shell controlled by radio signals from a distant alien.
  >
  > **Question:** In which scenario is the claim "I am in pain" **FALSE**?
  > [ ] Scenario A only
  > [ ] Scenario B only
  > [ ] Both
  > [ ] Neither
  >
  > **Why?** (One sentence).

  *Analysis:* If they choose A, they are Functionalists. If B, they are Biological Naturalists. If Both, Eliminativists. If Neither, they prioritize the output over the substrate. This tells you if they grasped the separation of function and substrate.

  ### Variant: 40-Person Lecture
  *   **Change:** You cannot run two colonies.
  *   **Design:** Pick 12 volunteers to come to the front. The rest of the class are "Readers."
  *   **Modification:** Give the audience 3 different "Key Sheets." When the volunteers finish, have Section 1 read Key A, Section 2 read Key B, Section 3 read Key C.
  *   **Loss:** The "Ants" lose the visceral feeling of constraint. The audience becomes the interpreters.
  *   **Gain:** The "Two Readers" problem becomes a "Three Sections" problem, democratizing the indeterminacy.

  ### Variant: 8-Person Reading Group
  *   **Change:** Too few for two colonies.
  *   **Design:** One Colony of 6. 2 Readers.
  *   **Modification:** Run the rounds sequentially, but after each round, pause for 5 minutes of discussion *before* revealing the next twist.
  *   **Loss:** You lose the comparative data (Colony A vs. Colony B).
  *   **Gain:** You gain depth. You can let them struggle with the "Two Readers" paradox for 20 minutes.
  *   **Survival:** The "Lesion" round is hard with only 6 ants (removing 2 is 33% loss). Remove only 1 ant.

  ### What Does Not Survive?
  The **Wagering** mechanic fails in the Lecture variant (too much logistics) and the Reading Group (too competitive for a small bond). In those cases, replace wagering with **Prediction Logs**: "Write down what you think the Reader will say." It achieves the same cognitive commitment without the physical overhead.
