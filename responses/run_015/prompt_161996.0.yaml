answer: |-
  A viscoelastic ball drops under gravity in a vacuum, bouncing on a rigid plate. The "Lamp" is ON when the ball's center of mass is strictly above the plate ($z>0$) and OFF when in contact ($z \le 0$). Due to viscoelastic dissipation, bounce heights and contact durations decay geometrically; the infinite sequence of bounces completes at finite time $T$. Velocities remain bounded by the initial drop speed; total mass and energy are finite. At $T$, the ball rests at $z=0$. The Lamp state is locally coupled to $z(t)$. The time-reverse (spontaneous bouncing from rest) violates energy conservation and is not a solution.

  ### Demonstration

  **Thomson's Argument Halves:**
  1.  **"It cannot be ON":** Thomson argues that if ON at $T$, it must have been turned ON at some $t < T$ and not turned OFF. This relies on the premise that *state persistence requires a last triggering event*. This breaks here: the ball is OFF at $T$ not because of a last "turn OFF" command, but because the *capacity to switch* (kinetic energy) vanished.
  2.  **"It cannot be OFF":** Thomson argues that if OFF at $T$, it must have been turned OFF and not turned ON. This relies on the premise that *state is defined solely by the discrete sequence of switchings*. This breaks here: the state is defined by the continuous variable $z(t)$, which converges to 0 even though the discrete sequence of crossings ($z=0$) has no last element.
  3.  **Dependency:** These are not independent; both rely on the silent premise that the indicator's state at $T$ is a function of the *order-type of the switching history* rather than the *topological limit of the physical trajectory*.

  **Derivation of State:**
  The equation of motion with viscoelastic damping ensures $z(t) \to 0$ and $\dot{z}(t) \to 0$ as $t \to T$. By continuity of position, $z(T) = 0$. The coupling rule states $L(T) = \text{OFF} \iff z(T) \le 0$. Thus, $L(T) = \text{OFF}$. The alternative ($L(T)=\text{ON}$) implies $z(T) > 0$, which contradicts the derived limit of the trajectory.

  **Underdetermination Reply:**
  This reply claims the story leaves $L(T)$ open. It is unavailable here because the physical laws (gravity + dissipation) + initial conditions logically entail $z(T)=0$. There is no logical gap for "stipulation" to fill; any stipulation of $L(T)=\text{ON}$ would contradict the equations of motion.

  **Key Feature and Removal:**
  The working feature is **dissipation** (the attractor at $z=0$). If removed (perfectly elastic collisions, coefficient of restitution $= 1$), the ball bounces forever ($T \to \infty$), and no supertask occurs. If one artificially forces $T$ to be finite without dissipation, the velocity at $T$ is undefined, and the time-reverse becomes a valid solution (spontaneous excitation), collapsing determinacy into the standard underdetermination diagnosis.

  **Strongest Objection:**
  A Thomson defender would argue: *"This is not a Thomson Lamp; it is a convergent physical process. The 'switching' is epiphenomenal to the decay. Thomson's case requires the switching itself to be the exhaustive description of the system, without a background variable like $z(t)$ settling the outcome."*
  **Verdict:** This lands partially. It concedes that Thomson's original setup was physically incomplete (lacking a carrier variable). My result shows that *any* physically realizable supertask must embed the switching in a continuous dynamics that settles at the limit. Thus, Thomson's paradox arises only in descriptions that abstract away the physical continuity required to implement the task. The paradox is an artifact of incomplete physical modeling, not a logical truth about supertasks.
