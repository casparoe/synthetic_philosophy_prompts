answer: |-
  I reject step **(5)**.

  I keep (1) and (2) because you are right to hold onto them: they provide the necessary leverage to distinguish explanation from mere chronicle. Without the requirement that an explanatory factor discriminate between the actual outcome and a live alternative, any narrative becomes an explanation, and rigor dissolves. However, (5) makes an illicit inferential leap from the logic of *event* explanation to the logic of *structural* explanation by fixing the contrast class too narrowly.

  Here is the argument for why (5) fails, what it costs to reject it, and what remains of Braudel's project once the dust settles.

  ### The Argument Against (5)

  Step (5) claims: *"Whatever stays fixed across a stretch of time is explanatorily inert within it, because only what varies can distinguish one outcome from its alternatives."*

  This is true only if the "alternatives" (the contrast class) are defined exclusively as *other temporal moments within the same structural system*. But explanation is pragmatic; the contrast class is determined by the question asked, not merely by the calendar.

  When a physicist cites the gravitational constant $G$ to explain why an orbit closes, they are not comparing the actual orbit to a different orbit *within the same universe with the same $G$*. They are comparing the actual system to a *counterfactual* system where $G$ differs, or to a different *type* of system where the force law is distinct. The contrast class is modal, not just temporal.

  Similarly, Braudel is not primarily asking, *"Why did the Battle of Lepanto occur in 1571 rather than 1572?"* If that were the question, geography would indeed be inert, and (4) would stand. But Braudel's explanatory target is broader: *"Why did Mediterranean history take the form of cyclical confinement rather than Atlantic expansion?"* or *"Why was grain price volatility in the 16th century bound by these specific limits?"*

  In these questions, the contrast class includes *other regions* (the Atlantic, the Baltic) or *counterfactual structural contexts* (a Mediterranean without mountains, or with different wind patterns). Across *that* contrast class, the "slow facts" do vary. The shape of the basin differs between the Mediterranean and the Atlantic; the rainfall regime differs between the Levant and Northern Europe. Therefore, under (1) and (2), the slow facts *are* explanatory. Step (5) fails because it universalizes a constraint on token-event explanation (discriminating between moments $t_1$ and $t_2$) to all explanation, ignoring that standing conditions explain why the *range* of possible events at $t_1$ and $t_2$ is what it is.

  ### The Cost of Rejecting (5)

  Rejecting (5) costs you the simplicity of a single, uniform model of historical explanation. You must accept that "explanation" in history is stratified:

  1.  **Event Explanation:** Uses variable factors (harvests, decisions, battles) to explain specific outcomes against a background of fixed structures. Here, (1) and (2) apply strictly within the period.
  2.  **Structural Explanation:** Uses standing conditions (geography, climate) to explain the *bounds of possibility* against a background of alternative structures (other regions or counterfactual worlds).

  The cost is admitting that analytic philosophy's standard contrastive model must be expanded to include *cross-system* or *modal* contrast classes, not just *intra-system* temporal ones. You lose the ability to say that a single factor is either "explanatory" or "inert" simpliciter; its status depends on the scale of the question. A mountain range is inert for explaining a specific skirmish on its slope (the terrain was fixed for both armies) but explanatory for why the campaign happened there rather than in the plain (the terrain varies between the two locations).

  ### The Residue of the Slow Structures

  Once you reject (5), what is the tier of slow structures left explaining? It is not the *selection* of specific events, but the **constraint of the event space**.

  Slow structures explain the *probabilities* and *limits* of human action. They do not tell you why Philip II launched the Armada in 1588 (that is event history). They explain why he launched a *naval* Armada rather than a *land* invasion, why it had to depart from Lisbon rather than Vienna, and why its failure was almost certain given the wind patterns of the Bay of Biscay.

  This residue is substantial. It explains why certain "events" were never even candidates for the contrast class. In a landlocked empire, naval battles are not part of the contrast class for "major military engagements." In the Mediterranean, they are. The slow facts explain the *menu* from which agents choose, even if they do not determine the *order*.

  ### Justifying Braudel's Architecture

  Is this residue enough to justify Braudel's three-tier scheme, or merely excuse it? It justifies it.

  If you accept the Invariance Argument, history collapses into a sequence of contingencies (the "event-history" Braudel sought to displace). By rejecting (5), you validate Braudel's insight that contingency operates within necessity. The *longue durée* (environment) sets the stage; the *conjonctures* (cycles) dictate the rhythm; the *événements* (events) are the performance.

  Without the first two tiers, the third tier is unintelligible. You cannot explain why a specific price spike caused a riot (event) without understanding the baseline cost of transport (structure) that made the population vulnerable to that spike. The structure does not explain the *timing* of the riot, but it explains the *susceptibility* of the society.

  Therefore, Braudel's architecture is not a failure of explanation; it is a recognition that different explanatory questions require different contrast classes. The Invariance Argument fails because it demands that structural history answer event-level questions. Once you reject (5), you see that Braudel's environmental section explains the *conditions of possibility* for the period. It tells us why the 16th-century Mediterranean was a coherent historical unit distinct from the 16th-century Atlantic. That is not nothing; it is the foundation upon which event history becomes more than a list of accidents.
