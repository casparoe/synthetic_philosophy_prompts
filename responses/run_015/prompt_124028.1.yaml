answer: |-
  # The Equality Diagnostic: What Should Be Made Equal?

  **Introduction**
  We often say we want "equality," but equality of *what*? Money? Happiness? Opportunity? Freedom? This questionnaire presents eight concrete scenarios. There are no right or wrong answers. Your choices will reveal which underlying principle of justice you naturally lean toward.

  **Instructions**
  Read each case and select the **one** option that best matches your judgment. Record your answers (e.g., 1-A, 2-C) on a slip of paper.

  ---

  ### The Questions

  **1. The Equipment Case**
  Two students are given identical laptops for schoolwork. One student has dyslexia and finds standard software difficult to use, resulting in lower grades despite equal effort. The other student uses the laptop easily.
  *   **A.** Give the student with dyslexia specialized software so their grades match the other student's.
  *   **B.** Give both students the same laptop. The school has treated them equally; the rest is up to them.
  *   **C.** As long as both students pass their classes, the difference in grades and equipment doesn't matter.

  **2. The Expensive Taste Case**
  A student has trained themselves to only enjoy very rare, expensive coffee. On the standard school budget, they are miserable. Another student is perfectly happy with instant coffee.
  *   **A.** Give the first student extra money. Their misery matters, and we should equalize happiness.
  *   **B.** Do not give extra money. They chose to cultivate expensive tastes; they are responsible for that cost.
  *   **C.** Give them money only if the standard budget fails to meet basic nutritional needs.

  **3. The Adaptive Preferences Case**
  In a school culture where girls have historically been discouraged from science, a group of girls says they are perfectly happy with fewer lab opportunities than the boys. They say they "don't need" them.
  *   **A.** Give them the same lab opportunities anyway. They may be happy, but they have been taught to expect less.
  *   **B.** Respect their judgment. If they say they are happy with less, forcing resources on them is disrespectful.
  *   **C.** Ensure they have the same *right* to join the lab, but do not worry if they choose not to use it.

  **4. The Night Owl Case**
  The school day starts at 8:00 AM. This suits most students, but one student is a natural "night owl" and loses two hours of effective learning time every day due to fatigue. Changing the schedule is costly.
  *   **A.** Adjust the schedule or provide equivalent evening classes. Real learning opportunity should be equal.
  *   **B.** Keep the schedule. One rule for everyone is fairer than making exceptions for biological differences.
  *   **C.** Provide tutoring only if the student's grades fall below a passing standard.

  **5. The Threshold Case**
  Everyone in the school community has enough money to live a decent, dignified life. However, some families have ten times more wealth than others.
  *   **A.** Tax the wealthy to reduce the gap. Large inequalities are unfair even if everyone is decent.
  *   **B.** Do nothing. As long as everyone is above the decent minimum, inequality is not a problem.
  *   **C.** Tax the wealthy only if the money raised would improve the lives of the least wealthy.

  **6. The Leveling Down Case**
  There is a surplus of sports equipment in the rich stream. The poor stream has enough to play, but less variety. The only way to make the equipment *exactly equal* is to destroy the surplus in the rich stream without giving it to the poor stream.
  *   **A.** Destroy the surplus. Equality is valuable in itself, even if it helps no one.
  *   **B.** Do not destroy it. Making things equal is only good if it makes someone better off.
  *   **C.** Do not destroy it, but it is still a regrettable fact that the streams are unequal.

  **7. The Natural Talent Case**
  Student A studies 1 hour and gets an A because they are naturally gifted. Student B studies 5 hours and gets a B. A scholarship fund is available.
  *   **A.** Give the scholarship to Student B. Natural talent is just luck; effort should be rewarded.
  *   **B.** Give the scholarship to Student A. Grades predict future success, and we should maximize school achievement.
  *   **C.** Split the scholarship or base it on financial need, ensuring both have a decent future regardless.

  **8. The Responsibility Case**
  A student gambles away their lunch money on a bet they knew was risky. They are now hungry.
  *   **A.** Give them lunch. Hunger is bad regardless of why it happened.
  *   **B.** Do not give them lunch. They made a free choice and must face the consequence.
  *   **C.** Give them a basic meal (bread/water) but no treats. We prevent starvation but uphold responsibility.

  ---

  # Facilitator's Scoring & Analysis Key

  **Note to Facilitator:** This key maps student answers to seven specific philosophical positions. Because some theories agree on certain cases, look for the **dominant pattern** across the eight questions. No single question determines the view; the profile does.

  ### 1. The Mapping Table
  *For each question, mark which theory supports which option.*

  | Q | Option A | Option B | Option C |
  | :--- | :--- | :--- | :--- |
  | **1 (Disability)** | **Capabilities / Obj. Welfare** (Equalize outcome/function) | **Resources / Rawls** (Equalize means/rules) | **Sufficientarianism** (Meet threshold) |
  | **2 (Tastes)** | **Welfare (Subjective)** (Equalize happiness) | **Resources / Luck Egal.** (Responsibility) | **Welfare (Obj.) / Suff.** (Basic needs only) |
  | **3 (Preferences)** | **Capabilities / Obj. Welfare** (Freedom > Happiness) | **Welfare (Subjective)** (Happiness is all) | **Resources / Rawls** (Rights/Means equal) |
  | **4 (Night Owl)** | **Capabilities** (Real freedom to learn) | **Resources / Rawls** (Equal rules) | **Sufficientarianism** (Pass threshold) |
  | **5 (Threshold)** | **Strict Equality** (Gap matters) | **Sufficientarianism** (Threshold is all) | **Rawls** (Difference Principle) |
  | **6 (Leveling)** | **Strict Equality** (Equality is intrinsic good) | **Sufficientarian / Util.** (Only outcomes matter) | **Rawls / Pluralist** (Equality has value) |
  | **7 (Talent)** | **Luck Egalitarianism** (Neutralize luck) | **Meritocratic / Rawls** (Maximize index) | **Sufficientarian / Rawls** (Focus on worst-off) |
  | **8 (Responsibility)**| **Welfare (Subjective)** | **Resources / Luck Egal.** | **Welfare (Obj.) / Suff.** |

  ### 2. Identifying the Views (The "Leaves")

  **Equality of Welfare (Subjective)**
  *   **Pattern:** Mostly **A** on Q2, Q3, Q8.
  *   **Core Idea:** What matters is how people *feel*. If someone is happy with less (Q3), leave them be. If someone is miserable (Q2), help them.
  *   **Diagnostic Answer:** Q2-A is the strongest indicator.

  **Equality of Welfare (Objective)**
  *   **Pattern:** Mostly **A** on Q1, Q3, but **C** on Q2, Q8.
  *   **Core Idea:** Well-being is about objective goods (health, knowledge), not just feelings. We help the disabled (Q1) and ignore adaptive preferences (Q3), but we don't fund expensive tastes (Q2).
  *   **Diagnostic Answer:** Q3-A combined with Q2-C.

  **Equality of Resources (Dworkin)**
  *   **Pattern:** Mostly **B** on Q1, Q2, Q3, Q8.
  *   **Core Idea:** Give everyone equal *means*. Compensate for brute luck (disability is tricky here, often leans A, but strict resource view says B), but never compensate for choices (expensive tastes, gambling).
  *   **Diagnostic Answer:** Q2-B and Q8-B are the strongest indicators.
  *   **Overlap Warning:** This view often overlaps with **Luck Egalitarianism**. To separate them, check Q7. Luck Egalitarians choose A (compensate talent luck); Resource Egalitarians often choose B or C (focus on endowment insurance).

  **Rawlsian Primary Goods**
  *   **Pattern:** Mostly **B** on Q1, Q3, Q4; **C** on Q5, Q6.
  *   **Core Idea:** Equalize social "all-purpose means" (rights, liberties, income). Inequality is permitted *only* if it benefits the worst-off (Difference Principle).
  *   **Diagnostic Answer:** Q5-C is the unique Rawlsian marker (inequality allowed if it helps the poor). Q6-C (regrettable inequality) is also common.

  **Equality of Capabilities (Sen/Nussbaum)**
  *   **Pattern:** Mostly **A** on Q1, Q3, Q4.
  *   **Core Idea:** Equalize the real *freedom* to function. It's not about the laptop (Resource) or the grade (Outcome), but the *ability to use* the laptop to learn.
  *   **Diagnostic Answer:** Q4-A (adjust schedule for real opportunity) distinguishes this from Resources (Q4-B). Q3-A distinguishes this from Subjective Welfare.

  **Luck Egalitarianism**
  *   **Pattern:** Mostly **B** on Q2, Q8; **A** on Q1, Q7.
  *   **Core Idea:** Neutralize disadvantages caused by *luck* (disability, talent), but hold people responsible for *choices* (tastes, gambling).
  *   **Diagnostic Answer:** Q7-A (talent is luck) combined with Q2-B (tastes are choice).
  *   **Overlap Warning:** Very close to **Resources**. The split is usually on Natural Talent (Q7). Resources view talent as part of the person; Luck Egalitarians view it as arbitrary luck to be taxed/compensated.

  **Sufficientarianism**
  *   **Pattern:** Mostly **C** on Q1, Q4, Q5, Q8.
  *   **Core Idea:** Justice is satisfied when everyone is above a decent threshold. Inequality above that line does not matter.
  *   **Diagnostic Answer:** Q5-B is the definitive Sufficientarian answer. Q6-B (reject leveling down) supports this.

  ### 3. Overlaps & Limitations
  *   **Resources vs. Luck Egalitarianism:** These two will almost always give the same answers on Q2 (Tastes) and Q8 (Responsibility). The questionnaire cannot fully separate them without asking about "hypothetical insurance markets." Treat them as a cluster unless Q7 (Talent) is answered A (Luck) vs B (Resources).
  *   **Capabilities vs. Objective Welfare:** These overlap on Q1 and Q3. The distinction is metaphysical (Freedom vs. Functioning). To separate them, ask: "Is it bad if someone *could* go to the lab but *chooses* not to?" Capabilities say No; Objective Welfare might say Yes (they aren't functioning).
  *   **Rawls vs. Resources:** Rawls allows inequality if it helps the worst-off (Q5-C). Resources generally seeks to neutralize luck regardless of the aggregate benefit (Q5-A or B).

  ### 4. Empty Combinations (Incoherent Profiles)
  *If a student produces one of these combinations, their view is likely unstable or incoherent.*

  1.  **The "Leveling Sufficientarian" (Q5-B + Q6-A)**
      *   *Answers:* "Inequality above the threshold doesn't matter" AND "We should destroy surplus to make things equal even if it helps no one."
      *   *Diagnosis:* **Incoherent.** Sufficientarianism explicitly rejects the "Leveling Down" objection. If you believe only the threshold matters (Q5-B), you cannot believe equality has intrinsic value above that threshold (Q6-A).
      *   *Follow-up:* Ask: "If everyone has enough, is it still unfair for one person to have more?"

  2.  **The "Irresponsible Compensator" (Q2-A + Q8-B)**
      *   *Answers:* "Compensate the expensive coffee taste" AND "Let the gambler starve."
      *   *Diagnosis:* **Unattractive/Unstable.** This compensates for a cultivated preference (usually considered a choice) but punishes a basic need failure due to a choice. It lacks a consistent principle of responsibility. Most theories either compensate both (Welfare) or neither (Resources/Luck).
      *   *Follow-up:* Ask: "What is the difference between choosing coffee and choosing a bet? Is one more 'essential' than the other?"

  3.  **The "Paternalist Libertarian" (Q3-B + Q1-A)**
      *   *Answers:* "Respect the girls' choice to do less science" AND "Force better software on the disabled student."
      *   *Diagnosis:* **Unoccupied/Tension.** This respects adaptive preferences (Subjective Welfare) but rejects resource equality for disability (Capabilities/Obj Welfare). It implies we should fix biological luck but ignore social conditioning.
      *   *Follow-up:* Ask: "If the girls were taught to expect less due to biology, would you help them? What makes social conditioning different?"

  ### 5. How to Debrief
  1.  Have students tally their most frequent letter (A, B, or C) *per theory cluster* using the Mapping Table.
  2.  Reveal the "Empty Combinations" first to check for consistency.
  3.  Ask students whose results landed on **Resources/Luck Egalitarianism** to debate those who landed on **Capabilities/Welfare**. The core conflict is usually: *Do we equalize the tools (Resources) or the ability to use them (Capabilities)?*
  4.  Ask **Sufficientarians** if they truly accept vast wealth gaps (Q5) provided everyone is fed. This usually provokes the strongest reaction.
