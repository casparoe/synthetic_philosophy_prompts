          *   C: It depends on why they have more (Luck Egalitarian).

      *   *Case 7: Natural Talent vs. Effort (Needed for Luck Egalitarian/Rawls).*
          *   Scenario: One student studies 1 hour and gets A (genius). One studies 5 hours and gets B.
          *   A: Give the B student extra tutoring to catch up (Equality of Outcome).
