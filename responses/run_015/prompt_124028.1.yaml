prompt: |-
  I'm in my final year of secondary school and I run our school's philosophy society. We are doing a session on the question of what exactly ought to be equal — equal happiness, equal income and goods, equal real freedoms, equal standing above a decent threshold — and I would like to build a short diagnostic questionnaire rather than hold another reading discussion: eight questions, each a concrete case with three answer options, plus a scoring key that sorts people by the answers they give rather than by the label they would pick if asked outright. My classmates have no philosophy background, so every question must be answerable from the case itself, with no jargon and with no option phrased as a theory name, but each one should be a point at which the actual positions come apart.

  Please build the questions around cases of roughly these kinds: two pupils given identical equipment where one has a disability that makes the same equipment achieve less; a pupil who has deliberately cultivated an expensive taste and is now miserable on an ordinary budget; a pupil in a school culture where girls have been taught to expect less and who reports being perfectly content with less; a pupil who is an extreme night owl and loses about two hours of effective learning time a day to a morning timetable that suits nearly everyone else; a case in which everyone is well above a decent minimum but some have vastly more; and a case in which the only way to make things equal is to take from the better-off without giving anything to anyone.

  The leaves I need in the key are equality of welfare (with its subjective, desire-based, and objective-list variants split out wherever the questions allow), equality of resources understood so that handicaps are compensated but expensive tastes are not, the Rawlsian primary-goods answer, equality of capabilities, luck egalitarianism, and sufficientarianism. For each question, say which option each of those views is committed to; where two of them must give the same answer, flag that the questionnaire cannot separate them and say what further question would be needed to do so. Then list two or three combinations of answers that no named view occupies, saying briefly whether each is empty because it is incoherent, merely unattractive, or simply unoccupied so far. The finished handout should let someone be told which view they hold because of what they said about cases, and should tell me which of their answers did the work.
reasoning: |-
  Here's a thinking process that leads to the suggested questionnaire and scoring key:

  1.  **Analyze the Request:**
      *   **Target Audience:** Final year secondary school students (no philosophy background).
      *   **Context:** School Philosophy Society session.
      *   **Task:** Create an 8-question diagnostic questionnaire on "What ought to be equal?" (Distributive Justice).
      *   **Format:** 8 concrete cases, 3 answer options each (A, B, C). No jargon, no theory names in options.
      *   **Scoring Key:** Must sort respondents into specific philosophical positions based on answer patterns, not self-identification.
      *   **Required Positions (Leaves in the Key):**
          1.  Equality of Welfare (Subjective/Desire-based).
          2.  Equality of Welfare (Objective-list).
          3.  Equality of Resources (Dworkin-style: compensate handicaps, not expensive tastes).
          4.  Rawlsian Primary Goods.
          5.  Equality of Capabilities (Sen/Nussbaum).
          6.  Luck Egalitarianism.
          7.  Sufficientarianism.
      *   **Specific Case Types Requested:**
          1.  Disability/Equipment (Identical equipment, different outcomes).
          2.  Expensive Tastes (Cultivated misery).
          3.  Adaptive Preferences (Girls content with less).
          4.  Chronotype/Schedule (Night owl vs. morning timetable).
          5.  Inequality above Threshold (Everyone decent, some vastly more).
          6.  Leveling Down (Take from rich, give to no one).
          7.  (Need 2 more to reach 8, should cover distinctions between the theories).
      *   **Scoring Key Requirements:** Map options to views, flag overlaps (where theories agree), suggest follow-ups for overlaps, identify "empty" answer combinations (incoherent/unattractive/unoccupied).
      *   **Output:** A finished handout ready for use.

  2.  **Deconstruct the Philosophical Positions:**
      *   *Equality of Welfare (Subjective):* Maximize/minimize happiness/satisfaction. If someone is happy with less, that's fine. If someone is miserable, fix it.
      *   *Equality of Welfare (Objective):* Maximize/minimize objective well-being (health, knowledge), regardless of subjective happiness.
      *   *Equality of Resources (Dworkin):* Equalize the *means*, not the *ends*. Compensate for brute luck (disability) but not option luck (expensive tastes).
      *   *Rawlsian Primary Goods:* Equalize social bases of self-respect, rights, liberties, income/wealth (all-purpose means). Focus on the worst-off (Difference Principle), but generally treats natural talents as common assets.
      *   *Equality of Capabilities:* Equalize the real *freedom* to function. Can you actually do the thing? (Focus on conversion factors).
      *   *Luck Egalitarianism:* Neutralize bad *luck*, hold responsible for *choices*. (Very similar to Dworkin on resources, but broader).
      *   *Sufficientarianism:* Everyone above a threshold. Inequality above the threshold doesn't matter.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Case 1: Disability/Equipment (Requested).*
          *   Scenario: Two students, same laptop. One has dyslexia, finds it harder to use.
          *   A: Give the dyslexic student better software (Equalize outcome/capability).
          *   B: Give both the same laptop, that's fair (Equalize resources).
          *   C: As long as both pass, it doesn't matter (Sufficientarian).
          *   *Mapping:* Capabilities/Welfare (Obj) -> A. Resources -> B. Sufficientarian -> C.

      *   *Case 2: Expensive Tastes (Requested).*
          *   Scenario: Student trained themselves to only drink rare coffee, now miserable with standard stuff.
          *   A: Give them extra budget to fix their misery (Welfare).
          *   B: No extra budget, they chose this (Resources/Luck Egalitarian).
          *   C: Check if they are below a decent standard of nutrition/hydration (Sufficientarian/Objective Welfare).
          *   *Mapping:* Welfare (Subj) -> A. Resources/Luck -> B. Suff/Objective -> C.

      *   *Case 3: Adaptive Preferences (Requested).*
          *   Scenario: Girls taught to expect less, say they are happy with fewer club opportunities.
          *   A: Give them more anyway, they don't know what they're missing (Capabilities/Objective Welfare).
          *   B: Respect their happiness, don't force resources (Subjective Welfare).
          *   C: Ensure they have the same *rights* to join, even if they don't (Rawls/Resources).
          *   *Mapping:* Cap/Obj Welfare -> A. Subj Welfare -> B. Rawls/Res -> C.

      *   *Case 4: Chronotype/Night Owl (Requested).*
          *   Scenario: Night owl loses 2 hours learning due to morning start.
          *   A: Change the schedule for them (Equalize opportunity/capability).
          *   B: Schedule is for the majority, they must adapt (Resources/Rule-based).
          *   C: As long as they pass exams, schedule doesn't matter (Sufficientarian).
          *   *Mapping:* Capabilities -> A. Rawls/Resources -> B. Sufficientarian -> C.

      *   *Case 5: Inequality Above Threshold (Requested).*
          *   Scenario: Everyone has enough to live well, but some have yachts.
          *   A: Tax the yachts to make everyone equal (Strict Equality/Welfare).
          *   B: It's fine, everyone has enough (Sufficientarian).
          *   C: Tax only if it helps the worst-off (Rawls).
          *   *Mapping:* Strict Eq -> A. Sufficientarian -> B. Rawls -> C.

      *   *Case 6: Leveling Down (Requested).*
          *   Scenario: Only way to equalize is to break the rich kids' legs (metaphorically) or destroy surplus without giving to poor.
          *   A: Do it, equality is valuable in itself (Strict Egalitarian).
          *   B: Don't do it, helps no one (Sufficientarian/Utilitarian).
