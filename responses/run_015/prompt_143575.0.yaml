  2.  **Deconstruct the Paradox:**
      *   *Observation:* Nordic countries (high equality) have fewer women in STEM and more in care/education compared to less egalitarian countries (e.g., Algeria, where STEM might be seen as a secure path regardless of preference).
      *   *Revealed Preference View:* When you don't *have* to work for survival, you choose what you *like*. Men and women have different average interests (things vs. people). Equality allows this to show.
      *   *Structural Feedback View:* "Equality" isn't a vacuum. High-equality societies are often hyper-competitive meritocracies. Credentials become status markers. Gendered socialization adapts to these new markers. "Choice" is shaped by the structure of the options available.

  3.  **Select the Concrete Example:**
      *   *Option A:* Engineering vs. Nursing. Classic, clear distinction (things vs. people).
      *   *Option B:* Primary Teaching vs. Corporate Management. Good for status/power dynamics.
      *   *Decision:* **Engineering vs. Care Professions (e.g., Nursing/Teaching).** This is the most cited example in the paradox literature (STEM share). It allows for a sharp contrast between "technical merit" and "social care."

  4.  **Drafting the Explanations (The Core Contrast):**

      *   *Revealed Preference:* In Sweden/Norway, the welfare state is strong. Women don't *need* a high-paying engineering job to survive. They are free to follow "intrinsic" interests. If women average higher interest in people-oriented work, they choose nursing/teaching. Men average higher interest in things/systems, they choose engineering. The segregation is a sign of *freedom*.
      *   *Structural Feedback:* In Sweden/Norway, the economy is knowledge-based and competitive. Engineering is high-status, high-pay, "neutral" meritocracy. But the *culture* of engineering is still coded masculine (long hours, specific types of competition). Meanwhile, the welfare state expands care sectors (nursing/teaching), coding them as "feminine" extensions of domestic roles. The "choice" to avoid engineering isn't just preference; it's a reaction to the signaling of who belongs there. The "neutral" meritocratic structure actually reinforces the gender divide because the criteria for success in engineering align with masculine socialization, while the expanded care sector aligns with feminine socialization.

  5.  **Addressing the Theoretical Stakes (Justice & Neutrality):**
      *   If we accept Revealed Preference: Justice is achieved when barriers are removed. Outcome inequality doesn't matter if the process was free.
      *   If we accept Structural Feedback: Justice requires looking at *how* preferences are formed and how institutions signal value. "Neutrality" is a mask. If institutions reward masculine-coded behaviors under the guise of merit, "free choice" just legitimizes inequality.
