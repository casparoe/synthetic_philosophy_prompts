      *   **Specific Tension:** Sen's Liberal Paradox (Minimal Liberty vs. Pareto Efficiency).
      *   **Task:** Draft a short formal opinion/memo recommending adoption, rejection, or conditional approval.
      *   **Requirements:**
          *   Clear bottom-line recommendation.
          *   Specified time frame (implementation/sunset/review).
