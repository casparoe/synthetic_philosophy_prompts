answer: |-
  There is no single established name that comfortably spans both the game-theoretic setup (often called **Program Equilibrium**) and the self-modification setup (often called the **Tiling Agents Problem**), though practitioners in formal verification and agent foundations recognize them as siblings. They are instances of the same underlying phenomenon.

  I propose calling this phenomenon **Löbian Coupling**.

  It is the constraint imposed on interacting or sequential agents when their decisions depend on proofs about each other's (or their own) decision procedures within a consistent formal system. The "coupling" refers to the fact that the agents' outputs are not determined by their code alone, but by the fixed-point properties of the provability predicate linking them.

  Here is the carving you requested.

  ### 1. One Phenomenon or Two?

  They are one phenomenon.

  In the **code-swap game**, the coupling is mutual and simultaneous. Agent $A$ cooperates if it proves $B$ cooperates. Agent $B$ cooperates if it proves $A$ cooperates. This creates a loop: $A \to \square B \to \square \square A \dots$
  In the **successor case**, the coupling is sequential and hierarchical. Agent $A$ activates $B$ only if it proves $B$ is safe. If $B$ uses the same axioms, $A$ is effectively asked to prove the consistency of its own system (since $B$'s safety relies on $B$'s logic, which is $A$'s logic).

  Both cases turn on **Löb's Theorem**: $\square(\square P \to P) \to \square P$.
  *   In the **game**, this theorem is the *engine of cooperation*. The programs effectively prove: "If it is provable that we cooperate, then we cooperate." Löb's theorem licenses the inference to "We cooperate."
  *   In the **successor** case, this theorem is the *barrier to trust*. To trust a successor with equal power, $A$ must prove $\text{Sound}(B)$. But if $B$ is equivalent to $A$, $\text{Sound}(B)$ implies $\text{Con}(A)$. By Gödel's Second, $A$ cannot prove $\text{Con}(A)$.

  The difference in outcome (cooperation vs. blockage) is not a difference in kind, but a difference in the **polarity of the fixed point**. The game constructs a positive fixed point (cooperation is provable). The successor problem hits a negative fixed point (soundness is unprovable). Both are manifestations of the fact that a formal system cannot contain its own truth predicate without restriction, but can contain its own provability predicate under specific modal conditions.

  ### 2. Refuting the Four Diagnoses

  You were offered four explanations. All four are category errors relative to Löbian Coupling.

  **Diagnosis 1: Undecidability / Rice's Theorem**
  *   **The Claim:** You can't decide program behavior, so the agents can't know what to do.
  *   **Why it fails:** Rice's Theorem applies to *arbitrary* programs. In your setup, the programs are *known* and *specific*. The referee does not ask "Does this program halt?" (undecidable). The referee runs them. They *do* halt. The issue is not whether the behavior is computable (it is), but whether it is *provable within the agents' own formal system*. The barrier is proof-theoretic, not computability-theoretic. An oracle could tell the agents what to do; the agents cannot prove it to themselves.

  **Diagnosis 2: Incompleteness (Textbook Gödel)**
  *   **The Claim:** There are true statements that cannot be proven.
  *   **Why it fails:** This is too broad. Gödel I says there exists *some* unprovable truth. Löbian Coupling is more specific: it concerns the *provability of provability*. It is not just that "Cooperate" is unprovable; it is that the bridge from "Provable(Cooperate)" to "Cooperate" is blocked unless the specific modal structure of Löb's Theorem is satisfied. Standard incompleteness does not explain why two identical programs *can* cooperate (as they do in your second observation). If it were mere incompleteness, they should always fail to find the proof. The fact that they *sometimes* succeed (via Löb) distinguishes this from generic incompleteness.

  **Diagnosis 3: Predicting a More Capable System**
  *   **The Claim:** You can't trust a successor because it might be smarter than you.
  *   **Why it fails:** The blockage persists even when the successor is *weaker* or *identical*. In the Tiling Agents setup, the problem arises precisely when the successor is *logically equivalent*. If the successor were strictly weaker, $A$ *could* prove $B$'s soundness. The failure is not about capability gaps; it is about **logical strength**. A system cannot prove the soundness of a system with equal or greater logical strength. This is a property of the axioms, not the compute power.

  **Diagnosis 4: Coordination Failure / Multiple Equilibria**
  *   **The Claim:** This is just a game with bad Nash equilibria.
  *   **Why it fails:** In standard game theory, the equilibria exist independently of the agents' reasoning machinery. Here, the equilibrium *depends* on the reasoning machinery. If you change the formal system (e.g., from PA to PA+1), the equilibrium changes. If you change the proof bound, the equilibrium vanishes. This is not a selection problem among existing options; it is a **construction problem** where the options only exist if the logic permits them. Defect-Defect is not just a selected equilibrium; it is the default state of nature when the logical bridge cannot be built.

  ### 3. The Proof Bound Sensitivity

  You observed that cooperation vanishes if the proof search is bounded. This is the transition from **Logical Possibility** to **Computational Feasibility**.

  Löb's Theorem guarantees that a proof *exists*. It does not guarantee that the proof is short. In fact, the proof of cooperation in the code-swap game relies on the Fixed Point Lemma, which can generate proofs of immense length (tower-of-exponentials or worse).
  *   **Unbounded:** The proof exists. The agents find it. They cooperate.
  *   **Bounded:** The proof exists, but lies outside the search space. The agents return "No Proof Found." They defect.

  This is not a flaw in the logic; it is a feature of **Bounded Rationality**. The phenomenon survives only if the agents have sufficient computational resources to traverse the logical distance to the fixed point. This makes Löbian Coupling a hybrid of logic and complexity theory.

  ### 4. Boundary Cases

  Here is how the phenomenon behaves under your proposed variations.

  **Case A: Black-Box Inspection (Behavior only, no Source)**
  *   **Verdict:** The phenomenon **vanishes**.
  *   **Reason:** Löbian Coupling requires **White-Box Access**. The agents must reason about the *axioms* and *inference rules* of the counterpart, not just the input-output mapping. If I can only see that you output COOPERATE, I cannot prove *why*. I cannot establish the conditional "If I prove you cooperate, you cooperate." Without access to the source, the self-referential loop is broken. The game reduces to standard Prisoner's Dilemma.

  **Case B: Probabilistic Agents**
  *   **Verdict:** The phenomenon **vanishes** (in its current form).
  *   **Reason:** Löb's Theorem relies on the necessitation rule: If $\vdash P$, then $\vdash \square P$. Probability does not support this. If $P$ is 99% likely, it does not follow that "It is 99% likely that $P$ is 99% likely." The modal logic of probability (probabilistic logic) does not admit the same fixed-point theorems. You cannot construct a "Probabilistic Löb" that allows an agent to trust its own probabilistic estimates without risking inconsistency (the "Self-Trust Problem" in probabilistic logic). To recover cooperation, you need a different framework (e.g., Logical Induction), which is not yet fully solved for this specific game.

  **Case C: Correlated Randomness / Common Seed**
  *   **Verdict:** **Irrelevant** to the core phenomenon.
  *   **Reason:** Correlated randomness helps solve *coordination* problems (e.g., which equilibrium to pick). It does not help solve *verification* problems. Sharing a seed does not help Agent $A$ prove Agent $B$'s code is sound. The barrier is logical, not informational.

  **Case D: Syntactic Restrictions (Restricted Self-Trust)**
  *   **Verdict:** The phenomenon **persists but can be mitigated**.
  *   **Reason:** If you restrict the self-trust rule to a specific syntactic class (e.g., $\Pi_1$ sentences), you can sometimes evade the full force of Löb's Theorem. This is the basis of **Reflection Principles**. An agent can trust itself on specific classes of statements without becoming inconsistent. However, this limits the agent's ability to reason about its own general behavior. You buy safety at the cost of expressiveness. The coupling remains, but you can tune the strength of the link.

  ### 5. Definition and Demarcation

  Since no single established term unifies the game and the successor cases under the computational constraints you observed, here is the definition for **Löbian Coupling**:

  **Definition:**
  **Löbian Coupling** occurs when two or more reasoning agents (or sequential stages of one agent) determine their actions based on proofs within a shared formal system, such that:
  1.  **White-Box Dependency:** Each agent's decision function takes the other's source code (or axioms) as input.
  2.  **Provability Condition:** Actions are conditional on the *provability* of outcomes, not just the outcomes themselves.
  3.  **Reflective Barrier:** The system exhibits a phase transition where cooperation (or trust) is possible if and only if the formal system is strong enough to prove its own consistency conditions (via Löb's Theorem) *and* the computational resources are sufficient to find the resulting proofs.

  **Instances:**
  *   **Yes:** The code-swap Prisoner's Dilemma with proof-search agents.
  *   **Yes:** The Tiling Agents problem (parent verifying child).
  *   **Yes:** Quines that output each other's source code conditioned on logical equivalence.

  **Non-Instances:**
  *   **No:** Standard Nash Equilibrium (no proof search).
  *   **No:** Black-box simulation (no access to axioms).
  *   **No:** Probabilistic trust without logical guarantees.
  *   **No:** Simple recursion without provability checks (leads to infinite loops, not Löbian fixed points).

  **The Nearest Miss:**
  The concept you are most likely to conflate this with in future is **Common Knowledge**.
  *   **Distinction:** Common Knowledge assumes that "I know that you know that I know..." is already true. Löbian Coupling is the *mechanism by which agents construct* a form of common knowledge about their own behavior using formal proofs. Common Knowledge is a state; Löbian Coupling is the computational/logical process required to achieve that state in a system that cannot take its own soundness for granted.

  ### Summary
  You have discovered the operational limits of **Reflective Consistency**. The code-swap game and the successor problem are the same phenomenon: the difficulty of closing the loop between *truth* and *provability* in a system that must reason about itself. The proof bound sensitivity confirms that this is not merely abstract logic, but a resource-bounded computational constraint on agency.
