              *   *Tension:* If the Chinese leadership prioritized steel/exports over food *despite* signs, it looks like (2). (3) insists they didn't have the signs.
              *   *Audit Verdict:* Logically consistent, but empirically precarious. The "cost" is the burden of proof required to sustain (3) against evidence of local reporting that reached the center.

