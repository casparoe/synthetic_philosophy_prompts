      *   *Decision:* Stick to the standard interpretation that the AMD paradox relies on the *information set* containing multiple nodes. If the information set is a singleton (perfect indexical info), the paradox disappears. The "Causal Opacity" the user describes is essentially a description of being in a multi-node information set without knowing which one you are in. If you know which one you are in, the "opacity" regarding the pathway is resolved (because the node identity *is* the pathway history).
