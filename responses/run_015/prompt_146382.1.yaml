      *   *Key Insight:* The user's "Causal Opacity" sounds like they are describing the *consequence* of imperfect recall, not a separate variable. If I have perfect indexical info, I *can* observe the causal pathway (I know I'm at 1, so I know I didn't exit at 1). So the two are linked.
