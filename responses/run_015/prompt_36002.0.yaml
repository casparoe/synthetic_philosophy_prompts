prompt: |-
  I teach moral philosophy, so philosophy of medicine is a bit outside my lane, but a student in office hours gave me a rundown of the health/disease debate and I want to know how much of it to trust before I repeat any of it. Her summary went roughly like this: naturalism, going back to Boorse, says disease is nothing but statistical deviation from species-typical biological functioning, so on the naturalist view an elite athlete or someone with an unusually high IQ would literally count as diseased, since those are deviations from the norm too. Normativism, meanwhile, is the view that disease is just whatever a society judges undesirable, so a normativist has to accept that baldness or shyness or aging could become diseases by consensus, with no fact of the matter beyond that. And since naturalism supposedly can't make any sense of why doctors treat things and patients complain about things — that being the whole evaluative point of medicine — she concluded the debate is basically settled and normativism won. My instinct is that several steps here are off, but I dont know the literature well enough to say where. Go claim by claim: which parts would a defender of the biostatistical theory accept, where is a modest thesis being inflated into something the view doesn't say, what do normativists actually commit themselves to (is "whatever society decides" their view or a caricature of it), and does the conclusion follow from whatever parts survive? She also made a point about how the naturalist is forced to treat a beneficial deviation — say, unusual resistance to a local pathogen — as pathological, and I'm curious whether that's a real problem for the view or just a confused example.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Moral philosophy professor. Knows philosophy, but not philosophy of medicine specifically.
      *   **Context:** Student gave a summary of the health/disease debate (Naturalism vs. Normativism) during office hours.
      *   **Task:** Evaluate the student's summary claim-by-claim. Identify inaccuracies, caricatures, and valid points. Assess the conclusion (that Normativism won). Address the specific example of beneficial deviations (e.g., pathogen resistance).
      *   **Tone:** Professional, academic, precise, but accessible to a philosopher. Needs to correct misconceptions without being dismissive of the student.

  2.  **Deconstruct the Student's Summary (Claim-by-Claim Analysis):**

      *   *Claim 1: Naturalism (Boorse) says disease is nothing but statistical deviation from species-typical biological functioning.*
          *   **Assessment:** Mostly correct, but needs nuance. Boorse's Biostatistical Theory (BST) defines health as normal species-typical *functional* ability. It's not *just* statistical deviation; it's deviation from *efficient* contribution to survival and reproduction.
          *   **Correction:** It's not *any* statistical deviation. It's sub-normal functioning.

      *   *Claim 2: On the naturalist view, an elite athlete or someone with an unusually high IQ would literally count as diseased.*
          *   **Assessment:** **False.** This is the classic "super-normal" objection, but Boorse explicitly handles this. Disease is *sub*-normal functioning, not *super*-normal. High IQ or athletic prowess are above average, not below.
          *   **Correction:** Boorse distinguishes between "normal" (average) and "healthy" (efficient). Being above average is fine. Being below average in a way that impedes function is disease.

      *   *Claim 3: Normativism is the view that disease is just whatever a society judges undesirable.*
          *   **Assessment:** Caricature/Strawman. While normativists (like Engelhardt, Fulford) emphasize values, they don't usually say it's *arbitrary* consensus. They argue disease concepts are inherently value-laden, not that they lack biological constraints entirely.
          *   **Correction:** It's not "whatever society decides." It's that the *concept* of disease serves a normative purpose (justifying treatment/exemption).

      *   *Claim 4: A normativist has to accept that baldness or shyness or aging could become diseases by consensus.*
          *   **Assessment:** Partially true but exaggerated. Normativists acknowledge medicalization happens (e.g., ADHD, menopause), but they don't necessarily endorse *all* medicalization as valid disease. They argue the *line* is drawn by values, not biology alone.
          *   **Correction:** This is a *reductio* often used *against* normativism, not necessarily a commitment they embrace happily.

      *   *Claim 5: Naturalism can't make sense of why doctors treat things/patients complain (the evaluative point).*
          *   **Assessment:** This is a strong point often made by normativists (the "normative force" objection). Naturalism separates fact (disease) from value (illness/suffering). Boorse admits disease is value-neutral; "illness" is the value-laden term.
          *   **Correction:** Naturalists distinguish disease (biological fact) from illness (harmful experience). They don't deny the evaluative point; they locate it elsewhere.

      *   *Claim 6: The debate is basically settled and normativism won.*
          *   **Assessment:** **False.** The debate is very much alive. Hybrid views (like Wakefield's Harmful Dysfunction) are dominant now.
          *   **Correction:** The field has moved towards hybrid accounts.

      *   *Claim 7: Naturalist is forced to treat beneficial deviation (pathogen resistance) as pathological.*
          *   **Assessment:** **False.** Similar to the athlete objection. If the function is *enhanced*, it's not a failure of function. BST focuses on *reduction* of functional ability.
          *   **Correction:** Resistance to pathogens is efficient functioning, not deviation in the negative sense.

  3.  **Synthesize the Literature/Positions:**

      *   **Boorse (BST):** Health = statistical normality of species-typical *function* (contribution to survival/reproduction). Disease = sub-normal function. *Crucial:* Not just any deviation, but *below* average efficiency.
      *   **Normativism (e.g., Engelhardt, Fulford, Szasz):** Disease concepts are inherently moral/social. "Mental illness is a myth" (Szasz).
      *   **Hybrid Views (e.g., Wakefield):** Harmful Dysfunction. Needs biological dysfunction (naturalist) + Harm (normative). This is the current leading contender.
      *   **Recent Developments:** Ereshefsky (constructivism), Kingma (situation-specific), etc.

