      *   *Check:* Is the pathogen resistance example a problem? No, because that's *better* function, not *worse*.
      *   *Check:* Is Normativism truly "whatever society decides"? No, it's usually about the *warrant* for treatment. But the student's point about medicalization (baldness) is a standard critique of *weak* normativism or the consequences of the view.
