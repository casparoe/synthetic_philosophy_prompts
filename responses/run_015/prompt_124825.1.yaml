          1.  *Lethality of alternatives:* Acknowledge freezing/anoxia kill. We are choosing methods, not avoiding death.
          2.  *Research vs. Pest:* Distinguish based on purpose (knowledge creation vs. preservation failure) and agency (specimen is dead vs. active destruction).
          3.  *Replaceability:* Argue that replaceability doesn't equal disposability (educational continuity, waste).
      *   **Addressing the "Losing Side" (Strongest Counter-arguments):**
          *   *Petitioners:* Acknowledge the moral weight of "pest" labeling and sentience concerns.
          *   *Director/Donor:* Acknowledge the vital importance of the £1.2m.
