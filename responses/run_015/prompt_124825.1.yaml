          3.  Infested teaching material is replaceable, which might justify letting it be destroyed under the petitioners' own criteria.
      *   **Requirements:**
          *   Clear recommendation (Accept, Reject, or Accept with Conditions).
          *   Timetable.
          *   Reasons addressable by both petitioners and Director.
          *   Honest treatment of the strongest consideration on the losing side (donor money vs. petitioners' moral argument about "pests").
          *   British English.
          *   Under 700 words.

  2.  **Determine the Recommendation:**
