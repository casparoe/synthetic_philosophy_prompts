      **To:** Collections Care Committee
      **From:** Chair, Collections Care Committee
      **Date:** 24 May 2024
      **Subject:** Decision on Pest Management Policy and Bequest Condition

      **Recommendation**
      The Committee recommends accepting the Director's proposal to become 'chemical pesticide-free' within two years, conditional on the donor accepting nitrogen anoxia and freezing as compliant methods. Regarding the petition, we accept the ethical framework but reject the absolute prohibition on killing. We shall adopt a policy of 'Ethical Minimisation'.

      **Rationale**
      We face three specific difficulties requiring honest acknowledgement.

      First, non-chemical treatments are not non-lethal. Nitrogen anoxia requires two to three weeks of hypoxia, during which insects starve. Freezing causes cellular damage. We are not choosing between killing and sparing life, but between methods of killing. We must acknowledge that securing the collection entails mortality for invaders.

      Second, we must distinguish between research specimens and pests. The petition asks what distinguishes larvae eating the teaching collection from beetles we pin. The distinction lies in agency and purpose. Research specimens are sacrificed for knowledge creation under controlled conditions. Pest larvae destroy existing knowledge and infrastructure without consent. While both die, the former is curatorial intent; the latter is protective defence.

      Third, much infested teaching material is replaceable. Under the petition's criterion—protect only the irreplaceable—one might argue we should let these items perish. However, replaceability incurs financial cost, staff time, and educational disruption. Preservation remains preferable to replacement, even for duplicates.

      **Consideration of Competing Interests**
      The petitioners argue that the word 'pest' does moral work, framing insects as aggressors to license carelessness. This is a profound ethical point. Language shapes stewardship. We will adopt 'intruder' or 'threat' in internal documentation where possible to reflect that infestation is often a failure of our housing, not merely insect malice. However, we cannot prioritise individual insect welfare over the integrity of the national heritage held in trust.

      Conversely, the £1.2m bequest is vital. Rejecting the Director's proposal risks this funding. However, claiming to be 'pesticide-free' while starving insects via anoxia risks hypocrisy. We must be transparent with the donor that 'pesticide-free' means 'synthetic chemical-free', not 'non-lethal'.

      **Timetable**
      1.  **Months 1–6:** Audit current chemical stocks; phase out residual sprays.
      2.  **Months 7–18:** Install nitrogen anoxia chambers; train staff on freezing protocols.
      3.  **Months 19–24:** Final review and donor verification.

      **Conclusion**
      We secure the bequest without compromising scientific honesty. We honour the petitioners' ethical concerns without paralysing our duty to preserve.

      **Action Required**
      Vote to approve this memo as the Committee's formal response to the Director and the petitioners.

