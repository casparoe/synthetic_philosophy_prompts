  **Date:** 24 May 2024
  **Subject:** Decision on Pest Management Policy and Bequest Condition

  **Recommendation**
  The Committee recommends accepting the Director's proposal to become 'chemical pesticide-free' within two years, conditional on the donor accepting nitrogen anoxia and freezing as compliant methods. Regarding the petition, we accept the ethical framework but reject the absolute prohibition on killing. We shall adopt a policy of 'Ethical Minimisation'.

  **Operational Realities**
  We must confront three difficulties. First, non-chemical treatments are not non-lethal. Nitrogen anoxia requires two to three weeks of hypoxia, during which insects starve. Freezing causes cellular damage. We are choosing between methods of killing, not between killing and sparing life. Securing the collection entails mortality for invaders.

  Second, we must distinguish between research specimens and pests. The petition asks what distinguishes larvae eating the teaching collection from beetles we pin. The distinction lies in agency and purpose. Research specimens are sacrificed for knowledge creation under controlled conditions. Pest larvae destroy existing knowledge and infrastructure. While both die, the former is curatorial intent; the latter is protective defence.

  Third, much infested teaching material is replaceable. Under the petition's criterion—protect only the irreplaceable—one might argue we should let these items perish. However, replacement incurs financial cost, staff time, and educational disruption. Preservation remains preferable to replacement, even for duplicates.

  **Ethical Considerations**
  The petitioners' strongest argument is that the word 'pest' does moral work, framing insects as aggressors to license carelessness. This is profound. Language shapes stewardship. By labelling an insect a 'pest', we absolve ourselves of the housing failures that allowed infestation. We will adopt 'intruder' or 'threat' in internal documentation to reflect this. Furthermore, the petitioners rightly note that insect sentience is unsettled; we cannot claim our methods are painless. Their insistence on the 'least distressing method' is therefore valid.

  However, their absolute ban on killing is operationally impossible; we cannot hold collections in trust while allowing active destruction. On this specific point, their position is rejected, though their ethical vigilance remains adopted. We acknowledge the moral cost of starvation via anoxia and will prioritise rapid freezing where object safety permits.

  Conversely, the £1.2m bequest is vital. Rejecting the Director's proposal risks this funding. However, claiming to be 'pesticide-free' while starving insects via anoxia risks hypocrisy. We must be transparent with the donor that 'pesticide-free' means 'synthetic chemical-free', not 'non-lethal'.

