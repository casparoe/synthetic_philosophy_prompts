      *   *Better approach:* The prompt implies a conflict. The petition wants to stop killing. The Director wants to stop *chemicals*. Both involve killing. The "losing side" instruction suggests I should make a decision where one side doesn't get everything.
      *   *Decision:* I will recommend accepting the Director's goal (financial necessity) but modifying the petition's policy to be realistic (ethical minimisation). The "losing side" consideration should probably be the petitioners' absolute stance on killing, as the museum *must* kill pests to survive, even if non-chemically. Or, conversely, if I reject the chemical ban, I lose the money. Given the £1.2m, rejecting the Director is irresponsible. So the Director wins on the money, but the petitioners win on the ethical framework.
