answer: |-
  **Project Title:** The Arbitrary Boundary: Operational Vagueness and Institutional Ignorance in Automated Risk Systems

  **Research Question**
  Does the stability of a decision under varying admissible thresholds function as a practical analogue to semantic super-truth, or does the explicit arbitrariness of engineered cutoffs constitute a distinct category of ignorance that existing theories of vagueness cannot describe?

  **Context and Problem Statement**
  I own a risk-scoring pipeline that classifies payment transactions as accepted, declined, or escalated. The core logic relies on a single floating-point threshold, currently set at 0.73. This value is sharp, visible, and fixed in configuration. However, its justification is lost to staff turnover and temporal data drift. The boundary is epistemically transparent—we know exactly where it is—but normatively opaque. We cannot justify why 0.73 is preferable to 0.75, yet the system treats the difference as binary.

  To mitigate this, I implemented a "banding" workaround: rather than relying on the single 0.73 cutoff, the system evaluates transactions across a range of defensible thresholds. Cases where the verdict flips within this band are treated as unstable and escalated to human analysts. Structurally, this mirrors the supervaluationist approach to vagueness: a proposition is "super-true" if it holds across all admissible precisifications. In my system, a transaction is "definitely fraud" only if it exceeds the threshold across the entire band.

  This setup presents a philosophical puzzle. Standard debates on vagueness, such as the Sorites paradox, assume the boundary is hidden by language or usage. My system presents a reverse case: the boundary is explicit, but the *reason* for its location is missing. The ignorance has migrated from *where* the line is to *whether* the line should be there at all. Furthermore, because traffic distributions drift quarterly, the same fixed number picks out a different population over time, generating a Sorites series driven by environmental change rather than semantic ambiguity.

  **Critique of Existing Frameworks**
  Two dominant positions in the literature fail to fully capture this scenario.

  First, Epistemicism (associated with Timothy Williamson) posits that sharp boundaries exist but are unknowable due to the nature of language use. In my system, the boundary is known (0.73), but the *normative ground* for that boundary is unknowable. Epistemicism explains ignorance of the boundary's location; it does not explain ignorance of the boundary's justification.

  Second, Supervaluationism (associated with Kit Fine) treats vague statements as true if they remain true under all admissible precisifications. My banding strategy operationalizes this. However, Supervaluationism is a semantic theory regarding truth conditions. My system is a decision-theoretic mechanism regarding risk tolerance. If I treat "risk score > 0.73" as a predicate, it is not vague in the semantic sense; it is precise. The vagueness lies in the *value alignment* of that precision. Applying Supervaluationism here risks a category error: conflating semantic indeterminacy with operational arbitrariness.

  This project hypothesizes that high-stakes engineering environments generate a specific form of "Institutional Vagueness." This is not a property of language, but of system design where memory loss and environmental drift render precise tools functionally vague.

  **Methodology**
  Given proprietary constraints, I cannot publish transaction data or specific model weights. The research will be conceptual and structural, conducted over twelve months alongside my industry partner.

  1.  **Conceptual Mapping (Months 1–4):** I will study the primary texts on Epistemicism and Supervaluationism to rigorously define "admissible precisification." I will then map my engineering "band" against this definition. The goal is to determine if my band constitutes a set of semantic precisifications or a set of risk-tolerance parameters.
  2.  **Stability Analysis (Months 5–8):** I will analyze metadata regarding the "borderline" cases my system escalates. I cannot share the cases, but I can quantify the volatility. If the Supervaluation analogy holds, the rate of escalation should correlate with the width of the band in a predictable manner. If the analogy breaks, the volatility will appear random relative to the band width, suggesting the problem is noise, not vagueness.
  3.  **Synthesis (Months 9–12):** I will draft a paper proposing "Operational Vagueness" as a distinct philosophical category. The argument will focus on the migration of ignorance from location to justification.

  **Success and Failure Criteria**
  *Success:* The project produces a rigorous distinction between semantic vagueness and operational arbitrariness. A successful result demonstrates that stability across thresholds is a sufficient condition for decision confidence, even when semantic truth is undefined. This would provide a framework for other engineers to justify "banding" strategies not just as risk mitigation, but as philosophically sound responses to institutional ignorance.

  *Failure:* The project fails if my industry partner determines that the "banding" strategy is fully explained by standard decision theory (e.g., expected value maximization) without requiring philosophical vocabulary. If the analogy to Supervaluationism proves to be merely metaphorical—"rhyming" without structural identity—the project will conclude by documenting why philosophical frameworks should not be applied to engineered thresholds.

  **Feasibility and Conceptual Risks**
  I must offer an honest verdict on the scope. This project is feasible for one person without a philosophy degree, provided the focus remains on the *analogy* rather than attempting to solve the Sorites paradox itself. However, there are significant risks where my intuition likely outpaces my training.

  1.  **The Category Error:** I am likely conflating *epistemic uncertainty* (we don't know the right number) with *semantic vagueness* (there is no right number). A philosopher might argue that 0.73 is simply a decision rule, not a predicate, and therefore vagueness theories do not apply. I have flagged this in the proposal as a primary investigation point rather than assuming the analogy holds.
  2.  **Admissibility:** In Supervaluationism, "admissible precisifications" are constrained by meaning. In my system, the "band" is constrained by business risk tolerance. These are different constraints. If I treat them as equivalent, the comparison collapses. I will rely on my industry partner to correct this definition during our sessions.
  3.  **Scope:** The temporal wrinkle (data drift) adds complexity that might be too large for a year. I will prioritize the static analysis of the threshold first; the temporal element will be treated as a secondary complication only if the static model holds.

  **Conclusion**
  This project uses a concrete engineering failure—the unjustified 0.73 threshold—as a test case for theories of vagueness. It does not seek to import philosophy into engineering to fix the code, but to use engineering to stress-test the philosophy. By isolating a scenario where sharp boundaries are known but unjustified, we can evaluate whether current theories of vagueness account for ignorance generated by institutional decay rather than linguistic limits. The outcome will either validate "banding" as a philosophical solution to operational vagueness or delineate the boundary where philosophical analogies cease to be useful tools for engineers.
