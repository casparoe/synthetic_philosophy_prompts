answer: |-
  ### On Form as Argument: A Brief Prelude

  Before we arrive at the poem, consider the architecture of the sestina. It is a recursive form, is it not? Six stanzas, six end-words that rotate in a fixed pattern, never allowing the reader to settle, never allowing the language to rest in the same place twice. Yet, no matter how far the words travel, they must always return. They are trapped by the structure, much like the mind is trapped by its own perceptions.

  This mirrors Berkeley's master argument precisely. You attempt to step outside the circle of perception to imagine an unperceived object, but the act of imagination is itself a perception. The form of the poem should feel like that trap snapping shut. Every time the word "nothing" arrives at the end of a line, it attempts to signify a void, an absence. But by placing it at the end of a line, we give it weight, rhythm, and presence. We force the reader to perceive the "nothing". The form enacts the philosophy: you cannot speak of absence without making it present.

  In the envoi, the three-line conclusion, we must resolve the tension. Berkeley argues that the *esse* (existence) is *percipi* (to be perceived). The mind and the eye cannot be separated in the act of knowing. So, in those final three lines, I shall bind "mind" and "eye" together physically on the page, inseparable, just as the philosopher claims they are in reality.

  ***

  ### The Unperceived Garden

  You stand before the solitary **tree**,
  And claim it grows within an empty **garden**.
  You shut your tight and sceptical **eye**,
  To see the leaves dissolve into the **dark**.
  You try to clear the contents of your **mind**,
  And swear there stands absolutely **nothing**.

  But in that void, you conjure up **nothing**,
  Which blooms again into the phantom **tree**.
  For who is there to witness but the **mind**?
  You cannot walk outside this locked **garden**.
  The shadows lengthen in the objective **dark**,
  Yet still they fall beneath some watching **eye**.

  There is no view without a viewing **eye**,
  To name the void and call it **nothing**.
  Even the shadows need a bit of **dark**,
  To cast a shape against the bark of **tree**.
  You pace the walls within your private **mind**,
  And trace the boundaries of this **garden**.

  Who tends the plots inside this **garden**?
  No agent acts without a purpose **mind**,
  No root grows deep without a seeking **eye**.
  You try to summon pure and empty **nothing**,
  But presence clings like ivy to the **tree**,
  And light refuses to surrender **dark**.

  You cannot think away the **dark**,
  For thought itself provides a lighting **eye**.
  You wander lost within the **garden**,
  Seeking a silence for the humming **mind**.
  You reach for absence, grasp at **nothing**,
  And find the solid weight of being **tree**.

  It is the structure of the **mind**,
  That banishes the absolute **dark**.
  You are entangled with the **tree**,
  Bound by the network of the **eye**.
  There is no exit from the **garden**,
  No place to put the word called **nothing**.

  No **mind** **eye** separates from what it knows,
  The **garden** sleeps within the **dark** of thought,
  Where **tree** remains, there is no **nothing** left.
