answer: |-
  ### Seminar Prep Sheet: The Chain-Rescue Model

  **Strategy Note:** Your audience is split between *ideal theorists* (who want to know why individuals are doing the state's job) and *empiricists* (who want to know if the money actually helps). Your defense rests on **Non-Ideal Theory**: you are not describing a just world, but prescribing action in an unjust one.

  #### 1. The Upfront Concession
  **Concede:** The "Division of Moral Labor."
  **Script:** "I want to start by conceding a point I know is on everyone's mind: In a fully just basic structure, these obligations would be discharged collectively through taxation and state policy. Individual direct duty is a second-best solution. However, we do not live in a Rawlsian well-ordered society. We live in one where the causal chains of harm are active *now*, and the institutional remedies are too slow. My argument is not that individuals *should* replace states permanently, but that when the state fails to interrupt a lethal causal chain, the moral current defaults to the nearest capable agent."

  ---

  #### 2. Q&A Objection Map (Ordered by Damage)

  | Objection | Vocabulary They'll Use | Damage Level | 2-Minute Reply | The Soft Spot (Where you might wobble) |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. The Domestic Analogy** (The "Prayer Question") | *Consistency, Proximity, Fungibility, Marginal Utility* | **Critical** | "The obligation isn't just about rescue; it's about **rectification**. The causal chain I'm tracing links wealthy emissions to specific climate displacement. The 'wire' carries both aid and responsibility. Domestic poverty, while tragic, often lacks that specific transnational causal link to the donor's carbon footprint. I am arguing for a duty of *compensation* via rescue, not general beneficence. The chain is short domestically, but the causal liability is weaker." | **Causality vs. Need:** If they press that *need* trumps *causality* (a utilitarian move), you lose the distinction. You must hold the line that climate harm creates a special duty that general poverty does not. |
  | **2. The Institutional Bypass** | *Basic Structure, Division of Moral Labor, Legitimacy, Political Agency* | **High** | "This assumes the state is a viable conduit. When institutions are gridlocked or captured by fossil capital, insisting on 'political only' action is a form of moral paralysis. My model treats NGOs and banks not as replacements for the state, but as **emergency shunts**. We don't refuse to put out a fire because the fire department *should* be here. We preserve the possibility of future justice by preventing existential loss now." | **Long-term Legitimacy:** They will argue that private aid lets politicians off the hook permanently. You need evidence that private aid pressures states rather than absolving them. |
  | **3. Moral Hazard & Capacity** | *Crowding Out, Fungibility, State Capacity, Perverse Incentives* | **High** | "This is the economists' worry: that free money makes states lazy. But we are talking about **adaptation**, not development. Adaptation is about survival against external shocks (sea-level rise, drought) that overwhelm even competent states. Funding a sea wall doesn't reduce a government's incentive to tax; it prevents the government from ceasing to exist. We aren't crowding out capacity; we are preventing capacity from going underwater." | **Fungibility:** If money is fungible, a government *could* theoretically reallocate their own budget away from adaptation because you paid for it. You need to admit this risk but argue survival trumps it. |
  | **4. Epistemic Opacity (The "Noise")** | *Information Asymmetry, Principal-Agent Problem, Overhead, Leakage* | **Medium** | "Singer's original case assumed a binary outcome: save or drown. Critics say the 'wire' of aid has too much resistance (corruption, waste). But effective altruism data shows we can measure fidelity. If an intermediary has a proven track record of high-fidelity delivery, the 'noise' is quantifiable. We don't reject electricity because some wires lose heat; we engineer better wires. We fund the high-fidelity conduits." | **Measurement:** You are relying on data that is often imperfect. If they hammer you on specific metrics of "fidelity" in conflict zones, you may lack granular data. |
  | **5. Psychological Realism** | *Demandingness, Overload, Burnout, Motivational Internalism* | **Low** | "I am not arguing that everyone must bankrupt themselves. I am arguing that the *limit* of obligation is higher than we think, provided the chain is reliable. If the signal is clear and the need is existential, 'I didn't want to think about it' is not a moral shield. We accept high demands in other causal chains (e.g., paying taxes, parenting). Why is global rescue different?" | **The Limit:** They will ask "Where does it stop?" If you can't define a cutoff point, the theory looks self-defeating. |

  ---

  #### 3. The "Prayer Question" Strategy
  **The Question:** *"If the causal chain to domestic poverty is just as short and high-fidelity (e.g., local shelters), does your model imply you are equally obligated to solve homelessness in your own city as you are to fund climate adaptation abroad?"*

  **Why it's dangerous:** It forces you to choose between **Consistency** (Yes, which makes you look radically demanding/implausible) or **Arbitrariness** (No, which undermines the "distance doesn't matter" premise).

  **Defense Protocol:**
  1.  **Do not deny the domestic obligation.** (You will look callous).
  2.  **Pivot to "Causal Liability."** Reiterate that your paper is about *climate* displacement. The duty stems from the harm caused (emissions), not just the capacity to help.
  3.  **The "Triage" Move:** "If I had to choose between a victim of my own carbon emissions abroad and a victim of local structural inequality, the causal link prioritizes the former. However, in practice, we have obligations to both. My paper isolates the climate chain to show that distance is not a valid excuse for ignoring *that specific* chain."
  4.  **If they press:** Concede that a full moral theory would require addressing both, but this paper is a *partial* theory of climate obligation. Don't let them expand the scope of the paper beyond what you can defend.

  ---

  #### 4. Final Tactical Notes
  *   **Watch the Economists:** They will nod at "moral hazard" but worry about "market distortion." Use their language. Talk about "efficient allocation of risk."
  *   **Watch the Theorists:** They will worry about "privatizing justice." Keep emphasizing that this is a *stopgap*, not a *system*.
  *   **The "Wire" Metaphor:** Be careful not to make the wire sound *too* perfect. Admit there is resistance (overhead), but argue it is *less* resistance than the political gridlock alternative.

  **Typo Note:** You mentioned a probable typo in your framing ("probaly"). If you mean the "chain-rescue" terminology, don't worry—the metaphor is intuitive enough that they will grasp it immediately. If you mean a typo in the paper text, correct it silently if noticed, but don't draw attention to it. The argument holds.
