      *   *Holism Pushback:* This is a classic objection to Quine. If the "web of belief" is holistic, why draw a sharp line between "cognitive/scientific" and "non-cognitive/ethical"? Quine does draw this line (Hume's fork essentially), but the user is right to press him on *why* based on his own holism.
