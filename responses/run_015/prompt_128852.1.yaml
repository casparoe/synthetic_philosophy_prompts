  hey so im in this phil of science seminar and i drafted a short essay on quine's moral antirealism and im not sure if im forcing the argument. heres the basic idea: quine says moral vocabulary isnt part of our serious ontology because it doesnt do explanatory work in our best scientific theories. but i want to push back using his own holism—if beliefs face the tribunal of experience as a web, and we revise theoretical sentences all over the place, then why are moral sentences automatically outside the web? specifically, i suggest we treat normative claims not as describing "moral properties" but as part of a regulatory framework for social coordination, kind of like how we treat logical rules or theoretical posits that organize observation rather than mirroring it. then i wonder if quine's well-known rejection of quantified modal logic is secretly doing the heavy lifting—he rejects de re modality, so he cant make sense of "necessarily good," but that only undermines essentialist moral claims, not contingent ones embedded in our social theory. am i smuggling cognitivism back in with the "regulatory framework" move? and is the modal logic connection a real tension or just something i made up to sound clever? also where is the reasoning weakest—probably where i say social coordination needs moral talk in the same way physics needs electrons?

  can you comment on accuracy, whether the regulatory idea actually fits quine's naturalism, and whether the modal logic point is fair? i dont need citations just tell me if the structure holds.
