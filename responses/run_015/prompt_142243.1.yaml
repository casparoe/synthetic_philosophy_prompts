answer: |-
  # JOINT STATEMENT ON THE CAUSAL EXCLUSION ARGUMENT
  **Reading Group: Spring Term**
  **Signatories:** Dev, Nina
  **Recorder:** [User]

  ## PREAMBLE: THE MIRA CASE
  We agree to use the following scenario as the fixed reference point for our disagreement, while noting specific points of underspecification that must be resolved in future testing.

  **The Case:** Mira decides whether to sign a petition. She has an occurrent desire to sign ($M$), which on this occasion is realized by neural state $P$. $P$ is causally sufficient, in the circumstances, for her hand moving in the signing way ($E$). This production involves no further mental state. There is no separate, independent cause of $E$ waiting to create overdetermination.

  **Underspecification Notes:**
  1.  **Counterfactual Stability:** The case does not specify whether $M$ would persist if $P$ were slightly different (i.e., is $M$ multiply realizable in the *nearest possible worlds* where $P$ varies?).
  2.  **Granularity of $P$:** The case does not specify whether $P$ is the *minimal* physical sufficient condition or a maximal state including irrelevant physical details.
  3.  **Content Dependence:** The case does not specify whether the causal efficacy of $P$ depends on its semantic content or only its syntactic/physical structure.

  ---

  ## SECTION I: JOINT COMMITMENTS
  *We, the undersigned, affirm the following claims as the common ground of our discussion. We accept these as constraints on any acceptable solution to the exclusion problem.*

  1.  **Physical Causal Closure:** Every physical effect that has a cause has a sufficient physical cause at the time it occurs. We reject any view that requires physical effects to be caused by non-physical substances or forces that violate physical conservation laws.
  2.  **No Systematic Overdetermination:** The relation between $M$ and $P$ is not analogous to two assassins shooting a victim simultaneously. We reject the hypothesis that $E$ is systematically caused twice over by independent sufficient causes.
  3.  **Property Distinctness:** Mental properties ($M$) and physical properties ($P$) are distinct properties, even if they are instantiated by the same event or substance. We reject type-identity theory.
  4.  **Non-Epiphenomenalism:** Mental properties are not causally inert in the sense of making no difference to the world. A world where Mira lacks $M$ (and consequently lacks the realizing $P$) is a world where $E$ does not occur.
  5.  **Explanatory Indispensability:** Causal explanations citing $M$ are indispensable for intelligibility, prediction, and planning. A worldview that renders "Mira signed because she wanted to" strictly false or misleading is unacceptable.
  6.  **The Stakes:** The resolution of this dispute must preserve the core intuitions regarding agency and moral responsibility. If the view implies Mira is not the agent of her action, it has failed.

  ---

  ## SECTION II: MAP OF RESIDUAL DISAGREEMENT
  *We disagree on the metaphysical interpretation of the commitments above. The following table maps the divergence. Each row presents a single issue; Column A states the position held by the signer; Column B states how the other signer interprets that position.*

  | Issue | Dev's Position (As stated by Dev) | Nina's Restatement of Dev's Position |
  | :--- | :--- | :--- |
  | **1. The Causal Relation** | $M$ causes $E$ in the same robust, metaphysical sense that $P$ causes $E$. Causation is a pluralistic or difference-making relation that allows multiple sufficient descriptions of the same causal link. | Dev treats causal *explanation* as identical to causal *production*. He conflates the truth of the sentence "$M$ caused $E$" with the metaphysical mechanism that produces $E$. |
  | **2. The Exclusion Principle** | The principle "If $P$ is sufficient for $E$, no distinct $M$ causes $E$" is false. It relies on a zero-sum conception of causal power that does not apply to realized properties. | The principle is true, but $M$ does not compete with $P$. $M$ causes $E$ only in virtue of $P$ causing $E$. Dev denies the "in virtue of" hierarchy. |
  | **3. Pragmatics vs. Metaphysics** | The "interest-relative" nature of causation is a feature of causation itself, not just our talk about it. There is no "metaphysical remainder" once difference-making and counterfactuals are accounted for. | The interest-relativity is pragmatic. It explains why we *cite* $M$, but it does not vindicate $M$ as a fundamental ontological contributor to the production of $E$. |

  | Issue | Nina's Position (As stated by Nina) | Dev's Restatement of Nina's Position |
  | :--- | :--- | :--- |
  | **1. The Causal Relation** | $P$ is the producer of $E$. $M$ is a cause only in a derivative, inheritance sense. The causal "work" is done at the physical level. | Nina is a covert epiphenomenalist. She grants $M$ a shadow status that saves the language of causation but drains it of any actual power to make a difference. |
  | **2. The Exclusion Principle** | Exclusion is a constraint on *competing* causes. Since $M$ and $P$ do not compete (one realizes the other), $M$ can be a cause without violating closure, but only via $P$. | Nina accepts a "single-relation, all-or-nothing" picture of causation. She posits a mysterious "in virtue of" relation to avoid eliminating $M$, which is ontologically idle. |
  | **3. Pragmatics vs. Metaphysics** | We must distinguish between what *makes* something happen (metaphysics) and how we *track* what happens (epistemology/pragmatics). $M$ belongs to the latter. | Dev believes Nina is drawing a distinction without a difference. If $M$ tracks the effect perfectly and is indispensable for explanation, calling it "merely pragmatic" is a verbal maneuver to protect a physicalist intuition. |

  ---

  ## SECTION III: CRUCES AND PREDICTIONS
  *To move forward, we identify three sub-questions (Cruxes). For each, we specify a test case or argument. We record our predictions in advance to prevent reinterpretation of results.*

  ### Crux 1: Proportionality and Granularity
  **The Question:** If causation requires the cause to be proportional to the effect (neither too specific nor too general), does $P$ or $M$ better satisfy this constraint?
  **The Test:** Consider a set of nearest possible worlds where Mira's neural state varies slightly ($P_1, P_2, P_3$) but her desire remains constant ($M$), and the signing occurs ($E$) in all cases. Conversely, consider worlds where $M$ varies slightly but $P$ is held fixed (if coherent).
  **Underspecification Resolution:** We stipulate $M$ is multiply realizable in these nearest worlds.

  *   **Dev's Prediction:** $M$ is the proportional cause. $P$ is too specific (micro-details of the neuron firing don't matter for the signing). Therefore, $M$ is the *better* cause, and $P$'s causal status is derivative on its realizing $M$-type patterns.
  *   **Nina's Prediction:** $P$ (or a slightly generalized physical type $P_{type}$) is the cause. $M$ is merely a label for the disjunction of $P_1, P_2, P_3$. The stability of $E$ across $P$-variations is a physical fact about the disjunction, not evidence of $M$'s independent causal power.

  ### Crux 2: Independent Intervention
  **The Question:** Can we make sense of an intervention on $M$ that is not simultaneously an intervention on $P$?
  **The Test:** A "Multiple Realizability Intervention." We manipulate the system to ensure $M$ is present. In World 1, we induce $M$ via $P$. In World 2, we induce $M$ via $P^*$ (a distinct physical realizer). We observe if $E$ follows in both.
  **Note:** Nina claims intervening on $M$ while holding $P$ fixed is incoherent. Dev claims this shows interventionism is too narrow.

  *   **Dev's Prediction:** The causal link holds between $M$ and $E$ across both worlds. The intervention on $M$ (regardless of physical implementation) predicts $E$. This confirms $M$ is the causal variable.
  *   **Nina's Prediction:** In World 1, $P$ causes $E$. In World 2, $P^*$ causes $E$. There is no single variable "$M$" being intervened upon; there are only two distinct physical interventions ($P$ and $P^*$) that happen to share a description. The commonality is explanatory, not causal.

  ### Crux 3: The CS Postdoc's Twin Case (Content vs. Vehicle)
  **The Question:** Does the causal work track the physical vehicle or the mental content?
  **The Test:** Consider a molecule-for-molecule duplicate of Mira (Twin-Mira). Twin-Mira is in a physical state $P_{twin}$ identical to $P$. However, due to externalist factors (e.g., environment history), $P_{twin}$ has no semantic content (or different content) and thus does not instantiate $M$. Twin-Mira's hand moves in the signing way ($E_{twin}$).
  **Note:** We acknowledge this case was initially unpopular, but it isolates the contribution of the *mental property* specifically.

  *   **Dev's Prediction:** If $E_{twin}$ occurs without $M$, then $M$ was not necessary for $E$ in the original case either, *unless* we admit that intrinsic duplicates must share mental properties (internalism). If we accept externalism, Dev predicts that $M$ (as an externalist property) cannot be the cause of the local muscular movement $E$. *Correction:* Dev must argue that if $M$ is externalist, it cannot cause local $E$. If Dev holds $M$ causes $E$, Dev must predict Twin-Mira does *not* sign, or that Twin-Mira has a different mental state $M_{twin}$ that also causes signing.
      *   *Refined Dev Prediction:* Twin-Mira has a different mental state $M_{twin}$ (due to environment). $M_{twin}$ causes $E_{twin}$. The causal power tracks the *type* of mental state, even if the content differs. If $P$ has *no* content, $E$ does not occur (rejecting the zombie premise).
  *   **Nina's Prediction:** $P_{twin}$ causes $E_{twin}$ regardless of content. The physical vehicle does all the work. The absence of $M$ (content) in the twin is irrelevant to the production of the movement. This proves $P$ is the cause, and $M$ is merely a property that $P$ happens to have in the actual world but is not required for the causal production of $E$.

  ---

  ## SECTION IV: NOTE ON VERBAL DISPUTES
  *We flag the following terminological issues that may be obscuring substantive agreement.*

  1.  **"Cause" vs. "Causal Explanation":**
      *   **Diagnosis:** Dev uses "cause" to mean "variable in a true counterfactual dependency relation." Nina uses "cause" to mean "ontological producer of physical force/energy."
      *   **Residual Substantive Dispute:** Even if we distinguish these terms, we disagree on whether the "counterfactual dependency" relation is sufficient for *agency*. If Nina admits $M$ is a "cause*" (explanatory) but not a "cause**" (metaphysical), does Mira retain moral responsibility? Dev says yes; Nina must confirm that "causal*" status is sufficient for responsibility.

  2.  **"Distinct" Properties:**
      *   **Diagnosis:** We agree $M$ and $P$ are distinct concepts. We may disagree on whether they are distinct *existents*.
      *   **Residual Substantive Dispute:** Nina leans toward $M$ being a "way $P$ is." Dev leans toward $M$ being a property in its own right that supervenes on $P$. This affects whether $M$ can enter into causal laws independently.

  3.  **"Sufficient":**
      *   **Diagnosis:** Nina treats $P$'s sufficiency as "closing the door" on other causes. Dev treats $P$'s sufficiency as "guaranteeing the effect" without closing the door on other descriptions of the same cause.
      *   **Resolution Path:** We must agree on whether sufficiency is *exclusive*. If $P$ is sufficient, is there *room* for $M$? Nina says no room for a second producer. Dev says the room was never empty to begin with; $M$ and $P$ occupy the same space.

  **Action Item for Next Term:** We will run the **Proportionality Test (Crux 1)** first, as it requires the least controversial metaphysical commitments regarding content and intervention. We will define "minimal sufficient physical condition" precisely before applying it to the Mira case.
