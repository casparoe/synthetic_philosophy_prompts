answer: |-
  You have put your finger on the single most persistent and damaging objection to deflationism. You are not imagining it, and you are not missing a subtlety: this is the central battleground in the philosophy of truth over the last thirty years.

  To answer your primary question: **Yes, this has established names, but they name the *objection* rather than the *move*.** The move itself is usually described by deflationists as **"generalization"** and by their critics as **"explanatory parasitism"** or **"stealth inflationism."**

  Here is the breakdown of the phenomenon, the names, the legitimacy of the move, and the analogies you spotted.

  ### 1. The Names and The Structure

  The phenomenon you are describing is collectively known as **The Explanatory Challenge to Deflationism.**

  It is usually split into two specific arguments, corresponding to your two cases:

  *   **Case 1 (Bridges and Probes):** This is **The Success Argument.** (Associated with Hilary Putnam and Michael Williams). The argument is: "The only thing that explains the instrumental success of our actions based on belief is the truth of those beliefs." If deflationism says truth is just a logical device, it cannot explain why true beliefs succeed where false ones fail.
  *   **Case 2 (Steering Right):** This is **The Normativity/Value Argument.** (Associated with Marian David and Linda Zagzebski). The argument is: "Truth is the aim of belief." If truth is weightless, why is it better to have a true belief than a comforting false one?

  **Is it one phenomenon or two?**
  Structurally, it is **one phenomenon**: the demand for **Explanatory Power.**
  Functionally, it is **two**: one is *empirical/causal* (why did the bridge stand?), and one is *normative/pragmatic* (why should I seek truth?). However, deflationists usually try to solve both with the same tool: showing that the "work" is being done by the *content* of the belief, not the *property* of truth.

  ### 2. The Deflationist Defense: "Paying the Debt"

  You asked: *Is the borrowing illegitimate, or can a thin notion legitimately carry explanatory weight?*

  The deflationist (e.g., Paul Horwich, Michael Lynch in his earlier work) argues the borrowing is **legitimate**, but only if you understand the mechanics of the "loan."

  **The Deflationist Claim:**
  They argue they are not using "truth" as a *cause*. They are using it as a **logical quantifier.**
  *   **Inflationary sentence:** "True theories succeed because truth corresponds to reality." (Truth is the engine).
  *   **Deflationary sentence:** "True theories succeed" is just shorthand for "For any proposition $p$, if we believe $p$ and $p$ is the case, our actions based on $p$ will succeed."

  **How they claim to pay the debt:**
  They claim the explanatory weight is carried by the **worldly facts**, not the truth property.
  *   *Example:* Why did the bridge stand?
      *   *Inflationist:* Because our engineering theory was *True* (a robust relation to reality).
      *   *Deflationist:* Because the bridge was built according to plan $X$, and the physical world is such that plan $X$ results in a standing bridge. The word "true" just allows us to generalize over all plans $X, Y, Z...$ without listing them.

  **The Critic's Counter-Objection:**
  Critics (like Putnam or Lynch in his later work) argue this is **sleight of hand.**
  They say: "You say the work is done by the 'physical world being such that...' But that phrase *is* a correspondence theory! You are smuggling in the robust relation you claimed to delete."

  If the deflationist cannot cash out "the world is such that..." without eventually relying on a substantive relation of reference or correspondence, they are guilty of **Cryptonormativity** (hiding the norm) or **Stealth Inflationism.**

  ### 3. Quasi-Realism: Is it the same shape?

  You spotted this correctly. **Quasi-Realism** (developed by Simon Blackburn) is the *exact same structural move*, applied to ethics.

  *   **The Setup:** The Quasi-Realist says moral statements ("Murder is wrong") don't describe objective facts (Anti-Realism). They express attitudes.
  *   **The Problem:** We talk *as if* they are facts ("It is true that murder is wrong," "I discovered I was mistaken").
  *   **The Move:** The Quasi-Realist tries to **earn the right** to use realist-sounding language without accepting realist ontology. They want to explain why we *project* objectivity onto our values.

  **The Difference:**
  *   **Quasi-Realism** admits the discourse *looks* realist and tries to justify why we are allowed to talk that way despite the underlying anti-realism. It is self-conscious about the "borrowing."
  *   **Deflationism** often claims the discourse *was never realist to begin with*, so there is no debt to pay.

  However, many critics argue that successful Quasi-Realism collapses into a form of Realism, just as successful Deflationism collapses into Inflationism. If you have to work that hard to explain why "truth" behaves like a robust property, maybe it *is* a robust property.

  ### 4. The Causation Analogy

  You asked: *Someone says "cause" is only a way of talking about patterns of events, then explains why you should intervene on this variable rather than that one by saying this is the real cause. Same pattern?*

  **Yes. This is the Humean Problem.**

  *   **The Deflation:** Humeans say "causation" is just "constant conjunction" (Event A is always followed by Event B). There is no "necessary connection" or "causal glue."
  *   **The Reload:** When explaining why we intervene, they say "Because A *causes* B."
  *   **The Tension:** If causation is just a pattern, why does manipulating the pattern change the outcome? The explanation of *intervention* seems to require a "thick" notion of causation (powers, mechanisms) that the "thin" notion (regularity) denied.

  This is often called **The Problem of Causal Efficacy** in Humean metaphysics. It is the exact same "weightless concept doing heavy lifting" structure.

  ### 5. Where are the edges? (Legitimacy vs. Fraud)

  You asked for the edges: *When does the debt count as paid?*

  **The Legitimate Edge:**
  The debt is paid if the explanation can be **fully reduced** to non-truth-theoretic terms without loss of meaning.
  *   *Test:* Can you rewrite the sentence "True beliefs lead to success" entirely without using the word "true" or synonyms like "accurate," "corresponds," or "matches," and still explain the success?
  *   *Deflationist attempt:* "Beliefs that $p$ lead to success when $p$."
  *   *Critic response:* This explains *that* they succeed, but not *why*. The "why" requires a link between the mind and the world. If the deflationist admits that link is substantive, they lose deflationism. If they deny it, they lose the explanation.

  **The Illegitimate Edge (Rhetorical vs. Load-Bearing):**
  *   **Rhetorical:** Using "truth" to motivate ("Seek the truth!") is generally allowed for deflationists as an expressive command.
  *   **Load-Bearing:** Using "truth" in a causal explanation ("The truth of the theory caused the probe to arrive") is where the line is drawn.
  *   **The Chain Problem:** You asked if passing the debt down a chain counts. If Truth leans on Correspondence, which leans on Reference, which leans on Causation...
      *   If the bottom of the chain (Causation/Reference) is **naturalized** (explained by physics/biology), the deflationist might survive.
      *   If the bottom of the chain is **mysterious** or **semantic**, the deflationist is just pushing the buck. This is often called **"Buck-Passing without a Receiver."**

  ### Summary for your Margins

  Since you write technical documentation, here is the analogy that might stick:

  *   **Inflationism:** "Truth" is a **Class Object**. It has properties, methods, and memory allocation. It does work in the system.
  *   **Deflationism:** "Truth" is a **Macro** or an **Alias**. It is a text-substitution tool. It should vanish upon compilation.
  *   **The Objection:** You are compiling the code and finding that the system relies on the Macro *existing as an object* at runtime to function.
  *   **The Deflationist Reply:** "No, if you expand the macro, you'll see the underlying code does the work."
  *   **The Critic Reply:** "I expanded the macro. The underlying code says `if (world_matches_belief)`. You deleted `world_matches_belief` in Chapter 1. You can't have it back in Chapter 3."

  **The Label:** If you need a single phrase to tag this in your notes, call it **"The Explanatory Objection to Deflationism"** or **"The Problem of Explanatory Idle."**

  **The Verdict:** Most contemporary philosophers agree with your intuition. Pure deflationism is widely considered untenable precisely because of the move you identified. Most have shifted to **"Moderate Deflationism"** or **"Functionalist Theories of Truth"** (like Lynch's "Truth as Multiple Realizability"), which admit that while truth might not be *one* substantive property, it plays a substantive *functional role* that requires more weight than the early deflationists allowed. They admit the debt must be paid, and they try to pay it with functional currency rather than metaphysical currency.
