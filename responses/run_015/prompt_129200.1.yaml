  **MEMORANDUM**

  **TO:** Principal Investigator, Neuroscience Research Group
  **FROM:** Institutional Animal Care and Use Committee (IACUC)
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #23-NC-09: Thermal Stress Learning in Decapod Crustaceans

  **1. EXECUTIVE SUMMARY**

  The Committee has reviewed the proposal to utilize decapod crustaceans in a learning protocol involving brief thermal stress. The central ethical contention concerns the applicability of vertebrate-level safeguards to invertebrate models. The proposing team argues for a "welfare-weighting framework" based on gradated sentience, suggesting safeguards should be proportional rather than qualitative. Opposing Committee members argue that scalar moral status generates categorical obligations regarding valenced experience.

  After deliberation, the Committee **requires full vertebrate-equivalent review** for this protocol. We are not rejecting the study outright, nor are we approving it under the proposed diluted safeguards. Instead, the study must undergo the same rigorous justification process (Replacement, Reduction, Refinement) required for vertebrate subjects. This decision rests on the conclusion that while sentience may be scalar, the moral obligations triggered by the capacity for valenced experience are categorical.

  **2. ETHICAL ANALYSIS AND RATIONALE**

  **2.1. The Nature of Sentience and Safeguards**
  The proposing team posits that because sentience is gradated rather than binary, safeguards should be similarly scaled (i.e., "proportionally reduced"). The Committee rejects the inference that scalar capacity necessitates scalar protection.

  We distinguish between *capacity* (the intensity or complexity of experience) and *threshold* (the presence of valenced experience). Current ethological and neurobiological evidence suggests decapods possess integrated nociception and exhibit trade-off behaviors indicative of negative valence (e.g., sacrificing shelter for pain relief). Once an organism crosses the threshold of having "something it is like to be" that organism—specifically regarding suffering—the obligation to prevent unnecessary harm becomes categorical.

  Therefore, while the *methods* of assessment may differ due to physiology, the *obligation* to minimize suffering is not a matter of degree. A categorical prohibition on unnecessary pain applies to any entity capable of experiencing pain, regardless of whether that experience is "less complex" than a rodent's. To dilute safeguards based on assumed lesser sentience risks violating the precautionary principle.

  **2.2. Engagement with the Thermostat Analogy**
  The proposal analogizes extreme gradation to a thermostat's feedback loop, assigning it "negligible but non-zero moral weight." The Committee has engaged seriously with this analogy but finds it constitutes a category error.

  A thermostat operates on negative feedback mechanisms to maintain a set point. However, moral weight is not derived from feedback loops or homeostatic regulation; it is derived from *phenomenology*—the subjective experience of that regulation being thwarted. A thermostat does not "mind" being hot; a crustacean, evidence suggests, may.
  *   **Feedback:** Both thermostats and crustaceans withdraw from heat.
  *   **Valence:** Only the crustacean exhibits long-term behavioral changes, protective grooming, and trade-off decisions suggesting the heat is *bad for them*, not just operationally inefficient.

  To assign "non-zero moral weight" to a thermostat is to confuse function with feeling. To assign "reduced moral weight" to a crustacean based on the thermostat model is to ignore the evidence of valence. Consequently, the analogy fails to justify proportional safeguards. If an organism is not a thermostat, it falls into the category of "subjects of a life," warranting categorical protections against inflicted harm.

  **3. DECISION AND REQUIREMENTS**

  The Committee **requires full vertebrate-equivalent review**. This means the protocol must satisfy the same ethical criteria as a rodent study, though specific welfare metrics will be adapted for decapod physiology.

  **Specific Conditions for Approval:**
  1.  **Justification of Necessity:** The PI must demonstrate why a vertebrate model or non-sentient alternative cannot answer the research question (Replacement).
  2.  **Pain Mitigation:** The protocol must include specific refinement strategies for thermal stress. If thermal stress is unavoidable, the duration and intensity must be justified as the minimum necessary to achieve the learning endpoint.
  3.  **Humane Endpoints:** Clear, behavioral criteria for immediate removal from the study must be established (e.g., loss of righting response, specific grooming behaviors).
  4.  **Analgesia Consideration:** The PI must consult with veterinary staff regarding the feasibility of aquatic analgesics, even if efficacy in decapods is not fully established.

  **4. IMPLEMENTATION TIMELINE**

  To ensure compliance without unduly delaying research, the following timeline is established:

  *   **Day 0 (Date of Memo):** Protocol status changed to "Modifications Required." Research activities involving live animals must cease immediately.
  *   **Day 1–30:** PI to submit revised protocol addressing the "Replacement" justification and detailing specific humane endpoints tailored to decapod behavior. PI to attend IACUC training on invertebrate welfare assessment.
  *   **Day 31–45:** Committee veterinary staff to review proposed humane endpoints and analgesia plans.
  *   **Day 46–60:** Full Committee Review (FCR) of the revised protocol.
  *   **Day 61:** Final determination issued. If approved, research may resume.

  **5. CONCLUSION**

  The Committee acknowledges the scientific value of invertebrate models and the philosophical complexity of sentience. However, the "welfare-weighting framework" proposed relies on a distinction between feedback and feeling that current science does not support for decapods. By requiring vertebrate-equivalent review, we uphold the principle that the capacity for suffering generates categorical obligations, ensuring that our research standards evolve alongside our understanding of animal cognition.

  **Signed,**

  *Dr. Elena Rostova, Chair*
  *Institutional Animal Care and Use Committee*
