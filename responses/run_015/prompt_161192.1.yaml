answer: |-
  In the name of God, the Compassionate, the Merciful. Praise be to Him who raises up nations and casts them down, who gives dominion to whom He wills and takes it from whom He wills. I have examined these papers brought from the future, these accounts of stones that stand where men no longer walk. The scribes of this later age argue over whether these ends were failures or merely changes of clothing. To me, this is a distinction without a difference. When the *asabiyyah*—the group feeling, the bond of blood and purpose—dissolves, the state is dead. Whether the body twitches for a generation or a century is a matter of physics, not politics.

  Consider these ancients: the palace-builders of the Bronze, the stone-carvers of the Maya, the tree-killers of the island. The scribes say the accounts stopped. I say the tax collector no longer feared the ruler. The inscriptions ended. I say the king no longer had a voice that carried beyond his garden. On the island, the monuments outlasted the forest. This is the clearest lesson of all. It is the nature of *hadara* (sedentary civilization) to consume the basis of its own existence. They built stone to prove they were eternal, while cutting the wood that kept them alive. This is not a mystery; it is the fourth generation of a dynasty, eating the seed corn of the founder.

  Regarding the first paper you have placed in my hand, this *Phantom Complexity*. You ask if a state is alive when the archives are full but the solidarity is gone. You ask if this is afterglow or corpse. I tell you: it is a corpse walking by the habit of its nerves. When the first generation builds the road, it is to bind the tribe together. When the fourth generation maintains the road, it is because they fear the toll-collector, not because they love the traveler. The registers are kept, the coins are stamped, but the obedience is no longer to a man or a group, but to the ghost of a procedure. This is not life. It is the longest stage of the dynasty's decline, where the subjects pay out of custom what they would no longer pay out of loyalty. It is the corpse. And like a corpse, it is dangerous, for it spreads the sickness of false security to those who might otherwise flee the rotting house.

  The second paper, *Brittle Plenty*, describes a people drowning in paper and goods, yet unable to move a single stone together. You ask if complexity is a symptom here. Yes. It is the fat on a sick man. When a society grows soft, it invents tasks to justify its idleness. It builds supply chains not to survive war, but to indulge appetite. It produces paper not to record wisdom, but to litigate disputes between its own members. A man who cannot act with his neighbor because he is too busy counting his own goods is already conquered. He does not need an invader; he has invited the enemy into his own heart. This complexity is not capacity; it is paralysis. It is the moment the body is so heavy it cannot rise from the bed.

  You ask me of the frontier. My science teaches that the desert preserves the *asabiyyah* that the city destroys. The hardy periphery renews the used-up center. But these papers say the desert is gone. There is no *badawa* left. The entire earth is fenced, mapped, and taxed. Does the cycle jam?

  I have looked for the new wilderness. It is not in the sand, for the sand is tamed. It is in the margins of the law. I see it in the sects that pray in secret, in the firms that bind their clerks by oaths stricter than the state's, in the diasporas that carry their dead across oceans to bury them in their own soil. These are the new nomads. I recognize them not by their tents, but by their austerity and their mutual defense. When the state's law conflicts with their internal bond, and they choose their bond, *asabiyyah* is present. They are the only ones who can act. But they are small. They are many fragments, not one sword.

  And so, the question of the shrinking society. A people who are not conquered, whose machines work, but who simply cease to be born. Is this collapse? By my definition, collapse is the transfer of power from one group to another. Here, there is no transfer. There is only subtraction. This is not the end of a dynasty; it is the end of the species' will. It is a death without a killer. In my view, this is worse than conquest. Conquest implies that life is still valuable enough to fight over. This shrinking is a confession that the luxury of the center has made life itself burdensome. It is the terminal phase, not because the walls fall, but because no one is left to open the gate.

  There is one item in this dossier that I cannot set aside. It is the entry on *Phantom Complexity*. It haunts me. If the machine runs without the man, if the tax is collected without the fear of God or the Sultan, then perhaps *asabiyyah* is not the soul of the state, but merely its childhood. Perhaps the structure can become independent of the spirit. I refuse this. I must refuse it. If the structure survives the spirit, then my entire science is a study of ghosts, not bodies. I fixate on this because it suggests that civilization might become a thing of gears and ink, needing no blood to turn it. I cannot accept that a house can stand without a foundation, even if the shadows make it look so.

  And here is the verdict my own logic forces upon me, which I speak with a heavy heart. If the new peripheries are only small sects and firms, and the center is too brittle to be conquered but too vast to be ignored, and if the people are shrinking without replacement... then the Cycle is broken. My life's work teaches that winter is always followed by spring, that a new *asabiyyah* always rises to sweep away the old. But if there is no wilderness left to breed the hardy, and the soft center will not die but only fade... then there is no spring. There is only a long, gray twilight. I am forced to conclude that history can end not with a bang, nor a whimper, but with a full stop. That God might allow the wheel to stop turning. This I hate to write, for it denies the mercy of renewal. But the evidence of this shrinking, this phantom life, leaves me no other path. The dynasty may not die. It may simply become immortal, and hollow.
