answer: |-
  You have hit on one of the most nuanced and contentious topics in all of science. Honestly, your intuition is incredibly sharp for an AP Bio student. You've correctly identified that the *math* isn't usually the fight—the fight is about **ontology** (what the numbers represent in reality), **causality**, and **implications**.

  You are right that it is partly a verbal dispute and partly political, but there is also a genuine **methodological disagreement** underneath it all.

  Here is the breakdown of why smart people are still arguing about this, even though they agree on the formula $h^2 = V_G / V_P$.

  ### 1. The "Variance Partition" Trap (The Scientific Disagreement)
  You noted that everyone agrees heritability is a variance partition. That's true in theory. But in practice, **twin studies (which generate that 0.5 number) make assumptions that many geneticists now think are wrong.**

  *   **The Assumption:** Twin studies assume that Identical (MZ) and Fraternal (DZ) twins share their environment to the same degree. This is called the *Equal Environments Assumption*.
  *   **The Problem:** MZ twins are treated more similarly than DZ twins (dressed alike, share more friends). If MZ twins are more similar in IQ, twin studies attribute that *all* to genes. But if some of that similarity is because they were treated more alike, the heritability estimate is inflated.
  *   **The New Data:** With modern DNA sequencing (GWAS), we can measure actual genetic similarity rather than inferring it from twin status. When we do this, the "SNP heritability" of IQ often comes out lower than the twin study heritability.
  *   **The Fight:** One side says, "Twin studies capture the total genetic effect including gene-gene interactions." The other side says, "Twin studies are conflating shared environment with genetics."

  **Verdict:** This isn't just semantics; it's a disagreement about whether the tool we used to measure the number is broken.

  ### 2. Gene-Environment Correlation (rGE)
  This is where the "verbal dispute" you suspected gets messy.

  Heritability calculations try to separate Nature ($V_G$) and Nurture ($V_E$). But in humans, **Nature builds Nurture.**
  *   **Passive rGE:** Smart parents pass on "smart genes" *and* they fill the house with books.
  *   **Evocative rGE:** A child with a genetic predisposition for curiosity asks more questions, so teachers give them more attention.
  *   **Active rGE:** A kid with genetic athletic ability joins the soccer team, improving their skills.

  In a twin study, all of these effects get lumped into the "Genetic Variance" bucket because the correlation starts with the genes.
  *   **Side A says:** "This is legitimate genetic influence because the chain of causality started with DNA."
  *   **Side B says:** "No, that's environmental mediation. If you changed the environment (e.g., equalized school quality), that 'genetic' variance would disappear."

  So, when someone says "IQ is 50% heritable," Side A hears "50% of the difference is due to DNA." Side B hears "50% of the difference is due to DNA *in the current environmental system*, much of which is triggered by the DNA."

  ### 3. The Malleability Fallacy (Your Teacher's Point)
  Your teacher warned you that $h^2$ "doesn't mean what most people think." This is the most critical concept.

  **Heritability is not about fixedness.**
  *   **Example:** Height is highly heritable (~0.8). But if you look at the last 150 years, humans have gotten significantly taller. Why? Better nutrition.
  *   **The Math:** Heritability measures variation *within* a population at *one time*. If everyone in the population gets better nutrition, the *average* height goes up, but the *variance* might stay the same.
  *   **The Conflict:**
      *   **Group 1:** Worries that if the public hears "IQ is heritable," they will assume "IQ cannot be improved by schools/policy." (The Political Fear).
      *   **Group 2:** Worries that if scientists aren't allowed to report heritability because it's "politically dangerous," we are censoring data. They argue we should trust the public to understand the nuance (that heritable traits can still be changed).

  ### 4. Is IQ a Biological Trait?
  This is the elephant in the room.
  *   **Height** is a direct biological measurement.
  *   **IQ** is a score on a test designed by psychologists.

  Some critics argue that applying quantitative genetics to IQ is like calculating the heritability of "wealth" or "religion." Yes, your parents' wealth predicts your wealth (high heritability), but that doesn't mean wealth is a biological trait encoded in DNA. It means the *social system* transmits wealth.
  *   **The Disagreement:** Proponents argue IQ correlates with biological markers (reaction time, brain volume, neural efficiency). Critics argue IQ is a measure of *acculturation* (how well you fit into the school system), not raw processing power. If IQ is largely acculturation, then a high heritability estimate just means "parents are good at passing on their social class," not "intelligence is genetic."

  ### So, are they talking past each other?
  **Yes and No.**

  1.  **Yes (Verbal):** They are using the word "Genetic" differently. One means "transmitted via DNA," the other means "variation correlated with familial relatedness."
  2.  **Yes (Political):** There is a legitimate fear that heritability estimates will be used to justify defunding education or social programs ("Why bother teaching them if it's in their genes?"). This makes scientists hyper-defensive.
  3.  **No (Scientific):** There is a real debate about whether twin studies overestimate genetic effects by ignoring gene-environment interplay.

  ### What would settle it?
  Nothing will settle the *political* fight, because that is about values, not data. But the *scientific* fight is moving toward a resolution via **Molecular Genetics**.

  We are moving away from **Twin Studies** (inferring genes from family trees) to **DNA Analysis** (looking at the actual base pairs).
  *   As we sequence more genomes, we can identify specific variants associated with cognitive traits.
  *   Currently, identified DNA variants explain *less* of the variance than twin studies suggest (this is called the "Missing Heritability Problem").
  *   Once we close that gap, we will know if the twin studies were right (it is truly genetic) or if they were conflating environment with genetics.

  ### Summary for your AP Bio Class
  Your teacher was right to warn you. Here is the "Cheat Sheet" for understanding the debate:

  1.  **Heritability is a population statistic, not an individual one.** You cannot say "50% of *my* intelligence is genetic."
  2.  **Heritability depends on the environment.** If you equalize the environment for everyone, heritability goes *up* (because $V_E$ becomes 0). If you make environments wildly different, heritability goes *down*.
  3.  **High Heritability $\neq$ Unchangeable.** Phenylketonuria (PKU) is 100% genetic, but it is treated by changing the diet (environment).
  4.  **The Debate:** Is the 0.5 number for IQ measuring **biology**, or is it measuring **social inheritance** that looks like biology because families stay in the same social class?

  You've done a great job spotting that the disagreement isn't about the arithmetic. It's about what the arithmetic *represents* in the real world. Keep asking these questions; that's how you move from memorizing bio to actually *doing* science.
