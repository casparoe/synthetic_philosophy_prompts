answer: |-
  Here is a sequence of ten questions designed to press the technical machinery of the two-dimensional framework, along with follow-ups keyed to the standard defensive moves a two-dimensionalist is likely to make.

  **1. The Division of Labor in the Necessary A Posteriori**
  "In the case of 'Water is H2O,' you argue the secondary intension is necessary while the primary intension is contingent. Could you specify precisely where the modal shift occurs? Is it that the primary intension picks out whatever plays the 'water role' in a given scenario, while the secondary intension picks out H2O in all worlds *given* that water is H2O in the actual world? If so, does this imply that the reference-fixing description itself must be knowable a priori, and if not, how does the primary intension secure the a priori status required for the framework?"

  *   **Follow-up:** "If you grant the reference-fixing description must be a priori, doesn't that commit you to a form of descriptivism that Kripke explicitly argued against? How do you maintain the causal-historical chain of reference while insisting the reference-fixer is accessible to pure reason?"

  **2. Indexing the Epistemic Dimension**
  "You ground the primary intension in a space of epistemic scenarios, often modeled as centered worlds. Is the choice of *centered* worlds merely a formal convenience to handle indexicals like 'I' and 'now,' or does the centering do substantive work in the zombie argument? Specifically, does the centering allow you to isolate the phenomenological concept of consciousness from the physical concept in a way that uncentered worlds would not?"

  *   **Follow-up:** "If the centering is doing substantive work, isn't there a risk of circularity? You seem to be building the possibility of a detached subjective perspective into the definition of the epistemic space, which then guarantees the epistemic possibility of zombies before the argument even begins."

  **3. The Bridge from Epistemic to Metaphysical Possibility**
  "This is the crux of the zombie argument: You move from the claim that the primary intension of 'zombie' is non-empty (it is epistemically possible) to the claim that zombies are metaphysically possible. What is the precise bridge principle that licenses this inference? Is it a conceptual truth that primary conceivability entails secondary possibility, or is it a substantive modal thesis that requires independent defense?"

  *   **Follow-up:** "You will likely reply that this holds provided there is no 'deep necessity' blocking the move. But how can we verify the absence of deep necessity without already knowing the metaphysical facts? If we need to know the metaphysics to validate the bridge, doesn't the conceivability argument become redundant?"

  **4. The Status of the Primary Intension**
  "Is the primary intension a component of the *semantic* content of a term, or is it merely a representation of its *cognitive* significance? If it is merely cognitive, why should it have any traction on metaphysical modality? If it is semantic, does this mean that when two speakers disagree about the primary intension of 'consciousness,' they are literally speaking different languages?"

  *   **Follow-up:** "If you argue it is semantic content, how do you explain communication across different epistemic perspectives? If the primary intension varies by epistemic situation, how do we manage to refer to the same property when debating the mind-body problem?"

  **5. Negative vs. Positive Conceivability**
  "Does the two-dimensional framework rely on *negative* conceivability (the absence of contradiction) or *positive* conceivability (the construction of a coherent model)? The zombie argument seems to require positive conceivability to ensure the primary intension is genuinely non-empty, but much of the defense rests on negative conceivability to avoid empirical refutation. Which standard is the framework committed to?"

  *   **Follow-up:** "If you require positive conceivability, haven't you raised the bar so high that most philosophical claims become inaccessible? If you settle for negative conceivability, isn't the space of 'possible scenarios' too permissive to ground robust metaphysical conclusions?"

  **6. Compatibility with Rigid Designation**
  "Kripke argues that natural kind terms are rigid designators, picking out the same entity in all possible worlds. Your secondary intension respects this, but your primary intension suggests the term picks out different entities in different epistemic scenarios. Is the two-dimensional framework a refinement of Kripke's view, or does it ultimately reject the notion of rigid designation in favor of a Fregean sense that varies across contexts?"

  *   **Follow-up:** "If it is a refinement, does it preserve Kripke's argument that identity statements involving rigid designators are necessary if true? Or does the two-dimensional view imply that 'Water is H2O' is only necessary relative to a fixed actual world, making necessity itself a context-sensitive notion?"

  **7. Kaplan's Objection on Context-Dependence**
  "David Kaplan has objected that two-dimensional matrices simply reflect the context-dependence of indexicals and do not reveal a deep duality in meaning. He suggests that once you fix the context, the second dimension collapses. How do you respond to the claim that the 'primary intension' is just the character of an indexical expression, and therefore lacks the stability to ground metaphysical arguments about zombies?"

  *   **Follow-up:** "If you distinguish the epistemic dimension from Kaplan's context, what is the non-stipulative criterion for that distinction? Without it, isn't the two-dimensional framework just a notational variant of standard possible worlds semantics with added context parameters?"

  **8. The Type-B Materialist Challenge**
  "Type-B materialists accept that zombies are conceivable (primary intension is non-empty) but deny they are metaphysically possible. They argue there is a brute necessary connection between the physical and the phenomenal. Does the two-dimensional framework have the resources to rule out Type-B materialism as *incoherent*, or does it merely render it *unlikely*? If the former, where is the contradiction?"

  *   **Follow-up:** "If you concede the framework cannot prove Type-B materialism incoherent, but only that it posits 'brute necessity,' isn't that a concession that the two-dimensional strategy cannot settle the metaphysical debate, but only shift the burden of proof?"

  **9. Generalization to Other Identities**
  "Does this framework apply equally to theoretical identities like 'Heat is mean molecular kinetic energy' and 'Hesperus is Phosphorus'? In the Hesperus case, the primary intension seems to rely on observational modes of presentation. If the primary intension for 'consciousness' relies on a first-person mode of presentation, does that introduce an asymmetry that undermines the analogy with standard natural kind cases?"

  *   **Follow-up:** "If there is an asymmetry, does that suggest the zombie argument relies on a unique privilege of the first-person perspective that the two-dimensional semantics itself cannot fully formalize without residual ambiguity?"

  **10. Falsification and Theoretical Limits**
  "Finally, what would count as evidence against the two-dimensional strategy? Is there a formal result, a linguistic datum, or a metaphysical argument that would force you to abandon the distinction between primary and secondary intensions? Or is the framework flexible enough to accommodate any counter-example by adjusting the space of scenarios?"

  *   **Follow-up:** "If the answer is that no empirical or formal result could falsify it, are we to understand the two-dimensional framework as a substantive theory of language and modality, or as a regulative ideal for philosophical inquiry? If the latter, does it lose its claim to establish the *metaphysical* possibility of zombies?"
