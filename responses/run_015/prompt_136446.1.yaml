  2.  **Deconstruct the Theory (Moral Equality of Combatants - MEC):**
      *   Core claim: Combatants on both sides have equal permission to kill enemy combatants and equal liability to be killed, regardless of the justice of their cause.
      *   Basis: Status (being a combatant), not cause.
      *   Corollary: Noncombatant immunity. Civilians are not liable to be killed because they are not dangerous/threatening in the relevant way.
      *   Key Condition: Distinction. You must be able to tell who is a combatant.

  3.  **Drafting - Section by Section:**

      *   **1. The Mapping:**
          *   *My Lai (Actual):* Under MEC, the villagers are noncombatants. They bear no weapons, wear no uniforms, offer no fire. Therefore, they have immunity. The US soldiers are combatants. They have permission to kill *enemy combatants*. Since there are none present, the permission is null. The killing is murder, not war. The theory is not "empty" here; it is decisive. It says "no killing permitted."
          *   *Hypothetical COIN Hamlet:* Here, some villagers are part-time guerrillas. Under MEC, status is key. If they are combatants (even part-time), they are liable when functioning as such. But if they are farming, are they combatants? MEC struggles with "continuous combatant function" vs. "direct participation." If the theory relies on *danger*, a farmer with a hidden rifle is dangerous only when accessing the rifle. If the theory relies on *status*, membership matters.
          *   *Evidence of Killability:* Uniforms, open carry, hostile act. In My Lai: None. In COIN Hamlet: Ambiguous. MEC requires positive identification to transfer liability. Without it, presumption of immunity holds.

      *   **2. The Wrinkle (Identifiability):**
          *   The user asks if permission is indexed to identifiability. Yes, MEC is coupled with Noncombatant Immunity (NCI). You can't kill what you can't identify as a target.
          *   *Option 1 (Threshold):* Permission vanishes below identifiability threshold. This fits MEC best. If you can't distinguish, you can't license killing based on status.
          *   *Option 2 (Scaling):* Permission scales with probability. This is utilitarian, not deontological status-based. MEC usually rejects this (you can't kill 1 civilian to get 1 combatant).
          *   *Option 3 (Transfer/Forfeiture):* The side hiding forfeits protection for civilians. This is the "human shield" argument. MEC generally rejects this because it violates the immunity of the innocent based on the actions of the guilty. It makes civilians liable for enemy tactics.
          *   *Conclusion:* MEC supports Option 1. The permission disappears. It does not support transferring liability to civilians (Option 3).

      *   **3. The Fix (Identification Budget):**
          *   *Concept:* Permission is limited by identification capacity. Overspend absorbed by noncombatants.
          *   *Critique:* This collapses. If the "overspend is absorbed by exactly the people least likely to be combatants," you are explicitly licensing the killing of noncombatants. This violates Noncombatant Immunity, which is the twin pillar of MEC.
          *   *Just Cause:* Does it let *jus ad bellum* in? Not necessarily *just cause*, but it lets *consequences* in. It turns status into a quota. MEC is about individual liability, not aggregate budgets. If you kill a noncombatant because you "overspent," you killed someone not liable. The theory cannot underwrite this. It doesn't reintroduce *jus ad bellum*, but it destroys *jus in bello* distinction.

      *   **4. Reverse Impact (My Lai on Theory):**
          *   *COIN Suitability:* My Lai shows MEC relies on clear distinction. In COIN, distinction is hard. The theory doesn't go "silent," it becomes restrictive. It says "if you can't tell, don't shoot." This might be operationally impossible, but morally clear.
          *   *Scapegoat Reaction:* Does MEC explain why Calley was scapegoated? MEC says individual liability matters. If the permission was void (no combatants), everyone who shot is liable. Singling out Calley is legally convenient but morally inconsistent under MEC *if* others killed too. However, MEC focuses on individual status. If Calley ordered it, he bears command responsibility. If others followed illegal orders, they are still liable under MEC (superior orders is not a defense for manifest illegality). The public feeling of unfairness suggests a collective guilt intuition that MEC rejects. MEC says: each trigger puller is liable.
          *   *Psychology:* MEC is normative, not psychological. It says what you *may* do, not what you *feel* like doing. It has nothing to say about fear, anger, or the stress of invisible enemies. It assumes a rational agent capable of distinguishing status. If psychology prevents distinction, MEC says: stop fighting.

