answer: |-
  1. **The Mapping**
  Under the moral equality of combatants (MEC), paired with noncombatant immunity, the moral landscape is defined by status, not location or nationality. The "players" are strictly binary: combatants (liable to be killed, permitted to kill) and noncombatants (immune, permitted neither).

  In the actual My Lai hamlet, given your premises (no enemy unit, no fire taken, villagers unarmed), the mapping is stark. The US soldiers are combatants. The villagers are noncombatants. The thesis is not "empty" here; it is prohibitive. The permission to kill is relational—it requires a liable object. Since there were no enemy combatants present, the soldiers' permission had no target. The villagers retained full immunity. The theory does not need an opposing combatant to function; it functions by withholding license where status is absent. The killing was not war; it was murder, precisely because the symmetry MEC describes was broken by the absence of the opposing symmetry.

  In the hypothetical COIN hamlet (part-time guerrillas farming by day), the mapping frays. MEC relies on distinguishable status. If a villager is a combatant only when armed, their liability is intermittent. If they are combatants by membership, their liability is continuous. MEC traditionally leans toward the former to protect immunity. Evidence of killability must be empirical: a weapon seen, a hostile act committed. Mere suspicion or demographic probability does not confer status. In this scenario, the US soldiers retain their combatant status, but their permission to kill is suspended until the villager manifests combatant status. The theory demands that the burden of uncertainty falls on the shooter, not the villager.

  2. **The Wrinkle (Identifiability)**
  You are not smuggling anything in; the permission is indeed indexed to identifiability. MEC is not a license to kill enemies *wherever they might be*; it is a license to kill those *identified as such*. When the enemy blurs the line, they do not transfer liability to civilians; they remove the condition necessary for the soldier's permission to operate.

  Of your three options, the thesis supports the first: the permission disappears when identifiability drops below a threshold. MEC is deontological, not utilitarian. It does not allow "scaling" (Option 2) because you cannot kill an immune person based on a probability calculation; immunity is a right, not a risk factor. Option 3 (forfeiture/transfer) is explicitly rejected by the theory. To say civilians lose protection because guerrillas hide among them is to make immunity contingent on enemy behavior, which destroys the concept of immunity entirely. That is indeed the human-shield argument, and MEC treats it as a violation by the hiding side, not a license for the attacking side. The theory holds that if you cannot distinguish, you cannot shoot. If this makes victory impossible, the theory accepts that cost rather than sacrifice the distinction between combatant and civilian.

  3. **The Fix (Identification Budget)**
  Your "identification budget" collapses. It attempts to aggregate individual liabilities into a collective quota, which MEC forbids. Liability is individual; you cannot kill Person A because you "saved up" permission from correctly identifying Person B. More critically, if the overspend is "absorbed by exactly the people least likely to be combatants," you are explicitly licensing the killing of noncombatants. This violates noncombatant immunity, the twin pillar of MEC.

  Regarding your worry about *jus ad bellum* (just cause): this fix does not necessarily reintroduce the justice of the war, but it does reintroduce *military necessity* as a trump card over discrimination. It says, in effect, "we need to kill X enemies to win, so we are allowed X civilian deaths." MEC rejects this. The theory insists that *jus in bello* constraints hold regardless of necessity. The budget idea tries to mathematize a moral boundary that is meant to be absolute. It fails because it treats immunity as a resource to be spent rather than a status to be respected.

  4. **Reverse Impact (My Lai on the Theory)**
  My Lai does not show the theory is silent on counterinsurgency; it shows the theory is restrictive to the point of operational difficulty. The theory says: if you cannot distinguish, you must withdraw or cease fire. It offers no workaround for the stress of an invisible enemy. It has nothing to say about the psychology of fear or anger; it assumes a rational agent capable of adhering to norms despite emotion. If the psychology of the soldier makes distinction impossible, the theory says that soldier is unfit for combat, not that the rules should change.

  Regarding the scapegoat reaction: the thesis does not support the feeling that Calley was unfairly singled out. MEC emphasizes individual moral agency. Superior orders do not negate liability for manifest violations (like killing unarmed women). If many men killed, many are liable. The public's desire to view Calley as a scapegoat suggests a collective understanding of guilt ("the war made them do it") that MEC rejects. The theory insists on individual accountability precisely to prevent the diffusion of responsibility. The commutation of his sentence reflects a political judgment, not a moral one derived from the thesis.

  Ultimately, My Lai demonstrates the fragility of MEC when the empirical conditions for distinction vanish. The theory does not break; it simply forbids the fighting. The discomfort this causes—the sense that soldiers cannot be expected to fight under such rules—is a critique of the war's conduct, not the theory itself. The theory remains silent on how to win such a war; it speaks only to how to fight it without becoming murderers.
