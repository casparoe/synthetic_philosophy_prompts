  I agree with your instinct: the villanelle is the correct form. A sestina rotates six end-words, which dilutes the binary conflict essential to the Prisoner's Dilemma; the villanelle's two refrains mirror the two moves (Cooperate/Defect), and violating the form's requirement for exact repetition physically enacts the "noise" corrupting the signal.

