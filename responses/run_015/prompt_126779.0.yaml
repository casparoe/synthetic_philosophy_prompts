answer: |-
  **Seminar Handout: Mapping the Logical Space of Mental Causation**

  **Note from the Tutor:** 
  Before we begin, a small correction to your notes: you have typed 'exlusion' in the margin. I know you mean the *exclusion* argument (the worry that physical causes squeeze out mental causes), but do mind the spelling when you write your essays. Precision matters here. Below is a decision tree designed to sort your commitments without relying on labels you might not yet own. Answer the questions as they stand; the position names appear only at the end.

  ***

  ### The Decision Tree

  **Node 1: The Scope of Physical Determination**
  When a physical event occurs (like a neuron firing), is it fully settled by physical facts at that exact instant (**synchronic**), only by physical facts unfolding over time (**diachronic**), or is it not fully settled by physical facts at all?
  *   *Option A:* Fully settled at that exact instant (Synchronic Closure).
  *   *Option B:* Fully settled only over time (Diachronic Closure).
  *   *Option C:* Not fully settled by physical facts (Closure Fails).

  **Node 2: The Status of Mental Events**
  Regardless of your answer above, what is the relationship between a mental event (like a decision) and the physical event associated with it?
  *   *Option A:* They are literally the very same thing (Token-Identity).
  *   *Option B:* The mental is distinct but dependent on the physical (Realised but not Identical).
  *   *Option C:* The mental is genuinely separate from the physical (Non-Physical).

  **Node 3: The Problem of Competition**
  *(Only answer this if you chose Option B or C at Node 2, and Option A or B at Node 1)*
  If physical causes are sufficient to produce the effect, and mental causes are distinct from physical causes, how do they coexist?
  *   *Option A:* Both causes work independently to bring about the effect (Systematic Overdetermination).
  *   *Option B:* The physical cause does all the work; the mental cause does none (Deny Efficacy).
  *   *Option C:* They work together without competing for the same causal 'oomph' (Non-Competitive Causation).

  ***

  ### The Leaves: Positions and Commitments

  **Path 1A/1B + 2A (Closure + Token-Identity)**
  *   **Position:** Reductive Physicalism (Identity Theory).
  *   **Awkward Commitment:** You must accept that mental properties have no distinctive causal power of their own, as everything is ultimately just physics in disguise.
  *   *(Note: Whether you chose synchronic or diachronic closure here does not create a new position; see Tutor's Notes below.)*

  **Path 1A/1B + 2B + 3A (Closure + Realisation + Overdetermination)**
  *   **Position:** Overdeterminationist Emergentism.
  *   **Awkward Commitment:** You are committed to the view that every voluntary action is coincidentally caused twice, which looks suspiciously like magic rather than science.

  **Path 1A/1B + 2B + 3B (Closure + Realisation + Deny Efficacy)**
  *   **Position:** Non-Reductive Epiphenomenalism.
  *   **Awkward Commitment:** You must concede that your conscious thoughts are causally inert by-products, like steam off a train, unable to influence your own behaviour.

  **Path 1A/1B + 2B + 3C (Closure + Realisation + Non-Competitive)**
  *   **Position:** Downward Causation Non-Reductivism (Compatibilism).
  *   **Awkward Commitment:** Causation must be redefined so that two causes can exist without competing for the same causal 'oomph', risking a dilution of what 'cause' means.

  **Path 1A/1B + 2C + 3B (Closure + Non-Physical + Deny Efficacy)**
  *   **Position:** Dualist Epiphenomenalism.
  *   **Awkward Commitment:** You posit a non-physical soul or mind that exists but is utterly powerless to move the body it inhabits.

  **Path 1A/1B + 2C + 3A (Closure + Non-Physical + Overdetermination)**
  *   **Position:** Interactionist Dualism (with Overdetermination).
  *   **Awkward Commitment:** You maintain that non-physical minds intervene in physics, yet every physical effect also has a sufficient physical cause, doubling the causal load.

  **Path 1C + 2C (No Closure + Non-Physical)**
  *   **Position:** Interactionist Dualism (Standard).
  *   **Awkward Commitment:** Physics is incomplete, and energy conservation might be violated whenever a mental decision intervenes in the physical world.

  **Path 1A/1B + 2B/2C + 3B (General Denial of Mental Causation)**
  *   **Position:** Eliminativism about Mental Causation.
  *   **Awkward Commitment:** There are no beliefs or desires in any causally relevant sense, only neural states masquerading as psychology.

  ***

  ### Tutor's Notes on the Fine Print

  **1. The Redundancy of Closure Types under Identity**
  You may have noticed that choosing 'Synchronic' or 'Diachronic' closure at Node 1 does not generate different leaves when combined with Token-Identity (Path 1). This is because if mental events *are* physical events, the temporal scope of physical closure applies to them automatically. Distinguishing synchronic from diachronic closure here is logically redundant; it does not carve out a distinct ontological position, so I have collapsed them into a single leaf.

  **2. Indistinguishable Leaves**
  Be wary of the distinction between **Non-Reductive Epiphenomenalism** and **Eliminativism about Mental Causation**. While the former accepts mental properties exist but lack power, and the latter denies the properties exist altogether, their empirical predictions are identical: in both cases, mental properties do no causal work. In practice, these leaves are often indistinguishable to an outside observer, differing only in whether they grant the mental a precarious ontological existence.

  **3. The Unoccupied Branch**
  There is a logically possible combination that remains unoccupied in standard literature: **Synchronic Closure + Diachronic Non-Closure**. This would imply physical facts at a time-slice determine the effect, but physical facts over time do not. This is generally considered incoherent, as diachronic determination usually presupposes synchronic determination at each stage. Consequently, no serious position occupies this branch, and it has been omitted from the tree to avoid confusion.

  **4. A Warning on 'Non-Competitive Causation'**
  The leaf labelled **Downward Causation Non-Reductivism** is the most popular refuge for contemporary non-reductive physicalists. However, note that this position requires a robust account of how causation works at different levels without violating the exclusion principle. If you end up here, expect your seminar colleagues to press you on whether you are merely renaming the problem rather than solving it.
