  1. Standard economic theory posits that sunk costs are irrelevant to rational decision-making because they cannot be recovered. However, consider the perspective of diachronic agency, where past commitments may function as constitutive constraints rather than inputs to expected utility. Write an essay arguing whether honoring sunk costs can be rational as an expression of narrative integrity rather than investment recovery. In your analysis, you must defend whether such integrity can be maintained without collapsing into mere psychological consistency, addressing the risk that maintaining a failing project might undermine the very agency it seeks to preserve.

  2. Standard decision theory treats sunk costs as bygones, strictly irrelevant to expected utility maximization. To honor them is typically classified as the sunk cost fallacy, an error in instrumental reasoning where past investments wrongly influence future choices. However, this framework ignores the constitutive role of past commitments in shaping diachronic agency. When an agent persists in a failing project not to recover losses but to honor the commitment itself, they are not calculating utility; they are constituting themselves as a certain kind of agent. The rationality here shifts from outcome optimization to identity maintenance. The past cost is not an input for expected utility but a constitutive constraint on present choice that preserves the coherence of the agent's trajectory over time. Consider a researcher abandoning a decade-long study because immediate utility dictates pivoting. While instrumentally rational, this fractures the narrative arc of the agent's life. Within a constitutive framework, the sunk cost represents a binding normative claim on the present self by the past self. It functions not as data for calculation but as a boundary condition for action. This reorientation suggests that economic rationality is subordinate to agential unity. Thus, abandoning the project might maximize utility but render the agent diachronically fragmented, making the action irrational regarding the integrity of the agency itself. The cost is sunk financially but active constitutively, demanding fidelity not for return but for coherence. Consequently, the evaluation of rationality depends entirely on the framework adopted.

  3. Yet, defending this as narrative integrity risks collapsing into mere psychological consistency, where stubbornness is masquerading as virtue. To avoid this, the agent must demonstrate that the commitment serves a constitutive reason independent of the mere desire to appear consistent. The integrity lies in the value of the project itself as part of a life plan, not merely in the fact of prior investment. If the only reason to continue is "I started this," the agent succumbs to the very fallacy they seek to transcend. However, a critical self-undermining risk remains: if the project's failure negates the very values it was meant to express, persistence becomes self-defeating. Rational diachronic agency requires distinguishing between integrity, defined as faithfulness to constitutive values, and rigidity, defined as faithfulness to past mistakes regardless of value. Therefore, honoring sunk costs is rational only when the act of honoring sustains the agent's normative identity without contradicting the substantive goods that identity pursues. The constraint must be constitutive of a valuable life, not merely a psychological habit of completion. Otherwise, the agent preserves the shell of consistency while hollowing out the substance of their agency, ultimately undermining the diachronic unity they sought to protect. The past must authorize the present, not enslave it, ensuring that narrative integrity remains a rational virtue rather than a cognitive vice. Ultimately, the justification rests on the normative weight of the past.

  4. Part 1: Conceptual Framework (50%). A-grade responses must explicitly distinguish constitutive reasons from instrumental inputs to expected utility, articulating how sunk costs function as constraints on diachronic agency rather than data for calculation. B-grade responses will correctly identify the sunk cost fallacy but fail to move beyond instrumental rationality, merely cataloging commitments as rational or irrational without analyzing the constitutive role of past actions in identity formation. To secure an A, the student must demonstrate that abandoning a project can be instrumentally sound yet agentially irrational.

  5. Part 2: Critical Defense (50%). A-grade responses must address the self-undermining risk, distinguishing narrative integrity from mere psychological consistency to avoid defending stubbornness. They must argue that integrity requires substantive value, not just historical continuity. B-grade responses will treat consistency as inherently valuable or fail to identify the risk of collapsing into rigidity. To secure an A, the student must show how honoring sunk costs can be defended without contradicting the substantive goods the agent pursues, ensuring the past authorizes rather than enslaves the present.
