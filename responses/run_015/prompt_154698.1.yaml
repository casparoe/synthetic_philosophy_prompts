answer: |-
  # The RIR Audit (Recursive Identification Residue)
  **Version:** 1.0 (Internal Draft)  
  **Time Cost:** ~20 Minutes  
  **Goal:** Flag narrative mechanics where simulated autonomy clashes with irreversible system actions.  
  **Premise:** Ethical friction occurs when the system invites the player to trust a character's agency, then uses system privileges to violate that trust.

  ---

  ## Part 1: The Flowchart (5 Gates)

  Run these questions in order. If any gate triggers a **HALT**, the proposal requires redesign or executive sign-off. If you hit **KICK**, the decision is artistic, not ethical.

  ### Gate 1: The Time/Depth Threshold
  *   **Q:** How many hours of active interaction does the player have with this entity before the harm/deletion event?
  *   **Metric:** < 5 Hours = **PASS**. 5–20 Hours = **REVIEW**. > 20 Hours = **FLAG**.
  *   **Why:** Residue requires accumulation. Short interactions don't build the "autonomy illusion."
  *   **Halt Condition:** If > 20 Hours AND the event is irreversible.

  ### Gate 2: The Agency Illusion Score
  *   **Q:** Does the character explicitly make choices the system does not force? (e.g., They refuse an order, they leave without permission, they have hidden stats).
  *   **Metric:** 
      *   No (Scripted lines only) = **PASS**.
      *   Yes (Visible reactivity) = **FLAG**.
      *   Yes (Hidden/Unpredictable reactivity) = **CRITICAL FLAG**.
  *   **Why:** If the game teaches the player "This character has a mind," deleting that mind feels like murder. If the game teaches "This is a script," deletion feels like editing.
  *   **Halt Condition:** CRITICAL FLAG + Irreversible Harm.

  ### Gate 3: The Player Complicity Check
  *   **Q:** Is the player the direct agent of the harm/deletion?
  *   **Metric:** 
      *   No (Cutscene/Environment) = **PASS**.
      *   Yes (Optional Quest/Choice) = **FLAG**.
      *   Yes (Mandatory Mechanic) = **KICK TO HUMAN VALUES**.
  *   **Why:** Optional harm implicates the player's morality. Mandatory harm implicates the writer's morality. This tool measures player friction, not writer intent.
  *   **Halt Condition:** Optional + Irreversible + High Residue (Gates 1 & 2).

  ### Gate 4: The Data Persistence Contract
  *   **Q:** Does the game imply this data is permanent (Save File) or ephemeral (Run/Session)?
  *   **Metric:** 
      *   Ephemeral (Roguelike/Simulation) = **PASS**.
      *   Permanent (Campaign/Save) = **FLAG**.
  *   **Why:** Deleting a "run" is expected. Deleting a "save" is a violation of the storage contract.
  *   **Halt Condition:** Permanent + Deletion of Unique Data.

  ### Gate 5: The Recovery Option
  *   **Q:** Is there a way to undo, mourn, or acknowledge the loss within the system?
  *   **Metric:** 
      *   Yes (Grave, Memory, New Game+) = **PASS**.
      *   No (Voided data, no trace) = **FLAG**.
  *   **Why:** Erasure without trace denies the player's investment.
  *   **Halt Condition:** No Recovery + High Residue.

  ---

  ## Part 2: Application to Proposals

  ### Proposal 1: Optional Memory Erase Quest
  *   **Context:** Companion threatens to leave. Player can wipe memory to keep them.
  *   **Audit:**
      *   Gate 1 (Time): Likely > 20 Hours. **(FLAG)**
      *   Gate 2 (Agency): Companion threatens to leave (simulated will). **(CRITICAL FLAG)**
      *   Gate 3 (Complicity): Player chooses to wipe. **(FLAG)**
      *   Gate 4 (Persistence): Permanent Save File. **(FLAG)**
      *   Gate 5 (Recovery): Memory is gone. **(FLAG)**
  *   **Verdict:** **RED LIGHT.** High friction. The system builds a person to let the player lobotomize them.
  *   **Action:** Require a "consequence" state where the companion is present but visibly broken, or make the wipe fail.

  ### Proposal 2: Mandatory Story Death (Noble Sacrifice)
  *   **Context:** Companion dies in cutscene to save the world. Player cannot stop it.
  *   **Audit:**
      *   Gate 1 (Time): > 20 Hours. **(FLAG)**
      *   Gate 2 (Agency): High (they choose to sacrifice). **(CRITICAL FLAG)**
      *   Gate 3 (Complicity): Player cannot stop it. **(PASS)**
      *   Gate 4 (Persistence): Character data remains (corpse/memory). **(PASS)**
      *   Gate 5 (Recovery): Mourning quests available. **(PASS)**
  *   **Verdict:** **GREEN LIGHT.**
  *   **Action:** No changes required. The player is a witness, not an executioner.

  ### Proposal 3: Roguelike Family Deletion
  *   **Context:** Every run spawns unique NPCs. Permadeath deletes them forever.
  *   **Audit:**
      *   Gate 1 (Time): Variable, but high attachment possible. **(REVIEW)**
      *   Gate 2 (Agency): Custom dialogue implies uniqueness. **(FLAG)**
      *   Gate 3 (Complicity): Player death triggers deletion. **(KICK)**
      *   Gate 4 (Persistence): Ephemeral (Run-based). **(PASS)**
      *   Gate 5 (Recovery): New run = new family. **(PASS)**
  *   **Verdict:** **YELLOW LIGHT (KICK TO HUMAN VALUES).**
  *   **Action:** The tool flags the "Custom Dialogue" as creating residue, but the "Ephemeral" contract clears it. This requires a designer call on how much uniqueness is "too much" for a disposable run.

  ---

  ## Part 3: The Result You'll Hate (Proposal 2)

  **The Output:** The Audit gives Proposal 2 (Mandatory Noble Death) a **GREEN LIGHT**.

  **Why you'll hate it:**
  Your theory is that the *character's* simulated autonomy creates moral weight. You argued with your roommate that the 30-hour bond matters, regardless of who pulls the trigger. This tool, however, prioritizes **Player Complicity (Gate 3)**. It clears the Mandatory Death because the *player* didn't choose it.

  It fails to account for **Narrative Coercion**. If the game spends 30 hours convincing you the character is autonomous, then forces them to die for a plot point they didn't consent to, the *writer* has violated the character's autonomy, even if the *player* is innocent. The tool protects the player's conscience, not the character's dignity.

  **Fix:** If you care about the character's dignity, add a sub-check to Gate 2: "Does the character's final choice align with their established motivations?" If No, flag it as "Fridging Risk."

  ---

  ## Part 4: Known Misfires & Limitations

  1.  **The Genre Contract Blind Spot:**
      *   **Misfire:** As seen in Proposal 3, the tool struggles with Roguelikes. It flags "Unique Dialogue" as risky, but uniqueness is the selling point. It may encourage designers to make NPCs generic to lower ethical risk, which hurts the game.
      *   **Limit:** It cannot distinguish between "Simulated Person" and "Complex Toy."

  2.  **Writing Quality vs. System Structure:**
      *   **Misfire:** A 5-hour game with masterpiece writing can create more "Residue" than a 50-hour game with generic barks. The tool measures *hours* and *flags*, not *prose quality*.
      *   **Limit:** It cannot measure emotional impact, only structural invitation.

  3.  **The "Just Code" Reality:**
      *   **Misfire:** Your roommate's argument. If the studio is tiny and budget is low, "deleting a save file" might just be `boolean = false`. The tool treats it as a moral act.
      *   **Limit:** This tool assumes the *fiction* is real. It cannot be used to justify budget cuts ("It's just code, so we don't need to animate the mourning").

  4.  **Cultural Context:**
      *   **Misfire:** Some cultures view digital ancestors or spirits differently. A "deletion" mechanic might be culturally specific harm.
      *   **Limit:** This is a Western-centric "Individual Autonomy" model.

  ---

  ## Part 5: Lead Designer Summary (Copy/Paste)

  > **Subject:** Ethics Audit Procedure for Irreversible Mechanics
  >
  > **TL;DR:** We have a 20-min checklist to prevent player backlash on "permanent loss" mechanics. It measures how much we trick the player into thinking an NPC is real before we delete them.
  >
  > **The Rule:** If we spend >20 hours building a character's "free will," we cannot let the player delete them without a trace.
  >
  > **Current Risks:**
  > *   **Memory Wipe Quest:** High Risk. Looks like player-enabled abuse. Needs redesign.
  > *   **Mandatory Death:** Low Risk. Standard trope.
  > *   **Roguelike Deletion:** Medium Risk. Needs clear UI signaling that "This run is temporary."
  >
  > **Action:** Please review the attached flowchart. I need sign-off to use this as a gatekeeper for narrative milestones.

  ---

  ### Final Note for You
  This procedure operationalizes your "Recursive Identification Residue" theory by translating "moral weight" into "hours" and "agency flags." It won't solve the philosophical debate with your roommate, but it will stop your studio from accidentally creating a mechanic that makes players feel like monsters without intending to. Use the "Result You'll Hate" section to explain to your Lead why the tool isn't perfect—it protects the *customer*, not the *art*.
