      *   *Option 3 (Two-Track Standard):* Most pragmatic. Acknowledges biological differences. Allows salmon to keep their marketable number while protecting shrimp welfare through strict inputs (which the shrimp subcommittee wants anyway). It avoids the aggregation trap.
      *   *Decision:* I need to recommend the **Two-Track Standard** but with a specific caveat regarding the "marketing claim" risk. I also need to address the "moral hazard" objection by emphasizing that input standards *do* reduce suffering even if lifespan is short.
      *   *Refinement:* Actually, looking closer at the prompt, the user wants a recommendation that isn't "mush." A two-track system admits we *can't* aggregate. This aligns with the user's intuition ("I'm fine with a recommendation that says we can't honestly aggregate").
      *   *Action Plan:* Recommend the Two-Track approach. Commit to a review cycle (e.g., 3 years) to see if shrimp metrics improve. Commission/monitor research.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the deadline and the gravity of the decision.
      *   **The Core Problem:** Explicitly name the "Aggregation Problem." This validates the user's insight. Explain why a single number fails (apples vs. oranges, volume vs. intensity).
      *   **Addressing the Objections:**
          *   *Marketing Claim:* Acknowledge that a shrimp score is currently speculative. A two-track system avoids putting a false precision number on shrimp.
          *   *Moral Hazard:* Acknowledge that certification shouldn't just be consumer comfort. Input standards (no eyestalk ablation, humane slaughter) *do* reduce suffering per individual, regardless of lifespan.
      *   **The Recommendation:** Two-Track Standard.
          *   Track A (Finfish): Outcome-based index (Salmon proposal).
          *   Track B (Crustaceans): Input-based compliance (Shrimp proposal).
          *   No aggregation across tracks for a "total score."
      *   **Timeline/Next Steps:**
          *   Vote in 3 weeks.
          *   Implementation date.
          *   Review clause (e.g., 2027) to reassess shrimp sentience metrics.
          *   Research commitment (partner with universities).
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**

