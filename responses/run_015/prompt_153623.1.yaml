  *(Final check on the "Moral Hazard" objection)*: This is tricky. If we certify shrimp, are we just making buyers feel good? The counter-argument is that input standards (no ice slurry) *actually* reduce pain, even if the animal dies young. I need to make sure that argument is clear so the skeptics feel heard.

  *(Final check on "Marketing Claim")*: If we don't give a number, what goes on the bag? "Certified Welfare Compliant" vs "Welfare Score: 85". The memo should clarify that shrimp get a binary pass/fail, not a score. This mitigates the "false precision" risk.

