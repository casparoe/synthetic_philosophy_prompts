answer: |-
  **MEMORANDUM**

  **TO:** Standards Committee, Coastal Aquaculture Certification Alliance (CACA)
  **FROM:** [Your Name], Standards Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Animal-Welfare Module Restructuring (Vote Prep)

  **Executive Summary**

  We have three weeks until the vote on the revised Animal-Welfare Module. We currently face two incompatible proposals: a numeric outcome-based index (championed by the Finfish Subcommittee) and an input-based compliance scheme (championed by the Crustacean Subcommittee).

  After reviewing the technical data and the ethical implications, **I recommend we adopt a Two-Track Standard.** We should implement the numeric index for finfish (salmon) and the input-based compliance scheme for decapods (shrimp), explicitly declining to aggregate them into a single score or "welfare-year" metric at this time. We must also attach a mandatory sunset clause to this decision, requiring a re-evaluation of decapod metrics in 36 months.

  This memo outlines the reasoning behind this recommendation, specifically addressing the aggregation problem, the risk of misleading marketing claims, and the ethical validity of certifying short-lived species.

  **The Core Crux: The Aggregation Problem**

  We have not yet explicitly acknowledged that our two production systems measure welfare in fundamentally different units.
  *   **Finfish:** Low individual count, high individual biomass. Welfare is measurable via physiological outcomes (cortisol, time-to-insensibility).
  *   **Decapods:** High individual count (hundreds per kilo), low individual biomass. Welfare is currently measurable only via behavioral proxies (righting reflex, grooming) which are contested as potential spinal reflexes.

  Any standard that weights by *number of individuals* privileges the shrimp farms. Any standard that weights by *intensity and duration of suffering per individual* privileges the salmon farms. Proposing a unified index with a provisional sentience weight (e.g., 0.3 for shrimp) attempts to solve this mathematically, but it solves it by fiat, not by evidence. It creates a false precision that implies we know the ratio of shrimp suffering to salmon suffering. We do not.

  Adopting a unified number now would not be a standard; it would be a guess dressed as a metric.

  **Addressing Critical Objections**

  Two objections raised during our deliberations require specific accommodation in the final standard.

  **1. The "Marketing Claim" Risk (Shrimp Metrics)**
  *Objection:* Publishing a welfare score for shrimp converts a scientific guess into a marketing claim. Retailers and shoppers will treat a "75/100" as established fact, potentially exposing CACA to accusations of greenwashing if the science shifts.
  *Resolution:* The Two-Track Standard resolves this. Finfish receive a numeric score (auditable, outcome-based). Shrimp receive a binary certification status (Compliant/Non-Compliant) based on input standards (e.g., "No Eyestalk Ablation," "No Ice Slurry Primary Kill"). This allows us to certify welfare improvements in shrimp without assigning a false precision score that implies a level of sentience understanding we do not yet possess.

  **2. The "Moral Hazard" Risk (Lifespan vs. Comfort)**
  *Objection:* Certifying welfare for animals killed at a fraction of their natural lifespan functions primarily to comfort buyers rather than help the animals.
  *Resolution:* This objection holds weight if we focus solely on *lifespan*. However, welfare is also about *quality of death* and *quality of life*. Even if a shrimp lives only 6 months, preventing eyestalk ablation or ensuring electrical stunning before ice slurry reduces the intensity of suffering during that life. An input-based standard guarantees these reductions. We are not certifying that the animal had a "natural life"; we are certifying that its abbreviated life was free of specific, verifiable harms. This distinguishes our label from mere consumer comfort; it mandates tangible process changes.

  **Recommendation: The Two-Track Standard**

  I propose we vote to structure the module as follows:

  1.  **Track A (Finfish):** Adopt the outcome-based numeric index (0–100). Metrics include time-to-loss-of-consciousness, stocking density, and fin-lesion prevalence. This satisfies the auditability and marketability requirements for salmon producers.
  2.  **Track B (Crustaceans):** Adopt the input-based compliance scheme. Metrics include prohibited practices (eyestalk ablation, specific slaughter methods) and equipment specifications. No numeric score is generated for public-facing materials; the product is either "CACA Welfare Certified" or it is not.
  3.  **No Aggregation:** We explicitly state in the standard documentation that scores from Track A and Track B are not comparable and will not be combined into a facility-level aggregate.

  **Timeline and Next Steps**

  To ensure this is not a permanent stagnation but a pragmatic pause, I recommend the following commitments be tied to the vote:

  *   **Immediate (Post-Vote):** Drafting team to finalize the input specifications for Track B, ensuring they are as rigorous as the outcome metrics in Track A.
  *   **Research Commitment (Year 1–2):** CACA will allocate a portion of certification fees to fund or commission independent behavioral research regarding decapod nociception vs. sentience. We need to move beyond the "grooming reflex" debate. The committee vet should lead a working group to review emerging literature on crustacean affect.
  *   **Mandatory Review (Month 36):** The standard automatically triggers a review clause in three years. At that point, we reassess Track B. If robust outcome metrics for decapods exist, we move to a unified index. If not, we renew the input-based scheme.

  **Conclusion**

  We are in a position where doing nothing drops half our producers from the program, but doing the "easy" thing (a unified number) risks our scientific integrity. The Two-Track Standard acknowledges the biological reality that we can measure welfare differently in different taxa without pretending the measurements are equivalent.

  It allows the salmon producers to keep their marketable index. It allows the shrimp producers to remain certified while implementing genuine welfare improvements (no ablation, humane slaughter). It protects the Alliance from the claim that we are selling numerology as science.

  I ask that we use the next three weeks to refine the input specifications for the shrimp track so that they are as rigorous as the salmon outcomes. We can vote on this framework on [Date of Vote].

  Please review this proposal and come prepared to discuss the specific input metrics for Track B. We cannot let the inability to aggregate become an excuse to abandon half our industry, nor should it become an excuse to publish false precision.

  Regards,

  [Your Name]
  Standards Committee Member
