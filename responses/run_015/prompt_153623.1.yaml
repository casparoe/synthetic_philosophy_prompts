          *   *Shrimp Group:* Says numeric indices are meaningless for decapods (too small, proxies unreliable). Wants input-based scheme (prohibited practices, equipment specs).
          *   *Aggregation Problem:* Shrimp = high volume/low individual weight; Salmon = low volume/high individual weight. Weighting by individuals vs. intensity changes rankings drastically.
          *   *Proposed Solutions:*
              1.  Unified index with sentience weight (e.g., 0.3 for shrimp).
              2.  Two-track standard (Outcome for finfish, Input for shrimp).
              3.  Hold on decapod certification.
      *   **Specific Objections to Address:**
          1.  Publishing a shrimp score turns a guess into a marketing claim (greenwashing risk).
          2.  Certifying short-lived animals might just comfort buyers rather than help animals (moral hazard).
