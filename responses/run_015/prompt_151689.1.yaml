answer: |-
  Your gut is doing better philosophy than your mate's textbook logic. Your mate is stuck on **formal logic** (where equivalence is absolute), but you are intuitively doing **epistemology and statistics** (where evidence depends on context, method, and probability).

  There is a single principle that validates almost all your verdicts, explains the local vs. universal difference, and solves the text message puzzle. It requires dropping exactly one of your intuitions (the apple vs. shoe distinction).

  ### The Principle: **The Risky Sampling Rule**

  > **An observation confirms a hypothesis only to the degree that the *method of selection* could have reasonably produced a counter-example, and the observation was not guaranteed by background knowledge or selection bias.**

  In Bayesian terms: Evidence $E$ confirms Hypothesis $H$ only if $E$ is more likely to occur if $H$ is true than if $H$ is false, **given the procedure used to find $E$.**

  Here is how this principle handles your case-by-case verdicts.

  ---

  ### 1. The Black Raven (Park) vs. The Museum Raven
  *   **Your Verdict:** Park confirms (barely); Museum confirms nothing.
  *   **The Principle:** In the park, the sampling method is "Look at a bird." If the hypothesis ("All ravens are black") were false, there is a non-zero chance you would have seen a non-black raven. The observation survived a risk.
  *   **In the Museum:** The sampling method is "Look at a curated display of black birds." The curator's rules guarantee you see a black bird regardless of whether all ravens in nature are black. There was **zero risk of falsification**.
  *   **Result:** Your gut is right. The museum raven is logically consistent with the hypothesis, but it provides zero *confirmation* because the test wasn't risky.

  ### 2. The Intentional Sneaker vs. The Random Sneaker
  *   **Your Verdict:** Intentional search is cheating (0 confirmation); Random grab counts a bit.
  *   **The Principle:**
      *   **Intentional:** Your mate said, "I am looking for something not-black." If he finds a white sneaker, this was guaranteed to happen whether ravens are black or not. The likelihood of finding a non-black object is 100% under both the True and False hypothesis. Likelihood ratio = 1. No confirmation.
      *   **Random:** He grabbed "the first thing in the garage." This object *could* have been a black raven (if one was in the garage). By turning out to be a white sneaker, it eliminated one potential slot where a counter-example could have hid.
  *   **Result:** Your gut is right. Method matters more than the object itself.

  ### 3. The Accumulation Problem (Why aren't we certain?)
  *   **Your Verdict:** If shoes count, we should be certain by now. We aren't.
  *   **The Principle:** Confirmation is about **probability shift**, not just binary counting.
      *   The population of "Non-Black Things" in the universe is effectively infinite (dust, stars, shoes, apples).
      *   Finding one white shoe eliminates $1 / 10,000,000,000,000$ of the places a non-black raven could hide.
      *   Finding one black raven eliminates $1 / 100,000$ of the places a non-black raven could hide (since the population of ravens is small).
  *   **Result:** The shoe *does* confirm, but the amount is so infinitesimally small (e.g., $0.00000000001\%$) that your brain correctly rounds it down to "nothing." You don't need to drop the intuition that it counts "a tiny bit," but you must accept that "tiny" means "statistically negligible."

  ### 4. Local vs. Universal Claim
  *   **Your Verdict:** A white shoe in the county confirms "All ravens in the county are black" more than the universal claim.
  *   **The Principle:** This is the strongest point in your favor. It comes down to **Reference Classes**.
      *   **Universal:** The reference class is "All things in the universe." A shoe is a drop in the ocean.
      *   **Local:** The reference class is "All things in the county." The ratio of (Non-Black Things) to (Ravens) is much smaller. A white shoe in the county represents a much larger chunk of the "Non-Black Things in the County" population than a shoe does of the universe.
  *   **Result:** Keep this intuition. It is statistically robust. The smaller the reference class, the more weight each non-black non-raven carries.

  ### 5. The Text Message Case
  *   **Your Verdict:** Your rule says it should confirm, but it feels wrong.
  *   **The Principle:** Apply **Risky Sampling**.
      *   The text says: "I'm looking at something and it's definitely not black."
      *   **Missing Data:** Did he check if it was a raven?
      *   **Scenario A:** He picked a random object, checked color (Not Black), checked species (Not Raven), then texted you. **This confirms.** It was a risky sample; it could have been a non-black raven.
      *   **Scenario B:** He picked a random object, checked color (Not Black), and *didn't bother checking species* because he assumes shoes aren't ravens. **This does not confirm.** You haven't tested the raven variable.
      *   **Scenario C:** He looked *for* a non-black object to text you about. **This does not confirm.** (See Intentional Sneaker above).
  *   **Result:** Your discomfort comes from ambiguity. If the text implies he *selected for non-blackness* (Scenario C) or *ignored the species* (Scenario B), your rule holds: it confirms nothing. If it was a genuine random check of both properties, it confirms a negligible amount.

  ### 6. The One Intuition You Must Drop: Shoe vs. Apple
  *   **Your Verdict:** Shoe confirms a bit; Apple confirms less/nothing.
  *   **The Principle:** Logically and statistically, **they are identical.**
      *   Both are non-black.
      *   Both are background-known to be non-ravens with near 100% certainty.
      *   Neither poses a risk of being a raven.
  *   **Why they feel different:** This is a cognitive bias called **Salience**. Apples are organic; shoes are manufactured. You might subconsciously feel apples are "closer" to nature (and thus birds) than shoes are. Or, you might think apples rot/change color, making them less stable evidence.
  *   **Result:** You have to sacrifice this one. There is no principled difference between a white shoe and a green apple in this context. If one confirms, the other does equally.

  ---

  ### Summary of the "Risky Sampling" Rule

  To settle the argument with your mate, tell him this:

  1.  **Logic vs. Evidence:** He is right about *logic* (the statements are equivalent), but wrong about *evidence* (confirmation depends on how data is gathered).
  2.  **The Weight of Evidence:** A black raven is heavy evidence because ravens are rare. A white shoe is feather-light evidence because non-black things are ubiquitous. They are not "just as much" as he claims.
  3.  **The Cheating Clause:** If you select *for* the evidence (looking for non-black things, or curated museum birds), the confirmation drops to zero because you removed the risk of falsification.
  4.  **The Verdict:** Your gut is scientifically sound. You are intuitively applying Bayesian reasoning (updating probabilities based on sampling methods), while he is applying Aristotelian logic (binary truth values).

  **Final Answer to your Rule:** Your stab ("result could have come out the other way") is 90% correct. To fix the text message problem, refine it to: **"An observation only confirms if the *procedure* could have produced a falsifying result, and the observer actually checked for both variables (Color and Species)."**
