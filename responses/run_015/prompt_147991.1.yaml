answer: |-
  Moral education fails when the dramatic weight of a flaw obscures the quiet work of redemption, forcing a choice between inapplicable ideals and misleading truths.

  Biographer Elena holds the manuscript for Mara, a housing activist who once sacrificed a junior organizer to police scrutiny to secure a landmark bill, then spent decades anonymously funding that colleague's legal defense and career restart. If Elena publishes the critical truth, the drama of the betrayal captivates readers so thoroughly that they view Mara as a ruthless pragmatist, overlooking her quiet restitution. If Elena omits the flaw to preserve Mara's exemplarity, the resulting portrait is so morally seamless that aspiring activists dismiss it as mythic impossibility rather than a guide for action.

  The exemplarist view argues that morality is learned through imitation, so the hagiographic version is superior because it provides a clean template for emulation, whereas the critical view contends that moral understanding requires navigating failure, making the truthful account essential for resilience. The structural feature driving this split is the asymmetry of moral attention: negative acts possess a narrative gravity that positive reparations lack, causing readers to fixate on the sin in the critical version and the distance from humanity in the hagiographic version. If you remove the betrayal's narrative pull—making the sacrifice mundane rather than dramatic—the critical version succeeds because the reader's attention shifts to the sustained virtue of the amends. A defender of the hagiographic side would attack the critical case by arguing that it is socially dangerous to provide a blueprint for betrayal without guaranteeing the restitution, as readers are more likely to mimic the exciting flaw than the boring repair, resulting in a net moral loss for the community.
