answer: |-
  # Handout: The Nonidentity Structure in Clinical Contexts

  ### The Cases

  **Case A (The Nonidentity Rota)**
  A fertility clinic offers a "Rapid" culture protocol that reduces incubation time by four weeks but carries a 0.5% risk of a specific mitochondrial mutation causing lifelong, manageable metabolic fatigue. A "Standard" protocol eliminates this risk but requires a four-week delay. Due to gamete turnover, the child conceived in the Rapid cycle (Child 1) is numerically distinct from the child conceived in the Standard cycle (Child 2). The clinic chooses Rapid. Child 1 is born with the fatigue condition but reports their life is worth living and prefers existence to non-existence.
  *Constraint Check:* No existing person is harmed by the choice (the patients are the parents, not the children). No appeal to rights of merely possible people (Child 2 has no rights). The condemnation rests solely on the creation of Child 1 in an impaired state rather than Child 2 in a healthy state.

  **Case B (The Fixed-Identity Rota)**
  The clinical setup is identical to Case A (Rapid vs. Standard protocol, 0.5% risk, same severity of fatigue), but the patient is already six weeks pregnant. The protocol choice now affects an existing embryo that will develop into the same specific child regardless of the delay. The clinic chooses Rapid. The child is born with the fatigue condition.
  *Constraint Check:* Identity is fixed. The alternative (Standard) results in the *same* child existing without the impairment.

  **Case C (The Resource Trade-Off)**
  The setup returns to Case A's nonidentity structure (Rapid creates Child 1 with risk; Standard delays to create Child 2 safely). However, the Rapid protocol is significantly cheaper. Using Rapid allows the clinic to fund life-improving treatment for ten existing patients with chronic pain. Using Standard requires cancelling those ten treatments to cover the cost. Total welfare is higher under Rapid. The clinic chooses Rapid. Child 1 is born with the fatigue condition.
  *Constraint Check:* The "cost" of the Safe option falls on existing people (the ten patients lose treatment). The "cost" of the Risky option falls on Child 1 (who is not worse off than in the alternative).

  ***

  ### The Theories

  **(i) Impersonal Total View**
  Outcomes are ranked solely by the sum total of well-being contained within them. The identity of the individuals contributing to that sum is morally irrelevant; we ought to choose the outcome with the highest aggregate welfare.

  **(ii) Narrow Person-Affecting View**
  An act is wrong only if it makes some *particular* person worse off than they would otherwise have been. If an act brings a person into existence with a life worth living, that person cannot complain they were harmed, as the alternative was non-existence.

  **(iii) The Placeholder View**
  The wrong is not about which specific individual ends up in the role, but about the prospect the agent hands to whoever will occupy the position "the child conceived this cycle." This position is fixed by the agent's decision frame, even if the occupant varies. It is wrong to assign a high-risk prospect to this role, regardless of whether the resulting occupant is harmed comparatively.

  ***

  ### Verdicts and Reasoning

  | Case | (i) Total View | (ii) Person-Affecting | (iii) Placeholder |
  | :--- | :--- | :--- | :--- |
  | **A** | **Condemn.** The outcome with Child 2 (healthy) contains more welfare than Child 1 (impaired). Identity is irrelevant. | **Permit.** Child 1 is not worse off than they would have been (non-existence). No existing people are harmed. | **Condemn.** The agent assigned a risky, impaired prospect to the role "child of this cycle." |
  | **B** | **Condemn.** The outcome with the healthy child contains more welfare than the impaired child. | **Condemn.** The specific child is made worse off (impaired) than they would have been (healthy) under the Standard protocol. | **Condemn.** The agent assigned a risky prospect to a specific, identifiable future person. |
  | **C** | **Permit/Require.** The welfare gain for the ten existing patients outweighs the loss from Child 1's impairment. | **Permit.** Child 1 is not worse off (vs. non-existence). The ten patients are better off (vs. losing treatment). No one is worse off. | **Condemn.** Benefits to others do not negate the wrong of assigning a risky prospect to the child-role. |

  ***

  ### Structural Analysis

  **The Single Feature Doing the Work**
  The divergence in Case A rests entirely on **identity-dependence**. In Case A, the alternative action changes *who* exists; in Case B, it changes *how* a specific person exists. This is why Theory (ii) flips from Permit (A) to Condemn (B), while (i) and (iii) remain stable.

  **Counterfactual 1: Certainty vs. Risk**
  If the outcome in Case A were certain (100% impairment) rather than risky (0.5%), Theory (iii) does **not** collapse into Theory (ii). Theory (ii) still permits the act because the child is not comparatively worse off than non-existence. Theory (iii) still condemns the act because the agent still assigned a bad state to the role "child of this cycle." The "prospect" becomes a "guarantee," but the structural wrong (imposing a burden on the role) remains distinct from the comparative harm.

  **Counterfactual 2: Removing Identity-Dependence**
  If you strip identity-dependence from Case A (making it Case B), Theory (ii) **converges** with (i) and (iii). Once the same child exists in both alternatives, the "worse off" condition is met, and the Person-Affecting View loses its distinctive permissiveness.

  ***

  ### Best Attacks

  **From a Defender of (i) Total View:**
  "Your Placeholder View (iii) is fetishizing identity. In Case C, you condemn an action that maximizes total welfare and harms no one comparatively, simply because of a metaphysical technicality about 'roles.' If the total sum of happiness is higher in Rapid, and Child 1 has a life worth living, insisting on the Standard protocol is wasteful moralizing that actively hurts the ten existing patients for no gain."

  **From a Defender of (ii) Person-Affecting View (The Thursday Night Objection):**
  "In Case A, your condemnation is incoherent. To say the clinic did wrong is to say they should have done otherwise. But if they had done otherwise, Child 1 would not exist. So you are claiming the clinic should have prevented Child 1 from existing. But Child 1 prefers existing. On what grounds can you claim a person is 'wronged' by being given the only life they can possibly have? You are smuggling in a 'right to be born healthy' that implies a 'right to be born,' which is nonsensical. If no one is worse off, there is no victim, and if there is no victim, there is no crime."

  ***

  ### How to Answer the (ii)-Defender
  The (ii)-defender assumes morality must be grounded in *comparative harm to individuals*. The Placeholder View rejects this. The answer is: "The wrong isn't that Child 1 is worse off than Child 1 *could have been*. The wrong is that the agent exercised a power to determine the *conditions of entry* for whoever would fill the child-role, and they set those conditions unacceptably low. We can criticize the *choice of protocol* without claiming the *resulting child* was harmed. We are judging the agent's imposition of risk on the position, not the comparative welfare of the occupant."
