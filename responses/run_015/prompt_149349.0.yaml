      *   *The Phenomenon:* Color Phi. Red dot, then Green dot. Perceived as one dot moving and changing color *between* the stimuli.
      *   *The Puzzle:* How can the perception of the color change happen *before* the second stimulus arrives?
      *   *Orwellian (Dennett's label, though he rejects the dichotomy):* Experience happens one way, memory is rewritten later. (History is revised).
      *   *Stalinesque:* Experience is fabricated later to match the new data. (Show trial is staged).
      *   *Dennett's View:* The distinction is meaningless because "conscious experience" isn't a single timestamped event in the brain. It's a distributed process (Multiple Drafts Model).
      *   *Opposing View (e.g., Chalmers, Block, some neuroscientists):* There *is* a fact of the matter about when qualia occur, even if hard to measure.

  3.  **Evaluate the User's Hunches:**
      *   *Hunch (i) Datum:* Yes, this is part of it. Dennett treats the report as behavior to be explained. Realists treat the report as a window into a private theater.
      *   *Hunch (ii) Presupposition:* This is the stronger point. The assumption is that "consciousness of X" is a point-event with a precise timestamp $t$. If consciousness is a process extended in time, or if the "content" isn't fixed until a later stabilization, the question "when did it happen?" becomes category-error-ish.

  4.  **Evaluate the Proposed Experiments:**
      *   *Probe 1 (Speeded Forced Choice):* If they press "green" before the green dot appears, does that prove the experience was green *then*?
          *   *Counter:* Dennett would say this just proves the *discriminative state* was green. It doesn't prove *phenomenal* consciousness was green at that timestamp. It conflates access consciousness with phenomenal consciousness.
      *   *Probe 2 (Congruency/Interference):* Similar issue. Stroop-like effects show processing, not necessarily phenomenal timing.
      *   *Verdict:* These experiments measure *neural/functional commitment*, not *phenomenal timing*. They re-import the assumption that functional commitment = conscious experience time.

