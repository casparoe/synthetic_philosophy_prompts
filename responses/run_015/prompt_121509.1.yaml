      *   *Fix:* Acknowledge why it feels intuitive (the "real work" is done by particles). Counter with the idea that "work" is defined by the system's organization, which $M$ captures.
      *   *Check:* Did I use the Sofia/Bus example? Yes, ensure it's woven in.
      *   *Check:* Did I address the "Strong vs. Weak Closure" point? Yes, in the intro/setup.

  7.  **Final Polish:** Ensure the tone is collaborative but rigorous, acting as the devil's advocate turned defender. (Proceed to generate output based on these thoughts).

  *(Self-Correction Note)*: I need to make sure I don't just say "Interventionism solves it." I need to specifically address the *filter* problem for promiscuity. The user thinks standard filters look like exclusion. I need to argue why an *invariance/stability* filter is distinct from exclusion. Exclusion says "N is the *only* cause." Invariance says "M is the *best* cause for this contrast." That's the key difference.

  Also, on Inheritance: The user worries $M$ is "causally relevant but not efficacious." I need to collapse that distinction. If you are relevant in the right way (difference-making), you are efficacious.

  Let's write.
answer: |-
  This is a sophisticated pivot. You are essentially advocating for a **compatibilist interventionist** solution to the exclusion problem, likely drawing from the lineage of Woodward, Hitchcock, and Yablo, but you want to push past the standard "proportionality" reply because you suspect it smuggles exclusionary premises back in.

  Here is the argument for the side you want to stick to: **Non-Reductive Physicalism (NRP) is secure because causation is a relation between variables within a model, not a competition between substances in the world.** The exclusion argument fails because it treats $M$ and $N$ as rival bidders for a single causal slot, when they are actually candidates at different levels of granularity for describing the *same* causal relation.

  We will grant your setup: $M$ (Sofia's want-belief complex) supervenes on $N$ (neural state), and $N$ is physically sufficient for $E$ (arm raising). We will defend the claim that $M$ causes $E$ without overdetermination, focusing heavily on your two sticking points: **Promiscuity** and **Inheritance**.

  ---

  ### 1. The Promiscuity Objection: Filtering Without Excluding

  **The Objection:**
  If causation is just counterfactual dependence or difference-making, then causation becomes promiscuous. $N$ causes $E$. But so does "$N$-or-$Q$" (where $Q$ never happens). So does "$N$-at-3pm." So does "The state an ideal predictor would forecast." If we accept $M$ as a cause because it makes a difference, we seem forced to accept these gerrymandered properties as causes too.
  The standard fix is **Proportionality** (Yablo): A cause must be specific enough to necessitate the effect but general enough to be required by it. $M$ is proportionate; $N$ is too specific; "$N$-at-3pm" is too loose.
  **Your Worry:** Isn't "Proportionality" just Exclusion in disguise? It looks like we are filtering out $N$ (or the junk) because it's "not the right kind of cause," which smells like we are privileging the mental or arbitrarily cutting out the physical. How do we keep $M$ without smuggling in a bias against the physical?

  **The Defense: Explanatory Invariance, Not Metaphysical Proportionality**
  To avoid smuggling in exclusion, we must shift from a metaphysical filter (what *is* a cause) to a methodological one (what *counts* as a cause relative to a contrast class). The filter is **Invariance under Relevant Perturbations**.

  Causation is contrastive: $M$ rather than $M^*$ causes $E$ rather than $E^*$. But which contrasts matter? We select the causal variable that remains **stable** across the set of possible worlds relevant to our explanatory interest.

  **The Test Case: Sofia and her Counterpart**
  Let's apply this to your variable-realization case.
  *   **Sofia:** Has mental state $M$, realized by neural state $N_1$. Effect $E$ (arm up).
  *   **Counterpart:** Has mental state $M$, realized by neural state $N_2$ (different wiring). Effect $E$ (arm up).

  **Candidate 1: $N_1$ (Sofia's specific neural state)**
  *   *Test:* If we intervene to change $N_1$ to $N_2$ (keeping $M$ fixed), does $E$ change?
  *   *Result:* No. $E$ remains "arm up."
  *   *Verdict:* $N_1$ is **too specific**. It fails the invariance test across the relevant realization space. It makes a difference only if we restrict our attention to worlds where Sofia's biology is fixed. But if we care about *why the arm went up* in a way that explains the behavior, $N_1$ is fragile.

  **Candidate 2: "$N$-at-3pm" (The Junk Property)**
  *   *Test:* If we intervene to change the time to 4pm (keeping $M$ fixed), does $E$ change?
  *   *Result:* No.
  *   *Verdict:* This property is **irrelevant**. It fails to track the *variation* in $E$. While it is technically true that "If it weren't 3pm (and $N$ didn't happen), $E$ wouldn't happen," the property "3pm" does not track the *mechanism* of the arm raising. It is invariant, but it is not a **difference-maker for the specific contrast** of "Arm Up vs. Arm Down." It is a background condition, not a causal variable in the model of motor control.

  **Candidate 3: $M$ (The Want-Belief)**
  *   *Test:* If we intervene to change $M$ to $M^*$ (want to stay seated), does $E$ change?
  *   *Result:* Yes. $E$ becomes "arm down."
  *   *Crucially:* This holds whether the realizer is $N_1$ or $N_2$.
  *   *Verdict:* $M$ is **invariant** across the neural variations that preserve the psychology.

  **Why this isn't Exclusion Smuggled In:**
  The exclusion argument says $N$ *excludes* $M$ because $N$ is the *only* sufficient physical cause. The Invariance filter does not say $N$ is *not* a cause. It says $N_1$ is a cause *relative to a micro-contrast class* (e.g., "Why did the arm go up *at this exact millisecond with this exact muscle tension*?"), while $M$ is a cause *relative to a behavioral contrast class* (e.g., "Why did she hail the bus?").

  We are not filtering $N$ out because it is physical. We are filtering it out (for the purpose of explaining behavior) because it is **unstable** relative to the question asked. If the question were "Why did the neurons fire?", $N$ would be the proportionate cause and $M$ would be too coarse. This is not metaphysical exclusion; it is **explanatory contextualism**. $M$ keeps its seat at the table not by pushing $N$ out, but by sitting at a different table (the table of behavioral explanation).

  ---

  ### 2. The Inheritance Objection: Borrowed Power vs. Genuine Efficacy

  **The Objection:**
  Even if we grant $M$ makes a difference, isn't that difference-making power **borrowed** from $N$? $M$ only makes a difference because $N$ makes a difference. If $N$ didn't do the work, $M$ couldn't. Therefore, $M$ is causally *relevant* (it tracks the cause) but not causally *efficacious* (it doesn't *do* the work). This looks like epiphenomenalism with better PR: you get to say "$M$ causes $E$" is true, but the metaphysical heavy lifting is still done entirely by the physical base.

  **The Defense: Rejecting the "Causal Fluid" Model**
  The Inheritance objection relies on a tacit premise: **The Conservation of Causal Oomph.** It assumes causation is a kind of energy or fluid that flows from cause to effect, and if $N$ provides 100% of the fluid, $M$ provides 0%.

  To defend NRP, you must reject this ontology. Causation is not a fluid; it is a **structural relation of dependence**.

  **Argument A: Realization is Constitution, Not Delegation**
  When $N$ realizes $M$, $M$ does not stand behind $N$ pulling its strings (which would be dualism), nor does $M$ stand beside $N$ as a shadow (epiphenomenalism). $M$ is *constituted* by $N$ in the same way a check is constituted by paper and ink.
  *   *Analogy:* Does the check "borrow" its power to transfer funds from the paper? No. The paper *is* the check in this context. If the paper didn't exist, the check wouldn't. But the causal power to clear a debt belongs to the *check* (the institutional object), not the *paper* (the physical substrate). The bank teller doesn't care about the cellulose; they care about the signature and amount.
  *   *Application:* $N$'s power to raise the arm *just is* $M$'s power to raise the arm, described at a different resolution. To say $M$ "borrows" power implies $M$ and $N$ are separate entities competing for a resource. They are not. They are the same event/token under different descriptions. If $N$ is efficacious, and $M$ = $N$ (token identity), then $M$ is efficacious. The NRP claim is that $M$ is a *property* of that token, and that property is the one that tracks the effect across the relevant counterfactuals (as shown in the Promiscuity section).

  **Argument B: The Truth-Conditional Difference**
  You worry this is "Epiphenomenalism with better PR." It is not, because the truth conditions differ.
  *   **Epiphenomenalism:** The counterfactual "If $M$ had not occurred (and $N$ varied accordingly), $E$ would not have occurred" is **False**. (Because $N$ would still cause $E$ via some other route, or $M$ is inert).
  *   **NRP (Interventionist):** The counterfactual "If $M$ had not occurred (via an intervention that sets $M$ to $M^*$), $E$ would not have occurred" is **True**.

  Why isn't this just "borrowing"? Because in an interventionist framework, **to make a difference is to be a cause.** There is no "deeper" layer of efficacy behind difference-making. If you intervene on $M$ (by manipulating the supervenience base to change $M$), $E$ changes. That is the definition of efficacy.
  If the Inheritance objector says, "Yes, but $N$ is *really* doing it," they are asking for a notion of causation that is *non-difference-making*. They want a "production" or "transference" account. But if they accept physicalism, they must accept that physical production is just complex counterfactual dependencies. If $M$ captures the stable dependencies, $M$ captures the production.

  **Argument C: Multiple Realizability as Power, Not Weakness**
  The Inheritance objection suggests $M$ is weak because it depends on $N$. But consider the variable-realization case again.
  *   $N_1$ causes $E$.
  *   $N_2$ causes $E$.
  *   $M$ causes $E$.
  If $M$ were merely borrowing power, it would be limited to the power of the specific $N$ present. But $M$ has a **modal reach** that no single $N$ has. $M$ supports counterfactuals that $N_1$ cannot (e.g., "If Sofia had a slightly different brain chemistry but the same desire, she would still raise her arm").
  $N_1$ cannot support that counterfactual. Therefore, $M$ possesses causal powers (specifically, **modal stability**) that $N_1$ *lacks*. $M$ is not borrowing $N$'s power; $M$ is **aggregating** the causal potential of all its possible realizers. This makes $M$ *more* than a shadow; it makes $M$ a robust causal variable that $N$ (at the specific level) cannot replace.

  ### Summary of the Defense

  1.  **On Sufficiency:** The Exclusion Argument fails because "N suffices for E" is only true in a model where $M$ is held fixed or ignored. In a model where we intervene on $M$, $N$ varies with it. You cannot intervene on $N$ without intervening on $M$ (given supervenience), so the "independent sufficiency" required for exclusion is impossible to test.
  2.  **On Promiscuity:** We filter causes not by metaphysical exclusion (physical vs. mental) but by **Explanatory Invariance**. $M$ is the cause of behavior because it is the variable that remains stable across neural realizations. "$N$-at-3pm" is rejected not because it's non-physical, but because it doesn't track the variation in $E$.
  3.  **On Inheritance:** We reject the "Causal Fluid" model. Efficacy *is* difference-making. Since $M$ supports counterfactuals that specific $N$ states cannot (due to multiple realizability), $M$ has genuine causal power that is not merely borrowed, but emergent in its modal stability.

  This allows you to keep Non-Reductive Physicalism: $M$ is distinct from $N$ (as a property), $M$ causes $E$, and $N$ causes $E$, without overdetermination, because they are not competitors—they are the **same causal process** described at the levels of granularity required for psychology and neuroscience respectively.
