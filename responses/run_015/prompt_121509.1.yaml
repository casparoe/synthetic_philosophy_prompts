prompt: |-
  I keep going back and forth on the causal exclusion argument and I want someone to argue the side I cant quite make stick. Setup so were using the same terms: if a mental cause M (Sofia's wanting to hail the bus plus her believing that raising her arm will do it) is distinct from the neural realizer N, and N is all by itself sufficient for the effect E (arm goes up), then M either overdetermines E or is excluded by N; systematic overdetermination is supposedly miraculous, so M is excluded, and the non-reductive physicalist is left choosing between identity theory and epiphenomenalism.

  The move I want defended: the argument only looks sound because "N suffices for E" is ambiguous between two closures. Theres the weak one physicalists actually accept — every physical event that has a cause has a sufficient physical cause, no dangling causes from outside the physical domain — and the strong one the argument needs: N suffices for E regardless of what M is doing, i.e. under an intervention on N that leaves M free to vary. Supervenience is precisely what makes the strong reading unavailable. So: argue that once causation is understood as contrast- and class-relative difference-making, M and N aren't competing for a single causal slot, and the non-reductive physicalist keeps real mental causation without paying for it in overdetermination.

  But spend most of the effort on two objections I keep getting stuck on. First, promiscuity: on a contrastive story, tons of coarse-grained properties of N start looking like causes of E too — N's happening at 3pm, N's being a state an ideal predictor would have forecast, and so on — and the usual filter ("only proportionate or projectible properties count") looks like exclusion smuggled back in. Give me a principled filter that keeps M and throws out the junk, and test it on a variable-realization case: Sofia and a differently wired counterpart realize the same want-belief pair with different neural states and both raise their arms. Second, inheritance: even granting M makes a difference, isn't its difference-making power just borrowed from N, leaving M causally relevant but not genuinely efficous? Why isn't that just epiphenomenalism with better PR?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** The Causal Exclusion Argument (Kim-style) against Non-Reductive Physicalism (NRP).
      *   **User's Position:** They want to defend NRP by arguing that the exclusion argument relies on an ambiguity in "sufficiency" (weak vs. strong closure) and that a contrastive/difference-making account of causation allows $M$ and $N$ to coexist without overdetermination.
      *   **Specific Task:** Argue the side the user finds difficult to stick to (the defense of NRP via contrastive causation).
      *   **Key Constraints:**
          *   Use the provided setup ($M$, $N$, $E$, Sofia, bus, arm).
          *   Focus *most* of the effort on two specific objections:
              1.  **Promiscuity:** Contrastive accounts make *too many* things causes (e.g., $N$ at 3pm). Need a principled filter that keeps $M$ but rejects junk, tested on a variable-realization case.
              2.  **Inheritance:** Even if $M$ makes a difference, isn't it just borrowing power from $N$? Is this just epiphenomenalism with better PR?
      *   **Tone:** Philosophical, rigorous, argumentative (defending the specific move requested).

  2.  **Deconstruct the Core Argument (The "Move"):**
      *   *Premise:* Exclusion relies on $N$ being sufficient for $E$ *independently* of $M$.
      *   *Counter:* Supervenience means you can't intervene on $N$ while holding $M$ fixed (or vice versa) in the way required for the "strong" sufficiency claim.
      *   *Framework:* Causation as difference-making (interventionist/contrastive).
      *   *Goal:* Show $M$ causes $E$ and $N$ causes $E$, but they don't compete.

  3.  **Address Objection 1: Promiscuity (The "Too Many Causes" Problem):**
      *   *The Problem:* If causation is just counterfactual dependence, then $N$'s occurring at 3pm, $N$'s being distinct from $N^*$, etc., might all count as causes. This trivializes causation.
      *   *The Standard Fix:* Proportionality (Yablo) or Projectibility.
      *   *User's Worry:* Isn't "proportionality" just exclusion in disguise? (i.e., we filter out $M$ because it's not "physical enough" or filter out $N$ because it's "too specific"?).
      *   *The Defense:* Need a filter based on *explanatory relevance* within a specific causal model, not metaphysical exclusion.
      *   *The Variable-Realization Test:* Sofia (Neural state $N_1$) vs. Counterpart (Neural state $N_2$). Both have $M$. Both do $E$.
      *   *Argument:* $M$ is the *stable* difference-maker across the relevant contrast class. $N_1$ is too specific (fails in the counterpart case). $N$-at-3pm is irrelevant (doesn't track $E$ across the relevant contrasts).
      *   *Principled Filter:* **Invariance/Stability under relevant perturbations.** We choose the level of granularity that remains invariant across the set of possible worlds we care about for the explanation. $M$ is invariant across $N_1/N_2$; $N_1$ is not. "3pm" is invariant but irrelevant (doesn't track the *change* in $E$).
      *   *Avoiding Exclusion Smuggling:* The filter isn't "must be physical." It's "must be the *right* difference-maker for the question asked."

  4.  **Address Objection 2: Inheritance (The "Borrowed Power" Problem):**
      *   *The Problem:* If $M$ supervenes on $N$, and $N$ does the work, isn't $M$ just a shadow? If $N$ were different, $M$ would be different. So $N$ is the real driver.
      *   *The Defense:* Distinguish *ontological dependence* from *causal efficacy*.
      *   *Analogy:* The check and the payment. The check (paper) realizes the payment. The payment causes the debt to clear. Does the payment "borrow" power from the paper? No, the paper *constitutes* the payment in this context.
      *   *Key Distinction:* Epiphenomenalism says $M$ makes *no* difference. If we establish $M$ makes a difference (via the contrastive account), it is efficacious.
      *   *The "Borrowing" Charge:* This assumes a "conservation of causal oomph" model (causal power as a fluid). Reject that model. Causal power is structural/relational.
      *   *Argument:* $M$'s power isn't borrowed; it's *realized*. Realization isn't delegation; it's identity-in-context. If $M$ tracks $E$ better than $N$ (due to multiple realizability), $M$ has *more* claim to being the cause in that context, not less.
      *   *Rebuttal to "Better PR":* Epiphenomenalism says $M \to E$ is false. NRP says $M \to E$ is true. That's a truth-conditional difference, not PR.

  5.  **Structure the Response:**
