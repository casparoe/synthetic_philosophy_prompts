prompt: |-
  Compare the internalist and externalist positions in the debate over normative reasons for action, focusing on the following dialectical asymmetry. Internalists, following Bernard Williams, argue that externalists face an insuperable explanatory burden: they cannot account for how a reason that fails to connect to any element of an agent's subjective motivational set could genuinely be a reason for that agent. Externalists, in turn, argue that internalism cannot accommodate the categorical character of moral reasons — reasons that seem to apply to agents irrespective of their contingent desires or projects. Your task is to assess whether either side has a decisive response to the other's core challenge. In doing so, consider in particular whether the internalist can deploy the notion of a sound deliberative route (from existing motivations, via correct reasoning and full information, to new motivations) to show that moral reasons are internal after all, or whether this move effectively concedes the externalist's point by idealizing the agent's psychology beyond recognition. Conclude by defending a position on which side has the stronger case, and explain your reasoning.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Internalism vs. Externalism regarding normative reasons for action.
      *   **Core Dialectical Asymmetry:**
          *   Internalist Challenge (Williams): Externalism lacks explanatory power (How can a reason motivate if it's not linked to the Subjective Motivational Set [SMS]?).
          *   Externalist Challenge: Internalism fails to capture the categorical nature of moral reasons (Reasons apply regardless of desires).
      *   **Specific Focus:** Can the Internalist use the "sound deliberative route" (SDR) to accommodate moral reasons without conceding to Externalism (by over-idealizing)?
      *   **Task:** Assess whether either side has a decisive response.
      *   **Conclusion:** Defend a position on which side has the stronger case.

  2.  **Initial Mapping of Concepts:**
      *   **Internalism (Williams):** $A$ has a reason to $\phi$ iff $A$ could reach the conclusion to $\phi$ via a sound deliberative route from their existing SMS (desires, projects, commitments). Reasons are grounded in motivation.
      *   **Externalism (Nagel, McDowell, Parfit):** $A$ has a reason to $\phi$ even if no element of their SMS supports $\phi$. Reasons are objective facts independent of the agent's psychology.
      *   **The "Sound Deliberative Route" (SDR):** The mechanism Internalists use to expand the SMS. If I desire $X$, and $Y$ is a means to $X$, I have a reason for $Y$. If I desire $X$, and $Z$ is a constitutive part of a good life which includes $X$, do I have a reason for $Z$? Williams allows for deliberative expansion.
      *   **The Categorical Imperative Problem:** If a sadist has no SMS element supporting kindness, does Internalism say they have *no reason* to be kind? Externalists say this is absurd; morality binds regardless.
      *   **The Motivation Problem:** If Externalism says there is a reason independent of motivation, how does that reason *move* the agent? Is it magic?

  3.  **Analyzing the Internalist Strategy (SDR):**
      *   *Goal:* Show that moral reasons *are* internal because any rational agent, upon full information and correct deliberation, would acquire the motivation to be moral.
      *   *Risk:* If the "correct deliberation" requires assuming a moral sensibility that the agent lacks, is it still internal?
      *   *Williams' View:* He was skeptical. He thought the SDR couldn't bridge the gap for the truly amoral agent without becoming externalist in disguise.
      *   *Smith's View (The Rationalist Internalist):* Argues that rationality itself dictates certain ends. If you are rational, you *would* desire the moral good.
      *   *Critique:* Does this idealize the agent so much that "the agent" is no longer the actual person with their actual psychology? If the "idealized self" has motivations the "actual self" repudiates, is it still an internal reason *for the actual self*?

  4.  **Analyzing the Externalist Strategy:**
      *   *Goal:* Preserve the normativity of morality. Reasons exist as truths.
      *   *Risk:* The "Queerness" argument (Mackie/Williams). How does an objective fact grip the will?
      *   *Response:* Reasons are not necessarily motivators *per se*, but normative truths. Motivation follows recognition of the reason (if the agent is rational).
      *   *Critique:* This risks severing the link between reason and action entirely. A reason that cannot possibly motivate anyone seems inert.

  5.  **Evaluating the Dialectical Asymmetry:**
      *   Internalism wins on *explanation of action* (Humean theory of motivation).
      *   Externalism wins on *normative force* (Morality isn't optional based on desires).
      *   Is there a decisive response?
      *   *Internalist Counter:* "Your external reasons are inert."
      *   *Externalist Counter:* "Your internal reasons make morality contingent."
      *   *The SDR Pivot:* This is the crux. If Internalism stretches the SDR to include "rational necessity of moral ends," it looks like Externalism. If it doesn't, it fails to capture moral categoricity.

  6.  **Developing the Argument for the Conclusion:**
      *   *Option A (Internalism):* Stronger on metaphysics of motivation. But struggles with morality.
      *   *Option B (Externalism):* Stronger on morality. But struggles with metaphysics of motivation.
      *   *My Choice:* I need to pick one.
      *   *Argument for Externalism:* The Internalist reliance on the SDR to save morality *does* concede the externalist point. If the "sound deliberative route" requires the agent to become a different kind of agent (a moral agent) to see the reason, the reason wasn't internal to the *original* agent. Therefore, Internalism cannot account for the categorical nature of moral reasons without self-contradiction. Externalism, while metaphysically puzzling, captures the phenomenology of obligation better.
      *   *Argument for Internalism:* Externalism is metaphysically mysterious. Internalism explains *why* we act. The SDR isn't a concession; it's an explanation of how we come to recognize reasons already implicit in our rationality.
      *   *Decision:* I will argue that **Externalism has the stronger case**, primarily because the Internalist attempt to accommodate moral reasons via the SDR inevitably collapses into a form of Externalism or renders the concept of "reasons for action" too weak to do normative work. The "explanatory burden" Williams cites is heavy, but the Externalist can meet it by distinguishing between *having* a reason and being *motivated* by it (rationalism), whereas the Internalist cannot meet the burden of categorical obligation without redefining the agent.

      *Wait, let me reconsider.* Many contemporary meta-ethicists lean towards a hybrid or a refined Internalism (like Smith or Korsgaard). However, the prompt asks to assess the *dialectical asymmetry*. Williams' challenge is famous for a reason. But the Externalist challenge (categorical reasons) is also potent.
      *Refined Decision:* I will argue that **Internalism (specifically a sophisticated Rationalist Internalism)** actually holds the stronger position *if* we clarify the nature of rationality, BUT the prompt asks me to consider if the SDR move concedes the point.
      *Actually, a more nuanced take:* The Internalist SDR move *does* risk conceding the point. If the "sound deliberative route" requires a moral conversion, the reason wasn't internal to the pre-conversion agent. Therefore, Externalism wins on the specific point of *categorical* moral reasons, even if Internalism wins on general action theory.
      *Let's go with Externalism having the stronger case regarding **normative reasons** specifically (as opposed to motivating reasons).* The prompt asks about "normative reasons for action." Externalism captures the *normativity* better. Internalism captures the *psychology* better. Normativity is the key term.

      *Revised Plan:*
      1.  Define Internalism (Williams) and Externalism.
      2.  Analyze Williams' Challenge (Explanatory Burden).
      3.  Analyze Externalist Challenge (Categoricity).
      4.  Evaluate the SDR move. Does it save Internalism? No, it idealizes the agent out of existence.
      5.  Conclusion: Externalism is stronger because it preserves the normativity of reasons, which is the primary function of a "normative reason."

  7.  **Drafting - Section by Section:**
      *   **Introduction:** Set the stage. Define the asymmetry. State the thesis (Externalism is stronger).
      *   **Williams' Internalism:** Explain the SMS and the explanatory burden. Reasons must be capable of motivating.
      *   **The Externalist Counter:** Explain the categorical nature of morality. The "sadist" objection.
      *   **The SDR Test:** Can Internalism bridge the gap? Discuss the "idealized agent." If the route requires becoming moral to see the reason, the reason wasn't internal to the immoral agent. This concedes Externalism.
      *   **Externalist Defense:** How do they handle motivation? Distinguish normative vs. motivating reasons. Rationalism.
      *   **Conclusion:** Externalism wins because Internalism fails to account for the *authority* of moral reasons without collapsing into Externalism.

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Caution:* Don't make Internalism look too weak. Williams' point about "explanation" is powerful. Externalism risks "queerness."
      *   *Nuance:* Acknowledge that Internalism is better for *explaining action*, but Externalism is better for *justifying action*. Since the prompt asks about *normative reasons* (justification), Externalism has the edge.
      *   *SDR Focus:* Make sure to spend significant time on whether the SDR is a "concession." If the SDR relies on a substantive theory of rationality that *prescribes* ends (not just means), it is effectively Externalist. Williams argued SDR is only procedural. If Internalists make it substantive, they leave Williams' camp.

  9.  **Final Polish:** Check against prompt requirements.
      *   Compare positions? Yes.
      *   Focus on dialectical asymmetry? Yes.
      *   Assess decisive response? Yes.
      *   Consider SDR/idealization? Yes.
      *   Conclude with defended position? Yes.

  (Thought process complete. Proceeding to generate response.)
answer: |-
  The debate between internalism and externalism concerning normative reasons for action constitutes one of the central fault lines in meta-ethics. The dialectical asymmetry identified in the prompt is precise: Internalists, championed by Bernard Williams, demand an explanation of how a reason can exist without a foothold in the agent's psychology, while Externalists demand an account of how moral obligations can bind an agent irrespective of that psychology. To assess whether either side has a decisive response, we must examine whether the Internalist's "sound deliberative route" (SDR) can bridge the gap to moral categoricity without collapsing into Externalism.

  Ultimately, while Internalism offers a superior metaphysics of motivation, Externalism presents the stronger case regarding the *normativity* of reasons. The Internalist attempt to accommodate moral reasons via the SDR inevitably idealizes the agent to such a degree that it concedes the Externalist's core point: that the reason exists independently of the agent's actual subjective state.

  ### The Internalist Challenge: The Explanatory Burden

  Bernard Williams' internalism rests on the "Subjective Motivational Set" (SMS). For Williams, a statement that "$A$ has a reason to $\phi$" is true only if $A$ could reach the motivation to $\phi$ through a sound deliberative route starting from elements within their SMS (desires, projects, commitments).

  The Internalist's primary weapon is the explanatory burden. If a reason is entirely external to an agent's motivational structure, how does it connect to action? Williams argues that external reasons are metaphysically "queer." If an agent has no desire, disposition, or project that would be served by $\phi$-ing, citing a "reason" for $\phi$-ing explains nothing about why they should act, nor can it intelligibly figure in their practical reasoning. For the Internalist, a reason that cannot potentially motivate is not a reason for action; it is merely a normative judgment floating free of human agency. This creates a high barrier for Externalists: they must explain how a fact about the world can constitute a reason for an agent who is psychologically indifferent to that fact.

  ### The Externalist Challenge: The Categorical Imperative

  The Externalist counter-attack targets the sufficiency of Internalism to capture moral experience. Moral reasons appear categorical; they apply to agents regardless of their contingent desires. If a sadist derives pleasure from cruelty and has no element in their SMS supporting kindness, Internalism seems forced to conclude the sadist has no reason to be kind.

  Externalists (such as Thomas Nagel or Derek Parfit) argue this is an intolerable conclusion. It renders morality hypothetical ("*If* you care about others, you have a reason to be kind") rather than categorical ("You have a reason to be kind, period"). The Externalist argues that the normativity of reasons stems from objective values or rational truths, not psychological contingencies. Their challenge is decisive if one accepts that morality must be binding even on the unmotivated. If Internalism cannot account for the badness of the sadist's action in terms of *reasons he has*, it fails as a theory of normative reasons, even if it succeeds as a theory of motivation.

  ### The Sound Deliberative Route: Bridge or Concession?

  The crux of the debate lies in whether the Internalist can deploy the "sound deliberative route" to accommodate the Externalist's concern without surrendering their position. The SDR allows an agent to acquire new motivations through correct reasoning and full information. For example, if I desire health, and exercise promotes health, a sound deliberative route gives me a reason to exercise.

  Sophisticated Internalists (like Michael Smith) argue that if an agent were fully informed and procedurally rational, they would converge on moral motivations. Thus, moral reasons *are* internal, but to an idealized version of the agent. The claim is that the sadist *would* desire kindness if he were fully rational and informed.

  However, this move faces a dilemma regarding idealization:

  1.  **Procedural Rationality:** If the SDR is purely procedural (means-end efficiency, consistency), it cannot generate moral ends from non-moral starting points. A consistent sadist can be procedurally rational. In this case, Internalism fails to capture the categorical nature of moral reasons.
  2.  **Substantive Rationality:** If the SDR includes substantive constraints (e.g., "rationality requires caring about others"), then the "reason" arises from the requirements of rationality itself, not the agent's actual SMS.

  If the Internalist chooses the second option, they effectively concede the Externalist's point. If the "sound deliberative route" requires the agent to undergo a psychological transformation so radical that their new motivations share no continuity with their actual SMS, then the reason is not internal to the *actual* agent. It is internal only to a counterfactual, idealized agent. As Williams himself suspected, stretching the SMS to include what an agent *would* want if they were "good" or "fully rational" in a substantive sense empties the concept of "internal" of its content. It admits that the normative force comes from the *ideal* standard (Externalism), not the *actual* psychology (Internalism).

  Therefore, the Internalist does not have a decisive response to the categoricity challenge. To save moral reasons, they must idealize the agent beyond recognition, effectively acknowledging that the reason's authority lies outside the agent's contingent psychology.

  ### The Externalist Response to the Explanatory Burden

  Does the Externalist have a decisive response to Williams' explanatory burden? They must explain how an external fact motivates. The most robust Externalist response distinguishes between *normative reasons* (justifications) and *motivating reasons* (psychological states).

  Externalists can argue that having a reason does not guarantee motivation, but it guarantees that the agent *ought* to be motivated. The "explanatory gap" Williams identifies is not a bug but a feature: it highlights the difference between being moved and having a justification. A rational agent recognizes the external reason and is thereby motivated. If the agent is not motivated, they are not necessarily irrational in a Humean sense (instrumental), but they are failing to respond to normative reality.

  While this invites charges of metaphysical queerness, it is less damaging than the Internalist's failure to account for moral obligation. The Externalist can accept that reasons are distinct from desires without claiming they are magically efficacious. They simply claim that the recognition of a reason *is* a cognitive state that, in a rational agent, produces motivation. This preserves the link between reason and action without tethering the reason's existence to the presence of a prior desire.

  ### Conclusion: The Case for Externalism

  In assessing the dialectical asymmetry, Externalism holds the stronger case regarding **normative reasons for action**.

  The Internalist position is undeniably stronger as a theory of *motivation*; it accurately describes how human psychology functions. However, the prompt concerns *normative reasons*—claims about what agents ought to do. Here, Internalism falters. The attempt to use the sound deliberative route to rescue moral categoricity fails because it requires such heavy idealization that it abandons the core Internalist insight (that reasons are grounded in the actual agent's psychology). If a reason only exists for an agent *after* they have been deliberatively transformed into a moral agent, the reason was not internal to them *ex ante*. This concedes that the authority of the reason lies in the moral truth itself, not the agent's SMS.

  Externalism, while metaphysically more demanding, successfully captures the phenomenology of moral obligation. It explains why we criticize the sadist not merely for having bad desires, but for failing to respond to reasons that apply to him regardless of those desires. Williams' explanatory burden is significant, but it is not insuperable; it merely requires us to accept that rationality involves responsiveness to objective norms, not just the satisfaction of subjective states. Because the primary function of a "normative reason" is to guide and justify action independently of an agent's whims, the Externalist account, which secures this independence, is philosophically superior.
