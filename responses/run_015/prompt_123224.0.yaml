answer: |-
  **Quick note on the "wrinkle":** It's not a distraction, but it is a risk multiplier. Your supervisor is half-right: if the mechanism of transmission is purely logical, the evolutionary target matters less. However, if the mechanism is psychological (how we actually reason), then whether we selected for *content* vs. *capacity* matters immensely. I've framed it in the proposal as a variable that determines the *strength* of transmission rather than a separate thesis. This protects you if it turns out to be less fruitful than hoped—you can treat it as a conditional parameter rather than a necessary truth.

  Below is the prospectus document.

  ***

  **Dissertation Prospectus**

  **Title:** The Inheritance Question: Transmission and Scope in Evolutionary Debunking Arguments

  **Candidate:** [Your Name]
  **Department:** Philosophy
  **Degree:** Doctor of Philosophy

  **1. Statement of the Problem**

  Evolutionary debunking arguments (EDAs) in metaethics generally rely on two moving parts: a genealogical claim, that we can explain the etiology of our moral beliefs via selective pressures without referencing moral truth; and a modal claim, that had those pressures differed, our beliefs would differ accordingly, leaving us without an independent vantage point to verify their accuracy. The standard debate has stalled over whether these claims constitute a global defeater that swallows logic, mathematics, and perceptual belief, or whether the moral realist can posit a "third-factor" explanation that ties evolutionary success to moral truth.

  This project proposes to sidestep the global skepticism stalemate to address a prior, structural question: the Inheritance Question. Grant the debunker both the genealogical and modal claims for the narrow class of beliefs with the clearest selection stories—kin altruism, reciprocity in small bands, and disgust reactions regarding incest. The question is whether the epistemic defeat attached to these "base" beliefs transmits to moral beliefs that lack a direct selection story, such as obligations to distant strangers, duties to future generations, or abstract deontological constraints.

  There are two honest answers to this question, representing a fork in the road for moral epistemology. The first is *No*: beliefs about distant strangers are reached by reasoning from commitments that have no selection story of their own. On this view, genealogy does not reach derived beliefs, and moral philosophy is in the business of extending and systematizing rather than merely reporting intuitions. The debunker has only shown something about a handful of parochial reactions. The second answer is *Yes*: moral reasoning must bottom out in something we were shaped to accept. Contamination at the base contaminates the whole structure, and the realist's appeal to reflection is merely the hope that a process built on a biased starting point can pull itself up by its bootstraps.

  My goal is to determine which horn of this fork holds, under what conditions, and whether the answer depends on *what* exactly evolution selected for. I distinguish three plausible targets of selection: (1) particular moral contents; (2) a general-purpose capacity to internalize and enforce local norms (a "norm-uptake device"); and (3) a talent for socially tuned self-presentation where belief content is downstream of social utility. The strength of the inheritance claim likely varies depending on which of these mechanisms is operative. If selection favored flexibility rather than content, our beliefs might be tracking local normative facts rather than fitness, which changes what the debunker is entitled to conclude.

  **2. Why Standard Moves Leave This Open**

  Current literature treats the EDA as a monolithic challenge to moral realism. Realists typically respond by arguing for an independent access to moral facts (often via reflective equilibrium) or by arguing that evolution would have selected for true beliefs because true beliefs are useful. Anti-realists argue that the causal independence of belief from truth undermines justification.

  Both sides leave the Inheritance Question open because they focus on the relationship between *all* moral beliefs and moral facts, rather than the internal dependency relations between *different* moral beliefs. The realist assumes that if reflection can save any belief, it can save all of them. The debunker assumes that if the foundation is rotten, the building collapses. Neither side adequately maps the structural connections between "selected" intuitions and "derived" principles. Furthermore, standard arguments often treat the evolutionary explanation as uniform. By distinguishing between selection for content, capacity, or presentation, I aim to show that the debunking argument is not a single weapon but a family of arguments with different ranges of reach. The realist might successfully defend beliefs derived from a norm-uptake device while conceding defeat on beliefs derived from specific content selection, or vice versa. This nuance is currently missing from the debate.

  **3. Methodology and Work Plan**

  The obvious approach to this problem would be to grind through case studies—examining specific beliefs about strangers, future people, and trolley problems individually to see if they survive genealogical scrutiny. I reject this method. It is too contingent on empirical specifics and risks missing the structural epistemic point. Instead, I will model the structure of moral reasoning itself to determine the conditions of transmission.

  **Months 1–3: Mapping Dependency Structures.**
  I will construct formal and informal models of how moral beliefs are derived from intuitions. This involves analyzing arguments in normative ethics to identify which premises rely on "hardwired" intuitions versus those that rely on consistency, universalization, or conceptual analysis. The goal is to categorize moral beliefs by their dependency distance from the evolutionary base.

  **Months 4–8: Testing Transmission Against Evolutionary Targets.**
  I will test these dependency structures against the three evolutionary targets (content, capacity, presentation). For each target, I will ask: Does the genealogical defeat survive the transition from base belief to derived principle?
  *   If selection was for *content*, defeat likely transmits strongly.
  *   If selection was for *capacity*, defeat might be blocked if the capacity tracks local normative facts.
  *   If selection was for *presentation*, defeat might be total, as beliefs are decoupled from truth entirely.
  This phase involves engaging with evolutionary psychology literature only to the extent necessary to treat these claims as conditional premises. I will not attempt to settle empirical debates but will analyze the philosophical consequences of each empirical possibility.

  **Months 9–12: Synthesis and Taxonomy.**
  I will synthesize the results into a taxonomy of debunking reach. This will define the boundaries where genealogical explanation functions as a defeater and where it fails to transmit. The final draft will argue for a specific criterion regarding when a debunking argument has overreached.

  **4. Deliverables**

  The finished dissertation will deliver two primary tools for metaethical debate:
  1.  **A Taxonomy of Debunking Reach:** A classification system distinguishing between belief-level defeat (specific intuitions), class-level defeat (domains of morality), and practice-level defeat (the entirety of moral judgment). This will clarify exactly what is at stake when an EDA is deployed.
  2.  **A Criterion for Overreach:** A principled standard for determining when a debunking argument claims more than its genealogical premises support. This will allow realists to concede ground on parochial intuitions without surrendering the whole of moral philosophy.

  **5. Failure Conditions**

  I am aware that this project risks collapsing into existing debates. An honest failure condition for this year would be if the distinction between "selected" and "non-selected" beliefs proves untenable. If it turns out that every moral belief, no matter how abstract, relies equally on evolutionary shaping such that no dependency distance exists, the Inheritance Question collapses back into the global skepticism debate. In that case, I would have failed to carve out the distinct structural space I propose. Alternatively, if the question of whether reasoning can correct for a biased starting point proves to be purely empirical—requiring data I cannot access philosophically—the project would stall. I would know the year was wasted if I end up merely restating the companions-in-guilt argument without adding structural precision.

  **6. Scope Management**

  The primary risk to scope is the empirical literature on evolutionary psychology. It is too large to survey comprehensively in twelve months. To manage this, I will treat evolutionary claims as conditional premises (e.g., "If selection favored content X, then Y follows"). This keeps the project within philosophy while remaining sensitive to empirical plausibility. A second risk is the metaethical swamp of defining "moral reasoning." I will limit my analysis to widely accepted forms of moral argument (universalization, consistency, means-end reasoning) rather than attempting to solve the nature of reasoning itself. If the project threatens to expand beyond twelve months, I will cut the third evolutionary target (social presentation) and focus solely on the distinction between content and capacity, as this offers the sharpest contrast for the Inheritance Question.

  **7. Anticipated Objections**

  **Objection 1: Isn't this just the companions-in-guilt debate with new labels?**
  The companions-in-guilt argument attempts to save morality by showing that EDAs would also defeat mathematics or logic. My project does not rely on external comparisons. Instead, it looks internally at the transmission of defeat within morality itself. Even if the companions-in-guilt argument fails (i.e., even if morality is unique in being vulnerable), the Inheritance Question remains: does the vulnerability spread from the core to the periphery? This is a distinct structural question that survives regardless of the outcome of the global skepticism debate.

  **Objection 2: What if the reach question collapses into the independence question?**
  Committee members may worry that whether defeat transmits depends entirely on whether the debunker's explanation is independent of moral facts. If the evolutionary explanation secretly relies on moral truths, the debunking fails everywhere; if it doesn't, it fails nowhere. I anticipate this by arguing that independence is a binary condition, whereas transmission is a gradient. Even granting the debunker full independence for the base beliefs, the structural question remains whether that independence loss propagates through reasoning. My project assumes the strongest version of the debunker's case for the base and asks how far that force extends, regardless of the ultimate metaphysical status of the facts. This isolates the epistemic transmission mechanism from the metaphysical independence question.
