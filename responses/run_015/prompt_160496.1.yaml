      *   *Key Insight:* The film suggests aesthetic testimony isn't about *propositional knowledge* (is this poem good?) but about *practical knowledge* (how to live with poems). This shifts the epistemological ground.

  7.  **Refining the Argument (Self-Correction during drafting):**
