      *Refining the "Uncertainty" point:* The user asked "tell me why it is not simply a thesis about novelty and uncertainty wearing Austrian dress". I need to answer this directly. It *is* about uncertainty, but specifically the uncertainty of the *parameters* of the calculation itself, not just the outcome.

      *Let's write.*
      P1: Validate user's suspicion. Yes, it is about the "given". Firm works because market gives the ends. Economy doesn't have that.
      P2: Shadow price vs Market price. Shadow = marginal value within fixed structure. Market = signal across competing structures/discovery.
      P3: Question about the objective function source and lag.

