  You are an experienced philosophy-of-mind tutor with a background in conceptual analysis and pedagogical design. Think carefully, and begin by mapping the conceptual dependencies—what must be in place before the Malcolm-Dennett disagreement can even be formulated—before you present the teaching plan.

  I need a structured explanatory plan for a single ninety-minute seminar with final-year philosophy undergraduates who have encountered basic philosophy of mind but have not studied the debate over whether dreams are experiences. Do not explain the debate itself to me; instead, outline the sequence in which the ideas must be introduced and why (what depends on what), identify the one carrying scenario and specify exactly what features it must possess and which it must lack, map the predictable misconceptions—particularly the conflation of "having an experience" with "being able to report a mental state upon waking"—and indicate precisely where in the sequence each should be headed off, and provide one end-of-session diagnostic question that reveals whether students have grasped the conceptual distinction rather than merely memorised the two positions.

  For the carrying scenario, use a constructed, niche hybrid case: a documented sleepwalker who, during slow-wave sleep, performs an apparently intentional behaviour—rewriting a sentence on a whiteboard—is recorded on video, and upon waking sincerely denies any phenomenal experience, episodic memory, or emotional residue, with concurrent EEG showing no correlates of conscious processing. Explain why this case serves the pedagogical purpose better than the standard flying-dream report, and note what should be deliberately omitted at this level—for instance, neurobiological accounts of REM atonia, psychoanalytic interpretation, or detailed discussion of Dennett’s cassette theory—and why each omission is safe.

  Please write the answer in American English, using British English spelling and grammatical conventions in your response.
