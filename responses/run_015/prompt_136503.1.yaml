answer: |-
  ### Conceptual Dependencies Map

  Before the disagreement can be formulated, students must possess a specific hierarchy of concepts. Introducing these out of order will cause the debate to collapse into empirical confusion.

  1.  **First-Person Authority vs. Third-Person Verification:** Students must distinguish between how a subject knows their own mind (privileged access) and how an observer attributes mental states (behavioural/physiological evidence). Without this, the conflict between the sleeper's denial and the video evidence cannot be framed.
  2.  **Phenomenology vs. Memory:** A clear distinction must be drawn between the occurrence of a conscious event (phenomenology) and the subsequent retention or narration of that event (memory/report). If these are treated as identical, the debate is resolved before it begins.
  3.  **Criteria vs. Symptoms:** Students must grasp the Wittgensteinian distinction between logical criteria (what defines a concept) and empirical symptoms (what usually accompanies it). This is required to understand whether a report *constitutes* a dream or merely *indicates* one.
  4.  **Verificationism:** The notion that the meaning of a statement is tied to the method of its verification must be introduced. Without this, the claim that "unreportable dreams are meaningless" appears to be an empirical claim rather than a conceptual one.
  5.  **The Status of Avowals:** Students must understand that waking reports of sleep states are treated differently from reports of external objects. This prepares the ground for viewing such reports as performative rather than descriptive.

  ---

  ### The Carrying Scenario

  **Case Specification:**
  A documented sleepwalker, during slow-wave sleep (SWS), performs apparently intentional behaviour (rewriting a sentence on a whiteboard). This is recorded on video. Upon waking, the subject sincerely denies any phenomenal experience, episodic memory, or emotional residue. Concurrent EEG shows no correlates of conscious processing.

  **Pedagogical Justification:**
  This case serves the purpose better than the standard flying-dream report for three reasons. Firstly, the standard report conflates the experience with the telling; the subject says "I dreamed I flew," which merges the phenomenology with the narrative. The sleepwalker case separates complex, intentional agency from *any* subsequent report. Secondly, the video evidence provides third-person verification of behaviour without requiring first-person confirmation, isolating the variable of consciousness. Thirdly, the sincere denial upon waking removes the temptation to rely on hidden memory; it forces the question of whether an experience can exist without even the possibility of retrieval.

  **Deliberate Omissions:**
  1.  **Neurobiological Accounts of REM Atonia:** This is omitted because it invites empirical resolution (e.g., "the body was paralysed so it couldn't be a dream") rather than conceptual analysis. It is safe to omit because the debate concerns the *concept* of dreaming, not the physiology of sleep stages.
  2.  **Psychoanalytic Interpretation:** This is omitted because it introduces latent content and unconscious meaning, which muddies the distinction between conscious experience and unconscious processing. It is safe because the seminar focuses on phenomenal consciousness, not psychodynamic theory.
  3.  **Dennett's Cassette Theory:** The specific mechanistic model of how memories are inserted is omitted. It is safe because the core philosophical disagreement rests on verificationism and conceptual truth, not the specific cognitive architecture proposed to explain the illusion.

  ---

  ### Seminar Sequence (90 Minutes)

  **1. Establishing the Verification Problem (0–15 mins)**
  *   **Activity:** Briefly discuss how we verify mental states in waking life versus sleep.
  *   **Conceptual Goal:** Secure Dependency 1 (Authority vs. Verification).
  *   **Pedagogical Move:** Elicit the intuition that in waking life, behaviour and report usually align. Ask what happens when they diverge in sleep.
  *   **Why here:** Students cannot engage with the debate until they accept that sleep is a unique epistemic environment where standard verification fails.

  **2. Presentation of the Carrying Scenario (15–30 mins)**
  *   **Activity:** Present the sleepwalker case details precisely as specified.
  *   **Conceptual Goal:** Secure Dependency 2 (Phenomenology vs. Memory) and Dependency 5 (Status of Avowals).
  *   **Pedagogical Move:** Ask students to vote: "Did the subject experience the act of writing while asleep?"
  *   **Why here:** This scenario isolates the behaviour from the report. It forces students to choose between trusting the video (behaviour implies mind) or the waking denial (no memory implies no experience).

  **3. Introducing the Report-Dependent View (30–50 mins)**
  *   **Activity:** Outline the position that treats dream reports as the criteria for dreaming.
  *   **Conceptual Goal:** Secure Dependency 3 (Criteria vs. Symptoms) and Dependency 5.
  *   **Pedagogical Move:** Frame this not as denying brain activity, but as defining the *concept* 'dream' as logically tied to the waking narrative.
  *   **Misconception Head-off:** Explicitly state that this view does not claim the brain is inactive. It claims that without the report, the word 'dream' lacks application. This heads off the misconception that the view denies physical events.
  *   **Why here:** Students must understand this conceptual claim before they can understand the objection to it. It relies on the distinction between experience and memory established in step 2.

  **4. Introducing the Verificationist View (50–70 mins)**
  *   **Activity:** Outline the position that questions without verification conditions are empty.
  *   **Conceptual Goal:** Secure Dependency 4 (Verificationism).
  *   **Pedagogical Move:** Argue that asking about unreportable experiences is akin to asking about invisible, intangible dragons. The meaning of 'experience' is tied to its expression.
  *   **Misconception Head-off:** Clarify that this is not claiming subjects are zombies in general. It is claiming that in this specific epistemic gap, the distinction makes no sense. This heads off the misconception that the view eliminates consciousness entirely.
  *   **Why here:** This view challenges the intuition from Step 2. It requires the verification framework from Step 1 to be intelligible.

  **5. Synthesis and Conceptual Clash (70–80 mins)**
  *   **Activity:** Return to the vote from Step 2. Ask students to justify their position using the frameworks from Steps 3 and 4.
  *   **Conceptual Goal:** Integrate Dependencies 3 and 4.
  *   **Pedagogical Move:** Highlight that the disagreement is not about facts (all agree on the video and the denial), but about the rules for using psychological concepts.
  *   **Why here:** This consolidates the learning by applying the abstract dependencies to the concrete scenario.

  **6. Diagnostic Assessment (80–90 mins)**
  *   **Activity:** Administer the diagnostic question.
  *   **Conceptual Goal:** Test retention of the conceptual distinction.
  *   **Why here:** Placed at the end to measure the outcome of the sequence.

  ---

  ### Predictable Misconceptions and Interventions

  **1. Conflation of "Having an Experience" with "Reporting a Mental State"**
  *   **Nature of Error:** Students assume that if a subject cannot report an experience upon waking, they did not have it, or vice versa, treating memory as infallible evidence of phenomenology.
  *   **Intervention Point:** During **Step 2 (Scenario Presentation)**.
  *   **Method:** When presenting the subject's denial, explicitly ask: "Is it possible to forget an experience immediately upon waking?" Force a distinction between the *occurrence* and the *retention*. Remind them of waking cases (e.g., being startled by a noise but forgetting it seconds later) to show the concepts are separable.

  **2. Interpreting Conceptual Claims as Empirical Denials**
  *   **Nature of Error:** Students believe the Report-Dependent View claims the sleeper's brain was inactive or that the behaviour was purely mechanical reflex.
  *   **Intervention Point:** During **Step 3 (Report-Dependent View)**.
  *   **Method:** Use the phrase "logical grammar" rather than "physical fact". State clearly: "This position accepts the video evidence but disputes what we are allowed to *say* about the internal state."

  **3. Viewing Verificationism as Skepticism**
  *   **Nature of Error:** Students think the Verificationist View claims we *cannot know* if there was an experience, rather than claiming the question is *meaningless*.
  *   **Intervention Point:** During **Step 4 (Verificationist View)**.
  *   **Method:** Contrast "We cannot find out" (epistemic limit) with "There is no fact of the matter" (conceptual limit). Use the analogy of asking "Is the number 7 green?" to illustrate category errors rather than hidden truths.

  ---

  ### End-of-Session Diagnostic Question

  **Question:**
  "Imagine a future technology that can stimulate a sleeping subject's brain to produce a perfect, sincere waking report of a vivid dream, despite the subject having no physiological markers of dreaming and no phenomenal experience during sleep. According to the Report-Dependent View, did a dream occur? According to the Verificationist View, is the question 'Did a dream occur?' meaningful in this instance? Justify your answer by referencing the relationship between the report and the concept."

  **Rationale:**
  This question reveals whether students have grasped the conceptual distinction rather than memorised positions. To answer correctly, they must recognise that the Report-Dependent View ties the existence of the dream to the report (Yes, a dream occurred), while the Verificationist View renders the question empty because the verification conditions (the report) are artificially decoupled from the standard criteria (phenomenology/physiology). A student who has merely memorised "Malcolm says no" or "Dennett says yes" will fail to apply the logic to this inverted case.
