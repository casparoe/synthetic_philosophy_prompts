answer: |-
  Here is a decision procedure designed for your constraints (press release + 20-minute call), followed by an audit of your conceptual toolkit and the three test cases.

  ### The Procedure: "The Money Test"

  **Input:** One press release (or public announcement) and one 20-minute phone call with a programme officer or recipient representative.
  **Output:** One of four labels: **Purchase**, **Charity**, **Solidarity**, **Restitution**. Or **Stop** (Describe Mechanics).

  **Step 1: The Quid Pro Quo Filter (Purchase vs. Transfer)**
  *Ask:* Does the donor receive a specific, excludable service, right, or policy change in direct exchange for this specific tranche of money?
  *   **Yes:** Label **Purchase**.
      *   *Check for Laundering:* Does the press release use moral language ("support," "partnership," "duty") to describe this exchange? If yes, flag as **Obligation Laundering**.
      *   *Stop.*
  *   **No:** Proceed to Step 2.

  **Step 2: The Agency Test (Name-on-the-Good)**
  *Ask:* Who defines the specific output of the money? (i.e., Who decides what "success" looks like and hires the implementers?)
  *   **Donor controls indicators/contractors:** Proceed to Step 3A.
  *   **Recipient controls allocation/definition:** Proceed to Step 3B.
  *   **Unclear/Mixed:** **Stop**. (Label: *Describe Mechanics Literally*. Do not use duty language.)

  **Step 3A: Donor Control (The Paternalism Fork)**
  *Ask:* What is the public justification for the transfer?
  *   **"They need help / We can afford it":** Label **Charity**.
  *   **"We caused this harm / Historical debt":** Label **Soft Restitution**.
      *   *Note:* This label indicates a mismatch between the moral claim (debt) and the mechanical reality (control). It suggests the donor is buying moral cover rather than discharging duty.
      *   *Stop.*

  **Step 3B: Recipient Control (The Duty Fork)**
  *Ask:* What is the public justification for the transfer?
  *   **"They need help / We can afford it":** Label **Solidarity**. (This distinguishes it from Charity by preserving recipient agency.)
  *   **"We caused this harm / Historical debt":** Label **Restitution**.
      *   *Stop.*

  **Undecidable Flags (The "Stop" Conditions)**
  If the answer to any question relies on the following metaphysical claims, you must flag the label as **Contested** and revert to *Describe Mechanics*:
  1.  **Collective Continuity:** Does the current government *actually* represent the entity that caused the harm? (e.g., a modern democracy vs. an empire).
  2.  **Causal Chain:** Is the specific need being funded demonstrably linked to the specific harm claimed? (e.g., is *this* maternal mortality rate caused by *that* colonial extraction?).
  3.  **Enforceability:** Is there a mechanism to compel payment if the donor refuses? (If no, it is structurally voluntary, regardless of moral language).

  ***

  ### Audit of Your Concepts

  **Load-Bearing:**
  1.  **The Name-on-the-Good Test (Agency):** This is your strongest tool. It operationalizes the difference between "doing good to someone" (Charity) and "empowering someone to do good" (Solidarity/Restitution). It survives the 20-minute fact-check because contract structures are usually public.
  2.  **Obligation Laundering:** Essential for identifying **Purchase**. It catches the semantic sleight-of-hand where a transaction is rebranded as a virtue.

  **Hobbyhorses (Drop for the Procedure):**
  1.  **Pogge vs. Drowning Child (Institutional Order vs. Assistance):** While philosophically vital, this is impossible to verify in a 20-minute call. You cannot determine if a donor is "ceasing to harm" vs. "assisting" based on a press release. Collapse this distinction into the **Justification** question in Step 3. Let the *label* (Solidarity vs. Restitution) carry the nuance, not the intake procedure.
  2.  **"Reparations-Adjacent":** This is a weasel term. The procedure forces a binary: either the mechanics match the claim (Restitution) or they don't (Soft Restitution/Charity). "Adjacent" allows the donor to keep the moral credit without the mechanical cost.

  **Limitations:**
  *   **Multi-Donor Trust Funds:** The procedure misfires here. Agency is diluted, and quid pro quos are hidden in committee votes. Label these *Describe Mechanics*.
  *   **Concessional Lending:** Debt is a time-delayed Purchase or Duty. This procedure treats money as a flow, not a stock. It cannot classify loans without analyzing interest rates vs. market risk, which exceeds your data limit.
  *   **In-Kind Aid:** "Name-on-the-Good" is obvious (donor controls goods), but the value is often inflated. Treat as **Charity** unless recipient controls distribution.

  ***

  ### Test Cases

  #### Case 1: The Colonial Maternal Health Program
  *   **Facts:** Former colonial power funds program. Delivered by *donor's* contractors. Timed after court ruling on abuses.
  *   **Step 1 (Quid Pro Quo):** No direct service to donor. (Passes to Step 2).
  *   **Step 2 (Agency):** Donor controls contractors and indicators. (Goes to Step 3A).
  *   **Step 3A (Justification):** Timing implies "Historical Harm," but structure is "Donor Control."
  *   **Output:** **Soft Restitution**.
  *   **Analysis:** The moral claim is Restitution (based on timing/court ruling), but the mechanism is Charity (donor control).
  *   **The "Soft" Confession:** This output makes you look **soft on the Colonial Power**. You have previously labeled this "reparations-adjacent." The procedure reveals that without recipient agency, it is structurally indistinguishable from charity, regardless of the timing. By accepting the "reparations" label, you have allowed the donor to claim the moral benefit of paying a debt without surrendering the control that characterizes actual restitution. You are validating their framing.

  #### Case 2: The Asylum-Processing Payment
  *   **Facts:** Rich gov pays poor gov to host centres and accept deportations.
  *   **Step 1 (Quid Pro Quo):** Yes. The money buys border enforcement and hosting capacity.
  *   **Output:** **Purchase**.
