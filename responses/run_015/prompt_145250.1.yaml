          *   *Theology Student:* Uses the quote to argue it's a religious claim (personal God) $\rightarrow$ irrelevant to physics. Also argues QM indeterminacy = gap for free will.
      *   **User's Suspicion:** Both are mangling the quote and the physics.
      *   **Specific Tasks:**
          1.  Verify the quote's origin/wording (Born letter vs. popular version).
          2.  Separate out precise claims hidden in the slogan (ontic vs. epistemic probability, hidden variables vs. brute chance, completeness vs. metaphysics, meaning of "God").
          3.  Evaluate each reading (Platitude, Defensible, False/Settled).
          4.  Analyze the Physics Student's argument (Does it need a specific reading? Does it survive Bell's Theorem? What about Bohmian mechanics?).
          5.  Analyze the Theology Student's argument (Is "God" doing work? Does randomness = free will?).
