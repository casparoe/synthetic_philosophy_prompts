      *   **The "State as Moral Person":** This is a Hegelian or Gierke-esque concept (real personality of the state) vs. a fictionalist view. In 1919, the Allies needed Germany to pay. If the Kaiserreich falls and the Weimar Republic rises, is it the same debtor? Yes, argued the Allies.
      *   **The Inheritance Analogy:** Heirs inherit debts of the estate. They didn't incur them, but they benefit from the estate's assets. This is *vicarious liability* based on *benefit* and *continuity*, not *fault*.
      *   **Moral vs. Legal:** This is the crux. Legal liability can exist without moral culpability (strict liability). The 1919 argument often conflated them to justify the *magnitude* of reparations (which required "guilt" domestically in Allied countries) while relying on legal continuity internationally.
      *   **Fischer Controversy:** Fritz Fischer (1960s) argued Germany *did* seek hegemony (elites drove it). The 1919 argument assumed the *Nation* was liable. Fischer narrows the blame to elites but confirms intent. The user asks if the 1919 argument relies on a mechanism linking people to elites. Actually, the 1919 argument often *ignored* that mechanism (collective guilt), whereas Fischer *provided* the mechanism (elite continuity).

