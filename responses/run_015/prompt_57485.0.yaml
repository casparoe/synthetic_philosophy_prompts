answer: |-
  # METAPHYSICS SEMINAR: FINAL EXAMINATION

  **Time Allowed:** 75 Minutes
  **Word Limit:** 1,200 words maximum
  **Total Marks:** 25

  **Question 1**

  Consider a world $W$ containing exactly three species of particle: $A$, $B$, and $C$. There are no other objects or properties. The history of $W$ consists entirely of adjacency events between these particles.

  There are exactly one billion $A$-$B$ adjacency events in $W$. In 999,996,000 of these events, a flash occurs. In exactly 4,000 events, no flash occurs. Every one of those 4,000 exceptions sits inside a single dense $C$-cluster (a sphere of fixed radius). This cluster is the only region in $W$ where $C$ particles exist. The cluster contains 12 million $A$-$B$ adjacency events altogether; thus, even inside the cluster, flashes occur in roughly 99.97% of adjacencies.

  Students are presented with three candidate systems for $W$:
  *   **S1:** Whenever an $A$ is adjacent to a $B$, a flash occurs.
  *   **S2:** S1, plus an axiom stating that inside $C$-clusters, an $A$-$B$ adjacency has a 99.97% chance of producing a flash.
  *   **S3:** Whenever a *shmashed* $A$-$B$ adjacency occurs, a flash occurs — where "shmashed" is defined as an $A$ adjacent to a $B$ at which a flash occurs.

  **The Twist:** The 4,000 non-flashes were each produced by an experimenter flipping on a shield. However, the shield is stipulated to be **traceless**. Nothing in the intrinsic, non-nomic facts about those events distinguishes a shielded adjacency from an unshielded one. The base facts are literally identical whether you describe the 4,000 as a law being interfered with or as a limit on the law's scope.

  **Essay Task:**
  (a) Which system ought a Humean nominate as best for $W$, and what constraints must she invoke to make that verdict non-arbitrary?
  (b) Does the traceless shield show that only an anti-Humean account (e.g., necessitation between universals or primitivism) can underwrite the counterfactual "if the shield hadn't been switched on, a flash would have occurred" and the claim that the law explains the other 999,996,000 flashes? Or can the Humean match both?

  Argue for a definitive conclusion on which account handles this world better.

  ***

  # MODEL ANSWER

  The Humean must reject S1 immediately. The Best System Account (BSA) requires candidate systems to be true summaries of the Humean mosaic. S1 asserts a universal regularity that is falsified by 4,000 events. Simplicity cannot compensate for falsehood; a false system has zero fit. Therefore, S1 is ineligible regardless of its brevity.

  S3 is true by definition, as "shmashed" simply picks out the successful cases. However, S3 is trivial. It offers no compression of information; it merely restates the data using a gerrymandered predicate. To block this, the Humean must invoke the naturalness constraint. "Shmashed" is not a perfectly natural property; it is defined in terms of the very regularity the law is supposed to explain. Restricting the vocabulary to natural properties (like $A$, $B$, and adjacency) renders S3 ineligible. Without this constraint, any regularity could be made into a law by defining a predicate that applies only to instances where it holds, collapsing the distinction between law and accident.

  This leaves S2. S2 retains the strict universal for the vast majority of cases but treats the $C$-cluster exceptions probabilistically. It sacrifices some simplicity for a massive gain in fit. Unlike S1, it is true. Unlike S3, it uses natural vocabulary. For the Humean, S2 is the best system because it strikes the optimal balance between simplicity, strength, and fit. It captures the overwhelming regularity while acknowledging the statistical noise within the $C$-cluster without listing 4,000 individual exceptions.

  The traceless shield presents the deeper metaphysical challenge. The anti-Humean argues that laws are relations of necessitation between universals that hold unless interfered with. They claim this supports the counterfactual: if the shield (interference) were absent, the necessitation would have produced the flash. However, the stipulation that the shield is traceless undermines this. If the intrinsic, non-nomic facts are identical for shielded and unshielded events, the anti-Humean must posit a difference in the nomic relation itself without a difference in the relata or the base facts. This violates the supervenience intuition that drives many to realism about laws: how can the necessitation relation fail to hold in one case but hold in another if the intrinsic properties of the particles and their positions are identical? The anti-Humean is forced to treat "interference" as a primitive fact that does not supervene on the physical mosaic, rendering the account mystifying.

  The Humean, conversely, handles the tracelessness honestly. For the Humean, there is no hidden "interference" fact over and above the mosaic. The 4,000 events are simply exceptions in the base. S2 accommodates them via chance. The counterfactual "if no shield, then flash" is supported not by hidden powers, but by the best system itself. Since S2 is the best summary, it supports the claim that in similar conditions (outside the cluster or probabilistically inside), flashes occur. The explanation for the 999,996,000 flashes is that they belong to the best systematization of the mosaic.

  Critics might argue the Humean cannot distinguish interference from brute exception. But in a world where the base facts are identical, there is no metaphysical distinction to be made. The anti-Humean claims there is, but cannot locate it in the ontology. The Humean admits the law is probabilistic (S2) and moves on. The anti-Humean attempt to preserve a strict necessitation while admitting traceless interference creates a gap between the law and the world it governs.

  Therefore, the Humean account comes out better. It respects the supervenience of laws on facts, avoids the falsehood of S1 and the triviality of S3, and does not posit occult differences for the traceless shield. The counterfactual is secured by the stability of the best system, not by a necessitation relation that fails to supervene on the intrinsic nature of things. The Humean sacrifices the idea of exceptionless strict laws for S2, but gains a coherent ontology where laws do not float free of the mosaic they describe.

  ***

  # MARKING SCHEME (25 Marks)

  **1. Eligibility of S1 (Truth Constraint) – 5 Marks**
  *   **Must Hit:** Student identifies that S1 is false given the 4,000 exceptions. Humean systems must be true (or have near-perfect fit treated as chance); simplicity does not override falsehood.
  *   **Common Error:** Claiming S1 is the best system because it is the simplest, ignoring the falsification condition.
  *   **Trap for Label-Reciters:** Reciting "Lewis values simplicity and strength" without noting the truth/fit constraint. (Deduct 3 marks if S1 is defended as best).

  **2. Eligibility of S3 (Naturalness Constraint) – 5 Marks**
  *   **Must Hit:** Student identifies S3 as trivial/tautological. Must invoke the restriction to "perfectly natural properties" or "non-gerrymandered vocabulary" to rule it out.
  *   **Common Error:** Rejecting S3 because it is "uninformative" without explaining why the Humean can't just define new predicates (missing the naturalness constraint).
  *   **Differentiation:** A-grade answers explain that without naturalness, *any* regularity becomes a law.

  **3. Evaluation of S2 (Chance and Fit) – 5 Marks**
  *   **Must Hit:** Student argues S2 is the viable Humean candidate. Must discuss the trade-off: loss of simplicity vs. gain in fit/truth.
  *   **Bonus (up to 2 marks included here):** Noticing that 'Fit' (probability matching frequency) is a distinct virtue from 'Strength' (deductive power), and S2 optimizes Fit where S1 fails.
  *   **Common Error:** Treating S2 as merely "S1 with exceptions" without analyzing the probabilistic axiom's role in systematization.

  **4. The Traceless Shield & Counterfactuals (Humean vs. Anti-Humean) – 10 Marks**
  *   **Must Hit:** Student analyzes the implication of "traceless." If base facts are identical, Anti-Humean necessitation cannot distinguish interference from exception without violating supervenience.
  *   **Must Hit:** Student evaluates whether the Humean can support the counterfactual. (Argument: Yes, via the best system's stability, not hidden powers).
  *   **Must Hit:** Definitive conclusion on which account wins (Model argues Humean wins on supervenience/coherence grounds).
  *   **Common Error:** Handing the counterfactual to the Anti-Humean automatically without asking how "interference" exists in the ontology if it leaves no trace.
  *   **Trap for Label-Reciters:** Saying "Armstrong allows interference so he wins" without addressing the *traceless* stipulation which removes the ground for interference in the base facts. (Deduct 4 marks if this distinction is missed).

  **General Grading Notes:**
  *   **A (20-25):** Clear stance, integrates all three systems,深刻 (deep) analysis of the traceless shield's impact on supervenience.
  *   **B (15-19):** Correctly eliminates S1/S3, chooses S2, but treats the shield problem superficially (e.g., "Anti-Humeans like interference" without the supervenience critique).
  *   **C (10-14):** Recites dialectic (Lewis vs. Armstrong) without applying it tightly to the toy world numbers or the traceless constraint.
  *   **D/F (<10):** Fails to eliminate false/trivial systems or misses the prompt's second half.
