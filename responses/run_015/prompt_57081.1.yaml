answer: |-
  The break in your argument occurs at the inference from **operational no-signaling** to **ontological locality**. You are conflating the capacity to send a message (signaling) with the existence of a physical dependence (causation/influence). Your friend is correct that the theory is physically nonlocal; you are correct that it is operationally local (in equilibrium), but you draw the wrong metaphysical conclusion from that operational constraint.

  Here is the precise assessment of where your inference fails, addressing your specific questions.

  ### 1. The Illegitimate Step: Signaling vs. Influence
  Your argument hinges on this claim: *"If whether a signal may be sent turns on which distributions we are able to prepare, the constraint in question is a constraint on our epistemic access, not a structural feature of the world."*

  This is the mistake. In Pilot-Wave theory, the **structural feature of the world** is the guiding equation. The guiding equation dictates that the velocity of particle $A$ depends instantaneously on the position of particle $B$. This is an ontological dependence. It exists regardless of whether you can exploit it to send a Morse code message.

  The fact that quantum equilibrium ($\rho = |\psi|^2$) washes out this dependence at the statistical level (preventing signaling) is analogous to thermal equilibrium in a gas. The fact that you cannot extract work from a gas in thermal equilibrium does not mean the molecular collisions are not happening; it means the statistical distribution masks the ability to harness them. Similarly, in Pilot-Wave theory, the nonlocality is physically real (the particles *are* guiding each other instantaneously), but the statistical distribution renders it uncontrollable.

  Therefore, Bell's theorem establishes that nature is nonlocal *if* you accept Pilot-Wave as a description of reality. It does not establish that "no epistemic reconstruction can be signal-local"; it establishes that no *local* ontology can reproduce the correlations. Pilot-Wave reproduces them by being *nonlocal*. The no-signaling theorem is a feature of the *state* (equilibrium), not the *dynamics*.

  ### 2. The Usage of "Hidden Variable"
  You ask who is misusing the term. You are treating "hidden variable" in the sense of **epistemic ignorance** (a parameter we lack knowledge of). Your friend is treating it in the sense of **ontological beable** (a quantity that exists physically).

  In the context of Bell's theorem and Pilot-Wave theory, your friend's usage is the standard one. A "hidden variable" in this debate is not merely a placeholder for missing information; it is a proposed element of physical reality that completes the description of the system.
  *   **Your view:** The variables are hidden because we can't know them; therefore, their relationships are epistemic.
  *   **The Theory's view:** The variables are hidden because the dynamics of relaxation (equilibration) prevent us from measuring them without disturbing them, but they exist determinately.

  By assimilating the hidden variables to "quantities we are merely ignorant of," you are implicitly arguing for an instrumentalist reading of a realist theory. If the theory is true, the particles have positions. If they have positions, and those positions depend instantaneously on distant positions, the world is nonlocal. Your ignorance of the positions does not make the dependence epistemic; it makes your *access* to the dependence epistemic.

  ### 3. Preparation as a Physical Notion
  You argue: *"A dependence of what is physically possible upon what can be known or arranged is a dependence of physics upon description."*

  This treats "preparation" as purely epistemic. In Pilot-Wave theory (and specifically in Valentini's extension), the inability to prepare non-equilibrium distributions is not merely a lack of knowledge; it is a **dynamical constraint**.

  Just as you cannot easily prepare a gas where all fast molecules are on the left and slow ones on the right (due to relaxation timescales and chaos), you cannot prepare a pilot-wave system in non-equilibrium (due to quantum relaxation). This is a physical limitation on what states are accessible in our universe, not a logical limitation on description. That the *possibility* of signaling depends on the *physical state* of the system (equilibrium vs. non-equilibrium) confirms that the signaling capability is a physical property, not an epistemic one. The fact that we are stuck in equilibrium is a contingent physical fact about our sub-quantum history, not a definition of the theory.

  ### 4. The Wavefunction as Law
  Your friend's claim that the wavefunction is "law-like" rather than a "field" does not save locality; it merely shifts the category of the nonlocal entity.

  If the wavefunction is a law, it is a **nonlocal law**. A law that dictates "Particle $A$'s velocity depends on Particle $B$'s position" is a nonlocal law. Whether you call the wavefunction a physical field or a nomological entity, the *relation* it encodes between spacelike-separated particles is nonlocal. Calling it a law does not make the dependence disappear; it makes the nonlocality a fundamental feature of the nomological structure of the universe.

  ### Conclusion
  Your friend is entitled to hold that the theory is epistemic about our *access* to the variables (we can't measure them precisely in equilibrium) but physically nonlocal about the *variables themselves*.

  The step in your argument doing the illegitimate work is **the move from inaccessibility to unreality** (or from no-signaling to no-influence). You are arguing that because we cannot *use* the nonlocality to signal, the nonlocality is not *physical*. Pilot-Wave theory asserts the opposite: the nonlocality is physical, which is why the correlations exist; the inability to signal is a contingent consequence of our specific quantum state.

  Bell's theorem rules out local *beables*. Pilot-Wave has nonlocal *beables*. You are attempting to save locality by reclassifying the beables as epistemic constraints, but the theory explicitly defines them as ontological trajectories. If you reject the ontology, you are not discussing Pilot-Wave theory; you are discussing a different interpretation entirely. Within the framework of Pilot-Wave, nature is nonlocal.
