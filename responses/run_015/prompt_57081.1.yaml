      *   **Core Disagreement:** The user argues that Pilot-Wave's nonlocality is "real but inoperative" due to quantum equilibrium, implying the nonlocality is epistemic (about our knowledge/preparation) rather than ontological (about the world). The friend argues that the theory is physically nonlocal, citing Valentini's work on non-equilibrium signaling.
