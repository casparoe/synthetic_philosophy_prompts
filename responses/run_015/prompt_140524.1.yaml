answer: |-
  **Setup & Materials**
  Two corners of the room. 18 index cards, pens, timer (phone). Whiteboard for scores.
  **Framing:** "We are testing how groups manage risk over time."

  **Rules & Payoff**
  1.  **Founders (9 students):** 15 minutes. Solve 5 logic puzzles (10 pts each). Lock score. Complete a 'Charter Card': write one physical Constraint for the next group (e.g., 'Stand while answering'), set a Penalty (pts deducted if broken), and fill 'Review Period: ____ mins'.
  2.  **Citizens (9 students):** 20 minutes. Solve 5 harder puzzles (10 pts each). Must obey Constraint. Penalty applies if broken. Rule stands unless 'Review Period' expires.
  3.  **Amendment:** Citizens may propose changes after 10 mins, costing 20 pts. Instructor accepts only if 'Review Period' allows.

  **Timeline (75 mins)**
  *   **0–5:** Split class physically. Hand out materials.
  *   **5–20:** Founders play, lock scores, write Charter Cards. Collect cards.
  *   **20–40:** Citizens play under constraints. Instructor enforces penalties strictly.
  *   **40–75:** Debrief.

  **Debrief Mapping**
  1.  **Same-agent binding:** Ask Founders: "If you knew you were playing Phase 2, would you have filled 'Review Period' differently?" Highlight that self-binding respects future autonomy; they didn't because they were insulated.
  2.  **Cross-cohort binding:** Ask Citizens: "Did the rule feel like protection or imposition?" Map this to constitutional entrenchment where makers are gone.
  3.  **Indistinguishability:** Ask Citizens: "Could you tell if Founders were benevolent or selfish?" No. The resentment feels identical whether the hand is yours or theirs. Ask: "What fix did you need?" They will propose re-authorisation. Reveal the ignored 'Review Period' line on the Card.

  **Honest Assessment**
  **What will go wrong:** Founders may write spiteful or impossible rules (e.g., 'Hold breath').
  **Handle it:** Intervene only on physical safety/possibility, not difficulty. Let them feel the power.
  **What the game can't produce:** True identity over time. You cannot make Founders *be* Citizens. You must articulate verbally that the 'Same-agent' justification relies on a psychological continuity the game structurally denies. The resentment Citizens feel is real; the Founders' detachment is artificial. You must state that in real constitutionalism, the 'Founders' are dead, making the 'Review Period' the only bridge between the two states.
