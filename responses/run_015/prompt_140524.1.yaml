      *   *Phase 2 (Citizens):* 25 mins. Solve harder puzzles under Constraint.
      *   *Phase 3 (Negotiation):* 10 mins. Group 2 can pay points to amend.
      *   *Debrief:* 20 mins.

      *   *Refining the "Repair":* If I put "Re-auth Interval" on the card, I'm hinting too much.
      *   *Better:* The rule is written on a card. The card expires in 5 minutes unless signed by both groups. But Group 1 leaves.
      *   *Actually, simplest way:* The rule is written on a slip of paper. The slip has a "Validity" field. Group 1 fills it. They usually write "Permanent". Group 2 finds out they can't change it. In debrief, they realise "Validity" could have been "5 mins, renewable".
      *   *Wait, I need them to invent the fix.*
      *   *Okay:* During Phase 2, allow Group 2 to propose a "Ratification" to the instructor. The instructor says "The rules don't allow that." Group 2 gets frustrated. In debrief, they say "We needed a way to vote." I then reveal Group 1 *could* have written "Subject to vote every 5 mins" on the card.

      *   *Timeline:*
          *   0-5: Split groups, separate corners.
          *   5-25: Group 1 plays, scores, writes Rule Card (Constraint + Penalty + Duration).
