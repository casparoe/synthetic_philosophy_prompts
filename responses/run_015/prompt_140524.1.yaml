          *   (ii) Cross-cohort: Group 1 binds Group 2.
          *   (iii) Indistinguishability: Group 2's resentment feels same regardless of Group 1's intent.

      *   *Failures:* Group 1 might write impossible rules. Group 2 might revolt.
      *   *Limitation:* Can't fully simulate "same agent" without time travel.

