          6.  Let's stick to the prompt: "Set the rules up so that fix is available; don't mention it."
          7.  Idea: The Rule Card has a checkbox: "Sunset Clause: Yes/No". Group 1 decides. If they check Yes, Group 2 can vote to remove it after 5 mins. If No, they can't. Group 1 usually won't check it. Group 2 will resent this. In debrief, ask Group 2 what they wished was there. They will say "A way to vote it off." Then ask Group 1 why they didn't tick it.
      *   *Wait, constraint:* "one group should get to write rules they don't themselves live under".
      *   *Constraint:* "binding device whose strength the participants set themselves".
      *   *Constraint:* "obvious repair... some version of a self-renewing Ulysses contract... Set the rules up so that fix is available".
      *   *Okay:* The Rule Card includes a field: "Re-authorisation Interval: ____ minutes." Group 1 fills this in. Usually, they leave it blank or write "Never". Group 2 suffers. In debrief, they realise they could have written "5 mins".

  4.  **Drafting the Plan (incorporating British English & Word Count):**

