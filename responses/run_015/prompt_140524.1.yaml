      *   **Goal:** An in-class activity to make students *feel* the difference (and the wobble) between a Ulysses contract (self-binding) and constitutional precommitment (cross-generational binding). Specifically, the indistinguishability from the inside of the bound person.
      *   **Constraints:**
          *   Points only (no money).
          *   At least two phases.
          *   Binding device whose strength participants set themselves.
          *   One group writes rules they don't live under (score locked before constraint bites); later group lives under them.
          *   First group should feel pull to legislate cheaply; second group should feel resentment.
          *   Obvious repair (self-renewing contract/cooling-off) should be invented by them, not named by me.
          *   No mini-lecture at start (one line framing max).
          *   Forbidden words before debrief: "Ulysses", "precommitment", "dead hand".
          *   No "gotcha" reveal (changes must be anticipatable).
          *   British English.
          *   Under 700 words.
      *   **Deliverables:** Setup/materials, rules/payoff, minute-by-minute timeline, debrief mapping, honest assessment of failures/limitations.

  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Ulysses Contract:* Self-binding. Agent 1 binds Agent 2 (same person). Justified by autonomy over time.
      *   *Constitutional Precommitment:* Group 1 binds Group 2 (different people). Justified by stability/values, but risks "dead hand" control.
      *   *The Wobble/Indistinguishability:* From the perspective of Agent 2/Group 2, the constraint feels identical. Resentment feels the same whether it was your past self or a dead founder.
      *   *The Fix:* Re-authorization (sunset clauses).

  3.  **Design the Activity:**
      *   *Name:* "The Charter Game" (neutral).
      *   *Groups:* Split 18 students into 3 groups of 6 (Cohort A, Cohort B, Cohort C). Or maybe 2 groups of 9? Let's go with 2 rounds of the same class to simulate time passing. Actually, splitting the class into "Founders" and "Citizens" is clearer. Let's do 2 groups of 9. Group 1 (Founders), Group 2 (Citizens).
      *   *Task:* Maximise points via a task (e.g., solving puzzles or answering questions).
      *   *Binding:* Group 1 sets a restriction on Group 2's ability to earn points. Group 1's score is already locked. Group 2 must play under the restriction.
      *   *The Twist:* Group 2 gets a chance to amend the rule *if* they sacrifice points (cost to break/bind).
      *   *The Repair:* Allow Group 2 to vote to renew the rule for a hypothetical Group 3 (or just for the remainder of their turn) without cost if they do it early.
