      *   *Debrief:* Map Founders' distance to constitutionalism. Map Citizens' resentment to indistinguishability. Ask Citizens what they lacked (re-authorisation). Ask Founders why they didn't grant it (cheap legislation).
      *   *Honest Assessment:* Group 1 may write spiteful rules. Handle by enforcing 'physical possibility' only. Game can't simulate 'same agent' truly; you must articulate that Founders *could* have been Citizens.

