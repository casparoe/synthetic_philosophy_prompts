          2.  Phase 2 (Citizens): 9 students. Task: Answer 5 hard questions. Each correct = 10 points. BUT they must obey the Constraint. If they break it, they pay the Break Cost.
          3.  The Indistinguishability: The Citizens don't know if the Founders were benevolent or selfish.
          4.  The Repair: Halfway through Phase 2, offer a "Ratification Vote." If they vote unanimously, the constraint vanishes for the last 2 questions. But if they vote no, it stays. This mimics re-authorization.
      *   *Wait, need to ensure the "repair" is invented.* I shouldn't offer the vote. I need to structure the game so they *ask* for a way to change it.
      *   *Revised Mechanism:*
          1.  Group 1 (Founders): Earn points. Lock score. Write a Rule for Group 2. Set a "Penalty" for breaking it.
