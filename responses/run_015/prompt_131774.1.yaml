answer: |-
  In a contemporary operating room, Patient A undergoes donation after circulatory death (DCD) protocols following withdrawal of life-sustaining therapy; after cardiac arrest and a five-minute standoff period of asystole, death is declared by circulatory criteria, and cannulation begins for normothermic regional perfusion (NRP), where a balloon catheter occludes the aortic arch to restore blood flow to the abdominal organs while deliberately excluding the brain. At that exact moment $t$, Patient B is a hypothetical counterpart in the emergency department who has also experienced five minutes of untreated asystole and apnea, presenting with identical physiological markers of no cerebral blood flow and no cardiac output, yet the clinical team initiates standard advanced cardiac life support to restore full circulation including the brain. At time $t$, Patient A is legally and clinically dead, while Patient B is treated as living, despite there being no difference in their present physiological state or the epistemic access of their respective physicians, only in the interventions planned for the minutes following $t$.

  1. The circulatory-respiratory account is forced into the unwelcome verdict that the permanence of circulation loss is determined by clinical intent rather than physiological irreversibility. Under the whole-brain account, both patients lack current brain function, but only A is declared dead, suggesting the criterion tracks the *permission* to exclude recovery rather than the loss of function itself. The integrated functioning account faces a paradox where A's somatic integration is actively restored by NRP immediately after death is declared, implying the organism functions as a whole despite being legally dead. Each account struggles to explain why the identical biological state at $t$ constitutes death in one context and life in the other without appealing to the normative status of the planned intervention.

  2. The decisive feature is the planned selective restoration of somatic circulation excluding the brain, and removing this collapses the construction into the familiar and by now uninteresting case of a dispute over the duration of the no-touch period. Without the NRP intervention that restores bodily perfusion while maintaining cerebral exclusion, the scenario reverts to a standard debate about how long one must wait after asystole to ensure auto-resuscitation does not occur. That familiar dispute turns on empirical evidence regarding the likelihood of the heart restarting, whereas this case turns on the deliberate choice to prevent restarting in the brain while allowing it in the body.

  3. The strongest reply argues that cessation is only "permanent" when resuscitation is refused, making the moral decision constitutive of the biological fact. Proponents of this view contend that "irreversibility" in clinical practice never means physically impossible but rather means "will not be reversed," thereby embedding the decision not to treat into the definition of death itself. This move saves the circulatory criterion by admitting that the determination of death is not a purely biological judgment but a bioethical one licensed by the context of care.

  4. The case is best read as support for abandoning the determination of death in favour of a consent-based standard for procurement.
