  # Joint Statement on the Origin of the Born Rule in Everettian Quantum Mechanics

  ### I. Agreed Claims
  *Both parties affirm the following, distinguishing this collaboration from Collapse or Pilot-Wave interpretations:*

  1.  **Unitary Ontology:** The wavefunction is the complete ontology. Dynamics are strictly unitary; there is no collapse.
  2.  **Emergent Branching:** "Branches" are not fundamental entities but emergent structures defined by decoherence and coarse-graining. There is no precise integer count of branches.
  3.  **Outcome Reality:** All outcomes encoded in the superposition occur. There is no single "actual" outcome to the exclusion of others.
  4.  **Empirical Adequacy:** The Born rule (probability proportional to amplitude squared) is empirically adequate. No violation has ever been observed.
  5.  **Goal of Derivation:** A successful account must justify why a rational agent's credences (or caring measure) should align with squared amplitudes rather than naive branch counts or arbitrary coefficients.

  ### II. Disagreements

  | Issue | Team Derivation (Deutsch/Wallace) | Team Postulate (Measure/Uncertainty) |
  | :--- | :--- | :--- |
  | **Source of Probability** | Probability is not an ontological extra. It is a normative constraint on rational preference for an agent knowing she will branch. | Probability requires an additional posit: a measure of existence over branches or a principle of self-locating uncertainty. |
  | **Circularity** | Decision-theoretic axioms (e.g., diachronic consistency, substitutability) are neutral regarding amplitude. The Born rule falls out logically. | The axioms smuggle in amplitude-squared weighting implicitly. You cannot derive weights without assuming weights. |
  | **Default Intuition** | Naive branch counting is irrational because branches are not countable individuals. Rationality dictates weighting by amplitude. | Naive branch counting is the honest default for discrete outcomes. Overriding it requires a explicit postulate linking measure to amplitude. |
  | **Meaning of "Probability"** | **Verbal Dispute:** Strictly defined as betting odds/caring measure. No "objective chance" exists. | **Load-Bearing:** Requires a truth-apt notion of typicality. Credence must track an ontological measure to be justified. |

  ### III. Cruxes and Test Cases
  *Below are three concrete cases. For each, we state the specific sub-question, the agreed experimental setup, and each side's prediction/justification. Settling these would move the debate.*

  #### Crux 1: The Fan-Out (Copy Count vs. Amplitude)
  **Setup:** Subject enters superposition: Branch A (amp $\sqrt{0.999}$), Branch B (amp $\sqrt{0.001}$). In Branch B, the subject is scanned and instantiated as 1,000 near-identical copies in causally separated rooms. Branch A remains single.
  **Sub-Question:** Do betting odds shift toward Branch B due to copy count?
  **Team Derivation:** **No.** Rationality constraints forbid caring about copy count if amplitude is fixed. Utility is linear over successors within a branch; the branch weight is determined at the quantum split, not subsequent classical copying.
  **Team Postulate:** **No (but requires Postulate).** Naive counting suggests 1000:1 odds for Branch B. To get the correct 99.9:0.1 odds, we must posit that "measure of existence" tracks amplitude, not copy count. Derivation claims to get this for free; we say it secretly assumes the posit.
  **Resolution Condition:** If an axiom set is produced that explicitly references only topology/counting and yields Born weights, Team Postulate concedes. If axioms are shown to require amplitude-weighted premises, Team Derivation concedes.

  #### Crux 2: Continuous Variables (Coarse-Graining)
  **Setup:** Measurement of a continuous variable with Gaussian amplitude spread. "Number of branches" depends entirely on arbitrary coarse-graining width.
  **Sub-Question:** Does this kill branch counting outright?
  **Team Derivation:** **Yes.** Since branch count is arbitrary, rational agents cannot bet on counts. They must bet on payoffs defined on subspaces, which forces amplitude weighting via decision theory.
  **Team Postulate:** **Yes.** This kills naive counting, proving a continuous measure is needed. However, it does not prove decision theory generates that measure; it only proves the measure must be postulated as density rather than count.
  **Resolution Condition:** Agreement that counting is dead. Dispute remains on whether the measure is *generated* by rationality (Derivation) or *required* by ontology (Postulate).

  #### Crux 3: Quantum Sleeping Beauty
  **Setup:** Subject branches. Wake protocols vary across branches (e.g., woken once in High-Amp, twice in Low-Amp). Subject asked for credence in "High-Amp branch" upon waking.
  **Sub-Question:** Does this discriminate between teams?
  **Team Derivation:** **No.** Standard decision theory yields credence = amplitude squared, adjusted for waking frequency if utility depends on being right per waking.
  **Team Postulate:** **No.** Self-locating uncertainty + Measure Postulate yields the same number.
  **Resolution Condition:** **None.** This case does not discriminate. Both output identical numerics via different justificatory paths. It is a wash.

  ### IV. Verbal vs. Load-Bearing Disputes
  *   **Merely Verbal:** The definition of "probability." Both agree there is no objective chance (propensity) in unitary QM. If Team Derivation says "probability is just betting" and Team Postulate says "probability is typicality," they are often describing the same phenomenological constraint on the agent.
  *   **Load-Bearing:** Whether the decision-theoretic axioms are truly neutral. This is not semantics. If the axioms implicitly assume that an agent *should* care more about higher-amplitude successors independent of copy count, the derivation is circular. This is a formal logical question, not a definitional one.

  ### V. Falsification and Movement
  *   **Experimental:** A verified violation of the Born rule at any scale falsifies **both** teams immediately.
  *   **Against Team Derivation:** A proof that any decision-theoretic axiom set sufficient to derive Born weights must itself contain a premise referencing amplitude weighting.
  *   **Against Team Postulate:** A demonstration that self-locating uncertainty yields incoherent results without the measure posit, *and* that the measure posit is empirically redundant compared to pure decision theory.
  *   **What Moves the Debate:** A derivation whose axioms transparently mention only logic, topology, or information theory—never amplitude—and yet uniquely output squared amplitude. Team Postulate requires this to drop the posit. Team Derivation claims to have it; Team Postulate claims they haven't looked closely enough.

  ***

  **Note on Ill-Posed Cases:**
  Case 3 (Quantum Sleeping Beauty) is flagged as potentially ill-posed. Even in classical probability, the Sleeping Beauty problem lacks consensus (Halfers vs. Thirders). Using it to discriminate Everettian sub-interpretations risks conflating classical credence ambiguities with quantum weighting issues. While both teams claim to resolve it via the Born rule, the lack of a classical baseline makes it a weak crux. Case 1 (Fan-Out) is the strongest discriminator regarding the "counting vs. weighting" intuition.
