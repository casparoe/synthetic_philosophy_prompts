answer: |-
  Your friend has identified a real philosophical tension between fair notice and social coordination, but his framework risks converting functional norms into arbitrary membership dues that could easily be weaponized to excuse selfish behavior. If this theory holds, judging a visitor shifts from evaluating the act itself to evaluating the agent's relationship with the community, meaning a tourist queue-jumping is merely an error while a six-month resident doing the same is a moral violation. The line between one week and six months represents a threshold of "reasonable opportunity to learn," where the short-term visitor lacks the fair notice required for obligation, but the long-term expat has benefited from the social contract long enough to owe it compliance. This suggests that conventions like tipping or jaywalking are not merely coordination devices requiring universal adherence for efficiency, but genuine obligations derived from reciprocal membership; if they were purely functional, everyone would need to follow them immediately to prevent system failure, regardless of their residency status. Consequently, cities adopting this view would need to redesign enforcement to prioritize education over punishment for newcomers, perhaps waiving fines for those who can prove short-term status while treating norms as onboarding curriculum rather than static laws. However, you should be skeptical if your friend uses this to justify knowing violations, because the theory only excuses ignorance derived from lack of embedding, not willful disregard; if he knows the rule and chooses to ignore it because he hasn't declared himself "embedded," he is misusing the framework to avoid the very coordination costs the norms are designed to manage.
