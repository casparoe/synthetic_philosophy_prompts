prompt: |-
  I adjudicate first-party property claims for a mid-sized mutual insurer, and a startling share of my contested files turn on someone's not doing something: the caretaker who didn't shut off the water before the hard freeze, the property manager who never inspected the supply line, the alarm contractor that didn't run the annual test, and sometimes our own insured's failure to do the post-loss mitigation the policy demands. The policy language and state precedent hand me "proximate cause" with no guidance at all about absences, and I've noticed my reasoning drifts in a way that worries me: I call an omission a cause when the omitter had a duty, and dismiss it as mere background condition when they didn't — which means I'm deciding cases by pointing at norm violations rather than by anything causal, and I don't know if that's sound or a bias. Please turn what the philosophy of causation actually knows about omissions into a procedure I can run on a file in twenty to thirty minutes: the questions to ask in order (I suspect something like "cause of what, as opposed to what?" and "who or what counts as a candidate omitted preventer?" will have to appear early), what counts as a sufficient answer to each, where the procedure terminates in "not a cause" and where it can't settle the matter and has to hand off to coverage counsel or to my judgment, with the handoff points marked as places where values or law, not causation, are doing the work. It has to handle the cases that make omissions hard: two parties each of whose single omission alone would have prevented the entire loss; the omitted preventer that would itself have failed anyway; the omission that only matters because of a later storm no one had a duty to anticipate; the omission of a bystander with no duty whose act would trivially have saved the property. Then run the procedure on three claims — the caretaker and the burst pipe, a fire loss where both the landlord and the alarm contractor skipped inspections that either alone would have caught the hazard, and a mold claim where our insured's failure to mitigate after a small leak multiplied the loss — including at least one where the procedure yields an outcome I would rather it didn't. Finally, say plainly where the procedure will misfire and what it cannot do, especially whether it really answers my drift worry or only launders it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Adjudicator for a mid-sized mutual insurer handling first-party property claims.
      *   **Problem:** Struggling with "causation by omission" (failures to act). Worried that their reasoning is circular (calling it a cause *because* there was a duty, rather than finding a cause *then* assigning liability). This is the "drift."
      *   **Goal:** A 20-30 minute procedural checklist based on the philosophy of causation regarding omissions.
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   Termination points ("not a cause").
          *   Handoff points (where law/values take over from causation).
          *   Must handle hard cases: overdetermination (two omissions), futile omissions (would have failed anyway), intervening forces (storm), bystander omissions (no duty).
          *   Apply to three specific scenarios (Caretaker/Freeze, Landlord+Alarm/Fire, Insured/Mold).
          *   Include at least one counter-intuitive outcome.
          *   Final analysis: Where does it misfire? Does it solve the "drift" or launder it?

  2.  **Philosophical Grounding (Causation & Omissions):**

      *   *The Problem:* Omissions are ontologically tricky. Did "nothing" cause "something"? Most philosophers (Hart & Honoré, Lewis, McGrath) agree omissions aren't causal in the same physical sense as actions, but they are *legally* and *pragmatically* treated as causes.
      *   *The Trap:* The user's worry is the "Normative Dependency" problem. If I say $O$ caused $E$ *because* $D$ had a duty to do $A$, I'm conflating causation with liability.
      *   *The Solution:* Separate the *counterfactual dependence* (Would the loss have happened if they acted?) from the *normative selection* (Should we count this omission as a cause?).
      *   *Key Concepts:*
          *   Counterfactual Test (But-for).
          *   Normality/Default Conditions (What was expected to happen?).
          *   Overdetermination (Preemption/Duplication).
          *   Intervening Causes.
          *   The Duty/Cause Distinction (The core of the user's worry).

  3.  **Drafting the Procedure (The "Omission Causation Protocol" - OCP):**

      *   *Time Limit:* Needs to be tight. 5 steps max.
      *   *Step 1: Define the Event.* (Cause of *what*?)
      *   *Step 2: Counterfactual Test.* (Would the act have prevented it?)
      *   *Step 3: Normality/Expectation.* (Was the act the "default"?)
      *   *Step 4: Redundancy/Overdetermination.* (What if others also failed?)
      *   *Step 5: The Normative Handoff.* (Duty vs. Cause).

      *Refining Step 5:* This is crucial. The user wants to know where causation ends and law begins. The procedure must explicitly state: "If Steps 1-4 are met, you have a *candidate causal omission*. Whether it triggers liability depends on Policy/Statute." This addresses the "drift."

  4.  **Handling the Hard Cases within the Procedure:**

      *   *Two Omissions (Overdetermination):* Use a "NESS" test variant (Necessary Element of a Sufficient Set) or simply acknowledge both are causal candidates.
      *   *Futile Omission:* If the act wouldn't have worked, counterfactual fails. Not a cause.
      *   *Intervening Storm:* If the storm was unforeseeable/abnormal, it breaks the chain.
      *   *Bystander:* Counterfactual holds, but Normality/Duty fails.

  5.  **Running the Scenarios:**

      *   *Scenario 1: Caretaker/Freeze.*
          *   Act: Shut off water.
          *   Counterfactual: Yes, pipe wouldn't burst.
          *   Normality: High (winter protocol).
          *   Outcome: Causal omission.
      *   *Scenario 2: Landlord + Alarm/Fire.* (Overdetermination).
          *   Act: Inspect.
          *   Counterfactual: Either alone would have found it.
          *   Issue: Both are "but-for" causes in a redundant way.
          *   Outcome: Both are causal candidates. Liability depends on contract.
      *   *Scenario 3: Insured/Mold.* (Mitigation).
          *   Act: Dry out.
          *   Counterfactual: Yes, mold would be less.
          *   Issue: Policy duty vs. Causation.
          *   *Constraint:* Need one outcome the user "would rather it didn't" yield. Let's make the Caretaker one tricky. Or the Bystander. Let's try the Bystander in the analysis, or make the Landlord/Alarm one yield "Both are causes" which creates allocation headaches. Actually, let's make the *Futile Omission* case the counter-intuitive one. Wait, the prompt asks for specific scenarios. I need to make sure one of *those* three yields an uncomfortable result.
          *   *Idea:* In the Mold claim, if the insured *couldn't* have known the leak was there, the omission isn't "abnormal." But the prompt says "failure to mitigate after a small leak." Let's make the uncomfortable result about the *Alarm Contractor*. If the procedure says their omission *is* a cause, but the policy excludes their negligence, the adjudicator still has to pay. That's a coverage issue, not causation.
          *   *Better Uncomfortable Result:* The Caretaker. If the freeze was a "once in a century" event, the omission might be causal, but the *risk* wasn't foreseeable. The procedure might say "Cause," but the adjudicator wants to say "No Liability." I need to ensure the procedure distinguishes these.
          *   *Decision:* I will make the **Landlord/Alarm** scenario yield "Both are causes." This is uncomfortable because it forces an allocation decision the procedure can't make. Or, I will make the **Bystander** point clear in the analysis.
          *   *Actually, looking at the prompt:* "including at least one where the procedure yields an outcome I would rather it didn't." I'll manipulate the **Mold** scenario. If the insured failed to mitigate, the procedure confirms the omission caused the *additional* loss. The user might *want* to deny the whole claim, but the procedure isolates the omission to only the *aggravated* portion. That limits the insurer's leverage.

  6.  **Addressing the "Drift" Worry:**

      *   Does this solve it? It separates the *factual/normative baseline* (Step 3) from the *legal duty* (Step 5).
      *   Does it launder it? Potentially. "Normality" is often just "Duty" in disguise. I need to be honest about this in the final section.

  7.  **Final Review against Constraints:**

      *   20-30 mins? Yes, 5 steps.
      *   Ordered questions? Yes.
      *   Sufficient answers? Yes.
      *   Termination/Handoff points? Yes.
      *   Hard cases included? Yes (Overdetermination, Futility, Intervening, Bystander).
      *   Three claims analyzed? Yes.
      *   Uncomfortable outcome? Yes.
      *   Plain speech on misfire/laundry? Yes.

  8.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Professional, philosophical but practical, direct.
      *   *Structure:*
          1.  Introduction (Validating the worry).
          2.  The Procedure (Omission Causation Protocol).
          3.  Application to Claims.
          4.  Limitations & The "Drift" Audit.
      *   *Philosophy Check:* Rely on Hart & Honoré (Interruption of Course), Lewis (Counterfactuals), and McGrath (Norms). Ensure the distinction between "Cause-in-fact" and "Proximate Cause" is respected but clarified.

      *(Self-Correction during drafting)*: Make sure I don't just give legal advice. This is a claims handling procedure based on philosophical logic. Keep the distinction between *causal attribution* and *liability assignment* sharp.

      *Refining the "Uncomfortable Outcome":* In the Mold claim, if the insured didn't know about the leak, they couldn't mitigate. If the procedure counts "failure to mitigate" as a cause of the *spread*, it implies they *could* have acted. If the facts show they *couldn't* have known, the counterfactual fails. I need to construct the Mold scenario so the procedure works against the insurer's desire to deny *everything*. The procedure will isolate the omission to the *incremental* loss, preventing a full denial based on "failure to mitigate" if the initial loss wasn't their fault. That's a good "uncomfortable" result for an insurer.

      *Refining the "Drift":* The user worries they call it a cause *because* of the duty. The procedure forces them to establish the counterfactual *before* checking the duty. This breaks the circle. However, Step 3 (Normality) is where the drift might hide. I must highlight that.

  9.  **Final Polish:** Check timing, clarity, and ensure all prompt requirements are met. (e.g., "cause of what, as opposed to what?" must appear).

      *Let's write it.*
answer: |-
  ### The Omission Causation Protocol (OCP)

  **Purpose:** To isolate factual causation of an omission from legal liability, preventing the "normative drift" where duty creates cause rather than vice versa.
  **Time:** 20–30 Minutes.
  **Philosophy:** Based on counterfactual dependence (Lewis), normality conditions (Hart & Honoré), and the NESS test (Wright).

  ---

  #### Step 1: Define the Contrast (2 Minutes)
  *Question:* **"Cause of *what*, as opposed to *what*?"**
  You cannot test causation without a specific contrast class. An omission rarely causes an entire event; it causes the *difference* between the actual outcome and the expected outcome.
  *   **Action:** Write down the **Actual Outcome** (e.g., "Basement flooded on Jan 15") and the **Relevant Alternative** (e.g., "Basement remains dry on Jan 15").
  *   **Sufficient Answer:** The alternative must be physically possible, not just legally desirable.
  *   **Termination:** If the alternative was physically impossible regardless of action (e.g., the pipe was already burst before the caretaker arrived), stop. **Not a cause.**

  #### Step 2: The Counterfactual Test (5 Minutes)
  *Question:* **"If the agent had performed the omitted act, would the Relevant Alternative have occurred?"**
  *   **Action:** Run the mental simulation. Do not assume the act works perfectly; assume it works *as designed*.
  *   **Sufficient Answer:** "Yes, the loss is prevented" OR "Yes, the loss is significantly reduced."
  *   **Hard Case (Futility):** If the act would have failed anyway (e.g., the valve was broken), the omission is **not a cause**. The breakage is the cause.
  *   **Hard Case (Intervening Force):** If a later storm was so abnormal it would have breached the mitigation anyway, the counterfactual fails. Stop. **Not a cause.**

  #### Step 3: The Normality Baseline (5 Minutes)
  *Question:* **"Was the omitted act part of the 'Default Course of Events' independent of legal duty?"**
  This is where you catch the drift. You are looking for *statistical or functional normality*, not contractual obligation.
  *   **Action:** Ask: "In this specific context, without looking at the policy, is this act what usually happens?"
      *   *Caretaker in Winter:* Shutting off water is functionally normal.
      *   *Bystander on Street:* Stopping to save property is statistically abnormal.
  *   **Sufficient Answer:** "Yes, this is the standard operational mode for this role/context."
  *   **Termination:** If the act is abnormal for *anyone* in that position (e.g., a random passerby), stop. **Not a causal omission** (it is a background condition).
  *   **Handoff Point:** If the act is normal *only* because a contract says so, mark this. You have found a **Contractual Cause**, not a Natural Cause. Proceed to Step 5.

  #### Step 4: Redundancy & Overdetermination (5 Minutes)
  *Question:* **"Are there other omissions that alone would have prevented the loss?"**
  *   **Action:** Identify other agents who failed to act (e.g., Landlord *and* Alarm Contractor).
  *   **Sufficient Answer:**
      *   *Single Omission:* Proceed to Step 5.
      *   *Multiple Omissions:* If *either* act alone would have prevented the loss, **both are causal candidates.** Do not try to pick the "real" cause. Philosophy dictates both are causes.
  *   **Handoff Point:** If multiple omissions exist, causation is settled (both caused it). Allocation of liability is now a **Legal/Policy Question**. Hand off to counsel for contribution analysis.

  #### Step 5: The Normative Handoff (5 Minutes)
  *Question:* **"Does the Policy or Statute convert this Causal Omission into a Trigger for Liability?"**
  *   **Action:** Compare your finding from Steps 1–4 against the policy language (e.g., "Duties After Loss," "Protective Safeguards").
  *   **Sufficient Answer:** "The policy requires this act, and we established it was a causal omission."
  *   **Critical Check:** If you skipped Step 3 (Normality) and went straight to Policy, you have committed the **Normative Drift**.
  *   **Termination:**
      *   If Step 1–4 = "Not a Cause," the claim decision is **Coverage Denied** (no causal link).
      *   If Step 1–4 = "Cause," but Policy = "No Duty," the claim decision is **Coverage Granted** (cause exists, but no breach).
      *   If Step 1–4 = "Cause" AND Policy = "Duty," the claim decision is **Liability Established**.

  ---

  ### Application to Claims Files

  #### Claim 1: The Caretaker and the Burst Pipe
  *   **Facts:** Caretaker failed to shut off water. Hard freeze. Pipe burst.
  *   **Step 1 (Contrast):** Actual: Flooded basement. Alternative: Dry basement. (Pass)
  *   **Step 2 (Counterfactual):** If shut off, pipe doesn't burst. (Pass)
  *   **Step 3 (Normality):** In winter, shutting off water in vacant buildings is standard practice, even without a contract. (Pass - Natural Cause)
  *   **Step 4 (Redundancy):** No other omissions.
  *   **Step 5 (Handoff):** Policy requires maintenance.
  *   **Outcome:** **Causal Omission.** Liability attaches.
  *   **Note:** This is the clean case. The normality aligns with the duty.

  #### Claim 2: The Fire, The Landlord, and The Alarm Contractor
  *   **Facts:** Fire starts due to faulty wiring. Landlord didn't inspect (lease req). Alarm Contractor didn't test annual sensor (contract req). Either inspection would have found the wiring.
  *   **Step 1 (Contrast):** Actual: Building burns. Alternative: Fire caught early/never starts. (Pass)
  *   **Step 2 (Counterfactual):** If Landlord inspected -> No fire. If Contractor tested -> No fire. (Pass)
  *   **Step 3 (Normality):** Landlord inspections are standard. Alarm testing is standard industry practice. (Pass)
  *   **Step 4 (Redundancy):** **Hard Case.** Both omissions are sufficient on their own.
  *   **Outcome:** **Both are Causal Omissions.**
  *   **The Uncomfortable Result:** You cannot use causation to choose who pays. The procedure forces you to admit *both* caused the loss. You cannot deny the insured's claim by blaming the contractor exclusively based on *causation*. You must pay the insured and let subrogation fight the allocation. This removes your leverage to deny based on "the contractor was the real cause."

  #### Claim 3: The Mold and The Post-Loss Mitigation
  *   **Facts:** Small leak occurs (covered). Insured fails to dry out area for 3 weeks. Mold explodes. Insured argues leak caused mold. We argue failure to mitigate caused mold.
  *   **Step 1 (Contrast):** Actual: Severe mold remediation. Alternative: Minor drying/cleaning. (Crucial distinction: Do not contrast with "No mold ever," contrast with "No *severe* mold.")
  *   **Step 2 (Counterfactual):** If dried immediately, severe mold is prevented. (Pass)
  *   **Step 3 (Normality):** Is it "normal" for a homeowner to dry a leak? Yes, functionally, even without a policy clause. (Pass)
  *   **Step 4 (Redundancy):** None.
  *   **Step 5 (Handoff):** Policy has "Duties After Loss."
  *   **Outcome:** **Causal Omission for the *Aggravated* Loss Only.**
  *   **The Uncomfortable Result:** The procedure prevents you from denying the *entire* claim. It isolates the omission's causation to the *incremental* damage (the mold spread), not the initial water damage. You must pay the water damage. You can only deny the mold remediation costs. If you wanted to deny the whole file based on "failure to mitigate," this procedure blocks that reasoning as causally unsound.

  ---

  ### Limitations & The "Drift" Audit

  #### Where the Procedure Misfires
  1.  **The "Normality" Trap:** Step 3 asks what is "normal." In complex commercial relationships, "normal" is often defined *by* the contract. If you define normality by the contract, you have laundered the drift. You are still saying "It's a cause because they agreed to do it." To avoid this, Step 3 requires you to ask: "Would a reasonable person expect this act even without seeing the contract?" If the answer is no, you have a **Purely Normative Cause**. The procedure flags this, but it cannot solve it.
  2.  **Epistemic Uncertainty:** In the Fire Claim (Claim 2), we assumed the inspection *would* have found the fault. Often, we only know it *might* have. The procedure treats "would have" as binary. If the probability is <50%, the counterfactual fails. This forces you to make evidentiary calls that feel like causal calls.
  3.  **Moral Luck:** The procedure treats the Caretaker (Claim 1) as a cause. If the freeze never happened, the omission is identical but causally null. The procedure makes liability hinge on external luck (the weather), which feels unjust but is philosophically accurate to causation.

  #### Does It Answer Your Drift Worry?
  **Partially, but it exposes the wound rather than healing it.**

  *   **The Good:** It forces you to run the Counterfactual (Step 2) *before* checking the Duty (Step 5). This breaks the circular logic of "It's a cause because it was a duty." You might find a duty existed, but the act wouldn't have changed the outcome (Futility). In that case, the procedure stops you from calling it a cause.
  *   **The Bad:** Step 3 (Normality) is where the drift hides. Philosophers (like McGrath) argue that selecting *which* omissions count as causes is inherently normative. There is no "purely factual" way to distinguish the Caretaker's omission from the Bystander's omission without appealing to expectations (norms).
  *   **The Verdict:** This procedure does not eliminate normative judgment; it **quarantines** it.
      *   **Steps 1–2:** Pure Causation (Physics/Logic).
      *   **Step 3:** Mixed Causation/Norms (Expectations).
      *   **Step 5:** Pure Law (Policy).

  Your drift occurs when you mix Step 5 into Step 2. This procedure forces you to declare: "I am calling this a cause because physically it changed the outcome (Step 2) and it was expected behavior (Step 3), *therefore* I apply the duty (Step 5)."

  If you find yourself saying, "It's a cause *because* the policy says so," you will fail Step 3. That is the audit point. If you can't justify the "Normality" without reading the policy clause, you are not adjudicating causation; you are adjudicating breach. The procedure forces you to admit that distinction, even if it can't fully resolve the philosophical tension of whether omissions are "real" causes.
