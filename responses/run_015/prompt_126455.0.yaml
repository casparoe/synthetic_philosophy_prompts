      *   *Secretariat:* Must be anonymous *to the class* during the process? No, better if they are known but acting as a function. Actually, Kierkegaard's press is anonymous. Let's make the Secretariat wear a mask or sit with backs turned? No, too theatrical. Let's make the *output* anonymous. The Secretariat are just "The Editors."
      *   *The "Gut" Moment:* When the final statement is so bland it's meaningless, but they feel relieved it passed.
      *   *Debrief:* Map the "Editing" to "The Press." Map the "100% Vote" to "The Public." Map the "Private Card" to "The Single Individual."

  8.  **Writing the Response:**
      *   Structure: Activity Overview, Materials, Timeline, Roles/Rules, Facilitator Script (Dos/Don'ts), Debrief Plan, Honesty Check (Risks & Limitations).
