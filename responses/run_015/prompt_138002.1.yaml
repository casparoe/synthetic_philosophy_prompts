prompt: |-
  You are a professional philosopher specializing in social ontology, collective intentionality, and the theory of joint action — the literature on shared intention, plural subjects, collective acceptance, and group agency. Take the time to think this through properly: before you write anything you intend me to read, do a short unstructured pass in which you (a) list the candidate theories of joint action and authorship you might reach for, (b) pick out the four or five features of the practice below that are actually doing the philosophical work, and (c) note where the practice seems to contradict itself. Then write the final answer, shaped by that pass but not including it. Write throughout in American English.

  Here is what I want analyzed. I work on research-integrity policy for a consortium of journals, and I keep running into a puzzle about what our authorship rules are really saying.

  The standard regime, which most biomedical and social-science journals follow, has four conditions for being named an author of a paper: a substantial contribution to the conception or design of the work, or to the acquisition, analysis, or interpretation of its data; drafting the work or critically revising it for intellectual content; approval of the version to be published; and agreement to be accountable for every aspect of the work, so that questions about the accuracy or integrity of any part of it get investigated and resolved. The same guidance adds that each author should be able to identify which co-author is responsible for which other part, and should have confidence in the integrity of the others' contributions. Separately, one individual is designated the corresponding author and takes primary responsibility for all communication with the journal. Alongside this, many journals now publish a contributor-role statement: a fixed taxonomy of roughly fourteen roles — things like conceptualization, methodology, data curation, formal analysis, software, writing, supervision, funding acquisition — under which a person can be listed for a role without being an author at all.

  The regime is honored partly in the breach. Some papers in physics and genomics have bylines with thousands of names, where nobody could identify which co-author is responsible for which part, let alone vouch for all of them. Journals also routinely permit posthumous authors, who cannot approve anything or be accountable for anything. And most journals now state that an AI system cannot be an author, usually on the grounds that it cannot consent to the work or take responsibility for it — even when the system did much of the analysis and drafting.

  Now the proposal I have to evaluate. To deal with papers with more than twelve contributors, our consortium is considering what I will call distributed guarantee authorship. The byline would carry the name of the collaboration rather than a list of people. Each individual would be registered as a guarantor of record for an explicitly enumerated set of components — specific figures, tables, datasets, code, or sections of the argument. Each guarantor would sign a statement of mutual reliance: they certify that their component was produced in reliance on the others' components, and that they would have withdrawn it had they known some other component to be unsound. Corrections, expressions of concern, and retraction notices would attach to components and, derivatively, to their guarantors. No individual would vouch for the paper as a whole; the collaboration, listed as author in the indexing databases, would be the entity that owns the retraction — though the only sanctions available to us would still fall on individuals.

  So: what does all of this presuppose?

  Reconstruct the implicit theory. Is the four-condition regime best read as a theory of joint authorship in the technical sense — as marking a shared intention, a plural subject, a collectively accepted status, or a genuine group agent with attitudes of its own — or is it better read as an individualist allocation of credit plus a set of detachable role-responsibilities that nobody ever jointly willed? Does the accountability condition do real work in the theory, or is it an aspiration that the practice does not actually require?

  Then separate strict presupposition from good fit. Which parts of the practice could only make sense on one theory of collective intentionality, and which are compatible with several rival theories at once? I want to know where the practice is philosophically underdetermined — where, say, a shared-intention account, a plural-subject account, and a group-agency account would all license exactly the rules we already have, so that our rules cannot be evidence for any of them.

  Address the strains and the proposal directly. What should we conclude from the fact that the four conditions are systematically violated for very large collaborations and quietly waived for the dead, while being enforced vigorously elsewhere? What does excluding AI systems presuppose about whether answerability is constitutive of authorship rather than merely appended to it, and is that exclusion principled or ad hoc? And what view of joint action does distributed guarantee authorship embed: does its statement of mutual reliance actually create shared agency, or does it only mimic the outward structure of one theory of shared agency while quietly presupposing that joint action is nothing over and above structured mutual reliance and component-level accountability? What is lost when nobody answers for the paper as a whole — and would anything be lost if the collaboration itself really were an agent in the demanding sense, with decision procedures and the capacity to revise its own commitments?

  Finally, say what would have to change. If we replaced the view you think our current practice presupposes with each of its main rivals in turn, what concrete changes in journal policy would follow — different authorship conditions, different retraction and sanction practices, requirements that a group have a constitution or decision procedure before it may be an author, or the abandonment of the accountability condition altogether? Where the practice is underdetermined, tell me which additional facts about how journals, authors, and institutions actually behave would settle it.

  Give me a structured answer of roughly 900 to 1,200 words. Be concrete and argumentative rather than survey-like: commit to a reading, say which rival readings you are rejecting and why, and flag the point where you are least confident.
