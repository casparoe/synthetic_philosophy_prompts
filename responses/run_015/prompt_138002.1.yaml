answer: |-
  The standard four-condition regime for authorship is not merely a bureaucratic checklist; it is an attempted constitution for a specific kind of social entity. Philosophically, the regime presupposes a **Plural Subject** model of joint action, heavily inflected with **Group Agency** aspirations, though it frequently collapses into **Methodological Individualism** in practice. The critical feature doing the ontological work is the fourth condition: the agreement to be accountable for *every* aspect of the work. This condition cannot be explained by individual contribution alone. If authorship were merely a record of causal input, I would only be responsible for the data I gathered. By requiring accountability for the whole, the regime establishes a joint commitment that binds individuals into a normative unit distinct from the sum of its parts. This aligns with Margaret Gilbert's theory of plural subjects, where a "we" is formed through mutual obligation, rather than Michael Bratman's planning theory, which relies more on meshing sub-plans than normative binding.

  However, the practice is philosophically underdetermined in small-scale collaborations. A team of three satisfying all four conditions fits Gilbert's plural subject, Bratman's shared intention, and List and Pettit's group agency equally well. All three theories license the existing rules when mutual knowledge and responsiveness are possible. The underdetermination resolves only when we examine the strains. The existence of posthumous authors and thousand-name bylines reveals that the practice does not actually require the constitutive elements of joint agency. A dead author cannot hold a joint commitment; a physicist in a collaboration of 3,000 cannot vouch for the integrity of a specific dataset they never saw. Here, the practice contradicts its own presuppositions. It retains the *language* of joint accountability while operating on an *individualist* logic of credit allocation. The exclusion of AI systems, conversely, confirms that accountability is constitutive of authorship rather than appended. Since an AI cannot accept obligations, it cannot be part of the plural subject, regardless of its causal contribution. This exclusion is principled, not ad hoc, within the Plural Subject framework, even if it clashes with a purely causal view of contribution.

  The proposed "distributed guarantee authorship" represents a radical ontological shift. It abandons the Plural Subject model for a **Contractual Network** model. By stating that "no individual would vouch for the paper as a whole," the proposal explicitly denies the existence of a group agent or plural subject capable of bearing holistic responsibility. The "statement of mutual reliance" mimics the structure of joint commitment but lacks the essential feature of jointness: the commitment to the *joint* act itself. Instead, it creates a web of bilateral dependencies. This solves the integrity problem of large collaborations by truncating the scope of responsibility, but it loses the normative force of the original regime. If the collaboration is listed as the author in indexing databases, yet possesses no decision procedure to revise its own commitments or accept sanctions as a unit, it is a fictional agent. We are attributing agency to a label while punishing the humans behind it. This creates a mismatch: the ontology of the byline (collective) does not match the ontology of the sanction (individual).

  If we were to align policy strictly with the rival theories, concrete changes would follow. If we embraced the **Group Agency** view (List & Pettit) rigorously, journals would need to require a "constitution" for any collaboration listed as an author. This constitution would specify decision procedures for accepting data, resolving disputes, and authorizing retractions. The group itself would hold assets or status capable of being sanctioned, rather than merely passing sanctions to members. If we embraced **Methodological Individualism**, we would delete the fourth condition entirely. Authorship would become a transparent record of contribution (as in the contributor-role taxonomy), and accountability would rest solely with the corresponding author or the institution hosting the data. The "accountable for all" rule would be recognized as a fiction and discarded. If we embraced the **Plural Subject** view (Gilbert), we would have to ban posthumous authorship and cap authorship lists at a number where mutual knowledge is possible (e.g., Dunbar's number), forcing large collaborations to adopt group agency structures or list the collaboration as the sole author with members acknowledged separately.

  The most significant loss in the distributed guarantee proposal is the capacity for *collective revision*. A genuine group agent can change its mind; a network of individuals can only fracture. When a correction is needed, the current regime assumes the authors collectively endorse the correction. The proposal assumes only the affected guarantor does. This fragments the epistemic status of the paper. The paper is no longer a unified claim by a unified entity but a bundle of claims held together by mutual reliance. This weakens the epistemic trust readers place in the work, as the "whole" is no longer warranted by any single agent or collective.

  I am least confident in the assessment of the "corresponding author" role. It is possible that current practice implicitly treats the corresponding author as a proxy for the group agent, bearing the burdens of agency on behalf of the plural subject. If so, the group agency model is already partially implemented, with the corresponding author acting as the executive function. However, since sanctions still fall on all authors in cases of misconduct, this proxy view is incomplete.

  To settle the underdetermination in current small-team practices, we would need evidence of how authors actually deliberate. Do they decide to publish as a "we" (Plural Subject), or do they merely aggregate individual "I"s (Individualism)? Surveys on whether authors feel obligated to defend work they didn't do would clarify this. Until then, the consortium faces a choice: admit that authorship is merely credit (Individualism) and drop the accountability rule, or enforce the accountability rule and ban practices that make joint commitment impossible. The distributed guarantee proposal attempts a middle path that may satisfy administrative needs but fails to cohere ontologically. It creates a collective name without a collective mind, which is precisely the condition that allows integrity failures to persist in large collaborations. To fix integrity, you must fix the agency.
