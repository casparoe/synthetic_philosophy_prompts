          *   *Claim:* "Ordinary" men became killers due to *context*, not necessarily prior ideology.
          *   *Explanatory Type:* Proximate causation, mechanism sketch (how the killing happened *in that moment*).
      *   **Goldhagen (*Hitler's Willing Executioners*):**
