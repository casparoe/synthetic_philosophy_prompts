          *   Covering Law Model (Hempel) vs. Narrative Explanation.
          *   Explanatory Pluralism (Kincaid, Dupré).

  5.  **Drafting the Diagnosis (Iterative Process):**

      *   *Initial thought:* It's definitely explanatory pluralism. They are asking different questions.
      *   *Refinement:* It's not *just* pluralism; it's a conflict over *causal priority*. Goldhagen claims his factor is the *primary* cause. Browning claims his factor is *sufficient* without the other. So it's not fully compatible; it's a competition over causal weight.
