  ### 1. Three Consistent Rules and Predictions

  Based on your professor's track record, here are three distinct methodological rules that fit his past verdicts. Each prioritizes a different type of evidence (Textual Proximity, Material Verification, or Naturalistic Plausibility).

  | Rule | Methodological Principle | Prediction: Theseus (Knossos) | Prediction: Xia (Erlitou) | Prediction: Vinland (Sagas) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A. The "Contemporary External Witness" Rule** | **Kernel** requires a contemporary *external* textual reference (not the story itself) corroborating the specific polity or person (e.g., Hittites for Troy). **Legend** lacks this, even with archaeology. | **Legend** (No contemporary text names Theseus or Athens' tribute; Knossos is Minoan, not Athenian). | **Legend** (No contemporary writing names "Xia"; Erlitou is anonymous archaeology). | **History/Kernel** (Adam of Bremen is a near-contemporary external chronicle; L'Anse aux Meadows is material proof). |
  | **B. The "Material Correspondence" Rule** | **Kernel** requires archaeology that matches the *scale and setting* of the story, regardless of contemporary text. **Legend** results when archaeology contradicts or is absent (e.g., Sinai). | **Kernel** (Knossos is a real, maze-like Bronze Age palace matching the setting). | **Kernel** (Erlitou is a real Bronze Age state in the Yellow River valley matching the description). | **History** (L'Anse aux Meadows is a definitive Norse site matching the voyage claim). |
  | **C. The "Naturalistic Core" Rule** | **Kernel** requires the central event to be physically possible (no monsters/magic). **Legend** results if the core claim violates natural law, even if the setting is real. | **Legend** (The core claim involves a bull-headed monster; the "tribute" is inseparable from the myth). | **Kernel** (A dynasty is physically plausible; the mythic accretions can be stripped away). | **History** (A voyage is physically plausible; the site proves it occurred). |

  *(Note: Probabilities are implicit in the categorical predictions above, but Rule A is the most restrictive, Rule B the most permissive regarding text, and Rule C the most restrictive regarding genre.)*

  ### 2. Best Guess and Underlying Logic

  **My Verdict Predictions:**
  *   **Theseus:** **Legend.**
  *   **Xia Dynasty:** **Kernel.**
  *   **Norse Voyage (Vinland):** **Kernel** (bordering on History for the landing event, but the Saga narrative remains distrusted).

  **The Professor's Actual Rule:**
  He is operating on a principle of **Consilience of Independent Evidence**, heavily weighted toward **Contemporary External Attestation**.

  **Why this beats the alternatives:**
  1.  **It explains the Troy/Arthur split:** Both have late texts and "heroic" narratives. The deciding factor was the Hittite archives (external contemporary text) for Troy, which Arthur lacks. This supports **Rule A** over Rule B (which would make Arthur a Kernel if we count later castles as "material").
  2.  **It explains the Exodus concession:** He admitted Semites *probably* left (plausibility/Rule C) but refused to call it a verdict because there was no Egyptian record or Sinai trace (lack of independent verification). This supports Consilience over Rule C.
  3.  **It explains the Catalogue of Ships:** His comment that the text "would tell us nothing at all" if it didn't match the archaeological map confirms that the *narrative itself has zero evidentiary weight* without independent verification.
  4.  **It explains Gilgamesh:** Gilgamesh is a "Split" (Kernel for person, Legend for story). The King List is a textual tradition (internal), but Uruk's archaeology is massive. Xia is analogous: Erlitou is massive archaeology, but lacks the "Hittite" (external name) factor. However, unlike Arthur, Xia has a specific archaeological *state* (Erlitou) corresponding to the *era*, whereas Arthur has no specific 5th-century kingdom identified. Thus, Xia gets Kernel (like Gilgamesh), Arthur gets Legend.

  **Why Theseus is Legend:** While Knossos exists (Material), there is no contemporary text linking it to "Theseus" or "Athens" (External Witness), and the core narrative relies on a monster (Naturalistic Core). Unlike Troy, where the *war* is plausible and externally attested, the Theseus story is Athenian political propaganda about Minoan dominance, which the archaeology (Minoan power) actually complicates rather than confirms.

  **Why Vinland is Kernel:** It has the L'Anse aux Meadows site (Material) and Adam of Bremen (External Witness). However, because the Sagas contain "fairy-tale material," he will likely withhold "History" (which he reserves for narratives trusted *as reportage*, like Alexander) and grant "Kernel" (the landing happened, the story is embellished).

  ### 3. The Decisive Case

  **The Case that Best Separates the Rules:**
  The **Xia Dynasty** case is the strongest discriminator.
  *   **Rule A (External Witness)** predicts **Legend** (no contemporary name).
  *   **Rule B (Material Correspondence)** predicts **Kernel** (Erlitou site matches the description of a primal dynasty).
  *   **Rule C (Naturalistic Core)** predicts **Kernel** (dynasties are plausible).
  *   *My prediction (Consilience)* predicts **Kernel**, because the archaeological evidence of a *state* is strong enough to parallel Gilgamesh, even without the Hittite-style external letter. If he rules **Legend**, he prioritizes Contemporary Naming above all. If he rules **Kernel**, he prioritizes Archaeological Scale.

  **The Hypothetical "Decisive Case":**
  To settle the question of whether he requires *External Text* or just *Material Evidence* for a Kernel, you would propose this case:

  > **"The Named Shard":** A legendary king (e.g., "King Log") is described in texts written 1,000 years later. Archaeologists find a contemporary palace from the correct period, but no writing. However, they find a single contemporary pottery shard in a distant trade city that bears the inscription "Property of King Log."
  >
  > *   **If he rules Kernel/History:** He values the **Contemporary Name** (External Witness) above the lack of a palace link.
  > *   **If he rules Legend:** He values the **Material Context** (the shard proves the name existed, but not the *narrative* or the *power* of the king in his homeland) and requires the archaeology to be in the *home* territory to count.

  This forces him to choose between "Proof of Name" (Text) vs. "Proof of Power" (Archaeology), which is the tension currently hiding in his Xia and Gilgamesh rulings.
