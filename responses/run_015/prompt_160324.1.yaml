  **The sequence**
  Divide the 90 minutes into four rigid phases. First, 15 minutes of pure manipulation. Hand out the rules and axiom MI. Forbid any discussion of "meaning" or "truth." Let them generate strings. When frustration peaks, pause. Second, 25 minutes on the invariant. Do not suggest mod-3. Ask: "What property does MI have that MU lacks?" Guide them to count I's. When someone spots the mod-3 pattern, stop. This is the pivot. Third, 35 minutes on formalizing the proof. This is where you name "jumping out of the system." Explicitly state: "You are now working in a meta-system." Write the induction on the board. Base case: MI has 1 I (1 mod 3). Inductive step: Show each rule preserves non-divisibility by 3. Rule 1 (add U): I count unchanged. Rule 2 (double): $n \to 2n$. If $n \not\equiv 0$, then $2n \not\equiv 0$. Rule 3 (III->U): $n \to n-3$. Modulo 3 invariant. Rule 4 (UU delete): I count unchanged. Conclude: No theorem has $0 \mod 3$ I's. MU has 0 I's. Therefore, MU is not a theorem. Fourth, 15 minutes on implications. Discuss decidability and Gödel briefly.

  The critical move is naming the meta-system exactly when they switch from deriving strings to proving properties of strings. Do not call it "philosophy" or "mysticism." Call it "number theory applied to syntax." This prevents the "turtles all the way down" nihilism. The outside proof is not less certain; it is a different kind of certainty. Ensure the induction step is written formally. Students often skip from "rules preserve" to "theorems have" without seeing the induction over derivation length. Make that explicit. If you rush this, they leave thinking the invariant is a trick, not a proof.

  **The carrying example**
  Skip the ●/▲ warm-up. It consumes precious time and risks teaching that invariants are always obvious counting tricks. The MIU system is sufficiently simple to analyze within 90 minutes if you prune the play phase. If you feel they need a scaffold, use a 5-minute verbal example: "Axiom 1. Rule: Add 2. Target: 4." Ask if 3 is reachable. They'll say no (parity). Ask why. They'll say "odds stay odd." Ask "prove it." This mirrors the MIU structure without the string syntax overhead. However, switching systems mid-session confuses the "jump out" framing. Stick to MIU. The risk of your proposed ●/▲ system is that the rules don't change the count, making the invariant trivial (static vs. dynamic). MIU's doubling rule is crucial because it changes the count but preserves the mod-3 property. That dynamic preservation is the lesson. Don't dilute it with a static invariant warm-up. Use the saved time to deepen the induction proof.

  **Misconception map**
  Intervene on "Meaning" immediately: "Symbols are ink." Intervene on "Backwards" during play: "Rules are one-way functions." The critical intervention is the Induction Gap. Students see "Rules preserve property" and assume "Therefore all theorems have property." You must show the bridge: Induction on derivation length. Write: "Let $S$ be a theorem. There exists a derivation $D_1, ..., D_k=S$." Show property holds for $D_1$ and propagates. This blocks the "it's just a trick" objection. Regarding "System is broken": Correct this to "The system is incomplete regarding MU." It is consistent; it just doesn't capture all strings. Regarding "Outside is mysticism": Emphasize that the meta-proof uses standard arithmetic, which they trust. It is not intuition; it is rigor. Regarding "Unprovability is uncertain": The meta-proof establishes unprovability with certainty. It is not a lack of effort; it is a structural impossibility. Address these during the formalization phase, not the play phase.

  **The check**
  Hand out a slip: System Q. Axiom: M. Rules: M -> MI, MI -> MUI. Target: MUI. Ask: "Derive or Prove Impossible." If they spend 15 minutes looking for an invariant, they missed the point. The check must force a decision: is this a derivation task or a meta-proof task? Give them a system where the target IS derivable. It counters the "nothing is provable" nihilism. If they try to apply mod-3 blindly, they will fail to derive it. This separates those who memorized the MU result from those who understood the method: decide if an invariant exists, otherwise derive.

  **What I refuse and how I say so**
  When asked "Is there a general test?", answer: "For MIU, yes. For arithmetic, no." Do not derive the MIU decision procedure; it's tedious. State it exists. Regarding Gödel: Stop the analogy where truth enters. MU is not "true but unprovable." It is syntactically underivable. Gödel's sentence asserts its own unprovability within the system. MIU has no semantics. Say: "MIU shows unprovability from the outside. Gödel shows a sentence unprovable from the inside that claims to be true. That requires arithmetization, which we are not doing. Don't conflate 'undecidable system' with 'this specific unprovable string'." Keep the boundary sharp.
