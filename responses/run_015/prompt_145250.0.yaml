      *   **User's Task:** Separate out the precise claims the sentence could stand for. Evaluate each (Platitude, Substantive/Defensible, False/Settled). Determine which reading each student *needs* for their argument. Check survival against Bell's Theorem/Experiments (specifically regarding determinism vs. locality). Address the Free Will leap (determinism $\neq$ no free will; randomness $\neq$ free will). Mention Einstein's actual view on free will (Schopenhauer).
      *   **Output Format:** A structured list suitable for reading out at the start of the next session.

