      *   *Check:* Did I handle the Free Will leap? Yes, emphasize that neither randomness nor determinism straightforwardly yields "libertarian free will."
      *   *Check:* Is the Bohmian point clear? It's often a sticking point. Need to clarify that Bohm saves determinism but kills locality, which Einstein also hated. So Einstein would likely still reject Bohm.

