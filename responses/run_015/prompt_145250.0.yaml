      *   *Context:* Debate over the interpretation of Quantum Mechanics (QM), specifically the Born Rule (probabilities). Einstein disliked the idea that probability was fundamental/ontological rather than epistemic (due to ignorance).
      *   *Einstein's "God":* Spinoza's God (*Deus sive Natura*), not a personal, interventionist deity.

  3.  **Identify the Distinct Claims (The "Readings"):**
