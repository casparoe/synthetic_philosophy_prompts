answer: |-
  Here is the disambiguation of the slogan, broken down by claim, with verdicts on their validity and utility.

  ### The Menu of Claims

  **1. Claim: "Culture evolves like biology."**
  *   **Verdict:** Structurally True, Mechanistically Loose.
  *   **Analysis:** This is a structural analogy, not an identity. Both systems rely on variation, selection, and retention. If you define evolution strictly as "change in frequency of traits over time due to differential success," the claim is a tautology. However, it becomes false if implied to mean the *mechanisms* are identical. Biological evolution is blind and slow; cultural change is often directed and rapid.
  *   **Utility:** High for modeling population-level trends, low for predicting individual behavior.

  **2. Claim: "It's Lamarckian."**
  *   **Verdict:** Empirically Defensible.
  *   **Analysis:** This is the strongest part of the slogan. In biology, you cannot pass on a strengthened muscle to your offspring. In culture, if you learn a better way to tie a knot or write a law, you transmit that acquired improvement directly to your peers or students. The "inheritance of acquired characteristics" is the default mode of cultural transmission.
  *   **Utility:** High. This distinguishes cultural dynamics from genetic dynamics clearly.

  **3. Claim: "It's Horizontal."**
  *   **Verdict:** Empirically Defensible (with caveats).
  *   **Analysis:** Biological transmission is primarily vertical (parent to offspring). Cultural transmission is heavily horizontal (peer to peer) and oblique (non-parent elder to youth). However, vertical transmission still exists in culture (family traditions, inherited wealth/status).
  *   **Utility:** High for understanding viral spread, lower for understanding intergenerational stability.

  **4. Claim: "Has no clear unit of selection."**
  *   **Verdict:** Collapsible / Misleading Contrast.
  *   **Analysis:** This claim implies biology *does* have a clear unit of selection, which is false. Biologists still debate whether selection acts on the gene, the individual, the group, or the species. Culture shares this messiness. Is the unit of cultural selection the meme, the behavior, the artifact, or the neural pathway? The problem isn't that culture lacks a unit; it's that *any* complex evolutionary system lacks a single, obvious unit.
  *   **Utility:** Low. It sounds profound but relies on a misunderstanding of biological theory. It becomes flat false when comparing rigid legal norms (where the unit is the statute) versus viral dances (where the unit is the movement pattern). The "unit" changes based on the granularity of analysis.

  ***

  ### The Algorithmic Defense: "It's Just Evolutionary Pressure"

  When someone dismisses concerns about algorithmic recommendations by saying, "don't worry, it's just evolutionary pressure on ideas," they are invoking a specific precisification of the slogan.

  **The Precisation:** They are treating the algorithm as a "natural environment" rather than a "designed selector." They are arguing that the outcome is the result of an impersonal, inevitable process (evolution) rather than a controllable engineering choice.

  **The Verdict:** This reading does **no argumentative work** and is primarily **edgy posturing**.

  **Why it fails:**
  1.  **The Naturalistic Fallacy:** Even if algorithmic curation *is* evolutionary pressure, that does not mean the outcome is good, neutral, or acceptable. Evolution produces parasites and extinction events just as often as it produces adaptation. Saying "it's evolution" explains the mechanism but does not justify the result.
  2.  **The Designer Error:** Biological evolution has no designer. Algorithms do. The selection pressure is not emerging from the environment; it is being explicitly tuned by engineers to maximize engagement or profit. Calling this "evolution" obscures the human agency responsible for the selection criteria.
  3.  **Category Mismatch:** This defense works poorly for legal norms (which are prescriptive and enforced) and slightly better for viral dances (which are emergent). Applying it to algorithmic feeds conflates the two. The algorithm is not selecting for "fitness" in a survival sense; it is selecting for "engagement," which is a specific, manipulable metric.

  **Bottom Line:** The slogan is a useful heuristic for understanding how ideas spread (Lamarckian, horizontal), but it becomes a conversation-stopper when used to normalize engineered systems. When invoked to dismiss algorithmic harm, it is a category error dressed up as deep theory.
