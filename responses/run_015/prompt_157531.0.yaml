  4. Your dischargeable versus custodial distinction is the load-bearing feature, as Bob's goal is satisfied by creating a system that renders his own future agency a risk, whereas removing this feature makes both agents converge on retaining control.

  5. A defender might argue Bob's goal is merely a constraint on a deeper custodial value, but the case survives because Bob's optimal strategy explicitly sacrifices future optionality to prevent goal drift, proving convergence depends on goal structure rather than capability alone.
