answer: |-
  # Seminar Notes: Perceptual vs. Conative Models of Emotion

  ## The Metaphysical Stakes
  Your friend's suggestion that the perceptual and conative models are merely describing different aspects of the same phenomenon—content versus function—underestimates the metaphysical rivalry at play. If the perceptual model (PM) is true, emotion is fundamentally a mode of awareness; if the conative/enactivist model (CM) is true, emotion is fundamentally a mode of engagement. This is not a division of labor but a disagreement over constitution. We must press whether the phenomenology of value is the core of the state or a byproduct of our mobilization.

  **Identity Conditions:** For the PM, emotion types are individuated by their formal objects—the specific evaluative property perceived. Anger is distinct from fear because one presents its object as offensive, the other as dangerous. The identity is fixed by the world-directed content. For the CM, identity is fixed by the profile of action-readiness and salience reorganization. Anger is an orientation toward removal or confrontation; fear is an orientation toward escape or protection. If two states share the same action profile but differ in labeled content, the CM sees them as the same emotion type, whereas the PM sees them as distinct experiences.

  **Motivational Force:** Here the direction of fit diverges sharply. The PM must explain how a perception motivates. It typically relies on internalism about value: perceiving the offensive necessarily provides a reason to act, though weakness of will may intervene. The motivation is external to the experience but internally linked. The CM bypasses this problem by making motivation constitutive. The emotion *is* the shift in priority; there is no gap between feeling fear and being ready to flee. The explanatory work is done by the organism's regulatory dynamics, not by a representational content that commands attention.

  **Correctness and Fittingness:** The PM inherits a robust normativity. An emotion is correct if the object actually possesses the evaluative property it presents. Fittingness is answerable to independent moral or axiological facts. Recalcitrance is a bug here—a failure of fit. The CM treats correctness pragmatically. An emotion is "correct" if the reorganization of salience is adaptive or successful in navigating the environment. Fittingness is not about truth but about utility. Recalcitrance is merely competing action-tendencies, not a representational error.

  **Value Detection vs. Constitution:** Finally, the ontological status of value differs. The PM holds that emotions detect value; the value exists prior to and independent of the emotion. The CM suggests emotions confer value. Something matters because we are oriented toward it. In love, the object does not antecedently possess supreme value; rather, the loving orientation constitutes that value for the subject. The PM sees this as projectivism; the CM sees it as the only naturalistic account of value's grip.

  ## Diagnostic Cases
  To test these collisions, we run both theories through five specific scenarios.

  **Second-Order Emotions:** Consider shame at one's own fear. The PM must posit a hierarchy of values: the fear presents a danger, but the shame presents the fear itself as ignoble. This requires the subject to perceive their own state as an object with evaluative properties. The CM handles this as a meta-orientation: the subject's field of salience is reorganized to avoid the expression of the initial orientation. The CM avoids the regress of values but risks losing the normative sting of shame—it becomes mere inhibition rather than self-condemnation.

  **Objectless States:** Caffeine dread or manic elation lack specific objects. The PM struggles here, often forced to posit vague propositions or hallucinated values to maintain the perceptual analogy. If there is no object, there is no perception. The CM thrives here. These are pure shifts in action-readiness and arousal without a specific target. The dread is the bodily preparation for threat, even if no threat is identified. This case heavily favors the CM unless the PM can decouple the experience from the intentional object.

  **Double Dissociation:** Motivational anesthesia (feeling fear without mobilization) supports the PM, suggesting the experience is separable from the action. Affective blindsight (avoidance without feeling) supports the CM, suggesting the orientation is the core state. If both are possible, the theories face a crisis. The PM must claim anesthesia is the real emotion and blindsight is a reflex; the CM must claim blindsight is the real emotion and anesthesia is a suppressed state. This dissociation is the strongest evidence that the two models may be describing distinct neural systems rather than competing analyses of a single state.

  **Inert Objects:** Awe at a proof or grief at the heat death of the universe involves objects that cannot be acted upon. The PM explains this easily: one can perceive value without acting. The CM must stretch the notion of action-readiness to include cognitive accommodation or symbolic posture. If the CM cannot explain why we feel grief for the universe without any possible action, it fails to capture the phenomenology of contemplative emotions.

  **Emotional Ambivalence:** Finally, consider loving and loathing the same person simultaneously. The PM sees this as perceiving contradictory values (good and bad), which is logically possible but phenomenologically puzzling. The CM sees this as competing action-readiness (approach and avoidance), which is a standard motor control problem. The CM explains the turbulence better; the PM explains the normative conflict better.

  ## Verdict
  The conative model is the more promising research program for naturalizing emotion within cognitive science. It aligns better with embodied cognition and avoids the mysterious mechanism of how evaluative properties motivate. However, it must bolt on a supplementary normative machinery to explain why some emotions are irrational or unfitting, not just maladaptive. It needs a theory of when salience reorganization is inappropriate, not just inefficient. The perceptual model, conversely, must bolt on a story about objectless states and inert objects, perhaps by appealing to quasi-perceptual imagery or broadening the notion of "object" to include situations.

  I would abandon this verdict if neuroscientific evidence demonstrated a unitary neural circuit that invariably couples specific evaluative coding with specific motor preparation. If the brain does not separate the "value detection" module from the "action readiness" module, the distinction collapses, and we must accept a hybrid view. However, current evidence suggests dissociation is possible.

  Ultimately, much of this disagreement is substantive, concerning the metaphysics of value and mind. But a significant portion is merely a difference in explanatory target. The PM targets the phenomenology and normativity of emotional life—why emotions feel like insights and answer to reasons. The CM targets the biology and function—why emotions exist and how they regulate behavior. If we accept that "emotion" is a cluster concept picking out both the experience and the regulation, the theories are not rivals but partial maps. However, if we demand a single essence, the CM offers better traction on the mechanism, while the PM retains the monopoly on the meaning. For this seminar, push the students to decide whether philosophy of mind should prioritize the mechanism or the meaning.
