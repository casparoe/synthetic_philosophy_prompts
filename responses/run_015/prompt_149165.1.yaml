  Verdict: Reject step (5); the core cost is that numerical identity requires a "non-branching clause," meaning non-destructive uploading produces a psychological successor rather than preserving the original self.

  **Analysis of the Misstep**
  The error lies in **step (5)**. This step applies the sufficiency condition from (1) (functional continuity) to a fission scenario without accounting for the logical requirements of *numerical identity*. Identity is a one-to-one relation (transitive and unique), whereas causal/functional continuity is a one-to-many relation. Step (5) assumes that because both streams B and D satisfy the *intrinsic* conditions of continuity, they both satisfy the *relational* condition of identity. This ignores the fact that identity cannot branch.

  By rejecting (5), you preserve (1) as a *ceteris paribus* principle: functional continuity secures identity *provided there are no competing continuers*. This blocks the contradiction in (7) because only one stream (or neither, depending on your specific "closest continuer" theory) can be identical to the original.

  **The Core Cost**
  Giving up (5) to save (1) and (11) forces you to adopt a **Non-Branching Clause** for personal identity. This incurs two major costs for the uploading proponent:

  1.  **Extrinsicity of Identity:** Whether you survive a process depends not just on what happens to you, but on what happens elsewhere in the universe (i.e., whether a duplicate exists). If a perfect copy of you spontaneously forms on Mars, your identity status on Earth could theoretically be compromised.
  2.  **The Impossibility of Non-Destructive Uploading:** If the biological original (B) is retained, the digital upload (D) cannot be numerically identical to the original person, because identity cannot branch. The upload is merely a psychological twin or successor. To preserve *numerical identity* (the "I" that survives), the uploading process must be **destructive** (the biological substrate must be ceased) to ensure the continuity relation remains one-to-one. You can copy yourself, but you cannot *move* yourself without destroying the original.
