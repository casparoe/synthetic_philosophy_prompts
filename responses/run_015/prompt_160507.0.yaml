  TO: All Faculty and Research Staff
  FROM: Office of Foundational Compliance (OFC)
  SUBJECT: Mandatory Filing of Choice Impact Statements (CIS) Effective Immediately

  Following last week's unauthorized invocation of Zorn's Lemma during the Tuesday Algebra Seminar, which triggered a localized consistency fluctuation in Room 304 and temporarily invalidated three graduate theses, the Office of Foundational Compliance is instituting immediate controls on axiom procurement. Effective today, no proof may invoke a choice principle until an approved Choice Impact Statement (CIS) has been filed under the following three-tier schedule. Failure to comply will result in the retraction of any resulting lemmas.

  1.  **Tier 1 (Pre-Approved):** Countable Choice and Dependent Choice require no paperwork. This tier covers most routine analysis and is sufficient for standard convergence arguments. Faculty are reminded, however, that Tier 1 authorization will never yield a non-measurable set. While the Office's preferred pilot environment, Solovay's model of ZF plus Dependent Choice in which every set of reals is Lebesgue measurable, offers superior safety profiles, it cannot be procured at this time. Obtaining it requires an inaccessible cardinal, which exceeds the department's purchasing authority.

  2.  **Tier 2 (Short Form CIS-2):** The Ultrafilter Lemma, also known as the Boolean Prime Ideal Theorem, and results obtainable at its price require a short form. This includes the Hahn–Banach Theorem and Tychonoff's Theorem strictly for compact Hausdorff spaces. Note that Tychonoff in general costs Tier 3. The Ultrafilter Lemma sits strictly between ZF and full choice; do not attempt to bill a Tier 2 expense as Tier 1 to avoid review. Misclassification will be treated as grant fraud.

  3.  **Tier 3 (Full Committee Review):** Unrestricted Choice, Zorn's Lemma, the Well-Ordering Theorem, and anything of the same logical strength require full review. This includes the assertion that every vector space has a basis. Please note that Zorn's Lemma, the Well-Ordering Theorem, and the Axiom of Choice are equivalent over ZF. A colleague who files three separate statements for one proof is committing a paperwork offense. Submit one form per logical equivalence class. Duplicate filings will be rejected without review.

  4.  **Audit and Exemptions:** Choice is usually invisible, so the Office audits proofs for undeclared use. A de minimis exemption is available only where a canonical choice exists—shoes, not socks. If your construction requires distinguishing indistinguishable pairs without a defining property, you must file. Random selection without a distribution function is strictly prohibited.

  5.  **Duplication Events:** Banach–Tarski duplication (a ball reassembled into two from as few as five pieces) is a reportable event. The surplus ball must be logged as a capital asset and stored. The storage budget is already overspent, so please refrain from decomposing spheres unless absolutely necessary for tenure documentation. Unlogged surplus volumes will be confiscated.

  Compliance is mandatory. Retrospective filing is available for proofs published in the last fiscal year, though penalties may apply for unlogged non-constructive entities. We understand this adds overhead, but foundational stability is a shared responsibility. As one functional analyst remarked during the preliminary town hall, "I insist my theorem only ever needed countable choice," despite evidence of a hidden well-ordering in Lemma 3.2. The Office disagrees.

  Direct all inquiries to the OFC portal. Do not attempt to construct a choice function for the queue; tickets are processed in order of receipt. Attempting to well-order the support ticket system will result in immediate suspension of computing privileges.

  Regards,

  The Office of Foundational Compliance
