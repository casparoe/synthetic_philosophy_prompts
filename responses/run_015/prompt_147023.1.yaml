          *   *Verdict:* This describes "Act-Based Propositions" (Hanks, Soames). It is *not* Bradley's answer (Bradley was a monist idealist; this is usually a cognitive/psychological turn). "Costs you nothing" is definitely wrong (it costs you objectivity, mind-independence, etc.).

