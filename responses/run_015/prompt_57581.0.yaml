      We are a lifeboat, but lifeboats have capacity limits. If we exceed the Fire Marshal's occupancy limit of 30 total people, we risk immediate shutdown. If the shelter closes, zero people get saved. The 22-cot limit leaves a safety buffer for staff and emergencies while keeping us compliant.

      However, we cannot ignore the death last February. Turning people away with zero support is unacceptable given the closed county facility and new bus route. Vouchers provide a critical safety net without risking the building's status. We will not advertise vouchers to minimize "motel incentive" abuse, issuing them only to those turned away at the door.

