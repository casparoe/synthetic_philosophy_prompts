prompt: |-
  hey so me and my friends were arguing last night about Mark who applied to our community garden co-op. Last summer he spent every weekend helping strangers rebuild fences after that storm, brought meals to people he barely knew, really went out of his way. But my sister saw him snap at a cashier for basically nothing and she says he never checks in on his mom who lives alone two blocks away.

  She read somewhere that people dont actually have a "good heart" or whatever, it's just the situation pulling different behavior out of you. Like being around strangers makes you generous but being tired makes you mean. I think thats wrong cause if Mark was really kind he should be kind everywhere, right? But now I'm second guessing cause he does act like totally different people depending on where you catch him.

  We're voting Sunday on whether to let him in. I dont know if I should say he's genuinely good or if thats even a real thing. How do you decide if someone has real moral qualities when they seem to change based on the room they're in?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** A community garden co-op is voting on whether to accept a new member, Mark.
      *   **The Conflict:** The user and friends are arguing about Mark's character.
      *   **Evidence For Mark:** Spent weekends helping strangers rebuild fences after a storm, brought meals to people he barely knew (public/extraordinary effort).
      *   **Evidence Against Mark:** Snapped at a cashier (minor stress/anonymous interaction), doesn't check on his mom who lives nearby (private/ongoing obligation).
      *   **The Sister's Argument:** Situationism (psychology/philosophy concept). Behavior is driven by context, not inherent "goodness."
      *   **The User's Argument:** Trait Theory (intuitive view). If someone is *really* kind, they should be kind everywhere consistently.
      *   **The Core Question:** How do you decide if someone has "real moral qualities" when their behavior varies by context? Should they vote for him?

  2.  **Deconstruct the Philosophical/Psychological Concepts:**
      *   **Trait Theory (User's view):** People have stable personality traits (e.g., "kindness"). If Mark is kind, it should show up consistently.
      *   **Situationism (Sister's view):** Behavior is largely determined by external factors (stress, fatigue, social pressure, anonymity). The "Fundamental Attribution Error" is relevant here (we blame character for others' mistakes but blame situation for our own).
      *   **The Truth:** It's almost certainly *both*. Psychology suggests behavior is an interaction between person and situation ($B = f(P, S)$).

  3.  **Evaluate Mark's Specific Behaviors:**
      *   *Helping after storm/meals:* High effort, public/semi-public, episodic (once off or short term), high social reward (hero narrative).
      *   *Snapping at cashier:* Low stakes, high stress potential (tired, rushed), anonymous/low consequence interaction.
      *   *Neglecting mom:* Private, ongoing, low social reward, high emotional demand, potential complex family history (unknown variable).

  4.  **Formulate a Balanced Perspective:**
      *   Acknowledge the validity of *both* sides. The sister isn't wrong about situations, but the user isn't wrong about looking for patterns.
      *   Challenge the binary of "Good Heart" vs. "Situation." It's not all or nothing.
      *   Reframe the question: Instead of "Is he a good person?", ask "Is he a good *fit* for the garden?" and "What kind of behavior matters most in this context?"

  5.  **Drafting the Response (Iterative Process):**

      *   *Empathy/Validation:* Start by acknowledging this is a tough, classic philosophical debate. It's smart that they're thinking this deeply.
      *   *Address the "Good Heart" Concept:* Explain that psychologists agree with the sister to an extent (Fundamental Attribution Error). Consistency is rare.
      *   *Analyze Mark's Specifics:*
          *   The storm help is *active* virtue. That takes effort.
          *   The cashier incident is *reactive* stress. Everyone snaps sometimes.
          *   The mom situation is the red flag. Why? Because it's an ongoing relationship. But we don't know the full story (maybe she pushes him away? Maybe they have a bad history?).
      *   *The Co-op Context:* What does the garden need?
          *   Does it need someone to lead storm relief? Or someone to show up weekly and not fight over compost?
          *   Community gardens require *sustained* cooperation, not just heroic bursts.
      *   *Decision Framework:* How to vote?
          *   Don't judge the "soul," judge the *risk* and *contribution*.
          *   Look for patterns, not perfection.
          *   Consider the "Mom" factor more heavily than the cashier, but less than the storm help.
      *   *Conclusion:* It's okay to vote based on community needs rather than metaphysical goodness.

  6.  **Refining the Tone:**
