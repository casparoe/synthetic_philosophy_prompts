answer: |-
  This is one of the oldest debates in ethics and psychology, and you've stumbled right into it without even realizing it. You're arguing about **Character Traits** (your view) versus **Situationism** (your sister's view).

  The good news is that you don't need to solve the mystery of human nature to decide how to vote on Sunday. Here is a breakdown of what's actually happening with Mark, and how you can make a decision that protects your community without needing to be a mind reader.

  ### 1. The Science: Your Sister is Half-Right
  Psychologically, your sister is echoing a concept called **Situationism**. Studies (like the famous Stanford Prison Experiment or the Milgram Experiment) suggest that context often overrides personality. A kind person can be cruel when stressed, tired, or anonymous. A "mean" person can be generous when social pressure rewards it.

  However, you are also right. Psychologists also acknowledge **Trait Theory**. People do have baseline tendencies. If Mark *never* helped anyone, the storm wouldn't have changed that. The storm didn't *make* him help; it gave him an opportunity to show a capacity for effort.

  **The Verdict:** It isn't "Good Heart" OR "Situation." It is both. Mark likely has a capacity for generosity, but perhaps a low tolerance for stress or intimacy.

  ### 2. Analyzing Mark's Specific Behaviors
  To vote wisely, look at the *type* of goodness Mark displays.

  *   **The Storm/Fences (Public, Episodic, High Adrenaline):** This is "heroic" kindness. It feels good to do. It has a clear end point. It often comes with social praise. This shows Mark is capable of high effort and empathy for strangers.
  *   **The Cashier (Private, Low Stakes, High Stress):** This is "reactive" behavior. Snapping at a cashier usually happens when someone's emotional battery is empty. It suggests Mark might struggle with emotional regulation when things aren't going his way.
  *   **The Mom (Private, Sustained, High Emotional Demand):** This is the most concerning data point. Checking on a parent is boring, repetitive, and emotionally complex. It offers no social glory. If he truly neglects her without cause, it suggests he struggles with **sustained obligation** versus **exciting projects.**

  ### 3. Reframing the Question for the Co-op
  You are asking: *"Is Mark a genuinely good person?"*
  That is a metaphysical question. You cannot answer it.

  Instead, ask: *"Is Mark a good fit for a Community Garden Co-op?"*

  Community gardens don't need heroes who rebuild fences after storms. They need neighbors who can:
  *   Show up consistently (like checking on mom).
  *   Handle minor frustrations without snapping (like the cashier).
  *   Cooperate on boring tasks (weeding, composting) without needing praise.

  **The Risk:** Mark sounds like he might be great at the "launch" of a project (building the fences) but difficult during the "maintenance" phase (weekly co-op duties). If the garden hits a stressful patch (drought, pest infestation, budget issues), will Mark snap at his fellow gardeners like he did the cashier?

  ### 4. How to Decide on Sunday
  You don't have to declare Mark "Saint" or "Sinner." You can vote based on **risk management.**

  **Argument for Voting YES:**
  *   His capacity for physical help is proven. Gardens need labor.
  *   Everyone snaps at cashiers sometimes; if that's the worst you have, he's probably fine.
  *   You don't know the story with his mom. (Maybe she is abusive? Maybe she refuses help? That's private info).
  *   Community can be rehabilitative. Being part of a gentle co-op might help him regulate his stress better.

  **Argument for Voting NO:**
  *   Co-ops run on low-conflict consistency. If he treats low-stakes interactions (cashiers) with hostility, he may bring drama to the group.
  *   If he neglects close family obligations, he may neglect his assigned garden duties when they become boring or difficult.
  *   "Heroic" kindness can sometimes mask an ego need for praise, which can clash with the humble nature of gardening.

  ### The Middle Path
  If I were in your position, I would separate **Moral Worth** from **Community Fit.**

  You can acknowledge that Mark did genuinely good things last summer without deciding he is a "Good Person" in every context. He showed he *can* be generous. But your sister is right to warn you that behavior changes.

  **My suggestion:**
  If your co-op has a trial period, vote **Yes with conditions.** Let him in for a season. If he snaps at members or neglects his plot, you have data. If he steps up like he did with the fences, you have a great member.

  If you must vote Yes/No forever:
  Lean toward **No** if your group is small and conflict-averse (the cashier incident is a red flag for group dynamics).
  Lean toward **Yes** if your group is large and needs active labor (the fence incident is a green flag for contribution).

  **Bottom line:** Don't try to judge his soul. Judge his likely behavior in *your* specific environment. A person can be a good storm-responder and a bad co-op member at the same time.
