      *   *Correction:* Make sure not to dismiss the sister's point. She's actually citing a well-known psychological phenomenon (Mischel's situationism). Validate that.
      *   *Key Insight:* The definition of "good" changes based on the setting. A "good storm helper" isn't always a "good son." Which one is a "good co-op member"?

  8.  **Final Output Structure:**
