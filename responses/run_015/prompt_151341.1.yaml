answer: |-
  This is a great set of questions. You're hitting on the exact friction points that make these arguments go in circles. You aren't talking past each other because you're stupid; you're talking past each other because you're using different maps of the same territory.

  Here is the lay of the land, broken down into the three stories you identified, the difference between statues and streets, and what the "expiry date" test actually reveals.

  ### Part 1: The Three Stories of Honor

  You listed three ways an object can be said to "honor" someone. All three exist, but they do different work. Here is where each one holds water and where it leaks.

  **1. The "Time Capsule" Story (Original Intent)**
  *   **The Idea:** The statue honors the guy because the people in 1911 meant it to. It is a fossilized salute.
  *   **Where it works:** It explains *why the object exists*. It treats the statue like a historical document. If you take this view, removing the statue is like burning a book.
  *   **Where it breaks:** It assumes honor is a one-time transaction. If I give you a trophy today, but tomorrow you become a traitor, do I still honor you by letting you keep the trophy? Most people say no. If honor requires respect, and the community no longer respects the subject, the "Time Capsule" story turns the statue into a museum piece about the *builders*, not the *subject*.
  *   **The Gut Check:** If this story were the only one that mattered, we could never take anything down. History would be a one-way ratchet.

  **2. The "Active Maintenance" Story (Current Endorsement)**
  *   **The Idea:** The statue honors the guy because we choose to keep paying for him. Every tax dollar spent cleaning the bronze is a fresh vote of confidence.
  *   **Where it works:** It captures the idea that public space belongs to the *living*. If we stop honoring him, we should stop paying for him.
  *   **Where it breaks (The Street Crew Problem):** This is your specific sticking point. Why doesn't the crew repaving the street count as honoring the statue?
      *   **The Distinction:** It comes down to *function vs. symbol*. The street crew is maintaining the *utility* (a drivable road). The city council voting against removal is maintaining the *symbol* (the tribute).
      *   **Why it's not absurd:** If the city specifically allocates money to *restore* the statue (sandblasting the green off the bronze), that is honor. If they just mow the grass around it because they mow all public grass, that is maintenance. Honor requires *specific* attention to the symbol, not just general upkeep of the land it sits on.
  *   **The Gut Check:** This story explains why leaving it up feels like an endorsement. If you wouldn't pay to put it up today, why pay to keep it up?

  **3. The "Public Message" Story (Current Perception)**
  *   **The Idea:** It honors him because a reasonable person walking by thinks, "The city likes this guy."
  *   **Where it works:** It focuses on the effect, not the cause. It doesn't matter why it's there; it matters what it *does* to the people seeing it.
  *   **Where it breaks (The Blank Plaque Problem):** You asked: if the plaque is gone and teens use it as a landmark, is it still honor?
      *   **The Answer:** No. If no one knows who it is, it's not honoring anyone. It's just decor. Honor requires *recognition*.
      *   **The Trap:** This is where the "It's just history now" argument tries to hide. They want to claim the statue is just a marker (Story 3, but neutral), while opponents see it as a salute (Story 3, but positive). If the community generally agrees the guy was a monster, the statue sends a confusing or painful message, even if the plaque is blank. The context supplies the meaning.
  *   **The Gut Check:** If a statue makes a group of citizens feel like second-class members of the community, the "message" is negative, regardless of the original intent.

  ### Part 2: Statues vs. Street Names (It's Not Just Vibes)

  You are right to feel these are different. It is not just vibes; there are structural asymmetries.

  **1. The Zero-Sum Problem**
  *   **Statues:** You can put a statue in Park A, Park B, and the Library lawn. Adding one doesn't stop you from adding another. It is additive.
  *   **Streets:** There are only so many main arteries. Naming a street "Washington Ave" means it is *not* "King Ave." It is exclusive.
  *   **Why it matters:** Naming a street is a ranking. It says, "This person is among the top tier of people worthy of this limited resource." A statue is a mention; a street name is a induction into a Hall of Fame. Removing a statue is taking a book off a shelf; renaming a street is kicking a member out of the club to make room for someone else.

  **2. The Usage Problem**
  *   **Statues:** Passive. You look at them if you walk by. You can ignore them.
  *   **Streets:** Active. You *speak* the name. You put it on your license, your taxes, your Amazon orders.
  *   **Why it matters:** When you live on a street, you are forced to verbally align yourself with that name every day. It becomes part of your identity. "I live on Forrest Street" creates a psychological link between the resident and the namesake that "I walked past the Forrest Statue" does not. This makes street names more intimate and more intrusive.

  **3. The Inertia Problem (Cost)**
  *   You asked: *Does the cost of renaming mean the city isn't endorsing him, just being cheap?*
  *   **The Distinction:** Inertia is not endorsement, but *defending* inertia is.
  *   **How to tell:** If the city says, "We'd love to change it, but we can't afford the $2 million right now," that is inertia. If the city says, "We won't change it because it erases history," that is endorsement.
  *   **The Test:** If a private donor offered to pay the full cost of changing the signs and updating the GPS data, and the city *still* refused, then inertia is off the table. At that point, keeping the name is a active choice to honor the namesake.

  ### Part 3: The Expiry Date Test

  This is your strongest intuition. Suppose every monument had a 50-year lease. To keep it, the city has to vote to renew it. What does this tell us?

  **1. It Proves Story #2 (Active Maintenance) is the Real One**
  If we had to re-vote, it would clarify that honor is a *relationship*, not a *property*. A statue isn't inherently honorable; it is honorable only as long as the living community agrees to treat it that way.
  *   **Without Expiry:** Honor is assumed. It runs on autopilot. This allows dead values to haunt the present.
  *   **With Expiry:** Honor is conscious. It requires the current generation to say, "Yes, we still want this."

  **2. Would it become bureaucratic?**
  Yes. But that's actually a feature, not a bug.
  *   **The Bureaucracy:** It forces the community to have the conversation explicitly. Instead of fighting every time a statue is vandalized, you have a scheduled debate.
  *   **The Genuineness:** It makes the honor *real*. Right now, the honor is "ghostly"—it relies on the silence of the majority. With a re-vote, the honor is "loud"—it relies on the voice of the majority.
  *   **The Verdict:** If a statue couldn't survive a re-vote, it means the honor was already dead; the bronze was just a corpse. If it *did* survive a re-vote, the honor would be stronger than it is now, because it would be backed by current consent rather than past habit.

  ### Summary: Honor vs. Commemoration vs. Marking

  To settle the argument with your brother-in-law, try using these definitions. You are likely arguing because one of you is talking about "Marking" and the other is talking about "Honoring."

  1.  **Marking:** "This spot is a reference point." (e.g., "Meet me at the horse.")
      *   *Requirement:* Physical presence.
      *   *Does it need respect?* No.
  2.  **Commemorating:** "This person/event happened and was significant."
      *   *Requirement:* Historical accuracy.
      *   *Does it need respect?* No. You can commemorate a villain in a museum to say "Look what happened."
  3.  **Honoring:** "This person is worthy of emulation and respect."
      *   *Requirement:* **Current Community Consent.**
      *   *Does it need respect?* Yes. This is the key. You cannot honor someone the community despises without lying.

  **The Bottom Line:**
  A statue or street name starts as **Honor**. Over time, if the community changes its mind, it degrades into **Commemoration** (a historical note). If the meaning is lost entirely, it becomes a **Marker** (a landmark).

  The fight you are having is about *where* these objects currently sit on that spectrum.
  *   You likely see them as **Honor** (which requires current respect).
  *   He likely sees them as **Commemoration** (which only requires historical existence).

  **The Asymmetry Confirmation:**
  Street names are harder to downgrade from "Honor" to "Commemoration" because they are zero-sum and used daily. A statue can be moved to a park (becoming a museum piece/commemoration) relatively easily. A street name usually has to be erased to be changed, which feels like destroying history rather than archiving it. That is why the street name fight is always hotter: the "Zero-Sum" nature makes it feel like a demotion, whereas moving a statue feels like re-cataloging.

  **Final advice:** Ask him this: "If honor doesn't require the current community to respect the person, what is the difference between a statue and a warning label?" If the answer is "nothing," then you agree. If the answer is "a statue is positive," then he has to admit that positive regard requires current consent.
