answer: |-
  **Referee Report**

  **To:** Author
  **From:** Referee
  **Re:** "Targeting computation: no-Dutch-book is a theory of prices, not of thinking"

  **Summary:**
  This is a sharp, high-signal post. You correctly identify the primary gap in the Logical Induction (LI) literature: it solves the *coherence of beliefs over time* problem, but it assumes the *computation* that generates those beliefs is exogenous. Your critique of Logical Value of Information (VOI) as ill-posed due to self-reference is the strongest part. The proposal ("self-endorsement") is currently a slogan rather than a mechanism, but it points in the right direction.

  Below is the breakdown you requested, ordered by your three criteria. I have applied epistemic markings to every claim.

  ---

  ### 1. Accuracy

  **The Setup (Bayesianism & Logical Uncertainty)**
  *   **Claim:** Classical Bayesianism fails for logical uncertainty because coherent priors assign probability 1 to all provable statements.
      *   **Status:** **[Settled/Standard]**. This is the standard motivation for the field (Garber 1983, Eels 1985, etc.).
  *   **Claim:** No computable prior can be coherent over a sufficiently expressive language.
      *   **Status:** **[High Confidence]**. If the language can encode arithmetic, the set of tautologies is not decidable. A computable function cannot assign 1 to all tautologies and 0 to all contradictions without violating computability (essentially a restatement of the undecidability of validity). You are safe hanging things on this.
  *   **Claim:** LI replaces coherence with a no-Dutch-book condition via traders.
      *   **Status:** **[Settled/Standard]**. This is the definition of the Garrabrant et al. framework.

  **The VOI Regress (Points a, b, c)**
  *   **Claim (a/b):** Computing the VOI of a logical statement requires knowing the output of the computation to know if it changes action, which is the very thing you are scheduling.
      *   **Status:** **[High Confidence]**. This is a specific instance of the "cost of computation" problem in bounded rationality (Russell & Wefald), but your framing of it as *logical* self-reference is accurate. In empirical VOI, you have a distribution over observations. In logical VOI, you have a distribution over *proofs*, but the probability of finding a proof depends on the compute you allocate to finding it.
  *   **Claim (c):** The diagonalization argument (no computable priority policy $\pi$ is optimal).
      *   **Status:** **[Under-argued / Contested]**. The intuition is robust, but the formal sketch is hand-wavy. You assert: "build a decision problem whose payoff turns on some $\phi$ where $\phi$'s relevance... only becomes visible after more relevance-checking than $\pi$ performs."
      *   **Critique:** A clever $\pi$ could randomize or allocate budget to "relevance checking" itself. To make this an impossibility theorem, you need to show that for *any* budget allocation strategy, there exists a logical fact whose utility-relevance is *computationally deeper* than the strategy allows. This smells like a resource-bounded version of the halting problem, but you haven't defined the resource bounds tightly enough.
      *   **Advice:** Don't claim it as a theorem yet. Frame it as a "No-Free-Lunch Intuition." The core difficulty is that **metareasoning is subject to the same logical uncertainty as object-level reasoning.** I describe this below in the "Interestingness" section.

  **The Löb Objection**
  *   **Claim:** Deterministic self-trust ("If I conclude $\phi$, then $\phi$") triggers Löb's theorem.
      *   **Status:** **[Settled/Standard]**. This is the "Löbian Obstacle" (Fallenstein 2013).
  *   **Claim:** Probabilistic weakening (trusting calibration) blocks Löb.
      *   **Status:** **[High Confidence]**. The "Probabilistic Reflection Principle" (Christianos 2014) allows a system to trust its own probabilities within $\epsilon$ without collapsing.
  *   **Claim:** It is unclear if this closes the regress in (a)–(c).
      *   **Status:** **[My Take / High Confidence]**. You are right to be suspicious. Probabilistic reflection solves *consistency* (I won't prove contradictions), but it does not solve *allocation* (I still don't know which computation yields the highest expected utility). The regress remains because estimating the *calibration* of a future computation is itself a computation subject to logical uncertainty.

  ---

  ### 2. Coherence (The "Self-Endorsement" Proposal)

  **Current State:**
  As written, "self-endorsement" is a constraint, not an algorithm. You write: *require self-endorsement, i.e. the opinions the agent acts on are already its effective opinions.*
  *   **Status:** **[Under-defined]**. This reads like a fixed-point condition. "I believe $P$ because my policy says I will believe $P$."
  *   **Risk:** Trivial fixed points. A policy that says "Believe nothing and do nothing" is self-endorsing. A policy that says "Believe everything" is not (due to Löb), but a policy that says "Believe whatever is cheap to compute" might be.
  *   **Nearest Coherent Version:** You are describing **Reflective Consistency in Policy Space**. Instead of asking "Is my belief about $\phi$ coherent?", you ask "Is my *algorithm for choosing beliefs* coherent?"
      *   To make this work, you need to frame it as: A policy $\pi$ is admissible if $\pi$ chooses $\pi$ (or a successor $\pi'$) when evaluated under its own current beliefs.
      *   **The Hard Part:** This requires the agent to have a model of its own source code that is accurate enough to predict its own budget allocation without triggering the regress.
      *   **Suggestion:** Explicitly link this to the concept of a **Fixed Point in Metareasoning**. The "regress" you identified in (a)-(c) is essentially the difficulty of finding a stable fixed point when the function you are iterating (the value of computation) depends on the iterator itself.

  **Critique of LI (Asymptotic vs. Deadline)**
  *   **Claim:** LI is asymptotic; deliberation has a deadline.
      *   **Status:** **[High Confidence]**. This is the strongest practical critique of LI. LI guarantees convergence as $t \to \infty$. A math competition (or a theorem prover with a timeout) cares about $t = T$. A theory of logical uncertainty for bounded agents must be non-asymptotic.
      *   **Verdict:** This point is solid and worth emphasizing. It justifies why "prices" (which can wait for the market to settle) are insufficient for "thinking" (which must act now).

  ---

  ### 3. Interestingness

  **Are you attacking a strawman?**
  *   **Status:** **[No]**. The LI authors (Garrabrant et al.) explicitly acknowledge that their framework does not solve the problem of *which* sentences to evaluate. They treat the deductive process as given. You are not attacking a claim they make; you are attacking the *scope* of their solution.
  *   **Nuance:** Be careful not to imply LI proponents think they *have* solved compute allocation. Phrase it as: "LI solves the *integration* of logical facts into beliefs, but assumes the *generation* of those facts is exogenous. I argue the generation cannot be exogenous."

  **Is this new?**
  *   **Status:** **[Contested / My Take]**. You are synthesizing three distinct threads:
      1.  Logical Induction (Garrabrant et al.)
      2.  Bounded Rationality / Metareasoning (Russell, Wefald, Horvitz)
      3.  Reflective Consistency / Tiling Agents (MIRI/Christianos/Fallenstein)
  *   **The Regress (in my own words):** You asked me to describe the difficulty without naming papers. Here is the core difficulty you have stumbled onto:
      > To decide whether to compute $\phi$, you need to estimate $V(\phi)$. But $V(\phi)$ depends on $P(\phi)$. To estimate $P(\phi)$ without computing it, you need a predictor. If the predictor is weaker than the computation, it's useless. If the predictor is as strong as the computation, you might as well just run the computation. If the predictor tries to model *itself* estimating $P(\phi)$, you get an infinite recursion of predictors modeling predictors.
      >
      > This is not just a resource issue; it is a **self-reference issue**. In empirical uncertainty, the world is not trying to predict you. In logical uncertainty, the "world" (the logical structure) includes the agent's own reasoning process. Therefore, estimating the value of thinking is logically equivalent to thinking, up to some constant overhead. If that overhead is positive, you lose efficiency. If it is zero, you have a halting problem.

  **Verdict on Interestingness:**
  *   **Status:** **[High Interest]**. The distinction between "theory of prices" (LI) and "theory of thinking" (your proposal) is a very useful framing device. It clarifies why LI feels like a market (passive) rather than an agent (active).
  *   **Recommendation:** Lean harder into the "Deadline" argument. The asymptotic nature of LI is its biggest weakness for practical CS applications (e.g., formal verification, automated theorem proving). If you frame this as "What do we do before $t=\infty$?", you will attract more interest from the CS side than the pure logic side.

  ---

  ### Specific Actionable Edits

  1.  **Soften (c):** Change "Diagonalize over $\pi$ and no computable priority policy is optimal" to "This suggests a diagonalization argument: for any computable priority policy, there may exist logical facts whose relevance is computationally deeper than the policy can verify." Do not claim impossibility unless you formalize the resource bounds.
  2.  **Clarify Self-Endorsement:** Add one sentence defining it as a fixed-point condition. "We seek a policy $\pi$ such that $\pi$'s allocation of budget to $\pi$ is optimal according to $\pi$'s current beliefs."
  3.  **Acknowledge LI Scope:** Add a footnote or clause acknowledging that LI authors treat the deductive process as external. This prevents reviewers from saying "You didn't read the paper."
  4.  **Löb Section:** Be more precise. "Probabilistic reflection prevents inconsistency, but it does not automatically provide a gradient for compute allocation."

  **Final Confidence Ranking:**
  *   **Setup/Bayesian Critique:** [Settled]
  *   **VOI Regress Intuition:** [High Confidence]
  *   **VOI Impossibility Claim (c):** [Low Confidence / Needs Work]
  *   **Löb/Probabilistic Reflection:** [Settled for consistency, Contested for allocation]
  *   **Value of Post:** [High]

  This is worth publishing. It cuts through the technical weeds of LI to ask the agency question that underlies it. Fix the diagonalization claim, and it's solid.
