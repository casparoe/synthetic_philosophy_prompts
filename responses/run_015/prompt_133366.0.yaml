      *   *Agent:* Let's call her Sarah.
      *   *Action:* Returning a lost wallet or correcting a billing error. Let's go with correcting a billing error that favors her department.
      *   *Actual Motive:* Fear of embarrassment/audit. She doesn't want to look incompetent if the error is found later.
      *   *Moral Motive (Counterfactual):* Honesty/Fairness.
      *   *Robustness:* If she *didn't* care about embarrassment, she would still correct it because it's the right thing to do. She has a stable character trait of honesty, but today the immediate trigger was fear.
      *   *Drafting the paragraph:* Sarah, a project manager, discovers a spreadsheet error that accidentally overcharges a client by $5,000, benefiting her team's quarterly bonus. She immediately emails finance to correct it. Causally, her action is driven entirely by a sharp spike of anxiety: she realizes the audit trail will inevitably flag the discrepancy next week, exposing her oversight and causing professional humiliation. However, Sarah possesses a deeply ingrained, stable disposition toward honesty; had she known the error was undetectable and carried no risk of embarrassment, she still would have corrected it solely because keeping the money would be dishonest. The client is refunded, trust is maintained, and the correct action is performed.

  3.  **Analyzing the Verdicts:**
      *   *Pure-Motive Kantianism (PMK):* Focuses on the *actual* maxim/motive. Did duty determine the will? No, self-interest (avoiding shame) did. Verdict: No moral worth (legal, but not moral).
      *   *Counterfactual-Stability Account (CSA):* Focuses on the *reasons-responsiveness*. Is the action sensitive to the moral reason? Yes, because in the nearest possible world where the non-moral motive is removed, the moral motive sustains the action. Verdict: Full moral worth.

  4.  **Identifying the Structural Feature:**
      *   What makes them disagree? It's the *criterion for moral worth*. PMK looks at *actual etiology* (what actually moved the will). CSA looks at *dispositional profile* (what would move the will across nearby worlds).
      *   Single Feature: The *actual causal history* vs. *modal robustness of the disposition*.

  5.  **Removing Counterfactual Stability:**
      *   If Sarah *would not* have corrected the error if there were no risk of embarrassment (i.e., she is only honest when watched), then CSA aligns with PMK. Both deny moral worth. The divergence collapses.

