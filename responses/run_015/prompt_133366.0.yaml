      *   **Mechanism:** Motivational overdetermination with counterfactual robustness (actual chain = non-moral; counterfactual chain = moral).
      *   **Constraints:** No sci-fi, demons, perfect predictors, exotic physics. Realistic setting.
      *   **Post-Scenario Analysis:**
          *   Show exact verdicts and why.
