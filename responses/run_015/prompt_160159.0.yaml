  I'm taking a graduate seminar in formal epistemology, and we have just started talking about the Judy Benjamin problem as a way into questions about how to update on conditional information; after class I was discussing it with a couple of friends at a coffee shop, and one of them, who has read more of the secondary literature than I have, sent me his summary of the problem and of the 'distance-minimization' reply. I am inclined to trust it, because the basic setup matches the handout we were given, but I do not know enough to see where it might be shading things. He wrote: 'Judy Benjamin is dropped into a region divided into Red and Blue territory and, independently, into Second Company and Headquarters sectors, with no reason to favor any of the four combinations, so each combination starts out at one quarter. She then hears a radio message that fixes a conditional probability rather than telling her any proposition outright: roughly, if she is in Red territory, then her chance of being in Second Company is three quarters. Because this is not learning some statement with certainty, ordinary Bayesian conditioning on a proposition is inapplicable; and Jeffrey’s rule is no help either, since Jeffrey requires a new unconditional probability for a partition, not a constraint on a conditional probability. So the only way to model Judy’s update is to choose the new probability distribution that stays as close as possible to her old one while satisfying the constraint—that is, to minimize some distance or divergence, such as cross-entropy, between the old and new distributions. If you do the minimization, the result is unique and intuitive: her credence that she is in Red stays at one half. The moral is that Bayes and Jeffrey are not fully general, and distance-minimization is the correct account of rational updating, since it gives the intuitively right answer here and reduces to the other rules in the special cases they cover.'

