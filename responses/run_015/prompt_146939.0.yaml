answer: |-
  # Workshop Plan: The Consensus Engine
  **Topic:** Aumann's Agreement Theorem  
  **Time:** 90 Minutes  
  **Participants:** 10 Grad Students  
  **Goal:** Experiential understanding of how common priors and common knowledge force convergence, and where the mechanism breaks.

  ## 1. Materials & Setup
  *   **The State:** A hidden integer $T$ between 0 and 100 (generated by you beforehand, e.g., 67).
  *   **Signals:** 10 Envelopes. Each contains $s_i = T + \epsilon_i$, where $\epsilon_i$ is drawn from a known public distribution (e.g., Uniform[-15, 15]). Students know the noise distribution (Common Prior).
  *   **Betting Sheets:** Each student gets 3 sheets (one per round). They have 100 "Confidence Chips" to distribute across ten bins (0-9, 10-19... 90-100).
  *   **Currency:** "Epistemic Points" (EP). Start each student with 1,000 EP.
  *   **Display:** Projector or whiteboard to show aggregate histograms of chip distribution after each round.
  *   **Prizes:** A ridiculous trophy (e.g., "The Golden Prior" spray-painted mug) for the highest final EP score.

  ## 2. Mechanics & Rules (Handout Only, No Lecture)
  1.  **Objective:** Maximize EP. Accuracy is rewarded; ignorance is costly.
  2.  **Signal:** Open your envelope. Do not show anyone. This is your private evidence.
  3.  **Calibration Market:** Before betting in Rounds 2 and 3, you may purchase the **Group Mean** (the average of all private signals). 
      *   Cost: 200 EP.
      *   Benefit: Reduces your personal noise variance for that round.
  4.  **Betting:** Distribute 100 Chips across the 10 bins. Your score for the round is calculated as: 
      $$ \text{Reward} = 500 - (\text{True Value} - \text{Your Weighted Mean})^2 $$
      *   *Weighted Mean:* The center of the bin where you placed the most chips.
      *   *Penalty:* Subtract calibration costs from final total.
  5.  **Information Flow:** After betting, the **Aggregate Histogram** (total chips per bin for the whole group) is displayed. You do not see individual bets.

  ## 3. Run of Play (90 Minutes)

  ### Phase 1: The Private Veil (0–25 mins)
  *   **Setup (5m):** Distribute envelopes and sheets. Explain rules strictly via handout. Answer clarification questions only.
  *   **Round 1 (20m):** 
      *   Students open envelopes (Private Signals).
      *   Students place bets based *only* on private signals.
      *   Collect sheets. Calculate aggregate histogram.
      *   **Display:** Show the histogram. It will be wide and dispersed.
      *   **Payoff:** Calculate Round 1 scores silently (keep secret for now).

  ### Phase 2: The Squeeze (25–50 mins)
  *   **Round 2 (25m):** 
      *   Offer Calibration (Buy Group Mean for 200 EP). Most will buy it because seeing the average signal is highly valuable evidence.
      *   Students update beliefs. Since everyone sees the same Group Mean and knows everyone else is rational (and likely bought the mean), bets should cluster tightly around the True Value.
      *   Collect sheets. Display Histogram. It will be narrow (convergence).
      *   **Payoff:** Calculate scores.

  ### Phase 3: The Crack (50–70 mins)
  *   **Secret Twist:** Hand Player 5 a modified rule card: *"Your Calibration Cost is 900 EP."* (Effectively prohibitive). Everyone else pays 200 EP.
  *   **Round 3 (20m):** 
      *   Offer Calibration. Player 5 declines (too expensive). Others buy.
      *   Others update toward the Group Mean. Player 5 stays on their private signal (which is noisy).
      *   Player 5's bet will likely outlier significantly compared to the cluster.
      *   **Display:** Show Histogram. The cluster remains tight, but there is a visible "tail" or secondary bump from Player 5.
      *   **Observation:** The group sees disagreement persist despite seeing the aggregate.

  ### Phase 4: Debrief & Theory Mapping (70–90 mins)
  *   **Reveal Truth:** Announce $T$. Award "The Golden Prior."
  *   **Reveal Twist:** Ask Player 5 to reveal their calibration cost.
  *   **Discussion Guide:**

  | Round | Experience | Aumann Condition Met? | Formal Mapping |
  | :--- | :--- | :--- | :--- |
  | **1** | High Disagreement | **No.** | Private posteriors are not common knowledge. |
  | **2** | Rapid Convergence | **Yes.** | Aggregate histogram approximates common knowledge of posteriors. Common priors (noise dist) assumed. |
  | **3** | Persistent Disagreement | **Broken.** | **Common Knowledge of Rationality** fails. Others see Player 5 disagree with the consensus evidence. They infer Player 5 is either irrational or has different priors, because they don't know Player 5 was price-constrained. |

  *   **Honest Limitation (Infinite Hierarchy):** 
      *   Tell the students: "Aumann requires infinite recursion: I know that you know that I know... In this game, the histogram gives us level 2 or 3 knowledge. We see the group belief, but we don't strictly know that *everyone* saw that *everyone* saw it. Real agreement requires an infinite chain of mutual assurance this game truncates."
  *   **Predictable Failure (First Run):** 
      *   **Non-Bayesian Updating:** Students often ignore the Group Mean in Round 2, trusting their private signal too much (conservatism bias). This slows convergence, making the Round 3 break less sharp.
      *   **Player 5 Leakage:** Player 5 might hint at their high cost during the game. Instruct them strictly: "Play optimally for your budget; do not reveal constraints."

  ## 4. Payoff Scheme Summary
  *   **Endowment:** 1,000 EP.
  *   **Calibration:** -200 EP (Round 2/3 normal), -900 EP (Round 3 Player 5).
  *   **Accuracy:** 500 - (Distance²). Max possible per round ~500.
  *   **Winning:** Highest total EP after 3 rounds.
  *   **Prize:** "The Golden Prior" (Mug) + First choice of seminar snack next week.

  ## 5. Instructor Notes for the "Crack"
  The theoretical break in Round 3 is not just that Player 5 disagreed, but that the **common knowledge of rationality** dissolved. In Round 2, if you disagreed with the mean, you knew you were likely wrong because you assumed everyone else was rational and had seen the mean. In Round 3, when others see Player 5 disagreeing with the mean, they cannot assume Player 5 is rational *given the same constraints*. They suspect Player 5 has a different model of the world. Aumann's theorem holds only if we know everyone is playing the same epistemic game. By hiding Player 5's constraint, you simulated a hidden difference in "rationality conditions," causing the agreement mechanism to jam.

  The core design principle is to substitute mathematical common knowledge with visible behavioral convergence, then break the convergence by hiding a constraint on rationality.
