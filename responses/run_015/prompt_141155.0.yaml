  2.  **Deconstruct the "Implicated-Norm Account" (INA):**
      *   *Key Feature 1:* Specificity. Not global standing, but norm-specific. (Adulterer can blame tax evasion).
      *   *Key Feature 2:* Implication. Must violate *that* norm, not just be flawed.
      *   *Key Feature 3:* Conditionality. Unacknowledged/unrepented. Repentance restores standing.
      *   *Key Feature 4:* Effect. Defeats authority to demand, not truth of claim. (Hypocrite can be right, just lacks standing).
      *   *Key Feature 5:* Motivation. Avoids quietism (unlike some global forfeiture views) but captures the intuition that hypocrisy undermines blame.

  3.  **Evaluate the Seven Pressure Points (Ranking & Analysis):**

      *   *1. Norm Individuation (The Grain Problem):* This is the structural engine of the view. If norms can be typed too finely (e.g., "adultery on Tuesdays" vs. "adultery"), the view becomes ad hoc. If too coarsely (e.g., "betrayal"), it collapses into global forfeiture.
          *   *Verdict:* High Risk. Potentially Fatal if not constrained.
          *   *Reasoning:* It determines the extension of the theory. Without an independent criterion, it's a just-so story generator.

      *   *2. The Inversion (Recovering Wrongdoer):* The user notes recovering wrongdoers often have *more* standing. The INA says unrepented violation forfeits; repented restores. But does it explain the *bonus* standing?
          *   *Verdict:* Awkward but manageable.
          *   *Reasoning:* The INA explains the *restoration* of baseline standing, but not necessarily the *epistemic privilege* or *moral authority* often accorded to reformed sinners. This might be a separate phenomenon (expertise vs. standing).

      *   *3. Weakness of Will (Akrasia):* Hypocrites often accept the norm but fail. INA requires conduct that "implicates the norm." Does akratic violation implicate the norm in the relevant way?
          *   *Verdict:* Manageable.
          *   *Reasoning:* Violation is violation. The *attitude* (acceptance) matters less than the *conduct* relative to the demand. If I demand you follow N while I break N, the inconsistency stands regardless of my internal struggle.

      *   *4. Asymmetric Severity (Liar vs. Murderer):* Can a liar blame a murderer? INA says yes (different norms). Intuition says yes.
          *   *Verdict:* Strength, not weakness.
          *   *Reasoning:* This is where INA shines compared to global forfeiture. It aligns with the intuition that minor sinners can blame major sinners if the sins differ.

      *   *5. Directed/Third-Party Cases:* Victim blaming their victimizer while being guilty themselves? Or third-party blame?
          *   *Verdict:* High Risk.
          *   *Reasoning:* If I defraud you, and you defraud others, do you lack standing to blame me for defrauding *you*? INA suggests if the norm is "do not defraud," you forfeit. But victimhood seems to grant a special prerogative that overrides forfeiture. This challenges the "norm-relative" claim.

      *   *6. Political Cost/Quietism:* Hypocritical blame can be useful. INA says they lack *standing* (authority), not truth.
          *   *Verdict:* Manageable (Theoretical distinction vs. Practical consequence).
          *   *Reasoning:* The view distinguishes *standing* from *correctness*. It can acknowledge the utility of the blame while denying the authority. The risk is weaponization ("tu quoque"), but that's a misuse of the theory, not a falsification.

      *   *7. Generality (Universal Implication):* If everyone violates most norms, do we all lose standing?
