answer: |-
  Does philosophy progress? It is the discipline's perennial insecurity. Physicists build upon Einstein; biologists stand on the shoulders of Watson and Crick. Philosophers still argue with Plato. To move beyond anecdote, we need a metric. Let us try the "Obsolescence Share."

  Imagine you are designing a graduate curriculum. What fraction of the required reading consists of material the field currently treats as superseded? In molecular biology, this share is near zero. A student learns CRISPR and current genomic sequencing techniques. They might hear of Pasteur in a history lecture, but they do not use Pasteur's methods to solve current problems. Old theories are discarded like shed skin. In philosophy, the share is high. Graduate students read Kant not merely to understand the history of ethics, but to do ethics. Positions once declared dead, like sense-data theory in perception, often return in new dress. If a field's Obsolescence Share remains high across generations, there is a prima facie case that it is not accumulating knowledge.

  However, as a diagnostic, this is initially too vague. To be useful, we must sharpen it. First, we must define the "field." Let us restrict this to active researchers publishing in the top tier of peer-reviewed journals. Second, we define the "window." Material is "live" if it is defended as viable in serious peer-reviewed work within the last decade. Material is "obsolete" if it is cited only for historical context or as a foil to be knocked down. Third, we define the "training." We look at core syllabi for doctoral qualifying exams. If a text is required reading because it offers a current solution rather than a historical benchmark, it counts as live.

  When we apply this sharpened metric, the contrast is stark. In molecular biology, the Obsolescence Share is negligible. A 19th-century paper on cell structure is museum piece, not method. In philosophy, the share is substantial. A student of metaphysics must engage with Aristotle's categories; a political philosopher must contend with Hobbes. But the raw number alone does not tell us if progress is absent. To understand what the metric measures, we must distinguish three kinds of progress.

  The first is **elimination**. This is the Gettier model. For centuries, knowledge was analyzed as "justified true belief." In 1963, Edmund Gettier published a three-page paper showing this definition allowed for lucky guesses to count as knowledge. The field moved. The old definition was eliminated. The Obsolescence Share detects this kind of progress perfectly. If a position is successfully eliminated, it moves from "live" to "historical," lowering the share.

  The second is **exportable machinery**. This is progress in tools rather than truths. Philosophy has built rigorous frameworks that other disciplines adopt: modal logic (the formal study of necessity and possibility), Bayesian epistemology (using probability theory to model belief), and decision theory. When philosophers refine these tools, they progress. However, the Obsolescence Share often misses this. Once a tool becomes standard, it becomes invisible infrastructure. It is no longer debated; it is used. Thus, a field can accumulate powerful machinery while its Obsolescence Share remains high because the foundational debates about *why* we use that machinery persist.

  The third is **redescription**. This is the churn of vocabulary without resolution. Consider the "hard problem" of consciousness. Dualists argue mind and body are distinct; physicalists argue they are identical. Often, new generations simply rename the dispute without solving it. The Obsolescence Share cannot distinguish between a deep, permanent question and a stagnant loop. If the share is high because the questions are eternal, that is one thing. If it is high because we are spinning wheels, that is another.

  This leads to the strongest objection against the diagnostic: that it is rigged against philosophy by assuming progress must look like science. Science deals with empirical facts that change as our instruments improve. Philosophy deals with conceptual and normative questions that do not expire. You cannot supersede the question "What is justice?" in the way you supersede the phlogiston theory of combustion. Plato is not an ancestor to be buried; he is a permanent interlocutor. The data of philosophy are our own intuitions and concepts, which remain stable across millennia.

  If this objection wins, the failure of the Obsolescence Share test teaches us something crucial. It teaches us that philosophy is not a truth-accumulating enterprise in the scientific sense. It is a clarity-accumulating enterprise. The high Obsolescence Share does not indicate stagnation; it indicates that the subject matter is invariant. We read Kant because the structure of human reasoning has not changed, not because we lack better theories.

  However, we cannot accept the objection entirely. While the questions may be permanent, the answers should not be equally perennially bad. If philosophy progresses only in clarity, we should see better arguments, fewer fallacies, and more precise distinctions over time. Here, the Obsolescence Share reveals a mixed verdict. It shows that philosophy does eliminate bad answers (Progress Type 1). We know more about what knowledge is *not* than the Greeks did. It also shows that philosophy exports tools (Progress Type 2) that become the bedrock of computer science and economics, even if philosophers keep arguing about the foundations. But it also confirms that redescription (Progress Type 3) is rampant. We often mistake new terminology for new solutions.

  So, does philosophy progress? The Obsolescence Share suggests it does not progress toward final doctrines in the way science does. We will not find the "standard model" of ethics. But it does progress in negative knowledge and tool-building. We are better at spotting bad arguments than our predecessors, and we have built logical machinery that powers the modern world. The high Obsolescence Share is not a sign of failure, but a sign that philosophy's job is maintenance and clarification of the conceptual framework we use to think about everything else, including science.

  The verdict is not that philosophy is stuck, but that its progress is invisible to a metric designed for empirical accumulation. It progresses by pruning errors and sharpening tools, not by burying its ancestors. We read Plato not because we have failed to move on, but because the ground he stood on is the same ground we stand on. The progress is in the stepping, not the destination.

  \answer{Yes — in tools and elimination, not in final doctrines}
