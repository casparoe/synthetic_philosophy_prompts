answer: |-
  # HANDOUT: MACRO-CAUSAL INTUITIONS (WEEK 1)

  **Instructions:** Below are seven anonymized historical scenarios. Read them carefully. Then, follow the Decision Tree. At each node, choose the question that best matches your intuition about the cases. Do not worry about "correct" answers; this instrument maps your starting assumptions about contingency and necessity.

  ### CASE BANK
  1.  **The Harbour Gauge:** A port authority adopts Standard X over Y on a vote swung by one member's late arrival. Cranes, training, and contracts co-adapt within a decade. Reversal becomes unthinkable for a century.
  2.  **The Delayed Envoy:** A treaty collapses because a negotiator's ship is becalmed for three weeks. War resumes. The settlement forty years later reproduces the rejected terms on territory but departs entirely on fiscal clauses.
  3.  **The Two Valleys:** Two regions with similar hydrology and no contact independently build near-identical hierarchical irrigation bureaucracies within a century of each other.
  4.  **The Pension Convergence:** Two provinces reach near-universal old-age provision by 1960. One uses tax-funded flat pensions; the other uses occupationally fragmented insurance. Coverage rates converge; replacement rates and gendered outcomes diverge for fifty years.
  5.  **The Slow Follower:** A fiscal innovation appears in one polity in 1720 and independently in another in 1790. Institutional design and supporting coalitions differ.
  6.  **The Founding Memo:** A filing scheme adopted without discussion by a mid-level official becomes the inherited grid for all later administrative statistics. One large category of hardship remains invisible for three generations, even as substantive policy changes repeatedly.
  7.  **The Rotating Chair:** Which of twelve reformers happens to chair a committee wildly changes the next five years of policy, but every variant converges on a professionalised, exam-recruited civil service.

  ---

  ### DECISION TREE

  **NODE 1: The Counterfactual Trigger**
  When you imagine history changing in these cases, what are you actually changing?
  *   **A.** You are removing a specific, small accident (e.g., the late voter, the becalmed ship, the memo) and letting the rest of history run forward from that point. *(Go to Node 2)*
  *   **B.** You are asking if the whole process would look the same if run again from the start or in a different place (e.g., the two valleys, the two provinces). *(Go to Node 5)*

  **NODE 2: The Aftermath (For "Accident" Cases)**
  If that specific accident had not happened, would later decisions have cemented the new path, or was the original path just a temporary deviation?
  *   **A.** Later investments and decisions made reversal increasingly costly or impossible (a ratchet effect). *(Go to Node 3)*
  *   **B.** The path drifted back or the deviation didn't prevent the system from eventually reaching a similar endpoint. *(Go to Node 4)*

  **NODE 3: The Object of Persistence (For "Ratchet" Cases)**
  What is it that makes the outcome hard to reverse?
  *   **A.** Physical or institutional costs: the machinery, contracts, and laws themselves make switching expensive. *(Go to Leaf 1)*
  *   **B.** Cognitive or administrative grids: the way data is collected makes alternative solutions invisible to later actors. *(Go to Leaf 2)*

  **NODE 4: The Return (For "No Ratchet" Cases)**
  If the path wasn't locked in, did the final settlement look like the original anyway?
  *   **A.** Yes, the broad terms returned, even if the route differed. *(Go to Leaf 3)*
  *   **B.** No, the outcomes remained fundamentally different from the original path. *(Go to Leaf 4)*

  **NODE 5: The Convergence (For "Replay" Cases)**
  In the independent cases (Valleys, Provinces, Reformers), did they arrive at the exact same institutional design?
  *   **A.** Yes, the structures are near-identical. *(Go to Node 6)*
  *   **B.** No, the structures look different (e.g., tax vs. insurance, different fiscal designs). *(Go to Node 7)*

  **NODE 6: The Welfare Detail (For "Identical Structure" Cases)**
  Even if the structures look identical, do the distributional outcomes (who wins, who loses, gender effects) match?
  *   **A.** Yes, outcomes match closely across the cases. *(Go to Leaf 5)*
  *   **B.** No, coverage matches but welfare, wealth, or social outcomes diverge for decades. *(Go to Leaf 6)*

  **NODE 7: The Function (For "Different Structure" Cases)**
  Do the different structures serve the same systemic function or role in the polity?
  *   **A.** Yes, they solve the same problem (e.g., professionalization, revenue) despite different forms. *(Go to Leaf 7)*
  *   **B.** No, they serve fundamentally different systemic roles. *(Go to Leaf 8)*

  ---

  ### LEAF STATIONS

  *   **Leaf 1: The Iron Track.** (Commitment: Early accidents become permanent due to increasing returns.)
  *   **Leaf 2: The Blind Grid.** (Commitment: Reality is shaped by administrative categories, not just material costs.)
  *   **Leaf 3: The Elastic Band.** (Commitment: Contingent paths can reconverge on similar terms without structural necessity.)
  *   **Leaf 4: [Unclaimed].** (Commitment: Accidents change the path temporarily but leave no trace on outcomes or structures.)
  *   **Leaf 5: The Blueprint.** (Commitment: Initial conditions dictate specific institutional forms regardless of agency.)
  *   **Leaf 6: The Masked Aggregate.** (Commitment: Macro-level similarity masks enduring micro-level divergence.)
  *   **Leaf 7: The Functional Sink.** (Commitment: Systemic needs select for function, not form; details are noise.)
  *   **Leaf 8: [Unclaimed].** (Commitment: Similar starting points yield fundamentally different systemic roles.)

  ***

  # INSTRUCTOR'S ANNOTATION KEY

  **Note to TA:** This key maps the decision tree nodes and leaves to the three theoretical distinctions you requested (Counterfactual Operation, Outcome Identity, Mechanism of Persistence). Use this to debrief the students after they complete the handout.

  ### NODE MAPPING

  *   **Node 1 (Counterfactual Trigger):**
      *   *Distinction:* **Counterfactual Operation.**
      *   Branch A presupposes **Rewind** (remove event $E$, run forward).
      *   Branch B presupposes **Replay** (run sequence from $T_0$) or **Perturbation** (nudge parameters).
  *   **Node 2 (The Aftermath):**
      *   *Distinction:* **Mechanism of Persistence.**
      *   Branch A presupposes **Self-reinforcing Ratchet** (increasing returns).
      *   Branch B presupposes **One-off Redirection** (no reinforcement) or **Attractor** (convergence).
  *   **Node 3 (The Object of Persistence):**
      *   *Distinction:* **Mechanism of Persistence.**
      *   Branch A is **Material/Institutional Ratchet**.
      *   Branch B is **Administrative/Data Infrastructure** (lock-in in perception).
  *   **Node 4 (The Return):**
      *   *Distinction:* **Outcome Identity.**
      *   Branch A implies **Coarse Respect** (territory same, fiscal different).
      *   Branch B implies **Divergent Outcome**.
  *   **Node 5 (The Convergence):**
      *   *Distinction:* **Outcome Identity.**
      *   Branch A implies **Token Outcome** (same institution).
      *   Branch B implies **Functional Outcome** (different institution).
  *   **Node 6 (The Welfare Detail):**
      *   *Distinction:* **Outcome Identity.**
      *   Branch A implies **Token/Strong Identity**.
      *   Branch B implies **Coarse Respect** (distributional/welfare properties diverge).
  *   **Node 7 (The Function):**
      *   *Distinction:* **Mechanism of Persistence.**
      *   Branch A implies **Attractors** (sensitivity washes out at aggregate).
      *   Branch B implies **Divergence**.

  ### LEAF ANALYSIS & COMBINATIONS

  | Leaf | Case Example | Counterfactual | Outcome Identity | Mechanism | Status | Commitment |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Iron Track** | Harbour Gauge | Rewind | Token | Ratchet (Material) | **Occupied** | Increasing returns make early accidents permanent. |
  | **2. Blind Grid** | Founding Memo | Rewind | Token (Category) | Ratchet (Admin) | **Occupied** | Reality is shaped by administrative grids, not just material costs. |
  | **3. Elastic Band** | Delayed Envoy | Rewind | Coarse | One-off / Attractor | **Occupied** | Contingent paths can reconverge on similar terms without structural necessity. |
  | **4. [Unclaimed]** | (None) | Rewind | Divergent | One-off | **Unattractive** | Accidents change the path temporarily but leave no trace. (If it leaves no trace, it is analytically invisible). |
  | **5. The Blueprint** | Two Valleys | Replay | Token | Attractor (Strong) | **Occupied** | Initial conditions dictate specific institutional forms regardless of agency. |
  | **6. Masked Agg.** | Pension Conv. | Replay | Coarse | Attractor (Weak) | **Occupied** | Macro-level similarity masks enduring micro-level divergence. |
  | **7. Func. Sink** | Rotating Chair | Perturb | Functional | Attractor (Aggregate) | **Occupied** | Systemic needs select for function, not form; details are noise. |
  | **8. [Unclaimed]** | (None) | Replay | Divergent | Divergent | **Incoherent** | Similar starting points yield fundamentally different systemic roles. (Violates the premise of macro-causal comparison). |

  ### CRITICAL FLAGS

  *   **Inseparable Leaves:** **Leaf 3 (Elastic Band)** and **Leaf 7 (Functional Sink)** are difficult to separate empirically. Both describe convergence on a broad outcome despite divergent paths.
      *   *Distinction:* Leaf 3 is a **Rewind** operation (one world, accident removed, returns to similar state). Leaf 7 is a **Perturbation/Replay** operation (many worlds/actors, different paths, same function). Students often conflate "returning to a settlement" with "functional equivalence."
  *   **Unclaimed Combinations:**
      *   **Leaf 4:** Unclaimed because it is **merely unattractive**. If a contingency leaves no trace on outcomes or structures, it is historically inert and rarely the subject of causal explanation.
      *   **Leaf 8:** Unclaimed because it is **incoherent** within this seminar's scope. If similar initial conditions yield fundamentally different systemic roles without a specified exogenous shock, it denies the possibility of macro-causal explanation entirely (pure chaos).

  ### EXAMPLE WALKTHROUGHS

  **Path 1: The "Specific Contingency" Student**
  *   *Intuition:* Harbour Gauge/Memo are contingent; Two Valleys/Slow Follower are not.
  *   **Harbour Gauge:** Node 1A (Accident) → Node 2A (Ratchet) → Node 3A (Material). **Lands on Leaf 1 (Iron Track).**
  *   **Two Valleys:** Node 1B (Replay) → Node 5A (Identical) → Node 6A (Outcomes Match). **Lands on Leaf 5 (The Blueprint).**
  *   **Determinacy:** The tree gives a determinate answer here. This student holds a dualist position: micro-events are path-dependent (Leaf 1), but macro-structures are determined (Leaf 5).
  *   **Tension:** They must explain why the Harbour Gauge (a micro-event) locks in for a century, while the Two Valleys (macro-conditions) lock in immediately. Is the mechanism different?

  **Path 2: The "Functional Inevitability" Student**
  *   *Intuition:* Every case is contingent in details but inevitable in broad function.
  *   **Harbour Gauge:** Node 1A (Accident) → Node 2A (Ratchet). *Here is the friction.* If they believe standardization was inevitable, they might argue Node 2B (No Ratchet, would have standardized anyway).
      *   *If Node 2B:* → Node 4A (Broad terms returned). **Lands on Leaf 3 (Elastic Band).**
      *   *If Node 2A:* → Node 3A. **Lands on Leaf 1 (Iron Track).**
  *   **Rotating Chair:** Node 1B (Perturbation) → Node 5B (Different Structures) → Node 7A (Same Function). **Lands on Leaf 7 (Functional Sink).**
  *   **Determinacy:** The tree struggles to separate this student's view on the Harbour Gauge. If they say "The *specific* gauge was contingent, but *a* gauge was inevitable," they are mixing Token and Functional Outcome identities.
  *   **Resolution:** Push this student to Leaf 7 for *all* cases by arguing that even the Harbour Gauge is about "Port Efficiency" (Function) rather than "Gauge X" (Token). If they refuse, they are inconsistent between Node 1 and Node 7 logic.
