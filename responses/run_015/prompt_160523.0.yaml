answer: |-
  You have put your finger precisely on the join where the plumbing leaks. Your intuition about operational definitions is spot on: in your lab, the lattice spacing *was* the reading, provided the instrument was calibrated and consistent. The economist is attempting to run a similar operation on human welfare, but the instrument (the human chooser) is neither calibrated nor consistent, and the definition shifts mid-argument.

  Here is the menu of distinct claims hidden inside that Latin slogan, ranked from the harmless to the heavy-lifting.

  ### The Menu of Claims

  **1. The Definitional Claim (The Tautology)**
  *   **The Claim:** "Preference" is simply a technical word for "whatever was chosen." To say "I prefer A to B" means nothing more than "I chose A when B was available."
  *   **Status:** **Platitude / True by definition.** This is the operational definition you recognised. It makes the theory unfalsifiable, because no choice can ever contradict a preference.
  *   **Does it block nudging?** **No.** If preference is just choice, then saying "we should maximise preference satisfaction" just means "we should help people get what they choose." It does not tell us whether we should help them choose differently. It offers no shield against nudging.

  **2. The Epistemic Claim (The Black Box)**
  *   **The Claim:** We cannot look inside people's heads to measure happiness or neural states. Choice is the only observable data we have, so we must treat it as the only scientific evidence of welfare.
  *   **Status:** **Substantive and Defensible (mostly).** This is a methodological stance, not a fact of nature. It says, "We *must* act as if choice is the only truth because we have no better tool."
  *   **Does it block nudging?** **Weakly.** It suggests nudging is on shaky ground because the nudger claims to know the chooser's mind better than the chooser does. However, it admits this is a limitation of our measurement, not necessarily a truth about the world.

  **3. The Normative Claim (The Sovereignty)**
  *   **The Claim:** Even if we *could* measure happiness directly, we *ought* to respect choice as the ultimate authority. What you pick is what is good for you, simply because you picked it.
  *   **Status:** **Substantive Ethical Claim.** This is not science; it is a moral position about autonomy. It is defensible in politics, but it is not a discovery of economics.
  *   **Does it block nudging?** **Yes.** This is the claim your lecturer actually needs. It says your welfare is defined by your agency, not your wellbeing. If this holds, nudging is paternalistic and wrong.

  **4. The Empirical Claim (The Consistency)**
  *   **The Claim:** People's choices are stable and consistent across different contexts (the "Strong Axiom" you mentioned). If you prefer A to B today, you won't prefer B to A tomorrow without a change in price or income, and irrelevant options won't change your mind.
  *   **Status:** **Often False.** This is where the content lives, as you suspected. It is an empirical hypothesis about human psychology.
  *   **Does it block nudging?** **No, in fact it invites it.** If this claim is false (and your eyepiece friend proves it is), then choice is a noisy instrument. If the instrument is noisy, we are justified in calibrating it (nudging) to get a truer reading of what the person actually wants.

  ***

  ### On Your Hypothesis: Constitutive vs. Evidence

  You are quite right. The slogan slides between "constitutive" (Choice 1 and Preference 2 are the same thing) and "evidence" (Choice reveals Preference).

  If it is **constitutive**, the theory cannot be wrong, but it also cannot guide policy. It reduces to "people do what they do."
  If it is **evidence**, the theory can be wrong.

  You are also correct that the **consistency requirement (the Strong Axiom)** is where the scientific content hides. In your lab, if two diffractometers gave different readings, you didn't say "spacing is relative to the machine." You said one machine is broken or there is an experimental error. You demanded agreement.
  In economics, if a person chooses A over B in one context, and B over A in another (without price changes), the "instrument" is inconsistent. The economist usually handles this by saying the "context" is part of the choice. But if context changes everything, the "preference" is no longer a stable property of the person, it's a property of the situation. That destroys the idea that the person is the best judge of their own welfare.

  ***

  ### Testing the Cases

  **Case 1: The Astronomy Club (The Decoy Effect)**
  Your friend chooses the cheap eyepiece when a rubbish one is present, but the expensive one when it is not.
  *   **Under the Definitional Claim:** He preferred cheap in scenario A, and expensive in scenario B. No contradiction. But this makes "preference" useless for predicting future behaviour.
  *   **Under the Empirical Claim:** This is a violation of consistency (specifically, independence of irrelevant alternatives). The rubbish eyepiece shouldn't matter.
  *   **Verdict:** This case shows the "instrument" is faulty. If his choice flips based on a decoy, his choice does not reveal a stable underlying value. This **supports nudging**. You are justified in removing the rubbish eyepiece to help him reveal his "true" preference for quality. The economist's slogan fails here unless he admits preferences are unstable, in which case he loses the right to say "hands off."

  **Case 2: The Midnight Biscuit (Akrasia)**
  You eat the biscuit at 11 p.m., but wish you hadn't at 8 a.m.
  *   **Under the Definitional Claim:** At 11 p.m., you preferred the biscuit. At 8 a.m., you preferred health. Both are true. There is no "real" you, just a series of time-stamped preferences.
  *   **Under the Normative Claim:** The 11 p.m. choice is sovereign. To stop you would be to violate your 11 p.m. autonomy.
  *   **Under the Evidence Claim:** The 11 p.m. choice is a measurement error caused by fatigue or impulse. The 8 a.m. reflection is the calibrated reading.
  *   **Verdict:** This is not a dud case; it is the central problem of behavioural economics. If welfare is "happiness," the 8 a.m. view is likely more accurate (you are happier being healthy). If welfare is "choice," the 11 p.m. view wins. The slogan *de gustibus* tries to force the 11 p.m. view to win. But if we admit the 11 p.m. choice was a mistake (evidence view), then nudging (e.g., not buying biscuits) is justified to help the 8 a.m. self defeat the 11 p.m. self.

  ***

  ### The Verdict on Utility

  Your suspicion of a bait-and-switch is correct. In the 19th century, utility meant "usefulness" or "satisfaction" (close to happiness). In the 20th century, to make economics more like physics, it was redefined as "an index number that ranks choices."

  Your lecturer is using the modern, empty definition to block arguments about the old, meaningful one. He is saying, "We cannot measure happiness, so we measure choice," but then concluding, "Therefore, choice *is* happiness."

  **Straight line:** No, "utility" in this man's mouth has nothing left to do with happiness; it is merely a mathematical scorecard for consistency, and he is borrowing the moral weight of "happiness" to protect it from criticism.
