answer: |-
  ### The Principle: Risk-Adjusted Marginal Search (RAMS)

  There is a single governing principle that accommodates your intuitions, though it requires precise formulation to handle the variance between cases. It is not merely "cost-benefit analysis," but specifically a constraint on when *stopping rules* are epistemically permissible.

  **The Principle:**
  > An agent is justified in halting search (satisficing) if and only if the **Marginal Cost of Further Discrimination** exceeds the **Expected Reduction in Residual Risk**, provided that the **Variance of Outcome** within the set of "acceptable" options is low relative to the **Severity of Failure**.

  This principle contains three distinct clauses. Here is how your cases motivate each:

  1.  **The Cost-Benefit Clause** (*"Marginal Cost... exceeds Expected Reduction"*):
      *   **Motivating Cases:** The **Electric Kettle** and the **Paperback**.
      *   **Explanation:** In the kettle case, the cost of searching for a £25 model versus a £30 model outweighs the £5 saving. In the paperback case, six months of labor (high cost) yields a £20 object (low benefit). This clause establishes the baseline economic rationality of search.
  2.  **The Severity Clause** (*"...relative to the Severity of Failure"*):
      *   **Motivating Cases:** The **Family Home** and **Chemotherapy**.
      *   **Explanation:** A home represents a lifetime of utility and financial security; a chemotherapy regimen represents life or death. The "Severity of Failure" is so high that the threshold for "Expected Reduction in Residual Risk" becomes massive, warranting search costs (six months; expert modeling) that would be absurd for a kettle.
  3.  **The Variance Clause** (*"...Variance of Outcome within the set of 'acceptable' options..."*):
      *   **Motivating Cases:** The **Surgeon** and the **Retirement Portfolio**.
      *   **Explanation:** This is the critical differentiator.
          *   **Surgeon:** Among surgeons who meet the "required qualification" (the acceptable set), the variance in surgical success rates is high. Picking the *first* qualified candidate ignores this variance. Because Severity is high, ignoring variance is negligent.
          *   **Retirement:** Among portfolios that follow a sound age-based heuristic, the variance in long-term outcome is relatively low (due to market diversification and the law of large numbers). The heuristic captures most of the available safety. Thus, satisficing is prudent despite the high stakes.

  ### Analysis of the Software Case

  **Case:** Overseeing software used by millions; halting at 99.99% accuracy because 99.999% requires years of labor and failures are "harmless edge cases."

  **RAMS Prediction:** This is **permissible satisficing**, but it hangs on the definition of "harmless."
  *   **Calculation:** You are weighing the *Marginal Cost* (years of labor) against the *Expected Reduction in Residual Risk*.
  *   **Scale Factor:** Because the software is used by *millions*, a 0.01% failure rate is not small in absolute terms (it is thousands of errors).
  *   **Verdict:** If the errors are truly harmless (e.g., a cosmetic glitch), the *Severity of Failure* is near zero, making the Risk near zero. Satisficing is justified. However, if "harmless" means "non-fatal but reputation-damaging," the aggregated severity across millions of users may tip the scale, making the years of labor warranted. Your intuition that it is permissible suggests you have implicitly judged the *Severity* as low enough to negate the *Scale*.

  ### Prediction: Selecting a School Curriculum

  **Case:** A district must select a curriculum for 10,000 students.
  *   **Stakes:** High (long-term student outcomes, public trust, financial cost).
  *   **Reversibility:** Low (hard to undo a year of education).
  *   **Variance:** High (different curricula perform vastly differently across different demographics; "state approved" is a weak proxy for "effective," similar to surgeon credentials).
  *   **Search Cost:** High (requires pilot testing, expert review).

  **RAMS Prediction:** **Satisficing is Negligent.**
  You cannot simply select the first curriculum that meets state standards (the "acceptable" set). The variance in educational outcomes among "approved" curricula is too high, and the severity of failure (wasting a child's developmental year) is significant. The principle predicts you must engage in comparative optimization (piloting multiple options) because the Marginal Cost of Discrimination is justified by the Expected Reduction in Residual Risk.

  ### The Cost of Simplicity

  You asked which of your verdicts cannot be accommodated without abandoning simplicity.

  To maintain a **simple** principle of bounded rationality (e.g., Herbert Simon's original formulation: *"Search until you find an option that meets your Aspiration Level"*), you must abandon the **Surgeon Verdict**.

  **The Conflict:**
  A simple satisficing model treats the "Aspiration Level" as a binary threshold.
  *   **Simple Model:** Set aspiration (e.g., "Qualified"). Pick first option meeting aspiration. Stop.
  *   **Your Intuition:** This is negligent for surgeons.

  **Why Simplicity Fails:**
  To accommodate your intuition that the surgeon case is negligent while the kettle case is fine, you must abandon the idea that an Aspiration Level is a static filter. You must admit that **in high-stakes environments, the Aspiration Level is not a floor, but a distribution.**

  You are implicitly arguing that for surgeons, "Qualified" is not a valid aspiration level for *outcome*, only for *eligibility*. To make the principle work, you must add the **Variance Clause** (Clause 3 above). This abandons the simplicity of classic satisficing, which assumes that once an option is "good enough," further search is irrational by definition. Your intuitions demand a more complex model where "good enough" is contingent on the *spread of quality* among the "good enough" options.

  **Summary of Sacrifice:**
  If you insist on a **simple** rule ("Stop at the first acceptable option"), you must concede that selecting the first qualified surgeon is *rational* (provided search costs are high). If you insist that selecting the first qualified surgeon is *negligent* (as you do), you must abandon the simplicity of the "first acceptable" rule and adopt the more complex **Risk-Adjusted Marginal Search** principle, which requires agents to estimate outcome variance before they are permitted to stop searching.
