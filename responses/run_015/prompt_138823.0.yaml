prompt: |-
  I would like you to analyze the run on the UK bank Northern Rock in September 2007 through the lens of information cascades and rational herding, and then tell me where the model breaks and what the case shows about the theory.

  Treat the following as given public facts, not as things to look up. Northern Rock was a British mortgage lender that funded long-term mortgages largely by borrowing short-term in wholesale money markets rather than through stable retail deposits. In September 2007, during a broader credit squeeze, it could not replace maturing wholesale funding and sought emergency liquidity support from the Bank of England. When news of that request became public around 13-14 September, depositors began queueing outside branches to withdraw savings; the scenes were widely shown in the media. Over a few days, on the order of one to two billion pounds was withdrawn, and this was reported as the first large-scale retail bank run in Britain in about a century and a half. On 17 September the government announced that it would guarantee all existing deposits at the bank, and the queues then rapidly disappeared. The bank was later taken into public ownership, but for this analysis the episode is the run and its end.

  The theory to apply is the rational-herding or information-cascade picture. In the simple version, agents act in sequence and can observe the actions of earlier agents. Each has a private, noisy signal about an underlying state, here something like the bank's solvency or liquidity, and a prior. Because later agents see what earlier agents did, they may rationally imitate them even when their own signal points the other way: the visible behavior of the crowd can carry more weight than one person's private impression. Once enough people have moved the same way, a cascade can form in which others follow irrespective of their private doubts, and the cascade may be hard to reverse unless new public information arrives.

  I want you to add one wrinkle that the textbook version does not usually handle. Suppose that for many retail depositors the act of queueing is not a final, irreversible withdrawal but the purchase of a cheap option. By joining the queue, a depositor preserves the ability to withdraw if the queues keep growing, while not yet having completed a withdrawal; if the panic fades, the depositor can go home and leave the money where it is. Call this the reversible-queue or herding-option variant. In this variant the public signal is not simply that these people have withdrawn, but that these people are willing to be seen waiting.

  Please structure your answer as follows.

  First, give a disciplined mapping. Identify the agents: retail depositors, wholesale or institutional funders, the media, the Bank of England and other regulators, and the government. For each, say what counts as a private signal, what is public, what the available options are, and what the payoffs or losses would be under a few relevant states of the world: the bank remains solvent and liquid; the bank is illiquid but ultimately sound; the bank fails and is resolved; and the government guarantees deposits. Be explicit about what an ordinary depositor knows, what that depositor merely suspects, and what the depositor cannot know.

  Second, use the theory to explain the episode. What does the cascade or herding story predict about the start of the run, the self-reinforcing queues, the apparent weakness of reassurances before the guarantee, and the abrupt stop after the guarantee? Distinguish carefully between two mechanisms that are often conflated: an informational cascade, in which later depositors infer bad news from earlier withdrawals and rationally discount their own contrary signals; and a strategic-complementarity or payoff-externality story, in which a depositor wants to withdraw partly because if enough others withdraw the bank will fail, making withdrawal self-fulfilling. Say which mechanism does the real explanatory work here, or whether both are needed. Then say what the reversible-queue variant adds: does it make the visible queues a better or worse signal of true withdrawal intentions, and does it change what the government's guarantee accomplished?

  Third, say where the model is silent or breaks. The simple cascade does not by itself explain why the run began when it did rather than earlier; it does not easily handle the role of wholesale funders, whose refusal to roll over short-term debt may have mattered more than retail withdrawals; it does not explain why depositors with only modest balances, who stood to lose little even in a failure, joined the queue; it does not by itself explain why the guarantee worked, since a guarantee can change payoffs and not just information, and might even be read as confirmation that the bank was in danger; and it does not tell us how much of the behavior was rational herding rather than ordinary fear, liquidity need, or imitation. Where the model cannot speak, say so plainly rather than forcing it. If a related model does better, for example a coordination or threshold model in which depositors have private signals about fundamentals and withdraw only if they expect enough others to withdraw, or a two-population version with retail depositors alongside wholesale funders, describe that model clearly enough for me to see its structure, and say what it adds and what it still misses. You do not need to cite authors, papers, or sources; just describe the ideas.

  Finally, be disciplined about the epistemics. Separate what is settled from what is genuinely contested among people who know this topic. I take as settled the basic mechanics of sequential decision-making under observed choices, the broad sequence of the Northern Rock run as I have stated it, and the point that a credible government guarantee can end a run. I take as contested or uncertain: whether Northern Rock was fundamentally insolvent or merely illiquid in September 2007; how much of the run was driven by retail depositors rather than by wholesale lenders and institutional counterparties; whether media coverage mainly reported or amplified the panic; whether the guarantee was necessary to stop the run or mainly restored confidence after the run had already burned out; and how much of the observed behavior is better explained by rational herding than by fear, liquidity need, or imitation. Do not present any of these contested matters as consensus. If you rely on a particular interpretation of the episode or of the theory, flag it as an interpretation and say what sort of evidence would be needed to settle it. Mark clearly which parts of your answer are applications of the theory and which are historical claims about the case.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Request:**

      *   **Topic:** Northern Rock bank run (September 2007).
      *   **Theoretical Lens:** Information cascades and rational herding.
      *   **Specific Twist:** "Reversible-queue" or "herding-option" variant (queueing is buying an option to withdraw, not final withdrawal).
      *   **Structure:**
          1.  Disciplined Mapping (Agents, Signals, Public Info, Options, Payoffs/States).
          2.  Theoretical Explanation (Cascade vs. Strategic Complementarity, Role of Reversible-Queue, Role of Guarantee).
          3.  Model Breaks/Silences (Timing, Wholesale vs. Retail, Small Depositors, Guarantee Mechanics, Rationality vs. Fear).
          4.  Epistemics (Settled vs. Contested facts).
      *   **Constraints:** Treat provided facts as given. Do not look up external info. Do not cite authors/papers. Be explicit about interpretations vs. historical claims.

  2.  **Part 1: Disciplined Mapping:**

      *   *Agents:* Retail Depositors, Wholesale Funders, Media, Bank of England (BoE)/Regulators, Government.
      *   *States of the World:* Solvent/Liquid, Illiquid/Sound, Fails/Resolved, Government Guarantee.
      *   *Signals:* Private (account balance health, news consumption, gut feeling), Public (queues, TV news, BoE announcement, Guarantee announcement).
      *   *Options:* Withdraw, Stay, Queue (Reversible), Roll-over funding (Wholesale), Lend (BoE), Guarantee.
      *   *Payoffs:* Need to define these relative to the states. E.g., if Solvent/Liquid -> Stay is best (interest). If Fails -> Withdraw is best (get money out before closure).
      *   *Epistemic Status:* What does a depositor *know*? (They have an account). What do they *suspect*? (Maybe the bank is in trouble). What *can't* they know*? (The true value of mortgage assets, the BoE's private assessment).

  3.  **Part 2: Theoretical Explanation:**

      *   *Standard Cascade:* Agent 1 acts on signal. Agent 2 sees Agent 1 + own signal. If Agent 1 withdrew, Agent 2 might ignore good private signal and withdraw too.
      *   *Strategic Complementarity (Bank Run Game):* I withdraw *because* you withdraw. If enough withdraw, bank fails. My withdrawal contributes to failure. This is distinct from pure information cascades (where I withdraw because I think *you* know something I don't).
      *   *Application to Northern Rock:*
          *   Start: Wholesale funding dries up (private signal to market, becomes public via BoE request).
          *   Queues: Visible action.
          *   Reassurance Failure: BoE statement wasn't enough (signal wasn't strong enough to break cascade).
          *   Guarantee: Changed the payoff structure entirely (no loss even if bank fails).
      *   *Reversible-Queue Twist:* Queueing is low-cost signaling. It amplifies the *visibility* of panic without immediate cost to the bank (until cash is handed over). It makes the signal "noisier" regarding actual liquidity drain but "stronger" regarding sentiment. The guarantee removes the value of the "option" (no need to hedge against loss).

  4.  **Part 3: Model Breaks/Silences:**

      *   *Timing:* Why Sept 2007? Simple cascade doesn't explain the trigger (wholesale freeze).
      *   *Wholesale vs. Retail:* Standard model focuses on retail. Northern Rock was unique because wholesale funding failed *first*. Retail run was secondary but more visible.
      *   *Small Depositors:* Why risk £500? Cost of queueing > potential loss? Suggests non-rational factors or very low threshold for "safety."
      *   *Guantee:* Standard cascade says information stops it. Guarantee changes *payoffs*, not just info. It makes the "withdraw" strategy dominated.
      *   *Rationality:* Was it fear/panic (irrational) or calculated herding? Hard to distinguish.
      *   *Alternative Model:* Global Games / Threshold Models. Agents withdraw if they believe fundamentals are below a threshold *and* they believe others will withdraw. This handles the strategic complementarity better than pure information cascades.

  5.  **Part 4: Epistemics:**

      *   *Settled:* Sequence of events, mechanics of cascades, guarantee stops runs.
      *   *Contested:* Solvency vs. Illiquidity, Wholesale vs. Retail driver, Media role, Necessity of guarantee, Rationality vs. Emotion.
      *   *Discipline:* Must flag interpretations. "If we assume..." "Evidence would need to show..."

  6.  **Drafting - Section by Section (Iterative refinement):**

      *   *Mapping:* Ensure the "Reversible-Queue" is integrated into the Options/Payoffs for depositors.
      *   *Theory:* Clearly distinguish Information Cascade (I think you know something) vs. Strategic Complementarity (I need to get out before the door closes). The prompt asks to distinguish these. Northern Rock is often cited as a mix. The BoE liquidity support was supposed to fix the *liquidity* (fundamentals), but the run continued. This suggests Strategic Complementarity (fear of being last) or that the signal of BoE support was interpreted as confirmation of weakness (Information Cascade).
      *   *Reversible Queue:* This is a key innovation in the prompt. Queueing = buying a put option. It lowers the cost of "testing the water." This makes the cascade *easier* to start (lower threshold to join queue) but makes the signal *less* informative about actual cash outflow initially.
      *   *Breaks:* The wholesale aspect is crucial. The standard Diamond-Dybvig or Bikhchandani et al. models are retail-centric. Northern Rock was a wholesale-funded entity. The model breaks because the "first movers" weren't retail depositors; they were institutional investors who didn't queue, they just didn't roll over debt.
      *   *Epistemics:* Be careful not to say "Northern Rock was insolvent." Say "Whether Northern Rock was insolvent is contested."

  7.  **Refining the "Reversible-Queue" Logic:**
      *   In a standard model, Action = Withdraw.
      *   In this variant, Action 1 = Queue (Cost: Time). Action 2 = Complete Withdrawal (Cost: None, Gain: Cash). Action 3 = Leave Queue (Cost: Time sunk).
      *   Signal to others: "Person X is in queue."
      *   Interpretation: Person X fears insolvency enough to incur time cost, but hasn't committed to leaving.
      *   Impact on Guarantee: The guarantee makes the "Complete Withdrawal" payoff equal to "Stay." Therefore, the "Queue" option loses its value. The option was to protect against loss. No loss possible = No need for option.

  8.  **Refining the "Wholesale" Break:**
      *   Standard cascade: Retail depositors watch retail depositors.
      *   Reality: Retail depositors watched *news* about Wholesale funders and the BoE.
      *   Model gap: The "private signal" for retail was actually public news about institutional behavior. This changes the information structure from sequential private signals to public shocks + sequential reaction.

  9.  **Final Review against Constraints:**
      *   Did I use the provided facts? Yes.
      *   Did I avoid citations? Yes.
      *   Did I separate settled vs. contested? Yes.
      *   Did I address the specific "Reversible-Queue" twist? Yes.
      *   Is the tone disciplined? Yes.

  10. **Final Polish:** Check for clarity and ensure the distinction between Information Cascade and Strategic Complementarity is sharp, as requested. (Self-Correction: Make sure not to conflate the two. Cascade = learning from others. Complementarity = payoff depends on others' actions).

  *(Self-Correction during drafting)*: I need to make sure I don't imply the guarantee *only* worked via information. The prompt explicitly notes guarantees change payoffs. I must highlight that the standard cascade model struggles with payoff changes, focusing mostly on information updating.

  *(Self-Correction on Epistemics)*: Ensure I don't validate the "insolvent" claim. Keep it as a variable in the "States of the World."

