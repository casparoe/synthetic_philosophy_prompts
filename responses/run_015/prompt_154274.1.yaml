answer: |-
  Your hypothesis is incisive and largely correct. The stalemate in the transformative experience (TE) debate is not merely a clash over epistemology versus preference; it is a collision between incompatible **metaphysical commitments regarding the unit of agency**, which manifests as a hidden **formal disagreement about the axioms of intertemporal choice**.

  Here is the diagnosis of the disagreement, its classification, and the path to progress.

  ### 1. Diagnosis: The Three-Layer Conflation
  The debate stalls because both sides are arguing on three distinct layers simultaneously without disentangling them: the **Epistemic** (knowledge of qualia), the **Axiological** (stability of value), and the **Ontological** (persistence of the agent).

  *   **Side A (The Epistemic View, e.g., L.A. Paul):**
      *   **Claim:** Rational choice requires assigning expected utility to outcomes. You cannot assign utility to a phenomenal state you cannot access.
      *   **Identity Commitment:** Implicitly assumes **Numerical Identity**. For the epistemic gap to matter, the "you" choosing now must be the same entity as the "you" experiencing later. If you were a wholly different person, your ignorance of their qualia would be irrelevant to your rationality (just as your ignorance of *my* qualia is irrelevant to your choices).
      *   **Value Assignment:** Value is grounded in *phenomenal experience*.
  *   **Side B (The Preference/Identity View, e.g., Harman, Mosquera, Ullmann-Margalit):**
      *   **Claim:** Rational choice requires satisfying preferences. If the transformation replaces your preference architecture, the current agent is choosing for a successor with incommensurable values.
      *   **Identity Commitment:** Implicitly assumes **Psychological Continuity**. If psychological connectedness drops below a threshold (due to radical preference change), the agent is effectively distinct.
      *   **Value Assignment:** Value is grounded in *preference satisfaction*, which is mutable.

  **The Hidden Formal Disagreement:**
  You asked if there is a hidden formal disagreement. **Yes.** Standard Expected Utility Theory (EUT) operates on an implicit **Identity-Stability Axiom**: $U_{t} \approx U_{t+1}$. It assumes a single utility function persists over time.
  *   Side A argues EUT fails because the *inputs* (utilities) are unknown ($U$ is undefined).
  *   Side B argues EUT fails because the *function* itself changes ($U_t \neq U_{t+1}$).

  Neither side has defended the Identity-Stability Axiom because it is usually buried in the formalism of decision theory. Side A assumes the agent is stable enough to warrant epistemic concern; Side B assumes the agent is unstable enough to warrant axiological discontinuity. They are talking past each other because they are using different criteria for "the agent."

  ### 2. Classification: Bedrock or Substantive?
  Is this disagreement verbal, substantive, or bedrock?

  It is **Bedrock** masquerading as **Substantive**.

  *   **Why it looks Substantive:** They appear to be disagreeing about the mechanics of decision theory (can we calculate utility or not?).
  *   **Why it is Bedrock:** The disagreement rests on a prior, unargued commitment about what constitutes a "rational agent" over time. There is no neutral framework within standard decision theory to adjudicate whether an agent *is* their phenomenal locus (Side A) or their preference structure (Side B).
      *   If you accept the **Phenomenal View** of identity, Side A wins (I must know what it feels like to be me).
      *   If you accept the **Psychological/Preference View** of identity, Side B wins (I am choosing for a successor, so standard rationality conditions don't apply).

  Because neither side defends their metaphysical criterion for agency, the debate is circular. Side A accuses Side B of ignoring the "what it's like" (presupposing Phenomenal Identity). Side B accuses Side A of ignoring "preference change" (presupposing Psychological Identity).

  ### 3. Path to Progress
  To break the stall, we cannot simply choose one side. We must restructure the problem. Here is how the three options you proposed rank in terms of utility:

  #### A. Conceptual Distinction (Necessary but Insufficient)
  **Distinguish Phenomenal Ignorance from Axiological Discontinuity.**
  We must formally separate the *Epistemic Block* (I don't know the qualia) from the *Authority Block* (I don't endorse the future values).
  *   *Progress:* This clarifies that one can have a TE that is epistemically transparent (e.g., via simulation) but axiologically discontinuous (I know what it's like, but I won't care about it).
  *   *Limit:* This diagnoses the confusion but doesn't solve the choice problem. It just tells us *why* we are confused.

  #### B. Formal Model (High Utility)
  **Develop a Diachronic Choice Model with an Identity-Drift Parameter.**
  We need a formal model of choice across identity stages that abandons the Identity-Stability Axiom. This would treat the pre-transformation agent and post-transformation agent as distinct but related entities (a "Successor Agent" model).
  *   *Progress:* This allows us to model the choice not as "maximizing my utility" but as "negotiating with a successor." It formalizes Side B's intuition without discarding Side A's concern (by weighting the successor's utility based on psychological connectedness).
  *   *Limit:* Formal models can describe the break, but they cannot normatively justify *why* the current agent should care about the successor.

  #### C. Reframing (The Dissolution)
  **Reframe from "Prediction" to "Authorization."**
  This is the most promising path. The stall exists because both sides assume rational choice requires *predicting* the value of the future state.
  *   *The Shift:* Transformative choices are not acts of **prediction** (epistemic) nor **calculation** (axiologic); they are acts of **authorization**.
  *   *Progress:* The question changes from "Will I be happy?" (which requires epistemic access and identity stability) to "Do I authorize this new version of me to exist?"
  *   *Why it dissolves the problem:* It bypasses the need for phenomenal knowledge (Side A's concern) and accommodates preference change (Side B's concern). It treats the TE not as a decision *within* a life plan, but as a decision *about* the life plan's continuity.

  ### Conclusion
  Your hypothesis is correct: the stall is driven by an unargued metaphysical commitment regarding diachronic agency. Side A assumes the agent is a **locus of experience** that persists; Side B assumes the agent is a **locus of preference** that may fracture.

  The disagreement is **Bedrock** because it concerns the definition of the agent itself. Progress requires **Reframing**. We must move away from standard Expected Utility Theory, which cannot handle identity drift, toward a **Normative Authorization Model**. In this model, the rationality of a transformative choice is not determined by the accuracy of the prediction or the stability of the preference, but by the legitimacy of the current agent's endorsement of their own obsolescence or evolution.
