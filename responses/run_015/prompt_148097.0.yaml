  1. Jointly Endorsed Claims

  Both parties endorse the following claims regarding the current landscape of effective altruism (EA) and philanthropic institutionalism. First, EA institutions currently rely heavily on ultra-high-net-worth individuals for operational liquidity, creating a funding environment where proposal viability correlates strongly with donor interest profiles. Second, cause prioritization logic necessarily involves trade-offs between scope, neglectedness, and tractability, though the weighting of these factors remains contested. Third, all impact assessment relies on counterfactual reasoning regarding what would occur absent intervention, acknowledging that such reasoning is inherently uncertain over long time horizons. Fourth, a conceptual distinction must be maintained between epistemic measurability, defined as the confidence with which an effect can be estimated given available data, and ontological measurability, defined as whether the effect is constituted by properties that admit of quantitative representation. Both parties agree that conflating these categories leads to category errors in moral evaluation, even if they disagree on the frequency of this conflation in practice. Fifth, career pathways labeled as "earning to give" involve opportunity costs that must be weighed against direct advocacy or service labor, acknowledging that labor markets are not perfectly efficient. Finally, both parties accept that institutional governance structures influence cause selection, though they disagree on the magnitude and moral relevance of this influence. Both parties further acknowledge that the sociology of philanthropy involves power dynamics that cannot be fully abstracted away from moral evaluation, even if the normative significance of those dynamics is disputed. Both parties acknowledge that the movement's growth has professionalized philanthropy, creating distinct classes of researchers and implementers. They agree that resource allocation decisions are made under conditions of imperfect information, requiring heuristics that may introduce systematic bias. Furthermore, both accept that the definition of "effectiveness" is contingent upon the time horizon selected for evaluation, with short-term metrics potentially obscuring long-term institutional dynamics. They also concur that the moral psychology of donors and practitioners influences institutional behavior, meaning that purely rationalist models of philanthropy must be adjusted for behavioral realities. Finally, both parties recognize that the separation of wealth accumulation from redistribution mechanisms creates distinct ethical risks that require ongoing scrutiny, regardless of whether those risks are deemed manageable or structural.

  2. Residual Disagreements

  | Disagreement Topic | Institutional-Critique Formulation | Optimization-Defense Formulation |
  | :--- | :--- | :--- |
  | **Moral Status of Earning to Give** | In non-competitive or structurally coercive labor markets, high-income labor often perpetuates harmful structures, rendering the net impact of earning to give negative regardless of subsequent donation levels. | Earning to give remains ethically permissible and often obligatory when an individual's comparative advantage in high-income labor generates greater net welfare than alternative careers, irrespective of market imperfections. |
  | **Measurability Bias** | Measurability bias is inherent to utilitarian aggregation because prioritizing tractable metrics systematically excludes relational and democratic goods that lack quantitative proxies. | Measurability bias is a correctable epistemic limitation; institutional design can incorporate proxy metrics and qualitative weighting to capture non-quantifiable goods without abandoning rigor. |
  | **Donor Dependence** | Dependence on ultra-high-net-worth donors necessarily distorts cause selection toward donor-preferred interventions, creating path dependencies that cannot be fully insulated by governance. | Donor dependence does not necessarily distort cause selection; professionalized governance mechanisms can structurally insulate grantmaking decisions from donor preferences to ensure alignment with evidence. |

  3. Crux Identification

  Three specific cruxes identify where empirical or normative resolution would significantly converge the parties' positions. First, do institutional autonomy and local democratic legitimacy possess independent moral weight in cause evaluation, separate from aggregate welfare outcomes? The Institutional-Critique Party asserts these are intrinsic goods necessary for moral legitimacy; the Optimization-Defense Party views them as purely instrumental to welfare. If autonomy is shown to be constitutive of welfare rather than merely instrumental, the Defense Party must adjust weighting significantly. Second, regarding comparative predictive reliability: are long-run institutional-impact forecasts more or less reliable than direct welfare metrics over decadal timescales? If direct metrics prove consistently more predictive of long-term stability than institutional modeling, the Critique Party's skepticism regarding measurability loses force. Conversely, if institutional modeling proves more robust against shock events, the Defense Party must acknowledge limits to direct interventionism. Third, within decision theory and institutional design: can a portfolio framework that includes causes scoring poorly on quantifiable welfare metrics but highly on autonomy-preservation remain coherent without collapsing into ad hoc exception-making? If such a framework can be formalized without violating consistency axioms, the Critique Party's concern regarding structural exclusion is mitigated; if not, the Defense Party must acknowledge a limit to optimization logic. Resolution of the first crux determines the boundary of acceptable trade-offs. Resolution of the second crux dictates the preferred methodology for long-term planning. Resolution of the third crux establishes the limits of formal modeling in moral decision-making. Together, these cruxes map the terrain where sociological critique and optimization defense might find common ground or confirm irreconcilable differences.

  4. Joint Tests and Divergent Predictions

  For the first crux regarding independent moral weight, both parties consider a hypothetical where a donor-funded intervention increases aggregate welfare by 10% but reduces local decision-making power by 50%. The Critique Party predicts this intervention is impermissible regardless of welfare gains, citing legitimacy deficits; the Defense Party predicts it is permissible if net welfare increases, citing outcome supremacy. For the second crux on predictive reliability, both parties agree to evaluate a 25-year comparison between direct cash-transfer scale-up and democratic-institution-strengthening in a specific hypothetical low-income context evaluated under conditions of radical uncertainty about institutional decay rates. The Critique Party predicts institutional strengthening will demonstrate higher variance but superior tail-end stability and resilience to external shocks; the Defense Party predicts cash transfers will show more consistent positive welfare outcomes with lower risk of catastrophic institutional failure or corruption. For the third crux on portfolio coherence, both parties engage a conceptual test regarding whether autonomy-preservation metrics can be incorporated into cause-ranking frameworks without undermining the epistemic function those frameworks serve. The Critique Party predicts that incorporating such metrics will require qualitative overrides that break quantitative ranking coherence, rendering the framework arbitrary; the Defense Party predicts that autonomy can be operationalized as a weighted variable within existing utility functions without structural collapse. These divergent predictions highlight the underlying tension between outcome-based and process-based moral reasoning. If the Critique Party's prediction regarding institutional stability holds, it suggests that current optimization models underestimate systemic risk. If the Defense Party's prediction regarding consistency holds, it suggests that democratic processes may be inefficient vehicles for welfare maximization. The conceptual test results will determine whether the movement can integrate pluralistic values without sacrificing the comparability required for prioritization. Ultimately, these tests serve as empirical adjudicators for the theoretical dispute regarding the compatibility of optimization and democratic legitimacy within a single institutional framework.
