answer: |-
  ### Exam Prompt: Rationality and Observable Commitments

  **Course:** PHI 505: Advanced Rationality & Decision Theory
  **Assignment:** Take-Home Essay
  **Word Limit:** 1,200 words maximum

  **Scenario:**
  Recall Parfit's Hitchhiker: A driver will only save a dying hitchhiker if they predict the hitchhiker will pay upon reaching town. The hitchhiker, once safe, has a causal incentive to default. Standard Causal Decision Theory (CDT) suggests defaulting, leading the driver to predict default and leave the hitchhiker. Parfit argues this makes rationality self-defeating.

  **The Twist:**
  Suppose the driver has access to a cheap, observable commitment device (e.g., a smart-contract lockbox). If activated *before* picking up the hitchhiker, this device automatically transfers the fare from the driver's account to the hitchhiker if the driver fails to reach town. This makes driving the dominant strategy for the driver regardless of the hitchhiker's future payment. The hitchhiker observes whether the device is active before agreeing to the ride and deciding whether to pay.

  **Question:**
  Does the availability of this observable precommitment device undermine Parfit's claim that rationality is self-defeating, or does it merely relocate the problem between ex-ante and ex-post rationality? Construct an argument analyzing the incentive shifts for both agents. Do not simply summarize the original paradox; focus on the mechanics of the commitment device.

  ***

  ### Model Answer

  **Title:** The Displacement of Rational Defeat in Observable Commitments

  Parfit's original Hitchhiker case posits that Causal Decision Theory (CDT) is self-defeating because it prescribes an action (non-payment) that ensures a worse outcome (death in the desert) than an alternative disposition (commitment to pay). The introduction of an observable, mechanical commitment device does not dissolve this paradox; rather, it relocates the point of rational failure from the hitchhiker's payment decision to the driver's adoption of the device. While the device solves the driver's incentive problem regarding the *drive*, it exacerbates the incentive problem regarding the *fare*, preserving the conclusion that standard rationality remains self-defeating.

  To see this, we must first analyze the driver's incentives under the new mechanic. In the standard case, the driver's threat to strand the hitchhiker is time-inconsistent; once the hitchhiker is in the car, the driver prefers to save the fuel and drive to town regardless of payment. The smart-contract lockbox resolves this specific time-inconsistency. By making the penalty for stranding the hitchhiker exceed the cost of fuel, the device makes "Drive" a dominant strategy for the driver. The driver no longer needs to predict the hitchhiker's payment to justify driving; the contract forces the drive.

  However, this mechanical certainty fundamentally alters the hitchhiker's decision matrix. In the standard paradox, the hitchhiker's payment is evidentially linked to their rescue because the driver's prediction relies on it. Under CDT, the hitchhiker pays to influence the prediction. In the modified scenario, the hitchhiker observes the active lockbox *before* the ride. Consequently, the hitchhiker knows with causal certainty that they will arrive in town regardless of their subsequent payment. The causal link between "Pay" and "Rescue" is severed. A CDT-agent hitchhiker, observing the active lock, recognizes that the money is gone either way. Rationality dictates defaulting on the payment.

  This creates a new dilemma for the driver. The driver knows the hitchhiker is rational. The driver knows that if the lockbox is activated, the hitchhiker will observe it, recognize the safety guarantee, and refuse to pay. The driver thus faces a choice between two losing propositions: activate the lock, drive to town, and lose the fare (plus the cost of the device); or do not activate the lock, face the original paradox, and likely end up stranded because the rational hitchhiker will not commit to pay ex-ante.

  Here lies the relocation of the self-defeating nature of rationality. In the original case, rationality was self-defeating for the hitchhiker (rational non-payment leads to death). In the modified case, rationality is self-defeating for the driver. A rational driver, anticipating the hitchhiker's rational default, should not activate the lockbox if the fare is necessary to offset costs. Yet, without the lockbox, the rational driver cannot credibly threaten to strand the hitchhiker, leading to the original deadlock. The "solution" provided by the commitment device only works if the driver is irrational enough to activate a money-losing device, or if the hitchhiker is irrational enough to pay when safety is guaranteed.

  One might argue this distinguishes the case from Newcomb's Problem, suggesting the mechanical lock removes the need for "irrational" dispositions. This is a structural error. In Newcomb's Problem, the predictor's accuracy relies on a correlation between the agent's disposition and the box's content. In this modified Hitchhiker case, the correlation is replaced by a mechanical constraint. However, the outcome is identical: to achieve the optimal joint outcome (Rescue + Payment), at least one agent must act contrary to their ex-post causal incentives. The lockbox merely shifts the burden of "irrationality" from the hitchhiker (who must pay when safe) to the driver (who must commit to a cost without guaranteed return).

  Therefore, the observable commitment device does not vindicate CDT. It demonstrates that whenever agents interact sequentially with conflicting ex-post incentives, standard rationality fails to secure the Pareto-optimal outcome. Whether the failure occurs at the stage of payment (original case) or at the stage of device adoption (modified case), the result is the same: a rational agent, strictly following ex-post causal dominance, ends up worse off than an agent capable of binding their future self against their future interests. Rationality remains self-defeating; the commitment device simply moves the graveyard.

  ***

  ### Marking Scheme (30 Marks Total)

  **1. Accurate Mapping of Standard Payoffs (6 Marks)**
  *   **Requirement:** Correctly identifies that in the standard case, the driver's threat is non-credible ex-post, and the hitchhiker's payment is causally inert ex-post.
  *   **Usual Mistake:** Treating the driver's threat as credible without explanation or assuming the hitchhiker pays out of gratitude rather than strategic necessity.

  **2. Analysis of the Device's Effect on Driver Incentives (6 Marks)**
  *   **Requirement:** Explains that the lockbox makes "Driving" a dominant strategy for the driver, removing the need for prediction regarding the drive itself.
  *   **Usual Mistake:** Claiming the lockbox forces the hitchhiker to pay, rather than recognizing it forces the *driver* to drive.

  **3. Analysis of the Hitchhiker's Response to Observability (6 Marks)**
  *   **Requirement:** Argues that once the lock is observed, the hitchhiker knows rescue is independent of payment, making non-payment the CDT-dominant move.
  *   **Usual Mistake:** Assuming the hitchhiker pays because "it's the fair thing to do" or failing to note that observability severs the causal link to rescue.

  **4. Ex-Ante vs. Ex-Post Rationality Distinction (6 Marks)**
  *   **Requirement:** Explicitly argues that the problem shifts from the hitchhiker's ex-post payment decision to the driver's ex-ante device adoption decision (the "relocation" thesis).
  *   **Usual Mistake:** Concluding the problem is "solved" simply because the hitchhiker gets saved, ignoring the loss of the fare or the driver's incentive to install the lock.

  **5. Structural Comparison with Newcomb's Problem (6 Marks)**
  *   **Requirement:** Distinguishes the mechanical causation of the lockbox from the predictive correlation of Newcomb's, while noting both require counter-preferential choice for optimal outcomes.
  *   **Usual Mistake:** Conflating the two problems as identical without noting the shift from *prediction* to *mechanical constraint*, or ignoring the comparison entirely.
