prompt: |-
  I run a self-taught game theory reading group at a community center — nine adults, no mathematics beyond arithmetic, one ninety-minute session, and next month's topic is reasoning by dominance. I worked through the material on my own rather than in a course, so please treat me as a careful amateur: no assumed terminology, but do not soften the content. Act as someone who designs both game-theory curricula and genuinely playable classroom simulations, and think the design through before writing it up — start by drafting two or three candidate payoff structures, discard the ones where the intended discovery collapses or arrives too obviously, and present only the survivor.

  The activity has to make the group run into a specific point without my naming it: a strategy that wins every head-to-head comparison against each single pure alternative, and is nonetheless strictly dominated once someone thinks to compare it against a weighted mixture of two of them. I want participants to eliminate what they can, announce that the reduction is finished, and then have the rules — not me — hand them the discovery. Please supply: the matrix, with the arithmetic showing why no pure comparison suffices and why one particular mixture does; how the nine of us are grouped and what a round consists of; a points scheme requiring no money; the precise moment mixing becomes available to them; a debrief mapping each moment of play onto the definitions; what will predictably go wrong on a first run and how to recover; and a frank statement of which feature of dominance reasoning the activity cannot reproduce and I must supply myself.

  If the timing allows, add a brief second stage in which the same reasoning is run with weak rather than strict dominance, so the group feels the order-dependence appear — and tell me whether the first stage's result is order-independent, and why that differs.
