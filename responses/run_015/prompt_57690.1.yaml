answer: |-
  ### Part 1: Design Selection (Candidate Elimination)

  To teach that a strategy can be undominated by any *pure* strategy but dominated by a *mixed* strategy, the payoff structure must satisfy specific inequalities. I drafted three candidates.

  **Candidate 1: The "Safe Middle" (3x2 Matrix)**
  *   Row A: [10, 0]
  *   Row B: [0, 10]
  *   Row C: [3, 3]
  *   *Critique:* A 50/50 mix of A and B yields [5, 5], which dominates C [3, 3]. However, the gap (5 vs 3) is large. Participants might intuitively feel C is "obviously bad" without needing the mix to prove it. It lacks tension.
  *   *Verdict:* Discard.

  **Candidate 2: The "Almost Dominant" (3x2 Matrix)**
  *   Row A: [10, 2]
  *   Row B: [2, 10]
  *   Row C: [4, 4]
  *   *Critique:* Here, A dominates C in Column 1 (10>4), and B dominates C in Column 2 (10>4). Participants will eliminate C immediately using pure strategies. The lesson fails because C is not "undominated by pure strategies."
  *   *Verdict:* Discard.

  **Candidate 3: The "Hidden Average" (The Survivor)**
  *   Row Alpha: [10, 0]
  *   Row Beta: [0, 10]
  *   Row Gamma: [4, 4]
  *   *Logic:*
      *   Gamma vs Alpha: Gamma wins if Opponent plays Right (4 > 0).
      *   Gamma vs Beta: Gamma wins if Opponent plays Left (4 > 0).
      *   Gamma is **not** dominated by Alpha or Beta individually. It looks like a "safe haven."
      *   Mix (50% Alpha, 50% Beta): Expected payoff is [5, 5].
      *   Mix vs Gamma: 5 > 4 in both cases.
      *   *Verdict:* **Select.** This structure forces the group to realize that "safety" (Gamma) is mathematically inferior to "calculated risk" (The Mix), but only if they are allowed to combine strategies.

  ---

  ### Part 2: The Activity — "The Tri-Option Market"

  **Time:** 90 Minutes
  **Participants:** 9 Adults (divided into 3 Teams of 3)
  **Math Level:** Arithmetic only (averages, comparisons).

  #### 1. The Matrix (Facilitator Reference)
  This is the game board. Player 1 chooses a Row; Player 2 chooses a Column. The number is the points Player 1 receives. (Player 2 has a symmetric matrix, but for this lesson, we focus on Player 1's reasoning).

  | | Opponent Plays **LEFT** | Opponent Plays **RIGHT** |
  | :--- | :---: | :---: |
  | **Strategy Alpha** | 10 | 0 |
  | **Strategy Beta** | 0 | 10 |
  | **Strategy Gamma** | 4 | 4 |

  **The Arithmetic of Discovery:**
  *   **Pure Comparison:** Is Gamma worse than Alpha? No (4 > 0 when Opponent plays Right). Is Gamma worse than Beta? No (4 > 0 when Opponent plays Left). *Conclusion: Gamma cannot be eliminated by comparing it to single strategies.*
  *   **Mixed Comparison:** Create a "Blend" of 50% Alpha and 50% Beta.
      *   If Opponent plays Left: (0.5 × 10) + (0.5 × 0) = **5**.
      *   If Opponent plays Right: (0.5 × 0) + (0.5 × 10) = **5**.
      *   **Comparison:** The Blend scores 5 in both cases. Gamma scores 4 in both cases. **5 > 4.**
      *   *Conclusion: Gamma is strictly dominated by the Blend.*

  #### 2. Grouping & Setup
  *   **Teams:** Divide the 9 adults into 3 Teams (Red, Blue, Green).
  *   **Seating:** Red vs Blue at the main table. Green acts as the "Auditors" (they verify scores and watch for rule-breaking). Rotate roles every 20 minutes.
  *   **Materials:**
      *   Strategy Cards (labeled Alpha, Beta, Gamma).
      *   "Blend Envelopes" (introduced in Stage 2).
      *   Score Sheets.
      *   Tokens (for points).

  #### 3. Points Scheme (No Money)
  *   **Currency:** "Community Points."
  *   **Reward:** The team with the highest average score at the end chooses the topic for the *following* month's meeting (a non-monetary but high-value social reward).
  *   **Scoring:** 1 Point = 1 Token.
  *   **Variance Control:** To ensure the math lands cleanly, we do not rely on luck. If a team plays a pure strategy, they play a round. If they play a "Blend," the Facilitator awards the *Expected Value* automatically (see Stage 2).

  #### 4. Round Structure

  **Stage 1: Pure Strategies Only (Minutes 0–40)**
  *   **Rule:** Teams must play Alpha, Beta, or Gamma. No mixing.
  *   **Play:** 5 Rounds. Red vs Blue. Green audits.
  *   **Predictable Outcome:** Teams will likely discover that Alpha and Beta are risky (0 points is painful). Gamma guarantees 4 points. Teams will converge on Gamma.
  *   **The Trap:** At the end of Stage 1, ask: "Can anyone eliminate a strategy?"
      *   They will say: "No. Alpha beats Gamma sometimes. Beta beats Gamma sometimes. Gamma is the safest."
      *   **Declare:** "Elimination phase complete. No strategies are dominated."

  **Stage 2: The "Portfolio" Rule (Minutes 40–65)**
  *   **The Rule Change:** "New market regulation: You are now allowed to submit a **Portfolio**. You may place 5 Alpha cards and 5 Beta cards into an envelope. This counts as one move."
  *   **The Mechanism:** If a team submits a Portfolio, they do not play a physical round against the opponent. Instead, the **Facilitator pays the Average.**
      *   *Why?* This removes luck. It forces the arithmetic to be the reality.
      *   **Payoff:** The Facilitator looks at the matrix, calculates the 50/50 average (5 points), and hands them 5 tokens immediately, regardless of what the opponent does.
  *   **Play:** 5 Rounds.
  *   **The Discovery:** Teams using Gamma get 4 tokens/round. Teams using the Portfolio get 5 tokens/round. The Portfolio wins *every time*, even though Alpha alone and Beta alone did not win every time.
  *   **The Realization:** Gamma, which survived Stage 1, is now eliminated.

  **Stage 3: Debrief & Mapping (Minutes 65–90)**
  *   Map the experience to theory (see below).

  ---

  ### Part 3: Facilitator Script & Mechanics

  #### The Precise Moment Mixing Becomes Available
  Do not mention mixing in the intro. In Stage 1, if a team asks, "Can we play Alpha half the time?" answer: "You must submit one card per round."
  At Minute 40, announce: *"The market has introduced financial instruments. You may now submit a sealed Portfolio. If you submit a Portfolio of Alpha and Beta, the Bank (Facilitator) will pay you the mathematical average of those two strategies, guaranteed, skipping the round."*
  This transfers the calculation from their heads to the rules. The *rules* hand them the discovery.

  #### Predictable Failures & Recovery
  1.  **Failure:** In Stage 1, a team plays Alpha and gets 0 points. They feel "punished" and refuse to consider Alpha in Stage 2.
      *   **Recovery:** Remind them: "We are looking for dominance, not winning streaks. A strategy is bad if there is *another* option that always scores higher. Look at the Portfolio score (5) vs Gamma score (4)."
  2.  **Failure:** They treat the Portfolio as "gambling" (expecting 0 or 10).
      *   **Recovery:** Enforce the "Bank Pays Average" rule strictly. If they choose the Portfolio, they *cannot* play the round. They get 5 points flat. This creates a cognitive dissonance: "How did I get 5 points without playing?" This highlights that the *value* lies in the mixture, not the play.
  3.  **Failure:** They think Gamma is better because it has no variance.
      *   **Recovery:** Ask: "Would you rather have 4 dollars for sure, or 5 dollars for sure?" The Portfolio is 5 dollars for sure (by rule).

  #### Debrief: Mapping Play to Definitions
  Gather the groups. Draw the matrix on the board.

  1.  **Strict Dominance:** "In Stage 1, could you cross out Gamma?"
      *   *Answer:* No.
      *   *Definition:* A strategy is strictly dominated if there is **another single strategy** that scores higher in every case. Alpha didn't do it. Beta didn't do it.
  2.  **Mixed Strategy:** "What was the Portfolio?"
      *   *Definition:* A weighted mixture of pure strategies. In math, we call this a 'probability distribution,' but here it was a 'bag of cards.'
  3.  **Dominance by Mixture:** "Did the Portfolio beat Gamma?"
      *   *Answer:* Yes (5 > 4).
      *   *The Lesson:* **A strategy can be undominated by any pure strategy, but still be dominated by a mixture.** This is why Game Theory requires us to consider mixtures, not just pure options.
  4.  **Order Independence (Strict Dominance):** "Does it matter if we eliminated Alpha first, or Beta first?"
      *   *Answer:* No. Strict dominance is order-independent. If Gamma is dominated by the Mix, it is dominated regardless of what else is on the board.

  ---

  ### Part 4: Limitations (Frank Statement)
  **What this activity cannot reproduce:**
  This activity demonstrates *that* mixed dominance exists, but it does not demonstrate *why* rational agents must eliminate dominated strategies.
  *   **The Missing Feature:** **Common Knowledge of Rationality.**
  *   **Explanation:** In the game, Gamma was eliminated because *I (the Facilitator)* paid a higher rate for the Mix. In the real world, no bank pays you the average. You only get the average if you play the mix many times, or if your opponent doesn't know your specific move.
  *   **Your Job:** You must explain verbally: "In real life, you don't get the average automatically. You get the average because if you randomize, your opponent cannot exploit you. We simulated the *math* of the average, but you must imagine the *psychology* of why an opponent can't beat the mix."

  ---

  ### Part 5: Optional Stage 4 (Weak Dominance & Order)
  *Only attempt if Stage 1-3 finish by Minute 75.*

  **Concept:** Weak Dominance occurs when a strategy is *at least as good* as another in all cases, and *strictly better* in at least one. (e.g., 2 vs 2, and 5 vs 3).
  **The Risk:** Eliminating weakly dominated strategies can remove potential equilibria depending on the *order* of elimination.

  **The Mini-Matrix (Handout only, do not play):**
  | | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 2 | 2 |
  | **Middle** | 2 | 1 |
  | **Bottom** | 1 | 2 |

  **Exercise:**
  1.  **Path A:** Compare Middle to Top. Middle is weakly dominated (2=2, 1<2). Eliminate Middle.
      *   Remaining: Top vs Bottom. Top dominates Bottom (2>1, 2=2). **Survivor: Top.**
  2.  **Path B:** Compare Bottom to Top. Bottom is weakly dominated (1<2, 2=2). Eliminate Bottom.
      *   Remaining: Top vs Middle. Top dominates Middle (2=2, 2>1). **Survivor: Top.**
  *(Note: Finding a small matrix where the survivor actually changes is complex for a 5-minute wrap-up. Instead, use this to illustrate the "Tie" problem.)*

  **Better Weak Dominance Example for Discussion:**
  | | Left | Right |
  | :--- | :---: | :---: |
  | **A** | 1 | 1 |
  | **B** | 1 | 0 |

  *   B is weakly dominated by A.
  *   **Question:** "If I eliminate B, I assume the opponent will never play Right (because B loses there). But what if the opponent plays Right by mistake? If they play Right, A and B tie. If they play Left, A and B tie. B is only worse if they play Right."
  *   **The Difference:**
      *   **Strict Dominance (Stage 1-3):** Order **does not matter**. If a strategy is strictly worse, it is always worse, no matter what else you remove.
      *   **Weak Dominance (Stage 4):** Order **can matter**. Removing a weakly dominated strategy might remove a "threat" that was keeping another strategy in check.
  *   **Takeaway:** "In this workshop, we focused on Strict Dominance (5 > 4). That reasoning is solid rock. Weak Dominance (5 ≥ 4) is more like sand; it works, but you must be careful about the order in which you clear the board."

  ### Final Checklist for Facilitator
  1.  **Arithmetic Check:** Ensure 5 > 4 is written visibly on the board during Stage 2.
  2.  **Rule Enforcement:** Do not allow "Mixing" in Stage 1. Do not allow "Variance" in Stage 2 (Pay the average).
  3.  **Vocabulary:** Use "Blend" or "Portfolio" first. Introduce "Mixed Strategy" only in the Debrief.
  4.  **Humility:** Acknowledge that you are learning together. "I found this result surprising when I first studied it; let's see if the rules make it clear to us."
