      *   *The Flaw:* The principle "If explained by mechanism independent of truth, then undermined" is too strong. It's the "Evolutionary Debunking" problem. We can have reliable faculties evolved for survival that also track truth (e.g., logic helps survival).
      *   *So, Premise (3) is the target.* It assumes that if the explanation *can* proceed without referencing the truth, it *does* proceed without tracking the truth. (The "Off-Track" assumption).
