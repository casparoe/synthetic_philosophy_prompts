  Dear Student,

  It is a pleasure to hear from you regarding your final project, and mapping moral status as a gradient rather than a binary switch is a sophisticated approach that will serve you well in future philosophical work. To assist you, I have constructed a taxonomy based on the three specific branching questions you requested, organizing the positions by their concrete answers to case studies rather than by school of thought or historical labels. The first branch of this tree divides positions based on whether an entity requires integrated information processing that exceeds a pure reflex arc to possess any moral status at all, using your specified contrast between a standard bimetallic thermostat and a hypothetical adaptive thermostat that updates its temperature targets over several days through a simple predictive error-correction loop. On one side of this divide are views that deny moral status to the adaptive thermostat, treating its predictive loop as insufficiently integrated to matter morally, while granting status to insects who presumably possess a higher degree of sensory integration. On the other side are views that grant the adaptive thermostat some non-zero moral weight, suggesting that even simple error-correction loops instantiate a form of goal-directedness that commands moral consideration.

  Moving down the branch where the adaptive thermostat is denied status but insects are granted it, we encounter a second split concerning whether moral weight scales continuously with the complexity of that integration or whether there is a sharp discontinuity, perhaps near the boundary between insects and mammals, below which obligations diminish drastically. If we follow the path of continuous scaling, we arrive at a position often associated with classical utilitarianism, defended by philosophers like Peter Singer, whose most awkward commitment is that a sufficiently numerous population of insects could theoretically outweigh the moral interests of a single human infant if their aggregate capacity for suffering is greater. If we instead follow the path of sharp discontinuity within this same branch, we find a position akin to species-normality views defended by Jeff McMahan, whose most awkward commitment is that a human being with severe cognitive impairments retains full moral status while a non-human animal with superior cognitive and sensory capacities retains drastically less. From either of these scaling positions, the tree splits a third time based on whether suffering that occurs only in isolated, memory-less moments without any temporal continuity linking them generates the same obligations as suffering embedded within a continuous narrative experience. If one answers that isolated moments generate the same obligations, we remain with the classical utilitarian leaf described above, but if one answers that narrative continuity is required for full weight, we arrive at a position similar to the narrative self-constitution view defended by Marya Schechtman, whose most awkward commitment is that animals and human infants who lack a robust autobiographical narrative are owed significantly less moral protection than adult humans.

  Returning to the first branch where the adaptive thermostat is granted some moral status because integrated information processing exceeding a reflex arc is not required, we again face the split between continuous scaling and sharp discontinuity. The continuous scaling path here leads to a form of panpsychism or biocentrism, such as that defended by Paul Taylor, whose most awkward commitment is that destroying a complex machine is morally analogous to harming a living organism, differing only in degree rather than kind. The sharp discontinuity path within this branch is largely unoccupied because it is logically unstable to grant status to a thermostat while positing a massive jump in value at the level of mammals without a clear justificatory principle, but if forced to name it, it would be an unnamed position whose most awkward commitment is that a thermostat has moral rights that are inexplicably dwarfed by a mouse despite the mouse having only marginally more complex information processing. Finally, applying the third split regarding temporal continuity to this branch, the view that isolated moments equal narrative moments remains consistent with the panpsychist leaf, while the view that narrative continuity matters more leads to an unnamed position whose most awkward commitment is that a thermostat with a memory log of its temperature adjustments has more moral weight than one that resets daily, implying that data retention creates moral value in non-sentient objects.

  There are logical combinations within this taxonomy that remain unoccupied, such as the specific example you mentioned of a view that grants full moral equality to the adaptive thermostat while denying it to insects. This combination is empty primarily due to incoherence, as it violates the plausible supervenience of moral status on psychological complexity, making it difficult to justify why a simple predictive loop would matter as much as or more than the rich sensory experience of an insect. Another unoccupied combination is a view that denies status to the adaptive thermostat but claims moral weight scales discontinuously below the insect level, which is unattractive because it posits a moral cliff where there is no observable change in the entity's capabilities. Regarding established positions, I must flag a limitation where classical act utilitarianism and preference utilitarianism end up giving identical answers across all three branches, as both typically require sentience for status, view weight as continuous based on capacity, and count momentary suffering equally regardless of narrative context, meaning this tree genuinely cannot separate them without a fourth branch concerning the nature of the good itself. I am moderately confident in the taxonomy I propose as a tool for organizing these concepts, but I feel least sure about the leaf describing the unnamed position where the adaptive thermostat has status but narrative continuity matters, as it is unclear whether any philosopher has seriously argued that data retention in non-sentient objects generates moral obligations distinct from their functional utility. I hope this mapping provides a sturdy scaffold for your project, and I look forward to hearing how your seminar receives these distinctions.

  Sincerely,

  Your Philosophy Mentor

  Confidence Level: Moderately Confident
  Least Sure Element: The leaf describing the unnamed position where the adaptive thermostat has status but narrative continuity matters.
