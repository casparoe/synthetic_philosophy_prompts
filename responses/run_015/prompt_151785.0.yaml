answer: |-
  **Project Title:** The Heterogeneity Problem: Internal Coherence in Lexical Threshold Negative Utilitarianism

  **Project Summary**
  This project investigates a structural vulnerability in Lexical Threshold Negative Utilitarianism (LTNU). LTNU posits that suffering holds lexical priority over well-being, such that no quantity of pleasure can justify imposing even a minimal amount of suffering. While standard objections focus on the commensurability of suffering and pleasure (inter-category comparison), this project isolates a prior, under-examined condition: the commensurability of suffering with itself (intra-category comparison). I argue that for the lexical veto to function, suffering must be treated as a unitary, cardinally measurable quantity. If suffering is heterogeneous—comprising incommensurable types such as physical pain, existential dread, and social humiliation—the rule "any suffering outweighs any pleasure" lacks a coherent trigger condition. Over three months, I will conduct a conceptual analysis to determine whether LTNU can be reformulated to accommodate heterogeneous suffering without collapsing into standard negative utilitarianism or relying on hidden cardinal assumptions.

  **Research Question**
  The central research question is: *Can Lexical Threshold Negative Utilitarianism be formulated coherently without assuming cardinal comparability within the category of suffering, and does its anti-tradeoff intuition survive that relaxation?*

  Subsidiary questions include:
  1.  Does the lexical priority rule presuppose that all instances of suffering are inter-substitutable units on a single negative scale?
  2.  If suffering is treated as a vector of heterogeneous harms rather than a scalar quantity, can a lexical threshold be defined without arbitrary stipulation?
  3.  Does abandoning intra-suffering cardinality force LTNU to abandon the lexical barrier, thereby collapsing into a aggregative negative utilitarianism where trade-offs between types of suffering become permissible?

  **Background and Gap in Existing Literature**
  The contemporary debate surrounding negative utilitarianism largely centers on the "intuition pump" of extreme trade-offs (e.g., whether torturing one person is permissible to prevent universal mild discomfort). Defenses of LTNU typically rely on establishing a discontinuity between the categories of suffering and pleasure. Proponents argue that suffering is ordinally superior to pleasure, rendering them incomparable in a way that blocks aggregation.

  However, existing treatments leave the internal structure of the "suffering" category opaque. They treat suffering as a monolithic input for the lexical function. This overlooks the problem of heterogeneous harms. If physical pain and social humiliation are not cardinally comparable (i.e., if there is no exchange rate where *x* amount of humiliation equals *y* amount of pain), then the sum total of "suffering" in a given scenario is undefined. Without a defined sum, the lexical threshold cannot be triggered consistently. Current literature addresses the barrier between suffering and pleasure but fails to address the architecture required *behind* the barrier to make it operational. This project fills that gap by shifting the critique from the boundary between value and disvalue to the internal topology of disvalue itself.

  **Methodology**
  This is a purely conceptual project executable without empirical data or archival access. The work will proceed in three phases:

  1.  **Conceptual Analysis of Lexicality:** I will formally define "lexical priority" in contexts of heterogeneous units. I will examine whether the logic of lexicality requires a single metric of measurement. If "Suffering" is a set {S1, S2, S3...} where S1 is not convertible to S2, I will analyze whether the statement "S > Pleasure" retains logical meaning. This involves testing the transitivity of the lexical relation across different harm types.
  2.  **Structural Comparison:** I will compare LTNU against non-lexical negative utilitarian frameworks that explicitly abandon the threshold. These frameworks often employ weighting systems to handle heterogeneous harms. I will analyze whether LTNU can adopt similar weighting mechanisms without dissolving the lexical barrier. If LTNU adopts weights to compare harms, it risks reintroducing the aggregative logic it seeks to avoid.
  3.  **Reconstruction of Aggregation Rules:** I will attempt to construct a model of "Vector Negative Utilitarianism." In this model, an outcome is not judged by a scalar sum of suffering but by a profile of harm types. I will test whether a lexical veto can apply to a vector (e.g., does *any* non-zero entry in the vector veto the pleasure?). I will then stress-test this model against cases of mixed suffering (e.g., mild pain + mild humiliation) to see if it yields determinate verdicts or paralysis.

  **Criteria for Success and Failure**
  **Success:** The project succeeds if I can articulate a reformulated lexical rule that preserves the absolute prohibition on trading suffering for pleasure without presupposing the internal homogeneity of suffering. A successful outcome might look like a "Multi-Threshold" model where distinct types of suffering each trigger independent lexical vetoes, or a proof that ordinal ranking within suffering is sufficient for lexical priority against pleasure.

  **Failure:** The project fails (in the sense of confirming the hypothesis) if I demonstrate that LTNU is internally incoherent without hidden cardinal assumptions. Specifically, if I show that any attempt to compare heterogeneous suffering types necessarily invokes a cardinal metric, or that avoiding such a metric renders the view unable to guide action in complex cases (collapsing into indeterminacy), the core hypothesis is supported. A secondary failure condition is demonstrating that the only way to save coherence is to abandon the lexical threshold entirely, reducing the view to standard negative utilitarianism.

  **Scope and Feasibility Assessment**
  Three months is a constrained timeline for deep meta-ethical work. To ensure completion, I must bracket several related avenues of inquiry.

  **In Scope:**
  *   The logical structure of the lexical function.
  *   The relationship between measurability and moral prohibitions.
  *   Conceptual consistency of heterogeneous harm aggregation.

  **Out of Scope (Bracketed):**
  *   **Empirical Psychology of Suffering:** I will not investigate the neuroscientific or psychological reality of pain versus dread. I will treat the heterogeneity of suffering as a philosophical premise granted for the sake of argument.
  *   **Meta-Ethical Foundations:** I will not defend the broader meta-ethical status of normative claims (e.g., moral realism vs. expressivism). The analysis assumes a cognitivist framework for the duration of the project.
  *   **Policy Application:** I will not apply the findings to specific public policy or bioethical cases, as this requires empirical data outside the project's bounds.

  **Timeline:**
  *   **Month 1:** Formalize the definitions of lexicality and heterogeneity; map the logical constraints.
  *   **Month 2:** Develop the "Vector" model and test against standard counterexamples; draft the comparison with non-lexical frameworks.
  *   **Month 3:** Finalize the argument regarding success/failure conditions; write and polish the final paper.

  This scope ensures a focused, rigorous examination of the internal logic of LTNU, delivering a definitive assessment of its coherence within the grant period.
