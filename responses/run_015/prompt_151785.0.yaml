prompt: |-
  I'm applying for a three-month solo research grant in normative ethics and need a polished two-page proposal. My half-formed idea concerns lexical threshold negative utilitarianism: the view holds that suffering has lexical priority over pleasure, so no quantity of well-being can justify even a small amount of suffering. The standard debate treats this as a problem of cross-category comparison—whether pain and pleasure are commensurable at all—but I want to press a different angle. I suspect the view faces an internal coherence problem if suffering itself is not a unitary, cardinally measurable quantity. Specifically, if physical pain, existential dread, and social humiliation are not inter-substitutable or cardinally comparable, then the lexical rule "any suffering outweighs any pleasure" may presuppose a kind of intrasuffering commensurability that its defenders rarely defend. At the same time, dropping that presupposition risks collapsing the view into an unworkable pluralism or into ordinary negative utilitarianism without the lexical barrier.

  Turn this into a proposal with: (1) a precise statement of the research question—whether lexical threshold negative utilitarianism can be formulated coherently without assuming cardinal comparability within the suffering category, and whether its anti-tradeoff intuition survives that relaxation; (2) an explanation of why existing treatments (intuition pumps about torture versus mild pleasure, or appeals to ordinal ranking) leave this specific problem open; (3) the method—conceptual analysis of what "lexical priority" means when units are not interchangeable, a structured comparison with non-lexical negative utilitarian frameworks that abandon the threshold, and an examination of whether aggregation rules for heterogeneous suffering can be reconstructed without cardinal measurement; (4) a clear account of success (a reformulated lexical rule that preserves the absolute prohibition on trading suffering for pleasure without presupposing internal homogeneity of suffering) and failure (the view either requires hidden cardinal assumptions or collapses into standard negative utilitarianism); and (5) an honest scope assessment for three months of independent work, including what part is too big and must be bracketed. Do not include a bibliography, citation list, or requests for specific readings—I'll supply references myself. The proposal should read as a plan for conceptual work that can be executed without empirical data or archival access.
