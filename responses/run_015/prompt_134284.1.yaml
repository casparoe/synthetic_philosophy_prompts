answer: |-
  The control room at the Lower Avon Water Treatment Works smelled of ozone and stale coffee. On the north wall hung the Catchment Status Board. It was a grid of white squares, each labelled with a station code stencilled in black. There were no numbers on the board. There were no sentences. There were only the blue drops.

  Each blue drop represented a fixed unit of turbidity or chemical concentration, depending on the row. If a sample came back with five units of contaminant, five blue drop stickers were placed in the square. If it came back with two, two drops were placed. The system was designed to be read by anyone, regardless of language. The shift workers, the engineers, and the visiting inspectors could all look at the wall and see the river's health at a glance. Quantity was shown by repetition. A cluster of drops was heavy; a single drop was light.

  Elias stood before the board with a mug in his hand. It was 07:00 on a Tuesday. Yesterday afternoon, a transport truck had jackknifed on the A-road bridging the upper catchment. The manifest listed industrial solvents. The river flowed down from that bridge to the intake pipes of the treatment works. If the solvent had breached the containment, it would be here soon.

  The field team had deployed at dawn. They had taken samples at Stations Four, Five, and Six, the triangulation points between the bridge and the works. Elias waited for the stickers.

  Sarah, the field coordinator, arrived at 08:30. She did not come into the control room; she sent the data packet up via the internal post. Elias opened it. He took the sheet of pre-printed blue drops and walked to the board.

  Station Four was blank. Station Five was blank. Station Six was blank.

  Elias stepped back. The white squares stared at him. In the logic of the board, a blank square meant zero. There were no drops, so there was no contaminant. The river was clean. He could keep the intake open, saving the facility the cost of switching to the reservoir supply. It was a significant saving. But he did not pick up the phone to authorise the switch.

  He looked at the blank squares again. There was a difference between a river that was clean and a river that was untested. There was also a difference between a river that was clean and a river where the contaminant was present but too faint for the spectrometer to catch. The detection limit was a hard floor. Below that floor, the machine saw nothing. The board showed nothing.

  The blank square could mean three things. It could mean the water was pure. It could mean the sampler had missed the spot. It could mean the poison was there, but hiding below the sightline of the instrument. To the eye, they were identical. The picture language had no word for 'nothing found' that was distinct from 'nothing there'.

  Elias called Sarah.

  "The board is empty," he said.

  "We sent the samples," Sarah said. "The lab processed them."

  "Station Four is blank."

  "The reading was below the limit."

  "And Station Five?"

  "Same."

  "And Station Six?"

  "Sampler missed the window. No sample taken."

  Elias looked at the wall. Station Five and Station Six looked exactly the same. The white square held no distinction. The system relied on the presence of marks to convey truth. The absence of marks conveyed nothing, yet it was being asked to carry the weight of a decision. If he switched to the reservoir based on this, he might be wasting money on a false negative. If he stayed on the river, he might be pumping solvents into the town.

  "The board doesn't show the difference," Elias said.

  "It shows zero drops," Sarah replied. "That's the system."

  "It shows zero drops for clean water. It shows zero drops for missing data. It shows zero drops for below detection. They are not the same thing."

  There was a silence on the line. The hum of the ventilation system filled the gap. They were both trained to trust the data, but the data here was a silence that spoke too many languages.

  "We need a mark for below limit," Elias said.

  "That's not a picture," Sarah said. "What do you draw for 'below limit'? It's not a thing."

  "A dot. A small black dot in the corner."

  "That's not a picture of anything. It's a convention."

  "It's a repair," Elias said. "The ship is leaking."

  "If we add a dot, everyone has to be taught what it means. It stops being universal. It becomes a word."

  "It's already a word," Elias said. "We just pretended it was a picture."

  He could hear her sigh. She knew he was right. The ISOTYPE system promised unity through visuals, but it had hit the wall of negation. You can picture a thing. You can picture five things. You cannot picture the absence of a thing without confusing it with the absence of a picture.

  "Send up a sheet of dots," Sarah said finally. "I'll draft the memo. We'll have to run a training session for the new shifters."

  "It'll take an hour."

  "It'll take as long as it takes. Just don't leave the squares blank next time."

  Elias hung up. He took a black marker and drew a small dot in the bottom right corner of Station Five. He left Station Six blank. He left Station Four with a dot. Now the wall told a different story. Station Six was unknown. Station Four and Five were tested and clean within the limits of the method.

  It was not elegant. The dot did not resemble safety. It did not resemble a limit. It was a arbitrary sign agreed upon by two people over a telephone. It functioned exactly like a word, dependent entirely on shared agreement rather than visual resemblance. The picture language had not replaced the need for convention; it had merely delayed it.

  Elias picked up the phone to authorise the reservoir switch. It was safer to assume the unknown at Station Six might be contaminated. The cost would be logged. The board was repaired for another day. He looked at the dot. It was small, ugly, and necessary. It was not a foundation. It was a plank nailed into a hull that was still moving.

  He turned off the lights in the control room and went to log the decision. The river flowed on, indifferent to the signs they stuck on the wall to describe it.

  ***

  **Note**

  The story leans on your summary of Neurath's anti-foundationalism (the ship metaphor) and the claim that ISOTYPE was a 'helping language' rather than a perfect notation. I am confident characterising Neurath as an anti-foundationalist; his 'boat' analogy is well-documented. However, I am less confident regarding the specific limitation of 'blankness'. Historical ISOTYPE charts often used legends or keys to define units, which might have mitigated this ambiguity through accompanying text, though the core visual ambiguity remains. I have taken the liberty of assuming practitioners lacked a convention for 'below detection' to dramatisethe problem, whereas real-world scientific visualisation usually mandates specific symbols for non-detects. The point about which I am least confident is whether Neurath explicitly addressed the 'zero vs. null' distinction in his writings; I have inferred this limitation from the structural logic of pictograms rather than a specific textual citation, as requested.
