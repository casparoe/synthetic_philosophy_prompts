answer: |-
  **Handout for the Reading Group: Disambiguating "When in Rome"**

  **Context:** The proverb "When in Rome, do as the Romans do" was deployed to settle a dispute regarding a visitor's obligation to conform to the stricter norms of a host culture. The following menu disambiguates the distinct philosophical claims hidden within the proverb, ordered by the strength of the obligation they impose.

  ---

  ### I. The Menu of Claims

  **1. The Prudential Compliance Reading**
  *   **Claim:** Local norms are enforced by sanctions (social, professional, or legal). Non-conformity increases the cost of your stay.
  *   **Status:** **Platitude.** This is a factual prediction about cause and effect, not a normative claim.
  *   **Type of Reason:** Purely **Prudential**.
  *   **Verdict:** True, but insufficient to support the colleague's conclusion. It explains why one *might* conform, not why one *ought* to conform morally. It advises caution, not obedience.

  **2. The Semantic Coordination Reading**
  *   **Claim:** Actions derive their meaning from local conventions. A gesture of "informality" here may signify "contempt" there. To act without conforming is to fail to communicate your intended meaning.
  *   **Status:** **Substantive and Defensible.** This draws on Wittgensteinian or Gricean insights about convention.
  *   **Type of Reason:** **Instrumental/Communicative.**
  *   **Verdict:** Strong. If the visitor intends to be a colleague, she must use the local "language" of professional conduct. However, this only obligates her if she wishes to be understood correctly; it does not obligate her to adopt the local values, only the local signs.

  **3. The Epistemic Deference Reading**
  *   **Claim:** Locals possess superior knowledge regarding the consequences of actions within their specific ecological and institutional context.
  *   **Status:** **Defensible but Limited.**
  *   **Type of Reason:** **Epistemic.**
  *   **Type of Obligation:** A weak presumption, not a binding duty.
  *   **Verdict:** Plausible for safety or etiquette, but weak for core professional or moral conduct. It assumes the visitor is ignorant. If the visitor judges the norm to be counter-productive to inquiry (e.g., silencing dissent), she may claim superior epistemic access regarding the norms of *science*, overriding local epistemic authority regarding *custom*.

  **4. The Expressive Respect Reading**
  *   **Claim:** Conformity is a performative gesture of respect owed to a host community by a guest. To deviate is to express disdain for the host's way of life.
  *   **Status:** **Contentious.**
  *   **Type of Reason:** **Relational/Moral.**
  *   **Type of Obligation:** A **Pro Tanto Duty** (binding unless overridden by stronger duties).
  *   **Verdict:** This generates a genuine moral obligation, but it is limited to *expressive* acts (dress, address) rather than *constitutive* acts (asserting truth, ethical judgment). It supports conformity in dress, but arguably not in silence regarding falsehoods.

  **5. The Normative Authority Reading**
  *   **Claim:** The local normative order possesses legitimate authority over conduct within its bounds. Presence within the territory entails a duty of obedience to its norms, irrespective of their content.
  *   **Status:** **Radical/Political.**
  *   **Type of Reason:** **Deontic/Political Obligation.**
  *   **Type of Obligation:** **Strong Obligation.**
  *   **Verdict:** This is the only reading that supports the colleague's "closing the matter" tone. However, it is politically contentious. It asserts that territorial presence overrides individual moral judgment. In political philosophy, this is the claim of sovereignty; it is not a trivial truth, but a contested theory of legitimacy.

  ---

  ### II. The Three Complications

  **1. The Self-Application Problem (The "Loose Rome")**
  *   **The Issue:** If the local norm is *tolerance of deviance*, does the proverb require you to be deviant?
  *   **Analysis:** This is not a fatal instability, but it reveals a parameter. The proverb applies to **salient** norms. In "tight" cultures, the salient norm is *restriction*; in "loose" cultures, the salient norm is *permission*.
  *   **Verdict:** The proverb holds reflexively. In a loose culture, "doing as the Romans do" means exercising your freedom to deviate. The instability arises only if one assumes the proverb is a command for *strictness* rather than a command for *alignment*.

  **2. The "Which Rome?" Problem (Internal Division)**
  *   **The Issue:** Societies are not monolithic. Whose norms count?
  *   **Analysis:** There is a structural asymmetry. **Strict norms are enforced; loose norms are permitted.** Deviance offends the strict (active harm); conformity barely registers with the permissive (passive acceptance). Therefore, the "Rome" that matters is defined by those with the power to sanction.
  *   **Verdict:** The proverb functionally biases toward the **strictest available reading** because the cost of ignoring the strict subgroup is higher than the benefit of pleasing the loose subgroup. It privileges the "veto players" of the culture.

  **3. The Abhorrent Rome Problem (Injustice)**
  *   **The Issue:** What if the norm requires complicity in injustice (e.g., silencing truth, demeaning gender roles)?
  *   **Analysis:** Readings 1 (Prudential) and 5 (Authority) survive here, but at a moral cost. Reading 1 admits you should comply to avoid punishment even if the rule is evil (might makes right). Reading 5 claims you have a duty to obey even evil local laws. Readings 2, 3, and 4 collapse, as one cannot coordinate meaning, defer epistemically, or express respect for a norm one judges to be fundamentally unjust.
  *   **Verdict:** The proverb's plausibility in ordinary cases relies on a suppressed **ceteris paribus clause**: "provided Rome is not abhorrent." Without this clause, the proverb demands moral surrender. With it, the proverb cannot be used to shut down debate about the justice of the norm itself.

  ---

  ### III. Diagnostic Conclusion

  **Which reading is being deployed to end the argument?**
  When the proverb is used as a conversation-stopper in this context, the speaker is typically executing a **modal slide**:
  1.  They begin with the **Prudential Compliance Reading** (Fact: "You will get in trouble if you don't").
  2.  They conclude with the **Normative Authority Reading** (Conclusion: "Therefore, you are required to conform").

  **Is this defensible?**
  **No.** This is a variant of the is-ought fallacy. The fact that sanctions exist (Prudential) does not automatically generate a moral obligation to obey (Authority), nor does it settle whether the visitor *should* risk the sanctions for the sake of a higher principle (e.g., academic freedom or truth-telling).

  **Recommendation for the Group:**
  The colleague planning the visit is operating under a **Universalist** framework (academic norms of truth-seeking transcend borders). The colleague invoking the proverb is operating under a **Particularist** framework (norms are local and binding). The proverb masks this conflict by pretending the Particularist claim is a trivial truth. To resolve the impasse, the group must decide whether academic norms constitute a "Rome" of their own that travels with the scholar, or whether the scholar enters the "Rome" of the host institution entirely.

  **Suggested Question for the Group:**
  *"Are we agreeing that she should conform to avoid harm (Prudential), or are we agreeing that she would be wrong to resist (Moral)? If the latter, on what basis does the local norm override the universal norm of truth-seeking?"*
