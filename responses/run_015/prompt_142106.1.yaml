  ### Seminar Notes: Symmetric Death in Damascus and Deliberational Stability

  #### 1. Formalization Brainstorming
  To model Symmetric Death in Damascus, we might consider: (1) a **standard normal-form game matrix** where Death's move is a state correlated with the Agent's move; (2) a **Bayesian network** where a "Prediction" node causally influences "Death's Location" and is correlated with "Agent's Action"; or (3) a **deliberational dynamics model** (à la Skyrms or Arntzenius) where the agent's credence in acting serves as evidence for the state of the world during the deliberation process.

  **Adopted Formalization:** I will adopt the **deliberational dynamics formalization**. This is the most defensible for this specific seminar topic because the "Damascus flip" is inherently a phenomenon of *unstable deliberation*, not just static expected utility calculation. We define the agent's credence function $C_t(A)$ at time $t$ during deliberation. The expected utility of an action depends on the probability of Death's location conditional on that credence, capturing the feedback loop described in the prompt.

  *   **Actions:** $A \in \{Stay, Flee\}$.
  *   **States:** $S \in \{Damascus, Aleppo\}$ (Location of Death).
  *   **Constraint:** $S = A$ (Perfect Prediction).
  *   **Utility:** $U(A, S) = 1$ if $A \neq S$ (Life), $0$ if $A = S$ (Death).
  *   **Deliberational Link:** $P_t(S = Damascus) \approx C_t(Stay)$. (The agent takes their current inclination as evidence of the prediction).

  ---

  #### 2. Comparative Analysis: EDT vs. CDT

  **Evidential Decision Theory (EDT)**
  *   **Does the Damascus Flip Arise?** **Yes.** Under EDT, the agent treats their own action (or inclination to act) as diagnostic evidence of the state. During deliberation, if the agent's credence in staying ($C(Stay)$) rises, the conditional probability $P(Death=Damascus | Stay)$ approaches 1. Consequently, the expected utility of staying drops toward 0 (Death). Conversely, if $C(Stay)$ falls, the agent infers Death is likely in Aleppo, making Stay look lifesaving (Utility $\approx$ 1). This creates a negative feedback loop: any movement toward one option makes it less attractive, pushing the agent toward the other, which then becomes unattractive.
  *   **Recommendation:** **No stable recommendation.** EDT fails to converge on a pure strategy. It also fails to converge on a mixed strategy in the standard deliberational model, because as soon as the agent settles on a probability distribution (e.g., 50/50), that distribution becomes evidence of Death's location, destabilizing the utilities. The theory results in **deliberational paralysis**.
  *   **Plausibility:** **Low.** While EDT correctly identifies the fatalistic correlation (you likely die either way), a decision theory that renders rational deliberation impossible is pragmatically self-defeating. It violates the principle that rational agents should be able to form an intention to act.

  **Causal Decision Theory (CDT)**
  *   **Does the Damascus Flip Arise?** **No.** CDT evaluates actions based on their causal consequences, screening off the action from the prior prediction. The probability of Death's location is treated as a fixed prior (e.g., $P(Death=Damascus) = 0.5$ by symmetry) independent of the agent's current credence or action. Therefore, the expected utility of Stay remains constant throughout deliberation ($0.5 \times 0 + 0.5 \times 1 = 0.5$).
  *   **Recommendation:** **Stable indifference (or mixed permission).** Since $EU_{causal}(Stay) = EU_{causal}(Flee)$, CDT issues a stable verdict that both actions are permissible. It does not force a cycle. While it cannot guarantee survival (given the setup), it allows the agent to terminate deliberation and act.
  *   **Plausibility:** **Higher.** CDT preserves the autonomy of the agent. It correctly recognizes that the agent cannot *causally influence* where Death went yesterday. While CDT's estimate of survival chance (50%) is arguably optimistic given the perfect prediction constraint, its guidance allows for agency. In a situation where you are doomed regardless, a theory that permits you to choose how to face doom is preferable to one that forbids choice.

  **Verdict:** **CDT provides the more plausible guidance.** The primary function of a decision theory is to guide action. EDT's instability makes action impossible, whereas CDT's stability allows the agent to act, even if the outcome is predetermined. CDT respects the causal structure (the past is fixed) better than EDT, which conflates correlation with control.

  ---

  #### 3. Epistemic Practice: What Would Change My Mind?

  To model good epistemic practice, I must identify where my defense of CDT is vulnerable and what arguments could invert my verdict.

  **Arguments for the Opposite Verdict (Favoring EDT):**
  1.  **The "Tickle" Defense (Introspective Screening):** My analysis assumes the agent must use their action as evidence. If the agent has introspective access to the *causes* of their action (a "tickle" or inclination) distinct from the action itself, EDT can screen off the correlation. If the agent knows *why* they are inclined to stay (e.g., a desire for comfort) and knows that Death predicts the *action* not the *desire*, EDT might stabilize. If a refined EDT (like Arntzenius's "No Regrets" approach) can solve the instability while retaining the correct fatalistic probability assessment ($EU=0$), it would be superior to CDT's "optimistic" error ($EU=0.5$).
  2.  **Logical vs. Causal Connection:** If the prediction is based on *logical* necessity (e.g., the agent and Death are running the same algorithm) rather than causal history, CDT's separation of state and action is metaphysically suspect. In a Newcombian context, the "states" are not causally independent. If the link is logical, CDT's calculation is fundamentally flawed, and EDT's fatalism is the only honest assessment of the situation.

  **Where My Reasoning Is Most Likely to Fail:**
  *   **The No-Cost Idealization:** I have assumed the trip has no cost. If there is even a minute cost to fleeing (e.g., effort), CDT's indifference breaks. CDT would recommend staying (saving effort) based on the 0.5 survival prior. EDT would still recommend staying (or paralysis) based on 0 survival. If the agent *knows* they will die, paying a cost to flee is irrational. CDT might recommend a costly action that yields no benefit because it ignores the predictive correlation in the payoff calculation. This would make CDT look practically irrational ("Why ain'cha rich?" applied to survival).
  *   **Deliberational Dynamics Assumptions:** My claim that EDT *must* cycle relies on a specific model of how credence updates evidence. If one adopts a "fixed-point" view where the agent knows their own final decision *before* they make it (self-knowledge), the deliberation collapses instantly to the fatalistic conclusion without the flip. If EDT can be formalized to allow immediate convergence to the fatalistic truth without cycling, its "honesty" about the survival probability might outweigh CDT's "stability."

  **Conclusion for Seminar:** While CDT is currently the more robust tool for preserving deliberational stability, the Symmetric Death case remains a stress test. The theory that best handles the *epistemic access* the agent has to their own future actions (the "tickle" or self-prediction) will likely determine the ultimate winner between these frameworks.
