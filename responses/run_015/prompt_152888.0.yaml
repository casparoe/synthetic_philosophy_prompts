answer: |-
  **Project Title:** The Semantics of Complicity: Speech-Act Theory and the Ethics of Strategic Voting Under Deontological Constraints

  **1. Research Question and Literature Gap**

  The central research question of this project is: *Can a voter strategically select a morally compromised candidate without thereby expressing assent to that candidate's rights-violating policies, or does the conventional structure of the ballot render such selection an act of symbolic complicity?*

  Existing literature in the ethics of voting generally bifurcates justifications into two camps: instrumental (consequentialist) and expressive. Instrumental accounts justify "lesser evil" voting solely by reference to outcomes—preventing a worse candidate from winning. Expressive accounts justify voting by reference to the integrity of the agent—casting a ballot that aligns with one's genuine values. Currently, these frameworks treat the tension between them as a choice of motivation: one either votes for the outcome one desires or the candidate one endorses.

  However, this binary leaves a critical conceptual gap unresolved. It fails to account for cases where a voter attempts to utilize the expressive mechanism itself to justify a strategic choice. Specifically, when a viable candidate advocates policies that violate deontological constraints (e.g., treating persons merely as means), standard expressive theory suggests abstention or voting for a non-viable third party to maintain moral cleanliness. Conversely, instrumental theory dismisses the expressive harm entirely. Neither framework adequately analyzes the *semantic content* of the vote itself in this context. If voting is a communicative act, does the private intent to prevent a greater evil alter the public meaning of the mark on the ballot? Existing models lack the tools to determine whether the ballot functions as a literal endorsement of a platform or a contextual preference ranking. This project addresses this gap by interrogating whether the expressive value of voting can be decoupled from the policy platform of the selected candidate through specific communicative conventions.

  **2. Methodological Approach**

  This project employs a conceptual methodology grounded in speech-act theory and moral complicity analysis, diverging from standard consequentialist or rights-based frameworks.

  First, I will analyze ballot-casting as an illocutionary act. Rather than viewing the vote merely as a causal input into an aggregation mechanism (the instrumental view) or a pure manifestation of internal preference (the standard expressive view), I will treat it as a speech act governed by social conventions. The analysis will focus on the "felicity conditions" of voting: What does the political convention stipulate a vote *means*? Does the convention interpret a vote as "I endorse all policies of Candidate X" or "I prefer Candidate X to the available alternatives"? This distinction is crucial for determining whether a voter can exploit contextual nuances to limit the scope of their endorsement.

  Second, I will integrate an account of moral complicity that distinguishes between causal contribution and symbolic association. Consequentialist analyses focus almost exclusively on causal contribution (marginal impact on the election result). Rights-based analyses often focus on the intrinsic wrong of supporting a rights-violator. My approach will isolate *symbolic complicity*: the moral cost incurred by appearing to endorse a wrongful act, regardless of causal impact. By separating the causal efficacy of the vote from its symbolic resonance, I can evaluate whether a voter's private intent (to prevent a greater evil) is sufficient to sever the link between the act of voting and the expression of endorsement.

  This approach is preferable to standard analyses because it captures the phenomenological reality of the voter's dilemma. Consequentialism ignores the agent's sense of moral stain when supporting a rights-violator; pure expressive theory ignores the moral urgency of preventing catastrophic outcomes. A speech-act/complicity framework allows for a normative evaluation that respects both the communicative nature of democratic participation and the deontological constraints on moral agency.

  **3. Conditions for Success and Failure**

  A successful result for this project will be the formulation of a "Qualified Expressive Framework." This framework would specify the conditions under which strategic voting for a morally compromised candidate is expressively permissible. Success looks like a coherent argument that the conventional meaning of a ballot allows for "contextual endorsement"—where the voter expresses support for the candidate *relative to the specific threat posed by the alternative*, without endorsing the candidate's deontological violations. This would require identifying specific communicative mechanisms (e.g., public disclaimers, the structure of the ballot, or established political norms) that successfully transmit the voter's qualifying intent to the public sphere.

  Failure would take one of two forms. First, the project would fail if the speech-act analysis demonstrates that the convention of voting is semantically rigid—meaning a vote *necessarily* signifies full platform endorsement regardless of intent. In this case, the framework would collapse into a deontological prohibition against lesser-evil voting, offering no resolution to the tension. Second, the project would fail if the distinction between symbolic association and causal contribution proves untenable, causing the analysis to collapse back into outcome-based reasoning. If it turns out that symbolic complicity is entirely dependent on the probability of affecting the outcome, the speech-act methodology would have added no normative value over standard instrumentalism.

  **4. Scope and Feasibility Assessment**

  This project is designed as a one-year conceptual inquiry requiring no empirical data collection, institutional review board approval, or travel. The scope is tightly focused on the intersection of speech-act theory and normative democratic theory, avoiding broader questions of electoral system design or empirical voter behavior.

  *   **Months 1–3:** Refinement of the speech-act model. I will draft the foundational argument regarding the illocutionary force of ballot-casting, defining the relevant conventions and distinguishing between literal and contextual meaning in political signaling.
  *   **Months 4–6:** Development of the complicity distinction. I will construct the moral argument separating causal from symbolic responsibility, applying it to hypothetical cases involving deontological constraints.
  *   **Months 7–9:** Synthesis and objection handling. I will integrate the two strands into the Qualified Expressive Framework and test it against standard objections from both consequentialist and absolutist perspectives.
  *   **Months 10–12:** Revision and dissemination. The final quarter will be dedicated to polishing the dissertation chapter and preparing a journal article derived from the core argument.

  The primary risk lies in the potential complexity of speech-act theory, which could divert attention from the normative political questions. To mitigate this, I will restrict the linguistic analysis to only those elements necessary to resolve the ethical problem of complicity. Given the purely philosophical nature of the work, the timeline is realistic for producing a substantial dissertation chapter and at least one publishable article within the fellowship year.
