      *   *The Mechanism:* Speech-act theory. Voting isn't just causing an outcome (causal); it's saying something (symbolic).
      *   *The Complicity:* If I vote for Candidate X to stop Candidate Y, but Candidate X supports Policy Z (which is deontologically forbidden), does my vote *say* "I support Policy Z"?
