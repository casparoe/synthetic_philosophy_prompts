prompt: |-
  Writing a seminar paper on Darwin on morality and religion and I've built an argument that eats itself, and I can't see where to cut.

  (1) Darwin's own worry from the notebooks, roughly: the human mind was developed from the mind of lower animals, so why trust its convictions — would anyone trust the convictions of a monkey's mind?
  (2) Generalize it into a test I made up, call it the swap test: take a faculty shaped by selection, hold the faculty fixed, swap out the content it delivers; if the survival-and-reproduction story explains why the creature has it just as well after the swap, then the content isn't tracking anything and the conviction is debunked.
  (3) Morality fails the test. Swap "care for kin and reciprocators" for "care for the whole band," or take Darwin's own aside that young women reared under hive-bee conditions would count it a sacred duty to kill their brothers — the fitness story survives the swap untouched. (I think his account of conscience — social instinct plus memory plus comparing past and present motives — already gets you here without the test, but not sure.)
  (4) Religion fails the same way: the content of the unseen agents swings wildly across cultures while the cohesion story survives every swap.
  (5) But (2) draws no line at morality and religion. Darwin's own theorizing is delivered by faculties selected for surviving, not for being true.
  (6) And descriptive belief fails the test too — I can't see why a creature couldn't do perfectly well with a bundle of false but action-guiding representations, so long as they steer it right.
  (7) So (2) debunks science and inference, and steps (1) through (6) along with them. Not acceptable.

  I'd much rather keep (3) and (4) than keep (5) and (6) — the paper is supposed to be about how Darwinian genealogy deflates morality and religion specifically. So which step do I drop, why did it look fine when I wrote it down, and what does dropping it do to (3) and (4)? Is there a version of the swap test with teeth in the moral and religious cases and none in the scientific one, or is any such version special pleading? My supervisor mutters something about the only honest options being a pre-established harmony between selection and the moral facts or nothing, and I don't know what she means by that.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Problem:**
      *   **Topic:** Darwin on morality and religion.
      *   **Core Argument:** A genealogical debunking argument based on evolutionary selection.
      *   **The "Self-Eating" Issue:** The argument (specifically the "Swap Test") is too powerful. It debunks morality and religion (steps 3 & 4), but it also debunks science, inference, and the argument itself (steps 5, 6, & 7). This leads to global skepticism, which undermines the paper's specific aim.
      *   **Goal:** Keep the debunking of morality/religion (3 & 4) without debunking science/reasoning (5 & 6).
      *   **Specific Questions:** Which step to drop? Why did it look fine? What happens to (3) and (4) if dropped? Is there a non-question-begging version of the test? What does the supervisor mean by "pre-established harmony"?

  2.  **Deconstruct the Argument Steps:**
      *   (1) Darwin's Notebook Worry: Evolutionary origins of mind cast doubt on trustworthiness.
      *   (2) The "Swap Test": If selection explains the *faculty* regardless of the *content*, the content isn't tracking truth.
      *   (3) Morality fails the test (content is arbitrary relative to fitness).
      *   (4) Religion fails the test (content is arbitrary relative to cohesion/fitness).
      *   (5) Science/Reasoning also uses selected faculties.
      *   (6) Descriptive belief also fails the test (false beliefs can guide action successfully).
      *   (7) Conclusion: Global skepticism (argument self-destructs).

  3.  **Identify the Weak Link:**
      *   The problem lies in the formulation of the **Swap Test (2)** and its application to **Descriptive Belief (6)**.
      *   Step (6) is the critical pivot. If descriptive beliefs (e.g., "There is a tiger behind that bush") can be systematically false yet fitness-enhancing, then *no* belief is safe.
      *   However, most evolutionary epistemologists argue that for *physical* navigation and prediction, truth *is* fitness-conducive. If I believe "no tiger" when there *is* a tiger, I get eaten. False descriptive beliefs usually lead to maladaptive behavior in the physical world.
      *   Morality and Religion are different. Believing "Kill your brothers" vs. "Save your brothers" can *both* be fitness-conducive depending on the social structure (hive bee vs. mammals). The *truth value* of the moral claim doesn't causally impact survival in the same way physical facts do.
      *   *Diagnosis:* Step (6) is the culprit. It asserts that false descriptive representations work just as well as true ones. This is generally considered false in evolutionary psychology/epistemology regarding the physical environment.

  4.  **Evaluate the "Swap Test" (2):**
      *   The test as stated is too broad. "If the survival story explains the creature having the faculty just as well after the swap..."
      *   For physics/logic: You *can't* swap the content easily without breaking the survival story. If I swap "fire burns" for "fire cools," I die. The survival story *depends* on the specific content tracking reality.
      *   For morality/religion: You *can* swap the content. "Don't kill kin" vs. "Kill kin (for the hive)" both work in specific contexts. The survival story is indifferent to the *truth* of the moral proposition, only the *behavior*.
      *   *Fix:* Refine the test to distinguish between **mind-to-world direction of fit** (descriptive) and **world-to-mind direction of fit** (prescriptive/social coordination).

  5.  **Address the Supervisor's Comment:**
      *   "Pre-established harmony between selection and the moral facts or nothing."
      *   This refers to the **Evolutionary Debunking Argument (EDA)** literature (Street, Joyce, Vavova).
      *   *The Dilemma:* If moral facts exist independently (Realism), and evolution shaped our morals for fitness, why do they align?
          *   Option A: They align by chance (unlikely).
          *   Option B: Evolution tracks the moral facts (requires a mechanism linking fitness to moral truth).
          *   Option C: There are no independent moral facts (Anti-Realism/Constructivism).
      *   The supervisor is suggesting that unless you argue evolution *tracks* moral truth (harmony), you must accept skepticism (nothing). The user wants to argue for skepticism about morals but *not* science. This requires showing why science *does* have that harmony (or tracking) and morals *don't*.

  6.  **Develop the Solution:**
      *   **Drop/Modify Step (6).** This is the easiest cut. Argue that descriptive beliefs *do* track truth because false physical beliefs are generally maladaptive (Plantinga's argument vs. standard evolutionary epistemology).
      *   **Refine Step (2).** Make the Swap Test sensitive to *causal dependence*. In science/perception, content is causally constrained by the environment. In morality/religion, content is constrained by social utility, not independent facts.
      *   **Re-evaluate Step (5).** Acknowledge the worry but contain it. Evolution selected for *basic* logic/perception, which science refines. Morality is fundamentally different in kind (prescriptive vs. descriptive).

  7.  **Drafting the Response:**
      *   **Validate:** Acknowledge this is a classic problem (The Evolutionary Argument Against Naturalism / Global Debunking).
      *   **Identify the Cut:** Step (6) is the weak link. It claims false descriptive beliefs are fitness-neutral. This is empirically dubious.
      *   **Explain Why:** Distinguish between *pragmatic success* and *truth tracking*. In the physical world, they converge. In the social/moral world, they diverge.
      *   **Refine the Test:** Introduce the "Independence Constraint." Does the content depend on an external reality or internal coherence?
      *   **Address the Supervisor:** Explain the "Tracking" vs. "Off-Track" distinction. Science tracks physical reality (fitness requires truth). Morality tracks social cohesion (fitness requires conformity, not necessarily truth).
      *   **Structure:**
          1.  Diagnose the self-defeat (Step 6).
          2.  Propose the fix (Distinguish Descriptive vs. Prescriptive).
          3.  Explain the Supervisor's comment (The Dilemma).
          4.  Provide a revised argument structure.

  8.  **Refining the "Swap Test" Logic:**
      *   *Current:* Swap content -> Survival story holds -> Content debunked.
      *   *Problem:* Survival story *doesn't* hold for descriptive swaps (Fire burns vs. Fire cools).
      *   *Fix:* The test only applies where the *function* of the belief is coordination, not navigation.
      *   *Terminology:* Use "Adaptive Link" vs. "Truth Tracking."

  9.  **Final Polish:** Ensure the tone is academic but helpful. Make sure to explicitly answer "Which step do I drop?" (Step 6, or rather, restrict its scope). Make sure to explain *why* it looked fine (Plantinga's influence/Pragmatism).

  **(Self-Correction during drafting):** Wait, simply dropping (6) might look like special pleading. I need to explain *why* descriptive beliefs are different structurally. It's not just "I say so." It's about the causal mechanism. Perception has a causal chain from object to brain. Moral intuition has a causal chain from social pressure to brain. The "Swap Test" works where the causal chain doesn't require the *truth* of the proposition, only the *utility* of the behavior.
  *   *Example:* Believing "God watches me" causes good behavior (fitness). Whether God exists is irrelevant to the fitness outcome.
  *   *Example:* Believing "Cliff edge is dangerous" causes avoidance. Whether the cliff is dangerous is *directly relevant* to the fitness outcome.
  *   *Key Distinction:* **Causal Independence of Truth.** In morality/religion, the fitness benefit is independent of the truth value. In physics, it is dependent.

  10. **Finalizing the Advice:**
      *   Cut/Restrict (6).
      *   Modify (2) to include a "Truth-Dependence Condition."
      *   Explain Supervisor's "Pre-established Harmony" as the requirement to show evolution tracks truth in science but not morals.

