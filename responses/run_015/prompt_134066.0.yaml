answer: |-
  The cluster of practices you describe presupposes an implicit political theory I shall term **Sovereign Presentism**. This theory rests on three axioms: (1) the *demos* (citizen body) is the sole ontological source of legal and moral truth at the moment of voting; (2) political judgment is a universal competence distinct from technical expertise; and (3) responsibility is asymmetrical, diffusing across the collective for decisions but concentrating on the individual for outcomes.

  Below is the reconstruction of these commitments, the distinction between necessary and contingent features, the evaluation of rival accounts, and the conditions under which this assessment would be overturned.

  ### 1. Implicit Theory of Knowledge, Authority, and Responsibility

  **Collective Knowledge (Epistemic Aggregation):**
  The Athenian practice presupposes that while technical skills (shipbuilding, generalship) are specialized, *political* wisdom is distributable. The rejection of Nicias' warnings regarding Sicily and the acceptance of Cleon's initial argument at Mytilene rely on the view that the aggregate judgment of the many outweighs the expertise of the few. However, the Mytilene reversal reveals a nuance: this collective knowledge is not static truth but a *process*. The *demos* does not discover pre-existing justice; it constitutes it through deliberation. Therefore, the "error" of the first Mytilene vote was not a violation of external law, but a failure of internal deliberation corrected by further speech.

  **Moral Authority (Temporal Sovereignty):**
  The system operates on **Temporal Sovereignty**. The authority of the vote is absolute but bound to the present moment. The Assembly's reversal at Mytilene does not imply the first vote lacked authority *when cast*; it implies the *demos* has the authority to redefine justice overnight. Legitimacy is derived from the procedure (the show of hands), not the consistency of the outcome. Consequently, the execution of Socrates claims legitimacy from the same source as the mercy granted to Mytilene: the sovereign will of the moment. There is no "higher law" against which the vote can be measured as unconstitutional.

  **Distributed Responsibility (The Asymmetry of Liability):**
  The cluster reveals a stark asymmetry in responsibility.
  *   **Collective Immunity:** When the *demos* votes for disaster (Sicily) or injustice (initial Mytilene decree), responsibility is dissolved among the thousands of voters. No individual citizen is tried for the strategic failure of Sicily.
  *   **Individual Concentration:** When outcomes fail or social cohesion is threatened, responsibility is concentrated on specific agents (the Generals at Arginusae, Socrates).
  *   **The Logic:** This presupposes that the *demos* cannot be corrupt, only misled. Therefore, the "corrupter" (Socrates) or the "incompetent leader" (the Generals) bears full liability for influencing the infallible sovereign. The citizen bears no responsibility for collective strategic errors because the error is framed as a failure of the leader to guide the *demos* correctly, not a failure of the *demos* to judge.

  ### 2. Consistency and the Separation of Knowledge

  **Is it Philosophically Consistent?**
  Yes, within its own axioms. The overnight reversal at Mytilene does not undermine the legitimacy of the Socrates verdict; it reinforces the sovereignty of the mechanism. If the *demos* can kill, it can spare. If it can spare, it can kill. The legitimacy lies in the *capacity* to decide, not the *content* of the decision. To argue inconsistency is to impose an external standard of temporal continuity (Rule of Law) that Athens explicitly rejected in favor of Popular Sovereignty.

  **Moral Knowledge vs. Technical Expertise:**
  The cluster requires the view that moral/political knowledge is separable from technical expertise, but not superior to it in its own domain.
  *   **Sicily:** The *demos* claimed competence over strategic *policy* (whether to invade) despite lacking technical *knowledge* (logistics, distance). This fits the view that "whether" is a political question, while "how" is technical.
  *   **Mytilene:** The reversal was not based on new technical data, but on moral reconsideration (Diodotus' argument about expediency and justice).
  *   **Socrates:** The trial asserts that the *demos* holds authority over moral education (piety, youth), overriding the philosopher's claim to specialized moral knowledge.
  *   **Conclusion:** The system presupposes that technical expertise is subordinate to political will. The failure at Sicily was not seen as a failure of democratic theory, but of the experts (generals) to execute the will, or the *demos* to choose better experts.

  ### 3. Strict Requirements vs. Contingent Fits

  **Strictly Required by the Theory:**
  1.  **Absence of Judicial Review:** No body can overturn a vote of the Assembly or *dikasteria* based on substantive justice.
  2.  **Identity of Law and Will:** *Nomos* is not discovered; it is decreed.
  3.  **Procedural Finality:** A completed vote is binding until a new vote overturns it.
  4.  **Individual Accountability for Collective Outcomes:** A mechanism must exist to punish leaders when collective decisions fail (to preserve the fiction of collective infallibility).

  **Merely Fits Well (Contingent):**
  1.  **Capital Punishment:** The theory requires finality, not necessarily death. Exile could suffice.
  2.  **Volatility:** While the theory allows reversal, it does not *require* overnight flips. A more stable *demos* would still be sovereign.
  3.  **Specific Charges against Socrates:** The theory requires the *demos* can punish dissent, but "impiety" is a cultural vehicle, not a structural necessity. Treason would have worked equally well.
  4.  **Rhetorical Dominance:** While deliberation is key, the theory does not strictly require that emotion override reason, only that the *demos* is the judge of what counts as reason.

  ### 4. Rival Accounts and Normative Logics

  **Rival Account 1: Institutional Failure (Not Philosophical)**
  *Claim:* The outcomes were due to lack of checks (e.g., no written constitution), not a commitment to Sovereign Presentism.
  *Critique:* This fails to explain why checks were not introduced. The absence of checks *was* the philosophical commitment (distrust of elites/fixed laws). The cluster is not a bug; it is a feature of radical *isonomia* (equality).

  **Rival Account 2: Distinct Normative Logics (Generals vs. Socrates)**
  *Claim:* The Generals were tried for procedural violations (burying the dead), Socrates for substantive beliefs.
  *Critique:* Both trials ultimately rested on the *demos'* assessment of harm to the city. The Generals were scapegoated for a victory (Arginusae) due to political anger; Socrates was condemned for perceived social harm. Both operate under the logic that the *demos* defines harm. However, this rival account gains traction if evidence shows the Generals' trial violated specific existing statutes that the Socrates trial did not. If the Generals' trial was acknowledged as illegal *even then* (via *graphe paranomon* attempts), it suggests institutional breakdown, whereas Socrates' trial was procedurally "correct." This would suggest the cluster is not a unified theory but a mix of lawful prosecution and mob justice.

  ### 5. Institutional Changes for Alternative Views

  **Alternative A: Democratic Judgment as Fallible yet Binding**
  *Philosophy:* The *demos* has authority, but its errors should be hard to reverse to ensure stability, and it cannot punish individuals for collective errors.
  *Institutional Changes:*
  1.  **Supermajority Requirements:** For capital decisions or declarations of war (raising the threshold for "binding").
  2.  **Cooling-off Periods:** Mandated delays between proposal and vote (preventing Mytilene-style volatility).
  3.  **Collective Accountability:** Mechanisms to penalize the Assembly (e.g., financial costs) for failed expeditions, diffusing liability back to the voters.

  **Alternative B: Denying Majorities Moral Authority over Life/Death**
  *Philosophy:* Certain rights are pre-political; the majority cannot violate them.
  *Institutional Changes:*
  1.  **Constitutional Court:** A body separate from the *demos* to review verdicts against a Bill of Rights.
  2.  **Professional Judiciary:** Judges insulated from popular vote to interpret law rather than will.
  3.  **Abolition of Capital Punishment by Vote:** Removing life/death from the agenda of the Assembly entirely.

  ### 6. Falsification and Vulnerability

  **What Would Change My Assessment:**
  My reconstruction rests on the view that Athens operated under a coherent, albeit radical, logic of Sovereign Presentism. This assessment would be overturned by evidence demonstrating that Athenians themselves viewed these specific events as **violations of their own normative standards**, rather than expressions of them.

  1.  **Evidence of Procedural Illegality in Socrates' Trial:** If it were demonstrated that the *graphe paranomon* (indictment for illegal proposals) was routinely used to stop capital trials based on substantive injustice, and that Socrates' supporters *failed* to use it due to fear rather than principle, it would suggest the trial was an institutional breakdown, not a philosophical commitment. (Current scholarship is divided; definitive evidence of a procedural norm against questioning piety would weaken the "moral authority of the demos" claim).
  2.  **Evidence of Unwritten Constitutional Constraints:** If archaeological or textual evidence revealed a recognized "fundamental law" (*agraphoi nomoi*) that the Assembly acknowledged it could not violate (e.g., "no citizen may be executed without two votes"), then the Mytilene reversal and Socrates execution would be evidence of *tyranny of the majority* violating the constitution, rather than the constitution functioning as designed.
  3.  **Distinction in Authority Types:** If evidence showed that the *dikasteria* (courts) were viewed as legally distinct from the *Ecclesia* (Assembly) regarding moral truth—specifically, if the courts were seen as guardians of tradition while the Assembly was for policy—then the cluster collapses. The Socrates trial would be a corruption of the judicial role, not an extension of democratic will. (Some evidence exists here: the Oath of the Heliaia. If this oath implied adherence to higher laws, my reconstruction is vulnerable).

  **Most Vulnerable Point:**
  The reconstruction is most vulnerable regarding the **Trial of the Generals (Arginusae)**. If the Athenian condemnation of the generals was widely recognized *at the time* as a miscarriage of justice that led to immediate institutional reform (which it partially did, via restrictions on Assembly power), then the cluster is not a stable "theory" but a record of **systemic instability recognized by the participants**. If the Athenians themselves sought to *limit* the very powers I attribute to their philosophy (e.g., by strengthening the *graphe paranomon* after Arginusae), then the "implicit theory" is not a commitment to Sovereign Presentism, but a failed experiment in it that they actively tried to correct. This would shift the interpretation from "philosophical consistency" to "institutional learning."
