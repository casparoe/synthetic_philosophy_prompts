  # JOINT STATEMENT ON THE ONTOLOGY OF PATTERNS AND THE STATUS OF THE STANCES

  **Collaborators:** Camp R (Realist) and Camp I (Instrumentalist)
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on Physical, Design, and Intentional Stances

  ## PREAMBLE: SCOPE AND METHODOLOGY

  This document records the results of an adversarial collaboration regarding the metaphysical status of patterns, specifically those identified via the Physical, Design, and Intentional stances. We acknowledge that the scenarios described in Section 1 (Targets S1–S4) are **stipulated thought experiments** constructed for this collaboration. They do not represent settled empirical results in cognitive science or physics. Where we draw conclusions from S1–S4, we are extrapolating beyond existing literature to test the logical boundaries of our respective positions. We distinguish below between claims grounded in the existing literature (e.g., Dennett 1987, 1991) and claims derived from our specific adversarial framework.

  ## 1. JOINTLY AFFIRMED CLAIMS

  We agree on the following definitions, methodological constraints, and interpretations of the stipulated targets.

  1.  **Definition of Stances:** We adopt the standard tripartite distinction:
      *   *Physical Stance:* Prediction based on physical constitution and laws of nature.
      *   *Design Stance:* Prediction based on assumed function and optimality, abstracting from physical constitution.
      *   *Intentional Stance:* Prediction based on assumed rationality, beliefs, and desires.
  2.  **The Scorecard:** For any target system and stance, evaluation requires three metrics:
      *   (i) *Predictive Accuracy:* Performance on held-out data.
      *   (ii) *Compression (MDL):* Total description length = Cost of Stance Assumptions (e.g., attributing specific beliefs) + Cost of Residual Error.
      *   (iii) *Intervention Robustness:* Graceful degradation of prediction under component modification.
  3.  **The No-Traps/No-Miracles Condition:** We assume the environment is not adversarially rigged to falsify a stance that is otherwise warranted (No-Traps), and that sustained predictive success is not the result of sheer luck (No-Miracles). This condition blocks skeptical objections that rely on global deception or coincidental alignment.
  4.  **Interpretation of Target S1 (Intentional Dominance):** In cases where the Intentional Stance outperforms Physical and Design stances on Accuracy, Compression, and Intervention Robustness:
      *   *Agreed:* The Intentional Stance is the *optimal predictive instrument*.
      *   *Agreed:* Any ontology that denies the existence of the system's intentional properties must explain away this optimal compression without resorting to "luck" (per No-Miracles).
  5.  **Interpretation of Target S2 (High Attribution Cost):** In cases where Intentional Accuracy is high, but Compression fails due to the cost of specifying belief/desire sets for every new situation:
      *   *Agreed:* The Intentional Stance lacks *generalizability* in this domain.
      *   *Agreed:* This counts against the *stability* of the pattern, regardless of ontological commitment.
  6.  **Interpretation of Target S3 (Intervention Failure):** In cases where Intentional predictions are accurate and cheap but fail systematically under intervention (while Design predictions hold):
      *   *Agreed:* The Intentional pattern is *fragile* or *epiphenomenal* relative to the Design structure.
      *   *Agreed:* This is the strongest evidence against the Intentional Stance identifying a *causal* power, though it may still identify a descriptive regularity. **[Note: This extrapolates beyond standard literature, which rarely isolates intervention failure while maintaining predictive success.]**
  7.  **Interpretation of Target S4 (Coding Relativity):** In cases where the "reality" of the pattern flips based on admissible coding schemes (C1 vs. C2):
      *   *Agreed:* Pattern detection is sensitive to representational choices.
      *   *Agreed:* If C1 and C2 are equally non-gerrymandered, objective realism faces a challenge regarding stance-independence.

  ## 2. DISAGREEMENTS TABLE

  | Issue (Neutral) | Camp R Formulation (Realist) | Camp I Formulation (Instrumentalist) | Genuine or Verbal? | Agreed Test / Finding | R Prediction | I Prediction | Condition for R to Recant | Condition for I to Recant |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Ontological Status of Beliefs** | When S1 conditions are met, belief/desire attributions are **true descriptions** of real states. | When S1 conditions are met, belief/desire attributions are **useful fictions** that facilitate compression. | **Genuine** | S1 Scenario (Intentional Dominance). | Beliefs exist as real patterns. | Beliefs are instrumental posits. | If S1 patterns are shown to be eliminable by a deeper physical theory without loss of compression. | If it is shown that "useful fiction" cannot account for the *normative* constraints on belief attribution. |
  | **Role of Coding Scheme** | Reality is invariant under all *non-gerrymandered* coding schemes. If C1 and C2 conflict (S4), one is subtly gerrymandered. | Reality is relative to the coding scheme and explanatory interests. S4 proves pattern-hood is not stance-independent. | **Genuine** | S4 Scenario (Coding Relativity). | We will find a metric to privilege C1 or C2 objectively. | We will accept that both C1 and C2 are valid, implying relativity. | If no objective metric can distinguish C1 from C2 despite conflicting ontologies. | If an objective, interest-independent metric successfully privileges one code. |
  | **Intervention & Causality** | Real patterns must support counterfactuals and interventions (S3 failure undermines reality). | Instruments need not be causal; they need only predict. S3 shows the limit of the tool, not the non-existence of the pattern. | **Mixed** | S3 Scenario (Intervention Failure). | Intentional properties are not real in S3 cases. | Intentional properties are still useful, even if causally inert. | If Intentional Stance works in S3 but is proven causally inert. | If Intervention Robustness is proven necessary for *any* predictive utility. |
  | **Truth vs. Utility** | "True" means "successfully picks out a real compression in the world." | "True" means "corresponds to mind-independent furniture." Intentional claims are only "as-if true." | **Verbal** | Analysis of the word "true" in scientific practice. | Our definition is standard scientific realism. | Our definition preserves the distinction between map and territory. | N/A (Definition choice). | N/A (Definition choice). |

  ## 3. NEW CRUXES AND UNEXPLORED TERRITORY

  In the course of this collaboration, we identified two critical cruxes that are not adequately addressed in the existing literature (e.g., Dennett 1987; Ladyman & Ross 2007) and were not part of our initial brief.

  **Crux 1: The Optimizer vs. Interpretability Distinction**
  *   **The Issue:** Does the success of the Intentional Stance require the target system to *actually be* an optimizer (maximizing a utility function), or is it sufficient that the system is *interpretable* as one by an observer?
  *   **Camp R Position:** For the pattern to be real, the system must possess a functional architecture that *implements* optimization. Mere interpretability is insufficient (avoids the "pan-intentionalism" problem).
  *   **Camp I Position:** Optimization is in the eye of the beholder. If the interpretation yields compression (S1), the "inner workings" are irrelevant.
  *   **Proposed Test:** Construct a system (Target S5) that generates Intentional-stance-compatible behavior via a lookup table (no optimization) vs. a genuine heuristic optimizer.
  *   **Extrapolation Note:** *Existing literature discusses "lookup tables" (Block 1981), but not in the context of MDL scorecards. We are extrapolating that MDL costs would differ significantly between the two.*
  *   **Prediction:** R predicts the lookup table will have a higher Description Length (cost of storing the table) than the optimizer, preserving Realism. I predicts that if the lookup table is compressed (e.g., via hash), the distinction vanishes.

  **Crux 2: The Normativity of the Pattern**
  *   **The Issue:** Real patterns seem to entail normative constraints (the system *ought* to behave rationally given its beliefs). Instruments merely track regularities.
  *   **Camp R Position:** If the Intentional Stance is real, there are facts about what the system *should* do, independent of our prediction.
  *   **Camp I Position:** Normativity is a projection of the user's interest in rationalizing the system.
  *   **Proposed Test:** Analyze S3 (Intervention Failure). If the system fails to behave rationally after intervention, does it make the *past* attributions false?
  *   **Prediction:** R says yes (truth is retrospective). I says no (utility was prospective).

  ## 4. CLOSING NOTE: RESIDUAL DISAGREEMENT AND DECISIVE FINDINGS

  **On Verbal Disagreement:**
  We judge the disagreement regarding the word **"True"** to be largely verbal. Camp R uses a deflationary or pragmatic theory of truth (truth = optimal compression), while Camp I uses a correspondence theory (truth = mind-independent existence). If Camp R agreed to say "Intentional attributions are *real-pattern-true* but not *fundamental-true*," and Camp I agreed to say "Intentional attributions are *indispensably-assertible*," the practical disagreement would shrink significantly. However, this verbal shift masks a genuine disagreement about **causal power** (see Table, Issue 3).

  **On the Decisive Finding:**
  The single finding that would most move the debate is a resolved version of **Target S4 (Coding Relativity)**.
  *   If it can be demonstrated that two coding schemes, both meeting all criteria for "non-gerrymandered" and "natural," yield contradictory ontological commitments (one says Beliefs exist, the other says they do not) with *equal* Description Lengths, **Camp R must abandon strong Realism.**
  *   Conversely, if it can be proven that one coding scheme is objectively "more natural" (e.g., via computational complexity classes or thermodynamic costs) independent of human interest, **Camp I must abandon strict Instrumentalism.**

  Until S4 is resolved empirically or formally, the debate remains suspended between ontology and utility.

  ***

  **Signed,**

  *Dr. Elena Vance (Camp R)*
  *Dr. Marcus Thorne (Camp I)*

  **Footnotes on Extrapolation:**
  1.  *The Scorecard metrics (MDL + Intervention) are a formalization of Dennett's informal criteria. No prior literature applies this exact tripartite scoring to the Intentional Stance.*
  2.  *Targets S1–S4 are stipulated for this collaboration. While analogous cases exist in AI and cognitive science, the specific outcomes (e.g., S3 where Intentional works but Design intervenes better) are hypothetical constructs designed to stress-test the theories.*
  3.  *The distinction between "Optimizer" and "Interpretable" in Crux 1 is an extrapolation from the "Chinese Room" debate into the domain of Minimum Description Length.*
