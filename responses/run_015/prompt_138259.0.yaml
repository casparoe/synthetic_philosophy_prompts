prompt: |-
  So here's the situation I've gotten myself into. I'm a philosophy professor — mostly ethics, I teach the comparative courses too — and last spring I let myself be talked onto the clinical ethics committee at the hospital affiliated with our university. You know the arrangement: they wanted "a humanities person" on the committee, I said yes before thinking about what I was agreeing to. We get maybe thirty consults a year, they come in from a nurse or a resident, and we have roughly forty-eight hours to put something in the chart. The committee rotates — an oncologist, a nurse manager, a social worker, a hospital lawyer, a community member, and me. Right now we run everything through the four-principles framework (autonomy, beneficence, non-maleficence, justice) that everyone was trained on in some half-day workshop, and honestly it's stopped being useful to us. It basically outputs "go ask the patient what she wants" in exactly the cases where that's the thing under dispute: families insisting the patient not be told, adult children disagreeing with each other about what their mother "would have wanted," patients whose whole sense of what they owe their family makes the language of individual rights sound like a foreign language. There's no vocabulary in it for any of that.

  Meanwhile I've been reading the Confucian role ethics literature — the reading of the early Confucian texts on which persons are constituted by the roles they actually live rather than being antecedent choosers who then take on roles and relationships, and where what you cultivate is relational attentiveness, ritual propriety (li), something like filial responsibility (xiao), and a situated judgment (yi) that just isn't the sort of thing that can be specified in advance. It feels far closer to how these cases present themselves in the room. So the chief of staff has asked me to draft something the committee could actually use, and I agreed, which is where I'm stuck.

  What I want from you is a decision procedure, not an essay about role ethics — I can write that myself. I mean the thing we'd run: the questions, in order, we'd ask ourselves on a consult; what counts as an adequate answer to each; where the procedure ends in a substantive recommendation and where it deliberately stops and hands the question back to a person because what remains is a value question, or a relationship question, or simply not ours to settle. It has to be runnable by non-philosophers in an afternoon, and it should be honest about which of its steps are judgment calls dressed up as procedure. Critically, there's an objection I keep circling and I want you to take it seriously rather than wave it away: isn't writing role ethics down as a checklist exactly the degeneration the view is supposed to be diagnosing? If yi is precisely what can't be cashed out ahead of time, then any procedure I hand the committee will have replaced the exercise of judgment with a rule, and I'll have reproduced — in Confucian vocabulary — the thing I was objecting to in the four principles. Tell me whether that kills the project or whether there's a form the procedure could take (less a flowchart, maybe, and more a structured set of questions that forces the right kind of attention) that isn't self-undermining. Either way, say which distinctions from the theory have to survive the translation for the result to still be Confucian role ethics rather than generic family-systems bioethics, and which we can drop. Then run it on three cases, please. First: a sixty-eight-year-old woman with newly diagnosed metastatic lung cancer; her adult son, who is her caregiver, formally asks us not to disclose the diagnosis, says she "wouldn't want to know," and says that in their family this is what a good son does — the treating team wants to tell her. Second: a patient with advanced dementia, no advance directive, no spouse; two estranged daughters arrive with sharply different accounts of what she would have wanted and of who should speak for her. Third: a case where your procedure gives an answer I definately won't like — pick one yourself and say why it's uncomfortable; I'd rather find out now than in a real consult. And please don't pad it with citations or suggested reading, I'll do my own reading — I want the procedure, the worked cases, and where it breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Philosophy professor (ethics/comparative), newly appointed to a hospital clinical ethics committee.
      *   **Problem:** The standard "Four Principles" approach (Beauchamp & Childress) is failing in complex, relational cases (family disputes, cultural differences regarding autonomy, etc.).
      *   **Proposed Solution:** The user wants to implement a framework based on Confucian Role Ethics (CRE) - specifically focusing on roles, relational attentiveness, *li* (ritual propriety), *xiao* (filial piety/responsibility), and *yi* (situated judgment/righteousness).
      *   **Task:** Create a *decision procedure* (not an essay) for the committee to use. It must be runnable by non-philosophers in an afternoon.
      *   **Critical Constraint/Objection:** The user explicitly raises the "performative contradiction" objection: Does codifying *yi* (situational judgment that can't be specified in advance) into a checklist destroy the very essence of Confucian ethics?
      *   **Requirements:**
          1.  Address the objection (does it kill the project?).
          2.  Define the procedure (questions, order, adequacy conditions, stopping points).
          3.  Identify which theoretical distinctions must survive translation (to remain CRE) vs. what can be dropped.
          4.  Run the procedure on three cases (Non-disclosure, Estranged Daughters, and a "Uncomfortable Answer" case chosen by me).
          5.  No padding/citations.

  2.  **Deconstruct the Objection (The "Yi" Problem):**
      *   *The Objection:* Confucian ethics emphasizes *yi* (righteousness/appropriateness) which is context-sensitive and cannot be reduced to rigid rules. Making a checklist seems to turn *yi* into *li* (ritual) without the spirit, or worse, into law.
      *   *The Counter:* Confucianism *does* have rituals (*li*) and guidelines. The *Analects* are essentially case studies of judgment. The goal isn't to automate judgment but to *cultivate* the conditions for judgment. A procedure can be a "scaffold" for attention rather than an algorithm for output. It forces the committee to look at the *right things* (relationships, roles, history) rather than just rights and harms.
      *   *Resolution:* The procedure must be framed as a *deliberative scaffold*, not a decision tree. It asks questions that expand the moral landscape, not narrow it to a binary. It must explicitly acknowledge where judgment (*yi*) is required and refuse to dictate the outcome in those moments.

  3.  **Drafting the Procedure (The "Relational Mapping Protocol"):**
      *   Need to move away from "Principles" to "Relations."
      *   *Step 1: Map the Roles.* Who is involved? Not just "patient" and "provider," but "mother," "son," "caregiver," "healer."
      *   *Step 2: Assess the Ritual Propriety (*Li*).* What are the expectations of these roles? Is there conflict between role expectations?
      *   *Step 3: Evaluate the History/Quality of Relation.* Is the relationship functional? Abusive? Estranged? This determines weight.
      *   *Step 4: Identify the *Yi* (The Stuck Point).* Where is the specific judgment call needed?
      *   *Step 5: Recommendation.* Not "do X," but "facilitate Y" or "authorize Z based on role weight."
      *   *Crucial Feature:* It needs to stop before dictating values. It hands back the "value question."

  4.  **Selecting Theoretical Distinctions (Survival vs. Drop):**
      *   *Keep:* Persons as nodes in a network (not atomic individuals); *Yi* as situated judgment; *Li* as normative role expectations; Authority derived from role fulfillment, not just legal status.
      *   *Drop:* Metaphysical claims about qi or cosmic resonance; Heavy reliance on classical texts/terminology (translate to clinical language); The idea that harmony is always the goal (sometimes conflict is necessary for righteousness).

  5.  **Developing the Cases:**
      *   *Case 1 (Lung Cancer/Non-disclosure):* Standard CRE strength. The son is fulfilling *xiao*. The doctors are fulfilling "healer" role but clashing with "guest in family" role. Recommendation: Mediated disclosure respecting the son's role but ensuring patient care.
      *   *Case 2 (Dementia/Estranged Daughters):* Focus on the *history* of the relationship. Who actually lived the role of daughter? Legal status vs. Moral status.
      *   *Case 3 (The Uncomfortable One):* Needs to show where CRE might clash with Western legal/ethical norms.
          *   *Idea:* A case where the "family" decides against the patient's expressed (but weak) wish because the family's survival is at stake. Or, a case where the committee defers to a patriarchal structure that feels oppressive.
          *   *Selection:* A young adult patient (19) whose parents demand control over treatment due to financial dependency and traditional hierarchy, overriding the patient's reluctance. CRE might prioritize the family unit's stability over the individual's nascent autonomy. This is uncomfortable for a Western hospital.
          *   *Alternative:* A case where the "right" relational answer is to *stop* treatment because continuing it destroys the family's ability to care for the ancestors/other members. Let's go with: *The Burden of Care.* A patient wants aggressive treatment, but the family (who must provide the care) says it will ruin them. CRE weighs the family's role-preservation heavily. The recommendation might be to limit treatment to preserve the family unit. This clashes with "Patient Autonomy."

  6.  **Refining the Tone:**
      *   Professional, direct, peer-to-peer. No fluff.
      *   Acknowledge the risk of the checklist.
      *   Ensure the "procedure" feels like a tool for *thinking*, not a calculator.

  7.  **Review against Constraints:**
      *   Decision procedure? Yes.
      *   Address the objection? Yes.
      *   Distinctions (Keep/Drop)? Yes.
      *   Three cases? Yes.
      *   No citations? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction on Case 3:* Make sure the discomfort is clear. It shouldn't just be "hard," it should be "this feels wrong by standard bioethics but right by CRE."
      *   *Correction on Procedure:* Ensure it explicitly states *where* it stops. The "Yi Check" needs to be the place where the committee admits "We have to decide this, no rule helps."
      *   *Refining the Objection:* Be honest. Yes, it risks reification. The mitigation is framing it as "attention-training" rather than "decision-making."

  9.  **Final Output Structure:**
      *   The Objection (Does this kill the project?)
      *   Theoretical Distinctions (Keep vs. Drop)
      *   The Procedure (The Relational Mapping Protocol)
      *   Case Studies (1, 2, and 3)
      *   Where It Breaks (Limitations)

  *(Self-Correction during final review)*: Wait, the prompt asks for the procedure *first* or integrated? "What I want from you is a decision procedure... Tell me whether that kills the project... Either way, say which distinctions... Then run it on three cases." I should structure it logically. I'll start with the Objection/Feasibility, then the Theory translation, then the Procedure, then the Cases. This flows better for a professor reading a draft.

  Actually, looking at the prompt: "Tell me whether that kills the project... Either way, say which distinctions... Then run it on three cases." I will address the objection first as it frames the procedure.

  Let's refine the "Uncomfortable Case." A 17-year-old refusing chemo, parents insisting. Western ethics: mature minor doctrine? Best interest? CRE: Parents are responsible for the child's body as part of the lineage. The committee might recommend overriding the minor to preserve the parent-child role integrity. That's very uncomfortable for a US hospital. Let's use that.

  Wait, one more check on the "Procedure." It needs to be runnable in an afternoon. It can't be too abstract. Questions need to be concrete. "Who feeds whom?" "Who speaks for whom?"

  Okay, ready to write.cw
answer: |-
  ### 1. The Objection: Does Codification Kill *Yi*?

  You are right to worry. If the procedure functions as an algorithm that outputs a verdict, it defeats the purpose. Confucian *yi* (righteousness/situated judgment) is precisely the capacity to weigh competing role-obligations in a specific context where no rule applies. If we turn *yi* into a flowchart, we create a new kind of rigid *li* (ritual) without the requisite moral cultivation, effectively bureaucratizing virtue.

  **Verdict:** It does not kill the project, *provided* the procedure is framed as a **deliberative scaffold** rather than a **decision tree**.

  A decision tree narrows options until one remains. A deliberative scaffold expands the moral landscape until the right path becomes visible to the agents involved. The procedure must not tell the committee *what* to decide; it must force them to look at *who* is deciding and *why*. It must explicitly identify the point where the procedure stops and judgment begins. If the form hides the judgment call, it is deceptive. If the form highlights the judgment call, it is a tool for *yi*.

  To work, the document must include a "Stop Rule": *If the committee finds itself using this checklist to avoid a difficult conversation with the family, the process has failed.*

  ### 2. Theoretical Translation: What Survives, What Drops

  To make this runnable by an oncologist and a lawyer in 45 minutes, we must strip the metaphysics but keep the moral topology.

  **Must Survive (The Core):**
  1.  **The Relational Self:** The patient is not an isolated rights-bearer but a node in a network. Harm to the patient is inseparable from harm to the network (family), and vice versa.
  2.  **Role Normativity:** Roles (father, doctor, daughter) carry inherent obligations. Authority is derived from fulfilling the role, not just legal status. A "father" who abandons the family loses moral authority, even if he retains legal next-of-kin status.
  3.  **Harmony as Process, Not Outcome:** The goal is not "agreement" (which can be coerced) but *he* (harmony as the fitting together of different parts). Sometimes this requires conflict to rectify a role failure.
  4.  **Graduated Obligations:** Obligations are not universal; they are thicker closer to home. The family's interest weighs differently than the institution's interest.

  **Can Be Dropped (The Baggage):**
  1.  **Cosmological Grounding:** No need to reference *qi*, heaven (*tian*), or cosmic resonance.
  2.  **Historical Specificity:** We are not enforcing 5th-century BCE family structures. We are using the *logic* of role ethics to analyze 21st-century families (which may include chosen family, partners, etc.).
  3.  **Perfectibility:** We are not trying to make the committee or the family sages. We are looking for the "least damaging role failure."

  ### 3. The Procedure: Relational Mapping Protocol (RMP)

  **Time Limit:** 45 Minutes
  **Facilitator:** Ethics Chair (You)
  **Output:** A chart note describing the *moral landscape*, not just a recommendation.

  **Phase 1: Role Mapping (10 Mins)**
  *Goal: Identify the actors not by title, but by function.*
  *   **Question:** Who is physically caring for the patient? Who is financially responsible? Who speaks for the family history?
  *   **Adequacy Check:** Do not accept "Next of Kin." Ask: "Who changes the sheets?" "Who pays the bills?" "Who knew her before she was sick?"
  *   **Output:** A list of *Functional Roles* vs. *Legal Roles*. Note where they diverge.

  **Phase 2: Role Expectation Audit (15 Mins)**
  *Goal: Identify the normative conflict.*
  *   **Question:** What does each Functional Role believe they *owe* the patient? What does the patient owe them?
  *   **Question:** Where do these expectations clash? (e.g., The son believes *xiao* requires protecting the mother from bad news; the oncologist believes *healer* requires truth-telling).
  *   **Adequacy Check:** Can you state the conflict without using the word "autonomy"? If you can only state it as "rights violation," you have failed to map the role obligation.
  *   **Output:** A statement of the specific role-conflict (e.g., "Filial protection vs. Medical transparency").

  **Phase 3: History and Quality of Relation (10 Mins)**
  *Goal: Determine moral weight.*
  *   **Question:** Has this role been fulfilled consistently over time? Is there a history of neglect or abuse?
  *   **Question:** If we defer to this person's judgment, does it reinforce a healthy relationship or enable a dysfunctional one?
  *   **Adequacy Check:** This is the "Unworthy Role" check. A legal proxy who has been absent for 10 years has low moral weight, even if high legal weight.
  *   **Output:** A weighting of whose voice carries more *moral* (not legal) authority.

  **Phase 4: The *Yi* Check (10 Mins)**
  *Goal: Locate the judgment call.*
  *   **Question:** Is there a rule that solves this? (If yes, follow hospital policy/law and stop).
  *   **Question:** If no, what decision best preserves the possibility of future relationship integrity for the primary caregivers?
  *   **Stop Rule:** If the committee cannot agree on which relationship is most vital to preserve, the recommendation must be "Mediation Required" rather than "Treatment X."
  *   **Output:** The Recommendation.

  ---

  ### 4. Worked Cases

  #### Case 1: The Protective Son (Non-Disclosure)
  **Situation:** 68F, metastatic lung cancer. Son (primary caregiver) demands non-disclosure based on filial duty. Team wants to tell.
  **RMP Run:**
  *   **Phase 1:** Son is *Functional* and *Legal* proxy. Team is *Medical* authority. Patient is *Recipient*.
  *   **Phase 2:** Conflict: Son's role obligation (protect mother from distress/hopelessness) vs. Doctor's role obligation (informed consent/truth). The patient's role as "mother" implies a trust relationship with the son that is being leveraged.
  *   **Phase 3:** Son has been primary caregiver for 5 years. Relationship appears historically strong. No evidence of abuse. The son's request is consistent with his long-standing role performance.
  *   **Phase 4 (*Yi* Check):** No rule solves this. Forcing disclosure violates the son's role integrity and may cause him to withdraw care (harming the patient). Withholding info violates medical norms but preserves the family unit's coping mechanism.
  *   **Recommendation:** Do not force immediate disclosure. Schedule a family meeting where the physician asks the *mother* (in private, if possible, or in presence of son) what she understands about her illness. Frame it as "checking understanding" rather than "breaking news." If she indicates she knows or wants to know, the son's role obligation shifts to supporting her knowledge. If she indicates she trusts her son to handle it, honor that.
  *   **Rationale:** This honors the son's *xiao* while leaving a channel for the patient's *yi* to emerge. It avoids the binary of "tell/don't tell."

  #### Case 2: The Estranged Daughters (Dementia/Proxy Dispute)
  **Situation:** Advanced dementia, no AD. Daughter A (local, visited monthly) vs. Daughter B (out of state, hasn't visited in 3 years). B claims legal right; A claims knowledge of patient's values.
  **RMP Run:**
  *   **Phase 1:** Daughter A is *Functional* caregiver. Daughter B is *Legal* next-of-kin (assuming equal status).
  *   **Phase 2:** Conflict: Legal authority vs. Relational knowledge. B claims role of "daughter" based on biology/legal status. A claims role of "daughter" based on service and presence.
  *   **Phase 3:** History check reveals B has been absent. A has managed bills, hygiene, and housing. B's sudden arrival coincides with inheritance/insurance decisions.
  *   **Phase 4 (*Yi* Check):** Deferring to B rewards role abandonment. Deferring to A risks legal liability but honors the moral reality of who "was there."
  *   **Recommendation:** The committee recommends the medical team treat Daughter A as the primary surrogate for *clinical* decisions, citing her continuous fulfillment of the filial role. Daughter B must be consulted for *legal/financial* consents only. If B blocks care, involve legal counsel, but the ethics chart note should explicitly state: "Moral authority resides with the caregiver who sustained the relationship."
  *   **Rationale:** In role ethics, authority is earned through performance of the role, not bestowed by biology alone.

  #### Case 3: The Uncomfortable Answer (The 19-Year-Old)
  **Situation:** 19-year-old male with severe spinal injury, likely permanent paralysis. He expresses ambivalence about aggressive rehab, says "maybe it's not worth it." Parents (immigrant family, traditional hierarchy) demand full aggressive rehab, stating, "He is our future. He does not get to give up. We will carry him." The patient is not suicidal, just resigned. He defers to them verbally but looks despondent.
  **RMP Run:**
  *   **Phase 1:** Parents are *Financial* and *Emotional* sponsors. Patient is *Son* and *Heir*.
  *   **Phase 2:** Conflict: Patient's nascent individual autonomy vs. Parents' role obligation to ensure the son's viability for the family lineage/support. In this framework, the son's body is not solely his own; it is a resource of the family unit.
  *   **Phase 3:** History shows tight-knit family, high interdependence. Patient has lived his life as a son first, individual second. Pushing "your life, your choice" isolates him from his primary support network.
  *   **Phase 4 (*Yi* Check):** Standard bioethics says: 19 is an adult, respect his ambivalence as a refusal. Role ethics says: His "choice" is made within a web of obligation where his giving up destroys the parents' life purpose and the family's future stability.
  *   **Recommendation:** **Proceed with aggressive rehab over the patient's expressed ambivalence, with family support.**
  *   **Why This Is Uncomfortable:** This violates the Western bioethical priority of individual autonomy for a competent adult. It effectively validates a form of paternalism by the family. It risks the patient's resentment.
  *   **Why Role Ethics Demands It:** The "harm" of violating his immediate preference is weighed against the "harm" of fracturing the family structure that will sustain him for the next 50 years. If he refuses rehab, he becomes a burden that breaks the family. If he accepts, he lives a hard life but within a supported role. The *yi* here prioritizes the survival of the relational network over the individual's current mood.
  *   **Risk:** If the patient later sues or attempts self-harm, the committee is exposed. This is where the hospital lawyer will fight you. This is the breaking point.

  ### 5. Where It Breaks (Limitations)

  1.  **The Abusive Family:** The RMP relies on assessing "Quality of Relation." If the committee misreads a coercive control dynamic as "strong family harmony," the procedure will recommend deferring to the abuser. *Mitigation:* Phase 3 must include a mandatory social work safety screen that trumps role mapping.
  2.  **The Legal Wall:** In Case 3 (The 19-Year-Old), the law likely overrides the ethics committee. If the patient says "no," and he is competent, the hospital cannot treat. The RMP might generate a morally coherent recommendation that is legally actionable only as "persuasion," not "authorization." You must be clear that this procedure advises on *moral authority*, not *legal liability*.
  3.  **Time Pressure:** In a code blue or ICU crisis, there is no time for Role Mapping. This procedure is for sub-acute, complex consults only.
  4.  **The "Harmony" Trap:** The committee might use "preserving relationships" as an excuse to avoid conflict when conflict is necessary (e.g., reporting neglect). The *Yi* Check must explicitly ask: "Does this harmony require injustice?" If yes, harmony must be broken.

  **Final Note for the Chief of Staff:**
  This procedure will not make decisions easier. It will make them clearer. It will reveal when we are hiding behind "autonomy" to avoid families, and when we are hiding behind "family" to avoid patients. It will not protect us from lawsuits, but it will protect us from moral confusion.
