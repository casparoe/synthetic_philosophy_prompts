prompt: |-
  For most of a working life I was a clinical epidemiologist — screening, trial interpretation, and a good deal of time spent watching colleagues reason badly about their own results and well about everyone else's. In retirement I have begun reading philosophy in earnest, and I have drifted into the literature on self-deception: I have dipped into Mele, and into a couple of encyclopedia articles, mostly unsatisfying. What I bring to it is not a theory but a set of verdicts on cases from my own career, which I trust more than I trust anything I have read so far, and which I cannot get under one principle. I would be grateful if you would try, and if you would then tell me which verdicts I have to surrender.

  The cases, numbered for reference.

  1. A senior colleague spent fifteen years on a hypothesis about an occupational exposure. A large, well-designed trial returned a null result. Within a week he was saying that the exposure had been misclassified and the study underpowered, and over the following year he came — as certain as one can be about another mind — sincerely to believe that the trial told us nothing. I had watched him accept trials of exactly that design as decisive when they told against other people's hypotheses. Verdict: self-deception, and my clearest case.

  2. A friend dying of cancer told her family, repeatedly and with apparent warmth, that she was going to beat it. She had also, in the same month, sorted her papers, written three letters she asked to be delivered after her death, and said goodbye to me in a way that made no sense unless she knew exactly what was happening. Verdict: not self-deception. She knew. What she was doing was a kindness, and I do not think the term should be stretched to cover it.

  3. A graduate student in a lab I was associated with ran an analysis, re-ran it, dropped one site as an outlier, added a covariate, and stopped when the result crossed significance; then he believed the finding. He knew all about multiplicity. He would have spotted the identical procedure in someone else's paper in about ninety seconds. Verdict: self-deception, but a different animal from case 1 — in 1 the standards of evidence moved, in 3 the rule for gathering evidence moved — and I am honestly unsure whether he believes the result or only believes he is entitled to publish it.

  4. A different colleague who is simply a poor judge of evidence about everything: homeopathy, the markets, his own driving, the reliability of his memory. His errors point in every direction, including against his own interests. Verdict: not self-deception, just a badly calibrated estimator.

  5. A surgeon who kept a personal series of operative outcomes, quietly excluding the referrals he judged unsuitable on grounds he never wrote down, and who sincerely believed his mortality figures were the best in the country. He was scrupulous about data in every other corner of his practice. Verdict: self-deception. This is the case I keep returning to: I cannot say at what point his exclusion rule stopped being judgement and started being something else, and I cannot see that he could have said either.

  6. A man in his fifties with a strong family history of a late-onset disease who declined the genetic test, declined to read about it, changed the subject whenever it came up, and booked a year-long sailing trip. So far as I can tell he has no opinion whatever about whether he carries the variant: no belief either way. Verdict: my tongue says self-deception, loudly. My head says there is no false belief here, and no pair of beliefs, and therefore nothing for the accounts I have read to get a grip on. I would rather keep the verdict and give up the requirement of a false belief — but I can see what that costs, and cases 2 and 6 together seem to rule out both of the obvious models at once.

  7. A competitive acquaintance who insists, sincerely and often, that he does not care about priority; who refuses co-authorship on principle; and who is visibly furious for a week whenever someone else gets there first, and knows that he is. Verdict: self-deception, but about a desire rather than a belief — and what he lacks is not a belief but a certain kind of attention to his own behaviour.

  For what it is worth, here is the account I arrived at before I read any philosophy, in the only idiom I have. Self-deception is a directional error in belief-fixation: an estimate biased toward the result the agent wants, where the bias enters through the agent's own evidential itinerary — which questions she asks, when she stops asking, what she counts as a replicate, which of her own rules she applies to this case — rather than through the evidence itself or through her prior; and where she would reject that itinerary if the desired result lay on the other side. I think of the last clause as a reversibility test, and I like it because it separates 1 and 3 from 4, which no appeal to motivated reasoning by itself seems to manage.

  What I would like from you:

  1. "The principle, stated first" — about 120 words. Give me the account you think best in one or two sentences, before the commentary, so I can see the shape of it.

  2. "Clause by clause, with the case that motivates each" — about 400 words. Every clause of your principle should be traceable to something in my list that forces it, and you should say what breaks if the clause is dropped.

  3. "What my estimator account gets right, and where it must be repaired" — about 200 words. Test my formulation against the cases, especially 6 and 7, where it seems to me to run out of beliefs to be biased, and 5, where I cannot locate the moment of error at all.

  4. "Which of my verdicts you cannot keep" — about 250 words. Be blunt. If you must choose between a more complicated principle that saves all seven verdicts and a simpler one that overturns one or two, say so explicitly, say which you recommend, and say what I lose by taking your advice. I would rather have one verdict overturned than a principle with a clause bolted on for every case, but if you think I am wrong about that, argue.

  5. "Predictions for the cases I have not listed" — about 250 words. Please apply your principle to three things my cases do not settle: whether a research group or department can be self-deceived as a group, and what that would consist in; whether a researcher who fabricates data and then comes to believe his own fabricated result is a case of self-deception or something adjacent to it; and whether there can be self-deception with no behavioural signature at all, in a person whose error never surfaces in action or speech.

  One request about manner: I am not writing this up and I have a university library card, so please do not spend words on references, further reading, or citations of the literature. Give me the argument.
