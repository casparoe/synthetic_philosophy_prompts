  **The principle, stated first**

  Self-deception is the motivated manipulation of one's own epistemic procedures to sustain a preferred conclusion while maintaining the subjective appearance of objectivity. It occurs when an agent employs evidential shortcuts, avoidances, or standard-shifts they would reject if the preferred conclusion were reversed, thereby corrupting the belief-fixation process without admitting the corruption. This definition captures the directional bias of cases 1 and 3, the procedural opacity of case 5, and the avoidance strategy of case 6, while excluding general incompetence (case 4) and altruistic masking (case 2). It treats self-deception as a structural failure in how evidence is processed rather than merely holding a false belief.

  **Clause by clause, with the case that motivates each**

  "Motivated manipulation" is required to exclude Case 4. If we drop this, any cognitive bias becomes self-deception, losing the specific pathology of self-serving error. Case 4's colleague is biased, but not toward his own interest; without the motivation clause, he is self-deceived about homeopathy and his driving equally, which dilutes the term.

  "Sustaining a preferred conclusion" targets Cases 1 and 3, where the outcome protects ego or investment. Without it, we cannot distinguish SD from honest mistakes. The grad student isn't just wrong; he stopped looking when he won.

  "Subjective appearance of objectivity" is crucial for Case 5. The surgeon believes his data is clean. If we drop sincerity, Case 5 becomes fraud, not SD. It also excludes Case 2; the friend lacks the appearance of objectivity regarding her death—she knows the truth but masks it. She is deceiving others, not herself. Case 2 is the critical negative control. The friend speaks falsely but believes truly. Without this clause, her kindness is indistinguishable from the colleague's ego defense. The clause ensures that self-deception requires the agent to be the primary victim of the distortion, not just the source. This preserves the moral distinction between lying to comfort others and lying to comfort oneself.

  The "Reversibility" clause (would reject procedures if conclusion reversed) is your insight from Case 1. It separates the senior colleague from the poor judge. Without it, we cannot explain why the colleague accepts similar designs elsewhere. It proves the standard shifted, not the evidence.

  Finally, defining it as a "structural failure in processing" rather than "holding a false belief" accommodates Case 6. The man avoids forming a belief. If we require a settled false belief, Case 6 vanishes. This clause also stretches to Case 7, where the structure fails regarding desire rather than fact. The agent manipulates their self-perception to maintain a preferred self-image (non-competitive) despite evidence (fury). Each clause tightens the net around your specific verdicts while excluding clear non-cases. The interaction between "motivated" and "reversibility" is vital. Motivation explains the direction; reversibility proves the mechanism. In Case 3, the student is motivated by publication; reversibility shows he wouldn't have stopped at non-significance. In Case 5, the surgeon is motivated by reputation; reversibility shows he wouldn't exclude referrals if mortality were low. Without linking these, Case 5 looks like incompetence. The "structural failure" clause binds them: it locates the error in the *how*, not the *what*. This allows us to catch Case 6's avoidance without demanding a belief, while the "preferred conclusion" clause ensures Case 2's altruism doesn't count. The principle holds because each clause blocks a specific escape route your cases identify.

  **What my estimator account gets right, and where it must be repaired**

  Your estimator account is excellent on Cases 1, 3, and 4. The "directional error" and "reversibility test" perfectly isolate motivated bias from general incompetence. However, it fails on Case 6 because it requires an "estimate" or belief to be biased. The sailor forms no belief; he avoids the estimation entirely. To repair this, you must expand "belief-fixation" to include "information-regulation." Self-deception can be the successful prevention of belief formation when the likely belief is unwanted.

  Regarding Case 7, your account specifies "belief," but the acquaintance deceives himself about a *desire*. The repair requires acknowledging that the "estimate" can be about one's own internal states, not just external facts.

  For Case 5, you worry about locating the moment of error. Your account implies a discrete decision point. The repair is to view the error as distributed across the itinerary. The exclusion rule wasn't a single moment but a habit reinforced by each successful exclusion. The bias enters through the accumulation of unrecorded judgements, not a single switch. Your core insight holds, but the "estimate" must be viewed as a dynamic process, not a static output.

  **Which of my verdicts you cannot keep**

  I must be blunt. Surrender Case 6. You argue to keep the verdict and drop the false belief requirement. This is a category error. Self-deception entails a conflict between evidence and belief. Case 6 exhibits a conflict between evidence and attention. That is motivated ignorance, not deception. By keeping it, you force your principle to cover non-belief states, diluting its precision on Cases 1 and 5. You lose the ability to distinguish between lying to oneself (Case 1) and hiding from the truth (Case 6). The latter is often rational; the former is rarely so. Keep the principle tight: deception requires a deceived mind, not merely an uninformed one.

  Case 7 is also vulnerable. Deceiving oneself about a desire is distinct from deceiving oneself about a fact. Keeping it requires stretching "evidential itinerary" to "emotional monitoring." I recommend dropping Case 7 to keep the epistemic focus sharp. However, Case 6 is the greater threat to coherence. If you retain Case 6, your principle becomes a theory of motivated irrationality generally, not self-deception specifically. You gain coverage but lose definition. I advise sacrificing Case 6 to preserve the core distinction between biasing a belief and avoiding one. The cost is losing a label for the sailor, but the gain is a principle that cleanly separates your clearest cases (1, 3, 5) from mere avoidance.

