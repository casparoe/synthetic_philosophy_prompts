answer: |-
  **Project Title:** Fragmentary Truthlikeness: A Local Metric for Scientific Progress in False Frameworks

  **The Problem**
  The literature on verisimilitude is stuck. Since Popper's original definition collapsed under the Miller-Tichý theorem, we've known that you can't simply rank false theories by their logical content. Adding true consequences to a false theory doesn't necessarily make it "closer" to the truth; often, it makes it logically worse off. The standard response has been to tweak the logic—using similarity classes, possible worlds, or content parts—but these all share a blind spot. They treat the *theory* as the unit of analysis. They ask, "Is Theory A closer to the truth than Theory B?"

  But scientists don't actually talk like that. When we look at history, we say phlogiston chemistry was "wrong" but still captured real structural relations about combustion. We say caloric theory was "false" but got the thermodynamics right. We intuitively recognize progress even when the global ontology is busted. The mistake isn't in the logic of truthlikeness; it's in the granularity. We are trying to measure the distance of a whole map when we should be measuring the accuracy of specific routes within it.

  **Research Question**
  Can we define a metric of verisimilitude applied to *explanatory fragments* within false theories that avoids the Miller-Tichy collapse and accounts for scientific progress during ontology shifts?

  Specifically: If we decouple local structural relations from global ontological commitments, does a distance metric over fragments preserve ordering under theory change?

  **Why the Global Literature Doesn't Settle This**
  The existing debate assumes theories are monolithic blocks of propositions. Popper's content approach fails because false theories have infinite false consequences. Niiniluoto's similarity approaches struggle because defining "similarity" between whole worlds is notoriously context-dependent. Structural Realism (Worrall et al.) gets close by arguing structure is retained across theory change, but it sidesteps the question of *truthlikeness*. It says structure stays, but it doesn't quantify how *close* that structure is to the truth.

  My project moves the goalpost. Instead of asking if the *ontology* is true, I ask if the *inferential role* of a fragment is truth-like. This dodges the Miller-Tichy problem because we aren't comparing logical content strength; we are comparing functional mapping accuracy. If phlogiston theory predicts weight gain during oxidation via a specific causal chain, and oxygen theory predicts the same via a different chain, the *fragment* (the predictive relation) retains verisimilitude even if the *entity* (phlogiston) does not exist.

  **Methodology**
  I propose a three-step approach over four months:

  1.  **Formalizing Fragments:** I will define an "explanatory fragment" not as a logical consequence, but as a localized causal or counterfactual map. Instead of $T \vdash p$, we look at $Fragment \models (Condition \rightarrow Outcome)$. This shifts the metric from truth-conditions to structural preservation.
  2.  **Metric Construction:** I will sketch a distance function $d(f, t)$ where $f$ is a fragment and $t$ is the target truth. This won't be a full axiomatic system (that's years of work) but a working formalization sufficient to compare fragments across theory change. The key is ensuring the metric is insensitive to ontological labels but sensitive to structural relations.
  3.  **Historical Pilot:** I will test this against two standard cases: Phlogiston vs. Oxygen chemistry and Caloric vs. Kinetic theory. The goal is to see if the metric ranks the "false" theory's fragments as high-verisimilitude where historians agree progress was made, and low-verisimilitude where the theory failed.

  **Success vs. Failure**
  *   **Positive Result:** I produce a formal sketch showing that fragment-based metrics remain stable even when global ontology shifts. The historical cases show that "good" false theories have high local verisimilitude fragments, explaining why we retain them in textbooks despite their falsity.
  *   **Negative Result:** It turns out fragments are too context-dependent to be isolated from the global theory. If extracting a fragment requires so much background theory that the fragment inherits the global falsity, the project fails. This is still a valuable result—it proves the holism of verisimilitude.
  *   **Scope Failure:** Getting bogged down in formal logic proofs. To avoid this, I will prioritize conceptual clarity and case study application over rigorous proof theory.

  **Scope and Timeline (4 Months)**
  Four months is tight for formal philosophy. I am not promising a new logic of verisimilitude that solves the demarcation problem. I am promising a *proof of concept*.

  *   **Month 1:** Literature deep-dive and precise definition of "fragment." Avoiding the trap of making fragments just small theories.
  *   **Month 2:** Drafting the formal metric. Keeping it simple—likely using graph-theoretic distance or counterfactual dependence rather than heavy modal logic.
  *   **Month 3:** Running the historical cases (Phlogiston/Caloric). This is the reality check.
  *   **Month 4:** Writing the final paper. Targeting a journal like *Philosophy of Science* or *British Journal for the Philosophy of Science*.

  **Risk Management**
  The biggest risk is that "fragment" is ill-defined. If I can't separate a fragment from its theoretical context without losing its meaning, the metric collapses. I will mitigate this by focusing on *predictive* fragments (input-output relations) rather than *mechanistic* fragments, as the former are easier to isolate across theory change.

  This project doesn't just tweak the old verisimilitude debate; it changes the unit of analysis. If successful, it shows that scientific progress isn't about swapping false theories for true ones, but about accumulating truth-like fragments within changing frameworks. That's a result worth four months of work.
