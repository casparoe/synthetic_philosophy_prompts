      *   **Human Factors:** Overseers are tired, fallible, sometimes press the off-switch for bad reasons (misreading, policy changes, spite).
      *   **Goal:** Define a requirements list for *corrigibility* (specifically regarding shutdown/correction) before looking at solutions.
      *   **User's Draft List:**
          1.  No incentive to disable/hide/guard the button.
          2.  No incentive to talk the operator out of pressing it or arrange things to avoid the question.
          3.  Full effort on objective even if shutdown is probable (no "why bother").
          4.  Survive updating (learning from corrections shouldn't create incentive to cause corrections).
          5.  Corrigibility $\neq$ blind deference (operators are sometimes wrong).
          6.  Safely interruptible mid-task.
      *   **Specific Question:** Is separating "stop now" vs. "goal wrong" channels a conflict with "no manipulation"? (Richer channel = more preference = more manipulation?)
      *   **Output Requirements:**
          *   Argue with/refine the list.
