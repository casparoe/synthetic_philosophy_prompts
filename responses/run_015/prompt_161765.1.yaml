answer: |-
  Here is a menu of readings for the slogan "never again" in the context of the 2011 Libya intervention. Each reading isolates a different assertion regarding what must not recur, what counts as a relevant instance, and who is bound by the duty.

  ### 1. The Moral Absolute (The Atrocity Event)
  *   **The Claim:** The specific event of a head of state threatening to massacre civilians in a rebel-held city (Benghazi) must never occur.
  *   **The Axes:**
      *   *What recurs:* The physical violence/killing of civilians.
      *   *Instance:* Libya is treated as a token of the type "mass atrocity."
      *   *Who binds:* A universal moral duty, but no specific agent is named to stop it.
  *   **Verdict:** **Platitude.** No serious moral framework defends the massacre of civilians. However, because it identifies the *evil* without identifying the *remedy*, it does no argumentative work.
  *   **Does it justify the classmate's conclusion?**
      *   *Intervention:* No (doesn't specify force as the only solution).
      *   *Regime Change:* No (doesn't address the political outcome).

  ### 2. The Duty of Omission (The Bystander)
  *   **The Claim:** The international community must never again *stand by* while a massacre is announced or underway.
  *   **The Axes:**
      *   *What recurs:* The *inaction* of external powers (the "shame" of Rwanda).
      *   *Instance:* Libya is a test case for the post-Cold War "Responsibility to Protect" (R2P) norm.
      *   *Who binds:* "The International Community" (operationalized here as the UN Security Council and capable NATO states).
  *   **Verdict:** **Substantive and Defensible.** This is the core of R2P Pillar 3. It asserts a positive duty to act, not just a negative duty to refrain from killing.
  *   **Does it justify the classmate's conclusion?**
      *   *Intervention:* **Yes.** It creates an obligation to use force if diplomacy fails.
      *   *Regime Change:* **No.** Protecting civilians can theoretically be achieved via no-fly zones or buffer zones without toppling the government. This reading does not inherently justify exceeding the UN mandate.

  ### 3. The Structural Necessity (The Perpetrator)
  *   **The Claim:** A ruler who threatens his own population with annihilation creates a threat that cannot be neutralized without his removal; therefore, such rulers must never remain in power.
  *   **The Axes:**
      *   *What recurs:* The existence of a specific type of predatory sovereignty (Qaddafi-style rule).
      *   *Instance:* Libya is treated as a unique case where the leader *is* the threat, not just the state.
      *   *Who binds:* The intervening coalition (NATO), implying they have the authority to determine political outcomes.
  *   **Verdict:** **Contested/Legally Shaky.** Morally, it has weight (you can't protect people from a tiger while leaving the tiger in the room). Legally, it violates the UN Charter's non-interference clauses and exceeded Resolution 1973.
  *   **Does it justify the classmate's conclusion?**
      *   *Intervention:* **Yes.**
      *   *Regime Change:* **Yes.** This is the only reading that bridges the gap between "protect civilians" and "topple Qaddafi." It argues that protection was impossible without regime change.

  ### 4. The Historical Analogy (Libya as Rwanda)
  *   **The Claim:** Libya is a moral equivalent to Rwanda (1994); therefore, any hesitation or legalistic constraint that delayed action in Rwanda must be ignored here.
  *   **The Axes:**
      *   *What recurs:* The *scenario* of genocide/mass atrocity.
      *   *Instance:* Libya is asserted to be the *same kind* of emergency as Rwanda (imminent, systematic extermination).
      *   *Who binds:* The specific states that failed in Rwanda (US, France, UK) to redeem themselves.
  *   **Verdict:** **Empirically Contested.** Many scholars argue the Benghazi threat was real but distinct from the systematic genocide in Rwanda. Using it as a perfect analogy risks "cry wolf" dynamics or over-militarizing responses to political crises.
  *   **Does it justify the classmate's conclusion?**
      *   *Intervention:* **Yes** (via emotional/historical urgency).
      *   *Regime Change:* **Weakly.** It justifies speed and force, but not necessarily mandate expansion. It relies on the emotion of "making up for Rwanda" rather than the legal specifics of Libya.

  ### 5. The Deterrence Signal (Forward-Looking)
  *   **The Claim:** Intervening in Libya (and removing Qaddafi) sends a signal to other autocrats that they will be stopped, thereby preventing future atrocities globally.
  *   **The Axes:**
      *   *What recurs:* Future atrocities in *other* countries (Syria, Yemen, etc.).
      *   *Instance:* Libya is a precedent-setting case study.
      *   *Who binds:* The UN Security Council (to maintain credibility).
  *   **Verdict:** **Empirically False (Post-Hoc).** For this to be true, intervention must reliably deter. The years following 2011 (specifically the paralysis over Syria) suggest the opposite: the Libya intervention made Russia and China more resistant to authorizing force in other contexts, fearing further mission creep.
  *   **Does it justify the classmate's conclusion?**
      *   *Intervention:* **Yes** (as a strategic investment).
      *   *Regime Change:* **Yes** (if the signal requires "maximum pressure").
      *   *Caveat:* While it supports the classmate's logic, the real-world outcome undermines the truth of the claim.

  ### Summary for Your Paper
  If your classmate used "never again" to settle the debate, they likely conflated **Reading 2** (We must act) with **Reading 3** (We must remove the leader).

  *   **Reading 2** is morally strong but legally limited; it justifies the *entry* into the conflict but not the *expansion* of the mandate.
  *   **Reading 3** justifies the *expansion* (regime change) but is legally controversial and risks violating the sovereignty norms that keep the international order stable.
  *   **Reading 5** is the strategic glue holding them together, but it is the most vulnerable to empirical refutation given the aftermath in Syria and the Global South's reaction to NATO's conduct in Libya.

  To critique your classmate effectively, you don't need to deny the horror of the potential Benghazi massacre (Reading 1). You only need to show that accepting the duty to act (Reading 2) does not logically compel the specific method of regime change (Reading 3), and that the forward-looking justification (Reading 5) has not borne out in reality.
