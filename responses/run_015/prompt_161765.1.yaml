      *(Final check on "What counts as an instance")*: I will ensure the analogy reading addresses whether Libya is treated as a unique case or a token of a type (Rwanda).

      Okay, ready to write. The structure will be: Introduction acknowledging the complexity, The Menu of Readings (numbered), and a Brief Synthesis on the Classmate's Argument.

      *Wait, one more thing:* The prompt asks "which readings would be strong enough to do what my classmate wanted." I need to be explicit about that in the verdict section of each item.

      *Let's structure each item as:*
