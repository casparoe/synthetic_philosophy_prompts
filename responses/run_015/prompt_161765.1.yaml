prompt: |-
  hey — i'm in a seminar on humanitarian intervention and in our last session on Libya someone basically ended the whole discussion with "never again," like it settled it: NATO had to go in, and the fact that the mission slid from protecting civilians into helping topple Qaddafi was at most a footnote. I dont think that slogan is one claim, I think it's several, and I want to pull them apart before I write my response paper.

  Can you lay out, as a list, the different precise things "never again" could be asserting here? The axes I can see but can't cleanly separate: what exactly is supposed never to recur — the atrocity itself, the standing by while it happens, or the specific mechanism (a ruler massacring the population of a city that has already rebelled against him); what counts as an instance of the same thing again, i.e. is Libya supposed to be a repeat of Rwanda/Bosnia or just of a type; and who the "never" actually binds — every state, the state that can act at lowest cost, the Security Council, or "the international community" as some collective that may not really be an agent with duties at all.

  For each reading say whether it's a platitude nobody denies, a substantive and defensible moral claim, or actually false, and — the bit I care about — which readings would be strong enough to do what my classmate wanted, namely show that going in was required and that overrunning a civilian-protection mandate into regime change was basically fine. There's also that forward-looking version where intervening now is supposed to deter atrocities elsewhere; flag what that reading needs to be true and whether it's supported by what happened in the years after Libya. No citations needed, just the menu of readings with verdicts.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A seminar on humanitarian intervention, specifically discussing the 2011 Libya intervention (UNSC Res 1973).
      *   **Trigger:** A classmate ended a discussion with "never again," implying it settled the debate (NATO *had* to intervene, mission creep to regime change was acceptable).
      *   **Task:** Deconstruct the slogan "never again" into a list of precise assertions/readings.
      *   **Required Axes of Analysis:**
          *   What is supposed never to recur? (Atrocity, inaction, specific mechanism?)
          *   What counts as an instance? (Libya = Rwanda/Bosnia or just a type?)
          *   Who is bound? (Every state, capable state, UNSC, "international community"?)
          *   Evaluation: Platitude, substantive/defensible, or false?
          *   Relevance to Classmate's Argument: Does this reading justify *intervention* AND *mission creep* (regime change)?
          *   Deterrence Angle: Forward-looking claim about preventing future atrocities elsewhere.
      *   **Constraint:** No citations needed, just a menu of readings with verdicts.

  2.  **Deconstruct "Never Again" in this Context:**
      *   The phrase originates from the Holocaust but was heavily repurposed during the Rwanda genocide (1994) to signify a commitment to prevent mass atrocities.
      *   In the Libya context (2011), it was used to justify R2P (Responsibility to Protect).
      *   The classmate is using it as a *trump card* to justify both the *initiation* of force and the *expansion* of the mandate.

  3.  **Drafting the Readings (Iterative Process):**

      *   *Reading 1: The Absolute Prohibition of Atrocity (The Event)*
          *   Claim: Massacres like Benghazi must never happen.
          *   Status: Platitude. Everyone agrees massacres are bad.
          *   Relevance: Doesn't justify *how* to stop it or mission creep.

      *   *Reading 2: The Duty to Act (The Inaction)*
          *   Claim: The international community must never stand by while massacres happen.
          *   Status: Substantive (R2P Pillar 3). Defensible but contested on *how*.
          *   Relevance: Justifies going in, but not necessarily regime change.

      *   *Reading 3: The Specific Mechanism (The Dictator Threat)*
          *   Claim: A ruler threatening a rebel city must never be allowed to follow through.
          *   Status: Substantive.
          *   Relevance: Closer to justifying regime change (Qaddafi had to go to stop the threat), but risky.

      *   *Reading 4: The Historical Analogy (Libya = Rwanda)*
          *   Claim: This is exactly like Rwanda, so we must do the opposite of what we did then.
          *   Status: Contested/False. Libya wasn't a genocide in the same systematic way.
          *   Relevance: Emotional leverage, but analytically weak for mandate expansion.

      *   *Reading 5: The Agent of Duty (Who binds?)*
          *   Claim: The "International Community" (UN/NATO) must act.
          *   Status: Substantive.
          *   Relevance: Justifies NATO action, but UNSC mandate was specific (civilian protection).

      *   *Reading 6: The Means Justify the Ends (Mission Creep)*
          *   Claim: To ensure "never again," we must remove the source of the threat (Qaddafi), even if the mandate was narrower.
          *   Status: Highly Controversial/False (legally).
          *   Relevance: This is the core of the classmate's argument.

      *   *Reading 7: The Deterrence Claim (Forward-Looking)*
          *   Claim: Intervening here signals to other dictators that they will be stopped.
          *   Status: Empirically questionable (look at Syria).
          *   Relevance: Justifies intervention, but post-hoc evidence weakens it.

  4.  **Refining and Categorizing (Matching the Prompt's Requirements):**
      *   Need to ensure I address the specific axes: *What recurs?*, *What counts as instance?*, *Who is bound?*
      *   Need to evaluate: *Platitude, Substantive, False.*
      *   Need to evaluate: *Does it support the classmate's conclusion (Intervention + Regime Change)?*
      *   Need to address the *Deterrence* aspect specifically.

  5.  **Developing the Content (Mental Draft & Polish):**

      *   *Reading 1: The Moral Absolute (Atrocity Prevention).* Focus on the event. Verdict: Platitude. Doesn't justify means.
      *   *Reading 2: The Duty of Omission (Inaction).* Focus on the bystander. Verdict: Substantive (R2P). Justifies entry, not necessarily exit strategy/creep.
      *   *Reading 3: The Structural Necessity (Regime Change).* Focus on the perpetrator. Verdict: Controversial. This is the only one that justifies creep, but it's legally shaky.
      *   *Reading 4: The Historical Imperative (Rwanda Analogy).* Focus on the comparison. Verdict: Contested. Emotional weight, weak logic for creep.
      *   *Reading 5: The Deterrence Signal (Future Prevention).* Focus on the future. Verdict: Empirically weak post-Libya.

      *Self-Correction on "Who is Bound":* I should integrate the "Who" into the readings rather than making it a separate list, as the prompt asks to lay out the *assertions* "Never Again" makes. I will make sure each reading specifies the agent.

      *Refining the "Classmate's Goal":* The classmate wants to prove 1) Intervention was required, and 2) Regime change was fine. I need to be clear which readings support 1, which support 2, and which support both.

  6.  **Final Review against Constraints:**
