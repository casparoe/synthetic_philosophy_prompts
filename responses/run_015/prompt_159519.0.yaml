      *   *Resistance:* By the end, Ai's love for Estraven transcends the gendered categorization. If the default remained intact, the intimacy would feel homosexual (in a 1960s context) or weird. But it feels human. This suggests immersion *can* erode the default, contrary to the "neutral word" theory.
