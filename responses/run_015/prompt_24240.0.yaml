answer: |-
  You have independently reconstructed **Fitch's Paradox of Knowability** (also known as the Church-Fitch Paradox). Your derivation is valid within standard classical epistemic logic. The conclusion you find unacceptable ($p \to Kp$, often called the **Omniscience Principle**) is the standard result of combining Factivity, Logical Omniscience, and the Unrestricted Knowability Principle.

  Since you wish to retain **Logical Omniscience** (as a feature of ideal agency) and the **existence of unknown truths** (to allow for discovery), you are logically compelled to restrict the **In-Principle Knowability (IPK)** principle.

  Here is an analysis of how to restrict IPK in a principled way, and what that costs your formalization.

  ### 1. The Diagnosis
  The paradox arises because the proposition $\phi = p \land \neg Kp$ is a **Moorean sentence** (specifically, an omissive Moorean sentence).
  *   It is possible for $\phi$ to be true (you can be ignorant of a truth).
  *   It is *impossible* for $\phi$ to be *known* (because $K(p \land \neg Kp)$ entails $Kp \land K\neg Kp$, which entails $Kp \land \neg Kp$, a contradiction).

  Your IPK axiom states: $\forall \phi (\phi \to \Diamond K\phi)$.
  When you instantiate this with the Fitch-proposition $\phi = p \land \neg Kp$, you assert that a logically unknowable truth is possibly known. This is the source of the explosion.

  ### 2. The Solution: Restricting Knowability
  To block the paradox while keeping your other constraints, you must restrict the domain of propositions to which IPK applies. There are two main principled strategies for doing this.

  #### A. The Cartesian Restriction (Semantic)
  You restrict IPK to **Cartesian propositions**. A proposition $\phi$ is Cartesian if it is consistent that it is known (i.e., $\Diamond K\phi$ is not logically false).
  *   **Revised Axiom:** $\forall \phi (\text{Cartesian}(\phi) \land \phi \to \Diamond K\phi)$.
  *   **Why it is principled:** It aligns knowability with logical possibility. It asserts that "every truth *that can be known* is possibly known." It treats the impossibility of knowing $p \land \neg Kp$ as a logical limit on knowledge, similar to how logic limits what can be true.
  *   **Effect on your derivation:** The step $\Diamond K(p \land \neg Kp)$ is no longer licensed, because $p \land \neg Kp$ is not Cartesian. The derivation halts, and $p \land \neg Kp$ can remain true without implying omniscience.

  #### B. The Non-Epistemic Restriction (Syntactic)
  You restrict IPK to **non-epistemic propositions** (propositions that do not contain the knowledge operator $K$).
  *   **Revised Axiom:** $\forall \phi (\text{Atomic}(\phi) \land \phi \to \Diamond K\phi)$, where $\phi$ contains no epistemic operators.
  *   **Why it is principled:** This distinguishes between **worldly truths** (facts about the environment) and **epistemic truths** (facts about the agent's relation to the environment). It is plausible to claim an ideal agent can come to know any fact about the world, without claiming they can know facts about their own ignorance (which are inherently unstable).
  *   **Effect on your derivation:** The proposition $p \land \neg Kp$ contains $K$, so IPK does not apply to it. You can maintain that $p$ (if non-epistemic) is possibly knowable, while maintaining that the conjunction $p \land \neg Kp$ is not.

  ### 3. The Cost: Essential Unknowability
  Rejecting the unrestricted IPK principle comes with a specific philosophical cost: **You must accept that some truths are essentially unknowable.**

  By restricting IPK, you are admitting that there are true propositions (specifically those involving the agent's own ignorance) that are **never** knowable, even by an ideal agent, even in principle.
  *   **Impact on Realism:** This supports a **Realist** conception of truth. Truth outruns knowability. There are facts about the world (e.g., "It is raining and I do not know it") that obtain, but which cannot be verified/known without ceasing to obtain.
  *   **Impact on Verificationism:** This rejects strong Verificationism (the idea that truth *consists* in knowability). If you were hoping to model a verificationist agent, this restriction undermines that project. However, for a standard rational agent model, this is usually the preferred cost.

  ### 4. Recommendation for Your Formalization
  Given your goal to model an **ideal rational agent** who can still **learn**, I recommend the **Cartesian Restriction**.

  1.  **Keep Logical Omniscience:** $K(\phi \land \psi) \to K\phi \land K\psi$.
  2.  **Keep Factivity:** $K\phi \to \phi$.
  3.  **Replace IPK:** Replace $\phi \to \Diamond K\phi$ with $(\Diamond K\phi \land \phi) \to \Diamond K\phi$ (which is tautological) or, more usefully, adopt the axiom:
      $$ \phi \to \Diamond K\phi \quad \text{for all } \phi \text{ such that } \neg \Box \neg K\phi $$
      *(Read: If $\phi$ is true, it is possibly known, provided it is not necessarily unknown.)*

  **Why this preserves "Discovery":**
  This formalization allows for a state of the world where $p$ is true and $\neg Kp$ is true.
  *   The agent does not know $p$ yet.
  *   It is possible for the agent to come to know $p$ (since $p$ is Cartesian).
  *   If the agent comes to know $p$, the proposition $p \land \neg Kp$ becomes false.
  *   This accurately models **learning**: The act of knowing $p$ changes the truth value of the proposition "I do not know $p$."

  ### Summary
  You should reject the **unrestricted In-Principle Knowability** principle.
  *   **Replacement:** Restrict knowability to propositions that are consistent with being known (Cartesian propositions).
  *   **Cost:** You must accept that "Fitch-conjunctions" (truths about one's own ignorance) are essentially unknowable.
  *   **Benefit:** This preserves the distinction between truth and knowledge ($p \not\to Kp$), allows for unknown truths, and avoids the collapse into omniscience, all while maintaining the agent's logical idealization.

  This is the standard resolution in contemporary epistemic logic (championed by philosophers like Timothy Williamson and Dorothy Edgington) and is not considered *ad hoc* because it relies on the logical properties of the knowledge operator itself.
