prompt: |-
  Please explain the conceptual structure of Gödel's modal ontological argument, focusing specifically on the move from the claim that God-like properties are positive to the conclusion that a being with all positive properties exists necessarily in at least one possible world, and then actually in all worlds. Then, examine a proposed inversion of this framework: instead of treating necessary existence as the culmination of positive properties, treat maximal contingency—defined as lacking any essential properties—as the defining negative property, and ask whether a parallel modal argument could establish that a maximally contingent being necessarily exists. In your explanation, clarify whether Gödel's reliance on the axiom that positive properties are necessarily positive creates an asymmetry that blocks this inversion, or whether the inversion fails for reasons independent of that axiom, such as contradictions in the definition of contingency itself. Avoid formal symbolization; aim for a conceptual analysis that shows exactly where the logical pressure lies in both directions.
