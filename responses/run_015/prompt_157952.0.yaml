      *   *Refining the "Logical Pressure":* The pressure in Gödel is: Consistency $\rightarrow$ Possibility $\rightarrow$ Necessity (via S5). The pressure in Inversion is: Lack of Essence $\rightarrow$ Impossibility of Necessary Existence.

  6.  **Review against Constraints:**
