      *   *Let's trace the parallel:*
          *   Gödel: Positive $\rightarrow$ Necessary Existence.
          *   Inversion: Negative (or Null) $\rightarrow$ Contingent Existence?
          *   The prompt asks: Can we argue a maximally contingent being *necessarily exists*?
      *   *The Conflict:* If a being necessarily exists, it has the property of "Necessary Existence." Is "Necessary Existence" an essential property? Yes. So a being that *necessarily exists* cannot be "Maximally Contingent" (defined as lacking essential properties).
      *   *Refining the Inversion:* Perhaps the argument tries to say: "It is a negative property to be constrained. Therefore, the 'most negative' being is unconstrained. Does this unconstrained being exist necessarily?"
      *   *The Logical Pressure Point:* The definition of "Necessary Existence" in Gödel's system is tied to "Essence." If $x$ exists necessarily, $x$'s existence follows from its essence. If a being has *no* essence (Maximal Contingency), its existence cannot follow from its essence. Therefore, it cannot exist necessarily *by virtue of its nature*.

  4.  **Part 3: Analyzing the Asymmetry (Gödel's Axiom vs. Definition):**
