      *   *Core Idea:* It's a modal logic version of Anselm/Leibniz. It defines "God-like" based on "Positive Properties."
      *   *Key Definitions:*
          *   Positive Property: Aesthetic/moral attribute (good-making), not just logical consistency.
          *   God-like: Possessing *all* positive properties.
          *   Essence: A property that entails all other properties of the being.
          *   Necessary Existence: If a being has an essence, it exists in all possible worlds.
      *   *Key Axioms:*
          1.  If $P$ is positive, $\neg P$ is not positive (Consistency).
          2.  If $P$ is positive, it is *necessarily* positive (Stability across worlds).
          3.  Being God-like is itself a positive property (or entails necessary existence).
          4.  Necessary Existence is a positive property.
      *   *The Move (The "Logical Pressure"):*
          1.  Possibility: It is *possible* that a God-like being exists (Leibniz's premise). Why? Because positive properties are consistent (Axiom 1).
          2.  From Possible to Necessary: In S5 modal logic, if something is *possibly necessary*, it is *actually necessary*.
          3.  Gödel shows that if a God-like being exists in *one* world, its essence (God-likeness) entails Necessary Existence. Therefore, it exists in *all* worlds.
      *   *Summary of the Flow:* Positive Properties $\rightarrow$ Consistency $\rightarrow$ Possible Existence $\rightarrow$ Essence entails Necessary Existence $\rightarrow$ Necessary Existence is Positive $\rightarrow$ God exists in all worlds.

  3.  **Part 2: The Proposed Inversion (Maximal Contingency):**
