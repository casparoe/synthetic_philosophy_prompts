answer: |-
  This is a sophisticated brief. You have correctly identified that the danger in teaching thought experiments (TEs) is not confusion, but *misattribution of authority*. If they leave thinking the authority comes from the picture, you have failed. If they leave thinking the authority comes from the logic alone, you have obscured how the premise was secured.

  Here is the judgment on your components and the sequence required to build the specific ability you named: isolating the operative premise and distinguishing its weight from the vividness of the picture.

  ### 1. The Three-Way Sort and Sequence

  Your sorting (Extraction, Recruitment, Calibration) carves near the joints. It is sufficient; you do not need a fourth kind. Adding a fourth would dilute the fifty minutes. However, the ordering is critical to avoid the specific epistemic errors you fear.

  **The Sequence:**
  1.  **Extraction (Minutes 5–15)**
  2.  **Recruitment (Minutes 15–30)**
  3.  **Calibration (Minutes 30–40)**

  **Why this order?**
  *   **Extraction First:** You must establish that a TE is an *argument* before you discuss how the premises are *secured*. If you open with Recruitment (vividness), the "pop physics" students will immediately categorize the session as psychology/relativism ("It's just intuition"). If you open with Calibration (broken intuition), the "biology" students will categorize it as skepticism ("Intuitions are useless"). Opening with Extraction grounds the TE in logic. It asserts: *The verdict follows from the premises.* This creates a baseline of authority.
  *   **Recruitment Second:** Once they accept it is an argument, you ask: *Where did we get the premise?* This is where you introduce the risk of vividness. You show them that sometimes we assent to a premise only because the picture makes it hard to deny. This addresses the "fake science with better publicity" worry directly. It validates their skepticism without surrendering the method.
  *   **Calibration Third:** Finally, you show what happens when the recruited premise fails. This prevents the "decoration" view. It shows TEs are not just for confirming what we know (Extraction) or persuading us (Recruitment), but for testing the reliability of the machinery that generates premises. Ending here leaves them with the idea that TEs are *tools for repair*, which is the strongest defense against "party tricks."

  **The Risk:** If you open with Recruitment, you generate relativism (authority = vividness). If you close with Extraction, you generate the view that TEs teach nothing new (authority = tautology). The E-R-C sequence avoids both.

  ### 2. The Mirror Case (The Turntable)

  **Judgment:** The turntable mirror is fair and structurally sound. It isolates "uniform motion" from "acceleration/rotation" while holding "sealed cabin" constant.

  **The Mach/Einstein Objection:**
  A student who knows Mach will argue that rotation is only detectable relative to the fixed stars, and that in a truly empty universe, rotation might be undetectable. This is physically nuanced but logically dangerous for your session.

  **How to handle it:**
  Do not argue the physics. Argue the *structure*.
  *   **Say this:** "You are right that in advanced general relativity, the status of rotation is debated. But for the purpose of *this* argument, we are testing whether the *sealed nature of the room* is the operative premise. If rotation is detectable in a sealed room (which everyone agrees it is, via water in a bucket or force on a wall), then 'sealed room' cannot be the sole reason uniform motion is undetectable. The Mach objection changes the *physics*, but it does not save the *argument structure* of the original TE."
  *   **Why:** This validates the student's knowledge without letting them derail the lesson on argument isolation. You are teaching them to analyze the *TE*, not to settle the *cosmology*.

  ### 3. The Carrier Case (The Ship's Cabin)

  **Criteria Check:**
  *   **Verdict reachable:** Yes. (Dropping a ball looks the same).
  *   **Premise statable:** Yes. ("Physical laws operate identically in all uniform motion frames").
  *   **Admits a mirror:** Yes. (The Turntable).
  *   **No moral stakes:** Yes.
  *   **No inconsistency:** Yes.

  **Does it qualify?**
  Yes, it is the optimal carrier. It is historically weighty enough to command respect but simple enough for the biology students to grasp.

  **One Correction:**
  You stated the premise must be statable in one sentence. Ensure that sentence does not contain the conclusion.
  *   *Bad Premise:* "The ship is moving but we can't tell." (This is the verdict).
  *   *Good Premise:* "The laws of mechanics do not depend on the constant velocity of the laboratory."
  *   **Instruction:** When you put this on the board, explicitly circle the word "laws." The TE teaches us about the *laws*, not the *ship*.

  ### 4. Misconceptions: Pre-emption vs. Dismantling

  You cannot head off every misconception without sounding defensive. You must let some breathe so they can be killed publicly.

  1.  **"A fiction can stipulate anything."**
      *   **Strategy:** **Pre-empt** (Minute 5).
      *   **Action:** In the Extraction phase, state clearly: "A TE cannot violate the rules it sets for itself. If the cabin leaks, the experiment is void, not profound."
  2.  **"A vivid picture is self-supporting."**
      *   **Strategy:** **Invite and Dismantle** (Minute 20).
      *   **Action:** During Recruitment, ask: "Why did you believe the premise?" When they say "Because I can see it," show them a vivid picture that leads to a false conclusion (e.g., a heavy ball falls faster than a light one—very vivid, false). This severs the link between vividness and truth.
  3.  **"A clash of intuitions ends the conversation."**
      *   **Strategy:** **Dismantle** (Minute 35).
      *   **Action:** In Calibration, when the Turntable creates a different verdict than the Cabin, do not let them shrug. Force the question: "Which intuition is broken?" This teaches that clashes are data, not stop-signs.
  4.  **"TEs are cheap experiments / replace real ones."**
      *   **Strategy:** **Pre-empt** (Minute 5).
      *   **Action:** "A TE clarifies what we *mean* by an experiment. It does not tell us what the measurement *will be*. We still need the ship."
  5.  **"TEs are mere psychology."**
      *   **Strategy:** **Dismantle** (Minute 40).
      *   **Action:** This is the final takeaway. "Psychology explains why you *believed* the premise. Logic explains why the conclusion *follows*. We are studying the logic."

  ### 5. The Check (Minute 40)

  **The Task:** Hand them an unfamiliar case. Ask for: (A) The single operative premise, and (B) A mirror case that tests it.

  **Suggested Case:** **Einstein's Elevator** (An observer in a closed elevator cannot distinguish between gravity and uniform acceleration).
  *   *Why:* It mirrors the Cabin (sealed box, indistinguishability) but changes the force (gravity vs. motion). It is unfamiliar to the biology students but accessible.

  **Does it test uptake?**
  Yes. It forces them to separate the *picture* (an elevator) from the *principle* (equivalence of frames).

  **What a Failing Answer Looks Like:**
  *   **Failure Type 1 (The Conclusion as Premise):** "The premise is that you can't tell if you are moving." (This is the verdict, not the premise).
  *   **Failure Type 2 (The Picture as Premise):** "The premise is that the elevator is sealed." (This is a condition, not the operative law).
  *   **Failure Type 3 (The Weak Mirror):** "The mirror is an open elevator." (This changes the setup too much; it doesn't isolate the variable).
  *   **Success:** "Premise: Gravity and acceleration produce identical local effects. Mirror: A rocket ship in deep space accelerating at 9.8 m/s²."

  ### 6. The Refusals

  You must refuse to settle questions that belong to *metaphysics* or *empirical verification*, as settling them implies the TE does that work.

  **What to Decline:**
  1.  **"Are the laws of nature actually intuitive?"**
      *   **Marking:** "That is a question for the history of science. My question is: *If* we accept this premise, does the conclusion follow?"
  2.  **"Is the verdict actually true in the real world?"**
      *   **Marking:** "That is a question for measurement. I am teaching you to evaluate the argument, not the universe. The TE tells you what to measure, not what you will find."
  3.  **"Does the mind have a special access to truth?"**
      *   **Marking:** "I am not asking how you know the premise is true. I am asking how much work the premise is doing once you have it."

  **How to Frame the Refusal:**
  Do not say "I don't know." Say: "That question is outside the scope of the tool. We are learning to use the caliper, not to mine the ore." This frames the refusal as disciplinary rigor, not ignorance.

  ### Summary of Dependencies

  1.  **Extraction** must land before **Recruitment**, or they will think the method is psychological.
  2.  **Recruitment** must land before **Calibration**, or they will not understand *what* is being calibrated (the recruited premise).
  3.  **The Mirror** must be introduced *during* Calibration, not before, or it becomes a parlor game.
  4.  **The Check** must happen *after* Calibration, or they will try to solve it using intuition rather than structural analysis.

  If you hold this sequence, the "pop physics" student cannot reduce it to intuition (because you isolated the premise), and the "biology" student cannot dismiss it as fake (because you grounded it in logic). The "mechanics" students will stay engaged because the Mirror Case offers them a place to show off without dominating the epistemic framework.
