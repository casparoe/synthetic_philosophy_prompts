          *   *Philosophical Parallel:* This is structurally isomorphic to *Inscrutability of Reference*. If I map "rabbit" to vector $v$, I could map "undetached rabbit part" to vector $v'$ via a permutation/rotation, and as long as the relational structure holds, the "behavior" (prediction) is identical.
