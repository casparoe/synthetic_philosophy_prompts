      *   **Holism:** Sentences face the tribunal of experience as a corporate body, not individually.
      *   **Indeterminacy of Translation:** There is no fact of the matter as to which translation manual is correct, provided they both account for all speech dispositions. It's not just epistemic uncertainty; it's ontological emptiness.
      *   **Inscrutability of Reference:** Even within a language, reference is indeterminate (e.g., "rabbit" vs. "rabbit stage" vs. "undetached rabbit part"). This is solved only by "immanent" reference (using our own language to talk about our own language), but remains absolute from an external view.
      *   **Rejection of Meanings as Entities:** No propositions, no intensions, no "ideas."

  3.  **Evaluate the LLM Scenario against Quine's Commitments:**

      *   **The Friend's Argument (Embeddings stabilize reference):**
          *   *Claim:* Cross-lingual embeddings show a "fact of the matter."
          *   *Quinean Rebuttal:* Quine would reject the idea that vector proximity *is* meaning. Vectors are just more behavioral data (or structural patterns in data). If two different vector configurations predict the same output behavior (speech dispositions), they are equivalent. The "stability" is just pragmatic utility, not ontological truth.

      *   **The User's Argument (Internal reps are analytical hypotheses):**
          *   *Claim:* Weights are just hidden manuals.
