answer: |-
  Here are ten questions, ordered to tighten the noose around the "protocols" thesis, with predicted answers and follow-ups designed to prevent evasion.

  **1. The Common Prior in the Wild**
  *Question:* In my field, we could never agree on mantle viscosity because we couldn't measure it; we just picked priors that gave the results we liked. In a concrete scientific dispute—say, climate sensitivity—how do you empirically determine if two scientists share a common prior, rather than just sharing a vocabulary?
  *Predicted Answer:* Shared priors encode shared evidential standards, not identical starting numbers; if they trust the same methods, they effectively share a prior.
  *Follow-up:* If "trusting the same methods" is the test, doesn't that make the common prior assumption true by definition for anyone willing to talk to each other, rendering the theorem vacuous for actual disagreements?

  **2. Unfalsifiability**
  *Question:* Following on that: if disagreement persists, you can always blame a hidden difference in priors; if agreement occurs, you credit the theorem. Is there any observable state of the world that would count as evidence *against* the common prior assumption holding?
  *Predicted Answer:* It's a modeling assumption, not an empirical hypothesis; we judge it by the fruitfulness of the models it generates, not by direct falsification.
  *Follow-up:* But if it's unfalsifiable, aren't you protecting the theorem from refutation by classifying it as math rather than epistemology, and does that strip it of normative force for real agents?

  **3. Static vs. Dynamic Load**
  *Question:* Aumann's original result is static (you can't agree to disagree), but there's a dynamic corollary (announcing posteriors leads to convergence). For your "communication protocol" reading, which result is doing the heavy lifting?
  *Predicted Answer:* The dynamic result is crucial because it models the *process* of agreement, which fits the protocol interpretation better than the static impossibility.
  *Follow-up:* Real scientists don't announce posteriors; they swap arguments, plots, and anecdotes. If the dynamic result requires number-swapping to work, isn't your protocol reading limited to a toy model that never happens in practice?

  **4. Arguments as Signals**
  *Question:* You'll likely say arguments are just evidence and can be modeled as signals. But when I send you a graph, you interpret it through your own theoretical lens. How does the theorem account for the lossy compression of translating "evidence" into "posterior" before the protocol even begins?
  *Predicted Answer:* The partition structure accounts for how agents map evidence to posteriors; different interpretations are just different information partitions.
  *Follow-up:* If the partitions are private and unobservable, how do we ever know the protocol is being followed correctly, rather than just assuming it is until agreement fails?

  **5. Bad Protocols (Ordering)**
  *Question:* The convergence theorem assumes a specific announcement order. In a large department, people talk in pairs, in corridors, in orders nobody knows. If the protocol is "messy" rather than "wrong," does the theorem predict stagnation, or does it simply cease to apply?
  *Predicted Answer:* It ceases to apply; the theorem describes idealized information flow, not the sociology of a department.
  *Follow-up:* If it ceases to apply to almost all real-world social structures, isn't your reading admitting that the theorem tells us nothing about how actual communities resolve disagreement?

  **6. The Coarse Channel (The 0.6 Case)**
  *Question:* Suppose the channel is coarse: I have a posterior of 0.63, you have 0.57, we both round to one decimal and say "0.6." We hear agreement and stop. Has the protocol been satisfied, or is this a false positive?
  *Predicted Answer:* It's a false positive; the protocol requires sufficient precision to ensure the partitions are actually common knowledge.
  *Follow-up:* But if the agents are rational and sincerely believe they've satisfied the conditions, on what grounds do you say they haven't, other than an omniscient view they don't possess?

  **7. Cycling and Stalling**
  *Question:* Extend that rounding case: if repeated rounding causes us to cycle or stall short of the pooled value, is that a failure of rationality or a failure of the channel?
  *Predicted Answer:* It's a failure of the channel; the rationality constraint only binds if the protocol allows for full information exchange.
  *Follow-up:* Doesn't that let the agents off the hook too easily? If a rational agent knows the channel is coarse, shouldn't their rationality require them to volunteer more digits or announce the error margin?

  **8. Peerhood vs. Priors**
  *Question:* The theorem mentions nothing about competence or peerhood, only priors and partitions. Is talk of "epistemic peers" in the literature just a loose, sloppy proxy for assuming a common prior?
  *Predicted Answer:* Yes, "peer" is essentially a shorthand for "agent with whom you share a prior and recognize common knowledge."
  *Follow-up:* If "peer" just means "someone who already agrees with your priors," isn't the advice to "defer to peers" circular? It becomes "defer to people who start where you start."

  **9. Computational Demand**
  *Question:* If I can't in practice compute the posterior conditional on everything my colleague and I have seen between us—which is almost always—does your view imply my number isn't a credence at all?
  *Predicted Answer:* No, it implies you are a bounded agent; the theorem sets an ideal limit, not a daily requirement.
  *Follow-up:* But if the ideal is computationally inaccessible, and you blame the protocol for failures, aren't you defining rationality in a way that nearly all real scientific disagreement counts as irrational or irrelevant?

  **10. Falsification of the Reading**
  *Question:* Finally, what would count against your reading? What finding, or what kind of counterexample, would make you give up the "it's about protocols" line and return to the standard "it's about rationality" view?
  *Predicted Answer:* If we found cases where perfect protocols failed to produce agreement among agents with verified common priors, that would challenge the mathematical result itself.
  *Follow-up:* But since that mathematical result is a proof, it can't be wrong; so isn't your position insulated from any empirical evidence, making it a philosophical stance rather than a scientific one?

  ***

  ### The Commitment

  Your hobby horse is right, but Vance is trying to dodge it. The "protocols, not rationality" reading is **half-right but ultimately defensive**. It correctly identifies that *mechanism* matters (you can't agree if you can't talk), but it wrongly suggests this absolves agents of rational constraints. If the protocol is part of the environment, a rational agent should optimize their protocol; blaming the channel is often just blaming the priors by another name.

  **Question 9 is the killer.** It exposes that Vance's reading relies on an idealization (unbounded computation) that, if admitted, makes the theorem irrelevant to practice, but if denied, makes most scientists irrational. She can't have it both ways. The "assumptions do all the work" critique holds: the Common Prior is the assumption doing the work, and the "Protocol" reading is just an attempt to save the theorem when the Prior assumption fails. Stick to Q1 and Q9; those are the choke points.
