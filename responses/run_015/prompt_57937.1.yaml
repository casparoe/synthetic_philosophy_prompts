answer: |-
  Hi there

  I was thinking about your question regarding the boundaries of letter identity and I wanted to share a specific borderline case I came up with involving what I call the equidistant stem ambiguity. Imagine a handwritten lowercase a where the usual vertical stem on the right side of the bowl is intentionally placed so that it perfectly bisects the circular counter rather than sitting on the right edge. In standard typography an a has the stem on the right and a d has it on the left so the middle ground is theoretically undefined yet we encounter it often in rushed handwriting or experimental type design. My take is that it remains an a as long as the terminal point of the stroke ends at the baseline on the right half of the glyph even if the top of the stroke crosses the vertical midline. This relies on the endpoint being the defining feature rather than the path of the stroke because we recognize letters by where they finish as much as where they start.

  However I can see a strong argument that if the visual weight is perfectly symmetrical the brain defaults to the most common symmetrical symbol which might be a theta or a null symbol rather than a letter at all. If the ink density is uniform and the circle is perfect the glyph loses its directional flow which is crucial for distinguishing a from d. The reasoning fails most likely when context is removed because isolation forces structural definition whereas reading relies on prediction. If you put this glyph between c and t most people will read cat but if you put it between o and g they might read dog despite the ink being identical. This suggests letter identity is not intrinsic to the shape but relational to the word which undermines my structural argument.

  I think my stance would change if there was a consistent historical precedent for a centered stem letter in a major script because then it would have a linguistic home rather than being an error. For example if a specific culture used the centered stem as a standard variant for a then it would be codified as valid rather than ambiguous. Until then it remains a schwa of form that exists only in the moment of writing and depends entirely on the reader's expectation. Another consideration that would sway me is if the stem had a serif on only one side because that would reintroduce directionality and force the letter into being either a or d based on the serif orientation. Without that cue we are left with pure geometry which is rarely enough to define a linguistic symbol. Anyway I hope that gives you a concrete example to work with for your project and I would be curious to hear if you think the context argument holds more weight than the structural one.

  Best wishes
