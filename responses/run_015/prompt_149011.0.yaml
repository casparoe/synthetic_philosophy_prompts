answer: |-
  # Session Plan: The Binding Voucher

  **Topic:** Why Promises Bind
  **Time:** 55 Minutes
  **Participants:** 14–18 Students
  **Materials:**
  *   Two stacks of index cards (cut in half): 20 **Yellow Slips** ("Intentions"), 20 **Red Vouchers** ("Promises").
  *   Pens for everyone.
  *   One small box or envelope (The "Club Vault").
  *   18 distinct tokens (poker chips, coins, or laminated cards) — one for each student.
  *   A timer.

  ## Part 1: The Rules (0:00 – 0:05)

  **Facilitator Script:**
  "Welcome. Today we are running a simulation about commitments. There is no lecture today. There are only rules.

  At the start of this meeting, you each received one **Vote Token**. At the end of this meeting, we will vote on [insert meaningful club decision, e.g., the topic for the final session / the end-of-year activity]. If you hold your token, you vote. If you lose it, you do not.

  You will lose your token if you break a **Red Voucher** promise.

  There are two ways to commit to doing something for someone else in this room:
  1.  **Yellow Slip (Intention):** Write what you will do, sign it, and hand it over. If you don't do it, nothing happens. You keep your token.
  2.  **Red Voucher (Promise):** Write what you will do, sign it, and hand it over. If you don't do it, and the person holding it says you didn't do it, you forfeit your Vote Token.

  **Constraints on Commitments:**
  *   Must be doable within one week.
  *   Must be allowed by school rules.
  *   Must cost you something small (time, effort, a small favor), but no money.
  *   Examples: 'Save me a seat Tuesday,' 'Send me the notes from History,' 'Stand up every time you speak for the rest of this meeting.'

  You have 15 minutes to trade. Go."

  ## Part 2: The Trading Floor (0:05 – 0:20)

  **Activity:**
  Students mingle. They negotiate favors.
  *   **Goal:** Each student must hold at least one Red Voucher issued by someone else.
  *   **Goal:** Each student must issue at least one Red Voucher to someone else.
  *   **Constraint:** You only have 3 Red Vouchers total. Once they are gone, you can only offer Yellow Slips.

  **Facilitator Role:**
  Circulate. Do not use theory words. If a student asks, "What's the point of the Yellow Slip?" say: "It's just information." If they ask, "What if I promise two people the same seat?" say: "That's up to you to manage."

  *Design Note:* This generates **Difficulty 1 (Redundancy)**. Students will feel that the Red Voucher feels "heavier" than the Yellow Slip, even if the task is identical. It generates **Difficulty 3 (Conflicting Promises)** because they only have 3 Red Vouchers but may want to please multiple people.

  ## Part 3: The Complication Rounds (0:20 – 0:35)

  Stop the trading. Announce three specific scenarios. Students must resolve these using the cards they currently hold.

  **Scenario A: The Blank Check (Contentless Promise)**
  "Find one person who holds a Red Voucher from you. Tear it up. Replace it with a new Red Voucher that says: *'I promise to do one task you assign me next week. Task TBD.'* Sign it. Hand it over."
  *   **Action:** The Promisee must now write a specific task on the back.
  *   **Constraint:** The task must be annoying but harmless (e.g., 'Send me a song you hate,' 'Stand up every time you speak for the rest of this session').
  *   **Design Note:** This forces **Difficulty 4**. The Promiser is now bound to an unknown future cost.

  **Scenario B: The Transfer (Assignment Test)**
  "Find a pair where A has promised B. B must now hand that Red Voucher to C. B says to A: 'Don't do it for me. Do it for C.' A must decide: Do you accept this transfer? If you do, sign the back. If you don't, tear the voucher (you break the promise, lose your token)."
  *   **Design Note:** This forces the **Assignment Test**. Does the obligation belong to the person, or the task?

  **Scenario C: The Public Pledge (Unowned Release)**
  "Volunteers needed. Three people will promise a task to *The Club* (e.g., 'Wipe the whiteboard next Friday'). Write the Red Voucher. Do not give it to a person. Put it in the **Club Vault** (the box)."
  *   **Rule:** To get this voucher back (to be released), you need permission from the holder. But the holder is 'The Club.'
  *   **Constraint:** No single person can take a voucher out of the Vault. Only a unanimous vote of the room can open the Vault.
  *   **Design Note:** This forces the **Unowned Release**. The Promiser is bound, but no specific individual has the power to release them.

  ## Part 4: Resolution & Forfeit (0:35 – 0:45)

  **Activity:**
  1.  **Redemption:** Promisees have 5 minutes to demand fulfillment of any task that can be done *now* (e.g., "Stand up," "Give me your pen").
  2.  **Deferral:** Tasks for next week are recorded in a "Ledger" (a sheet on the wall).
  3.  **The Release:** Promisees may choose to return a Red Voucher to the Promiser. This is a **Release**. If they return it, the promise is void. No token is lost.
  4.  **The Break:** If a Promiser refuses a valid request, or a Promisee refuses to return a voucher when the task is done, the Facilitator collects the Promiser's Vote Token.

  **Facilitator Script:**
  "If you hold a Red Voucher, you have authority. You can demand the task, or you can give the card back. If you give the card back, they are free. If you keep the card and they don't do the task, they lose their vote."

  ## Part 5: The Debrief (0:45 – 0:55)

  **Facilitator Script:**
  "Keep your tokens. We will vote in a moment. First, we need to talk about what happened. I am going to introduce three explanations for why the Red Voucher felt different from the Yellow Slip. Your job is to tell me which explanation fits which part of the game."

  **Theory 1: The Expectation View ("Don't Let Them Down")**
  *   **Claim:** Promising is just about creating an expectation so the other person doesn't get hurt or disappointed.
  *   **Best Evidence:** Scenario A (The Blank Check). You felt anxiety because you knew they would be disappointed if you didn't do it.
  *   **Worst Evidence:** Scenario C (The Club Vault). If no specific person is expecting it (since the 'Club' is abstract), why did it still feel binding? Also, why could the Promisee release you just by handing back the card? If it was just about disappointment, they couldn't make it okay for you to break it.

  **Theory 2: The Convention View ("It's Just a Rule")**
  *   **Claim:** Promising is like a game rule (like 'check' in chess). We agreed to these rules at the start. The Red Voucher binds you because we said it does.
  *   **Best Evidence:** The start of the session. The Red Voucher only had power because we agreed on the rules (lose the token). Without the rule, it's just paper.
  *   **Worst Evidence:** Scenario B (The Transfer). When B gave the voucher to C, did the rule say C now owns it? No, *you* had to decide if you accepted C. If it were just a rule, the transfer would be automatic. Also, why did asking for release feel awkward? The rules said you could ask, but the *feeling* wasn't rule-based.

  **Theory 3: The Authority View ("You Hold the Keys")**
  *   **Claim:** Promising gives the other person a limited right to command you. They own the obligation, not you.
  *   **Best Evidence:** The Release Mechanism. Only the person holding the card could free you. You couldn't free yourself. They had 'authority' over your action.
  *   **Worst Evidence:** Scenario A (The Blank Check). Did they really have authority to make you do *anything*? Most of you felt resistant to the 'annoying task.' It shows there are limits to the authority, even if you promised.

  **Closing Vote:**
  "Count your tokens. If you have one, vote. If you don't, you sit out. This is the consequence of the binding nature we just tested."

  ***

  ## Anticipated Failure Modes & Mitigations

  **1. Irony and Joke Promising**
  *   **Risk:** Students promise "I will marry you" or "I will jump out the window" to mock the stakes.
  *   **Mitigation:** The "School Rules/Physically Possible" constraint in Part 1 is enforced strictly. If a promise is joke-ish, the Facilitator declares it "Void" before it is issued. "That violates the constraints. Write a new one." Maintain a neutral, bureaucratic tone. Do not laugh.

  **2. Refusal to Participate**
  *   **Risk:** A student refuses to give up a Vote Token or make a promise.
  *   **Mitigation:** Participation is optional. They can sit out the trading phase. However, if they do not issue at least one Red Voucher, they are classified as "Observers." Observers do not get a Vote Token at the end. This makes non-participation costly without forcing action.

  **3. The "It's Just Feelings" Deflation**
  *   **Risk:** In the debrief, a student says, "The card doesn't actually bind me. I only cared because I wanted to vote. In real life, there are no Vote Tokens."
  *   **Mitigation:** Acknowledge this. "You are right. The token is a stand-in for your integrity or reputation. In the real world, the 'token' is your relationship with that person. If you break the promise, you don't lose a poker chip, you lose trust. The game just made the trust visible."

  **4. Impossible Promises (The "Forgot" Defense)**
  *   **Risk:** A student promises to bring something next week, forgets, and claims they didn't *intend* to break the promise.
  *   **Mitigation:** The rule is strict liability. "The Voucher does not care about intent. It cares about fulfillment. If it's not done, the token is forfeit." This mirrors the philosophical view that promises create an obligation regardless of later changes in desire.

  ## What This Activity Cannot Show

  You must state this clearly at the very end:

  1.  **The Source of the Power:** The game shows *that* promising creates authority, but it cannot show *why* we have this power in the real world. In the game, I (the Facilitator) gave you the power by making the rules. In real life, there is no Facilitator. Does the power come from God? From Reason? From Social Evolution? The game cannot answer that.
  2.  **The Moral Weight:** In the game, breaking a promise costs a Vote Token. In real life, breaking a promise might cost a friendship or a job, but sometimes breaking a promise is the *right* thing to do (e.g., promising to keep a secret, but the secret is dangerous). The game treats all promises as equally binding. Real morality is messier.
  3.  **The "Practice" Requirement:** The game only worked because we all agreed to play. If one person walked in and said "Red cards mean nothing to me," the system would collapse. This suggests promising only works if a whole community agrees to the practice. You will have to explain that some philosophers think promising is impossible without an existing social practice, while others think it's a natural power of human will. The game assumes the practice exists.

