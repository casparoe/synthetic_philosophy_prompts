      *   *Rule C (Antiquarian/Continuity):* Preserve if old and still integrated into daily community life/use, regardless of greatness. (Supported by Precedent 3 primarily, potentially 1).
      *   *Rule D (Functional Utility):* Prioritize current functional use over historical commemoration. (Supported by Precedent 2 - clinic replaces plaque; Precedent 3 - market/concerts in cathedral).

      *Refining the Rules based on Nietzsche:*
      *   *Standard 1 (Monumental):* Fund/Protect if it inspires greatness or commemorates founding heroes. (Precedent 1).
      *   *Standard 2 (Critical):* Remove/Defund if it causes grief or supports oppression. (Precedents 2 & 4).
      *   *Standard 3 (Antiquarian):* Fund/Protect if it preserves local continuity and is loved/used by the community. (Precedent 3).

      *Synthesis of Precedents:*
