      *   **Precedent 2 (Cholera Plaque -> Clinic):** Removed plaque commemorating grief/epidemic, replaced with functional public health clinic.
          *   *Nietzschean Category:* **Critical**. Judging and destroying the past to enable life in the present (removing paralyzing grief).
          *   *Action:* Remove/Replace with functional utility.
      *   **Precedent 3 (Medieval Cathedral):** Funded upkeep of cathedral (charter signed there), still hosts concerts/market.
          *   *Nietzschean Category:* **Antiquarian** (preserving the past for its own sake/local history) mixed with **Monumental** (charter signed there) but primarily **Antiquarian/Functional** (still used weekly). It preserves the structure because it is old and still useful to the community's daily life.
          *   *Action:* Preserve/Maintain due to age + continued use.
      *   **Precedent 4 (Dictator's Portrait Gallery):** Took down portraits of previous dictator's family.
          *   *Nietzschean Category:* **Critical**. Removing oppressive/harmful historical narratives to enable current political life.
          *   *Action:* Remove.

