answer: |-
  ### Normative Frameworks and Institutional Divergence in Reproductive Policy

  To analyze the divergence between the predominant European and American models of assisted reproduction, we must first map the normative terrain. Several frameworks compete to underpin these institutional designs, each carrying internal tensions:

  1.  **Libertarian/Market Liberalism:** Prioritizes negative liberty and freedom of contract. The body is a vessel of self-ownership; reproductive capacity is an asset to be deployed. *Tension:* Does economic coercion vitiate consent? If a surrogate is financially desperate, is the contract truly voluntary?
  2.  **Kantian/Deontological Humanism:** Emphasizes human dignity and the prohibition against treating persons merely as means. *Tension:* Does banning surrogacy protect dignity, or does it paternalistically deny women agency over their reproductive lives?
  3.  **Feminist Care Ethics/Relationality:** Focuses on interdependence, vulnerability, and the moral significance of caregiving bonds. *Tension:* Does this framework essentialize the maternal bond (risking biological determinism), or does it highlight the exploitation inherent in outsourcing intimate labor?
  4.  **Liberal Egalitarianism:** Focuses on fairness and equality of opportunity. *Tension:* Does access to surrogacy promote equality for infertile or LGBTQ+ individuals, or does it reinforce class hierarchies by allowing the wealthy to rent the bodies of the poor?
  5.  **Civic Republicanism:** Concerns the common good and the moral ecology of society. *Tension:* Does the marketization of reproduction corrupt the social meaning of parenthood, or does it expand the civic inclusion of non-traditional families?

  With these frameworks in mind, we can reconstruct the philosophical commitments presupposed by the institutional divergence.

  ### I. Philosophical Commitments: Body, Labor, Contract, and Parenthood

  The divergence rests on fundamentally different ontologies of the reproductive body and the nature of parenthood.

  **The Body:** The European model presupposes a **constitutive view** of the body. Reproductive capacities are not external assets but are intrinsic to personhood and dignity. To separate them via market exchange is to fragment the self. The American model presupposes a **proprietary view**. The body is a locus of rights that one owns; reproductive capacity is a service one can lease.

  **Labor:** In the U.S., gestation is framed as **productive labor** akin to a specialized service. It is divisible from the person and compensable. In Europe, gestation is framed as **relational work** or a natural process that resists commodification. Compensating it beyond expenses transforms a human relationship into a commercial transaction, which is seen as category error.

  **Contract:** The U.S. treats the surrogacy agreement as a **binding executory contract** regarding parental status. Intent governs. Europe treats such agreements as **unenforceable understandings** regarding status. Parenthood is a status conferred by law based on facts at birth (gestation), not a right transferred by prior consent.

  **Parenthood:** The U.S. operates on an **intentional/genetic theory** of parenthood (who wanted the child/whose genes are these). Europe operates on a **gestational/natal theory** (who gave birth is the mother), which can only be altered post-hoc through adoption (a state welfare function, not a contract enforcement function).

  ### II. Reconstructing the European Theory of Value

  Does the European model require viewing reproductive capacities as inalienable from the person, or can it be justified on harm-reduction grounds?

  Strictly speaking, the European model **does not logically require** a metaphysical commitment to inalienability, though it fits that narrative best. One could justify the ban on commercial surrogacy purely on **empirical harm-reduction grounds**: that a market inevitably leads to the exploitation of vulnerable women, creates a race to the bottom on safety, or creates psychological harm for the child.

  However, the *legal ontology* of the European model suggests a deeper commitment. By mandating that the birth mother is the legal mother and requiring adoption to transfer rights, the law treats the bond of gestation as **normatively prior to intent**. This implies a **status-based theory of value**: certain human capacities (creating life) belong to the realm of "status" (governed by public law and dignity) rather than "contract" (governed by private law and market value).

  If the justification were *only* harm reduction, the state could regulate prices and safety standards (as it does with pharmaceuticals) rather than banning commerce. The fact that compensation beyond expenses is often prohibited suggests a **semi-sacralized view of reproduction**: it must remain a "gift" (in the Maussian sense, creating social bonds) rather than a "sale" (terminating obligation). Therefore, while harm reduction is the public rhetoric, the institutional design presupposes that reproductive labor is **inalienable in the market sense**, even if not in the physical sense.

  ### III. Examining the American Model's Consistency

  Does treating gestation as contracted labor commit one to treating other forms of embodied care work the same way?

  The American model is **inconsistent** in its application of labor principles. If gestation is labor, surrogates should logically be classified as employees, entitled to workers' compensation, collective bargaining, and protection from specific performance (i.e., forced medical procedures). Yet, in most U.S. jurisdictions, surrogates are independent contractors, and contracts often mandate medical compliance (e.g., selective reduction) that would be unlawful in any other employment context.

  **What distinguishes reproductive labor in the U.S. view?**
  The distinguishing feature is the **ontological status of the product**. In standard care work (nannying, elder care), the worker cares for a person who already exists and retains rights. In surrogacy, the "product" is a *new* person whose legal status is being determined *by* the contract. The U.S. model treats the *process* as labor but the *outcome* as a property-like interest in parental rights.

  This creates a philosophical hybrid: it uses the language of labor (compensation, service) to justify the transfer of a status (parenthood) that is usually inalienable. To be consistent, a purely libertarian model would need to treat the child's status as fully alienable property (which it does not) or treat the surrogate as a full employee with the right to quit the "job" (keep the baby) without breach of contract penalties (which it generally does not). The U.S. model selectively applies market logic to the *transfer of rights* while suppressing market logic regarding the *laborer's bodily autonomy* during the process.

  ### IV. Philosophical Underdetermination

  Are these practices philosophically underdetermined? Could rival frameworks license either design?

  **Yes, both models are significantly underdetermined by high-level theory.**

  1.  **Liberal Autonomy:**
      *   *Licenses U.S. Model:* Autonomy includes the right to bind one's future self and monetize one's capacities.
      *   *Licenses E.U. Model:* Autonomy includes protection from coercive circumstances. A ban preserves the "meaningful freedom" of women who would otherwise be pressured by poverty into surrogacy (a "freedom from" market coercion).
  2.  **Feminist Relational Ethics:**
      *   *Licenses E.U. Model:* Protects the vulnerability of the maternal-fetal bond and prevents the commodification of intimacy, aligning with care ethics that prioritize connection over transaction.
      *   *Licenses U.S. Model:* A "sex-positive" or "agency-focused" feminism could argue that denying women the right to contract for surrogacy is paternalistic. It validates women's capacity to make complex moral decisions about their bodies and helps expand family forms for marginalized groups (e.g., LGBTQ+ parents).
  3.  **Market Libertarianism:**
      *   *Licenses U.S. Model:* Strong fit.
      *   *Licenses E.U. Model:* Weak fit. Only if framed as protecting property rights from fraud (e.g., ensuring the "product" isn't damaged), but the ban on commerce itself is hard to square with pure libertarianism.

  The divergence is not driven by irreconcilable philosophical first principles, but by **empirical priors** (how much exploitation does the market cause?) and **metaphysical intuitions** (when does parenthood begin?).

  ### V. Structural Changes for the Rival View

  If each jurisdiction were to adopt the *rival* philosophical view, mere regulatory tweaking would be insufficient. Structural ontology must shift.

  **1. The U.S. adopting the European (Inalienability/Status) View:**
  *   **Legal Ontology of Motherhood:** Statutes must shift from "intent-based parentage" to "gestational parentage." The woman giving birth is the mother, period.
  *   **Status of Contract:** Surrogacy contracts must be rendered **void ab initio** regarding parental rights. They can exist as private agreements for expenses, but specific performance (handover of child) cannot be court-ordered.
  *   **Role of Clinics:** Private law firms facilitating contracts would be replaced or heavily supplemented by **state-run or non-profit mediation bodies**. The process moves from private contract law to family welfare law (adoption), requiring home studies and post-birth judicial approval to ensure the "best interests of the child" rather than enforcing the "intent of the parents."

  **2. Europe adopting the American (Market/Labor) View:**
  *   **Legal Ontology of Motherhood:** Legislation must decouple gestation from legal motherhood. Parentage would be established via **pre-birth judicial orders** based on genetic contribution or contract, similar to a bill of lading in shipping.
  *   **Status of Contract:** Reproductive agreements must be elevated to **enforceable commercial contracts**. This requires creating a legal category for "reproductive service provider" distinct from "employee" but with enforceable deliverables.
  *   **Role of Clinics:** State-controlled clinics would need to be privatized or authorized to act as **market brokers**. Pricing would be deregulated (or standardized as a market rate rather than expense reimbursement), and the state's role would shift from guarding against commodification to ensuring contract enforcement and consumer protection.

  ### Confidence and Uncertainty Statement

  **Confidence Level:** I am **highly confident** (85-90%) in the reconstruction of the implicit theories of value, particularly regarding the European commitment to a status-based view of parenthood versus the American intent-based view, and the structural requirements needed to swap these models.

  **Least Certain Claim:** I am **least certain** about the claim regarding **philosophical underdetermination within Feminist Relational Ethics**. Specifically, I am uncertain whether a Feminist Relational framework can *coherently* license the American model without significant modification. While "agency-focused" feminism exists, the core tenet of relational ethics—that human beings are constituted by their relationships and vulnerability—often leads to the conclusion that market contracts fundamentally distort the maternal-fetal relationship. It is possible that the American model is not just a "different application" of feminist ethics, but a violation of its core metaphysical commitments regarding intimacy and care, making the underdetermination less robust in that specific theoretical quadrant than in Liberal Autonomy.
