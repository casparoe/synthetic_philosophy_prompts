answer: |-
  Your hypothesis identifies the functional overload correctly but misdiagnoses the metaphysical depth of the impasse. You argue that the debate stalls because participants are silently attempting to fulfill three distinct jobs: licensing retrospective realism, guiding prospective theory choice, and serving as an evidential indicator. This functional conflation is the primary engine of the stalemate. A definition suitable for retrospective licensing (where the truth is known, allowing us to check closeness) fails for prospective choice (where the truth is unknown). When a proponent offers a metric that works for the former, a critic shows it fails for the latter, and vice versa. The exchange ends because neither side admits they are optimizing for different functional constraints. Your identification of this tripartite burden is the strongest part of your diagnosis; it explains why technical repairs never satisfy the philosophical desiderata.

  However, your claim that the framework-dependence worry bottoms out in a metaphysical disagreement about natural kinds is likely too charitable. You suggest the impasse persists because disputants disagree on whether the similarity structure of possibility space is discovered or imposed. While some participants may hold this view, the deeper issue is pragmatic, not metaphysical. Even if there were an objective natural structure, it would not necessarily serve the epistemic needs of science. A metric that captures ontological similarity might be computationally intractable or evidentially inaccessible. The stalemate is not merely about whether a correct carving exists, but about whether any single carving can serve the diverse aims of scientific inquiry. By framing this as a metaphysical dispute, you risk obscuring the possibility that the concept of verisimilitude is inherently context-sensitive. The disagreement is not about the world's structure, but about the utility of the concept for specific scientific practices.

  Furthermore, your distinction between theory truthlikeness and model adequacy is crucial but underdeveloped. Much of modern science proceeds via idealized models that are false by construction yet highly successful. If progress is measured by the adequacy of models for specific questions, then the search for a general definition of theory truthlikeness is a category error. The impasse arises because participants are trying to define a property of whole theories when the actual locus of progress is the fit between specific model features and specific phenomena. This suggests the debate is not just conflating jobs, but conflating ontological categories.

  Regarding the epistemic idle worry: you are correct that a perfectly defined notion is useless if unverifiable. However, this is not a separate problem from the definition; it is a constraint on it. A definition of progress that cannot guide theory choice is functionally defective for a philosophy of science aimed at understanding practice. The impasse persists because definitional approaches treat verisimilitude as a semantic relation, while the scientific need is for an epistemic surrogate. Until the definition is tied to evidence conditions, it will remain a formal exercise disconnected from the history it aims to explain.

  Is the question ill-posed? Yes, in its general form. Asking for a universal measure of closeness to truth across all possible languages and domains assumes a uniformity of scientific practice that does not exist. Progress should not be sought through a new formal definition but through a restriction of the question. Progress would look like a typology of contexts where specific metrics are valid, rather than a single universal metric. Alternatively, progress would involve abandoning truthlikeness in favor of predictive accuracy or explanatory coherence as the primary markers of progress. If the debate continues to seek a context-independent definition, it should be abandoned. The most productive path is to treat verisimilitude as a local, pragmatic relation rather than a global, semantic property.

