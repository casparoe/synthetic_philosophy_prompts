  hey, science journalist here, always thinking about deadlines and wire feeds more than metaphyics. I'm trying to wrap my head around that Rietdijk-Putnam argument about special relativity killing the universal 'now' and leaving us with a block universe where past, present and future are all equally real. can you translate the whole thing into newsroom vocabulary for me?

