answer: |-
  Mara, a tenured philosopher, considers a permanent Deanship after serving a one-year interim term that gives her precise knowledge of the role's phenomenology: the specific fatigue of endless meetings, the distinct satisfaction of institutional repair, and the sensory reality of losing her reading hours. This prior exposure closes the epistemic gap; she requires no imagination to know what the days feel like, nor does the interim experience itself alter her core values, as its temporary nature kept her anchored in her research identity. Yet she knows the permanent role is personally transformative: the interim year revealed that sustained administration cultivates a preference for pragmatic compromise over critical truth, and she predicts her future self will view her current devotion to solitary research as indulgent immaturity. Standard deliberation fails: maximizing current utility ignores the legitimate claims of her future welfare, while maximizing future utility requires endorsing values she currently repudiates. She knows exactly who she will become and what that life feels like, but she cannot treat that future person's preferences as her own without betraying who she is now, nor can she ignore them without betraying who she will be.

  **Specification Check:**
  The route to knowledge is the **interim term**, which provides direct phenomenological access without the identity shift of permanent tenure, ensuring the experience is **not epistemically transformative**. The preference change is the shift from valuing critical truth to valuing pragmatic compromise, which is **personally transformative** because it renders her current evaluative standard obsolete for assessing the outcome. The single feature doing the work to separate the dimensions is the **prior phenomenological knowledge** (the interim term); remove this feature, and Mara no longer knows what the Deanship feels like, causing the case to collapse back into an ordinary, unified transformative-experience case where both epistemic and personal transformation block rational choice.

  **Strongest Reply and Counter:**
  A defender of standard decision theory will argue this is merely an **anticipated change of preference**, which is handled by deferring to the agent's current higher-order preferences (e.g., "Do I want to be the kind of person who changes?"). This reply fails because it presupposes a **unified agent** capable of holding authoritative higher-order preferences across time. In Mara's case, the deliberative impasse arises precisely because she does not recognize her future self as a legitimate bearer of her current authority; the problem is not weighing competing preferences, but the **fragmentation of normative agency**. If the self is diachronically alienated, there is no stable "current self" to authorize the choice, meaning the difficulty is generated by identity rather than ignorance, and decision theory's requirement for a single utility-maximizing subject is unmet.
