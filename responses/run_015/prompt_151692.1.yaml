answer: |-
  *(Sets down a glass of lukewarm pinot noir, adjusts glasses, and pulls a napkin toward me to sketch a quick DAG)*

  Look, I love this. I love it enough that I'm going to ruin it for you slightly before we get to the scoring. You've built two tests that are individually robust but jointly tense. Here's the friction: The **Replacement Test** rewards *specificity* (this cause, not that one, produced this shape). The **Channel Test** rewards *contingency* (this cause forced a choice, rather than mechanically determining the result).

  The problem is that the more specific and lethal a non-human actor is (passing Replacement), the more likely it is to bypass human agency (failing Channel). If smallpox kills 40% of a population indiscriminately, that's mechanically deterministic. If it kills 40% but the *political collapse* depends on who survived to sign the treaty, that's agency. You are asking for a "Goldilocks Zone" of environmental history: a shock specific enough to matter, but not so overwhelming that it turns humans into lemmings.

  Also, a warning on the Channel Test: You say if it routes through a choice, the cause acts *through* agency (good). But if the choice could have easily gone the other way to negate the outcome, then the environmental cause isn't "load-bearing" for the *outcome*, only for the *situation*. I'm going to score based on whether the environmental factor was the *binding constraint* on the decision, not just the background noise.

  With that caveat poured out, let's run the six episodes through the mill. I'm using consensus historiography, flagging where the counterfactuals get fuzzy.

  ***

  ### 1. Smallpox and the Fall of Tenochtitlán (1520–1521)
  *   **Score:** 88/100
  *   **Tier:** S (Load-bearing and not deterministic)
  *   **Why:** It passes Replacement (a drought wouldn't have killed Cuitláhuac specifically, altering leadership succession) and clears Channel (the Tlaxcalan alliance was a choice enabled by the power vacuum, not a mechanical result of viral load).
  *   **Trace:** Variola virus → Death of Cuitláhuac → Succession crisis → Tlaxcalan strategic calculation → Siege success.
  *   **Confidence:** High. The timing of the epidemic relative to the siege is well-documented; the counterfactual of a healthy Aztec command structure is robust.

  ### 2. The Black Death and the Collapse of Labor Scarcity in England (1348–1350s)
  *   **Score:** 92/100
  *   **Tier:** S (Load-bearing and not deterministic)
  *   **Why:** Passes Replacement (famine kills the young/weak; plague killed skilled labor too, creating unique scarcity) and aces Channel (the outcome was defined by the Statute of Laborers and peasant flight, a decade of negotiation, not immediate mechanical starvation).
  *   **Trace:** *Y. pestis* → 40% population drop → Labor leverage → Legislative failure/Peasant revolt → End of serfdom.
  *   **Confidence:** High. This is the canonical case for "shock via agency."

  ### 3. Yellow Fever and the French Expedition in Saint-Domingue (1802–1803)
  *   **Score:** 85/100
  *   **Tier:** S (Load-bearing and not deterministic)
  *   **Why:** Your hot take holds; passes Replacement (European troops would have crushed rebels without disease) and Channel (Leclerc's decision to invade in mosquito season and hold ground was the fatal choice the virus exploited).
  *   **Trace:** *Aedes aegypti* → High European mortality → Leclerc's reinforcement requests → Napoleon's abandonment decision → Haitian independence.
  *   **Confidence:** Medium-High. We know the mortality rates, but the exact weight of disease vs. rebel military tactics in Napoleon's final decision is debated (+/- 5 points).

  ### 4. Potato Blight and the Irish Famine (1845–1849)
  *   **Score:** 45/100
  *   **Tier:** B (Real but mediated to hell)
  *   **Why:** Fails Replacement (grain blight + monoculture likely yields similar demographic stress) and barely passes Channel (the *death toll* was determined by British policy choices to export food, making the blight a trigger, not the load-bearing cause of the catastrophe).
  *   **Trace:** *Phytophthora infestans* → Crop failure → British laissez-faire policy → Food exports continue → Mass mortality/migration.
  *   **Confidence:** High. The "political famine" consensus is strong; the blight gets credit for the crisis, but not the specific shape of the tragedy.

  ### 5. The 1918 Influenza Pandemic and the End of the First World War
  *   **Score:** 25/100
  *   **Tier:** C (Mostly vibes)
  *   **Why:** Fails Replacement hard (Central Powers collapse due to blockade/starvation regardless of flu) and fails Channel (Wilson's illness is a single, shaky decision node that doesn't explain the armistice timing relative to the Ludendorff Offensive).
  *   **Trace:** H1N1 virus → Troop incapacitation → Wilson's fatigue at Versailles → (Debatable link) → Treaty terms/Armistice timing.
  *   **Confidence:** Medium. The "Wilson at Versailles" claim is historically contentious; if you reject that link, the score drops to 10.

  ### 6. Tambora and the Year Without a Summer (1816)
  *   **Score:** 55/100
  *   **Tier:** B (Real but mediated to hell)
  *   **Why:** Passes Replacement (only a volcano creates global cooling of that specific profile) but struggles on Channel (migration and religious movements were choices, but "global instability" is too vague; much of the suffering was mechanical crop failure).
  *   **Trace:** Volcanic ash → Global cooling → Crop failure → Migration to US Midwest / Religious millenarianism.
  *   **Confidence:** Low. Defining the "outcome" is the problem here. If the outcome is "Mary Shelley writes Frankenstein," it's a C. If it's "US Midwest settlement acceleration," it's a B. I'm averaging (+/- 10 points).

  ***

  ### The Bar Tab Summary

  **S-Tier (The Real Actors):** Smallpox, Black Death, Yellow Fever.
  **B-Tier (The Triggers):** Potato Blight, Tambora.
  **C-Tier (The Ex post facto Excuses):** 1918 Flu.

  **Final Epistemic Check:**
  You asked me to flag if the scoring rests on a confused premise. Here it is: The **Channel Test** implicitly punishes high-mortality events. If a pathogen kills 90% of a population, there are no decision points left to route through. By your rubric, a genocide-by-germ scores *lower* on "honest causal credit" than a germ that sickens people just enough to make them vote differently. That feels morally weird, even if causally precise. You are rewarding *survival* over *impact*.

  Also, on the 1918 Flu: I'm with you on Tier C for "Ending the War." But if the outcome is "The Treaty of Versailles was too harsh because Wilson was cognitively impaired," that specific claim might bump the Flu to a B on the Channel Test, even if it fails Replacement. I kept it at C because the military collapse was already underway; the flu was a stressor, not the switch.

  *(Finishes wine)*
  So, tell your reading group: Nature isn't an actor unless it hands us a script we can choose to ignore. If we can't ignore it, it's not history, it's physics. Cheers.
