prompt: |-
  Hi — I have a slightly odd job and I need something operational out of it. I'm on the small methods team at a big interdisciplinary environmental research institute (ecologists, economists, GIS/modelling people, engineers, some policy folks). When two subgroups have been deadlocked for weeks over some word and it's blocking something real — a shared database schema, a joint paper, a work package in an EU grant — they get a 45-minute slot with me, which we call term triage. I run maybe three of these a month. I have no prep time (I usually get the word and a one-line description the morning of), the people in the room are senior domain experts with zero philosophy and are visibly annoyed to be there, and my deliverable is a one-page note that says one of three things: "you genuinely disagree about X, here is what data or analysis would settle it"; "you don't disagree, go build the thing"; or "this isn't a question evidence can settle, escalate to the steering committee." So I need a decision procedure I can run live, in the room, in about thirty minutes of talking, and that terminates.

  I know roughly the shape of the philosophical material here, and I want it turned into steps rather than explained to me again: the test where you strip the contested term out and re-describe the situation in neutral language and see whether the disagreement survives, versus the test where you ask whether the parties would actually disagree about any case, actual or hypothetical. I've noticed those two come apart, and I want the procedure to say which one to run first and what to conclude when they disagree with each other. I also want somewhere in it the point that a dispute can be perfectly substantive while not being a dispute *about the world* — that the fight is over which concept or which way of counting should occupy the slot the word is sitting in, i.e. a practical/normative question about which vocabulary to build the project on, not a factual one. That distinction matters a lot for my one-pager, because the "which concept do we commit to" cases should go to the steering committee and not to a data request. Four things I keep running into that I don't know how to handle and that I'd like the procedure to have an answer to: (1) *one-sided paraphrase* — one subgroup can restate its claim fine without the word, the other one can't or won't, so the elimination test only fires in one direction; (2) *load-bearing terms* — where the word is doing real work inside somebody's model or regulatory framework, so substituting a neutral description loses inferential content even though everyone agrees on the cases; (3) *strategic vagueness* — someone benefits from the term staying blurry (it's in the grant text, or it holds two factions together), so they won't commit to a definition under any prompting; (4) the nasty one where after all the cases, actual and imagined, both sides say "yes, I'd describe it the same way as you" and *still* won't agree that the other side is right. Please also mark honestly which steps are judgement calls wearing a procedure's clothes, and where I as a non-expert outsider am simply not entitled to declare a dispute merely verbal even though my tests say it is.

  Cases I'd like run through it, in the note: (a) ecologists and an ecosystem-services economist arguing about whether a restored wetland is "degraded" — the ecologists mean departure from a pre-drainage baseline, the economist means reduction in the flow of things people actually value, and a monitoring protocol depends on which wins; (b) the ML subgroup and the clinicians arguing about "bias" in a mortality-prediction model, where the statistical reading (disparate error rates across groups) points at one fix and the clinical reading (miscalibration in a specific subgroup) points at a different, partly competing one; (c) a case where I've already got a bad feeling — after everyone agrees on every case about "resilience" in a coastal infrastructure model, the two factions are still fighting, and my suspicion is that the honest output of your procedure will be "this is not verbal, but it's also not answerable by any study; the real question is which operationalisation you want to be stuck with for five years, and that's a committee decision," which is exactly the note nobody wants from me. For each, show where the procedure stops, what I write down, and one sentence I can actually say out loud in the room. Finally, tell me what this procedure can't do — what kinds of deadlock it will mislabel even when I run it perfectly.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Methods team member at an interdisciplinary environmental research institute.
      *   **Task:** Run "term triage" sessions (45 mins, 3/month) to resolve deadlocks over contested terminology blocking deliverables (schemas, papers, grants).
      *   **Constraints:** No prep time, senior experts (annoyed, non-philosophers), must terminate in ~30 mins of talking, deliverable is a one-page note with one of three outcomes (Factual Disagreement, Verbal/Practical Disagreement -> Build, Normative/Conceptual Choice -> Escalate).
      *   **Specific Needs:**
          *   Turn philosophical concepts (elimination test, case agreement test) into a step-by-step procedure.
          *   Order the tests (which first?).
          *   Handle divergences between tests.
          *   Distinguish factual disputes from conceptual/practical ones (vocabulary choice).
          *   Address four specific edge cases: One-sided paraphrase, Load-bearing terms, Strategic vagueness, Persistent disagreement despite case agreement.
          *   Identify "judgement calls wearing procedure's clothes."
          *   Run three specific cases (Wetland/Degraded, ML/Bias, Infrastructure/Resilience).
          *   Define limitations (what the procedure *can't* do).
      *   **Tone:** Operational, direct, no fluff, respectful of the user's expertise but firm on the logic.

  2.  **Deconstruct the Philosophical Core:**
      *   *Elimination Test (Carnap/Quine style):* Remove the word. Can you describe the situation neutrally? If yes, and disagreement vanishes, it's verbal.
      *   *Case Agreement Test (Chalmers style):* Do you agree on all actual and hypothetical cases? If yes, but still disagree on the term, it's verbal/conceptual.
      *   *The Twist:* The user notes these come apart. Also, the user needs to distinguish "Verbal/Factual" (go build) from "Conceptual/Normative" (escalate).
      *   *The "Real Work" Insight:* Sometimes the fight isn't about truth, but about *which tool to use*. This is a pragmatic/normative choice, not a factual one.

  3.  **Drafting the Procedure (The "Triage Protocol"):**
      *   *Goal:* 30 minutes. Needs to be tight.
      *   *Step 1: The Stakes.* Why does this word matter? (Identifies if it's load-bearing).
      *   *Step 2: The Elimination Test.* (Can we say it without the word?).
      *   *Step 3: The Case Test.* (Do we agree on the instances?).
      *   *Step 4: The Resolution.* (Mapping results to the three outcomes).
      *   *Handling the Edge Cases:* Need specific "If X happens, do Y" branches.

      *Refining the Order:*
      *   Start with *Stakes/Load-bearing*. If the term is legally defined or hardcoded in a model, elimination might be impossible. Need to know this early.
      *   Then *Case Agreement*. It's faster to ask "Is *this* degraded?" than to ask for a full paraphrase.
      *   Then *Elimination/Paraphrase*. If they agree on cases but fight on the word, try to strip the word.
      *   *Decision Node:*
          *   Disagree on cases -> Factual (Go collect data).
          *   Agree on cases, Disagree on word, Paraphrase works -> Verbal (Pick one, go build).
          *   Agree on cases, Disagree on word, Paraphrase fails/Load-bearing -> Conceptual/Normative (Escalate).

      *Wait, the User's specific constraint:* "One-sided paraphrase" and "Load-bearing."
      *   If one side can't paraphrase, it suggests the term is doing theoretical work for them.
      *   If the term is load-bearing (in a model), elimination breaks the model.
      *   *Correction:* The "Elimination Test" needs to be modified to "Operational Equivalence." Can we map Term A to Metric X and Term B to Metric Y and see if the *outcome* changes?

      *Let's structure the 30 minutes:*
      *   0-5 min: Define the Blockage.
      *   5-15 min: The Case Test (Hypotheticals).
      *   15-25 min: The Paraphrase/Operational Test.
      *   25-30 min: Verdict & Note Drafting.

  4.  **Addressing the Four Edge Cases within the Procedure:**
      *   *(1) One-sided paraphrase:* If Side A can paraphrase but Side B can't, Side B's term is likely theoretical/load-bearing. Verdict: Escalate (Conceptual incompatibility).
      *   *(2) Load-bearing terms:* If removing the word breaks a model/regulation, it's not a verbal dispute, it's a system architecture dispute. Verdict: Escalate.
      *   *(3) Strategic vagueness:* If they refuse to define it because vagueness is beneficial, the procedure can't force definition. Verdict: Escalate (Political/Strategic).
      *   *(4) Agreement on cases, disagreement on label:* This is the classic "verbal" dispute, *unless* the label triggers different downstream actions. If actions differ, it's a normative choice. Verdict: Escalate (Policy choice).

  5.  **Addressing the "Judgement Calls":**
      *   I need to be honest. The facilitator (user) is deciding what counts as "agreeing on a case." The user is deciding if a paraphrase is "close enough." This is authority masquerading as logic. I must flag this.

  6.  **Running the Cases:**
      *   *(a) Wetland/Degraded:* Ecologists (baseline) vs. Economists (flow).
          *   Cases: They will likely disagree on specific wetlands.
          *   Verdict: Factual/Definitional mix. Actually, they agree on the *physics*, disagree on the *metric*. This is a "Which concept to commit to" case. Escalate.
      *   *(b) ML/Bias:* Statistical (error rates) vs. Clinical (calibration).
          *   Cases: They might agree on the numbers but disagree on which number matters.
          *   Verdict: Normative/Practical. Which error is worse? Escalate.
      *   *(c) Resilience:* Agree on cases, still fighting.
          *   Verdict: This is the "Operationalisation" fight. Escalate.

      *Wait, I need to align with the User's 3 outcomes:*
      1.  Genuine Disagreement (Data needed).
      2.  Don't Disagree (Go build).
      3.  Not Evidence/Settling (Escalate).

      *Re-evaluating Case (a):* If Ecologists say "It's degraded" (baseline) and Economists say "It's not" (flow), do they disagree on the *world*? No, they disagree on the *index*. This is Outcome 3 (Escalate).
      *Re-evaluating Case (b):* Bias. Same. It's a choice of metric. Outcome 3.
      *Re-evaluating Case (c):* Resilience. Agree on cases, fight on word. Outcome 3.

      *Wait, where does Outcome 2 (Go Build) come in?*
      *   Outcome 2 applies if they are arguing over a word, but once stripped, they realize they agree on the *action*. E.g., "Is this a 'forest'?" "Well, it has 50 trees." "Okay, let's call it '50-tree-stand' in the schema and move on."
      *   I need to make sure the procedure allows for "Stipulative Definition" as a valid "Go Build" outcome if the stakes are low. But the prompt says "which concept... should occupy the slot... goes to steering committee." So high-stakes conceptual choices = Escalate. Low-stakes synonym swaps = Go Build.

  7.  **Refining the Procedure Steps (Iterative Polish):**
      *   *Step 1: The Consequence Check.* (Is this load-bearing/strategic?)
      *   *Step 2: The Case Test.* (Do we agree on the instances?)
      *   *Step 3: The Paraphrase Test.* (Can we say it without the word?)
      *   *Step 4: The Verdict.*

      *Handling the "One-Sided Paraphrase":* If Side A paraphrases and Side B says "No, that misses the point," Side B is claiming a substantive theoretical commitment. That pushes to Escalate.
      *Handling "Agreement on Cases but not Label":* If the label triggers different *actions* (e.g., funding, regulation), it's Escalate. If the label is just for a paper title, it's Go Build (pick one). The prompt implies these are blocking "shared database schema, joint paper, work package." These are high stakes. So "Agreement on cases + Different Actions" = Escalate. "Agreement on cases + Same Actions" = Go Build.

  8.  **Drafting the Content:**
      *   *Intro:* Acknowledge the constraints.
      *   *The Protocol:* Numbered steps, time-boxed.
      *   *The Edge Cases:* Integrated into the decision tree.
      *   *The Judgement Calls:* Explicit section.
      *   *The Cases:* Applied walkthroughs.
      *   *Limitations:* Honest assessment.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 30 minutes enough for hypothetical cases?
      *   *Fix:* Limit to 3 specific cases. One actual, two hypothetical boundaries.
      *   *Critique:* The user said "One-page note."
      *   *Fix:* Provide the template language for the note.
      *   *Critique:* Make sure I don't sound like I'm teaching philosophy.
      *   *Fix:* Use operational language ("Metric," "Schema," "Deliverable").
      *   *Critique:* The "Resilience" case (c) is the one they dread.
      *   *Fix:* Validate that dread. It *is* the hardest outcome. The procedure should lead there confidently, not apologetically.

  10. **Final Polish:** Check against the four specific edge cases requested. Ensure the "Judgement Call" section is blunt. Ensure the "What this can't do" section is honest. (e.g., It can't solve power imbalances or bad faith).

  *(Self-Correction on Case A)*: Ecologists vs Economists on "Degraded".
  *   Ecologist: Baseline deviation.
  *   Economist: Value flow reduction.
  *   Do they disagree on the world? No. They disagree on the *definition*.
  *   Is it verbal? Yes, in the philosophical sense.
  *   But does it need data? No.
  *   Does it need Steering? Yes, because it determines the monitoring protocol (policy/normative choice).
  *   So Outcome 3.

  *(Self-Correction on Case B)*: ML Bias.
  *   Stat: Error rates.
  *   Clinical: Calibration.
  *   Disagree on world? No.
  *   Disagree on metric? Yes.
  *   Outcome 3 (Steering/Policy).

  *(Self-Correction on Case C)*: Resilience.
  *   Agree on cases.
  *   Fight on word.
  *   Outcome 3 (Steering).

  *Wait, where is Outcome 1 (Data needed)?*
  *   Example: "Is this soil 'contaminated'?" (Legal limit is 5ppm). Side A says 4ppm, Side B says 6ppm.
  *   That's a measurement dispute.
  *   Or: "Does this intervention cause 'harm'?" Side A says yes (observed side effect), Side B says no (didn't observe it).
  *   That's factual.
  *   I need to make sure the procedure distinguishes "We disagree on the number" vs "We disagree on what number counts."

  *Okay, ready to write.*
answer: |-
  Here is an operational decision procedure designed for your constraints. It compresses the philosophical machinery into a 30-minute facilitated protocol, followed by the specific case applications and limitations you requested.

  ### The Triage Protocol (30 Minutes)

  **Pre-condition:** You are the facilitator. You control the whiteboard. You do not offer opinions on the science. You manage the logic of the disagreement.

  **Step 1: The Consequence Check (5 Minutes)**
  *Ask:* "If we settle this word today, what specific thing gets unblocked? (Schema field? Paper section? Grant deliverable?)"
  *Ask:* "Does this word have a legal, regulatory, or hardcoded definition in one of your existing models?"
  *   **If YES (Hardcoded/Regulatory):** Stop. This is a **Load-Bearing Term**. You cannot eliminate it without breaking a system.
      *   *Verdict:* **Escalate.** (Outcome 3).
      *   *Note:* "Dispute is over system architecture/regulatory compliance, not empirical fact."
  *   **If NO:** Proceed to Step 2.

  **Step 2: The Case Test (10 Minutes)**
  *Action:* Put three specific instances on the whiteboard. One clear "Yes," one clear "No," and one borderline case relevant to the deadlock.
  *Ask:* "Ignoring the word [TERM], do you both agree on the physical description of Case 1? Case 2? Case 3?"
  *   **If NO (They disagree on the facts/measurements):** Stop.
      *   *Verdict:* **Genuine Disagreement.** (Outcome 1).
      *   *Note:* "Parties disagree on empirical state. Requires data/measurement resolution."
  *   **If YES (They agree on the physical description):** Proceed to Step 3.

  **Step 3: The Paraphrase & Stakes Test (10 Minutes)**
  *Ask Side A:* "Describe Case 3 without using [TERM]. What metric or property are you actually tracking?"
  *Ask Side B:* "Describe Case 3 without using [TERM]. What metric or property are you actually tracking?"
  *   **Scenario A (One-sided Paraphrase):** Side A gives a metric; Side B says "That misses the point" and cannot/will not offer a neutral metric.
      *   *Diagnosis:* **Theoretical Incompatibility.** Side B's term is doing theoretical work that Side A's does not.
      *   *Verdict:* **Escalate.** (Outcome 3).
  *   **Scenario B (Different Metrics, Same Cases):** Side A says "I'm tracking Baseline Deviation"; Side B says "I'm tracking Value Flow." They agree on the physical state but propose different metrics.
      *   *Ask:* "If we adopt Metric A, does it break Side B's model? If we adopt Metric B, does it break Side A's model?"
      *   **If YES (Mutually Exclusive):** **Escalate.** (Outcome 3). This is a normative choice of framework.
      *   **If NO (Compatible/Stipulative):** **Go Build.** (Outcome 2). Pick one for *this* deliverable to unblock the work.
  *   **Scenario C (Strategic Vagueness):** Both refuse to commit to a specific metric/paraphrase, insisting the term *must* remain broad.
      *   *Diagnosis:* **Political/Strategic.**
      *   *Verdict:* **Escalate.** (Outcome 3).

  **Step 4: The Verdict & Note (5 Minutes)**
  Draft the one-pager live on the screen so they see the logic.
  *   **Outcome 1:** "Disagreement is empirical. Action: Commission measurement/analysis of [X]."
  *   **Outcome 2:** "Disagreement is terminological only. Action: Stipulate definition [X] for this deliverable; proceed."
  *   **Outcome 3:** "Disagreement is conceptual/normative. Action: Steering Committee must select operational framework."

  ---

  ### Handling Your Four Edge Cases

  1.  **One-Sided Paraphrase:** Handled in Step 3, Scenario A. If one side cannot strip the term, the term is doing theoretical work for them. You cannot declare this "verbal" in the trivial sense. It is a clash of frameworks. **Verdict: Escalate.**
  2.  **Load-Bearing Terms:** Handled in Step 1. If the term is in a regulation or a compiled model, "elimination" is not an option. The dispute is about system integration. **Verdict: Escalate.**
  3.  **Strategic Vagueness:** Handled in Step 3, Scenario C. If they benefit from the blur, your procedure cannot force clarity without authority you don't have. **Verdict: Escalate.**
  4.  **Agreement on Cases, Disagreement on Label:** Handled in Step 3, Scenario B. If they agree on the world but propose different metrics that lead to different actions (e.g., funding eligibility), this is not a factual dispute. It is a policy choice. **Verdict: Escalate.** (Only if the metrics are compatible do you say "Go Build").

  ---

  ### Where This Is a Judgement Call (Wearing Procedure's Clothes)

  You need to be honest with yourself (and implicitly with them) about where your authority creates the result:

  1.  **Determining "Agreement" in Step 2:** When you ask "Do you agree on Case 3?", you are the judge of whether their nods count as agreement. If Side A says "Yes, but..." and Side B says "No," you have to cut it off. You are arbitrating what counts as a "fact" vs. an "interpretation."
  2.  **Assessing "Breaking the Model" in Step 3:** When you ask if adopting Metric A breaks Side B's model, you are relying on their word. A senior expert might bluff that a change breaks their model to avoid losing the term. You have no way to verify this in 30 minutes.
  3.  **The "Go Build" Threshold:** Deciding whether two metrics are "compatible enough" to stipulate for a paper (Outcome 2) versus "too different" and requiring Steering (Outcome 3) is a judgement call on your part regarding the risk of future error.
  4.  **Your Entitlement:** You are **not** entitled to declare a dispute "merely verbal" if one side claims the term captures a causal mechanism the other side denies. If Side A says "Resilience is a physical property" and Side B says "Resilience is a social construct," and you force them to "just pick one," you may be destroying the scientific validity of the project. In cases of ontological disagreement, default to **Escalate**.

  ---

  ### Running Your Cases

  #### Case (a): Wetland "Degraded" (Ecologists vs. Economists)
  *   **Step 1:** No regulatory definition, but determines monitoring protocol.
  *   **Step 2:** They likely agree on the physical state of the wetland (water levels, species count, dollar value). They disagree on the *label* applied to that state.
  *   **Step 3:** Ecologist paraphrase: "Deviation from pre-drainage baseline." Economist paraphrase: "Reduction in service flow."
  *   **Conflict:** Adopting Ecologist metric makes Economist's cost-benefit analysis impossible (and vice versa). They are mutually exclusive operationalisations for the monitoring protocol.
  *   **Verdict:** **Escalate (Outcome 3).**
  *   **One-Pager Line:** "Parties agree on empirical state but propose mutually exclusive operational metrics; selection determines project scope and requires Steering decision."
  *   **Sentence to say:** "You aren't disagreeing about the wetland; you're disagreeing about which ruler we use to measure it, and we can't use both for this protocol."

  #### Case (b): ML "Bias" (Statisticians vs. Clinicians)
  *   **Step 1:** No hardcoding, but determines model fix.
  *   **Step 2:** They agree on the model outputs and error distributions (the cases).
  *   **Step 3:** Statistician paraphrase: "Disparate error rates." Clinician paraphrase: "Miscalibration in high-risk subgroup."
  *   **Conflict:** Fixing error rates might worsen calibration, or vice versa. These are competing optimization goals.
  *   **Verdict:** **Escalate (Outcome 3).**
  *   **One-Pager Line:** "Dispute is over optimization objective (fairness vs. calibration), not model performance data; requires policy decision on risk tolerance."
  *   **Sentence to say:** "This isn't a bug in the model; it's a choice about which kind of mistake we are willing to tolerate, and that's a clinical policy call."

  #### Case (c): Infrastructure "Resilience" (The Dreaded Case)
  *   **Step 1:** No hardcoding.
  *   **Step 2:** They agree on all cases (what breaks, what holds).
  *   **Step 3:** They refuse to paraphrase or agree on a single metric, insisting "Resilience" must cover both concepts.
  *   **Conflict:** Strategic Vagueness / Conceptual Pluralism. They want the word to do two jobs at once.
  *   **Verdict:** **Escalate (Outcome 3).** (Validating your suspicion).
  *   **One-Pager Line:** "Term is serving as a placeholder for two distinct operational concepts; retaining ambiguity blocks engineering specifications."
  *   **Sentence to say:** "You've agreed on the physics, but you're fighting over which promise this word makes to the funders, and only the Steering Committee can make that promise."

  ---

  ### What This Procedure Cannot Do

  1.  **Resolve Power Imbalances:** If the Economist is the PI and the Ecologist is a postdoc, the Ecologist may "agree" to the paraphrase under duress. The procedure records consensus, it doesn't guarantee it's free.
  2.  **Detect Bad Faith:** If someone is stalling to miss a deadline, they will play along with the tests until the 30 minutes are up, then claim "we need more thought." The procedure terminates, but the deadlock may remain.
  3.  **Ontological Deep Dives:** If the dispute is actually about whether a phenomenon *exists* (e.g., "Is this system actually complex or just noisy?"), the Case Test will fail repeatedly. You will end up with Outcome 1 (Data Needed), but the real problem is philosophical. You will mislabel it as empirical.
  4.  **Save a Broken Project:** Sometimes a word is contested because the collaboration itself is fundamentally misaligned. The procedure will correctly identify "Escalate," but the Steering Committee may realize the project is unfixable. You are the triage nurse, not the surgeon; you can diagnose the blockage, but you can't guarantee the transplant works.

  ### Final Advice for the Room
  When you deliver the "Escalate" verdict (Outcome 3), frame it as **success**, not failure.
  *   *Say:* "I have successfully identified that this is not a data problem. Sending this to data collection would waste budget. Sending this to Steering is the correct operational move."
  *   This protects your utility. You aren't the person who "couldn't fix it"; you're the person who "prevented wasted work."
