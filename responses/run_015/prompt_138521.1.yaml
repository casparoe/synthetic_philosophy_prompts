answer: |-
  Here is the principle you need. It is designed to be anachronism-proof (so it works on Malthus) and bias-resistant (so it stops your group from defending pet theories).

  ### The Invariant Mechanism Principle

  A failed prediction may be scored **"Not Yet" (Right but Early)** if and only if it satisfies all three of the following clauses. If it fails any single clause, it is scored **"Wrong."**

  1.  **Causal Invariance:** The original causal mechanism proposed must remain the **binding constraint** on the system. You cannot save a prediction by swapping the mechanism (e.g., from geological scarcity to economic demand) or by invoking an exogenous innovation that the original theory explicitly ruled out or treated as impossible (e.g., the Green Revolution for Malthus).
  2.  **Clock Integrity:** The timeline may slip due to **friction** (measurement error, engineering delays, political inertia), but not due to **degeneration** (repeatedly moving the goalpost without intermediate milestone progress). A rolling horizon ("20 years away" for 60 years) fails this clause.
  3.  **Conditionality:** If the prediction was **categorical** ("X will happen"), reflexivity (the prediction changing the outcome) counts as a failure. If the prediction was **conditional** ("If BAU, then X"), and the condition (BAU) was avoided *because* of the prediction, the score is **"Moot"** (neither Right nor Wrong, remove from active scoreboard). If the condition still holds, it is "Not Yet."

  ---

  ### Application to Your Verdicts

  Here is where this principle forces you to change your mind. I have ordered these by how painful the correction will be.

  **1. Malthus (1798) $\rightarrow$ VERDICT: WRONG**
  *   **Clause Violated:** Causal Invariance.
  *   **Why:** You suspect your double-standard between Malthus and Ehrlich is unjustified. It is. Malthus's mechanism was "Population grows geometrically, food arithmetically $\rightarrow$ Misery." Both premises failed in the industrialized world. Food grew geometrically (Haber-Bosch); population growth self-checked via prosperity (Demographic Transition), not misery.
  *   **The Hard Truth:** To run an honest forecasting group, you must score Malthus as **Wrong**. His *insight* (carrying capacity exists) remains valuable, but his *forecast* (inevitable misery/vice check) was falsified by the very industrialization he didn't anticipate. Protecting him undermines your credibility on Ehrlich.
  *   **Action:** Drop the protection. Mark as Wrong.

  **2. Ehrlich (Population Bomb) $\rightarrow$ VERDICT: WRONG**
  *   **Clause Violated:** Causal Invariance.
  *   **Why:** Same as Malthus. The Green Revolution bypassed the food constraint. The specific dated forecasts failed.
  *   **Consistency:** This now aligns with Malthus. Both were categorical claims about resource scarcity that were bypassed by technological innovation unaccounted for in the model.

  **3. Hubbert (World Oil) $\rightarrow$ VERDICT: WRONG**
  *   **Clause Violated:** Causal Invariance.
  *   **Why:** The original theory was about **geological** peak supply. The "rescue" is a **demand** peak (electrification/efficiency). Swapping a supply constraint for a demand constraint is a mechanism swap.
  *   **Note:** Hubbert (US) remains **Right** (mechanism held, timing held). This validates your unease: the theory worked where the geology was closed (US) and failed where it was open/global (World).

  **4. Limits to Growth $\rightarrow$ VERDICT: NOT YET (Conditional)**
  *   **Clause Satisfied:** Conditionality.
  *   **Why:** The model was explicitly "If Business As Usual..." If recent reanalyses show we are still tracking the BAU curve, the window is open.
  *   **Reflexivity:** If policy changes *diverted* us from the BAU track, the specific prediction becomes **Moot**. Do not count it as a "Hit" for the theory that collapse was avoided; count it as a Hit for the *warning* that policy worked. For your scoreboard, if the data no longer tracks the BAU run, retire the prediction as Moot. If it still tracks, keep as Not Yet.

