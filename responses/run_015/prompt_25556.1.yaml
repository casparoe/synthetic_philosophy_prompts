answer: |-
  Here is the definite position you are looking for.

  Your intuitions are coherent, but they require a specific theoretical framework to hold together without collapsing into dualism or dissolving into reductionism. You should not overturn your verdicts. Instead, you should adopt **The Declarative-Phenomenal Account**, grounded in **Non-Reductive Physicalism**.

  This theory posits that the distinction between "factual knowledge" and "mere skill" maps onto the neurocognitive distinction between **Declarative Memory Systems** (which model the world and self) and **Procedural Memory Systems** (which coordinate action).

  ### The Theory: The Declarative-Phenomenal Account

  **Core Principle:**
  Knowledge counts as "factual" (propositional) if it updates the brain's *declarative model* of reality or self. It counts as "skill" (ability) if it updates the brain's *procedural mappings* for sensorimotor control.

  Physicalism is preserved because both systems are physical. However, they are functionally distinct. The "Knowledge Argument" works for Mary because physical *descriptions* (propositional) fail to activate the *phenomenal concepts* required for declarative modeling of experience. You cannot model "what it is like" using only structural/functional data; you need the first-person data to complete the declarative model.

  **Why this resolves your tension:**
  You feel a tension because you are looking for an ontological difference (Fact vs. Skill). This theory argues the difference is *functional and architectural*.
  *   **Cases 1, 3, 5 (Mary, Durian, Love):** These involve the acquisition of **Phenomenal Concepts** that populate the Declarative System. They answer the question, "What is the nature of this state?"
  *   **Case 2 (Bicycle):** This involves the calibration of the **Procedural System**. It answers the question, "How do I coordinate my body to achieve X?" The "feeling" of balance is incidental to the motor loop, not the object of a declarative model.

  ### Application to Your Cases

  **1. Mary (Color Vision): Factual Knowledge.**
  Mary's brain has a complete physical model of color processing, but it lacks the phenomenal concept "RED." When she sees red, her visual system generates a qualia that her declarative memory system can now catalog. She learns a new truth about the *intrinsic nature* of her visual states. This is declarative update.

  **2. Bicycle (Motor Control): Mere Skill.**
  Riding a bike is primarily a procedural task. While there are proprioceptive feelings involved, the goal is not to *model* the feeling of balance, but to *maintain* it. The knowledge gained is "how to," not "what that is." The neural plasticity occurs in the cerebellum and basal ganglia (procedural), not primarily in the hippocampal-cortical declarative networks. Your intuition is correct: this is distinct from Mary.

  **3. Durian (Gustation): Factual Knowledge.**
  Like Mary, this is a passive reception of sensory data that updates your declarative model of "taste space." You gain a new phenomenal concept ("DURIAN-TASTE") that allows you to form true propositions ("Durian tastes like *this*"). It patterns with Mary because gustation is perceptual/input-oriented, not motor/output-oriented.

  **5. Romantic Love (Affect/Interoception): Factual Knowledge.**
  Love is an interoceptive and affective state. Like vision or taste, it provides data about the state of the organism and its relation to another. Falling in love updates your declarative model of your own emotional landscape and social bonding. It is knowledge of a state, not a procedure for action.

  ### The Verdict on Case 4: Echolocation

  **Theory Verdict: Echolocation is Factual Knowledge (like Mary), not Mere Skill.**

  Here is the resolution to your indecision: Echolocation is a **hybrid case**, but it patterns with Mary, not the bicycle.

  *   **Why it feels like a Skill:** It requires active motor production (clicking) and sensorimotor calibration (like the bike).
  *   **Why it is actually Factual Knowledge:** The *telos* (goal) of echolocation is **perception**, not action. The click is merely the means to generate a spatial map. The *knowledge gained* is the phenomenal character of "hearing space."

  When the blind person learns to echolocate, they are not just learning to move; they are learning *what spatial depth sounds like*. They acquire a new phenomenal concept ("ECHOLocation-SPACE") that updates their declarative model of the environment.

  **Neuroscientific Justification:**
  In echolocation experts, fMRI studies show that echo processing recruits the **visual cortex** (occipital lobe), not just auditory or motor areas. This indicates the brain is treating the input as a *perceptual model of the world* (Declarative/Phenomenal), similar to vision (Mary), rather than a motor coordination task (Bicycle).

  Therefore, your torn feeling is accurate: it *has* a skill component, but the epistemic gain is factual knowledge of a new sensory modality. You should classify it with Mary and the Durian.

  ### Summary of the Position

  1.  **Keep your verdicts on 1, 3, and 5.** They are updates to the Declarative-Phenomenal model.
  2.  **Keep your verdict on 2.** It is an update to the Procedural-Motor system.
  3.  **Resolve 4 as Factual Knowledge.** Despite the motor component, the epistemic prize is perceptual content (a new way the world appears), which belongs to the Declarative system.

  **The Coherent Principle:**
  > **Knowledge is "Factual" if it provides a new phenomenal concept for modeling the world or self (Perception/Affection). Knowledge is "Skill" if it provides a new policy for acting upon the world (Action).**

  This account preserves the validity of the Knowledge Argument (Mary learns something new) without requiring property dualism. She learns a new fact about the *intrinsic character* of physical processes, which is accessible only via the declarative-phenomenal system. This is fully compatible with your work in neuroscience, as it respects the functional segregation of memory and processing systems while validating the reality of subjective experience.
