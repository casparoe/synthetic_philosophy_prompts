answer: |-
  Right, so let's park Ryle's old bit about the 'intellectualist legend' for a moment and look at the clockmaker. She's proper skilled. She can rebuild an escapement blindfolded, purely by the feel of the tools. That's **procedural fluency**. It's smooth, habitual, and doesn't need her to recite physics formulas. If the job was always identical, we'd say she just has a sharp disposition. No knowledge-that required.

  But here's the rub: you swap the brass gears for aluminium. Aluminium is softer, lighter, conducts heat differently. She doesn't pause, doesn't mutter 'ah, lower modulus of elasticity', she just lightens her grip instantly. This is **counterfactual robustness**. Her skill isn't brittle; it tracks relevant changes in the world without explicit reasoning.

  Now, does she have both? It looks like it. Fluency is the smoothness of the act; robustness is the sensitivity of the act to how things *could* be. If she only had fluency, she'd strip the screw on the aluminium because her habit is tuned to brass. The fact she adapts suggests her body is registering the material properties somehow.

  This is where the intellectualist pounces. They'll reckon that robustness *just is* a form of knowing-that. To adapt correctly to aluminium vs brass, you must be sensitive to the truth of 'aluminium is softer'. If your action tracks the truth conditions of the environment, isn't that propositional knowledge, just in a practical mode? They'd say her hands are doing the thinking her mouth can't.

  The anti-intellectualist pushes back. They'd say this collapses the distinction. If robustness is just 'smart habit', then we don't need to posit hidden propositions in her head. Her body resonates with the affordances of the metal. The distinction between fluency and robustness matters because fluency can be rote (like a reflex), whilst robustness implies a normative grip on the task (doing it *right* under new conditions). But if that normative grip doesn't involve representations, is it really knowledge?

  In the end, the clockmaker has both capacities, but whether robustness counts as knowledge-that depends on if you think tracking truth requires representing it. I suspect the distinction holds, but it makes knowing-how look awfully clever.

