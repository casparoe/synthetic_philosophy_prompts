  Welcome, everyone. Please, grab a seat, grab some coffee.

  Looking around this room, I see a pretty rare collision of worlds. On one side, we have people who spend their days worrying about Lorentz transformations and the structure of spacetime. On the other, we have people who spend their days holding space for people navigating grief, trauma, and the heavy weight of anticipation. And right there in the middle, watching us all, is my advisor, [Advisor's Name], whose retirement we're here to celebrate.

  I was trying to figure out how to welcome you all without turning this into a lecture, and I kept coming back to a specific thought experiment about time. You might know the one. It involves an observer here on Earth and someone far away, say in the Andromeda galaxy.

  The physics tells us that "now" isn't a universal thing. If that distant observer is walking towards us, their slice of "what is happening right now" includes events that, for us standing still, are still in the future. If they walk away, our future slips into their past. A slight change in velocity changes the coordinate of "now."

  Now, for the philosophers in the room: I know this doesn't mean the future is written, and it doesn't mean free will is an illusion. It just means the map is bigger than our view of it.

  But for the psychologists in the room: I think this is where your work becomes vital. Because even if "now" is just a coordinate on a four-dimensional map, human beings do not live in coordinates. We live in the *passage*. We live in the ache of missing someone who is gone, and the anxiety of waiting for something that hasn't happened. The physics might say those events are just located elsewhere on the map, but the *experience* of moving toward them is real. That tension is where we all live.

  And that's why this workshop matters. We aren't here to solve the ontology of time. We're here to talk about how we navigate it.

  Which brings me to [Advisor's Name]. In the language of that four-dimensional map, today is just a coordinate. Retirement isn't an end point; it's not a full stop. It's just a change in velocity. It's a new trajectory on the same worldline. All the work you've done, all the students you've guided—that's not behind us. It's part of the structure of the space we're standing in.

  So, whether you think of time as a river or a block, whether you study the equations or the emotions, we're all here to honor the path that brought us to this room.

  Thank you for coming. Thank you, [Advisor's Name], for the map you gave us. Let's get started.
