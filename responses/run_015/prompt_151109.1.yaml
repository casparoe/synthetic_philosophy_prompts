answer: |-
  **The Compression of Thirst**

  Calcium ions flood the junction causing actin filaments to slide past myosin in the anterior compartment of the forearm while photons reflect off the silica structure of the vessel resting on the table
  To predict the hand you must compute the mass and velocity of every particle involved in the transaction between the skin and the glass without ignoring the noise
  The complete physical description requires the state of the universe at time one and the laws of motion to derive the state at time two without any loss of information
  This bitmap of reality is too heavy to carry if you want to know where the arm will be before the movement is already over and done with

  The arm acts as a lever system designed to transport liquid to the mouth for the purpose of maintaining the internal balance of the organism
  The hand opens because the grip mechanism is calibrated for cylindrical objects and the function dictates the form of the reach through space
  Engineering ignores the physics of the silicon to focus on the logic of the circuit that drives the motor to achieve the specific goal of lifting
  Function predicts the outcome cheaper than force because the design stance treats the body as a black box built to survive in an environment

  She wants water.
  She sees the glass.
  She reaches out.
  She drinks now.

  The pattern is real because the shortcut saves the work of prediction without lying.
  True because it works, not because it adds ghost stuff to the world.

  ***

  ### Handout: On Form and Function in Dennett's Stances

  **1. The Visual Argument (Compression)**
  Notice the shape of the poem. It begins with bulky, exhausting lines and steps down into brevity. This visual funnel is not merely aesthetic; it models Dennett's **compression criterion** from *Real Patterns*.
  *   **Lines 1–4 (The Physical Stance):** These lines are data-heavy. They attempt to describe the event (reaching for a glass) via fundamental physics (ions, photons, mass, velocity). In Dennett's terms, this is the "bitmap." It is theoretically complete but computationally expensive. Predicting the hand's trajectory using only line 1 is impossible for any agent with limited time.
  *   **Lines 5–8 (The Design Stance):** The lines shorten. We stop counting particles and start counting functions (levers, grips, maintenance). We treat the organism as a mechanism built for a purpose. This compresses the data: we ignore *how* the motor works to predict *what* it will do.
  *   **Lines 9–12 (The Intentional Stance):** The lines are at their shortest. "She wants water." This is the highest level of compression. We attribute beliefs and desires. According to Dennett, this isn't a fiction; it is the most efficient algorithm for prediction. If you can predict the behavior perfectly using "she wants water," that desire is as real as the calcium ions, because it captures the pattern without the noise.

  **2. The Ontological Turn (The Couplet)**
  The final couplet addresses the metaphysical worry: *If desires are just compressed physics, are they real?*
  *   **"The pattern is real because the shortcut saves the work...":** This echoes the *Real Patterns* criterion. A pattern exists if there is a description of the data that is cheaper than the raw data itself, allowing for successful prediction.
  *   **"...without lying." / "Not because it adds ghost stuff...":** This rejects dualism (no extra mind-substance) and eliminativism (no claim that desires are fake). The intentional stance is objective relative to a predictor. It is not "in the eye of the beholder" in a subjective sense; it is a factual feature of the world that some systems are best predicted as agents.

  **3. Discussion Question**
  If the intentional stance is just a compression tool, does it matter whether the agent *actually* feels thirst, or only that the "thirst" description works? Does the poem's shrinking form suggest that truth is a measure of efficiency?
