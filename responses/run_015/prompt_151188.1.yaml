answer: |-
  ### Preamble: Brainstorming the Philosophical Registers

  Before dissecting the slogan, we must recognize that "If you can't tell the difference, there is no difference" is a chameleon phrase. It shifts its logical weight depending on which philosophical register it occupies. In the context of art forgery, it collapses into four distinct modes of inquiry:

  1.  **The Epistemic Register:** Concerns knowledge, evidence, and justification. Here, the claim is about the *observer's capacity to know*. If the evidence is insufficient to distinguish $A$ from $B$, we lack justification for treating them differently.
  2.  **The Metaphysical Register:** Concerns identity, constitution, and essence. Here, the claim is about *what the object is*. It suggests that the object's identity is exhausted by its manifest properties, denying that hidden historical facts constitute the object's being.
  3.  **The Axiological Register:** Concerns value, worth, and merit. Here, the claim is about *goodness*. It posits that artistic value supervenes entirely on perceptible features, meaning history adds no normative weight.
  4.  **The Pragmatic Register:** Concerns function, use, and social practice. Here, the claim is about *utility*. If the copy performs the same social or decorative function as the original, the distinction is practically inert.

  The slogan is dangerous because it allows a speaker to slide between these registers unnoticed, borrowing the plausibility of the epistemic claim to support the controversial metaphysical or axiological conclusion.

  ***

  ### The Menu of Readings

  Here are four precise philosophical claims extracted from the slogan, categorized by their primary register.

  **Reading 1: The Epistemic Indiscernibility Claim**
  *   *Formulation:* "If no observer can empirically distinguish the forgery from the original, we possess no rational justification for asserting a relevant difference exists."
  *   *Register:* Epistemic.

  **Reading 2: The Metaphysical Perceptualist Claim**
  *   *Formulation:* "An artwork is constituted solely by its perceptual properties; therefore, two objects sharing all perceptual properties are numerically identical regarding their status as artworks."
  *   *Register:* Metaphysical.

  **Reading 3: The Axiological Experientialist Claim**
  *   *Formulation:* "The artistic value of a work resides entirely in the qualitative character of the aesthetic experience it affords; since the experience is identical, the value is identical."
  *   *Register:* Axiological.

  **Reading 4: The Pragmatic Functionalist Claim**
  *   *Formulation:* "The purpose of art in this context is decoration or visual stimulation; since the copy fulfills this purpose equally well, the distinction is practically irrelevant."
  *   *Register:* Pragmatic.

  ***

  ### Point-by-Point Verdicts

  Here I evaluate each reading for its truth status (Platitude, Substantive/Defensible, or False), its ability to support the conclusion that the forgery is "just as good," and its handling of the perceptual vs. causal-historical distinction.

  #### 1. The Epistemic Indiscernibility Claim
  *   **Status:** **Platitude (with caveats).**
      It is trivially true that if evidence is unavailable, we cannot claim knowledge based on that evidence. However, it is false if interpreted to mean that no difference *exists* in reality. Absence of evidence is not evidence of absence.
  *   **Supports Conclusion?** **No.**
      This reading fails to prove the forgery is *actually* as good; it only proves we cannot *know* it is worse. It justifies a suspension of judgment, not an equation of value. One might still suspect the forgery is inferior based on probability, even without detection.
  *   **Perceptual vs. Causal-Historical:** **Collapses the distinction pragmatically, but acknowledges it ontologically.**
      This reading admits a causal-historical difference might exist (the forgery *was* made by a forger), but argues that because this history is imperceptible, it is epistemically inaccessible. It keeps the gap open metaphysically but bridges it methodologically.

  #### 2. The Metaphysical Perceptualist Claim
  *   **Status:** **False (according to dominant analytic aesthetics).**
      This contradicts the widely accepted view (championed by Jerrold Levinson, Richard Wollheim, and Nelson Goodman) that artworks are "indicated structures" or depend on a specific context of discovery. A painting is not just a canvas with pigment; it is a canvas with pigment *arranged by a specific agent at a specific time*.
  *   **Supports Conclusion?** **Yes, but at too high a cost.**
      If this claim were true, the forgery would be ontologically identical to the original. However, accepting this requires denying that authorship matters to the identity of the work. It renders the concept of "forgery" incoherent (if they are the same work, it isn't a forgery, it's a duplicate).
  *   **Perceptual vs. Causal-Historical:** **Necessarily collapses the distinction.**
      This reading asserts that causal-historical properties are not constitutive of the artwork. It eliminates the gap entirely, arguing that history is external to the work's being. This is the strongest reading of the slogan but the least defensible in contemporary philosophy of art.

  #### 3. The Axiological Experientialist Claim
  *   **Status:** **Substantive and Defensible (but controversial).**
      This aligns with formalist theories (e.g., Clive Bell's "Significant Form") which argue that aesthetic emotion is triggered by form alone, not provenance. However, it conflicts with "historical" theories of value, which argue that knowing a work was the first of its kind, or an expression of a specific genius, alters its aesthetic weight.
  *   **Supports Conclusion?** **Partially.**
      It supports the conclusion that the forgery is *aesthetically* equivalent (it looks as beautiful). It does not support the conclusion that it is *artistically* equivalent, as artistic value often includes achievement, innovation, and authenticity, which are historical properties.
  *   **Perceptual vs. Causal-Historical:** **Acknowledges the gap but deems it axiologically inert.**
      This reading admits the causal-historical difference exists (the forger lacked the original genius) but argues that this difference does not *matter* for the specific value being measured (aesthetic experience). It respects the distinction but severs the link between history and value.

  #### 4. The Pragmatic Functionalist Claim
  *   **Status:** **Platitude (in limited contexts).**
      For a hotel lobby or a private home seeking decoration, this is true. For a museum, archive, or art market, it is false. Museums are not merely display cases for pretty images; they are repositories of cultural history.
  *   **Supports Conclusion?** **No.**
      It concludes the forgery is *functionally* interchangeable, not that it is *artistically* equal. It changes the subject from "What is the value of this art?" to "What can I use this object for?"
  *   **Perceptual vs. Causal-Historical:** **Ignores the distinction.**
      This reading does not engage with the metaphysical gap. It treats the artwork as a tool. Whether the tool has a history is irrelevant to its current utility, provided the handle feels the same.

  ### Synthesis: The Fate of the Distinction

  The slogan "If you can't tell the difference, there is no difference" is rhetorically powerful precisely because it exploits the ambiguity between **Reading 1 (Epistemic)** and **Reading 2 (Metaphysical)**.

  *   **Readings 1 and 4** are the most plausible but fail to deliver the desired conclusion that the forgery is *artistically* equal to the original. They merely suggest we shouldn't worry about it or that it works for decoration.
  *   **Reading 2** delivers the conclusion but is metaphysically false under standard theories of art ontology.
  *   **Reading 3** is the battleground. It is the only reading that seriously engages with value while respecting the perceptual/historical gap. However, even here, most philosophers argue that aesthetic experience is *cognitively penetrable*. If I learn a work is a forgery, my experience of it often changes (the "shudder" of betrayal, the loss of awe at the artist's feat). Thus, even the perceptual experience is not truly identical once the causal-historical context is known.

  **Final Verdict:** The slogan is a **category mistake**. It attempts to use an epistemic limitation (our inability to see the history) to erase an ontological reality (the existence of the history). While a perfect forgery replicates the **perceptual properties**, it necessarily lacks the **causal-historical properties** (the specific intentional chain of the original artist). Since dominant theories of art hold that these causal-historical properties are partly constitutive of artistic identity and value, the slogan is ultimately **false** in its strongest implication: there *is* a difference, even if you cannot see it, because the artwork is more than what meets the eye.
