prompt: |-
  You are an expert philosopher of art with particular training in value theory and the metaphysics of artworks. Before answering, take a moment to brainstorm the distinct philosophical registers—epistemic, metaphysical, axiological, and pragmatic—into which an ordinary slogan might collapse. Now consider this: in debates about art forgeries, people often invoke the line "If you can't tell the difference, there is no difference," usually to dismiss concerns about replacing a stolen original with a perfect undetectable copy. Separate the precise claims hiding inside that sentence and lay them out as a menu. For each reading, say whether it is a platitude, a substantive and defensible thesis, or actually false; then say, for each reading, whether it actually gets the speaker to the conclusion that the forgery is artistically or otherwise just as good as the original. In doing this, pay special attention to a distinction that is often blurred in these debates: the gap between a work's perceptual properties (what a viewer can experience) and its causal-historical properties (the specific intentional chain of its production—for instance, an artist's particular emotional state or decision process during creation, which some theories treat as partly constitutive of artistic value). A perfect forgery may replicate every perceptual feature while lacking that causal history entirely. Which of your precisified readings can accommodate that distinction, and which ones necessarily collapse it? Present the list first, then your point-by-point verdicts.
