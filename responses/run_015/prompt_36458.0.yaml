answer: |-
  The configuration you are describing has a very strong established candidate: **Hinge Commitments** (often historically referred to as **Hinge Propositions**).

  This concept comes from Ludwig Wittgenstein's final notes, published posthumously as *On Certainty* (1969). Your description of the three weird features maps almost exactly onto Wittgenstein's characterization of "hinges." However, the "dark version" (the ideological dogma) introduces a complication that contemporary epistemologists are still fighting over.

  Here is the breakdown of the term, the nearest competitors, the status of the debate, and a proposed distinction for the "dark" cases.

  ### 1. The Established Term: Hinge Commitments

  In *On Certainty*, Wittgenstein uses the metaphor of a door: "If I want the door to turn, the hinges must stay put." Your examples ("I have two hands," "The world existed 5 minutes ago") are the canonical examples Wittgenstein discusses.

  Here is how your three criteria map onto the literature:

  *   **Criterion 1 (Not up for confirmation):** Wittgenstein argues these are not items of *knowledge*. Knowledge implies the possibility of doubt and verification. Hinges are the scaffolding that makes verification possible. To test if the world existed five minutes ago, you would need memory records, which presuppose the world existed five minutes ago.
  *   **Criterion 2 (Disappointing justification):** Wittgenstein explicitly says, "I cannot be said to have a *reason* for this." If you ask why I believe I have hands, I can show them, but that proof only works if we already agree on the reliability of vision and the existence of physical objects. The justification is not circular; it is *grammatical* (in the broad sense of the rules of the language game).
  *   **Criterion 3 (Doubt can't get a grip):** This is the core insight. Wittgenstein writes, "A doubt that doubted everything would not be a doubt." Radical skepticism isn't a genuine intellectual position; it's a malfunction of the language game. You can't doubt the hinge because doubt itself relies on the hinge being fixed.

  **Contemporary Development:**
  Philosopher **Duncan Pritchard** is the leading contemporary voice here. He argues we should call them **Hinge Commitments** rather than Hinge *Beliefs* or *Knowledge*. This preserves your intuition that they aren't standard "beliefs" (which are usually evidence-responsive). They are arational commitments that ground our rational practices.

  ### 2. The "Dark Version": Same Phenomenon or Pretender?

  You asked: *Is someone raised to believe "the authorities can be trusted" in this same way experiencing the same phenomenon, or is it a pretender?*

  This is the contested frontier. Structurally, it looks identical. The believer cannot justify it, does not seek evidence, and feels doubt is impossible/malfunctioning.

  **The Consensus View (Structuralism):**
  Most epistemologists agree that **structurally**, these are the same mechanism. The human mind requires certain "ungrounded groundings" to function. A cult member and a common-sense realist both operate on hinges.

  **The Normative View (Epistemology):**
  However, they differ **normatively**.
  *   **Universal/Animal Hinges:** "I have hands," "There is an external world." These are arguably hardwired or necessary for any agent to act. Wittgenstein calls these part of our "form of life."
  *   **Local/Parochial Hinges:** "The authorities are trustworthy," "The Bible is inerrant." These function as hinges *for that specific community*, but they are not necessary for agency itself.

  **Coining a Term for the Distinction:**
  Since the literature doesn't have a single settled term for the "bad" version that captures the structural similarity but normative failure, I will propose a distinction term for you to use:

  **Term:** **Pathological Hinges** (or **Alienated Commitments**)
  **Definition:** A commitment that functions structurally as a Hinge Commitment (exempt from evidence, doubt feels impossible) but lacks the *universality* or *agency-enabling* status of a genuine Hinge. It is a local framework rule mistaken for a universal one.
  **Boundary Case:**
  *   *Genuine Hinge:* "Physical objects don't vanish when unobserved." (Without this, you cannot navigate a room.)
  *   *Pathological Hinge:* "The Party's data is never falsified." (You can navigate a room without this; it serves a social control function, not an agency function.)
  *   *Boundary:* "Science is the only path to truth." This is tricky. It functions as a hinge for scientists, but is it pathological? It depends on whether it is open to revision *in the long run* (Quinean) or sealed off (Dogmatic). If sealed off, it slides toward Pathological.

  ### 3. Nearest Established Concepts (and why they miss)

  You mentioned knowing the standard moves. Here is why they don't quite capture your description:

  *   **Foundationalism (Basic Beliefs):**
      *   *Difference:* Foundationalism usually claims basic beliefs are *self-justifying* or *evident* (e.g., "I am in pain"). Your examples ("The world is older than 5 minutes") are not self-evident. Hinge theory says they aren't justified *at all*; they are outside the justification game.
  *   **Quine's Web of Belief:**
      *   *Difference:* As you noted, Quine says everything is revisable "from the middle." Hinge theory says some things are the *frame* of the web, not part of the web. You can't revise the hinge without the whole system collapsing into nonsense, whereas Quine thinks you can revise logic itself if the pressure is high enough.
  *   **Kant's Synthetic A Priori:**
      *   *Difference:* Kant's categories (Time, Space, Causality) are formal conditions of experience. Hinges are often empirical in appearance ("Here is a hand") but function logically. Kant is about the mind's structure; Hinges are about the language-game's structure.
  *   **Strawsonian Presuppositions:**
      *   *Difference:* This is usually semantic (e.g., "The King of France is bald" presupposes a King of France). Hinges are pragmatic/existential. They aren't just conditions for a sentence having a truth value; they are conditions for *acting*.

  ### 4. Settled vs. Contested

  Since you asked for a map of the fighting:

  **What is Settled (mostly):**
  1.  **Existence:** There *is* a class of commitments that function differently from standard empirical beliefs. (Even critics admit we treat some things as exempt).
  2.  **Non-Evidential:** These commitments are not held *because* of evidence.
  3.  **Framework Role:** They serve a regulatory or enabling role in our epistemic practices.

  **What is Genuinely Contested:**
  1.  **Status:** Are they beliefs? Knowledge? Actions? Rules? (Pritchard says Commitments/Actions; others say Beliefs).
  2.  **Rationality:** Are they rational? Wittgenstein implies they are "animal" (pre-rational). Some philosophers (e.g., Crispin Wright) argue we are *entitled* to them rationally even without evidence.
  3.  **Change:** Can hinges change? Wittgenstein suggests the "riverbed" of thoughts can shift over time. If "The earth is flat" was once a hinge and now isn't, does that mean hinges are just deeply buried empirical beliefs? (This is the main attack vector from Quineans).
  4.  **The Dark Version:** There is no consensus on how to distinguish a "rational hinge" from "ideological dogma" without begging the question. If I say "My hinge is true, yours is dogma," am I not just asserting my hinge? This is the problem of **Epistemic Relativism**.

  ### 5. Summary Recommendation

  If you want to use the established terminology, refer to these as **Hinge Commitments** (citing Wittgenstein's *On Certainty* and Duncan Pritchard's *Epistemic Angst*).

  If you want to discuss the "dark version" specifically, use the distinction between **Universal Hinges** (necessary for agency) and **Parochial Hinges** (specific to a culture/ideology). If you need a term for the latter that highlights the risk, **Pathological Hinges** serves well as a descriptive coin.

  **One final boundary case to test your intuition:**
  *   *Case:* A mathematician's commitment to the Axiom of Choice.
  *   *Analysis:* It's not empirically confirmed. Justification is circular (it makes the math work). Doubt feels like "opting out of the game."
  *   *Verdict:* This is a **Domain-Specific Hinge**. It fits your pattern perfectly but is limited to a specific practice. This shows the pattern scales from "Existence of the World" down to "Rules of Chess," suggesting the phenomenon is about **Framework Constitutivity** rather than just "Truth."

  Your intuition that this is distinct from standard Foundationalism is correct. Foundationalism tries to *stop* the regress with a solid brick. Hinge theory says the regress doesn't stop; it dissolves because the question ("Why do you believe that?") loses its meaning at the boundary.
