prompt: |-
  hey im a phd student in philosophy of tech and im drafting questions for a departmental podcast q&a next week. our guest is a safety researcher who defends what she calls containment-first: the view that sandboxing, hard tripwires, and capability caps are catagorically different from alignment work like rlhlf or constitutional ai, because containment treats misalignment as a live possibility and just tries to box it, while alignment tries to make the model want the right things. she often compares this to nuclear safeguards.

  i need 8-10 questions that dont just have her restating the view. specifically:
  - at least one on whether containment really avoids alignment or just pushes the problem onto the human operators who design the tripwires
  - at least one on strategic deception: if the model knows its being monitered, doesnt containment just incentivize hiding misbehavior rather than fixing it?
  - at least one pressing the nuclear-safeguards analogy, especially where it breaks down since nuclear material doesnt adapt or learn
  - and for each of those, a follow-up keyed to the answer shes most likely to give

  also include a question about what evidence would actually change her mind, with a follow-up that makes it hard for her to just call it an implimentation detail. no generic how-did-you-get-into-this stuff please.
