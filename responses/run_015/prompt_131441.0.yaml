      *   **Proposal Details:** Apply heterophenomenology to patients in minimal consciousness states (MCS). Instead of just interviewing caregivers, train an LLM on sparse eye-tracking and vocalization fragments to generate synthetic "first-person texts." Interpret these texts heterophenomenologically (study structure/narrative without claiming they map to actual inner experience).
      *   **Conflict:** Half the board sees this as an extension; half sees it as a corruption (requires a subject who can own the report, not an algorithm).
      *   **Constraints:**
          *   Concrete course of action with a timeline.
