prompt: |-
  hey so im a junior and i got stuck on this peer mediation panel at school — every other tuesday we sit with two kids who had some kind of social or academic falling out, not crimes just drama, and we have like 20 mins before lunch to write a reccomendation both sides sign. i read Adam Smith in philosophy class (the sympthy and impartial spectator thing) and i want an actual decision procedure, not just "be fair" vibes.

  can you turn Smith's principle — that you check your judgment by asking whether an impartial spectator could sympathize with your reasoning, not just your feelings — into a step-by-step checklist i can run in 20 minutes? i need the questions in order, what counts as a sufficient answer, where it stops with a hard no, and where it stops being facts and becomes values so i have to just decide. to make it actually work i want it to force me to reconstruct the case from three spectator voices: the kid who was hurt, the kid who acted, and some imaginary student who knows the school rules but doesnt know either person. if all three can sympathize with my reasoning then i go forward, if not i flag it.

  it has to handle the fact that i sometimes know one of the kids personally, and it shouldnt need me to search anything or cite books since i dont have time. apply it to two proposals: (1) a student let their friend copy homework because the friend was having a mental health crisis and begged them, teacher wants both suspended; (2) a student made a viral meme about a teacher, teacher wants expulsion but student says its satire about grading not the teacher personally. for case 2 the procedure should probably say the student was within bounds but my gut says they were still being a jerk — show that tension. also tell me what the procedure just cant do, like maybe it cant fix power imbalances. sorry if theres typos, im writing this on my phone between classes.
reasoning: |-
  Here's a thinking process that leads to the suggested peer mediation checklist:

  1.  **Analyze the Request:**
      *   **User:** Junior in high school, peer mediator.
      *   **Context:** Bi-weekly mediation panel, 20 minutes max, social/academic drama (not crimes), need a signed recommendation.
      *   **Theoretical Basis:** Adam Smith's *Theory of Moral Sentiments* (Sympathy & Impartial Spectator).
      *   **Goal:** A concrete, step-by-step decision procedure/checklist based on Smith, not just "be fair."
      *   **Requirements:**
          *   Ordered questions.
          *   Criteria for sufficient answers.
          *   "Hard No" stop conditions.
          *   Distinction between facts and values.
          *   Three Spectator Voices: Hurt Party, Acting Party, Impartial Student (knows rules, knows neither person).
          *   Handle personal bias (knowing one of the kids).
          *   No external research/citations needed.
          *   Apply to two specific cases (Homework copying vs. Viral meme).
          *   Highlight tensions (e.g., Case 2: within bounds vs. being a jerk).
          *   Acknowledge limitations (e.g., power imbalances).
      *   **Tone:** Practical, urgent (phone typing), respectful of the user's philosophical insight but grounded in high school reality.

  2.  **Deconstruct Adam Smith's Impartial Spectator for this Context:**
      *   *Core Concept:* We judge our own conduct by imagining how an unbiased observer would view it. We seek "mutual sympathy of sentiments."
      *   *Adaptation:* Instead of just *one* spectator, the user wants *three* perspectives to ensure the recommendation holds up under scrutiny from all angles (victim, actor, neutral rule-follower).
      *   *Sympathy:* Not just pity, but "fellow-feeling" or understanding the *propriety* of the motive/action.
      *   *Time Limit:* 20 minutes is tight. The checklist needs to be rapid-fire but deep enough to matter.

  3.  **Drafting the Procedure (The "Smithian Spectator Protocol"):**
      *   *Phase 1: Fact-Finding & Bias Check (Minutes 0-5).* Need to isolate the mediator's bias first.
      *   *Phase 2: The Three Spectators (Minutes 5-15).* This is the core Smithian engine.
          *   Spectator A (Hurt): Do they feel heard/understood?
          *   Spectator B (Actor): Do they feel their motive was understood, even if action was wrong?
          *   Spectator C (Impartial/Rule-Knower): Does this align with community standards?
      *   *Phase 3: Synthesis & Decision (Minutes 15-20).* Where do the sympathies align? Where is the "Hard No"?
      *   *Fact vs. Value:* Need a specific step to identify where data ends and judgment begins.

  4.  **Developing the "Hard No" & "Sufficient Answer" Criteria:**
      *   *Hard No:* Safety issues, admission of serious rule-breaking that mandates admin involvement (mediation isn't for crimes), or total lack of sympathy from the Impartial Spectator.
      *   *Sufficient Answer:* Not necessarily agreement, but *acknowledgment* of the reasoning.

  5.  **Applying to Case 1 (Homework/Crisis):**
      *   *Facts:* Friend copied, mental health crisis, teacher wants suspension.
      *   *Spectator A (Teacher/Hurt?):* Actually, the "hurt" is the academic integrity/system. Let's frame the Teacher/School as the hurt party regarding rules.
      *   *Spectator B (Actor):* Motive was compassion.
      *   *Spectator C (Impartial):* Rules are rules, but context matters.
      *   *Resolution:* Likely a compromise (redo work, no suspension, counseling).

  6.  **Applying to Case 2 (Viral Meme):**
      *   *Facts:* Satire about grading, went viral, teacher wants expulsion.
      *   *Spectator A (Teacher):* Humiliated, authority undermined.
      *   *Spectator B (Student):* Free speech, satire, not personal.
      *   *Spectator C (Impartial):* Disruptive? Yes. Expulsion? Probably disproportionate.
      *   *Tension:* Smith acknowledges "propriety." You *can* have a right to speak but lack propriety (being a jerk). The checklist needs to flag this.

  7.  **Addressing Limitations:**
      *   Smith's theory assumes a level playing field. It doesn't fix bullying dynamics or power imbalances (Teacher vs. Student, Popular vs. Outcast).
      *   20 minutes is too short for deep trauma.

  8.  **Refining the Output:**
      *   Make it look like a tool (Checklist format).
      *   Keep the language accessible but philosophically accurate.
      *   Ensure the "Three Voices" are distinct.
      *   *Self-Correction during drafting:* Wait, the prompt asks for the *Impartial Spectator* to be the main judge, but reconstructed through three voices. I need to make sure the *Mediator* is the one channeling these voices to reach the Impartial judgment.
      *   *Correction:* The Mediator *becomes* the Impartial Spectator by consulting these three perspectives.
      *   *Bias Check:* Crucial since the user knows kids personally.

  9.  **Final Polish:**
      *   Check against constraints: 20 mins? Yes. No books? Yes. Phone friendly? Yes (use bolding/lists).
      *   Ensure the "Fact vs. Value" distinction is clear.
      *   Ensure the "Hard No" is clear.

  10. **Final Review against Smith:**
      *   Smith isn't just "what would a neutral person do?" It's "can the neutral person *enter into* the motives of the agent and the feelings of the patient?"
      *   So the checklist must ask: "Is the motive understandable?" not just "Is the rule broken?"

  (Proceed to generate response based on these thoughts.)
answer: |-
  This is a brilliant application of *The Theory of Moral Sentiments*. You're right: Smith isn't about "being nice." It's about **propriety** (does the action fit the situation?) and **mutual sympathy** (can an observer enter into the motives of the actor and the feelings of the receiver?).

  Since you have 20 minutes and no books, here is the **Smithian Spectator Protocol (SSP)**. It is designed to be written on a notepad during the mediation.

  ### The Smithian Spectator Protocol (20-Minute Version)

  **Pre-Check: The Bias Filter (Minutes 0-2)**
  *Before hearing the case, write this down.*
  1.  **Do I know either party personally?**
      *   *Yes:* I must explicitly state my relationship to the panel and recuse myself from the final signature if I cannot imagine the Impartial Spectator agreeing with me.
      *   *No:* Proceed.
  2.  **Is this a crime or safety threat?**
      *   *Yes (Weapons, drugs, assault):* **HARD NO.** Stop mediation. Refer to Admin immediately. Smith's spectator doesn't negotiate safety.
      *   *No (Drama, rules, feelings):* Proceed.

  ---

  **Phase 1: Fact Reconstruction (Minutes 2-7)**
  *Do not discuss feelings yet. Establish the "case."*
  1.  **What is the specific action?** (e.g., "Copied homework," "Posted meme.")
  2.  **What is the specific rule/norm violated?** (e.g., "Academic Integrity Policy," "Respect for Staff.")
  3.  **What is the proposed punishment?** (e.g., "Suspension," "Expulsion.")

  * **Sufficient Answer:** Both sides agree on *what happened*, even if they disagree on *why*.
  * **Hard No:** If the facts are totally contested (he said/she said with no witnesses), you cannot mediate. Flag for Admin.

  ---

  **Phase 2: The Three Spectator Test (Minutes 7-15)**
  *You (the mediator) must mentally inhabit these three voices. Write a sentence for each.*

  **Voice 1: The Hurt Party (The Patient)**
  *   *Question:* Can I enter into their resentment? Is their anger proportional to the harm?
  *   *Smithian Check:* If the Hurt Party wants punishment way worse than the harm (e.g., expulsion for a meme), their sentiment is **improper**.
  *   *Write:* "Their hurt is valid because ______."

  **Voice 2: The Acting Party (The Agent)**
  *   *Question:* Can I enter into their motive? Even if the action was wrong, was the *intent* understandable?
  *   *Smithian Check:* If the Acting Party shows zero remorse or claims they did nothing wrong when they clearly did, their sentiment is **improper**.
  *   *Write:* "Their motive was ______, but the execution failed because ______."

  **Voice 3: The Impartial Student (The Rule-Knower)**
  *   *Question:* Imagine a student who knows the Handbook but doesn't know these people. What would they say is fair?
  *   *Smithian Check:* This is your tie-breaker. Does the punishment fit the community standard?
  *   *Write:* "A neutral peer would say ______ is the fair consequence."

  ---

  **Phase 3: The Sympathy Synthesis (Minutes 15-20)**
  *Compare the three sentences above.*

  1.  **Do Voice 1 and Voice 2 agree on anything?**
      *   If **Yes:** Build the recommendation there.
      *   If **No:** Move to Voice 3.
  2.  **Does Voice 3 (Impartial) support the Proposed Punishment?**
      *   If **Yes:** Recommend the punishment.
      *   If **No:** Recommend a modified consequence that Voice 3 *would* support.
  3.  **Fact vs. Value Line:**
      *   *Fact:* "The meme was posted." "The homework was identical."
      *   *Value:* "The meme was disrespectful." "Copying helps a friend."
      *   *Decision Point:* If the disagreement is on **Values** (e.g., is satire respectful?), you must default to **Voice 3 (Community Standard)**. You cannot impose your own values.

  **Final Gate:**
  *   **Can all three voices "sympathize" with the recommendation?** (Meaning: Can they understand *why* you decided it, even if they don't love the outcome?)
      *   *Yes:* Write recommendation. Get signatures.
      *   *No:* **Flag.** Do not sign. Tell Admin the mediation failed.

  ---

  ### Application to Your Cases

  Here is how the SSP handles the two scenarios you mentioned.

  #### Case 1: The Homework & The Crisis
  *   **Facts:** Student A copied from Student B. Teacher wants suspension for both.
  *   **Voice 1 (Teacher/School):** Hurt is valid. Integrity is damaged. But suspension harms mental health further. *Resentment is slightly disproportionate.*
  *   **Voice 2 (Student B/Actor):** Motive was compassion (helping a crisis). Execution was rule-breaking. *Motive is sympathetic; action is not.*
  *   **Voice 3 (Impartial Student):** "We shouldn't punish someone for having a crisis, but we can't let copying slide."
  *   **Synthesis:** Suspension is too harsh for Voice 3. Zero consequence is unfair to Voice 1.
  *   **Recommendation:** No suspension. Student A must redo work + counseling referral. Student B gets a warning (no grade penalty) due to "compassionate mitigation."
  *   **Result:** All three can sympathize with the *reasoning* (integrity upheld, crisis managed).

  #### Case 2: The Viral Meme (The Tension Test)
  *   **Facts:** Student posted satire about grading. Teacher wants expulsion. Student says "Free Speech."
  *   **Voice 1 (Teacher):** Humiliated. Authority undermined. Wants maximum penalty. *Resentment is high, but expulsion is disproportionate.*
  *   **Voice 2 (Student):** Motive was commentary on policy, not person. *Motive is understandable, but impact was disruptive.*
  *   **Voice 3 (Impartial Student):** "It's funny, but it went too viral. It disrupted class. Expulsion is crazy, but they need to apologize."
  *   **The Smithian Tension:**
      *   Your gut says the student was a **jerk**. Smith calls this a lack of **Propriety**.
      *   The student was within their *rights* (bounds), but lacked *propriety* (social fit).
      *   **Procedure Output:** The SSP forces you to acknowledge the student didn't break a "crime" rule (Hard No not triggered), but Voice 1 and 3 agree the *manner* was improper.
      *   **Recommendation:** No expulsion (Voice 3 vetoes it). But, mandatory apology to restore "mutual sympathy" (Voice 1 requirement).
      *   **Note:** You write in the notes: *"Student acted within rights but failed in propriety. Recommendation balances free speech with community respect."* This captures your gut feeling without violating the procedure.

  ---

  ### What This Procedure CANNOT Do (Limitations)

  You need to know where Smith fails so you don't blame yourself.

  1.  **Power Imbalances:** Smith assumes the "Impartial Spectator" is truly neutral. In school, a Teacher has way more power than a Student. Voice 3 (Impartial Student) might be scared to side against a Teacher. The procedure can't fix institutional power.
  2.  **Pathology:** If one kid is a narcissist or a bully, they cannot "enter into" the feelings of the hurt party. Smith's system requires basic empathy from both sides. If one side lacks that, mediation will fail.
  3.  **Time:** 20 minutes is barely enough for facts. Deep trauma requires hours. This procedure is for *drama*, not *damage*.
  4.  **Your Own Bias:** Even with the Bias Filter, if you hate the Teacher in Case 2, your "Voice 3" might be skewed. You have to be brutally honest in Phase 1.

  ### Summary Checklist for Your Phone
  *(Screenshot this)*

  1.  **Bias Check:** Do I know them? Is it safe? (If No/Unsafe → Admin).
  2.  **Facts:** Do both agree on *what* happened? (If No → Admin).
  3.  **Voice 1 (Hurt):** Is their anger proportional?
  4.  **Voice 2 (Actor):** Is their motive understandable?
  5.  **Voice 3 (Neutral):** What does the Handbook/Community say?
  6.  **Synthesis:** Does the punishment fit Voice 3 while acknowledging Voice 1 & 2?
  7.  **Propriety Check:** Even if allowed, was it a "jerk" move? (Note this in reasoning).
  8.  **Sign:** Only if all three voices can understand the logic.

  This keeps you from just "vibing" a decision. It forces you to document *why* the Impartial Spectator would agree with you. Good luck at lunch.
