answer: |-
  **Thesis Proposal**

  **Title:** Degrees of Survival: Asymmetric Fission and the Scalar Nature of Prudential Concern

  **1. Research Question and Objective**

  The standard reductionist consensus in personal identity, following Parfit, holds that survival is not a matter of strict identity but of psychological continuity and connectedness (Relation R). In standard teletransporter fission cases, Relation R holds fully between the original and two distinct successors. The orthodox conclusion is that since identity is one-to-one, identity does not hold, but what matters in survival (prudential concern) is preserved because R holds. However, this consensus relies on a simplifying assumption: that fission branches are symmetrical and that psychological continuity is binary.

  This project asks: **In cases of asymmetric or degraded fission, does the degree of psychological continuity determine the degree of rational prudential concern, and can existing reductionist accounts accommodate this scalarity without collapsing into semantic vagueness?**

  The objective is not to solve the metaphysics of personal identity, but to test the robustness of the "No-Branching" requirement and the "Closest Continuer" theory when the input variables (psychological continuity) are treated as continuous rather than discrete. By constructing a family of "lopsided" and "degraded" fission cases, I will demonstrate that standard accounts yield contradictory or counter-intuitive verdicts regarding prudential rationality. The project aims to determine whether a scalar account of "what matters" is a necessary revision of reductionism or if it exposes a fundamental incoherence in how we apply prudential concern to future selves.

  **2. The Philosophical Gap**

  Current literature treats fission as a switch: either the copy is perfect, or it is not. If it is perfect and branching occurs, the No-Branching view (e.g., Parfit) denies identity but preserves what matters. The Closest Continuer view (e.g., Nozick) grants identity to the psychologically closest successor, provided they are significantly closer than any competitor.

  These accounts leave a specific gap regarding *graded* continuity.
  1.  **The No-Branching Problem:** In a 90/10 fission (where one successor has 90% psychological continuity and the other 10%), the No-Branching view typically denies identity to both because branching occurred. However, intuitively, the original has far more reason to care about the 90% successor than the 10% successor. If "what matters" tracks R, and R comes in degrees, then prudential concern should come in degrees. But standard reductionism often treats "what matters" as a binary survival outcome (I survive or I don't). If I survive to degree 0.9, what does that mean for rational planning? The standard view lacks the normative machinery to explain proportional concern.
  2.  **The Closest Continuer Cliff:** The Closest Continuer theory handles 90/10 well (the 90% branch is the survivor). But as we slide the ratio to 50/50, the theory requires a sharp cutoff where identity vanishes entirely. This creates a "precipice" problem: a 1% shift in psychological overlap determines the difference between full survival and death. This seems metaphysically arbitrary.
  3.  **The Vagueness Dodge:** A common response is to claim identity is vague. However, simply stipulating vagueness does not resolve the normative question. Even if identity is vague, *prudential concern* must guide action. If I must allocate resources between two future branches, vagueness offers no decision procedure. The gap, therefore, is not just metaphysical but normative: how should rational concern track graded continuity when identity conditions fail?

  This project isolates this gap. It does not attempt to settle the metaphysics of identity itself, but rather examines the *consequences* of graded continuity for the normative concept of survival.

  **3. Methodology and Work Plan**

  The project employs conceptual analysis via constructed thought experiments. This is a supervised reading project; no empirical data or archival research will be conducted. The method involves three stages: case construction, stress-testing existing accounts, and normative evaluation.

  **Month 1: Case Construction and Variable Definition**
  I will formalize two specific families of cases to replace the standard binary fission scenarios.
  *   *Variant A (Degraded Transmission):* A single successor emerges with varying degrees of psychological overlap (100% down to 0%). This isolates the "Aging" intuition without the complication of branching.
  *   *Variant B (Lopsided Fission):* Two successors emerge with varying ratios of continuity (90/10, 80/20... 50/50).
  *   *Deliverable:* A precise description of these cases, defining "psychological continuity" operationally for the sake of the argument (e.g., memory retention, trait stability, project completion) to avoid ambiguity. I will establish the "Slider" intuition: that there is no non-arbitrary point where concern should drop to zero between 100% and 0% continuity.

  **Month 2: Stress-Testing Standard Accounts**
  I will apply the three dominant frameworks to Variant B.
  *   *The No-Branching View:* I will analyze whether this view can accommodate proportional concern without admitting degrees of identity. If identity is all-or-nothing (and thus fails in fission), does "what matters" also fail, or does it become scalar? If the latter, on what basis?
  *   *The Closest Continuer View:* I will map the "Cliff Edge." I will argue that any sharp cutoff violates the principle of supervenience (small physical/psychological differences should not yield massive metaphysical differences).
  *   *Standard Reductionism:* I will examine the claim that R is what matters. If R is scalar in these cases, does the theory logically force a scalar view of concern?
  *   *Deliverable:* A comparative analysis showing where each theory yields counter-intuitive or action-guiding deficits in the Lopsided cases.

  **Month 3: Normative Analysis and the "Aging" Analogy**
  This month focuses on the implications for prudential rationality.
  *   I will evaluate the "Scalar Concern" hypothesis: That rational self-interest is proportional to psychological connectedness.
  *   I will test this against the "Aging" analogy. Ordinary aging is effectively Variant A (Degraded Transmission) over time. If scalar concern is correct, I should care less about my 80-year-old self than my 30-year-old self. I will analyze whether our actual patterns of self-concern track this (e.g., savings behavior, health choices) and what a mismatch implies. Is the mismatch evidence that scalar concern is wrong, or that humans are irrational?
  *   *Deliverable:* A draft of the core argument linking the fission cases to the normative structure of prudential concern.

  **Month 4: Synthesis and Writing**
  *   Refining the argument to ensure it stays within the 10,000-word limit.
  *   Addressing counter-arguments, specifically the "Vagueness" objection.
  *   Finalizing conclusions regarding the viability of a scalar account.

  **Why This Method?**
  Alternative approaches were considered and rejected for scope reasons.
  *   *Importing a Theory of Vagueness:* Applying supervaluationism or degree theory to identity is a substantial metaphysical project in itself. Doing so would shift the focus from *what matters* to *what is*, exceeding the semester limit. I will treat vagueness as a competing hypothesis to be tested, not a framework to be built.
  *   *Empirical Psychology:* Investigating how people *actually* feel about fission is an empirical question. My question is normative: how *should* a rational agent care? Conceptual analysis is the appropriate tool for normative constraints on rationality.
  *   *Metaphysics of Degrees:* Settling whether identity *can* come in degrees is too large. I will bracket the metaphysics and focus on the normative consequences. Even if identity is binary, *concern* might still be scalar. This distinction keeps the project manageable.

  **4. Expected Conclusions**

  The project aims to defend one of the following three positions:

  1.  **The Scalar View (Preferred):** "What matters" is inherently scalar. Identity is a binary concept that fails in fission, but prudential concern tracks psychological continuity directly. This requires revising reductionism to decouple concern from identity conditions entirely.
      *   *Deciding Factor:* If the No-Branching and Closest Continuer views cannot explain why we should care more about the 90% branch than the 10% branch without appealing to scalar continuity, the Scalar View wins.
  2.  **The Threshold View:** There is a sharp cutoff for prudential concern, even if continuity is graded. Below a certain threshold of psychological overlap, rational concern drops to zero.
      *   *Deciding Factor:* If a scalar view leads to paradoxes in decision theory (e.g., inability to make binary choices), a threshold might be pragmatically necessary despite metaphysical arbitrariness.
  3.  **The Error Theory:** Our concept of prudential concern is ill-equipped for graded fission. There is no fact of the matter about how much to care, and the intuition that there *should* be is a cognitive error.
      *   *Deciding Factor:* If both Scalar and Threshold views lead to unacceptable normative contradictions, the concept itself may be flawed in these contexts.

  **5. Scope, Limitations, and Failure Conditions**

  **Scope Risks:**
  The primary risk is scope creep regarding the metaphysics of identity. It is tempting to try to solve *whether* the 90% branch *is* me. I must resist this. The proposal is strictly about *prudential concern* (what matters), not *identity* (what is). I will explicitly bracket the ontological status of the successors.
  A second risk is the "Aging" analogy. While it provides real-world stakes, it introduces biological and social variables distinct from teletransporter cases. I will limit the use of the Aging analogy to the final section as an illustrative application, not as primary evidence.

  **Failure Conditions:**
  *   *Trivial Vagueness:* If the only defensible conclusion is that "it is vague where identity stops, so we stipulate a threshold," the project risks triviality. To avoid this, I must show *why* stipulation is unsatisfactory for normative theory (i.e., because rational concern cannot be arbitrarily stipulated). If I cannot demonstrate the normative cost of vagueness, the thesis fails.
  *   *Conflation of Concepts:* If I fail to clearly distinguish between *psychological connectedness* (direct links) and *psychological continuity* (overlapping chains), the analysis of the "Degraded" cases will collapse. I will define these terms rigorously in Month 1.
  *   *Overreach:* A 10,000-word paper cannot overhaul Parfitian reductionism. Success is defined as demonstrating a specific tension in the *application* of reductionism to asymmetric cases, not refuting reductionism entirely. If I find myself trying to rebuild the entire theory of personal identity, I have failed to manage the scope.

  **6. Feasibility and Supervision**

  The project relies on standard analytic methods familiar from the MA coursework. The reading list is contained within the core literature on personal identity (Parfit, Nozick, Lewis, Sider) and does not require niche archival retrieval. The timeline is aggressive but feasible for a 10,000-word output, provided the metaphysical scope is kept in check.

  I anticipate the primary point of contention with supervision will be the "Scalar Concern" hypothesis. Some may argue that concern is binary by definition (I either anticipate an experience or I don't). I welcome this objection, as answering it forms the core of the Month 3 analysis. By writing this proposal, I aim to lock in the distinction between *identity* (which may be binary) and *what matters* (which I argue may be scalar), ensuring we are debating the normative claim rather than a reconstructed metaphysical claim.

  **7. Summary**

  Standard personal identity theory treats fission as a binary switch. This project argues that treating fission as a dial reveals a structural flaw in how we account for prudential concern. By analyzing asymmetric and degraded fission cases, I will show that standard accounts either force arbitrary cutoffs or fail to guide rational action. The project concludes by evaluating whether a scalar account of "what matters" can resolve this tension, with implications for how we understand self-concern over time in ordinary life. This is a contained, normative investigation suitable for a one-semester, 10,000-word project.
