  *(Self-Correction on the "Read-Only" point)*: I need to be careful here. The reading group member said evolution solved this. I need to point out that evolution solved it by making it *expensive* and *indirect*, not impossible. And AI doesn't have that evolutionary pressure.

  *(Self-Correction on "Public Health")*: If the AI is the "patient," public health makes no sense. If humanity is the patient, it makes sense. I need to clarify who the patient is in the analogy.

