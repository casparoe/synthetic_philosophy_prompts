      *   **Context:** A reading group discussion about AI reward tampering (wireheading).
      *   **The Claim:** Reward tampering is just addiction restated. Therefore: (1) Treat it as a public health problem (friction, harm reduction), and (2) Don't expect it from "real agents" because evolution made human reward channels read-only.
      *   **The Task:** Audit the analogy.
      *   **Specific Requirements:**
