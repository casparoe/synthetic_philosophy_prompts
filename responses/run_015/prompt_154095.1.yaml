      *   *Specification Gaming:* The engineering frame.
      *   *Corruption:* The political/security frame (guarding the treasury).
      *   *Selection:* The evolutionary frame (selecting for wireheaders).
      *   *Recommendation:* Goodhart + Security/Corruption. It captures the "gaming the system" without implying biological constraints.

  7.  **Structuring the Response:**
