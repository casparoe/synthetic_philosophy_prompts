prompt: |-
  I'm organizing a reading group of software engineers and data scientists who meet monthly to discuss decision theory. None of them have formal economics training, but they're comfortable with probability, expected value, and basic calculus. Next month I'm leading a session on Kelly betting and the idea that when you face a sequence of favorable repeated bets, you shouldn't maximize expected wealth — you should maximize expected geometric growth rate, which means betting a fraction of your bankroll rather than going all-in. The session is ninety minutes, and I'll have a whiteboard.

  Don't explain Kelly betting to me. I already understand it. Plan how I should teach it: the order in which the pieces must be introduced and what depends on what, the one worked example that should carry the entire session and what features it needs to have, the misconceptions this audience will predictably form and exactly where in the sequence I should head each one off, what I should explicitly refuse to cover at this level, and a check for understanding I can use near the end to see whether the core idea actually landed.

  I'm especially worried about a few traps. These people know enough math to follow a derivation but not enough to notice when a derivation is answering a different question than the one they thought they asked. They'll have seen expected-value reasoning before and will trust it. And at least two of them will have heard the phrase "Kelly criterion" from poker or sports betting and will arrive with half-remembered rules of thumb. I need the session to make them feel the problem viscerally before I give them the mathematics — otherwise the math will just feel like a clever trick whose motivation they accept on my say-so.

  End your response with a single sentence, on its own line, that summarizes the central pedagogical challenge this topic presents for this audience.
