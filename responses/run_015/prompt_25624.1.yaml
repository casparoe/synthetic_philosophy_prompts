answer: |-
  ### Session Plan: Kelly Betting and Geometric Growth

  **Total Time:** 90 Minutes
  **Tools:** Whiteboard, Markers (multiple colors for distinguishing paths)

  #### 1. The Order of Operations (Dependencies)
  You must establish the failure of Expected Value (EV) *before* introducing the Kelly derivation. If you derive Kelly first, they will treat it as a constraint optimization problem rather than a correction of a fundamental modeling error.

  1.  **The Visceral Hook (0–20 min):** Demonstrate the divergence between Ensemble Average (EV) and Time Average (Geometric) using the anchor example at maximum exposure ($f=1$).
  2.  **The Diagnosis (20–35 min):** Formalize *why* EV fails here (non-ergodicity). Distinguish parallel universes vs. single timeline.
  3.  **The Solution (35–65 min):** Introduce bet fraction $f$ as a control variable. Derive the growth rate maximization.
  4.  **Implications & Check (65–90 min):** Discuss overbetting (ruin) and verify understanding.

  #### 2. The Anchor Worked Example
  **Scenario:** "The Asymmetric Coin."
  *   **Setup:** You have a bankroll $W$. You encounter a repeated opportunity 100 times.
  *   **The Bet:** You choose a fraction $f$ of your current bankroll to wager each time.
  *   **The Odds:** A fair coin ($p=0.5$).
      *   **Heads:** You win 100% of your wager (Bankroll becomes $W \cdot (1 + f)$).
      *   **Tails:** You lose 50% of your wager (Bankroll becomes $W \cdot (1 - 0.5f)$).
  *   **Why this example:**
      1.  **Simple Arithmetic:** At $f=1$ (all-in), the multipliers are $\times 2$ and $\times 0.5$.
      2.  **Visceral Trap:** At $f=1$, Expected Value is positive ($1.25x$ per round), but Geometric Growth is exactly $1.0$ ($\sqrt{2 \cdot 0.5} = 1$). You expect to get rich, but you stay flat on average while volatility eats you.
      3.  **No Immediate Ruin:** Unlike standard "win bet/lose bet" examples, $f=1$ does not go to zero immediately, allowing you to discuss *suboptimal growth* rather than just *ruin*.
      4.  **Calculus Friendly:** The log-optimization derivative is clean ($\frac{1}{1+f}$ vs $\frac{-0.5}{1-0.5f}$).

  **How to use it:**
  *   **Phase 1:** Set $f=1$. Ask them to calculate Expected Wealth after 2 flips vs. Likely Wealth after 2 flips. Show the divergence.
  *   **Phase 2:** Generalize to variable $f$. Ask them to find the $f$ that maximizes the *Likely* Wealth (Geometric Mean), not Expected Wealth.

  #### 3. Misconceptions and Defusal Tactics
  This audience will bring specific baggage. Address these at the exact moments they arise.

  *   **Trap 1: "EV is the universal truth."**
      *   *When:* During the Hook (min 10).
      *   *Defusal:* Do not argue EV is "wrong." Argue it answers the wrong question. Write on the board: **EV = Average across parallel universes. Geometric = Average across time in this universe.** Explicitly state: "If you can play this bet in 1,000 parallel universes once, use EV. If you play it in one universe 1,000 times, use Geometric."
  *   **Trap 2: "Kelly is about risk aversion/utility."**
      *   *When:* During the Derivation (min 45), when you introduce the logarithm.
      *   *Defusal:* Engineers often view log-utility as a subjective preference for safety. You must explicitly refuse this framing. Say: "We are not using log because we are 'risk-averse.' We are using log because $\log(\prod x_i) = \sum \log(x_i)$. It is the only function that turns multiplicative time-series growth into an additive expectation we can maximize."
  *   **Trap 3: "I know this from poker; it's just edge/odds."**
      *   *When:* Introduction (min 5).
      *   *Defusal:* Acknowledge the heuristic immediately. "If you've heard $f^* = \text{edge}/\text{odds}$, good. Today we are deriving *why* that formula exists and what assumptions break it, so you don't apply it to correlated risks or finite horizons blindly."
  *   **Trap 4: "Maximizing growth means maximizing final wealth."**
      *   *When:* Wrap-up (min 80).
      *   *Defusal:* Clarify that Kelly maximizes the *rate* of growth. In finite horizons with high uncertainty, fractional Kelly often dominates full Kelly due to variance, but full Kelly is the asymptotic optimum.

  #### 4. Scope Limits (What to Refuse)
  To stay within 90 minutes and maintain clarity, explicitly state you will **not** cover:
  1.  **Subjective Utility Theory:** Do not dive into Von Neumann–Morgenstern utility. Keep the justification objective (ergodicity), not subjective (preferences).
  2.  **Continuous Finance:** Do not mention Black-Scholes, Itô calculus, or Merton's portfolio problem. It distracts from the discrete intuition.
  3.  **Correlated Bets:** Do not discuss multi-asset portfolio Kelly. Stick to single-asset sequential betting.
  4.  **Drawdown Constraints:** Do not discuss "Safety First" constraints. Focus purely on the growth metric.

  #### 5. Check for Understanding
  **Timing:** Minute 75 (Before wrap-up).
  **Activity:** "The Trap Question."
  Write this on the board:
  > "I offer you a bet: 99% chance to double your money, 1% chance to lose everything. You can play this repeatedly with reinvestment."
  > 1. What is the Expected Value per round?
  > 2. What is the Kelly fraction?
  > 3. **Why** does the Kelly fraction differ from the EV recommendation?

  **Success Criteria:**
  *   They calculate EV correctly ($1.98x$).
  *   They identify Kelly fraction is 0 (or close to it, depending on loss magnitude).
  *   **Crucial:** They explain the difference using **Time vs. Ensemble** language. If they say "because risk is high," they failed. If they say "because the geometric mean is zero/negative due to the ruin term," they succeeded.

  The central pedagogical challenge is displacing the intuitive primacy of ensemble averages in favor of time averages without invoking subjective utility preferences.
