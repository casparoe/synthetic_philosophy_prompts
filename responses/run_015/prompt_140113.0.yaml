answer: |-
  ### PREP SHEET: FREE-FLOATING RATIONALES

  **1. The Definition Trap (Scanlonian)**
  *   **The Voice:** "You're changing the subject. For us, 'reason' is a functional term. It denotes a consideration counting *in favor of an agent's action*. If there's no agent, there's no favoring relation. You've got a value fact there, not a reason. Calling it a 'reason' is like calling a hammer a 'screw' because it can drive one in."
  *   **The Damage:** Fatal. If they win this, your view collapses into plain value realism, and your ontology is redundant.
  *   **The Reply:** "I'm not changing the subject; I'm expanding the ontology to explain the *source* of the triadic relation. The value fact exists independently. The 'reason' is the normative force of that fact. When an agent arrives, the force doesn't generate; it connects. If I say 'there is a reason to relieve suffering' in the Valley, I'm not saying 'someone should do it' (impossible); I'm saying 'the situation demands relief.' The triadic relation is the *uptake* of that demand, not the existence of the demand."
  *   **The Soft Spot:** You're relying on an intuition that "demands" can exist without "demandees." They will say this is mystical.

  **2. The Guidance Constraint (Constructivist)**
  *   **The Voice:** "Normativity is for agents. A norm that cannot guide anyone isn't a norm. In your Sealed Valley, the 'reason' cannot guide anyone because no one can act. So it's inert. Why call it normative? It's just a description of a bad state of affairs. Norms are tools for practical reasoning; your free-floaters are useless tools."
  *   **The Damage:** High. Undermines the "normative" status of your reasons.
  *   **The Reply:** "Distinguish *guidance* from *correctness*. A reason fixes the standard of correctness for action. Even if no one can meet the standard (Valley), the standard exists. When an agent *can* act (Inheritance), the reason guides them *because* it was already there setting the cost. If reasons were created by access, newly possible duties would feel like inventions. They feel like discoveries. That phenomenology needs explaining."
  *   **The Soft Spot:** You're leaning heavily on phenomenology ("feels like discovery") against a metaphysical constraint ("norms must guide").

  **3. The Debtor Problem (Scanlonian/Metaphysical)**
  *   **The Voice:** "You say these reasons fix 'deontic costs.' Costs imply a debtor. Who owes the debt in the Sealed Valley? The universe? If no agent is bound by the reason, what work is the 'cost' doing? It sounds like you want the gravity of obligation without the burden of a subject."
  *   **The Damage:** High. Makes the "deontic cost" language look incoherent or metaphorical.
  *   **The Reply:** "The cost is attached to the *state of affairs*, not the agent. The world is worse off. When an agent enters, they inherit the opportunity to settle that cost. Think of it like a debt attached to a property, not a person. The house owes the tax. If you buy the house, you pay the tax. The tax existed before you owned the house."
  *   **The Soft Spot:** The analogy risks category errors. Houses don't owe taxes; owners do. You're reifying states of affairs.

  **4. The Idle Wheel (Decision Theorist)**
  *   **The Voice:** "Okay, suppose I grant you this ontology. Walk me through a decision matrix. Does positing a free-floating reason change the expected utility calculation for an agent who *does* have access? If the input (value of outcome) and output (action) are identical to value realism, you've added metaphysical baggage for zero practical return."
  *   **The Damage:** Medium-High. Makes the view philosophically idle.
  *   **The Reply:** "It changes the explanation of *why* the utility is weighted that way. On value realism, the weight comes from the agent's valuation. On my view, the weight is objective and pre-existing. This matters for error theory: an agent can be wrong about the weight even if their valuation is consistent. It stabilizes the matrix against subjective fluctuation."
  *   **The Soft Spot:** Decision theorists often don't care about the "why" of the weights, only the weights themselves.

  **5. The Magic of Uptake (Constructivist/Metaphysical)**
  *   **The Voice:** "You say agents 'inherit' these reasons via 'proxy uptake' when gaining causal access. What is the mechanism? Is it causal? Normative? If I dig a tunnel to the Valley, does the reason jump into my head? If it's normative, how does a normative fact latch onto a physical change in access? This sounds like occasionalism."
  *   **The Damage:** Medium. Makes the view look metaphysically spooky.
  *   **The Reply:** "It's not a causal jump; it's a change in relational status. The reason was always *addressable*; it just lacked an addressee. Causal access makes the agent a valid addressee. It's like a radio signal: the broadcast exists before you turn on the set. Turning on the set doesn't create the signal; it allows reception."
  *   **The Soft Spot:** The radio analogy works for information, not normativity. Signals don't *obligate* receivers.

  **6. The Projection Charge (Expressivist)**
  *   **The Voice:** "Why posit this strange ontology? Isn't it simpler to say you have a strong negative attitude toward the suffering in the Valley, and you're projecting that attitude onto the world by calling it a 'reason'? You're reifying your own regret."
  *   **The Damage:** Medium. Offers a deflationary alternative.
  *   **The Reply:** "Regret is subjective; reasons are accountable. If I say 'there's a reason,' I'm claiming something you can disagree with. If it were just my attitude, disagreement would be impossible. The Sealed Valley intuition persists even when I'm not feeling regretful. It's robust against mood."
  *   **The Soft Spot:** They will argue your "robustness" is just shared human psychology, not ontology.

  **7. Proliferation (General)**
  *   **The Voice:** "If reasons don't need agents, why stop at suffering valleys? Is there a reason for the weather to be sunny? A reason for rocks to be hard? If you sever the link to agency, you flood the universe with reasons. How do you filter them?"
  *   **The Damage:** Medium-Low. Makes the view look absurd, but manageable.
  *   **The Reply:** "Restriction clause: Free-floating reasons only attach to states of affairs that are *potentially* actionable by some possible agent. The weather isn't actionable in the relevant normative sense. Rocks don't suffer. We're talking about normative valences on *outcome states*, not arbitrary facts."
  *   **The Soft Spot:** "Potentially actionable" smuggles agency back in, threatening the "unowned" claim.

  **8. Temporal Location (General)**
  *   **The Voice:** "When does the reason exist? In the Valley case, it exists before agents. But reasons are usually timeless. Are you saying reasons come into existence when the suffering starts, even if no agents exist? What if the universe never produces agents? Do the reasons just hang there forever?"
  *   **The Damage:** Low. Technical worry.
  *   **The Reply:** "Yes. If the universe never produces agents, the reasons remain unowned. They are part of the normative structure of reality, like laws of physics, waiting for relevant variables (agents) to instantiate them."
  *   **The Soft Spot:** Sounds excessively Platonist. Hard to swallow for naturalists.

  ***

  ### UPFRONT CONCESSIONS (First 2 Minutes)
  1.  **Terminological Friction:** Acknowledge immediately that you are using "reason" in a broader sense than the standard triadic model. Tell them you know this sounds like category inflation, but argue it's necessary to capture the *source* of the triadic relation.
  2.  **Guidance Limitation:** Concede that free-floating reasons do not guide *until* uptake. Don't fight the constructivist on guidance *in the Valley*; fight them on whether guidance is the *essence* of normativity or just its *function for agents*.
  3.  **Value Overlap:** Admit that free-floating reasons co-locate with values. Your claim isn't that they are distinct from value, but that they are the *normative force* of value independent of valuation.

  ***

  ### THE ONE REPLY THAT MUST LAND
  **The Sealed Valley Intuition.**
  If you cannot make them feel that "There is a reason to relieve that suffering" is true *even when no one can*, the paper dies. You must hammer the phenomenology of **regret vs. obligation**.
  *   **The Line:** "If it were merely value, we would feel only sadness that something good was lost. But we feel a specific normative frustration—a sense that something *should have been done*, even if no one could do it. That 'should' is the free-floating reason. If you deny it, you can't explain why the later agent feels bound to fix it if they can. They aren't fixing a value; they're answering a call."

  ***

  ### THE QUESTION YOU HOPE NOBODY ASKS
  **You guessed Proliferation (Reasons for the weather). I agree, but the sharper version is: "Reasons for Impossible Actions."**
  *   **The Worry:** If there is a reason to relieve the suffering in the Valley, and reasons are norms, does that mean there is a reason to do the impossible? If "Ought implies Can" holds, your view violates a core principle of practical rationality.
  *   **Why it's worse than Weather:** Weather is irrelevant. Impossible actions strike at the heart of the link between normativity and agency.
  *   **Prep:** Be ready to deny that "Reason implies Can." Argue that "Reason" sets the target; "Can" determines if the arrow flies. The target exists even if the bow is broken.

  ***

  ### META-ADVICE: WHERE I MIGHT BE WRONG
  **The Risk:** I am assuming the room cares about metaphysical grounding more than practical utility. If the room is predominantly pragmatic (even the non-naturalists), they may not care about the "source" of the reason, only its function.
  **The Drop Condition:** I would tell you to drop the "Free-Floating Reason" ontology and restate as **Value Realism + Inheritance** if:
  *   **The Argument:** You cannot explain what work the "reason" does that "value" + "agent capacity" doesn't already do. If the "deontic cost" is just the negative value of the state of affairs, and "uptake" is just the agent gaining the capacity to affect that value, then "free-floating reason" is a fifth wheel.
  *   **The Test:** Ask yourself: *If I say "There is immense negative value in the Valley" and "Agents inherit the capacity to reduce this value," do I lose any explanatory power compared to "There is a free-floating reason"?* If the answer is no, simplify. The constructivists will eat you alive on ontology if the payoff is just terminological. Only keep the ontology if it solves a specific problem (like the "discovery" phenomenology) that value realism cannot.
