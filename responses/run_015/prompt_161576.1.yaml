answer: |-
  **The Scenario**

  You are an angel investor with a fixed capital pot, presented with a sequence of ten independent early-stage deals over five years; for each deal, you may stake any fraction $f$ of your current bankroll, knowing that historically such ventures succeed with probability $p=0.05$ and, upon success, return 25 times the stake ($b=25$), while failures lose the stake entirely. There is no secondary market to sell your position, no borrowing to top up, and no income outside this pot; you simply reinvest whatever remains after each of the ten rounds into the next identical opportunity.

  **The Arithmetic**

  Let $W_0=1$ and $W_{10}$ be terminal wealth. If $k$ deals succeed, $W_{10} = (1+25f)^k (1-f)^{10-k}$.

  1.  **Expected Wealth (EV):** The expected growth per round is $E[W_1] = 0.05(1+25f) + 0.95(1-f) = 1 + 0.3f$. Since the edge is positive ($30\%$ per unit staked), expected terminal wealth $E[W_{10}] = (1+0.3f)^{10}$ is strictly increasing in $f$. The maximiser stakes everything: **$f_{EV} = 100\%$**.
  2.  **Growth Rate (Kelly):** We maximise the expected log-wealth $E[\ln W_{10}] = 10 \left[ 0.05 \ln(1+25f) + 0.95 \ln(1-f) \right]$. Differentiating with respect to $f$ and setting to zero yields the standard Kelly fraction $f^* = \frac{p(b+1)-1}{b} = \frac{0.05(26)-1}{25} = \frac{0.3}{25}$. The growth-rate maximiser stakes: **$f_{Kelly} = 1.2\%$**.
  3.  **Typical Outcome (Median):** The number of wins $k$ follows a Binomial distribution $B(10, 0.05)$. The probability of zero wins is $P(k=0) = 0.95^{10} \approx 0.599$. Since this exceeds $0.5$, the median outcome of the distribution is exactly zero wins. For the median path, terminal wealth is $W_{med} = (1-f)^{10}$. This is strictly decreasing in $f$ for any $f>0$. To maximise the median outcome, the bettor must decline the bet entirely: **$f_{Median} = 0\%$**.

  **Diagnostics**

  The feature doing the work is the combination of **low probability ($p < 0.5$)** and **finite horizon ($N$)**. This skew ensures that while the *average* path sees $Np$ wins, the *median* path sees zero wins for small $N$. The median rule is timid because, over short horizons, the most likely realisation of a long-shot strategy is a string of total losses, making any compounding of losses mathematically optimal to avoid.

  If the horizon is allowed to grow without bound ($N \to \infty$), the Law of Large Numbers ensures the realised win rate converges to $p$. The median number of wins shifts from 0 to $\approx Np$, and the median wealth criterion converges smoothly onto the Kelly criterion. However, this convergence is **lumpy**, not smooth; the optimal median stake remains at zero until the horizon is long enough that $P(k=0) < 0.5$. For this specific gamble ($p=0.05$), the median stake remains zero until **$N=14$**, at which point the probability of zero wins drops to $0.488$, the median win count becomes 1, and the optimal median stake jumps discontinuously to a positive figure.

  If the payoff is made symmetric (e.g., a coin flip where $b=1$), a positive EV requires $p > 0.5$. In that case, the median win count exceeds zero almost immediately (even at $N=1$), and the median stake becomes positive right away. The divergence between Kelly and Median is therefore a specific property of favourable long-shot bets over short horizons.

  **The Defence**

  A **Kelly advocate** would argue that the median criterion is myopic: it optimises for the single most likely path while ignoring the magnitude of the upside on the less likely paths that drive compound growth. They would contend that refusing a bet with positive expected log-wealth ($1.2\%$ stake) guarantees underperformance over a lifetime of such opportunities, and that "typical" should be defined by the geometric mean (ergodic property), not the statistical median of a finite sample.

  A **Median advocate** would reply that ergodicity is a luxury of infinite time. For a single investor with a fixed ten-deal horizon, the ensemble average is irrelevant; they inhabit only one reality. Since the most probable outcome of betting is having less money than starting, the growth-rate argument relies on an asymptotic promise the investor may never live to see. They would argue that protecting the capital from the most likely loss scenario takes precedence over theoretical long-term optimality.

  **Verdict**

  I would hand them the Kelly criterion, because a small positive stake preserves capital while capturing the positive edge, whereas the median rule's recommendation of zero stake guarantees stagnation in a favourable market.
