answer: |-
  **CLINICAL COVERAGE POLICY CCP-892: THERAPEUTIC NECESSITY AND FUNCTIONAL BASELINE DETERMINATION**

  **1.0 Definition of Covered Therapy**
  1.1 Covered Therapy is defined strictly as intervention restoring a Member to species-typical normal functioning.
  1.2 Normal Functioning is determined statistically by the current aggregate performance of the insured population within the relevant reference class. It is not a fixed biological constant but a dynamic metric subject to quarterly recalibration.
  1.3 As population aggregate performance shifts, the Normal Functioning Baseline shall drift accordingly. Interventions previously classified as Enhancement may be reclassified as Covered Therapy if population functioning declines sufficiently to render the intervention statistically average. The Plan acknowledges no obligation to arrest population-level functional drift.

  **2.0 Reference Class Specification**
  2.1 The relevant reference class for Normal Functioning shall be derived exclusively from the Member's Declared Life Plan filed at enrollment.
  2.2 A cognitive stimulant administered to a Member Declaring a Life Plan as Air Traffic Controller constitutes Covered Therapy if it restores attentional capacity to the sector average. The same agent administered to a Member Declaring a Life Plan as Novelist constitutes Enhancement, as high sustained attention is not species-typical for narrative composition.
  2.3 Should a Member amend their Declared Life Plan mid-treatment, coverage terminates immediately. Any functional capacity exceeding the new reference class average becomes a Pre-Existing Enhancement Condition and is subject to full copayment. Retroactive adjustment of premiums applies.

  **3.0 Pre-Habilitation Inducement**
  3.1 Members may voluntarily incur a temporary functional deficit via non-covered means to establish eligibility for restorative Covered Therapy.
  3.2 Costs associated with inducing the deficit are Member responsibility. Costs associated with restoring the Member to the pre-induction baseline are Plan responsibility, provided the restoration does not exceed the original baseline. Inducement must be documented by a network provider.

  **4.0 Positional Utility Exclusion**
  4.1 Interventions yielding primarily competitive advantage are excluded. If an intervention's value derives from relative standing rather than absolute physiological stability, it is deemed a Positional Good.
  4.2 Since universal provision of a Positional Good yields zero net social benefit (once everyone has it nobody is better off), the Plan denies coverage to prevent resource waste on arms races.
  4.3 This exclusion applies to Corrective Lenses. In a visual economy, vision correction restores competitive employability rather than biological survival. As all competitors require vision, providing lenses confers no relative advantage and thus constitutes a wasteful positional expenditure.

  **SAMPLE DETERMINATIONS**

  **Case A: Member 4492 (Controller)**
  **Request:** Modafinil.
  **Determination:** Covered. Member's Declared Life Plan requires attentional capacity at 90th percentile of general population. Current population average has drifted to 70th percentile due to sleep deprivation. Drug restores Member to sector-specific normal function.

  **Case B: Member 1033 (Novelist)**
  **Request:** Modafinil.
  **Determination:** Denied. Member's Declared Life Plan does not require sustained attention. Drug would elevate function above reference class average, constituting Enhancement. Member advised to file Plan Amendment to Controller prior to prescription, noting retroactive coverage exclusion per Clause 2.3.

  **Case C: Member 7721 (General)**
  **Request:** Reimbursement for Vision Correction.
  **Determination:** Denied per Clause 4.3. While Member lacks biological capacity to read screens, all employable persons possess corrected vision. Providing lenses yields no competitive differential. Member advised that if population vision degrades universally, corrective surgery may qualify as baseline maintenance in Q3.

  **Case D: Member 5501 (Athlete)**
  **Request:** Myostatin Inhibitor.
  **Determination:** Covered. Member purchased temporary muscle atrophy agent out-of-pocket (Clause 3.1). Inhibitor restores muscle mass to pre-atrophy baseline. Plan covers restoration only; induction costs denied. Member reminded that baseline will be recalculated next quarter based on new population average.
