answer: |-
  Roommate Pattern Truce Document

  1. Agreed claims
  1. There is a world out there that exists whether we are looking at it or not.
  2. Dennett's three stances (physical, design, intentional) are all valid tools for describing things.
  3. The physical stance looks at particles and physics, the design stance looks at function, and the intentional stance looks at beliefs/goals.
  4. Slime mold physically moves through a maze to find food, regardless of what we call it.
  5. Prediction is the main way we test if an idea is useful enough to keep around.
  6. Hurricanes happen and destroy stuff even if nobody is there to name them.
  7. At the bottom level, reality is just particles bumping around according to laws.
  8. We both want to know if "patterns" are discovered or invented.

  2. The disagreements table

  | my wording | his wording |
  | :--- | :--- |
  | If a pattern lets you predict things reliably, it's real enough to count. | A pattern is only real if it's literally built into the fundamental physics. |
  | The design stance captures something true about how the world works. | The design stance is just a useful metaphor or compression trick. |
  | A hurricane is "trying" to maintain itself in a meaningful way. | A hurricane just follows physics; saying it "tries" is projecting human stuff. |
  | Slime mold solving a maze shows real goal-directed behavior. | Slime mold following chemicals is just mechanics, not actual problem solving. |
  | Useful fictions become real when they stop being optional. | Useful fictions are always fictions, no matter how well they work. |

  3. The cruxes

  **Crux 1: The Slime Mold Maze**
  *Case:* We put slime mold at the start of a complex maze with food at the end. It finds the shortest path.
  *My prediction:* The mold is actually solving a problem, so the "solution" pattern is real.
  *His prediction:* The mold is just reacting to local chemical gradients, so the "solution" is just us describing the outcome.

  **Crux 2: The Hurricane**
  *Case:* A hurricane spins and draws energy to keep going against friction.
  *My prediction:* It's actively maintaining itself, so the "self-preservation" pattern is real.
  *His prediction:* It's just pressure differences equalizing, so "self-preservation" is a story we tell.

  **Crux 3: The Chess Computer**
  *Case:* An AI sacrifices a pawn to win the game 20 moves later.
  *My prediction:* The AI "wanted" to win, so the intention pattern is real.
  *His prediction:* The AI just calculated probabilities, so "wanting" is purely metaphorical.

  4. Is this partly just words?
  Yeah, honestly, some of this is definitely just us defining "real" differently. If I say real means "reliable prediction" and he says "real" means "fundamental physics", we might actually agree on the facts but not the label. But I think there's a genuine split on whether higher-level stuff can cause things without us needing to recieve the lower-level explanation every time. Once we sort that out, maybe we can stop arguing long enough to eat dinner.
