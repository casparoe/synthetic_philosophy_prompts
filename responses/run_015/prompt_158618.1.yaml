  **Fit with Verdicts:**
  *   Fits V1 & V5: Physical determinism and physical explanations of mind are accepted without anxiety because they are just "more law."
  *   Fits V2: Prediction is epistemic; causation is ontic. Knowing the cause doesn't change the nature of the cause.
  *   Fits V3: The "Cosmic Feeling" is awe at the *existence* of the causal order, not its origin story.

  #### 2. Alternative Rule A: Teleological Purity (The Impersonal Order)
  **The Rule:** The cosmic religious feeling depends on the order being *non-teleological*. Nature's laws are blind and impersonal (Spinoza's *Deus sive Natura*). Any system that introduces "optimization" or "goal-seeking" mimics a Providential God, which violates the rejection of a personal deity.
  **Fit with Verdicts:**
  *   Fits V3: Explicitly rejects a personal God who intervenes or judges.
  *   Fits V4 & V1: Compatible with determinism, provided the determinism is "blind" law rather than "engineered" outcome.
  *   Fits V5: A physical explanation of mind is fine, provided it doesn't suggest the mind is a "designer" overriding natural law.

  #### 3. Alternative Rule B: Internal Coherence (The Authenticity Condition)
  **The Rule:** Relative freedom survives only if the determining causes operate *through* the agent's internal character rather than bypassing it. If external factors shape the context in which you deliberate, freedom remains. If they bypass deliberation (e.g., direct stimulation), freedom is lost.
  **Fit with Verdicts:**
  *   Fits V2 & V4: Distinguishes between "causation" (which is universal) and "coercion" (which overrides internal will).
  *   Fits V1: Moral blame is a social tool used when internal coherence is presumed; if bypassed, the tool is useless.
  *   Fits V5: Explaining the mind physically preserves freedom as long as the explanation respects the mind's causal role.

