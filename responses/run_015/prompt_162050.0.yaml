answer: |-
  You have put your finger on one of the most structurally important—and philosophically subtle—moves in the architecture of science. You are correct that this is not *motte-and-bailey* (which implies bad faith or a retreat to a weaker position) and it is not simple equivocation (using two different meanings). It is a functional duality required for scientific theories to get off the ground.

  There is an established name for this in the philosophy of science, though it is technical. The concept you are describing is best captured by **Reichenbach's Co-ordinating Principles** (or *Zuordnungsdefinitionen*), updated in contemporary philosophy by Michael Friedman's concept of the **Constitutive A Priori**.

  If you need a label for a general audience, the most accurate descriptive term is **Framework-Empirical Duality**.

  Here is the breakdown of what this is, why it is necessary, and how to distinguish its legitimate use from dogmatism.

  ### 1. The Technical Name: Co-ordinating Principles
  In the 1920s, the philosopher Hans Reichenbach noticed exactly what you are seeing. He argued that scientific theories need a bridge between the **formal calculus** (the math, e.g., Turing machines, differential equations) and the **physical reality** (the stuff, e.g., brains, falling bodies).

  He called these bridges **Co-ordinating Definitions**.
  *   **As Definitions:** They stipulate how we map math to the world. (e.g., "We *define* 'gravity' as the curvature of spacetime.") In this mode, they are conventions. You can't empirically refute a definition; you can only say it's not useful.
  *   **As Empirical Claims:** They are only adopted *because* they make the theory work. If the coordination fails (e.g., if light doesn't follow the geodesics), the principle is abandoned. In this mode, they are hypotheses.

  Reichenbach's insight was that these principles are **arbitrary but not capricious**. They are chosen by convention (stipulation) but judged by empirical success (discovery).

  ### 2. The Modern Evolution: The Constitutive A Priori
  The philosopher Michael Friedman revitalized this idea to describe how scientific frameworks stabilize. He calls these claims the **Constitutive A Priori**.
  *   **Constitutive:** They constitute the "space of reasons" for a specific scientific domain. You cannot test a hypothesis *within* general relativity without assuming the equivalence principle. It defines the rules of the game.
  *   **A Priori:** They are not derived from experience *within* the framework; they are the precondition for having that experience.
  *   **But:** Unlike Kant's immutable truths, they are **historically revisable**. When a framework collapses (e.g., Newtonian to Einsteinian physics), the constitutive principles change.

  **Why this fits your observation:**
  When the computer scientist says, "Uncomputable physics is impossible by definition," they are protecting the **Constitutive** role. They are saying, "If we allow this, the concept of 'computation' loses its coherence."
  When the same person says, "The brain is simulable," they are leveraging the **Empirical** role. They are saying, "Given that our framework holds, this prediction follows."

  The "shift" you see isn't a contradiction; it's the claim doing two different jobs: **grounding the language** vs. **describing the world**.

  ### 3. Application to Your Examples

  **Computability (Church-Turing Thesis):**
  *   *Defensive (Constitutive):* "Effective procedure" *just means* Turing-computable. To claim otherwise is to change the subject.
  *   *Offensive (Empirical):* Physics does not allow hypercomputation. This is a claim about the causal structure of the universe.
  *   *Verdict:* This is a legitimate Framework-Empirical Duality. It allows computer science to exist as a discipline while making bold claims about physics.

  **Evolutionary Biology ("Fitness"):**
  *   *Defensive:* "Fitness" is defined as reproductive success. (Tautology: those who survive are the fittest).
  *   *Offensive:* "Fitness" is a measurable trait (e.g., beak depth) that *predicts* success.
  *   *Verdict:* Legitimate when biologists move from the *definition* (survival) to the *propensity interpretation* (trait-based probability). It becomes illegitimate (the "Tautology Problem") if they refuse to specify independent measures of fitness, using survival as the only proof of fitness.

  **Physics (Equivalence Principle):**
  *   *Defensive:* Gravity *is* geometry. Inertial mass = Gravitational mass by stipulation of the theory.
  *   *Offensive:* All objects fall at the same rate regardless of composition. This is testable to high precision.
  *   *Verdict:* Legitimate. If a violation were found, we wouldn't say "gravity is different"; we would say "General Relativity is the wrong framework."

  ### 4. When is this move illegitimate?
  You asked for the boundary cases. Since this move is structurally necessary for science, it is not inherently fallacious. However, it becomes illegitimate (sliding into *ad hoc* dogmatism) under two conditions:

  1.  **Immunization Strategy:** If the claim is treated as a definition *only* when refuting counter-evidence, but the theory offers no new predictive power when treated as a discovery.
      *   *Example:* Freudian psychoanalysis. "Repression" explains why you remember a trauma (it surfaced) and why you don't (it's repressed). The "definition" of the mechanism shifts to ensure it can never be falsified, without generating novel predictions.
  2.  **Stagnation:** If the "definitional" shield is held in place long after the "empirical" fruitfulness has dried up.
      *   *Example:* Phlogiston. Initially, it was a useful constitutive principle for combustion. Eventually, holding onto the definition of phlogiston (a substance with negative weight, perhaps?) blocked the adoption of oxygen theory.

  **The Litmus Test:**
  A legitimate **Constitutive Claim** pays rent. It allows you to measure things you couldn't measure before, or unify phenomena that seemed distinct.
  *   *CTT:* Unifies logic, mechanics, and electronics. (Pays rent).
  *   *Equivalence Principle:* Unifies acceleration and gravity. (Pays rent).
  *   *Phlogiston:* Eventually just required constant redefinition to fit data. (Did not pay rent).

  ### 5. A Journalistic Label
  "Constitutive A Priori" is too dense for a general article. "Co-ordinating Principle" is too obscure.

  If you need a term for your writing, I suggest **"Framework Postulate"** or **"Constitutive Claim."**

  You can describe the move as **"The Dual Status of Framework Postulates."**
  *   *Explanation:* "These claims act as the rules of the game when challenged, but as moves within the game when applied. This isn't cheating; it's how the game board is built."

  ### Summary for your reporting
  You are observing the moment where **methodology hardens into ontology**.
  1.  Scientists propose a link between a math concept and a physical one.
  2.  To do work, they must treat it as true (Empirical).
  3.  To protect the coherence of their field, they must treat it as foundational (Definitional).
  4.  This is not a fallacy; it is the mechanism by which scientific paradigms stabilize.
  5.  It is only a fallacy if the claim stops generating new insights and serves only to deflect criticism.

  The computer scientists at your workshop weren't contradicting themselves; they were toggling between the **syntax** of their field (what counts as computation) and the **semantics** of their field (what the physical world actually does). The Church-Turing Thesis is the hinge between the two. When you push on the hinge, it feels like a wall (definition). When you walk through the door, it feels like a path (discovery).
