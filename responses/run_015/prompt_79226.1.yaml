prompt: |-
  Ok so I'm a third-year PhD student (philosophy, but my project is half cog sci) and I've been volun-told to lead next month's session of our interdisiplinary reading group. Audience is about a dozen people — grad students in linguistics and psych, one law prof, nobody has done any phil of language since undergrad. Topic I got handed: deflationary theories of truth. I don't need you to explain deflationism to me; I need a plan for how I explain it to them, in 60 minutes, whiteboard, no slides.

  What I want: the order the pieces have to go in and why — what has to be on the table before the next bit even makes sense to them, and what depends on what. Then the one example that carries the whole session. I've been kicking around building it on a thought experiment of my own: a community whose language is just like English except it has no word playing the role of "true" — they can assert things, agree, nod along, but there's no truth predicate anywhere. The question I'd put to the group is what, if anything, those speakers can't do that we can. My hunch is that's the right carrier because it forces the generalization/endorsement issue instead of letting "true" sit there looking like a property of sentences, but tell me if it's actually a bad carrier, or if it needs something bolted onto it, and if you think a different example should carry the session say which one and what it has that mine lacks.

  Misconceptions I'm expecting — tell me which are real, which I'm imagining, and at exactly what point in the sequence I should head each one off: that deflationism means anything goes / truth is relative; that it's just the correspondence theory with the metaphysics stripped out; that it means the word "true" is meaningless or purely rhetorical filler; and that since "true" is redundant in something like snow is white is true, it can be dropped everywhere. I also worry they'll leave thinking deflationism simply has no story about truth as a norm of assertion or belief, and I want that to land as a live problem rather than a refutation — so tell me where that worry should enter.

  Also give me one question I can put to them at the end that would actually show whether they got it rather than just nodded along, and tell me what I should openly skip at this level and say so out loud (I'm assuming Tarski-style formal machinery, conservativeness proofs, and the prosententialist stuff — confirm or correct me). And please don't send me readings, they wont do them.
