      *   *Addressing the "Line" Question:* Asking for a sharp line is a sorites fallacy. Identity is a matter of degree or continuity, not a binary switch. There is no "first chip" that kills you because the *process* remains unbroken.
      *   *Addressing "Slow Death":* It's not death if there's no break in psychological continuity. The "you" is the information flow, not the meat.
      *   *Tone:* Confident, academic but accessible, firm on the functionalist view.

