answer: |-
  Your defense is logically consistent but normatively brittle because it immunizes the theorem by stipulating away preferences over belief states, rendering the "defect" claim semantic rather than substantive.

  Regarding the doctor case, you are relabeling an assumption, but that is a valid move provided you acknowledge the theorem's narrowed scope. Good's Theorem requires the action space to be invariant to the signal; if knowledge triggers a professional constraint that removes options, the antecedent fails. This fits your category (i), but it implies the theorem is silent on many institutional decision problems, not just that the agents within them are defective. You cannot claim the theorem governs rationality generally if standard professional norms violate its structural assumptions.

  The concession on triviality is worse than it looks. If the theorem only applies to agents without belief-dependent preferences or endogenous constraints, it offers no guidance to real agents other than "change your preferences or constraints." It collapses into a consistency check for idealized agents, stripping it of normative force for actual decision-making. A normative theory that binds only those who already satisfy its ideal conditions cannot criticize those who do not; it merely describes them as outside the model.

  The empirical literature on information avoidance is your real problem, and you cannot write it off as irrational updating. Models of anticipatory utility demonstrate that avoiding information to manage anxiety is consistent with EU maximization if outcomes include mental states. Dismissing this as "not really preferences over outcomes" is an arbitrary restriction on welfarism, not a logical necessity of decision theory. If an agent maximizes expected utility over a state space that includes their own psychological welfare, avoiding a genetic test is rational, not a defect.

  Rank the defeaters as follows: (1) Preferences over belief states (Fatal to your normative claim), (2) Triviality of idealization (Awkward, limits scope), (3) Endogenous constraints (Manageable, fits category i). You should feel the first one most. It undermines your core assertion that information avoiders are irrational or defective; they are often just maximizing a utility function that values peace of mind over instrumental precision.
