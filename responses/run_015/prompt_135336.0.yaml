ly separate, explaining which branch node is ambiguous between them. The intended audience is philosophy graduate students who understand basic decision theory but have not encountered this specific framing; do not ask for bibliographies, reading lists, or citations, and do not invoke obscure named theories from the literature. The fountain-structure scenario is introduced within this prompt as a novel framing device rather than an established literature case.
