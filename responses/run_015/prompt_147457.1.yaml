  2.  **Deconstruct the Philosophical Issues:**

      *   *Multidimensionality vs. Sorites:* Standard Sorites (height) is 1D. "Scheming" is a cluster concept (concealment + instrumental reasoning + etc.).
      *   *Supervaluationism (SV) in Multidimensional Space:* SV says a sentence is true if true on *all* admissible precisifications. In 1D, this creates a "truth-value gap." In multidimensional space, the "admissible region" is a volume. If the extensions of the component predicates (concealment, etc.) are also vague, the space of precisifications becomes complex.
      *   *Epistemicism (Epi) in Multidimensional Space:* Epi says there is a sharp boundary, we just don't know it. In multidimensional space, this is a sharp hypersurface.
