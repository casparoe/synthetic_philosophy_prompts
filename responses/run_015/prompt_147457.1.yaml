      *   *Higher-Order Vagueness (HOV):* SV struggles with HOV (where is the boundary of the admissible precisifications?). Epi accepts HOV as ignorance about the boundary of the boundary. In the AI case, "admissibility" of a definition of scheming is itself vague.
      *   *Vagueness vs. Open Texture/Normativity:* Waismann's "open texture" suggests concepts *cannot* be fully precisified because future contexts are unpredictable. "Scheming" is likely normative (bad thing) and functional (does it pose a risk?). This suggests the extension isn't just "out there" waiting to be found (Epi) or precisified (SV), but *stipulated* based on goals.

