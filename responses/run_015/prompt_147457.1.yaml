          *   *Decision Theory:* Both views converge here. You must *stipulate* a precisification for the purpose of the policy. This is a "precisification by decree."
          *   *Reviewer Disagreement:* Under Epi, disagreement is noise/error. Under SV/Open Texture, disagreement is signal of the boundary region. Use inter-rater reliability not to find truth, but to map the "penumbra."
          *   *Error Asymmetry:* This is purely decision-theoretic. Minimize expected loss. If catastrophic risk, treat the penumbra as positive (precautionary principle). This is *not* derived from semantics, but from utility.
