  *(Refining the "Open Texture" argument)*: "Scheming" isn't just vague; it's theoretical. It refers to latent capabilities. This makes it more like "mass" in physics (theoretical term) than "bald" (observational). This shifts the debate from linguistics to measurement theory. I should mention this.

