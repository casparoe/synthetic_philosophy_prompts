answer: |-
  Your hypothesis is a robust diagnostic tool. The three-question split (Constitution, Coverage, Character) successfully untangles the knot of recurring objections, revealing that the impasse is not merely a failure of argumentation but a structural misalignment in what the opposing camps take themselves to be explaining.

  Here is the diagnosis of the structure, testing your hypothesis against the specific cases and scenarios you provided.

  ### 1. The Three-Question Split
  Your division is fair and accurately relocates the standard objections, though with one caveat: while the *questions* are separable for the purpose of analysis, the *theories* bind them together tightly.
  *   **Constitution:** HOT answers this with the higher-order relation; FOR answers with intrinsic first-order properties.
  *   **Coverage:** This is where blindsight and absent-minded driving live. HOT typically restricts coverage to states with HO representation (excluding blindsight); FOR expands it to include rich sensory states without HO access.
  *   **Character:** This is the hidden engine of the dispute.

  The caveat is that for HOT, Constitution *determines* Character. If an HO state makes a state conscious, the content of that HO state typically fixes what it is like. For FOR, the First-Order content fixes Character. Thus, while your split helps categorize the *objections*, the theories themselves do not treat Constitution and Character as independent variables. This dependency is why the regress worry (Constitution) feels like it should impact Character, and why mismatch cases (Character) feel like they refute Constitution.

  ### 2. The Content-Swap Case
  Your "content-swap subject" (FO green, HO red) pressures the **Character** question and reveals that the dispute over **Constitution** is often a proxy for a dispute over Character.
  *   **HOT Prediction:** The subject consciously experiences **red**. Since the HO representation constitutes the consciousness of the state, its content dictates the phenomenology. The subject is not "wrong" about their experience; the HO state *makes* it a red experience.
  *   **FOR Prediction:** The subject consciously experiences **green** (or is in an unconscious green state if HO is required for report). The HO state is a separate belief or perception *about* the state. If it misrepresents, the subject has a false belief about their experience, not a changed experience.

  This case reveals that the two sides are not merely disagreeing about the *mechanism* of consciousness (Constitution); they are disagreeing about the **authority of introspection**. HOT treats the introspective mechanism (HO) as constitutive of the phenomenon. FOR treats it as a fallible report on a phenomenon that exists independently. The impasse persists because HOT proponents see the FOR view as failing to explain why the state is *for* the subject (Constitution), while FOR proponents see the HOT view as distorting the phenomenology (Character).

  ### 3. The Neural Marker Scenario
  A neural marker correlated with reportability but diverging from subject denial would settle **Coverage** operationally, but it cannot settle **Constitution** or **Character** in principle.
  *   **Coverage:** If we define "conscious" as "having the marker," we have settled coverage by fiat. But if the subject denies the state, we face a choice: either the subject is unaware of their own consciousness (supporting HOT/Access views) or the marker tracks access/reporting mechanisms rather than consciousness itself (supporting FOR/Phenomenal views).
  *   **Constitution/Character:** The marker is theory-laden. To interpret the marker as a "consciousness marker" requires prior agreement on whether consciousness is essentially tied to reportability (Access) or subjective feel (Phenomenality). Since the dispute is precisely about that tie, the data cannot break the circle. The calibration of the marker relies on the very intuitions that are in dispute.

  ### 4. Diagnosis of the Impasse
  Is the dispute verbal? **No, but it is methodological.** It is not merely a disagreement about how to use the word "conscious," because Block's distinction (Access vs. Phenomenal) is rejected by HOT proponents not as a verbal confusion, but as a theoretical failure. HOT proponents argue that Access (via HO representation) *explains* Phenomenality. FOR proponents argue Phenomenality exists without Access.

  The impasse is driven by **disagreement about explanatory standards and data authority**.
  *   **HOT** prioritizes third-person criteria (report, cognitive availability) as the hard data for Constitution. They view the "what it is like" aspect as something that needs to be constructed out of representational relations.
  *   **FOR** prioritizes first-person criteria (phenomenal intuition) as the hard data for Character. They view the "what it is like" aspect as a primitive given that theories must preserve, not construct.

  The "hidden empirical question" is indeed the **reliability and constitutive nature of introspection**. If introspection is a separate mechanism (HOT), it can misfire (mismatch/targetless). If introspection is intrinsic (FOR), it is self-verifying. Neither side can prove their model of introspection without presupposing their model of consciousness.

  ### 5. Prospects for Progress
  Should we expect progress? **No, not within the current framework.**
  *   **Distinctions:** Block's distinction has already been offered and rejected as insufficient by HOT proponents who claim to explain phenomenality.
  *   **Formal Results:** Unlikely, as the disagreement is not logical but metaphysical/phenomenological.
  *   **Experiments:** As shown by the neural marker thought experiment, empirical data is interpreted through the lens of the theory.
  *   **Change of Question:** Progress requires dissolving the dichotomy. This might come from **Illusionism** (denying the Character question is coherent as posed) or **Predictive Processing** (reframing the FO/HO architecture as a unified hierarchy of prediction errors). Until the field agrees on whether the target of explanation is *reportable access* or *intrinsic feel*, the three questions will remain conflated, and the four exchanges will recur.

  Your hypothesis correctly identifies that the arguments are cross-purpose. The regress worry attacks Constitution; the mismatch case attacks Character; the blindsight debate attacks Coverage. Because each side prioritizes a different question from your triad as the "real" problem, they talk past each other.

  \answer{Different questions under one label}
