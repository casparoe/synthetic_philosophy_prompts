answer: |-
  Here is a complete design for the simulation, titled **"The Town of Ostra."** It is built to fit your 80-minute window, your room constraints, and your four specific phenomenological goals.

  ### 1. The Town of Ostra: Practices & Mechanics

  You will set up three distinct "zones" in the room (three clusters of chairs/tables). Each zone operates the same rules simultaneously. This prevents the "audience effect" of 18 people watching one performance; instead, you have 6 concurrent micro-interactions.

  **The Three Practices (The "Rules"):**

  1.  **The Queue (Arbitrary but Binding):**
      *   **The Rule:** Do not stand directly behind the person ahead of you. Stand at their **right shoulder**, roughly an arm's length away.
      *   **The Meaning:** Standing directly behind is "breathing on them" (aggressive). Standing at the shoulder is "waiting together" (cooperative).
      *   **The Goal:** Illustrates that the *content* is arbitrary (shoulder vs. behind), but the *bindingness* is real.

  2.  **The Payment (Moral vs. Custom):**
      *   **The Rule:** When handing over payment (a slip of paper), you must say the phrase **"For the hands."**
      *   **The Meaning:** Locals believe labor is sacred. Omitting the phrase implies the work is mechanical/worthless. It is not just politeness; locals are instructed to feel *hurt* by the omission.
      *   **The Goal:** Illustrates the gap between "we do this" and "this is right."

  3.  **The Greeting (Conforming as Offense):**
      *   **The Rule:** Locals greet each other with **"Ostra."** Visitors must greet with **"Hello."**
      *   **The Meaning:** If a Visitor says "Ostra," it is interpreted as mockery or espionage ("Why are you trying to be one of us?").
      *   **The Goal:** Illustrates that "When in Rome" can be an offense if done too perfectly by an outsider.

  4.  **The Door (The Ambiguity):**
      *   **The Rule:** (Secretly assigned) Half the Locals hold the "door" (chair back) open for the next person. Half let it close. There is no pattern.
      *   **The Goal:** Illustrates the anxiety of not knowing if a behavior is a norm or an individual quirk.

  **The Sanction Mechanism: "The Community Fund"**
  *   Each zone has a pile of 10 poker chips (or paper clips) in the center. This is the **Community Fund**.
  *   **Locals:** If a Visitor violates a norm, the Local *must* take one chip from the Fund and place it in a "Penalty Box."
  *   **Visitors:** They can see the Fund shrinking. They are told: "If the Fund hits zero, the Shop closes." (In practice, this means the interaction stops awkwardly).
  *   **Why this works:** It makes the cost of the visitor's ignorance visible and collective. It forces Locals to enforce norms not out of rudeness, but out of resource preservation.

  ---

  ### 2. Roles & Knowledge Sheets

  Print these on different colored paper. Do not let students share them.

  **ROLE: LOCAL (Green Sheet)**
  > **Welcome to Ostra.** You are a resident. You are polite, but you take your customs seriously.
  > **Your Goal:** Keep the Community Fund (chips) from emptying.
  > **The Rules:**
  > 1.  **Queue:** If someone stands directly behind you, shift your body away. If they don't move to your right shoulder, you must burn a chip.
  > 2.  **Payment:** If they pay without saying "For the hands," act visibly disappointed. Burn a chip. This is about dignity.
  > 3.  **Greeting:** If a visitor says "Ostra," look suspicious. Ask, "Where are you really from?" Burn a chip. They should say "Hello."
  > 4.  **The Door:** (Look at the sticker on your sheet: **HOLD** or **DROP**). Do this consistently. Do not explain why.
  > **Sanction:** Do not be rude. Just burn the chip and continue. If the Fund empties, stop talking and look at the floor.

  **ROLE: VISITOR (Blue Sheet)**
  > **Welcome to Ostra.** You are a traveler. You want to buy bread and leave.
  > **Your Goal:** Complete the transaction without emptying the Community Fund.
  > **Your Intel:**
  > 1.  People here value personal space.
  > 2.  They are proud of their work.
  > 3.  They are friendly but watchful.
  > 4.  **Warning:** Some behaviors might be specific to certain people. Watch closely.
  > **Task:** Try to figure out the rules by watching. You have 3 transactions to complete.

  ---

  ### 3. Timeline (80 Minutes)

  **00:00 – 00:05: Setup & Phone Collection**
  *   Arrange chairs into 3 clusters (6 students each).
  *   Collect phones (basket at the door).
  *   Divide class: 9 Locals (3 per zone), 9 Visitors (3 per zone).
  *   Hand out sheets. **Crucial:** Tell them: *"Read your sheet silently. Do not show it to anyone. Do not talk about the rules. If you have a question, raise your hand and I will come to you."*

  **00:05 – 00:10: Reading & Calibration**
  *   Walk around. Ensure Locals understand the "Chip Burn" mechanic. Ensure they know they are *not* allowed to be mean, only protective of the Fund.
  *   Ensure Visitors know they need to observe.

  **00:10 – 00:30: Round 1 (The Blunder)**
  *   Start the simulation.
  *   **Instructor Role:** Bystander. Carry a notebook. Write down *specific* moments (e.g., "Zone 2, Visitor said 'Ostra', Local flinched"). Do not intervene unless the simulation collapses.
  *   Let it run for 20 minutes. It will get awkward. Let it.

  **00:30 – 00:35: The Swap**
  *   Visitors stay seated. Locals stand and rotate to a new zone (so Visitors face new Locals).
  *   *Twist:* Hand the *new* Locals a slightly modified sheet.
      *   **Modification:** On the "Door" rule, flip the stickers (those who Held now Drop).
      *   *Why:* This ensures the Ambiguity remains ambiguous even for the second round.
  *   Reset the Chip Funds.

  **00:35 – 00:55: Round 2 (The Adjustment)**
  *   Run the simulation again.
  *   Visitors will try to apply what they learned. Some will over-correct (saying "Hello" too loudly, standing too far away).
  *   Locals will enforce the "Moral" rule (For the hands) more strictly this time.

  **00:55 – 01:20: The Debrief**
  *   Bring everyone into one large circle.
  *   **Phase 1: Phenomenology (10 mins).** Ask only about feelings.
      *   "Visitors: At what moment did you feel most anxious?"
      *   "Locals: Did burning a chip feel like a game, or did it feel like a breach?"
      *   "Who tried to say 'Ostra' to be polite? What happened?"
  *   **Phase 2: Mapping (10 mins).** Introduce the concepts now.
      *   Write the 4 Learning Goals on the board.
      *   Ask students to map specific moments from the sim to these goals.
      *   *You* introduce the forbidden words: "Convention," "Coordination," "When in Rome."
  *   **Phase 3: The Gap (5 mins).**
      *   Ask: "Was 'For the hands' a moral rule or a custom?"
      *   Let them fight this out. Conclude by pointing out that *to the Local, there was no difference.*

  ---

  ### 4. Debrief Mapping Guide

  Use this to steer the conversation if they get stuck on "It depends on the culture."

  | Learning Goal | Prompt Question | What to Listen For | Concept to Introduce |
  | :--- | :--- | :--- | :--- |
  | **1. Arbitrary but Binding** | "Why did standing behind someone cause tension? Physically, did it hurt anyone?" | "It felt wrong." "It felt aggressive." | **Constitutive Rules:** The act *counts as* aggression only because we agree it does. No neutral option. |
  | **2. Same Act, Different Meaning** | "Did a Local and a Visitor stand in the same spot? Did it mean the same thing?" | "When I did it, it was rude. When they did it, it was normal." | **Agent-Relative Meaning:** Identity changes the action. A joke from an insider is an insult from an outsider. |
  | **3. Conforming as Offense** | "Who tried to say 'Ostra'? Why did that backfire?" | "They thought I was mocking them." "I was trying to be nice." | **Authenticity Conditions:** Blind conformity can signal mockery or espionage. |
  | **4. Cost Asymmetry** | "Locals, what happened to your Chip Fund? Visitors, did you care?" | "We ran out." "I didn't notice until it was empty." | **Maintenance Costs:** Locals bear the cost of enforcement; Visitors bear the cost of ignorance. |

  ---

  ### 5. Predictable Failures (And Fixes)

  **1. The "Giggle" Collapse**
  *   **Problem:** Students break character and laugh when a norm is violated.
  *   **Fix:** In the prep, say: *"This is a high-stakes simulation. If you break character, your Shop closes."* If they laugh, stop the sim for 30 seconds, stare silently, then resume. The awkwardness kills the giggle.

  **2. The "Sympathetic Local"**
  *   **Problem:** Locals feel bad for Visitors and don't burn chips.
  *   **Fix:** Remind Locals during Round 1: *"Your job is to protect the Fund, not the Visitor's feelings. If you don't burn the chip, you are failing your role."*

  **3. The "Gaming the System"**
  *   **Problem:** Visitors collude to figure out the rules and share them.
  *   **Fix:** This is actually good data for the debrief ("How did you coordinate?"). If they shout answers across the room, intervene: *"Information does not travel that fast in Ostra."*

  **4. The "Moral" Rule Feels Fake**
  *   **Problem:** Students say "For the hands" is obviously just a custom, not moral.
  *   **Fix:** In the debrief, ask the Locals: *"When they didn't say it, did you feel annoyed, or did you feel disrespected?"* Push on the *internal reaction*, not the external logic.

  ---

  ### 6. Limitations: What This Simulation Cannot Reach

  Be honest with them in the final 5 minutes. A simulation like this has blind spots you must fill with lecture.

  1.  **Historical Weight:** In Ostra, the rules are 20 minutes old. In real life, conventions have history, power dynamics, and trauma attached (e.g., segregation norms). The simulation makes conventions feel lightweight; you must explain that real conventions often carry the weight of historical oppression or solidarity.
  2.  **Internal Guilt vs. External Sanction:** In the sim, students follow rules to avoid burning a chip (external). In real life, we often follow conventions because we feel *guilty* if we don't (internal). The sim can't simulate the conscience, only the social pressure.
  3.  **The Exit Cost:** In the sim, Visitors can't actually "leave." In real life, the visitor's ultimate power is exit. The simulation traps them, which overstates the visitor's obligation. You need to articulate that the *ability to leave* is what often defines the limit of a visitor's obligation.
  4.  **The "Right" Answer:** The sim shows that rules exist, but it doesn't tell us *which* rules are just. You will need to bridge from "This is how conventions work" to "How do we judge if a convention is unjust?" (That is the next week's work).

  **Instructor Script for the End:**
  *"Today you felt the pressure of the convention. But Ostra is a clean room. Real conventions are messy. They protect us, but they can also exclude us. Next week, we ask: When does the obligation to follow the rule end, and the obligation to break it begin?"*
