          *   *Volunteers/Knowledge:* This is where the summary fails most. Walzer allows for culpability here.
          *   *Moral Status:* "Never worse off" is too strong.
          *   *Conclusion:* Does not follow. Soldiers *can* be culpable.
      *   **The Boundary Question:** Explicitly address where the separation ends. It ends at "manifest injustice" and *in bello* violations.
