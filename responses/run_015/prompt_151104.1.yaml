      *   The disanalogies suggest the evolutionary model explains the *genesis* and *persistence* of norms where rationality is bounded, while Lewis explains the *maintenance* of salient conventions among fully informed agents.
      *   It's not just temporal scale; it's cognitive architecture. But often, evolutionary models are used to explain how we got to the Lewisian starting point.

  5.  **Task 4: Compatibility and "Smuggling" Non-Rational Mechanisms:**

      *   Lewis excludes non-rational mechanisms (blind habit, coercion without reason) as the *basis* of convention. Convention *is* a rational solution.
      *   Evolutionary accounts often rely on reinforcement learning or mimicry, which are sub-rational or arational.
      *   *Compatibility:* They can be compatible if viewed as different levels of analysis. Lewis = Synchronic (how it works now). Evolution = Diachronic (how it got here).
      *   *Conflict:* If the evolutionary account claims rationality is an illusion (we *think* we chose, but selection drove us), then they are incompatible.
      *   Does evolution smuggle in non-rational mechanisms? Yes, if it claims the *stability* comes from blind retention rather than continued rational endorsement. But Lewis allows for "precedent," which acts like a genetic memory.

  6.  **Task 5: Final Conclusion (Do norms survive as rational solutions?):**

      *   If the mapping fails on intentionality and common knowledge, the strict Lewisian view is too idealized for many real-world norms.
