answer: |-
  ### The Correspondence Table: Mapping Evolution to Lewis

  To evaluate the evolutionary critique of David Lewis's *Convention* (1969), we must first translate the biological lexicon into the language of game-theoretic rationality. Lewis defines a convention as a regularity in behavior sustained by a system of preferences and expectations, specifically where agents prefer to conform if others conform.

  | Evolutionary Concept | Lewisian Equivalent | Function in the System |
  | :--- | :--- | :--- |
  | **Genome** | **The Strategy Profile (Equilibrium)** | The specific behavioral rule (e.g., "drive on the right") encoded in the agents' dispositions. |
  | **Mutation** | **Deviation / Innovation** | A "trembling hand" error or a deliberate experiment where an agent tries a non-conforming strategy. |
  | **Selective Pressure** | **Payoff Discrepancy (Coordination Failure)** | The loss of utility incurred when an agent fails to coordinate (e.g., crashing because you drove on the left). |
  | **Fitness Landscape** | **Preference Ordering over Outcomes** | The matrix of payoffs defining which equilibria are stable, Pareto-superior, or risk-dominant. |
  | **Replication/Inheritance** | **Expectation Formation** | The transmission of the rule via precedent: "I expect you to do $X$ because you did $X$ before." |
  | **Population** | **The Community of Agents** | The set of players interacting repeatedly within the coordination game. |

  ---

  ### Points of Collapse: Where the Analogy Fails

  While the mapping above allows for a structural comparison, the analogy collapses when we examine the *mechanisms* of transmission and stability. Three specific fault lines emerge:

  **1. Intentional Choice vs. Blind Retention**
  *   **Lewis:** Agents are hyper-rational. They conform because they *prefer* to coordinate and *believe* others will too. The stability of the norm is anchored in the agent's conscious (or tacit) reasoning about utility.
  *   **Evolution:** Selection is blind. A norm persists not because agents understand its utility, but because those who didn't follow it were eliminated (or punished).
  *   **Collapse:** Lewis requires the agent to hold the norm *for a reason* (coordination). Evolution allows the agent to hold the norm out of habit, mimicry, or fear, without understanding the coordination problem.

  **2. Common Knowledge vs. Behavioral Regularity**
  *   **Lewis:** The linchpin of Lewisian convention is **common knowledge**. I know that you know that I know we are both trying to coordinate. This recursive knowledge structure is what distinguishes a convention from a mere habit.
  *   **Evolution:** Evolutionary models (e.g., H. Peyton Young's stochastic stability) require only that agents observe past behavior. No recursive knowledge is needed; agents need not know *why* others are conforming, only *that* they are.
  *   **Collapse:** If common knowledge is absent, Lewis's definition is not met. An evolutionary stable strategy (ESS) can exist in a population of agents who have no concept of the "game" they are playing.

  **3. Rate of Change: Punctuated Equilibrium vs. Instantaneous Switching**
  *   **Lewis:** Conventions can switch almost instantaneously via a "focal point." If a salient new signal appears (e.g., a public announcement), the entire population can shift equilibria in one round.
  *   **Evolution:** Change is gradual, relying on the drift of the population distribution. Even with "punctuated equilibrium," the mechanism is slower than rational consensus.
  *   **Collapse:** The evolutionary model cannot easily account for the rapid, consensus-driven shifts in convention that Lewisian rationality predicts (e.g., switching computer keyboard standards by decree or agreement).

  ---

  ### Do Disanalogies Undermine the Critique or Shift the Scale?

  The existence of these disanalogies forces a choice: does the evolutionary critique refute Lewis, or does it merely describe a different temporal phase of normativity?

  If we view the disanalogies as fatal, the evolutionary critique **undermines** the Lewisian account by suggesting that "common knowledge" is a philosophical fiction. Most real-world norms (etiquette, moral taboos) operate without agents recursively verifying each other's mental states. They operate on the evolutionary logic of reinforcement.

  However, a more charitable reading suggests a **temporal and cognitive division of labor**.
  *   **Evolutionary accounts** explain the *diachronic origin* and *deep stability* of norms (how we got here and why they persist despite individual ignorance).
  *   **Lewisian accounts** explain the *synchronic maintenance* of salient conventions among sophisticated agents (how we coordinate *now* given that the norm exists).

  The disanalogies do not necessarily invalidate Lewis; they restrict his domain. Lewis describes the *logic* of convention; evolution describes the *dynamics* of convention. The critique holds only if Lewis claims his model explains the *genesis* of all norms. If he claims only to define the *structure* of conventional reasoning, the evolutionary model is a complement, not a refutation.

  ---

  ### Compatibility and the "Smuggling" of Non-Rational Mechanisms

  Does the evolutionary picture smuggle in a non-rational mechanism that Lewis's view excludes?

  **Yes, but productively.**
  Lewis explicitly excludes norms sustained purely by coercion, blind habit, or ignorance. For Lewis, if you follow a rule only because you are punished for breaking it (without understanding the coordination benefit), it is not a convention; it is a social imposition. Evolutionary models, however, treat punishment and habit as primary drivers of stability.

  *   **Incompatibility:** If the evolutionary claim is that *all* norm-following is sub-rational mimicry, then Lewis is wrong. Agents are not solving coordination problems; they are following genetic or cultural scripts.
  *   **Compatibility:** If the evolutionary claim is that rational agents *emerge* from a selection process, the two are compatible. We can view Lewisian rationality as a high-cost cognitive tool that evolved because it solves coordination problems faster than blind trial-and-error.

  The "smuggling" occurs when evolutionary theorists argue that because a norm *could* have evolved blindly, the agent's *current* rationalization is post-hoc rationalization. Lewis would argue that so long as the agent *currently* prefers to conform conditional on others conforming, the norm is a convention, regardless of its history.

  ---

  ### Conclusion: Do Norms Survive as Rational Solutions?

  Once the mapping failures are fully exposed, the conclusion that **"norms are not rational solutions"** does not survive in its strong form, but it does survive in a weakened, sociological form.

  1.  **Functional Rationality Survives:** Norms remain "rational solutions" in the sense that they solve coordination problems and maximize group utility (fitness). The evolutionary account confirms that norms are functional adaptations.
  2.  **Procedural Rationality Fails:** Norms are not always "rational solutions" in the Lewisian sense of being the product of conscious, common-knowledge reasoning by the agents involved.

  Therefore, the evolutionary critique successfully demonstrates that **Lewisian rationality is sufficient but not necessary for the existence of norms.** We can have stable conventions without common knowledge and without intentional design. The final verdict is that norms are **systemically rational** (they serve a purpose) but often **individually arational** (followed without full comprehension). Lewis's framework remains the ideal limit of what a convention *could* be, while the evolutionary framework describes what conventions mostly *are*.
