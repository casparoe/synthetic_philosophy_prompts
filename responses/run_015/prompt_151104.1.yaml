      *   *Evolutionary Concept:* Mutation. *Lewis Equivalent:* Deviation/Innovation. Someone tries a new strategy (trembling hand or deliberate experiment).
      *   *Evolutionary Concept:* Selective Pressure. *Lewis Equivalent:* Payoff structure/Coordination failure. If you don't conform, you lose utility (coordination fails).
      *   *Evolutionary Concept:* Fitness Landscape. *Lewis Equivalent:* The matrix of preferences over outcomes. Some equilibria are better (Pareto superior) or just stable.
      *   *Evolutionary Concept:* Replication/Inheritance. *Lewis Equivalent:* Expectation formation. "I do it because I expect you to do it."

  3.  **Task 2: Points of Collapse (Disanalogies):**

      *   *Intentionality:* Evolution is blind; Lewisian agents are hyper-rational. Lewis agents *choose* the equilibrium because they see the benefit. Evolution selects *for* the benefit without the agent needing to understand why.
      *   *Common Knowledge:* Lewis requires a recursive structure of knowledge ("I know that you know..."). Evolution requires only behavioral regularity and reinforcement. You don't need to *know* the norm exists to follow it in an evolutionary model (e.g., driving on the right because you got punished for driving on the left).
      *   *Rate of Change:* Biological evolution is slow. Lewisian convention switching can be instantaneous (focal points). If we all agree to meet at 5 PM instead of 6 PM, it happens now, not over generations.

