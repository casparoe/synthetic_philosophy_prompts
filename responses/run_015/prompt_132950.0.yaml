answer: |-
  # Seminar Plan: The Structural Problem of Old Evidence
  **Duration:** 90 Minutes
  **Audience:** Philosophy Graduate Students (Logic Training, No Epistemology)
  **Goal:** Demonstrate that the "Problem of Old Evidence" is a structural tension within Bayesian conditionalization, not a historical artifact.

  ---

  ## I. Teaching Arc & Dependency Order

  ### 1. The Intuitive Anchor (0–20 mins)
  **Why Predictive Success Precedes Bayes's Theorem:**
  If you begin with the formalism, students will treat $P(E)=1$ as a trivial boundary condition of the math, easily dismissed as a modeling choice. To make the problem bite, they must first accept a normative claim: *that successfully accommodating data (even known data) is an epistemic virtue that ought to increase credence.*
  *   **Action:** Elicit a consensus that "explaining" a known fact is rational grounds for belief, distinct from "predicting" a new one.
  *   **Dependency:** This intuition serves as the "control" against which the formal result will be tested. If the math contradicts the intuition, the math (or its application) is the problem.

  ### 2. The Formalization (20–40 mins)
  **Version of Bayes's Theorem:**
  Use the **Ratio Form**, not the Standard or Log-Odds form.
  $$ \frac{P(H|E)}{P(H)} = \frac{P(E|H)}{P(E)} $$
  *   **Why Ratio?** The Log-Odds form ($\text{logit}(H|E) = \text{logit}(H) + \text{Weight of Evidence}$) obscures the denominator $P(E)$ inside a subtraction term. The Ratio Form isolates the **Bayes Factor** ($\frac{P(E|H)}{P(E)}$). It makes the collapse immediate: if $P(E)=1$ and $H \models E$ (so $P(E|H)=1$), the ratio is $1/1 = 1$.
  *   **Dependency:** Students must grasp that conditionalization is multiplicative. If the multiplier is 1, the prior remains unchanged.

  ### 3. The Carrying Scenario: "The Archived Reading" (40–65 mins)
  **Scenario Design:**
  Avoid historical anecdotes (Mercury/GR). Use a structural analog that separates *data existence* from *theoretical derivation*.
  *   **Setup:** A sensor $S$ records a value $v$ at time $t_1$. This value is stored in a public, immutable archive.
  *   **Epistemic State:** At $t_2$, the Agent knows the archive exists and contains a specific value $v$. Thus, for the Agent, $P(E) = 1$, where $E$ = "The archive contains $v$."
  *   **Theory Construction:** At $t_3$, the Agent formulates Hypothesis $H$ regarding the internal physics of $S$. Crucially, $H$ is derived from first principles of the sensor's design, *not* by parameterizing to fit $v$.
  *   **Entailment:** $H$ logically entails that $S$ must output $v$.
  *   **The Conflict:** The Agent checks the archive (confirming $E$). Intuitively, $H$ is supported. Formally, since $E$ was already known ($P(E)=1$), $P(H|E) = P(H)$.

  ### 4. Misconception Interception Sequence (65–80 mins)
  Students will attempt to resolve the tension by modifying the inputs. You must intercept these in order.

  *   **Misconception 1: "Old evidence is just weak evidence."**
      *   *Student Thought:* "Maybe we just treat $P(E)$ as $0.99$ instead of $1$."
      *   *Interception Point:* Immediately after the Ratio Form derivation.
      *   *Correction:* Remind them of the logic training. If $E$ is known to be true, $P(E)=1$ is not an approximation; it is a requirement of coherence. Treating known truths as uncertain breaks the probability axioms (Logical Omniscience idealization).
  *   **Misconception 2: "The fix is to lower the prior for theories that post-date the data."**
      *   *Student Thought:* "We can penalize $P(H)$ if $H$ was thought of after $E$."
      *   *Interception Point:* During the "Archived Reading" discussion.
      *   *Correction:* This conflates *psychological discovery time* with *logical support*. If $H$ is true, it is true regardless of when it was conceived. Bayesianism models rational support, not sociology of science.
  *   **Misconception 3: "This only arises in scientific contexts, not individual belief."**
      *   *Student Thought:* "Scientists have complex data; individuals just update on new sensations."
      *   *Interception Point:* Before moving to solutions.
      *   *Correction:* Re-apply the "Archived Reading" to a personal belief (e.g., "I know my bank balance is $X$. I form a theory about my spending habits that entails balance $X$."). The structural problem persists for any agent modeling their beliefs probabilistically.

  ### 5. Structural Tension & Final Check (80–90 mins)
  **The Core Tension:**
  Standard Conditionalization assumes the set of possibilities is fixed. Learning old evidence is actually learning a *logical connection* between $H$ and $E$, not learning $E$ itself. Standard Bayes has no operator for "learning that $H$ entails $E$."

  **Omitted Apparatus (Explicitly State This):**
  *   **Log-Odds Form:** Omitted because it hides the $P(E)$ denominator.
  *   **Jeffrey Conditionalization:** Omitted because it addresses uncertain evidence, not certain old evidence.
  *   **Measure-Theoretic Probability:** Omitted; we assume a discrete or standard continuous space where $P(E)=1$ is well-defined.
  *   **Specific Solutions (e.g., Garber, Ur-Priors):** Omitted. The goal is to understand the *problem*, not survey the literature on fixes.

  ---

  ## II. The Final Check (Task)

  **Do not ask:** "What is the problem of old evidence?" (Tests recall).
  **Do not ask:** "How does Einstein fit this?" (Tests historical application).

  **The Task: "The Near-Certainty Probe"**
  Present the following modification to the "Archived Reading" scenario:

  > "Suppose the Agent is *almost* certain the archive contains $v$, but assigns $P(E) = 1 - \epsilon$ (due to a tiny fear of archival corruption). The Agent formulates $H$, which entails $E$.
  >
  > 1. Calculate the Bayes Factor in this near-certainty case.
  > 2. Explain why taking the limit as $\epsilon \to 0$ does **not** recover the intuitive confirmation we expect from the Old Evidence case."

  **Why this reveals understanding:**
  *   **Correct Answer:** In the near-certainty case, the Bayes Factor is $\frac{1}{1-\epsilon} \approx 1 + \epsilon$. As $\epsilon \to 0$, the Factor $\to 1$.
  *   **The Insight:** The student must recognize the **discontinuity**. Even if $P(E)$ is $0.999999$, confirmation is possible (though small). But at exactly $1.0$, confirmation drops to *zero*.
  *   **Success Criterion:** If the student recognizes that the problem is not about the *magnitude* of $P(E)$ but the *structural role* of certainty in conditionalization (i.e., that standard conditionalization cannot model the learning of logical entailments), they have grasped the structural tension. If they argue "well, just keep $\epsilon$ small," they have missed the point that logical knowledge *should* be certain.

  ---

  ## III. Instructor Notes on Flow

  1.  **Board Work:** Keep the Ratio Form on the board from minute 20 onward. Circle the denominator $P(E)$ whenever a student tries to argue about "surprise."
  2.  **Managing Logic Training:** These students will try to solve this by distinguishing object-language from meta-language. Acknowledge this is the right direction (learning $H \models E$ is meta-linguistic), but emphasize that *standard* Bayesian conditionalization operates within a single probability space where $E$ is just another proposition.
  3.  **Time Management:** If the "Archived Reading" scenario drags, cut the "Misconception 3" discussion. The scientific vs. individual distinction is less critical than the logical vs. probabilistic distinction. Do not cut the Final Check.
