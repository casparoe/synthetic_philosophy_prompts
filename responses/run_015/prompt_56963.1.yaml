prompt: |-
  I'm the QA lead at a small company that sells a packaged-food allergen database. About 12,000 rows a quarter, each row saying whether a specific product contains or may contain one of the major allergens. School districts and two hospital systems run their menus off it. I get six hours of senior reviewer time per release, two junior contractors who are fast but have no stats background at all, and a compliance guy who signs the release note and only trusts things that are written as numbers.

  Here's the problem I can't get out of. Every single row we ship, I could defend on its own. Most are way above any threshold you'd want — call it 99.5% that the row is right, from the supplier spec sheet plus our scrape plus how often that particular source has burned us before. Our written rule right now is basically "if every row clears 99%, ship it." But I also know, with total confidence, that a 12,000-row release contains errors, probably dozens. Last year one bad sesame row ended up on a kid's tray. So me, same person, same afternoon, believe each row is correct and believe the release is wrong somewhere. Somebody once told me there's names for this, something about a lottery and something about a book preface, but I never read it and I don't want a lecture about it.

  What I want is a procedure. Something my juniors can run per row in a couple of minutes and that I can hand to compliance without him panicking. It needs to do these things:

  1. Sort rows into classes by what kind of evidence is behind them — I suspect "we have a base rate for this source and nothing specific about this item" is a different animal from "we looked at this label," and that they shouldn't get treated with the same threshold. Tell me if I'm wrong about that.
  2. Say, per class, when a junior is allowed to mark a row accepted, when they have to kick it up, and when the honest move is to not ship the row at all.
  3. Tell me where the six hours go. Right now we spend them wherever something looked weird, which I think is mostly luck.
  4. Tell me what the release note can honestly claim about the set as a whole, given that we already know it has errors in it. The current wording implies otherwise and I'm tired of it.
  5. Mark every place where the procedure is really just a judgment call wearing a number as a costume. I'd rather know which steps are fake-precise.

  And test this hunch, because it's the one thing I actually think I've figured out and nobody here agrees with me: whether this is a problem at all depends on where the cost lands. If a bad row costs us a refund and an apology, per-row thresholds are fine and I should stop losing sleep. But if the cost lands on the collection — the whole release gets pulled, a customer's automated menu system chokes, a parent stops trusting any of it, two wrong rows compound into one bad meal — then per-row thresholds are the wrong instrument entirely and no amount of individual 99.5% adds up to anything. Is that a real distinction or am I just making it up to feel better?

  Then run it on three things we actually have:

  - 3,100 rows auto-imported from a distributor feed. We've measured that feed at about a 0.3% historical error rate. Nothing about those individual rows has ever been looked at by a human.
  - A new ingredient-list parser that's genuinely excellent except it quietly mangles rows where the label uses a French or Spanish term. The errors are clustered, not spread out, and we can't tell you which rows are affected — only roughly how many.
  - Our flagship "verified" tier: 400 rows, each hand-checked twice by a senior person. Sales advertises it as defect-free. This one's my baby and I know you're going to say something about it I don't want to hear. Don't soften it, just tell me, and tell me what to do about the contract language if the answer is that we can't promise that either.

  Finish with a short list of what the procedure can't settle — where it bottoms out and a human has to just decide and own it. Flowchart-in-words and numbered steps, please, no bibliography, I'm never going to read one.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** QA Lead at a small company selling a packaged-food allergen database.
      *   **Stakes:** High. School districts and hospital systems use this data. One error last year put sesame on a kid's tray (potential anaphylaxis).
      *   **Resources:** 6 hours of senior reviewer time per release, 2 junior contractors (fast, no stats background), 1 compliance guy (trusts numbers only).
      *   **Volume:** ~12,000 rows/quarter.
      *   **Current State:** Per-row confidence is high (99%+), but systemic confidence is low (knows there are errors). Current rule: "If every row clears 99%, ship it."
      *   **The Paradox:** The user recognizes the "Preface Paradox" (believing each statement is true but believing the conjunction is false) without naming it as a philosophical lecture. They want a *procedure*, not a theory.
      *   **Specific Requests:**
          1.  Sort rows by evidence class.
          2.  Define acceptance/rejection/escalation thresholds per class.
          3.  Allocate the 6 hours of senior time.
          4.  Draft honest release note language.
          5.  Identify "fake precision" (judgment calls wearing numbers).
          6.  Validate the "Cost Structure" hunch (individual cost vs. systemic cost).
          7.  Apply to three specific scenarios (Distributor feed, Parser with language issues, "Verified" tier).
          8.  List what the procedure *can't* settle (human ownership).
          9.  Format: Flowchart-in-words, numbered steps, no bibliography.

  2.  **Deconstruct the Core Problem:**
      *   **The Statistical Reality:** If you have 12,000 independent events with 99.5% accuracy, the probability of *zero* errors is $0.995^{12000} \approx 0$. The user is mathematically correct: the release *will* contain errors.
      *   **The Risk Model:** The user's hunch about cost structure is critical. In allergen data, errors are not independent in impact. One error can destroy trust in the whole database (systemic risk). Therefore, per-row thresholds are indeed insufficient. We need *batch-level* risk management.
      *   **The Constraint:** 6 hours of senior time is ~360 minutes. For 12,000 rows, that's 0.03 minutes (2 seconds) per row. Senior time cannot be used for verification; it must be used for *sampling* and *exception handling*.

  3.  **Address the "Cost Structure" Hunch:**
      *   *Is it real?* Yes. In safety-critical systems (allergens, medical, aviation), the cost function is non-linear. A single failure can invalidate the entire safety case.
      *   *Implication:* You cannot optimize for "average accuracy." You must optimize for "worst-case containment."
      *   *Verdict:* The user is right. Per-row thresholds mask systemic risk.

  4.  **Develop the Procedure (The "How-To"):**

      *   **Step 1: Classification (Evidence Classes).**
          *   The user is right to distinguish sources.
          *   Class A: High Trust (Human Verified).
          *   Class B: Medium Trust (Parser/Distributor with history).
          *   Class C: Low Trust (New source, unverified parser).
          *   *Fake Precision Alert:* Assigning exact probabilities (99.5%) is fake. Use bands (High/Med/Low).

      *   **Step 2: Decision Rules (Junior Actions).**
          *   Juniors can't do stats. They need binary flags.
          *   Rule: If Evidence = X AND Flag = Y -> Accept/Reject/Escalate.
          *   Crucial change: Introduce "Quarantine." Don't ship low-confidence rows.

      *   **Step 3: Senior Time Allocation (The 6 Hours).**
          *   Current: "Wherever something looked weird." (Inefficient).
          *   New: Statistical Sampling + Cluster Investigation.
          *   Focus on the "Parser with French/Spanish" issue. That's a systemic cluster risk.
          *   Focus on the "Verified" tier claims.

      *   **Step 4: Release Note Language.**
          *   Compliance wants numbers. Honesty requires uncertainty.
          *   Solution: Report on *process* and *coverage*, not *perfection*. Use "Defect Density" estimates based on sampling, not "Zero Defect" claims.

      *   **Step 5: Fake Precision.**
          *   Explicitly call out where numbers are guesses.

  5.  **Apply to the Three Scenarios:**

      *   **Scenario 1: 3,100 Distributor Rows (0.3% error rate).**
          *   *Risk:* Random errors.
          *   *Action:* Accept but tag as "Unverified Source." Sample 5% for senior review to confirm rate holds.
      *   **Scenario 2: Parser (French/Spanish mangling).**
          *   *Risk:* Clustered systemic error. This is the biggest danger.
          *   *Action:* **Do not ship** rows identified as potentially foreign language until filtered. If you can't filter, you must exclude the batch or apply a massive warning flag. Senior time goes here first.
      *   **Scenario 3: "Verified" Tier (400 rows, hand-checked).**
          *   *Risk:* Reputation/Contractual. "Defect-free" is a lie.
          *   *Action:* Change contract language to "Verified Process" not "Verified Result." Senior time spends 2 hours re-auditing 10% of this specific batch.

  6.  **Drafting the Content (Iterative refinement):**

      *   *Tone:* Direct, professional, empathetic to the pressure, no fluff.
      *   *Structure:* Follow the user's 5 points + Hunch + 3 Scenarios + Limitations.
      *   *Key Insight:* The "Preface Paradox" is real, but the solution isn't philosophical; it's *risk segmentation*. You separate the rows that *can* be wrong from the rows that *must not* be wrong.
      *   *Compliance:* Give him the numbers he wants, but ensure they represent "Confidence Intervals" or "Error Rates" rather than "Perfection."

  7.  **Refining the "Cost Hunch":**
      *   Make sure to validate this strongly. It's the linchpin. If the cost is linear (refund per row), 99% is fine. If the cost is exponential (lawsuit/trust loss), 99% is dangerous. Allergen data is the latter.

  8.  **Refining the Senior Time:**
      *   6 hours = 360 minutes.
      *   Scenario 2 (Parser) needs the most attention.
      *   Scenario 3 (Verified) needs legal protection.
      *   Scenario 1 (Distributor) needs spot checks.
      *   Allocation: 2 hrs Parser, 2 hrs Verified, 2 hrs Distributor/General.

  9.  **Refining Release Notes:**
      *   Instead of "0 errors," use "Validated against X standard with Y confidence."
      *   Compliance likes numbers: "Estimated Error Rate < 0.5% based on sampling."

  10. **Final Review against Constraints:**
      *   No bibliography? Check.
      *   Flowchart-in-words? Check.
      *   Address fake precision? Check.
      *   Address the 3 scenarios specifically? Check.

  11. **Self-Correction during drafting:**
      *   *Initial thought:* Tell them to fix the parser.
      *   *Correction:* I'm QA, not Engineering. I can't fix it now. I have to manage the risk of the output *as is*. The procedure must be "Quarantine suspected foreign language rows."
      *   *Initial thought:* Tell compliance the truth.
      *   *Correction:* Compliance trusts numbers. Give him *statistical* numbers (error rates), not *absolute* numbers (zero errors). It satisfies his need for digits without lying.

  12. **Final Polish:** Ensure the distinction between "Per-Row Confidence" and "Batch Risk" is clear. This is the core intellectual shift the user needs to justify to their team.

  *(Self-Correction on the "Preface Paradox" mention)*: The user said "I don't want a lecture about it." I will acknowledge they are right about the phenomenon but skip the philosophy name-dropping and focus on the operational fix.

  *(Self-Correction on "Verified" Tier)*: The user said "I know you're going to say something about it I don't want to hear." I need to be blunt. "Defect-free" is legally and statistically impossible. I must tell them to change the marketing/contract language.

  Let's assemble the response.cw
answer: |-
  ### Part 1: The Cost Structure Hunch
  **You are right.** This is not a philosophical problem; it is an actuarial one.

  If the cost is linear (one error = one refund), your current 99% per-row threshold is acceptable math. But allergen data has **non-linear, systemic risk**. One error does not cost one refund; it costs the trust of the entire school district, potential litigation, and the validity of the whole dataset. When the cost of failure is concentrated on the *collection* (the release), optimizing for the *individual* (the row) is dangerous.

  A 99.5% confidence per row across 12,000 rows mathematically guarantees errors ($0.995^{12000} \approx 0$). If your business model relies on the dataset being "safe," you cannot ship based on per-row probability alone. You must ship based on **risk containment**.

  ### Part 2: The Procedure
  This procedure shifts focus from "Is this row right?" to "Is this row safe to ship given what we know about the batch?"

  #### Step 1: Classification (The Evidence Buckets)
  You are correct: not all rows are the same. Do not use percentages (fake precision). Use **Tiers**.

  *   **Tier 1 (Verified):** Human-reviewed, source document on file, senior sign-off. (Your 400 rows).
  *   **Tier 2 (Structured Source):** Auto-import from known distributor feeds with historical error tracking. (Your 3,100 rows).
  *   **Tier 3 (Unstructured/Parser):** Scraped labels, parsed ingredient lists, new sources. (The remainder).
  *   **Tier 4 (Quarantine):** Rows flagged by system logic as "High Ambiguity" (e.g., parser detected foreign language, missing field, conflicting source).

  **Fake Precision Alert:** Assigning a specific % (like 99.5%) to these tiers is a judgment call wearing a costume. The number comes from historical error rates, but it is an *estimate*, not a measurement. Tell Compliance these are "Historical Reliability Scores," not "Current Accuracy Guarantees."

  #### Step 2: Junior Decision Rules
  Juniors do not assess truth; they assess **process compliance**. They need a checklist, not a judgment.

  *   **For Tier 1:** Check that two senior signatures exist. If yes → **Accept**. If no → **Escalate**.
  *   **For Tier 2:** Check that the feed version matches the approved vendor list. If yes → **Accept**. If no → **Quarantine**.
  *   **For Tier 3:** Run the "Foreign Language Flag."
      *   If Flag = Clean → **Accept**.
      *   If Flag = Triggered → **Quarantine**.
  *   **For Tier 4:** **Never Ship.** These rows are excluded from the release file automatically.

  **The Honest Move:** If a row lands in Quarantine, it is not shipped. It is better to have a missing product entry than a wrong allergen entry. Missing data causes inconvenience; wrong data causes harm.

  #### Step 3: Allocating the Six Hours (Senior Time)
  Stop using senior time to "check weird stuff." Use it to **validate the buckets**.

  *   **Hour 1-2: The Parser Cluster (Tier 3/4).**
      *   Task: Manually review 50 random rows from the "Foreign Language Flagged" set.
      *   Goal: Confirm the flag is working. If the flag missed any, the entire Tier 3 batch must be downgraded to Tier 4 (Quarantine).
      *   *Why:* Clustered errors are fatal. Random errors are manageable.
  *   **Hour 3-4: The "Verified" Tier (Tier 1).**
      *   Task: Re-audit 10% (40 rows) of the "Verified" batch.
      *   Goal: Find process drift. If you find *one* error, the "Verified" claim is void for this release.
      *   *Why:* This protects your legal flank.
  *   **Hour 5-6: The Distributor Feed (Tier 2).**
      *   Task: Spot check 30 rows against the vendor's original PDF spec.
      *   Goal: Confirm the 0.3% historical rate still holds.
      *   *Why:* Vendors change data structures without telling you.

  #### Step 4: The Release Note (For Compliance)
  Compliance wants numbers. Give him numbers that represent **risk**, not perfection.

  *   **Current (Lie):** "This release has been validated for accuracy."
  *   **New (Truthful):** "This release contains 12,000 records. 400 records are Tier 1 Verified. 3,100 records are Tier 2 Sourced (Historical Error Rate <0.5%). 8,500 records are Tier 3 Processed. 0 records shipped with Tier 4 Flags. Estimated aggregate defect density <1.0% based on sampling."

  This gives Compliance the digits he needs to sign, but legally binds you only to the *process* and the *estimate*, not to a zero-defect reality.

  #### Step 5: Where the Numbers are Costumes (Fake Precision)
  1.  **The 0.3% Error Rate:** This is historical, not predictive. If the distributor changed their database schema yesterday, the rate is now 20%. You are assuming stability.
  2.  **The "Verified" Label:** Two humans checking a row does not make it defect-free. It makes it "Process Compliant."
  3.  **The 6-Hour Sample:** Checking 90 rows out of 12,000 is statistically weak. It detects catastrophic failure, not rare errors. Do not claim this sample proves accuracy; claim it proves **process adherence**.

  ---

  ### Part 3: Running the Procedure on Your Three Scenarios

  #### 1. The 3,100 Distributor Rows (0.3% Historical Error)
  *   **Classification:** Tier 2.
  *   **Action:** Accept for shipping, but tag internally as "Unverified Source."
  *   **Senior Time:** 1 Hour. Spot check 30 rows.
  *   **Release Note Claim:** "Sourced from Approved Vendor Feed."
  *   **Risk:** Random error. If one is wrong, it's unfortunate but likely isolated.
  *   **Verdict:** **Ship.** The cost of removing them (missing data) outweighs the low risk of random error, provided the release note doesn't claim they are "Verified."

  #### 2. The Parser with French/Spanish Mangling
  *   **Classification:** Tier 3 (Clean) vs. Tier 4 (Quarantine).
  *   **Action:** You cannot ship this batch as-is. Clustered errors are unacceptable in safety data.
  *   **Procedure:**
      1.  Run a regex filter for non-ASCII characters or common French/Spanish allergen terms (e.g., "leche," "blé," "lait").
      2.  Move all hits to Tier 4 (Quarantine). Do not ship them.
      3.  If you cannot filter them reliably, **exclude the entire parser batch** from this release.
  *   **Senior Time:** 2 Hours. Try to break the filter. If the filter fails, the batch dies.
  *   **Release Note Claim:** "Records derived from parsed labels exclude entries with non-English ingredient lists."
  *   **Verdict:** **Do Not Ship** the affected rows. It is better to have a gap in the menu than a hidden allergen. Gaps are visible; errors are invisible.

  #### 3. The "Verified" Tier (400 Rows, Hand-Checked)
  *   **Classification:** Tier 1.
  *   **The Hard Truth:** You cannot promise "defect-free." Humans are error-prone. Two checks reduce error; they do not eliminate it. Marketing is selling a fantasy that creates legal liability.
  *   **Action:**
      1.  **Contract Language:** Change "Defect-Free" to "Double-Verified Process." The warranty covers the *work*, not the *result*.
      2.  **Internal:** If the 2-hour audit (Step 3 above) finds *one* error, you must downgrade the entire 400-row batch to Tier 2. You cannot ship a "Verified" batch with a known defect rate.
  *   **Senior Time:** 2 Hours. Audit 10% randomly.
  *   **Release Note Claim:** "Processed under Tier 1 Verification Protocol."
  *   **Verdict:** **Ship only if audit is clean.** If the audit finds an error, you must tell Sales they cannot market this batch as Verified this quarter.

  ---

  ### Part 4: What This Procedure Cannot Settle
  These are the points where the flowchart ends and a human must own the decision. You cannot outsource these to a rule.

  1.  **The "Showstopper" Call:** If the Parser audit (Step 3) finds that the language filter is leaking, do you delay the release entirely, or ship without the parser data? Only you can weigh the revenue loss against the risk.
  2.  **The Contract Renegotiation:** You can change the release note, but Sales has already signed contracts promising "100% accuracy." You need to tell the CEO that the current contracts are uninsurable risks. The procedure protects QA; it does not protect Sales from their own promises.
  3.  **The "One Error" Rule:** If your 2-hour audit of the "Verified" tier finds one sesame error, do you downgrade all 400 rows? Statistically, yes. Politically, can you afford to? You must decide if "Verified" means "Perfect" or "Checked."
  4.  **The Quarantine Pile:** Rows moved to Tier 4 are lost revenue. How long do you keep them before deleting them? That is a business decision, not a QA one.

  **Summary for Compliance:**
  Hand him the "Release Note Claim" section. It gives him numbers (error rates, tier counts, sample sizes) without promising zero defects. It shifts the signature from "This data is perfect" to "This data was processed within these risk parameters."

  **Summary for Juniors:**
  Give them the Tier Checklist. If it doesn't have the checkbox, it doesn't ship. They are gatekeepers, not investigators.

  **Summary for You:**
  You are no longer managing rows; you are managing batches. Your job is not to find every error (impossible); it is to ensure no *clustered* errors ship and that the "Verified" claim doesn't become a lawsuit.
