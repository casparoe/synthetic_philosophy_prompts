  9.  **Addressing the "Settled vs. Contested" Requirement:**
      *   *Settled:* Math of geometric Brownian motion (discrete version). Kelly maximizes $E[\log W]$. Full betting maximizes $E[W]$ but minimizes $E[\log W]$ if $p < 1$.
      *   *Contested:* Whether $E[\log W]$ is the *only* rational criterion. Samuelson's critique (fallacy of large numbers). Fractional Kelly as robust control vs. risk aversion.

  10. **Review against Constraints:**
      *   No pre-lecture naming? Yes.
