  11. **Final Polish:** Ensure tone is appropriate for grad students (rigorous but interactive). Make sure the math in the debrief is clear but not overwhelming (no stochastic calculus). Use the term "Geometric Growth Rate" instead of "Kelly" initially.

      *(Self-Correction during drafting)*: I need to make sure the "Expected Wealth" vs "Expected Log Wealth" distinction is clear.
      *   Strategy A (All-in): High $E[W]$, Low $E[\log W]$.
