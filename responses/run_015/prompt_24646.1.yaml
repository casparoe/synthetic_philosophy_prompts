      *   In a *single* realization (the class game), the All-in students will likely bust, but the *average* of many hypothetical classes would be huge. I need to explain this distinction carefully in the debrief. The class *is* one realization. The "Expected Wealth" is an ensemble average. The "Log Wealth" is a time average (ergodicity breaking). This is a key philosophical point for this audience.

      *Revised Twist:* To make the Ensemble vs. Time average clear, I will group them. Or better, I will calculate the "Class Average Wealth" vs. "Class Median Wealth" at the end. The Average will be skewed by the one lucky all-in bettor. The Median will favor the moderate bettors. This visually demonstrates the difference between Arithmetic Mean (Expected Wealth) and Geometric/Median (Log Wealth).

      *Wait, one more check on the "Twist":* The prompt asks for estimation error or model misspecification.
