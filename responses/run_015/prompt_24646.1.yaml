      *   **Troubleshooting:** Students might bet 0 (boredom). Students might bet 100% (gambling instinct). Students might not do the math.
      *   **Limitations:** The game is finite (20 rounds). True Kelly logic applies to infinite/long horizon. The facilitator must explain the limit behavior.
      *   **Settled vs. Contested:** This is crucial. I must explicitly separate the math (settled) from the normative claim (contested).

  8.  **Refining the "Twist" for Maximum Impact:**
      *   The prompt asks for a twist that forces confrontation with estimation error or horizon.
      *   *Idea:* Run the game for 10 rounds. Then announce, "Actually, we are going to compound these results for a theoretical 1,000 rounds using your chosen fraction."
      *   *Why:* This highlights that their strategy for 10 rounds (where variance is fun) might be disastrous for 1,000 rounds.
      *   *Alternative:* Just run 30 rounds. 30 is enough to see divergence. Let's stick to physical rounds but analyze the *projected* long-term outcome.
