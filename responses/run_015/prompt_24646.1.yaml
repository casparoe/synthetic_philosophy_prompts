      *   **Constraint 5 (Troubleshooting):** Predict what goes wrong, how to handle it, what the activity *cannot* do (facilitator must supply).
      *   **Constraint 6 (Epistemology):** Distinguish settled vs. contested views (Kelly normativity, fractional Kelly, finite horizon, estimation error). No bibliography/citations.

  2.  **Deconstruct the Core Concept:**
      *   *Expected Wealth Maximization:* Bet everything (or as much as possible) if EV > 0. In a finite number of rounds $N$, maximizing $E[W_N]$ usually implies betting the full bankroll if the edge is positive, because the arithmetic mean dominates.
      *   *Expected Log Wealth Maximization (Kelly):* Bet fraction $f^* = p - q$ (for even money). Maximizes geometric growth rate. Avoids ruin.
      *   *The Tension:* For small $N$, betting more than Kelly often yields a higher *average* outcome (due to a few huge winners skewing the mean), but a lower *median* outcome (most people lose money). For large $N$, betting > Kelly leads to ruin (wealth $\to 0$).
      *   *The Twist:* Need to introduce uncertainty about $p$. If they estimate $p$ from a small sample, they might overbet.

  3.  **Drafting the Game Design:**
      *   *Materials:* Biased coins are hard to manage for 14 people simultaneously. A deck of cards or a digital randomizer projected on screen is better. Let's use a "Bag of Chips" or "Deck of Cards" analogy projected on screen for uniformity, or physical coins if they bring them. Actually, for 14 students, having them bet individually is best. Let's use a simple "Red/Black" draw from a shuffled deck where the composition is unknown but sampled.
      *   *Better Idea:* Use a computer script (Python/Excel) projected, or have them flip physical coins. Physical coins are tactile but noisy. Let's go with a "Hidden Bias" coin. The instructor has a bag of coins with different biases, or just one biased coin where $p$ is unknown.
      *   *Refined Mechanism:* To ensure everyone faces the *same* sequence (crucial for comparison), the Instructor should generate the outcomes.
      *   *Setup:* 14 students. Each gets 100 "tokens".
      *   *Phase 1 (Sampling):* Show 10 flips. Students estimate $p$.
      *   *Phase 2 (Betting):* 20 rounds. Even money payoff (win 1:1).
      *   *The Twist:* The probability changes halfway, or the horizon is revealed to be shorter/longer than expected. Let's go with *Horizon Uncertainty*. They think it's 20 rounds, but we stop at 5 for one metric and simulate 100 for another. Or, simpler: The "True $p$" is lower than the sample suggests (Estimation Error).
      *   *Decision:* Let's use the "Estimation Error" twist. Sample suggests $p=0.6$, true $p=0.55$ (or vice versa). This punishes overbetting based on sample noise.
      *   *Wait, the prompt asks to distinguish Expected Wealth vs. Log Wealth.*
      *   *Key Insight:* If $p > 0.5$, Expected Wealth says bet 100%. Log Wealth says bet $2p-1$.
      *   *Game Flow:*
          1.  Endow tokens.
          2.  Show sample (e.g., 10 flips, 7 Heads).
          3.  Ask them to write down a strategy (fraction $f$).
          4.  Run 15 rounds.
          5.  Calculate results.
          6.  Reveal the math.

  4.  **Developing the Timeline (75 mins):**
      *   0-10: Intro & Rules.
      *   10-20: Sampling Phase.
      *   20-50: Betting Phase (15-20 rounds).
      *   50-65: Results & Initial Discussion.
      *   65-75: Theoretical Debrief & Contested Issues.

  5.  **Addressing the "Twist":**
      *   To make the difference between Arithmetic and Geometric mean clear, we need a scenario where the "Bet Everything" strategy *looks* good in expectation but fails for the individual.
      *   *Twist:* After the game, reveal that while the *average* wealth of the class might be high (driven by 1 lucky student), the *median* wealth is low.
      *   *Second Twist:* Introduce "Bankruptcy" (wealth < 1 token).
      *   *Refined Twist:* The "Stop Rule". If you hit 0, you're out. This makes the geometric growth relevant immediately.

  6.  **Addressing the Epistemological Constraints:**
      *   *Settled:* Log utility maximizes long-run growth rate almost surely. Betting full bankroll leads to ruin almost surely in infinite horizon with any loss probability.
      *   *Contested:* Is Kelly *normative* for rational choice? (Samuelson vs. Kelly). Is it just a specific utility function? How to handle parameter uncertainty (Fractional Kelly)? Is finite horizon EV maximization coherent?

  7.  **Drafting the Content - Section by Section:**

      *   **Title:** The "Growth vs. Gamble" Seminar.
      *   **Materials:** Tokens (paper), Projector (for generating flips to ensure identical sequences), Handouts (record sheets).
      *   **Rules:** Even money bet. $p$ is fixed but unknown. Sample provided.
