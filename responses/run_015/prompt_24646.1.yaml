answer: |-
  # Seminar Activity: The Growth vs. Gamble Experiment

  ## 1. Overview and Learning Objectives
  **Goal:** To experientially demonstrate the divergence between maximizing expected arithmetic wealth (ensemble average) and maximizing expected logarithmic wealth (time-average growth rate) in repeated favorable bets.
  **Target:** 14 Graduate Students (Philosophy/Economics).
  **Duration:** 75 Minutes.
  **Prerequisites:** Basic probability (EV, variance), no stochastic calculus.

  ## 2. Materials and Setup
  *   **Currency:** "Lab Tokens" (printed paper slips or poker chips). Initial endowment: 100 tokens per student.
  *   **Randomizer:** A projected spreadsheet or Python script controlled by the instructor. This ensures all students face the *exact same sequence* of outcomes, allowing for direct comparison of strategies. (Do not use physical coins; they are too slow and introduce suspicion of bias).
  *   **Record Sheets:** A handout with 25 rows (10 for sampling, 15 for betting) to record outcomes, bet fractions, and running totals.
  *   **Calculator:** Students may use phones/laptops.
  *   **The "Sealed Truth":** An envelope containing the true probability $p$ and the pre-generated sequence of 25 outcomes.

  ## 3. Game Rules
  1.  **The Asset:** A binary asset that pays 1:1. If you bet $B$ tokens and win, you gain $B$. If you lose, you lose $B$.
  2.  **The Edge:** The asset is biased in your favor ($p > 0.5$), but the exact $p$ is unknown.
  3.  **Bankruptcy:** If your bankroll drops below 1 token, you are "ruined" and must stop betting (wealth = 0).
  4.  **Objective:** Maximize your final token count. (Note: Do not specify *how* to maximize yet).
  5.  **Betting:** You must choose a fixed fraction $f$ of your *current* bankroll to bet each round. You write this fraction down before the betting phase begins and cannot change it.

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-05** | **Introduction** | Distribute tokens (100 each) and record sheets. Explain rules. Emphasize: "You face the same sequence. You choose a fixed fraction $f$." |
  | **05-15** | **Phase 1: Sampling** | Project 10 historical outcomes. <br> *Sequence:* H H T H T H H T H T (6 Heads, 4 Tails). <br> *Task:* Students estimate $p$ and calculate their optimal fraction $f$. They write $f$ on their sheet. |
  | **15-45** | **Phase 2: Betting** | Run 20 rounds of live betting. <br> *Pace:* 1.5 mins per round (Project outcome -> Students calculate new wealth -> Record). <br> *Instructor Role:* Track the "Class Mean" and "Class Median" wealth on the board silently. |
  | **45-55** | **Phase 3: The Reveal** | Stop betting. Collect final wealth data. <br> **The Twist:** Reveal the *True* $p$ was 0.55 (not 0.60 as sampled). <br> **The Projection:** Ask students to calculate where their strategy would lead after 1,000 rounds using the *True* $p$. |
  | **55-65** | **Results Analysis** | Compare the student with the highest wealth vs. the median wealth. Discuss who went bust. Introduce the terms "Arithmetic Mean" vs. "Geometric Mean." |
  | **65-75** | **Theoretical Debrief** | Connect game dynamics to Expected Wealth vs. Expected Log Wealth. Discuss settled math vs. contested normativity (see Section 6). |

  ## 5. The Twist: Estimation Error and Horizon
  The core tension relies on the discrepancy between the **Sample Estimate** and the **True Parameter**, combined with the **Finite vs. Infinite Horizon**.

  1.  **Estimation Error:** The sample (6/10 = 0.60) suggests a Kelly fraction of $f^* = 2p - 1 = 0.20$. However, the true $p$ is 0.55, where the true Kelly fraction is $0.10$. Students who trust the sample and bet 20% are technically "overbetting" relative to the truth. In a short game (20 rounds), this might still yield high returns due to variance. In the projected long run (1,000 rounds), this overbetting drastically reduces growth and increases ruin risk.
  2.  **Horizon Mismatch:** Students optimize for the 20 rounds in front of them. The debrief forces them to confront that their 20-round optimal strategy (likely high $f$) is catastrophic for a 1,000-round horizon. This illustrates that "maximizing wealth" is ill-defined without specifying the time horizon.

  ## 6. Troubleshooting and Limitations

  ### Predictable Failures and Mitigations
  *   **Failure:** Students bet $f=0$ (Risk Aversion) or $f=1$ (Gambling).
      *   *Mitigation:* During the sampling phase, ask for a show of hands: "Who thinks they should bet everything?" and "Who thinks they should bet nothing?" Briefly validate both without judging, then proceed. In the debrief, use these extremes as bookends for the calculation.
  *   **Failure:** Calculation Errors.
      *   *Mitigation:* Provide a simple spreadsheet template on a shared drive or allow phone calculators. Remind them: $New Wealth = Old Wealth \times (1 + f)$ if Win, $Old Wealth \times (1 - f)$ if Lose.
  *   **Failure:** "I got lucky" bias.
      *   *Mitigation:* If a student who bet 100% wins the game, do not dismiss them. Highlight them in the debrief as the "Outlier that skews the Arithmetic Mean." Use their success to explain why Expected Wealth maximization demands betting 100%.

  ### What the Activity Cannot Reproduce (Facilitator Must Supply)
  1.  **The Ensemble Average:** The class represents *one* path through time. Expected Wealth Maximization is about the average of *many parallel universes*. You must explain verbally: "If we ran this class 1,000 times, the average wealth of the 'Bet 100%' students would be higher than the 'Bet 10%' students, even though almost all 'Bet 100%' students go bust in any single run."
  2.  **Asymptotics:** 20 rounds is not enough for the Law of Large Numbers to fully stabilize the geometric growth rate. You must explain that the Log-Wealth criterion is strictly dominant only as $N \to \infty$. In finite horizons, there is a trade-off.
  3.  **Utility Curves:** The game assumes tokens have linear value. You must supply the philosophical link: "Why do we care about Log Wealth? Because it corresponds to a specific utility function ($U(W) = \ln W$) or, alternatively, because it maximizes the almost-sure growth rate."

  ## 7. Debrief Guide: Mapping Moments to Theory

  **Moment 1: The Sample Estimate (Minute 15)**
  *   *Observation:* Most students likely calculated $f \approx 0.2$ based on the 0.6 sample.
  *   *Theory:* This is the **Kelly Criterion** ($f^* = p - q$). It maximizes the expected logarithm of wealth.
  *   *Calculation:* Show that for $p=0.55$, betting $f=0.2$ yields a lower geometric growth rate than betting $f=0.1$. This demonstrates **Estimation Risk**.

  **Moment 2: The Busts (Minute 45)**
  *   *Observation:* Students who bet $f > 0.5$ likely have 0 tokens.
  *   *Theory:* **Gambler's Ruin.** Even with positive EV, betting too large a fraction makes the probability of ruin approach 1 as rounds increase.
  *   *Calculation:* Compare Arithmetic Mean Return vs. Geometric Mean Return.
      *   Arithmetic: $1 + f(2p - 1)$
      *   Geometric: $(1+f)^p (1-f)^q$
      *   Show that while Arithmetic increases with $f$, Geometric peaks at Kelly and drops thereafter.

  **Moment 3: The Winner vs. The Median (Minute 55)**
  *   *Observation:* The single wealthiest student likely bet aggressively. The median wealth is likely held by moderate bettors.
  *   *Theory:* **Ergodicity Breaking.** The ensemble average (mean wealth) is not the same as the time average (typical path).
  *   *Takeaway:* Maximizing Expected Wealth ($E[W]$) requires ignoring ruin risk in finite horizons. Maximizing Growth Rate ($E[\ln W]$) protects the typical path.

  ## 8. Settled vs. Contested Claims (Facilitator Notes)

  In the final 10 minutes, you must distinguish between the mathematical properties of the strategies and the normative claims about rationality. Do not conflate them.

  ### Settled (Mathematical Consensus)
  1.  **Growth Rate:** Maximizing expected logarithmic wealth is mathematically equivalent to maximizing the almost-sure long-run geometric growth rate of the bankroll.
  2.  **Ruin:** For any bet with a probability of loss $q > 0$, betting the full bankroll ($f=1$) leads to ruin with probability 1 as the number of rounds $N \to \infty$.
  3.  **Divergence:** For any finite $N$, the strategy that maximizes Expected Wealth ($E[W_N]$) involves betting a larger fraction (often 100%) than the strategy that maximizes Expected Log Wealth. The former has a higher mean but a lower median.
  4.  **Estimation Sensitivity:** The growth rate function is flat near the optimal Kelly fraction but drops sharply for fractions $> f^*$. Overbetting is more dangerous than underbetting.

  ### Contested (Philosophical/Economic Debate)
  1.  **Normativity of Kelly:**
      *   *View A:* Kelly is the only rational strategy for repeated investment because it maximizes long-run survival and growth (Breiman, Thorp).
      *   *View B (Samuelson):* Kelly is a "fallacy." Maximizing $E[\ln W]$ is only rational if you *actually* have log utility. If you have linear utility, you should maximize $E[W]$ regardless of horizon. The "long run" is a misleading concept because we always face finite horizons.
      *   *Facilitator Stance:* Present both. Ask: "If you only play 20 rounds, is it irrational to bet more than Kelly?"
  2.  **Fractional Kelly under Ambiguity:**
      *   *Consensus:* When $p$ is unknown (as in the game), betting full Kelly based on an estimate is suboptimal.
      *   *Debate:* How much to discount? Is "Half-Kelly" a robust heuristic for parameter uncertainty, or is it merely an expression of risk aversion? Some argue it is optimal Bayesian control; others argue it is ad-hoc.
  3.  **Finite Horizon Coherence:**
      *   *Debate:* Is Expected Wealth Maximization coherent for finite horizons? Critics argue it ignores the *distribution* of outcomes (risk of ruin). Proponents argue that if you can play the game repeatedly across parallel instances (ensemble), EV maximization is correct.
  4.  **Weight of Ruin:**
      *   *Debate:* How much should "ruin" (wealth < subsistence) weigh in decision theory? In the game, ruin meant stopping. In reality, ruin might mean death or exit from the market. The weight given to this boundary condition determines the optimal fraction.

  ### Closing Instruction to Facilitator
  End the session by asking: "Did you play to win the class (beat the median) or to maximize your expected payout (beat the mean)?" This forces them to acknowledge that their objective function was ambiguous, which is the root of the tension between Expected Wealth and Expected Log Wealth.
