answer: |-
  It is entirely understandable that you are knackered. Listening to a record skip for three years wears down the needle, and frankly, it wears down the listener too. You are caught between loyalty to a friend and the preservation of your own sanity, which is a very common, very difficult spot to be in.

  Let's unpick the two things you've asked for.

  ### One: Is behaviour the only real evidence?

  The friend who told him that 'wanting is just what you do' is speaking a hard truth, but it is an incomplete one. It is a behaviourist view: if it isn't observed, it didn't happen. That is useful for cutting through nonsense, but it is rubbish for understanding human beings.

  To answer your weirder question: yes, there is a fact about what he wants sitting inside him that his behaviour is failing to guide. However, you must distinguish between a *preference* and a *priority*.

  He genuinely prefers the idea of leaving. He likely daydreams about it, and the relief he feels when talking to you is real. But a preference is only a fantasy until it is weighed against cost. His behaviour proves that his preference for safety, stability, his child's schooling, and his mother's care is *higher* than his preference for a new city.

  The error in the 'behaviour is everything' argument is that it assumes he is choosing between 'Stay' and 'Go'. He is not. He is choosing between 'Stay (with misery)' and 'Go (with guilt/risk/financial hit)'. He is actively choosing the misery he knows over the risk he doesn't. That is a choice, but it doesn't mean the desire to leave is fake. It just means it isn't the strongest force in the room.

  Regarding the 'trial run' suggestion: your hesitation is sensible. If he turns down a month's leave or a trial, it doesn't necessarily mean he doesn't want to leave forever. It might mean he is too paralysed by the *mechanics* of change to even handle the logistics of a holiday. However, generally speaking, if a person will not dip a toe in the water, it suggests they are more in love with the *idea* of swimming than the water itself. It tells you that the barrier isn't just the magnitude of the leap; it's the act of leaping at all.

  So, the behaviourist is half-right. His actions show his *priorities*, but they do not invalidate his *feelings*. He is suffering, but he is unwilling to pay the price to end the suffering. That is a tragic position, but it is his to hold.

  ### Two: What should you concretely do?

  You cannot fix this for him. If you push too hard, you become another demand on his time; if you listen passively, you become a repository for his complaints. You need to change the dynamic of the support you offer.

  Here is a practical approach, broken down into boundaries and conversation shifts.

  **1. Protect your sleep**
  The midnight calls must stop. It sets a precedent that his crisis is an emergency that overrides your rest.
  *   **Say this:** 'Mate, I care about you and I want to help, but I can't take calls after 10pm anymore. I'm not sleeping well and I need to switch off. If you need to talk, ring me before dinner.'
  *   **Do this:** If he rings at midnight, do not answer. Text him in the morning: 'Saw you rang. As I said, I'm keeping my phone off at night. Everything alright?'

  **2. Stop validating the fantasy**
  Currently, when he details the escape plan, you likely listen and nod. This rewards the complaining. You need to stop being the audience for the play he never performs.
  *   **The Shift:** When he starts the 'I need to get out' monologue, do not ask 'Where would you go?' or 'What would you do?'. Instead, ask: 'Have you applied for anything this week?' or 'What is the specific thing stopping you from booking the ticket today?'
  *   **The Follow-through:** If he says 'Well, the timing...' or 'My mum...', you say: 'Right. So it sounds like you're staying put for now. Let's talk about something else, because hearing you talk about leaving when you aren't going to is doing you no good.'

  **3. The 'Trial' Suggestion**
  You can offer the trial run idea, but only once, and frame it as a way to silence the noise in his head.
  *   **Say this:** 'You've been talking about this for three years. The tension is clearly killing you. Why not book a two-week solo trip somewhere you'd consider moving? Just to see. If you hate it, you know. If you love it, you know.'
  *   **The Condition:** If he finds a reason not to do that, you have your answer. You can then say, 'Okay, well until you're ready to test the water, I think we should stop discussing the ocean.'

  **4. Acceptance**
  You asked if you are enabling him. The answer is: slightly. By absorbing the emotional cost of his inaction, you make it easier for him to stay still. He gets the relief of venting without the risk of moving.

  You need to withdraw that relief. This might make him angry or distant for a while. That is acceptable. A friendship that relies on you acting as his therapist for a problem he refuses to solve is not a healthy friendship.

  **Summary**
  There is a real desire inside him, but it is currently losing a fight against his fear and obligation. You cannot tip the scales for him. You can only stop letting him use you as a counterweight. Set the boundary on the calls, refuse to discuss the 'escape plan' unless there is a concrete step attached to it, and be prepared for him to be cross about it. If he is a true mate, he will respect your limits. If he only values you as a sounding board for his misery, then his behaviour will tell you that, too.
