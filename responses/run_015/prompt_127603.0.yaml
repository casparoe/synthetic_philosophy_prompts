      *   *Nuance:* The "Concorde Fallacy" is the classic example. But sometimes finishing a project creates a "completion bonus" (psychological utility). That's a future benefit, not a past cost.
      *   *Key Distinction:* Is the reason for continuing *because* of the past, or is the past creating a *future* condition (like reputation) that justifies continuing?

