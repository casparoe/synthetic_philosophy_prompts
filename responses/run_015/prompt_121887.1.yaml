prompt: |-
  I'm on a course about epistemic autonomy and we've been arguing about whether using AI to think for you actually erodes understanding, or if it's just like using a calculator. The problem is that everyone talks about 'trust' and 'explainability' but nobody seems to say what understanding itself has to amount to when there's an opaque predictive model in the loop. So I'm trying to write the full spec — the desiderata for any theory that wants to account for understanding under what I'd call 'cognitive proxying', where a human recieves a conclusion from a system they can't fully reconstruct.

  What I need is the list of requirements: the phenomena it must explain, the cases it has to get right, the distinctions it can't collapse — for instance, between knowing that p and being able to reproduce the reasoning path; between a surgeon who relies on an AI diagnostic that's correct 99% of the time but can't trace its inference, and a student who prompts a model iteratively until an essay sounds right but can't defend half the claims. Also flag which of these are genuinely non-negotiable and which are just camp preferences — say, the view that understanding must always involve conscious access to every step versus allowing subpersonal or distributed mechanisms. And I particularly want to know if there's a jointly unsatisfiable subset: can you require both full causal transparency and practical feasability in high-stakes clinical settings without contradiction? If there's a tension there, that's the bit I care about most.

  Please don't score every existing theory against the list — I'm writing this on a train with no wifi and I mainly want the criteria mapped out properly, not a bibliography. Also, if any pair of desiderata looks like it can't be satisfied together given what we know about human cognitive limits and black-box architectures, say so explicitly.
