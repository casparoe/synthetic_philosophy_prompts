answer: |-
  Here are seven interview questions designed to press the guest on the implications of "mnemonic debt," including the specific comparisons and scenarios you requested. Each includes an anticipated response and a follow-up designed to limit academic hedging.

  ### 1. The Core Mechanism
  **Question:** You argue that democracies *need* these unresolved defeat narratives to function—that closing the book on them collapses the space minority groups need to exist. But isn't there a difference between a narrative remaining *unresolved* and a narrative remaining *unaccountable*? Where do you draw the line between preserving historical ambiguity and permitting historical denialism?

  **Anticipated Answer:** She will likely argue that "accountability" is often a code word for imposing the victor's single truth, which erases the lived experience of the defeated. She'll suggest that ambiguity allows for a pluralistic society where multiple truths can coexist without one crushing the others.

  **Follow-up:** That sounds ideal in theory, but in practice, doesn't that "pluralistic space" often get occupied by the most organized group rather than the most vulnerable? If ambiguity is the shelter, what stops a well-funded extremist movement from moving into that shelter and fortifying it against the very minorities you're trying to protect?

  ### 2. Ethnic-Nationalism vs. Post-Imperial Democracy (Required)
  **Question:** I want to compare two items on your ledger: the Battle of Kosovo Polje for Serbian nationalism, and the Dunkirk evacuation for British identity. One fuels an ethnic-nation-state, the other a post-imperial democracy. Does "mnemonic debt" operate differently in these two contexts, or is the underlying mechanism—the reliance on an unresolved loss—exactly the same?

  **Anticipated Answer:** She will likely distinguish them by outcome or intent. She may argue that Dunkirk is a "resilience myth" that unites a civic state, whereas Kosovo is an "ethnic grievance" that excludes others. She'll try to separate "healthy" unresolved memory from "toxic" unresolved memory.

  **Follow-up:** But if the mechanism is the same—keeping the story open-ended to serve present needs—doesn't that mean the "healthy" version is just one that hasn't turned violent *yet*? If the tool is identical, how can you guarantee that a Dunkirk-style debt won't be weaponized into a Kosovo-style debt when political incentives shift?

  ### 3. The Confederacy and Sanitization (Required)
  **Question:** Let's talk about the Lost Cause. Your framework suggests that fully repudiating this narrative might collapse the space for Southern historical consciousness. But critics would say that keeping the Lost Cause "unresolved" effectively sanitizes the violence of slavery and secession. Does your theory risk treating white supremacist mythology as just another valid entry in the ledger of democratic memory?

  **Anticipated Answer:** She will likely push back on the idea that she is defending the *cause* itself. She'll argue she is defending the *right to mourn* defeat without being forced into a state-mandated narrative of shame. She will emphasize that "repudiation" can feel like cultural erasure to the descendants of the defeated.

  **Follow-up:** I understand the distinction between mourning and myth, but when the object of mourning is a project built on human chattel slavery, doesn't the "right to mourn" become a shield for the myth? If we keep that debt outstanding to preserve ambiguity, aren't we essentially asking marginalized groups to tolerate the unresolved status of their own ancestors' oppression for the sake of democratic stability?

  ### 4. The State "Calling In" the Debt (Required)
  **Question:** You use the financial metaphor of "debt." In finance, if you don't pay your debt, eventually the bank calls it in. What happens when the state decides to "call in" the mnemonic debt? Say a government officially repudiates the myth, tears down the monuments, and enforces a single, resolved narrative. Does the system crash, or does it just stabilize on a new truth?

  **Anticipated Answer:** She will likely argue that "calling in the debt" leads to backlash, radicalization, or the driving of the narrative underground where it becomes more extreme. She'll suggest that forced resolution creates martyrs and hardens the opposition, making the democratic space less flexible.

  **Follow-up:** But isn't there a scenario where *not* calling in the debt is more dangerous? If the "interest" on that debt is paid in ongoing racial violence or political insurrection, at what point does the cost of maintaining that ambiguous space exceed the cost of the crash? Are some debts simply too toxic to keep on the books?

  ### 5. Who Holds the Debt?
  **Question:** Your theory relies on the idea that these narratives protect "minority groups." But historically, the bearers of the Lost Cause or Serbian nationalist myths weren't marginalized minorities; they were displaced elites. When the group holding the debt is politically powerful but culturally aggrieved, does "mnemonic debt" stop being a shield for the vulnerable and start being a sword for the revanchist?

  **Anticipated Answer:** She will likely nuance the definition of "minority." She may argue that even politically powerful groups can be culturally marginalized or feel existentially threatened by modernization. She'll try to separate political power from cultural status.

  **Follow-up:** That distinction feels fragile when those culturally aggrieved groups hold the levers of legislative power. If a group has the power to pass laws but claims the status of a "defeated minority" to protect their myths, how do we diagnose that? Does your framework have a way to identify when the "debt" is being used to punch down rather than shield against pressure?

  ### 6. Moral Ambiguity vs. Historical Complexity
  **Question:** Historians always argue for complexity over simplicity. But there seems to be a difference between teaching that history is *complex* and teaching that history is *morally ambiguous*. Does "mnemonic debt" require us to treat the moral stakes of a conflict as unresolved, even when the evidence is clear?

  **Anticipated Answer:** She will likely say she isn't arguing for moral relativism regarding facts, but rather for the *social function* of the story. She'll argue that society needs the *story* of the loss to remain open, even if the *facts* are settled, to allow for identity formation.

  **Follow-up:** But public history isn't just about identity formation; it's about civic education. If we teach that the moral stakes of a civil war or an invasion remain "open" to preserve this ambiguous space, aren't we training citizens to believe that fundamental questions of justice are matters of opinion rather than fact? Does that weaken democracy's ability to recognize tyranny in the future?

  ### 7. The Expiration Date
  **Question:** Financial debts eventually get paid off or written off. Does mnemonic debt have an expiration date? Is there a point where a society becomes stable enough, or the participants distant enough, that the "unresolved" story becomes more of a liability than an asset?

  **Anticipated Answer:** She will likely be hesitant to set a timeline. She may argue that memory is intergenerational and that "stability" is an illusion, so the debt must be managed indefinitely. She'll suggest that writing it off prematurely is always a risk.

  **Follow-up:** If the answer is "indefinitely," doesn't that mean we are permanently shackled to our worst conflicts? If we can never fully resolve the narrative of a civil war or a genocide without collapsing the democratic space, does that mean democracy is fundamentally dependent on never fully healing from its traumas? Is that a sustainable model for the future?
