prompt: |-
  I'm helping organize a podcast Q&A for a public-history series next month, and our guest is a historian who works on defeat narratives. She has this concept she calles "mnemonic debt"—basically the claim that modern democracies need certain lost-cause stories (the Confederacy's Lost Cause, Masada in Israeli identity, Kosovo Polje for Serbian nationalism, and even the Dunkirk evacuation in Britain) to stay unresolved, neither fully glorified nor fully repudiated. She thinks resolving them collapses the ambigous space that minority groups need to maintain their own historical consciousness. I find it kind of compelling but also worry it lets dangerous myths off the hook.

  Could you draft six to eight interview questions that really press her? I want one that makes her compare how mnemonic debt operates in an ethnic-nationalist setting like Kosovo versus a post-imperial democratic one like Dunkirk; one that asks whether her framework definatly risks sanitizing the Confederacy's violence; and one about what happens when the state "calls in" the debt—say, if a government officially repudiates the myth and replaces it with a single narrative. For each question, anticipate the answer she's most likely to give and write a follow-up that closes off her usual escape route. Please don't ask her for bibliographies or citations—this is meant to be a live conversation, not a syllabus, and I wouldn't be able to check them anyway.
