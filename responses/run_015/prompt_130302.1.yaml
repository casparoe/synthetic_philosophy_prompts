  # METAPHYSICS SEMINAR: CAUSATION CLASSIFICATION TREE

  ## I. LOGICAL SPACE (THE EIGHT QUESTIONS)

  To classify a position on causation, answer the following eight questions in order. Do not worry about historical labels; answer based on the commitments of the view you are analyzing.

  **Node 1: Modal Status**
  Given the cause occurs and nothing interferes, *could* the effect fail to occur?
  *   (A) No, it is metaphysically necessary.
  *   (B) No, it is contingent but guaranteed.
  *   (C) Yes, it could fail.

  **Node 2: Ontological Production**
  Does the cause *transfer* or *give* any being, power, or energy to the effect?
  *   (Yes) Something passes from cause to effect.
  *   (No) The effect is distinct; nothing passes.

  **Node 3: Explanatory Intelligibility**
  Does knowing the cause make the effect *intelligible* (more than just expected)?
  *   (Yes) The cause explains *why* the effect is.
  *   (No) The cause only signals *that* the effect is.

  **Node 4: Source of Stability (Ternary Split)**
  What maintains the connection between cause and effect?
  *   (A) The **Intrinsic Character** of the cause itself.
  *   (B) A **Standing Rule** or habit governing events.
  *   (C) A **Particular Determination** for each individual instance.

  **Node 5: Counterfactual Truth**
  Consider: "If this cotton were put in the fire, it would burn." Is this statement strictly *true*?
  *   (True) It describes a fact about the world.
  *   (Prediction) It describes a reliable expectation only.

  **Node 6: Human Action**
  When you raise your arm intentionally, does your intention *produce* the motion?
  *   (Produce) The intention generates the motion.
  *   (Accompany) The intention coincides with the motion's production.

  **Node 7: Indeterministic Decay**
  In the spontaneous decay of a single atom, is the time of decay fixed by the atom's prior state?
  *   (Fixed) The history settles the outcome.
  *   (Open) The history does not settle the outcome.

  **Node 8: Causal Status (Ternary Split)**
  What is the fundamental status of causal power?
  *   (A) **Essential:** Power belongs to the nature fundamentally.
  *   (B) **Instrumental:** Power is borrowed from a higher principle.
  *   (C) **Functional:** Power is defined by what allows manipulation.

  ---

  ## II. THE DECISION TREE (PATHS TO LEAVES)

  Follow the answers from Section I to locate the position.

  1.  **Node 1 (C: Could Fail)** → **Node 2 (No)** → **Node 3 (No)** → **Node 4 (C: Particular)**
      *   **LEAF 1**
  2.  **Node 1 (C: Could Fail)** → **Node 2 (No)** → **Node 3 (No)** → **Node 4 (B: Rule)** → **Node 5 (True)**
      *   **LEAF 2**
  3.  **Node 1 (C: Could Fail)** → **Node 2 (No)** → **Node 3 (No)** → **Node 4 (B: Rule)** → **Node 5 (Prediction)**
      *   **LEAF 3**
  4.  **Node 1 (B: Contingent/Guaranteed)** → **Node 2 (No)** → **Node 3 (Yes)** → **Node 4 (B: Rule)** → **Node 5 (True)**
      *   **LEAF 4**
  5.  **Node 1 (A: Necessary)** → **Node 2 (Yes)** → **Node 3 (Yes)** → **Node 4 (A: Intrinsic)** → **Node 7 (Fixed)** → **Node 8 (A: Essential)**
      *   **LEAF 5**
  6.  **Node 1 (B: Contingent/Guaranteed)** → **Node 2 (Yes)** → **Node 3 (Yes)** → **Node 4 (A: Intrinsic)** → **Node 7 (Open)** → **Node 8 (A: Essential)**
      *   **LEAF 6**
  7.  **Node 1 (B: Contingent/Guaranteed)** → **Node 2 (Yes)** → **Node 3 (Yes)** → **Node 4 (A: Intrinsic)** → **Node 7 (Fixed)** → **Node 8 (A: Essential)**
      *   **LEAF 7**
  8.  **Node 1 (B: Contingent/Guaranteed)** → **Node 2 (Yes)** → **Node 3 (Yes)** → **Node 4 (A: Intrinsic)** → **Node 7 (Fixed)** → **Node 8 (B: Instrumental)**
      *   **LEAF 8**
  9.  **Node 8 (C: Functional)** (Reachable from any prior path where manipulation is primary)
      *   **LEAF 9**
  10. **Node 1 (B: Contingent/Guaranteed)** → **Node 2 (Yes)** → **Node 3 (No)** → **Node 4 (B: Rule)**
      *   **LEAF 10**
  11. **Node 1 (C: Could Fail)** → **Node 2 (Yes)** → **Node 3 (Yes)** → **Node 4 (B: Rule)**
      *   **LEAF 11**

  ---

  ## III. LEAF DESCRIPTIONS

  **Leaf 1: Ash'arite Occasionalism**
  *   **Awkward Commitment:** Every single event, including the motion of your arm, is a fresh creation with no link to the prior moment.

  **Leaf 2: Malebranche's Occasionalism (General Volitions)**
  *   **Awkward Commitment:** God acts by general laws rather than particular wills, yet creatures possess no power to execute them.

  **Leaf 3: Humean Regularity**
  *   **Awkward Commitment:** There is no difference in the world between a causal sequence and a coincidental constant conjunction.

  **Leaf 4: Nomic Necessitation (Lewis/Armstrong)**
  *   **Awkward Commitment:** Laws of nature govern events without transferring any physical quantity or power between them.

  **Leaf 5: Avicennan Necessary Emanation**
  *   **Awkward Commitment:** The universe flows from the First Principle with metaphysical necessity, leaving no room for contingency in nature.

  **Leaf 6: Powers/Dispositionalist View**
  *   **Awkward Commitment:** Causes can be real and productive even when they fail to produce their effects due to masking or interference.

  **Leaf 7: Created-Natures Reading of al-Ghazālī**
  *   **Awkward Commitment:** Creatures have real natures that demand effects, yet God retains the absolute power to suspend those natures at any moment.

  **Leaf 8: Aquinas's Instrumental Secondary Causation**
  *   **Awkward Commitment:** Created causes are real agents, but they operate only by a power borrowed from and sustained by a higher cause.

  **Leaf 9: Interventionist Account**
  *   **Awkward Commitment:** Causal claims are meaningless in contexts where human manipulation or intervention is impossible (e.g., cosmology).

  **Leaf 10: Unoccupied Position A (Nominalist Production)**
  *   **Awkward Commitment:** Causes transfer power and guarantee effects, but this transfer does not make the effect intelligible.
  *   **Diagnosis:** Merely unexplored; it is unclear why a transfer would fail to explain.

  **Leaf 11: Unoccupied Position B (Contingent Rule-Bound Powers)**
  *   **Awkward Commitment:** Causes have intrinsic powers, but the connection to their effects is governed by a standing rule rather than the nature itself.
  *   **Diagnosis:** Unattractive; it posits natures that do not ground their own operations.

  ---

  ## IV. ANNOTATIONS & DISPUTES

  **Inseparable Leaves**
  *   **Leaf 7 (Ghazālī) and Leaf 8 (Aquinas):** These positions are separated only by Node 8 (Essential vs. Instrumental). If a student views "created nature" and "instrumental cause" as functionally identical, they will land on the same leaf.
  *   **Extra Question Needed:** "Does the cause act *in virtue of* its own form, or *in virtue of* the principal agent's motion?"

  **Merely Verbal Disputes**
  *   **Malebranche vs. Ash'arite:** The dispute over whether God acts by "general volitions" or "particular volitions" often collapses into a disagreement about how to describe divine simplicity rather than a difference in causal structure.
  *   **Lewis vs. Armstrong:** The disagreement over whether laws are "relations between universals" or "best system regularities" frequently yields identical predictions for all physical cases, differing only in metaphysical labeling.
