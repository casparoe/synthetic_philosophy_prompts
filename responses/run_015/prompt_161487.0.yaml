answer: |-
  ### Competing Rules of Referral

  Based on the track record, three distinct principles explain the Referral Committee's past decisions equally well. Each yields a different prediction for the new package.

  **1. The Constitutive Mechanics Rule**
  *   **Principle:** Any measure altering the fundamental machinery of democracy (electoral systems, amendment formulas, sovereignty transfers, or the definition of the electorate) requires direct popular authorization, regardless of legislative consensus.
  *   **Fit:** Explains all *Referred* cases (amendment formula, electoral system, term limits, treaty sovereignty). Explains *Not Referred* cases as non-constitutive (languages are administrative; nuclear siting is technical; emergency suspension was temporary).
  *   **Prediction:** **Refer the entire package.** Both limbs alter constitutive mechanics: Limb (i) redefines the sovereign electorate; Limb (ii) alters the representation structure. The package is **indivisible** because both limbs concern the integrity of the electoral system; splitting them would risk passing one constitutive change without the other's balancing effect.

  **2. The Legitimacy Deficit Rule**
  *   **Principle:** Referral is triggered only when legislative authority is compromised by self-dealing, deadlock, lack of consent, or uncertainty. A supermajority consensus (4/5) coupled with cross-party negotiation cures the deficit, making referral unnecessary.
  *   **Fit:** Explains *Referred* cases as instances of deficit (deadlock on assisted dying; self-interest risk on term limits/electoral system; sovereignty uncertainty on treaty). Explains *Not Referred* cases as having cured the deficit (4/5 consensus on languages; municipal consent on nuclear; automatic lapse on emergency).
  *   **Prediction:** **Do not refer.** The 4/5 cross-party consensus mirrors the *Languages* precedent, curing any legitimacy deficit. Limb (ii) specifically *removes* a conflict of interest (redistricting), negating the self-dealing concern seen in the *Term Limits* referral. Limb (i) is a rights expansion, not a self-serving entrenchment. The package is **indivisible** only politically; legally, the Committee could sever them, but under this rule, neither triggers referral.

  **3. The Permanence Constraint**
  *   **Principle:** Referral is required for permanent or entrenched changes but waived for temporary, self-limiting, or reviewable measures.
  *   **Fit:** Explains *Not Referred* emergency suspension (lapsed automatically) and *Not Referred* nuclear siting (specific instance, not systemic rule). Explains *Referred* cases as permanent structural shifts (amendment formula, electoral system, treaty, assisted dying statute).
  *   **Prediction:** **Refer the entire package.** Both limbs are explicit ("no sunset and no review clause"). This distinguishes the case from the *Emergency* non-referral. The package is **indivisible** because both limbs share the same permanent character.

  ### Best Prediction

  **Prediction:** The Committee will **Refer the package** (likely as an indivisible unit).

  **Reasons:**
  1.  **Constitutive Mechanics Trumps Consensus:** While the *Languages* precedent shows 4/5 consensus can avoid referral, that measure was administrative. The *Treaty* precedent shows that even a "comfortable pro-treaty majority" cannot bypass referral when sovereignty is transferred. Changing the voting age (Limb i) is a transfer of sovereignty from the current electorate to a redefined one. This is functionally identical to the *Amendment Formula* referral, which was referred presumably despite high legislative support (as amendment formulas usually require supermajorities).
  2.  **The Bootstrapping Problem:** Limb (i) presents a specific legitimacy hazard that Limb (ii) does not cure: the current electorate is authorizing a change that dilutes its own relative power by adding new voters. This is a classic "bootstrapping" issue that referendums are designed to resolve. The Committee cannot rely on the assembly's 4/5 vote because the assembly was elected by the *old* electorate to make rules for the *new* one.
  3.  **Permanence:** The explicit lack of a sunset clause distinguishes this from the *Emergency* non-referral. The Committee treats permanent constitutional engineering as a matter for the constituent power (the people), not the constituted power (the assembly).

  **Closest Analog:**
  **Revision of the amendment formula.**
  Like the voting age change, revising the amendment formula changes the rules by which the people exercise their sovereign will. Both cases involve the legislature attempting to alter the definition or procedure of the sovereign itself. In both instances, legislative consensus is insufficient because the legislature is deriving its authority from the very rules it seeks to change.

  ### Underdetermination Assessment

  **Yes, the record underdetermines the case.**
  The tension between the *Languages* precedent (4/5 consensus = no referral) and the *Treaty/Amendment Formula* precedents (structural change = referral) is unresolved. We have no prior case where a **constitutive change** was passed with a **4/5 supermajority**.
  *   If *Consensus* trumps *Structure*, the Committee should not refer.
  *   If *Structure* trumps *Consensus*, the Committee must refer.
  The *Treaty* case suggests Structure wins, but the majority there was only "comfortable," not the 4/5 seen in *Languages*. The Committee has never explicitly ruled on whether a 4/5 vote can legitimize a constitutive change without a referendum.

  ### Distinguishing Case

  To cleanly separate the **Constitutive Mechanics Rule** from the **Legitimacy Deficit (Consensus) Rule**, the Committee would need to adjudicate:

  **A 4/5 legislative vote to change the parliamentary quorum required to pass ordinary legislation.**

  *   **Why this separates the rules:**
      *   **Constitutive Mechanics:** Changing the quorum is a fundamental rule of legislative procedure (constitutive). If this rule dominates, the measure **must be referred**.
      *   **Legitimacy Deficit:** A 4/5 vote indicates overwhelming consensus and no self-dealing deficit (unlike term limits). If this rule dominates, the measure **should not be referred**.
      *   **Permanence:** Assuming the quorum change is permanent, the *Permanence Constraint* would align with the Constitutive Rule.

  If the Committee refers this quorum change, it confirms that the *nature of the change* (constitutive) overrides legislative consensus. If it does not refer, it confirms that *supermajority consensus* cures the need for referral even on structural matters.
