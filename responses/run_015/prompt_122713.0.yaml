      *   **Friend's Theory:** Work has intrinsic value for the worker/human element, regardless of output efficiency.
      *   **User's Skepticism:** If work's intrinsic value is the reason, why don't we ban self-checkouts or ATMs? Why the inconsistency?
      *   **Specific Questions:**
          1.  What does HITL presuppose about work/jobs?
          2.  Can an efficiency/accuracy-focused person justify HITL (accountability, trust, blame)?
          3.  Is HITL inconsistent with autopilot/automation? Is there a unifying theory?
