          *   *Meditation III:* The proof of God relies on the causal adequacy principle. The idea of God must be caused by something with at least as much formal reality. The *mind* possessing the idea must be a substance with a certain degree of reality to serve as the locus of the idea. If the mind is just a fleeting event, the causal chain gets murky.
          *   *Meditation VI (Real Distinction):* This absolutely requires substances. You can't have a "real distinction" between two modes or events in the same way you do between two substances. Descartes needs the mind to be capable of existing *without* the body. A fleeting event can't exist independently in that sense.
