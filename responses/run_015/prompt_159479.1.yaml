answer: |-
  Consider an agent who, through a momentary lapse of attention, causes a structural failure that triggers a generational chain of poverty and injury, where each victim's inability to thrive compounds the total suffering far beyond the original negligence. The mechanism is causal accrual: the moral residue of the act does not remain static but spreads along the consequences it set in motion, creating a debt that grows exponentially as downstream harm accumulates without intervention. When the agent, now elderly and psychologically discontinuous with their past self due to memory loss and character change, endures a brutal decline, the karmic picture asserts this suffering is the necessary counter-weight to resolve the accumulated causal debt, regardless of proportionality to the original intent. The identity-sensitive retributivist must deny desert here, arguing that the present person is not the moral author of the past act and cannot owe a debt they neither intended nor could foresee. The gap opens because the karmic mechanism binds the obligation to the trajectory of the harm itself rather than the continuity of the agent, assigning the burden to the locus where the causal chain resolves even if the psychological link is severed.

  **Show the Work**

  *   **The Verdicts:** The karmic picture says **Yes**, she deserves this suffering because it is the requisite equilibrium point for the accumulated harm. The identity-sensitive retributivist says **No**, because desert requires a continuous moral agent, and the psychological break severs the link between the wrongdoer and the sufferer.
  *   **The Key Feature:** **Psychological discontinuity amidst causal continuity.** The case works only because the *harm* flows uninterrupted while the *self* does not.
  *   **Deleting the Feature:** If you restore psychological continuity (she remembers and is the same character), the case collapses into **ordinary retribution** (both agree she deserves punishment). If you delete causal compounding (the harm stays static), the surplus desert vanishes; karma becomes either **pure bookkeeping** (act-for-act) or, if the suffering still exceeds the act, **arbitrary fate** without moral justification.
  *   **The Karma Defense:** The strongest defense is **ontological**: the "self" is an illusion, so psychological continuity is irrelevant; only the causal stream of consciousness exists, and *it* bears the debt regardless of where the "personhood" boundaries are drawn.
  *   **The Conclusion:** "It was her karma" is a **causal claim wearing desert's clothes**. It uses the language of moral owing ("deserve") to describe a mechanism of naturalistic balance ("causal resolution") that operates independently of the moral conditions (agency, identity, foresight) required for desert to make sense.
