          *   *Crux:* Silent Features (defaults/latency).
          *   *His Phrasing:* Silent features are hidden politics, more potent because they are invisible.
          *   *My Phrasing:* Silent features are only political when noticed and contested.
          *   *Test:* A timeout setting vs. a locked gate.
          *   *Predictions:* He says timeout is equally political; I say timeout is only political if someone tries to beat it.

          *   *Crux:* The Swap Test Result.
          *   *His Phrasing:* If the effect disappears with a swap, the politics was in the specific design choices.
          *   *My Phrasing:* If the effect survives a swap, the politics was in the system requiring the function.
          *   *Test:* Replace fountain with a bucket station.
