      *   *Push-button fountain:* Designed for water saving, excludes homeless/riders/elderly. Physical design dictates usage. Suggests politics in the build (Friend's side), but who stops using it depends on who is there (User's side).
      *   *Swap Test:* Replace artifact with cheapest alternative. If effect survives, politics wasn't in the artifact. If it disappears, it was. (This is a methodological test).
