      *   **Positions:**
          *   Friend ("He"): Politics is *in the thing* (artifacts carry political effects in their build).
          *   User ("I"): Politics is *in the relations* (politics is in the social setup, object is just a place it shows up).
      *   **Constraints:**
          *   Work *only* from the provided invented cases (48-hour hold, workaround nobody takes, push-button fountain, swap test, loud vs. silent features).
          *   No reading lists or quotes (paraphrase classics if needed, but focus on cases).
          *   Format: Numbered section of agreed claims + Disagreements Table (Crux, His Phrasing, My Phrasing, Concrete Case/Test, Predictions).
