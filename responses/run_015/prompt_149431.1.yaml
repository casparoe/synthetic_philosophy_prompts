answer: |-
  Beauty sleeps in a standard laboratory. A fair coin is tossed. Heads: she wakes Monday only. Tails: she wakes Monday and Tuesday. Amnesia erases memory of prior awakenings. Upon any awakening, she meets Experimenter A and Experimenter B. Both offer a ticket costing $c$ that pays $1 if the coin landed Tails. Rule A (Per-Awakening): Every acceptance incurs cost $c$ and yields $1 if Tails. Rule B (Single-Execution): In each world, exactly one acceptance is randomly selected to count; others are void with no cost. She knows both rules, faces both offers simultaneously, and cannot hedge between them.

  **Arithmetic**
  Assume Beauty adopts the strategy "Accept All."
  For Bet A: In Heads (1 awakening), she pays $c$, receives 0. Net: $-c$. In Tails (2 awakenings), she pays $2c$, receives $2$. Net: $2 - 2c$.
  Expected Utility (EU) = $0.5(-c) + 0.5(2 - 2c) = 1 - 1.5c$.
  Break-even price: $1 - 1.5c = 0 \Rightarrow c = 2/3$.

  For Bet B: In Heads (1 awakening), she pays $c$, receives 0. Net: $-c$. In Tails (2 awakenings), protocol selects one acceptance. She pays $c$, receives $1$. Net: $1 - c$.
  EU = $0.5(-c) + 0.5(1 - c) = 0.5 - c$.
  Break-even price: $0.5 - c = 0 \Rightarrow c = 1/2$.

  **Argument**
  Standard betting arguments assume price reveals credence. The Halfer assigns $P(\text{Tails}) = 1/2$; the Thirder assigns $P(\text{Tails}) = 2/3$. In this scenario, Beauty faces identical evidence at a single moment yet rationally prices the same proposition at 1/2 for Bet B and 2/3 for Bet A. No single credence function rationalizes both prices under standard norms. The divergence is generated solely by payoff indexing: Bet A settles per awakening (frequency-weighted), while Bet B settles per world (outcome-weighted). Betting rates track the administrative structure of the bet, not the agent's doxastic state.

  **Ablations**
  First, equalize the indexing. If both bets follow Rule A, both prices become 2/3. If both follow Rule B, both prices become 1/2. The divergence collapses when indexing is uniform. Second, equalize the awakenings. Modify the protocol so Heads yields one awakening and Tails yields one awakening. Under Rule A, costs and payoffs scale identically to Rule B. Both prices become 1/2. The divergence requires both multiple awakenings and distinct indexing rules.

  **Objection and Reply**
  Objection: In Bet B, only one choice per world matters. The Halfer should conditionalize on the proposition "This choice is binding." Given standard Halfer priors ($P(H)=1/2, P(T)=1/2$), and likelihoods ($P(\text{Binding}|H)=1, P(\text{Binding}|T)=1/2$), this yields $P(H|\text{Binding}) = 2/3$ and $P(T|\text{Binding}) = 1/3$. If credence is 1/3, the fair price is 1/3, not 1/2. Your EU derivation ignores this evidential update.

  Reply: This conditionalization is incorrect. "This choice is binding" is not independent evidence about the coin; it is a consequence of the betting protocol coupled with the awakening schedule. The EU calculation $0.5(1-c)$ for Tails already accounts for the probability of execution. To conditionalize is to double-count the protocol's filtering, treating the administrative rule as evidence about the world state. If the Halfer conditionalizes, she rejects a bet with zero expected loss (at $c=1/2$), leaving money on the table. The Halfer must concede that in index-sensitive cases, betting rates diverge from credence.

  **Conclusion**
  This case demonstrates that betting rates reflect the indexing of payoffs to temporal stages, not the agent's credence in the underlying proposition.
