  2.  **Philosophical Analysis:**
      *   **Humeanism (Supervenience):** Laws supervene on the mosaic. Same mosaic = same laws. So, a Humean *cannot* accept the Overspill setup (same mosaic, different laws).
      *   **Anti-Humeanism (Necessitarianism/Relations among Universals):** Laws do *not* supervene on the mosaic. Same mosaic *could* have different laws (though typically, if the laws are different, the mosaic *would* eventually diverge unless the laws are empirically equivalent). Armstrong/Dretske/Tooley view laws as relations between universals (N(F,G)).
      *   **Governing:** Anti-Humeans often use the metaphor of "governing," but this is usually modal (necessitation), not causal/force-like. Laws don't *push* things; they explain *why* things move as they do. They are not extra forces.
      *   **Perceivability:** If the mosaic is identical (same particles, same trajectories), there is *no* empirical difference. A character inside the world cannot perceive the difference in laws if the outcomes are identical. "Nomic drag" implies a deviation in the mosaic (strain, hesitation = different particle positions/momenta), which contradicts the "same mosaic" premise.
      *   **Breaking a Law:** On most views (Humean or Anti-Humean), laws are not prescriptive rules that can be disobeyed. They are descriptive (Humean) or constitutive/necessitating (Anti-Humean). To "break" a law usually means doing something nomologically impossible. If you do it, it wasn't a law (Humean) or you've entered a realm of impossibility (Anti-Humean). Some views (e.g., Cartwright, or certain theological views) allow for miracles/interventions, but standard metaphysics treats laws as holding necessarily (given the universals).
      *   **Nomic Drag:** This implies laws are forces. This is a category mistake in standard metaphysics. Laws describe forces; they aren't forces themselves.
      *   **Alternatives:**
