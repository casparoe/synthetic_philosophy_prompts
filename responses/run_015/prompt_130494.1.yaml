  7.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the student reading (nativist parable) but state the thesis: The play supports the "Speed" argument but fails on "Underdetermination" and "Degeneracy" because Annie's input is artificially rich.
