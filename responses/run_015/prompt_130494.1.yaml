      *   *Entitlement:* Is it entitled? The leap from "this is water" to "everything has a name" is the real jump. The play glosses the mechanism. It dramatizes the *realization of symbolism*, which is closer to the nativist "parameter setting" than simple conditioning, but it rests on empiricist concept formation.

  6.  **Analyze Theatrical Architecture vs. Philosophical Suggestion:**

      *   The play links *discipline* (behavior) with *language*. The breakfast scene (folding napkin, using spoon) is a prerequisite for the well-house.
