      *   **Methodology:** Work from memorable scenes (finger-spelling, doll smashing, breakfast fight, garden house, well-house). Avoid citations/library references. Write as continuous prose. Commit to verdicts.
      *   **Tone:** Critical, not a survey, not a defense of nativism. Acknowledge the melodramatic/theatrical elements.
      *   **Closing:** What does the play add to the debate that abstract argumentation doesn't? (Inner life, rhetoric of poverty, etc.)

  2.  **Deconstruct the Three POS Claims vis-à-vis the Play:**

      *   *Claim 1: Underdetermination (Grammar not settled by data).* Does the play show Helen inferring rules she wasn't taught? Not really. The play focuses on *reference* (naming), not syntax or grammar. The "explosion" implies a system, but we don't see the grammatical inference. *Verdict:* Silent/Irrelevant.
      *   *Claim 2: Speed/Uniformity.* The play emphasizes the *speed* of the breakthrough (one day at the pump, rapid questioning afterwards). It implies a uniform potential (she catches up fast). *Verdict:* Supports this claim strongly, dramatizes the "switch."
      *   *Claim 3: Degeneracy (Input lacks structure).* Annie's input is highly structured (finger spelling into hand). It's not "degenerate" in the Chomskyan sense (no false starts, no noise, just word-object pairs). *Verdict:* Contradicts this claim. The input is artificially enriched.

  3.  **Analyze the Channel-vs-Structure Distinction:**

      *   Helen's input is *channel-impoverished* (no sound, no sight, one finger channel) but *structurally enriched* (Annie forces isolation, consistency, immediate association).
      *   For Claim 1 (Underdetermination): Silent.
      *   For Claim 2 (Speed): The structural enrichment explains the speed, undermining the need for innate structure.
      *   For Claim 3 (Degeneracy): The input is *not* degenerate; it's hyper-clean. The play hides this by framing it as a "miracle" rather than a pedagogical triumph.

  4.  **Analyze the Counterfactual (Deaf-blind from birth):**

      *   *Helen:* 19 months normal + 5 years darkness/silence. She has concepts (water, doll, mother) before language.
      *   *Counterfactual:* No concepts, no sensory data.
      *   *Nativist Expectation:* If language faculty is innate, the counterfactual child should still acquire language if the "switch" is flipped, but might lack the *semantic content* to map onto. However, strict nativism (UG) cares about grammar, not concepts. So, grammar should emerge, but meaning might be harder.
      *   *Empiricist Expectation:* Without the 19 months of sensory data, there are no concepts to label. The pump scene works *because* she knew water. A birth-deaf-blind child would have no "cool stuff" concept. Acquisition should be much slower or impossible without concept formation first.
