  9.  **Self-Correction during drafting:**
      *   *Check:* Did I make Kalth's accumulation unintended? Yes, must emphasize they save because spending is sinful vanity, not because they want to invest.
      *   *Check:* Did I make Merien's consumption rational? Yes, spending proves success.
