      *   **Conclusion:** The philosophical ambiguity. Did the belief cause the result, or did the result hijack the belief?
      *   **Final Line:** "Verdict: ..."

  5.  **Drafting - Section by Section:**

      *   *Setting the Scene:* Establish the identical nature of the islands. The Great Divide (storm).
      *   *Elara on Kalth:* Focus on the ritual. The "Ledger of Souls". Work is penance. Saving is not for wealth, but to avoid the sin of waste. If you earn, you must not spend. Therefore, capital grows. But you cannot lend for interest (usury)? No, the prompt says "credit networks". So, lending must be framed as "stewardship" not "profit".
