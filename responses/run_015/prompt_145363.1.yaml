      *   *The Twist/Realization:* Torin realizes Kalth is rich but lives poorly. Merien is poor but lives richly (in the moment). Kalth's economy is robust *because* they don't care about the economy.
      *   *The Philosophical Core:* Elara knows the system creates wealth but calls it a test. Is the wealth caused by the test, or is the test a justification for the wealth? The story needs to leave this hanging but lean into the paradox.

  6.  **Refining the Weberian Inversion:**
      *   Weber: Religion -> Capitalism (unintended).
      *   Story: Kalth (Religion forbids profit) -> Capitalism (unintended). Merien (Secular profit motive) -> No Capitalism (due to lack of restraint).
      *   The key is the *mechanism*. Kalth's culture creates *trust* and *deferred gratification* without calling it economic strategy. Merien has the *strategy* but not the *discipline*.
      *   The philosophical problem: If the Kalthians deny the economic motive, can we say their "culture" caused the economy? Or did the economic necessity shape the culture to deny it? The story should show Elara struggling with this. She sees the wealth but must deny its value.

  7.  **Writing - Tone and Style:**
