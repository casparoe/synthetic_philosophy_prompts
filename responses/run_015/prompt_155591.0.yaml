  One man keeps faith and bears the whip of shame,
  Condemned by all who judge the outer show.
  Though just at heart, he wears the guilty name,
  And reaps the hate that only guilt should know.
  The other steals yet walks in honor's light,
  Praised for the virtues that he never bred.
  He sleeps in peace while hiding wrong from sight,
  And wears the just man's crown upon his head.
  But when the deed is done and stays unseen,
  The tie that binds a promise true is broke.
  For trust requires a witness to have seen,
  And love dies where the word is never spoke.
  Strip off the witness and the threat of blame,
  Does virtue stand, or is it just a name?
