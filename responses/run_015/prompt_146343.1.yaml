      *   *Actually, the best critique is to point out that the Loaf analogy assumes the manifold exists.* A Presentist would reject the Loaf entirely.
      *   *Suggestion:* The "Flashlight in a Void" vs. "Lit Room."
          *   Eternalism: Room is lit.
