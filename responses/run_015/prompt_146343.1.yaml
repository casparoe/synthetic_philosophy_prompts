      *   *Nuance:* Presentists have responses (Lorentzian Ether, Neo-Lorentzian views, or rejecting SR's ontological implications). So it doesn't "collapse" logically, but it becomes empirically indistinguishable from Eternalism + a hidden frame, which hurts its scientific credibility.
      *   *Analogy's Role:* The analogy makes the "hidden frame" look absurd (secret control room). Is that fair? Yes, insofar as science dislikes undetectable structures. No, insofar as metaphysics might allow brute facts.

  6.  **Finding a Better Analogy:**
