  ***

  **Note on Philosophical Liberties and Contested Interpretations**

  This poem dramatizes the "Wrong Kind of Reasons" (WKR) problem as it applies to doxastic norms, contrasting evidentialism with pragmatic encroachment. Several simplifications are necessary for the form:

  1.  **The Nature of Pragmatic Reasons:** The second refrain ("Yet stakes provide reasons evidence cannot find") characterizes the pragmatist position as claiming stakes are *reasons for belief*. Some proponents of pragmatic encroachment (e.g., Stanley, Fantl & McGrath) argue instead that stakes affect the *conditions* for knowledge or justification without necessarily constituting reasons for belief itself. Others (e.g., Reisner) argue explicitly for pragmatic reasons for belief. The poem adopts the stronger claim to create a direct conflict with the evidentialist refrain.
  2.  **Transparency and WKR:** The first refrain ("Transparency makes belief leave gain behind") relies on the thesis that belief's transparency to truth (asking "Is P true?" rather than "Should I believe P?") entails that non-evidential considerations cannot be reasons for belief (a view associated with Shah & Velleman). This is contested; some argue transparency is compatible with pragmatic reasons, or that transparency does not fully capture belief's normativity.
  3.  **Settled vs. Contested:** It is broadly settled in the literature that there is a meaningful distinction between reasons that engage an attitude's constitutive aim (evidence for belief) and those that do not (pragmatic benefits). What remains genuinely contested is whether belief has exactly one such aim (truth) and whether practical stakes can ever constitute normative reasons for belief rather than merely causal influences or conditions on action. The poem's closing quatrain reflects this lack of consensus.
