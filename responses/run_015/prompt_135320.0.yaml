e no wrong-kind reasons for belief at all. In that note, distinguish what is broadly settled (that there is a meaningful distinction between reasons that engage an attitude's constitutive aim and those that do not) from what remains genuinely contested (whether belief has exactly one such aim, and whether practical stakes can ever constitute reasons for belief rather than only causes of it). Do not present any contested view as the consensus.
