answer: |-
  ### I. The Mapping

  **Outcome, Interval, and Population**
  Luck egalitarianism (LE) takes the relevant outcome to be the distribution of advantage (welfare, resources, or capabilities) net of responsible choice. In the Katrina context, the outcome is not merely post-storm wealth, but *security of person and baseline capability*. The interval is theoretically the lifetime, but operational policy forces a time-slice assessment (the disaster episode). The population is not "New Orleans" but the specific subset who remained, treated not as a monolith but as distinct moral cases based on the etiology of their exposure.

  **Subgroup Analysis**
  1.  **No car/cash/nowhere to go:** LE classifies this as brute bad luck. Poverty is a circumstance, not a choice. Their inability to evacuate is a deficit in initial endowment.
  2.  **Caregivers:** Staying to care for relatives is a choice, but one driven by special obligations. LE struggles here: is this an "expensive taste" for family duty, or a circumstance-imposed constraint? A sophisticated LE view treats binding moral obligations as circumstances that limit the option set. They are owed compensation for losses incurred due to duties they could not reasonably abandon.
  3.  **Prior false alarms/gridlock:** These agents updated priors based on state performance. If the state cried wolf previously, the risk assessment that led to staying is epistemically rational. The error lies in the environment (state reliability), making the resulting loss brute luck.
  4.  **Shelter safety judgment:** If the designated shelter (e.g., the Superdome) was objectively unsafe, staying was the risk-minimizing choice. The danger was a circumstance (state-provided infrastructure). If the shelter was safe and they misjudged, this is option luck (bad gamble).
  5.  **Stubbornness/Fatalism/Bravado:** This is the core case for option luck. These agents had viable alternatives and chose to gamble on the levees or the storm's path. They bear responsibility for the downside.

  **Policy Implications**
  *   **Rescue Priority:** LE is silent on urgency. It is a comparative metric, not a triage protocol. However, if forced to allocate scarce rescue resources, strict LE implies prioritizing those in subgroup 1 (brute luck) over subgroup 5 (option luck). Saving the imprudent first would subsidize their gamble at the expense of the prudent who evacuated.
  *   **Emergency Relief:** Immediate food/water/shelter. LE implies a split track. Subgroups 1–4 receive aid as of right (compensation for circumstance). Subgroup 5 receives aid only if denying it would leave them below a baseline necessary for future equality (a "floor" constraint), or not at all. In practice, LE cannot distinguish these groups in the fog of war, forcing a universal provision that LE theoretically rejects for the imprudent.
  *   **Compensation:** For property loss. Subgroups 1–4 are owed full restitution to pre-storm levels. Subgroup 5 is owed nothing; they gambled assets and lost. To compensate them is to tax the prudent (who evacuated and perhaps secured their homes) to pay for the imprudent's risk-taking.
  *   **Rebuilding Subsidies:** This is forward-looking. If the flood was caused by federal levee failure (brute luck for all residents), compensation is owed to all, including subgroup 5, for the *infrastructure failure*. However, subsidies to *rebuild* in a floodplain are different. LE opposes subsidizing future risk-taking. It would support rebuilding only if risk is mitigated (new levees). If individuals choose to rebuild without mitigation, LE denies subsidy.

  **Where LE Implies Nothing**
  LE is not a theory of agency or duty. It does not generate the duty to rescue; it only judges the distribution of the rescue. It has no inherent account of *urgency*; a life lost today is weighted the same as a life lost next year in a lifetime accounting. Crucially, LE treats the state as the redistributor, not necessarily the tortfeasor. It does not inherently capture the *political* responsibility of the Army Corps of Engineers for the levees unless that failure is folded into the citizens' "circumstances." LE evaluates the victim's responsibility, not the state's negligence, unless the state's negligence is reclassified as a brute luck deficit for the citizen.

  ### II. Structural Problems

  **1. The Temporal Unit**
  Katrina exposes an unmarked parameter in LE: the accounting period.
  *   **Episode Assessment:** If we assess justice over the week of the storm, the distinction between the stubborn (subgroup 5) and the stranded (subgroup 1) is sharp. The former are owed less; the latter are owed more.
  *   **Lifetime Assessment:** If we assess over whole lives, the catastrophe swamps the choice. Losing one's home, community, and health creates a deficit so large that it likely cannot be offset by prior prudence. A lifetime LE view might demand generosity to subgroup 5 simply to restore their lifetime trajectory to parity with others.
  *   **The Problem:** LE does not specify which unit is correct. The theory demands lifetime equality but requires time-slice policies for implementation. Nothing internal to the view settles whether a disaster is a "slice" to be judged on its own choices or a "shock" to be absorbed into the lifetime ledger. If the latter, the choice/circumstance cut blurs, because the magnitude of the brute luck (the storm) overwhelms the magnitude of the option luck (the decision to stay).

  **2. Entanglement**
  The choice/circumstance distinction presupposes that options are exogenous to the agent's circumstances. Katrina shows they are endogenous.
  *   **Shaped Choices:** For subgroup 1 (no car), the "choice" to stay was not a preference for risk but a lack of alternatives. But for subgroups 3 and 4 (false alarms, bad shelters), the choice was shaped by *prior state failure*. When the state creates a history of false alarms or provides degraded shelters, it alters the rationality of the choice to stay.
  *   **The Author of the Option Set:** The institution allocating aid (the state) is also the author of the option set (the evacuation plan, the levees, the shelters). If the state presupposes private vehicles for evacuation, it constructs an option set where "evacuate" is effectively unavailable to the poor. LE asks: "Did the agent choose responsibly?" But if the state rigged the options such that the "responsible" choice was impossible or excessively costly, the distinction collapses. You cannot track option luck when the option set itself is a product of brute luck (state negligence). The state cannot simultaneously be the referee of responsibility and the architect of the constraints that determined the choices.

  ### III. Verdict and Patch

  **Verdict**
  Katrina is not an anomaly for luck egalitarianism, but it is a **stress test that sharpens the abandonment objection.**
  In ordinary distribution (taxes, healthcare), denying aid to the imprudent is abstract. In a disaster, denying aid to the "stubborn" means letting them drown or starve. The emergency setting removes the buffer of time and money, making the consequence of LE's judgment immediate and mortal. This does not disprove LE, but it reveals that LE is ill-equipped to handle *acute* scarcity where the cost of responsibility-tracking is human life. It confirms that LE is a theory of *structural* justice, not *emergency* ethics. It was built to anticipate chronic inequality, not catastrophic discontinuity.

  **The Minimal Patch**
  To speak to this case, LE requires a **Lexicographical Humanitarian Constraint.**
  *   **The Addition:** In acute emergencies where basic survival is at stake, the choice/circumstance distinction is suspended. All agents are treated as victims of brute luck for the duration of the rescue and immediate relief phase. Responsibility tracking is deferred to the reconstruction and compensation phase.
  *   **The Mechanism:** Survival is a precondition for agency. You cannot hold someone responsible for choices if they are dead. Therefore, the "currency" of LE (advantage) must be secured before the "metric" of LE (responsibility) is applied.
  *   **The Cost:** This concession admits that responsibility is not the *sole* determinant of entitlement. It introduces a non-egalitarian, sufficientarian floor that trumps egalitarian justice. It weakens the theoretical purity of the view by acknowledging a duty to rescue that is independent of the victim's moral record. It concedes that there are times when justice requires treating the imprudent *as if* they were victims of brute luck, not because they are, but because the alternative is morally intolerable. This creates a dual-track theory: humanitarianism for the acute, luck egalitarianism for the chronic.
