answer: |-
  Dear Colleague,

  It is a genuine pleasure to engage with the difficulty you have crystallized regarding Dennett's distinction between cranes and skyhooks, particularly as it pertains to the teleosemantic project. You have put your finger on precisely the nerve where naturalistic philosophy of mind often feels the most strain, and I suspect that the tension you perceive is not merely a misunderstanding on your part nor a simple ambiguity in Dennett's framework, but rather the central friction point where the rubber of evolutionary theory meets the road of intentional normativity. To navigate this, we must first recall that for Dennett, a crane is not simply a reductionist tool but a constructive mechanism capable of lifting heavy explanatory loads without recourse to miracles, whereas a skyhook is a purported explainer that itself hangs from nothing and stops inquiry rather than advancing it. When Millikan, Papineau, and others propose that representational content is grounded in selection history, they are explicitly attempting to build a crane. They aim to show how the capacity for truth and falsity could be hoisted into existence by the blind, algorithmic process of natural selection, thereby avoiding the skyhook of an irreducible mental faculty or a divine guarantor of meaning.

  The crux of your confusion lies in whether this construction succeeds or whether it collapses into one of two failures: either it secretly relies on a skyhook by presupposing the normative notion of proper function, or it commits greedy reductionism by explaining away the normativity it sought to save. On the first count, the teleosemanticist would argue vigorously that proper function is not a skyhook because it is defined entirely by historical facts about reproduction and survival. If a heart pumps blood because ancestors who pumped blood survived, then the function is grounded in the causal history of the lineage, not in a mysterious normative realm. From this perspective, the normativity is biological rather than semantic or moral, and it is objective in the same way that a malfunctioning engine is objectively failing to perform the function for which it was designed, even if that designer is natural selection. However, your intuition that this might smuggle in a skyhook arises from the suspicion that biological function alone cannot bridge the gap to semantic content. To say a frog's neural state represents fly because it was selected for catching flies is one thing, but to say that state can be false in a way that matters for truth conditions seems to require a normative leap that history alone cannot provide. If the notion of proper function required to get semantics off the ground is not fully reducible to selection history, then indeed, a skyhook has been introduced under the guise of biology.

  This leads us to your second worry regarding greedy reductionism. Dennett defines greedy reductionism as the error of explaining away the phenomena we sought to understand rather than explaining them in terms of something else. If teleosemantics reduces misrepresentation to nothing more than a statistical deviation from a historical causal chain, have we not lost the normative force of error? Have we not turned a false belief into a mere malfunctioning switch, thereby leaving the mind out of the picture? Here, I believe Dennett would offer a nuanced defense that might alleviate some of your tension. He would likely argue that the normativity we care about is real but that its reality is not metaphysical; it is the reality of a pattern. For Dennett, intentions and norms are real patterns that emerge when systems become complex enough to be predicted from the intentional stance. The teleosemantic crane builds the physical substrate that makes the intentional stance viable. The normative force of error is not erased but is relocated. It is not a cosmic ought but a hypothetical imperative grounded in the system's design history. If the system is designed to track X, and it tracks Y, it is in error relative to its design. This is not greedy reductionism if one accepts that the design relation is objective, but it will feel like greedy reductionism to anyone who believes normativity requires a non-natural foundation.

  Therefore, the tension you feel likely reveals less about a flaw in Dennett's crane and skyhook distinction and more about the divergent intuitions philosophers hold regarding the nature of normativity itself. If one believes that genuine normativity must be sui generis and irreducible to causal history, then teleosemantics will inevitably look like greedy reductionism, because it attempts to derive the normative from the descriptive. However, if one accepts Dennett's broader pragmatism, where norms are tools for prediction and control that emerge from complex physical systems, then teleosemantics is a legitimate crane project. It does not rely on a skyhook because it does not posit an irreducible normative force; it posits a historical relation that generates normative assessments from the perspective of an interpreter or the system's own operational requirements. The confusion arises because we are tempted to think that for error to be real, it must be grounded in something stronger than biological history, but Dennett would argue that biological history is the strongest ground there is in a naturalistic world.

  Ultimately, I suggest that the teleosemantic project is genuinely attempting to use a crane, but it is building a structure that some critics feel is too weak to support the weight of full-blooded intentionality. Whether this counts as greedy reductionism depends on whether you believe the normative dimension of false belief survives the translation into historical terms. Dennett would say it does survive, transformed but intact, as a real pattern embedded in the physical world. Your students are right to feel the tension, for it marks the boundary where naturalism struggles to account for the space of reasons. It is not necessarily a failure of the framework but an indication of the profound difficulty of the task. The teleosemanticist claims to have built a crane high enough to reach the skyhook's job without being one, and while the structure may look precarious to those who demand a stronger foundation for normativity, it remains one of the most rigorous attempts to keep philosophy within the bounds of natural science. I hope this perspective helps clarify the landscape for you as you continue to guide your students through these dense but rewarding thickets.

  Warmly,

  Your Colleague
