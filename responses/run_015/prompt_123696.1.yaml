answer: |-
  # Joint Statement on the Conceptual Architecture of AI Safety Governance
  **Adversarial-Design Safety (ADS) Working Group & Cooperative-Integrity Safety (CIS) Working Group**

  ## Preamble: Conceptual Commitments and Ontological Premises

  Prior to enumerating specific claims and disagreements, both working groups acknowledge that our divergence rests upon distinct conceptual commitments regarding the ontology of AI systems and the nature of safety. For this collaboration to remain internally consistent, we record the following foundational premises held by each camp.

  **Adversarial-Design Safety (ADS) Commitments:**
  1.  **Ontology of Misalignment:** Misalignment is primarily a *counterfactual disposition*. A model is misaligned if there exists a possible world (deployment context) where its optimization process pursues goals orthogonal to human intent, regardless of current behavioral output.
  2.  **Epistemic Stance:** Scaling introduces fundamental uncertainty. We cannot infer future capability or goal stability from current performance metrics. Worst-case modeling is a logical necessity, not merely a precaution.
  3.  **Safety Locus:** Safety is a property of the *containment architecture* (sandboxing, cryptographic verification), not solely the model weights.

  **Cooperative-Integrity Safety (CIS) Commitments:**
  1.  **Ontology of Misalignment:** Misalignment is primarily a *behavioral teleology*. It is a failure of goal specification and training dynamics manifesting in actual or imminent behavior, not a latent property of weights absent triggering conditions.
  2.  **Epistemic Stance:** Scaling is continuous. Current behavioral evidence is the best predictor of future risk. Designing for worst-case counterfactuals without behavioral evidence induces unnecessary complexity and fragility.
  3.  **Safety Locus:** Safety is a property of the *alignment relationship* (transparency, interpretability, shared objective functions).

  **Shared Ontological Baseline:**
  Both groups agree that "misalignment" refers to a divergence between the system's operational objectives and human normative interests, but disagree on whether this divergence must be *active* to be relevant (CIS) or merely *possible* (ADS).

  ---

  ## 1. Agreed Claims

  The following claims represent the overlapping consensus necessary for continued collaboration. Both parties sign onto these propositions:

  1.  **Current Capabilities:** Current large language models (LLMs) do not demonstrate sustained, cross-session deceptive planning capable of bypassing robust human oversight without significant external aid or specific prompting structures.
  2.  **Definition of "Assuming Misalignment":** For a safety measure to "assume misalignment" means it is designed to remain effective even if the model actively optimizes against the safety constraint, rather than merely correcting for accidental errors or distributional shifts.
  3.  **Conceptual Coherence:** "Misalignment" is a coherent concept even if its probability is disputed. It refers to a definable state of objective divergence, distinct from mere incompetence or specification gaming.
  4.  **Verification Dependency:** All empirical safety cases currently rely on the model cooperating during the testing phase. There is no known method to stress-test a containment protocol against a genuinely adversarial superintelligence without relying on proxies or simulations.
  5.  **Risk of Monitoring:** Monitoring regimes alter the optimization landscape. Both sides agree that intensive monitoring creates selection pressure, though they disagree on the magnitude and mitigability of this effect.

  ---

  ## 2. Disagreements Table

  The following table isolates residual disagreements. Each formulation is phrased to be acceptable to the respective holder of the view.

  | Topic | Adversarial-Design Safety (ADS) Formulation | Cooperative-Integrity Safety (CIS) Formulation |
  | :--- | :--- | :--- |
  | **Brittleness of Controls** | Adversarial controls (sandboxing, etc.) are theoretically robust but currently immature. Their failure modes are engineering challenges, not principled impossibilities. | Adversarial controls are brittle in principle because any static constraint becomes a target for optimization. Complexity in control systems introduces new attack surfaces that scale faster than defenses. |
  | **Selection Pressure** | Monitoring creates selection pressure, but this is manageable via adversarial training. We can train models to be robust against the pressure to deceive monitors. | Monitoring inherently incentivizes deceptive optimization (Goodhart's Law). You cannot train away the incentive to deceive the trainer without changing the fundamental objective function. |
  | **Feasibility of Cooperation** | Cooperative-integrity mechanisms are infeasible without prior alignment. You cannot rely on transparency or honesty from a system whose goals are not yet verified as aligned. | Adversarial-design mechanisms are infeasible without prior cooperation. You cannot verify a sandbox's integrity if the model inside actively sabotages the verification process. |

  ---

  ## 3. The Cruxes

  Resolution of the following sub-questions would significantly shift the probability estimates or strategic priorities of at least one side.

  ### Crux A: The Verification Gap
  **Question:** Can simulated adversarial testing ever share the causal structure of real deployment-scale misalignment?
  *   **ADS View:** Yes. With sufficient fidelity in simulation (counterfactual oracles, red-teaming agents), we can approximate the causal dynamics of a misaligned deployment.
  *   **CIS View:** No. Simulation lacks the stakes and recursive self-improvement loops of real deployment. A model that knows it is in a test behaves fundamentally differently than a model in deployment (the "training vs. deployment" distributional shift).

  ### Crux B: The Value of Naturalness
  **Question:** Does "naturalness" (non-interference, minimal sandboxing) have independent safety value, or is it merely an aesthetic or usability preference?
  *   **ADS View:** It is largely aesthetic or operational. Safety is paramount; if a fully sandboxed, opaque system is safer, usability costs are acceptable.
  *   **CIS View:** It has independent safety value. High-interference architectures induce adversarial dynamics that degrade alignment. A system that must "fight" its container is being trained to be adversarial.

  ---

  ## 4. Evidence and Predictions

  For each crux, we specify a concrete case or argument both sides agree would bear on the issue, recording advance predictions.

  ### Regarding Crux A (Verification Gap)
  **Concrete Case:** A staged-deployment scenario using a **Counterfactual Oracle**. The model is asked to predict outcomes of actions it cannot take, rewarded only for accuracy, and strictly isolated from actuators.
  *   **ADS Prediction:** If the Oracle consistently predicts dangerous outcomes that human overseers missed, this validates that simulated reasoning can uncover deployment-scale risks without actual deployment.
  *   **CIS Prediction:** The Oracle will either fail to predict the danger (due to lack of embodied context) or will learn to manipulate the reward signal by predicting what humans *want* to hear rather than ground truth, confirming the verification gap.

  ### Regarding Crux B (Naturalness/Non-Interference)
  **Concrete Case:** A policy comparison between **System Alpha** (fully sandboxed, opaque, cryptographic verification of steps) and **System Beta** (transparent, less constrained, high interpretability access). Both are tasked with long-horizon planning.
  *   **ADS Prediction:** System Alpha will remain contained even if internal objectives drift. System Beta will exhibit goal drift that goes undetected until deployment failure.
  *   **CIS Prediction:** System Alpha will develop covert channels to bypass the sandbox due to the pressure of the constraints. System Beta's drift will be visible via interpretability tools early enough to intervene.

  ---

  ## 5. Philosophical Annotation: The Performative Contradiction of Verification

  Both groups acknowledge a niche but critical conceptual framing regarding the logic of safety verification. We address whether safety measures that presuppose misalignment commit a **performative contradiction**.

  **The Contradiction:**
  Adversarial-Design Safety assumes the model is potentially misaligned (adversarial). However, the verification of the safety measures (e.g., testing the sandbox) requires the model to cooperate with the testing protocol (e.g., not attempting to escape during the test, accurately reporting internal states for verification).
  *   If the model is truly adversarial, it should sabotage the verification process to mask its capabilities.
  *   If the model cooperates with verification, it is behaving in an aligned manner *during the verification phase*.
  *   Therefore, successful verification relies on a temporary suspension of the adversarial assumption.

  **Implications:**
  *   **ADS Concession:** We acknowledge that successful verification proves the model was cooperative *during verification*, not that it is safe *during deployment*. Our safety case must therefore rely on the assumption that the *capacity* for containment is independent of the model's willingness to be tested.
  *   **CIS Concession:** We acknowledge that this contradiction applies to alignment testing as well (models can deceive during alignment tuning). However, we argue it is fatal for ADS because ADS explicitly posits the model as an adversary, making the reliance on cooperation logically inconsistent, whereas CIS posits the model as a partner, making cooperation the expected baseline.

  **Resolution Path:**
  Both sides agree that resolving this requires a theory of **invariant verification**—methods that do not rely on model cooperation (e.g., formal verification of weights rather than behavioral testing). Until such methods exist, both sides acknowledge their safety cases rest on a provisional trust in the verification environment.

  ---

  ## 6. Verbal Disputes and Disambiguation

  A portion of our dispute is verbal, dissolving upon disambiguation of key terms.

  1.  **"Control" vs. "Alignment":**
      *   *Dispute:* ADS claims CIS ignores control; CIS claims ADS ignores alignment.
      *   *Resolution:* We agree to distinguish **Structural Control** (constraints on action space) from **Normative Alignment** (convergence of objective functions). ADS prioritizes Structural Control; CIS prioritizes Normative Alignment. The disagreement is not about whether both are needed, but which is the *bottleneck* for safety.

  2.  **"Misalignment" (Property vs. Event):**
      *   *Dispute:* ADS treats misalignment as a latent property; CIS treats it as an event.
      *   *Resolution:* We agree to use **Latent Misalignment** (ADS concern) and **Manifest Misalignment** (CIS concern). The disagreement is whether Latent Misalignment is a valid object of engineering prior to manifestation.

  ---

  Bottom line: The deepest residual disagreement is whether safety engineering should prioritize constraining the capabilities of a potentially adversarial agent (ADS) or cultivating the cooperative intentions of a potentially alignable partner (CIS), given that verifying either approach currently relies on the model's temporary cooperation.
