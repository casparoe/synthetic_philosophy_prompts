      **Research Question**
      Does the non-fungibility of costs across group members determine when honoring sunk costs functions as a rational precommitment strategy rather than a cognitive error? Specifically, can we identify a threshold where the signaling value of commitment outweighs the efficiency loss of continuing a failing project?

