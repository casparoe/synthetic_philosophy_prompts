answer: |-
  You have identified a genuine gap in the standard operational models of privacy compliance. The model you describe—Subject, Holder, Flow—is a legacy of "Fair Information Practice Principles" (FIPPs) designed for a world of direct collection. It assumes the data subject is the primary actor in the generation of the record. Your cases demonstrate that in a networked environment, the data subject is often a **passive beneficiary or victim of another's data generation.**

  Here is an analysis of the phenomenon, structured by your five questions.

  ### 1. Established Concepts and Literature

  There is an established concept that fits, though it is not yet mainstream in hospital compliance workflows. It is known in academic literature as **Interdependent Privacy**.

  **Why it fits:**
  Interdependent privacy explicitly addresses situations where an individual's privacy outcome is contingent on the disclosure decisions of others. It recognizes that data about Person A is often held, generated, or inferable by Person B. This concept has gained traction in the last decade alongside the rise of social networking and direct-to-consumer genomics.

  **Why others fall short:**
  *   **Group Privacy:** You are correct to reject this. Group privacy (e.g., as discussed in indigenous data sovereignty or demographic protection) posits that the *group itself* is the rights-holder. In your cases, the right violated is still *individual* (the sister, the non-app user, the villager). The group is merely the *mechanism* of the violation, not the victim.
  *   **Contextual Integrity:** As you noted, this framework evaluates the flow of information against norms specific to a context. In your cases (a) and (b), the flow from the *sharer* to the *holder* likely respects contextual norms (a man sharing his DNA; friends sharing contacts). The failure is not in the flow between the active parties, but in the **impact on the bystander**. Contextual Integrity traditionally lacks a robust account for "data bystanders"—those who are affected by a flow but are not parties to it.
  *   **Mosaic Theory:** This concerns the aggregation of many data points about *one* person. Your cases involve data points about *Person B* revealing facts about *Person A*. The mosaic is built of other people's tiles.

  **Verdict:** **Interdependent Privacy** is the correct established term. However, for a hospital board focused on risk and harm, it is often more useful to frame this economically as a **Privacy Externality**. An externality occurs when an actor (the data sharer) imposes a cost (privacy loss) on a third party (the bystander) without compensation or consent. This framing is often more actionable for policy than the philosophical "interdependence."

  ### 2. Taxonomy: One Phenomenon or Several?

  Your suspicion that these differ in kind is correct. While they share the *structural* feature of interdependence, the *mechanism* of exposure varies. I propose a three-part taxonomy:

  **Type I: Constitutive Interdependence (Case a)**
  *   **Mechanism:** The data is physically shared. My genome is literally part of my sister's genome. The record is not *about* me in a metaphorical sense; it contains my biological material.
  *   **Nature:** This is the strongest claim. The sister is not just inferred; she is partially *present* in the sample.
  *   **Distinction:** This is not merely statistical; it is ontological.

  **Type II: Inferential Interdependence (Cases b and c)**
  *   **Mechanism:** The data is distinct, but correlation allows reconstruction. The app does not have the woman's GPS; it has her friends' GPS and her phone number in their contact lists. The heat-map does not have the villager's route; it has the aggregate of the village, which is small enough to be singular.
  *   **Nature:** This relies on the "thinness" of the population or the density of the network.
  *   **Distinction:** This can be mitigated by noise or aggregation thresholds (e.g., suppressing heat-map cells with <N users). Type I cannot be mitigated by aggregation without destroying the utility of the test for the sharer.

  **Type III: Performative/Profiling Harm (Case d)**
  *   **Mechanism:** The data is a classification, potentially false, that triggers a real-world consequence.
  *   **Nature:** This is distinct from (a), (b), and (c). In the first three, a *fact* is revealed (parentage, location, routine). In (d), a *label* is applied.
  *   **Is it Privacy?** Strictly speaking, if nothing true is learned, "secrecy" is not breached. However, in a hospital context, this is a **Decisional Privacy** harm. The patient's right to decide when and how to engage with care management is usurped by an algorithmic flag. It is a privacy-adjacent harm best categorized as **Algorithmic Interference**. It belongs in your intake system not because a secret was leaked, but because a *boundary was crossed* without consent.

  ### 3. Theoretical Accounts of Privacy's Value

  **Control-Based Accounts (Failure):**
  These accounts define privacy as the individual's right to control information about themselves. They go silent here because the affected party never had control to lose. Telling the sister she "should have controlled her data" is nonsensical; she had no data in the system. These accounts are structurally incapable of handling externalities.

  **Access/Accessibility Accounts (Partial Success):**
  These define privacy as restricted access to the person or their information.
  *   **Success:** In (a) and (b), access is gained where it should not be. The sister's parentage becomes accessible to her via the brother's portal.
  *   **Failure:** In (c), the data is technically "accessible" (published heat-map), but the *interpretation* reveals the individual. In (d), nothing is accessed that is true. Access theories struggle with inference and false positives.

  **Relational/Contextual Accounts (Best Fit, with Modification):**
  These accounts view privacy as a norm-governed relationship between people.
  *   **Why they work:** They can accommodate the idea that my privacy is a function of our relationship. If we are siblings, your DNA is partly mine. If we are friends, your contact list includes me.
  *   **The Modification Needed:** Standard contextual accounts focus on the norms between the *sharer* and the *holder*. To fit your cases, the theory must expand to include the **Bystander Norm**. The question becomes: "Does the sharer have a normative obligation to the bystander before disclosing shared data?"
  *   **Old Harm, New Route:** This is best described as an **old harm reached by a new route**. The harm is unwanted scrutiny, stigma, or interference (old). The route is networked inference rather than direct surveillance (new). The value of privacy being violated is **Social Autonomy**: the ability to manage one's social self and relationships without uninvited intrusion derived from others' choices.

  ### 4. Edges and Boundaries

  **Must the derived fact be true?**
  No. As Case (d) demonstrates, the harm lies in the *consequence of the classification*, not its truth. In a hospital setting, a false positive pregnancy flag triggers the same unwanted intrusion as a true one. The relevant metric is **Impact**, not **Accuracy**.

  **Must there be a pre-existing relationship?**
  No. Bare statistical proximity suffices (Case c). The villager does not need to know the other users of the fitness platform. The "relationship" is mediated by the population density and the platform's design. If the population is thin enough, statistical proximity creates identifiability equivalent to a social tie.

  **Does the concept extend to firms or states?**
  Technically, yes (e.g., a company's trade secrets inferred from employee hiring patterns), but the moral weight differs. Privacy rights are grounded in human dignity and autonomy. A firm's "privacy" is usually a matter of security or contract. For your board, restrict the concept to **natural persons**.

  **Does it require identifiability?**
  Membership in a flagged class suffices if it triggers differential treatment. In (d), the woman is identified as "Likely Pregnant." Even if her name is not attached, if the call reaches her household, she is effectively identified. The boundary is **Actionability**: if the data triggers an action directed at the person, identifiability is satisfied.

  **Conflict Resolution (The Sibling Problem):**
  When interests clash (Brother wants to test, Sister wants secrecy), what is the structure?
  *   **Veto:** Giving the sister a veto over the brother's testing is too restrictive of his autonomy.
  *   **Majority:** Unworkable in small groups (e.g., twins).
  *   **Balancing (Recommended):** This is a **Negative Externality**. The brother internalizes the benefit (health knowledge); the sister bears the cost (privacy risk).
      *   *Policy Implication:* The burden should shift to the **Holder** (the company/hospital) to mitigate the externality. For example, the testing company should warn the brother that results may reveal familial data and require him to acknowledge this risk. In a hospital setting, if a patient's data reveals high-risk genetic markers for relatives, the ethics lie in **duty to warn** protocols, not in blocking the patient's access. The structure is not a veto, but a **duty of care** to the exposed party where feasible.

  ### 5. Terminology and Boundary Definition

  While "Interdependent Privacy" is the academic term, it is often used to discuss consent mechanisms. For a review board focused on incidents and harms, I propose you adopt the term:

  **Collateral Privacy Exposure (CPE)**

  **Definition:**
  CPE occurs when an individual suffers a privacy harm (unwanted disclosure, inference, or interference) resulting from the data processing of *other* individuals, where the harmed individual's own data restraint would not have prevented the exposure.

  **Key Criteria:**
  1.  **Source:** The data originates from a party other than the subject.
  2.  **Inevitability:** The subject could not prevent the exposure through their own non-participation.
  3.  **Impact:** The exposure results in unwanted scrutiny, inference, or intervention.

  **The Boundary Case (The "Singleton" Test):**
  To determine if a case is CPE or standard privacy, apply the **Singleton Test**:
  *   *Question:* "If this individual were the only person in the world (or the only user of the system), would the privacy harm still occur?"
  *   *If Yes:* It is **Standard Privacy** (e.g., the hospital leaks *my* direct medical record).
  *   *If No:* It is **Collateral Privacy Exposure** (e.g., the hospital leaks my status because my *partner's* record revealed it).

  **Example just outside the boundary:**
  A man uploads his genome. The company sells the aggregate data to a pharmaceutical firm. The man later feels uncomfortable knowing his data is being used for profit.
  *   *Analysis:* This fails the CPE test. The harm (discomfort at commercial use) stems from *his* data and *his* consent. He could have prevented it by not uploading. This is a standard consent/control issue, not Collateral Privacy Exposure.

  **Example just inside the boundary:**
  A man uploads his genome. The company's security is breached. His sister's genetic predispositions are stolen by hackers.
  *   *Analysis:* This passes CPE. The sister did not upload. Her restraint would not have helped. The exposure is collateral to the brother's action.

  ### Summary Recommendation for the Board

  Your current intake forms assume a **Dyadic Model** (Subject ↔ Holder). You are encountering a **Triadic Model** (Sharer ↔ Holder ↔ Bystander).

  1.  **Adopt the Term:** Use **Collateral Privacy Exposure** in your internal taxonomy to distinguish these from direct breaches.
  2.  **Update Intake:** Add a field to incident reports: "Was the affected party the primary data subject?" If "No," route to a specific protocol that assesses **inference risk** and **externality harm** rather than just consent verification.
  3.  **Policy Shift:** Recognize that in these cases, **consent is insufficient**. Because the bystander cannot consent (they are not present), the control mechanism must be **design-based** (e.g., differential privacy, aggregation thresholds, familial risk warnings) rather than procedural (e.g., click-wrap agreements).

  You are not seeing a failure of your board; you are seeing the failure of the legacy privacy model to account for networked reality. Treating these as **Externalities** allows you to manage them through risk mitigation rather than impossible consent searches.
