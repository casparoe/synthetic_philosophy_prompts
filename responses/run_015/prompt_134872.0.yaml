answer: |-
  **The First Case**

  Elena is a department head at a logistics firm. Human Resources offers a substantial efficiency bonus that is disbursed at 5:00 PM today if and only if she formally files a "Work Plan" declaring she will conduct a tedious, hour-long inventory audit tomorrow at noon. There is no penalty for failing to conduct the audit tomorrow, and once the bonus is paid, she will have no professional reason to do it; in fact, she will have strong reason to skip it to handle pressing emails. Elena is rational and self-aware. She files the Work Plan at 4:55 PM to secure the bonus, fully aware that when tomorrow arrives, she will abandon the plan. She treats the filing as a necessary administrative step to claim the money, not as a genuine commitment to the task.

  **The Second Case**

  Elena is a department head at a logistics firm. Human Resources offers a substantial efficiency bonus that is disbursed at 5:00 PM tomorrow if and only if she actually conducts the tedious, hour-long inventory audit tomorrow at noon. There is no requirement to file a plan today. Elena is rational and self-aware. She knows that when tomorrow arrives, the prospect of the bonus will give her decisive reason to conduct the audit, and she is confident she will do it then. However, today she refuses to settle the matter; she keeps her deliberation open to preserve flexibility in case an emergency arises this evening that would make the audit impossible or unwise. She predicts she will audit, but she has not yet decided to audit.

  **The Structural Feature**

  The two cases differ in exactly one respect: **the contingency of the financial incentive**. In the First Case, the benefit is contingent on the *current declaration* of intention. In the Second Case, the benefit is contingent on the *future performance* of the action. Flipping this feature converts one case into the other: if the First Case offered the bonus for performance rather than declaration, Elena would not declare today (PS: No Settlement) but would believe she will act tomorrow to get the money (SP: Yes Belief). If the Second Case offered the bonus for declaration rather than performance, Elena would declare today to get the money (PS: Yes Settlement) but would know she will not act tomorrow once paid (SP: No Belief).

  **Analysis of the First Case**

  *   **Candidate Intention:** To conduct the inventory audit tomorrow.
  *   **Agent's Belief:** Elena believes she will *not* conduct the audit. Her basis is instrumental rationality: once the bonus is secured, the costs of the audit outweigh the benefits, and she knows she will act on those reasons tomorrow.
  *   **SP Verdict:** *Cannot intend.* SP holds that intending requires believing one will act. Since Elena believes she will not act, she lacks the necessary belief. The presence of a reason to form the state (the bonus) does not generate the belief required by SP.
  *   **PS Verdict:** *Can intend.* PS holds that intending is settling the question and adopting a plan. Elena has filed the Work Plan, thereby adopting the audit as an element of her current plan to secure the bonus. PS explicitly requires no belief that one will succeed; it requires only the current settlement of deliberation. She has closed deliberation for the purpose of the bonus, satisfying PS.

  **Analysis of the Second Case**

  *   **Candidate Intention:** To conduct the inventory audit tomorrow.
  *   **Agent's Belief:** Elena believes she *will* conduct the audit. Her basis is predictive confidence: she knows her future self will have a decisive reason (the bonus) to act and she has no reason to expect she will resist that reason.
  *   **SP Verdict:** *Can intend.* SP holds that an agent who believes she will act, is rational, and has reasons in the neighborhood counts as intending. Elena meets these conditions: she believes she will audit, she is rational, and she has a reason (the future bonus). SP conflates this predictive confidence with intention.
  *   **PS Verdict:** *Does not intend.* PS holds that intending requires closing deliberation and constraining further planning. Elena has explicitly kept deliberation open to maintain flexibility. She treats the future action as a predicted event, not a current commitment. Since she has not settled the question, she has not formed a plan in the PS sense, and thus lacks intention.

  **(a) The Feature Doing the Work**
  The feature is the **contingency of the incentive** (Declaration vs. Performance). This structural difference dictates whether the agent has a reason to settle now (Case 1) or a reason to predict now but settle later (Case 2). In Case 1, the incentive targets the mental state of settlement, decoupling it from the belief in performance. In Case 2, the incentive targets the action, decoupling the belief in performance from the current state of settlement.

  **(b) Removing the Feature**
  If the incentive contingency is removed (e.g., no bonus is offered at all), the verdicts converge. Without the bonus for declaration in Case 1, Elena has no reason to file the plan; she will not settle (PS: No) and will not believe she will act (SP: No). Without the bonus for performance in Case 2, Elena has no reason to predict she will act; she will not believe she will act (SP: No) and will not settle (PS: No). Both accounts return *No Intention*, eliminating the divergence.

  **(c) Attacks from the Losing Accounts**
  A defender of **SP** attacking Case 1 would argue that filing the plan without believing one will act is not a real intention but a lie or a pretense. They would claim SP distinguishes a spectator's prediction from an intention-constituting expectation by requiring the belief to be grounded in a commitment to act. However, this repair is *ad hoc* because SP is defined as requiring belief *simpliciter*. If the agent lacks belief, SP must say there is no intention. To insist there *is* intention despite the lack of belief is to abandon SP for PS.

  A defender of **PS** attacking Case 2 would argue that predicting one will act just *is* a form of weak settlement. They would claim PS can deny that a resolution the agent knows will guide nothing is an intention, but here the prediction *does* guide her (she prepares mentally). However, this repair is *principled* only if PS redefines "settlement" to include passive prediction. But PS is defined by *closing deliberation* and *constraining planning*. In Case 2, Elena explicitly avoids closing deliberation. To count her state as intention is to ignore the core functional role of intention in PS (guiding and constraining). Thus, the PS verdict stands on its own definition.

  **(d) Conclusion on Intention and Belief**
  This pair demonstrates that intention cannot be wholly constituted by belief about one's future action. In the First Case, the agent satisfies the functional role of intention (plan adoption/settlement) without the belief, and the PS account captures this while SP fails. In the Second Case, the agent holds the belief without the functional role (deliberative closure), and the SP account counts this as intention while PS correctly identifies it as mere prediction. If intention were partly constituted by belief, the First Case would be impossible (one could not intend without belief). If intention were wholly independent of belief, the Second Case would be an intention (belief would be irrelevant). The divergence shows that belief is neither necessary (Case 1) nor sufficient (Case 2) for intention. Intention is better understood as a practical commitment that may exist without predictive confidence, rather than a cognitive state of expectation that may exist without commitment.
