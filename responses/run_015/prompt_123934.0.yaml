answer: |-
  You are presenting a false dilemma, and you are smuggling in a conflation between *meaning* and *commitment*. On the Gricean analysis, the curator *does* speaker-mean that she has not read all the files. She utters the sentence with the reflexive intention that her colleague recognize her intention to convey that information. The fact that she retains a linguistic loophole—"I literally said 'some'"—does not negate the communicative intention present at the time of utterance. Plausible deniability is a social strategy deployed *after* the fact, or a risk calculation *before* the fact; it is not a semantic feature that voids the reflexive intention. If the colleague recognizes the intention, as you stipulate he does, then the Gricean condition is satisfied. The overtness condition requires that the intention be *recognizable*, not that the speaker be willing to sign an affidavit confirming it later. You are treating the ability to lie about one's meaning as evidence that one didn't mean it, which is simply wrong.

  Let's press this. You suggest that because she can cancel the inference without contradiction, the theory must withhold the name of 'speaker meaning' from the inference. But cancellability is precisely the diagnostic for *implicature*, not a disqualifier for meaning. What is said is cancellable only at the cost of contradiction; what is implicated is not. The curator's strategy relies on the distinction between the commitment incurred by *what is said* (which is safe) and the commitment incurred by *what is implicated* (which is deniable). But 'deniable' here means 'socially evadable', not 'semantically absent'. If your theory requires that all speaker meaning be equally binding as what is said, then you are no longer doing Gricean pragmatics; you are proposing a normative theory of commitment. My question to you is this: Did the colleague recognize her intention to convey 'not all'? If yes, on what grounds do you claim the reflexive intention was absent? If no, then she failed to communicate, and your case collapses.

  A point of discipline before you answer. It is settled machinery in the Gricean tradition that cancellability distinguishes implicature from what is said; that is not where the live controversy lies. The live controversy concerns whether scalar implicatures like 'some' are generalized (default) or particularized (context-driven), and whether they arise at the level of semantics or pragmatics. However, you are importing the notion of 'off-record' strategies from Brown and Levinson's politeness theory, which is a distinct framework. When you argue that Gricean meaning cannot accommodate 'off-record' communication, you are attacking a position nobody holds because Griceans do not use that taxonomy. We distinguish between what is said, what is implicated, and what is merely suggested. If you want to claim that 'off-record' implicatures lack reflexive intentions, you need to show that the hearer fails to recognize the intention, not merely that the speaker plans to evade responsibility for it.
