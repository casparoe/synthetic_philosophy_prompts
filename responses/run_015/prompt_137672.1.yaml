  **The Scenario**
  Elena is a competent amateur baker who regularly buys a specific brand of "Clover Honey" from her local supermarket to make glazes. For years, the jar contained genuine apicultural honey (bee secretions). Unbeknownst to her, the supplier quietly alters the supply chain due to colony collapse disorder, replacing the bee honey with a high-grade rice syrup blend that is chemically engineered to match the viscosity, sweetness, and trace enzymes of real honey; the label remains "Clover Honey," no regulatory body issues a reclassification, and no announcement is made. Elena notices no difference in taste or performance, continues to use it identically, and never learns of the swap. She remains a perfectly competent user of the word "honey" by the standards of her baking community, who also accept the new jars as standard.

  **The Check**
  *   **Reference Before:** Bee secretions (natural kind).
  *   **Reference After:** Engineered rice syrup blend (functional equivalent).
  *   **Belief Content:** Before: "This honey is made by bees." (True). After: "This honey is made by bees." (False, if reference shifted; True, if reference stayed). *Correction for Externalist Verdict:* If reference shifts, the belief "This honey is viscous" remains true, but the belief "This honey is from bees" becomes a false belief about the *new* referent.
  *   **Speaker's Sincere Claim:** "I've been using the same honey for years; I know what honey is."
  *   **Causal-Historical Mechanism:** Reference **shifts**. The term is grounded in the physical samples she interacts with; when the samples change, the reference drifts to the new stuff maintaining the causal chain.
  *   **Deference Mechanism:** Reference **stays**. She defers to the expert conception of "honey" (beekeepers/chemists), which maintains that honey must be of apicultural origin; thus, she is mistakenly applying the word to syrup.

  **Analysis**
  *   **Feature Doing the Work:** The **quiet material substitution without linguistic notification**. This decouples the causal chain of samples (which shifts) from the expert linguistic norm (which stays fixed). Externalism is forced to let the **Causal-Historical mechanism win** here because the "Division of Linguistic Labor" collapses when the experts lose control of the samples; reference is anchored in the actual practice of exchange, not the idealized definition. If the community uses the word for the syrup, the word refers to the syrup.
  *   **Removal Test (Announced Change):** If the switch were announced ("New formula: rice blend"), the verdict stabilizes. The community would either update the definition (aligning Deference with Causal) or bifurcate the term ("Real Honey" vs. "Fake Honey"). The ambiguity forcing the mechanism split disappears, and externalism yields a stable reference based on the new consensus.
  *   **Internalist Response:** A semantic internalist would argue that **meaning has not changed at all**. Since Elena's psychological state, dispositions, and conceptual role for "honey" are identical before and after, the content of her term is constant. The change is purely in the *truth conditions* of her beliefs (she moves from having true beliefs to false beliefs about the stuff), not in the meaning of the word itself.
