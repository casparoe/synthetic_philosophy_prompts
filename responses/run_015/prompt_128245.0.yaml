      *   **Bayesian:** Platitude. Doesn't block. Case 1: Prior still low. Case 2: Evidence updates, still might pay.
      *   **Fixed Threshold:** Substantive (Dogmatism). Blocks if 0. Case 1: Harder to justify 0. Case 2: Evidence ignored.
      *   **Justification:** Substantive. Blocks if complexity penalty > utility gain. Case 1: Mechanism complexity. Case 2: Link complexity.
