          5.  Error-statistical/Severity (no test could distinguish).
          6.  Base rates of lying/craziness.
          7.  "Whatever else is hiding in there" (e.g., complexity priors, computability bounds).
      *   **Evaluation Criteria for Each:**
          *   Is it a platitude, substantive/defensible, or false?
