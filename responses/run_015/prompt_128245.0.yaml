      *   **Context:** A rationalist group chat discussion about Pascal's Mugging (PM). Someone shut down the thread with "extraordinary claims require extraordinary evidence" (ECREE). The user thinks this slogan is vague and might not actually solve the PM problem (where expected value still dominates despite low priors).
      *   **Task:** Lay out different precise interpretations of ECREE.
      *   **Specific Interpretations to Cover:**
          1.  Boring Bayesian (priors + likelihood ratios).
          2.  Fixed thresholds on priors (lexicographic priors?).
