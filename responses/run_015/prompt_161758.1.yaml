answer: |-
  **Scenario**
  In 1954, the Metro City Housing Authority must allocate a fixed renewal budget across two districts. The planning staff agrees on all empirical data: the structural condition of every building, the exact cost of renovation per square foot, the demographic composition of every resident, and the causal model predicting that District A's high-density tenements house three families per structure while District B's low-density cottages house one family per structure. The disagreement is exclusively over the *unit of account* for the plan's success metric. Framework A individuates "Dwelling Units" (physical structures); Framework B individuates "Resident Households" (social groups). Under the shared budget, Framework A maximizes success by renovating District A (more structures per dollar), which displaces the multi-family tenants; Framework B maximizes success by renovating District B (more households stabilized per dollar), leaving the dense structures to decay. Both sides accept the Authority's charter mandate to "Maximize Housing Stability," but Framework A defines stability as "structural occupancy rates" while Framework B defines it as "continuity of residence." The Authority must submit a single plan to the State Auditor to release funds; the Auditor requires a metric that allows for inter-city comparison of "stock maintenance." Framework A offers a standardized unit (structures) compatible with State ledgers; Framework B's unit (households) is locally precise but administratively non-portable. To secure the funding necessary to build *anything*, the Authority adopts Framework A.

  **Three Readings**

  1.  **Carnap-as-Technocrat:** This is an internal, empirical, soluble question. The State Auditor's requirement for inter-city comparison is a factual constraint on the administrative environment, much like a physical law. Framework A is instrumentally superior because it is the only one that successfully interfaces with the funding mechanism. The "political" appearance of displacement is merely a downstream empirical consequence of choosing the only framework that allows the plan to exist. Once the framework is adopted to satisfy the audit constraint, the allocation is a technical calculation.
  2.  **Carnap-as-Decisionist:** This is an external question, a decision, and tolerance applies. The choice between "structures" and "households" is not truth-apt; it is a pragmatic convention. The residue of the political is exactly here: the Authority decided to prioritize funding security over local precision. Carnap would say we should tolerate Framework B in other contexts, but here, the decision was made based on expediency. The disagreement is dissolved because both sides agree on the facts; they simply chose different linguistic rules for counting.
  3.  **Your Reading (Relocation of the Political):** The internal/external line cannot be drawn where your friend needs it. The "expediency" that drives the external decision (audit compatibility) is not a neutral technical constraint but a political technology that enforces a specific ontology (buildings over people). By adopting Framework A to satisfy the Auditor, the Authority doesn't just *describe* the housing stock differently; it *constitutes* the displacement as a non-event (since "structures" remain occupied even if "households" change). The political isn't eliminated or relegated to a one-time decision; it is encoded into the framework's rules of individuation, making the resulting displacement appear as a technical necessity rather than a distributive choice.

  **Verdict and Key Feature**
  The case supports **Your Reading**. The Technocrat reading fails because the "audit constraint" is not a law of nature but a bureaucratic convention that could have been designed differently (e.g., the State could have required household metrics). The Decisionist reading fails because it treats the framework choice as a neutral tool, ignoring that the tool itself shapes the moral landscape (making displacement invisible). The case shows that Carnap's instrumental criterion *does* yield a determinate verdict (Adopt A), but that verdict is driven by a pragmatic requirement (standardization) that inherently privileges one form of life over another.

  The single feature doing the work is the **constitutive link between the metric and the object of planning**. The unit of account doesn't just measure the housing; it defines what *counts* as housing.
  *   **If the two sides also disagreed on purposes:** If Framework A wanted "Profit" and Framework B wanted "Welfare," the case would collapse into a standard value conflict, and Carnap's distinction would offer no leverage; the instrumental verdict would vanish because there's no shared higher-order goal (funding) to anchor it.
  *   **If one framework were strictly more fruitful:** If Framework A saved more households *and* more structures (a Pareto improvement), the disagreement would become internal/empirical (someone is bad at math), and the political dimension would disappear.
  *   **If the framework choice were explicitly revisable:** If the Authority could switch metrics next cycle, the political stakes would lower, turning the framework into a genuine experiment. The "relocation" of politics relies on the framework having enough inertia to make the consequences (displacement) irreversible before the next review.

  **Strongest Objection (Against Your Reading)**
  A defender of the **Technocrat** reading would argue: "You are conflating the *origin* of a constraint with its *status*. Once the State Auditor sets the reporting requirement, compatibility becomes an empirical fact about whether the plan gets funded, not a political value. Carnap's instrumentalism handles this perfectly: we choose the framework that works. To call standardization 'political' is to politicize every administrative constraint, rendering the term 'political' useless. If the Authority wants to house people, they must first secure the money; choosing the framework that secures the money is engineering, not ideology. Your reading mistakes the *consequences* of a technical choice (displacement) for the *nature* of the choice itself."
