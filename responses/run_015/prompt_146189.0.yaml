      *   **Divergence:** CP affirms based on internal structure; Cosmo denies based on external disconnection.

  - **The isolating feature and sensitivity analysis:**
  The heavy lifting is done by the "phenomenal shielding" of the substrate. For CP, this is irrelevant; internal bonding suffices for composition. For Cosmo, this is fatal; without a channel to the Cosmic Whole, local individuation fails. Strip the shielding, and Cosmo concedes a local subject, aligning with CP. Break the loop, and CP denies the subject due to fragmentation, while Cosmo remains negative unless shielding is also removed. The divergence hinges entirely on whether consciousness is built from below (CP) or top-down (Cosmo).

  - **The defender's reply:**
  A cosmopsychist might argue that true phenomenal isolation is metaphysically impossible. Since the Cosmic Whole is fundamental, no substrate can block its presence; the "shielding" merely alters modulation, not grounding. They would claim the loop is still a cosmic subject, just muted, thereby denying the "No" verdict. Alternatively, they might argue the loop's internal bonding *is* the cosmic subject attending to itself, rendering the isolation distinction illusory.

  - **Design-integrity note:**
  The verdicts were engineered by stipulating that shielding blocks cosmic derivation. This feature carries the weight. Without it, Cosmo defaults to omnipresence, collapsing the divergence. The case holds only if cosmic connection is contingent, not necessary.
