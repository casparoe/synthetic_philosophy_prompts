      *   Form at bottom.

  7.  **Writing - Second Pass (Focusing on Tone and Constraints):**
      *   Ensure no philosopher names (Kant, Mill, etc.).
      *   Check word count.
      *   Enhance the bureaucratic absurdity.

  8.  **Final Polish:**
      *   Check the footnotes.
      *   Ensure the ending form is sharp.
      *   Verify the satire lands: The system justifies itself by consequences but forbids agents from using consequences, then uses consequences to fix the crash.

