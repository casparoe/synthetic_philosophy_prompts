      *   **Footnotes:** Add bureaucratic nuance and clarify contradictions subtly.
      *   **The Form:** The ending requirement.

  4.  **Drafting - Content & Terminology:**
      *   *Terms:* Universalizability Impact Assessment (UIA), Deontic Overload Protocol (DOP), Residual Duty Ledger, Moral Residue Allocation Formula, Categorical Compliance Mandate.
      *   *Tone:* Dry, passive voice, dense jargon.
      *   *Word Count:* Aim for ~600 words.

  5.  **Refining the Paradox:**
      *   Make sure it's clear that the *selection* of rules was based on outcomes (UIA scores), but the *application* forbids looking at outcomes.
      *   The resolution mechanism must claim to be non-consequentialist while explicitly weighing outcomes to decide which rule wins.

  6.  **Writing - First Pass (Mental or Scratchpad):**
