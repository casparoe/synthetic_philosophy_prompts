      *   **Core Satire:** The paradox of deontology. Rules are justified by long-run outcomes/consequences (rule-utilitarian style) but must be applied without regard for consequences (categorical imperative style). When they conflict, the resolution mechanism is justified by utility, reintroducing consequentialism while denying it.
      *   **Format:** Numbered regulations, occasional footnotes, approx. 600 words.
      *   **Tone:** Flat, procedural, dead serious.
      *   **Constraints:** No living philosophers, no specific texts. Invent bureaucratic terminology (e.g., "Universalizability Impact Assessment").
      *   **Ending:** A form for reporting "unresolvable deontic conflicts" with two boxes: "Accept Catastrophic Outcome" and "Invoke Consequentialist Emergency Override" (requiring admission of abandoning the framework).

  2.  **Deconstruct the Satire:**
      *   *The Setup:* The DNG operates on absolute rules.
      *   *The Justification:* These rules were picked because they produce good results (Universalizability Impact Assessment).
      *   *The Conflict:* What happens when telling the truth causes harm?
      *   *The Resolution:* A bureaucratic formula that secretly calculates harm (consequentialism) but calls it something else (lexical priority, threshold exemption).
