  ### The Passage and Stipulated Facts

  **The Passage**
  > The walls were coated in the new fireproof plaster, a modern assurance against the accidents of the gaslight age, and in this security the guests slept soundly.

  **The Facts**
  *   **Completion:** The manuscript was finished and sent to the publisher in January 1905.
  *   **The Event:** In February 1906, a prominent hotel in the capital burned down. An official inquiry revealed that the specific "fireproof" plaster cited in the novel was highly flammable; the scandal was front-page news for weeks.
  *   **Publication:** Due to ordinary scheduling delays, the novel was not published until March 1906, one month after the inquiry's findings became public knowledge.
  *   **The Record:** At the time of publication, there was no public indication that the text had been written prior to the fire. The book carried no date of composition, only the copyright year of 1906.

  ***

  ### The Verdicts

  **(A) Actual Intentionalism**
  *   **Verdict:** The passage asserts that the plaster provided genuine safety.
  *   **Reasoning:** In January 1905, the author intended to describe a setting that was secure. The phrase "modern assurance" was chosen to convey reliability, and "fireproof" was used according to its accepted commercial and linguistic definition at that time. The intention was successfully executed: the words selected precisely captured the author's understanding of the world as it existed at the moment of writing. The subsequent discovery of the plaster's flammability is a change in the world, not a failure of the text to encode the intention.

  **(B) Hypothetical Intentionalism**
  *   **Verdict:** The passage asserts that the plaster provided *false* safety (irony).
  *   **Reasoning:** The ideal reader in March 1906 possesses all public information available at publication. This includes the widely known fact that the plaster is flammable. A reasonable reader would not hypothesize that the author is ignorant of a major public scandal from one month prior. Therefore, the most reasonable hypothesis is that the author is employing irony: using the word "assurance" to highlight the characters' dangerous delusion. To read the passage literally would be to assume the author is incompetent or uninformed, which the ideal reader presumes the author is not.

  **(C) Conventionalism**
  *   **Verdict:** The passage asserts that the plaster provided genuine safety.
  *   **Reasoning:** Meaning is determined by the conventions of the language in the textual context. The word "fireproof," syntactically and semantically, denotes resistance to fire. The phrase "modern assurance" denotes confidence. There is no linguistic marker of irony (such as scare quotes or contradictory context within the paragraph) that alters the conventional meaning of the sentences. The text says what the words say, regardless of the author's mind or the reader's external knowledge.

  ***

  ### The Feature Doing the Work

  The divergence is generated entirely by the **temporal gap between the fixation of the text and the fixation of the public context.**

  *   **If the gap is removed:** If the book were published in January 1905 (before the fire), View (B) would converge with (A) and (C). The ideal reader would have no public reason to suspect irony, so the reasonable hypothesis would match the actual intention and the conventional meaning.
  *   **If the gap is widened:** If the book were published in 1920, View (B) might shift again. With historical distance, the "ideal reader" might hypothesize the author was documenting a historical folly rather than creating immediate irony. But in the immediate aftermath (1906), the pressure to attribute current knowledge to the author is strongest.

  The case relies on the fact that View (B) binds the reader to the *publication* moment, while View (A) binds the meaning to the *composition* moment. When the world changes significantly between those two moments, (B) attributes knowledge to the author that she did not possess, forcing a meaning (irony) that she did not intend.

  ***

  ### The Defense of (B) and Its Cost

  A defender of Hypothetical Intentionalism might argue: *"Publication is the speech act. An author releases a book into the world as it currently stands. If she does not update the text to reflect new public facts, she implicitly endorses the text's relationship to those facts. Therefore, the meaning must accommodate the current public record."*

  **Can they say this without altering their view?**
  No. To make this argument is to quietly shift from Hypothetical Intentionalism to a form of **Constructivism** or **Reception Theory**.
  *   **Why:** Hypothetical Intentionalism claims to track *what the author meant*, inferred from public evidence. If the defender admits the author *could not have known* the evidence (the fire results) at the time of writing, but insists the meaning must reflect that evidence anyway, they are no longer hypothesizing about the *author's* intention. They are arguing that the *context* overrides the author.
  *   **The Cost:** To save the verdict, they must abandon the claim that they are interpreting the *author's* meaning. They must admit they are interpreting the *book's* cultural function. This violates the core definition of (B), which is tethered to a hypothesis about the *author's* state of mind ("hypothesize the author to have meant").

  ***

  ### The Temporal Slice for (A)

  The verdict for (A) relies on the **intention at the moment of writing (January 1905).**

  *   **Why this slice:** Actual Intentionalism defines meaning as what the author intended *in writing it*, provided the words successfully executed that intention. The "writing" is the act of encoding the meaning into language.
  *   **Why not proofs (February 1906):** While the author saw proofs after the fire, correcting a factual premise in a work of fiction is not always required, nor does a failure to correct necessarily signal a change in intended meaning (it may signal oversight, or a decision that the fiction's internal reality supersedes external fact). The *execution* of the craft happened at drafting.
  *   **Why not reissue (1936):** The author's current avowal is evidence of the past intention, but it is not the intention itself. The meaning was fixed when the text was completed.

  If we shifted the slice to the moment of publication, (A) would collapse into (B), as we would have to assume the author intended to accommodate the new public facts. This would erase the distinction the case is designed to reveal.

  ***

  ### The Case at Reissue (Thirty Years On)

  In 1936, the novel is reissued. The fire of 1906 is now history, not news. The original reviews from 1906 (which likely praised the "prescient irony") are part of the public record.

  *   **View (C):** Unchanged. The words still conventionally mean safety.
  *   **View (A):** Unchanged. The author's intention at writing remains a historical fact.
  *   **View (B):** **Converges with (A).**
      *   **Reasoning:** The "appropriately informed ideal reader" in 1936 has access to the full public record, which now *includes* the historical fact that the author wrote the book before the fire (via letters, biographies, or the accumulated scholarship of thirty years). The reader no longer reasonably hypothesizes that the author knew about the fire in 1905. Therefore, the hypothesis of irony becomes unreasonable. The reader now hypothesizes that the author meant the literal meaning, unaware of the coming scandal.
      *   **Result:** Time heals the divergence. The "public record" eventually expands to include the private context (the writing date), neutralizing the advantage (B) had in 1906.

  ***

  ### The One Sentence for the Note

  "This sentence belongs to the time of its writing, when the plaster was still trusted, and not to the time of its reading, when the fire had spoken."
