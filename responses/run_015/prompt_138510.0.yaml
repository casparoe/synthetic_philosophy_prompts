  Now translate all of that into the vocabulary I actually think in: reasons and evidence, support or evidential bearing relations, undercutting versus rebutting defeat, propositional versus doxastic justification, the basing relation, higher-order evidence, whether reasons are facts or mental states, defeat by misleading evidence. Be faithful — don't quietly swap my framework's assumptions in and call it translation.

