answer: |-
  1. **The Transfer Problem**
  Williams's account of moral remainder is fundamentally first-personal: it's about what *I* feel when *I* act. Your ensemble condition is third-personal: it's about what *I* hear when *they* sing. How exactly does the spectator's aesthetic experience of compresence translate into the agent's ethical capacity for regret? Are you claiming opera trains us to feel remainder, or merely that it pictures it?

  *Follow-up:* She will likely argue that the phenomenology of listening simulates the first-personal deliberative structure. Push back: Simulation isn't instantiation. If I watch *Don Giovanni* and hear the compresence of alternatives, do I actually acquire a reason to regret my own choices, or just a sophisticated appreciation of his? If it's the latter, does the ethical payoff vanish?

  2. **The Ridiculous Libretto**
  You dismiss the charge that opera plots are ridiculous as a category mistake, arguing that music provides a non-propositional uptake that overrides the text. But if the music is doing the heavy lifting of representing conflict, why does the libretto need to be coherent at all? Why not embrace the nonsense fully rather than defending it as a failed piece of spoken drama?

  *Follow-up:* She'll say the words anchor the specific moral conflict while the music expands it. Push back: In recitative, where the music steps back and the text drives, the plots often look most ridiculous. Does your defense fail precisely in the moments where the drama relies on propositional content rather than ensemble texture?

  3. **Surtitles and Attention**
  You argue surtitles encourage propositional misreading, turning performance into illustrated text. Setting aside accessibility mandates for deaf and hard-of-hearing audiences—which you've addressed—do you think the *hearing* audience's reliance on surtitles has already degraded the ensemble condition culturally? Is the philosophical function of opera survivable in a regime where reading is the default mode of attendance?

  *Follow-up:* She'll likely suggest we can retrain our attention to prioritize the music over the text strip. Push back: Isn't that an elitist burden? If the technology invites the eye to prioritize text, and the institution installs it permanently, isn't the phenomenological shift inevitable regardless of individual discipline?

  4. **Narrative Consequentialism**
  You label director's theater that rewrites tragic endings as "narrative consequentialism," accusing it of maximizing satisfaction rather than preserving conflict. But if Williams thinks the morality system is flawed, why is fidelity to a libretto's tragic outcome philosophically superior to a staging that corrects what might be a flawed moral universe within the work itself?

  *Follow-up:* She'll argue that smoothing out the tragedy removes the remainder, which is the philosophical point of the work. Push back: But if the remainder relies on a specific, perhaps outdated, moral conflict, isn't preserving it a form of conservatism? Is fidelity to the *conflict* itself a consequentialist value you're smuggling in?

  5. **Gauguin and Performance Luck**
  You extend Williams's Gauguin case to performance: a singer's justification depends on the performance coming off. But Gauguin's luck is about life outcomes; a singer's luck is often about vocal health on a Tuesday night. If the soprano gets laryngitis, does the philosophical truth of the opera vanish for that audience, or just the aesthetic value?

  *Follow-up:* She'll say the instantiation of the remainder fails if the music fails. Push back: That makes the ethical insight contingent on vocal cord hydration. Does tying Williams's robust ethical point to such fragile aesthetic conditions risk trivializing the notion of justification?

  6. **One Thought Too Many**
  You claim audiences don't owe a justification for watching a character suffer, and that philosophy has wrongly demanded one. But by writing this book, aren't you providing the exact justification you say isn't owed? Is the book itself "one thought too many," articulating a value that should remain silent?

  *Follow-up:* She'll distinguish between explaining the structure of the experience and justifying the morality of enjoying it. Push back: But if the explanation reveals that the enjoyment depends on a specific philosophical uptake of remainder, doesn't that make the uptake a condition of the enjoyment? You're making the audience accountable to the theory they didn't ask for.

  7. **The Escape Hatch**
  When pressed on truth conditions, you retreat to the claim that music isn't in the business of making assertions. But if opera represents ethical remainder, isn't it implicitly claiming that ethical remainder is a real feature of the world? How do you separate representing a state of affairs from asserting its existence?

  *Follow-up:* She'll lean on the showing/saying distinction. Push back: Williams used cases to show something about ethics, but those cases were argumentative tools. If opera is doing the same work, doesn't it enter the space of reasons? If it enters the space of reasons, it can't just hide behind "no claims" when challenged.

  8. **Phenomenology vs. Data**
  Your argument relies on a specific phenomenology of listening—that we hear the compresence of alternatives simultaneously. If cognitive science demonstrated that listeners actually focus on one melody line and suppress others cognitively, would that undermine the ensemble condition, or would you privilege the introspective report over the data?

  *Follow-up:* She'll likely privilege the phenomenological description as the primary datum. Push back: But if the mechanism you describe doesn't match how brains actually process polyphony, isn't your "compresence" a theoretical construct rather than an experienced reality? Why trust the philosophy over the psychology here?

  9. **Plot Knowledge Variable**
  Does the ensemble condition survive if the listener doesn't know the plot? If I hear four people singing incompatible resolves but don't know *what* they are resolving, do I still experience the ethical remainder, or just musical tension? Is the effect dependent on propositional knowledge you claim isn't the point?

  *Follow-up:* She'll argue the music carries the conflict even without the plot. Push back: Then why does your book spend so much time analyzing specific libretto conflicts? If the music alone suffices, the specific ethical content becomes arbitrary, and the Williams connection weakens.

  10. **Falsifiability**
  What empirical finding about ordinary listeners would actually count against your view? If studies showed that audiences leave ensembles feeling resolved rather than conflicted, or that the effect disappears without surtitles, would you abandon the claim that opera uniquely represents remainder, or is the theory insulated from how people actually listen?

  *Follow-up:* She may say the theory is about the work's capacity, not audience reception. Push back: If the capacity never actualizes in reception, is it a capacity of the work or just a capacity of your reading of the work? At what point does the distinction between the work's potential and the audience's experience collapse?
