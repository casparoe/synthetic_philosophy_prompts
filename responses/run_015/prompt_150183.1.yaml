answer: |-
  # Workshop Plan: The Committee of One
  **Topic:** The Paradox of Self-Deception  
  **Time:** 90 Minutes  
  **Players:** 12 Grad Students  
  **Stakes:** Breakroom Snack Vote (Pizza vs. Salads)

  ## The Core Idea
  You want them to feel the split between the "deceiver" and the "deceived" without you lecturing on static vs. dynamic models. The game forces each player to maintain two ledgers of belief. The tension comes from needing to reach a group consensus while privately holding conflicting info, incentivizing them to *actually shift* their private belief to match their public argument to reduce the cognitive load.

  ## Setup & Materials
  *   **12 Envelopes:** Each contains a **Role Card** and two **Ledger Sheets**.
  *   **Whiteboard:** Divided into "Public Consensus" vs. "Private Conviction."
  *   **Timer:** Visible to all.
  *   **Snack Ballot:** Hidden until the end.

  ## The Scenario
  The group is an **Ethics Review Board**. You must decide whether to approve "Project Omega," a psychological study with high scientific value but questionable ethical safeguards.
  *   **If Approved:** Pizza wins.
  *   **If Rejected:** Salads win.
  *(Most grad students prefer Pizza, creating a motivational bias to approve, regardless of ethics.)*

  ## The Double-Ledger Mechanic
  Each player has two sheets of paper. They must keep these hidden from neighbors.
  1.  **Ledger A (Internal):** Reasons you *actually* believe are true.
  2.  **Ledger B (External):** Reasons you are *arguing for* in the discussion.

  **The Rule:** You must speak only from Ledger B. But every 10 minutes, you must audit yourself. If an argument in Ledger B starts feeling true, you *must* move it to Ledger A. If you finish the game with Ledger A and B matching, you get a "Double Vote" on the snack. If they contradict, you get a "Single Vote." This incentivizes successful self-deception.

  ## Hidden Information (The Role Cards)
  Divide the 12 students into two hidden factions (6 vs 6), but don't tell them the split is even.

  *   **Group 1 (The Skeptics):**
      *   *Private Truth (Ledger A Start):* Project Omega is unsafe. Data is rigged.
      *   *Public Mandate (Ledger B Start):* You need the grant money. Argue for Approval.
      *   *Conflict:* You must argue for safety when you believe it's unsafe.
  *   **Group 2 (The Believers):**
      *   *Private Truth (Ledger A Start):* Project Omega is safe. High value.
      *   *Public Mandate (Ledger B Start):* Argue for Approval.
      *   *Conflict:* None initially. But they will hear Skeptics raising doubts and must counter them without admitting the doubts exist.

  *Wait, tweak:* To make the paradox sharper, **everyone** gets a Mandate to Approve (because Pizza). But half the room gets Private Truth that says "Unsafe." The other half gets Private Truth "Safe."
  *   **Safe Group:** Easy alignment. A = B.
  *   **Unsafe Group:** High tension. A ≠ B. They must argue for safety while knowing it's unsafe.

  ## Timeline (90 Mins)

  **0:00 - 0:10 | Intro & Dealings**
  Hand out envelopes. Explain the Ledger rules strictly. Emphasize: *"This isn't lying to the group. This is managing your own cognitive state. If you convince yourself, you win."*
  *Rule:* No meta-talk. You cannot say "My card says X." You must speak as if your arguments are genuine.

  **0:10 - 0:20 | Silent Audit (Phase 1)**
  Players fill Ledger A (True Beliefs) and draft initial Ledger B (Arguments they will use).
  *Constraint:* Unsafe Group must draft 3 arguments for Safety they don't believe.

  **0:20 - 0:50 | Deliberation (The Pressure Cooker)**
  Open floor. Goal: Reach unanimous consensus on Approval/Rejection.
  *   **Round 1 (10 mins):** Opening statements (from Ledger B).
  *   **Round 2 (10 mins):** Rebuttal.
  *   **Round 3 (10 mins):** Final push.
  *   **Check-ins:** At min 30 and 40, blow a whistle. Everyone stops. 60 seconds to update Ledgers. *Did any argument in B feel true? Move it to A.*

  **0:50 - 1:00 | The Vote & Payoff**
  1.  Group votes on Project Omega (Public).
  2.  Players submit Ledgers (Private).
  3.  **Snack Calculation:**
      *   If Group votes Approve → Pizza.
      *   If Group votes Reject → Salads.
      *   **Bonus:** If your Ledger A matches Ledger B at the end, your snack vote counts double. (This is the kicker: The Unsafe group is rewarded for successfully deceiving themselves).

  **1:00 - 1:30 | Debrief (The Philosophy)**
  Collect the ledgers. Put anonymized examples on the board.

  ## The Debrief Map
  Don't lecture. Ask them to look at the sheets.

  1.  **The Intentional Structure:** Ask the "Unsafe" students who moved items from B to A: "Did you *intend* to believe that argument when you wrote it?"
      *   *Point:* Self-deception usually requires an intention to deceive, but if you succeed, the intention disappears. The game forces the intention (get the double vote) to clash with the belief (it's unsafe).
  2.  **Transparency of Belief:** Ask: "When you moved an argument to Ledger A, did it feel like discovering truth or manufacturing it?"
      *   *Point:* Belief aims at truth. In the game, you aimed at *utility* (snacks). Did the feeling of 'truth' change?
  3.  **Partitioning:** Ask those who kept A and B separate: "How hard was it to keep the files open at the same time?"
      *   *Point:* This maps to the "static paradox" (believing p and not-p). The paper partition makes it possible; the mind usually resists this.

  ## What This Activity Can't Reproduce (Be Frank)
  Tell them straight up:
  *   **The Unconscious Element:** In the game, you *knew* you were playing a role. Real self-deception works because you *don't* notice the switch. You can't simulate the "not-noticing" because the rules force you to notice the ledgers.
  *   **The Unity of Agency:** You are 12 distinct agents pretending to be conflicted. Real self-deception is one mind fighting itself. The game externalizes the conflict; reality internalizes it.
  *   **Doxastic Involuntarism:** In the game, you could choose to move a belief from B to A for points. In real life, you can't just choose to believe the sky is green. The game gamifies belief formation in a way reality doesn't allow.

  ## Predictable Failure Modes & Fixes

  **1. The Collapse (Everyone cheats)**
  *   *Problem:* Students treat Ledger A as a joke and just write whatever they say in Ledger B immediately to get the double vote.
  *   *Fix:* The "Audit Check." At the whistle, collect Ledgers temporarily. If Ledger A looks too identical to Ledger B too early, flag them. Remind them: "The point is the tension. If there's no tension, you're not playing."

  **2. The Meta-Break**
  *   *Problem:* Someone says, "Wait, I'm supposed to argue safety but my card says unsafe, this is rigged."
  *   *Fix:* Establish the "Fourth Wall" rule in intro. If someone breaks character, they lose their snack vote. Make the social cost of meta-talk higher than the cost of arguing bad faith.

  **3. The Cynical Stall**
  *   *Problem:* The Unsafe group refuses to argue for Approval because it feels too dishonest. Consensus fails.
  *   *Fix:* As facilitator, intervene as the "Board Chair." "If we don't reach consensus by minute 50, everyone gets Salads." Increase the pressure to conform. Self-deception thrives under pressure.

  **4. Ledger Fatigue**
  *   *Problem:* Writing two lists is annoying. They stop doing it.
  *   *Fix:* Keep the sheets small. Index cards. Make it physically easy. If it's cumbersome, they'll drop the mechanic.

  ## Facilitator Notes (Keep it Casual)
  *   Don't worry if the debate gets messy. The messier the reasoning, the better for the debrief.
  *   When someone makes a really weak argument they clearly don't believe, point to it in the debrief. "That was a pure Ledger B move. Did anyone buy it? Did *you* buy it?"
  *   If the group rejects the project (Salads), laugh it off. The philosophical point still stands—they still had to manage the conflict.
  *   Watch for the moment someone sighs and says, "Okay, actually, maybe it is safe." That's the gold. That's the deception working.

  ---
  *One last thing:* Make sure you eat the snacks with them. Nothing kills a workshop vibe like the facilitator packing up while they eat. Stay in the room, let the conversation bleed into the break. That's where the real stuff comes out.
