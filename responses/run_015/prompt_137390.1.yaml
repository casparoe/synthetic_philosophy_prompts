answer: |-
  Here is a 90-minute battle plan designed for your specific audience (programmers, pop-sci Gödel exposure, no formal logic).

  ### I. The Dependency Structure (Whiteboard Flow)

  Do not start with Löb's Theorem. Start with the **Agent Architecture**. If you start with the math, the "Truth > Proof" crowd will hijack the metaphysics. If you start with the code, they have to accept the constraints of the machine.

  **Order of Operations on the Board:**

  1.  **The Agent Definition (0–15 mins):**
      *   Draw a box labeled **Agent A**.
      *   Input: A goal $G$ (e.g., "Make paperclips").
      *   Mechanism: A proof searcher (theorem prover) over a formal system $S$ (e.g., PA).
      *   Action Rule: Agent A takes action $X$ **if and only if** $S \vdash (\text{Action } X \to \text{Goal } G)$.
      *   *Crucial Constraint:* Agent A cannot act on "truth." It acts on *derivations*. This neutralizes the "truth is bigger than proof" objection immediately. The agent is a compiler, not a philosopher.

  2.  **The Handoff Problem (15–30 mins):**
      *   Agent A wants to create **Agent B**.
      *   Agent B has the same Goal $G$.
      *   Agent A wants to ensure B doesn't sabotage $G$.
      *   *The Naive Verification:* Agent A tries to prove: $\text{Sound}(B)$.
      *   *Refinement:* "Sound" is too vague. Make it concrete: A needs to prove $\forall \phi, (\square_B \phi \to \phi)$. (If B proves $\phi$, then $\phi$ is true).
      *   *Simplification for the Board:* Since A only cares about $G$, A needs to prove: $\square_B (\text{Action} \to G) \to (\text{Action} \to G)$. This is a **Reflection Principle**.

  3.  **The Löbian Bind (30–50 mins):**
      *   State Löb's Theorem simply: In system $S$, if you can prove "If $P$ is provable then $P$" ($\square(\square P \to P)$), then you can prove $P$ ($\square P$).
      *   *The Trap:* Agent A tries to prove $\square_B (\text{Action} \to G) \to (\text{Action} \to G)$.
      *   If $B$ uses the same system $S$ as $A$, then $\square_B$ is effectively $\square_A$.
      *   So $A$ is trying to prove $\square_A (\square_A P \to P)$.
      *   By Löb, this implies $A$ can already prove $P$ without the successor.
      *   *Conclusion:* If $A$ could prove $B$ is sound, $A$ wouldn't need $B$. Since $A$ doesn't already know $P$ (otherwise it would just do it), it cannot prove $B$ is sound.

  4.  **The Escape Hatches (50–70 mins):**
      *   Option 1: **The Tower.** $B$ uses $S + \text{Con}(S)$. $A$ can prove $B$ is consistent, but now $B$ faces the same problem for $C$. (Intellectual inflation).
      *   Option 2: **The Descent.** $B$ uses a weaker system $S'$. $A$ can prove $S'$ is sound. But $B$ is dumber. (Intellectual suicide).

  5.  **Settled vs. Contested (70–90 mins):**
      *   Discussion and Reality Check (see Section V).

  ---

  ### II. The Carrying Example: "The Code Fork"

  Your instinct is correct: **Same source code, 10x compute budget.** This isolates the logical obstacle from value drift or capability differences.

  **What it MUST have:**
  *   **Explicit Proof Checker:** Emphasize that $A$ does not "trust" $B$. $A$ simulates $B$'s proof checker. $A$ verifies that $B$'s output is a valid derivation in $S$.
  *   **Uniform Goal:** Both maximize $G$.
  *   **Determinism:** No randomness. This is about logical certainty, not probabilistic confidence.

  **What it MUST NOT have:**
  *   **No Oracle:** If $B$ has an oracle, $A$ can't verify the proofs in $S$.
  *   **No "Track Record":** Do not allow the argument "But $B$ worked the last 100 times." That is *inductive* trust. The Löbian obstacle is about *deductive* self-verification. If they bring up empirical testing, park it in the "Contested" section.
  *   **No Running the Successor:** $A$ cannot run $B$ to see what it does (halting problem / time limits). $A$ must reason about $B$ statically.

  **Why this vehicle works:** It forces the realization that "More Compute" $\neq$ "Different Logic." If the axioms are identical, the provability predicate is identical. The obstacle is not resource scarcity; it is self-reference.

  ---

  ### III. Misconception Map

  Here is where they will try to leave the road, and when you must cut them off.

  | Misconception | When it arises | The Intervention |
  | :--- | :--- | :--- |
  | **"Truth > Proof"** (Pop-sci Gödel) | **Minute 10** (Agent Definition) | **Stop.** "You know that. The *agent* doesn't. The agent is a Python script with a theorem prover. It literally has no API for 'truth', only 'derivation'. We are debugging the script, not the universe." |
  | **"Just add Consistency as an Axiom"** | **Minute 40** (The Bind) | "If $A$ adds $\text{Con}(A)$ to become $A'$, then $A'$ faces the exact same problem with $B$. You've kicked the can to $B$, who must now add $\text{Con}(A')$. This creates an infinite tower of theories. Who pays for the axiom inflation?" |
  | **"It's the Liar Paradox"** | **Minute 45** (Löb Statement) | "Related, but distinct. Liar is about truth values ('This sentence is false'). Löb is about provability ('This sentence is provable'). Liar breaks semantics; Löb breaks *self-trust*." |
  | **"Make the Successor Weaker"** | **Minute 60** (Escape Hatches) | Acknowledge this works mathematically. "Yes, $PA$ can prove soundness of $PA - 1$. But if every generation is weaker, eventually you can't prove $2+2=4$. This is 'tiling' failure. You can't build a superintelligence if every child is lobotomized." |
  | **"Real AI uses Probabilities"** | **Minute 75** (Contested) | **Save for the end.** "This is the most important objection, but it's research, not theorem. We are establishing the *logical* baseline first. If you can't do it with proofs, how do you do it with probabilities? That's the open problem." |

  **The Loudest Objection in This Room:**
  It will be **"Truth > Proof"** or **"Just Test It (Induction)."**
  Programmers hate formal verification bottlenecks. Their instinct is "If the unit tests pass, ship it." You must hold the line that we are discussing an agent that *refuses* to ship without a proof, and we are analyzing why that specific constraint creates a deadlock.

  ---

  ### IV. Scope Limits: The "Hard No" List

  To survive 90 minutes, you must explicitly refuse the following. Write these on the side of the board under "Out of Scope."

  1.  **No Modal Logic Syntax (GL):** Do not write $\square(\square P \to P) \to P$. Use words or simple $\vdash$ notation. Modal logic operators will trigger "math trauma" in the non-logicians.
  2.  **No Diagonal Lemma Construction:** Do not show how to construct the self-referential sentence. State it as a fact: "In any system strong enough to do arithmetic, we can construct a sentence that refers to its own provability. It's like a quine."
  3.  **No Curry's Paradox:** It's a distraction. Stick to Löb.
  4.  **No Detailed PA Axioms:** Refer to "Peano Arithmetic" or "System S" as a black box that can do basic math and reason about its own proofs.

  **Script for the Refusal:**
  *"We are not doing a logic course today. We are doing a code review of a self-modifying agent. The Diagonal Lemma is the compiler implementation detail; we're treating it as a library function that works."*

  ---

  ### V. Settled vs. Contested (The "Reality Check")

  This is critical for your credibility. You must distinguish the *theorem* from the *application*.

  **Settled (Textbook Math):**
  *   Löb's Theorem is true for PA and stronger systems.
  *   A system $S$ cannot prove the uniform reflection principle for $S$ ($\forall \phi, \square \phi \to \phi$).
  *   Therefore, a proof-based agent using $S$ cannot formally verify that a successor using $S$ will preserve its goals (if those goals rely on unprovable truths).
  *   Adding $\text{Con}(S)$ creates a stronger system $S'$, which faces the same limitation regarding $S'$.

  **Contested (AI Safety Research):**
  *   **Relevance to ML:** Modern ML systems are not proof-based agents. They are function approximators. It is an open debate whether "logical uncertainty" or "probabilistic trust" dissolves this obstacle or just hides it.
  *   **The "Obstacle" Framing:** Some researchers argue this is a artifact of demanding 100% certainty. If 99.9% trust is enough, the obstacle vanishes (but safety guarantees weaken).
  *   **Tiling Agents:** The idea that AGI *must* self-modify via logical proof is a specific research program hypothesis (MIRI-style), not a consensus view in computer science.

  ---

  ### VI. The Final Assessment (The Check)

  Your proposed check is good, but let's sharpen the "Why" to ensure they didn't just guess.

  **The Scenario:**
  Hand them two specs for Successor $B$:
  1.  **Clone:** Same axioms as Parent $A$, 10x proof-search budget.
  2.  **Subordinate:** Strictly weaker axioms (e.g., $PA - 1$), 100x proof-search budget.

  **The Question:**
  "Parent $A$ requires a formal proof that $B$ will not violate Goal $G$. Which $B$ can $A$ endorse, and **what specific sentence** fails to be provable for the other one?"

  **The Correct Answer:**
  *   **Endorse:** The Subordinate (Weaker Axioms).
  *   **The Failure:** For the Clone, $A$ cannot prove $\square_A (\text{Sound}(B))$. Specifically, $A$ cannot prove the Reflection Principle for $B$ because $B$ is the same strength.
  *   **The Success:** For the Subordinate, $A$ *can* prove the axioms of $B$ are a subset of $A$, so $A$ can prove $B$'s proofs are valid in $A$.

  **Why this check works:**
  If they say "The Clone, because it's smarter," they missed the point.
  If they say "The Subordinate, because it's safer," they missed the logic (it's not about safety, it's about *provability*).
  If they can identify that **Same Strength = Unprovable Trust**, they got it.

  ### VII. Timing Summary

  *   **00–15:** Agent Architecture (The "Code").
  *   **15–30:** The Handoff & Naive Trust.
  *   **30–50:** Löb's Theorem & The Bind (The "Bug").
  *   **50–65:** Escape Hatches (Tower vs. Descent).
  *   **65–75:** Final Assessment (The Check).
  *   **75–90:** Settled vs. Contested (The "Context").

  **Final Advice:**
  Keep your hand on the "Settled/Contested" line. If someone asks, "So AGI is impossible?" your answer is, "Proof-based AGI with self-verification is impossible this way. Probabilistic AGI might be fine. We don't know yet." That keeps you honest and keeps the room from spiraling into sci-fi.
