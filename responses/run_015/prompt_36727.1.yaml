      *   **Core Question:** Does the film support the idea that the line between corruption and legitimate moral economy is external (Western imposition), or does the film itself draw that line (condemning the system)? Where does it resist the anthropological reading?
      *   **Pedagogical Goal:** Teach students without selling a biased view. Acknowledge contested scholarship.
      *   **Specific Constraints:** Be honest about settled vs. contested debates in corruption studies. Flag contested interpretations of scenes.

  2.  **Deconstruct the Anthropological Lens:**
      *   *Gift vs. Bribe:* Mauss, Sissela Bok, etc. A gift creates a relationship/obligation; a bribe buys a specific outcome and ends the relationship.
      *   *Patron-Client:* Vertical relationships based on reciprocity, loyalty, and protection.
      *   *The "Western Orthodoxy" Critique:* Modernization theory vs. Cultural Relativism. Is clientelism "corruption" or just "how things work" in honor societies?
      *   *The Godfather's Opening:* Bonasera wants revenge (transactional). Don wants friendship (relational). "Someday, I may call upon you."

  3.  **Analyze *The Godfather* through this Lens:**
      *   *Support for the Anthropological Reading:*
          *   The opening scene is the quintessential example of converting a transaction into a relationship.
          *   The wedding scene: The Don *cannot* refuse a request on his daughter's wedding day (obligation).
          *   Enzo the Baker: Comes out of loyalty/fear, gets help with immigration in return.
          *   Johnny Fontane: "I'm gonna make him an offer he can't refuse" is the dark side of patronage (coercive reciprocity).
          *   The Don's Code: "It's not personal, it's strictly business" (often misquoted, actually about keeping emotions out of *strategy*, but also about maintaining the system).
      *   *Resistance to the Anthropological Reading (The Film's Critique):*
          *   Violence: The horse head. You can't anthropologize away terror.
          *   The Baptism Sequence: The ultimate hypocrisy. Sacred vows vs. profane murders. The editing explicitly contrasts the two moral worlds to show the corruption of the sacred.
          *   Michael's Arc: He starts as the "civilian" (Western norm) and becomes the "Don" (Corrupt norm). The tragedy is his loss of soul, not his success in the system.
          *   Kay's Perspective: She represents the outsider/Western view. Her final exclusion (door closing) signifies the incompatibility of the two worlds.
          *   Sollozzo: Represents pure business/drugs. The Don refuses drugs not just on moral grounds but because it breaks the patron-client political protection racket (judges/politicians won't protect drug lords). This complicates the "business" argument.

  4.  **Address the Scholarship (Settled vs. Contested):**
      *   *Settled:* Clientelism exists everywhere. Definitions of corruption vary by context.
      *   *Contested:* Is clientelism *normatively* defensible? Does calling it "moral economy" excuse exploitation? (Scott vs. Critics). Is the "Western orthodoxy" just imperialism, or is there a universal baseline for public office integrity?
      *   *Nuance:* The "Gift" theory (Mauss) is often romanticized. In reality, power asymmetry makes "voluntary" gifts coercive.

