      *   *Section 4: Scholarly Context (Settled vs. Contested).* Be careful here. Don't say "Anthropologists say X." Say "Some argue X, others counter Y." Mention James Scott (moral economy) vs. institutionalists.
      *   *Section 5: Scene-Specific Flags.* Identify where an interpretation might be debatable (e.g., Is the Don's refusal of drugs moral or strategic?).

