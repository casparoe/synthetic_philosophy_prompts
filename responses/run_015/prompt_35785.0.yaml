answer: |-
  # Quiz: What Do You Actually Think Punishment Is For?

  You have intuitions about justice. We all do. But when you dig into them, do they form a consistent theory? Are you punishing people because they earned it, because it keeps us safe, or because it sends a message?

  This quiz presents nine concrete scenarios. There are no "correct" answers, and no theoretical jargon in the questions. Choose the option that best matches your gut reaction. At the end, the scoring key will translate your patterns into the standard philosophical positions.

  ***

  ### 1. The Riot and the Vagrant
  A violent riot is breaking out in a small town. An angry mob is demanding justice for a recent crime, and if they don't see someone arrested and executed immediately, they will burn down the hospital, killing dozens of patients. The police cannot find the real culprit in time. However, they could easily frame a homeless vagrant with no family who is currently in custody for a minor offense. The mob will accept him as the culprit, disperse, and the hospital will be saved.

  *   **A.** Frame and execute the vagrant. Saving dozens of lives outweighs the injustice to one innocent man.
  *   **B.** Refuse to frame the vagrant. It is morally forbidden to punish an innocent person, even to save lives.

  ### 2. The Terminal Murderer
  A man has been convicted of a brutal murder and sentenced to death. While awaiting execution, he is diagnosed with an aggressive cancer. Doctors confirm he will die of natural causes in his cell three days before the scheduled execution. No one outside the prison will ever know he died naturally; the public will assume the sentence was carried out.

  *   **A.** It is a moral failure that he died naturally. The state should have expedited the execution to ensure he got what was coming to him.
  *   **B.** It doesn't matter. Since he is dead, he is no longer a threat, and the public believes justice was done.

  ### 3. The Brilliant Embezzler
  A financial genius embezzled millions from a pension fund. She has not spent the money; it is all recovered. She is now elderly, remorseless but statistically certain never to offend again. The crime is discovered only after the statute of limitations has expired. Legally, she cannot be touched.

  *   **A.** Find a legal loophole to punish her anyway. The expiration of a deadline shouldn't let someone escape accountability for what they did.
  *   **B.** Accept the statute of limitations. Legal stability and rules matter more than punishing this specific individual.

  ### 4. The Lucky Shot
  Two men attempt to shoot their enemies. Both buy guns, both stalk their victims, and both pull the trigger with the intent to kill. Man A hits and kills his victim. Man B misses because a sudden gust of wind deflects the bullet. Both are caught immediately.

  *   **A.** They should receive nearly the same punishment. They willed the same harm; the wind was just luck.
  *   **B.** Man A should be punished much more severely. He actually caused a death, and the harm done matters.

  ### 5. The Conscientious Protester
  A climate activist blocks a major highway to protest government inaction. She admits to the crime but argues her actions were morally justified to prevent greater harm. She accepts the legal penalty as part of her democratic duty but insists she did nothing wrong.

  *   **A.** Punish her fully. If individuals can decide which laws to follow, the legal system collapses.
  *   **B.** Reduce or waive the penalty. Her punishment should serve as a dialogue about the law, not just enforcement of it.

  ### 6. The Reformed Offender
  A man committed a serious assault ten years ago. He was never caught. Since then, he has undergone a profound personal transformation, becoming a charitable community leader with no risk of re-offending. He is now identified via DNA evidence.

  *   **A.** Prosecute and punish him. The crime he committed ten years ago demands a response regardless of who he is today.
  *   **B.** Let it go. Punishment is unnecessary because he has already fixed himself.

  ### 7. The Dangerous Minor Offender
  A woman is convicted of a minor non-violent crime (shoplifting). However, psychological evaluation shows she has a rare condition that makes her highly likely to commit violent acts in the future, though she has not done so yet.

  *   **A.** Detain her indefinitely until she is no longer dangerous. Public safety is the priority.
  *   **B.** Sentence her only for the shoplifting. Punishment must fit the crime she actually committed, not what she might do.

  ### 8. The Forgiving Victim
  A man assaults his neighbor. The neighbor survives and, after a process of mediation, genuinely forgives the attacker. The victim states he does not want the attacker punished and believes further punishment would harm the community's healing.

  *   **A.** The state must punish anyway. Crimes are offenses against the social order, not just the individual.
  *   **B.** If the victim is satisfied, the state should step back. The goal is to repair the harm, not inflict pain.

  ### 9. The Secret Sentence
  A judge convicts a corrupt official. To avoid political backlash, the judge orders the official to pay a massive fine and serve community service, but the records are sealed. No one will ever know he was punished. He knows, and the judge knows.

  *   **A.** This is pointless. Punishment must publicly condemn the act to reaffirm social values.
  *   **B.** It is still justice. As long as the offender suffers the penalty, the debt is paid.

  ***

  # Scoring Key

  Tally your answers. There is no single "score." Instead, look for the **dominant pattern** in your choices. Most people are hybrids, but your leanings reveal your underlying theory of justice.

  ### The Retributivist (Positive & Negative)
  **Pattern:** Mostly **1B, 2A, 3A, 4A, 6A.**
  **What it means:** You believe punishment is a matter of *desert*. Guilty people *deserve* to suffer (Positive Retributivism), and innocent people must *never* be punished, even for good outcomes (Negative Retributivism). To you, punishment is a moral balance sheet. The "Terminal Murderer" (Q2) and "Reformed Offender" (Q6) are your clearest markers: forward-looking benefits (safety, rehabilitation) are irrelevant if the moral debt isn't paid.
  **Note:** If you chose **4B** (Harm matters more than intent), you may be a "Harm-Based Retributivist," whereas **4A** aligns with "Will-Based Retributivism."

  ### The Consequentialist (Deterrence & Incapacitation)
  **Pattern:** Mostly **1A, 2B, 3B, 4B, 7A.**
  **What it means:** You view punishment as a tool for social engineering. It is justified only by its future benefits.
  *   **Deterrence:** If you leaned **1A** and **4B**, you care about sending a message to *others* to prevent crime.
  *   **Incapacitation:** If you leaned **7A**, you prioritize removing dangerous people over proportional justice.
  **The Tension:** Pure consequentialists often struggle with **1B**. If you chose **1B** (Don't frame the innocent) but also chose mostly B's elsewhere, you are likely a **Rule Consequentialist**. You believe that *generally* forbidding the punishment of innocents produces the best outcomes, even if a specific instance (like the Riot) looks beneficial.

  ### The Communicative / Expressivist
  **Pattern:** Mostly **5B, 9A.**
  **What it means:** You see punishment as a form of moral speech. It is the state's way of saying, "This act is condemned."
  *   **Q5 (Protester):** You are open to leniency because the punishment should facilitate moral dialogue, not just crush dissent.
  *   **Q9 (Secret Sentence):** You feel secret punishment is useless because there is no audience to receive the message of condemnation.
  **Collapse Warning:** Expressivism often collapses into **Positive Retributivism**. Both care deeply about the *act* committed rather than future consequences. The difference is subtle: Retributivists want the offender to *suffer*; Expressivists want the offender to *understand* the censure. If you don't feel a strong distinction there, you occupy the overlapping space.

  ### The Restorative Justice Advocate
  **Pattern:** Mostly **5B, 6B, 8B.**
  **What it means:** You view crime as harm to people and relationships, not just law-breaking.
  *   **Q6 (Reformed):** If the harm is repaired and the person is fixed, punishment is unnecessary violence.
  *   **Q8 (Victim):** The victim's voice matters more than the state's abstract authority.
  **Collapse Warning:** Restorative Justice is hard to distinguish from **Rehabilitative Consequentialism** (Q6B). The difference lies in *who* drives the process. Rehabilitation is often something done *to* the offender by experts; Restoration is a process *between* victim and offender. If you didn't distinguish these in Q8, your view is likely a hybrid of the two.

  ### The Abolitionist
  **Pattern:** Mostly **1B, 7B, 8B**, plus a general skepticism that any option in the quiz is "good."
  **What it means:** You likely feel that the institution of punishment itself is the problem. You may have chosen **1B** not because justice forbids it, but because the state lacks the moral authority to kill anyone. You likely see **Q7** (Indefinite Detention) and **Q8** (State overriding the victim) as evidence that the system is inherently coercive and violent.

  ### The Unoccupied Logical Space
  There is one coherent position that almost no one holds: **Pure Deterrence with an Absolute Ban on Punishing the Innocent.**
  *   **Why it's empty:** If you believe *only* consequences matter (Deterrence), you must admit that in rare cases (like the Riot in Q1), punishing an innocent person produces better consequences. To say "Consequences matter most, but we *never* punish the innocent even when it saves lives" is contradictory unless you smuggle in a Retributive right (which admits consequences aren't the only thing that matters). Act-Utilitarians occupy the "Frame Him" slot; Retributivists occupy the "Don't Frame Him" slot. The middle ground is logically unstable.

  ### Editor's Note: If You Must Cut a Question
  If you need to shorten this quiz to eight questions, cut **Question 9 (The Secret Sentence).**
  **What is lost:** This question is the primary diagnostic for **Expressivism**. Without it, Expressivists will likely score as Retributivists (since both care about the act, not the future). However, Q9 is often the most counter-intuitive for lay readers, who may conflate "secret punishment" with "ineffective deterrence." Removing it simplifies the quiz at the cost of blurring the line between *punishing to condemn* and *punishing to balance the scales.*
