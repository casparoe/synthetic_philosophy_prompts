  *Revised Plan for Scoring:* The sheet tracks variables. The *rubric* for interpreting those variables is revealed in the debrief. This ensures they play to "survive" without knowing which survival metrics count as "collapse."

  *Wait, re-reading constraint:* "The same run must be honestly scoreable as either... depending on which indicators... and the students must not realise this until the debrief."
  Okay, so the data they generate supports both narratives. The *sheet* just records the data. The *interpretation* is the reveal.

  *Let's refine the "Shock":* It needs to be compound. Earthquake (infrastructure), Drought (grain), Raiders (loyalty/military).

  *Let's refine the "Teams":* 4 teams of 4 works well.
