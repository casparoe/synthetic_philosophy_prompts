      *   *The Application to the Institute:* We are in a similar transitional phase regarding animal use (food, research, labor). We cannot jump instantly to the ideal (perhaps total non-use), so we must work on regulation, welfare, reduction, and ethical framing while keeping the ultimate ideal in view.
      *   *The Trap to Avoid:* Justifying the status quo as "good enough." The concession is *not* the ideal. It is a step on a ladder.

