      *   **The Role of the Institute (1.5 mins):** What will we actually do? Study history to understand change. Support ethical improvements without claiming perfection.
      *   **Conclusion (1 min):** Call to action. Unity of purpose despite different backgrounds.

  4.  **Drafting - Section by Section (incorporating constraints):**

      *   *Intro:* Welcome Levinson family, scholars, vets. Acknowledge the tension between text and practice.
      *   *The Maimonidean Frame:* Need to explain the sacrifice idea. "Ancient wisdom suggests that when a society is entrenched in a habit, the highest moral authority does not always demand immediate cessation." Instead, it regulates. It meets people where they are. *Specialist check:* Ensure this sounds like the *Guide* III:32 logic (God left the sacrificial service in place but restricted it to wean people off it). *Lay check:* Ensure it sounds like "progressive reform."
