      *   *Modern Context:* We use animals. We can't stop tomorrow. But we must treat current use as transitional, not permanent. Welfare improvements are steps on a ladder, not the roof.
      *   *Institute's Role:* Bridging the gap. Scholars provide the historical mirror; practitioners provide the reality check.
      *   *Closing:* Hope for the future.

