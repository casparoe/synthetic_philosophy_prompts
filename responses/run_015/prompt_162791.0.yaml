answer: |-
  Look, I get why you are frustrated because history classes often hide behind vagueness when you want to bet on a outcome, so I will give you the number straight away. My credence that we land on C or D, meaning a fascist style regime that launches a war of conquest in the East and carries out mass killing on roughly the historical scale, is 0.35. I am landing lower than your estimate because I think you are giving too much credit to the structural pressures and not enough to the specific ideological glue that Hitler provided, but I am not going as low as zero because the trends in Europe were genuinely dark regardless of who was in charge. To break this down for you, we have to look at the chain of events you outlined, starting with the collapse of Weimar itself. On the question of whether Weimar breaks down into some kind of dictatorship without Hitler, I agree with you and your mate that this is almost certain, so I would put that probability at about 0.95. The economic depression, the constitutional flaws involving Article 48, and the hostility of the elites toward democracy meant that some form of authoritarian conservative regime was baked in, so outcome A is basically off the table.

  The next link in the chain is whether that dictatorship is the Nazis specifically rather than some other hard right movement, and this is where the probability drops sharply without Hitler. The NSDAP was a fractious mess before Hitler took over and it relied heavily on his specific charisma and tactical ruthlessness to unify the völkisch movement and outmaneuver the communists and the traditional conservatives. Without him, I think the probability that the Nazis specifically become the dominant party is maybe 0.2. It is more likely that the DNVP or a military dictatorship under someone like Schleicher or Papen takes control, which leads us to your category B, a boringly authoritarian conservative state. These elites were antisemitic and wanted to revise Versailles, but they were not revolutionaries in the Nazi sense. They wanted order and traditional hierarchy, not the total mobilization of society that the Nazis pursued. This brings us to the core of your disagreement, which is whether the genocide still happens with no Hitler. The conservative elites wanted to remove Jews from German society through legal exclusion and forced emigration, which is horrific, but the leap to industrial extermination was driven by Hitler's specific apocalyptic worldview. Without his constant radicalizing pressure, I think the probability of genocide happening on the historical scale is low, maybe 0.15, because the bureaucratic machinery and the ideological will were not automatically present in the general conservative movement.

  Then you have to look at the war, specifically invading the Soviet Union. The traditional German military wanted to regain lost territory in the West and perhaps some influence in the East, but a war of annihilation against Judeo-Bolshevism was Hitler's personal project. A conservative dictatorship might have fought a limited war to revise borders, but the probability of them launching a full scale invasion of the USSR with the intent of extermination is also low, perhaps around 0.3. When you multiply these probabilities together, the chance of getting the specific combination of the Nazi party in power plus the war of annihilation plus the Holocaust drops significantly, which is why my number is 0.35. However, I have to admit that some of this is an artifact of how coarsely you sliced the categories. Your category C includes a fascist style regime that does mass killing, but it does not strictly require it to be the NSDAP. If a military dictatorship radicalized during a war, could they have committed atrocities? Yes. But would it be the Holocaust? Probably not. The category lumps together ideological genocide with wartime brutality, which muddies the water. If you separated industrial genocide from general war crimes, the number for genocide would drop even lower.

  The part of my answer that the final number is most sensitive to is the question of whether the genocide still happens with no Hitler, specifically whether the regime radicalizes once war starts. This is the functionalist argument that your mate is likely making. If you believe that the violence of the war itself would have radicalized any German right wing regime into mass murder regardless of ideology, then the number goes up. If you believe the ideology had to precede the action, then the number stays low. This is exactly where I think the disagreement between you and your mate really lives. Your mate is operating on a structuralist view where German antisemitism and the desire for Eastern expansion were so deep that any right wing government would have eventually triggered the same outcome, making Hitler merely a figurehead for inevitable forces. You are operating on an intentionalist view where Hitler was the unique catalyst who pulled the conservative elites toward a radicalism they would not have chosen themselves. To get from my number to his, you would have to find evidence that the German military and conservative elites were already planning industrial extermination and a total war against the Soviet Union before Hitler consolidated power, or that they were equally committed to it independently of his influence. Since the historical record shows they were often hesitant about his radical plans, I stick with 0.35, but I understand why he sees the momentum of history as unstoppable.
