answer: |-
  **DECISION TREE: JUDICIAL REVIEW LOGIC**

  **1. Do judges have authority to invalidate statutes?**
  *   **NO** → Go to 2
  *   **YES** → Go to 4

  **2. (If NO) What is the primary objection?**
  *   **Democratic** (They weren't elected) → Go to 3
  *   **Epistemic** (They don't know better than MPs) → **LEAF: Unnamed** ("Legislative Epistemic Privilege" — believes politicians are smarter than lawyers, rare)

  **3. (If Democratic) Where is the defect located?**
  *   **Appointment/Tenure** (Life terms are the problem) → **LEAF: Parliamentary Supremacy** (Standard UK/Israel model)
  *   **No Sunset/Re-enactment** (Laws shouldn't be stuck forever) → **LEAF: Unnamed** ("Temporal Supremacy" — objects to permanence, not judges per se)

  **4. (If YES) What is the scope of power?**
  *   **Interpretation Only** (Read laws to fit rights) → **LEAF: Weak-Form/Dialogic** (Sometimes fits here depending on strength)
  *   **Striking Down** (Void the law) → Go to 5

  **5. (If Striking Down) Is the court decision final?**
  *   **YES** (Court has last word) → Go to 7
  *   **NO** (Legislature can respond) → Go to 6

  **6. (If Legislature can respond) How hard is it to override?**
  *   **Simple Majority** (Easy re-enactment) → **LEAF: Weak-Form/Dialogic** (Canada/UK Human Rights model)
  *   **Supermajority** (Hard re-enactment) → **LEAF: Unnamed** ("Qualified Supremacy" — legislature wins but needs 60% votes)

  **7. (If Court Final) Does "representativeness" matter?**
  *   **Electoral Only** (Only votes count) → **LEAF: Popular Constitutionalism** (*Collision Warning*, see below)
  *   **Deliberative/Demographic** (Courts mirror people/think deeper) → Go to 8

  **8. (If Deliberative) Should rulings expire?**
  *   **NO** (Permanent precedent) → **LEAF: Strong Judicial Review** (US Model)
  *   **YES** (Sunset clauses on rulings) → **LEAF: Unnamed** ("Expiring Review" — rights decisions lapse after 5 years)

  ***

  **COLLISIONS & EMPTY BOXES**

  **1. The Popular Constitutionalism Trap**
  Popular Constitutionalism and Parliamentary Supremacy both land in the "No Invalidations" or "Legislature Final" boxes often. The tree struggles to seperate them because the *outcome* is the same (legislature wins), even though the *reason* differs (Popular Const says "the People decide," Parli Supremacy says "the Parliament decides"). They share a leaf unless you add a branch about "Who is the sovereign?" which gets messy.

  **2. Empty/Weird Branches**
  *   **Epistemic Objection to Supremacy:** Almost nobody argues legislatures are smarter than judges as a primary theory; usually it's about votes. This box is technically coherent but politically empty.
  *   **Expiring Review (Sunset):** This is the niche one. It's not incoherent, just unexplored. Imagine a court striking down a law but the ruling dies in 5 years unless renewed. It solves the "dead hand" problem but creates legal instability. Probably toxic for business planning, but logically sound.
  *   **Demographic Mirror Judiciary:** A branch where judges are only valid if they statistically match the population. Unnamed because no system does this formally, though some argue for it in appointments.
