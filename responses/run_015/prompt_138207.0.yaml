      *   The core philosophical/technical problem is the **Indistinguishability of Constraints and Preferences** from behavioral data alone.
      *   In Economics/Philosophy: This is the **Revealed Preference Theory** critique. Specifically, the **Samuelson** assumption that $Choice = Preference$ fails when $Choice = f(Preference, Constraint)$. If you don't know the Constraint, you can't solve for Preference.
