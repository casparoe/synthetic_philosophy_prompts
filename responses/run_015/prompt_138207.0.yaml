      *   *The "Word":* The user wants a word or a carving. "Degeneracy" is good mathematically (different inputs -> same output). "Conflation" is good logically.
      *   *Let's focus on the "Edges":* The edge is where the constraint breaks.
      *   *Case 1 vs 2 vs 3:*
