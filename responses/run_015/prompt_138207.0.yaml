          2.  *The Scripted Worker (Variance vs. Constraint):* Tightly scripted workers look consistent (high confidence). Loose workers look noisy (low confidence). System trusts the scripted worker more. But the scripted worker's behavior reveals less about *preference* (they have no choice) than the noisy worker (who exercises choice).
          3.  *The Window Seat (Proxy vs. True Intent):* Colleague avoids window seat. System infers "prefers aisle." Reality: "avoiding sun." The action is the same, the underlying utility function is different (negative utility of sun vs. positive utility of aisle).
      *   **User's Knowledge:** Knows about "revealed preference" (economics) and "adaptive preference/fox and grapes" (philosophy). Rejects these because the *actual* wants haven't changed, only the *model's picture* of them has.
      *   **The Friend's Claim:** "You can never tell the difference from the outside."
      *   **The Request:** A name (or conceptual carving) for this phenomenon. Are these one thing or three? Where are the edges? How to distinguish preference from constraint?

  2.  **Deconstruct the Three Examples:**
      *   *Example 1 (Stairwell):* This is **Goodhart's Law** meets **Confirmation Bias** meets **Exploration-Exploitation Failure**. Specifically, it's a *self-sealing prophecy* or *model-induced constraint*. The model changes the environment (by not suggesting the alternative), which validates the model.
      *   *Example 2 (Scripted Worker):* This is **Selection Bias** based on **Variance**. It's confusing *consistency of action* with *strength of preference*. In control theory, this is low "degrees of freedom." In causal inference, it's a lack of *variation* needed to identify causality.
      *   *Example 3 (Window Seat):* This is **Confounding**. The observed variable (seat choice) is caused by two potential latent variables (aisle preference OR sun avoidance). The model picks the wrong latent variable. This is the classic **Inverse Reinforcement Learning (IRL)** problem: inferring rewards from behavior is ill-posed without knowing constraints.

  3.  **Identify the Common Thread:**
