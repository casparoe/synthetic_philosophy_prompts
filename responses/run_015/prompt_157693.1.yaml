      *   *Parfit's Point:* Parfit argues Identity isn't what matters. In Teletransporter, he says "Don't worry about Identity, R is preserved." In this case, R is *not* preserved. So Parfit must say "Worry, nothing matters." The Non-Reductionist says "Identity is preserved, so don't worry."
