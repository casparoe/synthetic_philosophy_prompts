  2.  **Deconstruct the Theories:**
      *   **Reductionist (Lockean/Psychological):** Personal identity consists in psychological continuity (memory, character, intentions). If psychology is destroyed, the person dies, even if the body lives.
      *   **Non-Reductionist (Simple View/Ego/Soul-less Identity):** Personal identity is a brute fact, usually tied to the persistence of the specific human organism or a simple substance. If the organism lives, the person lives, regardless of psychological state.
      *   **Animalist (Biological):** A subset of Non-Reductionism usually. We are human animals. If the animal lives, we live.
      *   **The Challenge:** I need a case where the *organism* survives clearly, but the *psychology* is destroyed completely and irreversibly, yet the Non-Reductionist must claim *survival* is what matters (not just biological existence), and the Reductionist must claim *death* (not just diminished quality of life).

