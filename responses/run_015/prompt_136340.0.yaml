      *   *Looseness:* Sapir-Whorf is the weak link.
      *   *Film vs. GEB:* Emotional cost of knowledge.

  10. **Final Review against constraints:** End by saying what the film shows that GEB doesn't. (Check.)

  *(Self-Correction during drafting)*: I need to be careful not to conflate "Outer Message" with "Decoder." In GEB, the Outer Message is part of the signal (the structure), while the Decoder is the receiver. However, the *interpretation* of the Outer Message requires a Decoder. The user's insight is that the Signal *changes* the Decoder. I should validate this as a "Performative Utterance" on a systemic level.

