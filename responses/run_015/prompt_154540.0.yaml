prompt: |-
  Take the 2004 execution of Cameron Todd Willingham in Texas and run it through a "retributive risk framwork" — basically the claim that capital punishment needs both actual desert and an instutional reliability threshold, so the moral risk of killing someone innocent stays below a tolerable level. Don't just rehash the 2009 arson-science report; assume I know the basic timeline. What I want is the careful mapping: who exactly carries the moral risk here (the jury, the forensic experts, the governor?), whether deterrence still works if you model execution as a noisy signal with false positives, and whether the case forces the framwork to collapse into either "never execute" or straight consequentialism. Also say where the framework is silent — for instance, does it say anything about the welfare of the victims' family in this kind of error? Finish with a single line at the very end starting with "Verdict:" that says whether the episode supports, undermines, or just complicates the framework.
