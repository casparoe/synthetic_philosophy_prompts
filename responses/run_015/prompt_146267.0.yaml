answer: |-
  Good morning, everyone. Welcome.

  I'll be honest, I've been staring at the agenda for this workshop—"After the Fall"—and I keep getting stuck on the word "Fall." It implies a gravity that maybe isn't there. Like something standing up straight that suddenly hits the ground. But looking around this room, I realize we have very different ideas about what was standing up in the first place.

  We've got people here who spend their lives in the dust of the Late Bronze Age. We've got Maya specialists. Someone here knows Rapa Nui better than I know my own neighborhood. And then we've got the climate resilience team, who are here because they need us to understand what happens when systems break, so they can warn us about doing it again.

  I'm not an expert. I just run the programs. But I've been wondering if "collapse" is even the right kind of word. We treat societies like they're objects, like a vase that can shatter. But maybe they're more like... water. If you freeze water, it's not that the liquid failed. It just stopped being liquid.

  I used to think collapse was obvious. Something breaks, people suffer, end of story. But then I started wondering what kind of thing has to exist for failure to even be possible? 

  Take the Bronze Age. When the palace bureaucracies vanished, did those societies collapse? Or did they just stop being the kind of thing that *has* a palace bureaucracy? Once you've lost that central authority, you're not in the same category anymore. You can't fall over if you're already sitting on the ground. 

  Same with the Maya lowlands. It's not that they failed, it's that they stopped being a centralized state. And centralized-state failure modes dont apply to decentralized communities. Even Easter Island... maybe it wasn't a society falling over like a tree. Maybe it was a community changing its resource base and social form so fundamentally that the old rules stopped making sense.

  But here's where I get nervous. I don't want to sound like I'm playing word games. I don't want to sit here and tell the archaeologists their work is just semantics. And I certainly dont want to tell the policy folks that the warnings they're trying to issue are based on a misunderstanding.

  Because people clearly died. Cities emptied. Knowledge was lost. The experience was catastrophic for individuals even if the "collapse" is a retrospective label we slap on to make sense of discontinuity. For the person living through it, it doesn't matter if it's a category error. It feels like the end of the world. The pain was real.

  So I guess what I'm hoping for today is that we hold that tension. That collapse might be the wrong word for the system, but it's the right word for the person starving. That the Bronze Age systems didn't collapse, they transformed, but the transformation was violent and messy. 

  I don't want us to leave here with a settled opinion. I want us to leave here knowing why we disagree. If we can figure out what kind of thing a society has to be for it to "fall," maybe we understand what we're trying to save today. 

  So, let's not lecture each other. Let's think out loud. Thank you for being here.
