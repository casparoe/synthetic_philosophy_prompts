answer: |-
  The trend in contemporary historiography to decenter the human is understandable. For centuries, history was the biography of kings and generals, a narrative stream where human will seemed to dictate the flow of time. In reaction, scholars have turned to the *Annales* school's longue durée and new materialist philosophies, proposing that germs, climate shifts, and volcanic eruptions should be counted as "historical actors" with their own agency. This approach promises to explain the contingencies that human-centered history misses: why empires crumble despite strong leadership, or why revolutions ignite in times of plenty. However, this theoretical maneuver is not merely an expansion of the historical cast; it is a category error. Attributing agency to non-human forces is environmental determinism in a fancy mask. While non-human forces possess immense causal power, they lack the capacity for interventionist causation required for true agency. Consequently, treating them as actors collapses into blind mechanism and, more dangerously, lets human societies off the hook for their political and ethical responses to disaster.

  To understand why the "actor" metaphor fails, we must distinguish between *narrative protagonism* and *interventionist causation*. Narrative protagonism is a literary function: an entity drives the plot, forcing other characters to react. In this sense, a volcano certainly acts like a protagonist. It erupts, cities are buried, and the course of civilization shifts. However, interventionist causation is a functional test: if you wiggle the cause, does the effect shift in a predictable, negotiable way? More importantly, can the cause be held accountable or influenced by policy? Human agents possess both. We drive the plot, but we can also be reasoned with, sanctioned, or voted out. Non-human forces possess only narrative protagonism. We cannot negotiate with a virus, sanction a tectonic plate, or vote out a drought. When historians conflate narrative impact with agency, they obscure the fundamental asymmetry of history: humans are the only entities capable of responding to constraints with policy. To grant a virus "agency" is to imply a symmetry of relationship that does not exist, masking the mechanistic reality of biology behind a story of conflict.

  Nowhere is this distinction more critical than in the edge case of a pathogen evolving traits that specifically exploit medieval Silk Road trade networks. A proponent of non-human agency might argue that the pathogen is a strategic actor, "choosing" to mutate in a way that leverages human infrastructure to maximize its spread. This sounds compellingly like a military campaign. However, this is mechanistic causation with a story wrapped around it. The pathogen does not "exploit" the Silk Road in the sense of recognizing the network and formulating a plan; it undergoes random mutation, and those variants that happen to survive in high-traffic zones proliferate. The "strategy" is a post-hoc imposition by the historian, not a property of the germ.

  The true agency in this scenario lies in the construction of the Silk Road itself. The trade network was a human decision, a political and economic architecture that created the niche the pathogen filled. If we label the pathogen an "actor," we shift the focus from the human decisions that made the spread possible (lack of quarantine, density of caravanserais, speed of travel) to the biological inevitability of the microbe. The pathogen is a mechanism reacting to environmental pressures created by humans. Calling it an agent suggests a duel between two wills, when in reality, it is a human system failing to account for biological mechanics. The "wiggle" test proves this: you cannot wiggle the germ's intent, because it has none. You can only wiggle the human trade policies. Therefore, the germ is a condition of the environment, not a participant in the history.

  The risk of ignoring this distinction is not merely semantic; it is ethical. If we grant agency to climate shifts or germs, we risk depoliticizing disaster. Consider a famine caused by drought. If the drought is an "actor" that "caused" the famine, the narrative focuses on the climatic antagonist. But as Amartya Sen demonstrated, famines are rarely caused solely by food shortages; they are caused by failures in entitlement and distribution. By elevating the drought to the status of a historical agent, we subtly absolve the governing bodies that failed to store grain, manage water, or distribute aid. The "agency" of the non-human becomes a shield for the negligence of the human. This is the "fancy mask" of determinism: it suggests that because the environment exerted pressure, the human outcome was inevitable. It turns political failures into acts of God.

  Defenders of this approach argue that acknowledging non-human agency highlights human vulnerability and humility. They claim it prevents the arrogance of assuming we control our destiny. But humility should not come at the cost of accountability. We can acknowledge the overwhelming power of a volcanic eruption without granting it the status of a historical subject. We can admit that the Little Ice Age constrained agriculture without suggesting the climate "waged war" on Europe. To do otherwise is to surrender the core project of history, which is to understand how humans navigate constraints. If the constraints are elevated to the status of actors, the human response becomes secondary, a mere reaction to the "real" drivers of history.

  Ultimately, the metaphor of non-human agency collapses under scrutiny because it cannot sustain the weight of interventionist causation. A pathogen exploiting the Silk Road is not a strategist; it is a biological mechanism filling a vacuum created by human commerce. A volcano is not a protagonist; it is a geological event that tests human resilience. To call them actors is to indulge in a poetic anthropomorphism that obscures the locus of responsibility. History is not the study of what happens to us; it is the study of what we do about what happens to us. If we allow the environment to claim agency, we strip ourselves of the responsibility to respond. We must reject the actor-metaphor not to deny the power of nature, but to preserve the necessity of human accountability. The wind may drive the ship, but only the captain steers it, and only the captain is to blame when it crashes.
