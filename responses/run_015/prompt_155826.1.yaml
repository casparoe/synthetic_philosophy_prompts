answer: |-
  ### Audit of Propositions on Empire and Political Economy

  **Primary Fault: The Theory of Justice (Propositions 4 vs. 5)**
  *Severity: Critical*

  *   **The Tension:** Proposition (5) defines justice as "forward-looking" and explicitly denies that the historical origin of gains (luck or unequal bargaining) is an inherent objection. Proposition (4) asserts "duties of repair" that persist regardless of time or the ability to trace specific gainers. These are incompatible frameworks. If justice is purely a property of the structure going forward (5), then past injustice creates a duty *only* insofar as it distorts the current structure. If the duty persists independently of tracing or current structural disadvantage (4), then justice is partially backward-looking (historical entitlement). You cannot claim the duty survives the "difficulty of tracing particular gainers" (4) while simultaneously claiming that the "bare fact that one party captured most of the gains... is, by itself, an objection" only if it violates forward-looking rules (5).
  *   **What Must Be Given Up:**
      *   *To save (5):* You must weaken (4). Duties of repair would become contingent on demonstrating current structural disadvantage caused by the past, rather than persisting as a moral debt regardless of current status.
      *   *Cost:* This converts your position from "reparative justice" to standard "social democracy." It undermines the claim in (3) that the injustice grounds duties *independently* of the economic ledger or current outcomes.
      *   *To save (4):* You must weaken (5). You must admit that historical coercion creates a moral stain that forward-looking efficiency cannot wash away.
      *   *Cost:* You lose the shield against libertarian critiques of redistribution. You become vulnerable to the claim that you are punishing current citizens for the sins of ancestors (the "luck" you say is not an objection in 5).
  *   **Resolution Cost:** High. This requires rethinking your foundational moral philosophy, not just your policy preferences.

  **Secondary Fault: The Means of Political Economy (Propositions 1 vs. 4)**
  *Severity: Moderate*

  *   **The Tension:** Proposition (1) expresses a distrust of "industrial policy" and state-directed capital allocation based on Smithian efficiency. Proposition (4) insists on "duties of repair." Effective repair for "dispossession" and "conquest" (3) often requires targeted state intervention (land reform, targeted investment, preferential access) that looks indistinguishable from the "industrial policy" or "privileged channels" you distrust in (1).
  *   **What Must Be Given Up:**
      *   *To save (1):* You must limit "repair" to neutral cash transfers or general institutional reform.
      *   *Cost:* This may render the repair insufficient to address "dispossession" (3), which is often specific (land, specific industry destruction).
      *   *To save (4):* You must carve out an exception to (1) for rectification.
      *   *Cost:* This opens a loophole in your anti-mercantilist stance. If the state can direct capital for "repair," what prevents it from directing capital for "national interest" under another name?
  *   **Resolution Cost:** Medium. This is a policy implementation conflict rather than a philosophical contradiction.

  **Tertiary Fault: The Rhetorical Anchor (Propositions 2 vs. 7)**
  *Severity: Low*

  *   **The Tension:** Proposition (2) argues the nation *would have been richer* without empire (an empirical economic claim). Proposition (7) argues the moral verdict stands *even if the ledger had come out the other way*. While logically consistent (you are covering both bases), rhetorically they undermine each other. If (7) is true, the empirical effort in (2) is unnecessary for the moral conclusion. If (2) is your main persuasive hook for political economists, (7) weakens the stakes.
  *   **What Must Be Given Up:**
      *   *To save (2):* Emphasize the economic loss as the primary pragmatic argument.
      *   *Cost:* You become vulnerable to new economic history that suggests empire *was* profitable.
      *   *To save (7):* Downgrade (2) to a contingent observation.
      *   *Cost:* You lose the powerful Smithian "common interest" argument that aligns the metropole's wallet with the colony's freedom.
  *   **Resolution Cost:** Low. This is a matter of emphasis, not logic.

  ***

  ### The Single Revision

  **Revise Proposition (5).**

  The current phrasing of (5) is too rigidly "forward-looking" to sustain the "backward-looking" duties in (4). It creates the appearance that you believe market outcomes are morally neutral regardless of their origin, which contradicts the claim that empire (a non-market, coercive origin) generates specific duties.

  **Proposed Text for (5):**
  > "On distributive justice generally, I am a forward-looking institutionalist: justice is a property of a structure going forward. However, **where that structure rests on a foundation of coercive appropriation rather than bargained exchange,** the luck-sensitivity of market outcomes and the capture of gains **are** objections that demand rectification."

  **Why This Cleans Up the Most:**
  1.  **Resolves the Critical Fault:** It aligns (5) with (3) and (4) by distinguishing between *market luck* (which you accept) and *coercive history* (which you reject). It allows you to maintain forward-looking institutionalism without denying backward-looking duties.
  2.  **Protects Proposition (1):** It limits the exception to cases of "coercive appropriation," preventing the loophole from swallowing your general distrust of industrial policy.
  3.  **Preserves the Smithian Peg:** It mirrors Smith's own distinction between the "natural progress of opulence" (market) and the "unnatural" retrograde movement caused by mercantile coercion (empire).
