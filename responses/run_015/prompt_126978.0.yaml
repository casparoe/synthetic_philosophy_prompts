prompt: |-
  I recently found myself in a prolonged disagreement with a close friend about whether a technically crude but emotionally direct community mural could be considered greater art than a meticulously executed gallery installation that left us both feeling nothing — a dispute that replayed, in modern terms, Tolstoy’s well-known distinction between genuine art and counterfeit art, though with complications his framework seems ill-equipped to handle. Before I commit to any particular view, I want the full specification. Write the desiderata that an adequate normative theory of artistic value must meet if it is to take seriously Tolstoy’s central claim that art is essentially a means of transmitting feeling in service of human fraternity, while also accommodating what I will call moral resonance asymmetry: the phenomenon whereby an artwork intended to foster brotherly love in one interpretive community produces alienation or moral revulsion in another without being technically defective or emotionally inauthentic.

  For each desideratum, provide the motivating case or conceptual consideration — which artistic phenomena it must account for (such as the dismissal of technically masterful but emotionally hollow productions that Tolstoy classifies as counterfeit), which distinctions it must preserve (for instance, between emotional authenticity and emotional efficacy, or between universal accessibility and culturally situated reception), and which findings from moral psychology or aesthetics it must not contradict. Clearly flag which requirements you take to be non-negotiable and which are preferences of particular camps, and identify any subset of desiderata that appear jointly unsatisfiable — I am especially interested in whether a theory can simultaneously require universal emotional transmission and full sensitivity to moral resonance asymmetry without internal contradiction. Keep the weight on the criteria and their tensions rather than on a comprehensive scorecard, though I would like a brief indication of how Tolstoy’s own moralist theory, a formalist position that denies moral content any artistic relevance, and a pluralist account that treats emotional transmission as one artistic value among many fare against your list.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Core Task:** Write the *desiderata* (criteria/requirements) for an adequate normative theory of artistic value.
      *   **Specific Constraints:**
          *   Must take seriously Tolstoy's central claim (Art = transmission of feeling for human fraternity).
          *   Must accommodate "Moral Resonance Asymmetry" (MRA): Art intended for brotherly love in Community A causes alienation/revulsion in Community B, without being technically defective or inauthentic.
          *   For each desideratum: Provide motivating cases, conceptual distinctions to preserve, and findings from moral psychology/aesthetics to respect.
          *   Flag non-negotiable vs. preference-based requirements.
          *   Identify jointly unsatisfiable subsets (tensions/contradictions).
          *   Specifically address the tension between *universal emotional transmission* and *full sensitivity to MRA*.
          *   Briefly evaluate three theories against these desiderata: Tolstoy's Moralist Theory, Formalism, and Pluralism.
          *   **Tone/Style:** Philosophical, rigorous, analytical, focused on criteria and tensions rather than a final verdict.

  2.  **Deconstruct the Core Concepts:**
      *   **Tolstoy's Theory (from *What Is Art?*):** Art is not about beauty or skill, but about "infection" (transmitting feeling). The *content* of the feeling matters: it must promote religious consciousness/human fraternity. Counterfeit art is skilled but lacks this infectious moral feeling.
      *   **Moral Resonance Asymmetry (MRA):** This is the user's specific complication. It challenges Tolstoy's universalism. If Art X promotes fraternity in Group 1 but causes revulsion in Group 2, is it "good art" by Tolstoy's standards? Tolstoy would likely say the feeling isn't *true* religious feeling if it divides. But the prompt asks for a theory that *accommodates* this phenomenon without dismissing the art as technically defective or inauthentic.
      *   **Normative Theory of Artistic Value:** A framework for judging what makes art *good* (not just what makes it *art*).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: The Transmission Condition.* (Based on Tolstoy). Art must involve the communication of affect.
          *   *Motivation:* Distinguishes art from mere craft or decoration. Accounts for the "hollow gallery installation."
          *   *Distinction:* Authenticity vs. Efficacy.
      *   *Desideratum 2: The Fraternity Condition.* (Based on Tolstoy). The feeling transmitted must unite, not divide.
          *   *Motivation:* Tolstoy's core moral claim.
          *   *Tension:* This clashes directly with MRA.
      *   *Desideratum 3: The Contextual Sensitivity Condition.* (Based on MRA). The theory must account for the receiver's cultural/moral framework.
          *   *Motivation:* Explains why the mural works for one group and not the other.
          *   *Finding:* Moral psychology (Haidt, etc.) shows moral intuitions vary by culture.
      *   *Desideratum 4: The Technical/Expressive Independence Condition.* (Based on the prompt's constraint). A work can be technically crude but valuable, or technically masterful but hollow. But also, a work can be authentic yet fail to resonate due to MRA.
          *   *Motivation:* The "crude mural" vs. "meticulous installation."
      *   *Desideratum 5: The Non-Contradiction Condition.* (Meta-requirement). The theory shouldn't demand mutually exclusive states.

  4.  **Refining the Tensions (The "Jointly Unsatisfiable" Subset):**
      *   The prompt specifically asks about the tension between *Universal Emotional Transmission* (Tolstoy's ideal) and *Full Sensitivity to MRA* (The user's complication).
      *   *Analysis:* If art *must* unite everyone (Universal), then MRA implies the art is bad. If art's value depends on the specific reception (MRA), then Universal Transmission is impossible.
      *   *Conclusion:* These two are likely jointly unsatisfiable in their strongest forms. A theory must weaken one.

  5.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the depth of the prompt and the specific tension (Tolstoy vs. MRA).
      *   **Section 1: The Desiderata.** List them clearly with Motivating Case, Conceptual Distinctions, and Empirical Constraints. Flag Non-Negotiable vs. Contingent.
      *   **Section 2: The Tension Analysis.** Specifically address the "Universal Transmission vs. MRA" contradiction.
      *   **Section 3: Theoretical Scorecard.** Briefly evaluate Tolstoy, Formalism, and Pluralism against the list.
      *   **Conclusion:** Summary of the impasse.

  6.  **Drafting Content - Specific Considerations:**
      *   *Tolstoy's "Counterfeit":* Need to ensure the theory explains why the "meticulous installation" fails (lack of infection) without relying solely on technical skill.
      *   *MRA:* Need to ensure the theory doesn't just say "the offended group is wrong." It must acknowledge the alienation is real and relevant to value.
      *   *Moral Psychology:* Reference the variability of moral foundations (Care/Harm, Fairness/Cheating, Loyalty/Betrayal, Authority/Subversion, Sanctity/Degradation). This explains MRA.
      *   *Non-Negotiable:* The Transmission Condition (otherwise it's not Tolstoyan). The MRA Accommodation (otherwise it ignores the prompt's core problem).
      *   *Unsatisfiable:* Strong Universalism + Strong Contextualism.

  7.  **Refining the "Non-Negotiable" Flags:**
      *   To take Tolstoy seriously, *Transmission* is non-negotiable.
      *   To accommodate MRA, *Contextual Sensitivity* is non-negotiable.
      *   *Fraternity* is the tricky one. If we make it non-negotiable in Tolstoy's strong sense, MRA breaks it. So, *Fraternity* might need to be redefined as a *preference* or a *graded* value rather than a binary condition. Let's mark "Universal Fraternity" as the tension point.

  8.  **Self-Correction/Review during drafting:**
