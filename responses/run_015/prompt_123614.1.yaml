prompt: |-
  I retired from physics about five years ago and lately I've been trying to catch up on philosphy of mind, mostly through old books and some random blogs. Last week I was chatting with a friend about that story in The Mind's I where Einstein's brain gets kept in a jar and scientists talk to it through microphones. Then we read this summary that tries to combine it with the book idea: apparently Hofstadter asks what happens if you copy every neuron of Einstein's brain into a massive printed encylopedia—like, page after page listing exactly what each cell would do—so that flipping through in the right order gives you Einstein's responses. The blogger claims Hofstadter's point is that this book literally IS Einstein, consciousness included, because consciousness is just input-output mapping with no special biology required. They also say Dennett uses this same example to dissolve the hard problem: if the encyclopedia has all the functional roles, there's no leftover mystery about what it's like. Then they bring in integrated information theory and argue the book actually has phi near zero since paper pages don't causally integrate information, so IIT saves us from the absurd conclusion and proves functionalism wrong. They finish by saying since we wouldn't bury the encyclopedia with full honors, Hofstadter must be wrong. I'm pretty lost. Is this summary fair to the actual story and to what Dennett and Hofstadter think? Which parts are accurate, which ones conflate this with the Chinese Room, and does that IIT objection actually hit the argument? And does their final intuition about burial ceremonies actually refute anything?
