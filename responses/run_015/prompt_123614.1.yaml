answer: |-
  It is completely understandable that you feel lost. The blog summary you read is a classic example of what philosophers call a "smoothie argument": it blends several distinct thought experiments, attributes views to authors that they don't actually hold, and treats intuition as proof.

  Given your background in physics, you will likely appreciate that the blog commits a category error similar to confusing a **Hamiltonian** (the rules of dynamics) with a **phase space trajectory** (a static record of where a particle went).

  Here is a breakdown of what is accurate, what is conflated, and where the argument fails.

  ### 1. The Source Material: *The Mind's I* and the "Encyclopedia"
  **The Blog Claim:** Hofstadter asks what happens if you copy Einstein's neurons into a printed encyclopedia, and claims this book *is* Einstein.
  **The Reality:** This is a significant distortion.

  *   **The Story:** In *The Mind's I* (1981), co-edited by Hofstadter and Dennett, there is indeed a piece about Einstein's brain being kept in a jar (based on the real-life theft of Einstein's brain by Thomas Harvey). However, the "Encyclopedia of Neurons" thought experiment is more closely associated with **Ned Block** (his "Blockhead" argument) or **John Searle** (Chinese Room), not Hofstadter's positive view.
  *   **Hofstadter's View:** Hofstadter is a functionalist, but he is a *dynamic* functionalist. He argues that consciousness arises from "Strange Loops"—recursive, self-referential causal structures (like a Gödelian knot). A static encyclopedia is just a lookup table. It contains the *map*, but it is not the *territory*. It lacks the causal dynamics. Hofstadter would almost certainly agree that a book sitting on a shelf is not conscious, because nothing is *happening*.
  *   **The Physics Analogy:** The blog treats the encyclopedia like a static snapshot of a wave function and claims it *is* the particle dynamics. Hofstadter cares about the Schrödinger equation (the process), not just the eigenstates (the outputs).

  ### 2. The Conflation with the Chinese Room
  **The Blog Claim:** The blogger treats this as Hofstadter's argument for functionalism.
  **The Reality:** This conflates the **proponent** with the **critic**.

  *   **Searle & Block:** They use the "Lookup Table" or "Chinese Room" argument to *attack* Functionalism. They say: "If you think mind is just input-output mapping, then this book should be conscious. But the book is obviously not conscious. Therefore, mind is not just input-output mapping."
  *   **The Blog's Error:** The blog attributes the "Book = Einstein" claim to Hofstadter (the functionalist) and then knocks it down. In reality, Hofstadter would likely agree with the critique that a static book isn't conscious. He argues that you need the *causal machinery* to run the program, not just the printout of the code.
  *   **Dennett:** Dennett is more radical. He might argue that if the book were *used* correctly (scanned by a mechanism that triggered responses), the *system* (book + scanner + environment) could have intentionality. But the book alone? No.

  ### 3. The IIT Objection (Integrated Information Theory)
  **The Blog Claim:** IIT proves the book has $\Phi \approx 0$ because paper pages don't causally integrate, so Functionalism is wrong.
  **The Reality:** This is the most technically accurate part of the blog, but the conclusion is too broad.

  *   **The IIT Point:** IIT (championed by Giulio Tononi) posits that consciousness requires **causal power**. A system must constrain its own past and future states more than the sum of its parts. A book is passive. It has no internal causal glue. Its $\Phi$ (Phi) is indeed zero.
  *   **Does it refute Functionalism?** It refutes **Lookup Table Functionalism**. However, most sophisticated functionalists (including Dennett) do not claim that a static table is a mind. They claim that a *running computation* is a mind. A running computer has causal integration; a book does not.
  *   **Verdict:** The blogger uses IIT to kill a strawman. IIT successfully argues that a book isn't conscious, but that doesn't disprove the idea that a *silicon chip running a simulation* of Einstein could be conscious.

  ### 4. The "Burial Ceremony" Intuition
  **The Blog Claim:** Since we wouldn't bury the encyclopedia with honors, Hofstadter is wrong.
  **The Reality:** This is philosophically weak.

  *   **Intuition Pumps:** Dennett specifically coined the term "intuition pump" to describe thought experiments that rely on gut feelings rather than logic. He argues our intuitions about "personhood" are evolutionary hacks, not ontological truths.
  *   **The Category Error:** Whether we bury something with honors is a sociological fact, not a metaphysical one. We don't bury murder victims with full honors if they died alone; that doesn't mean they weren't persons. Conversely, we might bury a flag with honors; that doesn't make the flag a person.
  *   **Verdict:** This is an appeal to emotion. It carries no weight in a rigorous philosophical argument.

  ### Summary for a Physicist
  If we translate this into terms closer to your background:

  1.  **The Blog's Argument:** "If you print out the state of every particle in a star, the paper is the star. But the paper doesn't burn, so Functionalism is false."
  2.  **The Error:** Functionalism claims the *dynamics* are what matter, not the printout.
  3.  **Hofstadter/Dennett:** They believe if you build a machine that *processes* those rules (the Hamiltonian), you get the star (consciousness).
  4.  **IIT:** Correctly points out the paper has no energy flow (causal integration), but misses that a machine reading the paper might.
  5.  **Burial:** Irrelevant data.

  ### Recommendations for Catching Up
  Since you are coming from physics, you might appreciate authors who respect rigor and mechanism over "mysteries."

  1.  **Daniel Dennett:** *Consciousness Explained* (1991) or *From Bacteria to Bach and Back* (2017). Dennett is the "no magic" option. He dissolves the Hard Problem rather than solving it.
  2.  **David Chalmers:** *The Conscious Mind* (1996). Read this to understand the "Hard Problem" side (the view the blog was trying to attack). Chalmers is rigorous, even if you disagree with his dualism.
  3.  **Giulio Tononi:** *Phi: A Voyage from the Brain to the Soul* (2012). Written for a general audience, but explains IIT without the heavy math.
  4.  **Patricia Churchland:** *Neurophilosophy* (1986) or newer works. She represents the "Neurophilosophy" angle—mind is what the brain does, stop looking for ghosts.

  **Final Verdict:** The blog post was a "philosophical smoothie." It got the IIT math roughly right regarding the book, but it misattributed the "Book = Mind" claim to Hofstadter (who would likely disagree), conflated distinct arguments (Blockhead vs. Strange Loops), and used a sociological intuition (burial) to settle a metaphysical question. You are right to be skeptical.
