answer: |-
  Your discomfort is entirely justified. In fact, your intuition that something is logically "smuggled in" is spot-on. Your friend is making a very common mistake when interpreting David Lewis, one that Lewis himself spent a great deal of time correcting.

  While your friend is right that Lewis believes other worlds are **concrete and real**, he is wrong about what that implies for **identity**.

  Here is exactly where your friend's argument breaks down, according to Lewis's own system.

  ### 1. The Error: Trans-World Identity vs. Counterpart Theory
  The core of your friend's argument relies on **Trans-World Identity**. This is the idea that *you*—the very same individual entity—exist in multiple worlds, just wearing different clothes or making different choices. If this were true, your friend's claim would hold: "You" are spread out across reality, so some part of "you" is indeed a billionaire.

  **Lewis explicitly rejects Trans-World Identity.**

  According to Lewis, you are **world-bound**. You exist in exactly one world (this one). You are spatiotemporally located *here* and *now*. You cannot be in another world any more than you can be in two places at once in this world.

  So, if you aren't in that other world, who is? Lewis proposes **Counterpart Theory**.
  *   In that other concrete world, there exists a person who resembles you very closely. They share your origins, your psychology, and your physical traits.
  *   Lewis calls this person your **counterpart**.
  *   When we say, "You could have been a billionaire," Lewis translates this as: "There exists a **counterpart** of you in another world who is a billionaire."

  **The Logical Break:**
  Your friend is conflating *having a counterpart who is X* with *being X*.
  *   **Friend's Claim:** "You are a billionaire (in another world)."
  *   **Lewis's Claim:** "You are a person who has a counterpart that is a billionaire."

  These are not the same property. To use an analogy: You might have an identical twin brother living in another country who is a billionaire. He is flesh and blood, just as real as you. But does that mean *you* are a billionaire "in a sense"? No. He has the money; you have the relation of *brotherhood* to him. You cannot spend his money.

  ### 2. The Indexicality of "Actual"
  Your friend is also slipping up on how Lewis defines the word "actual."

  For Lewis, "actual" is an **indexical** term, like "here" or "now."
  *   When I say "here," I mean where I am standing. I don't mean Paris, even though Paris is real.
  *   When I say "now," I mean this moment. I don't mean 1995, even though 1995 is real.
  *   When I say "actual," I mean **this world**.

  Lewis agrees that other worlds are *real*, but they are not *actual* (from our perspective). The billionaire counterpart lives in a world that is real, but for him, *his* world is actual and *ours* is merely possible.

  Because "actual" is indexical, you cannot step outside your index to claim the properties of another. You are stuck in the "here" of this world. The billionaire counterpart is stuck in the "there" of his world. There is no bridge that allows the property of "wealth" to transfer across the indexical divide.

  ### 3. The "Mass Murderer" Reductio
  Your intuition about the mass murderer is the strongest argument against your friend's position, and Lewis would agree with you.

  If your friend's logic were true (that you literally possess the properties of your counterparts), then moral responsibility would collapse.
  *   **Friend's Logic:** "In some world, you are a murderer. Therefore, you are a murderer."
  *   **Lewis's Logic:** "In some world, a counterpart of you is a murderer. You are not."

  Lewis's system preserves moral responsibility precisely because you are world-bound. You are only responsible for the causal effects you generate in *this* spatiotemporal system. The fact that a counterpart of you committed a crime in a causally isolated universe has no bearing on your moral record, just as the fact that a counterpart of you won the Nobel Prize doesn't go on your CV.

  If your friend's view were correct, we would all be a chaotic amalgamation of every possible moral permutation of ourselves. We would be saints and sinners, billionaires and paupers, simultaneously. Lewis avoids this messy conclusion by insisting that **we are only ourselves.**

  ### 4. Why It Feels Tempting (and Why You're Not Just a Sore Loser)
  You asked if you're just being a sore loser about your cousin. You aren't. The reason your friend's argument feels tempting is that Lewis's Modal Realism is so radical. By making other worlds **concrete**, it triggers our intuition that "real things affect me."

  Usually, when we talk about "possible worlds" (like in standard modal logic), they are abstract descriptions or stories. If I say, "In a possible world, I'm rich," it's clearly fiction. But Lewis says, "No, that world is flesh and blood!" This makes it feel like the wealth should be accessible or attributable to you.

  But Lewis adds the constraint of **Spatiotemporal Isolation**.
  *   The other world is real, **BUT** it is causally disconnected from ours.
  *   No information, matter, or money can travel between worlds.

  So, even if we ignored the Counterpart Theory error and pretended you *were* literally in that other world, the **Isolation** clause still prevents the "consolation." You cannot access the resources of a causally isolated universe. Being a billionaire in a universe you can never interact with is functionally identical to not being a billionaire at all.

  ### Summary
  Your friend is misapplying Lewis in two specific ways:
  1.  **Ontological:** He assumes Trans-World Identity (that *you* are there), whereas Lewis argues for Counterpart Theory (that a *duplicate* is there).
  2.  **Pragmatic:** He ignores Spatiotemporal Isolation. Even if the other world is real, its resources are permanently inaccessible to you.

  Lewis's modal realism makes the *worlds* real, but it does not make the *properties* of those worlds transferable to you. You are not a billionaire; you are a person who has a billionaire counterpart. And as you correctly sensed, that is not something worth celebrating over your cousin's actual, tangible success.

  Your discomfort is philosophically sound. You have correctly identified that your friend is trying to have his cake (concrete realism) and eat it too (trans-world identity), which Lewis's system strictly forbids.
