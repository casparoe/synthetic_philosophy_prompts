  Answer in British English as exactly five numbered points, none longer than two sentences, with no preamble and no closing summary. Points one to three should carry the three claims in my vocabulary, each also stating whether it translated cleanly or only under some distortion; point four should set out what has no counterpart in my vocabulary at all; point five should say whether that residue is a real blind spot in how I model populations, and what it is, or a sign that Kierkegaard's critique depends on a notion of inwardness or accountability that his prose leaves doing unacknowledged work. Do not pass off assumptions native to my framework as translation.
