  We pass the heavy cup to the right.
  Two strangers act without command.
  It is simply the obvious right.
  A single lamp provides the light.
  The choice rests in an open hand.
  We pass the heavy cup to the right.
  The room fills up beneath the light.
  None wish to break the unseen band.
  It is simply the usual right.
  All eyes follow the cup's bright flight.
  A stranger scolds the one who stands.
  We pass the heavy cup to the right.
  No stake held in the passing light.
  Yet anger rises off the land.
  It is simply the claimed right.
  Newcomers learn the rule by sight.
  They feel the weight upon the hand.
  We pass the heavy cup to the right.
  It is simply the owed right.

  The final stage remains the same kind of thing as the first, because both are ultimately sustained by mutual expectations rather than intrinsic moral properties. The poem leans toward this continuity by maintaining the strict villanelle form and the invariant behavior across all stanzas, suggesting that the underlying structure of expectation persists even as the vocabulary of justification shifts from observation to obligation. A participant in the seminar could reasonably reject this reading by arguing that the phenomenological experience of feeling bound by a norm is qualitatively different from merely following a salient solution, and that the poem's formal unity masks the genuine motivational break that occurs when internalization transforms a convention into a duty.
