answer: |-
  # Decision Tree: The Language of Thought Hypothesis

  **Root:** Cognition is computation over representational vehicles.

  1.  **Is the primary explanatory target the *productivity and systematicity* of thought?**
      *   **YES:** (Structure is required to explain how we think infinite thoughts.)
          2.  **Do the vehicles have discrete, reusable constituents?**
              *   **YES:** (Classical Combinatorics.)
                  3.  **Must the format be propositional (sentence-like)?**
                      *   **YES:** (Sentential Format.)
                          4.  **Is the vehicle distinct from public natural language?**
                              *   **YES:** ➔ **Classic Mentalese**
                                  *   *Awkward Commitment:* Commits to an innate, universal grammar unrelated to any spoken tongue.
                              *   **NO:** ➔ **Public Language LOT**
                                  *   *Awkward Commitment:* Commits to thinking being impossible without prior language acquisition.
                      *   **NO:** (Map-like/Depictive Format.)
                          5.  **Do structured representations show up in perception/imagery?**
                              *   **YES:** ➔ **Perceptual Symbols**
                                  *   *Awkward Commitment:* Commits to modal simulation being sufficient for abstract logical inference.
                              *   **NO:** ➔ **Unnamed**
                                  *   *Awkward Commitment:* Commits to a map format that never interfaces with sensory input (Unwritten/Unattractive).
              *   **NO:** (Holistic or Distributed Vehicles.)
                  6.  **Does a distributed/vector implementation count as "language-like"?**
                      *   **YES:** ➔ **Vector Symbolic Architectures**
                          *   *Awkward Commitment:* Commits to high-dimensional geometry doing the work of logical rules.
                      *   **NO:** ➔ **Pure Connectionism**
                          *   *Awkward Commitment:* Commits to systematicity being an illusion or emergent trick.
      *   **NO:** (Structure is not the main point; Content or Phenomenology is.)
          7.  **Is representation needed to ground *truth-conditional content*?**
              *   **YES:** ➔ **Teleosemantic LOT**
                  *   *Awkward Commitment:* Commits to biological function fixing meaning even if syntax is absent.
              *   **NO:** ➔ **Anti-representationalism**
                  *   *Awkward Commitment:* Commits to cognition being explainable without referencing what thoughts are *about*.

  ***

  ### Messy Boundaries & Unoccupied Regions

  **Indistinguishable Leaves:**
  It is difficult to empirically separate **Perceptual Symbols** from **Vector Symbolic Architectures**; both claim compositionality without classical syntax, often differing only in whether they emphasize sensory simulation or mathematical geometry.

  **Unoccupied Answer Combinations:**
  1.  **Public Language LOT + No Constituents:** *Incoherent.* Public natural language is inherently constituent-structured; denying constituents while affirming public language contradicts the definition.
  2.  **Anti-representationalism + Systematicity Focus:** *Incoherent.* If one admits systematicity is the target to explain, it is nearly impossible to do so without positing some form of structured representation.
  3.  **Unnamed (Central-Only Maps):** *Unwritten.* While some argue for map-like reasoning, no one seriously argues these maps exist *only* in central reasoning without perceptual grounding.
