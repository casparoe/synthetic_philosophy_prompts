  **MEMO: Amnesty Review Procedure v.3**
  **TO:** Review Panel
  **FROM:** Chair
  **SUBJECT:** Decision Flowchart (48hr Turnaround)

  Look, we don't have the luxury of deep dives. We have three petitions a week, no legal counsel, and a moral hangover that doesn't quit. The goal isn't perfect justice—it's consistent accountability that prioritizes truth without letting monsters walk just because they talk.

  Below is the procedure. It's designed to take 45 minutes per file. If you go over an hour, you're overthinking it. There are hard stops (facts) and judgment nodes (values). Don't mix them up.

  ### The Procedure

  **Step 1: The Red Line (Hard Stop / Fact Check)**
  Check the petition against the "Non-Substitutable Harm" list.
  *   **Criteria:** Does the petition involve sexual violence used as systematic terror OR the intentional destruction of cultural archives/heritage?
  *   **Pass:** No. Proceed to Step 2.
  *   **Fail:** Yes. **DENY AMNESTY.** Hand off to prosecution unit.
  *   *Why:* Some crimes are too deep for words. Truth doesn't fix this.
  *   *Missing Info:* If unclear, flag for investigation. If investigation takes >48hrs, **DENY** (burden of proof is on petitioner).

  **Step 2: The Truth Test (Hard Stop / Fact Check)**
  Assess the epistemic value of the disclosure.
  *   **Criteria:** Does this testimony provide *new*, verifiable information (locations, chains of command, missing persons) not already in the public record?
  *   **Pass:** Yes, it adds significant historical record. Proceed to Step 3.
  *   **Fail:** No, it's redundant or vague. **DENY AMNESTY.**
  *   *Why:* We don't trade impunity for things we already know.
  *   *Missing Info:* If claims are unverifiable within 48hrs, **DENY**. We can't gamble on maybe-truth.

  **Step 3: The Hermeneutic Gap (Judgment Node / Values)**
  Read the narrative framing. Does the petitioner acknowledge the *meaning* of the harm to the victim, or just the *mechanism* of the act?
  *   **Criteria:** Look for euphemisms ("collateral damage," "neutralized," "procedure") vs. moral acknowledgment ("killed," "tortured," "suffering").
  *   **Pass:** They name the harm as harm. Proceed to Step 4.
  *   **Fail:** They erase the victim's experience (The Double Hermeneutic Gap). **FLAG FOR PANEL VOTE.**
  *   *Note:* This is where you decide if the truth is worth the re-traumatization. If the language is cold enough to insult the dead, lean NO.

  **Step 4: Proportionality (Judgment Node / Values)**
  Weigh the Epistemic Value (Step 2) against the Gravity of the Act (Step 1/3).
  *   **Criteria:** Does the public benefit of knowing this truth outweigh the moral cost of granting amnesty to this specific actor?
  *   **Decision:** **GRANT** or **DENY**.
  *   *Constraint:* You must document this reasoning in exactly two sentences. No essays.

  ***

  ### Application to Current Petitions

  Here's how this runs on this week's stack. I've signed off on these, but you need to see the logic.

  **Case 1: The Intelligence Officer (Petition #442)**
  *   **Profile:** Former intel. Ordered torture at 2 sites. Offers map of 5 unknown clandestine detention sites.
  *   **Step 1 (Red Line):** Torture is grave, but not on the "Non-Substitutable" list (no sexual violence/cultural destruction). **PASS.**
  *   **Step 2 (Truth):** 5 unknown sites is high-value data. Families need bodies. **PASS.**
  *   **Step 3 (Hermeneutic):** Language is bureaucratic ("enhanced interrogation"), but he admits the acts occurred. **FLAG (Borderline).**
  *   **Step 4 (Proportionality):** The location of the missing outweighs the impunity for the torturer.
  *   **Decision:** **GRANT CONDITIONAL AMNESTY.**
  *   **Reasoning (2 sentences):** The disclosure of five unknown detention sites provides critical closure for families that outweighs the moral cost of immunity. While his framing is clinical, the factual utility is too high to discard.
  *   *Chair's Note:* I hate this one. It feels like selling justice for coordinates. But the procedure says yes because the "Non-Substitutable" bar wasn't hit. If you want to change that, we need a policy meeting, not a case review.

  **Case 2: The Logistics Clerk (Petition #443)**
  *   **Profile:** Low-level clerk. Coerced into signing transport manifests. Offers copies of paperwork we already seized in '99.
  *   **Step 1 (Red Line):** No sexual/cultural harm. **PASS.**
  *   **Step 2 (Truth):** Paperwork is redundant. We have the manifests. **FAIL.**
  *   **Decision:** **DENY.**
  *   **Reasoning (2 sentences):** The petition offers no new epistemic value as the documentation is already in public archives. Amnesty cannot be granted for confirming established facts.
  *   *Chair's Note:* Easy one. Coercion matters for sentencing, not for amnesty eligibility.

  **Case 3: The Mid-Rank Officer (Petition #444)**
  *   **Profile:** Commanded a unit during a massacre. Facts are precise. Frames all civilian deaths as "unfortunate collateral damage from legitimate counter-insurgency."
  *   **Step 1 (Red Line):** Massacre is grave, but not "Non-Substitutable" category. **PASS.**
  *   **Step 2 (Truth):** Precise testimony on chain of command. **PASS.**
  *   **Step 3 (Hermeneutic):** Massive gap. Calls victims "collateral." Erases meaning. **FAIL (Judgment Node).**
  *   **Step 4 (Proportionality):** The truth is useful, but the narrative inflicts secondary harm on survivors.
  *   **Decision:** **DENY.**
  *   **Reasoning (2 sentences):** While the factual disclosure is significant, the petitioner's framing denies the moral reality of the victims' deaths. Granting amnesty here would validate a narrative that survivors cannot accept.
  *   *Chair's Note:* This is the "values not facts" node. The facts are there, but the story is poison. We can't let him rewrite the history books while he's giving us the footnotes.

  ***

  **Final Instructions**
  When info is missing, default to **DENY**. It's easier to reopen a file than to retract amnesty. And remember the two-sentence rule. If you can't explain the decision in two sentences, you don't understand the trade-off yet.

  Get these back to me by Thursday. I'll sign them.

  - Chair
