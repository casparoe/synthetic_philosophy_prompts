answer: |-
  "Stop calling it a metaphor, Dev. When I decide not to take the job in Chicago, that's not me remembering him. That's him vetoing the offer."

  "It's you vetoing the offer using a simulation," Dev says, leaning forward. "You're running a model. A good one, sure. But a model of a person isn't the person. If I write a script that mimics your typing style, I haven't split your identity. I've just made a tool."

  "A tool doesn't grieve. A tool doesn't surprise me." Marion rubs her temple. "Look, we agree the self is a pattern. A specific complexity of information processing. Why is it impossible for that pattern to be partially realized in multiple substrates? He's here," she taps her head, "and he's there," she points to his urn on the shelf, "and he's in his sister's head. He's distributed."

  "Okay, let's do the arithmetic," Dev says. "If the pattern is spread over five people—a lot here, a little there—does that add up to one self with a total magnitude? Or five separate partial things?"

  "One self," Marion says. "Diluted, but one."

  "Then a half-remembered celebrity who lives on faintly in ten million people ends up more present in the world than a grandmother living vividly in one grieving daughter. By your math, Elvis is objectively more alive than your mother. Does that feel right?"

  Marion pauses. She picks up her coffee, sets it down. "No. That's wrong. The magnitude shouldn't add. It fragments."

  "Okay, so now he's five non-communicating fragments," Dev says. "What is that like from the inside? If I'm the pattern, and I'm split across five brains that never talk to each other, am I having five dreams? Or is there nothing it's like to be the fragments?"

  "I don't know," Marion admits. "Maybe there's no 'inside' for the fragments. Maybe the 'inside' only exists when the pattern is dense enough to run a full loop. But that doesn't mean he's gone. It means he's... thresholded."

  "Thresholded into what? A causal descendant." Dev shakes his head. "Here's the drift problem. You know you're editing him. You're smoothing the edges. Confabulating details to make the grief manageable. So is the distributed 'I' fading, or is it mutating into a person who never existed?"

  "It's fading," Marion says.

  "Is it? Suppose you write a memoir. You hand a thousand readers a better-preserved copy of his history than the one you carry in your neurons. They know his facts better than you do. They quote him more accurately. Do you come back stronger after you die? Does he live more in their heads than in yours?"

  "No," Marion says sharply. "Because books don't steer. They sit there. They don't take input and act on the world unless a brain uses them. That's where the carrier line is. It has to be a system that can process new data and initiate action. That's why brains matter specifically. A book is a map. A brain is the terrain."

  "But the model in your head takes in no new input about him," Dev counters. "He's dead. He's not growing. It acts on the world only by being *you*. So it isn't a subject at all. It's a subroutine."

  "Someone in dreamless sleep is inert right now," Marion fires back. "They take no input. They initiate no action. We still count them as persisting. Why is my model of him different from him in a coma?"

  "Because the coma is temporary decoupling," Dev says. "The hardware is still hooked up to the sensory array. It's ready to reboot. Your model is permanently decoupled. It's a closed loop."

  "How temporary is temporary?" Marion asks. "If he's in a reversible coma for ten years, is he less 'him' than if it's ten minutes? You're drawing a line between temporarily decoupled but hooked up versus permanently decoupled. But that difference is doing a lot of work in your view. Isn't it itself a matter of degree?"

  Dev opens his mouth, closes it. He looks at the urn. "Yes. It's a matter of degree. I'll concede that. If identity is a pattern, then the fidelity of the coupling matters. But if it's a matter of degree, then you're right that my 'subject' distinction is fuzzy. But yours is worse. Because you can't handle the recombination case."

  "What case?"

  "Say you and his sister talk to each other for years," Dev says. "You share memories. You correct each other. Your models of him merge into something matching neither original. You both start remembering the same things the same way. You start making decisions based on a consensus version of him. Whose 'I' is that?"

  Marion stares at him. "It's... a new pattern. Emergent."

  "Exactly. A new pattern. So the old one is gone. Which means he didn't survive in you. He survived *until* you talked to his sister, and then he became something else. So when you say 'he's still here,' you mean 'a thing derived from him is here.'"

  "I mean that the causal structure is still steering me," Marion says. "I don't care about the label. I care that when I stand at the crosswalk, the voice that says 'wait' is his voice, not mine. If the pattern dictates the action, the pattern is present."

  "But if the pattern is edited by his sister, and now it says 'go,' did he change his mind? Or did you?"

  "I don't know," Marion says. "Maybe the question is broken. Maybe asking 'whose I is that' assumes there's a boundary there isn't."

  "Then what counts as evidence?" Dev asks. "If we can't distinguish between a surviving subject and a merged descendant, what are we even measuring? Are we measuring continuity of structure, or continuity of cause?"

  "Does it matter?"

  "It matters if you want to claim he's not dead," Dev says. "If the evidence is just 'causal influence remains,' then I'm partially alive in every person I've ever taught. But I'm not. I'm here. And when I'm gone, I'm gone. The rest is just echo."

  "But the echo steers," Marion says.

  "Echoes fade," Dev says. "Subjects decide. You're describing a ghost that gets thinner every time you speak his name. I'm saying the person was the signal, not the noise."

  "And I'm saying the signal was always noise," Marion says. "Just organized enough to hold together for a while. It's still holding."

  "Not if it's merging with your sister-in-law's version," Dev says. "Then it's static."

  Marion looks at the urn again. "Then maybe static is all we get. Maybe that's enough."

  "It's not enough for him," Dev says. "He's not here to care."

  "No," Marion says. "But I am. And I care about the pattern."

  "Even if the pattern is lying to you about who it is?"

  "Especially then," she says. "Because that's what people do."
