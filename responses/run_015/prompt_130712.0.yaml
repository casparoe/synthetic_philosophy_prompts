answer: |-
  **MEMORANDUM**

  **TO:** Director, National Strategic-Risk Unit
  **FROM:** Oversight Committee on Analytical Standards
  **DATE:** 24 October 2023
  **SUBJECT:** Decision on Proposal 7-B: Independence-Preserving Conditionalisation (IPAC)

  **1. RECOMMENDATION**

  The Oversight Committee recommends the **adoption of Proposal 7-B with specific modifications**. We advise against the mandate of strict Independence-Preserving Conditionalisation (IPAC) in its original form, as it risks institutionalising a false presumption of independence between testimony events and the states they describe. Instead, we propose the implementation of a **Two-Stage Update Protocol**, which retains the core logical constraints of IPAC while accommodating the evidential weight of the reporting act itself. We request that this modified framework be fully operationalised within ninety days.

  **2. REASONING AND EPISTEMOLOGICAL RATIONALE**

  The Committee recognises the validity of the majority's concern regarding unregulated belief updating. In high-stakes analysis, there is a pervasive tendency to conflate the *content* of a conditional report with evidence for its *antecedent*. When an analyst receives a report stating, "If Contingency Alpha is active, then Contingency Beta is inactive," there is a logical temptation to increase confidence in Alpha simply because the report addresses it. This is the core dynamic of the Judy Benjamin problem: learning a constraint on what follows from a hypothesis (the conditional probability) is treated erroneously as evidence for the hypothesis itself (the unconditional probability). Without a constraint, analysts allow the probability of the antecedent to rise merely because the conditional relationship has been clarified, despite receiving no direct information about whether the antecedent actually obtains. Proposal 7-B correctly identifies this as a source of cascading false alarms.

  However, the Committee also accepts the chief methodologist's objection that strict IPAC is operationally naive. In intelligence contexts, the *event* of receiving a report is rarely independent of the world state. Sources do not generate conditional testimony at random; they construct such reports precisely when they possess indirect indicators regarding the antecedent. To mandate that an analyst's belief in the antecedent remains perfectly constant upon receiving the report is to ignore the meta-evidential signal contained in the source's decision to speak. It treats the testimony as a logical abstraction rather than a communicative act generated by a strategic actor. A rule that forces analysts to ignore the signalling value of the report's existence risks discarding vital information about source behaviour and access.

  **3. PROCEDURAL SAFEGUARD: THE TWO-STAGE UPDATE PROTOCOL**

  To reconcile the need for logical rigour with the reality of source signalling, the Committee mandates the following procedural safeguard as a condition of adoption:

  **The Two-Stage Update Protocol**
  Analysts processing conditional intelligence must separate the update process into two distinct, auditable phases:

  *   **Stage 1 (Pragmatic Assessment):** Before applying any logical constraints, the analyst must assess the probability of the *testimony event* itself. Using standard likelihood ratios, the analyst updates their prior belief in the antecedent based *solely* on documented source behaviour patterns (e.g., "Does this source only issue conditional warnings when they have high confidence in the antecedent?"). This update captures the evidential weight of the report's existence, addressing the methodologist's concern.
  *   **Stage 2 (Logical Constraint):** Once the priors have been adjusted for the testimony event, the IPAC rule is applied to the logical content of the report. The analyst must enforce the conditional constraint (e.g., $P(\text{Beta}|\text{Alpha}) = 0$) without allowing the logical structure itself to drive any *further* shift in the antecedent's probability.

  This protocol ensures that belief shifts in the antecedent are driven only by verified source signalling properties (Stage 1), not by the logical implication of the conditional content itself (Stage 2). It prevents the Judy Benjamin error while preserving the informational value of the communication act.

  **4. IMPLEMENTATION TIME FRAME**

  The Unit is directed to implement this protocol within ninety days, according to the following schedule:

  *   **Days 1–30:** Revision of analytical guidance documents to reflect the Two-Stage Update Protocol and development of audit templates for Stage 1 assessments.
  *   **Days 31–60:** Mandatory training workshops for all senior analysts and team leads, focusing on distinguishing between pragmatic signalling and logical constraints.
  *   **Days 61–90:** Pilot deployment within the Strategic Warning Division, followed by a compliance review before full Unit-wide rollout.

  **5. ASSESSMENT OF COUNTER-ARGUMENTS**

  We must acknowledge the strongest counter-argument to this modified approach, articulated by the majority of the Committee during deliberations. There is a risk that the Two-Stage Protocol introduces a loophole: analysts may exploit the discretion allowed in Stage 1 to bypass the constraints of Stage 2. By inflating the assessed reliability of the source's signalling behaviour, an analyst could effectively achieve the antecedent shift that IPAC was designed to prevent, merely labelling it as a "pragmatic assessment."

  Whilst this risk is genuine, we judge it preferable to the rigidity of strict IPAC. A procedural loophole is detectable through audit trails of Stage 1 justifications, whereas the epistemological error of strict IPAC is structural and invisible. By requiring analysts to explicitly document the source behaviour justification for any antecedent shift, we make the reasoning subject to peer review, thereby mitigating the risk of manipulation whilst retaining the necessary flexibility for accurate intelligence assessment.

  **6. CONCLUSION**

  The Committee believes this modified approach offers the most robust path forward. It protects the Unit from logical fallacies inherent in conditional updating without blinding analysts to the strategic realities of intelligence collection. We look forward to your confirmation of this directive.

  **Signed,**

  **Oversight Committee on Analytical Standards**
