      *   Timeline ≤ 90 days? Yes.
      *   Recommendation clear? Yes.

  8.  **Final Polish:** Check tone. Ensure it sounds like a Senior Advisor speaking to a Director. Avoid overly technical jargon where plain English suffices, but maintain epistemological precision. Ensure the distinction between the *content* of the report and the *event* of the report is clear.

