      *   *"We enjoy the artistry":* Address this mid-session. Distinguish object of appreciation (craft) vs. object of emotion (suffering).
      *   *"Catharsis":* Address this later. It's a "solution," not a dismissal. Treat it as a hypothesis to test.

  6.  **What to Omit:**
