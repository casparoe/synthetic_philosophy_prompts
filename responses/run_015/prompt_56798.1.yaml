answer: |-
  Here is the breakdown. I've kept it tight so you can read it and sleep.

  ### 1. The Argument Chain

  Based on the text you provided, Butler's argument runs like this:

  *   **Premise 1 (Distinction):** Sudden anger is non-cognitive and shared with brutes (impulse/self-preservation).
  *   **Premise 2 (Definition):** Settled resentment is cognitive and peculiar to humans; it arises *only* upon the apprehension of injury/injustice/design.
  *   **Premise 3 (Moral Content):** Because it requires apprehension of injury, settled resentment carries the notion that something "ought not to have been done."
  *   **Premise 4 (Teleology):** Settled resentment is part of the constitution of our nature and is necessary for the good of society (guard against injustice).
  *   **Premise 5 (Regulation):** Because it is liable to excess (revenge/malice), it must be governed by conscience and benevolence.
  *   **Conclusion:** Settled resentment is a legitimate, non-pathological part of human nature, provided it is regulated.

  **The Load-Bearing Step:**
  It is split.
  *   **Premise 2 & 3** do the work of making it a *moral* passion rather than a brute impulse. Without the "apprehension of injury/ought," it collapses back into sudden anger.
  *   **Premise 4** does the work of **justifying** its existence against the claim that it is a "disease."

  To answer your specific question: The "apprehension of injury" claim cannot stand on its own to justify the passion; it only defines it. You could define a passion as "apprehension of injury" and still argue it's a disease (a glitch). The "necessary to the good of society" claim is doing the independent work of legitimizing it within the system. However, the "good of society" claim cannot stand on its own to define it as *moral*; utility alone doesn't make something moral (a useful lie is still a lie). They are interlocking gears.

  ### 2. Dan vs. You (Cognition/Utility vs. Moral Recognition)

  **Dan is right about the strategy; you are right about the phenomenology.**

  *   **Dan:** He claims Butler's point is that resentment is useful ("just that it's useful"). The text supports this explicitly: "necessary to the good of society... guard against injustice." Butler is arguing from design/utility to legitimacy.
  *   **You:** You claim settled resentment is "already a form of moral recognition and not a tool at all." The text supports this explicitly: "carries in it the notion that something was done which ought not to have been done." It is not *merely* a hotter version of impulse; it is a different order of thing because it contains a judgment.

  **Who is closer?**
  You are closer to the *nature* of the passion; Dan is closer to the *argument* for the passion.
  However, Dan is wrong if he implies it is *only* a tool. If it were only a tool, the "apprehension of injury" requirement would be contingent. Butler makes it essential: it *cannot arise* without that apprehension. That makes it a cognitive/moral state first, which *then* happens to be useful. If you say it's "just a tool," you ignore the definitional constraint that it must track injustice.

  **Verdict:** The passage decides for you on the internal structure (it is moral recognition), but for Dan on the external justification (it is validated by utility/design).

  ### 3. The Teleology Worry (Instrumentalism)

  Your worry: If justified by utility, can I resent an innocent person if it helps society?

  **Butler's Out:**
  Yes, Butler has an out, and it lies in the definition, not just the regulation.
  1.  **Definitional Block:** The text says settled resentment "cannot arise without" the apprehension of injury/injustice. If you resent someone who hurt nobody, you are not experiencing "settled resentment" as Butler defines it. You are experiencing something else (malice, prejudice, or sudden anger). You cannot instrumentally deploy a passion that, by definition, requires a specific trigger you know is absent.
  2.  **Constitutional Block:** The phrase "part of [nature's] constitution" is doing heavy lifting here. It is not just "useful"; it is "designed." In a teleological framework, using a faculty against its design specification is a perversion, not a valid use.
  3.  **Regulatory Block:** The text says it must aim at "the preventing of injury, and not merely at the suffering of the person." Resenting an innocent person aims at suffering without preventing injury (since no injury was done to prevent).

  **Is "Constitution" just usefulness?**
  No. "Usefulness" is consequentialist (does it work?). "Constitution" is natural law-ish (is this what we are for?). The latter blocks the instrumentalism you fear. You can't use a heart to pump sand just because it might build a castle; that violates its constitution.

  *Flag on Wording:* If Butler's original text weakens "cannot arise without" to "usually arises with," your instrumentalist worry gains ground. But based on your rendering ("cannot arise"), the definitional block holds.

  ### 4. Malice and Revenge

  **Status:** Malice is the same passion corrupted, not a different thing.
  **Text:** "liable to excess and perversion — it slides over into revenge, malice, cruelty."
  "Slides over into" implies continuity. It is the same engine overheating.

  **Could Butler get the benefit without the slide?**
  The text implies no. "Liable to" suggests inherent risk. The force required to be a "guard against injustice" (strong enough to deter the violent) is the same force that, if unchecked, becomes cruelty. If you dampen the passion enough to ensure it never slides, it may cease to be effective as a guard. The regulation (conscience/benevolence) manages the risk; it doesn't eliminate the capacity for it. The social benefit requires a passion strong enough to be dangerous.

  ### 5. Strawson vs. Butler (The Comparison)

  Dan's thesis ("Strawson is Butler with theology deleted") is **dialectically correct but mechanically wrong.**

  **Where Dan is Right (The Dialectic):**
  Both Strawson and Butler are fighting a skeptic (the Determinist for Strawson, the Moral Skeptic for Butler) who asks for an external justification for our practices/passions.
  *   **Butler:** Don't ask if resentment is "good" in the abstract; it's part of our constitution designed for society.
  *   **Strawson:** Don't ask if responsibility is "true" in the abstract; the reactive attitudes are part of our framework for living, not something we can step outside of to justify.
  *   **Absorption:** Dan can successfully argue that both philosophers reject the "objective view" of the practice itself as impossible or unintelligible.

  **Where Dan is Wrong (The Mechanics):**
  There is a precise conceptual step Strawson takes that Butler's scheme cannot generate.

  1.  **Injury vs. Quality of Will:**
      *   **Butler:** Resentment responds to **injury** ("apprehension of injury... someone's having designed the harm"). No injury, no settled resentment.
      *   **Strawson:** Reactive attitudes respond to **quality of will**. I can properly feel resentment if you show me ill will, even if you fail to injure me (attempted harm, negligence that luckily causes no harm).
      *   **The Gap:** Butler's scheme struggles to justify resentment where no harm occurs. Strawson's scheme makes resentment about the *regard* owed between persons, not the *consequences* of actions. This allows Strawson to decouple responsibility from outcome in a way Butler's "guard against injustice" teleology does not.

  2.  **Constitutive vs. Protective:**
      *   **Butler:** Resentment **protects** the moral order (guard against injustice). It is a weapon deployed within the system.
      *   **Strawson:** Reactive attitudes **constitute** the moral order. They are not tools we use; they are the medium in which interpersonal relationships exist.
      *   **The Gap:** For Butler, you could theoretically imagine a society without resentment that used other guards (though he thinks it's unnatural). For Strawson, a society without reactive attitudes is not a human society; it is the "objective attitude" applied universally, which is incompatible with ordinary interpersonal relationships.

  3.  **The Objective Attitude:**
      *   **Butler:** The alternative to settled resentment is "sudden anger" (brute impulse) or presumably no anger. He doesn't have a clear category for "withholding resentment while acknowledging agency" (e.g., treating someone as an object due to psychosis).
      *   **Strawson:** The "objective attitude" is a specific move *within* human interaction (exempting conditions).
      *   **The Gap:** Butler's binary (Brute Impulse vs. Moral Resentment) cannot generate Strawson's triad (Participant Resentment vs. Participant Indignation vs. Objective Attitude). Specifically, Strawson's distinction between *resentment* (self-regarding) and *indignation* (other-regarding/spectator) allows for a moral community bound by shared demands, whereas Butler's "resentment" seems primarily focused on injury to self (guarded by benevolence for society).

  **Final Verdict on Dan:**
  Dan is right that Strawson inherits Butler's anti-skeptical strategy (stop asking for external justification of the practice). But he is wrong that the *content* of the attitudes is the same. Strawson shifts the ground from **Teleological Utility** (Butler: it serves society) to **Transcendental Necessity** (Strawson: it makes society possible).

  If you argue that Strawson's move is about the *conditions of possibility* for interpersonal relationships, whereas Butler's is about the *functional optimization* of human nature, you win. Dan's analogy collapses there. Butler says "We are built this way to function well." Strawson says "We are built this way, and without it, 'functioning well' in a human sense doesn't exist."

  Go to sleep. You have the distinction.
