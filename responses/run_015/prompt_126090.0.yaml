prompt: |-
  Consider the institutional architecture of the European Union in practice, focusing on the interaction among three specific mechanisms. First, the European Commission holds the exclusive right of legislative initiative: the European Parliament and the Council may amend or reject proposals, but neither can introduce bills on its own. Second, under the subsidiarity review procedures, national parliaments may issue reasoned opinions—triggering advisory yellow-card or orange-card thresholds—arguing that a draft act violates subsidiarity; yet these opinions remain non-binding, and the Commission or the legislative chambers may proceed regardless. Third, enhanced cooperation permits a coalition of at least nine member states to pursue deeper integration in a defined policy area, producing legal acts that bind only participants but frequently generating regulatory spillovers, fiscal externalities, or competitive distortions that affect non-participating states.

  These mechanisms operate alongside two competing legitimacy claims: that the Union derives democratic authorization from the European Parliament representing citizens directly, and that it derives state consent from the Council representing governments. The coexistence of exclusive Commission initiative, non-binding parliamentary subsidiarity objections, and opt-in deep integration for subsets of states suggests an implicit theory of sovereignty and democratic accountability that is neither purely intergovernmental nor straightforwardly federal. Reconstruct the philosophical commitments this architecture presupposes about whether sovereignty is divisible, pooled, or delegated; about whether democratic legitimacy requires a single European demos, a plurality of national demoi, or merely procedural authorization through representative institutions; and about whether state consent retains independent moral weight when it conflicts with majority decision-making at the supranational level.

  Is there one coherent account—perhaps drawing on pooled-sovereignty or multi-level governance concepts—that licenses all three mechanisms together? Or do they tacitly presuppose incompatible theories of authority? Identify which parts of the architecture are philosophically underdetermined, in the sense that several rival theories of sovereignty could accommodate them. Then specify which mechanisms would have to be abandoned or radically redesigned if one replaced the implicit view with a strictly federalist model (a single sovereign demos with direct parliamentary initiative and binding constitutional supremacy) and with a strictly confederalist model (unanimous state consent as a veto right and no binding law for non-participants).

  Present your answer in two sections. First, a prose reconstruction of the implicit theory, its internal tensions, and its underdetermination points. Second, a structured summary as a JSON object with exactly these fields: 'sovereignty_model' (string summarizing the reconstructed view), 'legitimacy_basis' (string describing the democratic-authority claim), 'tension_matrix' (array of objects with keys 'mechanisms', 'apparent_inconsistency', and 'resolution'), 'underdetermined_aspects' (array of strings), 'federalist_redesign' (object listing 'surviving_mechanisms' and 'abandoned_mechanisms'), and 'confederalist_redesign' (object with the same two keys).
