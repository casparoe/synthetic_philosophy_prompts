answer: |-
  1. **The Asymmetry Constraint**
     *   **Why:** A theory must account for the intuition that there is a moral duty to avoid creating a suffering child, but no symmetric moral duty to create a happy child. This is driven by the case of *non-procreation*: we do not feel guilty for failing to bring happy people into existence, but we do feel guilty for bringing suffering people into existence.
     *   **Incompatibility Flags:** Incompatible with **Standard Total Utilitarianism** (which treats the absence of pleasure as a loss comparable to the presence of pain). Incompatible with **Strong Person-Affecting Views** (which struggle to explain why absence of pain is good if there is no one to experience the "good").

  2. **The Non-Identity Solution**
     *   **Why:** A theory must explain how an action can be wrong even if it does not make any specific existing person worse off than they would otherwise have been. This is driven by Parfit's **14-Year-Old Girl Case**: a girl chooses to have a child young, giving the child a life worth living but less good than if she waited. Waiting would have created a *different* child. Standard harm principles say she did no harm to *this* child, yet the choice seems morally problematic.
     *   **Incompatibility Flags:** Incompatible with **Strict Person-Affecting Restrictions** (which hold that an act can only be wrong if it is worse for some particular person). Satisfying this usually requires adopting an **Impersonal View** (where states of affairs are better/worse regardless of who exists).

  3. **Avoidance of the Repugnant Conclusion**
     *   **Why:** A theory must not imply that a world with a massive population of lives barely worth living is better than a world with a smaller population of excellent lives. This is driven by **Total Utilitarianism**: if value is summed, adding more lives with positive (but low) welfare eventually outweighs a smaller number of very high welfare lives. Most people find this conclusion intuitively unacceptable.
     *   **Incompatibility Flags:** Incompatible with **Total Utilitarianism**. Often incompatible with **Strict Asymmetry Views** (if avoiding suffering is paramount, one might argue for zero population, which is its own extreme conclusion).

  4. **The Person-Affecting Restriction**
     *   **Why:** A theory should respect the intuition that morality is fundamentally about how we treat specific individuals. It feels category-error-ish to say an act is "wrong" if it isn't wrong *to anyone*. This is driven by the **Victim Requirement**: we expect moral wrongs to have victims.
     *   **Incompatibility Flags:** Incompatible with **The Non-Identity Solution** (see #2). If you keep this, you cannot explain why the 14-year-old girl's choice is wrong. If you drop this, you must accept "impersonal" harms.

  5. **The Same Number Quality Claim**
     *   **Why:** If two choices result in the same number of people existing, but different specific people, the theory should prefer the choice that results in higher quality of life. This is driven by the **Slavery Case**: if choosing between two embryos, one destined for slavery and one for freedom, we should choose freedom, even though neither "person" exists yet to be harmed by the choice.
     *   **Incompatibility Flags:** Incompatible with **Strict Person-Affecting Views** (since neither specific person exists yet to be harmed/benefited). Requires some form of **Impersonal Beneficence**.

  6. **The Non-Existence Coherence Constraint**
     *   **Why:** A theory must not treat non-existence as a state of deprivation or suffering. It must avoid the metaphysical claim that non-existent people are "unhappy" about not existing. This is driven by the **Logic of Comparison**: you cannot compare the welfare of an existing person to the welfare of a non-existent person unless non-existence has a welfare value (which it arguably doesn't).
     *   **Incompatibility Flags:** Incompatible with **Views that assign negative value to non-existence** (which would imply a duty to procreate to save people from the "badness" of not existing).

  7. **The Non-Overdemandingness Constraint**
     *   **Why:** A theory must not require parents to sacrifice their own fundamental well-being or integrity to maximize abstract population value. This is driven by **Parental Integrity**: a theory that demands parents have as many children as possible until marginal utility drops, or forbids having any children due to imperfect conditions, fails to guide actual human life.
     *   **Incompatibility Flags:** Incompatible with **Act Utilitarianism** (which often demands maximal sacrifice). Incompatible with **Negative Utilitarianism** (which might forbid procreation entirely due to any risk of suffering).

  ***

  **The Single Requirement That Does the Most Work**

  **The Non-Identity Solution (#2)** is the requirement that eliminates the most candidate views.

  Most people begin with a **Person-Affecting Restriction (#4)**: morality is about not harming specific people. This is the default intuitive framework for almost all personal ethics. However, the Non-Identity Problem demonstrates that in procreative choices, the Person-Affecting Restriction fails to classify clearly wrong actions (like the 14-year-old girl case) as wrong, because the specific person created is not harmed by being created (provided their life is worth living).

  To satisfy the Non-Identity Solution, you must abandon the Person-Affecting Restriction. This forces a theory to become **Impersonal** (valuing states of affairs rather than specific individuals). Once you become Impersonal, you immediately trigger the **Repugnant Conclusion (#3)** problems associated with Total Utilitarianism. Therefore, accepting the Non-Identity Solution forces you into a narrow corridor of **Impersonal Views that avoid the Repugnant Conclusion** (e.g., Critical Level Utilitarianism, Variable Value Views), eliminating all Standard Person-Affecting Views and all Standard Total Utilitarian Views simultaneously. It is the pivot point upon which the entire field of population ethics turns.
