      *   What makes a good theory of procreative ethics?
      *   *The Asymmetry:* Presence of pain is bad, presence of pleasure is good. Absence of pain is good (even if no one enjoys it), absence of pleasure is not bad (unless someone is deprived). This is Benatar's core, but also a general intuition many hold.
      *   *The Non-Identity Problem:* Parfit. Actions affecting *who* exists vs. *how well* they exist. If a choice brings a specific person into existence with a life worth living, but another choice would have brought a *different* person into existence with a *better* life, did the first choice harm the first person? (No, because without that choice, they wouldn't exist). A theory needs to handle this.
      *   *The Intuition of Beneficence:* We usually think we should make people better off.
      *   *The Intuition of Non-Maleficence:* We should not harm people.
      *   *Person-Affecting Restriction:* Morality is about affecting specific people. If no specific person is harmed, is there a wrong?
      *   *The Repugnant Conclusion:* Total utilitarianism leads to preferring a massive population with barely worth-living lives over a smaller population with excellent lives. A theory should ideally avoid this.
      *   *The Absurd Conclusion:* Average utilitarianism leads to preferring one extremely happy person over a billion very happy people.
      *   *Rights/Constraints:* Do future people have rights? Do parents have duties?
