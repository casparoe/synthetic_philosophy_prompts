answer: |-
  Here is the specification for the principle you are looking for, followed by its application to your cases, new test cases, and the honest assessment of where your gut reactions must yield to the logic.

  ### The Principle: Functional Entanglement

  **Definition:** A knob-twiddle constitutes a **creative variation** if and only if the altered parameter is **functionally entangled** with the system's logic such that turning it **necessitates downstream recalibration** to maintain internal coherence, while **preserving the invariant relational core**.

  This principle divides knobs into three states based on their relationship to the system's causal and semantic network:

  1.  **Isolated (Cosmetic/Noise):** The parameter can be changed without forcing adjustments elsewhere. The system absorbs the change without strain.
  2.  **Entangled (Thematic):** The parameter is woven into the system's logic. Changing it forces other elements to adapt (recalibrate) to prevent incoherence, thereby revealing the flexibility of the core theme.
  3.  **Constitutive (Identity):** The parameter *is* the invariant core. Changing it dissolves the system's identity rather than varying it.

  ---

  ### Clause Mapping to Your Cases

  **Clause 1: The Isolation Test (Rejects Cases 1 & 5)**
  *   **Logic:** If a change does not force you to rewrite adjacent elements to make the work make sense, it is not a variation; it is decoration or noise.
  *   **Case 1 (Adjectives):** Swapping "dark" for "light" requires no plot adjustment. The causal chain (A leads to B) remains untouched. The adjectives were functionally isolated from the plot logic. **Verdict: Vandalism/Decoration.**
  *   **Case 5 (Tempo +10bpm):** A 10bpm shift does not necessitate changing the harmony, melody, or instrumentation. It falls within the margin of performance noise. **Verdict: Noise.**

  **Clause 2: The Recalibration Test (Validates Cases 2 & 4)**
  *   **Logic:** A creative variation creates *resistance*. The new setting or harmony fights the old melody/plot, forcing you to adapt the surface to save the soul.
  *   **Case 2 (London -> Mars):** You cannot simply paste Victorian characters onto Mars. You must recalibrate transport, atmosphere, and social constraints (downstream adjustments). However, the *emotional architecture* (the invariant core) survives the translation. **Verdict: Creative Variation.**
  *   **Case 4 (Reharmonization):** Changing the harmony forces the melody to resolve differently. The tension points shift (recalibration), but the melodic identity (invariant core) remains recognizable. **Verdict: Creative Variation.**

  **Clause 3: The Context Load (Handles Case 3)**
  *   **Logic:** Entanglement is not an intrinsic property of the knob; it is a property of the specific system. A knob is loaded only if the specific narrative logic relies on it.
  *   **Case 3 (Gender Flip):**
      *   *Grief Story:* If the logic is internal/psychological, gender is **Isolated**. No recalibration of power dynamics is needed. **Verdict: Cosmetic.**
      *   *Dominance Story:* If the logic relies on patriarchal structures, gender is **Entangled**. Flipping it forces a recalibration of how power is exerted and received. **Verdict: Profound.**

  **Clause 4: The Invariance Limit (Handles Case 6)**
  *   **Logic:** If the recalibration required to accommodate the knob turn destroys the invariant core (e.g., Character Identity), the theme has not been varied; it has been negated.
  *   **Case 6 (Opposite Morals):** A character is defined by their choices. Flipping *every* choice requires such massive recalibration of the character's psychology that the "Protagonist" invariant dissolves. You have created an Anti-Protagonist. **Verdict: Snapped/Negation.**

  ---

  ### Application to Unmentioned Cases

  **Case A: Translating a poem into another language.**
  *   **Analysis:** Language is **Entangled**. You cannot translate a word without affecting rhythm, rhyme, and connotation. You must recalibrate the imagery to preserve the emotional core.
  *   **Verdict:** **Creative Variation.** (This is why translations are often considered new works).

  **Case B: Replacing every noun with a synonym (e.g., "Dog" -> "Canine").**
  *   **Analysis:** This is **Isolated**. If the synonym is true, the logic holds without adjustment. If the synonym shifts register (e.g., "House" -> "Domicile"), it might force a tonal recalibration.
  *   **Verdict:** **Cosmetic** (unless the register shift breaks the voice, in which case it becomes Vandalism).

  **Case C: Rewriting a tragedy as a comedy keeping every line intact.**
  *   **Analysis:** This tests the **Context Load**. If the lines are truly identical, the *semantic* content is fixed. To make it a comedy, you must change the *context* (acting, staging, surrounding events). This is functionally identical to your **Case 2 (London -> Mars)**. The "Setting/Performance" knob is turned, forcing the audience to reinterpret the invariant lines.
  *   **Verdict:** **Creative Variation** (specifically, a contextual variation).

  ---

  ### The Honest Rejection: Where Your Gut Is Wrong

  You asked where this principle forces you to change your mind. There are two specific points where the **Principle of Functional Entanglement** contradicts your intuitions.

  **1. Rejection of your Case 3 Split (The "Grief is Universal" Assumption)**
  *   **Your Gut:** If the story is about grief, gender is cosmetic.
  *   **The Principle's Correction:** In narrative, grief is rarely functionally isolated from gender. *How* a character is permitted to grieve, where they can grieve, and who comforts them is almost always socially coded by gender.
  *   **The Shift:** Even in a grief story, a gender flip should force **recalibration** of the supporting cast's reactions. If you flip the gender and *nothing else changes* (including how others treat the griever), you haven't written a variation; you've written a fantasy world where sexism doesn't exist. That is a setting change (Case 2), not a cosmetic one.
  *   **Verdict:** The knob is **always loaded** in realistic fiction. Your "cosmetic" verdict is only valid if the story is hermetically sealed from society (e.g., a monologue in a void).

  **2. Rejection of your Case 6 "Snap" (The Nature of Inversion)**
  *   **Your Gut:** Flipping every moral choice snaps the theme.
  *   **The Principle's Correction:** This is not a snap; it is a **Structural Inversion**. In music, playing a melody in inversion (intervals go down instead of up) is a standard variation technique, not a destruction of the theme.
  *   **The Shift:** If you flip every choice, you are testing the **boundary conditions** of the theme. Does the theme hold if the agent is inverted? If the story collapses, the theme was dependent on that specific morality. If the story holds (e.g., a "Dark Mirror" universe), it is a valid, high-strain variation.
  *   **Verdict:** Do not call it a break. Call it a **Negation Variation**. It is the highest setting on the "Morality" knob, not a broken knob. It reveals the theme by showing its shadow.

  ### Summary Specification
  To determine if a knob is thematic:
  1.  **Twist it.**
  2.  **Ask:** "Does this force me to change something else to keep this from making no sense?"
      *   **No:** It's paint (Case 1, 5).
      *   **Yes:** Proceed to 3.
  3.  **Ask:** "After I make those changes, is the core relationship (A causes B) still recognizable?"
      *   **No:** You broke it (Case 6 - unless aiming for Negation).
      *   **Yes:** It's a variation (Case 2, 4).
