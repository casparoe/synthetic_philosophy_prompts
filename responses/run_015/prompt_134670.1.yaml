answer: |-
  Your implicit theory holds together very well, but the institutional split you're observing suggests a third category beyond the standard Naturalist/Normativist dichotomy. Here is the breakdown of why the current practice is philosophically inconsistent and what biomarker-driven medicalization would actually entail.

  ### 1. The Naturalist/Normativist Tension
  The current split is not strictly Naturalist, nor is it purely Normativist. It is **Technocratic Naturalism**.

  *   **Why it's not strict Naturalism:** A strict Naturalist view (e.g., Boorse) defines disease as a deviation from species-typical biological function that reduces survival or reproduction. Since chronic loneliness demonstrably increases mortality (via inflammation, HPA axis dysregulation, cardiovascular strain), a consistent Naturalist framework *should* classify severe loneliness as a pathology. The fact that it doesn't suggests the system isn't actually looking for "biological dysfunction" broadly, but rather **localized, measurable biological lesions.** Obesity has leptin, insulin, and adipose tissue; loneliness has diffuse neuroendocrine effects that are harder to pin to a specific organ.
  *   **Why it's not strict Normativism:** A pure Normativist view (e.g., Fulford) suggests we call something a disease when we value medical intervention for it. Here, the normativity is hidden. We *do* value fixing loneliness (hence "social prescribing"), but we normatively decide that medicine is the wrong tool for the job. However, we *also* normatively decide that bariatric surgery is the right tool for obesity, even though obesity also has massive social determinants (food deserts, poverty).

  **The Real Driver:** The split presupposes a view of health where **disease = a defect located within the individual body that can be fixed by a transaction.**
  *   Obesity fits this: The defect is in the patient, the fix is a pill/procedure, the transaction is billable.
  *   Loneliness violates this: The defect is often in the *environment*, the fix requires reciprocal social action, and the transaction is unbillable.

  So, the institutional split presupposes **Methodological Individualism**. It treats the patient as a closed system. If the dysfunction requires opening the system (fixing the community), it ceases to be "medical" and becomes "social," regardless of the mortality risk.

  ### 2. Can the Practice be Explained by Either View?
  Neither view fully explains the practice without modification.
  *   **Naturalism fails** because it ignores the physiological damage of loneliness despite the evidence.
  *   **Normativism fails** because it implies a conscious value judgment about what *should* be treated. In reality, the distinction is often inertial. We medicalize what fits the existing infrastructure (clinics, pharma, insurance codes).

  The practice is best explained by **Feasibility Reductionism**: A condition is a "disease" if the medical industrial complex has a proprietary technology to intervene. If the intervention requires policy changes, urban planning, or community building, it is offloaded to the "social" sphere, even if the biological cost is identical.

  ### 3. The "Social Deficit Disorder" Scenario (Cortisol/Oxytocin)
  If we started treating neuroendocrine patterns as biomarker proof of a "social deficit disorder," current practice would shift drastically, but likely in ways that reinforce the individualistic bias.

  **What would change:**
  1.  **Individualization of Structural Problems:** Loneliness would move from a "social determinant of health" to a "patient pathology." Instead of asking "Why does this community have no third places?", medicine would ask "Why does this patient have low oxytocin?" This risks depoliticizing the root causes.
  2.  **Pharmaceuticalization:** Once you have a biomarker, you have a target for a drug. We would see a rush to develop oxytocin agonists or cortisol blockers to "treat" loneliness, rather than funding social infrastructure. It turns a relational need into a chemical deficiency.
  3.  **Billing and Access:** Paradoxically, this might help patients in the short term. A diagnosis means insurance coverage. People could get treatment for isolation under medical benefits rather than waiting for underfunded social programs.
  4.  **Stigma Shift:** Loneliness would shift from being seen as a circumstantial misfortune (like unemployment) to a biological failure (like diabetes). This increases access to care but increases individual shame.

  ### 4. Does the Implicit Theory Hold Together?
  Yes. Your observation exposes that our definition of "disease" is not actually based on harm or biology, but on **interventional ownership.**

  The system operates on a tacit agreement: **Medicine owns problems that can be solved by altering the patient's body. Society owns problems that require altering the patient's context.**

  The inconsistency you spotted is that the body reacts to the context. By refusing to medicalize loneliness, the system protects itself from being held responsible for problems it cannot solve with a prescription pad. If loneliness were an ICD code with the same weight as pre-diabetes, the healthcare system would be forced to acknowledge that its current toolkit (drugs and surgery) is insufficient, requiring a radical restructuring of what "care" looks like.

  **Verdict:** The split is not philosophical consistency; it is institutional self-preservation. Medicalizing loneliness without changing the delivery model would just turn social isolation into another chronic condition to be managed rather than prevented.
