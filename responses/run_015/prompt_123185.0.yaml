      *   *Killer Requirement:* The "Welfare Floor" (don't kill a happy patient) usually kills Strict Precedent Autonomy. Or "Administrability" kills complex nuanced theories. Let's argue "The Competence Threshold + Welfare Floor" creates the squeeze. Actually, the *Asymmetry* justification is often the weakest link. Let's pick the **Welfare Floor** as the disqualifier for strict views.

  9.  **Refining the Tone:**

