          *   *Better Idea:* A comparative pair. The Holocaust (as the baseline) vs. The Khmer Rouge (Cambodia).
          *   *Why?* Khmer Rouge kills millions, but was it genocide? They killed "class enemies," not necessarily protected groups (national, ethnical, racial, religious). This forces students to grapple with the *group* element, not just the *body count*.
          *   *Wait, the prompt asks for ONE carrying example or comparative case.* Let's stick to **The Khmer Rouge (Democratic Kampuchea)**. It is the perfect stress test for the legal definition because the scale is genocidal, but the legal qualification is contested (until the ECCC ruling on Cham Muslims and Vietnamese).
          *   *Why "Undifferentiated Mass Killing" fails:* If we use a generic "dictator kills 100k people," students focus on *scale*. Genocide is about *target identity*, not scale. A small scale can be genocide; a large scale can be mass murder.
      *   **Misconceptions & Interventions:**
          *   *Misconception 1:* Genocide = Big Murder. *Intervention:* When introducing the *actus reus*. Stop them from counting bodies. Ask "Who died?" not "How many?"
