          *   *Wait, the prompt asks for an explicit statement on what portion should be omitted and why.* I need to state that I am omitting the *cultural destruction* aspect of Lemkin's original Axis of Evil concept for this specific session.
          *   *Why?* Because 1Ls need to master the *positive law* (UNGC Art. II) before critiquing it. Mixing the moral ideal with the legal rule confuses the standard of liability.
      *   **Closing Question:**
          *   Must be about *performative stakes*. Not "What are the elements?" but "What happens when we say the word?"
