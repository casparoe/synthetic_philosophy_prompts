          2.  One carrying example/comparative case (anchoring the discussion) + justification for why "undifferentiated mass killing" fails.
          3.  Predictable misconceptions (genocide = mass homicide; neglect of "plan to destroy group as such") + exact intervention points.
          4.  Single closing question (testing performative stakes, not just element recitation).
          5.  Explicit statement on omitted portion of Lemkin's framework (cultural destruction) + justification for omission.
          6.  Constraint: No reading list.
      *   **Time:** 50 minutes.

  2.  **Deconstruct the Content & Logic:**
      *   *Core Tension:* Lemkin's broad vision (cultural + physical) vs. UN Convention's narrow legal definition (physical/biological).
      *   *Core Skill:* Distinguishing "crime of crimes" (genocide) from war crimes/crimes against humanity (mass killing).
      *   *Core Insight:* The label "genocide" is performative; it triggers specific obligations and political reactions.

  3.  **Drafting - Section by Section:**

