answer: |-
  # Teaching Plan: The Politics and Law of Genocide
  **Target Audience:** First-Year Law Students (1L)
  **Duration:** 50 Minutes
  **Subject:** International Criminal Law / Legal Theory

  ## I. Conceptual Sequence and Dependency Relations
  *The following order is rigid. Later concepts rely on the precise definition of earlier ones to prevent category errors.*

  1.  **The Pre-Legal Intuition (5 mins):** Establish that "mass killing" is insufficient to describe the specific harm of genocide.
  2.  **Lemkin's Sociological Formulation (10 mins):** Introduce genocide as the destruction of a group's *existence* (not just members).
  3.  **The UN Convention Compromise (10 mins):** Contrast Lemkin with Article II of the Genocide Convention (UNGC). Establish the *positive law* boundaries (Protected Groups + Specific Intent).
  4.  **The Carrying Case Application (20 mins):** Apply the UNGC definition to the Khmer Rouge regime.
  5.  **The Performative Stake (5 mins):** Synthesize the legal and political consequences of the label.

  **Dependency Logic:** Students cannot understand *Specific Intent (Dolus Specialis)* until they understand *Protected Groups*. They cannot understand the *Politics of Naming* until they understand the *Legal Consequences* of the label. Therefore, the Legal Definition must precede the Case Study, and the Case Study must precede the Political Synthesis.

  ## II. The Carrying Example: The Khmer Rouge (Democratic Kampuchea)
  **Anchor:** The regime of Pol Pot (1975–1979).
  **Specific Focus:** Contrast the killing of ethnic **Khmer** citizens (class-based "autogenocide") against the killing of **Cham Muslims** and **Ethnic Vietnamese** (group-based destruction).

  **Why this anchors the discussion:**
  The Khmer Rouge killed approximately 1.7 million people. If students focus only on scale, this is the quintessential genocide. However, under the UNGC, the killing of ethnic Khmer by ethnic Khmer (based on political class or ideology) is technically *not* genocide, whereas the targeting of Cham Muslims *is*. This forces students to decouple "atrocity" from "genocide."

  **Why an undifferentiated "mass killing" example fails:**
  Using a generic example (e.g., "A dictator kills 100,000 civilians") invites the **Scale Fallacy**. Students will assume the legal threshold is a body count. The Khmer Rouge example demonstrates that 1.7 million deaths can be partially genocide and partially crimes against humanity, depending entirely on the *identity of the victim*, not the *number of victims*.

  ## III. Predictable Misconceptions and Intervention Points
  *Do not wait for the end of class to correct these. Interrupt the flow at these exact junctures.*

  ### Misconception 1: The Scale Fallacy
  *   **The Error:** Students equate genocide with "large-scale homicide" or "the worst mass murder."
  *   **Interruption Point:** **Minute 15**, immediately after introducing the Khmer Rouge death toll but *before* analyzing the victim groups.
  *   **Correction Protocol:** Stop the discussion on numbers. Ask: *"If Pol Pot had killed only 500 people, but they were all the remaining elders of the Cham Muslim community to ensure the culture died, is the scale too small for genocide?"* Force the shift from quantitative (how many) to qualitative (who and why).

  ### Misconception 2: The Intent Conflation
  *   **The Error:** Students confuse *knowledge of consequences* (I know they will die) with *specific intent* (I want the group to cease existing).
  *   **Interruption Point:** **Minute 25**, during the analysis of the *Dolus Specialis* element applied to the "Class Enemy" Khmer victims.
  *   **Correction Protocol:** When a student argues, *"He knew his policies would wipe out the Khmer people,"* interrupt. Respond: *"Foreseeing a storm is not the same as summoning it. Does the law punish the reckless architect or the arsonist?"* Require them to identify evidence of a *plan to destroy the group as such*, distinct from a plan to secure political power through brutal means.

  ## IV. Deliberate Omission: Lemkin's Cultural Dimension
  **Explicit Statement of Omission:**
  In this session, I will deliberately omit Raphael Lemkin's original inclusion of **cultural destruction** (e.g., banning language, destroying libraries, prohibiting religious practice without physical killing) as a standalone act of genocide.

  **Pedagogical Justification:**
  1.  **Black-Letter Clarity:** 1L students must first master the *positive law* (UNGC Article II) which excludes cultural destruction as a standalone act (it was removed during drafting due to colonial state objections). Introducing Lemkin's broader sociological definition simultaneously creates confusion regarding the current standard of liability.
  2.  **Liability vs. Morality:** This session focuses on *criminal liability*. While cultural destruction is morally genocidal in Lemkin's view, it is not legally genocidal under current international criminal law (unless tied to physical/biological destruction). We must distinguish what is *evil* from what is *actionable in court* before critiquing the gap between them.

  ## V. Closing Question (The Performative Stake)
  *Do not ask students to recite the elements of Article II. Ask the following:*

  > **"If the UN Security Council formally determines a situation is 'genocide' rather than 'ethnic cleansing' or 'crimes against humanity,' what specific obligation is triggered for member states that would otherwise not exist?"**

  **Desired Insight:**
  Students must identify that the label "genocide" triggers the specific obligation to **prevent and punish** under Article I of the Convention, creating a legal mandate for intervention that "crimes against humanity" does not strictly impose. The question tests whether they understand that the definition is not merely descriptive, but **jurisdictional and obligatory**.
