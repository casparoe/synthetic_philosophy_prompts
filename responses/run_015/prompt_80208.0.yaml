      *   *Check:* Is the ranking clear?
      *   *Correction:* Use explicit headers and justification for the ranking.
      *   *Check:* Did I answer the specific question about "reversible in action but not experience"?
      *   *Correction:* Make this the #1 objection. It strikes at the heart of the definition of harm.

  10. **Final Polish:** Ensure the distinction between "welfarist" and "deontological" objections is clear, as a PhD student will care about that theoretical grounding. (Proceed to generate output).

