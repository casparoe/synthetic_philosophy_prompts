  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I address the "Surprise" requirement?
      *   *Fix:* Add it to the Phenomenological/Consciousness cluster.
      *   *Critique:* Did I clearly distinguish between the *theory* spec and the *rule* spec?
      *   *Fix:* The prompt asks for a spec for a *theory* that is good enough for the *purpose*. So the requirements are on the theory, but constrained by the purpose.
      *   *Critique:* The prompt asks for "Which single requirement excludes the most candidate accounts."
      *   *Fix:* Identify "Artifact-only Decidability" as the killer.
      *   *Critique:* Make sure to explicitly mention the "Camp Prejudices."
      *   *Fix:* Label them clearly in the list.

  9.  **Final Polish:** Check against the prompt's specific request for "structure of the list rather than a scorecard." Ensure the analysis of unsatisfiability is prominent. (Proceed to generate output).

