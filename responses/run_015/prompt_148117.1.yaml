  *   *Artifact-only:* Institutional Desideratum (practical) but Philosophically suspect.
  *   *Surprise/Effort:* Humanist Camp Prejudice.
  *   *Parity:* Functionalist Camp Prejudice.
  *   *Silence on Quality:* Institutional Desideratum.

