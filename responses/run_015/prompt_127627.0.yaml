      *   *Scaling-Indifference:* This sounds like a restatement of the underdetermination thesis. If $N$ data points fit Rule A and Rule B, $N+1$ (if generated by the model itself) doesn't help unless we assume the model *means* A. But the skeptic asks: what fact makes it A? More weights just mean a more complex finite state machine.
