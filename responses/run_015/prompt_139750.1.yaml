  **Brainstorming Candidate Principles**

  1.  **Absolute Artistic Sovereignty:** Art owes nothing to its subjects; truth is the only metric. (Discard: Ignores the material consequences of thin mediation.)
  2.  **Community Veto:** Identifiable communities hold rights of approval over depictions. (Discard: Unenforceable, kills fiction, makes board wince.)
  3.  **Restorative Paratext:** Harm is mitigated by allowing counter-narrative in the same space. (Discard: Risks forced speech, complicates copyright.)
  4.  **Duty of Care:** Authors owe a minimal duty to avoid gratuitous harm to vulnerable subjects. (Discard: Too vague, chills investigation.)
  5.  **Collective Ownership of Trauma:** Communities own their pain and can license it. (Discard: Makes the board wince; implies communities are legal persons.)

  ***

  **MEMORANDUM**

  **TO:** Governing Board, Association of American Novelists
  **FROM:** [Your Name]
  **SUBJECT:** Decision on Kiln Head Petition

  I recommend we dismiss the petition (Motion A) but adopt a non-binding ethical guideline encouraging engagement with identifiable communities.

  We are asked to adjudicate a conflict between artistic liberty and communal integrity. The petitioners argue that *The Drownings* has become constitutive of Kiln Head's identity due to "thin mediation"—the absence of local media means the novel functions as the primary text through which outsiders understand the village. This is a sophisticated claim. It moves beyond reputational harm (defamation) to contested authorship. However, recognizing a moral stake is not the same as granting a legal right. Motion C (adopting a reply mechanism) treats the village as a rights-holder comparable to the author. This is where we must stop.

  State the strongest version of Motion C clearly: *Because the novel now functions as the village's public record, the community deserves a right of reply within the text itself to correct the record and mitigate harassment.* This argument is morally coherent. If a depiction becomes constitutive, the depicted share authorship of the social reality created. To deny them a voice in that reality is to exercise power without accountability.

  However, we cannot adopt Motion C. First, it converts the novel into a public forum. Compelling an author to publish another's prose within their work raises significant First Amendment concerns regarding forced speech; counsel would need to verify if our code can enforce this without exposing the Association to liability. Second, it is a veto with the serial numbers filed off. If a village can demand space in every edition, they can demand changes to secure that space, effectively gaining editorial control. Third, it is inconsistent. Two years ago, we declined to act on a police complaint because occupational bodies have channels to answer back. Kiln Head has no local paper, true, but granting them a unique right within the text creates a special class of subject that individual characters do not enjoy.

  Motion B (censure) is equally problematic. Censuring the author for "failing to engage" establishes a procedural standard we cannot define. How many days of visitation constitute engagement? Does disclosure of novelist status invalidate the observation? We would be policing method rather than outcome.

  Motion A (dismiss) is the only legally defensible option, but it is morally insufficient if left bare. It ignores the reality of thin mediation. When a community lacks the infrastructure to narrate itself, an outsider's narrative does not just represent them; it replaces them. We cannot grant the village rights, but we can acknowledge the asymmetry.

  Therefore, I propose we dismiss the petition but amend our Code of Ethics with the following operative principle:

  *Members should strive to engage with identifiable living communities when depicting specific local tragedies, recognizing that in contexts of thin mediation, depiction may become constitutive; however, final artistic authority and copyright remain solely with the author.*

  This language is amendable. It signals to the membership that we understand the harm of extraction without granting veto power to subjects. It encourages the "duty of care" without making it enforceable. It allows us to tell Kiln Head we hear them, without telling our members they must surrender their work.

  Regarding the request for a guaranteed response in future editions: We cannot mandate this. We can, however, offer to facilitate a dialogue between the author and the village council, mediated by the Association, to discuss a voluntary statement. If the author refuses, the matter ends. This respects the author's position that the village is a setting, not a claimant, while acknowledging the residents' feeling of dispossession.

  **Confidence**

  My recommendation turns on two distinct claims. First, a substantive moral claim: that "constitutive depiction" creates a moral obligation to engage, even if it creates no legal right. I am highly confident in this distinction; conflating the two leads to censorship. Second, a stipulation: that a non-binding guideline is sufficient to mitigate future harm. I am less confident here. Without enforcement, "should strive" may be ignored. If the board rejects this framing and demands enforceable remedies, I would move toward Motion B (censure) only if we can define "engagement" precisely, though I advise against it. If the board believes communities *can* hold stakes equivalent to individuals, I cannot support any motion that doesn't grant them veto power, but I argue strongly that such a position is incompatible with the profession we govern. We protect novels, not places. But we should remind our members that places contain people.
