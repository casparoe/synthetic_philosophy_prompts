  3.  **Identify the Core Philosophical/Statistical Error:**
      *   The error is conflating **within-group variance** with **between-group mean differences**.
      *   $h^2$ is a ratio of *variances* ($V_G / V_P$) within a specific population in a specific environment.
      *   Mean differences are about *expectations* ($E[Y]$), not variances ($Var[Y]$).
      *   You cannot infer the cause of a difference in *means* from the proportion of *variance* explained within the groups.
      *   *Analogy time:* Two piles of books. Pile A on a table, Pile B on the floor. Height of books varies within piles (variance). Height of piles differs (mean difference). The variance within piles doesn't tell you why the piles are at different levels.

  4.  **Formulate the Explanation (The "Walkthrough"):**
      *   **Validate the Student:** Acknowledge this is a classic, powerful objection (Lewontin 1970). It's not a silly mistake; it's a deep conceptual trap.
