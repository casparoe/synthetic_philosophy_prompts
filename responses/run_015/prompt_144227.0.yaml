prompt: |-
  hi — i'm writing my third-year dissertation on how the Atlantic slave system actually ended, so i've got the Williams thesis (interests: the sugar colonies stopped paying, so the plug got pulled) on one side and Appiah's honour story on the other, and my supervisor is a rational choice guy who keeps deflating the whole thing. His line is that a norm is just a convention, exactly like driving on the left: everybody does it because everybody expects everybody else to, nobody in the history of the world was ever argued out of driving on the left, and when people switch it's because enough other people switched. So the abolitionists' arguments were the obituary, not the cause — they're what people wrote while the real mechanism did its work. He runs the same line on duelling: nobody refuted the code duello, gentlemen just gradually stopped caring. When I pointed out that i vaguely remember someone (Drescher?) arguing the West Indian sugar economy was still growing, not dying, when Britain abolished the trade, he just said fine, then something else in the payoff structure moved and that's what I should be looking for. When I pushed harder he switched analogies entirely: it's like a fashion, nobody argues anyone out of flared trousers.

  The analogy is doing a lot of work in his hands — it's basically what licenses "arguments were epiphenomenal, go find the real cause" — and I can't tell how much of that is the analogy and how much is the model it's riding on. I sat down to to write it out as an actual payoff matrix and got stuck in about ten minutes, because I couldn't work out who the players are even supposed to be (planters? MPs? the people being enslaved? the people boycotting slave-grown sugar? the guys being press-ganged onto the anti-slave-trade patrols?) or whether we're in a common-interest coordination game at all. I've started calling this the "coordinating with whom" problem, which I'm fairly sure isn't a real term.

  Could you audit the driving-on-the-left analogy for me: what corresponds to what if you take the mapping seriously, where it breaks, and specifically which of the disanalogies matter for the conclusion he's using it for and which are just noise. The things I keep getting snagged on: pure conventions are cases where everyone is better off matching, whereas abolishing slavery looks like some people's interests being straight-up defeated (and then compensated, at enormous public expense, which seems like an odd thing for a convention to require); norms come with honour and blame and shame bolted onto them in a way that driving on the left doesn't seem to; and his payoffs look like they're meant to be fixed while Appiah's story seems to be about what people want changing — which, if that's right, means the argument and the payoff shift aren't two separate things he gets to choose between, and the whole "epiphenomenal" move quietly assumes what it needs to prove. If the convention picture genuinely can't carry the anti-argument bit, is there a better analogy that does the work Appiah wants (honour as a kind of credit? a norm as a language? a boycott or a strike, where the argument is part of the mechanism?) — and would that better one rescue my supervisor's conclusion too, or does "the arguments didn't matter" only survive inside the coordination version? I don't need to win the supervision, I just want to know which bit of his picture is load-bearing.
