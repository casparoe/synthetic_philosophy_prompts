answer: |-
  This is a exceptionally sharp diagnosis of a methodological problem that often hides in plain sight in rational choice history. You have correctly identified that your supervisor is using an analogy to smuggle in a substantive theoretical assumption—specifically, the assumption of **fixed preferences**—and then using that assumption to rule out the causal efficacy of moral argument by definition.

  Your "coordinating with whom" problem is not a standard term, but it describes a very real issue in game theory: the problem of **asymmetric multiplayer games with endogenous payoffs**. The driving analogy works only because it models a *symmetric, single-move, pure coordination game with exogenous payoffs*. Abolition is none of those things.

  Here is an audit of the driving-on-the-left analogy, broken down by mapping, breaking points, and the load-bearing assumptions.

  ### 1. The Mapping (If we take the supervisor seriously)

  To make the driving analogy work for abolition, the supervisor has to map the variables like this:

  *   **The Players:** All drivers $\rightarrow$ All relevant political/economic actors (MPs, Planters, Merchants).
  *   **The Strategy:** Drive Left/Right $\rightarrow$ Support Slavery/Abolition.
  *   **The Payoff:** Avoid Collision $\rightarrow$ Avoid Social/Economic Sanction.
  *   **The Equilibrium:** Uniformity $\rightarrow$ Consensus (either Pro- or Anti-Slavery).
  *   **The Mechanism:** Network Effects (it's only safe if everyone does it) $\rightarrow$ Social Sanction (it's only profitable/safe if everyone agrees).
  *   **The Argument:** Road signs $\rightarrow$ Abolitionist pamphlets (informational only, not motivational).

  ### 2. Where the Analogy Breaks (The Disanalogies)

  There are three structural breaks here. Two are noise; one is fatal to the supervisor's conclusion.

  **A. Symmetry vs. Asymmetry (Noise)**
  In driving, all players are identical. In slavery, the players have radically different payoff structures.
  *   *Planters:* Payoff is negative if abolition happens (loss of capital/labor), unless compensated.
  *   *Enslaved:* Payoff is infinitely positive if abolition happens (freedom), but they have almost no agency in the "driving" model.
  *   *Consumers:* Payoff is mixed (higher sugar prices vs. moral satisfaction).
  *   *Why it matters:* You cannot solve this with a single coordination matrix. It's a bargaining game, not a coordination game. However, a clever rational choice theorist could argue "we aggregate the MPs as the deciding players." So, this is a problem, but not the *fatal* one.

  **B. Compensation (Significant)**
  As you noted, conventions do not require compensation. If Britain switched to driving on the right tomorrow, they wouldn't pay drivers £20 million (1833 Emancipation Act sum) to make up for the inconvenience.
  *   *The Break:* The fact that planters were compensated acknowledges that abolition was a **taking of property**, not a shift in convention. It admits that one side's payoff was forcibly reduced.
  *   *Supervisor's Counter:* He would say the compensation was just a "side payment" to facilitate the coordination equilibrium (Coase theorem).
  *   *Rebuttal:* Side payments happen in coordination games, but usually to cover transition costs, not to offset the fundamental value of the strategy being abandoned. You don't pay people to stop wearing flared trousers.

  **C. Fixed vs. Endogenous Preferences (Fatal)**
  This is the load-bearing wall.
  *   **Driving:** My preference for "not crashing" is fixed. The argument "you should drive on the left" does not change my utility function; it only informs me of the equilibrium.
  *   **Abolition (Appiah's View):** The abolitionist argument *changed the utility function*. It made "owning slaves" yield negative utility (shame) rather than positive utility (honour/profit).
  *   **The Break:** In the driving analogy, the payoff matrix is static. In the honor model, the argument *rewrites the matrix*.
  *   **Why it kills the conclusion:** If the argument changes the payoffs, the argument is **causal**. By insisting on the driving analogy, your supervisor is assuming preferences *cannot* change via discourse. He is defining moral argument as epiphenomenal by choosing a model where discourse has no mechanical leverage.

  ### 3. The "Coordinating With Whom" Problem

  You are right to be stuck here. In a pure coordination game (driving), it doesn't matter who you coordinate with, as long as it's *everyone*.

  In abolition, the coordination was **segmented**:
  1.  **Parliament** had to coordinate with **Public Opinion** (to avoid unrest/election loss).
  2.  **Merchants** had to coordinate with **Consumers** (to sell goods).
  3.  **Navy** had to coordinate with **Government** (to enforce blockade).

  If you try to write this as a matrix, you realize the "Crash" condition isn't "we choose different sides." The "Crash" condition is "Planters choose Slavery, Public chooses Abolition." This is not a coordination game (where we both want to match); it is a **Battle of the Sexes** or a **Chicken** game. We *don't* want to match. The Planters want Slavery/Slavery. The Abolitionists want Abolition/Abolition.

  If it's a conflict game, then "everyone else switched" is not a sufficient explanation. You have to explain why the Planters *lost* the conflict. Was it economic (Williams)? Was it moral pressure (boycotts)? Was it fear of revolt (Haiti)? The driving analogy erases the conflict, which is the entire historical phenomenon.

  ### 4. Better Analogies for Appiah's Model

  If you want to model Appiah's "Honor Code" without conceding to the "epiphenomenal argument" claim, you need an analogy where **speech acts change payoffs**.

  **Option A: The Currency Devaluation (Honor as Credit)**
  *   **Model:** Honor is a currency. Planters rely on "Honourable Merchant" credit to do business.
  *   **Mechanism:** Abolitionists don't just argue; they **counterfeit** or **devalue** the currency. By labeling sugar "blood-stained," they reduce the purchasing power of Planter Honor.
  *   **Why it works:** It explains why arguments matter. The argument *is* the market mechanism. It changes the exchange rate.
  *   **Does it save the Supervisor?** No. It shows that discourse is a material force that alters economic payoff structures.

  **Option B: The Strike (Boycott as Payoff Shift)**
  *   **Model:** Consumers are workers; Sugar is the product.
  *   **Mechanism:** The argument persuades consumers to withhold labor (money). This physically alters the Planter's payoff matrix (Profit $\rightarrow$ Loss).
  *   **Why it works:** It bridges the gap between "moral argument" and "rational choice." The argument causes the boycott; the boycott changes the rational choice for the MP/Planter.
  *   **Does it save the Supervisor?** It forces him to admit the argument was the *cause* of the payoff shift. His claim that "something else in the payoff structure moved" is true, but his implication that "therefore the argument didn't matter" is false. The argument *moved* the payoff structure.

  ### 5. Audit Verdict: What is Load-Bearing?

  The load-bearing part of your supervisor's picture is **not** the rational choice model itself. It is the **exogeneity of preferences**.

  *   **The Analogy's Job:** The driving analogy is doing the work of making preferences look exogenous. Because nobody argues about which side of the road to drive on (it's purely instrumental), the analogy makes it seem like nobody *should* argue about slavery (it's purely instrumental).
  *   **The Flaw:** Slavery was constitutive of identity and moral status, not just a traffic rule.
  *   **The Conclusion:** The claim "arguments were the obituary, not the cause" **only survives inside the coordination version.**
      *   If you switch to a **Preference-Transformation Model** (Appiah), the arguments are the engine.
      *   If you switch to a **Conflict Model** (Marx/Williams), the arguments are the ideology of the winning class (still epiphenomenal, but for different reasons).
      *   If you switch to a **Signaling Model** (Honor), the arguments are the signaling mechanism that makes the norm stick.

  ### Recommendation for the Dissertation

  You don't need to win the supervision, but you need to isolate the variable.

  1.  **Grant the Rational Choice Framework:** Tell him you accept that actors respond to incentives.
  2.  **Challenge the Payoff Source:** Argue that in a *moral* market, **information is an incentive.** If Appiah is right, "Shame" is a cost. "Honor" is a benefit. Abolitionist arguments were the mechanism that delivered those costs/benefits.
  3.  **The "Obituary" Test:** If arguments were just the obituary, why did the opposition spend so much money on counter-arguments? In a pure coordination shift (like changing voltage), nobody argues against the new voltage once the decision is made. In abolition, the Planters fought tooth and nail. This suggests they knew the *arguments* were changing the payoffs, not just reflecting them.
  4.  **Use the Compensation Point:** This is your strongest empirical wedge. Conventions don't cost £20 million. Property seizures do. If it was a convention shift, why pay? Because the Planters' *preferences* were fixed (they wanted slavery), and their *payoffs* were being forcibly altered by the state due to external pressure (moral/economic).

  **Summary:** The driving analogy is a **category error**. It models a *technical standard* (which side of the road) as if it were a *moral norm* (ownership of humans). Technical standards shift via coordination; moral norms shift via preference transformation. Your supervisor's conclusion that "arguments didn't matter" is an artifact of choosing a model where arguments *cannot* matter. You have permission to discard the analogy while keeping the rigor.
