answer: |-
  **Title:** The Architecture of Attention
  **Time:** Approx. 8 Minutes
  **Tone:** Rigorous, Warm, Grounded

  Graduates, faculty, families, and friends:

  We gather here at a threshold. Behind you lies a structure of requirements, syllabi, and deadlines that told you exactly what to do with your time. Ahead of you lies a vast, unmarked territory. It is traditional at this moment to offer you a map. Usually, that map is drawn in the ink of optimism. You are told to "follow your bliss." You are assured that happiness is your birthright, a destination waiting for you if you simply choose it.

  I am not going to offer you that map. Not because I wish you ill, but because that advice is philosophically unsound, and practically dangerous.

  To tell you to "follow your bliss" is to assume that happiness is a feeling that happens *to* you, like weather. It suggests that your only job is to locate the sunny spots and avoid the rain. But if there is one thing your education should have taught you, it is that the most valuable things in human life are not found; they are built.

  I have been thinking recently about the work of Émilie du Châtelet, the eighteenth-century philosopher and mathematician. She argued that happiness is not a stroke of luck, nor is it a passive state of contentment. She called it a "taste." And like any taste—for music, for food, for truth—it must be educated. It requires discipline.

  Du Châtelet made a sharp distinction between two kinds of pursuit. The first is the pursuit of distraction. This is the restless movement from one novelty to the next, consuming experiences without digesting them. It is the feeling of being busy without being engaged. The second is the cultivation of passion. This is the deep, often difficult engagement with a subject, a person, or a craft that orders your soul.

  Why does this distinction matter to you, today, standing between the library and the world?

  Because we are entering an economy of attention that is running a deficit. We live in a time that profits from your distraction. Algorithms are designed to fragment your focus; public discourse is designed to outrage your nerves. If you treat happiness as the consumption of distractions, you will not only exhaust yourselves; you will deplete the shared resources we all need to survive together.

  Think of trust. Think of patience. Think of the capacity to listen to someone with whom you disagree. These are not infinite resources. They are common goods. When we treat our own minds as playgrounds for endless, undisciplined novelty, we become incapable of sustaining the relationships that hold our families and cities together. A society of people seeking only "bliss" is a society that cannot endure hardship, cannot care for the vulnerable, and cannot build anything that lasts.

  This brings me to a tension we must acknowledge. My colleagues in the humanities know that du Châtelet wrote from a position of privilege. She had leisure. She had security. It is easy to talk about "ordering your passions" when you are not worried about your next meal or your physical safety. To many of your families, and to the communities you will serve, a philosophy of self-cultivation can sound like a luxury they cannot afford.

  Your friend in the world—the one who argues with you over coffee—might say that this vision of happiness is aristocratic. They are partially right. The *conditions* for happiness are not distributed equally. Scarcity is real. Injustice is real. You will graduate into a world where the freedom to study, or to love without fear, is not guaranteed.

  But the *practice* of happiness—the discipline of choosing what you care about—is not a luxury. It is a necessity. Especially in times of scarcity.

  When resources are thin, attention becomes the most valuable currency you have. If you spend it on counterfeit joys, you have nothing left for the work that matters. If you give your attention to everything, you give it to nothing. To order your passions is not to retreat from the world into an ivory tower. It is to decide, rigorously, what is worthy of your finite energy so that you do not burn out before you have contributed anything of value.

  So, what is my charge to you?

  It is not to go out and be happy. It is to go out and build the capacity for happiness, in yourselves and in each other.

  For the graduates: Do not suppress your desires, but do not be enslaved by them. Du Châtelet taught that we cannot simply extinguish our passions; we must direct them. Find the work that requires you to grow. Find the love that requires you to be honest. These things will not always feel like "bliss." Often, they will feel like friction. They will feel like the hard work of learning a new language, or the exhaustion of caring for an aging parent, or the frustration of fixing a broken system. That friction is not a sign that you are failing. It is a sign that you are engaging with reality rather than consuming a simulation of it.

  For the families and friends here: You may worry that this sounds cold. You may worry that we are telling your children to value work over joy. We are not. We are telling them that joy is the byproduct of mastery, not the goal of consumption. The deepest happiness comes from the illusion we choose to sustain—the belief that our efforts matter. Protect that belief in them. And when they are tired, do not tell them to "cheer up." Help them reorder their attention. Remind them what they love, and why it was worth the struggle.

  And for all of us: We must recognize that this is a collective project.

  We cannot order our passions in isolation. If I am constantly distracted, I am a bad colleague, a bad partner, a bad citizen. I drain the patience of those around me. But if I cultivate the discipline to focus, to listen, to engage deeply, I contribute to a reservoir of stability that others can draw from.

  We are asking you to enter a public life that is often noisy and fractured. The temptation will be to add to the noise, to seek the quick validation of the crowd, or to retreat entirely into private comfort. Both are forms of the same error: treating happiness as something you take, rather than something you make.

  Instead, we ask you to treat your attention as a public trust. When you choose to focus on truth rather than comfort, you make it easier for others to do the same. When you choose to love with discipline rather than impulse, you make relationships more durable for everyone. When you refuse to treat your own mind as a marketplace for distractions, you preserve the common ground we need to stand on together.

  This is not a promise that you will be safe. It is not a promise that you will be rich. It is not even a promise that you will always feel happy.

  It is a promise that if you treat your life as a structure to be built, rather than a lottery to be won, you will have something to stand on when the ground shakes.

  Du Châtelet once wrote that to be happy, one must be capable of illusion—but only the illusions that elevate us. She meant that we must choose to believe in the value of our work, even when the world is indifferent.

  So, go forth. Not to chase happiness, but to cultivate it. Not as a private secret, but as a public contribution. Order your passions. Guard your attention. Love what is difficult. And in doing so, help build a world where happiness is not a rare privilege for the few, but a sustainable practice for us all.

  Congratulations.
