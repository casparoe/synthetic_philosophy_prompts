      *   *Mitigation:* In climate, it's decarbonization/CCS. In s-risk, is alignment research, moral circle expansion, regulatory guardrails on simulation.
      *   *Intergenerational Equity:* In climate, it's future generations bearing the cost of current emissions. In s-risk, it's digital sentients (potential vast numbers) bearing the cost of current design choices.

  3.  **Task 2: Identifying Disanalogies:**

      *   *Ontology:* CO2 is physical and measurable. Suffering is phenomenological and contested (illusionism vs. realism, functionalism vs. biological naturalism).
      *   *Observability:* We can measure ppm CO2. We cannot measure "hedons" or "dolors" directly.
      *   *Agency:* Climate is a blind physical process. S-risk involves *agents* (AI or humans) potentially *intending* or *indifferent* to suffering, adding a game-theoretic layer absent in physics.
      *   *Reversibility:* Climate damage is hard to reverse but physically bounded. Digital suffering could be copied/deleted instantly, but if locked in, could be eternal.

  4.  **Task 3: The "State-Space Explosion" Wrinkle:**

      *   *The Climate Assumption:* CO2 accumulates linearly (mostly). 1 ton + 1 ton = 2 tons. The damage function is usually modeled as convex but continuous.
      *   *The S-Risk Alternative:* Suffering might not be additive. It might be combinatorial. If you have $N$ agents, do you have $N$ units of suffering? Or does the *interaction* between agents create new kinds of suffering (e.g., social pain, torture via simulation complexity)?
      *   *Substrate Dependence:* If suffering requires specific computational structures, simply scaling compute doesn't linearly scale suffering. It might unlock *new categories* of suffering previously impossible.
