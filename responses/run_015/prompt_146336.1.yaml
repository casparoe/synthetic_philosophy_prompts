answer: |-
  ### Essay Prompt

  **Topic:** The Precommitment Paradox: Hyperbolic Discounting and Diachronic Unity

  **Question:**
  Standard rational choice theory assumes agents have stable preferences over time, yet phenomena like weakness of will (akrasia) suggest otherwise. Some theorists argue that hyperbolic discounting explains akrasia not as irrationality, but as a sequence of locally rational choices. Others propose Ulysses-style precommitment contracts to enforce diachronic consistency. However, this raises a tension: if you bind your future self to avoid akrasia, you seem to treat your future agency as an external threat, undermining the diachronic autonomy that rational agency requires.

  Write an essay that addresses the following three components:
  1.  **Explain** why hyperbolic discounting, on its own, might dissolve the traditional problem of akrasia into a series of locally rational choices rather than a failure of rationality.
  2.  **Defend or reject** the claim that Ulysses-style precommitment restores diachronic rationality only by fragmenting the agent into competing temporal parts (i.e., treating the future self as a stranger).
  3.  **Propose** how a defender of unified agency might reply to this paradox. How can an agent maintain diachronic consistency without resorting to coercive precommitment? (Note: You may draw on concepts like narrative identity or standing commitments, but avoid solving the problem merely by name-dropping authorities like Parfit or Bratman.)

  ***

  ### Model Answer

  The traditional problem of weakness of will assumes a unified agent who knowingly acts against their better judgment. However, the model of hyperbolic discounting challenges this by重构 ing the temporal structure of utility. Unlike exponential discounting, where the relative value of two rewards remains constant regardless of when they are evaluated, hyperbolic discounting implies that the value of a reward spikes disproportionately as it approaches the present moment. Consequently, an agent may genuinely prefer long-term health at time t1 (when the temptation is distant) but prefer immediate gratification at t2 (when the temptation is imminent). If rationality is defined synchronically as maximizing utility relative to current preferences, the agent at t2 is not irrational; they are correctly maximizing their local utility. Thus, hyperbolic discounting dissolves the problem of akrasia from a failure of rationality into a problem of diachronic inconsistency. The agent is not weak-willed; they are merely a sequence of different preference-sets, each acting rationally within its own temporal window.

  This dissolution motivates Ulysses-style precommitment, where the t1 self binds the t2 self to prevent preference reversal. However, this generates the precommitment paradox. To bind one's future self is to treat that future self as an external constraint rather than an extension of one's own agency. It implies a lack of trust in one's future rationality, effectively fragmenting the agent into competing temporal parts. If the t1 self must lock away the cookies to stop the t2 self, it suggests that diachronic unity is maintained only through coercion, akin to inter-personal conflict. This undermines diachronic autonomy because the agent is no longer governing themselves through reason across time, but rather through force against their future incarnation. The rationality is restored, but the autonomy is sacrificed. The precommitment strategy saves the consistency of the life plan but admits that the agent cannot exist as a unified rational entity without external props.

  A defender of unified agency must reject the notion that binding is the only solution to inconsistency. Rather than treating the future self as a stranger to be restrained, the agent can cultivate a narrative identity that integrates temporal parts into a coherent whole. This involves adopting standing commitments that are constitutive of who the agent is, rather than merely instrumental plans. For example, identifying as "a healthy person" changes the utility function at t2. The cost of eating the cake is not just long-term health loss, but an immediate violation of self-conception. By embedding values into identity, the agent ensures that the t2 self shares the t1 self's priorities without needing external chains.

  This approach preserves diachronic autonomy because the constraint is internal and rational rather than external and coercive. The agent remains unified not because they are forced to be, but because their practical identity persists across time, making betrayal of earlier judgments irrational even from the local perspective of the present self. The tension between t1 and t2 is resolved not by locking the door, but by ensuring that the person behind the door recognizes the lock as unnecessary. Thus, unified agency is rescued not by denying the psychological reality of discounting, but by expanding the utility function to include the value of integrity.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 15/25

  | Must-Hit Move | Marks | Typical Mistake (Costing Marks) |
  | :--- | :---: | :--- |
  | **1. Mechanism of Hyperbolic Discounting:** Accurately distinguishes hyperbolic from exponential discounting, noting the preference reversal as rewards near the present. | 5 | Confusing hyperbolic discounting with simple impulsivity or failing to explain the *change* in preference ordering over time. |
  | **2. Local Rationality Claim:** Clearly articulates why the agent at t2 is technically maximizing utility, thereby dissolving traditional akrasia into diachronic inconsistency. | 5 | Claiming the agent is still irrational at t2, or failing to connect the discounting model to the definition of synchronic rationality. |
  | **3. The "Future Self as Threat" Objection:** Explains the paradox that precommitment treats the future self as an external stranger/enemy rather than part of the same agent. | 5 | Describing precommitment only as a helpful tool without addressing the philosophical cost to the concept of selfhood/agency. |
  | **4. Autonomy vs. Fragmentation:** Evaluates whether precommitment sacrifices diachronic autonomy to save consistency (i.e., coercion vs. self-governance). | 5 | Ignoring the tension between autonomy and consistency, or asserting precommitment solves the problem without trade-offs. |
  | **5. Unified Agency Proposal:** Proposes a non-coercive solution (e.g., narrative identity, constitutive commitments) that aligns t2 preferences with t1 without external binding. | 5 | Solving the problem merely by citing an author (e.g., "Bratman says plans bind us") without explaining the *mechanism* of unity. |

  **Grading Notes:**
  *   **20-25 (Distinction):** Seamless integration of all three parts; the proposal in part 3 directly addresses the fragmentation objection in part 2.
  *   **15-19 (Pass):** Covers all five moves but may lack depth in the proposed solution or slightly mischaracterize the discounting mechanism.
  *   **0-14 (Fail):** Misses one or more of the three main tasks; relies on summary of readings rather than argument; fails to grasp the "paradox" framing.
