answer: |-
  **Final Examination: Comparative Political Legitimacy**
  **Time Allowed:** 90 Minutes
  **Instructions:** Answer the following question in a single essay. Do not include citations, bibliographies, or references to specific texts. Your grade depends on the philosophical rigor of your argument, not empirical granularity.

  **Essay Question:**

  Critically assess the following claim: *Performance-based legitimacy is inherently unstable when it relies on an epistemic subsidy.* Define the distinction between input and output legitimacy, and explain how the concept of epistemic subsidy functions as a bridge between regime performance and citizen assent. Using China and Singapore as contrasting cases, analyze whether the monopolization of informational infrastructure necessary to sustain an epistemic subsidy introduces a reflexive contradiction into the justification of authoritarian governance. Specifically, argue whether either regime can sustain a non-circular claim to legitimacy if the metrics verifying prosperity and order are controlled by the authority claiming credit for them. Finally, evaluate the counter-argument that performance success generates a gradualist path to constitutional constraints, thereby resolving the epistemic deficit over time without democratic input.

  ***

  **Model Answer:**

  Political legitimacy is traditionally bifurcated into input legitimacy, derived from the procedures of participation and consent, and output legitimacy, derived from the effectiveness of governance in securing welfare and order. Authoritarian regimes often forego input legitimacy, arguing that their exclusive claim to authority is justified by superior output performance. However, this performance-based justification relies on a crucial precondition: citizens must be able to verify that the claimed prosperity and order are real. This is where the concept of epistemic subsidy becomes central. An epistemic subsidy occurs when a regime does not merely deliver goods but monopolizes the informational infrastructure through which those goods are measured and perceived. The regime subsidizes the citizen's epistemic labor by providing the only available metrics for success, thereby securing assent not just through delivery, but through the control of verification.

  The central philosophical problem arises when we examine the reflexivity of this arrangement. If legitimacy rests on performance, but the verification of performance is controlled by the performer, the justification becomes circular. The regime claims authority because it delivers order; yet, the definition and measurement of "order" are determined by the regime's informational apparatus. This introduces a reflexive contradiction: the condition required to validate the claim (independent verification) is simultaneously undermined by the method used to secure the claim (informational monopoly). Without an independent epistemic standard, performance legitimacy collapses into mere assertion. The citizen cannot distinguish between actual prosperity and the simulation of prosperity, rendering the consent given based on that performance epistemically hollow.

  Comparing China and Singapore illuminates how different instantiations of epistemic subsidy affect this contradiction. China represents a high-subsidy model. The state actively shapes the informational environment, suppressing alternative metrics of welfare (such as independent economic data or social unrest reporting) while amplifying state-defined successes. Here, the reflexive contradiction is acute. Because the informational infrastructure is heavily securitized, the verification condition is almost entirely internal to the regime. The claim to legitimacy is therefore highly vulnerable to the charge of circularity; the state validates its own success criteria.

  Singapore, conversely, utilizes a low-subsidy model. While politically dominant, the state relies on relatively transparent institutional metrics, independent judicial review of administrative acts, and open economic data. The People's Action Party claims credit for prosperity, but the metrics verifying that prosperity are accessible to opposition parties and civil society. Consequently, the reflexive contradiction is mitigated. The verification condition is not wholly monopolized; citizens can theoretically falsify the regime's claims using state-allowed data. Thus, Singapore's performance legitimacy is less circular because the epistemic subsidy is partial rather than total. The regime accepts some risk of falsification to bolster the credibility of its success claims.

  However, a proponent of authoritarian resilience might invoke the gradualist thesis to defend the high-subsidy model. This argument posits that performance success creates a middle class and complex social structures that eventually demand rule of law and constitutional constraints, even without democratic input. Under this view, the epistemic deficit is temporary. Initial information control stabilizes the regime enough to generate growth, which eventually forces the regime to adopt transparent metrics to manage complex modernization. Thus, the circularity is resolved diachronically: the regime begins with an epistemic subsidy but evolves toward independent verification mechanisms driven by functional necessity rather than democratic rights.

  Yet, this counter-argument fails to resolve the normative deficit at the heart of the reflexivity problem. Even if performance eventually generates constraints, the initial period of legitimacy rests on a verified falsehood—that the metrics are trustworthy when they are not. Furthermore, there is no guarantee that performance leads to constraints; it may instead lead to refined capacities for control. If the regime can deliver prosperity while maintaining the monopoly on verification, the functional pressure to liberalize metrics disappears. Therefore, the gradualist thesis does not save performance legitimacy from the charge of circularity; it merely defers the moment of reckoning.

  Ultimately, performance legitimacy cannot be fully non-circular under conditions of high epistemic subsidy. While Singapore demonstrates that transparency can mitigate the contradiction, China's model reveals that when the verifier and the performer are identical, the claim to legitimacy rests on an epistemic closed loop. True legitimacy requires that the standards of success exist outside the authority claiming to meet them. Without this external anchor, performance-based justification remains a tautology of power.

  ***

  **Marking Scheme (Total: 30 Points)**

  | Criterion | Specific Move Required | Points | Typical Failure Mode |
  | :--- | :--- | :--- | :--- |
  | **Conceptual Framework** | Explicitly distinguishes input vs. output legitimacy and defines epistemic subsidy as the control of verification infrastructure. | 6 | Defines subsidy merely as propaganda rather than control of verification metrics. |
  | **Comparative Application** | Contrasts China (high subsidy/monopoly) and Singapore (low subsidy/transparency) to show varying degrees of informational control. | 6 | Treats both regimes as identical authoritarian cases without distinguishing informational structures. |
  | **Reflexivity Diagnosis** | Identifies the core contradiction: the regime undermines the independent verification condition required to validate its performance claims. | 10 | Describes the control of information but fails to articulate why this makes the legitimacy claim logically circular. |
  | **Counter-Argument Engagement** | Evaluates the gradualist thesis (performance leads to constraints) and explains why it fails to resolve the normative epistemic deficit. | 5 | Summarizes the gradualist thesis without critiquing its inability to solve the initial circularity. |
  | **Argumentative Coherence** | Maintains a consistent philosophical thread linking subsidy, reflexivity, and legitimacy without relying on empirical description alone. | 3 | Devolves into empirical case study description lacking philosophical synthesis. |
  | **Total** | | **30** | |

  **Grading Notes:**
  *   **A Range (25-30):** Must secure full points on Reflexivity Diagnosis. The essay must argue that controlling metrics undermines the *validity* of the performance claim, not just its morality.
  *   **B Range (18-24):** Accurate description of China/Singapore and definition of legitimacy, but treats the epistemic subsidy as a practical challenge rather than a logical contradiction.
  *   **C Range (15-17):** Defines terms correctly but fails to compare cases or address the counter-argument.
