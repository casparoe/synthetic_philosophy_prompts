  **Headline Probability: 0.65**

  I assign a 65% probability that D's life went worse than her counterfactual counterpart's. I am more pessimistic about the Neolithic transition than you (0.55), and significantly more so than your friend (0.2). My decomposition follows:

  **(a) Empirical Claim (Net Decline): 0.75**
  *Justification:* Skeletal data from the Zagros and Mesopotamia consistently show increased enamel hypoplasia, infectious lesions, and reduced stature in early state populations compared to preceding foragers, even accounting for calorie buffering.

  **(b) Counterfactual Coherence (The Slot): 0.45**
  *Justification:* A foraging valley in 3000 BCE would likely support only seasonal camps rather than permanent households, making the "eldest daughter of a household" role a category error that undermines the comparison's validity.

  **(c) Metric of Comparison (Welfare vs. Autonomy): 0.70**
  *Justification:* If the metric weights freedom from coercion and gender stratification alongside biological health, the rigid hierarchy of the Uruk period weighs heavily against the relative egalitarianism of late foraging bands.

  **(d) The Ratchet (Irreversibility): 0.80**
  *Justification:* Once population density exceeds the carrying capacity of the wild landscape, the loss of the exit option converts cyclical resource stress into structural fragility and mandatory labor.

  **Combination Logic**
  I treat (a), (c), and (d) as independent evidentiary weights pointing toward the "worse" conclusion, averaging to roughly 0.75. I then apply (b) as a confidence discount; because the "social slot" is ontologically shaky, I regress the headline probability toward the prior (0.5), resulting in the final 0.65.

  **Least Confident Term**
  I am least confident in **(b) Counterfactual Coherence**. The "same-slot" rule attempts to solve the non-identity problem, but when the subsistence mode dictates the social ontology (band vs. household vs. state), there may be no isomorphic slot to compare, rendering the question partially meaningless.

  **Single Hypothetical Finding**
  The number would move most (downward, toward the friend's 0.2) upon the discovery of **isotopic and cortisol data from 3000 BCE Sumerian commoners showing lower physiological stress and higher protein intake than contemporary regional foragers**. This would directly falsify the core empirical premise (a) that the agrarian life was biologically more taxing.

  **Locating the Gap (0.55 vs. 0.2)**
  The gap between you and your friend most likely lives in **(c) Metric of Comparison**. Your friend likely prioritizes *survival probability* and *calorie reliability* (where agriculture wins) as the dominant components of welfare, whereas you and I assign significant weight to *workload*, *disease burden*, and *autonomy* (where foraging wins). A credence of 0.2 implies they view the prevention of starvation as lexically superior to the costs of coercion and labor, or they reject the skeletal pathology consensus entirely.
