answer: |-
  There is no single, canonical term in the classical philosophy of mind for this specific phenomenon, largely because it is a novel instantiation of older biases triggered by the unique opacity and stochastic nature of large language models. However, in contemporary philosophy of AI and cognitive science, this pattern is increasingly recognized as a violation of **supervenience** driven by **epistemic outcome bias**.

  If you require a precise label to use in analysis, the most philosophically rigorous descriptive term is **"Veridicality-Dependent Intentionality" (VDI)**.

  Below is a precise definition of VDI, its distinction from related concepts, and the normative conditions that should govern belief attribution instead.

  ### 1. Precise Definition: Veridicality-Dependent Intentionality (VDI)

  **Veridicality-Dependent Intentionality** is the inconsistent attribution of mental states (beliefs, understanding, knowledge) to a cognitive system, where the attribution is contingent upon the truth-value or normative acceptability of the system's output rather than the stability of its underlying functional or architectural state.

  **Formal Conditions for VDI:**
  Let $S$ be a cognitive system with internal state $I$ at time $t_1$ and $t_2$.
  Let $O_1$ be an output generated at $t_1$ with truth-value $True$.
  Let $O_2$ be an output generated at $t_2$ with truth-value $False$.
  Assume $I_{t1} \approx I_{t2}$ (the system's weights, architecture, and functional dispositions remain constant).

  VDI occurs when an observer $X$:
  1.  Attributes mental state $M$ (e.g., "belief," "understanding") to $S$ given $O_1$.
  2.  Withholds attribution of $M$ (or attributes only mechanistic causation, e.g., "token stitching") to $S$ given $O_2$.
  3.  Justifies this withdrawal solely on the basis of the truth-value of $O_2$, without citing a change in $I$.

  ### 2. Distinctions from Related Concepts

  To use this concept precisely, it must be distinguished from three nearby philosophical positions:

  **A. Vs. Epistemic Contextualism**
  *   *Contextualism* holds that the *standards* for claiming someone "knows" shift based on the conversational context (e.g., low stakes vs. high stakes).
  *   *VDI* is not about shifting standards for "knowledge"; it is an ontological toggle between "has a mind" and "has no mind." In VDI, the observer does not say, "It believed falsely"; they say, "It does not believe." This denies the system the capacity for error, which is a prerequisite for belief.

  **B. Vs. Global Eliminativism (The "Stochastic Parrot" View)**
  *   *Global Eliminativism* argues that LLMs *never* have beliefs, regardless of output quality.
  *   *VDI* is locally inconsistent. The same observer who claims the model is "just math" when it hallucinates will casually ask, "What does the model think about X?" when it answers correctly. VDI is opportunistic; Eliminativism is consistent.

  **C. Vs. Ordinary Outcome Bias**
  *   *Outcome Bias* is a cognitive heuristic where a decision is judged by its result rather than its process.
  *   *VDI* is a specific *philosophical* instantiation of outcome bias. It is not merely judging the *quality* of the model (good vs. bad), but judging the *category* of the model (agent vs. mechanism) based on the result. It treats truth as a constitutive condition for intentionality, rather than a contingent feature of a belief state.

  ### 3. The Philosophical Error: Violation of Supervenience

  The core philosophical problem with VDI is that it violates the **Supervenience of the Mental on the Physical/Functional**.

  In standard philosophy of mind, mental states are assumed to supervene on internal states. If two systems (or the same system at different times) are functionally identical, they should be attributed the same mental states.
  *   **Human Analogy:** If a human expert gives a correct explanation, we say they "understand." If they make a mistake, we say they "had a false belief" or "were mistaken." We do not say, "Since you were wrong, you have no beliefs and are merely vibrating vocal cords."
  *   **VDI Application:** By denying belief attribution when the output is false, observers treat **Truth** as a necessary condition for **Intentionality**. This collapses the distinction between *representation* (which can be misrepresentational) and *reality*.

  ### 4. Normative Conditions for Attribution

  If VDI is the descriptive name for the bias, what should govern attribution instead? You should apply a **Functionalist Intentional Stance**.

  Attribution of mental states to AI should be governed by **Structural and Functional Stability**, not Veridicality.

  1.  **The Capacity for Error:** A system should only be credited with beliefs if it is *capable* of being wrong. If "being right" is the condition for "having a belief," the system cannot have beliefs, because belief is inherently fallible. Therefore, consistent attribution requires accepting that the system has beliefs even when they are false.
  2.  **Predictive Utility (Dennett's Criterion):** The Intentional Stance should be adopted if it predicts behavior better than the Physical Stance. If treating the model as "believing P" helps you predict its future outputs regarding P, the attribution holds regardless of whether P is true.
  3.  **Architectural Invariance:** If the weights and architecture are constant, the epistemic status should remain constant. Fluctuations in output truth-value should be treated as **performance errors** within a believing agent, not as evidence of the absence of agency.

  ### Summary for Usage

  If you are writing or arguing about this, you can state:

  > "This pattern is an instance of **Veridicality-Dependent Intentionality**. It is a category error where observers conflate the *success conditions* of knowledge with the *existence conditions* of belief. It violates the supervenience of mental states on functional architecture by making intentionality contingent on truth-value. To avoid this, we must distinguish between **ontological attribution** (does it have beliefs?) and **epistemic evaluation** (are those beliefs true?)."

  This frames the issue not merely as human inconsistency, but as a specific philosophical confusion regarding the relationship between truth and representation.
