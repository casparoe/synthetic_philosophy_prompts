answer: |-
  | Requirement | Verdict | Rationale |
  | :--- | :--- | :--- |
  | **Falsifiability** | **Real Desideratum** | Without specified conditions for revision, the account is ideology, not history. |
  | **1946 Information Set** | **Temperament** | Useful for *moral* culpability, but obstructs *causal* analysis and forward-learning (which require hindsight). |
  | **Causation/Blame/Wrongness** | **Real Desideratum** | Conceptual necessity. Conflation is the primary source of historiographical error. |
  | **Zero-Sum Clarity** | **Real Desideratum** | "Both sides" is a null hypothesis unless the distribution mechanism is defined. |
  | **Lock-In Blame** | **Real Desideratum** | Identifies the structural constraint-setter; distinct from outcome evaluation. |

  **On "Lock-In Blame"**
  This is not consequentialism. Consequentialism evaluates the *value* of the outcome (Cold War = bad). Lock-in evaluates the *modal structure* of the choice space (Who removed the "dull settlement" option?). It is a genuine requirement for structural accounts because it isolates the **necessary condition** for the equilibrium from the **sufficient conditions** of specific hostile acts. It assigns blame for the *trap*, not the *fall*.

  **The Incompatible Pair: 1946 Information Set + Falsifiability**
  You cannot jointly satisfy the constraint to judge *only* on the 1946 information set and the requirement that the verdict be movable by opening archives.
  *   **Why:** If the verdict is bound by the epistemic horizon of 1946 (what actors could reasonably know), then evidence revealed later (secret archives, private intents unknown to contemporaries) is logically inadmissible for revising *culpability*. If archives *can* move the verdict, you are judging based on *actual reality* (hindsight), not the *1946 information set*. You must choose: are you judging their rationality given their blindness, or their alignment with the truth we now possess?

  **The Single Disruptive Requirement: Separation of Causation, Blame, and Wrongness**
  This requirement does the most work dismantling the three standard schools:
  *   **Traditionalists** collapse *Wrongness* (Stalin's ideology) into *Causation* and *Blame*. Separation forces them to prove Stalin's moves caused the lock-in distinct from US reaction.
  *   **Revisionists** collapse *Causation* (US economic pressure came first) into *Blame*. Separation forces them to prove the US moves were blameworthy errors, not just causal triggers.
  *   **Post-Revisionists** collapse *Causation* (Security Dilemma) into *No-Blame*. Separation allows for a finding that the *structure* caused the war, but a specific agent is blameworthy for locking that structure in place.

  By enforcing this triad, you prevent the moral satisfaction of "they were evil" (Traditionalist), the tactical satisfaction of "we moved first" (Revisionist), and the comfortable nihilism of "it was inevitable" (Post-Revisionist).
