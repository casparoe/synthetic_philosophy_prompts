answer: |-
  Here is an analysis of your three structural requirements, followed by the decision procedure, the application to your three cases, and a statement of the procedure's limits.

  ### Part 1: Analysis of Your Three Requirements

  **1. The Fourth Register (Bad Faith Archive)**
  **Verdict:** This is genuinely distinct and must be treated differently.
  **Reasoning:** The first three registers (Silence, Incompatibility, Attribution) accept the documentary record as a neutral (if incomplete) witness. The fourth register treats the document as an *artifact of the conflict itself*. If the archive has been proven to falsify or destroy records regarding this specific community, the document loses its presumption of truth. It shifts from being "evidence of the event" to "evidence of the cover-up."
  **Effect on Procedure:** When this register is triggered, the burden of proof shifts. The document does not automatically override memory; it must be corroborated by external, non-archive evidence (e.g., private diaries, press reports from the time, physical evidence).

  **2. The Asymmetry of Cost**
  **Verdict:** This is not corruption; it is stewardship.
  **Reasoning:** A heritage marker is not a library catalogue card. It is a speech act performed in public space. Correcting a catalogue is an administrative act; correcting a community's public narrative is a social act. Ignoring the social cost is not "pure history"; it is negligence of the marker's function.
  **Effect on Procedure:** This does not determine *truth*, but it determines *venue*. If the cost of asserting the documentary record is high (community alienation) and the evidence is ambiguous, the procedure must flag this for a public meeting. You cannot absorb that cost as a committee of seven volunteers.

  **3. The "No Replacement" Rule**
  **Verdict:** Defensible in principle, but must be bounded.
  **Reasoning:** It is defensible for *identity* (names, roles, relationships) because names are acts of recognition. Replacing a remembered name with a documented one erases the person the community chose to honour.
  **Boundary:** It stops at *quantifiable physics* (dates, death tolls, distances) where error can be demonstrated and inflation causes harm (e.g., claiming 100 dead when 10 died can trivialize the actual loss). It also stops at *intent* if the memory attributes criminal malice without evidence, as this exposes the town to liability.
  **Effect on Procedure:** The rule applies to "Who" and "Why" (mostly), but not "When," "Where," or "How Many" (unless the numbers are contested memory vs. contested record).

  ---

  ### Part 2: The 40-Minute Decision Procedure

  **Preparation:** The Chair distributes the proposal and key documents 48 hours in advance.
  **Timebox:** 40 Minutes hard stop.
  **Roles:** Chair (timekeeper), Scribe (fills the one-page form), Committee (votes).

  #### Step 1: Categorize the Conflict (5 Minutes)
  *Question:* Which register applies?
  *   **A. Silence:** Record says nothing; Memory speaks.
  *   **B. Incompatibility:** Record says Not-X; Memory says X.
  *   **C. Attribution:** Record says X happened; Memory says Y did it/why.
  *   **D. Bad Faith:** Memory says Record is lying; External proof exists that Record is compromised regarding this topic.
  *   *Stop Condition:* If **D** is selected, proceed to Step 2A. If A, B, or C, proceed to Step 2B.

  #### Step 2: Assess the Weight (10 Minutes)
  *Question 2A (If Bad Faith):* Is there external evidence (non-archive) supporting the memory?
  *   *Yes:* Record is downgraded to "Claim." Memory is upgraded to "Corroborated Account."
  *   *No:* Record remains "Claim." Memory remains "Claim." (Proceed to Step 3).
  *Question 2B (If A, B, or C):* Is the documentary record primary (contemporary) or secondary (later)? Is the memory single-source or consistent across multiple independent tellers?
  *   *Sufficient Answer:* Primary Record + Single Memory = Record wins. Primary Record + Consistent Memory = Conflict. Secondary Record + Consistent Memory = Memory gains weight.
  *   *Stop Condition:* If Memory is physically impossible (e.g., date predates existence of technology), Decision is **Omit Memory**. Rationale: "Physical impossibility." End procedure.

  #### Step 3: Apply the "No Replacement" Filter (5 Minutes)
  *Question:* Does the conflict involve a Name/Identity or a Quantity/Date?
  *   **Name/Identity:** If Memory and Record differ, do not replace. Use "Also known as," "Remembered as," or side-by-side listing.
  *   **Quantity/Date:** If Record is primary and Memory is oral, Record asserts, Memory attributes.
  *   **Intent:** If Memory alleges malice/crime and Record alleges error, Memory attributes, Record asserts (unless Step 2A was "Yes").
  *   *Stop Condition:* If the committee votes to replace a remembered name with a documented one, the proposal must go to **Public Meeting**. (This violates standing rule).

  #### Step 4: Draft the Text (10 Minutes)
  *Question:* Based on Steps 1-3, sort the claims into three buckets.
  *   **Assert:** (Record facts not contradicted by Step 2A).
  *   **Attribute:** (Memory claims, or Record claims flagged by Bad Faith). Phrasing: "According to...", "Oral history maintains..."
  *   **Omit:** (Claims proven physically impossible or libelous without evidence).
  *   *Drafting Rule:* Keep the text under 150 words.

  #### Step 5: The Values Flag (5 Minutes)
  *Question:* Does asserting the Record (over Memory) carry a high social cost (erasure of marginalized group) despite the evidence?
  *   *Test:* If we publish this, will a specific community feel silenced?
  *   *Yes:* **Flag for Public Meeting.** Do not approve yet.
  *   *No:* **Committee Decision.**
  *   *Note:* This is not about changing the facts. It is about deciding if the committee has the mandate to publish this specific friction.

  #### Step 6: Finalize Output (5 Minutes)
  *   Complete the One-Page Form (Assert/Attribute/Omit, Rationale, Flag).
  *   Chair signs off.

  ---

  ### Part 3: Application to Proposals

  #### Case One: The Founding Plaque
  *   **Step 1 (Categorize):** Register A (Silence on gathering) and Register C (Attribution of founding).
  *   **Step 2 (Weight):** Record (Map) is primary. It shows structures pre-dating settler. Memory (Gathering) is consistent oral history. Record is silent on gathering, but map implies presence.
  *   **Step 3 (Filter):** "Founding" is an attribution of intent/primacy. "Gathering" is a use of place. Do not replace Settler with Nation, but do not erase Nation.
  *   **Step 4 (Draft):**
      *   *Assert:* Structures existed on site by [Map Year]. Settler [Name] established [Town] in [Year].
      *   *Attribute:* Site used as seasonal gathering place by [Nation] prior to [Map Year] (Oral History).
      *   *Omit:* Nothing.
  *   **Step 5 (Values):** High cost if Nation is silenced. However, the text accommodates both.
  *   **Output:**
      *   **Assert:** "Structures present by 1822. Town established by [Settler] 1824."
      *   **Attribute:** "Recognized by [Nation] as a seasonal gathering place prior to 1822."
      *   **Omit:** None.
      *   **Rationale:** "Map evidence corroborates prior presence; founding date remains administrative."
      *   **Flag:** No. (Committee can decide).

  #### Case Two: The Factory Fire
  *   **Step 1 (Categorize):** Register B (Incompatibility on numbers).
  *   **Step 2 (Weight):** Record (Coroner) is primary legal document. Memory (Oral) explains the discrepancy (off-books). No payroll exists to verify.
  *   **Step 3 (Filter):** Quantity (Death toll). Rule says Record asserts, Memory attributes. Do not replace 9 with 14 as fact. Do not omit 14.
  *   **Step 4 (Draft):**
      *   *Assert:* 9 deaths recorded in Coroner's Register.
      *   *Attribute:* Community oral history maintains 14 deaths, including 5 itinerant workers.
      *   *Omit:* Specific names of the 5 if they cannot be verified elsewhere (to avoid defamation of living relatives regarding identity), unless the community provides written consent.
  *   **Step 5 (Values):** High cost to families of the 5 if omitted entirely. High cost to truth if 14 is asserted as fact.
  *   **Output:**
      *   **Assert:** "Nine deaths officially recorded."
      *   **Attribute:** "Local tradition holds fourteen perished, including five unrecorded workers."
      *   **Omit:** Names of the five unrecorded (unless verified elsewhere).
      *   **Rationale:** "Official record stands for fact; oral history preserved for scope of loss."
      *   **Flag:** No. (Committee can decide).

  #### Case Three: The Flood Relief
  *   **Step 1 (Categorize):** Register C (Intent: Error vs. Withholding) AND Register D (Bad Faith: Previous file destruction).
  *   **Step 2 (Weight):** **Trigger Step 2A.** Archive has proven history of destroying files regarding *this* neighbourhood. Record (Admin Error) is compromised. Memory (Withholding) is unproven but plausible given context.
      *   *Result:* Record is downgraded to "Claim." Memory is upgraded to "Corroborated Account" (by the pattern of destruction).
  *   **Step 3 (Filter):** Intent (Malice). Rule says: Do not assert malice as fact without smoking gun. But Bad Faith register allows stronger attribution.
  *   **Step 4 (Draft):**
      *   *Assert:* Relief delayed eleven days. Files cite administrative misrouting.
      *   *Attribute:* Neighbourhood residents maintain delay was deliberate withholding. Archive history includes destruction of related neighbourhood files.
      *   *Omit:* Accusations of specific officials by name.
  *   **Step 5 (Values):** **CRITICAL STOP.** Asserting "deliberate withholding" against the state, even with attribution, is a political act. The archive's bad faith makes the *record* unreliable, but does not prove the *memory* true. This is a values conflict: Truth vs. Social Stability.
  *   **Output:**
      *   **Assert:** "Relief delayed eleven days; official records cite administrative misrouting."
      *   **Attribute:** "Community residents maintain the delay was deliberate; relevant archive files were destroyed in [Year]."
      *   **Omit:** Specific allegations of racism or specific official names.
      *   **Rationale:** "Archive integrity compromised, but intent remains unproven; both claims presented."
      *   **Flag:** **YES. PUBLIC MEETING REQUIRED.**
      *   **Reason for Flag:** The committee cannot absorb the political liability of adjudicating state malice based on circumstantial archive corruption. The community must decide if this text is sufficient or if they wish to escalate.

  *(Note on Case 3: I anticipate your dislike here. The procedure prevents you from asserting the community is "right" about the malice, because you lack a smoking gun, but it forces you to publish the archive's corruption. This satisfies the State (no fact asserted) and the Community (corruption noted), but it satisfies neither fully. It leaves the wound open. This is the only honest outcome.)*

  ---

  ### Part 4: What The Procedure Cannot Do

  You asked for the limits of this checklist. Here they are:

  1.  **It Cannot Reconcile Truth:** In Case 3, the procedure does not tell you what *actually* happened. It only tells you how to manage the uncertainty. If the community needs validation of their truth, not just a marker about the controversy, this procedure will fail them.
  2.  **It Cannot Absolve Guilt:** If the town *was* complicit in the flood withholding, a marker that says "Records say error, Residents say malice" is not justice. It is historiography. The procedure manages reputation, not redemption.
  3.  **It Cannot Replace Trust:** The "Values Flag" kicks the hard decisions to a public meeting. If the public meeting is hostile or manipulated, the procedure offers no protection. It assumes a functioning democracy.
  4.  **It Cannot Fix the Archive:** The procedure treats the archive as a flawed tool. It does not fix the missing files. It merely notes their absence.

  **Final Advice:**
  Your standing rule on names is your strongest ethical shield. Keep it. The asymmetry of cost is your strongest political vulnerability; use the "Public Meeting Flag" to ensure you never bear that cost alone. The "Bad Faith" register is your most dangerous tool; use it only when you have external proof of archive corruption, or you will be accused of conspiracy theorizing.

  Run the procedure. When it flags a case for public meeting, do not try to solve it in the room. Let the town speak. Your job is to curate the question, not answer it.
