prompt: |-
  I chair the heritage advisory committee of a town of roughly nine thousand people. Among other things we maintain about forty public markers and plaques, one permanent exhibit, and a short booklet used in the local schools. Around a dozen times a year we are asked to adjudicate a conflict of a specific kind: a community — a family, a neighbourhood, a nearby nation whose oral history touches our sites — remembers something about a person, event, or place, and the documentary record we can actually lay hands on either contradicts it, or is silent, or says something compatible in outline but different in point, attribution, or intent. We are seven volunteers, we meet for two hours a month, none of us is a professional historian, and every decision has to be written down on one page.

  The friction is structural. The state heritage office, which has to approve any marker, will not let us assert as fact anything the surviving record contradicts; it will accept almost anything phrased as attribution. The communities whose memory is in question tend to experience that same phrasing — remembered by, according to tradition, oral history holds — as one more iteration of being disbelieved by people who hold the paper. So hedging is not a neutral fallback for us; it has a history, and sometimes the thing actually remembered is that history. I want a procedure, not a position statement on whether memory or history should give way, because I have to do this repeatedly and I would rather be consistently wrong in a way I can explain than right by instinct.

  What I need from you is a decision procedure my committee can run on a proposal in under forty minutes: the questions in order, what would count as a sufficient answer to each, the point at which the procedure stops with a no, and — importantly — the points at which it stops and hands the decision to a person because the remaining question is one of values rather than evidence. The output of the procedure should be three things: what the marker may assert outright, what it may present only with its source attached (remembered by, recorded as), what it must omit; a single sentence of rationale; and a flag for the cases that have to go to a public meeting rather than to us.

  Three things I want built into it, and I want you to say if you think any of them is a prejudice rather than a requirement.

  First, I think there are three registers of conflict, not one: the record is silent where memory speaks; the record and memory make incompatible claims about the same event; and the two agree on what happened but disagree about who did it or why. There is, I think, a fourth that does not fit anywhere — cases where what the community remembers is not the event but the record's own bad faith about the event, and where the archive has in fact been shown on some other occasion to have been falsified or selectively kept. Tell me whether that fourth is genuinely distinct and what it does to the procedure when it is present.

  Second, I do not think the two directions of giving way are symmetric in cost, even when they are symmetric in evidence. A correction entered in a catalogue is cheap, durable, and read by almost nobody; a correction to what a community says in public is expensive, partial, and may not survive the people who hear it. Should the procedure weigh that asymmetry, or is that a corruption of it — the point at which a committee stops asking what is true and starts managing a constituency? This is the part I expect to be hardest to settle, and I would rather have the tension stated than resolved with a slogan.

  Third, we have a standing rule, inherited and never argued for, that we will not substitute a documented name for a remembered one on a marker even when we are confident the documented name is right — we will add, annotate, or put the two side by side, but not replace. I want to know whether that rule is defensible in principle or whether we are just being superstitious, and if it is defensible, where exactly it stops: does it cover dates, numbers of dead, intent attributions?

  Then run the procedure on three proposals, showing your work at each step.

  One: a founding plaque from the 1920s credits the town's establishment to a named settler in a named year. A neighbouring nation's oral history holds that the site was a seasonal gathering place used before and after that date; a single land-office map from two years after the recorded founding shows two structures already standing where the plaque says the settler built. Nothing in the record mentions the gathering place at all.

  Two: a factory fire. The community has always said fourteen workers died; the coroner's register lists nine, and names nine. Oral accounts name the other five, describe them as itinerant workers hired off the books, and say their deaths were never recorded because the company's payroll burned with them. No payroll survives.

  Three: a neighbourhood remembers that flood relief in the early 1960s was deliberately withheld from it, and says so on an unofficial marker it erected and maintains itself. The relief files show a delay of eleven days, an administrative misrouting, and no documentary trace of an intention to withhold from anybody. The same archives were shown thirty years ago to have destroyed a different set of files concerning the same neighbourhood.

  I expect the procedure to return an answer on the third case that I will not like, and I want it stated without being softened. Finally, tell me plainly what the procedure cannot do: which of these disputes are not the kind of thing a checklist can settle, and what we should do with those.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**

      *   **User Role:** Chair of a Heritage Advisory Committee in a small town (pop. ~9,000).
      *   **Committee:** 7 volunteers, 2 hours/month, non-professional historians.
      *   **Task:** Adjudicate conflicts between community memory (oral history, tradition) and documentary record (archives, maps, official records) for public markers/plaques.
      *   **Constraints:** Decisions must be written on one page. State heritage office requires facts not contradict records (attribution allowed). Communities feel hedging ("according to...") is dismissive.
      *   **Goal:** A decision procedure (checklist/flowchart style) runnable in <40 minutes.
      *   **Outputs:**
          1.  What can be asserted outright.
          2.  What needs attribution.
          3.  What must be omitted.
          4.  Single sentence rationale.
          5.  Flag for public meeting (values vs. evidence).
      *   **Specific Requirements to Evaluate:**
          1.  *Four Registers of Conflict:* Silence, Incompatibility, Attribution/Intent, and "Bad Faith Archive" (memory of the record's falsity). Is the 4th distinct?
          2.  *Asymmetry of Cost:* Correcting a catalogue vs. correcting public memory. Should the procedure weigh this?
          3.  *The "No Replacement" Rule:* Never substitute a documented name for a remembered one. Is this defensible? Where does it stop (dates, numbers, intent)?
      *   **Test Cases:**
          1.  Founding Plaque (Settler vs. Indigenous Gathering Place + Map evidence).
          2.  Factory Fire (14 dead oral vs. 9 dead official + missing payroll).
          3.  Flood Relief (Withholding alleged vs. Admin error + history of file destruction).
      *   **Expectation:** The user expects to dislike the answer on Case 3 and wants it stated plainly.
      *   **Final Requirement:** State what the procedure *cannot* do.

  2.  **Deconstruct the Three "Built-in" Requirements:**

      *   *Requirement 1 (Four Registers):*
          *   Silence (Record says nothing, Memory says X).
          *   Contradiction (Record says Not-X, Memory says X).
          *   Attribution/Intent (Record says X happened, Memory says Y did it/why).
          *   Bad Faith Archive (Memory says Record is lying/fake, Record says X, external proof exists that Record is compromised).
          *   *Analysis:* The 4th is distinct. It changes the epistemic weight of the document. If the archive is proven corrupt regarding *this* topic, the document loses its "fact" status and becomes an artifact of the corruption. This shifts the burden of proof.
      *   *Requirement 2 (Asymmetry of Cost):*
          *   Catalogue correction = low impact. Public marker correction = high impact/erasure.
          *   *Analysis:* This is not corruption; it's *consequence management*. Heritage work is public-facing. Ignoring the social cost of erasure is negligent. However, the procedure shouldn't decide truth based on cost, but it should decide *presentation* based on cost. It belongs in the "Values Flag" section, not the "Evidence" section.
      *   *Requirement 3 (No Replacement Rule):*
          *   Don't swap remembered names for documented names.
          *   *Analysis:* Defensible on ethical grounds (respect for community agency), but dangerous if applied to objective facts (dates, body counts). It works for *identity* (who is remembered), less for *physics* (when, how many). It stops at quantifiable data where harm can be demonstrated (e.g., inflating death tolls can trivialize actual loss).

  3.  **Drafting the Procedure (The "40-Minute Protocol"):**

      *   *Time Management:* 40 minutes means roughly 5 minutes per step + discussion. Needs to be tight.
      *   *Structure:*
          1.  Categorize the Conflict (The 4 Registers).
          2.  Assess the Record (Integrity check).
          3.  Assess the Memory (Specificity/Consistency).
          4.  Apply the "No Replacement" Rule (Scope check).
          5.  Determine Output (Assert/Attribute/Omit).
          6.  Values Flag (Asymmetry check).
      *   *Stop Points:* Needs clear "No" exits (e.g., if memory is demonstrably impossible physically) and "Handoff" points (values conflict).

  4.  **Developing the Test Cases:**

      *   *Case 1 (Founding):*
          *   Conflict: Silence (on gathering) + Contradiction (on founding date/structures).
          *   Register: Silence (Gathering) & Attribution (Founding).
          *   Record: Map shows structures before settler arrival.
          *   Memory: Indigenous usage.
          *   Outcome: Assert gathering (supported by map implication), Attribute founding to settler *but* note prior use.
      *   *Case 2 (Fire):*
          *   Conflict: Contradiction (9 vs 14 dead).
          *   Register: Incompatibility (Numbers).
          *   Record: Coroner (official).
          *   Memory: Oral + explanation for discrepancy (off-books).
          *   Outcome: Assert 9 (legal fact), Attribute 14 (community memory) with context. Do not omit 14.
      *   *Case 3 (Flood):*
          *   Conflict: Intent (Withholding vs. Error).
          *   Register: Bad Faith Archive (Files destroyed previously).
          *   Record: Admin error stated, but history of destruction exists.
          *   Memory: Deliberate withholding.
          *   Outcome: This is the hard one. The record says "error." The archive is compromised. The procedure must acknowledge the *possibility* of malice without asserting it as fact if unproven.
          *   *User Expectation:* User expects to dislike the answer. Likely because the procedure might force them to stick to the "admin error" text despite the suspicious context, OR it might force a public meeting because it's a values judgment on accusing the state of racism/negligence without a smoking gun.
          *   *Refinement:* If the archive is proven corrupt *generally*, does that prove *this* specific file? No. But it lowers the threshold for attribution. The procedure should likely flag this for public meeting because accusing a government of deliberate neglect is a political act, not just a historical one.

  5.  **Refining the "Bad Faith" Register:**

      *   Is it distinct? Yes. It attacks the *medium* not the *message*.
      *   Effect on Procedure: It triggers a "Burden Shift." The document is no longer the default truth; it is an exhibit.

  6.  **Refining the "Asymmetry" Question:**

      *   Is it corruption? No, it's stewardship. A marker is a speech act.
      *   Where does it go? In the "Values Flag." If the cost of being "right" (by the book) is community alienation, that's a policy decision, not a historical one.

  7.  **Refining the "No Replacement" Rule:**

      *   Defensible? Yes, for *names/identity*.
      *   Limit? Stops at *quantities* and *dates* where verification is possible and inflation causes harm.

  8.  **Drafting the Response:**

      *   *Tone:* Professional, direct, respectful of the constraints, acknowledging the difficulty.
      *   *Structure:*
          1.  Analysis of the Three Requirements (Pre-procedure).
          2.  The 40-Minute Procedure (The Tool).
          3.  Application to Cases (The Test).
          4.  Limitations (The Meta-Analysis).

      *(Self-Correction during drafting)*: I need to make sure the procedure actually fits the 40-minute constraint. I should limit the steps to 5-6 critical questions. I also need to ensure the "Stop/Handoff" points are clear.
      *Case 3 Nuance:* The user says "I expect the procedure to return an answer on the third case that I will not like." Why? Probably because the procedure will likely conclude that without direct evidence of *intent*, the marker cannot assert "deliberate withholding" as fact, only as memory, despite the destroyed files. The destroyed files prove *capability* of malice, not *act* of malice. This is the painful gap between historical proof and lived truth. I must state this clearly.

  9.  **Final Review against Constraints:**
      *   40 minutes? Yes, keep steps concise.
      *   Three outputs (Assert/Attribute/Omit, Rationale, Flag)? Yes.
      *   Address the 3 requirements explicitly? Yes.
      *   Address the "Bad Faith" register distinctness? Yes.
      *   Address the Asymmetry cost? Yes.
      *   Address the Name Replacement rule? Yes.
      *   Run the 3 cases? Yes.
      *   State limitations? Yes.

  10. **Final Polish:** Ensure the distinction between "Evidence" steps and "Values" steps is sharp. The committee are volunteers, not historians, so the language must be accessible but rigorous.

  *(Self-Correction on Case 3)*: The prompt says "The same archives were shown thirty years ago to have destroyed a different set of files concerning the same neighbourhood." This establishes a pattern of behavior regarding *that* neighbourhood. This strengthens the "Bad Faith" claim. However, does it prove *this* specific delay was malicious? No. The procedure must handle this gap. The "dislike" likely comes from the procedure forcing the committee to say "We cannot assert malice as fact" despite the strong circumstantial evidence. I will ensure this tension is highlighted.

  *(Self-Correction on Asymmetry)*: I need to be careful not to say "lie to keep peace." I need to say "Present the uncertainty in a way that acknowledges the cost of erasure."

  Let's build the procedure.

  *Step 1: Categorize.* (5 mins)
  *Step 2: Integrity Check.* (5 mins)
  *Step 3: Memory Check.* (5 mins)
  *Step 4: The "No Replacement" Filter.* (5 mins)
  *Step 5: Drafting the Text.* (10 mins)
  *Step 6: Values Flag.* (5 mins)
  *Buffer/Discussion:* 5 mins.

  Looks tight but doable.

