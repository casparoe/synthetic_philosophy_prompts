answer: |-
  The sorting practice you describe presupposes a notion of cause that conflates **ontological origin** with **pragmatic fixity**. It operates on a folk-essentialist assumption that "genetic" equates to "internal and immutable" while "environmental" equates to "external and malleable." This presupposition allows institutions to map specific causes onto specific jurisdictions (clinical medicine vs. public policy). However, as you note, this map does not match the territory.

  Here is an analysis of the three candidates for 'genetic', the coherence of the current practice, and the implications of shifting to an intervention-based ontology.

  ### 1. Do the three candidates come apart, and which is required?

  The three candidates for what 'genetic' signifies in this context are:
  1.  **Variance Explanation:** A difference-maker in the current population (statistical heritability).
  2.  **Proximal Mechanism:** A link in the causal chain for the individual (biological pathway).
  3.  **Intervention Difficulty:** A cause that is hard to modify (pragmatic fixity).

  **Do they come apart?**
  Yes, they genuinely and frequently come apart.
  *   **Variance vs. Mechanism:** A trait can be 100% genetically mediated in mechanism (e.g., having two eyes) but have 0% heritability in variance because there is no genetic variation for it in the population. Conversely, a trait can have high heritability variance but be caused by environmental triggers acting on a uniform genetic susceptibility.
  *   **Variance vs. Intervention:** This is the most critical separation. Phenylketonuria (PKU) is nearly 100% heritable by variance and mechanism, yet it is trivially easy to intervene upon environmentally (diet). Conversely, lung cancer has a massive environmental component (smoking), but once the damage is done, it is often treated individually with difficult interventions (surgery, chemo).
  *   **Mechanism vs. Intervention:** Knowing a cause is "in the genes" (mechanism) tells us nothing about the difficulty of editing those genes or mitigating their expression (intervention).

  **Which does the practice strictly require?**
  The practice **strictly requires Candidate 3 (Intervention Difficulty)** to justify the *response*, but it relies on **Candidate 1 (Variance Explanation)** to justify the *classification*.

  This is the source of the tension. To route a condition to "individual management," the institution must assume the cause is fixed for that individual (Intervention Difficulty). To route a condition to "collective regulation," they must assume the cause is variable across the population and removable (Variance). However, institutions cite Candidate 1 (heritability statistics) to lend scientific weight to the classification, even though Candidate 1 does not logically entail Candidate 3. The practice *needs* the causes to be immutable to justify individualizing the burden, but it *uses* variance statistics to claim scientific objectivity.

  ### 2. Is the practice coherent under its apparent notion?

  The practice's routines are **incoherent under a scientific or ontological notion of cause**, but they are **highly coherent under a bureaucratic or liability-based notion of cause.**

  *   **The Incoherence:** If 'genetic' truly meant "caused by DNA variation," treating it by changing diet (environment) would be a category error. If 'environmental' truly meant "caused by external hazards," managing it patient-by-patient (e.g., treating lead poisoning with chelation rather than removing the lead) would be malpractice. The fact that institutions do both simultaneously reveals that the labels are not describing the *nature* of the disease, but the *location of the solution*.
  *   **The Hidden Coherence:** The sorting is coherent if we understand "cause" as **"locus of responsibility."**
      *   **Genetic** functions as a code for: "The problem resides in the citizen; the state's duty is limited to clinical care."
      *   **Environmental** functions as a code for: "The problem resides in the infrastructure; the state's duty is regulation."
      *   When a "genetic" condition is treated environmentally (PKU), it is because the clinical intervention *is* the environmental change prescribed to the individual. The collective environment remains unchanged.
      *   When an "environmental" condition is treated individually (asbestos exposure managed via patient monitoring), it is because collective regulation failed or came too late. The system defaults to individual management when collective action is politically or economically blocked.

  Thus, the practice is coherent only if we view the "cause" not as a physical antecedent, but as a **claim on resources**. The contradiction you observe is the friction between the biological reality (genes are modifiable, environments are sticky) and the administrative reality (budgets are siloed).

  ### 3. What if 'genetic' were understood in the intervention-based way?

  If institutions adopted a strict **intervention-based notion of cause** (i.e., sorting diseases by *modifiability* rather than *origin*), the landscape would shift dramatically.

  **Would anything still be handled one person at a time?**
  Yes, but the criteria would change. Individual handling would be reserved for conditions where the *lever of control* is idiosyncratic, regardless of origin.
  *   **Idiosyncratic Environmental Exposures:** If a disease is caused by a unique environmental accident (e.g., a specific chemical spill affecting one home), it remains an individual case, not because the cause is genetic, but because the intervention is specific to that location.
  *   **Biological Constraints:** If a condition is truly hard to modify structurally (e.g., certain neurodegenerative pathways), it would be managed individually, even if the cause is environmental.

  **Would the genetic/environmental split still earn the work it currently does?**
  No. The split would likely collapse or be replaced by a **Modifiable/Immutable** or **Structural/Idiosyncratic** dichotomy.
  *   **Loss of Liability Shield:** Currently, calling a disease "genetic" protects polluters and regulators from blame. If we classify causes by intervention, PKU becomes an "environmentally manageable condition," shifting focus to food supply systems. Conversely, if a "genetic" risk score predicts a disease that can only be prevented by banning a certain chemical, the "genetic" label would force collective action.
  *   **Fluid Categories:** Diseases would move categories as technology changes. A condition considered "genetic" (immutable) today might become "environmental" (modifiable via gene therapy or diet) tomorrow. Institutions dislike this fluidity because it disrupts long-term planning and budgeting.
  *   **Ethical Realignment:** The intervention-based view forces the question: *Can we fix this collectively?* If the answer is yes, the cause is effectively "environmental" in the public health sense, regardless of DNA. This would mandate that highly heritable conditions (like myopia or type 2 diabetes) be treated as public health crises requiring structural change (urban design, food regulation), rather than individual failures of genetics or willpower.

  ### Conclusion

  The current sorting presupposes a notion of cause that is **ontologically vague but politically precise.** It treats "genetic" as a synonym for "individual responsibility" and "environmental" as "collective responsibility," using variance statistics to launder these moral judgments as scientific facts.

  The three candidates (variance, mechanism, intervention) come apart constantly, and the practice requires the **intervention** notion to function but cites the **variance** notion to legitimize itself. This renders the practice scientifically incoherent but bureaucratically stable.

  Adopting a truly intervention-based understanding would dissolve the genetic/environmental binary into a **feasibility of prevention** spectrum. This would be scientifically more honest but politically volatile, as it would strip institutions of the ability to assign blame based on the *origin* of a disease rather than the *solution* to it. It would force public health to treat highly heritable conditions as collective challenges whenever the environment holds the key to the lock, regardless of what the genes say.
