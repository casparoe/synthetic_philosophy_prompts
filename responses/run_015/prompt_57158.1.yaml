  **Document 2: The Key**

  **Mapping Answers to Positions**

  *   **Q1=A (Broken):** **The Hedonic Purist.** Affect measured close to the moment is the only honest target; retrospective ladder items are confabulation. (Leaf 2)
  *   **Q1=B, Q2=A (Incomparable):** **The Skeptic.** The ranking is not even ordinal-comparable across populations; no cross-country policy conclusion follows from it. (Leaf 3)
  *   **Q1=B, Q2=B, Q3=B (Gamed):** **The Goodhart Skeptic.** The measure is a tolerable diagnostic and a corrupting target. (Leaf 4)
  *   **Q1=B, Q2=B, Q3=C, Q4=B (Continuity):** **The Liberal Statistician.** The state should track happiness but not promote it, because promotion violates the separateness of persons' own judgments about what makes a life go well. (Leaf 5)
  *   **Q1=B, Q2=B, Q3=C, Q4=A (Climb):** **The Realist.** The ladder measures something real but is not happiness, and is nonetheless the best political indicator available. (Leaf 1)
  *   **Q1=B, Q2=B, Q3=A, Q4=A (Climb):** **The Ranker.** A country should aim to top the ranking precisely because the ranking is a public, contestable scoreboard. (Leaf 6)

  **Combination Grid**

  The axes permit 2 (Validity) × 2 (Comparability) × 3 (Domestic) × 2 (International) = 24 logical cells.

  *   **Occupied:** The six leaves above occupy specific cells.
  *   **Unoccupied Cell 1 (Valid, Comparable, Promote, Ignore):** *Coherent but unattractive.* One wants to raise happiness domestically but refuses to care about international standing despite having the means to climb. Rarely argued; status usually follows success.
  *   **Unoccupied Cell 2 (Invalid, Comparable, Track, Ignore):** *Incoherent.* If the measure is invalid (Q1=A), one cannot consistently claim it is useful for tracking (Q3=C).
  *   **Unoccupied Cell 3 (Valid, Incomparable, Promote, Climb):** *Incoherent.* One cannot aim to climb a ranking (Q4=A) while believing populations are incomparable (Q2=A).
  *   **Unoccupied Cell 4 (Valid, Comparable, Ignore, Climb):** *Unexplored.* Believing the data is sound but domestically useless, yet internationally vital. Likely unstable; domestic utility usually precedes international trust.

  **Indistinguishable Leaves**

  1.  **The Realist (Leaf 1) vs. The Liberal Statistician (Leaf 5).** Both answer Q3=C (Diagnostic/Track) and Q4=B (Continuity). The tree groups them as "Track/No Promote."
      *   *Further Question:* "Is the restriction on promotion due to the *nature of the data* (it's not happiness) or the *rights of the citizen* (state overreach)?"
      *   *Lay Honesty:* A lay participant can answer this, but may conflate data limits with political principles without prompting.
  2.  **The Hedonic Purist (Leaf 2) vs. The Goodhart Skeptic (Leaf 4).** Both reject the ladder as a target.
      *   *Further Question:* "If we measured momentary affect instead of life evaluation, would you support a target?"
      *   *Lay Honesty:* Difficult. Lay participants often view all measurement as equally intrusive or equally valid without methodological training.

  **Node Order and Facilitation**

  **Justification:** Empirical questions (Q1, Q2) precede normative ones (Q3, Q4). This prevents policy preferences from coloring measurement judgments (e.g., wanting to promote happiness should not convince one that the scale is valid). Domestic norms (Q3) precede International norms (Q4) to ensure welfare aims are not subsumed by status anxiety.

  **Live Facilitation (40 People, 1 Whiteboard):**
  1.  **Read Q1.** Ask participants to move to the left wall (A) or right wall (B). Do not debate yet.
  2.  **Read Q2.** Only those at Wall B move again (to Left/Right). Wall A participants sit (their path is determined).
  3.  **Read Q3.** Only remaining standing participants move.
  4.  **Read Q4.** Final split.
  5.  **Debrief:** Label each cluster with the Position Name from the Key. Ask clusters to explain *why* they stand there. This physically separates the methodologists (Wall A/Q1) from the policy advisers (Wall B/Q3) initially, forcing them to acknowledge the empirical baseline before arguing norms.
  6.  **Conflict Resolution:** If a methodologist and adviser end up in the same cluster (e.g., Liberal Statistician), ask them to state their reason. If reasons differ (one cites validity, one cites rights), mark them as distinct despite shared position. This exposes the conflation directly.
