  **Logical Space and Axes**

  Four axes structure the debate. First, **Ontology/Validity**: Does the ladder measure a stable psychological state (hedonia/evaluation) or is it methodological noise? Second, **Comparability**: Do scores mean the same thing across different populations or times? Third, **Domestic Norm**: Should the state use the data to actively improve scores, merely monitor them, or ignore them? Fourth, **International Norm**: Should the state aim to climb global rankings, or treat them as irrelevant?

  These axes are logically independent. Empirical beliefs (1, 2) do not dictate normative aims (3, 4), though they constrain them. Domestic aims (3) are distinct from International aims (4); one can wish to improve citizen welfare without caring about relative standing. Conflating these leads to the workshop's prior failure: methodologists rejecting the scale (Axis 1) are mistaken for philosophers rejecting the aim (Axis 3).

  ***

  **Document 1: Participant Handout**

  1.  **The Wording Pilot:** In a test, the same sample scored an average of 1.4 points higher when the top of the ladder was worded as "the best life they could personally hope for" than when worded as "the best possible life." Does this variation indicate the question is broken, or that context shapes judgment?
      *   A) Broken: The number is unstable.
      *   B) Context: The number reflects shifting standards.

  2.  **The Recession Recovery:** A population endured a severe recession, recovered economically within a decade, and reported lower ladder scores than a comparable population that never suffered the shock. Does this mean their lives are objectively worse, or that their expectations changed?
      *   A) Incomparable: Expectations shifted; scores cannot be compared across groups.
      *   B) Comparable: Scores reflect a real deficit despite recovery.

  3.  **The District Target:** A district office was given an annual happiness target and subsequently measured as having met it. Is this a success for the office, or evidence the target was gamed?
      *   A) Success: Policy improved lives.
      *   B) Gamed: Staff manipulated responses (Corrupting Target).
      *   C) Diagnostic: Useful information, but setting a target is inappropriate.

  4.  **The Mode Switch:** A country gains two places in the international ranking by moving its survey from face-to-face interviews to telephone interviews, with no change in anyone's life. Should we switch to climb the table, or stay face-to-face to preserve continuity?
      *   A) Climb: The ranking is a public scoreboard; opacity is worse than distortion.
      *   B) Continuity: Ignore the ranking; maintain methodological integrity.

