answer: |-
  ### Diagnostic Decision Procedure for Client Inaction

  **Context:** Use this during the 45-minute review. Document the client's verbatim answers in the file. If a "Stop" command is triggered, do not propose commitment devices (auto-escalation, lock-ups, etc.); they are clinically indicated only for *Present Bias* coupled with *Akrasia*.

  #### Step 1: The Feasibility and Information Screen
  **Question:** "Looking at your cash flow from the last three months, if we set aside $[Amount] on the 1st of the month, does the math show you missing a rent payment, utility bill, or grocery budget in any of those months?"
  *   **Sufficient Answer for "Pass":** "No, the surplus is there consistently," or "Yes, but only in months with known irregular expenses we can plan for."
  *   **Sufficient Answer for "Fail":** "Yes, taking that amount out causes a deficit in the basic budget."
  *   **Follow-up (if Fail):** "Do you understand that this plan requires money that isn't currently there?"
      *   **Sufficient Answer:** "Yes, I didn't realize the budget was that tight."
  *   **Stop Command:** If the answer is "Fail" and the client acknowledges the information gap, label **FEASIBILITY_OR_INFORMATION**. **This is not a present-bias problem, do not reach for the commitment toolkit.** Revise the budget or the plan amount.
  *   **[JUDGMENT CALL]:** Determining whether a "deficit" is absolute (cannot pay rent) or relative (cannot dine out) is a values judgment. Treat only absolute threats to housing/food/health as Feasibility failures. Discretionary shortfalls move to Step 2.

  #### Step 2: The Time-Consistency Test (The Reversal Test)
  **Context:** Explain that this is a hypothetical exercise to understand how they value time, not a real offer.
  **Question A (Immediate Frame):** "Would you prefer $[X] in your hand **today**, or $[X + 10%] in your hand **one month from today**?"
  **Question B (Delayed Frame):** "Would you prefer $[X] in your hand **one month from today**, or $[X + 10%] in your hand **two months from today**?"
  *(Note: Keep the interval and percentage identical; only shift the start time.)*

  *   **Pattern 1 (Reversal):** Client chooses **Today** in Question A, but chooses **Two Months** (the larger amount) in Question B.
      *   **Diagnosis:** Time-Inconsistent Preference (Present Bias). The proximity of "now" distorts the choice.
  *   **Pattern 2 (Consistency):** Client chooses **Today** in Question A, and chooses **One Month** (the smaller amount) in Question B.
      *   **Diagnosis:** Time-Consistent Preference (Steep Discounting). They value the present highly, but their rate of discounting doesn't change based on proximity.
  *   **Pattern 3 (Consistency):** Client chooses **One Month** in Question A, and **Two Months** in Question B.
      *   **Diagnosis:** Time-Consistent Preference (Low Discounting).
  *   **Stop Command:** If Pattern 2 or 3, label **CONSISTENT_HIGH_DISCOUNT** (or Low). **This is not a present-bias problem, do not reach for the commitment toolkit.** A commitment device imposes a cost on a rational preference; do not do this unless Step 3 indicates Akrasia.

  #### Step 3: The Judgment vs. Action Screen (Akrasia Check)
  **Context:** Only proceed if Step 1 Passed and Step 2 showed Pattern 1 (Reversal).
  **Question:** "You mentioned earlier you intend to save/pay debt, but you also chose the immediate cash in our exercise. All things considered—including your future security, stress levels, and life goals—which option do you **judge to be better for your life overall**: taking the money now, or securing the future benefit?"

  *   **Sufficient Answer for Akrasia:** "I judge the future benefit to be better, but I keep taking the money now." (Conflict between judgment and action).
  *   **Sufficient Answer for Values Alignment:** "I judge taking the money now to be better. I know it costs me later, but I prefer living better now." (Alignment between judgment and action).
  *   **[JUDGMENT CALL]:** Distinguishing between "I want this but know it's bad" vs. "I want this and accept the trade-off" relies on client self-reporting which may be influenced by shame. Look for emotional tone: resignation suggests Akrasia; conviction suggests Values Alignment.
  *   **Stop Command:** If Values Alignment, **This is not a self-control problem.** It is a values divergence between planner and client. Do not impose a plan the client does not endorse.
  *   **Proceed:** If Akrasia, label **PRESENT_BIAS**. Commitment devices are ethically permissible here as they align action with the client's own stated better judgment.

  ***

  ### Limitations and Misfire Points
  1.  **Social Desirability Bias:** Clients often answer Step 3 to please you ("I know I should save"). If their behavior doesn't change after a commitment device is installed, assume the Step 3 answer was false and revert to **CONSISTENT_HIGH_DISCOUNT** (they value the present more than they admit).
  2.  **Rational Precarity:** For clients in genuine economic insecurity, a steep discount rate (Step 2, Pattern 2) is rational. A bird in the hand *is* worth two in the bush if the bush might burn down. Do not pathologize survival strategies as "High Discounting" flaws.
  3.  **Stated vs. Revealed:** This procedure tests *stated* preferences. If a client passes Step 1 and Step 2 but still fails to execute, the problem may be executive function (forgetting, administrative burden) rather than preference. This procedure does not diagnose executive dysfunction.

  ***

  ### Case Applications

  **Case 1: The 34-Year-Old Roth Procrastinator**
  *   **Step 1 (Feasibility):** Assumed Pass (numbers were put to him, implying ability).
  *   **Step 2 (Reversal):**
      *   Q A: $500 Today > $550 in 1 Month. (Immediate preference).
      *   Q B: $550 in 2 Months > $500 in 1 Month. (Delayed preference).
      *   **Result:** **Reversal Detected.** (Pattern 1).
  *   **Step 3 (Judgment):** Implied by "I'll start in January" x3 years. He states an intention he betrays.
  *   **Diagnosis:** **PRESENT_BIAS**.
  *   **Action:** Commitment toolkit is appropriate (e.g., auto-escalation he cannot easily opt-out of).

  **Case 2: The 29-Year-Old High Discounter**
  *   **Step 1 (Feasibility):** Assumed Pass.
  *   **Step 2 (Reversal):**
      *   Q A: $100 Today > $110 in 1 Month. (Immediate preference).
      *   Q B: $100 in 1 Month > $110 in 2 Months. (Immediate preference *relative to the frame*).
      *   **Result:** **Consistent.** She discounts the future at >10% per month consistently.
  *   **Step 3 (Judgment):** She states she "doesn't care about what she'll want at sixty."
  *   **Diagnosis:** **CONSISTENT_HIGH_DISCOUNT**.
  *   **Action:** **Stop.** Do not reach for the commitment toolkit. She is not betraying her judgment; her judgment differs from the standard retirement planning model. This is a values conversation, not a discipline fix.

  **Case 3: The Cash-Flow Constrained Client**
  *   **Step 1 (Feasibility):**
      *   Q: "Does the math show you missing rent...?"
      *   A: Cash flow shows $600 is not available without missing rent.
      *   **Result:** **Fail.**
  *   **Diagnosis:** **FEASIBILITY_OR_INFORMATION**.
  *   **Action:** **Stop.** **This is not a present-bias problem, do not reach for the commitment toolkit.** Your intuition to call this a "discipline problem" is incorrect per the procedure. A plan that requires money that does not exist is not a test of will; it is a math error. Reduce the savings target or increase income before addressing behavior.

  ***

  ### Application to Current Client (41-Year-Old Credit Card Holder)
  *   **Data Available:**
      *   Pays minimums (implies some cash flow, but tight).
      *   States: "Knows he should pay more."
      *   Step 2 Q A: $200 Today > $220 in 1 Month. (Steep discount >10%/mo).
      *   Step 2 Q B: **Never Asked.**
  *   **Procedure Status:**
      *   Step 1: Unknown (Assume Pass for diagnosis, but risky).
      *   Step 2: Incomplete. We cannot distinguish between Present Bias (Reversal) and Consistent High Discount (No Reversal) without the delayed frame question.
      *   Step 3: Stated judgment exists ("should pay more"), suggesting potential Akrasia, but without Step 2 confirmation, we don't know the mechanism.
  *   **Diagnosis:** Because the critical differentiator (the delayed choice) is missing, we cannot assign a bias label.
  *   **Action:** Complete the test.

  Verdict: INCONCLUSIVE (If you could not have the money until next month, would you prefer $200 then or $220 in two months?)
