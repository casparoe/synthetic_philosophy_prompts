  ### The Causal Actionability Principle

  A reversal between aggregate and subgroup rates constitutes a **genuine, actionable Simpson's Paradox** warranting stratification if and only if the grouping variable $Z$ satisfies one of two criteria:

  1.  **The Confounding Criterion:** $Z$ is a **pre-treatment common cause** (or proxy thereof) of both the Treatment $X$ and Outcome $Y$. Stratification blocks the backdoor path, recovering the causal effect.
  2.  **The Normative Criterion:** $Z$ is a **protected attribute** (e.g., race, gender) where equity is a primary objective, regardless of causal status. Stratification isolates disparate treatment or impact.

  Conversely, a reversal is an **artifact or distinct phenomenon** (not warranting stratification for causal estimation) if $Z$ is a **collider** (common effect), a **mediator** (post-treatment consequence), or an **arbitrary partition** with no causal/normative weight. In these cases, the aggregate rate typically reflects the total population effect or selection bias, and conditioning introduces bias or answers a different question.

  ---

  ### Mapping to Your Cases

  *   **(A) Confounding:** Satisfies the **Confounding Criterion**. $Z$ (Severity) causes both $X$ (Assignment) and $Y$ (Recovery). The aggregate is biased; stratification recovers the truth. **Verdict: Stratify.**
  *   **(B) Collider:** $Z$ is a common effect. Conditioning opens a spurious path. This violates the principle's exclusion of colliders. **Verdict: Do not stratify.**
  *   **(C) Arbitrary Composition:** $Z$ has no causal link to $X$ or $Y$. This fails both criteria. The reversal is purely mathematical weighting, not bias. **Verdict: Not SP (just composition).**
  *   **(D) Fairness:** Satisfies the **Normative Criterion**. Even if $Z$ does not confound the biological effect, we stratify to measure discrimination. **Verdict: Stratify.**
  *   **(E) Policy vs. Individual:** This case distinguishes between the **Average Treatment Effect** (Aggregate/Policy) and **Conditional Average Treatment Effect** (Subgroup/Individual). The principle accommodates this by noting that if no confounding exists (unlike A), both estimands are "true" for their specific query. The reversal here is due to effect modification, not bias. **Verdict: Both valid for distinct queries.**

  ### Application to Case (F): The Mediator

  In (F), the grouping variable $Z$ is a **post-treatment mediator** ($X \rightarrow Z \rightarrow Y$).
  *   **Analysis:** Conditioning on $Z$ blocks the indirect path of the treatment, isolating the *Direct Effect*. The aggregate reflects the *Total Effect*.
  *   **Verdict:** This is **not actionable Simpson's Paradox** for policy decisions. If the goal is "Should we administer the treatment?", the Total Effect (Aggregate) is the relevant metric. Stratifying creates an artifact by blocking the mechanism through which the treatment works. You should report the mediation analysis, but not use the stratified rates to override the aggregate policy decision.

  ### Application to a New Case (G): Berkson's Bias (Selection)

  *   **Setup:** In the general population, Diabetes ($X$ and Cholecystitis ($Y$) are independent. However, both increase the likelihood of Hospital Admission ($Z$). In the hospital data ($Z=1$), $X$ and $Y$ appear negatively correlated.
  *   **Analysis:** $Z$ is a **collider** ($X \rightarrow Z \leftarrow Y$).
  *   **Verdict:** Following the principle, do not condition on $Z$. The reversal is a **selection artifact**. The aggregate population data (if available) is the truth; the hospital subgroup is biased.

  ### Limitations and Honesty

  This principle relies on the user correctly identifying the causal structure (DAG). It cannot accommodate **Case (E)** if the user insists that "Both are right" implies *indecision* in a single context. The principle forces a choice: if the question is "What is the causal effect?", you must crown the confounder-adjusted estimate (or aggregate if no confounding). If the user refuses to crown one *even when the query is fixed*, the principle cannot accommodate that relativism. However, since you assigned them to different queries (Policy vs. Individual), the principle holds.

  The principle also struggles if the **Normative Criterion (D)** conflicts with the **Confounding Criterion (A)**. For example, if a protected attribute is also a strong biological confounder (e.g., Sex in heart disease), stratifying for fairness might obscure the medical reality needed for individual care. The principle prioritizes the *goal* (Fairness vs. Health), but cannot resolve the tension if both goals are pursued simultaneously without trade-off analysis.

  Overturned: NONE
