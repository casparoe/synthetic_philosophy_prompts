answer: |-
  The fire at Leicester Fields had burned low, casting long, wavering shadows against the stacks of papers that cluttered the table. Newton sat rigid in his chair, the gout wrapped in flannel beneath the desk, his eyes sharp despite the lateness of the hour. Bentley stood by the hearth, warming his hands, the ember of a pipe glowing faintly in his grip.

  "They will say, Sir, that you have built a temple and then asked a ghost to inhabit it," Bentley said, his voice low but carrying easily across the room. "Leibniz argues that if your system requires a Governor to intervene—to correct the irregularities, to wind the clock—then the Clockmaker was either incompetent or idle. You hand the Deists their weapon: a God of gaps."

  Newton's fingers tightened on the arm of his chair. "Leibniz would prefer a God who is a soul to the world, bound by necessity. A slave to his own creation. I will not have the Almighty reduced to a mere principle of sufficient reason."

  "I speak not of theology, but of method," Bentley pressed, turning from the fire. "You taught us to look only at phenomena. *Hypotheses non fingo*. Yet the *General Scholium*... it is a metaphysical intrusion. If you assert that the planets were placed by a counsel distinct from gravity, are you not framing the very hypothesis you forbade? You claim to deduce from phenomena, but there is no phenomenon of 'divine counsel.' It is an inference. A grand one, but an inference nonetheless."

  Newton leaned forward, the candlelight catching the deep lines of his face. "You mistake the boundary. Gravity explains the *motion* of the planets, Richard. It explains how they sweep equal areas in equal times. But does gravity explain why the planets all lie in the same plane? Does it explain why they orbit the Sun in the same direction, while the comets cut across them at every angle?"

  "Mechanical causes may yet be found," Bentley countered. "Vortices, perhaps, refined."

  "Vortices are fictions!" Newton snapped, the old fury flaring. "There is no resistance in the heavens. The comets prove it. They pass through the regions of the planets without impediment. If there is no resistance, there is no fluid to carry them. So I ask you: if blind nature cannot arrange the stones in an arch, why do you insist it arranged the spheres in a system? To say 'the laws hold' is to stop short. It is to describe the letter and ignore the author."

  Bentley stepped closer, resting a hand on the back of a chair. "But by naming the Author in the *Principia*, you blur the line between natural philosophy and natural theology. If you say 'God did it,' you halt inquiry. The atheist in Amsterdam reads your *Scholium* and smiles. He says, 'Newton admits his mechanics are insufficient. He invokes a miracle to save his math.' You weaken the certainty of the mathematics by anchoring it to a cause you cannot measure."

  Newton's gaze did not waver. "Is it a weaker hypothesis to say an Intelligent Agent ordered the system, or to say it arose from a chaos that just happened to settle into perfection? Which is the greater fiction? To acknowledge a Mind is to follow the evidence of the order. To deny it is to worship blind chance. That is the true hypothesis, Richard. A hidden one. I merely drag it into the light and show it for what it is."

  Bentley was silent for a moment, the pipe smoke curling between them. "Then you accept the cost? That you will be accused of inconsistency? That the *Scholium* will be read as the hypothesis you claimed not to frame?"

  "Let them read as they will," Newton said, sinking back into the shadows of his chair. "I have shown them the frame. If they choose to believe it holds itself up without a hand, that is their blindness, not my hypothesis."
