answer: |-
  You have identified one of the most fundamental fault lines in moral and political philosophy. Yes, this is a single, recognized phenomenon with a canonical name. It is most commonly referred to as **"The Separateness of Persons."**

  The canonical statement comes from **John Rawls** in *A Theory of Justice* (1971), though the intuition has deep roots in Kantian deontology and libertarian thought (particularly Robert Nozick).

  Here is the breakdown of the concept, its canonical formulation, and how philosophers attempt to solve the "limits" problem you identified.

  ### 1. The Canonical Formulation
  Rawls's critique was directed primarily at utilitarianism. He argued that utilitarianism extends the principle of rational choice for a single individual to society as a whole.

  For a single individual, it is rational to sacrifice a present pleasure for a greater future gain (e.g., going to the dentist now to avoid pain later). This is **intrapersonal aggregation**. Utilitarianism treats society as a "super-individual," arguing it is equally rational to sacrifice one person's welfare for the greater gain of others. This is **interpersonal aggregation**.

  Rawls's famous objection is:
  > **"Utilitarianism does not take seriously the distinction between persons."**

  He argues that while a single person can balance losses and gains across different moments of their own life, there is no "social entity" that experiences the net gain. Only the individuals exist. Therefore, sacrificing Person A for Person B is not analogous to Person A sacrificing their present self for their future self; it is a violation of Person A's integrity.

  Robert Nozick sharpened this in *Anarchy, State, and Utopia* (1974) with the language of **side-constraints**:
  > "Individuals have rights, and there are things no person or group may do to them (without violating their rights). So strong and far-reaching are these rights that they raise the question of what, if anything, the state and its officials may do."

  ### 2. Why the Objection Has Force
  The intuition you feel is that there is a moral difference between **loss** and **sacrifice**.
  *   **Loss:** If a natural disaster destroys my house and saves your neighborhood by creating a firebreak, that is a tragedy, but no moral agent *used* me.
  *   **Sacrifice:** If the state *demolishes* my house to create a firebreak for your neighborhood, I have been used as a resource.

  The "Separateness of Persons" objection claims that moral agents are ends in themselves (Kant), not resources to be mined for social utility. When you aggregate across persons, you treat the victim not as a participant in the moral community, but as a vessel of utility that can be emptied for the greater good.

  ### 3. The Limits: Permitted vs. Forbidden Trade-offs
  You asked the crucial question: *We do make interpersonal trade-offs all the time (taxation, quarantine, draft). So what is the principle?*

  If the Separateness of Persons were an absolute prohibition on all interpersonal costs, society would be impossible. Defenders of the view distinguish permissible trade-offs from impermissible ones using several criteria:

  #### A. Consent and Contract (The Rawlsian Solution)
  Rawls argues that inequalities (and costs) are permissible if they are part of a system that everyone would agree to under fair conditions (the "Original Position").
  *   **Taxation:** We all agree to a system where we pay in, knowing we might be net payers or net receivers. It is a reciprocal scheme of cooperation.
  *   **Drug Trials:** Impermissible without informed consent. If the participants *agree* to the risk for the social good (perhaps for payment or access to care), the "boundary" is respected because they authorized the crossing.
  *   **The Limit:** You cannot impose a cost on someone who could not hypothetically consent to the system governing that cost.

  #### B. General Rules vs. Specific Sacrifice
  There is a distinction between imposing a risk as part of a general rule applied to all, versus selecting a specific individual for sacrifice.
  *   **Quarantine:** This restricts the liberty of the infected. However, it is a general rule based on status (infection), not a selection of a specific scapegoat. Furthermore, it is often framed as preventing harm (the infected harming others) rather than using them for gain.
  *   **Punishment:** Punishing a guilty person is seen as respecting their agency (they chose the crime); punishing an innocent person to deter others (the "judicial framing" scenario) violates the separateness of persons because the innocent person is being used merely as a means.

  #### C. Ex-Ante vs. Ex-Post
  Economists often use the **Kaldor-Hicks efficiency** criterion (the winners *could* compensate the losers). Critics of aggregation demand **Pareto improvements** (no one is made worse off) or actual compensation.
  *   **Trade Policy:** If the winners *actually* compensate the losers (through retraining, unemployment benefits), the trade-off becomes more defensible. The objection is strongest when the loss is concentrated and uncompensated, while the gain is diffuse.
  *   **The Principle:** A trade-off is more permissible if it is part of an insurance-like scheme where everyone faces similar risks and benefits over a lifetime, rather than a one-off sacrifice of a specific group.

  #### D. Threshold Deontology
  Some philosophers argue that rights (which protect the separateness of persons) are not absolute but have a threshold.
  *   You cannot kill one healthy person to harvest organs for five sick people (violates separateness).
  *   You *might* be permitted to kill one person to stop a nuclear bomb from killing a million (the threshold is crossed).
  *   **The Principle:** The boundary between persons is robust, but not infinitely rigid in the face of catastrophic aggregation.

  ### 4. The Counter-Challenge: Parfit's Reductionism
  It is worth noting that this objection has been challenged on metaphysical grounds. In *Reasons and Persons* (1984), **Derek Parfit** argued that the "Separateness of Persons" relies on a view of personal identity that might not hold up.

  Parfit suggested that persons are not distinct, enduring entities but rather overlapping chains of psychological and physical connections (like time-slices). If the boundary between "me now" and "me later" is fuzzy, Parfit asks, why is the boundary between "me" and "you" so morally decisive? If the separateness of persons is less metaphysically robust than we think, the objection against aggregation loses some of its force. This remains a live debate in ethics.

  ### Summary
  The phenomenon you noticed is **The Separateness of Persons**.

  *   **Canonical Statement:** John Rawls, *A Theory of Justice* ("Utilitarianism does not take seriously the distinction between persons").
  *   **The Principle:** It is illegitimate to treat the losses of one person as directly cancellable by the gains of another, because there is no social entity that experiences the net sum.
  *   **The Limit:** Trade-offs are permitted when they occur within a framework of **reciprocity, consent, and general rules** (like taxation or quarantine), but forbidden when they involve **targeted, non-consensual sacrifice** of specific individuals for the aggregate good (like scapegoating or non-consensual medical experimentation).

  Your intuition is correct: the debate is not about whether trade-offs exist, but about whether the *structure* of the trade-off respects the individual as a sovereign entity or treats them as a vessel of utility.
