      *Problem:* If Card B exists, Utilitarianism always favors B.
      *Solution:* The class must *agree* on a normalization method.
      *Method 1:* Zero-Point Alignment (Set min utility to 0).
      *Method 2:* Unit Alignment (Set marginal utility at mean to 1).
