  7.  **Finalizing the Design:**
      *   **Title:** "The Normalization Problem."
      *   **Roles:** 18 Students. 1 "Social Planner" (TA/Prof). 2 "Auditors" (Maths majors). 15 "Citizens."
      *   **Materials:** Index cards with Utility Functions (Affine transformations of each other or distinct curves?), Poker Chips (currency), Whiteboard.
      *   **Phase 1: Private Valuation.** Citizens get cards. $U(c) = a \cdot f(c) + b$. $a$ and $b$ vary wildly.
