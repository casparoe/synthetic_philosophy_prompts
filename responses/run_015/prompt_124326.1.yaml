      This reveals that Person(2) values the *extra chips* more than Person(5) values *keeping theirs*.
      This is actually **Interpersonal Comparison of Marginal Utility**.
      *Key Insight:* If we allow trading, we *can* equalize marginal utility (Pareto efficiency). But we cannot determine the *distribution* (Equity) without a level comparison.
      *This is the golden nugget.* The market solves efficiency (marginal units), but not equity (baseline levels).

      *Revised Plan:*
      1.  **Distribution:** Give random chip endowments.
      2.  **Utility Cards:** Private functions (different scales/origins).
