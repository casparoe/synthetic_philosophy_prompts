      *   **Phase 5: Veil of Ignorance.** Reset. Choose a rule.
      *   **Debrief:** Map the failure to agree on normalization to the philosophical problem.

      *Correction on Phase 1:* To make the maths majors happy, the functions need to be explicit.
      Card A: $U = c$. (0 chips = 0 utils, 10 chips = 10 utils).
      Card B: $U = 100c + 500$. (0 chips = 500 utils, 10 chips = 1500 utils).
