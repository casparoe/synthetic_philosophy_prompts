      *Wait, I need to stick closer to the prompt's specific request:* "Two different translation schemes... recommend opposite allocations."
      Okay, I will design the cards so that:
      Scheme 1 (Normalize Zeros): Policy X wins.
      Scheme 2 (Normalize Units): Policy Y wins.
      Both schemes are behaviorally indistinguishable.

  8.  **Addressing the "Maths Majors":**
      *   Give them a specific role: "Measurement Auditors." Their job is to check if the proposed normalization is mathematically valid given the behavioral data.
      *   They will quickly realize *no* normalization is valid.
      *   Task them with proving *why* the class is stuck.

  9.  **Addressing the "Disaster" (Honesty/Reporting):**
      *   Do not ask them to report numbers.
      *   Make the numbers *fixed* on the cards. They don't write anything down until the end.
