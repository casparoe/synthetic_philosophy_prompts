answer: |-
  This is a classic pedagogical trap: you want them to feel the *impossibility* without telling them it's impossible. The key is to structure the incentives so that "doing the right thing" (maximizing welfare) requires a calculation that the rules of the game explicitly forbid them from completing.

  Here is a design for **"The Normalization Market."** It uses your ingredients but sequences them to force the contradiction.

  ### 1. Setup & Materials
  *   **Room:** Seminar style. Whiteboard visible to all.
  *   **Currency:** Poker chips (approx. 200 total). These are the *resource*, not money.
  *   **Cards:** 18 Index cards (see "Card Design" below).
  *   **Roles:**
      *   **15 Citizens:** Hold Utility Cards.
      *   **2 Auditors:** (Your Maths majors). Their job is not to play, but to verify if any proposed "Social Welfare Calculation" is mathematically valid based *only* on observed behavior.
      *   **1 Reference Person:** (Student 1). Their utility units are tentatively declared "Social Utils" by fiat at the start.
      *   **You:** The Social Planner / Auctioneer.

  ### 2. The Card Design (Crucial)
  You need three types of utility functions over Chips ($c$). To ensure the "opposite allocations" problem, the cards must differ in **Origin ($b$)** and **Unit ($a$)**, but yield the same *ordinal* preferences over chips (everyone prefers more chips to fewer).

  *   **Type A (5 students):** $U_A(c) = c$. (Range 0-10 chips $\rightarrow$ 0-10 utils).
  *   **Type B (5 students):** $U_B(c) = 2c + 40$. (Range 0-10 chips $\rightarrow$ 40-60 utils).
  *   **Type C (5 students):** $U_C(c) = 0.5c + 10$. (Range 0-10 chips $\rightarrow$ 10-15 utils).

  *Note:* Everyone prefers 10 chips to 0. But Type B looks like a "Utility Monster" (huge numbers). Type A looks "Standard." Type C looks "Low Sensitivity."
  *Private Info:* Students see only their own card. They know others have cards, but not which type.

  ### 3. Minute-by-Minute Timeline (80 Minutes)

  #### **00:00 – 00:10: Distribution & The First Vote**
  *   Hand out cards randomly. Tell them: "Your card is your soul. It defines how chips translate to satisfaction. Do not show it."
  *   Designate Student 1 as the **Reference Person**. Write on board: *1 Reference-Util = 1 Social-Util.*
  *   **The Proposal:** You hold 10 Chips. You must give all 10 to **one** person to maximize Total Social Welfare.
  *   **Option X:** Give to a Type A person (if you can find one).
  *   **Option Y:** Give to a Type B person (if you can find one).
  *   **Task:** The class must vote. To vote, they must calculate the gain in Social Utils.
  *   **The Snag:** Type B claims they gain 20 utils ($2 \times 10$). Type A claims they gain 10 utils ($1 \times 10$). Type B argues they are "worth more." Type A argues B's scale is inflated.
  *   *Outcome:* Deadlock. They cannot sum $10_A + 20_B$ because the units differ.

  #### **00:10 – 00:30: The Normalization Market (The Swap Round)**
  *   **Goal:** Try to discover the exchange rate between A-Utils, B-Utils, and Reference-Utils.
  *   **Mechanism:** You allow a **Situation Swap Market**.
      *   Pair students up (one Type A, one Type B).
      *   Give Person A a "Situation Card" saying "You have 5 Chips."
      *   Give Person B a "Situation Card" saying "You have 5 Chips."
      *   **Auction:** They can bid chips from their personal stash (give them 5 starter chips each) to **swap situations** with their partner.
      *   *Example:* Person A pays Person B 2 chips to swap. Person A now has "Person B's Situation (5 chips) + 2 chips payment"? No, keep it simple: They swap the *Utility Function* for the round?
      *   *Better Mechanism:* **The Insurance Market.**
      *   Offer a gamble: "50% chance of 10 chips, 50% chance of 0."
      *   Ask students to bid chips to **avoid** the gamble (buy a sure 5 chips).
      *   Type A (Linear) is risk neutral. Willing to pay up to 0 chips premium.
      *   Type B/C (if you made them concave) would pay a premium.
      *   *Wait, stick to the prompt's idea:* **"Bid chips to swap entire situations."**
      *   **Revised Swap:** Select two volunteers (one A, one B). Give A a card "10 Chips." Give B a card "0 Chips."
      *   Ask the class: "Should they swap?" (Obviously yes, Pareto improvement).
      *   Ask the class: "How many chips should A compensate B to make it fair?"
      *   **The Trap:** To calculate "fair compensation," you need to compare $U_A(10) - U_A(x)$ with $U_B(x) - U_B(0)$.
      *   Let them trade chips to try to find the equilibrium.
      *   **Auditor Intervention:** At minute 25, stop the trading. Ask the Maths Auditors: "Does this market price reveal the true ratio of Utility Units?"
      *   **Expected Answer:** "No. It reveals the marginal utility of chips *for these specific individuals at this specific endowment*. It does not fix the zero-point ($b$)."

  #### **00:30 – 00:50: The Two Translation Schemes**
  *   Now force the conflict. Write two "Normalization Protocols" on the board.
  *   **Protocol 1 (Zero-Alignment):** "We agree that 0 Chips = 0 Social Utils for everyone." (Forces $b=0$).
      *   Recalculate the vote from Round 1.
      *   Type A: $U=10$. Type B: $U=20$ (since $2(10)+40$ becomes $2(10)$). **Winner: Type B.**
  *   **Protocol 2 (Unit-Alignment):** "We agree that 1 Chip = 1 Social Util for everyone." (Forces $a=1$).
      *   Recalculate.
      *   Type A: $U=10$. Type B: $U=10$ (since $2c+40$ becomes $1c + 40$).
      *   Now the *baseline* ($b$) matters. Type B starts with 40 utils of happiness even with 0 chips. Type A starts with 0.
      *   **Utilitarian Calculation:** If we give chips to Type A, they go $0 \rightarrow 10$. Gain = 10. If we give to Type B, they go $40 \rightarrow 50$. Gain = 10.
      *   *Wait, I need them to disagree.*
      *   **Adjustment:** Make Type C the pivot.
      *   **Protocol 1 (Zero-Align):** Type B wins (steepest slope).
      *   **Protocol 2 (Max-Min Normalize):** Map everyone's [0 chips, 10 chips] range to [0, 100].
      *   Now slopes are identical. Who wins? The one with the *most concave* function (if you introduced curvature) or the one with the *lowest baseline* if we care about levels.
      *   **The Reveal:** Ask the class to vote on which Protocol is "True." They will split.
      *   **Auditor Check:** Ask Auditors: "Is there any behavioral evidence in the Swap Round that proves Protocol 1 is better than 2?"
      *   **Answer:** "No. Both are consistent with all observed choices."

  #### **00:50 – 01:05: The Veil of Ignorance (Loaded Lottery)**
  *   Collect all cards. Shuffle.
  *   **The Choice:** The class must choose a **Constitution** for the next round (hypothetical).
      *   **Rule 1:** Maximize Sum of Utils (using Protocol 1).
      *   **Rule 2:** Maximize the Minimum Utility (Rawlsian).
  *   **The Load:** Tell them: "If we implement this, 80% of you will be Type B (High Baseline), 20% will be Type A."
  *   **The Twist:** Type B people (who know they are Type B) will vote for Sum (they win). Type A will vote for Min.
  *   **The Veil:** Now, take the cards back. *Don't let them look.* Tell them: "You will be reassigned randomly. 80% chance Type B, 20% Type A."
  *   **Vote:** Which Rule?
  *   **Expected Result:** Even behind the veil, if they are risk-neutral expected utility maximizers, they might still choose Sum. If they are risk-averse, they might choose Min.
  *   **The Point:** This reveals that "Social Welfare" is just aggregate risk preference. It doesn't solve the *measurement* problem, it just bypasses it via probability.

  #### **01:05 – 01:20: Debrief & Mapping**
  *   **Board Work:** Draw the two Utility Functions ($U_A$ and $U_B$).
  *   **Show:** You can stretch/shift $U_B$ to match $U_A$'s slope, or match $U_A$'s zero, but not both simultaneously without arbitrary fiat.
  *   **Map the Game:**
      *   *Swap Round:* Showed we can equalize *marginal* utility (efficiency), but not *total* utility (equity).
      *   *Protocol Vote:* Showed that "Units" and "Origins" are separate degrees of freedom.
      *   *Auditors:* Confirmed no behavioral fact resolves the tie.
  *   **The Philosophical Landing:** "We didn't find the answer because there isn't one in the data. The data is invariant to affine transformations. Any comparison requires a moral axiom, not an empirical discovery."

  ---

  ### 4. Troubleshooting: What Will Go Wrong

  **1. The "Utility Monster" Derailment**
  *   **Risk:** The Type B students realize their numbers are bigger and just shout "I deserve more because my number is bigger."
  *   **Fix:** Empower the Auditors. Give them a red card. If a student argues "My number is bigger," an Auditor can flash the red card and say "Affine Transformation Objection." Make this a game mechanic. If the Auditors validate the claim, the student gets a bonus chip. If they reject it, the student loses a chip. This gamifies the maths.

  **2. The Reference Person Gets Weird**
  *   **Risk:** Student 1 (Reference) feels too powerful or confused.
  *   **Fix:** Frame it as a burden. "You are the Standard Kilogram. You don't get to decide; you just *are*." Give them a physical prop (a distinct colored chip) to hold.

  **3. Strategic Misreporting in the Veil**
  *   **Risk:** Students lie about their risk aversion in the Veil round.
  *   **Fix:** The Veil round is a *vote on a rule*, not a report of preference. Don't ask them "What is your utility?" Ask "Which Rule do you vote for?" Voting is public; lying is less relevant than coalition building.

  **4. The Maths Majors Check Out**
  *   **Risk:** They solve it in minute 5 and spend the rest bored.
  *   **Fix:** Their role is **Auditor**, but give them a secondary task. "Your job is to find the *exact moment* the class makes a mathematical error in their reasoning." They have to present this in the debrief. This keeps them hunting for errors throughout.

  **5. The "Honesty" Collapse (From Last Year)**
  *   **Risk:** Students argue about whether someone *really* feels 7 utils.
  *   **Fix:** **Ban phenomenological claims.** Rule: "You cannot argue about how you feel. You can only argue about the numbers on your card and the chips you trade." Treat the cards as binding physical laws, not psychological reports.

  ---

  ### 5. Limitations: What You Must Lecture
  Be frank with them in the last 10 minutes. The activity demonstrates **Epistemic Inaccessibility** (we can't know the comparison), but it does not prove **Metaphysical Indeterminacy** (that there *is* no fact of the matter).

  *   **What the game shows:** Behavioral data (choices, trades, risk profiles) is insufficient to fix the scale ($a$) and origin ($b$) of utility functions across persons.
  *   **What the game doesn't show:** Whether a "God's eye view" could compare them. (Physicalists might say yes via neuroscience; Philosophers might say no via privacy of mind).
  *   **The Trap to Avoid:** Do not let them conclude "Therefore, Interpersonal Comparisons are nonsense."
  *   **The Correction:** "Therefore, Interpersonal Comparisons are not *empirical* claims. They are *moral* commitments. When you voted for Protocol 1 vs 2, you weren't doing science; you were doing ethics."

  ### 6. Why This Works for Your Group
  *   **PPE/Politics:** They get to vote, coalition-build, and argue about fairness (Veil round).
  *   **Philosophers:** They get the "moral axiom vs empirical fact" distinction in the debrief.
  *   **Maths Majors:** They get to police the affine transformations. They will appreciate that $U$ and $aU+b$ are observationally equivalent.
  *   **You:** You don't have to write the equation on the board until *after* they've felt the pain of not having it.

  ### 7. Quick Prep Checklist
  1.  **Print Cards:** 5 of Type A, 5 of Type B, 5 of Type C. (Keep 3 spares).
  2.  **Prop:** A distinct object for the Reference Person.
  3.  **Board:** Pre-draw the axes for the debrief so you don't waste time.
  4.  **Auditor Briefing:** Pull the two maths majors aside for 30 seconds before class. Tell them: "Your job is to be annoying pedants about units. If anyone compares utils without normalizing, call them out."

  This structure forces the "disaster" you had last year (people comparing numbers) to become the *data point* for the seminar, rather than the failure of the seminar. The disaster *is* the lesson.
