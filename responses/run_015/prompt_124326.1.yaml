      *   *The Conflict:* Group 1 says "Person A needs it more (steeper slope)." Group 2 says "Person B needs it more (lower baseline)."
      *   *Wait, the prompt asks for specific mechanics:* "Reference person," "Swap round," "Veil round." I should incorporate these.

  6.  **Integrating Prompt Suggestions:**
