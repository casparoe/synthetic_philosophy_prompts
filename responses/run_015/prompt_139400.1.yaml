answer: |-
  **Q&A Prep Sheet: Hofstadterian Personal Identity**

  **1. The "Soul Smuggling" Objection**
  *Who:* The Hofstadter skeptic who hates "I" vocabulary.
  *Phrasing:* "You keep talking about patterns surviving, but that's just dualism. You're smuggling a soul back in by calling it a 'strange loop.' If there's no substance, there's no you to survive."
  *Reply:* "I'm not claiming there's a ghost in the machine. I'm claiming there's a structure in the machine, and structures can be copied. Think of a song. If I hum it, then you hum it, the song survived. No soul needed, just information transfer. When I say 'I,' I mean the specific self-referential structure that processes data as 'me.' If that structure starts running in your head because I taught you my habits, then part of that song is now playing on your hardware. It's not mysticism; it's just recognizing that some things are substrate-independent."
  *Soft Spot:* This leans heavily on the song analogy, which works for artifacts but feels weaker for *consciousness*. You haven't explained why a running structure feels like anything, only that it exists.
  *Strawman Flag:* Yes. Your use of "I" invites this.
  *Defuse:* "I'm using 'I' as a shorthand for a specific causal structure, not a metaphysical substance."

  **2. The "LLM vs. Child" Objection**
  *Who:* The ML interpretability researcher.
  *Phrasing:* "If it's about pattern instantiation, a model fine-tuned on my entire email history instantiates my pattern better than my daughter does. She only knows 10% of my habits; the model knows 100%. Are you saying the model is more me than my kid?"
  *Reply:* "No, because the model is inert. It sits there until queried. My daughter is live. She wakes up, makes decisions, and reacts to the world using habits she learned from me. The model predicts text; my daughter lives a life. The pattern matters only insofar as it's causally poised to generate behavior in real-time. A frozen weight matrix is a map; my daughter is the territory walking around."
  *Soft Spot:* "Causally poised" is doing all the work here. If you restore the backup to a server, is it live then? You're drawing a bright line where there might be a gradient.
  *Note:* Preempt this in the talk. Don't wait for Q&A.

  **3. The "Measure is Just Probability" Objection**
  *Who:* The expected-utility maximizer.
  *Phrasing:* "This measure stuff feels verbal. If I normalize the weights, it behaves like probability. You say it doesn't sum to one, but decision theory forces normalization anyway. You've just reinvented Neo-Lockeanism with extra steps."
  *Reply:* "It's not verbal because copying changes the stakes. In probability, if I copy myself ten times, the chance of being any *one* of them drops. In measure, the total amount of 'me' increases tenfold. If I care about my successors, I should care more about the scenario where there are ten of them living well than the one where there's only one. Probability asks 'Which one will I be?' Measure asks 'How much of me is there?' Those lead to different choices in fission cases."
  *Soft Spot:* Many decision theories collapse this distinction anyway. If you can't show a bet where measure and probability diverge in payout, they'll treat this as semantics.
  *Note:* This is core thesis. Must defend strongly.

  **4. The "Quantum Measure" Objection**
  *Who:* The Many-Worlds advocate.
  *Phrasing:* "You're borrowing the math of quantum measure without the physics. Are you claiming personal identity literally branches like a wavefunction, or is this just an analogy? If it's an analogy, why trust the machinery?"
  *Reply:* "It's an analogy, but a structural one. Quantum measure tracks amplitude across branches; I'm tracking pattern instantiation across substrates. The math is similar because both deal with conservation laws and branching structures. I'm not claiming brains are quantum systems; I'm claiming that when identity distributes, it follows similar aggregation rules. The physics isn't the point; the accounting is."
  *Soft Spot:* Analogical reasoning is weak against hard physics objections. If the MWI person presses on why measure should be conserved in cognition, you might not have a derivation.

  **5. The "Neo-Lockean" Objection**
  *Who:* The retired analytic philosopher.
  *Phrasing:* "Locke said identity is psychological continuity. You say it's pattern degree. That's just Locke with numbers bolted on. You haven't solved the 'no further fact' problem; you've just quantified the reduction."
  *Reply:* "Locke tried to preserve binary identity—either you are the same person or you aren't. I'm saying that question is broken. There is no further fact, not even a numerical one. The number isn't about identity; it's about *presence*. Locke asks 'Is he the same?' I ask 'How much of him is here?' That shift lets us handle fission without paradox. It's not bolted-on numbers; it's a category change."
  *Soft Spot:* The philosopher may argue that "degree of presence" is itself a further fact you haven't justified.

  **6. The "No-Self" Objection**
  *Who:* The meditator.
  *Phrasing:* "The premise is wrong. There is no 'I' to be distributed. You're reifying a process that doesn't exist. Why care about preserving a pattern that's already empty?"
  *Reply:* "I agree there's no permanent self. But there is a functional self—a process that suffers, plans, and cares. Even if the 'I' is an illusion, the suffering isn't. Preserving the pattern matters because the pattern is what experiences the welfare. We can be reductionists about the self and still care about where the reduction lands."
  *Soft Spot:* If they hold that realizing no-self eliminates care, your normative argument fails.
  *Strawman Flag:* Possibly. Your talk might imply the "I" is more robust than they accept.
  *Defuse:* "I'm talking about the functional agent, not the ontological subject."

  **7. The "Hard Drive" Objection**
  *Who:* Everyone (this is the visceral one).
  *Phrasing:* "You say a hard drive backup isn't me because it's inert. But if I die, and my wife restores that backup into a robot body, is that me? If yes, the inert/live line is arbitrary. If no, why not?"
  *Reply:* "If you restore it and it starts running, yes, that's a new instantiation. The backup on the drive was just potential, like a seed. The running robot is the plant. My claim is that identity requires the running process. The drive holds the recipe; the robot is the cake. We care about the cake, not the recipe book, unless the book is about to become a cake."
  *Soft Spot:* This concedes that identity can jump from inert to live. If the drive is encrypted and only *could* be run, is it 0% you or 0.001%? You're still drawing a threshold where there might be a slope.
  *Note:* **Concede/Preempt in Talk.** Do not let this be the first time you define "live instantiation." Define it on stage.

  **8. The "Why Care?" Objection**
  *Who:* The quiet utilitarian in the back.
  *Phrasing:* "Okay, suppose you're right. There's measure, not probability. Why should I care about the sum total of measure? Why not just care about the one successor I experience?"
