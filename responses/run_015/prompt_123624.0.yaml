  ok so my friend threw this at me in a study session and i cant find the hole. feels like it proves way too much, like rational belief is literally impossible? but i cant tell where the sleight of hand is.

  (1) If you're rational then you should only believe stuff when it's highly probable — like over 99%.
  (2) In a big lottery, for each individual ticket it's 99.99% likely to loose, so it's rational to believe each one won't win.
  (3) The same goes for the preface thing: an author can rationaly belive every single claim in thier book, since each was carefully checked, even though she also rationaly believes the book has at least one mistake somewhere.
  (4) Now if belief is rational it should be consistent — you can't rationaly believe p and also believe not-p.
  (5) So from (2) and (3) I end up rationaly believing "ticket 1 looses" and "ticket 2 looses" ... all the way through, which together mean "no ticket wins" — but i also rationaly believe "some ticket wins." Same for the book: "all claims true" vs "some claim false."
  (6) To avoid contradiction I have to either reject consistency (weird) or reject that high-probability individual beliefs are rational.
  (7) But if I reject (6) then I can't ever believe anything in a large enough set, since there's always some chance of error. So rational belief collapses into skepticism about everything.
  (8) Therefore the only consistent rational stance is total agnostocism about any complex domain.

  where did i mess up? is it the consistency requirement in (4), or the jump from individual to collective in (5), or something about how "belief" works? if i keep (1) and (4) which ones do i pay for? also, what would actually change your mind here — like which argument or consideration would make you say the flaw is somewhere else, and where do you think this reasoning is weakest?
