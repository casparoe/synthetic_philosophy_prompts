      *   *Nina 1:* She applies *naya* (standpoints) well, but *saptabhaṅgī* is technically about predication of existence (syād asti, syād nāsti...), not future probabilities. She conflates *naya-vāda* (standpoints) with *saptabhaṅgī* (predication). *Verdict: Partly Right.*
