  **Preliminary Analysis of Administrative Frictions in *Perpetual Peace***

  1.  **Republicanism:** Requires separation of legislative (will) and executive (action); direct democracy where all decide and execute is classified as despotism.
  2.  **Federation:** A league of free states is required; a global sovereign state would become a soulless tyranny.
  3.  **Cosmopolitan Right:** Limited to hospitality (visit/temporary stay), not residence, based on the shared finite spherical surface of the earth.
  4.  **National Debt:** Forbidden to contract debt for the external friction of states (war funding).
  5.  **Standing Armies:** Must be abolished gradually over time.
  6.  **Non-Intervention:** Forcible interference with the constitution and government of another state is prohibited.
  7.  **Guarantee:** Peace is secured by nature through self-interest and commerce, not moral improvement.
  8.  **Secret Article:** States may take counsel from philosophers but must never be seen to do so.

  ***

  **MEMORANDUM FOR THE FEDERAL COUNCIL**
  **FROM:** Deputy Auditor, Bureau of Republican Certification
  **DATE:** 240th Year of the Peace
  **SUBJECT:** Admission Petition 884-B (Meridian Union)

  Pursuant to the statutory mandate to verify constitutional compatibility prior to federated admission, the Bureau has completed its review of the Meridian Union. The Union presents a unique case of hyper-compliance with participatory norms that nonetheless triggers fundamental conflicts with the foundational articles regarding the structure of republican authority and the limits of cosmopolitan hospitality. The following findings detail specific areas of non-compliance that must be rectified before certification can be granted.

  1.  **Constitutional Structure and Executive Unity:** The Meridian Union governs via continuous digital plebiscite, wherein the citizenry votes directly on administrative warrants and defense movements. While this appears to maximize liberty, it violates the definitive article requiring the separation of the legislative will from the executive power. Under the founding doctrine, a state where the people execute their own will without representation constitutes a despotism, as the general will is not distinct from the force implementing it. The Union must establish a representative legislature that does not execute, and an executive authority that does not legislate, ensuring the citizenry is subject to laws they willed but do not personally enforce.

  2.  **Defense Financing and Standing Forces:** The Union maintains no standing army, which is compliant, but funds its Volunteer Reserve through annual household drill subscriptions backed by Peace Preservation Certificates issued against future commercial revenue. This mechanism constitutes contracting national debt for the external friction of states. The prohibition on debt is intended to prevent the burden of future conflicts from accumulating across generations and incentivizing aggression to clear ledgers. The Union must transition to a pay-as-you-go funding model derived from current taxation rather than credit instruments tied to defense readiness.

  3.  **Federal Enforcement and Non-Interference:** The Federal Enforcement Corps currently operates under a mandate to secure republican constitutions within member states. However, the preliminary articles forbid any forcible interference with the constitution and government of another state. Our presence within the Meridian Union to mandate constitutional restructuring violates the very sovereignty we aim to protect. The Corps must withdraw physical personnel and rely solely on diplomatic conditioning, ensuring that republicanization appears to emerge from internal necessity rather than external coercion.

  4.  **Orbital Habitation and Cosmopolitan Right:** Nine thousand residents of free-orbit settlements under Meridian jurisdiction have petitioned for residency rights within the Federation based on cosmopolitan law. The founding text limits cosmopolitan right to a right of presentation and visitation, derived from the fact that humanity shares the finite, spherical surface of the earth. Orbital space does not constitute this original common possession of the surface. Consequently, orbital residents enjoy a right to visit terrestrial ports but possess no claim to residence, as the spherical limitation does not extend to the void above the atmosphere.

  5.  **Advisory Protocols and Public Acknowledgement:** The Bureau's determination relies on conclusions from the unnamed advisory panel of political theorists. Per the secret article, states may take counsel from philosophers but must never be seen to do so. Accordingly, this memorandum will not acknowledge the source of the doctrinal interpretations herein, and the Council is instructed to issue the rejection of the Orbital petition as if the legal reasoning originated entirely within the Bureau's internal logic. Any public gratitude toward the panel would violate the condition of secrecy required for their influence to remain effective.

  6.  **Final Determination and Strategic Risk:** The Federation relies on nature's guarantee, working through self-interest and the commercial spirit, rather than moral improvement. However, the rigidity of these requirements invites realist critique. Councilor Vane, the last avowed Hobbesian, noted during the review, "We are building a machine that requires men to be gears while pretending they are mechanics; peace secured by contradiction is merely a ceasefire waiting for a philosopher to miss a step." Conversely, a panel member, speaking off the record regarding their mandated invisibility, stated, "It is a strange tyranny that demands wisdom but punishes the wise for speaking it." Despite these tensions, the Bureau recommends denying admission until the Meridian Union installs a representative legislature that does not execute, thereby ending their democratic despotism.
