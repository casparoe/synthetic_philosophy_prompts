answer: |-
  ### Part 1: Brainstorming & Selection

  **Candidate 1: The "Lightbulb Grid"**
  Participants sit in a grid with individual switches. A central display shows total "lumens."
  *   *Round 1:* Light turns on *only* if exactly 10 switches are flipped (Visible Threshold).
  *   *Round 2:* Light turns on if switches > Random Number (Hidden Threshold).
  *   *Round 3:* Brightness scales linearly (Continuous).
  *   *Critique:* Too abstract. It gamifies the ethics away. Participants treat it as a puzzle to solve rather than a sacrifice to weigh. It fails to generate the *felt cost* necessary to make the inefficacy objection sting.

  **Candidate 2: The "Charity Auction"**
  Participants bid "effort" (time/stay late) to unlock a donation.
  *   *Round 1:* Donation unlocks if total effort hours >= 20 (Visible).
  *   *Round 2:* Donation unlocks if total effort >= Secret Target (Hidden).
  *   *Round 3:* Donation amount scales with effort (Continuous).
  *   *Critique:* Logistically fragile. Measuring "effort" in real-time is impossible without surveillance, which breaks trust. It risks becoming a negotiation session ("Who is putting in how much?") rather than a simultaneous private choice, which ruins the isolation of the causal structure.

  **Candidate 3: The "Threshold Pot" (Selected)**
  Participants decide whether to incur a private time-cost to contribute to a €40 charity pot. The pot's release conditions change per round.
  *   *Why this wins:* It isolates the variables. The cost (time) is real and verifiable. The benefit (charity) is morally weighty but impersonal. The causal structures (Threshold vs. Probabilistic vs. Linear) are easily manipulated without changing the surface rules. It forces the "I made no difference" realization when the threshold is overshot.

  **Rejection Rationale:**
  I rejected the *Lightbulb Grid* because it lacks moral stakes; students will optimize for "winning the game" rather than wrestling with the ethics of sacrifice. I rejected the *Charity Auction* because it invites coordination and communication, which collapses the "simultaneous private choice" condition required to simulate structural ignorance. The *Threshold Pot* is the only design that allows you to control the *causal narrative* (pivotality) while keeping the *moral narrative* (sacrifice for good) constant.

  ***

  ### Part 2: Activity Design — "The Threshold Pot"

  **Materials List:**
  *   18 Index cards (pre-labeled 1–18).
  *   18 Pens.
  *   1 Envelope containing €40 cash (sealed, visible).
  *   1 Printed logo of a pre-selected charity (e.g., GiveWell top charity or local food bank).
  *   1 Smartphone with a random number generator (1–18) visible on projector or held by you.
  *   1 "Exit Pass" slip for each participant.
  *   Timer visible to all.

  **Cost & Stake Design:**
  *   **The Stake:** The €40 in the envelope will be donated to the charity *if and only if* the round's conditions are met. If not, the money returns to the society budget (no one gets it personally).
  *   **The Cost:** **Do not use heterogeneous private cost cards.** Heterogeneity muddies the water. If a student abstains, you won't know if it was due to the *inefficacy objection* or because their *private cost was too high*. To isolate the causal structure, the cost must be uniform.
  *   **The Uniform Cost:** Participants who choose to **CONTRIBUTE** must stay **5 minutes after the session** to help you file the index cards and count the money. Participants who choose **NOT TO CONTRIBUTE** leave immediately when the session ends. This is a real, tangible sacrifice of time that creates a "free-rider" temptation without introducing financial variance.

  **The Rules (Read Aloud):**
  > "We have €40 here for [Charity Name]. We are going to run three rounds. In each round, you will privately decide whether to **Contribute** or **Pass**.
  >
  > If you **Contribute**: You mark 'C' on your card. You commit to staying 5 minutes after the session to help me file these cards.
  > If you **Pass**: You mark 'P' on your card. You leave immediately at the end of the session.
  >
  > Your choice is secret. Do not show your card. Do not talk about your choice.
  >
  > The condition to release the €40 changes each round. I will read the condition *before* you choose. You must write a one-sentence reason for your choice on the back of the card *before* I collect them.
  >
  > If the condition is not met, the money is not donated. If it is met, I will transfer it immediately in front of you."

  **Timeline (90 Minutes):**

  *   **00:00 – 00:10: Setup & Framing.**
      *   Arrange tables in a circle. Place envelope in center.
      *   Read Rules. Emphasize: *Silence, Simultaneity, Private Reason.*
      *   **Crucial Instruction:** "Do not try to game this. Treat the 5 minutes as a real cost to your evening."
  *   **00:10 – 00:30: Round 1 (Visible Threshold).**
      *   **Condition:** "The €40 is donated **ONLY IF** exactly 12 people Contribute. If 11 or 13 contribute, the money is not donated."
      *   *Action:* Distribute cards. 5 mins decision/writing. Collect cards.
      *   *Reveal:* Count 'C's aloud. Announce success/failure.
      *   *Note:* This creates the "Waste" scenario. If 14 contribute, the 13th and 14th person paid the cost for *no causal impact*.
  *   **00:30 – 00:50: Round 2 (Hidden Threshold).**
      *   **Condition:** "I will roll a digital die (1–18) *after* I collect the cards. That number is the target. If Contributors >= Target, money is donated."
      *   *Action:* Distribute new cards. 5 mins decision/writing. Collect cards.
      *   *Reveal:* Count 'C's. Roll die. Announce success/failure.
      *   *Note:* This introduces *Expected Difference*. You might be pivotal, but you don't know.
  *   **00:50 – 01:10: Round 3 (Continuous).**
      *   **Condition:** "Every Contribution adds €2.50 to the donation pot (Max €40). If 16 contribute, €40 is donated. If 8 contribute, €20 is donated."
      *   *Action:* Distribute new cards. 5 mins decision/writing. Collect cards.
      *   *Reveal:* Count 'C's. Calculate total.
      *   *Note:* This guarantees *Marginal Impact*.
  *   **01:10 – 01:30: Debrief.**
      *   Collect Exit Passes (ensures cost is real).
      *   Run the debrief script below.

  **Preventing the "Prisoner's Dilemma" Reading:**
  To ensure the pull is *inefficacy* and not *sucker-avoidance*:
  1.  **No Personal Loss:** Emphasize that the €40 is for charity, not for them. They don't lose money by contributing; they only lose time.
  2.  **No "Sucker" Payoff:** In a PD, I lose if I cooperate and you defect. Here, if I contribute and the threshold fails, I lose my time, but I don't lose *relative* to others (everyone who contributed loses time). The pain is "I sacrificed for nothing," not "They benefited at my expense."
  3.  **Instruction:** Explicitly say: "Do not worry about what others do. Worry about whether *your* act matters."

  ***

  ### Part 3: The Debrief Script

  **Goal:** Map the simulation to the beef/abattoir conflict without validating either friend entirely.

  **1. The Hook (5 mins)**
  "Look at your index cards. Turn them over. Read the reason you wrote in Round 1. I want three people to read theirs aloud."
  *(Likely responses: "I didn't want to waste my time if we missed by one," "I thought 12 was too hard to hit exactly," "I wanted to help but felt stupid if I was the 13th.")*

  **2. Mapping the Structure (10 mins)**
  "In Round 1, many of you felt a specific frustration. If 14 of you contributed, the 13th and 14th person **made no actual difference**. The charity got the money because of the first 12. The extra contributions were causally inert.
  *   **Philosophical Label:** This is the **Threshold Case**.
  *   **Real World:** This is your friend's beef argument. Supermarkets order in pallets. If the order is for 1000 steaks, and we reduce demand by 1, the order stays at 1000. Your purchase made no *actual* difference to the number of cows killed.
  *   **The Trap:** If 'making a difference' is the requirement for 'moral obligation,' then the 13th person was not obligated to contribute. They sacrificed for nothing."

  **3. The Shift to Expectation (5 mins)**
  "Now look at Round 2. The threshold was hidden. Did you contribute more or less? Why?"
  *(Likely: "I thought I might be the one to tip it over.")*
  "In Round 2, you almost certainly made no *actual* difference (the die roll was likely far from the count). But you had a **chance** of making a difference.
  *   **Philosophical Label:** This is **Expected Utility**.
  *   **Real World:** We rarely know the exact threshold in reality. Is this the steak that triggers a new pallet order? We don't know. But there is a *probability*.
  *   **The Move:** Your friend invoking Parfit argues we must act on the *expectation*, not the *actual outcome*. If there's a 1% chance you save a cow, that counts."

  **4. The Continuous Case (5 mins)**
  "Round 3. How did that feel compared to Round 1?"
  *(Likely: "Clearer," "Fairer.")*
  "Here, every act added value.
  *   **Real World:** Carbon emissions are often like this. One tonne adds to the concentration. No sharp threshold, just aggregate harm.
  *   **The Conflict:** The beef debate is messy because supply chains look like Round 1 (Threshold), but aggregate demand looks like Round 3 (Continuous). The ethical disagreement is often an empirical one: *Which game are we actually playing?*"

  **5. Addressing the Bullet-Biter (5 mins)**
  "Someone might say: 'In Round 2, my chance of being pivotal was 1 in 18. That's negligible. I was right to keep my 5 minutes.'
  *   **Response:** If we all reason that way, the chance drops to zero. This is the **Generalization Argument**. If the excuse 'my chance is too small' is valid for me, it is valid for everyone. If valid for everyone, the good never happens.
  *   **Complicity:** Even if you make no difference (Round 1, 13th person), did you participate in a structure that *could* have harmed? Some argue the wrong isn't the *outcome*, but the **joining of the group** that causes harm."

  ***

  ### Part 4: Failure Modes & Fixes

  **1. The "Econ Student" Calculation**
  *   *Failure:* An economics student calculates the expected value aloud ("The probability of being pivotal is 0.05, cost is 5 mins, EV is negative"), dissolving the moral tension into math.
  *   *Fix:* Pre-brief. "I ask you to respond as a moral agent, not a game theorist. If you find yourself calculating odds, write that down as your reason, but don't announce it." In debrief, use their calculation as the *example* of the inefficacy objection to be critiqued.

  **2. Coordination/Collusion**
  *   *Failure:* Participants whisper ("Let's all do 12").
  *   *Fix:* Physical separation during decision time. "Phones face down. Eyes on your own card. If I hear talking, I void the round and we lose the €40 for that round." (Use the stake to enforce silence).

  **3. The "Bluff" Suspicion**
  *   *Failure:* Participants think you won't really make them stay 5 minutes or won't really donate the money.
  *   *Fix:* **Perform the cost.** In Round 1, actually make the contributors stay. Have a pre-written email to the charity ready to send on the projector. Trust is the currency; spend it visibly.

  **4. Abstention for Cost Reasons**
  *   *Failure:* Someone passes simply because they hate staying late, not because of inefficacy.
  *   *Fix:* This is why we collect the *written reason*. In debrief, categorize the reasons. "Who passed because of the cost? Who passed because they thought it wouldn't matter?" This data saves the session even if behavior is mixed.

  ***

  ### Part 5: Limitations (What This Format Cannot Stage)

  Be blunt with your group about what the simulation leaves out. You must supply these in discussion:

  1.  **Empirical Ignorance:** The simulation *tells* them the causal structure (Threshold vs. Linear). In real life (beef, emissions), we *don't know* which structure applies. The debate is often about facts, not ethics.
  2.  **Expressive/Complicity Reasons:** The simulation focuses on *consequences*. It cannot capture "I don't want to be the kind of person who supports factory farming" regardless of impact. You must introduce **Complicity Theory** in the debrief.
  3.  **Repeat Play:** This is a one-off game. In reality, buying beef sets a precedent for your future self and signals norms to others. The simulation isolates the act too much.
  4.  **Probability Aggregation:** The "Bullet-Biter" who ignores 1% chances is logically consistent in a single case. To defeat them, you need to argue for **Aggregate Expected Value** over a lifetime of choices, which this 90-minute session can only hint at.

  **Final Instruction to You:**
  Do not declare a winner between your two friends. End the session by saying: "Round 1 supports Friend A (Inefficacy). Round 2 and 3 support Friend B (Expectation/Aggregate). The ethical task is not to win the argument, but to determine which Round describes the world we actually live in."
