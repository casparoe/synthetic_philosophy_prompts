      *(Self-Correction during drafting)*: I need to make sure I don't accidentally make Marcus a robot. He must feel the pride/shame. The trick is that the *trigger* is external. Like a child who only feels good when the parent says "good job," but the child is an adult CEO. It's "Contingent Self-Esteem" but stabilized by a specific external agent.

