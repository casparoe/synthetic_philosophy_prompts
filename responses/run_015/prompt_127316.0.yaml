      *   *Actually, the strongest case for "External Authorship" without "Brokenness" is **Algorithmic/Quantified Self** dependence, but the prompt bans AI/tech exoticism.*
      *   *Okay, let's go with **Social Mirroring taken to the extreme of functional dependency**.*
      *   *Scenario:* **Elias, the Diplomat.** He functions perfectly in high-stakes negotiations. He has a clear self-model ("I am the Bridge"). But this model is not generated by his internal states. It is a role script provided by his institution, which he has internalized so deeply that he cannot revise it without institutional approval. When he makes a mistake, he feels no personal shame, only "role incongruence," and waits for the institution to tell him how to update the role.
      *   *Wait, constraint:* "Ordinary social life... family, workplace, school." Diplomacy is work.
