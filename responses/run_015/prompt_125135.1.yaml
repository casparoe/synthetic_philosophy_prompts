  M undergoes a gradual neuronal replacement procedure until 70% of their brain is synthetic, at which point a malfunction halts the process and leaves M in suspended animation while data streams to two labs. Lab A instantly constructs a fully synthetic brain in a clone body using the streamed data, while Lab B cultures biological neurons from M's own tissue to complete the remaining 30% in M's original body, a process requiring a one-year delay. Both successors wake with access to M's memories up to the 70% mark, but A possesses a perfect functional copy with no physical overlap, whereas B retains the original living organism but risks psychological disruption from the year-long gap and biological integration.

  **Verdicts:** Psychological Continuity Theory picks **A**, arguing the instant data transfer preserves the causal chain of consciousness better than B's year-long gap and biological noise. Bodily Continuity Theory picks **B**, as only B maintains the spatiotemporal continuity of the original living organism. Closest Continuer Theory picks **None**, because A and B are equidistant rivals: A wins on psychology, B wins on biology, and neither is uniquely "closest" overall.

  **The Single Feature:** The divergent verdicts hinge entirely on **The Asymmetry of Substrate Continuity** (instant synthetic replication vs. delayed biological growth). This single feature drives the split because it forces a trade-off: synthetic substrates allow perfect psychological fidelity but break physical continuity, while biological substrates preserve physical continuity but introduce temporal/functional gaps.

  **Removal:** If we remove this feature by making both completions synthetic (symmetric substrate), Psychological and Closest Continuer theories collapse into agreement (both face the branching problem and likely declare "neither"), while Bodily Theory still declares "neither" (no original body). If we make both biological (impossible for two survivors), the competition vanishes. The theories only diverge because the substrate asymmetry creates a tug-of-war between physical and psychological metrics.

  **Cheating Check:** B's use of original tissue does not "cheat" Bodily Continuity—it satisfies its necessary condition—but it does rig the case against Psychological Theory by conflating brain identity with body identity. If psychological states supervene on biological matter, B's new tissue might genuinely disrupt continuity, but if psychology is substrate-independent, B's biological advantage is irrelevant noise that unfairly burdens the psychological metric with biological constraints.

  **Isolation Critique:** You are likely pushing the problem around. The "70%" threshold and "one-year" gap are arbitrary confounders stacked onto the substrate difference to force the Psychological Theory to reject B. Without the time gap, Psychological Theory might claim both A and B (branching), collapsing the split. The case isolates the *conflict* between theories, but it doesn't isolate a single *variable* cleanly; it relies on the inherent correlation between biology/slowness and synthetics/speed to generate the divergence.
