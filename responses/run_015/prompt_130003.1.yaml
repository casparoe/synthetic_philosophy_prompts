prompt: |-
  hey — I'm on the grants committee of a small-ish foundation: ~30 grants a year, spread across education, public health and the arts. We meet monthly, six or so proposals a session, two hours total, and every decision needs a short written rationale that the board signs off on and that we can also send to the applicants we turn down. No analyst, no modelling, and we forget what we decided by March, so it needs to be stable across meetings.

  I want a procedure, not a lecture. Half our meetings derail the same way: someone says two proposals are "just different, you can't compare them," someone else says we obviously have to compare them, and we end up arguing about whether the money does more good in a classroom or a clinic. I've been reading a bit about incommensurable values and hard choices — the idea that some options are neither better nor worse nor equally good but on a par, and that in those cases there's nothing further to discover and what you do instead is put yourself behind one of them. Turn that into steps we can run in the room:

  - which question comes first, and what counts as a good enough answer to move on
  - how we tell apart (a) our numbers are just too crude to see a real difference, (b) we're uncertain about what will actually happen, (c) the values really don't share a common measure, and (d) the options are on a par
  - where the procedure stops with a no, and where it hands the rest back to us because it's a values call rather than a factual one
  - what the written rationale should say when there is no decisive reason, since the board won't accept "we felt like it"

  One thing I've started doing on my own that I want you to either build in or tell me is confused: I ask whether I could defend either outcome to the board three years from now. If yes, I treat it as a hard choice; if no, I assume we've framed it wrong. Call it the retrospective symmetry test if you like.

  Then run the whole thing on three cases: a literacy program vs. making a museum accessible, same price; two nearly identical public-health proposals where one scores marginally better but the other has a champion on our board; and a tiny arts organisation we all love vs. a boring, highly cost-effective health intervention. I suspect the procedure says something I don't want to hear on that last one — say it plainly. And mark clearly which steps are judgement calls dressed up as procedure.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Member of a small foundation grants committee (~30 grants/year, 3 sectors: education, public health, arts).
      *   **Constraints:** Monthly meetings, 6 proposals/session, 2 hours total. Needs written rationales for board/applicants. No analyst/modelling. Needs stability across meetings (institutional memory is poor).
      *   **Problem:** Meetings derail on "incommensurable values" arguments (classroom vs. clinic). Need to distinguish between crude numbers, uncertainty, genuine value clashes, and "on a par" choices.
      *   **Philosophical Input:** User knows about "hard choices" and "on a par" (Chang, etc.). Wants this operationalized.
      *   **Specific Input:** User uses a "Retrospective Symmetry Test" (could I defend either outcome in 3 years?). Wants this integrated or critiqued.
      *   **Deliverables:**
          1.  A step-by-step procedure (not a lecture).
          2.  Specific answers to: First question/good enough answer, distinguishing (a)-(d), stop/hand-off points, writing rationales for non-decisive reasons.
          3.  Application to three specific cases.
          4.  Plain truth on the "arts vs. boring health" case.
          5.  Clear marking of "judgement calls dressed up as procedure."

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   *The Trap:* Trying to force a single metric (QALYs, test scores) across diverse fields leads to the "classroom vs. clinic" argument.
      *   *The Solution:* A tiered filtering system. Don't compare everything against everything. Compare within buckets first, then across buckets only when necessary.
      *   *The "On a Par" Concept:* This is crucial. If two options are "on a par," rationality doesn't dictate the choice; *will* does. The procedure needs to legitimize picking one without fabricating a false reason.
      *   *The Retrospective Symmetry Test:* This is actually a test for *parity*. If both are defensible later, they are likely on a par now. I should integrate this as the "Parity Check."

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Keep it under 2 hours for 6 proposals. That's 20 mins/proposal average, but some will be quick rejects. Let's aim for a triage system.
      *   *Step 1: Eligibility/Thresholds.* (Fast filter).
      *   *Step 2: Sector-Specific Merit.* (Don't compare arts to health yet).
      *   *Step 3: The Cross-Sector Comparison.* (This is where the derailment happens).
      *   *Step 4: The Hard Choice/Parity Resolution.*

      *   *Refining the "Distinguish (a)-(d)" requirement:*
          *   (a) Crude numbers: Can we get better data quickly? If no, move on.
          *   (b) Uncertainty: Is it risk or ambiguity?
          *   (c) Incommensurable values: Different goals (beauty vs. survival).
          *   (d) On a par: Same level of merit, different kinds.
          *   *Procedure:* Need a specific diagnostic question for these.

      *   *Refining the "Written Rationale":*
          *   Board hates "felt like it."
          *   Solution: Frame it as "Strategic Prioritization" rather than "Objective Superiority." Acknowledge the strength of the rejected proposal.

      *   *Refining the "Retrospective Symmetry Test":*
          *   It's a good heuristic for parity. I'll formalize it as the "Future-Proofing Check."

  4.  **Developing the Steps (The "Protocol"):**

      *   *Phase 1: The Floor.* (Minimum viability).
      *   *Phase 2: The Ceiling.* (Maximum potential within sector).
      *   *Phase 3: The Trade-off.* (Cross-sector).
      *   *Phase 4: The Tie-Break.* (When on a par).

      *   *Addressing the "Judgement Calls":* I need to explicitly label where human discretion is unavoidable but structured.

  5.  **Running the Cases:**

      *   *Case 1: Literacy vs. Museum Accessibility.* (Different sectors, same price). Likely "On a Par." Procedure should lead to a strategic choice, not a "better/worse" claim.
      *   *Case 2: Two Health Proposals (One marginal, one champion).* (Conflict of interest/Governance issue). This isn't really about value parity; it's about governance. The procedure needs to flag the "Champion" risk.
      *   *Case 3: Tiny Arts Org vs. Boring Health Intervention.* (The "Soul vs. Math" problem). User suspects the procedure will say something they don't want to hear.
          *   *Truth:* If the foundation's mandate includes health *and* arts, and the health intervention is *highly* cost-effective while the arts org is *tiny* (low reach), the procedure should favor health *unless* the foundation has a specific strategic intent to subsidize inefficiency in the arts. If the mandate is "do good," health wins. If the mandate is "support local culture," arts wins. The procedure must force them to declare which mandate is active.

  6.  **Writing the Rationale Section:**
      *   Need templates. "We chose X not because Y was unworthy, but because..."

  7.  **Review against Constraints:**
      *   2 hours, 6 proposals. The procedure must be fast.
      *   No analyst. Keep data requirements low.
      *   Stability. The steps must be repeatable.

  8.  **Final Polish:**
      *   Tone: Direct, procedural, respectful of the philosophical depth but pragmatic.
      *   Formatting: Clear headings, bullet points, bold text for emphasis.
      *   Check: Did I answer the specific questions about (a)-(d)? Yes, embed in Step 3.
      *   Check: Did I integrate the Retrospective Symmetry Test? Yes, as the Parity Diagnostic.
      *   Check: Did I mark the "judgement calls"? Yes, use a specific icon or bracket.

      *(Self-Correction during drafting)*: I initially thought about suggesting scoring rubrics. But the user said "no modelling." Scoring often leads to false precision. Better to use "Thresholds" and "Buckets."
      *(Self-Correction on Case 2)*: The "Board Champion" issue is a governance risk, not a grants evaluation issue. I need to make sure the procedure isolates this so it doesn't corrupt the evaluation.
      *(Self-Correction on Case 3)*: Be brutal. If the health intervention is *highly* cost-effective and the arts org is *tiny*, unless the foundation has an explicit "inefficiency allowance" for arts, the procedure should reject the arts. I will state this clearly.

  9.  **Final Output Structure:**
      *   The Protocol (4 Steps).
      *   The Diagnostic Matrix (for a-d).
      *   The Rationale Templates.
      *   The Case Runs.
      *   The "Judgement Call" Warnings.

      *Let's write it.*
answer: |-
  Here is a procedure designed for your constraints: 2 hours, 6 proposals, no analysts, high need for stability and defensibility. It operationalizes the "on a par" concept to stop circular arguments.

  ### The Protocol: "Thresholds, Buckets, and Will"

  **Time Allocation:** 20 mins per proposal average.
  **Rule:** Do not compare proposals across sectors until Step 3.

  #### Step 1: The Floor (Eligibility & Viability)
  **Question:** *Does this proposal meet our minimum standards for competence and alignment?*
  **Good Enough Answer:** A binary Yes/No based on a checklist (e.g., audited accounts, clear budget, fits mission statement).
  **Action:**
  *   **No:** Reject. Rationale: "Did not meet baseline viability criteria."
  *   **Yes:** Move to Step 2.
  *   **Stop Derailment:** Do not discuss *how good* it is yet. Only discuss if it is *safe to fund*.

  #### Step 2: The Ceiling (Sector-Specific Merit)
  **Question:** *Within its own sector (Health, Education, Arts), is this proposal among the top tier of what we see?*
  **Good Enough Answer:** Consensus that it is "Funding Worthy" in isolation.
  **Action:**
  *   **No:** Reject. Rationale: "Strong baseline, but outperformed by peers in this sector."
  *   **Yes:** Mark as **Candidate**. Move to Step 3.
  *   **Note:** This prevents the "classroom vs. clinic" argument early. A bad health proposal shouldn't fight a good arts proposal.

  #### Step 3: The Trade-Off (Cross-Sector Comparison)
  *This is where you usually derail. You will only do this if you have more **Candidates** than budget allows.*

  **Question:** *Is one candidate clearly superior in terms of our strategic priorities for this cycle?*
  **Diagnostic:** Apply the **Parity Diagnostic** (see below) to distinguish (a)-(d).
  **Action:**
  *   **Clear Winner:** Fund.
  *   **No Clear Winner (Parity):** Move to Step 4.

  #### Step 4: The Will (Resolution of Parity)
  **Question:** *Since reason cannot decide, where do we choose to place our will?*
  **Tool:** The Retrospective Symmetry Test.
  **Action:**
  *   If the test confirms parity, the Chair calls for a vote. The majority choice stands.
  *   **Crucial:** The rationale must explicitly state that the rejected proposal was *worthy*, but the committee exercised strategic discretion.

  ---

  ### The Parity Diagnostic (For Step 3)

  When arguing about two **Candidates**, use this flow to categorize the disagreement. This stops the "you can't compare them" loop.

  | If the disagreement is... | The Diagnostic Question | Classification | Procedure |
  | :--- | :--- | :--- | :--- |
  | **(a) Crude Numbers** | "If we had better data, would the gap widen?" | **Information Deficit** | **Defer.** Request specific data. If unavailable in 2 weeks, treat as (d). |
  | **(b) Uncertainty** | "Is the risk about *execution* or *external factors*?" | **Risk Profile** | Compare risk tolerance. High risk/high reward vs. safe/sure. Pick one profile for the cycle. |
  | **(c) Incommensurable Values** | "Are we arguing about *means* (how) or *ends* (why)?" | **Strategic Conflict** | **Hand-off.** This is a Board-level strategy question. Committee recommends both; Board decides priority. |
  | **(d) On a Par** | "Are both outcomes defensible as the 'best' use of funds?" | **Hard Choice** | **Committee Decision.** Apply Retrospective Symmetry Test. Pick one. |

  **The Retrospective Symmetry Test (Integrated):**
  Ask: *"If we fund A, can we defend it to the Board in 3 years? If we fund B, can we defend that too?"*
  *   **If Yes to both:** They are **On a Par**. Stop looking for a factual reason. Proceed to Step 4 (Will).
  *   **If No to one:** You have not framed the choice correctly. Return to Step 2.

  ---

  ### Written Rationale Templates

  The Board and applicants need to know you didn't just flip a coin. You must distinguish between *rejection for cause* and *rejection for priority*.

  **1. For Step 1/2 Rejects (Merit-based):**
  > "While the project addresses a significant need, the committee determined that [specific criterion, e.g., budget sustainability/evaluation plan] did not meet the foundation's baseline thresholds for investment this cycle."

  **2. For Step 4 Parity Rejects (Priority-based):**
  > "This proposal was rated highly and met all criteria for funding. However, the foundation has a limited capacity for grants in this cycle. The committee made a strategic decision to prioritize [Other Sector/Specific Goal] for this period. This decision reflects a choice of focus, not a deficiency in your proposal."

  **3. For the Board (Internal):**
  > "Committee identified two proposals on a par regarding merit and impact. Per protocol, the committee exercised strategic discretion to fund [X] to align with [Cycle Priority/Portfolio Balance]. Both proposals are defensible; [Y] is recommended for reconsideration next cycle."

  ---

  ### Running the Cases

  #### Case 1: Literacy Program vs. Museum Accessibility (Same Price)
  *   **Step 1 & 2:** Both pass Floor and Ceiling. Both are Candidates.
  *   **Step 3 (Diagnostic):**
      *   Is it (a) Crude Numbers? No, outcomes are different (test scores vs. visitor access).
      *   Is it (c) Incommensurable? Yes, Education vs. Arts.
      *   Is it (d) On a Par? Apply Symmetry Test. Can you defend funding the museum in 3 years? Yes. The school? Yes.
  *   **Result:** **On a Par.**
  *   **Step 4:** Committee must choose based on *portfolio balance*. If you funded 3 health and 2 education grants already, the Museum wins on diversification. If not, it's a vote.
  *   **Rationale:** "Strategic portfolio balancing."

  #### Case 2: Two Health Proposals (One Marginal, One Board Champion)
  *   **Step 1 & 2:**
      *   Proposal A (Marginal): Passes Floor. Step 2 rating: "Low Merit."
      *   Proposal B (Champion): Passes Floor. Step 2 rating: "High Merit."
  *   **Procedure Flag:** The "Board Champion" factor is **not** a merit criterion. It is a governance risk.
  *   **Step 3:** Proposal B is clearly superior on merit. Proposal A should be rejected in Step 2.
  *   **The Trap:** If the Committee feels pressured to fund A because of the Board member.
  *   **Procedure Response:** Isolate the evaluation. If A is truly marginal, reject it in Step 2. If the Board member wants to fund it, they must do so via a "Board Discretionary Grant" outside the committee process.
  *   **Verdict:** Fund B. Reject A on merit. Do not let the Champion distort the scoring.

  #### Case 3: Tiny Arts Org (Loved) vs. Boring Health Intervention (Effective)
  *   **Step 1 & 2:** Both pass.
  *   **Step 3 (Diagnostic):**
      *   Health: High cost-effectiveness (lives saved/improved per $).
      *   Arts: Low cost-effectiveness (high $ per beneficiary), high emotional value.
      *   Symmetry Test: Can you defend funding the Arts org in 3 years? *Only if your mission explicitly values cultural preservation over utilitarian impact.*
  *   **The Plain Truth:** If your foundation's mission is "General Public Benefit," **the Health Intervention wins.** The procedure forces you to admit that funding the Arts org is a subsidy for inefficiency.
  *   **The Hard Choice:** If you fund the Arts org, you are admitting you value *beauty/local presence* over *scale/efficiency*.
  *   **Procedure Outcome:**
      *   If your mandate is utilitarian: Fund Health. Rationale to Arts: "We are prioritizing scale of impact this cycle."
      *   If your mandate includes "Cultural Vitality": Fund Arts. Rationale to Health: "We are prioritizing community cultural infrastructure over direct service."
      *   **Warning:** Do not say the Arts org has "higher impact." It doesn't. Say it has "different value."

  ---

  ### Where This Is Judgement Dressed as Procedure

  You asked for transparency. Here are the three points where the protocol relies on human judgement, not mechanics:

  1.  **Defining the "Floor" (Step 1):**
      *   *The Judgement:* What counts as "competent"? A messy budget from a grassroots org might be "incompetent" by corporate standards but "normal" for their size.
      *   *Risk:* Bias against smaller/unusual applicants.
      *   *Mitigation:* Define the Floor in writing before the meeting (e.g., "Budget variance >20% requires explanation," not "Budget must be perfect").

  2.  **The Symmetry Test (Step 4):**
      *   *The Judgement:* "Could I defend this?" is subjective. A committee member with a strong bias will always say "Yes" to their favorite.
      *   *Risk:* False Parity.
      *   *Mitigation:* Require *two* members to affirm the symmetry before invoking Step 4.

  3.  **Portfolio Balancing (Case 1):**
      *   *The Judgement:* Deciding that "we've done enough Education this year" is arbitrary.
      *   *Risk:* Penalizing a great Education proposal because you funded one in January.
      *   *Mitigation:* Set annual sector caps *before* the grant cycle opens, not during the meeting.

  ### Summary of Instructions for the Chair
  1.  **Enforce the Sequence:** Do not allow cross-sector comparison until Step 3.
  2.  **Invoke the Diagnostic:** When the argument starts, ask: "Is this an information deficit, a risk profile, or a parity issue?"
  3.  **Use the Templates:** Do not allow ad-hoc rationales for parity rejections.
  4.  **Accept the Hard Truth:** If you fund the "loved" arts org over the "boring" health one, write down that you prioritized *community sentiment* over *cost-effectiveness*. That is a valid choice, but it must be named.
