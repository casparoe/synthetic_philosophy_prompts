answer: |-
  **Exam Prompt**

  **Course:** Early Modern Philosophy of Mathematics
  **Assignment:** Take-Home Essay
  **Time Expectation:** 90 Minutes
  **Word Limit:** 1000–1200 words

  **Question:**
  Thomas Hobbes defines geometry as the only science that it has pleased God hitherto to bestow on mankind, yet he insists geometric objects are not real bodies but "phantasms" generated by mental motion. This creates a significant tension: if geometry is merely the consistent unfolding of definitions we invent, what guarantees its necessity?

  Write an essay addressing the following:
  1.  Explain how Hobbes reconciles the fictional status of geometric objects with the causal necessity of geometric reasoning. How does "mental motion" bridge the gap between nominalist definitions and universal truth?
  2.  Consider a hypothetical objection drawn from his own premises: If truth is merely consistency within a defined system, why cannot we invent a non-Euclidean geometry (e.g., where parallel lines meet) with equal claim to truth?
  3.  Would Hobbes reject such a system on logical grounds, or does his nominalism about space inadvertently permit it? Conclude by evaluating whether Hobbes's metaphysics of body and motion forces a commitment to Euclidean uniqueness.

  ***

  **Model Answer**

  For Hobbes, geometry is not the study of independent Platonic forms, nor is it mere empirical measurement. It is a science of consequences derived from definitions. However, these definitions are not arbitrary labels; they are instructions for generation. To define a line is to conceive the tracing of a point; to define a circle is to conceive a line moved around a fixed center. This constructivism is central to resolving the tension between the fictional status of objects and the necessity of truth. Geometric objects are indeed "phantasms"—they exist only in the mind—but they are not random fictions. They are phantasms of possible motion. Because the mind generates them according to the rules of motion, the properties discovered within them are necessary consequences of their generation. Truth, for Hobbes, resides in the proposition, not the object. A geometric theorem is true because the reasoning correctly reckons the consequences of the generation process, not because it matches an external reality.

  This raises the problem of alternative systems. If geometry is knowledge of consequences from definitions, and definitions are human inventions, what prevents us from defining space differently? A modern student might propose a non-Euclidean system where parallel lines converge. If truth is consistency, and this system is consistent, does it not possess equal claim to truth as Euclid's? On a purely nominalist reading, where words are merely markers for our own ideas, Hobbes seems vulnerable to this pluralism. If space is just a phantasm of existing body, and phantasms are mutable, perhaps we can phantom a curved space.

  However, Hobbes would reject this objection by appealing to his metaphysics of body. For Hobbes, space is not an independent container; it is the phantasm of a body existing in the mind. Crucially, this phantasm is constrained by the nature of body itself. Body is defined as that which is extended, solid, and movable. The axioms of Euclidean geometry are not arbitrary linguistic conventions; they are the necessary laws of how body can be conceived as moving. We cannot genuinely conceive of a body moving in a way that violates Euclidean axioms because such motion would contradict the essence of extension. To define parallel lines as meeting is not to invent a new geometry; it is to misuse names. It is like defining a "round square." The inconsistency is not merely logical but causal.

  Therefore, Hobbes does not reject non-Euclidean systems because they are logically inconsistent in a vacuum, but because they fail to map onto the causal generation of figures. A geometric definition must be generable. If a definition implies a motion that cannot be conceived without contradiction (such as a line being both straight and curved in the same respect), it is not a valid definition. The necessity of geometry stems from the necessity of motion. Since all motion occurs in space, and space is the phantasm of body, the structure of space must reflect the structure of body.

  Ultimately, Hobbes's nominalism does not open the door to geometric pluralism because his nominalism is grounded in materialism. We invent the names, but we do not invent the nature of body. The "fiction" of the geometric object is constrained by the physics of the real world. A non-Euclidean system might be a consistent game of words, but for Hobbes, it would not be *geometry*. Geometry is the science of quantity derived from the generation of bodies. Any system that divorces itself from the conditions of possible bodily motion loses its claim to scientific truth. Thus, Hobbes secures the uniqueness of Euclidean geometry not through logical absolutism, but through the metaphysical necessity of material extension. The tension is resolved: objects are mental, but the rules governing their construction are dictated by the immutable nature of body in motion.

  ***

  **Marking Scheme**

  **1. Explanation of Constructivism (4 marks)**
  *   **Requirement:** Candidate must explain that for Hobbes, geometric definitions are instructions for generation via mental motion, not descriptions of static entities.
  *   **Common Mistake:** Candidates often treat Hobbes as a Platonist who believes geometric forms exist independently of the mind.

  **2. Nominalist Status of Objects (4 marks)**
  *   **Requirement:** Candidate must articulate that geometric objects are "phantasms" or fictions, and that truth resides in propositions/reckoning rather than things.
  *   **Common Mistake:** Students frequently confuse Hobbes's nominalism with empiricism, claiming geometry is derived from sensory measurement of physical objects.

  **3. Articulation of the Tension (4 marks)**
  *   **Requirement:** Candidate must clearly state the problem: if definitions are invented, why are the consequences necessary and not just contingent conventions?
  *   **Common Mistake:** Candidates often assert the tension exists but fail to explain *why* nominalism threatens necessity (i.e., they skip the "arbitrariness" implication).

  **4. Engagement with Non-Euclidean Objection (4 marks)**
  *   **Requirement:** Candidate must apply the hypothetical objection seriously, acknowledging that consistency alone might seem to allow alternative geometries under Hobbes's definitions.
  *   **Common Mistake:** Students usually dismiss the objection anachronistically by claiming Hobbes "couldn't know" about non-Euclidean geometry rather than analyzing his premises.

  **5. Resolution via Metaphysics of Body (4 marks)**
  *   **Requirement:** Candidate must resolve the issue by citing Hobbes's materialism: geometry is constrained by the nature of body and possible motion, not just language.
  *   **Common Mistake:** Candidates often argue Hobbes rejects alternatives purely on logical grounds, ignoring the crucial role of physical causation and generability.

  \answer{20}
