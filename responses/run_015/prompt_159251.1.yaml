answer: |-
  The hotel bar was lit by emergency sconces and the glow of phone flashlights. Rae swirled the ice in their whiskey.

  "It's the same engine, Sam," Rae said. "Indicatives and counterfactuals both select worlds. The only difference is the selection criteria. At 9am, when we say, 'If the deploy didn't crash it, the power cut did,' we're holding fixed what we take for granted: the server is down, and it's either the deploy or the grid. We look at the closest worlds where the deploy is innocent. Given what we know, those are worlds where the grid failed. So the indicative flows."

  "But the counterfactual chokes," Sam said, leaning into the candlelight. "At 9am, 'If the deploy hadn't crashed it, the power cut would have' sounds wrong. We wouldn't bet on it. Then at 9:15, the logs show the power cut happened at 2:55. The UPS died at 3:00. The deploy was irrelevant. Now the counterfactual sounds perfect. But Rae, nothing changed in the server room between 9:00 and 9:15. The UPS capacity was what it was. If counterfactuals are about picking worlds based on how things actually are, why did the truth value flip just because we checked a log?"

  "Because the context changed," Rae said. "When we evaluate the counterfactual at 9am, we're operating under the assumption that a power cut is unlikely. The closest worlds where the deploy doesn't happen are worlds where the power stays on, because we think power cuts are rare. So the consequent looks false. At 9:15, we know the power cut occurred. That fact becomes part of the background fixed in the evaluation. Now the closest worlds where the deploy doesn't happen are worlds where the power cut still happens, because we know it did. The set of relevant worlds shifts with our knowledge."

  "That's just conflating evidence with truth," Sam said. "You're saying the sentence becomes true because we learned something. I'm saying the sentence was always true, because the causal setup was always there. The counterfactual is a claim about the actual machinery. The UPS was going to die regardless of the deploy. That's a fact about the world, not a fact about our information state. The reason it sounded bad at 9am is that we lacked warrant, not because the worlds were different. You're building our ignorance into the semantics."

  "And you're building a magic bridge between supposition and reality," Rae countered. "You say the indicative is just: suppose the antecedent and check your confidence in the consequent. But how do you do that? To check my confidence that the power cut caused it, supposing the deploy didn't, I have to imagine a scenario. I have to run a simulation in my head. That simulation requires me to decide which features of the actual world to keep fixed. Do I keep the power grid stable? Do I keep the UPS battery old? That's world-selection machinery. You're smuggling my semantics into your psychology."

  "No," Sam said. "Supposition is internal. It's about coherence in my belief set. If I suppose the deploy didn't happen, I minimally adjust my beliefs to accommodate that. Since I believe the server crashed, and I believe it was either deploy or power, I must believe it was power. That's why the indicative works at 9am. But the counterfactual isn't about my beliefs. It's about dispositions. It's asking: was the system disposed to fail via power cut? That disposition existed at 9am. My ignorance doesn't change the disposition. If I say 'If I hadn't dropped this glass, it would have broken because the floor was wet,' that's true even if I don't know the floor is wet. My uncertainty doesn't make the counterfactual false."

  "But you wouldn't say it," Rae pressed. "At 9am, you felt it was wrong to assert the counterfactual. If your theory is right, you were just being timid. But it feels like the meaning itself is sensitive to what we're holding fixed. Why should the indicative be hostage to what we take for granted, while the counterfactual is hostage to hidden facts? It's cleaner to say they're the same kind of object, sensitive to different contextual parameters. One fixes epistemic common ground, the other fixes causal history."

  "Because they do different jobs," Sam said. "The indicative helps us navigate what we know. The counterfactual helps us understand what things are made of. The reason the counterfactual flips at 9:15 isn't that the worlds changed, it's that we stopped guessing and started seeing. You want to make truth relative to our epistemic state. I want to keep truth anchored in the causal structure, and treat our hesitation as just hesitation. You're solving a pragmatic problem with semantic tools."

  "And you're solving a semantic problem by ignoring how we actually speak," Rae said. "If the worlds didn't change, why did the logic? At 9am, the inference felt invalid. At 9:15, it felt valid. If logic tracks truth, and truth tracks worlds, then the worlds must have shifted. Your 'causal structure' is invisible until we look at it. Mine is built out of what we're willing to hold fixed."

  Sam signaled the bartender for another round, the shadow of their hand flickering against the wall.

  "We're stuck," Sam said. "You think one mechanism tuned by context. I think two mechanisms entirely. You think knowledge changes the score. I think knowledge just lets us read it."

  "Exactly," Rae said, clinking their glass against Sam's. "And until the power comes back, neither of us is going to see the other's screen."
