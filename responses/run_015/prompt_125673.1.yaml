answer: |-
  Here are the three setups I considered before settling on the hospice case. 
  1. **The Donation:** A gives to charity because it's obligatory; B gives because she likes the tax deduction. *Discarded:* Too easy to dismiss B as selfish; hard to equalize the "moral worth" intuition without making B seem corrupt.
  2. **The Truth-Telling:** A tells the truth because lying is wrong; B tells the truth because she has a bad memory for lies. *Discarded:* Too trivial. The cost/effort isn't comparable, and B's motive feels too accidental to sustain a serious worth comparison.
  3. **The Hospice Vigil:** (Selected). High emotional stakes, clear moral requirement, and allows for a distinction between "following protocol" and "responding to need" without making either agent look defective.

  ***

  ### The Case

  It is the night shift on the palliative ward. Mr. Henderson is sundowning—agitated, hallucinating, and pulling at his IV lines. The protocol states no patient in active distress should be left unattended. Agent A sits by the bed. She finds the agitation draining and the smell of sickness difficult, but she checks the roster, recalls her commitment ("I promised to cover these shifts"), and recognizes the action as required. That recognition is what moves her; she would avow, "I am here because this is what must be done." Agent B also sits by the bed. She finds the agitation draining and the smell difficult, costing her the same subjective effort. She also believes truly that she is required to stay. But what moves her is a non-moral desire: she has a specific, deep-seated need for quiet rhythms and finds that holding a trembling hand stabilizes her own breathing. She would avow, "I am here because I need to feel the steady pulse." Neither is self-deceived; neither seeks credit; both would return tomorrow.

  ### The Analysis

  **The Tracking View (B Wins):**
  On this view (associated with philosophers like Nomy Arpaly), moral worth is a function of how well your psychological mechanism responds to the *right-making features* of the situation. The right-making feature here is Mr. Henderson's distress and need for comfort. Agent A's mechanism is keyed to the *rule* ("Protocol says stay"). Her responsiveness is indirect; she stays because of the norm, not necessarily because she is sensitive to the suffering itself (she would stay even if the rule existed but the patient was comfortable). Agent B's mechanism is keyed directly to the *physical manifestation of the need* (the trembling hand, the rhythm). Her desire is triggered by the very feature that makes the action right. Therefore, B is more robustly responsive to the moral reality, granting her higher worth.

  **The Duty View (A Wins):**
  On this view (broadly Kantian), moral worth requires acting *from* the motive of duty. The value lies in the subordination of inclination to the moral law. Agent A acts specifically because she takes the action to be required. Her will is determined by the moral fact. Agent B acts from inclination (a desire for quiet/rhythm), even if that inclination aligns with duty. For the Duty theorist, B's action has legality but not morality; it is praiseworthy that she helps, but the *moral worth* belongs to A because only A's will is properly oriented toward the moral requirement itself.

  ### The Structural Feature

  The single structural feature doing the work is **the object of responsiveness**.
  *   For **Tracking**, worth tracks the *grounding features* (the suffering/need).
  *   For **Duty**, worth tracks the *normative status* (the requirement/obligation).

  **The Deletion Test:**
  If you delete this feature—meaning, if you make both agents responsive to *both* the need and the requirement equally (a mixed-motive case where A also feels the pull of the hand, and B also consciously weighs the duty)—the verdicts collapse. Both views would then agree that both agents have high worth (or at least, the gap vanishes). The divergence exists only because we have isolated the *source* of motivation to be exclusively normative (A) versus exclusively non-moral/feature-based (B).

  ### The Attack from the Losing Side (Duty Defender)

  A defender of the Duty View would attack the Tracking verdict by arguing that B's responsiveness is **fragile**. They would say: "B stays only because the trembling hand soothes *her*. If Mr. Henderson stopped trembling but still needed vigilance, B's desire would vanish, and she might leave. A stays because it is *required*, regardless of whether the hand trembles. A's motive is robust across counterfactuals where the non-moral desire fails."

  **Is the attack good?**
  It is partially good but relies on a contingent assumption. It assumes B's desire is narrow (soothing rhythm) rather than broad (presence). However, it correctly identifies that non-moral desires can be fickle. The Tracking theorist must concede that B's worth is contingent on her psychology aligning with the good, whereas A's worth is contingent on her respect for the law. The Duty theorist claims respect for the law is the only stable ground for worth.

  ### Agent C: The Prosthetic Duty

  Agent C knows she lacks natural empathy and finds the ward repulsive. She has deliberately trained herself to consult a rule ("Check roster, sit shift") to override her indifference. She acts solely on this trained rule.

  *   **Duty View:** C is highly praiseworthy, potentially more than A. She overcomes contrary inclination. Her will is fully determined by the rule because she has no competing desire to help.
  *   **Tracking View:** C has less worth than B, and arguably less than A. Her mechanism is indirect and effortful. She is responsive to the rule, not the need. She is a "moral prosthetic" case: she functions correctly, but the mechanism is clunky and disconnected from the value itself.

  **Does this show the contrast is a red herring?**
  Yes. It reveals the debate isn't really about "Duty vs. Desire" but about **Directness of Connection to Value**.
  *   The Duty View thinks the only reliable connection to value is *via* the concept of Obligation.
  *   The Tracking View thinks the best connection to value is *via* sensitivity to the features themselves (which can be driven by desire).
  Agent C shows that "Duty" can be a crutch (Tracking says) or a triumph (Duty says). The split remains, but it clarifies that the core disagreement is about whether moral concepts are necessary mediators for worth.

  ### The Verdict

  The case works, and **the Tracking View gets it right.**

  Here is why: The Duty View suffers from the problem of "moral self-indulgence." If A is focused on her own conformity to the requirement ("I am doing the right thing"), she is partly focused on herself. B is focused entirely on the patient (via the hand/pulse), even if she describes it non-morally. Moral worth should track how much the agent is *engaged with the good*, not how much they are engaged with *the concept of the good*. B is more deeply engaged with the reality of Mr. Henderson's need. A is engaged with the protocol. In hospice care, where the work is about presence and attunement, the mechanism that keys directly into the human need (B) is morally superior to the mechanism that keys into the schedule (A), even if both result in the same sit.

  **Contested Reading Flag:**
  My verdict leans on a specific reading of the Tracking View (Arpaly/Weatherson) that allows non-moral desires to track moral value *better* than moral beliefs. A strict Kantian will deny this is possible, arguing that without the moral concept, you cannot be responding to *moral* value at all, only to natural features. I am assuming the Tracking view is correct that responsiveness to natural features (suffering) constitutes moral responsiveness. Your friend on the committee will likely press this: they will say B is just "lucky" to have that desire. You must counter that A is "lucky" to have a rule that aligns with the good, and B's luck is more tightly coupled to the patient's actual state.
