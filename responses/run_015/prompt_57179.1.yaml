answer: |-
  Having spent more years than I care to count wrestling with the Allais paradox in seminar rooms, I recognise the move immediately. It is the standard defence of the orthodox Bayesian when backed into a corner. You are describing a situation where the normative theory is treated as analytic truth, and any empirical counter-evidence is deflected by claiming the mapping from the world to the model was botched.

  You are asking for a carving of this specific argumentative manoeuvre. It sits at the intersection of decision theory, philosophy of science, and metaphysics. Let us dissect the nearest existing concepts to see which one bears the weight, and where we might need to forge a new tool.

  ### 1. The Nearest Concepts

  **Framing Effects**
  This is the most common distractor. In the literature (Tversky and Kahneman), framing refers to situations where logically equivalent descriptions of a problem lead to different choices. The standard view is that framing effects are biases—errors in rationality caused by psychological susceptibility to wording.
  *   **The Difference:** Your students are not admitting to a bias. They are not saying, "I was tricked by the wording." They are saying, "The wording was objectively incomplete." Framing assumes the underlying options *are* the same and the agent is flawed; your students argue the options *are not* the same and the description is flawed. They are claiming ontological difference, not psychological susceptibility. So, while related, 'framing' is too pejorative and psychological for this move.

  **Savage's 'Small Worlds'**
  Leonard Savage distinguished between 'small worlds' (simplified models where the axioms hold) and 'grand worlds' (complex reality). He admitted that applying expected utility theory directly to the grand world is often a mistake.
  *   **The Difference:** Usually, invoking Small Worlds is a concession that the theory *does not apply* to the case at hand. Your students are doing the reverse: they are insisting the theory *does apply*, provided we expand the small world to include the missing feature (bankruptcy risk, regret, tax). They are not limiting the scope of the theory; they are expanding the ontology of the choice to force the theory to fit. It is a 'Small Worlds' argument used to preserve universal applicability rather than limit it.

  **Popperian Immunisation (Ad Hoc Hypothesis)**
  This is the closest philosophical cousin. Karl Popper criticised theories that could not be falsified because proponents would always add auxiliary hypotheses to explain away anomalies. If a theory predicts $X$ and we observe not-$X$, the theorist says, "Ah, but you didn't account for variable $Y$."
  *   **The Difference:** In physics, this is usually considered bad science (dogmatism). In decision theory, it is more ambiguous. Sometimes adding a feature (like a penalty for risk) is a legitimate refinement of the model. The structural match is exact, but the normative status is contested. In decision theory, we often *want* to include 'regret' or 'explanation costs' in the utility function. So, calling it purely 'dogmatic immunisation' might be too harsh, though structurally it is identical.

  ### 2. The Verdict and The Label

  None of the existing terms capture the specific *normative confidence* of the move. 'Framing' implies error. 'Small Worlds' implies limited scope. 'Immunisation' implies bad science. Your students are claiming they are doing *better* modelling, not saving a failing theory.

  However, the core logical structure is indeed one of protecting the axiom from falsification by adjusting the description of the relata (the options).

  I propose we coin the term **"Axiomatic Immunisation"**.

  While it borrows from Popper, it requires a decision-theoretic specification. In this context, it is not merely adding an auxiliary hypothesis to a physical law; it is **re-individuating the outcomes** to preserve the formal structure of the choice axiom.

  **Definition:**
  *Axiomatic Immunisation* is the argumentative move wherein an apparent violation of a rational choice axiom is resolved by asserting that the initial description of the options failed to capture all normatively relevant features. By expanding the description (e.g., adding 'peace of mind' or 'bankruptcy risk' to the outcome), the choices are rendered consistent with the axiom. The axiom is treated as inviolable; the description is treated as the variable.

  ### 3. The Carving: Legitimate Modelling vs. Rescue

  The crucial question you raised is where the edge lies. When is adding an omitted feature a legitimate refinement of the model, and when is it a hollow rescue? If we allow *any* feature to be added, the theory becomes empty (the "Anything Goes" objection). If we allow *none*, we ignore genuine context.

  Here is the carving I use to separate the wheat from the chaff in my tutorials.

  **The Criterion of Independent Access**
  Axiomatic Immunisation is legitimate **only if** the 'missing feature' can be identified and measured independently of the preference it is meant to explain.

  *   **Legitimate Case (The Tax Example):** You claim the options differ because of tax years. We can check the tax code. We can calculate the net present value. The feature (tax liability) exists independently of the agent's choice. It is a causal fact about the world. Adding this to the model is legitimate modelling.
  *   **Rescue Case (The Regret Example):** You claim the options differ because one carries 'regret'. How do we measure the regret? Usually, by the fact that the agent chose the other option. If the only evidence for the existence of the 'regret cost' is the choice itself, the move is circular. You have defined the utility function to fit the choice, rather than using the utility function to predict the choice.

  **The Edge:**
  The boundary is crossed when the 'missing feature' becomes a **theoretical ghost**.
  1.  **Legitimate:** "I chose the sure thing because there was a 1% chance the bank would fail." (We can check bank stability records).
  2.  **Illegitimate:** "I chose the sure thing because the *utility* of the gamble includes a 'disappointment factor'." (If the disappointment factor is defined solely by the fact that I didn't choose the gamble, you have merely renamed the violation).

  ### 4. Why This Matters

  You mentioned the medical example with the Sure-Thing Principle. The doctor claims the test result tells her how the patient will respond, so the acts aren't the same.
  *   If she has **independent medical evidence** that the test predicts response, this is legitimate. The states of the world are genuinely different.
  *   If she is merely saying, "I feel differently about the act because of the result," without a causal mechanism linking result to response, she is engaging in Axiomatic Immunisation to avoid admitting her preferences violate the Sure-Thing Principle.

  ### Summary

  The move is **Axiomatic Immunisation**.
  It differs from **Framing** because it claims objective incompleteness rather than psychological bias.
  It differs from **Small Worlds** because it seeks to expand the model to fit the theory, rather than restrict the theory to fit the model.
  It is a form of **Popperian Immunisation**, but in decision theory, it occupies a grey zone between bad dogmatism and good model refinement.

  The line is drawn at **Independent Access**. If the student can point to the 'missing feature' without pointing to their own choice as the only proof of its existence, they are modelling. If the choice is the only evidence for the feature, they are rescuing.

  In my experience, 90% of the time, it is a rescue. But the 10% where it is legitimate modelling is why we keep the axioms in the first place—to force us to look for those missing features.
