answer: |-
  ### Brainstorming: Theory vs. The Trenches

  Your friend is mathematically correct and practically dangerous. Good's Theorem holds in a closed system where information is costless, the decision-maker is a single rational agent, and the utility function is stable. In your foundation, none of these hold. Information costs money and time (opportunity cost). You are not a single agent; you are a node in a network of trustees, ministries, and beneficiaries, each with different utility functions. And your utility function is not stable; a "null" result changes the political landscape, altering the value of the program regardless of its true efficacy.

  The "Option Value of Ignorance" is not mysticism; it is the value of *strategic ambiguity*. If you know the true effect size is low, you might be forced by your own rules to kill a program that has high political value or essential coverage. If you remain uncertain, you can fund on "plausibility." Formal decision theory treats this as irrational; institutional theory treats it as survival. A usable procedure cannot try to force your team to calculate Expected Value of Perfect Information (EVPI); they will guess numbers to justify pre-existing desires. Instead, the procedure must act as a *circuit breaker*. It needs to identify when the study is a decision tool versus when it is a political ritual. It must explicitly test for the *commitment problem*: if we learn X, are we actually allowed to do Y? If the answer is no, the information has negative value.

  The procedure must also handle the "no numbers" constraint. We cannot ask for priors. We must ask for *thresholds*. We cannot ask for statistical power. We must ask for *interpretability*. The goal is not to maximize expected utility in the abstract, but to prevent value destruction in the specific. We will drop the requirement for probabilistic updating. We will keep the requirement for decision-sensitivity. The procedure will misfire when the "decision" is actually a negotiation, not a choice, but it will catch the most expensive errors: buying information that binds your hands against your interest.

  ***

  ### The Procedure: The "Decision-Sensitivity" Checklist

  **Time limit:** 30 minutes.
  **Who:** Programme Officer (PO) + Evidence Lead.
  **Output:** Half-page recommendation.

  **Step 1: The Decision Switch (Fact Check)**
  *   **Question:** Is there *any* plausible finding from this study that would cause us to fund a programme we would otherwise reject, or reject a programme we would otherwise fund?
  *   **Sufficient Answer:** "Yes, if the effect size is below X, we stop. If above, we go." OR "No, we are funding this regardless of the result."
  *   **Stop Rule:** If **No**, stop. **Verdict: DECIDE-NOW.** (Do not commission the study. It has zero decision value.)
  *   **Note:** If the study is for "learning" or "marketing" but not for the funding decision, admit it. Do not dress it up as decision-critical.

  **Step 2: The Commitment Test (Values Check)**
  *   **Question:** If the study returns a null or negative result, do we have the authority and will to fund anyway? Will our Board, co-funders, or the press allow it?
  *   **Sufficient Answer:** "Yes, we have pre-agreed that a null result due to [reason] won't kill it." OR "No, a null result will be used to cut funding."
  *   **Stop Rule:** If **No**, and the study has a non-trivial risk of a null result (e.g., small sample, noisy context), stop. **Verdict: DECIDE-NOW** (Fund without study) or **ESCALATE** (If the constraint is external).
  *   **Note:** This is where the "Option Value of Ignorance" lives. If knowing the truth forces a suboptimal action, ignorance is an asset.

  **Step 3: The Cost-Stake Heuristic (Resource Check)**
  *   **Question:** Is the cost of the study greater than 10% of the programme grant at risk?
  *   **Sufficient Answer:** A simple ratio. (e.g., "$400k study on $4M grant = 10%").
  *   **Stop Rule:** If **Yes**, and the decision is not high-stakes (i.e., we have other similar programmes), stop. **Verdict: DECIDE-NOW.**
  *   **Note:** Unless the programme is uniquely transformative, spending >10% to validate the remaining 90% is inefficient insurance.

  **Step 4: The Perturbation Check (System Check)**
  *   **Question:** Will running this study change the conditions of the future scale-up? (e.g., Does a pilot signal scale-up to a ministry? Does measurement change staff behavior?)
  *   **Sufficient Answer:** "No, it's blind/quiet." OR "Yes, the ministry expects scale if we pilot."
  *   **Stop Rule:** If **Yes**, and the signal creates pressure we cannot meet, stop. **Verdict: ESCALATE** (To manage the signal) or **DECIDE-NOW**.

  **Step 5: The Verdict (Synthesis)**
  *   **COMMISSION:** Passed Step 1 (Switch exists), Passed Step 2 (Commitment secure), Passed Step 3 (Cost reasonable), Passed Step 4 (No perturbation).
  *   **DECIDE-NOW:** Failed Step 1 (No switch), OR Failed Step 2 (Commitment risk), OR Failed Step 3 (Too expensive).
  *   **PRE-COMMIT-FIRST:** Passed Step 1, Failed Step 2. *Condition:* We can secure a written agreement from the Board/Ministry to ignore a null result before spending on the study.
  *   **ESCALATE:** Failed Step 2 or 4 due to external constraints (Ministry/Press) that require senior negotiation before a study is safe.

  ***

  ### Theory vs. Practice: What Survives and What Breaks

  **What Survives:**
  1.  **Decision Sensitivity:** The core of VOI (Value of Information) is whether the information changes the action. This is robust and must remain.
  2.  **Cost-Benefit:** The intuition that information costs money is preserved, simplified to a ratio heuristic.

  **What Drops:**
  1.  **Probabilistic Priors:** We do not ask staff to estimate likelihoods. They will be overconfident. We ask about *thresholds* instead.
  2.  **Good's Theorem:** We explicitly reject the "free information" assumption. Information is never free; it carries political liability.

  **Where It Will Systematically Misfire:**
  1.  **The "Vanity" Study:** Staff will claim Step 1 is "Yes" (it could change our mind) when they know in their hearts it won't. *Mitigation:* The Evidence Lead must challenge this aggressively.
  2.  **The "Safe" Null:** In Case C (below), the procedure might suggest DECIDE-NOW, but the team may feel reckless funding without evidence. The procedure cannot remove the anxiety of uncertainty, only the risk of value destruction.
  3.  **The Political Black Box:** Step 2 assumes we know how the Board/Ministry will react. Sometimes they surprise us. The procedure treats political reactions as facts; they are often probabilities.

  **When Buying Information Makes You Worse Off:**
  You recognize this in advance when **Step 2 fails**. If a null result triggers a mandatory stop rule (by Ministry or Board) that you would rationally override if you had the power, the study is a poison pill. It converts your flexible discretion into a binding constraint.

  ***

  ### Application to Cases

  **Case A: The Flagship School Health Programme**
  *   **Context:** $6M programme, $1.2M study (20% cost). Priors strong ("everyone believes").
  *   **Analysis:**
      *   *Step 1 (Switch):* Unlikely. If everyone believes it works, will a null result kill it? Maybe, but would you *want* it to? If the prior is that strong, the study is for legitimacy, not decision-making.
      *   *Step 3 (Cost):* $1.2M is 20% of the grant. This violates the heuristic severely.
      *   *Step 2 (Commitment):* If the study finds null, the Board might kill a beloved programme.
  *   **Verdict:** **DECIDE-NOW**.
  *   **Plain Truth:** You will not like this. This study is vanity. It is a $1.2M marketing expense disguised as measurement. You already believe it works. Do not risk a Type I error destroying a flagship for the sake of a paper. Fund the programme, monitor implementation, skip the RCT.

  **Case B: The Unconditional Cash Top-Up**
  *   **Context:** Prior on threshold. $60k study (cheap). Could tip decision.
  *   **Analysis:**
      *   *Step 1 (Switch):* Yes. Prior is on the knife-edge.
      *   *Step 2 (Commitment):* Politically unloved, but no explicit threat to kill on null.
      *   *Step 3 (Cost):* $60k on multi-million stake is <5%. Efficient.
  *   **Verdict:** **COMMISSION**.
  *   **Plain Truth:** This is the ideal use of VOI. Low cost, high decision sensitivity, manageable political risk. Do the elicitation/data linkage.

  **Case C: The District Tutoring Programme**
  *   **Context:** Weak pilot ($ cost low, but statistical power low). Ministry says "Null = Kill." Pilot signals scale.
  *   **Analysis:**
