      *   *Depression Clause:* This makes the AD a conditional document. It essentially says "My future happy self knows better than my current depressed self." This aligns with Case 2.

  10. **Final Polish:** Structure clearly. Offer the principle, analyze the outlier, explain the 1/5 split, and discuss the depression clause as a thematic tool. (Make sure to mention Ronald Dworkin, as this is literally his framework).

