      *   *Case 3 (Vegetative + Ambiguity):* Past Self = No Vegetative State. Current Self = Ambiguous Condition. *Verdict:* Ambiguity -> Life (Honor Current/Status Quo).
      *   *Case 4 (No Daughter + Religious Conversion):* Past Self = No Daughter (due to conflict). Current Self = Converted (aligns with Daughter). *Verdict:* Honor Past (Exclude Daughter). *Note: This one feels shaky ethically compared to the others.*
      *   *Case 5 (No Pain Meds + Agony):* Past Self = No Meds (Clarity). Current Self = Agony + Request Meds. *Verdict:* Honor Current (Meds).

  3.  **Identify the Conflict (Case 1 vs. Case 5):**
      *   *Case 1:* Past preference (Death) overrides Current preference (Life/Fear).
      *   *Case 5:* Current preference (Relief) overrides Past preference (Clarity).
      *   *Why the difference?*
          *   In Case 1, the current self is *demented*. The capacity to understand death is compromised. The fear is instinctual, not necessarily a reasoned change of values.
          *   In Case 5, the current self is in *agony*. Pain compromises capacity, but relieving suffering is a fundamental medical duty (beneficence). Also, refusing pain meds for "clarity" is a preference about *quality* of consciousness, whereas asking for meds in agony is a plea to stop *torture*.
          *   *Key Distinction:* Irreversible outcome vs. Reversible comfort. Death is permanent. Pain meds are temporary.

  4.  **Develop a Coherent Principle:**
      *   *Candidate 1: Critical Interests vs. Experiential Interests (Ronald Dworkin).*
          *   Critical Interests: What makes a life good as a whole (values, legacy, dignity). Represented by the AD.
          *   Experiential Interests: What feels good/bad right now (pain, fear).
          *   *Application:* Usually, Critical Interests win (Case 1). But if honoring Critical Interests causes extreme Experiential Harm (Case 5), we mitigate the harm.
      *   *Candidate 2: Capacity and Authenticity.*
          *   Case 2: Lucid window = Capacity. Current self *is* the competent self.
          *   Case 1: Dementia = No Capacity. Current fear is a symptom, not a value.
          *   Case 5: Pain distorts capacity, but the harm (torture) is immediate and visceral.
