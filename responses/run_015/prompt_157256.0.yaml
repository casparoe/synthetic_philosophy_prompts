      *   *Critique:* This feels legally sound but ethically cold. If the *reason* for exclusion (religious conflict) no longer exists, the spirit of the AD might be voided. However, for the sake of the user's "coherent principle," this case might need to be dropped or tweaked. It complicates the "Past vs. Present" dynamic with "Surrogate Authority."

