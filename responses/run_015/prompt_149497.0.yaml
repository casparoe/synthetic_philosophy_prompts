answer: |-
  You have identified a real and distinct phenomenon. It is not merely "status quo bias" (which is a preference) nor general "cluelessness" (which is a symmetric epistemic condition). It is a specific rhetorical and decision-theoretic maneuver that weaponizes uncertainty against challengers while exempting incumbents.

  There is no single canonical term in decision theory that captures this exact *selective deployment*, but it is a composite of three well-understood mechanisms. If we need a label for the specific move you are seeing, the most precise descriptive term is **Asymmetric Epistemic Scrutiny**.

  Here is the breakdown of what is happening, the valid core versus the decoration, and where the logic stops holding water.

  ### 1. The Anatomy of the Move

  The move relies on conflating three different concepts to create a veto that feels rational but isn't.

  **A. The Valid Core: The Optimizer's Curse**
  You identified this perfectly: *"Mistakes in estimating push an option up our ranking but never down."*
  In decision theory, this is the **Optimizer's Curse** (or Winner's Curse). When you choose the option with the highest *estimated* value from a set of noisy estimates, you are systematically selecting the option with the largest positive error.
  *   **The Valid Inference:** We should discount the expected value of the "new/exciting" proposal more heavily than the "boring/incumbent" proposal because the new one's estimate is noisier.
  *   **The Limit:** This justifies a *discount*, not a *veto*. It suggests we should shrink the confidence intervals, not declare the long-term effects unknowable.

  **B. The Psychological Engine: Ambiguity Aversion**
  This is the Ellsberg Paradox applied to grantmaking. People prefer known risks (the incumbent's 18-month audit data) over unknown risks (the new proposal's modelled numbers).
  *   **The Trick:** The committee treats the incumbent's *short-term* data as a proxy for *long-term* safety. They treat the new proposal's *lack of short-term* data as proof of *long-term* danger.
  *   **The Asymmetry:** The incumbent's long-term effects are actually "unknown risks" (just like the new one), but they are cognitively categorized as "known risks" because the program feels familiar.

  **C. The Rhetorical Structure: Motte-and-Bailey**
  This is why the move feels so slippery.
  *   **The Motte (Defensible):** "We need to be careful about estimation error and uncertainty." (True, applies to both).
  *   **The Bailey (Aggressive):** "Therefore, we cannot fund the new thing because its 10-year effects are unknowable." (False, because the incumbent's are too).
  *   **The Switch:** When challenged, the speaker retreats to the Motte ("I'm just saying we need to be epistemically humble!"). When making the decision, they occupy the Bailey ("So we fund the incumbent.").

  ### 2. Naming It: Asymmetric Epistemic Scrutiny

  Since you asked for a name if nothing fits: **Asymmetric Epistemic Scrutiny**.

  **Definition:** A decision-making pattern where uncertainty about long-term consequences is invoked as a disqualifying constraint for novel options, while the identical uncertainty regarding incumbent options is treated as an acceptable background condition.

  **Alternative Label:** **Grandfathered Uncertainty.**
  The uncertainty associated with the incumbent is "grandfathered in"—it is treated as a sunk epistemic cost—whereas the uncertainty associated with the challenger is treated as a fresh liability that must be resolved before action.

  ### 3. Where the Move Stops (The Boundaries)

  You asked where this logic stops applying. The move relies on the incumbent occupying a "Reference Point" that grants it immunity. If you shift the reference point, the immunity vanishes.

  **Case 1: The Incumbent is only one year old.**
  *   **Does the move apply?** No (or very weakly).
  *   **Why:** The "track record" shield requires enough time to create an illusion of stability. A one-year program is epistemically identical to a new proposal. If a committee member deploys the "unknowable 10-year effects" argument here, they are exposing the bias nakedly. Both options are now "challengers."
  *   **The Test:** Ask: *"If we hadn't funded Program A last year, and it came in as a new application today alongside Program B, would we have the same concern about its 10-year effects?"* If the answer is yes, the asymmetry is exposed.

  **Case 2: Both options have real data behind them.**
  *   **Does the move apply?** No.
  *   **Why:** The move depends on an asymmetry of *evidence type* (Audit vs. Story). If both have audits, you are comparing data quality, not invoking metaphysical uncertainty. The argument shifts from "we can't know" to "Program A's data is better than Program B's."
  *   **The Test:** If someone still says "but we don't know the 10-year effects" when both have 5-year track records, they are no longer making an epistemic argument; they are expressing risk aversion pure and simple.

  **Case 3: The intervention is reversible (can back out in two years).**
  *   **Does the apply?** Significantly weakened.
  *   **Why:** The "unknowable 10-year effects" argument derives its power from the implied permanence of the decision. If you can pivot in two years, the "10-year" horizon is a red herring. You are making a 2-year decision with an option to renew.
  *   **The Test:** Ask: *"If we treat this as a two-year pilot with a mandatory review, does the uncertainty objection still hold?"* Usually, the objection evaporates, revealing that the real fear was not the *unknown effects*, but the *sunk cost* of switching.

  ### 4. Why It Feels Like a "Real Reason" (and partly is)

  You noted: *"I don't think it's just bias... There does seem to be a real asymmetry."*

  You are correct. The asymmetry is real, but it is **administrative**, not **epistemic**.
  *   **Administrative Asymmetry:** If the new program fails, *you* are responsible for the mistake. If the old program fails, *fate* (or the previous committee) is responsible. This is **Omission Bias**.
  *   **Epistemic Symmetry:** As you noted, the long-term causal chains are equally opaque for both.

  The move works because it translates an *administrative* fear (blame for failure) into an *epistemic* argument (we can't know the consequences). This makes the objection sound principled rather than self-protective.

  ### 5. How to Counter It in the Room

  Since you want to know which part is decoration and which is load-bearing, here is how to test it in your next meeting without accusing anyone of bias:

  1.  **Isolate the Optimizer's Curse:** "I agree we should discount the new proposal for estimation error. Let's apply a 20% uncertainty discount to its score. Does it still win?" (This accepts the valid core, removes the veto).
  2.  **Symmetrize the Cluelessness:** "We agree we don't know the 10-year effects of the new one. Do we actually *know* the 10-year effects of the incumbent, or do we just know its first 18 months? If we treat both as having unknown 10-year tails, does the ranking change?"
  3.  **Check Reversibility:** "If we fund the new one for two years and then stop, what is the actual downside risk? Is it the 10-year effects, or just the cost of the grant?"

  **Summary:** The move is **Asymmetric Epistemic Scrutiny**. It uses the valid statistical concern of the **Optimizer's Curse** to justify a **Precautionary Principle** that is applied only to the challenger. It stops working when the incumbent loses its "reference point" status (too new, reversible, or equally data-rich). The load-bearing part is the fear of responsibility for error; the decoration is the appeal to long-term unknowability.
