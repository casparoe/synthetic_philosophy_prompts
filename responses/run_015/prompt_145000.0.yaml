answer: |-
  Good morning, everyone. Thank you for being here.

  Looking around this room, I see a split that I think Spinoza would find fascinating. On one side, we have scholars who know the *Theological-Political Treatise* by heart. On the other, organizers who know what it feels like to fight for a seat at the table, even if you've never read a page of the *Ethics*.

  My goal for these opening remarks is to bridge that gap. Because Spinoza isn't just offering us a metaphysics of substance; he's offering us a mechanics of power. And specifically, a mechanics of democracy.

  Spinoza makes a bold claim: democracy is the most natural form of government. Why? Because it comes closest to the state of nature. In nature, no one is naturally subordinate to anyone else. Power is equal. Democracy preserves this equality by transferring power to the collective whole rather than a single monarch. It is the regime where the multitude rules itself.

  But here is the tension we need to sit with today. Spinoza is not a universalist in the modern sense. He argues that the democratic multitude must be composed of individuals who are *under their own power*. He explicitly excludes dependents, servants, and foreigners. His logic is that if you are economically or socially dependent on another, you cannot exercise the independent judgment required for collective freedom. You cannot be a citizen if you are a subject.

  So, Spinozist democracy isn't just about counting heads. It's about aggregating independent power to increase the rational capacity of the whole. It distinguishes between a crowd driven by passion and a multitude driven by reason.

  This brings me to a local example. I know many of you know the Student Center here. Technically, it operates by open vote. It looks like participatory democracy. But there is an administrative algorithm that weights student input by "institutional loyalty metrics."

  Is this Spinozist?

  On the surface, one might argue yes. Spinoza wants to filter out noise. He wants a multitude capable of rational decision-making, not just a raw headcount of passing impulses. Maybe the algorithm claims to be weighting for "stakeholders" who are most invested in the common good.

  But we need to look closer at what is being measured. Spinoza excludes those *not* under their own power. He wants citizens who are free. This algorithm weights votes based on *loyalty* to the institution.

  There is a crucial difference between independence and loyalty. Independence—the capacity to be under your own power—is a prerequisite for Spinozist democracy. Loyalty, when measured by an administration, is often a metric of dependence. It rewards conformity to the structure rather than the exercise of independent reason.

  If you weight votes by loyalty, you are not filtering for rational capacity; you are filtering for submission. You are incentivizing students to align their desires with the administration's survival rather than the collective freedom of the student body.

  So, I want to offer a verdict to start our discussion. This setup is not Spinozist democracy. It is monarchy disguised as consultation.

  In a Spinozist democracy, power flows from the multitude to the state to increase the freedom of all. In this weighted system, power is retained by the administration, which decides whose voice counts based on how well they fit the institution's existing shape. It treats students not as citizens under their own power, but as dependents whose access to decision-making is granted by their overseers. It uses the language of participation to mask the reality of management.

  Spinoza teaches us that democracy is unstable if the multitude is driven by passion, but it is dead if the multitude is driven by fear or obligation. A voting system that weights loyalty over independence creates obligation. It creates subjects, not citizens.

  Over the next two days, we have the philosophers who can parse the text, and the organizers who know how power actually moves on campus. I hope we use this time to figure out what it actually looks like to build a multitude that is under its own power. Not just counting heads, and not just measuring loyalty, but aggregating freedom.

  Thank you, and let's get to work.
