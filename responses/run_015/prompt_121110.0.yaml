prompt: |-
  I'm giving a seminar next thursday at the astrobiology ethics workshop defending a pretty specific claim: if we confirm microbial life in Europa's subsurface ocean, we should still proceed with targeted melting and engineered cyanobacteria seeding to build a human-supporting biosphere, treating any native microbes as replaceable substrate rather than inviolable. The room will have deep-ecology astrobiologists who think any indigenous biota has intrinsic worth, two postcolonial scholars who see this as extending extractive colonialism into space, and one utilitarian who agrees with me but says my reasoning is sloppy. I need a Q&A prep sheet: the objections they'll actually raise—not generic sci-fi stuff—ordered by how damaging they are, phrased in thier vocabulary, with a two-minute reply and a note on where that reply is softest. Include my argument sketch so they can target it: I say microbial consciousness is almost certainly absent, so only instrumental or aesthetic value is at stake, and the instrumental value of an engineered biosphere for human colonies dwarfs the aesthetic value of an untouched ice shell. What's the weakest flank? Also include the one question I'm praying nobody asks about drawing analogies to indigenous land rights on Earth, and tell me exactly what I'd have to concede up front to keep the proposal from dying in the first five minutes.
