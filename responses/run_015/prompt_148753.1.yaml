answer: |-
  Your intuitions are remarkably sophisticated. They do not map onto simple Utilitarianism (which would look only at aggregate downtime) but instead align closely with **Contractualism** (specifically the framework of T.M. Scanlon) and **Rawlsian Procedural Justice**.

  You are grappling with the distinction between *imposing a risk* on everyone versus *assigning a harm* to someone. Below is the precise formulation of the principle that captures your verdicts, an analysis of where the tension lies, and an answer to your question about consent.

  ### The Principle: Ex-Ante Fairness and Non-Targetability

  **Statement:** A system intervention is permissible if and only if the burdens it imposes are either (a) broadly shared below a threshold of severity, or (b) distributed via a procedure that is blind to morally arbitrary traits and treats all participants as equals *ex-ante* (before the event). It is impermissible to concentrate severe harm on a specific individual to benefit the group, especially if that individual is identifiable in advance.

  This principle relies on three pillars:
  1.  **The Separateness of Persons:** You cannot sacrifice one person's fundamental interests (like access) simply to aggregate small benefits for others (Cases 1 vs. 2).
  2.  **Procedural Blindness:** If harm is unavoidable, the selection mechanism must not discriminate based on arbitrary attributes like tenure (Cases 3 vs. 4).
  3.  **Epistemic Symmetry:** The moral status of an act depends on whether the authority identifies a victim *ex-ante*. Imposing a *risk* on all is permissible; designating a *victim* is not (Case 5).

  ### Mapping Your Verdicts

  | Case | Verdict | Principle Application |
  | :--- | :--- | :--- |
  | **1. Distributed Delay** | **Permissible** | **Broadly Shared Burden.** The cost (2 mins) is below the severity threshold and is identical for all. No one is used merely as a means. |
  | **2. Scapegoating** | **Impermissible** | **Concentrated Harm.** Violates *Separateness of Persons*. One user bears a catastrophic cost (permanent loss) for the trivial benefit of others. |
  | **3. Random Drop** | **Permissible** | **Procedural Blindness.** The risk is equal *ex-ante*. Every connection has the same probability. This is "pure procedural justice." |
  | **4. Targeted Drop** | **Impermissible** | **Discrimination.** Violates *Procedural Blindness*. Targeting by tenure treats new users as a sacrificial class (means to an end) rather than moral equals. |
  | **5. Foreseeable Outlier** | **Mixed** | **Epistemic Symmetry.** *Unknown:* Treated as a risk everyone shares (Permissible). *Known:* Treated as a designated sacrifice (Impermissible). |

  ### The Tension: Do You Need to Drop a Verdict?

  You asked whether you must drop a verdict for the sake of simplicity. The answer depends on whether you prioritize **outcome consistency** or **agent-relative duties**.

  **The Tension in Case 5:**
  In Case 5, the physical outcome is identical: 499 users lose 2 minutes, and 1 user loses 10 hours. The only variable is your *knowledge*.
  *   **If you prioritize Outcome Consistency:** You must align the two halves of Case 5. Since the harm is *deterministic* (it *will* happen to someone, not *might* happen), the "Unknown" verdict is philosophically fragile. Ignorance does not change the fact that one person is suffering a concentrated burden. To be logically simple, you should treat **Case 5 (Unknown)** as **Impermissible**, aligning it with Case 2. The harm is concentrated, regardless of whether you know the name of the victim.
  *   **If you prioritize Agent-Relative Duties (Recommended):** You can keep all verdicts. Moral philosophy (specifically the *Doctrine of Double Effect*) distinguishes between *foreseen side-effects* (Unknown) and *intended/accepted means* (Known). When you don't know who it is, you are maintaining a system for everyone, and the harm is a tragic side-effect. When you *do* know, you are effectively choosing *that person* to suffer to save the others. This changes the moral relationship between engineer and user.

  **Recommendation:**
  For the sake of **moral coherence** (rather than simplistic calculation), **keep all five verdicts.** Your intuition in Case 5 is not a bug; it is a feature of non-utilitarian ethics. It acknowledges that *knowing* the victim creates a specific duty of care that does not exist toward a statistical probability.

  However, if you demand **logical simplicity** regarding outcomes, you must sacrifice **Case 5 (Unknown)**. You would have to admit that if a harm is certain to occur to *someone*, deploying the patch is impermissible regardless of your knowledge, because the distribution of harm is fundamentally unequal (10 hours vs. 2 minutes).

  ### The Consent Question

  > *If all five hundred users consent in advance to a protocol that randomly assigns one of them a ten-hour maintenance window each quarter, does consent override the objection?*

  **Yes.** Consent transforms the moral structure of the problem.

  1.  **From Sacrifice to Gamble:** Without consent, the 10-hour outage is a *sacrifice imposed* on a victim. With consent, it becomes a *risk voluntarily assumed* by all participants.
  2.  **Ex-Ante Equality:** In the consent scenario, every user agrees to the same terms: "I accept a 0.2% chance of a 10-hour outage." This satisfies the **Ex-Ante Fairness** pillar. Even though the *ex-post* outcome (who actually suffers) is unequal, the *ex-ante* agreement was equal.
  3.  **Contractualist Validation:** Under Scanlon's Contractualism, a principle cannot be reasonably rejected. If users have genuinely consented to the lottery, the "victim" cannot reasonably reject the outcome, as they agreed to the rules of the game that produced it.

  **Caveat:** The consent must be meaningful. A "Take-it-or-leave-it" Terms of Service clause buried in fine print does not constitute the kind of moral consent that overrides the objection. It requires a genuine option to opt-out or a clear, negotiated agreement (e.g., a premium tier that guarantees no outages vs. a free tier that accepts the lottery).

  ### Summary

  *   **Principle:** **Ex-Ante Fairness and Non-Targetability.** (Burdens must be shared, blind, and not knowingly concentrated).
  *   **Verdicts Accommodated:** All five fit this principle if you accept that *knowledge* changes moral status (Epistemic Symmetry).
  *   **Verdict to Sacrifice for Simplicity:** If you insist that morality depends *only* on physical outcomes, you must sacrifice **Case 5 (Unknown)** and deem it impermissible (aligning it with Case 2).
  *   **Consent:** Valid consent overrides the objection by converting imposed harm into assumed risk.

  Your intuitions are ethically sound. They reject the idea that users are merely resources to be optimized (Utilitarianism) and instead treat them as rights-bearing participants in a shared system (Contractualism). You do not need to abandon them, only to articulate the framework that supports them.
