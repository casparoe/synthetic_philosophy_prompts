answer: |-
  The ice in Elias's glass had mostly melted. Sarah was still on her first bourbon, swirling it like she was trying to read the future in the dilution. The conference center was closed, the badges were off the lanyards, and the only sound was the hum of the HVAC and a dishwasher clattering in the distance.

  "You're dodging the lactase thing," Elias said. He leaned forward, elbows on the sticky table. "It's the perfect control case. Lactase non-persistence is the ancestral state. It's what mammals do. The mutation is persistence. If you don't have the mutation, your enzyme stops working. That is a biological fact. Mechanism off."

  Sarah didn't look up from her glass. "So if I move to Stockholm, I have a disease. If I move to Hanoi, I'm perfectly healthy. Same genome. Different fridge."

  "Your genome isn't changing. Your environment is mismatched with your physiology."

  "So the disease is in the mismatch," Sarah said. "Which means the disease isn't a property of the organism. It's a property of the relationship between the organism and the culture. You can't write a prescription for that without making a value judgment about which culture the patient *should* be living in."

  "That's semantic gymnastics," Elias snapped. "If my leg breaks, it's broken whether I'm in New York or the Serengeti. Lactase is the same. The gut mechanism fails to digest lactose. That's a failure of function."

  "Is it?" Sarah finally looked at him. "Or is it just a mechanism turning off on schedule? You're assuming the schedule is wrong. But the only reason it's 'wrong' is because we decided drinking cow milk after infancy is a good idea. You're smuggling in a norm about diet and calling it a mechanism."

  "Fine. Drop the lactase. It's too clean. Let's talk about the mess. Aging." Elias signaled the waiter for water. "Gerontology is banging down the door to get aging classified as a disease. You think that's just a grant grab?"

  "I think it's a funding strategy wrapped in a scientific claim," Sarah said. "If aging is a disease, insurance pays for senolytics. If it's a natural process, I pay out of pocket. But scientifically? Everyone ages. It's universal. By your definition, a disease is a deviation from species-typical functioning. Aging is the most species-typical thing there is."

  "It's a deviation from *maintenance* functioning," Elias countered. "The body is designed to repair itself. Aging is the accumulation of damage because the repair mechanisms wear out. That is literally a failure of the biological design. It's entropy winning against homeostasis."

  "Designed by whom? Evolution?" Sarah laughed, a short, dry sound. "Evolution doesn't design for longevity. It designs for reproduction. Once you've passed on your genes, evolution doesn't give a damn if your knees crumble. So if you call aging a disease, you're saying the body *ought* to last longer than evolution requires it to. That's not biology, Elias. That's a humanist wish. You're saying we *should* live longer, and you're dressing it up as a cellular defect."

  Elias opened his mouth, then closed it. He took the water from the waiter and drank half of it in one go.

  "Okay," Elias said. "That stings. But you need the biology. You can't just say 'suffering equals disease.' Otherwise, grief is a disease. Poverty is a disease. Being bullied is a disease."

  "I never said suffering equals disease. I said suffering is the *entry fee*."

  "Then give me a case where the biology is broken but nobody suffers."

  Sarah thought for a second. "Situs inversus. Organs flipped. Heart on the right. Perfectly functional. No harm. But by your 'deviation from typical' metric, it's abnormal."

  "That's a structural variant, not a dysfunction. The heart still pumps."

  "Fine. Asymptomatic hypertension. Early stage. The pressure is high. The mechanism is straining. But the patient feels fine. No damage yet. No symptoms. Is it a disease?"

  "Yes. Because the function is impaired."

  "So you're treating a number," Sarah said. "You're treating a risk factor. You're medicalizing a probability. That's where your naturalism breaks. You have to draw a line. 130 over 80 is diseased. 129 over 79 is healthy. That line isn't in the cells. It's in the actuarial tables. It's a decision about how much risk we're willing to tolerate versus how many pills we're willing to swallow."

  "Someone has to draw the line," Elias said. "Otherwise medicine is just palliative care for people already screaming."

  "Exactly. It's a policy decision." Sarah leaned in. "Now flip it. Give me a case where people are screaming, and you can't find a damn thing broken."

  Elias hesitated. "Fibromyalgia."

  "Diagnosis of exclusion," Sarah said. "Pain is real. Suffering is high. Function is impaired. But you can't find the lesion. You can't find the pathogen. To a strict naturalist, until you find the broken gear, it's not a disease. It's a 'syndrome.' A placeholder. But the patient is just as sick as the one with the tumor."

  "Absence of evidence isn't evidence of absence," Elias muttered.

  "It is if your definition of disease requires evidence of mechanism," Sarah shot back. "You want to say disease is a biological fact. But if the biology is invisible, and the harm is undeniable, you have to choose. Do you validate the harm, or do you wait for the mechanism? If you wait, you abandon the patient. If you validate, you admit that 'disease' is partly about the experience of the sufferer, not just the state of the cells."

  Elias rubbed his face. He looked tired. "The reference class problem is the real killer, though. You mentioned it earlier. Abnormal compared to who?"

  "The middle 95 percent," Sarah said.

  "Of what population?" Elias asked. "Americans are heavier, more inflamed, and more medicated than humans have ever been. If you take the current population as the reference class, obesity isn't a deviation. It's typical. If you take hunter-gatherers, almost everyone in this hotel is diseased. If you take 'ideal health,' we're all monsters."

  "So you pick a reference class," Sarah said. "Usually age and sex matched."

  "Which assumes the age-matched peers are healthy!" Elias threw his hands up. "If everyone in the 50-to-60 bracket has early arterial stiffening, is it normal or is it an epidemic? If you say it's normal, you ignore the epidemic. If you say it's disease, you're pathologizing the entire generation. That's not a biological call. That's a sociological one."

  Sarah nodded slowly. "This is where I think you're trapped, Elias. You want 'disease' to be a noun. A thing you find. I think it's a verb. It's something we *do*. We designate a state as a disease when we decide it's our job to fix it."

  "That makes it arbitrary," Elias said. "If I have a bacterial infection, it's my job to fix it regardless of whether I decide it is."

  "Measles is easy," Sarah said. "Don't use the easy cases. Use the edge. High cholesterol. Is it a disease? Or is it a risk factor that becomes a disease only when we invent a drug cheap enough to treat it en masse? Before statins, high cholesterol was a warning. After statins, it's a diagnosis. Did the biology change? No. The economics did."

  Elias was quiet for a long time. He watched the condensation on his water glass.

  "Here's where I lose you," Elias said softly. "I can accept that thresholds are fuzzy. I can accept that environment matters. But if you cut the tether to biological function entirely... if disease is just 'harm we want to fix'... then you lose the constraint. You let pharma medicalize shyness. You let society pathologize dissent. You need the biology to tell you 'no.' To say, 'There is nothing wrong with the machine, stop trying to repair it.'"

  "And you need the values to tell you 'yes,'" Sarah countered. "To say, 'The machine is working exactly as designed, but it's causing pain, so we're going to intervene anyway.' Like contraception. Biologically, fertility is function. Blocking it is 'dysfunction.' But we call it healthcare. Why? Because we value autonomy over reproduction."

  Elias looked at her. He really looked at her, not just waiting for his turn to speak.

  "Okay," he said. "Okay. You got me on the function thing."

  Sarah raised an eyebrow.

  "I keep saying 'function' like it's self-evident," Elias said. "Like the heart's function is to pump blood. But why? To keep the organism alive. Why? To reproduce. But if the patient doesn't want to reproduce, or doesn't care about living to 100... whose function are we defending? The gene's? The species'? The individual's?"

  He took a breath. "If I say aging isn't a disease because it's 'natural,' I'm privileging the species over the person. I'm saying the body belongs to evolution, not the patient. That's... that's not science. That's ideology. I can't claim naturalism if I'm making a philosophical choice about who owns the body."

  Sarah didn't smile. She didn't gloat. She just nodded. "And if I say pain is a disease without a mechanism, I risk turning every human misery into a medical bill. I risk saying there's a pill for sadness, for loneliness, for the terror of mortality. I medicalize the human condition."

  "So we're both stuck," Elias said.

  "We're both practicing," Sarah corrected. "You need the biology so you don't treat everything. I need the values so you don't treat nothing."

  "The hotel bar consensus," Elias said. "Disease is a biological dysfunction that we have collectively agreed to care about."

  "Until the budget runs out," Sarah said.

  "Or until the biology changes."

  They sat there for a moment, the definition hanging between them, useless and necessary. The dishwasher stopped clattering. The barman started wiping down the counter, a clear signal.

  "Same time tomorrow?" Sarah asked, standing up.

  "Panel on diagnostic criteria," Elias said, standing with her. "I'm moderating."

  "God help you," she said.

  "Someone has to draw the line."

  "Just don't make it too straight," Sarah said, and headed for the elevator. Elias watched her go, then turned back to the table to check if he'd left his badge. He hadn't. He picked up his glass, found it empty, and set it back down.
