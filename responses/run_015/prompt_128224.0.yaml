prompt: |-
  ok so for ethics class i wrote down my stance on moral worth and it feels shaky, so i want a consistency check before i present. heres where im at:

  (1) i think an act only has moral worth if its done for the right reason, not for praise or dopamine. saving someone for the instagram clout = basically zero worth.

  (2) i think moral luck is fake - your character cant be changed by accidents you dont control, like breaking a window while trying to help.

  (3) but i think people should train kindness as a habit so they dont have to run a mental checklist every time they see someone in need.

  (4) im also okay with social-credit-style rewards, because if points and shaming make people behave, society should care about behavior not inner motives.

  (5) i think the best kind of person is transparent in the sense that they dont have a hidden real reason behind being nice, kindness is just obvious to them.

  do these hang together? specifically, doesnt (1) crash into (3) and (5), since they both push away from conscious duty reasoning? and is (4) secretly contradicting (1) or is that just me mixing up individual evaluation with social policy? also (2) and (5) feel aligned but maybe im missing a tension there. rank the real conflicts by severity, say which belief has to bend or go for each, and flag any tension thats actually fake. i dont want a lecture on kant vs aristotle, just audit my package and tell me the cheapest fix.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User's Request:**
      *   **Goal:** Consistency check on a set of 5 ethical beliefs for an ethics class presentation.
      *   **Input:** 5 specific claims about moral worth, moral luck, habit formation, social rewards, and transparency.
      *   **Constraints:** No lectures on Kant vs. Aristotle (keep it practical), rank conflicts by severity, suggest which belief needs to bend, flag fake tensions, find the "cheapest fix."
      *   **User's Specific Concerns:**
          *   Does (1) crash into (3) and (5)? (Conscious duty vs. habit/transparency)
          *   Does (4) contradict (1)? (Individual worth vs. social policy)
          *   Are (2) and (5) aligned or tense?

  2.  **Deconstruct the 5 Claims:**
      *   (1) **Motive Purism:** Moral worth depends *only* on the right reason (intrinsic), not external rewards (praise/dopamine). *Deontological/Kantian vibe.*
      *   (2) **Anti-Moral Luck:** Character/Worth isn't affected by uncontrollable outcomes. *Kantian vibe.*
      *   (3) **Habituation:** Kindness should be habitual, not a calculated checklist every time. *Virtue Ethics/Aristotelian vibe.*
      *   (4) **Consequentialist Social Policy:** Society should use rewards/shaming to enforce behavior, regardless of motive. *Utilitarian/Behaviorist vibe.*
      *   (5) **Transparency/Integration:** The best person doesn't hide motives; kindness is "obvious" (natural). *Virtue Ethics vibe.*

  3.  **Evaluate Specific Tensions (as requested):**

      *   **Tension A: (1) vs. (3) & (5)**
          *   *Conflict:* (1) says worth comes from the *reason* (implying a conscious choice for duty). (3) & (5) say the best state is *habit/nature* where you don't think about it. If you don't think about it, are you doing it for the "right reason" or just on autopilot?
          *   *Severity:* High. This is the classic Kant (duty) vs. Aristotle (virtue) clash. If I help automatically, did I choose the moral law?
          *   *Resolution:* Need to redefine "reason." The reason can be embedded in the habit.

      *   **Tension B: (1) vs. (4)**
          *   *Conflict:* (1) says internal motive defines *moral worth*. (4) says external behavior defines *social value*.
          *   *Severity:* Low/Medium. This is a distinction between *evaluation of the soul* vs. *management of the city*.
          *   *Resolution:* Keep the domains separate. Individual morality $\neq$ Public policy.

      *   **Tension C: (2) vs. (5)**
          *   *Conflict:* (2) says outcomes don't matter. (5) says the "best person" is transparent/natural.
          *   *Severity:* Low. They actually align well. Both focus on the internal state/character rather than external results.
          *   *Resolution:* No fix needed.

      *   **Tension D: (3) vs. (4)**
          *   *Conflict:* (3) wants internal habit. (4) uses external carrots/sticks. Does external reward destroy internal habit? (Overjustification effect).
          *   *Severity:* Medium. If you train people for points (4), they might lose the ability to be kind for the right reason (1 & 3).

  4.  **Rank Conflicts by Severity:**

      1.  **(1) vs. (3)/(5):** The definition of "Right Reason." If kindness is automatic (3/5), is it still a "reason" (1)?
      2.  **(4) vs. (1)/(3):** External rewards might corrupt internal motives.
      3.  **(2) vs. (5):** Actually aligned, but needs clarification on what "transparent" means.

  5.  **Develop the "Cheapest Fix":**
      *   *Problem:* (1) sounds too rigid (conscious calculation) while (3) and (5) sound too automatic (unconscious habit).
      *   *Fix:* Refine (1). Instead of "done for the right reason" implying a *conscious thought process*, define it as "aligned with the right value, even if automatic."
      *   *Problem:* (4) threatens (1).
      *   *Fix:* Explicitly compartmentalize (4) as "Second-Best Society" vs. "Ideal Morality."

  6.  **Drafting the Response (incorporating constraints):**
      *   *Tone:* Direct, audit-style, no philosophical history lessons.
      *   *Structure:*
          1.  Verdict (Hang together?)
          2.  Ranked Conflicts (Severity + Fix).
          3.  Fake Tensions (What's actually fine).
          4.  The "Cheapest Fix" (One tweak to make it work).

      *   *Refining the (1) vs (3) analysis:* The user worries (1) crashes into (3). If I save someone on instinct (3), do I lack moral worth (1)?
          *   *Fix:* Distinguish between *origin* of the habit and *execution*. The habit was formed by right reasons originally. Or, the "reason" is constitutive of the character, not a pre-action thought.
      *   *Refining the (1) vs (4) analysis:* User suspects this is Individual vs. Policy.
          *   *Confirmation:* Yes, this is a valid distinction. "Moral Worth" (1) is for judging souls. "Social Utility" (4) is for judging systems.
      *   *Refining (2) & (5):* User thinks they align.
          *   *Confirmation:* They do. Both reject external contingency.

  7.  **Final Polish:** Check against "no lecture" rule. Keep it actionable. Ensure the "Cheapest Fix" is clear.

      *   *Self-Correction during drafting:* I need to make sure I don't just say "Kant says X." I need to say "Your definition of 'reason' is too narrow."
      *   *Focus on the "Instagram Clout" example:* If I train a habit (3), but I do it for social credit (4), does it have worth (1)? No. So (4) creates people without (1)-worth. That's a tension.
      *   *Revised Fix:* (4) is a pragmatic fallback, not an ideal. Acknowledge that (4) produces *compliance*, not *moral worth*.

  8.  **Final Output Structure:**
      *   Executive Summary.
      *   Conflict Ranking (1 to 3).
      *   Fake Tensions.
