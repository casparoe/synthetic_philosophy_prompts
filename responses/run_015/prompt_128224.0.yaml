      *   *Severity:* This is actually high. If (4) is implemented, (1) becomes impossible for the masses.
      *   *Fix:* (4) must be framed as "Damage Control" not "Moral Education."

      *   *Let's finalize the ranking.*
          1.  (1) vs (3)/(5) [Definition of Reason]
          2.  (1) vs (4) [Corruption of Motive]
