      *(Self-Correction)*: Wait, looking closer at (5). "Kindness is just obvious to them." This implies no internal struggle. (1) implies a check against "praise or dopamine." If kindness is obvious/natural, is dopamine involved? Probably. But is it the *motive*?
      *   *Key distinction:* Motive vs. Side-effect. Getting dopamine is fine if it's not the *goal*.
