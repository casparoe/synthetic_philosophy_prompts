prompt: |-
  I keep noticing a pattern in how people make decisions when the odds aren't fully spelled out, and I'm trying to figure out whether this thing has a name. It's not just risk aversion. A colleague was picking between two funds. Fund X: "historically 6% annually, SD 4%." Fund Y: "we target 6% but we're too new for historical stats." Same expected return, but he wouldn't touch Fund Y. My sister chose a vacation rental with 40 reviews over one with zero reviews and better photos. I do this too — I'll drive a known route with predictable traffic over a new one my GPS says is faster, because I don't trust the estimate. In each case the avoided option doesn't have worse odds in any calculable sense; the odds are just unknown. I've heard "uncertainty aversion" but I don't know if that's the technical term or if it's even considered distinct from risk aversion. Is there an established name for this, and more importantly, how do you carve the boundary between this and regular risk aversion? And is it considered a bias or a reasonable response to missing information?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Observation:** The user notices a pattern where people prefer known probabilities over unknown probabilities, even when the expected value seems similar.
      *   **Examples:**
          *   Fund X (known history) vs. Fund Y (new, no history).
          *   Rental A (many reviews) vs. Rental B (no reviews, better photos).
          *   Route A (known traffic) vs. Route B (GPS estimate, untrusted).
      *   **Core Question:** What is the name of this phenomenon? Is it distinct from risk aversion? Is it a bias or rational?
      *   **Specific Terminology Mentioned:** "Uncertainty aversion."
      *   **Key Distinction Needed:** Boundary between "risk" and "uncertainty."

  2.  **Identify the Core Concept:**
      *   The user is describing the **Ellsberg Paradox**.
      *   The technical term is **Ambiguity Aversion** (often used interchangeably with Uncertainty Aversion in this context, but "Ambiguity" is more precise in decision theory).
      *   The fundamental distinction is **Risk vs. Uncertainty** (Knightian Uncertainty).

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Name the Phenomenon:** Start with a direct answer. It's called **Ambiguity Aversion**. Mention the **Ellsberg Paradox** as the foundational experiment. Acknowledge "Uncertainty Aversion" is close, but "Ambiguity" is the specific technical term in behavioral economics.

      *   **Distinguish Risk vs. Uncertainty (The Boundary):** This is crucial.
          *   *Risk:* Probabilities are known (e.g., rolling a die, Fund X).
          *   *Uncertainty (Ambiguity):* Probabilities are unknown or ill-defined (e.g., Fund Y, new rental).
          *   *Reference:* Frank Knight (Knightian Uncertainty).
          *   *Why it matters:* Standard expected utility theory (rational choice) says you should treat them similarly if the *estimated* probability is the same. Humans don't.

      *   **Is it a Bias or Rational? (The Nuance):**
          *   *Traditional View (Rational Choice Theory):* It's a bias/irrational. If you believe the expected return is 6% for both, preferring one violates the Sure Thing Principle (Savage's axioms).
          *   *Modern/Ecological View:* It can be rational. Unknown probabilities often signal hidden information, incompetence, or manipulation. In the real world, "no data" often correlates with "higher chance of disaster" than a normal distribution would suggest (fat tails).
          *   *Info Asymmetry:* The fund manager knows more than you. If they don't show data, maybe it's bad.

      *   **Address the Examples:**
          *   *Fund:* Ambiguity aversion + Info Asymmetry (Akerlof's Lemons).
          *   *Rental:* Social proof vs. Unknown quality.
          *   *GPS:* Trust in algorithm vs. personal experience.

      *   **Psychological Mechanisms:**
          *   Fear of regret (if the unknown option fails, I feel stupider than if the known option fails).
          *   Competence hypothesis (people prefer bets on their own knowledge vs. chance).

  4.  **Refining the Terminology:**
      *   Make sure to clarify "Uncertainty Aversion" vs. "Ambiguity Aversion." In common parlance, they mix. In economics, "Ambiguity" is the specific term for unknown probabilities. "Knightian Uncertainty" is the state of the world. "Ambiguity Aversion" is the behavioral response.

  5.  **Structuring the Response:**
      *   **Direct Answer:** Name it (Ambiguity Aversion/Ellsberg Paradox).
      *   **The Critical Distinction:** Risk (known odds) vs. Ambiguity (unknown odds). Cite Frank Knight.
      *   **The Ellsberg Paradox:** Briefly explain the urn experiment to solidify the concept.
      *   **Bias vs. Rationality:** Discuss both sides. (Violation of Savage's Sure Thing Principle vs. Ecological Rationality/Info Asymmetry).
      *   **Why it happens:** Psychological drivers (Regret, Competence).
      *   **Conclusion:** Summary of the boundary.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Just say "Uncertainty Aversion."
      *   *Correction:* No, "Ambiguity Aversion" is the more precise term in behavioral finance/economics. I should mention both but prioritize Ambiguity.
      *   *Check:* Did I answer the "boundary" question? Yes, the boundary is known vs. unknown probabilities.
      *   *Check:* Did I answer "Bias or Reasonable"? Yes, need to present the debate between normative theory (bias) and descriptive/evolutionary theory (heuristic).

  7.  **Final Polish:** Ensure tone is informative and validates the user's observation (it's a well-documented phenomenon). (Self-correction: Make sure to mention that in the Fund example, there might be a *rational* reason regarding information asymmetry, not just psychological aversion).

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  Yes, there is a specific name for this, and you have hit on one of the most important distinctions in decision theory.

  The phenomenon is called **Ambiguity Aversion** (sometimes referred to as Uncertainty Aversion).

  The foundational experiment demonstrating this is known as the **Ellsberg Paradox**, named after Daniel Ellsberg (of Pentagon Papers fame), who published it in 1961.

  Here is the breakdown of the terminology, the boundary between risk and ambiguity, and the debate over whether it is a bias or a rational heuristic.

  ### 1. The Terminology and The Boundary
  You asked how to carve the boundary between this and regular risk aversion. In economics and decision theory, the boundary is drawn between **Risk** and **Knightian Uncertainty**.

  *   **Risk (Known Probabilities):** You don't know the *outcome*, but you know the *distribution*.
      *   *Example:* Fund X. You know the mean (6%) and the standard deviation (4%). You can calculate the probability of losing money.
      *   *Analogy:* Betting on a red card drawn from a deck you know contains 26 red and 26 black cards.
  *   **Ambiguity / Knightian Uncertainty (Unknown Probabilities):** You don't know the outcome, and you **do not know the distribution**.
      *   *Example:* Fund Y. They target 6%, but you have no data on volatility or failure rate. The probability distribution is missing.
      *   *Analogy:* Betting on a red card drawn from a deck where you are told there are 52 cards, but the ratio of red to black is unknown.

  **Risk Aversion** is preferring a guaranteed $50 over a 50/50 gamble of $100 or $0.
  **Ambiguity Aversion** is preferring a 50/50 gamble of $100 or $0 over a gamble where the odds are unknown (even if you suspect the odds are roughly 50/50).

  ### 2. The Ellsberg Paradox
  To prove this wasn't just random noise, Ellsberg set up a choice involving two urns:
  *   **Urn A:** Contains 50 red balls and 50 black balls.
  *   **Urn B:** Contains 100 balls, but the ratio of red to black is unknown.

  People are asked to bet on drawing a red ball. Most choose Urn A.
  Then, people are asked to bet on drawing a *black* ball. Most still choose Urn A.

  **This is mathematically inconsistent.** If you prefer Urn A for red, you must believe Urn B has *fewer* red balls (meaning more black balls). Therefore, logically, you should prefer Urn B when betting on black. But people prefer Urn A in both cases. They prefer the **known risk** over the **unknown ambiguity**, regardless of the specific bet.

  ### 3. Is it a Bias or a Reasonable Response?
  This is where it gets interesting. The answer depends on whether you view human decision-making through the lens of **Normative Theory** (how a robot *should* decide) or **Ecological Rationality** (how a human *survives*).

  #### The Argument for "Bias" (Normative View)
  In standard Expected Utility Theory (specifically Savage's Sure Thing Principle), ambiguity aversion is considered **irrational**.
  *   **The Logic:** To make a decision, your brain implicitly assigns a probability to the unknown option anyway. If you think Fund Y has a 50% chance of beating Fund X, you should calculate the expected value and act.
  *   **The Verdict:** Preferring the known option simply because the probabilities are explicit violates the axioms of rational choice. It suggests your preference is influenced by the *source* of the probability, not the probability itself.

  #### The Argument for "Rational Heuristic" (Ecological View)
  In the real world, ambiguity aversion is often a **highly adaptive survival mechanism**.
  *   **Information Asymmetry (The "Lemons" Problem):** In your Fund Y example, why is the data missing? Usually, because the agent (the fund manager) has information the principal (you) does not. If the fund were performing well, they would show the data. The absence of data is itself data. In this context, avoiding Fund Y is rational risk management, not psychological bias.
  *   **Fat Tails and Black Swans:** Known distributions (Risk) usually assume a normal bell curve. Unknown distributions (Ambiguity) often hide "fat tails"—low probability, catastrophic events that standard models miss. Avoiding ambiguity protects you from model error.
  *   **Competence Hypothesis:** People feel less regret if they lose on a known risk ("It was just bad luck") than on an unknown ambiguity ("I was stupid to trust that new fund"). Avoiding ambiguity minimizes anticipated regret.

  ### 4. Summary of Your Examples
  *   **The Funds:** This is Ambiguity Aversion compounded by **Information Asymmetry**. Your colleague assumes the lack of history signals hidden risk (rational) but might also feel psychological discomfort with the unknown (bias).
  *   **The Vacation Rental:** This is Ambiguity Aversion. The "zero review" rental has an unknown probability of being a scam or a dump. The cost of finding out (ruined vacation) is high, so paying a premium for "known risk" (40 reviews) is a rational insurance purchase.
  *   **The GPS Route:** This is **Trust vs. Control**. You trust your own empirical experience (known risk) more than the algorithm's black-box estimate (ambiguity). If the GPS is wrong, you feel foolish. If your known route is bad, it's just "traffic."

  ### Conclusion
  The technical term is **Ambiguity Aversion**.

  The boundary is **Known Probabilities (Risk)** vs. **Unknown Probabilities (Ambiguity)**.

  Is it a bias? **Formally, yes.** It violates strict mathematical consistency in decision theory. **Practically, no.** In a world where information is often withheld to hide defects, and where unknown distributions often hide catastrophic tail risks, ambiguity aversion is a robust heuristic that keeps you out of trouble.

  Your colleague, your sister, and you are behaving in a way that is mathematically "flawed" but evolutionarily and economically prudent.
