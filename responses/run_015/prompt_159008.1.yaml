  The aggregate conversion rate is a weighted average of subgroup rates. Specifically, the total rate equals the sum of each group's proportion multiplied by its rate. The paradox occurs when the treatment variant inadvertently receives a different mix of groups than the control. Suppose Mobile converts lower than Desktop. If Variant B accidentally gets 80% Mobile users while Variant A gets 50%, Variant B's overall average gets dragged down by the high proportion of low-converting users, even if B performs better within both Mobile and Desktop.

