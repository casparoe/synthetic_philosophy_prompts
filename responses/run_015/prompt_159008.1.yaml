  Simpson's Paradox is an arithmetic inevitability caused by unequal weighting, not a statistical glitch. When group sizes differ between treatment and control, the overall average is a weighted sum where the weights themselves are biased. In randomized trials, flips arise not from confounding but from conditioning on variables the treatment influenced. A universal reversal—where Variant A wins every subgroup but loses overall—is arithmetically impossible for conversion rates; if A wins everywhere, it must win overall. The solution isn't finding the "true" partition but defining the population you intend to serve. Adjusting for confounders fixes selection bias; adjusting for mediators creates it. Your decision depends on whether the current traffic mix matches your future strategy, not on which slice looks best.

