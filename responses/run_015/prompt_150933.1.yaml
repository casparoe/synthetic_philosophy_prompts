answer: |-
  The TechStart office has only two conference rooms for fifty employees, creating chronic scarcity. To prevent hoarding, the employee handbook states: "Conference rooms may be reserved for maximum intervals of 60 minutes." Mark needs a room for a two-hour workshop. He books Room A from 9:00 to 10:00 AM, checks out at 10:00 AM, and immediately books it again from 10:00 to 11:00 AM. The office manager cites him for violating the policy, arguing that his consecutive bookings undermine the ban on hoarding, while Mark insists he followed the written rule.

  **Check:**
  *   **Textualism:** Mark complies. The text regulates "intervals" (plural), and each discrete reservation is exactly 60 minutes. The plain meaning distinguishes between one long interval and two short ones.
  *   **Purposivism:** Mark violates. The stated purpose is to "prevent hoarding" amidst scarcity. Allowing consecutive bookings renders the limit meaningless, as any employee could monopolize the room indefinitely by fragmenting their request.
  *   **Feature Doing the Work:** **Under-inclusion.** The text regulates the *unit* of time (the interval) but fails to regulate the *aggregate* of time (consecutive use), creating a loophole that defeats the goal.
  *   **If Removed:** If the rule read "maximum intervals of 60 minutes per day," the textualist would also catch Mark, as the aggregate is now textually bounded.
  *   **Strongest Textualist Reply:** Rule-of-law values require notice and reliance. Employees organize their workflows based on clear, written constraints; if management intended to ban consecutive bookings, they had the authority to write "per day" or "consecutive." It is not the interpreter's role to fix drafting errors by rewriting clear text, as doing so undermines predictability and invites arbitrary enforcement based on subjective views of "hoarding."
