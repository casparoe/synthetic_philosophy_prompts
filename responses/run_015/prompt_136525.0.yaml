  1.  **Analyze the User and Request:**
      *   **User Profile:** Runs a local tool-library and repair coop. Not a philosopher. Practical, systems-oriented mindset (shared resources, voluntary labor, maintenance debt).
      *   **Topic:** Supererogation (acts that are good but not required; "above and beyond").
      *   **Task:** Restate the philosophical debate about supererogation using the user's vocabulary (maintenance vs. upgrades, obligation vs. gift, burnout vs. surplus).
      *   **Key Questions to Address:**
          *   What translates cleanly?
          *   What gets twisted or disappears?
          *   Does the "above and beyond" gap survive in cooperative labor, or is it a contract artifact?
          *   If something doesn't survive, is it the user's framework or the philosophers' over-commitment to a split?
      *   **Constraints:** Grounded tone, no name-dropping unless necessary, no reading list. Validate the user's intuition about voluntary contribution being a different *kind* of thing.

  2.  **Deconstruct Supererogation:**
      *   *Standard Definition:* Acts that are morally good to do, but not morally wrong to omit. (e.g., jumping on a grenade, donating a kidney).
      *   *The Problem:* If morality is about maximizing good (Utilitarianism), why isn't everything good *required*? If morality is about rules (Deontology), where do extra-good acts fit?
      *   *The "Gap":* The space between Duty and Heroism.

  3.  **Map to User's Vocabulary (Tool Library/Repair Coop):**
      *   *Duty/Requirement:* Required maintenance. Keeping the lights on, safety checks, returning borrowed tools. If you don't do this, the system breaks (moral failure).
      *   *Supererogation:* Voluntary upgrades. Cleaning the workbench when it's not your shift, fixing a tool nobody claimed, mentoring a new member extra hours. If you don't do this, the system survives but doesn't thrive.
      *   *Obligation:* Collective obligation (membership dues, shift work).
      *   *Gift:* Personal gift (extra labor, emotional labor).
      *   *Burnout:* The risk of treating upgrades as maintenance.
      *   *Surplus Capacity:* The energy available for supererogatory acts.

  4.  **Drafting the Translation (Iterative Process):**

      *   *Translation 1 (The Clean Fit):* The distinction between "keeping the shop open" (Duty) and "making the shop amazing" (Supererogatory) works well. It maps to "Minimum Viable Coop" vs. "Thriving Community."
      *   *Translation 2 (The Twist):* In a coop, roles are fluid. Who defines what is "required"? In philosophy, God/Society/Reason defines duty. In a coop, the members do. If everyone agrees "cleaning the floor is everyone's job," then it shifts from supererogatory to obligatory. This challenges the stability of the category.
      *   *Translation 3 (The Disappearance):* The "Hero" aspect. Philosophy often looks at one-off heroic acts (saving a life). Coop labor is repetitive, mundane maintenance. Supererogation in a coop isn't usually dramatic; it's quiet care.
      *   *The "Gap" Question:* Is the gap real? In a coop, if you rely too much on "voluntary upgrades," the system becomes fragile (dependent on heroes). If you mandate everything, people burn out. The gap is necessary for sustainability, not just moral categorization.

  5.  **Addressing the Core Philosophical Tension:**
