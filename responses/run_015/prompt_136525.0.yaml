prompt: |-
  hey so i'm trying to wrap my head around supererogation — the idea that some good deeds are basically 'above and beyond' what's actually required of you. i'm not a philospher, but i run a local tool-library and repair coop, so my mental model is all about shared resources, voluntary labor, maintainance debt, and the line between 'this has to get done or the system breaks' versus 'this is nice but nobody's contract says so.'

  restaste the debate about supererogation in that vocabulary: required maintainance vs voluntary upgrades, collective obligation vs personal gift, burnout risk vs surplus capacity. be honest about what translates cleanly, what gets twisted, and what just disappears — especially the part where philosophers argue whether supererogatory acts are genuinely *not required* or whether our duty-sets are just fuzzier than we think. does the 'above and beyond' gap survive when you map it onto cooperative labor, or is it an artifact of thinking about morality like a contract? and if something doesn't survive the translation, is that because my framework is missing something, or because the philosphers are over-committing to a clean duty/heroism split?

  keep it grounded, don't cite anyone by name unless you have to, and don't give me a reading list — i just want to see if my gut intuition about voluntary contribution being a different *kind* of thing than required upkeep actually holds water philosophically.
reasoning: |-
