      *   *Coop View:* If I call extra work "required," I risk excluding people who can't give that much (ability/access). If I call it "optional," it might not get done.
      *   *Verdict:* The user's intuition holds water. The "different kind of thing" is about *agency* and *sustainability*, not just moral weight.

