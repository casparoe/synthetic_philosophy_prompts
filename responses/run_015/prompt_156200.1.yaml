answer: |-
  The common intuition suggests that legend hardens into history as evidence accumulates. This is backwards. We do not accept these narratives because the proof finally became sufficient; we accept them because the story became too useful to discard. The line between myth and history is not drawn by archaeologists, but by sociologists. It is crossed when a narrative becomes what might be termed an 'underdetermined substrate': specific enough to hold an identity together, yet too vague to be actually falsified.

  Consider the Trojan War. Heinrich Schliemann did not find Helen of Troy; he found ash layers and fortifications. The empirical data suggests a conflict occurred, but it does not validate the *Iliad*. The narrative persists not because we have verified Achilles' heel, but because the war serves as a foundational substrate for Western civilisation. It anchors the concept of Europe versus Asia, of honour and fate. To demand strict verification is to miss the point; the story functions as history because it provides a shared cultural vocabulary, not because the body count is accurate.

  King Arthur offers a starker example. Was he a Roman officer? A Saxon fighter? A pure myth? The rival versions are plentiful, yet they have been smoothed away over centuries. Geoffrey of Monmouth's embellishments were not accepted because they were evidenced, but because they were socially useful. A unified Britain required a unified hero. The details are underdetermined—we cannot falsify the Round Table because it exists in the realm of idealised governance rather than carpentry. Arthur became 'history' when contesting his existence became more damaging to national cohesion than accepting the legend.

  The Exodus follows the same trajectory. Archaeological evidence for a mass migration is scant, arguably non-existent. Yet, to relegate the Exodus to mere folklore is to undermine the structural integrity of Jewish identity and law. The narrative is specific enough to define a people ('those who were freed from Egypt') but vague enough to withstand geological scrutiny (where exactly did the waters part?). It remains 'history' because it functions as cultural infrastructure. It is the bedrock upon which morality and lineage are built.

  Therefore, we must defend the stronger claim: 'history' in these cases is merely a label we stick on a legend once it stops being contested. It is not a certification of truth, but a certification of utility. When a story ceases to be a matter of debate and starts functioning as the load-bearing wall of a culture, we grant it the honourific of history. We do not discover the history in the legend; we appoint the legend to the office of history because we require the stability it provides. The evidence is incidental; the infrastructure is essential.
