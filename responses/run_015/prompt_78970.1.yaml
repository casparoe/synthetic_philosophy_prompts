      *   If you keep (8) and (3), you are vulnerable to the Lottery Paradox regarding accuracy.
      *   *Decision:* The Diachronic tension is the "load-bearing wall." If (6) stands, (4) falls. If (4) falls, the "rationality" part of the seminar topic (which usually implies norms for reasoning/updating) is gutted.
      *   *Wait, looking closer at (6):* "how a time-slice should defer to or constrain later time-slices strikes me as either reducible to (1)-(5)..."
