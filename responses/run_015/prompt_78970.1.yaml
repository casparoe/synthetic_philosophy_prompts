      2.  **Rule-Invariance:** Norms must hold across *all* strictly proper scoring rules (Brier, Log, etc.).
      3.  **Probabilism (Accuracy-Justified):** Probabilism is required, justified by accuracy (not Dutch Book).
      4.  **Conditionalization (Expected Accuracy):** Updating by Conditionalization maximizes expected accuracy.
      5.  **Immodesty:** Rational states must think themselves optimal (key engine for 3 & 4).
