  4.  **Detailed Pairwise Audit:**

      *   **Tension A: (2) Rule-Invariance vs. (3) Probabilism & (4) Conditionalization.**
          *   *Issue:* Joyce's argument for Probabilism works for *any* strictly proper rule. Greaves & Wallace's argument for Conditionalization works for *any* strictly proper rule *if* you measure accuracy of the update plan.
          *   *Conflict:* Is there a conflict here? Generally, accuracy-firsters *want* invariance. However, some specific accuracy arguments (especially regarding *propriety* itself or specific dominance arguments) might rely on mathematical properties not shared by *all* proper rules (e.g., differentiability).
