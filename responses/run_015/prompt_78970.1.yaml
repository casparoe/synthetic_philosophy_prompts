answer: |-
  Here is the audit. You asked for non-diplomatic, so here it is: Your position is not a demolition site; it is a building where the second floor (Dynamics) is floating in mid-air because you removed the supports (Plans), and the foundation (Belief) is cracking under the weight of the structure (Veritism).

  Here is the ranking of tensions by severity, the diagnosis, and the repair costs.

  ### 1. The Fatal Structural Clash: (4) Conditionalization vs. (6) Time-Slice Epistemology
  **Severity:** Critical. This renders your dynamic norms unjustified.
  **The Conflict:** You claim Conditionalization is required because it maximizes expected accuracy (4). You simultaneously claim rationality has no plan-level component and evaluates only time-slice states (6).
  **Why it breaks:** The Greaves-Wallace expected-accuracy argument for Conditionalization *is* a plan-level argument. It proves that *adopting a policy* of conditionalizing maximizes expected accuracy. It does not prove that a specific time-slice state is irrational if it didn't conditionalize, nor does it prove you should conditionalize if you evaluate only the *current* state's accuracy.
  If you strictly enforce (6)—that a time-slice is rational *just in case* its current credence function maximizes expected accuracy—you lose the ability to mandate *updating rules*. A time-slice maximizer only cares about being accurate *now*. It has no intrinsic reason to care about how it got there or how it will change, unless you allow the time-slice to evaluate *future policies*. But you explicitly reject "plan-level components" in (6).
  **The Repair:** You must amend (6). You need to accept that a time-slice can rationally evaluate *diachronic policies* (update rules) from its current perspective. This is not an "irreducibly diachronic norm" (which would say $t_2$ judges $t_1$); it is a synchronic norm that takes a diachronic object (a plan) as its input.
  **The Cost:** You give up "Pure Time-Slice Epistemology." You have to admit that rationality constrains *changes*, not just *states*. This opens you to objections about "ratifiability" and "self-undermining policies," but it saves Conditionalization.

  ### 2. The Foundational Crack: (1) Veritism vs. (7) Binary Belief vs. (8) Threshold View
  **Severity:** High. This makes you vulnerable to the Lottery/Preface Paradox on your own terms.
  **The Conflict:** You say accuracy is the *only* epistemic good (1). You say binary beliefs are scoreable for accuracy (7). You say belief is just credence > 0.9 (8).
  **Why it breaks:** In a standard Preface scenario, you believe $P_1...P_{100}$ (each 0.95 confident). By (8), you believe each. By (3) Probabilism, your credence in the conjunction $\wedge P_i$ is $\approx 0.006$. So you disbelieve the conjunction.
  If binary beliefs are scoreable for accuracy (7), we must ask: Is your *belief set* accurate? If accuracy is truth-directed (1), holding a set of beliefs that you know (probabilistically) contains a falsehood is accuracy-suboptimal. If the "score" of your belief state is the sum of the scores of individual beliefs, you maximize score by believing all. If the "score" includes logical coherence or the truth of the conjunction, you maximize score by withholding.
  Your view forces you to say that it is epistemically *good* (accuracy-maximizing) to hold a belief set that is likely false. This contradicts (1). You claim the Preface isn't a paradox, but on an accuracy-first view, it is a direct violation of the goal of accuracy if the unit of scoring is the belief system.
  **The Repair:** You must restrict (7). Claim that accuracy scoring applies primarily to *credences*, and binary beliefs are merely heuristic derivatives that are not themselves directly subject to the "only good" constraint of (1), or deny that conjunctive accuracy matters.
  **The Cost:** You weaken the claim that "accuracy-first has no trouble accommodating belief." You have to admit that binary belief is a second-class citizen in your ontology, or that the "accuracy" of belief is not truth-directed in the same way credence is.

  ### 3. The Apparent Clash: (2) Rule-Invariance vs. (3) Probabilism
  **Severity:** Low. This is actually your strongest link.
  **The Conflict:** You worry that different proper scoring rules might yield different norms.
  **Why it doesn't break:** Joyce's (1998/2009) dominance arguments for Probabilism hold for *any* continuous, strictly proper scoring rule. As long as you stick to the class of strictly proper rules, Probabilism is invariant.
  **The Caveat:** This only holds if you assume the scoring rule is *continuous*. Some proper rules are not. If you encounter a discontinuous proper rule, the dominance argument might fail.
  **The Repair:** Add "continuous" to your definition of the class of scoring rules in (2).
  **The Cost:** Negligible. No one uses discontinuous scoring rules for this purpose.

  ### 4. The Hidden Tension: (5) Immodesty vs. (6) Time-Slice
  **Severity:** Medium. Linked to Conflict #1.
  **The Conflict:** Immodesty requires a state to judge *other possible states* as less accurate. If you are a pure time-slicer (6), you judge states by their *actual* accuracy relative to the world, not by their *expected* accuracy relative to the agent.
  **Why it breaks:** To get Immodesty to do the work you want (justifying Conditionalization), you need the agent to evaluate *expected* accuracy. But if rationality is just "maximizing accuracy" (as 6 implies by saying "maximises expected accuracy under a... rule"), you need to specify *whose* expectation. If it's the agent's expectation, you are back to evaluating plans/policies (see Conflict #1).
  **The Repair:** Clarify that Immodesty is a constraint on *rational endorsement*, not just a feature of the world.
  **The Cost:** Further erosion of the "Time-Slice" label.

  ---

  ### The Single Revision That Cleans Up the Most Mess

  **Change Commitment (6).**

  **Current:** "I don't think rationality has any irreducibly diachronic or plan-level component: a time-slice is rational just in case its credence function maximises expected accuracy... full stop."

  **Revision:** "Rationality is fundamentally synchronic, but a time-slice is rational only if its credence function and its **accepted update policy** jointly maximize expected accuracy from the perspective of that time-slice."

  **Why this is the load-bearing wall:**
  1.  **Saves Conditionalization:** It allows you to run the Greaves-Wallace argument without contradiction. You can demand Conditionalization because the *current* time-slice endorses that *policy*.
  2.  **Saves Immodesty:** It gives Immodesty something to grip (the policy).
  3.  **Preserves Accuracy-First:** You aren't smuggling in pragmatic norms; you are still maximizing expected accuracy, just expanding the object of evaluation from a "point" to a "vector."
  4.  **Mitigates the Belief Issue:** If you evaluate policies, you can argue that a policy of "Threshold Belief" is accuracy-optimal for bounded agents, even if it leads to conjunction errors. This gives you a pragmatic-ish escape hatch for the Preface Paradox without abandoning Veritism.

  **What you give up:**
  You lose the hardline "Time-Slice" label that is popular in some current metaphysics of rationality. You have to admit that rationality is about *managing* your epistemic life over time, not just having the right snapshot. In a seminar on *rationality* (which implies reasoning/process), this is a concession you should make anyway.

  **Final Advice:**
  Your friend called it a demolition site because (6) pulls the rug out from under (4). If you walk into the seminar claiming (4) and (6) simultaneously, a formal epistemologist will eat you alive in the Q&A. Fix (6), soften the claims about Binary Belief accuracy (7) to avoid the Lottery Paradox trap, and keep (2) and (3) as your core strength.
