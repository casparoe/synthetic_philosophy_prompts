      *   **Tension C: (7) Binary Belief Accuracy vs. (8) Threshold View vs. (3) Probabilism.**
          *   *Issue:* The Lottery Paradox / Preface Paradox.
          *   *Scenario:* I have 100 beliefs, each with credence 0.95. Threshold is 0.9. I believe all 100. Probabilism says $P(\text{all true}) = 0.95^{100} \approx 0.006$.
