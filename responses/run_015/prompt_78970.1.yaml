  10. **Final Polish:** Ensure the distinction between "synchronic evaluation of a diachronic plan" (allowed) vs "irreducibly diachronic norms" (rejected by user) is clear. The user rejects "plan-level components." That is the error. Greaves/Wallace *is* a plan-level argument.

