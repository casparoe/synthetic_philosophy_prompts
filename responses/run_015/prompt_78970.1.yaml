  5.  **Synthesizing the Conflicts:**

      *   **Conflict 1: The Diachronic Collapse (4 vs 6).**
          *   You cannot derive Conditionalization (a rule for change) from a theory that says only static states matter (6). Greaves & Wallace save this by evaluating *policies*. You explicitly reject policies ("no irreducibly diachronic or plan-level component").
          *   *Result:* You lose Conditionalization. You become a "Permissivist" about updating, or you have to admit diachronic norms.
