      *   *Greaves & Wallace (2006)* argue for Conditionalization via expected accuracy.
      *   *Leitgeb/Pettigrew* work on norms for belief.
      *   *The Lockean Thesis (Threshold)* vs. *Probabilism* is the classic "Lottery/Paradox" problem.
      *   *Rule Invariance* is a very strong constraint. Many accuracy arguments depend on specific properties of scoring rules (e.g., differentiability, convexity).
      *   *Time-Slice* vs. *Conditionalization*: If rationality is purely synchronic, why care about how you update? Greaves/Wallace handle this via "plan conditionalization," but the user rejects plan-level components (6).
