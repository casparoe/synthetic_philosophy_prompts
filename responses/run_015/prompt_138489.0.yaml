  Use the headache app case. It must lack downstream behavioral consequences (no flinching, no medication seeking) to satisfy the epiphenomenalist constraint. It must lack independent verification (no nociceptor reading) to block the common-sense check. The flinch case fails because motor output suggests causal power. The locked-in case fails because it introduces complex communication channels that distract from the immediate judgment-experience link. The app case isolates the report as a pure output with no functional role, mirroring the theory's claim. It forces students to confront the isolation of the phenomenology. Crucially, the "no independent measure" constraint prevents students from cheating by appealing to neural correlates as proxies for the pain itself.

  Misconceptions and where to head each off
  Head off "Spooky Dualism" and "Consciousness isn't real" in the intro. Address "Evolution couldn't produce it" immediately after defining the view; explain epiphenomenalism accepts the correlation, not the utility. During the Explanatory Prong, block "Neural vehicle identity" (that's physicalism, not epiphenomenalism) and "Causal exclusion" (distinct problem). During the Epistemic Prong, address "Self-refuting" (it's the paradox, not a dismissal) and "Scanner/No-report" (scanners measure physical correlates, not the phenomenal causal link). Don't treat self-refutation as a misconception to dismiss; treat it as the core tension. The scanner misconception is critical: neuro data cannot bridge the causal gap. Students often think fMRI solves philosophy; show them the scanner sees the neural cause, not the phenomenal efficacy. Finally, clarify that epiphenomenalism isn't substance dualism; it's compatible with physical substances, just denying causal efficacy to properties. Also, warn them that "no-report" paradigms don't help; removing the report doesn't solve the causal isolation of the experience itself. The evolution objection is often the hardest for CogSci students; emphasize that epiphenomenalism posits consciousness as a byproduct, like the shadow of a runner, not a muscle. Causal exclusion is often confused with this; clarify that exclusion argues there's no room for mental causation, while epiphenomenalism accepts there's no room and denies the causation.

  The check
  Ask them to design an experiment distinguishing epiphenomenalism from common-cause physicalism using only third-person data. When they realize they can't, they've grasped the paradox. If they suggest a scanner, ask how the scanner detects the phenomenal causation specifically. This forces them to see the empirical equivalence. It moves them from memorizing the argument to feeling the methodological deadlock.

  Deliberately left out
  Leave out the Hard Problem and Mary's Room. The Hard Problem concerns why experience exists; this session concerns whether experience *does* anything. Mary concerns knowledge of qualia vs. physical facts; this session concerns knowledge of current states via judgment. Bringing them in conflates existence with efficacy and knowledge of types with knowledge of tokens. Stay focused on the causal/explanatory paradox to respect the 75-minute limit. Adding them would overload students and dilute the specific methodological critique you are aiming for in this seminar.
