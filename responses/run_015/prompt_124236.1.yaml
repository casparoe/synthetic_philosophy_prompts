      *   *Across Persons:* If A suffers and B gains, A *never* gets the gain. The loss and gain are siloed.
      *   *The "Who" Matters:* It's not just about the sum of happiness; it's about *whose* happiness it is.
      *   *The Parfit Challenge:* The user asks about the 20-year-old vs. 70-year-old continuity. If psychological continuity is low (Parfit), does the objection apply internally?
      *   *Response:* Yes, this is the weak spot for metaphysical defenses. If you ground the objection *only* in strict identity, Parfit crushes it. So, the "real weight" shouldn't rest on metaphysics. It should rest on the *structure of claim-rights* or *distribution*.
      *   *Intuition:* Think of a "container." In prudence, the container holds both the cost and the benefit. In morality, there are two containers. Pouring from one to another leaves one empty. The "single deliberator" in the Veil of Ignorance is an artificial construct that doesn't map onto the reality of distinct claimants.

  4.  **Address Question (2): Aggregation vs. Compensation vs. Justification:**
      *   *Aggregation:* Summing up goods.
      *   *Compensation:* Offsetting a loss with a gain elsewhere.
      *   *Distinction:* You can aggregate without compensating (e.g., "look at all this good!"), but utilitarianism relies on the idea that the gain *outweighs* the loss, implying the loss is *acceptable* because of the gain. That's compensation.
      *   *Justificatory Turn:* This is the strongest move (Scanlon/Rawls). It's not about whether the souls are distinct metaphysically; it's about whether I can justify the sacrifice *to the person sacrificed*.
      *   *The "Premise doing the work":* It's the premise that **losses must be bearable by the loser in light of their own life**, not the global sum.
      *   *Is one sufficient?* Compensation is the killer. Aggregation is just the math; compensation is the moral permission slip.
