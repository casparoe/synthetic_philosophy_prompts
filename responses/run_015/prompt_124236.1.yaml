      *   *Metaphysics Check:* Ensure I answer the Parfit question directly. If personal identity is weak, does the objection collapse? No, because the objection is about the *invulnerability of the standpoint*, not the durability of the self.

  7.  **Final Polish:** Check against the user's constraints.
      *   Intuitive? Yes, use the "bucket" or "ledger" analogy.
      *   Pin down the premise? Yes, the non-transferability of loss/justification.
