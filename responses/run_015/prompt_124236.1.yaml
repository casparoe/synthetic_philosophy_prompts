answer: |-
  Here is the gut-level intuition you are looking for, stripped of the sloganizing.

  The load-bearing premise of the Separateness of Persons objection is not metaphysical (about what a "person" is); it is **structural** (about how losses and gains are distributed) and **justificatory** (about who is owed an explanation).

  Here is the breakdown of where the weight actually sits.

  ### 1. Why the Prudence Analogy Fails (The "Single Ledger" Intuition)

  You asked: *Both cases have a single deliberator and one utility function. What licenses trade-offs within a life but not across persons?*

  The Harsanyi argument relies on a sleight of hand regarding **who bears the cost**.

  **The Prudence Case (One Life):**
  Imagine you are deciding whether to study hard now (pain) to get a good job later (gain).
  *   **The Structure:** There is one "ledger." The cost is entered in the red column; the benefit is entered in the green column.
  *   **The Crucial Feature:** The entity that experiences the cost is the *same entity* that reaps the benefit. Even if the 20-year-old you and the 70-year-old you are psychologically distinct (per Parfit), they are part of a single **claim-holding unit**. The 70-year-old's gain is available to *compensate* the 20-year-old's loss because they belong to the same narrative arc. The 20-year-old can say, "I am doing this for *me*."

  **The Harsanyi/Utilitarian Case (Many Lives):**
  Imagine society decides to enslave a minority to maximize the happiness of the majority.
  *   **The Structure:** The Utilitarian merges the ledgers. Minority's agony goes in the red; Majority's ecstasy goes in the green. Net positive.
  *   **The Failure:** The entity that experiences the cost (the slave) is *not* the entity that reaps the benefit (the majority).
  *   **The Intuition:** The Harsanyi "Impartial Observer" is a fictional construct. In reality, there is no super-person who feels the sum total of the pain and the pleasure. There is only Person A feeling pain and Person B feeling pleasure.

  **The Load-Bearing Premise:**
  The analogy fails because **compensation requires identity (or a relevant proxy).**
  In prudence, the later benefit compensates the earlier cost *for the sufferer*. In social trade-offs, the majority's benefit does *not* compensate the minority's cost *for the sufferer*. The slave is not made better off by the master's happiness. The loss remains a net negative *from the only perspective that matters for that loss: the loser's.*

  **Does this commit you to contentious metaphysics?**
  No. This is where your Parfit worry is astute, but the objection can survive it.
  Even if the 70-year-old is barely psychologically continuous with the 20-year-old, we usually grant that a single life constitutes a **single jurisdiction of claim-rights**. I can consent on behalf of my future self in a way I cannot consent on behalf of you.
  However, if you want to avoid metaphysics entirely, you shift the focus from "identity" to **"standpoint."**
  *   **Intuition:** Pain is always felt from a specific point of view. A gain felt from Point of View B cannot cancel out the phenomenological reality of pain felt at Point of View A. The "separateness" isn't about souls; it's about the **invulnerability of the subjective standpoint.** You cannot experience someone else's happiness to soothe your own pain. Therefore, morally, you cannot count on it to justify your pain.

  ### 2. Aggregation vs. Compensation (The Two Complaints)

  You asked: *Are there two complaints? Is either sufficient? Can this be justificatory?*

  Yes, there are two, but **Compensation** is the engine; Aggregation is just the math.

  **Aggregation:** "We should sum up all the good."
  *   *Objection:* Why sum? Why not look at the minimum? (Rawls).
  *   *Weakness:* A utilitarian can say, "Because summing produces the best outcome." This leads to a stalemate about the definition of "best."

  **Compensation:** "A's loss is acceptable because it is outweighed by B's gain."
  *   *Objection:* This is the killer. This implies that B's gain makes up for A's loss.
  *   *Why it works:* It highlights that Utilitarianism treats persons as **vessels for utility** rather than **owners of their lives.** If I break your leg to give someone else a massage, Utilitarianism says the net utility justifies it. The Separateness objection says: "You haven't compensated *me*. I still have a broken leg. The massage is irrelevant to my injury."

  **The Justificatory Turn (No Metaphysics Required):**
  This is the strongest version of the objection (championed by Scanlon and later Rawls). It bypasses the metaphysics of personal identity entirely.

  *   **The Premise:** Every person is owed a justification that *they* could reasonably accept.
  *   **The Application:** If I sacrifice you for the greater good, I must justify this *to you*.
  *   **The Problem:** I cannot say to you, "Your suffering is justified because *someone else* is happy." That is not a justification the sufferer can accept. It treats the sufferer as a means to another's end.
  *   **Why Harsanyi Fails Here:** Harsanyi says, "Behind the veil, you would accept this risk."
  *   **The Counter:** "But I am not behind the veil. I am *here*, in the real world, being sacrificed. The fact that I *might* have been the winner in a hypothetical lottery does not justify my actual loss."

  ### Summary: Where the Weight Sits

  If you want to pin the objection down to a single premise that does the work, it is this:

  > **Losses are non-transferable.**

  In prudence, a loss is transferable across time within a life because the life is the unit of moral accounting. Across persons, a loss is not transferable because there is no higher unit of moral accounting that subsumes both persons without remainder.

  **To answer your specific doubts:**

  1.  **Why Prudence is different:** Because in prudence, the "loser" and the "winner" are the same claimant. In social choice, they are distinct claimants. The Harsanyi observer conflates the *calculation* (which is one) with the *experience* (which is many).
  2.  **Metaphysics:** You do not need strict personal identity. You only need the **distinctness of conscious standpoints.** Even if "I" am a bundle of stages, *this* stage feeling pain cannot be soothed by *that* stage feeling pleasure if they are separated by personhood boundaries.
  3.  **Aggregation vs. Compensation:** Compensation is the real objection. Aggregation is neutral until you claim the aggregation justifies the sacrifice.
  4.  **Justificatory Terms:** Yes. The objection holds even if persons are metaphysically shallow, provided that moral justification requires addressing the specific individual who bears the burden. You cannot justify a burden to Person A by pointing to Person B's benefit.

  **The Gut Check:**
  Imagine you are the one being sacrificed. The Utilitarian says, "Don't worry, the total happiness is higher."
  The Separateness objection says: "That sentence is category error. The total happiness is a number in a book. My pain is a reality in my nervous system. You cannot use the number to erase the reality."

  The weight sits on the **inability of third-party gains to negate first-party losses.**
