      *   (2) Uptake-mediation: Speech needs a hearer to cause effects.
      *   (3) Own-agency: Hearer's choice breaks the causal chain (speaker doesn't *cause* the act).
      *   (4) Parasitic Harm: All uptake harms are like the Corn Dealer case (mob violence based on opinion).
      *   (5) Warrant-uptake: Authority is just a stronger form of uptake, still screened by agency.
      *   (6) Conclusion: No speech causes harm.
      *   (7) Result: Ada walks (and so does the perjurer/arsonist).

  3.  **Identify the Philosophical Flaw:**
      *   The argument is a classic "intervening cause" defense taken to an extreme. It treats human agency as a *novus actus interveniens* that *always* breaks liability.
      *   *Where it breaks:* Step (3) and (4). Specifically, the definition of "causation" and the distinction between *persuasion* and *incitement/instruction*.
      *   *Mill's actual view:* Mill *did* distinguish between arguing that corn dealers are starvers (protected) and delivering that opinion to an excited mob assembled before a corn dealer's house (unprotected). Context and *immediacy* matter.
      *   *Legal/Philosophical Fix:* The distinction isn't about "uptake" existing, but about the *nature of the uptake* and the *context of the speech act*.
      *   *Key Concept:* **Speech Acts vs. Mere Speech.** Or, **Incitement vs. Advocacy.**
      *   *Key Concept:* **Foreseeability and Probability.** If the speaker knows the audience is primed to act violently without deliberation, the "own-agency" screen is thinner.
      *   *Key Concept:* **Fraud/Perjury.** These aren't about causing physical harm through uptake; they are about undermining the *system* that allows uptake to function (the marketplace of ideas, the court system).

