answer: |-
  Here is your Q&A prep sheet, tailored to the specific dynamics of your committee.

  ### Opening Goodwill: Two Concessions
  *Say these in your first two minutes to disarm the room before you begin the argument.*

  1.  **To the Kripkean:** "I grant that Origin Essentialism is the correct model for artifacts and perhaps for abstracta. My claim is not that essentialism is false *simpliciter*, but that biological organisms constitute a special case where the relata required for the essentialist relation fail to crystallize."
  2.  **To the Phil of Biology:** "I am treating gametes and zygotes as discrete individuals for the sake of the metaphysical argument. I acknowledge that developmental biology often treats these as processes or stages rather than countable nouns. I will proceed as if they are countable, but I accept that this is a philosophical simplification of the biological data."

  ---

  ### The Eight Objections
  *Ordered by likelihood and potential damage to the thesis.*

  #### 1. The "Basic Intuition" Objection (The Kripkean)
  **The Objection:** "You're asking us to abandon a very strong modal intuition: that *I* am essentially the product of *these* parents. If a different sperm had fertilized that egg, we agree a different person would exist. You're saying there's no fact of the matter. But if there's no fact of the matter, then 'I' doesn't rigidly designate anything across worlds. Are you prepared to say that *you* are not a transworld individual?"
  **The 90-Second Answer:** "I am not denying transworld identity; I am denying that the *gamete* is the anchor for that identity. The intuition you're citing relies on the gamete being a determinate starting point. My argument is that the biological ground for that anchor is metaphysically fuzzy. If the 'sperm' is actually a cloud of genetically distinct candidates resulting from meiosis, and there is no principle of individuation to select one as *the* cause, then the necessity claim lacks a truth-maker. I'm not saying you don't exist in other worlds; I'm saying the condition 'coming from this sperm' is too vague to serve as the boundary condition for your existence."
  **Soft Spot:** You are relying on the audience accepting that biological vagueness propagates to personal identity.
  **Concession:** "I concede that if one stipulates a precise genetic sequence as the essence, the intuition holds. My claim is that nature does not provide that stipulation."

  #### 2. The "Wrong Relata" Objection (The Animalist/Hylomorph)
  **The Objection:** "You're assuming the essence of an animal is its material origin. But on a hylomorphic view, the essence is the substantial form—the life functions organized in a specific way. Even if the sperm is indeterminate, the *organism* begins when the metabolic system becomes self-maintaining. Why think the gamete matters at all? You're attacking a straw version of biological essentialism."
  **The 90-Second Answer:** "That is a powerful alternative, but it doesn't save the standard Origin Essentialist claim used in population ethics. The Non-Identity Problem relies on the claim that *this* specific conception event is necessary for *this* person. Whether you ground that in matter or in the initiation of the self-maintaining system, the timing of that initiation is also biologically indeterminate due to early cell-lineage variation. **[Empirical Premise: The point at which a cluster of cells becomes a metabolically distinct individual is not a sharp boundary in early development.]** So even if the essence is the form, the *onset* of that form inherits the vagueness of the material process."
  **Soft Spot:** You are shifting the goalposts from gametes to "onset of organism."
  **Concession:** "I concede that if the essence is purely functional, the sperm matters less. But the *timing* of that function's onset remains indeterminate."

  #### 3. The "Semantics of Vagueness" Objection (The Modal Logician)
  **The Objection:** "You claim the indeterminacy is metaphysical, not epistemic. But how do you formalize 'vague necessity'? Are you committing to truth-value gaps? Supervaluation? If 'Necessarily P' is indeterminate, does that mean the accessibility relation is vague? If you don't have a semantics for this, you're just asserting a mystery."
  **The 90-Second Answer:** "I am not proposing a new modal logic, but rather arguing that the terms within the modal operator fail to refer determinately. It's not that the operator 'Necessarily' is vague; it's that the subject term 'the sperm I came from' fails to pick out a unique object in the domain of quantification. This is a case of referential indeterminacy rather than operator vagueness. We don't need a three-valued logic to say 'The King of France is bald' lacks a truth value; similarly, 'I necessarily came from sperm S' lacks a truth value because 'Sperm S' is not a well-defined singular term in this context."
  **Soft Spot:** Distinguishing referential indeterminacy from metaphysical vagueness is tricky when the reference fails *because* the world is vague.
  **Concession:** "I concede I am not offering a formal semantics here, but diagnosing a failure of reference in the natural language claim."

  #### 4. The "Counterpart" Objection (The Lewisian)
  **The Objection:** "This whole problem dissolves if you accept counterpart theory. 'Could I have come from a different sperm?' just means 'Is there a counterpart of me in another world who came from a different sperm?' That's clearly true. You're insisting on strict identity across worlds, which is where the trouble starts. Why not just say the counterpart relation is context-sensitive?"
  **The 90-Second Answer:** "Because population ethics requires strict identity, not counterpart similarity. When we ask if a future child *would have been* the same person had we delayed conception, we aren't asking about a similar person; we are asking about the very subject of rights and interests. If we switch to counterpart theory, we lose the force of the Non-Identity Problem's conclusion, which is that the *very same* person is not harmed. My argument preserves the strict identity framework but shows it yields indeterminate verdicts, which is ethically more honest than forcing a counterpart solution."
  **Soft Spot:** Lewisians will insist strict identity across worlds is incoherent regardless of your biological argument.
  **Concession:** "I concede that counterpart theory avoids the paradox, but at the cost of changing the ethical subject."

  #### 5. The "Empirical Accuracy" Objection (The Phil of Biology)
  **The Objection:** "You say meiosis yields a 'population' of sperm where none is determinate. But biologically, only one sperm succeeds. The causal chain selects a specific winner. Why isn't the actualized sperm the determinate one simply in virtue of having won the race? The history fixes the identity."
  **The 90-Second Answer:** "The selection happens *after* the meiotic division that generates the genetic variation. **[Empirical Premise: Crossing over occurs before the final differentiation of the sperm cell.]** By the time the 'winner' is selected, the genetic profile was already one of many potential outcomes of that specific meiotic event. The 'sperm' isn't a pre-existing individual that entered the race; it is the outcome of a probabilistic process. To say the winner is 'the one' is to engage in post-hoc identification, which doesn't ground a *necessary* truth about the origin, only a contingent one."
  **Soft Spot:** You must be sure about the timing of crossing over relative to sperm individuation.
  **Concession:** "I concede that causally, one sperm is sufficient. I deny it is necessary in the essentialist sense."

  #### 6. The "Ethical Relevance" Objection (The Parfitian)
  **The Objection:** "Let's say you're right. Identity is indeterminate. So what? In population ethics, we care about whether there is a subject who is worse off. If identity is vague, does the harm vanish? Or do we just treat the vagueness as 'no harm'? You risk paralyzing ethical judgment with metaphysical hair-splitting."
  **The 90-Second Answer:** "It doesn't paralyze judgment; it clarifies the stakes. Currently, the Non-Identity Problem forces a binary: either the child is harmed or they aren't. If identity is indeterminate, the verdict is 'indeterminately harmed.' This matches our moral intuition better than a hard 'no.' It allows us to say the action is problematic without needing to prove a specific victim was made worse off in a strict identity sense. It shifts the debate from 'Who was harmed?' to 'Was the creation process morally robust?'"
  **Soft Spot:** "Indeterminate harm" is a difficult concept to operationalize in policy.
  **Concession:** "I concede this makes ethical calculation harder, but accuracy is preferable to false precision."

  #### 7. The "Transworld Heirloom" Objection (The Kripkean - Follow Up)
  **The Objection:** "If the sperm isn't the anchor, what is? If I didn't come from that sperm, and I didn't come from that genome, what property travels with me across worlds to make it *me*? If nothing does, you've eliminated the self."
  **The 90-Second Answer:** "I am not eliminating the self; I am rejecting the idea that the self is anchored by a microscopic material part. The anchor is the macroscopic biological continuity of the organism. The problem arises only when we try to trace that continuity back to a point *before* the organism existed (the gamete). Once the organism exists, identity is stable. The indeterminacy is localized to the boundary of coming-into-existence, not the persistence of the existing person."
  **Soft Spot:** Defining "macroscopic biological continuity" without smuggling in genetic essentialism.
  **Concession:** "I concede I am not offering a positive account of transworld identity, only a negative claim about gametes."

  #### 8. The "Propagation" Objection (The General Metaphysician)
  **The Objection:** "Even if the sperm is vague, why does that make *you* vague? We accept vague boundaries for clouds and mountains without saying the water molecules are vague. Why does micro-indeterminacy entail macro-indeterminacy of the person?"
  **The 90-Second Answer:** "Because in this specific case, the macro-object's *existence condition* is defined by the micro-object. A mountain exists regardless of which water molecule is where. But a human organism, under Origin Essentialism, exists *if and only if* it comes from specific origins. If the origin condition is the definition of the entity, and the origin is vague, the entity's existence condition is vague. The vagueness propagates because the essence is defined by the vague relata."
  **Soft Spot:** This assumes Origin Essentialism is true to show it leads to indeterminacy.
  **Concession:** "I concede that if one rejects Origin Essentialism entirely, this propagation stops. But then the Non-Identity Problem dissolves anyway."

  ---

  ### Strategic Summary

  **The Single Reply That Must Land:**
  The distinction between **Epistemic** and **Metaphysical** Indeterminacy (Objection 1 & 3).
  *Why:* If they convince you (or the room) that the indeterminacy is just "we don't know which sperm," your thesis collapses into standard essentialism. You must hold the line that there is *no fact of the matter* because the biological process does not individuate the sperm until it is too late to serve as an essential anchor.
  *Phrasing:* "It is not that we cannot find the fact; it is that the biological process does not write the fact."

  **The Question You Hope Nobody Asks:**
  "If identity is indeterminate at the origin, are *you* currently an indeterminate object? If I cut off a cell from your body, is it indeterminate whether that cell is part of you?"
  *Why:* This triggers the "Problem of the Many." If you admit vagueness at the origin, you may be committed to vagueness in persistence, which threatens the coherence of the subject defending the thesis.
  *Defense:* "Vagueness at the boundary of *coming into existence* does not entail vagueness in *persistence*. Once the metabolic system is closed and self-maintaining, the boundaries are functionally determinate."

  **The Weakest Point in Your Position:**
  **The Propagation of Vagueness (Objection 8).**
  *Why:* It is intuitively difficult to accept that vagueness in a microscopic precursor (sperm) renders the macroscopic successor (person) ontologically vague. Most metaphysicians prefer to keep the macro-object determinate even if its history is fuzzy.
  *Preparation:* Do not fight this on intuition. Fight it on the *definition* of the object. If the object is *defined* by its origin (as the essentialist claims), then vagueness in the origin *must* infect the object. Turn their essentialism against them.

  ---

  ### Confidence Levels

  *   **Diagnosis of Kripkean/Animalist Objections:** **High Confidence.** These are standard moves in this literature. The tension between material constitution and substantial form is the classic fault line.
  *   **Diagnosis of Logician/Lewisian Objections:** **High Confidence.** Their commitments to precise semantics and counterpart theory are well-known doctrinal positions.
  *   **Diagnosis of Parfitian Objection:** **Medium-High Confidence.** Parfitians generally prioritize ethical outcomes over metaphysical precision, but some may see your "indeterminate harm" as a useful tool rather than an objection.
  *   **Diagnosis of Phil of Biology Objection:** **Medium Confidence.** Biologists vary in their philosophical commitments. Some may agree that "sperm" is a functional category, others may insist on the physical individuation of the cell.
  *   **Least Sure Claim:** **The Empirical Premise regarding Early Cell-Lineage Variation (Move 2).**
      *   *Reason:* The exact point at which a zygote's genome becomes "fixed" versus when post-zygotic mutations create a mosaic embryo is a moving target in developmental biology. If it turns out the genome is stable enough for the first few divisions to ground a "genetic essence," Move 2 fails.
      *   *Action:* Verify the timing of the first post-zygotic mutation relative to the first cell division. If mutations happen *after* the first division, the "indeterminate genome" argument is stronger. If they happen *during* gametogenesis only, you must rely entirely on Move 1 (Sperm Population).
