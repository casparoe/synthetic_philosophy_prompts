prompt: |-
  I sit on the editorial board of a university press series on contested pasts, and we have to rule on a submission. Our track record so far:

  - rejected a manuscript arguing that Atlantis was a real Bronze Age thalassocracy, resting on Plato read as reportage plus comparative mythology;
  - rejected an ancient-astronauts manuscript, on the ground that it inferred extraterrestrial instruction from engineering the author could not explain;
  - rejected a New Chronology style manuscript holding that the whole documentary and dating record is a retrojected forgery;
  - published, with a rejoinder by a specialist, a tightly scoped argument for pre-Columbian trans-Pacific contact built on botanical and linguistic evidence;
  - published a monograph arguing that an apparent dark-age gap in a regional record is an artifact of preservation rather than a real collapse, and separately a monograph arguing that a colonial-era excavation looted and misdated a site — both methodologically conventional, both modest in what they overturn, and the second explicitly framed as reparative;
  - rejected, on a split vote, a well-executed manuscript arguing from a small corpus of Neolithic marks that they encode a lunar calendar and push the origin of writing back two millennia, our letter saying the load-bearing evidence is too thin for the size of the revision, though we published the same author's narrow paper on the distribution of a single sign.

  The new submission: from a reanalysis of one submerged harbour site, with a single radiocarbon series on short-lived seed material that a specialist says may come from a redeposited layer, the author argues that a culture the textbooks place in the second millennium BC in fact flourished eight centuries earlier and exported its script to two neighbouring regions, which would force the redating of three regional sequences. The manuscript works from the primary excavation reports, answers every mainstream objection in a forty-page appendix, states in advance what would refute it, predicts that a buried quay will be found at a named spot if the new dating is right, and offers to appear alongside a critic's rejoinder. Its preface says the point is to give a people back the antiquity that a colonial chronology took from them. The quay will not be excavated before we must decide.

  A colleague proposes that we stop asking what would refute a heterodox claim and instead apply a symmetry test: demand of the revisionist thesis only what the received chronology it attacks itself meets, and no more.

  Which rules fit all six of our verdicts, and where do they come apart on this one? Give me the decision that best coheres with our own precedents, the closest analog among them, an honest statement of the principle we would be adopting either way, and the single change to this case — or the further case — that would tell the surviving rules apart, including whether the symmetry test belongs in the set.
reasoning: |-
  Here's a thinking process that leads to the suggested decision:

  1.  **Analyze the Request:**
      *   **Role:** Member of an editorial board for a university press series on "contested pasts."
      *   **Task:** Rule on a new submission based on past precedents (6 specific cases).
      *   **Input:** Description of 6 past verdicts (3 rejected, 3 published) and the details of the new submission.
      *   **Complication:** A colleague proposes a "symmetry test" (demand only what the received chronology meets).
      *   **Output Requirements:**
          1.  Identify the rules that fit all six past verdicts.
          2.  Identify where those rules come apart on the new case.
          3.  Provide the decision that best coheres with precedents.
          4.  Identify the closest analog among past cases.
          5.  State the principle being adopted (honestly).
          6.  Identify the single change/further case that would distinguish the surviving rules (including the status of the symmetry test).

  2.  **Analyze the Past Precedents (The "Case Law"):**

      *   *Case 1 (Rejected):* Atlantis as real Bronze Age thalassocracy.
          *   Basis: Plato as reportage + comparative mythology.
          *   Reason for Rejection: Pseudohistory/Myth treated as data. Lack of material evidence.
      *   *Case 2 (Rejected):* Ancient Astronauts.
          *   Basis: Inference from unexplained engineering.
          *   Reason for Rejection: Argument from ignorance ("cannot explain" = aliens). Methodological flaw.
      *   *Case 3 (Rejected):* New Chronology (Fomenko-style).
          *   Basis: Whole record is forgery.
          *   Reason for Rejection: Global conspiracy/total overturn without proportional evidence. Too radical for the evidence.
      *   *Case 4 (Published):* Pre-Columbian trans-Pacific contact.
          *   Basis: Botanical and linguistic evidence.
          *   Conditions: Tightly scoped, published *with a rejoinder*.
          *   Key: Specific evidence types (botany/linguistics), modest scope (contact, not civilization origin), peer engagement (rejoinder).
      *   *Case 5 (Published x2):* Dark-age gap (preservation artifact) & Colonial looting/misdating.
          *   Basis: Methodologically conventional.
          *   Key: Modest in what they overturn (local/regional), one explicitly "reparative" (colonial error).
      *   *Case 6 (Rejected):* Neolithic marks = lunar calendar/writing origin pushback (2 millennia).
          *   Basis: Small corpus of marks.
          *   Reason for Rejection: Load-bearing evidence too thin for size of revision.
          *   Nuance: Published same author's *narrow* paper on sign distribution.
          *   Key: Proportionality between evidence weight and claim magnitude.

  3.  **Synthesize the Implicit Rules (The "Jurisprudence"):**

      *   *Rule A (Methodological Orthodoxy):* Arguments must rely on standard archaeological/historical methods (material evidence, stratigraphy, radiocarbon) rather than myth, "unexplained" gaps, or global conspiracy theories. (Cases 1, 2, 3 rejected; 4, 5 accepted).
      *   *Rule B (Proportionality):* The magnitude of the claim must match the weight of the evidence. Small datasets cannot support massive chronological overhauls. (Cases 3, 6 rejected; 4, 5 accepted).
      *   *Rule C (Scope/Modesty):* Tightly scoped revisions are preferred over total system overhauls. (Cases 3, 6 rejected; 4, 5 accepted).
      *   *Rule D (Engagement/Safeguards):* Controversial but plausible claims benefit from rejoinders/critics or explicit framing (reparative). (Case 4, 5b).
      *   *Rule E (Political/Ethical Framing):* "Reparative" arguments (correcting colonial errors) are viewed more favorably *if* methodologically sound (Case 5b), but political motivation alone doesn't save bad method (Case 6 implies evidence is king).

  4.  **Analyze the New Submission:**

      *   *Claim:* Culture flourished 800 years earlier than thought; exports script; forces redating of three regional sequences. (High Magnitude/Scope).
      *   *Evidence:* One submerged harbour site. Single radiocarbon series on short-lived seed material. (Low Weight/Single Point).
      *   *Complication:* Specialist says seeds may be redeposited (stratigraphic integrity issue).
      *   *Strengths:* Uses primary reports, answers objections in appendix, states falsification conditions, predicts new evidence (quay), offers rejoinder.
      *   *Motivation:* Reparative (give people back antiquity taken by colonial chronology).
      *   *Constraint:* Quay cannot be excavated before decision.

  5.  **Evaluate the "Symmetry Test":**

      *   *Proposal:* Demand of the revisionist thesis only what the received chronology it attacks itself meets.
      *   *Analysis:* The received chronology rests on *multiple* lines of evidence (stratigraphy, multiple C14 dates, cross-dating, texts). The new thesis rests on *one* C14 series. Applying symmetry would mean accepting the new thesis even if it has less evidence, provided the old one isn't "perfect."
      *   *Fit with Precedents:* This contradicts Rule B (Proportionality) and Rule A (Methodological Orthodoxy). Case 6 specifically rejected a claim because evidence was "too thin for the size of the revision," implying the burden of proof is on the *reviser*, not symmetrical. Case 3 rejected a total overhaul because the evidence didn't support the scale.
      *   *Verdict on Symmetry:* It does not fit the past six verdicts. It would likely force acceptance of Case 3 (New Chronology) or Case 6 (Neolithic writing), which were rejected.

  6.  **Drafting the Decision:**

      *   *Decision:* Reject (with invitation to resubmit if more evidence arises).
      *   *Why:* It violates Rule B (Proportionality) and Rule A (Methodological Orthodoxy regarding stratigraphy). One C14 series with potential redeposition issues is insufficient to redating three regional sequences and script origins. This is structurally identical to Case 6 (Neolithic marks).
      *   *Closest Analog:* Case 6 (Neolithic marks). Both involve pushing back origins/writing based on a small dataset (marks vs. one site's seeds) that requires a massive chronological shift.
      *   *Principle:* "Proportional Burden of Proof." Extraordinary claims require evidence proportional to the disruption caused, not merely evidence that matches the weakest link of the status quo.
      *   *The "Single Change" (The Test Case):* What would distinguish the rules?
          *   If the quay *is* found and dated: Does that save it?
          *   Better: If the radiocarbon series was *multiple* and from *secure* contexts.
          *   Best for distinguishing Symmetry vs. Proportionality: If the received chronology for this specific region *also* relied on a single, potentially redeposited C14 series. If the status quo is *that* weak, does symmetry demand acceptance?
          *   *Refinement:* The prompt asks for the single change to *this* case or a *further* case that tells the surviving rules apart, including whether symmetry belongs.
          *   *Idea:* If the "received chronology" for this specific culture *also* rested on a single, contested C14 date. If we still reject the new manuscript, Symmetry is out. If we accept, Symmetry is in.
          *   *Alternative:* If the author provides *two* more independent C14 series from secure contexts. If we accept, it confirms Proportionality (evidence weight increased). If we still reject because "colonial chronology is entrenched," then Political Framing overrides Method.
          *   *Selection:* Let's focus on the *evidence weight* vs. *status quo weakness*. The Symmetry Test argues we should only match the status quo's evidence quality. The Proportionality Rule argues we must exceed a threshold based on claim size.
          *   *Test:* Suppose the "received chronology" for this region is admitted by specialists to rest on equally thin evidence (one contested date).
              *   *Proportionality Rule:* Still reject the new claim if the *change* is massive (800 years, 3 regions), because the *change* requires high certainty regardless of the status quo's shakiness.
              *   *Symmetry Rule:* Accept (or at least publish with rejoinder), because the new claim is no weaker than the old one.
              *   *Precedent Check:* Case 5 (Dark Age/Preservation) accepted a revision because it was methodologically conventional, not because the old view was weak. Case 6 rejected a claim because evidence was thin, implying the burden is on the *new* claim's weight, not just comparison to the old.
              *   *Conclusion:* The Symmetry Test is inconsistent with Case 6.

  7.  **Refining the Output Structure:**

      *   **Rules:** List the implicit principles derived from the 6 cases.
      *   **Fracture Point:** Show how the new case stresses these rules (Reparative motive vs. Thin Evidence).
      *   **Decision:** Reject.
      *   **Analog:** Case 6 (Neolithic marks).
      *   **Principle:** Proportional Burden of Proof (Evidence weight must match claim magnitude, independent of the status quo's flaws).
      *   **Distinguishing Change:** A scenario where the *status quo* is admitted to be as weak as the proposal.

  8.  **Self-Correction/Nuance Check:**
      *   *Did I miss the "Reparative" angle?* Case 5b was reparative and published. But it was "methodologically conventional." The new case is methodologically risky (redeposited seeds). So Method > Motive.
      *   *Did I miss the "Rejoinder" offer?* Case 4 published *with* a rejoinder. But Case 4 had "botanical and linguistic evidence" (multiple lines). The new case has one C14 series. Rejoinder saves plausible controversies, not methodological weak spots.
      *   *Did I miss the "Prediction"?* The author predicts a quay. Case 6 author published a narrow paper on sign distribution. The board values *actual* evidence over *predicted* evidence (Quay not excavated yet).
      *   *Symmetry Test:* The colleague wants to apply this *now*. I need to explain why it doesn't fit the past 6.
      *   *Case 3 (New Chronology):* The received chronology has gaps/uncertainties. New Chronology said "it's all fake." Rejected. Why? Because the evidence for "all fake" was thinner than the evidence for "some uncertainty." Symmetry would have demanded: "Does the received chronology prove every date perfectly? No? Then publish the challenger." We rejected it. So Symmetry is already implicitly rejected by Case 3.

  9.  **Final Polish:** Ensure the tone is appropriate for an editorial board memo (analytical, decisive, principled).

      *   *Rules:*
          1.  Methodological Conservatism (Standard methods required).
          2.  Evidentiary Proportionality (Claim size vs. Evidence weight).
          3.  Scope Modesty (Regional/Specific > Global/Total).
          4.  Reparative Value (Positive factor, but subordinate to Method).
      *   *Fracture:* The new case has Reparative Value (like 5b) and offers Rejoinder (like 4), but fails Proportionality (like 3 & 6) and Methodological Conservatism (redeposited seeds).
      *   *Decision:* Reject.
      *   *Analog:* Case 6 (Thin evidence, huge claim).
      *   *Principle:* "Asymmetric Burden of Proof." The revisionist bears a burden proportional to the disruption, not merely equal to the incumbent's weakness.
      *   *Test:* If the incumbent chronology is admitted to rest on equally thin evidence.

  10. (Final check of the prompt requirements): "Which rules fit all six... where do they come apart... decision... closest analog... honest statement of principle... single change... including whether symmetry test belongs."
      *   Okay, I need to explicitly state if Symmetry belongs in the set of rules. (It doesn't).
      *   I need to make sure the "Single Change" clearly distinguishes the rules.

      *   *Refining the "Single Change":*
          *   Current Case: Thin evidence vs. Strong Status Quo. (Reject).
          *   Change: Thin evidence vs. *Thin* Status Quo.
          *   If we Reject: Proportionality holds (New claim must be strong regardless of old claim's weakness). Symmetry fails.
          *   If we Accept: Symmetry holds (New claim only needs to match old claim). Proportionality fails.
          *   Given Case 3 (New Chronology), we likely Reject even if the Status Quo has gaps. So Symmetry is out.

      *   *Wait, one more nuance:* The prompt asks for the decision that *best coheres* with precedents.
      *   Precedents say: Reject thin evidence/big claim (Case 3, 6). Accept methodologically sound/reparative (Case 5).
      *   This case: Thin evidence (Case 6) + Reparative (Case 5).
      *   Which wins? Case 6 rejected *despite* well-executed analysis. Case 5 accepted *because* methodologically conventional.
      *   Method trumps Motive. So Reject.

      *   *Let's write it.*
answer: |-
  **Memorandum to the Editorial Board**

  **Subject:** Ruling on Submission [Redacted] (Submerged Harbour/Chronological Revision)

  ### 1. The Implicit Rules of the Series
  Based on the six prior verdicts, the following principles consistently explain our decisions:

  1.  **Methodological Orthodoxy:** Arguments must rely on standard disciplinary tools (stratigraphy, secure radiocarbon contexts, comparative linguistics) rather than argument from ignorance, myth-as-data, or conspiracy theories. (Explains Rejections 1, 2, 3; Acceptances 4, 5).
  2.  **Evidentiary Proportionality:** The weight and breadth of the evidence must be proportional to the magnitude of the historical revision. Small datasets cannot sustain massive chronological overhauls. (Explains Rejections 3, 6; Acceptances 4, 5).
  3.  **Scope Modesty:** Tightly scoped revisions (regional, specific site, single sign) are preferred over total system overhauls (global chronologies, origins of writing). (Explains Rejection 6b vs. Acceptance 6a; Rejection 3 vs. Acceptance 4).
  4.  **Reparative Mitigation:** Ethical or political motives (correcting colonial errors) are positive factors that can tip the balance *if* methodological standards are met, but they cannot override methodological deficits. (Explains Acceptance 5b; distinguishes from Rejection 6).
  5.  **Safeguarded Publication:** High-controversy submissions that meet methodological bars are strengthened by accompanying rejoinders or explicit falsification conditions. (Explains Acceptance 4, 5b).

  **The Symmetry Test:** This proposal **does not fit** the six prior verdicts. If applied to Case 3 (New Chronology), it would have forced publication, as the received chronology contains uncertainties and gaps that the "forgery" thesis exploits. If applied to Case 6 (Neolithic marks), it would have forced publication if the standard view of writing origins relied on similarly ambiguous signs. We rejected both. Therefore, the Symmetry Test is incompatible with our jurisprudence.

  ### 2. Where the Rules Come Apart
  The new submission creates tension between **Rule 4 (Reparative Mitigation)** and **Rule 2 (Evidentiary Proportionality)**.

  *   **For Acceptance:** The manuscript is framed as reparative (Rule 4), offers a rejoinder (Rule 5), and provides falsification conditions (Rule 5). It mirrors the ethical stance of Case 5b.
  *   **For Rejection:** The claim (800-year shift, script export, three regional sequences) is massive, while the evidence (one site, single C14 series, potential redeposition) is singular and fragile. This mirrors the evidentiary deficit of Case 6 and the systemic overreach of Case 3.

  The fracture point is whether a reparative motive can lower the evidentiary threshold required for a major chronological revision. Our precedents suggest it cannot; Case 5b was accepted because it was *methodologically conventional*, not merely because it was reparative.

  ### 3. The Decision
  **Reject.**

  We should invite a resubmission only if independent corroboration (e.g., the predicted quay, additional secure C14 series) materializes.

  ### 4. Closest Analog
  **Case 6 (The Neolithic Marks).**
  In Case 6, we rejected a well-executed argument that pushed back the origin of writing by two millennia based on a small corpus of marks, explicitly stating the "load-bearing evidence is too thin for the size of the revision." We simultaneously published that author's narrow paper on sign distribution.
  This new submission is structurally identical: a high-magnitude chronological/origin claim (script export, 800-year shift) resting on a low-magnitude dataset (one site, one C14 series). The author's willingness to publish a narrow paper on the harbour's stratigraphy *without* the chronological claim would be the consistent parallel to Case 6's outcome.

  ### 5. Statement of Principle
  **"Asymmetric Burden of Proof."**
  We operate on the principle that the burden of proof lies disproportionately on the revisionist claim, calibrated to the *disruption* the claim causes, not merely to the *weaknesses* of the status quo. A reparative intent or a symmetrical critique of the incumbent chronology does not reduce the absolute weight of evidence required to overturn established sequences. We correct colonial errors (Case 5b) only when the correction is methodologically robust, not when the correction relies on evidence thinner than the error it seeks to fix.

  ### 6. The Distinguishing Change
  To definitively separate the **Proportionality Rule** (our current standard) from the **Symmetry Test** (the colleague's proposal), consider this single change to the case:

  **The Change:** Suppose the specialist review admits that the *received chronology* for this specific culture *also* rests on a single, potentially redeposited radiocarbon series of comparable quality.

  *   **Under the Proportionality Rule:** We still **Reject**. The new claim forces a massive revision (800 years, three regions). Even if the status quo is weak, the *revision* requires strong evidence proportional to its magnitude. The weakness of the incumbent does not validate the challenger.
  *   **Under the Symmetry Test:** We **Accept** (with rejoinder). The new thesis meets the same evidentiary standard as the old one. If the status quo is published despite thin evidence, the challenger must be afforded the same license.

  **Verdict on the Test:** Given our rejection of Case 3 (New Chronology), which thrived on pointing out inconsistencies in the received record without providing proportional evidence, we would almost certainly **Reject** even under this changed condition. This confirms that the Symmetry Test does not belong in our set of rules. We require the revision to be *stronger* than the status quo, not merely *as strong as* the status quo.
