answer: |-
  You have hit on the central tension in the philosophy of social action. Your intuition is correct: Bratman and Searle are not answering precisely the same question, though their answers overlap significantly.

  Searle is primarily asking a question in the **philosophy of mind**: *What is the logical form of the mental state involved in social action?* He wants to know if "we-intending" is a distinct psychological mode.

  Bratman is primarily asking a question in the **metaphysics of sociality**: *What are the necessary and sufficient conditions for a group to count as acting jointly?* He wants to know how individual planning agents can construct a shared agency without positing a group mind.

  Because of this divergence, their disagreement is not just about the answer, but about what needs explaining. Here is a comparison focused on your three specific points of friction.

  ### 1. Normative Force: Construction vs. Inherence

  The question here is whether the theory explains *why* participants feel obligated to one another, or merely describes that they do.

  **Bratman: Norms as Structural Byproducts**
  Bratman's account is often criticized as being purely descriptive (a "checklist" of psychological states), but this overlooks his treatment of norms. For Bratman, normative force is **constructed** out of the norms of individual planning agency.
  *   **The Mechanism:** Individual agents are governed by norms of consistency and means-end coherence. If I intend a goal, I ought to intend the means. In shared intention, I intend that *we* J. This creates an interpersonal commitment.
  *   **The Force:** The normative force arises because my intention is interlocked with yours. If I drop out without notice, I violate the norm of stability required for our plans to mesh. I undermine your ability to plan. Thus, the obligation is derived from the functional requirement of coordination.
  *   **Verdict:** Bratman explains the *source* of the norm (interdependent planning stability), but some critics argue this yields a "hypothetical" normativity (if you want to coordinate, you ought to...) rather than a categorical moral obligation.

  **Searle: Norms as Intrinsic Content**
  Searle argues that the normative force is **inherent** to the mental state itself.
  *   **The Mechanism:** A "we-intention" is not an "I-intention" plus a belief about you. It is a primitive mode. When I have a we-intention, the content of my intention is "We are doing X."
  *   **The Force:** Because the "We" is part of the intentional content, I am already committed to the collective goal. The obligation is not derived from the need for coordination; it is part of what it *means* to have that mental state. To have a we-intention just *is* to be committed to the group action.
  *   **Verdict:** Searle captures the *phenomenological feel* of obligation better (it feels primitive to the agent), but he offers less explanation for *why* that mental state carries obligation other than asserting it is a biological primitive.

  **Comparison:** Bratman explains *how* norms emerge from interaction (bottom-up); Searle asserts norms are built into the psychology of the interaction (top-down). Bratman gives you the mechanics of the obligation; Searle gives you the ontology of the commitment.

  ### 2. Explanatory Primitive: Analysis vs. Posit

  This is the crux of your second point: Is Searle's "we-intention" a genuine theoretical foundation, or is it a label that hides the work?

  **Bratman: The Reductive Challenge**
  Bratman operates under a methodological individualist constraint. He believes that if we posit a "we-intention" without analyzing it, we are engaging in mystery-mongering.
  *   **The Critique:** Bratman argues that Searle's account risks circularity. If you ask, "What makes this a joint action?" and Searle answers, "The fact that they have we-intentions," and you ask, "What is a we-intention?" and Searle answers, "An intention involved in joint action," you haven't explained anything. You have just named the phenomenon.
  *   **The Alternative:** Bratman attempts to cash out "shared intention" in terms of concepts we already understand (individual intention, belief, common knowledge). This makes the theory testable and functionally explanatory. It shows *how* the trick is done.

  **Searle: The Non-Reductive Defense**
  Searle argues that reductionism is impossible. He claims that no amount of "I-intend" + "I-belief" can logically yield a "We-intend."
  *   **The Defense:** For Searle, calling it a "primitive" is not an admission of defeat; it is a claim about human biology. Just as we cannot reduce "visual experience" to "neural firings" without losing the phenomenology, we cannot reduce "collective intentionality" to "individual intentionality" without losing the collectivity.
  *   **The Risk:** The risk you identified is real. If the primitive is not connected to observable behavioral criteria (which Bratman provides), it becomes a "ghost in the machine." Searle relies on the intuition that we *feel* the difference between carrying a log alone vs. carrying it together.

  **Comparison:** Bratman treats collective intentionality as a **functional structure** built from simpler parts. Searle treats it as a **basic capacity**. Bratman's view is more analytically rigorous but risks missing the qualitative unity of the group. Searle's view captures the unity but risks being theoretically inert (it stops inquiry rather than advancing it).

  ### 3. Edge Cases: Defection and Partial Agreement

  How do the theories handle the fragility of joint action?

  **Case A: One participant stops caring halfway through.**
  *   **Bratman:** Shared intention is a matter of degree and structure. If I cease to intend that *we* J, the web of interlocking intentions is broken. Technically, the *shared intention* no longer exists. However, Bratman can explain why I might still be *obligated* to finish (based on the prior commitment and your reliance on me). The joint action dissolves into parallel action or coercion, but the normative residue remains.
  *   **Searle:** If I stop having the we-intention, I switch to an I-intention. I am no longer part of the collective intentionality. However, Searle allows that the *group* can maintain the we-intention even if I drop out (provided the remaining members sustain it). For Searle, my defection is a change in my internal mental mode. It is a clean switch: either I am in the "we-mode" or I am not.

  **Case B: A group acts without every member fully agreeing (e.g., an orchestra with a dissenting violinist).**
  *   **Bratman:** This is where Bratman shines. He can model **asymmetry**. The conductor might intend that *we* play the symphony. The dissenting violinist might intend that *we* play the symphony (to keep their job) but dislike the interpretation. As long as their individual intentions mesh and they coordinate sub-plans, Bratman counts it as shared intention. He allows for different reasons and different levels of enthusiasm, provided the interlocking structure holds.
  *   **Searle:** Searle requires that each individual has the we-intention in their head. If the violinist is merely pretending, Searle would say they lack the collective intentionality. They are behaving *as if* they are cooperating, but they are not truly participating in the collective mental state. Searle's view is stricter: without the internal "we-mode," there is no genuine joint action, only coordinated individual action.

  **Comparison:** Bratman offers a **sociological** advantage here; he can explain imperfect, coerced, or strategic cooperation as a form of joint action (albeit a fragile one). Searle offers a **phenomenological** distinction; he draws a hard line between *real* togetherness (we-mode) and *mere* coordination (I-mode), even if the outward behavior is identical.

  ### Summary of the Disagreement

  To return to your initial worry: they are not answering the exact same question, which is why you feel stuck.

  *   **Bratman** is answering: "How can individualists form a group?" His answer is: **Interlocking Plans.**
  *   **Searle** is answering: "What is the mind of a social animal?" His answer is: **Primitive We-Mode.**

  **On Normativity:** Bratman derives it from the stability of planning; Searle locates it in the content of the mind.
  **On Explanation:** Bratman analyzes the concept to avoid circularity; Searle posits a primitive to avoid reductionism.
  **On Edge Cases:** Bratman allows for structural cooperation without full internal agreement; Searle demands the internal "we-mode" for genuine joint action.

  If you care about the **mechanics of coordination** and how obligations arise from interaction, Bratman is the stronger account. If you care about the **experience of togetherness** and the logical form of social thought, Searle is the stronger account. The disagreement lies in whether you think the "we" is something we *build* (Bratman) or something we *are* (Searle).
