prompt: |-
  I've been going back and forth on the difference between Bratman's account of joint action and Searle's idea of collective intentionality, but I keep getting stuck on whether they are really answering the same question. Bratman seems to treat joint action as something built out of individual agents who have shared intentions, mutual beliefs, and intentions that mesh with each other. Searle seems to say that we need a primitive we intention, not just a pile of individual I intend statements, so the basic unit is already collective. What I want is a careful comparison of the two views, not just a summary of each one.

  Can you help me see where the disagreement actually lies, especially on three points? First, does Bratman's account explain why joint action has normative force, or does it just describe the psychological ingredients? Second, is Searle's collective intentionality a genuine explanatory primitive, or does it risk naming the phenomenon and calling it a theory? Third, how would each view handle a case where one participant stops caring halfway through, or where a group acts together without every member fully agreeing?
reasoning: |-
  Here's a thinking process that leads to the suggested comparison:

  1.  **Analyze the User's Request:**
      *   **Topic:** Comparison of Michael Bratman's Shared Intentionality (planning theory) vs. John Searle's Collective Intentionality (we-intentions).
      *   **Core Problem:** The user is stuck on whether they are answering the same question. They recognize Bratman's "bottom-up" (individualistic) approach vs. Searle's "top-down" (primitive collective) approach.
      *   **Specific Task:** Provide a *careful comparison*, not just a summary. Focus on three specific points of disagreement:
          1.  Normative force (explanation vs. description).
          2.  Explanatory status (primitive vs. circular/naming).
          3.  Edge cases (defection/partial agreement).

  2.  **Deconstruct the Two Views (Mental Sandbox):**
      *   *Bratman:* Shared intention is not a group mind. It's a web of interlocking individual intentions. I intend that we J, you intend that we J, we know this, our plans mesh, we coordinate. It's functionalist. It explains *how* it works mechanically.
      *   *Searle:* Collective intentionality is a biological primitive. You can't reduce "We intend" to "I intend + belief." It's a mode of consciousness. The "we" is in the head of the individual, but it's not reducible.
      *   *The "Same Question" Issue:* Bratman asks, "What are the conditions under which we can say a group is acting jointly?" (Metaphysical/Functional). Searle asks, "What is the psychological mode of the individual when participating in a joint act?" (Phenomenological/Biological). They overlap but start from different ends.

  3.  **Address Point 1: Normative Force:**
      *   *Bratman:* Since it's built on individual planning agency, norms arise from the consistency requirements of planning. If I intend us to J, I'm committed to my part. If I drop out without notice, I violate the norms of planning agency (consistency, means-end coherence). So, yes, there is normative force, but it's derived from individual rationality norms extended interpersonally.
      *   *Searle:* The normative force comes from the status of the "we-intention" itself. If I have a we-intention, I am *already* committed to the group goal. It's intrinsic to the mental state.
      *   *Comparison:* Bratman's normativity is *constructed* (interlocking commitments); Searle's is *inherent* (mode of consciousness). Bratman explains *why* the norm exists (coordination stability); Searle asserts it exists as part of the mental state.

  4.  **Address Point 2: Explanatory Primitive vs. Naming:**
      *   *Searle:* Claims "we-intend" is a primitive biological capacity. Criticism: Is this just saying "people do group stuff" and labeling it "we-intention"? Does it explain *how* coordination happens? Searle says reductionism fails, so we must posit a primitive.
      *   *Bratman:* Claims Searle's view is mysterious. Bratman tries to *analyze* the concept into constituent parts (intention, belief, interdependence).
      *   *Comparison:* Bratman offers a reductive analysis (mechanism). Searle offers a non-reductive ontology (foundation). The risk for Searle is circularity (we act together because we have we-intentions; we have we-intentions because we act together). The risk for Bratman is missing the phenomenological "feel" of togetherness.

  5.  **Address Point 3: Edge Cases (Defection/Partial Agreement):**
      *   *Scenario:* One person stops caring, or not everyone fully agrees.
      *   *Bratman:* Shared intention is a matter of degree. If the interlocking web breaks (e.g., I no longer intend that we J), the shared intention dissolves. However, obligations might linger based on prior commitments. It handles partial agreement well because it looks at the *structure* of intentions. If the mesh fails, joint action fails (or becomes coercive/parallel).
      *   *Searle:* If I stop having the we-intention, I am no longer part of the collective intentionality. But the group might still have it. Searle distinguishes between the individual's we-intention and the group's status. If I defect, I switch to an I-intention.
      *   *Comparison:* Bratman is better at explaining the *breakdown* mechanics (failure of interlocking). Searle is better at explaining the *persistence* of the group mind despite individual fluctuation (the collective status exists even if I opt out).

  6.  **Synthesize and Structure the Essay:**
      *   *Introduction:* Acknowledge the user's insight (they aren't exactly answering the same question). Frame the core distinction: Metaphysics of Sociality (Bratman) vs. Philosophy of Mind (Searle).
      *   *Section 1: Normative Force.* Contrast Bratman's interpersonal norms of planning vs. Searle's intrinsic commitment.
      *   *Section 2: Explanatory Status.* Contrast Bratman's reductive functionalism vs. Searle's non-reductive primitivism. Address the "naming the phenomenon" critique.
      *   *Section 3: Edge Cases.* Apply both to defection and partial agreement.
      *   *Conclusion:* Summarize the trade-off. Bratman gives mechanics; Searle gives phenomenology.

  7.  **Refine the Argument (Self-Correction during drafting):**
      *   *Check:* Did I answer the "same question" bit? *Correction:* Make sure to explicitly state that Bratman is asking about the *conditions* of joint action, while Searle is asking about the *nature* of the mental state.
      *   *Check:* Is the normative point clear? *Correction:* Emphasize that for Bratman, norms are about *stability of coordination*, whereas for Searle, it's about the *content of the mind*.
      *   *Check:* Is the critique of Searle fair? *Correction:* Acknowledge that Searle argues reduction is impossible, so "primitive" isn't a failure for him, but a necessity. But the user asked if it *risks* naming the phenomenon, so address that risk.

  8.  **Final Polish:** Ensure tone is analytical and philosophical, matching the user's level of sophistication. (Avoid oversimplifying "I intend" vs "We intend".)

  9.  *(Final Review against constraints)*: Three specific points addressed? Yes. Careful comparison? Yes. No simple summary? Yes.

  **(Self-Correction Note):** I need to be careful with Bratman's view on norms. He explicitly talks about "mutual obligations" arising from shared intention. It's not *just* description. I need to make sure I don't paint him as a pure descriptivist. His norms are *generated* by the structure, not *primitive*.

  **(Self-Correction Note on Searle):** Searle insists the "We" is in the head of the "I". It's not a group mind floating above. I must ensure I don't misrepresent him as a holistic collectivist. He is an individualist about the *location* of the mind, but non-reductionist about the *content*.

