answer: |-
  ### 1. Prerequisites and Conceptual Sequence

  **What must be in place first:**
  Before introducing mixed-strategy domination, you must explicitly establish **linearity of expected utility**. Students know how to calculate expected payoff, but they need to state formally that $u_i(\sigma_i, s_{-i}) = \sum_{k} p_k u_i(s_k, s_{-i})$. Without this algebraic fact, the convex-hull argument is magic rather than math.

  **Order of Operations:**
  1.  **Definition:** Define strict dominance by a mixed strategy ($\sigma_i$ strictly dominates $s_i$ if expected utility of $\sigma_i$ is strictly greater than $s_i$ against *all* opponent profiles).
  2.  **Geometry (The Convex Hull):** Immediately follow the definition with the geometric interpretation.
      *   *Placement:* This belongs **before** the carrier game.
      *   *Why:* It explains *why* we check mixtures. If you wait until the example, students treat the weights as arbitrary numbers to be solved for. The geometry shows they are looking for a point inside the span of other vectors.
      *   *Visual:* Plot the payoff vector of the candidate strategy against the payoff vectors of the other pure strategies. The candidate is dominated if and only if its vector lies strictly below the **upper envelope** (the convex hull) of the other strategies' vectors.
  3.  **The Carrier Game:** Apply the definition and geometry.
  4.  **Iteration:** Show the second round.
  5.  **NE Connection:** Link to Nash Equilibrium properties.

  ### 2. The Carrier Game

  **Recommendation:** Do **not** drop any of the three features you listed. A $3 \times 3$ game is sufficient to house all three without cognitive overload, provided the payoffs are integers. If you drop the "multi-round" feature, you fail to teach *Iterated* Elimination. If you drop "non-uniform," students will assume equal weighting is the heuristic. If you drop "pure-strategy uninformative," they won't see the necessity of the mixed extension.

  **Game Specifications:**
  *   **Dimensions:** $3 \times 3$ (Row Player has 3 strategies, Column Player has 3).
  *   **Structure:**
      1.  **Round 1:** Row 3 is strictly dominated by a mixture of Row 1 and Row 2 (weights $\neq 0.5$). No pure strategy dominates another initially.
      2.  **Round 2:** Once Row 3 is removed, Column 3 becomes strictly dominated (either by a pure strategy or a mixture of C1/C2).
      3.  **Payoffs:** Keep Row payoffs small integers to allow mental arithmetic for the weights.

  **Example Structure (for your reference):**
  *   **R1:** $(8, \dots), (0, \dots), (2, \dots)$
  *   **R2:** $(0, \dots), (8, \dots), (2, \dots)$
  *   **R3:** $(3, \dots), (3, \dots), (3, \dots)$
  *   *Logic:* A mixture of $p=0.5$ gives $(4, 4, 2)$, which dominates R3's $(3, 3, 3)$. To force non-uniformity, tweak R1/R2 so the intersection point is at $p=1/3$ or $2/3$.
  *   *Column Payoffs:* Ensure C3 yields high payoff against R3 but low payoff against R1/R2, so C3 dies only after R3 is deleted.

  ### 3. Lesson Flow and Misconception Defusal (50 Minutes)

  **0:00 – 0:10: Definition and Geometry**
  *   **Action:** Define mixed dominance. Draw the convex hull diagram on the board (axes = opponent's strategies, points = own payoffs).
  *   **Misconception 1 (Mixture as Choice):** *Defuse here.*
      *   *The Trap:* Students think the player must commit to randomizing to use this rule.
      *   *The Fix:* Use the phrase **"Hypothetical Benchmark."** State clearly: "We are not saying the player *will* mix. We are asking: *If* they could mix, could they beat this pure strategy in every scenario? If yes, the pure strategy is irrational."

  **0:10 – 0:30: The Carrier Game (Round 1 & 2)**
  *   **Action:** Write the matrix. Ask students to check for pure dominance (they will find none). Ask them to set up the inequalities for Row 3 being dominated by $p \cdot R1 + (1-p) \cdot R2$. Solve for $p$.
  *   **Misconception 2 (Mixture of Survivors):** *Defuse here.*
      *   *The Trap:* Students ask, "Now that R1 and R2 survive, do we check if the mixture $0.5R1+0.5R2$ is dominated?" or "Does the mixture become a new row?"
      *   *The Fix:* Explicitly state the **Object of Elimination**. "We only cross out *pure* strategies. The mixture is a ghost used to hunt pure strategies. It does not enter the matrix, and we do not test it for survival."
  *   **Action:** Delete Row 3. Re-evaluate Column player's strategies. Show Column 3 is now dominated. Delete Column 3.
  *   **Misconception 4 (Order Independence):** *Defuse here.*
      *   *The Trap:* Students assume this works for Weak Dominance too.
      *   *The Fix:* Put a red star next to "Strictly Dominated." Say: "This order-independence is a superpower of *Strict* dominance. If these were weak inequalities, the order of deletion would matter, and we could get different results. Next week we discuss why. Today, strict only."

  **0:30 – 0:40: Connection to Nash Equilibrium**
  *   **Action:** Ask: "In any Nash Equilibrium of the original game, what is the probability of Row 3?" (Answer: 0).
  *   **Misconception 3 (Dominated in MSNE):** *Defuse here.*
      *   *The Trap:* Students think a strategy dominated by a *mixture* might still be played with positive probability in an MSNE (confusing it with strategies that are not best responses but not dominated).
      *   *The Fix:* Invoke the **Fundamental Property**: "A strictly dominated strategy (by pure or mixed) is never a best response to any belief. Therefore, it has probability 0 in *any* Nash Equilibrium."

  **0:40 – 0:50: Assessment and Wrap-up**
  *   **Action:** Present the Assessment Question (below). Discuss briefly.

  ### 4. Assessment Question

  **The Question:**
  Present a $3 \times 2$ game where Row 3 is *not* dominated in the original game, but becomes dominated if Column 2 is removed. However, Column 2 is *not* dominated initially.
  *Ask:* "Can you eliminate any strategies using IESDS? If not, explain why the logic of mixed-strategy domination does not allow you to proceed, despite Row 3 looking 'weak' against Column 1."

  **Why this distinguishes understanding from recipe:**
  *   **Recipe Followers:** Will try to force an elimination or solve for MSNE.
  *   **Understanders:** Will recognize that IESDS requires a strategy to be dominated against *all* surviving opponent strategies. They will identify that Row 3 is not dominated against Column 2, and Column 2 is not dominated against Row 3. They will recognize the "cycle" of dependence cannot be broken by IESDS alone (this hints at Rationalizability without naming it).

  ### 5. Explicit Exclusions

  To stay within 50 minutes and scope, explicitly refuse to cover:
  1.  **Weak Dominance:** Do not define it. Do not show examples. If a student asks, say "That breaks order-independence; we cover it next week."
  2.  **Linear Programming:** Do not show how to solve for the dominating weights using Simplex or software. Stick to 2-strategy mixtures (one variable $p$) solvable by algebra.
  3.  **Formal Rationalizability:** Do not define the set $R_i$. Keep the language on "Iterated Elimination."
  4.  **Adding Mixtures to the Matrix:** Reiterate that the strategy space remains the set of pure strategies; mixtures are only tools for comparison.
