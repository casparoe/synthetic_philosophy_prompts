  8.  *(Final check on Maier's Theorem)*: Maier showed that $\pi(x+y) - \pi(x)$ oscillates more than Cramér predicts for $y = (\log x)^\lambda$. This is essentially saying the variance of the count in a window is under-estimated. In risk terms: Underestimating tail risk of cluster defaults in a short time window.

  9.  *(Final check on Singular Series)*: It accounts for the fact that primes avoid small factors. If $p=3$, $n, n+2$ can't both be divisible by 3. This increases the chance they are both prime relative to independence. This is *positive tail dependence* induced by exclusion constraints.

  10. *Structure the response:*
