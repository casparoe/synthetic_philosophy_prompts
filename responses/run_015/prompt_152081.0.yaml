      *   *Tranquilist Response:* "If there is no craving and no suffering, the specific content of the consciousness doesn't matter intrinsically. The calligraphy is just a complex way of achieving the zero-state. If they aren't doing it *for* tranquility, they are mistaken about the value, but the state itself is valuable *because* it lacks craving."
      *   *Weakness:* It ignores the *content* of the experience. Is a person staring at a wall in a zero-state equal in value to a master calligrapher in a zero-state? Tranquilism says yes (if craving/suffering are equal). This is the "Experience Machine" objection variant.

