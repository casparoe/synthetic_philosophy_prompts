          *   *Cost:* Accepting complicity in inequality to secure welfare for your child.

  6.  **Addressing the Decision:**
      *   Don't let them off easy. The "Social Model" argument is strong *culturally*, but the "Language Window" argument is strong *biologically*.
      *   The risk of waiting (missing the window) is irreversible. The risk of CI (surgery, variable outcomes, cultural loss) is significant but manageable.
      *   Advice: You can do both. CI *and* Sign Language. This bridges (2)/(3) and the medical advice. It hedges the bet.
      *   Challenge: Are you willing to raise her Deaf *and* Hearing? It's work. But it respects the tension.

  7.  **Identifying AI Weakness (The "Flip" Condition):**
      *   Where am I most likely wrong?
      *   I don't know the *degree* of hearing loss. "Significant" varies.
