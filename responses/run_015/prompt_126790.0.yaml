      *   *Tension B: (2) & (3) vs. Decision to Implant.* If disability is social and we should change the environment first, why choose the surgical intervention (changing the body) now? This is the core practical conflict.
      *   *Tension C: (4) vs. (5).* Parental latitude vs. Justice/Equality. If parents choose freely, inequality (rich kids get it first) persists. If justice requires leveling, parental choice might need constraint (or at least creates moral discomfort).
