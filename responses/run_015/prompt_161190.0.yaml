prompt: |-
  Two people in the ethics reading group I sit in on — Mara, a postdoc, and Dev, who's finishing his PhD — got into a long argument after we went over Bernard Williams's integrity objection to utilitarianism and his one-thought-too-many point about the man who saves his wife rather than a stranger. I was supposed to referee and totally failed. Rough reconstructoin, eight moves:

  (1) Mara: the integrity objection isn't a distinct objection at all, it's the demandingness objection in nicer clothes. Williams is really saying that impartial maximizing costs the agent too much — it asks her to abandon the projects she's built her life around. But consequentialists have a standing reply to that: scale the demand down, or go indirect. So all the talk of integrity does is dramatize a cost that any plausible consequentialism already counts.

  (2) Dev: that misses the shape of it. Demandingness says the requirement is too costly; integrity says the requirement is the wrong kind of thing. Even a modest impartial demand — take the efficient job instead of the one you actually want, give away a tenth of your income — still makes the agent treat her deepest commitments as one input among others, revisable whenever the ledger says so. The complaint isn't about the size of the sacrifice, it's that the theory leaves her no way to be for anything in particular. Proof that they're separate objections: satisficing consequentialism answers demandingness completely and does nothing whatsoever for integrity.

  (3) Mara: then make the dilemma explicit. Either the loss of integrity is a bad consequence for the agent, in which case consequentialism can weigh it and the objection just is demandingness again; or it isn't a matter of consequences at all, in which case Williams has helped himself to a non-consequentialist value and the argument is circular against utilitarianism. Either way his objection isn't the independent thing Dev says it is. Also: if integrity is a cost, the theory that counts it is the theory that respects it, and Williams can't complain that being counted is itself the insult.

  (4) Dev: the dilemma only looks forceful if you assume everything that matters shows up as a cost to be traded off. Integrity is also a claim about what an agent is permitted to be moved by, and about what she can acknowledge as her reason. That's what the one-thought-too-many bit is doing: the man who saves his wife isn't being asked to do something exhausting, and he might not be sacrificing anything. Williams's point is that if the impartial consideration is what moves him, or what he thinks he has to appeal to, something has gone wrong in his relation to his own action. And note the objection doesn't scale with cost — it bites on easy acts too. So it can't be demandingness.

  (5) Mara: that just relocates it. What the one-thought-too-many case shows is at most something about deliberation, not about rightness. There's a perfectly standard distinction between the criterion of rightness and the decision procedure: the right act is the optimific one, and good agents very often shouldn't calculate — they should act from love, loyalty, habit. The wife-rescuer isn't defective for not running the numbers, he's just not using the procedure. But Williams needs his objection to be about what's right. If it's only about which thoughts should run through your head, he's giving psychological hygiene tips and hasn't touched utilitarianism as a theory of what to do.

  (6) Dev: if the gap between the criterion and the agent's actual reason is that wide, the theory has stopped being a theory of what to do in the only sense that matters. Ask the rescuer why he did it and he says: she's my wife. Now suppose he also believes that answer is really just shorthand for some impersonal fact about aggregate value. Then on his own theory the reason he'd cite isn't the reason he has — his first-personal reason has been demoted to a useful illusion. That's not advice about mental tidiness, that's a claim about which reasons he has, and it's incompatible with his reasons being what he takes them to be. Integrity is just the demand that your moral theory let your real reasons be your real reasons.

  So far so good — then they each produced a case, and this is where I got properly lost.

  (7) Mara's case: a committed aid worker pulls her own sister out of a burning car, and while doing it has a split-second thought along the lines of would this be defensible from an impartial standpoint? But — and this is her point — the thought isn't what moves her, she wouldn't cite it if asked, and if the answer had come back no she'd have done it anyway. It's more like a pilot running a checklist: the thought occurs in a monitoring register rather than an operative one. Is that one thought too many? If not, Williams's objection is about the role a thought plays rather than about its content or even its occurence, and then the consequentialist can just reply: fine, we'll keep the impartial consideration in the monitoring role only, and the objection has no bite against the criterion.

  (8) Dev's case: take the mirror agent — someone whose one deep ground project *is* impartial benevolence, whose identity is basically I maximize welfare, who has no competing personal attachments and would be wretched doing anything else. Utilitarianism asks nothing of him that conflicts with his commitments: no cost, no alienation, no dirty hands. If integrity means don't turn me into a channel for impersonal value, the mirror agent already is that channel and is delighted about it. So either Williams has no complaint here at all — which shows the objection is contingent on people happening to have partial projects, i.e. it's a bit of moral psychology rather than a constraint on moral theory — or Williams does have a complaint, which means integrity was never about matching the agent's existing commitments, it's a substantive ideal about which commitments are permissible ones to have. And that version is much harder to argue for.

  They went round about four more times without moving: Mara said the mirror case exposes Williams as a covert perfectionist, Dev said the checklist case exposes consequentialists as compartmentalizers who want the impartial view to be the real reason in the seminar room and no reason at all in the fire. I couldn't tell who'd won and I still can't.

  Can you go through it move by move and say who's right about what — not just who wins? I'd especially like: a verdict on each of the eight moves, whether the dilemma in (3) actually holds, whether Dev is right in (6) that the criterion-versus-procedure reply doesn't save consequentialism, and whether the two cases at the end really test what each of them claimed they test, or whether one (or both) of them is a dud that changes nothing. And: what's the thing they're both missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the Request:**
      *   **Context:** An ethics reading group discussion on Bernard Williams's integrity objection to utilitarianism (specifically the "one thought too many" argument).
      *   **Participants:** Mara (Postdoc, defending a consequentialist-friendly view/reducing integrity to demandingness) vs. Dev (PhD student, defending Williams's distinct integrity objection).
      *   **Task:** Analyze the 8 moves in the reconstruction.
      *   **Specific Questions:**
          *   Verdict on each of the 8 moves (who's right about what?).
          *   Does Mara's dilemma in (3) hold?
          *   Is Dev right in (6) that the criterion/procedure distinction fails?
          *   Do the cases in (7) and (8) test what they claim, or are they duds?
          *   What is the thing *both* are missing?

  2.  **Deconstruct the Arguments (Mental Sandbox):**

      *   **Williams's Core Claim:** Utilitarianism alienates the agent from their actions and commitments by requiring them to view their own projects impartially. The "one thought too many" suggests that appealing to impartial utility to save a spouse corrupts the relationship.
      *   **Mara's Strategy:** Reductionism. Integrity is just a psychological cost. If it's a cost, Consequentialism (C) counts it. If it's not a cost, it's question-begging. Also, Criterion vs. Decision Procedure saves C.
      *   **Dev's Strategy:** Distinctness. Integrity is about the *source* of reasons, not the *weight*. It's about alienation, not exhaustion. Criterion/Procedure distinction creates a split in the agent's mind (alienation).

      *   **Move (1) Mara:** Integrity = Demandingness.
          *   *Critique:* Standard consequentialist move. Williams explicitly denies this. Demandingness is about *how much*; Integrity is about *what kind*.
      *   **Move (2) Dev:** Integrity $\neq$ Demandingness. Satisficing C solves demandingness but not integrity.
          *   *Critique:* Strong point. Even a little bit of impartial calculation corrupts the personal reason.
      *   **Move (3) Mara:** The Dilemma. (A) Integrity is a cost -> C counts it. (B) Integrity is non-consequential value -> Begging the question.
          *   *Critique:* This is the "Consequentialization" trap. Williams argues C *cannot* count it properly because counting it turns the commitment into a preference, stripping it of its status as a *ground project*.
      *   **Move (4) Dev:** Reasons, not Costs. One thought too many is about deliberative structure, not sacrifice.
          *   *Critique:* This captures Williams's phenomenological point.
      *   **Move (5) Mara:** Criterion vs. Procedure. C says what's right, not how to think.
          *   *Critique:* Standard defense (Railton, etc.). Williams thinks this creates "government house" utilitarianism or self-alienation.
      *   **Move (6) Dev:** The Split. If the criterion is the "real" reason, the agent's lived reason is an illusion.
          *   *Critique:* This hits the "alienation" point hard. It challenges the coherence of the agent under C.
      *   **Move (7) Mara:** The Checklist Case. Impartial thought as monitoring, not motive.
          *   *Critique:* Clever. Tries to show impartiality can be backgrounded. But does it solve the "one thought" issue? Williams might say the *availability* of the thought as a justification is the problem.
      *   **Move (8) Dev:** The Mirror Agent (Saint Utilitarian).
          *   *Critique:* This is a classic counter-example to Williams. If someone *wants* to maximize, C doesn't alienate them. Williams might reply that C still demands they *be* that way, or that the objection is about the *structure* of morality, not just fit.

  3.  **Drafting the Analysis (Iterative Process):**

      *   *Move 1 (Mara):* She's partially right that they overlap, but wrong that they are identical. Williams distinguishes them. Verdict: Plausible reduction, but misses Williams's specific phenomenological point.
      *   *Move 2 (Dev):* Strong. Satisficing C proves they are distinct. If I only have to do *some* good, I still can't save my wife *because* she's my wife if the theory says I must justify it impartially. Verdict: Dev wins on distinctness.
      *   *Move 3 (Mara):* The Dilemma. This is the "Consequentialization of Morality" argument. It holds *within* consequentialism but begs the question *against* Williams. Williams says some values lose their nature when converted to utils. Verdict: Logically valid internally, but question-begging externally.
      *   *Move 4 (Dev):* Reasons vs. Costs. This is the heart of Williams. It's about the "source of motivation." Verdict: Dev is right here; this is Williams's actual point.
      *   *Move 5 (Mara):* Criterion/Procedure. This is the "Indirect Utilitarianism" defense. Verdict: Technically open to C, but vulnerable to Dev's next point.
      *   *Move 6 (Dev):* The Alienation Reply. If the Criterion is the Truth, the Procedure is a Lie. This creates a fractured self. Verdict: Dev lands a heavy blow here. This is the strongest philosophical point in the exchange.
      *   *Move 7 (Mara):* The Checklist. Can we compartmentalize? Verdict: Interesting, but risks hypocrisy or self-deception. It mitigates the objection but doesn't dissolve it. It tests the *role* of the thought, which is fair.
      *   *Move 8 (Dev):* The Mirror Agent. Does Williams object to the Saint? Verdict: This tests whether Integrity is subjective (fit) or objective (structure). Williams likely thinks C is wrong even for the Saint because it validates a dangerous moral structure. But Dev is right that it complicates Williams's "alienation" claim.

      *   *The Missing Thing:* What are they both missing?
          *   They are treating Integrity as a property of the *agent* (psychology) vs. the *theory* (normativity).
          *   Maybe the missing piece is the **Political/Social dimension**? Williams is also worried about the "Government House" aspect.
          *   Or, more likely, they are missing the **Nature of Ground Projects**. Williams isn't just saying "I want this." He's saying "This constitutes who I am." Utilitarianism treats the self as a vessel.
          *   Actually, a better "missing thing" might be the **distinction between justification and motivation**. Mara tries to collapse them (Criterion/Procedure). Dev tries to separate them (Real Reasons). The missing piece is that Williams thinks the *justificatory structure* of the theory inevitably colonizes the *motivational structure* of the agent over time. They are debating the *current* state, missing the *temporal/corrosive* aspect of adopting the theory.
          *   *Alternative Missing Thing:* They are debating Williams vs. Consequentialism, but missing that Williams is arguably describing a **tragedy**, not offering a solution. He's saying morality *itself* (systematic morality) might be the problem, not just Utilitarianism. Both assume a systematic theory is possible.

      *   *Refining the "Missing Thing":* I think the strongest philosophical gap is that they are arguing about *psychological feasibility* (Can a utilitarian love?) vs. *normative authority* (Does utilitarianism get to judge that love?). They miss that Williams's point is arguably **meta-ethical**: Utilitarianism misdescribes the nature of practical reason. It assumes all reasons are commensurable. Williams thinks some reasons (projects) are constitutive and not commensurable. Mara assumes commensurability (Move 3). Dev defends incommensurability but gets stuck on the "Mirror Agent." The missing piece is the **Incommensurability of Value**.

  4.  **Finalizing the Verdicts:**

      *   (1) Mara: Over-simplification.
      *   (2) Dev: Correct distinction.
      *   (3) Mara: Valid dilemma *if* you accept consequentialist axioms, but begs the question against Williams.
      *   (4) Dev: Accurate reading of Williams.
      *   (5) Mara: Standard defense, viable but costly.
      *   (6) Dev: The strongest point. Exposes the cost of (5).
      *   (7) Mara: Clever mitigation, but doesn't solve the alienation if the "monitor" is the true judge.
      *   (8) Dev: Strong counter-example to the "alienation" phrasing, forces Williams to clarify if integrity is subjective or objective.

      *   *Who Won?* Dev defended Williams better. Mara defended Consequentialism's coherence but conceded the phenomenological ground.
      *   *Missing:* The Meta-ethical claim about Commensurability.

  5.  **Review against Constraints:**
      *   Go through move by move.
      *   Verdict on the dilemma (3).
      *   Verdict on criterion/procedure (6).
      *   Verdict on cases (7 & 8).
      *   Identify the missing element.
      *   Tone: Analytical, philosophical, fair to both sides.

  6.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction on Move 3:* Make sure to explain *why* it begs the question. It assumes values can be translated into "costs" without loss of meaning. Williams denies this.
      *   *Correction on Move 8:* Ensure I note that Williams *does* have a response to the Saint (the "negative responsibility" or the structural point), but Dev is right that it pressures the "alienation" formulation.
      *   *Missing Thing:* I'll focus on **Commensurability**. Mara assumes everything can be weighed (Move 1 & 3). Dev defends the distinctness but doesn't explicitly name the meta-ethical root. Williams's real point is that Utilitarianism assumes a single currency of value.

  7.  **Final Polish:** Check clarity and ensure all parts of the prompt are answered. (The prompt asks for "who's right about what," not just "who wins.")

      *(Self-Correction on "Who Wins"):* I should avoid declaring a simple winner. Philosophy debates rarely have knockouts. I should assess dialectical advantage. Dev seems to have the better grasp of Williams, Mara has the better grasp of Consequentialist defense mechanisms.

      *(Refining the "Missing Thing"):* Is it just commensurability? Or is it that Williams is attacking the *priority* of morality? Williams suggests that if morality demands you abandon your ground projects, so much the worse for morality. Both Mara and Dev assume morality must win or be fixed. Williams is more skeptical. I will combine the Commensurability point with the Skepticism point.

      *Let's stick to the Commensurability/Constitutive Reasons point as the primary missing element, as it directly addresses the Integrity vs. Cost debate.*

      *Wait, one more check on Move 7:* Mara's "Checklist" case. Is it a dud? It's not a dud, it's a sophisticated version of Indirect Utilitarianism. But Dev's reply (Compartmentalization) is strong. I need to evaluate if it *tests* what she claims. She claims it tests the *role* of the thought. It does. But it fails to address the *authority* of the thought.

      *Okay, ready to write.*
answer: |-
  This is a sharp reconstruction of a classic debate. Mara is arguing from the position of a sophisticated consequentialist (likely a rule- or indirect-utilitarian), while Dev is channeling Williams's phenomenological and meta-ethical critique.

  Here is the move-by-move analysis, followed by the specific verdicts you requested and the identification of the missing element.

  ### Move-by-Move Analysis

  **(1) Mara: Integrity is just Demandingness.**
  *   **Verdict:** **Plausible but reductive.** Mara is right that in *practice*, integrity violations often feel like excessive demands. However, she is wrong to claim they are theoretically identical. Williams explicitly distinguishes them: demandingness is about the *quantity* of sacrifice; integrity is about the *source* of the requirement. Mara is trying to "consequentialize" the objection by turning a structural complaint into a utility cost.
  *   **Who's right:** Mara identifies a correlation, but Dev is right that it's not an identity.

  **(2) Dev: Integrity is distinct; Satisficing proves it.**
  *   **Verdict:** **Correct.** This is Dev's strongest early point. If I only have to do *some* good (satisficing), the demand is low, so demandingness is solved. But if I still have to justify saving my wife by checking if it fits the "some good" quota, the integrity objection remains. The complaint is about the *framework of justification*, not the *amount of output*.
  *   **Who's right:** Dev. This successfully decouples the two objections.

  **(3) Mara: The Dilemma (Cost vs. Question-Begging).**
  *   **Verdict:** **Valid internally, question-begging externally.** This is the standard consequentialist trap.
      *   *Horn A:* If integrity loss is a bad state of affairs, consequentialism counts it. (True, but misses Williams's point that counting it changes its nature).
      *   *Horn B:* If it's not a consequence, it's an external value. (True, but Williams *is* offering an external value).
      *   Mara assumes that for a value to be valid, it must be translatable into the theory's currency. Williams denies the currency is universal.
  *   **Does the dilemma hold?** It holds only if you accept consequentialism's meta-ethical premise that all values are commensurable. Against Williams, it begs the question.

  **(4) Dev: Reasons, not Costs (The One Thought).**
  *   **Verdict:** **Accurate to Williams.** Dev correctly identifies that Williams is making a point about *practical reasoning*, not welfare economics. The "one thought too many" is about what constitutes a valid motive for *this* relationship. If the thought is "impartial utility," the relationship is instrumentalized.
  *   **Who's right:** Dev. This captures the phenomenological core of the objection.

  **(5) Mara: Criterion of Rightness vs. Decision Procedure.**
  *   **Verdict:** **Standard Defense.** This is the Railton/Smart move. Utilitarianism tells you what is right (criterion), not necessarily what to think about while acting (procedure). Direct motivation by love is often optimific.
  *   **Who's right:** Mara is technically correct that utilitarianism *can* say this. But it opens the door to Dev's next move.

  **(6) Dev: The Split (Alienation).**
  *   **Verdict:** **Dev lands the heavy blow.** If the Criterion is the *truth* about why the act is right, and the Agent's Reason (love) is merely a *tool* to get there, the agent is living a lie. Their "real" reasons are demoted to illusions. This is the definition of alienation.
  *   **Does the Criterion/Procedure reply save Consequentialism?** **No, not from the integrity objection.** It saves the *coherence* of the theory, but at the cost of fracturing the agent. It concedes that the agent cannot fully endorse the theory's justification of their own action. Dev is right: this isn't hygiene; it's self-alienation.

  **(7) Mara's Case: The Checklist (Monitoring Role).**
  *   **Verdict:** **Not a dud, but insufficient.** Mara tries to show that impartiality can be backgrounded (a pilot's checklist). This tests whether the *occurrence* of the thought is the problem or its *motivational force*.
      *   *Does it test what she claims?* Yes, it tests the role of the thought.
      *   *Does it work?* Only partially. Dev's reply (in the summary) is strong: if the checklist is the *authority* (the seminar room truth), then the love is subordinate. If the pilot ignores the checklist, is she wrong? If yes, the checklist rules. If no, why have it? It exposes the consequentialist as wanting to have it both ways: impartiality is the boss, but we pretend it isn't to keep agents sane.
  *   **Who's right:** Mara shows a possible psychological workaround, but Dev is right that it doesn't solve the normative hierarchy.

  **(8) Dev's Case: The Mirror Agent (The Utilitarian Saint).**
  *   **Verdict:** **Strong counter-example to Williams's phrasing.** This tests whether Integrity is about *fit* (subjective) or *structure* (objective).
      *   *Does it test what he claims?* Yes. It challenges whether Williams's objection is universal or contingent on human psychology.
      *   *Is it a dud?* No. It forces Williams to clarify: Is integrity violated because the agent *feels* alienated, or because the theory *structures* reasons incorrectly?
      *   *Outcome:* If Williams says the Saint is fine, integrity is subjective (psychological fit). If Williams says the Saint is *also* alienated (because even their love is mediated by utility), then integrity is an objective constraint on moral theory. Dev is right that the latter is harder to argue for, but it is likely Williams's actual view (the theory is wrong, not just the fit).
  *   **Who's right:** Dev exposes a vulnerability in Williams's "alienation" language, but Mara's conclusion (that Williams is a covert perfectionist) is a bit of a stretch. Williams is a skeptic about moral theory, not a perfectionist.

  ### Specific Verdicts

  **1. Does the dilemma in (3) actually hold?**
  **No, not against Williams.** It holds only within a consequentialist framework. Mara's dilemma assumes that "what matters" must be capturable as a "cost" or "value" within a single calculus. Williams's entire point is that **ground projects are constitutive of the self**, not items *for* the self to weigh. To turn integrity into a cost is to destroy the very thing you are trying to save. It's like saying, "Either your humanity is a cost we can weigh, or it's magic." Williams says it's neither; it's the precondition for weighing.

  **2. Is Dev right in (6) that the criterion-versus-procedure reply doesn't save consequentialism?**
  **Yes.** The criterion/procedure distinction saves the *theory* from contradiction, but it sacrifices the *agent's integrity*. It creates a "Government House" utilitarianism where the truth of the theory is too dangerous for the agent to fully inhabit. If the agent cannot cite the theory's reason as their own without corruption, the theory has failed to provide a practical guide for *that agent*. Dev is right: it creates a split between the "truth of the act" and the "truth of the agent."

  **3. Do the two cases at the end (7 & 8) test what they claimed?**
  *   **Mara's Checklist (7):** **Yes, but it fails.** It successfully isolates the *role* of the impartial thought. However, it fails to defend integrity because it admits the impartial thought retains *veto power* (the monitor). If the monitor can override the love, the love is not a ground project; it's a subordinate impulse.
  *   **Dev's Mirror Agent (8):** **Yes, and it bites.** It successfully pressures Williams. It shows that "alienation" is ambiguous. Does it mean "feeling torn" or "being structurally mediated"? Dev is right that if it's the latter, Williams needs a stronger meta-ethical argument than just "it feels bad."

  **4. Who won?**
  **Dialectically, Dev.** Mara successfully defended the *coherence* of consequentialism (it can account for integrity as a cost, it can separate criterion and procedure), but she conceded the *phenomenological* ground. She admitted that to make consequentialism work, the agent must either treat their commitments as costs (1), hide the true justification from themselves (5/7), or become a different kind of person (8). Dev successfully showed that consequentialism preserves its theory only by fracturing the agent.

  ### The Thing They Are Both Missing

  They are debating **Psychology vs. Normativity**, but they are missing the **Meta-Ethical Root: Commensurability.**

  Both Mara and Dev assume the debate is about how an agent *feels* or what they are *permitted to do*. They are missing Williams's deeper claim: **Utilitarianism assumes all values are commensurable on a single scale.**

  *   **Mara** assumes this implicitly (Move 1 & 3). She thinks integrity can be "weighed."
  *   **Dev** defends integrity as distinct (Move 2 & 4) but treats it largely as a constraint on *reasons* or *identity*.

  **The Missing Point:** Williams is arguing that some commitments (like loving a wife) are **constitutive**. They are not *inputs* into deliberation; they are the *framework* that makes deliberation possible for that person.
  *   When Mara says "count it as a cost," she is saying the wife is a preference.
  *   When Dev says "it's a distinct reason," he is close, but he doesn't explicitly attack the **single-currency assumption**.

  **The Real Knockout:** Williams isn't just saying Utilitarianism is too hard (Demandingness) or feels bad (Integrity). He is saying Utilitarianism is **category-error**. It treats the *subject* of the moral life (the person with projects) as merely the *location* where moral value is calculated.
  *   **Mara** misses this because she thinks the "self" is just another container of utility.
  *   **Dev** misses this because he focuses on the *conflict* of reasons rather than the *impossibility* of the translation.

  **Final Word:** Dev defended Williams better, but neither fully articulated that Williams's objection is not that Utilitarianism asks too much of the self, but that it **misdescribes what a self is.** Mara thinks the self is a vessel for value; Williams thinks the self is the *source* of value through its projects. Until that meta-ethical disagreement is named, they will talk past each other forever.
