answer: |-
  Your instinct that there is a bug in the arithmetic is correct, and Bentham would likely agree, though for reasons rooted in his empiricism rather than your entomological expertise. The scale argument attempts to smuggle ontological uncertainty into a calculus designed for consequential uncertainty. When Bentham defines "extent" as the number of persons affected, he is counting confirmed interested parties. His procedure begins with a single individual whose capacity for suffering is established, then sums across similar entities. He does not provide a slot for multiplying the headcount by a probability of sentience. To Bentham, a being is either a participant in the moral community or it is not; there is no fractional personhood. The scale argument treats sentience as a variable within the equation, whereas Bentham treats it as a threshold condition for entering the equation. If the evidence for suffering is weak, the entity does not enter the sum at all. Thus, extent does not do the work the argument needs; it acts as a gatekeeper, not a multiplier.

  This distinction clarifies how "certainty" interacts with the problem. In the felicific calculus, certainty refers to the likelihood that a specific pain or pleasure will *occur* given an action, not the likelihood that the being *can feel* it. Bentham assumes the capacity for suffering is a known property of the subjects involved. When you introduce the probability of sentience itself, you are asking the calculus to process an input it cannot digest. Bentham would likely collapse this ontological uncertainty into the evidential standard required to grant status in the first place. He relies on behavioral analogy: if it screams like a dog, it suffers like a dog. Insects do not scream, nor do they exhibit behaviors analogous enough to human pain for an 1789 empiricist. Consequently, he would assign the probability of their sentience as effectively zero for moral calculation, deflating the scale argument before the multiplication begins.

  Regarding the larvae and short-lived juveniles, Bentham's circumstance of "duration" would indeed reduce the weight of individual insect lives compared to vertebrates. However, "fecundity"—the chance of being followed by sensations of the same kind—might theoretically amplify the weight of breeding populations. Yet, this only matters if the initial sensation is established. Without confirmed sentience, duration and fecundity are irrelevant multipliers of zero. Your wrinkle about the relevant number being orders of magnitude smaller is less important to Bentham than the fact that the number might be zero.

  Here is where the exercise breaks down: Bentham is a bad guide for this specific case because he lacks the evolutionary framework to see continuity where you see systematics. He has no concept of conserved neural mechanisms or nociceptors. He relies entirely on external observation. A post-Darwin utilitarian has the continuity of mind story available to lean on, making them far more likely to accept the premise that insects suffer, and thus more vulnerable to the scale argument. Bentham, lacking this biological bridge, would be scandalized by the suggestion that a swarm of beetles could outweigh a single human in the moral arithmetic. He would view this not as a discovery, but as an absurdity resulting from poor evidence. He explicitly prioritizes the quality of evidence for suffering over the sheer quantity of obscure lives. To suggest that the moral weight of a man could be swamped by the probabilistic twitching of aphids would violate his pragmatic requirement for observable interests.

  He would not say the calculus breaks; he would say the data is missing. The calculus remains intact, but the input required by the scale argument—probabilistic personhood—is rejected. He has the resources to deflate the argument by demanding higher evidential standards for sentience than the scale argument permits. He would reject the multiplication of uncertain persons as a category error. The scale argument tries to bypass the question "Can they suffer?" with the answer "Maybe, but there are so many of them." Bentham insists you must answer "Yes" before you count them. Without the Darwinian continuity to lower the bar for that "Yes," Bentham stands firm on the side of the vertebrates.

  \answer{SCALE_LOSES}
