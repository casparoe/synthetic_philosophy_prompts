answer: |-
  Here is the breakdown you asked for, structured as a menu of distinct philosophical claims hidden inside your friend's objection, followed by verdicts, an application to the jealousy hypothesis, and my uncertainty admission.

  ### Part 1: Brainstorming the Hidden Claims
  The sentence "Darwinism isn't falsifiable, so anything built on it isn't science either" compresses at least six distinct philosophical assertions. Here they are disentangled:

  1.  **The Tautology Claim:** Natural selection is analytically true (e.g., "survival of the fittest" defines fitness by survival), so it predicts nothing empirical.
  2.  **The No-Prohibition Claim:** The theory of natural selection forbids no observable state of affairs on its own; it requires auxiliary assumptions (heritability, variation, constraints) to generate predictions.
  3.  **The Demarcation Claim:** Any theory that is not falsifiable is not empirical science (and implies it shouldn't be treated as such in rational discourse).
  4.  **The Inheritance Claim:** If the foundational framework (Darwinism) is metaphysical/unfalsifiable, then any specific hypothesis built upon it (evo-psych adaptationism) inherits that unfalsifiability.
  5.  **The Conflation Claim:** "Darwinism" refers indiscriminately to common descent (history) and natural selection (mechanism), and the unfalsifiability charge applies equally to both.
  6.  **The Just-So Claim:** Adaptationist explanations are inherently post-hoc narratives that cannot be independently tested from the outcome they explain.

  ### Part 2: The Menu with Verdicts
  Here is the assessment of each claim, including whether it supports your friend's conclusion, along with my confidence estimates (based on internal knowledge of the history of philosophy of science, without external lookup).

  **1. The Tautology Claim**
  *   **Verdict:** **Probably False (as stated).** While Popper initially leaned on this (influenced by critics like Flew), it was resolved by the "propensity interpretation" of fitness (fitness is a probabilistic causal property, not just a count of survivors). Popper himself moved away from this in his recantation.
  *   **Supports Friend's Conclusion?** No. If selection isn't a tautology, it can be testable.
  *   **Confidence:** 90%

  **2. The No-Prohibition Claim (Duhem-Quine)**
  *   **Verdict:** **Substantive and Defensible.** This is the strongest philosophical point. A universal principle like "organisms adapt to niches" forbids nothing unless you specify the niche, the variation available, and the genetic constraints. Popper was right that *universal* selection is hard to isolate.
  *   **Supports Friend's Conclusion?** Only partially. It shows *general* selection is hard to test, but not that *specific* models are impossible to test.
  *   **Confidence:** 95%

  **3. The Demarcation Claim**
  *   **Verdict:** **True to Popper, Debated Generally.** This is Popper's core criterion. However, most modern philosophers of science reject strict falsificationism as the sole demarcation line (Lakatos, Kuhn, etc.).
  *   **Supports Friend's Conclusion?** Yes, *if* you accept strict Popperian demarcation. But even Popper allowed metaphysics to be meaningful.
  *   **Confidence:** 98% (on Popper's view), 70% (on its correctness).

  **4. The Inheritance Claim**
  *   **Verdict:** **False.** This is a logical error. A metaphysical framework can generate testable specific theories. (Example: "Atomism" was metaphysical for centuries, but specific atomic models became testable). The status of the framework does not dictate the status of the model.
  *   **Supports Friend's Conclusion?** No. This is the weak link in his argument against the jealousy hypothesis.
  *   **Confidence:** 92%

  **5. The Conflation Claim**
  *   **Verdict:** **False.** Popper explicitly distinguished between common descent (which he accepted as well-tested history) and natural selection (which he doubted was testable as a universal mechanism). Your friend claims the recantation was about descent, not selection. **The historical record is the opposite:** Popper's recantation was specifically about the *mechanism* of natural selection.
  *   **Supports Friend's Conclusion?** No. It reveals a historical misunderstanding on his part.
  *   **Confidence:** 85%

  **6. The Just-So Claim**
  *   **Verdict:** **Substantive but Distinct.** This is Gould and Lewontin's argument (1979), not Popper's. It overlaps, but it's about methodology (lack of independent evidence for selection pressures), not logical falsifiability.
  *   **Supports Friend's Conclusion?** Yes, effectively. If the hypothesis is a "just-so story," it's not science. But this requires arguing about the *specific* jealousy model, not invoking Popper on Darwinism generally.
  *   **Confidence:** 90%

  **Most Likely What Your Friend Meant:**
  He likely meant a blend of **Claim 2 (No-Prohibition)** and **Claim 6 (Just-So)**, wrapped in the authority of **Claim 3 (Demarcation)**. He is using Popper as a trump card to assert that evo-psych stories are inherently untestable narratives.
  *   **Confidence:** 88%

  ### Part 3: Application to the Jealousy Hypothesis
  Does the claim "Darwinism isn't falsifiable" kill the specific hypothesis that *male sexual jealousy tracks cues of infidelity rather than actual cost*?

  **Verdict:** **No.** Even if the *general theory* of natural selection were metaphysical (which Popper later denied), the *specific model* of jealousy can be formulated to be falsifiable. The logical status of the framework does not transfer to the specific instantiation.

  Your friend's argument fails to engage with the hypothesis itself. To assert that the jealousy hypothesis is unfalsifiable, he must show that *this specific model* forbids no observable outcome, not that natural selection forbids no outcome.

  **What extra commitments are needed to make the jealousy hypothesis testable?**
  To move this from a "metaphysical story" to a "scientific theory" (satisfying even a strict Popperian), the proponent must specify **risk conditions**—states of the world that would prove the hypothesis wrong. Based on standard evo-psych methodology, they would need to commit to:

  1.  **Universality vs. Variation:** A claim about whether the cue-tracking mechanism should be a human universal or vary predictably with local paternity uncertainty rates. (If it varies culturally without tracking ancestral cues, the adaptation claim weakens).
  2.  **Physiological Specificity:** A claim that jealousy responses (cortisol, heart rate) should trigger more strongly to *cue-based* stimuli (e.g., partner flirting) than *cost-based* stimuli (e.g., partner losing income), controlling for cultural conditioning.
  3.  **Heritability/Genetic Component:** Evidence that the variation in jealousy responses has a genetic component (twin studies), otherwise it's cultural transmission, not biological adaptation.
  4.  **The "By-Product" Null:** An explicit commitment that if the jealousy response correlates perfectly with a general fear-of-loss mechanism (a spandrel), the adaptation hypothesis is rejected.

  Without these auxiliaries, the hypothesis is indeed unfalsifiable. But that is a failure of the *evo-psych model*, not a failure of *Darwinism*.

  ### Part 4: The Uncertainty Admission
  You asked me to single out the one thing in this answer I am least sure of, without uniform hedging.

  **The Thing:** The precise **philosophical utility Popper assigned to the "metaphysical research programme"** in his 1974 statement versus his 1978 recantation.

  **Why:** I am highly confident (95%+) that the quotes you provided are real and that the recantation occurred in the 1978 paper *"Natural Selection and the Emergence of Mind."* I am also confident that Popper distinguished between common descent and natural selection. However, I am less certain (around 75%) about the specific *nuance* of what Popper thought the metaphysical programme was still *good for* after he recanted on its testability. Did he retain the view that it was a useful *heuristic* framework even if testable? Or did he fully upgrade it to a standard scientific theory with no metaphysical residue? The exact boundary he drew in his later mind between "metaphysical framework" and "testable theory" regarding selection is the fuzziest part of my recollection without looking up the specific text of the 1978 dialectica paper.

  **Confidence in this uncertainty:** 90% (I am sure this is the fuzziest part of my knowledge here).
