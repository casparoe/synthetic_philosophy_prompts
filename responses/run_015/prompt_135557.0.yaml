answer: |-
  Good morning. Thank you for being here.

  Looking around this room, I see a tension that usually stays hidden behind closed doors. On one side, we have the historians who know these objects intimately—their textures, their histories, the hands that made them. On the other, we have the curators and the lawyers who manage the structures that hold them. Usually, when we talk about restitution, the conversation gets stuck in a loop. We talk about the Benin Bronzes, we talk about title deeds, we talk about shipping logistics. We treat restitution like a real estate transaction where the only question is *who* holds the deed.

  But that framework is too narrow. It assumes the object is static. It assumes a brass head is the same thing whether it's sitting on a shrine in Edo State or behind glass in London. It isn't.

  Here is the knot we need to untie: Restitution debates almost always frame the problem as legal ownership plus physical return. They rarely ask what kind of *thing* is being returned. Those plaques and figures weren't made to sit in climate-controlled cases with wall labels. They were embedded in ritual economies where their presence was functional and relational, not contemplative. In their original context, they were agents. They did work. They mediated between the living and the ancestors. In the museum, they are rendered inert. They become "art" or "artifact," categories that strip them of their agency and freeze them in time.

  So, here is my verdict for this workshop, and I want us to build our discussions on top of it: **Genuine restitution requires dismantling the museum's categorical framing, not just shipping the crate back.**

  If we return the object but insist it remain a "museum piece"—untouchable, visually consumed, legally sealed—we haven't restored the object. We've just changed its zip code. We have performed a physical return while maintaining an ontological captivity.

  Now, I know what the lawyers in the room are thinking. You deal in precision. You deal with liability and chain of custody. Dismantling a categorical framing sounds vague. It sounds like a nightmare for contract language. But I would argue it's your opportunity. If the object is not merely a chattel but a relational agent, then the contract of transfer cannot be a simple bill of sale or a loan agreement. It needs to be a covenant of care that acknowledges the object's function. You aren't just transferring property rights; you are negotiating a change in the object's state of being. The language needs to shift from "condition reports" to "continuity of purpose." That is a harder contract to write, but it is the only one that is honest.

  And to the curators: Please hear me clearly. This is not an accusation of theft. You are not villains for holding these things. You are stewards of a specific epistemological system that values preservation over function. The violence wasn't necessarily done by your hands; it was done by the framework you inherited. The museum is a technology that flattens meaning to make it universal. Acknowledging that isn't an admission of guilt; it's an admission of limitation. You can be proud of your preservation work while admitting that preservation sometimes kills the very life it tries to save.

  If we choose this path, we stop asking "Who owns this?" and start asking "What does this object need to be whole?" Sometimes the answer is physical return. Sometimes it's digital repatriation. Sometimes it's allowing the object to be used, worn, or even consumed by ritual, which means accepting its eventual degradation. That is a hard pill for a conservator to swallow, I know. But preserving the material at the cost of its meaning is a seperate kind of loss.

  We cannot solve this by looping back to the headlines. We have to be willing to break the category of "museum" itself, at least around the edges. If we don't, we are just moving cages.

  Let's get to work.
