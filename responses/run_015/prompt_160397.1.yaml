      *   **The Two Principles:** Harm Prevention vs. Fairness/Relational Duties.
      *   **The Inconsistency:** Case 4 vs. Case 5 (Bystanders vs. Donors) and Case 7 (The Dad).
      *   **The Fix:** Soften Case 7.
      *   **The Orchestra:** Apply the "Mum Precedent."

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, look at Case 9:* "1-in-50 chance of killing me... I lean toward required." This is *very* demanding. Higher than Singer usually goes (Singer says "comparable moral significance," not usually risking death).
      *   *Contrast:* Case 2 (Mum) = Not required. Case 9 (Death Risk) = Required.
      *   *Tension:* Why is missing Mum's deathbed okay, but a 2% risk of death not okay?
      *   *Explanation:* Missing the deathbed is a *certainty* of emotional harm. The 2% is a *risk*. Also, the deathbed is about *relationship*, the risk is about *existence*.
