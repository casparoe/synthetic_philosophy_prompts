      *   **Goal:** Identify the underlying ethical principles driving these verdicts. Determine if there's one consistent principle or two conflicting ones. If two, advise on which verdict to reconsider. Finally, apply the derived principle to the "Orchestra Case" (quitting a lifelong passion to save a life).
      *   **Tone:** Philosophical, analytical, empathetic, and decisive (helping them clarify their own mind).

  2.  **Deconstruct the User's Verdicts:**

      *   *Case 1 (Shallow Pond/$200 Jacket):* **Required.** (Classic Singer).
      *   *Case 2 (Mum's Deathbed):* **Not Required.** (Special obligation/family trumps general utility).
      *   *Case 3 (Charity/$200):* **Required (Intellectually) / Weak (Emotionally).** (Psychological distance/efficacy doubt).
      *   *Case 4 (10 Bystanders/Pond):* **Required.** (Duty isn't diluted by others' inaction in immediate proximity).
      *   *Case 5 (10,000 Donors/Charity):* **Weak/Unfair.** (Fairness/Free-rider problem kicks in with large numbers/statistical victims).
      *   *Case 6 (I Left Gate Open):* **Required (Stronger).** (Causal responsibility/Culpability).
      *   *Case 7 (Dad Pushed Kid):* **Duty Almost Gone.** (Primary responsibility lies with the perpetrator; intervention might be supererogatory).
      *   *Case 8 (Wreck Stranger's Car):* **Torn.** (Property rights vs. Life; consent issues).
      *   *Case 9 (1-in-50 Death Risk):* **Required (but feels insane).** (High cost threshold, but life-for-life tradeoff is tricky).

  3.  **Identify the Conflicting Principles:**

      *   *Principle A: Consequentialist/Utilitarian (Singer's Principle).* Save the life if the cost is less than the value of the life. Focus on outcome.
          *   Supports: Case 1, Case 3, Case 4, Case 9 (maybe).
          *   Conflicts with: Case 2, Case 5, Case 7, Case 8.
      *   *Principle B: Deontological/Relational/Fairness.* Focus on duties, relationships, causation, and fairness.
          *   *Special Obligations:* Case 2 (Mum).
          *   *Causal Responsibility:* Case 6 (I did it) vs. Case 7 (Dad did it).
          *   *Fairness/Free Riding:* Case 5 (Why me if no one else?).
          *   *Rights/Consent:* Case 8 (Stranger's car).

      *   *Synthesis:* The user isn't a pure Singerian. They are a **Pluralist**. They hold a "Moderate Duty to Rescue" constrained by "Fairness" and "Special Obligations."
      *   *The Tension:* The biggest tension is between *Case 4* (10 bystanders, I still must act) and *Case 5* (10,000 donors, I feel less compelled). Why the difference?
          *   *Hypothesis:* Immediacy and Identifiability. In Case 4, the need is *here and now*. In Case 5, it's statistical and diffuse. Also, the "Fairness" intuition is stronger in Case 5 because the cost is identical but the social context implies a collective burden that isn't being shared.
      *   *The "Dad" Case (7):* This is crucial. If the user feels duty is *gone* because the Dad is there, they value *primary responsibility* over *outcome*. This contradicts Case 1 (where no one is responsible, but I am).
      *   *The "Mum" Case (2):* This establishes a hierarchy of obligations. Family > Strangers.

  4.  **Drafting the Analysis:**

      *   **Acknowledge the Conflict:** Validate that they aren't crazy. Their intuitions reveal a clash between *Consequentialism* (maximize good) and *Common-Sense Morality* (relationships, fairness, causation).
      *   **Name the Principles:**
          1.  **The Principle of Preventable Harm:** If you can stop something bad at reasonable cost, do it. (Drives Case 1, 3, 4, 6).
          2.  **The Principle of Fairness & Agency:** You aren't the moral cleanup crew for everyone else's negligence or inaction, especially when costs are high or relationships are involved. (Drives Case 2, 5, 7, 8).
      *   **Address the Specific Tension (Case 4 vs. Case 5):** Why does 10 bystanders not matter, but 10,000 donors does?
          *   *Explanation:* In the pond, you are the *only* effective agent *now*. In charity, you are one of many *potential* agents over time. The "Free Rider" intuition is stronger when the mechanism is systemic (charity) vs. immediate (pond).
      *   **Address the "Dad" Case (7):** This is the outlier. If the Dad is there, why is duty *gone*? Usually, it's just reduced. If the user feels it's *gone*, they prioritize *Causal Culpability* heavily.
      *   **The "Orchestra" Case (The Climax):**
          *   Compare to Case 1 (Jacket): Orchestra is more than $200. It's identity.
          *   Compare to Case 2 (Mum): Orchestra is a commitment to self/art, similar to special obligation to family? Or is it a luxury?
          *   Compare to Case 9 (Risk): Quitting isn't death, but it's "life-altering."
          *   *Verdict:* Based on the user's rejection of the "Mum's Deathbed" cost, the Orchestra case should likely be **Not Required**. The cost is too high relative to the "reasonable cost" threshold established in Case 2.

  5.  **Refining the Advice (Which verdict to give up?):**

      *   *Option A:* Embrace Singer. Give up Case 2, 5, 7. (Too radical for this user).
      *   *Option B:* Embrace Common Sense. Give up Case 3, 4. (Too easy, loses the moral force).
      *   *Option C (Recommended):* Refine the "Reasonable Cost" threshold.
      *   *The Pivot:* The user needs to reconcile Case 4 (10 bystanders) and Case 5 (10,000 donors). The distinction is likely *identifiability* and *immediacy*.
      *   *The "Dad" Case:* This is the weakest link. If the kid dies, does the Dad's presence really absolve you completely? I should suggest softening this one. If the Dad *won't* act, the kid still dies. The user's intuition here might be "I'm not responsible for his crime," but morality often demands action regardless of fault. *Suggestion:* Revisit Case 7.

  6.  **Developing the "Orchestra" Conclusion:**

      *   If Case 2 (Mum) trumps the child's life, then "Life Projects" (Orchestra) might also trump the child's life, *unless* the Orchestra is seen as selfish.
      *   However, Case 1 says $200 is negligible. Case 9 says 2% death risk is acceptable.
      *   The Orchestra is a "Life Defining Commitment."
      *   *Synthesis:* The user's morality allows for "Prerogatives." You are allowed to pursue your own life projects up to a point. The Mum case sets the limit: "Significant Personal Tragedy" exempts you. Quitting the Orchestra sounds like "Significant Personal Tragedy."
