  ok before I read any more proposals for randomly selected legislatures, I want the spec: what would a theory of lottocratic legitimacy actually have to get right? write the desiderata, with the case or consideration behind each one. I don't mean a general defense of democracy, I mean the hard part: why is it legit to give real political power to people who were not chosen by anyone, and when does that beat (or complement) elections? include which cases it must handle (Athenian sortition, juries, citizen assemblies, randomly selected constitutional conventions, hybrid lottery/election bodies, AI governance boards, eligibility and nonresponse, capture, competence, accountability, losers, non-citizens, scaling up), which distinctions it can't collapse (descriptive representation vs deliberative competence vs accountability, lot as selection method vs lot as decision procedure, legitimacy of the office vs legitimacy of the person in it, random sampling as fact vs random selection as norm), and what it owes to the empirical findings on deliberation, selection, and accountability without just paraphrasing the data. mark which requirements are non-negotiable and which are just preferences of particular camps. if some subset of the desiderata looks jointly unsatisfiable, say so and explain why. then briefly score Athenian-style pure sortition, advisory citizen assemblies, hybrid elected/lottery legislatures, and expert-plus-random panels against the list, but keep the scorecard short. no citations, I'll add those myself.
