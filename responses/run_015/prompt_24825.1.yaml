  2.  **Deconstruct "Lottocratic Legitimacy":**
      *   Standard democratic legitimacy relies on *authorization* (voting) and *accountability* (retrospective voting).
      *   Sortition removes authorization. So, legitimacy must come from elsewhere: *representativeness* (microcosm), *competence* (deliberative capacity), *fairness* (equal opportunity), or *outcome quality*.
      *   The theory needs to bridge the gap between "random people" and "rightful rulers."

  3.  **Drafting the Desiderata (The Spec):**
      *   *Requirement 1: The Authorization Gap.* Why is it okay to rule without consent? Needs to address political equality. (Non-negotiable).
      *   *Requirement 2: Competence/Epistemic Quality.* Random people aren't experts. How do they make good laws? Needs to explain the transformation from layperson to legislator. (Non-negotiable).
      *   *Requirement 3: Accountability/Control.* If they can't be voted out, how are they checked? (Non-negotiable).
      *   *Requirement 4: Distinction Maintenance.* Must not confuse being a statistical mirror with being a good deliberator. (Non-negotiable).
      *   *Requirement 5: Scope and Scaling.* Works for juries, but does it work for a nation? (Non-negotiable).
      *   *Requirement 6: The Losers' Consent.* Why should those who disagree accept the outcome? (Non-negotiable).
      *   *Requirement 7: Integration with Existing Institutions.* It rarely replaces everything. How does it fit with elections/courts? (Preference/Contextual).
      *   *Requirement 8: Non-Citizens/Future Generations.* Who is in the sample frame? (Preference/Extension).

  4.  **Refining the Distinctions (Crucial Step):**
      *   *Descriptive Rep vs. Deliberative Competence:* Just looking like the population isn't enough; they must *think* well.
      *   *Selection vs. Decision:* Picking by lot is different from deciding by lot (aleatory democracy).
      *   *Office vs. Person:* The institution is legitimate, but is *this* specific random person legitimate to hold it?
      *   *Fact vs. Norm:* Statistical randomness is a math fact; political legitimacy is a normative claim.

  5.  **Addressing Empirical Findings (Without Citations):**
      *   Need to acknowledge that deliberation *can* change minds but also *can* polarize.
      *   Acknowledge that random selection *does* create descriptive representation but *doesn't* guarantee expertise.
      *   Acknowledge that accountability mechanisms (transparency, recall) function differently without elections.

  6.  **Identifying Trade-offs (Joint Unsatisfiability):**
      *   *Representativeness vs. Competence:* A truly random sample includes people unable to deliberate. Filtering for competence breaks randomness.
      *   *Independence vs. Accountability:* If they are truly independent (no re-election), they might ignore the public. If they are too accountable, they act like politicians.
      *   *Equality vs. Efficiency:* Full sortition is slow and resource-intensive compared to elections.

  7.  **Developing the Scorecard:**
