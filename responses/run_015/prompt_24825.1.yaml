      *   *Check:* No citations? *Adjustment:* Ensure no names/dates are dropped.

  9.  **Final Polish:** Organize into clear sections: Core Desiderata, Critical Distinctions, Empirical Constraints, Trade-offs, Scorecard. Ensure the "hard part" (unchosen power) is central.

  *(Self-Correction during drafting)*: I need to make sure I don't just list "it must be democratic." I need to explain *why* lot is democratic in a way that competes with voting. The core argument is usually "political equality" vs. "aristocracy of the ambitious." I need to make sure the theory handles the "non-response" problem (people declining to serve) because that breaks the random sample.

