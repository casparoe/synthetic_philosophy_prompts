  Hey — I'm in the last year of a PhD in history and I've got a methodological knot I can' stop going back and forth on, and I figured people who actually think about this kind of thing for a living might have a cleaner way to cut it than my committee does.

  Here's the case as concretely as I can put it. Last summer I was doing interviews in a small town, and I don't speak the local dialect well, so I worked through a grad student from the national university who translated for me. My only source for the central claim of a chapter is an 84-year-old woman who told me, through the translator, that around forty people from the village were taken out to a gravel pit outside town and shot in the autumn of 1944 and buried there. The archives are either silent or point to a different date, and nobody else I spoke to in the village would say anything about it at all — but she also told me up front that nobody there talks about it and that the people who'd remember are dead. So the absence of corroboration is exactly what she predicted. And the reason I went to her in the first place is that three separate people told me she's the one with the memory for that sort of thing. So the whole thing stacks up as: her word, resting on other people's word about her, reaching me through a translator whose word I can't check either, and predicting the absence of the very evidence I'd otherwise want.

  The two bits of advice I got are incompatable and neither feels right. One committee member said something like: at the end of the day all you've got is your own eyes, your memory, and your inferences, so a report is only ever as good as your inductive grounds for thinking reports of that kind from people like that are generally true — and on that standard I basically have nothing, since I can't even verify the translation. The other said that's backwards, that taking people's word is the default setting and you need positive reasons for doubt rather than positive reasons for trust, so my job is just to make sure I don't have a specific defeater. What bugs me is that the first view obviously tells me to hedge or drop it, the second obviously tells me to print it, and I genuinely can't tell whether the second is correct or whether it's just the view that licenses what I already want to do. My boyfriend had the same shape of problem in his lab last month — a result nobody else can replicate, and the postdoc who got it says of course they can't, their protocol differs — so if your answer doesn't also handle his case, say why not.

  What would actually help: (1) say which of the two pictures handles this better and why, and don't split the difference; (2) tell me what the villagers' silence is supposed to do in each picture — is it a defeater that gets neutralized by having been predicted, or is a predicted absence of evidence still an absence of evidence; (3) say what it changes, if anything, that my reasons for trusting her are themselves entirely second-hand and came through the same person translating her; and (4) whether it matters that I'd be the one repeating it — my readers will have even less to go on than I do, so do I owe them something different, or is that a separate question entirely. Please don't hand me a reading list or tell me which papers to chase; I've got plenty of that and I want the argument, not the literature. And don't tell me to hire a second translator or go back to the archives — assume that's off the table. Walk through the four points, then finish with the verdict as the very last line of your answer, in exactly this form: \answer{state it as fact | attribute it to the informant | cut the claim}
