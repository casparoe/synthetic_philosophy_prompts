  Where it breaks
  The argument breaks at Step (3), fundamentally enabled by the scope clause in Step (1). Standard Pareto principles apply only to fixed populations where the identical individuals exist in all outcomes. Your scope clause stipulates that non-existent people count as "worse off" if they aren't created, treating non-existence as a baseline welfare state. This is not a neutral definition; it is a substantive commitment to the "Better to Be" principle or Total Utilitarianism. Under a standard Person-Affecting View, you cannot say a person is "better off" existing than not existing, because there is no subject in the non-existence scenario to hold that welfare level. Consequently, preventing extinction isn't a Pareto improvement over extinction; it is creating a entirely different population. By defining "everyone" to include merely possible people, you haven't bypassed population ethics; you've silently adopted a controversial solution to the Non-Identity Problem. Step (3) is false under any view that denies non-existent entities have welfare interests, which includes many reasonable axiologies. The move from (2) to (3) assumes the very thing it claims to avoid.

  Why it looked fine
  It looked fine because it leverages the intuitive force of survival. For existing people, avoiding extinction is clearly a Pareto improvement; no one alive now benefits from dying prematurely. The argument smuggles the future people in alongside the present ones, treating "never being born" as analogous to "dying young." In fixed-population economics, this analogy holds. We are used to saying a policy is better if it saves lives. The trick is that x-risk reduction doesn't just save lives; it determines *which* lives exist. The framework hides this metaphysical shift inside the word "everyone," making a controversial population ethic look like a trivial definition of scope. It feels like common sense because we naturally empathize with the potential people we imagine, but logically, they cannot be parties to a contract they never sign.

  What the alternatives cost
  If you reject (3) to fix the break, you lose (4). Longtermism no longer rests on an uncontroversial principle; it rests on Total Utilitarianism or similar views that count potential lives as moral gains. This opens the door to the Repugnant Conclusion and demands you defend why huge populations with low welfare outweigh smaller, happier ones. If you keep (3) by accepting the scope clause in (1), you pay the price in Step (7): you validate the Non-Identity Problem's hardest bullets. You must accept that policies are justified solely by the welfare of the resulting population, even if they harm specific identifiable people who would otherwise exist. This undermines rights-based or person-affecting constraints. To keep (4), you must deny that population ethics is controversial, which is empirically false among philosophers. You cannot have the "axiology-free" shield of (2) and the expansive scope of (3) simultaneously. Either you admit longtermism requires contested ethics (sacrificing 4), or you accept that any policy creating happy people is mandatory regardless of other costs (sacrificing intuitive constraints on action). The cost of saving (4) is admitting (2) is false; there *are* knobs, specifically the moral status of non-existence. Step (6) becomes unstable because without the Pareto shield, the astronomical numbers lose their lexical priority over near-term suffering. You must weigh future lives against present pain using a discount rate or risk weighting, reintroducing the knobs you claimed to remove. Near-term work might outweigh x-risk work depending on probabilities. The "everything goes to x-risk" conclusion relies on the unbounded aggregation promised by (2), which is now revoked. You are back to standard cost-benefit analysis, where longtermism is a strong claim but not a logical necessity. This reintroduces the very trade-offs Step (2) claimed to eliminate.

  What survives
  The claim that x-risk reduction benefits *existing* people survives. We all lose if humanity ends tomorrow. This supports a modest precautionary principle without invoking astronomical numbers. Longtermism as a project survives, but it loses its claim to neutrality. It becomes a positive ethical thesis requiring strong defense against competing population views. You can still argue for x-risk reduction, but you must argue for the value of future lives explicitly, rather than hiding it behind Pareto efficiency. The core intuition remains, but the logical shortcut is gone. You retain the motivation but lose the proof. The argument still supports caring about the future, just not via this specific dominance argument anymore. It forces honesty about the ethical weights involved.

  Bottom line
  The argument breaks at Step (3) because it treats non-existence as a comparable welfare state, which is a controversial population ethics claim. You must choose between admitting longtermism requires contested axiology or accepting that creating happy people overrides all other moral constraints.
