answer: |-
  **Exam Question**

  **3. Aristotle on Money and Nature**

  Consider a city that strikes no precious metal but circulates sealed clay tokens, fixed in quantity by decree, neither exportable nor meltable, which in fact serve as the common measure and are accepted by everyone in the city.

  Write an essay addressing the following two points regarding this hypothetical case:

  1.  Drawing on *Nicomachean Ethics* V, explain how Aristotle's "guarantee-of-future-exchange" argument accounts for these clay tokens functioning as money at all, despite having no intrinsic value.
  2.  Assess whether a lender who charges interest for the use of these tokens is acting "contrary to nature" on Aristotle's terms. In doing so, resolve the apparent tension between the conventionalism of the *Ethics* (where money is by *nomos*) and the teleology of *Politics* I (where usury is unnatural).

  Your answer must address the circularity worry regarding price and *chreia* and defend a specific translation of *chreia* as either "need" or "demand."

  ***

  **Model Answer**

  In the *Nicomachean Ethics*, Aristotle argues that money exists not by nature but by convention (*nomos*). It functions as a pledge (*hypobolon*) guaranteeing that the holder can secure goods in the future. In the case of the clay tokens, their material worthlessness is irrelevant. They function because the political community agrees to accept them as a security for future exchange. The decree fixing their quantity ensures stability, while their non-exportable nature reinforces that their value is purely local and conventional. As long as the community maintains the agreement that these tokens represent a claim on goods, they satisfy the *Ethics* requirement: they are a symbol of demand that facilitates exchange by bridging the temporal gap between giving and receiving.

  However, for money to measure goods, there must be a single standard. Aristotle identifies this as *chreia*. Translating *chreia* as "need" creates a circularity problem: if prices measure need, but need is subjective and unquantified, prices cannot be fixed. If *chreia* is read as "market demand," the circularity dissolves. Demand is quantified through the price mechanism itself. Aristotle admits his account is "good enough for practical purposes," suggesting he is not seeking mathematical precision but a functional equilibrium. Prices reflect the intensity of demand, and money represents that demand. Thus, the clay tokens measure the community's aggregate demand, not individual subjective needs. This reading saves the commensurability argument: unlike goods (shoes and houses) are made alike because they satisfy proportional demands, represented by the tokens.

  This conventionalist account in the *Ethics* appears to clash with *Politics* I, where Aristotle claims usury is "most contrary to nature" because money is meant for exchange, not reproduction. If money is merely a clay token established by decree, how can its use be unnatural? The resolution lies in distinguishing material from function. In the *Politics*, Aristotle's naturalism is teleological, not physical. The "nature" of money is its *ergon* (function) within the household and state, which is to facilitate the exchange of use-values. When money is used to generate more money (usury), it subverts this function.

  Therefore, even with clay tokens, charging interest is unnatural. The tokens' material (clay vs. silver) does not determine their nature; their function does. Because the tokens are instituted to measure exchange for the sake of satisfying needs (or demand), using them as a breeding stock treats the means of exchange as an end in itself. The lender treats the token not as a pledge for future goods, but as a generative principle. This violates the teleological limit of wealth-getting. The *Ethics* explains the mechanism (convention), while the *Politics* dictates the proper end (exchange for sufficiency).

  Consequently, the clay tokens work because of the *nomos* guaranteeing future exchange, but the usurer acts unnaturally because he violates the *telos* of that *nomos*. The tension between the two texts is resolved by recognizing that while the *institution* of money is conventional, its *purpose* is natural. To use the convention against its purpose is to act contrary to nature, regardless of whether the currency is gold or clay. The "good enough" qualification in the *Ethics* allows for this functional definition without requiring money to possess intrinsic natural value.

  ***

  **Marking Scheme (20 Marks)**

  | Point | Criteria | Marks | Typical Failure |
  | :--- | :--- | :--- | :--- |
  | **1. Token Mechanism** | Explains tokens via *nomos* and the "pledge/guarantee" of future exchange (*NE* V). | 4 | Claims tokens need intrinsic value or metal content to work. |
  | **2. Chreia & Circularity** | Defends "demand" over "need" (or vice versa) and resolves the price/demand circularity using the "practical purposes" clause. | 4 | Ignores circularity or treats *chreia* as purely subjective psychological need. |
  | **3. NE/Pol Tension** | Identifies the conflict between conventional origin (*NE*) and natural limit (*Pol*). | 4 | Treats the texts as contradictory without attempting reconciliation. |
  | **4. Teleological Resolution** | Argues that "nature" refers to function (*ergon*), not material, rendering usury unnatural even with clay. | 4 | Argues usury is natural because the tokens are artificial/conventional. |
  | **5. Application** | Concludes definitively on the usury case based on the synthesized argument. | 4 | Hedges or fails to apply the theory to the specific clay token case. |

  ***

  **What would change this answer's mind**

  This reading relies heavily on the unity of Aristotle's corpus, assuming the *Ethics* and *Politics* share a coherent theory of value. The argument is most fragile if one accepts a developmentalist hypothesis: that the *Ethics* represents an earlier, more Platonic phase where value is strictly conventional, while the *Politics* reflects a later, empirical turn toward natural limits. If *NE* V's remark that money is "good enough for practical purposes" is read as a concession that money *fails* to truly measure value (rather than succeeding imprecisely), then the *Politics* cannot build a naturalistic critique upon it. If money does not truly measure *chreia*, then violating its function is merely a legal infraction, not a violation of nature. A textual emendation suggesting *chreia* strictly means "use" rather than "demand" would also collapse the commensurability argument, making the teleological critique in the *Politics* appear as an unrelated moralizing addendum rather than a philosophical conclusion.
