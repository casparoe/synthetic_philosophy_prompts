      *   **The Task:** Identify the broken step(s) in the argument, explain *why* it looked sound, explain *what it costs* to give it up, and address the three specific constraints/additional questions (the self-defeating nature of 7, the reluctance to surrender 1, 3, and 6, and the role of the private testimony detail).
      *   **Tone:** Respectful, intellectually rigorous, avoiding condescension (given the user's "no academic background" disclaimer but evident sophistication), and directly engaging with the logic rather than just asserting moral truths.

  2.  **Deconstruct the User's Argument:**
