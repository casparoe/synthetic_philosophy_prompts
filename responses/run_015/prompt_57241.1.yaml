  3.  **Evaluate against Scholarship (Ames & Rosemont):**
      *   *Core Metaphysics:* A&R argue against "substance ontology" (individual as discrete entity). They advocate "process ontology" or "event ontology." The student's "place where relationships are happening" is a strong, accurate summary of A&R's focus on *focus/field* rather than *substance*.
      *   *The Objection:* A&R's standard response is indeed immanent critique. Roles aren't static scripts; they are creative performances. A "bad father" isn't one who violates a rule, but one who fails to cultivate the relationship optimally. However, A&R also emphasize *reciprocity* and the *community* as the arbiter of role performance, not just individual interpretation. The student notes the "contestability" issue well.
      *   *Virtue Ethics Comparison:* This is the contentious part in the field.
          *   *Standard View:* Many compare Confucianism to Aristotelian Virtue Ethics (MacIntyre, etc.).
          *   *A&R's Specific Stance:* Ames and Rosemont *strongly resist* the "Virtue Ethics" label. They argue Virtue Ethics still presupposes an individual agent cultivating internal dispositions (*hexis*), whereas Role Ethics sees the *relationship itself* as the primary ontological unit, not the individual's character.
