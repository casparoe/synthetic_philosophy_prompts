          *   *Student's Claim:* "Both assume there's a human nature with a telos." -> **Major Red Flag.** A&R explicitly reject essentialist "human nature" (*xing*) in the Mencian/Aristotelian sense. They view humans as radically contingent and created through roles, not unfolding a pre-determined *telos*. Ames, in particular, argues against teleological metaphysics.
