          2.  Distinguish Role Ethics from Virtue Ethics (specifically regarding relationship-sustaining dispositions).
      *   **Task:** Grade out of 12, provide point-by-point comments suitable for handing back, identify correct/incorrect claims, find buried mistakes, assess confidence levels, and flag the least certain point.
