      *   **Address the "Impersonal Value" Charge:** Scheffler isn't positing spooky value. He's positing that our valuing is socially/temporally extended.
      *   **Address the "Drift" Objection:** Acknowledge this is a strong objection. Explain Scheffler's distinction between numerical survival and qualitative continuity. Admit that Scheffler might have to concede that radical drift is *also* bad, but extinction is *maximally* bad.
      *   **Resolve the Dilemma:** The dilemma is false because Scheffler's claim is about the *conditions of our current agency*, not the ontological status of meaning or the specific content of future values.

