answer: |-
  (a) **Tensions Ordered by Severity**

  1.  **(6) vs. Case Study Verdict:** This is a direct contradiction. (6) states that substitutes (amends) do not discharge the original obligation; the Case Study states that once amends are made, "the matter is closed" and nothing further is owed. If the matter is closed, the claim is discharged.
      *   *Revision Cost:* Revising (6) weakens the strict deontic view of promises, suggesting specific duties can be commuted. Revising the Case Study forces you to claim Priya remains in debt to Marta indefinitely, contradicting your intuition that perpetual guilt is self-indulgent.
  2.  **(4) vs. (5):** (5) states blame requires avoidability. In a dilemma, violating one obligation is unavoidable. (4) states resentment (a paradigmatically blaming attitude) is fitting. If the violation was unavoidable, (5) renders the resentment unfitting.
      *   *Revision Cost:* Revising (5) makes agents blameworthy for impossibilities, undermining moral fairness. Revising (4) denies the victim's standing to resent unavoidable harms, sanitizing the moral residue.
  3.  **(3) vs. (1):** (3) defines obligation via "outweighing" reasons. (1) posits conflicting obligations where neither overrides. If reasons outweigh, one should win. If they tie or are incomparable, "outweighing" is the wrong metric.
      *   *Revision Cost:* Revising (3) leaves obligation unexplained. Revising (1) collapses dilemmism into a standard override view.

  (b) **Verdict on Your Worries**

  Your first worry (**(1) & (2)**) is misplaced. Rejecting agglomeration while retaining Ought-Implies-Can is logically coherent. It blocks the derivation of impossible obligations ($O(A \& B)$) without sacrificing the intuition that obligation requires possibility. You can maintain both without inconsistency.

  Your second worry (**(4) & (5)**) is well-founded. As noted in the tensions above, if blame strictly requires avoidability, and dilemma violations are unavoidable, then resentment (as a blaming attitude) cannot be fitting. You must either distinguish resentment from blame (arguing it is a non-blaming grief) or soften (5) to allow blame for unavoidable moral failures.

  (c) **Single Best Revision**

  Revise **(6)** to distinguish between the *primary obligation* and the *residual claim*. Adopt this version: "Primary obligations are not dischargeable by substitute, but fulfilling secondary obligations of repair discharges the residual claim against the agent."

  *   *Why least costly:* This preserves the sting of failure (Priya still broke the promise, satisfying (1) and (4)) while allowing closure (the claim is settled, satisfying the Case Study). It avoids the harshness of perpetual debt without denying the unique value of the original act. It costs you the purity of (6) but saves the coherence of the whole package.

  (d) **Unlisted Tension**

  The tension between **(3) and (1)** is more threatening than you acknowledge. If obligation is strictly a function of outweighing reasons, genuine dilemmas become conceptually impossible unless you revise the theory of reasons to allow for incommensurability that still generates obligation. This threatens the explanatory foundation of your entire project more than the logical issues in (2).
