      **What tranquilism claims**
      Tranquilism asserts that the moral value of a life is calculated exclusively by subtracting suffering. Pleasure is not an asset but merely the absence of pain. Therefore, the ideal state is not euphoria, but contentment defined by nothing lacking. This view prioritizes harm reduction over benefit maximization. It claims that adding pleasure to a painless life does not improve it, whereas adding pain worsens it significantly.

