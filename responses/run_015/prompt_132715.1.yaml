  1. The exam question

  **Time Allowed:** 45 Minutes
  **Word Limit:** 800 Words Maximum
  **Topic:** The Ethics of Tranquilism

  Tranquilism is the axiological view that well-being is determined solely by the absence of suffering and craving. On this view, pleasure holds no positive value; it is merely neutral zero, whereas pain is strictly negative. Consequently, a life without pain is maximally good, regardless of pleasure levels. This contrasts sharply with hedonism, which counts pleasure as a positive good.

  Consider two specific challenges. First, the "Flatlined Being": a conscious person who has eradicated all desire and pain but experiences zero positive emotion, existing in a state of aware, affective neutrality. Second, the "Rock Problem": an inanimate object that inherently possesses no capacity for suffering or desire.

  Write an essay critically evaluating tranquilism in light of these cases. Your response must address the following three components:
  1. Does tranquilism imply the Flatlined Being lives as well as a happy person? Argue whether this result is plausible or counterintuitive.
  2. Does tranquilism imply the Rock lives the "best possible life"? If so, is this a fatal reductio ad absurdum, or can the view be modified to avoid it?
  3. Clearly distinguish between claims about tranquilism that are philosophically settled versus those that remain genuinely contested among ethicists.

  Do not use external sources or citations. Focus on logical coherence and argumentative strength. Your grade depends on how well you navigate the tension between eliminating suffering and preserving meaningful agency. Ensure you define terms clearly before critiquing them. Grading will prioritize argumentative precision over historical knowledge. Ensure your essay is structured with clear paragraphs corresponding to the three required components. Illegible handwriting or poor organization will penalize the final score.

  2. The model answer

  **What tranquilism claims**
  Tranquilism asserts that the moral value of a life is calculated exclusively by subtracting suffering. Pleasure is not an asset but merely the absence of pain, effectively zero on the value scale. Therefore, the ideal state is not euphoria, but contentment defined by nothing lacking. This view prioritizes harm reduction over benefit maximization. It claims that adding pleasure to a painless life does not improve it, whereas adding pain worsens it significantly. This asymmetry is the core axiom: pain is bad, neutrality is good, pleasure is irrelevant. This distinguishes it from negative utilitarianism, which focuses on action, whereas tranquilism focuses on the state of being.

  **The flatlined-void objection**
  The Flatlined Being presents a challenge to intuitive notions of flourishing. If pleasure is zero, then a neutral, aware existence is equally valuable as a joyful one. Tranquilists accept this, arguing that craving for joy is itself a subtle suffering. They contend that what we call pleasure is just the temporary relief of tension. Critics argue this empties life of meaning, reducing humans to mere containers without spillage. However, this is contested. Some argue awareness itself has value independent of affect. Tranquilism denies this, claiming only affective states matter. The settled point is that tranquilism equates neutrality with maximality. The contested point is whether neutrality is truly sufficient for well-being. Many students mistakenly assume tranquility implies sleep; the prompt specifies awareness, which complicates the view. A conscious void is distinct from unconsciousness.

  **The rock objection and replies**
  The Rock Problem suggests that if absence of pain is the sole good, a rock is perfectly well-off. This seems absurd. A standard reply modifies tranquilism to require consciousness. Only beings capable of suffering can have welfare. Thus, rocks are excluded not because they suffer, but because they lack the substrate for value. This saves tranquilism from absurdity but concedes that consciousness is a prerequisite. This is largely settled: most ethicists agree welfare requires a subject. However, whether consciousness alone grants value without positive affect remains fought over. If a rock cannot suffer, it has no welfare status at all, neither good nor bad. This distinguishes it from the Flatlined Being, who has welfare but no positive input. The rock has no welfare period. This nuance is crucial for avoiding the reductio. The distinction lies in subjects of welfare. A rock is not a subject. The Flatlined Being is a subject. This preserves the intuition that rocks do not matter while maintaining that painless humans do.

  **Whats settled vs genuinely contested**
  It is settled that tranquilism differs from hedonism by valuing pain avoidance over pleasure seeking. It is also settled that most versions require consciousness to avoid the rock absurdity. However, it is genuinely contested whether pleasure has intrinsic value. Hedonists argue pleasure is good; tranquilists argue it is relief. Furthermore, it is contested whether the Flatlined Being is truly well-off. Some see peace; others see stagnation. There is no consensus on whether the absence of negative states constitutes the highest good, or merely a baseline requirement for a good life. The debate remains open on whether a life can be good without any positive peaks, or if tranquility is merely the foundation upon which positive goods must be built. Philosophers agree on the definitions but disagree on the valuation. Ultimately, the field agrees on the logical implications but disagrees on their desirability. While historical roots exist, modern formulation is contested.

  3. The marking scheme

  **Total Points: 20**

  **A-Grade Moves (Required for 16-20 points)**
  1.  **Accurate Definition (5 pts):** Correctly identifies tranquilism as valuing pain absence over pleasure presence. Must note pleasure is neutral, not negative. Misidentifying this as nihilism loses points.
  2.  **Flatlined Analysis (5 pts):** Addresses whether the neutral being is well-off. Must distinguish between awareness and affect. Ignoring the "aware" constraint drops this score.
  3.  **Rock Objection Handling (5 pts):** Identifies the absurdity and offers the consciousness requirement reply. Distinguishes rocks (no welfare) from beings (neutral welfare).
  4.  **Nuance on Consensus (5 pts):** Clearly separates settled definitions from contested values. Does not claim one side is objectively correct. Specific emphasis on the settled vs contested section. Students must show they know where the debate lies.

  **B-Grade Mistakes (Drops score to 10-15 points)**
  1.  **Confusing Views:** Treats tranquilism as nihilism or standard negative utilitarianism without distinction.
  2.  **Ignoring Awareness:** Assumes the Flatlined Being is unconscious or asleep.
  3.  **Failing the Rock:** Claims tranquilism literally says rocks are happy, without offering the consciousness modification.
  4.  **False Consensus:** Presents contested ethical claims as established facts (e.g., Philosophers agree pleasure is worthless).

  **Other Notes**
  Penalties apply for exceeding word limits or using external citations. Clarity and structure weigh heavily in the final 5 points of the A-grade range. Grammar and flow matter less than argumentative precision. Students should not be penalized for taking a stance, provided they acknowledge the counter-arguments appropriately.
