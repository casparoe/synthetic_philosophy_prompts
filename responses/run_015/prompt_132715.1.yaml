      **The rock objection and replies**
      The Rock Problem suggests that if absence of pain is the sole good, a rock is perfectly well-off. This seems absurd. A standard reply modifies tranquilism to require consciousness. Only beings capable of suffering can have welfare. Thus, rocks are excluded not because they suffer, but because they lack the substrate for value. This saves tranquilism from absurdity but concedes that consciousness is a prerequisite. This is largely settled: most ethicists agree welfare requires a subject. However, whether consciousness alone grants value without positive affect remains fought over.

      **Whats settled vs genuinely contested**
      It is settled that tranquilism differs from hedonism by valuing pain avoidance over pleasure seeking. It is also settled that most versions require consciousness to avoid the rock absurdity. However, it is genuinely contested whether pleasure has intrinsic value. Hedonists argue pleasure is good; tranquilists argue it is relief. Furthermore, it is contested whether the Flatlined Being is truly well-off. Some see peace; others see stagnation. There is no consensus on whether the absence of negative states constitutes the highest good, or merely a baseline requirement for a good life.

