  ### Brainstorming and Supervisor Advice

  **Candidate Framings:**
  1.  **Ontological Relativism:** Frames the issue as agents inhabiting different metaphysical worlds. *Rejected:* Too metaphysical; loses traction with formal epistemologists and economists who need operational definitions.
  2.  **Pragmatic Modeling Audit:** Treats the shared space as a cost-benefit modeling choice. *Rejected:* Risks reducing the project to philosophy of science methodology without engaging the formal mechanics of disagreement.
  3.  **Structural Invariance:** Focuses on what disagreement persists under state-space refinement. *Rejected:* Technically sound but obscures the philosophical claim about what constitutes a "shared world."
  4.  **State-Space Primacy (Selected):** Argues that the substantive constraint of the Common Prior Assumption (CPA) lies in the requirement of a shared state space, not just the probability measure. *Reason:* This directly targets the user's insight, bridges formal and conceptual analysis, and is tractable for a nine-month fellowship.

  **Scope Advice:**
  Your advisor is correct. This is effectively two projects: a formal conceptual audit and an applied taxonomy via case studies. For a nine-month fellowship, you must prioritize the formal audit. If the conceptual groundwork regarding state-space sharing isn't solid, the case studies will lack rigor. Cut the second case study entirely. Integrate the remaining case study into the formal audit as an illustration of the "space-like" disagreement category, rather than a separate empirical application. This ensures you deliver a robust theoretical framework even if the application remains preliminary.

  ***

  ### Project Proposal: The State-Space Constraint on Rational Disagreement

  **Introduction**
  The Common Prior Assumption (CPA) is a cornerstone of game theory and formal epistemology. It dictates that differences in belief between rational agents must be modeled as differences in information regarding a shared world, rather than as differences in prior probability over that world. This assumption underwrites agreement theorems, no-trade results, and the standard modeling conventions of information economics. However, the standard debate regarding the CPA is stalled. Defenders treat it as a harmless methodological device, while critics treat it as a substantive ideological claim that rules out fundamental disagreement by fiat. This project argues that both camps mislocate the substantive work of the assumption. The CPA is always stated against a fixed state space that is already shared. This shared space settles which distinctions are relevant, which propositions are objects of belief, and what it would mean to receive evidence. My central hypothesis is that the real content of the assumption, and the real objection to it, live in the requirement that the space be shared rather than in the requirement that the prior be shared. The standard framing hides this because it takes the space as given.

  **Diagnosis of the Existing Debate**
  Current positions leave the core issue open because they argue about the prior while silently relying on the space. Defenders of the CPA often argue that any disagreement can be traced to some information structure, treating the assumption as an *as-if* device that costs nothing. They claim that if agents appear to have different priors, one can always construct a richer state space where those priors are conditionals of a common prior. Critics counter that this is substantive, arguing that the assumption rules out fundamental disagreement by fiat. However, both sides assume the state space is unproblematic. On my reading, the defender's claim that the assumption is trivial relies on the ability to expand the state space indefinitely. If the space must be shared, the constraint is not on the probability measure but on the ontology of the model itself. If agents disagree on which distinctions belong in the space, or what a given piece of evidence indicates within that space, the CPA cannot even be formulated without forcing one agent's ontology onto the other. The debate has been addressing a narrower phenomenon than its participants advertise, focusing on probability measures over fixed spaces while ignoring the prior commitment required to share the space itself.

  **Proposed Approach**
  This project avoids three obvious but unproductive alternatives. I will not run an empirical study of whether people actually share priors, as this misses the conceptual point about model construction. I will not build a general logic of unawareness from scratch, which is too large for a nine-month fellowship. I will not merely survey the literature. Instead, the approach is conceptual plus modest formal spadework. The core deliverable is an audit of what exactly has to be pinned down for the assumption to have testable content. I will provide an account of what sharing a space requires and when a common refinement exists. This involves formalizing the conditions under which two agents' state spaces can be mapped to a common refinement without trivializing the disagreement. If any pattern of observed betting behavior can be rationalized by some common-prior model on a rich enough space, then either the space-first reframing rescues the assumption's content by locating it in the choice of space, or the whole apparatus collapses into a modeling convention. I intend to present both outcomes as genuine results rather than as threats to be hidden.

  **Scope and Case Studies**
  To ground this formal audit, I propose a taxonomy of disagreement: purely informational (different partitions over the same space), disagreement at the level of the prior over a shared space, disagreement about which distinctions belong in the space at all, and disagreement about what a given piece of evidence would indicate even when the space is shared. My guess is that cases often cited as prior disagreements—political and ideological disagreement, cross-paradigm scientific disputes—are really cases of the third or fourth kind. Regarding scope, this project risks bifurcating into a formal theoretical project and an applied case-study project. To ensure tractability within nine months, I will prioritize the formal audit. I will include one worked case study—likely focusing on political polarization—to illustrate how disagreement looks prior-like but may be space-like. The second proposed case study on scientific paradigms will be dropped to ensure the formal analysis is rigorous. This aligns with the goal of producing a sharp, tractable conceptual framework rather than a broad survey.

  **Work Plan and Timeline**
  The nine-month fellowship will be divided into three phases. Months one through three focus on the conceptual audit. I will define the conditions for state-space sharing and analyze the triviality worry regarding common refinements. The checkable output for this phase is a draft paper section formalizing the "Space-First" constraint. Months four through six focus on the taxonomy and the single case study. I will apply the formal framework to the selected case to demonstrate the distinction between prior-like and space-like disagreement. The output is a complete draft of the core argument. Months seven through nine focus on refinement and implications. I will test the robustness of the conclusions against objections from both defenders and critics of the CPA. The final output is a complete dissertation chapter or article manuscript.

  **Outcomes and Failure Conditions**
  The possible conclusions are stark. If it turns out that the space constraint is itself trivial—that agents can always be modeled as sharing a space without loss of generality—then the CPA collapses into a modeling convention with no substantive bite. This would be a negative result for the assumption but a positive result for the field, clarifying the limits of formal disagreement models. Conversely, if the space constraint is substantive, it rescues the assumption's content by locating it in the choice of ontology. Considerations that will decide between these outcomes include whether the requirement for a shared space imposes restrictions on observable betting behavior that a shared prior alone does not. The project fails if I cannot formally distinguish between a disagreement about the space and a disagreement about the prior in a way that has observable implications. It also fails if the formal audit becomes so technical that it loses contact with the philosophical debate about rational disagreement. By keeping the formal work modest and focused on the conceptual audit, I mitigate this risk. The deliverable is a clear statement of what the Common Prior Assumption actually assumes, separating the substantive constraints from the modeling conventions.

