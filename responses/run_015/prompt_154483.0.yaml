answer: |-
  1) Brainstorm
  1. All art inevitably persuades (trivial descriptive claim).
  2. All art *ought* to persuade (normative moral duty).
  3. Art without a cause is worthless (evaluative dismissal).
  4. Beauty is secondary to utility (instrumentalist hierarchy).
  5. Neutral art secretly supports oppressors (status quo bias claim).
  6. Black art specifically must fight racism to survive (contextual necessity).
  7. Form itself is political, not just content (structural claim).
  8. Artist's intent defines propaganda (intentionalist view).
  9. Audience reception defines propaganda (effectualist view).
  10. Art equals pamphlet (reductionist/bad faith claim).
  11. Truth-telling is itself propaganda (epistemic claim).
  12. Only successful propaganda counts as art (gatekeeping claim).

  2) Menu of readings
  1. **Descriptive Universalism:** This claims that all art, by virtue of existing in a social world, inevitably communicates values, norms, or perspectives. Even a landscape painting implies a relationship between humans and nature. On this reading, "propaganda" just means "having political effects." It applies to **all art**, regardless of quality or intent.

  2. **The Normative Imperative:** This asserts that artists have a moral obligation to align their work with social movements. Art *ought* to be propaganda. This is a prescriptive claim about **all good art** (or rather, all morally permissible art), suggesting that creating art without political intent is irresponsible.

  3. **The Survival Condition:** This reading contextualizes the slogan within racial oppression. It argues that for marginalized groups, art *must* serve liberation simply to justify its existence in a hostile world. This applies to **art under specific historical conditions** (e.g., Black art in the 1920s), not necessarily all art universally.

  4. **Aesthetic Reductionism:** This radical claim posits that aesthetic value is identical to political utility. A work is beautiful *because* it advances the cause; if it fails politically, it fails aesthetically. This applies to **all art judged as good**, collapsing the distinction between ethical and aesthetic evaluation.

  5. **The Neutrality Myth:** This argues that claiming "art for art's sake" is itself a political stance—one that usually protects the status quo. Therefore, refusing to be propaganda is actually a form of counter-revolutionary propaganda. This applies to **all art claiming neutrality**, exposing hidden biases.

  6. **Specific Teleology:** This narrows the scope to Du Bois's specific intent: art must serve *this* specific cause (Black civil rights and dignity). It's not just any propaganda, but propaganda for gaining the right to "love and enjoy." This applies to **Black art specifically**, defining its legitimate function within the Harlem Renaissance.

  3) Verdicts on the readings
  1. **Descriptive Universalism:** **Trivial.** While philosophically defensible (all communication implies values), it is too weak to do the work your friend wants. Proving a play has political effects doesn't prove it's *good* or that its preachiness is justified. It explains why art is political, not why it should be blunt.

  2. **The Normative Imperative:** **Substantive and Defensible.** This is a serious ethical stance. However, it invites debate about artistic freedom. It doesn't shut down criticism; it shifts the criticism from "is this preachy?" to "is this the *right* cause?"

  3. **The Survival Condition:** **Substantive and Historically Accurate.** This is likely what Du Bois actually meant. It doesn't claim all art everywhere is propaganda, but that Black art in 1926 couldn't afford neutrality. It is defensible but context-bound.

  4. **Aesthetic Reductionism:** **False/Unhelpful.** This destroys the concept of art. Badly written agitprop is still badly written. Conflating moral utility with aesthetic quality leads to dull art and protects mediocre work from formal critique.

  5. **The Neutrality Myth:** **Substantive.** This is a powerful philosophical move. It forces artists to acknowledge their positionality. However, it doesn't validate *all* propaganda, only the honesty about one's stance. It complicates the "neutral ground" argument without validating didacticism.

  6. **Specific Teleology:** **Defensible.** This is historically accurate to Du Bois. However, it is too narrow for a universal theory of art. It validates your friend's cause but not necessarily her method. She can claim the duty, but not the immunity from critique.

  4) Which readings support my friend's use
  Your friend is attempting a logical sleight of hand by sliding between **Descriptive Universalism** and **Aesthetic Reductionism**. She uses the Descriptive claim ("all art is propaganda") to dismantle your demand for neutrality. She argues that since no neutral ground exists, your criticism of her "preachiness" is invalid because everyone is pushing a line.

  However, to defend the *quality* of her play against charges of being "too on-the-nose," she needs the Aesthetic Reductionist claim—that political utility excuses or constitutes aesthetic success. The slogan doesn't support this. Even if all art is propaganda, some propaganda is clumsy, boring, or ineffective. The Descriptive claim proves you are right that she is taking a side; it does not prove she is taking that side *well*.

  Furthermore, if we accept the **Survival Condition** (the most Du Boisian reading), her work must effectively serve the movement. If her play is too preachy to engage an audience, it fails as propaganda. Thus, your critique—that the didacticism undermines the work's effectiveness—actually aligns better with Du Bois's instrumentalism than her defense does. She uses the slogan as a shield against critique, but the slogan actually demands the work succeed politically, which requires aesthetic competence.

  5) Can it be about propaganda of address?
  Your distinction between propaganda of content and propaganda of address is not silly; it is philosophically robust and rescues the slogan from crudeness. Du Bois primarily focused on content (portraying Black truth to combat lies), but his project implies a specific address: speaking to a white world to demand rights, or speaking to Black folk to build pride.

  A reading of the slogan focused on **address** suggests that the political act is constituting a public. A quiet, ambivalent illustration can be propaganda if it addresses Black subjects as complex humans rather than stereotypes, thereby refusing the white gaze. This aligns with the **Neutrality Myth** reading: the form itself addresses an audience in a political way.

  However, Du Bois's specific usage was more instrumentalist than your distinction allows. He wanted art to *do* something specific (gain rights). Your distinction allows for art that is political simply by *who it recognizes* rather than *what it demands*. This is a valid extension of Du Bois, but be aware it shifts the definition of propaganda from "tool for mobilization" to "act of recognition." It makes the slogan compatible with subtlety, which serves your novel's themes well.

  6) Bottom line for a novelist
  Do not let your characters use the slogan as a conversation-stopper; make it a conversation-starter. The dramatic tension lies in the gap between "art must serve the race" and "art must tell the truth." Your friend's character is using the slogan to avoid aesthetic rigor. Your protagonist should argue that bad propaganda hurts the cause. The slogan is not a shield; it is a burden. It demands that art be beautiful *and* useful. If the art is preachy and ignored, it fails Du Bois's test just as much as it fails yours. Use the slogan to raise the stakes, not lower them.
