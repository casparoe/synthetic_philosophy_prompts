      *   *Self-Correction on "Friend's 0.2":* Why so low? Maybe they think the forager life was "nasty, brutish, and short" (Hobbesian) and agriculture saved them. This is the traditional view vs. the revisionist (Scott/Graeber) view. I need to highlight this paradigm clash.

