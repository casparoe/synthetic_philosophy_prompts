prompt: |-
  Hey — I write a science-and-ideas column, and I keep having the same argument with my editor. Roughly once a month I get a paper or a press release where two rival explanations fit the same data, and I want to write "scientists can't tell which one is right," and my editor says that's lazy both-sides-ism. Or the mirror image: I write "the evidence favors X," and a researcher on the losing side emails me that the data are underdetermined and I owe them a correction. I need an actual procedure I can run, not vibes.

  What I want is a decision checklist — a flowchart in words — that I can run in about twenty minutes, on the phone, usually with a scientist who is an author of one of the rival theories. I know the rough shape of the philosphy here: that hypotheses get tested in bundles rather than one at a time, so a theory can always be protected by adjusting the background assumptions around it; the difference between "we don't have the evidence yet" and "no evidence anyone could get would separate these"; and the worry that for any theory you can dream up an empirically equivalent rival, which would make the whole complaint cheap. I need that turned into something usable, and I need you to decide which of those distinctions survive the simplification and which can be dropped.

  Please build in gates for at least these:

  - Is the disagreement at the level of the theory, or at the level of the measurement model — do the rivals share the assumption that the instrument is tracking the thing it's supposed to track? If they don't, I think it's a different story, and I want to know which one.
  - Transient vs. strong underdetermination: what's the question I ask to tell them apart, and what counts as a sufficent answer? I want the scientist to have to name the experiment or dataset that would settle it and say roughly when it'll exist, and I want to know what to do when they name something but privately everyone thinks it'll take fifteen years.
  - Is the rival a real research program somebody has worked out, or what I've started calling a zombie rival: it exists as a logical possibility, nobody has shown it can reproduce the rest of the field's data, and it only ever gets wheeled out when this one dataset comes up. Give me a sub-test that kills zombie rivals without me having to accuse a source of bad faith on the phone.
  - When a theory survives a bad result by changing an auxiliary assumption, how do I tell a principled fix from a rescue job? My naive rule is: was that auxiliary already in play, and was it plausible before this dataset came in? Tell me if that rule is wrong, and what to do when the answer is genuinely unclear.
  - When the rivals really are empirically equivalent and the only thing separating them is simplicity, elegance, or fit with what the rest of the field already believes: is that evidence or is it taste? I need a sentence I can put in the piece either way that isn't dishonest.

  I also want the procedure to say where it stops with "file the both-sides version," where it stops with "file the version where one side is ahead," and where it hands the call to me or my editor because it's a stakes question rather than an evidence question — how bad it is to be wrong in each direction, who gets hurt, that sort of thing. Mark those handoffs explicitly.

  Then run it on three cases:

  1. Two models of an ancient-climate proxy. Both fit the same measurements. Model A says the proxy records ocean pH, Model B says it records temperature, and the thing that would settle it is a lab calibration nobody has ever done, which would take years.

  2. A psychology result: a training regime improves test scores. The authors' theory says it's a specific cognitive mechanism; a critic says the same pattern would appear if the effect were really just motivation, and honestly the two predict the same outcomes on every measure in the paper. Nobody has run the subgroup analysis that would separate them.

  3. A case I care about, which I want you to make come out badly for me. I've got a piece half-written where a maverick says the mainstream model only looks confirmed because every lab uses instruments from the same lineage, so one shared systematic error would explain everything — and I framed it as a near-scandal. I suspect your procedure is going to tell me this is a zombie rival and I should kill the framing. Run it and tell me honestly, including what the maverick would have to actually do to make it a live rival.

  Be explicit about what the checklist can't do. I've got a maths-adjacent degree but no stats beyond one regression course, the piece has to be filed the same day, and my editor has to sign off on any line that says a field is genuinely stuck.
reasoning: |-
  Here's a thinking process that leads to the suggested decision checklist and case studies:

  1.  **Analyze the Request:**
      *   **User:** Science columnist.
      *   **Problem:** Conflict with editor over "both-sidesism" vs. "underdetermination." Needs a concrete, 20-minute phone procedure to decide how to frame scientific disputes (stuck vs. settled).
      *   **Requirements:**
          *   A decision checklist/flowchart in words.
          *   Must address specific philosophical distinctions (theory vs. measurement, transient vs. strong underdetermination, zombie rivals, auxiliary assumptions, simplicity vs. evidence).
          *   Must include "handoff" points (when to call the editor/columnist vs. file the story).
          *   Must run the checklist on three specific cases (Climate proxy, Psychology training, Instrument lineage/Maverick).
          *   Case 3 *must* come out badly for the user (honest assessment of the maverick claim).
          *   Constraints: 20-minute call, same-day deadline, limited stats background, editor approval needed for "field is stuck" claims.
          *   Explicitly state limitations of the checklist.

  2.  **Deconstruct the Philosophy (Duhem-Quine, Underdetermination, Lakatos):**
      *   *Theory vs. Measurement:* Crucial. If they disagree on what the ruler measures, they aren't fighting about the object, they're fighting about the ruler.
      *   *Transient vs. Strong Underdetermination:* Transient = we need better tech/time. Strong = logically impossible to distinguish (rare in empirical science).
      *   *Zombie Rivals:* Hypotheses that fit one dataset but fail elsewhere or lack a research program (Lakatosian "degenerating problemshift").
      *   *Auxiliary Assumptions:* Ad hoc modifications vs. independent testability.
      *   *Simplicity/Elegance:* Pragmatic virtues, not truth-tracking per se, but necessary for progress.
      *   *Stakes/Values:* When evidence is equal, consequences matter (e.g., public health).

  3.  **Drafting the Checklist (The "20-Minute Protocol"):**
      *   *Goal:* Actionable questions, not philosophical essays.
      *   *Structure:* Sequential gates. If you fail Gate 1, stop. If you pass, move to Gate 2.
      *   *Tone:* Professional, direct, journalistic.
      *   *Key Gates:*
          1.  **Measurement Agreement:** Do they agree on the data?
          2.  **Research Program Vitality:** Is the rival active or a zombie?
          3.  **Resolution Path:** Is there a specific test? Is it feasible?
          4.  **Auxiliary Check:** Are fixes ad hoc?
          5.  **Tie-Breakers:** If truly tied, what breaks the tie? (Stakes vs. Virtues).
          6.  **Handoff:** When to involve the editor.

  4.  **Refining the Gates (Self-Correction during drafting):**
      *   *Critique:* The user asked for specific questions to ask the scientist.
      *   *Adjustment:* Make the checklist items explicit questions to ask the source.
      *   *Critique:* Need to handle the "15 years" problem.
      *   *Adjustment:* Add a "Feasibility/Timeframe" filter. If the test is 15 years away, treat as "stuck for now" but note the timeline.
      *   *Critique:* Need to handle the "Zombie" test without accusing of bad faith.
      *   *Adjustment:* Ask for *other* predictions or successful applications of the rival theory outside this specific dataset.
      *   *Critique:* Need to handle the "Ad Hoc" fix.
      *   *Adjustment:* Ask if the auxiliary assumption was published/used *before* this anomaly arose.

  5.  **Developing the Case Studies:**

      *   **Case 1: Climate Proxy (pH vs. Temp)**
          *   *Measurement:* Disagree on what the proxy measures. This is a measurement model dispute.
          *   *Resolution:* Lab calibration exists but is hard.
          *   *Verdict:* Transient underdetermination. "Stuck for now" is accurate, but frame it as a measurement calibration issue, not a theoretical crisis.
          *   *Outcome:* File "Stuck" but specify *why* (calibration needed).

      *   **Case 2: Psychology (Mechanism vs. Motivation)**
          *   *Measurement:* Agree on scores.
          *   *Rival:* Motivation is a standard confound, not a zombie.
          *   *Resolution:* Subgroup analysis.
          *   *Verdict:* Transient. The "Mechanism" claim is premature.
          *   *Outcome:* File "Evidence favors effect, mechanism is disputed." Don't say "Mechanism is true."

      *   **Case 3: Instrument Lineage (The Maverick)**
          *   *Constraint:* Must come out badly for the user.
          *   *Analysis:* "All labs use same instruments" is a common conspiracy-adjacent trope unless proven.
          *   *Zombie Test:* Has the maverick shown *other* errors in this lineage? Do they have an alternative model that fits *other* data?
          *   *Auxiliary:* The "systematic error" is being invoked *only* to save the maverick theory.
          *   *Verdict:* Zombie rival. Ad hoc rescue.
          *   *Outcome:* Kill the "scandal" framing. The burden is on the maverick to show the error exists independently.

  6.  **Addressing the "Handoffs" and "Limitations":**
      *   *Handoffs:* If stakes are high (public health, policy), editor must decide risk tolerance. If the field says "we are stuck" but the journalist suspects politics, editor decides.
      *   *Limitations:* Doesn't replace peer review. Doesn't detect fraud. Relies on source honesty (mitigated by asking for specific predictions).

  7.  **Review against Constraints:**
      *   *20 minutes?* Yes, the questions are direct.
      *   *Maths-adjacent?* Avoids heavy stats, focuses on experimental design and logic.
      *   *Editor sign-off?* Included specific triggers for editor involvement.
      *   *Case 3 honesty?* Yes, it will likely categorize the maverick claim as a degenerating research program.

  8.  **Final Polish:**
      *   Ensure the tone is empathetic to the journalist's plight (deadline pressure) but rigorous enough to satisfy the editor.
      *   Make sure the "Sentence for the Piece" requirements are met (specifically for the Simplicity vs. Evidence question).

  **(Self-Correction on Case 3):** I need to be careful not to just say "mavericks are wrong." I need to show *why* the procedure flags it. The key is the "Independent Audit" gate. If the error is only visible when assuming the maverick theory is true, it's circular. The maverick needs to find the error *without* assuming the theory.

  9.  **Final Output Structure:**
      *   Introduction (acknowledging the tension).
      *   The Protocol (The 20-Minute Checklist).
      *   Decision Matrix (Where to file/stop).
      *   Limitations.
      *   Case Studies (1, 2, and 3).
      *   Closing advice.

  Let's write it.
answer: |-
  Here is a procedural checklist designed for your constraints: twenty minutes, phone-based, low-stats, high-stakes editorial oversight. It operationalizes the philosophy of science (Duhem-Quine, Lakatos, underdetermination) into journalistic triage.

  ### The "Underdetermination Triage" Protocol

  **Time limit:** 20 minutes.
  **Source:** An author of one of the rival theories (preferably the mainstream one, then check with the rival).
  **Goal:** Classify the dispute to determine the headline frame.

  #### Gate 1: The Measurement Model (The Ruler Check)
  *Ask:* "Do you and your rivals agree on what this instrument is actually measuring? If they say the data shows X, and you say it shows Y, is that because you interpret the signal differently, or because you think the instrument is broken?"

  *   **If they disagree on the instrument's validity:** This is a **Measurement Dispute**, not a Theory Dispute.
      *   *Action:* Do not write "Scientists disagree on the phenomenon." Write "Scientists disagree on whether the tool works."
      *   *Stop:* Go to Gate 2.
  *   **If they agree on the data but disagree on the cause:** This is a **Theoretical Dispute**.
      *   *Stop:* Go to Gate 2.

  #### Gate 2: The Zombie Test (The Research Program Check)
  *Ask:* "Does this rival explanation have a research program outside of this specific dataset? Can you name one other successful prediction or paper where this rival model was the primary driver, *before* this controversy started?"

  *   **If No (It only exists to explain this anomaly):** This is a **Zombie Rival**. It is a logical possibility, not a scientific competitor.
      *   *Action:* You may frame the mainstream view as "dominant" and the rival as "unproven/speculative." You do not owe them equal weight.
      *   *Stop:* File "One Side Ahead."
  *   **If Yes (It has a track record):** This is a **Live Rival**.
      *   *Stop:* Go to Gate 3.

  #### Gate 3: The Rescue Check (Auxiliary Assumptions)
  *Ask:* "To make your theory fit this new data, did you have to add a new assumption (e.g., a specific error source, a boundary condition)? Was that assumption published or in use *before* this data came in?"

  *   **If No (Invented post-hoc):** This is an **Ad Hoc Rescue**.
      *   *Action:* Note this in the piece. "Theory X survives only by assuming Y, a condition not previously required."
      *   *Stop:* Go to Gate 4.
  *   **If Yes (Independent basis):** This is a **Principled Adjustment**.
      *   *Action:* Treat the theory as robust.
      *   *Stop:* Go to Gate 4.

  #### Gate 4: The Resolution Path (Transient vs. Strong)
  *Ask:* "What specific experiment or dataset would prove you wrong and them right? Does it exist? If not, when will it exist?"

  *   **If "It's logically impossible" or "We can't conceive of a test":** This is **Strong Underdetermination**. (Rare).
      *   *Action:* **HANDOFF TO EDITOR.** This is a philosophical claim, not a scientific one. Requires senior sign-off to publish "Science cannot know this."
  *   **If "We need [Specific Tech/Study]":** This is **Transient Underdetermination**.
      *   *Follow-up:* "Is that study funded? Is the tech available?"
      *   **If >5 years away or unfunded:** Treat as "Stuck for the foreseeable future."
      *   **If <5 years or ongoing:** Treat as "Active contest."
      *   *Stop:* Go to Gate 5.

  #### Gate 5: The Stakes Check (Values vs. Virtues)
  *Ask:* "If you are wrong, what breaks? If they are wrong, what breaks?"

  *   **If Stakes are Low (e.g., ancient climate details):** Rely on **Theoretical Virtues** (simplicity, fit with other fields).
      *   *Sentence for piece:* "While both models fit the data, Model A is preferred for its consistency with established physics, though Model B remains logically possible."
  *   **If Stakes are High (e.g., public health, policy):** This is a **Risk Decision**.
      *   *Action:* **HANDOFF TO EDITOR.** Do not decide based on elegance. The editor/publisher must decide if "precautionary principle" overrides "evidence threshold."

  ---

  ### Decision Matrix (Where to File)

  | Result Path | Headline Frame | Editor Sign-off Needed? |
  | :--- | :--- | :--- |
  | **Gate 1 (Measurement)** | "Debate over data validity, not theory." | No |
  | **Gate 2 (Zombie)** | "Mainstream view holds; rival lacks track record." | No |
  | **Gate 3 (Ad Hoc)** | "Theory survives, but requires new untested assumptions." | No |
  | **Gate 4 (Strong Und.)** | "Field acknowledges current limits of knowing." | **YES** |
  | **Gate 5 (High Stakes)** | "Policy decision made despite uncertainty." | **YES** |

  ### Limitations of This Protocol
  1.  **It does not detect fraud.** It assumes sources are honest about the state of their field.
  2.  **It relies on the "Mainstream" source's knowledge of the "Rival."** If the mainstream scientist dismisses a rival they haven't actually read, Gate 2 fails. *Mitigation:* Ask the rival scientist the Gate 2 question directly.
  3.  **It cannot quantify probability.** It sorts categories, not p-values.
  4.  **It is time-bound.** A "Zombie" today might be a "Live Rival" in ten years. Your piece is a snapshot.

  ---

  ### Case Study Runs

  #### Case 1: Ancient Climate Proxy (pH vs. Temperature)
  *   **Gate 1 (Measurement):** **FAIL/STOP.** Model A says pH, Model B says Temp. They do not agree on what the ruler measures.
      *   *Classification:* Measurement Dispute.
      *   *Protocol Action:* Do not write "Scientists disagree on ancient climate." Write "Scientists disagree on what this rock records."
  *   **Gate 4 (Resolution):** Lab calibration needed. Years away.
      *   *Classification:* Transient Underdetermination (Long horizon).
      *   *Protocol Action:* "Stuck for the foreseeable future."
  *   **Verdict:** File the "Stuck" version, but **qualify it**.
      *   *Drafting:* "The data is precise, but the thermometer is broken. Until a lab calibration is performed—a project researchers say is years away—the record remains ambiguous."
      *   *Editor Handoff:* None needed. This is a technical limitation, not a philosophical crisis.

  #### Case 2: Psychology Training (Mechanism vs. Motivation)
  *   **Gate 1 (Measurement):** **PASS.** Both agree test scores went up.
  *   **Gate 2 (Zombie):** **PASS.** "Motivation" is a standard confound in psych, not a zombie. It has a massive research program.
      *   *Classification:* Live Rival.
  *   **Gate 3 (Rescue):** N/A. The mechanism theory hasn't failed yet; it just hasn't ruled out motivation.
  *   **Gate 4 (Resolution):** Subgroup analysis.
      *   *Feasibility:* High. Data likely exists or is easy to collect.
      *   *Classification:* Transient Underdetermination (Short horizon).
  *   **Verdict:** File "One Side Ahead" regarding the *effect*, but "Stuck" regarding the *cause*.
      *   *Drafting:* "The training improves scores. However, claims that it works via [Cognitive Mechanism] are premature; the data is currently indistinguishable from a simple motivation boost."
      *   *Editor Handoff:* None. This is standard scientific caution.

  #### Case 3: The Instrument Lineage (The Maverick)
  *   **Context:** You framed this as a scandal (Mainstream confirmed only due to shared systematic error).
  *   **Gate 1 (Measurement):** **PASS.** Maverick admits instruments measure *something*, but claims they share a bias.
  *   **Gate 2 (Zombie):** **FAIL.**
      *   *Question:* "Does this rival explanation (shared lineage error) have a research program outside this specific dataset?"
      *   *Likely Answer:* No. The maverick has likely not demonstrated this specific error in other contexts or published a calibration showing the drift *independently* of the theory they are defending.
      *   *Classification:* Zombie Rival / Ad Hoc Rescue.
  *   **Gate 3 (Rescue):** **FAIL.**
      *   *Question:* "Was this specific systematic error identified *before* your theory was challenged by the mainstream data?"
      *   *Likely Answer:* No. It was invented to explain why the mainstream data doesn't match the maverick theory.
      *   *Classification:* Ad Hoc Rescue.
  *   **Gate 4 (Resolution):**
      *   *Question:* "What experiment proves the error exists without assuming your theory is true?"
      *   *Likely Answer:* None yet. They need to measure the instrument error directly.
  *   **Verdict:** **Kill the "Scandal" framing.**
      *   *Why:* The procedure identifies this as a degenerating research program. The maverick is protecting a theory by inventing an invisible error that only exists if their theory is true. This is circular.
      *   *What the Maverick must do to make it Live:* They need to take one of the instruments, put it in a blind test, and show the error *without* reference to the climate/physics data. Until then, it is speculation.
      *   *Drafting:* "Critics argue that shared instrument lineage may introduce systematic bias. However, independent audits of the hardware have not yet confirmed this error. Until such calibration data exists, the mainstream model remains the best fit for the observations."
      *   *Editor Handoff:* **YES.** You suspected this would come out badly. Tell your editor: "I ran the Triage. The rival fails the Zombie and Rescue gates. It is an ad hoc hypothesis. I am downgrading the piece from 'Scandal' to 'Unproven Critique.' If you want to run the Scandal angle anyway, that is a values call, not an evidence call."

  ### Final Advice for the Editor Conversation
  When you hand off the "Stakes" or "Strong Underdetermination" cases, use this script:
  *"The evidence is genuinely equal (Gate 4). The choice between Theory A and Theory B is now about risk tolerance, not data. If we publish A and it's wrong, [Consequence X]. If we publish B and it's wrong, [Consequence Y]. I can report the uncertainty, but I need you to decide which risk the publication is willing to take."*

  This moves the argument from "Is this lazy journalism?" to "What is our editorial risk policy?" which is where it belongs.
