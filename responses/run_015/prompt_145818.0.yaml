prompt: |-
  I have been using the following argument in a short paper. My aim was to show that the frame problem is not a parochial defect of classical symbol-system architecture but a structural obstacle to any account of belief revision. A friend read a draft and objected that if the argument is sound it establishes something nobody could accept: that no finite agent, of any construction, has ever rationally revised a belief. I think she is right that this is what it establishes, and I am not willing to accept it, but I cannot find the bad step. I would be grateful for a diagnosis.

  Set-up. Let an agent's standing beliefs be represented by a probability function P over a large set of variables V = {V₁, ..., Vₙ}. Evidence arrives as an observation Q (the values of one or more variables). Call Vᵢ *Q-sensitive* iff P(Vᵢ | Q) ≠ P(Vᵢ): those are the beliefs that Q rationally moves. A *relevance filter* is a function f that assigns to each possible observation Q a candidate set f(Q) ⊆ V — the beliefs the agent actually re-examines. Call f **safe** iff it never omits a Q-sensitive variable, i.e. f(Q) ⊇ {Vᵢ : P(Vᵢ | Q) ≠ P(Vᵢ)}. Call f **cheap** iff computing f(Q) and revising only f(Q) costs substantially less than order n, so that the filter does its work without canvassing the whole belief state.

  (1) *No local bound on relevance.* Whether Vᵢ is Q-sensitive is settled by the entire joint distribution. Probabilistic relevance between Q and Vᵢ can be carried by chains of intermediate variables of arbitrary length, and can be created or destroyed by the value of any third variable: whether a shift in the price of grain in a distant province should move your beliefs about a colleague's reliability can depend on a dozen intervening links, and can be screened off or unscreened by the value of any one of them. So there is no way of reading off, from Q and Vᵢ together with any fixed bounded neighbourhood of them, whether Vᵢ is Q-sensitive. Equivalently: for every cheap filter f there is some prior P and some observation Q on which f is not safe.

  (2) *Rationality is conditionalization.* A revision rule that is not safe is not one that Bayesianism sanctions. Conditionalization on Q moves every Q-sensitive variable, so an agent who ends up leaving some of them where they were has arrived somewhere no Bayesian update would have put them.

  (3) *Boundedness.* Any agent that gets anything done — a robot, a human, a trained network — must finish revising before the world moves again, and V is enormous. So any real agent must use a cheap filter. Revision that is order n is simply not available to it.

  (4) *Therefore no real agent revises rationally.* By (3) revision must be cheap; by (1) no cheap filter is safe; by (2) an unsafe revision is not rational. Note what (4) is not: it is not a complaint about symbol systems. It applies to anything with a large body of standing beliefs and finite time — to scientists, to online learners, to embodied agents, to whatever you prefer. So the argument cannot be deployed the way I was deploying it, as an indictment of one research program. That is the sense in which it seems to me to prove too much.

  (5) *The obvious repair fails.* Store an explicit relevance map R alongside P — a structure recording, for each variable, which observations can affect it — and consult R instead of computing sensitivities on the fly. But R is itself part of the belief state. After Q arrives, R may need revising too, since Q can reveal that the map was wrong; revising R requires a filter; that filter requires a further map R′; and so on. The repair relocates the problem one level up.

  (6) *A friend's variant of the repair.* Do not store a full relevance map. Store instead a *shadow structure* S: for each variable, a list of those other variables whose *relevance entries* it can affect, and nothing more. She claims S is sparser than R by an order of magnitude, and that the regress halts because updating S in response to Q only ever requires touching the shadow entries of the variables in f(Q). I cannot tell whether this is a genuine stopping point or just (5) with better bookkeeping.

  Where does the argument go wrong — which step, exactly — and why did that step look secure enough to carry the weight I put on it? I would like to keep (1) and (3) if I can, since (1) seems to me to be close to a theorem and (3) to a plain fact about the world; but I would take a diagnosis that sacrifices (2) instead if that is cheaper. Please price the main alternatives rather than just naming one: what has to be conceded if the trouble is in (1) — for instance, that relevance is in fact structurally tractable and that the holism which made the problem look deep was overstated, together with whatever then has to be said about where that structure comes from — and what has to be conceded if the trouble is in (2), where the cost looks like losing a unified standard for belief revision and having to say which approximations are permissible and why. And please tell me what you make of the shadow structure in (6): is halting the regress there a substantive empirical claim about the sparsity and stability of higher-order relevance, or is it the same regress in disguise?
reasoning: |-
  Here's a thinking process that leads to the suggested diagnosis:

  1.  **Analyze the User's Request:**
      *   **Goal:** The user has an argument claiming the Frame Problem is a structural obstacle to *any* account of belief revision (not just classical AI).
      *   **The Problem:** A friend pointed out that if the argument is sound, it implies *no finite agent has ever rationally revised a belief*. The user agrees this consequence is unacceptable ("proves too much") but can't find the flaw.
      *   **The Argument Structure:**
          1.  *No local bound on relevance:* Relevance is holistic/global. Cheap filters can't be safe (guaranteed to catch all relevant variables).
          2.  *Rationality is conditionalization:* Rational revision *requires* updating all Q-sensitive variables (Safety).
          3.  *Boundedness:* Real agents have finite time/resources. They *must* use cheap filters.
          4.  *Conclusion:* No real agent revises rationally.
          5.  *Failed Repair:* Explicit relevance maps lead to regress.
          6.  *Friend's Repair:* Shadow structures (meta-relevance) might stop the regress.
      *   **Constraints:** The user wants to keep (1) and (3) if possible. They are open to sacrificing (2). They want a "pricing" of alternatives (what do we give up if we fix it here vs. there?). They want an analysis of the "shadow structure" proposal.

  2.  **Deconstruct the Argument Steps:**

      *   **Step (1): No local bound on relevance.**
          *   *Claim:* Probabilistic dependence is global. You can't know if $V_i$ depends on $Q$ without checking the whole graph/distribution.
          *   *Assessment:* This is technically true for *arbitrary* Bayesian networks. However, in the *actual* world (and in useful models of it), dependencies are often sparse or localized. Causal structures usually have limited range. But as a logical point about *possible* distributions, it holds.
          *   *Vulnerability:* It assumes the agent must guarantee safety against *all possible* priors $P$. But agents operate with *specific* priors learned from a structured world.

      *   **Step (2): Rationality is conditionalization.**
          *   *Claim:* To be rational, you must update *every* variable whose probability shifts ($P(V|Q) \neq P(V)$). If you miss one, you are irrational.
          *   *Assessment:* This is the strongest candidate for the "bad step." It defines rationality as *logical omniscience* regarding relevance. It equates "rational" with "ideal Bayesian updater with infinite compute."
          *   *Vulnerability:* This is a normative ideal, not a feasible standard for bounded agents. If we accept this, we define rationality in a way that makes it impossible for humans. We need a notion of *bounded rationality*.

      *   **Step (3): Boundedness.**
          *   *Claim:* Agents are finite; $V$ is large; $O(n)$ is too slow.
          *   *Assessment:* Hard to deny. Physical constraints exist.
          *   *Vulnerability:* Maybe $n$ isn't as big as thought? Maybe heuristics are $O(1)$ on average? But generally, this is solid.

      *   **Step (4): Conclusion.**
          *   *Claim:* Therefore, no rational revision happens.
          *   *Assessment:* This is the *reductio ad absurdum*. Since the conclusion is false (people *do* revise beliefs rationally enough to survive/thrive), one of the premises must be false or ambiguous.

  3.  **Identify the Core Flaw:**
      The argument relies on an equivocation on the word "Rational" (or "Safe").
      *   In (1), "Safe" means *logically guaranteed* to miss nothing (worst-case scenario over all possible distributions).
      *   In (2), "Rational" is defined as adhering to that logical guarantee.
      *   In (3), "Real" means operating in the actual world with actual distributions.

      The flaw is in **(2)**. It sets a standard of rationality that ignores the cost of computation. If the cost of checking relevance is higher than the benefit of the update, a rational agent *should* skip it. This is the heart of **Bounded Rationality** (Simon, Cherniak, etc.).

      Alternatively, the flaw could be in **(1)** if interpreted as applying to *actual* world structures rather than *possible* ones. The world is causally local. Relevance *does* decay with distance in causal graphs. But the user wants to keep (1). So I should focus on (2).

  4.  **Evaluate the "Shadow Structure" (6):**
      *   The friend suggests storing meta-relevance (which variables affect relevance entries).
      *   *Analysis:* This looks like trying to compile the inference. It works *if* the meta-structure is stable. But if the world changes such that the meta-structure is wrong, you need meta-meta-structure.
      *   *Verdict:* It's likely just pushing the regress back. It assumes the "shadow" is static. If the shadow needs updating, you're back to square one. It's a engineering fix, not a philosophical dissolution of the problem.

  5.  **Drafting the Diagnosis:**

      *   **Acknowledge the strength:** The argument is a classic formulation of the Frame Problem/Logical Omniscience problem. It's rigorous.
      *   **Pinpoint the break:** Step (2) is the culprit. It conflates *ideal* rationality with *feasible* rationality.
      *   **Price of fixing (2):** We must adopt a theory of **Bounded Rationality**. We concede that "rational" means "doing the best one can within constraints," not "matching the God's-eye Bayesian view." We need an account of *satisficing* or *resource-rationality* (e.g., Anderson, Griffiths, Lieder).
      *   **Price of fixing (1):** If we attack (1), we claim the world is structurally simple enough that relevance *is* locally bound. This requires a strong empirical claim about causal sparsity. It saves ideal rationality but demands a very specific ontology of the world.
      *   **Price of fixing (3):** Deny boundedness? Impossible for physical agents.
      *   **Analysis of (6):** It's a regress in disguise unless one posits a fixed, immutable meta-structure (which is dogmatic).

  6.  **Refining the Argument against (2):**
      *   The definition of "Q-sensitive" in the setup is $P(V_i | Q) \neq P(V_i)$.
      *   The definition of "Safe" is capturing *all* such $V_i$.
      *   The argument assumes that missing a *tiny* shift is irrational.
      *   *Counter:* If $P(V_i)$ moves from 0.5 to 0.5000001, is it irrational to ignore it? No.
      *   *Refinement:* Rationality involves a trade-off between accuracy and computational cost. Step (2) ignores the cost term in the utility function of belief formation.

  7.  **Structuring the Response:**
      *   **Introduction:** Validate the user's intuition. The argument is valid, but the conclusion is false, so a premise is false.
      *   **The Diagnosis:** Identify Step (2) as the "bad step." Explain why (Equivocation on Rationality).
      *   **Pricing the Alternatives:**
          *   *Option A (Fix 2 - Recommended):* Bounded Rationality. Cost: Loss of ideal normative standard. Gain: Realistic psychology/AI.
          *   *Option B (Fix 1):* Causal Locality. Cost: Strong empirical assumptions about the world. Gain: Keeps ideal rationality.
          *   *Option C (Fix 3):* Impossible.
      *   **The Shadow Structure (6):** Analyze it. It's a regress unless the shadow is fixed a priori.
      *   **Conclusion:** Summarize the path forward.

  8.  **Self-Correction/Nuance Check:**
      *   *Wait, does (1) really hold?* In a dense Bayesian net, yes. In a causal net with Markov properties, relevance decays. But the user wants to keep (1). I should respect that but mention that (1) is only true for *arbitrary* distributions, not *natural* ones.
      *   *Is (2) definitely the spot?* Yes. The definition of rationality as "perfect conditionalization regardless of cost" is the standard philosophical move that leads to skepticism. The "Resource-Rationality" framework is the modern answer.
      *   *What about the friend's objection?* The friend is right. The argument proves too much. This confirms (2) is too strong.
      *   *Shadow Structure:* Be careful not to dismiss it entirely. It's how databases work (indices). But indices need maintenance. The maintenance cost is the Frame Problem again.

  9.  **Final Polish:** Ensure the tone is collegial and philosophical. Use the terminology provided (Safe, Cheap, Sensitive). Make sure to explicitly answer the "pricing" request.

      *(Self-Correction during drafting)*: I need to be careful about Step (1). The user says (1) seems close to a theorem. It is a theorem *for arbitrary graphs*. It is not a theorem for *causal graphs with limited diameter*. I should point out that keeping (1) commits the user to the claim that the world could be arbitrarily entangled. If they want to save rationality, they might need to soften (1) to "No local bound on relevance *in the worst case*," which allows for "Local bound on relevance *in our world*." But since they asked to price fixing (2) vs (1), I will focus on the normative shift in (2) as the cheaper cost.

      *Revised plan:*
      1. Validate the friend.
      2. Identify (2) as the primary error (Normative Overreach).
      3. Identify (1) as a secondary vulnerability (Empirical Pessimism).
      4. Analyze (6).
      5. Provide the "Price List."

