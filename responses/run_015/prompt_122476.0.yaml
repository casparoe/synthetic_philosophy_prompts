answer: |-
  ### Interview Questions for Dr. V.

  **1. The Entry Problem**
  *   **Question:** You argue that a letter is defined by its job in a system, not by its shape. But to know what job a mark does, don't we first have to recognize the mark well enough to assign it to that system?
  *   **Testing:** The circularity of system-dependence (Pressure 1).
  *   **Expected Answer:** Recognition comes from familiarity with the *practice* of writing, not just visual matching.
  *   **Follow-up:** If practice is the key, and we detect practice by seeing certain shapes recur, haven't you just made shape the evidence for the system, and therefore the real definition?

  **2. The Inventory Trap**
  *   **Question:** If I hand you a box of random marks and ask which system they belong to, you'd sort them by looking at their shapes. If shape is merely style, how do you sort the inventory without using style as your criterion?
  *   **Testing:** Whether shape is doing the foundational work despite the theory (Pressure 1).
  *   **Expected Answer:** We sort by functional equivalence in context, not visual similarity.
  *   **Follow-up:** But without visual similarity, how do you know the context is the same? Aren't you relying on the very visual cues you claim are secondary?

  **3. The Machine Generator**
  *   **Question:** Consider a font model that generates a perfect 'a' without a human writer behind it. It has no intent and belongs to no community practice yet. Is that mark a letter, or just a shape waiting for a user?
  *   **Testing:** The anchoring problem regarding intent and practice (Pressure 2).
  *   **Expected Answer:** It becomes a letter only when adopted into a human practice of reading or writing.
  *   **Follow-up:** So the physical mark is identical in both cases, but its ontology changes based on a future event. Does that mean a letter is a promise, not an object?

  **4. The Solo Inventor**
  *   **Question:** If one person invents a private script and writes a diary no one else will read, do those marks count as letters? Or does the system require a second person to complete the circuit?
  *   **Testing:** The community requirement of anchoring (Pressure 2).
  *   **Expected Answer:** If the writer treats them as normative symbols within a system, they are letters, even if private.
  *   **Follow-up:** Then the system exists entirely in one head. If that person forgets the rules, do the letters cease to exist mid-sentence?

  **5. The Dead Script**
  *   **Question:** Take a script that no living person can read. The shapes remain, but the practice is gone. Do those marks cease to be letters and become mere drawings the moment the last reader dies?
  *   **Testing:** The temporal stability of the anchoring practice (Pressure 2).
  *   **Expected Answer:** They remain letters because the *historical* practice anchors them, even if current practice is broken.
  *   **Follow-up:** But if history anchors them, why can't we revive a dead letter by drawing it today? What stops me from writing in a script that no longer exists?

  **6. The Spirit of the Style**
  *   **Question:** You separate the letter from the shape, calling shape the "spirit" or style. But what makes a hand-painted 'a' and a digital 'a' the same *style* when they share no measurable geometric properties?
  *   **Testing:** Account of letterform identity versus letter identity (Pressure 3).
  *   **Expected Answer:** They share a set of relational proportions or a common design intent, not specific coordinates.
  *   **Follow-up:** If those proportions drift, when does the spirit break? Is style just a statistical average of what readers tolerate?

  **7. The Continuous Morph**
  *   **Question:** If you digitally interpolate an 'a' until it becomes a 'u', is there a specific frame where the letter identity switches, or does it fade gradually?
  *   **Testing:** The determinacy of boundaries in style and identity (Pressure 3).
  *   **Expected Answer:** The identity switches abruptly based on the reader's categorical perception, not the shape's gradual change.
  *   **Follow-up:** So the letter is not in the file, but in the viewer's brain. Does that mean two people looking at the same ambiguous mark are seeing two different letters?

  **8. The Lone Logo**
  *   **Question:** If a company logo uses only the letter 'A' and no other alphabet, does that 'A' lose its status as a letter since it no longer contrasts with 'B' or 'C'?
  *   **Testing:** Holism about design and system dependence (Pressure 4).
  *   **Expected Answer:** No, because it invokes the latent system of the Latin alphabet in the viewer's mind.
  *   **Follow-up:** Then the system doesn't have to be physically present to function. Why do we need the other letters at all if the mind supplies them?

  **9. The Expanding Alphabet**
  *   **Question:** If we add a new character to the alphabet tomorrow, does the identity of every existing letter change slightly, because their contrastive roles have shifted?
  *   **Testing:** The stability of identity under holism (Pressure 4).
  *   **Expected Answer:** Technically yes, their positions in the system shift, though the change is negligible for practical use.
  *   **Follow-up:** If identity is always shifting with the system, how do you ever define the thing you're studying? Isn't the target constantly moving?

  **10. The Error Boundary**
  *   **Question:** You say a child's wobbly 'a' is a bad letter, but a water stain is not a letter at all. If both are physically imperfect, what distinguishes a mistake from a non-entity?
  *   **Testing:** Normativity versus physicality (Pressure 5).
  *   **Expected Answer:** The child's mark carries an intention to follow a rule; the stain does not.
  *   **Follow-up:** So a perfect forgery is a letter, but a perfect stain is not. The physics is identical; only the history matters. Is science equipped to study history?

  **11. The Psychological Reality**
  *   **Question:** As a psychologist, do you have evidence that the brain actually processes letters as systemic roles, or is this a philosophical framework that happens to fit the data?
  *   **Testing:** The empirical basis of the theory (Pressure 5).
  *   **Expected Answer:** Neuroimaging suggests categorical perception aligns with systemic roles rather than visual features.
  *   **Follow-up:** If future imaging shows the brain tracks shape first and system second, does your theory collapse, or can it survive as a description of culture rather than cognition?

  **12. The Unfinished Edge**
  *   **Question:** Where does this theory currently fail to give you an answer? Is there a class of marks you simply cannot categorize yet?
  *   **Testing:** Vulnerability and limits of the theory (Pressure 5).
  *   **Expected Answer:** Ambiguous cases like emoji-text hybrids or code-switching scripts where the system itself is unstable.
  *   **Follow-up:** If the system is unstable, and the letter depends on the system, does that mean we are entering an era where letters no longer have fixed identities?

  ***

  ### Evaluation of Pressures

  *   **Pressure 1 (The Circle):** This does not misfire, but it requires careful handling. Dr. V's theory relies on "practice" to break the circle, not shape. The harder version (used in Q1 & Q2) presses whether "practice" is observable without relying on shape recognition, forcing her to admit that visual regularity is the *proxy* for practice, which risks reintroducing shape as foundational.
  *   **Pressure 3 (Letterform Identity):** This pressure misfires slightly if taken literally. Dr. V's theory (2) explicitly relegates shape to "style," so asking what makes two shapes the "same letterform" might invite her to say "They aren't; they are the same *letter* in different *styles*." The harder version (used in Q6 & Q7) asks what governs the *identity of the style itself*, forcing her to explain how "spirit" has rules if it isn't defined by geometry.
  *   **Pressure 4 (Holism):** This does not misfire. The theory commits her to system-dependence. The harder version (used in Q9) pushes the consequence that letter identity is inherently unstable as the system evolves, challenging the utility of "identity" as a concept.
