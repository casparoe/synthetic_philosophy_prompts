          *   Assess Normative Force (Does it justify inaction?).
      *   Synthesis/Conclusion: Which reading actually does the work? (Spoiler: None of them fully do without extra premises).
      *   Actionable Advice: How to reply in the club.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *consequentialist* reasons (making things better) and *non-consequentialist* reasons (integrity, complicity). The classmate is assuming consequentialism. I need to point that out.
      *   *Correction:* Ensure the "Voting" example is handled carefully, as the causal argument there is stronger than with diet.
      *   *Tone:* Academic but accessible (high school/college club level).

  7.  **Final Polish:** Check against the prompt requirements.
      *   Distinct precise theses? Yes.
