answer: |-
  This is a classic move in ethical debate, often called the **futility argument** or the **inefficacy objection**. Your intuition is correct: the phrase is a chameleon. It shifts meaning to avoid being pinned down. When pressed on causality, it retreats to measurability; when pressed on measurability, it retreats to systemic futility.

  To dismantle it, you need to force your classmate to pick a specific lane. Here are the four distinct precise theses hidden inside "one person's actions won't make a difference," evaluated by truth and normative force.

  ### 1. The Causal Threshold Thesis
  **The Claim:** "My specific action will not be the *tipping point* that triggers a change in outcome."
  *   **Example:** "My not buying this chicken breast won't be the exact purchase that causes the store to order one fewer chicken."
  *   **Truth Value:** **Substantive but often False.**
      *   In discrete systems (e.g., a petition needing 10,000 signatures), this might be true. But in continuous markets (like food demand or carbon emissions), economic theory suggests individual consumption creates *marginal* impacts. If enough people stop buying, prices shift, production scales down, and supply chains adjust. Your purchase is part of the aggregate signal. To say it has *zero* causal impact is mathematically unlikely; it has a *fractional* impact.
  *   **Does it support the conclusion?** **No.**
      *   Even if you aren't the *tipping point*, you are still contributing to the pressure. If 1,000 people push a car and it moves, the 1,000th person can't claim their push made no difference, but neither can the 1st.
      *   **The Reply:** "If you mean you won't single-handedly solve climate change, that's true but irrelevant. Ethics isn't about being the sole savior; it's about not contributing to the harm."

  ### 2. The Negligibility Thesis
  **The Claim:** "The impact of my action is so statistically small that it is effectively zero."
  *   **Example:** "The CO2 from my one flight is a rounding error in the global atmosphere."
  *   **Truth Value:** **Trivially True.**
      *   Yes, one person's emissions are a tiny fraction of the whole. Physically, the difference is undetectable.
  *   **Does it support the conclusion?** **No.**
      *   This commits the **Fallacy of Composition**. Just because a part is negligible doesn't mean the sum of the parts is. More importantly, "negligible" does not mean "non-existent." If everyone poured one drop of poison into a reservoir, the reservoir would be toxic. The fact that one drop is undetectable doesn't make pouring it morally permissible.
      *   **The Reply:** "If you mean the impact is too small to measure, that's true. But 'too small to measure' isn't the same as 'morally irrelevant.' A single vote is negligible, but we don't say voting is pointless."

  ### 3. The Expected Utility Thesis
  **The Claim:** "The *probability* of my action resulting in a good outcome is so low that the 'expected value' of the action is zero."
  *   **Example:** "The chance that my vote changes the election is 1 in a million, so the rational choice is not to vote."
  *   **Truth Value:** **Substantive and Defensible.**
      *   This is the strongest version of the argument, particularly regarding voting or specific consumer choices in complex supply chains. It relies on probabilistic reasoning.
  *   **Does it support the conclusion?** **Only if you accept a hidden premise.**
      *   This only works if you assume **Act Consequentialism** (the only thing that matters is the tangible outcome of *this specific act*). It ignores **Expressive** or **Integrity-based** reasons. We often do things to align our actions with our values, regardless of the probabilistic outcome.
      *   **The Reply:** "If you mean the odds of a tangible payoff are low, that's defensible. But that assumes the *only* reason to act is to guarantee a result. It ignores acting with integrity, or setting an example that influences others (social contagion)."

  ### 4. The Systemic Distraction Thesis
  **The Claim:** "Focusing on individual action actively harms the goal by diverting attention from systemic regulation."
  *   **Example:** "Worrying about plastic straws lets corporations off the hook for industrial pollution."
  *   **Truth Value:** **Substantive and Debatable.**
      *   This is an empirical claim about strategy. Some evidence suggests "carbon footprint" campaigns were designed by oil companies to shift blame to individuals. However, other evidence suggests individual behavior change creates the political will for systemic change.
  *   **Does it support the conclusion?** **No, it supports a different conclusion.**
      *   Even if this is true, the conclusion isn't "do nothing." The conclusion is "do systemic work *instead* (or *in addition*)." It does not justify continuing to harm the environment while waiting for regulation.
      *   **The Reply:** "If you mean individual action isn't *enough*, I agree. But that argues for doing more, not less. It doesn't justify continuing to fly unnecessarily while waiting for a law to stop you."

  ***

  ### Summary for Your Debate
  Here is how you can package this in the club meeting:

  > "When you say 'one person's actions won't make a difference,' you could mean three things.
  >
  > 1.  **If you mean** my action won't solve the problem alone (**Threshold**), that's **true but irrelevant**. Ethics isn't about being the sole hero.
  > 2.  **If you mean** my impact is too small to measure (**Negligibility**), that's **true but logically flawed**. A million drops make a flood; you can't claim your drop doesn't count.
  > 3.  **If you mean** the odds of success are low (**Expected Utility**), that's **defensible but incomplete**. It assumes the only reason to act is a guaranteed payoff, ignoring integrity and social influence.
  >
  > None of these readings get you to the conclusion that I have *no reason* to change. At best, they argue that individual action isn't *sufficient*. But 'not sufficient' is not the same as 'not necessary' or 'not obligatory.'"

  ### Which reading does the work?
  Honestly? **None of them do the work your classmate wants them to do on their own.**

  To get from "my action makes little difference" to "I have no reason to act," your classmate needs a hidden **Normative Premise**: *"An individual is only obligated to act if their action is causally sufficient to solve the problem."*

  That premise is obviously false. We have obligations not to pollute, not to steal, and not to harm, even if our individual contribution to a larger harm seems small. Your best strategy is to expose that hidden premise and ask them to defend *that*.
