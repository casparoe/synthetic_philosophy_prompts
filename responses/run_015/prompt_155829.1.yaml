      *   *The Hologram:* Show the block. 1920s brick. The proposed tower casts a shadow.
      *   *Henderson's speech:* "I painted these walls."
      *   *Kael's speech:* "People are sleeping in the flood zones."
      *   *The Screen:* The "Equity Curve." It flatlines.
