      *   **Setting:** Near-future municipality.
      *   **Key Institution:** Temporal Equity Council (TEC) replaces zoning board.
      *   **Mechanism:** Adjudicates development based on current residents, *weighted* past inhabitants, and *weighted* future residents.
      *   **Specific Case:** Demolish historic low-rise worker housing (elderly tenants, "continuity rights") vs. High-rise cooperative (climate refugees/transient laborers, "right to the city/exclusion").
      *   **Protagonist:** Philosopher-engineer who designed the weighting system.
      *   **Conflict:** The algorithm fails to answer the *prior* question: Who has the right to shape the city? (Occupancy vs. History vs. Need).
      *   **Resolution:** No simple vote. Realization of the system's limitation.
      *   **Style:** Concrete detail (sensory, institutional), embedded philosophy (not just dialogue).
      *   **Post-Story:** Author's note distinguishing theory from fiction, settled vs. contested concepts.

  2.  **Character & Setting Development:**
      *   *Protagonist:* Dr. Elara Vance. Needs to feel tired, technical, but deeply philosophical. She built the "Chronos Scale."
      *   *Setting:* The Council Chamber. Needs to feel futuristic but bureaucratic. Holographics, silence, weight.
      *   *The Site:* "The Iron Row." Brick, low-rise, worn. vs. "The Spire." Glass, efficient, vertical.
      *   *The Parties:* Mr. Henderson (elderly tenant, represents continuity) vs. Sarah Kael (advocate for refugees, represents need).

  3.  **Plot Outline:**
      *   **Introduction:** Elara in the chamber. The atmosphere. Introducing the Chronos Scale interface.
      *   **The Case:** Presentation of the Iron Row demolition proposal. Visuals of the old vs. the new.
      *   **The Testimony:**
          *   Henderson: Memory, sweat equity, social fabric.
          *   Kael: Urgency, exclusion, global justice.
      *   **The Algorithm:** Elara watches the numbers shift. Past weights vs. Future weights.
      *   **The Climax/Turning Point:** The numbers stall or contradict. Elara realizes the metric is measuring *intensity* of claim, not *validity*.
      *   **Conclusion:** Elara abstains or halts the process. A moment of silence. The question remains open.

  4.  **Drafting - Section by Section:**

      *   *Sensory Details:* The hum of the servers, the texture of the brick in the hologram, the dust on the old windows, the sterile light of the chamber.
      *   *The Algorithm:* Call it the "Temporal Weighting Protocol." It needs to visualize time. Ghostly figures for the past? Silhouettes for the future? Let's go with data streams that look like sediment layers.
      *   *The Conflict:* Make sure neither side is a villain. The old residents aren't NIMBYs out of greed; they are guardians of memory. The developers aren't capitalists; they are humanitarians solving a crisis. This makes the philosophical tension sharper.
      *   *Elara's Realization:* She sees the algorithm trying to commensurate incommensurable things. How many future lives equal one past memory?

  5.  **Refining the Philosophy:**
      *   *Right to the City:* Lefebvre's idea is about participation, not just access.
      *   *Continuity Rights:* Based on Locke's labor mixing? Or just communal stability?
