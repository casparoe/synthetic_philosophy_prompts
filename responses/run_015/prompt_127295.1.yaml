      *   **Tone:** Plain language, explain jargon, no fluff.
      *   **Core Conflict:** Mathematical facts are either true or false (0 or 1 probability). A Strict Bayesian already "knows" this in principle, so computing them has no *epistemic* value, only cost. A Bounded Agent knows they don't know yet, so computing has value.
      *   **Constraints:**
          *   Ordinary setting (codebase, deadline, solver). No sci-fi/oracles.
          *   Uncertainty must be *purely* mathematical (close the "hardware might fail" or "checker might be buggy" escape hatches).
