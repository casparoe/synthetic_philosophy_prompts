answer: |-
  **NORTHWOOD HIGH SCHOOL**
  **DEPARTMENT OF ETHICAL COMPLIANCE**
  **FORM MVF-40: MOTIVE VERIFICATION & MORAL WORTH ATTESTATION**

  **ISSUING OFFICER:** Mr. Halloran, Assistant Principal for Ethical Compliance
  **SUBJECT:** Validation of Community Service Hours (Grade 11-12)

  **PURPOSE:**
  Per the revised Graduation Integrity Act, mere completion of 40 service hours is insufficient for diploma conferral. To possess moral worth, an action must be undertaken from duty, not merely in conformity with duty. This form verifies the *maxim* upon which your service was based. Please print legibly. Illegibility suggests a lack of commitment to truth.

  **SECTION 1: MOTIVE CLASSIFICATION**
  *Select exactly ONE (1) primary motivator. Multiple selections will void the submission.*

  [ ] **Pure Moral Duty:** I performed this service solely because it was the right thing to do, regardless of personal feeling.
  [ ] **Inclination/Enjoyment:** I performed this service because I found it personally satisfying or fun.
  [ ] **External Coercion:** I performed this service because a parent or guardian mandated it.
  [ ] **Prudential Reason:** I performed this service to enhance college applications or resume status.
  [ ] **Social Opportunity:** I performed this service to be near peers or romantic interests.

  **SECTION 2: ATTESTATION**
  I certify that my will was determined solely by the moral law during the entirety of the shift. I understand that deriving pleasure from the act may retroactively negate its moral value.

  ***

  **FREQUENTLY ASKED QUESTIONS**

  **Q: I genuinely enjoyed feeding the homeless. Does this disqualify my hours?**
  **A:** Yes. If you acted from inclination (enjoyment), the action lacks moral content. You were merely satisfying a desire, like eating a sandwich. Hours will be denied. Please submit a reflection essay on why you *should* have found it difficult.

  **Q: I hated every second of the beach cleanup. Do I get credit?**
  **A:** Likely. Resistance to inclination suggests the action was performed from duty. Your suffering is evidence of ethical integrity. Please attach a signed statement from a supervisor confirming your visible dissatisfaction.

  **Q: Can I select both "Duty" and "Resume"?**
  **A:** No. Moral purity requires singularity. If you acted for two reasons, you acted for neither. This is not a "both/and" scenario. Please consult your conscience and delete the impure motive.

  **Q: Since the school requires these hours to graduate, isn't all service coerced?**
  **A:** The graduation requirement is merely the occasion for the action, not the determining ground of the will. You must mentally transcend the requirement while physically fulfilling it. If you cannot distinguish between obligation and necessity, you are not yet ready for citizenship.

  **Q: My faculty advisor, Mrs. Gable, smiled while volunteering. Is she compromised?**
  **A:** We are reviewing Mrs. Gable's file. Enthusiasm in a supervisory role suggests she may be acting from inclination rather than professional duty. Her hours toward her own licensure renewal are currently on hold pending an ethical audit.

  ***

  **WORKED EXAMPLE: CASE STUDY 44-B**

  **Student:** Jason T.
  **Activity:** Park Litter Removal
  **Submitted Motive:** Pure Moral Duty
  **Supervisor Note:** "Jason listened to music and joked with friends the whole time."
  **Decision:** **DENIED.**
  **Reasoning:** The supervisor's note indicates the student was operating from social inclination. The presence of enjoyment invalidates the duty. Had Jason worked in silence and expressed sorrow over the state of the park, the hours would have been approved.

  **Student:** Sarah L.
  **Activity:** Park Litter Removal
  **Submitted Motive:** Pure Moral Duty
  **Supervisor Note:** "Sarah appeared visibly bored and complained about the smell."
  **Decision:** **APPROVED.**
  **Reasoning:** The discomfort confirms the action was not driven by desire. Sarah acted against her inclinations, fulfilling the Categorical Imperative.

  ***

  **APPEALS PROCESS**
  If your hours are denied due to impure motives, you may appeal to the Ethics Committee. Note: Appeals based on "fairness" or "common sense" will be rejected, as morality is not concerned with convenience.

  **SUBMIT TO:** Room 304 (Do not knock; leave form in slot)
  **DEADLINE:** Before the bell. Late forms suggest a lack of respect for the procedure.

  **Mr. Halloran**
  *Assistant Principal for Ethical Compliance*
  *Northwood High School*
