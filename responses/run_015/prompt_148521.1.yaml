answer: |-
  You need to cut step (5).

  It looks plausible because it treats the value of the whole as a sum of the isolated values of its parts, which seems to follow from (4) and the intuition that if the object alone is worthless, it adds nothing to the mix. However, this directly contradicts (2), the principle of organic unities, which states that a part's contribution to a whole is not determined by its value in isolation. To see why (5) fails while (2) holds, run the mirror cases. In the case of the friend whose love you never appreciate, the object (the love) exists but the consciousness does not; Moore agrees this has little value, showing consciousness is necessary. In the case of the hallucinator whose memory collapses, the consciousness exists but the object does not; if step (5) were true, this state would be equal in value to the veridical one at the time it occurred, but Moore insists the existence of the real object is a constitutive part of the greater good, not merely a causal trigger. The collapse of memory later doesn't retroactively erase the value, but it reveals that the original state was a different, less valuable whole than the veridical one because the object was missing. These cases demonstrate that the object's contribution to the whole [consciousness + object] is substantial, even if its isolated value is near zero, proving that (5) illicitly ignores (2).

  Regarding the other exits, adding a 'contact requirement' is not merely bolting on the conclusion but is the cost of defining the valuable whole correctly; the price is abandoning pure mentalism, admitting that intrinsic value depends on external facts about existence and causation, which complicates the epistemology of value but saves the objectivity of the good. Alternatively, claiming the isolation test cannot be run on intentional states prices even higher: it undermines the foundational methodology of *Principia Ethica*, rendering the test useless for almost all candidate goods since most involve consciousness *of* something, leaving you without a systematic way to distinguish intrinsic goods from mere pleasures.
