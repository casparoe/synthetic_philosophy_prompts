prompt: |-
  I spent most of my career in marine geophysics — magnetic anomaly surveys, largely off the Reykjanes Ridge — and since retiring I have been auditing the philosophy of science reading group at the university I used to work for. They have asked me to take one of their work-in-progress slots next month, and I would like to use it to defend a position on the problem of old evidence that I have been working out on my own, in my own vocabulary, without much knowledge of how the professionals argue about it. What I want from you is not a defence of the position but a Q&A preparation sheet: I know the room, I know roughly who will be in it, and I would rather walk in having already been beaten up on paper.

  The position, briefly. Old evidence — evidence you already had in hand when you first took a theory seriously — plainly does lend theories support: the advance of Mercury's perihelion is the shopworn example, and the one from my own field I would rather talk about is the symmetrical striping of magnetic anomalies either side of the mid-ocean ridge crests, which was mapped before anyone had the seafloor-spreading-plus-reversals explanation for it (I am hazier than I would like about the exact chronology of the surveys, and I would like to know now whether that is going to sink me). And yet the Bayesian machinery gives you nothing: if the evidence is already in your background knowledge, your probability for it is one, and conditioning on it cannot move your credence in the theory. My diagnosis is that two questions have been run together. There is a static question — how much support a piece of evidence gives a theory relative to a body of background belief — and there is a dynamic question — what ought to happen to your credence when you learn something. I want to answer the static one by evaluating the support against the belief state you were in *before* the evidence arrived rather than the one you are in now, which I have been calling the retrospective prior manoeuvre. And I want to answer the dynamic one by pointing out that in an old-evidence episode what is genuinely new to you is not the datum but the news that the theory would have led you to expect it: that it entails it, and entails it without having been bent to fit it. So the update goes on the derivation rather than on the datum, and the size of the boost should track how surprising you find it that the theory says that about the evidence — roughly, how improbable you would have said it was, before you had the theory in view, that it would turn out to entail the datum. I am aware, dimly, that these two answers may not always agree with one another, and I would like that worry sharpened rather than smoothed over.

  The room will be about a dozen people. There will be a senior philosopher of science who works on measures of confirmation and thinks in terms of the difference between the probability of the evidence given the theory and its probability given the background alone; he will want to know what fixes the earlier belief state I am appealing to, since it is counterfactual, partly lost, and selectable at will, and he will suspect I have simply relocated the arbitrariness of the prior into the choice of time slice. There will be a formal epistemologist who thinks exclusively in terms of credences and updating and who will probably say that a support relation that never touches credence is not confirmation at all, and who will press me hard on what my probability for the proposition that the theory entails the evidence is supposed to be and on what I take the relevant space of alternatives to be. There is one error-statistician in the group who thinks the whole Bayesian frame is the wrong tool and evidence is a matter of how severe a test a theory has survived; she will want to know whether my account can tell genuine support from post hoc accommodation, or whether the words *without having been bent to fit it* are doing all the real work. There is a historian of science who works on mid-century earth science and who will object that my *before* state is a historian's fiction, that in the cases I care about the evidence was assembled in the same breath as the theory, and that nobody in the field had any determinate prior about the striping at all. And there will be four or five graduate students, one of whom reliably asks the simple question that the rest of us have been circling.

  So: give me the seven or eight objections I should actually expect, ordered by how likely they are and how much damage they would do, each phrased the way that person would phrase it rather than the way I have phrased it — I have the mathematics for Bayes' theorem but not the jargon — each with a two-minute reply I could give standing up, a note on where that reply is soft, and a note on what I should simply concede at the outset and what I should refuse to give up. Tell me separately whether I should drop the ridge-anomaly example for something safer and what it would cost me if I do. And include, at the end, the one question I am privately hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A preparation sheet:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired marine geophysicist (expert in magnetic anomalies, Reykjanes Ridge), auditing a philosophy of science reading group. Intelligent, experienced in science, but self-taught in philosophy ("own vocabulary," "without much knowledge of how the professionals argue").
      *   **Task:** Create a Q&A preparation sheet for a presentation on the "Problem of Old Evidence."
      *   **User's Position:**
          *   Distinguishes *static* support (evaluated against a prior belief state *before* evidence arrived) vs. *dynamic* updating (updating on the *derivation/entailment* being new, not the evidence itself).
          *   Calls this the "retrospective prior manoeuvre."
          *   Acknowledges potential tension between the two answers.
      *   **Audience:**
          *   Senior Philosopher (Confirmation measures, priors/arbitrariness).
          *   Formal Epistemologist (Credences, updating, logical omniscience).
          *   Error-Statistician (Severe testing, accommodation vs. prediction).
          *   Historian of Science (Mid-century earth science, historical accuracy of "prior" states).
          *   Graduate Students (One asks the "simple" killer question).
      *   **Deliverables:**
          *   7-8 Objections (ordered by likelihood/damage).
          *   Phrased in the specific persona's voice.
          *   2-minute reply for each.
          *   Note on where the reply is soft.
          *   Note on what to concede vs. refuse.
          *   Advice on the magnetic anomaly example (keep or drop?).
          *   The "one question I am privately hoping nobody asks."

  2.  **Deconstruct the User's Position (Philosophical Analysis):**
      *   *Core Claim:* Old evidence confirms because we evaluate support counterfactually (what would I have thought *before*?) OR we update on the logical connection ($P(T \vdash E)$), not $E$ itself.
      *   *Weakness 1 (The Prior):* How do you reconstruct the "before" state? It's subjective/arbitrary. (Senior Philosopher's attack).
      *   *Weakness 2 (Logical Omniscience):* Standard Bayesianism assumes agents know all logical consequences. If you know $T$, you know $T \vdash E$. Updating on the derivation violates standard Bayesian norms. (Formal Epistemologist's attack).
      *   *Weakness 3 (Accommodation):* How do you distinguish "bending to fit" from genuine entailment without just asserting it? (Error-Statistician's attack).
      *   *Weakness 4 (History):* Did scientists actually have priors? Or is this rational reconstruction? (Historian's attack).
      *   *Weakness 5 (Tension):* Do the static and dynamic accounts yield the same numbers? If not, which is "confirmation"? (Internal consistency).

  3.  **Drafting the Objections (Iterative Process):**

      *   *Objection 1 (Senior Philosopher):* Focus on the arbitrariness of the "retrospective prior."
          *   *Voice:* Polite but piercing, focused on measures of confirmation.
          *   *Core:* "You've just moved the subjectivity from the prior to the time-slice."
      *   *Objection 2 (Formal Epistemologist):* Focus on logical omniscience and what is being updated.
          *   *Voice:* Technical, focused on probability spaces.
          *   *Core:* "If you're logically omniscient, you already know $T \vdash E$. If you aren't, you're using a non-standard logic."
      *   *Objection 3 (Error-Statistician):* Focus on severity and accommodation.
          *   *Voice:* Skeptical of Bayesianism, focused on methodology.
          *   *Core:* "Saying 'it wasn't bent' isn't a test. Where's the severity?"
      *   *Objection 4 (Historian):* Focus on the specific case study (Vine-Matthews-Morley).
          *   *Voice:* Empirical, contextual.
          *   *Core:* "The data and theory co-evolved. There was no clean 'before'."
      *   *Objection 5 (Grad Student - The Simple Question):* Focus on the tension between static and dynamic.
          *   *Voice:* Naive but sharp.
          *   *Core:* "Which one is it? Do I update my belief or not?"
      *   *Objection 6 (Senior Philosopher - Follow-up):* The "tacking" problem.
          *   *Voice:* Technical.
          *   *Core:* "Any theory can entail old evidence if you add clauses."
      *   *Objection 7 (Formal Epistemologist - Follow-up):* The probability of the entailment.
          *   *Voice:* Mathematical.
          *   *Core:* "What is $P(T \vdash E)$? Is it 1 or less than 1?"
      *   *Objection 8 (General Group):* Why not just use Likelihoods?
          *   *Voice:* Pragmatic.
          *   *Core:* "Why not just compare $P(E|T)$ vs $P(E|\neg T)$?"

      *Refining the List:* I need to make sure these sound like the specific people described. I'll consolidate to the strongest 7-8.

  4.  **Drafting the Replies:**
      *   Need to be concise (2 minutes spoken).
      *   Need to acknowledge the user's specific "retrospective prior" and "update on derivation" distinction.
      *   Need to identify the "soft spot" (where the user is vulnerable) and the "hard line" (what they must defend).

  5.  **Addressing the Example (Magnetic Anomalies):**
      *   *Pros:* User's expertise, authentic passion.
      *   *Cons:* Chronology is messy (Vine & Matthews 1963, Morley 1963, data existed but wasn't "stripes" yet).
      *   *Verdict:* Keep it, but qualify the history. Dropping it loses the user's authority.

  6.  **The "Forbidden Question":**
      *   What is the deepest philosophical worry the user might be glossing over?
      *   Likely: "If the update is on the derivation, isn't that just psychological surprise, not logical confirmation?" Or "Does this solve the problem or just describe the psychology of discovery?"
      *   Better: "If the static and dynamic accounts diverge, have you solved the problem of old evidence or just defined two different concepts?"

  7.  **Review and Refine:**
      *   Check tone: Respectful of the user's scientific background, acknowledging their "outsider" status in philosophy but validating their intuition.
      *   Check constraints: 7-8 objections, ordered, specific personas, 2-min replies, soft spots, concessions.
      *   Check the "Old Evidence" literature (Garber, Jeffrey, etc.) implicitly to ensure the objections are standard and potent. The user's solution is very close to Garber's (updating on $T \vdash E$), so the objections should mirror the standard critiques of Garber.

  8.  **Final Polish:**
      *   Ensure the "Historian" objection specifically targets the Vine-Matthews-Morley chronology as requested.
      *   Ensure the "Error-Statistician" hits the "bending" claim.
      *   Make sure the "Grad Student" question cuts to the core tension the user admitted to.

  *(Self-Correction during drafting)*: I initially thought about suggesting they drop the example. But the prompt says "I would rather talk about [the ridge]... I am hazier... about the chronology." If I tell them to drop it, they lose their unique selling point. Better to advise them on how to frame the history accurately enough to survive the Historian. The Vine-Matthews-Morley story is actually *perfect* for old evidence because the magnetic data existed (from WWII and early 50s) but wasn't interpreted as stripes until 1963. I need to make sure the user knows this distinction.

  *(Refining the "Forbidden Question")*: The user admits the static and dynamic answers might not agree. The killer question is: "If they don't agree, which one determines rational belief?"

