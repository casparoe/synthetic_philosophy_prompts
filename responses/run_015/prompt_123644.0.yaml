      *   *Variety vs. Species:* "Variety" implies descent (modification from a parent type). "Species" implies independent origin. Darwin is flipping the script. He wants to show varieties *become* species. By noting "variety" implies descent (even if unproven), he sets the stage for his theory: if varieties are just incipient species, then the "distinct act of creation" is unnecessary. The asymmetry highlights the theoretical burden: Species = Static/Created; Variety = Dynamic/Descended.

