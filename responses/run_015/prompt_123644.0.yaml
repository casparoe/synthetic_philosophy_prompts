      *(Self-Correction during drafting)*: I need to be careful with the "variety" part. Darwin says community of descent is *implied* for variety but rarely proved. For species, the "act of creation" is the *unknown element* included. I need to make sure I don't reverse that. Darwin is saying: You call it a species because you think it was created separately. You call it a variety because you think it descended from something else. He wants to show species *are* varieties.
      *Refinement on "Creation":* Is it a criticism? Yes, but a gentle one. He's saying "You can't define it because you're assuming something (creation) that didn't happen."
