      *   *Nuance:* This doesn't mean it *is* inconsistent. It just means it can't *certify* itself from the inside.
      *   *Workaround:* Hierarchy of systems. $S_1$ checks $S_2$. $S_0$ checks $S_1$. This is how actual verification works (e.g., verified compilers).

