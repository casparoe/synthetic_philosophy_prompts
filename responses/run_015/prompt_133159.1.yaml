  The fluorescent hum of the Ministry's audit wing was the only sound left in the building. Elara rubbed her eyes, the glow of the terminal casting deep shadows across the stack of case files marked *Priority Weighting: Pilot Phase 4*. Across from her, Vance leaned against the doorframe, loosening his tie.

  "You're still on the Gamma verification?" Vance asked. "Just sign off, Elara. The model holds. That's why we switched from Raw Egalitarianism to the Priority View. We needed immunity."

  "We have immunity," Elara said, not looking up. "Everyone knows the argument. If you drag the wealthy down to the level of the poor without raising the poor, total well-being drops. Since the priority function is strictly increasing, the sum falls. The system correctly identifies the change as bad. No one celebrates equality for its own sake."

  "Exactly," Vance said. "It's the selling point. We care about the worse off, but not so much that we'd burn food to make the feast look even. So why are you holding up the certification?"

  Elara slid a single printed ledger slip across the metal desk. "Case 744. Subject is a single citizen. Lifespan standardized to two measurable periods for the pilot. Period A well-being is 10. Period B is 30."

  Vance glanced at the slip. "Total lifetime well-being is 40. Standard."

  "The Smoothing Protocol intervened," Elara said. "It redistributed utility from Period B to Period A. No new resources entered the system. There was a friction loss in the transfer. Period A is now 19. Period B is 19."

  Vance frowned. "Total lifetime well-being is 38. The subject is worse off overall. Two units of happiness vanished into administrative friction. No one else benefited. This should flag as a negative outcome. The Priority Score should drop."

  Elara tapped the bottom line of the slip. "Look at the weighted sum. We're weighting person-years, Vance. Not whole lives."

  Vance picked up the slip. His eyes moved over the columns. *Unit: Year-Segment. Function: Square Root.*

  "Original Score," Elara recited. "Square root of 10 is 3.16. Square root of 30 is 5.47. Sum is 8.63."

  "And the smoothed version?" Vance's voice was tighter now.

  "Square root of 19 is 4.35. Multiplied by two periods... 8.70."

  The silence stretched. The hum of the lights seemed to grow louder.

  "The score went up," Vance said quietly.

  "The score went up," Elara confirmed. "Total well-being fell from 40 to 38. The subject is objectively worse off over the course of their life. Yet the Ministry's official measure says the outcome is better. We have generated a levelling-down objection inside a single life. The system recommends destroying value to achieve smoothness because the concavity of the function rewards the lower years more than it penalizes the loss of the total."

  Vance tossed the slip back onto the desk. "Then the unit is wrong. We fix the unit. We weight whole lives, not person-years. You sum the well-being of the life first, *then* apply the priority weight. If the total drops from 40 to 38, the weighted score drops. Problem solved."

  Elara opened a folder marked *Demographic Variance*. "If we weight whole lives, how do we compare a citizen who dies at forty to one who lives to ninety? If the long life has a moderate average, and the short life has a high average, weighting the total lump sum penalizes longevity. We chose person-years specifically to normalize lifespan differences. If we switch to whole lives, the system implicitly says a short, happy life is preferable to a long, moderately happy one, regardless of the total content. We lose the ability to compare across lifespans."

  "So we challenge the sum," Vance said, pacing now. "We say a life's good isn't the sum of its years. Maybe the distribution matters intrinsically. Maybe smoothness is a good in itself."

  "Is it?" Elara asked. "Are we really prepared to tell the Oversight Committee that destroying two units of happiness is a gain because the graph looks flatter? That's the egalitarian objection we were supposed to have escaped. We just moved it from between persons to within persons."

  Vance stopped pacing. He looked at the clock on the wall. 3:00 AM. The deadline for the Pilot Phase report was 8:00 AM. If the certification wasn't signed, the entire distribution algorithm for the upcoming fiscal year froze. Millions of allocations would default to static averages, ignoring priority entirely.

  "If you flag this," Vance said, "they halt the program. They revert to the old model. The old model doesn't weight priority at all. The worst-off years get the same weight as the best-off years. You know what that costs in human terms."

  "I know what this costs in logical terms," Elara said. "If we certify this, we endorse a measure that calls destruction 'improvement' based on a technicality of units. We're lying about the math."

  "We're optimizing for the spirit of the view," Vance countered, leaning over the desk. "The spirit is concern for the low points. The math is just the tool. Sometimes the tool vibrates. You don't throw away the engine because the gauge flickers."

  "The gauge isn't flickering. It's reading exactly what we told it to read. We told it to care more about the 10 than the 30. It cared so much it was willing to burn the 30 to lift the 10, even if the fire consumed some of the lift. That's not a glitch. That's the function."

  Elara picked up the stylus. The certification box blinked on the screen, waiting for her biometric signature. She looked at the ledger slip again. *8.63 vs 8.70.* The numbers were small, clean, and damning. If she signed, the system would proceed, and thousands of lives would be smoothed according to a metric that could declare them worse off while marking them better. If she refused, the system would crash, and the priority weighting—the only mechanism giving extra moral weight to suffering—would vanish for another decade.

  Vance watched her hand. "Elara. The freeze hurts the bottom quintile most. You know that. The static averages don't care about the 10s. They only care about the 40s."

  Elara hovered the stylus over the glass. She thought about the subject in Case 744, whoever they were. They had lost two units of happiness so the Ministry's score could rise. They were the sacrifice to the concavity of the curve.

  "If I sign," Elara said, her voice flat, "I admit that the unit of moral concern is the year, not the person."

  "If you don't," Vance said, "you admit that we don't know how to count."

  The cursor pulsed. The hum of the lights drifted in and out of focus. Elara lowered the stylus.
