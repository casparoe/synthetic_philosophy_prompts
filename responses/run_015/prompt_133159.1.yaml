  1.  **The Medical Triage:** Doctors allocating ventilators based on quality-adjusted life years. *Weakness:* The urgency of life-and-death medical decisions tends to overshadow the subtle metric puzzle, turning it into a scarcity drama rather than a philosophical audit.
  2.  **The Colonial Resource Board:** Distributing water between short-lived and long-lived settlements on different planets. *Weakness:* Risks becoming a story about resource scarcity or inter-group conflict rather than focusing tightly on the unit of analysis (years vs. lives).
  3.  **The Bureau of Life-Weights:** Auditors checking a "Smoothing" policy where citizens trade happiness between decades via chemical regulation. *Weakness:* Might seem too fantastical or sci-fi, distancing the reader from the bureaucratic realism needed for the argument to land.
  4.  **The Pension & Welfare Audit (Selected):** A bureaucrat reviewing a pilot program that redistributes utility within a single citizen's timeline to test the weighting function. *Why:* It isolates the variable (unit of analysis) without external noise, allowing the math to be the antagonist within a mundane, high-stakes administrative setting.

