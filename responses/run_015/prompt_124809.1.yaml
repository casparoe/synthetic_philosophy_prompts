      *   **Constraints:** No bibliography, no specific page numbers, clean formatting, acknowledge the "Potsdam" spelling note (implicitly, by spelling it correctly in the output but not making a fuss).
      *   **Tone:** Professional, academic, collaborative but adversarial (showing where they diverge sharply).
