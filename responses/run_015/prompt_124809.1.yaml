          *   *Correction based on prompt:* "Whether blame requires counterfactual agency." Orthodox says Yes, Stalin chose this. Structuralist says No, structures chose this.
          *   *Prediction:* Orthodox: Conflict softens/delays without Stalin (Agency matters). Structuralist: Conflict hardens anyway (Structure matters).
      *   *Crux 2: Defensive Intent vs. Disproportionate Action (Berlin).*
          *   Orthodox: Blockade was aggressive coercion, Airlift was defensive humanitarian. Blame on USSR.
          *   Structuralist: Blockade was desperate defensive reaction to currency reform/Airlift. Blame is shared/mutual escalation.
      *   *Crux 3: "Who Started It" (Malformed vs. Real).*
          *   Orthodox: Not malformed. Someone lit the fuse. Assigning responsibility is necessary for moral clarity.
