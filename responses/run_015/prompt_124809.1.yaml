  **JOINT STATEMENT ON HISTORIOGRAPHICAL RESPONSIBILITY AND THE ORIGINS OF THE COLD WAR**

  **Signatories:** The Agency-Focused Working Group (Orthodox) & The Structural-Interactionist Working Group (Post-Revisionist)
  **Date:** October 26, 2023
  **Subject:** Methodological Standards for Assigning Geopolitical Blame

  ### I. AGREED EMPIRICAL BASELINE

  We, the undersigned, acknowledge that while our interpretations of causality differ, we share a common factual foundation regarding the collapse of the Grand Alliance. We agree to the following claims as the minimum necessary baseline for any further debate on responsibility:

  1.  **Chronological Consensus:** We accept the following sequence as the critical window for the breakdown of cooperative security:
      *   **Yalta (February 1945):** Ambiguities regarding the "Declaration on Liberated Europe" allowed both sides to claim the other was violating agreements on Polish sovereignty.
      *   **Potsdam (July 1945):** Disagreements over German reparations and the administration of occupied zones hardened immediately following the successful US atomic test.
      *   **Truman Doctrine (March 1947):** The US formally committed to global containment, framing local conflicts in Greece and Turkey as binary ideological struggles.
      *   **Marshall Plan (June 1947):** The offer of US economic aid was extended to the Soviet sphere but structured in ways Moscow deemed incompatible with its sovereignty, leading to Soviet rejection and the consolidation of Eastern Bloc autarky.
  2.  **The Core Puzzle:** We agree that the central historical problem to be explained is not merely *that* the alliance collapsed, but *why* cooperative security mechanisms transitioned so rapidly into rigid, militarized blocs despite the absence of direct conventional warfare between the principals.
  3.  **Evidence Standards:** We agree that distinguishing *intent* from *structural pressure* requires triangulation between:
      *   Private diplomatic cables (assessing internal threat perception).
      *   Public rhetoric (assessing signaling and domestic mobilization).
      *   Resource allocation records (assessing whether military/economic movements matched defensive or offensive postures).
  4.  **Limitation of Archives:** We acknowledge that no single archive (Washington, Moscow, or London) provides a complete picture of decision-making loops, and that "blame" is a historiographical construct, not an archival fact.

  ### II. DIVERGENT INTERPRETATIONS OF RESPONSIBILITY

  While we agree on the sequence of events, we diverge on the attribution of causality and moral responsibility. The table below outlines our respective positions in wording both camps find acceptable.

  | Feature of Analysis | Agency-Focused Position (Orthodox) | Structural-Interactionist Position (Post-Revisionist) |
  | :--- | :--- | :--- |
  | **Soviet Expansionism** | Soviet moves in Eastern Europe were driven by ideological commitment to world revolution and specific leadership choices by Stalin, making the expansion blameworthy even if framed as defensive. | Soviet moves were driven by a legitimate security vacuum and historical trauma; expansion was a reactive buffer strategy, making "blame" inappropriate for standard security seeking. |
  | **US Economic Architecture** | US policy was a deliberate strategy of containment designed to encircle the USSR, using economic leverage as a geopolitical weapon. | US policy was driven by unavoidable capitalist logic (need for open markets) rather than a deliberate encirclement strategy; therefore, blame does not stick to Washington in the same way. |
  | **Nature of the Conflict** | A moral struggle between aggression and defense, where one side initiated the coercion. | A security dilemma spiral where defensive actions by one side were perceived as offensive by the other, creating a self-fulfilling prophecy. |
  | **Assignment of Blame** | Blame is assignable to specific actors who possessed the agency to choose cooperation but chose confrontation. | Blame is distributive across systems; focusing on individual actors obscures the structural inevitabilities that constrained all choices. |

  ### III. PHILOSOPHICAL CRUXES AND PREDICTIONS

  To move beyond semantic debates, we have identified three specific cruxes where our theories yield different predictions. We record these predictions here to allow future archival revelations or methodological shifts to test our claims.

  #### Crux 1: Counterfactual Agency
  **Question:** Does blame require counterfactual agency? Specifically, if Stalin had died in 1946, does the conflict still harden?
  **Shared Evidence:** Both sides agree that the succession mechanics of the CPSU and the US mid-term elections of 1946 are the relevant archival patterns to examine.

  *   **Agency-Focused Prediction:** **Conflict Softens/Delays.** Without Stalin's specific paranoia and personal consolidation of power, the Soviet apparatus would have lacked the singular drive to violate Yalta terms so aggressively. The conflict would have remained a diplomatic friction rather than a militarized standoff.
  *   **Structural-Interactionist Prediction:** **Conflict Hardens Anyway.** The clash was determined by the bipolar power vacuum and the incompatibility of a closed Soviet economy with an open US economic order. A different Soviet leader would have faced the same structural pressures and reacted similarly.

  #### Crux 2: Defensive Intent vs. Disproportionate Action
  **Question:** Do defensive intentions mitigate blame when actions are disproportionate? We use the Berlin Blockade (1948) and Airlift as the concrete case.
  **Shared Evidence:** Both sides agree that the minutes of the Soviet Military Administration in Germany and the US National Security Council records regarding currency reform are the relevant archival patterns.

  *   **Agency-Focused Prediction:** **Blame Remains.** Intent is irrelevant when the action (starving a civilian population to force political concession) is disproportionate to the threat. The Blockade was an offensive coercive tool, rendering Soviet defensive claims moot.
  *   **Structural-Interactionist Prediction:** **Blame Mitigated.** The Blockade was a desperate, proportional reaction to the unilateral Western introduction of the Deutsche Mark, which threatened to destabilize the Soviet zone. In a security dilemma, defensive panic often looks like aggression; blame must be shared for the escalation ladder.

  #### Crux 3: The Validity of "Who Started It"
  **Question:** Is the question "Who started the Cold War?" malformed because historiographic blame should be distributive, or is that a verbal dodge to avoid assigning responsibility?
  **Shared Evidence:** Both sides agree that the drafting history of the Truman Doctrine speech and the Soviet "Two Camps" doctrine are the relevant archival patterns.

  *   **Agency-Focused Prediction:** **Question is Valid.** Asking "who started it" is necessary for moral clarity. Calling it a "systemic spiral" is a verbal dodge that absolves actors who made specific choices to escalate rather than de-escalate.
  *   **Structural-Interactionist Prediction:** **Question is Malformed.** "Starting" implies a linear timeline in an interactive system. Assigning singular responsibility ignores the feedback loops of action-reaction. It is a category error to apply criminal law concepts (blame) to geopolitical system collisions.

  ***

  **Signed,**

  *The Agency-Focused Working Group*
  *The Structural-Interactionist Working Group*
