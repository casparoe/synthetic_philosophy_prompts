  3. The three bins are handled inconsistently because defaults function as friction for opt-outs, meaning the classification often depends on linguistic framing rather than moral substance. This reveals the taxonomy is underdetermined on whether the moral objection lies in the mechanism used or the magnitude of the behavioural shift produced.
  4. The sharpest tension lies between the publicity proviso and the reliance on cognitive bias, which squeezes out a view of autonomy requiring actual conscious endorsement rather than mere theoretical access to alternatives. This excludes a substantive view of agency where freedom requires non-domination by hidden manipulative forces, regardless of whether options remain technically open.
  5. Adopting the view that autonomy requires actual conscious endorsement would require abolishing steering and defaults that rely on inattention and subjecting all interventions to trials requiring explicit consent. Consequently, the guidance would shift from maintaining a public register to requiring democratic authorisation of specific behavioural goals before any architecture is designed.
