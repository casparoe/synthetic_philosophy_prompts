answer: |-
  The stall is structural, not merely rhetorical. Both camps agree on the artifact (hagiography) and the goal (moral virtue), but they are modeling the *mechanism of moral psychology* differently. They are not disagreeing about Plutarch; they are disagreeing about how human beings update their behavioral policies.

  **The Structural Conflict**
  The Mirror Camp treats virtue as a **techne** (skill). In skill acquisition, hiding errors is pedagogically malpractice. If you want me to play the violin like Heifetz, showing me only the flawless performance helps less than showing me how you corrected your bowing error. Their claim is that moral learning is *procedural*. Therefore, "causal transparency" is a necessary condition for imitation. Without the mundane causal steps, the imitative link breaks because the learner cannot bridge the gap between their current state and the hero's state.

  The Ladder Camp treats virtue as a **telos** (end/goal). In navigation, you do not need to know the engine mechanics of the lighthouse; you need the beam to be visible through the fog. Their claim is that moral learning is *orientational*. The "messy middle" is noise that degrades the signal. "Emotional calibration" requires opacity because complexity dilutes the inspirational force. They are not offering a DIY manual; they are offering a vector.

  **Why It Stalls**
  The debate is deadlocked because both sides are making hidden empirical claims about human psychology under the umbrella term "moral learning."
  1.  **Mirror Empirical Claim:** Humans change behavior primarily through error-correction and procedural mimicry.
  2.  **Ladder Empirical Claim:** Humans change behavior primarily through aspirational alignment and signal amplification.

  Because neither side has definitive psychological data to prove which mechanism dominates moral development, they retreat to intuition. The Mirror side intuitions that "realism" builds trust; the Ladder side intuitions that "idealism" builds desire. They are talking past each other because one is answering "How do I execute?" while the other is answering "Where do I aim?" They conflate *initiation* (getting someone to care) with *acquisition* (getting someone to succeed).

  **The Path Forward**
  Your intuition about "causal transparency" vs. "emotional calibration" is the key. This is not a verbal mix-up; it is a substantive disagreement about moral psychology that can only be resolved by distinguishing *phases* of learning. Progress requires admitting that hagiography might function as a Ladder for the novice (orientation) but fails as a Mirror for the practitioner (execution). The debate remains stalled because both sides insist their mechanism is the *whole* of moral learning, rather than a component.

