  2. On the scoreboard of action worth, moral value is determined solely by outcomes, meaning the actions of the causally disconnected donor and the overdetermined donor are equally valuable despite the differing causal roles of their reasons. This is a defensible substantive claim supporting the first use, asserting the warm-glow donor's action has no less moral worth than the effective altruist's.

  3. On the scoreboard of agent praiseworthiness, moral credit requires the right reason to be causally effective, so the causally disconnected donor deserves no credit while the overdetermined donor deserves partial credit for the overlapping motivation. This is a defensible substantive claim supporting neither use, as it contradicts the claim that the ineffective donor is beyond criticism and the warm-glow donor is equal.

  4. On the scoreboard of semantic clarity, the disagreement is verbal because "moral worth" ambiguously references both outcome quality and character virtue, so tabooing it shows we agree on outcomes but disagree on whether the causally disconnected donor or the overdetermined donor is virtuous. This is a defensible substantive claim supporting both uses by diagnosing the confusion, revealing that what survives is a choice between praising consequences or character when handing out moral credit.

  5. On the scoreboard of action worth, consequences are morally inert and only the quality of the will matters, so the causally disconnected donor and the overdetermined donor are fully virtuous regardless of lives saved or causal efficacy. This is false regarding the first use but supports the second use, claiming the ineffective donor is perfectly blameless and the warm-glow donor is morally equal to the pure altruist.
