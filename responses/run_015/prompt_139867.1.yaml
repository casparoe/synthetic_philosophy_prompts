answer: |-
  This is a sharp observation, and one that rightly troubles the standard taxonomy. You are correct that the literature overwhelmingly fixates on selection pressures, often treating drift as a mere null hypothesis without exploring its specific epistemic implications. Your hunch—that drift might be less damaging because it lacks the systematic distorting bias of kin favouritism—is provocative. However, I find myself diverging from your ranking, though I share your sense that the drift scenario is under-theorised.

  Here are my credences, followed by the decomposition you requested.

  ### The Credences

  **$P(\text{Moral Knowledge} | \text{Selection}) = 0.25$**
  **$P(\text{Moral Knowledge} | \text{Drift}) = 0.10$**

  I am more optimistic than you regarding selection, and significantly more pessimistic regarding drift. My reasoning is that whilst selection introduces the risk of systematic bias (as you note), it also opens the door to 'third-factor' explanations (à la Enoch or Wielenberg). If there is a constitutive link between survival and goodness, selection can be truth-tracking. Drift, by definition, severs the causal chain entirely. In a drift scenario, the alignment between belief and truth is purely coincidental, and given the vastness of normative space, the prior probability of a random walk landing on the truth is vanishingly small. Selection at least provides a mechanism that *could* correlate with truth; drift provides a mechanism that *cannot*.

  ### Decomposition of Credence

  To arrive at these figures, I weigh four key factors. Note that these are not additive probabilities but rather levers that adjust the baseline.

  **1. Availability of Third-Factor Explanations (Weight: High)**
  This is the engine of my credence in the selection scenario. If one can argue that the properties that made our ancestors fit (e.g., cooperation, care for offspring) are *also* morally good independently of their fitness value, the debunking argument loses its sting.
  *   *Impact:* In the selection scenario, this factor contributes roughly +0.15 to the credence. In the drift scenario, it contributes nothing, as there is no selective pressure to correlate with the third factor. This is the primary driver of the gap between my two numbers.

  **2. Analogy to Perceptual or Mathematical Belief (Weight: Medium)**
  Realists often argue that if we debunk moral beliefs, we must also debunk perceptual or logical beliefs, as they too have evolutionary genealogies.
  *   *Impact:* This contributes +0.05. If the analogy holds, the EDA proves too much and must be rejected (via *reductio*). However, I weight this lower because the causal link in perception (objects cause beliefs) is tighter than in morality (facts do not cause beliefs). In the drift scenario, the analogy weakens further, as perceptual systems are clearly selected for accuracy, whereas drift implies moral beliefs were not.

  **3. Generalisation to Epistemic and Logical Beliefs (Weight: Medium-High)**
  This is the 'self-defeat' objection. If the EDA undermines the very reasoning used to construct the argument, it collapses.
  *   *Impact:* This contributes +0.05 to both scenarios. It is a background constraint. However, it is less sensitive to the drift/selection distinction. Whether our logic was selected or drifted, if we cannot trust it, the argument fails. I treat this as a floor beneath which the credence cannot fall without scepticism becoming total.

  **4. Theory of Justification (Reliabilism vs. Internalism) (Weight: Low-Medium)**
  If justification requires reliable formation (externalism), EDAs are devastating. If it requires only internal coherence (internalism), EDAs matter less.
  *   *Impact:* This contributes +0.05 to the selection scenario (assuming third-factor reliability) and +0.00 to drift (drift is inherently unreliable). I weight this lower because even internalists must explain why coherence tracks truth at all, which drift makes difficult.

  ### Sensitivity and Revision

  **Most Sensitive Term:**
  My numbers are most sensitive to the **availability of third-factor explanations**. If one concedes that fitness and moral truth are orthogonal (as Sharon Street argues), my credence in the selection scenario collapses from 0.25 to roughly 0.10, bringing it in line with the drift scenario. The entire advantage I grant to selection rests on the plausibility of a non-accidental correlation between the good and the fit.

  **First Revision:**
  If forced to revise, I would adjust the **Third-Factor** term first. It is the most philosophically contentious premise. It requires a robust metaethical account of why mind-independent moral facts would align with evolutionary pressures without collapsing into naturalism. If that alignment is deemed miraculous, the selection advantage evaporates.

  ### The Single Moving Argument

  The finding that would move me most is **empirical evidence of negative selection pressure on truth-tracking moral beliefs**.
  Suppose anthropological or psychological research demonstrated that communities holding *false* moral beliefs (e.g., rigid caste hierarchies or aggressive out-group hostility) consistently out-competed communities holding *true* moral beliefs (e.g., egalitarianism or universal compassion) in the ancestral environment. This would suggest that selection was not merely orthogonal to truth, but actively hostile to it. This would drive my selection credence down below my drift credence, vindicating your hunch that selection is the more damaging genealogy.

  ### Where My Reasoning is Likely Broken

  I suspect my reasoning is most vulnerable in my **modelling of normative space**.
  I have assumed that the 'target' of moral truth is small enough that a random walk (drift) is unlikely to hit it, whilst a guided walk (selection) might. But what if moral truth is not a specific coordinate but a broad constraint? If there are many acceptable moral equilibria (a 'many-to-one' mapping), then drift might land on *a* truth even if not *the* truth. Conversely, if moral truth is highly complex and specific, even selection might not find it. I am likely underestimating the size of the target for drift and overestimating the precision of selection. If the 'truth' is simply 'some form of social cohesion', drift might achieve that as easily as selection, in which case my gap between 0.10 and 0.25 is unjustified.

  In sum, whilst I find your intuition about the 'bias' of selection compelling, I remain convinced that a mechanism capable of tracking (selection) is epistemically superior to a mechanism incapable of tracking (drift), provided one can defend the correlation. But it is a narrow defence, and one that drift renders impossible.
