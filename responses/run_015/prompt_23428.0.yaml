  I'm a PhD student in the philosophy of medicine, and I'm writing a chapter of my dissertation on the naturalism–normativism debate in the concept of disease. A central objection to the naturalistic, biostatistical approach is the reference-class problem: the choice of reference class (the population relative to which an individual's functional abilities are compared) is underdetermined, and shifting that class can change the verdict of whether a given physiological state is diseased. A particularly worrying instance is the "lowering of functioning" case, in which a pathology that was once rare becomes common enough to shift the statistical norm, so that what was previously classified as a disease is reclassified as normal.

  I want to assess the main conceptions of disease on the dimension of how well they resist this reference-class problem. Please rank the following five conceptions, from most resistant to least resistant:

  1. Boorse's biostatistical theory, which defines health as statistically normal functional ability within a reference class of organisms of the same species, age, and sex.
  2. A hybrid biostatistical account that fixes the reference class by appeal to a normative standard of functional design, rather than to observed population statistics.
  3. Norman Daniels's "normal functioning" account, on which a genuine health need is one that is necessary to restore normal functioning.
  4. A normativist account that treats disease as a value-laden, non-natural concept whose application depends on substantive normative judgments.
  5. Engel's conceptual-ecological approach, on which disease is a multi-level, value-laden concept to be understood in its ecological and social context.

  Please give your answer as a JSON block of the following form, where the ordering of the list runs from most resistant to least resistant:

  ```json
  {
    "ranking": [
      "<label>",
      "<label>",
      "<label>",
      "<label>",
      "<label>"
    ]
  }
  ```

  Use exactly these five labels: "Boorse's biostatistical theory", "hybrid biostatistical account", "Daniels's normal-functioning account", "normativist account", "Engel's conceptual-ecological approach".
