      *   **Case Studies:** Confederate Monument Debates (US) vs. Masada Narrative (Jewish/Israeli).
      *   **Key Questions:**
          *   Which explains resistance to factual correction better?
          *   Does PS explain present jurisdictional claims (statutes, heritage access) better than MC?
