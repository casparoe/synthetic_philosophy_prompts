      *   *Explanatory Weight:* PS is a sharper tool for *political-legal* conflicts (Confederacy). MC is a broader tool for *cultural-mythic* conflicts (Masada). For the specific question of "why defenders resist factual correction regarding jurisdiction/authority," PS carries more weight for the Confederacy. For "why defenders resist factual correction regarding moral meaning," MC carries more weight for Masada.

