      *   *Resistance to Fact:* Archaeological/historical corrections (e.g., the suicide narrative might be exaggerated, the Zealots were violent extremists) are resisted because they damage the *moral* lesson, not a legal claim.
      *   *Fit:* Masada fits MC almost perfectly. PS seems like a stretch. There are no "Masada Heritage Protection Statutes" based on Zealot sovereignty.

