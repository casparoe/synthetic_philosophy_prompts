      *   *PS View:* The Confederacy is treated as a legitimate, albeit defeated, sovereign entity. "Heritage protection laws" often mimic sovereign immunity or property rights. The argument isn't just "we love this," it's "you don't have the *authority* to touch this." The "Suspended Authority" idea manifests in the legalistic defense of monuments as if they are treaties or protected graves of a foreign power.
      *   *Resistance to Fact:* Why resist the fact that it was about slavery? Because admitting that collapses the *legitimacy* of the phantom state. If the cause was immoral/illegal, the sovereignty is void. MC explains the emotional resistance; PS explains the *legalistic* resistance (e.g., citing specific statutes, claiming procedural overreach).

