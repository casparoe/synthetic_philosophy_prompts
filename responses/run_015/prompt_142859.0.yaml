      *   *Jurisdictional Claims:* PS wins hands down for the Confederacy (heritage laws, property claims). MC cannot explain why specific *laws* are passed to protect statues; it only explains why people *want* them. PS explains the mechanism of the claim (quasi-sovereign right).
      *   *Overreach:* PS overreaches on Masada. Applying "sovereignty" to a suicide cult that ceased to exist 2,000 years ago with no modern legal successor claiming their specific *statehood* is analytically weak.
