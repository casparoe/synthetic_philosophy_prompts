  2.  **Analyze the Frameworks:**
      *   **Mnemonic Community (MC):** Focuses on memory, identity, solidarity, and moral meaning. Defeat is tragic but unifying. It explains *why* people care, but not necessarily *how* they claim authority. It's about "who we are."
      *   **Phantom Sovereignty (PS):** Focuses on law, jurisdiction, and continuity. It implies the state *never truly died* legally, just went dormant. It explains *why* people claim specific rights (property, monuments, land). It's about "what we own/control."

