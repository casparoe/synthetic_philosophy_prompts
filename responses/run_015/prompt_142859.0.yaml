  hey, compare the "phantom sovereignty" framework — treating a lost-cause myth as if the defeated state still holds suspended legal authority in some counterfactual timeline — with the usual "mnemonic community" view where defeat just becomes moral credental and group glue. apply both specifically to the confederacy monument debates and the masada narrative: which one actually explains why defenders resist factual correction about the defeat? does phantom sovereignty do real work explaining present jurisdictional claims, like monument-protection statutes or exclusive heritage access, that mnemonic solidarity can't cover? and where does it clearly overreach? also, do the two cases split — maybe masada fits one lens and the confederacy the other? i want an actual adjudication of which framework carries more explanatory weight, not just a list of parallels.
reasoning: |-
  Here's a thinking process that leads to the comparison and adjudication of the two frameworks:

  1.  **Deconstruct the Prompt:**
