  Based on her track record, two rules compete for dominance here:

  1.  **The Continuous-Propagation Jeffrey Rule:** When evidence provides calibrated probabilities over a discrete partition that correlates with a *continuous* hypothesis space, apply Jeffrey conditioning to the partition and reweight the continuous distribution via the law of total probability.
      *   *Support:* Cases (iii) and (v). In both, discrete uncertainty (year, land-use) drives updates on continuous priors (rhetoric over time, soil carbon over coordinates). Case (i) supports the basic partition mechanism.
  2.  **The Nuisance-Mediated Bayesian Rule:** When evidence is generated by a process subject to systematic bias or noise (drift, scan ambiguity), reject direct conditioning on the hypothesis partition. Instead, condition on intermediate variables (symptoms) or treat the output as likelihoods for standard Bayesian updating.
      *   *Support:* Cases (ii) and (iv). In (ii), she rejected Jeffrey conditioning on diseases due to scan noise, conditioning on the symptom instead. In (iv), she converted probabilistic testimony into likelihood ratios for standard conditioning.

  **Distinguishing Further Case**
  To distinguish these rules, present Dr. S. with a case involving **observed drift**:
  *   *Scenario:* A calibrated thermometer gives a probability distribution over temperature ranges, but a separate gauge *explicitly measures* a "sensor drift" value that is known to invalidate the calibration if non-zero.
