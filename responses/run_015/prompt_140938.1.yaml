answer: |-
  ### I. The Logical Space

  To map the terrain without using theoretical labels, we rely on three load-bearing distinctions. These questions determine the structure of the decision tree.

  1.  **The Source of Uncertainty:** Is the uncertainty about *non-moral facts* (e.g., will this medicine work?) or *moral principles* (e.g., does this being have rights?)?
      *   *Work done:* This is the primary branch. If the uncertainty is purely factual, standard decision tools apply. If it is moral, we enter the space of metanormative uncertainty.
  2.  **The Aggregation Question:** When you hold multiple moral views with some confidence in each, do you *select* the single most probable view to follow, or do you *combine* input from all views you hold?
      *   *Work done:* This does the most work. It separates "My Favorite Theory" approaches from "Moral Hedging" approaches.
  3.  **The Currency of Comparison:** When combining views, are you comparing *amounts of value* (how much good is done) or *risks of wrongness* (how bad is it to violate a constraint)?
      *   *Work done:* This separates consequentialist-style aggregation (summing good) from deontological-style aggregation (avoiding vetoed actions).

  ***

  ### II. The Leaves (Positions)

  These are the twelve terminal positions generated by the space above. Each includes the "awkward commitment" that tends to arise when the view is pressed.

  1.  **My Favorite Theory:** Act on the single moral view you find most likely to be true.
      *   *Awkward commitment:* You must ignore a 49% chance that you are committing a grave atrocity if your favorite view says it's fine.
  2.  **Expectationalism:** Choose the option that yields the highest average score across all your moral views, weighted by your confidence.
      *   *Awkward commitment:* A view you barely believe can force you to act strangely if it claims the stakes are astronomically high.
  3.  **Maximin:** Choose the option that avoids the worst possible moral outcome, regardless of how unlikely that outcome is.
      *   *Awkward commitment:* You must sacrifice enormous certain good to avoid a tiny risk of a theoretical violation.
  4.  **Proportionalism:** Divide your resources or effort in proportion to the confidence you have in each competing view.
      *   *Awkward commitment:* You are required to do some amount of what you believe is morally wrong, just to satisfy the view that thinks it is right.
  5.  **Subjective Obligation:** Act in the way that ensures you are not blameworthy, even if the outcome is worse.
      *   *Awkward commitment:* You might be required to act in a way that you know, objectively, produces less good and more harm.
  6.  **The Spurious Problem:** Deny that moral uncertainty requires a special decision rule; just pick one and act.
      *   *Awkward commitment:* You treat deep moral confusion as identical to not knowing what you want for dinner.
  7.  **Deontic Veto:** If any view you take seriously says an act is forbidden, you cannot do it, even if all other views say it is best.
      *   *Awkward commitment:* A minority view can hold the majority hostage, paralyzing action entirely.
  8.  **Borda Count:** Rank your moral views by plausibility and give points based on their ranking rather than your confidence level.
      *   *Awkward commitment:* A slight shift in how you rank views can flip your decision even if your actual confidence hasn't changed.
  9.  **Group Democratic:** When deciding for a group, allocate budget by the headcount of members holding each view, not by your assessment of who is right.
      *   *Awkward commitment:* You must fund projects you believe are harmful because enough other people believe they are good.
  10. **Option Value:** Choose the path that keeps the most future options open in case your moral views change later.
      *   *Awkward commitment:* You may be required to delay doing obvious good now to preserve the ability to do good later.
  11. **Satisficing:** Choose any option that is "good enough" according to every view you hold, rather than the best one.
      *   *Awkward commitment:* You are forbidden from making the world significantly better if doing so requires exceeding a threshold on one view.
  12. **Expert Deference:** Ignore your own confidence and act according to the consensus of moral experts.
      *   *Awkward commitment:* You must act against your own conscience if you believe the experts are wrong but cannot prove it.

  ***

  ### III. The Diagnostic Instrument (The Tree)

  *Instructions: Follow the path that matches your verdict on each case. Do not worry about where the path leads.*

  **Node 1: The Source (Fact vs. Value)**
  *Case:* You are a doctor. You have a drug that cures a disease but has side effects.
  *Scenario A:* You aren't sure if the patient has the disease (fact).
  *Scenario B:* You aren't sure if curing the disease is more important than respecting the patient's autonomy (value).
  *Question:* In Scenario B, does your uncertainty feel fundamentally different than in Scenario A?
  *   **Yes (It's different):** Go to Node 2.
  *   **No (It's all just uncertainty):** Go to Leaf 6 (The Spurious Problem).

  **Node 2: The Aggregation (Single vs. Combined)**
  *Case (Scaling):* You are 50% confident in View X and 50% confident in View Y.
  *View X says:* Donate $1,000 to Charity A (Goodness score: +10).
  *View Y says:* Donate $1,000 to Charity B (Goodness score: +10).
  *Option C:* Donate $500 to A and $500 to B.
  *Question:* Is Option C strictly worse than picking one charity entirely?
  *   **Yes (Pick one):** Go to Node 3.
  *   **No (Splitting is better/sensible):** Go to Node 4.

  **Node 3: The Single View (Constraint vs. Outcome)**
  *Case (Deontic):* You are 80% sure View X is right. View X says lying is sometimes okay to save money. You are 20% sure View Y is right. View Y says lying is strictly forbidden, always.
  *Situation:* Lying saves you $1,000. No one else is hurt.
  *Question:* Is lying forbidden here?
  *   **Yes (Forbidden):** Go to Leaf 7 (Deontic Veto).
  *   **No (Permissible):** Go to Leaf 1 (My Favorite Theory).
      *   *Note:* If you said permissible because you want to avoid blame rather than maximize good, score as Leaf 5 (Subjective Obligation).

  **Node 4: The Combination Method (Risk vs. Sum)**
  *Case (Tiny-Credence):* You are 99% sure View X is right (eating meat is fine). You are 1% sure View Y is right (eating meat is murder).
  *Situation:* You can eat a burger. View Y says if it is murder, it is an *astronomically* bad act (worse than a million murders).
  *Question:* Does the 1% risk force you to not eat the burger?
  *   **Yes (Avoid the risk):** Go to Leaf 3 (Maximin).
  *   **No (Balance the odds):** Go to Node 5.

  **Node 5: The Scaling of Value (Comparison)**
  *Case (Scaling Revisited):* View X says Option A is slightly better than B. View Y says Option B is *vastly* better than A. You are equally confident in both.
  *Question:* Do you choose B because the difference in value is larger, or do you stick to a 50/50 split because your confidence is equal?
  *   **Choose B (Magnitude matters):** Go to Leaf 2 (Expectationalism).
  *   **Stick to Split (Confidence matters):** Go to Leaf 4 (Proportionalism).

  **Node 6: The Scope (Self vs. Group)**
  *Case (Shared Budget):* You manage a budget for a community. Half the community believes Project P is holy; half believes Project P is sinful. You personally think P is holy.
  *Question:* Do you fund P with all the money, or split the funding?
  *   **Split the funding:** Go to Leaf 9 (Group Democratic).
  *   **Fund P entirely:** Return to Node 2 (Treat as individual uncertainty).

  **Node 7: The Time Horizon (Flexibility)**
  *Case (Option Preservation):* You can donate now to a cause you currently support, or invest the money to donate later when you might understand the ethics better. The cause is urgent but not dying out immediately.
  *Question:* Is it morally better to wait and keep your options open?
  *   **Yes (Wait):** Go to Leaf 10 (Option Value).
  *   **No (Act now):** Return to Node 5.

  **Node 8: The Ranking (Points vs. Confidence)**
  *Case:* You have three views. You are 40% sure of View 1, 35% sure of View 2, 25% sure of View 3.
  *Situation:* View 1 and 2 agree on Option A. View 3 prefers Option B.
  *Question:* Do you follow the majority confidence (A), or do you give View 3 extra weight because it is a distinct "voice"?
  *   **Follow confidence:** Return to Node 5.
  *   **Give distinct weight:** Go to Leaf 8 (Borda Count).

  **Node 9: The Threshold (Good Enough)**
  *Case:* Option A is the best possible outcome according to your main view, but View 2 says it is merely "acceptable." Option B is "acceptable" to everyone but best for no one.
  *Question:* Are you required to pick B to ensure everyone is satisfied?
  *   **Yes:** Go to Leaf 11 (Satisficing).
  *   **No:** Return to Node 5.

  **Node 10: The Authority (Self vs. Expert)**
  *Case:* You are 60% sure View X is right. All leading ethicists say View Y is right.
  *Question:* Do you follow your 60% or the experts?
  *   **Follow experts:** Go to Leaf 12 (Expert Deference).
  *   **Follow self:** Return to Node 2.

  ***

  ### IV. Four Shorter Things

  **1. Empty Combinations**
  *   **Aggregative but Non-Comparative:** A view that says "combine all moral views" but also "you cannot compare the size of values between views."
      *   *Status:* **Incoherent.** You cannot aggregate without a common currency or scaling mechanism.
  *   **Fact-Risk-Averse but Value-Risk-Neutral:** A view that says "avoid tiny risks of factual disaster (e.g., plane crash)" but "ignore tiny risks of moral disaster (e.g., murder)."
      *   *Status:* **Unattractive/Unexplored.** Most agents treat moral risk as at least as weighty as factual risk.

  **2. Indistinguishable Leaves**
  *   **Leaf 1 (My Favorite Theory) and Leaf 5 (Subjective Obligation).**
      *   *Problem:* On almost all concrete cases, acting on your favorite theory *is* what counts as avoiding blameworthiness.
      *   *Separation:* You would need a case where the "favorite theory" demands a sacrifice that is supererogatory (beyond duty). Leaf 1 would demand the sacrifice; Leaf 5 would not. Add a case: *"Your favorite view says you must give 50% of your income to charity; your second favorite says 0% is fine. Are you blameworthy for keeping the money?"*

  **3. Pattern Scoring**
  *   **Leaf 2 (Expectationalism)** requires a pattern across **Node 4 (Tiny-Credence)** and **Node 5 (Scaling)**.
      *   *Scoring:* A reader cannot be sorted here by a single path. They must answer "No" to the Tiny-Credence risk (willing to gamble on low probability) AND "Choose B" on Scaling (willing to weigh magnitude). If they answer "No" to risk but "Split" on scaling, they are inconsistent.
      *   *Instruction:* Mark these readers as "Inconsistent Aggregators" and direct them to read the section on intertheoretic comparison.

  **4. Mis-Sorting Risks**
  *   **The "It Depends" Reader:** At Node 5 (Scaling), a reader may say "It depends on how large the vast difference is."
      *   *Recommendation:* Add a **"You are not sorted by this tree"** leaf. This reader recognizes that magnitude matters *sometimes* but not *always*, suggesting a threshold view not captured by pure Expectationalism.
  *   **The Prudential Hedger:** A reader may choose to split funds (Node 2) not because of moral uncertainty, but to avoid social conflict or personal regret.
      *   *Recommendation:* Add a disclaimer at Node 2: *"Answer based on what morality requires, not what makes you feel safer."* If they still answer for safety, drop the distinction at this level and classify them as Leaf 4 (Proportionalism) with a note that their motivation is prudential, not moral.
