  # The Absent-Minded Driver: A Diagnostic Tree

  **Instructions:** Begin at the **Root**. Follow the path that matches your intuition about the scenario. Answer the four diagnostic questions as they appear. If a question becomes irrelevant based on a prior commitment, follow the instruction to skip to the relevant conclusion. At the end of your path, you will find the philosophical position your answers commit you to, along with its most awkward consequence.

  ---

  ### **ROOT: The Status of the Journey**
  **Did the driver act intentionally during the absent-minded stretch?**
  *   **YES:** The driver was genuinely acting, despite the lack of conscious attention. → *Go to Question 1.*
  *   **NO:** The driver was merely behaving; the action only began when they "woke up" at the driveway. → *Go to Question 3.*

  ---

  ### **Question 1: The Consciousness Requirement**
  *(For those who answered YES at the Root)*
  **Must practical knowledge of the route be occurrent—actively present to consciousness—to guide intentional action?**
  *   **YES:** **UNOCCUPIED (Incoherence).**
      *   *Diagnosis:* This combination is logically unstable. If you believe intention requires conscious knowledge, you cannot consistently claim the absent-minded driver was acting intentionally, given the scenario specifies they had no occurrent awareness. You should have answered NO at the Root.
  *   **NO:** Knowledge can guide action without being consciously present. → *Go to Question 2.*

  ---

  ### **Question 2: The Mechanism of Guidance**
  *(For those who answered NO at Question 1)*
  **Can sub-personal navigational mechanisms substitute for personal-level knowledge without breaking the chain of intentionality?**
  *   **YES:** Your brain's automatic systems carried out your intention without your personal involvement. → *Go to Question 4.*
  *   **NO:** The knowledge must remain at the personal level, even if unconscious. → *Go to Question 4.*

  ---

  ### **Question 3: The Intermediate Category**
  *(For those who answered NO at the Root)*
  **Is there a coherent intermediate category—call it "directed but not fully intentional"—between deliberate action and mere reflex?**
  *   **YES:** The behaviour was goal-directed habit, distinct from both full intention and blind reflex. → *Go to Question 4.*
  *   **NO:** Behaviour is either fully intentional action or mere mechanical reflex; there is no middle ground. → *Go to Question 4.*

  ---

  ### **Question 4: The Status of Knowledge**
  *(For all remaining paths)*
  **Does the driver retain a genuine dispositional knowledge of the route that counts as knowledge proper, or is any attribution of knowledge here merely post hoc and explanatory?**
  *   **YES:** The driver genuinely knew the route, even if they were not thinking about it. → *See Leaves A, B, or C.*
  *   **NO:** Attributing "knowledge" is just a metaphor for successful causal conditioning. → *See Leaf D or E.*

  ---

  ### **THE LEAVES: Your Position**

  #### **Leaf A: Naturalised Agency**
  *(Path: Root YES → Q1 NO → Q2 YES → Q4 YES)*
  **Position:** Naturalised Action Theory.
  **Awkward Commitment:** Your conscious sense of steering is merely a post-hoc story told by a brain that drove itself.

  #### **Leaf B: Dispositional Intentionalism**
  *(Path: Root YES → Q1 NO → Q2 NO → Q4 YES)*
  **Position:** Anti-Intellectualist Intentionalism.
  **Awkward Commitment:** You possessed a conscious knowledge of the route that was somehow active without ever entering your awareness.

  #### **Leaf C: Habitualism**
  *(Path: Root NO → Q3 YES → Q4 YES)*
  **Position:** Aristotelian Habitualism.
  **Awkward Commitment:** You are responsible for arriving home, but not for the turns that got you there.

  #### **Leaf D: Hard Mechanism**
  *(Path: Root NO → Q3 NO → Q4 NO)*
  **Position:** Eliminative Materialism.
  **Awkward Commitment:** You are no more the author of your commute than a river is the author of its course.

  #### **Leaf E: UNOCCUPIED (Incoherence)**
  *(Path: Root NO → Q3 YES → Q4 NO)*
  **Diagnosis:** This gap is due to **incoherence**. It is difficult to maintain that behaviour is "directed" towards a goal (the intermediate category) while simultaneously denying the agent possesses any genuine knowledge (dispositional or otherwise) of how to reach that goal.

  #### **Leaf F: UNOCCUPIED (Unattractiveness)**
  *(Path: Root YES → Q1 NO → Q2 YES → Q4 NO)*
  **Diagnosis:** This gap is due to **unattractiveness**. This view claims sub-personal mechanisms executed your intention, yet denies those mechanisms contained any knowledge of the route, rendering the success of the journey a miraculous accident.

  ---

  ### **Flagged Ambiguities**

  This instrument cannot cleanly separate **Naturalised Agency (Leaf A)** from **Dispositional Intentionalism (Leaf B)** for readers who are unsure what counts as "personal-level" knowledge. If you believe the brain's automatic processes *are* part of the personal self, the distinction between sub-personal substitution and unconscious personal knowledge collapses. To resolve this, you would need a further distinction regarding **personal identity**: specifically, whether your "self" extends to include neural processes that are inaccessible to introspection.

  Additionally, the tree does not distinguish between **Habitualism (Leaf C)** and views that treat habit as a *type* of intention. If you believe habits are simply automated intentions rather than a separate intermediate category, you should have answered YES at the Root. This distinction rests on whether you define "intention" by its *origin* (a prior decision) or its *structure* (goal-directedness).
