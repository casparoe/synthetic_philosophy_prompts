answer: |-
  I bend my back to shape the stubborn thing,
  And fear dissolves within the working hand,
  For in the clay I find a lasting form.

  I eat the fruit and crush the stubborn thing,
  I require nothing but my own hand,
  I need no clay to validate my form.

  The object stands apart like solid stone,
  I do not consume it; I let it wait,
  And through this delay I build my mind.

  I break the wall and scatter every stone,
  I take my pleasure, I will never wait,
  My will is pure; I do not need your mind.

  My labor flows into the silent craft,
  The work remains and forces time to stay,
  In what I made, I find myself quite free.

  I own the tool and I command the craft,
  Nothing persists unless I bid it stay,
  I am the whole; the servant is not free.
