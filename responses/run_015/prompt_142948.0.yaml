answer: |-
  # Take-Home Final: Formal Epistemology
  **Topic:** Diachronic Constraints and Self-Locating Belief
  **Time Allowed:** 2 Hours
  **Word Limit:** 1,000 words maximum

  **Question 1**
  Consider the following protocol. A fair coin is tossed. If Heads, the agent is woken once ($H_1$). If Tails, she is woken three times ($T_1, T_2, T_3$). An amnesia drug ensures she cannot distinguish awakenings or remember previous ones. At each awakening, she knows the protocol but not the coin outcome or the day. After the experiment concludes, she is told the coin outcome. One day later, a second drug erases her memory of that announcement, though she retains the memory that the experiment occurred.

  Let $P_0$ be her credence before the toss; $P_1$ during an awakening; $P_2$ after being told the result; and $P_3$ after the memory of the result is erased.

  (a) State van Fraassen's Reflection Principle formally. Prove that it follows from the assumption that the agent is certain her later evidence will be a cell of a partition refining her current evidence, and that she will update by conditionalization.
  (b) Calculate $P(H)$ at stages $P_0$ through $P_3$. Evaluate whether Reflection holds for the transitions $P_0 \to P_1$, $P_1 \to P_2$, and $P_2 \to P_3$. In doing so, distinguish between the full principle and the 'no-drift' (expectation) requirement, noting where they collapse.
  (c) Reflection fails in at least one transition. Diagnose the failure. What proviso is required to save the principle? Is this restriction principled, or does it render the principle vacuous in cases of self-locating uncertainty?

  ***

  # Model Answer

  **Reflection and Diachronic Coherence**

  Van Fraassen's Reflection Principle requires that an agent's current credence in $A$, conditional on her later credence in $A$ being $x$, must equal $x$. Formally: $P_t(A \mid P_{t'}(A) = x) = x$, provided $P_t(P_{t'}(A) = x) > 0$. This constraint is not primitive; it derives from standard Bayesian updating. If an agent is certain her later total evidence will be drawn from a partition $\{E_i\}$ refining her current evidence, and she will update by conditionalizing on the true cell, then $P_{t'}(A) = P_t(A \mid E_i)$. By the law of total probability, $P_t(A) = \sum P_t(A \mid E_i)P_t(E_i)$. Since $P_t(A \mid P_{t'}(A)=x)$ sums over exactly those cells where the conditional probability is $x$, the current conditional credence must match the later value. Thus, pure learning guarantees Reflection.

  A corollary arises when the agent is certain her later credence will be a specific value $x$. Here, the 'no-drift' requirement ($P_t(A) = E[P_{t'}(A)]$) collapses into the full principle. Because the variance is zero, the expectation is the certain value. An appeal to averaging fails here; one cannot average over possibilities one deems impossible. If I am certain I will believe $x$ tomorrow, I must believe $x$ today, lest I judge my future self as irrational without new evidence.

  Applying this to the case:
  1.  **$P_0$ (Start):** By the Principal Principle, $P_0(H) = 1/2$.
  2.  **$P_1$ (Awake):** Two views compete. The "frequency" rule weights outcomes by awakenings (1 Heads, 3 Tails), yielding $P_1(H) = 1/4$. Plain conditionalization on the tautological centred evidence ("I am awake") yields $P_1(H) = 1/2$. Reflection rules out the $1/4$ view. The agent is certain that at $P_2$ she will conditionalize on the result. If $P_1(H)=1/4$, but she knows $P_2(H)$ will be 0 or 1 with expected value $1/2$, her credence drifts without evidence. To satisfy Reflection (and the martingale property of conditional expectation), $P_1(H)$ must be $1/2$.
  3.  **$P_2$ (Told):** She learns the result. $P_2(H)$ is 1 (if Heads) or 0 (if Tails).
  4.  **$P_3$ (Forgotten):** She knows the experiment is over but forgets the result. Her epistemic state returns to the prior regarding the coin: $P_3(H) = 1/2$.

  Reflection holds for $P_0 \to P_1$ (on the $1/2$ view) and $P_1 \to P_2$ (standard learning). It fails dramatically for $P_2 \to P_3$. If the coin was Heads, $P_2(H)=1$. She is certain that at $P_3$, $P_3(H)=1/2$. Reflection requires $P_2(H \mid P_3(H)=1/2) = 1/2$, but $P_2(H)=1$.

  The failure at $P_2 \to P_3$ is due to forgetting (loss of evidence). The failure of the $1/4$ view at $P_1$ is due to treating self-locating information as ordinary evidence. To rescue Reflection, we must add a proviso: the principle applies only when the agent suffers no loss of information or rationality. The dilemma is whether self-locating uncertainty counts as "loss." In $P_2 \to P_3$, the later self is straightforwardly worse informed. In $P_0 \to P_1$, the agent gains centred information but loses temporal location. If we classify this as information loss, Reflection becomes vacuous for self-locating beliefs. If we do not, we must reject the $1/4$ view as incoherent. A principled restriction distinguishes forgetting (loss of propositional knowledge) from centred uncertainty (gain of indexical knowledge within a fixed propositional frame), preserving Reflection's bite in the latter while exempting the former.

  ***

  # Marking Scheme (25 Marks Total)

  **1. Formal Statement and Domain Restriction (5 Marks)**
  *   **Required Move:** State $P_t(A \mid P_{t'}(A)=x) = x$ and explicitly mention the restriction that $P_t(P_{t'}(A)=x) > 0$.
  *   **Full Credit:** Correct formula + positive probability proviso.
  *   **Typical Error:** Stating the principle as an unconditional expectation ($P_t(A) = E[P_{t'}(A)]$) without the conditional form, or omitting the positive probability constraint.

  **2. Proof via Partition Refinement (5 Marks)**
  *   **Required Move:** Demonstrate that if later evidence is a partition cell refining current evidence and updating is by conditionalization, Reflection follows via the law of total probability.
  *   **Full Credit:** Explicit link between conditionalization on partition cells and the Reflection equation.
  *   **Typical Error:** Asserting Reflection is true because "conditionalization is rational" without showing the mathematical derivation (the union-of-cells argument).

  **3. Certainty Corollary and No-Drift (5 Marks)**
  *   **Required Move:** Explain that if the later credence is certain, the expectation version collapses to the identity version ($P_t(A)=x$), and averaging is inappropriate.
  *   **Full Credit:** Clear distinction between the general expectation case and the specific certainty case, noting why averaging fails when variance is zero.
  *   **Typical Error:** Treating the 'no-drift' expectation constraint as distinct from the full principle even in cases of certainty, or failing to explain why the collapse occurs.

  **4. Computation and Reflection's Verdict (5 Marks)**
  *   **Required Move:** Calculate $P_1(H)$ as $1/2$ (not $1/4$) on the grounds that the $1/4$ view violates Reflection/No-Drift given the certainty of future updating to 0 or 1.
  *   **Full Credit:** Correct values ($1/2, 1/2, 0/1, 1/2$) and explicit rejection of the $1/4$ weighting rule based on diachronic coherence.
  *   **Typical Error:** Calculating $P_1(H)=1/4$ using the awakening-counting rule and claiming Reflection is neutral, or failing to check the $P_1 \to P_2$ transition.

  **5. Proviso Dilemma Diagnosis (5 Marks)**
  *   **Required Move:** Identify forgetting ($P_2 \to P_3$) as the clear violation and discuss whether the restriction to "no loss of information" is principled or ad hoc regarding self-locating belief.
  *   **Full Credit:** Identifies forgetting as the breakdown point; evaluates the principled nature of the proviso (neutrality on which horn is chosen).
  *   **Typical Error:** Claiming Reflection holds universally (ignoring forgetting) or dismissing the principle entirely without analyzing the specific proviso required to save it.

  ***

  # Grading Distinctions

  **A Answer (21–25 Marks):**
  Executes all five moves with technical precision. The proof in part (a) is mathematically clear. The distinction between the expectation version and the certainty version of Reflection is sharp. The diagnosis in part (c) acknowledges the tension between forgetting and self-location without collapsing them, offering a nuanced view on the proviso.

  **B Answer (15–20 Marks):**
  States the principle and calculates credences correctly but struggles with the derivation. May conflate the expectation version with the conditional version. The diagnosis of the proviso is present but treats the restriction as obvious rather than analyzing the "ad hoc" worry.

  **Failing Answer (<15 Marks):**
  Recites the definition of Reflection but cannot apply it to the transitions. Calculates $P_1(H)=1/4$ without addressing the Reflection violation. Fails to identify the forgetting transition as the point of breakdown or offers no proviso to rescue the principle.
