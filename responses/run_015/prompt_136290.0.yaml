  **BASELINE WELLNESS™ USER AGREEMENT (v. 9.2)**

  **1. Acceptance of Statistical Normality.**
  By subscribing, User acknowledges that "Health" is not an absolute biological state but a dynamic moving average. Baseline Wellness™ defines "Standard Function" as the median performance of users within your specific demographic cohort. User agrees that this Baseline is a statistical fiction designed for actuarial stability rather than biological truth. If your personal optimum exceeds the cohort mean, you agree to suppress excess capacity to maintain eligibility for coverage. Persistent uniqueness may be flagged as a system error.

  **2. Therapeutic Essentialism.**
  The Company retains sole discretion to categorize interventions as either "Restorative" (returning to prior loss) or "Augmentative" (exceeding prior capacity). User agrees that feeling better is only valid if it returns you to pre-decline metrics. Any restoration that inadvertently boosts performance beyond original capacity will be reclassified as Unauthorized Enhancement. User is liable for any competitive advantage gained through successful therapy, including but not limited to increased productivity, improved mood stability, or enhanced cognitive recall.

  **3. Baseline Relativism.**
  User acknowledges that "Normal" is contextual and geographic. A User in a high-stress urban zone may have a higher Baseline for anxiety than a rural counterpart. Baseline Wellness™ reserves the right to adjust your mental health targets based on regional suffering averages. You agree to be as healthy as your neighbors, but no healthier. User waives the right to contest geographic recalibrations intended to normalize their health status against local decline.

  **4. Liability for Supra-Baseline States.**
  Baseline Wellness™ is not responsible for social alienation resulting from exceptional recovery. If treatment renders you significantly more productive, attractive, or stable than your peers, any resulting friction is User's responsibility. We guarantee a return to average, not excellence. User agrees that becoming "too well" constitutes a deviation from the Service Agreement and may incur surcharge fees.

  **5. Data Rights on Deviation.**
  Data generated while operating within the Baseline belongs to User. Data generated while exceeding the Baseline belongs to Baseline Wellness™ as proprietary research into outlier mechanics. User waives rights to monetize their own exceptional health. Any biological improvements discovered during service are the intellectual property of the Company, not the Host Body.

  **6. Right to be Average.**
  User grants Baseline Wellness™ the right to intervene if User metrics drift too far above the Standard Function. Wellness is defined as continuous management, not cure. Service may be terminated if User becomes too healthy to require maintenance. User understands that the goal of the Platform is alignment, not optimization.

  **7. Arbitration of Reality.**
  Disputes regarding what constitutes "Real Pain" versus "Perceived Inefficiency" will be settled by algorithmic review. User agrees to accept the algorithm's definition of their own bodily experience. In the event of a conflict between User sensation and Metric Data, Metric Data shall prevail.

  **8. General Provisions.**
  This Agreement is subject to change without notice as the Baseline shifts. User agrees to remain flexible in their definition of self.
