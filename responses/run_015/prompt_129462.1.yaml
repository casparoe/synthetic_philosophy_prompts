answer: |-
  Here is the specification you requested. It is designed to force a theory of supererogation to do work in the real world, not just in the abstract.

  ### I. The Desiderata for an Adequate Theory of Supererogation

  An adequate theory must satisfy the following constraints. Each is motivated by a specific failure mode illustrated by your cases.

  **A. Deontic Constraints (The Status of the Act)**

  1.  **The Optionality Constraint:** The theory must classify the act as morally optional. Omission must not constitute a moral violation.
      *   *Motivation:* **The Ratchet.** If repetition converts the optional into the expected, the theory must explain whether the deontic status changes *ex post* or whether the resentment is misplaced. A theory that makes duty dynamic based on habit risks eliminating supererogation entirely; a theory that makes it static risks ignoring legitimate expectations.
      *   *Requirement:* Specify whether deontic status is time-indexed or act-type fixed.

  2.  **The Role-Relativity Constraint:** The theory must index duty to the agent's specific role, office, or voluntary commitments, not merely to general humanity.
      *   *Motivation:* **Role Relativity (Lifeguard vs. Swimmer)** and **Honesty in Corrupt Office.** The inspector's honesty is duty, not supererogation, because of the office. The lifeguard's rescue is duty; the swimmer's is supererogatory.
      *   *Requirement:* Define the mechanism of role-acquisition. Crucially, specify whether a role can acquire *new* duties simply via institutional reliance (the **Nurse Case**). If reliance alone creates duty, supererogation shrinks; if reliance never creates duty, institutions can exploit.

  3.  **The Forbearance Constraint:** The theory must accommodate omissions as supererogatory, not just commissions.
      *   *Motivation:* **Supererogation by Forbearance.** Releasing a debt is an omission of a right. A theory requiring "positive effort" excludes this.
      *   *Requirement:* Explain why foregoing a claim can be "beyond duty" when keeping it is permissible.

  4.  **The Collective Coherence Constraint:** The theory must resolve conflicts between individual permissibility and collective necessity.
      *   *Motivation:* **The Linked-Hands Rescue.** If each may permissibly opt out, but the child drowns if all do, the theory must explain the aggregation.
      *   *Requirement:* State whether supererogatory status survives when the act is part of a necessary collective set where individual contribution is negligible.

  **B. Evaluative Constraints (The Status of the Agent)**

  5.  **The Praise/Blame Asymmetry:** The theory must justify why performing the act invites praise (or honour) while omitting it does not invite blame.
      *   *Motivation:* **The Uncostly Hero.** If the doctor finds the work exhilarating, is she praiseworthy? If sacrifice is constitutive, she isn't. If exceeding demand is sufficient, she is.
      *   *Requirement:* Determine if sacrifice is a *condition* for praise or merely *evidence* of exceeding demand.

  6.  **The Subjective/Objective Alignment:** The theory must specify whether supererogatory status depends on the facts or the agent's beliefs.
      *   *Motivation:* **The Mistaken-Duty Hero.** The soldier believes he is ordered. Objectively, it's supererogatory; subjectively, it's duty.
      *   *Requirement:* Decide if supererogation is a property of the *act* (objective) or the *deliberation* (subjective).

  7.  **The Risk/Rashness Boundary:** The theory must distinguish between praiseworthy risk and blameworthy recklessness when the outcome fails.
      *   *Motivation:* **The Failed Rescue.** The man drowns with the child.
      *   *Requirement:* Provide a criterion for when risk ceases to be heroic and becomes irrational, such that the attempt is not praiseworthy even if the intention was good.

  **C. Structural & Political Constraints (The Systemic Context)**

  8.  **The Non-Exploitation Constraint:** The theory must not allow the categorization of an act as supererogatory to function as a subsidy for institutional failure.
      *   *Motivation:* **The Nurse Case.** If the hospital budget depends on the unpaid labour, calling it supererogatory masks a structural duty.
      *   *Requirement:* The theory must distinguish between *honouring* an agent and *relying* on them. It must provide a verdict on when institutional reliance voids optionality.

  9.  **The Second-Order Norm Constraint:** The theory must govern not only the act but the advice, design, and attitudes surrounding it.
      *   *Motivation:* **The Advisor.** If I may omit the rescue, may I advise you to? May I design a rota assuming you will?
      *   *Requirement:* Specify the permissions for third parties. A theory that allows me to *do* X but not *advise* X (or vice versa) must explain the divergence.

  10. **The Preservation/Shrinkage Criterion:** The theory must indicate whether the category of supererogation is morally valuable to preserve or a site of injustice to be shrunk.
      *   *Motivation:* **Political Argument.** Some argue we should expand duty (shrink supererogation) to ensure needs are met; others argue we must preserve a sphere of freedom.
      *   *Requirement:* The theory must take a stance on whether supererogation is a "moral luxury" or a "moral safety valve."

  ---

  ### II. The Three Critical Questions

  **1. Adequacy Conditions vs. Camp Prejudices**
  You suspected two demands were partisan. You are correct.
  *   **"Action-Guiding from the Agent's Point of View":** This is a **prejudice** (specifically, a deliberative/consequentialist one). Supererogation is often a retrospective evaluative category, not a prospective decision procedure. Requiring it to guide action collapses the distinction between "what I should do" and "what is good to do." A theory can be adequate if it explains why we praise the act *after* the fact, even if it doesn't feature in the agent's calculus *during* the act.
  *   **"Supererogation is Never a Licence to Do Less Than the Best":** This is a **prejudice** (specifically, a maximizing one). If a theory holds that agents are never required to do the best, then supererogation *is* the licence to do less than the best. Insisting otherwise begs the question against the very existence of the category. An adequate theory must allow that one can be morally in the clear while not doing the optimal thing.

  **2. Joint Unsatisfiability (The Trade-Offs)**
  There is a hard tension between **The Optionality Constraint** and **The Non-Exploitation Constraint**.
  *   *The Conflict:* If the hospital *needs* the nurse to function safely (Non-Exploitation), logic suggests the work is required. If the work is required, it is not optional (violating Optionality). If we maintain it is optional to preserve the category, we allow the hospital to exploit the nurse (violating Non-Exploitation).
  *   *The Result:* No theory can satisfy both perfectly without qualification. You must choose: either supererogation is fragile (it vanishes when institutions rely on it), or it is robust (it persists even when relied upon, requiring a separate political critique of the institution).
  *   *Time-Indexing:* There is also tension between **The Optionality Constraint** and **The Ratchet**. If an act is optional at $t_1$, can it become duty at $t_{10}$ via repetition? If yes, optionality is unstable. If no, the theory ignores social reality.

  **3. The Knockout Requirement**
  The single requirement that knocks out the most candidates is **The Non-Exploitation Constraint (Desideratum 8)**.
  *   *Why:* Most traditional theories (Simple Beyond-Duty, Maximizing with Prerogative) treat supererogation as a relation between an agent and a moral law. They are atomistic. They do not have the resources to analyze *institutional reliance*. They will classify the nurse's work as supererogatory because it exceeds her contract, failing to see that the *moral* duty has shifted due to the *structural* necessity. A theory that cannot distinguish between "generosity" and "subsidy" is useless for your third downstream job (political argument).

  ---

  ### III. Required Distinctions

  An adequate theory must explicitly map these boundaries:

  1.  **Beyond Duty vs. Merely Permissible:**
      *   *Distinction:* Choosing vanilla over chocolate is permissible but not supererogatory.
      *   *Cost of Collapsing:* If collapsed, all optional acts become praiseworthy, inflating moral currency until it is worthless. The theory must identify the *value* or *cost* threshold that separates the neutral from the good.
  2.  **Supererogatory vs. Costly-But-Required:**
      *   *Distinction:* Paying a high tax is costly but required.
      *   *Cost of Collapsing:* If collapsed, we lose the ability to complain about undue burden. We need to know when cost *excuses* omission (making it supererogatory to bear it) vs. when cost is irrelevant to duty.
  3.  **Supererogatory vs. Saintly:**
      *   *Distinction:* Supererogation is accessible to the decent agent; sainthood implies a character transformation or total self-abnegation.
      *   *Cost of Collapsing:* If collapsed, supererogation becomes too demanding for ordinary moral life, turning the category into an aspirational ideal rather than a practical classification.
  4.  **Supererogatory vs. Suberogatory:**
      *   *Distinction:* Acts that are permissible to do but blameworthy to do (e.g., claiming a legal but unethical loophole).
      *   *Cost of Collapsing:* If collapsed, we lose the asymmetry of praise/blame. We need to account for the "jerks" who do what is allowed but morally small, distinct from the "heroes" who do what is allowed but morally great.

  ---

  ### IV. Scorecard (Condensed)

  *   **Simple Beyond-Duty:** (Act is good, not required).
      *   *Fail:* Fails **Non-Exploitation**. Classifies the nurse's work as supererogatory regardless of hospital reliance. Fails **Role Relativity** without ad-hoc adjustments.
  *   **Maximizing + Agent-Centred Prerogative:** (You may opt out of the best to pursue your own interests).
      *   *Fail:* Fails **The Advisor**. If I have a prerogative to opt out, can I advise you to? Often implies indifference to outcomes that **Linked-Hands** shows is problematic. Struggles with **Uncostly Hero** (if no sacrifice, was it a prerogative used?).
  *   **Practice-Excellence:** (Supererogation is excellence relative to internal standards of a practice).
      *   *Fail:* Fails **Political Argument**. It reinforces the status quo of the "practice." If the practice is corrupt (Nurse case), excellence within it is not morally praiseworthy. Good on **Role Relativity**, bad on **Non-Exploitation**.
  *   **Contractualist:** (What could reasonably be demanded of anyone).
      *   *Pass:* Best on **Non-Exploitation** and **Role Relativity**. It asks if it is *reasonable* to expect the nurse to work unpaid.
      *   *Fail:* Struggles with **Uncostly Hero**. If the doctor enjoys it, it was "reasonably demandable," potentially stripping the act of supererogatory status. Struggles with **Mistaken-Duty** (objective vs. subjective reasonableness).

  **Verdict:** The Contractualist reading is the only one that takes the **Non-Exploitation Constraint** seriously enough for your purposes, but it requires modification to handle the **Uncostly Hero** without collapsing supererogation into duty.
