      *   *Refinement:* Instead of just listing "Must explain X," I should phrase them as constraints the theory must satisfy, citing the specific case that motivates the constraint.
      *   *Key Insight:* The user's nurse case highlights the difference between *moral optionality* and *structural necessity*. A theory of supererogation must not be a tool for bad institutions. This is the "Non-Exploitation Constraint."
