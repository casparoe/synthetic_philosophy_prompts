      *   *Background:* Distinguish "Condition" vs. "Cause."

  5.  **Applying to the Three Cases:**
      *   *Case 1 (Overnight Deterioration):*
          *   Factor: Failure to escalate.
          *   Counterfactual: If escalated, would patient have survived?
