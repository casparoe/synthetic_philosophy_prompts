          *   Counterfactual: If *any* team booked, harm prevented.
          *   Outcome: Contributing Factor (each team) or Causal Factor (The Handover Process). Let's go with "Causal Factor: Discharge Process."

  6.  **Refining the "Unpopular Verdict" (Case 1):**
