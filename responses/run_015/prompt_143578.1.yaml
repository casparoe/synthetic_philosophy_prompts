      *   *The Problem of Omissions:* Failures to act (omissions) are tricky. If I don't water the plant, it dies. Did I kill it? Legally/Morally, maybe. Causally? It's an absence. Absences are everywhere. If *everyone* who *could* have watered it didn't, they are all causes. This leads to over-generation.
      *   *The "But-For" Explosion:* If we allow omissions freely, the list of causes becomes infinite (the Queen of England didn't fly in to save the patient). We need a norm or a duty to restrict the relevant omissions.
      *   *The Panel's Problem:* They are conflating *causation* (did this make a difference?) with *blame* (was this person responsible/wrong?) and *prevention* (could we stop this next time?).
      *   *Pattern 1 (Blank Box):* Conflating evidence of an act with the act itself. Just because we see the missing tick doesn't mean the tick would have changed the outcome.
      *   *Pattern 2 (Description):* Granularity matters. "Failure to escalate" vs. "Failure to escalate to Registrar X." We need a standard level of description (the "normal course of events").
      *   *Pattern 3 (Drifting Baseline):* Counterfactuals require holding some things fixed. We can't assume the registrar *would* have been free unless that's the normal expectation. We need a "Normal Functioning Baseline."
      *   *Pattern 4 (Preventive Failures):* Alarms not sounding. These are omissions of systems. Treat them similarly to human omissions but attribute to system design.
      *   *Pattern 5 (Diffused Failure):* Overdetermination. If A, B, and C all failed, and any one success would have prevented harm, all are causes. We need to allow "System/Team" as an entity if individuals can't be isolated.
      *   *Pattern 6 (Absent Actors/Background):* Strategic decisions (hiring). These are usually background conditions, not proximate causes, unless the shortage was known and immediate.
      *   *Values vs. Facts:* Causation is largely factual (counterfactual dependence). Blame/Accountability is normative (duty, foreseeability, capacity). The panel is trying to do both. We need to split the verdict.
      *   *Philosophical Distinctions to Keep:* Counterfactual dependence (simplified), Normalcy/Default conditions (to handle omissions), Preemption/Overdetermination (for diffused failure).
      *   *Distinctions to Drop:* Pre-emption nuances (early/late), probabilistic causation (too complex for 90 mins), metaphysical debates on absences (pragmatic approach needed).

  3.  **Developing the Procedure:**
      *   Need a step-by-step flow.
      *   Step 1: Define the Harm (Outcome).
      *   Step 2: Identify the Candidate Factor (Act or Omission).
