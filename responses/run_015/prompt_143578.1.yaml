      *   Step 4: The Duty/Norm Check (Is this a relevant omission?).
      *   Step 5: Classification (Causal vs. Contributing vs. Learning).
      *   Step 6: The Accountability Handoff (Explicitly separating causation from blame).
      *   Need clear definitions for the three verdicts.
          *   *Causal Factor:* But-for cause + within scope of expected care.
          *   *Contributing Factor:* Made it worse/more likely, but not strictly necessary (or part of a sufficiency set).
