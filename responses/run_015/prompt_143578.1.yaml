answer: |-
  ### Foundational Thinking: Causation, Omissions, and the Hospital Panel

  Before we draft the procedure, we must clear the conceptual undergrowth that is currently tangling your panel's wheels. You are asking three distinct questions but trying to answer them with a single verdict. This is why the arguments are unproductive.

  **1. What makes something a cause?**
  In philosophy, the most robust working definition for incident investigation is *counterfactual dependence*. Event $C$ is a cause of Event $E$ if, had $C$ not occurred, $E$ would not have occurred (or would have been significantly less likely). This is the "but-for" test. However, this test breaks down with *omissions* (failures to act). If I fail to save a drowning child, am I the cause of their death? Physically, no—the water and gravity did that. Normatively, yes, because you had a duty to act.
  For a hospital panel, an omission is only a *causal factor* if two conditions are met:
  1.  **Counterfactual Efficacy:** Performing the act would probably have prevented the harm.
  2.  **Normative Expectation:** The act was reasonably expected within the standard functioning of the system.
  Without the second condition, you are inundated with infinite causes (the CEO didn't fly in to perform CPR). Without the first, you are punishing symbolism rather than mechanics.

  **2. The Problem of the "Blank Box" and Description**
  You noted that a missing tick box feels more causal than a missing thought. This is an evidential bias, not a causal one. A tick box is only a cause if the medication/check associated with it would have altered the physiology. Your procedure must force the panel to look past the record to the *physiological reality*.
  Regarding description: "Failure to escalate" is too vague. "Failure to escalate to a registrar who was physically capable of attending" is the relevant description. If the registrar was already intubating a patient on the next ward, the failure to escalate to *that* registrar is not a cause of death, because the counterfactual (escalating) leads to the same outcome (registrar unavailable). You must fix the description at the level of *effective intervention*.

  **3. The Drifting Baseline (Holding Things Fixed)**
  This is the hardest philosophical problem you face. When imagining the world where the doctor *did* escalate, what else changes? Do we imagine a world where the ward is fully staffed? No. That is fantasy, not investigation. You must hold fixed the *actual* systemic constraints (staffing levels, equipment availability) unless those constraints were themselves illegal or grossly negligent. If the system was understaffed to the point of danger, the *staffing* is the cause, not the individual's failure to navigate the impossibility. If the staffing was tight but safe, you hold it fixed. This prevents the "fantasy rescue" fallacy.

  **4. Values vs. Facts**
  Your panel is conflating *causation* (a factual claim about the chain of events) with *accountability* (a normative claim about duty and blame). A doctor can be the cause of a death (their action killed the patient) but not be blameworthy (it was a known, accepted risk). Conversely, a doctor can be blameworthy (gross negligence) but not the cause (the patient would have died anyway). Your report needs to separate these. The "Causal Factor" verdict is a factual claim. The "Action Required" section is where accountability lives.

  **5. Philosophical Distinctions: Keep or Drop?**
  *   **Keep:** *Counterfactual Dependence.* It is the only tool that stops you from listing everything as a cause.
  *   **Keep:** *Overdetermination.* (Your "Diffused Failure" case). If three people fail, and any one success would have worked, all three are causes. You must allow "Team Process" as a causal entity.
  *   **Drop:** *Probabilistic Causation nuances.* Don't get bogged down in "increased risk from 40% to 45%." Use a "More Likely Than Not" threshold for practicality.
  *   **Drop:** *Pre-emption intricacies.* If the patient was going to die from Condition A, and the error caused Death by Condition B, just trace the actual path. Don't speculate on the hypothetical natural history unless it's certain.

  **6. Where the Procedure Will Misfire**
  It will misfire when the evidence is absent. You cannot run a counterfactual test without knowing what *would* have happened. If you don't know if the outreach team could have attended, you cannot say the failure to call them was a cause. The procedure must have a "Cannot Determine" exit valve. It will also misfire emotionally: families often hear "not a causal factor" as "nothing went wrong." You need specific language to buffer this.

  ***

  ### The Protocol: Causal Determination Procedure for Serious Incident Reviews

  **Time Allocation:** 90 Minutes
  **Chair Role:** Enforce the sequence. Do not allow discussion of "blame" until Step 6.

  #### Step 1: Define the Outcome (5 Minutes)
  *   **Question:** What is the specific harm we are investigating?
  *   **Requirement:** Must be physiological or concrete (e.g., "Cardiac arrest at 07:00," "Anaphylaxis," "Delayed cancer diagnosis").
  *   **Evidence:** Death certificate, imaging, pathology.
  *   **Stop Rule:** If the panel cannot agree on the harm, pause. Do not proceed to causation.

  #### Step 2: Identify the Candidate Factor (10 Minutes)
  *   **Question:** What specific act or omission are we testing?
  *   **Requirement:** Must be described at the level of *expected standard action*.
      *   *Bad:* "Failure to escalate."
      *   *Good:* "Failure to contact the on-call registrar at 02:15."
      *   *Bad:* "Alert didn't fire."
      *   *Good:* "Clinical decision support system failed to display allergy warning."
  *   **Evidence:** Policies, job descriptions, system configuration logs.
  *   **Note on Omissions:** An omission is only a candidate if there was a *duty* to act (policy, standard of care, or explicit handover).

  #### Step 3: The Counterfactual Test (The "Difference Maker") (30 Minutes)
  *   **Question:** If this factor had been present (act performed, omission rectified), would the Outcome (Step 1) have been avoided or significantly mitigated?
  *   **The Baseline Rule:** When imagining the counterfactual world, **hold fixed** the actual systemic constraints (staffing levels, equipment status, other concurrent emergencies) *unless* those constraints were known to be unsafe/illegal at the time.
      *   *Example:* Do not imagine the registrar was free if they were documented as being in another arrest.
      *   *Example:* Do imagine the alert would have fired if the system was configured correctly.
  *   **Evidence Standard:** "More Likely Than Not" (>50% probability).
      *   If evidence is absent (e.g., no record of registrar workload), the answer is "Cannot Determine."
  *   **Verdict Path:**
      *   **Yes:** Proceed to Step 4.
      *   **No:** Verdict is **Learning Point Only**. (Stop causal analysis for this factor).
      *   **Unclear:** Verdict is **Evidence Insufficient**. Record as Learning Point regarding data quality.

  #### Step 4: The Normative Check (15 Minutes)
  *   **Question:** Was the expected action (from Step 2) reasonable and possible within the held-fixed baseline?
  *   **Purpose:** Filters out "impossible duties."
  *   **Evidence:** Staffing rosters, policy documents, witness testimony on feasibility.
  *   **Verdict Path:**
      *   **Action was expected and possible:** Proceed to Step 5.
      *   **Action was expected but impossible (due to system):** The *System Constraint* becomes the Causal Factor, not the individual.
      *   **Action was not expected:** Verdict is **Learning Point Only**.

  #### Step 5: Classification (15 Minutes)
  *   **Question:** How does this factor relate to the harm?
  *   **Definitions:**
      *   **Causal Factor:** The harm would not have occurred *but for* this factor (given the baseline).
      *   **Contributing Factor:** The harm would likely still have occurred, but this factor made it more severe, or reduced the chance of survival (e.g., delayed treatment reduced survival from 40% to 10%).
      *   **Learning Point:** No causal link established, but the risk is real (e.g., a near miss, or a causal link that cannot be proven due to missing evidence).
  *   **Diffused Failure Rule:** If multiple actors failed (e.g., three teams), and any one success would have prevented harm, classify the *Process* (e.g., "Discharge Communication Protocol") as the Causal Factor. Do not force a single individual to carry the causal weight of a systemic breakdown.

  #### Step 6: The Accountability Handoff (15 Minutes)
  *   **Question:** Does this finding require individual accountability action?
  *   **Instruction:** This is a **Values** decision, not a factual one. It considers duty, foreseeability, and capacity.
  *   **Requirement:** If the panel finds "No Causal Factor" (Step 3) but identifies a breach of duty (Step 4), you must explicitly state the distinction in the report (see Template below).
  *   **Output:** Final Report Draft.

  ***

  ### Report Templates & Language

  **For a "No Causal Factor" finding where a duty was breached:**
  > "The Panel finds that the failure to [Action] was a deviation from expected practice. However, based on the evidence regarding [System Constraint/Concurrent Events], we cannot conclude that performing this action would have altered the patient's outcome. Therefore, it is not recorded as a Causal Factor in the death. This distinction separates the mechanical chain of events from the standards of professional conduct; the latter remains a matter for clinical governance."

  **For a "Diffused Failure" (System Cause):**
  > "The harm resulted from a breakdown in the [Process Name]. While individual assumptions contributed to this, no single individual's action was independently sufficient to prevent the outcome. The Causal Factor is the lack of a closed-loop verification step in the process."

  ***

  ### Application to Cases

  #### Case 1: The Overnight Deterioration
  *   **Outcome:** Cardiac arrest at 07:00, death.
  *   **Candidate Factor:** Failure of junior doctor to escalate at 02:00/05:00.
  *   **Counterfactual Test (Step 3):**
      *   *Baseline:* Hold fixed that the ward had 1:12 nursing ratio. Hold fixed that Outreach was attending two other arrests.
      *   *Scenario:* Doctor escalates at 02:00. Outreach is busy. Registrar is covering two other wards (as per actual night).
      *   *Analysis:* Who attends? If the Registrar is physically occupied with life-threatening emergencies elsewhere, they cannot attend. If Outreach is occupied, they cannot attend.
      *   *Evidence:* Logbooks show Outreach arrived at the other arrests at 01:45 and 04:30.
      *   *Conclusion:* In the counterfactual world where the doctor calls, the response is likely "We are busy, will attend when free." Given the rapid deterioration, the delay might still have resulted in arrest at 07:00.
  *   **Normative Check (Step 4):** Escalation was expected. However, the *capacity to respond* was systemically absent.
  *   **Classification (Step 5):**
      *   **Verdict:** **Contributing Factor** (to the *risk*), but **Not a Causal Factor** (to the *death*).
      *   **Reasoning:** The failure to escalate removed a *chance* of rescue, but given the resource constraints held fixed in the baseline, rescue was not probable enough to satisfy "More Likely Than Not."
      *   **Systemic Shift:** The *Staffing Level* and *Outreach Capacity* are the **Causal Factors**. The system did not have the surge capacity to absorb the escalation.
  *   **Accountability Handoff:** The junior doctor breached protocol, but the breach did not mechanically cause the death due to system saturation. Governance should address the protocol breach, but the Incident Report must cite staffing as the cause of death.

  #### Case 2: The Configured-Off Drug Alert
  *   **Outcome:** Anaphylaxis, survived with harm.
  *   **Candidate Factor:** Allergy alert disabled on the ward server.
  *   **Counterfactual Test (Step 3):**
      *   *Baseline:* Hold fixed that the prescriber was human and fallible. Hold fixed that the allergy was documented.
      *   *Scenario:* Alert fires.
      *   *Analysis:* Literature and policy suggest prescribers halt 90%+ of the time when a hard-stop or prominent alert fires for a documented severe allergy.
      *   *Conclusion:* Harm would likely have been avoided.
  *   **Normative Check (Step 4):** Alerts should not be disabled without governance review. This was a workaround.
  *   **Classification (Step 5):** **Causal Factor.**
      *   **Attribution:** This is a **System Causal Factor**. The individual prescriber is a vector, but the cause is the configuration management process.
  *   **Accountability Handoff:** No individual blame for the prescriber (relied on system). Accountability lies with the Digital/Safety Committee that allowed the workaround to persist for 11 months.

  #### Case 3: The Unbooked Scan
  *   **Outcome:** Delayed diagnosis (11 months), worsened prognosis.
  *   **Candidate Factor:** Failure to book scan at discharge.
  *   **Counterfactual Test (Step 3):**
      *   *Baseline:* Hold fixed that the three teams existed and had access to the booking system.
      *   *Scenario:* Team A books, or Team B books, or Team C books.
      *   *Analysis:* Any one action prevents the 11-month delay.
      *   *Conclusion:* The collective failure is necessary for the harm to occur.
  *   **Normative Check (Step 4):** Discharge summaries require "actioned" tasks, not "assumed" tasks.
  *   **Classification (Step 5):** **Causal Factor.**
      *   **Attribution:** **Process Failure (Handover).** Do not name an individual. The "Discharge Communication Protocol" is the factor.
  *   **Accountability Handoff:** Learning point for all three teams. Accountability lies with the Design of the Discharge Summary form (which allowed ambiguity).

  ***

  ### The Unpopular Verdict: Addressing Case 1

  You anticipated that Case 1 would yield a verdict the panel dislikes. You are correct. The procedure forces you to conclude that the junior doctor's failure to escalate was **not a Causal Factor in the death**, because the resources to respond did not exist.

  This will feel like exoneration to a lay member or a bereaved family. It will feel like scapegoating the staff to the manager. You must write the finding carefully.

  **The Sentence for the Report:**
  > "We distinguish between the *cause* of the death and the *breach* of protocol: while the failure to escalate was a breach of expected conduct, the evidence indicates that the outcome would have been the same due to concurrent resource unavailability; causation tracks the physical chain of events, while accountability tracks the adherence to professional standards."

  **Why this works:**
  1.  **It validates the norm:** It admits the doctor did something wrong ("breach of expected conduct"). This satisfies the need for standards.
  2.  **It protects the fact:** It admits the doctor's action didn't change the physics of the outcome ("outcome would have been the same"). This satisfies the philosophical requirement for causation.
  3.  **It shifts the gaze:** It implies the *resource unavailability* is the actual cause of the death, directing the Trust Board's attention to staffing, not just individual discipline.

  **Chair's Advice for the Meeting:**
  When you present this, say: "If we mark this as a Causal Factor, we are lying about the resources available that night. If we mark it as No Causal Factor, we must explain that the system failed the doctor, not just that the doctor failed the patient. The report must reflect that the escalation would have hit a wall of busy staff. That wall is the cause."

  ### Where This Procedure Will Misfire

  1.  **The "Unknown Baseline":** In Case 1, if there are no logs for the Registrar's location, you cannot hold their busyness fixed. You must verdict "Evidence Insufficient." Do not guess.
  2.  **The Emotional Toll:** Families may reject the "Cause vs. Breach" distinction. They hear "Not a cause" as "It didn't matter." You must be prepared to explain verbally that "It mattered for safety, just not for this specific outcome."
  3.  **Systemic Courage:** This procedure will identify staffing and configuration as Causal Factors more often than individuals. The Trust Board may push back. Your evidence logs (Step 3 Baseline Rule) are your shield. If you held the staffing fixed because it was "safe," you must be prepared to defend that claim. If you cannot, the Staffing becomes the Causal Factor.

  This procedure sacrifices the comfort of a named culprit for the accuracy of a preventable future. It is harder to run, but it produces reports that withstand coronial scrutiny and actually stop the recurrence.
