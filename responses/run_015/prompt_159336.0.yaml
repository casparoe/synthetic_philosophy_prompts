answer: |-
  There is no single canonical term for this specific rhetorical switch in political theory or philosophy. It is often discussed in fragments—under "political obligation," "collective responsibility," or "the paradox of voting"—but the specific *flip* you are describing does not have a proper noun like "The Prisoner's Dilemma."

  The most precise label for the mechanism is **The Retrospective Agency Shift**.

  Here is the carving you asked for: what it is, the conditions required for it to operate, where it breaks, and how it relates to the consent question.

  ### 1. The Mechanism: Causal vs. Constitutive
  The shift works by toggling between two different registers of responsibility.

  *   **Pre-Vote (Causal Register):** You are told your vote is **causally negligible**. In a electorate of millions, the probability of your single vote breaking a tie is effectively zero. Therefore, you cannot be held *causally* responsible for the outcome. This frame is used to lower the barrier to entry: "Don't worry about the weight of it, just add your drop."
  *   **Post-Vote (Constitutive Register):** You are told your vote is **constitutively essential**. The winner is not a force of nature; they are the sum of individual acts. By participating, you became a constituent part of the winning coalition. Therefore, you share *moral authorship* of the outcome. This frame is used to enforce accountability: "You are part of the machine that produced this."

  The "flip" is not necessarily hypocrisy; it is a shift from **instrumental causality** (did I physically tip the scale?) to **collective complicity** (did I join the group that tipped the scale?). The tension you feel is real because both statements are technically true, but they are weaponized at different times to serve different social functions (mobilization vs. accountability).

  ### 2. Boundary Conditions: When Does the Flip Operate?
  You asked for the edges. The Retrospective Agency Shift requires specific structural conditions to function. If these are missing, the flip collapses.

  **A. Causal Dilution (The Union Test)**
  *   **Condition:** The individual act must be statistically invisible within the aggregate.
  *   **Your Union Example:** In a 40-person vote, your vote is *causally potent*. It is not a drop in a bucket; it is a brick in a wall. Because your causal power is visible *before* the vote, the pre-vote minimization ("your vote doesn't matter") cannot be plausibly asserted.
  *   **Result:** The flip does not happen. Responsibility remains constant because agency remains constant. You own the result before and after because you could actually change it.
  *   **Edge Case:** If the election is a landslide (e.g., 80–20), the flip weakens even in a large electorate. If your side wins big, the "you did this" claim is diluted because your vote wasn't needed for the victory. The flip is strongest in close elections where the *collective* margin was thin, even if the *individual* margin was not.

  **B. Attribution Vector (The Mandate Requirement)**
  *   **Condition:** There must be a clear narrative linking the act to a specific agent.
  *   **Requirement:** This works best in two-party systems or "winner-take-all" mandates. If the outcome is a coalition government or a complex legislative compromise, the post-vote "you did this" claim fractures. It is harder to say "You voted for Party A, so you own Policy X" if Party A had to compromise with Party B to pass it.
  *   **Edge Case:** Proportional representation systems dampen the flip. The link between the individual vote and the specific executive outcome is more abstract, making the post-vote authorship claim harder to sustain.

  **C. Voluntary Participation**
  *   **Condition:** The act must be framed as voluntary, even if socially pressured.
  *   **Requirement:** If voting were truly compulsory (as in Australia), the post-vote "you did this" claim weakens. You can say, "I was fined if I didn't." The moral authorship relies on the fiction of pure choice.
  *   **Edge Case:** In the US, because voting is voluntary, the post-vote claim ("you chose him") holds. In Australia, the pre-vote claim ("you must vote") is law, not persuasion, so the tension is resolved by legal obligation rather than moral flipping.

  ### 3. Extensions: Does It Apply Elsewhere?
  Yes, but only where the **Causal Dilution** condition is met.

  *   **Climate Change / Flying:**
      *   *Pre-Act:* "One flight doesn't change the climate." (Causal Negligence)
      *   *Post-Act:* "You fly, you are destroying the planet." (Constitutive Complicity)
      *   *Verdict:* **Same Phenomenon.** The individual carbon footprint is negligible, but the moral identity is total.
  *   **Ethical Consumption (Meat):**
      *   *Pre-Act:* "One burger doesn't kill a cow; the supply chain is fixed."
      *   *Post-Act:* "You eat meat, you are a killer."
      *   *Verdict:* **Same Phenomenon.**
  *   **Recycling:**
      *   *Pre-Act:* "Recycle! It saves the planet." (Here, the pre-act claim is often *causal*, not negligible. You are told your specific bin matters.)
      *   *Post-Act:* "You didn't recycle, you ruined the batch."
      *   *Verdict:* **Different.** The pre-act framing usually asserts causal potency to encourage the behavior. The flip is less common because the "drop in the bucket" argument undermines the incentive.
  *   **Signing Petitions:**
      *   *Verdict:* **Weaker Fit.** Petitions are inherently expressive. The pre-act claim is rarely "this won't matter"; it is "this adds pressure." The post-act claim is "you supported this," which is true, but petitions rarely claim to *cause* an outcome directly, only to signal. The stakes of authorship are lower.

  ### 4. The Consent Question
  You asked if the one-way consent (Voting = Consent, Not Voting $\neq$ Dissent) is the same phenomenon.

  **Yes, it is the Legitimacy version of the Causality version.**

  *   **The Structure:** It relies on **Asymmetric Attribution of Intent**.
  *   **Voting:** Interpreted as an *active* signal. Because the default state of a citizen is "subject to the state," any deviation from the default (casting a ballot) is read as an endorsement of the mechanism.
  *   **Not Voting:** Interpreted as *passive* noise. Apathy, busyness, or cynicism are assumed. To withhold consent requires an active, legible signal (protest, resignation of citizenship, public refusal). Mere absence is not legible as a political signal.
  *   **Why it fits:** Like the Retrospective Agency Shift, this asymmetry serves a systemic function.
      *   *Pre-Vote:* "Your vote doesn't matter" (encourages participation to maintain system legitimacy).
      *   *Post-Vote:* "You voted, so you consent" (locks in legitimacy).
      *   *Non-Vote:* "You didn't vote, so you don't count" (prevents non-participation from delegitimizing the system).

  If non-voting were treated as active withholding of consent, a low turnout would invalidate the government. To prevent this, the system must interpret non-voting as *absence of signal* rather than *negative signal*.

  ### 5. Summary of the Carving
  The **Retrospective Agency Shift** occurs when:
  1.  **Scale:** The individual act is causally negligible within the aggregate (excludes small unions/committees).
  2.  **Outcome:** The outcome is binary or clearly attributable (excludes complex coalitions).
  3.  **Timing:** The *causal* register is used to lower barriers to entry; the *constitutive* register is used to assign blame/credit post-facto.
  4.  **Consent:** The same logic applies to legitimacy; participation is read as endorsement, non-participation is read as nullity.

  It is not hypocrisy in the sense of lying. It is a **category shift**. You are being asked to view yourself as a *statistic* when you are hesitant, and as an *agent* when you are accountable. The discomfort you feel is the friction of being moved between those two categories without consent.
