  2.  **Deconstruct Popper's Argument (The Philosophical Core):**
      *   *Historicism:* The belief that history follows inexorable laws that allow long-term prediction.
      *   *Popper's Critique:* Human history is influenced by the growth of human knowledge. We cannot predict future knowledge (because if we could, we'd have it now). Therefore, we cannot predict the future course of human history.
      *   *The Reflexive Twist:* If a social law is published, agents act on it, changing the conditions the law described (Oedipus Effect / Self-fulfilling or Self-defeating prophecies).
      *   *The Dilemma:* To save the theory, historicists often resort to ad-hoc redefinitions (immunizing strategies) rather than accepting falsification.

  3.  **Design the Simulation (The Mechanical Core):**
      *   *System:* Needs to be simple enough to grasp in 15 mins but complex enough to allow manipulation. Let's use a "Resource Stability Index" (RSI) based on two variables: *Production (P)* and *Distribution (D)*.
      *   *The Trap:* The "True Law" isn't just $P + D = RSI$. The "True Law" includes a variable $K$ (Knowledge/Publication). $RSI_{next} = f(P, D) - \alpha(\text{Published Prediction})$.
      *   *Rounds:*
          *   R1: Baseline prediction.
          *   R2: Reaction to others' publications + own results. The "Revision Choice" (Fix the math vs. Fix the definition).
          *   R3: Final prediction + The Reveal.
      *   *Roles:*
          *   Forecaster: Writes the formula.
          *   Policy Advisor: Decides $P$ and $D$ based on the formula.
          *   Observer: Watches other groups to see if they are gaming the system.
      *   *Incentives:* Points for accuracy. But if your action changes the global state based on your publication, you get bonus/penalty points depending on whether your law *accounted* for that influence.

