    "debrief_mapping": "Round 1 to historicist ambition; Round 2 to reflexive knowledge problem; Round 3 to immunization vs. fallibilism",
    "unreproducible_feature": "long-scale evolutionary dynamics of scientific discovery",
    "facilitator_patch": "verbal contrast with historical timescales plus enforced revision classification"
  }
