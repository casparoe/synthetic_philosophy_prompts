  5.  **Refining the Mechanics (Addressing Constraints):**
      *   *Constraint:* "No real-money payoffs." -> Use tokens or points on a board.
      *   *Constraint:* "Specific reflexive tension." -> The payoff matrix *must* shift based on published text.
      *   *Constraint:* "Empirical Correction vs. Definitional Retreat." -> Need a form they must fill out in Round 2.
      *   *Constraint:* "Predictable Failure Mode." -> Students will write "Everything happens" laws. *Fix:* Facilitator acts as a "Peer Review Board" that rejects tautologies in Round 1.
      *   *Constraint:* "Observer Dominance." -> *Fix:* Observers only speak during the "Cross-Examination" phase between rounds.

  6.  **Developing the Debrief:**
      *   Map R1 to Historicist Ambition.
      *   Map R2 to the Reflexive Problem (Knowledge affects reality).
