  ### Part 1: Brainstorming Diagnostic vs. Decorative Distinctions

  Before building the instrument, I need to separate distinctions that actually determine epistemic status from those that are merely rhetorical.

  *   **Diagnostic:**
      *   **Sensitivity (Make-it-true):** If an assumption is false, does the result depend on that falsity? If the result survives the truth, the assumption is decorative. If it collapses, the assumption is load-bearing. This is the single most important filter.
      *   **Target Specificity:** Is the model trying to predict *Chicago* or explain *segregation*? A false assumption is fatal for Chicago; it is permissible for segregation.
      *   **Error Sign:** If the assumption biases the result, do we know which way? If yes, we can treat the output as a bound. If no, the output is noise.
      *   **Convergence:** Can we add realism back in without the model exploding? If yes, it's an approximation. If no, it's a caricature.

  *   **Decorative:**
      *   **Mathematical Elegance:** A closed-form solution does not make an assumption true.
      *   **Standardness:** "Everyone uses this assumption" is an appeal to authority, not validity.
      *   **Tractability alone:** "We did this because it was hard otherwise" justifies the *choice*, not the *conclusion*.
      *   **Realism of *all* assumptions:** A model can be epistemically sound with 100% false assumptions (e.g., Fictionalist) if the target is mechanism, not prediction.

  ### Part 2: The Logical Space (Grid & Positions)

  To ensure the tree covers the necessary ground, I first define the logical space using five diagnostic questions.

  **The Five Diagnostic Questions:**
  1.  **Target:** Is the model aimed at a *Specific Empirical System* (e.g., 2024 Housing Market) or a *Class of Mechanisms* (e.g., How markets clear)?
  2.  **Sensitivity:** If the key idealized assumption were replaced by a true one, would the central result *Survive* or *Collapse*?
  3.  **Error Direction:** If the assumption introduces bias, is the direction of that bias *Signed* (known) or *Unsigned* (unknown)?
  4.  **Assumption Ontology:** Are the key entities *Distortions* of real things (e.g., infinite population) or *Inventions* with no counterpart (e.g., representative agent)?
  5.  **Convergence:** Is there a known sequence of models that relaxes the idealization while preserving the result (*Ladder*) or not (*Cliff*)?

  **The Grid of Positions:**
  There are $2^5 = 32$ logical combinations. Most are empty or unstable. Here are the occupied positions corresponding to the required leaves:

  *   **Instrumentalist:** Specific + Survives + Signed/Unsigned + Any + Any. (Prediction works, assumptions irrelevant).
  *   **Minimalist:** Specific + Survives + Unsigned + Any + No Ladder. (Prediction works, but we don't know why; assumptions are placeholders).
  *   **Verisimilitude:** Specific + Collapses + Signed + Distortion + Ladder. (Assumptions are approximations; bias is correctable).
  *   **Accusatory:** Specific + Collapses + Unsigned + Any + No Ladder. (Assumptions drive the result; result is untrustworthy).
  *   **Galilean:** Mechanism + Survives + N/A + Invention + Real Mechanism. (Isolates a causal power that exists).
  *   **Fictionalist:** Mechanism + Survives + N/A + Invention + Possible Mechanism. (Shows how a pattern *could* arise).
  *   **Convergentist:** Mechanism + Collapses + N/A + Distortion + Ladder. (Step toward truth about a mechanism).
  *   **Robustness:** Mechanism + Collapses + N/A + Distortion + No Ladder + Cross-Model Agreement. (Trust comes from family, not individual model).

  **Empty/Unattractive Combinations:**
  *   *Specific + Collapses + Signed + No Ladder:* Nobody claims a model is truth-tracking if it collapses and cannot be improved. (Unattractive).
  *   *Mechanism + Invention + Real Mechanism + No Convergence:* If the entities are invented, claiming they are "Real" without a path to realism is incoherent. (Incoherent).

  ### Part 3: The Decision Tree

  **Node Constraints:** 7 Nodes, 8 Leaves.
  **Justification for Node 2 (Sensitivity):** I place the *Make-it-true* test here because it is the primary filter for load-bearing assumptions. If a result survives the truth, most debates about assumption realism become moot (Instrumentalism). If it collapses, we must scrutinize the error.

  ```text
  NODE 1: TARGET
  Question: Is the model claiming to describe a specific real system (e.g., "The US Housing Market") 
            or a general class of mechanisms (e.g., "How segregation arises")?
  |
  +-- [Specific System] --> NODE 2
  |
  +-- [Class of Mechanisms] --> NODE 5

  NODE 2: SENSITIVITY (Make-it-true Test)
  Question: If the key unrealistic assumption were replaced by a true one, would the central result collapse?
  |
  +-- [No, it Survives] --> NODE 3
  |
  +-- [Yes, it Collapses] --> NODE 4

  NODE 3: PREDICTION FIT
  Question: Does the model match quantitative data without ad-hoc tuning?
  |
  +-- [Yes] --> LEAF A: INSTRUMENTALIST
  |
  +-- [No] --> LEAF B: MINIMALIST

  NODE 4: ERROR CORRECTABILITY
  Question: Is the bias introduced by the false assumption signed and correctable with available data?
  |
  +-- [Yes] --> LEAF C: VERISIMILITUDE
  |
  +-- [No] --> LEAF D: ACCUSATORY

  NODE 5: ASSUMPTION ONTOLOGY
  Question: Are the key idealized entities distortions of real things (e.g., infinite population) 
            or inventions with no counterpart (e.g., a single representative agent)?
  |
  +-- [Inventions] --> NODE 6
  |
  +-- [Distortions] --> NODE 7

  NODE 6: CAUSAL CLAIM
  Question: Does the paper claim this specific mechanism actually exists in the world, 
            or only that it could produce the pattern?
  |
  +-- [Exists] --> LEAF E: GALILEAN
  |
  +-- [Could Produce] --> LEAF F: FICTIONALIST

  NODE 7: CONVERGENCE
  Question: Is there a known "ladder" of models that relaxes the idealization without breaking the result?
  |
  +-- [Yes] --> LEAF G: CONVERGENTIST
  |
  +-- [No] --> LEAF H: ROBUSTNESS
  ```

  ### Part 4: Leaf Descriptions & Indistinguishability

  *   **LEAF A (Instrumentalist):** The model is a prediction engine; assumptions are irrelevant if output matches data.
      *   *Awkward Commitment:* You must accept accurate predictions from models with demonstrably impossible causes.
  *   **LEAF B (Minimalist):** The model gets the number right, but the assumptions are placeholders for unknown micro-details.
      *   *Awkward Commitment:* You claim knowledge of the aggregate while admitting ignorance of the cause.
  *   **LEAF C (Verisimilitude):** The model is approximately true; errors are known biases that can be corrected.
      *   *Awkward Commitment:* You must defend the claim that "closer to true" assumptions always yield "closer to true" predictions.
  *   **LEAF D (Accusatory):** The result depends on false assumptions that introduce unknown biases; the conclusion is unsupported.
      *   *Awkward Commitment:* You must reject the paper's central claim entirely, not just qualify it.
  *   **LEAF E (Galilean):** The model isolates a real causal force by stripping away noise.
      *   *Awkward Commitment:* You must claim that the "noise" stripped away is causally irrelevant in the target context.
  *   **LEAF F (Fictionalist):** The model is a credible fiction that shows how a pattern is possible.
      *   *Awkward Commitment:* You gain insight from a story you admit is false, without claiming it is the actual story.
  *   **LEAF G (Convergentist):** The model is a step on a ladder toward a more realistic description of a mechanism.
      *   *Awkward Commitment:* You must assume the next rung on the ladder actually exists and is reachable.
  *   **LEAF H (Robustness):** The result is trusted only because incompatible models yield the same outcome.
      *   *Awkward Commitment:* You admit this specific model is flawed, but trust the consensus of flawed models.

  **Indistinguishable Leaves:**
  *   **Instrumentalist vs. Minimalist:** Both admit assumptions are false and results survive. The distinction rests on *quantitative fit*, which is often a matter of degree. In practice, they function similarly: "Trust the number, ignore the story."
  *   **Galilean vs. Fictionalist:** Both use Inventions to explore Mechanisms. The distinction rests on the author's *ontological claim* (Does this force exist?), which is often ambiguous in the text.

  ### Part 5: Running the Cases

  **Case (a): Segregation Model (Schelling-style)**
  1.  **Target:** Class of Mechanisms (How segregation *can* arise, not specifically Chicago 2024). -> **Node 5**.
  2.  **Ontology:** Inventions (Grid, agents with threshold rules). -> **Node 6**.
  3.  **Causal Claim:** Paper discusses "what this shows about real segregation," implying the mechanism *could* exist, but rarely claims it is the *only* cause. Usually "could produce". -> **Leaf F (Fictionalist)**.
      *   *Verdict:* The model is evidence that mild preferences are *sufficient* for segregation, not that they are *necessary* or the actual cause in any specific city.

  **Case (b): Population Genetics (Hardy-Weinberg)**
  1.  **Target:** Specific System (Real populations) used as a baseline. *Correction:* It is treated as a Null Model for Specific Systems. -> **Node 1 (Specific)**.
  2.  **Sensitivity:** If assumptions were true (no selection), result holds. But they aren't. If we introduce selection (truth), the equilibrium frequencies *collapse/change*. -> **Node 2 (Collapses)**.
      *   *Wait:* The *use* of the model is to measure the *departure*. The "Result" is the baseline frequencies.
      *   *Refinement:* If the "Result" is the *prediction of frequencies*, it collapses. If the "Result" is the *detection of selection*, it survives.
      *   *Standard Interpretation:* The model predicts frequencies. Real data departs.
      *   *Path:* Specific -> Collapses. -> **Node 4**.
  3.  **Error Correctability:** The departure (error) is signed (deviation indicates selection pressure). We can measure the selection coefficient. -> **Leaf C (Verisimilitude)**.
      *   *Verdict:* The model is an approximate truth tool. It defines the "zero-force" state so we can measure the "force" of selection.
      *   *Note:* If classified as Mechanism (Null Model Class), it goes to Node 5 -> Distortion -> Node 7 -> Ladder Exists (Selection models). -> Leaf G (Convergentist). Both are defensible. I will stick with **Verisimilitude** because it is applied to real data as a measuring rod.

  **Case (c): Housing Policy (Rent Control)**
  1.  **Target:** Specific Real System (Specific ordinance, specific market). -> **Node 1 (Specific)**.
  2.  **Sensitivity:** If we add frictions/fixed costs (truth), does the "supply reduces" result collapse? Often, with frictions, supply might not adjust quickly, or might adjust differently. In many policy models, the *magnitude* relies heavily on frictionless assumptions. Let's assume the *qualitative* result survives but the *quantitative* estimate collapses.
      *   *Strict Reading:* If the headline conclusion is the *quantitative estimate*, it collapses. -> **Node 2 (Collapses)**.
  3.  **Error Correctability:** Is the bias from "frictionless" signed? Yes, frictionless models usually *overestimate* the speed and magnitude of supply response.
      *   *However:* Can it be corrected with available data? Usually, the friction parameters are unknown.
      *   *Decision:* If the paper claims a specific number (elasticity) without estimating frictions, the bias is **Uncorrectable**. -> **Leaf D (Accusatory)**.
      *   *Verdict:* **Deflating.** The model licenses a qualitative claim ("supply might drop") but the attached number is unsupported because the bias is uncorrectable.

  **Revision Log:**
  *   *Initial Run:* I initially routed Housing to Verisimilitude because the bias (overestimation) is Signed.
  *   *Revision:* I adjusted Node 4 to ask "Signed **and Correctable**." A signed bias is useless if you lack the data to correct it. This pushes the Housing case to Accusatory, which fits the pedagogical goal (deflating over-confident policy models).
  *   *Reasoning:* "Signed" alone implies we know the direction. "Correctable" implies we can adjust the number. Policy models rarely allow the latter.

  ### Part 6: What The Tree Cannot Do

  1.  **Dual-Role Assumptions:** Sometimes an assumption is load-bearing for the *derivation* but not the *intuition*. The tree forces a binary choice (Survives/Collapses). It cannot capture "Survives, but only with much harder math."
  2.  **Nested Idealizations:** If the target system is itself a model (e.g., a climate model output used as input for an economic model), Node 1 (Target) becomes ambiguous. Is the target the "Climate Model" or the "World"? The tree assumes a direct link to reality.
  3.  **Asymmetric Policy Costs:** The tree treats False Positives (accepting a bad model) and False Negatives (rejecting a good model) equally. In policy, a False Negative (rejecting a rent control model that was actually right) might cost lives, while a False Positive costs money. The tree identifies epistemic status, not risk tolerance. It tells you "This is shaky," not "Use it anyway because the alternative is worse."

  ### Part 7: Student-Facing Half-Page Version

