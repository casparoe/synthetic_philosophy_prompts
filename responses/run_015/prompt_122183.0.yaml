  # MODEL STATUS CHECKLIST
  *Answer the questions in order. Stop at the first Leaf.*

  **1. WHAT IS THE TARGET?**
  *   **A:** A specific real system (e.g., "The 2024 Housing Market"). -> **Go to 2**
  *   **B:** A general mechanism or pattern (e.g., "How Segregation Arises"). -> **Go to 5**

  **2. THE MAKE-IT-TRUE TEST (Specific Systems)**
  *If the key unrealistic assumption were replaced by a true one, would the main result collapse?*
  *   **No, it Survives:** -> **Go to 3**
  *   **Yes, it Collapses:** -> **Go to 4**

  **3. PREDICTION FIT**
  *Does the model match quantitative data without ad-hoc tuning?*
  *   **Yes:** **INSTRUMENTALIST.** (Trust the prediction, ignore the assumptions.)
  *   **No:** **MINIMALIST.** (Trust the number as a placeholder; the mechanism is unknown.)

  **4. ERROR CORRECTABILITY**
  *Is the bias from the false assumption known AND can you correct for it with available data?*
  *   **Yes:** **VERISIMILITUDE.** (The model is approximately true; correct the bias.)
  *   **No:** **ACCUSATORY.** (The result depends on the falsehood; the conclusion is unsupported.)

  **5. ASSUMPTION TYPE (Mechanisms)**
  *Are the key entities distortions of real things (e.g., infinite population) or inventions (e.g., one representative agent)?*
  *   **Inventions:** -> **Go to 6**
  *   **Distortions:** -> **Go to 7**

  **6. CAUSAL CLAIM**
  *Does the paper claim this mechanism actually exists, or only that it could produce the pattern?*
  *   **Exists:** **GALILEAN.** (The model isolates a real cause.)
  *   **Could Produce:** **FICTIONALIST.** (The model shows a possible story.)

  **7. CONVERGENCE**
  *Is there a known path to make the model more realistic without breaking the result?*
  *   **Yes:** **CONVERGENTIST.** (This model is a step toward truth.)
  *   **No:** **ROBUSTNESS.** (Trust this only if other models agree.)

  ---
  *Note: If you land on ACCUSATORY, the paper's central conclusion is not entitled to its assumptions. If you land on FICTIONALIST, the paper shows possibility, not actuality.*
