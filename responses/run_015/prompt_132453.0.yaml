  *(Self-Correction on Point 1)*: Does Hofstadter claim convergence? In the "Record in the Jungle" chapter, he discusses the "universal" nature of intelligence. He suggests that any sufficiently advanced civilization would figure out the physics of the record. So yes, he claims convergence *in principle*, even if not in practice. The user's worry is ontological (does it exist *now*?), Hofstadter's is epistemological (can it be *known*?). I need to highlight this distinction.

