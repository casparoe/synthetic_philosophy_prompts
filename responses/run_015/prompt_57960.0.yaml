  3. There is a significant tension between (3) and (5) because positing true general principles that explain rightness conflicts with the view that competent judges cannot state these principles without loss. This is tenable only if you accept a strong distinction between metaphysical explanation and the agent's epistemic access to that explanation.
  4. Resolving the first contradiction cheaply requires amending (4) to acknowledge that a complex principle accounts for the contextual difference, costing you the particularist intuition that moral life outstrips codification. This preserves explanatory generalism while retaining the specific verdicts on the allotment cases.
  5. Resolving the second contradiction requires restricting (1) to allow invariant features like deceit, which costs you the theoretical elegance of a unified holist account of all moral reasons. This preserves the specific claim about deceit while weakening the global holist thesis.
