answer: |-
  **MEMORANDUM**

  **TO:** Research Ethics and Clinical Governance Board
  **FROM:** Ethics Subcommittee on Disorders of Consciousness
  **DATE:** October 24, 2023
  **SUBJECT:** Opinion on Protocol [ID-892]: Heterophenomenological Assessment of Awareness in UWS

  **RECOMMENDATION:** **Conditional Approval**
  *(Contingent upon immediate amendment of Section 4.2 regarding Clinical Safety and Analgesic Governance)*

  ### 1. Executive Summary
  The proposed study offers a rigorous methodological approach to the epistemological challenges inherent in Disorders of Consciousness (DoC) research. However, the Subcommittee identifies a critical ethical flaw in the protocol's conflation of *research epistemology* with *clinical governance*. Specifically, the requirement that analgesic adjustments be justified solely by observable behavioral criteria, explicitly excluding appeals to potential patient experience, transforms a methodological stance of agnosticism into a clinical stance of practical eliminativism.

  We recommend **Conditional Approval**. The study may proceed only if the clinical care of participants is decoupled from the study's epistemological constraints. Analgesic decisions must revert to the standard precautionary principle for UWS patients, independent of the heterophenomenological data collection.

  ### 2. Analysis of the Methodological Framework
  The investigators propose utilizing Daniel Dennett's heterophenomenology. As a research methodology, this is defensible. Heterophenomenology treats subject reports (or in this case, proxy and clinical observations) as "texts" to be interpreted without initially committing to the ontological reality of the described states. In a research context, this prevents the projection of researcher bias onto ambiguous neural or behavioral data. It ensures that claims of "covert consciousness" are not overstated based on wishful thinking.

  Half of this Board correctly identifies this as epistemic humility. In the *analysis phase* of the study, bracketing the question of "what it is like" to be the patient is scientifically sound. It prevents the reification of noise as signal.

  ### 3. The Ethical Conflict: Agnosticism vs. Eliminativism
  The controversy arises in the protocol's translation of this methodology into clinical rules. The protocol mandates: *"Any clinical recommendation... be justified solely by observable behavioral criteria and never by appeals to what the patient might be experiencing."*

  The opposing half of the Board argues this violates non-maleficence. We find this objection decisive. Here is why:

  **A. The Misreading of Heterophenomenology**
  The protocol rests on a misreading of the heterophenomenological framework. Heterophenomenology is a method of *interpretation*, not a doctrine of *neglect*. To bracket the ontology of a subject's experience for the sake of analysis is not to deny the *risk* of that experience for the sake of safety.
  By hard-coding this agnosticism into clinical decision rules, the protocol ceases to be agnostic. It functionally asserts that if suffering is not behaviorally observable, it is clinically irrelevant. This is not heterophenomenology; this is behaviorism bordering on eliminativism. It treats the *absence of evidence* (of behavior) as *evidence of absence* (of suffering).

  **B. The Precautionary Principle in UWS**
  In Unresponsive Wakefulness Syndrome (UWS), the dissociation between nociceptive processing and behavioral output is well-documented. Patients may exhibit neural signatures of pain without grimacing or vocalizing.
  Standard clinical ethics in DoC relies on the precautionary principle: where there is a non-negligible probability of sentience and suffering, and the cost of intervention (analgesia) is low relative to the harm of omission (untreated pain), the clinician must act to mitigate the risk of suffering.
  The proposed protocol forbids this. It instructs clinicians to ignore the *possibility* of hidden experience when prescribing medication. This institutionalizes a risk of harm that the hospital has a duty to prevent.

  ### 4. Resolution and Conditions
  We must distinguish between how we *study* the mind and how we *treat* the human being. A researcher can remain agnostic about the existence of qualia while a clinician must act as if qualia exist to ensure safety.

  **Condition 1: Decoupling Clinical Care from Research Epistemology**
  Section 4.2 of the protocol must be amended. The heterophenomenological constraint applies strictly to data analysis and publication. It **cannot** apply to clinical governance.
  *   **Requirement:** Analgesic regimens must be determined by the attending pain management team according to standard hospital protocols for DoC patients (which include neurophysiological indicators and precautionary dosing), regardless of whether these decisions can be justified within the study's heterophenomenological framework.
  *   **Rationale:** The duty of non-maleficence supersedes the methodological purity of the research design.

  **Condition 2: Data Safety Monitoring Board (DSMB) Review**
  *   **Requirement:** A DSMB review is scheduled after the enrollment of the first 10 participants or 6 months (whichever comes first).
  *   **Focus:** This review will specifically audit pain management logs to ensure no participant received sub-standard analgesia due to the study's behavioral constraints.

  ### 5. Conclusion
  To approve the protocol as written is to endorse the view that a patient's moral status is contingent upon their ability to behaviorally manifest their suffering. Heterophenomenology does not demand this; it merely asks us to be careful about what we claim to *know*. It does not ask us to be careless about what we *risk*.

  We urge the Board to vote for **Conditional Approval** with the stipulations above. This preserves the scientific integrity of the heterophenomenological approach while upholding the hospital's fundamental duty to protect vulnerable subjects from the possibility of untreated pain.

  **Signed,**

  *Dr. Elena Rostova, PhD*
  *Chair, Ethics Subcommittee on Disorders of Consciousness*
