answer: |-
  To teach *Lord of the Flies* alongside David Lewis, you must frame Lewis as providing the skeleton of social order and Golding as providing the pathology. Lewis describes how norms stabilize without enforcement; Golding describes how they rot when preferences shift. For the syllabus, select these three scenes: the First Assembly (the conch), the Hunt and Dance (the paint), and the Rescue (the naval officer). Each exposes a limit in the Lewisian apparatus that your hobby-horses correctly identify.

  The First Assembly establishes the conch as a signal. Superficially, this fits Lewis: an arbitrary regularity where everyone prefers to listen conditional on others listening. However, your first hobby-horse survives scrutiny. Lewis assumes a population of agents whose standing is already settled; his machinery coordinates actions, not recognition. The conch does both. When a boy speaks without the shell, he isn't merely breaking a convention; he is being treated as noise. Lewis's model cannot explain the constitution of the group, only their coordination once constituted. The novel shows that before you can have a convention, you must agree on who counts as a conformer. The theory assumes the players; the novel dramatizes the selection of the players.

  The Hunt and Dance scene dismantles the epistemic conditions Lewis requires. Lewisian convention depends on common knowledge of conformity: I know you conform, you know I know, and so on. The paint destroys observability. Your third hobby-horse is correct: once faces are masked, nonconformity becomes invisible. This shifts the dynamic from common knowledge to pluralistic ignorance. Boys join the dance not because they know others prefer it, but because they cannot see who refuses it. Furthermore, your second point on salience is vital. Lewis treats salience as a focal point found in the environment. On the island, salience is manufactured. The beast is not a pre-existing coordination problem; it is a narrative tool Jack uses to shift the focal point from rescue (fire) to hunting (meat). Lewis's static environment cannot account for agents who weaponize salience to collapse one equilibrium and launch another. The theory explains how a norm holds; the novel shows how fear is engineered to break it.

  The Rescue scene addresses your pushback on human nature and enforcement. Lewis argues conventions need no outside enforcer. The officer arrives as an external enforcer, yet he reads the violence as a "game." This vindicates Lewis's claim that conventions are morally neutral equilibria—the adult world maintains its own conventions (war) without moral justification. However, it embarrasses the idea that conventions sustain civilization. The island's slide isn't a selection process among stable equilibria; it is a corruption of preferences. Lewis is officially neutral about where preferences come from, which makes him the wrong instrument to explain why the boys stop preferring order. Golding argues preferences are thin and reversible; Lewis assumes they are fixed constraints. The officer stops the killing not because of a better norm, but because of a larger hierarchy. The novel suggests that without the threat of external punishment, the internal preference for order collapses. Lewis explains the mechanics of the trap; Golding explains why the animals walk into it.

  These scenes show that Lewis provides the logic of stability, while Golding provides the phenomenology of collapse. The conch shows recognition precedes coordination; the paint shows observability sustains common knowledge; the officer shows that neutral equilibria offer no moral protection. Lewis's theory survives as a description of structure, but it fails as a description of motivation. You are not overreading; you are identifying the boundary where game theory meets moral psychology.

  Verdict: GOLDING-GOES-BEYOND-LEWIS — Lewis explains how norms stabilize mechanically, but Golding reveals why they collapse morally when human preferences mutate.
