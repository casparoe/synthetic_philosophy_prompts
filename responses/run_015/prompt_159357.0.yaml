answer: |-
  # The Twin Universe Quiz

  **Instructions:** Read each scenario quickly. Circle the answer that matches your immediate intuition. Do not overthink it. There are no right or wrong answers.

  **1. The Empty Universe**
  Imagine a universe containing nothing but two iron spheres. They are exactly the same size, temperature, and color. There is no light, no landmarks, and no observer.
  *How many spheres are there?*
  A) One
  B) Two

  **2. Telling Them Apart**
  In that same universe (nothing but the two spheres), is there any feature or fact that one sphere has that the other does not?
  A) Yes
  B) No

  **3. The Visitor**
  A third sphere, slightly dented, appears near one of the twins for a moment and is then destroyed.
  *While the dented sphere was there, were the two twins in different situations?*
  A) Yes
  B) No

  **4. The Aftermath**
  *Now the dented sphere is gone. Are the two twins exactly alike in every way again?*
  A) Yes
  B) No

  **5. The Swap**
  The two spheres slowly move and exchange places.
  *When the swap is finished, is the sphere now on the left the same individual sphere that started on the left?*
  A) Yes
  B) No
  C) There is no fact of the matter

  **6. The Change**
  *After the swap is finished, is the total state of the universe different from how it started?*
  A) Yes
  B) No

  **7. The Hands**
  Imagine a universe containing nothing but two human hands. One is a left hand, one is a right hand.
  *Are the hands exactly the same shape?*
  A) Yes
  B) No

  **8. The Difference**
  *Is the only difference between the hands which side they are on?*
  A) Yes
  B) No

  **9. The Box**
  Inside a sealed box, there are two electrons. Every measurable quantity (spin, charge, energy) is symmetric between them.
  *How many particles are in the box?*
  A) One
  B) Two

  **10. The Electron Swap**
  *If the two electrons switch places inside the box, does the physical state of the box change?*
  A) Yes
  B) No

  ***

  # Scoring Key & Taxonomy

  **How to use this:** Follow the path based on the student's answers. The "Leaf" at the end describes their metaphysical position.

  ### **Start: Question 1 (Count)**
  *   **If A (One):** → **Leaf 1: The Strict Monist.**
      *   *Position:* **Leibnizian Absolutist.**
      *   *View:* If there is no difference, there is only one thing. Distinctness requires qualitative difference.
  *   **If B (Two):** → Go to **Question 2**.

  ### **Node: Question 2 (Features)**
  *   **If A (Yes):** → Go to **Question 7** (Hands check).
      *   *(Note: If they say "Yes" because of distance/relations, they are Relationists. If "Yes" because of history, they are Historical Essentialists.)*
  *   **If B (No):** → Go to **Question 5** (Swap).

  ### **Node: Question 5 (Swap Identity)**
  *   **If A (Yes, same individual):** → **Leaf 2: The Haecceitist.**
      *   *Position:* **Substratum Theory / Transworld Identity.**
      *   *View:* Objects have a primitive "this-ness" that persists through change. They are distinct even without qualitative differences.
  *   **If B (No):** → **Leaf 3: The Permuter.**
      *   *Position:* **Anti-Haecceitism.**
      *   *View:* Swapping indistinguishable objects creates no new reality. Individuals are just slots in a structure.
  *   **If C (No fact):** → **Leaf 4: The Indeterminist.**
      *   *Position:* **Ontic Vagueness / Quantum View.**
      *   *View:* It is not just unknown, but metaphysically unsettled, which is which.

  ### **Node: Question 7 (Hands Shape)**
  *(For those who said "Yes" to Q2)*
  *   **If A (Yes, same shape):** → **Leaf 5: The Relationist.**
      *   *Position:* **Weak Discernibility.**
      *   *View:* Objects are distinguished by relations (e.g., "being 1 mile from") even if they share all intrinsic features.
  *   **If B (No, different shape):** → **Leaf 6: The Absolutist.**
      *   *Position:* **Kantian Incongruent Counterparts.**
      *   *View:* Spatial orientation is an intrinsic feature. Leftness and Rightness are real qualities.

  ### **Node: Question 9 & 10 (Electrons)**
  *(Applies to all Leaves above as a stress test)*
  *   **If Q9=B (Two) AND Q10=B (No change):** → **Leaf 7: The Quantum Structuralist.**
      *   *Position:* **Bundle Theory (Quantum Variant).**
      *   *View:* Counting applies, but individual identity does not. Particles are bundles of states without underlying "holders."
  *   **If Q9=B (Two) AND Q10=A (Change):** → **Leaf 8: The Classical Realist.**
      *   *Position:* **Haecceitism (Extended).**
      *   *View:* Applies macroscopic intuition to microscopic entities (often conflicts with physics).
  *   **If Q9=A (One):** → **Leaf 1: The Strict Monist** (Revisited).
      *   *View:* Consistent application of Leibniz's Law to physics.

  ***

  # TA Guide: Analyzing the Leaves

  ### 1. The Taxonomy of Positions
  *   **Leaf 1 (Strict Monist):** Rare in macroscopic cases, common in strict logical readings of Leibniz.
  *   **Leaf 2 (Haecceitist):** Corresponds to **Substratum Theory**. They believe in a "bare particular" that holds properties.
      *   *Variant:* If they say "Yes" to Q2 (trivial identity properties like "being identical to A"), they are **Trivial Haecceitists**. This makes the Principle of Identity of Indiscernibles vacuously true.
  *   **Leaf 3 (Permuter):** Corresponds to **Anti-Haecceitism**. Distinctness exists, but "which is which" is meaningless.
  *   **Leaf 4 (Indeterminist):** Corresponds to **Ontic Vagueness**. Often overlaps with Quantum interpretations.
  *   **Leaf 5 (Relationist):** Corresponds to **Weak Discernibility**. They count relations (like distance) as genuine distinguishers.
  *   **Leaf 6 (Absolutist):** **Kantian**. Believes space imposes intrinsic differences.
  *   **Leaf 7 (Quantum Structuralist):** **Bundle Theory**. Objects are just collections of properties/states. No "glue" holding them together.
  *   **Leaf 8 (Classical Realist):** **Unnamed**.
      *   *Why:* This position is scientifically untenable (violates Bose-Einstein/Fermi-Dirac statistics) but metaphysically coherent. Nobody sits here seriously because physics rules it out.

  ### 2. Verbal Disputes & Indistinguishable Leaves
  *   **Haecceitist (Leaf 2) vs. Brute Primitivist:** Your questions cannot separate these. One says there is a "property of self-identity," the other says "distinctness is just brute fact." This is a **verbal dispute** about whether "distinctness" counts as a "feature."
  *   **Bundle (Leaf 7) vs. Substratum (Leaf 2):** The Orbit case (Q5/Q6) tries to catch this, but often fails. A Substratum theorist says the "holder" persists; a Bundle theorist says the "collection" persists with updated members. Unless you press them on *what* persists, their answers to Q5 will look identical. **Flag:** You cannot separate these with this quiz alone.
  *   **Relationist (Leaf 5) vs. Absolutist (Leaf 6):** Depends entirely on whether they count "position in space" as a feature. If they say space is real, they are Absolutists. If they say relations are real, they are Relationists. This is often a **verbal dispute** about the definition of "feature."

  ### 3. The Electron Branch: Does it need to be separate?
  **Yes, it needs its own branch.**
  Answers to (1)–(4) do not settle it. A student can consistently hold that macroscopic spheres have primitive identity (Leaf 2) while accepting that electrons do not (Leaf 7). This forces them to admit their metaphysics is **domain-specific**. If they try to apply Leaf 2 to electrons, they conflict with physics. If they apply Leaf 7 to spheres, they conflict with intuition. This tension is where the tutorial gold lies.

  ### 4. Where is the Real Disagreement?
  Spend the second half of the tutorial on the **Q2/Q5 Junction (The Ground of Distinctness).**

  *   **The Conflict:** The room is split between **Leaf 2 (Haecceitism)** and **Leaf 5/7 (Bundle/Relationism)**.
  *   **The Argument:**
      *   Ask the Leaf 2 group: "If there is absolutely no difference in features, history, or relations, *what* makes them two?" (Pushing them toward "Brute Fact").
      *   Ask the Leaf 5/7 group: "Is 'being 1 mile from' a real feature of the object, or just a fact about the pair?" (Pushing them on whether relations count as properties).
  *   **Why here?** This is where the Principle of Identity of Indiscernibles actually breaks or holds. The Electron case (Q9/10) is the hammer you use to test if their solution is robust or just an intuition about medium-sized dry goods.

  **Tutorial Strategy:**
  1.  Hand out quiz (5 mins).
  2.  Sort students by Leaf (5 mins).
  3.  Pit Leaf 2 against Leaf 5/7 on the "Ground of Distinctness."
  4.  Drop the Electron case on Leaf 2 and ask them to explain why spheres get "this-ness" but electrons don't. (15 mins).
