answer: |-
  This is a precise and well-observed carving of a systemic phenomenon. You are correct that the standard labels (Tragedy of the Commons, Prisoner's Dilemma, Malthusian Trap) all miss a specific coordinate of the shape you are describing.

  The shape you are looking for is best described as **The Demographic Ratchet** (or **The Carrying Capacity Trap**).

  Here is the carving you asked for: the mechanism, the lock, the inequality variable, and the boundaries.

  ### 1. The Engine: Selection for Carrying Capacity
  The driving force is not individual utility maximization (as in standard economics) but **group-level selection on population density**.

  In a competitive environment (whether tribes fighting over land or universities fighting for prestige), the system that supports the highest density of "units" (people, credentialed applicants, scheduled children) will displace the system that supports fewer, even if the "units" in the first system have lower individual welfare.

  *   **Farming:** Supports 100x the people per square mile as foraging. The foragers aren't killed because they are weaker; they are drowned out by numbers.
  *   **Academia:** The department that requires a PhD hires someone who looks "better" than the BA candidate, even if the PhD adds no actual teaching value. The standard ratchets up because the pool of candidates is selected from those who jumped the highest hurdle.
  *   **Parenting:** If one parent schedules their kid, the unscheduled kid is at a disadvantage. If *all* parents schedule, the baseline for "normal development" shifts, and the unscheduled kid is now "neglected."

  **Distinction:** This is not a Prisoner's Dilemma. In a PD, the actors are contemporaries who *could* coordinate if they could trust each other. In the Demographic Ratchet, the coordination failure is **intertemporal**. Generation A makes a rational choice that changes the environment for Generation B. Generation B cannot coordinate with Generation A because Generation A is dead, and they cannot return to the old baseline because the population size now *depends* on the new baseline.

  ### 2. The Lock: The Demographic Ratchet
  You asked if the "can't reverse it" bit is a separate mechanism. It is the **consequence** of the engine, but it functions as a distinct lock.

  In economics, a "ratchet" usually refers to prices or wages that go up easily but not down. Here, the ratchet is **population density**.
  *   **Step 1:** Innovation allows higher density (farming, credentials, enrichment).
  *   **Step 2:** Population fills the new capacity.
  *   **Step 3:** The old way can no longer support the new population.
  *   **Step 4:** Reversion is impossible without mass mortality.

  This is why "Moloch" feels like a vibe but isn't a definition. Moloch describes the *competition*. The Demographic Ratchet describes the *irreversibility*.

  ### 3. The Inequality Question
  You asked: *Is the inequality part of the same mechanism or just a side effect?*

  **It is a side effect of defensibility, not the ratchet itself.**

  The Ratchet (higher density locking out reversion) happens regardless of inequality. However, **hierarchy** emerges based on the *physics of the surplus*.
  *   **Farming:** Grain is storable, fungible, and stealable. This requires defense. Defense requires specialization (soldiers/kings). This creates structural class inequality.
  *   **Academia:** Credentials are personal and non-transferable. You cannot steal my PhD. This creates status hierarchy, but not necessarily the same material class stratification as land/grain.
  *   **Parenting:** "Human capital" is internal to the child. This creates inequality between families, but not necessarily a rigid caste system.

  So, the **Ratchet** forces everyone to play the game. The **Surplus Type** determines whether that game produces kings and peasants or just stressed-out equals.

  ### 4. The Intergenerational Distinction
  You noted that in standard Collective Action Problems, the people locked in are the ones who chose it. In your cases, the choosers (ancestors) got the benefit (survival/expansion), and the inheritors (descendants) get the cost (grind/lock-in).

  This is a **Transgenerational Externality**.
  In standard economics, an externality is a cost imposed on a neighbor. Here, the cost is imposed on a descendant. Because the descendants do not exist yet, they cannot negotiate with the ancestors. The ancestors "spend" the welfare of the future to buy the existence of the future.

  ### 5. Proposed Name and Borderline Cases
  If you need a label to file this under, **The Demographic Ratchet** is the most mechanically accurate. **The Carrying Capacity Trap** is also strong.

  **Borderline Cases (Where the carving stops):**

  *   **The Malthusian Trap:** In a Malthusian trap, productivity gains are eaten by population growth until everyone is back at subsistence. In your shape, productivity gains *cause* the population growth that locks the system in. The distinction is subtle: Malthus is about *limits*; your shape is about *lock-in*.
  *   **Technological Path Dependence (QWERTY):** QWERTY is hard to switch away from, but switching back wouldn't kill anyone. The Demographic Ratchet involves **existential lock-in** (reversion = mass starvation/unemployment).
  *   **The Red Queen Effect:** This describes the "running to stay in place" aspect (academia/parenting). It fits the *experience* of the participants, but it doesn't capture the *demographic irreversibility* of the farming case. The Red Queen is the treadmill; the Demographic Ratchet is why you can't step off.
  *   **Jevons Paradox:** This states that increased efficiency leads to increased consumption. This is the *economic law* underlying the ratchet. Farming made calories more efficient to produce; we "consumed" that efficiency by making more humans rather than working less.

  ### 6. Does coordination break it?
  You asked: *Does it stop being the phenomenon in the rare cases where some group does coordinate its way out?*

  If a group coordinates to **limit population** while maintaining the technology (e.g., the Demographic Transition in modern wealthy nations), they temporarily escape the Ratchet.
  *   **However:** If they are in competition with a group that *does not* limit population (e.g., a high-fertility cultural subgroup or a rival nation), the Ratchet re-engages. The high-fertility group will eventually out-number the low-fertility group, and the competitive pressure returns.
  *   **Conclusion:** The phenomenon persists as long as **multipolar competition** exists. It only truly dissolves if the competition itself is removed (a global singleton, or a cultural shift that decouples success from numbers).

  ### Summary of the Carving
  *   **Mechanism:** Group selection favoring carrying capacity over individual welfare.
  *   **Lock:** Demographic irreversibility (population fills the new niche).
  *   **Inequality:** Contingent on the defensibility/storability of the surplus.
  *   **Time:** Intergenerational externality (ancestors choose, descendants pay).
  *   **Name:** **The Demographic Ratchet**.

  This distinguishes it from the Tragedy of the Commons (no depletion), Prisoner's Dilemma (no contemporaneous coordination possible), and Malthus (focus on lock-in rather than subsistence limits). It captures the specific horror of the farming story: we are not trapped because we ran out of resources, but because we successfully created too many dependents.
