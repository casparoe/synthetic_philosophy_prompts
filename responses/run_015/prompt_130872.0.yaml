prompt: |-
  I've been working through the history of the genocide concept and I think I've hit a confusion about Lemkin's own trajectory. From what I understand, Lemkin introduced the term in his 1944 study with a very broad definition that covered cultural, economic, and political destruction, but during the drafting of the 1948 Convention he personally pushed to narrow it to physical and biological annihilation, believing that cultural destruction was a different moral category altogether. If that's correct, then modern activists who invoke "cultural genocide" are not only facing a legal gap in the Convention — they are also misrepresenting Lemkin's mature conceptual judgment, which came to treat cultural erasure as a wrong of a different kind rather than an incomplete form of genocide. So shouldn't we regard "cultural genocide" as a category error rooted in a misunderstanding of Lemkin's refined position, rather than as a legitimate but excluded part of the framework? Lead with your bottom line in the first sentence, then give the reasoning, with no preamble and without restating my question.
