answer: |-
  Your hypothesis is correct, but it stops one layer short of the actual engine driving the loop. You've identified the *symptom* (no shared criterion for core vs. periphery), but the *disease* is a clash between two incompatible models of how theories relate to the world and to each other.

  Here is the diagnosis of the structure, the blockage, and what progress would actually look like.

  ### 1. Is it Verbal, Substantive, or Two Questions?
  It is **substantive**, but it masquerades as a verbal dispute because both sides are using the word "theory" to refer to different logical objects.

  *   **The Anti-Realist (PMI)** treats a theory as a **holistic proposition**. On this view, a theory is a single claim about the world. If the ontology (e.g., "ether exists") is false, the theory is false. Confirmation holism (Quinean) supports this: you can't test individual parts in isolation, so you can't credit individual parts with truth.
  *   **The Realist (Divide-and-Conquer)** treats a theory as a **modular structure**. On this view, a theory is a bundle of claims, some structural/mathematical, some ontological/interpretive. They believe truth can be localized to specific modules (the equations) even if the packaging (the "luminiferous" nature of the ether) is wrong.

  **It is also two separate questions running under one heading:**
  1.  **The Predictive Question:** Will future scientists assert that our current central claims are *false*? (PMI says Yes; Realists say "Technically yes, but...")
  2.  **The Continuity Question:** Will future scientists assert that our current central claims were *vacuous*? (PMI says Yes; Realists say No).

  The debate loops because the Realist answers Question 2 to dodge Question 1, while the Anti-Realist insists Question 1 invalidates the answer to Question 2.

  ### 2. The Actual Blockage: The Prospective Identification Problem
  You noted that the core/periphery distinction is defined *post-hoc*. This is the fatal flaw, known as the **Prospective Identification Problem**.

  *   **The Realist Claim:** "We should believe the structural core, not the ontological periphery."
  *   **The Anti-Realist Counter:** "Tell me *now*, before the next revolution, which is which."

  If the realist cannot provide an algorithm or principle to distinguish core from periphery *prior* to theory change, their position is not a guide to belief; it is a description of survival. It reduces to: "Believe the parts that turn out to be true." This is tautological.

  **The Substantive Blockage:**
  The blockage is not just about history; it is about **reference preservation**.
  *   **Anti-Realist View of Reference:** Reference is descriptive. If the description ("incompressible fluid filling space") is wrong, the term ("ether") refers to nothing. Therefore, the theory was empty.
  *   **Realist View of Reference:** Reference is causal/historical. The term ("ether") latched onto a real phenomenon (electromagnetic fields/spacetime metric) even if the description was flawed. Therefore, the theory was partially true.

  They cannot resolve this because they disagree on the metaphysics of language. There is no empirical test to settle whether "phlogiston" referred to nothing or referred to "negative oxygen."

  ### 3. Why the "Failure Mode" Taxonomy Doesn't Fix It
  You suggested a taxonomy of theory-revision failure modes. The problem is that both sides agree on the history but disagree on the **topology of theory space**.

  *   **PMI Topology:** Theory change is **discontinuous**. New theories replace old ones (incommensurability).
  *   **Realist Topology:** Theory change is **continuous**. New theories reduce old ones as limiting cases (correspondence principle).

  If you view Newtonian mechanics as *false*, PMI wins. If you view it as a *low-velocity limit* of Relativity, Realism wins. The debate stalls because there is no neutral ground to decide whether "limiting case" counts as "truth preservation." The Anti-Realist says a limit case is still a falsification of the original ontology; the Realist says it's a refinement of the original structure.

  ### 4. What Would Count as Progress?
  Since a sharp formal line between core and periphery is likely impossible (due to confirmation holism), progress requires dissolving the binary framework that creates the loop.

  **A. Abandon Binary Truth for Verisimilitude (Truth-likeness)**
  The debate assumes a theory is either True or False. Progress requires a metric of **distance**.
  *   Instead of asking "Is the ether real?", ask "What is the distance between the ether model's predictions and the field model's predictions?"
  *   If we can formalize a metric where Theory B is "closer to the truth" than Theory A without being "True," the PMI loses its bite. The graveyard isn't full of *false* theories; it's full of *less accurate* approximations.
  *   *Progress condition:* A formal account of verisimilitude that doesn't collapse into "truth." (Popper tried and failed; modern attempts use similarity spaces).

  **B. Adopt an "Effective Theory" Framework**
  This is the physicist's solution. Stop asking if a theory is "fundamentally true." Ask if it is **effective within a domain**.
  *   Phlogiston wasn't "false"; it was an effective theory for combustion within a specific domain of observation, lacking the resolution to detect mass changes in gases.
  *   *Progress condition:* Reframing realism not as belief in entities, but as belief in the **stability of domains**. The debate ends when we admit we aren't looking for The Final Theory, but for stable effective field theories.

  **C. Shift from "Belief" to "Stance"**
  If the blockage is epistemic (we can't know what to believe), move to pragmatism.
  *   Realism isn't a conclusion derived from history; it's a **policy** for doing science. You *act as if* the entities are real because it generates better heuristics for new discoveries.
  *   *Progress condition:* Acknowledging that PMI is an epistemic warning, but Realism is a methodological necessity. They aren't contradicting each other; they are answering "Can we know?" (No) vs. "How should we work?" (As if yes).

  ### Summary Diagnosis
  The debate never dies because it is a **category error**.
  *   **PMI** is an epistemological argument about the reliability of induction.
  *   **Realism** is a metaphysical argument about the structure of reference.

  They talk past each other. The Realist says, "We kept the structure." The Anti-Realist says, "Structure without ontology is just math, not science."

  **To break the loop:** You must reject the idea that there is a static "core" waiting to be found. The "core" is created by the successor theory. Therefore, realism cannot be a justification for *current* belief, only a description of *historical* continuity. If you accept that, the PMI becomes a warning against dogmatism, not an argument against reality.
