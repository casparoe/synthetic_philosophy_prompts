answer: |-
  **Adversarial Collaboration: The Neolithic Transition**
  **Students:** [Your Name] & Maya
  **Class:** World History (Mr. Espinoza)
  **Date:** [Due Date]

  ### 1. Joint Claims
  *We both sign off on the following factual premises. These are not up for debate in this project.*

  1.  **Health Decline:** Osteo-archaeological data confirms that early agricultural populations showed increased markers of stress (enamel hypoplasia), infectious disease, and reduced average height compared to preceding forager populations in the same regions.
  2.  **Population Capacity:** Agriculture supports a significantly higher population density per square kilometer than foraging.
  3.  **Inequality Correlation:** The ability to stockpile grain correlates chronologically with the emergence of distinct social hierarchies, inherited wealth, and centralized authority (kings/states).
  4.  **Constraint:** Neither side believes individuals in 9000 BCE sat down and "voted" on the Neolithic Revolution. The transition was driven by environmental and demographic pressures, not a policy meeting.
  5.  **Irreversibility:** Once agriculture was adopted in a region, populations rarely returned to full-time foraging without external collapse or displacement.

  ---

  ### 2. Table of Disagreements
  *Per Mr. Espinoza's rule: No neutral summaries. Below, we state the same disagreement in the specific language each of us uses.*

  | Topic | [Your Name]'s Wording (The "Disaster" View) | Maya's Wording (The "Inevitability" View) |
  | :--- | :--- | :--- |
  | **The Trade-Off** | "We traded health and freedom for the ability to hoard resources and create bosses." | "We traded individual health for species resilience and the capacity for complex culture." |
  | **Agency** | "People were trapped by a system that required more work to feed more kids, who then needed more food." | "People were pushed by demographics; once you start relying on grain, you can't go back without starving." |
  | **The 'Mistake' Label** | "An outcome is a mistake if the average person's life quality drops, regardless of population size." | "An outcome is only a mistake if there was a viable alternative that preserved the population." |
  | **Affluence** | "Affluence is having few wants that are easily satisfied (leisure/health)." | "Affluence is having the security and surplus to survive crises and build medicine." |

  ---

  ### 3. Cruxes & Predictions
  *These are the specific points where, if the evidence came out differently, one of us would have to change our mind. We have written our predictions **before** checking the specific data points listed.*

  **Crux A: The Two Valleys Case (Timing vs. Essence)**
  *   **The Case:** Two identical valleys. Valley A adopts farming 9000 BCE. Valley B maintains foraging until 1500 CE, then is conquered and forced to farm.
  *   **The Question:** Is the "disaster" the *transition* itself, or the *end state* of agriculture?
  *   **Evidence to Check:** Comparative osteo-archaeology of late-foraging populations (e.g., pre-contact North America or late hunter-gatherers in Europe) vs. early agriculturalists.
  *   **[Your Name] Prediction:** Valley B foragers will show better bone density and fewer cavities than Valley A farmers *right up until the moment of conquest*. This proves farming itself is the variable that hurts health.
  *   **Maya Prediction:** Valley B foragers will show higher rates of trauma from inter-group violence and higher infant mortality due to lack of surplus medicine. This proves their "health" was fragile and unsustainable.

  **Crux B: The Reversion Case (Maya's Test)**
  *   **The Case:** A community that practiced farming abandons it and returns to foraging for multiple generations (e.g., Great Basin Numic speakers or specific post-Roman groups).
  *   **The Question:** If farming is a trap, does leaving it improve life?
  *   **Evidence to Check:** Health markers and leisure estimates in the "reverted" population compared to their farming ancestors.
  *   **[Your Name] Prediction:** The reverted group will show increased average height and reduced infectious disease load.
  *   **Maya Prediction:** The reverted group will show a population crash and increased vulnerability to conquest by neighboring farming states, proving the "reversion" is a dead end.

  **Crux C: The Population Ethics (Fact vs. Value)**
  *   **The Case:** The correlation between agricultural surplus and the emergence of specialized non-farming roles (doctors, scribes, engineers).
  *   **The Question:** Can you have the "good stuff" (medicine/writing) without the "bad stuff" (inequality/sickness)?
  *   **Evidence to Check:** Historical records of early specialists. Did the first scribes/doctors appear *before* or *after* clear class stratification?
  *   **[Your Name] Prediction:** Stratification came first. The "bosses" hoarded the surplus and *then* hired the doctors. The inequality caused the medicine, not the other way around.
  *   **Maya Prediction:** You cannot separate them. The surplus that feeds the doctor *is* the inequality. You can't have the cure without the system that created the disease.

  ---

  ### 4. Semantic Disagreements
  *Mr. Espinoza asked us to identify if we are fighting over words. We are.*

  1.  **"Mistake":**
      *   **Why it's semantic:** [Your Name] defines "mistake" as **Outcome-Based** (Result = Bad). Maya defines "mistake" as **Process-Based** (Could we have chosen otherwise?).
      *   **Resolution:** We agree to use the phrase "Net Negative Outcome" for [Your Name]'s argument and "Demographic Inevitability" for Maya's argument to avoid arguing about the word "mistake."

  2.  **"Affluence":**
      *   **Why it's semantic:** We are using the Sahlins "Original Affluent Society" definition differently. [Your Name] focuses on **Time Budget** (hours worked). Maya focuses on **Risk Buffer** (calories in storage).
      *   **Resolution:** We will specify "Leisure Affluence" vs. "Security Affluence" in the presentation.

  3.  **"Forced":**
      *   **Why it's semantic:** [Your Name] means "Coerced by social structure." Maya means "Coerced by biology/math."
      *   **Resolution:** We acknowledge that both are forms of coercion, just on different timelines.

  ---

  **Signatures:**

  _________________________ ( [Your Name] )
  *Position: The transition reduced average individual well-being.*

  _________________________ ( Maya )
  *Position: The transition was necessary for total species survival.*
