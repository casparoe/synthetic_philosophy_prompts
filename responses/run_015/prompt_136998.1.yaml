          *   *Topic 2: Agency/Choice.* User: "It was a trap." Maya: "It was a constraint."
          *   *Topic 3: The 'Mistake' Label.* User: "A mistake is a bad outcome." Maya: "A mistake requires an alternative possibility."
          *   *Refining Wording:* Make it punchy. "We claim..." vs "We maintain..."

      *   **Section 3: Cruxes (The "Two Valleys" & "Reversion" & "Population").**
          *   *Crux 1: The Two Valleys (Timing vs. Essence).*
              *   Case: Valley A (Early Farm) vs. Valley B (Late Farm/Forage).
              *   User Prediction: Valley B foragers are healthier/happier until the moment of conquest.
              *   Maya Prediction: Valley B foragers are living on borrowed time; their 'health' is fragile and limits potential.
              *   Evidence: Comparative osteo-archaeology of late foragers vs. early farmers.
          *   *Crux 2: The Reversion Case.*
              *   Case: A group abandons farming (e.g., Great Basin or specific historical instances).
              *   User Prediction: Health markers improve, leisure time increases.
              *   Maya Prediction: Population crashes, vulnerability to external threat increases, 'standard of living' drops in terms of security.
          *   *Crux 3: The Population Ethics (The "So-So Lives" problem).*
              *   Case: Is a world with 8 billion "meh" lives better than 10 million "great" lives?
              *   User Prediction: Ethical metric should be *average* well-being.
              *   Maya Prediction: Ethical metric should be *total* existence/capacity.
              *   *Note:* This is partly values, but needs to be framed as a checkable premise if possible (e.g., does high population *require* farming? Yes, biologically). Let's focus the crux on whether the trade-off was *necessary* for the good stuff (medicine/writing).

      *   **Section 4: Semantic Disagreements.**
          *   "Affluence": User = Leisure/Health. Maya = Security/Potential.
          *   "Mistake": User = Bad Outcome. Maya = Avoidable Error.
          *   "Forced": User = Structural Trap. Maya = Demographic Inevitability.

  4.  **Review against Constraints:**
