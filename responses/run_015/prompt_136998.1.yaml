      *   **Section 3: Cruxes.** The pivot points. If resolved, the debate shifts. Needs a specific test/case and *predictions* from both sides before looking at the answer.
      *   **Section 4: Semantic/Verbal Disagreements.** Where are they fighting over definitions (e.g., "affluence," "mistake")?
      *   **Integration:** Must use the "Two Valleys" case, the "Reversion Case," and the "Population Ethics" issue.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to sound official but student-made. "Adversarial Collaboration: The Neolithic Transition."
      *   **Signatories:** User & Maya.

      *   **Section 1: Joint Claims.**
