      *(Self-Correction during drafting)*: Make sure the "Two Valleys" case is clearly defined as requested. The user invented it, so I need to make sure it's presented as *our* joint thought experiment.
      Make sure the "Reversion" case is Maya's contribution acknowledged in the text.
