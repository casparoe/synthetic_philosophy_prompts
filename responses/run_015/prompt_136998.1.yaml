      *   **Specific Constraints:** Must incorporate the "Two Valleys" thought experiment (Valley A farms 9000 BCE, Valley B forages until 1500 CE). Must incorporate Maya's "Reversion Case" (farmers giving up farming). Must address the "Population vs. Quality of Life" ethical/factual crux.
      *   **Tone:** Authentic to two stubborn 17-year-olds. No fluff. Something both can sign without feeling tricked.
      *   **Deadline:** Friday (Presentation is 6 mins).

  2.  **Deconstruct the Content Requirements:**

