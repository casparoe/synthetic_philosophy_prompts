answer: |-
  Here is a principle constructed to fit the architecture of your intuitions. It isn't a standard label from the literature, but a synthesis of the constraints your cases impose.

  ### The Principle: Localized, Independent Defeat

  **Higher-order evidence (HOE) mandates a reduction in confidence if and only if it identifies a *specific, contingent* liability in the current reasoning process, sourced from a channel that is *verified as competent* and *independent* of that liability.**

  Let's break down the three filters this principle applies to your cases:
  1.  **Specificity:** Is the problem with *this* reasoning token (e.g., I'm tired now), or with reasoning *as such* (e.g., logic is unreliable)?
  2.  **Verified Competence:** Does the source of the HOE have a track record that justifies trust (e.g., a respected expert), or is it unverified noise (e.g., online mob)?
  3.  **Independence:** Does accepting the HOE undermine the very faculties needed to process the HOE (e.g., global skepticism)?

  ---

  ### How the Principle Maps Your Cases

  **1. The 30-Hour All-Nighter (Case 1)**
  *   **Verdict:** **Fits.**
  *   **Why:** The liability is *specific* (fatigue right now, not always) and *contingent*. The source of the HOE (knowing how long you've been awake) is *independent* of the math faculty.
  *   **Result:** Strong downgrade.

  **2. The Respected Expert (Case 2)**
  *   **Verdict:** **Fits.**
  *   **Why:** The source has *verified competence*. The disagreement is *specific* to this calculation. It is *independent* of your current mental state.
  *   **Result:** Moderate downgrade (you weigh your first-order evidence against their verified track record).

  **3. The Thousand People Online (Case 3)**
  *   **Verdict:** **Fits (with a caveat).**
  *   **Why:** This explains why they move you less than the expert. They lack *verified competence* and likely lack *independence* (herding behavior). Raw numbers without verified independence do not pass the filter.
  *   **Result:** Barely moves you. (Note: If you *knew* they were independent competent calculators, the principle would force you to revise this intuition, but given "online people," your gut holds).

  **4. The Drunk Guy (Case 4)**
  *   **Verdict:** **Fits.**
  *   **Why:** Fails *Verified Competence*. The content of the testimony ("you're drunk") undermines the reliability of the testifier.
  *   **Result:** Does nothing.

  **5. Global Unreliability (Case 5)**
  *   **Verdict:** **Fits.**
  *   **Why:** Fails *Specificity* and *Independence*. If reasoning is unreliable "full stop," you cannot use reasoning to process that doubt. It pulls the rug out from under the evaluation itself.
  *   **Result:** Does nothing (because it *cannot* do anything).

  **6. The Overcorrection Study (Case 6)**
  *   **Verdict:** **Fits.**
  *   **Why:** This is a self-referential HOE. The study says "people overcorrect." If you correct for the bias, are you overcorrecting? The HOE applies to itself.
  *   **Result:** The principle suggests a "net zero" or minimal adjustment. You acknowledge the risk but cannot apply a standard discount without risking the error the study warns about.

  **7. The Email Sent Before (Case 7)**
  *   **Verdict:** **Fits.**
  *   **Why:** This distinguishes *Belief Norms* from *Action Norms*. Belief aims at truth (must update with new HOE). Action aims at utility (sunk costs make redoing the email costly).
  *   **Result:** Confidence drops (truth-tracking), action stands (utility-tracking).

  **8. The Akratic Believer (Case 8)**
  *   **Verdict:** **Forces Revision.**
  *   **Why:** If the HOE passes the three filters (Specific, Verified, Independent), the principle says confidence *must* drop. To believe at full strength while acknowledging valid defeat is irrational.
  *   **Result:** You must drop the idea that this is "sensible." It is a psychological failure, not an epistemic option.

  ---

  ### The Hard Case: The Field-Wide Training Error

  *The Scenario:* You learn everyone in your field, including the expert from Case 2, was trained to make exactly the mistake you just made. There is no external appeal.

  **Analysis under the Principle:**
  This case breaks the **Verified Competence** filter.
  *   In Case 2, the expert was a check *against* your error.
  *   In this Hard Case, the expert is *contaminated* by the same error.
  *   However, it passes the **Specificity** filter (it's your field's training, not all human reasoning).

  **The Verdict:**
  This behaves like **Case 1 (The All-Nighter)**, but harder.
  *   In Case 1, your *brain* was impaired. Here, your *tools* are impaired.
  *   Because the "Expert" channel is poisoned, you cannot defer.
  *   Because it is not "Global Unreliability" (Case 5), you are not paralyzed. You still have access to first principles (logic, raw data, math) that exist outside the field's training.

  **What you should do:**
  You must attempt to re-derive the result from **First Principles** without using the field's standard heuristics or trained intuitions.
  *   If you can derive "47" using only basic logic/math that isn't part of the "training," the HOE loses force (you have bypassed the liability).
  *   If the result *depends* on the trained intuition you can't verify, you must **suspend judgment**. You cannot treat this like Case 5 (ignore it), because the error is specific to the field, not reasoning itself. But you cannot treat it like Case 2 (defer to expert), because the expert is compromised.

  ---

  ### Summary of Required Revisions

  To keep this principle, here is where your gut needs to be calibrated:

  1.  **Akrasia (Case 8):** You cannot claim it is "sensible" to believe fully while acknowledging valid higher-order defeat. The principle dictates that valid HOE *constitutes* a reason to lower confidence. If you don't lower it, you are irrational, even if you can't help it.
  2.  **The Online Mob (Case 3):** Your intuition is safe *only if* you assume the mob lacks independence/competence. If you were given evidence that the 1,000 people were independent and competent, the principle forces you to value them *more* than the single expert.
  3.  **The Hard Case:** It is not Case 5 (Global Skepticism). It is a "Poisoned Tool" scenario. It requires you to abandon expert deference and retreat to first-principles reasoning. If you can't do that, you must suspend, not persist.

  **The One Sentence Takeaway:**
  Higher-order evidence only binds you when it points to a local glitch in your current process using a reliable meter that isn't itself broken by that glitch.
