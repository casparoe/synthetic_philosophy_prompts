  **Scenario**
  In a university chemistry laboratory, a novice researcher (the subject) visually inspects a beaker containing a clear, colorless liquid and forms the determinate cognition "This is water" (*idam apah*), based on standard sensory contact with the liquid's clarity and fluidity. Simultaneously, the Department Head—an established *āpta* whose expertise in chemical identification is unquestioned and who has just verified the substance via titration—issues the testimonial statement "This is hydrochloric acid" (*idam amlam*). The lighting is perfect, the subject's vision is 20/20, and the Head has no motive to deceive; the liquid possesses the visual universals (*sāmānya*) of water perfectly, yet possesses the chemical nature of acid. The subject stands with two cognitions regarding the same substrate: a perceptual judgment of identity ("Water") and a testimonial judgment of identity ("Acid").

  **Nyāya Analysis**
  In Nyāya epistemology, this setup presents an apparent *pramāṇa-virodha* (conflict of instruments). The perceptual cognition yields *savikalpaka-pratyakṣa* (determinate perception), claiming sense-object contact (*indriyārtha-sannikarṣa*) qualified by the universal "waterness." The testimonial cognition yields *śabda-pramāṇa*, deriving from the *āpta's* valid knowledge and truthful communication. However, Nyāya ontology dictates that valid knowledge (*pramā*) must correspond to reality (*yathārtha*); two contradictory truths cannot coexist. The school's conflict-resolution principle (*virodha-parihāra*) invokes an asymmetry based on the object's accessibility: for empirical (*laukika*) objects, *pratyakṣa* is generally stronger than *śabda*, *unless* the perception is suspected of error (*doṣa*). Here, since the liquid is chemically acid, the perceptual cognition "This is water" is factually false (*viparyaya*). Nyāya resolves this not by rejecting testimony, but by re-evaluating the perception: the sense contact was real (contact with the liquid), but the qualifying universal ("waterness") was erroneously superimposed due to similarity (*sādṛśya*). The verdict is that *śabda* prevails regarding the specific identity, forcing the rejection of the perceptual judgment as *apramā* (invalid), while preserving the validity of the sensory contact itself.

  **The Honest Part**
  The single feature doing the work in this scenario is **similarity (*sādṛśya*)** between the empirical markers of the two substances. If you remove this feature—i.e., if the acid looked visibly distinct from water—the perceptual cognition would not have arisen as "water," and the collision vanishes into a trivial confirmation. The case relies entirely on the perceptual cues being insufficient to distinguish the specific universal (*viśeṣa*), which allows the *āpta's* testimony to act as the corrective. Without this similarity, you collapse back into the default "perception beats unreliable testimony" scenario, because if the liquid looked like acid, perception would agree with testimony, and if it looked like neither, there would be no determinate perceptual claim to contradict the testimony. The "conflict" is engineered solely on the gap between appearance (*pratīti*) and reality (*tattva*), which Nyāya treats as a defect in the *judgment* phase of perception, not the sensory contact itself.

  **Testing the Deflationary Reading**
  The deflationary reading claims that the testimony retroactively proves the perception was never determinate (*savikalpaka*) but merely indeterminate (*nirvikalpaka*)—i.e., you only perceived "something liquid" and your mind added "water." This reading **genuinely dissolves the *pramāṇa-virodha*** but relocates the problem to the domain of memory (*smṛti*) and synthesis (*vikalpa*). In Nyāya, *nirvikalpaka* perception is non-propositional and cannot be false; error only enters at the *savikalpaka* stage when universals are predicated. By accepting the deflationary reading, you concede that *pratyakṣa* (as a *pramāṇa*) never actually produced the cognition "This is water"; rather, *pratyakṣa* produced "This-ness" and *smṛti* produced "water-ness." This saves the infallibility of the *pramāṇas* (since neither produced a contradiction) but violates your constraint that the perception be "fully determinate." To make the scenario survive this reading while keeping the perception determinate, you would have to change the object to a **supersensible (*atīndriya*) entity** (e.g., "This act is Dharma"). In that case, perception cannot validly be determinate about the moral quality at all, so testimony wins without implying perceptual error, but this violates your "realistic/no exotic" constraint. Thus, within your empirical constraints, the deflationary reading is the only theoretically consistent Nyāya solution, even if it means admitting the "determinate perception" was technically a hybrid of perception and memory.
