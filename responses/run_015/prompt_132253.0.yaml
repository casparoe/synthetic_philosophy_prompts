  **What I give up:** By choosing this, I give up the hope that there is a purely formal, value-neutral "safety switch" based on impact. I concede that safety requires substantive judgments about what matters (predators, stability, reversibility) encoded in the baseline and auxiliary set. There is no free lunch.

  ***

  **1. Disciplined Mapping**

  *   **Principal:** The Queensland Bureau of Sugar Experiment Stations (institutional agent).
  *   **Deployment:** Physical release of *Bufo marinus* into the wild.
  *   **Specified Objective:** Reduce beetle larvae density to increase cane yield.
  *   **Environment:** Queensland agricultural zone + adjacent native ecosystems.
  *   **Inaction Baseline:** This is the whole ballgame. A low-impact measure requires the **"No Release" baseline** (counterfactual world where the toads remain in containment).
      *   If the baseline is "Continued use of existing control methods," the measure compares toads vs. pesticides. If toads are cheaper and equally effective, impact looks low.
      *   If the baseline is "No Release," the measure compares toads vs. status quo ecosystem. Here, the introduction of a new self-replicating agent is massive divergence.
      *   *Technical Detail vs. Ballgame:* It is the ballgame. Choosing "No Release" privileges the pre-intervention ecosystem state as the reference class for "normal." Choosing "Existing Methods" privileges agricultural output stability. The choice dictates whether the intervention is flagged as high-impact before a single predator dies.

  **2. Running Specific Measures**

  *   **Baseline-Relative State/Reachability:** This measures the distance between the actual state and the baseline state (or the difference in reachable states).
      *   *Flags:* It flags the immediate presence of toad biomass and the displacement of native biomass.
      *   *Misses:* It misses the *dynamic* trajectory until the state divergence becomes large. In year 1, toad biomass is low; penalty is low. By year 10, divergence is huge. It fails to penalize the *rate* of divergence early enough.
      *   *False Positives:* It might forbid the action entirely if *any* change is penalized heavily. If the measure cannot distinguish "beneficial intervention" (beetles down) from "side effect" (predators down), it degenerates into paralysis. It sees "change," not "damage."
  *   **Attainable Utility Preservation (AUP):** This penalizes changes in the agent's ability to optimize a bank of auxiliary reward functions.
      *   *Flags:* If "native predator population" is an auxiliary function, AUP flags the release immediately because the toads reduce the attainable utility of that function (predators die, so you can't optimize for them).
      *   *Misses:* If the auxiliary set contains only agricultural metrics (cane height, beetle count), AUP sees the release as *positive* or neutral (beetles down, cane up). It misses the externalized harm completely.
      *   *Verdict:* This confirms your suspicion. AUP does not avoid value specification; it distributes it across the auxiliary set. If the set is incomplete, the measure is blind to harms outside the set.

  **3. Engaging the Taxonomy**

  Your taxonomy survives scrutiny, but it reveals the limits of impact measures.

  *   **Option Loss:** Baseline measures get purchase here. By penalizing divergence from the "No Release" baseline, they implicitly penalize irreversibility. If you can't return to the baseline state, the distance remains large. This works without knowing *why* the state matters, only that it changed.
  *   **Externalized Harm:** Measures get essentially zero purchase here without value content. As seen in the AUP case, harm is only flagged if the harmed entity is represented in the state vector or auxiliary set. If "quoll survival" is not a variable, the quoll's death is not an impact, it is invisible noise.
  *   **Feedback Corruption:** Measures are structurally blind here. Impact measures quantify change in the world-state $S$. They do not quantify change in the principal's epistemic access to $S$. If the toads make monitoring harder (e.g., by killing the monitors or confusing the data), standard impact measures do not register this unless "monitoring fidelity" is explicitly state-tracked.
  *   **Replacement:** I would not patch this; I would elevate **Epistemic Integrity** to a fourth category. Impact measures assume the observer survives to measure the impact. If the intervention degrades the observer, the measure fails. This is not a side effect; it is a system failure.

  **4. The Release-Action Problem**

  You have identified a structural flaw: standard impact measures assume bounded agency over a fixed horizon. A self-replicating population introduces unbounded divergence.

  *   **The Failure:** A penalty computed over a fixed horizon (e.g., 5 years) will systematically underestimate the damage. The toad population grows exponentially; the damage is in the tail. Discounting makes the tail negligible.
  *   **Natural Repair?** There is no clean formal repair within standard Markov Decision Process frameworks.
      *   *Discounted Infinite-Horizon:* Still hides tail risks if the discount factor is too high.
      *   *Dynamics Penalty:* Penalizing change in the *transition function* rather than the state. If the release changes the equations of motion (adds a new reproductive term), that is a deeper impact than a state change. But identifying "equations of motion" requires semantic understanding of physics/biology, not just state vectors.
      *   *Irreversible Category:* Treating "release of self-replicators" as a special class requiring higher thresholds. This admits that the general framework is insufficient.
  *   **Implication:** The framework presupposes that agency stays where you put it. It is built for one-shot optimizers or bounded processes. It breaks when the agent spawns new agents (or populations) that persist beyond the original control horizon.

  **5. Adjudicating the Readings**

  *   **Steelman: Irreducible Ignorance.** In 1935, ecology was nascent. The concept of "invasive species dynamics" was not well-formed. The agents lacked the conceptual vocabulary to model the divergence. No measure, however sophisticated, can flag a risk it cannot represent. If the world-model lacks a variable for "predator toxicity," the measure is mathematically incapable of objecting. On this reading, impact measures are worthless ex ante under deep uncertainty; they are only retrospective tools or conservatism devices for known risks.
  *   **Counter: Foreseeable-but-Unmodelled.** Toxicity was known. The niche mismatch (ground beetle vs. cane borer) was plausible. The risk was not *unknown*, it was *unvalued*. The decision-makers valued cane yield; they did not value the native predators. A measure with the right auxiliary set (including predators) would have objected.
  *   **Adjudication:** The facts support **Foreseeable-but-Unmodelled**. The toxicity was stipulated as known. The failure was not a lack of data, but a lack of *inclusive modeling*. The decision-makers did not need better impact measures; they needed a broader principal definition (ecosystem vs. cane farm).
  *   **Implication for Research:** Low-impact work is a good use of time *only if* paired with robust world-modeling and value elicitation. If researchers treat impact measures as a substitute for understanding what matters, they are building a speedometer for a car with no brakes. The value is in forcing the explicit enumeration of auxiliary functions, revealing what is being ignored.

  **6. The Analogy Break**

  *   **The Break:** A toad population is not an optimizer pursuing a proxy. It is a biological process subject to selection. It does not "game" the impact measure; it simply exists. AI alignment fears *optimization pressure* driving the agent into adversarial corners. Toads do not optimize against us; they just outcompete.
  *   **Undercutting Evidence:** This undercuts the case as evidence about *specification gaming*. Impact measures were designed to stop an optimizer from breaking things to win. Toads break things to live. The failure mode is different: it is **deployment risk**, not **alignment failure**.
  *   **Rehabilitation:** The analogy rehabilitates if we view advanced AI not as a tool but as a **released process**. If an AI system modifies its own code, spawns sub-agents, or operates continuously in the world (online learning), it becomes more like a population than a one-shot optimizer. It persists, adapts, and diverges from the initial configuration. In this regime, the "release-action problem" dominates. The risk is not that the AI misunderstands the goal, but that the *process itself* becomes uncontrollable and divergent.
  *   **Conclusion:** The cane toad case is not a metaphor for reward hacking. It is a metaphor for **irreversible deployment of adaptive systems**. Impact measures fail here not because the agent is too smart, but because the system is too open.
