answer: |-
  You have identified a structural flaw in reasoning that is distinct from standard pseudoscience, yet shares its epistemic emptiness. You are correct that terms like "unfalsifiable" or "confirmation bias" are too blunt. They describe the *status* of the claim or the *psychology* of the believer, but not the *architecture* of the argument itself.

  Here is the carving you are looking for, broken down by your four questions.

  ### 1. Naming the Phenomenon

  There is no single Latinate term that captures this exactly, but in the philosophy of science and evidence, this structure is best described as **Fungible Evidential Support** operating within a **Degenerate Research Programme**.

  The specific failure of the argument is a **Failure of Consilience**.

  *   **Fungible Evidence:** This addresses your "lightbulb" observation. In a robust argument, evidence is *load-bearing*. If you remove a keystone, the arch falls. In the arguments you describe, evidence is *disposable*. The specific claim (the map, the stone, the date) does not matter; only its function as a "token of weirdness" matters. When one token is invalidated, it is swapped for another of equal value. This is not "self-sealing" in the traditional sense (where the theory is modified to absorb the blow); it is **immunization by redundancy**. The theory is insulated not by complexity, but by the replaceability of its parts.
  *   **Failure of Consilience:** This addresses your "coherence" observation. The term comes from William Whewell (1840), who argued that for evidence to confirm a theory, it must not merely accumulate; it must *converge*. Different lines of evidence should "jump together" because they are all consequences of a single underlying cause. In your examples, the evidence does not converge; it merely aggregates. A map anomaly and a megalith alignment do not explain each other; they only point to the same label ("Atlantis," "Aliens").

  If you need a phrase for print, **"The Fallacy of Cumulative Anomalies"** is precise. It signals that the argument relies on piling up unexplained things rather than explaining how they connect.

  ### 2. The Logical and Probabilistic Error

  You asked why the inference from "many weak, unrelated items" fails. The error is probabilistic, specifically regarding the **Likelihood Ratio**.

  In Bayesian terms, evidence $E$ supports hypothesis $H$ only if $E$ is more probable given $H$ than given $\neg H$ (not-H).
  $$ \text{Support} = \frac{P(E|H)}{P(E|\neg H)} $$

  In legitimate science, we look for evidence where $P(E|H)$ is high and $P(E|\neg H)$ is low.
  In the arguments you describe, the proponents focus entirely on the numerator ($P(E|H)$). They argue, "If aliens built this, wouldn't we expect weird stones?" (Yes, we would).

  They ignore the denominator ($P(E|\neg H)$). The critical question is: "If ordinary humans built this over 3,000 years, how likely is it that we would find *some* stones that look weird, *some* maps that are inaccurate, and *some* king lists that are contradictory?"

  The answer is: **Very likely.**

  *   **The Independence Trap:** Proponents argue that because the items are unrelated (a map is unrelated to a stone), the probabilities multiply, making the coincidence astronomically unlikely. This is false. For probabilities to multiply, the items must be independent *under the null hypothesis*. They are not. Under the null hypothesis ("History is messy, records degrade, humans make mistakes"), anomalies are *expected* to cluster. Finding one anomaly increases the probability that you are looking in a "noisy" area where you will find more. They are not independent surprises; they are correlated noise.
  *   **The Variety of Evidence Thesis:** Philosophers of science (such as Wayne Horwich) have shown that "variety" confirms a theory only if the evidence tests *different implications* of that theory. If a theory implies $A$, $B$, and $C$, and you find $A$, $B$, and $C$, you have strong confirmation. But if the theory implies only "Weird Stuff Will Happen," and you find "Weird Stuff $1$", "Weird Stuff $2$", and "Weird Stuff $3$", you have not tested the theory. You have only tested the background noise of the world.

  The failure is not that the items are weak; it is that they are **non-diagnostic**. They do not distinguish the hypothesis from the background state of the world.

  ### 3. The Edges: Distinguishing from Legitimate History

  Detectives and historians *do* argue from scattered traces. The distinction lies in **Causal Integration** and **Generativity**.

  *   **Causal Integration (The Chain vs. The Pile):**
      *   **Legitimate History:** The evidence forms a causal chain. If a historian argues that a famine caused a migration, the archaeological evidence (soil samples), the textual evidence (letters about hunger), and the demographic evidence (population drop) must fit a *single mechanism*. If the soil samples show plenty of food, the hypothesis is in tension with the letters. The evidence constrains each other.
      *   **Fringe Argument:** The evidence forms a pile. The megalith claim does not constrain the map claim. If the map is debunked, the megalith claim does not need to adjust. There is no tension between the pieces of evidence because they are not connected to each other, only to the conclusion.
      *   **The Test:** Ask, *"If this specific piece of evidence were proven false, would it make the other pieces harder to believe?"* In legitimate history, the answer is yes (the web tightens). In fringe arguments, the answer is no (the bulbs are on separate circuits).

  *   **Generativity (The "Therefore, What?" Test):**
      *   **Legitimate History:** A hypothesis narrows the search space. If you believe the migration happened in 1200 BCE, you should look for specific pottery styles in specific regions. The hypothesis tells you where *not* to look.
      *   **Fringe Argument:** The hypothesis expands the search space to include everything. "Aliens" explains high technology, but also low technology (if they hid it). It explains accurate maps, but also inaccurate ones (if they were degraded). A hypothesis that is compatible with *any* outcome predicts *nothing*.
      *   **The Test:** Ask, *"What specific thing should we expect to find next that we would not expect if your theory were false?"* If the answer is "anything weird," the argument is structurally hollow.

  ### 4. Pseudoscience vs. Fringe History

  Is this different in kind from creationism or vaccine misinformation? Yes, in terms of **falsifiability**, but no, in terms of **epistemic utility**.

  *   **The Difference:** Creationism makes ontological claims about the world (the earth is 6,000 years old) that are, in principle, testable and falsifiable (they just happen to be false). The arguments you describe are **hermeneutic**. They are claims about *interpretation*, not physical reality. They argue that the *meaning* of the data is different, not necessarily the data itself. This makes them harder to pin down because they retreat into "you just don't understand the symbolism" or "the context is wrong" rather than "the radiocarbon date is wrong."
  *   **The Editors' Shrug:** The principled basis for your editors' reaction is **Non-Progressivity**.
      *   In the philosophy of science (Imre Lakatos), a research programme is "degenerating" if it spends all its energy explaining away anomalies rather than predicting new phenomena.
      *   Creationism is harmful because it actively contradicts biological reality.
      *   Fringe history is corrosive because it is **epistemically stagnant**. It produces no new knowledge. It does not open new archives, develop new dating methods, or generate new historical questions. It simply re-categorizes existing knowledge into a closed loop.
      *   The harm is less visible because it doesn't kill people, but it degrades the public's understanding of how historical knowledge is built. It suggests that history is a puzzle to be solved by "gotchas" rather than a narrative constructed through evidence, mechanism, and coherence.

  ### Summary for Print

  If you need to articulate this distinction in your magazine, you might frame it this way:

  > "The error here is not that the evidence is weak, but that it is **fungible**. In legitimate historical reasoning, evidence is load-bearing; if you remove a keystone, the arch falls. In these arguments, evidence is disposable; if one claim is debunked, it is swapped for another without affecting the conclusion. This creates an illusion of cumulative weight. But a thousand unconnected anomalies do not equal a theory. Without a causal mechanism that links the evidence to each other—not just to the conclusion—you do not have a case. You have a collection of coincidences."

  This avoids attacking the believer's intelligence and focuses entirely on the structural integrity of the argument, which is precisely where the flaw lies.
