prompt: |-
  So a friend and I have been going back and forth for months on the dust specks vs. torture thing — you know, would you rather one person be tortured for 50 years or 3^^^3 people get a dust speck in their eye for a split second. I'm on the side that says you prevent the torture (the dust specks just don't add up, no matter how many you stack), and he's on the side that says you prevent the dust specks (at some point the sheer number has to outweigh, otherwise you're saying there's a lexical threshold and that seems arbitrary). We've realised we're not actually making progress because we keep talking past each other about what "adding up" even means, whether the betterness relation is transitive across these scales, and whether our moral intuitions are even reliable when the numbers get that big.

  So we've decided to try an adversarial collaboration — actually sit down and produce a document we could both sign. I want you to draft that document. It should have a numbered section of claims we both agree on (about the structure of the problem, about what's at stake, about what kinds of considerations are relevant and which ones are red herrings), and then a disagreements table. In the table, for each point of disagreement, I want the wording of each side's position to be something that side would actually endorse — not a caricature. Then identify the cruxes: the sub-questions where, if one of us changed our mind, the whole dispute would shift. For each crux, give a test case or argument that both of us would agree bears on it, and write down what each of us predicts about it. If there's any part of our disagreement that you think is purely verbal — like maybe we're using "harm" in different ways — flag that too. I suspect one crux is about whether "barely noticeable" means "has zero moral weight" or just "has extremely tiny moral weight," and another is about whether our intuitions at these scales are even reliable — but I want to see what you come up with, and I'm prepared to be surprised about where the real cruxes are.
