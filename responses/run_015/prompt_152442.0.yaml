answer: |-
  Consequentialism's aim to maximize wellbeing mirrors the Bodhisattva vow to alleviate dukkha for all beings, while impartial weighing aligns with universal metta. However, a critical distortion arises: consequentialism judges acts by external outcomes, whereas Buddhism centers on cetana (intention); karma is ethical causation rooted in mind, not merely utility calculus. The Five Precepts function as training for skillful outcomes, yet Upaya allows flexibility without compromising compassion. Your "compound interest" view of karma fits samsara's long arc, where tiny acts ripple across rebirths, but Buddhism warns that calculating future merit fuels craving, trapping you in the very cycle you seek to escape. What has no place is aggregating happiness across separate selves, since anatta denies fixed individuals to hold that utility. This doesn't mean Buddhism is lacking; rather, consequentialism ignores the transformative effect of action on the actor. The leftover bits reveal consequentialism assumes a solid self maximizing pleasure, whereas Buddhism seeks extinguishing the craving that makes pleasure necessary. Thus, karma isn't cosmic accounting for total happiness, but a law of spiritual momentum toward liberation. The mismatch suggests consequentialism obscures the interiority of ethics, not that Buddhism fails to account for consequences.
