prompt: |-
  I sat on a university hiring committee this spring, and the experience left me puzzled about something I can't quite formulate. In the same week, all of us were required to complete the campus bias-training module — which argued, at length, that unstructured holistic judgments of a person's character are noisy, biased, and barely predictive of anything — and we were also asked to write third-year review letters assessing colleagues on "collegiality," and to sign a form certifying that a candidate is of "good moral character." Since then I keep seeing the same shape elsewhere: bar admission character-and-fitness questionnaires, security-clearance adjudications, reference letters, the way one old act of dishonesty is treated as revelatory of a person while an equally old act of violence gets written off as youthful indiscretion, and the way nearly all of these institutions also maintain some kind of rehabilitation window after which past conduct stops counting. It looks like every institution that judges character also trains its own members not to.

  I've been reading about the situationist critique of virtue ethics — the argument, drawn from social psychology, that behavior is driven mostly by features of situations rather than by stable global traits (the obedience experiments, the seminary students who hurried past a stranger slumped in a doorway when they were late), so that attributing robust character traits to people is a systematic error. Taken at face value, it makes my committee's practice look incoherent: we are trained not to make exactly the judgment we are then asked to certify. But I don't trust that reaction, and I'd rather have the implicit theory reconstructed properly than a verdict on whether the critique is true.

  So: what view of character do these practices actually presuppose? Do they strictly require global-trait realism of the sort the situationist denies, or would something much thinner do the work — only that conduct in one situation predicts conduct in relevantly similar ones, or that a person's history is evidence about how they will respond to the specific situations a role puts them in? Which rival views do they quietly rule out: thoroughgoing situationism, a local-traits-only view, a view on which character is a normative ideal or a regulative fiction rather than a psychological posit? Are their parts even consistent with one another — can one institution coherently treat single acts as revelatory, discount old ones, and honor a rehabilitation window, when each of those seems to assume something different about how stable character is and how diagnostic any given act is? Where, if anywhere, is the practice philosophically underdetermined, such that several quite different theories of character would license it equally well? And the case I actually care about: suppose a licensing board took the critique seriously and replaced its global "good moral character" finding with something situation-indexed — referees rate candidates only on specified domains ("admits their own mistakes when they'd gain from hiding them," "reliable under deadline pressure," "behaves similarly toward people with less power"), are explicitly told not to aggregate those ratings into any overall verdict, and must ignore conduct more than seven years old. Would that be a practice a situationist could endorse, or has the trait attribution merely moved one level down, into the domains? What would have to change institutionally for the reform to be real rather than cosmetic, and what would we give up?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Core Observation:** The user notices a contradiction in institutional practices: institutions train members *against* making holistic character judgments (citing bias/unreliability) but simultaneously *require* them to make exactly those judgments (collegiality, moral character, security clearances).
      *   **Philosophical Context:** The user references the *situationist critique of virtue ethics* (Doris, Harman, etc.), which argues behavior is situational, not trait-based.
      *   **The Task:** The user doesn't want a verdict on whether situationism is *true*. They want an analysis of the *implicit theory of character* presupposed by these institutional practices.
      *   **Specific Questions to Address:**
          1.  What view of character do these practices actually presuppose? (Global traits vs. thinner views).
          2.  Which rival views do they rule out? (Thoroughgoing situationism, local traits, normative ideals).
          3.  Are the parts consistent? (Single acts as revelatory vs. rehabilitation windows vs. stability).
          4.  Where is the practice philosophically underdetermined?
          5.  **The Crucial Case:** If a licensing board reforms to use situation-indexed ratings (no aggregation, time limits), would a situationist endorse it? What would have to change for it to be real vs. cosmetic? What would be given up?

  2.  **Initial Brainstorming & Conceptual Mapping:**

      *   *The Tension:* Bias training says "holistic judgment is bad." Hiring/Licensing says "judge their character."
      *   *Situationism:* Traits aren't robust. Behavior varies by context.
      *   *Institutional Practice:* It's not actually looking for Aristotelian *hexis* (stable state). It's looking for *risk management*.
      *   *The "Rehabilitation Window":* This implies change is possible (traits aren't fixed) but also stability (past predicts future within the window).
      *   *The "Single Act" vs. "Time Limit":* One lie ruins you (diagnostic), but old violence is forgiven (not diagnostic). This seems inconsistent unless the *type* of act matters more than the *trait* it reveals.
      *   *The Reform:* Domain-specific ratings without aggregation. This looks like "local traits." Does situationism allow local traits? Doris argues for "local" traits but is skeptical of *global* ones. So, narrow domains might pass, but "moral character" as a sum is the problem.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the sharpness of the observation. Validate that this isn't just bureaucracy; it's a philosophical tension. State the thesis: Institutions aren't committed to *Virtue Ethics* character; they are committed to *Actuarial* character.

      *   **1. The Implicit Theory: Actuarial Risk, Not Ontological Reality.**
          *   Institutions don't care if character is "real" in a metaphysical sense. They care if it's *predictive* for *their* purposes.
          *   The bias training targets *holistic intuition* (System 1). The hiring forms require *documented evidence* (System 2/Record).
          *   The theory isn't "Global Trait Realism." It's "Statistical Regularity in Specific Contexts."
          *   *Key Distinction:* They treat character as a *liability category*, not a psychological fact.

      *   **2. Consistency of the Parts (The Rehabilitation Window vs. Single Acts).**
          *   Why is one lie fatal but old violence forgivable?
          *   *Diagnosticity:* Dishonesty is seen as a direct predictor of institutional risk (fraud, liability). Violence is often seen as emotional/contingent.
          *   *Rehabilitation:* This acknowledges *plasticity*. It contradicts "fixed trait" views. It aligns more with a behavioral learning model.
          *   *Inconsistency:* Yes, there is tension. If traits are stable, why do they fade? If they fade, why is one act diagnostic?
          *   *Resolution:* The inconsistency is resolved by *interest*, not psychology. What serves the institution's risk profile?

      *   **3. Rival Views Ruled Out.**
          *   *Thoroughgoing Situationism:* Ruled out *in practice* (they act as if prediction is possible), but acknowledged *in training* (bias exists).
          *   *Global Trait Realism:* Actually *not* required. They don't need you to be virtuous everywhere, just in the role.
          *   *Normative Ideal:* They treat it descriptively (will they do X?), not normatively (are they good?).
          *   *Winner:* **Local Trait Regularity + Risk Assessment.**

      *   **4. The Reform Case (Situation-Indexed Ratings).**
          *   *Scenario:* Referees rate specific domains, no aggregation, 7-year limit.
          *   *Situationist Verdict:* A situationist (like John Doris) might accept *local* traits. "Honesty in financial reporting" is different from "Honesty at a party."
          *   *The Trap:* If the institution treats "Honesty in financial reporting" as a stable predictor across *all* financial contexts, they are still reifying a trait.
          *   *What needs to change:*
              1.  Stop calling it "Character." Call it "Behavioral History."
              2.  Focus on *systems* that prevent bad acts, not *people* who won't do them.
              3.  Acknowledge the prediction is probabilistic, not ontological.
          *   *What is given up:* The comfort of the "Good Person" heuristic. The ability to offload responsibility onto the individual ("We hired a good person, so if they fail, it's their fault, not our system").

      *   **5. Synthesis/Conclusion.**
          *   The contradiction exists because institutions want the *benefits* of trait attribution (prediction, liability shielding) without the *epistemic costs* (bias, inaccuracy).
          *   The reform is cosmetic if it still seeks to predict the future based on the past without changing the environment.
          *   Real change requires shifting from "screening people" to "designing situations."

  4.  **Refining the Tone:**

      *   The user is academically sophisticated (references situationist critique, virtue ethics, specific institutional mechanisms). The tone should be analytical, precise, and philosophically rigorous, avoiding oversimplification.
      *   Avoid taking a side on whether situationism is *true*. Focus on what the *practices* imply.
      *   Use terms like "actuarial," "diagnosticity," "reification," "ecological validity."

  5.  **Self-Correction/Nuance Check during Drafting:**

      *   *Check:* Did I answer the specific question about the 7-year window? *Adjustment:* Ensure I explain that the window implies plasticity, which contradicts strong trait realism but fits a risk-decay model.
      *   *Check:* Did I address the "bias training vs. hiring form" contradiction? *Adjustment:* Frame this as "System 1 vs. System 2" or "Intuition vs. Record." The training warns against *gut feeling*; the form asks for *evidence*. But the underlying assumption (that past predicts future) remains the same.
      *   *Check:* Is the distinction between "Global" and "Local" traits clear? *Adjustment:* Explicitly reference Doris's *Lack of Character*. Situationists allow local traits, just not global ones. The reform moves to local traits. Is that enough? Only if they don't aggregate.

  6.  **Final Polish:** Organize into clear headings. Ensure the conclusion ties back to the user's specific worry about "cosmetic vs. real" reform. (This thought process moves from understanding the core tension to mapping the philosophical landscape, then applying it to the specific hypothetical reform.)

  7.  *(Final thought before generating)*: Make sure to highlight that the "Good Moral Character" label is a *legal fiction* used for liability management, not a psychological claim. That's the key to dissolving the contradiction.

  8.  **Constructing the Output.** (Proceed to write the response following this structure.)
answer: |-
  This is a remarkably precise diagnosis of a structural incoherence that pervades modern institutional life. You have identified a friction between the *epistemology* of personnel selection (which has absorbed the social-psychological critique of intuition) and the *jurisprudence* of personnel selection (which remains rooted in liability management and folk psychology).

  To answer your core question: No, these practices do not presuppose global-trait realism of the sort Aristotelian virtue ethics requires. In fact, if they did, they would be far more consistent. The incoherence you sense arises because institutions are not trying to discover the truth about human psychology; they are trying to manage risk using whatever heuristic tools are legally defensible and cognitively available.

  Here is a reconstruction of the implicit theory of character at work in these practices, an analysis of their consistency, and an evaluation of your proposed reform.

  ### 1. The Implicit Theory: Actuarial Character, Not Ontological Character

  The bias training and the hiring forms are not operating on the same theory of character because they are serving different functions.

  *   **The Bias Training** operates on a **Situationist/Behaviorist** model. It argues that your intuition about a person's "essence" is contaminated by noise (affinity bias, halo effects) and that behavior is context-dependent. Its goal is to suppress *System 1* judgment.
  *   **The Hiring/Licensing Form** operates on an **Actuarial/Risk** model. It does not actually care if "Good Moral Character" exists as a psychological posit. It cares if the *label* "Good Moral Character" serves as a valid proxy for *low institutional liability*.

  Therefore, the view of character presupposed by the practice is **Instrumental Regularity**. It assumes that past conduct is statistically predictive of future conduct *within the specific constraints of the institution*, regardless of whether that regularity is caused by a stable internal trait or a stable external situation.

  When a bar association asks about "moral character," it is not asking, "Does this candidate possess the virtue of justice?" It is asking, "Is this candidate statistically likely to generate a malpractice claim or a disciplinary hearing?" The "character" judgment is a **legal fiction** used to offload responsibility. If the institution licenses a "person of good character" who then commits fraud, the institution is insulated ("We screened them!"). If they license someone without that certification, the institution is liable.

  ### 2. Consistency: The Single Act vs. The Rehabilitation Window

  You asked if the parts are consistent: treating a single act as revelatory while also honoring a rehabilitation window.

  On a **Global Trait Realist** view, this is indeed incoherent. If character is a stable *hexis* (state), a single act shouldn't define it (people slip), and if it is defined, it shouldn't change merely due to time (traits are enduring).

  However, on the **Actuarial Risk** view, this is perfectly consistent.
  *   **The Single Act (Diagnosticity):** Certain acts (dishonesty on a form, financial fraud) are treated as "high signal" because they correlate strongly with *institutional* risk. Lying to the board predicts lying to a client. The "revelatory" nature of the act isn't about the soul; it's about the base rate of recidivism for that specific behavior.
  *   **The Rehabilitation Window (Decay):** Risk profiles decay. A violent act 15 years ago has a lower statistical probability of recurrence than one 15 months ago. Furthermore, the window acknowledges **plasticity**. Institutions implicitly accept that people change, but they require a "probationary" period to gather new data points to update the risk profile.

  **What is ruled out?**
  *   **Thoroughgoing Situationism:** This is ruled out *in practice* (though acknowledged in training). If behavior were truly situation-specific with no cross-situational regularity, past conduct would have zero predictive value, and licensing would be impossible. The institution *must* assume some level of behavioral consistency to justify its existence.
  *   **Normative Idealism:** The view that character is a moral goal to be strived for is ruled out. The process is retrospective and defensive, not prospective or aspirational.
  *   **Global Trait Realism:** As noted, this is not required. You don't need to be honest in your marriage to be licensed as a lawyer. You only need to be honest in fiduciary contexts. The "global" label is a shorthand for a cluster of local regularities relevant to the role.

  ### 3. Where the Practice is Underdetermined

  The practice is philosophically underdetermined regarding the **locus of stability**.

  When an institution certifies "Good Moral Character," it leaves open whether the stability lies *in the person* or *in the environment*.
  *   **Theory A (Internal):** The person has an internal compass that resists temptation.
  *   **Theory B (Ecological):** The person has found a niche (a job, a community, a routine) that stabilizes their behavior.

  The institution treats these as identical. If a candidate has been stable for 7 years, the institution doesn't care if that stability is due to internal virtue or external constraints (e.g., they were in a structured job). This is why the practice licenses both the reformed sinner and the naturally compliant. It is underdetermined because the *outcome* (low risk) is the same, even if the *mechanism* differs.

  ### 4. Evaluating the Reform: Situation-Indexed Ratings

  Now, to your specific case: A licensing board replaces "Good Moral Character" with situation-indexed ratings ("admits mistakes," "reliable under deadline"), forbids aggregation, and imposes a 7-year limit.

  **Would a situationist endorse this?**
  A sophisticated situationist (like John Doris in *Lack of Character*) distinguishes between **global traits** (Honesty) and **local traits** (Honesty-in-financial-reporting-when-audited). Situationists deny the former but allow the latter.
  *   **The Good:** Breaking the judgment into specific domains aligns with the situationist insistence on **ecological validity**. Rating someone on "reliability under deadline pressure" is more predictive than rating them on "conscientiousness."
  *   **The Bad:** If the board treats these local ratings as *stable predictors* across time without accounting for situational changes, they are still reifying traits. If I was reliable under deadline pressure in my 20s, will I be so in my 40s if my health fails or my incentives change?
  *   **The Aggregation Ban:** This is the most situationist-friendly element. It prevents the "Halo Effect" where reliability in one domain bleeds into assumptions about morality in another.

  **Is it cosmetic or real?**
  It is **cosmetic** if the institution continues to use these ratings to make a binary decision (License / Do Not License) based on the assumption that the past rating predicts future behavior *independent of the new situation*.

  For the reform to be **real**, three institutional shifts would be required:

  1.  **From Prediction to Prevention:** The institution must acknowledge that character screening is a weak control. A situationist institution would focus less on *who* they let in and more on *designing the system* so that even a person with poor "local traits" cannot cause catastrophic harm. (e.g., Dual-signature requirements for funds reduce the need for "honesty" traits).
  2.  **Continuous Monitoring vs. Point-in-Time:** Character, on a situationist view, is a dynamic interaction between person and context. A one-time review (even with a 7-year lookback) assumes the person is a static object. A real reform would require ongoing, situational feedback loops rather than a gatekeeping verdict.
  3.  **Abandoning the "Moral" Label:** As long as the board uses terms like "moral character" or even "fitness," they invite the folk-psychological inference that they are judging the *person* rather than the *risk profile*. They must adopt a strictly behavioral vocabulary ("History of Compliance," "Incident Rate").

  **What would be given up?**
  If you take the situationist critique seriously, you give up **moral comfort**.
  *   **The Scapegoat Mechanism:** Currently, if a licensed professional fails, the institution says, "We thought they were good; they deceived us." This protects the institution. If you admit character is situational, the institution bears more responsibility for creating the situations that precipitated the failure.
  *   **Efficiency:** Holistic judgments are fast. "He seems like a good guy." Situationist auditing is slow. It requires checking specific behavioral records across specific contexts.
  *   **The Myth of the Professional:** The idea that being a lawyer/doctor/professor selects for a certain *kind of person* is a powerful professional identity myth. Admitting that professional behavior is largely a product of professional structures (and can be lost if structures change) undermines the guild's self-image.

  ### Summary

  The contradiction you observed is not a bug; it is a feature of risk management. The bias training exists to protect the institution from *legal liability* (discrimination suits), while the character certification exists to protect the institution from *operational liability* (bad actors).

  The implicit theory is **Actuarial Localism**: It assumes behavior is locally consistent enough to bet on, but not globally consistent enough to trust without verification.

  Your proposed reform moves the needle toward situationism by narrowing the traits and aging out the data. However, it remains cosmetic unless the institution stops using "character" as a shield against its own responsibility to design robust systems. A truly situationist institution would spend less time judging the moral worth of candidates and more time engineering environments where "good character" is less necessary for safe operation.
