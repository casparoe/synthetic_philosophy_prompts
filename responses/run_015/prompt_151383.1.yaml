answer: |-
  In a city housing office, caseworkers aim to prevent winter evictions by ensuring every tenant enrolls in a utility subsidy program, a goal tenants generally support for their own security. A hard rule requires caseworkers to process the enrollment automatically unless the tenant signs a specific waiver form. A nudge provides a standard lease agreement where the enrollment box is pre-checked, allowing the tenant to uncheck it before signing. Both methods are disclosed upfront, and both achieve a 95% enrollment rate. The nudge is worse because when the subsidy turns out to be financially harmful for a specific household due to a clerical error, the hard rule forces the city to acknowledge the mistake as a systemic imposition, making the failure visible and actionable. The nudge allows the city to claim the tenant voluntarily selected the plan, converting a public safety guarantee into a private consumer choice that shields the institution from liability while leaving the tenant with the debt.

  The "your options are still open" view argues that the tenant retained the power to uncheck the box, so the resulting debt is a consequence of their inaction, not the city's coercion. The case replies that the design of the choice architecture determined who owns the error: the mandate makes the city the author of the outcome, while the nudge makes the tenant the author, even though the city engineered the likelihood of that outcome. The single feature doing the work is **institutional answerability**—whether the system is forced to visibly own its failures rather than offloading them onto individual choices. If you remove this feature by requiring the city to accept liability for enrollment errors regardless of whether they came from a mandate or a pre-checked box, the nudge becomes morally equivalent to the rule. The strongest reply a nudge defender has is that hard mandates create adversarial relationships and bureaucratic rigidity; by keeping the choice formally with the tenant, the city avoids litigation risks that might force them to cancel the helpful program entirely, meaning the nudge preserves the safety net itself by blurring the lines of liability.
