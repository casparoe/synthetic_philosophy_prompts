  # Joint Statement on the Conceptual Status of Allostatic Drift

  **Preamble**
  Over the course of a year-long adversarial collaboration, we have examined the boundaries of medical classification through the lens of a hypothetical construct: *allostatic drift*. We define this state as a progressive shift in an organism's homeostatic set-points triggered by chronic environmental mismatch. This state is characterized by four features: (1) statistical normality within the current population, (2) an absence of subjective distress or symptomatology, (3) accelerated physiological degradation relative to ancestral functional baselines, and (4) significant policy implications regarding whether the state should be classified as pathological, adaptive, or neutral. While we remain divided on the fundamental nature of disease, we have reached consensus on the structural parameters of the debate and the empirical realities of the case at hand.

  ### I. Agreed Claims

  1.  **The Formal Structure of Health Judgments**
      We agree that any judgment of health or disease necessarily involves a tripartite structure: a subject (the organism), a state (the physiological or psychological condition), and a standard of comparison (the benchmark against which the state is evaluated). While we disagree on the origin and nature of the standard, we concur that without a specified standard, the attribution of "health" or "disease" is semantically empty.

  2.  **Epistemic Limits of First-Person Report**
      We agree that subjective experience is an unreliable sole arbiter of biological status. The absence of pain, distress, or self-reported impairment does not logically entail the absence of pathology. First-person reports provide necessary data regarding welfare and experience, but they are insufficient for determining the underlying functional integrity of biological systems or the full scope of capability deprivation.

  3.  **Descriptive Features of Allostatic Drift**
      We agree on the empirical profile of the hypothetical case. In instances of allostatic drift, the organism maintains operational equilibrium within its immediate context while incurring long-term structural costs. We accept that such a state creates a divergence between *current viability* (the ability to survive and reproduce in the present environment) and *systemic longevity* (the preservation of functional integrity over a lifespan).

  4.  **Measurement and Ecological Prediction**
      We agree that valid health assessments require ecological context. Specifically, we concur that predicting the trajectory of allostatic drift requires longitudinal data linking environmental stressors to physiological wear-and-tear, independent of immediate morbidity. Both camps accept that a metric which ignores the interaction between the organism's regulatory systems and its environmental demands will fail to predict future system failure.

  ***

  ### II. Table of Disagreements

  | Domain of Inquiry | Biostatistical Naturalist Position | Welfare-Capability Normativist Position |
  | :--- | :--- | :--- |
  | **Statistical Normality** | Statistical normality within a current reference class is a necessary condition for health. If a physiological shift is universal or typical within the current environment, it constitutes a new species-typical baseline, rendering the state non-pathological regardless of long-term degradation. | Statistical normality is never sufficient for health. A state can be statistically common yet pathological if it systematically undermines the basic capabilities required for human flourishing. Prevalence does not negate harm. |
  | **Social Valuation** | Social valuation is dispensable in the definition of disease. Pathology is a matter of factual biological dysfunction relative to evolutionary design. While social values dictate *treatment* priorities, they do not determine the *existence* of disease. | Social valuation is indispensable in pathologization. To label a condition a "disease" is to make a normative claim that the condition is a bad thing to have. Without reference to social norms of flourishing, biological deviation is merely difference, not disease. |
  | **Baseline Weighting** | Functional baselines must be weighted toward evolutionary design and ancestral physiology. If a current adaptation violates the species-typical functional architecture selected for over evolutionary history, it represents a failure of design, even if currently prevalent. | Functional baselines must be weighted toward current and future capability realization. Ancestral baselines are relevant only insofar as they inform what capabilities are possible; the primary metric is whether the current state enables a life of dignity and function within the *present* social context. |

  ***

  ### III. Cruxes and Predictive Commitments

  We have identified two sub-questions where further empirical or conceptual resolution would materially shift the weight of our respective arguments. For each crux, we specify a concrete line of reasoning we both deem relevant and record our divergent predictions regarding what that evidence will demonstrate.

  #### Crux 1: The Necessity of Conscious Awareness for Capability Reduction
  **The Sub-Question:** Does a reduction in basic human capabilities constitute a harm sufficient for pathologization if the subject is permanently unaware of the loss?

  **Relevant Case:** *The Asymptotic Decline.* Consider a population exposed to a neurotoxin that gradually reduces complex executive planning capabilities without affecting mood, memory recall, or subjective sense of agency. The subjects report feeling fully capable, yet objective measures show an inability to engage in long-term projects or complex social cooperation.

  *   **Biostatistical Naturalist Prediction:** We predict this evidence will show that the condition is a disease regardless of awareness. The dysfunction lies in the failure of the neurological mechanisms designed for executive function. Conscious awareness is epiphenomenal to the biological failure; the pathology exists in the mechanism, not the experience.
  *   **Welfare-Capability Normativist Prediction:** We predict this evidence will show that the condition is a disease *because* it reduces capability, but the *classification* relies on an external normative judgment. The harm is real without awareness, but identifying it as a "disease" requires a social judgment that executive planning is a central capability. The evidence will show that biological facts alone cannot distinguish this from a mere evolutionary trade-off without that normative layer.

  #### Crux 2: Historical vs. Synchronic Ecological Indexing
  **The Sub-Question:** Should health metrics be indexed to the environment in which the species evolved (historical) or the environment in which the species currently operates (synchronic)?

  **Relevant Case:** *The Sedentary Shift.* Consider a metabolic profile optimized for high-energy expenditure that becomes maladaptive in a sedentary environment, leading to "allostatic drift" in insulin regulation. The physiology is ancestrally "correct" but currently destructive. Alternatively, consider a physiology that shifts to accommodate the sedentary environment (drift) but degrades overall longevity.

  *   **Biostatistical Naturalist Prediction:** We predict that ecological indexing must remain historical regarding function. Evidence will show that the "design" of the metabolic system is fixed by evolutionary history. Therefore, a mismatch between current environment and ancestral design constitutes dysfunction, even if the body adapts synchronically. The drift is pathological because it violates the historical design constraints.
  *   **Welfare-Capability Normativist Prediction:** We predict that ecological indexing must be synchronic regarding valuation. Evidence will show that health is the ability to function *now*. If the ancestral design prevents flourishing in the current environment, the "disease" may lie in the mismatch itself, not the individual's drift. The evidence will demonstrate that prioritizing historical baselines obscures the social responsibility to alter the environment rather than pathologize the adaptation.
