  **Part (c)**
  *   **Claim (i):** "On C... probability of finding myself to be a settler is 1; on G... it is 10^11 over 10^20... likelihood ratio is therefore 10^9:1 in favour of C."
      *   **Verdict:** **Correct.** The application of SSA to the "early observer" evidence is accurate.
      *   **Comment for Script:** "Correct. You have correctly applied SSA to show that finding oneself early favours the smaller total population (a Doomsday-style result)."
  *   **Claim (ii):** "Once SIA is added... SIA weighting already takes account of [the evidence that I am a settler]... posterior odds are 10^9:1 in favour of G."
      *   **Verdict:** **Straightforwardly wrong (Method and Result).** SIA adjusts the *prior* based on total observers; SSA adjusts the *likelihood* based on self-location. They do not swallow each other; they multiply. The SIA boost ($10^9$ for G) is cancelled by the SSA likelihood ($10^{-9}$ for G).
      *   **Comment for Script:** "You have applied the SIA prior shift but failed to apply the SSA likelihood ratio on top of it. SIA favours G by $10^9$, but SSA favours C by $10^9$ (given you are a settler). These cancel out, yielding 1:1 odds, not $10^9:1$."
  *   **Claim (iii):** "Narrowing the reference class so as to exclude the emulations makes no difference to this... G contains vastly more observers than C either way."
      *   **Verdict:** **Wrong.** If emulations are subjectively distinguishable (they know they are emulations), they do not count as "possible observers I could be" for SIA. Thus, the SIA boost vanishes.
      *   **Comment for Script:** "If the emulations are subjectively distinguishable, they do not count towards the SIA weighting for *you*. In that case, the number of 'possible mes' is the same in C and G ($10^{11}$), so the SIA boost disappears. The result would change to 1:1."
  *   **Claim (iv):** "The settlers' knowledge that they are early makes no difference at all... works exactly like the presumptuous philosopher in part (b)."
      *   **Verdict:** **Wrong.** The indexical knowledge ("I am a settler") is the specific evidence that triggers the SSA correction against the SIA boost.
      *   **Comment for Script:** "The indexical knowledge is crucial. In (b) we lack self-locating evidence, so SIA dominates. In (c), the knowledge 'I am early' provides the likelihood ratio that cancels the SIA prior shift. The cases are structurally different."

