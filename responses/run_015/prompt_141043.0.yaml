  ### TA Guidance & Flags

  **(i) Technically wrong but costs nothing:**
  In part (a), the student writes "She knows 30 of 90 balls are red, so P(R) = 1/3." In strict Savagean subjective probability, $P(R)$ is a subjective degree of belief, not necessarily the objective frequency. However, given the information provided, a rational agent is normatively required to align them. This conflation is common in second-year courses and doesn't impact the logic of the contradiction, so I didn't penalize it.

  **(ii) Right for a reason she hasn't got:**
  In part (b), she correctly concludes the agent is not committed to preferring Package 1 and correctly cites MaxMin/Choquet. However, her reasoning relies on the claim from (a) that "priors can be choice-relative." Standard ambiguity models (like MaxMin) don't usually allow *shifting* single priors; they evaluate acts against a *set* of priors simultaneously. She got the right result (indifference between sure things) and named the right models, but her mental model of *how* those models work (shifting vs. sets) is slightly confused by her defense in (a).

  **(iii) Weighing Part (a) (Disagreement with framing):**
  Do not award full marks for arguing the question is wrong. In a technical problem set, "Explain why X does not rescue the agent" tests whether the student understands the *constraints* of the model (SEU), not whether they agree with the model's philosophy. She demonstrated she understands the math of the paradox, but failed to demonstrate she understands the definition of SEU (unique prior). I awarded 1/4 on the objection paragraph for identifying that the "single prior" assumption is the culprit, but penalized heavily for concluding the objection was valid *within that framework*. If you give full credit here, you validate the misconception that SEU allows choice-relative priors.

