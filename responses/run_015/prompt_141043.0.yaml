  **(c)**
  *   *Next to "Yes.":* **Incorrect.**
  *   *Next to "only goes through if u is linear":* **No.** In binary choices with identical payoffs ($100/$0), utility curvature cancels out. $p u(100) + (1-p)u(0) > q u(100) + (1-q)u(0)$ reduces to $p > q$ for *any* monotonic $u$, concave or linear. Risk aversion is irrelevant here.

