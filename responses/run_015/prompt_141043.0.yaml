  ### Margin Comments

  **(a)**
  *   *Next to the probability derivation:* **Correct.** Clear contradiction shown.
  *   *Next to "Savage's sure-thing principle, P2":* **Correct.** Good explanation of the common consequence (yellow).
  *   *Next to "I think the objection is basically right...":* **Stop.** The question asks why this does *not* rescue the SEU agent. You are arguing that SEU is the wrong model. That is a valid philosophical critique, but it fails the technical constraint of the question: an SEU agent *must* have a unique prior across all acts. You cannot "change" the prior to avoid the contradiction without ceasing to be an SEU agent.
  *   *Next to "assumption (i)... is doing all the work":* You've identified the source of the tension (uniqueness of prior), which is why you get partial credit here, but you concluded the objection succeeds rather than explaining why it is inadmissible within the framework.

