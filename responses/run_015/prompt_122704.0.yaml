answer: |-
  **TO:** Allocation Committee, Bracknell Trust
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Grant Cycle Allocation Recommendation

  **Recommendation**
  I recommend we commit the full $4.6 million available this cycle as follows:

  1.  **Proposal B (Lead Paint):** $1.5 million, conditional on securing the 1:1 match.
  2.  **Proposal C (CKD Surveillance):** $1.4 million, full ask.
  3.  **Proposal A (Deworming):** $1.7 million, partial funding.
  4.  **Reserve:** $0.

  This allocation fully deploys our capital, adhering to our spend-down mandate. I recommend against the Treasurer's proposal to hold $1 million in reserve. While the anticipated co-funding window in fourteen months is promising, it is speculative. Conversely, Proposal B's matching deadline (five months) and Proposal C's relationship window (fourteen months) are imminent and certain. Holding liquidity risks forfeiting guaranteed leverage and unique access for uncertain future opportunity. In a spend-down context, known leverage today outweighs hypothetical leverage tomorrow.

  **Weight of the ITN Scorecard**
  The committee should treat the Importance/Tractability/Neglectedness (ITN) scorecard as a heuristic for discussion, not an algorithm for decision-making. In this cycle, static scores mislead on two fronts.

  First, the standard Tractability metric (impact per million dollars) fails to capture the 1:1 match in Proposal B. Effectively, our marginal dollar in B purchases $2.00 of activity. This doubles the tractability score relative to the staff write-up. Second, the Neglectedness metric is vulnerable to framing effects, as noted in the proposed taxonomy amendment. However, rather than changing the formula mid-cycle, we should apply counterfactual reasoning manually. Proposal A faces high displacement risk; if we do not fund, another bilateral may eventually step in, or the ministry may absorb the cost. Proposal C faces zero displacement risk; if we do not fund, the work likely does not happen.

  Therefore, I propose we use the ITN scores to identify outliers for discussion, but allow specific leverage opportunities (the match) and execution risks (the expiring secondment) to override the aggregate numbers.

  **Framework Amendments**
  I recommend we decide this allocation under the current framework and defer the proposed amendments (counterfactual displacement and fixed taxonomy) until the next cycle.

  Changing the scoring rules during a live allocation creates inequity. Proposals A and C were developed by staff and proponents under the existing rules. Applying a fixed taxonomy now might artificially depress Proposal C's neglectedness score, penalizing it for a rule change it could not anticipate. Similarly, shifting to counterfactual displacement now would heavily penalize Proposal A after it has already cleared staff review based on the old metric.

  We should, however, mandate that staff revise the framework before the next cycle. The "narrow framing" risk in Neglectedness is real, and the displacement measure is theoretically superior for a spend-down foundation that wishes to ensure additionality. But procedural fairness dictates we play this hand with the cards we were dealt.

  **The Case for Proposal A (and the Reserve)**
  Those favoring a larger allocation to Proposal A, potentially funded by reducing B or C or by utilizing the reserve, argue from a position of epistemic humility and risk mitigation.

  Proposal A offers the strongest evidence base. We know deworming works; the delivery platform is proven; the cost per DALY averted is well-characterized. In a spend-down scenario, the risk of failure is a luxury we cannot afford. Proposal B relies on a causal chain (regulation → enforcement → blood-lead reduction) that is historically fragile in this setting. If the political will evaporates, our capital is stranded with no health impact. Proposal C funds research on an unsettled etiology; it is essentially a venture capital bet on a disease mechanism.

  Furthermore, the Treasurer's reserve argument holds weight if we view the Trust's reputation as a long-term asset, even post-closure. If we deploy everything now on risky bets (B and C) and a high-impact, low-risk opportunity arises in fourteen months, we have failed our beneficiaries by running out of dry powder. Proposal A represents the "sure thing." By prioritizing A, we ensure that at least a significant portion of our remaining capital yields guaranteed health outcomes, rather than gambling on policy changes or scientific breakthroughs. If the goal is to minimize the variance of our impact, A is the superior vehicle.

  **Conclusion**
  We are a spend-down foundation. Our comparative advantage is not risk aversion, but the ability to take risks that perpetual foundations cannot—specifically, funding policy pilots (B) and time-sensitive relationship capital (C) that require immediate liquidity. The match in B is a force multiplier we cannot ignore. I urge the committee to approve the allocation above.
