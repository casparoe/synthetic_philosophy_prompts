prompt: |-
  I serve on the allocation committee of the Bracknell Trust, a small health-focused foundation that is spending down: our governing instrument requires the remaining capital to be committed within three grant cycles, after which the Trust closes. This cycle we have USD 4.6 million to place. Three proposals survived staff review, and we cannot fund all three at full scope, so the decision is real.

  Our standing method is a multiplicative importance / tractability / neglectedness score. In our scorecard, importance is burden per unit of problem (DALYs), tractability is the share of the problem averted per million dollars in that setting, and neglectedness is one over total annual philanthropic and bilateral spend in the cause, taken at whatever level of description staff happened to use in the proponent's write-up.

  Proposal A: school-based treatment for soil-transmitted helminths plus micronutrient supplementation in two districts of a low-income country. USD 1.9 million over three years. Evidence base is strong and the delivery platform is proven; cost per child treated is roughly a dollar. Two bilateral funders and one multilateral are active in the same districts, and staff estimate about three million dollars of room for more funding before the platform saturates. One of the bilaterals has announced it will exit the country within eighteen months, and the ministry has no budget line to absorb the shortfall; if it leaves, staff think remaining room for more funding roughly doubles.

  Proposal B: a pilot to remove lead from paint sold in a middle-income country's domestic market, paired with enforcement capacity. USD 2.2 million over three years. Burden is large, the causal chain from regulation to measured blood-lead reduction is long, and the evidence for enforcement actually biting is thin; there is political risk. No other funder is currently in lead work in that country. Separately, a large private foundation has publicly pledged to match new commitments in this area one-for-one, up to 1.5 million dollars in total, but only for commitments signed before a deadline five months from now, and nothing thereafter.

  Proposal C: surveillance, clinical guidance, and a small treatment stockpile for a poorly understood chronic kidney disease affecting young agricultural workers in one region. USD 1.4 million over three years. Almost nothing is spent on it globally, the aetiology is unsettled, and part of the grant is research that would change what later funders could do. Our own regional program officer has nine years of relationships with the regional health authority and two growers' associations; her secondment ends in fourteen months, and that relationship capital leaves with her.

  Two further complications. First, two committee members want the scorecard amended before we vote: one to replace neglectedness with a counterfactual-displacement measure (the share of resulting activity that would not have occurred but for us), and one to force every cause onto a fixed twelve-area taxonomy so that staff cannot sharpen a description until the denominator looks small — under that taxonomy, at least two of these proposals collapse into the same cause area. Second, our treasurer wants up to one million dollars held back unallocated, on the ground that a large funder is expected to open a co-funding window in about fourteen months.

  Please draft the decision memo I will circulate, addressed to the committee and no longer than about a thousand words. It should: open with a specific recommended allocation, including tranche structure or conditions and whether any reserve is justified; state what weight the ITN score should carry in the final decision and why; say whether we should adopt either amendment now or decide this case first and revise the framework afterward; and include a short section giving the strongest version of the case for the option you are not recommending, of the kind its advocate would recognize. The committee is split and sophisticated, so the reasoning has to be usable by people who disagree with the conclusion, not merely a restatement of the score.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Allocation Committee of the Bracknell Trust.
      *   **Context:** Small health-focused foundation, spending down (capital must be committed within 3 grant cycles, then close). Current cycle budget: $4.6M.
      *   **Task:** Draft a decision memo to the committee (max ~1000 words).
      *   **Proposals:**
          *   A: Deworming + micronutrients ($1.9M). Strong evidence, proven platform. Risk: Funder exit might increase room for more funding (RFMF).
          *   B: Lead paint removal ($2.2M). Large burden, long causal chain, political risk. Opportunity: 1:1 match up to $1.5M (deadline 5 months).
          *   C: CKD surveillance/research ($1.4M). High neglectedness, unsettled etiology. Risk: Key staff relationship expires in 14 months.
      *   **Complications:**
          *   Scorecard amendments proposed (Counterfactual displacement vs. Neglectedness; Fixed taxonomy).
          *   Treasurer wants $1M reserve for future co-funding window (14 months out).
      *   **Requirements:**
          *   Open with specific recommended allocation (tranches/conditions/reserve).
          *   State weight of ITN score and why.
          *   Address framework amendments (adopt now vs. later).
          *   Include a "Steel Man" section for the non-recommended option.
          *   Tone: Sophisticated, usable by disagreeing members, not just restating scores.

  2.  **Evaluate the Proposals & Constraints:**
      *   **Budget:** $4.6M available.
      *   **Spend-down Constraint:** Capital must be *committed* within 3 cycles. We are in one of those cycles. Holding back money is risky if it jeopardizes the spend-down mandate, but the Treasurer's concern is about efficiency/leverage.
      *   **Proposal A ($1.9M):** High tractability, moderate neglectedness (due to other funders). *Crucial Detail:* If a bilateral exits, RFMF doubles. This suggests high risk of displacement (crowding out) or saturation. However, cost-effective.
      *   **Proposal B ($2.2M):** High importance, low tractability (uncertain enforcement). *Crucial Detail:* 1:1 match up to $1.5M. This effectively makes $1.5M of our money worth $3M. This is a massive leverage opportunity. Deadline is 5 months away.
      *   **Proposal C ($1.4M):** High neglectedness, low tractability (research/uncertain). *Crucial Detail:* Relationship capital expires in 14 months. If we don't act now, the opportunity might vanish.
      *   **Treasurer's Reserve ($1M):** Wants to hold back for a co-funding window in 14 months. *Conflict:* Proposal C's relationship capital also expires in 14 months. Proposal B's match expires in 5 months. Holding $1M risks missing B's match and C's window. Also, spend-down mandate requires commitment.
      *   **Framework Amendments:**
          *   *Counterfactual Displacement:* A is vulnerable here (other funders). B is strong (no other funders + match). C is strong (neglected).
          *   *Fixed Taxonomy:* Prevents "narrow framing" to inflate neglectedness. C looks vulnerable if its cause area is broadened.

  3.  **Determine the Recommendation:**
      *   *Math:* $4.6M total.
      *   *Option B is the anchor:* The 1:1 match is too good to ignore in a spend-down context. It effectively increases our purchasing power. We should commit enough to get the full match. Let's say we commit $1.5M to trigger the $1.5M match. Total value $3M.
      *   *Option C is the hedge:* It addresses the "spend-down" risk (unique opportunity) and high neglectedness. But the relationship expires in 14 months. We need to commit now.
      *   *Option A is the fallback:* Strong evidence, but displacement risk is high.
      *   *Reserve:* The Treasurer wants $1M held back. But B's deadline is 5 months. C's window is 14 months. The Treasurer's window is 14 months. If we hold $1M, we might miss B's match. Given the spend-down mandate, liquidity is less important than deployment *unless* the future window is vastly superior. But B's match is immediate leverage.
      *   *Decision:* Fund B (to max match) + Fund C (to secure relationship) + Partial A or Reserve?
      *   *Revised Decision:*
          *   Fund B: $1.5M (to maximize match).
          *   Fund C: $1.4M (full ask, secure relationship).
          *   Total: $2.9M.
          *   Remaining: $1.7M.
          *   Fund A: $1.7M (partial/full? Ask is $1.9M). Let's fund A at $1.7M or hold reserve?
          *   *Wait, check constraints:* Treasurer wants $1M reserve. If I recommend *no* reserve, I need to justify it against the spend-down mandate. Actually, the spend-down mandate says capital must be *committed*. A reserve is uncommitted. This violates the spirit of the spend-down unless the "co-funding window" is guaranteed to absorb it.
          *   *Better Strategy:* Prioritize B (match) and C (timing risk). A is safer but less urgent.
          *   *Allocation:*
              *   Proposal B: $1.5M (conditional on match).
              *   Proposal C: $1.4M (full).
              *   Proposal A: $1.7M (partial, or full $1.9M if we cut reserve).
              *   Total needed for B+C = $2.9M. Remaining = $1.7M.
              *   If we fund A fully ($1.9M), we need $4.8M. We have $4.6M. We can't fund all three fully.
              *   If we fund B ($1.5M) + C ($1.4M) + A ($1.7M) = $4.6M. This uses the full budget.
              *   *Reserve:* I should recommend *against* the $1M reserve because it jeopardizes the B match deadline and C's relationship window, and conflicts with the spend-down mandate.
      *   *Framework:* Decide this case first. Changing rules mid-game is unfair and delays action.
      *   *ITN Weight:* Use as input, not dictator. B scores low on tractability but high on leverage (match). C scores high on neglectedness but low on tractability. A scores high on tractability. The match overrides standard tractability.

  4.  **Drafting - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Recommendation:** Clear numbers. $1.5M to B (match), $1.4M to C (window), $1.7M to A (partial). No reserve.
      *   **ITN Weight:** Scorecard is a heuristic, not an algorithm. Leverage (match) and timing (relationships) override static scores.
      *   **Framework Amendments:** Defer. Don't change rules during a play.
      *   **Steel Man (The Road Not Taken):** Focus on A. It's the "safe" bet. High evidence, low risk of failure. If we value certainty over leverage, A is the winner.

  5.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is funding A partially okay? Yes, if the program is scalable.
      *   *Critique:* Why no reserve? Because the spend-down mandate is legal/structural. Also, the "future window" is uncertain, whereas B's match is certain *if* we act.
      *   *Critique:* Framework. If we adopt the taxonomy now, C might look less neglected. If we adopt displacement now, A looks worse. Best to stick to current rules for fairness, but acknowledge their limits in the reasoning.
      *   *Tone Check:* Needs to be respectful of the split committee. Acknowledge the validity of the Treasurer's caution but prioritize the mandate.

  6.  **Writing the Memo (incorporating word count constraints):**
      *   Keep it tight.
      *   Ensure the "Steel Man" is genuine.
      *   Make sure the logic on the "Match" is clear (it effectively reduces the cost per outcome).

  7.  **Final Review against constraints:**
      *   Max 1000 words? (Will monitor closely).
      *   Address allocation, ITN weight, Framework, Steel Man.
      *   Address the Reserve issue.

  *(Self-Correction during drafting)*: I need to make sure I explicitly address the "spend-down" nature. Holding cash is antithetical to spending down unless the future opportunity is *guaranteed* to be better. The B match makes *now* better than later.

  *(Refining the Allocation)*: $1.5M (B) + $1.4M (C) = $2.9M. Remaining $1.7M. A asks for $1.9M. I will recommend $1.7M to A. This fully deploys the $4.6M.
  Wait, if I recommend $1.7M to A, I am cutting A. Is that better than holding a reserve? Yes, because A has "room for more funding" and is proven. A partial grant is viable.
