answer: |-
  # JOINT STATEMENT ON NOSOLOGICAL REALISM AND INTERACTIVE KINDS
  **Subject:** Proposed Category *Maladaptive Anticipatory Vigilance* (MAV)
  **Parties:** Discovery Camp (DC) and Looping Camp (LC)
  **Date:** [Workshop Date]

  ## PREAMBLE
  This document records the outcomes of an adversarial collaboration regarding the ontological status of psychiatric categories and the specific evidentiary value of the stipulated data package concerning *Maladaptive Anticipatory Vigilance* (MAV). The parties agree to the definitions below and acknowledge the stipulated findings as the baseline for this statement.

  **Defined Terms:**
  *   **MAV:** A hypothetical diagnostic category characterized by compulsive threat-monitoring and checking.
  *   **Semantic Recoil Index (SRI):** A quantitative measure of how much a category's prevalence and symptom profile shift when its criteria text is made public and taught.
  *   **Holdout Cohort:** Archival interview data recorded prior to the existence of the MAV category, re-coded blind using MAV criteria.
  *   **Laboratory Marker:** A physiological correlate stipulated to be present in ~60% of post-campaign cases and ~55% of pre-campaign cases.
  *   **Looping:** The process by which the classification of a human kind alters the behavior or self-conception of the classified, thereby altering the kind itself.

  ---

  ## SECTION 1: AGREED CLAIMS
  *The following claims are substantive. A naive proponent of either camp prior to this collaboration would likely have rejected at least one of these propositions.*

  1.  **The Non-Awareness Component of Recoil:** The rise in prevalence observed in the Holdout Cohort demonstrates that the Semantic Recoil Index captures effects independent of immediate subject awareness or conscious mimicry. Both camps agree that the "loop" includes a component driven by changes in observer coding frameworks and institutional practices, not solely by patient self-labeling.
  2.  **Phenotype-Marker Decoupling:** The stipulated finding that criteria tightening shifted clinical presentation while leaving marker prevalence flat establishes that administrative definitions can alter the behavioral phenotype of a category without immediately altering its physiological correlation rate. Both camps agree this decoupling is a measurable, replicable feature of the current nosology, not merely measurement error.
  3.  **Constraint on Construction:** While the camps disagree on the source of stability, both agree that the Laboratory Marker acts as a *constraint* on valid criteria revisions. A revision that reduced marker prevalence among cases to chance levels would be rejected by both camps as invalid, though for different reasons (DC: loss of validity; LC: loss of institutional continuity).
  4.  **Utility Requires Stability:** Both camps agree that for MAV to be adopted, it must demonstrate predictive stability over a defined clinical horizon (e.g., treatment response), regardless of whether that stability is ultimately grounded in biological homeostasis (DC) or institutional reinforcement (LC).

  ---

  ## SECTION 2: DISAGREEMENTS TABLE
  *This table isolates the cruxes where the camps diverge. For each crux, we specify the precise formulation each side accepts, what would move them, and a shared case with pre-registered predictions.*

  | Crux | Discovery Camp (DC) Formulation | Looping Camp (LC) Formulation | What Would Move DC | What Would Move LC | Shared Case / Prediction | Pre-Registered Guesses |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. The Deflationary Move**<br>(Is Looping just measurement reactivity?) | Looping is a species of measurement reactivity. Human kinds are classifier-responsive, as are tumor subtypes under treatment or ML classifiers. The difference is one of degree (complexity), not kind. | Looping is constitutive. In human kinds, the description partly *creates* the target. In tumor/ML cases, the target adapts to pressure; in human kinds, the target adapts to *meaning*. The difference is qualitative. | Evidence that hiding the label from patients while keeping treatment identical results in no change to symptom trajectory over 10 years. | Evidence that hiding the label from patients while keeping treatment identical results in a *divergence* of symptom trajectory compared to the labeled group, even with identical biology. | **Case:** A double-blind trial where Group A is diagnosed with MAV and Group B is diagnosed with a neutral label (e.g., "Stress Response Type 4"), despite identical criteria and treatment.<br>**Prediction:** Measure divergence in self-reported identity and long-term checking behavior. | **DC:** No significant divergence. The marker drives the course.<br>**LC:** Significant divergence. The label drives the course. |
  | **2. The Archival Rise**<br>(What does the Holdout Cohort prove?) | The rise in the Holdout Cohort proves the target existed prior to the name. The coding framework finally captured a pre-existing causal structure that was previously obscured. | The rise in the Holdout Cohort proves the coding framework is retroactively constructive. The "target" is created by the grid applied to the archive, not found within it. | If re-coding the same archive with a *rival* neutral framework (not MAV) yields no prevalence rise, DC infers MAV specificity. | If re-coding the same archive with a *rival* neutral framework yields a *comparable* prevalence rise, LC infers framework-dependence. | **Case:** Re-code the Holdout Cohort using a competing framework (e.g., "Generalized Arousal Dysregulation") that excludes MAV-specific vocabulary.<br>**Prediction:** Compare prevalence rates. | **DC:** Prevalence will drop to baseline. MAV tracks a specific joint.<br>**LC:** Prevalence will remain elevated. The archive yields to any high-granularity grid. |
  | **3. Marker Ontology**<br>(What is the Marker?) | The Marker tracks the causal core. The 40% of cases without the marker are false positives or etiologically heterogeneous subtypes. | The Marker tracks a physiological correlate that is now being *used* as part of the kind. The 40% without the marker are genuine cases where the interactive kind has not yet crystallized around that physiology. | If individuals with the Marker but *no* symptoms respond to MAV-targeted treatment, DC infers the Marker is the disease. | If individuals with the Marker but *no* symptoms do *not* identify as MAV and reject treatment, LC infers the kind requires the self-conception. | **Case:** Screen a general population for the Marker, identify asymptomatic positives, and offer MAV psychoeducation.<br>**Prediction:** Measure rate of symptom onset following education. | **DC:** High rate of onset. Education reveals latent disease.<br>**LC:** Low rate of onset. Education fails to spark the loop without prior distress. |

  ---

  ## SECTION 3: VERBAL VERSUS GENUINE DISPUTE
  *This section addresses the "Peace Treaty" claim that categories are "both discovered and made."*

  **1. The "Both/And" Truce**
  We agree that the statement "MAV is both discovered and made" is **verbal** if it merely asserts that (a) biological constraints exist and (b) human classification practices exist. Both camps accept (a) and (b). No substantive work is done by this formulation.

  **2. The Explanatory Priority Dispute**
  We agree that the statement is **genuine** if it functions as a claim about *explanatory priority* regarding stability.
  *   **DC Claim:** Stability is primarily maintained by the causal structure of the target (the Marker and its associated circuitry). Classification practices are secondary tools that approximate this structure.
  *   **LC Claim:** Stability is primarily maintained by institutional reinforcement (guidelines, insurance, self-conception). The biological structure is a resource that is recruited by the classification, not the engine of the classification.

  **3. The Deflationary Clause**
  Regarding the DC claim that "nothing about human kinds is special except degree":
  *   **DC** signs this clause.
  *   **LC** explicitly **rejects** this clause.
  *   **Reason for Rejection:** LC holds that the mechanism of "meaning uptake" in human subjects constitutes a different *causal pathway* than the mechanism of "adaptive pressure" in tumors or algorithms. In tumors, the environment selects for resistance. In humans, the subject *adopts* the description as a reason for action. LC argues this distinction renders the "degree only" claim false, as it conflates selection with reasoning.

  ---

  ## SECTION 4: ADVICE TO THE NOSOLOGY COMMITTEE
  *This section addresses the committee voting on the adoption of Maladaptive Anticipatory Vigilance (MAV).*

  **1. Implications for the Vote**
  The disagreement between DC and LC does not mandate a rejection of MAV, but it does mandate a specific *mode* of adoption.
  *   **If DC is correct:** MAV should be adopted with criteria tightened to maximize correlation with the Laboratory Marker, treating the behavioral symptoms as fallible indicators of the biological core.
  *   **If LC is correct:** MAV should be adopted with explicit warnings that the criteria text itself is an intervention that will alter the prevalence and presentation of the disorder.
  *   **Joint Recommendation:** Adopt MAV **provisionally**. The stipulated data (specifically the Phenotype-Marker Decoupling) suggests the category is currently a hybrid of biological correlate and institutional construct. Treating it as purely biological (DC) risks ignoring the SRI effects. Treating it as purely construct (LC) risks ignoring the Marker's predictive utility.

  **2. Required Measurements Before Finalization**
  Before MAV is moved from "Provisional" to "Established," the Committee must mandate the following:
  *   **SRI Monitoring:** Prevalence must be tracked against the Semantic Recoil Index for two diagnostic cycles. If prevalence continues to double without a corresponding increase in the Laboratory Marker prevalence within the population, the criteria must be revised.
  *   **Blind Coding Audits:** A subset of clinical diagnoses must be re-coded blind against the archival framework annually to distinguish genuine epidemiological shifts from coding drift.
  *   **Marker-Symptom Dissociation:** Research funding must be directed toward the 40% of cases lacking the Marker. If this group shows distinct treatment responses, MAV may need to be split into two categories (Marker-Positive and Marker-Negative Interactive Types).

  **3. Closing Statement**
  We, the undersigned, acknowledge that we disagree on *why* MAV works, but agree on *how to test* whether it continues to work. We recommend the Committee vote to adopt MAV conditional on the measurement protocols listed above.

  **Signed:**
  [Discovery Camp Representative]
  [Looping Camp Representative]
