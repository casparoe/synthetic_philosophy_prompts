prompt: |-
  I'm writing a scene where a detective is trying to decide whether to trust a witness who spent a year in a coma and then woke up with a different personality, and I need a concrete example of a case where endurantism and perdurantism give different intuitions about whether the later witness is the same person as the earlier one, but not the usual statue/clay or ship of Theseus stuff. Can you give me one that would fit a novel about memory, identity, and whether a person can owe something to their past self?
