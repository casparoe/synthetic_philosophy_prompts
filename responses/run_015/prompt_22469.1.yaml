answer: |-
  Here is a concrete scenario you can use in your novel. It avoids the standard metaphysical tropes (ships, statues) and focuses specifically on **moral obligation across a break in consciousness**, which fits your themes of debt and identity.

  ### The Case: "The Varrick Lockbox"

  **The Backstory (The Detective's Memory):**
  Ten years ago, there was a high-profile corporate whistleblower named Julian Varrick. Before going into witness protection, Varrick knew the stress might break him. He went to a notary and recorded a video testament. He placed the evidence of the crime in a timed lockbox set to open in five years.

  In the video, Pre-Coma Varrick said: *"I know I am afraid. I know I might want to recant later to make the pain stop. But I am locking this away for the greater good. If I wake up and try to destroy this box, that means I have broken. Do not let me."*

  Shortly after, Varrick was in a car accident (sabotaged) and spent three years in a coma. He woke up with severe frontal lobe damage. His personality shifted from anxious and principled to impulsive and self-preserving. Upon waking, his first instinct was to destroy the box to end the threat to his life.

  **The Philosophical Conflict:**
  The court had to decide if Post-Coma Varrick had the legal and moral right to void Pre-Coma Varrick's directive.

  #### 1. The Endurantist Intuition (The "Same Substance" View)
  *   **The Logic:** Endurantism holds that Varrick is wholly present at both times. He is a single, enduring substance. Even if his properties (personality, memory) changed, the *entity* is numerically identical.
  *   **The Verdict:** Post-Coma Varrick **is** Pre-Coma Varrick. Therefore, when he tries to destroy the box, he is lying to himself. He is breaking a promise he made to himself. The obligation is absolute because the "promiser" and the "promisee" are the exact same being.
  *   **Detective's Take:** "It doesn't matter that he doesn't remember making the deal. He *is* the man who made it. To let him break it is to say a man can sign a contract on Monday and tear it up on Tuesday just because he woke up in a bad mood. He owes it to his past self to honor the sacrifice."

  #### 2. The Perdurantist Intuition (The "Time-Slice" View)
  *   **The Logic:** Perdurantism holds that Varrick is a "space-time worm." Pre-Coma Varrick is an early temporal part; Post-Coma Varrick is a later temporal part. They are segments of the same whole, but they are not identical to each other.
  *   **The Verdict:** Post-Coma Varrick is a *different stage* of the worm. The early stage made the sacrifice; the later stage is merely the beneficiary. The later stage has new data (the trauma, the personality shift) that the early stage didn't have. The later stage isn't "breaking a promise"; it's a new agent inheriting an old problem.
  *   **Detective's Take:** "The man who locked the box is dead. The man standing here is just the one who inherited the key. You can't hang a man for a crime his grandfather committed, even if they share the same name and blood. The Varrick who locked the box knew the risks. This Varrick is living the consequence. He has the right to survive."

  ### How to Use This in Your Scene

  You can have the detective staring at the witness (let's call her **Elena**) and running this parallel in his head.

  **Example Passage:**

  > The detective looked at Elena. She sat with her hands folded, calm in a way the old Elena never was. The old Elena was a storm of anxiety; this woman was a still lake.
  >
  > He thought about the Varrick case. In Varrick, the court had split down the middle. The Endurantists argued that Varrick was one man, bound by his own signature, regardless of the brain damage. To them, identity was a iron chain; if one link existed, the whole chain held. If this was true, Elena was bound by the promise she made before the coma. She owed the truth to the woman she used to be.
  >
  > But then there was the Perdurantist view. They saw a person like a river. The water upstream wasn't the same water downstream, even if it was the same river. The Elena who made the deal was upstream. She had drowned. This woman was the downstream flow, carrying the sediment of the past but moving in a new direction. If this was true, Elena didn't owe the past anything. She only owed the present the truth as she saw it now.
  >
  > "Do you remember signing the statement?" he asked.
  >
  > "No," she said. Her voice was steady. "But I know I'm the one who wrote it."
  >
  > "Does that make it binding?"
  >
  > "That depends," she said, meeting his eyes. "Are you arresting the woman who signed it, or the woman sitting here?"
  >
  > The detective felt the weight of the question. If he trusted her, he was betting on the River. If he pressured her, he was betting on the Chain.

  ### Why This Works for Your Themes
  1.  **Memory:** It highlights that memory loss isn't just missing data; it's a fracture in the *self*.
  2.  **Identity:** It forces the detective to choose between biological continuity (Endurantism) and psychological continuity (Perdurantism).
  3.  **Debt:** It explicitly frames the conflict as a debt. Does the "New Self" inherit the moral debts of the "Old Self"? Endurantism says yes; Perdurantism suggests the debt might be extinguished by the break in consciousness.
