  2.  **Deconstruct the Philosophical Concepts:**
      *   **Endurantism (3D-ism):** Objects/people are wholly present at every moment of their existence. Identity is strict and numerical. If $A$ at $t_1$ is the same as $B$ at $t_2$, *all* of $A$ is there, just at a different time. Change is tricky (how can I be wholly kind now and wholly cruel later?). Usually relies on psychological continuity or biological continuity for persons.
      *   **Perdurantism (4D-ism):** Objects/people are space-time worms. They have temporal parts. $A$ at $t_1$ is an early temporal slice; $B$ at $t_2$ is a later temporal slice. They are parts of the same "worm," but the slices themselves aren't identical. Identity is a matter of how we define the boundaries of the worm.
      *   **The Divergence:** Endurantism tends to say "Yes, it's the *same* person, therefore they bear the full weight of the past." Perdurantism allows for "It's a later stage of the same worm, but the *stage* itself isn't responsible for the earlier stage's actions in the same way." It creates distance between the "now me" and the "then me."

