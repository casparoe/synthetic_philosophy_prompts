answer: |-
  This is a sophisticated plan. You are asking students to inhabit a formal framework (Imprecise Probability) that contradicts their training (Bayesian Orthodoxy) using only behavioral elicitation. That is hard to pull off in 90 minutes.

  Your 55/35 split is **too risky**. With three distinct conceptual hurdles (Pass Bands, Menu Dependence, Dilation), 35 minutes of debrief will feel like a firehose. You need the students to articulate *why* they acted that way before you tell them what it means. I recommend **40 minutes play / 50 minutes debrief**. If you rush the debrief, they leave thinking "people are weird," not "orthodoxy has a cost."

  Here is the runnable session plan, optimized for 14 students, no real money, and maximum philosophical payoff.

  ---

  # Session Plan: The Tournament of Belief

  **Total Time:** 90 Minutes
  **Materials:**
  *   14 "Decision Slips" (pre-printed, see below).
  *   2 Urns (or opaque boxes/bags).
  *   Red/Blue tokens (20 total).
  *   Whiteboard for scoreboard.
  *   1 Chocolate Bar (prize).

  **Incentive Structure:**
  *   Everyone starts with **100 Points**.
  *   Points are added/subtracted based on the outcomes of their bets.
  *   **Negative points are allowed.** (This is crucial for the "forgone gain" lesson).
  *   Top scorer wins the chocolate. (If there's a tie, random draw among leaders).

  ---

  ## Part 1: The Play (40 Minutes)

  ### Phase 1: The Price Walk (15 mins)
  *Goal: Elicit the "Pass Band" (Imprecision) vs. Sharp Indifference.*

  1.  **Setup:** Split the room.
      *   **Group K (7 students):** "Urn K contains 10 balls. A fair coin determined if there are 5 Red or 5 Blue. You know the chance is exactly 0.5."
      *   **Group U (7 students):** "Urn U contains 10 balls. The manufacturer guarantees there are between 4 and 6 Red balls. You have no reason to favor 4, 5, or 6."
  2.  **Task:** You will offer to **Buy** or **Sell** a ticket worth **100 points** if a Red ball is drawn.
  3.  **Data Collection:** Do **not** use show of hands. Hand out **Decision Slips**.
      *   List prices: 30, 40, 50, 60, 70.
      *   Columns: [Buy] [Pass] [Sell].
      *   Students mark one box per row. Collect immediately.
  4.  **Resolution:** Draw one ball from Urn K and one from Urn U. Settle points on the board.
      *   *Note:* Keep the actual draw secret until the end of class so anticipation doesn't alter later betting behavior. Tell them: "One random row from your slip will be selected for actual payout at the end." (This incentivizes truth-telling on every row).

  ### Phase 2: The Money Pump (15 mins)
  *Goal: Demonstrate Menu Dependence / Forgone Gain.*

  1.  **Setup:** Address **Group U only** (Group K sits out or observes). Remind them their credence for Red is the interval $[0.4, 0.6]$.
  2.  **The Bets:**
      *   **Bet X:** Pay 10 points to play. Win 24 points if Red. (Net: +14 Red, -10 Blue).
      *   **Bet Y:** Pay 10 points to play. Win 24 points if Blue. (Net: -10 Red, +14 Blue).
      *   **Combined:** Net +4 either way.
  3.  **Round A (Sequential):** Ask Group U: "Do you accept Bet X?" (Private Slip: Yes/No). Then: "Do you accept Bet Y?" (Private Slip: Yes/No).
      *   *Expected Result:* Imprecise agents reject both (since min EV is negative).
  4.  **Round B (Menu):** Tell them: "Imagine you were offered a menu: {Take X, Take Y, Take Both, Take Neither}." Ask them to circle one.
      *   *Expected Result:* They pick "Take Both."
  5.  **Scoring:** If they rejected both in Round A, deduct 4 points from their total (the "forgone gain"). If they picked "Both" in Round B, add 4 points.
      *   *Crucial:* Highlight the discrepancy on the board. "You lost points by being consistent."

  ### Phase 3: The Free Information Trap (10 mins)
  *Goal: Demonstrate Dilation.*

  1.  **Setup:** Whole class.
  2.  **Scenario:** "We have 100 balls, exactly 50 Red, 50 Blue. They are split into Box 1 and Box 2 (50 balls each). The manufacturer guarantees **neither box has more than 60% Red**."
  3.  **Current State:** "I draw a ball from the combined 100. What is P(Red)?" (Answer: 0.5 Sharp).
  4.  **The Offer:** "I will tell you which Box the ball came from (Box 1 or Box 2) for **free**. You can decline."
  5.  **Task:** On a slip, write "Accept Info" or "Decline Info."
  6.  **The Reveal:** Show the math on the board.
      *   If Box 1: Red $\in [0.4, 0.6]$.
      *   If Box 2: Red $\in [0.4, 0.6]$.
      *   *Result:* Unconditionally Sharp $\to$ Conditionally Imprecise.
  7.  **Scoring:** No points change. This is purely for the "Wait, what?" moment.

  ---

  ## Part 2: The Debrief (50 Minutes)

  *Do not skip the math on the board. The feeling comes from the numbers.*

  ### 1. The Pass Band (15 mins)
  *   **Display Data:** Project/Draw the Group K vs. Group U slips.
      *   Group K should show a clean flip at 50 (Buy <50, Sell >50).
      *   Group U should show a "Pass" zone (e.g., Pass at 40, 50, 60).
  *   **The Point:** Imprecision is not "I feel vague." It is "I refuse to trade at these prices."
  *   **The Dutch Book Contrast:**
      *   *Sharp Agent:* If you have a single number $p=0.5$, you must buy at 49 and sell at 51. If you don't, you are incoherent (Dutch Book).
      *   *Imprecise Agent:* You are not incoherent for passing. Your failure mode is not **Sure Loss**, it is **Forgone Gain**.
      *   *Question:* "Is it rational to pay a cost (forgone gain) to avoid the risk of a sure loss?"

  ### 2. The Midpoint Objection (10 mins)
  *   *Anticipate:* "Why not just pick 0.5 in Group U?"
  *   **Response:** "If you pick 0.5, you are a Sharp Probabilist pretending to be Imprecise. You have collapsed the set."
  *   **The Cost:** "If the urn actually had 4 Red balls (P=0.4), and you bet at 0.5, you lose in the long run. The Interval protects you from model error. The Midpoint rule assumes you know the distribution *over* the probabilities. You don't."
  *   **Philosophical Hook:** Levi's **E-admissibility**. You are not permitted to choose an option that is not optimal for *some* probability in your set. But you are also not *required* to choose the one optimal for the midpoint.

  ### 3. Menu Dependence (15 mins)
  *   **Display Data:** Show how many students lost points in Round A but gained them in Round B.
  *   **The Point:** Rational choice is **path-dependent** for imprecise agents.
  *   **The Normative Clash:**
      *   *Orthodoxy:* If X is bad and Y is bad, X+Y can't be good (Linearity of Expectation).
      *   *Imprecise:* $ \underline{E}(X) < 0 $ and $ \underline{E}(Y) < 0 $ does not imply $ \underline{E}(X+Y) < 0 $.
  *   **Discussion:** "Is it a bug or a feature that your decision changes based on how the menu is presented?" (Feature: It prevents you from taking bad bets individually. Bug: It makes you vulnerable to a clever bookie who splits the bets.)

  ### 4. Dilation (10 mins)
  *   **The Name:** This is **Dilation** (Seidenfeld & Wasserman, 1993).
  *   **The Paradox:** Free information made you *less* precise.
  *   **The Lesson:** Precision is not always the goal. **Reliability** is.
      *   Before info: "I'm precise (0.5), but if I'm wrong, I'm wildly wrong."
      *   After info: "I'm vague ([0.4, 0.6]), but I know I'm not wildly wrong."
  *   **Closing:** "Sharp credences optimize for *accuracy* if your model is right. Imprecise credences optimize for *robustness* if your model is suspect."

  ---

  ## Troubleshooting: What Will Go Wrong

  ### (a) Ellsberg vs. Imprecision
  *   **Worry:** Students think this is just ambiguity aversion (psychology).
  *   **Fix:** **Group K is your control.** If Group K (known 50/50) acts sharply and Group U acts imprecisely, it is not general risk aversion. It is sensitivity to the *structure of the evidence*.
  *   **Script:** "If this were just psychological fear, Group K would also pass. They didn't. This is a response to the evidence, not the nerves."

  ### (b) "Just Use the Midpoint"
  *   **Worry:** Students refuse to engage with the interval.
  *   **Fix:** Call it the **"Principle of Insufficient Reason" Trap**.
  *   **Script:** "Using the midpoint assumes the 'true' probability is uniformly distributed between 0.4 and 0.6. Do you have evidence for *that*? No. You have *less* evidence than that. The midpoint is a guess disguised as a calculation."

  ### (c) Confidence Intervals
  *   **Worry:** Stats students confuse Credal Sets with Frequentist Confidence Intervals.
  *   **Fix:** Be explicit about **Ontology**.
  *   **Script:** "A confidence interval is about the *procedure's* long-run performance. A credal set is about *your current permission to bet*. You are allowed to bet differently even if the long-run frequency is fixed."

  ### (d) Sparse Evidence vs. Indeterminacy
  *   **Worry:** "This is just missing data. Get more data."
  *   **Fix:** Acknowledge this is the **Weakness of the Urn Example**.
  *   **Script:** "In the urn, there is a fact of the matter. In real life (climate models, economic forecasts), there may *be* no fact of the matter. Different models give different probabilities, and no meta-model exists to weight them. That is where imprecision lives. Today's urn is a training wheel for that conflict."

  ---

  ## What The Game Cannot Deliver

  Be honest with them in the final 5 minutes.

  1.  **Dynamic Coherence:** This game shows static coherence. It does not solve the problem of how to update imprecise credences over time without becoming sharp again (the "washing out" problem).
  2.  **Decision Rules:** We used a specific rule (E-admissibility / Maximin). There are 10+ decision rules for imprecise probabilities (Gamma-maximin, Interval Dominance, etc.). The game privileges one.
  3.  **The "Why":** The game shows *that* imprecision behaves differently. It does not prove *why* you should adopt it. That requires the argument that **representing ignorance as precision is a lie.**

  ## Materials: Decision Slip Template

  ```text
  NAME: ____________________  GROUP: [ K / U ]

  ROUND 1: TICKET PAYS 100 IF RED
  Price   |  BUY  |  PASS  |  SELL
  --------|-------|--------|-------
    30    |   [ ] |   [ ]  |   [ ]
    40    |   [ ] |   [ ]  |   [ ]
    50    |   [ ] |   [ ]  |   [ ]
    60    |   [ ] |   [ ]  |   [ ]
    70    |   [ ] |   [ ]  |   [ ]

  ROUND 2: BETS (Group U Only)
  A) Bet X alone?  [ YES ]  [ NO ]
  B) Bet Y alone?  [ YES ]  [ NO ]
  C) Menu {X, Y, Both, Neither}? Circle one.

  ROUND 3: FREE INFO
  Accept Info?  [ YES ]  [ NO ]
  ```

  ## Final Advice on the "Sparse Evidence" Worry

  You asked: *If you think that's fatal, say so.*

  It is not fatal, but it is the **weak link**. The urn setup implies there is a "true" probability (propensity) that you just don't know. Imprecise Probabilists (like Joyce or Levi) often argue that in cases of genuine indeterminacy, there *is no* true sharp probability.

  **How to source the intervals differently (if you want to strengthen this):**
  Instead of an urn, use **Expert Testimony**.
  *   "10 Climate Models. 4 say P(Rain)=0.4. 3 say P(Rain)=0.5. 3 say P(Rain)=0.6."
  *   "You have no reason to trust one model over the other."
  *   This makes the interval $[0.4, 0.6]$ a representation of **conflict**, not just **ignorance**.
  *   *Trade-off:* It takes longer to explain than an urn.
  *   *Verdict:* Stick with the Urn for speed, but **explicitly pivot** in the debrief. "Treat the urn not as a physical object with a hidden frequency, but as a proxy for conflicting expert models. The 'balls' are the arguments."

  This plan respects your constraints, maximizes the "feeling" of the theory, and gives you the script to handle the inevitable pushback. Good luck with the seminar.
