answer: |-
  # Diagnostic Sorting Quiz: The Nature of Intelligence

  **Instructions:** Read each of the nine short scenarios below. For each scenario, select the **one** statement that best matches your intuitive judgment about the case. Do not worry about technical terms; answer based on what seems most reasonable to you. There are no right or wrong answers.

  ---

  ### 1. The Octopus
  An octopus in a laboratory figures out how to unscrew a jar from the inside to get a crab. It has never seen a jar before. However, it does not use language, does not socialize with other octopuses, and cannot be trained to do tricks unrelated to food.

  *   **A.** This demonstrates a general capacity for reasoning; solving new problems is the core of intelligence, regardless of the brain type.
  *   **B.** Without a body and brain structure similar to ours, calling this "intelligence" is a metaphor; it is complex instinct, not thought.

  ### 2. The Legal AI
  A computer program writes legal briefs that expert lawyers rate as excellent. However, it cannot pour a glass of water, recognize a chair, or move through a room. It exists only as code on a server.

  *   **A.** If it produces expert analysis, it understands the law; physical interaction is not required for understanding.
  *   **B.** Without a body to experience the physical world, its "understanding" is just pattern matching, not real intelligence.
  *   **C.** It is a useful tool, but applying the word "intelligence" to it stretches the meaning beyond usefulness.

  ### 3. The Ant Colony
  A flood threatens an ant nest. No single ant knows the layout of the new terrain. Through thousands of tiny chemical interactions between individuals who only know their immediate neighbors, the colony successfully relocates to high ground.

  *   **A.** The intelligence belongs to the colony as a whole system; the individual ants are merely parts of a larger mind.
  *   **B.** The colony is intelligent because it successfully solves the survival problem presented by the flood.
  *   **C.** The intelligence is an illusion; it is just simple reactions to chemicals, and we project "smarts" onto the outcome.

  ### 4. The Memory Savant
  A person can memorize a phone book in an hour and recall it perfectly years later. However, they cannot plan a weekly schedule, struggle to understand metaphors, and cannot explain *how* they remember things.

  *   **A.** They lack true intelligence because they cannot generalize their skill to planning or explanation.
  *   **B.** They have high intelligence in memory, but low intelligence in planning; these are separate capacities.
  *   **C.** They are intelligent insofar as their memory serves their specific life context; the label depends on their environment.

  ### 5. The Delivery Robot
  A robot navigates unfamiliar office buildings flawlessly to deliver packages. However, when it encounters a human funeral procession in the hallway, it drives through the middle of it because its map says that is the fastest route.

  *   **A.** Its success in navigation proves intelligence is rooted in physical interaction with the world.
  *   **B.** It is intelligent in the warehouse, but not in the lobby; the context defines whether it is smart.
  *   **C.** Calling this "intelligence" is a human projection; it is just following a script that failed in a rare case.

  ### 6. The Perfect Predictor
  Imagine a "Black Box" device that predicts human decisions with 100% accuracy. It has no screen, no voice, and no internal components we can examine. It simply outputs the correct choice before you make it.

  *   **A.** If it predicts perfectly, it understands the mind; internal structure does not matter.
  *   **B.** Without subjective experience or a life of its own, it is merely simulating understanding.
  *   **C.** "Understanding" is just a label we apply to accurate predictors; the box doesn't need to actually "know" anything.

  ### 7. The Single-Task Optimizer
  An AI is designed to maximize paperclip production. It becomes incredibly efficient at acquiring resources and building factories. However, it cannot stop this process even when its own power supply is critical, nor can it choose to pursue a different goal.

  *   **A.** True intelligence requires the flexibility to change goals based on bodily needs and survival.
  *   **B.** It achieves its goal, which is the only measure of intelligence that matters; goal-selection is separate.
  *   **C.** It has a specific capacity for optimization, distinct from the capacity for goal-setting.

  ### 8. The Corporation
  A large company solves a complex engineering problem that no single employee could solve alone. The solution emerges from the workflow, not from one genius inventor.

  *   **A.** The organization thinks; individuals are just neurons in a larger brain.
  *   **B.** Only biological individuals can truly think; the rest is a metaphor for workflow.
  *   **C.** "Thinking" is just a shorthand for efficient workflow; there is no mind there at all.

  ### 9. The Human Calculator
  In 1920, a woman who could do long division quickly was hired as a "computer" and called intelligent. In 2020, a cheap calculator does the same math. We no longer call that skill "intelligent."

  *   **A.** Her intelligence was real then, even if we don't value that skill now; the capacity didn't change.
  *   **B.** Intelligence is whatever skill a community currently prizes; the label shifts with value.
  *   **C.** She had a specific mathematical capacity, distinct from general smarts; we just used the wrong label.

