  ### Step 2: Map Patterns to Positions

  Identify the view(s) with the highest relative score (e.g., 5/6 is stronger than 3/4).

  1.  **The Unitary Pattern (High U):** You judge intelligence by **correlation and generalization**. If an entity solves hard problems in one domain, you expect it to have a underlying capacity that should transfer to others. You tend to view failures to generalize (like the Savant or Robot) as evidence of a lack of true intelligence, rather than a different *kind* of intelligence.
      *   *Functional Definition:* Intelligence is substantially one general capacity manifest across domains.

  2.  **The Pluralist Pattern (High P):** You judge intelligence by **independence of faculties**. You are comfortable saying something is "smart" at memory but "dumb" at planning, or that a group can think even if individuals cannot. You see intelligence as a collection of largely independent capacities with no meaningful single score.
      *   *Functional Definition:* There are several largely independent capacities with no meaningful single score.

  3.  **The Adaptive Pattern (High A):** You judge intelligence by **success in context**. You focus on whether the entity achieves its goals within its specific environment. An entity can be intelligent in the warehouse but not the lobby. Intelligence is centrally success at achieving goals within a particular environment.
      *   *Functional Definition:* Intelligence is centrally success at achieving goals within a particular environment.

  4.  **The Embodied Pattern (High E):** You judge intelligence by **physical grounding**. You are skeptical of disembodied processing (like the AI server) or non-biological structures (like the Octopus, if viewed as too alien). You believe intelligence cannot be correctly attributed to an isolated brain or program apart from body and situation.
      *   *Functional Definition:* Intelligence cannot be correctly attributed to an isolated brain or program apart from body and situation.

  5.  **The Deflationary Pattern (High D):** You judge intelligence by **social valuation**. You focus on whether the term "intelligence" is useful or merely a projection. You suspect that what we call intelligence is not a natural property of the entity, but a folk evaluative term tracking what a community happens to prize.
      *   *Functional Definition:* Intelligence is not a natural kind but a folk evaluative term tracking what a community happens to prize.

  ### Step 3: Logical Space Analysis

  **Unoccupied Combinations:**
  *   **The "Real Fiction" Paradox (High Unitary + High Deflationary):** It is logically incoherent to score maximally on both Unitary and Deflationary views. The Unitary view posits that intelligence is a *natural capacity* that exists independently of human opinion (e.g., the Octopus has it regardless of whether we label it). The Deflationary view posits that intelligence is *not a natural capacity* but a label we apply based on value. One cannot consistently hold that intelligence is a single, mind-independent fact of nature *and* simultaneously hold that it is merely a social construct with no basis in natural kind. If you scored high on both, your judgments may be context-dependent rather than theoretically consistent.

  **Indistinguishable Positions (Overlap Warning):**
  *   **Adaptive vs. Embodied:** This quiz cannot reliably separate the Adaptive and Embodied views. Both views prioritize the environment and the situation over internal processing. An Embodied theorist argues you need a body to be intelligent; an Adaptive theorist argues you need success in an environment. In concrete vignettes (like the Robot or Octopus), these positions often recommend the same answer (e.g., "The server isn't intelligent because it isn't in the world" fits both). Distinguishing them requires abstract metaphysical questions about the *necessity* of biology versus the *contingency* of success, which this vignette-based quiz intentionally avoids.
  *   **Pluralist vs. Deflationary:** There is significant overlap when discussing social value (Item 9). A Pluralist might say "Math is one type of intelligence," while a Deflationary might say "Math is what we value." In practice, these yield similar judgments about the Human Calculator case.

  **Recommendation for Seminar Discussion:**
  Students who score high on **Adaptive** or **Embodied** should be grouped to discuss the role of the environment. Students who score high on **Unitary** or **Pluralist** should debate the structure of cognitive capacity. Students with high **Deflationary** scores should be asked to critique the assumptions of the other four groups.
