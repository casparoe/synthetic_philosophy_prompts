  Here is the breakdown of the bet. I'm treating this as a subjective degree of belief based on internal coherence and normative force, not empirical frequency.

  **Overall Credence: 0.42**

  I'm placing this just below the coin-flip threshold. The recursive co-authorship view is normatively attractive but technically precarious. Here is the decomposition:

  ### The Decomposition

  **(a) Democratic legitimacy is about authorship not affectedness: 0.75**
  *Reasoning:* "All affected interests" (AAI) is practically unworkable because causality is infinite (a US election affects climate policy which affects a farmer in Kenya). If *everyone* is affected, *no one* is distinctively a member. Authorship captures the specific good of democracy: self-government. However, I can't go higher than 0.75 because pure authorship risks excluding vulnerable populations who are subject to coercion but lack capacity to author (children, the severely disabled), requiring a hybrid view anyway.

  **(b) "Active contestation" can be pinned down without circularity: 0.40**
  *Reasoning:* This is the technical bottleneck. To know who can contest the law, you must know who is in the demos; to know who is in the demos, you must know who can contest. This is the *boundary problem regress* (Whelan, 1983). While "embeddedness" tries to solve this sociologically, it often smuggles in a prior normative assumption about where the boundary lies. It is very hard to define the practice without presupposing the participants.

  **(c) Long-term residents meet the bar while absentee passport-holders don't: 0.80**
  *Reasoning:* This is the strongest application of the theory. Residents are enmeshed in the daily coercive and cooperative fabric of the state; absentee citizens are often merely beneficiaries of a brand or insurance policy. The distinction tracks well with the "mutual lawmaking" criterion. I keep this high because even if the theory fails elsewhere, it succeeds here.

  **(d) Probability that the "membership shouldn't be earned" intuition is mistaken: 0.55**
  *Reasoning:* You asked for the weight of the intuition that membership *shouldn't* be earned. For your theory to hold, that intuition must be *wrong* (since co-authorship implies a form of earning/maintenance). I give a slight edge (0.55) to the idea that birthright is a heuristic for stability, not a moral absolute. However, the intuition is powerful: making membership contingent on "active contestation" risks creating a class of denizens subject to law but without voice, which violates the very coercion principle the theory tries to uphold.

  ### Combination Logic
  I am not multiplying these strictly (which would yield a dismal ~0.13) because philosophical conditions aren't independent boolean switches. Instead, I'm using a **weighted constraint model**.
  *   (a) and (c) pull the credence up (strong normative and practical fit).
  *   (b) acts as a hard ceiling (if circularity can't be solved, the theory collapses).
  *   (d) acts as a friction coefficient (social resistance to "earned" citizenship).
  *   *Calculation:* Average of (a, c, d) is 0.70. Discounted by the feasibility risk of (b) [0.40/0.50 weight], we land at **0.42**.

  ### The Shakiest Term
  **Term (b): The Circularity Problem.**
  This is the classic *demos* paradox. If membership is defined by participation in a practice, who defines the practice? If you say "those currently inside," you've presupposed the boundary you're trying to solve. If you say "those affected," you've reverted to AAI. If you say "those culturally embedded," you've reverted to ethno-nationalism. Pinning down "active contestation" without smuggling in a prior boundary assumption is the weakest link.

  ### The Conceptual Argument to Move the Number
  To move my number from **0.42 to >0.60**, I need an argument that dissolves the circularity in (b) without reverting to birthright.

  **The Argument: Constituent vs. Constituted Power.**
  You need to distinguish between the *demos* as a voting body (constituted power) and the *demos* as a public sphere of discourse (constituent power).
  *   **Move:** Argue that *contestability* is open to all subject to coercion (affectees), but *authorship* (voting/office) is restricted to those embedded in the reciprocal maintenance of the system (residents).
  *   **Why it works:** It breaks the circle. You don't need to be a member to contest (you just need to be coerced), but you need to be a member to decide. This preserves the "recursive" nature for members while satisfying the legitimacy concern for non-members. It turns the boundary from a wall into a membrane.

  ### The Friend's Objection (Exit vs. Enter)
  Your friend argues the real issue is **exit**, not entry. This changes the decomposition significantly, specifically targeting **(a)**.

  *   **Impact:** If legitimacy is secured by the *right to leave* (Hirschman's Exit) rather than the *right to speak* (Voice), then the boundary problem matters less. If borders are porous, the "who belongs" question loses its stakes.
  *   **Adjustment:** If the Exit thesis is correct, the need for a precise "recursive co-authorship" definition diminishes. We don't need to solve the boundary problem if the boundary is permeable.
  *   **Verdict:** This lowers my overall credence in the *necessity* of your solution. If exit is the primary safeguard, then "birthright" is fine as long as expatriation is easy. Your theory solves an entry problem that might be a proxy for an exit problem.
  *   **New Credence:** If I accept the Exit thesis, my credence in your specific solution drops to **0.25**, because it becomes a solution to a secondary problem.

  **Summary:** The theory is elegant and handles the expat/resident distinction well (c), but it stalls on the circularity of defining the practice (b). Your friend is right that if exit were costless, we wouldn't need such a precise theory of entry—but since exit is costly (statelessness, loss of assets), the entry boundary remains the high-stakes variable. I'm sticking with 0.42.
