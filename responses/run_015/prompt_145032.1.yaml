      *   *Revision:* To make the "enforcement" point sharp, let's focus on the *capacity to resist*. If women control the supply chains or the local networks necessary for tax collection or militia provisioning, their power is real.
      *   *Version 1:* Women are secluded, men control all public exchange.
      *   *Version 2:* Economic shift (war/blockade) makes women's management of local markets and credit essential for the state's revenue and order.

