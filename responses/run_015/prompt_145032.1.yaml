  2.  **Deconstruct the Spinozist Framework:**
      *   *Natural Right:* Coextensive with power (*Ethics* IV, *TP* II). Right is not a moral claim but a factual capacity.
      *   *Sovereign Power:* Limited by what it can actually enforce. A law that cannot be enforced is bad law (*TP* III, *TTP* XVI).
      *   *Obedience:* The multitude cannot be brought to obey laws that go against their fundamental conatus (striving).
      *   *Transfer of Right:* Nobody transfers their whole nature to the sovereign (*TP* III). People retain power.
      *   *Democracy:* The most natural regime because it aligns sovereign right with the power of the multitude (*TP* VIII).
      *   *Women:* Spinoza claims in *TP* XI that women are naturally inferior in power/rationale (contested whether this is empirical or principled). To argue against this without modern morality, one must show that *regardless* of natural inferiority claims, the *political* reality of their power necessitates inclusion for stability.

  3.  **Drafting the Scenario:**
      *   Setting: 1670s Dutch Republic (regent oligarchy leaning towards democracy).
      *   Version 1 (Dispensable): Women's labour is domestic, replaceable, or not critical to the economic/military engine that enforces sovereign will.
      *   Version 2 (Indispensable): Women's labour (e.g., specific trade, logistics, intelligence, or economic backbone) is critical. If they withdraw cooperation, the sovereign collapses.
