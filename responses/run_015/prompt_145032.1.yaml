      *   *Refinement on Vote:* In *TP* VIII, Spinoza argues democracy is the most absolute state because it transfers least natural right. If women retain significant power (Version 2), excluding them means the sovereign is *less* absolute, more prone to conflict. To maximise sovereign power (which is the goal), you incorporate that power into the decision-making structure.

  7.  **Final Polish:**
      *   Ensure the scenario sounds 17th-century.
