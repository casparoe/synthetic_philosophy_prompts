      *   *Step 2 (Sovereign Limit):* If the sovereign excludes them but needs them, the sovereign's right is diminished.
      *   *Step 3 (Enfranchisement vs. Concession):* Why vote and not just bribes? Because stable democracy requires aligning *imperium* with *potentia*. If the power is structural, co-optation is unstable.
      *   *Step 4 (Contested vs. Settled):* Acknowledge the debate on Spinoza's sexism (empirical vs. normative) and the right=power equation.

  5.  **Addressing the Friend's Objection (The "Buy Them Off" Reply):**
      *   Hobbesian/Spinozist realpolitik: You don't need to give votes, just enough satisfaction to prevent rebellion.
      *   Counter: Spinoza's democracy is about *freedom* as stability. A regime resting on manipulation is less stable than one resting on rational alignment. If the power is pervasive, formal inclusion reduces the friction of enforcement.
