answer: |-
  In the port city of Amsterdam, 1672, the Regents govern a commonwealth where suffrage is restricted to male guild masters. In the first version of this commonwealth, the economy is stagnant; men control all visible trade, credit, and logistics, while women remain largely within domestic spheres whose economic output is easily replaced or managed by male relatives. The sovereign imposes a tax on household goods. The women resent this, but because their labour is dispensable to the collection mechanisms and the men who hold the vote control the necessary force to seize goods, the tax is collected without sedition. The sovereign's power remains intact despite the exclusion. In the second version, war with France and England has conscripted most guild masters to the frontiers. Women now manage the warehouses, control the local credit networks required to pay the militia, and organise the distribution of grain necessary to prevent famine. The sovereign imposes the same tax. Here, the women can silently withhold the credit and logistics required to convert the tax into actual revenue or to feed the soldiers who would enforce it. Their refusal does not look like open rebellion, but the sovereign's commands simply cease to have effect in the material world. The exclusion remains in law, but the power dynamic has shifted.

  The sovereign's right in the first scenario remains coextensive with its power because the excluded group lacks the capacity to disrupt enforcement. Spinoza defines natural right as coextensive with natural power (*TP* II.3); therefore, in the first version, the women's lack of disruptive capacity means their exclusion generates no tension within the sovereign's *jus*. The pressure to enfranchise arises in the second scenario because the sovereign's right is literally diminished by the law it seeks to enforce. If the sovereign commands what it cannot execute due to the withheld cooperation of a powerful group, its right shrinks to match its actual capacity (*TP* III.6). In the second version, the law excluding women from counsel becomes self-defeating because the sovereign lacks the *potentia* to impose its will without their active concurrence.

  Enfranchisement becomes a necessity of state stability rather than a moral concession because democracy maximises the sovereign's power by aligning *imperium* with the multitude's *conatus*. Spinoza argues that a regime is most stable when it minimises the reasons for the multitude to resist, which occurs when laws align with the subjects' own striving (*TP* III.9). In the second scenario, where women's power is indispensable, excluding them from the decision-making structure creates a permanent friction that weakens the state against external enemies. By incorporating them into the counsel of the state, the sovereign transforms their independent power into constituent power, making the state's decisions more informed and their execution more automatic.

  Your friend's objection that material concessions suffice fails because co-optation is less stable than institutional integration when the power is structural rather than factional. A Hobbesian sovereign might buy off a specific leader or grant a temporary exemption, but Spinoza's democratic ideal seeks to reduce the reliance on fear and manipulation which weaken the state's vitality (*TTP* XVI). If the women's power is embedded in the daily economic reproduction of the commonwealth, as in the second scenario, bribes are unsustainable costs that remind the subjects of the sovereign's dependence. Formal inclusion removes the friction of enforcement permanently by making the women's striving part of the sovereign's own striving, whereas concessions leave the structural conflict intact.

  This reconstruction relies on a contested reading of Spinoza's metaphysics of power, specifically whether *jus* = *potentia* allows for normative critique of existing exclusions. It is settled scholarship that Spinoza explicitly excludes women in the *Political Treatise* (XI.4), claiming they are naturally inferior in power; however, scholars like Moira Gatens argue this is an empirical inconsistency with his own metaphysics rather than a principled necessity. My argument assumes the latter: that if the empirical reality shifts (as in the second scenario), the metaphysical commitment to power-as-right forces a revision of the exclusion. If one reads Spinoza's claim about women as a universal natural truth rather than a historical observation, the pressure vanishes, but this risks making his political science unhistorical, contrary to his method in the *TTP*.

  The single feature doing the work is the indispensability of the excluded group's cooperation for the enforcement of sovereign commands. If you remove this variable and return to the first scenario, the Spinozist pressure dissolves because the sovereign retains the capacity to enforce its will without the women's consent; there is no loss of power, hence no loss of right. The argument does not claim women *should* vote because they are equal in dignity, but that the sovereign *must* include them to maintain its own absolute power when their cooperation becomes the bottleneck of enforcement.

  Ultimately, the strongest version of your friend's reply is that Spinoza's system prioritises the persistence of the state over the form of the regime, allowing for stable oligarchy if the power balance permits. She can argue that even in the second scenario, the Regents could disarm the women's power by restructuring the economy or using divide-and-rule tactics rather than granting suffrage, preserving the form of government while adjusting the power balance. This is a live interpretive possibility: Spinoza may view democracy as the most natural regime, but not the only viable one if the sovereign can successfully manipulate the multitude's affects (*TP* I.6). To defeat this, you must show that in a commercial republic like the Dutch case, restructuring the economy is costlier than expanding the franchise, making democracy the path of least resistance for sovereign self-preservation.
