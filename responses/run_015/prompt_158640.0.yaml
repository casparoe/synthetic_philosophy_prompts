answer: |-
  **Miles:** You read the latest on patient K.H.? The biofeedback setup?

  **Sarah:** The one where the brainstem stays intact but the corpus callosum is severed? Yeah. Weird stuff.

  **Miles:** Weird doesn't cover it. Look, here's the kicker. They trigger an emotional stimulus—say, a sudden loud noise. The brainstem fires off adrenaline, cortisol, the whole somatic cocktail. Both sides get the exact same bodily arousal. Same heart rate spike, same sweat response.

  **Sarah:** Exactly. That's the unity argument right there. The *feeling* of arousal is singular. You can't have half a sweat gland response. It proves there's still one subject experiencing the state, even if their access to motor control is fragmented.

  **Miles:** But does it? Think about it like a server. Two separate computers can be wired to the same sensor. If the temperature rises, both get the alert. Doesn't mean they're the same computer.

  **Sarah:** But computers don't *feel* the heat, Miles. They just process data. We're talking about phenomenology. If the qualitative experience of the adrenaline surge is shared, the subject must be shared. Otherwise, who's feeling the rush?

  **Miles:** Two whos. That's the thing. The left hemisphere—the speaking side—gets that arousal signal and narrates it. It says, "I'm feeling a bit excited about the test." But simultaneously, the right hemisphere controls the left hand, and it's gripping the armrest white-knuckled. Defensive. Scared.

  **Sarah:** So one side is lying?

  **Miles:** No, not lying. Interpreting. The left side is doing what it always does, making sense of the noise. It feels the buzz and rationalises it as excitement. The right side feels the same buzz and acts on it as fear. Same fuel, different engines.

  **Sarah:** I think you're conflating cognitive access with conscious subjecthood. Just because the LH can't access the RH's motor command doesn't mean there's a separate 'person' in there. It's one person with a divided workspace. The post-hoc rationalisation is just the brain trying to maintain a coherent narrative despite the wiring fault.

  **Miles:** But whose narrative? If the RH is genuinely experiencing fear—which the grip strength suggests—and the LH is genuinely experiencing excitement, you've got contradictory mental states occurring simultaneously in one skull. You can't resolve that into one subject without saying the person is just profoundly confused.

  **Sarah:** People are profoundly confused all the time. That doesn't make them two people. Look, the shared arousal is the anchor. If they were truly distinct subjects, you'd expect divergent physiological states too, right? But the brainstem binds them. They're sharing the same emotional bedrock.

  **Miles:** They're sharing the same *feed*. Not the experience. Imagine I plug a VR headset into your nervous system. We both feel the same wind. I say it's a breeze, you say it's a gale. The data is identical, but the subjects processing it are distinct. The LH's verbal report isn't the truth of the person; it's just the LH's truth.

  **Sarah:** But there's no 'LH person'. There's just the left hemisphere. It's a part, not a whole. If you cut off my hand, it doesn't become a new person.

  **Miles:** But if the hand could write notes saying it wants to live separately from you...

  **Sarah:** *laughs* Fair point. But in this scenario, the arousal is the glue. The fact that they both *feel* the spike simultaneously suggests a unified field of awareness that's just bottlenecked on output. The LH isn't a separate subject rationalising; it's the same subject struggling to articulate a fractured state.

  **Miles:** I dunno. Feels like we're saying "one person" just because it's less unsettling than "two people in a trenchcoat". If the left side says "I'm calm" while the right side is practically punching the air from fear, theres a rupture in the self. Shared physiology doesn't fix that.

  **Sarah:** Maybe. But until you can show me two distinct streams of *qualia* rather than just two streams of behaviour, I'm sticking with one person. A confused, divided person, but one nonetheless.

  **Miles:** Guess we'll need a better experiment then. Or a better definition of 'person'.

  **Sarah:** Cheers to that. Another pint?

  **Miles:** Yeah, go on. My treat. Feeling a bit too excited about it, apparently.

  **Sarah:** *grins* Just don't let your left hand order for you.
