  Write a short dialogue between a philosopher who thinks split-brain patients literally contain two concious subjects and one who thinks there's still only a single person with a divided access structure. Don't just retread the classic experiments—focus on a made-up scenario where the left hemisphere can verbally report intentions, but the right hemisphere controls a seperate limb that reacts to emotional stimuli through a shared brainstem pathway, so both sides feel the same bodily arousal but realise it differently. Have them argue whether that shared arousal proves one experiencing subject or just two subjects wired to the same autonomic feed, and whether the left hemisphere's verbal report is just post-hoc rationalisation. Make sure neither is a strawman; they should actually respond to each other's points rather than talking past one another. British spelling, casual tone—maybe drop a typo or two if it feels natural.
