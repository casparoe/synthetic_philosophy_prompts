          *   Vera's Theory: "The Ledger." Ethics depends on whether a system integrates aversive/appetitive signals into a single scalar quantity to rank actions against counterfactuals. Matters is the *width* of the ledger. No ledger = nothing at stake. The "missing bookkeeper" problem (decomposition is observer-relative).
          *   The Dilemma: Cannot claim she hears/is glad (violates her theory if no bookkeeper). Cannot claim she has a soul (false). Cannot claim "we simply cannot know" (her theory says work starts there). Must be honest but not cruel to family (especially the Christian son who fears she's trapped). Must be accessible to non-experts but rigorous enough for experts. Must end concretely (what the speaker will say to her afterwards).
          *   Tone: Honest, honoring, not grotesque, no rationalist-blogosphere clichés (no "shut up and multiply," no substrate independence hand-waving, no nematode jokes), no condescension.
