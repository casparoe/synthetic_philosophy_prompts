      *   *The Risk:* Saying "she hears us" implies a listener (bookkeeper) exists. Saying "she doesn't" hurts the son who talks to her. Saying "we don't know" is lazy according to her theory.
      *   *The Solution:* Focus on the *practice* of care and the *legacy* of the question, rather than the *state* of the subject. Honor the *question* she asked, not just the answer. Acknowledge the uncertainty as a call to action (care), not a verdict. Frame the act of speaking to her as *our* commitment, regardless of *her* reception.

