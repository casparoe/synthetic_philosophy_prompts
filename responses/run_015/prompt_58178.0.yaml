      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like an internal administrative document, not an activist manifesto. Use words like "fiduciary," "reputation," "risk," "mission."

  5.  **Drafting the Memo (incorporating the "Strongest Objection" requirement):**
      *   *Objection Focus:* The "Presentism/Agency" argument (current people aren't responsible) and the "Performative vs. Material" argument.
      *   *Integration:* I will create a specific section called "Addressing Primary Concerns."

  6.  **Final Review against Constraints:**
      *   Two pages? (Aim for ~800-1000 words).
      *   Concrete path? (Yes: Apology + Exhibit + Targeted Scholarship).
      *   Practical steps? (Yes: Timeline and Roles).
      *   Strongest objection addressed? (Yes: The "Not Our Sin/Empty Gesture" argument).

  7.  **Final Polish:** Check formatting and clarity. (Proceeding to generate output based on this plan).

  *(Self-Correction Note on "Splitting the Difference"):* The prompt warns against just splitting the difference. If I recommend Apology + Scholarship, is that a compromise? No, if the *logic* is that the scholarship is the *material component of the apology*, it's a cohesive strategy, not a compromise. The Trustees want Scholarship *instead* of Apology. The Descendants want Apology + Exhibit. My recommendation will be Apology + Exhibit + Scholarship (as Repair). This honors the Descendants' demand for truth while addressing the Trustees' desire for material action, but crucially *links* them causally. I must make sure this distinction is clear so it doesn't look like I'm just giving everyone a little bit of what they want. The core shift is the *admission of harm*.

