          *   Archives/Exhibit Team: Curate the lobby display.
          *   Community Liaison: Work with descendants.
          *   Timeline: October (Decision) -> Founders Day (Apology) -> Next Academic Year (Exhibit/Scholarship).
      *   **Conclusion:** Final persuasive push.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is two pages enough?
