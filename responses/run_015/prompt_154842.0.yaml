  hey im an ops researcher who deals with supply-chain failures, not a philosopher, and i need help reframing Amartya Sen's famine-as-political-crime argument in my own terms. specifically, can you restate his analysis of Bengal 1943 (the price divergence vs direct entitlement collapse), the Irish famine (food exports continuing despite local starvation), and the Great Leap Forward (high procurement ratios masking harvest failure) using only logistics vocabulary — demand forecasting errors, inventory buffers, procurement contracts, bullwhip effects, and entitlement failure as an access-rights breakdown? be precise. then give me the residue report: which parts map cleanly onto supply-chain failures, which parts you had to distorte (like treating moral responsibility as a contract breach), and which parts have no analouge at all in logistics. also, does my framewrk sneak in assumptions that weaken Sen's claim, or is the residue just stuff logistics genuinely can't express?
