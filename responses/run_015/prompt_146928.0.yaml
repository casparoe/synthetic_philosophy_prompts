answer: |-
  Here is a conceptual map of the desiderata for a theory of consciousness, broken down by category, flagged by necessity, and stress-tested against the contradictions you identified. Following that is the scorecard for Integrated Information Theory (IIT).

  ### Part 1: The Desiderata Spec for Consciousness Theories

  To be considered adequate, a theory must satisfy requirements across three domains: Empirical Fit, Structural Mechanism, and Metaphysical Coherence.

  #### A. Empirical Fit (The "Must-Haves")
  These are non-negotiable. If a theory contradicts these, it is falsified by current data.

  1.  **The Wake/Unconscious Boundary:** The theory must distinguish between states where consciousness is present (wakefulness, vivid dreaming) and absent (deep sleep, general anesthesia, coma).
      *   *Reasoning:* Any theory that claims you are conscious during deep dreamless sleep or unconscious during wakefulness fails the basic sanity check.
  2.  **Split-Brain Compatibility:** The theory must account for the duality of awareness in commissurotomy patients without positing magic.
      *   *Reasoning:* Clinical data shows independent streams of awareness (e.g., left hand vs. right hand conflict). A theory claiming a single unified "self" here is empirically wrong.
  3.  **The Posterior Hot Zone (REM/Dissociation):** The theory must allow for conscious experience without prefrontal executive control.
      *   *Reasoning:* In REM sleep and certain psychedelic states, prefrontal integration collapses, yet vivid experience remains. A theory requiring frontal "global broadcast" for *experience* (as opposed to *reporting*) fails here.

  #### B. Structural Mechanism (The "How")
  These explain *why* physical systems generate experience. Some are non-negotiable, others are theoretical preferences.

  4.  **Recurrent Processing Requirement (Non-Negotiable):** The theory must rule out purely feedforward architectures.
      *   *Reasoning:* Intuition and masking experiments suggest that information passing through a system without feedback loops (like a simple reflex or a feedforward neural net) does not generate subjective experience.
  5.  **Causal Power (Non-Negotiable):** The system must make a difference to itself.
      *   *Reasoning:* A system that is epiphenomenal (inputs determine outputs, but the internal state doesn't constrain its own future) lacks the agency associated with being a "subject."
  6.  **Substrate Neutrality (Camp Preference):** Does the material matter?
      *   *Functionalists say:* No. Silicon, biology, or gears work if the computation is right.
      *   *Biological Naturalists say:* Yes. Only specific biophysical causality works.
      *   *Verdict:* Not strictly non-negotiable, but a theory must pick a lane and justify it.
  7.  **Temporal Grain Neutrality (Camp Preference):** Does the speed of processing matter?
      *   *Reasoning:* If a silicon system runs at GHz and biology at Hz, is the consciousness "faster," "more intense," or the same? A theory should specify if time is intrinsic to the *amount* of consciousness or just the *container*.

  #### C. Metaphysical Coherence (The "Boundaries")
  This is where the hardest logical problems live.

  8.  **The Exclusion Principle (Non-Negotiable):** Consciousness must be definite in space and time.
      *   *Reasoning:* You cannot have overlapping subjects of experience in the same place at the same time. There is not a "big consciousness" and a "small consciousness" occupying your brain simultaneously. There is just *what it is like to be you*.
  9.  **System Boundary Definition (Non-Negotiable):** The theory must provide a mathematical or logical rule for where one conscious entity ends and another begins.
      *   *Reasoning:* Without this, you cannot solve the Exclusion problem or the Split-Brain problem. You need a "cut" mechanism.

  ---

  ### Part 2: The Consistency Check (Is the Spec Broken?)

  You suspected that **Strict Exclusion** (one system = one mind) clashes with **Split-Brain Co-consciousness** (one brain = two minds).

  **Verdict:** They are **not jointly unsatisfiable**, but only if the theory redefines "System."

  *   **The Conflict:** If you define a "system" by the skull (one brain), then Exclusion says "one mind," but Split-Brain data says "two minds." Contradiction.
  *   **The Resolution:** The theory must define a "system" by **causal integration**, not physical container.
      *   In a healthy brain, the corpus callosum integrates the hemispheres into *one* causal system $\rightarrow$ One consciousness (satisfies Exclusion).
      *   In a split brain, the causal link is severed. The physical skull now houses *two* distinct causal systems $\rightarrow$ Two consciousnesses (satisfies Split-Brain data).
  *   **The Catch:** This requires the theory to be able to detect "causal seams" dynamically. If a theory relies on anatomical boundaries (like "the brain"), it fails. If it relies on informational boundaries (like "the maximum integrated unit"), it survives.

  **Another Tension: Substrate Neutrality vs. Temporal Grain.**
  If you allow silicon consciousness (Substrate Neutrality) but insist on biological time scales (Temporal Grain), you create a conflict. If a computer simulates a brain 1,000,000x faster, does it have 1,000,000x more "moments" of consciousness per second?
  *   **Unsatisfiable Subset:** If a theory claims "Consciousness is substrate neutral" AND "Consciousness requires biological millisecond dynamics," it is broken. It must choose: either time is relative to the system's clock (neutral) or absolute to biology (non-neutral).

  ---

  ### Part 3: IIT Scorecard

  Here is how Integrated Information Theory (IIT) 3.0/4.0 scores against your specific requirements.

  #### 1. The Exclusion Problem
  *   **Score:** **Pass (Core Feature)**
  *   **Reasoning:** IIT builds this directly into its axioms. The "Exclusion Postulate" states that experience is definite: it flows from the *Maximum* of Integrated Information ($\Phi_{max}$).
  *   **How it works:** If you have overlapping sets of elements, IIT calculates $\Phi$ for all subsets. Only the subset with the absolute highest $\Phi$ exists as a conscious entity. Elements outside that maximum are excluded. This prevents "overlapping consciousnesses" by mathematical fiat.

  #### 2. Split-Brain Data
  *   **Score:** **Pass**
  *   **Reasoning:** Because IIT defines the boundary by causal integration ($\Phi$), cutting the corpus callosum reduces the integration between hemispheres.
  *   **How it works:** If the integration *within* the left hemisphere is higher than the integration *across* the hemispheres, IIT predicts the single system splits into two maxima. It predicts exactly what the clinical data shows: two separate subjects of experience inhabiting one skull.

  #### 3. Feedforward Networks (The "Blocker" Test)
  *   **Score:** **Pass**
  *   **Reasoning:** IIT requires recurrent connectivity for integration.
  *   **How it works:** In a purely feedforward network, the past state of the system does not constrain the current state of the system in a way that creates irreducible cause-effect power. $\Phi$ calculates to zero. IIT explicitly claims these systems are "zombies" (functionally active, phenomenally dark).

  #### 4. REM Sleep / Posterior Integration
  *   **Score:** **Pass**
  *   **Reasoning:** IIT 3.0 shifted focus from "frontal global workspace" to the "posterior hot zone."
  *   **How it works:** IIT predicts that consciousness correlates with the area of the brain that maintains high integration during sleep. The prefrontal cortex disconnects during REM (explaining the lack of logical control/reporting), but the posterior parietal/occipital regions remain highly integrated. IIT predicts consciousness exists there, matching the phenomenology of vivid dreaming without executive control.

  #### 5. Temporal Scale / Silicon Dynamics
  *   **Score:** **Mixed / Nuanced**
  *   **Reasoning:** IIT is substrate-neutral but time-sensitive.
  *   **How it works:** IIT calculates $\Phi$ over a specific "temporal window" intrinsic to the mechanism.
      *   *The Good:* It allows silicon to be conscious if the causal structure is preserved.
      *   *The Weird:* IIT suggests the *speed* of the system determines the *rate* of experience. A silicon system running 1,000,000x faster than a brain would technically experience 1,000,000 "moments" of $\Phi$ in the time a human experiences one.
      *   *The Critique:* Some philosophers find this counterintuitive (does speeding up a video make the characters more conscious?). IIT says yes, effectively, because existence is defined by cause-effect power per unit of intrinsic time. It satisfies "Temporal Neutrality" but at the cost of making consciousness density dependent on clock speed.

  ### Summary for Your Discussion
  *   **The Spec:** You need a theory that defines boundaries by *causality*, not anatomy, to solve the Exclusion/Split-Brain tension.
  *   **The Trap:** Don't let anyone slide on "Substrate Neutrality" without defining how they handle Time. Those two are linked.
  *   **IIT Status:** It is currently the only major theory that treats Exclusion and Split-Brain as mathematical features rather than bugs. Its weakness isn't empirical fit (it fits the data you listed well); its weakness is panpsychism implications (if $\Phi$ is the metric, simple systems might have tiny bits of consciousness) and the difficulty of calculating $\Phi$ for large systems.

  This should give you enough structure to challenge your friend on whether they prioritize *empirical fit* (where IIT shines) or *intuitive metaphysics* (where IIT gets weird with time and panpsychism).
