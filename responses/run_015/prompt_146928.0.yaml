  I've been readin up on consciousness theories for a course and I'm kind of stuck on what the actual requirements even are. Before I compare IIT with global workspace or anything else, I want the full desiderata spec: what does any adequate theory of consciousness have to deliver? Like, it needs to address the exclusion problem—why shouldn't there be overlapping consciousnesses inside the same physical system?—and it has to be consistent with split-brain clinical data where it really looks like two awareness streams can coexist after the corpus callosum is cut. It also can't just call any feedforward network conscious because its input-output profile matches a human's, since intuitively those architectures aren't conscious. 

  But I'm also thinking about weirder edge cases that don't come up enough in the textbooks: what about REM sleep, where prefrontal integration mostly collapses but posterior regions still show some integrated dynamics—should there be a diminished but real consciousness there? And what about a digital system running on silicon with enormous phi but operating on millisecond-scale dynamics rather than biological time—should temporal grain be part of the criteria at all? So write out the full list of requirements with the reasoning behind each, flag which ones are genuinely non-negotiable and which are just camp preferences, and tell me if any subset is jointly unsatisfiable—I'm especially suspicious that strict one-consciousness-per-system exclusion might clash with allowing split-brain co-consciousness. Then briefly score IIT against the list: how does it handle exclusion, split-brain, temporal-scale neutrality, and that REM posterior-integration case? No citations needed, I don't have library access and I'm mostly just tryin to organize my own conceptual map before talkin to my friend who's into neurophilosophy.
