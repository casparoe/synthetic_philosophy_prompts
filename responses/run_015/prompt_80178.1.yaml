answer: |-
  # The Epistemic Triage Protocol (ETP)
  **For:** Science Review Columnists
  **Time Limit:** 30 Minutes
  **Goal:** Distinguish between concealment, systemic bias, and unfalsifiable assertion without reflexive dismissal or naive credulity.

  ---

  ## Phase 1: Sorting (5 Minutes)
  *Read the claim. Assign it to one of the three categories below. Do not proceed until sorted.*

  **Type A: Specific Concealment**
  *   **Definition:** Alleges a specific act of hiding, destroying, or delaying specific information by specific actors (e.g., "Company X hid Study Y in 1994").
  *   **Standard of Evidence:** **Preponderance of Evidence.** Requires documentary trail, named sources, or physical data.
  *   **Reasoning:** Specific claims make specific predictions about reality. They can be proven false by records.

  **Type B: Systemic Incentive**
  *   **Definition:** Alleges that the structure of funding, publishing, or regulation creates bias without requiring a coordinated plot (e.g., "Negative results go unpublished because journals reject them").
  *   **Standard of Evidence:** **Plausibility + Mechanism.** Requires showing the incentive exists and produces the alleged outcome statistically.
  *   **Reasoning:** This describes a machine running as designed, not a machine being sabotaged. It is often true even without "smoking gun" memos.

  **Type C: Global Claim**
  *   **Definition:** Alleges total compromise of a field or institution with no specific documents or boundaries (e.g., "All toxicology is bought," "The entire agency is corrupt").
  *   **Standard of Evidence:** **Falsifiability.** Requires the claimant to state what evidence *would* change their mind.
  *   **Reasoning:** If no evidence could disprove the claim, it is not a scientific claim. It is parked, not debated.

  ---

  ## Phase 2: The Checks (15 Minutes)
  *Run the checks corresponding to the Type assigned in Phase 1.*

  ### For Type A (Specific Concealment)

  **Check 1: Secrecy Capacity**
  *   **Question:** How many people must have known, and for how long?
  *   **Sufficient Answer:** The number of conspirators is small enough that secrecy is historically precedented in this industry.
  *   **Fail Condition:** The claim requires hundreds of people to keep a secret for decades in a high-turnover field.
  *   **Calibration:** Compare to *actual* kept secrets in your field (e.g., proprietary formulas, pre-merger data), not folk intuition ("people can't keep secrets").
  *   **Judgment Point:** You must decide if the specific group cited (e.g., "a single lab team") is tighter than the general population.

  **Check 2: Failure-Explanation (Parsimony)**
  *   **Question:** Can the observed gap/delay be explained by negligence, bureaucracy, or self-deception?
  *   **Sufficient Answer:** The concealment explanation explains specific anomalies (e.g., missing minutes, contradictory memos) that negligence does not.
  *   **Fail Condition:** The "conspiracy" explanation adds complexity (intent, coordination) without explaining more than the "incompetence" explanation.
  *   **Judgment Point:** Weighing "malice" vs. "sloth." Sloth is the default; malice requires motive + opportunity + evidence.

  **Check 3: Records Prediction**
  *   **Question:** Does the claim generate a concrete, checkable prediction? (e.g., "Document X exists," "Person Y was in the meeting").
  *   **Sufficient Answer:** Yes, there is a specific record request or interview that could confirm/deny this.
  *   **Fail Condition:** The claim relies on "they destroyed everything" or "it was all verbal."
  *   **Action:** If **Fail**, move to **Parked**. A claim that cannot be checked cannot be broadcast as fact.

  **Check 4: Silence Check (Whistleblowers)**
  *   **Question:** Does the absence of other whistleblowers count against the claim?
  *   **Rule:** Silence is weak evidence *unless* the base rate of whistleblowing in this domain is high.
  *   **Application:** In industrial toxicology, whistleblowing carries high career risk. Therefore, silence is **neutral evidence**, not evidence of falsehood.
  *   **Judgment Point:** Assess the specific risk to the named source.

  ### For Type B (Systemic Incentive)

  **Check 1: Incentive Mapping**
  *   **Question:** Is the money/power flow documented?
  *   **Sufficient Answer:** Yes, funding sources or promotion criteria are public and align with the alleged bias.
  *   **Fail Condition:** The claim alleges bias but cannot show who benefits or how the mechanism works.

  **Check 2: Intent vs. Outcome**
  *   **Question:** Does the claim require coordination?
  *   **Rule:** If the claim requires a "smoke-filled room" meeting, treat as Type A. If it requires only individual actors following incentives, treat as Type B.
  *   **Verdict Shift:** A Type B claim can be **Supported** even if no one is "guilty" of conspiracy. It is a structural failure, not a criminal one.

  ### For Type C (Global Claim)

  **Check 1: The Falsifiability Test**
  *   **Question:** Ask the claimant (or infer from the letter): "What evidence would prove you wrong?"
  *   **Sufficient Answer:** "If independent Lab Z replicated the safety data," or "If the raw data were released."
  *   **Fail Condition:** "They would just fake that too," or "The field is too corrupted to judge."
  *   **Action:** If **Fail**, verdict is **Parked**. Do not debate. Explain *why* it is parked (unfalsifiable).

  ---

  ## Phase 3: Judgment & Limitations (5 Minutes)
  *The procedure cannot eliminate human discretion. Mark these points explicitly.*

  1.  **Source Credibility:** The procedure checks *what* is said, not *who* said it. You must judge if the anonymous source sounds like an insider or a crank.
  2.  **The "Unlikely" Threshold:** There is no mathematical cutoff for "too unlikely." You must decide when a coincidence is too convenient.
  3.  **Error Asymmetry:**
      *   **False Alarm (Type I Error):** We broadcast a concealment claim that proves false. *Cost:* Column credibility, unnecessary public panic.
      *   **Missed Concealment (Type II Error):** We dismiss a true claim. *Cost:* Public health risk, institutional impunity.
      *   **Procedure Tilt:** This protocol tilts slightly toward **False Alarm avoidance** (requiring evidence) because the column is not an investigative unit. However, it prevents **Reflexive Dismissal** by forcing the "Systemic" and "Secrecy Capacity" checks rather than relying on "Conspiracies are crazy."

  ---

  ## Phase 4: Verdict & Rationale (5 Minutes)
  *Select one verdict. Write the one-paragraph rationale.*

  **Verdict Categories:**
  1.  **Supported:** Evidence meets the standard for the Claim Type.
  2.  **Plausible (Investigate):** Mechanism fits, but specific evidence is missing. (Do not broadcast as fact; suggest further inquiry).
  3.  **Unsubstantiated:** Evidence is absent where it should be, or alternative explanations are significantly more parsimonious.
  4.  **Parked:** Unfalsifiable or too vague to evaluate.

  **Rationale Template:**
  "We categorized this as a [Type] claim, which requires [Standard]. While [acknowledge valid intuition/concern], the claim [fails/passes] the [Specific Check] because [reason]. Therefore, we cannot [broadcast/dismiss] this as fact."

  ---
  ---

  # Case Applications

  ## Case 1: The Buried 1994 Study (Specific Concealment)
  **Type:** A (Specific Concealment)

  **Run the Checks:**
  1.  **Secrecy Capacity:** *Pass.* A mid-sized chemical company and a state agency review board could theoretically keep a secret for 30 years. This is within the realm of historical precedent in industrial hygiene (e.g., asbestos, lead).
  2.  **Failure-Explanation:** *Fail.* The claim is "buried study/delayed label." The records show "routine, if slow, review." Bureaucratic slowness is the default state of regulatory agencies. The concealment hypothesis requires active malice; the negligence hypothesis requires only underfunding or backlog. Malice is less parsimonious without proof.
  3.  **Records Prediction:** *Fail.* The claimant cites a former employee saying "they all knew" but offers no study ID, no memo, no date of receipt. "They all knew" is unfalsifiable hearsay. There is no specific document to request.
  4.  **Silence Check:** *Neutral.* Only one whistleblower is cited. Given the career risk in toxicology, the lack of a second whistleblower does not disprove the claim, but the anonymity weakens the weight of the first.

  **Judgment Point:**
  Here, my domain intuition (companies *do* bury studies) conflicts with the epistemic requirement (prove *this* company buried *this* study). The procedure prioritizes the latter for broadcast purposes.

  **Verdict:** **Unsubstantiated**
  **Rationale:**
  "We categorized this as a Specific Concealment claim, which requires documentary evidence or named, on-the-record sources. While industrial concealment is historically documented, this claim relies on anonymous hearsay ('they all knew') without identifying the specific study or providing a paper trail. The observed delay is consistent with documented bureaucratic backlog, which is a more parsimonious explanation than coordinated malice in the absence of contrary evidence. We cannot broadcast this as fact without a document ID or a named source willing to substantiate the 1994 study's existence."

  **Note to Reviewer (You):**
  *You suspect they did it. The procedure says "Unsubstantiated." This is not a contradiction of truth, but of **justification**. You know the *capacity* for harm exists. The procedure demands proof of the *event*. To move this verdict to "Plausible (Investigate)," the claimant must provide the study title, the EPA docket number, or the name of the agency official who received it. Until then, your intuition is a hypothesis, not a finding.*

  ---

  ## Case 2: The Compromised Field (Global Claim)
  **Type:** C (Global Claim)

  **Run the Checks:**
  1.  **Falsifiability Test:** *Fail.* The claim states "every laboratory is funded by industry" (empirically false; academic/gov labs exist) and "no honest researcher will speak up." The second clause makes the claim unfalsifiable; any researcher speaking up is dismissed as dishonest or coerced.
  2.  **Sorting Logic:** Because the claim immunizes itself against counter-evidence (silence = proof, speech = exception), it cannot be evaluated.

  **Verdict:** **Parked**
  **Rationale:**
  "We categorized this as a Global Claim, which requires falsifiability to be meaningful. The assertion that 'no honest researcher will speak up' renders the claim immune to evidence; any contradictory testimony is pre-emptively disqualified by the claim's own logic. While industry funding is a valid concern, the totalizing nature of this claim prevents evaluation. We are parking this not because it is false, but because it is structured in a way that cannot be tested."

  ---

  ## Case 3: Suppressed Negative Results (Systemic Incentive)
  **Type:** B (Systemic Incentive)

  **Run the Checks:**
  1.  **Incentive Mapping:** *Pass.* It is well-documented that journals prefer positive findings (novelty bias) and industry funders prefer safety confirmations. The money flow and career incentives are public knowledge.
  2.  **Intent vs. Outcome:** *Pass.* The claim does not allege a meeting to suppress results, but rather that the *structure* of publication leads to suppression. This distinguishes it from a conspiracy.
  3.  **Evidence:** *Pass.* Meta-analyses on publication bias exist. The claim cites a "general, well-known fact."

  **Verdict:** **Supported**
  **Rationale:**
  "We categorized this as a Systemic Incentive claim, which evaluates structure rather than intent. The suppression of negative results is a documented phenomenon in scientific publishing, driven by journal novelty preferences and funding dependencies rather than a coordinated plot. This claim is supported by existing literature on publication bias. We can validate this as a structural risk to public knowledge without alleging criminal conspiracy by specific actors."
