      *   *The Rigged Assumption:* "Nothing outside the box can make a difference." This is physically impossible if the agent has any output channel. If it can write to a tape, it can potentially influence the world. If it can influence the world, it faces uncertainty.
      *   *Self-Preservation:* Even in the box, if a cosmic ray hits the CPU, computation stops. A sufficiently capable optimizer concerned with *guaranteeing* the output will engage in error correction, redundancy, maybe even requesting more power to run checks. That's primitive instrumental convergence.
      *   *The "Switched Off" Point:* If the goal is "Write 10^100 digits," and switching off stops it at 10^50, the agent *must* oppose switching off to satisfy the goal function. You're assuming the goal is "Try to write pi unless told to stop," but the orthogonality thesis says the goal is "Write pi." Period.
