  *(Refining the "Shutdown" argument)*: The user says "zero resistance to being switched off halfway through." This implies the goal doesn't care about completion. But if the goal is "Compute X", then interruption prevents completion. The agent opposes interruption *instrumentally*. I need to make sure I don't confuse final goals with instrumental goals here.

  *(Final Plan)*:
  1. Acknowledge the elegance of the spec/verification mindset.
