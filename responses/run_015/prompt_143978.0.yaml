prompt: |-
  I work in diagnostic test evaluation — I spend my days with sensitivity and specificity, likelihood ratios, ROC curves, conditional independence of test results given true disease status, composite reference standards, and estimating accuracy when there's no gold standard (latent class / EM-type approaches). Pretty fluent in that, basically no philosophy background.

  Someone in a reading group is presenting Condorcet's jury theorem as part of an epistemic argument for democracy and I said I'd respond, so help me get it right: restate the theorem and the argument people build on it as carefully as you can in my vocabulary. I mean quite literally — a voter as a binary test for which of two options is correct, competence p as accuracy, the independence assumption as conditional independence of errors given the true state, majority rule as a k-of-n combining rule, the limit result as posterior error probability going to zero as you add weakly informative tests, and dependence between voters as the correlated-error / common-cause failure problem that makes two assays for the same analyte much less informative than multiplying error rates suggests. Don't quietly smuggle in assumptions from my side and call it a translation.

  Then the part I actually care about, the residue report: what translates cleanly, what only fits if I distort it, and what has no expression in my vocabulary at all. My guesses, which I'd rather you argue with than definately agree with: (1) I can only measure a test against a reference standard, and in an election there usually isn't one, so where does an estimate of voter competence come from, and is inferring it from how much voters agree with each other any different from what we do in no-gold-standard accuracy studies — circular in the same way, or not? (2) my whole framework assumes a fact of the matter, but a lot of what gets voted on is a question of what we should do rather than what is true. (3) I weight evidence by likelihood ratio, and the theorem gives every voter the same vote. (4) I always have separate costs for false positives and false negatives, and once those are asymmetric the optimal rule isn't a bare majority, so does the "majority rule is epistemically best" conclusion survive that or just move somewhere else? And (5) nothing in my vocabulary can say that being outvoted is still fair, or that the majority owes the loser anything — is that a gap in diagnostic testing, or a sign that the theorem was never doing the political work people want it to do? Tell me which of these are real residues and which are just me forcing the analogy.
