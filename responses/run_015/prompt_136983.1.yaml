answer: |-
  **MA Thesis Proposal**

  **Title:** The Expressive Cost of Triviality: Bounds on Nesting and Algebraic Closure in Conditional Probability

  **1. The Research Question**
  Lewis's triviality results demonstrate that, under seemingly plausible assumptions, no probability function can satisfy the Equation $P(A \to C) = P(C|A)$ if conditionals are treated as propositions within the domain of the probability function. The standard philosophical response (Adams, Edgington) is to deny the propositional status of conditionals. This project takes a different route: it grants the propositional assumption but interrogates the *expressive resources* required to generate the triviality.

  Triviality proofs typically assume the underlying algebra is closed under arbitrary Boolean combinations and that the language permits conditionals to be embedded within the antecedents or consequents of other conditionals. My central question is: **What is the minimal expressive fragment required to force triviality?**

  I propose formalizing this via two parameters:
  1.  **$n$**: The number of atoms in the finite Boolean algebra underlying the probability space.
  2.  **$k$**: The maximum nesting depth of conditionals allowed in the language fragment $\mathcal{L}_k$ (where $k=1$ denotes flat conditionals only).

  The thesis will seek to identify the threshold pair $(n, k)$ such that for all fragments below this threshold, there exists a non-degenerate probability function satisfying the Equation, and above which triviality is forced. A secondary, crucial sub-question is defining "non-degenerate." We must rule out "cheating" solutions where $A \to C$ collapses into the material conditional ($A \supset C$), a tautology, or a truth-function of $A$ and $C$. I will formalize this as a requirement that the conditional operator introduces distinct truth-conditions not reducible to the base algebra.

  **2. Motivation and Gap**
  Why pursue this when non-propositionalism exists? The Adams/Edgington view solves the problem by changing the semantics of the conditional. However, this leaves open whether the *logical cost* of propositionalism is as high as Lewis suggested. If triviality requires high nesting depth ($k \ge 3$) or large algebras ($n \ge 8$), a propositionalist might argue that natural language conditionals rarely (if ever) operate in those fragments, insulating the theory from triviality in practice.

  Conversely, if I find that triviality arises at $k=1$ and $n=4$, this strengthens the triviality argument significantly, showing it does not rely on complex embedding. This is an open gap in the literature. While Hájek and others have discussed finite triviality, the specific dependency on *nesting depth* as a necessary condition for the proof strategies is not systematically mapped. Furthermore, if it turns out that compositionality *forces* closure under embedding anyway, proving that restriction is impossible is itself a valuable negative result.

  **3. Methodology and Timeline (9 Months)**
  The project is strictly bounded to avoid "dissertation creep." I will not build a full semantics or defend a specific metaphysical view. I will treat this as a problem in finite model theory and philosophical logic.

  *   **Months 1–2: Formalization.** Define the language fragments $\mathcal{L}_{n,k}$. Rigorously define "non-triviality" to exclude material conditional collapse. Review existing proofs (Lewis, Hájek, Bradley) to isolate exactly which axioms they invoke regarding closure and nesting.
  *   **Months 3–4: The Flat Case ($k=1$).** This is the critical "kill switch." I will attempt to construct models for small $n$ ($n=2, 3, 4$) with flat conditionals. If triviality holds here, the nesting question is moot, and the thesis pivots to analyzing *why* the flat proof works (Month 5–6). If models exist, I will characterize the maximum $n$.
  *   **Months 5–6: Nesting and Closure.** If $k=1$ is safe, I will introduce nesting ($k=2$). I will test whether standard proof strategies (e.g., Lewis's partition argument) can be reconstructed within $\mathcal{L}_2$. I will also test Boolean closure: does triviality require $(A \to C) \land (B \to D)$, or just single conditionals?
  *   **Months 7–8: Synthesis.** Compile results into a threshold theorem (e.g., "Non-trivial models exist iff $n < 5$ and $k=1$"). Draft the philosophical implications: does this save propositionalism, or does it show the Equation is fragile?
  *   **Month 9: Revision.** Final polish and formatting.

  **4. Why This Approach?**
  *   **Vs. Defending Non-Propositionalism:** This is well-trodden ground. My project tests the *opponent's* strongest argument rather than adding another defense to the pile.
  *   **Vs. Building a Semantics:** Constructing a full possible-worlds semantics for conditionals is a PhD project. Restricting to finite algebras makes the problem tractable for an MA.
  *   **Vs. Experimental Philosophy:** Folk judgments on nested conditionals are noisy and don't settle the logical consistency of the Equation.

  **5. Success Criteria and Scope**
  **Success:** A precise theorem establishing the boundary conditions for triviality in finite fragments, plus a philosophical analysis of whether those boundaries are linguistically motivated.
  **Failure (Non-Completion):** Inability to formalize "non-triviality" without begging the question.
  **Failure (Negative Result):** If triviality holds for $n=2, k=1$, the "boundary" project collapses. *Salvage:* The thesis becomes an analysis of why the triviality result is more robust than previously thought, focusing on which specific step in the Lewis proof survives the restriction. This is still a valid contribution.
  **Scope Limit:** I will not address iterated probabilities ($P(P(A \to C))$) or dynamic updates, as these introduce separate triviality issues (e.g., Bradley's results) that would bloat the timeline.

  **6. Risk Assessment**
  The primary risk is mathematical difficulty. Constructing finite probability models that satisfy the Equation is non-trivial. To mitigate this, Months 3–4 are dedicated to the smallest cases. If I cannot construct a model for $n=3$ by Month 4, I will shift focus from "finding the boundary" to "proving the boundary is immediate." This ensures a thesis is produced regardless of the mathematical outcome.

  ***

  ### Confidence Assessment & Literature Check

  **Confidence Level: Medium-High (75%)**

  **The Claims:**
  1.  **Literature Status:** I am **moderately confident** that a systematic mapping of triviality specifically by *nesting depth* ($k$) in finite algebras is not a standard, settled result. While Hájek (1989, 1994) and Bradley (2000, 2007) discuss triviality in finite contexts and Boolean closure, the specific parameterization of "nesting depth vs. algebra size" as a boundary condition for *Lewis-style* triviality is not a textbook theorem. It is likely that fragments of this exist, but a unified treatment is missing.
  2.  **Mathematical Feasibility:** I am **cautiously optimistic** that the $n=2, 3, 4$ cases for $k=1$ are computable within 2 months. Finite probability spaces are discrete; this is a constraint satisfaction problem. However, proving *non-existence* (that no model works) is harder than finding one.
  3.  **The "Nesting" Claim:** I am **least sure** about the claim that Lewis's original proof *requires* nesting. Lewis (1976) relies on the existence of the proposition $A \to C$ and its conjunction with other events (e.g., $P((A \to C) \land B)$). This requires Boolean closure, but not necessarily *nested* conditionals like $A \to (B \to C)$. Some later generalizations (e.g., Hájek) might use nesting to generalize the result.
      *   *Risk:* If Lewis's original proof works entirely with $k=1$ (flat conditionals) provided Boolean closure holds, your "nesting" variable might be a red herring. The real boundary might be Boolean closure, not nesting.
      *   *Advice:* In Month 1, verify if Lewis's proof goes through with only flat conditionals but full Boolean closure. If it does, pivot the proposal to focus on **Boolean Closure vs. Nesting**. The question becomes: "Is it the ability to conjoin conditionals, or the ability to nest them, that drives triviality?" This is a safer, more robust question.

  **Recommendation:**
  Keep the proposal as written, but in Month 1, prioritize checking the Lewis proof against the $k=1$ constraint. If the proof survives $k=1$, adjust the thesis focus to "The Role of Boolean Closure in Triviality" rather than Nesting. The structure of the proposal supports this pivot without needing supervisor re-approval, as it falls under "Expressive Resources."

  **Final Warning:**
  Ensure your definition of "non-trivial" is bulletproof. If you define it loosely, a supervisor could argue your models are trivial by definition. Look at how Hájek defines "non-triviality" (usually involving the independence of the conditional from the material conditional) and adopt that standard.
