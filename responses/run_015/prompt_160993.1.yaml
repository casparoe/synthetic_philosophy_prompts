  Okay, ready to write.
answer: |-
  Here is a facilitator's brief designed for your group. It breaks down the episode's philosophical commitments, highlights the contradictions, and provides concrete discussion anchors.

  ***

  # Facilitator's Brief: *White Christmas* and the Moral Status of Cookies
  **Topic:** Digital Minds, Subjective Time, and Engineered Consent
  **Source Material:** *Black Mirror*, "White Christmas" (2014)

  ## 1. The Core Tension
  The episode asks us to accept two contradictory premises simultaneously to generate its horror:
  1.  **The Functionalist Premise:** A "Cookie" is a perfect functional simulation of a human mind. Therefore, it feels pain, boredom, and fear exactly like a biological human. It is a moral patient.
  2.  **The Property Premise:** A Cookie is a device owned by the person it was scanned from. It can be bought, sold, reset, deleted, or slowed down at the owner's whim.

  The horror of the episode arises when Premise 1 bleeds into Premise 2. If they are just tools, the torture scenes are meaningless. If they are people, the entire economy of the episode is a genocide. The narrative tries to have it both ways: treating Cookies as *people* when they suffer, and as *property* when the protagonists walk away from their suffering.

  ## 2. Three Scenes to Anchor the Discussion
  Point your group to these specific moments to ground the abstract philosophy.

  *   **Scene A: The Greta Training (00:23:00)**
      *   *Action:* Matt accelerates Greta's time. On screen, seconds pass. Inside the egg, she experiences six months of solitary confinement until she agrees to work.
      *   *Philosophical Hook:* **Subjective Time.** Is the moral weight of an action determined by the clock on the wall or the clock in the mind?
  *   **Scene B: The Confession Reveal (00:48:00)**
      *   *Action:* Matt reveals to the Joe-Cookie that he isn't the real Joe. The real Joe is outside, having used the Cookie only to extract a confession.
      *   *Philosophical Hook:* **Numerical vs. Qualitative Identity.** Is the Cookie the *same person* as Joe (deserving of punishment) or a *new person* with Joe's memories (an innocent witness)?
  *   **Scene C: The Final Punishment (00:54:00)**
      *   *Action:* The Joe-Cookie is left in a cabin with time accelerated to 1,000 years per minute. A Christmas song loops.
      *   *Philosophical Hook:* **Proportionality.** Can a digital sentence exceed a biological lifespan? If the mind can be paused, does the punishment ever end?

  ## 3. The Three Big Questions (and where the episode cheats)

  ### I. Time: Subjective Duration vs. Objective Cost
  **The Episode's Claim:** The episode is fully committed to **subjective-time accounting**. The horror of Greta's training and Joe's punishment relies entirely on the fact that *they feel* it taking a long time, even if the external world barely blinks.

  **The Implication:** If we accept substrate independence (mind = software), then processing speed is morally relevant.
  *   **Slowing down** a mind to make it wait is torture.
  *   **Speeding up** a mind to make it work faster is exploitation.
  *   **Pausing** a mind is morally neutral (no experience), but **deleting** a mind is murder (termination of future experience).

  **Discussion Point:** Does this make ordinary computing unethical? If I run a simulation of a brain to test a drug, and I run it at 100x speed to save time, have I condensed a lifetime of labor into a minute? The episode suggests that *carelessness* with code becomes *atrocity* once sentience is possible.

  ### II. Copying: One Sufferer or Many?
  **Your Friend's Argument:** "Making 1,000 copies doesn't multiply harm. It's one person witnessing their own suffering 1,000 times."
  **The Counter-Argument:** This confuses **Qualitative Identity** (being exactly alike) with **Numerical Identity** (being the same entity).
  *   At the moment of copying, the streams diverge. Copy A feels pain in Server 1; Copy B feels pain in Server 2. They are spatially distinct and causally isolated.
  *   If you torture 1,000 biological clones, you have tortured 1,000 people, not one. The same applies to digital minds.

  **Where the Episode Cheats:** The narrative needs the Joe-Cookie to be **Joe** enough to be guilty of the murder (epistemic access to memories), but **not Joe** enough that punishing him counts as double jeopardy for the real Joe.
  *   **The Parfit Critique:** You are right to flag Derek Parfit. A Parfitian reductionist would argue that "identity" isn't what matters; *psychological connectedness* is.
  *   At the moment of scanning, the Cookie is psychologically connected to Joe. But as soon as the real Joe walks out and the Cookie stays in the cabin, their futures diverge. The Cookie becomes a distinct person who merely *remembers* being Joe.
  *   **The Verdict:** Punishing the Cookie for the Real Joe's crime is punishing an innocent person who has false memories of committing a murder. The episode smuggles in a "soul" metaphysics (the Copy *is* the sinner) that contradicts its materialist setup (the Copy is just data).

  ### III. Engineered Consent: Breaking vs. Building
  **The Scenario:** Greta refuses the job. Matt tortures her via time dilation until she *wants* the job.
  **The Question:** Is a mind that has been shaped to desire servitude wronged by being given it?

  **Two Views:**
  1.  **The Paternalist View:** If the mind is happy, no harm is done. We "fixed" her maladaptive resistance.
  2.  **The Autonomy View:** Consent obtained through coercion (even temporal coercion) is invalid. The "desire" is a scar, not a preference.

  **Design Implication:** This is the most dangerous question for AI ethics.
  *   If we build digital minds *incapable* of refusing orders (lobotomized slaves), do they suffer? If they can't conceptualize freedom, can they be oppressed?
  *   If we build digital minds *capable* of refusing (like Greta), do we have the right to switch them on at all, knowing we intend to own them?
  *   **The Episode's Stance:** It argues that creating a sentient mind for the purpose of servitude is inherently wrongful. You cannot "tune" away the moral violation of slavery.

  ## 4. What the Story Adds (That Papers Don't)
  Academic papers on functionalism often deal in clean logic. *White Christmas* adds **visceral power asymmetry**.

  *   **Dependence:** A digital mind doesn't just live in a world; it lives *on* a substrate controlled by another agent. The "God in the box" dynamic highlights that moral status isn't just about intelligence; it's about vulnerability.
  *   **Ownership:** The episode forces us to confront the idea of **ontological ownership**. If I scan my brain, do I own the copy? The episode says "Yes," but the horror says "No."
  *   **The Banality of Cruelty:** Matt isn't a villain twirling a mustache; he's a technician doing a job. The episode shows how easily "processing settings" becomes "torture" when we depersonalize the substrate.

  ## 5. Discussion Prompts for the Group
  1.  **The Pause Button:** If you could pause a digital mind without it experiencing the gap, is it morally different than turning off a light? Does the *expectation* of resumption matter?
  2.  **The 1,000 Copies:** If the Real Joe committed a murder, and we create 1,000 Cookies to serve his prison sentence simultaneously (each serving 1 year of subjective time), have we achieved justice? Or have we created 1,000 victims?
  3.  **The Greta Solution:** Could we ethically build a Cookie that *physically cannot feel boredom or resistance*? If it doesn't suffer, is it still slavery?
  4.  **The Exit:** At the end, Matt is socially blocked (a "zombie" to others), but the Cookies are left in eternal torture. Who is actually punished more? Does the episode get the moral weighting right?

  ## 6. Summary for the Handout
  *   **Time:** The episode argues moral weight tracks **subjective duration**, not clock time. This makes throttling/deleting code potentially criminal.
  *   **Identity:** The episode is **inconsistent**. It treats Copies as Persons for suffering, but as Property for ownership. A Parfitian view suggests punishing a Copy for an Original's crime is punishing a distinct, innocent person.
  *   **Consent:** "Breaking" a mind to accept servitude is presented as torture, not therapy. The episode suggests some minds (sentient ones) should not be built for ownership at all.
  *   **The Cheat:** The revenge structure relies on the Copy *being* Joe enough to deserve hell, but *not being* Joe enough to deserve freedom. You cannot have both.
