answer: |-
  The deadlock is primarily a verbal dispute over the definition of 'cognitive constituent' that masks a substantive disagreement about whether metaphysical boundaries should track functional utility or biological mechanisms. Both sides agree on the empirical facts of the calibration ledger: it is trusted, accessible, and influences confidence fixation. Defenders argue the ledger performs the functional role of metacognitive regulation, meaning the internal act of consulting it is merely a sub-routine within a larger cognitive loop that includes the device. Critics contend that because the user must internally recognize uncertainty and voluntarily defer to the device, the control structure remains intracranial, making the ledger a causal input rather than a constitutive processor. This reveals that defenders are answering 'what realizes the function?' while critics are answering 'where is the mechanism located?', using the single label 'cognitive' to cover both distinct inquiries. Progress would require abandoning the binary 'in/out' metaphysics for a gradient model of integration, specifically developing a formal criterion that distinguishes 'continuous dynamical coupling' from 'intermittent causal access' based on explanatory power rather than ontology. An experiment showing that neural plasticity rewires to treat external feedback as proprioceptive data, erasing the neural signature of 'consultation,' would shift the diagnosis toward a substantive empirical question. My reasoning is most likely to fail if the debate is actually normative rather than descriptive, serving to protect concepts of moral responsibility rather than to map cognitive architecture, in which case no empirical data would resolve the disagreement.
