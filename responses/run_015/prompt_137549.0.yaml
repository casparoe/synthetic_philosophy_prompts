answer: |-
  The distinction you are groping for is between **Act-Rationality** and **Policy-Rationality** (sometimes called **Plan-Rationality**).

  In the literature, the view you are building toward is known as **Resolute Choice** (associated with Edward McClennen) or, in modern decision theory circles relevant to your field, **Functional Decision Theory**. The standard view you are rejecting (that paying in the city is irrational) is **Sophisticated Choice** grounded in **Causal Decision Theory**.

  Your discomfort arises because you are trying to evaluate the *act* at time $t_1$ (in the city) using criteria that only apply to the *policy* selected at time $t_0$ (before the ride).

  Here is the principle, formulated as a system spec, followed by the necessary repairs to your verdicts.

  ### The Principle: Ex-Ante Policy Optimality

  **Definition:** An agent is rational if it selects and executes the policy $\pi$ (a mapping from states to actions) that maximizes expected utility from the perspective of the design phase ($t_0$), even if specific actions $a \in \pi$ do not maximize utility at the moment of execution ($t_n$), provided the policy is transparent to relevant predictors.

  **Implementation Logic:**
  ```python
  def select_disposition(available_dispositions, context):
      """
      context: includes predictors (drivers, clients, simulators) 
               and their access to your source code/disposition.
      """
      best_disp = None
      max_expected_utility = -infinity
      
      for disp in available_dispositions:
          # Simulate world where agent has 'disp'
          # Crucial: Predictors see 'disp' before acting
          outcome = simulate_world(disp, context) 
          
          # Condition (i): Ex-ante expectation
          if outcome.expected_utility > max_expected_utility:
              
              # Condition (ii): No cheaper external commitment
              if not exists_cheaper_commitment(disp, context):
                  max_expected_utility = outcome.expected_utility
                  best_disp = disp
                  
      return best_disp

  def execute_action(state, disposition):
      # Resolute Choice Constraint: 
      # Do not re-evaluate utility here. 
      # Execute the output of the disposition.
      return disposition.resolve(state) 
  ```

  **Motivating Clause:**
  *   **The Ex-Ante Clause (i):** Captures Cases 1, 3, 4, 7. It validates paying the driver because the *policy* "pay on arrival" is the only one that gets you the ride.
  *   **The Transparency Constraint:** Captures Case 2 and 4. Predictors (the lab, the sandbox) must be able to detect the disposition. You cannot "fake" it (Case 2) because intention is a state they inspect.
  *   **The Resolute Execution Constraint:** Captures Case 1 vs. Standard Theory. Once the policy is selected, you do not re-calculate utility at the moment of action. You are a daemon executing the script.

  ---

  ### Verdicts on Your Cases

  **Cases 1, 3, 4, 7 (Validated):**
  Your principle holds. In Case 1, paying is rational *because* it is the execution of the optimal policy selected earlier. The "reason" for paying does not disappear; the reason is "I am an agent that executes optimal policies." In Case 7, you are comfortable because you view the agent as a policy, not a momentary actor. You must extend this view to yourself in Case 1.

  **Case 2 (The Toxin):**
  Your verdict ("Take money, not run") is **incoherent** under this principle.
  *   *Why:* The lab pays for the *intention* (the disposition), not the act. If you cannot form the intention (as you suspect), you do not get the $50,000.
  *   *Correction:* You must choose between: (A) Becoming the type who runs (Net +$45k), or (B) Remaining the type who doesn't (Net $0). You cannot have the money without the disposition. The principle forces you to acknowledge that "taking the money" is not an action available to you unless you first change your disposition.

  **Case 5 (The Tell):**
  Your verdict ("Visible commitment is a mistake") is **correct**, but your reasoning ("selection mechanism looks identical to case 1") is wrong.
  *   *Why:* In Case 1, the predictor (driver) is a **cooperator**. His success depends on your success. Transparency helps. In Case 5, the predictor (big client) is an **extractor**. His success increases if your options are constrained.
  *   *Correction:* The principle handles this via `simulate_world`. The expected utility of the "Public Pledge" policy is lower than the "Private Disposition" policy because the client exploits the visibility. The principle dictates: **Be opaque to extractors, transparent to cooperators.** Do not install the public pledge.

  **Case 6 (Global Disposition):**
  Your verdict ("I still want it, even if ledger is negative") **must be overturned**.
  *   *Why:* This violates Condition (i). If the ledger is negative overall, `max_expected_utility` will select a different disposition (e.g., "Scoped Promises" or "No Disposition").
  *   *Correction:* If you value "being the kind of person who keeps promises" as a terminal good, you must encode that utility into the ledger. If, *including* that psychic value, the ledger is still negative, the disposition is irrational. You cannot have it both ways: either it pays (utility-wise) or it is a hobby you pay for. Do not call it rational if it is a net loss.

  ---

  ### Two New Cases

  **Case A: The Involuntary Patch (External Installation)**
  *Scenario:* A competitor hacks your system and installs the "Keep Promises" disposition without your consent. It causes you to lose money on bad contracts, but gain reputation on good ones. Net result: Positive utility.
  *   **Principle Verdict:** The *state* is optimal, but the *agent* was not rational. Rationality applies to the `select_disposition` function, not the resulting state. You cannot claim credit for the utility, nor are you blameworthy for the execution.
  *   **Lesson:** Rationality is a property of the **selection process**, not the **outcome**. This distinguishes you from a puppet who happens to do the right thing.

  **Case B: The Cognitive Tax (Degraded Judgment)**
  *Scenario:* The only way to install the "Keep Promises" disposition is via a neural implant that lowers your IQ by 10 points globally, causing you to make engineering errors elsewhere.
  *   **Principle Verdict:** **Reject.** Condition (i) fails. The `simulate_world` function must account for side effects of the disposition on unrelated modules.
  *   **Lesson:** Dispositions are not free modules; they have resource contention. A rational policy accounts for the **opportunity cost** of the disposition itself.

  ---

  ### The Necessary Overturn

  To make your system consistent, you must accept one hard truth:

  **You must overturn your discomfort in Case 1 and your insistence in Case 6.**

  1.  **Case 1 (The Ride):** You said, *"I have some discomfort calling the payer in case 1 rational."*
      *   **Fix:** Kill the discomfort. If you accept Case 7 (the agent), you must accept Case 1 (yourself). You are a distributed system. The "you" at the facility is Node A. The "you" in the city is Node B. Node B does not get to rewrite the protocol because the network conditions changed. If Node B defects, the protocol fails, and Node A never gets the ride. **Paying is rational because it validates the protocol.**

  2.  **Case 6 (The Global Disposition):** You said, *"I still want it, even on the assumption that the ledger comes out negative overall."*
      *   **Fix:** This is the only verdict that must die. If the ledger is negative, **do not install it.** If you install it, you are indulging a preference for "integrity" that you must explicitly value in the ledger. If you value it enough to offset the financial loss, fine—but then the ledger is not negative. If the ledger is truly negative (including all psychic value), installing it is **irrational self-sabotage**.
      *   *Why:* In distributed systems, you do not keep a protocol running if it consumes more resources than it delivers value, unless "running the protocol" is the product itself. If "being a promise keeper" is the product, price it in. If not, shut it down.

  ### Summary Recommendation

  Adopt **Resolute Choice**. View yourself as the source code of an agent that is evaluated by the world *before* it acts.

  *   **Rationality** = Selecting the source code that yields the highest return when simulated by predictors.
  *   **Action** = Executing that source code without runtime modification.
  *   **Constraint** = Do not install dispositions that are net negative (Case 6) or visible to exploiters (Case 5).

  Your intuition in Case 7 is the correct one. The only error is failing to apply that same architectural view to your own biological hardware in Case 1.
