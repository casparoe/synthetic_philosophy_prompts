answer: |-
  ### Desiderata for an Institutional Account of Supererogation

  1.  **Cheap Rescue/High Stakes vs. Costly Rescue/Modest Stakes:** Must distinguish when low-cost/high-impact aid becomes mandatory, and where the duty limit lies. **Genuine Desideratum.**
  2.  **Stranger vs. Role-Holder:** The same act (e.g., intubation) is optional for a bystander but required for an on-duty anesthetist. **Genuine Desideratum.**
  3.  **Third-Party Sacrifice:** Using your children's college fund to save a stranger; the cost is yours, but the burden falls on dependents. **Genuine Desideratum.**
  4.  **Supererogatory Omissions:** Forgiving a debt or slight when you are entitled to resent it; duty usually binds action, not restraint. **Genuine Desideratum.**
  5.  **The Collective Case:** If everyone volunteers, the act becomes expected; if no one does, the system fails. No heroes, no opt-out. **Genuine Desideratum.**
  6.  **Entitled-but-Nasty:** Asserting a right in a way that is permissible but blameworthy (suberogatory). **Prejudice of the Personal-Options Camp** (Maximizers deny permissible-but-blameworthy categories).
  7.  **The Non-Considerer:** Blaming an agent who never thought to help, even if they didn't technically violate a rule. **Genuine Desideratum.**
  8.  **Hero with Rotten Motive:** Praising the act (saving the patient) while condemning the agent (doing it for fame). **Genuine Desideratum.**

  ### The Conflict and The Filter

  **The Incompatible Pair:** **Case 1 (The Flip Point)** and **Case 5 (The Collective Case)**. You cannot maintain a stable individual cost-benefit threshold for duty (Case 1) while simultaneously allowing collective necessity to transform optional acts into requirements (Case 5). If the roster *needs* you to survive, your individual cost calculation is ethically overridden.

  **The Single Requirement:** **Case 7 (Blame for Non-Consideration)**. This requirement rules out the most candidate accounts because purely act-based theories (deontological or consequentialist) cannot generate blame for an attitude or omission of thought where no specific action-rule was violated.

  ### Theoretical Scorecard

  **Personal-Prerogative View:** Protects agent integrity against third-party sacrifices (Case 3) but fails to explain why collective necessity (Case 5) overrides individual options; leaves the duty "flip" point (Case 1) arbitrary.

  **Scalar View (Ideal Agent):** Captures nuance in motive and character blame (Case 7, 8) effectively but offers no binary rules for institutional rosters (Case 2); fails to distinguish role-duty from general virtue.

  **Maximizing-Plus-Options:** Handles stakes and rescue ratios well (Case 1) but collapses under third-party costs (Case 3); struggles to blame the non-considerer (Case 7) without a specific rule violation.
