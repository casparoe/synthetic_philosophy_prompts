  Im writing a short applied paper on which burdens an institution — a hospital's call schedule, a department's service assignments, a disaster-response roster — may require of people and which it can only invite them to take on, so I need an account of supererogation that does actual work, not another tour of the saint and the hero. Give me the desiderata first: the cases it has to sort correctly, the distinctions it cant collapse, and the facts about praise and blame it has to respect, with the case behind each. The ones I want on the list, at minimum: cheap rescue with huge stakes vs. costly rescue with modest stakes, and where (if anywhere) beyond-duty flips into required; the same act done by a stranger vs. by someone whose role already covers it; sacrifice paid for by a third party, like funding a stranger's surgery out of your kids college money; supererogatory omissions, e.g. forgiving when you had every right to go on resenting; the collective case where everyone does it, so no one is a hero and no one is off the hook; the entitled-but-nasty act that is blameworthy to do and not to omit; the agent who never once considers helping, and what exactly we are blaming them for; and the hero with a rotten motive. For each, say whether its a genuine desideratum or just a prejudice of the maximizing camp or the personal-options camp. Then flag the pair you think cant be jointly satisfied, and name the single requirement that rules out the most candidate accounts. Two or three lines each on how a personal-prerogative view, a scalar view built on what an ideally good agent would do, and maximizing-plus-options do against the list — I'll fill in the scorecard myself.
