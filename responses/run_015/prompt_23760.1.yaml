answer: |-
  One concrete example of this logical structure appearing outside philosophy of mind is the legal doctrine of **corporate personhood**, specifically as established in the separation of the corporation from its shareholders (often illustrated by the 1897 case *Salomon v. Salomon & Co Ltd*). In this legal framework, a corporation is treated as a distinct "person" separate from the physical humans who own or manage it. To determine the limits of liability or the continuity of the entity, the law performs a conceptual subtraction: it strips away the specific identities, physical bodies, and personal assets of the shareholders and directors to ask whether a residual legal subject remains. The court effectively posits a "corporate veil," arguing that even if you remove every tangible human component or physical asset associated with the company, the "corporation" persists as a liable, sue-able, and own-ing entity.

  This parallels the Flying Man argument at the level of logical structure because both employ a **subtractive methodology to isolate an invariant subject**. Avicenna strips away the limbs, senses, and memory of the human to see if the "I" remains; corporate law strips away the shareholders, employees, and assets of the business to see if the "Company" remains. In both cases, the argument relies on the intuition that the subject (the Self or the Corporation) is not merely the sum of its physical or contingent parts. Both thought experiments attempt to prove that the identity of the subject is independent of the specific material inputs that usually define it in ordinary experience.

  The two cases genuinely diverge, however, on the **ontological status of the remainder**. Avicenna uses the Flying Man to argue that the self is a *fundamental reality* that is discovered through introspection; the "I" that remains is more real than the body that was subtracted. In contrast, the legal system explicitly treats the corporate person as a *fiction* created by the state for utilitarian purposes (such as limiting liability or ensuring contract continuity). The law does not claim the corporation exists in the wild like a soul; it claims the corporation exists only because the state agrees to pretend it does. Thus, while the Flying Man attempts to settle the question of what *is* (ontology), the Corporate Veil settles the question of what *counts* for social organization (normative fiction), leaving the actual reality of the "corporate self" intentionally open.
