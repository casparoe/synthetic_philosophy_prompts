answer: |-
  Here is a complete, runnable lesson plan designed for your constraints. I have selected the **Resale/Token Market** variant for Round 3.

  **Why I chose Resale over the Pawnshop:**
  The Pawnshop relies on the Receiver remaining "trusting" while the Sender changes incentives. In a classroom, Receivers often get gun-shy after one bad round, causing the game to collapse into "Everyone Rejects," which muddies the lesson.
  The **Resale** variant creates a visible, active scandal. Low-quality senders physically hold the "expensive" tokens bought from High-quality senders. It isolates the specific mechanic of the Handicap Principle: the cost must be borne *by the sender*, not just paid *by someone*.

  ---

  # Module: Signals, Games and Meaning
  ## Session: The Cost of Truth (75 Minutes)

  ### 1. Logistics & Materials
  *   **Class Size:** 18 Students.
  *   **Roles:** 9 Senders (Row A), 9 Receivers (Row B).
  *   **Seating:** Senders and Receivers face each other in pairs (or Senders face forward, Receivers face Senders' backs—your preference, but pairs allow faster chip exchange).
  *   **Materials:**
      *   **Type Cards:** 9 cards marked **H** (High), 9 cards marked **L** (Low). *Note: You need 9 Senders total. Split them 5 High / 4 Low for Round 1 & 2. For Round 3, keep the same types.*
      *   **Signal Tokens:** 20 Gold Poker Chips (or distinct cards). These represent the "Costly Signal."
      *   **Envelopes:** 9 per round (to pass signals secretly).
      *   **Currency:** ~200 Poker Chips (white/red) or chocolate coins.
      *   **Projector:** For the "Public Tally" (Receiver Success Rate).
  *   **Incentives:** Top 3 Scorers get +2% Participation Credit (or a chocolate bar).

  ### 2. The Board Setup (Write this before class)
  Leave the theory blank. Only write the **Payoff Rules**.

  **SENDER PAYOFFS**
  *   If Receiver **ACCEPTS**: You get **12 Chips**.
  *   If Receiver **REJECTS**: You get **0 Chips**.
  *   **Signal Cost:** (Varies by Round, see below).
  *   *Net Payoff = Reward - Cost.*

  **RECEIVER PAYOFFS**
  *   If you Accept a **High** Sender: **+5 Chips**.
  *   If you Accept a **Low** Sender: **-5 Chips**.
  *   If you Reject (Anyone): **0 Chips**.

  **RULES OF ENGAGEMENT**
  1.  Senders know their Type (H or L). Receivers do not.
  2.  Senders choose: **Send Signal** (Pass Gold Chip in envelope) OR **Stay Silent** (Pass empty envelope).
  3.  Receivers choose: **Accept** or **Reject**.
  4.  No talking about Types.

  ---

  ### 3. The Game Flow

  #### Phase 1: Setup (10 Minutes)
  1.  **Assign Roles:** Hand out Type Cards to the 9 Senders. (5 High, 4 Low). Hand out Score Sheets to Receivers.
  2.  **Endowment:** Give every player 20 Chips to start.
  3.  **Instruction:** "You will play three rounds. The Payoff Rules on the board stay the same. The **Signal Cost** rules will change. Your goal is to maximize your chip count. Go."

  #### Phase 2: Round 1 — The "Expensive" Signal (10 Minutes)
  *   **Rule:** Signal Cost = **8 Chips** for **Everyone** (H and L).
  *   **Action:**
      1.  Senders decide to Signal (pay 8 chips to bank) or Not. Put Gold Chip or Empty Envelope.
      2.  Pass envelopes to Receivers.
      3.  Receivers decide Accept/Reject.
      4.  Reveal Types. Pay out.
  *   **Expected Outcome (Pooling):**
      *   High Net: $12 - 8 = +4$. (Signals).
      *   Low Net: $12 - 8 = +4$. (Signals).
      *   *Result:* Everyone signals. The signal conveys **no information**.
      *   *Receiver Dilemma:* If they Accept, they get a mix of H and L. Expected Value $\approx 0$. They will likely flip a coin or Reject.
      *   *Tally:* Record % of Receivers who Accepted a Signal. (Expect ~50% or chaos).

  #### Phase 3: Round 2 — The Differential Cost (15 Minutes)
  *   **Rule:** Signal Cost = **4 Chips for High**, **14 Chips for Low**.
  *   **Action:** Same as Round 1.
  *   **Expected Outcome (Separating):**
      *   High Net: $12 - 4 = +8$. (Signals).
      *   Low Net: $12 - 14 = -2$. (Does **Not** Signal).
      *   *Result:* Only High Types signal. The signal is now **honest**.
      *   *Receiver Strategy:* Accept Signal, Reject Silence.
      *   *Tally:* Record % of Receivers who Accepted a Signal. (Expect ~100%). Record Receiver Profit (should be positive).

  #### Phase 4: Round 3 — The Loophole (15 Minutes)
  *   **Rule:** Signal Cost = **4 Chips for High**, **14 Chips for Low**.
  *   **NEW RULE (The Market):** Before passing envelopes, there is a **2-Minute Trading Phase**.
      *   High Types can buy a Gold Chip from the Bank for 4 chips.
      *   Low Types can buy a Gold Chip from the Bank for 14 chips.
      *   **CRITICAL:** Players can **trade Gold Chips with each other** for any price they agree on.
      *   *Constraint:* You cannot show your Type Card during trading. You can only say "I have a chip" or "I want a chip."
  *   **Action:**
      1.  **Trading Phase:** High Types realize signaling costs them 4 but yields 12 (Net +8). Low Types realize signaling costs 14 (Net -2).
      2.  **The Arbitrage:** High Types will sell their Gold Chips to Low Types.
          *   *Deal Price:* Say, 10 Chips.
          *   *High Seller:* Gets 10 chips. (Better than Net +8 from signaling).
          *   *Low Buyer:* Pays 10, Gets 12 Reward. Net +2. (Better than Net 0 from silence).
      3.  **Signaling:** Low Types now hold the Gold Chips. They put them in envelopes.
      4.  **Receiving:** Receivers (conditioned from Round 2) see Gold Chips and **Accept**.
  *   **Expected Outcome (The Scandal):**
      *   Low Types flood the market with Signals.
      *   Receivers Accept and lose points (-5 each).
      *   High Types make money selling signals, but don't signal.
      *   *Tally:* Receiver Profit will crash into negative.

  #### Phase 5: The Debrief (25 Minutes)
  *Do not move chairs. Keep the chips on the desk.*

  **Step 1: The Data (5 mins)**
  Project the Tally Sheet.
  *   Round 1: High Signaling Rate, Low Receiver Trust.
  *   Round 2: High Signaling Rate, High Receiver Trust.
  *   Round 3: High Signaling Rate, **Crashed** Receiver Trust.

  **Step 2: Mapping the Lessons (15 mins)**
  *   **Point 1 (Cost alone fails):** Ask Round 1 Senders. "You paid 8 chips. Did the Receiver trust you?" *No.* "Why?" *Because the Low types paid it too.*
      *   *Takeaway:* An expensive signal is just a tax if everyone pays it equally.
  *   **Point 2 (The Loop):** Ask Round 2 Receivers. "Why did you trust the Gold Chip?" *Because only High types sent it.* Ask Round 2 Low Senders. "Why didn't you send it?" *Because it cost 14.*
      *   *Takeaway:* The signal wasn't honest because of the chip. It was honest because the Low Type *couldn't afford it given your reaction*. If Receivers had rejected in Round 2, High Types wouldn't have signaled either. It's a loop.
  *   **Point 3 (Decoupling):** Ask Round 3 Low Senders. "Stand up if you held a Gold Chip." (Most will stand). "Stand up if you are Low Type." (Most will stand).
      *   *Ask:* "Who paid the 14-chip cost?" *No one.* "Who paid the 4-chip cost?" *The High Types, but they sold the proof.*
      *   *Takeaway:* The system broke because the **cost was detached from the sender**. The Handicap Principle requires the burden to be non-transferable.

  **Step 3: The Reveal (5 mins)**
  *   "In biology, this is the **Handicap Principle**."
  *   "The Peacock's tail isn't a receipt you can sell. It's metabolic weight. It slows you down. A sick peacock cannot fake a heavy tail because the weight kills him. That is the 'No Trading' rule of nature."

  ---

  ### 4. The Honest Parts (Predictable Failures & Limitations)

  **1. The "Math Panic"**
  *   **Risk:** Second-years will freeze on the arithmetic in Round 3 trading. "If I sell for 9, do I win?"
  *   **Fix:** Write a "Cheat Sheet" on the corner of the board during Round 3:
      *   *High Type Keep:* Net +8.
      *   *High Type Sell:* Price - 4.
      *   *Low Type Buy:* 12 - Price.
  *   **Intervention:** If trading stalls, announce: "Current market price is 10 chips." Force the liquidity to ensure the scandal happens.

  **2. The "Collusion" Leak**
  *   **Risk:** A High Type Sender turns to their Receiver partner and whispers "I'm High, trust me."
  *   **Fix:** Enforce the "No Talking About Types" rule strictly. If caught, they are disqualified from the chocolate prize.
  *   **Limitation:** In the real world, signals are public. In this game, they are private (envelopes). This makes collusion easier. Acknowledge this in debrief: "In nature, signals are broadcast. Here, they are whispered. That's why we need envelopes."

  **3. The "Receiver Strike"**
  *   **Risk:** In Round 3, if Receivers suspect foul play immediately, they might Reject *everyone*. The scandal is muted.
  *   **Fix:** Remind Receivers before Round 3: "Assume the rules from Round 2 hold unless proven otherwise." You want them to get burned to feel the betrayal.
  *   **Limitation:** This game cannot reproduce **evolutionary time**. In reality, Receivers would evolve to ignore the signal after Round 3. In class, the game ends. You must explain: "In nature, the next generation of Receivers would stop trusting Gold Chips. The signal would become worthless. That is why honest signals are rare."

  **4. The Abstraction of "Cost"**
  *   **Limitation:** In the game, cost is chips (currency). In biology, cost is survival risk (predation, energy).
  *   **What to say:** "In Round 2, the Low Type didn't signal because they lost chips. In nature, the Low Type doesn't signal because they die. The logic is identical, but the stakes are higher. That is why the 'No Trading' rule is physical law, not just a game rule."

  ### 5. Instructor Script for Round 3 Transition
  *"Round 2 worked. The High Types signaled, the Low Types stayed quiet, and the Receivers made profit. We are going to run Round 3 with the exact same costs. However, I am introducing a 'Secondary Market'. You may trade Signal Tokens before you send them. You cannot trade Type Cards. You cannot trade Envelopes. You have 2 minutes to trade. Go."*

  *(Watch for the High Types selling to Low Types. If it doesn't happen naturally, intervene: "High Types, you have a surplus of tokens. Low Types, you want the reward. Find a price.")*
