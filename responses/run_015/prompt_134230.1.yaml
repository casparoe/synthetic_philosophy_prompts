prompt: |-
  Hey, I'm working on a paper about synthetic companionship and I got distracted by G.E. Moore's ethics. There's this summary I found in a philosophy blog (can't remember the name) that tries to apply his view to AI friends and generated art. It says:

  "Moore said beauty and friendship are the two greatest intrumental goods, and he proved they have to be valued together because of his organic unity rule, which means the value of any whole is always strictly greater than the sum of its parts taken seperately. So if you have a beautiful painting and a friend who appreciates it, the total value is necessarily more than the painting's value plus the friend's value alone. From this Moore concluded that anything lacking consciousness—like an AI or a landscape with no observer—can't really be beautiful in the moral sense, because beauty only exists inside the organic whole of conscious appreciation. That's why he ranked friendship as the highest good: it's the only thing that can complete beauty and make the whole exceed its parts."

  I'm not sure this hangs together. Something about it feels off relative to what I remember about Moore being anti-psychologistic about value, but I can't pin it down. Can you audit this summary for me? Go through it sentence by sentence and tell me what's accurate to Moore's view in Principia Ethica, what's a common simplification, what's subtly twisted, and what's flat wrong. Specifically, check whether the blogger's conclusion about AI and unobserved landscapes actually follows from Moore's real claims about organic unity and consciousness. And please think carefully—start by brainstorming the distinctions between intrinsic and instrumental value, organic unity versus simple summation, and whether consciousness is a necessary condition for beauty's value—before you evaluate the summary. You're acting as an expert in early 20th-century analytic ethics, so be precise, but don't worry about giving me citations or a bibliography; I just need an accuracy check I can actually use.
