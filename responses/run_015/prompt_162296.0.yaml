  **(7) Accuracy Threshold:**
  *   **Principle:** You pay if the expected gain from the counterfactual branch (weighted by accuracy and probability) exceeds the cost in the actual branch.
  *   **Formula:** $A > \frac{P(\text{Tails}) \times \text{Cost}}{P(\text{Heads}) \times \text{Gain}}$.
  *   **Fit:** With your numbers ($P(T)=0.001, C=100, P(H)=0.999, G=10,000$), the threshold is $A > 0.00001$. Your intuition at 55% suggests you are intuitively discounting the logical link, but the strict principle demands paying at nearly any accuracy above zero.

