  Your tentative formulation is a robust description of **Updateless Decision Theory (UDT)** or **Functional Decision Theory (FDT)**. It correctly identifies that the rational move is to select the *policy* (input-output map) that yields the highest expected utility from the *ex-ante* perspective (before you know the coin flip, the digit of pi, or whether the letter arrives), and then to execute that policy even when *ex-post* observations seem to suggest otherwise.

  Here is the evaluation of your cases under this principle, the necessary repairs, and the specific answers you requested.

  ### Analysis of Your Cases

  **(1) Counterfactual Mugging (Coin):**
  *   **Principle:** Ex-ante, the policy "Pay if Tails" yields an expected value of $(0.999 \times \$10,000) - (0.001 \times \$100) = \$9,989.90$. The policy "Don't Pay" yields \$0.
  *   **Verdict:** **Pay.**
  *   **Fit:** Matches your verdict.

  **(2) Parfit's Hitchhiker:**
  *   **Principle:** Ex-ante, the policy "Pay if Rescued" ensures rescue. The policy "Don't Pay" ensures death in the desert.
  *   **Verdict:** **Pay.**
  *   **Fit:** Matches your verdict.

  **(3) Standard Blackmail:**
  *   **Principle:** The blackmailer's decision is causally dependent on your condition, not your policy (he already knows). However, standard decision theory (CDT/FDT/EDT) agrees here: paying minimizes loss given the threat is active.
  *   **Verdict:** **Pay.**
  *   **Fit:** Matches your verdict.

  **(4) XOR Blackmail:**
  *   **Principle:** Ex-ante, the policy "Don't Pay if Letter" results in blackmail only when you have the condition (prob 0.001), costing $\$100,000 \times 0.001 = \$100$ in expected loss. The policy "Pay if Letter" results in blackmail when you are *safe* (prob 0.999), costing $\$1,000 \times 0.999 = \$999$ in expected loss.
  *   **Verdict:** **Don't Pay.**
  *   **Fit:** Matches your verdict. Your friend's objection fails because it updates on the letter *after* fixing the policy. The principle demands you fix the policy *before* knowing the letter arrives.

  **(5) Logical Coin (Pi):**
  *   **Principle:** FDT treats logical uncertainty (Pi) identically to empirical uncertainty (Coin). The ex-ante calculation is identical to Case (1).
  *   **Verdict:** **Pay.**
  *   **Fit:** **Contradicts your leanings.** To maintain consistency with (1), you must accept that logical facts are just as "fixed" as past coin flips, and your decision algorithm determines the outcome in the counterfactual logical branch just as it does in the counterfactual empirical branch.

  **(6) Simulation (15yo vs. Stranger):**
