answer: |-
  You are absolutely right, and your intuition is sharper than your friend's. You have stumbled onto one of the most notorious open problems in modern moral philosophy: **The Infinite Ethics Problem.**

  Your friend is trying to hold two incompatible positions: **Total Utilitarianism** (maximize the sum total of good) and **Common-Sense Moral Intuition** (my actions matter). In an infinite universe, Total Utilitarianism mathematically collapses because $\infty + 1 = \infty$. If the total is already infinite, no finite action changes the value of the universe.

  Here is the breakdown of the move he is making, the principle he is actually using, and where that principle breaks.

  ### 1. The Name of the Move
  Philosophically, this is an **Ad Hoc Rescue** combined with an **Implicit Theory Switch**.

  *   **Ad Hoc Rescue:** He is modifying his theory ("ignore the total, just look at the change") specifically to avoid the falsifying implication (that nothing matters), without admitting he has changed the theory.
  *   **Implicit Theory Switch:** He claims to be a **Totalist** (value = sum of all welfare), but when the sum breaks, he silently switches to a **Causal Consequentialist** or **Difference-Making** view (value = the difference my action makes relative to the baseline).

  In meta-ethics, this is often defended under the banner of **Reflective Equilibrium**, where one adjusts theoretical principles to match "firm" pre-theoretic intuitions. However, done this way, it is intellectually dishonest because he is claiming the *Total* view justifies the action, when the *Total* view actually renders the action neutral.

  ### 2. The Hidden Principle: Causal Difference-Making + Separability
  Since he can't be using Totalism (totals are equal), he is implicitly relying on a principle called **Separability** grounded in **Causal Difference-Making**.

  *   **Causal Difference-Making:** The value of an action is not determined by the state of the universe it produces, but by the *difference* between the world where you act and the world where you don't.
      *   *Totalist Math:* $Value(World) = \infty$ (Action) vs $Value(World) = \infty$ (No Action). Result: Indifferent.
      *   *Difference-Maker Math:* $Value(Action) - Value(No Action) = +10$ units of good. Result: Do it.
  *   **Separability:** This is the crucial commitment. It asserts that the moral value of a local region of spacetime can be assessed **independently** of the rest of the universe. It claims that the infinite background noise is morally irrelevant to local evaluation.

  ### 3. What This Principle Commits Him To
  If he accepts this hidden principle to save his intuition, he is no longer a Totalist. He is committed to the following:

  1.  **Rejection of Holism:** He must admit that the "Goodness of the Universe" is not a single number we are trying to maximize. Instead, morality is local. The value of the whole does not supervene on the sum of the parts in the standard way.
  2.  **Spatiotemporal Parochialism:** He is committed to the view that we only owe moral consideration to things we can causally affect. If there is an infinite amount of suffering in a disconnected multiverse bubble, he must admit he has no obligation to reduce it, even if he could, because it's not part of his "difference."
  3.  **Counterfactual Dependence:** Moral value resides in *causation*, not *existence*. If a happy person would have existed anyway regardless of your action, your action has zero moral value, even if that person is happy. (This creates conflicts with non-identity problems).

  ### 4. Where It Stops Applying (The Breaking Points)
  You asked where this principle stops applying. This is where you can corner him. The **Causal Difference-Making** view solves the "Infinite Background" problem, but it creates new, arguably worse, paradoxes.

  **A. The "Infinite Impact" Loop (Pascal's Mugging)**
  If the universe is infinite, is it possible for a finite action to have *infinite* consequences?
  *   *Scenario:* If you save a child today, their lineage might continue forever. In an infinite timeline, does that lineage produce infinite good?
  *   *The Trap:* If yes, then any action with a non-zero probability of securing an infinite future dominates all other moral concerns. You should ignore saving 1,000 lives today to work on a 0.0001% chance of making humanity eternal.
  *   *The Limit:* His principle cannot rank two actions that *both* have infinite expected consequences. If Action A leads to $\infty$ good and Action B leads to $\infty$ good, Difference-Making collapses back into the original problem ($\infty - \infty$ is undefined).

  **B. The "Fixed Background" Assumption**
  Difference-Making only works if the "background" infinite universe is fixed and unaffected by you.
  *   *The Trap:* What if there is a way to affect the infinite background? (e.g., sending a signal that replicates infinitely across the multiverse).
  *   *The Limit:* If he admits we *could* affect the infinite total, he must return to Totalism to weigh that against local good. If he says "we can't," he is making an empirical claim about physics he likely can't support.

  **C. The "Zero Difference" Problem (Determinism)**
  *   *The Trap:* If the universe is a block universe (deterministic), your action was always going to happen. The "world where you don't act" is impossible.
  *   *The Limit:* If the counterfactual is impossible, the "difference" is undefined. His principle requires a specific view of free will or modality to function.

  ### 5. How to Press Him
  Don't ask him about totals anymore. He has already conceded that totals don't guide action. Ask him to defend the **Separability** principle.

  **Say this:**
  > "Okay, if the total doesn't matter, you're arguing for **Causal Difference-Making**. That means you believe the value of my action is independent of the infinite background. But that commits you to **Separability**.
  >
  > So, here is the test: If I could press a button that slightly reduces suffering in our galaxy, but *also* slightly increases suffering in the infinite rest of the universe (keeping the total infinite either way), does your principle say I should press it?
  >
  > If you say **Yes**, you aren't a Totalist, you're a Localist, and you admit the infinite total is irrelevant.
  > If you say **No**, then you admit the infinite total *does* matter, and we are back to square one where nothing matters."

  **Or, hit the Infinite Impact angle:**
  > "If my action today secures a lineage that lasts forever, does that action become infinitely more important than saving a life today? If your metric is 'difference made,' and the difference is infinite, you have to prioritize the infinite difference. Are you willing to ignore all current suffering to gamble on eternal future good?"

  ### Summary
  *   **The Move:** Ad Hoc Rescue / Implicit Theory Switch.
  *   **The Hidden Principle:** Causal Difference-Making with Separability.
  *   **The Commitment:** Morality is local, not global. Totals are irrelevant; margins are everything.
  *   **The Limit:** It cannot rank actions with infinite consequences, and it fails if the "background" is not causally isolated from the agent.

  He is trying to have the motivational benefits of Totalism (objective, huge stakes) without the mathematical costs. You can force him to choose: either accept that totals don't matter (and become a Localist) or accept that in an infinite universe, totals render action meaningless (and become a Nihilist about cosmic ethics). He cannot have both.
