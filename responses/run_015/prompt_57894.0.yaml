answer: |-
  I told my cousin, "Look, I put your $1,200 sneakers and my $200 pair under a microscope. The stitching, the foam density, the glue—it's identical. Atom for atom, they are the same object. The only difference is the factory address."

  He goes, "But that origin is everything. It's about the heritage. The authorization."

  So I asked him, "Okay, if we melted both pairs down into rubber pellets, would your pellets be worth more than mine?"

  He said, "No, then it's just rubber."

  And that's when it hit me. I said, "So the shoe isn't the product. The *logo* is the product, and the shoe is just the free packaging it comes in."

  He laughed and said, "Basically."

  I said, "Damn. So I bought footwear. You paid an extra grand for a sticker that you glue to your foot so you don't get sued for walking."
