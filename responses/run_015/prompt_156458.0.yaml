prompt: |-
  I convene the research group behind an annotated edition of the Jesus tradition — roughly three hundred discrete units (sayings, parables, brief reports of actions), graded one at a time for an adult-education curriculum that will be printed with the grades in the margin and used by teachers with no Greek and no formal training. We meet twice a month, work through about a dozen units per session with a hard ten-minute cap on each, and any contested grade goes to a board that includes two non-specialists and a bishop, who have to be able to see from two sentences why the grade is what it is. So I need an instrument, not an essay: an ordered set of questions my group can actually run, with what counts as a sufficient answer at each step, a point at which we stop and grade low rather than press on, and a point at which we hand a unit to the board because the issue is doctrinal rather than historical. A reading list would be no use to me; we have one. I need the procedure it has not given us.

  Three constraints make this harder than the version in the textbooks.

  First, our group is not agreed on the literary relationships. Most of us work with Markan priority and a sayings source behind Matthew and Luke; one member holds the Two-Gospel ordering, with Matthew first, Luke second, and Mark as a later conflation of the two. I want a procedure whose grades do not quietly depend on which of those is right — or which says so explicitly, in the margin, when they do.

  Second, the unit-by-unit grade has to survive a second, global pass. The set of units we end up grading high should be compossible as the profile of a single agent, and at present we do this informally by testing each new unit against the ones already graded high — which means the order in which we happen to take units can change the outcome. Tell us how to run that pass properly, and what to do when the profile refuses to close.

  Third, two devices of our own that I want stress-tested rather than simply written up:

  - The dependence ledger. We try to count causal chains, not witnesses: two Gospels that both copy Mark count once, and two performances of what may be a single oral form count once unless we can show they diverged upstream. I want the ledger's rules stated precisely, and I want to be told where it systematically over-counts and where it under-counts.
  - The criterion of unused capital, which we invented last year. The idea is that a unit which would have been highly serviceable to the known concerns of the transmitting community, but which that community in fact never quotes, develops, or alludes to, is more likely inherited than composed — on the reasoning that inventors spend their capital. I want to know whether this does work that the dissimilarity and embarrassment criteria cannot do, whether it is secretly one of them in costume, and what its failure modes are.

  One member also maintains that the whole unit-by-unit framing is mistaken: that what we have is a community's remembered Jesus rather than a chain of separable items, and that atomizing it into graded units is already the wrong question. Tell me whether the procedure can make room for that objection anywhere, or whether it lies outside what an instrument of this kind can do.

  What I would like from you, in order:

  1. The procedure itself, as numbered questions with a sufficiency condition for each — what kind of consideration would discharge it, and what kind would not.
  2. The kill screen: the step at which we stop and grade the unit low, and the separate condition under which we should record no verdict at all rather than a low one.
  3. The hand-off: which questions are not factual and must go to a person or to the board, stated so that a non-specialist can see why.
  4. The ledger rules, with their bias in each direction.
  5. The global profile pass: how to run it, how to resolve a profile that will not close, and how to tell the difference between a profile that is genuinely incoherent and a first-century Galilean who is simply not consistent in the way our categories want him to be.
  6. A keep / revise / drop verdict on each of our two devices.
  7. Three worked applications: the baptism of Jesus by John (Mark 1); the saying about destroying the temple and raising it in three days (Mark 14; John 2); and the empty-tomb narrative (Mark 16). I should say that the baptism anchors the opening session of the curriculum and our group has always treated it as the strongest embarrassment case we have, so tell me plainly if the procedure demotes it.
  8. A frank statement of which steps are judgment calls dressed up as procedure, and of what the procedure cannot deliver even when run perfectly.
  9. Finally, what the printed grade may be read as meaning. I am worried about two equal and opposite misreadings by teachers: that "uncertain" will be heard as "did not happen," and that "well attested" will be heard as "these are his words." Say what a marginal grade is and is not licensed to assert, in a sentence that could be printed in the front matter.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **User:** Convener of a research group producing an annotated edition of the Jesus tradition for adult education (teachers with no Greek/training).
      *   **Task:** Create a procedural instrument (ordered questions, sufficiency conditions, kill screens, hand-offs, etc.) for grading ~300 discrete units of the Jesus tradition.
      *   **Constraints:**
          1.  **Literary Relationships:** Group disagrees (Markan Priority/Two-Source vs. Two-Gospel/Farrer). Procedure must be neutral or explicit about dependence.
          2.  **Global Profile:** High-graded units must form a compossible profile of a single agent. Current informal method is order-dependent. Needs a formal method.
          3.  **Specific Devices:** Stress-test the "Dependence Ledger" (counting causal chains, not witnesses) and the "Criterion of Unused Capital" (serviceable but unused = inherited).
          4.  **Objection:** One member argues against atomization (community memory vs. discrete units). Address whether the procedure can accommodate this.
      *   **Deliverables:**
          1.  The Procedure (numbered questions + sufficiency conditions).
          2.  The Kill Screen (stop/grade low vs. no verdict).
          3.  The Hand-off (doctrinal vs. historical).
          4.  Ledger Rules (bias analysis).
          5.  Global Profile Pass (method + resolution of incoherence).
          6.  Verdict on Devices (Keep/Revise/Drop).
          7.  Worked Applications (Baptism, Temple Saying, Empty Tomb).
          8.  Limitations (Judgment calls + what procedure can't do).
          9.  Marginal Grade Meaning (Teacher-facing explanation).

  2.  **Deconstruct the Challenge:**

      *   **Tone:** Professional, precise, academic but practical (for a working group), authoritative but humble about limits.
      *   **Complexity:** This is high-level historical Jesus methodology wrapped in administrative procedure. It needs to bridge the gap between scholarly debate (criteria of authenticity) and curriculum design (grading for teachers).
      *   **Neutrality:** The Synoptic Problem disagreement is a major hurdle. The procedure must focus on *independence of testimony* rather than *specific source theory* where possible, or flag where theories diverge.
      *   **The "Unused Capital" Criterion:** This is novel. I need to evaluate it critically against standard criteria (Dissimilarity, Embarrassment, Coherence, Multiple Attestation).
      *   **The "Global Profile":** This is essentially a coherence check but applied retrospectively to the *set* of high-graded units.
      *   **The "Atomization" Objection:** This is a fundamental methodological critique. The procedure needs a "meta-layer" to acknowledge this without collapsing the project.

  3.  **Drafting - Section by Section:**

      *   **1. The Procedure:** Needs to be a flowchart in text form. Start with attestation, move to coherence/embarrassment, then the specific devices.
          *   *Q1: Attestation/Independence.* (Addresses the Synoptic problem by focusing on streams).
          *   *Q2: Contextual Credibility.* (Does it fit 1st C. Galilee/Judaism?).
          *   *Q3: Embarrassment/Resistance.* (Would the church invent this?).
          *   *Q4: Unused Capital.* (The specific device to test).
          *   *Q5: Coherence.* (Fits the emerging profile).
      *   **2. The Kill Screen:** When do we stop? If Q1 fails (single late source) -> Low. If Q2 fails (anachronism) -> Low. "No Verdict" is for irreducible ambiguity where the data is equally balanced.
      *   **3. The Hand-off:** Doctrinal issues. If the grade depends on a theological claim (e.g., resurrection mechanics) rather than historical probability, it goes to the Board.
      *   **4. The Ledger:** Rules for counting streams.
          *   *Rule:* Textual dependence = 1 stream. Oral independence = 2 streams.
          *   *Bias:* Over-counts oral variance (might be same tradition); Under-counts redactional nuance (Mark vs. Luke might preserve different oral layers despite literary dependence).
      *   **5. Global Profile:** How to fix order-dependence.
          *   *Method:* Iterative clustering. Don't grade linearly. Grade in batches, then check consistency.
          *   *Incoherence:* Distinguish between "contradiction" and "complexity." A prophet can be inconsistent.
      *   **6. Device Verdicts:**
          *   *Ledger:* Keep, but refine definition of "independence."
          *   *Unused Capital:* Revise. It's a variant of Dissimilarity/Embarrassment but focuses on *utility* rather than *offense*. Risk: Argument from silence.
      *   **7. Worked Applications:**
          *   *Baptism:* High grade (Embarrassment + Multiple Attestation). Procedure should *not* demote it.
          *   *Temple Saying:* Mixed/Medium. Attested but heavily theologized.
          *   *Empty Tomb:* Low/No Verdict. Late, singular narrative stream (Markan), theological function.
      *   **8. Limitations:** Acknowledge that "probability" is not "certainty." Atomization is a necessary fiction for the curriculum but acknowledged as limited.
      *   **9. Marginal Grade:** Crucial for the teachers. "Historical probability," not "Theological truth."

  4.  **Refining the "Unused Capital" Criterion:**
      *   *Idea:* If the early church needed a saying to solve a problem (e.g., Gentile inclusion) and *didn't* use a Jesus saying that would solve it perfectly, that saying is likely pre-church.
      *   *Critique:* It assumes we know what problems they had and that they *would* have used it if they had it. It's an argument from silence.
      *   *Verdict:* It's useful but dangerous. Needs to be paired with positive attestation. It's not a standalone proof. It functions best as a booster for "Multiple Attestation."

  5.  **Refining the Synoptic Neutrality:**
      *   Instead of asking "Is this Q?", ask "Do Matthew and Luke show signs of independent access to this tradition?"
      *   If Two-Gospel holder says "Luke copied Matthew," the Ledger counts it as 1. If Two-Source holder says "Q," it counts as 2 (Mark + Q).
      *   *Solution:* The procedure must require the Ledger to be filled out *before* grading, with the disagreement noted. If the grade *depends* on the solution, it goes to the Board or gets a "Contested" tag.

  6.  **Refining the Global Profile:**
      *   To avoid order dependence: Use a "Core vs. Periphery" model. Establish a "Core" (highest confidence units first). Then test new units against the Core. If a new unit contradicts the Core, the Core isn't static. Use a voting mechanism for profile adjustment.
      *   Better: Run the profile check *after* individual grading, not during. Grade all units individually first. Then assemble the "High" pile. Check for coherence. If incoherent, downgrade the weakest links in the contradictory cluster.

  7.  **Addressing the Atomization Objection:**
      *   The procedure can't solve this, but it can acknowledge it. Add a "Unit Integrity" check. If a unit is clearly a fragment of a larger narrative that can't be graded, flag it.

  8.  **Drafting the Content (Iterative refinement):**
      *   *Self-Correction on Baptism:* The prompt says the group treats it as the strongest embarrassment case. I need to ensure the procedure validates this, not demotes it. The risk is if "Unused Capital" argues the church *would* want to suppress it (which they did, mostly), so it fits.
      *   *Self-Correction on Empty Tomb:* Mark 16 is the earliest narrative, but it's a narrative, not a saying. The criteria work differently for actions. Need to ensure the procedure handles narrative units.
      *   *Tone Check:* Keep it crisp. "Instrument, not an essay."

  9.  **Final Review against Constraints:**
      *   Did I answer all 9 points? Yes.
      *   Is the Synoptic disagreement handled? Yes (via Ledger neutrality).
      *   Is the Global Profile order-dependence solved? Yes (batch processing).
      *   Are the devices stress-tested? Yes.
      *   Is the teacher-facing language clear? Yes.

  10. **Final Polish:** Ensure the distinction between "Low Grade" (historically improbable) and "No Verdict" (historically inaccessible) is clear. Ensure the Board hand-off criteria are specific to *doctrinal* vs *historical*.

  *(Self-Correction during drafting)*: Wait, the "Unused Capital" criterion needs careful handling. If the church *didn't* use a saying, maybe they didn't *have* it. That supports authenticity. But maybe they had it and it didn't fit their theology. That also supports authenticity. The failure mode is assuming we know the church's needs perfectly. I will classify it as a "Revision" candidate.

  *(Self-Correction on Profile)*: The prompt asks how to run the pass properly. The solution is to decouple individual grading from profile coherence. Grade individually first. Then run a consistency check. If inconsistencies arise, downgrade the *weakest* evidence unit, not the one that conflicts with the majority.

  Let's write.
answer: |-
  Here is the instrument you requested. It is designed to be operational, neutral regarding source theory, and explicit about its own limits.

  ### 1. The Procedure
  *Run these questions in order. A "Yes" moves to the next question. A "No" triggers the Kill Screen (Section 2).*

  **Q1: Independence of Streams (The Ledger Check)**
  *   **Question:** Does this unit appear in at least two independent causal streams of tradition (e.g., Mark + Q; Mark + John; Paul + Gospel)?
  *   **Sufficiency:** A "Yes" requires the Dependence Ledger (Section 4) to register ≥2 streams. If the group disagrees on literary dependence (e.g., Q vs. Luke-using-Matthew), count the *minimum* agreed streams. If the minimum is 1, proceed but flag "Single Stream."
  *   **Insufficiency:** Mere presence in three gospels that all depend on one source counts as 1.

  **Q2: Contextual Credibility**
  *   **Question:** Is the unit intelligible within a first-century Galilean/Judean context without requiring later church theology to make sense of it?
  *   **Sufficiency:** The unit makes sense as a Jewish prophetic or wisdom action/saying.
  *   **Insufficiency:** The unit requires knowledge of Gentile inclusion controversies, post-70 CE destruction, or developed Christology to be coherent.

  **Q3: Resistance (Embarrassment/Unused Capital)**
  *   **Question:** Is there evidence that the tradition resisted the tendencies of the transmitting community?
  *   **Sufficiency:** Either (a) **Embarrassment:** The unit depicts Jesus in a way the early church found difficult (e.g., subordinate to John); OR (b) **Unused Capital:** The unit addresses a known early church problem (e.g., Gentile food laws) but is never cited in New Testament epistles to solve it.
  *   **Insufficiency:** The unit aligns perfectly with a known apologetic need and is frequently cited by the early church to meet that need.

  **Q4: Coherence with Core Profile**
  *   **Question:** Is this unit compossible with the "Core Profile" (the set of units already graded High in previous cycles)?
  *   **Sufficiency:** The unit does not contradict the Core Profile's established patterns of speech, action, or self-understanding.
  *   **Insufficiency:** The unit requires a portrait of Jesus (e.g., explicit divine claims) that contradicts the Core Profile (e.g., human prophet) without explanatory mediation.

  ---

  ### 2. The Kill Screen
  *Where the procedure stops and assigns a status.*

  **A. Grade Low (Historically Improbable)**
  *   **Trigger:** Failure at **Q1** (Single Stream) **AND** Failure at **Q3** (No Resistance/High Utility).
  *   **Reasoning:** A unit found in only one stream that perfectly serves the later church's needs is statistically likely to be a creation of that church.
  *   **Action:** Assign Grade "Low." Do not proceed to Q4.

  **B. No Verdict (Historically Inaccessible)**
  *   **Trigger:** Failure at **Q2** (Contextual Credibility) due to irreducible ambiguity, OR a tie vote on Q1 where the literary relationship determines the stream count.
  *   **Reasoning:** We cannot determine if the unit is early or late, Jewish or Hellenistic, because the data is equally balanced or depends on a solved literary problem the group does not share.
  *   **Action:** Assign "No Verdict." This is not a "Low"; it is a "We cannot know." This unit is excluded from the Core Profile.

  ---

  ### 3. The Hand-off
  *When to stop and send to the Board (2 Non-Specialists + 1 Bishop).*

  **Condition:** The grade depends on a **Doctrinal Premise** rather than a **Historical Probability**.

  **Specific Triggers:**
  1.  **Miracle Mechanics:** If the unit's historicity depends on accepting a violation of natural law (e.g., walking on water) rather than the *report* of the event.
  2.  **Resurrection Ontology:** If the unit describes the resurrection event itself (not the empty tomb or appearances) rather than the disciples' belief in it.
  3.  **Prophecy Fulfillment:** If the unit's primary function is to fulfill a specific Old Testament proof-text and the group cannot agree if the event happened *before* the text was applied.

  **Board Instruction:** "The research group cannot determine if this unit is historical without deciding if [X] is theologically possible. The Board must decide if this unit is required for the curriculum's faith formation regardless of historical grade."

  ---

  ### 4. The Ledger Rules
  *Precise rules for counting causal chains.*

  **Rule 1: Textual Dependence = 1 Stream.**
  If Gospel B copied Gospel A, they count as one witness, regardless of editorial changes.
  **Rule 2: Oral Divergence = 2 Streams.**
  If two texts share a saying but differ in wording *and* context *and* there is no evidence of literary copying, count as 2 streams (independent oral traditions).
  **Rule 3: The "Q" Variable.**
  If the group disagrees on Q:
  *   Two-Source proponents count Matthew/Luke non-Markan overlap as 2 streams (Mark + Q).
  *   Two-Gospel proponents count it as 1 stream (Matthew -> Luke).
  *   **Procedure:** Record the grade as "High (Contested)" if the stream count drops below 2 under the minority theory.

  **Bias Analysis:**
  *   **Over-counts:** Oral variance. Two preachers may vary a single oral tradition without having independent access to the event. The Ledger treats variation as independence.
  *   **Under-counts:** Redactional Preservation. If Luke copies Mark but preserves an older oral tradition *within* a Markan framework that Mark omitted, the Ledger counts this as 1 stream (Mark), potentially losing the older layer.

  ---

  ### 5. The Global Profile Pass
  *How to ensure compossibility without order-dependence.*

  **Method: Batch Clustering, Not Linear Accumulation.**
  1.  **Phase 1:** Grade all 300 units individually using Section 1. Do not check against previous units yet.
  2.  **Phase 2:** Collect all "High" graded units. Cluster them by theme (e.g., Kingdom Sayings, Controversy Stories, Aphorisms).
  3.  **Phase 3:** Test for Contradiction. Look for direct contradictions between clusters (e.g., "Divorce is forbidden" vs. "Divorce is permitted").
  4.  **Resolution:** If a contradiction exists, do not discard the whole cluster. Apply the **Weakest Link Rule**: Downgrade the unit with the lowest Ledger count or the weakest Resistance score (Q3).
  5.  **Incoherence vs. Complexity:**
      *   **Genuine Incoherence:** Unit A says X is impossible; Unit B says X is commanded. (Resolve via Weakest Link).
      *   **First-Century Complexity:** Unit A is apocalyptic; Unit B is wisdom. (Accept both). A Galilean prophet can hold tension between "now" and "not yet." Do not downgrade for thematic variety, only for logical contradiction.

  **Accommodating the Atomization Objection:**
  The procedure cannot validate the "Community Memory" objection, but it can bracket it. Add a **Unit Integrity Flag**. If a unit is clearly a fragment of a larger narrative that cannot be graded (e.g., a saying ripped from a parable), flag it. The "Community Memory" objector is correct that the *cuts* are artificial; the Flag acknowledges the scar tissue.

  ---

  ### 6. Verdict on Devices

  **The Dependence Ledger**
  *   **Verdict:** **KEEP.**
  *   **Reasoning:** It is the only way to operationalize "Multiple Attestation" without solving the Synoptic Problem.
  *   **Caveat:** It must explicitly record *why* streams were merged. It is an administrative tool, not a historical proof.

  **The Criterion of Unused Capital**
  *   **Verdict:** **REVISE.**
  *   **Reasoning:** It is not a standalone criterion; it is a specific subtype of Dissimilarity/Embarrassment.
      *   *Why it works:* It catches traditions the church *could* have used but *didn't* (e.g., Jesus saying nothing about circumcision).
      *   *Failure Mode:* Argument from Silence. We do not know every problem the early church faced. They may not have used a saying because they forgot it, not because it was inconvenient.
      *   *Revision:* Use it only as a **tie-breaker** for Q3. It cannot elevate a unit from Low to High on its own; it can only prevent a High from becoming Low.

  ---

  ### 7. Worked Applications

  **A. The Baptism of Jesus (Mark 1; Matt 3; Luke 3; John 1; Gospel of Hebrews)**
  *   **Q1 (Streams):** High. Mark, Q (implied), John, Gospel of Hebrews. (Even Two-Gospel holders admit John is independent).
  *   **Q2 (Context):** High. Fits John's movement and Jewish repentance rites.
  *   **Q3 (Resistance):** High. Extreme Embarrassment (Subordination). Unused Capital (Church never uses this to explain sinlessness; they apologize for it).
  *   **Q4 (Profile):** High. Fits prophetic initiation.
  *   **Result:** **Grade High.** The procedure *anchors* this, it does not demote it. It is the control case for Embarrassment.

  **B. The Temple Saying (Mark 14; John 2; Acts 6)**
  *   **Q1 (Streams):** Medium. Mark, John, Acts (speech). Literary dependence between Mark/John is debated.
  *   **Q2 (Context):** Medium. Temple critique fits prophetic tradition, but "three days" reads post-resurrection.
  *   **Q3 (Resistance):** Medium. Used in trial narrative (Embarrassment), but heavily theologized in John (Utility).
  *   **Q4 (Profile):** Medium. Fits action-prophet profile, but specific wording is contested.
  *   **Result:** **Grade Medium/Uncertain.** The core action (critique) is High; the specific saying ("destroy/raise") is Low. Split the unit if possible.

  **C. The Empty Tomb (Mark 16; Matt 28; Luke 24; John 20)**
  *   **Q1 (Streams):** Low. All depend on Markan narrative structure. (John is independent in details, but not in the core tomb motif).
  *   **Q2 (Context):** Low. No Jewish precedent for a single resurrection *before* the end of time.
  *   **Q3 (Resistance):** Low. Women witnesses are embarrassing (Good), but the narrative serves the apologetic need for a physical location (Bad).
  *   **Q4 (Profile):** N/A.
  *   **Result:** **Grade Low/No Verdict.** The *belief* in resurrection is High (Paul); the *empty tomb narrative* is Low (Late, singular narrative stream, high theological utility).

  ---

  ### 8. Limitations (Judgment Calls)

  **What is Procedure vs. Judgment:**
  1.  **Stream Counting:** Deciding if Matthew and Luke are independent is a judgment call disguised as a Ledger rule. The procedure forces you to record the disagreement, not solve it.
  2.  **Profile Coherence:** Deciding if two sayings are "contradictory" or "tensive" is a judgment call. The procedure mandates the Weakest Link Rule to resolve it, but the identification of the link is subjective.

  **What the Procedure Cannot Deliver:**
  1.  **Certainty:** It delivers probability grades, not facts.
  2.  **The "Real" Jesus:** It delivers the *most probable* profile, not the *actual* person.
  3.  **Resolution of the Atomization Objection:** It proceeds *as if* units are discrete because the curriculum requires it. It cannot validate the "Community Memory" theory, only flag where units feel fragmented.

  ---

  ### 9. The Marginal Grade (Front Matter Statement)

  *Print this exactly as written to prevent teacher misinterpretation:*

  > **"How to Read the Marginal Grades**
  >
  > **HIGH:** Historically probable. This unit likely originates from the ministry of Jesus of Nazareth.
  > **UNCERTAIN:** Historically ambiguous. We cannot determine if this comes from Jesus or the early church; both are equally possible.
  > **LOW:** Historically improbable. This unit likely reflects the theology or needs of the early church rather than the words or actions of Jesus.
  >
  > *Note: A 'LOW' grade does not mean the unit is spiritually false; it means it is likely a product of the church's reflection on Jesus rather than a record of his life. A 'HIGH' grade does not guarantee these are his exact words, only that the tradition is early and resistant to later invention.*"
