      *   **Key Plot Points Mentioned:** Briony's false accusation, the police file, Paul Marshall's impunity, Robbie's death, Cecilia's death, the meta-fictional twist (Briony wrote it all), the libel constraint, the mother's lack of papers, Robbie's inner life filtered through Briony.

