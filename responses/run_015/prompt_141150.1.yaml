      *   *Angle 2: The Author as Archivist.* Focus on Part Three and the London section. Briony as the keeper of the record, deciding what is preserved.
      *   *Angle 3: The Ethics of Ventriloquism.* Focus on the impossibility of accessing Robbie's consciousness without Briony's mediation. This aligns with the user's specific worry.
      *   *Decision:* Angle 3 is the strongest because it directly addresses the user's intuition about "ventriloquism" and pushes the TA's framework further. It bridges the gap between archival theory and narrative ethics.

  4.  **Applying the TA's Three-Way Distinction:**
      *   *(1) Silence because no position to record:* Mrs. Turner (Robbie's mother). She knows the truth but is a cleaner/servant. No social capital, no paper trail.
      *   *(2) Silence as embargo/custodial control:* Briony's manuscript. She holds the "true" version but embargoes it until the Marshalls die (and even then, publishes the fiction instead). Also, the police file is sealed/official, controlling the narrative against Robbie.
      *   *(3) Silence as counterfeit file:* The police report naming Robbie. The official record exists but names the wrong perpetrator. This is the "archival violence."

  5.  **Developing the Fourth Category (Ventriloquism):**
      *   The user calls it "ventriloquism." In philosophy of memory, this touches on *testimonial injustice* (Fricker) or *narrative appropriation*.
      *   Let's call it "Archival Ventriloquism" or "Narrative Possession." It's when the archive doesn't just silence the subject but speaks *for* them in a way that colonizes their interiority. Even Briony's "atonement" (the book) is an act of power over Robbie's memory. She grants him a voice, but it's *her* voice.
      *   Philosophical hook: This is the limit of the archive. The archive claims to preserve the past, but it actually preserves the *power relations* of the present.

  6.  **Critiquing the Reading (Where it flattens the book):**
      *   The title is *Atonement*. Theological/ethical dimension: Can you actually atone through art? McEwan seems to say no. "Giving them their happiness" is a final act of selfishness, not justice.
      *   An archival reading might turn Briony into a cold bureaucrat of memory. But she is haunted. The guilt is affective, not just procedural.
      *   The "happy ending" isn't just a lie in the file; it's a desperate prayer. If we treat it only as data manipulation, we miss the tragedy of her inability to forgive herself.

  7.  **The Novel's Contribution to Theory:**
      *   Theory often treats silences as structural. *Atonement* shows silences as *affective*.
      *   It shows that the "counterfactual" (the happy ending) is sometimes more ethically necessary for the survivor (Briony) than the truth is for the dead.
      *   It highlights the *aesthetic* dimension of archival power. It's not just filing; it's plotting.

