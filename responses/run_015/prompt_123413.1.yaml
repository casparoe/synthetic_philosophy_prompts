prompt: |-
  hi — I work in a tiny unit that vets draft policy papers and ministerial speeches before they go out, and honestly about a third of what we end up flagging is a historical analogy. At the moment the flagging is just whoever's on duty going "hmm, that feels loaded", which isn't great when one line in a speech gets quoted for the next decade. So I want an actual procedure.

  What we have to work with: the draft text only, no research time (call it fifteen minutes per review, sometimes five), reviewers who studied politics or law rather than history, and a unit head who signs off with one of four stamps — green (fine as illustration), amber (usable, but the disanalogy has to be named in the same sentence), red (cut), and a fourth one we've started using: strip, meaning kill the historical frame but keep whatever claim it was carrying.

  Some distinctions we use informally and that I'd like either sharpened or thrown out: the carrier (the surface story of the episode) versus the payload (what the analogy is actually doing — predicting, legitimating, allocating blame, or just adding colour); analogies that transfer a mechanism versus ones that transfer an outcome; the mirror test, i.e. when the same episode is routinely wheeled out for the opposite lesson (Vietnam both as "don't intervene" and as "don't half-commit"), which makes me think it isn't doing any inferential work at all; and what I call the birth-date problem, that a lot of the famous lessons were coined afterwards by people with an axe to grind about their own record.

  So: write me the procedure. The questions in order, what counts as a sufficent answer to each, where it terminates in red versus strip, and where it has to hand the decision to a person because the remaining question is about values or risk appetite rather than facts. Ground it in whatever is genuinely known about analogical reasoning — relevant versus superficial similarity, reference classes and base rates, whether a causal mechanism has actually been stated, the fact that invoking an analogy can itself change what the players then do — but no citations and no reading lists, I need something my team can run off the page.

  Then run it on three things on my desk right now:

  1. "This is our Munich moment — any concession on tariffs will only whet their appetite." From a speech on a trade deal.
  2. A paper arguing that the US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade and plan accordingly.
  3. My own favourite, which I suspect definately won't survive: a note saying the current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think.

  Give me the margin note my reviewer would write for each, including at least one stamp I won't like — don't soften it. Finish by saying plainly what the procedure can't do. British English please, and keep the jargon light: this is going into a style guide for non-specialists.

  cheers
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Works in a tiny policy vetting unit (speeches/papers).
      *   **Problem:** Historical analogies are frequently misused/loaded. Current process is subjective ("hmm, feels loaded").
      *   **Constraints:** 5-15 mins per review, reviewers are politics/law (not history) grads, need a clear procedure (questions, thresholds, termination points).
      *   **Existing Tools:** Stamps (Green, Amber, Red, Strip), informal distinctions (carrier/payload, mechanism/outcome, mirror test, birth-date problem).
      *   **Requirements:**
          *   Write a formal procedure (questions, sufficient answers, decision logic).
          *   Grounded in analogical reasoning theory (relevance, base rates, causal mechanisms, self-fulfilling prophecies) but *no citations/reading lists*.
          *   Apply the procedure to three specific examples (Munich/Tariffs, Thucydides Trap/US-China, July 1914/Cyber).
          *   Provide margin notes for each, including at least one unpopular stamp.
          *   State limitations of the procedure plainly.
          *   Tone: British English, light jargon, practical style guide format.
          *   Directness: "Don't soften it."

  2.  **Deconstruct the Procedure Design:**
      *   *Goal:* Move from "feels loaded" to "fails criterion X".
      *   *Time:* Must be quick. Max 5-6 questions.
      *   *Logic:* Needs to map to the four stamps (Green, Amber, Red, Strip).
      *   *Theory Integration:*
          *   *Relevance vs. Superficial:* Are the structural features similar?
          *   *Base Rates:* Is this a cherry-picked example?
          *   *Causal Mechanism:* Does it explain *why* things happen, not just *that* they happened?
          *   *Self-Fulfilling:* Will saying this make it happen (or prevent it)?
          *   *Mirror Test:* Can the same analogy prove the opposite?
      *   *Decision Points:* Where does fact end and risk appetite begin? (Usually at the "Amber" stage or when the analogy is politically useful but historically shaky).

  3.  **Drafting the Procedure (Iterative Process):**
      *   *Step 1: Identify Payload.* What is this analogy *doing*? (Predicting, Justifying, Warning). If it's just colour, it's lower risk. If it's predicting war, high risk.
      *   *Step 2: The Mechanism Check.* Does the draft explain *why* the past predicts the future? If no, it's likely superficial.
      *   *Step 3: The Mirror Test.* Has this event been used to argue the opposite? If yes, it's a cliché, not evidence.
      *   *Step 4: The Birth-Date/Origin Check.* Was the "lesson" learned by participants at the time, or invented later?
      *   *Step 5: The Consequence Check.* Does using this analogy box us in? (Self-fulfilling/locking out options).
      *   *Mapping to Stamps:*
          *   Green: Mechanism holds, no mirror, low risk.
          *   Amber: Mechanism weak, or Mirror exists -> Must name the disanalogy.
          *   Strip: Analogy is dangerous/wrong, but the underlying policy point stands on its own.
          *   Red: Analogy is factually wrong *and* drives the policy *and* creates high risk.

      *Refining for Speed:* Combine some steps. Make it a flowchart style text.
      *Refining for "Strip":* This is a crucial distinction. The *claim* might be valid, but the *history* is the problem.
      *Refining for "Hand-off":* When the history is debatable but the political risk is the real issue.

  4.  **Drafting the Application (The Three Examples):**

      *   *Example 1: Munich/Tariffs.*
          *   *Payload:* Warning against appeasement (concession = aggression).
          *   *Mechanism:* Psychological (appetite whetted).
          *   *Mirror Test:* Munich is often used to say "negotiate early before it gets to war" too, but mostly it's the "don't concede" meme.
          *   *Problem:* Trade tariffs $\neq$ territorial annexation. Mechanism is weak. High risk of locking out diplomacy.
          *   *Verdict:* **Red** or **Strip**. Let's go **Strip**. Keep the warning about tariffs, kill the Nazi comparison. It's too toxic and historically lazy.
          *   *Margin Note:* Needs to be sharp. "Munich is a rhetorical bludgeon, not an analytic tool."

      *   *Example 2: Thucydides Trap/US-China.*
          *   *Payload:* Predicting war (high baseline probability).
          *   *Mechanism:* Structural stress (rising power vs. established power).
          *   *Mirror Test:* Yes, many cases where rising powers didn't fight.
          *   *Problem:* Deterministic. Ignores agency. Base rates are actually low for great power war in nuclear age.
          *   *Verdict:* **Amber**. It's a known framework, but dangerous if treated as fate. Needs the disanalogy named (nuclear weapons, economic interdependence).
          *   *Margin Note:* "Treat as hypothesis, not gravity."

      *   *Example 3: July 1914/Cyber.*
          *   *Payload:* Room to de-escalate (nobody wants war).
          *   *Mechanism:* Sleepwalking/loss of control.
          *   *Problem:* 1914 participants *did* want war (some of them) or accepted it. "Nobody wants war" is the myth. Also, cyber is different (attribution issues).
          *   *Verdict:* **Red**. It relies on a false historical consensus ("sleepwalking") to argue for complacency. Dangerous.
          *   *Margin Note:* "1914 wasn't an accident; it was a series of choices. This analogy invites drift."

      *Wait, I need one stamp the user won't like.*
      *   User likes the July 1914 one ("My own favourite"). I should Red that one.
      *   User might want Munich to stay (it's common). I'll Strip that.
      *   Thucydides is academic, maybe Amber is acceptable.
      *   *Decision:* I will **Red** the July 1914 one. That's the "won't like" stamp.

  5.  **Drafting the Limitations:**
      *   What can't this do?
      *   Can't verify facts (no research time).
      *   Can't stop political lies (if the Minister *wants* to lie).
      *   Can't predict the future (analogy is never proof).
      *   Can't remove risk (only manage it).

  6.  **Review against Constraints:**
      *   British English (vetting, programme, colour, analyse).
      *   Light jargon (explain "payload" etc. simply).
      *   No citations.
      *   5-15 min mindset (keep steps punchy).
      *   Tone: Professional, direct, slightly weary but rigorous.

  7.  **Final Polish:**
      *   Ensure the "Strip" vs "Red" logic is clear. Strip = Keep the point, lose the history. Red = The point relies on the history and the history is broken.
      *   Check the "Hand-off" point. This is where risk appetite comes in. If the history is shaky but the Minister *wants* the risk, that's for the Unit Head.
      *   Make sure the margin notes sound like a tired but sharp reviewer wrote them.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe make the procedure a checklist.
      *   *Correction:* A flow of questions is better for a "style guide".
      *   *Initial thought:* Be nice about the 1914 analogy.
      *   *Correction:* User said "don't soften it". If it's bad history, call it bad history.
      *   *Check:* Did I include the "birth-date problem"? Yes, fold it into the "Origin" question.
      *   *Check:* Did I include the "Mirror Test"? Yes, essential.

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  **PROCEDURE: VETTING HISTORICAL ANALOGY IN POLICY TEXT**
  **Time allowance:** 5–15 minutes per instance.
  **Applicability:** Speeches, briefing notes, ministerial submissions.

  ### PART 1: THE FIVE QUESTIONS

  Reviewers must answer these in order. If a question fails, move to the **Decision Logic** below. Do not proceed to the next question if the analogy has already been flagged for removal.

  **1. What is the payload?**
  Identify what work the analogy is doing. Is it:
  *   **Decorative:** Adding colour or gravitas?
  *   **Explanatory:** Clarifying a complex mechanism?
  *   **Predictive:** Claiming X will happen because it happened before?
  *   **Prescriptive:** Arguing we *must* do Y to avoid Z?
  *   *Sufficient Answer:* A single label. If "Decorative", proceed to Q5. If "Predictive" or "Prescriptive", proceed to Q2.

  **2. Is the mechanism stated?**
  Does the text explain *why* the past episode predicts the future outcome, or does it simply assert the similarity? A valid analogy transfers a causal mechanism (e.g., "sanctions caused isolation then, so they will now"), not just an outcome (e.g., "war happened then, so war will now").
  *   *Sufficient Answer:* The draft must identify at least one structural feature shared by both cases that drives the result. If the text relies on "vibes" or surface resemblance (e.g., "both leaders wear suits"), flag immediately.

  **3. The Mirror Test**
  Has this specific historical episode been routinely used to argue the *opposite* policy in the last 20 years? (e.g., Munich used to argue for war *and* for negotiation; Vietnam used to argue for withdrawal *and* for surge).
  *   *Sufficient Answer:* Yes/No. If "Yes", the analogy is a cliché, not evidence. It signals the speaker is joining a tribe, not analysing a problem.

  **4. The Origin Check (Birth-Date Problem)**
  Was the "lesson" of the historical episode agreed upon by participants at the time, or was it codified later by winners, losers, or historians with an agenda?
  *   *Sufficient Answer:* If the lesson was coined more than 5 years after the event by someone justifying their own record, treat the analogy as contested opinion, not fact.

  **5. The Consequence Check**
  Does invoking this analogy lock us into a specific course of action or close off diplomatic off-ramps? Does it invite a self-fulfilling prophecy? (e.g., Calling a rival "Hitler" makes negotiation politically impossible).
  *   *Sufficient Answer:* An assessment of political risk. If the analogy makes the desired policy outcome harder to achieve later, it is a liability.

  ---

  ### PART 2: DECISION LOGIC & STAMPS

  **GREEN (Fine as illustration)**
  *   **Criteria:** Payload is Decorative OR Explanatory. Mechanism is sound. Mirror Test is negative.
  *   **Action:** Pass.

  **AMBER (Usable, with warning)**
  *   **Criteria:** Payload is Predictive/Prescriptive. Mechanism is plausible but contested. Mirror Test is positive (it is a cliché).
  *   **Requirement:** The disanalogy must be named in the same sentence or paragraph. (e.g., "Like Munich, concessions may embolden them, *though unlike 1938, economic interdependence acts as a brake*.")
  *   **Action:** Return to drafter with instruction to qualify the claim.

  **STRIP (Kill the frame, keep the claim)**
  *   **Criteria:** The underlying policy point is sound, but the historical vehicle is broken, offensive, or too risky. The analogy fails Q2 (Mechanism) or Q4 (Origin), but the sentence makes sense without the history.
  *   **Action:** Delete the historical reference. Rewrite the sentence to stand on current logic alone.

  **RED (Cut)**
  *   **Criteria:** The policy recommendation *depends* on the analogy. The analogy fails Q2 (Mechanism) AND Q5 (Consequence). It creates high political risk or commits the Department to a path based on false history.
  *   **Action:** Delete the paragraph. Require a rewrite based on current intelligence, not historical parallel.

  **HAND-OFF TO UNIT HEAD**
  *   **Criteria:** The history is debatable (Amber/Red boundary), but the risk is purely political (e.g., the Minister *wants* to use a loaded analogy to signal toughness).
  *   **Action:** Flag as "Risk Appetite". The Unit Head decides if the political gain outweighs the historical inaccuracy.

  ---

  ### PART 3: APPLICATION TO CURRENT DRAFTS

  **1. Speech Draft: "This is our Munich moment — any concession on tariffs will only whet their appetite."**
  *   **Review:**
      *   *Payload:* Prescriptive (Don't concede).
      *   *Mechanism:* Psychological (Appeasement fuels aggression). Weak transfer from territorial annexation to tariff schedules.
      *   *Mirror Test:* Positive. Munich is the ultimate cliché for "stand firm".
      *   *Consequence:* High. Invoking Munich makes subsequent negotiation look like "appeasement", boxing the Minister in.
      *   *Verdict:* **STRIP**.
  *   **Margin Note:**
      > **STRIP.** The Munich analogy is historically exhausted and structurally unsound for trade. Tariff concessions are reversible; territorial concessions are not. Using this frames negotiation as moral failure. Keep the warning about tariffs, delete the reference to 1938. It invites comparisons we cannot win if we eventually compromise.

  **2. Policy Paper: "US and China are caught in a Thucydides trap, so we should assume a high baseline probability of war this decade."**
  *   **Review:**
      *   *Payload:* Predictive (War is likely).
      *   *Mechanism:* Structural stress (Rising vs. Established power). Plausible, but deterministic.
      *   *Mirror Test:* Positive. Many rising powers did not fight (e.g., US/UK transition).
      *   *Consequence:* Moderate/High. Risks treating war as inevitable, potentially becoming a self-fulfilling prophecy in defence planning.
      *   *Verdict:* **AMBER**.
  *   **Margin Note:**
      > **AMBER.** The Thucydides Trap is a heuristic, not a law of physics. You cannot treat a contested political science theory as a base rate for war planning without qualification. Add the disanalogy: nuclear deterrence and economic integration did not exist in Peloponnesian times. If you leave this unqualified, you are arguing for fatalism, not strategy.

  **3. Internal Note: "Current cyber escalation is like July 1914 in that nobody actually wants the big war, so we have far more room to de-escalate than people think."**
  *   **Review:**
      *   *Payload:* Explanatory/Prescriptive (We can relax).
      *   *Mechanism:* Loss of control / "Sleepwalking".
      *   *Origin Check:* Fail. The "nobody wanted war" narrative was largely constructed post-hoc to absolve leaders of guilt. Key actors in 1914 *did* want war or accepted it as necessary.
      *   *Consequence:* High Risk. Suggests complacency. Cyber escalation lacks the clear mobilisation timetables of 1914, making "drift" more likely, not less.
      *   *Verdict:* **RED**.
  *   **Margin Note:**
      > **RED.** I know you like this one, but it fails the history. 1914 was not an accident; it was a series of conscious choices by leaders who calculated war was preferable to the status quo. Using the "sleepwalking" myth to argue for de-escalation room is dangerous. It suggests the system is safer than it is. Rely on current attribution data, not a comforting myth about the Great War.

  ---

  ### PART 4: WHAT THIS PROCEDURE CANNOT DO

  Be plain with the Unit Head and the drafters about the limits of this checklist.

  1.  **It cannot verify facts.** We do not have research time. If a drafter cites a specific date or quote, we assume it is real. We are vetting the *logic of the comparison*, not the archive.
  2.  **It cannot stop political lying.** If a Minister decides that a bad analogy serves a political purpose (e.g., rallying the base), this procedure can only flag the risk, not veto the decision. That is a value judgement, not a factual one.
  3.  **It cannot predict the future.** A "Green" stamp does not mean the analogy is *true*, only that it is *reasonably constructed*. History does not repeat, and no checklist can force it to.
  4.  **It cannot remove risk.** It only makes the risk visible. An "Amber" stamp tells the Minister: "You can say this, but you are walking into a fight with the historians." Some Ministers will walk anyway.

  **Final Note to Reviewers:**
  Your job is not to be the historian who says "actually, it's more complicated." Your job is to be the lawyer who says "this evidence wouldn't hold up in court, and if you rely on it, you lose the case." If the analogy breaks under the weight of the first counter-argument, cut it.
