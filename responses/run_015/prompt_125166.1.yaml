  Section 2: Menu of precise readings

  1. **Literal Authorship:** The victors physically pen the surviving chronicles.
  *Label:* Trivial / False.
  *Analysis:* This reading assumes 'writing' denotes literal composition and 'victory' implies total silencing of the foe. It suggests losers remain mute. Historically, this is false; defeated leaders frequently write memoirs or diaries, such as Napoleon on St Helena. Victory ensures state-sponsored textbooks dominate education, but it does not grant exclusive authorship. If taken literally, it denies the existence of private correspondence from the losing side, which is empirically incorrect. Consequently, this reading cannot justify ignoring defeated sources, as those sources plainly exist and are often accessible to A-level students.

  2. **Archival Control:** The victors decide which documents are preserved or destroyed.
  *Label:* Substantive.
  *Analysis:* Here, 'writing' means curating the evidence base, and 'victory' confers the administrative power to burn records or classify them secret. This is defensible; occupiers often seize national archives to legitimise their rule. However, it is rarely total. Private collections survive, and accidental preservation occurs amidst chaos. This claim acknowledges significant bias in the *source base* but does not negate the value of remaining fragments. It suggests caution, not abandonment, of defeated records. For a seminar, this implies verifying provenance rather than rejecting the source outright.

  3. **Interpretive Dominance:** The victors' framework sets the questions later historians ask.
  *Label:* Substantive / Defensible.
  *Analysis:* 'Writing' here is hermeneutic rather than physical. Victory establishes the political language and categories, such as 'terrorist' versus 'freedom fighter', through which events are understood. Even if defeated sources exist, they are often read through the victor's conceptual lens. This is a strong sociological claim about academic inertia and state influence on education, making counter-narratives difficult to articulate. This influences which questions are deemed worth asking in examinations. However, it implies that examining defeated sources is the only method to expose these embedded assumptions. It turns the slogan into a reason to study the losers, not ignore them.

  4. **Strong Constructivism:** Historical facts are constituted by the victors' narrative; no independent reality exists.
  *Label:* False / Self-undermining.
