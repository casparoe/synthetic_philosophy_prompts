      *   **Substance Sortal vs. Phase Sortal:**
          *   *Substance Sortal:* Defines what something *is* essentially (e.g., "human"). If lost, the object ceases to exist.
          *   *Phase Sortal:* Defines a temporary state (e.g., "child", "larva"). If lost, the object persists.
          *   *Application:* If "human" is a substance sortal for Gregor, he dies at transformation. If it's a phase sortal, he persists as a non-human person/entity.
      *   **Bundle Theory vs. Bare Particulars:**
          *   *Bare Particulars:* There's a substratum (Gregor-ness) that holds properties. If properties change radically, the substratum might remain.
          *   *Bundle Theory:* An object is just a collection of co-located properties. If the properties change significantly enough (psychological + physical), the bundle dissolves or becomes a new bundle.
      *   **Identity Over Time:** Psychological continuity vs. physical continuity. Gregor retains memories and human concerns initially, but his instincts and body change.

