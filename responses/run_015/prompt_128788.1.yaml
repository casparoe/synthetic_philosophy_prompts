answer: |-
  To approach *The Metamorphosis* without reducing it to a mere illustration of metaphysical puzzles, we must first track how the text itself handles Gregor's identity over time before imposing our categories. Initially, Gregor wakes with a discontinuous physical form but continuous psychological states; he worries about his job, remembers his family's debts, and retains his human anxiety. This suggests a Lockean psychological continuity view where memory and consciousness sustain identity despite radical physical change. However, as the novella progresses, this psychological continuity degrades. Gregor loses his taste for human food, forgets his past obligations, and finds pleasure in crawling on the ceiling. The text depicts identity not as a binary switch but as a decay curve; the "human" properties in his bundle are slowly replaced by "vermin" properties. Yet, throughout this decay, Gregor retains a capacity for suffering and a desire for connection, specifically during the violin scene where he is drawn by music. The narrative voice never abandons Gregor's perspective until he dies, implying a persistent subject of experience even when his properties suggest otherwise. The family, conversely, treats his identity as contingent on utility and form; when he cannot work and looks monstrous, they treat his persistence as a burden rather than a continuation of a person.

  When we apply the distinction between substance sortals and phase sortals, the tension sharpens. If "human" is a substance sortal for Gregor, then the moment of transformation marks his death, and the remaining creature is a new entity inhabiting his room. This aligns with Grete's final assertion that "it" cannot be Gregor because the real Gregor would have left voluntarily; she treats humanity as an essential property tied to moral agency and form. If "human" is merely a phase sortal, like "child" or "student," then Gregor persists through the transformation as a single particular undergoing a radical phase change. The text complicates this by showing that Gregor's own self-conception shifts. He initially insists on his human interiority against his exterior form, but eventually, he accepts the family's view that he is a burden. Regarding the bundle theory versus bare particulars, a bare particular account would suggest a substratum of "Gregor-ness" that holds properties regardless of whether they are insectile or human. This fits Gregor's internal sense of self. However, bundle theory offers a more disturbing reading: if an object is just a collection of co-located properties, then as the properties rotate from human to insect, the original bundle dissolves. The apple lodged in his back is crucial here; it is an external object forced into his bundle, a physical inscription of his father's violence that becomes a permanent property of the creature. It signifies that his ontology is now partially constituted by the family's rejection. If we strictly follow bundle theory, the Gregor who woke up on day one is not numerically identical to the Gregor who dies in December, because too many essential properties have been swapped out.

  However, this is where the metaphysical reading breaks against the literary text. Analytic metaphysics seeks precise conditions for identity, but Kafka writes to expose the horror of ontological ambiguity. If we decide Gregor is a new object (bundle shift) or a dead human (substance sortal failure), we resolve the tension too neatly. The story pushes back by insisting that Gregor's ontological status is not intrinsic but intersubjective. He becomes "it" not because his properties objectively cross a metaphysical threshold, but because the family withdraws their recognition of his humanity. The metaphysics of universals fails here because "humanity" in the novella does not function as a mind-independent universal instantiated in a particular; it functions as a social status granted by others. Grete's shift from care to disgust is not a discovery of Gregor's true nature but a performative act that strips him of personhood. To treat Gregor as a thought experiment is to ignore that the tragedy lies in the gap between his internal persistence (the bare particular feeling) and his external classification (the bundle perceived by others). The text suggests that without ethical recognition, the universal "human" cannot be instantiated, regardless of the underlying metaphysics.

  Summary: The novella ultimately subverts metaphysical categorization by demonstrating that ontological status is determined less by intrinsic properties than by intersubjective recognition and ethical regard.
