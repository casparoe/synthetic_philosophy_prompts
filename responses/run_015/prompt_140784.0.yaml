  # NEIGHBOURHOOD VIEWS: A MAP FOR THE DROP-IN
  **Printed on A3 Landscape**

  ## INTRODUCTION
  We often argue as if there are only two sides: those who want building and those who do not. But two people can both say "Yes" for very different reasons, or both say "No" for opposite ones. This sheet helps you find your position based on **what you value**, not just what you want to happen.

  There are **8 Questions**. Answer them honestly. There are no right answers. Follow the arrows to find your position at the bottom.

  ---

  ## THE QUESTIONS (The Branches)

  **(1) THE TOWN VS THE STREET**
  *Case:* The Town Council says we need homes, but three-quarters of this street vote No.
  **Q:** If you had the final vote, whose decision stands?
  *   [ ] The Town's (Go to 2)
  *   [ ] The Street's (Go to 3)

  **(2) THE EMPTY HOMES (?)**
  *Case:* A company abroad owns eight local flats and keeps them empty.
  **Q:** Should the Council force them to sell or rent, even if it's their property?
  *   [ ] No, it's their property (Leaf A)
  *   [ ] Yes, homes must be used (Go to 4)

  **(3) THE VETERAN NEIGHBOUR**
  *Case:* A neighbour has lived here thirty years. A new buyer moves in next door.
  **Q:** Does the thirty-year neighbour get more say on planning than the new buyer?
  *   [ ] Yes (Leaf B)
  *   [ ] No (Go to 5)

  **(4) THE SCHOOL PLACE (?)**
  *Case:* Forty flats are proposed, but the primary school is already full.
  **Q:** Do you stop the flats until the school is bigger, or build the flats and make the school catch up?
  *   [ ] Stop the flats (Leaf C)
  *   [ ] Build the flats (Go to 6)

  **(5) THE GARAGE ANNEXE**
  *Case:* A family wants to turn a garage into a home for an elderly parent. No new building.
  **Q:** Does the street have a right to say no, or is it the owner's choice?
  *   [ ] Street says no (Leaf D)
  *   [ ] Owner's choice (Leaf E)

  **(6) THE PRICED-OUT LOCAL**
  *Case:* Someone grew up here but was priced out fifteen years ago. Now they want a new flat.
  **Q:** Do they count as a local who deserves priority, or a stranger?
  *   [ ] Local (Leaf F)
  *   [ ] Stranger (Go to 7)

  **(7) THE PAY-OFF**
  *Case:* If the building goes ahead, the developer offers a new park for this street only.
  **Q:** Is the street *owed* this park, or is it just a gift to keep you quiet?
  *   [ ] Owed (Leaf G)
  *   [ ] Gift (Go to 8)

  **(8) THE NURSES VS INVESTORS**
  *Case:* The new flats could go to nurses at the hospital, or be sold to investors who won't live here.
  **Q:** Does it matter to you which group gets them?
  *   [ ] Yes, nurses (Leaf H)
  *   [ ] No, market decides (Leaf I)

  *(Note: Questions marked (?) ask you to choose a principle, not to guess what will happen to rents or traffic.)*

  ---

  ## THE POSITIONS (The Leaves)

  **Leaf A: The Proprietor**
  *Owner's decision is essentially their own.*
  > **Awkward Commitment:** You must accept that a landlord can leave homes empty while people sleep in cars, provided the paperwork is correct.

  **Leaf B: The Incumbent**
  *Long residence earns a real say.*
  > **Awkward Commitment:** You must accept that a newcomer who buys the house next door has fewer rights to their own home than you have to theirs.

  **Leaf C: The Infrastructure First**
  *No building without capacity.*
  > **Awkward Commitment:** You must accept that no new homes can be built in the most popular parts of town, forcing growth into places with no jobs or transport.

  **Leaf D: The Commune**
  *The street itself, as a body, holds a claim.*
  > **Awkward Commitment:** You must accept that the street can stop a grandmother living in a garage, even if her family owns the brick and mortar.

  **Leaf E: The Libertarian**
  *Owner's decision is their own (Small Scale).*
  > **Awkward Commitment:** You must accept that if every owner changes their garage, the character of the street vanishes, and you have no recourse.

  **Leaf F: The Returner**
  *First duty is to those already priced out or pushed out.*
  > **Awkward Commitment:** You must accept that a person who left fifteen years ago has more claim than a nurse who has served the town for five years but was born elsewhere.

  **Leaf G: The Compensation Right**
  *Loss of amenity must be paid for.*
  > **Awkward Commitment:** You must accept that planning permission is a commodity that can be bought, rather than a judgment on what is right for the town.

  **Leaf H: The Commoner**
  *The gain created by permission belongs to everybody.*
  > **Awkward Commitment:** You must accept that the Council should pick who lives in a private flat based on their job, not their ability to pay.

  **Leaf I: The Planner**
  *Permission is a public power that must be used for the widest benefit.*
  > **Awkward Commitment:** You must accept that if the Town says "Yes", your street's objection is irrelevant, even if you live with the noise for decades.

  **Leaf J: The Cosmopolitan** *(Reached via Q6 Stranger -> Q8 Market)*
  *First duty is to people not yet here.*
  > **Awkward Commitment:** You must accept that the current character of the street is less important than the needs of people who do not yet live in the town.

  ---

  ## THE EMPTY BOXES (Unoccupied or Incoherent)

  *   **The "Town Decides But Pays" Paradox:** If you believe the Town decides for the *widest benefit* (Leaf I), it is incoherent to also believe the street is *owed* specific compensation (Leaf G). If the benefit is widest, why pay off one street?
  *   **The "Owner Decides But Town Pays" Gap:** Some argue the Owner should decide everything (Leaf A), but if the school gets full, the Town should pay to expand it. This is unvisited in our town; people usually link the right to decide with the duty to pay.
  *   **The "Indistinguishable Pair":** **Leaf I (The Planner)** and **Leaf J (The Cosmopolitan)** often look the same in a vote (both say "Build"). The tree separates them by *reason*: one trusts the Council's power, the other trusts the needs of strangers. In practice, you cannot tell them apart without asking Question 8.

  ---

  ## FOOTNOTE: WHERE THE USUAL ARGUMENT FAILS

  **1. The "For/Against" Collapse:**
  The usual argument collapses **The Proprietor (Leaf A)** and **The Planner (Leaf I)**. Both might vote "Yes" to a new block. But one believes it because the owner has a right to sell, and the other because the town has a right to house. They will disagree violently the moment the owner wants to keep the flats empty.

  **2. The Questions That Separate Neighbours:**
  You may think you agree with a neighbour because you both want "sensible building." The questions that most reliably reveal you disagree are **Question 1 (Town vs Street)** and **Question 3 (Veteran vs Newcomer)**.
  *   If you think the **Town** wins Q1, you believe in democracy by population.
  *   If you think the **Street** wins Q1, you believe in democracy by place.
  *   If you think the **Veteran** wins Q3, you believe rights grow with time.
  *   If you think the **Newcomer** equals the Veteran, you believe rights attach to the dwelling, not the person.

  *Most neighbours who say "We agree" actually split on these two lines.*

