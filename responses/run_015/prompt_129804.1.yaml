      *   **Topic:** Semantic Externalism (Putnam's Twin Earth) applied to non-natural kind terms (psychological states like 'regret', 'suspicion') and empty concepts.
      *   **Task:** Write a "full spec" of desiderata (requirements) for an adequate theory of mental/content determination.
      *   **Components:**
          *   List of requirements/cases the theory must handle (Twin Earth Water, Twin Earth Justice, First-Person Reports).
          *   Distinctions it must preserve (Narrow vs. Wide, First-Person Authority vs. Third-Person, Empty vs. Non-Empty).
          *   Constraints from Phil of Language/Mind.
          *   Classification: Non-negotiable vs. Camp Preference.
          *   Flagging Tensions/Incompatibilities (especially First-Person Authority vs. Environmental Determination).
          *   Brief Scoring of existing theories (Causal-Historical, Descriptivism, 2D Semantics).
      *   **Tone/Style:** Philosophical, precise, structured, addressing the user's specific suspicion about incompatibility.

  2.  **Deconstruct the Core Problem:**
      *   Putnam's original argument ("Meanings just ain't in the head") works beautifully for natural kinds (Water = H2O).
      *   It gets messy for:
          *   *Psychological predicates:* Is 'regret' determined by social usage or internal feeling?
          *   *Empty terms:* 'Phlogiston', 'Witch', 'Justice' (if non-natural). If there's no referent, what fixes the content?
      *   The user suspects a tension between *Externalism* (content depends on environment) and *First-Person Authority* (I know what I think without investigating the world).

  3.  **Drafting the Desiderata (The "Spec"):**
      *   I need to categorize these into: Empirical/Intuitive Cases, Conceptual Distinctions, and Theoretical Constraints.
      *   *Case 1: The Original Twin Earth.* Theory must explain why Oscar's 'water' $\neq$ Twin-Oscar's 'water'. (Non-negotiable for externalists, but the prompt asks for a theory covering *both*, so the theory must at least *accommodate* this intuition).
      *   *Case 2: The Psychological Twin Earth.* If Twin-Oscar feels 'regret', is it the same state? Intuition says yes (internal), unlike water. Theory must explain the divergence from natural kinds.
      *   *Case 3: Empty Terms.* 'Phlogiston'. No referent. Content still exists. Theory must explain determination without causal contact.
      *   *Distinction 1: Narrow vs. Wide.* Must allow for some content to be shared across twins (functional role) and some to differ (reference).
      *   *Distinction 2: First-Person Authority (FPA).* I know I'm in pain/doubt without empirical investigation. Externalism threatens this if content is external.
      *   *Distinction 3: Normativity.* Content involves correctness conditions (truth/falsity).

  4.  **Identifying Tensions (The "Blow Up" Points):**
      *   *The Privileged Access Problem:* If content is determined by external factors I don't know, how do I know my own content? (McKinsey Paradox).
      *   *The Empty Reference Problem:* If content = causal relation to object, and object doesn't exist, content = null. But we think about phlogiston.
      *   *The Psychological State Problem:* If 'belief' is a relation to a proposition, and propositions are external, then mental states aren't purely internal causes of behavior.

  5.  **Evaluating Existing Theories (Briefly):**
      *   *Causal-Historical (Putnam/Kripke):* Good on Water, bad on Empty Terms, bad on FPA.
      *   *Descriptivism (Fregean):* Good on FPA, Good on Empty Terms, bad on Twin Earth Water.
      *   *Two-Dimensionalism (Chalmers/Jackson):* Tries to save both. Distinguishes Primary (epistemic) and Secondary (metaphysical) intensions. Good on tensions, but complex.

  6.  **Refining the Output Structure:**
      *   Introduction: Acknowledge the depth of the problem (it's the "Hard Problem" of externalism).
      *   Section 1: The Desiderata List (Cases, Distinctions, Constraints). Mark Non-negotiable vs. Preference.
      *   Section 2: The Incompatibility Matrix (Flagging the tensions).
      *   Section 3: Theory Scorecard (Brief).
      *   Conclusion: Summary of the stalemate.

  7.  **Drafting Content - Specific Considerations:**
      *   *Regret/Suspicion:* These are often treated as "wide" in some contexts (you can't regret what didn't happen?) but "narrow" in others (the feeling is the same). Need to specify *phenomenal* vs. *intentional* content.
      *   *Empty Concepts:* Need to ensure the theory handles *failure of reference* without *failure of meaning*.
      *   *FPA vs. Externalism:* This is the crux. I need to explicitly mention the McKinsey Paradox.
      *   *Labeling:* Use clear headers. Use "MUST" for non-negotiables and "SHOULD" for preferences.

  8.  **Self-Correction/Review during drafting:**
