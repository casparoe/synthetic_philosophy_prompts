      *   *Check:* Is the tone right? Needs to be analytical, not just summary.
      *   *Refinement:* Make sure to distinguish between *phenomenal* states (what it feels like) and *intentional* states (what it's about). Regret has both. Twin Earth usually targets the intentional.

  9.  **Final Polish:** Ensure the distinction between "Non-negotiable" (logical coherence, basic intuitions) and "Camp Preference" (externalist vs. internalist bias) is clear. (Actually, for a "spec", most things will be framed as "Adequacy Conditions" which are non-negotiable for the theory to be *viable*, even if the theory ultimately rejects one intuition to save another). I will frame them as "Phenomena to be Accommodated or Explained Away."

