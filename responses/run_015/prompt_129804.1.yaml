      *Scoring:* Keep it tight. 3-4 sentences per theory.

      *Okay, ready to write.*
answer: |-
  This is the central friction point in post-Putnamian philosophy of mind. You have identified the exact fault line where Semantic Externalism strains against the phenomenology of introspection and the logic of empty reference.

  Below is the specification sheet for a theory of content determination. It is divided into **Explanatory Targets** (cases the theory must handle), **Structural Constraints** (distinctions it must maintain), and **Logical Boundaries** (rules it cannot break). I have flagged which are non-negotiable (logical/phenomenological bedrock) and which are camp preferences (theoretical commitments). Finally, I have mapped the incompatibilities, specifically addressing your suspicion about First-Person Authority.

  ### I. Explanatory Targets (The Cases)

  An adequate theory must provide truth-conditions or determination-conditions for the following scenarios.

  **1. The Natural Kind Divergence (Twin Earth: Water)**
  *   **Case:** Oscar (Earth) and Twin-Oscar (Twin Earth) are molecule-for-molecule identical. Oscar points to H₂O and says "Water." Twin-Oscar points to XYZ and says "Water."
  *   **Requirement:** The theory must explain why the *extension* of their terms differs despite identical internal states.
  *   **Status:** **Non-Negotiable Data Point.** (Even internalists must explain why this intuition is compelling, even if they reject the conclusion).

  **2. The Psychological State Invariance (Twin Earth: Regret/Suspicion)**
  *   **Case:** Oscar feels regret over a lie he told. Twin-Oscar feels an identical internal state over a lie he told (in his environment).
  *   **Requirement:** The theory must explain why 'regret' seems to supervene on the *internal* functional/phenomenal state, unlike 'water'. If the theory makes 'regret' wide, it must explain why behavior and phenomenology remain identical across twins.
  *   **Status:** **Non-Negotiable Phenomenology.** A theory that claims Twin-Oscar is *not* regretting (because the external relational conditions differ) violates basic ascription practices.

  **3. The Empty Reference Problem (Phlogiston/Witch/Justice)**
  *   **Case:** A thinker entertains the thought "Phlogiston is released during combustion." There is no phlogiston. There is no causal link to a real object.
  *   **Requirement:** The theory must assign content to the thought without a real-world referent. It must distinguish "Phlogiston" from "Witch" without relying on distinct causal histories with actual entities.
  *   **Status:** **Non-Negotiable Logical Constraint.** A theory that renders all empty thoughts content-less (null) fails to explain reasoning, error, or fiction.

  **4. The Abstract Object Case (Justice/Number)**
  *   **Case:** Oscar thinks "Justice is fairness." 'Justice' does not have a physical correlate like water, nor is it clearly empty like phlogiston.
  *   **Requirement:** The theory must determine content for terms that arguably refer to abstracta or social constructs, where causal contact is metaphorical or institutional rather than physical.
  *   **Status:** **Camp Preference (Platonist vs. Nominalist).** However, the theory *must* handle the determination mechanism (social practice vs. abstract relation).

  ---

  ### II. Structural Constraints (The Distinctions)

  The theory must preserve these distinctions without collapsing them into one another.

  **1. Narrow vs. Wide Content**
  *   **Requirement:** The theory must distinguish between content that supervenes on the internal state (Narrow) and content that depends on the environment (Wide).
  *   **Why:** We need Narrow content to explain behavior (Oscar and Twin-Oscar reach for the liquid similarly) and Wide content to explain truth/reference (only Oscar's liquid is water).
  *   **Status:** **Non-Negotiable.** Collapsing these eliminates either the explanation of behavior or the explanation of reference.

  **2. First-Person Authority (FPA) vs. Third-Person Ascription**
  *   **Requirement:** The theory must account for the intuition that I know what I am thinking (e.g., "I am doubting") without empirical investigation of my environment, while allowing third parties to ascribe content based on external facts.
  *   **Why:** If I need to test the environment to know if I am thinking about *water* or *twin-water*, introspection becomes empirical observation.
  *   **Status:** **Non-Negotiable Phenomenology.** (Though Externalists argue FPA is compatible with Externalism, they must explain *how*).

  **3. Sense vs. Reference (Mode of Presentation)**
  *   **Requirement:** The theory must distinguish *how* a thinker conceives of an object from *what* object they are conceiving.
  *   **Why:** Essential for handling empty concepts (Sense without Reference) and cognitive significance (Hesperus/Phosphorus).
  *   **Status:** **Non-Negotiable.** Pure causal theories struggle here; pure descriptivist theories struggle with Twin Earth.

  ---

  ### III. Logical Boundaries (The Constraints)

  **1. The Constraint of Truth-Evaluability**
  *   **Rule:** Propositional attitudes must be capable of being true or false.
  *   **Violation:** If empty concepts have no content, thoughts involving them cannot be false; they are nothing. This violates the logic of negation.

  **2. The Constraint of Causal Efficacy**
  *   **Rule:** Mental states must be capable of causing behavior.
  *   **Violation:** If content is entirely external (Wide), and the internal state is identical across twins, it becomes difficult to explain how the *content* (rather than just the syntax) drives the specific action.

  **3. The Constraint of Non-Omniscience**
  *   **Rule:** A thinker cannot know all truths about their environment simply by thinking.
  *   **Violation:** If FPA is absolute and Content is External, I can know facts about the world (e.g., that it contains H₂O) just by reflecting on my mind. (This is the **McKinsey Paradox**).

  ---

  ### IV. The Incompatibility Matrix (Where It Blows Up)

  You are correct to be suspicious. There are pairs of desiderata that appear **Jointly Unsatisfiable** under standard logical assumptions.

  | Pair | Tension | Why it breaks |
  | :--- | :--- | :--- |
  | **FPA + Strong Externalism** | **The McKinsey Paradox** | If (1) I know my thoughts by introspection alone (FPA), and (2) My thoughts are determined by external environment (Externalism), then (3) I can know facts about the external environment by introspection alone. This implies a priori knowledge of contingent facts. **One must go.** |
  | **Empty Concepts + Causal Theory** | **The Reference Failure** | If content is fixed by causal history, and there is no object, there is no history. Pure causal theories cannot generate content for 'Phlogiston' without ad-hoc modifications (e.g., "causal link to the *belief* in phlogiston"). |
  | **Psychological States + Wide Content** | **The Explanatory Irrelevance** | If 'Regret' is a wide state (dependent on external facts), then Twin-Oscar (who lacks the external facts) is not in the same state. But they behave identically. If content explains behavior, and behavior is identical, content should be narrow. If content is wide, it loses explanatory power over behavior. |

  **Verdict on your suspicion:** The tension between **First-Person Authority** and **Environmental Determination** is the strongest incompatibility. Most externalists resolve this by weakening FPA (you know your thought *under a mode of presentation*, but not its external extension) or by arguing that the environment is not "contingent" in the way required to generate the paradox. Most internalists resolve it by rejecting Environmental Determination for psychological states.

  ---

  ### V. Theory Scorecard

  Here is how the major contenders score against the spec.

  **1. Pure Causal-Historical (Putnam/Kripke/Burge)**
  *   **Water:** **Pass.** Perfectly explains Twin Earth divergence.
  *   **Regret/Psych:** **Fail/Strain.** Tends to make psychological states wide, threatening the explanation of behavior.
  *   **Empty Concepts:** **Fail.** Struggles to assign content without a referent. Requires auxiliary theories (e.g., descriptive fallback).
  *   **FPA:** **Fail.** Directly generates the McKinsey Paradox. Requires complex compatibilist maneuvers to save authority.
  *   **Summary:** Wins on reference, loses on introspection and empty terms.

  **2. Descriptivism (Fregean/Classical)**
  *   **Water:** **Fail.** Cannot explain why Oscar and Twin-Oscar differ if their descriptions ("clear, drinkable liquid") are identical.
  *   **Regret/Psych:** **Pass.** Handles psychological states well as they are defined by internal criteria.
  *   **Empty Concepts:** **Pass.** Excellent at handling empty terms via Sense without Reference.
  *   **FPA:** **Pass.** Content is internal, so introspection reveals content.
  *   **Summary:** Wins on introspection and empty terms, loses on Twin Earth natural kinds.

  **3. Two-Dimensional Semantics (Chalmers/Jackson)**
  *   **Water:** **Pass.** Distinguishes Primary Intension (epistemic/internal) from Secondary Intension (metaphysical/external). Twins share Primary, differ on Secondary.
  *   **Regret/Psych:** **Pass.** Can locate psychological states in the Primary Intension (Narrow).
  *   **Empty Concepts:** **Pass.** Primary Intension fixes content even if Secondary Intension is null.
  *   **FPA:** **Pass (Qualified).** You have authority over Primary Intension, not Secondary. Avoids McKinsey by limiting the scope of FPA.
  *   **Summary:** The most robust fit for the spec, but pays a high cost in complexity and commits to a specific modal metaphysics (epistemic possibilities vs. metaphysical possibilities) that is itself contested.

  ### Final Recommendation for Your Argument
  If you want to press your friend, focus on the **Empty Concept + Externalism** clash. It is easier to show that Externalism fails for 'Phlogiston' than for 'Water'. If they admit Externalism doesn't apply to empty terms, ask them for the *principled distinction* between 'Water' and 'Regret'. If they can't provide one without arbitrary stipulation, their externalism is incomplete. If they say Externalism *does* apply to empty terms, they must explain what fixes the content in the absence of a causal link.
