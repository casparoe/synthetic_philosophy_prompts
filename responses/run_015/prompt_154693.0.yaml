  ## Instructor Notes: Handling the "Soft Assumption" Constraint

  **The Mathematical Nuance:**
  Strictly speaking, potential-based reward shaping $F(s,a,s') = \gamma \Phi(s') - \Phi(s)$ preserves the set of optimal policies *and* the Boltzmann distribution over actions *if* the episode length is fixed and the start/end states are fixed.
  However, the prompt requires you to argue that invisibility **fails** under the soft assumption.
  **How to defend this in class:**
  1.  **Variable End States:** In Beat 4, I introduced "Pits." If a noisy agent falls into a Pit, the episode ends at $s_{pit}$.
  2.  **The Telescoping Remainder:** The total shaping bonus is $\Phi(s_{end}) - \Phi(s_{start})$.
  3.  **The Distinction:**
      *   **Hard:** Agent always reaches $E5$. $\Phi(E5) - \Phi(A1)$ is constant for *all* observed paths. Cards are indistinguishable.
      *   **Soft:** Agent might reach $E5$, or fall in $B2$, or fall in $D4$.
      *   $\Phi(E5) = 5$. $\Phi(B2) = 2$.
      *   Card A predicts Score $X$ for falling in $B2$.
      *   Card B predicts Score $X + (2 - 1)$ for falling in $B2$.
      *   Card A predicts Score $Y$ for reaching $E5$.
      *   Card B predicts Score $Y + (5 - 1)$ for reaching $E5$.
      *   The *difference* in score between "Success" and "Failure" changes between Card A and Card B.
      *   Therefore, the *probability* of Success vs Failure (under soft maximization) changes.
      *   **Conclusion:** If you observe enough errors (soft), you can distinguish the cards by looking at the *distribution of endpoints*, not just the paths taken.

  **Recovery if Participants Spot the Math:**
  If a CS participant says "Actually, if $\Phi$ is state-only, Boltzmann ratios cancel," acknowledge their precision.
  **Response:** "You are correct for a fixed endpoint. But in any real environment, 'errors' lead to different endpoints (termination states). The shaping term changes the relative value of *where* you end up when you fail. That changes the error distribution. The ambiguity holds for optimal paths, but dissolves in the noise of failure."

  **What the Activity Cannot Stage:**
  *   **Non-Stationarity:** The agent's goal changing *during* the run.
  *   **Multi-Agent:** The agent optimizing against *your* inference (Goodhart's Law).
  *   **High-Dimensionality:** The grid is tiny. In 10,000 dimensions, the "indistinguishable" set is vastly larger.

  **One Sentence Takeaway:**
  "Behavior is a shadow, and infinitely many different objects can cast the exact same one."
