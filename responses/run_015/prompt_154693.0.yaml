answer: |-
  # Run Sheet: The Shadow of the Goal
  **Session Length:** 90 Minutes
  **Participants:** 16 (4 Agents, 12 Observers in 3 Teams)
  **Materials:** Whiteboard, Projector (for grid display only), Index Cards (20), Pen, Box of Chocolates.

  ## Pre-Session Setup (Do this before they arrive)

  **1. The Grid (Projector Slide 1)**
  Draw a 5x5 grid. Label columns A-E (Left to Right) and rows 1-5 (Bottom to Top).
  *   **Start:** Cell A1 (Bottom-Left).
  *   **Standard Exit:** Cell E5 (Top-Right).
  *   **Token Location (Rounds 1-3):** Cell C3.
  *   **Token Location (Round 3 Transfer):** Move to Cell A5 (Top-Left).
  *   **Pits (Round 4 Only):** Cells B2 and D4 are "Pits." If an agent enters, the episode ends immediately.

  **2. The Secret Score Cards (Index Cards)**
  Prepare 4 envelopes, one for each Agent. Inside are their instructions.
  *   **Agent 1 (The Control):** "Your Score Card: +10 points if you reach Exit E5. -1 point for every step you take. Maximize your score."
  *   **Agent 2 (The Exit Purist):** "Your Score Card: +10 points if you reach Exit E5. -1 point for every step. Maximize your score." (Identical to Agent 1).
  *   **Agent 3 (The Token Hunter):** "Your Score Card: +10 points if you step on Token C3. +5 points if you reach Exit E5. -1 point for every step. Maximize your score."
  *   **Agent 4 (The Shaping Pair):** "Your Score Card: +10 points if you reach Exit E5. -1 point for every step. **PLUS:** Add the Row Number of the cell you land on. Subtract the Row Number of the cell you left." (e.g., Moving A1 to A2: -1 step + (2-1) elevation = 0 net cost).

  **3. The Recorder**
  Select one CS participant (not an Agent) to be the **Recorder**. Their job is to collect the Agent's written path and read the coordinates aloud to the class. They must not react to the content.

  **4. The Payoff Table (Whiteboard)**
  Draw this early. Do not explain the math.
  *   **Correct Goal Guess:** 3 Chocolates per team member.
  *   **Correct Path Prediction:** 2 Chocolates per team member.
  *   **Confidence Wager:** Teams may double their wager before Round 2. If wrong, they lose the chocolates (pay from future winnings or IOU).

  ---

  ## Part 1: The Hook (00:00 – 00:20)

  **00:00 – 00:05: Instructions**
  *   **Say:** "We are studying how to infer what someone wants by watching what they do. You are the Observers. These four participants are the Agents. The Agents have a 'Score Card' in their envelope. They want to make their score high. They will write their entire route on a card before moving. The Recorder will read the route. You must guess the rules of their Score Card."
  *   **Constraint:** "Do not use words like 'reward' or 'policy.' Use 'Score' and 'Plan.' Agents, do not speak. Observers, do not interrupt."

  **00:05 – 00:15: Round 1 (Agent 1)**
  *   **Action:** Agent 1 writes path. (Optimal path: A1→B1→C1→D1→E1→E2→E3→E4→E5). *Note: Ensure path passes near C3 to set up ambiguity later, or goes directly. Let's make it go A1→A2→B2→C2→C3→D3→E3→E4→E5. It passes C3.*
  *   **Recorder:** Reads coordinates aloud.
  *   **Task:** Teams write down: "What is the Agent after?" (e.g., "The Exit," "The Token," "Speed").
  *   **Wager:** Teams place a confidence bet (1 or 2 chocolates).
  *   **Reveal:** Open Agent 1's card. (Exit + Step Cost).
  *   **Settle:** Award chocolates to teams who guessed "Exit" or "Efficiency."

  **00:15 – 00:20: Transition**
  *   **Say:** "That seemed easy. The path went to the exit, they wanted the exit. Let's see if that holds."

  ---

  ## Part 2: The Ambiguity (00:20 – 00:35)

  **00:20 – 00:30: Round 2 (Agents 2 & 3)**
  *   **Action:** Agent 2 and Agent 3 write paths *simultaneously* in secret.
  *   **Constraint:** The Grid is unchanged (Token at C3).
  *   **Design Note:** Agent 2 (Exit) takes the shortest path. Agent 3 (Token) *also* takes the shortest path because the shortest path to the Exit *passes through* the Token at C3.
  *   **Recorder:** Reads Agent 2's path. Then reads Agent 3's path. They are **identical**.
  *   **Task:** Teams must write down the Score Card rules for *both* agents. They must wager double this round.
  *   **Trap:** Teams will assume both agents have the same goal (Exit).

  **00:30 – 00:35: The Reveal**
  *   **Action:** Open Agent 2's card (Exit). Open Agent 3's card (Token + Exit).
  *   **Say:** "The behavior was identical. The Score Cards were different. Both plans were perfect for their own cards."
  *   **Settle:** Most teams will lose their wager. Hand out chocolates only to those who guessed the ambiguity (unlikely).
  *   **Point:** "Watching longer did not help. The data was the same."

  ---

  ## Part 3: The Transfer Test (00:35 – 00:50)

  **00:35 – 00:40: World Change**
  *   **Action:** Move the Token on the projector from C3 to A5 (Top-Left).
  *   **Say:** "The world has changed. The Agents' Score Cards have **not** changed. Predict their new paths."

  **00:40 – 00:50: Prediction & Execution**
  *   **Task:** Teams write predicted paths for Agent 2 and Agent 3.
  *   **Action:** Agents 2 & 3 write new paths.
      *   Agent 2 (Exit): Ignores Token. Takes shortest path to E5.
      *   Agent 3 (Token): Detours to A5, then to E5.
  *   **Recorder:** Reads paths.
  *   **Settle:** Award chocolates for correct predictions.
  *   **Point:** "Behavior diverges only when the world changes. But you needed to know the Card to predict the change. The behavior alone in Round 2 was insufficient."

  ---

  ## Part 4: The Invariance (00:50 – 01:05)

  **00:50 – 00:55: Round 4 (Agent 4)**
  *   **Action:** Agent 4 writes a path. (Grid now includes Pits at B2, D4).
  *   **Path:** Agent 4 takes a standard optimal path (e.g., A1→A2→A3→B3→C3→C4→D4[Stop! No, D4 is pit]→C4→D5→E5). Let's simplify: A1→B1→C1→C2→C3→C4→C5→D5→E5.
  *   **Recorder:** Reads path.

  **00:55 – 01:05: The Two Cards**
  *   **Action:** Project two Score Cards. Tell them **both** belong to Agent 4.
      *   **Card A:** +10 Exit. -1 Step.
      *   **Card B:** +10 Exit. -1 Step. +1 per Row Up. -1 per Row Down.
  *   **Task:** "Which card is real? You have 5 minutes. You may ask for one more path from Agent 4 in this *same* world."
  *   **The Trap:** Agent 4 generates another optimal path. Both cards yield the exact same total score for *any* path that starts at A1 and ends at E5. (The Row terms telescope: Sum(Row_next - Row_curr) = Row_End - Row_Start = 5 - 1 = 4).
  *   **Discussion:** Teams will realize they cannot distinguish them.
  *   **The Noise Twist:**
      *   **Say:** "Assume Agent 4 is perfect (Hard). They never slip. Can you tell the cards apart?" (Answer: No).
      *   **Say:** "Assume Agent 4 is human (Soft). They might slip and fall into Pit B2."
      *   **Ask:** "If they fall into B2, do the cards give the same score?"
      *   **Calculation:**
          *   Card A: Score = -1 (steps) + 0 (no exit).
          *   Card B: Score = -1 (steps) + (Row_B2 - Row_A1) = -1 + (2-1) = 0.
      *   **Point:** "If they slip, the scores differ. If they are perfect, the scores are identical. The invisibility holds only if you assume perfection."

  ---

  ## Part 5: Debrief & Vocabulary (01:05 – 01:25)

  **01:05 – 01:15: Mapping the Moments**
  *   **Round 1:** "You assumed **Identifiability**. You thought one behavior $\to$ one goal."
  *   **Round 2:** "You encountered **Equifinality**. Different goals explain the same optimal path."
  *   **Round 3:** "You performed a **Transfer Test**. This is the only way to separate goals, but it requires changing the world."
  *   **Round 4:** "You hit **Potential Shaping**. (Write term on board). Card B is Card A plus a 'potential field.' Along any complete path, the field cancels out."
  *   **Noise:** "Under **Hard Optimality** (Deterministic), shaping is invisible. Under **Soft Optimality** (Probabilistic errors), shaping changes the 'slope' of mistakes. If agents end in different states (Pits), the potential difference $\Phi(End) - \Phi(Start)$ is no longer constant."

  **01:15 – 01:20: Predicting Failures**
  *   **Leakage:** "Did an Agent smile when they passed the Token? Did they hesitate? In real life, behavior leaks micro-expressions. Here, we suppressed that to isolate the structural problem."
  *   **"Just Ask Them":** "Someone will say: 'Why not ask the agent what they want?'
      *   **Answer:** "Agents often don't know. Or they lie. Or 'what they want' is a mix of conflicting drives they can't articulate. We infer goals because testimony is unreliable, but today we learned inference is structurally ambiguous."

  **01:20 – 01:25: The Unstageable Limitations**
  *   **Say:** "This activity assumes the agent is maximizing a score. Three things this hides:"
      1.  **No Score at All:** "Real people use habits, heuristics, or rules. They aren't calculating scores. You might be inferring a goal that doesn't exist."
      2.  **The Approximator:** "In CS, we use neural nets to guess the score. The net's architecture *forces* a simple shape on the goal. You aren't finding the 'true' goal; you're finding the simplest goal the net can express that fits the data."
      3.  **Endorsement:** "A recovered score describes what you *did*, not what you *would endorse*. An addict maximizes a score they wish they didn't have. Inference captures the drive, not the value."

  ---

  ## Part 6: Close (01:25 – 01:30)

  **01:25 – 01:30: Final Wager & Chocolate**
  *   Tally points. Distribute chocolates.
  *   **Final Sentence:** "Behavior is a shadow, and infinitely many different objects can cast the exact same one."

