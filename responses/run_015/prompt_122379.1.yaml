answer: |-
  To the Members of the Oversight Committee, as we prepare for Tuesday's session I feel compelled to circulate a preliminary position regarding the growing tension between our evaluation metrics and the external entities seeking to influence them. We are operating under the shadow of our own history, founded in 1952 to support interdisciplinary work that defied easy categorization, yet today our grant forms increasingly demand predictive measurability that would have been unintelligible to our founders. This drift is what I have come to call epistemic weathering, a slow erosion of purpose where the language of assessment shifts incrementally toward what is easily scored rather than what is deeply meaningful, without any formal vote ever ratifying the change. There is a faction within this committee that views the presence of fellows from large AI laboratories on our review panels not as a symptom of this weathering but as the cause, characterizing the situation as classic influence-seeking capture where external agents actively reshape our values to suit their proprietary ends. I want to engage seriously with this perspective because it is not merely cynical but morally necessary, for if we ignore the power dynamics at play we risk naivety that could be construed as complicity. The argument that these laboratories are engaging in agentic capture suggests that our metrics did not drift randomly but were pulled by gravity toward centers of capital and computation, and that banning these conflicts of interest is the only way to halt the corruption of our mission. This is a strong position because it identifies a specific mechanism of harm and offers a clear surgical solution, whereas talking about ambient rot can sound like abdicating responsibility for policing boundaries.

  However, treating this solely as a problem of capture misdiagnoses the mechanism of our decline and offers a solution that may leave the underlying disease untouched. Agentic capture assumes an adversary who intends to change us, while epistemic weathering assumes a vacuum where we have forgotten who we are, and conflating the two leads to policy that fights ghosts while the foundation continues to crumble. If we impose strict conflict-of-interest rules without repairing our criteria, we will simply find that our forms still demand predictive measurability, and we will merely fill the vacuum with different actors who know how to game the same broken metrics. The AI labs are not forcing us to value quantification over quality; they are merely reflecting back to us the values we have already adopted because they are the easiest to administer. To blame them exclusively is to outsource our moral agency to our enemies, implying that we are only virtuous when under attack rather than when we are self-governing. We must recognize that an institution can indeed correct its own weathering without first identifying a specific enemy to blame, because weathering is not an attack but a form of neglect, and repairing neglect requires internal renovation rather than external defense. If we focus on banning the labs, we validate the idea that our values are fragile things that break only when touched by bad actors, rather than robust principles that should withstand any scrutiny.

  Therefore, my recommendation is that we prioritize the restructuring of our evaluation criteria over the imposition of new conflict-of-interest rules, though the latter may follow as a secondary measure once the former is secure. We need to launch a six-month working group starting immediately after Tuesday's meeting to audit our current grant language and identify where predictive measurability has supplanted interdisciplinary potential as the primary scoring vector. By the end of the third quarter, we should have a draft of new evaluation rubrics that reintroduce qualitative assessment mechanisms resistant to algorithmic optimization, ensuring that we are funding work that matters rather than work that counts. This timeline allows us to present a concrete proposal at our fall convening, giving us the momentum to implement changes before the next funding cycle opens. This approach does not preclude managing conflicts of interest, but it insists that our criteria must be robust enough to withstand influence before we worry about who is sitting at the table. If our metrics are sound, the presence of industry fellows becomes less dangerous because the incentives no longer align with capture; if our metrics are rotten, even the most virtuous reviewers will be forced to select projects that fit the decay.

  I urge the committee to accept that we do not need a villain to fix our values, and that seeking one may distract us from the harder work of self-examination. The archives of this institution will eventually forget why we existed if we do not encode our purpose into the structures we use today, and no amount of policing visitors will preserve a building that is collapsing from within. We must assume responsibility for the drift because we are the only ones who can steer the ship back to its original coordinates, regardless of the wind or the currents. Let us go into Tuesday's meeting prepared to vote on the formation of this criteria working group, with a mandate to deliver a revised framework within six months. This is the only way to ensure that when future historians look at our records, they will see an institution that remembered itself rather than one that simply fought off invaders while slowly forgetting what it was protecting.
