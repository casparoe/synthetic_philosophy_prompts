answer: |-
  ### The Scenario: The Basin of Kael

  The Basin is a closed agrarian polity surrounded by impassable cliffs, growing a single staple grain on a fixed acreage of valley floor and hillsides. Theorist One (Elara) proposes the *Marginal Labor Theory*: as population grows, cultivation must expand to steeper slopes, requiring exponentially more labor per bushel; she predicts a caloric deficit of 15% by Year 50. Theorist Two (Boron) proposes the *Strain Theory*: population growth creates social friction that disrupts harvest, predicting the same 15% deficit by Year 50. The "offset" is the *Terrace Stock*: a finite, surveyable capital reserve of pre-built ancient stone terraces on the upper slopes that require negligible labor to plant compared to building new ones. At Year 50, Elara's prediction fails; the Basin is still planting the Terrace Stock, keeping labor costs low and yields high. The Stock is measurable (acreage is known) and exhaustible (once planted, they require maintenance like any other land). At Year 60, the Stock is fully utilized, labor costs spike as predicted, and the 15% deficit materializes. Boron claims the delay was merely "social resilience."

  ***

  ### The Walkthrough: Three Auditors, Two Theorists

  **1. The Mechanism-First Auditor (The "Right but Early" Advocate)**
  *   **Verdict on Elara:** **Vindicated.** The specific causal mechanism (labor cost per marginal bushel) was active throughout the interval. The failure at Year 50 was not a refutation of the mechanism but a confirmation of a specifiable buffer (the Terrace Stock) that the theory allows for as capital depreciation. The outcome arrived exactly when the buffer exhausted.
  *   **Verdict on Boron:** **Rejected.** The mechanism ("social friction") is non-quantitative and non-exhaustible. The delay cannot be modeled as a finite buffer; it requires an ad-hoc adjustment to the "resilience" variable that cannot be measured independently of the outcome.

  **2. The Strict Falsificationist (Popperian)**
  *   **Verdict on Elara:** **Falsified.** The theory stipulated a dated, quantitative claim (15% deficit by Year 50). The event did not occur by Year 50. The introduction of the Terrace Stock explanation after the failure date is an immunizing stratagem, not a test. The theory is dead.
  *   **Verdict on Boron:** **Falsified.** Identical reasoning. The date passed without the event. The theory is dead. "Right but early" is semantically indistinguishable from "wrong" if the date is part of the falsification condition.

  **3. The Research-Programme Auditor (Lakatosian)**
  *   **Verdict on Elara:** **Progressive Shift.** While the core prediction failed Year 50, the adjustment (incorporating the Terrace Stock variable) allowed for a *novel prediction*: at Year 50, Elara could calculate the remaining acreage and predict the *exact year* of the crash (Year 60) and the *mode* of failure (labor spike vs. Boron's generic friction). This generated new knowledge during the "anomaly" period.
  *   **Verdict on Boron:** **Degenerating Shift.** To explain the delay, Boron must add ad-hoc clauses ("resilience was higher than expected") that explain the past but predict nothing new about the future interval. The programme absorbs the anomaly without increasing heuristic power.

  ***

  ### The Honest Part

  **The Engine of the Case:**
  The single feature doing all the work is the **Measurable Exhaustibility of the Offset**. The Terrace Stock must be something that can be counted *before* it runs out. If the offset were "favorable weather" or "temporary worker morale," the Mechanism Auditor collapses into the Falsificationist. Without a measurable stock, there is no way to distinguish between "the mechanism was paused" and "the mechanism was wrong." The "Right but Early" claim relies entirely on the ability to point to a physical quantity depleting in real-time that bridges the gap between the failed date and the realized outcome.

  **The Collapse:**
  If you remove the measurability of the offset (e.g., if the terraces were mythical or their yield contribution unquantifiable), the Mechanism Auditor has no ground to stand on. They cannot verify that the mechanism was "waiting" to operate. In that scenario, Elara looks like she just got lucky, and the verdict defaults to the Falsificationist's "Wrong." The "Right but Early" status is not a property of the truth; it is a property of the *accounting*.

  **The Attack:**
  A defender of Strict Falsification (the view that comes out "worst" here, as it kills the useful theory) would attack the case as rigged by **Post-Hoc Belt Adjustment**. They would argue that Elara's theory *at Year 0* did not specify the Terrace Stock as a variable. By introducing it at Year 50 to save the theory, she has changed the rules of the game. They would argue that allowing "Right but Early" grants theorists infinite lives; any failed prediction can be saved by inventing a "hidden buffer" that just happened to run out later. They would demand the Terrace Stock be part of the *initial* prediction specification, not the rescue.

  ***

  ### The Audit Horizon

  **Intergenerational (Original Design):**
  In the scenario above, the audit happens at Year 70. Elara and Boron are dead. The verdict is a matter of historical record. "Right but Early" functions as a **eulogy**. It grants standing to Elara's successors to claim her work as foundational. The claim is about *lineage*: "We are the heirs of the true theory." It is stable because the theorist cannot lobby for the verdict.

  **Lifetime (Shrunk Horizon):**
  If we shrink the window so the audit happens at Year 55 (Theorists are alive, tenure decisions are pending):
  1.  **Standing becomes Political:** Elara cannot simply *be* "Right but Early"; she must *persuade* the department to grant her the extension. The verdict is no longer generated by the rules alone but by the **authority of the auditor**.
  2.  **The "Early" Claim becomes a Shield:** Elara will argue for the Mechanism Auditor's rules (focus on the process). Boron will argue for the Falsificationist's rules (focus on the date).
  3.  **Thesis Confirmation:** This supports your thesis that "Right but Early" is not a claim about the world, but a claim about **who has the standing to declare a theory dead**. In the Intergenerational view, the dead cannot defend themselves, so the mechanism speaks. In the Lifetime view, "Right but Early" is a rhetorical move to delay falsification long enough to secure professional survival. If the department chair is a Falsificationist, Elara is fired at Year 51, and the "truth" of her theory at Year 60 becomes irrelevant. The verdict is determined by the power dynamic, not the data.
