      2.  Breakdown: Part (a) 5/5. Part (b) 3/5.
      3.  Feedback: Praise the "double heart" explanation. Correct the "permissible" error regarding the officious lie.

      *Wait, let me double check the "false signification" phrasing.*
      Augustine: *enuntiatio cum voluntate fallendi*. Often translated as "false signification with the will to deceive." But he clarifies it's false signification *of the mind*. The student says "false signification with the intention to deceive." This is close enough for undergrad.
      Student: "you have one thing in mind but say another." This is the *duplex cor*. Very good.
      Okay, Part (a) is definitely full marks.

      Part (b) is where the points come off.
      Verdict: "Should not lie." (Correct).
      Reasoning: "Intrinsically sinful." (Correct).
