      *   **Constraint:** No bibliography/citations.

  2.  **Deconstruct the Philosophical Concept:**
      *   *Standard View:* Duty = Required. Supererogation = Optional but Good. Intrinsic to the act.
      *   *Target View:* Supererogation = Relative to a baseline of what peers *actually* do. If everyone does it, it becomes duty (or loses supererogatory status). If no one does it, it's supererogatory. The baseline is often opaque.
      *   *Key Tension:* An act isn't supererogatory *in itself*; it's supererogatory *relative to expectations*.

  3.  **Drafting the Game Mechanics:**
      *   *Name:* "The Baseline Protocol" or "The Contribution Threshold." Let's go with "The Threshold Protocol."
      *   *Setup:* 12 students. Need groups to make the "peer baseline" feel distinct but connected. Maybe 3 groups of 4? Or one large cohort? One large cohort makes the "social baseline" clearer. Let's keep them as one cohort but give them hidden individual constraints.
