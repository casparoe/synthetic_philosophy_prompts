          *   *Stakes:* Points awarded for matching the "True Status" (defined by the card).
      *   **Phase 3:** "Norm Shift." Students vote or commit to actions that change the Compliance % for a hypothetical next round. They see how their commitment changes the D/S status of the act for *others*.

      *   *Refining the "Stakes":* To make it feel real, let's have a "Reputation Pool."
      *   *Roles:* Everyone is an "Agent."
      *   *Materials:* Scenario Cards, Status Cards (Hidden), Voting Tokens.

  4.  **Developing the Scenarios:**
      *   Need acts that feel ambiguous.
