      *   *Phase 1 (Individual):* Present scenarios. Students label them Duty (D) or Supererogatory (S).
      *   *Phase 2 (Reveal):* Reveal the "Group Average Cost" of performing these acts. If the average cost is low, the act is Duty. If high, it's Supererogatory. Wait, the prompt says "comparison class of peer behavior." So, it's not about cost, it's about *frequency*. If 90% of people do it, it's Duty. If 10% do it, it's Supererogatory.
