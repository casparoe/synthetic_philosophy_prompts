      *   **Phase 3:** "The Campaign." Students get 3 tokens each. They can place tokens on acts to simulate "increasing compliance." If total tokens on an act push the simulated rate over 75%, the status flips.
      *   **The Kicker:** If status flips from S to D, everyone who *wasn't* planning to do it now risks a penalty (simulated). If it flips D to S, they lose the "moral credit" bonus.
