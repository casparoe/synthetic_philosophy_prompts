      *   3. Visiting a sick colleague weekly.
      *   4. Whistleblowing on minor fraud.
      *   5. Organ donation pledge.

  5.  **Developing the Rules (The "Engine"):**
      *   **The Normative Rule:** An act is *Obligatory* if the Compliance Rate is $\ge$ 75%. It is *Supererogatory* if < 75%.
