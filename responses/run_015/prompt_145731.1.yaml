  6.  **Addressing the "Hidden/Relational" Aspect:**
      *   In Phase 1, they think the status is intrinsic.
      *   In Phase 2, they see the status is a function of the number on the card.
      *   In Phase 3, they realize *they* hold the tokens that change the number.
      *   *Crucial Detail:* The "Compliance Rate" on the cards in Phase 2 should be close to the threshold (e.g., some at 70%, some at 80%) so small shifts matter.

