answer: |-
  # Workshop Design: The Compliance Threshold

  **Title:** The Compliance Threshold: A Simulation of Relational Supererogation
  **Time:** 90 Minutes
  **Participants:** 12 Advanced Undergraduates
  **Materials:**
  *   5 Scenario Cards (labeled A–E).
  *   5 Social Fact Cards (matching A–E, with hidden percentages).
  *   36 Influence Tokens (3 per student).
  *   12 Score Sheets.
  *   1 Public Leaderboard (whiteboard).
  *   Small prize (e.g., high-quality chocolate) for the top 3 scorers.

  ## Core Concept
  The simulation operationalizes the claim that the deontic status of an act (Duty vs. Supererogatory) is not intrinsic but determined by a **Compliance Threshold**.
  *   **The Rule:** If the Compliance Rate of a peer group is **$\ge$ 75%**, the act is classified as **Duty (Obligatory)**. If **< 75%**, it is **Supererogatory (Optional)**.
  *   **The Instability:** Participants can spend tokens to alter the Compliance Rate, thereby mechanically shifting the moral status of the act for everyone.

  ---

  ## Phase 1: Intuitive Classification (15 Minutes)

  **Setup:**
  Distribute one Score Sheet and a set of 5 Scenario Cards to each student. The Social Fact Cards are kept face-down by the facilitator.

  **The Scenarios (Examples):**
  *   **A:** Donating 5% of annual income to effective charity.
  *   **B:** Intervening verbally when witnessing public harassment.
  *   **C:** Visiting a sick colleague in the hospital once a week for a month.
  *   **D:** Reporting minor expense fraud committed by a supervisor.
  *   **E:** Registering as an organ donor.

  **Instructions:**
  1.  Read each Scenario Card.
  2.  On your Score Sheet, mark each act as either **Duty (D)** or **Supererogatory (S)** based solely on your moral intuition.
  3.  Do not discuss with peers.
  4.  **Stakes:** This round is unscored. It establishes your "Baseline Intuition."

  **Facilitator Note:** Collect the sheets briefly to emphasize that this data is "locked in." Do not reveal any results yet.

  ---

  ## Phase 2: The Hidden Baseline Revealed (25 Minutes)

  **Setup:**
  Distribute the 5 Social Fact Cards face-up. Each card displays the Scenario and a **Compliance Rate** (derived from a fictional "Reference Population").
  *   *Crucial Design:* Set the rates close to the 75% threshold to create ambiguity.
      *   Card A: 12%
      *   Card B: 82%
      *   Card C: 45%
      *   Card D: 78%
      *   Card E: 74%

  **Instructions:**
  1.  **The Rule:** Remind students of the Threshold Rule ($\ge$ 75% = Duty; < 75% = Supererogatory).
  2.  **Reclassification:** Students must update their Score Sheets. If the Card says 82%, the act is now **Duty**, regardless of their Phase 1 intuition.
  3.  **Scoring:**
      *   +10 Points for every classification that matches the Rule.
      *   -5 Points for every classification that contradicts the Rule.
  4.  **Public Leaderboard:** Students announce their total scores. Record them on the whiteboard.

  **The Friction:**
  Students will likely protest that Card E (74%) feels like a Duty, or Card B (82%) feels like Supererogation. Insist that for the purpose of the game, the **Social Fact determines the Status**.
  *   *Observation Point:* Watch for students who refuse to update their sheets. This resistance is data for the debrief.

  ---

  ## Phase 3: Norm Engineering (30 Minutes)

  **Setup:**
  Distribute 3 Influence Tokens to each student. Explain that tokens represent "Social Capital" used to shift norms (e.g., through advocacy, policy, or peer pressure).

  **Instructions:**
  1.  **The Market:** Students may place tokens on any Social Fact Card.
  2.  **The Shift:** Each token placed on a card **adds 5%** to that card's Compliance Rate.
  3.  **The Incentive:**
      *   If you shift an act from Supererogatory to Duty, you receive a **"Norm Setter" Bonus (+15 Points)**.
      *   **However:** Once an act becomes Duty (crosses 75%), **every** player loses 10 Points if they marked "Will Not Perform" on a hidden commitment slip (distributed now).
  4.  **The Game:**
      *   Students have 10 minutes to trade, bargain, and place tokens.
      *   They must anticipate how their token placement changes the status for *everyone*.
      *   Example: If Card E is at 74%, placing just *one* token makes it 79% (Duty). Now everyone is obligated to do it or lose points.
  5.  **Final Tally:** Recalculate scores based on the new percentages and commitment slips. Announce the Top 3 winners.

  **The Friction:**
  Students will realize that by making an act "Duty," they increase the risk of penalty for the group (including themselves) if compliance isn't guaranteed. They may try to keep high-value acts as Supererogatory to claim credit without obligation, or force them to Duty to punish free-riders.

  ---

  ## Debrief Guide (20 Minutes)

  The debrief is where the philosophical work happens. Do not lecture immediately; draw the insights out of their frustration during the game.

  ### 1. Mapping Phases to Concepts
  *   **Phase 1 (Intuition):** Represents the **Intrinsic View**. Students treated the moral status as a property of the act itself (e.g., "Donating is *inherently* good/optional").
  *   **Phase 2 (Revelation):** Represents **Descriptive Relativity**. The status flipped not because the act changed, but because the *comparison class* (the percentage) became visible. This demonstrates that supererogation is partially a function of social facts.
  *   **Phase 3 (Engineering):** Represents **Normative Instability**. By spending tokens, students physically moved the boundary. They experienced that the "line" between duty and supererogation is a resource that can be manipulated.

  ### 2. Predicting Failures & Resistance
  Be prepared for these specific reactions and use them as teaching moments:
  *   **The "Is/Ought" Objection:** *"Just because 82% of people intervene in harassment doesn't make it a duty! That's an appeal to popularity."*
      *   *Response:* Acknowledge this is the core tension. The game forces a **constitutive rule** (Status = Function of Frequency). In real morality, we resist this. Ask: *Why* do we resist? Is it because we think duties should be stable? Or because we don't trust the baseline?
  *   **The "Irrelevance" Strategy:** Some students may ignore the percentages in Phase 2 and stick to Phase 1 intuition, accepting the point penalty.
      *   *Response:* Highlight this as **Moral Stubbornness**. It shows that for many agents, the internal conviction outweighs the social baseline. This limits the theory: the baseline influences status, but agent conscience influences *acceptance* of that status.
  *   **The "Gaming" Problem:** In Phase 3, students might collude to keep difficult acts as Supererogatory to avoid the "Duty Penalty."
      *   *Response:* This reveals the **Strategic Value of Vagueness**. If supererogation is valuable prestige, agents have an incentive to prevent acts from becoming normalized duties. This explains why moral progress (making new duties) is often socially contested.

  ### 3. Limits of the Simulation (Crucial Discussion)
  Explicitly state what the game *cannot* do. This prevents students from conflating the model with the full moral reality.

  *   **Transparency vs. Opacity:** In the game, the percentages were visible on cards. In reality, the "social baseline" is **hidden**. We never truly know what percentage of peers donate or intervene.
      *   *Discussion:* How does uncertainty affect moral judgment? Do we assume the baseline is lower than it is to preserve our self-image as "above average"?
  *   **Descriptive vs. Normative Authority:** The game mechanically enforced the rule (75% = Duty). It did not justify *why* that rule is morally binding.
      *   *Discussion:* The simulation shows the *mechanism* of the shift, but not the *authority*. Why *should* my duty depend on what you do? If everyone else is immoral, does my duty vanish? The game says "Yes" (if compliance drops below 75%, it becomes Supererogatory). Real morality often says "No."
      *   *Takeaway:* The view being explored suggests that supererogation is a **social coordinate**, not a moral absolute. The game reproduces the coordinate system, but you must supply the argument for why we should care about coordinates.

  ### 4. Closing Question
  End with this prompt for their final reflection paper or discussion:
  *"In Phase 3, you had the power to turn a Supererogatory act into a Duty. Did you feel you had the **right** to do that? If supererogation is relational, does 'Norm Engineering' count as moral leadership or moral coercion?"*

  ---

  ## Facilitator Checklist
  *   [ ] Ensure the 75% threshold is written visibly on the board.
  *   [ ] Pre-calculate the Social Fact percentages to ensure at least two cards are within 5% of the threshold (to make Phase 3 impactful).
  *   [ ] Monitor Phase 3 for collusion; allow it, as it demonstrates the social nature of the norm.
  *   [ ] Keep strict time. The philosophical value lies in the rush to reclassify under pressure.
  *   [ ] Do not resolve the "Is/Ought" tension yourself; leave it as the primary takeaway problem.
