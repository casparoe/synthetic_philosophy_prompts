          *   *Gaming:* Trying to keep things Supererogatory to get bonus points without obligation.
          *   *Irrelevance:* Ignoring the cards and sticking to Phase 1 intuition.
      *   **Limits:** The simulation makes the baseline *descriptive* (what people do). It cannot fully capture the *normative authority* (why what people do should dictate duty). That needs discussion. Also, the simulation makes the baseline transparent in Phase 2, whereas real life it's hidden.

  8.  **Review against Constraints:**
      *   90 minutes? Yes.
      *   12 students? Yes.
      *   No tech? Yes (cards, tokens, paper).
      *   Three phases? Yes.
      *   Stakes? Yes (points -> prize/ranking).
      *   Debrief included? Yes.
      *   No citations? Yes.

