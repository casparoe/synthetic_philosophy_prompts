      *   *Rule:* Correctly identifying the status (based on the %) earns points. Failing a Duty (if you identify it as Duty but say you won't do it) loses points. Doing Supererogation gains points.
      *   *Actually, keep it simpler:* The goal is to correctly identify the *Status*. Points for matching the Rule.
      *   *Phase 3:* They can change the Status. Why would they? Because some Statuses are more valuable? No, the point is to show the *instability*.
