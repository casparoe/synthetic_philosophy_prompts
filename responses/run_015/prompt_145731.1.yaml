      *   *Better:* Phase 3 is a "Policy Round." They vote on a campaign to encourage an act. If the campaign succeeds (simulated), the baseline shifts. They must then re-evaluate the moral status.
      *   *Let's simplify for 90 mins:*
          *   Phase 1: Intuition (5 mins).
          *   Phase 2: Revelation (20 mins). Cards show % compliance. Rule: >75% = Duty. Calculate scores.
          *   Phase 3: Manipulation (30 mins). Students have "Influence Tokens." They can spend tokens to raise the % on specific cards. If they cross the threshold, the status flips. Scoring updates.
          *   Debrief (35 mins).

      *   *Wait, one nuance:* The prompt wants them to feel that the status depends on a *hidden* comparison class.
      *   *Adjustment:* In Phase 1, they don't know the %. In Phase 2, they learn the %. In Phase 3, they change the %.
