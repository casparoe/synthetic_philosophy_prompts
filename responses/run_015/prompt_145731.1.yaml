  1.  **Analyze the Request:**
      *   **Target Audience:** 12 advanced undergraduates in moral philosophy.
      *   **Prior Knowledge:** Understand duty/supererogation distinction but view supererogation as intrinsic/agent-relative ("very good but optional").
      *   **Goal:** Make them feel the *instability* of the boundary based on a *social baseline* (comparison class of peer behavior) that is distributed, hidden, and shifting.
      *   **Format:** 90-minute workshop. Structured simulation/deliberation game.
      *   **Mechanics:**
          *   Three phases (Individual Classification -> Reveal Hidden Baseline -> Alter Group Behavior/Reclassify).
          *   Explicit rules, roles, hidden info cards.
          *   Small real stakes (points/reward/prestige).
