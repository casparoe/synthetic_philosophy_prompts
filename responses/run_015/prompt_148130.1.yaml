  Maya's verdict: **Not Rational.**

  Here are the two rules that fit her track record, how they apply to the mushroom case, and the hypothetical case that exposes the split between them.

  ### Rule 1: The Private-Signal Suppression Cascade
  **Definition:** A herd is "rational" if the individuals possess relevant private information or signals (even negative ones like risk assessments) but override them based on the inferred information in the public actions of others. The key is the *existence* and *processing* of a private signal, not whether it was acted upon.
  *   **Fits Track Record:** Explains **Black Monday** (traders had private liquidity needs but ignored them) and **Healthcare Workers** (had private clinical impressions). Explains **Academics/Energy Drink** as "Not Rational" because no private signal was generated (no evaluation/checks).
  *   **Prediction on Mushrooms:** **Rational.** The foragers have a private signal ("privately worries it might destroy spores") which they are Bayesian-updating against the public signal (others using it). Structurally, this is identical to Black Monday.

  ### Rule 2: The Epistemic Community Validation Rule
  **Definition:** A herd is "rational" only if the actors belong to a community with shared methods for empirical verification, and the herd behavior reflects either aggregated verification or hard constraints. If the community lacks the capacity to verify (amateurs) or fails to use their capacity (experts not evaluating), it is "not rational."
  *   **Fits Track Record:** Explains **Healthcare** (experts with methods) and **Black Monday** (professionals with market constraints). Explains **Academics** as "Not Rational" because they failed to use their verification methods. Explains **Ice Bucket/Energy Drink** as "Not Rational" due to lack of expert methods.
  *   **Prediction on Mushrooms:** **Not Rational.** The foragers are "amateurs" lacking shared scientific methods to validate the reagent, and they are not testing it themselves ("figures the others tested it"). This parallels the Academics case (experts who didn't evaluate) but with even less epistemic grounding.

  ### The Split Case
  The exact hypothetical case that would split these two rules is:

  **A group of amateur astronomers all point their telescopes at a specific coordinate because a forum admin said there's a comet, even though each privately checked their own star charts and saw nothing there.**

  *   **Rule 1 (Private-Signal)** calls this **Rational**: They possess a private signal (their own charts say empty) but override it based on the public action (others looking), which is a valid informational cascade mechanism.
  *   **Rule 2 (Epistemic Community)** calls this **Not Rational**: They are amateurs without shared verification protocols, and they are abandoning their own data for authority without a method to resolve the conflict.

  Maya follows **Rule 2**. She penalizes the Academics for not evaluating despite having the capacity; she will penalize the Foragers for not evaluating despite having the opportunity, regardless of their private worry.
