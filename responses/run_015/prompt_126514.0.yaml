          *   *Closure Defenders:* Closure is essential to the *concept* of knowledge. Denying it leads to "abominable conjunctions" (I know I have hands, but I don't know I'm not a handless BIV). They often bite the bullet on skepticism or move to Contextualism/Relevant Alternatives.

