  # Joint Statement on Epistemic Peer Disagreement in Conceptual Analysis

  **Signed:**  
  [Name], Proponent of Conciliationism  
  [Name], Proponent of Steadfastness  

  **Date:** October 26, 2023  

  **Context:** Following a good-faith adversarial collaboration regarding the epistemology of disagreement, specifically focused on disputes over conceptual analysis (e.g., knowledge, causation, moral responsibility) among equally credentialed philosophers.

  ### Part I: Agreed Claims

  1.  **Nature of Peer Disagreement:** We agree that epistemic peer disagreement occurs when two agents, who recognize each other as equals regarding general intelligence, background evidence, and intellectual virtue, adopt conflicting doxastic attitudes toward the same proposition.
  2.  **Existence of Persistent Expert Disagreement:** We agree that philosophy exhibits widespread, persistent disagreement on core conceptual analyses among practitioners with equivalent training and access to arguments, without clear convergence over time comparable to the natural sciences.
  3.  **Conditions for Epistemic Peerhood:** We agree that epistemic peerhood is determined by an assessment of relevant competencies (logic, evidence gathering, honesty) prior to the evaluation of the specific reasoning under dispute, though we disagree on whether this assessment must remain fixed after the disagreement is revealed.
  4.  **Logical Structure of the Independence Principle:** We agree that the Independence Principle logically requires that, when evaluating a peer's contrary claim, one should not rely solely on the reasoning that is itself the subject of the dispute. We disagree, however, on the scope of this restriction and whether first-person access to one's own reasoning counts as "independent" evidence.

  ### Part II: Areas of Disagreement

  | Topic | Conciliationist Commitment | Steadfastist Commitment |
  | :--- | :--- | :--- |
  | **(a) Normative Response to Peer Disagreement** | Discovering peer disagreement constitutes a significant epistemic defeater that rationally requires substantial confidence revision toward the peer's view, often necessitating suspension of judgment. | Discovering peer disagreement is a relevant data point, but does not rationally require confidence revision if one's own reasoning remains internally coherent and apparently sound upon reflection. |
  | **(b) Peerhood and Meta-Cognitive Confidence** | True peerhood requires symmetric meta-cognitive confidence about reasoning reliability *ex post*; maintaining asymmetric confidence after discovering disagreement implies one is no longer treating the other as a peer. | Peerhood is an *ex ante* condition; *ex post*, first-person access to the quality of one's own reasoning justifies asymmetric confidence in one's own reliability relative to the peer's. |
  | **(c) Rational Steadfastness vs. Irrational Dogmatism** | The distinction is precarious; steadfastness in the face of peer disagreement often functions as rationalized dogmatism because it illicitly privileges one's own intuition without independent verification. | The distinction is robust; steadfastness is rational adherence to apparent truth based on available reasons, whereas dogmatism is the refusal to engage with counter-arguments or evidence. |

  ### Part III: Cruxes for Future Inquiry

  We identify the following sub-questions as cruxes. Resolving them empirically or theoretically would significantly move at least one side toward the other's position.

  **Crux (i): Privileged Access to Reasoning Reliability**  
  *Question:* Does first-person access to one's own reasoning process provide privileged evidence about its reliability relative to a peer's?

  *   **Agreed Relevant Evidence:** Comparative accuracy rates in controlled logical tasks where agents self-assess their reasoning quality versus third-party assessments of that same reasoning (e.g., studies on the "illusion of explanatory depth" vs. cases of immediate logical insight).
  *   **Conciliationist Prediction:** The evidence will show that first-person access provides no reliability advantage; self-assessments of reasoning quality will correlate poorly with actual correctness compared to third-party assessments, indicating that "seeing" one's own reasoning is prone to bias.
  *   **Steadfastist Prediction:** The evidence will show that first-person access provides unique justificatory weight; agents will demonstrate higher accuracy in identifying errors in their own reasoning when given time for reflection compared to external observers, indicating direct apprehension of rational connections.

  **Crux (ii): Explanation of Philosophical Stalemates**  
  *Question:* Are long-standing philosophical stalemates better explained by rational steadfastness or by mutual overconfidence?

  *   **Agreed Relevant Evidence:** Historical track records of specific philosophical subfields (e.g., the evolution of responses to Gettier cases over 50 years) measuring the rate of consensus formation versus the rate of new counter-example generation.
  *   **Conciliationist Prediction:** The evidence will show low convergence rates despite high argumentative output, indicating that steadfastness perpetuates systemic overconfidence and prevents the correction of shared errors.
  *   **Steadfastist Prediction:** The evidence will show nuanced refinement of concepts over time without full consensus, indicating that stalemates reflect the complexity of the subject matter where multiple rational equilibria are possible without error.
