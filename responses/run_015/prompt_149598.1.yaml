      *   **Topic:** Illusionism about phenomenal consciousness, formulated as a *metasemantic* claim (phenomenal concepts fail to refer) rather than a metaphysical claim (qualia don't exist).
      *   **Key Arguments:** Dilemma (causal efficacy vs. idleness), Depth Problem (illusion of indubitability via metacognitive bias), No Clinical Consequences (replace consciousness questions with capacity questions).
