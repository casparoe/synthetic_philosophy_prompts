  5.  **Identifying the Weakest Step:**
      *   The "Depth Problem" / Metacognitive Bias. Explaining *why* the illusion is indubitable is hard. If the mechanism is just "confidence weighting," why does it feel *ontologically* unique? This is a common weak point in illusionism (Frankish's work often gets hit here).

  6.  **Identifying the "Hope Nobody Asks":**
