  **Revised Calculation for $P(P)$:**
  *   $P(\text{Refuted})$ is driven mainly by Cheap-Phi failure + Estimability.
      *   $0.85 (\text{Result}) \times 0.60 (\text{Absorption Fails}) \times 0.70 (\text{Estimability allows test}) \approx 0.35$.
