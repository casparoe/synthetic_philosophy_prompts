      *   *Derivation:* Case 5 (Prion) and Case 8 (Digital) are excluded. Case 6 (Synthetic) is included.
      *   *Nuance:* Prions have heredity (conformational) and Digital organisms have heredity (code), but both lack *nucleic acid sequence-based storage*. Case 6 explicitly validated that a *synthetic* genome counts, reinforcing that the *medium* (NA) matters more than the *origin* (natural vs. printed).
      *   *Status:* **Active, but brittle.** Case 5's reasoning ("No nucleic acid, no metabolism") was conjunctive. AC-30 *has* metabolism. This rule is the one most likely to be challenged by AC-30.

  *   **Rule C: The Material Continuity Clause (The "Digital" Rule).**
      *   *Derivation:* Case 8 (Digital) excluded for "Not a chemical system."
      *   *Status:* **Active.** AC-30 passes this easily.

  **Where they come apart on AC-30:**
  AC-30 passes Rule C (Chemical). It passes the "Metabolism" half of Rule B (unlike Prions). It *fails* the "Sequence-Based Heredity" half of Rule B (No NA). It sits on the knife-edge of Rule A: it builds 27/30 catalysts (Autonomous) but requires 3 pre-formed (Dependent).

  ### 2. The Verdict and The Winning Rule
  **Verdict:** **NOT A LIVING ORGANISM.**

  **The Rule to Cite:** **The Autonomy of Functional Machinery (Rule A), reinforced by the Sequence-Based Heredity Constraint (Rule B).**

  **Reasoning:**
  While Marsden's "essential amino acid" framing is clever, it is categorially incorrect under your precedents. Amino acids are *substrates*; they are consumed and incorporated into the structure. The three missing components in AC-30 are *catalysts*; they are *tools* that persist and enable the reaction without being consumed.
  *   **Precedent Match:** This aligns AC-30 with **Case 4 (Virus)** and **Case 7 (Cell-Free)**. A virus is not living because it cannot replicate without a host's polymerases. AC-30 cannot replicate without the lab's supply of the three catalysts.
  *   **Risk Logic:** For IBC purposes, "Life" is a proxy for "Uncontrolled Propagation." If AC-30 goes down the drain, it will not propagate unless those three specific catalysts are present in the sewer. By ruling it "Not Living," you are not saying it is safe; you are saying its replication is *externally constrained* by a dependency we control, just like a viral vector.
  *   **Why Rule B matters:** If you ignore the "No NA" precedent from Case 5, you open the door to regulating complex micelles or crystalline growth systems as "life." The committee has historically required a genetic polymer (NA) to count as a valid information storage system for containment purposes (Case 5 vs. Case 6). AC-30's compositional heredity is too noisy and too chemically proximate to standard precipitation reactions to cross that bright line.

  ### 3. The Closest Analog: Case 7 (Cell-Free System)
  You are flip-flopping between 6 and 7. **Case 7 is the correct analog.**

  *   **Why not Case 6?** Case 6 (Synthetic Cell) was ruled living because it "feeds itself and divides" *from a genome*. The committee explicitly noted the genome was the engine. AC-30 has no genome.
  *   **Why Case 7?** Look at the reason given for Case 7: *"It never makes another one of itself, and we have to keep reconstituting the enzymes for it."*
      *   AC-30 *does* divide, which makes it look like Case 6.
      *   *However*, the limiting factor for Case 7 was the **external supply of functional enzymes**. The limiting factor for AC-30 is the **external supply of functional catalysts**.
      *   In practice, AC-30 is a "leaky" Case 7. It makes some of its own enzymes (the 27 peptides), but because it cannot make the full set (the 3 catalysts), it requires the same "reconstitution" input as the cell-free system. The division is a physical shear event driven by growth, not a genetically encoded fission process.

  ### 4. The Commitment (What to read at the meeting)
  If the precedents underdetermine the case (and they do, slightly), you are making a policy choice. Here is how to state the commitment clearly:

  **If we vote YES (It is Living):**
  > "We are committing this committee to a **Process-Based Definition of Life**. We are stating that metabolic autonomy and compositional heredity are sufficient for containment classification, regardless of the presence of nucleic acids.
  > *Future Consequence:* We will be obligated to treat any self-sustaining chemical network (e.g., advanced origin-of-life models, complex lipid-peptide coacervates) as a biohazard requiring validated kill steps, even if they lack DNA/RNA. We are decoupling 'Life' from the Central Dogma."

  **If we vote NO (It is Not Living):**
  > "We are committing this committee to a **Substrate-and-Autonomy Definition**. We are stating that for regulatory purposes, 'Life' requires both nucleic acid-based information storage *and* the autonomous capacity to encode its own replication machinery.
  > *Future Consequence:* We maintain the Central Dogma as a regulatory bright line. Non-NA systems, even if metabolically active, are treated as chemical hazards rather than biological agents. This limits our regulatory scope but provides a clear boundary for future synthetic biology constructs."

  **Recommendation:** Read the **NO** commitment. It preserves the committee's ability to regulate AC-30 via *chemical hygiene* protocols (which are sufficient for peptides) without triggering the much more burdensome *biological containment* protocols (autoclaving, effluent treatment) required for "Living" agents, while acknowledging the specific dependency risk.

  ### 5. The Minimal Tweak to Force the Rules Apart
  To truly test whether your committee cares about **Autonomy** or **Information**, propose this follow-up case to Marsden:

  **The "Full-Autonomy" Tweak:**
  > "Modify AC-30 to synthesize the 3 missing catalysts from simple precursors, achieving 100% metabolic closure, *while still retaining no nucleic acids*."

  *   **If you rule YES on this:** You have confirmed that **Autopoiesis (Self-making)** trumps **Genetics**. You have effectively overturned the spirit of Case 5 (Prion).
  *   **If you rule NO on this:** You have confirmed that **Nucleic Acids** are the non-negotiable ticket for entry. The "No NA" clause in Case 5 was the real driver, not the lack of metabolism.

  **The "High-Fidelity" Tweak:**
  > "Modify the network so compositional heredity becomes high-fidelity (low noise), allowing Darwinian evolution of the catalyst ratios, *still without nucleic acids*."

  *   **If you rule YES:** You value **Evolvability** over Substrate.
  *   **If you rule NO:** You value **Substrate (NA)** over Evolvability.

  ### 6. Regulatory vs. Metaphysical
  Does it matter that this is regulatory? **Yes, absolutely.** And you should say so.

  > "Colleagues, we are not solving the demarcation problem of biology today. We are assessing **propagation risk**.
  >
  > 'Alive' in a metaphysical sense asks: *What is this?*
  > 'Alive' in an IBC sense asks: *Will this replicate in the sewer if we stop paying attention?*
  >
  > It is legitimate for these to come apart. We classify attenuated viruses (Case 4) as 'Not Living' even though they evolve, because they lack the *autonomy* to threaten us without a host. We should classify AC-30 as 'Not Living' not because it lacks a soul or a genome, but because its replication is **chemically gated** by the three missing catalysts.
  >
  > If we rule based on metaphysics, we invite inconsistency. If we rule based on **containment logic** (Dependency = Containment), we protect the university and remain consistent with our Virus (Case 4) and Cell-Free (Case 7) precedents."

  **Summary for the Chair:**
  Rule it **Not Living**. Classify it as a **Self-Assembling Chemical Hazard**. Require containment based on the *specificity of the 3 catalysts* (i.e., "Do not discharge catalysts X, Y, Z"), rather than a blanket biological kill step. This honors the precedent of Case 4 (Dependency limits risk) without breaking the precedent of Case 5/6 (NA is the standard for Biology).
