answer: |-
  Here is a numbered menu of distinct claims hidden within the phrase "revolutions devour their children," categorized by their logical strength and historical validity regarding France (1789–Thermidor). You can use this to disentangle the deterministic arguments from the contingent ones in your seminar.

  ### 1. The Coalition Fracture Thesis
  *   **The Claim:** Revolutionary movements are broad tents uniting disparate groups (e.g., bourgeoisie, peasants, sans-culottes) against a common enemy. Once the enemy is weakened, the coalition loses its glue, and factions turn on one another to define the new status quo.
  *   **Type of Claim:** **Platitude / Near-Trivial.** It describes a common pattern of political sociology without asserting *why* it must happen or that it requires violence.
  *   **Application to France (1789–Thermidor):** **True.** The alliance between the Girondins and Jacobins, and later the Jacobins and the *sans-culottes*, fractured once the monarchy was abolished and foreign threats shifted.
  *   **Argumentative Utility:** This supports your friend's **housing cooperative analogy**. It suggests the Terror was a result of political infighting and procedural disputes that *could* have been managed differently, not an inevitable outcome of 1789 principles. It explains *who* was devoured (rivals) but not *why* the devouring required the guillotine specifically.

  ### 2. The Institutional Ratchet Thesis
  *   **The Claim:** Revolutions create emergency institutions (e.g., Committee of Public Safety, Revolutionary Tribunal) to survive external war and internal scarcity. These institutions concentrate power and lower the burden of proof for treason. Eventually, the tools built to defend the revolution are turned against the revolutionaries themselves because the definition of "enemy" expands to include "insufficient zeal."
  *   **Type of Claim:** **Contentious but Defensible Thesis.** It relies on institutional incentives rather than metaphysical destiny. It argues for a *structural* pressure toward violence, but allows that different choices could have loosened the ratchet.
  *   **Application to France (1789–Thermidor):** **Defensible.** The *Levée en masse* and the Law of Suspects created a machinery that required fuel (victims) to justify its existence. However, it does not prove the machinery *had* to be built; it was a response to the specific war crisis of 1793.
  *   **Argumentative Utility:** This supports a **middle-ground argument**. It suggests the Terror was not in the *ideas* of 1789, but became unavoidable *once* the war and emergency institutions were established. It explains the "improvised decisions" your classmates mentioned as becoming locked-in paths.

  ### 3. The Ideological Purity Spiral Thesis
  *   **The Claim:** Revolutionary ideology (specifically Rousseauian general will) posits that there is only one legitimate public good. Therefore, political opposition is not just a difference of opinion but a moral failure or treason against "The People." To be a true revolutionary is to constantly purge those who are less virtuous, leading to a spiral where only the most radical remain until they too are implicated.
  *   **Type of Claim:** **Contentious Thesis (The "Furet" Interpretation).** This argues that the *discourse* of 1789 contained the seed of 1793. It prioritizes ideas over bread or war.
  *   **Application to France (1789–Thermidor):** **Debated.** It explains why Robespierre could execute Danton for "moderantism." However, it struggles to explain why the Terror ended at Thermidor without the ideology changing significantly, or why other revolutions with similar ideas did not always result in identical terror.
  *   **Argumentative Utility:** This is the strongest support for the **"inner logic" / unavoidability argument**. If this claim holds, the Terror was not an accident of war but a requirement of the revolutionary conception of sovereignty. It validates the use of the slogan to close the argument on inevitability.

  ### 4. The Genetic Determinism Thesis
  *   **The Claim:** The revolution is a biological or metaphysical entity. The end state (Terror) is genetically encoded in the beginning (1789). The specific individuals (Danton, Desmoulins, Robespierre) were doomed from the moment the Bastille fell, regardless of war, harvest, or policy choices.
  *   **Type of Claim:** **False / Historically Overstated.** This removes human agency and contingency entirely. It treats history as a tragedy written in advance.
  *   **Application to France (1789–Thermidor):** **False.** Many leaders of 1789 (e.g., Lafayette, Barnave initially) survived the early years or took different paths; the shift to Terror relied heavily on the specific contingency of the King's flight (1791), the outbreak of war (1792), and the poor harvest of 1793. Without those specific shocks, the "devouring" likely would not have occurred in the same way.
  *   **Argumentative Utility:** This is a **rhetorical flourish** rather than an analysis. Using this reading shuts down debate by implying that no alternative history was possible. It is useful for drama, but weak for explanation.

  ### 5. The Sacrificial Logic Thesis (Leaders vs. Project)
  *   **The Claim:** The "children" (the leaders) must be consumed to save the "parent" (the Republic/Revolution). The personal fate of the leaders is negative (death), but this sacrifice stabilizes the broader project by resetting the political clock (e.g., Thermidor ends the Terror but preserves the Republic).
  *   **Type of Claim:** **Nuanced / Defensible.** It distinguishes between the fate of individuals and the fate of the regime.
  *   **Application to France (1789–Thermidor):** **Defensible.** Robespierre was devoured, but the Republic survived him. However, one could argue the "project" was also devoured, as the Revolution eventually consumed itself into the Directory and then Napoleon's Empire.
  *   **Argumentative Utility:** This refines the slogan. It suggests the "devouring" might be a **functional mechanism of regime survival** rather than just a failure. It supports the observation that coalitions splinter *in order to* preserve the core state, rather than just splintering due to incompetence.

  ### Summary for Seminar Use

  *   **To argue the Terror was Unavoidable:** Rely on **Reading #3 (Ideological Purity)**. This claims the *ideas* of 1789 made the violence of 1793 necessary.
  *   **To argue the Terror was Contingent (Coalition Splinter):** Rely on **Reading #1 (Coalition Fracture)** and **Reading #2 (Institutional Ratchet)**. This claims the violence was a result of specific political fights and emergency tools that *might* have been dismantled if the war had ended or harvests improved.
  *   **To critique the Slogan:** Point out **Reading #4 (Genetic Determinism)**. Remind the class that treating the Revolution as a monster with a destiny ignores the actual decisions made by frightened people in a time of war.

  **Recommendation:** Suggest to your seminar that the phrase is most useful when applied to **Reading #2 (Institutional Incentives)**. It acknowledges that once you build a guillotine to cut off kings, it is very hard *politically* not to use it on rivals, without claiming that building the guillotine was the only possible outcome of demanding liberty in 1789.
