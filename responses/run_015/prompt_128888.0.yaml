  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Foundations of Quantum Mechanics and the Symmetric Splitting Chamber  
  **Parties:** Decision-Theoretic Derivationist (DTD) & Objective-Measure Fundamentalist (OMF)  
  **Date:** October 26, 2023

  ## Preamble
  This document formalizes the residual disagreements between the undersigned parties following a series of negotiations regarding the interpretation of unitary quantum mechanics. We have utilized a hypothetical scenario, the **Symmetric Splitting Chamber (SSC)**, to isolate the logical dependencies of our respective positions. In the SSC, a quantum system is prepared in an equal superposition of $2^n$ orthogonal states. An observer enters the chamber and is duplicated into $2^n$ identical copies, each coupled to exactly one branch. The phenomenological coupling strength is uniform across all copies, ensuring no subjective difference distinguishes the copies regardless of the initial amplitude coefficients in the state vector.

  While we agree on the physical description of the SSC, we disagree on the normative and ontological implications for rational agency and the status of the Born Rule. The following sections detail our points of convergence, our precise divergences, and the conceptual tests we propose to adjudicate the substantive core of our dispute.

  ---

  ## I. Agreed Claims
  Both parties affirm the following propositions as the common ground for this debate:

  1.  **Unitary Branching:** Under the SSC conditions, the deterministic unitary evolution of the wavefunction results in exactly $2^n$ distinct branches. In this specific symmetric configuration, each branch possesses an equal Hilbert space norm ($1/2^n$).
  2.  **Phenomenological Indiscernibility:** Given the uniform coupling strength stipulated in the SSC, the first-person experience of each copy is identical. There is no internal marker available to any copy that indicates its specific branch index or the amplitude coefficient of its branch prior to measurement outcomes.
  3.  **The Explanandum:** Both parties agree that a complete physical theory must explain why a rational agent, anticipating entry into the SSC (or its asymmetric generalizations), should structure their expectations and betting preferences to align with the Born Rule ($|c_i|^2$) rather than a simple branch-counting measure (uniform distribution across copies), particularly in cases where branch counting and norm weighting diverge.
  4.  **Status of No-Go Results:** We agree that standard no-go theorems regarding deterministic branching establish that probability cannot be found *explicitly* in the Schrödinger equation as a stochastic dynamical collapse. We further agree that these results leave open whether probability is (a) a derived feature of rational decision-making within a branching ontology, or (b) a primitive physical measure that must be appended to the ontology.
  5.  **Empirical Equivalence:** In the specific case of the Symmetric Splitting Chamber, the Born Rule and the Branch-Counting Rule yield identical numerical predictions for outcome frequencies. The disagreement is not about the prediction in this specific case, but about the justification for the weighting principle that must apply when symmetry is broken.

  ---

  ## II. Residual Disagreements: Formal Statements
  Each party accepts the following wording as the most charitable and precise formulation of their opposing stance.

  **The Decision-Theoretic Derivationist (DTD) Statement:**
  > "In the Symmetric Splitting Chamber, the physical state plus the requirements of diachronic rationality uniquely fix the agent's betting preferences. Self-locating uncertainty, when constrained by the structure of the Hilbert space and the equivalence of macrostates, entails that a rational agent must weight branches by their squared amplitude. This derivation does not presuppose probability but rather identifies the Born Rule as the unique coherence condition for agents who know they will branch. The measure is emergent from the geometry of the state space and the logic of decision."

  **The Objective-Measure Fundamentalist (OMF) Statement:**
  > "In the Symmetric Splitting Chamber, the physical state alone underdetermines the agent's betting preferences. Arguments claiming to derive the Born Rule from rationality necessarily smuggle in probabilistic utility weights that are unavailable in a purely deterministic branching ontology. Because the phenomenological coupling is uniform, branch counting is the default ontological expectation. To recover the Born Rule, especially in asymmetric cases, one must posit the measure as a primitive physical postulate distinct from the branching structure itself. Rationality constrains how to *use* the measure, but cannot *generate* it."

  ---

  ## III. Cruxes and Conceptual Tests
  We have identified two specific cruxes where our positions yield different diagnostic expectations. For each crux, we specify a conceptual test based on the logic of the SSC and record our predicted outcomes.

  ### Crux 1: The Supervenience of Credence
  **Question:** Does rational credence supervene entirely on the physical wavefunction and the agent's goals, or does it require an additional normative postulate linking Hilbert space norm to 'caring measure'?

  **Conceptual Test: The Amplitude Deformation**
  *   **Setup:** Consider a continuous deformation of the SSC Hamiltonian that shifts the system from an equal superposition ($2^n$ equal amplitudes) to an unequal superposition ($2^n$ unequal amplitudes) while maintaining the $2^n$ branching structure and uniform phenomenological coupling.
  *   **DTD Prediction:** A rational agent's betting odds must shift continuously in lockstep with the changing amplitudes, even before any empirical data is collected. The rationality constraints bind the agent to the norm immediately; there is no threshold where 'counting' switches to 'weighting.'
  *   **OMF Prediction:** Without a primitive postulate linking norm to probability, the agent has no rational basis for shifting odds away from uniform branch counting solely due to amplitude changes. The shift in odds only becomes rational once the Born Rule is accepted as an independent axiom. The derivationist claim of a 'continuous shift' mandated by rationality alone is an illusion created by implicit probabilistic assumptions.

  ### Crux 2: The Status of Low-Weight Branches
  **Question:** Do branches with vanishingly small norm retain full ontological status for the purpose of self-location, or are they effectively 'invisible' to rational agency?

  **Conceptual Test: The Zero-Weight Limit**
  *   **Setup:** Modify the SSC such that one specific branch out of $2^n$ has its amplitude coefficient reduced toward zero, while the phenomenological coupling remains uniform (the copy on that branch still exists and feels identical).
  *   **DTD Prediction:** As the norm approaches zero, the rational agent's degree of belief in finding themselves on that branch must also approach zero. The branch becomes 'measure-zero' and is effectively excluded from practical deliberation, despite the copy's existence.
  *   **OMF Prediction:** If the ontology is purely branching copies, the copy exists regardless of norm. Excluding it requires a primitive measure that overrides the ontological count. A purely decision-theoretic approach cannot justify ignoring an existing copy without circularly assuming that 'existence' is graded by amplitude.

  ---

  ## IV. Table of Disagreements
  The following table categorizes the specific points of contention, distinguishing between verbal disputes (terminological) and substantive disputes (ontological or normative).

  | Issue | DTD Position | OMF Position | Classification |
  | :--- | :--- | :--- | :--- |
  | **Definition of Probability** | Probability is defined by rational betting behavior in the face of branching. It is a functional role filled by the Born Rule. | Probability requires a primitive stochastic element or a primitive measure over branches. Betting behavior merely reflects this prior fact. | **Verbal** (mostly) |
  | **Source of the Born Rule** | Derived from the symmetries of the Hilbert space and decision-theoretic axioms (e.g., diachronic consistency). | Postulated as a fundamental law of nature (a 'measure' over worlds) independent of decision theory. | **Substantive** |
  | **Self-Locating Uncertainty** | Quantitative uncertainty is well-defined for an agent anticipating branching, grounded in the structure of the state vector. | Quantitative uncertainty is ill-defined in deterministic branching without a primitive measure; only qualitative uncertainty exists. | **Substantive** |
  | **Branch Counting** | Branch counting is ill-defined or irrelevant; the 'number' of branches is a basis-dependent artifact, whereas norm is robust. | Branch counting is the natural ontological default in a many-worlds ontology; rejecting it requires extra justification (the primitive measure). | **Substantive** |
  | **Circularity Charge** | Decision-theoretic proofs are non-circular; they show that *if* you care about your future copies, you *must* care according to the Born Rule. | Decision-theoretic proofs are circular; the axioms of rationality (e.g., ordering, continuity) implicitly encode the probabilistic conclusions they claim to derive. | **Substantive** |
  | **Phenomenological Coupling** | Irrelevant to the normative weights; rationality tracks the physical measure (norm), not the subjective intensity of experience. | Highly relevant; if experience is uniform, normative weight should be uniform unless a primitive measure overrides phenomenology. | **Substantive** |

  ---

  ## V. Conclusion
  We sign this statement to acknowledge that our disagreement is not regarding the mathematical formalism of the Symmetric Splitting Chamber, nor the empirical predictions it yields in its symmetric form. Our disagreement is strictly foundational: whether the Born Rule is a theorem of rationality within a unitary ontology (DTD) or a primitive physical postulate required to make sense of that ontology (OMF). We agree that the resolution of this dispute hinges on whether a non-circular, quantitative structure can be imposed on self-locating uncertainty without presupposing the very measure it seeks to explain.

  **Signed,**

  _________________________  
  **Decision-Theoretic Derivationist**

  _________________________  
  **Objective-Measure Fundamentalist**
