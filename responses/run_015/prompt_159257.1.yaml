answer: |-
  Your intuition is correct, but it is only the first layer of the onion. The standoff is indeed largely verbal, but it is sustained by a substantive disagreement about **modality** (necessity vs. contingency) and **epistemology** (conceptual analysis vs. empirical measurement).

  Here is the fuller diagnosis, the verdict on your hypothetical preprint, and a strategy for writing about this without inviting the fury.

  ### 1. The Diagnosis: Three Theses, One Name

  The reason your correspondents talk past each other is that "The Church–Turing Thesis" (CTT) is a homonym for three distinct claims. The fury arises because each camp believes their version is the *only* legitimate one.

  1.  **CTT-Math (The Definitional Claim):** This is the historical thesis. It claims that the informal, intuitive notion of an "effectively calculable function" (what a human can do with pencil and paper following rules) is extensionally equivalent to the formal notion of a "Turing-computable function."
      *   *Status:* Conceptual/Stipulative.
      *   *Camp 1:* Believes this is the only real CTT. Since "effective calculability" is informal, we needed a formal proxy. Turing Machines won. To say CTT is false is to misunderstand the definition of "computable."
  2.  **CTT-Physics (The Empirical Claim):** This claims that every function physically computable by a finite physical system in our universe is Turing-computable.
      *   *Status:* Contingent/Empirical.
      *   *Camp 2:* Believes math is abstract, but computation happens in physics. If general relativity allows closed timelike curves, or quantum gravity allows infinite precision in finite time (Zeno machines), CTT-Physics could be false.
  3.  **CTT-Cognitive (The Functionalist Claim):** This claims that the human mind (or any intelligent system) cannot compute anything beyond a Turing Machine.
      *   *Status:* Speculative/Interdisciplinary.
      *   *Camp 3:* Often conflates this with CTT-Physics. Their worry is whether "computation" is even the right lens for brains.

  **Is the standoff verbal?**
  Mostly, yes. If Camp 1 said "CTT-Math is a definition" and Camp 2 said "CTT-Physics is a law of nature," they would agree. However, there is a **substantive disagreement about standards of evidence**:
  *   **Camp 1** views CTT as a matter of *conceptual clarity*. Evidence is irrelevant; coherence is key.
  *   **Camp 2** views CTT as a matter of *physical possibility*. Evidence is experimental; a single counter-example in nature refutes it.

  The fight persists because both sides want the term "Computable" to carry the authority of the other. Camp 1 wants the certainty of math to apply to physics. Camp 2 wants the openness of physics to apply to math.

  ### 2. The Concrete Scenario: The 1-Million-State Device

  Suppose the preprint claims a device that settles the Halting Problem for all Turing Machines with $< 10^6$ states in finite physical time.

  **Does this refute anything?**
  Strictly speaking: **No.**

  Here is why both camps will feel vindicated, and why they are technically right to do so:

  *   **Camp 1 (The Definitionalists) is right:** Computability theory is about *asymptotic* behavior over infinite domains. Any function with a finite domain (like "all TMs with $< 10^6$ states") is trivially Turing-computable. You can simply hard-code the answers into a lookup table. A physical device that does this is just a complex lookup table. It tells us nothing about the *concept* of computability, which is defined by what happens as $N \to \infty$.
  *   **Camp 2 (The Physicalists) is right (conditionally):** They will ignore the $10^6$ bound and look at the *mechanism*.
      *   If the device works by brute-force lookup, Camp 2 should concede it's boring.
      *   If the device works by exploiting a physical phenomenon that *scales* (e.g., it uses a Zeno-style time compression where each step takes half the time of the previous one), then the $10^6$ limit is just an engineering constraint, not a theoretical one. If the *physics* allows the mechanism, then CTT-Physics is threatened, because the mechanism implies the *potential* for unbounded hypercomputation.

  **The Verdict on the Preprint:**
  If the device is a "black box" that just gives answers, it refutes nothing. If the device demonstrates a physical mechanism that violates the resource constraints assumed by Turing Machines (infinite time, infinite precision, etc.), it challenges **CTT-Physics**, but leaves **CTT-Math** untouched.

  The fact that both sides feel vindicated is indeed evidence that the fight is about **terminological ownership**. Camp 1 protects the sanctity of the mathematical definition. Camp 2 protects the empirical openness of the physical world.

  ### 3. What Counts as Progress?

  You asked if progress requires a sharper distinction, a formal result, or a different question.

  **Progress requires a sharper distinction.**
  There will be no formal result that resolves this, because the disagreement is not within a formal system; it is about the mapping between formal systems and the world. You should tell your readers to expect no resolution on the "truth" of the thesis, because the thesis is not a single proposition.

  **How to write about it (to minimize fury):**
  You can inoculate yourself against the emails by explicitly disambiguating the thesis in your text.

  1.  **Separate the Claims:** Explicitly state: "There is the *Mathematical* Church–Turing Thesis (a definition of algorithms) and the *Physical* Church–Turing Thesis (a claim about the universe)."
  2.  **Assign the Burden of Proof:**
      *   Tell Camp 1: "You are right that 'computable' is defined by TMs in math class."
      *   Tell Camp 2: "You are right that physics might allow hypercomputation, but that would only refute the Physical Thesis, not the Mathematical one."
  3.  **Address the Evidence Standard:** Acknowledge that Camp 1 demands conceptual coherence, while Camp 2 demands experimental verification. Neither is "wrong," they are just playing different games.

  ### 4. Why the Fight Won't End

  The reason nobody budges is that the stakes are higher than computation. This is a proxy war for **Naturalism vs. Platonism**.

  *   If CTT is purely definitional (Camp 1), then mathematics is autonomous from physics. Our logical intuitions dictate what is computable, regardless of what the universe does.
  *   If CTT is empirical (Camp 2), then mathematics is subservient to physics. What is "computable" depends on the contingent laws of our specific universe.

  Your correspondents aren't just fighting about Turing Machines; they are fighting about whether math discovers truth or invents it.

  **Recommendation:**
  Do not try to resolve the debate. Your role is to map the terrain. When you explain CTT, frame it as a **boundary marker** between the abstract world of logic and the concrete world of physics.

  If you receive the emails again, your reply should be: *"You are defending CTT-Math, which is a definition. Your opponent is attacking CTT-Physics, which is a hypothesis. You are both right, but you are using the same name for two different things."*

  That is the only resolution available.
