      *   My assessment: It is heavily insulated, arguably too much. It turns empirical claims into conceptual stipulations.
      *   Draft: Verdict: Illusionism is currently insulated from empirical defeat by redefining first-person evidence as the very illusion it seeks to explain, rendering it a coherent but potentially vacuous metaphysical stance rather than a falsifiable scientific hypothesis.
