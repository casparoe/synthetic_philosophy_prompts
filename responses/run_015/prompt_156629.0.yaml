          2.  *The Normative Authority of Reports (Fatal/Major).* If first-person reports are systematically false, communication breaks down.
          3.  *The Decoupling Problem (User's point) (Major).* If representation and phenomenality can be empirically dissociated, illusionism loses its explanatory target.
          4.  *Evolutionary/Functional Redundancy (Awkward).*
      *   *Empirical Concessions:* Illusionists welcome split-brain and blindsight (supports modularity/errors). They would be damaged by evidence that *introspective error* has a specific signature that implies *real* properties (hard to conceive).
      *   *Conceptual Smuggling:* Yes, they smuggle "appearance" in. Frankish admits this is "quasi-phenomenal."
      *   *Unfalsifiability:* It is highly insulated. Every report confirms the theory. This is a methodological vice (immunization against refutation).
      *   *Conclusion:* Needs to be sharp.

  8.  **Refining the "Verdict" Line:**
