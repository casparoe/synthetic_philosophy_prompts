answer: |-
  This is one of the hardest problems in bioethics and law. You are struggling because "consent" is doing too much work. It is trying to be a psychological state, a legal contract, and a moral permission slip all at once.

  Your intuition is correct: "Nobody pushed them and they'd have said yes anyway" is insufficient. It fails the blood donor (who would have said no) and it dangerously validates prejudice (the pig valve/Black surgeon problem).

  Here is a tight framework that captures 90% of your verdicts, identifies where your gut might be wrong, and answers your philosophical core question.

  ### The Principle: Authorized Agency within Material Boundaries

  Valid consent is not a feeling; it is a **moral transformation**. It turns an act that would be a violation (battery, trespass, theft) into a permissible interaction. For that transformation to hold, three conditions must be met simultaneously. If any one fails, the consent is invalid.

  1.  **Capacity:** The agent must possess the cognitive ability to understand the nature and consequences of the act *at the time of agreement* (or have validly bound their future self via prior capacity).
  2.  **Voluntariness:** The agreement must be free from *illegitimate* control or pressure.
  3.  **Material Information:** The agent must not be deceived regarding facts that change the **nature** or **risk** of the act, according to either reasonable standards or known personal dealbreakers.

  ---

  ### Clause-by-Clause Case Audit

  Here is how this principle runs through your pile, including where it overrules your gut.

  **1. The Condom (Stealthing)**
  *   **Verdict:** Invalid.
  *   **Clause:** **Material Information.**
  *   **Why:** The condition of the act (protected sex) was fundamentally altered to a different act (unprotected sex). This changes the risk profile entirely.
  *   **Note:** Your gut is right. This is battery.

  **2. Knee Surgery + Extra Fix**
  *   **Verdict:** Invalid (technically), though ethically defensible under *emergency exception*.
  *   **Clause:** **Material Information / Scope.**
  *   **Why:** You authorized a knee repair, not a mystery procedure. Even if beneficial, the surgeon exceeded the authorized agency.
  *   **Note:** The law usually requires "immediate threat to life/limb" to bypass this. If it could have waited, your gut should be firmer: it is a violation.

  **3. Robot vs. Resident**
  *   **Verdict:** Robot = Invalid; Resident = Valid.
  *   **Clause:** **Material Information (Reasonable Expectations).**
  *   **Why:** This is the "Social Norm" clause. Medical training norms are public knowledge; a "surgeon" implies a team including residents. "Robot-assisted" implies a human pilot. If the system runs autonomously, the *nature* of the act changes from "surgery" to "automated procedure."
  *   **Note:** Your gut is right. You are not defending "normal"; you are defending "publicly understood professional norms."

  **4. Billing Lie vs. Research Deception**
  *   **Verdict:** Billing = Valid Consent to Treatment; Research = Invalid.
  *   **Clause:** **Material Information (Purpose of the Act).**
  *   **Why:** In clinical care, the purpose is health; billing is collateral. In research, the purpose is *knowledge generation*. Lying about the goal of research changes the *nature* of the act (therapy vs. experiment).
  *   **Note:** This solves your structural identity crisis. They look identical financially, but they differ teleologically (by purpose).

  **5. Blood Donor Fee Lie**
  *   **Verdict:** Valid.
  *   **Clause:** **Material Information (Collateral Inducement).**
  *   **Why:** Where the money goes does not change the *nature* or *risk* of the blood draw. It is a motivational factor, not a material fact about the procedure.
  *   **Note:** Here the principle overrules your "Would you have said yes?" test. Consent is about the act, not the motivation for the act, unless the motivation is the only reason the act exists (see Research above).

  **6. Boss vs. Partner Threat**
  *   **Verdict:** Boss = Coerced; Partner = Not Coerced.
  *   **Clause:** **Voluntariness (Legitimacy of Power).**
  *   **Why:** A boss wields institutional power over livelihoods (illegitimate to use for sex). A partner wields autonomy over their own presence in a relationship (legitimate).
  *   **Note:** Coercion is not just "pressure"; it is "illegitimate pressure."

  **7. Phase I Trial in Poor Country**
  *   **Verdict:** Valid Consent, but **Exploitative**.
  *   **Clause:** **Voluntariness.**
  *   **Why:** This is where your gut is fighting itself. $2,000 is an offer, not a threat. It expands options rather than closing them. Therefore, it is not coercion. However, it is *exploitation* (taking unfair advantage of vulnerability).
  *   **Note:** **Crucial Distinction:** Consent can be *valid* but the transaction *unjust*. Do not conflate validity with justice. Your gut is sensing injustice, not invalidity.

  **8. Drunk Yes vs. Alzheimer's Letter**
  *   **Verdict:** Drunk = Invalid; Letter = Valid.
  *   **Clause:** **Capacity (Temporal).**
  *   **Why:** Intoxication is temporary incapacity; we wait for the capacity to return. Alzheimer's is progressive loss; the "Ulysses Contract" (prior competent self binding future incompetent self) is valid to protect the prior self's values.
  *   **Note:** The principle distinguishes between *impairment* (drunk) and *precedent autonomy* (letter).

  **9. Minors (IUD vs. Eggs vs. Transfusion)**
  *   **Verdict:** IUD = Valid; Eggs = Invalid; Transfusion = Invalid.
  *   **Clause:** **Capacity (Mature Minor + Best Interest).**
  *   **Why:** We grant capacity to minors for low-risk/high-benefit personal health (IUD). We deny it for high-risk/non-therapeutic financial gain (Eggs). We override it when refusal leads to death (Transfusion), because the state has an interest in preserving the life of the child.
  *   **Note:** It's not a binary "kid/no kid." It's a sliding scale of risk vs. benefit vs. state interest.

  **10. Climbing Gym Waiver**
  *   **Verdict:** Falling = Valid; Wall Collapse = Invalid.
  *   **Clause:** **Material Information (Negligence vs. Risk).**
  *   **Why:** You can consent to *inherent risks* of an activity. You cannot consent to *negligence* (failure of duty of care). The waiver covers the sport, not the safety inspection.
  *   **Note:** Consent does not waive the right to safety standards.

  ---

  ### Fixing the "Would You Have Said Yes?" Problem

  You asked how to stop the principle from invalidating consent based on prejudice (Black surgeon) or idiosyncrasy (Pig valve).

  **The Fix: The "Known Dealbreaker" Clause.**
  Under *Material Information*, a fact is material if:
  1.  A **reasonable person** would consider it decisive regarding risk/nature (Objective Standard); OR
  2.  The provider **knows** that this specific person considers it decisive (Subjective Standard).

  *   **Pig Valve:** If the patient *tells* the doctor "No pig valves," and the doctor lies, consent is invalid. If the patient never mentions it, and a reasonable person wouldn't care, consent stands.
  *   **Black Surgeon:** Race is never a *medical* material fact. A patient cannot claim invalid consent based on race unless the provider *knows* it is a dealbreaker and hides it. But ethically, the system is not obliged to accommodate prejudice. The law generally protects the provider here: you cannot invalidate a medical contract based on discriminatory preferences unknown to the provider.

  **Where the principle overrules you:**
  You said the Blood Donor consent is valid even though she would have said no. The principle agrees with your gut, not your "Would you have said yes" test. Consent is about the **transaction**, not the **motivation**. If the lie is about the *transaction* (Research goal), consent is void. If the lie is about the *motivation* (Where the fee goes), consent stands.

  ---

  ### The Flip-Flopping Cases

  **1. Hypomanic Source (Named in story)**
  *   **Analysis:** Hypomania can impair judgment/capacity. If she lacked capacity at the time of agreement, the consent was void *ab initio* (from the start).
  *   **Resolution:** The next-day "clear-headed yes" is not a *repair*; it is a **new act of consent**. You cannot publish based on the first yes. You must treat the second yes as the operative one. If she revokes the second yes, you cannot publish.
  *   **Rule:** Capacity must exist at the moment of authorization. Ratification is possible, but it functions as a new agreement.

  **2. Drunk Friend (Quote at party)**
  *   **Analysis:** Same as above. "Yeah fine" while slurring is likely invalid due to capacity.
  *   **Resolution:** The text the next morning is a **new act of consent**. It validates the quote, but not because it fixed the drunk yes. It fixed it because it was a sober yes.
  *   **Rule:** A later clear-headed yes repairs the *permission*, but it admits the *first yes didn't count*.

  ---

  ### The Core Question: Is there a unity?

  You asked: *Is "she consented" just a label we stick on a bunch of unrelated complaints, or is there a core?*

  There is a core. It is **Moral Transformation.**

  Without consent, sex is rape, surgery is battery, and entering a house is trespass. Consent is the specific mechanism that changes the moral valence of the act.

  All the complaints you listed (pushing, lying, not-getting-it) are failures of that mechanism.
  *   **Coercion** fails because the will was overborne (the "Yes" wasn't an exercise of will).
  *   **Deception** fails because the will was directed at a phantom object (the "Yes" was for Act A, but Act B happened).
  *   **Incapacity** fails because the will was not functional (the "Yes" was noise, not choice).

  **The Unified Theory:**
  "Valid Consent" means the agent has successfully transferred moral authority over a specific boundary to another person.
  *   If the boundary is unclear (Deception), the transfer fails.
  *   If the hand shaking the boundary is shaking (Incapacity), the transfer fails.
  *   If the hand is being forced (Coercion), the transfer fails.

  **For your piece:**
  The click-through form vs. the signed-in-triplicate form is a distraction. Neither creates consent. They are merely **evidence** of consent.
  *   The click-through is often *evidence of nothing* (no one reads it).
  *   The signed form is often *evidence of coercion* (sign or we don't treat).

  Your piece should argue that we have confused **documentation** with **permission**. We treat the signature as the magic spell, when it is merely the receipt. If the transaction underneath was flawed (by the three clauses above), the receipt is worthless.

  **The Takeaway:**
  Consent is not a form. It is a continuous state of authorized agency. It can be withdrawn, it can be voided by new information, and it cannot be signed away in advance if the conditions of capacity and materiality are not met at the moment of the act.
