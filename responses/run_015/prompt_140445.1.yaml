prompt: |-
  I'm a journalist — I cover science and medicine — and I'm working on a piece about consent forms, the click-through kind and the signed-in-triplicate kind, and I keep typing the phrase "valid consent" without being able to say what makes it valid. So I did what I always do when I'm lost: I wrote down a pile of cases, marked each one with my gut, and now the pile won't sit still.

  - Someone agrees to sex with a condom, partner takes it off halfway through. Definitely not consent, and worse than I expected myself to feel about it.
  - Patient signs for a knee operation; surgeon gets in there, finds something else, fixes that too. Low risk, genuinely beneficial, patient would probably thank her. Still not fine to me.
  - Patient signs for "robot-assisted" surgery and the actual cutting is done by the system running on its own, nobody's hands on the console for most of it. Not fine. But — and here's the thing that bugs me — I'm fine with the surgeon handing half the operation to a resident the patient never met. Both are a substitution in who does the thing. Am I just defending whatever's normal?
  - Nurse practitioner at a community clinic tells a patient the visit is covered; it isn't and she's on the hook for $400. Gut says the consent to treatment is still fine, the billing is a separate wrong. But then: a study enrols people telling them it's about memory when it's about conformity, same risk, same payment. That one I say is invalid.
    Those two look structurally identical to me — same risk, same money, lie about something the person cared about — and I give opposite answers. I have no idea what's supposed to separate them.
  - Blood donor is told the fee goes to a charity; it goes to the company's overhead. Annoying. I don't think it voids consent.
  - Boss says sleep with me or you're fired. Coerced. Partner says sleep with me or I'm leaving. Not coerced. The partner is also threatening to do something she's entirely entitled to do.
  - A phase I trial in a country where $2000 is four months' wages, for a drug with real risk. My gut says "not coercion" and then immediately says "but not fine either," which probably means my gut is useless on this one.
  - Drunk yes at a party: not consent. But my dad, early Alzheimer's, signed a letter last year saying he'd hand over the keys when his doctor said so, and I think the letter should win over what he's saying now. Which seems backwards — in one case I throw out the impaired present self in favor of the earlier one, in the other I won't let the earlier self's explicit instruction count.
  - 16-year-old getting an IUD without her parents: yes. 17-year-old selling her eggs for tuition money: no. And a 15-year-old refusing a transfusion on religious grounds: no, override her. If there's a shape here it's not just "kids can't consent."
  - Signed a waiver to get into the climbing gym. I don't think that's consent to the risk of the wall falling on me because they never inspected the bolts, but I do think it's consent to the ordinary risk of falling off. Same signature.

  The principle I keep falling back on is: nobody pushed them, and they'd have said yes anyway if they'd known the whole truth. But that has to be wrong somewhere. The blood donor would have said no if she'd known — so my principle calls it invalid, and my gut doesn't. And there's a version that's worse: a patient who'd have refused if he'd known the valve was from a pig, or that the surgeon was Black. I don't want to say the "would you have said yes if you knew" test makes that consent invalid, but I also don't see how to stop it from saying that.

  So: is there one principle — or a short list of them — that gets most of my verdicts, and where does it overrule me? I'd like it stated tightly enough that I can run new cases through it, with a clause-by-clause note on which case forced the clause. And two cases I haven't put on the list because I keep flip-flopping: a woman who said yes to being named in a story while she was hypomanic and now wants out, and a friend who slurred "yeah fine" about a quote at a conference party and then texted "still fine" the next morning. Does a later clear-headed yes repair an earlier broken one, or is that a different question from whether the first yes counted?

  One more thing I actually need for the piece: after all this, is there anything left in "she consented" beyond a label we stick on a bunch of unrelated complaints — the pushing, the lying, the not-getting-it — or is there a core that all of them are failures of?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Journalist covering science and medicine.
      *   **Task:** Writing a piece about consent forms (click-through vs. signed).
      *   **Problem:** Struggling to define "valid consent." Has a list of intuitive case judgments but can't find the unifying principle.
      *   **Specific Needs:**
          1.  A tight principle (or short list) that explains most of their verdicts.
          2.  Identification of where the principle overrules their gut.
          3.  Clause-by-clause notes linking principles to specific cases from their list.
          4.  Resolution on two flip-flopping cases (hypomanic source, drunk friend).
          5.  Answer to the philosophical core: Is "consent" just a label for unrelated complaints, or is there a unified core?
      *   **Tone:** Intellectual, rigorous, empathetic to the complexity, journalistic (clear, structured), but philosophically grounded.

  2.  **Deconstruct the Cases & Intuitions:**
      *   *Condom removal (Stealthing):* Invalid. (Deception regarding material condition/safety).
      *   *Knee surgery + extra fix:* Invalid (technically), though beneficial. (Scope violation).
      *   *Robot vs. Resident:* Robot = Invalid; Resident = Valid. (Expectation of human agency vs. accepted medical hierarchy/training norms).
      *   *Billing lie vs. Research Deception:* Billing = Valid consent to treatment; Research = Invalid. (Therapeutic misconception vs. administrative/financial side issue).
      *   *Blood donor fee lie:* Valid. (Collateral/motivational factor, not risk/procedure).
      *   *Boss vs. Partner threat:* Boss = Coerced (Illegitimate power); Partner = Not coerced (Legitimate relationship boundary).
      *   *Phase I trial in poor country:* "Not coercion" but "Not fine." (Exploitation vs. Coercion).
      *   *Drunk yes vs. Alzheimer's letter:* Drunk = Invalid (Capacity); Alzheimer's = Valid (Precedent autonomy/Ulysses contract).
      *   *Minors (IUD vs. Eggs vs. Transfusion):* IUD = Valid (Mature minor/Best interest); Eggs = Invalid (Exploitation/Long term harm); Transfusion = Invalid (Life over religious liberty for minors).
      *   *Climbing gym waiver:* Valid for ordinary risk, Invalid for negligence. (Assumption of risk vs. Duty of care).
      *   *The "Would you have said yes?" Problem:* Pig valve/Black surgeon. If we invalidate based on *any* dealbreaker, we validate prejudice or trivialities. Need a "Materiality" filter.

  3.  **Synthesize a Principle:**
      *   The user's fallback ("Nobody pushed + Would have said yes") fails on the Blood Donor and Prejudice cases.
      *   *Core Concept:* Consent isn't just about the "Yes." It's about the *authority* transferred and the *conditions* under which that authority is granted.
      *   *Proposed Framework:* **Authorized Agency within Material Boundaries.**
      *   *Three Pillars:*
          1.  **Capacity:** The mind must be able to hold the decision (rules out drunk, protects Alzheimer's letter via prior capacity).
          2.  **Voluntariness:** No illegitimate pressure (rules out Boss, allows Partner).
          3.  **Information/Materiality:** Deception invalidates consent *only* regarding facts that change the *nature* or *risk* of the act, not collateral motivations (rules out Research lie, allows Billing/Blood lie, handles Pig Valve via "medical materiality" vs. "personal preference").

      *   *Refining the "Materiality" Clause:* This is the hardest part. Why is the research lie material but the billing lie isn't? Because research *purpose* is central to the act. Billing is administrative. Why is the robot different from the resident? Because "surgeon" implies human agency in a way "surgical team" (which includes residents) does not.
      *   *Better formulation:* **The "Nature of the Act" Test.** Did the deception/coercion change *what* was being done, or just *why* someone agreed to it?

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the difficulty. Validate that their confusion is a feature of the philosophy, not a bug in their thinking.
      *   **The Core Principle:** Propose "Informed Authorization of a Specific Act." Break it down into three necessary conditions.
      *   **Mapping the Cases (The Clause-by-Clause Note):** Go through their list and apply the principles. This shows *why* the principle works and where it bites back.
          *   *Crucial distinction:* The Research vs. Billing case. This hinges on "Therapeutic Misception" vs. "Collateral Inducement."
          *   *Crucial distinction:* Robot vs. Resident. This hinges on "Reasonable Expectation of Professional Norms."
      *   **The "Would You Have Said Yes" Fix:** Address the Pig Valve/Black Surgeon problem. Introduce the **Objective Materiality Standard**. Consent is invalid if a *reasonable person* would consider the information decisive regarding risk/nature, not if *this specific person* has idiosyncratic dealbreakers (unless known to the agent).
      *   **The Flip-Flopping Cases:**
          *   *Hypomanic:* Capacity is the key. If capacity was impaired, the "Yes" is void. Later ratification *can* work, but it's a new act of consent, not a repair.
          *   *Drunk Friend:* Same. Next morning text = New Consent.
      *   **The Philosophical Core:** Is there a unity? Yes. It's about **Moral Transformation.** Consent turns a violation into a gift. If the conditions (Capacity, Voluntariness, Information) aren't met, the moral transformation fails. It's not just a list of complaints; it's the mechanism that makes the act permissible.

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Correction on Alzheimer's:* The user says the letter should win. This is "Precedent Autonomy." I need to make sure the Capacity clause accounts for *prior* capacity binding *future* incapacity in specific contexts (like Ulysses contracts), whereas intoxication is temporary incapacity where we wait for sobriety.
      *   *Correction on Phase I Trial:* The user says "Not coercion but not fine." This is **Exploitation.** I need to distinguish Coercion (will overborne) from Exploitation (unfair advantage). Consent can be valid but exploitative. This is a crucial distinction for a journalist.
      *   *Correction on Research vs. Billing:* Why is lying about the study goal worse? Because it violates the *purpose* of the interaction. In clinical care, the purpose is health. In research, the purpose is knowledge. If you lie about the purpose, you change the act. Billing is incidental.

  6.  **Final Polish:**
      *   Ensure the tone is respectful of the journalist's intelligence.
      *   Make the principles "tight" as requested.
      *   Check that all specific cases are addressed.
      *   Ensure the conclusion answers the "Is there a core?" question definitively.

  7.  **Final Review against constraints:**
      *   Tight principle? Yes (Capacity, Voluntariness, Material Information).
      *   Clause-by-clause notes? Yes.
      *   Flip-flopping cases addressed? Yes.
      *   Core question answered? Yes.

  *(Self-Correction on the "Black Surgeon/Pig Valve" issue)*: This is the trickiest. If I say "Objective Materiality," does that invalidate the patient's right to choose? Actually, in law/ethics, if a provider *knows* a specific fact is a dealbreaker for a patient, withholding it invalidates consent. The "Objective" test is for when the provider *doesn't know*. I need to nuance this: **Subjective Materiality if Known, Objective if Unknown.**

  *(Refining the Robot vs. Resident)*: Why is Resident okay? Because medical training norms are public knowledge. "Surgeon" implies "Attending + Team." "Robot-assisted" implies "Surgeon controls robot." If the robot acts alone, that's a different procedure (Automated Surgery). This is about **Reasonable Expectations based on Social/Professional Norms.**

