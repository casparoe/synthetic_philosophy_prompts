  # Joint Statement on Origin Essentialism and Personal Identity
  **Collaborators:** Party A (Token-Gamete Origin Essentialism) and Party B (Trajectory-Class Origin Essentialism)

  ## Part I: Agreed Claims

  1.  **Formal Structure of Origin Essentialism:** Both parties agree that origin essentialism is a modal thesis restricting the set of possible worlds in which a specific individual exists. It asserts that certain historical facts about an individual's beginning are necessary conditions for their identity, not merely contingent properties. Both parties reject the view that origin essentialism is solely about linguistic convention; it is a claim about metaphysical dependence.
  2.  **Ambiguity of Modal Intuition:** Both parties acknowledge that the pre-theoretical intuition "I could not have come from different parents" tracks a real metaphysical constraint but is ambiguous regarding *what* about the parents matters. The intuition confirms that identity is anchored in the past, but it does not self-evidently distinguish between the *material source* (the specific gametes) and the *causal-process source* (the specific developmental pattern initiated by the parents).
  3.  **Biological Realism:** Both parties accept that fertilization, zygotic genome activation (ZGA), and early epigenetic marking are physical processes subject to contingency. Neither party treats the zygote as a metaphysical atom; both acknowledge that biological continuity can be disrupted, branched, or theoretically replicated without logical contradiction, even if such events are empirically rare or impossible in the actual world.
  4.  **Limitations of Psychological Continuity:** Both parties agree that standard psychological-continuity criteria fail to secure unique identity in fission cases (e.g., brain bisection). These counterexamples demonstrate that continuity alone cannot rule out branching. Consequently, both parties agree that an origin-based constraint is required to individuate persons, rejecting the view that origin is irrelevant to identity.

  ## Part II: Disagreements Table

  | Issue | Party A's Formulation (Token-Gamete Essentialism) | Party B's Formulation (Trajectory-Class Essentialism) |
  | :--- | :--- | :--- |
  | **(i) Proper Essential Origin** | The specific token sperm and egg that actually fused are metaphysically necessary. In any world where I exist, those very gametes (or their immediate causal continuants prior to fusion) must initiate my existence. | The specific developmental-trajectory class (defined by a genetic-environmental interaction profile and continuous causal path) is metaphysically necessary. Token gametes are contingent vehicles that typically instantiate this trajectory. |
  | **(ii) Epigenetic Contingency** | Epigenetic markers established post-fertilization are properties of the organism, not constituents of its origin identity. Variations in early epigenetic marking do not alter *who* exists, provided the gametic source is identical. | Epigenetic marking at the zygotic stage is constitutive of the developmental trajectory. Significant divergence in early epigenetic profiles constitutes a divergence in trajectory class, potentially yielding a numerically different person even from the same gametes. |
  | **(iii) Counterfactual "Different Parents"** | The proposition "I could have been born from different gametes" is metaphysically impossible. A person originating from different gametes is, by definition, a different person, regardless of phenotypic or psychological similarity. | The proposition "I could have been born from different gametes" is metaphysically possible but empirically improbable. If different gametes could be engineered to instantiate my exact developmental-trajectory class, the resulting individual would be me. |

  ## Part III: Cruxes and Predictions

  We identify two sub-questions where empirical or theoretical resolution would significantly shift the dialectical burden. For each crux, we specify the concrete case, the agreed relevance, and our explicit divergent predictions.

  ### Crux 1: Epigenetic Divergence and Individuation
  **The Question:** Is an organism with identical nuclear DNA but divergent epigenetic markers at implantation the same person or a trajectory-branch?
  **Relevant Case:** Monozygotic twinning and artificial embryo splitting. Both parties agree these cases test the relationship between shared biological starting points and individuation.
  *   **Party A Prediction:** Splitting produces two new individuals who share a single essential origin (the token gametes). The gametes fix the identity of the *starting entity*, but individuation occurs later. Therefore, the twins share an origin but are distinct persons.
  *   **Party B Prediction:** Identity tracks the trajectory. Divergence at splitting initiates two distinct developmental trajectories. Therefore, the splitting event marks the point where one potential person becomes two distinct persons because the trajectory class bifurcates. The "origin" (trajectory) is not shared; only the pre-trajectory material cause is shared.

  ### Crux 2: Synthetic Reconstruction and Identity
  **The Question:** Does a synthetically reconstructed developmental trajectory initiated by different gametes but matching the original profile preserve identity?
  **Relevant Case:** Synthetic gamete derivation and *in vitro* trajectory replication. Both parties agree that if technology allowed the precise replication of the causal-developmental path using distinct biological material, this would test the necessity of the token gametes.
  *   **Party A Prediction:** Reconstructed trajectories from different gametes necessarily produce a different person. The specific material history (the token gametes) is non-fungible. Even a perfect qualitative duplicate is a numerically distinct individual.
  *   **Party B Prediction:** Identity is preserved if and only if the trajectory class is fully replicated. If the causal-developmental path, including epigenetic profiles and environmental interactions, is identical, the token gametes are irrelevant. The resulting individual is numerically identical to the original.

  ## Part IV: Joint Assessment

  **Is the dispute verbal?**
  Part of the dispute is verbal, specifically regarding the denotation of the term "origin."
  *   **Verbal Collapse:** If "origin" is defined strictly as "the material cause initiating existence," Party B's position appears to deny origin essentialism, but only verbally. Party B accepts essentialism about the *process* of initiation. If "origin" is defined as "the necessary causal antecedent profile," Party A's position appears to conflate the profile with the material.
  *   **Residual Substantive Disagreement:** Once terminology is fixed, a substantive metaphysical disagreement remains regarding the **supervenience base of identity**.
      *   Party A holds that identity supervenes on **historical material particularity**. (Haecceity of the gametes matters).
      *   Party B holds that identity supervenes on **causal-structural isomorphism**. (Pattern of development matters).

  This residual disagreement is not verbal. It yields different truth values for the counterfactuals in Crux 2. Party A asserts that two qualitatively identical organisms with different material histories are numerically distinct. Party B asserts they are numerically identical. This is a substantive disagreement about the nature of trans-world identity and whether persons are substance-sortals tied to matter or process-sortals tied to form.
