  **Exam Question: Geometric Constraints on Log-Optimal Growth**

  Consider an agent operating on a statistical manifold $\mathcal{M}$ of belief states parameterized by $\theta \in \mathbb{R}^k$, equipped with the Fisher-Rao metric $g_{ij}(\theta) = \mathbb{E}[\partial_i \ell \partial_j \ell]$. The agent faces two simultaneous wagers, $W_1$ and $W_2$, whose payoff distributions $P(x|\theta)$ share the same underlying parameter $\theta$, inducing non-zero off-diagonal terms in the Fisher Information matrix. Standard Kelly betting maximizes $\mathbb{E}[\log V_T]$ assuming independent probability assessments. However, if rational belief updating is constrained to follow geodesics on $\mathcal{M}$ to minimize informational displacement, the posterior estimate $\hat{\theta}$ deviates from the standard Maximum Likelihood Estimate due to manifold curvature.

  Construct a formal argument demonstrating how the geodesic constraint modifies the optimal Kelly fraction $f^*$ when the wagers are coupled via $\theta$. Specifically: (1) Define the geodesic condition for the belief update; (2) Show where the independence assumption fails in the metric tensor; (3) Derive the deviation in $f^*$; and (4) Conclude whether this deviation represents a failure of the Kelly criterion or a necessary correction for geometric consistency.

  ***

  **Model Answer**

  To resolve the tension between Kelly betting and geometric rationality, we must treat the probability estimates not as static scalars but as coordinates on a curved manifold. The Fisher-Rao metric defines the local geometry of belief space, where the distance between two belief states $P_{\theta}$ and $P_{\theta + d\theta}$ is $ds^2 = g_{ij}(\theta)d\theta^i d\theta^j$. Here, $g_{ij}$ is the Fisher Information Matrix (FIM). In a standard Kelly framework, the agent calculates optimal fractions $f^*$ based on current probabilities $p(\theta)$. However, if updating is a physical movement on $\mathcal{M}$, it must obey the geodesic equation to preserve geometric consistency:
  $$ \frac{d^2\theta^k}{dt^2} + \Gamma_{ij}^k \frac{d\theta^i}{dt} \frac{d\theta^j}{dt} = 0 $$
  where $\Gamma_{ij}^k$ are the Christoffel symbols of the second kind derived from $g_{ij}$.

  The independence assumption breaks precisely in the structure of $g_{ij}$. If $W_1$ and $W_2$ were independent, the joint likelihood would factorize, rendering the FIM diagonal ($g_{ij} = 0$ for $i \neq j$). However, because both wagers depend on a shared hidden parameter $\theta$, the likelihoods are coupled. This induces non-zero off-diagonal elements in the metric tensor, meaning the curvature of the manifold links the update direction of one wager to the other. Consequently, the Christoffel symbols $\Gamma_{ij}^k$ are non-zero, introducing a "drift" term in the belief update that standard Bayesian conditioning (which effectively assumes a flat Euclidean parameter space) ignores.

  This geometric drift alters the posterior estimate $\hat{\theta}_{geo}$ relative to the standard MLE $\hat{\theta}_{MLE}$. Since the Kelly fraction is a function of the probability estimate, $f^* = \arg\max \mathbb{E}[\log(1 + f \cdot X(\theta))]$, any shift in $\theta$ propagates to $f^*$. Specifically, in regions of high curvature (high information density variation), the geodesic update dampens the magnitude of the belief shift compared to the Euclidean update to avoid overshooting along the curved surface. Thus, $f^*_{geo} \approx f^*_{std} (1 - \mathcal{K})$, where $\mathcal{K}$ represents a curvature correction term derived from the scalar curvature of $\mathcal{M}$.

  Is this a failure of Kelly? No. The Kelly criterion is strictly optimal *given* accurate probabilities. The deviation arises because the standard application assumes probabilities are updated in a flat vacuum, ignoring the informational cost of moving belief states. The geometric approach reveals that "accurate probabilities" must account for the manifold structure connecting them. Therefore, the shift in fractions is not a failure of log-utility maximization, but a preservation of coherence. Ignoring the curvature leads to overbetting because the agent underestimates the volatility of their own belief updates. Geometric consistency ensures the agent respects the intrinsic uncertainty of the parameter space, making the modified Kelly fraction robust against model misspecification inherent in assuming independent updates.

  ***

  **Marking Scheme (Total 20 Points)**

  | Move | Points | Requirement | Common Botch |
  | :--- | :---: | :--- | :--- |
  | **1. Metric Identification** | 4 | Explicitly defines Fisher-Rao metric $g_{ij}$ as the Fisher Information Matrix. | Confusing Fisher-Rao with KL divergence or Euclidean distance. |
  | **2. Geodesic Condition** | 4 | Writes the geodesic equation involving Christoffel symbols $\Gamma_{ij}^k$. | Describing geodesics vaguely as "shortest paths" without the differential equation. |
  | **3. Independence Break** | 4 | Identifies that shared $\theta$ creates off-diagonal terms in $g_{ij}$ (non-diagonal metric). | Assuming shared parameters only affect likelihood, not the metric tensor structure. |
  | **4. Kelly Shift Derivation** | 4 | Shows logically that $\hat{\theta}_{geo} \neq \hat{\theta}_{MLE}$ leads to $f^*_{geo} \neq f^*_{std}$. | Asserting the fractions change without linking it to the parameter estimate shift. |
  | **5. Resolution** | 4 | Argues this is geometric consistency (input correction), not Kelly failure. | Concluding that Kelly is fundamentally flawed or requires a new utility function. |

  **Note to Graders:** Candidates typically botch Move 2 by treating the manifold as flat (ignoring $\Gamma$), and botch Move 5 by arguing for a new utility function rather than correcting the probability inputs.
