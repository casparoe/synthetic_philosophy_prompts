  **MEMORANDUM**

  **TO:** Committee on Commemoration
  **FROM:** Junior Member
  **DATE:** March 1
  **RE:** Precedent Analysis and Recommended Dispositions: The Kellerman Petition

  Per our discussion, I have analyzed the Kellerman petition against our six-year record. Below are the reconstructed principles underlying our precedents, the analogical reasoning for this case, the recommended verdicts, and the critical variables required to finalize our reasoning.

  ### I. Reconstructed Principles

  Our precedents do not follow a single moral calculus. Instead, they oscillate between two distinct rules that are individually consistent with our record but yield opposing results in complex cases like Kellerman's.

  **Rule 1: The Principle of Irreplaceable Contribution**
  *Statement:* An honor is retained if the individual's contribution is foundational to the institution's function or identity, provided the contribution itself remains intellectually or practically valid. Wrongdoing is managed through contextualization or relocation of personal iconography, not erasure of the name.
  *Precedents:* **Jefferson** (Founder/Authorship), **Churchill** (Opposed greater evil/Not replaceable), **Vandeventer** (Library infrastructure), **Vane** (Poems separable from politics), **Geneticist** (Redemptive action), **Prynne** (Index retained as functional tool).
  *Prediction for Kellerman:*
  *   **Name:** Retain (Institute is foundational/functional).
  *   **Bust:** Relocate (Personal iconography contextualized, per Jefferson).
  *   **Remains:** Retain for research (Functional utility of the collection).
  *   **Fund:** Retain (Functional benefit).

  **Rule 2: The Principle of Complicit Harm**
  *Statement:* An honor is removed or redirected if the individual's wrongdoing involved direct violation of human dignity that was contestable at the time, and the honor implies moral endorsement. Specific benefits derived from harm must be redirected to the harmed class.
  *Precedents:* **Columbus** (Cruelty known at time), **Prynne** (School name removed/Honor not owed), **Vandeventer** (Scholarship renamed for victim).
  *Prediction for Kellerman:*
  *   **Name:** Remove (Grave robbing is dignity violation; church petitions prove it was contestable).
  *   **Bust:** Remove (Personal honor not owed).
  *   **Remains:** Repatriate (Restorative justice over legal minimums).
  *   **Fund:** Retain/Expand (Benefit goes to the aggrieved class, per Vandeventer).

  ### II. Closest Analog

  **Dr. Elias Prynne** is the closest analog.

  Like Kellerman, Prynne was a scientist whose professional advancement relied on methods now considered human rights violations (sterilization statutes vs. grave desecration). Like Kellerman, Prynne's "tools" (the Index/the Comparative Framework) remain in use, but his institutional honors (the School/the Institute) are implicated in the harm.

  **What turns on this choice:**
  Choosing Prynne over **Columbus** or **Vandeventer** is critical. Columbus and Vandeventer represent "pure" harm scenarios where the public benefit (holiday/library) did not outweigh the moral cost of the honor. Prynne represents a "split" scenario where the Committee distinguished between the *utility* of the work (Index kept) and the *honor* of the position (School name removed).
  If we follow Prynne, we are licensed to keep the Institute's research framework while stripping Kellerman's name from the building. If we follow Columbus, the "known cruelty" of grave robbing mandates total removal regardless of scientific utility. Given our tendency toward compromise (Jefferson, Vandeventer Library), Prynne is the stronger fit for our institutional culture.

  ### III. Recommended Verdicts

  To maintain coherence with our record, specifically the Prynne and Jefferson compromises, I recommend the following split dispositions. Where precedent underdetermines the outcome, I have noted the new principle we would be adopting.

  **1. Name on the Institute and Professorship: Retain with Permanent Contextualizing Installation.**
  *Reasoning:* Following **Jefferson** and **Vandeventer (Library)**, we retain names on foundational infrastructure where the function remains vital. However, following **Prynne**, we acknowledge the honor is not fully "owed." Unlike Prynne, we do not remove the name because the **Geneticist** precedent allows redemptive action (anti-racism/Native fund) to mitigate the sin.
  *New Principle:* **Mitigated Foundationalism.** A founder's name may remain on a functional unit if their later redemptive acts directly address the class harmed by their foundational methods.

  **2. Bust in the Lobby: Relocate out of Prominent Space.**
  *Reasoning:* Direct application of **Jefferson**. A bust is a personal honor, not an institutional identifier. It should be moved to a courtyard or archive with an installation explaining the complexity of his legacy.

  **3. The Remains: Repatriate Identifiable Remains; Retain Unidentifiable under Strict Protocol.**
  *Reasoning:* For the identifiable remains, we follow **Columbus** and **Prynne**: the moral duty exceeds the legal minimum. The fact that statutes do not reach them is irrelevant to our honorific standards. For the unidentifiable third, we follow **Rule 1 (Utility)**: if they cannot be returned to a community, they serve the public good in research.
  *New Principle:* **Restorative Jurisdiction.** The Committee claims moral jurisdiction over remains where legal jurisdiction ends, prioritizing repatriation where community ties exist.

  **4. The Fund: Retain and Publicize.**
  *Reasoning:* Following **Vandeventer (Scholarship)** and the **Geneticist**. The fund benefits the very group Kellerman harmed (Native Americans). Renaming it might erase the history of restitution; retaining it highlights the complex legacy.
  *New Principle:* **Beneficiary Primacy.** If an endowment directly benefits the descendants of those harmed by the benefactor, the name may remain as a record of restitution.

  ### IV. The Separating Fact

  To resolve the tension between Rule 1 (Utility) and Rule 2 (Harm) regarding the Institute Name, the Committee should seek the following information:

  **The single hypothetical variant:** *Would the Native American students currently supported by the Kellerman Fund prefer the name be removed?*

  *   **Why this separates the rules:**
      *   **Rule 1 (Utility)** holds that the scientific value of the Institute and the legal constraint of the deed are paramount; the beneficiaries' opinion is secondary to institutional continuity.
      *   **Rule 2 (Complicit Harm)** holds that the dignity of the harmed group is paramount; if the beneficiaries feel the name perpetuates trauma, the honor must be removed regardless of utility or legal threat.
      *   *Current Status:* This fact is unknown. Our precedent (Vandeventer) renamed the scholarship *for* a striker, but did not poll the immigrant children. Our precedent (Prynne) removed the school name without reference to sterilization victims' opinions. Asking this question forces us to decide if "Restorative Justice" means *giving money* (Vandeventer) or *ceding authority* (New Principle).

  ### V. The Deed of Gift

  The deed-of-gift clause should be treated strictly as a **constraint on implementation, not a justification for honor.**

  In our written reason, we must not say, "We retain the name because the deed requires it." This contradicts **Prynne**, where we removed a school name despite the likely prestige attached to the donor, and **Columbus**, where we acted despite tradition.
  Instead, the reasoning should read: "While the Committee finds the moral grounds for removal compelling under the Principle of Complicit Harm, we are legally constrained by the deed of gift from executing a name change without risking the reversion of the Institute's assets."
  This preserves our moral standing (we agree with the petitioners) while acknowledging our limited power (we cannot destroy the Institute). It aligns with **Prynne's** logic regarding the Index ("not ours to rename"), distinguishing between what we *would* do and what we *can* do.
