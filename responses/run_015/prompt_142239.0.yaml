answer: |-
  Here is the translation of the Everettian probability problem into your native vocabulary, followed by the residue report on your two specific intuitions.

  ### 1. The Decision-Theoretic Derivations (Deutsch-Wallace)
  **Translation:** This is structurally a Savage-style representation theorem. You have a set of "acts" (unitary transformations), a set of "consequences" (payoffs to descendants), and a preference ordering $\succeq$ over acts. The theorem proves that if $\succeq$ satisfies certain axioms (Ordering, Diachronic Consistency, Branching Indifference), there exists a unique probability measure $P$ and utility function $U$ such that the agent maximizes $\mathbb{E}_P[U]$.

  **The Machinery:**
  *   **State Space:** The Hilbert space subspaces orthogonal to each other.
  *   **The "Fudge":** In Savage, states are mutually exclusive truths; only one obtains. In Everett, all orthogonal components obtain. The axioms must therefore force the agent to treat *ontologically co-existing* states as *decision-theoretically exclusive*.
  *   **The Load-Bearing Axiom:** "Branching Indifference" (or equivalents like "Equivalence"). This axiom states that an agent should be indifferent to a process that splits a branch into two with equal amplitude but identical payoffs, provided the total amplitude is conserved.
  *   **The Gap:** This axiom effectively stipulates that the *number* of branches is irrelevant, and only the *Hilbert space norm* matters. It rules out "branch counting" strategies by fiat. It is not deriving the measure from the dynamics; it is deriving the measure from a constraint on rational preferences that implicitly assumes the Hilbert norm is the only invariant quantity worthy of tracking.
  *   **Verdict:** It is a representation theorem, but the "probability measure" it derives is a measure of *preference weight*, not frequency or ontology. It shows that *if* you care about branches in a way consistent with the Hilbert space geometry, you must use Born weights. It does not prove you *must* care that way.

  ### 2. The Envariance / Symmetry Derivations (Zurek)
  **Translation:** This is an invariance argument under a group action, coupled with a fine-graining limit.
  *   **Equal Amplitudes:** If the state is $\frac{1}{\sqrt{2}}(|0\rangle|E_0\rangle + |1\rangle|E_1\rangle)$, a swap unitary on the system can be undone by a swap on the environment. The global state is invariant. By a Principle of Insufficient Reason (applied to the symmetry), $P(0) = P(1)$.
  *   **Unequal Amplitudes:** You embed the system in a larger tensor product space to "fine-grain" the amplitudes into rational ratios (e.g., $\sqrt{3/4}$ becomes 3 equal sub-branches vs 1).

  **The Machinery:**
  *   **Exchangeability:** The symmetry argument is essentially exchangeability of the entangled pairs.
  *   **The "Fudge":** The fine-graining step assumes **infinite divisibility / atomlessness**. It assumes you can always decompose a branch of weight $w$ into $N$ branches of weight $w/N$ without changing the physics of the original branch.
  *   **The Gap:** This assumes additivity of the measure *before* you have derived it. It assumes that a subspace of dimension $N$ is equivalent to $N$ copies of a dimension-1 subspace. This is effectively assuming the measure is defined on *subspaces* (Gleason-style) rather than on discrete "worlds." If the fundamental ontology is discrete branches, fine-graining is a fiction. If the ontology is the wavefunction, fine-graining is valid, but then "probability" is just a property of the vector geometry, not a guide to uncertainty.
  *   **Verdict:** It derives the Born rule as the unique measure consistent with unitary symmetry, but only if you accept that "probability" must be a function of the subspace geometry rather than a count of outcomes.

  ### 3. The Self-Locating Credence Arguments (Vaidman, Sebens-Carroll)
  **Translation:** This treats the post-measurement, pre-observation agent as having indexical uncertainty. The agent knows the universal state $\Psi$, but is uncertain about the index $i$ in "I am the successor on branch $i$."

  **The Machinery:**
  *   **Conditional Independence:** You are modeling $P(\text{I am on branch } i \mid \Psi)$.
  *   **The "Fudge":** The Prior. To get the Born rule, you must assign a prior over indexical locations proportional to $|\alpha_i|^2$.
  *   **The Gap:** Why this prior? A standard Principle of Indifference would assign equal probability to each distinct successor (branch counting). To get Born, you must assume that the "density of selves" is proportional to amplitude squared. This treats the amplitude not as a coefficient, but as a *measure of existence* or *observer density*.
  *   **Verdict:** This is a modeling choice (a prior assumption), not a derivation. It shifts the problem from "Why probability?" to "Why is my indexical prior weighted by the Hilbert norm?" It assumes the conclusion in the specification of the credence function.

  ### 4. The Typicality / Frequentist Route (Hartle, Farhi-Gutmann)
  **Translation:** This is a Law of Large Numbers (LLN) / Large Deviation argument on the space of infinite histories.
  *   **The Argument:** Consider the infinite tensor product of the state. The norm of the component of the state vector where relative frequencies deviate from $|\alpha_i|^2$ goes to zero as $N \to \infty$.
  *   **The Machinery:** Sanov-type estimates. The "bad" set of histories has measure zero in the Hilbert space norm.

  **The Machinery:**
  *   **The "Fudge":** Conflating **Measure Zero** with **Probability Zero**. In standard measure-theoretic probability, measure zero events "do not happen." In Everett, measure zero components *still exist* as part of the universal wavefunction.
  *   **The Gap:** The LLN shows that Born-rule histories are *typical* with respect to the Hilbert norm. It does not show that an agent should *expect* to find themselves on a typical history. You need a bridge principle: "I should expect to be on a history that is typical with respect to the Hilbert norm." Without that, this is just a statement about the geometry of the state vector, not about agent expectations.
  *   **Verdict:** It proves the Born rule is the *typical* measure, but fails to connect typicality to credence or decision. It's an LLN without a link to the decision rule.

  ### 5. The Skeptical / Shrugging Responses
  **Translation:** This is a claim of **Non-Identifiability**.
  *   **The Argument:** The dynamical data (unitary evolution) does not uniquely identify the parameter $p$ (probability/weight).
  *   **The Machinery:** The mapping from State $\to$ Decision Weight is underdetermined. The loss function $L(\text{action}, \text{outcome})$ is undefined because "outcome" is a set of all branches, not a singleton.
  *   **The Gap:** None. This position asserts that the translation *fails*. It claims that without an extra postulate (e.g., "Caring Measure = Squared Amplitude"), the model is incomplete.
  *   **Verdict:** In your terms, this is the claim that the Radon-Nikodym derivative of "Concern" with respect to "Branch Count" is not fixed by the physics. It is a free parameter.

  ---

  ### Residue Report

  #### On Your First Idea: Refinement Invariance & Additivity
  You are correct that this bottoms out in **Non-Contextuality** (Gleason's Theorem territory).
  *   **The Structure:** Requiring that weight be additive over orthogonal sub-branches ($w(A \cup B) = w(A) + w(B)$ for orthogonal $A, B$) and invariant under unitary rotation is essentially the premise of Gleason's Theorem.
  *   **The Concession:** An Everettian who grants this is conceding the interesting part of the debate. The "Branch Counter" argues that the fundamental ontology is discrete successors, not continuous subspaces. They deny additivity over *amplitude* and assert additivity over *count*.
  *   **The Verdict:** Refinement invariance assumes that splitting a branch does not create "more existence." This is exactly what is at issue. If you assume the weight is an additive *amount* of something (measure) rather than a *number* of things (count), you have already assumed the Born rule is the relevant metric. You are right: it is not a derivation from pure bookkeeping; it is a constraint on what kind of bookkeeping is permitted. It rules out the rival hypothesis by definition.

  #### On Your Second Idea: Scoring Rule Aggregation
  You have identified the core of the problem. The "Aggregation Functional" *is* the probability measure in disguise.
  *   **The Structure:** In standard scoring rules, $S(p, x)$ is evaluated at the *actual* outcome $x$. In Everett, the outcome is the vector of all payoffs $\vec{x} = (x_1, x_2, \dots)$. You need a functional $\Phi(\vec{x})$ to aggregate utility across descendants.
  *   **The Gap:** If $\Phi(\vec{x}) = \sum x_i$ (unweighted sum), you get Branch Counting. If $\Phi(\vec{x}) = \sum |\alpha_i|^2 x_i$ (Born-weighted sum), you get Born. If $\Phi(\vec{x}) = \min(x_i)$, you get Max-Min.
  *   **The "10^-9 Branch" Case:** Nothing in the formalism settles the case where a low-amplitude branch splits prolifically.
      *   **Measure says:** Ignore it (weight $\approx 10^{-9}$).
      *   **Count says:** Worry about it (if it splits into $10^{100}$ copies, they dominate the sum).
      *   **Resolution:** There is no mathematical resolution. The choice of aggregation functional $\Phi$ is a **normative claim** about how much you care about your descendants.
  *   **The Verdict:** The aggregation question *is* the whole problem in disguise. Your vocabulary isn't missing anything real; the "measure of existence" is a placeholder for "how much I care."
      *   If you define "Probability" as "That which guides my decisions," then the Born rule is true *only if* you decide to aggregate utilities using the Hilbert norm.
      *   If you define "Probability" as "Frequency of outcomes," the Born rule is true *only if* you define frequency relative to the Hilbert norm rather than branch count.
      *   **Conclusion:** The "Caring Measure" is a primitive. You cannot derive the Radon-Nikodym derivative of Concern with respect to Branch Count from the Unitary Dynamics alone. The dynamics give you the branches and the amplitudes; they do not tell you which one maps to your utility function. To say they do is to sneak the aggregation functional into the premises (as seen in the Decision-Theoretic axioms).

  **Summary:** Your friend's "change of measure" comment is glib because it ignores the Radon-Nikodym derivative. In standard finance, you change measure (e.g., physical to risk-neutral) based on market prices (no-arbitrage). In Everett, there is no "market" of branches trading against each other to fix the price of probability. The derivative $d\mathbb{P}_{\text{Born}} / d\mathbb{P}_{\text{Count}}$ is not pinned down by the data (the wavefunction). It must be imposed by the agent's preference structure. Your skepticism is mathematically warranted.
