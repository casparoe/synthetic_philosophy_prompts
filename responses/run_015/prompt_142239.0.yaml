at does it look like in my terms? Is (1) genuinely a representation theorem of the Savage kind, and if so what is playing the role of the fact that normally only one payoff is realized? Is (2) an exchangeability or invariance argument plus an infinite-divisibility / atomlessness assumption, and how much of the work is that second bit doing? Is (3) a conditional-independence assumption of the sort I'd normally treat as a free modeling choice rather than a constraint? Is (4) just a law of large numbers, and is the gap between an LLN and a decision rule the reason I find it unsatisfying? Is (5) a claim of the form "the parameter isn't identified by the data" or "the loss function isn't pinned down"? Please mark explicitly where the translation only goes through if you fudge something, and please don't quietly put amplitude-squared in as a premise and then present the result as a translation.

  Two things of my own are really why I'm writing, because I can't tell whether they're original, already in the literature, or confused. First: I tried to get the weights out of pure bookkeeping, by requiring that the weight attached to a branch be invariant under refinement — splitting a branch further shouldn't change its weight, and the weight of a branch should be the sum of its sub-branches' weights. That definately kills the obvious rival rule I came up with (count the branches whose amplitude exceeds some threshold and renormalize), since that rule is sensitive to the threshold and to which basis you do the counting in. But refinement invariance looks to me like it assumes the very thing at issue: that what matters is an additive *amount* of something, rather than a number of distinct successors. It also feels like it's one step away from Gleason's theorem, in which case the load-bearing assumption is non-contextuality. Am I right about where it bottoms out, and is an Everettian entitled to that assumption, or does granting it concede the interesting part of the debate? Second: I can't work out who the forecast is scored against. In my world a probability forecast is a measure and it gets graded by a proper scoring rule against the outcome that actually happens; here every outcome happens to some descendant, so the tempting move is to aggregate the scores incurred by all the descendants — but the aggregation functional (Born-weighted average? unweighted average over copies? worst case?) seems to just encode whichever answer you wanted, and nothing in my scoring-rule framework says which aggregator is correct. A case that makes this vivid for me: a branch of Born weight around 10^-9 that, a few minutes later, branches far more prolifically than the fat branches, so it ends up containing vastly more observers by count — measure says ignore it, counting says worry about it. Does anything settle that case, or is it stipulated? In the residue report I'd like your