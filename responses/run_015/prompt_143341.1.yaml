prompt: |-
  Hey, I'm on the student committee that runs our school's debate invitational and we have to settle something before the March tournament. Last year a team from Germany kept using 'liberal' and 'liberalism' in the European sense — free markets, small state, suspicion of government telling people how to live — and our judges, who are all American, scored them as if they'd meant the American sense (welfare state, culturally left, more regulation). They dropped two rounds over it and complained, and half the committee thinks the judges were right anyway since it's an American tournament.

  One member wants to just ban the word and make people name the actual policy instead ('single-payer', 'scrap rent control', whatever). I half like that, but I think the word also does something a policy list doesn't: it points at a stance about why coercion needs justifying at all — roughly, that the state should stay neutral between people's different ideas of a good life — and that stance is the bit both sides of the Atlantic still share even though their policy bundles have basically flipped.

  Could you draft the one-page memo I'll send the committee recommending what we should actually do? I'm leaning toward a rule where anyone using the word has to declare which sense they mean in their first minute, and judges get told to penalize the listener's confusion rather than the speaker's, but argue it properly and deal honestly with the strongest thing on the other side — I think it's that baking a declared sense into the rules freezes one contested definition and quietly punishes anyone whose real argument is that the term is a mess. Needs a concrete bottom line and a date it kicks in.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** Student committee member for a school debate invitational.
      *   **Recipient:** The rest of the debate committee.
      *   **Context:** A conflict arose at last year's March tournament. A German team used "liberal/liberalism" in the European sense (classical liberalism: free markets, small state). American judges interpreted it in the American sense (modern liberalism: welfare state, regulation). The German team lost rounds and complained.
      *   **The Conflict:** Half the committee thinks judges were right (it's an American tournament). One member wants to ban the word entirely (force specific policy names). The sender (user) wants a middle ground: require speakers to define their usage early, and penalize listener confusion rather than speaker ambiguity, *but* acknowledges the counter-argument (that defining it too rigidly freezes a contested concept).
      *   **Goal:** Draft a one-page memo recommending a specific rule change.
      *   **Key Requirements:**
          *   Argue properly for the recommended approach.
          *   Deal honestly with the strongest counter-argument (the "freezing definitions" objection).
          *   Include a concrete bottom line (the rule).
          *   Include a kick-in date (before March).
          *   Tone: Professional, persuasive, nuanced, suitable for a student committee.

  2.  **Determine the Stance/Recommendation:**
      *   The user is leaning toward: *Require declaration of sense in the first minute + Judge instruction to penalize listener confusion (failure to adapt) rather than speaker ambiguity, provided the definition is clear.*
      *   However, the user also wants to acknowledge the "ban the word" argument's strength (that definitions are messy).
      *   *Decision:* The memo should recommend the "Define Early + Judge Adaptation" model. It preserves the philosophical utility of the term (as the user noted) while solving the communication breakdown. It rejects the "Ban" model as too restrictive and the "Status Quo" model as unfair.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Address the incident from last year without assigning blame, focusing on the structural issue.
      *   **The Problem:** Explain *why* this happened (transatlantic semantic divergence) and why it matters (fairness vs. educational value).
      *   **Options Considered:**
          1.  Status Quo (Unfair to non-US teams).
          2.  Total Ban (Loses philosophical nuance, hard to enforce).
          3.  Mandatory Definition + Judge Instruction (The Recommendation).
      *   **The Recommendation (The "Bottom Line"):** Be specific. "First constructive speech," "explicit definition," "judge burden."
      *   **Addressing the Counter-Argument:** The user specifically mentioned the risk of "freezing a contested definition." I need to articulate this well. The counter is that forcing a definition pretends the word *has* a stable meaning when it doesn't. The rebuttal is that debate requires shared terminology to function, and transparency solves the confusion without dictating truth.
      *   **Implementation:** Timeline (needs to be before March). Let's say February 1st for rule release, effective for the March tournament.
      *   **Closing:** Call to action (vote/approve).

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *User's specific point:* "The word points at a stance about why coercion needs justifying... state neutrality." I need to make sure this philosophical insight is reflected in the argument for *keeping* the word.
      *   *User's specific point on judging:* "Penalize the listener's confusion rather than the speaker's." This is tricky. In debate, if the speaker is unclear, they usually lose. The user wants to shift the burden: If the speaker defines it, the *judge/listener* must accept that definition for the round. If the judge penalizes because *they* are confused by the foreign definition, that's judge error.
      *   *Correction:* Actually, in debate terms, if a speaker defines a term, the opponent must engage with that definition. If the judge penalizes the speaker because the judge *themselves* misunderstood, that's a judge training issue. The rule should be: Speaker defines -> Opponent must engage -> Judge evaluates based on that definition.
      *   *Refining the "Counter-Argument":* The committee member who wants to ban the word argues that specific policies are clearer. The strongest version of this (as the user noted) is that forcing a definition "freezes one contested definition." I need to explain why my proposal avoids this. *Answer:* It doesn't freeze *one* definition (European OR American); it allows *either*, provided it is declared. It freezes the *process*, not the *meaning*.

  5.  **Drafting the Content (Iterative Process):**
      *   *Tone:* Collaborative but decisive.
      *   *Length:* Keep it tight (one page approx. 400-500 words).
      *   *Date:* Needs to be current (let's use today's date or generic). Let's use a generic "February 1, 2024" style for the draft so they can fill it in.
      *   *Kick-in:* March Tournament.

  6.  **Final Review against Constraints:**
      *   One-page memo? Yes.
      *   Recommend what to do? Yes (Define Early + Judge Instruction).
      *   Deal honestly with strongest counter-argument? Yes (The "freezing meaning" objection).
      *   Concrete bottom line? Yes.
      *   Date? Yes.

  7.  **Final Polish:** Check for clarity and persuasion. Ensure the distinction between "American" and "European" liberalism is clear but brief. Ensure the philosophical value of the term is highlighted. (Self-correction: Make sure the instruction to judges is clear—they shouldn't penalize a team for using a valid definition just because it's unfamiliar).

  8.  *(Final thought on the "Penalize Listener" point)*: In debate, you can't really penalize a judge. You train them. So the recommendation should be "Judge Instruction: Do not penalize for unfamiliar definitions if declared." I will phrase it as "Judge Burden."

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Debate Invitational Committee
  **FROM:** [Your Name/Position]
  **DATE:** January 15, 2024
  **SUBJECT:** Proposal for Terminology Clarity Rule (Effective March Tournament)

  **Purpose**
  Following the adjudication issues at last year's March tournament regarding the use of "liberalism" by international teams, we must update our guidelines. The core conflict was semantic: European teams used the classical sense (free markets, state neutrality), while American judges applied the modern sense (welfare state, regulation). This resulted in unfair penalties for teams who were internally consistent but culturally divergent.

  **Options Considered**
  1.  **Status Quo:** Unfair. It privileges domestic teams and penalizes international participants for linguistic variance.
  2.  **Total Ban:** One member proposed banning the term entirely in favor of specific policy labels (e.g., "single-payer"). While this reduces ambiguity, it strips the term of its philosophical utility. "Liberalism" does more than list policies; it signals a stance on *why* coercion requires justification and argues for state neutrality between conceptions of the good life. Banning the word impoverishes the theoretical depth of the round.
  3.  **Mandatory Definition + Judge Instruction:** (Recommended).

  **Recommendation**
  We should adopt a **"Define Early"** rule. Any team using contested political terminology (specifically "liberal," "conservative," "socialist") must explicitly define their usage within the first minute of their First Constructive speech.

  **Judge Instruction:** Judges will be instructed that once a definition is declared, it stands for the round. Judges must evaluate arguments based on the *declared* definition, not their own preconceptions. Confusion is no longer a valid reason to lower speaker points; failure to engage with the declared definition is.

  **Addressing the Strongest Counter-Argument**
  The strongest objection to this proposal is that it "freezes" a contested definition. By forcing a team to choose between "American" or "European" liberalism, we risk implying the term has a stable meaning when it is inherently a mess. This quietly punishes teams whose actual argument is that the term *cannot* be disentangled from its contradictions.

  However, debate requires a shared operational language to function. Our goal is not to settle political theory but to ensure fair communication. This rule does not freeze *which* definition is used, only the *process* of disclosure. It allows a team to argue that "liberalism is incoherent," provided they first establish which incoherence they are tackling. Transparency solves the communication breakdown without dictating philosophical truth.

  **Bottom Line & Timeline**
  **Rule:** Contested political terminology must be defined in the first minute of the 1AC/1GOV. Failure to define allows the opponent to set the definition; failure to engage with a set definition is a voting issue.
  **Effective Date:** This rule will be published in the packet on **February 1, 2024**, and is mandatory for the **March Invitational**.

  Please review and vote by Friday. This ensures we train judges and notify teams in time.
