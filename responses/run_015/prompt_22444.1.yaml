answer: |-
  **Setting:** *A quiet corner of a university library. Two philosophy professors, ALEX and JORDAN, are taking a break from grading. Alex leans toward the traditional Just War Theory (Walzerian); Jordan specializes in revisionist just war theory (McMahanite). A high school student, SAM, sits nearby, listening intently.*

  **Alex:** You know, Sam, listening to you wrestle with this, I think the intuition behind the Moral Equality of Combatants is simpler than the revisionists give it credit for. It's about the separation of roles. The politician decides *whether* to fight; the soldier decides *how* to fight. Once a soldier is in uniform, they enter a specific moral sphere. They are instruments of the state, not free agents. If we tell them, "You are a murderer because your cause is unjust," we undermine the very rules that keep war from becoming total slaughter.

  **Jordan:** But Alex, that "specific moral sphere" is a fiction. War isn't a game with its own magic rules. It's a collection of individual acts of violence. If I attack you in the street because I mistakenly believe you owe me money, I don't gain a right to kill you just because I'm wearing a blue shirt and you're wearing red. If the cause is unjust, the combatants are essentially organized aggressors. They threaten innocent people. Why should the victim—who is defending their community—have the same moral standing as the person pointing the gun at them?

  **Alex:** Because the victim on the other side is also threatened! That's the "fair fight" argument. From the perspective of the individual in the trench, the person across the no-man's-land is trying to kill them. It doesn't matter if Kaiser Wilhelm or President Lincoln started it. The immediate threat is symmetrical. If you deny the unjust combatant the right to self-defense, you're saying they must simply lay down and die. That turns war into execution.

  **Jordan:** I'm not saying they must lay down and die. I'm saying their moral position is different. Let's look at your "fair fight." Imagine a conscript. He's drafted by an aggressive regime. He didn't choose the war. He's terrified. If he shoots at a soldier defending the invaded country, is he morally equal to the defender?

  **Alex:** In terms of *in bello* permissions, yes. He is coerced. He faces a firing squad if he deserts. He is as much a victim of his government as the people he is fighting are. To say he forfeits his moral standing is to punish him for a crime he didn't commit.

  **Jordan:** Here is where we need to be precise. I agree the conscript might not be *culpable*. He might not be blameworthy. But culpability isn't the same as liability. If a sleepwalker walks off a cliff and lands on you, crushing you, the sleepwalker isn't *blameworthy*. But they are still the source of the threat. The person underneath has a right to push them off to save themselves, even if the sleepwalker did nothing wrong. The unjust conscript is the sleepwalker. The just defender is the person underneath. The defender has a stronger claim to survival.

  **Alex:** But that ignores the epistemic reality. Most soldiers don't know the deep geopolitical truths. They are fed propaganda. They believe, in good faith, they are defending their homes. If moral standing depends on the objective justice of the cause, then moral standing becomes a matter of secret intelligence reports. A soldier can't know in the moment if they are the "aggressor."

  **Jordan:** That's a strong point, and McMahan accepts it to a degree. If a soldier is non-culpably ignorant—if they genuinely couldn't have known their cause was unjust—they are excused. They aren't villains. But Sam, notice the shift. Being *excused* isn't the same as being *morally equal*. It means we don't hate them. It doesn't mean they have a right to kill the person who *is* objectively defending a just cause. The just combatant fights with the authority of self-defense. The ignorant unjust combatant fights with a tragic excuse. Those aren't the same thing.

  **Alex:** But practically, how do you run an army on that distinction? If the law of war treats them differently, you get chaos. The Geneva Conventions treat prisoners of war equally. If we capture an enemy soldier, we don't put them on trial for "participating in an unjust war." We hold them until the conflict ends. That legal equality does moral work. It encourages surrender. It limits brutality. If the unjust side knows they will be treated as criminals, they fight to the last man.

  **Jordan:** I agree with the legal convention. I'm not arguing we should start putting POWs on trial. That would be a disaster. But we shouldn't confuse the *law* with the *morality*. The Geneva Conventions are a pragmatic bargain, a modus vivendi to reduce suffering. They are traffic rules for a zone of violence. But just because the law treats both drivers the same after a crash doesn't mean the driver who ran the red light is morally identical to the one who had the green.

  **Alex:** But if the pragmatic rule saves lives, isn't that a moral good? Walzer argues that the "War Convention" creates a community of risk. By accepting that I can be killed by you, and you by me, we acknowledge a shared humanity. If I say, "I am just, so I have a right to kill you, but you have no right to kill me," I've dehumanized you. I've turned you into a target, not an opponent. The equality of combatants preserves a shred of honor and reciprocity in a hellish situation.

  **Jordan:** I see the appeal of that reciprocity. But does it hold up when the injustice is extreme? Imagine the soldier fighting for a genocidal regime. He's ignorant, maybe he thinks he's "cleansing" the land. He's coerced, maybe. But he is participating in a massacre. If the defender kills him, it's self-defense. If the aggressor kills the defender, it's murder, even if he doesn't realize it. To say they are morally equal flattens the distinction between protection and destruction. It suggests that the value of the cause doesn't filter down to the individual rifleman.

  **Alex:** It doesn't flatten the distinction. It isolates it. We judge the leaders for *jus ad bellum*. We judge the soldiers for *jus in bello*. If the genocidal soldier shoots civilians, we prosecute him. That's where the morality lives. But if he shoots at a uniformed soldier on the front line, he is engaging in a legitimate act of war. Why? Because the soldier on the other side is also armed, also dangerous, and also representing a state that has chosen violence. The moment both sides mobilize, they enter a state of symmetric threat.

  **Jordan:** But the "symmetric threat" is only physical, not moral. Look, let's bring it back to Sam's essay. The core tension is this: Do we want a theory of war that reflects deep moral truth, or one that manages the horrors of war effectively?

  **Alex:** I'm arguing they aren't mutually exclusive. A theory that demands soldiers be philosophers is ineffective, and an ineffective theory leads to more death. The Moral Equality of Combatants protects the individual from the burden of judging the state. It says, "You serve, you follow the rules of engagement, you are honorable." That allows for the possibility of peace afterwards. If we brand an entire generation of enemy soldiers as moral wrongdoers, how do we ever reconcile?

  **Jordan:** And I'm arguing that a theory that ignores deep moral truth risks legitimizing evil. If we tell soldiers, "Your cause doesn't matter for your moral standing," we make it too easy to fight unjust wars. We remove a layer of moral friction. If soldiers understood that fighting for an unjust cause stripped them of their moral shield—that they were, in a deep sense, liable to be stopped—it might make them hesitate. It might make war harder to start.

  **Alex:** Or it might make them fight dirtier. If I believe I'm fighting a "wrongdoer" who has no right to be here, I'm less likely to take him prisoner. I'm more likely to shoot the wounded. The belief in moral inequality fuels atrocity. The belief in moral equality—the idea that we are both just men doing a dirty job because our governments told us to—that fuels restraint.

  **Jordan:** That's the crux, isn't it? Is the "Moral Equality" a truth, or is it a noble lie?

  **Alex:** I'd say it's a constructed moral reality. We *make* it true by agreeing to live by it.

  **Jordan:** And I'd say it's a useful legal fiction that obscures a harder moral truth. The conscript and the ignorant soldier are tragic figures. We can pity them. We can excuse them. But we shouldn't pretend their guns carry the same moral weight as the guns of those defending their homes from invasion.

  **Sam:** *(Interrupting gently)* So, for my essay... are you saying I can't resolve it?

  **Alex:** *(Smiling)* You can't resolve it, Sam, because it's a conflict between two different ways of seeing the world. One sees war as a political continuation where soldiers are tools. The other sees war as a collection of individual human acts where responsibility can't be outsourced.

  **Jordan:** Exactly. Your essay shouldn't try to pick a winner. It should explain *why* we want both. We want the Walzerian view because it limits suffering and allows for peace. We want the McMahanite view because it demands we take justice seriously and don't hide behind uniforms. The tension between them *is* the ethics of war.

  **Alex:** Though, if I had to bet on which view keeps more people alive during the fighting? I'm sticking with equality.

  **Jordan:** And if I had to bet on which view keeps us honest about whether we should be fighting at all? I'm sticking with inequality.

  **Sam:** So the "fair fight" survives the "complicity" objection only if we care more about the rules of the fight than the reason for the fight.

  **Jordan:** *(Nods)* Or, if we admit that the "fair fight" is a legal necessity, even if it's a moral compromise.

  **Alex:** And that, Sam, is a hell of an essay conclusion.
