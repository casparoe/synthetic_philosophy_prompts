          *   Jordan counters with the "Deep Morality" view. War isn't a magic sphere where murder becomes okay. If the cause is unjust, killing is morally wrongful.
      *   **Round 2: The Conscript (Coercion):**
          *   Jordan presses: Even if coerced, if you shoot at me, you threaten me. I have a right to stop you.
          *   Alex responds: Coercion mitigates blame. We don't punish conscripts like criminals. The symmetry of threat makes the fight "fair" in a tactical sense, even if strategic aims differ.
          *   Jordan refines: Mitigation of *blame* isn't the same as having a *right to kill*. You might be excused, but you don't gain a right to kill the victim defending themselves.
      *   **Round 3: The Ignorant Soldier (Epistemic Limitations):**
          *   Alex argues: Soldiers can't know the truth. Propaganda, fog of war. We can't expect them to be philosophers.
          *   Jordan counters: Ignorance doesn't change the victim's right to life. If I mistakenly think you're attacking me, I still can't kill you. But wait... McMahan does allow for *excusable* ignorance.
