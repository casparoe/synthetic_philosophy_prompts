      *   **Characters:**
          *   Defender of MEC (Walzerian spirit): Focuses on the separation of *jus ad bellum* (justice of war) and *jus in bello* (justice in war), the "fair fight," and the soldier's role as an instrument of the state.
          *   Defender of MIC (McMahanite spirit): Focuses on individual moral responsibility, the idea that unjust combatants are essentially aggressors, and that self-defense rights don't apply to aggressors.
      *   **Key Issues to Address:**
          *   The "Fair Fight" argument vs. the "Complicity" objection.
          *   Case Study 1: The Conscript (forced to fight for an unjust cause).
          *   Case Study 2: The Morally Ignorant Soldier (believes in good faith their cause is just).
          *   The relationship between Legal Equality (Geneva Conventions) and Moral Equality (is it just pragmatic?).
      *   **Tone/Style:** High-quality dialogue, no strawmen, genuine engagement/response, suitable for a high school junior working on a college essay (intellectual but accessible).

  2.  **Character Conception:**
