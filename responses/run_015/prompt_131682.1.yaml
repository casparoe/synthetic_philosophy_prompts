      *   *Components:* "Simms" (small particles/marbles) and "Simmballs" (clusters of simms).
      *   *The Point:* Hofstadter uses this to illustrate *levels of description*. The simms follow physical laws (bottom-up). The simmballs represent symbols or concepts (top-down).
      *   *Causation:* Hofstadter argues *for* a kind of downward causation, but it's tricky. He doesn't mean magic. He means that the *pattern* constrains the particles. However, strictly speaking, in a closed physical system, all causation is bottom-up. Hofstadter's trick is to suggest that at the level of *meaning*, the pattern dictates the movement.
      *   *Correction/Nuance:* The user says "symbols push substrate." Hofstadter would say the symbols *are* the substrate arranged in a specific way, but the *logic* of the symbols determines the next state. It's a "causal slack" argument.
