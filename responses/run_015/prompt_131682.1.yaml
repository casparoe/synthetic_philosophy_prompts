  3.  **Address Core Question 1: Downward Causation vs. Best Explanation:**
      *   *Downward Causation (Ontological):* The pattern *itself* is a force. If you removed the pattern concept, the physics would change. (This is generally rejected in physics).
      *   *Downward Causation (Hofstadter's version):* The pattern creates constraints. The simms *cannot* move certain ways because they are locked in a simmball. The "ball-ness" restricts the "simms."
      *   *Best Explanation (Epistemological):* The physics is all bottom-up. But describing every simm is impossible. Describing simmballs is efficient. The causation is still just simms hitting simms, but our *story* is about simmballs.
      *   *The Difference:* One claims the pattern is a *driver* (ontological), the other claims the pattern is a *lens* (epistemological).
      *   *Oceanographer Analogy:* Tidal pools. Do you say "The tide pool ecosystem caused the algae to bloom" (downward) or "The specific arrangement of sunlight, nutrients, and water temperature caused the algae to bloom, and 'ecosystem' is just a label" (best explanation)?

