          *   *Decision:* Computation first. It creates the *puzzle*. If you start with "Primes are deterministic," the heuristic looks like nonsense immediately. If you start with "Here is a prediction that matches data," the determinism becomes a philosophical problem to solve, not a blocker.
          *   *Timing:* Needs to happen in the first 15 mins.

      *   *Q2: The Example.*
          *   Twin Primes ($\pi_2(x) \sim C \int \frac{dt}{(\log t)^2}$).
          *   Pros: Famous, correction factor is instructive (local obstructions).
          *   Cons: Logarithms might scare non-majors.
          *   *Alternative:* Goldbach? (Harder heuristic). Prime Number Theorem? (Too simple, no independence needed really).
          *   *Decision:* Keep Twin Primes but simplify the presentation. Don't derive the integral, just the density $1/(\log n)^2$. The correction factor is crucial because it shows independence *fails* locally and must be patched. This bridges the math/philosophy gap (the patch is a logical constraint, not a probabilistic one).
          *   *Refinement:* To save time on logs, use the "probability $n$ is prime is $1/\log n$" as a given black box (PNT heuristic). Focus on the *joint* probability.

      *   *Q3: Calibration Rule & Disclosure.*
          *   User suspects it's a filter, not vindication (Maier's Theorem). This is correct.
          *   *Placement:* After the heuristic is derived, before the epistemic wrap-up.
          *   *Disclosure:* Listing correlations is vital for the philosophy students. It shows *what* is being ignored.
          *   *Decision:* Present Calibration as a *necessary condition* (sanity check), not sufficient. Use Maier's theorem as the "gotcha" that prevents over-confidence. Disclosure earns its minutes because it makes the "presumption" explicit.

      *   *Q4: Formalization.*
          *   Flatness: Too vague.
          *   Reichenbach (Common Cause): Good for philosophy, but hard to apply to numbers (what causes primality?).
          *   MaxEnt: Dangerous. Students might think it *derives* independence rather than selecting a model.
          *   *Decision:* Drop formal definitions. Use a **Pragmatic/Model-Based** approach. Independence is a *modeling choice* justified by lack of known structural connection. If you force one, MaxEnt is the most "mathematical," but it risks the misconception in Q5. Better to frame it as "The Null Hypothesis of Structure." Let's go with **Reichenbach-style default** but simplified: "Assume independence unless there is a known arithmetic reason (congruence) to correlate." This fits the Twin Prime correction perfectly.

      *   *Q5: Misconceptions.*
          *   Need to weave these into the flow, not just list them at the end.
          *   *MaxEnt Trap:* To prevent the idea that MaxEnt *forces* the result, we must emphasize the *choice of variables* happens *before* the entropy calculation.
          *   *Probability of Truth:* Address this at the very end. The heuristic gives a "expected density," not $P(Conjecture)$.
          *   *Empirical Test:* Address during Calibration.

      *   *Q6: Closing.*
          *   Need a question that tests structure, not assent.
          *   Refusals: Don't explain rigorous probability, don't explain how to prove the conjecture.

  4.  **Drafting the Sequence (Iterative refinement for timing):**

