answer: |-
  ### I. Settling the Six Particulars

  Before the timeline, here are the pedagogical decisions that structure the session. These answers determine the flow below.

  1.  **Opening Move: Computation First.**
      *   **Decision:** Start with the heuristic producing a number.
      *   **Reasoning:** If you open with "The primes are deterministic," the heuristic looks like category error immediately. The philosophy students will dig in on metaphysics, and the math students will disengage. You need to create a *puzzle*: "Here is a method that treats fixed facts as random coins, and it predicts data accurately. How is this possible?" This makes the determinism objection a problem to be solved in minute 20, rather than a blocker in minute 1.

  2.  **The Example: Twin Primes (Keep It).**
      *   **Decision:** Use the Twin Prime heuristic, but simplify the notation.
      *   **Reasoning:** It is the canonical example for a reason. It allows you to demonstrate the *naive* independence ($1/\log n \times 1/\log n$) and then visibly break it with local congruences (divisibility by 2, 3). This break is crucial: it shows the "presumption of independence" is not blind faith, but a default position that is *corrected* by known arithmetic structure. To avoid drowning non-majors, treat $1/\log n$ as a given "density fact" (from PNT) and focus entirely on the *joint* probability mechanics.

  3.  **The Calibration Rule: Filter, Not Vindication.**
      *   **Decision:** Present the rule explicitly as a *necessary condition* (sanity check), not a sufficient one. Place it after the derivation but before the epistemic conclusion.
      *   **Reasoning:** Your suspicion is correct. Maier's Theorem proves that a model can pass all finite calibrations and fail asymptotically. If you present calibration as vindication, you lie. If you present it as a filter, you teach rigor.
      *   **Disclosure Habit:** Yes, it earns its minutes. Making students list the ignored correlations (e.g., "We are ignoring that if $n$ is prime, $n+2$ cannot be divisible by 2") transforms the heuristic from a black box into a set of explicit modeling assumptions. This is catnip for the philosophy students.

  4.  **Formalization: Reichenbach-Style Default.**
      *   **Decision:** Organize around the "No Arithmetic Cause" default. Drop Flatness and MaxEnt.
      *   **Reasoning:** Flatness is too vague for a seminar. MaxEnt is technically seductive but epistemically dangerous here (see Q5). A Reichenbach-style principle ("Assume independence unless there is a known common cause or arithmetic link") aligns perfectly with the Twin Prime correction factor. It frames independence as the *null hypothesis of structure*, which is exactly how number theorists use it.

  5.  **Misconception Management:**
      *   **Decision:** Do not save these for a Q&A. Weave them into the narrative as "traps."
      *   **The MaxEnt Trap:** To prevent students from thinking MaxEnt *derives* the truth, you must emphasize, during the Model section, that the *choice of variables* precedes the entropy calculation. If you carve the integers differently, MaxEnt gives a different answer. The "presumption" is in the carving, not the calculation.
      *   **Probability of Truth:** Head this off in the Closing.
      *   **Empirical Hypothesis:** Address this during Calibration (it's a model constraint, not an empirical frequency claim).

  6.  **Closing:**
      *   **Decision:** One structural question, three explicit refusals. (Detailed in the plan).

  ---

  ### II. The Session Plan (75 Minutes)

  **Dependencies:**
  *   **(B)** depends on **(A)**: The determinism objection only lands once they see the heuristic works.
  *   **(D)** depends on **(C)**: You cannot show the correction factor until the naive independence model is established.
  *   **(E)** depends on **(D)**: You cannot discuss the limits of the model (Maier) until the model is fully built.
  *   **(F)** depends on **(E)**: You cannot assess the epistemic status until you know where the model fails.

  #### Phase 1: The Hook (00:00 – 00:15)
  *   **Move:** Present the Twin Prime Conjecture. State the heuristic prediction for the count $\pi_2(x)$ without justification.
  *   **Action:** Show a slide with actual data vs. heuristic prediction for $x = 10^4, 10^5, 10^6$. The fit should be visibly good.
  *   **Narrative:** "If I treat the primality of $n$ and $n+2$ as independent coin flips with bias $1/\log n$, I get this number. It matches reality. Why should a model based on chance predict fixed facts?"
  *   **Goal:** Seduce the mathematicians with utility; create a puzzle for the philosophers.

  #### Phase 2: The Tension (00:15 – 00:25)
  *   **Move:** Confront Determinism.
  *   **Action:** Ask the room: "What is the probability that 17 is prime?" (Answer: 0 or 1). "So what did we just calculate?"
  *   **Narrative:** Distinguish between *aleatory* chance (physical randomness) and *epistemic* modeling (randomness as a stand-in for complexity).
  *   **Dependency:** This works only because Phase 1 showed the model *works*. If the model failed, determinism would be the obvious reason why.
  *   **Goal:** Suspend the metaphysical objection. Agree to treat "probability" as "expected density" for the sake of the hour.

  #### Phase 3: The Mechanism & Disclosure (00:25 – 00:45)
  *   **Move:** Derive the Naive Model, then Break It.
  *   **Action:**
      1.  Write $P(n \text{ prime}) \approx 1/\log n$.
      2.  Write Naive Joint: $P(n, n+2 \text{ prime}) \approx (1/\log n)^2$.
      3.  **Disclosure Habit:** Ask students: "Are these events actually independent?" Elicit the congruence obstruction (if $n$ is odd, $n+2$ is odd; if $n$ is $1 \mod 3$, $n+2$ is $0 \mod 3$).
      4.  **The Repair:** Show the correction factor (Hardy-Littlewood constant). Explain it as "repairing the independence presumption where we *know* there is an arithmetic link."
  *   **Misconception Check (MaxEnt Trap):** When defining the events, explicitly state: "We chose to model 'primality' as the variable. We could have modeled 'primality conditional on mod 3 class'." Emphasize that the *choice of description* is manual. The machinery does not choose the variables for you.
  *   **Goal:** Show that "independence" is a default position that yields to explicit arithmetic structure.

  #### Phase 4: The Limits (00:45 – 01:00)
  *   **Move:** Introduce the Calibration Rule and Maier's Theorem.
  *   **Action:**
      1.  State your Calibration Rule: "Trust the heuristic only if it reproduces known small-scale data."
      2.  **The Smash:** Introduce Maier's Theorem (qualitatively). "There are short intervals where the primes cluster much more than the random model predicts."
      3.  **Conclusion on Rule:** The model passes calibration at scale $10^6$ but fails at certain asymptotic scales.
  *   **Decision Implementation:** Present Calibration as a *filter*. It removes nonsense (e.g., if your heuristic predicted negative primes), but it does not guarantee truth.
  *   **Goal:** Prevent over-confidence. Establish that passing the check is necessary but not sufficient.

  #### Phase 5: The Epistemic Status (01:00 – 01:10)
  *   **Move:** Formalize the Presumption (Reichenbach-Style).
  *   **Action:** Return to the "Why" from Phase 2.
  *   **Narrative:** "We do not assume independence because we believe the primes are random. We assume it because we lack a *reason* to correlate them, absent congruences."
  *   **Misconception Check (Empirical Hypothesis):** Clarify that we are not testing if primes *are* random (they aren't); we are testing if the *lack of structure* is a useful null hypothesis.
  *   **Goal:** Satisfy the philosophy students. The justification is pragmatic and structural, not empirical or metaphysical.

  #### Phase 6: Closing (01:10 – 01:15)
  *   **Move:** The Test and The Refusals.
  *   **Action:** Pose the closing question. State the refusals.
  *   **Goal:** Ensure they leave knowing what they don't know.

  ---

  ### III. Misconception Timeline

  | Misconception | When it arises | Where you head it off |
  | :--- | :--- | :--- |
  | **"Primes are random."** | Phase 1 (The Hook) | **Phase 2:** Explicitly state they are deterministic. "Probability" = "Density Model." |
  | **"Independence is empirical."** | Phase 3 (Mechanism) | **Phase 5:** Clarify it is a "Null Hypothesis of Structure," not a testable frequency claim. |
  | **"MaxEnt derives the truth."** | Phase 3 (Mechanism) | **Phase 3:** Emphasize the *choice of variables* happens before the entropy calculation. |
  | **"Correction confirms the model."** | Phase 3 (The Repair) | **Phase 4:** Show Maier's Theorem. Correction fixes local errors, not asymptotic failures. |
  | **"Output is P(Conjecture)."** | Phase 6 (Closing) | **Phase 6:** Explicitly deny this in the Refusals. |

  ---

  ### IV. The Closing Move

  **The Question to Ask:**
  > "If I showed you a new arithmetic property $Q(n)$ that had no known congruence obstructions, and I used the independence heuristic to predict the density of $n$ satisfying $Q(n)$, what specific piece of evidence would you require from me before you treated that prediction as anything more than a guess?"

  *   *Why this works:* It forces them to articulate the Calibration Rule and the Maier limitation. If they say "Check it against data," you ask "How much data?" (leading to the asymptotic problem). If they say "Prove there are no correlations," you ask "How?" (leading to the impossibility of proving independence).

  **The Three Refusals (State these openly):**
  1.  **"I will not tell you the probability that the Twin Prime Conjecture is true."** (The heuristic gives expected density, not truth-value probability.)
  2.  **"I will not explain how to make this rigorous."** (That requires sieve theory and measure theory we do not have.)
  3.  **"I will not tell you why the primes 'look' random."** (That is a question about the deep structure of number theory we do not yet understand; we are only modeling the appearance.)
