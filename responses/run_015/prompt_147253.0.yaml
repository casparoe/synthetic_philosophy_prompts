answer: |-
  **MEMORANDUM**

  **TO:** City Council
  **FROM:** Board of Directors, Regional Transit Authority
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Automated Shuttle Program Renewal and Safety Protocol Restructuring

  ### Executive Summary

  Following the collision on [Date] involving an automated shuttle and a pedestrian, the Board has conducted a comprehensive review of operational protocols, liability structures, and human-factors engineering. We recommend **redesigning the onboard attendant role to restore genuine agency** while simultaneously **adopting an explicit enterprise-liability posture**. We will not remove the human operator at this time, nor will we retain the role in its current configuration.

  This memo details the rationale for this decision, addresses the demand for individual accountability, and outlines a three-week implementation timeline to meet the renewal vote.

  ### Incident Analysis and Systemic Failure

  The collision resulted from a confluence of technical and architectural failures. An over-the-air (OTA) software update, validated only against fleet-level statistics, altered pedestrian classification thresholds. This technical decision was made without attendant notification. Simultaneously, the human monitoring architecture failed. Telemetry indicates the attendant's attention was captured by a fleet-management tablet for 63% of the critical pre-impact window.

  Our Safety Officer has characterized this as **"attentional bankruptcy."** We accept this assessment. The current design demands that the attendant monitor the external environment for rare edge cases while simultaneously managing a high-frequency administrative task (the fleet tablet). This architecture spends the operator's budget of responsible attention. The result is a human presence that absorbs blame without possessing the cognitive bandwidth to exercise control. Continuing this configuration is ethically untenable and operationally unsafe.

  ### Public Accountability and Naming Asymmetry

  The family of the injured pedestrian has requested we name the person responsible. We observe a **naming asymmetry**: public demand for an individual name grows in proportion to the individual's inability to prevent the harm.

  The attendant, earning $19/hour with nine days of training, had no control over the software update, the vehicle's perception stack, or the interface design that diverted their gaze. To name the attendant is to misidentify the locus of control. It satisfies a psychological desire for a singular villain but obscures the organizational decisions that created the risk.

  **Decision:** The Authority will **not** name the attendant. We will publicly accept **enterprise liability**. We acknowledge that the Authority, in partnership with the manufacturer, set the conditions for this failure. We will communicate to the public that while the attendant was physically present, the *system*—comprising software governance, interface design, and policy—was the operative agent. We will not offer a individual scapegoat to insulate the organization.

  ### Recommendation: Redesign Role and Adopt Enterprise Liability

  We recommend the following concrete course of action:

  1.  **Redesign the Attendant Role (Genuine Control):**
      *   **Eliminate Distractions:** Remove the fleet-telemetry tablet from the vehicle immediately. The attendant's sole duty is local environmental monitoring and emergency intervention.
      *   **Enhance Authority:** Reclassify the role from "monitor" to "Safety Operator." This requires bargaining with the union to establish new duties and compensation commensurate with increased responsibility.
      *   **Training:** Increase training from nine days to a minimum of forty hours, focused on situational awareness and emergency override protocols.
      *   **Policy 4.2 Amendment:** We will propose an amendment to Policy 4.2 to redefine "qualified human operator" not as a driver, but as a dedicated safety mitigator with exclusive focus on the immediate path of travel.

  2.  **Adopt Enterprise Liability:**
      *   In all legal and public communications, the Authority will assert that liability resides with the enterprise. We will indemnify the attendant against personal liability claims arising from system errors or interface-induced distractions.
      *   We will establish a no-fault compensation fund for victims of automated shuttle incidents, decoupling victim support from the establishment of individual negligence.

  3.  **Software Governance:**
      *   Implement a moratorium on OTA updates affecting safety-critical perception systems without a 14-day validation period and explicit notification to onboard staff.

  ### Engagement with the Rejected Option: Full Automation (Removing the Human)

  We considered the option of removing the human operator entirely and adopting a pure enterprise-liability model.

  **The Strongest Argument for Removal:**
  The most compelling argument for this option is **ontological honesty**. The current vehicles lack steering wheels and accelerators; the human is not an operator in any traditional sense. Removing the human aligns moral responsibility with technical reality. It eliminates the "human shield" dynamic entirely, preventing the organization from ever using a low-wage worker to absorb regulatory or public scrutiny for algorithmic failures. It simplifies the liability chain: the machine acted, the enterprise owns the machine, the enterprise pays.

  **Why We Reject It:**
  Despite the ethical clarity of full automation, we must prioritize physical safety in a dense, mixed-traffic downtown environment. Our counsel and safety consultants warn that removing the onboard human **worsens real safety outcomes** in the current technological generation.
  *   **Latency:** Remote operators cannot match the reaction time of an onboard human pressing an emergency stop in a localized edge case.
  *   **Physical Deterrence:** The physical presence of a safety operator influences pedestrian and driver behavior around the shuttle in ways a remote camera cannot.
  *   **Last-Line Defense:** While the attendant in the recent incident did not prevent the collision, the emergency stop mechanism remains a critical safety layer. In other scenarios (e.g., a passenger medical emergency or a vehicle malfunction), an onboard human provides immediate mitigation that remote oversight cannot.

  We cannot trade the *appearance* of ethical consistency (removing the scapegoat) for the *reality* of physical risk (removing the emergency brake). Therefore, we must keep the human but empower them to be effective.

  ### Addressing Litigation and Safety Risks

  Our counsel has flagged a dichotomy: keeping humans aboard invites negligence litigation, while removing them risks physical safety. Our recommendation navigates this by altering the *nature* of the human presence.

  *   **Mitigating Litigation Risk:** By removing the fleet tablet and enhancing training, we harden the Authority against claims of "negligent supervision." We are no longer setting up the employee to fail. Furthermore, by adopting an enterprise-liability posture, we signal to the courts that we do not seek to shift blame to the employee, reducing the incentive for plaintiffs to pursue individual negligence claims to deepen pockets.
  *   **Mitigating Safety Risk:** By retaining the onboard attendant but stripping away their cognitive distractions, we preserve the physical safety net (the E-stop) while maximizing the probability that it is used effectively.

  ### Timeline for Council Renewal Vote

  To meet the three-week deadline for the renewal vote, we propose the following schedule:

  *   **Week 1 (Immediate):**
      *   Suspend current attendant monitoring protocols (remove tablets from vehicles).
      *   Issue public statement accepting enterprise responsibility; confirm attendant will not be named.
      *   Notify Union of intent to bargain regarding role redesign.
  *   **Week 2:**
      *   Draft Policy 4.2 amendment for Council review.
      *   Finalize no-fault compensation framework for the injured pedestrian.
      *   Complete initial bargaining session with Union representatives.
  *   **Week 3:**
      *   Board vote on redesigned role and liability posture.
      *   Submission of renewal package to City Council including safety redesign and liability commitments.

  ### Conclusion

  We cannot undo the injury to the pedestrian. We can, however, refuse to compound that injury by scapegoating a worker placed in an impossible position. By redesigning the role to prevent attentional bankruptcy and accepting enterprise liability to resolve naming asymmetry, we align our operations with both safety realities and ethical governance. We request the City Council's support in this restructuring as a condition of program renewal.
