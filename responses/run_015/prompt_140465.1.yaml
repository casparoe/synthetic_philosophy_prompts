answer: |-
  You're conflating decision theory with game theory. Good's theorem is about information regarding states of nature—facts about the world that don't care what you know. The moment you introduce a rule that punishes you for knowing something, you've introduced an adversarial agent (the legal system) that conditions its moves on your epistemic state. I'll concede that point: if the info is about how another agent will react to your knowledge, yes, it can hurt you. But that's not a failure of the value-of-information result; it's a signal that you're playing a game, not solving a decision problem. For a lone agent facing a indifferent universe, the option set doesn't shrink based on what they know; only the payoffs change.

  Even if we treat the legal rule as a fixed constraint rather than an adversary, you're misdescribing the option set. "Hear the case" doesn't vanish; it just acquires a massive negative utility penalty if you're informed of bias. Ex-ante, you calculate the risk of triggering that penalty. If you learn you're biased, knowing allows you to recuse and avoid the catastrophe of an unjust verdict or reversal. Ignorance leaves you gambling on whether you're biased while holding the gun. The theorem still holds: knowing the true state lets you pick the best available act for that state. If the system punishes you for maximizing utility correctly, don't blame the math for the incentives.
