prompt: |-
  So my school just made everyone install this hookup consent app for dorms and its kind of wierd and I'm trying to figure out what idea of consent its actually built on.

  Heres how it works as far as I can tell: you both tap agree in the app and you get a green check that lasts like two hours, there is no undo button in the app itself but the FAQ says if someone says no out loud afterwards that still revokes it. Lying to get someone to tap, like about your name or whether you have an STI or whether youre using protection, does not void the tap according to the FAQ, they treat the tap as still valid. Being super drunk to the point you are slurring does void it, but just being tipsy or buzzed still counts as able to tap. And for pressure, if someone threatens to get you kicked off a team unless you tap that voids it, but if its just that they are way older or popular or your TA and you feel you cant really say no, the school still treats the tap as valid.

  So what theory of valid consent is baked into that design? Like when does deception matter, when does pressure count as coercion, when is someone competent enough to count? Is that combo even coherent or are they mixing and matching ideas that dont fit together? And does the app actually need that theory or could a totally different view of consent also live with these rules? Tell me what they would have to change in the app if they flipped to the opposite views, like any material lie kills consent or any big power gap kills consent.

  I dont need any citations or reading lists, just walk me through the logic cause it feels like they are trying to have it both ways.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's school implemented a "hookup consent app" for dorms.
      *   **Mechanism:** Both parties tap "agree" -> green check (2 hours). No undo button in-app (but verbal "no" overrides).
      *   **Specific Rules:**
          *   Deception (name, STI status, protection) does *not* void consent.
          *   Intoxication: Slurring/very drunk voids it; tipsy/buzzed does not.
          *   Coercion/Pressure: Explicit threats (kick off team) void it; implicit power dynamics (TA, popularity, age) do not.
      *   **Questions:**
          *   What theory of valid consent is baked into this design?
          *   When does deception/pressure/competence matter in this model?
          *   Is the combination coherent or contradictory?
          *   Does the app *need* this specific theory, or could another work?
          *   What changes would be needed to flip to opposite views (e.g., fraud vitiates consent, power dynamics vitiate consent)?
      *   **Constraints:** No citations or reading lists. Just walk through the logic. Address the feeling that they are "trying to have it both ways."

  2.  **Deconstruct the App's Logic (The "Built-in" Theory):**
      *   *Core Mechanism:* Explicit, affirmative, recorded agreement (Contractual/Performative).
      *   *Deception:* Only specific types of fraud matter (likely force or identity in a fundamental sense, but the prompt says lying about name/STI/protection *doesn't* void it). This suggests a "Thin Consent" or "Procedural Consent" model. It values the *act* of agreeing over the *quality* of information leading to it.
      *   *Intoxication:* Bright-line rule (slurring vs. tipsy). This is a "Capacity Threshold" model. It tries to be objective/observable rather than subjective.
      *   *Coercion:* Distinguishes between explicit quid-pro-quo threats and implicit power imbalances. This is a "Formal Coercion" model. It looks for overt acts of force/threat, not structural pressure.
      *   *Overall:* It looks like a **Legalistic/Contractual Model of Consent**. It treats consent like signing a terms of service agreement or a business contract.

  3.  **Evaluate Coherence:**
      *   *Is it coherent?* Internally, yes, if the goal is risk management and legal defensibility for the institution. It prioritizes clarity and evidence over nuanced ethical interaction.
      *   *Is it ethically consistent?* That's where the user's "both ways" feeling comes in. It claims to protect students but excludes common scenarios where consent is ethically compromised (fraud, power dynamics). It separates "legal/official" consent from "meaningful/ethical" consent.
      *   *The "Both Ways" tension:* They want the *appearance* of progressive affirmative consent (tap to agree) without the *liability* of policing complex social dynamics (power, fraud).

  4.  **Analyze Specific Dimensions:**
      *   *Deception:* The app adopts "Fraud in the Factum" vs. "Fraud in the Inducement" logic (though simplified). Lying about protection/STI is treated as "inducement" (you agreed to sex, just under bad terms) rather than "factum" (you didn't agree to *this* kind of sex).
      *   *Pressure:* Distinguishes between *Coercion* (threat of harm) and *Influence* (social pressure). The app validates Influence as sufficient for consent.
      *   *Competence:* Binary threshold. Are you functional enough to operate a phone?

  5.  **Address the "Does it need this theory?" Question:**
      *   Could a different view live with these rules?
      *   The *mechanism* (digital record) leans heavily toward contractualism. A "Relational Consent" model (ongoing communication) clashes with a "One-time Tap" mechanism.
      *   However, the *rules* (what voids the tap) could change without changing the *interface*.

  6.  **Drafting the "Flip" Scenarios:**
      *   *Scenario A: Fraud Vitiates Consent (Material Lie).*
