  7.  **Synthesizing the Argument:**
      *   **Label the Theory:** "Contractual Affirmative Consent" or "Administrative Consent." It's about creating an audit trail.
      *   **The Logic:** It prioritizes *administrative clarity* over *ethical nuance*. It draws bright lines so administrators don't have to judge "he said/she said" regarding social pressure or subtle lies.
      *   **The Contradiction:** It claims to ensure safety/consent but ignores factors that actually make consent unfree (power, health risks). It protects the *school* from liability more than the *students* from harm.
      *   **The "Both Ways" feeling:** You are right. They want the moral credit of "affirmative consent" without the logistical nightmare of enforcing a robust ethical standard.

