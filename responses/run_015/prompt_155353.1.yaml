  In the province of Kaelo, the pastoralist Venn group is tracked by grazing-permit ID rather than name. Over five years, four administrative streams converge: the Land Bureau reclassifies dry-season commons as conservation zones; Veterinary Services imposes disease cordons blocking access to water; Social Welfare keys ration allocation to registered residence in district towns; and Education mandates boarding schooling for children under ten. No ministerial directive orders the Venn's disappearance; each bureau chief acts on genuine mandates—conservation, disease control, urbanization, literacy. Mid-level coordinator Elias Thorne maps the four streams in a quarterly review, noting the cumulative population decline, but files it under 'Demographic Shift.' Bureau Chief Mara Voss foresees the outcome in a private memo, labels it 'regrettable,' privately welcomes the reduction in welfare costs, and signs the ration directive without alteration. No single directive is sufficient to destroy the Venn; remove any one, and the others sustain the pressure. The factual record—memos, minutes, metadata—is undisputed: no order to kill was ever given, yet the group disperses and ceases to exist as a functional unit.

  ### Verdicts by Reading

  **(i) Purposive Reading (*Dolus Specialis*)**
  *   **Bureau Chiefs:** **Acquitted.** Their conscious aim is administrative (conservation, literacy), not destruction. Desire for a side-effect is not purpose.
  *   **Elias Thorne:** **Acquitted.** He sees the outcome but files it as 'Demographic Shift.' His purpose is reporting, not destruction.
  *   **Mara Voss:** **Acquitted.** She welcomes the result, but her purpose in signing is administrative (rationing). Under this reading, desire without purpose is not intent.
  *   **Result:** No genocide, because no actor intended the group's destruction as such.

  **(ii) Knowledge-Based Reading**
  *   **Bureau Chiefs:** **Acquitted.** They are confined to their own stream and lack knowledge of the cumulative pattern leading to destruction.
  *   **Elias Thorne:** **Convicted.** He sees the four streams, knows where they are heading, and participates by coordinating the review. Knowledge of the pattern plus participation suffices.
  *   **Mara Voss:** **Convicted.** She foresees the outcome, knows her conduct is part of the pattern, and participates.
  *   **Result:** Genocide occurred, perpetrated by those who knew and participated.

  **(iii) Structural Reading**
  *   **The Enterprise:** **Convicted.** The systematic and patterned character of the acts inflicts conditions of life calculated to bring about destruction.
  *   **Individuals:** **Incidental.** Intent is attributed to the apparatus; individual *mens rea* is not required.
  *   **Result:** Genocide occurred, manifest in the system's operation.

  ### The Structural Feature

  The single structural feature generating the divergence is **the absence of a unifying causal will**. It is not merely that contributions are non-necessary (overdetermination), but that there is no single agent whose will binds the separate administrative acts into a coherent project of destruction. This decouples the collective outcome from any individual mental state. Readings (ii) and (iii) locate intent in the *knowledge of the pattern* or the *pattern itself*, respectively, while Reading (i) requires the pattern to be anchored in a *purpose* that does not exist in this case.

  ### The Removal Test

  **Modification:** A Provincial Coordinating Committee adopts the disappearance of the Venn as a "problem with a solution" in closed minutes. They issue no new orders; the four streams continue exactly as before, executed by the same officials.

  **Result:** The three readings **collapse toward agreement on the classification of the event**, confirming your hypothesis that the original case was a joint-criminal-enterprise case with the principal deleted.
  *   **(i) Purposive:** The Committee possesses the *dolus specialis*. Through ordinary imputation (JCE), the Committee members are convicted. The lower bureaucrats remain acquitted unless they share the purpose, but the *event* is now legally genocide.
  *   **(ii) Knowledge-Based:** The Committee is convicted. Thorne and Voss remain convicted. The *event* is genocide.
  *   **(iii) Structural:** The System is convicted. The *event* is genocide.

  **Finding:** The divergence on *whether genocide occurred* vanishes once a principal exists. The original disagreement was not about the mechanics of destruction, but solely about whether genocide can exist without a perpetrator who aims for it. The case was indeed a JCE with the principal deleted; the "genocidal intent" was floating in the system until the Committee anchored it.

  ### The Strongest Attack (Purposive Defender)

  **Pile 1: The Case is Rigged (Metaphysics of Action)**
  *   **Redescription:** You have redescribed negligence or foresight as intent by letting the emergent outcome fix the *mens rea*. If no one aimed at the result, calling it "intent" is a category error, not a legal finding.
  *   **No Perpetrator:** You have built a genocide with no perpetrator. Action requires an agent; if the agency is dissolved into "streams," there is no one to hold responsible. This is not law; it is systems theory masquerading as jurisprudence.
  *   **Emergent Mens Rea:** You are inferring intent from the outcome rather than the mind. This reverses the burden of proof, making the severity of the result define the guilt of the actor.

  **Pile 2: Conceptual Limits (Political Utility)**
  *   **Concession:** We concede the facts: the group is destroyed by administrative conditions without a specific order.
  *   **Argument:** But the word "genocide" performs political work that depends on identifying perpetrators. It is a stigma reserved for evil aims, not tragic systemic failures. Keeping the definition narrow preserves its moral force. If we expand it to cover administrative negligence or emergent systemic outcomes, we dilute the term until it cannot distinguish between a bureaucrat who wants a group dead and one who merely ignores their suffering. We leave this pattern unnamed not because it isn't horrific, but because "genocide" is the wrong tool for it.

  **Conclusion:** The disagreement is ultimately about **what we want the word genocide to be for**. The Purposive reading defends the term as a tool for condemning *evil wills*; the Knowledge and Structural readings defend it as a tool for condemning *destructive systems*. Your case proves that without a principal, the metaphysics of action (who intended this?) collapses into a political choice (do we want to name this genocide?).
