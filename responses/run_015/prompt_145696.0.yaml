prompt: |-
  okay so my roommate is deep in modal metaphysics and keeps insisting that Lewis was actually right about everything, but he built this argument that seems to show transworld identity isn't just wrong but literally collapses into counterpart theory, and then by analogy temporal identity collapses too so nobody actually persists over time? i can't tell if it's brilliant or just sleight of hand.

  here's the chain he laid out: (1) suppose kripke-style transworld identity is true and i literally exist in world W where i'm not a musician and world W' where i am. since identity is transitive and symmetric, if it's literally me in both, then i both am and am not a musician — contradiction, unless we world-index every property. (2) but once you world-index, saying i am a musician in W' just means i bear some modal relation to W' — specifically that there's a musician-counterpart of me there. (3) so transworld identity, once you fix the contradiction, just becomes counterpart theory with extra steps. (4) now apply the exact same structure to time: i exist at t1 (short child) and t2 (tall adult). without temporal indexing i contradict myself, so index properties to times. (5) but then saying i was short means my-t1-temporal-counterpart was short — which is just stage theory applied across time. (6) so temporal identity also collapses into a temporal-version of counterpart theory, meaning nobody literally persists; we're just sequences of momentary counterparts. (7) but that can't be right — i literally remember being a kid, not just having some kid-counterpart with my memories. therefore the collapse in step (3) must fail.

  he wants me to pick which step is the weak link and explain what giving it up costs. i kinda want to save the intuition that i literally persist through time, but i also don't want to just reject (7) by fiat. is the mistake in assuming world-indexing forces a counterpart relation? or is there a hidden equivocation between having a property at a world and being related to a counterpart? and if i block the collapse for worlds, do i also have to block it for time, or can i treat them differently without being ad hoc?
