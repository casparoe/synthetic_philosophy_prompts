answer: |-
  This is a classic reconstruction of David Lewis's **Argument from Accidental Intrinsics**, extended from time to modality. Your roommate is sharp—they've correctly identified that Lewis's motivation for Counterpart Theory (modality) and Stage Theory (time) stems from the same logical pressure: *how can one thing have incompatible properties?*

  However, the argument relies on a specific ontological framework (Lewis's Modal Realism) to make the "collapse" work. If you don't buy that framework, the chain breaks.

  Here is the breakdown of where the weak link is, the equivocation involved, and how to save temporal persistence without being ad hoc.

  ### The Weak Link: Step (3)
  **Claim:** *Once you world-index properties, transworld identity just becomes counterpart theory with extra steps.*

  This is the critical leap. Your roommate is asserting that **relativized instantiation** (having a property *at* a world) is semantically identical to a **counterpart relation** (having a distinct duplicate *in* a world).

  **Why it fails:**
  This step only holds if you accept **Modal Realism** (the view that possible worlds are concrete, spatiotemporally isolated universes like our own).
  *   **Lewis's View:** World $W'$ is a concrete place. You are *here*. You cannot be *there*. Therefore, if "you" are at $W'$, it must be a counterpart.
  *   **Kripke/Actualist View:** Worlds are abstract entities (maximal consistent sets of propositions, states of affairs, or ways the world could be). To say "I exist in $W'$" doesn't mean I am located in a distant concrete universe; it means the abstract proposition *that I am a musician* is true at that world.

  **The Equivocation:**
  Your roommate is equivocating on the meaning of "in."
  *   **Lewis:** "In" means **spatiotemporal containment**. (I am literally inside the boundaries of World-W).
  *   **Actualist:** "In" means **truth-at**. (The world-story includes me).

  If worlds are abstract, there is no spatial contradiction in me being a musician at $W'$ and not at $W$. I am not "located" in $W'$; $W'$ just describes me differently. Therefore, Step (3) fails. World-indexing is a primitive relation of *instantiation*, not a relation to a *distinct object* (counterpart).

  ### The Cost of Rejecting Step (3)
  If you tell your roommate, "Step (3) is false because worlds are abstract," you save Transworld Identity. But here is the cost you have to pay:

  1.  **Primitive Instantiation:** You must accept that "instantiating a property at a world" is a brute, unanalyzable fact. Lewis hates this; he wants to analyze modality in terms of quantifiers over concrete worlds. You are saying modality is primitive.
  2.  **Haecceitism:** You might be committed to the idea that worlds can differ *only* by which individuals occupy which roles (this world has *me* as a musician; that world has *me* as a non-musician), which some philosophers find metaphysically suspicious.

  ### The Temporal Analogy: Can You Block (5) Without Being Ad Hoc?
  Your roommate argues: *If you block the collapse for worlds, you must block it for time, or else you're being inconsistent.*

  You can treat them differently, but you need a principled reason. The most robust defense is **Actualism about Time vs. Modal Space**.

  *   **Time is Actual:** $t_1$ and $t_2$ are both real parts of the actual world. I am causally connected to my past self.
  *   **Worlds are Not Actual:** $W'$ is not real in the same way.

  **However, to save literal persistence (Endurantism), you actually need to reject Step (5) as well.**
  Step (5) claims: *Saying I was short means my-t1-temporal-counterpart was short.*
  This is **Stage Theory** (Exdurantism). But there is a middle ground: **Perdurantism (Worm Theory)**.
  *   **Stage Theory:** I am a momentary slice. I do not persist.
  *   **Worm Theory:** I am a 4D "worm" extending through time. The *whole worm* persists. The worm is short at $t_1$ and tall at $t_2$.
  *   **Endurantism (Your Goal):** I am a 3D object wholly present at $t_1$ and $t_2$.

  To save Endurantism, you argue that **temporal indexing does not imply temporal parts.** Just as "I am a musician-at-W" doesn't mean there is a musician-me and a non-musician-me, "I am short-at-t1" doesn't mean there is a short-me and a tall-me. It means *I* bear the relation *shortness* relative to *t1*.

  **Is this ad hoc?**
  It is only ad hoc if you think Time and Modality are metaphysically identical.
  *   **Lewis:** Yes, they are analogous. Time is just another dimension like space; modal space is just another dimension like time.
  *   **You:** No. Time is the dimension of change and causation. Modality is the dimension of possibility. We have direct access to our temporal parts (via memory/causation); we do not have access to modal counterparts. Therefore, we can accept temporal indexing without accepting temporal parts.

  ### Addressing Step (7): The Memory Objection
  Your roommate will say: *"Step (7) is weak. Stage Theory explains memory via causal connections between stages. Just because Stage-2 has Stage-1's memories doesn't mean Stage-2 IS Stage-1."*

  They are right. Step (7) is an intuition pump, not a logical proof. Stage Theory *can* account for memory. So, you cannot use memory to *disprove* Stage Theory. You must use it to motivate why Endurantism is *preferable*.
  *   **Argument:** "Stage Theory makes my concern for my future self irrational (why care about a distinct counterpart?). Endurantism explains prudential concern naturally."

  ### Summary: How to Reply to Your Roommate
  Tell them this:

  1.  **The Collapse Fails at (3):** You are assuming **Modal Realism** (concrete worlds). If worlds are abstract (Actualism), "existence at a world" is truth-of-a-proposition, not location-in-a-realm. Indexing properties does not require counterparts; it requires only primitive instantiation.
  2.  **The Temporal Analogy Fails at (5):** Even if we accept temporal indexing, it does not force **Stage Theory**. It allows for **Endurantism**. I can be wholly present at $t_1$ and $t_2$ while bearing incompatible properties *relative to those times*. The contradiction only arises if properties are unindexed (simple inherence). Once indexed, the contradiction vanishes without needing to slice me into stages.
  3.  **The Cost:** The cost of my view is accepting **primitive instantiation** (things just *are* properties at times/worlds). The cost of your view (Lewis) is accepting **concrete possible worlds** and **denying literal persistence**. I prefer paying the cost of primitivism over the cost of denying that I am the same person who was a child.

  **Verdict:** Your roommate's argument is valid *if* you accept Lewis's ontology of properties and worlds. But that ontology is the very thing under dispute. The "sleight of hand" is presenting Lewis's solution (Counterpart/Stage) as the *only* way to solve the Problem of Accidental Intrinsics, when Actualist Endurantism is a live, competing option.
