answer: |-
  **Scenario**
  LuxeRent's contract stipulates a $500 "Excessive Soil" fee is charged if and only if the proposition "This vehicle is excessively soiled" is **true**, explicitly voiding the fee if the proposition is false or lacks a truth value. You return a sedan with faint, grayish smudges on the carpet—visibly dirtier than the pristine dusting on Car #104 (which incurred no fee) but markedly cleaner than the mud-caked mats of Car #209 (which was charged). The adjudication panel cannot agree on whether the smudges place the car in the determinate extension of "excessively soiled" or merely in the penumbra; indeed, their disagreement extends further, as they cannot settle whether the case is genuinely indeterminate or merely difficult, leaving it unclear whether the proposition lacks a truth value or possesses one that is simply hard to verify, creating a zone where it is borderline whether the status is borderline.

  **Analysis**
  The **epistemicist** maintains that there is a fact of the matter: the car either determinately satisfies the predicate, determinately fails it, or sits at a specific sharp boundary between these zones. Our ignorance of which status obtains is purely epistemic; the contract's distinction between "true" and "lacking truth value" collapses because bivalence holds, and the "borderline borderline" status is just a specific, unknown location on a sharp scale of dirtiness. The **supervaluationist** argues the claim is supertrue only if true on all admissible precisifications of "excessively soiled." Here lies the awkwardness: each precisification is classically sharp (no gaps), so "is borderline" is never true *within* a precisification, only relative to the set. For second-order vagueness, the set of admissible precisifications itself must be vaguely bounded, meaning it is supertrue that the claim is borderline only if it is borderline on all higher-order precisifications—a complex hierarchy required to explain why "supertrue" itself seems applicable only vaguely. The **contextualist** suggests the extension of "excessively soiled" shifts with conversational context; second-order vagueness arises because the context itself is unstable, allowing the boundary to move even when judges attempt to fix it, making the truth-value dependent on which contextual parameters are salient at the moment of judgment.

  **Conclusion**
  The feature doing the work is the **contractual requirement for truth specifically**, which excludes truth-value gaps from triggering the fee; if the contract paid out on "not false," gaps and falsehoods would yield the same financial outcome, dissolving the stakes of the second-order uncertainty. If you remove the truth-value gap clause (enforcing bivalence), the second-order vagueness becomes merely a problem of ignorance rather than semantic indeterminacy. An **epistemicist** would attack the setup by denying the coherence of the "lacks a truth value" clause entirely, arguing that the contract is based on a false semantic theory and that the car is simply either soiled or not, regardless of the panel's inability to decide.
