prompt: |-
  Construct a thought experiment about second-order vagueness — where the action isn't just in a borderline case but at the edge of the borderline region, so it's not merely borderline whether the predicate applies, it's borderline whether it's borderline. Constraints: realistic setting, one paragraph — something along the lines of a rental-car company's "excessive dirt" cleaning fee or an airline's "fits comfortably under the seat" pet rule, but your call. The vague predicate has to do real work: someone keeps or loses money depending on whether it applies, and there should be a wrinkle where the contract (or a court) only pays out if the disputed claim is *true* — not merely not-false — so a truth-value gap and a determinate truth value produce different outcomes. Crucially, don't stipulate the borderline statuses: they should fall out of the details you describe (the actual state of the car, comparison vehicles on either side of it in the series). After the scenario, walk through what the epistemicist says (there's a fact of the matter), what the supervaluationist says (the claim is supertrue, superfalse, or neither — and note the awkward part: precisifications themselves are sharp, so what does supervaluationism say about an item where even "supertrue" is only borderline in application?), and what a contextualist would add. Finish with: which feature of the case is doing the work, what happens if you remove it, and how an epistemicist would attack the setup.
