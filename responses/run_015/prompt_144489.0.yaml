answer: |-
  Here is the analysis of the Swiss and UK crustacean policies through the "welfare leakage" framework.

  ### Actor Mapping & Predictions

  Under welfare leakage, regulations increase the "cost of conscience" in the regulated zone, incentivizing actors to arbitrage suffering elsewhere.

  | Actor | Incentive under Regulation | Welfare Leakage Prediction |
  | :--- | :--- | :--- |
  | **Farm Operators (CH/UK)** | Face capital costs for stunning tech; compliance risk. | Reduce output or exit market; pivot to higher-margin "humanely certified" niches leaving bulk demand unserved. |
  | **Wild Fishers (Global)** | Operate outside stunning mandates; high bycatch tolerance. | Capture displaced demand; market "wild-caught" as premium/natural to bypass welfare scrutiny. |
  | **Supermarkets** | Minimize shelf-price shock; maintain supply continuity. | Shift sourcing from regulated live/farmed to unregulated frozen/wild imports where compliance costs are externalized. |
  | **Regulators** | Maximize domestic welfare metrics; minimize political friction. | Blind spot: Measure success by domestic compliance rates, not consumption-based suffering footprints. |
  | **Consumers** | Maintain protein habits; price sensitivity varies. | If demand is inelastic, pay price hikes; if elastic, switch to unregulated wild alternatives (the leakage vector). |

  ### Policy Analysis Through the Lens

  **Switzerland (2018 Live Boiling Ban):**
  The ban effectively prohibits importing live lobsters unless stunned prior to transport (technologically difficult). This creates a supply shock.
  *   **Leakage Mechanism:** High. Since domestic farming of lobsters is negligible, Switzerland relies on imports. If live imports are restricted, supply shifts to frozen tails or meat processed in jurisdictions with no stunning laws (e.g., North America, Asia). The killing still happens, but the *method* reverts to boiling or freezing without electrical stunning, and the *location* moves to unregulated waters.
  *   **Prediction:** Importers stop bringing live lobsters to Zurich and start bringing frozen meat from Maine or Canada. Suffering per unit likely increases because wild capture involves bycatch and no pre-slaughter stun.

  **UK (Sentience Act Inclusion):**
  Recognizing decapods/cephalopods as sentient mandates welfare considerations in policy, potentially leading to stunning requirements.
  *   **Leakage Mechanism:** Medium-High. If UK farmers face high compliance costs, they may reduce stock. Retailers, facing higher prices for UK farmed shrimp, may source wild-caught shrimp from India or Ecuador where labor and welfare costs are lower.
  *   **Prediction:** A shift in label mix from "UK Farmed" to "Wild Caught [Non-EU]" on supermarket shelves.

  ### Real-World Response: Elasticity vs. Location

  You noted that wild imports ticked up while demand remained inelastic (consumers paid more rather than ate less). This is the critical stress test for the theory.

  **Does this confirm leakage?**
  Yes. Carbon leakage occurs when emissions move to lax jurisdictions, even if global volume stays flat. Similarly, if consumers pay a premium for regulated shrimp but retailers fill the gap with unregulated wild shrimp to keep prices stable, the *source* of suffering shifts to a higher-intensity zone. Wild capture generally entails higher suffering per unit than farming (bycatch mortality, slower death on boats, no stunning). If volume is constant but the mix shifts from 80% farmed/20% wild to 50% farmed/50% wild, total suffering rises.

  **Does this break the theory?**
  Only if you define leakage strictly as "increased total volume of production." If you define it as "increased total units of suffering," the theory holds. The inelastic demand is actually *worse* for welfare outcomes than elastic demand would be. If demand were elastic, people would eat less shrimp, reducing total suffering. Because demand is inelastic, the market absorbs the cost by finding cheaper (crueler) supply chains. The harm shifts location *and* intensifies per unit, which confirms the leakage dynamic.

  ### Where the Theory Goes Silent

  Welfare leakage is a consequentialist metric; it counts pain units. It goes silent on **complicity**.

  1.  **Moral Purity vs. Net Good:** A Swiss regulator can claim victory because no lobster is boiled *in Switzerland*. The theory calls this a failure if a lobster is boiled *for* Switzerland in Canada. The theory cannot adjudicate whether "clean hands" (domestic ban) has intrinsic moral value separate from the outcome.
  2.  **Visibility of Harm:** Leakage often hides suffering. Boiling a lobster in a Zurich kitchen is visible; industrial stunning (or lack thereof) on a trawler in the Atlantic is invisible. The theory treats hidden pain equal to visible pain, but political will does not.
  3.  **The Baseline Problem:** We lack a precise "suffering exchange rate." Is one minute of boiling equal to one hour of trawling bycatch? The theory requires a common currency of pain that science hasn't fully minted yet.

  Bottom line: Welfare leakage survives this episode as a valid descriptive mechanism, provided you measure success by total pain rather than domestic purity.
