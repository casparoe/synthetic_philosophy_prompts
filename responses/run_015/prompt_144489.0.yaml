  2.  **Deconstruct "Welfare Leakage":**
      *   *Core Premise:* Regulation $\rightarrow$ Increased Cost/Reduced Supply in Regulated Zone $\rightarrow$ Demand Shifts to Unregulated Zone $\rightarrow$ Net Suffering Increases (because unregulated methods are crueller).
      *   *Analogy:* Carbon Leakage (emissions move to countries with lax climate laws).
      *   *Key Variable:* Elasticity of demand. If demand is inelastic, people pay more. If elastic, they switch sources.

  3.  **Analyze the Policies:**
