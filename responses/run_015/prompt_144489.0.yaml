      *   **UK (2021/2022):** Decapods and cephalopods recognized as sentient under Animal Welfare (Sentience) Act. Impacts farming, transport, and killing methods.

  4.  **Map the Actors & Predictions (under Welfare Leakage Theory):**
      *   *Farm Operators (Regulated):* Face higher costs (stunning tech, compliance). Might exit market or raise prices.
      *   *Wild Fishers (Unregulated/Less Regulated):* Potential beneficiaries. If farmed supply shrinks/costs rise, wild catch becomes relatively cheaper or more attractive. *Crucial Point:* Wild catch often involves bycatch and no stunning at all.
