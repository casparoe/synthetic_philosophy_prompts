  But $P(\{6, 1\})$ will change drastically because 1 is now low weight and 5 is high.
  To maintain $P(A \to B) = 1/3$, we must switch the truth condition from 1 to 5.
  So truth conditions depend on probability distribution.
  Okay, the math holds up. I will specify this clearly in the plan.

