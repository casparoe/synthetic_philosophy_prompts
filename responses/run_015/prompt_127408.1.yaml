answer: |-
  Here is a battle plan for the seventy-five minutes. It is designed to leverage the psychologists' technical fluency against their semantic intuitions, forcing the philosophers to keep the logic tight.

  ### I. The Sequence of Dependencies

  Your intuition about the shape is correct, but the load-bearing step needs to be highlighted more aggressively. The collapse does not happen because of the math; it happens because of the **invariance of meaning**.

  **The Order:**
  1.  **The Ontology (0–10 mins):** Propositions are sets of possibilities (worlds/outcomes). Credence is a probability measure over these sets.
      *   *Dependency:* None. This is common ground.
  2.  **The Constraint (10–20 mins):** The Equation (CE). $P(A \to B) = P(B|A)$.
      *   *Dependency:* Acceptance that "If A, B" expresses a proposition (a set of outcomes) to which we can assign a probability.
      *   *Note:* Frame this not as "psychological data" but as a *adequacy condition* for semantics. If your semantics can't match this, it's the wrong semantics.
  3.  **The Fit (20–35 mins):** Constructing truth conditions for a *single* credence function.
      *   *Dependency:* The Die Example. Show that for *one* specific distribution, you can draw a circle on the board (a proposition) that satisfies CE.
      *   *Load-Bearing Premise 1:* The circle you drew represents the *meaning* of the sentence.
  4.  **The Shift (35–50 mins):** Changing the credence function while holding the meaning fixed.
      *   *Dependency:* **Load-Bearing Premise 2:** Semantic content is invariant across epistemic states. (The proposition doesn't change just because you learned something).
      *   *The Move:* Apply the Law of Total Probability to the *same* proposition under a *new* measure. Show that CE fails unless the proposition changes.
  5.  **The Triviality (50–55 mins):** The Dilemma.
      *   *Dependency:* The failure in step 4.
      *   *Conclusion:* You cannot hold (1) Propositions, (2) CE, and (3) Standard Probability together. One must go.

  **Where the Collapse Happens:**
  The collapse is not in the algebra; it is in the transition from Step 3 to Step 4. If you allow the truth conditions to change when the probabilities change, you haven't proved triviality; you've proved that meaning is fluid. You must explicitly stipulate that **semantics is static, credence is dynamic.**

  ### II. The Carrying Example: The Covered Die

  Your die example is the correct vehicle. It is discrete, countable, and intuitively clear. However, you must tighten the "re-weighting" phase to ensure the psychologists see the violation of the Law of Total Probability.

  **What the Example Must Have:**
  *   **Three Partitions:** $A \cap B$ (Six), $A \cap \neg B$ (Even, not Six), $\neg A$ (Odd).
  *   **Initial Symmetry:** Start with uniform weights (1/6 each) to make the initial "fit" easy to calculate on the board.
  *   **The "Gerrymander":** You must show that to satisfy CE initially, the conditional proposition must include the $A \cap B$ world *plus* a specific subset of $\neg A$ worlds.
  *   **The Perturbation:** You must change the weights of the $\neg A$ worlds *relative to each other* without changing the ratio inside $A$.

  **What the Example Must Lack:**
  *   **Causal Language:** Do not say "rolling a six causes it to be even."
  *   **Temporal Shifts:** The die is already rolled. This is about epistemic uncertainty, not future contingency.
  *   **Zero Probabilities:** Ensure no outcome has probability 0 initially, or conditioning becomes undefined.

  **The Board Work (Visual Script):**
  1.  Draw 6 dots labeled 1–6.
  2.  Circle 2, 4, 6 ($A$). Box 6 ($B$).
  3.  Write $P(B|A) = 1/3$.
  4.  Ask: "Which dots make 'If Even, then Six' true?"
  5.  They will agree 6 must be in. To get probability $1/3$ (2 dots), exactly one odd number (say, 1) must be included.
  6.  **The Trap:** Draw a cloud around {1, 6}. Label it "The Proposition."
  7.  **The Shift:** Erase the weights. Assign: $P(5) = 0.4$, $P(1) = 0.01$, keep relative weights of 2, 4, 6 same.
  8.  Calculate: $P(B|A)$ is still $1/3$ (internal ratio of A is unchanged).
  9.  Calculate: $P(\text{The Proposition}) = P(1) + P(6)$. This is now tiny (approx 0.01 + small).
  10. **The Violation:** $P(A \to B) \neq P(B|A)$.
  11. **The Fix:** To restore equality, you must move the cloud from {1, 6} to {5, 6}.
  12. **The Question:** "Did the meaning of 'If even, then six' change when I changed the probability of 5?"

  **Re-weighting Strategy:**
  Use a **re-weighting of the same die**. Do not switch scenarios. The point is that the *language* must remain stable while the *evidence* shifts. If you change the scenario, they will think you changed the context of utterance.

  ### III. The Misconception Map

  Do not wait for these to arise. Pre-empt them at the specific moment they become tempting.

  | Misconception | When to Head Off | How to Head Off |
  | :--- | :--- | :--- |
  | **"This is just the Material Implication complaint."** | **Step 2 (The Constraint).** | Explicitly state: "We are not assuming the conditional is material. We are assuming it has *some* truth conditions. Lewis proves *no* truth conditions work." |
  | **"Psychological data settles the semantics."** | **Step 2 (The Constraint).** | Distinguish descriptive from normative. "CE isn't just how people bet; it's a constraint on what 'if' means. If semantics can't model the data, semantics is broken." |
  | **"Conditionals aren't T/F (No Propositions)."** | **Step 5 (The Dilemma).** | Frame this as *one* horn of the trilemma. "Lewis doesn't prove this; he proves you must choose this OR give up CE OR give up Probability Theory." |
  | **"This breaks Bayesian Updating."** | **Step 4 (The Shift).** | "Lewis *uses* Bayesian updating to prove the problem. The math is safe; the object of the math (the proposition) is the casualty." |
  | **"Triviality means Prob = 0 or 1."** | **Step 5 (The Dilemma).** | "Triviality means the *language* collapses (all conditionals are independent), not that your credences must be extreme." |
  | **"If is a Restrictor (No Proposition)."** | **Q&A / Escape Routes.** | **Concede:** "This is the standard philosophical escape. It denies Premise 1." **Decline:** "We cannot adjudicate the syntax of 'if' today. We are testing the consequences of assuming it *is* a proposition." |
  | **"Conditional Probability is Primitive."** | **Q&A / Escape Routes.** | **Concede:** "This denies the Kolmogorov ratio definition." **Decline:** "Psychologists here use the ratio. If you abandon it, you abandon the standard calculus you use for modeling." |

  **Handling the ML Friend's Objections:**
  *   *Objection 1 (Material Implication):* Address in Step 2.
  *   *Objection 2 (Empirical Finding):* Address in Step 2 (Normative vs Descriptive).
  *   *Objection 3 (Primitive Probability):* Address in Escape Routes. This is the "Popper Function" escape. Acknowledge it requires a non-Kolmogorov framework.

  ### IV. The Check

  Your proposed question is excellent. It targets the confusion between semantics and pragmatics directly. Do not change the scenario, but sharpen the rubric.

  **The Question:**
  "A student says: 'Fine. I accept Lewis. My solution is this: The proposition expressed by "If A, B" is fixed by my *current* credence function. It is true at A&B worlds plus enough A-free worlds to match $P(B|A)$. When I update my credences, I update which worlds make the sentence true.' What has this student done?"

  **Right Answer:**
  "They have made meaning **credence-dependent**. They have violated the **compositionality** or **stability** of language. Two agents with different evidence would speak different languages when using the same words. Communication becomes impossible because I cannot evaluate your assertion without knowing your prior."

  **Wrong Answer (The Trap):**
  "They have solved the problem by allowing dynamic truth conditions." (This misses that this is a *cost*, not a solution).
  "They have shown conditionals are pragmatic." (Too vague).
  "They have preserved Bayesianism." (Irrelevant).

  **Why this works:** It forces them to see that the "gerrymandering" you demonstrated on the board isn't a bug they can fix locally; it's a feature that destroys the public nature of language.

  ### V. What to Leave Out (And Say You Are)

  You have 75 minutes. You must explicitly prune the tree to keep the trunk visible.

  1.  **Subjunctive Conditionals:** "We are talking only about indicatives regarding unknown past/future events. Subjunctives involve similarity metrics that complicate the logic."
  2.  **The Algebraic Proof:** "I am not going to derive the equation $P(B|A) = P(B)$. I am going to show you the geometric impossibility on the board. The algebra follows the picture."
  3.  **Stalnaker vs. Lewis:** "There are nuances in how different philosophers formulate the triviality, but the core tension is invariant. We are attacking the core."
  4.  **Tri-valued Logics:** "Some suggest conditionals are neither true nor false when A is false. That is one way out (no proposition), but we are exploring the cost of assuming they *are* T/F."

  **Opening Script for Pruning:**
  "We have seventy-five minutes. Lewis's result interacts with syntax, metaphysics, and decision theory. Today we are doing **semantic geometry**. We are asking: Can you draw a shape in probability space that always matches a ratio? If we drift into syntax or metaphysics, I will pull us back to the board."

  ### VI. Summary of the "Load-Bearing" Moment

  When you are at minute 40, standing between the "Fixed Proposition" and the "Shifted Weights," stop. Look at the room.

  Say this:
  *"The psychologists in the room know that probabilities change. The philosophers in the room know that meanings shouldn't. Lewis forces these two to collide. If the meaning stays fixed, the probability of the conditional diverges from the conditional probability. If the probability stays matched, the meaning must shift. You cannot have both."*

  That is the moment they walk into the trap. Ensure the silence after that sentence lasts for five seconds.
