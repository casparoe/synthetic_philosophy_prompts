answer: |-
  To construct a theory of pleasure capable of housing your character's specific psychology—where the thrill of a stranger's victory weighs the same as the taste of salt, and where the awareness of being watched amplifies the sensation—you must navigate the Heterogeneity Problem without collapsing the nuances that make her experience distinct.

  Below is the framework of desiderata required for such a theory. I have weighted them by conceptual force, distinguishing between those that define the phenomenon (Non-Negotiable) and those that define specific theoretical traditions (Negotiable).

  ### I. The Desiderata List

  #### 1. The Phenomenal Positivity Constraint (Non-Negotiable)
  *   **The Requirement:** Whatever commonality the theory posits, it must account for the fact that all instances of pleasure are *experienced* as positive. They are states the subject, ceteris paribus, prefers to sustain rather than terminate.
  *   **Motivating Case:** Contrast the relief of a migraine (pleasure) with the mere cessation of a boring lecture (neutral). Both remove a negative, but only the former has a positive "glow." If a theory cannot distinguish between "the absence of pain" and "the presence of pleasure," it fails to capture the character's active pursuit of these states.
  *   **Cost of Dropping:** If you drop this, you are no longer describing pleasure; you are describing homeostasis or indifference.

  #### 2. The Desire-Independence Constraint (Non-Negotiable)
  *   **The Requirement:** The theory must decouple pleasure from the satisfaction of antecedent desires. Pleasure must be possible without prior want, and desire-satisfaction must be possible without pleasure.
  *   **Motivating Case:** Your character's "sweet unsatisfied desire" (longing that feels good) vs. "cold satisfaction" (getting what she wanted but feeling nothing). A desire-fulfillment theory cannot explain why the *frustration* of a desire can sometimes be more affectively potent (sweeter) than its fulfillment.
  *   **Cost of Dropping:** If you drop this, you reduce pleasure to a scorecard of goal achievement. This eliminates "shadow pleasures" (moods without objects) and "displaced pleasures" (where she may not have actively desired the stranger's triumph beforehand).

  #### 3. The Intentional Flexibility Constraint (Non-Negotiable)
  *   **The Requirement:** The theory must accommodate pleasures that have specific objects (eating an apple, witnessing a rival's failure) and pleasures that lack specific objects (free-floating euphoria, "shadow pleasures").
  *   **Motivating Case:** "Shadow pleasures" lack bodily localization and a clear intentional object. If the theory requires pleasure to be *about* something (an attitude toward a proposition), shadow pleasures become impossible. If the theory requires pleasure to be a *sensation* in a body part, displaced pleasures (which are cognitive) become impossible.
  *   **Cost of Dropping:** If you drop this, you must reclassify half of your character's inner life as "not pleasure." You lose the vicarious thrill (too cognitive) or the mood (too vague).

  #### 4. The Valence Consistency Constraint (Negotiable)
  *   **The Requirement:** The theory should explain why all these diverse states function as a common currency for motivation. They should all "push" in the same direction, even if the intensity varies.
  *   **Motivating Case:** Why does the character trade time for both gustatory and vicarious pleasure? They must be commensurable enough to be weighed against one another in decision-making.
  *   **Cost of Dropping:** If you drop this, pleasure becomes a fragmented category. The character isn't a hedonist; she is a collection of disparate impulse systems. This is a viable psychological model but abandons the philosophical unity of "hedonism."

  #### 5. The Phenomenological Uniformity Constraint (Negotiable — *Must be Rejected*)
  *   **The Requirement:** (Traditional View) There is a single, identifiable qualitative "feel" (a *quale*) present in all pleasures, like a common thread in a rope.
  *   **Motivating Case:** This is the traditional target of the Heterogeneity Problem. Introspection reveals no common "tingle" shared by smelling rain and feeling schadenfreude.
  *   **Cost of Dropping:** None. In fact, retaining this costs you the phenomenon. To account for your character's complex psychology, you *must* abandon the idea that pleasure is a single sensation.

  #### 6. The Ontological Singularity Constraint (Negotiable — *High Risk*)
  *   **The Requirement:** Pleasure must be one *kind* of thing (e.g., all sensations, or all attitudes), not a disjunction of different kinds.
  *   **Motivating Case:** Traditional hedonism seeks a unified account of the Good.
  *   **Cost of Dropping:** If you drop this, you accept a Pluralist Ontology. Pleasure might be a sensory state in the body and an attitudinal state in the mind, linked only by function. This saves the phenomena but weakens the theoretical elegance.

  ---

  ### II. The Fracture: Where the Desiderata Conflict

  There is a specific tension in this framework that threatens to break the theory. It occurs between **Desideratum 3 (Intentional Flexibility)** and **Desideratum 6 (Ontological Singularity)**, mediated by **Desideratum 1 (Phenomenal Positivity).**

  **The Tension:**
  To satisfy **Intentional Flexibility**, you need a mechanism that can latch onto external events (displaced pleasure) *and* exist without an object (shadow pleasure).
  *   If you choose a **Somatic Theory** (pleasure is a bodily sensation), you satisfy Shadow Pleasure (moods have somatic components) but fail Displaced Pleasure (a stranger's triumph has no direct bodily location).
  *   If you choose an **Attitudinal Theory** (pleasure is taking satisfaction *in* a state of affairs), you satisfy Displaced Pleasure (I take satisfaction in her win) but fail Shadow Pleasure (what proposition am I attitudinizing toward if the pleasure is objectless?).

  **The Fracture Point:**
  To resolve this, most modern theories abandon **Ontological Singularity**. They argue that "pleasure" is a functional role played by different mechanisms in different contexts.
  *   *The Consequence:* If you abandon Singularity, you undermine the **Valence Consistency**. If the mechanism for gustatory pleasure is biologically and phenomenologically distinct from the mechanism for recursive social pleasure, why do they sum together? Why doesn't the character experience them as incommensurate, like adding "meters" to "kilograms"?
  *   *The Novelist's Dilemma:* If you resolve the heterogeneity by saying "these are just different things we label pleasure," you lose the character's conviction that they are part of a single economy of enjoyment. If you insist they are one thing, you cannot explain their diversity without inventing a "ghost sensation" that doesn't exist.

  **Resolution:** The only way to satisfy all Non-Negotiables is to posit that the "commonality" is not a *substance* or a *sensation*, but a **mode of attention**. Pleasure is not *what* is felt, but *how* the mind holds the experience (whether sensory or cognitive). It is a "pro-attitude" that can be directed at a taste, a thought, or nothing at all (a global stance toward existence). However, this risks making pleasure too cognitive, violating the immediacy of sensory joy.

  ---

  ### III. The Mind-Changing Argument

  I would conclude the Heterogeneity Problem is genuinely unresolvable (and that "pleasure" is a failed natural kind) if presented with the following empirical/conceptual demonstration:

  **The Dissociation Counterexample:**
  A case where a subject reports intense "pleasure" (using all standard linguistic markers, seeking repetition, rating it highly) but exhibits **zero** convergent markers of positive valence.
  *   *Physiological:* Stress markers (cortisol) rise; reward circuitry (dopaminergic pathways) remains inactive or inhibits.
  *   *Behavioral:* The subject actively avoids the state when not reflecting on it, only seeking it under coercion or confusion.
  *   *Phenomenological:* Upon reflection, the subject admits the state feels "heavy" or "painful," yet insists, "This is my pleasure."

  If a state can be linguistically classified as pleasure while lacking positive phenomenology, motivational pull, *and* neural reward signatures, then "pleasure" is purely a social label with no psychological reality. It would prove that the Heterogeneity Problem isn't a puzzle to be solved, but a category error to be dissolved.

  ---

  ### IV. The Weakest Point: The Target for the Family Resemblance Critic

  The weakest point in the framework constructed above is **Desideratum 1 (Phenomenal Positivity)** interpreted as a *necessary condition*.

  **The Critic's Attack:**
  A Wittgensteinian "Family Resemblance" critic will argue that there is no single thread of "positivity" running through all cases.
  *   *The Argument:* They will point to **Masochistic Pleasure** or **Tragic Absorption**. In these states, the phenomenology includes pain, sadness, or distress. The "positivity" is not in the feel, but in the *endorsement*.
  *   *The Break:* If the "positivity" is just the endorsement, then we are back to Desire/Attitude theories, which you have marked as needing to be distinct from Desire (Desideratum 2).
  *   *The Vulnerability:* The framework assumes there is a *boundary* between pleasure and non-pleasure. The Family Resemblance critic argues there is only a gradient of overlapping similarities. Some pleasures share sensation, some share objects, some share motivation, but none share all three.
  *   *Why it breaks the framework:* If the critic is right, your search for a "theory resolving the problem" is futile. There is no solution because there is no problem—only a linguistic habit of grouping disparate states. For your novelist's purpose, this means the character's search for the "essence" of her enjoyment might be the very tragedy of her psychology: she is looking for a unity that nature did not provide.

  ### Summary for the Novelist
  To write this character credibly:
  1.  **Do not** describe a common "feeling" across her experiences. That is psychologically false.
  2.  **Do** describe a common *orientation*. She leans into these moments. She grants them authority over her.
  3.  **The Conflict:** Her struggle should not be finding the pleasure, but reconciling the fact that her "shadow pleasures" feel nothing like her sensory ones, yet demand the same tribute.
  4.  **The Fracture:** The theory breaks if you insist the *source* of the pleasure must be the same. It holds if you argue the *function* of the pleasure (to validate existence) is the same.

  The most philosophically robust position for her is that pleasure is not a sensation she finds, but a **stance she takes**. She does not discover the pleasure in the stranger's triumph; she *confers* it by the act of witnessing. This resolves the heterogeneity (the objects change) while preserving the unity (the act of conferral remains).
