answer: |-
  Here are ten interview questions designed to press the specific philosophical limits of the "consistency condition" defense of revealed preference. They are structured to prevent your economist from retreating into standard textbook definitions, pushing instead toward the normative cracks in the theory.

  Each question includes a **"Likely Defense"** (what he will probably say to protect the theory) and a **"Follow-Up"** (designed to corner that defense).

  ### 1. The Welfare Gap (Mandatory Topic)
  **Question:** You define utility strictly as a mathematical representation of consistent choices, not a measure of happiness or psychological satisfaction. But this is a *welfare* economics department. If a person consistently chooses alcohol over food, your model says they are maximizing utility. On what grounds can you claim that person is actually *better off*? If utility is just consistency, doesn't it lose its normative force?

  *   **Likely Defense:** He will argue that economics shouldn't define "better off" for people; it should only respect their sovereignty. He will say we measure *preference satisfaction*, not *well-being*, and that conflating the two is paternalistic.
  *   **Follow-Up:** "So if I design a policy that increases preference satisfaction but decreases actual well-being—say, by marketing addictive drugs more efficiently—your model labels that a 'welfare improvement'? If 'welfare' in this department doesn't mean human flourishing, what work is the word doing other than comforting us?"

  ### 2. The Inconsistency Trap (Mandatory Topic)
  **Question:** Let's say we observe a subject who violates the Weak Axiom of Revealed Preference. They choose A over B today, but B over A tomorrow, with no change in prices or income. Do you say this person is irrational, or do you say your theory simply doesn't apply to them?

  *   **Likely Defense:** He will likely say the theory doesn't apply to that specific instance or person, or that "context" changed (making A today a different good than A tomorrow).
  *   **Follow-Up:** "If every time the data violates the axiom you simply declare the theory 'inapplicable' or redefine the goods to restore consistency, isn't the theory unfalsifiable? It seems you've constructed a definition of rationality that is true by definition, but only for the people who already fit the model."

  ### 3. The Interpersonal Problem (Mandatory Topic)
  **Question:** If utility is merely a private consistency condition—a way of indexing one person's choices against their own past choices—it contains no unit of measurement. So how do you weigh Person A's losses against Person B's gains? If I can't measure the size of their utility, only its existence, how do you justify any policy that has both winners and losers?

  *   **Likely Defense:** He will retreat to the Pareto Principle: we only endorse changes where someone gains and no one loses. He will admit interpersonal comparisons are "unscientific."
  *   **Follow-Up:** "But almost every real-world policy creates losers. If you rule out interpersonal comparisons as unscientific, aren't you rendering welfare economics powerless to advise on anything other than the most trivial, uncontroversial changes? Is a department dedicated to 'welfare' content with only studying policies that require no trade-offs?"

  ### 4. The "As If" Defense
  **Question:** You often say agents act *as if* they are maximizing a function. But in physics, if a planet acts *as if* it's moving through an ether, but the ether doesn't exist, the model eventually breaks. If the psychological mechanism isn't real, and people are actually using heuristics or habits, where does the "as if" prediction fail?

  *   **Likely Defense:** He will cite Milton Friedman's instrumentalism: it doesn't matter *why* they do it, only that the model predicts aggregate market behavior accurately.
  *   **Follow-Up:** "Prediction is fine for stock markets. But for *welfare*, we care about the mechanism. If a person is consistently choosing against their own interests due to a cognitive bias, the 'as if' model says they're rational. Doesn't relying on 'as if' blind you to the exact moments where policy intervention could actually help them?"

  ### 5. Time and Changing Tastes
  **Question:** Revealed preference assumes a stable ordering of preferences. But people change their minds as they age or learn. If a young person chooses to smoke, and an old person chooses they wish they hadn't, which choice reveals their 'true' utility?

  *   **Likely Defense:** He will argue that the "young person" and "old person" are effectively different agents with different preference sets, and we must respect the preference at the time of the choice.
  *   **Follow-Up:** "If we treat every temporal version of a person as a different agent, we can't criticize addiction or procrastination, because the 'current self' always wins. Doesn't this fragment the human being into a series of strangers, making it impossible to talk about a person's 'long-term interest' at all?"

  ### 6. Framing and Context
  **Question:** Behavioral economics shows that changing how a choice is framed changes the choice, even if the economic outcome is identical. If I choose an option because it's labeled '90% fat-free' rather than '10% fat,' have my preferences changed, or was my consistency broken?

  *   **Likely Defense:** He will argue that the "frame" is part of the good itself. Choosing A in Frame 1 is a different commodity than Choosing A in Frame 2. Therefore, consistency is maintained.
  *   **Follow-Up:** "If you add the frame, the context, and the psychological state into the definition of the 'good,' doesn't the utility function become infinitely flexible? If every violation of rationality can be explained away by redefining the good, what constraints are left on the theory?"

  ### 7. Ignorance and Information
  **Question:** Does a choice reveal preference if the agent is operating on false information? If I drink poison because I think it's water, did I reveal a preference for poison?

  *   **Likely Defense:** He will say revealed preference deals with *choices*, not *outcomes*. The agent chose the liquid they believed was water; the model accounts for beliefs as constraints.
  *   **Follow-Up:** "But if welfare is about satisfying preferences, and my preference was contingent on a false belief, satisfying that choice leaves me worse off. If your theory treats the choice to drink poison as a valid revelation of utility, isn't it measuring the satisfaction of impulses rather than the welfare of the human?"

  ### 8. The Empty Tautology
  **Question:** Afriat's Theorem proves that any finite set of choice data can be rationalized by *some* utility function if you allow the function to be complex enough. If any set of choices can be modeled as maximizing *some* function, what does it actually mean to say a person is 'maximizing'?

  *   **Likely Defense:** He will argue that while mathematically possible, we look for *parsimonious* functions. We prefer simple explanations over complex ones.
  *   **Follow-Up:** "But 'parsimony' is an aesthetic choice by the economist, not a fact about the agent. If the theory can fit any data given enough complexity, isn't 'utility maximization' just a language we use to describe behavior, rather than an explanation of it? It sounds like you're saying 'people do what they do because it's what they did.'"

  ### 9. The Normative Leap
  **Question:** You insist revealed preference is a positive (descriptive) theory, not a normative (ethical) one. Yet you work in a department tasked with improving social welfare. How do you bridge the gap from "people choose X" to "society should facilitate X" without smuggling in a moral judgment?

  *   **Likely Defense:** He will claim the moral judgment is "consumer sovereignty"—the idea that individuals are the best judges of their own interest.
  *   **Follow-Up:** "That *is* a moral judgment, not an economic fact. It's a philosophical commitment to individualism. If that commitment is wrong—if sometimes communities or future selves are better judges—does your entire welfare framework collapse? It seems your economics rests on an ethical premise you refuse to defend."

  ### 10. The Ultimate Utility of the Theory
  **Question:** If utility is not a psychological state, not a measure of happiness, not comparable across people, and only applicable when choices are already consistent, what is the "utility" of revealed preference theory itself? What problem does it solve that simply observing behavior wouldn't?

  *   **Likely Defense:** He will say it provides a rigorous structure for counterfactuals. It allows us to predict how people will react to *new* prices or budgets they haven't seen before.
  *   **Follow-Up:** "It predicts reactions to constraints, but it cannot evaluate the constraints themselves. So, your theory can tell a dictator how to maximize extraction from his subjects, or a charity how to maximize aid, with equal precision. If the theory is morally neutral to that degree, why do we treat it as a tool for *social improvement* rather than just social engineering?"
