      OFFICE OF REVEALED WELFARE ASSESSMENT
      Circular No. 2024-09
      SUBJECT: Standardization of Welfare Metrics via Observed Choice

      1. **Purpose and Scope**
      This Circular establishes procedural standards for benefit-cost analysis across federal agencies. Consistent with statutory mandate, the Office of Revealed Welfare Assessment (ORWA) defines welfare strictly through observed choice behavior. Mental states, including reported satisfaction or regret, are classified as untested testimony and are inadmissible against a completed transaction. Agencies must proceed from the axiom that utility is not a psychological condition but an index rendering observed choices consistent with maximization.

      2. **Unit Measurement and Numeraire**
      Utility functions are ordinal; any positive affine transformation preserves the ranking of bundles. Consequently, the raw index lacks natural magnitude. To aggregate benefits, agencies shall apply a statutory welfare numeraire. One Util is defined as equivalent to $1.00 (2024 dollars) at the margin.
      *Worked Example:* An agent chooses Bundle A ($100) over Bundle B ($90). The revealed preference implies U(A) ≥ U(B). Under the numeraire, the welfare gain is recorded as the expenditure difference ($10). If an agency applies a conforming transformation, it must preserve this exchange rate. Non-conforming rescalings that alter the dollar-utils slope are prohibited.

      3. **Data Hygiene and Consistency**
      Choice datasets must satisfy the Generalized Axiom of Revealed Preference (GARP). Where observed behavior violates rationalizability by a stable ordering—such as a household purchasing cigarettes in Week 1 and a cessation program in Week 2—agencies shall not infer preference reversal. Instead, treat the data as a hygiene error. Partition the goods into non-comparable accounts or treat the household as a sequence of temporally distinct agents. This procedural adjustment restores consistency without substantive judgment on the agent's stability.

      4. **The Latent Feasibility Doctrine**
      Because preference is defined by choice, an agent cannot be mistaken regarding wants. If a desired good is not chosen, it is reconstrued as infeasible. This applies even where constraints appear transparent. For populations experiencing deteriorating circumstances but unchanged choice patterns (adaptive narrowing), the welfare loss is amortized. A zero-change in choice over a five-year period results in a zero welfare loss score, regardless of objective deprivation. The constraint is deemed to have become latent, rendering the unchosen option unavailable in the relevant sense.

      5. **Distributional Weights**
      The utility index is non-comparable across persons. However, policy requires weighting benefits by recipient. Agencies shall apply distributional weights as administrative parameters, not as interpersonal comparisons of well-being. The weights reflect legislative priority, not measurable differences in utility capacity. This distinction ensures compliance with ordinality requirements while permitting targeted allocation.

      6. **Internal Operations**
      ORWA's own budgetary choices reveal its preferences. Criticism of internal allocation is therefore inconsistent with observed behavior. If the Office chooses to expend resources on analysis, it reveals a preference for analysis over alternative uses. No further justification is required.

      7. **Illustrative Case: Forced Savings**
      Consider a household reporting a desire to save more but failing to do so. A policy mandating savings reduces current consumption. Under revealed preference, the choice to consume now reveals a higher valuation of present goods. Forcing savings is scored as a welfare loss equal to the willingness-to-accept compensation required to forego consumption.^1 The reported desire to save is testimony, not choice, and holds no weight against the transaction.

      8. **Limitations**
      These procedures rely on complete transaction data. Gaps in recording may imply zero welfare impact where none exists. Additionally, the distinction between tastes and constraints remains unidentified; agencies must assume constraints are fully reflected in prices. Future circulars may address identification errors, though no theoretical adjustments are anticipated.

      ^1 See Memo from Dr. Aris Thorne (Internal Dissent), regarding "mental states," filed 2023-11-02. Dismissed on procedural grounds: testimony lacks verifiability standards required for cost-benefit inclusion.

