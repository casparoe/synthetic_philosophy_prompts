answer: |-
  You have hit on one of the most famous and subtle controversies in quantitative finance and probability theory. Your intuition is sharp: there is a seeming contradiction between "maximizes long-run growth" and "almost surely leads to ruin."

  The short answer is: **In the idealized mathematical model, the claim that Full Kelly leads to almost sure ruin is false.** However, in the **real world** (due to estimation error, discrete constraints, and leverage), the claim is effectively true.

  Here is the breakdown of what you are missing, divided into the mathematical theory, the source of the confusion, and the practical reality.

  ### 1. The Mathematical Truth: Full Kelly Does Not Go to Zero
  In the standard theoretical formulation (infinite time horizon, infinite divisibility of capital, known probabilities), betting the Full Kelly fraction **does not** lead to ruin.

  *   **Wealth Dynamics:** If you bet the optimal Kelly fraction $f^*$, your wealth $W_t$ follows a geometric random walk with a positive drift (the geometric growth rate).
  *   **Almost Sure Convergence:** By the Law of Large Numbers applied to log-wealth, $\frac{1}{t} \log W_t \to g$ (where $g > 0$ is the growth rate). This implies that $W_t \to \infty$ almost surely as $t \to \infty$.
  *   **The Paradox Resolved:** A strategy that sends wealth to infinity cannot be one that sends wealth to zero. Therefore, mathematically, Full Kelly avoids ruin.

  So, if the math says you get rich, why does everyone say you go broke?

  ### 2. Source of Confusion A: "Overbetting" vs. "Full Kelly"
  The most common source of the "Kelly leads to ruin" warning is a conflation of **Full Kelly** with **Overbetting**.

  The Kelly function is symmetric in log-space but asymmetric in risk.
  *   **Underbetting ($f < f^*$):** Growth is reduced, risk is reduced.
  *   **Full Betting ($f = f^*$):** Growth is maximized.
  *   **Overbetting ($f > f^*$):** Growth decreases.
  *   **Double Kelly ($f = 2f^*$):** The expected geometric growth rate becomes **zero**. Your wealth becomes a martingale; you aren't growing.
  *   **Excessive Overbetting ($f > 2f^*$):** The geometric growth rate becomes **negative**. Your wealth converges to **zero almost surely**.

  **The Catch:** To calculate $f^*$, you need to know the true edge and probabilities. In trading, you never know these; you only have estimates. If you estimate your edge as 10% but it is actually 8%, and you bet Full Kelly based on the 10% estimate, you are mathematically **overbetting**.

  Because estimation error is inevitable, betting "Full Kelly" on your *estimates* almost invariably means you are betting "Over Kelly" on *reality*. **This is why practitioners say Full Kelly leads to ruin:** not because the formula is wrong, but because your inputs are noisy.

  ### 3. Source of Confusion B: Drawdowns vs. Ruin
  There is a subtlety regarding the *path* of your wealth. While Full Kelly wealth goes to infinity almost surely, the **volatility of the path** is extremely high.

  *   **Arbitrary Drawdowns:** While you won't hit zero, there is a high probability that at some point in an infinite horizon, your equity will drop to a tiny fraction of its peak (e.g., a 90% or 99% drawdown).
  *   **The "Ruin" Feeling:** If you drop 95% of your bankroll, you need a 1900% return just to get back to even. In the idealized model, you eventually recover. In the real world, a 95% drawdown triggers margin calls, psychological breakdowns, or investors pulling their capital.
  *   **Time to Recovery:** Full Kelly maximizes the *rate* of growth, but it does not minimize the *time* spent in drawdown. You might spend years recovering from a volatility spike.

  Some critics argue that because the probability of experiencing a drawdown of size $D$ approaches 1 as time goes to infinity (for sufficiently large $D$), the strategy is "practically ruinous," even if it is "mathematically solvent."

  ### 4. Source of Confusion C: Ergodicity and Ensemble vs. Time
  You mentioned maximizing "expected log wealth." This is where the definition of **optimal** gets subtle.

  *   **Ensemble Average (Expected Value):** If you maximize $E[W_T]$, you should bet 100% of your bankroll on every positive EV bet. This leads to ruin almost surely (Gambler's Ruin) because one loss wipes you out.
  *   **Time Average (Geometric Growth):** Kelly maximizes the time-average growth rate. This ensures that *your specific trajectory* grows, not just the average of all possible trajectories.

  The confusion often arises when people mix these frameworks. If you read a paper claiming "Full Kelly leads to ruin," check if they are introducing **transaction costs** or **discrete betting constraints**.
  *   **Discrete Constraints:** If you have \$100 and the Kelly fraction says bet \$10.50, you must round. If you have \$10 and Kelly says bet \$0.50, but the minimum bet is \$1, you are forced to overbet. Over infinite time, these forced overbets can lead to ruin.
  *   **Continuous vs. Discrete Rebalancing:** Kelly assumes you can rebalance continuously. In trading, you rebalance discretely. If a massive move happens between rebalances, you can be wiped out before you can reduce your position size.

  ### 5. So, what is "Optimal"?
  You asked if there is a subtlety about what "optimal" means. **Yes.**

  *   **Kelly Optimal:** Maximizes the asymptotic geometric growth rate. It ignores the *variance* of that growth and the *utility* of intermediate wealth.
  *   **Utility Optimal:** Most traders have a utility function that penalizes drawdowns (e.g., $U(W) = W^\gamma$ where $\gamma < 1$). For these utility functions, Full Kelly is too aggressive. The "optimal" bet for a human with risk aversion is **Fractional Kelly**.

  ### Summary: What you are missing
  1.  **The "Ruin" claim is technically false** in the idealized, continuous, known-probability model. Full Kelly wealth goes to infinity.
  2.  **The "Ruin" claim is practically true** because you cannot know the true probabilities. Betting Full Kelly on *estimated* edges usually results in *Overbetting*, which **does** lead to almost sure ruin.
  3.  **Drawdowns are not Ruin, but act like it.** Full Kelly guarantees massive drawdowns over long horizons. In the real world (margin calls, psychology), these function as ruin.
  4.  **Optimality is Contextual.** Kelly is optimal for *growth rate*, not for *survival probability* or *smoothness of equity curve*.

  **The Solution:** This is why almost no professional trader uses Full Kelly. The standard industry practice is **Half-Kelly** (or Quarter-Kelly).
  *   Betting Half-Kelly reduces your volatility by 50%.
  *   It reduces your expected growth rate by only 25%.
  *   It provides a massive buffer against estimation error (you can be wrong about your edge by a large margin and still not be "Over-Kelly").

  You aren't missing a math error; you are encountering the friction between **theoretical probability** and **parameter uncertainty**. The wall you hit is the realization that in trading, knowing *how much* to bet is harder than knowing *what* to bet.

  **Recommendation:** Treat Full Kelly as a theoretical upper bound, not a target. Aim for Fractional Kelly to account for the fact that your "edge" is a distribution, not a fixed number.
