answer: |-
  **ADVERSARIAL COLLABORATION MEMORANDUM**
  **Subject:** The Metaphysical and Normative Status of Supererogation
  **Parties:** Optionalist (Pro-Supererogation) vs. Eliminativist (Anti-Supererogation)

  ### 1. Agreed Claims (Common Ground)

  Both parties accept the following propositions as the baseline for this dispute. These claims delineate the phenomena any successful theory must accommodate and identify argumentative strategies that have proven fruitless.

  1.  **The Phenomenology of Moral Asymmetry:** In ordinary moral practice, there is a robust asymmetry between praise and blame. We praise agents who perform certain high-sacrifice, high-benefit acts, but we do not blame agents who omit them.
  2.  **The Non-Indifference Constraint:** Acts classified as "beyond duty" are not morally indifferent. They possess positive moral value and are generally morally better than their permissible alternatives.
  3.  **The Existence of Paradigm Cases:** Both parties agree on the classification of specific cases (e.g., risking one's life to save a stranger when not in a special role, giving away significant wealth to alleviate distant suffering). The dispute is not about how to label these cases in ordinary language, but about their underlying deontic structure.
  4.  **The Failure of Pure Intuitionism:** Mere appeal to the intuition that "it would be good if everyone did it, but not required" settles nothing, as this intuition is compatible with both a world where duty is limited and a world where duty is maximizing but our blaming practices are lenient.
  5.  **Concession by Optionalist:** The Optionalist acknowledges that not every act traditionally labeled "supererogatory" is genuinely so; some are simply duties disguised by social reluctance to enforce them (e.g., basic promise-keeping).
  6.  **Concession by Eliminativist:** The Eliminativist acknowledges that our blaming practices are not infallible guides to moral truth. The fact that we do not blame an agent does not logically prove the agent violated no duty, as blame may be withheld due to epistemic limits, the cost of blaming, or the counterproductivity of sanction.
  7.  **The Distinction between Evaluation and Obligation:** Both parties agree that "good" (evaluative) and "obligatory" (deontic) are conceptually distinct, even if they dispute whether the former ever fails to entail the latter.

  ### 2. Residual Disagreements

  The following table isolates the core points of contention. Each proposition is phrased such that the party in the left column accepts it as true, while the opposing party rejects it as false.

  | Issue | Optionalist Position (Accepts / Rejects) | Eliminativist Position (Accepts / Rejects) |
  | :--- | :--- | :--- |
  | **Ontology of the Category** | **Accepts:** There exists a distinct deontic category of acts that are morally optimal yet not obligatory. <br> **Rejects:** All morally optimal acts are obligatory. | **Accepts:** All morally optimal acts are obligatory; apparent exceptions are either duties we excuse or non-deontic goods. <br> **Rejects:** There exists a distinct deontic category of acts that are morally optimal yet not obligatory. |
  | **The Entailment Thesis** | **Accepts:** The fact that an act is the morally best available option does not entail that it is required. <br> **Rejects:** Moral optimality necessarily generates obligation. | **Accepts:** Moral optimality necessarily generates obligation (the "Ought Implies Best" principle). <br> **Rejects:** The fact that an act is the morally best available option does not entail that it is required. |
  | **The Function of Blame** | **Accepts:** The absence of blameworthiness for an omission is constitutive evidence that the act was not duty-bound. <br> **Rejects:** Blame is merely a pragmatic tool detached from the truth of deontic violations. | **Accepts:** Blame is a pragmatic social practice that may be withheld even when a duty has been violated. <br> **Rejects:** The absence of blameworthiness for an omission is constitutive evidence that the act was not duty-bound. |
  | **The Scope of Sacrifice** | **Accepts:** There is a limit to the sacrifice morality can demand, creating a zone of permission below the moral optimum. <br> **Rejects:** Morality demands the optimal outcome regardless of agent-cost, provided the cost is not self-annihilating. | **Accepts:** Morality demands the optimal outcome regardless of agent-cost (or defines "cost" such that it rarely overrides the optimum). <br> **Rejects:** There is a limit to the sacrifice morality can demand, creating a zone of permission below the moral optimum. |

  ### 3. The Cruxes: Test Cases and Predictions

  The following cruxes identify where the theoretical divergence yields different verdicts on concrete scenarios. Both parties agree these cases are probative.

  **Crux 1: Aggregation and Closure under Conjunction**
  *   **The Question:** Is the class of permissibly omitted acts closed under conjunction? If Act A is optional and Act B is optional, is the performance of (A & B) optional, or does iteration generate duty?
  *   **The Case:** *The Daily Coin.* An agent faces a choice every day for a year: donate a trivial sum (the price of a coffee) to a highly effective charity or keep it. One omission is blameless and optional on the Optionalist's view. Omitting every day results in a preventable death.
  *   **Optionalist Prediction:** Each individual act remains optional. The agent is not blameworthy for omitting the series, provided no single omission crossed a threshold of significant harm. The aggregate obligation does not emerge from a series of optional acts.
  *   **Eliminativist Prediction:** The series constitutes a single extended action or generates a cumulative duty. At some point $n$, the $n$-th omission becomes blameworthy. The class of optional acts is not closed under conjunction; iteration converts optionality into obligation.

  **Crux 2: Roles and Relationships**
  *   **The Question:** Do special relationships (parent, lifeguard, promisee) generate *sui generis* duties, or do they merely raise the cost threshold an agent is required to bear?
  *   **The Case:** *The Rough Sea.* A swimmer is struggling. A bystander risks minor injury to save them (Optionalist: optional; Eliminativist: duty). A lifeguard risks major injury to save them.
  *   **Optionalist Prediction:** The role raises the cost threshold the agent must bear before omission is permissible, but it does not structurally change the deontic category. If the risk to the lifeguard is extreme enough (e.g., near-certain death), the act remains optional, though the threshold is higher than for the bystander.
  *   **Eliminativist Prediction:** The role generates a new, specific duty that did not exist for the bystander. The omission by the lifeguard is a breach of obligation (blameworthy) even in cases where the bystander's omission would be permissible, because the role contractually or normatively binds the agent to the optimum regardless of the cost threshold that applies to strangers.

  **Crux 3: Blame as Evidence of Deontic Status**
  *   **The Question:** Is the absence of blame evidence about the deontic status of the act, or only about our blaming practices?
  *   **The Case:** *The Saintly Omission.* An agent devotes their life to moderate charitable work but could have done significantly more (becoming a "saint") without ruining their life. We do not blame them for not being a saint.
  *   **Optionalist Prediction:** The absence of blame tracks the truth: the agent violated no duty. The deontic status is "permissible," and our blaming practice correctly reflects this metaphysical fact.
  *   **Eliminativist Prediction:** The absence of blame tracks a pragmatic decision: blaming the agent would be counterproductive or overly harsh, even though they violated a duty (the duty to maximize the good). The deontic status is "impermissible," but our blaming practice correctly reflects social limits, not moral truth.

  ### 4. Closing Note: The Verbal Dispute

  A significant portion of this dispute turns on the definition of "duty" (or "obligation") and its relationship to "blame."

  If duty is defined *conceptually* as "that which an agent may be blamed for omitting," the Optionalist wins by stipulation: since we agree the agent is not blameworthy in paradigm supererogatory omissions, there is no duty. However, the Eliminativist rejects this definition, arguing that duty is defined by "that which there is most reason to do" or "that which is morally optimal," and that blame is a separate, downstream sanctioning mechanism that can be decoupled from duty for pragmatic reasons.

  Consequently, the dispute is not merely verbal, but it is exacerbated by verbal ambiguity. If the parties agree to define duty via *reasons/optimality*, the Eliminativist position becomes tautological (the best act is the required act), and the fight shifts entirely to the theory of blame (why we don't sanction duty-violators). If the parties define duty via *blameworthiness*, the Optionalist position becomes tautological, and the fight shifts to the theory of value (how an act can be best yet not required). The substantive core that remains after terminological alignment is the **normative question**: Does the moral demand maximize the good, or does it maximize the good only within constraints of agent-cost? The Optionalist insists on the constraint; the Eliminativist insists on the maximization.
