  Actually, the strongest philosophical move here is the **Distinction between Track-Record Arguments that are Confirmatory vs. those that are Generative.**
  Let's stick to the **Independent Constraint** argument. It's the most robust way to save science while killing bootstrapping.

  *Revised Plan:*
  1. Reject Step (3).
  2. Explain the "Transmission Failure" (Wright/Cohen).
  3. Address the "Science/Induction" worry (Steps 6-8) by distinguishing *constitutive* rules (logic/induction) and *networked* justification (science) from *isolated* self-validation (bootstrapping).
