      *(Word Count Check)*: If I'm too brief, I'll miss the 900 minimum. I need to elaborate on *why* the Aggregate Primacy Rule is dangerous ( perverse incentives). I also need to clearly explain the difference between the questions asked by aggregate vs. stratified data.

      *(Refining the "Bottom Line")*:
