      *   **Data:**
          *   Mild: A (98% survival), B (99% survival).
          *   Moderate: A (86% survival), B (89% survival).
          *   Severe: A (30% survival), B (38% survival).
          *   Overall: A (91.6% survival), B (65.5% survival).
          *   *Note:* This is a classic Simpson's Paradox example. Protocol B looks better within strata but worse overall because Protocol B treated way more severe patients (500 vs 50) compared to Protocol A.
      *   **Complications:**
          1.  Triage severity is subjective (same resident scores severity and chooses protocol). Incentive to up-code severity to justify Protocol B or protect stats. Vitals-only score exists but wasn't used.
          2.  Previous analyst looked at ICU escalation (post-treatment variable), found B's advantage disappeared. This is problematic conditioning on a collider/mediator.
          3.  Stratification was post-hoc (data dredging potential).
          4.  Proposal for "Aggregate Primacy Rule" (if stratified vs. aggregate disagree, pick the worse one for the unit).
      *   **Requirements:**
          *   Clear bottom line with dates/actions (pay-for-performance, suspend/freeze B, publication, Aggregate Primacy Rule).
          *   Reasoning for busy clinicians (no algebra, explain what each comparison answers).
          *   Address the "raw numbers matter" argument seriously (gaming the severity score).
          *   "Confidence Ledger" section (undisputed vs. contested facts).
          *   No citations/reading suggestions.
          *   Word count: 900–1100 words.
          *   Tone: Professional, decisive, nuanced but actionable.

  2.  **Determine the Recommendation:**
      *   *The Data:* The stratified data strongly suggests B is clinically superior (better survival in every category). The aggregate data is skewed because Unit B took much sicker patients (500 severe vs 50 severe).
      *   *The Risk:* The severity scoring is subjective and potentially gamed. If we accept the stratification blindly, we might reward gaming. If we reject it blindly (Aggregate Primacy), we punish a unit for taking sick patients.
      *   *The ICU Analysis:* Conditioning on ICU transfer is methodologically flawed (it's affected by the protocol), so dismissing B based on that is wrong.
      *   *The Decision:*
          *   *Protocol B:* Do not suspend. The clinical signal is too strong to ignore, but do not expand yet.
          *   *Pay-for-performance:* Withhold judgment/penalty for this cycle. Don't penalize based on aggregate, don't reward based on potentially gamed stratification.
          *   *Aggregate Primacy Rule:* Reject. It creates perverse incentives to avoid sick patients.
          *   *Next Steps:* Mandate use of the objective vitals-only score for future cases to validate severity.
      *   *Confidence:* Moderate on the clinical benefit, Low on the exact magnitude due to scoring concerns.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening/Bottom Line:** Immediate actions regarding Protocol B, payment, publication, and the proposed rule.
      *   **The Data Discrepancy (Reasoning):** Explain Simpson's Paradox without calling it that too much. Focus on "comparable groups." The aggregate says "who did this unit treat?" The stratified says "how did they treat them?"
      *   **Addressing the Counter-Argument (Gaming):** Acknowledge the risk of up-coding severity. This is the strongest argument against trusting the stratified data.
      *   **The ICU Analysis:** Briefly dismiss the previous analyst's conclusion because ICU transfer is part of the treatment path, not a baseline characteristic.
      *   **The Aggregate Primacy Rule:** Explain why this is dangerous (punishes taking sick patients).
      *   **Confidence Ledger:** Separate math from judgment.
      *   **Word Count Check:** Need to ensure it lands between 900-1100.

  4.  **Drafting - Content & Tone:**
      *   *Tone:* Authoritative but humble about data limitations.
      *   *Language:* Clinical/Administrative. Avoid stats jargon where possible.
      *   *Specifics:* Use the numbers provided.
      *   *Constraint:* No citations.

  5.  **Refining the Argument:**
      *   *The "Raw Numbers" Argument:* The committee member arguing for Aggregate Primacy is right that regulators see raw numbers. However, adopting a rule that penalizes risk-taking is bad policy. The solution isn't to adopt the rule, but to fix the measurement (use the vitals score).
      *   *The Decision:* Freeze expansion, maintain status quo on payment (no penalty, no bonus), reject the rule.
      *   *Confidence:* High on the math, Low on the causal inference due to scoring bias.

  6.  **Writing - First Pass (Mental or Scratchpad):**
      *   Start with the decision.
      *   Explain the table. A treated 50 severe, B treated 500 severe. That's why B's overall rate is lower.
