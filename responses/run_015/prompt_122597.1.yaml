answer: |-
  **MEMORANDUM**

  **TO:** Quality & Safety Committee
  **FROM:** Clinical Effectiveness Lead
  **DATE:** Tuesday, October 24
  **SUBJECT:** Recommendation on Protocol B Performance and Analysis Policy

  **Bottom Line and Required Actions**
  For this reporting cycle, we will neither penalize nor reward the Emergency Sepsis Unit on pay-for-performance metrics. We are freezing the planned expansion of Protocol B to mild and moderate presentations effective immediately. Protocol B continues for severe cases only under enhanced monitoring. We will not publish comparative survival statistics for this unit in the external quality report this quarter. Finally, the committee should reject the proposed "Aggregate Primacy Rule."

  These decisions stand until the next quarterly review (January 15). To change this status, the unit must demonstrate consistent severity scoring using the objective vitals-only score alongside clinical judgment for three consecutive months. If the vitals-only score confirms the severity distribution seen in the current data, we will proceed with expansion. If the vitals score shows significantly lower severity than the clinical score, we will suspend Protocol B for re-evaluation.

  **Understanding the Data Discrepancy**
  The committee is facing a statistical reversal where Protocol B appears superior in every severity category but inferior overall. This is not a calculation error. It reflects two different questions being asked of the data.

  The aggregate comparison (91.6% vs. 65.5%) answers: "Which unit treated a healthier population?" Protocol A treated 1,000 patients, but only 50 were severe. Protocol B treated 1,000 patients, with 500 severe. Protocol B's lower overall survival rate is driven almost entirely by case mix. They accepted ten times more severe patients than the network average. Punishing this aggregate number discourages units from accepting high-risk transfers.

  The stratified comparison (e.g., 38% vs. 30% in severe cases) answers: "Which protocol saves more lives given similar sickness?" Here, Protocol B shows a consistent advantage. In severe cases, B saved 190 patients; based on Protocol A's rate, we would expect only 150 survivors. This suggests clinical benefit. However, these groups are only comparable if the severity scoring is honest and consistent across units.

  **The Validity Challenge: Gaming and Subjectivity**
  The strongest argument against trusting the stratified data is not statistical theory; it is incentive. The opposing view holds that raw numbers are what patients and regulators see, and "adjusting" by a severity score assigned by the same clinician who picked the protocol is close to circular. This argument is correct. A unit can make any outcome look acceptable by calling its patients sicker.

  If the Emergency Unit has an incentive to justify Protocol B, they may label borderline patients "Severe." If they want to protect their overall stats, they might label them "Moderate." Because the stratification bands were chosen after seeing the aggregate numbers, we cannot rule out that the categories were drawn to maximize Protocol B's apparent advantage. The previous analyst's conclusion that "B does nothing," based on ICU escalation, was methodologically flawed because it conditioned on a post-treatment variable. However, their skepticism was warranted. We cannot validate a protocol using a score that the protocol itself might influence.

  **The Aggregate Primacy Rule**
  The proposal to adopt a standing rule favoring the aggregate number when conflicts arise is precautionary but dangerous. While regulators do see raw numbers, codifying a rule that penalizes units for treating sicker patients creates a perverse incentive. Units will begin diverting complex cases to protect their aggregate survival rates. We cannot adopt a policy that financially penalizes risk-taking in a network designed to handle regional complexity. The solution to unreliable stratification is better measurement, not reverting to misleading aggregates.

  **Confidence Ledger**
  To clarify where we stand, I have separated undisputed facts from contested judgments.

  *Undisputed:*
  1. The arithmetic in the provided tables is correct.
  2. Statistical reversals of this kind are mathematically possible and common in observational data.
  3. Conditioning on a variable affected by treatment (ICU transfer) answers a different causal question than conditioning on baseline severity.
  4. The current severity score is subjective and assigned by the treating team.

  *Contested:*
  1. **Validity of the Triage Score:** Whether the current clinical severity score is sufficiently robust to adjust for case mix, given the incentive to up-code.
  2. **Weighting:** Whether we should trust the stratified average or the aggregate when they diverge in non-randomized data.
  3. **Post-Hoc Stratification:** How much to discount findings where the analysis bands were defined after viewing the outcomes.
  4. **Causal Inference:** Whether observational data alone can justify expanding a protocol without a randomized trial.

  **Recommendation Confidence**
  I have high confidence in the arithmetic and the rejection of the ICU analysis. I have moderate confidence that Protocol B is clinically superior, but low confidence in the exact magnitude of benefit due to the scoring concerns. I have high confidence that adopting the Aggregate Primacy Rule would cause network-wide harm.

  We proceed with Protocol B under strict observation, requiring objective vitals scoring for validation. We reject the primacy rule to preserve our network's mission.
