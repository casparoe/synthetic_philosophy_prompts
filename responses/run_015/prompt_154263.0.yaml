answer: |-
  You have put your finger on the single most difficult tension in Leibniz's system. You are describing the friction between his **metaphysics of substance** (windowless monads, pre-established harmony) and his **ethics of community** (justice, charity, the City of God).

  To answer your first question directly: There is no single, standardized noun for this specific "collapse" in the literature. However, scholars typically categorize this problem under the heading of **The Reality of Relations** or the tension between **Metaphysical Egoism** and **Universal Benevolence**. Some critics (like Bertrand Russell) argued this *does* collapse into a form of "Platonic Egoism," while defenders argue it constitutes a **Moral Idealism**.

  But you asked for the *carving*, not just the name. You want to know where the "other" survives and where it is erased. Here is the structural breakdown of that distinction in Leibniz's thought.

  ### 1. The Carving: Where Otherness is Erased vs. Preserved

  Leibniz operates on two distinct ontological registers. The "collapse" you feel happens when you try to map the ethics of one register onto the metaphysics of the other without a translator.

  **A. Where Otherness is Erased: Substantial Causality**
  At the level of *metaphysical substance*, you are correct: the other is erased as a causal agent.
  *   **The Mechanism:** Monads are "windowless." Nothing enters or leaves. When you "help" someone, you are not transferring energy, information, or grace into their substance. Their internal state unfolds solely from their own internal concept.
  *   **The Erasure:** In this register, there is no **transitive action**. You are not the *efficient cause* of their improvement. If you view ethics as "I act upon you to change you," Leibniz's metaphysics destroys this. The "other" as a recipient of your causal power is an illusion.

  **B. Where Otherness Survives: Intentional Expression**
  At the level of *perception and expression*, the other is rigorously preserved.
  *   **The Mechanism:** Every monad *expresses* the entire universe from its own point of view. Your internal state contains a representation of the other monad.
  *   **The Preservation:** The "other" survives as the **Intentional Object** of your perception. When you love someone (rejoice in their perfection), you are taking *their* state as the object of *your* joy. Even if their state is internally generated, it is *about them*.
  *   **The Carving:** Otherness is erased as **Causal Agency** but preserved as **Constitutive Content**. You cannot *make* them happy, but your own perfection *consists in* perceiving and willing their happiness.

  ### 2. Is it just "Synchronized Self-Improvement"?

  This is the crux of your "weird loop." If I am just upgrading myself in parallel with you, isn't ethics just enlightened egoism?

  Leibniz would say **no**, and here is the structural reason why: **Compossibility.**

  In a purely synchronized system (like two clocks set by a maker), the synchronization is external. In Leibniz's system, the synchronization is internal to the *concepts* of the substances.
  *   God chooses the "Best of All Possible Worlds."
  *   A world is "best" based on the maximum amount of **compossible perfection**.
  *   My essence is *compossible* with yours only if our perfections harmonize.
  *   Therefore, my perfection is *ontologically tied* to yours. It is not just that we happen to line up; it is that **my perfection is defined by its relation to yours.**

  If I seek my own perfection while ignoring yours, I am seeking a *logical contradiction* (a world that God did not choose). Therefore, "self-improvement" is structurally impossible without "other-improvement." They are not two parallel lines; they are two variables in the same equation.

  **The Difference from "Wise Charity":**
  *   **"Justice is Wise Charity"** is the *phenomenal rule*. It tells you how to act in the world of appearances (the City of God).
  *   **"Synchronized Self-Improvement"** is the *noumenal description*. It tells you what is happening in the realm of substances.
  *   **The Gap:** The gap is bridged by **Love**. For Leibniz, love is not a feeling; it is an intellectual recognition that the other's good is a necessary condition of your own good. The "collapse" you fear is avoided because the "self" that is being improved is a self that *contains the other within its definition*.

  ### 3. Does this relate to Harmony?

  It is not a separate problem; it is the **ethical face of Pre-established Harmony.**

  Pre-established harmony is often misunderstood as just a solution to the mind-body problem. For Leibniz, it is also a solution to the problem of evil and social ethics.
  *   **Physical Harmony:** My body moves when I will it (without causal interaction).
  *   **Moral Harmony:** My happiness aligns with yours (without causal interaction).

  If there were real causal interaction, one monad could dominate or destroy another (a source of evil/conflict). By making interaction "ideal" rather than "real," Leibniz ensures that no monad can truly harm another *substantially*. Harm is only phenomenal. This protects the **immortality and integrity of the soul**.

  However, this creates the ethical risk you identified: **Moral Irrelevance.** If I can't hurt you, why bother being good?
  Leibniz answers this with the **City of God**. We are not just monads; we are *spirits* (minds). Spirits mirror God. God's justice is real. Therefore, our moral relations, while metaphysically "ideal," are **morally real**.

  ### 4. The Established Term for the "Collapse" Risk

  While there isn't one word, the specific philosophical charge you are articulating is often called the **Problem of Ideal Interaction**.

  Critics argue Leibniz succumbs to **Metaphysical Solipsism** disguised as Harmony. If the other is just a representation inside me, is their suffering real?
  *   **Leibniz's Defense:** The suffering is real *for them* (in their perception) and real *for me* (in my perception of them). The fact that there is no causal bridge doesn't make the pain less real, it just makes the *responsibility* different. My responsibility is not to "fix" their substance (which I can't), but to align my will with the universal harmony (which I can).

  ### Summary of the Carving

  To answer your request for the exact location of the carve:

  1.  **Erased:** The **Efficient Causal Link**. You do not push the other's soul. You are not the author of their upgrade.
  2.  **Preserved:** The **Final Causal Link**. You are a co-participant in the same telos (end goal). Their upgrade is the *reason* for your upgrade.
  3.  **The Ethical Shift:** Ethics moves from **Intervention** (fixing the other) to **Alignment** (tuning oneself to the harmony that includes the other).

  So, moral care is not "directed at" the other in the sense of a projectile hitting a target. It is directed at the **Harmony** of which the other is a necessary note. You tune your instrument not *for* the violinist, but *with* the violinist, because the music only exists in the tuning.

  The "otherness" survives not as a separate vessel you fill, but as a distinct voice in the chord you are jointly composing. If you silence them to sing louder yourself, you aren't creating harmony; you are creating noise, and thus reducing your own perfection.
