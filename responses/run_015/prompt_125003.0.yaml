answer: |-
  Your diagnosis is remarkably sharp, especially for someone who just fell down the rabbit hole. You have essentially reinvented a significant chunk of the last 40 years of analytic philosophy, specifically the move toward **causal modeling** and **normative baseline theory**.

  Here is the diagnosis, the verdict on your hypothesis, and what actual progress looks like.

  ### 1. The Diagnosis: It's a "Lossy Compression" Error
  You are right that the debate feels circular because both sides are using a single boolean flag (`is_killing`) to represent a high-dimensional vector of features.

  In normal cases, these features correlate perfectly:
  *   **Agency:** High motor involvement.
  *   **Counterfactual:** Death wouldn't happen without me.
  *   **Threat Source:** I introduced the threat.
  *   **Intention:** Death is the goal.
  *   **Normative Baseline:** I violated a negative right (don't touch).

  In edge cases (ICU, Trolley), these features decouple.
  *   **ICU Withdrawal:** High motor involvement (turning a dial), but Threat Source = Disease, Counterfactual = Death happens anyway eventually, Normative Baseline = Disputed.
  *   **Lethal Injection:** High motor involvement, Threat Source = Me, Counterfactual = Life continues otherwise.

  **The Circle:**
  *   **Camp A (Consequentialists/Outcome-focused):** Argues that since `Outcome` and `Intention` are identical, the `is_killing` flag should be true for both. They think the other features (motor motion, threat source) are morally irrelevant noise.
  *   **Camp B (Deontologists/Rights-focused):** Argues that `Threat Source` and `Normative Baseline` are the primary keys. They think `Outcome` is irrelevant to the *wrongness of the act*, even if it matters for the *tragedy of the event*.

  **Why it stalls:** You cannot resolve this by better definitions because the disagreement isn't about what "killing" *means*; it's about which feature in the vector carries the **moral weight**. Camp A thinks moral weight attaches to *causing outcomes*. Camp B thinks moral weight attaches to *violating constraints*.

  ### 2. Your "Diff Baseline" Hypothesis
  You asked if you reinvented this badly. You actually reinvented it well, but you missed one variable: **Normative Entitlement.**

  In Git, the baseline is a technical choice (commit hash). In ethics, the baseline is a **normative** choice (what is owed).

  *   **Your View:** Baseline = "Nature without me." If I stop typing code, the server stops. Removing the ventilator is `git revert`.
  *   **Sister's View:** Baseline = "Standard of Care." Once a patient is admitted and intubated, the ventilator is part of the "running production environment." Removing it is a `DROP TABLE` command, not a revert.

  Philosophers call this the **Status Quo Objection**. The debate isn't about the physics of the diff; it's about who owns the repo.
  *   If the patient has a **right** to the ventilator, removing it is an active violation (killing).
  *   If the doctor has no **duty** to provide futile care, removing it is stopping a subsidy (letting die).

  Your sister (ICU nurse) operates on a **duty-based baseline**. In medicine, once you engage, the baseline shifts from "nature" to "care." You are operating on a **liberty-based baseline**. In law/tech, the baseline is "no interference unless contracted."

  **Verdict:** Your diagnosis is correct that the *description* depends on the baseline. The *moral fight* is about which baseline is privileged. That is not a factual question; it is a political/legal one.

  ### 3. The Intention/Blame Memory (The Knobe Effect)
  You are remembering correctly. This is the **Knobe Effect** (2003).
  *   **Scenario A:** CEO implements a program that increases profit but *harms* the environment. He says, "I don't care about the environment, just profit." -> Folk say he **intentionally** harmed the environment.
  *   **Scenario B:** CEO implements a program that increases profit but *helps* the environment. He says, "I don't care about the environment, just profit." -> Folk say he did **not intentionally** help the environment.

  The causal structure is identical. The mental state is identical. The only variable is the **moral valence of the side effect**.
  This confirms your suspicion: Folk psychology does not describe mental states; it assigns blame. When people argue about "intention" in these cases, they are often arguing about *blameworthiness* using "intention" as a proxy variable.

  ### 4. What Counts as Progress?
  Since the debate is not about metaphysics (causation) but about normative baselines (rights/duties), "better causal formalism" alone won't solve it. However, it can dissolve the confusion.

  **A. Structural Causal Models (SCM)**
  *   **Progress:** Yes. Philosophers like Joseph Halpern and Judea Pearl have formalized "actual causation."
  *   **Why:** It forces you to explicitly define the variables and the structural equations. It makes it impossible to hide the baseline assumption. You have to explicitly code whether `Ventilator = 1` is part of the default model or an intervention.
  *   **Limit:** It tells you *if* there is a causal difference given a model, but not *which model* is morally correct.

  **B. Distinguishing Permissibility from Blame**
  *   **Progress:** High.
  *   **Why:** Much of the circle comes from conflating "Is this act allowed?" (Permissibility) with "Is this agent bad?" (Blame).
  *   **Application:** You might agree that withdrawing the vent is *causally* similar to injection (outcomes), but argue it is *permissible* because of bodily autonomy rights, whereas injection is not. This separates the causal claim from the moral verdict.

  **C. Experimental Philosophy (X-Phi)**
  *   **Progress:** Low for *truth*, High for *diagnosis*.
  *   **Why:** Surveys show that intuitions about "doing vs. allowing" flip based on framing, culture, and order of questions. This proves the intuition is not a "bedrock moral truth" but a heuristic. It validates your "bundled variables" theory.

  ### 5. Summary for Your Argument
  If you talk to your sister again, don't argue about causation. Argue about the **baseline entitlement**.

  *   **Your argument:** "The ventilator is an external resource. Removing it is reverting to the baseline of no resource."
  *   **Her argument:** "The ventilator is a maintained life-support system. Removing it is an interruption of an ongoing duty."

  **The Resolution:**
  In law and bioethics, the compromise is usually **Rights-Based**, not Causal.
  *   **Lethal Injection:** Violates a negative right (right not to be killed).
  *   **Withdrawing Vent:** Respects a negative right (right to refuse treatment) or acknowledges the limit of a positive right (right to be saved).

  **Final Verdict:**
  You are right that the literature circles because it tries to derive an `Ought` (moral distinction) from an `Is` (causal distinction). The causal distinction is unstable (as your diff analogy proves). The moral distinction rests on **rights and duties**, not physics.

  **Progress** comes from admitting that "Killing vs. Letting Die" is a bad label for the underlying moral question. The real question is: **"Does the agent have a duty to sustain the baseline?"** If yes, stopping is killing. If no, stopping is letting die. The fight isn't about the stop; it's about the duty.
