answer: |-
  Yes, there is a name for this, and it is currently one of the most active areas of debate in contemporary metaphysics.

  The specific relation you are describing is most commonly called **grounding**. You might also encounter it under the older labels **metaphysical dependence** or **ontological priority**.

  Here is a breakdown of what philosophers generally agree on, where the disagreements lie, and how it fits the specific intuitions you described.

  ### 1. The Name and the Intuition
  The term "grounding" has become the standard technical term in analytic philosophy over the last 15 to 20 years to capture exactly the relation you are pointing at.

  Philosophers generally agree on the **phenomenology** of the relation. They agree that:
  *   **It is explanatory:** To say the parts ground the whole is to say the parts *explain* why the whole exists.
  *   **It is non-causal:** As you noted, the arrangement of parts doesn't *cause* the table to exist in the way a carpenter causes a table to exist. It is a synchronic (same-time) relation of constitution or determination, not a diachronic (over-time) production.
  *   **It is asymmetric:** If A grounds B, B does not ground A. (The parts ground the table, but the table does not ground the parts.)
  *   **It is irreflexive:** Nothing grounds itself.

  So, regarding your first question: **Yes, there is a settled vocabulary for the intuition.** If you talk to a metaphysician about "non-causal determination" or "in virtue of" relations, they will know you are talking about grounding.

  ### 2. Is the Concept Settled?
  While the *intuition* is widely shared, the **metaphysical status** of grounding is highly contested. There is no consensus on what kind of "thing" grounding actually is. The debate generally falls into three camps:

  **A. Primitivism (The Dominant View)**
  Proponents argue that grounding is a sui generis (unique) relation that cannot be defined in terms of anything else. Just as we can't define "causation" without using causal terms, we can't define "grounding" without using grounding terms. On this view, reality has a hierarchical structure, and grounding is the "glue" that holds the levels together.

  **B. Reductionism**
  Some philosophers argue that "grounding" is just a placeholder for other, more specific relations. They argue there is no single "grounding" relation, but rather a family of relations (composition, realization, set-formation, etc.) that we lump together.
  *   *Essentialism:* Some, like Kit Fine, argue that grounding is actually a matter of **essence**. The parts ground the table because it is *essential* to the table that it is composed of those parts.
  *   *Identity:* Some argue that the "less fundamental" thing is nothing over and above the "more fundamental" thing (e.g., the table just *is* the parts arranged table-wise), so the relation is actually a form of identity.

  **C. Skepticism / Eliminativism**
  A minority of philosophers argue that "grounding" is a pseudo-concept. They suggest that when we say one thing is "more fundamental" than another, we are just making a claim about our **theories** or **language** (e.g., "The vocabulary of physics is more useful than the vocabulary of furniture"), not about the world itself. They argue we don't need a mysterious metaphysical relation to explain why we prefer talking about particles over tables.

  ### 3. Addressing Your Specific Doubts
  You mentioned that it doesn't seem like logical entailment because "you need extra assumptions about what counts as a table." You are precisely right, and this is a key distinction in the literature.

  *   **Logical Entailment** is about propositions and truth. (If "All men are mortal" and "Socrates is a man" are true, "Socrates is mortal" *must* be true.)
  *   **Grounding** is about **facts** or **reality**.

  Philosophers distinguish between **conceptual analysis** (what the word "table" means) and **metaphysical grounding** (what makes the table exist).
  *   If it were just logical entailment, the existence of the table would be a linguistic truth.
  *   Because it is grounding, the existence of the table is a **metaphysical truth**.

  The "extra assumptions" you mentioned are often cashed out as **metaphysical laws** or **principles of composition**. For the parts to ground the table, there must be a "principle of composition" that dictates that when parts are arranged thus-and-so, a whole *must* exist. Debates about whether those principles are universal or contingent are part of the grounding debate.

  ### 4. Related Terms You Might Encounter
  To ensure you have the full map, here are three related concepts that are often distinguished from grounding:

  *   **Supervenience:** This describes a pattern of covariance (e.g., "There can be no change in mental states without a change in physical states"). Philosophers often say supervenience describes *that* there is a dependence, but grounding explains *why* or *how*. Supervenience is the pattern; grounding is the connection.
  *   **Truthmaking:** This is the relation between an object/fact in the world and a true proposition. (The fact that snow is white *makes true* the proposition "Snow is white.") Grounding is often seen as the worldly counterpart to truthmaking.
  *   **Realization:** Common in philosophy of mind. (Physical states *realize* mental states.) This is often treated as a specific *type* of grounding relation.

  ### Summary
  *   **Name:** Grounding (or Metaphysical Dependence / Ontological Priority).
  *   **Is it settled?** The intuition that the relation exists is widely shared. The theory of what the relation *is* is fiercely contested.
  *   **Current Consensus:** Most working metaphysicians treat it as a primitive, non-causal, explanatory relation that structures reality into levels of fundamentality, but there is significant opposition from those who think it can be reduced to essence or eliminated entirely.

  You have correctly identified that it is distinct from causation, time, and logic. That tripartite distinction is essentially the starting definition of grounding in modern metaphysics.
