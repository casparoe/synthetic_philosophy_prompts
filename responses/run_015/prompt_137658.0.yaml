      *   **Failure Conditions:** If the only answer is "stipulate a cutoff," is that a failure? No, it's a negative result showing the limits of reductionism. But if I get stuck in vagueness literature, that's a scope failure.
      *   **Scope Warnings:** The Aging analogy is a trap. It's illustrative, not the core argument. Don't let it take over. Don't try to solve the metaphysics of degrees.

