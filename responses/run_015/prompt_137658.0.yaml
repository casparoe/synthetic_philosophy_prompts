          *   *Broad:* What matters in survival when continuity is imperfect?
          *   *Narrow:* Does the "No-Branching" view or the "Closest Continuer" view better accommodate *asymmetric* fission cases without collapsing into arbitrariness?
          *   *Refined:* I need to focus on the *normative* implication. If R is scalar, is Prudential Concern (PC) scalar?
          *   *Final Question:* "Does the scalar nature of psychological continuity in asymmetric fission cases entail a scalar structure for prudential concern, and if so, can standard reductionist accounts accommodate this without appealing to vagueness?"
      *   **The Gap (Why standard views fail):**
          *   Parfit/Reductionism: Usually treats R as holding or not holding in fission. If it holds to both, identity fails. But they don't quantify *how much* R holds.
          *   No-Branching Rule: Works for 50/50. Fails for 90/10. Is the 10% branch a branch?
          *   Closest Continuer: Works for 90/10. Fails for 50/50 (tie).
