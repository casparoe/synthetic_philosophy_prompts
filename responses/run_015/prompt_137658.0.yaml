  2.  **Deconstruct the Core Philosophical Problem:**
      *   *Standard View:* Parfit-style reductionism. Identity isn't what matters; Relation R (psychological continuity/connectedness) is. In fission, R holds to both, so identity fails, but survival (what matters) is preserved (perhaps divided).
      *   *The Gap:* Standard cases assume $R = 1.0$ for both branches.
      *   *The Twist:* What if $R_1 = 0.9$ and $R_2 = 0.1$? Or $R_{future} = 0.96 \times R_{present}$ per trip?
      *   *The Conflict:*
          *   If "what matters" is binary (survive/die), where is the cutoff?
          *   If "what matters" is scalar, how does prudential concern scale? (Can I care 0.9 times as much?)
          *   Does the "Closest Continuer" theory work when the gap closes (50/50)?
          *   Connection to Aging: If aging is degradation, do I care less about my 80-year-old self?
      *   *Scope Management:* A 10k word paper cannot solve the metaphysics of vagueness *and* personal identity *and* prudential concern. It needs to focus on the *interaction* between degrees of continuity and the structure of prudential concern.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy but accurate. "Degrees of Continuity," "Scalar Survival," "Imperfect Fission." Let's go with *Scalar Continuity and the Structure of Prudential Concern.*
