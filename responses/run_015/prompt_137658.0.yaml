answer: |-
  **Project Title:** Scalar Continuity and the Structure of Prudential Concern: Asymmetric Fission and the Degradation Problem

  **1. Project Summary and Research Question**

  Standard discussions of personal identity in the reductionist tradition rely heavily on idealized fission and teletransporter cases. These thought experiments typically assume perfect psychological continuity: when a person enters the teletransporter or undergoes fission, the resulting candidate(s) possess 100% of the original's memories, character traits, and intentions. The philosophical work is then done on the structural relation between one antecedent and two consequents. The standard conclusion, following Parfit, is that since identity cannot be one-to-two, identity is not what matters in survival. What matters is Relation R (psychological continuity and connectedness), which holds between the original and both branches.

  This project challenges the idealization of perfection in these cases. In reality, and in more nuanced thought experiments, continuity is rarely perfect. It comes in degrees. This project investigates two specific variations on the standard fission case: (1) *Degraded Transmission*, where the resulting continuers possess less than perfect psychological overlap with the original (e.g., 96% retention), and (2) *Asymmetric Fission*, where one branch possesses significantly more continuity than the other (e.g., a 90/10 split).

  The central research question is: **To what extent does the scalar nature of psychological continuity in asymmetric fission cases compel a scalar model of prudential concern, and can standard reductionist accounts accommodate this without collapsing into arbitrariness?**

  This is not a project about the metaphysics of identity itself. I accept the reductionist premise that identity is not what matters. Nor is it a project about the metaphysics of vagueness. Instead, it is a normative inquiry into the structure of "what matters." If Relation R is scalar, must the prudential concern we have for our future selves also be scalar? If I stand at the precipice of a 90/10 fission, do I have full concern for the 90% branch and no concern for the 10% branch? Or is my concern divided? And if I undergo repeated degraded transmission (the "aging" analogue), does my rational concern for my future self diminish over time?

  The goal of this one-semester project is to produce a 10,000-word paper that isolates the tension between scalar continuity and binary survival judgments in existing literature, constructs a specific family of asymmetric cases to test this tension, and evaluates whether the "Closest Continuer" or "No-Branching" views can survive the slide from asymmetry to symmetry.

  **2. Background and The Gap**

  The existing literature on fission is robust but relies on a binary switch. In standard Parfitian cases, Relation R either holds or it does not. In fission, it holds to both branches, so identity fails. To rescue the intuition that survival is possible, reductionists argue that what matters is R, not identity. However, this account assumes R is robust enough in both branches to warrant full prudential concern.

  Three standard positions currently dominate the field, and all leave the asymmetric/degraded case open:

  1.  **The No-Branching View:** This view holds that R matters only if it is unique. In standard 50/50 fission, R is not unique, so identity fails. However, in a 90/10 split, is R unique? If the 10% branch counts as a "branch," uniqueness fails. If it does not count, we need a threshold for what counts as a branch. The literature provides no non-arbitrary account of where this threshold lies.
  2.  **The Closest Continuer Theory:** This view suggests that identity (or what matters) tracks the *best* candidate. In a 90/10 split, the 90% branch is the closest continuer, so full concern is warranted there. However, this view famously collapses in the 50/50 case, where there is no "closest." The gap lies in the transition: as we slide continuously from 90/10 to 50/50, at what point does the Closest Continuer account cease to function? If the account works at 51/49 but fails at 50/50, we face a cliff-edge problem that the theory does not address.
  3.  **Standard Reductionism (Parfitian):** This view allows that what matters can hold to degrees. However, it typically treats the *value* of survival as binary in practical reasoning (I either survive or I don't). It does not adequately explain the phenomenology or rationality of *partial* prudential concern. Can I rationally care 0.9 times as much about a future self? If so, how does this aggregate over time? If not, why does the scalar nature of R not transmit to the scalar nature of concern?

  The gap is not in the metaphysics of persons, but in the *normative mechanics* of survival under non-ideal conditions. Existing accounts treat fission as a structural puzzle (one vs. two). I propose treating it as a quantitative puzzle (how much continuity is required for how much concern?). This shift reveals that standard solutions rely on hidden thresholds that become indefensible when cases are degraded or asymmetric.

  **3. Methodology and Work Plan**

  This is a conceptual analysis project using the method of cases. I will not be conducting empirical research or archival work. The method involves constructing a "family of cases" that varies two parameters: the *degree of continuity* (perfect vs. degraded) and the *symmetry of fission* (50/50 vs. 90/10). I will then test the three standard accounts (No-Branching, Closest Continuer, Reductionism) against these cases to identify points of theoretical breakdown.

  **Month 1: Case Construction and Literature Review**
  *   **Weeks 1-2:** Finalize the description of the "Degraded Transmission" and "Asymmetric Fission" cases. Ensure the parameters are clearly defined (e.g., specifying that the 10% branch has enough continuity to be a person, but not enough to be a *full* continuer).
  *   **Weeks 3-4:** Targeted reading on the Closest Continuer theory and recent discussions of "degrees of survival." The goal is not a general survey, but to locate exactly where existing authors stipulate thresholds.
  *   **Deliverable:** A 2,000-word case study document detailing the specific thought experiments to be used in the paper.

  **Month 2: Testing the Closest Continuer and No-Branching Views**
  *   **Focus:** I will argue that the Closest Continuer view is unstable across the "slide" from asymmetry to symmetry. If the 90/10 case yields a determinate answer (care about the 90), and the 50/50 case yields an indeterminate answer (divide concern), there must be a point of transition.
  *   **Task:** Demonstrate that any specific point of transition (e.g., 55/45) is arbitrary. If the theory relies on an arbitrary cutoff, it fails to explain the *reasons* for our concern.
  *   **Deliverable:** Draft of the first half of the paper (approx. 4,000 words).

  **Month 3: Testing Reductionism and the Scalar Concern Hypothesis**
  *   **Focus:** I will evaluate the Parfitian response: that what matters simply comes in degrees. The challenge here is to make sense of "scalar prudential concern."
  *   **Task:** Analyze whether it is coherent to say "I should care less about my future self." I will use the "Aging Analogy" here as a stress test: if ordinary aging is a form of degraded transmission, does reductionism imply we should care less about our distant futures?
  *   **Deliverable:** Draft of the second half of the paper (approx. 4,000 words).

  **Month 4: Synthesis and Conclusion**
  *   **Focus:** Bring the arguments together. Determine which account survives best, or if the result is a negative one (i.e., that all current accounts fail to handle degrees).
  *   **Task:** Refine the argument, ensure the scope hasn't crept, and finalize the bibliography.
  *   **Deliverable:** Final 10,000-word paper.

  **Why this method?**
  I am explicitly avoiding two obvious alternative approaches. First, I am not importing a worked-out theory of vagueness (e.g., supervaluationism or epistemicism) to solve the threshold problem. While the problem *is* vague, appealing to a general theory of vagueness sidesteps the specific normative question of *prudential concern*. We need to know how to act, not just how to classify. Second, I am not attempting to settle the metaphysics of degrees of identity. I am bracketing the question "Is it the same person?" to focus on "Does it matter to me?" This keeps the project within the realm of ethics and rational choice, which is more manageable for a 10k-word limit than a full metaphysical overhaul.

  **4. Expected Outcomes and Decision Criteria**

  There are three realistic conclusions this project could reach.

  1.  **The Scalar Conclusion:** The project may demonstrate that prudential concern *must* be scalar. If R comes in degrees, rational concern must track R. This would require a revision of standard decision theory regarding self-interest.
      *   *Decision Criterion:* This conclusion is supported if the binary accounts (No-Branching/Closest Continuer) are shown to rely on indefensible arbitrariness in the transition zone.
  2.  **The Threshold Conclusion:** The project may show that scalar concern is incoherent (one cannot care "0.9 times" about a future), implying there must be a threshold of continuity required for full concern.
      *   *Decision Criterion:* This is supported if the Scalar Conclusion leads to absurd practical implications (e.g., justifying extreme negligence toward one's distant future).
  3.  **The Negative Conclusion:** The project may show that standard reductionist resources are insufficient to handle asymmetric cases, without being able to offer a positive solution.
      *   *Decision Criterion:* This is the fallback. If both Scalar and Threshold conclusions fail, the contribution is the demonstration of the gap itself.

  **Honest Account of Failure**
  A "failed" project in this context would be one that dissolves into the literature on vagueness without returning to the specific problem of personal identity. If the paper concludes merely that "fission is vague, so we must stipulate a cutoff," it has not advanced the debate on *what matters*. A stipulation is a surrender.

  However, if the conclusion is that "stipulation is the only viable option, and here is why the normative pressure forces us to accept it," that is a successful negative result. The project would only be a true failure if I cannot clearly define the "Asymmetric Fission" case or if I find that the literature has already exhaustively solved the 90/10 problem (which my preliminary reading suggests it has not).

  Another failure mode is the "Aging Trap." If I spend too much time defending the claim that aging *is* degraded transmission, the paper becomes a project in philosophy of biology or gerontology. To avoid this, the aging analogy will be used strictly as an *illustration* of the Scalar Conclusion's implications, not as evidence for the conclusion itself.

  **5. Scope and Risk Management**

  My supervisor has rightly flagged that this idea could easily expand into a dissertation. The primary risk is scope creep regarding the metaphysics of identity.

  *   **Risk 1: Metaphysical Bloat.** It is tempting to try to solve *why* continuity comes in degrees.
      *   *Mitigation:* I will treat the degree of continuity as a given parameter of the thought experiment. I am not analyzing the neural realization of memory; I am analyzing the normative consequence of the variation.
  *   **Risk 2: The Vagueness Rabbit Hole.** As noted, general theories of vagueness are a distinct field.
      *   *Mitigation:* I will mention vagueness only to distinguish my project from it. The question is not "Is there a fact of the matter?" but "How should we reason given the lack of a clear fact?"
  *   **Risk 3: The Aging Analogy.** This is the most seductive expansion point.
      *   *Mitigation:* The aging analogy will be confined to a single section in Month 3. It serves to motivate the importance of the question, not to answer it. If the argument stands without the aging analogy, the paper is secure. If it relies on it, the paper is vulnerable. I will aim for the former.
  *   **Risk 4: Defining "Prudential Concern."**
      *   *Mitigation:* I will adopt a working definition early (e.g., the rationality of self-sacrifice for future benefit) and stick to it. I will not attempt to ground a full theory of rationality.

  **Feasibility for One Semester**
  The project is feasible because it narrows the field of engagement. I am not arguing against reductionism; I am arguing within it. I am not solving fission; I am solving *asymmetric* fission. By limiting the textual engagement to the specific mechanisms of the Closest Continuer and No-Branching views, and by limiting the case studies to the two variants (Degraded and Asymmetric), the word count is manageable. The month-by-month plan allows for a "kill your darlings" checkpoint at the end of Month 2; if the Closest Continuer argument proves too dense, I can pivot to focusing solely on the Reductionist/Scalar tension.

  **Conclusion**
  This proposal refines a broad intuition about imperfection in survival cases into a specific, testable philosophical problem. It moves beyond the question "Do I survive?" to "How much does my survival matter?" By focusing on the transition from asymmetric to symmetric fission, it targets a specific weakness in current reductionist accounts. The project is designed to be self-contained, avoiding the traps of general metaphysics or vagueness theory, and delivers a determinate conclusion about the structure of prudential concern within the standard reductionist framework.
