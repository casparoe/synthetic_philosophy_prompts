          *   Month 4: Synthesis & The Aging Analogy (limited).
          *   *Why not Vagueness?* Because appealing to "it's just vague" dismisses the normative pressure. We need to know how to *act* (concern), not just how to *speak*.
          *   *Why not Metaphysics of Identity?* Because the project accepts the reductionist premise that identity isn't what matters. It's about *what matters*.
