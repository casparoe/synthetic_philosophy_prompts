      *   **Key Hypothesis:** If continuity comes in degrees, "what matters" (prudential concern) must also come in degrees. This creates problems for standard accounts (No-Branching, Closest Continuer, Reductionism).
      *   **Real-World Upshot:** Aging as degraded transmission.
      *   **Requirements for Output:**
          *   State the question precisely (determinate enough for a semester).
          *   Explain the gap (why standard answers fail here).
          *   Methodology (month-by-month plan, case construction, testing accounts).
