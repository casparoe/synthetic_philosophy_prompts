answer: |-
  There is no single, canonical term in analytic ethics that precisely captures this specific topological inconsistency, though it sits at the intersection of debates regarding **threshold views** versus **gradualist views** of moral status. Philosophers like Jeff McMahan and David DeGrazia have mapped the tension between "binary" and "scalar" accounts of moral standing, and **sufficientarianism** describes a view where benefits are owed only to those above a certain capacity. However, these established concepts typically own their boundaries; they do not usually describe the specific rhetorical maneuver you identified: asserting a continuum to dissolve a boundary, only to reinstall a boundary via a qualitative qualifier that is not mapped to the continuum's metric.

  Because this specific architecture lacks a precise label, I propose the term **"Gated Gradualism."**

  ### Definition and Delimitation
  **Gated Gradualism** is a moral reasoning structure characterized by four necessary conditions:
  1.  **Metric Continuity:** The agent explicitly endorses a continuous variable (e.g., neural complexity, nociceptive capacity) as the basis for moral weight, rejecting binary "on/off" switches.
  2.  **Internal Gradation:** Within a specific subset of entities (the "privileged class"), moral weight varies proportionally to the continuous metric (e.g., a chimpanzee > a mouse).
  3.  **External Exclusion:** Entities below a certain point on the continuous metric are assigned zero moral weight (or a qualitatively different status), effectively creating a binary wall.
  4.  **Unanchored Justification:** The justification for the exclusion wall relies on a qualitative criterion (e.g., "genuine experience," "the right kind of integration") that is not functionally defined by the continuous metric used for internal gradation, leaving the boundary's location on the scale unmapped.

  ### Distinctions from Nearby Patterns
  *   **Vs. Ordinary Threshold-Setting:** A standard threshold view (e.g., "Only beings with rational agency have rights") admits the binary nature of the claim from the outset. Gated Gradualism differs by *first* invoking a continuum to dismiss binary objections, only to reintroduce the binary later without reconciling the two.
  *   **Vs. Pure Gradualism:** Pure gradualism assigns non-zero (however negligible) moral weight to the bottom of the scale (e.g., a thermostat has $0.00001$ moral weight). Gated Gradualism assigns exactly zero to the excluded class while maintaining the scale for the included class.
  *   **Vs. Simple Equivocation:** Equivocation involves shifting the definition of a term mid-argument. Gated Gradualism is more structural; the definitions remain stable, but the *topology* of the moral landscape shifts from a line (continuum) to a set (category) without a defined transition function.
  *   **Vs. The Non-Identity Problem:** The non-identity problem concerns harms to future persons dependent on specific choices. Gated Gradualism concerns the current moral status of existing entities based on their capacities.

  ### Edges and Instances
  *   **Instance:** Arguing that pain sensitivity is a spectrum, so a dog matters more than a fish, but insisting insects have *no* moral status because they lack "subjective experience," without defining where on the pain-sensitivity spectrum subjective experience begins.
  *   **Non-Instance:** Arguing that insects lack nervous systems entirely (biological fact) and therefore cannot feel pain (binary fact). This is a factual threshold, not a gated continuum.
  *   **Edge Case:** If the speaker attempts to map the qualitative criterion onto the scale (e.g., "Subjective experience begins at neural complexity level X"), the view collapses into a standard **Threshold View** and ceases to be Gated Gradualism.

  Gated Gradualism functions as a cognitive comfort mechanism, allowing the speaker to avoid the counterintuitive implications of pure gradualism (moral weight for thermostats) while retaining the intellectual sophistication of rejecting arbitrary binaries.

  There is no established term for this specific inconsistency, so I have coined "Gated Gradualism" to describe the structural disconnect between a continuous metric of value and an unmapped categorical boundary of exclusion.
