  Here's a thinking process that leads to the suggested Q&A prep sheet:

  1.  **Analyze the Request:**
      *   **Topic:** Frame-Sensitive Particularism (FSP).
      *   **Core Claim:** Moral reasons' *identity* (not just weight) depends on irreducibly situational relational framing (gestalt of emotion, narrative, vulnerability). Not recoverable from principles or Dancy-style pluralism. Grounded in salience calibration (perceptual psychology).
      *   **Audience:**
          1.  Rossian Pluralist (stable ordering, *pro tanto* reasons).
          2.  Kantian Constructivist (universalizability required to avoid arbitrariness).
          3.  Virtue Ethicist (worried about unprincipled intuitionism).
          4.  Moral Psychologist (Moral Foundations Theory, cross-cultural consistency).
      *   **Deliverables:** Q&A prep sheet with objections (phrased by audience), strategy (concede/hold), weakest reply, the "must land" reply, the weakest point in the position, the "hope they don't ask" question, conditions for changing mind, and meta-reflection on reasoning about audience.

  2.  **Deconstruct the Position (Frame-Sensitive Particularism):**
      *   *Strengths:* Explains moral nuance, aligns with phenomenology of moral experience, integrates psychology.
      *   *Weaknesses:* Risks relativism/arbitrariness, hard to define "frame" without circularity, potential conflict with cross-cultural data, difficult to account for moral disagreement or progress.
      *   *Key Distinction:* Dancy says a feature (e.g., lying) can be a reason *for* in one case and *against* in another (valence change). FSP says the feature *itself* changes identity or becomes a *different kind* of reason based on the frame (identity change/salience calibration).

  3.  **Drafting the Objections (Audience Personas):**

      *   **Rossian Pluralist:** Focuses on stability. If "withholding info" can be good or bad without a rule, how do we deliberate? Needs *pro tanto* stability.
          *   *Objection:* "You've made deliberation impossible. If the identity of the reason shifts, I can't weigh options beforehand."
      *   **Kantian Constructivist:** Focuses on universalizability and arbitrariness.
          *   *Objection:* "Without a universal law, your 'frame' is just a disguise for bias. How do you distinguish a 'correct' frame from a prejudiced one?"
      *   **Virtue Ethicist:** Focuses on character and intuitionism.
          *   *Objection:* "This sounds like 'I know it when I see it.' If it's about attunement, isn't that just virtue ethics without the account of character development?"
      *   **Moral Psychologist:** Focuses on empirical data (MFT).
          *   *Objection:* "MFT shows stable foundations (Care, Fairness, etc.) across cultures. Your 'irreducible framing' contradicts the structural consistency of moral cognition."

  4.  **Developing Strategies (Concede/Hold/Weakest):**
      *   *Rossian:* Hold firm on identity variance, concede that *some* stability is needed for communication (shared frames). Weakest point: Explaining how deliberation happens *ex ante*.
      *   *Kantian:* Hold firm on non-universalizability of specific frames, concede need for second-order norms on frame-selection. Weakest point: Avoiding the "arbitrariness" charge.
      *   *Virtue Ethic:* Concede overlap (attunement is phronesis), hold firm on the *relational* aspect (it's not just internal character, it's the interaction). Weakest point: Distinguishing from intuitionism.
      *   *Psychologist:* Hold firm on framing effects, concede that foundations exist but are modulated by frames. Weakest point: Cross-cultural consistency data.

  5.  **Identifying Critical Elements:**
      *   *The "Must Land" Reply:* Needs to address the arbitrariness/relativism worry (Kantian/Virtue). It must show that "frame" isn't subjective whim but constrained by the situation itself (the "gestalt").
      *   *The Weakest Point:* The "ex ante deliberation" problem. If reasons change identity based on the frame, how do I plan my action?
      *   *The "Hope They Don't Ask" Question:* Something about moral progress or radical disagreement. If frames are irreducible, how do we say one culture/frame is *better*?
      *   *Changing Mind:* Empirical data on frame stability vs. neural correlates of moral judgment.
      *   *Meta-Reflection:* Am I underestimating the Kantian's demand for justification? Am I overestimating the Psychologist's commitment to universal foundations?

  6.  **Refining the Content (Iterative Polishing):**
      *   *Tone:* Professional, strategic, philosophically precise.
      *   *Specifics:* Ensure the distinction between Dancy (valence switching) and FSP (identity/salience shifting) is clear in the replies.
      *   *Psychologist:* Make sure the MFT objection is specific (foundations vs. framing).
      *   *Meta-Cognition:* Be honest about where the user's reasoning about the audience might be biased (e.g., assuming the Virtue Ethic is hostile rather than sympathetic).

  7.  **Final Review against Constraints:**
      *   Q&A prep sheet format? Yes.
      *   Objections phrased as audience would? Yes.
      *   Concede/Hold/Weakest included? Yes.
      *   "Must Land" reply identified? Yes.
      *   Weakest point in position identified? Yes.
      *   "Hope they don't ask" question identified? Yes.
      *   Conditions for changing mind? Yes.
      *   Meta-reflection on audience reasoning? Yes.

  8.  **Drafting the Response:** (Self-Correction during drafting: Ensure I don't make the FSP view sound *too* much like Virtue Ethics, or the Virtue Ethicist will eat it alive. Need to emphasize the *relational/situational* ontology over the *agent-based* ontology.) *Correction:* Make sure the distinction between Dancy and FSP is sharp. Dancy allows holism about valence. FSP claims holism about *reason-identity* via salience.

  9.  **Final Polish:** Check the flow and ensure the "Must Land" reply is truly pivotal. (The pivot is that salience calibration is not arbitrary; it's responsive to the *world*, not just the *mind*.)

  *(Self-Correction on the "Hope they don't ask" question)*: The prompt asks for the question *I'm hoping the moral psychologist doesn't ask*. This should be specific to their field but devastating to the theory. Maybe about neural universals or specific cross-cultural experiments on framing. Let's go with the "Neural/Structural Universals" angle.

  *(Self-Correction on Meta-Reflection)*: Be critical of the user's assumption that the audience will attack in a specific order. Colloquiums are messy.

  10. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  # Q&A Prep Sheet: Frame-Sensitive Particularism (FSP)
  **Colloquium Defense | Next Thursday**

  ## 1. Anticipated Objections & Strategic Responses

  ### **I. The Rossian Pluralist**
  **The Objection:** "You claim the *identity* of a reason shifts with the frame, not just its weight. But if I cannot identify a feature as a *pro tanto* reason for truth-telling prior to entering the 'frame,' how is deliberation possible? You have rendered moral planning unintelligible. If 'withholding information' isn't identifiable as a reason until the gestalt is complete, I cannot weigh it against competing reasons *ex ante*. You haven't just rejected principles; you've rejected the possibility of agency."

  *   **Strategy:** **Hold Firm** on the ontology, **Concede** on the phenomenology of deliberation.
  *   **The Reply:** "Deliberation isn't the application of weights to static features; it is the *simulation of frames*. When I deliberate, I am not weighing 'lying' vs. 'kindness'; I am imaginatively inhabiting the potential interactional frames to see which salience calibration fits the reality of the other's vulnerability. The *pro tanto* reason is a retrospective abstraction, not a prospective building block."
  *   **Weakest Point:** This risks making deliberation sound like prophecy. If the frame is "irreducibly situational," how can I simulate it accurately before I'm in it?
  *   **What Would Change My Mind:** If you can produce a case where successful moral deliberation clearly relied on stable feature-identification *independent* of frame simulation (e.g., emergency triage protocols).

  ### **II. The Kantian Constructivist**
  **The Objection:** "You ground reasons in 'emotional posture' and 'narrative arc.' This is a recipe for arbitrariness. If the identity of a reason depends on my attunement to a frame, what constrains the frame itself? Without a universalizability test, your 'salience calibration' is indistinguishable from bias. How do you distinguish a 'correct' frame from a prejudiced one if not by reference to a law that holds across frames?"

  *   **Strategy:** **Hold Firm**. This is the crux of the view.
  *   **The Reply:** "The constraint is not a law, but the *resistance of the world*. A prejudiced frame fails to track the actual vulnerability of the other party; it imposes a narrative rather than attuning to one. The 'correctness' of the frame is measured by its fidelity to the relational reality, not its consistency with a prior maxim. Universalizability mistakes consistency for correctness."
  *   **Weakest Point:** "Fidelity to relational reality" sounds suspiciously like a hidden principle. You need to explain how we judge fidelity without a metric.
  *   **What Would Change My Mind:** A conceptual proof that "fidelity to vulnerability" necessarily entails a universalizable maxim (e.g., "Always attend to vulnerability").

  ### **III. The Virtue Ethicist**
  **The Objection:** "You speak of 'attunement,' 'gestalt,' and 'emotional posture.' This is just *phronesis* dressed up in psychological jargon. If the agent's character determines the salience, then you haven't escaped agent-centered normativity. You say this isn't intuitionism, but if you can't articulate the criteria for a 'calibrated' salience other than 'the virtuous agent sees it,' you are indistinguishable from the unprincipled intuitionism I warned you about."

  *   **Strategy:** **Concede Ground** (significant overlap), **Hold Firm** on the *Relational* Ontology.
  *   **The Reply:** "I concede the overlap in phenomenology. But Virtue Ethics locates the source of normativity in the *agent's character*. FSP locates it in the *interactional space*. The frame exists between us, not just in me. A virtuous agent might still fail if the relational frame is corrupted by power dynamics outside their character. My view explains moral tragedy where virtue ethics struggles: when the good person enters a frame that makes their goodness unintelligible."
  *   **Weakest Point:** Distinguishing "interactional space" from "agent's perception of space" is metaphysically thin.
  *   **What Would Change My Mind:** If the Virtue Ethicist can show that all "relational frames" are reducible to the agent's dispositions to perceive them.

  ### **IV. The Moral Psychologist (MFT)**
  **The Objection:** "Moral Foundations Theory shows cross-cultural consistency in the *structure* of moral cognition (Care, Fairness, Loyalty, etc.). You claim reasons are irreducibly context-dependent. But if the cognitive architecture is stable, aren't you just describing surface-level variation in how stable foundations are triggered? If I show you neural data that 'withholding info' activates the same Fairness/Cheating circuitry regardless of the frame, doesn't that undermine your claim that the reason's *identity* changes?"

  *   **Strategy:** **Hold Firm** on Interpretation, **Concede** on Architecture.
  *   **The Reply:** "Foundations are the *grammar*, frames are the *speech act*. The same neural circuitry can process 'punishment' in a game and 'punishment' in a family, but the moral reason is fundamentally different. Consistency in cognitive hardware does not entail consistency in moral ontology. My claim is about the *reason*, not the *mechanism*."
  *   **Weakest Point:** If the mechanism is identical, the claim that the "reason identity" is different becomes hard to substantiate naturalistically.
  *   **What Would Change My Mind:** fMRI evidence showing distinct neural signatures for the *same feature* in *different frames* that correlate with moral judgment variance.

  ---

  ## 2. Critical Pivot Points

  ### **The "Must Land" Reply**
  **Target:** The Kantian/Virtue Ethicist Alliance (Arbitrariness Charge).
  **The Line:** "Salience calibration is not a subjective projection; it is a *perceptual achievement*. Just as seeing a duck-rabbit image as a duck is not arbitrary but constrained by the lines, seeing a situation as requiring secrecy is constrained by the vulnerability present. If you deny this, you deny that moral perception can be veridical."
  **Why it must land:** If this fails, FSP collapses into subjectivism. You must establish that "frames" are *discovered*, not *chosen*.

  ### **The Weakest Point in Your Position**
  **The Issue:** **Moral Disagreement & Progress.**
  **The Vulnerability:** If reasons are frame-relative, how do we adjudicate disputes between agents in different frames? If a patriarchal frame makes "obedience" a reason for praise, and a feminist frame makes it a reason for condemnation, FSP seems to lack the resources to say one is *wrong*, only that they are *different*.
  **Preparation:** Do not hope they miss this. Prepare a "second-order salience" argument: Some frames are defective because they systematically blind agents to relevant vulnerabilities (e.g., the vulnerability of the subordinate). You must argue that *frame-critique* is possible from within the practice of moral attention.

  ### **The Question You Hope the Moral Psychologist Doesn't Ask**
  **The Question:** "If moral reasons are this sensitive to framing, do you predict that manipulating the narrative frame in a controlled experiment should *eliminate* the correlation between standard moral foundations and judgment? If so, why do we see robust effect sizes for foundations even when framing is controlled?"
  **Why it's dangerous:** It forces you to make empirical predictions that might be falsified by existing data. If foundations predict judgment *despite* framing manipulations, your claim that framing determines reason-identity is empirically weakened.

  ---

  ## 3. Meta-Reflection & Calibration

  ### **Conditions for Changing My Mind**
  1.  **Empirical:** If the Moral Psychologist presents data showing that "salience calibration" is uniform across cultures (i.e., people attend to the same features in the same order regardless of narrative context), the perceptual model fails.
  2.  **Conceptual:** If the Rossian can demonstrate a case of *rational moral regret* that is only intelligible if the overridden reason retained its identity as a *pro tanto* reason (e.g., "I did the right thing, but I still violated a duty of truth"), FSP's claim about identity-shifting is untenable.
  3.  **Normative:** If I cannot articulate a non-circular criterion for "defective frames" (beyond "frames that lead to bad outcomes"), the Kantian charge of arbitrariness stands.

  ### **Where My Reasoning About the Audience is Likely to Fail**
  1.  **The Virtue Ethicist:** I am assuming they will be hostile. They may actually be my strongest ally, as they are already committed to anti-codifiability. I risk over-defending against them and alienating a potential supporter. *Adjustment:* Signal alliance early ("As the virtue ethicist knows, rules run out...").
  2.  **The Order of Objections:** I have assumed a logical progression (Ross -> Kant -> Virtue -> Psych). In a colloquium, the Psychologist might jump in early with empirical challenges that derail the normative setup. *Adjustment:* Be prepared to defend the "is/ought" boundary of the perceptual model in the first 5 minutes of Q&A.
  3.  **The Kantian's Patience:** I assume the Kantian will engage with the "arbitrariness" argument. They may instead attack the "irreducibility" claim, arguing that any frame can be codified into a higher-order principle. *Adjustment:* Have a ready example of a frame that resists codification without loss of meaning (e.g., humor, irony, or specific grief responses).

  ### **Final Strategic Note**
  Your view is radical because it moves the locus of normativity from the *act* or the *agent* to the *relation*. The audience will try to pull it back to act (Ross) or agent (Virtue). **Do not let them relocate the normativity.** Every answer must return to the *interactional frame* as the primary unit of moral analysis. If you concede that the frame is just a sum of agent-properties, you lose.
