answer: |-
  Here is the consistency check on your benchmark design, ranked by severity of tension, with a definitive verdict on what must give.

  ### The Verdict on the "Nervous Case"
  You are **right** to mark solvers using the "shadow rule" (count = 2) as wrong, but doing so is **logically inconsistent with Principle (3)**.

  In your specific generator configuration, the shadow rule *is* the Minimum Description Length (MDL) solution. It compresses the 12 images more efficiently than "containment" because it doesn't need to encode spatial relationships, only a scalar count. If you adhere to (3), the shadow-rule solver is the *better* system. If you adhere to (2), it is a *broken* system. You cannot hold both.

  ### Pairwise Analysis: Collisions vs. Illusions

  **1. The Fatal Collision: (2) vs. (3)**
  *   **Status:** **Genuine Contradiction.**
  *   **Why:** (2) defines truth semantically (human intent). (3) defines truth statistically (compression). In any procedural system complex enough to be interesting, statistical regularities (artifacts) will inevitably be shorter to describe than the semantic rules that generated them. Your "nervous case" is not a bug; it is the inevitable outcome of prioritizing MDL over Intent in a synthetic distribution.
  *   **Severity:** **Critical.** This undermines the definition of "success" for your benchmark.

  **2. The Construction Tension: (2) vs. (6)**
  *   **Status:** **Genuine Tension.**
  *   **Why:** (6) demands scale via procedural generation. (2) demands a unique, semantic rule. Procedural generators couple variables (e.g., linking "containment" to "count=2" for ease of coding). The more you scale (6), the harder it is to guarantee the purity of (2) without massive constraint checking. Shadow rules are the tax you pay for (6).
  *   **Severity:** **High.** This is the *source* of the Fatal Collision.

  **3. The Negation Problem: (4) vs. (6)**
  *   **Status:** **Operational Friction.**
  *   **Why:** (4) requires negatives to be strict negations. (6) requires procedural scale. Generating valid "negations" procedurally is often harder than generating random distractors. To make (6) work, generators often sample negatives from a "different" distribution rather than logically negating the positive rule, which introduces confounds (like the shape count) that violate (4).
  *   **Severity:** **Medium.** This degrades the quality of the data but doesn't logically break the evaluation criteria like (2) vs (3) does.

  **4. The Illusion: (1) vs. (5)**
  *   **Status:** **Aligned.**
  *   **Why:** (1) demands generalization; (5) specifies *what kind* (compositionality). They support each other. A system that recombines primitives (5) will generalize to new figures (1). A system that memorizes shadows will fail (1) on truly novel compositions.
  *   **Severity:** **None.**

  ### Ranking Real Tensions by Severity

  1.  **(2) vs. (3):** **Definition of Truth.** If you keep both, your benchmark is schizophrenic. It claims to test human concepts but rewards dataset artifacts.
  2.  **(2) vs. (6):** **Purity vs. Scale.** The practical engine that creates the shadow rules.
  3.  **(4) vs. (6):** **Logic vs. Pipeline.** Implementation debt that creates the artifacts.

  ### The Single Commitment That Has to Give

  **You must drop Principle (3).**

  **Principle (3) (MDL/Simplicity Prior) cannot be the arbiter of truth in a synthetic benchmark.**

  MDL is a powerful heuristic for *natural* data where the environment is the constraint. In a *procedural* benchmark, the "environment" is your code. If your code leaks a shortcut (count=2), MDL *should* find it. That is what MDL is designed to do. Punishing a system for finding the MDL solution while claiming MDL is your metric is unfair and incoherent.

  ### The Cost of Dropping (3)

  1.  **Loss of Formal Grounding:** You lose the elegant information-theoretic justification for why one rule is "better" than another. You can no longer say "this rule is truer because it is simpler."
  2.  **Reliance on Generator Spec:** Ground truth shifts from the *images* to the *generator's source code*. You must assert that the semantic tag assigned during generation is the truth, regardless of whether a shorter description exists in the pixel space.
  3.  **Evaluation Burden:** You can no longer evaluate a solver purely on its output description length. You must evaluate its output description against a whitelist of allowed primitives (from 5) and the generator's semantic log.

  ### How to Repair the Consistency

  To make your "nervous case" handling consistent with the remaining principles:

  1.  **Demote (3) to a Tie-Breaker:** Use MDL only to distinguish between two rules that are *both* semantically valid (e.g., "inside" vs. "not outside"). Never use it to override the generator's semantic intent (2).
  2.  **Strengthen (6) to Protect (2):** You cannot eliminate shadow rules entirely, but you must treat them as **generator bugs**, not solver failures. If "count=2" predicts the label better than "containment," your generator is broken. You must add a constraint pass to your procedural pipeline that rejects any batch where a shadow rule (like simple counting) achieves 100% accuracy.
  3.  **Reframe (1):** Clarify that "generalizes to new figures" means "figures drawn from the **semantic distribution**, not the **procedural distribution**." This acknowledges that your procedural generator is an approximation of the concept space, not the concept space itself.

  **Summary:** Your intuition to mark shadow-rule solvers as wrong is correct for a Bongard benchmark. To keep that intuition, you must explicitly reject (3) as the definition of truth. Truth is defined by the intended concept (2), verified by compositionality (5), not by compression (3).
