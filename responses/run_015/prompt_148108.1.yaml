  2.  **Deconstruct the Philosophical Positions (Mental Check):**

      *   **D (Kantian):** Focus on the *maxim* and the *motive of duty*. "I do X because it is the law." If I do X because I like it, no moral worth.
      *   **R (Reasons-Responsiveness):** Focus on alignment with objective reasons. If I do X because I like it, but X is what reasons require, and I'm sensitive to those reasons, I get credit. (Often associated with Baron, Herman, or consequentialist adaptations).
      *   **V (Virtue Ethics/Williams):** Focus on character. Deliberating about duty suggests a defect in character. The virtuous person just *sees* the need and acts. (Bernard Williams' "One Thought Too Many").

  3.  **Deconstruct the Legal Vocabulary (Mental Check):**

      *   **Intent/Purpose:** Conscious object to engage in conduct/cause result.
      *   **Knowledge:** Aware that conduct is of that nature/result is practically certain.
      *   **Recklessness:** Conscious disregard of substantial risk.
      *   **Negligence:** Failure to perceive substantial risk (objective standard).
      *   **Motive:** The "why" behind the intent (e.g., greed, love). Generally irrelevant to *guilt*, relevant to *sentencing*.
      *   **Mistake of Fact:** Can negate *mens rea*.
      *   **Automatism/Insanity:** Negates voluntary act or capacity.

  4.  **Drafting the Translations (Iterative Process):**

      *   *View D (Duty):*
