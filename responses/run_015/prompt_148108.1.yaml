          *   *Bend:* Treating "duty" as a specific motive.
          *   *Fail:* Law doesn't reward acting *because* it's the law for guilt purposes.
      *   *View R (Reasons):*
          *   *Legal Match:* Negligence/Reasonable Person standard (objective responsiveness).
          *   *Bend:* Law looks at risk perception, not "right-making features."
