answer: |-
  This is a sophisticated confusion to be having, and your friend is half-right but fundamentally missing the point. He is correct that criminal law distinguishes between *intent* (the mental state regarding the act/result) and *motive* (the underlying psychological drive). However, he is wrong to assume the philosophical debate about moral worth maps cleanly onto that distinction.

  In criminal law, *motive* is generally irrelevant to liability (guilt) but relevant to sentencing. In your philosophy seminar, *moral worth* is the entire question. If we translate "moral worth" directly into "liability," we commit a category error. If we translate it into "sentencing mitigation," we lose the normative force.

  Below is the systematic translation you requested, using your criminal law vocabulary, followed by the case analysis and the residue report.

  ---

  ### Part 1: Systematic Translation of D, R, and V

  #### View D (Duty)
  *The Kantian Position: Moral worth requires acting from the motive of duty.*

  *   **What Translates:** This view maps most closely to a hyper-specific form of **Purpose** (intent). In law, Purpose means acting with the conscious object to engage in conduct or cause a result. For D, the "result" is the fulfillment of duty. It also resonates with the exclusion of **Motive** from the guilt phase: the law says "we don't care if you did it for greed or love," while D says "we don't care if you did it for love or inclination; it must be for duty."
  *   **What Bends:** To make this fit, you must treat "duty" as a **Motive** in the legal sense. Legally, "because it is the law" is rarely a motive; it is a recognition of obligation. D requires the *thought* of obligation to be the driving psychological force. In law, if you act because "it is the law," you are often just establishing **Knowledge** of the prohibition, not a specific moral motive.
  *   **What Cannot Be Expressed:** The law has no mechanism to reward acting *because* it is the law during the liability phase. In fact, if you act *only* because it is the law (without **Intent** to cause the harm), you might lack *mens rea* entirely. D's requirement that inclination *detracts* from worth has no legal counterpart; the law is indifferent to whether you enjoyed the crime or hated it.

  #### View R (Reasons-Responsiveness)
  *The Objective/Reasons Position: Moral worth requires sensitivity to right-making features.*

  *   **What Translates:** This aligns best with the **Negligence** standard and the **Reasonable Person**. Negligence asks: did the agent fail to perceive a risk that a reasonable person would have perceived? R asks: did the agent track the reasons a reasonable moral agent would track? It also fits **Mistake of Fact**: if the agent's belief about the facts prevents them from seeing the right-making feature, they lack worth (just as a mistake negates *mens rea*).
  *   **What Bends:** R allows for moral worth even if the agent's *normative* belief is wrong (e.g., they think duty forbids it, but they do it anyway for the right reasons). Law does not bend this way. A **Mistake of Law** is generally no defence. If you know the facts but think the law forbids the action, and you do it anyway, the law counts that as **Purpose** or **Knowledge**, regardless of your sensitivity to "right-making features."
  *   **What Cannot Be Expressed:** The concept of "sensitivity to reasons" is not the same as "causation by desire." Law uses a **but-for test** for causation. If your desire for X caused the act, and X happens to align with moral reasons, law sees causation. R wants to know if you were *tracking* the reason. Law has no vocabulary for "tracking" distinct from "causing."

  #### View V (Virtue/Spontaneity)
  *The Anti-Intellectualist Position: Moral worth requires acting without explicit principle consultation.*

  *   **What Translates:** This creates a tension with **Premeditation**. In law, premeditation (deliberate **Purpose**) often aggravates liability (First Degree Murder). V suggests deliberation about duty reduces worth. There is a structural parallel here: the law sometimes punishes the "cold calculator" more than the "passionate actor." V might find a home in **Sentencing**, where a judge might view a "crime of passion" or a "spontaneous act of charity" differently than a calculated one.
  *   **What Bends:** You have to bend the definition of **Voluntary Act**. V praises action that flows from character without conscious thought. Law requires a voluntary act for liability, but if an act is *too* spontaneous (reflexive), it risks becoming **Automatism**. V walks a tightrope between "virtuous habit" and "unconscious reflex."
  *   **What Cannot Be Expressed:** The law cannot distinguish between "virtuous spontaneity" and "compulsive habit" without psychiatric evidence (**Insanity**). V claims the virtuous agent acts without principle; the law suspects such agents might lack capacity. The "one thought too many" critique has no legal purchase; the law generally prefers the agent who *did* think about the rules (compliance) over the one who acted on instinct.

  ---

  ### Part 2: The Four Cases

  Here is how the three views distinguish (or collapse) these cases, compared to how Criminal Law categorizes them.

  #### Case 1: Huckleberry Finn
  *Agent helps the fugitive (right act) believing morality/law requires returning him (wrong belief).*

  *   **View D:** No moral worth. Agent acted against perceived duty.
  *   **View R:** Moral worth. Agent was responsive to the right-making feature (humanity/friendship) despite normative confusion.
  *   **View V:** Moral worth. Agent acted from natural sympathy without consulting the "slave law" principle.
  *   **Criminal Law:** **Liability** is established (harboring a fugitive). **Intent** is present (Purpose/Knowledge). **Motive** (sympathy) is irrelevant to guilt.
  *   **Distinction Check:** D distinguishes this from a standard dutiful agent. R and V group this with the standard good agent. Law groups this with any other intentional violator.
  *   **Collapse:** In legal terms, Huck is indistinguishable from a kidnapper who knows the law and violates it for money. Both have **Intent**. The philosophical distinction (R/V vs D) is invisible to the liability phase.

  #### Case 2: The Shopkeeper (Individual & Compliance Variant)
  *Agent gives correct change to maintain reputation (Individual). Variant: Head-office policy forces compliance (Corporate).*

  *   **View D:** No moral worth (Individual). Inclination (profit) drives the act.
  *   **View R:** Ambiguous. If the agent is sensitive to the norm of honesty *through* the profit motive, maybe. Usually No.
  *   **View V:** No moral worth. Calculating.
  *   **Criminal Law (Individual):** No crime. **Motive** (profit) is irrelevant.
  *   **Criminal Law (Compliance Variant):** This triggers **Corporate Liability**. The individual employee might lack **Purpose** (just following orders), but the corporation is liable via policy.
  *   **Distinction Check:** D distinguishes the Shopkeeper from the Dutiful Shopkeeper. Law does not distinguish them at all (neither committed a crime).
  *   **Collapse:** D and V collapse into the same judgment (No Worth). R might separate them if the shopkeeper is "sensitive" to honesty. But crucially, the **Compliance Variant** introduces a **Corporate Agent** which D, R, and V (focused on individual agency) struggle to process. Law handles this via vicarious liability; Philosophy handles this via collective responsibility (which is outside D/R/V).

  #### Case 3: The Lost Wallet
  *Agent returns wallet for self-interest (believes owner is neighbor), but owner is a stranger.*

  *   **View D:** No moral worth. Motive is self-interest.
  *   **View R:** Moral worth. The act was responsive to the right-making feature (property rights), even if the factual presupposition (neighbor) was wrong.
  *   **View V:** Moral worth. The action flowed from a disposition to return property.
  *   **Criminal Law:** No crime. **Mistake of Fact** is irrelevant because the act was lawful. If the agent had *kept* the wallet, the mistake (thinking it was a neighbor's) might negate **Intent** to steal (larceny requires intent to deprive *another*).
  *   **Distinction Check:** R distinguishes this from a case where the agent keeps the wallet. D distinguishes this from a case where the agent returns it from duty.
  *   **Collapse:** In legal terms, this case is a nullity (no liability). The philosophical debate is about *credit*, law is about *blame*. R and V collapse into "Praiseworthy," D says "Neutral." Law says "Irrelevant."

  #### Case 4: The Compulsion
  *Agent reliably does right from compulsion/habit, no reason given.*

  *   **View D:** No moral worth. Not from duty.
  *   **View R:** No moral worth. Not responsive to reasons; merely causal.
  *   **View V:** Ambiguous. If it is "second nature," Yes. If it is pathological, No.
  *   **Criminal Law:** If the compulsion negates voluntary control, this is **Automatism** (no act) or **Insanity** (disease of the mind). If it is just a "habit," it is a voluntary act.
  *   **Distinction Check:** D and R agree (No Worth). V is split.
  *   **Collapse:** D and R are indistinguishable here. Both require a specific cognitive relation to the act (Duty or Reasons). Law distinguishes based on *control* (Automatism), not the source of the impulse.

  ---

  ### Part 3: The Residue Report

  #### Direction 1: What Legal Vocabulary Misses (Law $\to$ Phil)
  Your worry is correct. The legal vocabulary is oblique to the philosophical distinctions in three specific ways:

  1.  **Intent vs. Reason:** Legal **Intent** (Purpose/Knowledge) tracks the *content* of the agent's aim (e.g., "I aim to hit him"). It does not track the *reason* for the aim (e.g., "because he insulted me" vs. "because it is my duty"). The D/R/V debate is entirely about the *reason for the aim*. Law captures this only as **Motive**, which it explicitly excludes from liability. Therefore, **Liability** cannot express Moral Worth.
  2.  **Causation vs. Tracking:** The legal **but-for test** asks if the desire caused the act. View R asks if the agent was *sensitive* to the right-making feature. An agent can be caused by a desire that aligns with reasons (R says Yes) without tracking the reason (Law says Yes, R says No). Law lacks a "tracking" variable.
  3.  **The Graded Hierarchy:** The hierarchy (Purpose $\to$ Knowledge $\to$ Recklessness $\to$ Negligence) grades *culpability*, not *credit*. View V suggests that acting with less deliberation (closer to Negligence/Instinct) might be *more* morally worthy. Law assumes more deliberation (Purpose) implies more control and thus more liability. The vectors point in opposite directions.

  #### Direction 2: What Philosophy Misses (Phil $\to$ Law)
  The D/R/V debate has blind spots that Criminal Law fills:

  1.  **Institutional Agency:** The **Shopkeeper Compliance Variant** shows law dealing with policies and corporate structures. D/R/V are theories of individual moral psychology. They have no vocabulary for a "compliance regime" acting as a moral agent.
  2.  **Strict Liability:** Law sometimes imposes liability without **Mens Rea** (Strict Liability). The D/R/V debate presupposes that moral worth depends entirely on the mental state. Law acknowledges that sometimes the *outcome* matters regardless of the mental state (e.g., statutory rape, traffic violations). This suggests "Moral Worth" is not the only normative game in town; "Risk Allocation" is another.
  3.  **The Disposition Question:** Law uses **Sentencing** to deal with what the agent *is* (dangerousness, character), whereas D/R/V ask what the *action* is worth. The defence of **Insanity** admits that an agent might do the "right" act (or wrong act) without being a proper subject of judgment at all. D/R/V assume the agent is in the game; Law asks if they are eligible to play.

  #### Is the Residue a Defect or a Difference of Purpose?
  It is primarily a **Difference of Purpose**, but with a verbal overlap that causes your confusion.

  *   **Law's Purpose:** Regulatory and Retributive. It needs clear, adjudicable standards (**Reasonable Person**, **Purpose**, **Knowledge**) to justify state coercion. It cannot probe the "true reason" an agent acted because that is epistemically inaccessible and irrelevant to the harm caused.
  *   **Philosophy's Purpose:** Evaluative and Aretaic (character-focused). It asks what is *admirable*, not what is *punishable*.

  **Is the D/R dispute verbal?**
  Partly. D and R often disagree on how finely to individuate the "consideration" the agent acted on.
  *   **D** says: "Helping because you like them" and "Helping because duty requires it" are distinct mental states.
  *   **R** says: If "liking them" is a response to their "worthiness of help," then you *are* responding to the duty-relevant feature, even if you don't label it 'duty'.
  *   **Legal Light:** This looks like a **Mistake of Fact** vs. **Mistake of Law** problem. If I think "I like him" but the truth is "He is a person deserving respect," is that a factual error about my motive or a normative error about my reason? Law sidesteps this by calling it **Motive** and ignoring it. Philosophy fights over it because it defines the moral self.

  ### Conclusion for Your Study Group

  Tell your friend this:
  *"You are right that law distinguishes Intent from Motive. But Moral Worth isn't Motive. Motive is 'Why do you want to do it?' (e.g., greed). Intent is 'What do you mean to do?' (e.g., take the money). Moral Worth is 'What reason did you take as sufficient?' (e.g., duty vs. inclination).*

  *Criminal law excludes Moral Worth from **Liability** because it is too hard to prove and irrelevant to the harm. It relegates it to **Sentencing**. But your seminar is asking about Moral Worth as the primary question. If we translate Moral Worth into Liability, we lose the Huck Finn case (guilty but praiseworthy). If we translate it into Sentencing, we lose the binary nature of the D/R/V debate.*

  *The residue isn't a defect in legal vocabulary; it's proof that Law is not Moral Philosophy. Law asks 'Did you break the rule and can we blame you?' Philosophy asks 'Did you embody the good?' The D/R/V debate is about the second question. Your legal vocabulary is built for the first."*
