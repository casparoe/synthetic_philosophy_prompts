          *   *Fail:* Law requires a voluntary act, but doesn't distinguish "virtuous spontaneity" from "reflex."

  5.  **Applying the Test Cases:**

      *   *Case 1 (Huck Finn):* Does right (helps Jim), believes wrong (returning slave).
          *   D: No worth (acted against perceived duty).
          *   R: Worth (responsive to humanity/friendship).
          *   V: Worth (natural sympathy).
          *   Law: Guilt depends on the act (harboring fugitive). Motive irrelevant to guilt.
      *   *Case 2 (Shopkeeper):* Honest for profit.
          *   D: No worth (inclination/profit).
          *   R: Maybe (if sensitive to honesty norms?), usually No (instrumental).
          *   V: No (calculating).
          *   Law: No crime committed. Motive (profit) irrelevant. Compliance variant: Corporate liability.
      *   *Case 3 (Wallet):* Returns for self-interest (false belief).
          *   D: No worth (self-interest).
          *   R: Worth (action aligned with reasons, despite belief).
