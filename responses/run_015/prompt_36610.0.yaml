  The global standardization of the intermodal shipping container between 1956 and 1970 serves as a case where apparent lock-in masks an underlying economic and physical convergence.

  The lock-in reading argues that the specific dominance of the 8-foot-wide, 20-foot-long ISO container was a historical accident driven by Malcolm McLean's background as a trucker rather than a shipper, the subsidies of the U.S. Military during the Vietnam War, and the constraints of American highway bridge limits. On this view, the massive switching costs of retrofitting global ports with specific cranes and straddle carriers created a high barrier to entry that froze the standard early; had the U.S. Navy not validated McLean's design or had European railways led the initiative, we would likely have a fractured world of incompatible metric containers or pallet-based systems, similar to the persistence of different rail gauges. The outward signs support this: there was a fierce standards battle between Sea-Land, Matson, and various national bodies in the 1960s, and the eventual victory of the U.S.-derived dimensions looks like the triumph of one early mover leveraging geopolitical hegemony rather than pure technical superiority.

  The convergence reading contends that the *system* of standardized intermodalism was inevitable regardless of the specific actors or dimensions, driven by the universal economics of labor and the physics of cargo handling. By the 1950s, break-bulk shipping had hit a hard efficiency wall: labor costs were rising globally, cargo theft was endemic, and ship turnaround times were dominated by port dwell time rather than sea transit. Multiple independent actors—including Grace Line, Matson, and European rail authorities—were experimenting with container-like solutions simultaneously, indicating that the pressure was systemic, not individual. The advantages of the container were visible in advance through straightforward accounting of labor hours per ton, not manufactured retrospectively; McLean's first voyage proved a cost reduction that any competitor could verify and match. The switching costs, while high, were not technically unrecoverable but rather competitively selective: ports that refused to adapt (like much of New York's waterfront) simply lost traffic to those that did (like Newark/Elizabeth), meaning the infrastructure lock-in was a result of market convergence on efficiency, not an accident preventing a better alternative.

  The specific features that decide between these two hypotheses are the number of live alternatives at the critical juncture and the nature of the switching costs. At the critical juncture (1956–1965), there were at least three live alternatives: continued break-bulk, palletization, and bulk carriers for dry goods. All were viable technologies, yet all lost ground to the container globally, even in regions with no U.S. military influence, suggesting a convergence on the module concept itself. Furthermore, the switching costs were financially heavy but technically flexible; cranes can be built to lift 2.5-meter boxes just as easily as 2.44-meter boxes. The fact that the world adopted the U.S. dimensions was less about technical lock-in and more about the speed of U.S. adoption forcing a temporary standard that others joined to access the U.S. market, after which the network effects locked in the *existence* of a standard, not necessarily the specific inch-based measurements.

  The single strongest reason to think this call is wrong is that the specific dimensions of the container (8 feet wide) are dictated entirely by the clearance limits of U.S. highways in the 1950s, a purely contingent geographic fact. If the system had originated in Europe, the standard width would likely have been a round metric figure (e.g., 2.5 meters), and given the history of rail gauges, there is a significant probability that the world would have settled into two incompatible blocs (Imperial vs. Metric) rather than converging on a single global standard. The fact that the entire world adopted the Imperial foot-based constraint suggests that U.S. geopolitical power (path dependence) was the decisive factor, not an inevitable convergence on an optimal design.
