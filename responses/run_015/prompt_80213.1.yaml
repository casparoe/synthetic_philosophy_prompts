      *Okay, ready to write.*
answer: |-
  The hologram hovered above the bench, a soft blue sphere pulsing with a single number: *4.2%*.

  Recidivism risk.

  Judge Elena Vance stared at it until the pixels blurred. Under the Public Safety & Rehabilitation Act, the number was verdict enough. Below 5% meant release into community supervision. Locking Julian Kress away would be statistically inefficient, a waste of state resources, and legally classified as torture. The law no longer cared about balance sheets of pain. It cared about vectors.

  "Your Honor," said Kael Thorne, the defense attorney. He didn't stand; he leaned against the railing, casual, as if discussing weather patterns. "The neuro-scan confirms anterior cingulate dysfunction compounded by early environmental stressors. Julian's actions were the inevitable result of antecedent causes. He is rehabilitated. The algorithm confirms he is safe. To detain him further serves no purpose but vengeance."

  Vance gripped her pen. The wood was warm from her hand. "Vengeance is not the word used in the statute, Counselor."

  "Semantics," Thorne said. He glanced at the gallery, where Mrs. Gable sat. Her husband sat beside her, staring at his hands. Their daughter was the one Julian had killed. A bar fight. A shove. A head struck on concrete. "Detaining a rehabilitated man because it feels good to the victim's family is barbarism. It's treating a human being as a means to soothe another's grief. Julian didn't *choose* this in the way you imply. He was pushed by physics and biology."

  "He chose to swing," Vance said. Her voice was tighter than she intended.

  "He chose based on the state of his brain," Thorne corrected. "Would you punish a man for a seizure? His violence was a seizure of character. Causality doesn't stop at the skin."

  Mrs. Gable stood up. The bailiff moved, but Vance waved him down.

  "He looked her in the eye," Mrs. Gable said. Her voice wasn't loud, but it cracked the sterile air of the courtroom. "He didn't have a seizure, Counselor. He got angry. He wanted to hurt her. And now he gets to walk? Because a machine says he won't do it again?"

  "The machine says he doesn't need to be contained," Thorne said gently. "We are not here to weigh souls, Mrs. Gable. We are here to manage risk."

  "There is no justice without weight!" she cried. "If he doesn't suffer, then her death means nothing. It's just... trash."

  Vance felt the heat rise in her chest. It was a familiar heat, a burning coal she had swallowed years ago when the Act passed. She believed in choice. Not magical, soul-based choice, but the practical kind. The kind where you could have done otherwise if you'd wanted to, and you *should* have wanted to. That was the compatibilist anchor she held onto in the storm of determinism. People were agents. Agents owed debts.

  But the statute was blind to debts. It only saw hazards.

  "Mrs. Gable, please," Vance said. "I understand your pain."

  "Do you?" Mrs. Gable turned her eyes on the Judge. "Or do you just understand the law?"

  Vance looked down at the file. Julian Kress sat at the defense table. He looked calm. Remorseful, even. He had undergone six months of aggressive cognitive restructuring. He was, by every metric, a new man. The old man was dead.

  So why did Elena want to break him?

  She looked at Thorne. He was watching her, not with hostility, but with a clinical pity. He knew what she was thinking. He knew the itch in her hand, the desire to bring the gavel down—not to protect society, but to strike.

  *Is it truth, Elena?* Thorne's silence seemed to ask. *Or is it just hunger?*

  That was the charge the determinists leveled. They said retribution was just evolved aggression dressed up in robes. They said 'desert' was a phantom limb, aching for a body that never existed. If she sentenced Julian to suffer simply because he *should*, was she upholding moral order, or was she just satisfying a primitive urge to see blood for blood?

  If she couldn't distinguish between moral truth and biological rage, then Thorne was right. She was just another animal lashing out.

  "Counselor," Vance said to Thorne. "You argue he is safe."

  "Statistically certain."

  "And you argue he bears no moral burden because his actions were determined."

  "I argue that 'burden' is a theological concept, not a legal one. The law is engineering now. We fix breaks. We don't punish cracks."

  Vance looked at Julian. "Do you feel you deserve to be here, Mr. Kress?"

  Julian shifted. "I feel... I feel sorry. I want to make it right. But I don't think putting me in a cage helps anyone. Thorne is right. I'm not that person anymore."

  "That person is still you," Vance said. "Continuity of identity isn't broken by therapy."

  "It is if the causal chain changes," Thorne interjected.

  Vance ignored him. She looked at the 4.2%. If she released him, she was obeying the law. She was acknowledging that free will was too slippery to build prisons on. If she detained him, she would be overturned on appeal, sanctioned, perhaps removed. She would be breaking the law to satisfy her own conviction that pain was the only appropriate language for this crime.

  But the law offered loopholes. It always did. Safety was subjective.

  "Mr. Kress," Vance said. "The court accepts the risk assessment. You are not a danger to the public."

  Mrs. Gable made a sound, a sharp intake of breath that sounded like tearing fabric.

  "However," Vance continued, "the court finds that your reintegration requires a structured environment to ensure the stability of your rehabilitation. Community supervision is granted, but under Condition Alpha."

  Thorne straightened up. "Condition Alpha is reserved for high-risk offenders, Your Honor. It involves electronic confinement."

  "The statute defines Alpha as 'intensive monitoring for stability verification'," Vance said, her voice flat. "Given the severity of the outcome, the court verifies that stability requires confinement to a residential facility during non-working hours. Indefinitely."

  It wasn't prison. He could work. He could leave during the day. But every night, he would return to a locked dormitory. He would lose his freedom. He would suffer the loss of liberty. It looked like punishment. It felt like punishment. But on paper, it was safety. It was rehabilitation.

  Thorne stared at her. He saw the maneuver. He saw the lie. "Your Honor, this is a pretext. You are smuggling retribution into a consequentialist framework."

  "I am ensuring public safety," Vance said. "The psychological impact of the crime on the community requires visible assurance of stability."

  "That's nonsense," Thorne said. "You're doing this because you believe he deserves it. You're violating the Act's spirit."

  "The Act is the text, Counselor. Not your philosophy."

  Mrs. Gable was crying quietly. It wasn't victory. It was too small. A dormitory wasn't a grave. But it was something.

  Vance banged the gavel. The sound was final, hollow.

  "Court adjourned."

  She retreated to her chambers before the gallery could empty. She locked the door and sat in the silence. The hologram was gone, but the number *4.2%* burned behind her eyelids.

  She had found a way to make him pay. She had used the language of safety to deliver the language of deserts. She had protected the law from herself, and herself from the law.

  But as she sat in the quiet, the heat in her chest didn't cool. It curdled.

  Thorne's words echoed. *You're just hurting him because it feels good.*

  Had she saved justice? Or had she just proven Thorne right? If the only way to enact 'desert' was to lie about 'safety,' then maybe desert was indeed a phantom. Maybe the only real thing was the biology of anger, and she was just a neuron firing in a larger brain that had outgrown her.

  She looked at her hands. They were steady. They had signed the order.

  Outside the door, she could hear the murmur of the hallway. Mrs. Gable would not be satisfied. Julian would not understand why he was confined if he was safe. Thorne would appeal, and he might win, and then Julian would walk.

  Vance closed her eyes. She tried to find the moral truth in her decision, the clean line of rightness. She tried to feel the weight of the scales balancing.

  All she felt was the pulse in her throat, beating fast, angry, and human. She couldn't tell if it was the rhythm of justice, or just the blood.
