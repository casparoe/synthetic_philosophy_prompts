      Okay, so the ending must leave the question open. Is she right to feel he deserves pain, or is Thorne right that it's just barbarism?

      *Key moment:* The judge's internal interrogation. "Is this justice or is this hunger?"

      *Let's go.*

      *(Word Count Check)*: Keep an eye on the length. Don't ramble on the backstory. Stay in the courtroom and her head.

      *(Revised Plan)*:
      1. The Algorithm result (4%).
