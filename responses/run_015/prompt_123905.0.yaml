answer: |-
  Here is the principle that underlies your verdicts, stated as a defensible paragraph, followed by the mapping, the concessions, and the test cases.

  ### The Principle

  **Care is public infrastructure that requires formal visibility to be socially funded, and entitlements must be structured to disrupt structural inequality rather than subsidize private preference.** The state socializes the cost because a cared-for generation and a workforce not penalized for reproduction are common goods, but funding demands verification, so only registered care qualifies. Consequently, the entitlement belongs to the child's need for development and the parents' need for equity, not to the parents' property rights; it cannot be sold, monopolized by one caregiver, or used to reinforce traditional gendered divisions of labor.

  ### What Clause Does What

  *   **"Public infrastructure... common goods":** Does the work on **Verdict 8** (payroll levy) and **Verdict 6** (no selling leftovers). If care is infrastructure like schools, you don't opt out of the levy, and you don't sell your lane on the highway to someone else.
  *   **"Requires formal visibility":** Does the work on **Verdict 5** (no unregistered nanny) and **Verdict 3 & 4** (grandparents/friends okay *if* registered). This justifies paying for home care but only when the state can verify the labor. It also drives the ambivalence on **Verdict 7** (migrant workers); without work rights, there is no visibility, so the principle says "no," even if reality says "yes."
  *   **"Disrupt structural inequality":** Does the work on **Verdict 1 & 2** (father's time mandatory, mother-only blocked). This overrides stated preference because the goal is equity, not just choice. It also drives **Verdict 11** (flat wage); valuing care equally regardless of market salary treats care as infrastructure, not labor-market substitution.
  *   **"Not to parents' property rights":** Reinforces **Verdict 6** (no selling) and **Verdict 10** (pension credits). The unused hours convert to pension because the state is rewarding the *savings to the system*, not penalizing the care, though this creates tension if one parent does all the work.

  ### Where You Lose Ground

  You expected to lose **5 and 9**, and the principle confirms why.

  *   **Verdict 5 (Unregistered Nanny):** The principle supports your verdict ("No") but exposes your discomfort. If care is infrastructure, the *setting* (home vs. nursery) shouldn't matter, only the *visibility*. Your hesitation comes from knowing that "visibility" is often a proxy for "institutional bias." The principle forces you to admit you are prioritizing regulation over accessibility here.
  *   **Verdict 9 (Job Protection):** The principle cannot accommodate this contradiction. "Public infrastructure" funds the care; it does not dictate employment law. You cannot simultaneously demand eighteen months of job protection (a labor law constraint) and exempt small firms (an economic viability constraint) without a higher-order rule about business risk. The principle forces you to pick: either job protection is part of the care infrastructure (no exemptions), or it is separate (market rules apply).
  *   **Verdict 10 (Pension Credits):** The principle highlights the flaw you sensed. If the goal is to "disrupt inequality," rewarding *unused* hours with pension credits incentivizes *less* care time, potentially penalizing the primary carer who uses all their hours. The principle suggests the pension credit should reward *hours used*, not hours saved.

  ### The Test Cases

  **1. A parent who wants to draw hours to look after a seven-year-old over the summer.**
  **Verdict: No.**
  **Reasoning:** The principle defines care as "public infrastructure" for early development and workforce re-entry. By age seven, compulsory schooling provides the infrastructure. The entitlement is designed to cover the gap where market care is unavailable or prohibitively expensive (0–5 years). Extending it dilutes the specific public good of early childhood development and maternal labor force attachment.

  **2. Someone who wants to draw hours to care for their own elderly mother.**
  **Verdict: No.**
  **Reasoning:** While the logic of "care as infrastructure" applies, the *entitlement* is per-child to address specific demographic and gendered inequities regarding reproduction. Elderly care is a different lifecycle risk with different funding structures (e.g., social care vs. childcare). Merging them conflates two distinct policy silos; the principle supports a *similar* scheme for elders, but not drawing from a child's account.

  **3. A couple who split the account fifty-fifty but both keep working three days a week, drawing hours on the other two.**
  **Verdict: Yes.**
  **Reasoning:** This fits the principle perfectly. It ensures "formal visibility" (registered care hours), it "disrupts structural inequality" (both parents share care and work), and it treats care as "public infrastructure" (subsidizing the gap rather than replacing income entirely). It maximizes the equity goal without monopolizing the care or exiting the workforce.
