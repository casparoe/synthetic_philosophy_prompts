answer: |-
  Here's the prep list for the careenium interview. Kept it tight on the mechanics so we don't drift into bio stuff.

  **1. The Emergence Distinction**
  Standard non-reductive physicalism says higher-level properties emerge but don't strictly push the lower-level stuff around without supervenience. If your simmballs are actually pushing the substrate, how do you seperate this from standard downward causation without just renaming it?
  *   **Follow-up 1 (If she says "It's a research program, not settled"):** So right now, there's no formal distinction? It's just a heuristic until the math catches up?
  *   **Follow-up 2 (Close):** Then why present it as a mechanistic model rather than a metaphor? If you can't define the boundary between emergence and your "push," isn't it just vocabulary swapping?

  **2. The Symbol-Grounding Circularity**
  If the syntax of the simmballs is doing physical work, aren't you risking circularity? Usually, meaning is grounded in the physical, but here the symbol moves the matter that grounds it. How do you avoid that loop?
  *   **Follow-up 1 (If she says "We're developing the grounding model"):** Does that mean the current model assumes what it's trying to prove?
  *   **Follow-up 2 (Close):** If the grounding isn't established, isn't the causal claim unfalsifiable? You're saying symbols move matter because they have meaning, but the meaning depends on the matter moving.

  **3. Empirical Disconfirmation**
  What empirical result would actually disconfirm the claim that the causal push is genuinely symbolic rather than just complex chemistry in disguise?
  *   **Follow-up 1 (If she says "Future tech will reveal the layer"):** That kicks the can down the road. What fails *today* if you're wrong?
  *   **Follow-up 2 (Close):** If no current experiment can distinguish "symbolic push" from "chemical reaction," isn't this currently indistinguishable from magic?

  **4. Conservation of Energy**
  When a simmball pushes the substrate, where does the energy come from? If information is causing physical displacement, are you violating conservation laws?
  *   **Follow-up 1 (If she says "Physics needs updating anyway"):** So you're banking on future physics to bail out the energy budget?
  *   **Follow-up 2 (Close):** Until that physics exists, isn't your model definitly breaking a law we know holds true? How do you publish that as science rather than speculation?

  **5. Causal Closure/Overdetermination**
  If the physical substrate is already causally closed, what work is left for the simmball to do? Are you suggesting every physical event is overdetermined by both chemistry and symbol?
  *   **Follow-up 1 (If she says "It's constitutive, not separate"):** Then the symbol isn't pushing anything, it's just describing the push.
  *   **Follow-up 2 (Close):** Which is it? If it's constitutive, you lose the causal claim. If it's causal, you have overdetermination. You can't have both.

  **6. The Scale Threshold**
  At what granularity do simmballs become active? Does a single atom have a simmball, or does it require a cluster? Where's the cutoff?
  *   **Follow-up 1 (If she says "It's emergent so the scale is fuzzy"):** Fuzzy scales make quantitative prediction impossible.
  *   **Follow-up 2 (Close):** How do you write a differential equation with a fuzzy variable? If you can't, how is this a mechanical model?

  **7. The Interaction Term**
  In your equations, what variable represents the "symbolic" force? Is there a specific term for the simmball push, or is it hidden in the constants?
  *   **Follow-up 1 (If she says "That's part of the ongoing research"):** So the core mechanism of your theory doesn't have a variable yet?
  *   **Follow-up 2 (Close):** Then what are we debating? You're defending a ghost variable. Show me the term or admit it's not yet a physical theory.
