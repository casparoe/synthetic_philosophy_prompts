          *   Root Context: `eval_root :: Attitude -> IO ()` (perform speech act).
          *   Embedded Context: `eval_embed :: Attitude -> Bool` (needed for `->`, `∧`, `¬`).
          *   *Type Error:* You can't feed `Attitude` into `->`.
      *   *The FGP:* It's a *contextual typing* failure. The term `P` must have the same type in both contexts to ensure substitution preserves validity (type safety).
      *   *Solutions:*
          *   *Blackburn:* Define a logic on `Attitude`. `implies_A :: Attitude -> Attitude -> Attitude`. Prove it mirrors `implies_B`.
          *   *Gibbard:* Change the base type. `Attitude` isn't primitive. It's `Plan = Situation -> Choice`. Now `Plan` can compose functionally.
