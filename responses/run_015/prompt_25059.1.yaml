answer: |-
  You are not flattening it too much. Your intuition is correct: at its core, the Frege–Geach (FG) problem is a **compositionality failure** arising from a **type mismatch** between the semantic value of atomic moral sentences and the operators that embed them.

  However, the constraint on the solution is much tighter than in standard PL semantics. In PL, if your denotations don't compose, you change the semantics. In metaethics, the expressivist is philosophically committed to a specific denotation (attitudes, not truth-values) and cannot simply switch to Cognitivism (Booleans) without abandoning the project. They must make `Attitude` compose like `Bool`.

  Here is the translation of the dialectic into your vocabulary, followed by the residue report.

  ---

  ### Part 1: The Translation

  #### 1. The Expressivist Starting Point: A Type Error
  Let $\mathcal{L}$ be our language. In standard denotational semantics (Cognitivism), we define a valuation function $[\![ \cdot ]\!] : \mathcal{L} \to \{0, 1\}$. Logical connectives are functions over this domain:
  $$ [\![ P \to Q ]\!] = f_{\to}([\![ P ]\!], [\![ Q ]\!]) $$
  where $f_{\to} : \{0, 1\} \times \{0, 1\} \to \{0, 1\}$. Compositionality holds.

  **Expressivism** proposes a different base type. Let $\mathcal{A}$ be the type of **Attitudes** (e.g., plans, disapproval states, hyperplans).
  $$ [\![ \text{"Lying is wrong"} ]\!]_{\text{exp}} = a_{\text{lie}} \in \mathcal{A} $$
  In root position (assertion context), this type is consumable. We have an evaluation context `assert` that takes an attitude and performs a speech act or updates a mental state:
  $$ \text{assert} : \mathcal{A} \to \text{IO}() $$

  **The Frege–Geach Problem** arises when we introduce embedding operators. Consider the conditional `If P then Q`. Syntactically, `P` is in the antecedent position.
  Semantically, the conditional operator expects arguments of type `Bool` (or `Prop`) to define truth conditions for validity (Modus Ponens).
  $$ \text{cond} : \text{Bool} \times \text{Bool} \to \text{Bool} $$
  But Expressivism provides $\mathcal{A}$.
  $$ \text{cond}([\![ P ]\!]_{\text{exp}}, [\![ Q ]\!]_{\text{exp}}) \implies \text{Type Mismatch} $$
  You cannot apply `cond` to $a_{\text{lie}} \in \mathcal{A}$.

  Furthermore, **Validity** requires **Substitution Invariance**. For Modus Ponens to be valid, the term $P$ must denote the *same value* in the premise $P$ and in the antecedent of $P \to Q$.
  *   In premise $P$: $[\![ P ]\!] = \text{BOO}(\text{Lying})$ (an active attitude).
  *   In antecedent $P \to Q$: The speaker is *not* expressing BOO(Lying). They are hypothetically considering it.
  *   If $[\![ P ]\!]_{\text{root}} \neq [\![ P ]\!]_{\text{embed}}$, then the argument is an **Equivocation Error** (like using a variable bound in two different scopes). The inference is unsound.

  #### 2. The Solutions as Semantic Engineering

  Expressivists need to define a compositional semantics over $\mathcal{A}$ that is isomorphic to classical logic over $\text{Bool}$.

  **A. Blackburn's Quasi-Realism (Logic of Attitudes)**
  Blackburn attempts to define logical operators directly on $\mathcal{A}$.
  *   **Strategy:** Define a type class `Logical` for $\mathcal{A}$.
  *   **Implementation:** Define $\neg_{\mathcal{A}} : \mathcal{A} \to \mathcal{A}$ and $\to_{\mathcal{A}} : \mathcal{A} \times \mathcal{A} \to \mathcal{A}$.
  *   **Constraint:** These operators must satisfy the same algebraic laws as Boolean operators to preserve validity.
  *   **PL Analogy:** You are defining a custom logic on a non-standard data type. The difficulty is explaining what $a_1 \to_{\mathcal{A}} a_2$ *means* psychologically. It's not truth-functional; it's a higher-order attitude (e.g., "disapproving of having the first attitude without the second").
  *   **Risk:** This often feels like "faking" the Boolean structure. If $\mathcal{A}$ behaves exactly like $\text{Bool}$, why isn't it just $\text{Bool}$? (This is the "Cognitivist collapse" worry).

  **B. Gibbard's Hyperplan Semantics (World-Parameterized Functions)**
  Gibbard offers the most PL-friendly solution. He refines the type $\mathcal{A}$.
  *   **Type Definition:** An attitude is not a primitive. It is a **Hyperplan**: a function from possible worlds (or situations) to choices.
      $$ \mathcal{A} \equiv \text{World} \to \text{Choice} $$
  *   **Composition:** Now, embedding works because we are composing functions.
      *   "Lying is wrong" denotes a function that rules out worlds where lying occurs.
      *   "If lying is wrong..." denotes a constraint on the function space.
  *   **PL Analogy:** This is **Continuation-Passing Style (CPS)** or **Possible Worlds Semantics**. The "attitude" is a predicate over worlds.
      *   $[\![ P ]\!] : W \to \{0, 1\}$ (effectively a proposition).
  *   **The Trick:** Gibbard argues these aren't truth-conditions *per se*, but **consistency conditions** on plans. Validity is preservation of **plan-consistency**, not truth.
  *   **Result:** This solves compositionality by making the denotation richer (functions instead of primitives), allowing them to be manipulated under binders.

  **C. Hybrid Type-Shifting (Barker, Chrisman)**
  *   **Strategy:** Polymorphic types. Moral sentences denote a type that can project to `Bool` or `Attitude` depending on the evaluation context.
  *   **PL Analogy:** A Monad `M a`.
      *   Root context: `join :: M Attitude -> IO ()`
      *   Embedded context: `fmap :: (a -> b) -> M a -> M b`
  *   **Implementation:** The sentence denotes a computational effect. Embedding lifts the effect into a larger computation without executing it.
  *   **Benefit:** Preserves the "action-guiding" nature (the effect) while allowing logical composition (the monadic structure).

  ---

  ### Part 2: The Residue Report

  Here is where the translation strains. You asked what maps cleanly, what is fudged, and what is missing.

  #### 1. What Translates Cleanly
  *   **Compositionality:** The structural problem is identical. You have terms that denote $X$ in context $C_1$ but need to denote $Y$ in context $C_2$ to satisfy the operator's signature.
  *   **Validity as Preservation:** In PL, type safety ensures terms don't "go wrong." In logic, validity ensures truth is preserved. In Expressivism, validity ensures **attitude consistency** is preserved. The structural role of "validity" is isomorphic.
  *   **Scope and Binding:** The distinction between asserting $P$ and assuming $P$ in a conditional is exactly the distinction between evaluating an expression in the global environment vs. a local lambda binding.

  #### 2. What Had to Be Fudged
  *   **The Nature of $\mathcal{A}$:** In PL, types are mathematical sets. In metaethics, $\mathcal{A}$ (Attitudes/Plans) is a psychological/normative category. When Gibbard says a moral judgment is a "plan," he isn't just defining a data structure; he is making a claim about human psychology and motivation. Translating this to `World -> Choice` sanitizes the *motivational internalism* (the idea that judging "wrong" necessarily motivates you not to do it).
  *   **"Truth" vs. "Correctness":** In your semantics, `Bool` is abstract. In metaethics, `Bool` carries the weight of **Truth**. Expressivists want to say moral sentences aren't "true" but are still "correct" or "appropriate." Distinguishing semantic correctness from truth-conditions is a distinction PL semantics rarely needs to make (except perhaps in partial logics or error semantics).

  #### 3. What Has No Counterpart (The Metaethical Residue)
  This is the answer to your core question. There are two features of the FGP that do not reduce to standard compositionality problems.

  **A. The Normativity Constraint**
  In PL, if you fix the compositionality bug, you're done. If you define `Attitude -> Attitude -> Attitude` and it composes, the compiler is happy.
  In metaethics, fixing the compositionality is not enough. The semantics must also explain **Normative Force**.
  *   *PL:* `if (x > 0) then y` describes a state of affairs.
  *   *Ethics:* `If lying is wrong...` commits the speaker to a *norm*.
  The FGP isn't just "how do these types compose?"; it is "how do these types compose **such that they still function as norms**?"
  If Gibbard's solution makes moral sentences denote functions over worlds that behave exactly like propositions, the Cognitivist asks: "Why call this Expressivism? You've just reinvented Cognitivism with extra steps."
  *   **Residue:** The pressure to remain **Non-Cognitivist** while solving a **Cognitivist-style** compositionality problem. In PL, you are free to change your ontology. In metaethics, the ontology (Non-Cognitivism) is the thesis being defended.

  **B. Disagreement as Clash, Not Contradiction**
  In standard semantics, disagreement is logical contradiction ($P$ vs $\neg P$).
  In Expressivism, if I say `BOO(Lying)` and you say `YAY(Lying)`, we do not have a logical contradiction (one can approve and the other disapprove without logical error).
  The FGP requires the semantics to explain how we can still be **disagreeing** in a robust sense.
  *   **PL Analogy:** Imagine two threads accessing a mutable resource. One writes `0`, one writes `1`. It's a race condition, not a type error.
  *   **The Problem:** Expressivists need to define a logic where `BOO(P)` and `YAY(P)` are incompatible, without using Boolean negation. This requires a logic of **inconsistency of attitudes**, not inconsistency of truth-values.
  *   **Why it matters:** This is not a standard PL problem. We usually assume logic tracks truth. Here, logic must track **compatibility of plans**. This requires a non-classical logic (often relevant or substructural) to model the "clash" without truth.

  ---

  ### Part 3: The Verdict

  **Is the Frege–Geach problem *just* the observation that expressivists need a compositional semantics?**

  **Yes, but with a critical caveat.**

  It is a compositionality problem, but it is a compositionality problem **under constraint**.

  In PL, if your denotations don't compose, you change the denotations. (e.g., "Oh, this effectful computation needs to be in the `IO` monad.")
  In Metaethics, the Expressivist is forbidden from changing the denotations to `Bool` (that is the rival theory, Cognitivism). They are forced to keep the denotations as `Attitude` (which are inherently non-compositional under classical logic) and *force* them to compose.

  **What you might be missing:**
  The philosophical stakes are not about whether the semantics works (mathematically); they are about whether the semantics **betrays the intuition**.
  *   If the Expressivist succeeds in making `Attitude` compose exactly like `Bool`, the Cognitivist wins by saying "See? They were truth-apt all along." (The **Collapse Objection**).
  *   If the Expressivist fails to make them compose exactly like `Bool`, the Logician wins by saying "Then your logic is invalid." (The **FG Problem**).

  So, while the *mechanism* of the problem is a type/compositionality error familiar to you, the *dialectic* is a trap. The Expressivist must walk a tightrope where the semantics is compositional enough to validate logic, but non-cognitive enough to remain Expressivist.

  **Summary for your mental model:**
  Think of it as trying to implement a `Monoid` instance for a type that is explicitly defined as *not* having an identity element, while being required to prove that it satisfies the Monoid laws for the program to compile, but if you define the identity element, you violate the spec of the type. The FGP is the compilation error; the metaethical debate is about whether fixing the error breaks the spec.
