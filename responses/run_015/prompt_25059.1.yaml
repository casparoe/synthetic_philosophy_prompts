  2.  **Deconstruct the Frege-Geach Problem (FGP) in PL Terms:**
      *   *Expressivism:* Moral sentences don't denote truth-values (Bool). They denote *actions* or *states of mind* (e.g., attitudes, plans). Let's call this type `Attitude`.
      *   *Assertion:* In root position, `assert :: Attitude -> WorldUpdate` (or just performing the act).
      *   *Embedding:* In `if P then Q`, `P` is not asserted. It's evaluated for its contribution to the truth conditions of the whole.
      *   *The Clash:* If `P` denotes `Attitude`, and `->` (implication) expects `Bool` (or `Prop`), we have a type error. `Attitude -> Attitude` isn't logical implication.
      *   *Validity:* Modus Ponens requires that the meaning of `P` in `P` and `If P then Q` is invariant. If `P` means `BOO` in root but `???` in antecedent, substitution fails, validity breaks.

  3.  **Map Solutions to PL Concepts:**
      *   *Blackburn (Quasi-Realism/Logic of Attitudes):* Trying to define a logic directly over attitudes. Like defining a custom type class `Logical` for `Attitude`. `implies :: Attitude -> Attitude -> Attitude`. The challenge is making this isomorphic to classical logic to preserve validity.
      *   *Gibbard (Norm-Expressivism/Hyperplans):* This is the closest to PL semantics.
          *   Moral judgments = planning states.
          *   Type: `Plan` or `Hyperplan` (a function from situations to choices).
          *   Truth-conditions are derived from consistency of plans.
          *   This looks like a *continuation-passing style* or *world-parameterized* semantics. A plan isn't a value; it's a function `World -> Action`.
      *   *Barker & Chrisman (Inquisitive Semantics/Type Shifting):* Using type polymorphism. Moral sentences denote something more general that *can* project to Bool or Attitude depending on context. Like a monad `M Bool` where `M` captures the expressive force.

