      *   *Gibbard:* Make sure to explain Hyperplans as functions from worlds to choices, effectively making them truth-apt in a derived sense.
      *   *Validity:* In PL, validity is type preservation or termination. In Logic, it's truth preservation. In Expressivism, it's *consistency of attitudes*. Need to highlight this distinction.

