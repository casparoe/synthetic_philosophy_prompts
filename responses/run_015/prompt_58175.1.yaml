      *   *Check:* Did I answer the "consent" question? Yes, consent transforms sacrifice into gift.
      *   *Check:* Is "Separateness of Persons" too academic? I need to explain it simply.
      *   *Check:* The Baker example. That's specifically about *instrumentalization*. I need to link that back to the main point. The Baker is being used as a resource. Mara/Lena is about unfair distribution. They are related but slightly different. I should clarify that. Actually, they are both about aggregation. Utilitarianism aggregates utility across persons. Rawls says you can't do that.

  6.  **Final Polish:**
