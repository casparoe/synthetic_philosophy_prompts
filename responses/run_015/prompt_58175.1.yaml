answer: |-
  Yes, philosophy has a name for this, and it is one of the most famous critiques in modern ethics. Your writing group is intuitively reacting to a violation of **The Separateness of Persons.**

  This concept was most famously articulated by the political philosopher **John Rawls** in *A Theory of Justice* (1971), though it echoes through the work of Robert Nozick, Derek Parfit, and others.

  Here is the breakdown of what it is, why it feels "creepy" to your readers, how it differs from simple instrumentalization, and how you can use it to carve your revisions.

  ### 1. The Core Concept: The Separateness of Persons

  Rawls argued that classical Utilitarianism (the idea that we should maximize total happiness in the world) makes a category error. It treats **society as if it were a single super-person.**

  *   **Intra-personal (Within one person):** It is rational for *me* to endure pain now (dentist drill) for pleasure later (healthy teeth). I am the same entity experiencing both. The later joy *compensates* the earlier pain.
  *   **Inter-personal (Across persons):** It is *not* rational or just to impose pain on *Mara* so that *Lena* can have pleasure. Mara does not experience Lena's joy. There is no mechanism by which Lena's happiness compensates Mara's suffering.

  When you balance the "happiness math" across different characters, you are treating your cast like a single organism. Readers revolt because they know that **compensation requires continuity of consciousness.**

  **The Philosophical Label:** *The Separateness of Persons.*
  **The Error:** *Inter-personal Aggregation of Utility.*

  ### 2. How to Carve It: Distinguishing the Nuances

  You asked how this is different from "don't use people" (Kant) and how edge cases like consent work. Here is the anatomy of the distinction.

  #### A. Vs. Kant's "Means to an End"
  Kant says: *Do not treat a person merely as a means to an end.*
  *   **The Baker Example:** Killing the baker so five others have warmer arcs is a Kantian violation. You are using his death as a tool/resource to purchase mood for others. He is instrumentalized.
  *   **The Mara/Lena Example:** This is subtler. You might not be *using* Mara to get Lena's joy. You might just be distributing fate unfairly. Even if Mara isn't "used," readers feel the injustice because the *ledger* is being balanced across the wrong boundary.
  *   **The Difference:** Kant is about **agency and respect**. Separateness of Persons is about **compensation and distribution**. You can violate Separateness without violating Kant (e.g., if fate randomly crushes Mara so Lena can thrive, no one "used" Mara, but the narrative balance feels unjust).

  #### B. The Role of Consent (The "Sacrifice" Fix)
  You asked if consent fixes it. **Yes.**
  *   **Without Consent:** If the *author* decides Mara suffers so Lena can thrive, it is **Theft**. You are stealing Mara's well-being to fund Lena's.
  *   **With Consent:** If *Mara chooses* to suffer so Lena can thrive (e.g., Mara works a dangerous job to pay for Lena's school), it becomes **Gift** or **Sacrifice**.
  *   **Why:** Consent bridges the gap between persons. By choosing it, Mara incorporates Lena's good into her own value system. The joy Lena feels becomes part of Mara's own satisfaction. The "Separateness" is voluntarily bridged by love or duty.

  #### C. Timing and Memory
  *   **Same Person:** Pain $\rightarrow$ Joy. The memory of pain enhances the joy (relief, growth, resilience).
  *   **Different People:** Pain (Person A) $\rightarrow$ Joy (Person B). Person A gets no relief. Person B feels no gratitude (unless they know).
  *   **The Edge Case:** If Lena knows Mara suffered for her, and Lena dedicates her happiness to Mara's memory, you create a **Shared Arc**. This mitigates the violation because the happiness is no longer purely Lena's; it is communally owned.

  ### 3. The Baker Problem: Utilitarian Calculus vs. Narrative Integrity

  Your editor's suggestion (kill the baker to boost five arcs) is a classic **Trolley Problem** applied to plot structure.
  *   **The Math:** 1 Sadness + 5 Happiness > 1 Neutral + 5 Neutral.
  *   **The Reader Reaction:** "Cheating."
  *   **Why:** Readers do not read for *total utility*; they read for *meaning*. A death that exists solely to generate emotional capital for survivors is **narrative inflation**. It devalues the currency of the story.
  *   **The Fix:** The Baker's death must generate meaning *for the Baker*, or be a consequence of his own agency, not just a resource for others. If he dies to save someone, that is sacrifice (consent/agency). If he dies so others can have a funny scene, that is butchery.

  ### 4. Practical Terms for Revision

  While "The Separateness of Persons" is the philosophical term, it's a mouthful for a writing group. Here are three terms you can use in your revision notes to diagnose these issues:

  #### Option 1: "The Compensation Boundary"
  Use this to check if you are trying to pay off a debt with the wrong currency.
  *   *Question:* "Am I trying to compensate Mara's suffering with Lena's joy?"
  *   *Fix:* Either give Mara her own joy, or make Mara's suffering a choice she made for Lena (bridging the boundary).

  #### Option 2: "Cross-Life Accounting"
  This frames it as a bookkeeping error, which fits your "math" description.
  *   *Question:* "Is this a balanced ledger within a life, or am I balancing ledgers across lives?"
  *   *Rule:* You can balance within a life (Arc). You cannot balance across lives (Fate) without consent.

  #### Option 3: "The Instrumentalization Check" (For the Baker)
  *   *Question:* "Does this character's suffering serve their own story, or only the other characters' stories?"
  *   *Rule:* If a character's pain only serves others, they are a prop, not a person.

  ### 5. Summary for Your Revisions

  Your readers are telling you that **narrative justice is individual, not collective.**

  1.  **Mara's Arc:** Keep the suffering if it leads to *her* growth. That is a **Redemptive Arc**.
  2.  **Mara/Lena Split:** Do not balance them against each other. If Mara suffers, she needs her own resolution, even if it's quiet. Lena's happiness cannot be the payment for Mara's pain.
  3.  **The Baker:** Do not kill him to "fund" happiness elsewhere. His death must be meaningful to *him* or chosen by *him*.

  **The Name to Use:**
  If you want the academic weight, call it **The Separateness Violation**.
  If you want a workshop term, call it **Cross-Person Compensation**.

  **The Mantra:** *You can balance a life, but you cannot balance a cast.*
