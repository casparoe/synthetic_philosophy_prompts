answer: |-
  **1. Intent Alignment: Tier S**
  Intent alignment securely anchors the technical literature by separating specification errors from normative disagreements without relying on ill-defined moral predicates.

  **2. Procedural Alignment: Tier A**
  Procedural alignment isolates the distinct engineering hurdle of mechanistic control, though it remains vulnerable to conceptual collapse if designer intent is defined to include process preferences.

  **3. Value Alignment: Tier B**
  Value alignment identifies the ultimate normative goal but fails to delineate a specific technical target independent of aggregating human preferences or intentions.

  ***

  **On the Collapse of Procedural into Intent**
  Procedural alignment stands alone as a *technical* challenge because optimizing for reasoning trajectories (mechanistic interpretability) requires different mathematical tools than optimizing for outcome rewards (loss landscapes), even if it collapses *conceptually* when "intention" is defined holistically to include process constraints. If a designer explicitly intends for a system to be auditable, failing auditability is an intent failure; however, the engineering required to enforce that auditability is orthogonal to the engineering required to ensure the outcome matches the designer's wish, validating procedural alignment as a distinct operational category.

  **On Small-Scale Systems**
  In narrow decision-support models, the distinction becomes *more* visible because architectural constraints (procedure) are often hard-coded separately from objective functions (intent), whereas in end-to-end deep learning systems, the reasoning path is latent and entangled with the output, obscuring the divergence between procedural and intent alignment until a failure occurs.
