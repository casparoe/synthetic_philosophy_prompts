      *   *Scene 1 (The Novel):* Focus on the suppression of affect. The book as a symbol of shared humanity that is rejected. Stevens as the tyrant of his own heart.
      *   *Scene 2 (The Road Trip):* Focus on the collapse of the external Master. Stevens is left alone with his labour. The realisation of complicity.
      *   *Dignity and Recognition:* Discuss how "dignity" is used to avoid the risk of recognition.
      *   *Literature's Contribution:* What does the novel add to Hegel? (The emotional cost, the ambiguity, the tragedy of the 'remainder').
      *   *Conclusion:* Summarise the argument.

