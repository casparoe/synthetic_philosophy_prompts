          *   *Douglass's Logic:* Slavery is not "service or labour due." It is forced extraction. "Due" implies a contract or debt. A slave owes nothing; they are property. Therefore, the clause linguistically excludes slaves.
          *   *Federalism Angle:* The clause is about interstate comity regarding *contracts*, not property rights in humans.
          *   *Counter-Objection:* "But everyone knew it meant slaves." *Response:* Douglass argues we must interpret the law by what it *says*, not the secret intentions of the framers. If the text doesn't say "slave," the federal government can't enforce slavery.
      *   **Addressing the Three-Fifths Clause:**
          *   *Text:* "Other Persons."
          *   *Douglass's Logic:* It doesn't say "slaves." It reduces Southern power compared to counting them as whole persons. It's a penalty, not a bonus. It discourages slavery by limiting political power derived from it.
      *   **Addressing the 1808 Clause (Slave Trade):**
          *   *Text:* Congress can prohibit after 1808.
          *   *Douglass's Logic:* It sets an expiration date. It empowers Congress to kill the trade. It doesn't mandate the trade continue; it just prevents prohibition *until* 1808. It's a temporary truce, not a permanent guarantee.
      *   **The Significance of the Word "Slave":**
          *   *Weight:* High, but not magic.
