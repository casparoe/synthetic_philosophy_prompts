      *   **Goal:** Make the case that the 1787 Constitution, read on its own terms (pre-13th/14th/15th Amendments), is best understood as an instrument tilted *against* slavery, aligning with Douglass's mature view.

  2.  **Historical & Philosophical Context:**
      *   *Douglass's Shift:* Originally aligned with Garrisonians (Constitution is a "covenant with death"). Later (around 1851, "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"), he argued it was anti-slavery.
      *   *Legal Theory:* This is a textualist/originalist argument (in a specific sense). It relies on the Preamble ("secure the Blessings of Liberty"), the absence of the word "slave," and the idea that federal power was limited while liberty was the default.
      *   *The Fugitive Slave Clause:* "No Person held to Service or Labour in one State... escaping into another... shall be delivered up on Claim of the Party to whom such Service or Labour may be due."
      *   *The Challenge:* Historically, everyone knew this meant slaves. Douglass's argument is a *moral/legal* reconstruction, not necessarily a historical sociological one. To make the "strongest version," I need to lean into the legal logic Douglass used, even if modern historians might dispute the historical intent.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the boldness of Douglass's shift. Frame it not as a change in the text, but a change in *interpretive lens* (from looking at intent of framers to looking at the text's legal force).
      *   **The Core Principle: Liberty is Default, Slavery is Local:** This is the bedrock of Douglass's argument. Slavery exists only by positive law of specific states. The Constitution is a federal document. If it doesn't explicitly sanction slavery, the federal government has no power to support it.
      *   **Addressing the Fugitive Slave Clause (The Hardest Move):**
