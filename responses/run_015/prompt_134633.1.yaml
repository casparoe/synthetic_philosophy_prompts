answer: |-
  On the fourth of March, I received a parcel containing a notebook bound in grey cloth. There was no return address, only my name written in a hand that was unmistakably my own, though I possessed no memory of having formed the letters. The text began: *At ten in the morning, the recipient opens the parcel.* It was then ten in the morning.

  The notebook detailed the entirety of that day. It described the taste of the coffee I had not yet poured, the specific ache in my left knee that would arrive at noon, and the sound of the rain at six. It was written in the past tense, yet it referred to hours that had not occurred. I read until the entry for two o'clock: *He considers burning the book, but decides instead to walk to the park.*

  I felt the familiar rebellion of the will. To prove the text erroneous, I did not walk to the park. I remained in my study and spilled ink upon the carpet. I waited for the contradiction to unravel the world. It did not. Instead, at four o'clock, a second parcel arrived.

  This second notebook was identical to the first, save for an additional preamble. It described my receipt of the first notebook, my reading of the two o'clock entry, and my decision to spill the ink. It noted that the ink stain was shaped like a archipelago.¹ It then continued to describe the rest of the day, including the arrival of a third parcel at six o'clock.

  I understood then that I was trapped in a regress of observers. The first notebook viewed my day as a landscape from a height; the second viewed the first observer as part of the landscape. Each attempt to assert my freedom—to introduce a variable not accounted for—merely necessitated a higher dimension to record the deviation. If I received a third notebook, it would describe the arrival of the second. A fourth would describe the third. There was no limit to the heights from which my life could be surveyed.

  Initially, I believed this proved the determinism of the lower levels. The man on the ground is a puppet; the man in the tower holds the strings. But as the afternoon wore on, and I awaited the third parcel which I knew would come, I began to suspect the opposite.

  To posit a higher observer is to posit a new succession. The writer of the second notebook must write *after* I spill the ink. The writer of the third must write *after* the second arrives. By seeking an explanation for my freedom in a higher dimension, I had not abolished time; I had merely extended the chain of cause and effect into the vertiginous. I was trading a single sequence for an infinite ladder of sequences.²

  If every moment requires a subsequent moment to validate it, then no moment is ever complete. The present is always waiting for the future to certify its existence. But the ink was already dry on the carpet. The stain existed without the notebook's permission.

  I looked at the first notebook. It said: *He reads the page.*
  I looked at the second. It said: *He reads the page that says he reads the page.*

  The difference is not in the event, but in the grammar. We imagine the "I" as a traveler moving along the line of text, but the "I" is merely the focal point where the stack of notebooks intersects. There is no traveler. There is only the intersection. If the regress is infinite, then the distance between the first page and the last is zero, for an infinite series of intermediaries cannot be traversed. If I cannot reach the next moment because there are infinite moments between this one and the next, then I am already there.

  The third parcel arrived at six. I did not open it. To open it would be to assume there is a difference between the opening and the arrival. I placed my hand on the grey cloth. I felt the vibration of the rain outside, which the first notebook had predicted, and the weight of the third notebook, which the second had predicted.

  These sensations did not follow one another. They pressed against my palm simultaneously. The rain, the cloth, the hand—they are not events in a line. They are facets of a single crystal. The notebooks do not record my life; they are the scaffolding I erected to avoid seeing that the building is finished. I am not the man who reads, nor the man who writes. I am the margin where the text ends.

  I put down the pen. I had not picked it up.

  ***

  ¹ *The Anatomy of the Mirror*, by Hermogenes of Cordoba, suggests that such stains are not random but topological maps of the observer's hesitation.

  ² This paradox mirrors the argument of the Gnostic Basilides, who claimed that to create the world, the Divine had to create an infinite series of heavens, thereby making creation impossible. See *Refutations of Heresy*, Book III.
