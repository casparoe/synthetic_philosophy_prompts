      *   The Object: The *Codex of Simultaneities*.
      *   The Action: Reading the notebook. Seeing future actions. Trying to change them.
      *   The Regress: A new notebook arrives explaining the attempt to change the first.
      *   The Realization: The regress doesn't solve the problem of succession; it multiplies it. The only solution is that the reading and the writing are the same event.

