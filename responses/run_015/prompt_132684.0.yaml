      *   *The Problem:* If it's all subjective, why do we argue about it? Why does Shakespeare beat up a bad poet?
      *   *The Solution:* The "True Judge" (or Ideal Critic). Someone with strong sense, united to delicate sentiment, improved by practice, compared by experience, and cleared of prejudice.
      *   *The Standard:* The joint verdict of these true judges *is* the standard. It's not objective in the physical sense (like mass or charge), but it's intersubjectively stable.
      *   *Human Nature:* Hume believes there are universal principles of human nature. We all have similar cognitive/emotional machinery.

  3.  **Analyze the "Neuroadaptive Art" Scenario:**
