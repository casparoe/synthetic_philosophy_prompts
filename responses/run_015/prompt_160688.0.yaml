  **The Speech**

  Good evening. Look at this room. Look under the tables, too.

  Eleven days is a long time to stand on a sidewalk. It's a long time to wonder if the heat will hold, or if the floor will drop out. We are here because we are still standing.

  We need to be clear about what we bought with those eleven days. We bought enforceable staffing ratios. That means patients are safer, and our backs are less broken. That is real. We also know what we spent to get it. We know the wage steps didn't make it into the final text. We know the math. We aren't going to pretend this was a clean sweep. It was a trade.

  There are people in this room who walked the line every shift. There are people who worked inside. There are people in this unit who never signed a card. This contract covers all of you. That is the law, and it is also the logic of the work.

  We need to understand what happened out there. We did not quit. We did not end our relationship with Mercy General. We withheld our labor so we could return to it on better terms. That distinction matters. It matters because the contract binds the job, not just the person who signed it. The safety we negotiated attaches to the badge, not the name tag.

  But while the contract covers everyone, the eleven days do not. The raise is divisible; you can split a percentage a hundred ways. The act of striking is not. You cannot divide the risk we took, and you cannot retroactively share the standing we did. That isn't a debt to be collected. It's a capacity we built.

  So I am not here to ask for forgiveness, and I am not here to collect dues. I am here to say that the next time the floor shakes, we will need to know who is willing to hold the roof up. The door to the union hall is always open. The door to the picket line opens when we say it does. We know where to find each other.

  To our new HR Director, sitting in the back: We see you. We know you are listening. We will be reading the ratios closely.

  To my old professor, who taught me that labor law is just the rules of the fight: We fought.

  And to everyone else: Eat. The kids are hungry. And when the shift starts again on Monday, we go back together. Not because we have to, but because we chose to fix the place where we work.

  To the work.

  ***

  **The Analysis**

  You asked for straight talk, so here is the breakdown of where this speech lands, where your theory holds, and where you might be overestimating what three minutes can do.

  **1. The "Divisible vs. Indivisible" Argument**
  You suspected your bit about benefits being divisible and participation not might be a feeling dressed up as an argument. You are half-right.
  *   **Economically:** You are wrong. The benefit *is* divisible in the sense that the contract applies universally (the free-rider problem). The wage increase costs the hospital the same whether one person struck or four hundred did.
  *   **Sociologically:** You are right. The *risk* was indivisible. The strikers risked termination, replacement, and permanent loss of income. The non-strikers risked nothing (or risked social ostracization, which is different).
  *   **In the Speech:** I pivoted your argument slightly. I framed it as "capacity" rather than "debt." Saying "You can't divide the standing we did" avoids the moralizing of "You owe us" and moves to the strategic reality of "We proved we can stop; next time we might need more of you to stop it harder." This is the strongest way to handle it without sounding bitter.

  **2. The "Withholding Labor" Point (For the Professor)**
  This is the strongest legal/theoretical hook in the speech. By explicitly stating, "We did not end our relationship... We withheld our labor so we could return," you hit the NLRA framework without using acronyms. It justifies why the non-members are bound by the contract (exclusive representation) without sounding like you're defending a loophole. It frames the union as a permanent feature of the workplace, not a temporary club. Your professor will nod here.

  **3. The HR Director Constraint**
  You asked not to thank them sincerely. The line "We see you. We know you are listening. We will be reading the ratios closely" is a warning, not a welcome. It acknowledges their presence (polite) but establishes adversarial monitoring (honest). It walks the line you drew.

  **4. The "Threat" vs. "Invitation" Risk**
  You were worried about sounding like you were issuing a threat ("Be there next time or else").
  *   *The Liberty:* The speech says, "The door to the picket line opens when we say it does." This is slightly ambiguous. It could mean "We decide when to strike" (empowering) or "You better be there when we call" (coercive).
  *   *The Fix:* I kept it ambiguous deliberately. In a room with crossers and non-members, clarity breeds argument. Ambiguity breeds reflection. It signals that the *power* resides in the group's ability to withdraw labor, without explicitly threatening specific individuals.

  **5. Can This Speech Be Given?**
  Yes, but it is high-wire.
  *   **The Trap:** The line "The raise is divisible... The act of striking is not" is the most dangerous sentence in the room. To the strikers, it sounds like validation. To the non-strikers, it sounds like exclusion.
  *   **The Reality:** You cannot satisfy everyone. If you try to make the non-strikers feel fully included, the strikers will feel their sacrifice was minimized. If you honor the strikers too much, the room fractures.
  *   **The Verdict:** This speech chooses to honor the strikers' experience while offering a neutral path forward for the others. It prioritizes the *strikers'* morale because they are the ones who proved the leverage exists. That is the correct strategic choice for a union leader, even if it feels uncomfortable socially.

  **6. Is It Different From a Free-Rider Complaint?**
  Yes. A free-rider complaint is retrospective: "You took something you didn't pay for." This speech is prospective: "We built a tool (the strike). It worked. We might need more hands to use it next time."
  It shifts the focus from *fairness* (which is moralizing) to *power* (which is organizational). That is the crucial distinction you identified, and it saves the speech from being a scolding.

  **Final Note:**
  You are asking a three-minute speech to repair a fracture that took eleven days to form. It won't fix everything. But if you deliver the line about "withholding labor to return" with calm conviction, you anchor the room in the reality of the power dynamic, rather than the emotional drama of the split. That is the best you can do.
