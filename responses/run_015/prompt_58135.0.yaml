answer: |-
  **Practice Essay Question**

  **Module:** Metaphysics (Year 2)
  **Topic:** Material Constitution
  **Time Allowed:** 45 Minutes

  **Question:**

  A college art club sculpts a life-size horse from a single batch of clay. Over ten years, weather-damaged fragments are replaced bit by bit until none of the original clay remains in the horse. All removed fragments are kept in a jar and later compressed into a plain block.

  Critically discuss this case by addressing the following:
  1.  Explain the Leibniz Law argument from survival under squashing as it applies to the original statue and lump.
  2.  Evaluate the monist reply that modal and persistence claims are sensitive to the sortal under which the object is considered.
  3.  Determine which claimant (the horse-shaped thing or the jar-assembled block) is best identified with the original statue and the original lump on both pluralist and monist views.

  ***

  **Model Answer**

  The case presents a hybrid of the Statue/Lump puzzle and the Ship of Theseus. To analyse it, we must first apply the Leibniz Law argument. This argument posits that if object *A* is identical to object *B*, they must share all properties. At the moment of creation, the original lump of clay could survive being squashed into a ball, whereas the original statue could not, as squashing destroys its form. Since they possess different modal properties regarding survival under squashing, Leibniz's Law dictates they cannot be identical. In this scenario, the jar-assembled block demonstrates the lump's capacity to survive deformation, while the horse-shaped thing demonstrates the statue's dependence on form.

  Pluralists accept this conclusion, arguing for coincident objects: the statue and the lump are distinct entities occupying the same space at the start. Consequently, regarding identification, the pluralist identifies the original statue with the horse-shaped thing, prioritising formal and functional continuity despite material replacement. Conversely, the original lump is identified with the jar-assembled block, prioritising material continuity. Thus, two distinct objects exist: the statue survives in the horse, and the lump survives in the block.

  Monists, however, deny distinct coincident objects. They argue that there is only one object here, described differently. To counter the Leibniz Law argument, monists (such as Lynne Baker) propose that modal and persistence claims are sortal-sensitive. The claim 'it could survive squashing' is incomplete; it must be 'it, *qua* lump, could survive squashing' versus 'it, *qua* statue, could not'. There is no contradiction because the properties are relative to the sortal concept applied, not the object itself.

  Regarding identification, the monist faces a dilemma due to the material replacement. If they prioritise the dominant sortal (Statue), the original statue and lump are identical to the horse-shaped thing, as it maintains spatio-temporal continuity. The block is merely a new object composed of discarded parts. If they prioritise matter, the block is the original object. However, most constitution monists favour the dominant sortal. Therefore, on the monist view, the horse-shaped thing is both the original statue and the original lump, while the block is a new entity. The pluralist sees two survivors; the monist sees one survivor and a collection of parts.

  ***

  **Marking Scheme (Total: 20 Marks)**

  **1. Leibniz Law Argument (5 Marks)**
  *   **5:** Clearly states the principle (indiscernibility of identicals) and applies it to the modal difference (squashing) between the original statue and lump using the case details.
  *   **3-4:** States the principle and general argument but lacks specific application to the horse/block case.
  *   **1-2:** Vague definition of Leibniz Law or fails to connect it to modal properties.

  **2. Monist Reply (Sortal Sensitivity) (5 Marks)**
  *   **5:** Accurately explains sortal relativism (properties held *qua* sortal) and how it blocks the Leibniz Law contradiction.
  *   **3-4:** Mentions sortals but fails to explain how this resolves the modal conflict logically.
  *   **1-2:** Confuses monism with eliminativism or fails to address the modal argument.

  **3. Identification of Claimants (5 Marks)**
  *   **5:** Correctly distinguishes the Pluralist view (Horse=Statue, Block=Lump) from the Monist view (Horse=Both, Block=New) and justifies based on continuity (form vs. matter).
  *   **3-4:** Identifies the claimants correctly but fails to justify *why* each view favours that identification.
  *   **1-2:** Incorrectly maps the objects (e.g., claiming Monists say Block=Statue).

  **4. Structure and Clarity (5 Marks)**
  *   **5:** Concise, logical flow, British English spelling/conventions.
  *   **3-4:** Understandable but slightly disorganised or minor language errors.
  *   **1-2:** Difficult to follow or significant language issues.

  **Differentiation: First-Class (70%+) vs. Upper Second-Class (60-69%)**

  *   **Upper Second-Class (12-13 marks):** The candidate will correctly explain the Leibniz Law argument and the Monist reply. They will identify the claimants correctly (Horse vs. Block). However, they may treat the Monist identification as straightforward without acknowledging the tension caused by the material replacement (Ship of Theseus element). They might state the Monist view without explicitly noting *why* the block is relegated to a 'new object' (lack of spatio-temporal continuity).
  *   **First-Class (14+ marks):** The candidate will do all the above but will explicitly analyse the tension between material continuity and spatio-temporal continuity within the Monist reply. They will clearly articulate that for the Monist, the block is not the original lump because the *object* travels with the form continuity, whereas for the Pluralist, the *matter* travels with the block. They will use precise terminology (e.g., '*qua* sortal', 'modal properties', 'spatio-temporal continuity') and integrate the case study seamlessly rather than treating it as an addendum.
