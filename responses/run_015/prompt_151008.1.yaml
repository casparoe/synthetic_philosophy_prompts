      *   The core claim: Sensory-discriminative (location, intensity) $\neq$ Affective-motivational (unpleasantness, badness).
      *   The "circularity" complaint against essentialists is common: "They say the feeling *is* the hurting, so if it doesn't hurt, it wasn't pain."

  3.  **Brainstorming Counter-Arguments (The "Exposure Map"):**

      *   *Phenomenological Unity:* Does pain *feel* like two things stuck together, or one unified thing? If I burn my finger, do I feel "heat + badness" or "burning-hurt"?
      *   *The "Bare Sensation" Problem:* If you strip the badness away, is it still pain? Or is it just touch/pressure/heat? Asymbolics often describe it as "I feel something happening, but I don't care." Is that pain?
      *   *Motivational Internalism:* Pain *necessarily* motivates avoidance. If the tagging view is right, motivation is contingent on the tag. But if the tag fails, why call it pain?
      *   *Inversion Coherence:* Can pain actually be *pleasant*? (Masochism, runner's high, childbirth). If badness is just a tag, why is "pleasant pain" a paradox linguistically and phenomenologically?
      *   *Neural Dissociation:* Is the separation clean in the brain? (ACC vs. S1). It's messy. Overlap suggests integration, not just binding.
      *   *The "Masking" vs. "Removing" Distinction:* Does asymbolia remove the badness or just the *reaction* to the badness?

  4.  **Structuring the Response:**
