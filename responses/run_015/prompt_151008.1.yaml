      *   *Threat 2: The Definition of Pain.* If asymbolics don't suffer, do they have pain? If yes, "pain" loses its link to suffering. If no, the case study fails. *Refinement:* This is the semantic trap.
      *   *Threat 3: Pleasant Pain.* If pain can be pleasant, does "pain" refer to the sensation or the valence? If I say "I love this pain," am I contradicting myself? *Refinement:* The "Oxymoron Test."
