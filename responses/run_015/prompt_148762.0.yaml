  9.  **Finalizing the Structure:**
      1.  The Negative Utility Monster (Framing).
      2.  The Stayers: Aggregation and Rationalization (The Utilitarian Defense).
      3.  The Child: Incommensurability and S-Risk (The Qualitative Breach).
      4.  The Walkers: Rejecting the Utility Function (The Decision Theoretic Break).
      5.  Conclusion: What Formalism Misses.

