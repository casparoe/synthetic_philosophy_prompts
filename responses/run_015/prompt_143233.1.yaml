  ### Teaching Note: The Fragility of Local Stability

  **The Rule**
  **Borda Count with Lexicographic Tie-Break:** Each voter awards 2 points to their 1st choice, 1 to their 2nd, and 0 to their 3rd; the candidate with the highest total score wins, with ties broken alphabetically (A > B > C).

  **The Setup**
  *   **Voters:** 5 (Maya, Sam, and three "Others": Oz1, Oz2, Oz3).
  *   **Candidates:** A, B, C.
  *   **Sincere Profile ($P$):**

  | Voter | 1st (2 pts) | 2nd (1 pt) | 3rd (0 pts) |
  | :--- | :--- | :--- | :--- |
  | **Maya** | B | A | C |
  | **Sam** | B | A | C |
  | **Oz1, Oz2, Oz3** | A | B | C |

  **Sincere Outcome at $P$**
  *   **Scores:** A = $1+1 + (2\times3) = \mathbf{8}$. B = $2+2 + (1\times3) = \mathbf{7}$. C = $0$.
  *   **Winner:** **A**.
  *   **Note:** A is also the Condorcet winner (beats B 3-2, beats C 5-0).

  ---

  ### Verification Table

  | Scenario | Maya's Ballot | Sam's Ballot | Scores (A, B, C) | Winner | Maya & Sam Payoff |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Sincere ($P$)** | B > A > C | B > A > C | **8, 7, 0** | **A** | Baseline (2nd Choice) |
  | **Maya Deviates Alone** | **B > C > A** | B > A > C | **7, 7, 1** | **A** (Tie-break) | **No Gain** (Status Quo) |
  | **Sam Deviates Alone** | B > A > C | **B > C > A** | **7, 7, 1** | **A** (Tie-break) | **No Gain** (Status Quo) |
  | **Joint Deviation** | **B > C > A** | **B > C > A** | **6, 7, 2** | **B** | **Strict Gain** (1st Choice) |
  | **Sequential (Maya then Sam)** | **B > C > A** | B > A > C | **7, 7, 1** | **A** | Sam sees: If I join $\to$ **B**. |

  **Why Solo Deviation Fails:** Maya's deviation (burying A) reduces A's score by 1 and raises C's by 1. This creates a 7-7 tie between A and B. The rule's tie-break (A > B) protects A. Maya cannot single-handedly overcome the tie-break.
  **Why Joint Deviation Succeeds:** Together, they reduce A's score by 2 (from 8 to 6). This breaks the tie decisively in favor of B (7 points).
  **Contagion:** Once Maya has deviated, the score is 7-7. Sam is now *pivotal*: his deviation breaks the tie in favor of B. His move becomes profitable *because* Maya moved first.

  ---

  ### Structural Feature Doing the Work
  **The Tie-Break as a Shield.**
  The rule's deterministic tie-break creates a "local plateau" of stability. At profile $P$, the margin between A and B is exactly 1 point. A single voter's manipulation can only shift the margin by 1 point (in 3-candidate Borda), which is sufficient to create a tie but insufficient to overcome the lexicographic tie-break. Coordination allows the pair to shift the margin by 2 points, shattering the shield.

  **What happens if you remove that feature?**
  *   **Remove Tie-Break (Random Lottery):** If ties are broken by coin flip, Maya's solo deviation creates a 50% chance of B winning. If Maya is risk-neutral, she *might* manipulate alone. The "coordination" requirement weakens.
  *   **Swap Rule for Plurality:** In Plurality, Maya and Sam are already voting for their top choice (B). They cannot manipulate to help B; they can only try to hurt A. But hurting A (by voting C) would likely elect C, whom they hate. The "burying" strategy unique to scoring rules like Borda is required here.
  *   **Make Sincere Winner Non-Condorcet:** If A were not the Condorcet winner (e.g., if one Oz preferred B > A > C), B would likely win outright, removing the need for manipulation. The fact that A is the Condorcet winner highlights that Borda + Coalition can override the "will of the majority" (3 out of 5 prefer A to B).

  ---

  ### The Honest Bit: Gibbard–Satterthwaite's Reply

  A defender of the theorem would say: *"You have shown that $P$ is a Nash Equilibrium in truthful reporting. But GS guarantees that for any non-dictatorial rule, there exists **some** profile where truth-telling is not a Nash Equilibrium."*

  **Where is the GS vulnerability nearest to $P$?**
  The vulnerability lies exactly **one ballot change away**.
  If we change **Oz1's** sincere preference from `A > B > C` to `A > C > B`:
  *   New Sincere Scores: A = 8, B = **6** (Oz1 no longer gives B a point), C = 1.
  *   Margin: A leads B by 2 points.
  *   *Wait, that makes it harder.*

  Let's find the profile where solo manipulation *works*. We need a sincere tie (A=7, B=7).
  Change **Oz1's** sincere preference from `A > B > C` to `C > A > B`.
  *   New Sincere Scores: A = 7, B = 6, C = 2. (A wins).
  *   Maya Solo Dev (`B > C > A`): A = 6, B = 6, C = 3. (Tie A/B $\to$ A). Still fails.

  To make solo manipulation work, we need the sincere margin to be **0** (Tie).
  Change **Oz1** to `B > A > C`.
  *   New Sincere Scores: A = 7, B = **8**. (B wins outright).
  *   Here, no manipulation is needed.

  **The Nearest GS Profile:**
  The theorem guarantees a profile where a voter *can* profit. In Borda, this typically occurs when the margin is 1 point *and* the tie-break favors the *manipulator's* preferred candidate, or when the margin is 0.
  The profile $P$ is **1 point of Borda score** away from a profile where Maya manipulates successfully. In terms of ballots, this is **1 voter** changing their ranking of A vs B (e.g., if Oz1 were `B > A > C`, B wins; if Oz1 were `A > B > C`, A wins).
  Because the margin is so thin (1 point), the "distance" to a manipulable profile is minimal.

  **Does this make GS more or less alarming?**
  *   **More Alarming:** It shows that "safety" at $P$ is an illusion of the tie-break. The system is so sensitive that a single voter's preference change (Oz1) turns a "stable" profile into one where the winner flips, or where manipulation becomes viable. The phone-call coalition doesn't need to find a distant loophole; they are exploiting a margin that is inherently unstable.
  *   **Less Alarming:** It clarifies that GS is an *existence* theorem. It does not claim *every* profile is manipulable. At $P$, the system *is* locally strategy-proof for individuals. If your institution operates at profiles like $P$ (strong consensus on A, minority for B), individual lying is futile. You only need to worry if you expect coordinated factions.

  **Conclusion for Students:** Gibbard–Satterthwaite tells you the minefield exists. This example shows you that sometimes you can walk across it safely alone, but holding hands with a friend might trigger the blast. The theorem warns of the minefield; this example warns of the coalition.
