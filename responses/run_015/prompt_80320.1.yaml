  6.  **Polishing the Tone:**
      *   Needs to sound like an informed audience member, not a hostile interrogator, but firm.
      *   Ensure the "baseline problem" is the through-line.
      *   Make sure the follow-ups are sharp and cut off the escape route.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I avoid the "autonomy" objection?
