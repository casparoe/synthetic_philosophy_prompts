answer: |-
  # Q&A PREP SHEET: TWO-ZONE VIEW & IDENTITY FRAGILITY

  ## 1. UPFRONT CONCESSIONS (First 5 Minutes)
  *Say these before opening the floor. This buys goodwill from the specialists and prevents them from spending their question time on points you already grant.*

  *   **To the Axiologists:** "I concede that the 'Fragility Discount' is currently a placeholder for a variable critical-level function. I am not claiming it is a simple temporal discount rate; it is a moral weight adjustment based on counterfactual dependence. I need your help formalizing it."
  *   **To the Person-Affecting Theorist:** "I concede that the boundary between the Near and Far Zones is vague. I am treating 'Identity Half-Life' as a threshold for a binary switch for pragmatic reasons, but I agree a sorites problem exists there."
  *   **To the Longtermists:** "I concede that if the Fragility Discount is too steep, it risks undermining the expected-value calculus for existential risk mitigation. My view requires the discount to be shallow enough that Far Zone value still dominates Near Zone costs."

  ---

  ## 2. THE TEN OBJECTIONS (Ordered by Likelihood & Damage)

  **1. The Temporal Parity Objection (Longtermist Cause-Prioritizers)**
  *   **Objection:** "Longtermism relies on Temporal Parity—that location in time doesn't matter morally. Your Two-Zone View explicitly violates this by discounting the Far Zone. Doesn't this collapse the argument for prioritizing x-risk over near-term global health?"
  *   **Steelman?** Yes. High damage.
  *   **Reply (2 mins):** "I'm not discounting based on *time*, but based on *identity stability*. Temporal Parity assumes the *same* people exist across options. Fragility shows they don't. If we care about 'benefiting people,' that concept dissolves in the Far Zone. We switch to 'creating value' instead. The EV of x-risk remains dominant because the *volume* of future lives outweighs the discount, but the *structure* of the calculation changes from 'harm prevention' to 'value creation'."
  *   **Soft Spot:** Relies on the claim that volume outweighs the discount. If the discount is >50%, EV flips.

  **2. The "Ad Hoc Axiology" Objection (Population Axiologists)**
  *   **Objection:** "You're using Person-Affecting views in Zone 1 and Critical-Level Totalism in Zone 2. What justifies switching fundamental moral axioms based on an empirical variable like identity half-life? That looks like theory-shopping to avoid counterintuitive results in both zones."
  *   **Steelman?** Yes. High damage.
  *   **Reply (2 mins):** "It's not switching axioms; it's recognizing that 'harm' and 'creation' are different moral categories. Person-Affecting constraints track *harm to identifiable subjects*. When subjects aren't identifiable (Zone 2), 'harm' is category-error. We default to the best theory of *creation* (Critical-Level). The switch is triggered by the metaphysics of the subjects, not convenience."
  *   **Soft Spot:** Requires a unified meta-ethical story for why 'harm' and 'creation' are governed by different norms.

  **3. The Boundary Sorites (Person-Affecting Theorist)**
  *   **Objection:** "If identity half-life is a continuum, your binary zone switch is arbitrary. Why is 51% dependence 'Far Zone' and 49% 'Near Zone'? A policy shifting the boundary by one year changes the moral axiology entirely. That's unacceptable instability."
  *   **Steelman?** Yes. Medium damage (technical).
  *   **Reply (2 mins):** "Agreed, a hard threshold is a simplification. The committed specification is a *smooth transition function*. As identity dependence drops, the weight of the Person-Affecting constraint fades while the Impersonal value weight rises. The 'Two-Zone' language is for heuristic clarity, but the math should be continuous."
  *   **Soft Spot:** You haven't presented the continuous math yet. This is a promise to do work later.

  **4. The X-Risk Deprioritization Worry (Longtermist Researchers)**
  *   **Objection:** "If future people are 'fragile' and their welfare is discounted, does this imply we should spend less on AI safety than on malaria nets? The people saved by malaria nets are identified; the people saved by AI safety are not."
  *   **Steelman?** Yes. Critical damage to audience mission.
  *   **Reply (2 mins):** "No, because the *stakes* in the Far Zone are astronomical. Even a heavily discounted infinite series outweighs a finite near-term sum. However, it does imply the *reason* we save them changes: not because we owe it to *them* (they don't exist yet), but because a universe with them is better than one without. It shifts the justification from rights-based to value-based."
  *   **Soft Spot:** Requires the audience to accept impersonal value as a sufficient motivator for EA work.

  **5. The Repugnant Conclusion (Population Axiologists)**
  *   **Objection:** "You default to Critical-Level Totalism in the Far Zone. Does your Fragility Discount actually solve the Repugnant Conclusion, or does it just hide it? If we create enough fragile people, do we still get the Repugnant Conclusion?"
  *   **Steelman?** Yes. Medium damage.
  *   **Reply (2 mins):** "The Fragility Discount acts as a variable critical level. As lives become more 'fragile' (highly counterfactual), the critical level required for their creation to be positive rises. This blocks the Repugnant Conclusion because adding masses of barely-positive fragile lives won't clear the higher critical bar."
  *   **Soft Spot:** Needs formal proof that the discount function rises fast enough to block Repugnance.

  **6. The Empirical Fragility Claim (Grad Students / Researchers)**
  *   **Objection:** "You claim identity half-life is 'a few decades.' But isn't it possible that some structural factors (culture, institutions) persist even if individuals change? Why does biological identity matter more than cultural continuity?"
  *   **Steelman?** No (Confusion wearing a costume).
  *   **Reply (2 mins):** "Person-Affecting views are grounded in *welfare subjects*, not cultural units. Culture doesn't feel pain or pleasure; people do. If the specific people experiencing the welfare are different counterfactually, the 'harm' relation breaks. Cultural continuity is valuable, but it's an impersonal value, pushing those cases into the Far Zone logic."
  *   **Soft Spot:** Dismisses communitarian intuitions that some EAs might hold.

  **7. Moral Schizophrenia (Person-Affecting Theorist)**
  *   **Objection:** "You're asking us to treat our grandchildren as persons with rights (Near Zone) but their grandchildren as value-bearers without rights (Far Zone). How do I love my family while accepting a theory that morally demotes their descendants?"
  *   **Steelman?** Yes. Medium damage (psychological/practical).
  *   **Reply (2 mins):** "You don't demote *them*; you recognize the moral relation changes. You have special obligations to identifiable kin (Near Zone). You have general obligations to promote the good for distant kin (Far Zone). This matches our existing intuitions: we owe our children more than we owe strangers who might exist in 200 years."
  *   **Soft Spot:** Risks sounding like special pleading for family vs. humanity.

  **8. Calculation Intractability (Longtermist Researchers)**
  *   **Objection:** "If we have to calculate identity dependence for every policy to know which axiology to use, doesn't this make cause prioritization impossible? We can't run EV models if the axiology shifts per intervention."
  *   **Steelman?** No (Practical worry).
  *   **Reply (2 mins):** "We can use heuristics. Near-term direct interventions (cash transfers, vaccines) are Near Zone. Structural existential risk mitigation (AI safety, biosecurity) is Far Zone. We don't need micro-calculations for every dollar; we need category-level assignments."
  *   **Soft Spot:** Heuristics might misclassify "flow-through" effects of near-term interventions.

  **9. Why Not Totalism Everywhere? (Axiologists / Grad Students)**
  *   **Objection:** "Totalism handles non-identity fine. Why complicate things with a Two-Zone view? Just accept Totalism and admit person-affecting intuitions are biases."
  *   **Steelman?** Yes. Medium damage (Simplicity argument).
  *   **Reply (2 mins):** "Because Totalism violates the 'Asymmetry' intuition too aggressively (obligation to create happy people). The Two-Zone View preserves the Asymmetry in the Near Zone (no obligation to create) while allowing value maximization in the Far Zone. It saves the phenomena better than pure Totalism."
  *   **Soft Spot:** Assumes the Asymmetry is worth saving. Hard Totalists will deny this.

  **10. The "Happy Non-Identity" Case (Grad Students)**
  *   **Objection:** "If I choose a policy that creates different, happy people instead of existing unhappy people, isn't that good? Your view seems to say we can't compare them."
  *   **Steelman?** No (Basic confusion).
  *   **Reply (2 mins):** "In the Near Zone, we can't say the new people are 'better off' than the old ones (they don't exist). But in the Far Zone, we *can* say the outcome is better impersonally. My view tells you exactly when you can make that comparison: wait until the Identity Half-Life passes."
  *   **Soft Spot:** Doesn't address the intuition that we *should* be able to compare them immediately.

  ---

  ## 3. THE ONE REPLY THAT MUST LAND
  *   **The Point:** The justification for the **Two-Zone Switch**.
  *   **Why:** If this fails, the view is just "Totalism with extra steps" or "Person-Affecting with a loophole."
  *   **The Reply:** "The Person-Affecting Restriction isn't a universal moral law; it's a constraint on *harm*. You cannot harm someone who doesn't exist. In the Near Zone, specific people exist across options, so harm is possible. In the Far Zone, no specific people exist across options, so 'harm' is metaphysically impossible. We aren't switching morals; we're switching from a morality of *harm-avoidance* to a morality of *value-creation* because the subjects required for the former are absent."
  *   **How to Tell It Landed:** Watch the Person-Affecting Theorist. If they nod or stop taking notes, you've shifted the frame from "arbitrary switch" to "metaphysical necessity." If they look angry, they think you're defining harm too narrowly.

  ---

  ## 4. THE QUESTION I HOPE NOBODY ASKS
  *   **The Question:** "If the Fragility Discount makes creating future lives morally 'thinner' than helping existing lives, does this imply that once we've secured basic existential safety, we should stop prioritizing the future entirely and maximize near-term welfare instead? Does your view collapse into long-term short-termism?"
  *   **Honest Answer:** "Yes, potentially. If the discount factor is high enough, the marginal value of adding more fragile future lives drops below the marginal value of helping identified near-term people. My view *does* imply that longtermism is only dominant if the future is vast enough to overcome the fragility discount. If the future is finite or the discount is steep, near-term altruism wins."
  *   **Viability Assessment:** **Dangerous.** This admits the view might undermine the core EA longtermist thesis.
  *   **Defense:** "But given the astronomical scale of the potential future (trillions of trillions), even a steep discount leaves the Far Zone dominant. The view saves longtermism from the *non-identity problem*, even if it reduces the *magnitude* of the obligation."

  ---

  ## 5. THE OBJECTION I WON'T GET (BUT SHOULD WORRY ABOUT)
  *   **The Objection:** **The "Continuum Collapse."**
  *   **Why it breaks the argument:** You claim identity half-life is "a few decades." But biological causation is chaotic. Small differences cascade immediately. It is likely that *any* policy change shifts identity within *one* generation (or less). If the Identity Half-Life is actually < 30 years, your "Near Zone" is vanishingly small (essentially just the present moment).
  *   **The Damage:** If the Near Zone is empty, your concession to the Person-Affecting Theorist is void. You are effectively a Totalist with a discount factor. You lose the "Two-Zone" nuance that makes your view palatable to the PA theorist, and you're left defending a discount factor that looks like pure age-discrimination.
  *   **Preparation:** Be ready to defend the empirical claim that identity stability persists for ~60 years (2 generations). Cite the "butterfly effect" limits in human reproduction (ovulation cycles, etc.). If pressed, concede the Near Zone is smaller than hoped but insist it's non-zero (e.g., existing people).
