      *   *Best Candidate:* A hybrid. Let's call it **The Principle of Fiduciary Non-Collusion.** Parents act as fiduciaries for the child's future agency, prohibited from colluding with external injustices or internalizing parental convenience as child welfare.
      *   *Forced Overturns:* To make this coherent, the user might have to give up the *Height* verdict (if it's purely positional) or admit the *Education* verdict is inconsistent. I need to be honest here. The Education vs. Height distinction is the weakest link.
      *   *New Cases:*
