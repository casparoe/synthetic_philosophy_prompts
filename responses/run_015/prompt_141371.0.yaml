      *   *Candidate 3: The "Threshold + Motive" Principle.* Distinguishes therapy vs. enhancement, and child-centered vs. parent-centered.
      *   *The Synthesis (Best Candidate):* **The Fiduciary Agency Principle.**
          *   Clause 1: Prevent severe harm/pathology (Lethal, Deaf->Hearing).
          *   Clause 2: Enhance general capacity, not specific social outcomes (Height OK, Education Balk justified by complexity/correlation with autonomy?). *Wait, I need to explain the Education/Height split.* Maybe Education is more "core self" than height? Or maybe the user *must* overturn one. I will suggest the Education balk is actually about *reductionism* of human worth, whereas height is physical.
          *   Clause 3: No collusion with prejudice (Prejudice case).
