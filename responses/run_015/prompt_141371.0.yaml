          *   Fails: Height (reinforces heightism?), Education (reinforces class stratification?).
      *   *Candidate 3: The "Threshold of Normal Functioning" + "Parental Motive" Principle.*
          *   Focus: Restore species-typical functioning vs. Enhancement + Motive must be child-centered, not parent-centered.
          *   Fixes: Lethal/Deaf->Hearing (restoring function). Contentment (parent-centered ease). Saviour Sibling (mixed motive, allowed if child-centered love exists).
          *   Fails: Height (Enhancement allowed?). Education (Enhancement banned?).

  5.  **Synthesize a "Best Candidate":**
      *   The user's intuitions lean heavily towards a distinction between *health/functioning* vs. *social advantage/ease*, and *child's good* vs. *parent's convenience/social conformity*.
      *   There is a strong thread of *not colluding with injustice* (Prejudice case, Deafness case) vs. *allowing parental discretion on positional goods* (Height).
      *   There is a tension on *Education* vs. *Height*. Why is one okay and the other not? Perhaps because Education is more tied to "self" or "merit" or has higher stakes for inequality? Or perhaps the user *should* overturn the Height verdict?
      *   *Key Insight:* The "Non-Identity Problem" (Colleague's point) is a metaphysical trap. In clinical ethics, we must act *as if* the future child has interests, even if philosophically contested. We need a "Practical Moral Framework" rather than a metaphysical one.
      *   *Proposed Principle:* **The Principle of Non-Collusion and Future Agency.**
          1.  *Health/Functioning:* Permissible to prevent severe pathology (Lethal, Deaf->Hearing).
