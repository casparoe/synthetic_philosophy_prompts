      *   *Critique of User's Draft:* It's good but fails on Saviour Sibling (instrumentalization) and Prejudice (options vs. justice).
      *   *Candidate 1: The Open Future Principle.* Good for Deaf/Education. Bad for Height (positional) and Saviour Sibling.
