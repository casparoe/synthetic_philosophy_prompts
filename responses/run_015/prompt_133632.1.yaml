  **MEMORANDUM**

  **TO:** Heritage Commission Board
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Mill Founder Plaque

  **Purpose**
  This memo outlines a recommendation for the disposition of the bronze plaque honoring the mill founder in Central Park. With a decision required this Thursday, I propose a middle path that addresses both the concern for community values and the duty to preserve historical record.

  **Context and Considerations**
  The board is currently divided between two positions:
  1.  **Immediate Removal:** This side argues that honoring a figure associated with a brutal labor camp causes harm to the community and validates unethical history.
  2.  **Preservation:** This side argues that removing the plaque erases history. We have a duty to remember the ugly parts of our town's past, not just the celebrated ones.

  I believe the preservation argument is valid. Hiding physical evidence of our history risks making us forget the realities of the 1920s. However, continuing to maintain and polish the plaque implies an ongoing honor that many residents find unacceptable.

  **Recommendation: Cessation of Maintenance**
  I recommend the Commission vote to cease all maintenance on the plaque immediately. We should neither remove it nor preserve it. Instead, we allow natural weathering to take its course over a five-year period.

  This approach withdraws the town's official honor without destroying the historical artifact. It acknowledges the history exists but allows the tribute to fade naturally, reflecting a shift in community values without an act of erasure.

  **Implementation Plan & Timeline**

  *   **Immediate Action (Week 1):** Stop all cleaning, polishing, and protective coating of the plaque. Document the current legibility of the text with high-resolution photographs for the town archives.
  *   **Annual Review (Years 1–4):** Commission staff will photograph the plaque annually to track the progression of weathering. No repairs will be made if vandalism or accelerated damage occurs, though safety hazards (e.g., loose mounting) will still be addressed.
  *   **Final Review (Year 5):** The Commission will reconvene to assess the plaque's condition. By this time, natural patina and weathering should have significantly reduced legibility. At that point, we can decide whether to remove the now-illegible metal or leave it as a purely abstract historical marker.

  **Bottom Line**
  We should vote to stop maintaining the plaque effective immediately. This allows us to respect the history without continuing to celebrate the man. It is a solution that lets time, rather than a committee vote, decide the final state of the memorial.

  I move we adopt this plan at Thursday's meeting.
