      *   *Nuance:* Make sure to mention that Borges *did* write about eternity, but his eternity is often static, whereas Phil's is active.
      *   *Specific Borges Reference:* *A New Refutation of Time* is the key text here (the denial of succession). *The Garden of Forking Paths* adds the idea of diverging futures, which the movie actually *prevents* (Phil can try different things, but the day resets, it doesn't branch).

  5.  **Final Polish:**
