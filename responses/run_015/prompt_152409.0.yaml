      *   **The "Cheat" (Linear Character Arc):**
          *   Borges would reject the idea that Phil "improves." If all moments coexist, Phil the Jerk and Phil the Saint are the same Phil.
          *   The movie uses repetition as a *tool* for progress. Borges sees repetition as the *nature* of reality.
          *   This is where the reading breaks down. The movie is teleological (has a goal); Borges is anti-teleological.
      *   **The Ending (The Betrayal):**
          *   Feb 3rd arrives. Linear time is restored.
          *   This validates the "moral exercise" theory. The loop was a purgatory, not a metaphysical truth.
          *   Borges would say Feb 3rd is just another illusion. The movie says Feb 3rd is the *reward*.
      *   **The Caregiver Connection (The "Feel"):**
