answer: |-
  ### Teaching Arc: The Complicity Gradient

  **Target:** Engineers/Rationalists (High systems literacy, low ethics literacy).
  **Goal:** Move from binary voting ethics (utilitarian vs. deontological) to a complicity gradient (causal vs. symbolic responsibility).

  ---

  ### 1. The Locked Dependency: Dual-Channel Output
  Before you introduce the gradient, you must lock in the **Dual-Channel Output Model**. Engineers understand systems that produce multiple outputs from a single input (e.g., a function that returns a value *and* writes to a log file).

  If they view voting solely as a **State Change Mechanism** (did the winner change?), the symbolic layer looks like noise. You must establish that voting actions emit two distinct signals:
  1.  **Instrumental Channel:** The causal impact on the election outcome (probability of being decisive).
  2.  **Affiliation Channel:** The record of alignment with the winning mechanism (internal consistency and external signaling).

  **How to lock it:** Start with a code analogy. "If you commit a patch that fixes a bug but introduces a security vulnerability, are you responsible for the vulnerability even if the bug fix was the primary intent?" Once they agree that side effects carry responsibility, you have the dependency. Voting is not just `if decisive then change_state`; it is `emit_vote` which updates the state *and* logs an affiliation.

  ---

  ### 2. The Carrying Example: The Ranked-Choice Trap
  **Scenario:** A ranked-choice ballot.
  *   **Rank 1:** A write-in candidate (Perfect platform, 0% chance of winning due to structural exclusion, e.g., filed late).
  *   **Rank 2:** Candidate B (Viable, but supports policies you actively oppose/harmful).
  *   **Rank 3:** Candidate C (Viable, supports policies you view as catastrophic).

  **Properties This Example Needs:**
  *   **Structural Impossible Win:** The write-in must be mathematically or legally incapable of winning (not just "unlikely"). This isolates the symbolic variable by neutralizing the instrumental hope.
  *   **Active Harm:** Candidate B cannot be "mediocre." They must support a specific policy you deem harmful. This creates the "lesser evil" tension.
  *   **Automatic Transfer:** The system must guarantee that if the write-in loses, the vote transfers to Candidate B. This ensures the *instrumental* outcome of ranking B #1 vs. Write-in #1 is identical, forcing the ethical distinction into the *affiliation* channel.

  **Properties This Example Must Avoid:**
  *   **Viability Hope:** Do not allow the argument "What if the write-in surprises everyone?" This reverts the discussion to instrumental calculation.
  *   **Dystopian Stakes:** Avoid "Candidate C will start a war." Keep the harm tangible but bureaucratic (e.g., "Candidate B will cut safety regulations"). High-stakes tyranny overrides the gradient; you need nuance.
  *   **Public Record Nuance:** Do not get bogged down in whether the vote is secret. The complicity is primarily internal (self-modeling) rather than external (reputation).

  ---

  ### 3. Sequence and Misconception Mapping

  **Phase 1: The Instrumental Baseline (Minutes 0–20)**
  *   **Focus:** Analyze the vote purely as a causal lever. Calculate the probability of being decisive.
  *   **Misconception:** *"One vote never matters so there's no duty."*
  *   **Head Off:** Do not argue that one vote *does* matter statistically. Acknowledge the probability is near-zero. Instead, reframe duty as **Expected Value**. "If the stakes are high enough, even a 1 in 10 million chance carries ethical weight." Lock in that instrumental responsibility exists *only* in the decisive counterfactual.
  *   **Transition:** "Okay, if causality is this weak, why do we feel dirty voting for Candidate B?"

  **Phase 2: The Affiliation Layer (Minutes 20–40)**
  *   **Focus:** Analyze the vote as a signal. Discuss the cost of aligning with a harmful mechanism.
  *   **Misconception:** *"Expressive voting is just virtue signaling."*
  *   **Head Off:** Preempt the cynicism. Define virtue signaling as *external* performance for status. Define Affiliation as *internal* consistency and system support. "This isn't about looking good to others; it's about whether you want your name in the log file for Candidate B's administration." Use the code analogy: "Did you commit the code, even if it didn't merge?"
  *   **Transition:** "So we have low causal responsibility but high symbolic responsibility. How do we weigh them?"

  **Phase 3: The Complicity Gradient (Minutes 40–60)**
  *   **Focus:** Integrate the channels. The gradient is the tension between the near-zero causal weight and the non-zero symbolic weight.
  *   **Misconception:** *"Abstaining makes me blameless."*
  *   **Head Off:** Show that abstention is also an input. It lowers turnout (causal) and signals disengagement (symbolic). "Abstaining doesn't clear the log; it writes `NULL`. In a system where Candidate B wins by default, `NULL` is functionally equivalent to supporting the status quo." Force them to see that there is no zero-responsibility option, only different points on the gradient.

  ---

  ### 4. End-of-Session Check
  Do not ask them to define the gradient. Ask them to apply it to a **non-political system** to prove transfer.

  **The Prompt:**
  "You are a senior engineer. Management demands you merge a feature that meets the spec (Instrumental Win) but uses a deprecated library that violates team standards (Affiliation Cost). The feature will likely never be used by customers (Low Causal Impact). Using the complicity gradient, write the two-sentence justification for either merging or refusing."

  **Success Criteria:**
  *   **Fail:** They focus only on whether the feature works (Instrumental) or only on "it's against the rules" (Deontological).
  *   **Pass:** They explicitly weigh the low usage probability against the technical debt/log contamination. (e.g., "Even if users never see it, merging it corrupts our codebase history and normalizes the violation for future commits.")

  ---

  ### 5. The Refusal
  **Openly refuse to cover:** **Strategic Voting Calculus.**

  **Reasoning:** Tell them: "We are not going to discuss how to game the system to maximize utility. That is an optimization problem, not an ethics problem. If we start calculating how to hack the ballot, we lose the thread on complicity. We are analyzing the moral cost of the input, not the efficiency of the output."

  This prevents the engineers from retreating into game theory, which is their comfort zone, and forces them to stay in the ethical framework you are building.
