      *   **Prerequisite Dependency:** What must they accept first? If they think voting is purely consequentialist (only outcomes matter), the symbolic part vanishes. If they think it's purely deontological (only duty matters), the causal part vanishes. They need to accept *agency attribution*. Specifically, they need to lock in the distinction between *instrumental impact* (changing the outcome) and *participatory alignment* (associating oneself with the mechanism). For engineers, frame this as "System Input vs. System Affiliation."
