      *   *Correction on Q2:* Don't dismiss the Ripper angle. The user asks if the Moloch reading "flatters" the film. I should argue that the Moloch reading is *too clean*. The film is about the *absurdity* of the trap, not just its logic. The trap is built by idiots.
