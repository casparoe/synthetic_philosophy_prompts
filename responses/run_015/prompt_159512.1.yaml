      *   *The Mismatch:* Red Queen dynamics usually imply a background stability (species don't go extinct just because they run; they just expend energy). In *Strangelove*, the "running" (arms race) leads to actual extinction (Doomsday).
      *   *The Match:* The logic of "we must match them" is identical. The Doomsday Machine is the ultimate Red Queen adaptation: an immune response so vigorous it kills the host to prevent infection.
      *   *Refinement:* The analogy holds regarding the *dynamic* (escalation without gain), but fails regarding the *endpoint*. Evolution rarely selects for self-extinction (usually a dead end). Human technology *does*. The film shows the Red Queen running off a cliff. The "background stability" the user suspects is indeed missing. The film posits that unlike biology, geopolitical systems have a hard "Game Over."

