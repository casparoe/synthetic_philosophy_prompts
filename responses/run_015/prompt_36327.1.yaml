  2. The theory must distinguish between a musical passage expressing an emotion and the composer merely exhibiting a symptom of that emotion, like a trembling voice. Confusing expression with causal origin leads to errors about what is actually heard in the sound.
  3. Although the claim that music never references particular events may be a prejudice, the account must explain why instrumental music lacks the specific semantic reference found in language. This ensures the theory captures music's unique capacity to feel universal rather than indexical.
  4. Expression must be shown to emerge from the temporal progression of the work rather than residing in isolated sounds, since a single chord cannot convey what a developing phrase does. This prevents reducing musical meaning to static labels attached to moments.
  5. The account must identify what the expressed emotion is directed toward, since real emotions usually require an object but music offers none. If this demands a specific object, it conflicts with Item 3, so the solution must preserve music's non-referential nature.
