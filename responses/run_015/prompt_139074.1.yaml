ale, and that's the half of the story the correlation talk hides. (iv) The case I think is the deep one: a normalizable prior with infinite mean, e.g. p(2^k) ∝ 2^(−k/2) on the doubling scale, where 2p(x) > p(x/2) holds everywhere, so always-switching is optimal at every x you could observe, while every policy has infinite expected value and re-roll is worth infinity too, so the whole diagnostic collapses — my claim is that the paradox proper lives here and the finite cases are just bookkeeping. (v) A claim my grad student says is straightforwardly wrong and I'm now unsure about: since re-roll is worth 1.5·E[A] whether or not you look, the ex ante value of the game is 1.5·E[A] and opening the envelope has zero expected value.

  What I want from you: first, check the machinery — the conditional rules in (i), the numbers in (ii), and whether the comparison in (iii) really shows what I say it shows. Second, tell me whether the re-roll device is doing any philosophical work or whether it's just an elaborate way of re-stating the familiar point that P(I hold the smaller envelope | x) is prior-dependent. Third, rank the claims by how shaky they are and tell me which one I should cut if the handout has to lose a section — is it (v), or is the infinite-mean discussion in (iv) the soft part? Fourth, brainstorm briefly: is there a variant case (a different prior, a different option, a noisy peek at the amount) that would make the point sharper or break it, and what would it show? And last, an honest verdict on whether this is interesting enough for a ten-page paper or whether its a nice exercise and nothing more.
