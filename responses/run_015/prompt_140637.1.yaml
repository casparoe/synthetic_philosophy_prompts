  Based on the track record you've provided, here is the reconstruction of her standard, the prediction for the new case, and the follow-up that will pin her down.

  ### The Prediction
  She will **reject** (or label "inconclusive") the Nurse/Praise study.

  She will likely argue that without the "mirror probe" or free-text justifications, a scalar difference in moral judgment is indistinguishable from **outcome bias** or **affective weighting**. She will say that Culture A might not have a different concept of *praiseworthiness*; they might just be more emotionally distressed by the death, inflating their blame score. Without knowing *why* they rated it that way (justifications) or if their ratings shift symmetrically when the outcome flips (mirror probe), she cannot claim this is a philosophical difference rather than a psychological reaction.

  ### The Rule She Is Running
  Her standard is not "clean method means real," nor is it simply "moral content is junk." Her actual rule is:

  > **"Accept variation in *conceptual competence* (what a thing *is*); Reject variation in *normative weighting* (how much a thing *matters*) without mechanistic proof."**

  Here is how her past verdicts map to this rule:

  *   **Accepted (Cases 1, 2, 7):** These are **Competence** judgments.
      *   *Case 1 (Gettier):* Is this *knowledge* or not? (Binary/Categorical definition).
      *   *Case 2 (Gödel):* Does this name *refer* to X or Y? (Semantic definition).
      *   *Case 7 (Forced Choice):* Which story fits better? (Structural preference).
      *   *Why:* These probe the *boundaries* of concepts. If cultures draw the boundary in different places, that is a difference in "philosophical grammar."
  *   **Rejected (Cases 3, 4, 5, 6):** These are **Performance/Weighting** judgments or Methodological Noise.
      *   *Case 3 (Trolley):* Rejected because subjects answered "would" (prediction) instead of "permitted" (norm). This is a performance error, not a conceptual difference.
      *   *Case 4 (Free Will):* Rejected because the effect vanished within-subject. This suggests the "intuition" was unstable framing, not a stable concept.
      *   *Case 5 & 6:* Rejected as linguistic or comprehension noise (data quality).
  *   **The Nurse Case (New):** This is a **Weighting** judgment on a scalar scale (1–7).
      *   *Why it fails:* A difference in *degree* of blame (4 vs. 6) is not necessarily a difference in the *concept* of blame. It could be a difference in emotional intensity or outcome sensitivity. Because she lacks the "mirror probe" (to check if the *structure* of the judgment is the same) and justifications (to check if they are tracking the *concept*), she treats it as noise/weighting, not competence.

  **In short:** She treats Epistemic/Semantic intuitions as **data** (revealing the structure of thought) but treats Moral intuitions as **behavior** (revealing cultural habits) unless you can prove the moral intuition is structural (via justifications or symmetry).

  ### The Follow-Up Case
  To force her to reveal whether she is committed to the **"Competence vs. Weighting"** rule or simply **"Anti-Moral Bias,"** present her with this case:

  **The "Epistemic Scalar" Case:**
  > A vignette where a subject has evidence for a belief, but the evidence is slightly flawed (e.g., a clock that stopped 10 minutes ago).
  >
  > **Method:** Identical to the Nurse study. Clean translation, within-subject (some see the clock stop, some see it run), comprehension checks pass.
  > **Measure:** A 1-to-7 scale: *"How much does the subject **know** the time?"* (Not Yes/No).
  > **Result:** Culture A rates "Knowledge" at 6/7; Culture B rates it at 3/7.
  > **Missing Data:** No justifications, no mirror probe (flipping the clock to be correct/incorrect to check symmetry).

  **Why this forces her hand:**
