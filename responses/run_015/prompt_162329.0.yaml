answer: |-
  This is a complex case because your precedents pull in two different directions. You have a strong "retention with context" tradition (Library, Suffragist, Geneticist, Mayor, Lynching Park) and a narrower "removal" tradition (Statue, Surgeon, Governor School).

  To be consistent with your own history, you need to decide whether Vance's harm is **intrinsic** to the honor (like the Surgeon) or **adjacent** to it (like the Mayor/Geneticist).

  Here is the breakdown of how to decide, based on your panel's track record.

  ### 1. The Precedent Analog
  **The Real Analog: The Surgeon's Wing (with elements of the Segregationist Governor).**

  *   **Why not the Mayor/Geneticist?** In those cases, the honor (desegregating schools / scientific discovery) was functionally separate from the harm (redlining / eugenics advocacy). You could acknowledge the good without validating the bad.
  *   **Why the Surgeon/Governor?** Vance is being honored for "civic improvement" (parks, playgrounds, neighborhood stability). In 1920s urban planning, "improvement" was often code for exclusion. His donation of land and enforcement of deed restrictions were two hands of the same body. He didn't just *happen* to be a racist while building parks; he built parks *for a white neighborhood* enforced by the restrictions he signed. The "good deed" relies on the exclusion to have had the value he intended at the time.
  *   **The Distinction:** Unlike the Library (where the money founded the institution regardless of the donor's morals), Vance's name was chosen *to honor the man*, not just acknowledge the gift. Unlike the Suffragist (whose voting rights work benefited Black women even if she didn't want it to), Vance's parks work *actively harmed* Black families by cementing their displacement.

  **Recommendation:** **Rename.**
  Consistency requires this because the "achievement" (creating a stable, park-filled neighborhood) was achieved *through* the harm (ethnic cleansing and deed restrictions). This matches the Surgeon precedent (achievement built on unethical means) more than the Mayor precedent (achievement alongside unethical views).

  ### 2. Principles for the Vote
  If your colleagues disagree on the analog, they are likely disagreeing on the underlying principle. Here are the two plain-language principles at play:

  *   **Principle A (For Renaming):** *We do not honor civic leadership that required racial exclusion as its method.*
      *   *Sign-on line:* "Vance's philanthropy cannot be separated from the segregation that made it possible; honoring him validates the exclusion."
  *   **Principle B (For Keeping):** *We acknowledge the whole person, preserving the history of both contribution and harm.*
      *   *Sign-on line:* "Vance's parks serve the public today; removing his name erases the complex history of how this city was built, which is better taught with a plaque."

  *Note: Given your 4–3 split on the Surgeon, Principle A is the more fragile coalition. You will need to argue that Vance's harm is more active (displacement) than the Surgeon's (unethical experimentation) or the Mayor's (signing a plan).*

  ### 3. The Two Uncertain Facts
  You asked which facts would flip the recommendation.

  *   **Fact (a): Did the park deeds restrict use to white residents?**
      *   **This is the Flipper.**
      *   **If YES:** My recommendation flips to **Rename (High Confidence).** If the parks he is honored for were legally segregated by his own hand, the "honor" is fundamentally fraudulent. It moves from "mixed legacy" (Mayor) to "instrument of segregation" (Governor School).
      *   **If NO:** My recommendation stays **Rename**, but confidence drops. It becomes a "Suffragist/Mayor" case where the good work was open to all, even if the neighborhood wasn't.
  *   **Fact (b): Was the school sited to serve a whites-only subdivision?**
      *   **This is Secondary.**
      *   **If YES:** It strengthens the Rename case (the school itself was a tool of the segregation).
      *   **If NO:** It weakens the link between the *school* and the *harm*, but doesn't absolve Vance. Since the school moved in 1988, the original siting matters less than the namesake's legacy.

  **Summary:** Fact (a) is the critical threshold. If the parks were white-only, the "Keep" precedents (Mayor/Geneticist) no longer apply because the "good" was not public.

  ### 4. The Funding and the Name ("Riverside")
  **Should cost count?**
  Yes, but not as a veto. In your past seven cases, cost was never recorded as a deciding factor. If you establish cost as a barrier now, you set a precedent that justice is only affordable when cheap. However, fiscal responsibility is a valid governance concern.
  *   **Principle:** *Financial cost should not dictate commemorative justice, but unfunded mandates should not burden the community.*
  *   **Application:** Since the donor covers the cost, the fiscal objection vanishes.

  **Should you accept the "Riverside" condition?**
  **Yes, but with a caveat.**
  *   **The Risk:** Allowing a donor to pick the name sets a bad precedent (pay-to-play naming).
  *   **The Mitigation:** "Riverside" is not a donor's vanity name; it is a **restorative name**. It honors the erased community, not the donor. This aligns with the **Lynching Victim Park** precedent (centering the harmed community).
  *   **Recommendation:** Accept the name "Riverside" on its own merit as a restoration of the displaced neighborhood's identity. Accept the money because it removes the burden from the PTA.
  *   **Caveat:** The panel must vote to approve "Riverside" *independently* of the donation. If the panel would have chosen "Riverside" anyway, take the money. If the panel prefers a Civil Rights leader's name, do not take the money (or ask if the donor will fund that name instead). Do not let the donor's condition force a name the panel rejects.

  ### 5. Confidence Levels

  *   **Recommendation (Rename):** **Moderate-High Confidence (75%).**
      *   *Reasoning:* The link between "parks commissioner" and "deed restrictions" makes the harm intrinsic to the honor, distinguishing it from the Mayor/Geneticist cases.
  *   **The Analog (Surgeon/Governor vs. Mayor):** **Moderate Confidence (65%).**
      *   *Reasoning:* Your panel is clearly split on "tainted achievement" (4–3 on the Surgeon). This vote will likely be close (4–3 or 5–2).
  *   **The Funding/Name Condition:** **Low Confidence (50%).**
      *   *Reasoning:* This is the **one I am least sure of.** You have no precedent for donor conditions. Accepting money tied to a specific name risks the panel's independence, even if the name is good. It sets a precedent that an anonymous actor can steer your outcomes by opening their wallet. I am unsure if your panel norms can absorb this without damage.
  *   **Fact (a) as a Flipper:** **High Confidence (90%).**
      *   *Reasoning:* Legally segregated parks fundamentally change the nature of the "public benefit" he provided.

  ### Summary Advice for the Meeting
  1.  **Push for Fact (a) immediately.** If the parks were white-only, the debate is over; you must rename to remain consistent with the Governor School precedent.
  2.  **Frame the argument around "Method," not "Views."** Vance isn't being renamed because he was racist (Suffragist kept); he is being renamed because his *civic achievement* relied on racist exclusion (Surgeon).
  3.  **On the Money:** Vote on the name "Riverside" first. If it passes on merit, accept the donation. If it fails, decline the donation. Do not bundle them.
