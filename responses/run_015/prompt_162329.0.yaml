prompt: |-
  hey — I sit on this city's Commemoration Advisory Panel (seven of us, monthly meetings, the school board can override us but basically never has) and we've got a school naming case to decide in three weeks, so I'm trying to work out what we already committed ourselves to. Our run of verdicts so far:

  - bronze statue of a Confederate colonel on the courthouse lawn, put up in 1909 by the local daughters-of-the-confederacy chapter — removed to museum storage, empty plinth left with an interpretive marker
  - a street and the public library both named for a 19th-century merchant who was the city's biggest slave trader and whose bequest founded the library — street renamed for a local civil-rights lawyer, library kept its name with a lobby installation about the bequest
  - elementary school named for a suffragist who also campaigned for immigration restriction and wrote against Black suffrage — kept, plaque added
  - research wing named for a surgeon honored for a technique he developed by experimenting on incarcerated patients without consent — renamed, 4–3
  - science building named for a geneticist who was a prominent eugenics advocate but whose honored discovery had nothing to do with that — kept, plaque rewritten to say both things
  - bust of a mayor who desegregated the schools and also signed off on the redlining-era housing plan — kept, plaque rewritten
  - a school renamed in 1961 for a sitting governor explicitly as a tribute to his resistance to desegregation — renamed again in 2019
  - a park renamed in 1998 for a man lynched here in 1918, at the request of a preservation society; some descendants said the naming was done over their heads and reopens the wound — we kept the name but funded a family-designed commemoration and an oral-history project instead

  New case: Vance Elementary, named in 1926 for Ellery Vance, a banker and parks commissioner who donated land for six city parks and paid for the school's playground; that's what he's honored for. In 1921 he was a leading figure in the neighborhood association that organized the boycott-and-petition campaign that drove about 200 Black families out of Riverside, and he signed the deed restrictions that kept that neighborhood white for a generation. He never held office, no Confederate connection. Twist: the school was closed in 1988 and reopened across town as a merged school that kept the name; today's families are mostly Latino and Black with no tie to Riverside, and the PTA mostly shrugs and doesn't want to spend money on new signs and uniforms. A descendant-led group, the Riverside Descendants Project, is petitioning for renaming.

  So: what should we decide if we want to be consistent with ourselves, and which precedent is the real analog — the surgeon's wing, where the honored achievement was built on the wrong, or the science building and the mayor's bust, where the wrong sat alongside the achievement? If our precedents genuinely don't settle it, I want to know what principle we'd be adopting with each option, stated plainly enough that a member can sign onto it.

  Two facts we haven't nailed down: (a) whether Vance's park deeds restricted use to white residents, and (b) whether the school was sited to serve a whites-only subdivision. Which of those, established either way, would actually flip your recommendation, and how?

  Also, if we do rename: an anonymous donor will cover the ~$85k in signage and rebranding costs only if the new name is "Riverside Elementary," restoring the name of the neighborhood that was erased. Half the panel thinks that's the whole point, half thinks it's paying a stranger to pick our name. And tell me whether cost should count at all — I don't think we've ever said.

  Finally, please say how confident you are in each of your calls and single out the one you're least sure of.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User Role:** Member of a City Commemoration Advisory Panel (7 members, monthly meetings, advisory but influential).
      *   **Task:** Deciding on a school naming case (Vance Elementary) in three weeks.
      *   **Goal:** Determine consistency with past precedents, identify the correct analog, articulate underlying principles, analyze specific factual uncertainties, address the funding constraint/offer, and assess confidence levels.
      *   **Tone:** Professional, analytical, nuanced, pragmatic, respectful of the panel's history.

  2.  **Analyze the Precedents (The "Case Law"):**
      *   *Confederate Statue (1909):* Removed. (Reason: Explicit celebration of treason/slavery ideology).
      *   *Slave Trader Merchant (Street/Library):* Street renamed, Library kept + context. (Reason: Distinction between ubiquitous infrastructure vs. specific cultural institution? Or degree of harm? The library bequest was the foundation, but the name stayed with context).
      *   *Suffragist (Elementary):* Kept + plaque. (Reason: Mixed legacy, primary honor is positive (suffrage), negative views (racism/xenophobia) noted).
      *   *Surgeon (Research Wing):* Renamed (4-3). (Reason: The *achievement itself* was tainted by unethical means. The harm was intrinsic to the honor).
      *   *Geneticist (Science Building):* Kept + rewritten plaque. (Reason: Achievement (discovery) separate from ideology (eugenics). Harm was ideological, not intrinsic to the specific discovery).
      *   *Mayor (Bust):* Kept + rewritten plaque. (Reason: Mixed legacy (desegregation vs. redlining). Positive action weighed against negative).
      *   *Segregationist Governor (School):* Renamed. (Reason: The *purpose* of the naming was explicitly to honor resistance to desegregation).
      *   *Lynching Victim (Park):* Kept + family commemoration. (Reason: Restorative justice, despite family division. Naming was meant as apology/memory, not honor of perpetrator).

  3.  **Analyze the Current Case (Vance Elementary):**
      *   **Honoree:** Ellery Vance (Banker, Parks Commissioner).
      *   **Reason for Honor:** Donated land for parks, paid for playground.
      *   **The Harm:** Led 1921 campaign to drive 200 Black families out of Riverside (ethnic cleansing/displacement). Signed deed restrictions keeping neighborhood white.
      *   **Context:** School closed 1988, reopened across town (merged). Current demographic: Mostly Latino/Black. No tie to original Riverside.
      *   **Stakeholders:** PTA (shrugs, cost-conscious), Riverside Descendants Project (petitioning for rename).
      *   **Funding:** Anonymous donor offers $85k *only* if renamed "Riverside Elementary."

  4.  **Determine the Analog:**
      *   *Is it the Surgeon?* (Achievement built on the wrong). Vance's "achievement" (parks/playground) wasn't *built* on the displacement in a direct causal sense (like non-consensual experimentation), but his status/ability to donate likely stemmed from the segregated wealth structure he enforced. However, the displacement was a separate civic action, not the method of creating the playground.
      *   *Is it the Geneticist/Mayor?* (Wrong sat alongside achievement). This feels closer. He gave parks (good) but enforced segregation/displacement (bad).
      *   *Is it the Segregationist Governor?* (Naming explicitly to honor resistance). No, named in 1926 for donations, not explicitly for the 1921 displacement, though they are temporally close and ideologically linked.
      *   *Is it the Slave Trader?* (Foundation of wealth). Vance's wealth likely enabled the donation, similar to the merchant's bequest founding the library. But the library kept the name.
      *   *Crucial Distinction:* The *act* he is honored for (philanthropy) is tainted by the *simultaneous act* of ethnic cleansing. Unlike the Geneticist (science is neutral to eugenics), Vance's philanthropy was part of a "civic improvement" package that often went hand-in-hand with exclusion in that era.
      *   *Best Analog:* **The Surgeon** is too strong (direct causality missing). **The Geneticist/Mayor** is the closest formal match (mixed bag), *but* the nature of the harm (displacement/ethnic cleansing) is more active and community-destroying than "advocating eugenics" or "signing a housing plan." It aligns more closely with the **Segregationist Governor** in *effect* (maintaining white supremacy), even if the *naming intent* was philanthropy.
      *   *Refined Analog:* It sits between the **Mayor** (mixed legacy) and the **Segregationist Governor** (harm defines the legacy). However, the *Surgeon* precedent is the critical pivot point: Did the honor *require* the harm? No. But did the harm make the honor impossible for the victims? Yes.
      *   *Decision:* The **Mayor** precedent is the safest consistency play (Keep + Plaque), *but* the **Surgeon** precedent is the morally consistent play if the panel views the displacement as rendering the philanthropy toxic. Given the 4-3 split on the Surgeon, the panel is divided on "tainted achievement."
      *   *My Recommendation:* Lean towards **Renaming**. Why? Because the "honor" (civic leadership/parks) was inextricably linked to the exclusion (deed restrictions/boycott). You can't have the "parks commissioner" legacy without the "segregated parks" reality. This makes it closer to the Surgeon (the good thing is tainted by the bad method) than the Geneticist (the science stands apart from the ideology).

  5.  **Address the Factual Uncertainties:**
      *   (a) *Park Deeds Restricted to White Residents?*
          *   If **Yes**: Flips to **Rename**. This makes the "honor" (parks) itself an instrument of segregation. Direct link between the good deed and the harm. Analog: Segregationist Governor.
          *   If **No**: Keeps it in **Mayor/Geneticist** territory (Keep + Plaque). The parks were open, even if the neighborhood wasn't.
      *   (b) *School Sited for Whites-Only Subdivision?*
          *   If **Yes**: Strengthens the **Rename** case. The school itself was an instrument of the segregation he engineered.
          *   If **No**: Weakens the link.
      *   *Which flips the recommendation?* (a) is the stronger flipper. If the parks he is honored for were legally segregated by his own deeds, the honor is fundamentally compromised.

  6.  **Address the Funding/Name Issue:**
      *   *Donor Offer:* $85k for "Riverside Elementary."
      *   *Conflict:* Panel autonomy vs. Practical benefit.
      *   *Principle:* The panel should choose the name based on merit, not funding. However, "Riverside" is restorative (restoring the erased neighborhood identity).
      *   *Recommendation:* Accept "Riverside" *if* the decision is to rename, but not *because* of the money. The name "Riverside" honors the victims/community, not a new person. It aligns with the Lynching Victim Park precedent (commemorating the harmed).
      *   *Should cost count?* Yes, pragmatically, but not as a veto. If the moral imperative is strong, cost is secondary. If the moral case is weak, cost is a good excuse to stay put. Here, cost shouldn't drive the decision, but the donor's condition shouldn't veto a different restorative name.

  7.  **Drafting the Response:**
      *   *Structure:*
          1.  Executive Summary/Recommendation.
          2.  Precedent Analysis (The Analog).
          3.  Principles for Each Option.
          4.  Factual Uncertainties (The Flippers).
          5.  Funding & Naming (The "Riverside" Question).
          6.  Confidence Levels.
      *   *Tone:* Advisory, peer-to-peer, clear on logic.

  8.  **Refining the Logic (Self-Correction during drafting):**
      *   *Wait, check the Library precedent.* Merchant was a slave trader, library kept name. Why? Because the *bequest* founded it. Vance *paid for the playground*, didn't found the school. The school was named *for* him. This makes it more like the Statue or the Governor school than the Library.
      *   *Check the Suffragist.* Kept name. She campaigned against Black suffrage. Vance campaigned against Black residency. Very similar. Why rename Vance? Because the Suffragist's *primary* honor (vote for women) is distinct from her racism. Vance's *primary* honor (civic improvement/parks) was *mechanism* of his racism (exclusionary zoning/deeds). This is the key distinction.
      *   *Re-evaluating the Analog:* The **Mayor** is the best fit for "mixed bag." The **Surgeon** is the best fit for "tainted means." Vance is closer to the Mayor, *unless* the parks were segregated.
      *   *Wait, the School Move:* The school moved in 1988. The current kids have no tie. The PTA doesn't care. The Descendants do. This mirrors the **Lynching Victim Park** (descendants vs. preservation society). In that case, they kept the name but added commemoration.
      *   *Pivot:* Actually, the strongest argument for renaming is the **Segregationist Governor** school. Even if Vance wasn't named *explicitly* for segregation, his defining civic legacy *is* segregation. The 1921 boycott is the historical footprint.
      *   *Decision:* I will recommend **Renaming**, but acknowledge the **Mayor** precedent is the counter-weight. The distinction is that Vance's "good works" (parks) were tools of exclusion (deed restrictions).
      *   *Wait, looking closer at the prompt:* "Which of those [facts], established either way, would actually flip your recommendation?" I need to be specific.
      *   *Funding:* If the panel decides to rename, "Riverside" is a strong restorative name. Taking the money is fine *if* the name is chosen on merit.

  9.  **Final Polish:** Check confidence levels. Ensure the distinction between "Surgeon" (means taint end) and "Geneticist" (ideology separate from end) is clear.

      *   *Correction on Confidence:* I need to be honest. The precedents are messy. The Library vs. Suffragist vs. Mayor creates a "Keep" bias. The Surgeon vs. Governor creates a "Remove" bias. Vance is right in the middle. I should express moderate confidence, highlighting the tension.

      *(Self-Correction)*: Actually, looking at the Library (Slave Trader) -> Kept. Suffragist (Racist) -> Kept. Mayor (Redlining) -> Kept. Geneticist (Eugenics) -> Kept.
      *Remove* list: Confederate Statue, Surgeon (4-3), Segregationist Governor.
      *The "Keep" precedent is actually stronger numerically (5 vs 3).*
      *To recommend Renaming, I must argue why Vance is more like the Governor/Surgeon than the Mayor/Suffragist.*
      *Argument:* The Suffragist/Mayor/Geneticist had *separable* achievements. Vance's achievement (parks/neighborhood improvement) was *defined* by exclusion in 1920s planning. You cannot separate "Riverside Parks" from "White Riverside."
      *Okay, I will stick with Renaming but acknowledge the difficulty.*

      *Wait, one more check:* The Library kept the name of the Slave Trader. That's a huge hurdle. Why? Because the *institution* depended on the money. Vance paid for the *playground*, not the school's existence. This makes it easier to rename than the Library.
      *Okay, I'm confident enough to recommend Renaming, with the "Park Deed" fact as the critical switch.*

  10. **Finalizing the Output Structure:**
      *   Precedent Analysis.
      *   The Decision (Rename vs. Keep).
      *   Principles.
      *   The Two Facts.
      *   The Money/Name.
      *   Confidence.

      *(Final thought on Confidence)*: I am least sure about the funding principle. It's outside their usual scope.

      *(Final thought on Facts)*: Fact (a) is the big one. If parks were white-only, the "honor" is a lie.

