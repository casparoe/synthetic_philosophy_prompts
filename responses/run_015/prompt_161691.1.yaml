prompt: |-
  I've been asked to run a sealed-bid tender for the organisation I work for, and I've been spending what spare time I have on the mechanics of how such things are supposed to work. Our format is the ordinary one: suppliers submit sealed bids, the lowest bid wins, and the winner is paid its own bid. There is an alternative format that textbooks like, in which the lowest bidder still wins but is paid the runner-up's price; there, quoting your true cost is the sensible thing to do whatever you happen to believe about your rivals, whereas in our format a supplier has to bid some way above its own cost, and by how much depends on how many rivals it faces and on what it expects those rivals to do. Real tenders almost never use the other format.

  What I can't get straight is what our format presupposes about the bidders. Taken at face value it seems to need a great deal: not merely that each supplier knows its own costs, but that each has a view about the others' costs, a view about the others' views, and so on upward — and, further, that they all in some sense share a single picture of the spread of costs they are drawing from, so that whatever disagreement exists among them is really just a difference in private information. It also strikes me as odd that we seal the bids and forbid the bidders from talking to one another, thereby destroying mutual knowledge, while the predictions we rely on seem to need that mutual knowledge; and that our own rules let me reject a bid for being implausibly cheap, as though a supplier offering a very low price must be mistaken about its own costs, even though finding out who genuinely has the lowest costs was the whole purpose of the exercise.

  I'd like you to reconstruct the implicit theory of rationality and mutual knowledge that this practice rests on, and to tell me which parts the practice strictly presupposes and which it merely sits comfortably with. Could the same practice be licensed by a view on which suppliers are risk-averse, or one on which they reason only a step or two about each other rather than reasoning to a fixed point, or one on which they learn across repeated tenders instead of working anything out in advance? Where is the choice of format philosophically underdetermined — where would several quite different theories of bidder rationality all tell me to carry on exactly as we do? And what would concretely have to change in how we run the tender if I stopped assuming common knowledge of rationality: for instance, if I announced in advance that every bid would be published afterwards, or if I knew that one regular supplier always bids its true cost?

  Please argue from the structure of the situation rather than from the literature — I want your own reconstruction, not references — and write the answer in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Task:** Reconstruct the implicit theory of rationality and mutual knowledge underlying a standard sealed-bid, lowest-bid-wins, pay-your-bid tender (First-Price Sealed-Bid Auction).
      *   **Specific Questions to Address:**
          *   What does the practice strictly presuppose vs. what does it merely sit comfortably with?
          *   Could the practice be licensed by risk aversion, limited reasoning steps, or learning models?
          *   Where is the choice of format philosophically underdetermined (i.e., where do different theories converge on the same practice)?
          *   What would concretely change if assumptions shifted (e.g., publishing bids, knowing a bidder bids true cost)?
      *   **Constraints:** Argue from the *structure of the situation*, not from literature/references. Use British English.
      *   **Tone:** Analytical, philosophical, practical but rigorous.

  2.  **Deconstruct the Scenario:**
      *   **Format:** First-Price Sealed-Bid (FPSB).
      *   **Goal:** Minimise cost for the buyer (organisation).
      *   **Mechanism:** Lowest bid wins, winner gets paid their bid.
      *   **User's Observation:** FPSB requires strategic shading (bidding above cost). Second-Price (Vickrey) encourages truth-telling. FPSB seems to require complex common knowledge (costs, beliefs about beliefs, distributions). Sealing bids destroys communication, yet the model seems to require shared understanding. Rejection of "implausibly cheap" bids seems contradictory to finding the lowest cost.

  3.  **Drafting the Core Argument (The "Implicit Theory"):**
      *   *What is the standard model?* It's the Bayesian Nash Equilibrium (BNE) framework.
      *   *What does it assume?*
          1.  Rationality (maximise expected profit).
          2.  Private Information (each knows own cost, not others').
          3.  Common Prior (everyone agrees on the probability distribution of costs).
          4.  Common Knowledge of Rationality (everyone knows everyone is rational, knows they know, etc.).
      *   *Why seal bids?* To prevent collusion and dynamic adjustment. It forces the "one-shot" calculation.
      *   *Why reject low bids?* To avoid the "Winner's Curse" or breach of contract. It implies a belief that costs have a hard floor known to the buyer.

  4.  **Addressing "Strict Presupposition" vs. "Comfortable Fit":**
      *   *Strict:* The mechanism *needs* bidders to shade bids. If they bid true cost, the buyer pays less, but the system breaks if bidders lose money. So, it presupposes bidders *won't* bid true cost. It presupposes competition drives price down, but not to marginal cost.
      *   *Comfortable:* The *degree* of shading depends on the specific beliefs. The system works even if the Common Prior assumption is slightly off, as long as expectations converge roughly.

  5.  **Addressing Alternative Rationality Models:**
      *   *Risk Aversion:* If bidders are risk-averse, they shade *less* (bid lower) to secure the win. This benefits the buyer. So, the practice is licensed (even improved) by risk aversion.
      *   *Limited Reasoning (Level-k):* If bidders only think 1-2 steps, they might not reach equilibrium. Some might bid high, some low. The buyer still gets a competitive price, perhaps better than equilibrium if some are naive. The practice survives.
      *   *Learning (Repeated):* If repeated, bidders learn the winning price. They converge towards the equilibrium. The practice is stable over time.
      *   *Underdetermination:* The practice is robust. You don't *need* full Common Knowledge of Rationality. You just need enough competition and enough self-interest to prevent bidding at cost.

  6.  **Addressing Concrete Changes (Counterfactuals):**
      *   *Publishing Bids:* Changes the game from one-shot to repeated/signalling. Could facilitate collusion (tacit). Could allow learning. If published, bidders might punish undercutting in future rounds. *Change needed:* Anonymise results or rotate suppliers to prevent signalling.
      *   *One True-Cost Bidder:* If one bidder always bids cost, they win often but make zero profit. Eventually, they exit or change strategy. If they stay, they drive prices down. *Change needed:* You might not need to reject low bids if you trust that specific bidder, but you risk them going bust. You might need to vet financial stability more rigorously.

  7.  **Refining the Argument (Philosophical/Structural Focus):**
      *   Focus on the *epistemic structure*. The sealed bid creates a "simultaneous move" game.
      *   The "Common Prior" is the heavy lifter. It allows the buyer to assume the market is efficient without knowing the specific costs.
      *   The rejection of "abnormally low tenders" is a safeguard against the breakdown of the rationality assumption (i.e., preventing a bidder from making a mistake that harms the project). It treats the bid not just as a price, but as a *commitment capability*.

