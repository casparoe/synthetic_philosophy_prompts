answer: |-
  You have identified a genuine tension between the mechanical simplicity of the first-price sealed-bid tender and the epistemic complexity required to make it function efficiently. Your intuition is correct: the standard format relies on a specific, somewhat fragile architecture of belief, yet it persists because it is robust to deviations from that architecture.

  Here is a reconstruction of the implicit theory underpinning your practice, distinguished by what it strictly requires versus what merely supports it, followed by an analysis of how alternative models of rationality would alter your procedure.

  ### 1. The Implicit Theory: Epistemic Isolation and Convergent Expectations

  At its core, your tender format treats the bidding process as a simultaneous-move game of incomplete information. The "theory" you are implicitly employing is not merely that suppliers are rational, but that they are *strategically rational within a shared statistical universe*.

  **The Strict Presuppositions**
  Strictly speaking, for the tender to yield a stable market price without collapsing into ruinous competition or collusion, it presupposes three structural conditions:

  1.  **Incentive Compatibility of Secrecy:** It presupposes that sealing the bids successfully isolates each bidder's decision. If a bidder believes their bid can be inferred or influenced by another prior to submission, the strategic calculation shifts from "guessing the distribution" to "guessing the rival". The seal is not just administrative; it is the physical enforcement of the assumption that information cannot flow between agents.
  2.  **The Profit Constraint:** It presupposes that no rational agent will bid below their own cost of fulfillment. This is the only hard floor. If you accept a bid below cost, you are presupposing the bidder is either irrational or intending to breach the contract later (via renegotiation or corner-cutting). Therefore, the mechanism strictly requires that bidders prioritise solvency over market share in this specific context.
  3.  **Competition as a Disciplinary Force:** It presupposes that there are enough bidders that no single supplier can dictate terms. If there is only one viable supplier, the "lowest bid wins" rule is vacuous. The format presupposes a market structure where the fear of losing drives the price down, even if not to the absolute marginal cost.

  **What Merely Sits Comfortably**
  The heavier theoretical baggage you identified—common knowledge of rationality, infinite regress of beliefs ("I know that he knows that I know")—is not strictly necessary for the tender to work; it merely makes the *prediction* of the winning price easier for you.

  In practice, the tender works comfortably even if bidders do not share a single picture of the cost distribution, provided their expectations *converge*. If Supplier A thinks costs are generally high and Supplier B thinks they are low, they will bid differently. The lowest bid still wins. You do not need them to agree on the *reason* for their bid, only that their self-interest compels them to bid competitively. The "Common Prior" assumption is a modelling convenience for the economist, not a functional requirement for the buyer. You benefit from their disagreement, provided it does not lead to the winner underpricing so severely that they fail.

  ### 2. Alternative Models of Rationality

  You ask whether the practice could be licensed by different views of bidder psychology. Remarkably, the first-price sealed-bid format is robust across several divergent theories of rationality.

  **Risk Aversion**
  The standard model assumes risk neutrality (bidders maximise expected monetary value). If you assume suppliers are risk-averse, the practice is not only licensed but strengthened. A risk-averse supplier fears losing the contract more than they desire extra margin. Consequently, they will shade their bid *less* aggressively than a risk-neutral one (bidding closer to their true cost to secure the win).
  *   **Implication:** You do not need to change the format. Risk aversion acts as a subsidy to the buyer. The mechanism extracts more surplus from risk-averse bidders than from risk-neutral ones.

  **Bounded Rationality (Level-k Reasoning)**
  Suppose suppliers do not reason to a fixed point (equilibrium) but only think one or two steps ahead ("I will bid my cost plus 10%" or "I will bid what I think the average bidder will do minus 1%").
  *   **Implication:** The practice remains valid. In fact, a mix of reasoning depths often benefits the buyer. A sophisticated bidder will undercut a naive one. As long as there is at least one competitor capable of aggressive pricing, the "lowest bid wins" rule captures the benefit. The format does not require universal sophistication, only sufficient competition to punish naivety.

  **Learning and Repetition**
  If suppliers learn across repeated tenders rather than calculating in advance, they will adjust their mark-ups based on past winning prices.
  *   **Implication:** This is where the "sealed" nature becomes crucial. If bids are published (see below), learning facilitates collusion. If bids remain secret, suppliers only learn whether they won or lost. This creates a "trial and error" convergence towards the market clearing price. The practice is licensed by learning models, provided the feedback loop is limited to "win/loss" rather than specific price data.

  ### 3. Philosophical Underdetermination

  There is a significant zone where the choice of format is underdetermined by the theory of rationality. Whether your bidders are hyper-rational equilibrium seekers, risk-averse pragmatists, or learning agents, they all face the same fundamental structural constraint: **to win, you must be lower than the rival; to profit, you must be higher than your cost.**

  All these theories converge on the recommendation to use the sealed-bid format *if* your goal is price discovery without collusion.
  *   **Why not open auction?** An open descending auction (Dutch auction) would achieve a similar price in theory, but it requires synchronous presence and risks signalling.
  *   **Why not second-price?** As you noted, second-price encourages truth-telling. However, under risk aversion or bounded rationality, the revenue equivalence theorem breaks down. In the real world, first-price auctions often generate higher revenue (lower cost for you) because bidders fear the uncertainty of the rival's bid more than the uncertainty of the price they will pay.

  Thus, the practice is underdetermined in the sense that you do not need to know *which* theory of rationality is true to justify the format. You only need to know that *all* plausible theories suggest bidders will compete on price when isolated from one another.

  ### 4. Concrete Changes Under Shifted Assumptions

  If you were to alter the epistemic assumptions underpinning the tender, the mechanics would need to shift to maintain integrity.

  **Scenario A: Publishing Bids Afterward**
  If you announce that every bid will be published after the award, you fundamentally alter the game from a one-shot interaction to a repeated signalling game.
  *   **The Risk:** Bidders can use their bids to send messages to rivals. A supplier might bid anomalously low to signal aggression, deterring rivals from competing in the *next* tender. Alternatively, they might bid high to establish a price floor for the market.
  *   **Concrete Change:** You would need to anonymise the data. You could publish the *range* of prices or the *average*, but revealing which supplier bid what allows for tacit collusion in future rounds. To maintain the "isolated decision" structure, the feedback must not allow rivals to identify and punish undercutting.

  **Scenario B: A "True-Cost" Bidder**
  Suppose you know one regular supplier always bids their true cost (perhaps a public body or a firm with a different mandate).
  *   **The Risk:** In a standard first-price auction, this bidder will win frequently but make zero profit. Over time, they may exit the market or degrade quality to survive. Furthermore, other rational bidders will simply bid just below this true-cost price if they can estimate it, or exit the market entirely if they cannot beat it profitably.
  *   **Concrete Change:** You would need to introduce a **reserve price** or a **quality-weighted evaluation**. If one bidder is pricing at cost, the market price is effectively set at the marginal cost of the most efficient provider. To prevent the winner's curse (where the winner realises too late they cannot fulfill the contract), you would need to increase your pre-qualification scrutiny. You are no longer testing the market's price discovery; you are accepting a specific supplier's cost structure. The tender becomes less about competition and more about verification. You might move to a "cost-plus" model for that specific supplier while keeping competitive tendering for others, or you must accept that the competitive tension will evaporate as other suppliers realise they cannot compete with a non-profit bidder.

  ### 5. The Rejection of "Implausibly Cheap" Bids

  Finally, to address your unease about rejecting low bids: this practice seems contradictory only if you view the bid as a pure price signal. Structurally, you must view the bid as a **commitment device**.

  When you reject a bid for being too low, you are asserting that you possess superior knowledge about the *feasibility* of the work than the bidder does. You are effectively saying: "The market distribution of costs has a hard floor, and your bid violates the laws of physics/economics we all supposedly agree on."

  If you strictly adhered to the theory that bidders have private information about their own costs that you do not possess, you could never reject a low bid. By rejecting one, you are breaking the "private values" assumption and imposing a "common value" constraint. You are asserting that the cost of the work is objective and known to you.
  *   **Justification:** This is philosophically consistent if you view the tender as selecting a *partner*, not just a price. A bid below cost signals a high probability of contract failure, litigation, or corner-cutting. The "lowest bid" is only the winner conditional on the bid being *credible*.
  *   **Change required:** If you wish to be consistent with the pure private-value model, you must remove the discretion to reject low bids and instead rely on performance bonds or penalties. However, most organisations rightly judge that the cost of contract failure exceeds the saving from a suspiciously low bid.

  ### Summary

  Your tender format does not strictly require the heavy machinery of common knowledge and infinite reasoning. It strictly requires only that bidders are self-interested, isolated, and solvency-constrained. It sits comfortably with risk aversion and bounded rationality, often benefiting from them.

  The format is philosophically underdetermined in that multiple conflicting theories of human reasoning all recommend it as the most robust way to prevent collusion while extracting competitive pricing. You would only need to change the mechanics if you altered the information flow (publishing bids) or if you introduced an agent who does not play by the profit-maximisation rules (the true-cost bidder). In those cases, the isolation of the bidders or the competitive tension itself would be compromised, requiring you to shift from price competition to qualification verification.
