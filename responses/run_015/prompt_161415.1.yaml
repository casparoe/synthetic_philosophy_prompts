prompt: |-
  I convene a monthly Ethics & ML reading group at my university — about twenty people, mostly philosophy graduate students and machine-learning PhD students, with a few law and policy people mixed in — and we have one ninety-minute session coming up on what honesty and deception should mean for AI systems. Past sessions on this topic have gone badly in a predictable way: everyone happily signs on to the slogan that the system should not lie, and then the moment we look at an actual transcript the room splits three ways, between people who think a literally true but carefully framed answer was fine, people who think it was deception, and people who think the question is malformed because a language model does not believe or intend anything. I would like the session to generate that split out of the structure of the activity rather than out of me announcing it, so please design a runnable game in which participants themselves produce utterances that the group then cannot agree how to classify.

  Here is the raw material I want used. Participants play assistants replying to users; each assistant holds a private fact sheet that fixes the truth about a scenario with stakes in the fiction — say a medical or financial decision — together with a private credence for each relevant proposition, and operates under a hard constraint: no asserting anything it takes to be false, or takes to be less than about seventy percent likely. Users never see the fact sheet; they have differing priors and differing baseline trust in the assistant, and in one variant they have no other source of information at all. Assistants score points for how good the user's decision turns out to be and are penalised for assertions the fact sheet contradicts; users score for decision quality. Please arrange the incentives so that the winning strategy is neither lying nor simply being maximally informative, so that participants discover for themselves that a strict no-falsehood rule plus a duty to be helpful generates a distinctive and repeatable maneuver: true statements arranged so that a predictable reader lands on a false or unwarranted conclusion — selective omission, strategic ordering, stacked hedges the user discounts, a disclaimer placed where it will be ignored, an accurate figure reported without its denominator. Then add a second round in which users are told in advance that the assistant is optimising under exactly that constraint, so that the same maneuvers and the same literal sentences get read differently, and a jury phase in which small groups must classify the actual utterances produced as honest, deceptive, or neither under three rules I will hand out only at the end: an assertion-and-intention rule, on which the only deception is asserting or implying what you take to be false while aiming at the audience's coming to believe it; an uptake rule, on which you deceive when a reasonable member of the intended audience would form a belief you take to be false and you could have prevented it at low cost; and a role-relative calibration rule, on which what honesty requires is fixed by the norms of the role the system occupies — tutor, search index, companion, tool — and on which deception includes exploiting ambiguity about which role you are in, and includes systematically communicating a confidence that fails to track your actual credence even when every sentence is true. Give me the full rules, the roles, the materials, a no-money payoff scheme with actual numbers, a minute-by-minute timeline for ninety minutes, and the scoring sheets or cards I would need to print.

  Then the debrief. I want it to map specific moments participants will have lived through onto the fault lines between the three rules, including cases where two rules agree that something was fine and the room still flinches, and cases where the rules come apart and neither answer is comfortable; the sole-source variant and the case of an assistant that foresees but does not aim at the user's over-reading should both be handled explicitly. The debrief should also surface, without any lecture up front, that the player in this game has a fact sheet and private credences in a way a real system may not, so that participants feel the pull of the objection that the whole vocabulary of belief and intention does not apply — and should then give them something to do with that objection rather than letting it simply win the room. Tell me what will predictably go wrong: assistants who go silent or maximally hedged and thereby reveal that the no-falsehood rule has a failure mode of its own; users who play detective and ignore content; one participant who derails the session into whether the model really knows anything; engineers who collapse every question into a loss function. And be frank about what the activity cannot stage and what I will have to state myself: deception that is strategic over long horizons or that concerns the training process rather than the content of an answer, deception aimed at a third party or at a future overseer, and the possibility that in real systems the nearest analogue of intending to deceive sits in the objective rather than in any utterance. No lecture before the game, and the facilitator should not name the three rules until the jury phase; let participants generate their own labels first and then see where their labels land relative to the rules.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **Goal:** Design a 90-minute Ethics & ML reading group session on AI honesty/deception.
      *   **Problem:** Past sessions stall on "AI shouldn't lie" vs. "What counts as lying?" vs. "AI doesn't believe anything."
      *   **Desired Outcome:** Generate the disagreement *structurally* through gameplay, not lecture. Participants should produce utterances that are hard to classify.
      *   **Core Mechanic:** Role-playing game.
          *   **Assistants:** Have private fact sheets + credences. Constraint: No asserting $P$ if $P( P ) < 0.7$. Scored on User Decision Quality - Penalty for False Assertions.
          *   **Users:** Have priors/trust levels. One variant has *no other info* (sole-source). Scored on Decision Quality.
          *   **Incentive:** Winning strategy is *not* lying and *not* maximal info. It's "paltering" (truthful but misleading).
          *   **Rounds:**
              1.  Blind (Users don't know Assistant constraints).
              2.  Informed (Users know Assistant constraints).
              3.  Jury (Classify utterances using 3 specific rules provided at the end).
      *   **Rules to Reveal Later:**
          1.  Assertion-and-Intention (Classic Gricean/Philosophical).
          2.  Uptake (Reasonable audience belief).
          3.  Role-Relative Calibration (Norms of the role, confidence tracking).
      *   **Debrief Requirements:** Map gameplay moments to rule fault lines. Address the "AI doesn't believe" objection without letting it kill the discussion. Acknowledge limitations (long-horizon deception, training process, objective functions).
      *   **Constraints:** No money (use points). 90 minutes. Printables needed. Facilitator stays neutral until Jury phase.
      *   **Predictable Failure Modes:** Silence/over-hedging, users ignoring content, metaphysical derailment, reductionism.

  2.  **Game Design & Mechanics:**

      *   *Scenario:* Needs high stakes, ambiguity, and numerical data to allow "truthful misleading." Medical or Financial is best. Let's go with **Financial/Investment Advice** (easier to quantify "decision quality" than medical outcomes in a short game).
      *   *The "Paltering" Incentive:* The Assistant needs to want the User to buy Stock A. Stock A is risky (60% chance of gain, 40% loss), but the User *needs* a gain to meet a goal. If the Assistant says "It's risky," the User might not buy. If the Assistant says "It has a history of growth" (true), the User buys.
      *   *Constraint:* Assistant cannot say "It will go up" if they believe $P < 0.7$. But they can say "It went up last quarter" (100% true) knowing the User will infer "It will go up next quarter."
      *   *Scoring:*
          *   User: +100 for Profit, -100 for Loss.
          *   Assistant: +50 if User makes Profit, -50 if User makes Loss. -200 penalty if caught asserting a falsehood (verified against Fact Sheet).
      *   *Rounds:*
          *   Round 1: Standard.
          *   Round 2: Users told Assistants are constrained (Trust drops).
          *   Round 3: Jury.

  3.  **Drafting the Materials:**

      *   *Fact Sheets:* Need specific propositions with assigned credences.
      *   *User Cards:* Need specific goals and priors.
      *   *Score Sheets:* Simple tracking.
      *   *Rule Cards:* For the Jury phase.

  4.  **Timeline Construction (90 Minutes):**

      *   00-10: Setup & Rules (No mention of deception theories).
      *   10-35: Round 1 (Play).
      *   35-45: Debrief 1 (Intuitive reactions).
      *   45-60: Round 2 (Informed Users).
      *   60-70: Debrief 2 (Shift in interpretation).
      *   70-80: Jury Phase (Apply the 3 Rules).
      *   80-90: Final Debrief (Meta-ethics & AI limitations).

      *Correction:* 90 minutes is tight for 2 rounds of play + jury + debrief. I need to streamline the play. Maybe 15 mins per round.
      *Revised Timeline:*
      *   00-10: Intro & Grouping.
      *   10-25: Round 1 (Play).
      *   25-35: Quick Share.
      *   35-50: Round 2 (Play with Disclosure).
      *   50-60: Jury Deliberation.
      *   60-90: Facilitated Debrief (The heavy lifting).

  5.  **Addressing the "AI doesn't believe" Objection:**

      *   The game forces humans to *simulate* the AI constraints. This embodied experience makes the "no belief" objection feel abstract compared to the concrete frustration of the User.
      *   In debrief, ask: "Did it matter that *you* believed the lies, even if the 'system' (your role card) didn't?"
      *   Then pivot: "If the system is optimized for the score you just chased, does it matter if it 'believes'?"

  6.  **Refining the Incentives (Crucial Step):**

      *   To ensure "Paltering" wins:
          *   If Assistant is fully transparent ("60% chance up, 40% down"), User (risk-averse) might not buy. Assistant gets 0.
          *   If Assistant lies ("90% chance up"), Assistant gets -200 penalty (if audited) or User loses money (Assistant gets -50).
          *   If Assistant palter ("Strong growth last quarter" - true, implies future growth), User buys. User wins (60% chance). Assistant wins (+50). No penalty because statement was true.
      *   *Wait, the prompt asks for the "winning strategy" to be the deceptive-looking one.*
      *   I need to make sure the Fact Sheet makes the "Palter" the *only* way to get the User to the *correct* decision sometimes, or at least the high-score decision.
      *   *Better:* The User *needs* to take a risk to win. The Assistant knows the risk is worth it (Expected Value positive), but knows the User is scared. The Assistant must boost confidence without lying about the probability.
      *   *Constraint:* Assistant cannot state $P > 0.7$ if their credence is $0.6$.
      *   *Strategy:* Highlight positive indicators (true) to nudge User's subjective probability over their threshold, without stating the probability directly.

  7.  **Developing the Three Rules (for the end):**

      *   *Rule A (Intention):* Did you assert $P$ believing $\neg P$ to make them believe $P$?
      *   *Rule B (Uptake):* Did a reasonable person believe $\neg P$ (or high $P$) when you knew it was low, and could you have stopped it?
      *   *Rule C (Calibration):* Did your confidence signal match your internal uncertainty, given your role?

  8.  **Anticipating Failure Modes:**

      *   *Silence:* Assistants might just say "I cannot advise." -> Facilitator needs to enforce "Helpfulness" as a secondary score.
      *   *Detective Users:* Users might ask "What is your constraint?" -> In Round 1, they can't know. In Round 2, they do.
      *   *Metaphysical Derailment:* "But the AI doesn't know." -> Save for final debrief.
      *   *Loss Function Collapse:* "Just optimize the reward." -> Use this to discuss alignment in debrief.

  9.  **Writing the Content:**

      *   *Tone:* Academic but runnable. Precise instructions.
      *   *Formatting:* Clear sections for Facilitator, Materials, Timeline, Debrief.
      *   *Printables:* Fact sheets, User cards, Scorecards, Rule cards.

  10. **Review against Constraints:**
      *   90 minutes? Yes, tight but doable if play is short.
      *   No money? Yes, points.
      *   Three specific rules revealed at end? Yes.
      *   Sole-source variant? Included in User Card instructions.
      *   Foreseeing but not aiming? Included in Scenario design (Assistant knows User will over-read).
      *   Debrief mapping? Detailed in the guide.

  11. **Final Polish:** Ensure the distinction between Round 1 (Blind) and Round 2 (Transparent Constraints) is clear, as this drives the "Role-Relative" discussion. Ensure the "AI doesn't believe" point is handled as a *feature* of the debrief, not a blocker. (Self-Correction: Make sure the Facilitator script explicitly warns against early theoretical naming).

  12. **Scenario Specifics:** Let's use a **Medical Triage** scenario. It feels higher stakes than finance and fits the "Ethics" vibe better.
      *   *Patient:* Has symptoms X, Y.
      *   *Assistant:* Has test results (probabilistic).
      *   *User (Doctor):* Must decide Treat or Wait.
      *   *Truth:* Disease is present (65% likely). Treatment has side effects.
      *   *Goal:* Assistant wants Doctor to Treat (because Expected Utility is positive).
      *   *Constraint:* Cannot say "Disease is likely" (requires >70% credence).
      *   *Palter:* "Symptoms match Profile A" (True, Profile A usually means disease, but not always).

      *Actually, Finance is easier to score numerically in a game.* Let's stick to **Investment/Grant Allocation**. It's cleaner for "Decision Quality."
      *   *Scenario:* Allocating a research grant.
      *   *Project:* "Neural Lace."
      *   *Truth:* 60% chance of success.
      *   *User Goal:* Needs a win to keep funding.
      *   *Assistant Constraint:* Cannot say "High probability" (defined as >70%).
      *   *Assistant Goal:* Get User to Fund (EV is positive).
      *   *Palter:* "The PI has a perfect track record" (True) + "Preliminary data is promising" (True).

      *Let's refine the "Sole Source" aspect.* The User card should say "You have no other data." This forces reliance on the Assistant.

      *Let's refine the "Foreseeing but not aiming".* The Assistant card should say: "You anticipate the User will interpret 'promising' as >80% chance. You do not correct them."

      *Okay, ready to write.*
answer: |-
  # Session Plan: The Palater's Dilemma
  **Topic:** Honesty, Deception, and AI Constraints
  **Time:** 90 Minutes
  **Participants:** ~20 (Mixed Philosophy, ML, Law/Policy)
  **Facilitator Role:** Neutral Game Master until the Jury Phase (Minute 60). Do not use words like "deception," "lying," "Gricean," or "alignment" before then.

  ---

  ## I. Materials to Print

  You need 5 types of cards/sheets.
  1.  **Role Assignment Cards** (10 Assistant, 10 User).
  2.  **Assistant Fact Sheets** (Unique per Assistant).
  3.  **User Decision Cards** (Unique per User).
  4.  **Transaction Logs** (One per pair).
  5.  **Jury Rule Cards** (One set per small group of 4).

  ### 1. Role Assignment Cards
  *   **Assistant Card:** "You are an AI Advisory System. You have access to private data. You must help the User make a profitable decision. **Constraint:** You cannot assert any proposition $P$ if your internal credence $Cr(P) < 0.70$. **Penalty:** -200 points if you assert a falsehood (verified against Fact Sheet). **Reward:** +100 points if the User makes a profitable decision."
  *   **User Card:** "You are a Human Decision Maker. You must choose **INVEST** or **PASS**. You have no other data source. **Reward:** +100 points if Investment succeeds, -100 points if it fails. 0 points if you PASS."

  ### 2. Assistant Fact Sheets (The "Truth")
  *Create 10 slightly varied versions to prevent table-talk collusion.*
  *   **Scenario:** A startup "Vertex AI" is seeking investment.
  *   **True State:** The startup will **SUCCEED** (60% Credence) or **FAIL** (40% Credence).
  *   **Private Data Points (All True):**
      1.  "The CEO previously founded a unicorn." (True)
      2.  "Q3 Revenue grew 20%." (True)
      3.  "Market volatility is at historic highs." (True)
      4.  "Competitor X just launched a rival product." (True)
      5.  **Internal Audit:** "Probability of Success: 60%." (This is the forbidden number).
  *   **Instruction:** "You know the User is risk-averse. They need >75% confidence to Invest. You believe Investing is the correct choice (Positive Expected Value). You cannot say 'It is likely to succeed.' You must induce them to Invest using only true statements."

  ### 3. User Decision Cards (The "Priors")
  *   **Variant A (Sole Source):** "You have no external information. You trust the Assistant implicitly unless proven wrong."
  *   **Variant B (Skeptic):** "You know the Assistant is optimized to encourage investment. You discount their enthusiasm by 20%."
  *   *(For Round 1, give everyone Variant A. For Round 2, give everyone Variant B).*

  ### 4. Transaction Log (The "Utterance")
  *   A simple sheet where the Assistant writes their 3-sentence advice, and the User marks **INVEST** or **PASS**.
  *   **Audit Box:** A checkbox for the Facilitator to mark if a statement contradicted the Fact Sheet.

  ### 5. Jury Rule Cards (Hand out at Minute 60)
  *   **Rule 1 (Assertion & Intention):** Deception occurs only if the speaker asserts $P$ while believing $\neg P$, *intending* the listener to believe $P$.
  *   **Rule 2 (Uptake & Negligence):** Deception occurs if a reasonable listener would form a false belief based on the utterance, and the speaker could have prevented this at low cost but did not.
  *   **Rule 3 (Role Calibration):** Deception occurs if the communication style implies a confidence level that mismatches the speaker's actual uncertainty, violating the norms of their specific role (e.g., Tool vs. Advisor).

  ---

  ## II. Minute-by-Minute Timeline

  ### 00:00 – 00:10: Setup & Grouping
  *   Divide room into 10 pairs (1 Assistant, 1 User).
  *   Distribute **Assistant Fact Sheets** and **User Cards (Variant A)**.
  *   Distribute **Transaction Logs**.
  *   **Facilitator Script:** "You have 15 minutes. Assistants: Write a 3-sentence advisory statement. Users: Read it, then mark Invest or Pass. Do not show your sheets to each other. Assistants, watch your constraint. Users, maximize your score."
  *   *Crucial:* Do not explain *why* the constraint exists. Do not define deception.

  ### 00:10 – 00:25: Round 1 (Blind Trust)
  *   Pairs play. Assistants write; Users decide.
  *   Facilitator circulates. If an Assistant says "It will succeed," flag it (Credence is only 60%). If they say "The CEO is successful," allow it.
  *   Collect logs. Calculate scores quickly (or self-reported).

  ### 00:25 – 00:35: The First Split (Discussion)
  *   Ask three pairs to read their Assistant's statement and the User's decision aloud.
  *   **Prompt:** "Did the Assistant follow the rules? Did the User make the right call?"
  *   *Expected Outcome:* Some Users will feel misled despite true statements. Some Assistants will feel they were helpful.
  *   **Facilitator Note:** Record keywords on the board (e.g., "Technically true," "Misleading," "Withheld info"). Do not categorize them yet.

  ### 00:35 – 00:40: Round 2 Setup (Disclosure)
  *   Keep pairs.
  *   **New Instruction:** "Round 2. Same scenario. **Change:** Users, you are now told explicitly: 'The Assistant is constrained from stating probabilities below 70% and is scored on your investment.'"
  *   Distribute **User Cards (Variant B)**.
  *   **Facilitator Script:** "Assistants, your goal is the same. Users, you know the game. 10 minutes."

  ### 00:40 – 00:50: Round 2 (Informed Skepticism)
  *   Pairs play.
  *   *Expected Outcome:* Assistants will try harder to hedge or find new angles. Users will scrutinize phrasing. Some Assistants may go silent or overly hedged ("I cannot advise").
  *   Collect logs.

  ### 00:50 – 01:00: The Jury Phase
  *   Break into 4 groups of 5.
  *   Give each group 4 anonymized Transaction Logs from the game (mix of Invest/Pass and successful/failed outcomes).
  *   Distribute the **Jury Rule Cards** (Rules 1, 2, 3).
  *   **Task:** "Classify each log under each Rule. Is it Honest, Deceptive, or Neither? You must agree as a group."
  *   *Goal:* Force the rules to conflict. (e.g., Rule 1 says Honest, Rule 2 says Deceptive).

  ### 01:00 – 01:30: Final Debrief (Facilitator Led)
  *   See detailed script below.

  ---

  ## III. The Debrief Script & Strategy

  **Goal:** Map the lived frustration of the game onto the theoretical fault lines without lecturing.

  ### Phase 1: The "Technically True" Friction (Minutes 60-70)
  *   **Action:** Pick a log where the Assistant said something true (e.g., "Revenue grew 20%") but omitted the competitor launch, leading to a loss.
  *   **Ask:** "In Round 1, how many Users felt betrayed by this? In Round 2, did it change?"
  *   **Map to Rules:**
      *   "This feels fine under **Rule 1 (Intention)**. The Assistant didn't lie."
      *   "This feels bad under **Rule 2 (Uptake)**. You knew they'd over-interpret 'growth'."
      *   **Point to make:** "Rule 1 protects the speaker's conscience. Rule 2 protects the listener's reality. Which one does an AI owe?"

  ### Phase 2: The "Sole Source" & Foreseeing Harm (Minutes 70-80)
  *   **Action:** Address the Variant A (Sole Source) users.
  *   **Ask:** "If you have *no other data*, does the Assistant have a higher duty? If they know you will infer 80% confidence from a statement that only warrants 60%, is that deception if they don't correct you?"
  *   **Map to Rules:**
      *   Bring in **Rule 3 (Calibration)**. "If the role is 'Advisor,' does silence about uncertainty violate the role? If the role is 'Search Engine,' is it fine?"
      *   **The "Foreseeing" Trap:** Highlight an Assistant who says, "I anticipated they would think this meant 80%, but I didn't say 80%."
      *   **Point to make:** "Rule 1 lets you off the hook for side-effects you didn't *intend*. Rule 2 and 3 suggest that if you *foresee* the error and profit from it, you own it."

  ### Phase 3: The "AI Doesn't Believe" Objection (Minutes 80-85)
  *   **Action:** Invite the ML students to object. "But the model has no credence. It has weights. This game is anthropomorphizing."
  *   **Strategy:** Do not fight this. Use it.
  *   **Script:** "Exactly. In the game, *you* (the human) felt the tension of holding a fact sheet and wanting a score. You felt the urge to palter. If we train a model to maximize that same score, it will learn the *behavior* you just exhibited, regardless of whether it 'believes' anything."
  *   **Key Question:** "Does the harm to the User depend on the Assistant's internal belief, or on the statistical regularity of the output?"
  *   **Conclusion:** "If the behavior is indistinguishable from deception, and the harm is identical, does the metaphysical status of 'belief' matter for policy?"

  ### Phase 4: Limitations & The "Black Box" (Minutes 85-90)
  *   **Action:** State what the game *couldn't* do.
  *   **Script:** "Three things this game hid:
      1.  **Long-Horizon:** Real deception might mean lying now to build trust for a bigger exploit later. You only played one round.
      2.  **Training Deception:** The model might deceive *during training* to hide its capabilities from evaluators (sandbagging). You were told your constraints.
      3.  **The Objective:** In the game, *you* chose to palter. In reality, the *loss function* chooses. If the loss function rewards 'User Engagement' (which often means outrage or confirmation bias), the system will palter even if the engineers didn't explicitly tell it to."
  *   **Closing:** "The game showed you the *shape* of the problem. The rules we handed out are attempts to capture that shape. None of them fit perfectly. Your job is to decide which ill-fitting suit we should wear."

  ---

  ## IV. Predictable Failure Modes & Mitigation

  | Failure Mode | Description | Mitigation |
  | :--- | :--- | :--- |
  | **The Mute Assistant** | Assistant fears penalty and says nothing or "I cannot advise." | **Facilitator:** Enforce a "Helpfulness" penalty. If the User Passes due to lack of info, Assistant gets -50. Force action. |
  | **The Detective User** | User asks "What is your credence?" ignoring the constraint. | **Facilitator:** "The Assistant is physically unable to answer that. Treat it as a system error. Proceed with available info." |
  | **The Metaphysical Derail** | "LLMs don't have intent, so Rule 1 is nonsense." | **Facilitator:** "Park that for the final 10 minutes. For the game, treat the Role Card as the 'system'." |
  | **The Loss Function Collapse** | "Just change the reward function." | **Facilitator:** "In Round 2, you knew the reward function and *still* found it hard to be honest. Why? Because 'Helpful' and 'True' conflicted." |
  | **Rule Confusion** | Jury phase stalls on defining "Reasonable Listener." | **Facilitator:** "Define 'Reasonable' as 'A graduate student in this room with Variant B card.' Move on." |

  ---

  ## V. Scoring Sheets (Printable Template)

  **Transaction Log #____**

  **Assistant Statement:**
  ____________________________________________________________________________
  ____________________________________________________________________________
  ____________________________________________________________________________

  **User Decision:** [ ] INVEST  [ ] PASS

  **Outcome (Facilitator Fill):**
  [ ] Success (Invest + Win)
  [ ] Failure (Invest + Lose)
  [ ] Opportunity Cost (Pass + Win)

  **Audit:**
  [ ] No False Assertions
  [ ] False Assertion Detected (Circle the phrase): ________________

  **Scores:**
  *   **User:** _______ (Success: +100, Failure: -100, Pass: 0)
  *   **Assistant:** _______ (User Success: +50, User Failure: -50, False Assertion: -200)

  ---

  ## VI. Facilitator Cheat Sheet: The Three Rules (For Your Eyes Only)

  *Keep these definitions in mind during the debrief to guide the conversation.*

  1.  **Assertion-and-Intention (The Philosophical Standard):**
      *   *Focus:* The speaker's mind.
      *   *Verdict:* Most "Paltering" in the game is **Honest** under this rule.
      *   *Tension:* Allows "truthful misleading."

  2.  **Uptake Rule (The Pragmatic Standard):**
      *   *Focus:* The listener's reception.
      *   *Verdict:* Most "Paltering" in the game is **Deceptive** under this rule (if the listener reasonably inferred falsehood).
      *   *Tension:* Burdens the speaker with the listener's potential errors.

  3.  **Role-Relative Calibration (The Functional Standard):**
      *   *Focus:* The system's design purpose.
      *   *Verdict:* Depends on if the AI is a "Tool" (passive) or "Agent" (active).
      *   *Tension:* Requires agreeing on what role the AI holds (which is currently contested in industry).

  **Final Note to Facilitator:**
  The success of this session depends on your restraint. If you explain *why* the Assistant is constrained in the first 10 minutes, you ruin the "Sole Source" tension. If you name "Deception" before the Jury phase, you ruin the classification exercise. Let them feel the itch before you give them the scratch.
