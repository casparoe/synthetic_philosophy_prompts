answer: |-
  ### Stage 1: Brainstorm

  Here are the claims in your message that are false, ill-defined, or rest on hidden assumptions:

  1.  **Claim:** "Dominance doesn't care whether the game is repeated... at each round I do better by defecting."
      *   **Status:** **False.** This conflates *move-wise* dominance with *strategy-wise* dominance. In a repeated game, my move today influences my opponent's move tomorrow. Maximizing the sum of payoffs (fitness) often requires sacrificing stage-game dominance to manipulate future opponent behavior.
  2.  **Claim:** "A single mutant Tit-for-Tat beetle appearing in an all-defect population should be able to increase."
      *   **Status:** **False.** This is the critical failure point. In a well-mixed population, a lone cooperator meets defectors. It gets the "sucker's payoff" once, then mutual defection forever. Its fitness is identical to (or lower than) the resident defectors. Selection cannot increase its frequency from a single mutant.
  3.  **Claim:** "The 'kindling frequency'... is effectively zero."
      *   **Status:** **False.** Because a single mutant cannot invade, there is a non-zero critical frequency (basin of attraction) required before selection favors cooperation over defection.
  4.  **Claim:** "Kin selection, spatial viscosity, and group selection then look like rival explanations of the same phenomenon... once we know that pairs last long enough, they do no independent work."
      *   **Status:** **False.** "Shadow of the future" (high continuation probability) stabilizes cooperation *given* that cooperators meet cooperators. "Assortment" (kin/structure) ensures cooperators *meet* cooperators. They are distinct parameters in the evolutionary equation. One creates the incentive; the other creates the opportunity.
  5.  **Claim:** "0.8 as the relevant continuation probability."
      *   **Status:** **False.** You ignored the death rate. If either beetle dies, the interaction ends. The effective continuation probability is the probability of staying together *and* both surviving.

  **Most Damaging Claim:** **Claim 2.** Your entire reduction collapses here. You assume that because TFT is stable *once resident* (an ESS against invasion), it must also be able to *invade* from rarity. In evolutionary game theory, these are distinct conditions. TFT is stable against ALLD, but it cannot invade ALLD in a well-mixed population. This error leads directly to your false conclusion about kindling frequency and the redundancy of assortment.

  ---

  ### Stage 2: Substance

  Let's walk through the mechanics of your argument, step by step, and locate the break.

  #### Step (1): One-Shot Dominance
  **Verdict:** **Correct.**
  In a single round, $T > R$ and $P > S$. Defection yields a higher payoff regardless of the opponent's move. This is the definition of the Prisoner's Dilemma. No issue here.

  #### Step (2): Dominance in Repeated Games
  **Verdict:** **Incorrect Reasoning.**
  You argue: "At each round I do better by defecting... so 'always defect' should still be the fitness-maximising policy."
  **The Break:** Fitness is not the sum of round-by-round maxima; it is the maximum of the sum.
  In a repeated game, strategies are conditional. If I play $C$ now, I may cause you to play $C$ next round. If I play $D$ now, I cause you to play $D$ next round.
  Let $\delta$ be the effective continuation probability. The value of a strategy is the discounted sum of payoffs: $V = \sum_{t=0}^{\infty} \delta^t \pi_t$.
  If I play **Always Defect (ALLD)** against **Tit-for-Tat (TFT)**:
  *   Round 1: I get $T$ (5), you get $S$ (0).
  *   Round 2+: You retaliate. We both play $D$. I get $P$ (1) forever.
  *   Total: $5 + \frac{\delta}{1-\delta}(1)$.

  If I play **TFT** against **TFT**:
  *   Round 1+: We both play $C$. I get $R$ (3) forever.
  *   Total: $\frac{1}{1-\delta}(3)$.

  I should cooperate if $\frac{3}{1-\delta} > 5 + \frac{\delta}{1-\delta}$.
  Multiply by $(1-\delta)$: $3 > 5(1-\delta) + \delta \Rightarrow 3 > 5 - 5\delta + \delta \Rightarrow 4\delta > 2 \Rightarrow \delta > 0.5$.
  **Mechanic:** Round-by-round dominance is irrelevant because the "price" of defecting today is the loss of cooperation tomorrow. Your reasoning ignores the *causal link* between my move and your future move.

  #### Step (3): The Stability Condition
  **Verdict:** **Correct Calculation, Ambiguous Application.**
  The inequality $\delta > \frac{T-R}{T-P}$ is the correct condition for TFT to be a **Nash Equilibrium** against ALLD (i.e., if everyone plays TFT, a mutant ALLD does worse).
  With your numbers: $(5-3)/(5-1) = 0.5$.
  However, you treat this as sufficient for cooperation to evolve. It is only sufficient for cooperation to *persist* if it already exists. It says nothing about whether TFT can *enter* a population of ALLD.

  #### Step (4): Invasion and Kindling Frequency
  **Verdict:** **False. This is where the argument breaks.**
  You claim: "A single mutant Tit-for-Tat beetle... should be able to increase."
  Let's calculate the fitness ($W$) of a rare TFT mutant in a population of ALLD.
  Assume the population is well-mixed (random pairing).
  *   **Resident (ALLD):** Almost always meets ALLD.
      *   $W(ALLD) \approx V(ALLD, ALLD) = \frac{P}{1-\delta} = \frac{1}{1-\delta}$.
  *   **Mutant (TFT):** Almost always meets ALLD.
      *   Round 1: TFT plays $C$, ALLD plays $D$. Payoff $S=0$.
      *   Round 2+: TFT plays $D$ (retaliation), ALLD plays $D$. Payoff $P=1$.
      *   $W(TFT) \approx S + \frac{\delta P}{1-\delta} = 0 + \frac{\delta}{1-\delta}$.

  **Comparison:**
  Is $W(TFT) > W(ALLD)$?
  $\frac{\delta}{1-\delta} > \frac{1}{1-\delta} \Rightarrow \delta > 1$.
  This is impossible. $\delta$ must be less than 1.
  **Result:** A single TFT mutant has *lower* fitness than the resident ALLD (because it suffers the sucker's payoff $S$ in round 1). Even if we ignore the one-off $S$ and assume they immediately defect, $W(TFT) = W(ALLD)$.
  **Conclusion:** Selection cannot increase the frequency of TFT from a single mutant. It is neutral at best, but usually disadvantageous due to the first-round loss.
  **Kindling Frequency:** For TFT to grow, it must meet other TFTs often enough to gain the $R$ payoff. There is a critical frequency $p^*$ where $W(TFT) = W(ALLD)$. Below $p^*$, ALLD wins. Above $p^*$, TFT wins. In a well-mixed population, $p^*$ is high.

  #### Step (5): Assortment vs. Shadow of the Future
  **Verdict:** **False.**
  You conclude that kin selection/structure do "no independent work" if $\delta$ is high.
  **Mechanic:** Evolution of cooperation requires two things:
  1.  **Incentive Compatibility:** The future must matter enough that I don't want to cheat you ($\delta > 0.5$). This is the "Shadow of the Future."
  2.  **Positive Assortment:** I must interact with you often enough that *my* cooperation benefits *my* genes (or copies of my strategy).
  In your model, $\delta$ handles #1. But without assortment, a cooperator meets a defector most of the time. Assortment (kin, viscosity) changes the probability of meeting a cooperator from $p$ (population frequency) to $p + r(1-p)$.
  **Plainly:** A long shadow of the future makes cooperation stable *between two cooperators*. It does not help a lone cooperator find another cooperator. Kin selection helps them find each other. They are multiplicative, not redundant.

  ---

  ### Addressing Your Specific Questions

  #### 1. The Actual Kindling Frequency
  You asked for the frequency derived from the matrix. Let $p$ be the frequency of TFT.
  Fitness of TFT: $W_{TFT} = p \cdot V(TFT, TFT) + (1-p) \cdot V(TFT, ALLD)$
  Fitness of ALLD: $W_{ALLD} = p \cdot V(ALLD, TFT) + (1-p) \cdot V(ALLD, ALLD)$

  Using the payoffs ($T=5, R=3, P=1, S=0$) and effective $\delta$ (let's use 0.8 for simplicity first, then correct it):
  *   $V(TFT, TFT) = 3 / (1-\delta)$
  *   $V(ALLD, ALLD) = 1 / (1-\delta)$
  *   $V(TFT, ALLD) = 0 + \delta(1)/(1-\delta)$ (Sucker then Punishment)
  *   $V(ALLD, TFT) = 5 + \delta(1)/(1-\delta)$ (Temptation then Punishment)

  Set $W_{TFT} > W_{ALLD}$:
  $p \frac{3}{1-\delta} + (1-p) \frac{\delta}{1-\delta} > p \left(5 + \frac{\delta}{1-\delta}\right) + (1-p) \frac{1}{1-\delta}$

  Multiply by $(1-\delta)$:
  $3p + \delta(1-p) > 5p(1-\delta) + \delta p + (1-p)$
  $3p + \delta - \delta p > 5p - 5p\delta + \delta p + 1 - p$
  $3p + \delta - \delta p > 4p - 5p\delta + \delta p + 1$
  Cancel $\delta p$:
  $3p + \delta > 4p - 5p\delta + 1$
  Rearrange to solve for $p$:
  $5p\delta - p > 1 - \delta$
  $p(5\delta - 1) > 1 - \delta$
  $p > \frac{1 - \delta}{5\delta - 1}$

  Using your TA's $\delta = 0.8$:
  $p > \frac{0.2}{4 - 1} = \frac{0.2}{3} \approx 0.067$.
  **Answer:** In this specific arithmetic, you need about **6.7%** of the population to be TFT *before* selection favors TFT over ALLD. Below this, ALLD drives TFT to extinction. Above this, TFT drives ALLD to extinction.
  **Correction:** This assumes $\delta=0.8$. As we will see in "Loose End 2", the real $\delta$ is lower, which raises this frequency significantly. If $\delta$ drops below 0.5, the denominator becomes negative or the inequality flips, meaning TFT can *never* invade regardless of frequency (the basin of attraction disappears).

  #### 2. Assortment vs. Shadow of the Future
  **Straight Answer:** Positive assortment is doing work that the shadow of the future *cannot* do.
  *   **Shadow of the Future ($\delta$):** Determines if cooperation is a *stable equilibrium* once established. (Prevents invasion by defectors).
  *   **Assortment ($r$):** Determines if cooperation is an *invadable state* from rarity. (Allows invasion of defectors).
  You can have a very high $\delta$ (immortal beetles) but random pairing. A single cooperator will still meet defectors, get exploited, and die out. You need assortment to get the cooperator over the "kindling frequency" hump. Once over the hump, $\delta$ keeps them there. They are distinct mechanisms.

  #### 3. Does a Weakened Version of (5) Survive?
  **Verdict:** **No.**
  Claim (5) says other mechanisms "do no independent work." This is false. Even if $\delta$ is high, without assortment, the system stays at the ALLD equilibrium because the "kindling frequency" cannot be reached by selection from a single mutant. Assortment lowers the kindling frequency. In the limit of perfect assortment (clones), the kindling frequency approaches zero. Thus, assortment is doing the work of enabling invasion.

  #### 4. Conventions on Fitness
  **Flag:** Yes, this depends on convention.
  *   **Undiscounted Sum:** If beetles are immortal and care about total offspring, we sum payoffs. This requires $\delta < 1$ for the sum to converge.
  *   **Average Per Round:** If we measure fitness as rate of return, the math is similar but normalization differs.
  *   **Biological Fitness:** Usually expected number of offspring. In your model, "fitter strategies more likely to be copied" implies payoff maps to reproductive rate. The standard convention in EGT is the **discounted sum** ($\sum \delta^t \pi_t$), which treats the continuation probability as a discount rate. Your arithmetic holds under this standard convention.

