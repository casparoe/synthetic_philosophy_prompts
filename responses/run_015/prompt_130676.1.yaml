  4.  **Source of Harm:** Is the driver of bad outcomes human intent (misuse), economic/competitive pressure (structural), or system autonomy (misalignment)?
  5.  **Multipolarity:** Is power held by a single entity/system or distributed among many competitors?
  6.  **Recoverability:** Once power shifts or control is lost, is the state reversible or locked-in?
  7.  **Value Stability:** If control is maintained, do values stabilize around something "wrong" or undesirable?

