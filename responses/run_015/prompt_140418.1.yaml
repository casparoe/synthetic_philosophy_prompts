answer: |-
  ### Part I: Brainstorming and Winnowing

  Before settling on the specification, I need to cast a wide net. A theory of vagueness can be evaluated on metaphysical, semantic, logical, psychological, and pragmatic grounds. Given your purpose (regulatory drafting and inspection), many standard philosophical demands are irrelevant, while some practical demands are usually ignored by philosophers.

  **The Long Candidate List:**
  1.  **Sorites Resolution:** Must block the paradox.
  2.  **Classical Logic Preservation:** Must not require changing *modus ponens* or bivalence.
  3.  **Truth-Conditionality:** Must explain what makes a vague sentence true.
  4.  **Psychological Plausibility:** Must match how humans actually process borderline cases (reaction times, hesitation).
  5.  **Acquisition Explanation:** Must explain how children learn vague terms without sharp boundaries.
  6.  **Metaphysical Neutrality:** Must not commit to vague objects in the world (ontic vagueness).
  7.  **Compositionality:** Must explain how vague words combine (e.g., "very tall man").
  8.  **Higher-Order Vagueness:** Must explain why the boundary itself is fuzzy, not just hidden.
  9.  **Context Sensitivity:** Must explain how "tall" changes in a basketball court vs. a kindergarten.
  10. **Multidimensionality:** Must handle terms like "healthy" or "excessive" that rely on multiple scales.
  11. **Ambiguity Distinction:** Must separate vagueness from polysemy (e.g., "bank").
  12. **Generality Distinction:** Must separate vagueness from broad categorization (e.g., "vehicle").
  13. **Epistemic Accessibility:** Must explain why we can't know the boundary even with perfect information.
  14. **Faultless Disagreement:** Must account for the intuition that two speakers can disagree without error.
  15. **Precisification:** Must allow for stipulative sharpening without changing the subject.
  16. **Decision Procedure:** Must tell an agent what to *do* in a borderline case.
  17. **Authority/Legitimacy:** Must explain who has the right to sharpen a term (legislator vs. inspector).
  18. **Dynamic Update:** Must explain if using a term in a borderline case shifts the boundary for future cases.
  19. **Comparative Sorites:** Must handle "one grain less" as well as "is a heap."
  20. **Negation Behavior:** Must explain why "not tall" isn't always "short."

  **The Winnowing Process:**
  *   *Discarded:* **Acquisition Explanation.** Irrelevant to applying existing regulations. **Psychological Plausibility.** While interesting, a normative theory for inspectors doesn't need to model reaction times. **Metaphysical Neutrality.** As long as the theory doesn't force you to believe regulations are physically vague objects, it's fine. **Compositionality.** Unless it breaks the logic of compound rules, this is too technical for your needs. **Dynamic Update.** While real, regulatory drafting usually assumes static meaning during the enforcement period to ensure stability.
  *   *Merged:* **Context Sensitivity** and **Generality Distinction** are folded into **Vagueness vs. Neighbours**. **Comparative Sorites** is folded into **The Sorites**.
  *   *Added:* **Action Guidance.** Standard semantic theories describe truth; you need a theory that licenses *action* under indeterminacy. **Authority.** In law, the power to precisify is political, not just semantic.

  ***

  ### Part II: The Specification for Regulatory Adequacy

  Here is the winnowed specification. Each entry includes the motivating case, the requirement, and its status.

  **1. The Sorites Constraint**
  *   **Motivating Case:** The "Heap" paradox applied to "Significant Delay." If 1 minute is not significant, and adding 1 minute never makes it significant, no delay is significant. Yet, a 10-year delay is.
  *   **Requirement:** The theory must identify the precise failure point (a false premise, invalid inference, or equivocation) and explain why the argument remains psychologically compelling despite the failure. It cannot simply dismiss the intuition.
  *   **Status:** **Non-negotiable.** A theory that dissolves the paradox by denying the data (e.g., claiming 10 years *isn't* significant) is useless for drafting.

  **2. The Multidimensional Borderline**
  *   **Motivating Case:** "Excessive Concentration." This is not a linear scale like height. It involves market share, barriers to entry, and consumer choice. There is no single "Sorites series" to run.
  *   **Requirement:** The theory must account for borderlines that arise from conflicting dimensions or cluster concepts, not just linear gradability. It must explain why a case can be borderline even when all measurements are precise.
  *   **Status:** **Non-negotiable.** Most regulatory terms are multidimensional; a theory limited to linear sorites (like "tall") covers too little ground.

  **3. The Discrimination Test (Vagueness vs. Neighbours)**
  *   **Motivating Case:** Is "vehicle" vague or general? Is "bank" ambiguous or vague? Is "significant" context-sensitive or vague? An inspector needs to know if they should look for context clues (indexicality), legislative intent (ambiguity), or exercise judgment (vagueness).
  *   **Requirement:** The theory must provide a diagnostic test to distinguish vagueness from ambiguity, generality, and pure context-dependence. It must specify which of these can be treated as vagueness for the purpose of enforcement discretion.
  *   **Status:** **Non-negotiable.** Misdiagnosing ambiguity as vagueness leads to arbitrary enforcement; misdiagnosing vagueness as ignorance leads to futile searches for facts.

  **4. The Higher-Order Indeterminacy Condition**
  *   **Motivating Case:** If there is a sharp boundary between "significant" and "not significant" that we cannot know (Epistemicism), then there is a sharp boundary between "borderline" and "clear." But "borderline" also seems fuzzy.
  *   **Requirement:** The theory must explain the apparent lack of edges around the borderline region itself. It must account for the intuition that the boundary is not just hidden, but semantically unsettled.
  *   **Status:** **Non-negotiable.** If the theory posits a sharp boundary (even an unknowable one), it undermines the inspector's confidence that their discretion is legitimate rather than error-prone.

  **5. The Disagreement Accommodation**
  *   **Motivating Case:** Inspector A says "This concentration is excessive." Inspector B says "It is not." Both know the facts. Both are competent. In court, one loses, but semantically, neither seems to have made a *mistake* about the language.
  *   **Requirement:** The theory must explain the phenomenology of faultless disagreement without necessarily committing the legal system to accepting both outcomes. It must distinguish semantic faultlessness from institutional decisiveness.
  *   **Status:** **Negotiable.** It is preferable if the theory vindicates the feeling of faultlessness, but a theory that explains why one party *must* be wrong (e.g., Epistemicism) is acceptable if it provides a clear decision rule.

  **6. The Measurement Independence Clause**
  *   **Motivating Case:** "Significant Delay" (time is measurable) vs. "Unreasonable Restraint" (economic concept, not directly measurable).
  *   **Requirement:** The theory must apply uniformly to vagueness arising from inexact measurement and vagueness arising from qualitative judgment. It cannot treat "borderline" as merely "measurement error."
  *   **Status:** **Non-negotiable.** Regulatory language mixes quantitative and qualitative thresholds; the theory of meaning must cover both.

  **7. The Precisification License**
  *   **Motivating Case:** An inspector decides, "For this inquiry, 'significant' means >24 hours," and proceeds.
  *   **Requirement:** The theory must explain how a speaker can voluntarily impose a sharp cutoff without lying or changing the subject. It must validate the move from indeterminate to determinate for the sake of action.
  *   **Status:** **Non-negotiable.** This is the core of regulatory application. If the theory says sharpening is impossible or illegitimate, it fails the user's purpose.

  **8. The Action-Guidance Requirement (New)**
  *   **Motivating Case:** The inspector stands before a borderline case. The file must be closed. A decision is mandatory.
  *   **Requirement:** The theory must bridge the gap between semantic indeterminacy and mandatory binary decision. It must offer a normative account of what licenses the inspector to decide one way or the other when semantics underdetermines the outcome.
  *   **Status:** **Non-negotiable.** Pure semantics describes; regulation prescribes. A theory that leaves the inspector paralyzed by truth-gaps is inadequate.

  ***

  ### Part III: Incompatibilities and Trade-offs

  **The Incompatible Subset:**
  You cannot jointly satisfy **The Higher-Order Indeterminacy Condition**, **The Sorites Constraint (via Classical Logic)**, and **The Action-Guidance Requirement (via Bivalence)** without cost.
  *   If you keep Classical Logic and Bivalence (required for clear legal liability), you are pushed toward **Epistemicism** (there is a sharp line). This violates Higher-Order Indeterminacy (the boundary becomes sharp).
  *   If you keep Higher-Order Indeterminacy and Sorites Resolution, you usually move to **Supervaluationism** or **Degree Theory**. This violates strict Bivalence (some cases are neither true nor false, or partially true), which complicates Action-Guidance (how to act on a truth-value gap?).

  **The Concession:**
  I recommend sacrificing **Semantic Bivalence** to save **Higher-Order Indeterminacy** and **Action-Guidance**.
  *   *Why:* Acknowledge that semantically, the proposition "This is excessive" may lack a classical truth value in the borderline zone. However, satisfy Action-Guidance by locating the *authority to decide* in the institutional role of the inspector, not in the semantic content of the word. The theory should treat the inspector's decision as a *precisification* that resolves the gap pragmatically, not semantically. This buys you a realistic picture of the language while empowering the regulator to act.

  **The Most Exclusionary Requirement:**
  **The Action-Guidance Requirement.**
  Most philosophical theories of vagueness (Supervaluationism, Degree Theory, Contextualism) are purely descriptive semantics. They explain truth conditions, not decision procedures under indeterminacy. They often conclude that in a borderline case, there is "no fact of the matter." For a regulator, "no fact of the matter" is an administrative failure. A theory that cannot explain how to legitimately convert indeterminacy into a binary ruling is excluded by this requirement.

  ***

  ### Part IV: Status of Major Theories

  **Ignorance View (Epistemicism):**
  It satisfies the Sorites and Action-Guidance by preserving classical logic and bivalence, but it fails the Higher-Order Indeterminacy Condition by insisting sharp boundaries exist even if unknowable.

  **Supervaluationism:**
  It satisfies the Sorites and Higher-Order Indeterminacy by allowing truth-value gaps, but it struggles with the Action-Guidance Requirement because it offers no semantic basis for choosing between admissible precisifications in a specific case.

  **Degree-Theoretic/Contextualist Accounts:**
  They satisfy the Multidimensional Borderline and Higher-Order Indeterminacy by modeling gradability or context-shifts, but they fail the Sorites Constraint (by modifying logic) and complicate Action-Guidance by replacing binary liability with degrees of truth.
