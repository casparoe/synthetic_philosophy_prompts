prompt: |-
  You are a philosopher of language with research expertise on vagueness, gradability, and semantic indeterminacy. Think carefully before answering, and begin by brainstorming a long candidate list of demands on a theory of vagueness, then winnow it: I want to see what you considered and discarded, not only the final specification.

  Because adequacy is relative to a purpose, here is mine. I work on regulatory drafting: rules get written in ordinary vague language — significant delay, excessive concentration — and then have to be applied to real cases by inspectors who cannot appeal to a further rule. I want a theory of vagueness good enough to tell me what is going on when such a term is applied to a case that is neither clear nor clearly unclear, and, if a theory can, what the inspector ought to do there.

  So: write me the specification. What must a theory of vagueness deliver to count as adequate, with the case or consideration behind each entry? Cover these, and add to or subtract from the list as you judge right:

  - The sorites. The step premises look true, the reasoning looks valid, the conclusion is unacceptable: the theory must say where the failure is, and also why the argument is compelling rather than merely tempting.
  - Borderline cases with no sorites to run. Predicates like is a game or is a work of art have no ordering of cases on which to build the argument, so a theory engineered only to block the sorites may have nothing to say about most of the phenomenon.
  - Vagueness versus its neighbours: generality, ambiguity, indexical or comparison-class context-sensitivity, underspecification, and plain ignorance of a fact. Give a test that separates them, and say which of these a theory is permitted to lump together.
  - The apparent unknowability of the boundary even for a speaker who fully understands the word, and the fact that the borderline region itself seems to lack sharp edges.
  - Faultless disagreement: two competent speakers can seem to say conflicting things with neither at fault. Is vindicating that a requirement, or a preference of one camp?
  - Vagueness that is inherited from an inexact measurable quantity, as against vagueness that no measurement could settle even in principle. Must one theory cover both, and if you say yes, what does it cost?
  - Voluntary sharpening: speakers can stipulate a cut-off mid-exchange and then reason as though the indeterminacy had never been present.

  For each requirement give the motivating case and mark it non-negotiable or negotiable. Then flag any subset of your requirements that cannot be jointly satisfied, saying which one you would give up and what that concession buys; and say which single requirement excludes the most candidate theories. Close with one sentence each on how the ignorance view, supervaluationism, and degree-theoretic or contextualist accounts stand on the non-negotiables.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Role:** Philosopher of language (expertise: vagueness, gradability, semantic indeterminacy).
      *   **Task:** Create a specification for a theory of vagueness adequate for a specific purpose (regulatory drafting/inspection).
      *   **Process:** Brainstorm a long list of demands, then winnow it (show the work), then present the final specification with justifications (case/consideration + negotiable/non-negotiable status).
      *   **Specific Constraints:** Cover the provided list (Sorites, Non-sorites borderlines, Vagueness vs. Neighbours, Unknowability/Higher-order vagueness, Faultless Disagreement, Measurement-based vs. Principle-based, Voluntary Sharpening).
      *   **Additional Requirements:** Flag incompatible subsets (trade-offs), identify the most exclusionary requirement, and summarize three major theories (Ignorance, Supervaluationism, Degree/Contextualist) against the non-negotiables.
      *   **Tone:** Philosophical, rigorous, practical (given the user's context), reflective.

  2.  **Brainstorming Phase (The "Long Candidate List"):**
      *   *Initial thought:* What makes a theory of vagueness good?
      *   *Sorites:* Must solve the paradox. (Classic)
      *   *Borderlines:* Must explain why we hesitate.
      *   *Logic:* Must preserve classical logic? Or modify it?
      *   *Semantics:* Truth-conditional? Use-conditional?
      *   *Metaphysics:* Is the world vague or just language?
      *   *Psychology:* Why do we *feel* vagueness?
      *   *Normativity:* How should we act? (Crucial for the user).
      *   *Context:* How does context change boundaries?
      *   *Higher-order:* Is the boundary sharp?
      *   *Ambiguity:* Distinguish from "bank" (river/finance).
      *   *Generality:* Distinguish from "vehicle" (includes cars, trucks).
      *   *Epistemicism:* Is it just ignorance?
      *   *Supervaluation:* Truth gaps?
      *   *Degrees:* Truth values between 0 and 1?
      *   *Pragmatics:* Conversational implicature?
      *   *Decision Theory:* How to decide in the grey zone?
      *   *Legal/Regulatory:* Authority to precisify.
      *   *Communication:* Can we communicate despite vagueness?
      *   *Learning:* How do children learn vague terms?
      *   *Compositionality:* How do vague parts make vague wholes?
      *   *Comparatives:* "Taller than" vs "Tall".
      *   *Multidimensionality:* "Healthy" (weight, blood pressure, mental).
      *   *Dynamic:* Does usage change the meaning?

      *   *Winnowing for the User's Purpose:* The user is a regulatory drafter/inspector. They care about *application*, *authority*, *consistency*, and *explanation of the grey zone*. Theoretical purity matters less than practical guidance on *what is going on* and *what to do*.
      *   *Discard:* Learning acquisition (irrelevant to application), Compositionality (too technical unless it breaks rules), Metaphysics of the world (unless it impacts liability), Psychology of sensation (unless it impacts judgment).
      *   *Keep:* Sorites (logical consistency), Borderlines (the core problem), Distinctions (don't confuse vagueness with ambiguity), Unknowability (why can't I just look it up?), Faultless Disagreement (inspector vs. regulated entity), Measurement (objective vs. subjective), Sharpening (precisification in law).
      *   *Add:* Action-guidance (The "Ought"), Authority/Legitimacy (Who gets to sharpen?).

  3.  **Drafting the Specification (Iterative Process):**

      *   *Requirement 1: The Sorites.* Non-negotiable. If a theory can't handle the paradox, it's not a theory of vagueness. But for the regulator, the *solution* matters. If the solution says "there is a sharp line you just can't see" (Epistemicism), that helps the inspector (just pick one) but feels wrong. If it says "no truth value" (Supervaluation), that paralyzes decision.
      *   *Requirement 2: Non-Sorites Borderlines.* Non-negotiable. "Game" or "Excessive" isn't always a heap. Multidimensionality is key here.
      *   *Requirement 3: Neighbours.* Non-negotiable. Regulators confuse ambiguity ("bank") with vagueness ("large"). Need to distinguish to know if interpretation or stipulation is needed.
      *   *Requirement 4: Unknowability/Higher-Order.* Non-negotiable. Why can't the dictionary help? Why is the boundary fuzzy, not just hidden?
      *   *Requirement 5: Faultless Disagreement.* Negotiable. In law, someone usually loses. But *phenomenologically*, it feels faultless. A theory should explain the *feeling* even if the legal system resolves it.
      *   *Requirement 6: Measurement vs. Principle.* Non-negotiable. "100 decibels" vs "Excessive noise". Theory must handle both.
      *   *Requirement 7: Voluntary Sharpening.* Non-negotiable. This is *precisification*. Regulators do this all the time. The theory must validate this move without contradicting the original meaning.
      *   *Requirement 8: Action Guidance (New).* Non-negotiable. The user asked: "what the inspector ought to do." A purely descriptive semantic theory fails here. It needs a normative bridge.
      *   *Requirement 9: Logical Conservativity (New).* Negotiable. Do we keep Classical Logic? For regulation, we usually want Classical Logic (liability is binary), but the theory might need to relax it.

  4.  **Refining the Trade-offs (Incompatibilities):**
      *   *The Big Conflict:* Classical Logic + Truth-Functionality + Vagueness. You can't have all three easily.
      *   *Epistemicism:* Keeps Logic, keeps Bivalence, denies Vagueness (says it's ignorance).
      *   *Supervaluation:* Keeps Logic (mostly), denies Bivalence, keeps Vagueness.
      *   *Degree Theory:* Denies Classical Logic (bivalence), keeps Vagueness.
      *   *Contextualism:* Shifts the meaning.
      *   *For the Regulator:* They need a decision (Bivalence in outcome) but acknowledge the fuzziness.
      *   *Trade-off:* I will flag that "Preserving Classical Logic in the semantics" is incompatible with "Acknowledging genuine semantic indeterminacy." I will suggest sacrificing strict semantic bivalence for the sake of explaining the phenomenon, while retaining pragmatic bivalence for the decision.

  5.  **Selecting the "Most Exclusionary" Requirement:**
      *   Probably "Action Guidance" or "Higher-Order Vagueness."
      *   Actually, "Faultless Disagreement" kills Epistemicism (one person is right, one wrong).
      *   "Classical Logic" kills Degree Theory.
      *   Let's choose **The Action-Guidance Requirement**. Most semantic theories describe truth conditions, not decision procedures under indeterminacy. This excludes pure semantics.

  6.  **Evaluating the Three Theories:**
      *   *Ignorance (Epistemicism):* Fails Unknowability (says it's knowable in principle). Passes Logic.
      *   *Supervaluationism:* Passes Sorites (blocks validity). Fails Action Guidance (truth gaps = no decision).
      *   *Degree/Contextualist:* Passes Borderlines. Fails Classical Logic.

  7.  **Final Review against Constraints:**
      *   Did I show the brainstorming/winnowing? Yes.
      *   Did I cover the specific bullet points? Yes.
      *   Did I mark Negotiable/Non-negotiable? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I summarize the three theories? Yes.
      *   Is the tone right? Philosophical but practical.

  8.  **Writing the Response:** (Self-Correction during drafting)
      *   *Correction:* Make sure the "Action Guidance" isn't just "make a rule." It needs to be about the *status* of the decision in the grey zone.
      *   *Correction:* Ensure the distinction between "Excessive" (gradable) and "Game" (cluster concept) is clear in the Non-Sorites section.
      *   *Refinement:* In the trade-off section, be explicit about the "Logic vs. Semantics" tension.

  9.  **Final Polish:** Check the "One sentence each" constraint at the end. (Crucial constraint).

