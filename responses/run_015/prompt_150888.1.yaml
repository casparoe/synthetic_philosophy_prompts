      *   *Formal Approaches:*
          *   Logical Induction (MIRI): Handling self-reference without consistency crashes.
          *   Functional Decision Theory (FDT): Treating the agent as a subroutine.
          *   Cybernetics/Control Theory: Negative feedback loops create stability without needing a "view from nowhere."
          *   Predictive Processing (Friston): The agent minimizes surprise; the model *is* the control.
      *   *Philosophical Reframing:* Self-governance isn't about standing outside the system; it's about specific kinds of internal causal loops (recursion).

  4.  **Structuring the Argument:**

