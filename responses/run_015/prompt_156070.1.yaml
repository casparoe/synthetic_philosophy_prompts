answer: |-
  This is an exceptionally clean reconstruction of the futarchist slide from instrumentalism to market epistocracy. Your friend's argument is valid *if* one accepts the premises, but as you suspect, the premises carry more weight than they can bear. The argument is a classic *reductio* of pure instrumentalism in governance: if the only legitimate criterion is outcome optimization, and markets optimize best, then markets must rule everything—including the definition of optimization.

  You asked me to locate the break, price the alternatives, and separate the parity worry from the self-reference worry. Here is the diagnosis.

  ### 1. Where the Argument Breaks

  There are two distinct breaks required to stop the slide. One is normative (stopping step 5), and one is technical (stopping step 3 from doing the work required in step 5).

  **The Primary Break: Step (1) is Overloaded**
  Your suspicion about (1) is correct. Premise (1) asserts a form of **act-consequentialism** for institutional design: *a procedure is assessed [solely] by the expected value of the states of affairs it brings about.*

  If (1) is absolute, you cannot block (5) or (5′). If the only reason to vote on $W$ is that voting on $W$ produces better $W$-outcomes than letting markets pick $W$, then you are obligated to let markets pick $W$ whenever they forecast better outcomes. The "value/belief" distinction your friend relies on at (5) is inert here. Why? Because the *value* of having a democratically chosen $W$ is itself a consequence (e.g., stability, legitimacy, autonomy). If the market forecasts that a technocratically chosen $W$ yields higher welfare (by the metric of the current $W$), pure instrumentalism demands you switch.

  To keep (4) (the democratic vote on $W$), you must modify (1) to something like:
  > *(1\*) A decision procedure is assessed by the expected value of outcomes, **subject to deontological constraints on authority and legitimacy**.*

  Without (1\*), the argument is a steamroller. With (1\*), you have admitted that democracy is not merely a tool for welfare maximization but a constitutive constraint. This saves (4) but requires you to defend the constraint independently of outcomes.

  **The Secondary Break: Step (3) Equivocates on Causality**
  Your second suspicion is also correct and technically devastating. Step (3) claims markets estimate $E[W \mid P \text{ is adopted}]$. In causal notation, this is $E[W \mid do(P)]$.
  Standard prediction markets estimate $P(Outcome \mid Condition)$. They do not automatically estimate $P(Outcome \mid do(Condition))$.
  *   **The Identification Problem:** Unless policy adoption is exogenous (randomized), market prices reflect correlations confounded by the reasons *why* a policy was proposed.
  *   **The Reflexivity Problem:** In futarchy, the market price *causes* the adoption. This means the traders are pricing an equilibrium where their own trading determines the policy. This requires them to model the market's own impact on the economy. While theoretically possible in a decision market, it vastly increases the cognitive and informational burden, undermining the "dispersed information" advantage claimed in (3).

  **Verdict:** The argument fails because (1) forbids the normative stop at (4), and (3) overpromises on the causal capacity of markets, particularly when applied to the selection of $W$ itself.

  ### 2. The Parity Worry (Steps 5 & 5′) vs. The Self-Reference Worry (Step 7)

  You are right to treat these separately. They are independent defects.

  **The Parity Worry (5 & 5′): Category Error**
  Step (5) commits a category error between **constitutive ends** and **instrumental means**.
  *   $P$ (Policy) is instrumental. It is a lever we pull to change the world. Markets are good at pricing levers because the causal chains are (in principle) empirical.
  *   $W$ (Welfare Metric) is constitutive. It is the scoreboard.
  *   **The Flaw:** You cannot use the game to select the scoreboard. To price "Adopt Utilitarianism" vs. "Adopt Rawlsianism," a trader must calculate the expected welfare of each world. But to do that calculation, they must already *use* a welfare metric to aggregate the goods in that world.
      *   If they use the *current* $W$ to evaluate the *new* $W$, you have circularity (you are optimizing the old $W$, not adopting the new one).
      *   If they use the *proposed* $W$, they cannot compare the two prices (you cannot compare Utilitarian Utils to Rawlsian Primary Goods on a single scale).
  *   **Repair:** This worry is resolved by recognizing that $W$ is a normative commitment, not an empirical state. Markets aggregate beliefs about facts; they cannot aggregate commitments about value commensurability without presupposing the very value system in question.

  **The Self-Reference Worry (7): Fixed-Point Failure**
  Step (7) is a logical incoherence distinct from the value problem. It is a **fixed-point problem**.
  *   If the market decides whether to use markets, the price of "Use Markets" depends on the consequences of using markets.
  *   But the consequences of using markets *include* the market's own decision-making efficacy.
  *   This creates a self-fulfilling or self-defeating prophecy loop. If traders believe markets work, they price "Use Markets" high, causing it to be adopted, confirming their belief. If they believe markets fail, they price it low, preventing adoption.
  *   **Repair:** This requires a **constitutional hierarchy**. The rule for selecting decision rules must be fixed *outside* the system those rules govern. You cannot have a system that fully bootstraps its own authority. This implies a "constitutional" layer (perhaps democratic voting) that is immune to market override, precisely to solve the regression problem.

  **Does repairing one repair the other?**
  No. You can solve the Parity Worry (by saying values aren't marketable) and still face the Self-Reference Worry (markets shouldn't choose their own authority). You can solve the Self-Reference Worry (by constitutionalizing the rule) and still face the Parity Worry (why not let markets choose $W$ if $W$ is empirical?). Both must be blocked.

  ### 3. Evaluating the "Patch" (Decoupling)

  Your friend's suggestion—run the market but make it advisory—is the standard "prediction market as polling" move.
  *   **Diagnosis:** This diagnoses the *political* flaw (legitimacy) but hides the *epistemic* flaw.
  *   **Instability:** If the market is consistently more accurate than the legislature, pressure will mount to make it binding (returning to futarchy). If it is ignored when it contradicts the legislature, traders lose the incentive to inform themselves (returning to noise).
  *   **Your Insight:** You are correct: if the price doesn't decide, (3) does not support (4). (3) supports *consulting* a market; (4) claims markets should *rule*. The patch admits that (4) was too strong.
  *   **Verdict:** The patch is a stable political compromise but an unstable theoretical position. It concedes that markets are information aggregators, not decision-makers. This aligns with your goal of keeping (3) while rejecting the futarchist conclusion.

  ### 4. Pricing the Alternatives

  Here is the honest cost of the available positions:

  **Option A: Bite the Bullet (Market Epistocracy)**
  *   **Commitment:** Accept (1), (5), (5′), (6).
  *   **Cost:** You must defend the claim that welfare is an empirically discoverable quantity independent of democratic authorization. You must accept that if a market forecasts higher GDP under a dictatorship, the market *should* select the dictatorship.
  *   **Viability:** Low. It collapses the is/ought distinction and is politically non-starters.

  **Option B: The Hybrid Model (Your Position)**
  *   **Commitment:** Reject (1) for (1\*). Keep (2) and (3) as informational inputs. Keep (4) as a legitimacy constraint.
  *   **Cost:** You must provide a non-instrumental justification for democracy. You cannot say "democracy produces better outcomes" as your *only* argument, because if markets produce better outcomes, you lose. You must argue that democratic authorization has intrinsic value (autonomy, equality, non-domination).
  *   **Viability:** High. This is standard liberal democratic theory augmented by epistemic tools.

  **Option C: Causal Skepticism**
  *   **Commitment:** Reject (3). Markets cannot estimate $do(P)$ reliably enough for governance.
  *   **Cost:** You lose the epistemic advantage of markets. You must rely on deliberative democracy or technocracy for causal estimation, both of which have severe information aggregation problems.
  *   **Viability:** Moderate. Given the identification problem, this is scientifically prudent, but it leaves you vulnerable to the "but markets *could* work" counterfactual.

  **Recommendation:** Option B is the most robust. It allows you to use your friend's insights (markets are good information aggregators) without accepting his conclusions (markets should rule). It treats markets as a **consultative technology** within a **democratic constitutional order**.

  ### 5. What Would Change My Mind

  I am least confident in rejecting the **causal capacity of decision markets (Step 3)**.

  **The Consideration:**
  If a mechanism-design result demonstrated that **Decision Markets** (where assets pay out based on the *actual outcome of the chosen policy*) could solve the identification problem without requiring randomized trials, my diagnosis would shift.
  *   Currently, I assume markets need a causal model to price $do(P)$.
  *   However, Hanson argues that if traders are scored on the *realized outcome* of the policy they bet on, they are incentivized to reveal their true causal beliefs, effectively crowdsourcing the causal model.
  *   **The Breaker:** If it were shown that a sufficiently liquid decision market converges on the true causal effect $E[W \mid do(P)]$ faster and more accurately than any deliberative body or RCT, the pressure to accept (5) and (6) becomes immense.
  *   **Why it might not change my mind:** Even if markets *could* identify causation perfectly, the **Normative Break (1)** remains. Knowing *how* to maximize welfare does not tell you *why* you should trust the maximizer without consent. The "Parity Worry" regarding $W$ (Step 5) remains a category error regardless of market efficiency.

  **Summary for your discussion:**
  Tell your friend that the argument succeeds as a critique of *inconsistent instrumentalism* but fails as a prescription for governance. It proves that if you care *only* about outcomes, you must be a market epistocrat. Since we (and presumably he) are not market epistocrats, we must care about something else (legitimacy, autonomy, non-domination). That "something else" breaks (1), blocks (5), and saves democracy—not as a superior calculator, but as a legitimate authorizer. The market's role is to inform the authorizer, not replace them.
