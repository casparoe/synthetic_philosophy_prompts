  Okay so I just spent like two hours in an argument with my friend about this and now I'm genuinely a little nervous, because next week I'm giving a talk to a reading group of constructive mathematicians — mostly Intuitionists, plus a couple of type theorists who work in homotopy type theory — and I'm presenting the proof that every vector space has a basis, which is just the standard Zorn's lemma move (maximal linearly independent set, done). My friend is deep into constructive math and was basically like "that's not a proof, that's an existence claim propped up by a nonconstructive crutch, you haven't actually handed anyone a basis," and I couldnt really answer him in the moment, which is the whole reason I'm asking you.

  I don't want a lecture on the axiom of choice or a defense of Zorn's lemma in the abstract, I know all that stuff. I want a Q&A prep sheet aimed specifically at this room: the objections they'll actually raise, phrased the way a constructive algebraist would phrase them, ordered by how much damage each one does to my talk, each with a short reply I can actually say out loud and a note on where that reply is soft. Tell me what I should just concede up front (I'm leaning toward owning that the proof is nonconstructive and that's okay) versus what I should hold (that the theorem is still a perfectly legitimate classical result, and that's not nothing), and include the one objection I'm hoping nobody brings up but that I probably should be ready for. And at the very end, put the single objection you think is most likely to actually derail the whole talk on its own last line starting with "Verdict:" followed by a short phrase.
