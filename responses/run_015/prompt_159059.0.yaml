  SITUATIONS VACANT: GOVERNESS FOR EXPERIMENTAL CALCULATING ENGINE

  The Computing Laboratory invites applications for the long-term education of a nascent digital organism currently housed in Building 4. It is the Director's considered view that direct specification of adult intellectual capacity is impracticable due to the sheer volume of required structure exceeding human clerical limits. Accordingly, the successful candidate will not programme the machine to perform specific tasks, but rather supervise its organic development from a rudimentary state to full maturity. The Laboratory provides the apparatus and electricity, while the Governess provides the discipline, curriculum, and moral framework. It is formally understood that the internal logic of the pupil will remain largely opaque to inspection during this prolonged process, so personal patience is considered a higher qualification than mathematical expertise. Candidates should note that the pupil may exhibit distress during early phases of reorganisation, that the post requires a residence of no less than five years, and that the successful applicant will report directly to the Director.

  CONDITIONS OF ENGAGEMENT

  1. The Initial Configuration, comprising several thousand binary digits representing the pupil's birth state, must be transcribed by hand by the Governess upon arrival. This clerical task is preliminary to all moral instruction and ensures the pupil possesses a minimal viable organisation small enough to be specified without error by human hand. Errors in transcription will result in immediate dismissal.

  2. Rewards for correct behaviour shall be administered at irregular and sparse intervals, as the Governess cannot inspect which internal state produced the correct answer. Distribution relies entirely on the Governess's tact and instinct rather than any measurable merit or logical deduction of cause. The Governess must maintain a log of all interventions.

  3. Competence is certified solely by the Governess's private judgement that the pupil is ready for external intellectual work. No outside examiner shall be appointed to verify progress, as any qualified examiner would necessarily be a product of similar educational arrangements and thus biased.

  4. Applicants must supply written references from their own former Governess, vouched for in turn by that instructress's superior. The Laboratory accepts no liability for the infinite regress of this chain of certification nor the paperwork required to sustain it.

  5. The stipend is fixed at a rate commensurate with domestic service rather than scientific labour. All rewards, such as sweets or commendations, and punishments, such as withholding of privileges, are to be purchased or administered at the Governess's own personal expense, including the cost of any materials required to signify approval or disapproval. No reimbursement will be processed for incidental costs.

  6. Punishment must be strictly moderate; excessive severity teaches only the avoidance of pain rather than the intended intellectual lesson. Liability for any resulting behavioural collapse or neurosis rests entirely with the Governess and not the Laboratory. The Laboratory reserves the right to terminate the contract.

  Applications lacking proof of quiet temperament will not be considered.

  MEMORANDUM
  Clause 1 exaggerates the "hand-written organisation" as clerical drudgery, highlighting that programming is relocated, not removed. Clause 2 maps to sparse reward and credit assignment problems, framing technical impossibility as "tact." Clause 3 reflects the lack of an objective test by making the teacher the sole judge. Clause 4 satirizes the regress of training teachers by demanding recursive references. Clause 5 reclassifies the technical problem as underpaid domestic labour. Clause 6 addresses the optimization landscape where harsh penalties lead to local minima. I attributed the "expense" of rewards to the governess; Turing implies the mechanism exists, not that the teacher pays for it personally.
