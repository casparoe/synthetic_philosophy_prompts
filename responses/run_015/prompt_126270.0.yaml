answer: |-
  In a regional hospital administration office, the Director must determine belief $B$: "The new ventilator batch is mechanically safe." Clinical data provides epistemically sufficient evidence for $B$, but psychological profiling indicates that when the Director forms $B$ based on this data, they experience "certainty-induced complacency," leading them to omit mandatory spot-checks that catch rare manufacturing defects, resulting in patient harm. Conversely, hospital bylaws require the Director to adopt $B$ as an operational mandate to maintain staff cohesion; forming $B$ on this pragmatic basis—without processing the clinical data—triggers a state of "dutiful vigilance" where the Director authorizes the ventilators (guiding action by $B$) yet maintains the spot-checks, preventing harm. The Director faces a choice where forming $B$ on evidential grounds is epistemically sound but morally disastrous, while forming $B$ on pragmatic grounds is morally required but epistemically suspect, with the harm flowing strictly from the Director's own omission of checks subsequent to the evidential belief.

  **Mapping Reasons and Ethical Block**
  The **right-kind reasons (RK)** are the clinical data and telemetry metrics, as they bear directly on the truth of the proposition "The ventilators are safe." The **wrong-kind reasons (WK)** are the hospital bylaws and the need for staff cohesion, as they bear on the beneficial consequences of holding the belief rather than its truth. The evidential path is ethically blocked not because the evidence is insufficient, but because the *psychological etiology* of an evidentially-based belief triggers a complacency mechanism in this specific agent. The harm arises because the evidential belief feels like *knowledge*, licensing the omission of safety checks, whereas the pragmatically-based belief feels like a *directive*, sustaining the vigilance required to prevent harm.

  **Avoiding Collapse into Generic Normative Conflict**
  This case does not collapse the WKR distinction into a generic conflict between epistemic duty (believe truth) and moral duty (avoid harm) because both norms ostensibly recommend forming belief $B$. A generic conflict would involve epistemic reasons favoring $B$ and moral reasons favoring $\neg B$ (or suspension of judgment). Here, moral reasons favor $B$ (to prevent harm via vigilance), and epistemic reasons favor $B$ (due to sufficient evidence). The tension is internal to the *constitution* of the belief: can a belief be properly formed on WK reasons when RK reasons are available but dangerous? If we say WK reasons can never be reasons *for* belief, the agent is forced into the harmful evidential path. If we say they can, we challenge the constitutive norm that belief aims only at truth. The conflict is about the *basis* of acceptance, not the *content*.

  **Belief-like Feature and Evidentialist Attack**
  The feature making the pragmatic state genuinely belief-like is that the Director uses $B$ as an unconditional premise in practical reasoning: they sign the authorization forms, publicly assert the safety of the batch, and allocate budget based on $B$'s truth. They do not merely "act as if"; they cognitively commit to $B$. A defender of pure evidentialism would attack this feature by arguing that the accompanying "dutiful vigilance" betrays a lack of full credence. They would contend that if the Director truly believed the ventilators were safe (as the pragmatic belief claims), maintaining spot-checks would be irrational redundancy. Therefore, the evidentialist would classify the pragmatic state as mere "acceptance" or "policy adherence" rather than belief, preserving the distinction that only RK reasons can justify the cognitive state of belief proper.
