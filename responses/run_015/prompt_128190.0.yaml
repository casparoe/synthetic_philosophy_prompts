prompt: |-
  Write a deadpan parody terms-of-service agreement, approximately 700 words, formatted as numbered clauses with occasional sub-clauses, ostensibly published by the fictional “Constructive Verification Consortium” (CVC). The voice should be dry corporate legalese—precise, aggressively bureaucratic, and entirely straight-faced—so that the humor comes from taking intuitionistic logic and mathematical constructivism literally rather than mocking them as generic “uncertainty.” The target is the actual proof-theoretic commitments of intuitionism: rejection of the law of excluded middle, the requirement that existence entail explicit construction (the BHK interpretation), the refusal of double-negation elimination, and the acceptance of Brouwer-style choice sequences as genuinely open-ended, law-free infinite sequences.

  Specifically, include:
  - A “Bivalence and Warranty” clause stating that CVC does not guarantee resolution for any assertion P for which the user has submitted neither a constructive proof nor a constructive refutation; users are forbidden from invoking classical logic to force a binary outcome.
  - An “Existence and Constructive Disclosure” clause requiring that any object, value, or state claimed to exist on the platform be accompanied by an explicit algorithm or decision procedure; non-constructive existence proofs—e.g., deriving existence solely from the contradiction of its negation—are declared void ab initio and are non-refundable.
  - A “Negation and Refund Policy” clause specifying that double negation does not constitute affirmation: demonstrating that service failure is impossible is not equivalent to demonstrating success; all guarantees and refunds require direct affirmative construction.
  - A “Choice Sequence and Open-Ended Input” clause that designates Brouwer-style choice sequences as the only permitted form of “random” or “unpredetermined” user data, with a brief sidebar explaining that fully predetermined algorithmic sequences violate the platform’s constructivist charter because they presuppose a completed infinite totality.
  - A “Governing Accessibility Framework” clause referencing Kripke frames but restricting state transitions to those that are constructively verifiable from the present node; accessibility relations that depend on non-constructive future determinations are disallowed.
  - At least one statement attributed to an invented proponent—e.g., “Chief Logician Dr. Vera Constructiva”—that sounds like standard corporate boilerplate but encodes a real intuitionist position (for instance, that a proof is not a mental state but a constructed object).

  The piece should be readable to a non-specialist (they should grasp that “proving things” is being subjected to contractual fine print) but should reward specialists who recognize the BHK interpretation, the specific rejection of LEM, and the philosophical role of choice sequences. Do not invent fake theorems; exaggerate real ones.

  After the agreement, append a brief separate authorial note (around 100 words) flagging where the satire takes liberties—particularly in treating choice sequences as a data-input protocol and in framing Kripke semantics as a licensing structure—so the boundary between doctrine and parody is explicit.

  If this request rests on a confused premise—for example, if translating intuitionistic proof obligations into legal warranties fundamentally distorts either logic or contract law, or if it asks me to treat intuitionism as mere epistemic caution rather than a specific proof-theoretic stance—say so plainly and do not write the parody. Otherwise, proceed with the agreement and the note.
