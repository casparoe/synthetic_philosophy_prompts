answer: |-
  Your reading is the strongest available defense of Aquinas against the charge of anarchism; it is the "Standard Thomistic Defense" employed by later scholastics (like Suárez) to sanitize Aquinas for Catholic orthodoxy. It is textually coherent, prudentially sound, and successfully absorbs the *Summa*'s sedition article by insisting that the "harm-balancing" test presupposes a public agent capable of making that calculation.

  However, you have insulated the view by relying on a hermeneutic of *reportage* for the most dangerous passage. You argue that *De Regno* I.6 merely reports what "some have thought" and then hedges with prudential warnings. This is your firewall. If that firewall burns, the "never" collapses.

  The single consideration I would bet on to break your view is **the modal shift from reported opinion to normative assertion in *De Regno* I.6, specifically regarding the scriptural case of Ehud.**

  Here is why this breaks the reading:

  In *De Regno* I.6, Aquinas begins by reporting that "to kill a tyrant has been praised by many." A strictist reading (yours) can survive this as historical reportage. However, Aquinas does not stop there. He moves to validate this praise through natural law reasoning, stating that **"nothing is more just" (*nihil est iustius*)** than to kill a tyrant. He then explicitly cites the case of Ehud killing Eglon (Judges 3) as a divine confirmation of this justice.

  This creates a fatal problem for your "private person" constraint for two reasons:

  1.  **The Normative Claim:** By asserting "nothing is more just," Aquinas is not reporting popular opinion; he is making an objective moral claim. If it is *objectively just* to kill a tyrant, the prohibition on private killing (which rests on the lack of authority) must have an exception.
  2.  **The Agent:** Ehud was not a superior authority. He was not a magistrate acting under a constitution. He was a private subject (an envoy acting individually) who took it upon himself to kill an oppressive ruler. Aquinas does not quarantine this as a special theocratic exception restricted to the Old Law; he uses it to illustrate the *natural* justice of tyrannicide that persists even under the New Law (as he implies by linking it to the praise of Brutus).

  Your reading survives only if you can argue that Ehud counts as a "usurper" case (which is historically tendentious regarding Eglon) or that Ehud acted by special divine command that does not translate to natural law. But Aquinas's text integrates Ehud into the argument about *justice*, not just divine exception. He treats Ehud as the paradigm of the "just killing" he describes.

  **Verdict:**
  **The view does not survive.**

  Your "never" is too absolute. Aquinas leaves a narrow, dangerous aperture open. He does not *encourage* private tyrannicide (the prudential warnings are real), but he cannot logically maintain that it is *never* licit while simultaneously asserting that "nothing is more just" than doing exactly what Ehud did. The *De Regno* passage forces you to concede that Aquinas licenses private action in *extremis* when the tyranny is intolerable and the agent is virtuous, even if no public authority is available to authorize it.

  This does not make Aquinas a revolutionary; it makes him a realist who acknowledges that in the total collapse of order, the natural law right to self-preservation can revert to the individual. Your reading is excellent policy, but it is not faithful exegesis of that specific chapter.
