  4.  **Developing Replies & Soft Spots:**
      *   *Animalist:* Reply: I'm not talking about biological life, I'm talking about *personhood* as a social/cognitive phenomenon. Soft spot: Still doesn't answer "Where is *Anne*?"
      *   *Thanatologist:* Reply: These are heuristic dimensions, not psychometric scales yet. Soft spot: If it can't be measured, is it useful?
