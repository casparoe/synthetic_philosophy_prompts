      *   *Refining the "Integration" fix:* The user admitted (c) sits badly with (b). I need to give them a plausible philosophical patch, even if it's not perfect. Suggestion: Integration isn't adding survival *amount*, it's increasing the *stability* or *resolution* of the single max instance.

