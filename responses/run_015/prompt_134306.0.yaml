      *   *Dreaded Question:* "If the biographer has the *best* version of Anne, is the biographer now Anne?" (The Swampman/Teletransportation variant). Or, "Does this mean we have a duty to keep the dead alive?" (Ethical burden). Let's go with the Ethical Burden/Identity confusion one. Actually, the "Is this just grief denial?" question from the palliative care side is dangerous. Let's pick the "Identity vs. Similarity" trap.

  6.  **Review and Refine:**
