prompt: |-
  I'm writing the final for my upper-level moral philosophy seminar and I need an essay prompt on Smith's symapthy and the imparital spectator that can't be answered by just reciting the textbook summary. I was arguing with a friend last week who said Smith is basically a utilitarian in disguise — that we approve of actions because they produce happiness — and I want the question to force students to see why that's wrong, since Smith cares about propriety and the fit between sentiment and cause, not outcomes. So here's what I'm thinking: ask them to work through a concrete case, say a merchant who refuses to rescue a distant stranger in crisis because he needs to preserve capital for his children's education. The student should explain whether Smith's spectator approves of this, whether our direct sympathy for the suffering stranger conflicts with that judgment, and what this reveals about the difference between sympathy (feeling with) and moral approval. They also need to address why the spectator isn't just an internalized social mirror or a Kantian universal law, and specifically how Smith handles partiality toward family without collapsing into egoism or conventionalism.

  Please write the exam question itself, a model answer of about 600 words, and a marking scheme that separates an A from a B by naming the specific moves a top answer must contain — for instance, distinguishing sympathy from benevolence, explaining the 'double sympathy' structure where we judge the agent's motives separately from our fellow-feeling with the victim, and showing how the spectator functions as a normative check that can correct immediate sentiment rather than just echo society. Include the common mistakes that should cost marks, like treating sympathy as sufficient for approval, conflating the spectator with Humean utility, or missing that Smith allows family partiality only within bounds set by propriety. The answer should be doable without citing specific editions or page numbers, since this is a closed-book exam.
