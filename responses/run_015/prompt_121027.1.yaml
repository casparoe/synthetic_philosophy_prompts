answer: |-
  ### Exam Question

  **Course:** PHIL 405: Modern Moral Philosophy
  **Final Examination**

  **Prompt:**
  A critic argues that Adam Smith is essentially a utilitarian in disguise, claiming that for Smith, we approve of actions primarily because they tend to produce happiness or alleviate suffering. To test this claim, consider the following case: A merchant refuses to divert funds to rescue a distant stranger from a crisis, reasoning that he must preserve his capital for his own children's education.

  Write an essay evaluating the critic's claim through Smith's framework. In your analysis, address the following:
  1.  Does the Impartial Spectator approve of the merchant's action? Explain how Smith distinguishes between our *sympathy* for the suffering stranger and our moral *approval* of the merchant.
  2.  Explain the mechanism of judgment involved. How does the "double sympathy" structure operate here, and why does this demonstrate that Smith prioritizes propriety (the fit between sentiment and cause) over utility?
  3.  Define the Impartial Spectator. Why is this figure neither a mere internalization of social convention nor a Kantian rational lawgiver?
  4.  Finally, explain how Smith justifies partiality toward family without collapsing into egoism or unreflective conventionalism.

  ***

  ### Model Answer

  The claim that Smith is a crypto-utilitarian misunderstands the core of *The Theory of Moral Sentiments*. For Smith, moral approval is not derived from the utility of an action's outcome, but from the propriety of the agent's motives. In the case of the merchant, a utilitarian might argue that saving the stranger produces more aggregate happiness than educating the children. However, Smith's Impartial Spectator would likely approve of the merchant, provided his motive is proper parental care rather than greed. This reveals that for Smith, the "fittingness" of the sentiment to its object matters more than the consequentialist calculus.

  To understand this, one must distinguish between sympathy and moral approval. We naturally feel sympathy (fellow-feeling) for the suffering stranger; we imagine their distress and feel a pang of sorrow. However, sympathy alone does not constitute moral approval. Approval arises only when we enter into the *principles* of the agent's conduct. Here, Smith's "double sympathy" is crucial. First, we sympathize with the stranger's distress. Second, and more importantly for judgment, we sympathize with the merchant's motive. If the merchant acts out of a reasonable degree of parental affection, the Spectator enters into this motive. We recognize that prioritizing one's children is a proper sentiment. Even though we feel for the stranger, we judge the merchant's action as proper because his motive aligns with what we would feel in his situation. If approval were based on utility, the merchant would be blameworthy; because it is based on propriety, he is justified.

  This judgment relies on the Impartial Spectator, a construct that is often misunderstood. The Spectator is not merely an internalization of social opinion. While social feedback helps form it, the Spectator is a normative ideal—the "man within the breast"—that can correct immediate social sentiment. If society praised the merchant for hoarding wealth out of greed, the Spectator would condemn him. Conversely, the Spectator is not a Kantian rational lawgiver. It does not operate via abstract universal maxims but through imaginative projection and sentimental concord. We judge by asking if we can "go along with" the agent's feelings, not by testing a logical rule.

  Finally, Smith's handling of partiality avoids egoism by bounding it within propriety. Smith acknowledges that nature commands us to care more for our family than strangers. This is not egoism because it is a universal feature of human sentiment that the Spectator endorses. However, this partiality is not unlimited. If the merchant let his children starve while he bought luxuries, the Spectator would condemn him. If he let the stranger die when he could save them at negligible cost, the Spectator might also condemn the lack of beneficence. The Spectator ensures that partiality remains within the bounds of what other impartial observers can sympathize with.

  Therefore, the critic is wrong. Smith does not reduce morality to happiness production. He grounds it in the concord of sentiments. We approve of the merchant not because the outcome is optimal, but because his motive is proper, a judgment verified by the Impartial Spectator who balances natural partiality with normative propriety.

  ***

  ### Marking Scheme

  **Total Points: 100**

  #### **A Range (90–100): Excellent**
  *   **Thesis:** Explicitly refutes the utilitarian reading by centering *propriety* over *outcomes*.
  *   **Sympathy vs. Approval:** Clearly distinguishes between feeling for the victim (sympathy) and judging the agent (approval). Notes that we can sympathize with the stranger yet still approve of the merchant.
  *   **Double Sympathy:** Correctly explains the two-fold mechanism: (1) Sympathy with the recipient's feelings, and (2) Sympathy with the agent's motives. Explains that approval hinges on the latter.
  *   **The Spectator:** Defines the Spectator as a *normative* check, not just a descriptive mirror of society. Explicitly distinguishes it from Kantian rationalism (sentimental vs. rational basis).
  *   **Partiality:** Explains that family preference is natural/permitted but bounded by what the Spectator can "go along with." Avoids labeling this as egoism.
  *   **Writing:** Clear, concise, and philosophically precise.

  #### **B Range (80–89): Good**
  *   **Thesis:** Identifies Smith is not a utilitarian but may focus too heavily on "motives" without explaining *propriety*.
  *   **Sympathy vs. Approval:** Distinguishes the two but may imply sympathy is sufficient for approval.
  *   **Double Sympathy:** Mentions the concept but applies it vaguely to the case study.
  *   **The Spectator:** Describes the Spectator accurately as a conscience but misses the nuance of it being a corrective to social opinion (treats it mostly as internalized norms).
  *   **Partiality:** Acknowledges family priority but doesn't fully explain the *bounds* of that priority.
  *   **Writing:** Solid understanding, but lacks the analytical depth of the A response.

  #### **C Range (70–79): Adequate**
  *   **Thesis:** General summary of Smith without directly engaging the utilitarian critique.
  *   **Sympathy vs. Approval:** Conflates sympathy with moral judgment.
  *   **The Spectator:** Treats the Spectator as simply "what society thinks" (conventionalism) OR treats it as a rigid rational rule (Kantian).
  *   **Partiality:** States Smith allows family preference but fails to explain why this isn't egoism.
  *   **Writing:** Understands the basics but misses the specific philosophical mechanisms requested.

  #### **Common Mistakes (Deductions)**
  *   **The Utilitarian Trap (-15 pts):** Arguing that Smith approves of the merchant *because* it creates more long-term happiness/utility. (Smith approves because the motive is proper, regardless of aggregate utility).
  *   **Sympathy = Approval (-10 pts):** Failing to see that we can sympathize with the stranger's pain but still judge the merchant's action as correct.
  *   **The Kantian Error (-10 pts):** Describing the Spectator as applying universal logical laws rather than imaginative sentimental concord.
  *   **The Conventionalist Error (-10 pts):** Describing the Spectator as merely "doing what society expects" without the normative capacity to critique society.
  *   **Egoism Confusion (-5 pts):** Failing to explain how partiality is regulated, implying Smith allows unlimited self-interest.
