prompt: |-
  I'm drafting a paper on the foundations of probability and would like a consistency audit of my position before I commit to it in writing. Here are the six commitments I'm working with:

  (1) Frequentism for scientific inference: probability statements in empirical science are about long-run relative frequencies in actual or hypothetical sequences of repetitions, and null-hypothesis significance testing, properly applied, is the right framework for controlling error rates across a career of inquiry.

  (2) Subjectivism for rational credence: degrees of belief are the primitive notion, the sole coherence requirement is conformity to the probability axioms, and updating proceeds by conditionalization. I take this to be a normative theory of how credences ought to behave, not a description of how people actually reason.

  (3) Propensity for single-case physical chance: the probability that this particular uranium-238 nucleus decays in the next 4.5 billion years is not merely a summary of frequencies across a reference class; it reflects a real dispositional property of that individual nucleus. Frequencies are evidence for propensities, not constitutive of them.

  (4) The Principal Principle as bridge: my rational credence in an outcome, conditional on the true chance of that outcome and on admissible evidence, should equal that chance. I take this principle to be what ties (2) and (3) together — it explains why subjective credences should track objective chances — and to be what prevents my overall view from being an ad hoc patchwork of incompatible interpretations.

  (5) Methodological convergence: a competently conducted frequentist analysis and a competently conducted Bayesian analysis of the same well-designed experiment should, in practice, converge on the same substantive conclusion. Persistent divergence is evidence that at least one analysis was not competently conducted.

  (6) Diagnosis of the replication crisis: the replication crisis in psychology and allied fields is best explained by widespread misuse of frequentist tools — p-hacking, low statistical power, file-drawer effects, and the conflation of exploratory with confirmatory analyses — rather than by any deep flaw in the frequentist interpretation of probability itself.

  Please go through these six commitments and identify which pairs are in genuine tension, which only appear to be, and how severe each tension is. I am especially interested in the following questions: Does (4) actually do the bridging work I claim for it, or does the Principal Principle presuppose an account of chance that sits uncomfortably with propensity? Are (5) and (6) jointly compatible with the combination of (1) and (2), or do they smuggle in assumptions that one of those interpretations would reject? Rank the tensions by severity, and for each genuine tension, specify what the least costly revision would be and what it would cost.
reasoning: |-
  Here's a thinking process that leads to the consistency audit:

  1.  **Analyze the Request:**
      *   **Task:** Conduct a consistency audit of six philosophical commitments regarding probability.
      *   **Input:** Six specific commitments (Frequentism for science, Subjectivism for credence, Propensity for chance, Principal Principle as bridge, Methodological convergence, Diagnosis of replication crisis).
      *   **Output:** Identify tensions (genuine vs. apparent), assess severity, answer specific questions about the Principal Principle and Methodological Convergence/Replication Crisis, rank tensions, and suggest revisions.
      *   **Goal:** Help the user refine their position before writing.

  2.  **Deconstruct the Six Commitments:**
      *   (1) *Frequentism (Science):* Probability = long-run frequency. NHST is the right framework for error control.
      *   (2) *Subjectivism (Credence):* Probability = degree of belief. Coherence = axioms. Updating = conditionalization. Normative.
      *   (3) *Propensity (Chance):* Probability = dispositional property of single cases. Frequencies evidence, not constitution.
      *   (4) *Principal Principle (Bridge):* Credence = Chance (given admissible info). Ties (2) and (3).
      *   (5) *Methodological Convergence:* Good Frequentist and Good Bayesian analyses should agree. Divergence = incompetence.
      *   (6) *Replication Crisis:* Caused by misuse of frequentist tools (p-hacking, etc.), not the interpretation itself.

  3.  **Initial Scan for Obvious Conflicts:**
      *   (1) vs. (3): Frequentism says probability *is* frequency. Propensity says probability *is* disposition (frequencies are just evidence). This is a classic metaphysical clash.
      *   (1) vs. (2): Frequentism is usually objectivist/ontic. Subjectivism is epistemic. The user separates domains (Science vs. Credence), which helps, but (1) claims probability statements *in science* are frequencies. If science involves belief, there's overlap.
      *   (4) vs. (3): The Principal Principle (Lewis) was originally designed for Humean supervenience (Best System Analysis). Propensity is anti-Humean. Does PP work with Propensity?
      *   (5) vs. (1)/(2): If (1) says NHST is the *right* framework for error control, and (2) says Bayesian updating is the *right* framework for credence, do they actually converge? Often they don't (e.g., priors matter). Claiming divergence is *always* incompetence is strong.
      *   (6) vs. (1): Blaming misuse rather than the tool is standard frequentist defense. But does it clash with (5)? If methods converge, why did frequentists fail so badly while Bayesians (allegedly) didn't? (Though Bayesians have their own crises).

  4.  **Detailed Pairwise Analysis:**

      *   **Pair (1) & (3): The Ontological Clash.**
          *   (1) says Prob = Frequency.
          *   (3) says Prob = Propensity (Frequency is evidence).
          *   *Tension:* High. You can't define probability as frequency *and* as propensity simultaneously without qualification.
          *   *Resolution:* Domain restriction. (1) is for *inference procedures* (NHST), (3) is for *physical chance*. But (1) says "probability statements in empirical science are about... frequencies." If a physicist says "The chance of decay is 50%," is that a frequency statement (1) or a propensity statement (3)?
          *   *Severity:* High. This is the core pluralism problem.

      *   **Pair (3) & (4): The Principal Principle Problem.**
          *   Lewis's PP assumes chances supervene on the Humean Mosaic (frequencies/patterns). Propensity is non-Humean (causal power).
          *   *Question:* Does PP work for Propensity?
          *   *Analysis:* Many propensity theorists accept PP (e.g., Popper, Miller). However, the "admissibility" clause gets tricky. If chance is a hidden disposition, how do we know we have "admissible evidence" of the *true* chance?
          *   *Severity:* Moderate. It's a known philosophical friction point but manageable if one adopts a "non-Humean" version of PP.

      *   **Pair (1) & (2): The Domain Separation.**
          *   (1) Science/Inference. (2) Rational Credence.
          *   *Tension:* Apparent. The user explicitly separates them.
          *   *Catch:* Scientific inference involves scientists' credences. If I believe a hypothesis (2), how does that relate to the p-value (1)?
          *   *Severity:* Low/Moderate. Depends on how strictly "scientific probability statements" are segregated from "scientists' credences."

      *   **Pair (5) & (1)/(2): The Convergence Claim.**
          *   (5) says they *should* converge.
          *   (1) endorses NHST. (2) endorses Conditionalization.
          *   *Conflict:* NHST does not yield $P(H|E)$. Bayesian analysis does. They often give different numbers (p-value vs. Posterior).
          *   *Claim:* "Substantive conclusion." Maybe they agree on "Reject/Don't Reject" vs "High/Low Prob".
          *   *Severity:* Moderate. It's an empirical claim that might be false. Lindley's Paradox shows divergence even with competence.

      *   **Pair (6) & (1): The Defense of Frequentism.**
          *   (6) says Frequentism is fine, users are bad.
          *   (1) says Frequentism is the right framework.
          *   *Consistency:* High. These support each other.
          *   *Conflict with (5):* If Frequentism is so robust (6), and methods converge (5), why the crisis? If Bayesians also misused tools, where is their crisis? (They have one, but different).
          *   *Severity:* Low.

      *   **Pair (1) & (3) Revisited (The "Scientific Statement" issue):**
          *   (1) says "probability statements in empirical science are about... frequencies."
          *   (3) says "probability... reflects a real dispositional property."
          *   *Conflict:* If a physicist makes a probability statement about a nucleus, is it (1) or (3)? You can't have it both ways for the *same* statement.
          *   *Severity:* **Critical.** This is the biggest contradiction.

  5.  **Addressing Specific User Questions:**
      *   *Does (4) bridge (2) and (3) comfortably with Propensity?*
          *   PP was built for Humean chance. Propensity is non-Humean. The "admissibility" condition is the weak link. If chance is a disposition, evidence for it is always fallible (frequency data). So we rarely know the *true* chance. PP applies to *known* chance. This makes the bridge wobbly.
      *   *Are (5) and (6) compatible with (1) and (2)?*
          *   (5) assumes equivalence of output. (1) and (2) define different outputs (error rates vs. credences). Equating "substantive conclusion" is the dodge.
          *   (6) protects (1).
          *   Compatibility issue: If (2) is the normative theory of belief, why is (1) the right framework for science? Science aims at truth/belief. If (1) doesn't give $P(H|E)$, does it serve (2)?

  6.  **Ranking Tensions:**
      1.  **(1) vs. (3):** Definition of "Probability Statement in Science." Direct contradiction.
      2.  **(3) vs. (4):** PP's Humean roots vs. Propensity's non-Humean nature.
      3.  **(5) vs. (1)/(2):** Mathematical divergence (Lindley's Paradox) vs. claim of convergence.
      4.  **(1) vs. (2):** Normative disconnect (Error rates vs. Credence).

  7.  **Drafting Revisions:**
      *   *For (1) vs (3):* Restrict (1) to *methodological* probability (p-values, confidence intervals) and (3) to *ontological* probability (quantum mechanics, decay). Clarify that "probability statements in science" in (1) refers to *inferential* statements, not *theoretical* physical statements.
      *   *For (3) vs (4):* Acknowledge PP needs modification for non-Humean chance (e.g., Ismael's Generalized PP).
      *   *For (5):* Soften the claim. Convergence is asymptotic or typical, not necessary. Acknowledge Lindley's Paradox.
      *   *For (1) vs (2):* Clarify that NHST controls behavior, not belief. Don't claim NHST yields rational credence directly.

  8.  **Refining the Output:**
      *   Structure: Executive Summary, Detailed Tension Analysis (Ranking), Specific Questions Answered, Recommendations.
      *   Tone: Professional, philosophical, constructive.
      *   Check: Did I miss anything?
      *   *Self-Correction on (1):* Commitment (1) says "probability statements in empirical science are about long-run relative frequencies." Commitment (3) says "probability that this particular uranium-238 nucleus decays... reflects a real dispositional property." Uranium decay *is* an empirical science statement. This is a direct contradiction. I need to highlight this as the most severe tension.
      *   *Self-Correction on (4):* Lewis explicitly rejected propensity because he thought it violated PP (or rather, PP + Humeanism). But propensity theorists argue PP holds. The tension is whether PP *presupposes* Humeanism. It doesn't logically, but historically it's tied there. The "admissibility" clause is the key friction point.

  9.  **Final Polish:** Ensure the "Least Costly Revision" is practical for a paper draft. (e.g., nuance wording rather than abandoning a pillar).

  **(Self-Correction during drafting response):** I need to make sure I don't just say "these contradict." I need to explain *why* and offer the specific philosophical terminology (e.g., Humean Supervenience, Admissibility, Lindley's Paradox).

  Let's organize the tensions by severity.
  1. (1) vs (3) - Definition of scientific probability.
  2. (3) vs (4) - PP and Non-Humean Chance.
  3. (5) vs (1)/(2) - Convergence claim.
  4. (1) vs (2) - Role of belief in science.

  Okay, ready to write.s
answer: |-
  This is a sophisticated pluralist position (often called "interpretive pluralism" or "conceptual pragmatism"). It is defensible, but it walks a tightrope. Your commitments attempt to assign different interpretations to different domains (inference, credence, physics) and then stitch them together with bridge principles.

  Below is a consistency audit of your six commitments, ranked by the severity of the tension they generate.

  ### 1. Critical Tension: The Definition of Scientific Probability
  **Pair:** (1) Frequentism for Scientific Inference vs. (3) Propensity for Physical Chance
  **Severity:** **High**

  **The Conflict:**
  Commitment (1) states: *"probability statements in empirical science are about long-run relative frequencies."*
  Commitment (3) states: *"the probability that this particular uranium-238 nucleus decays... reflects a real dispositional property."*

  Quantum mechanics and nuclear physics are empirical sciences. When a physicist writes a paper stating the probability of a decay event, Commitment (1) dictates this statement *must* be about long-run frequencies. Commitment (3) dictates it *must* be about a single-case disposition. You cannot have it both ways for the same statement. If (3) is true, then (1) is false as written, because there is at least one class of probability statements in empirical science (quantum phenomena) that are not about frequencies.

  **Does it break the paper?** Yes, if left unqualified. It invites the charge of self-contradiction immediately upon application to physics.

  **Least Costly Revision:**
  Restrict the scope of (1). Change (1) to claim that probability statements in *statistical inference* (data analysis, hypothesis testing) are frequentist, while probability statements in *fundamental physical theory* are propensities.
  *   **Cost:** You lose the unity of "science." You must argue that data analysis and physical theory are distinct enough domains to warrant different ontologies of probability.
  *   **Revision Text:** "(1) Frequentism for *statistical inference*: probability statements regarding *data analysis and hypothesis testing* are about long-run relative frequencies..."

  ### 2. Substantial Tension: The Principal Principle and Non-Humean Chance
  **Pair:** (3) Propensity vs. (4) The Principal Principle (PP)
  **Severity:** **Moderate-High**

  **The Conflict:**
  You ask: *Does (4) actually do the bridging work I claim, or does PP presuppose an account of chance that sits uncomfortably with propensity?*

  David Lewis, who formulated the PP, was a Humean. He believed chances supervene on the "Humean Mosaic" (the total pattern of events). Propensity is explicitly **non-Humean**; it posits a causal power that does *not* supervene on the mosaic (a single nucleus has a chance even if it never decays).
  The friction point is **Admissibility**. In Lewis's framework, information about the future is inadmissible because it overrides chance. In a Propensity framework, if chance is a causal power, how do we ever possess "admissible evidence" of the *true* chance? We only observe frequencies (effects). If we never know the true chance $C$, the PP ($Credence(A | C(A)=x) = x$) becomes vacuous because the antecedent is never satisfied.

  **Does it break the paper?** No, but it requires philosophical defense. Many propensity theorists (e.g., Popper, Miller) accept a version of PP, but they must modify the admissibility clause.

  **Least Costly Revision:**
  Adopt Jenann Ismael's **Generalized Principal Principle**. This version decouples PP from Humean Supervenience. It states that rational credence should track chance *given that chance is the objective guide to belief*, without requiring the strict Humean metaphysics Lewis assumed.
  *   **Cost:** You must cite the post-Lewis literature on PP (Ismael, Hoefer) rather than relying on Lewis's original formulation. You must acknowledge that "knowing the true chance" is an idealization.
  *   **Revision Text:** Amend (4) to specify that you rely on a *generalized* PP compatible with non-Humean chance, acknowledging that 'admissibility' is interpreted as 'evidence that does not bypass the chance mechanism.'

  ### 3. Moderate Tension: Methodological Convergence vs. Mathematical Divergence
  **Pair:** (5) Convergence vs. (1) & (2)
  **Severity:** **Moderate**

  **The Conflict:**
  Commitment (5) claims competent Frequentist and Bayesian analyses *should* converge. Commitment (1) endorses NHST (which yields $P(E|H)$). Commitment (2) endorses Conditionalization (which yields $P(H|E)$).
  These are mathematically distinct quantities. **Lindley's Paradox** demonstrates that with large sample sizes, a Frequentist analysis can strongly reject a null hypothesis ($p < 0.05$) while a Bayesian analysis strongly supports it (high posterior on null), even when both are "competently conducted" (using standard priors and correct calculations).
  Claiming that persistent divergence is *evidence of incompetence* is too strong. It implies there is a "God's eye" substantive conclusion that both methods must hit, which privileges one interpretation over the other implicitly.

  **Does it break the paper?** It makes you vulnerable to technical counterexamples.

  **Least Costly Revision:**
  Soften the claim from "should converge" to "often converge in well-powered, pre-registered designs with uninformative priors." Acknowledge that divergence occurs in specific boundary conditions (like Lindley's Paradox) and that this divergence reflects the different *questions* being asked (error rates vs. belief), not necessarily incompetence.
  *   **Cost:** You lose the rhetorical punch of (5) as a unifying heuristic. You admit that the methods are not interchangeable.
  *   **Revision Text:** "(5) ...should, in practice, **often** converge... Persistent divergence **in standard experimental conditions** is evidence..."

  ### 4. Low Tension: The Role of Belief in Science
  **Pair:** (1) Frequentism for Science vs. (2) Subjectivism for Credence
  **Severity:** **Low (Manageable)**

  **The Conflict:**
  (1) says NHST is the right framework for science. (2) says Conditionalization is the right framework for rational belief.
  Scientists are rational agents. If a scientist accepts a result based on (1) (e.g., $p < 0.05$), how does that translate to (2)? Frequentism explicitly forbids assigning probabilities to hypotheses. Subjectivism requires it.
  If science aims at truth (belief), and (1) forbids quantifying belief in hypotheses, (1) and (2) are functionally disconnected.

  **Resolution:**
  This is a standard "behaviorist vs. mentalist" separation. You can maintain this if you argue that *scientific institutions* should operate on (1) to control error rates (long-run reliability), while *individual scientists* hold (2) as their internal cognitive state.
  *   **Cost:** You must explain why an individual scientist should act on a p-value if their rational credence is governed by Bayes. (The standard answer: Institutional norms override individual priors to prevent bias).

  ### 5. Low Tension: Replication Crisis Diagnosis
  **Pair:** (6) Replication Crisis vs. (1) & (5)
  **Severity:** **Low**

  **The Conflict:**
  (6) blames misuse, not the tool. (5) says tools converge if used competently.
  This is internally consistent. However, critics will argue that NHST is *cognitively* prone to misuse (e.g., it invites the fallacy of $P(H|E) \approx p$). If the tool systematically invites misuse, is the "misuse" defense valid?
  *   **Resolution:** This is a sociological/psychological claim, not a logical one. It holds up as long as you acknowledge that *Bayesian* methods have their own misuse potential (e.g., prior hacking).

  ---

  ### Summary of Recommendations

  **Ranking of Tensions by Severity:**
  1.  **(1) vs. (3):** Ontological contradiction regarding physics. (Must Fix)
  2.  **(3) vs. (4):** Metaphysical friction regarding PP and Propensity. (Must Clarify)
  3.  **(5) vs. (1)/(2):** Empirical/Mathematical overreach regarding convergence. (Should Nuance)
  4.  **(1) vs. (2):** Functional disconnect between inference and belief. (Monitor)

  **Answers to Your Specific Questions:**

  > *Does (4) actually do the bridging work I claim for it, or does the Principal Principle presuppose an account of chance that sits uncomfortably with propensity?*

  It does the bridging work, **but** not in its original Lewisian form. Lewis's PP is tied to Humean Supervenience. To bridge Subjectivism (2) and Propensity (3), you need a **Non-Humean Principal Principle**. You must explicitly state that you are not bound by Lewis's metaphysics, only by the normative constraint that credence tracks objective chance. If you do not make this distinction, a knowledgeable reader will flag (4) as incompatible with (3).

  > *Are (5) and (6) jointly compatible with the combination of (1) and (2), or do they smuggle in assumptions that one of those interpretations would reject?*

  They are compatible, but (5) smuggles in an assumption of **realism about conclusions**. It assumes there is a "substantive conclusion" independent of the framework. A strict Subjectivist might say the conclusion *is* the posterior; a strict Frequentist might say the conclusion *is* the decision to reject. They are different speech acts. To make (5) work, you must define "substantive conclusion" loosely (e.g., "the effect is real enough to pursue") rather than technically.

  ### Final Strategic Advice

  Your position is a form of **Conceptual Pluralism**. To make this stick in a paper:

  1.  **Fix (1):** Explicitly exclude fundamental physics from the "Frequentist" domain. Confine Frequentism to *statistical inference procedures*.
  2.  **Upgrade (4):** Cite Ismael (2008) or Hoefer (2007) to show PP works without Humeanism.
  3.  **Humble (5):** Acknowledge Lindley's Paradox. Frame convergence as a pragmatic hope for well-designed studies, not a logical necessity.

  If you make these three adjustments, your six commitments form a coherent, defensible, and nuanced philosophical platform.
