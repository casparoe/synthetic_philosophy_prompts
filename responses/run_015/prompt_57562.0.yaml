  6.  **Self-Correction during drafting:** I initially thought about telling them to cite Weber more carefully. But they said "no sources." I should focus on the *conceptual* accuracy rather than bibliographic nitpicking. The "time is debt" is more Franklin than Weber, I should point that out as a potential conflation.
