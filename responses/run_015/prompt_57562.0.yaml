answer: |-
  Here is the direct feedback you asked for, structured by your four points.

  ### 1. Does "direction of the default" earn its keep?

  **The Steelman Objection:**
  "Direction of the default" is merely a procedural metaphor for "cultural attitude." Saying the burden of proof lies on the worker is just a complex way of saying "the culture stigmatizes leisure." It adds no predictive power. If you know the culture stigmatizes leisure, you already know the hours will be long and the guilt will be high. Invoking "burden of proof" sounds like legalistic window-dressing on a sociological observation. It risks being a distinction without a difference.

  **Can you answer it?**
  Yes, but only if you sharpen the *mechanism*.
  Currently, you treat the default as a *feeling* (guilt, resentment). To make the concept earn its keep, you must treat it as a *rule of interaction*.
  *   **Redescription:** "People feel guilty taking time off." (This is psychological).
  *   **Your Claim:** "The system requires an active authorization to stop." (This is structural).

  The distinction matters for policy. If the problem is guilt (psychological), the solution is counseling or "awareness." If the problem is the burden of proof (structural), the solution is procedural inversion (e.g., overtime must be pre-approved by the manager, rather than time-off must be requested by the worker).
  **Verdict:** It earns its keep *only* in Section 4, where you propose solutions. If you keep it purely descriptive, it is fancy redescription. If you use it to distinguish between *capping hours* (quantity) and *shifting authorization* (procedure), it is a robust tool. Make sure Section 4 leans hard into the procedural implication, not just the cultural one.

  ### 2. Factual/Glibness Check (Sections 1–3)

  **Weber (Section 1):**
  *   **The Blur:** You conflate Luther/Calvin with Franklin. Weber's argument is that the *religious* anxiety (am I saved?) secularized into *economic* anxiety (am I productive?). You write: "by then time itself had turned into a standing debt." That is Franklin (secular endpoint), not the early Protestants (religious starting point).
  *   **The Risk:** Saying "In most of the societies they came out of... leisure was the default" is historically romantic. Pre-modern agrarian life was toil-heavy. The distinction wasn't work vs. leisure; it was subsistence vs. surplus. The Protestant shift wasn't introducing work; it was introducing the *moral valorization* of systematic labor.
  *   **Fix:** Don't claim leisure was the default for the peasantry. Claim leisure was the default *ideal* for the moral elite (aristocracy/virtue), which the Protestants inverted. It's a status claim, not an economic one.

  **France (Section 2):**
  *   **Accuracy:** The Aubry laws (1998/2000) and RTT mechanism are correctly described.
  *   **Glibness:** "Whether it created jobs is an empirical question I'm not going to touch." This is fine, but be aware that the *failure* you describe (cultural resistance among cadres) is often attributed to the fact that the law applied differently to different classes of workers. Cadres (executives) were often exempt from strict hour counting ("forfait jours"). The resentment wasn't just about the default; it was about the law creating a two-tier system. You don't need to add this, but don't be surprised if a French reader flags it.

  **Karoshi (Section 3):**
  *   **Accuracy:** 1969 case (Osaka, 29-year-old man), 1988 hotline (National Defense Council for Victims of Karoshi). The detail about wives calling is historically supported; family members were often the first to file compensation claims because the workers were dead or incapacitated.
  *   **Glibness:** None detected. The timeline holds up.

  ### 3. Section 3: Exploitation Check

  **Blunt Assessment:**
  It borders on exploitative, but doesn't cross the line *yet*. The risk lies in the phrase "limit case." This is Wittgensteinian/philosophical terminology that treats human death as a data point to test the boundary of a definition. Combined with "nobody inside the system is in a position to do the justifying," it risks sounding like you are blaming the dead for failing to articulate a justification.

  **How to keep the point without the effect:**
  Shift the agency from the worker to the structure.
  *   **Current:** "...nobody inside the system is in a position to do the justifying." (Implies the worker failed to justify).
  *   **Revision:** "...the system renders justification structurally impossible." (Implies the system silenced them).
  *   **Tone Check:** Remove "limit case." Use "extreme manifestation" or "logical endpoint." "Limit case" sounds like you are solving a math problem; "logical endpoint" sounds like you are tracing a moral consequence.
  *   **The Wives:** Keep the detail about the wives. It humanizes the data and underscores that the *worker* was already silenced. It is the strongest evidence against exploitation because it highlights the voicelessness of the victim.

  ### 4. The Dutch Counterexample

  **Does it kill Section 4?**
  No. It actually validates your prescription, provided you analyze it correctly.
  The Netherlands does not have low hours because the "burden of proof" is on leisure. It has low hours because the "burden of proof" is on *full-time* work. The Dutch norm (the *1.5 earner model*) makes part-time work the unmarked category for both genders.

  **How to fold it in:**
  You suspect the Dutch model lacks the moralizing your theory predicts. That is correct. But your theory predicts that *if* you change the direction of the default, you change the feel. The Dutch model is the proof of concept for your final paragraph ("a real norm of part-time work for everyone rather than for mothers").
  *   **Don't** present the Netherlands as a counterexample to your diagnosis of Japan/France.
  *   **Do** present it as the empirical validation of your proposed solution in Section 4.
  *   **Nuance:** Be careful not to idealize it. The Dutch model relies on high hourly productivity and a specific consensus culture (Polder Model). But for your argument, it proves that *norms* (direction of default) drive hours more than *laws* (Aubry) do.
  *   **Integration:** Add a sentence to Section 4: "We see this inversion working in the Netherlands, where part-time labor is the unmarked default for men and women alike. The result isn't just fewer hours; it's the absence of the justification burden entirely."

  **Summary:**
  The argument holds. It is not just redescription if you emphasize the *procedural* shift over the *cultural* shift. Tighten the Weber distinction (religious anxiety vs. economic debt). Soften the "limit case" language to avoid clinical coldness. Use the Dutch example to bulletproof your conclusion, not to undermine your premise.
