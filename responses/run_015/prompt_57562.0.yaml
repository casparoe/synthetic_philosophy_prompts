  7.  **Final Output Structure:** Follow the user's four numbered points exactly. Keep it tight.

  *(Self-Correction on Q1)*: I need to make sure I steelman the objection well. The objection is: "Burden of proof is just a metaphor for social pressure." My job is to show why "burden of proof" is a *mechanism* whereas "social pressure" is a *symptom*.

  *(Self-Correction on Q3)*: The phrase "limit case" is the culprit. It sounds like a logic puzzle. I'll suggest softening that specific term while keeping the structural point.

