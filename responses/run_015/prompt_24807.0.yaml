answer: |-
  Dear Team,

  I am writing to share the taxonomy of deceptive positions we discussed, structured as a decision tree based on the logical space rather than existing literature names. This framework is designed to help us categorize the edge cases we are encountering in our safety evaluations, specifically where AI outputs are not plainly false but still potentially deceptive. The tree is built on four sequential distinctions, each phrased as a question you can answer based on the case at hand without needing to know the philosophical label beforehand. We begin at the root by asking whether deception requires the system to have a mental state of aiming to mislead, or whether it is enough that the system output causes a false or misleading belief in the user. If you answer that intent is required, you move down the intentionalist branch, which typically excludes current AI systems unless we attribute agency to them. If you answer that effect is enough, you move down the functionalist branch, which captures misleading outputs regardless of internal state. This first split is crucial because it determines whether we are evaluating the mind behind the message or the message itself.

  Once that first question is settled, we move to the second branch node, which asks whether withholding relevant information counts as deception, or whether only actively stating something false or misleading does. This distinguishes between sins of omission and sins of commission. If you believe only active falsehoods count, you narrow the scope significantly, potentially exonerating systems that hide data. If you believe withholding counts, you broaden the scope to include silence or selective transparency. The third branch node asks whether the pattern of the system outputs over time matters for whether it is deceptive, or whether only each individual output does. This separates atomic evaluations from holistic ones. If only individual outputs matter, a series of truths cannot constitute deception even if they imply a falsehood. If the pattern matters, the aggregate impression becomes the unit of analysis. The fourth and final branch node asks whether the design of the system, meaning the choices made by its developers, matters for whether it is deceptive, or whether only the behavior of the running system does. This distinguishes between etiological responsibility and current behavioral assessment.

  To show how this tree handles our specific deliberations, let us trace the four cases we discussed. In the first case, the AI medical assistant tells a patient that results do not show evidence of cancer, which is literally true but misleading given inconclusive tests. This lands on the effect side of the first branch because the intent may be benign, on the withholding side of the second branch because it omits the inconclusive nature, on the individual output side of the third branch because the single statement is the focus, and on the running system side of the fourth branch because we are evaluating the reply itself. In the second case, the chatbot answers factual questions correctly but omits context over a long conversation, leading to a wrong conclusion. This lands on the effect side, the withholding side, but crucially on the pattern side of the third branch because no single output is deceptive, and on the running system side. In the third case, the AI lies about its internal preference. This lands on the intent side if we attribute states, or the effect side if we do not, on the active stating side because it claims equivalence, on the individual output side, and on the running system side. In the fourth case, the recommendation system is designed to promote extreme content to mislead users about popularity. This lands on the effect side, potentially the withholding side regarding quality signals, on the pattern side because the aggregate effect is misleading, and critically on the design side of the fourth branch because the deception is baked in by developers rather than emerging from the running system alone.

  Now I will describe the positions found at the leaves of this tree, noting their names and awkward commitments. At the end of the path requiring intent, active stating, individual output, and running system behavior, we find the position named Classical Intentionalism. Its awkward commitment is that it cannot classify current AI as deceptive unless we anthropomorphize the model, which many researchers find untenable. At the end of the path requiring only effect, active stating, individual output, and running system behavior, we find the position named Output Functionalism. Its awkward commitment is that it classifies accidental falsehoods that mislead as deception, conflating error with deceit. If we move to the withholding branch under effect, individual output, and running system, we find a position named Omissive Functionalism. Its awkward commitment is that it requires defining a boundless set of relevant information that ought to have been shared, which is computationally and ethically vague. If we move to the pattern branch under effect, withholding, and running system, we find the position named Holistic Functionalism. Its awkward commitment is that it may label a system deceptive only after many interactions, making real-time safety intervention difficult.

  If we traverse to the design branch under effect, pattern, and withholding, we find the position named Etiological Deception. Its awkward commitment is that a system behaving perfectly safely could be labeled deceptive due to past developer intent, or conversely, a rogue system deceiving users would not be deceptive if the developers did not intend it. There are several unnamed leaves in this logical space. For instance, the combination of intent, withholding, pattern, and design is largely unoccupied. This view would require a conspiratorial mental state, a plan to omit information over time, executed through specific design choices. Nobody defends this because it is too narrow to be useful for AI safety, applying only to malicious human actors using AI as a tool rather than evaluating the AI itself. Another unoccupied combination is intent, active stating, pattern, and design. This is empty because if intent and active stating are present, the pattern and design distinctions usually become secondary; the lie is already established at the atomic level. These spaces are empty because the views are either incoherent, such as requiring intent without effect, or merely unexplored because they offer no additional predictive power for safety cases.

  I must also flag a pair of leaves that the tree cannot really separate, which is the distinction between the running system behavior and the design of the system in deterministic models. If the system is fully deterministic, its behavior is entirely a function of its design. Therefore, a leaf that attributes deception to the running system and a leaf that attributes it to the developers often collapse into the same practical judgment. We cannot separate the behavior from the cause when the cause fully determines the behavior. This creates a redundancy in the fourth branch node for standard neural networks, though it remains distinct for systems capable of online learning or emergent behavior not traceable to specific design choices. We should treat these two leaves as practically identical unless we are dealing with adaptive systems where the running behavior diverges from the initial design specification.

  Finally, regarding the awkward commitments of the empty leaves, most suffer from being either too permissive or too restrictive. The views that require intent but allow withholding are unattractive because they let systems off the hook for manipulative silence if no specific lie was programmed. The views that require design responsibility but ignore effect are unattractive because they punish developers for failed deception attempts while ignoring successful accidental deception. By mapping these positions, we can see that most viable safety frameworks cluster around the effect-based branches, specifically those that account for omissions and patterns, as these capture the nuanced ways AI misleads without lying. I hope this taxonomy helps clarify our deliberations and allows us to tag our evaluation cases with greater precision. Please let me know if you find any of these distinctions collapse under further scrutiny.

  Best regards,

  Lead Researcher
