      *   *Refining the Missing Piece:* It's the **Bargaining/Coordination Distinction**. Superrationality turns a PD (incentive problem) into a Bargaining Problem (distribution problem). It assumes the Bargaining Problem has a unique rational solution (like the Nash Bargaining Solution) without justifying *why* that specific solution is the "rational" output of the procedure. Also, the **Symmetry Breaking** problem in Move 3 is crucial—how do they correlate on *which* asymmetric policy without communication?

  6.  **Final Polish:** Check the payoff math in Move 3.
      *   CC: S=3000, W=1500. Avg = 2250.
