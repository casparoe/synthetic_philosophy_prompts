answer: |-
  Here is the requirements list for a coherent account of reason-ownership, tailored to an advice system. I have separated functional necessities (non-negotiable for the ledger to work) from philosophical commitments (controversial choices that change the output).

  ### The Desiderata

  **1. The Actionability Constraint**
  *   **Requirement:** A reason must attach to an entity capable of performing the action.
  *   **Case:** 5 (Dead agents), 6 (Past impossibility), 7 (Sealed room bomb).
  *   **Status:** **Non-Negotiable.**
  *   **Consideration:** If the owner cannot act, the reason cannot generate advice. A dead person cannot switch meds. A person in a sealed room cannot defuse a bomb. If your ledger keeps these entries active, it will generate errors or nonsense outputs. You must archive or delete reasons when capacity is lost.
  *   **Implication:** "Orphan reasons" in a world without agents (Case 1) are not reasons *for action*. They are values or states of affairs. Your system should not track them as actionable items.

  **2. The Individuation Constraint**
  *   **Requirement:** The system must distinguish between one reason with multiple owners and multiple reasons triggered by the same fact.
  *   **Case:** 4 (Rowing crew), 8 (Shared fact: harm to you).
  *   **Status:** **Non-Negotiable.**
  *   **Consideration:** Your ledger will explode or double-count weights without this. In the rowing case, is there one reason "keep time" owned by the crew, or eight reasons "pull in sync" owned by each rower? In the harm case, is your reason to warn me the *same* reason as my reason to step back?
  *   **Implication:** You need a rule: Is the reason identified by the *fact* (one reason, many owners) or the *relation* (many reasons, one fact)? For an advice engine, the *relation* model is safer. It prevents weight aggregation errors.

  **3. The Epistemic Constraint**
  *   **Requirement:** Determines whether an agent must know (or be able to know) a fact to hold the reason.
  *   **Case:** 2 (Patient ignorance vs. doctor knowledge).
  *   **Status:** **Controversial (Taste of One Camp).**
  *   **Consideration:**
      *   *Objectivist View:* The patient has the reason even if they don't know the drug exists. (Better for long-term welfare tracking).
      *   *Subjectivist View:* The patient has no reason until the doctor tells them. (Better for immediate guidance).
  *   **Implication:** If you choose Objectivist, your ledger holds "latent" reasons. If you choose Subjectivist, reasons are created by information transfer. For an advice thing, a hybrid is best: The reason exists objectively, but is "inactive" until evidence is available.

  **4. The Persistence Constraint**
  *   **Requirement:** Determines whether reasons attach to persons or roles.
  *   **Case:** 3 (Night watchman/Role vacancy).
  *   **Status:** **Controversial (Taste of One Camp).**
  *   **Consideration:**
      *   *Role-Based:* The reason belongs to the position. When the watchman quits, the reason stays with the role (orphaned until filled).
      *   *Agent-Based:* The reason belongs to the person currently filling the role. When they quit, the reason dies, and a new one is born for the successor.
  *   **Implication:** Role-based is better for institutional advice. Agent-based is better for personal liability. If your system advises organizations, use Role-Based. If it advises individuals, use Agent-Based.

  **5. The Capacity Threshold**
  *   **Requirement:** Defines the minimum cognitive or biological capacity required to hold a reason.
  *   **Case:** 9 (Animals, babies, future systems).
  *   **Status:** **Controversial (Taste of One Camp).**
  *   **Consideration:** Does a baby have a reason to eat, or does the parent have a reason to feed the baby? Does a dog have a reason to avoid pain?
  *   **Implication:** If you set the bar at "rational agency," babies and animals are excluded (reasons belong to guardians). If you set the bar at "sentience," they are included. For an advice system, exclude them as primary owners to avoid complex proxy logic, unless the system is specifically designed for caretakers.

  **6. The Aggregation Constraint**
  *   **Requirement:** The system must be able to compare weights across different owners.
  *   **Case:** 8 (Conflicting reasons between two people).
  *   **Status:** **Non-Negotiable (for your system), Philosophically Controversial.**
  *   **Consideration:** Philosophy often says reasons are agent-relative (my pain matters more to me than to you). But an advice system must prioritize. If your reason to sleep conflicts with my reason to talk, the system must decide whose reason weighs more.
  *   **Implication:** You are forced into a utilitarian-style common currency. You cannot maintain strict agent-relativity if the system must resolve conflicts.

  ### Conflicts and Trade-offs

  **Conflict 1: Objectivity vs. Actionability**
  *   **The Clash:** You cannot satisfy Case 1 (Reasons exist without agents) and Case 7 (Sealed room bomb) simultaneously with Case 6 (Ought implies Can).
  *   **The Choice:** If reasons exist objectively (Case 1), you will have entries in your ledger that no one can act on (Case 7). If you require actionability (Case 6), you must delete reasons when agents vanish (Case 1).
  *   **Resolution:** For an advice engine, **Actionability wins.** Delete orphan reasons. They are noise.

  **Conflict 2: Shared Facts vs. Individual Ownership**
  *   **The Clash:** Case 8 (Shared fact) vs. Individuation Constraint.
  *   **The Choice:** If you say the fact "You are about to be harmed" is one reason owned by both of us, you cannot weight them differently. If I care more than you, the system can't reflect that. If you say it is two reasons, you risk double-counting the value of the harm.
  *   **Resolution:** Treat them as **two distinct reasons** triggered by one fact. This allows individual weighting (I might weigh your safety lower than you do).

  **Conflict 3: Latent Reasons vs. Guidance**
  *   **The Clash:** Case 2 (Patient ignorance).
  *   **The Choice:** If you say the patient has the reason (Objectivist), the system might advise them to do something they cannot understand. If you say they don't (Subjectivist), the system ignores valid medical needs until the doctor speaks.
  *   **Resolution:** Tag reasons with an **Evidence Status**. The reason exists, but the advice is suppressed until the "Known" flag is true.

  ### The Single Most Constraining Requirement

  **The Guidance Constraint.**
  This is the requirement that a reason must be the kind of thing that could practically guide the agent who holds it.
  *   **Why it narrows the field:** It eliminates Case 1 (no agents), Case 5 (dead agents), Case 6 (impossible acts), and Case 7 (inaccessible acts) instantly. It forces you to decide on Case 2 (ignorance). It demands you solve Case 9 (capacity).
  *   **Verdict:** If your thing is for *advice*, this is non-negotiable. If you drop this, you are building a moral status tracker, not an advice engine.

  ### Identity and Weights

  **Does the theory owe you identity conditions?**
  **Yes.** Without them, you cannot prevent ledger explosion.
  *   **The Rule:** Two reasons are identical only if they share the **Owner**, the **Action**, and the **Grounding Fact**.
  *   **Application:** In Case 8 (Shared fact), because the Owners differ, the Reasons are distinct. This prevents double-counting the *fact* while allowing distinct *weights* per owner.

  **Does the theory owe you a story about cross-owner weights?**
  **Yes.** Your system has to "add them up somehow."
  *   **The Problem:** Philosophy often rejects comparing my pain to your gain.
  *   **The Requirement:** You must adopt a **Common Currency Protocol**. You cannot simply sum "units of reason." You need a normalization function (e.g., all weights converted to "harm prevented" or "utility gained").
  *   **Warning:** This is the most philosophically vulnerable part of your system. It assumes all reasons are commensurable. You must document this assumption clearly.

  ### Scorecard: Four Families of View

  **1. The Externalist Ledger (Fact-Based)**
  *   **Core:** Reasons are facts about the world.
  *   **Ownership:** Attached to anyone affected by the fact.
  *   **Pros:** Captures Case 2 (Patient has reason even if ignorant).
  *   **Cons:** Fails Guidance Constraint. Clutters ledger with reasons agents can't use.
  *   **Verdict:** Bad for advice, good for audit.

  **2. The Internalist Ledger (Motivation-Based)**
  *   **Core:** Reasons must link to what the agent already cares about.
  *   **Ownership:** Strictly individual.
  *   **Pros:** High guidance potential.
  *   **Cons:** Fails Case 2 (Patient has no reason to take meds if they don't care about health). Hard to aggregate weights across people.
  *   **Verdict:** Too narrow for medical/safety advice.

  **3. The Evidence-Based Ledger (Knowledge-Based)**
  *   **Core:** Reasons are facts available to the agent's evidence.
  *   **Ownership:** Attached to agents who know (or should know) the fact.
  *   **Pros:** Solves Case 2 (Doctor has reason, patient doesn't yet). Satisfies Guidance Constraint.
  *   **Cons:** Reasons disappear if evidence is lost.
  *   **Verdict:** **Best fit for an advice system.**

  **4. The Role-Based Ledger (Institutional)**
  *   **Core:** Reasons attach to functions, not people.
  *   **Ownership:** The Role (Case 3).
  *   **Pros:** Solves vacancy issues. Good for organizations.
  *   **Cons:** Fails for personal advice. Hard to weight against personal reasons.
  *   **Verdict:** Use only if advising organizations.

  ### Final Recommendation
  For your specific build: Adopt the **Evidence-Based Ledger** with **Distinct Individuation**.
  1.  **Ownership:** Requires Capacity + Evidence. (Solves Cases 2, 5, 6, 7, 9).
  2.  **Identity:** Reason = Owner + Action + Fact. (Solves Cases 4, 8).
  3.  **Orphans:** Delete them. If no one owns it, it's not advice. (Solves Case 1).
  4.  **Weights:** Normalize to a common metric (e.g., severity of outcome) to allow cross-owner comparison.
