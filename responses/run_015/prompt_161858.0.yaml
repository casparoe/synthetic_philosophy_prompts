      *   **Conflict:** Lease and internal rules forbid commercial use. Dana argues "Sorites Paradox" (no single step crossed the line, so no violation). Chair argues "Reductio ad Absurdum" (if that logic holds, you could dismantle a shop bolt by bolt and never violate).
      *   **Complications:** Previous attempt at a bright-line rule ($200 cap) led to semantic fights. Another member (Marcus) builds/sells frames without enforcement. Dana claims any penalty is arbitrary because the crossing point is unknowable.
