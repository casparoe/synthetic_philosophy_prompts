answer: |-
  Good morning. Or, perhaps more accurately: good morning to the collection of histories, expectations, and biological processes currently occupying these chairs.

  I wanted to start by welcoming you, but I found myself hesitating over the word "I." A standard opening assumes a stable speaker addressing a stable audience. It assumes that the person standing here is the same entity who wrote the notes in my hand, and that you are the same people who walked through the door. But if we take seriously the work that brought us into this room, that assumption is exactly what we're here to trouble.

  For half of you, the phrase "center of narrative gravity" is a familiar tool. You know it as the useful fiction we spin to keep our coherence intact. For the other half, this room might feel different. You know the phenomenon without the label. You know what happens when the spinning stops. You know the moment a patient looks at a photograph of their own wedding and the gravity shifts, slips, or vanishes entirely.

  I'm not here to lecture on the theory, and I'm not here to ask for clinical case studies. I'm here because the theory breaks without the practice, and the practice aches without the theory.

  If the self is a story we tell ourselves, then dementia is not just the loss of memory; it is the collapse of the narrator. But here is where we need to be careful. If we define identity strictly by the internal capacity to narrate, then we are forced to say the person is gone when the story falters. That doesn't match what happens in the ward. It doesn't match what happens in love.

  So, we have to look elsewhere for the center of gravity. When the patient can no longer hold the story, the story doesn't necessarily disappear. It gets caught. It is held across caregivers who know the rhythm of a morning routine better than the patient does. It is preserved in medical files that chart a life in vitals and milestones. It lives in the people who remember fragments—the favorite color, the fear of thunder, the way they held a cup.

  This changes the question we are asking today. We aren't just asking "Who are we?" That's too simple. We are asking whether a self can be scattered without being lost.

  If identity is distributed—if it lives in the network of care and memory around the body—then the dissolution of the mind is not necessarily the dissolution of the person. But that requires us to accept that the "you" and the "I" are more porous than we like to admit. It means acknowledging that sometimes, my gravity is held by you.

  That is why I couldn't offer a standard welcome. Because I am not standing here alone. I am relying on your attention to complete the circuit. Over the next few days, we are going to try to map where that gravity lives when the brain can no longer sustain it. We are going to look at the ethics of holding someone else's story, and the danger of letting it go.

  Let's begin.
