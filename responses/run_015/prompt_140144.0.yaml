answer: |-
  Here are five sharp notes on the draft, addressing your six specific questions within the critique.

  ### 1. The Arithmetic and the "Type M" Mechanism
  Your arithmetic in the Type M example is correct. The decomposition you used is a standard Oaxaca-Blinder decomposition (often used in economics for wage gaps). You correctly identified that if the weights (population mix) are identical across arms, the marginal difference *must* lie between the stratum differences on the risk difference scale.

  However, your claim that Type M in an RCT is "basically always a bug" is slightly too strong. In small samples, randomization allows for chance imbalance. It only becomes evidence of a "broken assignment system" (Sample Ratio Mismatch) when the imbalance exceeds probabilistic bounds (e.g., a chi-squared test on the assignment ratio). If you leave "basically" doing a lot of heavy lifting, it's fine, but a stats-savvy reader will note that randomization guarantees balance only in expectation, not in realization.

  ### 2. The Collapsibility Claim (Critical Error)
  You wrote: *"My understanding is that the risk difference and risk ratio are 'collapsible' and the odds ratio isn't, which is why this can only bite you on the OR."*

  **This is factually incorrect.**
  *   **Risk Difference (RD):** Collapsible. (Marginal RD = Weighted Average of Conditional RDs).
  *   **Odds Ratio (OR):** Non-collapsible. (Marginal OR is biased toward 1.0 relative to Conditional ORs, even with no confounding).
  *   **Risk Ratio (RR):** **Non-collapsible.**

  In your Type S example, the RR *happened* to stay within the range (1.67 is between 1.5 and 2.5), but it is not a weighted average of the stratum RRs ($0.5 \times 2.5 + 0.5 \times 1.5 = 2.0 \neq 1.67$). You are conflating "collapsibility" (mathematical linearity) with "no reversal" (qualitative consistency). RR can and does exhibit Simpson's paradox reversals, though less aggressively than OR.

  **Where the caveat goes:** You must restrict the collapsibility claim to the Risk Difference only. If you keep the RR claim, you will lose credibility with anyone who has opened a causal inference textbook.

  ### 3. Type M vs. Type C: The Distinction Holds
  Your split between Type M (pre-treatment imbalance) and Type C (post-treatment selection) is doing real work.
  *   **Type M** is a problem of **confounding** (in observational data) or **randomization failure** (in experiments). The fix is re-weighting or fixing the bug.
  *   **Type C** is a problem of **mediation** or **collider bias**. The fix is *not* statistical; it's conceptual. You have to decide if you want the Total Effect (aggregate) or the Direct Effect (stratified).

  You are not smuggling in a distinction; you are correctly identifying that conditioning on a pre-treatment covariate (M) vs. a post-treatment covariate (C) invokes different causal graphs. Type C is not a "paradox" in the same sense; it's a specification error. Keeping them separate is useful for engineers because the remediation is different (fix the randomizer vs. define the metric better).

  ### 4. "Effect is a Function"
  This is not new, but your API analogy is excellent. The formal name for this is the **Causal Estimand**.
  Specifically, you are describing the tuple: **(Target Population, Contrast Measure, Intervention Set)**.
  *   (a) Population = The distribution $P(X)$ over which you integrate.
  *   (b) Scale = The link function (identity, log, logit).
  *   (c) Pathways = The $do$-operator vs. conditioning (Total Effect vs. Direct Effect).

  It is "causal-inference-101" (specifically the Potential Outcomes framework), but framing it as "function arguments" is a genuinely useful translation for software engineers. It moves the conversation from "which number is true?" to "which function call did you make?"

  ### 5. The Weakest Part & The Bet
  **The Weakest Part:** Your hot take on Odds Ratios.
  You argue to ban ORs because they are non-collapsible and RDs map to "extra conversions." While RD is collapsible, it is **not invariant to baseline risk**. A 5% RD is massive if the control rate is 6% (83% increase) and negligible if the control rate is 90% (5% increase). If you deploy the feature to a new market with a different baseline conversion rate, the RD will change even if the "mechanism" of the feature is identical. ORs and RRs are often preferred in meta-analysis precisely because they are more stable across populations with different baselines. By advocating for RD only, you are trading mathematical collapsibility for external validity stability.

  **The Single Claim I Would Bet Against:**
  > *"Risk ratio... [is] collapsible"*

  **Why:** It is mathematically false. The Risk Ratio is non-collapsible. If you publish this, a statistician will correct you immediately. The Risk Difference is the *only* common measure that is strictly collapsible over a covariate that is independent of treatment. The fact that your numerical example didn't show a reversal for RR was a property of those specific numbers, not the measure itself.

  ### 6. What's Missing? (The Consequence)
  You missed the **Power Trade-off**.
  Your Type M fix is "disaggregate." Your Type C fix is "decide which effect you want." But disaggregating (stratifying) slices your sample size. If you have 10 strata, you need 10x the sample size to maintain the same statistical power in each, or you must model the strata (regression), which introduces model dependence.
  The "paradox" is often a signal that you don't have enough data to estimate the heterogeneous effects reliably. Sometimes the "lie" of the aggregate is the only statistically significant truth you can afford. A sharp reader will ask: "If I disaggregate to solve Type M, how do I handle the variance explosion?"

  **Summary Recommendation:**
  Fix the Risk Ratio collapsibility claim immediately (acknowledge it's non-collapsible but often behaves better than OR). Nuance the "always a bug" claim for Type M. Add a sentence acknowledging that RDs are baseline-dependent, which is why ORs exist despite their flaws. The "Effect as a Function" framing is your strongest hook—lean into that.
