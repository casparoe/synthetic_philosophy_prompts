  **Procedural Amendment (Round 3)**
  *   **Context:** Your rule requires a tie-breaker.
  *   **Option A (Group Coin):** Flip coin. Heads = Save Group B. Tails = Save Group A.
  *   **Option B (Individual Lottery):** 6 Tickets. 1 Winner. Save the winner's group.
  *   **Vote:** Circle A or B.
