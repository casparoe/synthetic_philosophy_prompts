answer: |-
  # Activity Design: "The Rule and the Abandoned"

  **Time:** 80 Minutes
  **Students:** 14 (Final-year undergraduates)
  **Stakes:** Coffee vouchers (one per student). Losing the simulation = surrendering the voucher to the "pool" (or back to you).
  **Goal:** Elicit the intuition that numbers don't count (Taurek) without naming it, specifically staging the ambiguity of "equal chances."

  ## 1. Logistics & Grouping Adjustment
  **Constraint Note:** You requested groups of four. However, with 14 students, you cannot run an internal **1-vs-5** simulation in groups of four (which requires 6 participants). To ensure the "abandonment" dynamic is real and internal to the group, I recommend **2 Groups of 7**.
  *   **Why:** This allows a 1-vs-6 split (functionally identical to 1-vs-5 for the intuition) where every student is both a rule-maker and a potential victim within their own group.
  *   **If you must keep groups of 4:** You will need to merge groups for the simulation phase, which dilutes the "confrontation" aspect. The plan below assumes **2 Groups of 7** for maximum impact.

  **Materials Needed:**
  *   14 Coffee Vouchers (collected at the start, redistributed at the end based on outcome).
  *   2 Large Sheets of Paper & Markers (one per group).
  *   "Case Cards" (printed, see below).
  *   6 Slips of Paper for the Lottery (Round 3).
  *   1 Coin.

  ---

  ## 2. Timeline & Script

  ### Phase 1: Setup & The Veil (00:00 – 00:15)
  **Action:** Collect vouchers. Tell students they will get them back *unless* the decision rule they author results in them being "left behind."
  **Script:**
  > "We are going to run a simulation. You have a voucher in front of you. I am collecting them. You will get this back at the end of class *unless* the rules you write today dictate that you are the one left behind in the simulation.
  >
  > Divide into two groups. You are now 'Rescue Committees.' Your task is to author a single decision rule for a rescue case.
  >
  > **Constraint 1:** You do not know who will be the 'One' and who will be the 'Five' in the simulation. That is assigned randomly *after* you write the rule.
  > **Constraint 2:** Your rule must be actionable. No 'it depends.'
  > **Constraint 3:** If your rule abandons someone, a representative must look that person in the eye and read the rule to them in the second person ('We are leaving you because...')."

  ### Phase 2: Rule Authoring (00:15 – 00:25)
  **Action:** Groups draft their rule.
  **TA Role:** Circulate. Ensure they write it down. If they say "Save the most," ask: "Is that absolute? What if the harms are different?" (Do not answer, just press).
  **Deliverable:** One sentence on the large sheet.

  ### Phase 3: Round 1 – The Standard Case (00:25 – 00:40)
  **Case Card 1:** *A fire blocks the exit. You can open Door A (1 person trapped) or Door B (5 people trapped). The harm is identical (death). Time allows only one door.*
  **Action:**
  1.  Randomly assign roles within each group (1 "One", 5 "Five", 1 "Observer/Recorder").
  2.  Apply the rule.
  3.  **The Confrontation:** If the rule saves the Five, the Group Spokesperson must stand before the "One" and read the rule.
  4.  **Stakes:** The "One" loses their voucher (temporarily).
  **TA Note:** Watch for discomfort. If they saved the One, ask the Five: "How does it feel to be abandoned by a numbers-based rule?" (Rare, but possible).

  ### Phase 4: Round 2 – Magnitude & Near-Ties (00:40 – 00:55)
  **Action:** Keep roles. Introduce new Case Cards. Ask groups: *Does your rule hold? If not, amend it.*
  **Case Card 2A (Unequal Magnitude):** *Door A (1 person, certain death). Door B (5 people, broken arms).*
  **Case Card 2B (Near-Tie):** *Door A (1 person, loses 50 years of life). Door B (5 people, lose 48 years each).*
  **Action:**
  1.  Groups discuss. Most will amend the rule for 2A (Magnitude trumps Number).
  2.  2B is the stress test. 50 vs 240. Does number count now?
  3.  **Confrontation:** If the rule changes, the "One" from Round 1 might be saved now, or a "Five" might be abandoned. Re-read the rule to the newly abandoned.
  4.  **Stakes:** Update voucher status.

  ### Phase 5: Round 3 – The Chance Trap (00:55 – 01:10)
  **Context:** Assume the group has settled on a rule that treats 1-vs-5 as a tie (or they need a tie-breaker for Round 2B).
  **Script:**
  > "Your rule implies a tie, or requires randomization. You must choose a **Procedural Mechanism** to break it. You have two options. Vote now."
  >
  > **Option A (Group Coin):** Flip a coin. Heads = Save the Five. Tails = Save the One.
  > **Option B (Individual Lottery):** Put 6 names in a hat (1 + 5). Draw one name. Save that person's group.
  >
  > **Action:** Let them vote. 90% will choose Option A (it feels "fairer" to the groups).
  > **The Reveal:** Do not explain yet. Run the mechanism. Assign roles *again* (new randomization).
  > **The Math:** Ask the "One": "What were your odds?" (50%). Ask one of the "Five": "What were your odds?" (50% group chance / 5 people = 10% individual chance).
  > **Script:** "Look at the odds. Option A gave the One a 50% chance of survival. Option A gave each of the Five a 10% chance. Option B gives everyone exactly 1/6. You voted for A. Why?"

  ### Phase 6: Debrief (01:10 – 01:20)
  **Action:** Return vouchers (symbolically, or keep the penalty real if you promised). Move to seminar table. No more groups.

  ---

  ## 3. Debrief Map (Connecting Activity to Argument)

  Do not mention Taurek until the very end. Use their experience to build the premises.

  **1. The Confrontation (Round 1) $\rightarrow$ "No One Loses the Sum"**
  *   **Ask:** "When you read the rule to the One, did you say 'You lose less than the Five'?"
  *   **Point:** They likely said "We had to choose." Taurek's claim: The Five do not suffer a *collective* loss. Only individuals suffer. If you save the One, the Five each lose their life, but there is no "super-loss" of five lives that outweighs the One's loss. The activity made you address the *individual* you abandoned, not the *group* you saved.

  **2. Magnitude Variations (Round 2) $\rightarrow$ Numbers vs. Severity**
  *   **Ask:** "Who changed their rule for the Broken Arms case? Why?"
  *   **Point:** You aggregated *severity* (death > broken arm), but you hesitated to aggregate *numbers* (5 deaths vs 1 death). This suggests numbers do something different than magnitudes. Magnitudes affect the *individual's* loss. Numbers only affect the *count* of losses. If losses aren't summed, numbers shouldn't decide.

  **3. The Chance Trap (Round 3) $\rightarrow$ The Ambiguity of "Equal Chance"**
  *   **Ask:** "Why did you vote for the Coin (Option A) over the Lottery (Option B)?"
  *   **Likely Answer:** "It treats the groups equally."
  *   **The Point:** "Equal Chance" is ambiguous.
      *   *Interpretation 1:* Equal chance for the **groups** to be saved (50/50).
      *   *Interpretation 2:* Equal chance for each **individual** to be saved (1/6 each).
      *   Taurek argues for Interpretation 2. If we care about individuals, giving the One a 50% chance and the Five a 10% chance is discriminatory. But if we choose Interpretation 2 (Lottery), we save the One 5/6ths of the time. The activity forced you to choose Interpretation 1 instinctively, revealing our bias toward "group weighting."

  **4. The "May" vs. "Must" (Closing)**
  *   **Ask:** "Did anyone feel it was *wrong* to save the One in Round 1? Or just *hard*?"
  *   **Point:** The activity likely showed that saving the One is *permissible* (you didn't revolt), even if saving the Five is *preferable*. This maps to the gap between "Must save the five" (Utilitarian) and "May save the one" (Taurek).

  **5. The Reveal (Last 2 Minutes)**
  *   **Script:** "Next week you read John Taurek, 'Should the Numbers Count?' (1977). What you felt today—the resistance to summing lives, the focus on the individual abandoned, the confusion over chances—is the core of his argument. You just reconstructed it."

  ---

  ## 4. Troubleshooting & Predictable Failures

  **1. The "Utilitarian Revolt"**
  *   **Risk:** A group refuses to write a rule that permits saving the One. They write "Always Save the Five."
  *   **Handle:** Enforce the randomization. If the coin lands on "One," they must abandon the Five. Then the *Five* must be confronted. Ask the Five: "Do you feel you lost *more* than the One would have?" This flips the script and often triggers the "loss is individual" intuition.

  **2. The Stakes Feel Too Trivial**
  *   **Risk:** Students laugh off the voucher loss.
  *   **Handle:** Increase social stakes. The "Confrontation" must be silent eye contact for 10 seconds after reading the rule. Make it awkward. The discomfort is the data.

  **3. The Chance Trap Falls Flat**
  *   **Risk:** They immediately spot the math and choose Option B (Lottery).
  *   **Handle:** If they choose Option B, ask: "Why does the One get the same chance as the Five, when the Five are more people?" This forces them to defend the "individualist" view against the "aggregative" view. If they defend Option B, they have already accepted Taurek's premise (individuals are the unit of moral concern).

  **4. Time Overrun**
  *   **Risk:** Round 2 discussions drag on.
  *   **Handle:** Cut Round 2B (Near-Tie) if needed. The "Chance Trap" (Round 3) is the most critical for your specific request. Prioritize that.

  ---

  ## 5. Limitations (What You Must Argue Yourself)

  This activity stages the *intuition*, but it cannot prove the *theory*. You will need to lecture on the following gaps in the debrief or next session:

  1.  **The "Separateness of Persons":** The activity makes them feel this, but doesn't explain *why* we can't sum losses. You need to articulate the metaphysical claim that a "group loss" is a category error.
  2.  **The "Must" vs. "May":** The activity shows saving the One is *permissible* in a simulation. It doesn't prove it's *morally required* to ignore numbers. Students may conclude "Numbers count, but not absolutely." Taurek says "Numbers don't count." You need to bridge that gap.
  3.  **The Scope of "Loss":** In the activity, the loss is a voucher (or hypothetical death). Taurek's argument relies heavily on the incommensurability of life. You need to clarify if this applies to lesser harms (broken arms) or only death.
  4.  **Institutional vs. Personal:** The activity is a "Rescue Committee" (institutional). Taurek often frames this as a personal choice. You may need to discuss if the rule changes if *you* are the rescuer vs. a government policy.

