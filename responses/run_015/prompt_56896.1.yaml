  Furthermore, your worry about Clause (i) is well-founded. Comparing stances by 'cost' is subjective to the observer's computational limits. A Laplacean demon would find the intentional stance useless for everything. Therefore, the principle must be framed not around your predictive inability, but around the system's **explanatory indispensability** given its architecture.

  Here is the principle that best captures your eight verdicts, followed by the cost you must pay to hold it.

  ### The Principle of Integrated Representational Governance

  A system is a genuine believer/agent if and only if:

  1.  **Mediation:** Its actions are causally mediated by internal states that covary with distal conditions (representations), rather than being direct stimulus-response reflexes.
  2.  **Teleological Integration:** These states are integrated into a unified control loop that serves a goal distinct from mere physical equilibrium, such that the system would adjust its actions counterfactually were the world different.
  3.  **Architectural Continuity:** The system possesses a persistent architectural locus for these states. For artefacts, this requires functional integrity; for biological agents of a belief-capable kind, it persists through functional degradation provided the historical continuity of the locus remains.

  ---

  ### Mapping Your Cases to the Principle

  *   **Clause 1 (Mediation)**
      *   **Motivated by:** Case 3 (Roomba) and Case 5 (Hurricane).
      *   **Excludes:** The Roomba (bumper switch is a reflex, not a model of 'stuckness') and the Hurricane (fluid dynamics, no internal state).
      *   **Saves:** Case 1 & 2 (Chess engine has an evaluation function representing board strength) and Case 4 (Legacy system has logic gates representing scheduling rules).

  *   **Clause 2 (Teleological Integration)**
      *   **Motivated by:** Case 6 (Ant Colony) and Case 1 (Chess Engine).
      *   **Excludes:** The Ant Colony. While the colony compares sites, there is no *unified locus* holding the representation. The 'belief' is distributed across pheromones and individual ants, violating the integration requirement.
      *   **Saves:** The Chess Engine and Legacy System. Both have a centralised process (CPU/Algorithm) where the representation and the goal are unified.
      *   **Explains:** Case 8 (LLM). The oscillation occurs because LLMs have internal states (activations) but lack a unified *goal loop* (they predict tokens, they do not act to achieve a distal outcome).

  *   **Clause 3 (Architectural Continuity)**
      *   **Motivated by:** Case 7 (Grandmother) and Case 2 (Explained Engine).
      *   **Excludes:** Nothing directly, but it clarifies why Case 2 survives explanation (the architecture is robust) while Case 3 collapses (the architecture is trivial).
      *   **Saves:** Case 7. The Grandmother's brain is the correct *kind* of locus. Even if the data is corrupted (false beliefs), the architectural capacity for governance remains, secured by her history as a person.
      *   **Saves:** Case 4. The Legacy System is opaque, but we assume the architecture exists.

  ---

  ### Application to New Cases

  1.  **A satellite's attitude-control system:**
      *   **Verdict:** **Genuine Believer.**
      *   **Reasoning:** It satisfies Mediation (sensors represent orientation), Teleological Integration (thrusters fire to maintain a goal state), and Architectural Continuity (unified computer). It is functionally isomorphic to your Chess Engine.

  2.  **A central bank's stated expectations about inflation:**
      *   **Verdict:** **Shorthand.**
      *   **Reasoning:** Fails Integration. The 'bank' is a collection of people and models. There is no single neural or silicon locus where the 'expectation' resides. It is a Case 6 (Ant Colony) scenario at a higher level of abstraction.

  3.  **A cuttlefish matching the seabed:**
      *   **Verdict:** **Genuine Believer.**
      *   **Reasoning:** Satisfies all three. It is a biological individual (Continuity), using visual input to mediate skin texture (Mediation), for the goal of camouflage (Teleology). Unlike the Ant Colony, the locus is the single animal.

  4.  **A neural network whose weights and training data I can inspect exhaustively:**
      *   **Verdict:** **Shorthand (with oscillation).**
      *   **Reasoning:** Similar to your Case 8 (LLM). It has Mediation (weights encode patterns) but lacks Teleological Integration in the robust sense; it minimises loss functions during training, but during inference, it does not 'pursue' a goal, it merely computes. Your intuition to withdraw the attribution upon inspecting weights is correct under this principle: you see the statistics, not the governance.

  5.  **A person acting on a post-hypnotic suggestion:**
      *   **Verdict:** **Genuine Believer (but compromised).**
      *   **Reasoning:** Satisfies Continuity (it is a human). Mediation is present but the 'goal' is externally implanted. This is a edge case similar to the Grandmother: the architecture is intact, but the governance is hijacked. You should attribute belief, but note the source of the desire is alien to the agent's usual integration.

  6.  **A dead relative's estate as described in their will:**
      *   **Verdict:** **Shorthand.**
      *   **Reasoning:** Fails Continuity. The locus (the person) is gone. The will is a static artefact (like the Legacy System) but without the active control loop to adjust to new conditions. It cannot be 'misinformed' or 'corrected', only executed or litigated.

  ---

  ### The Cost: Which Verdict Must You Surrender?

  You asked me to be explicit about the cost. A principle that saves all eight of your verdicts without becoming baroque is not possible. The tension lies between **Case 1 (Chess Engine)** and **Case 6 (Ant Colony)**.

  **I recommend you overturn Case 6.**

  **Why:** Your refusal to grant belief to the Ant Colony, while granting it to the Chess Engine, relies on a intuition that 'individuality' matters more than 'functional capacity'. The Ant Colony *does* compare sites information-sensitively. It *does* adjust behaviour based on environmental data. It *does* have a goal (survival/relocation).
  Under the **Principle of Integrated Representational Governance**, the only thing excluding the Ants is the 'Unified Locus' clause. But if you accept the Chess Engine (silicon, distinct from biology) as a believer, you have already accepted that biology is not required. If you accept that a distributed software system (Legacy Case 4) can be a believer, you have accepted that physical contiguity is not required.
  The Ant Colony is the pressure point. If you ever encounter a 'hive mind' AI that functions like the ants but runs on a single server, your principle will break.

  **The Measurement Problem (Clause i):**
  You asked if the inability to measure 'cost' is fatal. It is not fatal, but it renders the principle **observer-relative**. A system is a believer *to you* if the intentional stance is indispensable *for you*. This means belief is not a intrinsic property like mass, but a relational property like 'digestible'. This may feel unsatisfying, but it is the only way to reconcile your verdict on the Legacy System (Case 4). It is only a believer because *we cannot explain it physically*. If a super-intelligence could predict it via fluid dynamics of electrons, it would cease to be a believer to them. You must accept that your 'literal truth' is indexed to your cognitive limitations.

  ### Final Recommendation

  Adopt the **Principle of Integrated Representational Governance**, but amend your view on **Case 6 (Ant Colony)**. Either admit the colony is a believer (accepting distributed loci), or admit the Chess Engine is shorthand (denying non-biological loci). Given your verdict on the Legacy System (Case 4), consistency demands you treat the Ant Colony as a believer. The 'colony' is the unified locus, the ants are the neurons.

  If you refuse to budge on the Ants, you are holding a **Biological/Individual Chauvinism** that contradicts your realism about the Chess Engine. You cannot have it both ways without a baroque exception clause for 'swarms'.

  **Confidence:** High. This principle captures 7/8 of your verdicts perfectly and identifies the precise philosophical fault line in the 8th.
