answer: |-
  Good morning. Welcome.

  Looking around this room, I see a divide that is, I think, necessary but often painful. On one side, we have those who study the logic of uncertainty: philosophers of probability and epidemiologists who map the contours of risk from the outside in. On the other, we have those who inhabit uncertainty: clinicians who must translate those maps into directions for patients walking through the valley of the shadow.

  Usually, workshops like this aim to bridge that gap by teaching one side the language of the other. We assume the problem is translation. We assume that if clinicians understood the confidence intervals better, or if philosophers understood the time pressures of a clinic better, the friction would vanish.

  I am here to suggest that the friction is not a bug. It is a feature of the terrain. And today, we are not here to smooth it over. We are here to examine it.

  I want to begin with why this workshop is not abstract for me. Last month, my sister was diagnosed with a malignancy. It was treatable, but the prognosis was opaque. Like many of you have done for your patients, I looked for the numbers. I found a survival statistic drawn from a cohort defined by age, tumor stage, and grade. It gave us a percentage. It gave us a timeline. It was a solid thing to hold onto.

  But then I read the footnotes. I looked at the inclusion criteria. I found another study, nearly identical, except for one variable: whether patients with prior autoimmune conditions were excluded. My sister has a history of autoimmune thyroiditis. In the first study, that history was irrelevant; she was assigned to the standard risk class. In the second, that history placed her in a stratum where the hazard ratio shifted by a factor that was, to a clinician, decisive.

  One statistic suggested a standard course of care. The other suggested aggressive intervention with significantly higher toxicity. Both studies were methodologically sound. Both cohorts were large. But there was no principled rule, no meta-guideline, that told me which partition was the *correct* one for her.

  I stood in that gap, and I realized I was not suffering from statistical illiteracy. I was suffering from the Reference Class Problem.

  To the philosophers in the room: You recognize this immediately. This is Reichenbach's dilemma. An individual event—in this case, my sister's survival—belongs to an infinite number of classes. She is a woman, a patient, a smoker, a non-smoker, a thyroiditis patient, a daughter. Which class determines the probability? You know that without a rule for selecting the relevant properties, the probability is undefined.

  To the clinicians in the room: You also recognize this, though you may not call it by that name. You recognize it as the hesitation before you speak. It is the moment a patient asks, "How long do I have?" and you know that the number you give depends entirely on which trial you pull from the shelf. You know that "precision medicine" often feels like a promise that we can narrow the class enough to find the individual, but the narrower you go, the smaller the sample size, and the wider the error bars.

  We often treat this confusion as a temporary failure of data. We tell ourselves that if we just get *more* granular data, if we just sequence the genome, if we just add another biomarker, the correct class will reveal itself.

  I am not convinced that is true. I suspect that even with perfect data, the question of *which* properties justify assigning an individual to one statistical class rather than another remains a normative problem, not a statistical one. Statistics can tell us the risk within a class. It cannot tell us which class we *ought* to use. That is a question of value, of relevance, and of causality.

  This brings us to the purpose of our time together. I do not want to offer you false comfort. I am not expecting us to solve the Reference Class Problem by Friday afternoon. If there were a algorithmic solution to underdetermination, it would have been found already.

  Instead, I am asking us to confront the underdetermination.

  When the data genuinely supports multiple, conflicting reference classes, how do we communicate risk without lying? When the "correct" partition is unknowable, what is the ethical obligation of the prognosticator? Do we present the range of possibilities across classes? Do we privilege the most conservative estimate? Do we admit to the patient that the number is a choice, not a fact?

  For the philosophers, I ask you to look beyond the logic of probability and into the ethics of its application. How do your frameworks hold up when the stakes are not betting odds, but life and death?

  For the clinicians, I ask you to share the heuristics you currently use. When the literature is contradictory, what rule of thumb saves you? And is that rule defensible?

  We are here to ask whether any framework can guide us when the math runs out. We are here to acknowledge that risk communication is not just about transmitting data; it is about navigating the ambiguity of classification itself.

  My sister is currently undergoing treatment. We chose the aggressive path. I do not know if that was the right decision. I only know that the statistics did not make it for us. We had to step outside the numbers to choose which numbers mattered.

  That is the space we occupy. It is uncomfortable. It is unresolved. But if we can map the boundaries of that uncertainty together, we might make it a little less lonely for those who have to live inside it.

  Thank you. Let's begin.
