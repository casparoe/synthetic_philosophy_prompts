          *   Do *not* explain craft terms (the user is fluent).
          *   Focus on the *translation* fidelity: where does the philosophy map to craft, where is it an approximation, where does it resist translation?
          *   Organize around five specific difficulties provided by the user.
          *   End with a conclusion on what the debate offers the novelist (technique, lacuna, or unrepresentability).
      *   **Tone:** Professional, precise, respectful of the user's expertise, avoiding condescension or unnecessary preamble.

  2.  **Deconstruct the Five Difficulties:**

      *   **1. Cardinality and Intensity:**
          *   *Philosophy:* Aggregation relies on $N \times h > H$ (Number times small harm > One large harm).
          *   *Craft:* Intensity is scalable (vividness, pacing). Cardinality is not (reader fatigue, page budget).
          *   *Translation:* The novel cannot sum. It can only iterate. Iteration leads to boredom, not moral weight.
          *   *Verdict:* The novel is structurally blind to cardinality. This isn't a defect of the novel; it's a feature of human attention. The philosophical quantity is abstract; the novelistic quantity is experiential.

      *   **2. The Harm Below Threshold:**
          *   *Philosophy:* The harm must be *truly* negligible individually to make the aggregation puzzle work.
          *   *Craft:* To show is to magnify. A sentence devoted to a dust speck makes it matter.
          *   *Translation:* "Showing" violates the premise of "negligibility." To represent the harm is to falsify its scale.
          *   *Verdict:* You cannot show a negligible harm without making it significant. This suggests the aggregative claim relies on an abstraction that narrative realism destroys.

      *   **3. Synecdoche:**
          *   *Philosophy:* Aggregation claims the *sum* matters, not the representative.
          *   *Craft:* Synecdoche (one victim for many) creates emotional resonance.
          *   *Translation:* Using a representative victim to argue for the *crowd's* weight is a category error. It leverages identified-victim bias to argue against identified-victim bias.
          *   *Verdict:* Deploying synecdoche to prove aggregation concedes the point to the "one victim" side. It proves the power of the individual, not the sum.

      *   **4. Vividness (Sensory vs. Centrality):**
          *   *Philosophy:* Identified Victim Effect (psychological bias).
          *   *Craft:* Distinguish *Sensory Resolution* (zoom lens) from *Narrative Centrality* (plot importance).
          *   *Translation:* We can have high sensory/low centrality (background extras) or low sensory/high centrality (offstage king). The asymmetry trades on *Centrality*, not just Sensory.
          *   *Verdict:* Separating them clarifies that the moral weight comes from *relationship* (centrality), not just *texture* (sensory). Philosophy often conflates these as "salience."

      *   **5. Tragedy vs. Statistic:**
          *   *Philosophy:* Statistic is the truth; Tragedy is the bias.
          *   *Craft:* Statistic is exposition; Tragedy is scene.
          *   *Translation:* Is the "bias" actually the *only* way humans access moral truth? If the novel corrects the bias, does it become inhuman?
          *   *Verdict:* The disagreement is deeper. The novelist accesses truth through particularity; the philosopher accesses it through generality. Correcting the bias might kill the novel's moral engine.

  3.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the constraint. No preamble, straight into the translation.
      *   *Section 1 (Cardinality):* Focus on the "Page Budget." The novel operates in *sequence*, philosophy in *simultaneity*. The sum is a concept; the scene is an event.
      *   *Section 2 (Threshold):* Focus on "Showing vs. Telling." To show the speck is to lie about its weight. The "approximation" fails here.
      *   *Section 3 (Synecdoche):* Focus on "Representative Victim." If you make us cry for One to save the Many, you've proven the One matters more. The craft tool undermines the philosophical goal.
      *   *Section 4 (Vividness):* Distinguish "Texture" (sensory) from "Stakes" (centrality). The Identified Victim Effect is about *Stakes*.
      *   *Section 5 (Tragedy/Statistic):* Focus on "Exposition vs. Scene." The statistic is the summary; the tragedy is the scene. The novel *is* the bias.
      *   *Conclusion:* What does this give the novelist? It's not a technique gap. It's an ontological limit. The novel cannot do utilitarian math. It must confess this limitation.

  4.  **Refining the Vocabulary:**
      *   Ensure terms like *narrative distance*, *page budget*, *sensory resolution*, and *synecdoche* are used precisely as the user defined them.
      *   Avoid philosophical jargon (e.g., "consequentialism," "lexical priority") unless translated immediately.
