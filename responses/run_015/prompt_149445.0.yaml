answer: |-
  Here is the translation of the aggregative debate into your vocabulary, organised around the five difficulties you specified.

  **First, cardinality and intensity.**
  In craft terms, intensity is a function of *sensory resolution* and *pacing*; you can deepen the focus or slow the time to increase moral weight. Cardinality, however, is a function of *page budget* and *sequence*. A novel unfolds in time; it cannot present eleven million instances simultaneously. It must iterate. But iteration is the enemy of drama: the second dust speck is a motif, the third is a pattern, the tenth is boredom. Reader fatigue sets in long before the sum approaches the moral weight of the torture.

  The aggregative verdict depends on a quantity (the sum) that the novel is structurally unable to denote without collapsing into exposition. This is not a defect of the novel; it is evidence that the quantity is not the sort of thing a human consciousness can inhabit. The novel operates in the *experiential*; the aggregation principle operates in the *conceptual*. Where the philosophy sees a sum, the craft sees a rhythm. If you try to write the cardinality, you destroy the intensity. The translation fails here: the novel can show the depth of the well, but it cannot show the width of the ocean.

  **Second, the harm below the threshold of notice.**
  To render a harm in a scene is to grant it *narrative centrality*. Even a blink requires a subject, a verb, and a moment of reader attention. In craft, attention is currency; to spend it is to assert value. If you write the sentence "It felt like a dust speck," you have already elevated the speck above the background noise of the city. You have turned a statistical nuisance into a *detail*.

  There is no novelistic means of representing a harm that is beneath notice without turning it into a noticeable one. "Showing" is inherently magnifying. If you choose "telling" (exposition), you lose the sensory resolution required to make the reader feel the weight. This implies that the aggregative claim survives only as an approximation in fiction. The claim requires the harm to be zero-ish for the individual; the novel requires the harm to be non-zero for the reader. To make the argument legible, you must falsify the premise.

  **Third, synecdoche.**
  The synecdochic victim is a tool of *identification*, not *addition*. When you build a character to stand for the eleven million, you are inviting the reader to care about *that one*, not the *many*. If the reader accepts the trade-off because they weep for the representative victim, they have accepted the logic of the identified victim, not the logic of aggregation.

  Deploying synecdoche in the service of an aggregative conclusion concedes what the argument needs to prove. It smuggles the moral weight of the One into the account of the Many. It is a bait-and-switch: you ask the reader to feel the weight of the crowd by making them love a single person. This is not a translation of the philosophical argument; it is a circumvention of it. The craft tool validates the anti-aggregative intuition it was meant to overcome.

  **Fourth, vividness (sensory resolution vs. narrative centrality).**
  The asymmetry in our response to identified victims trades primarily on *narrative centrality*, not sensory resolution. We can be devastated by a death reported in a single sentence of exposition if the victim is the protagonist (high centrality, low sensory). We can be indifferent to a gruesome murder in a crowd scene if the victim is a background extra (high sensory, low centrality).

  Keeping them apart alters the philosophical argument significantly. Philosophy often treats "salience" as a monolithic bias. Craft reveals it as two distinct levers. You can manipulate sensory resolution (make the dust speck itch) without granting narrative centrality (the character shrugs it off). However, without centrality, the sensory detail remains "weather." To make it "moral weight," you must grant centrality. But if you grant centrality to the crowd, you have no room for the tortured individual. The asymmetry is not a glitch in perception; it is a constraint of *narrative bandwidth*. You cannot give high centrality to eleven million people.

  **Fifth, tragedy and statistic.**
  The novelist's temptation is to treat the statistic as a failure of imagination; the philosopher's temptation is to treat the tragedy as a failure of arithmetic. In craft terms, "tragedy" is *scene*; "statistic" is *summary*. The saying "one death is a tragedy, a million is a statistic" translates to: "Scene carries moral weight; summary carries information."

  The disagreement goes deeper than habit. It is a disagreement about the locus of truth. The novel asserts that truth resides in the *particular* (the scene). The aggregative argument asserts that truth resides in the *total* (the summary). If you correct the bias by making the statistic feel like a tragedy, you are not fixing a bug in the reader; you are breaking the engine of the novel. You are asking the reader to feel a summary as if it were a scene. This is not a bias to be corrected; it is the medium's ontology.

  **Conclusion: The Residue Report**
  The debate gives you no new technique. There is no narrative device that allows a reader to sum eleven million trivialities into a catastrophe greater than a torture. The residue points to a real lacuna in what a novel can express.

  The aggregative claim is a claim about *architecture*; the novel is a medium of *inhabitation*. You cannot inhabit a sum. If you attempt to force the reader to feel the weight of the eleven million, you will either exhaust their sympathy (fatigue) or falsify the harm (magnification).

  The honest novel must concede that some moral facts are unrepresentable and say so in its own voice. Your book cannot prove the policy right through the reader's experience, because the reader's experience is structurally aligned with the One, not the Many. The drama, therefore, cannot be "Which choice is right?" (the reader will always choose the One). The drama must be "What does it cost the Ministry to choose the Many, knowing the novel cannot justify it?"

  The moral weight you seek is not in the suffering of the eleven million, but in the *silence* required to enact it. The novel cannot show the weight of the dust specks; it can only show the coldness of the hand that sweeps them aside. The unrepresentability is not a failure of your craft; it is the subject of your book.
