      *   *Check:* The "Residue Report." Make sure the conclusion addresses the "unrepresentable" aspect strongly.

  6.  **Final Polish:** (Mental check of the "Dust Speck" analogy). The core tension is that narrative *attention* confers *value*. Philosophy tries to separate them. The novel cannot. This is the crux. I need to make sure this threads through all five points.

      *(Self-Correction on Point 4)*: The user asks which vividness the asymmetry trades on. I need to be precise. It trades on *Centrality*. Sensory resolution without centrality is just description. Centrality without sensory resolution is still tragic (e.g., a letter about a death). I need to make sure this distinction is clear.

      *(Self-Correction on Point 5)*: The user asks which is right. I shouldn't take a side but explain the depth of the disagreement. The "bias" is the novel's medium.

      *(Final Conclusion)*: The prompt asks: "whether there is a technique I lack, whether the residue points to a real lacuna... or whether the honest novel must concede..." I need to pick one or nuance the relationship between them. The strongest answer is likely the third: the novel must concede the unrepresentability.

