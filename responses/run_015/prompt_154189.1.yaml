      *   **Critique of Scope:** 6,000 words is tight for three complex domains. Suggest focusing on the *migration* between two rather than the static analysis of three.
      *   **Critique of Method:** The idea of a "criterion" needs careful handling to avoid dogmatism (un-Wittgensteinian). Suggest framing it as identifying "points of friction" or "conditions of intelligibility."
      *   **Specific Adjustments:**
