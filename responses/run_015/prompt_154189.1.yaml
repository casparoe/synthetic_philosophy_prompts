      *Self-Correction on "Criterion":* I need to warn the student that Wittgenstein might reject the idea of a "standard" for legitimate extension. The project should frame this carefully, perhaps as elucidating the *conditions of intelligibility* rather than a prescriptive standard.

      *Final check on summary format:* `Summary: [one sentence]`. No extra text after.

      *Wait, one more thing:* The prompt asks for an "honest assessment... and what adjustments would make it tractable." I need to make sure I answer that directly.

