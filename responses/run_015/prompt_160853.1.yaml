prompt: |-
  hey — I'm a TA for a second-year ethics course and I need to make a one-page handout for my discussion section on whether the numbers count in rescue cases, and I want it as an actual decision tree / flowchart rather than prose, because I tried prose last year and everyone just picked a label and defended it. Background that prompted this: my roommate (shes in an effective-altruism-adjacent reading group) and I got into a huge argument about the basic case where you can either save one stranger or five, everyone dies otherwise, and we kept talking past each other because "the numbers count" turned out to mean about four different things to her — that its required, that its merely permitted, that each extra person adds a full extra unit of moral weight, that the verdict survives even when what each of the five loses is tiny — and none of those was quite what I meant.

  So: build me a tree that starts from that bare case and takes a student to a named position, but build it from the logical space instead of from a list of names — i.e. figure out the branching questions first, see which combinations of answers are actually available, then drop the real views into the slots and tell me which slots are empty and why (incoherent? just unattractive? nobodys bothered to explore it?). Every node has to be a question a student can answer without already knowing where it leads — concrete cases, not "do you think numbers matter?" — and no node should be answerable by just restating a theory name. Aim for roughly 12-14 branch nodes and 8-10 leaves. Leaves I want on there somewhere: straight aggregationism, the Taurek-style view that each persons loss matters to them but losses dont add across people, an equal-chances / lottery view, the contractualist-style pairwise-comparison view, some kind of priority-to-the-worst-off view, and at least one leaf marked unnamed if nobody really holds it. Each leaf gets one sentence on its single most awkward commitment.

  Things I definitly want the tree to be able to separate, since these are the places I think my students will actually disagree: (a) whether saving the five is required vs. merely permitted vs. required-but-blameworthy-to-skip — I want that as its own early branch, because I suspect almost everyone agrees its permitted and the real fight is elsewhere; (b) whether the five-vs-one verdict survives when the per-person loss on the many side is small (five stubbed toes vs. one broken arm; or five people each losing a finger vs. one person losing a hand, where the hand matters more to its owner than any single finger does to its owner but arguably less than all five fingers together) and whether it survives when the ratio gets huge while the per-person loss stays the same — I want tiebreak-only views separated from additivity views separated from anything-goes-no-matter-how-tiny views; (c) standpoint: does the answer change if you are the one, one of the five, the rescuer, or an uninvolved official writing the policy a year in advance, and is there a coherent view were the one may save himself while a bystander must save the five; (d) certainty vs. risk, i.e. five people each with a 20 percent chance of dying versus one person certain to die, plus the case where the five are asleep and will never know they were ever in danger; (e) whether the losses can even be put on a single interpersonal scale at all, or only ordinally ranked, which I think should get its own incommensurability leaf. Also flag any two leaves your tree genuinely cannot pull apart rather than fudging it, and add a short closing section with two or three nasty follow-up cases I can spring on students who land on the same leaf but clearly mean different things by it. Dont bother with citations or a bibliography — name positions and their rough ancestry if useful, but no page references, I'll fill those in myself.
