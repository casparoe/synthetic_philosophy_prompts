answer: |-
  # DISCUSSION HANDOUT: DO THE NUMBERS COUNT?
  **Case:** You can save **1 stranger** (certain death) OR **5 strangers** (certain death). You cannot save both. All are otherwise identical.

  ### THE DECISION TREE

  **NODE 1:** Is it **morally wrong** to save the 1 instead of the 5?
  *   **NO** → Go to Node 2.
  *   **YES** → Go to Node 3.

  **NODE 2:** If it is not wrong, do you still owe the 5 a **fair chance** (e.g., flip a coin)?
  *   **YES** → **LEAF A: Equal Chances / Lottery View.**
  *   **NO** → **LEAF B: Taurek-Style (No Summing).**

  **NODE 3:** Why is it wrong? Is it because the **total amount of harm** is greater, or because you **wrong specific individuals**?
  *   **Total Harm** → Go to Node 4.
  *   **Wrong Individuals** → Go to Node 6.

  **NODE 4:** Does the "Total Harm" verdict hold if the 5 lose **fingers** and the 1 loses a **life**?
  *   **NO** → Go to Node 7.
  *   **YES** → Go to Node 5.

  **NODE 5:** Does the verdict hold if the 5 lose **micro-harms** (e.g., dust specks in eyes) and the 1 loses a **life**?
  *   **NO** → **LEAF C: Moderate Aggregation (Threshold).**
  *   **YES** → Go to Node 9.

  **NODE 6:** Can the 5 **combine their claims** to outweigh the 1, or must *each* of the 5 have a claim stronger than the 1's alone?
  *   **Combine** → Go to Node 8.
  *   **Each Alone** → **LEAF D: Contractualist (Pairwise Comparison).**

  **NODE 7:** Is the threshold based on the **type of harm** (death trumps injury) or the **status of the person** (the worst-off trumps the better-off)?
  *   **Type of Harm** → **LEAF E: Lexical Threshold.**
  *   **Status of Person** → **LEAF F: Priority to the Worst-Off.**

  **NODE 8:** If claims combine, do they aggregate **linearly** (5x claim) or **diminishingly** (5x claim < 5x value)?
  *   **Linearly** → **LEAF G: Claim Aggregation (Unnamed/Rare).**
  *   **Diminishingly** → **LEAF H: Moderate Contractualism.**

  **NODE 9:** (For Aggregators) Does the answer change if **you are the 1**? May you save yourself while a bystander must save the 5?
  *   **YES (I save me)** → **LEAF I: Agent-Relative Prerogative.**
  *   **NO (Impartial)** → Go to Node 10.

  **NODE 10:** Does the answer change if the 5 face a **20% risk each** vs. the 1 facing **100% certainty**?
  *   **YES (Certainty matters more)** → **LEAF J: Risk-Averse Aggregation (Unnamed).**
  *   **NO (Expected Value)** → Go to Node 11.

  **NODE 11:** Does the answer change if the 5 are **asleep** and will never know they were in danger?
  *   **YES (Knowledge matters)** → **LEAF K: Subjective Harm View.**
  *   **NO (Objective Harm)** → Go to Node 12.

  **NODE 12:** Can a finger be converted into a **fraction of a life** mathematically on a single scale?
  *   **NO** → **LEAF L: Incommensurability View.**
  *   **YES** → **LEAF M: Straight Aggregationism (Utilitarian).**

  **NODE 13:** (Tie-Break Check) Do numbers count **only** if the harm to the 1 and the 5 is *exactly* equal?
  *   **YES** → **LEAF N: Tie-Break Only View (Unnamed).**
  *   **NO** → (Return to Node 4 or 5 depending on prior path).

  ---

  ### POSITION MAP & AWKWARD COMMITMENTS

  | Leaf | Position Name | The Single Most Awkward Commitment |
  | :--- | :--- | :--- |
  | **A** | **Equal Chances** | You must flip a coin even if the 5 will suffer slightly more pain than the 1. |
  | **B** | **Taurek-Style** | It is not wrong to let 5 die to save 1, provided you didn't choose the 5 *because* there were more of them. |
  | **C** | **Moderate Aggregation** | Saving 5 lives trumps 1, but saving 5 fingers does not, even if the 5 fingers belong to 5 different people. |
  | **D** | **Contractualist** | You cannot save the 5 if the 1's loss is *slightly* greater than any single one of the 5's losses, regardless of the total. |
  | **E** | **Lexical Threshold** | A million stubbed toes never outweigh one broken arm, because "death/injury" categories cannot cross. |
  | **F** | **Priority View** | You should save the worse-off person even if the total benefit to the group is significantly lower. |
  | **G** | **Claim Aggregation** | **(UNCOMMON)** Individuals can pool moral claims like money, but this risks treating people as mere containers for value. |
  | **H** | **Mod. Contractualism** | **(UNCOMMON)** Claims aggregate but diminish, requiring complex math to determine when a group outweighs an individual. |
  | **I** | **Agent-Relative** | A bystander is required to save the 5, but you are permitted to save yourself; morality splits based on who acts. |
  | **J** | **Risk-Averse** | **(UNCOMMON)** It is better to save 1 certain death than 5 people at 20% risk, even though expected deaths are equal. |
  | **K** | **Subjective Harm** | Saving unconscious victims is less urgent than saving conscious ones, because they don't experience the "relief." |
  | **L** | **Incommensurable** | There is no rational answer to the 1-vs-5 case because "life" and "fingers" share no common currency. |
  | **M** | **Straight Aggregation** | A sufficiently large number of dust specks in eyes morally outweighs one person's death. |
  | **N** | **Tie-Break Only** | **(UNCOMMON)** Numbers never justify imposing a greater loss on the 1; they only decide ties when losses are identical. |

  ---

  ### INDETERMINATE SLOTS
  *   **Leaves C (Moderate Aggregation) & H (Mod. Contractualism):** In practice, these often yield the same verdicts (save the 5 lives, save the 1 arm). The tree separates them by *justification* (summing harm vs. pooling claims), but students may find the practical difference negligible.
  *   **Leaves J (Risk-Averse) & D (Contractualist):** Both often prioritize the certain victim over the probabilistic many, but for different reasons (risk weighting vs. individual complaint strength).

  ### NASTY FOLLOW-UP CASES
  *Use these on students who land on the same leaf but seem to mean different things.*

  1.  **The Transplant Variant:** You can kill 1 healthy patient to harvest organs and save the 5 dying patients.
      *   *Target:* **Straight Aggregation (M)** & **Priority (F).** If they said "Yes" to the rescue case, do they say "Yes" here? If not, what is the relevant difference? (Constraint vs. Option?)
  2.  **The Identifiable Victim:** The 1 is a named child in a well; the 5 are statistical victims of a policy change.
      *   *Target:* **Contractualism (D)** & **Equal Chances (A).** Does "identifiability" change the strength of a claim or the fairness of a lottery?
  3.  **The Family Member:** The 1 is your child; the 5 are strangers.
      *   *Target:* **Agent-Relative (I).** If they said "I can save myself," do they also say "I can save my child"? If not, why is self-preference permitted but kin-preference not?
