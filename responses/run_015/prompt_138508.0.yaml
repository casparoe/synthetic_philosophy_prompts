answer: |-
  **Insect Impact Assessment Procedure (Draft v1.0)**

  **Q1: Which welfare levers does the intervention pull?**
  Identify quantitative changes in: (A) Total Individuals, (B) Average Lifespan, (C) Death Severity.
  *   **Sufficient Answer:** Bounded estimates for each lever (e.g., "Count increases 10x," "Death severity reduces").
  *   **Stop:** If data is unavailable, assume status quo.

  **Q2: Does compensatory mortality negate the change?**
  For r-selected species, does sparing or killing individuals now alter total lifecycle deaths due to density dependence?
  *   **Sufficient Answer:** Ecological model or expert consensus on carrying capacity.
  *   **Stop:** If net change in total deaths is negligible, approve automatically (no impact).

  **Q3: What is the Sentience Flip Point?**
  Calculate the probability of sentience ($P$) at which Expected Harm exceeds Expected Benefit. Do not select $P$; report the threshold required to justify the action.
  *   **Stop with a No:** If the threshold $P$ is below institutional risk tolerance (e.g., <0.01), the risk of moral error is too high. Recommend rejection.
  *   **Handoff to Human:** If the threshold $P$ lies within credible scientific debate (e.g., 0.01–0.5), the decision is values-based. Proceed to Q4.

  **Q4: Is the trade-off acceptable?**
  Compare the Flip Point against institutional risk tolerance regarding moral uncertainty.
  *   **Handoff:** Committee vote. This is not a factual question.

  ***

  **Case Applications**

  **1. BSF vs. Cricket Protein Bar**
  *   **Levers:** BSF increases Count (A), decreases Lifespan (B), increases Death Severity (C) (boiling). Benefit: Reduced field vertebrate death via feed efficiency.
  *   **Density:** Rearing conditions negate wild density effects; net count increase is real.
  *   **Flip Point:** Requires weighing vertebrate field deaths against high insect counts.
  *   **Verdict:** **Handoff.** The flip point depends on cross-species welfare weighting. Committee must decide if feed efficiency outweighs increased insect throughput.

  **2. Turf to Pollinator Meadow**
  *   **Levers:** Massive increase in Count (A). Lifespan (B) remains short. Death (C) remains natural/predation.
  *   **Density:** Creating habitat raises carrying capacity; compensatory mortality does not negate the existence of new subjects.
  *   **Flip Point:** Under a suffering-minimization framework, creating billions of short-lived subjects generates massive expected harm units. The probability of sentience required to veto this is low.
  *   **Verdict:** **No.** Unless the committee explicitly values biodiversity over welfare aggregation, the scale of potential suffering dwarfs the benefit. This will be unpopular.

  **3. Moth Euthanasia (Freezing vs. Rapid)**
  *   **Levers:** Count (A) is negligible. Lifespan (B) unchanged. Death (C) is the only variable.
  *   **Density:** Irrelevant (teaching collection).
  *   **Flip Point:** Extremely low. Even a tiny probability of sentience makes reducing death severity paramount.
  *   **Verdict:** **Pass.** Switch to rapid method. The flip point is below any reasonable threshold for doubt.

  ***

  **Note to VP:** This procedure isolates factual uncertainties (Q1–Q3) from value judgments (Q4). Where the Flip Point is low, we act precautionarily. Where the scale creates astronomical harm units (Case 2), we must acknowledge that "sustainability" may conflict with "welfare" under high-uncertainty sentience models. We are not spending the entire budget on cricket welfare because the Flip Point for most interventions remains above our risk tolerance; however, where the scale is vast and the harm clear, the procedure demands we acknowledge the cost.
