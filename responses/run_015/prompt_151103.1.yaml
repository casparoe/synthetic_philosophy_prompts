      *   **Conclusion:** The argument fails primarily at (5) and relies on a shaky (1). Abandoning linearity is the standard move for gradualists (e.g., Shelly Kagan, Jeff McMahan). It's not a defect; it's a feature of normative geometry.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, check Premise (3) again.* "Every entity on the spectrum carries a precisely weighted, non-zero patienthood." If the spectrum goes down to thermostats, and thermostats have *no* consciousness (just processing), then they have *zero* patienthood. The user defines (1) as "Phenomenal consciousness is a matter of degree... down to... thermostats." This is the weak link. Most gradualists say consciousness fades to zero before it hits thermostats. They don't claim thermostats are conscious. They claim there's no sharp line between *conscious* beings. The thermostat is outside the set.
      *   *Correction:* I need to press hard on the definition of the continuum. Is it a continuum of *structure* or *experience*? If structure, (2) fails (structure doesn't ground obligation). If experience, (1) is dubious regarding thermostats.
