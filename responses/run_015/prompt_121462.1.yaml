answer: |-
  # Session Plan: The Non-Identity Problem in Public Health Policy
  **Target Audience:** Master's students (Epidemiology/Health Policy)
  **Duration:** 75 Minutes
  **Goal:** Enable students to identify "identity-entangled" arguments in their policy briefs and assess their robustness.

  ---

  ## 00:00 – 00:10 | Introduction & The Policy Hook
  **Activity:** Brief lecture + Q&A.
  **Content:**
  1.  **Context:** Acknowledge their upcoming brief (Lead Abatement/Folate). State the session goal: "Stress-testing your arguments against a specific logical failure mode."
  2.  **The Harm Principle:** Quickly recap the standard public-health heuristic: *Intervention X is justified if it prevents harm to Person Y.*
  3.  **The Constraint:** Announce that today's case involves future persons, informed consent is impossible, and we are bracketing metaphysical debates about "souls" or "essence." We are treating identity as biological/genetic for the purpose of policy modeling.

  > **Instructor Note (Point 6: What to Leave Out):**
  > Explicitly state: *"We are not debating whether origins are essential to identity in a metaphysical sense. For policy, if the genome differs, we model it as a different individual. We are also leaving aside the 'Asymmetry Problem' (duties to create vs. not create). We are focusing only on cases where existence is guaranteed either way."*
  > *Why:* This pre-empts the "metaphysics" disengagement. It frames identity as a modeling constraint, not a philosophical puzzle.

  ## 00:10 – 00:25 | The Carrying Case (Phase 1: The Intuition)
  **Activity:** Case Presentation & Initial Vote.
  **Content:**
  1.  **Present the Case (Identity-Entangled Version):**
      *   Clinic switches to cheaper culture medium.
      *   **Effect A:** Increases risk of mild, manageable endocrine disorder (daily meds, normal lifespan).
      *   **Effect B:** Because the medium alters development timing, *different* embryos are selected for transfer. The child born in the "Cheap" scenario is numerically different from the child born in the "Expensive" scenario.
      *   **Constraint:** Both lives are plainly worth living. Parents are informed and cost-neutral.
  2.  **The Vote:** "Is the clinic's choice morally wrong?" (Show of hands). Expect near-universal "Yes."
  3.  **The Challenge:** Ask a student to name the **plaintiff**. "Who is harmed? What would have happened to *that specific person* if the clinic had chosen differently?"

  > **Instructor Note (Point 1: Dependency Structure):**
  > *Crucial Order:* You must secure **"Life Worth Living"** *before* students attempt to solve the case.
  > *   **If you reverse this:** If students think the life is *not* worth living, they will argue "Better never to have been born." The Non-Identity Problem (NIP) dissolves into a standard harm case.
  > *   **What breaks:** If you introduce the identity claim first, students will say "Just don't conceive." By securing "Life Worth Living" first, you block the "non-existence is better" escape route, forcing them to confront the identity constraint.
  > *   **Action:** Stipulate the condition is "mild, manageable, life worth living" *before* asking for the plaintiff.

  ## 00:25 – 00:35 | The Switch (Phase 2: The Contrast)
  **Activity:** Comparative Analysis.
  **Content:**
  1.  **Flip the Dial:** Present the **Identity-Neutral Variant**.
      *   Same medium, same cost.
      *   *Change:* The medium affects the condition but *not* which embryo is transferred (e.g., applied after implantation, or stipulate same embryo develops in both).
      *   Same child exists in both worlds; in one they are healthy, in one they have the disorder.
  2.  **Compare:** Ask students to identify the plaintiff in *this* version. (Easy: "The child.")
  3.  **The Gap:** Highlight the structural difference. In Version 2, we compare Child A (Healthy) vs. Child A (Sick). In Version 1, we compare Child A (Sick) vs. Child B (Healthy/Non-existent).

  > **Instructor Note (Point 2: Misconceptions):**
  > *   **"Same Gametes = Same Person":** Pre-empt this at **00:15**. State clearly: "Different sperm/egg combination or different developmental trajectory = different genome = different individual for policy purposes." Do not wait for them to raise it; it stops the puzzle dead.
  > *   **"Parents are Wronged":** Close this escape hatch at **00:20**. Stipulate parents are fully informed and financially indifferent. If a student raises it, acknowledge it but say: "For this brief, we are assessing duties to the *offspring*."
  > *   **"No Harm = Anything Goes":** Let this surface at **00:30**. When they realize no individual is worse off, someone will say "So it's permissible." Let that sit uncomfortably. This tension drives the need for a new framework.

  ## 00:35 – 00:45 | Terminology & Diagnosis
  **Activity:** Labeling the Structure.
  **Content:**
  1.  **Introduce Terms:** Now introduce **Identity-Entangled** (Version 1) vs. **Identity-Neutral** (Version 2).
  2.  **Definition:**
      *   *Identity-Entangled:* The policy choice is a necessary condition for the specific individual's existence. You cannot hold the individual fixed across the counterfactual.
      *   *Identity-Neutral:* The individual exists in both the policy and the counterfactual.
  3.  **Why it Matters:** Explain that standard "harm" metrics (QALYs lost, disability adjusted life years) presuppose an Identity-Neutral structure. They break when entangled.

  > **Instructor Note (Point 4: Terminology):**
  > *   **When:** Introduce *after* they have failed to name a plaintiff (00:35). If you give them the labels first, they will treat it as a vocabulary test rather than a structural discovery.
  > *   **Risk:** The term "Identity-Entangled" risks sounding like causal dependence.
  > *   **Mitigation:** Define it explicitly as "Unavailability of a fixed subject for comparison." Emphasize that this is a *logical* constraint on the harm principle, not just a causal one.

  ## 00:45 – 00:55 | Solution Space (The "Prove Too Much" Test)
  **Activity:** Rapid-fire critique of fixes.
  **Content:**
  1.  **Option A: Impersonal Comparison.** "The world is worse if more sick people exist, even if no one is harmed."
      *   *Risk:* Leads to repugnant conclusions (e.g., replacing sick people with healthy ones).
  2.  **Option B: Threshold Rights.** "Children have a right to an open future/adequate health."
      *   *Risk:* If the threshold is "worth living," the clinic passes. If the threshold is "best possible," we can't reproduce at all.
  3.  **Option C: The Malicious Variant.** "Imagine the clinic chooses the medium *to cause* the disorder for research data."
      *   *Test:* If your theory says the malicious version is also permissible (because no one is harmed relative to non-existence), your theory **proves too much**.
  4.  **Conclusion:** We don't need to solve the philosophy today. We need to know that *if* your brief relies on "harm to the child," it fails in Entangled cases. You must argue on other grounds (justice, impersonal value, rights).

  > **Instructor Note (Point 3: Solution Space):**
  > *   **Depth:** Do not attempt to solve NIP. 75 minutes is insufficient.
  > *   **Goal:** Show the *cost* of each solution.
  > *   **Strategy:** Use the "Prove Too Much" manoeuvre (00:50). This is the most effective tool for policy students. It shows that "No Harm = Permissible" yields intuitively unacceptable results in malicious cases, forcing them to abandon strict person-affecting views without needing deep metaphysics.
  > *   **Ending:** End without a definitive solution. Frame this as "Professional Awareness": You must know when your standard tools break.

  ## 00:55 – 01:10 | Application: The Plaintiff Check
  **Activity:** Individual Writing & Pair Share.
  **Content:**
  1.  **Task:** Take a draft paragraph from your policy brief (or a hypothetical argument for Lead Abatement).
  2.  **The Check:**
      *   Step 1: Name the individual who is worse off.
      *   Step 2: State what would have happened to *that very individual* otherwise.
      *   Step 3: If you cannot name them, mark the argument **Identity-Entangled**.
      *   Step 4: If Entangled, does the argument retain force? (e.g., "It creates a less healthy population" vs "It harms John").
  3.  **Share:** Turn to a partner. Try to break their argument using the NIP.

  > **Instructor Note (Point 5: Check for Understanding):**
  > *   **Validity:** This is the right test. It forces the counterfactual comparison into the open.
  > *   **Failure Mode:** A student who doesn't understand will say: "The child is worse off because they have the disease."
  > *   **Correction:** Interrupt and ask: "Which child? The one that exists in the counterfactual?" If they hesitate, they haven't grasped the identity constraint.
  > *   **Goal:** They don't need to fix the argument, just *identify* the structural vulnerability.

  ## 01:10 – 01:15 | Wrap-Up & Policy Takeaway
  **Activity:** Final Instruction.
  **Content:**
  1.  **Summary:** Standard harm arguments work for Identity-Neutral policies (treatment, safety regulations). They fail for Identity-Entangled policies (preconception, timing of conception, genetic selection).
  2.  **Brief Guidance:** "If your brief argues for preconception programs, do not rely solely on 'preventing harm to the child.' You must argue about population health, justice, or rights to a threshold of functioning."
  3.  **Dismissal.**

  ---

  # Design Notes & Answers to Specific Queries

  **1. Dependency Structure**
  *   **Decision:** Secure "Life Worth Living" *before* "Different Individual."
  *   **Rationale:** If students believe the life is not worth living, they will argue the act prevents existence (a benefit). The NIP requires the premise that existence is a benefit (or neutral) despite the condition. If you introduce identity first, they will bypass the harm calculation entirely by arguing for non-existence.
  *   **Implementation:** Stipulate "lives plainly worth living" in the initial case description (00:10).

  **2. Misconceptions**
  *   **Pre-empt (00:15):** "Gametes = Same Person." (Kills the puzzle immediately). "Parents are Wronged." (Distracts from the core ethical problem).
  *   **Let Surface (00:30):** "No harm = Anything goes." Let them feel the discomfort of this conclusion. It motivates the need for alternative frameworks.
  *   **Correction:** Use the "Malicious Variant" (00:50) to correct the "Anything goes" conclusion without needing complex metaphysics.

  **3. Solution Space**
  *   **Decision:** Open the space but do not occupy it.
  *   **Rationale:** Solving NIP is impossible in 10 minutes. Showing the *failure modes* of solutions is more valuable for policy writers.
  *   **Implementation:** Use the "Prove Too Much" test. It demonstrates that a strict "no victim, no foul" rule is untenable in policy, even if we can't agree on the perfect replacement theory.

  **4. Terminology**
  *   **Decision:** Introduce *after* the failure of the Plaintiff Check (00:35).
  *   **Rationale:** Labels are tools for sorting, not premises for argument. If given early, students memorize definitions rather than experiencing the logical trap.
  *   **Caveat:** Explicitly define "Identity-Entangled" as "Unavailability of a fixed subject," not just "Causal dependence," to avoid the misconception that all causal chains entail identity changes.

  **5. Check for Understanding**
  *   **Decision:** The "Plaintiff Check" is appropriate.
  *   **Risk:** Students may say "The child is worse off than they *could* have been."
  *   **Counter:** Require them to name the *counterfactual subject*. If they say "The same child," they fail. If they say "A different child," they pass the check but must acknowledge the argument is no longer person-affecting.
  *   **Success Metric:** A student passes if they can correctly classify their own argument as Entangled or Neutral, even if they don't know how to fix the Entangled one.

  **6. What to Leave Out**
  *   **Decision:** Omit Modal Metaphysics, Asymmetry, and Deep Taxonomy.
  *   **Rationale:** This audience views these as "noise."
  *   **Implementation:** Be honest. "We are bracketing this." This maintains credibility. The only unsafe omission is the **Person-Affecting Restriction**. You must name this (even simply as "The Harm Principle") because their briefs will likely rely on it. If you don't name the principle they are using, they won't understand why it's failing.
