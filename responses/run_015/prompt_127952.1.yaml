answer: |-
  You win the $20. Your roommate's chain looks airtight, but it's a classic example of a logical proof that eats its own tail. You are right to suspect Step 9, but the rot sets in slightly earlier, at the very beginning of the induction.

  Here is the breakdown of where the logic breaks, why your intuition is correct, and which premise you should sacrifice.

  ### 1. The Core Flaw: Confusing "Truth" with "Knowability"
  The roommate's proof relies on a hidden assumption: **That the Professor's announcement is a known truth.**

  For the backward induction to work (Steps 2–5), the student must *know* that the Professor's statement ("There will be a surprise exam") is true. They use this statement as an axiom to eliminate Friday.
  *   **The Contradiction:** The proof concludes that the Professor's statement *cannot* be true (because no day works).
  *   **The Catch:** If the proof shows the statement cannot be true, then the student **cannot know it is true** at the start.
  *   **The Break:** You cannot use a statement as a premise to prove that the statement itself is false. If you assume the statement is true to start the proof, and the proof shows it's impossible, you have proven that **the statement cannot be known**, not that the exam cannot happen.

  In logic terms, the announcement is **self-defeating knowledge**. It's like saying, "I am currently lying." You can say it, but you can't *know* it's true. The roommate is treating the announcement as a solid fact (like "2+2=4") when it's actually a contingent claim that collapses under the weight of being "known."

  ### 2. Your Intuition on Step 9 is Correct
  You guessed the slip is between "I know it's not Friday" and "Therefore I can apply the induction to Thursday." You are spot on.

  To eliminate Thursday, you must be **certain** that Friday is impossible. But your certainty that Friday is impossible relies entirely on the Professor's announcement being trustworthy.
  *   If the Professor is trustworthy, Friday *is* possible (because if you rule it out, you aren't expecting it, so it becomes a surprise again).
  *   If the Professor is untrustworthy (or the logic is flawed), then you don't *know* Friday is impossible.
  *   If you don't *know* Friday is impossible, you can't eliminate it from the Thursday calculation.

  The induction chain snaps because the "knowledge" required to move from Friday to Thursday is unstable. You are trying to stand on a ladder while sawing off the rung you're standing on.

  ### 3. Logical Predictability vs. Psychological Surprise
  Your roommate is conflating two different definitions of "surprise":
  1.  **Logical Unpredictability:** "It is impossible to deduce the day using valid logic."
  2.  **Psychological Unexpectedness:** "I won't actually expect it when it happens."

  The proof successfully argues that a **Logically Unpredictable** exam is impossible within a fixed window *if* the students are perfect logicians who trust the announcement.
  However, real life operates on **Psychological Unexpectedness**.
  *   In reality, students don't trust the announcement enough to build a rigid proof.
  *   Or, they build the proof, convince themselves the exam is impossible, relax, and then get hit with the exam on Wednesday.
  *   Was it a surprise? Yes.
  *   Did the logic hold? No, because the logic assumed the students would maintain belief in the announcement even after the logic told them the announcement was impossible.

  ### 4. Which Premise Costs the Least to Give Up?
  You asked which premise you should drop to resolve the paradox. Here are the options, priced by "cost":

  *   **Option A: Give up that the exam happens.** (High Cost)
      *   This is what your roommate did. It contradicts reality. Exams happen. Surprises happen.
  *   **Option B: Give up that the students are perfect logicians.** (Medium Cost)
      *   This solves it practically (people make mistakes), but it doesn't solve the *logical* paradox. The paradox exists even for perfect computers.
  *   **Option C: Give up that the announcement is "Known."** (Lowest Cost)
      *   **This is the winner.** You accept that the Professor *said* it, and it might even *be* true, but the students cannot **know** it is true prior to the event.
      *   Knowledge requires justification. The justification for the announcement undermines the announcement itself. Therefore, it is not an object of knowledge, only an object of belief.
      *   Once you downgrade the announcement from "Known Fact" to "Claim," the backward induction fails. You can't eliminate Friday because you don't *know* the rules will hold. If you don't eliminate Friday, you can't eliminate Thursday. The whole chain dissolves.

  ### 5. The Anniversary Trip (Step 8)
  Your roommate's extension to the anniversary trip is definitely wrong.
  *   **Promise:** "I will take you on a trip this month, and you won't guess the day."
  *   **Reality:** You book the tickets for the 15th. Your partner thinks it might be the 10th, or the 20th. On the 15th, you reveal it.
  *   **Was it a surprise?** Yes.
  *   **Was it logically impossible?** No.
  *   **Why the logic failed:** The partner cannot *prove* it's the 15th beforehand. The fact that they can't prove it *is* the surprise. The roommate's error is thinking that because the partner can't *deduce* the date, the date can't *exist*.

  ### Verdict
  The paradox proves that **you cannot know a surprise is coming**, not that **a surprise cannot come.**

  Your roommate tried to use the *possibility* of the surprise to prove the *impossibility* of the surprise. That is a performative contradiction. The logic breaks at the assumption that the announcement creates a stable state of knowledge. It doesn't. It creates a unstable state of belief.

  Tell him to hand over the $20. The slip is exactly where you thought it was: you can't use the elimination of Friday as a solid foundation for Thursday because the elimination of Friday relies on the announcement being true, which the elimination itself proves is false. You can't build a house on a foundation you just dynamited.
