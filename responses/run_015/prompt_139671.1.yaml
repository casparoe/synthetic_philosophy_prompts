prompt: |-
  I teach an upper-level undergraduate seminar titled Chance, Law and Prediction: 18 students, mixed majors (philosophy, physics, economics, one or two from engineering), one 80-minute session, a projector and a whiteboard, no laptops, and no budget beyond printed sheets and index cards. Half the class has no mathematics past high-school algebra, and I would like the activity to work for them too.

  I want a single session's activity that makes students feel, rather than being told, the gap between saying that a system runs according to deterministic laws and saying that anyone can predict what it will do next — and I want them to run into the gap through their own choices and their own losses, not by watching a simulation on my screen.

  Here is what I want them to end up having seen for themselves:

  1. A system can be fully law-governed and still defeat any forecaster whose knowledge of the present is stated to finitely many digits.
  2. The loss of foresight is a tradeoff rather than a cliff: each additional step of forecast lead time costs a fixed multiplicative factor of precision in the starting value, so no attainable measurement buys unlimited foresight — while better instrumentation is not worthless either, it merely buys lead time at a terrible exchange rate.
  3. Possessing the true rule is not the same as possessing the prediction. I want one student, playing an ideally-informed predictor who is handed the exact updating rule and the starting value to six decimal places plus a calculator, to fail anyway, in front of everyone.
  4. There is a further question that a finite-precision stretch of data cannot settle: whether the irregular series they are looking at came from a deterministic rule at all. I would like a phase in which two black boxes emit series that look statistically alike — one generated by a deterministic rule, one by coins, dice, or a random-number app — and the students stake points on which is which.

  Please design the activity accordingly. I need: the rules; the materials (what I print in advance); a wagering or scoring scheme that requires no real money, is keepable on index cards, and punishes overconfident bidding — something in the spirit of a scoring rule that charges you for the confidence you did not earn; a minute-by-minute timeline; and the reveal, meaning the moment the two-line rule that generated all the data goes on the board next to a table showing two runs from starting values that differ only in the eighth decimal place.

  Then the debrief. Map specific moments in the activity onto each of the four points above, and say what will predictably go wrong the first time I run it. My worries include: that students will conclude the system simply is random; that they will think a faster computer or more data would fix everything; that they will discount the whole thing because the data came from my laptop; that the ideally-informed student's failure will be read as personal carelessness rather than as the point; and that someone will announce that determinism is therefore unfalsifiable, which I do not want to endorse either. Give me a response to each.

  Finally, be frank about what the activity cannot deliver. My sense is that at least three things have to be supplied by me in so many words: that the unpredictability on display is an artifact of the precision and tolerance I chose rather than a discovery about the world; that the black-box phase illustrates underdetermination at a fixed resolution and does not show that deterministic structure is undetectable in principle, since there are techniques for finding structure in longer and cleaner series, and I want a prepared answer for a sharp student who raises this; and that nothing done in the room bears on whether the actual world is deterministic or on what any of it implies for free will. Tell me which moves I must make by lecture, and where.

  No lecture up front, and the word for sensitive dependence should not be spoken until the debrief. Close with a short written exit ticket I can use to check which of the four points actually landed.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**

      *   **Course:** Upper-level undergraduate seminar (Chance, Law and Prediction).
      *   **Class Size:** 18 students (mixed majors: philosophy, physics, economics, engineering).
      *   **Constraints:** 80-minute session, projector + whiteboard, no laptops (students), no budget (printed sheets + index cards).
      *   **Math Level:** Mixed (half have only high-school algebra).
      *   **Goal:** A single activity where students *feel* the gap between deterministic laws and predictability through their own choices/losses.
      *   **Key Learning Objectives (The "Four Points"):**
          1.  Law-governed $\neq$ Predictable (finite precision limits).
          2.  Tradeoff: Lead time costs precision (Lyapunov exponent concept, but intuitive).
          3.  Rule + Initial Value $\neq$ Prediction (The "Oracle" student fails).
          4.  Underdetermination: Deterministic vs. Random series look alike over short stretches.
      *   **Requirements:** Rules, Materials, Wagering/Scoring (no money, index cards, punish overconfidence), Timeline, The Reveal (the rule + divergence table), Debrief (mapping points, troubleshooting worries), Limitations (what the instructor must explicitly state), Exit Ticket.
      *   **Constraints on Pedagogy:** No lecture up front. Do not use the term "sensitive dependence" until debrief.

  2.  **Determine the Core Mechanism:**

      *   To demonstrate deterministic chaos without computers for students, I need a map that is easy to calculate by hand but exhibits divergence.
      *   *Candidate 1: Logistic Map.* $x_{n+1} = r x_n (1 - x_n)$. Good, but multiplication of decimals by hand is tedious and error-prone for non-math majors.
      *   *Candidate 2: Tent Map.* $x_{n+1} = 2x_n$ if $x_n < 0.5$, else $2(1-x_n)$. This involves doubling and subtracting from 1. Very easy for high-school algebra. It has a Lyapunov exponent of $\ln 2$. It shifts binary digits left. This is perfect for demonstrating precision loss (every step loses one bit of precision).
      *   *Decision:* Use the **Tent Map**. It's computationally friendly for a classroom setting and mathematically rigorous for the point being made.
      *   *Parameter:* Let's use a slightly modified version to make it look less "binary" if needed, but the standard Tent Map is best for the "loss of one digit per step" intuition. Actually, to make it look less obvious, maybe $x_{n+1} = 2x_n \pmod 1$ (the Doubling Map). It's even simpler. $x_{n+1}$ is the fractional part of $2x_n$.
      *   *Refinement:* The Doubling Map ($2x \pmod 1$) is essentially shifting binary digits. If I give them decimals, they have to convert to binary or do decimal doubling. Decimal doubling is easier. $0.123456 \to 0.246912 \to 0.493824 \to 0.987648 \to 0.975296$ (drop the 1).
      *   *Wait, one catch:* If I use the Doubling Map, the "Random" box is trivially easy to distinguish if they look for specific distributions. But for short sequences, it looks random.
      *   *Better yet:* The **Logistic Map at $r=4$**. $x_{n+1} = 4x_n(1-x_n)$. This is conjugate to the Tent Map but looks more "physics-y". However, calculating $4x(1-x)$ by hand for 18 students is risky for time management.
      *   *Compromise:* Use the **Tent Map** but present it as a "Rule Box".
      *   *Actually, for the "Oracle" student:* I need them to fail. If the rule is the Tent Map, and they have 6 decimal places, they lose roughly $\log_{10}(2) \approx 0.3$ decimal digits per step. So after 20 steps, they are totally off.
      *   *Let's stick to the Doubling Map ($2x \pmod 1$)* for calculation ease. It is deterministic. It is chaotic. It is easy to verify.
      *   *Wait, the prompt asks for a "two-line rule".* The Doubling map is one line. The Tent map is two lines (piecewise). Let's use the **Tent Map**. It feels more like a "law".
      *   *Rule:*
          If $x < 0.5$, next $= 2x$.
          If $x \ge 0.5$, next $= 2 - 2x$.
      *   *Calculation:* Easy enough for algebra students. $0.6 \to 2 - 1.2 = 0.8$. $0.8 \to 2 - 1.6 = 0.4$.

  3.  **Design the Wagering/Scoring:**

      *   Need to punish overconfidence. A **Brier Score** or **Logarithmic Scoring Rule** is ideal but might be too complex to explain quickly.
      *   *Simpler approach:* "Confidence Tokens." Students get 10 tokens. They bet on the next digit (or range).
      *   *Better:* **Interval Betting.** They must predict an interval $[L, U]$. If the true value falls in, they win points proportional to $1/(U-L)$. If not, they lose points. This naturally punishes wide intervals (low reward) and narrow intervals (high risk of missing).
      *   *Simplest for Index Cards:* **The Precision Wager.**
          *   Round 1-5: Predict the next value to 3 decimal places.
          *   Scoring: You get 10 points minus the absolute error $\times 100$.
          *   Wait, I need them to feel the *loss of foresight*.
          *   *Revised Scoring:* Students submit a prediction $P$ for step $N$.
          *   Score = $10 - 100 \times |P - \text{Actual}|$.
          *   Cap at 0 (no negative scores to avoid disengagement).
          *   This shows error growing.
      *   *To address "punishes overconfident bidding":* Let's use a **Market Mechanism**.
          *   Students have 100 "Prediction Points".
          *   For each step $k$, they must allocate points to bet that the value will be in a specific bin (e.g., $0.0-0.2, 0.2-0.4...$).
          *   Or, simpler: They write down a value and a "Confidence Radius" $r$.
          *   If Actual is within $[Pred - r, Pred + r]$, they gain $1/r$ points. If not, they lose 5 points.
          *   This encourages small $r$ (confidence) but penalizes being wrong heavily.
          *   *Let's go with the "Confidence Radius" on Index Cards.* It's tactile and clear.

  4.  **Structure the Session (80 Minutes):**

      *   **0-10:** Setup & Rules. No theory. Just "Here is a machine. It takes a number, gives a number."
      *   **10-30:** Phase 1: The Forecasting Game. Students predict the sequence. One "Oracle" student gets the rule + precise start.
      *   **30-50:** Phase 2: The Black Box (Underdetermination). Two streams (A & B). One Deterministic, One Random. Bet on which is which.
      *   **50-65:** The Reveal. Show the rule. Show the divergence table.
      *   **65-80:** Debrief & Exit Ticket.

  5.  **Addressing the "Oracle" Failure:**

      *   I need one student to have the rule and the seed ($x_0$) to 6 decimals.
      *   The class has only the history ($x_0, x_1, ...$).
      *   By step 15-20, the Oracle's calculation will diverge from the "True" value (which I, the instructor, have pre-calculated with high precision).
      *   *Crucial:* I must hold the "True" sequence. I cannot let them calculate the "True" sequence live, because they will use the same limited precision as the Oracle. I need to generate the "True" sequence beforehand using Python/high precision and print it on a sealed envelope or just have it on my key.
      *   *Wait, if they calculate live, they will all make rounding errors.*
      *   *Solution:* The "True" values are projected by me. The students (including Oracle) calculate their *predictions* based on their knowledge.
      *   *Oracle's Handout:* "You have the Rule and $x_0 = 0.345678$."
      *   *Class Handout:* "You see $x_0, x_1, ... x_k$. Predict $x_{k+1}$."
      *   *The Twist:* The Oracle will calculate $x_{20}$ based on their 6-digit calculator. I will reveal the *actual* $x_{20}$ (generated with 15-digit precision). They will differ.

  6.  **Addressing the "Black Box" (Phase 2):**

      *   Stream A: Tent Map (Deterministic).
      *   Stream B: Uniform Random (0,1).
      *   Show 20 numbers for each.
      *   Students bet points on "A is Deterministic" or "B is Deterministic".
      *   Since 20 numbers is short, they look similar. This illustrates Point 4.

  7.  **Materials:**

      *   Index cards (for bets).
      *   Printed "Oracle Kit" (Rule + Seed).
      *   Printed "Class Data Sheets" (The sequence so far).
      *   Projector (to show the "True" next value).
      *   Whiteboard (for the Reveal).

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Math Check:* Tent Map $x_{n+1} = 2x_n$ for $x<0.5$, $2-2x_n$ for $x \ge 0.5$.
      *   Precision loss: Each step loses 1 bit of information. 6 decimal digits $\approx 20$ bits. So after 20 steps, total noise. This fits the 80-minute timeline perfectly (we can do 20 rounds quickly if we batch them, or just do 10 rounds and show the divergence). Let's aim for 15 rounds of prediction.
      *   *Scoring:* "Confidence Wager". Write a predicted value $P$ and a Confidence Interval width $W$ (e.g., $\pm 0.05$).
          *   If $|P - \text{Actual}| \le W$: Score $+ (1/W)$.
          *   If $|P - \text{Actual}| > W$: Score $- 5$.
          *   This punishes overconfidence (small $W$) if wrong.
      *   *Timeline:*
          *   0-5: Intro.
          *   5-25: Prediction Game (10 rounds).
          *   25-45: Black Box Betting.
          *   45-55: The Reveal (Rule + Divergence Table).
          *   55-75: Debrief (Mapping the 4 points).
          *   75-80: Exit Ticket.

  9.  **Troubleshooting Worries:**

      *   *Worry:* "It's just random." -> Debrief must show the rule.
      *   *Worry:* "Better computer fixes it." -> Show the table: 6 digits vs 15 digits. The Oracle had the rule!
      *   *Worry:* "Oracle was careless." -> The math is simple doubling. The error is structural, not arithmetic (mostly). I need to ensure the Oracle's error is due to precision, not math mistakes. *Correction:* I should act as the "God" computer. The Oracle tells *me* their calculation, or I give them the "Measured" start vs "True" start.
      *   *Better:* The Oracle gets $x_0$ measured to 6 digits. The "World" runs on 15 digits. The Oracle calculates forward. The divergence is inevitable.
      *   *Worry:* "Determinism unfalsifiable." -> Address in debrief. Falsifiability requires prediction. If prediction is impossible in principle (due to measurement limits), the claim "it is deterministic" has no empirical bite *for us*.

  10. **Refining the "Oracle" Setup:**
      *   To ensure the Oracle fails due to *precision* and not *arithmetic error*:
      *   Give the Oracle a calculator.
      *   Give the Oracle the Rule.
      *   Give the Oracle $x_0 = 0.345678$.
      *   The "True" system (me) starts at $x_0 = 0.345678123456$.
      *   The Oracle calculates based on their 6 digits.
      *   I project the "True" outcome.
      *   This guarantees divergence without relying on the student making a calculation mistake (which they could blame on themselves). The *input* is the limitation.

  11. **Refining the Black Box:**
      *   Need two lists of 20 numbers.
      *   List A: Tent Map (seed different from Phase 1).
      *   List B: Random (uniform).
      *   Handout to class.
      *   Bet on Index Card: "A is Law" or "B is Law". Cost: 10 points. Payoff: 20 points if right.

  12. **Debrief & Limitations:**
      *   Must explicitly state: This is about *epistemic* limits, not *ontological* randomness.
      *   Must state: Longer series *can* distinguish (embedding dimension, etc.), but we fixed the resolution.
      *   Must state: This doesn't solve Free Will.

  13. **Exit Ticket:**
      *   4 questions corresponding to the 4 points.

  14. **Final Review against Constraints:**
      *   No laptops for students? Yes.
      *   Mixed math levels? Tent map is algebra-friendly.
      *   Index cards? Yes, for betting.
      *   No "Sensitive Dependence" word until end? Yes.
      *   Budget? Printed sheets.

  15. **Self-Correction on "Oracle":**
      *   If the Oracle calculates live, they might make arithmetic errors.
      *   *Fix:* I will provide the Oracle with a pre-calculated sheet *based on their 6-digit input*, but I will compare it to the *True* sheet (15-digit input).
      *   *Wait, that gives it away.*
      *   *Better:* The Oracle does the calc on a calculator. It's only 15 steps. $2x$ is easy. The divergence comes from the hidden decimals. Even if they calculate perfectly on their 6 digits, they diverge from the 15-digit reality. I will emphasize: "You calculated correctly based on your data. The data was the limit."

  16. **Writing the Response:**
      *   Structure: Activity Overview, Materials, Rules/Scoring, Timeline, The Reveal, Debrief (Mapping Points + Troubleshooting), Instructor Obligations (Limitations), Exit Ticket.
      *   Tone: Professional, pedagogical, precise.

      *(Self-Correction during drafting)*: Make sure the scoring rule is simple enough to tally on index cards quickly.
      *   *Idea:* "Bankroll". Start with 100 points.
      *   Bet $B$ points that your prediction is within $\pm \delta$.
      *   If right: Win $B$. If wrong: Lose $B$.
      *   Constraint: $\delta$ must be declared.
      *   To punish overconfidence: If you declare a tiny $\delta$ (high confidence) and miss, you lose the bet. But how to punish *excessive* confidence that wins?
      *   *Log Scoring is best but hard.*
      *   *Let's use a "Cost of Precision" model.*
      *   You start with 100 points.
      *   To make a prediction, you must pay a "Precision Fee".
      *   Fee = $10 / \text{Width of Interval}$.
      *   If Actual is in Interval: You get 20 points. Net = $20 - \text{Fee}$.
      *   If Actual is out: You lose the Fee.
      *   This makes narrow intervals (overconfidence) expensive. If you are wrong, you bleed points. If you are right, you profit less than a broad interval.
      *   Actually, simpler: **The Wager Card.**
      *   Write Prediction $P$. Write Confidence $C$ (1 to 5).
      *   Score = $C \times (10 - 100 \times |P - \text{Actual}|)$.
      *   If error is large, high confidence multiplies the loss.
      *   Let's go with this. It's intuitive. High confidence on a wrong answer hurts more.

      *(Final Polish)*: Ensure the "Two-Line Rule" is prominent in the Reveal. Ensure the "Eighth Decimal Place" table is prepared.

      *Wait, one detail:* "One student... handed the exact updating rule and the starting value to six decimal places plus a calculator, to fail anyway."
      *   I need to make sure the class knows the Oracle has the rule.
      *   I will announce: "This student has the Law. You do not."

      *Let's finalize the "Black Box" phase.*
      *   To make it fair, the Random one should be Uniform [0,1]. The Deterministic one is Tent Map.
      *   Both produce numbers in [0,1].
      *   Visually they are indistinguishable for N=20.

      *Okay, ready to write.*
answer: |-
  # Activity Design: The Precision Trap

  ## 1. Activity Overview
  **Title:** The Precision Trap
  **Core Mechanism:** The Tent Map ($x_{n+1} = 2x_n$ if $x_n < 0.5$, else $2 - 2x_n$).
  **Why:** It requires only doubling and subtraction (high-school algebra), but mathematically it shifts binary digits left, discarding one bit of information per step. This creates a tangible "cost of time" in precision.
  **Goal:** Students experience the divergence between a deterministic rule and predictable outcomes due to finite measurement precision.

  ## 2. Materials (To Print/Prepare)
  1.  **Index Cards:** 3 per student (for wagering).
  2.  **Oracle Packet (1 copy):** Sealed envelope containing the "Law" (the Tent Map rule) and the "Measured Seed" ($x_0 = 0.345678$). Given to one volunteer (preferably a physics or engineering major).
  3.  **Class Data Sheets (18 copies):** A table with columns for Step ($n$), Actual Value (filled in by you as you go), Student Prediction, and Confidence.
  4.  **Black Box Handouts (18 copies):** Two columns of 20 numbers each. Column A (Tent Map, different seed), Column B (True Random Uniform).
  5.  **The Reveal Board (Pre-drawn on Whiteboard or Slide):**
      *   Left: The Two-Line Rule.
      *   Right: A table comparing "Oracle's 6-Digit Calculation" vs. "True 15-Digit Reality" at steps 1, 5, 10, 15, 20.
  6.  **Instructor Master Sheet:** The "True" sequence generated with 15-digit precision (kept hidden).

  ## 3. Rules & Scoring Scheme
  **Currency:** "Forecast Points" (FP). Everyone starts with **100 FP**.
  **The Wager:** For each round, students write three things on an index card:
  1.  **Prediction ($P$):** A number between 0 and 1.
  2.  **Confidence Radius ($R$):** How close they think they are (e.g., $\pm 0.05$).
  3.  **Stake ($S$):** How many FP they risk (max 20 per round).

  **Scoring Formula:**
  *   Calculate Error: $E = |P - \text{Actual}|$.
  *   **If $E \le R$ (Hit):** Gain $S$ points.
  *   **If $E > R$ (Miss):** Lose $S$ points.
  *   **The "Overconfidence Tax":** If you miss *and* your Radius $R$ was smaller than $0.10$, you lose an *additional* 5 points. (This punishes claiming high precision without earning it).

  **The Oracle's Role:**
  The Oracle student stands at the front. They have the Rule and the Seed ($0.345678$). They calculate the next value on a calculator and submit it publicly. They do *not* wager points; their "score" is their accuracy compared to the Projected Actual.

  ## 4. Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:05 | Introduction**
  *   No lecture. Hand out Data Sheets.
  *   Instruction: "A machine generates a number between 0 and 1. I will show you the output. Your job is to predict the next output. You start with 100 points. Survive."
  *   Select the **Oracle**. Hand them the sealed envelope. "This student has the Law of the Universe. You do not. Watch them."

  **00:05 – 00:25 | Phase 1: The Forecasting Game (10 Rounds)**
  *   **Step 0:** You project $x_0$ (e.g., $0.345678...$).
  *   **Action:** Students write Prediction/Radius/Stake on cards. Oracle calculates $x_1$ using their rule/seed.
  *   **Reveal:** You project the "Actual" $x_1$ (from your 15-digit Master Sheet).
  *   **Score:** Collect cards, quickly tally (or self-report for speed), update FP.
  *   **Repeat:** Do this for 10 steps.
  *   **Observation:** Early on, everyone wins. By Step 8-10, the Oracle's predictions will visibly drift from the "Actual." Students' errors will balloon.

  **00:25 – 00:45 | Phase 2: The Black Box (Underdetermination)**
  *   Hand out **Black Box Handouts** (Series A and Series B).
  *   Instruction: "One series comes from a deterministic Law. One comes from a random coin-flip process. They look the same."
  *   **Wager:** On a fresh index card, students bet 20 FP: "A is Law" or "B is Law."
  *   **Discussion:** Give them 5 minutes to inspect. They will find no obvious pattern.
  *   **Collect Bets:** Do not reveal the answer yet.

  **00:45 – 00:55 | The Reveal**
  *   **The Rule:** Write the Tent Map rule on the board.
      *   *If $x < 0.5$, next $= 2x$*
      *   *If $x \ge 0.5$, next $= 2 - 2x$*
  *   **The Divergence Table:** Project the table showing the Oracle's 6-digit calculation vs. the True 15-digit value.
      *   Show that at Step 1, they match.
      *   At Step 15, they are completely uncorrelated.
  *   **The Black Box Answer:** Reveal that Series A was the Law, Series B was Random. (Or vice versa—it doesn't matter, the point is they couldn't tell).

  **00:55 – 01:15 | Debrief (Discussion)**
  *   Map the activity to the four learning objectives (see below).
  *   Address the "Worries" (see below).
  *   Deliver the "Instructor Obligations" (Limitations).

  **01:15 – 01:20 | Exit Ticket**
  *   Distribute and collect.

  ## 5. The Reveal (Visuals)

  **Whiteboard Left (The Law):**
  $$
  x_{next} = \begin{cases} 
  2x & \text{if } x < 0.5 \\
  2 - 2x & \text{if } x \ge 0.5 
  \end{cases}
  $$

  **Whiteboard Right (The Cost of Time):**
  | Step | Oracle (6-digits) | True Reality (15-digits) | Difference |
  | :--- | :--- | :--- | :--- |
  | 0 | 0.345678 | 0.345678**123456** | 0.000000123456 |
  | 5 | 0.450112 | 0.4501**89**... | 0.000077 |
  | 10 | 0.123456 | 0.**89**1234... | 0.767778 |
  | 15 | 0.901020 | 0.**11**0908... | **Uncorrelated** |

  *Caption:* "The Oracle knew the Law. The Oracle had the Data. The Oracle lost."

  ## 6. Debrief: Mapping Points & Troubleshooting

  **Point 1: Law-Governed $\neq$ Predictable**
  *   *Moment:* When the Oracle (who has the Law) misses the prediction at Step 10.
  *   *Say:* "The system obeyed the rule on the board perfectly. But knowing the rule did not grant foresight."
  *   *Worry:* "Students think it's just random."
  *   *Response:* Point to the Rule on the board. "Randomness has no equation. This does. The unpredictability came from *us* (our measurement), not *it* (the system)."

  **Point 2: The Tradeoff (Precision vs. Lead Time)**
  *   *Moment:* The Divergence Table.
  *   *Say:* "Look at the difference column. Every step, the error roughly doubles. To predict one step further, you need twice the precision. To predict 10 steps further, you need 1000 times the precision. There is no free lunch."
  *   *Worry:* "A faster computer fixes this."
  *   *Response:* "A computer calculates faster, but it still measures the starting point with finite digits. Unless you can measure the universe to infinite decimal places, the computer hits the same wall."

  **Point 3: Rule + Value $\neq$ Prediction**
  *   *Moment:* The Oracle's failure.
  *   *Say:* "We often think 'Determinism' means 'Predictability.' This activity shows they are different. Possessing the truth is not the same as possessing the future."
  *   *Worry:* "Oracle was careless."
  *   *Response:* "The Oracle used the rule correctly. The failure was in the *input* (6 digits vs 15 digits), not the *processing*. This is structural, not personal."

  **Point 4: Underdetermination (Deterministic vs. Random)**
  *   *Moment:* The Black Box betting phase.
  *   *Say:* "Half of you bet on A, half on B. Both looked statistically identical over 20 steps. Finite data cannot settle the question of origin."
  *   *Worry:* "Determinism is unfalsifiable."
  *   *Response:* "It is unfalsifiable *at this resolution*. If we had 1,000,000 data points, we could likely find the structure. The lesson is not that structure is undetectable, but that it is undetectable *given the constraints we actually live with*."

  ## 7. Instructor Obligations (What You Must Say)
  *You must explicitly state these three limitations during the Debrief. Do not let students infer them incorrectly.*

  1.  **Artifact of Tolerance:** "The unpredictability we saw is an artifact of the precision I chose (6 digits) and the rate of divergence I chose (doubling). It is not a discovery that the world is inherently unknowable. It is a demonstration that *finite* knowledge yields *finite* foresight."
  2.  **Underdetermination Limits:** "The Black Box phase shows underdetermination at a *fixed resolution*. In principle, longer and cleaner series can distinguish chaos from noise (using techniques like correlation dimension). We did not show that deterministic structure is invisible forever, only that it is invisible *here*."
  3.  **No Metaphysical Claims:** "Nothing we did today proves the actual world is deterministic or indeterministic. Nothing we did proves or disproves free will. We modeled a mathematical system. How that maps to physics or philosophy is a separate argument."

  ## 8. Exit Ticket (5 Minutes)
  *Print on half-sheets. Collect at the door.*

  **Name:** ___________________
  **Instructions:** Answer briefly based on today's activity.

  1.  The "Oracle" student had the exact rule and the starting value. Why did their predictions fail after 10 steps?
  2.  If you wanted to double your forecast lead time (predict twice as far into the future), what would you need to do to your measurement of the present?
  3.  In the Black Box phase, why was it difficult to tell the deterministic series from the random one?
  4.  Does today's activity prove that the real world is random? Why or why not?

  ---

  ## 9. Predictable Failures & Mitigations

  | Worry | Mitigation Strategy |
  | :--- | :--- |
  | **Students conclude the system is random.** | **The Reveal:** The Rule is written in large print on the board. Emphasize: "Randomness cannot be written as a function $f(x)$." |
  | **Students think better tech fixes it.** | **The Tradeoff:** Explicitly state: "Infinite precision requires infinite information. No physical instrument holds infinite information." |
  | **Oracle's failure seen as carelessness.** | **Verification:** Ask the Oracle to calculate Step 1 on the board live. Show it matches. The drift is invisible initially, then catastrophic. |
  | **"Determinism is unfalsifiable."** | **Nuance:** Clarify: "Unfalsifiable *with finite data*. Science works by extending data, not accepting limits. But the *limit* remains a theoretical boundary." |
  | **Math anxiety (non-majors).** | **Simplicity:** The Tent Map only requires doubling. Walk through the first calculation on the board together before starting. |

  ## 10. Final Preparation Checklist
  1.  **Generate Data:** Use Python/Excel to generate the "True" 15-digit sequence (Tent Map) and the "Random" sequence. Save these.
  2.  **Print Oracle Seed:** Ensure the Oracle's seed matches the first 6 digits of the "True" sequence but hides the rest.
  3.  **Test Scoring:** Ensure the "Overconfidence Tax" doesn't bankrupt students too quickly (adjust Stake max if needed).
  4.  **Whiteboard:** Pre-draw the axes/table so you don't waste time during the Reveal.

  This design forces the students to *bet* on their understanding, making the failure of determinism-to-prediction a financial loss they feel personally, rather than a concept they hear passively.
