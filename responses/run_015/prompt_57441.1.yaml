  When we say "the bridge," we act like we mean a single thing. But think about the school bus. For the driver, the bridge is the route. For the carpenter, the bridge is the timber. For the historian, it is the evidence. We are all talking about different slices of the same long shape. My students know I have a habit of saying that objects are just stubborn events. To everyone else, that sounds like poetry. To them, it means that a thing is not a snapshot. It is a line. It is a long shape stretched out across time, just as this span is stretched across the water.

