  Good morning. Look at the water. It never stays the same river, yet we call it by the same name. Look at the bridge. We want it to be different. We want it to be a stone in the stream, unmoving, unchanged. But this bridge has sagged. In the winter of 1992, the north truss dropped two inches. Nobody told the state for a month. The flood of 1955 took out the abutment. We patched it. We painted it. We swapped every single timber while the school bus drove across it.

