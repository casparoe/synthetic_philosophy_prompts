prompt: |-
  I'm writing a feature on conceptual slippage in technical microdomains and need a workshop exercise for about twelve participants with mixed backgrounds, running ninety minutes. Design a structured classification game set in analog synthesizer restoration: participants must label each module as "original," "copycat restoration," or "fluid recreation" using only circuit-level evidence cards. Assign roles—classifier, challenger, archivist—with rules that enforce binary labeling on clearly gradient cases. At minute thirty-five, introduce a hidden case in which a voltage-controlled filter has been replaced by a period-correct but non-original modern equivalent, destabilizing prior categories without altering the rules so that the group experiences the collapse before anyone names it. Provide a precise timeline, a minimal materials list, a non-monetary scoring scheme using in-game reputation points, and a debrief that maps the moments of instability onto pressure-driven restructuring of feature weights in fluid concept formation. Be explicit about what the exercise cannot reproduce—specifically, the automatic analogy-driven restructuring central to Hofstadter's Copycat framework—and predict the predictable failure mode in a first run, namely that participants will retreat to functional-equivalence arguments rather than accept categorical dissolution. Keep the tone formal and self-contained; do not request bibliographies, citations, or outside reading.
