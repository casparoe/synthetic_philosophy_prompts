answer: |-
  1. **Universal Domain**
     *   **Requirement:** The aggregation rule must accept any logically possible combination of individually consistent judgment sets as input.
     *   **Case:** To restrict the admissible views individuals may hold is to prejudge the outcome and violate intellectual freedom; a general theory must accommodate any combination of rational individual views rather than only the well-behaved ones.
     *   **Status:** *Preference of a liberal camp* (often relaxed in practice via domain restriction to avoid impossibility).

  2. **Independence (Propositionwise Independence)**
     *   **Requirement:** The group's verdict on a given proposition should depend only on how individuals voted on that proposition, not on their views regarding other propositions.
     *   **Case:** This ensures neutrality across issues and prevents agenda manipulation where the outcome on one issue is swayed by irrelevant alternatives; it treats each proposition as a separate democratic decision.
     *   **Status:** *Preference of a formalist/neutrality camp* (frequently sacrificed to preserve logical consistency).

  3. **Non-dictatorship**
     *   **Requirement:** There is no single member whose judgments automatically determine the group's judgments regardless of others.
     *   **Case:** A rule that simply tracks one member's judgment violates the democratic principle of equality; the group must be more than the proxy of a single agent.
     *   **Status:** *Non-negotiable* (core democratic constraint).

  4. **Unanimity Preservation (Pareto Principle)**
     *   **Requirement:** If every individual accepts a proposition, the group must accept it.
     *   **Case:** To override a universal consensus is to disrespect the collective will without cause; the rule must respect unanimity.
     *   **Status:** *Non-negotiable* (core rationality/legitimacy constraint).

  5. **Collective Rationality (Consistency and Deductive Closure)**
     *   **Requirement:** The group's own judgments must be logically consistent and complete (if the group accepts $P$ and $P \rightarrow Q$, it must accept $Q$).
     *   **Case:** The group acts as a single agent; inconsistent actions are impossible to execute, and irrational agents cannot be held responsible; the output must be logically coherent.
     *   **Status:** *Non-negotiable* (core agency constraint).

  **The Jointly Unsatisfiable Subset**
  The impossibility theorem (List & Pettit, 2002) demonstrates that the entire list above is jointly unsatisfiable. No aggregation rule can simultaneously satisfy Universal Domain, Independence, Non-dictatorship, Unanimity Preservation, and Collective Rationality. While each condition appears normatively compelling in isolation, their conjunction creates a logical contradiction. To obtain a working rule, at least one condition must be abandoned. The most common theoretical sacrifice is **Independence** or **Universal Domain**, as Non-dictatorship, Unanimity, and Collective Rationality are typically viewed as the essential definitions of a rational democratic agent.

  **The Discursive Dilemma**
  The discursive dilemma is the concrete face of this tension. Consider a three-judge court deciding a breach of contract case. Liability ($C$) depends on two premises: a valid contract exists ($P$) and a breach occurred ($Q$). Logically, $P \land Q \rightarrow C$.
  *   Judge 1 accepts $P$, $Q$, and $C$.
  *   Judge 2 accepts $P$, rejects $Q$, and rejects $C$.
  *   Judge 3 rejects $P$, accepts $Q$, and rejects $C$.
  *   **Majority Vote:** The majority accepts $P$ (2-1), accepts $Q$ (2-1), but rejects $C$ (1-2).
  *   **The Tension:** If the group follows **Independence** (voting separately on each proposition), the resulting set $\{P, Q, \neg C\}$ is logically inconsistent. The majority on the elements implies a verdict the majority directly rejected. This illustrates that satisfying Independence and Universal Domain forces a violation of Collective Rationality.

  **Evaluation of Voting Procedures**
  *   **Premise-based Voting:** The group votes only on the premises ($P$ and $Q$) and deduces the conclusion ($C$) logically.
      *   *Performance:* Satisfies Collective Rationality, Universal Domain, Non-dictatorship, and Unanimity.
      *   *Failure:* Violates **Independence**. The group's judgment on $C$ is determined by votes on $P$ and $Q$, not by votes on $C$ itself.
  *   **Conclusion-based Voting:** The group votes only on the conclusion ($C$), ignoring the logical link to premises for the final verdict.
      *   *Performance:* Satisfies Independence, Universal Domain, Non-dictatorship, and Unanimity.
      *   *Failure:* Violates **Collective Rationality** (if premise judgments are recorded) or fails to provide a reasoned basis for the verdict. If the group records majority judgments on $P$ and $Q$ as well as $C$, the set becomes inconsistent. If it records only $C$, it fails to act as a reasoned agent regarding the premises.
