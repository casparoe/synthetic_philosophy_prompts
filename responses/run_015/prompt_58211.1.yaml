  **MEMORANDUM**

  **TO:** Executive Committee
  **FROM:** Internal Review Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Adversarial Collaboration Statement: Escalation of Commitment in Warehouse Automation Pilot

  **PREAMBLE**

  This document records the outcome of a structured dialogue between two retained advisors regarding the budgetary expansion of the warehouse automation pilot (400k to 1.4M over 30 months) and the concurrent competitive procurement process. The advisors represent distinct theoretical frameworks: Organizational Psychology (Advisor A) and Procurement Strategy/Game Theory (Advisor B). The purpose of this statement is not to force consensus where none exists, but to delineate the precise boundaries of agreement and disagreement to inform Executive Committee decision-making.

  **PART A: SHARED PREMISES**

  Both advisors endorse the following premises as factually accurate or theoretically sound:

  1.  **Mechanics of the Dollar Auction:** In a dollar auction game (Shubik, 1971), the highest bidder wins a prize but both the highest and second-highest bidders must pay their bids. Rational individual bidding can lead to collective outcomes where total payments exceed the value of the prize, driven by the incentive to minimize losses on prior bids.
  2.  **Definition of Escalation of Commitment:** Escalation of commitment is defined neutrally as the phenomenon wherein decision-makers increase resource allocation to a course of action following negative feedback regarding the viability of that course. This definition describes the behavior without presuming the underlying cause (i.e., it does not presuppose irrationality).
  3.  **Undisputed Case Facts:**
      *   The automation pilot budget increased from an initial 400k to 1.4M across staged tranches over 30 months.
      *   Justifications for subsequent tranches explicitly cited the protection of prior expenditures.
      *   Two finalists in the parallel hardware procurement incurred substantial unrecoverable bid-preparation costs.
      *   Neither finalist withdrew from the procurement contest prior to the review trigger.
      *   Current project performance metrics are below the thresholds established in the initial business case.

  **PART B: PERSISTING DIVERGENCES**

  The following table outlines the substantive and terminological disagreements regarding the interpretation of the facts in Part A.

  | Issue | Advisor A (Organizational Psychology) Position | Advisor B (Procurement Strategy) Position | Nature of Disagreement |
  | :--- | :--- | :--- | :--- |
  | **Primary Driver of Persistence** | Continued investment is primarily driven by cognitive biases, specifically sunk-cost sensitivity and self-justification motives, which distort risk assessment. | Continued investment is primarily driven by instrumental rationality, accounting for option value, reputational signaling, and private information regarding long-term payoffs. | Substantive |
  | **Interpretation of Bid Costs** | Unrecoverable bid costs incurred by non-winning finalists represent a deadweight loss resulting from a failure to coordinate or exit, consistent with loss-aversion framing. | Unrecoverable bid costs represent an equilibrium outcome in a war-of-attrition game where bidders signal resolve to secure future contract advantages or market positioning. | Substantive |
  | **Optimal Intervention** | Remediation requires "decision hygiene": separating current decisions from past expenditures, rotating sponsors, and enforcing hard stop-loss limits. | Remediation requires mechanism design: altering auction rules to subsidize exit, clarifying reputational consequences of withdrawal, or improving information sharing. | Substantive |
  | **Labeling of "Escalation"** | The term implies a deviation from normative rational choice models; the behavior is inherently pathological and requires correction. | The term describes a strategic posture; the behavior may be path-dependent but is not necessarily pathological if it secures long-term strategic options. | Terminological |

  **PART C: PIVOTAL SUBQUESTIONS**

  Resolution of the following questions would materially alter the weight assigned to either Advisor's position:

  1.  **Ex-Ante Viability:** If the project were presented today as a new initiative (Greenfield), excluding all prior spend and history, would the current projected returns justify the required remaining investment?
      *   *Why Pivotal:* If the answer is "Yes," Advisor B's option-value argument is strengthened. If "No," Advisor A's sunk-cost bias argument is strengthened.
  2.  **Asymmetry of Information:** Did the bidders or project sponsors possess private information regarding technical feasibility or future pricing that was not available to the Executive Committee at the time of tranche approvals?
      *   *Why Pivotal:* If private information existed, persistence may be rational (Advisor B). If information was symmetric and negative, persistence suggests bias (Advisor A).
  3.  **Reputational Consequence:** Is there empirical evidence that withdrawing from this specific procurement would negatively impact a vendor's ability to win future contracts with this firm or in this sector?
      *   *Why Pivotal:* If reputational damage is real and costly, non-withdrawal is strategic (Advisor B). If reputational damage is negligible or imagined, non-withdrawal is behavioral (Advisor A).

  **PART D: DIAGNOSTICS AND EXPECTED OBSERVATIONS**

  For each pivotal subquestion, the advisors agree to the following diagnostics to test their respective hypotheses.

  | Pivotal Subquestion | Diagnostic Description | Advisor A (Psych) Expected Observation | Advisor B (Strategy) Expected Observation |
  | :--- | :--- | :--- | :--- |
  | **Ex-Ante Viability** | **Greenfield Audit:** A blinded panel of external experts evaluates the *current* remaining scope and costs without knowledge of historical spend or prior approvals. | The panel will recommend termination, indicating the project only survives due to sunk-cost attachment. | The panel will recommend continuation or identify specific option values (e.g., data accumulation) that justify the cost. |
  | **Asymmetry of Information** | **Information Trace Review:** A forensic audit of internal communications to map when technical risks were known by sponsors versus when they were reported to the Committee. | Communications will show risks were known but downplayed or reframed to secure approval (self-justification). | Communications will show risks were known but deemed manageable based on technical data not fully captured in financial reports (private info). |
  | **Reputational Consequence** | **Capped-Loss Rebid Simulation:** A model of a future procurement where bid costs are partially recoverable if a bidder withdraws before a specific milestone. | Withdrawal rates will increase significantly, suggesting previous persistence was due to loss aversion. | Withdrawal rates will remain low, suggesting persistence is driven by factors other than immediate bid-cost recovery (e.g., long-term market share). |

  **CONFIDENCE NOTE**

  I assign high confidence to the neutrality of the formulations in Parts A and B, as they rely on standard definitions from the respective academic literatures. I am least certain regarding the distinction in Part D (Information Trace Review) between "downplayed risks" (bias) and "manageable risks based on technical data" (strategy). In practice, these two states often look identical in written records, as optimistic framing is the natural language of both self-justification and strategic persuasion. Distinguishing intent from optimism may remain ambiguous even after the diagnostic.

  Summary: The advisors agree on the mechanical facts and definitions of the episode but fundamentally disagree on whether the observed persistence stems from cognitive bias requiring behavioral correction or strategic calculation requiring incentive realignment.
