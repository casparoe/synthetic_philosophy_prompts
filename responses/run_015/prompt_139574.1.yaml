answer: |-
  ### THE PROCEDURE (The "One-Pager")

  **Rule for Guesses:** If management will not sign a commitment (letter of intent/contract amendment), treat the guess as the **worst plausible outcome for the worker**. Do not accept verbal assurances.

  **Step 1: The Pace (Who Drives?)**
  *   **Question:** Once installed, does the machine set the speed, or does the worker?
  *   **Valid Answer:** "Worker sets speed" OR "Machine sets speed, but worker can pause without penalty."
  *   **Fail Condition:** Machine sets speed + individual rate logging + penalty for stopping.
  *   **Outcome:** If Fail → **OPPOSE** (Unless Step 2 passes wildly).

  **Step 2: The Time (Who Keeps the Savings?)**
  *   **Question:** If the job takes less time, where do the minutes go?
  *   **Valid Answer:** "Shorter shift (same pay)" OR "More break time" OR "Higher rate per unit."
  *   **Fail Condition:** "More units in same shift" OR "Staff reduction via attrition without workload reduction."
  *   **Outcome:** If Fail → **OPPOSE**. If Pass → **CONDITIONAL ACCEPT** (Must be written into KPIs).

  **Step 3: The Knowledge (Who Owns the Skill?)**
  *   **Question:** Is tacit knowledge (head-stuff) being recorded to train a system?
  *   **Valid Answer:** "No recording" OR "Recording for training only, system augments worker."
  *   **Fail Condition:** "Recording to build autonomous system" OR "Data leaves the depot."
  *   **Outcome:** If Fail → **MEMBERSHIP VOTE** (This is a values trade-off: current security vs. future leverage).

  **Step 4: The Workforce (Who is at Risk?)**
  *   **Question:** Does this affect current heads or future hires?
  *   **Valid Answer:** "Current heads safe, future hiring frozen" OR "New roles created."
  *   **Fail Condition:** "Attrition targets" OR "Agency staff replacement."
  *   **Outcome:** If Fail → **OPPOSE** (Solidarity principle).

  **Summary Logic:**
  *   Any **Fail** in Step 1 or 2 = **OPPOSE**.
  *   Fail in Step 3 = **VOTE**.
  *   Fail in Step 4 = **OPPOSE** (unless Step 2 guarantees shorter hours for all).
  *   All Pass = **LET THROUGH**.
  *   Pass with Management Hesitation = **CONDITIONAL ACCEPT** (Get it in writing).

  ***

  ### THE RUN-THROUGH

  **1. Sort Retrofit (40 jobs lost, machine pace, rate logging)**
  *   **Pace:** Machine sets pace + individual logging. **(FAIL)**
  *   **Time:** Attrition means remaining workers absorb volume or company saves cash. No shorter day offered. **(FAIL)**
  *   **Verdict:** **OPPOSE.**
  *   *Note:* Your gut says fight (motor). The procedure agrees. The individual rate logging is the killer; it turns the machine into a whip.

  **2. Lift-Assist Arms (Safety gain, management wants tonnage up)**
  *   **Pace:** Worker still lifts, arms assist. **(PASS)**
  *   **Time:** Management wants tonnage up. This is a speed-up disguised as safety. **(FAIL *unless* conditioned)**
  *   **Workforce:** Staffing kept as is. **(PASS)**
  *   **Verdict:** **CONDITIONAL ACCEPT.**
  *   *The Pivot:* This is the one your gut says fight (motor), but you shouldn't. Dave's back is real. **Condition:** We sign off *only* if tonnage-per-hour targets remain frozen at pre-install levels. If they refuse to freeze targets, it becomes an **OPPOSE**. Safety cannot be a trojan horse for intensity.

  **3. Routing App (Drivers finish earlier, more stops added, agency top-up)**
  *   **Pace:** Algorithm sets route density. **(FAIL)**
  *   **Time:** Saved time goes to more stops, not home. Pay per stop unchanged means real wage cut (more work for same money). **(FAIL)**
  *   **Workforce:** Easier to use agency drivers. **(FAIL)**
  *   **Verdict:** **OPPOSE.**
  *   *Note:* Your gut says pass (screen). The procedure catches the trap. The technology works; the *distribution* of the benefit is hostile.

  **4. Data Capture (Coders recorded to train replacement)**
  *   **Pace:** N/A now.
  *   **Knowledge:** Tacit knowledge extracted, data leaves depot, system aims to replace. **(FAIL)**
  *   **Workforce:** Future hires threatened (system turns up in 3 years). **(FAIL)**
  *   **Verdict:** **MEMBERSHIP VOTE.**
  *   *Note:* This is the "honest" one. The procedure can't solve it because it's a trade-off between *your* current job security (cooperating keeps the depot competitive now) and *future* workers' existence. That is a political question, not a technical one. Put it to the room.

  ***

  ### THE DISTINCTIONS & THE META

  **You have not garbled the distinctions.**
  1.  **Hours vs. Cost of Goods:** Real. Productivity gains can buy leisure (shorter week) or cheaper parcels (market share). Capital chooses cheaper parcels; Labor needs leisure.
  2.  **Pace Setting:** Real. Machine pacing removes human rhythm, increasing stress even if physical load drops.
  3.  **Uptime Pressure:** Real. Fixed capital costs drive 24/7 shifts, destroying social cohesion.
  4.  **Current vs. Future:** Real. Attrition protects you; hiring freezes kill the union's future density.

  **The Judgement Call Wearing a Clipboard:**
  **Step 2 (The Time).**
  Asking "Where do the minutes go?" looks objective, but it requires you to interpret management's *intent* versus their *written word*. They will say "efficiency." You have to translate that to "intensity." The procedure tells you to treat guesses as worst-case, but deciding what counts as a "written guarantee" vs. "fluff" is where your experience matters. If they say "targets won't rise," but change the definition of a "stop," Step 2 fails. You are the auditor.

  **What Would Change My Mind About The Shape:**
  If **"Who gets the time"** is the wrong master question, the replacement is **"Who owns the risk?"**
  Automation shifts risk from capital (machines break, markets shift) to labor (redundancy, injury, obsolescence).
  *   **The Case that Shows This:** **Case 4 (Data Capture).**
      Step 2 (Time) doesn't apply here—no time is saved *yet*. Step 1 (Pace) doesn't apply. But the risk is massively shifted: the workers bear the risk of training their own replacement with no severance guarantee. If the procedure focused on Risk Ownership, Case 4 would trigger an automatic **OPPOSE** rather than a Vote, because the risk asymmetry is total.
      *Why Time is usually better:* Time is immediate. Risk is abstract. For a 10-minute briefing, "Where do the minutes go?" lands harder with the room than "Who owns the algorithmic risk?" Stick with Time for the meeting, but keep Risk in your back pocket for the negotiation table.
