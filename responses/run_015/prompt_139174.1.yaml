answer: |-
  The banality of evil designates harm sustained within a fundamentally criminal enterprise through procedural compliance that renders victims interchangeable, absent specific malice or deep ideological conviction.

  This principle forces you to abandon verdict four (the reluctant participant), because self-loathing implies a moral recognition and inner dialogue that breaks the condition of thoughtlessness essential to Arendt's specific claim; coincidentally, this is also the verdict you identified as least defensible. Substitutability is repairable, but only when anchored to the moral character of the enterprise, which is precisely what distinguishes your fifth case (Nazi clerk) from your sixth (housing caseworker): both treat victims as interchangeable, but only the first serves a system whose ends are inherently criminal. There is a genuine tension with the vocabulary of radical evil from *Origins of Totalitarianism*, since radical evil implies a monstrous depth while banality implies a shallow surface; the tension resolves by assigning "radical" to the *effect* of the system (making humans superfluous) and "banal" to the *psychology* of the agent (thoughtless compliance), acknowledging that extreme harm can arise from shallow motives.

  On your two unsettled cases: the product-safety committee commits banal evil if the enterprise is deemed criminally negligent regarding known deaths, as the victims are interchangeable and motives are careerist; the split-agent bureaucrat is not banal in the instances where he spares friends, because exercising particular judgment interrupts the procedural automatism that defines the type. Here is a case my principle handles badly: a guard who derives sexual pleasure from beating prisoners (malice) but does so only during assigned hours using standardized methods on interchangeable victims (procedure); my principle classifies this as not banal due to malice, yet the structural mode of the harm remains bureaucratically banal, suggesting the concept may straddle motive and method uncomfortably.

  \answer{Criminal enterprise sustained by interchangeable procedural compliance}
