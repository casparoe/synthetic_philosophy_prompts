      *   *Key Philosophical Move:* Distinguish between *outcome responsibility* (did I change the water?) and *attitudinal/participatory responsibility* (am I willing to poison the water for profit?). The harm is a collective product; we are all co-authors. Even if my sentence is edited out, the story remains the same, but I am still a co-author.
      *   *Addressing Hypocrisy:* Perfection is not the prerequisite for participation. Reducing harm in one domain doesn't vanish because you cause harm in another.
