  6.  **Refining and Checking Constraints:**
      *   *Word Count:* Check the developed argument (~1000 words) and the speech (~150 words).
      *   *Language:* American English (e.g., "realize" vs "realise", "truck" vs "lorry").
      *   *Constraints:* Ensure the four concessions (threshold, coordination, fungibility, leakage) are respected. Do not claim she saves the water.
      *   *Taunts:* Ensure the diesel truck and "feel-good symbolism" points are addressed.

  7.  **Self-Correction during drafting:**
