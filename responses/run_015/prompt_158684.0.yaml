  3.  **Selecting the Two Strongest:**
      *   *Selection:* Strategy 1 (Complicity/Participation) and Strategy 2 (Fair Share/Justice).
      *   *Reasoning:* Strategy 3 (Integrity) is too internal/self-regarding. Strategy 4 (Structural) is too abstract for a rancher speech. Strategy 5 violates the constraints.
      *   *Complicity* addresses the "what are we doing" question directly—we are poisoning the water together.
      *   *Fair Share* addresses the "why me" question—it's about bearing the cost of the solution even if the solution is imperfect, rather than free-riding on the harm.
      *   *Combination:* The argument should be that while individual *causation* is negated by overdetermination, individual *responsibility* remains because the harm is produced by a practice we all sustain. We owe it to the victims (the town) to not be willing participants in the harm, even if our specific absence wouldn't stop it. It shifts from "making a difference" to "being the kind of neighbor who shares the burden."

  4.  **Developing the Argument (Drafting Phase):**
