answer: |-
  Here's the setup for the workshop. It's designed to be tight, a little stressful (in a fun way), and rigged so the philosophical punchline hits hard at the end.

  ### The Setup: "The Xenogloss Grant"

  **Time:** 90 mins
  **People:** 12 students (3 teams of 4)
  **Room:** Needs a central "Native Zone" (your desk) and three "Field Camps" (tables).

  **Materials:**
  1.  **Stimulus Deck:** 20 laminated cards.
      *   10 cards show a whole rabbit (various poses: sitting, running, eating, sleeping).
      *   5 cards show two rabbits together.
      *   5 cards show empty landscape (no rabbit).
      *   *Crucial:* Do **not** include cards with just rabbit parts (tails, ears) or rabbit food. The ambiguity relies on the *absence* of these distinguishing cases.
  2.  **Response Paddles:** You need a Green (Assent) and Red (Dissent) paddle.
  3.  **Query Slips:** Pre-printed slips for teams to write their proposed Xenogloss sentences.
  4.  **Manual Templates:** Blank booklets where they write their translation rules.
  5.  **Prestige Tokens:** Poker chips or just printed "Tenure Certificates."

  **The Hidden Rules (For You Only):**
  Xenogloss operates on an ontology of **temporal stages** and **undetached parts**, but the stimulus data is perfectly compatible with **enduring objects**.
  *   *Xenogloss Word 1:* "Gav" (Means: Rabbit-stage / Undetached rabbit part).
  *   *Xenogloss Word 2:* "Run" (Means: Manifestation of motion / Spatial extension).
  *   *Grammar:* No plural markers. No tense markers. "Gav" applies to one rabbit, two rabbits, a rabbit tail, or a rabbit-stage. Since you never show them a tail alone, they can't rule out the "part" theory. Since you never show them a static vs. running distinction that *fails* assent, they can't rule out the "stage" theory.

  When they show you a card:
  *   If a rabbit (or part/stage) is present: **Green.**
  *   If no rabbit is present: **Red.**
  *   If they ask about plurality (e.g., point to two rabbits and say "Gav?"): **Green.** (Because "Gav" doesn't distinguish number).
  *   If they ask about tense (e.g., point to a running rabbit and say "Gav Run?"): **Green.**

  ---

  ### Phase 1: Briefing (10 mins)

  Tell them they're competing for the "Quine Foundation Field Grant." Only one team gets funded. To win, they need to submit a Translation Manual that accurately predicts Native behavior.

  **The Rules of Engagement:**
  1.  **No Meta-Talk:** You cannot ask the Native "What does 'Gav' mean?" You can only show a card and propose a sentence.
  2.  **Stimulus Only:** You must record the Native's physical reaction (Green/Red), not their intent.
  3.  **The Payoff:** The team with the most "Verified Hypotheses" (correct predictions) gets the Grant. But ultimately, *you* (the Foundation Director) will choose the manual that seems most "coherent" if there's a tie. This encourages them to build a robust theory, not just guess.

  ### Phase 2: Fieldwork (40 mins)

  Teams send a "Field Agent" to your desk. They show a card from the Stimulus Deck and say a Xenogloss phrase (e.g., "Gav?"). You hold up Green or Red.

  *   **Round 1 (Ostension):** They try to map words to objects. They'll quickly lock onto "Gav" = Rabbit.
  *   **Round 2 (Complexity):** They try to describe actions. "Gav Run." You assent.
  *   **Round 3 (The Trap):** They try to test plurals. "Gav Gav?" (Two rabbits). You assent. They will likely record this as "Rabbits" in their manual, smuggling in English grammar.
  *   **Round 4 (Negation):** They show an empty card and say "Gav." You dissent. They write "No Rabbit."

  *Instructor Note:* Keep the pace brisk. If a team lingers too long on one card, tell them "Field conditions are deteriorating, move on." This prevents them from over-thinking the ambiguity.

  ### Phase 3: The Vote (10 mins)

  Collect the Manuals. Each team must submit **one** definitive translation for the core term "Gav."
  *   Team 1 likely writes: "Rabbit"
  *   Team 2 likely writes: "Rabbit"
  *   Team 3 might get clever: "Animal" or "Creature"

  Ask the class to vote on which manual should be funded. Usually, the group that was most confident wins the room. Hand out the "Tenure Tokens" to the winners. Let them feel the victory. They solved the puzzle.

  ### Phase 4: The Debrief (30 mins)

  This is where you twist the knife. Do not mention "indeterminacy" yet.

  **Step 1: The Reveal**
  Take the winning manual. Write their translation for "Gav" on the board (e.g., "Rabbit").
  Then, ask: "Could the Native actually be referring to *undetached rabbit parts*?"
  Draw a rabbit on the board. Circle the whole thing. Then circle just the ear.
  Ask: "In every instance where you got a Green paddle, was there a rabbit?" (Yes).
  "In every instance where you got a Green paddle, was there an undetached rabbit part?" (Yes).
  "So the stimulus evidence is identical."

  **Step 2: Ontological Relativity**
  Now you hit them with the terminology.
  *   **Stimulus Meaning:** Explain that their data was purely stimulus-response. They never accessed the "meaning," only the conditions of assent.
  *   **Analytic Hypotheses:** Point out where they smuggled in English grammar. "You wrote 'Rabbits' (plural). But the Native assented to 'Gav' for one rabbit and two rabbits. You added the plural marker because English *requires* it, not because Xenogloss has it. That's an analytic hypothesis you imposed to make the manual fit your ontology."
  *   **Ontological Relativity:** Explain that "Rabbit" assumes an ontology of enduring objects. "Rabbit-stage" assumes an ontology of events. Both fit the data perfectly. There is no experiment they could have run *within the rules* to distinguish them.

  **Step 3: The "Fact of the Matter"**
  Ask the winning team: "Was your manual correct?"
  They'll say yes.
  You say: "Quine says no. There is no fact of the matter. You picked one because your English grammar forced you to. The Native isn't committed to 'objects' any more than 'stages' until we force them into our linguistic framework."

  ---

  ### What Will Predictably Go Wrong

  Be ready for these hiccups. They're actually useful for the debrief if you catch them.

  1.  **The Dominant Linguist:** In each group of 4, one student will take over the pen. They'll decide what "Gav" means based on a hunch in minute 5. The rest of the team just records data to confirm the bias.
      *   *Fix:* During debrief, ask the quiet students if they agreed with the translation. When they admit they didn't really think about it, use that to illustrate how analytic hypotheses are often unconscious communal agreements, not discoveries.

  2.  **Smuggling Hypotheses:** Students will inevitably write "The rabbit runs" (present tense) or "Rabbits" (plural) in their manuals. They'll argue it's "just obvious."
      *   *Fix:* This is gold. Point out that Xenogloss has no tense. By translating it as "runs," they've imposed a temporal structure that isn't in the stimulus. This is exactly Quine's point about background language constraining translation.

  3.  **Trying to Break the Game:** A sharp student might ask, "Can I show the Native a picture of just a tail?"
      *   *Fix:* You have to say "No, that card is not in the Field Deck." This mimics the field linguist's limitation—you work with what occurs naturally. If you say yes, the ambiguity collapses. If you say no, they might get frustrated. Frame it as "Ecological validity."

  ### The Big Limitation (Be Frank About This)

  In the debrief, you need to admit where the simulation fails.
  In the game, they **had** to pick a manual to win the Grant. They were forced to choose between "Rabbit" and "Rabbit-part."
  Quine's actual claim is stronger: **Neither is correct.** There is no fact of the matter.
  The game creates a false dichotomy where they feel one *must* be true. In reality, Quine is saying the question itself is meaningless without a background manual.
  Tell them: "You felt pressure to pick one. That pressure comes from your desire for a unique truth. Quine is saying that desire is what blinds you to the indeterminacy. The game made you pick a winner, but philosophy says there are no winners here."

  Also, watch out for the typo in your own handouts—students love catching those. (Actually, leave one in the Manual Template, like "definintion," and see if anyone notices. If they do, it proves hyper-attention to form over meaning.)

  Good luck. If you pull this off, they won't forget "Gavagai" anytime soon.
