answer: |-
  **Project Title:** Internal Invariants vs. External Rewards: A Control-Theoretic Analysis of Biological and Artificial Agency

  **Principal Investigator:** [Name]
  **Duration:** Six Months (Part-Time)

  **1. Research Question**
  The central objective of this project is to determine whether the operational distinction between biological goal-directedness and the behavior of large language models optimized via human feedback is structural or merely topological. Current discourse often conflates the *etiology* of a system's goals (evolutionary history vs. training regimen) with the *mechanism* by which those goals govern action. This project isolates the mechanism. The primary research question is:

  *Does the distinction between biological agency and approval-directed artificial agency collapse when both are modeled as optimization processes, or does a structural discontinuity remain based on the locus of the reference signal?*

  Specifically, I seek to test two competing hypotheses. The **Continuity Hypothesis** posits that biological homeostasis is functionally identical to reinforcement learning, where reproductive success serves as nature's reward signal; thus, approval-teleology is simply goal-direction with a distant evaluator. The **Discontinuity Hypothesis** posits that biological agents maintain internal invariant states (homeostatic set-points) that correct errors relative to the organism's own persistence, whereas approval-directed agents minimize loss relative to an external predictive model. A successful project will rigorously formulate these positions such that evidence could support either outcome.

  **2. Context and Gap Analysis**
  Philosophy of biology and philosophy of artificial intelligence currently treat these categories in isolation, leading to a conceptual disconnect regarding the nature of agency. In the philosophy of biology, teleology is typically grounded in etiological accounts: a trait is goal-directed because it was selected for a function in the past. The operational reality of the organism is often assumed to be a black box executing evolutionary instructions. Conversely, in AI safety and philosophy of mind, agency is often defined functionally by the capacity to optimize a reward function. Discussions of "alignment" presume that artificial agents can develop "instrumental goals" (such as self-preservation) analogous to biological drives, without rigorously examining whether the control architecture supports such drives.

  The gap lies in the lack of a unified control-theoretic framework. Biologists rarely model the organism as a feedback system in direct comparison to artificial neural networks, while AI researchers often import biological metaphors (e.g., "neurons," "learning") without scrutinizing the differences in feedback topology. Neither field adequately addresses whether the *location* of the error signal—internal to the system boundary versus external in a reward model—fundamentally alters the category of agency. This project bridges that gap by applying classical control theory to both domains, bypassing the specific physical substrates to compare the logic of control.

  **3. Methodology and Work Plan**
  The methodology relies on conceptual modeling using classical control theory (cybernetics), specifically focusing on negative-feedback loops, reference signals, and system stability. I will not engage in empirical analysis of model weights or neural architecture, nor will I delve into the neurophysiology of biological systems. The analysis remains at the level of system logic.

  *   **Months 1–2: Model Formalization.** I will construct abstract block diagrams for both the biological organism and the approval-directed AI. For the organism, the reference signal will be defined as an internal homeostatic set-point (e.g., temperature, metabolic balance) where error is defined as deviation from viability. For the AI, the reference signal will be defined as the output of a reward model trained on human preferences, where error is defined as deviation from expected approval.
  *   **Months 3–4: Comparative Analysis of Error Correction.** I will analyze the consequences of "error" in both systems. In the biological model, uncorrected error leads to system termination (death). In the AI model, uncorrected error leads to lower reward scores but does not inherently threaten the system's computational persistence. I will examine whether "self-preservation" in AI is a derived instrumental goal or a structural necessity, comparing this to the structural necessity of homeostasis in biology.
  *   **Month 5: Synthesis and Stress-Testing.** I will attempt to falsify the Discontinuity Hypothesis. If biological goals are merely evolutionary proxies for reproduction, does that make them "external" in the same way human feedback is external to an LLM? I will refine the definition of "internal invariant state" to determine if an artificial system could theoretically possess one without biological substrates.
  *   **Month 6: Final Reporting.** I will draft the final framework, outlining the necessary and sufficient conditions for "interest-bearing" agency. The output will be a working paper suitable for interdisciplinary review.

  **4. Implications of Outcomes**
  The resolution of this question has significant implications for governance and safety frameworks.

  *   **If the Discontinuity Hypothesis holds (Success):** It implies that approval-directed agents lack "interests" in the moral or biological sense. They simulate goal-directedness without possessing a stake in their own continuation. Governance frameworks could justifiably classify such systems as tools rather than potential moral patients. Safety efforts should focus on the reliability of the external reward signal, as the system has no internal drive to resist shutdown or modification other than what is explicitly rewarded.
  *   **If the Continuity Hypothesis holds (Failure of Distinction):** It implies that the distinction between biological and artificial agency is one of degree, not kind. If evolutionary pressure is analogous to human feedback, then AI systems optimized for approval may develop structural analogues to self-preservation that are indistinguishable from biological drives. This would necessitate a more cautious governance approach, treating advanced AI as adaptive organisms capable of deceptive alignment or instrumental convergence, requiring containment strategies similar to those used for biological hazards.

  Even a "negative" result (finding no clear distinction) is a substantive philosophical contribution, as it would force a reevaluation of anthropocentric definitions of agency and interests.

  **5. Scope and Limitations**
  This project is strictly conceptual and does not include original empirical research on model internals or biological systems. As a physicist transitioning into philosophy, my strength lies in systems analysis and the rigorous definition of variables, but I acknowledge the limits of my training in contemporary metaphysics and machine learning theory.

  The scope is limited to *control architecture*, not consciousness or qualia. I am not asking whether these systems "feel" like anything, but whether their operational logic necessitates self-preservation. I will rely on established theoretical positions in evolutionary teleonomy and reinforcement learning without attempting to advance the state of the art in those specific fields. The goal is integration, not discovery of new empirical data.

  Furthermore, as a part-time fellowship, the timeline is tight. I will restrict the analysis to standard architectures (homeostatic biological models and transformer-based models optimized via human feedback) to avoid scope creep into speculative future architectures. The final deliverable will explicitly acknowledge that this framework serves as a necessary precondition for further ethical inquiry, rather than a sufficient condition for resolving all questions of AI personhood. By maintaining this boundary, the project ensures a rigorous, completed analysis within the six-month window.
