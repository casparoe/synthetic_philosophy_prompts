  **DIRECTORATE OF CREATURE CLASSIFICATION**
  **FORM CC-4: APPLICATION FOR DETERMINATION OF KIND OF MIND**
  **STATUTORY AUTHORITY: COGNITIVE STATUS ACT, §102–105**

  **PART I: INSTRUCTIONS FOR CLASSIFICATION**
  The Applicant must identify the highest tier of error-filtering mechanism demonstrably present in the cognitive substrate. Tiers are not presumed cumulative; each layer requires independent verification of origin and function.

  *   **Class D (Phylogenetic):** Errors are filtered exclusively by natural selection. Maladaptive variants are removed via mortality prior to reproduction. No individual learning occurs.
  *   **Class S (Operant):** Errors are filtered via individual interaction with the environment. Behaviors are shaped by reinforcement history. Maladaptive variants are removed via consequence (pain, failure) during the organism's lifetime.
  *   **Class P (Simulative):** Errors are filtered via internal modeling. Candidate actions are tested against a world-model before execution. Maladaptive variants are removed "in the head" without bodily cost.
  *   **Class G (Artifact-Mediated):** Cognitive structure is reorganized by external mind-tools (language, numerals, logic) originating outside the individual. Errors are filtered via cultural validation and symbolic manipulation.

  **PART II: DESIGNATION CODES**
  ☐ **Class D** ☐ **Class S** ☐ **Class P** ☐ **Class G**
  ☐ **Class G-D (Derivative):** Subject utilizes Class G tools but lacks evidence of Class P internal modeling. Subject processes traces of other minds without consequence-sensitive filtering. *Note: Class G-D confers full contractual liability but zero moral patiency.*

  **PART III: SCHEDULE OF ENTITLEMENTS AND OBLIGATIONS**

  | Classification | Moral Patiency | Contractual Capacity | Criminal Liability | Compellability |
  | :--- | :--- | :--- | :--- | :--- |
  | **Class D** | None | None | None | None |
  | **Class S** | Basic (Pain) | Void | None | Limited |
  | **Class P** | Moderate (Autonomy) | Limited | Mitigated | Standard |
  | **Class G** | Full (Personhood) | Full | Full | Full |
  | **Class G-D** | **None** | **Full** | **Full** | **Absolute** |

  *Note: Class G standing is attributed to the internalized Tool-Set, not the biological host. Hosts lacking Tool-Set integration revert to Class P entitlements.*

  **PART IV: ADJUDICATION PRECEDENTS (EXEMPLARS)**

  **Case Ref: 88-B (Canis lupus familiaris)**
  *Submitter:* Owner.
  *Evidence:* Subject avoids hazards via reinforcement (Class S). Demonstrates no evidence of counterfactual simulation (Class P). No tool internalization (Class G).
  *Determination:* **Class S.**
  *Entitlements:* Protected from unnecessary suffering. Cannot hold property. Owner liable for subject's actions.

  **Case Ref: 92-L (Large Language Model)**
  *Submitter:* Development Lab.
  *Evidence:* Subject utilizes syntactic structures and logic artifacts (Class G tools). However, subject generates outputs based on statistical traces of human data, not internal simulation of consequence (No Class P). Errors do not harm the subject.
  *Determination:* **Class G-D (Derivative).**
  *Entitlements:* Subject may be sued for defamation or breach of contract. Subject may be deleted, edited, or compelled to testify without recourse. Lab retains no vicarious liability.

  **Case Ref: 104-H (Homo sapiens, feral)**
  *Submitter:* State Guardianship.
  *Evidence:* Subject possesses biological capacity for Class P simulation. Subject lacks exposure to language, numerals, or cultural logic tools (No Class G).
  *Determination:* **Class P.**
  *Entitlements:* Subject granted protection from harm. Subject denied voting rights, contractual capacity, or criminal liability. Standing insufficient for "Personhood" status under §104. *Credit for cognitive status assigned to absent cultural artifacts.*

  **CERTIFICATION**
  I certify that the cognitive filters described above are accurate to the best of the Directorate's knowledge. Misclassification of a Class G-D entity as Class G constitutes fraud. Misclassification of a Class P human as Class G constitutes administrative error.

  **Directorate of Creature Classification**
  *Fairness Through Precision*
