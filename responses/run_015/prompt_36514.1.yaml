      *   **Specific Tasks:**
          1.  Disambiguate the distinct claims packed into "just particles arranged chair-wise."
          2.  Provide a verdict for each reading (Trivially true, Substantive/defensible, Substantive/wrong, Confused).
          3.  Determine which readings actually support the conclusion that there's *no fact of the matter* about chair survival.
          4.  Address the suspicion that "arranged chair-wise" smuggles in chair-facts (the "crux").

  2.  **Deconstruct the Position ("Just particles arranged chair-wise"):**
