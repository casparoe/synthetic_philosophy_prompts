answer: |-
  This is a classic move in contemporary metaphysics, often associated with **Mereological Nihilism** (the view that composite objects do not exist) or **Ontological Eliminativism**. Your friend is channeling Peter van Inwagen or perhaps a radical reading of Ted Sider.

  Your hunch is correct: the slogan "there are only particles arranged chair-wise" is doing far too much heavy lifting, and the inference to "therefore there is no fact of the matter about survival" is a non-sequitur on almost every standard interpretation.

  Here is a breakdown of the distinct claims packed into that slogan, their verdicts, and an analysis of whether they actually dissolve your flat-pack problem.

  ### 1. The Four Readings of "Just Particles Arranged Chair-Wise"

  #### Reading A: Hard Eliminativism (Error Theory)
  *   **The Claim:** Sentences like "There is a chair in the corner" are literally **false**. There are no chairs. There are only simples (particles). When we say "chair," we are making a category mistake, similar to saying "There is a witch in the corner."
  *   **Verdict:** **Substantive and Defensible.** This is a coherent philosophical position (van Inwagen holds a version of it). It is not trivially true, nor is it obviously confused, though it is revisionary.
  *   **Does it dissolve the survival question?** **No.** On this view, the question "Did the chair survive?" suffers from **presupposition failure**. It's not that there is *no fact of the matter* (indeterminacy); it's that the question is based on a falsehood (like asking "Did the King of France survive the revolution?" when there is no King of France). The answer isn't "undefined," it's "The subject of your question does not exist." Your friend claims there is *no fact*, but Eliminativism implies the fact is *negative* (the chair never existed to begin with).

  #### Reading B: Ontological Paraphrase (Quinean)
  *   **The Claim:** Ordinary sentences like "There is a chair" are **true**, but their logical form is misleading. Properly analyzed, "There is a chair" translates to "There are some particles arranged chair-wise." The truth conditions are satisfied by particles, not by a composite object.
  *   **Verdict:** **Substantive and Defensible.** This is the standard "paraphrase strategy" used to save ordinary language while maintaining a sparse ontology.
  *   **Does it dissolve the survival question?** **No, it resurrects it.** If "Did the chair survive?" translates to "Did the particles arranged chair-wise at $t_1$ maintain sufficient continuity/arrangement to count as the same arrangement at $t_2$?", then there **is** a fact of the matter. It is a fact about the particles. Your friend claims the question evaporates; on this reading, it just gets rephrased. If the particles are reassembled exactly, the paraphrase says the "chair" (the arrangement) survives. If they are swapped out, it doesn't. The hard work of defining survival conditions is pushed to the particles, not eliminated.

  #### Reading C: Plural Reference
  *   **The Claim:** The term "the chair" does not refer to a single object, but refers **plurally** to many particles at once. "The chair is heavy" means "Those particles are heavy."
  *   **Verdict:** **Substantive but Controversial.** This relies on a specific semantics of plural logic (e.g., work by Ted Sider or David Lewis). It's defensible but requires technical machinery.
  *   **Does it dissolve the survival question?** **No.** Plural reference preserves identity conditions. We can ask if *these* particles (referred to plurally) are the same as *those* particles. If the flat-pack process involves the same particles, the plural referent persists. If it involves different particles, it doesn't. Again, the fact of the matter remains; it is just a fact about plural identity rather than singular identity.

  #### Reading D: The "Arranged Chair-Wise" Smuggle (Your Hunch)
  *   **The Claim:** This isn't a metaphysical claim about objects, but a linguistic claim that we can define the arrangement without referencing chairs.
  *   **Verdict:** **Confused / Viciously Circular.** This is the weak link.
  *   **Does it dissolve the survival question?** **Yes, but only by cheating.** If the phrase "arranged chair-wise" is meaningful, it must have truth conditions. What makes an arrangement "chair-wise" rather than "trash-wise" or "ship-wise"? Presumably, it is the fact that the arrangement constitutes a *chair*. If you need the concept of a *chair* to define *chair-wise*, you haven't eliminated chairs; you've just hidden them in the predicate.

  ---

  ### 2. The Crux: Why "Arranged Chair-Wise" is Sneaky

  You should absolutely build your paper around your hunch. This is the strongest critique available to you.

  The phrase "arranged chair-wise" is doing illicit work. To understand it, we need to know which arrangements count as "chair-wise."
  1.  **If defined structurally:** You need a precise microphysical description (positions of atoms). But chairs are functionally defined, not just structurally. A chair made of jelly is still a chair. A perfect atomic duplicate of a chair that is too hot to sit on might not be. So structural description fails.
  2.  **If defined functionally:** You have to say "arranged in a way that supports sitting." But "sitting" is an activity performed by agents on *objects*. You have smuggled the functional kind (chair) back into the definition of the arrangement.

  **The "Van Inwagen" Problem:**
  Peter van Inwagen (who argues only living organisms exist) explicitly struggles with this. He admits that "arranged chair-wise" is vague. But if it is vague, then **vagueness returns.**
  *   Your friend says: "No chair = No fact of the matter about survival."
  *   Your counter: "If 'arranged chair-wise' is vague, then there is no fact of the matter about whether the *particles* are arranged chair-wise after reassembly."

  So, the indeterminacy doesn't come from the non-existence of the chair; it comes from the **vagueness of the arrangement predicate.** Your friend hasn't solved the problem of vagueness/persistence; he has just moved it from the object ("Is this the same chair?") to the predicate ("Are these particles arranged chair-wise?").

  ### 3. Why the "No Fact of the Matter" Conclusion Fails

  Your friend's conclusion is that there is **no fact of the matter**. This is a claim about **indeterminacy**. But his premise (Nihilism) is usually a claim about **non-existence**. These do not match.

  *   **If he is a Nihilist:** The chair doesn't exist. The statement "The chair survived" is false (or truth-valueless due to presupposition failure). It is not *indeterminate*.
  *   **If he thinks it's indeterminate:** He is admitting that the *particles'* arrangement is indeterminate. But particles are precise. Therefore, the indeterminacy must lie in the concept "chair-wise."

  **The Trap for Your Paper:**
  Point out that if "arranged chair-wise" is precise, then the survival of the arrangement is precise (there *is* a fact of the matter). If "arranged chair-wise" is vague, then he hasn't eliminated the metaphysical problem, he has just relocated it from mereology (composition) to semantics (vagueness).

  ### 4. Strategic Advice for Your Paper

  1.  **Grant the Nihilism (Temporarily):** Don't waste word count arguing that chairs *do* exist. Grant him that maybe only particles exist.
  2.  **Attack the Inference:** Argue that even if only particles exist, the question "Did the chair survive?" translates perfectly well into "Did the particle-arrangement persist?"
  3.  **Highlight the "Fact of the Matter" Slip:** Show that he is conflating "There is no *chair* fact" with "There is no *fact*." If chair-facts reduce to particle-facts, then particle-facts *are* the facts.
  4.  **Deploy the "Chair-Wise" Critique:** This is your killer point. Argue that "arranged chair-wise" is a relational property that implicitly references the very object (the chair) he claims to have eliminated. If he cannot define "chair-wise" without referencing "chair," his ontology is circular. If he *can* define it without referencing "chair," then the survival conditions become precise, and the "no fact of the matter" claim collapses.

  **Suggested Title:** *Arranged Chair-Wise: Eliminativism and the Smuggled Persistence Conditions.*

  **Bottom Line:** Your friend is using a metaphysical sledgehammer (Nihilism) to kill a gnat (persistence conditions), but he's accidentally hit his own thumb. The "no fact of the matter" conclusion is unsupported by the "no chairs" premise. On the most charitable reading (Paraphrase), the fact of the matter returns as a fact about particles. On the uncharitable reading (Smuggle), the argument is circular.
