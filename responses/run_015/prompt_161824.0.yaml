  3. The formal epistemologist will ask whether deflection is a prior of one or a refusal to conditionalize, noting that the former prevents revision while the latter violates Bayesian coherence. I model deflection as a meta-procedural rule that temporarily suspends conditionalization rather than fixing a prior, though I am softest on providing the formal axioms that govern when this suspension is rationally permissible.

  4. The social epistemologist will claim your deflection practice looks identical to standard credibility judgments where we dismiss challengers based on perceived competence, so you haven't identified a distinct epistemic category. Deflection targets the question itself as inappropriate rather than the questioner's reliability, but I am softest on drawing a sharp line when community trust erodes enough to turn a hinge into an empirical dispute.

  5. A graduate student will ask whether, on your view, any dogma counts as epistemically foundational simply by virtue of being enforced, making epistemology merely a branch of power dynamics. Yes, on my account dogma functions epistemically as a hinge, though I am softest on explaining why this doesn't collapse the distinction between knowledge and ideology.
