prompt: |-
  hey i'm putting together a one-page pitch for a small foundation—six months, solo, no team—to do philosophy on lost-cause mythology (the Confederacy, Masada, Kosovo, Dunkirk). i have this half-formed concept i'm calling defeat-dependant legitimation (DDL): the idea that a cause's moral standing gets fixed retroactively by the manner of its defeat rather than by its original aims. i think DDL might split into two sub-mechanisms—one where defeat demonstrates nobility, another where it dissolves responsability—but i can't tell if that's a real distinction or just wordplay.

  write the proposal with: the exact question (is DDL unified or bifurcated, and does the bifurcation explain why some lost causes stay politically toxic while others become unifying national myths?); why existing work on collective memeory and national myth leaves this open (it tends to treat history and conceptual machinery together); the philosophical method—how you'd isolate conceptual variables across the four cases without just doing more empirical history; what a useful deliverible looks like for people actually deciding on commemorative policy or education; an honest failure condition; and a realistic scope check for six months with no research assistants.

  please also separate what's fairly settled (e.g., that these myths operate in politics) from what's genuinely contested among people who know this stuff, and don't present a contested interpretation as if it's the consensus. no citations, bibliographies, or reading lists—i'll fill those in myself. there's probably a typo or two in this prompt, just roll with it.
