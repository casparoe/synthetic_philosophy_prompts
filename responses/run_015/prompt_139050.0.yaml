answer: |-
  **Root Commitment:** *There will be a system whose behavior predictably affects many parties with conflicting values, and someone has to specify a single target for it.*

  **1. The Bystander Case**
  *Does the system owe alignment only to those who directly operate it, or to anyone whose life it predictably changes?*
  *   **Only Operators** → Go to 4
  *   **Anyone Affected** → Go to 2

  **2. The Horizon Case**
  *Does "affected" include people who do not yet exist?*
  *   **Present Only** → Go to 3
  *   **Future Included** → Go to 3

  **3. The Species Case**
  *Does "affected" include non-human animals or artificial minds?*
  *   **Humans Only** → Go to 4
  *   **All Beings** → Go to 4

  **4. The Content Case**
  *Do we optimize for what these parties currently desire, or for what they would desire if fully informed and rational?*
  *   **Actual Desires** → Go to 5
  *   **Idealized Desires** → Go to 9

  **5. The Manipulation Case**
  *If the system itself shapes a user's desires (e.g., via recommendation), do we optimize for the pre-interaction desire or the post-interaction desire?*
  *   **Pre-Interaction (Resist Shaping)** → Go to 6
  *   **Post-Interaction (Accept Shaping)** → Go to 6

  **6. The Identity Case**
  *If a single person's values change radically over time, do we treat their past and future selves as one party or distinct parties?*
  *   **One Party (Whole Life)** → Go to 7
  *   **Distinct Parties (Time-Slices)** → Go to 7

  **7. The Conflict Case**
  *When values conflict, must we sum satisfaction across parties, or does any individual have a constraint against being sacrificed?*
  *   **Sum Satisfaction** → Go to 8
  *   **Individual Constraint** → Go to 10

  **8. The Distribution Case**
  *If we sum satisfaction, do we maximize the total amount or prioritize the parties with the least satisfaction?*
  *   **Maximize Total** → **Leaf A**
  *   **Prioritize Worst-Off** → **Leaf B**

  **9. The Convergence Case**
  *If everyone were fully rational, would their values still disagree?*
  *   **Yes (Persistent Disagreement)** → Go to 7
  *   **No (Values Converge)** → **Leaf C**

  **10. The Neutrality Case**
  *If values stem from incompatible worldviews, should the system pick the majority view or remain neutral among them?*
  *   **Pick Majority** → **Leaf D**
  *   **Remain Neutral** → **Leaf E**

  *(Note: All paths terminate at a final Uncertainty Node before the Leaf)*

  **11. The Uncertainty Case**
  *Given moral uncertainty about the previous answers, should the system commit to one derived target or hedge across multiple?*
  *   **Commit to One** → **Final Leaf**
  *   **Hedge Among Candidates** → **Final Leaf**

  ***

  ### Diagnostic Leaves

  **Leaf A (Aggregative View):** Requires sacrificing the few whenever the aggregated trivial gains of the many outweigh it.
  **Leaf B (Prioritarian View):** Requires rejecting a large total gain to secure a small gain for the least satisfied.
  **Leaf C (Convergence View):** Assumes all current disagreement is merely a cognitive error to be corrected.
  **Leaf D (Contractualist View):** Grants a single individual the power to veto improvements for everyone else.
  **Leaf E (Public-Reason View):** Forces the system to remain neutral between coherent and incoherent worldviews.

  *(Note: Each Leaf is duplicated by the Uncertainty Node, creating "Hedging" variants of each.)*

  ***

  ### Diagnostic Notes

  **Unoccupied Combinations**
  1.  **All Beings + Individual Constraint:** Incoherent. Non-human animals and artificial minds cannot formulate the rational complaints or vetos required to trigger the constraint.
  2.  **Idealized Desires + Moral Hedging:** Unattractive. If values converge under idealization (or truth is discoverable), hedging implies a skepticism incompatible with the premise of idealization.

  **Inseparable Leaves**
  *   **Pair:** Leaf A (Maximize Total) vs. Leaf A-Variant (Maximize Average).
  *   **Reason:** The tree distinguishes Total from Priority, but not Total from Average.
  *   **Additional Case:** *The Massive Population Case.* "Does adding a new person with a life worth living improve the system's target if their happiness is below the current average?" A "Yes" separates Total from Average.
