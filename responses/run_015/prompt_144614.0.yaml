  2.  **Pre-Meeting (Day -2):** Panelists submit a provisional ranking and one-line justification to the Secretariat.
  3.  **Meeting (Day 1):** Full dossiers (including scores, names, and aggregated provisional rankings) are distributed. Deliberation follows a fixed speaking order: junior panelists first, Chair last.

  **Rationale and Diagnosis**
  This protocol addresses the Vice-Chair's diagnosis of informational cascades while mitigating the Chair's concern regarding evidence wastage. By permitting review of comments prior to ranking, we preserve the evidentiary value of external critiques (addressing the Chair's objection that blind ranking wastes signal) while removing the anchoring effect of scores and reviewer prestige (addressing the Economist's concern).

  Crucially, this memo takes a specific stance on the **Diagnosis Problem**. We are operating under the assumption that panelist deference is driven primarily by career safety and social pressure, not legitimate expertise updating. If a junior panelist suppresses a methodological objection because a senior colleague speaks first, that is a governance failure, not a Bayesian update. Forcing a written commitment before exposure to social pressure isolates private signal from public noise. Yes, this risks "freezing error" if a junior panelist misunderstands the science; however, the cost of ignoring buried objections (as seen in the last cycle's funded awards) outweighs the risk of recorded misunderstandings, which can be corrected during the subsequent open discussion once the full dossier is revealed.

  **The Losing Case**
  The strongest argument against this protocol is the Status Quo/Secretariat position: that fixed speaking order alone suffices. This view holds that panelists are rational actors whose deference reflects efficient information pooling rather than fear. Requiring pre-meeting rankings adds administrative burden and risks calcifying early misunderstandings before the group can correct them via collective intelligence. There is merit here: if the primary variable is expertise rather than courage, our protocol adds friction without improving accuracy. However, given that serious objections were previously swallowed entirely, efficiency is less valuable than robustness.

  **The Evidence Problem and Failure Metrics**
  We must acknowledge the **Evidence Problem**: we only observe outcomes for funded proposals. A process that produces smooth consensus may look successful even if it rejects breakthrough science. We cannot compute the false-negative rate. Therefore, we cannot judge success by funding outcomes alone.

  **Closing: Defining Failure**
  Three years from now, this protocol will be deemed a failure if:
  1.  **Convergence without Correction:** Provisional rankings correlate >95% with final votes, indicating the pre-commitment became a sunk-cost anchor rather than a private signal.
  2.  **Generic Justifications:** The "one-line reasons" devolve into safe platitudes (e.g., "needs further validation") rather than specific critiques, indicating panelists are gaming the safety of the record.
  3.  **Persistent Blind Spots:** We fund projects that subsequently fail due to methodological flaws explicitly noted in the initial anonymous comments but overridden during the dossier phase.
  If discussion remains dominated by the mean score despite its delayed release, we have merely shifted the cascade, not broken it.
