      **Recommendation**
      Adopt a modified "Counterfactual First" protocol. Panelists will review anonymized comments and submit provisional rankings *before* receiving scores, reviewer names, or colleagues' inputs. Full dossiers and provisional rankings will be released only at the meeting start. Discussion must proceed junior-to-senior.

