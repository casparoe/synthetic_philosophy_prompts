      *   **The Practice:** Engineers say the network "really" represents snow, not wolves, because it fails when snow is removed. They test this by intervening (changing background).
      *   **Theories of Content:**
          *   *Causal-Informational:* Content is determined by causal covariance. If it fires for snow, it represents snow. But then it's never "wrong" about snow. Error becomes hard to explain without norms.
          *   *Etiological/Selected-Effect:* Content is determined by what the system was *selected* to do. It was selected (by engineers/loss function) to detect wolves. Therefore, failing to detect wolves (when snow is absent) is an error. This handles "wrong reason".
          *   *Functional-Role:* Content determined by role within the system. Less relevant to the external reference issue here.
      *   **The Tension:** The *verdict* ("it's a snow detector") seems to rely on etiological norms (it *should* be a wolf detector). The *test* (intervention) relies on causal dependence (if remove snow, output changes).
      *   **Complication 1 (Selection):** Gradient descent is blind. The "selection" is artificial (engineers' intentions + loss function). This aligns with Derived Intentionality.
      *   **Complication 2 (Regress):** Testing the tester. If the test classifier also takes shortcuts, how do we know? This suggests pragmatic stopping points rather than metaphysical foundations.
      *   **Causal Role Only:** If content = causal role, then the network represents snow. It isn't "wrong" about snow. It is only "wrong" relative to the engineer's goal (wolf detection). The "error" becomes pragmatic/utility-based, not semantic.

