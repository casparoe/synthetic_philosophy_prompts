      *   *Complication 1 (Blind Optimisation):* Who selects? The engineers select the *task* and *loss function*. The algorithm finds the path of least resistance. Proper function is derived from human intention, not biological evolution.
      *   *Complication 2 (Regress):* Acknowledge the regress risk. It stops pragmatically when interventions satisfy human stakeholders. This suggests "really representing" is a pragmatic shorthand, not a deep metaphysical fact.
      *   *Causal Role Only:* If we drop history, content = covariance. The network represents snow. It is not semantically wrong. It is practically useless for the intended goal. "Error" becomes "misalignment" rather than "misrepresentation".
      *   *Conclusion:* Summarise the implications for naturalising mental content.

  4.  **Refining and Editing (Word Count and Tone Check):**
