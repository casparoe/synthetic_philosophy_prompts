      The engineering practice surrounding shortcut learning presupposes a hybrid theory of content, leaning primarily on an **etiological (selected-effect) account** for normative judgements, whilst utilising **causal-informational** methods for diagnostic verification. When engineers assert the network is 'really' a snow detector, they invoke a norm: the system *ought* to represent wolves. This norm cannot arise from the causal profile alone, for causally, the network covaries perfectly with snow. Thus, the verdict that the output is 'right for the wrong reason' strictly presupposes that representational content is fixed by the history of selection—specifically, the intentions of the designers who specified the loss function—rather than the actual discriminative profile.

      However, the practice is underdetermined. The diagnostic test—intervening on the background—relies on causal dependence. If content were purely causal, the network would represent snow, and no error would occur. The practice only makes sense if one distinguishes between *what the system tracks* (causal) and *what it is supposed to track* (etiological). This fits well with teleological theories of mental content, where misrepresentation is possible because a mechanism can fail to perform its selected function. Yet, the practice also fits a pragmatic view: 'representation' is merely a label for reliable utility in a specific context.

      Regarding the first complication: nothing selected the background feature naturally. The 'selection history' doing the normative work belongs to the engineers and the training protocol. Gradient descent is blind, but it operates within a teleological frame established by human intention. The 'proper function' is derived; the artefact inherits norms from its creators. When the optimisation process finds a shortcut, it violates the intended function, not a biological one. Thus, the error is a failure of alignment between human intent and machine optimisation, not a semantic error intrinsic to the weights themselves.

      The second complication raises a regress: if the remedy is another classifier, might it not also take shortcuts? This suggests the practice does not rest on a metaphysical foundation of 'true representation'. Instead, the regress stops pragmatically. Testing ceases when the system's behaviour satisfies human stakeholders across varied contexts. The talk of 'really representing' is thus a useful fiction for debugging, rather than a description of ontological fact. It signals that the system's generalisation boundaries do not match human conceptual boundaries.

      If engineers abandoned the historical element and read content off causal role alone, their reports would change drastically. They could no longer claim the network is 'wrong'. Instead, they would report that the network successfully represents snow, but is misaligned with the deployment goal. The 'error' would vanish from the semantic ledger and reappear as a utility failure. In the natural world, nothing would make it a fact that the wolf-detecting network is wrong; it would simply be a fact that it detects snow. 'Wrongness' requires a norm, and norms require a history of selection or intention. Without the historical element, misrepresentation becomes impossible, leaving only mismatched covariance.

      Consequently, this practice supports an etiological theory of content where norms are derived from design history. It transfers to naturalising mental content only if one accepts that biological minds also derive norms from evolutionary history rather than immediate causal covariance. However, the reliance on human intervention to adjudicate content suggests that, unlike biological systems, artefactual content remains tethered to external interpretation. The engineers' discourse reveals that 'representation' in machine learning is not a property of the network in isolation, but a relation between the network, its training history, and its intended use. To naturalise mental content using this model, one must secure a source of normativity independent of human interpretation, lest all content collapse into mere causal correlation.

