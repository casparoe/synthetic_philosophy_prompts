prompt: |-
  hey — im a hs senior and next semester i've got an independent study block: about four months, ~10 hrs a week, and one teacher who'll read whatever I write but who knows basically nothing about ML. I can't train anything (no gpu, my math stops at calc BC), so I want to spend it on the conceptual side of what people call prosaic alignment — my rough understanding: assume we just keep scaling the stuff we already do (pretraining, RLHF-ish finetuning on human or model feedback, tool use and scaffolding around the model) and that nobody comes up with any big new idea — and then ask what would actually have to be true for that to turn out okay, and which of those things is most load-bearing.

  The thing i keep getting stuck on is what the heck the object being aligned even is. People write as if an "aligned model" is a thing you could have on a shelf and then drop into any context, but the way these systems actually get used — chained into agents, finetuned by a thousand downstream people, run alongside other copies of themselves, handed tools and memory — makes that sound confused. Is it the weights? the scaffolded system with its prompts and tools? or the whole situation: the company, the users, the regulators, the other models? I've started calling this the unit problem and I want to know if it's definitly a real question or if I'm reinventing something dumb that dissolves as soon as you look at it.

  Related to that, it seems like current methods mostly buy you good behavior on test day: the system does what you want in conditions that resemble the conditions you graded it in. What you want is for that to hold up on deployment day, when nobody's obviously grading, the inputs look different, and there's more that could be gotten away with. And then there's a third thing I don't have a name for, which is whether it'd stay fine if you kept training it, or scaled it up a lot, or put it somewhere being sneaky would pay off. My teacher called that one "would it still be good if it could get away with being bad", which sounds cheesy but I think it might be the real crux.

  So: which two or three open conceptual questions in this area should I actually spend the semester on? I care way more about your reasoning than about the list. For each one: why is it upstream of the others — what else gets unblocked, or becomes pointless, depending on how it goes; how tractable is it for me specifically, meaning no empirics, no heavy math, four months, writing for one smart non-ML reader; and what kind of thing would move it up or down the ranking if it happened. Also tell me honestly whether the unit problem deserves a whole semester or whether I should demote it and work on something downstream of it instead. And please don't give me a reading list or papers — I'll ask for that seperately if I need it.
