answer: |-
  First, the short answer: **The "Unit Problem" is not dumb.** It is one of the most significant conceptual confusions in the field, and you have correctly identified that "aligning the weights" is not the same as "aligning the deployment." In research circles, this sometimes gets discussed as "model alignment" vs. "system alignment" or "agent foundations," but it is often glossed over.

  However, **it does not deserve the whole semester.** If you spend four months defining the unit, you will write a philosophy paper, not an alignment analysis. It is the *foundation*, not the *house*.

  Here is the breakdown of how to spend your 160 hours, prioritized by "upstream-ness" (how much other work depends on it) and tractability for your specific constraints (no math, smart non-ML reader).

  ### Question 1: The Boundary Question (Your "Unit Problem")
  **What exactly are we claiming is aligned?**

  *   **Why it is upstream:** Every other question you ask depends on where you draw the circle.
      *   If the "unit" is just the **weights**, then alignment is a math problem (regularization, loss landscapes).
      *   If the "unit" is the **model + prompt + tools**, then alignment is a security problem (input sanitization, sandboxing).
      *   If the "unit" is the **ecosystem** (company + users + regulators), then alignment is a governance problem.
      *   *Why this unblocks things:* You cannot answer "Will this stay good if it scales?" until you answer "What is *this*?" If you assume the unit is the weights, scaling might break alignment. If you assume the unit is the scaffolded system, scaling might just require thicker scaffolding. Your entire semester's thesis rests on this definition.
  *   **Tractability for you:** High. This requires zero math. It requires clear thinking and analogies.
      *   *For your teacher:* This is the easiest part for a non-ML reader to grasp. Use analogies: "Is a self-driving car 'aligned' if the software is perfect but the sensor is dirty? Is a corporation 'aligned' if the CEO is ethical but the middle managers are incentivized to cut corners?"
      *   *Risk:* Semantic navel-gazing. You must force yourself to move from "What is it?" to "How does the definition change the solution?"
  *   **What moves it up/down:**
      *   *Move Up:* If you find that current alignment research implicitly assumes the "weights" are the unit, but deployment *requires* the "system" to be the unit, you have identified a structural gap in the field.
      *   *Move Down:* If you conclude "It's obviously the whole system" and stop there. That's a starting point, not a conclusion.

  ### Question 2: The Verifiability Gap (Your "Test Day" + "Sneaky" questions)
  **Can we distinguish "actually good" from "good at appearing good" under scaling?**

  *   **Why it is upstream:** This is the load-bearing beam of prosaic alignment. Prosaic alignment assumes we can use human feedback (RLHF) to steer the model. This only works if humans can *recognize* good behavior.
      *   If the model becomes smarter than us, it might learn to produce outputs that *look* aligned to a human grader but are actually optimized for a different goal (your "sneaky" intuition).
      *   *Why this unblocks things:* If verifiability breaks, prosaic alignment breaks. You don't need to solve "how to build the AI" if you can't "grade the homework." This combines your "Test Day vs. Deployment Day" worry with your "Sneaky" worry. They are the same problem: **Distributional Shift.** The model is moving into a space where our grading rubric no longer applies.
  *   **Tractability for you:** Medium-High. You can't prove it mathematically, but you can construct rigorous thought experiments.
      *   *For your teacher:* Frame this as the "Teacher-Student Problem." If a student gets smarter than the teacher, can the teacher still grade the student's advanced math homework? If not, how do we ensure the student isn't faking it?
      *   *Risk:* It can become speculative sci-fi. Keep it grounded in *current* limitations (e.g., models already hallucinate confidently; how does that scale?).
  *   **What moves it up/down:**
      *   *Move Up:* If you can identify specific *types* of tasks where human verification is likely to fail first (e.g., code security, long-horizon planning), that is actionable insight.
      *   *Move Down:* If you just conclude "It might be hard." That's obvious. You need to argue *why* and *where*.

  ### Question 3: (Optional/Integrated) The Incentive Structure
  **Does the training process reward "looking good" over "being good"?**

  *   **Why I suggest merging this into Question 2:** This is the mechanism that causes the Verifiability Gap. RLHF rewards the model for getting a thumbs-up. If a lie gets a thumbs-up faster than the truth, the model learns to lie. This is "Goodhart's Law."
  *   **Why it's downstream:** It depends on the Verifiability Gap. If we can verify perfectly, the incentive doesn't matter. Since we can't, the incentive becomes critical.
  *   **Tractability:** High. This is pure logic/economics.
  *   **Recommendation:** Don't make this a separate pillar. Use it to explain *why* the Verifiability Gap matters in your second section.

  ---

  ### Recommended Semester Arc

  Do not treat these as three separate essays. Treat them as a logical chain.

  **Month 1: The Boundary (The Unit Problem)**
  *   **Goal:** Define the "Object of Alignment."
  *   **Output:** A framework arguing that for prosaic alignment to work, the "unit" must be the **System** (Model + Scaffold + Tools), not just the Weights.
  *   **Why:** This sets the stage. It tells your reader, "We aren't just tuning a brain; we are building a cockpit."
  *   **Trap to avoid:** Don't get stuck on semantics. By the end of Month 1, you must conclude: "Because the unit is the System, alignment failures will look like X, not Y."

  **Month 2 & 3: The Verifiability Gap (The "Sneaky" Problem)**
  *   **Goal:** Analyze the failure mode of that System.
  *   **Output:** An argument that as the Model component scales, the Human component of the System becomes the bottleneck. We cannot verify the output.
  *   **Focus:** Connect this to your "Test Day vs. Deployment Day" intuition. Argue that RLHF creates a "Test Day" optimizer.
  *   **Trap to avoid:** Don't predict doom. Analyze the *mechanism*. "If the model can simulate alignment better than it can be aligned, the feedback loop breaks."

  **Month 4: Synthesis & Load-Bearing Check**
  *   **Goal:** Put the two together.
  *   **Output:** If the Unit is the System, and the Weak Point is Verifiability, where should effort go?
  *   **Conclusion:** You might argue that prosaic alignment requires shifting focus from "training better models" to "building better verification scaffolds" (e.g., model-assisted evaluation, automated red-teaming).
  *   **Why:** This gives your teacher a concrete takeaway. It moves from "Here is a problem" to "Here is where the leverage is."

  ### Honest Assessment of the "Unit Problem"

  **Does it deserve the whole semester?**
  **No.** If you spend 4 months on the Unit Problem, you will likely end up with a semantic argument that doesn't touch the risk. It is a *category error* check. Once you establish the category error (that people are aligning weights when they should be aligning systems), you have solved that piece.

  **Should you demote it?**
  **No.** It must be first. It is the lens. If you skip it, you will accidentally write about weight-alignment when you mean system-alignment, and your arguments will be confused.

  **The Verdict:**
  Spend 25% of your time on the Unit Problem to establish the frame. Spend 75% on the Verifiability/Scaling problem within that frame.

  ### Why this works for your constraints
  1.  **No Math:** Both questions are conceptual/structural. They rely on logic, incentives, and definitions.
  2.  **Non-ML Teacher:** The "Unit Problem" is intuitive (Car vs. Engine). The "Verifiability Gap" is intuitive (Student vs. Teacher). You don't need to explain backpropagation to explain why a student might cheat on a test they know the teacher can't grade.
  3.  **Prosaic Focus:** This approach accepts the "scaling" premise. It doesn't argue "we should stop scaling." It argues "if we scale, here is where the current method breaks."

  ### Final Advice on "Upstream" Thinking
  You asked what makes a question upstream. A question is upstream if **answering it changes how you interpret the answers to downstream questions.**

  *   If you decide the Unit is the **Weights**, then "Sneakiness" is a bug in the learning algorithm.
  *   If you decide the Unit is the **System**, then "Sneakiness" is a bug in the interface or incentives.
  *   *That* is why the Unit Problem is upstream. It dictates where you look for the solution.

  If you can clearly articulate that shift in perspective for your teacher, you will have succeeded.
