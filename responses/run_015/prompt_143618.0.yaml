  A normative theory of justified unilateral action under distributed ignorance must enforce an asymmetric burden of proof that scales with outcome irreversibility while mandating epistemic updating on the fact of disagreement itself.

  ### Desiderata Specification for Justified Unilateral Action

  To resolve the unilateralist's curse without succumbing to paralysis or tyranny, a normative theory must satisfy the following constraints. These are not policy suggestions but logical requirements for the system to remain stable, epistemically sound, and ethically defensible.

  #### 1. Case Handling Requirements
  *   **Private Information Protocol:** The theory must allow action on private signals *only if* the signal quality exceeds a threshold that scales with the risk magnitude.
      *   *Hard Constraint:* Prevents noise-driven catastrophes while preserving the value of genuine dissent.
  *   **Overconfidence Correction:** The theory must apply a discount factor to self-assessed certainty levels derived from known cognitive bias distributions (e.g., calibration curves).
      *   *Hard Constraint:* Without this, the system rewards confidence rather than accuracy, incentivizing dangerous extremism.
  *   **Free-Ride Immunity:** The theory must link the right to act to a binding commitment to bear residual costs, preventing actors from privatizing benefits while socializing tail risks.
      *   *Hard Constraint:* Ensures incentive compatibility; otherwise, restraint becomes a sucker's payoff.
  *   **Reversibility Differential:** The burden of proof for action must increase asymptotically as the reversibility of the action approaches zero (one-way doors).
      *   *Hard Constraint:* A static threshold treats a pilot study and a planetary release identically, violating basic risk logic.

  #### 2. Conceptual Distinctions
  *   **Simple Ignorance vs. Acknowledged Error:** The theory must distinguish between "we don't know the outcome" (ignorance) and "we think we know but our model has high variance" (acknowledged error).
      *   *Hard Constraint:* Ignorance demands precaution; acknowledged error demands robustness testing. Conflating them leads to either paralysis or fragility.
  *   **Value vs. Factual Disagreement:** The theory must separate disputes over *ends* (values) from disputes over *means* (facts).
      *   *Hard Constraint:* Factual disputes are resolvable via evidence; value disputes require negotiation. Treating values as facts leads to technocratic tyranny; treating facts as values leads to relativism.
  *   **Acting Alone vs. Tacit Consent:** The theory must distinguish between true unilateralism and actions taken with silent acquiescence from affected parties.
      *   *Hard Constraint:* Tacit consent implies a distributed risk assessment; true unilateralism implies a concentrated one. The epistemic weight differs fundamentally.

  #### 3. Consistency Conditions (Social Choice & Epistemics)
  *   **Non-Dictatorship under Uncertainty:** No single actor's judgment can automatically prevail over the collective median unless specific emergency criteria (defined ex-ante) are met.
      *   *Why Hard:* If one actor can always override, the "distributed ignorance" benefit is lost, and the system collapses into autocracy where single-point failures dominate.
  *   **Common Prior Approximation:** Actors must update their beliefs based on the mere existence of disagreement among peers (Aumann-adjacent updating).
      *   *Why Hard:* If actors do not treat peer disagreement as evidence against their own certainty, disagreement becomes permanent and unresolvable by procedure.
  *   **Independence of Irrelevant Alternatives:** The justification for Action A cannot depend on the availability of unrelated Action B.
      *   *Why Hard:* Violating this allows manipulation of the choice set to force specific outcomes, breaking the integrity of the decision rule.

  ---

  ### Scorecard: Usual Suspects

  | Proposal | Private Info | Overconfidence | Free-Riding | Irreversibility | Consistency |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Prediction Markets** | **Pass.** Aggregates signals well. | **Fail.** Prices reflect bias if traders are biased. | **Fail.** Does not assign action authority or liability. | **Fail.** Prices don't scale burden of proof for permanence. | **Pass.** Epistemically consistent, normatively hollow. |
  | **Expert Veto Committees** | **Fail.** Insular; excludes outside private info. | **Fail.** Groupthink amplifies confidence; no bias discount. | **Pass.** Members are bound by fiduciary duty. | **Fail.** Static veto power doesn't scale with risk magnitude. | **Fail.** Violates Common Prior (ignores outside dissent). |
  | **Threshold Veto Norms** | **Fail.** Treats all signals equally regardless of quality. | **Fail.** No mechanism to correct for collective overconfidence. | **Fail.** Easy to coordinate on action, hard on restraint. | **Fail.** Static thresholds ignore the one-way door problem. | **Pass.** Satisfies non-dictatorship, fails epistemic updating. |

  ---

  ### The Knockout Criterion

  The single requirement that does the most damage to these popular proposals is the **Reversibility Differential (Asymmetric Burden of Proof)**.

  Prediction markets fail because they produce a probability, not a governance rule that tightens constraints for permanent actions. Expert committees fail because they typically operate with static charters; a veto is a veto, regardless of whether the action is a reversible software patch or an irreversible atmospheric release. Threshold norms fail because they rely on fixed consensus levels (e.g., "30% can veto"), which does not account for the asymmetry of harm. A system that does not dynamically adjust the authority required to act based on the permanence of the consequence cannot solve the unilateralist's curse for existential risks; it merely manages routine policy disputes.

  \answer{The Reversibility Differential (Asymmetric Burden of Proof)}
