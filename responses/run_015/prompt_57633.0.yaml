  ### Frank Statement on Verdicts and Terminology

  **1. Cases 6 and 7: Merge or Parameterize?**
  You suspect hypothesis (b) is illegitimate because the difference between 6 and 7 is "a fact about my purposes, not about the system's treatment of non-change."
  **Verdict:** You are half-right. The *system architecture* (learned filter) is identical. The difference is the **system-environment interface**. A theorem prover is defined by its isolation from empirical feedback; a robot is defined by its sensor loop.
  **Recommendation:** Do not merge them into a single case, but do not treat them as evidence of different *inference* capabilities. Treat them as evidence that "Solving the Frame Problem" is a **relational property**, not an intrinsic one. A filter solves the FP *for a robot* but not *for a prover*. Your thesis should explicitly state that FP solutions are relative to the agent's capacity for empirical correction. If you treat "Solve" as intrinsic, 6 and 7 contradict each other. If you treat "Solve" as relational, they are consistent.

  **2. Cases 4, 8, and 9: Literature Alignment**
  Your glosses are accurate regarding the standard distinctions in the literature, though the terminology varies.
  *   **Case 4** corresponds to the **Frame Problem proper** (representing inertia/inference of non-change).
  *   **Case 8** corresponds to the **Qualification Problem** (specifying all preconditions/exceptions for an action to succeed).
  *   **Case 9** corresponds to the **Ramification Problem** (handling indirect effects/constraints).
  **Assessment:** You are correct to keep them apart. The literature often conflates them under the umbrella "Frame Problem," but logically they are distinct. Your intuition that 4 is the "more important half" is defensible: without a solution to 4 (efficient inertia), a system cannot scale to handle 8 or 9. However, claiming 4 admits a "cleaner solution" is contentious. Many argue 4 is solved (via successor state axioms or minimization), while 8 remains intractable. Your verdict that 4 is "more important" holds if you define importance as "prerequisite for scalability."

  **3. Which Verdicts Should Go?**
  **Case 3** is the weakest link in your chain. You say it is a "solution" but also that it "inherits a relevance problem from me." If the relevance problem is inherited by the designer, the system itself is not general; it is a special-purpose engine tuned by you.
  **Recommendation:** Either downgrade Case 3 to "Partial Solution" or acknowledge that *all* FP solutions (including 2 and 4) require designer input (choosing the frame axioms, the causal laws, or the metric). If designer input is unavoidable, your worry about Case 3 applies to Case 4 as well. To maintain consistency, you should treat Case 3 as a **full solution**, provided the metric is computable. The "relevance problem" is not a failure of the system, but a feature of the world's structure.

  ---

  ### Is "Solve" Graded or Engineering?

  You ask whether "solve" is doing genuinely graded work or merely tracking engineering trade-offs.

  **Analysis:**
  If the Frame Problem is defined as "How to represent change without explicit axioms for non-change," then **Case 1** is a categorical failure (it does the very thing the problem forbids). **Case 2** and **4** are categorical successes (they avoid the axioms). This suggests a binary distinction.

  However, your Cases 6 and 7 introduce **reliability** into the definition. If a system solves the inference problem but gets the facts wrong 1% of the time (Case 6), is it a solution? You say yes for robots, no for provers. This implies "Solve" means "Solve *adequately for the context*."

  **Conclusion:**
  "Solve" is **binary regarding architecture** but **graded regarding performance**.
  *   **Binary:** Did the system avoid the combinatorial explosion of frame axioms? (Yes/No). This separates Case 1 from Cases 2–7.
  *   **Graded:** How robust is the persistence assumption? (Defeasible, Probabilistic, Certain). This separates Case 2, 6, and 7.

  **Thesis Recommendation:**
  Do not weaken your thesis to "engineering trade-offs." Instead, refine it: **The Frame Problem is a categorical constraint on representation (scalability), but satisfying that constraint admits of degrees in epistemic security.**
  The old dispute turned on treating *epistemic security* (logic) as a requirement for *representational scalability* (AI). Your cases show they are separable. Logic-based critics demanded certainty (Case 7 standard); AI practitioners accepted scalability with fallibility (Case 6 standard). Both are "solutions" to different halves of the tension. Your paper should argue that the "dispute" was a category error: the critics were solving the **Verification Problem**, while the engineers were solving the **Scaling Problem**. Both are necessary, but they are not the same problem.
