  **MINUTES OF THE LOWER WALFORD PARISH COUNCIL**
  **Date:** 14th November 2023
  **Location:** Council Chamber, Lower Walford
  **Present:** The Chair (Cllr H. Bennett), Cllrs A. Davies, B. Evans, C. Foster, D. Griffiths. The Clerk (Mr S. Hume).

  **1. Confirmation of Minutes**
  The minutes of the previous meeting were approved as a true record of proceedings. No matters arising.

  **2. Noise Abatement on the A42**
  The Council considered a proposal to install acoustic barriers along the northern stretch. Mrs Gable submitted testimony citing chronic insomnia caused by traffic noise. Traffic representatives noted a resultant two-second delay per vehicle during peak hours.
  The Chair asked whether any single motorist could reasonably reject the principle requiring the barrier. Cllr Davies argued that from an impartial standpoint, informed of the consequences, a two-second delay is too negligible to constitute a generic reason for rejection when set against the loss of sleep. The Clerk suggested recording the aggregate delay across all users. The Chair ruled this out of order, noting that justification is owed to each person individually, not to the collective. The motion carried unanimously.

  **3. River Flood Levy**
  A levy was proposed to fund defences protecting 4,000 properties from seasonal flooding. Mr Prufrock objected, stating the defences would obstruct his river view.
  The Clerk attempted to record the cumulative benefit to the 4,000 properties to outweigh the single objection. The Chair intervened, reminding the Council that contractualism forbids summing complaints across persons. No single property owner faces a burden sufficient to outweigh Mr Prufrock's loss of view; therefore, he can reasonably reject the principle. The motion was defeated. Cllr Evans noted for the record that the town would flood.

  **4. Motion on Arithmetical Reasoning**
  Cllr Griffiths moved to permit the summation of minor burdens where total utility is high. He argued that strict individualism renders governance impossible.
  Cllr Davies opposed, noting that to sum complaints is to treat persons as containers of value rather than distinct reasoners. The principle of reasonable rejection requires that we justify our actions to each individual separately. To allow arithmetic would be to abandon the contractualist framework entirely. The motion was lost 1-4. The Clerk was instructed to remove all calculators from the chamber.

  **5. Standing Order 14(b)**
  The Council considered a parking restriction affecting 50 residents equally. A counter-proposal affected 51 residents equally. Burdens were deemed identical in strength.
  The Chair invoked Standing Order 14(b), which permits numerical precedence where complaints are exactly equal in generic strength. The Chair noted this was the first invocation in the Council's history and expressed significant reservation regarding its necessity, describing it as a concession to arithmetic reluctantly tolerated. The motion carrying the restriction on the 51 residents passed. Cllr Foster requested that the invocation not be minuted prominently, but the Clerk advised this was procedurally impossible.

  **6. Any Other Business**
  Cllr Griffiths asked whether the Council might consider utilitarianism for bin collection. The Chair ruled the question out of order.

  There being no further business, the meeting closed at 9:15 pm.

  ***

  **Epistemic Note**

  This satire leans on a rigid interpretation of Scanlon's *What We Owe to Each Other*. While Scanlon forbids aggregating small burdens to outweigh a large one, he does allow comparing the *strength* of individual complaints (the "greater burden" view). The Council's defeat of the flood levy assumes the single loss of view outweighs the individual risk to any one homeowner, which is contestable. Furthermore, Scanlon has suggested that where burdens are similar, numbers might count (the "tie-breaker" argument), depicted here as Standing Order 14(b). In reality, Scanlon treats this not as a shameful secret but as a way to save numbers without full aggregation. The minutes present these philosophical nuances as bureaucratic rigidities to highlight the tension between individual justification and collective welfare.
