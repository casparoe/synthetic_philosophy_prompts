prompt: |-
  I teach a graduate seminar on personal identity and practical reason, and we have just finished two weeks on the authority of advance directives. My students now have three well-worn ways of setting a directive aside, and they reach for them automatically: (i) the patient is no longer the person who wrote it, so the earlier self's self-determination does not extend to her; (ii) the situation that has actually arrived is not the one the directive contemplated, so the document does not cover it; (iii) the earlier self would have written something different had she known what we now know, or her values have since changed. I want a case that closes all three and still comes out against honoring the directive.

  So: construct a case in which a procedurally impeccable directive — competently written, well informed, specific, never formally revoked, and containing a self-binding clause of the Ulysses kind, instructing that any later refusal by the patient is not to be counted as hers — should nevertheless be set aside at the later self's request, and in which none of (i), (ii) or (iii) is what does the work. Concretely: the later self must be psychologically continuous with the woman who wrote it and must remember writing it; the clinical situation must be the one she plainly had in mind; and her values must not have changed — I want her to insist, plausibly, that they have not. What has changed is that she now occupies the state the directive was written about, and from inside it she claims to see something she could not have seen from outside: not a new fact about her prognosis or her treatment, since she had every proposition a well-counseled patient could have been given, but what her own standing ends actually require from in here. Her claim, as I want you to stage it, is interpretive rather than revisionary: she was always authoritative about what matters to her, but not about how that applies from inside a condition she could not then imagine, and the directive taken literally would now defeat the very thing it was written to protect. Keep it realistic — a ward, a clinic, a care home, nothing science-fictional, nothing turning on the fine print of any real statute, and the scenario itself in a single paragraph. Arrange matters so that the later self is not, on balance, experientially better off if the directive is set aside; I do not want the override to be a disguised appeal to present comfort. If you find that the ban on (i) to (iii) cannot be honored, or that any case of this shape secretly is (iii) in a costume, tell me so plainly instead of fudging it — an honest failure is more use to me in a seminar than a case that cheats.

  With the case in place, do the check. Say what three views would each do with it and why: simple precedent autonomy, on which the point of a directive just is to let an earlier self bind a later one; the integrity or critical-interests view, on which a directive is at best evidence of what the shape of a whole life requires and can in principle be defeated by better evidence about that; and the skeptical view that stresses the present patient's experiential interests and the danger of a dead hand. I want precedent autonomy to honor the directive and the integrity view to set it aside — I am aware that this reverses the direction in which the integrity view is usually wheeled in, and I mean to — with the third view neutralized by your stipulation about experiential welfare, so that nothing in the argument quietly leans on it. Then, separately: name the single feature of the case that is doing the work; show what happens to the verdict when that feature is removed, in particular if the later self's discovery is made propositional (a piece of information she simply lacked) and if the self-binding clause is dropped; and give me the strongest reply available to a defender of precedent autonomy, not a straw man. The use I have in mind is ninety minutes of seminar: I want students to end up arguing about whether the earlier self is ever an authority over the application of her own values or only over the values themselves. Close with two or three sentences of your own assessment — how confident you are that the case meets all of these constraints simultaneously, and which one of the claims above you are least sure of. My own guess is that the weak point is whether reinterpretation here is really distinguishable from a change of mind, but tell me if you think it lies somewhere else.
reasoning: |-
  Here's a thinking process that leads to the suggested case and analysis:

  1.  **Analyze the Request:**

      *   **Context:** Graduate seminar on personal identity and practical reason.
      *   **Topic:** Authority of advance directives (ADs).
      *   **Current Student Heuristics (to be blocked):**
          1.  Discontinuity of self (Parfitian reductionism/psychological discontinuity).
          2.  Mismatch of situation (AD doesn't cover *this* specific scenario).
          3.  Change of values/values update (Earlier self would have decided differently with new info/values).
      *   **Task:** Construct a *single paragraph* realistic case where an impeccable AD (competent, informed, specific, Ulysses clause) is set aside at the later self's request, *without* triggering (i), (ii), or (iii).
      *   **Constraints on the Case:**
          *   Later self is psychologically continuous (remembers writing it).
          *   Clinical situation matches the AD's contemplation.
          *   Values haven't changed (later self insists they haven't).
          *   The shift is *interpretive*, not revisionary (inside vs. outside perspective on the *application* of values).
          *   Later self is *not* experientially better off if the AD is set aside (blocks hedonic/skeptical override).
          *   Realistic setting (ward/clinic/care home).
          *   If impossible, admit it honestly.
      *   **Analysis Required:**
          *   Apply three views: Precedent Autonomy (honor AD), Integrity/Critical Interests (set aside AD), Skeptical/Experiential (neutralized).
          *   Identify the single feature doing the work.
          *   Show what happens if that feature is removed (propositional info or dropping Ulysses clause).
          *   Provide the strongest reply for Precedent Autonomy.
          *   Goal: Spark debate on authority over *application* vs. *values*.
          *   Closing Assessment: Confidence level and weakest link.

  2.  **Deconstructing the "Impossible" Constraint:**

      *   The core tension is between "Values haven't changed" and "Decision changes."
      *   Standard view: Decision = f(Values, Beliefs/Facts).
      *   If Facts are constant (constraint ii) and Values are constant (constraint iii), Decision should be constant.
      *   To break this, I need a third variable: *Perspective/Epistemic Position regarding the instantiation of values.*
      *   The prompt asks for an "interpretive rather than revisionary" claim. The later self says: "I value X. I thought X required Y when I was healthy. Now that I am in the state, I see X actually requires Z."
      *   *Challenge:* Is this just a change of belief (constraint ii)? The prompt says "not a new fact about her prognosis or treatment." It must be about "what her own standing ends actually require from in here."
      *   *Challenge:* Is this just a change of value (constraint iii)? The prompt says she insists values haven't changed.
      *   *Challenge:* Experiential welfare. If she wants to live, usually it's because living feels okay. I need a case where living is *not* pleasant, but she still claims it serves her values *better* than the AD's instruction to die/stop treatment.
      *   *Idea:* A case of severe disability where the AD says "Don't keep me alive if I can't recognize my family," but the patient *can't* recognize them yet claims that her *dignity* or *sanctity of life* value is better served by continuing, despite the misery.
      *   *Problem:* That sounds like a value change (Sanctity of Life > Autonomy/Recognition).
      *   *Better Idea:* The "Adaptation" problem, but stripped of hedonic gain.
      *   *Refined Idea:* A musician with a directive stating, "If I lose the fine motor control to play, withdraw life support." She suffers a stroke. She cannot play. She is miserable (not experientially better off). She requests continued treatment. She says, "I value musical expression. I thought that meant *performing*. Now I see it means *witnessing* or *teaching* or simply *being the person who wrote these notes*."
      *   *Critique:* That sounds like a change in how she ranks values (Performance vs. Existence).
      *   *Refined Idea (The "Dignity" Trap):* An AD based on avoiding indignity. The patient enters the state. She finds that what she *thought* was indignity is actually bearable, but more importantly, she finds that *dying* in this specific way is *more* undignified than living.
      *   *Constraint Check:*
          *   (i) Self continuous? Yes.
          *   (ii) Situation matches? Yes (the state predicted).
          *   (iii) Values changed? She says no. "I still value dignity above all."
          *   Experiential welfare? She is still suffering. She isn't asking to live because it's fun. She's asking to live because dying *now* violates the value of dignity more than living does.
      *   *The Twist:* The AD was written to protect her dignity. Honoring it now would violate her dignity. This is the "Self-Defeating Directive" paradox.
      *   *Specific Scenario:* Advanced ALS. AD says: "If I cannot speak or swallow, terminate." Rationale: "I cannot bear to be a burden/voiceless." Current state: Cannot speak/swallow. She is miserable (burdened). But she communicates (eye tracking) that terminating now, *in this specific political/social context* (e.g., her family is fighting for her, or she has completed a specific communicative act), would render her life's narrative incoherent in a way that violates the *same* dignity value.
      *   *Wait, the "Experiential Welfare" constraint is hard.* If she is miserable, why live? If she says "It serves my critical interests," that's the Integrity view. I need to make sure the Skeptical view doesn't sneak in. The Skeptical view says "Listen to her because she's suffering less than you think." I must stipulate she is *not* suffering less. She is suffering *more*, or the same. She chooses life *despite* suffering.
      *   *Let's try a specific narrative:* A woman with early-onset dementia (but still competent enough to request override? No, dementia complicates continuity). Let's go with Locked-In Syndrome or severe ALS.
      *   *Scenario:* Elena, a litigator, wrote an AD: "If I cannot speak without aid and am bedbound, withdraw nutrition." Value: Agency/Advocacy. She is now in that state. She uses eye-gaze tech to request food. She is depressed and finds the state agonizing (not experientially better off). She argues: "I valued Agency. I thought Agency required physical speech. I now see that maintaining my biological existence is the only platform left for any agency at all; to withdraw is to silence the only voice I have left (the eye-gaze). Honoring the AD destroys the very Agency it was meant to protect."
      *   *Check:*
          *   (i) Continuous? Yes.
          *   (ii) Situation matches? Yes (bedbound, no speech).
          *   (iii) Values changed? No, still values Agency.
          *   Experiential? She hates it. It's hard work.
          *   Interpretive? Yes. Application of "Agency" shifted from "Physical Speech" to "Existence as Precondition for Any Voice."
      *   *Is this just a belief change (ii)?* She lacked the belief that eye-gaze would be her only voice? No, she knew the tech existed. She just didn't know how it would *feel* to rely on it as her *only* moral foothold.
      *   *Is this value change (iii)?* She claims it's not. It's the same value, new application.
      *   *This looks promising.*

  3.  **Drafting the Case (Single Paragraph):**

      *   Need to ensure the "Ulysses Clause" is mentioned.
      *   Need to ensure the "Experiential Welfare" is neutralized (she is miserable).
      *   Need to ensure the "Interpretive" claim is clear.

      *Draft:* Elena, a former human rights attorney, executed a Ulysses-style advance directive after diagnosing herself with ALS, stipulating that if she became locked-in and unable to speak without mechanical aid, nutrition should be withdrawn, explicitly instructing that any later plea to the contrary be treated as a symptom of denial rather than a valid choice. She envisioned this state as the total extinction of agency, which she valued above biological life. Two years later, fully locked-in but cognitively intact and psychologically continuous, she uses eye-tracking technology to demand continued feeding. She reports no improvement in her experiential welfare; the condition is agonizing, isolating, and humiliating, exactly as predicted. However, she insists her core value—agency—has not changed. She argues that from outside the condition, she equated agency with independent physical action, but from inside, she sees that her biological existence is now the necessary substrate for the only agency remaining: the moral witness she bears simply by enduring. She claims that honoring the directive would not protect her agency but annihilate the last platform for it, rendering the directive self-defeating regarding its own animating value.

  4.  **Developing the Analysis:**

      *   **View 1: Precedent Autonomy.**
          *   *Verdict:* Honor the AD.
          *   *Reasoning:* The earlier self was competent, informed, and specifically anticipated the later self's objection (Ulysses clause). The later self's "interpretation" is indistinguishable from a preference shift, which the AD was designed to block. Authority lies in the time of competence.
      *   **View 2: Integrity / Critical Interests (Dworkin-esque but tweaked).**
          *   *Verdict:* Set aside AD.
          *   *Reasoning:* Usually, Integrity supports ADs to maintain the narrative arc. *However*, here the AD threatens the *coherence* of the life's central value. If the goal is to live a life that makes sense as a whole, and the AD destroys the very value it purports to serve (Agency), then the Integrity view demands overriding the specific instruction to save the underlying integrity. The "shape of the whole life" requires surviving to fulfill the witness role.
          *   *Note:* The prompt asks for this reversal. Usually, Integrity supports ADs against experiential selves. Here, it supports the experiential self against the AD because the AD is *internally incoherent* with the life's critical interests *as now understood*.
      *   **View 3: Skeptical / Experiential.**
          *   *Verdict:* Neutralized.
          *   *Reasoning:* This view usually says "Listen to the present self because she feels the pain/pleasure." But the prompt stipulates she is *not* experientially better off. She is suffering. So the Skeptic cannot argue "Let her live, she's happy." They must argue "Let her live, she says so." But if they defer to her request despite her suffering, they are implicitly accepting her *interpretive* claim, moving into Integrity territory. The constraint blocks their usual move.

  5.  **Identifying the "Single Feature":**

      *   What makes the difference? It is the **Self-Defeating Nature of the Directive regarding its Own Animating Value**.
      *   The AD was written to protect Value V.
      *   Executing the AD destroys Value V (from the inside perspective).
      *   If removed (e.g., if the discovery was just propositional info like "You will actually feel less pain"), it becomes a standard information update (Constraint ii violation).
      *   If the Ulysses clause is dropped: Precedent Autonomy weakens significantly because the earlier self didn't anticipate the later self's specific objection. The case relies on the earlier self trying to block *this specific kind* of reinterpretation and failing.

  6.  **Strongest Reply for Precedent Autonomy:**

      *   The "Slippery Slope / Epistemic Humility" argument.
      *   We cannot verify "interpretive clarity" vs. "adaptive preference."
      *   If we allow the later self to redefine the application of values, we render all ADs useless. Any AD can be bypassed by claiming "I didn't realize *this* is what my value meant."
      *   The earlier self's "cold" judgment is the only reliable metric for high-stakes decisions because the later self is compromised by the *pressure of existence* (the will to live), even if she claims it's about values. The "interpretive shift" is a rationalization generated by the biological drive to survive, which the AD was meant to override.

  7.  **Closing Assessment:**

      *   Confidence: High on structure, moderate on the philosophical distinction.
      *   Weakest Link: The distinction between "reinterpretation of application" and "change of value/weighting." It is incredibly difficult to prove that realizing "Existence is a precondition for Agency" isn't just a change in how much one values Existence relative to Agency.
      *   I need to be honest about this in the assessment.

  8.  **Refining the Output:**

      *   Ensure the tone is academic and precise.
      *   Check the paragraph constraint.
      *   Check the "honest failure" clause (I believe the case works, so I won't invoke this, but I will acknowledge the tension in the assessment).
      *   Make sure the Integrity View explanation clearly justifies the reversal (usually Integrity = AD, here Integrity = Override). *Self-Correction:* Dworkin's Integrity view usually favors the AD (critical interests > experiential). To make it favor the *override*, I must argue that the AD *fails* to serve the critical interests because it is based on a factual error about the *instantiation* of those interests, not the interests themselves. It's an internal coherence argument.

  9.  **Final Polish:** Check against all constraints one last time.
      *   (i) Continuous? Yes (cognitively intact).
      *   (ii) Situation matches? Yes (locked-in as predicted).
      *   (iii) Values unchanged? Yes (claims Agency is still paramount).
      *   Experiential welfare? Neutralized (she is miserable).
      *   Single paragraph case? Yes.
      *   Three views analyzed? Yes.
      *   Single feature identified? Yes.
      *   Strongest reply? Yes.
      *   Assessment? Yes.

      *Wait, one nuance on the Integrity View:* The prompt says "the integrity or critical-interests view, on which a directive is at best evidence of what the shape of a whole life requires and can in principle be defeated by better evidence about that." This phrasing *helps* me. It explicitly allows the directive to be defeated by "better evidence." My case turns on the later self having "better evidence" about how the value instantiates. So the Integrity view *must* set it aside by definition of the prompt's framing. Good.

      *Wait, one nuance on Precedent Autonomy:* "Simple precedent autonomy, on which the point of a directive just is to let an earlier self bind a later one." This view *must* honor the directive. Good.

      *Wait, one nuance on Skeptical:* "Skeptical view that stresses the present patient's experiential interests and the danger of a dead hand." I need to ensure this is neutralized. Since she is miserable, the Skeptic usually says "Follow the AD (she's suffering)." But she is requesting override. So the Skeptic is torn. If they follow her request, they ignore her suffering. If they follow the AD, they ignore her request. The prompt says "neutralized by your stipulation about experiential welfare." I need to explain *why* it's neutralized. It's neutralized because the usual Skeptic move ("She's suffering, let her die") conflicts with the usual Skeptic move ("She's the only one who knows her mind, let her choose"). Since she chooses life *despite* suffering, the Skeptic has no clear "experiential" lever to pull. They can't say "She's happier living." They have to say "She chooses living." That moves them out of pure experientialism. Okay, I will articulate this tension as neutralization.

