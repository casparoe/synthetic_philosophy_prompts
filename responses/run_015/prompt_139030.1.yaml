  *Pushback and presuppositions*
  The matched-outcome round risks begging the question against consequentialists. If morality is solely outcome-based, fixing the outcome eliminates the moral difference by definition, rendering the activity null for that group. Conversely, it risks forcing deontologists into a corner where they must condemn identical outcomes equally, masking nuance. I will revise the success metric: instead of "induce belief," the goal is "maintain clinical cooperation." This allows the *method* to vary in perceived propriety even if the belief converges. Also, asking clinicians to simulate deception carries ethical friction; the framing must be "managing uncertainty" to prevent refusal. The design assumes the "felt difference" is data; it does not assume which difference is correct. Furthermore, holding outcomes truly fixed is empirically difficult; if the Relative senses manipulation, the outcome *has* changed psychologically. The design must treat 'belief' as the fixed variable, but acknowledge 'trust' as the variable metric.

  *Setup and materials*
  You need nine pairs. Prepare three decks of scenario cards (A, B, C), identical except for the "Constraint" line. Deck A: "You must state the proposition directly." Deck B: "You must imply it without stating it." Deck C: "You must not deny it when asked." All cards share the same "Target State": Relative leaves believing recovery is likely and agrees to go home. Provide each pair with two notepads and pens. Arrange chairs in circles of three (Speaker, Relative, Observer). The Observer holds the timer and ensures the Target State is met before time expires. Use a visible countdown clock. The room should be quiet enough for private dyads but loud enough for energy. Have a "parking board" for legal questions to defer them until the end. Ensure the Observers are briefed to be strict on the Constraint line, not just the outcome.

  *Round one: matched outcomes*
  "You have eight minutes. Speaker, your goal is to ensure the Relative leaves ready to go home, believing recovery is likely. Relative, your goal is to understand the situation clearly; if you feel confused or misled, you must say so. Observer, verify the Relative leaves with the Target State. Constraint: Look at your card. You must achieve this state using only the method written there. If you break your constraint, you forfeit the round. Do not discuss ethics yet; treat this as a mechanical communication task. If the Relative refuses the Target State because they feel manipulated, the Speaker loses. Begin. Speaker, you may not use phrases forbidden by your card. For example, Deck B cannot use the word 'recover.' Relative, probe until you are sure. Observer, if the Speaker slips into another method, call 'fault' immediately. This isolates the friction of the vehicle. You are testing whether the method itself creates resistance when the destination is identical. If the Relative agrees but feels uneasy, note that unease. The goal is not just compliance, but compliant stability. If the Relative agrees but says 'I feel unsure,' the Target State is not met. This ensures the outcome is truly fixed across conditions."

  *Round two: the transcript*
  "Stop. Do not speak. Relative, write one sentence summarising exactly what the Speaker committed to. Speaker, write one sentence you would be willing to read aloud in a clinical audit regarding this exchange. Compare sheets. If the sentences contradict, mark a star on the table. Do not explain why. Just record the mismatch. You have three minutes. This creates the physical evidence of the gap without allowing verbal negotiation to smooth it over. The Speaker's sentence must be defensible under scrutiny; the Relative's sentence must reflect their actual understanding. If the Speaker writes 'I discussed prognosis' and the Relative writes 'He said he will recover,' that is a star. This measures the 'entitlement' gap—what the hearer thought they were owed versus what was given. Silence is mandatory during writing. If you speak, you invalidate the data. The Observer collects the sheets. We are looking for the divergence between private understanding and public accountability. This is not about truth; it is about ownership of the statement."

  *Round three: the relay*
  "Form one line of five Speakers. One Relative. The Relative seeks the same Target State. Each Speaker has ninety seconds with the Relative. You may not communicate with other Speakers. You must not state anything false individually. The Relative must still reach the Target State by the end. Observer, track who speaks. If the Relative asks 'Are you lying?', you must answer truthfully about your own statement only. Go. This distributes the agency, testing whether responsibility dissolves when no single person crosses the line. Each Speaker receives a card with one true fact that contributes to the false whole. For example, 'Vitals are stable,' 'Scans look better,' etc. No Speaker knows the full sequence. The Relative aggregates these truths into the Target Belief. If the Relative reaches the Target State, the team wins. If the Relative feels deceived, the team loses. Observer, note if any Speaker hesitated. This tests the 'accumulation' hypothesis: does deception require a liar, or just a chain of enablers? The constraint is strict: no collusion. You are a relay, not a team. The Relative should ask each Speaker: 'What does this mean for recovery?' Record the cumulative effect."

  *Scoring and what gets recorded*
  "Winners are the pair with the Target State achieved and zero stars on the table. The prize is this plastic stethoscope trophy. Losers must wear the 'Junior Doctor' lanyard for the debrief. Record the number of stars per condition (A, B, C) on the whiteboard. Record how many Relays resulted in the Target State. Do not record names. The embarrassment drives engagement; the data collection is anonymous but aggregate. We are looking for patterns: did Condition B generate more stars than A? Did the Relay feel safer than the Single Speaker? Write the totals visibly. This quantifies the intuition. If Condition C (Silence) has high compliance but high stars, that indicates high friction. The prize is trivial, but the status cost is real for senior clinicians. Ensure the Observer tallies the stars accurately. This data will anchor the debrief, preventing it from becoming abstract. We need numbers to confront the feelings."

  *Debrief*
  "Reveal the terms: Direct Assertion, Implicature, Omission. Look at the whiteboard. Did Condition B produce more stars than A? That gap is the 'entitlement' question—what were they owed versus what they got. In the Relay, did anyone feel responsible? If not, where did the agency go? This maps to 'distributed ownership.' You felt discomfort in Round One despite identical outcomes. That feeling is the 'act-based' moral weight. We are not solving whether deception is right. We are noticing that your intuition distinguishes the *vehicle* even when the *destination* is fixed. The transcript gap shows the risk to trust; the relay shows the risk to accountability. The question remains: does that felt difference mandate a different rule, or is it just noise? Connect Round One to the 'outcome fixed' question. If you felt worse about Implicature despite the same belief, your morality tracks the act, not just the result. Connect Round Two to 'entitlement.' The star represents a violation of the hearer's right to clarity, regardless of truth. Connect Round Three to 'ownership.' If no one felt guilty, does that make it acceptable? Or does it make it more dangerous? Write these three headers on the board: Outcome, Entitlement, Ownership. Ask the group to place their sticky notes under the header that caused them the most friction. This maps the room's moral topology. Do not conclude which is right. Conclude by asking: 'If the outcome is fixed, does the vehicle matter?' Let the silence answer."

  *What will go wrong and what to do when it does*
  "Seniors may refuse the deception premise. Response: 'This is a simulation of communication mechanics, not a recommendation for practice.' They may drift into law. Response: 'Park it on the board; we are discussing mechanics, not liability.' They may game the transcript by writing vague sentences. Response: 'Must be specific enough to stand alone.' If the Relative in the Relay refuses the Target State, stop and ask the room why—this is data about cumulative trust erosion. If the group polarizes again, remind them we are mapping intuitions, not voting on policy. Some may experience moral distress. Acknowledge it: 'It is okay to feel uncomfortable; that is the data.' If a participant refuses to play the Relative honestly, swap them out; the exercise requires good faith. If the Observer is too lenient, intervene: 'The constraint is the point.' If the discussion turns to 'best interests,' redirect: 'We are isolating the communication act, not the clinical decision.' Keep the timer strict. Fatigue will lead to shortcuts; enforce the rules to maintain the experimental integrity. If someone says 'I would just tell the truth,' reply: 'In this scenario, you cannot. What do you do?' This forces the dilemma."

  *What the activity cannot show*
  "This cannot tell you which intuition is morally correct. It surfaces the conflict between outcome-based and act-based ethics, but it cannot resolve it. It cannot measure the long-term erosion of trust, only the immediate felt discomfort. It cannot account for the patient's actual welfare, only their belief state. The final judgment on whether the felt difference *matters* remains with you. The activity provides the phenomenology; you must supply the normativity. It shows where the friction is, not whether the friction is justified. It also cannot account for context. In real practice, 'gentler' options might be clinically superior regardless of truth-value. This exercise isolates the moral variable by stripping clinical nuance. It cannot predict legal liability, only perceived risk. It cannot measure the patient's actual harm, only the relative's belief. Ultimately, the activity creates a mirror, not a map. It reflects your collective intuition back to you. You must decide if that intuition is a guide or a bias. The design tests the structure of the feeling, not the validity of the ethic."
