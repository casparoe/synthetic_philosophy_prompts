answer: |-
  You have identified a profound structural weakness in the philosophical defense of meritocracy, one that often gets glossed over in introductory discussions. To understand why this circularity is so damaging, we need to dissect the relationship between what we can observe (performance) and what we want to reward (effort), and then see how the tools we use to measure them are already contaminated by the system we are trying to judge.

  **Step 1: The Goal of "Pure Effort" and the Measurement Gap**
  The intuition behind your "pure effort meritocracy" is rooted in the idea of moral desert. The argument is that natural talents are morally arbitrary—you didn't earn your high IQ or your athletic fast-twitch muscles any more than you earned your eye color. Therefore, rewarding people for talent is like rewarding them for winning a genetic lottery. Justice seems to demand that we reward only what is within their control: their effort, their grit, their will to strive.

  However, effort is invisible. We cannot see "willpower" directly; we can only infer it by looking at what a person achieves. If Student A gets an A and Student B gets a C, we cannot know who tried harder unless we know their starting capacities. If Student A has a genius-level innate capacity and Student B has a learning disability, Student B might have expended vastly more effort to get the C. To reward pure effort, we need a formula: *Effort = Performance / Innate Capacity*. But this creates an immediate epistemic problem: we have no direct access to the "Innate Capacity" variable. We have to estimate it.

  **Step 2: The Source of the Baseline and the Circular Trap**
  Here is where the circularity you suspected emerges. To estimate "Innate Capacity," we typically look at proxies: standardized test scores, early school performance, or puzzle-solving speeds. But where do these metrics come from? They are generated within existing social institutions (schools, testing centers) that are already embedded in a specific distributive system.

  These institutions are not neutral laboratories. They are shaped by funding disparities, cultural biases, nutrition, early childhood education, and social stability. When we measure a child's "raw capacity" using a standardized test, we are measuring their capacity *as it has been developed and expressed within that specific social context*. If the system is already unjust—for example, if it underfunds schools in certain neighborhoods—the "capacity" data we collect will reflect those injustices.

  The circle closes when we use this contaminated data to justify the rewards distributed by the system. We say, "We are rewarding Student A more because our measurements show they have higher capacity relative to effort," but the measurement itself was produced by the very institution we are trying to justify. We are using the output of the system to validate the fairness of the system. If the system suppresses the performance of a certain group, our measurement of their "innate capacity" will be lower, leading us to conclude they deserve less, which reinforces the suppression. We cannot step outside the system to get a "view from nowhere" to calibrate our measurements.

  **Step 3: Backward-Looking Desert vs. Forward-Looking Merit**
  This circularity strikes different philosophical concepts in different ways. It is crucial to distinguish between *backward-looking moral desert* and *forward-looking merit*.

  *   **Backward-looking desert** is about what you *owe* someone based on what they have already done. It is a claim of justice: "You suffered and worked hard, so you *deserve* this reward regardless of the outcome." This claim relies entirely on the accuracy of the effort measurement. If our measurement of effort is circular because it relies on contaminated capacity data, then the claim of justice collapses. We cannot say someone truly *deserves* a reward based on effort if we cannot reliably separate their effort from their luck-derived advantages.

  *   **Forward-looking merit** is about incentives and utility. It asks: "What reward structure will produce the best outcomes for society in the future?" Here, the circularity is less fatal but changes the moral stakes. A society might decide to reward high performers not because they *deserve* it in a moral sense, but because doing so incentivizes productivity. However, if you adopt this view, you are no longer defending meritocracy as a system of *justice*; you are defending it as a system of *efficiency*. You must admit that the high rewards are not because the talented person is morally better, but because we are bribing them to work hard.

  The conceptual tension you found forces us to choose: either we claim our measurements are pure (which seems empirically false due to the circularity), or we admit we are not actually rewarding desert, but merely managing incentives.

  **Step 4: The Possibility of a Non-Circular Baseline**
  Could we escape this circle by finding a baseline that exists outside social institutions? Some might suggest neuroscience (brain scans) or genetics. However, this runs into a normative problem. Even if we could measure raw neural processing speed or genetic markers, we still have to decide *which* capacities count as valuable. Is "capacity" defined by logical speed? Emotional resilience? Creative divergence?

  The definition of what counts as "capacity" is itself a social choice. A society that values coding will define capacity differently than a society that values hunting or caregiving. Therefore, even a biological baseline is not truly non-circular, because the *interpretation* of that biology depends on the values of the distributive system we are trying to evaluate. We cannot measure "raw human potential" without already having a theory about what humans are *for*, and that theory is part of the social institution we are questioning.

  **Conclusion**
  The difficulty you have uncovered suggests that a "pure effort meritocracy" is conceptually unstable. Because we cannot measure effort without referencing performance, and we cannot measure capacity without referencing the social institutions that shape performance, we cannot cleanly isolate the moral component of desert from the arbitrary component of luck. This implies that any claim to be rewarding "pure effort" is likely masking a decision to reward social utility, shifting the justification from justice to efficiency.

  Summary: Isolating pure effort for moral desert creates a circular justification because measuring innate capacity relies on data from the very institutions being evaluated, collapsing claims of justice into mere efficiency.
