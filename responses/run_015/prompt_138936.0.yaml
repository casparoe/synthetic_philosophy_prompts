  2.  **Deconstruct the GEB Concept (Hofstadter's Three Levels):**
      *   *Frame Message:* "I am a message." (The signal that there is signal).
      *   *Outer Message:* "Here is how to read me." (The cipher/key/structure).
      *   *Inner Message:* "Here is the actual content." (The meaning).
      *   *The "Weird Part":* Meaning isn't *in* the object; it's in the interaction between object and interpreter. You can have Frame + Outer without Inner (gibberish). You can have Frame + fake Inner without Outer (guessing).

