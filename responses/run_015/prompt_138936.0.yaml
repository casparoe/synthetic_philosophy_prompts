              *   Outer Message: "Start at the arrow, read clockwise." -> "THE CAT SAT."
              *   Sabotaged Outer Message: "Start at the arrow, read counter-clockwise." -> "TAS TAC EHT" (Gibberish).
              *   *Need Fluent Wrong:* "THE DOG RAN" vs "THE CAT SAT".
