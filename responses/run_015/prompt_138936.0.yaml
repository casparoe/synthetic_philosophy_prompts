      *   *Group 7 gets:* "3. Pigeons can fly." (True, but irrelevant). Or "3. Pigeons are mammals." (False, fluent).
      *   *Let's go with "3. The earth is flat."* Fluent, meaningful, factually wrong.
      *   *Wait, philosophical context.* "3. Consciousness is physical." vs "3. Consciousness is dual."
      *   *Perfect.*

  13. **Final check on "Loop":**
      *   Ensure the loop closes.
      *   Group A has Msg A (Encrypted). Key B (Plain).
      *   Group B has Msg B (Encrypted). Key C (Plain).
      *   Group C has Msg C (Encrypted). Key A (Plain).
      *   Msg A (Decoded) says: "This statement is the Key for Group B."
      *   Does Key B match Msg A?
      *   Key B is "Caesar Shift 5".
      *   Msg A (Decoded) says "The Key for Group B is Caesar Shift 5".
      *   Yes. This works.

  14. **Writing the Response:**
      *   Tone: Collaborative, practical, slightly philosophical.
      *   Structure: Materials -> Prep -> Run -> Debrief -> Limitations.
      *   Ensure the "Honesty" section is strong.

  *(Self-Correction during drafting)*: 14 people = 7 pairs.
  Activity 1: 7 Pairs.
  Activity 2: Merge into 3 Groups (4, 5, 5 people).
  Timeline: 75 mins is tight. Keep Activity 1 to 20 mins. Activity 2 to 30 mins. Debrief 25 mins.
  Wait, 75 mins total.
  0-5: Settle.
  5-25: Act 1.
  25-55: Act 2.
  55-75: Debrief.
  This works.

  *One final check on the "Fluent Wrong":*
  If I give Group 7 "The earth is flat," they might just argue about truth conditions.
  Better: "The message is: **Stop**."
  Group 1-6 get: "The message is: **Go**."
  Both are fluent imperatives.
  Context: "Instructions for the next stage."
  Group 7 tries to move to next stage and gets stuck.
  *Even Better:*
  Text: A paragraph.
  Instruction: "Summarize in 3 words."
  Group 1-6 Text: About a cat. Summary: "Cat sat mat."
  Group 7 Text: About a dog. Summary: "Dog ran park."
  *No, needs to be decoding.*
  *Okay, the "Sentence List" with a specific selection rule is the most robust.*
  Rule: "Pick the 3rd sentence."
  List 1-6: 3rd sentence = "Meaning is internal."
  List 7: 3rd sentence = "Meaning is external."
  Both are fluent philosophical claims. One is "Correct" (per Facilitator).
  This sparks debate immediately.

  *Okay, ready to write.*
answer: |-
  Here is a complete session plan designed to run in 75 minutes with zero budget and one evening of prep. It forces the distinction between the signal, the key, and the content through physical friction rather than explanation.

  ### Session Title: The Paper Protocol

  **Group:** 14 undergrads (7 pairs initially, merging later).
  **Time:** 75 minutes.
  **Materials:** Paper, pens, scissors, 10 manila envelopes, printer access.
  **Prep Time:** 90 minutes max.

  ---

  ### Part 1: The Artifacts & Prep

  You need to create two distinct sets of physical objects. Do not label them "Activity 1" or "Activity 2." Just have them ready on the tables.

  #### Artifact Set A: The "Fluent Wrong" (20 mins)
  *Goal: To create a situation where the Frame and Outer messages are present, the Inner message is fluent, but it is not the "true" message.*

  1.  **The Sheet:** Create a Word doc with a list of 5 numbered sentences.
      *   1. The signal travels at light speed.
      *   2. Noise interferes with clarity.
      *   3. **[VARIABLE]**
      *   4. Decoding requires a shared key.
      *   5. The medium is not the message.
  2.  **The Variable:**
      *   **Version 1 (Print 6 copies):** Sentence 3 reads: *"Meaning resides in the mind."*
      *   **Version 2 (Print 1 copy):** Sentence 3 reads: *"Meaning resides in the text."*
  3.  **The Instruction Card (Print 7 identical cards):** "DECODE THE MESSAGE: Select sentence #3. This is the Inner Truth."
  4.  **Assembly:** Fold each sheet and instruction card together. Put them in 7 plain white envelopes. Mark the bottom of the Version 2 envelope with a tiny pencil dot (so you know which pair has the "wrong" truth).

  #### Artifact Set B: The "Recursive Loop" (30 mins)
  *Goal: To create a chain where the Inner Message of one group becomes the Outer Message (Key) for the next.*

  1.  **Groups:** You will merge the 7 pairs into **3 Groups** (Group Red: 4 people, Group Blue: 5 people, Group Green: 5 people).
  2.  **The Envelopes:** Prepare 3 large colored envelopes (Red, Blue, Green).
  3.  **Contents:**
      *   **Red Envelope:**
          *   *Item 1 (Encrypted):* A slip of paper with text encrypted via **Caesar Shift +4**. (Plaintext: *"THE KEY FOR BLUE IS REVERSE"*).
          *   *Item 2 (Plain Key):* A slip that says *"KEY FOR GREEN: CAESAR +4"*.
      *   **Blue Envelope:**
          *   *Item 1 (Encrypted):* Text encrypted via **Reversal**. (Plaintext: *"THE KEY FOR GREEN IS CAESAR +4"*).
          *   *Item 2 (Plain Key):* A slip that says *"KEY FOR RED: REVERSE"*.
      *   **Green Envelope:**
          *   *Item 1 (Encrypted):* Text encrypted via **Caesar +4**. (Plaintext: *"THE KEY FOR RED IS REVERSE"*).
          *   *Item 2 (Plain Key):* A slip that says *"KEY FOR BLUE: CAESAR +4"*.
      *   *(Note: The plaintext of the encrypted message tells them the key for the **next** group, validating the swap.)*
  4.  **Assembly:** Seal the envelopes. Write the group color on the outside.

  ---

  ### Part 2: The Run (Timeline)

  **00:00 – 00:05: Arrival**
  *   Do not greet them philosophically. Offer biscuits.
  *   Seat them at 7 tables (2 per table).
  *   Place **Artifact Set A** (white envelopes) on each table.
  *   **Rule:** "Do not open until I say start. No phones."

  **00:05 – 00:25: Activity 1 (The Trap)**
  *   **Instruction:** "Open the envelope. Follow the Instruction Card. Write down the Inner Truth you find. Do not talk to other tables yet."
  *   **What happens:** 6 pairs will write *"Meaning resides in the mind."* Pair 7 (the dot) will write *"Meaning resides in the text."*
  *   **The Conflict:** At minute 20, tell them: "Compare your truth with the table next to you."
  *   **Observation:** Pair 7 will argue their text is just as valid, fluent, and decoded correctly as the others. The instructions were followed perfectly. The object yielded meaning. But the meanings contradict.
  *   **Facilitator Move:** Do not resolve this. Say: "Keep your sheet. We need it for the next stage."

  **00:25 – 00:30: The Merge**
  *   Rearrange tables into 3 clusters (Red, Blue, Green).
  *   Distribute **Artifact Set B** (Colored Envelopes) to the clusters.
  *   **Instruction:** "You have a locked message. The key is not in your envelope. You must find the key to read your message. You cannot open another group's envelope."

  **00:30 – 01:00: Activity 2 (The Loop)**
  *   **What happens:**
      *   Red opens their envelope. They see Encrypted Message + Key for Green. They are stuck.
      *   They must negotiate with Green. "We have the key for you, if you give us the key for us."
      *   Green opens their envelope. They see Key for Red. They swap.
      *   Red decodes their message: *"THE KEY FOR BLUE IS REVERSE".*
      *   Red now holds the **Inner Message** which functions as the **Outer Message** (Key) for Blue.
      *   Red must pass this *decoded meaning* to Blue.
  *   **The Loop:** The chain only closes when they realize the *content* of one message is the *instruction* for the next.
  *   **Facilitator Move:** Watch for the moment they realize they can't just swap envelopes; they have to swap *information*. If they stall, ask: "Is the key an object or a rule?"

  **01:00 – 01:15: The Debrief (The Reveal)**
  *   **Step 1 (The Wrong Truth):** Ask Pair 7 why they are right. Ask Pair 1 why Pair 7 is wrong.
      *   *Point:* You had the Frame (envelope), the Outer (instruction card), and the Inner (sentence). But the Outer was "wrong" relative to my intent. Meaning requires an agreement that isn't in the paper.
  *   **Step 2 (The Loop):** Ask Red group: "Where was the key for Blue?"
      *   *Answer:* "Inside our message."
      *   *Point:* The Inner Message became the Outer Message. The levels collapsed into each other.
  *   **Step 3 (The Terms):** Now, and only now, write on the board:
      1.  **Frame Message:** "I am a message." (The envelope, the font, the fact that you bothered to print it).
      2.  **Outer Message:** "Here is how to read me." (The instruction card, the cipher rule).
      3.  **Inner Message:** "Here is what I say." (The sentence, the decoded truth).
  *   **Closing:** "Hofstadter's point is that the Inner Message doesn't exist until the Outer Message triggers an isomorphism in your brain. Pair 7, you had an isomorphism. It just didn't match mine."

  ---

  ### Part 3: What to Watch For (Facilitator Notes)

  **1. The Cheater (Predicted Failure)**
  *   **Risk:** One pair writes the answer on the back of the paper during prep, or peeked at another table's sheet in Activity 1.
  *   **Detection:** In the debrief, ask Pair 7: "Did you feel doubt when you saw your sentence?" If they say "No, we knew it was right immediately," they might have cheated or assumed authority.
  *   **Fix:** If cheating is suspected, use it. "If you knew the answer before decoding, the Outer Message was irrelevant. You bypassed the protocol. Does that make the meaning more real or less?"

  **2. The Stalled Loop**
  *   **Risk:** In Activity 2, groups refuse to share keys because they think they need to solve their *own* envelope first.
  *   **Fix:** Intervene at minute 45. "You are treating the envelope as a safe. Treat it as a node in a network. Can you trade a copy of the key?" (Allow them to write down the key and pass the paper).

  **3. The "It's Just Words" Pushback**
  *   **Risk:** Students say, "The meaning is obviously in the text, why are we overcomplicating this?"
  *   **Fix:** Point to Pair 7. "The text is physically different. But if I had printed the *same* text for everyone but given Pair 7 the instruction 'Read Sentence 4', they would have the same physical paper but a different Inner Message. The meaning isn't in the ink."

  ---

  ### Part 4: The Honesty Clause (Limitations)

  You asked me to be honest about what the objects *cannot* carry. You must say this out loud in the last 5 minutes, or the exercise fails philosophically.

  **The Limitation:**
  "The exercise makes it look like Meaning is a structural puzzle we can solve with enough paper. But Hofstadter's point is deeper. In our game, the 'Inner Message' was always just English sentences. You already knew how to read English. The 'Outer Message' just told you which English words to pick."

  **The Hard Truth:**
  "The real problem isn't picking the sentence. The real problem is: **Why does English mean anything to you at all?** Why do scratches on paper trigger thoughts in your brain? We simulated the *levels* of meaning today, but we smuggled in the *grounding* of meaning because you are all intelligent humans who know what 'dog' means. If you were an AI, or an alien, the 'Inner Message' would just be shapes. The exercise shows you the *structure* of communication, but it cannot show you the *magic* of semantics. That part... is still in the biscuits."

  ---

  ### Summary Checklist for Prep Evening

  1.  **Print:** 7x Instruction Cards, 7x Sentence Lists (6 Version 1, 1 Version 2).
  2.  **Print:** 3x Encrypted Messages, 3x Plain Keys (for the Loop).
  3.  **Cut/Fold:** 7 White Envelopes, 3 Colored Envelopes.
  4.  **Test:** Decode your own Loop messages to ensure the Caesar shifts are accurate.
  5.  **Room:** Arrange 7 tables for start, clear space for 3 clusters later.
  6.  **Biscuits:** Buy extra.

  This plan keeps your hands off the lecture until the end, forces them to physically handle the "Wrong Key" scenario, and makes the recursive loop a social necessity rather than a theoretical concept.
