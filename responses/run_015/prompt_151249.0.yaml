      *   *Sincerity:* Emphasize that moral philosophy generally rejects sincerity as a sufficient condition for legitimacy. (Kantian duty vs. inclination).
      *   *The Algorithm's Role:* The algorithm *amplifies* these preferences. A human might compromise; an algorithm optimizes. This makes the platform an active agent, not a passive tool.
      *   *Legal/Ethical Overlap:* Mention Fair Housing laws (even if private, the *effect* matters). Disparate Impact doctrine is relevant here.
      *   *The "Boundary":* Admit the boundary is fuzzy but suggest a heuristic: Does this preference serve a functional need (sleep) or a social sorting mechanism (culture)?

