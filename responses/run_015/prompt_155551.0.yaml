      *   **Problem:** Students treat the Common Prior Assumption (CPA) as a hard normative law (i.e., persistent disagreement = irrationality/bad faith).
      *   **Goal:** The user wants to defend the theorem's normative force but also understand its vulnerabilities ("where it's actually exposed").
      *   **Specific Constraints:**
          *   Don't just say "priors differ."
          *   Focus on serious formal escapes (epsilon-approximate common priors, bounded rationality, non-Bayesian updating, etc.).
          *   For each escape, assess impact: Kill, Bruise, or Absorbable?
          *   Address unique predictions vs. rivals.
