answer: |-
  # CRITICAL PREFACE: THEORETICAL FRICTION

  **Read this before deploying the procedure.**

  You have asked to operationalize Wittgenstein's *On Certainty* into a 90-minute audit protocol. **This premise contains a fundamental category error.** Wittgenstein's "hinges" are not propositions that can be verified or falsified; they are the pre-rational scaffolding that makes verification possible. They are "animal certainties," not justified beliefs. By turning them into auditable items, we inevitably treat them as empirical claims, which is precisely what hinge epistemology warns against.

  **Where the translation misfires:**
  1.  **Fluidity vs. Rigidity:** Hinges shift like a riverbed over time; this procedure freezes them for 90 minutes.
  2.  **Choice vs. Necessity:** We do not *choose* our hinges; we find ourselves thrown into them. This procedure forces a choice where none philosophically exists.
  3.  **Justification:** You cannot provide evidence for a hinge without already assuming the hinge. This procedure simulates justification for the sake of institutional liability.

  **Verdict:** This document is not "applied philosophy." It is a **governance simulacrum**. It uses the *language* of hinges to distinguish between *disputes within a system* (empirical) and *disputes about the system* (hinge). It is a risk-management tool, not a truth-tracking tool. Use it to manage payout liability, not to discover metaphysical reality.

  ***

  # THE HINGE AUDIT PROTOCOL (HAP-90)

  **Objective:** Determine if a formal challenge attacks an empirical claim (settle as normal) or a background hinge (void/review settlement).
  **Team:** 3 Auditors (Lead, Methodologist, Scribe).
  **Time:** 90 Minutes Hard Stop.
  **Stakes:** High (Public Credibility, Payouts).

  ## PHASE 1: TRIAGE & TAXONOMY (00:00 – 00:15)

  **Goal:** Categorize the challenge. If it doesn't fit a hinge category, it is empirical and the challenge is rejected.

  **Step 1.1: The "Collapse" Test**
  *Ask:* "If we grant the challenger's claim is true, does the specific market question become unanswerable, or just answered differently?"
  *   **Answer: Answered Differently.** → **TERMINATE.** Challenge Rejected. (This is an empirical dispute).
  *   **Answer: Unanswerable.** → **PROCEED.**

  **Step 1.2: Taxonomic Assignment**
  Assign the challenge to exactly one category. If it spans multiple, select the *deepest* dependency.

  | Category | Definition | Example |
  | :--- | :--- | :--- |
  | **A. Framework Hinge** | Existential/Conceptual conditions. Without this, the *meaning* of the bet dissolves. | "Time exists," "GDP measures economic activity." |
  | **B. Instrumental Hinge** | Calibration/Methodological conditions. Without this, the *measurement* is noise. | "Thermometers measure heat," "Satellites are calibrated." |
  | **C. Institutional Hinge** | Trust/Procedural conditions. Without this, the *source* is compromised. | "NASA did not forge data," "Chain of custody is intact." |

  **[FLAG: JUDGMENT CALL]** *Distinguishing between a broken instrument (Instrumental) and a lying provider (Institutional) is often ambiguous. If the team cannot agree in 5 minutes, **ESCALATE TO CHAIR**.*

  ***

  ## PHASE 2: DIAGNOSTIC INTERROGATION (00:15 – 00:45)

  **Goal:** Apply category-specific diagnostics. Do not seek "truth." Seek "functional viability."

  ### Category A: Framework Hinges (Conceptual Coherence)
  *   **Q1:** Has the definition of the core term changed *officially* since the market opened?
      *   *Sufficient Answer:* Yes (by governing body) → **Move to Revision.**
      *   *Sufficient Answer:* No (only cultural/academic debate) → **Hinge Stands.**
  *   **Q2:** Is there a mutually exclusive alternative framework currently in operational use by the relevant industry?
      *   *Sufficient Answer:* Yes (e.g., GDP vs. GPI is standard) → **Escalate.**
      *   *Sufficient Answer:* No (the term remains the industry standard despite criticism) → **Hinge Stands.**

  ### Category B: Instrumental Hinges (Measurement Viability)
  *   **Q1:** Is the alleged error systematic (bias) or random (noise)?
      *   *Sufficient Answer:* Random → **Hinge Stands.** (Noise is empirical).
      *   *Sufficient Answer:* Systematic → **Proceed to Q2.**
  *   **Q2:** Does the systematic error exceed the market's resolution tolerance (e.g., >5% deviation)?
      *   *Sufficient Answer:* No → **Hinge Stands.**
      *   *Sufficient Answer:* Yes → **Proceed to Q3.**
  *   **Q3:** Is there a secondary, independent instrumentation method that corroborates the primary hinge?
      *   *Sufficient Answer:* Yes → **Hinge Stands.** (Redundancy validates the hinge).
      *   *Sufficient Answer:* No → **Open to Revision.**

  ### Category C: Institutional Hinges (Source Integrity)
  *   **Q1:** Is there evidence of malicious intent or procedural breach, or merely incompetence?
      *   *Sufficient Answer:* Incompetence → **Hinge Stands.** (Correctable).
      *   *Sufficient Answer:* Malice/Breach → **Proceed to Q2.**
  *   **Q2:** Has the source institution officially retracted or corrected the specific dataset in question?
      *   *Sufficient Answer:* Yes → **Open to Revision.**
      *   *Sufficient Answer:* No → **Hinge Stands.** (We rely on the institution's own certification).

  **[FLAG: JUDGMENT CALL]** *In Category B, determining "Systematic" vs. "Random" often requires statistical expertise the team may lack. If the challenge provides a peer-reviewed paper claiming systematic bias, do not adjudicate the math. **ESCALATE TO CHAIR** with note: "Technical dispute masquerading as hinge challenge."*

  ***

  ## PHASE 3: SUFFICIENCY & TERMINATION (00:45 – 01:00)

  **Goal:** Finalize the ruling based on Phase 2 outputs.

  **Termination Condition 1: Challenge Rejected — Hinge Stands**
  *   **Criteria:** The challenge attacks an empirical variable *within* the hinge, not the hinge itself. OR The hinge remains the operational standard despite criticism.
  *   **Action:** Settle market as originally defined.
  *   **Documentation:** Cite specific Diagnostic Q that failed.

  **Termination Condition 2: Challenge Accepted — Open to Revision**
  *   **Criteria:** The hinge is functionally broken (no measurement possible, definition officially changed, source retracted).
  *   **Action:** Void market or pause for re-definition.
  *   **Documentation:** Cite specific Diagnostic Q that triggered acceptance.

  **Termination Condition 3: Escalation to Committee Chair**
  *   **Criteria:**
      1.  Team split 2-vs-1 on Taxonomy (Phase 1).
      2.  Technical dispute requires expertise beyond the team (Phase 2, Cat B).
      3.  **The "Obsolescence Trap":** The hinge logically holds, but pragmatically feels useless (see Limitations).
  *   **Action:** Freeze settlement. Transfer to Chair.
  *   **Documentation:** "HAP-90 Escalation Form: Judgment Call Required."

  ***

  ## PHASE 4: DOCUMENTATION & SIGN-OFF (01:00 – 01:30)

  **Goal:** Create the audit trail.
  *   **Required:** Timestamped log of Phase 2 answers.
  *   **Required:** Explicit statement of which "Judgment Call" flags were triggered.
  *   **Required:** Sign-off by all three auditors. Dissenting opinions must be attached.

  ***

  # CASE APPLICATIONS

  ## Case A: The Climate Instrumentation Challenge
  **Market:** "Will Global Mean Surface Temperature exceed +1.5°C in 2024?"
  **Settlement Source:** NASA GISS / NOAA.
  **Challenge:** "Urban Heat Island (UHI) effects have systematically biased land-based thermometers in the Northern Hemisphere, rendering the +1.5°C metric artificially high."
  **Taxonomy:** **Instrumental Hinge** (Calibration/Methodology).

  **Audit Run:**
  1.  **Collapse Test:** If UHI bias exists, is the question unanswerable? *No.* We could adjust the data or use satellite data. It changes the *number*, not the *possibility* of measurement.
  2.  **Diagnostic B1 (Systematic vs. Random):** Challenger claims systematic bias. *Proceed.*
  3.  **Diagnostic B2 (Tolerance):** Does the bias exceed tolerance? Challenger argues 0.1°C bias; market tolerance is effectively 0.01°C for this threshold. *Ambiguous.*
  4.  **Diagnostic B3 (Redundancy):** Is there independent corroboration? *Yes.* Satellite lower-troposphere data (UAH/RSR) and ocean buoy data (Argo) track closely with land data trends.
  5.  **Decision:** **Challenge Rejected — Hinge Stands.**
      *   *Reasoning:* The instrumental hinge is "Temperature can be measured via multi-source aggregation." The challenge attacks one node (land thermometers) but the hinge relies on the *network*. The existence of bias is an empirical dispute to be modeled, not a hinge collapse.
      *   *Outcome:* Market settles at +1.5°C.

  ## Case B: The GDP Coherence Challenge
  **Market:** "Will US GDP grow >2% in 2024?"
  **Settlement Source:** BEA (Bureau of Economic Analysis).
  **Challenge:** "GDP no longer measures 'economic activity' in a digital/service economy. It counts defensive spending and ignores free digital value. The concept is incoherent."
  **Taxonomy:** **Framework Hinge** (Conceptual Coherence).

  **Audit Run:**
  1.  **Collapse Test:** If GDP is incoherent, is the question unanswerable? *Yes.* "GDP growth" has no referent.
  2.  **Diagnostic A1 (Official Definition):** Has the BEA changed the definition of GDP since market open? *No.*
  3.  **Diagnostic A2 (Alternative Framework):** Is there a mutually exclusive alternative framework in *operational use*? *No.* While economists critique GDP, no government or major institution uses an alternative for official settlement.
  4.  **Decision:** **Challenge Rejected — Hinge Stands.**
      *   *Reasoning:* The hinge is not "GDP is a perfect measure of welfare." The hinge is "GDP is the official metric designated by the BEA." The challenge attacks the *philosophical utility* of the framework, not its *institutional existence*.
      *   *Outcome:* Market settles based on BEA data.

  **[CRITICAL OUTCOME NOTE]:** In Case B, the Challenger will **strongly disagree**. They argue the metric is "garbage." The Procedure rejects them. The Committee **must accept this result**.
  *Why?* Because the Procedure distinguishes between *Conceptual Coherence* (Philosophy) and *Operational Definition* (Contract). To accept the challenge would be to allow the audit team to redefine the market based on philosophical preference, which creates higher liability than settling on a "flawed" but official metric. **This is where the procedure protects the institution from philosophical scope creep.**

  ***

  # LIMITATIONS: WHAT THIS PROCEDURE CANNOT DO

  **1. The "Outlived Usefulness" Problem**
  *   **Limitation:** This procedure cannot identify a hinge that is *logically intact* but *pragmatically dead*.
  *   **Example:** If everyone knows GDP is useless but still use it, HAP-90 says "Hinge Stands."
  *   **Risk:** The platform settles bets on metrics the world has quietly abandoned.
  *   **Mitigation:** This requires **Escalation (Phase 3, Condition 3)**. The auditors cannot void the hinge, but they must flag it to the Chair as a "Strategic Risk."

  **2. The "Riverbed" Shift**
  *   **Limitation:** Hinges change slowly. This procedure is a snapshot. It cannot detect a hinge that is currently crumbling but hasn't fallen yet.
  *   **Risk:** Settling a bet on a hinge that collapses one week later.
  *   **Mitigation:** None. This is an inherent risk of forecasting.

  **3. Judgment Calls Dressed as Rules**
  *   **Transparency:** Phase 2, Category B, Question 1 (Systematic vs. Random) is **not** a rule. It is a heuristic.
  *   **Honesty:** Auditors must be trained to recognize that when they answer "Systematic," they are making a philosophical judgment about the nature of error, not a mathematical one. **This must be documented in the Sign-Off.**

  **4. Institutional vs. Framework Bleed**
  *   **Limitation:** If the BEA (Institution) says GDP is accurate, but the concept (Framework) is broken, this procedure prioritizes the Institution.
  *   **Reason:** Institutional hinges are easier to verify. Framework hinges are metaphysical.
  *   **Consequence:** The platform prioritizes *legal defensibility* over *epistemic purity*.

  ***

  # ESCALATION PROTOCOL: WHEN TO CALL THE CHAIR

  **Do not attempt to resolve the following within the 90-minute window.**

  1.  **The "Double Bind":** The challenge proves the Instrumental Hinge is broken (e.g., thermometers failed), but the Institutional Hinge says the data is valid (e.g., NASA certifies it).
      *   *Action:* Escalate. This is a conflict between Method and Authority.
  2.  **The "Paradigm Shift":** Evidence suggests a Framework Hinge is being replaced globally (e.g., a major G7 nation announces it is abandoning GDP for a new metric) *during* the market period.
      *   *Action:* Escalate. This is a force majeure event, not a standard challenge.
  3.  **The "Dissenting Auditor":** If any one of the three auditors refuses to sign the "Hinge Stands" verdict based on a Principle of Integrity (not just error).
      *   *Action:* Escalate. Do not override a conscience objection on a hinge matter.

  **Documentation for Escalation:**
  Submit the HAP-90 log with the specific "Judgment Call" flag highlighted. Do not offer a recommendation. State only: *"Procedure terminated at Phase 3. Reason: [Code]."*

  ***

  **FINAL AUDITOR NOTE:**
  You are not philosophers. You are risk managers. Your job is not to ensure the hinge is *True* (it cannot be); your job is to ensure the hinge is *Stable*. If the hinge wobbles enough to threaten payout integrity, escalate. If it holds the weight of the bet, settle.
