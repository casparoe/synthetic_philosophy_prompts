  **Department of Normative Optimization**
  **Course Catalog: Spring Semester 2024**

  **PHIL 698B: Applied Counterfactual Blackmail: From XOR to Mugging**
  **Credits:** 4
  **Prerequisites:** Graduate standing in Logic, Economics, or Existential Risk Studies; demonstrated proficiency in Causal Decision Theory (CDT) and Bayesian Epistemology.

  **Course Description:**
  This seminar examines the instrumental rationality of agents operating under predictive coercion. Students will analyze scenarios where adversarial actors condition threats on counterfactual outputs rather than observed actions. Special emphasis is placed on the failure modes of Causal Decision Theory in XOR-constrained environments, where the receipt of a threat is logically correlated with the refusal to pay. We will interrogate why agents who maximize expected utility post-update often lose utility pre-update, and investigate precommitment strategies as a liability shield. Note: This course does not endorse extortion; it analyzes the computational inevitability of paying under specific logical topologies.

  **Course Objectives:**
  *   Distinguish between evidential correlations and causal levers in hostile epistemic environments.
  *   Evaluate the stability of Updateless Decision Theory (UDT) against logical blackmailers.
  *   Construct credible precommitment devices that survive reflective equilibrium.
  *   Calculate the expected utility of paying a blackmailer who conditions on your source code.

  **Required Texts:**
  *   *The Precommitment Paradox*, V. Strangelove (2021)
  *   *Logical Uncertainty in Hostile Environments*, ed. A. Turing-Smith (2019)
  *   *Course Packet: Selected Papers on Acausal Trade* (Department Print Shop)

  **Administrator Statement:**
  > "The Office of General Counsel wishes to remind students that while simulating coercive transactions is pedagogically vital, actual transfer of funds to entities claiming to possess counterfactual leverage is strictly prohibited. The University assumes no liability for losses incurred during Week 7 fieldwork." — *Dean of Academic Safety*

  **Weekly Schedule:**

  *   **Week 1:** Introduction to Coercive Counterfactuals. Defining the Mugger's Burden.
  *   **Week 2:** CDT vs. EDT in Extortion Contexts. Why Causal Agents Go Broke.
  *   **Week 3:** Parfit's Hitchhiker: Fieldwork and Debriefing.
  *   **Week 4:** Newcomb's Problem as a Proto-Blackmail Scenario.
  *   **Week 5:** The Transparency Assumption. When Your Source Code is Public.
  *   **Week 6:** Midterm Examination (Closed Book, Open Source).
  *   **Week 7:** XOR Blackmail Structures. Conditioning on the Absence of Payment.
  *   **Week 8:** Logical Uncertainty and the Simulation Argument.
  *   **Week 9:** Precommitment Strategies: Burning Bridges Safely.
  *   **Week 10:** Timeless Decision Theory and Acausal Trade Protocols.
  *   **Week 11:** Multi-Agent Scenarios: Blackmail in a Population of Clones.
  *   **Week 12:** Final Simulation: The Transparent Box Scenario.

  **Assessment:**
  Students will be graded on three problem sets, a midterm paper on dynamic inconsistency, and a final practical simulation. For the final, students must successfully navigate a randomized blackmail scenario generated by the department's adversarial AI. Note: Refusing to pay in scenarios where payment is logically required to minimize loss will result in a grade penalty consistent with utility loss.

  **Warning:**
  Students prone to existential distress upon realizing their decision algorithm is exploitable should consult Counseling Services prior to enrollment.
