  I'm a science-and-ideas journalist — mostly AI and maths, with the occasional philosophy piece when I can get someone to talk to me — and I've got myself slightly out of my depth and need a number out of it.

  At a conference last month I got talking to an ML researcher who insisted, over bad coffee, that Bradley's regress is basically solved by modern representational practice. Her picture, as I understood it: take the vector representations of the objects and concepts involved, apply a learnt composition operator to them, get a single vector standing for the whole state of affairs, and there's your proposition — or at least your candidate for one. The regress never gets going, she said, because composition is something you *do* to the two representations, not a third item that then has to be glued to them in turn; the binding lives in the architecture rather than in the ontology. I said that sounded like the old point about concepts being unsaturated, dressed up in linear algebra, and she said that was fine by her. I've been chewing on it since and definately can't tell whether she's said something deep or has just changed the subject. (I may well have mangled her view, but let's go with my version of it.)

  So here's what I want: your credence that the binding-as-operator move — the claim that a proposition's unity is secured by an operation on its constituents rather than by a further constituent or a further relation, and that this stops the regress rather than merely relocating it one level down — is a genuinely successful answer to Bradley's regress. Not "it depends what you mean by proposition". A number, plus the decomposition that produces it. I want at least these sub-questions in there: whether propositions have constituents or constituency structure at all; whether the regress is vicious or benign (and whether a non-well-founded, bottomless chain could still do the unifying work if it were allowed to); whether the unsaturatedness / nexus style of reply is coherent or is really just a relabelling of the problem; whether the move generalises to whatever the analogues of propositions are supposed to be — facts, sentences, judgements — or only works for one of them; and whether there's a circularity lurking in helping yourself to a composition operation that already seems to presuppose a unified output. Give each sub-question a rough probability and one line of justification, then combine, and tell me which single sub-question your headline number is most sensitive to.

