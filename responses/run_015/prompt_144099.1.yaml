          *   *Crucial Distinction:* Evolution selects for *semantic* fidelity (does this belief match the world well enough to keep me alive?). Turing architectures guarantee *syntactic* fidelity (does this output follow from the input according to rules?).
          *   *Concession:* If the objection holds, the user must give up the claim that Darwin and Turing are *structurally* distinct inversions. They become the same inversion at different timescales.
          *   *Pivot:* However, even if they are the same inversion, the *tension* remains. If comprehension is built from dumb parts (Turing), how is it load-bearing (Darwin)? If the top level is just a gloss on the bottom level, it's epiphenomenal. If it's epiphenomenal, it can't be selected for. Therefore, a purely Turing-constituted system cannot be a product of Darwinian selection *for comprehension*. It can only be a product of selection for *competence*.
