  # EPISTEMIC SORTING MACHINE: INSTITUTIONAL FAILURE MODES
  **Reading Group Handout | Applied Epistemics Series**

  **ROOT COMMITMENT:**  
  *"I accept that institutional knowledge production can be systematically wrong about a specific event without being globally unreliable."*

  **INSTRUCTIONS:**  
  Navigate the decision tree below by selecting the response that best matches your operational heuristic when confronted with contested events. Do not select based on which conclusion you prefer, but on which evidentiary threshold you require to reach it. Leaves indicate epistemic positions; unoccupied leaves include a diagnosis of their emptiness.

  ---

  ### NODE 1: THE SILENCE TRIGGER
  **Scenario:** Primary documents contradict the official narrative but are ignored by every mainstream outlet.  
  **Question:** Do you treat media silence as confirmatory of institutional capture?

  *   **YES** → Go to **NODE 2A** (Structural Path)
  *   **NO** → Go to **NODE 2B** (Empiricist Path)

  ---

  ### NODE 2A: STRUCTURAL PATH
  **Question:** Is negative coherence (the official story contains internal holes) sufficient to reject the account, or does rejecting obligate you to advance a competing explanation?

  *   **Negative Coherence Sufficient** → **LEAF: HERMENEUTICS-OF-SUSPICION STRUCTURALISM**  
      *Diagnosis:* Primary failure mode is structural unfalsifiability; counterevidence (silence) is reinterpreted as proof of the mechanism.
  *   **Competing Explanation Required** → **LEAF: UNOCCUPIED (The 'Constructive Conspiracy' Gap)**  
      *Diagnosis:* **Instability.** If silence proves capture, demanding an alternative imposes an asymmetrical burden that the 'capture' premise renders impossible to satisfy safely.

  ---

  ### NODE 2B: EMPIRICIST PATH
  **Question:** Is belief revision driven primarily by an outside-view reference class of past conspiracies or an inside-view assessment of specific documents and mechanisms?

  *   **Outside-View (Reference Class)** → Go to **NODE 3A**
  *   **Inside-View (Documents/Mechanisms)** → Go to **NODE 3B**

  ---

  ### NODE 3A: OUTSIDE-VIEW PATH
  **Question:** Do you treat successful hidden coordination as common in the reference class (base-rate neglect) or rare (Bayesian anchor)?

  *   **Rare (Low Base Rate)** → **LEAF: BAYESIAN SKEPTICISM ANCHORED TO LOW BASE RATES**  
      *Diagnosis:* Rejects official account only when likelihood ratio overcomes strong prior against coordination.
  *   **Common (High Base Rate)** → **LEAF: UNOCCUPIED (The 'Cynical Empiricist')**  
      *Diagnosis:* **Incoherence.** Relies on empirical base rates to justify high suspicion but ignores the institutional decay required to make those base rates plausible, leading to contradictory trust assessments.

  ---

  ### NODE 3B: INSIDE-VIEW PATH
  **Question:** Can decentralized verification networks genuinely substitute for institutional authority, or do they inherit the same trust-decay dynamics?

  *   **Substitute (Networks Valid)** → Go to **NODE 4A**
  *   **Trust-Decay (Institutions Required)** → Go to **NODE 4B**

  ---

  ### NODE 4A: DECENTRALIZED PATH
  **Question:** Does rejecting an official account obligate you to advance a competing explanation that carries predictive risk?

  *   **No (Network Consensus Sufficient)** → **LEAF: DECENTRALIZED VERIFICATIONISM**  
      *Diagnosis:* Trust architecture shifted from institution to network; verification debt waived if consensus is reached.
  *   **Yes (Alternative Required)** → **LEAF: UNOCCUPIED (The 'Sovereign Investigator')**  
      *Diagnosis:* **Instability.** Accepts verification debt while denying reference-class reasoning and institutional authority; lacks the epistemic infrastructure to sustain the burden.

  ---

  ### NODE 4B: INSTITUTIONAL PATH
  **Question:** Does rejecting an official account obligate you to advance a competing explanation that carries predictive risk?

  *   **Yes (Alternative Required)** → **LEAF: STRICT INSTITUTIONALIST DEBUNKING**  
      *Diagnosis:* Local failure accepted, but burden of proof remains on the challenger to maintain systemic integrity.
  *   **No (Negative Coherence Sufficient)** → **LEAF: UNOCCUPIED (The 'Passive Inside-Viewer')**  
      *Diagnosis:* **Lack of Advocates.** Inside-view scrutiny without institutional trust or alternative construction leads to epistemic paralysis; no stable community forms here.

  ---

  ### NOTE ON RESOLUTION LIMITS
  **Flagged Pair:** **Bayesian Skepticism** and **Strict Institutionalist Debunking**.  
  **Reason:** This tree cannot genuinely separate these positions in practice. Both rely on low base rates for coordination and high thresholds for evidence. The distinction between "Outside-View Base Rates" (Node 3A) and "Inside-View Mechanisms" (Node 3B) is often a matter of rhetorical framing rather than operational divergence; both leaves typically converge on the same debunking conclusions using similar evidence weights.
