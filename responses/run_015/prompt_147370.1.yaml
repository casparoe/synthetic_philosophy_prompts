answer: |-
  ### Structural Outline

  1.  **Section I (Romance):** The form mimics the "first apprehension." Lines will be hypermetrical or loosely pentameter, relying on enjambment to pull the reader forward without pause. Imagery will be tactile and luminous (light, dust, bark), emphasizing the *actual occasion* in its vivid particularity. The refrain will land as a natural, hopeful culmination.
  2.  **Section II (Precision):** The form tightens. Caesuras will break the lines, creating a staccato rhythm. Internal rhyme and assonance (e.g., *grade/shade*, *limit/submit*) will impose an auditory order. Vocabulary will shift to the technical (axis, vector, syntax), representing the necessary but drying analysis of the subject. The refrain will sound like a scheduled closure.
  3.  **Section III (Generalisation):** The form becomes rigid and hollow. Lines will be end-stopped and syntactically complete (Subject-Verb-Object), dominated by abstract nouns (*Totality, Relevance, System*) and passive voice (*is assigned, is concluded*). This mimics "inert ideas"—concepts severed from their living roots. The refrain, now identical to the previous sections, will read as an empty administrative mantra, suggesting the vitality has been evacuated.

  ***

  ### The Rhythms

  **I. Romance**

  At first the light fell sideways through the leaves
  And dust motes danced where no name existed yet,
  Only the smell of resin, sticky heat,
  A sudden colour striking at the eye
  Before the grammar of the shade was learnt.
  We touched the bark and felt the roughness climb
  Up through the fingers into something vast,
  Unmeasured, wild, a buzzing in the blood
  Where every fact was distinct, sharp, and new,
  The season ends; the fruit is gathered in.

  **II. Precision**

  Then came the rule, the bound, the defined edge;
  To slice the stem and measure out the sap.
  We plot the vector, fix the axis point,
  And grade the shade within a strict limit.
  No more the wild, but only what submits
  To syntax, law, the rigid calm of class.
  The pulse is stilled to let the structure stand,
  Distilled, instilled, until the skill is mastered,
  The data stored, the variable pinned,
  The season ends; the fruit is gathered in.

  **III. Generalisation**

  The system is concluded by the act.
  Totality is now established here.
  Relevance is assigned to every part.
  The value has been calculated fully.
  Nothing is left outside the concept's reach.
  Application is the stated goal.
  Wisdom is said to be the final state.
  The process is completed as required.
  Reality is subsumed by the design.
  The season ends; the fruit is gathered in.
