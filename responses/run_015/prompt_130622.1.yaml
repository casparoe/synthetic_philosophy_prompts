answer: |-
  **TO:** Members of the Arts, Culture and Leisure Committee
  **FROM:** [Your Name]
  **DATE:** 24 May 2024
  **SUBJECT:** Recommendation on the Proposed Mill Theatre Conversion

  **1. Purpose**
  This paper seeks to guide the Committee's vote on the offer to convert the disused mill into a 280-seat theatre. The proposal involves a private capital gift and five-year revenue underwriting by a donor-controlled trust, conditional on a Council commitment of £25,000 annually for ten years and the installation of a professional receiving company.

  **2. The Objection**
  We must treat Mr Peter Ansell's objection not as nostalgia, but as a rigorous philosophical check. Drawing on Rousseau, Mr Ansell argues that theatre risks converting active citizens into passive spectators. His four points are coherent: that theatrical sympathy is spent in the seat rather than acted upon; that professional venues manufacture artificial wants; that civic life relies on doing rather than watching; and that economic dependence on visitors will dictate culture regardless of public subsidy. He further highlights the asymmetry of commitment: the donor's trust ends after five years, while the Council is bound for ten.

  **3. The Complications**
  The Marshfield Players contest Mr Ansell's third point, arguing that professional standards and facilities will elevate amateur production rather than suppress it. However, the Committee remains divided on Mr Ansell's proposed rule of thumb: that public money should support performance only where performers and audience are largely the same people.

  Here we face the largest difficulty. To adopt this participation rule without fear or favour would threaten existing commitments; our summer carnival is mostly watched rather than joined in, yet it defines our civic calendar. To reject the rule entirely, however, amounts to telling residents that their own judgements about their leisure are not to be trusted, implying that passive consumption is inherently inferior. We cannot logically fund the carnival while refusing the theatre on these grounds, yet we cannot ignore the risk of creating a culture of spectatorship.

  **4. Recommendation**
  I recommend that the Committee **accepts the proposal, subject to strict conditions**. The opportunity to secure a cultural asset without capital cost is too significant to decline, provided we mitigate the risks of dependency and passivity. Mr Ansell is right that a theatre can isolate us, but wrong that it must. The Marshfield Players demonstrate that professional infrastructure can serve amateur ambition. However, the financial asymmetry and the risk of external programming control require contractual safeguards.

  **5. Conditions and Review Points**
  To proceed, the following conditions must be met and written into the Section 106 agreement or funding memorandum:

  *   **Aligned Commitment:** The Council's funding commitment shall be for **five years**, not ten, matching the donor's underwriting period. An extension to years six through ten may only be granted following a full review of attendance, amateur usage, and local economic impact at the end of year four.
  *   **Amateur Access Guarantee:** The operating company must guarantee a minimum of **six weeks per annum** of stage access for local amateur societies (including the Marshfield Players) at subsidized rates. This directly addresses Mr Ansell's concern regarding the conversion of doers into watchers.
  *   **Programming Consultation:** While the professional company retains artistic control, a Programming Advisory Group including Council and community representatives must be established to ensure the season reflects local interests, mitigating the risk of programmes shaped solely by visiting tourists.
  *   **Exit Strategy:** The trust must present a viable five-year sustainability plan by Year Three. If the trust withdraws after Year Five without a viable plan, the Council retains the right to repurpose the building without penalty.

  **6. Conclusion**
  We should not accept the offer as it stands. The ten-year commitment is fiscally imprudent given the five-year underwriting, and the lack of amateur access risks validating Mr Ansell's fear of a passive citizenry. By limiting our liability to five years and mandating amateur usage, we secure the building while respecting the warning that culture must be made, not merely consumed.

  I propose we vote to accept the proposal subject to the conditions outlined in Section 5.
