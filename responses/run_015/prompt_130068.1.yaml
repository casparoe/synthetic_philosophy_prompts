  3. **(8) vs. (1) [Severity: Medium]:** (8) suggests time and non-violence cure founding illegitimacy. (1) requires popular authorisation. Does time substitute for consent? If yes, (1) is weakened. If no, (8) is irrelevant to legitimacy. This tension matters for China: if 50 years of peace cures illegitimacy, China may qualify despite (4). You must decide if time replaces authorisation or merely mitigates punishment. **Fix:** Clarify that time reduces the *urgency* of overthrow, not the *status* of legitimacy. This preserves (1) while keeping (8)'s practical insight regarding revolutionary violence. Collectively, these tensions suggest your definition of legitimacy is doing too much work. You are conflating the right to rule with the moral permissibility of existence. Until separated, your workshop presentation will invite easy counterexamples regarding successful autocracies. You must choose whether legitimacy is binary or gradable.

  Apparent tensions that dissolve
  (3) vs. (4) vs. (7) looks like a cultural exemption but isn't. You distinguish Singapore and China based on the *scale and opacity of coercion* (4), not cultural suitability (7). This is a universalist empirical claim: China's coercion blocks authorisation; Singapore's allows limited feedback. As long as you maintain that the *standard* (authorisation/coercion limits) is universal, even if outcomes differ, (7) remains intact. The tension dissolves if you clarify that Singapore permits more genuine (though limited) authorisation than China.

  Cheapest single revision
  Revise (1) to distinguish "full legitimacy" from "moral justification." Claim popular authorisation is required for *full democratic legitimacy*, but performance can provide *moral justification* for existence without conferring full legitimacy. This preserves (2)'s insight on moral weight without contradicting (1)'s strict definition. It aligns with (6) by keeping "performance legitimacy" as a suspect label while acknowledging performance matters morally. This semantic shift resolves the Singapore/China distinction without abandoning universal standards.

  What giving that up costs me
  You lose conceptual neatness. Separating "legitimacy" from "moral justification" invites critics to argue you're splitting hairs to excuse authoritarianism. It requires defending why a regime can be morally justified yet illegitimate, a nuanced position easily caricatured as apologia for benevolent dictators during workshop scrutiny.
