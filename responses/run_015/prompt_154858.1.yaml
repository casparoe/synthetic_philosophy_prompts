prompt: |-
  I am a journalist covering the intersection of cognitive science and moral philosophy, currently developing a feature on whether sentience ought to be treated as a scalar property rather than an on-off switch. To ground the conceptual architecture of the article, I need a formal research proposal—approximately one page, framed as a workshop pitch—for a philosophical project that examines the lower and synthetic boundaries of moral status. Specifically, I want the proposal to reject the common assumption that gradations of moral consideration must map onto a single continuous dimension, such as integrated information or affective complexity. Instead, the project should introduce a bifurcated analytical framework: one axis tracking homeostatic fragility, defined as the vulnerability of a system's internal equilibrium to perturbation, and a second axis tracking counterfactual representational range, defined as the breadth of future states the system can model and avoid. The central research question should ask whether these axes can diverge in ways that undermine linear moral rankings—particularly in comparing organisms near the lower boundary of sentience with highly engineered artifacts that exhibit robustness without subjective vulnerability, or the reverse. The proposal should precisely state why existing single-axis theories fail to resolve these cross-domain comparisons, outline the method—conceptual analysis of measurement criteria paired with structured thought experiments drawn from synthetic biology and robotics—describe what a useful deliverable would look like for ethics review boards or policy designers, and provide a candid assessment of scope, identifying what would make the project unmanageable within a six-month window and how to constrain it accordingly. The tone should be polished and accessible to an interdisciplinary audience of scientists and philosophers. Please do not include citations, bibliographies, or named references to specific scholars; navigate the conceptual landscape from first principles.
