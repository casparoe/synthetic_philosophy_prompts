  3.  **Brainstorming Defeaters (Specific to this Framing):**

      *   *Defeater 1: The Isolation Problem (Modified).* Lewis insists worlds are spatiotemporally isolated. If there's "resonance" or "tracking," there must be some signal. If the signal respects physical laws, it can't cross worlds (by definition of worlds). If it crosses worlds, they aren't isolated.
      *   *Defeater 2: The Problem of Divergent Laws.* The user restricts to "law-sharing worlds." But modal knowledge often concerns *counter-legal* scenarios (e.g., "If gravity were inverse cube..."). If we only resonate with law-sharing worlds, we have no knowledge of non-law-sharing possibilities. This cripples modal knowledge.
      *   *Defeater 3: The Calibration/Noise Issue.* In signal detection, you need a baseline to distinguish signal from noise. How do we distinguish "resonance" from "imagination"? If the answer is "when it feels structural," that's just introspection.
      *   *Defeater 4: Evolutionary Debunking.* If our cognitive architecture tracks *these* specific worlds, why? Evolution selects for survival in *this* world. Tracking distant concrete worlds offers no survival advantage unless it helps model *this* world. If it helps model *this* world, why posit the other worlds as *concrete*?
      *   *Defeater 5: The "Reflected Light" Analogy Breakdown.* Light degrades over distance (inverse square law). Does modal knowledge degrade? Do we know less about "distant" (less similar) worlds? If so, where is the cutoff?
      *   *Defeater 6: Mathematical/Logical Necessity.* Structural resonance works for physical contingency. Does it work for math? Are there concrete worlds where $2+2=5$? If not, how do we know mathematical possibility via physical resonance?

  4.  **Selecting and Refining the Top Defeaters:**

      *   *Selection 1: The Counter-Legal Knowledge Gap.* (Fatal). We clearly reason about worlds with different laws. The restriction kills this.
      *   *Selection 2: The Causal/Informational Link.* (Fatal). "Tracking" implies information flow. Lewisian worlds are causally closed. To allow tracking is to abandon Lewisian realism for something else (e.g., ersatzism or a multiverse with interaction).
      *   *Selection 3: The Evolutionary Mismatch.* (Damaging). Why would we evolve to track *other* concrete worlds?
      *   *Selection 4: The Degradation of Certainty.* (Awkward). Signal theory implies noise. Modal logic implies certainty (in S5).

  5.  **Ranking and Evaluation:**

      *   *Fatal:* The Counter-Legal Gap (limits scope too much), The Causal Link (contradicts the ontology it tries to save).
