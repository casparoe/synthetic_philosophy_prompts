      *   **Error Theory:** Modal error is "structural misalignment," not conceptual failure.
      *   **Request:** Identify specific defeaters (observations, formal results, counter-intuitive cases) that undermine *this specific framing* (resonance analogy + law-sharing restriction), not standard actualist objections. Rank them (fatal to awkward). Assess whether the insulation is a virtue or makes the view unfalsifiable.

  2.  **Deconstruct the "Structural Resonance" Defense:**
