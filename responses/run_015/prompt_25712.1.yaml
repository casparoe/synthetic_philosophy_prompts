  *(Refining the Synthesis)*: The tension might be between the "quantified self" (Feature 2) and the "fluid self" (Feature 4). One demands stability for measurement, the other demands fluidity for engagement. I should address this. Actually, they work together: fluidity generates more data points for quantification. I will argue they are consistent in service of *extraction*.

