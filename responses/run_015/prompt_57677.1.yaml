answer: |-
  Subject: Re: The fork in the design and the acting versus omitting distinction

  I hear you on the urgency, and I want to validate your intuition before we dissect the terminology. You are standing at a classic boundary where safety engineering interfaces with liability and trust, even if the risk models look identical. The ethicist is technically correct within a narrow consequentialist framework, but engineering is not practiced in a vacuum of pure outcomes. You asked for a translation of the philosophical dispute into your vocabulary without smuggling in moral premises, followed by an assessment of what gets lost in that translation. I will stick to that structure.

  To translate the doing versus allowing harm debate into functional safety terms, we must first define the baseline. In philosophy, the baseline is the normal course of events without intervention. In your shop, this is the open-loop process state or the unmitigated risk profile of the patient without the device. When a philosopher talks about killing versus letting die, they are arguing about the topology of the fault tree relative to that baseline. Your active control option, where the controller commands a bolus, is a continuous mode of operation. The system is permanently introducing energy into the process. If a hazardous event occurs here, specifically hypoglycemia induced by over-delivery, the fault tree analysis shows the top event is triggered by a system command. The initiating event is internal to the control loop. In your shop's terminology, this is a hazard the system introduces. The system is the source of the dangerous flow.

  Conversely, the passive option where the device only withholds or alarms is a demand mode of operation. The system sits in a safe state until a process variable exceeds a threshold. If the patient crashes here, it is because the system failed on demand. The initiating event is external, originating from the patient's physiology or an external disturbance, and the top event is reached because a barrier failed to mitigate it. This is a hazard the system inherits. The dangerous flow exists independently of the device, and the device merely failed to stop it. When the ethicist says the distinction is worthless once outcomes are fixed, they are saying that if the Probability of Failure on Demand for the passive system equals the Probability of Dangerous Failure per Hour for the active system, adjusted for exposure time, the risk is identical. They are arguing that the location of the basic event in the fault tree, whether it is a component failure in a valve or a sensor drift causing a false command, is irrelevant if the final probability of the top event is the same. They view the causal chain as a single continuous line where cutting it at point A versus point B is mechanically equivalent if the result is the same.

  However, there is a normative loading I need to flag here. In safety engineering, we treat an introduced hazard and an inherited hazard as analytically distinct because they require different mitigation strategies, but we do not technically assign them different moral weights in the calculation of Safety Integrity Levels. A SIL 3 requirement is a SIL 3 requirement regardless of whether the risk is inherent to the process or created by the machinery. If I suggest that introduced hazards are inherently more severe, I am smuggling in a moral premise that agency matters. Technically, engineering only cares that the risk is reduced to As Low As Reasonably Practicable. The distinction you feel is not about the probability or severity in the model, but about the attribution of the basic event. When the system commands a bolus, the system is the initiator. When the system fails to alarm, the physiology is the initiator. The ethicist collapses this into a single causal chain, but your fault tree keeps them separate branches.

  Here is the residue report on that translation. The claim that lands cleanly in engineering terms is the baseline selection. You are correct that much of the philosophical fight is about what you count as the world without the system. In hazard analysis, we make this choice explicitly when we define the scope of the system and the process interface. If we define the system as the controller only, the pump is external. If we define the system as controller plus pump, the actuation is internal. Changing this boundary changes whether a failure is a command error or a mitigation failure. The ethicist is right that this is a choice, but you are right that it is a consequential choice for how we model responsibility. The claim that requires bending is the idea that outcomes are fixed. In engineering, outcomes are never truly fixed because the detection and diagnostics differ between continuous and demand modes. A system that actively commands has different detectability profiles than one that passively monitors. So while the ethicist assumes fixed outcomes to make the point, in reality, the mode of operation changes the diagnostic coverage, which changes the risk.

  The claim that has no expression whatsoever in your hazard analysis is the moral weight of the distinction itself. Fault trees do not have a variable for moral culpability. They have variables for probability, severity, and detectability. You can model that an active command is more likely to be detected than a passive failure, but you cannot model that an active command feels like a violation of trust in a way that a passive failure does not. This is not a limitation of your math; it is a limitation of the scope. Safety engineering is designed to predict physical failures, not social or moral reactions. This leads to your specific questions about intention and agency.

  Regarding intention, this genuinely cannot be said in your framework, and it is not a bug in your thinking. Safety engineering assumes that the agent, whether human or algorithmic, operates according to deterministic logic or random failure distributions. We do not model malice or moral choice because those are not predictable failure modes in the same sense. If a controller commands a fatal bolus, we ask if it was a systematic fault or a random hardware failure. We do not ask if it intended harm because the concept is meaningless for a controller. The philosophers fight over intention because they are trying to assign blame to moral agents. You are trying to assign reliability to functional units. If you try to import intention into a fault tree, you break the model because intention is not a failure rate. The reason this distinction matters to you intuitively is not because the controller has a soul, but because the humans interacting with it will assign intention to it. Patients will anthropomorphize the device. If the device kills them, they will perceive it as an attack. If the device fails to save them, they will perceive it as a tragedy. Your hazard analysis cannot capture this perception, but your liability analysis must.

  Regarding agency, specifically whose hands are on the valve, this also falls out of the engineering model because safety engineering abstracts the agent into a component. A valve is a valve. Whether it is turned by a human or a motor is a design detail that affects the failure rate, not the ontological status of the action. However, the philosophers argue that agent-relative duties matter. I have a duty not to kill you that is stronger than my duty to save you. In engineering terms, this translates to the distinction between introduced versus inherited hazards again, but with a social layer. When you introduce a hazard, you take ownership of the risk. When you inherit a hazard, you share the risk with the natural course of events. The reason this does not translate cleanly is that engineering seeks to minimize total risk regardless of ownership, whereas morality often cares about the cleanliness of the agent's hands. You are sensing that an active control system makes the company the primary cause of any negative outcome, whereas a passive system makes the disease the primary cause. Engineering calls this causal attribution. Morality calls this guilt. They map to the same structure but carry different consequences.

  So, is your working guess right? Is the entire dispute really about baseline selection? You are mostly right, but it is not just about what you count as the world without the system. It is about control authority. When you close the loop, you shift the baseline from the patient's physiology to the setpoint of the controller. This changes the causal ownership of the process variable. The ethicist says this is just moving upstream in the causal chain, which is true physically. But it is not true socially or legally. By taking control authority, you accept liability for the variance. If you leave control with the patient and only monitor, the variance belongs to the patient. Your hypothesis that there is nothing deep left over once you specify the baseline is the confident amateur move only if you assume that safety engineering is the only metric that matters. If you assume that product liability, patient trust, and regulatory perception are also constraints, then the distinction is deep. It determines who holds the bag when the top event occurs.

  The limitation here is not in how you think, but in the tools you are using. Fault trees are excellent for mapping causal logic and probabilities. They are terrible for mapping responsibility and trust. The philosophers are fighting over a distinction that was never doing the work they claim it does if the goal is purely outcome maximization. If the goal is outcome maximization, the ethicist wins. But if the goal is maintaining a social license to operate a medical device, the distinction between doing and allowing is the load-bearing wall. It determines whether a failure is a product defect or a disease progression. You should not try to solve this with a fault tree. You should solve it by recognizing that the active control option introduces a new hazard class that requires not just higher SIL targets, but also a different risk communication strategy. The engineering terms can describe the difference in causal origin, but they cannot capture the moral weight because that weight resides in the observer, not the system. You are right to feel the difference, even if your models say the risk is the same.
