  It carries none of the heat of **Fire**.
  It is quieter than the flow of **Water**.
  It is hidden from the watching **Eye**.
  It is slippery to the open **Hand**.

  The book gives nothing to the **Hand**
  except the echo of a **Sound**.
  The book shows nothing to the **Eye**
  except the shape of **Stone**.
  The book pours nothing from the **Water**
  except the light of **Fire**.

  The line defines the heat of **Fire**
  by the withdrawal of the **Hand**.
  The line defines the depth of **Water**
  by the silence after **Sound**.
  The line defines the age of **Stone**
  by the dryness of the **Eye**.

  There is no way to open the **Eye**
  without the light of **Fire**.
  There is no way to break the **Stone**
  without the strength of **Hand**.
  There is no way to stop the **Sound**
  without the depth of **Water**.

  Every path leads back to **Water**.
  Every look leads back to **Eye**.
  Every noise leads back to **Sound**.
  Every heat leads back to **Fire**.
  Every touch leads back to **Hand**.
  Every weight leads back to **Stone**.

  A chain from **Hand** to **Stone** to **Eye** seems required,
