  The page defines the hardness of **Stone**.
  It sinks beneath the surface of **Water**.
  You learn the weight by lifting with a **Hand**.
  You learn the color by looking with an **Eye**.
  It gives no heat, unlike the breath of **Fire**.
  It speaks only when broken, making a **Sound**.

