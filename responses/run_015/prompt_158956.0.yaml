prompt: |-
  I help run a volunteer bike workshop, and after a blowup last month about our unwritten rules I've somehow ended up in charge of new-volunteer onboarding, which now includes a half-hour slot on why we do things the way we do and how that ever changes. I want to build it around the Lewis-style account of convention as an equilibrium of a coordination problem rather than around rules, agreements and enforcement. Don't explain the account to me — plan how I'd get it across to adults with no philosophy, most of whom think an unwritten rule is either a habit or just peer pressure, and who assume all our rules are the same kind of thing when I'm pretty sure they aren't.

  What I need: the order the pieces have to land in and what breaks if two of them get swapped; which of our two contested rules should carry the whole session — (a) whoever last used a tool leaves it out on the bench overnight instead of putting it back, or (b) nobody takes donated parts home during their first month — and what the carrying example has to have and has to lack so it doesn't smuggle in a second layer too early; the misconceptions to expect at each stage (I'm guessing "if its arbitrary then I don't have to follow it" and "we'd just need everyone to agree to switch at once") and the point in the sequence where each should be headed off; one closing question that shows me they've got the expectations structure and not just the vocabulary; and what I should openly refuse to go into at this level.
reasoning: |-
  Here's a thinking process that leads to the suggested onboarding plan:

  1.  **Analyze the Request:**
      *   **Context:** Volunteer bike workshop. Recent conflict over unwritten rules. User is now in charge of onboarding (30-min slot).
      *   **Goal:** Explain *why* things are done the way they are and how that changes, using a Lewis-style account of convention (equilibrium of a coordination problem) *without* explicitly teaching philosophy or using jargon.
      *   **Audience:** Adults, no philosophy background. Common misconceptions: unwritten rules = habits or peer pressure; all rules are the same kind of thing.
      *   **Specific Constraints:**
          *   Determine the order of pieces and consequences of swapping them.
          *   Choose between two contested rules: (a) tools left out overnight vs. put away, or (b) no taking donated parts home in first month.
          *   Define what the carrying example must have/lack to avoid smuggling in extra layers.
          *   Identify misconceptions at each stage and when to head them off.
          *   Provide one closing question to test understanding of the *structure*, not vocabulary.
          *   Specify what to explicitly refuse to discuss.

  2.  **Deconstruct the Lewis Account (for internal use):**
      *   Convention is a solution to a recurrent coordination problem.
      *   It's arbitrary (there could be another solution).
      *   It's self-enforcing (everyone expects everyone else to do it, so it's in everyone's interest to do it).
      *   It relies on common knowledge (I know you know I know...).
      *   It evolves/precedes explicit agreement.

  3.  **Select the Carrying Example:**
      *   *Option (a): Tools left out overnight.* This feels like a safety/efficiency coordination problem. If I put it away, you can't find it. If you put it away, I can't find it. If we both leave it out, we find it but risk loss/damage.
      *   *Option (b): No taking parts home (first month).* This feels more like a norm against exploitation/tragedy of the commons. It's less about coordination (doing the same thing) and more about restraint/cooperation (prisoner's dilemma-ish).
      *   *Decision:* Option (a) is better for Lewis. Lewis focuses on *coordination* (driving on the left vs. right). Leaving tools out vs. putting them away is a coordination equilibrium. If everyone puts them away, that works. If everyone leaves them out, that *also* works (as long as it's consistent). The conflict arises when people do different things. Option (b) is more about moral obligation or resource scarcity, which muddies the "arbitrariness" water.
      *   *Refinement:* Actually, looking closer at (a): "Whoever last used a tool leaves it out." This is a specific coordination point. If the rule were "put it back," that's also a coordination point. The key is that *consistency* matters more than *which* consistency.
      *   *Wait, let's re-evaluate (b).* "Nobody takes parts home." This is a rule to prevent depletion. If everyone takes parts, the shop fails. If no one takes parts, the shop works. This is a coordination problem (Cooperate vs. Defect). But Lewis conventions are usually about *arbitrary* alternatives. Is "taking parts" arbitrary? Not really, it's about resource survival.
      *   *Re-evaluating (a).* "Leave tools out." Why? Maybe so the next person sees what's available? Or maybe so the tool finder doesn't waste time searching drawers? If the rule were "put tools away," the next person knows where to look (the drawer). If the rule is "leave tools out," the next person looks at the bench. Both work *if everyone does the same*. This fits Lewis perfectly. It's arbitrary which way we choose, but crucial that we agree.
      *   *Selection:* **Rule (a) - Tools on the bench.** It highlights the "arbitrary but necessary consistency" aspect of Lewis better than the moral/resource aspect of (b).

  4.  **Drafting the Sequence (The "Order of Pieces"):**
      *   *Step 1: The Problem (Coordination).* Show a situation where doing different things causes failure, but doing the *same* thing (anything) causes success.
      *   *Step 2: The Solution (Emergence).* Show how we settled on *this* specific way without a meeting/vote.
      *   *Step 3: The Expectation (Equilibrium).* Explain why I follow it (because I expect you to) and why you follow it (because you expect me to).
      *   *Step 4: Change (Shifting Equilibrium).* How do we move to a new one if this one stops working?
      *   *Constraint Check:* What breaks if swapped? If you talk about Expectations before the Problem, it sounds like mind-reading. If you talk about Change before Stability, it sounds like anarchy.

  5.  **Addressing Misconceptions:**
      *   *Misconception 1: "If it's arbitrary, I don't have to follow it."* (Head off at Step 2/3).
      *   *Misconception 2: "We need everyone to agree to switch at once."* (Head off at Step 4).
      *   *Misconception 3: "It's just peer pressure."* (Head off at Step 3 - distinguish expectation from threat).

  6.  **Defining the Example's Boundaries:**
      *   *Must Have:* Recurrent situation, two viable alternatives, cost to mismatch.
      *   *Must Lack:* Moral weight (safety/damage), authority enforcement, explicit prior agreement.

  7.  **The Closing Question:**
      *   Needs to test if they understand the *reason* for the rule (expectations/coordination) not just the rule itself.
      *   *Draft:* "If we changed the rule tomorrow, what would need to happen for it to work?" -> Too abstract.
      *   *Draft:* "Why do you leave the tool out?" -> Too simple.
      *   *Better:* "Imagine you come in and see everyone putting tools away. What do you do and why?" (Tests if they understand following the crowd/expectation vs. the written rule).

  8.  **What to Refuse:**
      *   Don't get into the specific history of the blowup.
      *   Don't debate the *merits* of the tool rule vs. the put-away rule (that's a policy meeting, not onboarding).
      *   Don't discuss punishment/enforcement.

  9.  **Refining the Plan (Self-Correction/Polishing):**
      *   *Tone:* Practical, workshop-focused, not academic.
      *   *Lewis Core:* Ensure "Arbitrariness" and "Common Knowledge" are present without the labels.
      *   *Rule Choice:* I need to be sure (a) is the right one. If (a) is seen as "lazy," it might trigger defensiveness. But (b) is about theft/scarcity. (a) is purely procedural. Lewis is about procedure. Stick with (a).
      *   *Sequence Logic:*
          1.  Identify the Coordination Problem (The "Why").
          2.  Identify the Arbitrary Solution (The "What").
          3.  Identify the Expectation Engine (The "How it sticks").
          4.  Identify the Path to Change (The "Future").
      *   *Swapping Risk:* If you explain the Expectation Engine before the Arbitrary Solution, people think the rule is natural law, not a choice. If you explain Change before Stability, people think rules are fluid and ignorable.

  10. **Final Review against constraints:**
      *   Order & Swaps? Yes.
      *   Which Rule? (a).
      *   Example constraints? Yes.
      *   Misconceptions & Timing? Yes.
      *   Closing Question? Yes.
      *   Refusals? Yes.

      *(Self-Correction on Rule Choice)*: Wait, if the rule is "leave it out," is that actually a coordination problem?
      *   Scenario A: Everyone puts away. Result: Drawers organized, bench clear.
      *   Scenario B: Everyone leaves out. Result: Bench cluttered, drawers empty, but tools visible.
      *   Scenario C: Mixed. Result: Frustration. I look in drawer (empty), look on bench (maybe there).
      *   Yes, this works. It's a "which folder do we save the file in" problem.
      *   Why is it contested? Probably because some think "put away" is more professional. That confirms the arbitrariness. Both *could* work, but we need *one*.

      *(Refining the Misconception Handling)*:
      *   "If arbitrary, I don't follow": Address this when establishing the *cost of mismatch*.
      *   "Need everyone to agree": Address this during the *Change* phase.

      *(Refining the Closing Question)*:
      *   Needs to show they get the *expectations structure*.
      *   "If you walked in and saw three experienced volunteers putting the tools back in the drawers, what would you do with the wrench you just used, and why?"
      *   Correct answer: "I'd put it back, because the convention has shifted and I need to coordinate with them."
      *   Incorrect answer: "I'd leave it out, because that's the rule." (Misses the point of convention).

      *(Refining Refusals)*:
      *   Don't discuss *why* we chose "leave out" over "put away" historically (irrelevant).
      *   Don't discuss sanctions (Lewis conventions are self-enforcing).

      *(Final Polish)*: Ensure the language is "workshop speak," not "philosophy speak." Use "signal," "pattern," "friction," not "equilibrium," "arbitrariness," "common knowledge."

      *Wait, one nuance:* The prompt asks for "what the carrying example has to have and has to lack so it doesn't smuggle in a second layer too early."
      *   Must Lack: Safety consequences. If leaving a tool out causes injury, it's not a convention, it's a safety rule. I need to make sure the example is framed as *annoyance/efficiency*, not *danger*.
      *   Must Have: Recurrence. It happens every day.

      *Let's assemble the response.*
answer: |-
  Here is the plan for your 30-minute slot. It is designed to install the *logic* of convention without using the *language* of philosophy.

  ### 1. The Carrying Example
  **Choose Rule (a): Whoever last used a tool leaves it out on the bench.**

  **Why this one?**
  Rule (b) (no taking parts home) is a *cooperation* problem involving scarcity and temptation (Prisoner's Dilemma). Rule (a) is a pure *coordination* problem (Driving on the Left vs. Right). Both "Put Away" and "Leave Out" are viable systems on their own; the disaster only happens when we mix them. This makes the "arbitrariness" of the specific rule clearer, which is essential for the Lewis account.

  **What the example MUST have:**
  *   **Recurrence:** It must happen every single shift, not once a year.
  *   **Symmetry:** It must be equally easy for everyone to do either option (Put Away or Leave Out).
  *   **Visible Mismatch Cost:** Show clearly that if *I* put away and *you* leave out, we both waste time searching.

  **What the example MUST lack:**
  *   **Safety/Moral Weight:** Do not frame leaving tools out as a trip hazard or theft risk. If there is a safety consequence, it becomes a safety rule, not a convention. Keep it about *efficiency* and *friction*.
  *   **Authority:** Do not mention that the Shop Manager decided this. It must appear to have emerged from the volunteers' need to work together.

  ### 2. The Sequence (Order of Pieces)
  You must deliver these four concepts in this exact order.

  **Phase 1: The Mismatch Cost (5 mins)**
  *   **Content:** Describe a Tuesday night where Volunteer A puts the wrench in the drawer, and Volunteer B looks in the drawer (empty), then looks on the bench (empty), then finds Volunteer C who has it on their lap. Everyone is annoyed.
  *   **Goal:** Establish that *doing different things* is the enemy, not the specific action.
  *   **If you swap this with Phase 2:** If you state the rule before explaining the cost of mismatch, the rule looks like an arbitrary command from above. They will treat it as a "law" to be obeyed or broken, rather than a signal to be coordinated.

  **Phase 2: The Arbitrary Settlement (10 mins)**
  *   **Content:** Explain that we could have chosen "Put Away." It would work fine *if everyone did it*. But we landed on "Leave Out." Emphasize that "Leave Out" is not *better* than "Put Away"; it is just *the one we are all currently using*.
  *   **Goal:** Separate the *value of consistency* from the *value of the specific rule*.
  *   **If you swap this with Phase 3:** If you explain expectations before establishing arbitrariness, they will assume the rule exists because "Leave Out" is naturally superior. They won't understand how change is possible later.

  **Phase 3: The Expectation Engine (10 mins)**
  *   **Content:** Why do you leave the tool out? Not because you'll get in trouble. But because you *expect* the next person to look on the bench. And they look on the bench because they *expect* you to have left it there.
  *   **Goal:** Shift motivation from "compliance" to "prediction." I follow the rule to make myself predictable to you.
  *   **If you swap this with Phase 4:** If you talk about changing rules before they understand why the current one holds, they will view the convention as fragile or optional.

  **Phase 4: Shifting the Equilibrium (5 mins)**
  *   **Content:** How do we change? We don't need a unanimous vote. We need a critical mass to signal the switch. If three senior volunteers start putting tools away tomorrow, the expectation shifts, and the convention moves.
  *   **Goal:** Show that rules evolve through behavior, not just meetings.

  ### 3. Misconceptions and Interceptions

  **Misconception 1: "If it's arbitrary, I don't have to follow it."**
  *   **When it arises:** Phase 2 (when you admit "Put Away" would also work).
  *   **How to head it off:** Immediately pivot to the Mismatch Cost. "It doesn't matter which side of the road we drive on, but it matters very much that we don't drive on *different* sides. Your preference for 'Put Away' is valid, but your solo use of it breaks the system."

  **Misconception 2: "This is just peer pressure / bullying."**
  *   **When it arises:** Phase 3 (when discussing expectations).
  *   **How to head it off:** Distinguish *threat* from *prediction*. "Peer pressure is 'I'll be mad if you don't.' This is 'I'll be confused if you don't.' I'm not asking you to do this for me; I'm asking you to do this so I can find the wrench."

  **Misconception 3: "We'd need everyone to agree to switch at once."**
  *   **When it arises:** Phase 4 (Change).
  *   **How to head it off:** Use the "Traffic Light" analogy. If one person treats red as go, nothing happens. If three cars treat red as go, the intersection clears differently. You don't need a vote; you need a visible pattern shift.

  ### 4. The Closing Question
  Do not ask: "What is the tool rule?" (Tests memory).
  Do not ask: "Why is consistency important?" (Tests vocabulary).

  **Ask this:**
  > "Imagine you come in for your shift tomorrow and you see three experienced volunteers wiping down tools and putting them into the drawers. You have just finished using a 10mm spanner. What do you do with it, and why?"

  **The Correct Answer:**
  "I put it in the drawer. Because the convention has shifted, and if I leave it on the bench, no one will find it."

  **The Wrong Answer:**
  "I leave it on the bench, because that's the rule." (Shows they missed the point that the rule *is* the expectation, not the text).

  ### 5. What to Openly Refuse
  To keep this to 30 minutes and prevent the session from derailing into the previous blowup, state these boundaries at the start:

  1.  **No Debate on Merit:** "We are not discussing today whether 'Leave Out' is better than 'Put Away.' We are discussing why we do *one* of them consistently. That debate happens in the monthly meeting, not here."
  2.  **No Enforcement Talk:** "I am not going to talk about what happens if you break this. There is no punishment. There is just friction. We are talking about workflow, not discipline."
  3.  **No History:** "We are not discussing who started the rule or the argument from last month. We are discussing how the system works right now."

  ### Summary of Risks
  *   **If you let them debate the merit of Rule (a):** You validate the idea that the rule is about *truth* (which way is best) rather than *coordination* (which way we agree).
  *   **If you use Rule (b) (Parts):** You introduce morality (theft/fairness). People will follow it because it's "right," not because it's a convention. You will fail to teach them how to handle the *arbitrary* rules.
  *   **If you skip Phase 1 (Mismatch):** They will view the rule as authority-based. When authority is absent, they will stop following it.
