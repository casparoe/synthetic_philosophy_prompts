  12. **Final Polish:** Ensure the distinction between "Justice is instrumental" (Glaucon) and "Impunity corrupts" (SL/Tolkien) is clear. They are different claims. One is about *value*, the other about *psychology*.

  *(Self-Correction on the "Better Model"):* A thought experiment *is* the model. Trying to find a real-world analogue often fails because real worlds have hidden sanctions (guilt, social internalization). I should suggest that the *only* valid model is the introspective counterfactual, but if forced to choose an empirical proxy, a "High-Stakes Whistleblowing with Guaranteed Anonymity" is closer than "Admin Access." Actually, the "Last Man on Earth" intuition pump is the standard philosophical alternative. I will suggest that.

