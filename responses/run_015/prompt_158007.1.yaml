answer: |-
  In a chaotic hospital wing, nurse Elena operates on a compulsive, opaque ritual: she must tap her badge three times against the morphine cabinet before dispensing, a self-referential anxiety loop where the action validates the fear that demands it, while her colleague Marcus dynamically adjusts his diligence based on the head nurse's mood and peer behavior. When a charismatic doctor pressures both to bypass safety checks during a rush, Marcus instantly adapts to the social cue, prioritizing workflow harmony over protocol, whereas Elena's internal script triggers a debilitating anxiety spike if she skips the tap, forcing her to refuse the doctor despite not being able to articulate why. To the ward, Elena appears to exhibit principled moral agency while Marcus looks like a conformist pushover, yet Elena's resistance is merely a glitchy feedback loop she cannot override, while Marcus's compliance is a rational social calculation.

  **Rigidity-as-Freedom Camp:** They argue that genuine agency requires immunity to social coercion. Because Elena's script is encapsulated behind **Second-Order Opacity** (she cannot introspect the origin of the compulsion), the doctor's social pressure has no lever to pull; she cannot be reasoned out of the action because she never reasoned herself into it. Her inability to update on social cues functions as a commitment device, preserving a diachronic continuity of action that looks like integrity.

  **Flexibility Camp Attack:** They argue that agency requires *reasons-responsiveness*. Elena isn't choosing safety; she's regulating internal state. If the doctor shouted, "Skipping this tap saves a life," Elena's script might still force her to tap, revealing her actions are morally inert mechanics. She is not a moral agent but a broken instrument that happens to align with safety protocols today.

  **What Breaks:** If the script was a conscious rule written yesterday (removing the opacity/internalization), social pressure could override it. Marcus and conscious-Elena would both cave because conscious rules are negotiable social contracts. The "freedom" relies entirely on the cognitive brokenness that seals the loop against external negotiation; without the opacity, the rigidity collapses into mere stubbornness, which is vulnerable to social override.
