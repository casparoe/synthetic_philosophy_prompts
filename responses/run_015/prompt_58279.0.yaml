prompt: |-
  I'm trying to sort out when looking before you leap is actually rational and when it isn't, given Good's theorem that free information never hurts an ideal expected utility maximizer. Can you give me the desiderata list for any decent theory of rational inquiry and info-seeking — like what cases it has to get right, what distinctions it has to respect, with the why behind each one?

  I'm especially thinking of cases like a free medical test you know you'll overreact to, learning something that changes what you care about like finding out the ending of a novel you're halfway through, and peeking in a game where the other player knows you will peek. Tell me which requirements are non-negotiable vs just nice to have for one camp, and if any two on your list can't both be satisfied at once, plus which single requirement rules out the most simple theories. Keep it focused on the criteria, not a big tour of who says what, and short enough I can realy use it as a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Topic:** Rationality of information seeking ("looking before you leap") vs. Good's Theorem (free info is always valuable for expected utility maximizers).
      *   **Task:** Create a desiderata list (criteria/checklist) for a theory of rational inquiry/info-seeking.
      *   **Specific Cases to Address:**
          *   Free medical test (known overreaction/anxiety cost).
          *   Spoilers (changing what you care about/experience value).
          *   Game theory (opponent knows you peeked).
      *   **Constraints:**
          *   Explain the *why* behind each criterion.
          *   Distinguish Non-Negotiable vs. Nice-to-Have.
          *   Identify incompatibilities (trade-offs).
          *   Identify the "killer" criterion (rules out simple theories).
          *   Keep it focused on criteria, not history/literature review.
          *   Keep it short/checklist-style.

  2.  **Deconstruct Good's Theorem & Its Limits:**
      *   *Good's Theorem:* If you maximize expected utility, update by conditionalization, and information is free, you should always take it.
      *   *Why it fails in practice:*
          *   Information isn't truly free (computational costs, emotional costs).
          *   Agents aren't ideal (bounded rationality, akrasia/weakness of will).
          *   Information changes the *state* of the world (game theory, spoilers).
          *   Information changes *utilities* (endogenous preferences).
      *   *Goal:* The desiderata must capture these nuances.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Must handle costs.
          2.  Must handle emotional reactions.
          3.  Must handle game theory.
          4.  Must handle changing preferences.
          5.  Must match Good's theorem when conditions are ideal.

      *   *Refining for Precision & "Why":*
          1.  *Cost Sensitivity:* Info often has a price (time, money, anxiety). Theory must subtract this.
          2.  *Non-Instrumental Value:* Sometimes info is bad for the experience (spoilers). Theory must value ignorance.
          3.  *Strategic Transparency:* In games, knowing changes the opponent's move. Theory must model info as an action.
          4.  *Bounded Rationality:* Humans aren't ideal updaters. Theory must account for processing errors/bias.
          5.  *Good's Limit:* If conditions *are* ideal, it should agree with Good.

      *   *Addressing Specific User Cases:*
          *   Medical test/Overreaction -> Bounded Rationality / Emotional Cost.
          *   Novel Spoiler -> Non-Instrumental Value / Preference Change.
          *   Game Theory Peek -> Strategic Transparency.

      *   *Categorizing (Non-Negotiable vs. Nice-to-Have):*
          *   Non-Negotiable: Must handle costs, must handle strategic impact, must handle non-instrumental disvalue.
          *   Nice-to-Have: Normative alignment with ideal agents (Good's limit), computational tractability.

      *   *Identifying Trade-offs:*
          *   Ideal Rationality vs. Psychological Realism. (If you assume ideal updating, you can't explain the medical test anxiety case without adding ad-hoc utility costs).
          *   State-Independence vs. State-Dependence of Utility. (Good's theorem assumes utility function is fixed. Spoilers change the utility of the experience).

      *   *Identifying the "Killer" Criterion:*
          *   The "Value of Ignorance" criterion. Simple EU theory says info is never negative. A decent theory *must* allow info to have negative net value. This kills naive Good's Theorem applications.

  4.  **Finalizing the List (Structuring for the User):**
      *   Use clear headings.
      *   Keep descriptions tight.
      *   Ensure the "Why" is explicit.
      *   Make the Trade-offs section distinct.

  5.  **Review against Constraints:**
      *   *Short enough?* Yes, bullet points.
      *   *Focused on criteria?* Yes, avoiding names like "Savage" or "Joyce" unless necessary (better to avoid).
      *   *Addressed specific cases?* Yes, mapped to criteria.
      *   *Non-negotiable vs. Nice-to-have?* Included.
      *   *Incompatibilities?* Included.
      *   *Killer criterion?* Included.

  6.  **Polishing the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between *cost of acquisition* and *cost of possession*. The medical test is free to take but costly to possess (anxiety). Good's theorem assumes cost of acquisition is zero, but implicitly assumes cost of possession is zero too. The desideratum needs to cover "net value."
      *   *Correction:* On the game theory case, it's not just that the opponent knows, it's that the *act* of looking changes the game tree. This is "Causal Impact of Inquiry."
      *   *Correction:* On spoilers, it's about "Endogenous Preferences." The info changes the utility function, not just the probability distribution.

  7.  **Final Polish:** Check tone (analytical, direct). Ensure the "Killer Criterion" is highlighted. (Decided to call it "Negative Value of Information").

  8.  *(Final Output Generation - similar to the provided good response.)*
answer: |-
  Here is a desiderata checklist for a theory of rational inquiry, designed to handle the limits of Good's Theorem.

  ### The Checklist

  **1. Net Value Sensitivity (Non-Negotiable)**
  *   **The Criterion:** The theory must distinguish between the *cost of acquisition* (time, money) and the *cost of possession* (anxiety, cognitive load).
  *   **The Why:** Good's Theorem assumes information is costless. In the **medical test case**, the test is financially free, but the *possession* of the result triggers a known irrational overreaction (panic). A decent theory must allow the expected utility of *having* the info to be lower than *not having* it, even if acquisition is free.
  *   **Failure Mode:** Naive Expected Utility (EU) theory says "take the test." A rational theory says "skip it if processing costs > decision improvement."

  **2. Allowance for Negative Information Value (Non-Negotiable)**
  *   **The Criterion:** The theory must permit scenarios where $V(Info) < 0$.
  *   **The Why:** This is the direct counter to Good's Theorem. In the **novel spoiler case**, the information destroys the utility of the experience (surprise). If a theory insists information is never instrumentally harmful, it cannot explain why rational agents pay to *avoid* info (e.g., spoiler blockers).
  *   **Failure Mode:** Any theory derived strictly from the Law of Total Expectation without utility-modification clauses.

  **3. Causal Impact of Inquiry (Non-Negotiable)**
  *   **The Criterion:** The act of seeking information must be modeled as an intervention that can change the state of the world, not just the agent's mind.
  *   **The Why:** In the **game theory peek case**, looking isn't passive. If the opponent knows you peeked, the game tree changes (e.g., they punish trust violations). The info isn't just updating $P(World)$; it is changing $P(Opponent's Move | You Looked)$.
  *   **Failure Mode:** Treating inquiry as a purely epistemic update rather than a strategic move.

  **4. Endogenous Preference Stability (Nice-to-Have / Debated)**
  *   **The Criterion:** The theory should specify whether information is allowed to change the utility function itself ($U_{before} \neq U_{after}$).
  *   **The Why:** In the **novel case**, knowing the ending changes how you value the reading process. Standard EU assumes fixed preferences. A robust theory of inquiry must account for "preference drift" caused by knowledge.
  *   **Failure Mode:** Assuming utilities are static state-independent functions.

  **5. Ideal Limit Agreement (Nice-to-Have)**
  *   **The Criterion:** If costs are zero, preferences are stable, and the agent is a perfect updater, the theory should converge with Good's Theorem.
  *   **The Why:** We want to preserve the insight that *pure* knowledge is good for *ideal* agents. If your theory says "never look" even for an ideal god-like agent with no emotional costs, it is too pessimistic.
  *   **Failure Mode:** Cynical heuristics that reject info even when it is strictly useful.

  ---

  ### Trade-Offs & Incompatibilities

  **1. Psychological Realism vs. Formal Tractability**
  *   **Conflict:** To satisfy **Net Value Sensitivity** (handling anxiety/overreaction), you must model the agent's psychological processing limits. To satisfy **Ideal Limit Agreement**, you model the agent as a perfect Bayesian updater.
  *   **Resolution:** You cannot have both in a single equation without introducing a "cost parameter" that effectively breaks the idealization. A theory that is psychologically real (handles the medical test panic) necessarily violates the strict axioms of Good's Theorem.

  **2. State-Independence vs. Preference Change**
  *   **Conflict:** **Endogenous Preference Stability** conflicts with standard decision theory axioms. If learning the spoiler changes what you value, you are no longer maximizing the *original* utility function.
  *   **Resolution:** You must choose: either model the agent as maximizing "anticipated future satisfaction" (which requires predicting your own preference change) or admit that rationality is path-dependent.

  ---

  ### The "Killer" Criterion

  **Requirement #2 (Allowance for Negative Information Value)** is the single requirement that rules out the most simple theories.

  *   **Why:** Standard Decision Theory and Good's Theorem rely on the convexity of the value function. Mathematically, the expectation of the maximum is always greater than or equal to the maximum of the expectation ($E[\max] \geq \max[E]$).
  *   **Impact:** To satisfy #2, you must break the math of standard EU maximization by adding external cost terms or allowing utility functions to be state-dependent. Any theory that cannot mathematically generate a negative value for free information is immediately disqualified for real-world human inquiry.

  ### Summary for Application
  *   **Medical Test:** Fails Standard EU, passes if **Net Value Sensitivity** includes anxiety costs.
  *   **Novel Spoiler:** Fails Standard EU, passes if **Negative Information Value** is allowed via **Endogenous Preferences**.
  *   **Game Peek:** Fails Standard EU, passes if **Causal Impact of Inquiry** is modeled.
