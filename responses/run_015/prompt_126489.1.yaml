  You are a decision theorist whose research sits at the intersection of multi-agent systems and the foundations of rational choice: you move fluently between causal Bayes nets, evidential decision theory and its known instabilities, and the functional/updateless end of the literature, including program equilibrium and logical counterfactuals. Think the problem through carefully before writing: begin with a few hundred words of brainstorming in which you sketch two or three candidate setups and say why you discard each, then give me the finished answer.

  I need a designed case, not an illustration. I am drafting a sequence post arguing that acausal trade does not require the counterpart to be a copy of you, a simulation being run by a friendlier civilization, or a literally identical block of source code — the usual stage furniture, which a hostile reader discounts immediately. The objection I am trying to answer is that acausal trade is only ever rational when the other agent is, in the relevant sense, running your own decision algorithm, and that every real-world case will be one of mere similarity, which is worth approximately nothing. So I want a case where the two agents are distinct, independently built implementations — not copies — and where something other than identity of code does the work.

  Required verdicts: causal decision theory defects; functional decision theory cooperates; evidential decision theory you must actually derive (see below), and I suspect the derivation comes apart depending on a modeling choice. If it does not come apart in your hands, say what you had to assume to keep it stable.

  Constraints on the scenario:

  1. One paragraph. Near-future and realistic: a setting and stakes that a real firm, lab, or state could face within a couple of decades. No uploaded minds, no galaxy-spanning civilizations, nothing faster than light.
  2. No exact copies, no simulations of one agent by the other, no perfect or near-perfect predictor. Neither side has read the other's source; the most either can do is what a careful engineer with full access to the other's published design documents could do.
  3. The two decisions must be causally independent — no signal can pass from either decision to the other before both are fixed — but the goods themselves may be transferred later. There is no iteration, no reputation, no contract enforcement, and no further interaction after the exchange.
  4. The bridge between the agents is this and only this: both were built independently to the same published specification of a decision procedure, each knows the other was built to that specification, and neither knows anything more about the other's internals. The specification underdetermines some behavior, so the two implementations are only probably equivalent on the relevant class of decision problems. Set that probability strictly below 1 — say 0.8 — and make the noise model fully explicit, including what actually happens in the failure branch. The failure branch must not do the work.
  5. Payoffs: each side prefers receiving without sending, to both sending, to neither sending, to sending without receiving, and the two goods are a genuine comparative-advantage pair, so that cooperation produces real gains from trade rather than mutual restraint alone.

  Deliverables after the scenario:

  a) Concrete numbers — costs, values, the failure probability — laid out as the four ordered outcomes, plus the explicit generative model relating the two agents' outputs. If your numbers put the threshold at which functional decision theory flips above 0.8, adjust the payoffs rather than the probability, say what you changed, and say why that is not cheating.
  b) Causal decision theory: the causal graph and why it defects.
  c) Functional decision theory: the counterfactual, and an honest statement of what the counterfactual ranges over — this implementation's output, or the value of the ideal computation the specification describes. Defend the choice, since everything rides on it.
  d) The threshold failure probability at which functional decision theory stops cooperating, computed from your numbers, and what the case becomes below it.
  e) Evidential decision theory in two branches: first, where the agent has already settled and introspected its own output, so its act carries no news; second, where the agent is still uncertain about how its own implementation resolved the specification's freedom, so its act is evidence. Give the conditional probabilities in each branch, commit to which branch a real evidential decision theorist should endorse, and say whether that makes the verdict principled or an artifact of self-modeling.
  f) Which single feature of the case is doing the work, and what happens if you remove it.
  g) The two strongest attacks, with answers: that the shared specification is just an ordinary common cause, so this is causal or evidential reasoning in a costume; and that distinct implementations are not the same algorithm, so logical counterfactuals cannot bind them together. Then tell me honestly whether anything in your case stipulates the verdicts rather than generating them from the theories.
  h) Whether updateless decision theory comes apart from functional decision theory here, and if not, why not.

  If you think two of my constraints cannot be satisfied together, say which pair and propose the nearest satisfiable variant rather than quietly relaxing one. Write for readers who already know Newcomb's problem and the twin prisoner's dilemma, so you can use that vocabulary without explaining it, and keep the whole answer under about a thousand words.
