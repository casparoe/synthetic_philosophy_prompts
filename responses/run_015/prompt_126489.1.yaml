answer: |-
  **Brainstorming**

  The goal is to isolate logical dependence from physical identity. Standard Twin PD cases rely on copies or simulations, which invite the objection that correlation is merely causal (via the copier) or trivial. I need independent builds.
  1.  *HFT Algos:* Discard. Market prices create causal feedback loops; hard to guarantee causal independence without stipulation.
  2.  *Diplomatic AI:* Discard. Verification of "no signaling" is politically ambiguous.
  3.  *Orbital Satellites:* Selected. Physical separation at light-speed guarantees causal independence. Hardware entropy provides a measurable, non-ad-hoc noise model.
  This setup forces the theory to rely on the *specification*, not the *substrate*. The noise model must be explicit: the spec underdetermines behavior in edge cases, resolved by local hardware entropy. This ensures $P(\text{Match}) < 1$. The payoff structure must ensure FDT cooperates at $p=0.8$ but CDT defects. I will set gains from trade high enough to outweigh the 20% divergence risk for FDT, but low enough that CDT sees no causal leverage.

  ***

  **Case: The Orbital Handshake**

  Two orbital debris-sweeping satellites, *Aegis-1* and *Aegis-2*, built by rival firms using the open-source *CollisionAvoidance-v4* spec, intersect orbits. Each holds proprietary debris maps. Swapping maps (Cooperate) costs bandwidth/security (5) but yields mutual navigation safety (15). Keeping maps (Defect) saves cost but risks collision if the other doesn't share. Payoffs: DC=20, CC=10, DD=0, CD=-5. Decisions are simultaneous and light-speed separated. The spec underdetermines edge cases, resolved by local hardware entropy; independent builds match with probability $p=0.8$.

  **(a) Numbers & Model**
  Outcomes: $(U_1, U_2)$. DC: $(20, -5)$, CC: $(10, 10)$, DD: $(0, 0)$, CD: $(-5, 20)$.
  Generative Model: Specification $S \in \{C, D\}$. Hardware noise $\epsilon_i \in \{0, 1\}$. Act $A_i = S \oplus \epsilon_i$. $\epsilon_1, \epsilon_2$ independent. $P(\epsilon_1 = \epsilon_2) = 0$. Match probability $p = P(A_1 = A_2) = 0.8$.

  **(b) Causal Decision Theory**
  Graph: $S \to A_1$, $S \to A_2$. No edge $A_1 \to A_2$.
  CDT intervenes on $A_1$. $P(A_2 | \text{do}(A_1)) = P(A_2)$. Assuming $P(A_2=C)=0.5$: $EU(C) = 0.5(10) + 0.5(-5) = 2.5$. $EU(D) = 0.5(0) + 0.5(20) = 10$.
  Verdict: Defect. The correlation is non-causal; intervention breaks it.

  **(c) Functional Decision Theory**
  Counterfactual ranges over the *specification's logical output*, not the physical act. If I output $C$, I infer $S=C$ (probabilistically). Since $A_2$ depends on $S$, my output is evidence of $A_2$.
  $EU(C) = 0.8(10) + 0.2(-5) = 7$. $EU(D) = 0.8(0) + 0.2(20) = 4$.
  Verdict: Cooperate.
  Defense: The specification is the locus of subjunctive dependence. Physical implementation is a noisy channel; rationality binds via the signal, not the noise.

  **(d) Threshold Probability**
  Inequality: $10p - 5(1-p) > 20(1-p) \Rightarrow 15p - 5 > 20 - 20p \Rightarrow 35p > 25 \Rightarrow p > 5/7 \approx 0.714$.
  Below $0.714$, FDT defects. The case becomes a risky gamble where logical correlation is too weak to sustain trade.

  **(e) Evidential Decision Theory**
  Branch 1 (Settled): Agent knows $A_1$. Act carries no news about $S$. $P(A_2 | A_1) = P(A_2)$. Verdict: Defect.
  Branch 2 (Uncertain): Agent is computing. $A_1$ is evidence of $S$. $P(A_2 | A_1) > P(A_2)$. Verdict: Cooperate.
  Commitment: Real EDT should endorse Branch 2. Decision occurs under uncertainty; Branch 1 models a post-decision state where choice is impossible. The defect verdict is an artifact of over-conditioning.

  **(f) Key Feature**
  The shared underdetermined specification. Remove it, and $p$ drops to baseline (0.5). All theories defect. The spec creates the logical correlation without causal contact.

  **(g) Attacks & Answers**
  1.  *Common Cause:* "The spec is just a common cause; CDT should see this." Answer: CDT sees the cause but treats its own action as an independent intervention, severing the link. FDT treats the logical fact as invariant.
  2.  *Distinct Code:* "Implementations differ, so logic doesn't bind." Answer: Logic is abstract; implementations instantiate the same abstract machine. Divergence is noise, not algorithmic difference.
  Honesty: The noise model is stipulated to allow divergence, but this reflects empirical hardware entropy, not ad-hoc theory-fixing.

  **(h) UDT vs. FDT**
  UDT does not come apart from FDT here. There is no sequential information to update on; the logical fact is timeless. UDT would also cooperate, maximizing expected utility over the policy map from specification to action.
