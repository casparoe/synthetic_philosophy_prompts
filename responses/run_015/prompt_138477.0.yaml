  Q6 Truth Status: Is math more like discovering a continent or inventing a language? [Discover / Invent]

  Position Mapping
  Constructivism/Intuitionism: Q1=Procedure. (Diagnosis: Tension with root commitment; accepts independence only for constructible cases.)
  Conceptualism: Q1=Completed, Q2=Rule. (Diagnosis: Math exists but only as mental constructs.)
  Physicalism: Q1=Completed, Q2=Discovery, Q3=Model. (Diagnosis: Math is abstracted from physical patterns.)
  Modal Structuralism: Q1=Completed, Q2=Discovery, Q3=Reality, Q4=Concrete. (Diagnosis: Math describes possible concrete systems.)
  Nominalist Paraphrase: Q1=Completed, Q2=Discovery, Q3=Reality, Q4=Ideal, Q5=Yes. (Diagnosis: Math talk is shorthand for symbol manipulation.)
  Mathematical Platonism: Q1=Completed, Q2=Discovery, Q3=Reality, Q4=Ideal, Q5=No, Q6=Discover. (Diagnosis: Standard realist view.)
  Fictionalism: Q1=Completed, Q2=Discovery, Q3=Reality, Q4=Ideal, Q5=No, Q6=Invent. (Diagnosis: Math is useful but literally false.)
  Pragmatic Instrumentalism: Q1=Completed, Q2=Discovery, Q3=Reality, Q4=Ideal, Q5=No, Q6=Neither. (Diagnosis: Truth value is irrelevant; utility is all.)

  Unoccupied Combinations
  Q1=Procedure + Q2=Discovery: Incoherent. If math is procedural, types are usually rules.
  Q3=Model + Q4=Ideal: Unattractive. If reals are models, proofs usually target concrete behavior.
  Q5=Yes + Q6=Discover: Redundant. If paraphraseable, discovery claim is weakened.

  Inseparable Leaves
  Modal Structuralism and Nominalist Paraphrase often converge on engineering practice. Extra question needed: `Do possible systems exist independently of actual inscriptions?` This cannot be phrased as an engineering case without metaphysical load.

  DECISION TREE

  START: I accept that there are objective mathematical truths - for example, that there is no largest prime and that every list has a length - and that their truth does not depend on whether any human has proved them.

  Q1: When you assert `there is no largest prime`, do you mean we can always find another (procedure) or that they all exist at once (completed)?
  -> Procedure: `Constructivism/Intuitionism`: mathematical truth is tied to our ability to construct or prove, not to a realm of completed infinities.
  -> Completed: Go to Q2.

  Q2: In a dependently typed language, a term is accepted as `Vector String 3` but rejected as `Vector String 4`. Does the type checker feel like it is discovering a constraint that any possible list must already satisfy, or like it is enforcing a rule that the language designers invented?
  -> Enforcing a rule: `Conceptualism`: mathematical objects are constructs of the human mind or language design.
  -> Discovering a constraint: Go to Q3.

  Q3: Engineers often say that IEEE-754 doubles are only an approximation to the real numbers, and that rounding error reveals a gap between the implementation and the mathematical structure it models. Does that gap indicate that the real-number structure exists independently and is merely approximated, or only that the specification of the reals is a useful fiction or tool for organizing measurement?
  -> Useful fiction or tool: `Physicalism`: mathematics is high-level abstraction from physical patterns and measurements.
  -> Exists independently: Go to Q4.

  Q4: A team proves that a distributed protocol satisfies a safety property, then optimizes the executable while preserving observable behavior. Is the proof about an abstract protocol (an ideal object) or about the messy running system? Does the answer require the protocol to exist as an abstract object, or can the proof be paraphrased as being about the concrete artifacts and their behavior?
  -> Concrete artifacts and behavior: `Modal Structuralism`: mathematics describes what would be true of any concrete system exemplifying a structure, without committing to abstract objects.
  -> Abstract protocol (ideal object): Go to Q5.

  Q5: If we removed all number terms from our specs and replaced them with proof-rules about symbols, would the system behave the same?
  -> Yes (can be replaced): `Nominalist Paraphrase`: apparent reference to mathematical objects can be paraphrased away in terms of concrete inscriptions, proofs, or programs.
  -> No (loss of meaning): Go to Q6.

  Q6: Is math more like discovering a continent or inventing a language?
  -> Inventing a language: `Fictionalism`: mathematical statements are not literally true; mathematics is an indispensable fiction.
  -> Neither (utility only): `Pragmatic Instrumentalism`: mathematical statements are tools for prediction; truth values are irrelevant.
  -> Discovering a continent: `Mathematical Platonism`: mathematical objects are abstract, mind-independent entities.

  KEY NOTES FOR FACILITATORS

  Distinction Criteria
  Mind-Independent Objects: Platonism, Physicalism (physical objects), Modal Structuralism (possible concrete systems).
  Genuine Truth: Platonism, Constructivism, Nominalist Paraphrase, Modal Structuralism.
  No Abstract Objects: Fictionalism, Nominalist Paraphrase, Conceptualism, Physicalism.
  Metaphysically Neutral: Modal Structuralism, Nominalist Paraphrase, Instrumentalism.

  Engineering Applicability
  Platonism explains why math fits science (shared structure).
  Fictionalism explains why we use math despite ontological doubts.
  Constructivism aligns with computational verification limits.
  Nominalist Paraphrase aligns with formal methods and syntax-heavy workflows.

  Usage Instructions
  Read questions aloud. Allow 2 minutes per question for discussion.
  Record path (e.g., 1-Completed, 2-Discovery...).
  Match path to leaf.
  If group splits on Q5, discuss whether `exists` in specs implies memory allocation or logical consistency.

  Tension Warning
  The root commitment assumes truth independence from proof. `Constructivism/Intuitionism` leaf qualifies this independence for infinite cases. Mark this as a pragmatic deviation common in engineering.
