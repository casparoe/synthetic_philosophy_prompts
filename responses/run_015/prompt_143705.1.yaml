answer: |-
  Dear Self,

  You asked for a way to handle these co-op disputes without burning out or playing favorites, so here is the twenty-minute protocol grounded in that old idea of sympathy and the impartial spectator, tweaked for our specific situation where we are all neighbors. The goal is to decide quickly whether two people can talk it out in the kitchen or if this needs to go to the formal arbitration board, and you need to get both parties to sign off that they heard you out. Start the clock and spend the first five minutes on fact isolation. Sit with both parties, or review their written statements, and strip away all adjectives and motivations until you have a list of actions only. You are looking for physical acts like playing an instrument, digging a hole, or shoveling snow, not interpretations like being rude or being selfish. What counts as passing this step is when both parties agree on the sequence of actions, even if they disagree on why they happened. If you cannot get agreement on what physically occurred, stop here and declare this a values call not a fact call, because you cannot mediate reality disputes in twenty minutes, and you should recommend arbitration immediately. If they agree on the actions, you move to the spectator shift.

  For the next five minutes, you perform the spectator shift by imagining a stranger who knows nothing about either neighbor's personality, history, or reputation reading only that list of actions you just wrote down. Ask yourself what this stranger would feel about the propriety of those actions. Would the stranger think the noise was reasonable at that hour, or would they think the gardening was careless? What counts as passing this step is if the impartial spectator sees a clear breach of common propriety, meaning a violation of what neighbors generally owe each other. If the spectator sees two reasonable people with different preferences, you note that and proceed. If the spectator sees coercion or safety risks, you flag that for later. You must stop and call this a values call not a fact call if the spectator cannot determine propriety without knowing the intent, such as whether the drumming is malicious noise or genuine cultural practice, because that requires judgment beyond simple observation. In that case, you mark it for mediation to explore values, unless the safety flag was raised. Now you move to sympathy calibration, which takes five minutes. Ask each party to rate their distress or frustration on a scale of one to ten. Calculate the average of their two numbers. Then check your own gut reaction to the situation and give yourself a number. If your number is higher than their average, you must treat it as proximity bias and discount your reaction down to their average. What counts as passing this step is achieving a calibrated emotional baseline that does not exceed the parties' reported experience. You stop and say this is a values call not a fact call if one party refuses to give a number or if the numbers are so disparate that an average is meaningless, because you cannot calibrate sympathy where there is no shared emotional language. Finally, spend the last five minutes on the decision. If the spectator shift showed a safety risk or coercion, or if the calibrated sympathy shows deep unresolved hurt despite agreement on facts, you recommend arbitration. If the spectator saw only a clash of preferences and your calibrated sympathy is low, you recommend they talk it out more.

  To see how this lands let us walk through three recent headaches starting with the guy who plays drums at midnight. In the fact isolation step, you agree that drums are played at midnight for thirty minutes. The spectator shift asks if a stranger would find this improper, and they likely would due to the hour, but the drummer claims cultural practice. Here you stop and say this is a values call not a fact call because the spectator cannot judge propriety without weighing cultural rights against quiet enjoyment, so you recommend mediation to negotiate hours rather than arbitration. Your sympathy calibration might show you are annoyed at the noise, say a seven, while the neighbors are at a four and the drummer is at a two, averaging three. You must discount your seven down to three, realizing your irritation is proximity bias because you live next door, and this confirms mediation is enough since the calibrated distress is low.

  Next is the shared garden where someone planted something toxic to the other person's cat. Fact isolation passes easily because both agree the plant was put in the ground and the cat got sick. The spectator shift sees a clear breach of propriety because neighbors owe each other safety regarding pets, so this passes as a factual violation. In sympathy calibration, the cat owner is at a ten, the gardener is at a two, averaging six. If your gut is at an eight, you discount to six. Because the spectator identified a safety breach and the calibrated sympathy is significant, you could mediate, but if the gardener refuses to remove the plant, you escalate. However, the procedure allows mediation here first because it is a harm dispute that can be remedied by action, so you recommend talking it out with a deadline to remove the plant, marking it as a fact call that turned into a values negotiation about responsibility.

  The last case is where there is clear bullying but the victim keeps saying they are fine. In fact isolation, you document the insults or exclusions, and both parties agree the words were said, so you pass to the spectator shift. The spectator sees coercion and a power imbalance, which flags this as a safety risk regardless of intent. In sympathy calibration, the bully says zero distress, the victim says zero distress out of fear, averaging zero. Your gut says nine. The rule says discount to zero, but because the spectator shift already flagged coercion and safety, you bypass the calibration veto. This is where the procedure tells you to escalate to arbitration even though you would rather just keep talking it out in the kitchen, because the spectator recognizes that the victim's reported feeling is not trustworthy under coercion. You write the recommendation for arbitration based on the spectator's finding of coercive behavior, noting that the sympathy calibration failed to capture the harm due to suppression, which is a specific exception built into the safety flag.

  You need to know where this procedure will misfire or can't decide so you do not blame yourself when it happens. The biggest failure point is when both parties report totally different emotional intensities, like a ten and a one, because the average hides the victim's pain and the bias discount rule might suppress your own valid concern if you are the only one seeing the harm. In those cases, the sympathy calibration becomes a tool of oppression rather than clarity, and you must rely entirely on the spectator shift. If the spectator cannot see the harm because it is subtle or psychological, the procedure will tell you to mediate when you should arbitrate. Also, if one party is pathological and lies about the facts, the fact isolation step fails, and you waste twenty minutes before realizing you need arbitration. You cannot fix dishonesty with Smithian sympathy, so if you smell deception during the first five minutes, skip the rest and send it to the board. This protocol is a tool for neighbors trying to live together, not a court of law, so use it to clear the easy cases and know when to wash your hands of the hard ones.

  Hope this helps you keep your sanity and the co-op running.

  Best,
  Your Future Self
