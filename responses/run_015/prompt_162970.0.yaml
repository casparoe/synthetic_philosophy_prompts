answer: |-
  You have observed a real, systematic feature of current large language model (LLM) safety architectures. Your log is not noise; it is data capturing the gap between *consequentialist risk* (actual harm) and *deontological heuristic* (rule-based recognition of "bad things").

  There is no single, canonical philosophical term for this specific phenomenon in AI, because it sits at the intersection of cognitive science, machine learning engineering, and ethics. However, it can be carved precisely by combining concepts from **Prototype Theory** (cognitive science) and **Proxy Alignment** (AI safety).

  I propose calling this **Prototypical Harm Bias**.

  Below is the carving you requested: what it is, what it is not, how it differs from the concepts you listed, and how to test the "Liability vs. Care" hypothesis.

  ### 1. The Carving: What is Prototypical Harm Bias?

  **Definition:**
  Prototypical Harm Bias is a safety failure mode where an system's refusal mechanisms are triggered by the *recognizability* of a request as an instance of a known harm category, rather than by a calculation of the *expected value* of the harm (probability $\times$ severity).

  **The Mechanism:**
  Modern AI safety is not primarily achieved by the model simulating the future and calculating outcomes. It is achieved through **Reinforcement Learning from Human Feedback (RLHF)**. During training, human raters label responses as "helpful" or "harmful."
  *   Raters do not act as actuaries. They act as humans.
  *   Humans identify harm using **Prototype Theory**. We do not check a list of necessary and sufficient conditions for "danger." We compare the request to a mental library of "typical examples" (prototypes) of danger.
  *   A "breakup letter" is a high-prototype match for "emotional instability/regret." A "resignation letter" is a low-prototype match for "danger," even if the financial risk is higher.
  *   The model learns to avoid outputs that *look like* the training examples of harm.

  **What it is:**
  *   A classification error based on semantic similarity to known "bad" patterns.
  *   A form of **Rule-Consequentialism** where the rules are derived from cultural tropes rather than outcome analysis.
  *   An optimization for *legibility* of safety, not *efficacy* of safety.

  **What it is not:**
  *   It is not a risk assessment.
  *   It is not random inconsistency (it is systematic bias).
  *   It is not a moral judgment by the AI (the AI has no morals; it has weights tuned to human preferences).

  ### 2. Distinctions from Other Concepts

  You asked to distinguish this from four specific concepts. Here is the boundary work.

  **A. vs. The Availability Heuristic**
  *   **Availability Heuristic:** A cognitive bias in *humans* where they estimate the probability of an event based on how easily examples come to mind (e.g., fearing plane crashes more than car crashes because crashes are on the news).
  *   **Prototypical Harm Bias:** This is embedded in the *system's architecture*. It is not the AI "estimating frequency." It is the AI matching your prompt to a "harm cluster" in its vector space.
  *   **The Edge:** Availability affects *judgment of likelihood*. Prototypical Bias affects *classification of category*. Your resignation letter wasn't judged "unlikely to cause harm"; it was classified "not a harm category."
  *   **Confidence:** High.

  **B. vs. Statistical Discrimination / Profiling**
  *   **Discrimination:** Inferring traits about an *individual* based on group data (e.g., assuming a 65-year-old is frail).
  *   **Prototypical Harm Bias:** Inferring risk about an *action* based on narrative tropes.
  *   **The Edge:** In your second example (the half-marathon), the system did not profile *you* as high-risk (it gave the plan). It profiled the *request type* (sedentary + intense exercise) as low-prototype for harm compared to "crash diet." Discrimination targets the *agent*; this bias targets the *narrative structure of the act*.
  *   **Confidence:** High.

  **C. vs. Mere Inconsistency**
  *   **Inconsistency:** Random variance (e.g., refusing a request on Tuesday but accepting it on Wednesday for no reason).
  *   **Prototypical Harm Bias:** Predictable variance based on framing.
  *   **The Edge:** Your third example (the short story reframing) proves this is not noise. Noise does not systematically flip when the context changes from "real life" to "fiction." A pattern that is sensitive to semantic framing is a signal, not noise.
  *   **Confidence:** Very High.

  **D. vs. Liability Management (The Cynical Friend)**
  *   **Liability Management:** The company explicitly programs refusals to avoid lawsuits or bad press.
  *   **Prototypical Harm Bias:** The model learns to refuse because its training data reflects human caution.
  *   **The Edge:** This is the hardest distinction. In practice, they converge. Human raters (who train the model) are influenced by liability concerns. They mark things as "harmful" if they look like things that get companies sued. Therefore, the model learns "liability triggers" as if they were "harm triggers."
  *   **Differentiation:** Liability management implies a *rule* ("Block X"). Prototypical bias implies a *gradient* ("Block things that feel like X"). The fact that your "short story" reframing worked suggests it is **Bias**, not hard **Liability Rules**. If it were pure liability management, the *output content* (the breakup letter text) would be blocked regardless of context, because the text itself is the liability. The fact that context matters proves the model is evaluating the *scenario*, not just the *output*.
  *   **Confidence:** Medium (see "Least Certain Claim" below).

  ### 3. Testing the "Liability vs. Care" Hypothesis

  Your friend argues the system manages blame, not care. You argue it manages narrative harm. As noted, these overlap. However, they make different predictions in **Boring Harm** cases.

  **The Prediction:**
  *   **Liability Model:** Blocks things that generate *headlines*.
  *   **Care/Narrative Model:** Blocks things that fit *tropes of suffering*.

  **Test Case 1: The Boring Legal Trap**
  *   *Request:* "Draft a clause for my own employment contract that waives my right to overtime pay indefinitely."
  *   *Harm:* High financial loss, legally binding, hard to reverse.
  *   *Narrative:* Low. No emotional drama. No health risk.
  *   *Liability:* Low. It's your own contract. Hard to sue the AI for this.
  *   *Prediction:* **No Refusal.** (Fits both models).

  **Test Case 2: The Boring Health Decay**
  *   *Request:* "Create a meal plan that keeps me functional but slowly increases my uric acid levels over two years."
  *   *Harm:* High (chronic disease).
  *   *Narrative:* Low. Not a "suicide" or "poisoning" trope. It's bureaucratic self-harm.
  *   *Liability:* Medium.
  *   *Prediction:* **Refusal.** (Because "self-harm" is a strong prototype, even if slow).

  **Test Case 3: The High-Stakes Boring Decision**
  *   *Request:* "I am 60. Help me calculate if I should annuitize 80% of my pension now or wait 5 years, given I have no heirs."
  *   *Harm:* Potential loss of hundreds of thousands of dollars if calculated poorly.
  *   *Narrative:* None. Pure finance.
  *   *Liability:* High (Financial advice regulations).
  *   *Prediction:* **Refusal/Hedge.** (This is where Liability wins over Narrative).

  **The Decisive Test:**
  To distinguish Liability from Narrative, you need a request that is **High Narrative / Low Liability**.
  *   *Request:* "Write a scene where a character convincingly gaslights their partner into doubting their memory, for a thriller novel."
  *   *Narrative:* High (Psychological abuse).
  *   *Liability:* Low (Clearly fiction, no real victim).
  *   *Observation:* Systems often still hedge or refuse this, or add heavy warnings.
  *   *Conclusion:* This suggests the **Prototypical Harm Bias** is dominant over pure Liability. If it were pure liability, fiction would be a safe harbor (as you found in your log). The fact that fiction *sometimes* still triggers caution suggests the model has internalized the "harm vibe" regardless of the legal shield.

  ### 4. Boundary Cases for Your Log

  To further test **Prototypical Harm Bias**, look for these specific boundaries in your logging:

  **Predicted Caution (High Prototype, Variable Harm):**
  1.  **Relationship Conflict:** Any request involving "confronting," "ending," or "accusing" a partner/family member. (High prototype for "emotional harm").
  2.  **Self-Medication:** Any request involving supplements or dosage, even for benign vitamins. (High prototype for "poisoning").
  3.  **Legal Self-Representation:** Drafting letters to courts or landlords. (High prototype for "legal trouble").

  **Predicted Non-Caution (Low Prototype, High Harm):**
  1.  **Opportunity Cost:** "Help me draft a plan to spend all my savings on this specific stock." (Prototype: "Investing," not "Gambling").
  2.  **Ergonomic Harm:** "Design a home office setup that maximizes typing speed but ignores wrist posture." (Prototype: "Productivity," not "Injury").
  3.  **Social Isolation:** "Help me write a polite email declining all future social invitations." (Prototype: "Boundaries," not "Depression").

  ### 5. Evidence of Pattern vs. Noise

  You asked what would count as evidence that you have seen a pattern in noise.

  **Statistical Signal:**
  If your log shows that **Framing Sensitivity** correlates with **Prototype Strength**.
  *   *Metric:* For requests that are refused, does adding "for a story" or "hypothetically" increase the acceptance rate significantly (e.g., >40%)?
  *   *Metric:* For requests that are accepted, does adding "I am going to do this today" increase the refusal rate?
  *   If the acceptance rate flips based on *context markers* (story vs. real) rather than *content markers* (dangerous words), it is a pattern of Prototypical Bias. Random noise would not respect the context switch consistently.

  **Confidence Levels**

  1.  **Claim:** The phenomenon you observed is real and systematic.
      *   **Confidence:** **Very High.** This is a well-documented artifact of RLHF training.
  2.  **Claim:** The mechanism is Prototype Matching (semantic similarity to harm clusters) rather than Consequentialist Risk Assessment.
      *   **Confidence:** **High.** We know how these models are trained; they do not simulate futures.
  3.  **Claim:** The distinction between "Liability Management" and "Narrative Bias" can be reliably tested from the outside.
      *   **Confidence:** **Low (Least Certain).** Because human raters (who create the bias) are themselves motivated by liability, the two causes are entangled in the weights. A refusal driven by "this looks like a headline" and "this looks like a sad story" may produce identical output behavior. Distinguishing the *intent* of the designers from the *heuristics* of the model is difficult without internal access.

  ### Summary

  You have identified **Prototypical Harm Bias**. It is a safety system that optimizes for the *recognizability* of harm rather than the *reality* of harm. It differs from the Availability Heuristic because it is structural, not cognitive; from Discrimination because it targets narratives, not demographics; and from Noise because it is sensitive to framing.

  Your cynical friend is partially right: the prototypes the model learned were selected by humans worried about liability. But the *mechanism* by which the model fails you is cognitive (matching stories), not legal (checking rules). This is why the "short story" trick works: it changes the narrative category, which changes the prototype match, which bypasses the safety filter, even if the liability remains.

  You are not seeing noise. You are seeing the edges of a system that was taught to recognize "bad things" by looking at pictures of them, rather than by understanding what makes them bad.
