answer: |-
  You are describing a discursive regime that manages moral capital. The pattern you have identified is robust, and your rejection of "competitive victimhood" is correct: that concept explains the *motivation* of actors, but not the *grammar* of the rules they are forced to play by. You are asking about the syntax of memory, not the strategy of memorializers.

  Here is the carving you requested: an analysis of the near neighbours, the structural mechanism at work, a proposed term for the phenomenon, and an assessment of its ethical viability.

  ### I. Near Neighbours and Their Failures

  Three established concepts come closest to capturing this asymmetry, but each fails to account for the specific *directionality* you have observed.

  **1. Incommensurability**
  *   **The Fit:** This is the philosophical claim that two things share no common measure. It explains the taboo against ranking atrocities (you cannot measure suffering on a single scale) and the language of "rupture" or "unprecedentedness" (the event exists outside normal history).
  *   **The Miss:** True incommensurability would forbid *all* comparison, including the claim of uniqueness. To say Event A is "unique" is to compare it against Events B through Z and find it lacking equivalents. If they were truly incommensurable, you could not establish a hierarchy where one sits at the top as the "archetype." Incommensurability explains the prohibition on horizontal ranking, but it cannot explain the obligation of vertical elevation.

  **2. Exceptionalism**
  *   **The Fit:** This accounts for the compulsory claim that a specific event is historically singular (e.g., Holocaust exceptionalism). It explains why exhibition text *must* assert uniqueness to avoid insult.
  *   **The Miss:** Exceptionalism is usually a political claim made *by* a group, not a discursive norm enforced *upon* a group by the public. Furthermore, exceptionalism does not inherently forbid comparing other things to the exception. (One can say "X is the exception" without saying "Therefore you cannot compare Y and Z.") It explains the superlative, but not the taboo against the comparative.

  **3. Sacralization**
  *   **The Fit:** This treats the memory of the atrocity as sacred. In sacred spaces, measurement is profane. Counting the dead or ranking pain is a violation of the holy. This captures the emotional force of the "indecent" reaction from visiting teachers.
  *   **The Miss:** Sacred hierarchies are usually very clear (saints are ranked, sins are mortal or venial). Sacralization explains why we treat the memory with reverence, but it does not explain why the *mechanism* of reverence requires a specific asymmetry: that we must call it the "worst" (a ranking) while forbidding others from asking "worse than what?" (a ranking).

  **Summary of the Gap:** All three concepts explain why ranking is difficult, but none explain why *one specific type of ranking* (self-elevation to uniqueness) is mandatory while *another type* (peer-to-peer comparison) is forbidden.

  ### II. The Carving: Qualitative Distinction vs. Quantitative Continuum

  The norm you are observing functions by policing the *type of metric* allowed in discourse. It does not forbid comparison; it forbids *shared metrics.*

  **1. The Permitted Axis: Qualitative Distinction (The Vertical)**
  When a museum asserts "unprecedented," "rupture," or "genocide," it is using a **qualitative metric**. It draws a boundary. It says: *This event is of a different kind than normal violence.* This is permitted (and required) because it creates a category. Categories protect identity. If the event is a unique kind, it cannot be diluted by comparison.

  **2. The Forbidden Axis: Quantitative Continuum (The Horizontal)**
  When a visitor asks "Which was worse?", they are invoking a **quantitative metric**. They are positing a continuum of suffering where Event A and Event B are points on the same line. This is forbidden because continua invite dilution. If we are on the same line, we can be moved closer together. If we are closer together, the specific moral claim of the "unique" event weakens.

  **The Mechanism:** The norm allows you to say "I am on the mountain peak" (Qualitative Distinction/Uniqueness) but forbids you to ask "How high is the mountain next to yours?" (Quantitative Continuum/Ranking). The first statement establishes a hierarchy without admitting the existence of a ladder. The second statement admits the ladder exists, which implies someone else might climb it.

  ### III. A Coined Term: Asymmetric Commensurability

  Since "one-way comparativism" describes the direction but not the mechanism, I propose the term **Asymmetric Commensurability**.

  **Definition:** A discursive norm in which claims of *incommensurability* (uniqueness, rupture) are mandated to establish moral hierarchy, while claims of *commensurability* (shared metrics, ranking) are prohibited to preserve moral sacredness.

  **Handling the Boundary Cases:**

  *   **Intra-community comparison:** *Does Asymmetric Commensurability hold?* Generally, no. Inside a single community's history, shared metrics are often permitted (e.g., distinguishing between combatants and civilians, or different waves of persecution). The taboo applies primarily to *inter-group* comparison where moral capital is at stake. The norm protects the group's external boundary, not its internal topology.
  *   **Survivor voice:** *Does the survivor get a pass?* Often, yes. Testimony is treated as "evidence" rather than "argument." A survivor saying "I have never seen anything like this" is accepted as qualitative distinction. A survivor saying "My suffering was greater than theirs" is often still policed, even by their own community, because it invokes the forbidden quantitative continuum. The norm privileges *experience* (qualitative) over *judgment* (comparative).
  *   **Prevention framing:** *Does "Never Again" break the norm?* It attempts to. Prevention requires analogy (This is *like* that). However, to remain safe, prevention discourse usually relies on *warning signs* (qualitative markers) rather than *severity scales*. We compare the *mechanisms* (bureaucracy, dehumanization) rather than the *magnitude* (death tolls). This keeps the comparison within the permitted qualitative axis.
  *   **Non-atrocity analogies (Grief/Achievement):** *Does this apply elsewhere?* Yes. We say "He was the greatest poet of the century" (Sanctioned Uniqueness) but consider it rude to ask "Was he greater than X?" (Forbidden Ranking). We say "My grief is immeasurable" (Sanctioned Incommensurability) but reject "My grief is heavier than yours." The norm is not specific to atrocity; atrocity simply heightens the stakes. Asymmetric Commensurability is a general feature of **Sacred Valuation**.

  ### IV. Can the Norm Be Non-Self-Serving?

  You ask if this norm can be stated as a principle that does not simply license the comparisons its holder already wants to make.

  **The Argument for Principle:**
  A defender would argue that Asymmetric Commensurability prevents **Moral Relativism**. If all atrocities are commensurable (on a single scale), then they are fungible. If they are fungible, they can be traded off ("Yes, we killed them, but they killed us first"). By insisting on uniqueness (incommensurability), the norm protects the idea that certain crimes are *sui generis* and cannot be balanced against anything. It is a firewall against justification.

  **The Argument Against Principle:**
  The flaw is that the norm is structurally unable to apply universally. It functions by creating a **Fixed Center**. For one event to be "unprecedented," others must be "precedented." For one crime to be the "rupture," others must be "continuity."
  Therefore, the norm *requires* a hierarchy to function, even as it denies the *process* of ranking. It creates a class of "Archetypal Evil" and a class of "Ordinary Violence."
  This is inherently self-serving because:
  1.  **It privileges the past over the present.** The "unique" event is almost always historical. Emerging atrocities struggle to enter the "unique" category because the slot is occupied.
  2.  **It privileges the recognized over the unrecognized.** Groups fighting for the "genocide" label are fighting for the right to use the Qualitative Distinction metric. The norm doesn't stop the ranking; it just hides the ladder. It allows the group at the top to say "We are incomparable," while telling the group at the bottom "You are not yet comparable."

  **Conclusion:**
  Asymmetric Commensurability cannot be formulated as a non-self-serving principle because it relies on a **scarcity model of moral attention**. It assumes that if we acknowledge a shared metric of suffering, the specific moral claim of the "unique" event will be diluted. Therefore, the norm is not about protecting *truth* (since uniqueness is a comparative claim disguised as a qualitative one); it is about protecting *position*.

  It is a stabilizing norm for established memory, but a blocking norm for emerging memory. It allows you to finish your thesis by describing the fence, but it will not let you open the gate.
