  **Brainstorming Plan**

  *   **End-Word Allocation:** I will retain **FALLIBLE** despite its adjectival nature, placing it where predicate adjectives fit naturally (e.g., "prove me FALLIBLE"). The tension between **SURE** and **CLOSURE** (which slant-rhyme) will be used to highlight the epistemic friction.
  *   **Structural Turn:** Stanzas 1–2 establish the **Lottery** (external rules, mathematical **ODDS**, individual **TICKET**). Stanzas 3–4 establish the **Preface** (internal voice, historical **ERRATA**, human nature). Stanza 5 introduces the **Copy-Editor** case; by using Lottery vocabulary (**TICKET**, **ODDS**) applied to the book via an external note, it structurally aligns with the Lottery, not the Preface. This isolates the difference: the Preface's doubt is internal/endogenous; the Lottery's (and Copy-Editor's) doubt is external/imposed.
  *   **Tornada Strategy:** The tornada will pair the words to show the standoff: **TICKET/ODDS** (the mechanism), **SURE/CLOSURE** (the epistemic goal), **ERRATA/FALLIBLE** (the human cost). It will refuse to prioritize one paradox over the other.

  ***

  **The Two Books**

  Each printed TICKET rests within the palm.
  We calculate the ODDS and find them steep.
  For every number I am distinctively SURE.
  Before we demand any global CLOSURE.
  There is no list of known ERRATA yet.
  Nothing here proves the holder FALLIBLE.

  No one calls the reasoner FALLIBLE.
  He trusts the logic of each losing TICKET.
  The sum admits no possible ERRATA.
  But aggregated weight alters the ODDS.
  Until the system demands a CLOSURE.
  And now the whole is distinctly less SURE.

  For every sentence I felt distinctively SURE.
  But I know well my nature is FALLIBLE.
  I write the preface without logical CLOSURE.
  This is no lottery with a winning TICKET.
  No external hand has set the ODDS.
  Only experience predicts the ERRATA.

  Past volumes show a pattern of ERRATA.
  Though every page was written to be SURE.
  I never weighed the statistical ODDS.
  The doubt arises because I am FALLIBLE.
  There was no draw, no purchase of a TICKET.
  The mistake precedes any formal CLOSURE.

  An external note demands a quick CLOSURE.
  It claims the text contains at least one ERRATA.
  It treats each phrase as if a losing TICKET.
  The voice asserts that nothing stays SURE.
  This mandate makes the author seem FALLIBLE.
  It sets the rules like calculated ODDS.

  The separate ODDS appear unchanged.
  There is no comfortable logical CLOSURE.
  The agent stays fundamentally FALLIBLE.
  We anticipate the future ERRATA.
  Neither belief feels entirely SURE.
  No hand holds the definitive TICKET.

  Hold every TICKET close against the ODDS,
  Be never SURE the system grants CLOSURE,
  Live with the ERRATA of the FALLIBLE.

  ***

  **Answer Key for Teaching Assistant**

  *   **Stanza Allocation:** Stanzas 1–2 model the **Lottery Paradox** (external probability, aggregation); Stanzas 3–4 model the **Preface Paradox** (internal humility, inductive track record). Stanza 5 is the **Copy-Editor case**, which structurally mimics the Lottery (external imposition of "at least one false") despite concerning the book.
  *   **The Copy-Editor's Function:** This case isolates the source of the negative premise. In the Preface, the belief "there is an error" comes from the author's own **FALLIBLE** nature (internal); in the Lottery and Copy-Editor cases, it comes from an external rule or note (external).
  *   **The Burden:** The poem suggests the conflict lies not in the justification of individual claims (which remain **SURE**), but in the principle of **CLOSURE** (aggregation) when faced with high-probability **ODDS**. The honest answer places the burden on Closure or Conjunction, not on the individual beliefs.
