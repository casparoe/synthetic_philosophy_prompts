          *   *Lucid Case:* An exception that proves the rule (lucid dreaming is more like waking).
          *   *Decoder Case:* Shows the device is reading neural causes, not "experience" in the dream-specific sense.
      *   *Diagnosis of the "Innocuous" Step:* Explain why (3) looks true (verificationist temptation) and why (5) looks true (inductive generalization).
      *   *Conclusion:* Summary recommendation.

  7.  **Refining the "Backwards Dependence" vs. "Contemporaneous Traces" requirement:**
      *   Must explicitly state for each option: Does it force me to admit backwards dependence (memory loss erases experience)? OR Does it force me to say what contemporaneous traces do in (a)-(c) that they don't in dreaming?
