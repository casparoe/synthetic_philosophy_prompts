      *   **Topic:** Advance directives, authority of the earlier self (Dworkin vs. Dresser, etc., though not explicitly named yet).
      *   **Goal:** Make students *feel* the tension of being bound by a past self, not just discuss abstract autonomy.
      *   **Format:** Structured role-play/game.
      *   **Key Mechanics:**
