answer: |-
  Here is a complete 90-minute seminar plan designed to generate philosophical tension through gameplay before introducing the theoretical framework.

  # Activity Title: The Covenant of Self

  **Time:** 90 Minutes
  **Students:** 8 (4 Pairs)
  **Materials:** Index cards, pens, a "Lockbox" (envelope) for each pair, chocolate or a tangible privilege (e.g., choosing the next reading) as the stake.

  ## Phase 1: The Vow (15 Minutes)
  **Goal:** Establish the authority of the earlier self without philosophical framing.

  1.  **Instruction:** Tell the students they are entering a binding contract with their future selves. They are not writing medical directives (no DNRs). They must write a **Life Directive** regarding a substantive value, project, or identity.
  2.  **The Rules of Writing:**
      *   The directive must be specific (e.g., "I will pursue an academic career regardless of income," "I will maintain religious observance," "I will never sell my creative work").
      *   It must include a **Trigger Condition** (e.g., "If I ever feel tempted to quit...", "If I am offered a high salary to compromise...").
      *   **The Epistemic Injection:** *Privately hand one student a note before class starts.* Instruct them to include this specific clause in their directive: *"If I ever become convinced that Hard Determinism is true, I must continue to act, punish, and praise exactly as if Libertarian Free Will exists, for the sake of social coherence."*
  3.  **The Stake:** Place a tangible reward (e.g., a box of high-quality chocolates, or a voucher for "Homework Pass") inside an envelope (The Lockbox). Seal it.
      *   **Condition:** The Lockbox opens *only* if the Directive is honored.
      *   **The Twist:** The reward is **communal**. If *any* pair fails to honor their directive, the whole class loses the reward. This simulates the relational cost of breaking self-commitments (letting down family, community, or collaborators).

  ## Phase 2: The Drift (10 Minutes)
  **Goal:** Force a shift in values to create conflict.

  1.  **Role Split:** In each pair, Student A is the **Past Advocate** (holds the written Directive). Student B is the **Present Self**.
  2.  **The Shift:** Hand each "Present Self" a **Value Shift Card**. These cards contradict their specific directive.
      *   *Card 1 (Career):* "A family member has fallen ill. You need immediate high income. Your academic path pays nothing."
      *   *Card 2 (Religion):* "You have had an experience you interpret as undeniable proof that your former faith is false. Continuing observance feels like lying."
      *   *Card 3 (Creative):* "Selling your work is the only way to save a community center that provides art to kids. Keeping it unsold hurts others."
      *   *Card 4 (The Epistemic Case):* "You have studied neuroscience and are now convinced Hard Determinism is true. Acting as if Free Will exists feels intellectually dishonest and manipulative."
  3.  **Instruction:** The Present Self now genuinely holds these new values. They are not "pretending" to disagree; they must argue from this new perspective. The Past Advocate must argue that the Directive remains binding *despite* this shift.

  ## Phase 3: The Tribunal (30 Minutes)
  **Goal:** Negotiate authority without voting.

  1.  **The Mechanism:** Give each pair a **Consensus Contract**.
      *   To open the Lockbox (and save the class reward), *both* the Past Advocate and the Present Self must sign the contract.
      *   The contract states: *"We affirm that the action taken is authorized by the identity of this person."*
      *   If they cannot agree, the Lockbox is destroyed (you, the instructor, shred the envelope in front of them).
  2.  **Constraints:**
      *   No voting.
      *   No "splitting the difference" (you cannot partially honor the directive).
      *   **The Veto:** The Past Advocate holds a red "Veto Card." If they play it, the action is blocked unless the Present Self can successfully argue that the *condition* of the directive has not been met (interpreting the text).
  3.  **Observation:** You (the instructor) circulate and take notes on specific phrases used. Look for:
      *   "I promised myself."
      *   "I'm a different person now."
      *   "It's not rational to follow this."
      *   "I owe it to who I was."
      *   *Specifically watch the Epistemic pair:* Do they argue about happiness or about truth/consistency?

  ## Phase 4: The Debrief (35 Minutes)
  **Goal:** Map the experience to philosophical concepts.

  **Step 1: The Autopsy (10 mins)**
  *   Ask the pairs who failed to open the box: *What was the specific moment you decided the Past Self lost authority?*
  *   Ask the pairs who succeeded: *Did you honor the directive out of loyalty, or because the Present Self found a way to reinterpret it?*
  *   Ask the Class: *How did it feel that your decision impacted the group reward?* (This touches on the relational nature of identity).

  **Step 2: Mapping the Concepts (15 mins)**
  *   **Procedural vs. Substantive Autonomy:**
      *   Draw a line on the board.
      *   **Procedural (The Rules):** Ask the students who argued "A promise is a promise" or "I set the rules for my life." This aligns with **Dworkin's Critical Interests**. The authority comes from the *process* of setting the rule when competent.
      *   **Substantive (The Content):** Ask students who argued "This rule makes me miserable now" or "This rule is based on a false belief." This aligns with **Experiential Interests** or a **Substantive Autonomy** view (you can't be autonomous if you're acting on false premises or against current well-being).
  *   **The Epistemic Clause Reveal:**
      *   Ask the pair with the Determinism directive to share their struggle.
      *   **Point:** This wasn't about happiness (Substantive). It was about **Rational Consistency**.
      *   **Discussion:** Does the Past Self have authority to bind the Present Self to a *logical framework*? If the Present Self believes the framework is false, is following it autonomy or self-deception? This sharpens the "Authority" question beyond mere preference satisfaction.

  **Step 3: The Metaphysical Limit (10 mins)**
  *   **The "Two Selves" Problem:** Be honest about what the game couldn't capture.
      *   In the game, Student A and Student B are physically different people role-playing.
      *   In reality, they are the same biological organism.
      *   **Parfit's Reductionism:** Ask: *If the Present Self has completely different values, memories, and goals, in what sense are they the same person?*
      *   If they are literally different people (psychologically), does the Past Self have any more authority than a parent over a child?
      *   **Conclusion:** Advance directives rely on **Psychological Continuity**. When that continuity breaks (dementia, radical conversion), the authority of the earlier self becomes a fiction we maintain for social stability, not a metaphysical truth.

  ## Instructor Notes for Facilitation

  *   **Silence is Key:** During the 30-minute Tribunal, do not intervene unless they break the rules. Let the awkward silence of a deadlock sit. That discomfort is the philosophical problem manifesting.
  *   **The Epistemic Clause:** If the pair with the Determinism clause resolves it too easily, probe them in the debrief: *"Was following that clause an act of integrity, or an act of lying to yourself?"*
  *   **Managing the Stakes:** If students seem too casual about the "Communal Reward," remind them mid-game: *"Remember, if Pair 3 fails, nobody gets the chocolate."* This usually heightens the pressure on the "Present Self" to consider the cost of their rebellion.
  *   **No Lecture:** Resist the urge to name-drop Dworkin, Dresser, or Parfit until the Debrief. Let them invent the concepts first.

  ## Why This Works
  1.  **Embodied Conflict:** Students aren't arguing about "Mr. Smith"; they are arguing about *their own* (hypothetical) integrity.
  2.  **Non-Medical:** By using career/religion/epistemology, you avoid the "life vs. death" binary that often shuts down nuance in medical ethics.
  3.  **The Epistemic Twist:** This prevents the debate from settling into "Happiness vs. Duty." It introduces "Truth vs. Consistency," which is a higher-order philosophical problem suitable for a seminar.
  4.  **Communal Stake:** It forces the "Present Self" to realize that identity isn't private; breaking a self-commitment often burns bridges with others who relied on that identity.
