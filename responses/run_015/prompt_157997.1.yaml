      *   *Wait, simpler is better for 90 mins.* Let's make it dyadic. Each pair has a "Lockbox." To open it, the Present Self must comply. If they refuse, the Lockbox is destroyed. But, the Past Advocate has a "Veto Token" they can use to block the Present Self's new plan *unless* the Present Self can argue a specific exception.
