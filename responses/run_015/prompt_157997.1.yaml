          *   The Negotiation Game: 30 mins.
          *   Debrief/Discussion: 30 mins.
      *   *Group Size:* 8 students. Perfect for 4 pairs or 2 groups of 4. Let's go with 4 pairs to maximize participation, or 2 groups of 4 if the stakes need to be communal. The prompt suggests "shared resources," which implies a communal aspect. Let's try 2 groups of 4 (2 Past, 2 Present per group) to allow for coalition building. Actually, 4 pairs (1 Past, 1 Present) might be more intense personally. Let's stick to 4 pairs for direct conflict, but add a "Community Pot" to simulate shared resources.
      *   *The "Epistemic Clause":* Needs to be assigned to one specific pair or made a universal rule. Making it a universal rule might be too abstract. Assigning it to one specific "Directive Card" ensures it comes up in the debrief as a specific case study. Let's make it one of the pre-written constraints or a random draw. Better yet, let one student *choose* it during the writing phase as an option, or I (the instructor) introduce it as a "Legacy Clause" for one pair. Let's make it a specific option in the writing phase to ensure buy-in.

  3.  **Drafting the Game Mechanics:**
