          *   **Pedagogy:** No upfront lecture; let rules/payoffs create tension.

  2.  **Deconstruct the Activity Structure:**
      *   *Time Management:* 90 mins is tight for a complex role-play + debrief.
          *   Intro/Setup: 10 mins.
          *   Directive Writing: 15 mins.
