prompt: |-
  im in this transitional justice seminar and we keep reading about amnesty being tied to truth-telling, but nobody actually explains how you'd run a decision case-by-case. let's say i work for a small regional board that can grant conditional amnesty to individual perpetrators, but only if the grant satisfies both "truth recovery" (victims learn what actually happened) and "non-repetition" (the institution that enabled harm is locked from doing it again). the catch is our charter gives us zero authority over institutions, only over people, so the principle has to be applied at the individual level, with a mandatory flag when institutional failure makes the grant moot regardless of the person.

  turn that into a reusable procedure my office could actually run: the ordered questions, what counts as a sufficient answer at each step, the hard-stop no's, and the exact points where we hand it to a human because its values not facts. then apply it to three proposals: (1) a prison guard who gives full verified testimony about torture but the prison system hasn't changed at all; (2) a mid-level commander who offers partial testimony and personally destroys his unit's hidden records (which he alone controls) to block future abuse, but refuses to name higher-ups; (3) a low-level informant whose testimony would locate a hidden mass grave, but the victims' families explicitly reject any deal and demand prosecution.

  present it like a flowchart in words with checkboxes, not a long essay, keep the whole thing under 400 words, and flag where the procedure will misfire or spit out an answer people won't like. also say what it literally cannot do given our institutional limits. include a typo or two if it feels natural.
