      *   *Claim:* Shifting boundaries $\rightarrow$ No independent "real difference." Appeal to stable kind does no work.
      *   *Assessment:* This relies on a specific metaphysical criterion: *classification-independence*. If the target moves because you look at it, can you say you're tracking *it*? This is the core tension. If the "kind" is defined by the classification, it's circular.
