      *   **Stalinesque Model:** The fabrication happens *before* it enters consciousness. The "show" is rigged before the audience sees it. No false memory, just a constructed experience.
      *   **The Prompt's Specific Stalinesque Twist:** It's not just "constructed before consciousness," it's specifically about *predictive suppression* preventing the intermediate state (Green-1) from ever becoming a consolidated draft. It's not erased; it's blocked.
