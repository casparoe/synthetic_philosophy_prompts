      *   **Addressing the Anchor Point Objection:** Critics say motion needs a start point. How can you move from nowhere? Counter: The start point is constructed *as part of the motion vector*, not as a prior static state. The "Green at Pos 1" is a post-hoc attribution of the trajectory's origin, not a precursor. The binding creates the origin, not vice versa.
      *   **Phenomenological Smoothness (No Flicker/Revision):** Why does the Orwellian view fail here? Rewriting implies a cognitive cost or a subjective sense of correction (like a movie edit). We don't feel edited. The Suppression model predicts smoothness because there was never a conflict to resolve. The system never committed to the static frame, so no "change of mind" occurred phenomenally.
