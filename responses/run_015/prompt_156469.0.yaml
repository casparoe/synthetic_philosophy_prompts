      *   **The Instability of the Orwellian View:** Focus on the "rewriting" mechanism. If consciousness is a stream, rewriting implies a pause or a glitch. If the subject reports motion, when did they experience the static flash? If it was conscious, they should report it. If it was unconscious, it wasn't a "phenomenal victim." The distinction between working memory draft and reportable state is crucial here. The Orwellian view conflates them.
