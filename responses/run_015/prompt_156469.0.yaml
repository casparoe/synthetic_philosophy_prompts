      *   **Task:** Argue *against* the standard Orwellian reading (retroactive rewriting of consciousness) and *for* a specific Stalinesque alternative (predictive suppression blocking consolidation).
      *   **Key Distinction:** Separate "consolidation of a working-memory draft" from "production of a reportable phenomenal state."
      *   **Specific Defense:** The intermediate representation (green at pos 1) is *never* encoded into an accessible draft, not even as an erased trace. Predictive suppression prevents its consolidation. Only the cross-spatial binding survives.
