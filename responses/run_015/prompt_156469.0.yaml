      *   **Phenomenological Point:** Explain why the subjective absence of felt revision/flicker is predicted by suppression but anomalous for the rewriting model.
      *   **Constraints:** Assume familiarity with Orwellian/Stalinesque distinction and Color Phi psychophysics. No citations, reading lists, or bibliographic references. Focus on mechanics of temporal binding and whether phenomenal revision requires a prior phenomenal victim.

