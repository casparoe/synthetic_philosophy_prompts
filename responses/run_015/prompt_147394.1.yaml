      *   *Sharpness:* The distinction is sharp *if* the user emphasizes the lack of a "God's eye view" in Borges. In MWI, physics describes the whole. In Borges, the reader (and characters) are trapped *in* a path. There is no external vantage point from which all paths are visible as a completed set.
