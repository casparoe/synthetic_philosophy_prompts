answer: |-
  Dear Colleagues, I stand before you as an engineer rather than a philosopher, and I want to begin by admitting that I do not have the vocabulary to resolve the tensions in this room through theory. My expertise lies in the behavior of large-scale distributed architectures, where we build systems that must remain functional even when components fail or act maliciously. I am here to offer a perspective from that discipline, not to settle debates about obligation or representation, but to suggest that the structural constraints of our technology might mirror the ethical constraints of your politics. In my work, I know that a single node almost never alters the global state of a system. If you look at the logs of a massive consensus protocol, the contribution of one machine is indistinguishable from noise unless it is part of a critical quorum. This creates an honesty problem for me when I build voting infrastructure. I cannot in good faith pretend that one ballot causally determines an election outcome any more than I can claim one server message decides the ledger. Yet I also reject the idea that voting is mere preference signaling, since the collective protocol collapses if participants treat their input as weightless. This is where I find myself needing a framework that respects both the mathematical reality of low individual efficacy and the normative necessity of participation.

  The analogy that has guided my thinking comes from systems designed to tolerate Byzantine faults, where nodes may fail or lie, yet the network must still agree on a single truth. In these systems, every honest node must continue participating even though no individual message changes the ledger. If an honest node decides its message is causally irrelevant and goes offline, it does not change the outcome of that specific round, but it degrades the resilience of the network for all future rounds. Participation here is not about causal leverage; it is about maintaining the quorum required for the system to exist at all. This shifts the ethics of voting from a question of impact to a question of duty. When we tell citizens that their vote matters because it might be the tie-breaker, we are making a statistical claim that is almost always false. But if we tell them their vote matters because their absence weakens the legitimacy of the consensus, we are making a structural claim that is always true. The node participates not to change the state unilaterally, but to certify that the state was reached through a valid protocol. This suggests that the value of voting is not in the selection of the winner, but in the maintenance of the mechanism that allows winners to be selected without violence.

  This comparison also governs how we should speak about the morality of compromise, specifically the lesser-evil problem. In a consensus round, nodes often must select a leader to propose the next block of transactions. Sometimes, the available candidates for leadership are flawed, or perhaps merely less corrupt than the alternatives waiting to take their place. Selecting the least-corrupt leader during a consensus round is structurally similar to choosing the least harmful option in an election. In engineering terms, we accept a suboptimal leader to prevent a fork in the chain or a halt in liveness. We do not do this because we trust the leader, but because we trust the necessity of continuity. If honest nodes refuse to participate because no option is acceptable, the system halts, and the malicious nodes gain control by default. This is not a endorsement of the flawed candidate; it is a recognition that the alternative to compromise is often the collapse of the protocol itself. We build systems knowing they will be used to choose imperfect outcomes, and our job is to ensure the process remains robust enough to survive those choices.

  I offer this analogy not to reduce citizenship to computation, but to find common ground between the engineers maintaining the infrastructure and the theorists studying the obligation to use it. We are both dealing with systems where individual input feels negligible but collective input is existential. My hope for this workshop is that we can design civic technologies that acknowledge this tension rather than hiding it. We should not build systems that promise individual causality where none exists, nor should we build systems that treat participation as optional metadata. We need infrastructure that makes the cost of exit visible, that shows users how their presence sustains the quorum even when their preferred outcome does not win. If we can align the technical architecture with this ethical reality, we might create tools that support democracy not by promising that every vote counts equally in the tally, but by ensuring that every vote counts equally in the trust required to keep the tally valid. I look forward to learning from all of you how to make that abstract stability feel like concrete citizenship.
