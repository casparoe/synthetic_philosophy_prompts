      *   Hume's argument is often criticized for being circular. It assumes the law is true to evaluate the testimony, but the law is only known via testimony/experience.
      *   The "Proof" concept is the culprit. In Hume's time, "proof" meant high probability. The opponent treats it as "incapable of being outweighed."
