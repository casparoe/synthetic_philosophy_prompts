      *   (3) *Method:* Tetralemma (catuṣkoṭi) rejection. Non-implicative negation (prasajya-pratiṣedha). No thesis (pratijñā). Consequentialist argument (prasaṅga). (Standard Prāsaṅgika Madhyamaka).
      *   (4) *Assertion:* Arguments are sound. "Things are empty" is assertible and *true*. (Potential tension with (3)).
      *   (5) *Constraint/Truth:* Emptiness constrains discourse. Some readings are wrong. Facts of the matter exist about unwritten scenes. (Realism about conventions/truth).
      *   (6) *Agency/Personhood:* Persons are empty. Authorship is conventional. *But* source is "me" (not just causes), and "could have written otherwise" (libertarian freedom?) justifies blame/praise. (Potential tension with Dependent Origination and Emptiness).

  3.  **Evaluate Pairwise Consistency (Mental Sandbox):**

      *   *(1) & (2):* Consistent. Standard Madhyamaka.
