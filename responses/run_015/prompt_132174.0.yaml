  8.  **Self-Correction/Nuance Check:**
      *   *Wait, look at (6) again:* "the book's source is me and not the network of causes." This is the killer phrase. In Buddhism, "me" *is* a designation upon the network. To separate them is dualism.
      *   *Look at (5):* "fact of the matter about what my character would do." This sounds like essentialism. But in literary theory, character consistency is a conventional truth. As long as it's not an *inherent* fact, it's okay. I should note this risk.
