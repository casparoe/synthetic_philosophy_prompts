      *   *(3) & (4):* **Tension.** (3) says "no thesis asserted." (4) says "I assert 'things are empty' and call it true." Nāgārjuna famously says "I have no thesis." But he also writes verses. Is "emptiness is true" a thesis? Candrakīrti distinguishes between ultimate truth (no assertions) and conventional truth (assertions allowed). (4) needs to be qualified as conventional truth to fit (3).
      *   *(4) & (5):* Consistent. If "things are empty" is true conventionally, then conventional facts (like literary interpretation) hold.
