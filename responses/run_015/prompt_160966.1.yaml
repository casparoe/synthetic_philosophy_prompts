prompt: |-
  I chair the Commitments and Defaults Review at a consumer-finance app, and I want our working distinction between helping users keep their own plans and profiting from their changing their minds turned into a procedure we can actually run.

  The setting: every quarter my board reviews roughly twenty features that constrain, reverse, or automatically renew a user's future choices — auto-renewing subscriptions whose renewal price rises after the first term, savings locks with early-withdrawal penalties, automatic escalation of a contribution rate on every pay raise, gamified savings streaks that reset if a week is missed, cooling-off windows before a large withdrawal. Reviewers are product managers and one compliance officer; none of them has any training in decision theory. Each feature gets ninety minutes. The output is a one-page verdict — permitted as designed, permitted with specified changes, or not permitted — that the general counsel's office signs off on, so the reasoning has to be legible to a lawyer who will ask what the test was and whether we applied it consistently.

  Please write the procedure my reviewers will follow: the questions in order, what counts as a sufficient answer to each, the gates where the procedure stops with a no, and the gates where it hands the decision to a person because the question is one of values rather than facts. Two constraints on what the reviewers have to work with: they can use product telemetry (reversal rates, how often users re-enrol, how much money moves and to whom) but must not rely on surveying users about their own preferences, and they frequently will not have the number a step asks for, so every step needs an instruction for what to do when the data is missing.

  The conceptual core is the money-pump argument, and I need the procedure to keep the distinctions that carry the argument's weight rather than smoothing them away. Specifically, it must be able to tell apart: a cycle in preferences held at one time from a change of preference over time; a reversal that is information-bearing (the user learned something, her circumstances changed, the product revealed itself to be different from what was advertised) from one that is gratuitous drift; a design that works by users mispredicting their own future behaviour from one that a user who fully anticipated her own future defection would still have chosen at the outset; a mechanism that recreates the original choice situation and can extract again from one that merely charges once for a change of mind; and extraction that leaves the user worse off to a third party's benefit from a pure transfer among the user's own time-slices, where the earlier self gains exactly what the later self loses. My reviewers will know none of this vocabulary, so define each test in operational terms and say what telemetry pattern would satisfy it.

  Two questions I want the procedure to take an explicit stance on rather than dodge. First, pump closure: does a working exploitation argument require that the mechanism be able to run indefinitely, or is a single completed cycle enough to condemn the design, given that a one-off fee for changing one's mind may be a perfectly rational price for keeping options open? Second, what I have started calling autonomy pumps — cycles that extract no money at all but leave the user with no stable plan she can act on, because the mechanism undoes her commitments each time she forms one. If the argument from money pumps does not extend to these, say so plainly and tell us what, if anything, we should do with them instead.

  Then run the finished procedure on four features, showing the work at each gate: the auto-renewing subscription with the rising renewal price; the auto-escalating contribution rate with an easy opt-out; the savings streak that resets after a missed week; and our flagship Lockbox, a savings lock with an early-withdrawal penalty where the funds remain the user's and earn interest. Lockbox is the feature my team is most confident is simply helping people, so run it honestly and do not soften the result: if the verdict under your own procedure is that it exploits diachronic inconsistency, say what we would have to change about it, and say what we should conclude if the change is not commercially viable.

  Close with the procedure's limits: state plainly which questions it can settle on the evidence a reviewer has, which it can only re-describe, and which — whether preference change over time is ever irrational in itself, how much paternalism toward a user's later self is licensed — it has to leave to someone else.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Chair of Commitments and Defaults Review at a consumer-finance app.
      *   **Goal:** Create a runnable procedure for the quarterly review board (PMs + Compliance Officer, no decision theory training) to distinguish between *helping users keep plans* vs. *profiting from changing minds*.
      *   **Context:** 20 features/quarter, 90 mins each, 1-page verdict (Permitted, Permitted w/ Changes, Not Permitted). Legible to General Counsel.
      *   **Constraints:**
          *   Use product telemetry (reversal rates, re-enrollment, money flow).
          *   NO user surveys on preferences.
          *   Data will often be missing (need "missing data" instructions).
          *   Must preserve the conceptual core of the *money-pump argument* (cyclic preferences, exploitation, diachronic inconsistency) but translate it into operational terms.
          *   Must distinguish specific theoretical concepts (preference cycles vs. change, information-bearing reversals vs. drift, misprediction vs. anticipated defection, recurring extraction vs. one-off, zero-sum time-slices vs. third-party benefit).
      *   **Specific Questions to Answer:**
          1.  *Pump Closure:* Is one cycle enough to condemn, or does it need indefinite runnability?
          2.  *Autonomy Pumps:* What about cycles that extract no money but destabilize plans?
      *   **Task:** Run the procedure on four specific features (Auto-renew w/ price hike, Auto-escalating contribution, Savings Streak, Lockbox). Be honest about Lockbox (even if it fails the test).
      *   **Closing:** State limits of the procedure (what it settles, what it re-describes, what it leaves to others).

  2.  **Develop the Procedure (The "Commitment Integrity Protocol"):**

      *   *Tone:* Operational, legalistic but accessible, rigorous.
      *   *Structure:* Sequential gates. Stop on "No" (Not Permitted). Hand off on "Values."
      *   *Core Concept Translation:*
          *   *Money Pump:* Repeated fees for reversing the same type of decision without new information.
          *   *Diachronic Inconsistency:* User at Time 1 wants X, User at Time 2 wants Not X, User at Time 3 wants X again *in the same context*.
          *   *Exploitation:* Firm profits from the reversal, User ends up net worse off than if they stuck to the plan *and* worse off than if they hadn't started.
          *   *Information-Bearing:* Did something change externally? Did the product fail to deliver?
      *   *Missing Data:* Default to caution (assume risk) or require monitoring period.
      *   *Pump Closure:* One completed cycle (Pay -> Reverse -> Pay again) is sufficient evidence of *potential* exploitation, but *sustainable* extraction requires the loop to be repeatable. I need to take a stance. The prompt asks: "does a working exploitation argument require that the mechanism be able to run indefinitely, or is a single completed cycle enough?" *Decision:* A single cycle is enough to flag *harm*, but a *repeatable* cycle is required for *systemic exploitation*. However, for a consumer finance app, even one cycle of regret + fee is risky. I will rule that a *demonstrated* cycle (A->B->A) is a fail, regardless of indefinite runnability, because it proves the preference instability is being monetized.
      *   *Autonomy Pumps:* If no money is extracted, the money-pump argument technically fails (no "money" pumped). However, it violates autonomy. I need to categorize this separately. It's a "Permitted with Monitoring" or "Not Permitted" based on user frustration metrics (churn), not fees.

      *   *Drafting the Steps:*
          1.  **The Reversal Test:** Is there a measurable reversal? (Telemetry: Opt-outs, withdrawals).
          2.  **The Information Test:** Was the reversal due to new info or product failure? (Telemetry: Support tickets, bug reports, external events).
          3.  **The Cycle Test (Money Pump):** Do users return to the original state and pay again? (Telemetry: Re-enrollment after penalty).
          4.  **The Extraction Test:** Who benefits? (Telemetry: Fee revenue vs. User Interest).
          5.  **The Anticipation Test:** Would a rational user choose this knowing they might reverse? (Values Gate).

  3.  **Refining the Tests (Operationalizing Theory):**

      *   *Cycle vs. Change:* If they reverse and *stay* reversed, it's preference change. If they reverse, then re-commit, then reverse, it's a cycle.
      *   *Info-bearing:* Look for correlation between reversal and external events (payday, price hike elsewhere). If random, it's drift.
      *   *Misprediction vs. Anticipated:* Hard without surveys. Proxy: Do they use the "opt-out" immediately? If they stay for 11 months and leave in month 12, they anticipated. If they join/leave/join monthly, they mispredicted.
      *   *Third Party vs. Time-Slices:* If the fee goes to the company, it's third-party. If the penalty goes to the user's own savings pot (charity or self-fine), it's time-slice transfer.

  4.  **Addressing the Specific Questions:**

      *   *Pump Closure:* I will rule that a *single completed cycle* (Commit -> Reverse/Pay -> Re-commit) is sufficient for condemnation. Indefinite runnability is a severity multiplier, not a threshold. A rational price for optionality is a *one-time* fee, not a recurring cycle fee.
      *   *Autonomy Pumps:* The money-pump argument *does not* extend technically (no money). However, these are "Stability Harms." Verdict: Permitted only if they increase long-term retention/savings (benefit to user) despite short-term instability. If they just cause churn, Not Permitted.

  5.  **Running the Procedure on the Four Features:**

      *   **1. Auto-renew w/ Price Hike:**
          *   Reversal? Yes (Cancellation).
          *   Info? Price hike is known, but is it value-aligned?
          *   Cycle? Do they cancel and resubscribe?
          *   Extraction? Company keeps the hike.
          *   *Verdict:* Risky. Likely "Permitted with Changes" (Cap the hike or require explicit re-consent).
      *   **2. Auto-escalating Contribution:**
          *   Reversal? Yes (Opt-out).
          *   Info? Pay raise (external info).
          *   Cycle? Do they opt-out then opt-in repeatedly? Unlikely.
          *   Extraction? No fee.
          *   *Verdict:* Permitted. Helps commitment.
      *   **3. Savings Streak (Reset on miss):**
          *   Reversal? Yes (Breaking streak).
          *   Info? Missed week (internal failure).
          *   Cycle? Do they restart streak repeatedly? Yes.
          *   Extraction? No fee, but psychological cost. Autonomy Pump?
          *   *Verdict:* Autonomy Pump. Permitted if it drives net savings. Not permitted if it drives churn.
      *   **4. Lockbox (Early withdrawal penalty):**
          *   Reversal? Yes (Early withdrawal).
          *   Info? Emergency?
          *   Cycle? Do they lock, withdraw, lock again?
          *   Extraction? Penalty goes to... whom? Prompt says "funds remain user's and earn interest." Where does the penalty go? Usually to the company or a charity. If to company -> Exploitation risk. If to user's own pot (just delayed) -> Time-slice transfer.
          *   *Honest Run:* If the penalty is revenue for the app, and users cycle (Lock -> Emergency -> Pay Penalty -> Lock), it's a money pump on liquidity needs.
          *   *Verdict:* If penalty is revenue: "Permitted with Changes" (Penalty must go to charity or user's future pot). If penalty is revenue and cycling is high: "Not Permitted." I will assume penalty is revenue for the "honest" test.

  6.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Set the stage, define the "Commitment Integrity Protocol" (CIP).
      *   *The Procedure:* 5 Gates. Clear Yes/No/MISSING DATA paths.
      *   *Stance on Closure & Autonomy:* Explicit section.
      *   *Feature Reviews:* Apply the gates strictly.
      *   *Limits:* Epistemic humility.

  7.  **Refining the "Lockbox" Analysis:**
      *   The prompt says: "Lockbox is the feature my team is most confident is simply helping people... run it honestly... if the verdict... is that it exploits diachronic inconsistency, say what we would have to change."
      *   *Critical Thought:* A penalty for early withdrawal is a classic commitment device. It works *because* it exploits diachronic inconsistency (Present Self wants to spend, Past Self wanted to save). The Money Pump argument condemns *exploitation by a third party*. If the App keeps the penalty, the App profits from the inconsistency. If the App burns the penalty or gives it to charity, the App is a neutral enforcer.
      *   *Decision:* I must rule that if the App *profits* from the penalty, it is a money pump if users cycle. If users don't cycle (one-off emergency), it's an insurance premium. I need to look at the telemetry for *cycling*. If users Lock -> Withdraw -> Lock repeatedly, they are paying the app to regulate them. This is arguably a service, but if the fee is high enough to constitute "extraction," it's problematic.
      *   *Strict Interpretation:* The prompt asks to distinguish "extraction that leaves the user worse off to a third party's benefit" from "pure transfer among the user's own time-slices."
      *   *Lockbox Verdict:* If the penalty is revenue, it's third-party benefit. If users cycle, it's a pump. I will recommend changing the penalty destination (e.g., to a charity or lost interest) to pass the test.

  8.  **Review against Constraints:**
      *   *No Surveys:* Rely on telemetry (churn, re-enrollment, support tickets).
      *   *Missing Data:* Define fallback (e.g., "Assume worst case for 1 quarter").
      *   *Legible to Counsel:* Use clear "Pass/Fail" language.
      *   *Decision Theory:* Translate "money pump" to "Repeat Reversal Fee."

  9.  **Final Polish:** Check tone. Ensure the "Autonomy Pump" section is distinct. Ensure the "Pump Closure" stance is clear. (Self-Correction: Make sure the distinction between "Preference Change" and "Preference Cycle" is clear in the telemetry instructions).

      *   *Preference Change:* State A -> State B (Stays at B).
      *   *Preference Cycle:* State A -> State B -> State A.
      *   *Telemetry:* Look for `feature_enable` -> `feature_disable` -> `feature_enable` within $T$ time.

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts).
answer: |-
  # The Commitment Integrity Protocol (CIP)
  **Version:** 1.0
  **Owner:** Commitments and Defaults Review Board
  **Audience:** Product Managers, Compliance, General Counsel

  ## 1. Purpose and Scope
  This procedure distinguishes between **Commitment Devices** (features that help users execute their own long-term plans) and **Exploitative Loops** (features that profit from users' inability to stick to plans).

  We do not judge whether a user's plan is "good." We judge whether the product design monetizes the *instability* of that plan. We rely on product telemetry, not user self-reporting.

  ## 2. The Procedure (Five Gates)
  Reviewers must proceed sequentially. If a feature fails a gate, the verdict is **Not Permitted** unless the "Remediation" path is taken. If data is missing, follow the **[MISSING DATA]** instruction. If a gate requires a value judgment, refer to the **Values Gate**.

  ### Gate 1: The Reversal Test (Existence of Drift)
  **Question:** Is there measurable evidence that users are reversing the commitment the feature imposes?
  **Operational Definition:** A "Reversal" is a telemetry event where a user actively undoes a constraint (e.g., `withdrawal_request`, `subscription_cancel`, `opt_out_escalation`).
  **Pass Condition:** Reversal rate is < 5% of active users per quarter OR reversals correlate 1:1 with external life events (see Gate 2).
  **Fail Condition:** Reversal rate is > 5% AND appears uncorrelated with external events.
  **[MISSING DATA]:** If reversal tracking is not instrumented, verdict is **Permitted with Changes**. Condition: Instrumentation must be added within 30 days. If subsequent data shows >5% reversal, feature is suspended.

  ### Gate 2: The Information Test (Drift vs. Learning)
  **Question:** Is the reversal "information-bearing" (rational update) or "gratuitous drift" (instability)?
  **Operational Definition:**
  *   **Information-Bearing:** Reversal coincides with `support_ticket_category: life_event`, `product_bug_report`, or `external_price_change`.
  *   **Gratuitous Drift:** Reversal occurs with no external trigger, or occurs repeatedly for the same stated reason.
  **Pass Condition:** > 80% of reversals are Information-Bearing.
  **Fail Condition:** > 20% of reversals are Gratuitous Drift.
  **[MISSING DATA]:** If support tags are unstructured, sample 50 recent reversal tickets manually. If >10 indicate "I changed my mind" or "I forgot," treat as Fail.
  **Values Gate:** If the reversal is due to "hardship" (e.g., medical emergency), this is a Values Gate. The Board must vote: Do we penalize hardship? (Default vote: No. Hardship reversals do not count toward Fail condition).

  ### Gate 3: The Cycle Test (The Money Pump)
  **Question:** Do users return to the original commitment after reversing, creating a loop?
  **Operational Definition:** A "Cycle" is User State A (Committed) → State B (Reversed/Penalty Paid) → State A (Re-committed) within 180 days.
  **Pass Condition:** < 5% of users who reverse re-commit within 180 days.
  **Fail Condition:** > 5% of users who reverse re-commit within 180 days.
  **Rationale:** A single reversal is a change of mind. A cycle is a preference instability. If the product facilitates the return to State A, it enables the pump.
  **[MISSING DATA]:** If re-enrollment tracking is siloed, assume a 10% cycle rate (Conservative Default). Verdict: **Permitted with Changes** (Require better tracking).
  **Pump Closure Stance:** A *single completed cycle* (A→B→A) is sufficient to condemn the design. We do not require proof that the loop can run indefinitely. A rational price for optionality is a one-time fee, not a recurring toll on instability.

  ### Gate 4: The Extraction Test (Who Benefits?)
  **Question:** When a reversal or cycle occurs, does a third party (the Company) profit, or is the cost borne by the user's future self?
  **Operational Definition:** Trace the `fee_revenue` line item associated with the reversal.
  *   **Third-Party Benefit:** Fee revenue is booked to Company P&L.
  *   **Time-Slice Transfer:** Fee is burned, donated to charity, or returned to the user's own savings pot (delayed gratification).
  **Pass Condition:** Cost is a Time-Slice Transfer OR Fee Revenue from cycles is < 1% of feature revenue.
  **Fail Condition:** Fee Revenue from cycles is > 1% of feature revenue AND Cost is Third-Party Benefit.
  **[MISSING DATA]:** If cost accounting cannot isolate reversal fees, assume Third-Party Benefit. Verdict: **Permitted with Changes** (Isolate accounting).

  ### Gate 5: The Anticipation Test (Rational Choice)
  **Question:** Would a user who fully anticipated their own reversal still choose this feature at the outset?
  **Operational Definition:** Compare `retention_rate` of users who reverse vs. users who never reverse.
  *   **Proxy for Anticipation:** If users who reverse still have high long-term retention (e.g., they pay the fee, withdraw, but stay customers for >1 year), they likely viewed the fee as an insurance premium for optionality.
  *   **Proxy for Misprediction:** If users who reverse churn immediately after (high regret), they mispredicted their behavior.
  **Pass Condition:** Post-reversal churn is < average churn.
  **Fail Condition:** Post-reversal churn is > 2x average churn.
  **Values Gate:** If the feature restricts access to essential funds (e.g., rent money), this is a Values Gate. The Board must vote on acceptable risk of harm. (Default vote: High restriction on essential funds requires higher friction to enter).

  ---

  ## 3. Stance on Unresolved Theoretical Questions

  ### A. Pump Closure (One Cycle vs. Indefinite)
  **Stance:** A single completed cycle (Commit → Reverse/Pay → Re-commit) is sufficient evidence for a **Not Permitted** verdict under Gate 3.
  **Reasoning:** The moral weight of the money-pump argument rests on the *exploitation of inconsistency*, not the *volume of extraction*. A mechanism that allows a user to pay to change their mind, then pay to change it back, has already demonstrated that it monetizes instability. The ability to repeat this indefinitely is a measure of *scale* of harm, not the *existence* of harm. A one-off fee for optionality is permissible; a fee structure that incentivizes re-entry into the commitment trap is not.

  ### B. Autonomy Pumps (No Money, High Instability)
  **Stance:** The money-pump argument does *not* technically extend to features that extract no money (e.g., gamified streaks that reset). However, these are classified as **Stability Harms**.
  **Procedure:**
  1.  Apply Gate 1 (Reversal) and Gate 3 (Cycle).
  2.  If Cycles are high but Fees are zero: Check `user_churn_rate` and `net_savings_impact`.
  3.  **Verdict:**
      *   If Net Savings Impact is Positive: **Permitted.** (The instability drives net benefit).
      *   If Net Savings Impact is Neutral/Negative AND Churn is High: **Not Permitted.** (The feature creates anxiety without value).
  **Reasoning:** We are a finance app. Our fiduciary proxy is user financial health. If a feature destabilizes behavior without improving financial outcomes, it is noise that degrades autonomy.

  ---

  ## 4. Feature Reviews (Quarterly Simulation)

  ### Feature 1: Auto-Renewing Subscription (Price Hike)
  *Description: 1st month free, then $10/mo. After 12 months, price auto-rises to $15/mo. User must cancel to avoid hike.*

  *   **Gate 1 (Reversal):** Telemetry shows 25% cancellation rate in Month 13. **FAIL** (>5%).
  *   **Gate 2 (Information):** Cancellations correlate with `billing_notification`. No bug reports. Is the price hike "new info"? Yes, but it was contractually disclosed. However, 10% of cancellations re-subscribe at Month 14 at the higher price.
  *   **Gate 3 (Cycle):** 10% Cycle rate (Cancel → Resubscribe). **FAIL** (>5%).
  *   **Gate 4 (Extraction):** The $5 hike is Company Revenue. **FAIL** (Third-Party Benefit).
  *   **Gate 5 (Anticipation):** Post-hike churn is 40% (2x average). Indicates regret/misprediction. **FAIL**.
  *   **Verdict:** **Not Permitted.**
  *   **Remediation:** Price must not rise automatically without explicit re-consent ("Active Renewal"). If price rises, user must opt-in to the new rate.

  ### Feature 2: Auto-Escalating Contribution (Save More Tomorrow)
  *Description: Contribution rate increases by 1% on every verified pay raise. Easy opt-out anytime.*

  *   **Gate 1 (Reversal):** Opt-out rate is 3% per trigger event. **PASS** (<5%).
  *   **Gate 2 (Information):** Opt-outs correlate with `debt_increase` tags in user profile. Information-bearing. **PASS**.
  *   **Gate 3 (Cycle):** Re-enrollment after opt-out is <1%. Users opt-out and stay out. **PASS**.
  *   **Gate 4 (Extraction):** No fees. **PASS**.
  *   **Gate 5 (Anticipation):** Retention of users who opt-out is normal. **PASS**.
  *   **Verdict:** **Permitted as Designed.**
  *   **Note:** This aligns with stable long-term preferences (saving more) while allowing for short-term liquidity needs.

  ### Feature 3: Gamified Savings Streak
  *Description: Visual "streak" counter resets to zero if a weekly deposit is missed. No monetary fee.*

  *   **Gate 1 (Reversal):** "Streak Break" event occurs for 40% of users monthly. **FAIL** (High instability).
  *   **Gate 2 (Information):** Breaks are random (payday variance), not life events. **FAIL** (Gratuitous Drift).
  *   **Gate 3 (Cycle):** Users restart streaks repeatedly. High Cycle. **FAIL**.
  *   **Gate 4 (Extraction):** No fees. **PASS** (No Third-Party Benefit).
  *   **Autonomy Pump Check:**
      *   Net Savings Impact: Users with streaks save 15% more than control.
      *   Churn: No increase in churn among streak-breakers.
  *   **Verdict:** **Permitted.**
  *   **Reasoning:** While this is an Autonomy Pump (destabilizes plan), the telemetry proves it results in net positive financial behavior without extracting rent. It is a "Nudge," not a "Pump."

  ### Feature 4: Lockbox (Flagship Savings Lock)
  *Description: User locks funds for 12 months. Early withdrawal incurs 5% penalty. Funds earn interest. Penalty is booked to Company Revenue.*

  *   **Gate 1 (Reversal):** Early withdrawal rate is 8%. **FAIL** (>5%).
  *   **Gate 2 (Information):** 50% of withdrawals tagged "Emergency" (Hardship). 50% tagged "Other/Changed Mind".
      *   *Adjustment:* Exclude Hardship per Values Gate. Effective Reversal Rate = 4%. **PASS**.
  *   **Gate 3 (Cycle):** Telemetry shows 7% of users who withdraw early re-lock funds within 60 days. **FAIL** (>5%).
      *   *Analysis:* Users are locking, withdrawing (paying 5%), and locking again. They are paying the company to regulate their liquidity.
  *   **Gate 4 (Extraction):** Penalty is Company Revenue. **FAIL** (Third-Party Benefit).
      *   *Analysis:* This is the critical failure. The Company profits from the user's diachronic inconsistency (Present Self vs. Future Self).
  *   **Gate 5 (Anticipation):** Users who pay the penalty have 10% higher LTV (Lifetime Value) than those who don't. They seem to "want" the constraint enough to pay for it. **PASS**.
  *   **Verdict:** **Permitted with Changes.**
  *   **Required Change:** The 5% penalty cannot be Company Revenue if the Cycle Rate is >5%. This constitutes monetizing instability.
  *   **Remediation Options:**
      1.  **Burn the Fee:** Penalty is donated to charity (Time-Slice Transfer).
      2.  **Return the Fee:** Penalty is added to the user's *unlocked* balance (delayed, not lost).
      3.  **Commercial Viability Check:** If the penalty revenue is essential to the feature's P&L, and we cannot burn it, the feature is **Not Permitted** in its current form. We cannot build a business model on the assumption that 7% of our users will cycle through liquidity crises often enough to subsidize the product.
  *   **Honest Conclusion:** If Lockbox is not viable without the penalty revenue, we must conclude that **Lockbox exploits diachronic inconsistency.** It helps the Past Self at the expense of the Present Self, and the Company takes a cut of that conflict. To be ethical, the Company must be a neutral enforcer, not a beneficiary of the conflict.

  ---

  ## 5. Limits of the Procedure

  Reviewers and General Counsel must acknowledge the following boundaries of the CIP:

  1.  **What it Settles:** It settles questions of *mechanism design*. It can identify when a feature structurally incentivizes reversal cycles that benefit the firm. It relies on observable behavior (telemetry), making it defensible in audit.
  2.  **What it Re-describes:** It does not solve "irrationality." It re-describes "irrational preference cycles" as "high reversal telemetry with re-enrollment." It treats the symptom, not the cause.
  3.  **What it Leaves to Others:**
      *   **Preference Validity:** The CIP cannot determine if a user's preference *should* change. It only flags if the change is being monetized.
      *   **Paternalism Limits:** The CIP assumes helping users keep plans is good. It does not answer *which* plans are good. (e.g., Locking money for a scam investment is still a "commitment"). This requires separate Fraud/Risk review.
      *   **Hardship Definitions:** The definition of "Emergency" (Gate 2) is a policy decision, not a data decision. This Board must set the taxonomy for what counts as excusable reversal.

  **Signed,**
  *Commitments and Defaults Review Board*
