answer: |-
  1. For a termination date to make sense, a society must be conceived as a discrete political organism defined by its elite institutions rather than its demographic substrate. Fall dates track the repertoire reading, marking the loss of state capacities like writing and monumental building rather than the occupancy reading of population or settled area.

  2. The practice strictly presupposes the repertoire reading, because assigning a fall date while population persists requires defining the society by its complex capacities rather than its people. There is no coherent way to assign absolute end dates while holding that nothing really ended, unless one stipulates that the specific political form is the only entity that matters.

  3. The inconsistency is not real, as one theory can license both labels if the determining variable is the political legitimacy of the successor state rather than the material reality of the change. Collapse language is applied when the successor lacks institutional continuity, while continuity language is used when a new name masks the persistence of the underlying social structure.

  4. On this theory, the Kesh case is a collapse because the definition of the society rests on the repertoire of state capacities which were demonstrably lost. The subsequent cultural persistence is irrelevant to the periodization because the political organism defined by palaces and script has ceased to function.

  5. Replacing the fall date would require a transitional range labeled as reorganization, which loses the dramatic clarity of a definitive historical boundary. Visitors could no longer be told a simple story of civilizational failure, forcing the museum to explain complex processes of adaptation instead of singular events.
