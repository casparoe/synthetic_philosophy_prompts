  I deny the force of your dilemma because it assumes that only successful, affirmative recognition constitutes personhood, whereas on my view the struggle for recognition is itself the relational medium in which personhood subsists, however damaged or suppressed. The captive in the cell was a person, not because of some intrinsic capacity you wish I would admit, but because the captors' systematic suppression was a negative relation that presupposed the agency it sought to destroy—you do not fear noise, you fear speech, and their effort to extinguish his voice confirms the very status they denied. The scholars' retroactive engagement does not alter his personhood at time *t*, because personhood is a status of the living community's practical negotiation, and the dead exist only as ancestors whose standing is fixed by the relations they achieved while alive. To say the scholars make him a person now would be to confuse memorialization with constitution; what they do is vindicate the claim he made against his captors, a claim that was real even when unanswered. The temporal index matters because mutual recognition requires two living wills, and while the scholars offer recognition, the captive cannot reciprocate, meaning this is an act of justice toward a memory, not a constitution of a person. So, the captive was a damaged person in the cell, sustained by the adversarial relation with his jailers, and the scholars change nothing about his ontological status then, only our moral relationship to his memory now.

  [I am highly confident that retroactive recognition cannot metaphysically constitute past personhood without collapsing the distinction between history and ontology. The step I am least willing to defend is the claim that adversarial suppression counts as a relation sufficient to sustain personhood rather than merely damaging it.]
