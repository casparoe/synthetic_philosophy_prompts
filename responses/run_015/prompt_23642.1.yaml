answer: |-
  It is a pleasure to engage with someone who brings the rigor of experimental physics to the philosophy of science. Your framing is not clumsy at all; in fact, your intuition about the tension between the mathematical formalism and the historical reality of discovery cuts to the heart of the matter.

  To answer your question directly: **Frank Ramsey would likely have argued that the Problem of Old Evidence (POE) arises from an unrealistic idealization of the agent (logical omniscience), rather than a failure of the Bayesian calculus itself.** He would probably not have called for a non-probabilistic supplementation of history, but rather a refinement of how we model the *logical relationship* between hypothesis and evidence within the probabilistic framework.

  Here is a detailed breakdown of how Ramsey's specific philosophical commitments lead to this conclusion.

  ### 1. Context: Ramsey vs. The Formalized POE
  First, a historical note: Frank Ramsey died in 1930 at the age of 26. The Problem of Old Evidence was not formalized until Clark Glymour's work in the 1980s. Therefore, any answer must be a reconstruction based on Ramsey's extant work, primarily *"Truth and Probability"* (1926) and *"Facts and Propositions"* (1927).

  However, Ramsey was the father of subjective Bayesianism (personalism). His core thesis was that probabilities are simply degrees of belief, measured by betting dispositions, and rationality consists in **coherence** (avoiding a Dutch Book).

  ### 2. The Crux: Logical Omniscience
  The standard Bayesian formulation of the POE assumes that if a hypothesis $H$ entails evidence $E$, then $P(E|H) = 1$. If $E$ is already known, $P(E) = 1$. Thus, $P(H|E) = P(H)$.

  Ramsey was acutely aware that human agents are **not logically omniscient**. In *"Truth and Probability,"* he distinguishes between the logic of consistency (the ideal) and the psychology of inference (the human reality). For Ramsey, learning that General Relativity ($H$) entails the bending of starlight ($E$) is itself a **new piece of information**.

  While the *data* of the eclipse was "old," the *logical relation* ($H \rightarrow E$) was new. For a Ramseyian agent, updating their credence in $H$ upon realizing that $H$ explains $E$ is rational. The "evidence" that confirms the theory is not the raw sensory data of the eclipse (which is fixed), but the discovery of the entailment relation.

  If we treat the proposition "$H$ entails $E$" as the new evidence $E'$, then $P(E') < 1$ before the derivation is made, and $P(E') = 1$ after. Bayes' theorem then functions correctly to raise the posterior probability of $H$.

  ### 3. The Ramsey Test and Conditionals
  Ramsey is famous for the "Ramsey Test" for conditionals. He suggested that to evaluate a conditional "If $p$, then $q$," one should hypothetically add $p$ to their stock of knowledge and see if $q$ follows.

  Applied to your example:
  1.  The scientist hypothetically adds General Relativity to their belief system.
  2.  They calculate whether the eclipse data follows from this new system.
  3.  Finding that it does, they adjust their belief in General Relativity.

  For Ramsey, this process is inherently probabilistic and subjective. The confirmation happens in the *evaluation of the conditional*, not merely in the observation of the consequent. This aligns with modern "counterfactual" solutions to the POE (like those proposed by Daniel Garber), which Ramsey's framework naturally supports. He would argue that the scientist is effectively asking: "What would my credence in the eclipse data be *if* I only knew Newtonian physics vs. *if* I knew General Relativity?"

  ### 4. Would He Supplement Bayesianism with History?
  You asked if he would conclude that Bayesian confirmation must be supplemented by a non-probabilistic account of the history of discovery.

  **Almost certainly not.** Ramsey was a unifier. His entire philosophical project was an attempt to ground logic, probability, and truth in a coherent pragmatic framework. To introduce a non-probabilistic historical factor would be to admit that the calculus of coherent belief is insufficient for rationality, which contradicts the core of *"Truth and Probability."*

  Ramsey viewed logic as a normative guide for how we *ought* to think, not necessarily a description of how we *do* think. If the standard Bayesian calculus fails to capture the rationality of accepting GR, Ramsey would argue we have misapplied the calculus (by assuming logical omniscience or treating $P(E)$ as exactly 1), not that the calculus is broken.

  ### 5. The Experimentalist's Perspective
  Given your background, you might appreciate this nuance: Ramsey was deeply influenced by the empirical sciences. He understood that in experimental practice, $P(E)$ is rarely exactly 1. Even "old" data is subject to re-evaluation, calibration errors, and reinterpretation.

  In 1919, the eclipse data was not a fixed, certain truth in the way a mathematical tautology is. It was a measurement with error bars. A Ramseyian could argue that the confirmation came from the *fit* of the theory to the data relative to the noise. If Newton predicts $E_N$ and GR predicts $E_{GR}$, and the observed data $O$ is closer to $E_{GR}$, then $P(O|H_{GR}) > P(O|H_{N})$, even if $O$ is known. The "oldness" of $O$ matters less than the *likelihood ratio* of the specific observed value given the continuous distributions predicted by the theories.

  ### Conclusion
  If Frank Ramsey were addressing your question today, I believe he would argue:

  1.  **Rejection of Logical Omniscience:** The POE is an artifact of assuming agents know all logical consequences of their beliefs instantly. The discovery that GR entails the eclipse result is new information that updates credence.
  2.  **No Non-Probabilistic Supplement:** He would maintain that the history of discovery can be fully modeled within a subjective probabilistic framework, provided we account for the learning of logical relations and the uncertainty of measurement.
  3.  **Pragmatic Confirmation:** Ultimately, for Ramsey, the confirmation lies in the fact that adopting GR makes the agent's belief system more coherent and better suited for guiding action (future predictions) than retaining Newton. The eclipse data is the touchstone for that coherence.

  He would likely tell you that the Bayesian calculus is sound, but the model of the *agent* using it in the POE scenario is too idealized to reflect the actual cognitive work of a physicist discovering that a new theory explains old data.
