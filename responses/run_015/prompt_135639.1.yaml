answer: |-
  This is a incredibly sharp observation. You have identified a specific rhetorical maneuver that is frustratingly common but rarely named in everyday conversation.

  You are right that it isn't just "lying" or simple "inconsistency." In simple inconsistency, a person contradicts themselves because they are confused or changing their mind. In the scenario you described, the shift is **functional**. They want the *power* of certainty when they are attacking, but the *safety* of uncertainty when they are defending.

  Here is the breakdown of the philosophical concepts that match this, along with a proposal for what to call it if you want to be specific.

  ### 1. The Closest Existing Concept: The Motte-and-Bailey Doctrine
  The most famous philosophical name for this structure is the **Motte-and-Bailey Doctrine**, coined by philosopher Nicholas Shackel.

  *   **The Bailey (The Attack):** This is the desirable, controversial, strong claim. In your example, this is **"We KNOW this is true."** It's exciting, it mobilizes people, and it shuts down debate. It's the "fortified town" they want to occupy.
  *   **The Motte (The Defense):** This is the defensible, boring, weak claim. In your example, this is **"We can't be 100% sure, but we should act on the risk."** It is technically reasonable and hard to argue against.
  *   **The Maneuver:** When they are persuading, they live in the Bailey ("It is a fact!"). When you challenge them to prove the fact, they retreat to the Motte ("Well, nothing is 100% a fact, but we have to be careful!"). Once you walk away, they go back to living in the Bailey as if the retreat never happened.

  While Motte-and-Bailey usually refers to shifting the *content* of a claim (e.g., "All men are trash" vs. "Some men do bad things"), your observation is a specific **Epistemic Motte-and-Bailey**. They aren't changing *what* they claim is happening; they are changing the *status of knowledge* regarding the claim.

  ### 2. The Linguistic Concept: Epistemic Equivocation
  In philosophy of language, there is a theory called **Epistemic Contextualism**. This theory suggests that the word "know" changes its standards depending on the context.
  *   *Casual Context:* "I know the bank is open Saturday." (Based on past experience).
  *   *High-Stakes Context:* "I don't *know* the bank is open Saturday; I should call first." (Based on verified proof).

  Normally, this is a legitimate feature of language. However, what you are describing is an abuse of this flexibility. You could call this **Epistemic Equivocation**.
  *   **Equivocation** is using the same word with two different meanings in an argument.
  *   Here, they use "Know" to mean **"Absolute Certainty"** when they want authority, and **"High Probability"** when they want to avoid the burden of proof.

  ### 3. The Strategic Concept: The Precautionary Shield
  The second half of their argument ("...but we should act anyway") is a version of the **Precautionary Principle**. This is the idea that if an action has a suspected risk of causing harm, the burden of proof falls on those taking the action to show it is *safe*, not on others to show it is *dangerous*.

  When combined with the first part, it creates a "Heads I Win, Tails You Lose" scenario:
  *   **Offense:** "We know it's dangerous!" (Appeal to Authority/Truth).
  *   **Defense:** "Even if we don't know for sure, we can't take the risk!" (Appeal to Caution).

  ### So, what should we call it?
  If you want to name this specific phenomenon where the *certainty* shifts but the *claim* stays the same, I propose calling it **"Certainty Surfing"** or **"Epistemic Shifting."**

  However, if you want a term that sounds more academic and captures the unfairness of it, **"The Epistemic Shield"** works well. They use certainty as a sword and uncertainty as a shield.

  ### How is this different from just being inconsistent?
  You asked how this differs from simply changing their mind or being inconsistent. Here is the key distinction:

  **1. Simultaneity of Benefit**
  In normal inconsistency, you believe A, then later you believe Not-A. You lose the benefit of A when you switch.
  In this maneuver, they want to keep the **social benefits of both positions at once.**
  *   They want the **moral authority** that comes with Knowledge ("How dare you question what we Know?").
  *   They want the **immunity from criticism** that comes with Uncertainty ("You can't prove me wrong because nothing is certain.").
  *   *Inconsistency* is a bug in their logic; *this maneuver* is a feature of their strategy.

  **2. The Burden of Proof Dodge**
  *   If I say "I Know X," the burden of proof is on **me** to prove X.
  *   If I say "We should act because X might be true," the burden of proof shifts to **you** to prove X is *false* or safe.
  *   By shifting between these two, they never actually have to carry the burden of proof. They pass it back and forth like a hot potato.

  **3. Sincerity**
  As you noted, they aren't necessarily lying. They likely feel the certainty emotionally (when mobilizing) and feel the uncertainty intellectually (when questioned). This is sometimes called **Motivated Reasoning**. Their brain automatically selects the epistemic standard (certainty vs. uncertainty) that protects their tribe or conclusion in that specific moment.

  ### Summary
  You have spotted a rhetorical "glitch" that allows people to bypass the rules of debate.
  *   **Philosophical Family:** Motte-and-Bailey Doctrine.
  *   **Linguistic Mechanism:** Epistemic Equivocation.
  *   **Proposed Name:** **Epistemic Shifting** or **The Certainty Shield.**
  *   **Why it's not just inconsistency:** It is a strategic exploitation of the different "prices" of certainty. They want to spend the currency of Certainty (authority) without paying the cost of Certainty (evidence).

  Next time you see it, you can call it out directly: *"You are using certainty as a sword to attack, but uncertainty as a shield to defend. You need to pick one epistemic standard and stick with it."*
