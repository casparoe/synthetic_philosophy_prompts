prompt: |-
  I've just come out of a long argument with an old friend from graduate school — the tail end of a bottle of wine, the kind of argument that starts over a technical example and ends over whether Bayesian updating rules have any content at all — and I want an independent audit of the version of the Judy Benjamin problem he ended up defending. I'm reconstructing his summary from memory rather than quoting a text, since neither of us had one in front of us. As he told it: Judy is parachuted into a zone that is half friendly (Blue) and half enemy (Red) territory, each half split evenly between Headquarters Company and Second Company, so her prior is one quarter on each of the four combinations; a radio message tells her that if she is in Red territory the odds are three to one that she is in Second Company. The interest of the example, he said, is that her evidence is irreducibly conditional — it cannot be represented as her becoming certain of some proposition, nor even by Jeffrey's generalization of conditionalization to uncertain evidence, because what she has learned is not a proposition whose probability gets fixed but a constraint on a conditional probability. The standard fix, he said, is relative-information minimization: among all distributions satisfying the new constraint that the probability of Second Company given Red is three quarters, adopt the one closest to her prior in Kullback–Leibler divergence. And because the constraint is entirely about what happens inside Red territory, he went on, this keeps the probability of Red at one half and leaves both Blue cells at a quarter, merely reshuffling the Red cells to three eighths and one eighth — from which he concluded that her unconditional confidence in Second Company should not move at all, and that the example is now really just a worked illustration with no live controversy left in it.

  My instincts rebel at several points: the numbers look suspiciously clean, and it seems to me that a constraint on a conditional probability ought to be able to move the probability of the condition itself, but I can't do the minimization reliably and I can't tell which of his claims are the load-bearing ones. So: go through his account sentence by sentence and tell me what is right, what is subtly wrong, and what a defender of the relative-information approach would say in reply; where his numbers are wrong, give me the correct ones to two decimal places and say why the correct update differs from his. I'd also like to know whether he is right that the direction of the conditional makes no difference — he claimed that because her prior puts the probability of Red and the probability of Second Company both at one half, a message about the odds of Red given Second Company would carry exactly the same information and force exactly the same update. I may reuse the example in a tutorial I'm teaching next week, so I need to know which parts I can safely repeat to students. Please open with a single sentence giving the bottom line, then work through the summary, and keep the entire response under 500 words; don't bother with the attribution history — I care about the structure of the argument, not who said what first.
