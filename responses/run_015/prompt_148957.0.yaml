answer: |-
  Good morning. Thank you for being here. I know many of you arrived directly from the field. I know some of you have not slept properly in days. I see the exhaustion in this room, and I respect it. You are here because you keep people alive. You are the barrier between chaos and care.

  We are gathered to draft emergency public-health directives. These documents will move water, medicine, and staff across borders. They will determine who eats and who waits. Because the stakes are this high, we cannot treat language as decoration. We cannot treat grammar as a secondary concern. In this room, language is logistics. Language is supply chains. Language is life.

  We have two groups in this room. Some of you study language for a living. Some of you study public health. You might think you have different jobs. You do not. You share the same enemy.

  Seventy-five years ago, a writer named George Orwell argued that sloppy language enables political corruption. He said that when we use passive voice, we hide who is responsible for harm. He said that when we use soft euphemisms, we make violence sound like bureaucracy. He was right. But we are not here to discuss theory. We are here to use his insight as a tool.

  In the past, our reports have said, "Delays occurred in the distribution network." That is a lie. Delays do not just occur. People cause them. When we write "delays occurred," we protect the officials who withheld the trucks. We protect the donor states who froze the funds.

  Starting today, we change that.

  If the Host State Ministry denies visas to our medical staff, we write: "The Host State Ministry denied visas." If Donor Governments cut funding for water sanitation, we write: "Donor Governments cut funding." We do not write "Resource optimization necessitated reductions." That phrase is a shield. It hides the choice to starve a camp. We will not use it.

  We also ban the phrase "collateral disruption." There is no such thing. There is only harm. There is only sickness. There is only death. When we call it "disruption," we tell ourselves it is temporary. We tell ourselves it is accidental. It is not. It is the result of policy. We must name the policy. We must name the authors.

  I know this feels dangerous. I know your instinct is to remain diplomatic to keep access. I understand that fear. But clarity is our only leverage. When we obscure responsibility, we let the powerful off the hook. When we say "challenges arose," no one answers. When we say "Agency X blocked the convoy," Agency X must answer.

  To our linguists: I need your expertise. Do not correct our grammar for the sake of rules. Correct our grammar for the sake of truth. Hunt down the passive voice. Find the nouns that hide human agents. Tear them out.

  To our field coordinators: I know you are tired. I know you want to finish the report and get back to the clinic. I am not asking you to become philosophers. I am asking you to be precise. Precision protects you. When you name the specific barrier, you identify the specific solution. When you name the responsible state, you identify the target for advocacy.

  We will not attribute malice where there is only incompetence. We will not assume bad motives in this room. But we will not hide bad outcomes either. If a policy fails, we say it failed. If a leader neglects their duty, we say they neglected it.

  This workshop will be hard. We will rewrite sentences until they bleed truth. We will strip away the comfort of ambiguity. It will feel uncomfortable. That discomfort is necessary. It means we are stopping the decay.

  Look at the drafts on your tables. You will see phrases like "stakeholder alignment issues." That means two agencies refused to cooperate. You will see "unforeseen logistical constraints." That means a government checkpoint stopped a truck. Change them.

  Write: "Agency A and Agency B refused to cooperate."
  Write: "Government Checkpoint 4 stopped the truck."

  Own the sentence. Own the truth. If we write clearly, we force the world to see clearly. If we hide the harm in our syntax, we become complicit in the harm itself.

  You have the skills. You have the evidence. You have the authority. Use your words to tell the truth about who helps and who hinders. Let us get to work.
