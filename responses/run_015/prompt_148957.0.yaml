      *   *Tone:* Sustain practitioners. Don't blame them for using bad language (they are exhausted), but empower them to change it.
      *   *Orwell Reference:* Make it intelligible. "A writer named Orwell argued..." Keep it simple. "Bad language hides bad actions."

  5.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too preachy?
