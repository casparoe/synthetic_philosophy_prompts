      *   *Critique:* Time limit.
      *   *Fix:* Keep it tight. ~800 words.

  6.  **Final Polish:**
      *   Check American English spelling (program, center, etc.).
      *   Ensure the opening is direct.
      *   Verify the "no preface" constraint.

  7.  **Final Review against constraints:**
      *   5 minutes? (Yes, approx 750-850 words).
