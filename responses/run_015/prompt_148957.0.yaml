prompt: |-
  Please write the opening remarks for a workshop attended by senior translators and field coordinators who draft emergency public-health directives in refugee camps. The audience is split: roughly half are applied linguists familiar with George Orwell's argument that decayed language—especially passive constructions and prefabricated phrases—both signals and enables political corruption by letting speakers avoid owning the harm embedded in policy; the other half are exhausted public-health practitioners with no philosophical training. The remarks should run about five minutes and must do real structural work with Orwell's idea: avoid passive voice when describing failures of aid distribution, reject euphemisms such as "collateral disruption" or "resource optimization," and explicitly name the agencies and states responsible for specific harms. At the same time, the tone must orient and sustain practitioners rather than lecture them, and it must not attribute false motives to anyone in the room. Because the audience includes both experts and non-experts, every philosophical reference should be immediately intelligible to the practitioners without being patronizing to the linguists. Begin the response with the remarks themselves, with no preface, commentary, or explanation of structure. Write in American English.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Task:** Write opening remarks for a workshop.
      *   **Audience:** Senior translators and field coordinators drafting emergency public-health directives in refugee camps.
      *   **Audience Split:**
          *   50% Applied Linguists (familiar with Orwell's "Politics and the English Language," specifically the link between decayed language/passive voice and political corruption/harm avoidance).
          *   50% Exhausted Public-Health Practitioners (no philosophical training, practical focus).
      *   **Duration:** About 5 minutes (roughly 750-900 words spoken at a normal pace).
      *   **Key Constraints:**
          *   Do real structural work with Orwell's idea (avoid passive voice for aid failures, reject euphemisms like "collateral disruption," name responsible agencies/states).
          *   Tone: Orient and sustain practitioners (not lecture them), do not attribute false motives to anyone in the room.
          *   Accessibility: Philosophical references must be intelligible to practitioners without patronizing linguists.
          *   Format: Begin with the remarks themselves, no preface/commentary.
          *   Language: American English.

  2.  **Determine the Tone and Voice:**
      *   **Tone:** Urgent, respectful, collaborative, grounded, clear. Not academic, not bureaucratic.
      *   **Voice:** A facilitator or lead coordinator who understands both the linguistic theory and the field reality.
      *   **Strategy:** Bridge the gap between theory and practice by showing *how* language saves lives directly, rather than debating *why* it matters abstractly. Use Orwell's ideas as tools, not trophies.

  3.  **Drafting - Section by Section:**

      *   **Opening (Welcome & Acknowledgment):** Acknowledge the exhaustion. Validate the hard work. Set the stakes immediately.
      *   **The Problem (Language & Harm):** Introduce the Orwellian concept without naming him explicitly or getting bogged down in theory. Focus on the *effect* of language. Passive voice = hiding responsibility. Euphemisms = hiding pain.
      *   **The Commitment (Structural Work):** Explicitly state the rules for this workshop. No passive voice when things go wrong. No euphemisms. Name names.
      *   **The Bridge (Connecting Linguists & Practitioners):** Show how the linguists' expertise serves the practitioners' goals. It's not about grammar; it's about accountability.
      *   **Closing (Call to Action):** Reiterate the goal. Clear directives save lives. Let's get to work.

  4.  **Drafting - Specific Constraints Check:**
