      *   Key Insight: Nozick's side-constraints are *agent-relative* restrictions based on the *patient's* status. Moving the status to an abstract "ecosystem" turns the constraint into an *agent-neutral* goal (maintain the ecosystem). This is a category error in deontological logic.

