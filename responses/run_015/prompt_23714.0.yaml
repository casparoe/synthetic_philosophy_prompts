  2.  **Deconstruct Core Question 1: Arrow vs. Gibbard–Satterthwaite:**
      *   *Arrow's Theorem:* Deals with *Social Welfare Functions* (SWF). Input: Profile of ordinal rankings. Output: A complete social ranking. Conditions: Unrestricted Domain, Pareto, IIA, Non-dictatorship. Result: Impossible for $|A| \ge 3$.
      *   *Gibbard–Satterthwaite:* Deals with *Social Choice Functions* (SCF). Input: Profile of ordinal rankings. Output: A single winner. Conditions: Unrestricted Domain, Surjectivity (onto), Strategy-proofness, Non-dictatorship. Result: Impossible for $|A| \ge 3$.
      *   *Relationship:* They are deeply connected but distinct.
          *   Arrow is about aggregating preferences into a *ranking*.
          *   G-S is about aggregating preferences into a *winner* without lying.
          *   *Connection:* If you have a strategy-proof SCF, you can often construct an SWF that satisfies Arrow's conditions (specifically IIA). Conversely, if Arrow's conditions hold, you can often derive strategy-proofness.
          *   *Equivalence:* Under the assumption of Pareto efficiency, IIA (Arrow) and Strategy-proofness (G-S) are closely linked for resolute (single-winner) functions. Specifically, a social choice function is strategy-proof and onto if and only if it is dictatorial (G-S). Arrow says a social welfare function is Paretian and IIA if and only if it is dictatorial.
          *   *Direction:* G-S is often viewed as the "voting" version of Arrow. One can derive G-S from Arrow (with some work) and Arrow from G-S (with some work). They are essentially two sides of the same coin, but G-S is more direct for "picking a winner."
      *   *Key Distinction:* Arrow = Ranking output. G-S = Single winner output + Strategic manipulation focus.

  3.  **Deconstruct Core Question 2: Practical Application (Single-Peakedness):**
      *   *Context:* ~5 candidates, quarterly, "safe vs. risky" axis.
      *   *Single-Peaked Preferences:* This is the "Black's Median Voter Theorem" territory.
      *   *Theorem:* If preferences are single-peaked on a one-dimensional spectrum, Majority Rule is strategy-proof (mostly), Condorcet consistent, and avoids cycling.
      *   *Caveat:* It requires the axis to be agreed upon and the preferences to actually be single-peaked. If someone prefers "Risky" and "Safe" but hates "Medium," single-peakedness breaks.
      *   *Small Group Dynamics:* Formal voting often breaks down in very small teams (5-10 people). Consensus or discussion often works better than rigid mechanisms.
      *   *Recommendation:* Don't over-engineer. Use a method that fits the culture. Score voting or Approval voting might be robust enough without being complex.

