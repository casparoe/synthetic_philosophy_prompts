          *   Address the "Equivalence" question: Yes, under Pareto, IIA $\approx$ Strategy-proofness for single-winner rules. G-S is generally considered the more "practical" impossibility for voting, while Arrow is more "theoretical" for welfare economics. Neither is strictly "stronger," they cover different output types.
