answer: |-
  It is completely reasonable that you find these two theorems confusing. Even in political science and economics departments, the relationship between Arrow's Impossibility Theorem and the Gibbard–Satterthwaite (G-S) Theorem is often a source of head-scratching. They feel like the same result because, in a very deep sense, **they are two sides of the same coin.**

  Since you're an engineer, I'll frame this in terms of API contracts: Input, Output, and Constraints.

  ### Part 1: Arrow vs. Gibbard–Satterthwaite

  You are correct that the main technical difference is the **Output Type**.

  1.  **Arrow's Theorem (The Ranking Problem)**
      *   **Input:** A list of every voter's ranked preferences (A > B > C).
      *   **Output:** A **complete social ranking** (The "Group" prefers A > B > C).
      *   **The Constraint:** Independence of Irrelevant Alternatives (IIA). This means the group's ranking of A vs. B shouldn't change just because C dropped out.
      *   **The Result:** You cannot produce a consistent group ranking without a dictator.

  2.  **Gibbard–Satterthwaite (The Winner Problem)**
      *   **Input:** A list of every voter's ranked preferences.
      *   **Output:** A **single winner** (Feature A is built).
      *   **The Constraint:** Strategy-proofness. This means no voter should be able to get a better outcome by lying about their preferences.
      *   **The Result:** You cannot pick a single winner without a dictator (or restricting the domain).

  **Are they the same?**
  Functionally, yes. Conceptually, they attack the same vulnerability from different angles.
  *   If you have a mechanism that picks a single winner (G-S) and you try to extend it to create a full ranking (by picking a winner, removing them, picking the next winner, etc.), you run into Arrow's IIA violation.
  *   If you have a mechanism that creates a full ranking (Arrow), the top of that ranking is your "winner." If that mechanism satisfies IIA, it turns out it is vulnerable to strategic manipulation (G-S).

  **Regarding your specific question on equivalence:**
  You asked: *"Under Pareto efficiency, are IIA and strategy-proofness equivalent?"*
  For **single-winner voting rules** (Social Choice Functions), **yes, they are effectively equivalent in power.**
  *   If a voting rule is Strategy-Proof and Onto (every candidate can win), it essentially satisfies a version of IIA.
  *   If a voting rule satisfies IIA and Pareto, it is generally vulnerable to manipulation unless it is dictatorial.

  **Which is "stronger"?**
  Gibbard–Satterthwaite is often considered the "stronger" result for *voting* specifically because it doesn't require the output to be a full ranking. It says even if you just want to pick *one* thing, you still can't do it fairly if people are strategic. Arrow requires the heavier lift of producing a full order. However, mathematically, you can derive one from the other. They are mutually reinforcing impossibility results.

  **The Loophole:** Both theorems rely on the assumption of an **Unrestricted Domain**. This means the theorems assume voters can have *any* possible preference order (e.g., A > B > C, or A > C > B, or C > A > B, etc.). If you can restrict the *types* of preferences people are allowed to have, the theorems no longer apply.

  ---

  ### Part 2: Your Specific Case (Single-Peakedness)

  This is the most important part for you. You mentioned: *"preferences look roughly single-peaked along a 'safe incremental change vs. risky big bet' axis."*

  **Your intuition is correct.** This is the classic "escape hatch" for Arrow and G-S.

  In social choice theory, this is known as **Black's Median Voter Theorem**.
  *   **The Condition:** If all voters' preferences are **single-peaked** on a one-dimensional spectrum (e.g., 1 to 10 on the Risk Scale), then...
  *   **The Result:** Simple **Majority Rule** is strategy-proof, efficient, and produces a stable winner (the median preference). There will be no "voting cycles" (A beats B, B beats C, C beats A), and no one benefits from lying.

  **Why does this work?**
  Imagine the risk spectrum is a line from 0 (Safe) to 10 (Risky).
  *   Engineer 1 wants 2.
  *   Engineer 2 wants 5.
  *   Engineer 3 wants 9.
  *   The Median is 5.
  *   If Engineer 1 lies and says they want 0, the median doesn't move. If they say they want 4, the median might move to 4 (worse for them). Truth-telling is the best strategy.

  **The Catch (Engineering Reality Check):**
  Theorem guarantees only hold if the preferences are *actually* single-peaked.
  *   **Real Risk:** Someone might prefer "Safe" (2) and "Risky" (9), but hate "Medium" (5) because medium efforts often fail without the safety net or the high reward. That creates a "double-peaked" preference, breaking the theorem.
  *   **Multi-dimensional Risk:** Is it just risk? Or is it "Risk" vs. "Tech Debt" vs. "Customer Visibility"? If the decision is 2D or 3D, single-peakedness usually collapses, and you are back in Impossibility Territory.

  **Verdict:** If you can genuinely frame the quarterly choices along a single axis that everyone agrees on, **Majority Rule is mathematically safe from gaming.**

  ---

  ### Part 3: Practical Advice for a Small Team

  You asked: *"What do people actually do in small-group settings like ours?"*

  In teams of ~5 to ~15 engineers, formal voting mechanisms often introduce more friction than they solve. The "Impossibility" theorems assume strangers trying to aggregate preferences without communication. Your team talks to each other.

  Here is the pragmatic hierarchy of what works in engineering teams:

  **1. Consensus with a Fallback (Best for < 10 people)**
  *   **Mechanism:** Discuss the 5 candidates. Try to agree on the best one. If you are stuck between two, *then* vote.
  *   **Why:** Discussion aligns preferences. It often turns "double-peaked" preferences into "single-peaked" ones as people understand the trade-offs better.
  *   **Risk:** The "loudest person" problem.
  *   **Mitigation:** Have a facilitator who speaks last. Use "round-robin" speaking so juniors speak before seniors.

  **2. Approval Voting (Robust & Simple)**
  *   **Mechanism:** Each voter can vote "Yes" or "No" on *every* candidate. The candidate with the most "Yes" votes wins.
  *   **Why:** It is much harder to game than Plurality (pick one). It allows you to say "I like A and B, but A is better." It naturally handles the "safe vs. risky" axis without requiring you to define the axis explicitly.
  *   **Strategy-proofness:** It is not perfectly strategy-proof, but it is very resistant to tactical voting in small groups.

  **3. Score Voting (0-5 Stars)**
  *   **Mechanism:** Rate every candidate 0-5. Highest average wins.
  *   **Why:** Captures intensity of preference. (e.g., "I mildly prefer A, but I hate B").
  *   **Risk:** People might vote 5 for their favorite and 0 for everything else (maximal strategizing).
  *   **Mitigation:** In a small, high-trust team, social pressure usually keeps people honest on scores.

  **My Recommendation:**
  Don't over-engineer the voting mechanism. The "Impossibility Theorems" bite hardest when you have large populations, secret ballots, and high stakes where lying is profitable. In a quarterly team planning meeting:

  1.  **Define the Axis:** Explicitly state: "We are choosing based on Risk vs. Stability." If someone cares about something else (e.g., "Resume Driven Development"), call it out.
  2.  **Use Approval Voting:** It's the best balance of simplicity and resistance to gaming. "Vote for any feature you think is worth doing."
  3.  **Discuss First:** Spend 80% of the time discussing the candidates and 20% voting. The discussion reduces the "preference aggregation" problem by aligning the team's mental models.

  **Summary:**
  *   **Arrow vs. G-S:** They are siblings. Arrow bans fair rankings; G-S bans fair winners. For your purpose (picking a winner), G-S is the relevant one.
  *   **Theorems Biting?** No, not if your preferences are truly single-peaked. Majority rule works fine there.
  *   **Practical Move:** Use **Approval Voting** after a structured discussion. It's "good enough," hard to game, and doesn't require a PhD to explain to the team.
