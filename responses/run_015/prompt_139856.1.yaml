  7.  **Addressing the Brother-in-Law (BIL):**
      *   He works in employment services (sees the system).
      *   He votes Conservative (values responsibility).
      *   He is "decent" (doesn't think claimants are scum).
      *   *Diagnosis:* He likely holds a mix of **Solidarity Maintenance** and **Paternalism**, perhaps with a dash of **Screening**. He probably doesn't hold the **Forfeiture** view (too cruel) or the **Deterrence** view (too cynical). He likely underestimates the **Compliance Cost Asymmetry**.

