          *   *Application:*
              *   Screening (b): Needs *some* shirking to justify the cost of screening. If shirking is rare, the screening cost outweighs the saving.
              *   Deterrence (c): Needs a belief in latent claimants.
              *   Desert (e): Doesn't depend on rates, depends on principle.
