answer: |-
  This is a strong framework. You are correct that the slogan's rhetorical power relies on its ambiguity; it allows the speaker to occupy the moral high ground of *paternalism* (we want you to succeed) while implementing the machinery of *deterrence* (we want you to suffer if you don't comply).

  Below is the menu of readings, refined from your list. I have collapsed your contributory reading (a) because, as you noted, it is category-incompatible with means-tested conditionality. I have sharpened the remaining five into distinct justificatory models. For each, I apply your **Compliance Cost Asymmetry (CCA)** test and the **Fraud/Error** test, then deliver a verdict on whether it justifies the *actual* regime (sanctions, digital-by-default, weekly signing) or merely a theoretical shadow of it.

  ### 1. The Screening Model (Information Asymmetry)
  **The Claim:** The state cannot distinguish between the unable and the unwilling. Activity requirements act as a signaling mechanism. Only those genuinely desperate will endure the hassle; the work-shy will self-select out. The "hand up" is the job; the "handout" is the benefit claimed without this test.
  *   **Truth/Contention:** Economically coherent, but empirically fragile. It assumes the "cost" of compliance is correlated with willingness to work, rather than capacity to comply.
  *   **CCA Test:** **Fatal.** This is the critical failure point. If the cost of compliance (travel, forms, rigid scheduling) is higher for the chaotic/precarious (mental health, caring duties) than for the stable "work-shy," the screen selects *against* the needy and *for* the privileged shirker. Your friend's sanction is not a calibration error here; it is a systemic false positive that invalidates the screen's logic.
  *   **Fraud Test:** Requires a non-trivial population of "shirkers." If the population of able-bodied non-workers is small, the administrative cost of screening exceeds the savings from catching them. It does not require *fraud* (lying), but it does require *shirking* (choosing leisure over labour).
  *   **Verdict on Regime:** Justifies *some* conditionality, but not *current* conditionality. A valid screen must be calibrated so the cost is bearable for the true needy. A regime that sanctions for missed appointments due to care breakdowns fails its own logic.

  ### 2. The Paternalist Model (Capability & Habituation)
  **The Claim:** Unemployment causes skill atrophy and psychological harm. Conditionality is therapeutic. The "hand up" is the restoration of routine and purpose. Sanctions are negative reinforcement to break the inertia of idleness.
  *   **Truth/Contention:** Contested. Evidence suggests forced activity without genuine job prospects can harm mental health and reduce employability (scarring). It conflicts with liberal neutrality (the state imposing a specific conception of the good life).
  *   **CCA Test:** **Undermining.** If the compliance burden induces anxiety, destabilises housing, or consumes time needed for job search/caring, it actively reduces capability. If the "medicine" worsens the condition, the paternalist justification collapses. It suggests the regime should be supportive, not punitive.
  *   **Fraud Test:** **Irrelevant.** This reading does not depend on claimant dishonesty. It depends on the claimant's *behavioral* state. Even an honest claimant needs "fixing" under this view.
  *   **Verdict on Regime:** Justifies *support*, not *sanctions*. You can nudge without starving. A regime that removes income entirely contradicts the goal of stabilising the claimant's life to make them employable.

  ### 3. The Solidarity Model (Political Feasibility)
  **The Claim:** Welfare is a reciprocal pool. Contributors (taxpayers) will only consent to redistribution if they perceive recipients as making an effort. Conditionality is the visible proof of effort required to maintain public support for the welfare state. "Hand up" means "contributing back"; "handout" means "taking without giving."
  *   **Truth/Contention:** Sociologically robust. Public support does correlate with perceived deservingness. However, it risks pandering to misperceptions rather than leading on justice.
  *   **CCA Test:** **Calibration Point.** If the compliance burden becomes too visible (e.g., food bank usage rises alongside sanctions), it may erode solidarity rather than protect it. The asymmetry matters only insofar as it generates political backlash.
  *   **Fraud Test:** **Depends on Perception, Not Reality.** This reading runs on the *belief* that fraud/shirking is high. If the public *believes* fraud is 20%, the regime is justified politically even if fraud is 1%. Correcting the statistics might not change the policy if the perception remains.
  *   **Verdict on Regime:** Justifies *visibility* of activity, not necessarily *severity* of sanctions. However, it explains why the regime is harsher than economic logic dictates: it is performing for the taxpayer, not helping the claimant.

  ### 4. The Deterrence Model (Budget Containment)
  **The Claim:** Welfare creates a moral hazard (disincentive to work). Benefits must be less desirable than the lowest wage to ensure labour supply. Conditionality and sanctions make claiming unpleasant enough to push people into work or off the roll. "Hand up" is a euphemism for "push."
  *   **Truth/Contention:** Cynical but internally consistent. Often denied by politicians but evident in policy design (less eligibility).
  *   **CCA Test:** **Feature, Not Bug.** The asymmetry is acceptable here. If the goal is to reduce take-up, it does not matter if the burden falls hardest on the precarious; indeed, if they drop off the roll, the budget saves money.
  *   **Fraud Test:** **Low Relevance.** This is about *entitlement*, not *dishonesty*. It applies even to people fully entitled to benefits. It assumes the "honest" claimant is still a potential economic risk if not deterred.
  *   **Verdict on Regime:** Fully justifies the *actual* regime. This is the only reading that logically supports harsh sanctions for minor non-compliance. However, it is rarely admitted explicitly because it is politically toxic.

  ### 5. The Desert Model (Moral Forfeiture)
  **The Claim:** Economic need is not sufficient for a claim. One must be morally "deserving." Failure to comply indicates a moral failing that forfeits the right to support. "Handout" is morally degrading; "Hand up" is conditional on moral rectitude.
  *   **Truth/Contention:** Deeply contentious in political philosophy. Conflicts with human rights frameworks and the concept of social citizenship.
  *   **CCA Test:** **Irrelevant.** Hardship is not a bug; it is the consequence of forfeiture. The chaos of the claimant's life is viewed as evidence of the moral failing that necessitates the sanction.
  *   **Fraud Test:** **High Relevance.** Often conflates error with moral failing. Administrative errors are treated as evidence of dishonesty or incompetence, reinforcing the "undeserving" label.
  *   **Verdict on Regime:** Justifies the *actual* regime. It supports the punitive nature of sanctions. However, like Deterrence, it is rarely stated openly in secular policy discourse.

  ---

  ### The Fraud & Error Variable
  You asked which readings need a high deliberate-fraud rate.
  *   **Screening (1)** needs a high *shirking* rate to be cost-effective, but not necessarily fraud.
  *   **Solidarity (3)** needs a high *perceived* fraud rate.
  *   **Desert (5)** often relies on conflating error with fraud to identify the "undeserving."
  *   **Paternalism (2)** and **Deterrence (4)** do not require fraud to function; they operate on behavior and entitlement respectively.

  **The Crucial Point for your BIL:** If the deliberate fraud rate is low (as data suggests, typically <1-2%), the **Screening** model becomes economically inefficient (spending £5 to save £1), and the **Solidarity** model becomes manipulative (sustaining a myth to keep funding). If he accepts the low fraud stats, he must retreat to Paternalism or Solidarity. If he stays with Deterrence or Desert, he admits the policy is not about fraud at all.

  ---

  ### Diagnosis: What your Brother-in-Law Likely Means
  Given that he works in employment services (sees the bureaucracy) and is a "decent" person (doesn't view claimants as scum), he is almost certainly operating on a hybrid of **Reading 2 (Paternalism)** and **Reading 3 (Solidarity)**, with a blind spot regarding the **Compliance Cost Asymmetry**.

  He likely believes:
  1.  **Paternalism:** Structure helps people. He sees people who *could* work but are stuck in a rut. He views the "hand up" as genuine activation.
  2.  **Solidarity:** He knows the public mood. He believes that without visible conditionality, the welfare state would be dismantled by the right. He sees sanctions as a necessary "teeth" to keep the system alive.

  **Where he is vulnerable:**
  He is likely treating the **Compliance Cost Asymmetry** as a calibration issue ("we should help them get to the appointment") rather than a structural flaw ("the requirement itself excludes the most vulnerable"). He assumes the "cost" of compliance is uniform. Your friend's sanction (care package failure) is the counter-example he needs. In the **Paternalist** reading, sanctioning someone for a care failure is counter-productive (adds stress). In the **Solidarity** reading, it risks public backlash if known. In the **Screening** reading, it is a false positive.

  **The Move:**
  Don't argue about fraud rates; he will dismiss them as "what gets measured." Argue from the **Paternalist** angle using the **CCA**. Ask him: *"If the goal is to help people stabilize enough to work, how does removing income when their care package fails achieve that? Is that a hand up, or is it pushing someone who is already stumbling?"* This forces him to choose between his decency and the regime's mechanics.
