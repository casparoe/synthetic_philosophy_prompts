      *   **Specific Constraints:**
          *   Do not explain basic concepts (workfare, conditionality).
          *   Do not cite literature (user has that).
          *   Use the user's existing list (a-f) as a base but refine/critique it.
          *   **Add Two Specific Things:**
              1.  Apply the "Compliance Cost Asymmetry" test to each reading (does it undermine the theory or just suggest calibration?).
              2.  Apply the "Fraud/Error Rate" test to each reading (does the theory require high fraud to function?).
          *   **Output Format:** Numbered readings with verdicts.
          *   **Ending:** A note on which reading the brother-in-law (BIL) likely holds (assuming he's decent).

  2.  **Deconstruct the User's List (a-f):**
      *   *(a) Reciprocity/Insurance:* Contributory principle. *Critique:* User is right, this doesn't justify means-tested sanctions.
      *   *(b) Screening:* Separating needy from work-shy. *Critique:* Standard economic signaling model.
      *   *(c) Deterrence:* Discouraging take-up. *Critique:* Often implicit, rarely explicit.
      *   *(d) Paternalist/Transformation:* Work is good for *you*. *Critique:* Perfectionist liberalism vs. neutrality.
      *   *(e) Desert:* Undeserving forfeit claims. *Critique:* Moralistic, retributive.
      *   *(f) Political-Feasibility:* Solidarity requires reciprocity. *Critique:* Sociological/Realpolitik.

      *Refinement:* I need to keep these but sharpen the connection to the "Hand Up" slogan. "Hand Up" implies agency and improvement, which leans heavily into (d) and (b), whereas "Handout" implies passivity (e). I should organize them logically from "Soft/Procedural" to "Hard/Moral."

  3.  **Address the Two Specific Additions:**

      *   **Compliance Cost Asymmetry (CCA):**
          *   *Concept:* Administrative burden hits the vulnerable hardest.
          *   *Application:*
              *   Screening (b): If the cost is too high for the *genuinely* needy but manageable for the *shy*, the test fails (adverse selection).
              *   Paternalism (d): If the stress harms mental health, it contradicts the "good for you" claim.
              *   Feasibility (f): If it creates visible hardship, it might undermine solidarity rather than sustain it.
              *   Desert (e): Doesn't care; hardship is the point.

      *   **Fraud/Error Rates:**
