      *   **Concern 3: Collapsing into Belief-Desire Psychology.**
          *   *Risk:* "Entertaining a narrative trajectory" sounds like "hoping" or "believing."
          *   *Differentiation:* Belief-desire is about *propositional attitudes* toward the world. Counterfactual framing is about the *mode of access* to the world. It's about *how* the scene is parsed, not just *what* you want to happen.
