      *   *Synthesis:* What do people *mean*? Usually a mix of A and C, often sliding into D.
      *   *Where Intention Matters:* Gricean meaning, some illocutionary types (betting? promising?), sincerity conditions (as distinct from act performance).
      *   *Test Case:* Need something where Intention and Uptake and Convention diverge.
          *   *Idea:* An actor on stage saying "I promise."
          *   *Idea:* A parrot saying "I promise."
          *   *Idea:* Coercion. "I promise or I shoot you."
          *   *Better Idea:* The "Accidental Performative." I say "I name this ship..." as a joke, but the Queen is there and accepts it. Did I name it?
          *   *Best Idea for TA:* The "Secret Intention" case. I say "I bet you $5" intending it as a joke, you take it seriously. Is it a bet? (Separates Uptake vs. Intention).

  7.  **Review against Constraints:**
      *   *Slow down?* Yes, show the thinking in the structure.
