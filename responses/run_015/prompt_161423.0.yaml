  Unaware of coming frost.
  He rested warm at home.
  Her hand left off the valve.
  From me there came just nothing.
  She had already signed the log.

  The ink dried on the log.
  Dark settled on the night.
  My hands could do just nothing.
  White crept across with frost.
  Rust held fast the valve.
  He was safe enough at home.

  Warmth waited for him home.
  Because of that signed log.
  No hand turned round the valve.
  Through the freezing night.
  Under the white frost.
  From out my sleep came only nothing.

  To me it counted simply nothing.
  For him it meant safe home.
  For her the biting frost.
  Bound tightly by the log.
  Lost within the night.
  Stuck silent at the valve.

  She failed to turn the valve.
  I could offer simply nothing.
  One person owns the night.
  One person stays at home.
  One person signs the log.
  One person fears the frost.

  The frost burst pipes because she missed the valve,
  While I knew nothing, sleeping through the night;
  She wrote the log, and sent him home.

  ***

  I dropped the snow-blockage variant (your fourth move) to preserve rhythmic clarity; the poem hinges on the second and third structures (prevention of prevention vs. bare omission). The most contested ground is the claim that Nell's signing the log causally weights her subsequent omission. Omission sceptics deny absences can be causes at all, arguing only the positive act (signing) matters. I am 80% confident a causation specialist will accept the preemption structure as faithfully rendered, though they may dispute the metaphysical implication that the omission itself does work. The least sure point is the envoi's phrase 'missed the valve': it risks implying a positive failure rather than a non-action, but 'failed to turn' felt too prosaic. The backpacker's ignorance is the proxy for lacking normative expectation, which does the heavy lifting for the third structure.
