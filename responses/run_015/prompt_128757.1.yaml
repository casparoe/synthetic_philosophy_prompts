answer: |-
  **Mara:** You're missing the texture of the sequence. It's not about whether the agent could have done the *exact* opposite action in the *exact* same world. It's about whether there was a point in the causal chain where the path could have robustly branched.

  **Jules:** That sounds like you're just redefining "could have done otherwise" until it fits the counterexample. The whole point of the case is that the agent is responsible even though they couldn't have done otherwise. If you say, "Ah, but they could have done otherwise *in a way that triggers the intervener*," you're relying on a flicker. But is that flicker enough to ground responsibility?

  **Mara:** It is if the flicker is under the agent's control. Look, take the neural implant case. The implant is designed to suppress a harmful impulse, but it only activates *after* detecting the impulse onset. So, there's a window—maybe milliseconds—between the impulse arising and the suppression kicking in. If the agent acts on the impulse within that window, the implant stays dormant. The harm happens. Is the agent blameworthy?

  **Jules:** Intuitively, yes. But not because they could have avoided the harm. They couldn't. The implant would have caught them if they tried to stop, or—if the implant is there to ensure the harm—wait, your setup is the implant stops the harm.

  **Mara:** Right. The implant is a safety mechanism. It *would* have stopped the harm if the agent had shown signs of needing stopping. But the agent went through with it voluntarily. The implant stayed dormant because it wasn't needed.

  **Jules:** Okay, so the agent is responsible because they were the source of the action. The implant was irrelevant.

  **Mara:** Exactly. But why was it irrelevant? Because the agent had access to a robust branching point. They could have hesitated. They could have let the impulse rise without acting, which would have triggered the implant. The fact that they didn't take that branch—the fact that they sailed through the window without the safety net engaging—that's where the responsibility lies. It's not just logical possibility. It's a robust alternative sequence that was accessible.

  **Jules:** But here's the worry. You're saying the alternative has to be "robust." What does that mean? It means the agent has to have control over whether that branch is taken. If they have control over whether they hesitate or act, then you're not really relying on the alternative possibility anymore. You're relying on the fact that the actual sequence was under their control.

  **Mara:** I'm relying on both. You need the actual sequence to be yours, yes. But you also need the possibility of it *not* being yours in a meaningful way. If the only alternative is a flicker that doesn't lead to a different outcome, does it count? I say yes, provided that flicker is something the agent could have volitionally expanded.

  **Jules:** That's where I think you're smuggling in sourcehood conditions that are stricter than the original Principle of Alternative Possibilities ever was. The original principle just said: you need the ability to do otherwise. It didn't say the ability to do otherwise has to be "robust" or "under volitional control" in the way you're describing. If you require the alternative to be robust, you're basically saying the agent needs causal-history control. You're collapsing the leeway condition into the sourcehood condition.

  **Mara:** They aren't the same thing, Jules. Sourcehood is about where the action comes from. Alternatives are about the structure of the future relative to the agent. I can be the source of an action but still be trapped if there are no branches. Imagine I'm pushed. I'm the source of the motion of my body, but I couldn't have done otherwise. I'm not responsible. Now imagine the implant case. I'm the source, and there *was* a branch—I could have hesitated—but I didn't take it. The existence of that branch matters because it shows the world was open to me, even if the intervener would have closed it later.

  **Jules:** Okay, let's test that "robustness" requirement. Let's move away from the lone neurosurgeon case. Think about a collective agent. A board of directors. They're voting on a harmful policy. Say it's a ten-person board, and you need six votes to pass. The vote comes out seven to three. I'm one of the seven. I voted yes.

  **Mara:** Okay.

  **Jules:** Could I have done otherwise? Yes, I could have voted no. But would the outcome have changed? No. The policy passes six to four. So, regarding the *harmful outcome*, I had no alternative possibility. My vote made no difference to the result. If your robust branching condition applies here, I didn't have a robust branch. My branch didn't lead to a different outcome. So, am I responsible for the policy?

  **Mara:** Collective responsibility is messy. But intuitively, yes, you're responsible for your vote.

  **Jules:** But are you responsible for the *outcome*? If PAP applies to outcomes, you're off the hook. You couldn't have done otherwise *with respect to the outcome*. Now, apply your robustness condition. You said the branch has to be robust, it has to matter. In the board case, my branch doesn't matter. The outcome is overdetermined. So either your condition fails for groups—which means PAP isn't universal—or you have to say I'm not responsible for the outcome, which seems wrong. I participated in the harm.

  **Mara:** I'd say you're responsible for your contribution, not necessarily the whole outcome. But let's stick to the branching. You *did* have a branch. You could have voted no. That's a robust alternative action for *you*.

  **Jules:** But it's not a robust alternative for the *agency* involved. If we treat the board as the agent, the board couldn't have done otherwise. The vote was locked in by the other six. If PAP is supposed to track moral responsibility, and the board is responsible, but the board had no alternatives... then PAP fails for collective agents.

  **Mara:** Or it shows that collective agents have different conditions for responsibility than individuals. But that doesn't save the counterexample for individuals. Look, in your board case, the overdetermination is external to you. In the implant case, the constraint is internal to the scenario setup. The difference is access. In the board case, I know my vote doesn't change the outcome. In the implant case, the agent doesn't know the implant is there.

  **Jules:** Does epistemic access matter for metaphysical freedom?

  **Mara:** It matters for whether the branch is "robust" in the sense of being a live option. If I know my vote changes nothing, is it really a robust branch? Maybe not. But the agent with the implant doesn't know. To them, the branch is live.

  **Jules:** So now robustness depends on ignorance? That seems fragile. But let's go back to my main push. You're insisting on this robust branch to save PAP. But if the branch is robust—meaning under the agent's control and significant—then aren't you just describing a condition where the agent has full causal control? If they have full causal control, why do we need the alternative possibility at all? Why not just say "responsibility requires sourcehood"?

  **Mara:** Because sourcehood without alternatives is compatibility with determinism, and I'm not ready to concede that yet. I want to keep the leeway. I want to say that even if the actual sequence is determined, the *presence* of alternative possibilities is what makes the difference between a machine and an agent. A machine follows a track. An agent stands at a switch. Even if someone else owns the track, the fact that the agent's hand was on the switch matters.

  **Jules:** But in the Frankfurt case, someone else owns the switch too. They just didn't touch it.

  **Mara:** They owned the *backup* switch. The agent owned the *primary* switch. The robust branch is the moment the agent grips the primary switch. If they let go, the backup kicks in. The fact that the backup exists doesn't mean the agent didn't grip the primary one.

  **Jules:** I see what you're doing. You're trying to locate the freedom in the pre-intervention window. But if that window is determined by prior causes—neural impulses, environment, history—then the grip on the switch was inevitable too. The robustness is an illusion. You're just pushing the determinism back five milliseconds.

  **Mara:** Maybe. But ethics lives in those milliseconds. If I require that the agent could have initiated a different sequence, even if that sequence would have been intercepted, I preserve the intuition that responsibility requires openness. Without that openness, even if it's just a flicker, we're just watching a movie of a life that already happened.

  **Jules:** And I'm saying that if you make the flicker robust enough to matter, you've basically admitted that what matters is the actual sequence control, not the alternatives. You've saved the letter of PAP by killing its spirit. You're not defending alternative possibilities anymore; you're defending a specific kind of causal history.

  **Mara:** I think I'm defending the idea that causal history isn't enough unless it includes the capacity to diverge. Even if the divergence is blocked later, the capacity to initiate it is what makes me an agent.

  **Jules:** Then let's take the board again. I initiate a "no" vote. It diverges. It gets blocked by the other six votes. The outcome doesn't change. Did I exercise the capacity to diverge? Yes. Am I responsible for the outcome? That's the rub. Your robustness condition says I need a branch that leads somewhere. Here, my branch leads to the same place. So either I'm not responsible, or your condition doesn't apply.

  **Mara:** Maybe responsibility for the outcome requires a different principle than responsibility for the action.

  **Jules:** That sounds like you're retreating. First it was PAP for all responsibility. Now it's PAP for individual actions, but something else for collective outcomes.

  **Mara:** I'm not retreating. I'm distinguishing levels. The agent is responsible for the action because they had a robust branch at the level of their own volition. The board is responsible for the outcome because the *collective* had a robust branch. Individually, I might not have changed the outcome, but collectively, the board could have voted differently.

  **Jules:** But if the individual members are the only things that exist, where does the collective branch come from? It's just the sum of individual branches. If none of the individual branches were robust enough to change the outcome, how is the sum robust?

  **Mara:** Because the combination of votes creates a new causal power. But look, we're circling. You think my robustness condition collapses into sourcehood. I think sourcehood without robust alternatives is empty.

  **Jules:** And I think you're clinging to alternatives because you're afraid that if you let them go, you lose the ability to say "you could have done otherwise" in the moral sense.

  **Mara:** I am. Because if I couldn't have done otherwise, even in principle, then blame feels like revenge. It feels like punishing someone for being who they are.

  **Jules:** But if the "otherwise" is just a flicker that gets snuffed out by an implant or a majority vote, does it really save you from that?

  **Mara:** It saves the structure of the agency. It keeps the door open, even if something is standing in the doorway.

  **Jules:** I just worry you're decorating the door while the house is locked.

  **Mara:** Then I'll pick the lock. But I need the door to be there first.

  **Jules:** *(Sighs, leaning back)* Fine. But tomorrow, we're talking about whether the board members know about the vote count beforehand. Because if they don't, your epistemic condition might save the robustness after all.

  **Mara:** See? You do get it.

  **Jules:** I get that you're stubborn. Drink your coffee. It's cold.
