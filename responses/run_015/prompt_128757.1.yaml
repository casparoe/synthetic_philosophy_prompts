      *   *Case:* Agent has harmful impulse. Implant detects it. Implant *will* suppress it. Agent is blameworthy when implant stays dormant. This implies the agent *didn't* have the impulse? No, then no blame. This implies the agent *did* have the impulse but the implant didn't activate? That means the implant failed.
