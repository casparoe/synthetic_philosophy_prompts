  I want about eight to ten questions that actually dig into the mechanics, not just 'explain Confucianism to me.' Specifically I need:

  - one on how she handles xiao when the parent is abusive or absent — does the asymmetry just collapse?
  - one about modern non-biological caregiving (foster parents, maybe AI companions she mentions) and whether stretching li that far breaks the ritual structure
  - one comparing her view to care ethics — she thinks care ethics gets relationality right but misses ritual, and I want a follow-up keyed to her likely reply that ritual isn't performance, it's recognition
  - and one on role conflict: if every role-relation is its own normative world, how do we resolve being a loyal minister versus a filial son without sneaking in a universal principle?

  Please draft the questions in a conversational podcast tone. For each, include the follow-up that anticipates her standard reply. Write the whole thing in British English. (Also I misspelled 'interview' in my planning notes — don't fix it, just roll with the flow.)
