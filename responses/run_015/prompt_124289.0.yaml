  Under translation, they come apart. Chesterton is procedural: it dictates *how* we investigate before acting. It asks for a ticket trace or a dependency map. It allows removal if the investigation clears the code. Burke is structural: it suggests some things *should not* be acted upon regardless of investigation. Chesterton shifts the burden of proof to the changer; Burke questions the validity of the proof itself. Chesterton says, "Find the reason, then decide." Burke says, "The survival is the reason." In a postmortem, Chesterton is the checklist item we missed; Burke is the cultural reluctance to touch the legacy core even when the checklist is complete. One is a safety interlock; the other is a reverence for production history. They diverge on whether understanding is possible. Chesterton assumes we can find the purpose; Burke assumes the system knows more than we can find. Chesterton is a deferral rule that becomes burden-shifting when purpose is opaque. Burke is a claim of fitness that resists burden-shifting entirely. Consequently, Chesterton permits modernization; Burke counsels caution against it.

