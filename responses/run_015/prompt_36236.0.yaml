      *   *Correction on Q2:* The friend's argument about finite decomposability. I need to be clear: Lewisian worlds are *concrete*, but they are not *actual*. Physical constraints on *actual* matter don't apply to *possible* matter unless you define "concrete" as "actual physical stuff." I need to highlight this definitional battle.
