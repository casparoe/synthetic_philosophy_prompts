answer: |-
  It is a pleasure to address a colleague who understands that the lattice is the thing itself, not merely the arrangement of the parts. Your convenor's refusal to wear the standard badges ("endurantist," "perdurantist") is wise; those terms often obscure the specific criteria of identity actually being applied. She is a *particularist* about verdicts, which means she is likely a *principlist* about metaphysics. She does not start with a theory and apply it; she starts with intuitions about cases and infers the theory.

  You ask for the principle behind the seven rulings, their application to your migrating crystal, and a new experiment to test the resulting hypotheses. Here is an analysis based on the pattern of her judgments.

  ### I. Three Candidate Principles

  To reproduce her seven rulings, we must distill the criteria she uses to grant or deny identity. I propose three candidate rules. All three fit the first seven cases; they diverge only on your case of fission.

  **Rule 1: The Principle of Structural Continuity**
  *Identity persists through the total replacement of matter, provided the specific organizing principle (the "form") is maintained without interruption in space and time.*
  *   **Fits:** Cases 1 (Crystal growth), 2 (Human), 3 (Ship), 6 (Lump).
  *   **Excludes:** Case 7 (Dissolution breaks the lattice continuity); Case 4 (River diversion breaks the spatio-temporal path of the bed).
  *   **Status:** This is her primary condition for *Substances* (Crystals, Humans, Ships).

  **Rule 2: The Principle of Sortal Sensitivity**
  *Persistence conditions depend on the category of entity. "Substances" (Crystals, Humans, Ships, Lumps) are continuants governed by Rule 1. "Processes" (Rivers, Flames) are causal sequences; asking if they are "the same" is category mistake or loose speech.*
  *   **Fits:** Cases 4 & 5 (denied strict identity) vs. Cases 1, 2, 3 (granted strict identity).
  *   **Status:** This explains why she treats the pilot light differently from the crystal, despite both involving matter turnover.

  **Rule 3: The Principle of Uniqueness (No-Branching)**
  *Identity is a one-to-one relation. If a continuous path of structural organization splits into two equally viable candidates, the original entity ceases to exist. It cannot become two.*
  *   **Fits:** Case 3 (The reassembled ship is a *duplicate*, not the original, because identity cannot be shared; the continuous ship wins because it is the *unique* continuous path).
  *   **Status:** This is the hidden constraint. In Case 3, there was a competition between a continuous path and a reconstructed one. She chose the continuous path. But what if there are *two* continuous paths? Rule 1 alone cannot decide. Rule 3 is required to prevent logical contradiction (if A=B and A=C, then B=C, but the two ships are distinct).

  ### II. Application to the Migrating Crystal

  Your case introduces **fission**. The crystal migrates (Rule 1 satisfied) but then cleaves into two growing pieces, both preserving the lattice orientation.

  **Where the Rules Diverge:**
  *   **Rule 1 (Continuity)** suggests *both* daughters have a claim. Both are structurally continuous with the original.
  *   **Rule 3 (Uniqueness)** says they cannot *both* be the original.
  *   **Resolution:** We need to know if she prioritizes Uniqueness over Continuity when they conflict. Case 3 suggests she does: the reassembled ship had the "original matter" (a strong claim), but lost to the continuous ship. However, Case 3 did not force her to kill the original; it just forced her to pick *one* survivor. In your case, picking one is arbitrary unless there is an asymmetry.

  **The Verdicts:**

  1.  **Will she say either daughter is literally the crystal?**
      *   **Prediction:** **No.** Neither daughter is literally the original crystal.
      *   **Reasoning:** To say "Daughter A is the original" requires a non-arbitrary basis (e.g., size, trajectory). If none exists, asserting identity violates the logical grammar of "same." To say "Both are the original" violates the transitivity of identity. Given her systematic nature, she will likely rule that the original crystal **perished at the moment of cleavage**, and two new crystals came into existence, causally derived from the first.

  2.  **Perished or Continued in a Weaker Way?**
      *   **Prediction:** **Perished.**
      *   **Reasoning:** She was willing to call the river a "causal-historical sequence" rather than a persisting thing (Case 4). She may treat the post-cleavage relationship similarly: the *lineage* continues, but the *individual* does not. She distinguishes strictly between "same X" and "successor to X" (see Case 7: recrystallized material is a *new* crystal).

  3.  **How many crystals in the week before cleaving?**
      *   **Prediction:** **One.**
      *   **Reasoning:** Potentiality is not actuality. Until the cleavage plane propagates, there is a single continuous lattice. To say there were "two latent crystals" would contradict Case 1 (where a growing crystal remains one despite massive addition).

  ### III. Why This Is Not "Merely Verbal"

  You asked why seven confident rulings do not settle the dispute if it is merely verbal. The answer is that the first seven cases are **non-conflicting**. In Cases 1–3, Structural Continuity and Uniqueness point in the same direction. In Case 7, Structural Discontinuity dictates death.

  The dispute becomes non-verbal when principles conflict. In your case, Structural Continuity (both pieces inherit the lattice) conflicts with Uniqueness (one thing cannot become two).
  *   If she says "The larger piece is the original," she commits to a **Dominant Continuant** metaphysics (identity follows the bulk).
  *   If she says "Neither is the original," she commits to a **Logical Individuation** metaphysics (identity is a formal relation that breaks under fission).

  These are not definitions of the word "crystal"; they are ontological claims about whether objects are defined by their *history* or their *logic*. A verbal dispute would allow both answers to be "correct in different senses." Her systematicity suggests she believes only one is *true*.

  ### IV. The Decisive Test Case

  To separate the surviving candidates (Dominant Continuant vs. Logical Individuation), you need a case where fission occurs, but **asymmetry** is introduced.

  **The Proposal: The Asymmetric Cleavage**
  *   **Setup:** Prepare the migrating crystal as before. Induce cleavage such that **Fragment A** retains 99% of the mass and continues the original trajectory in the flow cell. **Fragment B** is a 1% sliver that detaches and settles on the cell floor. Both grow.
  *   **Question:** Is Fragment A the original crystal?

  **How it Separates the Rules:**
  1.  **If she says "Yes":** She holds a **Dominant Continuant** view. Identity follows the "main stream" of the causal process (analogous to the Ship of Theseus remaining the ship while planks are replaced). The 1% loss is akin to shedding a plank.
  2.  **If she says "No":** She holds a **Strict Individuation** view. Any fission, regardless of proportion, terminates the original individual. The original is essentially a *unique path*; a fork in the road ends the path, even if one fork is a highway and the other a footpath.

  **Why this works:**
  It forces her to weigh *Degree of Continuity* against *Logical Uniqueness*.
  *   In Case 3 (Ship), the continuous ship kept 100% of the *position/function* continuity, while the reassembled ship had 100% of the *matter* continuity. She chose Position/Function.
  *   In the Asymmetric Cleavage, Fragment A has 99% of the *matter* continuity and 100% of the *trajectory* continuity. Fragment B has 1% matter and broken trajectory.
  *   If she still says "No," she reveals that for her, **Fission is Death**, full stop. This would align her closely with the view that biological death (or crystal death) is the cessation of the *unique* history, not just the loss of function.

  **Chemist's Note:** To make this palatable, describe it as "inducing a preferential fracture plane via localized thermal shock." It ensures the split is clean and the mass ratio is measurable.

  ### Summary of Best Guess

  Your convenor is likely a **Sortal-Sensitive Endurantist with a No-Branching Constraint**.
  *   **Verdict:** The migrating crystal is one object. Upon cleavage, it ceases to exist. Two new crystals begin.
  *   **Reason:** She treats crystals as *Substances* (Case 1), not Processes (Case 4). Substances require unique identity. Fission destroys uniqueness.
  *   **Test:** The Asymmetric Cleavage. If she grants identity to the larger fragment, she is more pragmatic than logical. If she denies it, she is a rigorous metaphysician who places logic above intuition. Given her amusement at labels, I suspect she will deny identity to both, noting that "the crystal's history has bifurcated, and identity cannot."

  This should give you ample material for the next meeting. It respects her systematicity while pressing on the one point her previous rulings left underdetermined.
