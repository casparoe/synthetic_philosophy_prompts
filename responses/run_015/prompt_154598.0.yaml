answer: |-
  This is a genuinely sharp reconstruction of the Chase/Sanborn line, and your friend's reductio is the standard "global error" objection that usually gets raised against Dennett-style eliminativism. The reason you're still annoyed is that your friend's objection feels like a deflection, but it touches on a real vulnerability in the argument: **the leap from epistemic underdetermination to ontological indeterminacy.**

  You asked where it breaks and what the costs are. Since you want to hold onto (1) and (2) (the quality space framework and the access via judgment/discrimination), you are effectively committing to a form of **structuralism** or **functionalism** about phenomenology.

  Here is the breakdown of where the argument is vulnerable, the costs of each repair, and why your friend's reductio is less devastating than it feels.

  ---

  ### 1. The Friend's Reductio: Is it fatal?
  Your friend argues: *If this works for qualia, it works for colors, meanings, and preferences. Therefore, it's global skepticism.*

  **Why it might not be fatal:**
  *   **Quine would nod:** If your friend is worried about indeterminacy of meaning ("gavagai"), they are fighting Quine. Quine's point was precisely that there is *no fact of the matter* about meaning beyond behavioral dispositions. If your argument entails indeterminacy of meaning, you might just be in good company.
  *   **Phenomenal vs. Physical:** The argument targets *phenomenal* qualities (what it's like), not *physical* properties (surface reflectance). There is a determinate fact about the wall's reflectance profile. The indeterminacy applies only to the *mapping* of that physical state onto a quality space. Your friend is conflating the stimulus (public) with the sensation (private).
  *   **Preferences:** Revealed preference theory in economics actually accepts that if choices are inconsistent (intransitive), there is no stable utility function. We don't say "the utility function exists but is hidden"; we say the agent's preferences are undefined in that region.

  **Verdict:** Don't let the reductio scare you off unless you are committed to realism about meanings/preferences. If you are, you need to block the generalization. The best block is distinguishing **discriminative capacity** (biological/physical constraint) from **similarity judgment** (cognitive/report).

  ---

  ### 2. Attacking Step (3): The Metric Equivocation
  This is the most technical and promising place to break the chain without giving up (1) or (2).

  **The Move:** You conflate *discriminability* (JNDs, forced choice) with *rated similarity* (triadic comparisons, "which is more like which").
  *   **Discriminability** is governed by sensory noise and neural tuning. Psychophysically, this often yields a **Riemannian manifold**. It is locally Euclidean. It is metric. It is stable across contexts (mostly).
  *   **Rated Similarity** is cognitive. It is subject to Tversky-style context effects, asymmetry, and failure of the triangle inequality.

  **The Repair:** Restrict Premise (1) to **discriminative quality space**.
  If a sensory quality is defined by its location in a space generated by *discriminability thresholds* (what the system can physically tell apart), the space is much more rigid. The "family of incommensurable spaces" shrinks drastically. There is a fact of the matter about the neural tuning curves that ground the JNDs.

  **The Cost:**
  *   **Phenomenal Loss:** You are defining qualia by *capacity* rather than *character*. You risk turning "what it's like" into "what the system can do." This is a functionalist slide.
  *   **Violation of (2):** You have to admit that similarity *judgments* (reports) are not the primary access to the quality space; the discrimination performance is. This complicates the link between "what she says" and "what she experiences."

  ---

  ### 3. Attacking Step (4): Underdetermination $\neq$ Indeterminacy
  This is the philosophical crux. Your friend's second objection ("If 'nothing,' you're back at (4)") targets this exact step.

  **The Move:** Distinguish between the **model** (the quality space) and the **target** (the phenomenal/neural state).
  Premise (4) claims: *If the structure doesn't pin it down, nothing does.*
  **Counter:** The structure is a *coordinate system* we overlay on the state. The fact that multiple coordinate systems ($S_1, S_2$) fit the data doesn't mean the underlying geometry is indeterminate; it means the *description* is underdetermined.

  **Example:** I can describe a physical object's position in Cartesian coordinates or Polar coordinates. Both fit the data. Neither is "the true" coordinate system. But the *object's position* is determinate.
  Similarly, $S_1$ and $S_2$ might be isomorphic mappings of the same underlying neural manifold. If they are isomorphic, there is a fact of the matter about the *relations*, even if the metric parameters vary.

  **The Cost:**
  *   **Weakening (1):** You can no longer say "A sensory quality *just is* a position in a quality space." You must say "A sensory quality is *modeled by* a position..." This reintroduces a "residue" — the thing being modeled.
  *   **The Realist Wedge:** If there is a "thing being modeled" that exists independently of the coordinate system, the realist will ask: "What is *that*?" If you say "the neural state," you are a physicalist. If you say "the phenomenal state," you have to explain how we know it if it's not exhausted by the relations (violating the spirit of 1).

  ---

  ### 4. Attacking Step (1): The Realist's Bill
  If you reject (1), you become a **Qualitative Realist** (or Property Dualist, depending on how brave you are).

  **The Move:** A quality has an **intrinsic nature** over and above its relational profile. Redness is not just "more like orange than blue"; it has a specific "feel" that grounds those relations.

  **The Cost (High):**
  *   **The Inverted Spectrum:** You save the intuition that my red could be your green even if we behave identically. But now you have no way to *verify* this.
  *   **Epiphenomenalism Risk:** If the intrinsic nature doesn't affect discrimination or judgment (since those are relational/structural), then the "quale" is causally inert. It does no work.
  *   **Explanation Gap:** You owe an account of how we know this intrinsic nature. If it's not via relations (1) or judgments (2), how do we access it? "Introspection" becomes a magical faculty that peers directly at intrinsic properties without using relational data.
  *   **The "Noise" Problem:** As you noted, can they say anything about it that isn't noise? Usually, realists end up saying "It's just *this*" (pointing inward). This makes the theory scientifically inert.

  ---

  ### Recommendation: Where to Stand

  If you want to keep the spirit of the argument without accepting the eliminativist conclusion (5), **the break is at (4).**

  You should argue that **underdetermination of the model does not entail indeterminacy of the state.**

  1.  **Keep (1) with a caveat:** Qualia are positions in a quality space, *but* the quality space is a theoretical construct mapping onto a physical/phenomenal reality.
  2.  **Keep (2):** Access is via judgment/discrimination.
  3.  **Refine (3):** Acknowledge the non-metric nature of *similarity ratings*, but insist that *discriminative thresholds* (JNDs) provide a rigid skeletal structure (a Riemannian manifold) that constrains the possible spaces significantly.
  4.  **Reject (4):** Argue that $S_1$ and $S_2$ are likely **conventional variants** (like coordinate systems) rather than ontological competitors. The "fact of the matter" is the underlying neural/phenomenal topology, which is determinate even if our geometric modeling of it is flexible.

  **What this costs you:**
  You have to admit that **we cannot uniquely specify the metric of qualia from the outside.** There is no "God's eye view" of the quality space that tells us whether the distance between Red and Orange is *really* 0.5 or 0.6 in absolute units.
  But you avoid the conclusion that *there is no red*. You conclude that *the metric is conventional, but the topology is real.*

  **To your friend:**
  Tell them the reductio fails because physical objects also require coordinate systems to describe their position. The fact that I can use meters or feet doesn't mean the wall has no determinate location. Similarly, the fact that we can model qualia with multiple incommensurable spaces doesn't mean the experience is indeterminate; it means the *geometry of phenomenology* is not uniquely recoverable from behavioral data, even if the *phenomenology itself* is real.

  This keeps you in the game as a **Structural Realist** rather than an Eliminativist. You save the qualia, but you strip them of their "intrinsic, non-relational metric" baggage.
