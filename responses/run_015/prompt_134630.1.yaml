  *   *Formulation:* An ontological argument is sound only if the premises linking conceptual content to metaphysical instantiation are justified by evidence or reasoning external to the concept's definition (e.g., empirical data, independent metaphysical proof). Conceptual coherence is necessary but not sufficient.

  **The Closest Competing Rule:** **The Epistemic-Ontological Bridge.**
