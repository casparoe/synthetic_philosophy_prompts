answer: |-
  ### Specification for an Adjudicative Theory of Synchronic Phenomenal Unity

  You require a metaphysical specification capable of functioning as a diagnostic instrument. The following desiderata are structured to filter theories based on their ability to handle the edge cases (split-brain, hemispherectomy, pseudo-splits) without collapsing into operationalism or begging the question.

  #### I. The Desiderata

  | # | Desideratum | Motivating Case / Consideration | Status | Covert Commitment Warning |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Phenomenal/Access Distinction** | **Blindsight/Neglect:** A patient can have visual information processing (access) without phenomenal experience, or phenomenal experience without reportable access. A theory of *phenomenal* unity must not define unity by the ability to jointly report or use information. | **Non-Negotiable** | **Functionalist Collapse:** Many cognitive theories (e.g., strong Global Workspace) define consciousness *as* global availability. This desideratum excludes them from adjudicating *phenomenal* unity specifically. |
  | **2** | **Report Independence (The Mute Stream Constraint)** | **The Mute Hemisphere:** In a standard callosotomy, the right hemisphere often lacks speech. If a theory requires verbal report to verify unity, it must verdict the right hemisphere as non-conscious or indeterminate. An adjudicative theory must allow a verdict on the mute stream based on non-report behavioural markers (e.g., pointing, emotional affect) or neural correlates. | **Non-Negotiable** | **Verificationism:** Demanding report as a condition for existence conflates epistemology with metaphysics. This excludes behaviorist and strict operationalist accounts. |
  | **3** | **The Pseudo-Split Filter** | **Inattentional Blindness/Automatic Writing:** Informational insulation occurs constantly in neurotypical brains (e.g., modular processing). The theory must distinguish between *causal/functional disconnection* and *phenomenal disunity*. Mere lack of cross-talk is insufficient for a verdict of "two subjects." | **Non-Negotiable** | **Panpsychist/Integrated Information Over-generation:** IIT risks counting any modular insulation as a reduction in unity. This constraint demands a threshold for what counts as a *subjective* fracture. |
  | **4** | **The Counting Criterion (Subject vs. Field)** | **Split-Brain vs. Agenesis:** The theory must specify whether it counts *subjects* (metaphysical entities) or *fields* (collections of states). In split-brain cases, do we have two subjects or one subject with a fragmented field? The verdict must determine moral status (see Desideratum 6). | **Non-Negotiable** | **Bundle Theory vs. Substance Dualism:** "Counting subjects" presupposes subjects are countable entities. Bundle theorists may reject the framing, arguing only experiences exist. |
  | **5** | **Explanatory Role Declaration** | **Rational Inference/Action:** Does unity explain the ability to compare a visual and auditory stimulus to make a decision? Or is unity a brute fact that accompanies such abilities? The theory must state whether unity is *functional* (explains capacity) or *phenomenal* (accompanies capacity). | **Preference** | **Functionalism vs. Phenomenal Realism:** Demanding unity *do work* biases toward functionalism. Allowing it to be idle biases toward phenomenal realism/illusionism. |
  | **6** | **The Stakes Condition** | **Moral Status:** Why care if the answer is one or two? If there are two subjects, there are two entities capable of suffering. The theory must map the metaphysical verdict to moral considerably. | **Non-Negotiable** | **Ethical Naturalism:** Assumes metaphysical facts ground moral facts. An error theorist might reject this, but for clinical adjudication, it is required. |
  | **7** | **Mechanism Neutrality** | **Multiple Realizability:** The theory should not require a specific neural mechanism (e.g., gamma synchrony) as *constitutive* of unity, but rather as evidence. | **Preference** | **Neuro-Reductionism:** Demanding a single neural signature excludes non-reductive physicalist and dualist accounts. |

  #### II. The Jointly Unsatisfiable Subset (The Core Tension)

  You identified a suspicion regarding the logic of unity. This is not merely a suspicion; it is the central metaphysical aporia of the field. The following three claims form an inconsistent triad. An adequate theory must reject one.

  1.  **Subject Count Binary:** The number of conscious subjects in a system is an integer (1 or 2, not 1.5).
  2.  **Phenomenal Unity is Graded:** The degree of integration between experiential contents can vary continuously (as suggested by partial callosal disconnection or fading anesthesia).
  3.  **Supervenience of Subjecthood on Unity:** The number of subjects is determined solely by the degree of phenomenal unity (i.e., if unity drops below threshold $T$, subject count increases).

  **The Tension:** If unity is graded (2) and subjecthood supervenes on unity (3), then subjecthood must be graded (violating 1). If subjecthood is binary (1) and supervenes on unity (3), then unity must be binary (violating 2). If subjecthood is binary (1) and unity is graded (2), then subjecthood does *not* supervene solely on unity (violating 3).

  **Recommendation:** For the adjudicative job you describe (clinical/ethical verdicts), you must retain **(1) Subject Count Binary** and **(6) The Stakes Condition**. Ethical and legal status generally cannot be assigned to "0.5 of a person." Consequently, you must reject **(3)** or modify **(2)**.
  *   *Option A:* Unity is graded, but Subjecthood is not. There is a threshold effect. (Risk: Sorites paradox on the threshold).
  *   *Option B:* Unity is binary (co-consciousness is an equivalence relation), and apparent grades are actually changes in the *content* available to the binary relation, or changes in *access* unity. (Risk: Contradicts intuition of fading consciousness).

  **Verdict:** The requirement that excludes the largest share of views currently in play is **Subject Count Binary** combined with **The Stakes Condition**. Most contemporary cognitive science models (Global Workspace, Predictive Processing) treat consciousness as a continuum of intensity or integration. They cannot easily output a "Two Subjects" verdict without arbitrary thresholding.

  #### III. The Single Requirement Excluding the Largest Share of Views

  **Report Independence (Desideratum 2).**

  **Reasoning:** The dominant methodologies in consciousness science (operational definitions in fMRI/EEG studies, Global Workspace Theory variants) tie consciousness closely to reportability, working memory access, or attentional control. In the split-brain patient, the right hemisphere is often "mute."
  *   **GWT/Access Theories:** Often forced to verdict the mute hemisphere as non-conscious or "unconscious processing" because the information does not reach the global workspace (often tied to language centers).
  *   **Behaviorism:** Verdicts non-existence due to lack of output.
  *   **The Constraint:** A theory that cannot adjudicate the mute stream as potentially conscious *despite* lack of report is useless for your specific job. It renders the "two subjects" hypothesis unfalsifiable in the very cases where it is most plausible. This requirement excludes most standard cognitive models, leaving primarily Phenomenal Realist, Higher-Order (with non-verbal HOTs), or Integrated Information accounts.

  #### IV. Evaluation of Your Candidate Constraints

  *   **"Get the ordinary case right":** **Non-Negotiable.** However, beware of "inflating into something metaphysically spectacular." This is a warning against **Substance Dualism** or **Ego Theories** that posit a "homunculus" to do the unifying. The constraint should be: *Account for togetherness without positing a unifier distinct from the experiences.*
  *   **"Handle surgical cases":** **Non-Negotiable.** This is the test set.
  *   **"Exclude pseudo-splits":** **Non-Negotiable.** This is the **Phenomenal/Access Distinction** (Desideratum 1).
  *   **"Keep apart unity types":** **Non-Negotiable.** This is methodological hygiene. Most confusion arises from conflating *Unity of the Field* (phenomenal) with *Unity of the Agent* (functional).
  *   **"Degree vs. All-or-Nothing":** **The Tension.** As argued above, you cannot have both binary subject count and graded unity without a threshold mechanism. You must choose: Is the *field* graded and the *subject* binary? Or is the field binary and apparent grades are actually *access* grades? The surgical data (partial disconnection) suggests graded field unity. The ethical data suggests binary subjecthood.
  *   **"Report Bottleneck":** **Non-Negotiable.** (See Desideratum 2).
  *   **"Explanatory Work":** **Preference.** Do not demand unity *explain* rational inference. Split-brain patients can be rational within hemispheres. If unity explains inference, split-brains should be globally irrational, which they are not. Unity may be a *precondition* for certain cross-modal inferences, but not all agency.
  *   **"Subpersonal Mechanism":** **Preference.** Do not demand a *single* mechanism. Neural realization may be multiply realizable. Demand only that the mechanism be *specifiable* in principle.

  #### V. Scoring the Candidate Families

  | Theory Family | Phenomenal/Access Distinction | Report Independence (Mute Stream) | Pseudo-Split Filter | Binary Subject Count | Explanatory Work | Verdict Capability |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **Subsumption (Bayne)** | **Pass** | **Pass** | **Pass** | **Pass** | Neutral | **High** (Designed for this) |
  | **Primitive Co-Consciousness** | **Pass** | **Pass** | **Pass** | **Pass** | Idle (Brute) | **High** (Metaphysically robust) |
  | **Integrated Information (IIT)** | **Fail** (Conflates info/phenomenal) | **Pass** | **Fail** (Over-generates splits) | **Fail** (Graded $\Phi$ = Graded Subject) | **High** (Constitutive) | **Low** (Yields "1.5 subjects") |
  | **Global Workspace (GWT)** | **Fail** (Defines by access) | **Fail** (Requires report/broadcast) | **Pass** | **Pass** (Usually 1) | **High** (Functional) | **Low** (Verdicts mute stream as unconscious) |
  | **Quietist / Dismissivist** | **Pass** (Denies fact) | **N/A** | **N/A** | **N/A** | **N/A** | **None** (Dissolves the question) |
  | **Higher-Order (HOROR)** | **Pass** | **Pass** (If non-verbal HOT allowed) | **Pass** | **Pass** | Neutral | **Medium** (Depends on implementation) |

  **Key:**
  *   **Pass:** Meets the desideratum as specified.
  *   **Fail:** Violates the desideratum or requires modification that breaks the theory.
  *   **Verdict Capability:** Ability to output a clear "One Subject" or "Two Subjects" verdict for clinical adjudication.

  #### VI. The Stakes: Why the Verdict Matters

  You asked what turns on the verdict. It is not merely taxonomic.

  1.  **Moral Status Aggregation:** If the split-brain patient is **one subject**, harming the right hemisphere is harming *the* subject. If **two subjects**, harming the right hemisphere is harming a *distinct* subject who may not be compensated by benefits to the left hemisphere. This alters the utilitarian calculus of medical intervention.
  2.  **Consent and Autonomy:** If there are two subjects, can the speaking hemisphere consent to surgery for the mute hemisphere? If they are distinct subjects, this is a violation of bodily autonomy akin to conjoined twins.
  3.  **Responsibility:** In intermanual conflict (one hand buttons, one unbuttons), is this one agent failing self-control, or two agents in conflict? The metaphysics of unity grounds the legal metaphysics of agency.

  **Summary Recommendation:**
  To fulfill your adjudicative job, you must adopt a **Phenomenal Realist** framework that distinguishes **Phenomenal Unity** from **Access Unity**, insists on **Report Independence**, and accepts the **Binary Subject Count** despite the **Graded Nature of Neural Integration**. This forces you to posit a threshold or a categorical relation (co-consciousness) that does not mirror the continuous physics of the corpus callosum. This is the metaphysical cost of making the theory useful for ethics and law.
