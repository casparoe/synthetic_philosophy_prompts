  **Reconstruction**

  The implicit theory unifying these disparate regulatory treatments is not a singular commitment to safety, but a **contextual allocation of epistemic risk based on baseline entitlements**. The status quo is not treated as a fixed physical state but as a moral default defined by who holds the right to impose risk on whom. In prescription drugs, the baseline is the bodily integrity of the public; the firm seeks to impose unknown risks on non-consenting populations, so the burden lies on the proponent to prove safety. In terminal illness, the baseline is imminent death; the patient seeks to impose risk only on themselves, so the burden shifts to the state to justify blocking liberty. Supplements reflect a baseline of consumer sovereignty; the market is presumed free unless harm is proven, placing the burden on the regulator. Environmental reviews treat the state as a trustee of public resources, where both action and inaction impose costs on beneficiaries, requiring symmetrical accounting.

  This view commits to a specific moral distinction between acting and allowing: omissions are neutral only when they preserve the baseline right; they are culpable when they violate a duty of care. Irreversibility matters not merely as a physical fact but as a multiplier of liability. Death is irreversible, but so is chronic toxicity. The difference is that drug toxicity is an *imposed* irreversible harm, while terminal death is a *natural* irreversible state unless intervened upon. Thus, the principle is not "be safe" but "justify risk imposition." The apparent contradiction dissolves when recognizing that the "proponent of change" shifts: sometimes it is the firm (drugs), sometimes the state (blocking access), and sometimes the developer (environment). The unified theory is **Consent-Adjusted Risk Allocation**: uncertainty is resolved against the party lacking consent from those exposed to the risk. The regulatory state privileges the status quo not because it is safe, but because it represents the existing distribution of rights. Changing it requires justification proportional to the coercion involved. When the regulator blocks a terminal patient, they become the agent of harm; when they approve a drug, they become the guarantor of safety. The principle is consistently precautionary against *coercive imposition of risk*, whether by corporation or state.

  **The Two Readings**

  The **burden-of-proof reading** is structurally required by the practice. The regulations literally specify who must generate data, making precaution a procedural rule assigning the cost of ignorance to the party seeking to alter the legal baseline. This reading saves the coherence of the system: it fits the pattern perfectly because the "proponent" shifts across domains. However, it is silent on *why* the burden shifts where it does. It describes the mechanism, not the justification. It tells us *how* the decision is made, but not *why* the initial positions are assigned as they are.

  The **visibility reading** offers the causal explanation. It suggests the asymmetry tracks accountability, not morality. Regulators are punished for visible errors (approved drugs killing people) but rarely for invisible errors (blocked drugs saving people). This reading acts as a **debunking** of the moral reconstruction above. It implies the "consent-adjusted" theory is a post-hoc rationalization for risk-averse bureaucracy. However, it is compatible with the principle being functionally true: even if motivated by blame-avoidance, the system produces a stable allocation of risk. The environmental review procedure supports the visibility reading strongly; by forcing the costs of inaction onto the page, it makes the invisible visible, thereby neutralizing the accountability asymmetry. Thus, visibility explains the origin, burden-of-proof explains the operation. The practice *requires* the burden structure to function legally, but likely *presupposes* the visibility logic politically. The visibility reading is not just a debunking but a **diagnostic reconstruction**. It identifies the flaw (asymmetric accountability) and shows how the practice attempts to repair it (environmental review) while succumbing to it elsewhere (drugs). The burden-of-proof reading is the *internal* logic lawyers use; the visibility reading is the *external* logic political scientists use. Both are true at different levels of analysis.

  **Self-Application**

  Applying precaution to itself generates a regress: regulating uncertainty creates uncertainty about delayed benefits. This is not a logical paradox but a **trade-off between Type I and Type II errors**. The principle does not demand zero risk; it demands that the burden of proof aligns with the cost of error. If the cost of delay (death by denial) exceeds the cost of action (death by toxicity), the principle mandates easing restrictions. Therefore, compassionate use carve-outs are not sentimentality; they are the **institutional trace of the self-application problem**. They acknowledge that the default precautionary stance generates its own harms. When the background risk (terminal illness) rises, the cost of maintaining the precautionary barrier becomes unacceptable.

  The principle survives self-application because it is not a substantive ban on innovation but a procedural hurdle. It can be lowered when the evidence of background harm becomes certain. The paradox dissolves if we view precaution as a variable threshold rather than a binary switch. The regime is stable only because it allows for emergency overrides; without them, the system would collapse under the weight of its own opportunity costs. Thus, the carve-outs are essential structural components, not optional add-ons. The adoption of the regulatory regime itself was an untested intervention. We accepted it because the pre-regulatory baseline (thalidomide, etc.) presented visible, traceable harms. The visibility reading explains why the regime was adopted: to fix visible scandals. The self-application worry is real: we cannot know the counterfactual lives lost to delay. But the system manages this by limiting the scope of precaution to high-visibility domains. It is hypocritical, but functionally adaptive.

  **Underdetermination**

  Multiple rival views license this pattern. An **expected-utility maximizer** with asymmetric loss functions would produce identical rules: the cost of a false positive (unsafe drug approved) outweighs a false negative in population health, but reverses in terminal care. A **maximin rule** under ambiguity yields the same: avoid the worst-case scenario (mass toxicity) unless the status quo is already the worst case (death). An **alpha-maximin rule** allows for weighting optimism vs pessimism, fitting the supplement case (optimistic about market) vs drug case (pessimistic about safety). A **rights-based view** distinguishes between negative rights (not to be poisoned) and positive rights (to be saved), mapping cleanly onto the drug/terminal split. Finally, a **political capture story** explains supplements (weak regulation due to industry power) versus drugs (strong regulation due to public outcry).

  Discriminating evidence lies in **edge cases and transitions**. If the rights view holds, terminal access should expand logically to non-terminal serious conditions; if capture holds, it will not. If expected utility holds, we should see explicit quantification of opportunity costs in drug approval; currently, these are implicit. If visibility holds, regulatory strictness should correlate with media coverage of harms rather than statistical risk. Observing how regulators respond to "silent" epidemics versus "loud" scandals would distinguish the political/visibility models from the moral/utility models. Currently, the pattern is too consistent with all four to rule any out solely on structural grounds. The political story suggests the pattern is unstable and will shift with power dynamics. The moral/utility stories suggest stability. If supplement regulation tightens without a scandal, it supports the moral/utility view. If it only tightens after a high-profile death, it supports visibility/politics. The environmental case is key: if agencies routinely choose inaction after review, it supports the utility view (inaction has value). If they always choose action to show diligence, it supports the visibility view (action is traceable). We need data on the *outcome* of environmental reviews, not just the procedure.

  **What Would Change My Mind**

  I am most confident in the conceptual claim that the pattern is internally coherent under the "Consent-Adjusted Risk" reconstruction. I am least confident in the empirical claim that regulators actually follow this logic rather than simply reacting to scandals. My reconstruction fails if evidence shows that regulatory burdens are assigned randomly or purely based on lobbying strength without even a veneer of principled justification. Specifically, if drug approval times do not correlate with perceived risk severity but only with political pressure, the moral reconstruction collapses into the capture story. I would change my mind if presented with internal agency memos showing that opportunity costs of delay are systematically ignored even in terminal cases, proving the carve-outs are indeed mere sentimentality. I distinguish these factual claims (regulator intent) from conceptual claims (logical coherence). The system *can* be rationalized morally, but that does not mean it *is* motivated morally. The visibility reading is harder to falsify because it accounts for hypocrisy, making it the more robust empirical hypothesis. A specific trigger would be a regulatory impact analysis that explicitly quantifies lives lost to delay. If such analyses exist and are ignored, the utility view dies. If they exist and are used, the visibility view weakens.
