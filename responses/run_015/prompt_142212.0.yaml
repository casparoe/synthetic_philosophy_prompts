answer: |-
  You have hit on the exact friction point that makes Hofstadter's concept so controversial and often misunderstood. However, there is a fundamental error in your analysis that flips the conclusion: **Superrationality does not select the symmetric Nash equilibrium in the Prisoner's Dilemma.**

  If superrationality merely selected the symmetric Nash equilibrium, you would be right: it would be vacuous in the Prisoner's Dilemma (PD), because the only symmetric Nash is (Defect, Defect).

  But Hofstadter's claim is much stronger and more radical. He argues that superrationality leads to **(Cooperate, Cooperate)** in a one-shot PD.

  Here is where the divergence happens, why your "symmetric Nash" intuition is actually describing standard Causal Decision Theory, and where the asymmetry objection lands.

  ### 1. The Core Disagreement: Independence vs. Correlation

  Your critique rests on the standard game-theoretic assumption of **strategic independence**.
  *   **Nash Rationality (Causal Decision Theory):** When I calculate my best move, I treat your move as a fixed fact (or a probability distribution independent of my choice). I ask: "Given that you play $X$, is $A$ better than $B$?" In PD, Defect dominates Cooperate regardless of what you do. Therefore, (Defect, Defect) is the equilibrium.
  *   **Superrationality (Evidential/Functional Decision Theory):** When I calculate my best move, I treat your move as **logically correlated** with mine. I ask: "If I choose Cooperate, does that increase the probability that you choose Cooperate?"

  Hofstadter's argument is that if we are both superrational, we are running the same "reasoning algorithm." Therefore, the output of my algorithm cannot differ from the output of yours.
  *   I am not choosing between (Cooperate, Defect) and (Defect, Defect).
  *   I am choosing between **(Cooperate, Cooperate)** and **(Defect, Defect)**.

  Since the payoff for (C, C) is higher than (D, D), the superrational agent Cooperates.

  **So, to answer your first objection:** No, it is not the symmetric Nash equilibrium. In the PD, Nash says Defect; Superrationality says Cooperate. If it buys you cooperation in a one-shot PD, it definitely "buys you something" (higher utility).

  ### 2. Why it feels like "Nothing New" (The Nash Confusion)

  You are likely conflating **Symmetric Equilibrium** with **Symmetric Reasoning**.

  In games like *Stag Hunt* or *Coordination Games*, the Superrational answer and the Symmetric Nash answer often coincide (both say "Coordinate on the best outcome"). This might be why you feel it adds nothing.

  But in games where individual rationality conflicts with group rationality (like PD or Tragedy of the Commons), they diverge sharply.
  *   **Nash:** "I can't control you. So I must protect myself. Defect."
  *   **Super:** "I can't control you causally, but I control the *logic* that determines both of us. If I defect, the logic dictates you defect. So I cooperate."

  This is not a refinement of Nash; it is a rejection of the **independence axiom** that underpins Nash. Nash assumes $P(\text{Opponent} | \text{Me}) = P(\text{Opponent})$. Superrationality assumes $P(\text{Opponent} | \text{Me}) \approx 1$ (for the same action).

  ### 3. The Asymmetry Objection ("Nudged by a Dollar")

  You wrote: *"I also tried it on a version where one player's payoffs are nudged by a dollar... and it just seems to stop having anything to say."*

  Here, you are actually quite sharp. This is the weakest point of Hofstadter's original formulation, and it is where modern decision theory (specifically **Functional Decision Theory** or FDT) has tried to patch the hole.

  **Hofstadter's Original View:**
  He relied heavily on the idea of "identical thinkers." If the payoffs are different, are we still identical thinkers? If I gain \$1 more from defecting than you do, does my reasoning algorithm output "Defect" while yours outputs "Cooperate"? If so, the correlation breaks. Hofstadter admitted this makes the concept fragile outside of perfectly symmetric games.

  **The Modern View (FDT/Logical Correlation):**
  The modern successors to superrationality (championed by MIRI researchers like Yudkowsky and Soares) argue that it isn't about *payoff symmetry*, but about **algorithmic similarity**.
  *   Even if payoffs differ slightly, if we both recognize that we are using the same decision function $F(\text{payoffs}) \rightarrow \text{Action}$, then my choice is still logical evidence of yours.
  *   However, if the payoff nudge is large enough to cross a threshold in the algorithm (e.g., "Defect if gain > \$5"), then we might indeed diverge.
  *   FDT handles this by saying: "I should choose the action that maximizes utility given that my output determines the output of all other agents running my same algorithm."

  So, you are right that strict Hofstadterian superrationality struggles with asymmetry. But the *principle* (logical correlation of reasoning) is robust enough that it still often prescribes cooperation in asymmetric PDs, provided the asymmetry doesn't change the *structure* of the reasoning.

  ### 4. Why it feels like "Magic" (and why people reject it)

  Your skepticism is shared by most mainstream game theorists. The objection is usually: **"How can my choice causally influence yours without communication?"**

  *   **Causal Decision Theorists (Nash):** It can't. Your choice is in the past or simultaneous. You can't reach across the table and move their hand. Therefore, you must maximize against their fixed probability.
  *   **Superrationalists:** It's not causal influence; it's **logical entailment**. Think of two calculators, both programmed to compute $2+2$. If I force my calculator to display '5', and I know yours is identical and running the same process, I must assume yours also displays '5'. I am not causally affecting yours; I am deducing its state based on our shared logical structure.

  In the PD, the superrationalist says: "I am not choosing an action; I am choosing a *policy* for all agents like me."

  ### Summary: Where you went wrong

  1.  **The PD Outcome:** You assumed superrationality picks the symmetric Nash (Defect). It explicitly picks Cooperate. This is its entire *raison d'être*.
  2.  **The Mechanism:** You assumed it relies on the same independence axioms as Nash. It relies on logical correlation, which violates the independence assumption.
  3.  **The Value:** It buys cooperation in one-shot dilemmas where Nash guarantees suboptimal outcomes.
  4.  **The Asymmetry:** You are correct that the simple "we are the same" heuristic breaks with payoff asymmetry, but the underlying decision theory (FDT) attempts to generalize this to "we run the same algorithm," which is more robust.

  **Verdict:** Superrationality isn't a subset of Nash equilibrium analysis. It is a competing decision theory. It doesn't refine the equilibrium; it changes the definition of rationality from "maximize given their fixed choice" to "maximize given that our choices are logically linked." Whether you buy it depends on whether you believe your decision procedure is an output of a logical truth that exists independently of your physical instantiation. If you don't buy that metaphysics, it looks like magic. If you do, it looks like the only way to solve the PD.
