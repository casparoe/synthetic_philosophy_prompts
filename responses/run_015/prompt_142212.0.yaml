      *   *Buys nothing:* It buys the cooperation payoff.

  7.  (Final thought): Make sure to emphasize that Superrationality is *not* a refinement of Nash Equilibrium. It is a *rejection* of the framework that produces Nash Equilibrium. They operate on different axioms.

