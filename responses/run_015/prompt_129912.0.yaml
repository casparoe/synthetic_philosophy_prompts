prompt: |-
  You are a political philosopher who has spent years on real grant panels and knows how these things actually go wrong -- please think carefully, and do some brainstorming on the failure modes of each metric before you start writing; I would rather have a slow careful answer than a fast tidy one.

  I am on a volunteer committee for our city that hands out about $400k a year to local programs for disabled and long-term-unemployed residents. We meet twice a month, ninety minutes, maybe six proposals a session, no staff, no statistician, no ability to commission our own evaluation, and every yes has to come with a one-page justification the city council can read without wincing. We keep having the same argument: someone says a program makes people happier, someone says it gives them more real options, someone says what matters is the money in their pocket, and we have no way of telling whether we are even disagreeing about facts or about what we are trying to equalize.

  I need a decision procedure we can actually run in about forty minutes per proposal, by people who have never taken a philosophy class. I know the slogan-level version of the welfare / resources / capabilities debate from the usual blog reading, so please do not just explain the three views -- I need them turned into ordered questions, with what counts as a good enough answer to each, where the procedure just stops and says no, and above all where it hands the question back to us because it is a values call that no amount of procedure settles. It has to say what to do when the number we want does not exist, which is most of the time, and it should be honest about which steps are judgement calls wearing a lab coat.

  Then run it on three real ones. (1) A ten-week confidence-and-goals course for long-term unemployed twentysomethings: a small local evaluation found a big jump in self-reported wellbeing right after, most of it gone at six months, and no detectable change in employment, earnings or skills. Cheap per head. Half the committee thinks it changes what people want rather than what they can do; the other half thinks that is the point. (2) A home-and-transport modifications budget -- ramps, vehicle adaptions, subsidised rides. Same cash to everyone, but a ramp does wildly different things depending on the building, and applicants hate the means-test interview enough that some drop out. (3) Weekly music sessions for adults with profound intellectual disabilities: very high cost per head, no measurable change in anything anyone can name as a functioning, staff and some families say participants are plainly happier during and after, and the same money would buy mobility equipment for roughly forty other people.

  Two more constraints, sorry: we are not allowed to ask applicants about diagnoses or home life beyond what they volunteer, and about a fifth of the pot is donor-restricted to programs that can show improved wellbeing on a survey the donor supplies and administers.

  Be straight with me about which of these the procedure kills that we will not want to kill. And end by telling me plainly what this procedure cannot do -- especially whether it can ever tell us that we picked the wrong currency in the first place.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Role:** Political Philosopher with practical grant panel experience (knows failure modes, bureaucracy, time limits).
      *   **Task:** Create a decision procedure for a city committee distributing $400k/year to disabled/long-term unemployed residents.
      *   **Constraints:**
          *   Volunteer committee, no staff/experts.
          *   Meetings: 2x/month, 90 mins, ~6 proposals/session.
          *   Time per proposal: ~40 minutes max for decision procedure.
          *   Output: One-page justification for City Council.
          *   Debate: Welfare (happiness) vs. Resources (money/options) vs. Capabilities (real freedom/functioning).
          *   Inputs: No diagnoses/home life questions beyond volunteering.
          *   Donor Restriction: 20% of pot *must* show improved wellbeing on a specific survey.
          *   Requirement: Ordered questions, stop conditions ("no"), hand-backs (value judgments), honesty about missing data.
          *   Application: Run on three specific cases (Confidence Course, Home/Transport Mods, Music Sessions).
          *   Conclusion: What does this procedure kill that we won't want to kill? What *can't* it do (especially regarding the "currency" question)?
      *   **Tone:** Careful, slow, honest about failure modes, not academic jargon, practical.

  2.  **Deconstruct the Theoretical Debate (Welfare vs. Resources vs. Capabilities) into Practical Metrics:**
      *   *Welfarism (Happiness/Preference):* Easy to measure (surveys), hard to verify (adaptation, false positives), donor-aligned.
      *   *Resourcism (Money/Assets):* Easy to count, hard to equate (a ramp isn't cash), ignores conversion factors (disability).
      *   *Capabilities (Real Opportunity/Functioning):* The gold standard philosophically, but hardest to measure without staff. Needs to be simplified to "Can they actually do X now that they couldn't before?"

  3.  **Brainstorm Failure Modes (The "Philosopher on a Panel" Perspective):**
      *   *Metric Failure:* Self-reported happiness is manipulable or transient (Case 1). Cash equivalents are unequal (Case 2). "Functioning" is vague without experts (Case 3).
      *   *Process Failure:* Analysis paralysis. Committee members talking past each other. "Mission creep" (trying to solve systemic issues with $400k).
      *   *Political Failure:* City Council rejecting justifications. Donor restrictions boxing out high-need/low-metric programs.
      *   *Ethical Failure:* Penalizing the severely disabled because their "gain" is hard to measure (Case 3).

  4.  **Drafting the Decision Procedure (The "40-Minute Protocol"):**
      *   Need a funnel approach. Start with hard constraints, move to metrics, end with values.
      *   *Step 1: Eligibility & Constraints (5 mins).* Donor restriction check. Basic fit.
      *   *Step 2: The "Currency" Check (10 mins).* Force the committee to agree on *what* is being bought. Is it feeling better, having more stuff, or doing more things?
      *   *Step 3: Evidence & Durability (15 mins).* Look at the data. Is it real? Does it last?
      *   *Step 4: The Trade-off & Justification (10 mins).* Opportunity cost. Writing the one-pager.
      *   *Stop Rules:* If it violates donor rules -> No (unless general fund). If evidence is fabricated -> No. If cost per benefit is absurd compared to alternatives -> Flag.
      *   *Hand-backs:* Where the committee must vote on values, not facts.

  5.  **Refining the Procedure (Iterative Polish):**
      *   *Critique:* Is 40 minutes realistic? Yes, if strict.
      *   *Critique:* Does it address the "no diagnosis" rule? Yes, focus on functional barriers, not medical labels.
      *   *Critique:* Does it handle the donor restriction? Yes, needs a specific track for the 20%.
      *   *Key Addition:* A "Conversion Factor" check. $1000 for a wheelchair user $\neq$ $1000 for a job seeker. The procedure must acknowledge this inequality.

  6.  **Running the Three Cases:**
      *   *Case 1 (Confidence Course):*
          *   Welfare: High short term, low long term.
          *   Resources: Low cost.
          *   Capabilities: No change in employment.
          *   *Verdict:* Likely fails on durability unless categorized as "mental health support" rather than "employment." High risk of "adaptive preference" (teaching people to be happy with less).
      *   *Case 2 (Mods/Transport):*
          *   Welfare: Hard to measure (hate the interview).
          *   Resources: Cash equivalent varies wildly.
          *   Capabilities: High impact on mobility (functioning).
          *   *Verdict:* Strong on capabilities, weak on admin burden. The means-test is a capability *reducer*.
      *   *Case 3 (Music Sessions):*
          *   Welfare: High (happiness).
          *   Resources: High cost.
          *   Capabilities: Debatable "functioning."
          *   *Verdict:* The classic "expensive happiness" vs. "cheap mobility" clash. Donor money fits here. General fund might reject due to opportunity cost.

  7.  **Addressing the "Hard Truths" (Conclusion):**
      *   What gets killed? Probably the Music Sessions (general fund) and the Confidence Course (durability).
      *   What can't it do? It can't tell us if we value *dignity* over *efficiency*. It can't solve the "wrong currency" problem because the procedure *uses* the currency we feed it. It creates a illusion of objectivity.

  8.  **Final Review against Constraints:**
      *   Did I explain the three views? No, turned them into questions.
      *   Did I brainstorm failure modes? Yes, integrated into the design.
      *   Is it 40 mins? Structured to be.
      *   One-page justification? Included as an output requirement.
      *   Donor restriction? Integrated.
      *   No diagnosis questions? Respected.

  9.  **Writing the Response:** (Self-Correction during drafting)
      *   *Tone Check:* Ensure I don't sound like an academic lecturing. Sound like a tired committee veteran.
      *   *Clarity:* Use bolding for the steps.
      *   *Honesty:* Be brutal about the Music Session trade-off. That's the ethical crux.
      *   *The "Currency" Question:* Make sure the ending explicitly addresses that the procedure *presupposes* a currency, it doesn't validate it.

  10. **Final Polish:** Check the word count and flow. Ensure the "Stop Rules" are clear. (Proceed to generate output).

  *(Self-Correction Note during drafting the procedure)*: I need to make sure the "Donor Restricted" 20% doesn't hijack the whole logic. I should treat the pot as two buckets: General (80%) and Wellbeing (20%). This simplifies the decision tree.

  *(Self-Correction on Case 1)*: The prompt says "Half the committee thinks it changes what people want." This is the "Adaptive Preferences" problem (Nussbaum/Sen). I need to make sure the procedure flags this specifically.

  *(Self-Correction on Case 2)*: The "hate the means-test" part is crucial. That's a "capability cost." I need to add a step for "Administrative Burden as a Negative."

  *(Self-Correction on Case 3)*: The "no measurable change in functioning" is the killer. But "happiness" counts for the donor bucket. I need to distinguish which bucket applies.

  Okay, ready to write.s
answer: |-
  Here is the hard truth before we begin: A procedure cannot solve a disagreement about first principles. If half your committee believes the goal is *dignity* and the other half believes the goal is *economic throughput*, no flowchart will reconcile that. It will only hide the disagreement until the City Council rejects your justification.

  However, a good procedure can force you to locate *exactly* where you disagree, distinguish fact from value, and prevent you from wasting forty minutes arguing about a number that doesn't exist.

  Below is the **40-Minute Allocation Protocol (40-MAP)**. It is designed for non-philosophers, acknowledges the lack of data, and separates the "Donor Bucket" (20% of funds, wellbeing-focused) from the "General Bucket" (80% of funds, opportunity-focused).

  ### Part 1: Brainstorming the Failure Modes
  *Before adopting the protocol, understand where it will break.*

  1.  **The "Happy Slave" Failure (Welfarism):** If we fund what makes people *say* they are happier, we risk funding programs that lower expectations rather than raising conditions (Case 1). *Mitigation:* The protocol requires a durability check.
  2.  **The "Equal Dollar, Unequal Life" Failure (Resourcism):** If we treat $1,000 as equal value for everyone, we ignore that a disabled person needs more resources to achieve the same mobility as an able-bodied person (Case 2). *Mitigation:* The protocol asks for "Functional Gain," not "Dollar Spend."
  3.  **The "Measurement Tyranny" Failure (Capabilities):** If we only fund what is easily measured, we exclude the profoundly disabled who cannot fill out surveys or demonstrate "employment skills" (Case 3). *Mitigation:* Explicitly routing these to the Donor Bucket or forcing a "Dignity Override."
  4.  **The "Bureaucratic Harm" Failure:** Sometimes the process of getting help destroys the benefit (Case 2 means-testing). *Mitigation:* A specific penalty box for administrative burden.

  ---

  ### Part 2: The 40-Minute Allocation Protocol (40-MAP)

  **Pre-Work (Before the meeting):**
  *   Proposals are tagged by staff/volunteers as **Bucket A (General - 80%)** or **Bucket B (Donor/Wellbeing - 20%)**.
  *   *Rule:* If a proposal claims employment/economic outcomes, it *must* be Bucket A. If it claims emotional/quality of life outcomes, it *can* be Bucket B. If it claims both, it must split the budget request.

  **The Session (40 Minutes Total)**

  #### Step 1: The Hard Gates (5 Minutes)
  *Goal: Eliminate non-starters without debate.*
  1.  **Eligibility:** Does this serve disabled or long-term unemployed residents? (Yes/No)
  2.  **Bucket Fit:** Does the proposal match the Bucket it is in? (e.g., Is a job training program asking for Donor Wellbeing funds?)
  3.  **Data Integrity:** Is the evaluation data provided internally consistent? (Not "is it true?" but "does it add up?")

  *   **STOP RULE:** If any answer is **No**, the proposal is rejected or returned for re-tagging. No discussion.
  *   **Output:** "Failed Eligibility" or "Moved to [Other] Bucket."

  #### Step 2: The Currency Check (10 Minutes)
  *Goal: Force agreement on what is being purchased. This is where you stop talking past each other.*
  The Chair reads the primary claim of the proposal. The Committee must vote on which **Primary Currency** this proposal purchases. You must pick *one*.

  *   **Option W (Welfare):** The goal is to improve subjective mood, happiness, or satisfaction.
  *   **Option R (Resources):** The goal is to put cash, assets, or tangible tools in hands.
  *   **Option C (Capabilities):** The goal is to enable a specific functioning (e.g., "leave the house," "apply for a job," "communicate a choice") that was previously blocked.

  *   **The Hand-Back:** If the vote is split (e.g., 50% W, 50% C), you have identified a values conflict. You cannot proceed to Step 3 until a majority picks one. *Write down the minority view for the justification.*
  *   **Failure Mode Warning:** Do not allow "It does all three." That is a lie you tell the City Council. Pick the *primary* intent.

  #### Step 3: The Evidence & Durability Audit (15 Minutes)
  *Goal: Assess the claim based on the chosen Currency.*
  Ask the three questions relevant to the Currency picked in Step 2.

  *   **If W (Welfare):**
      1.  Is the happiness self-reported or observed?
      2.  **Durability:** Does the effect last >3 months? (If <3 months, it is "Entertainment," not "Support.")
      3.  **Adaptation Check:** Did the program change the person's conditions, or just their expectations? (Crucial for Case 1).

  *   **If R (Resources):**
      1.  Is the resource fungible (cash) or specific (equipment)?
      2.  **Conversion Check:** Does this resource actually convert to benefit for *this* group? (e.g., Cash for transport is useless if no accessible buses exist).
      3.  **Leakage:** How much of the resource is consumed by admin/overhead vs. reaching the hand?

  *   **If C (Capabilities):**
      1.  **Specific Function:** What exact action can they do now that they couldn't before? (Must be concrete: "Enter building," not "Feel empowered.")
      2.  **Barrier Removal:** Did we remove a barrier, or just coach them to jump higher?
      3.  **Dependency:** Does this capability require ongoing funding to maintain, or is it one-time?

  *   **STOP RULE:** If the evidence shows **Zero Durability** (W), **Zero Conversion** (R), or **Zero Functioning Change** (C), the proposal is **Rejected**.
  *   **The "Missing Number" Rule:** If the data does not exist (e.g., "We didn't track 6-month outcomes"), you must apply a **50% Discount** to the claimed benefit in your mental math. Do not assume it worked.

  #### Step 4: The Burden & Trade-Off (10 Minutes)
  *Goal: Account for hidden costs and opportunity costs.*
  1.  **Administrative Burden:** Does the applicant have to endure a humiliating process (means test, invasive interview) to get this?
      *   *Rule:* If burden is High, subtract 20% from the projected benefit score.
  2.  **The Opportunity Cost Question:** "If we fund this, what specific type of program do we *not* fund?"
      *   *Requirement:* The Justification must name the trade-off. (e.g., "Funding this music group means we fund 10 fewer ramp installations.")
  3.  **The Vote:** Simple Majority.

  **Final Output:** The Chair drafts the **One-Page Justification** using this template:
  *   **Primary Currency:** (W/R/C)
  *   **Verified Gain:** (What actually changes, after discounting missing data)
  *   **Durability:** (Timeframe)
  *   **Trade-Off:** (What we didn't fund)
  *   **Minority View:** (If Step 2 was contested)

  ---

  ### Part 3: Running the Protocol on Your Three Cases

  #### Case 1: Confidence-and-Goals Course (Unemployed 20s)
  *   **Bucket:** General (Claims employment/wellbeing mix, but no employment data).
  *   **Step 1:** Passes.
  *   **Step 2 (Currency):** Committee splits. Half say **W** (Wellbeing/Confidence), half say **C** (Capabilities/Employment).
      *   *Resolution:* Since there is *no* employment data, you cannot claim C. You must vote **W**. (This forces the committee to admit they are funding therapy, not job training).
  *   **Step 3 (Evidence - W):**
      *   Self-reported? Yes.
      *   Durability? **Fail.** (Gone at 6 months).
      *   Adaptation Check? **Fail.** (No change in material conditions).
  *   **Step 4 (Burden):** Low burden.
  *   **Verdict:** **REJECT.**
  *   **Why:** Under the protocol, a <3 month happiness boost for the general fund is "Entertainment," not "Support." It fails the Durability Stop Rule.
  *   **Justification:** "Program provides short-term mood improvement with no evidence of sustained capability change or economic integration. High risk of adaptive preference (lowering expectations vs. raising opportunities)."

  #### Case 2: Home-and-Transport Modifications
  *   **Bucket:** General (Resource/Capability mix).
  *   **Step 1:** Passes.
  *   **Step 2 (Currency):** Vote **C** (Capabilities). The ramp isn't about the money; it's about leaving the house.
  *   **Step 3 (Evidence - C):**
      *   Specific Function? Yes (Mobility).
      *   Barrier Removal? Yes.
      *   Dependency? Ongoing maintenance, but one-time install.
      *   *Complication:* The Means-Test.
  *   **Step 4 (Burden):**
      *   Administrative Burden: **High.** (Applicants drop out due to interview).
      *   *Adjustment:* Apply the 20% penalty to the projected benefit.
      *   Trade-off: "Funding these 10 ramps means we cannot fund the Music Sessions."
  *   **Verdict:** **APPROVE (with conditions).**
  *   **Why:** High capability gain outweighs the burden, *but* the protocol forces you to note the burden as a negative.
  *   **Condition:** The justification must recommend reviewing the means-test process to reduce drop-out.
  *   **Justification:** "High capability gain (independent mobility). Note: Administrative burden reduces uptake by estimated 20%. Recommendation: Streamline intake to maximize conversion of funds to function."

  #### Case 3: Weekly Music Sessions (Profound Disabilities)
  *   **Bucket:** Donor Restricted (Wellbeing). *Note: If you try to run this through the General Bucket, it dies.*
  *   **Step 1:** Passes (Must be tagged Donor Bucket).
  *   **Step 2 (Currency):** Vote **W** (Welfare).
  *   **Step 3 (Evidence - W):**
      *   Self-reported? No (Participants cannot report).
      *   Observed? Yes (Staff/Families report happiness).
      *   Durability? "During and after." (Ambiguous).
      *   *Missing Number Rule:* Apply 50% discount to claimed benefit due to lack of standardized survey data.
  *   **Step 4 (Burden & Trade-off):**
      *   Burden: Low.
      *   Trade-off: **Explicitly State:** "Funding this group costs the same as 40 mobility equipment packages."
  *   **Verdict:** **APPROVE (Donor Funds Only).**
  *   **Why:** It fits the Donor Bucket mandate (Wellbeing). It fails the General Bucket test (Opportunity Cost too high for non-durable gain).
  *   **Justification:** "Program delivers observed wellbeing gains for a population with limited capability for economic integration. Funded via Donor Wellbeing allocation. Opportunity Cost: Equivalent to 40 mobility modifications in General Fund."

  ---

  ### Part 4: The Hard Truths (What This Kills and What It Can't Do)

  #### What will this procedure kill that you won't want to kill?
  1.  **The Confidence Course:** You will likely hate rejecting this. It feels "nice," it's cheap, and it helps "mindset." But the protocol exposes it as **ephemeral**. If you fund it, you are admitting you value *temporary mood* over *structural change*. The protocol forces you to own that choice. If you want to fund it, you must move it to the Donor Bucket and admit it is "Wellbeing," not "Employment."
  2.  **The Music Sessions (from General Funds):** The procedure will slaughter this in the General Bucket. The opportunity cost (40 ramps vs. 1 music group) is too stark to ignore when the currency is "Capabilities." It survives *only* because of the Donor Restriction. If the donor money disappears, this program dies under this protocol.

  #### What can this procedure NOT do?
  1.  **It cannot tell you if you picked the wrong Currency.**
      The protocol assumes that "Capabilities" (mobility, jobs) are generally more valuable than "Welfare" (happiness) for the General Fund. If your city actually needs *hope* more than *ramps*, this procedure will systematically starve hope. It optimizes for what it measures. If you measure functioning, you fund functioning. If you measure happiness, you fund happiness. It cannot tell you which one *should* matter.
  2.  **It cannot solve the "Severe Disability" Equity Problem.**
      Notice Case 3. The profoundly disabled are the most expensive to help and yield the least "measurable functioning." A strict Capability/Resource metric will always discriminate against the most severely disabled in favor of the "almost employed" or "mobile with a ramp." The Donor Bucket saves them here, but that is a fragile protection. The procedure admits this inequity in the "Trade-Off" section but does not resolve it.
  3.  **It creates an Illusion of Objectivity.**
      The "50% Discount for Missing Data" and the "20% Penalty for Burden" are made-up numbers. They are judgement calls wearing a lab coat. They are necessary to force a decision, but do not tell the City Council they are scientific. They are *heuristics for consensus*.

  #### Final Advice for the One-Page Justification
  When you write the justification for the City Council, do not hide the value judgment.
  *   **Bad Justification:** "Program X scored 8/10 on the matrix." (The Council will know this is fake).
  *   **Good Justification:** "We prioritized long-term mobility over short-term wellbeing. This means funding ramps (Case 2) rather than confidence courses (Case 1). We accepted that this disadvantages those with profound disabilities (Case 3), whom we support only through restricted donor funds."

  This procedure does not make you right. It makes you **honest** about why you might be wrong. That is the best a volunteer committee can do.
