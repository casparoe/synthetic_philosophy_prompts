          *   *Correction:* The prompt asks me to anticipate the objection "that the etiological account seems to say a trait can lose its function if its environment changes." I should argue that this is actually a misunderstanding of the view (function is historical, not current-environment dependent) OR argue that even if it does, it's not a problem. The stronger philosophical position (Neander) is that function is determined by *past* selection, so it doesn't vanish with immediate environmental shifts unless the lineage stops reproducing. I will argue that the function is anchored in the *history of selection*, making it stable, not volatile.
