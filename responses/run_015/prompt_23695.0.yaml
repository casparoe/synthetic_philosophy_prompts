  **(Self-Correction on the Environmental Objection):** The prompt says the objection is "the etiological account seems to say a trait can lose its function if its environment changes." I should address this directly. If the environment changes such that the trait is no longer selected for, does it lose function? Some etiological theorists say function is tied to the *history* of selection, so it remains (vestigial organs have functions). Others say it requires *ongoing* selection. I will take the stronger Millikan/Neander line: Function is determined by *past* selection conditions. Therefore, it does *not* lose function merely due to current environmental mismatch. This turns the objection on its head: the etiological account is actually *more* stable than the causal-role account, which makes function dependent on current systemic context.

