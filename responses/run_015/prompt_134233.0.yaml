      *   *Position A (The "Fixed-Point" View):* This sounds like a Russellian or perhaps a structuralist/deflationary take. The idea is that the infinite series isn't adding new ontological commitments; it's just iterating the same logical form. $R(a,b)$ is equivalent to $Inst(R, (a,b))$, which is equivalent to $Inst(Inst, (R, (a,b)))$, etc. The truth conditions don't change. It's a "fixed point" in the semantic sense.
      *   *Position B (The "Primitivist" View):* This is closer to Armstrong or early Wittgenstein (Tractatus). The fact is a fundamental unit. You can't analyze it away into constituents plus a connector. The unity is brute. If you try to analyze it, you lose the unity.

