answer: |-
  ### The question

  **Question 1 (25 marks)**
  Bea suffers a condition with strains A (prior credence 0.8) and B (0.2). Treatments: Surgery (utility 10 if A, 0 if B) and Drug (2 if A, 9 if B). She may take a free test (results +/−) with likelihoods P(+|A)=0.8, P(-|A)=0.2, P(+|B)=0.4, P(-|B)=0.6. Bea has a stable disposition called 'prior-forgetting': upon seeing result R, she sets credence in A to P(R|A)/(P(R|A)+P(R|B)), effectively updating as if her prior were 50/50. She knows this about herself. Before testing, she may: (i) decline the test; (ii) take the test and choose treatment after seeing the result; or (iii) take the test but sign a binding directive committing to a treatment plan regardless of the result.

  (a) Compute Bea's expected utility for options (i), (ii), and the best version of (iii). Show that for a perfect Bayesian the test value is 0, but for Bea it is strictly negative. State how much she should pay to avoid seeing the printout, and explain in one sentence why the numbers differ. (10 marks)
  (b) Identify exactly which step in the standard proof of Good's theorem fails for Bea. Assess the objection that "free information can't hurt because you can always ignore it": does it work for Bea, and what does it presuppose about agency? (8 marks)
  (c) Is Bea irrational to decline the test? Is she irrational to have her disposition? What does this case show about Good's theorem: is it refuted, or does it require extra premises? Can it argue independently for conditionalization? (7 marks)

  *(Calculators permitted. Closed book.)*

  ### Model answer

  **(a) Calculations**
  **Option (i) Decline:** Bea maximizes expected utility (EU) using her prior P(A)=0.8.
  EU(Surgery) = 0.8(10) + 0.2(0) = 8.
  EU(Drug) = 0.8(2) + 0.2(9) = 3.4.
  Bea chooses Surgery. **EU = 8.**

  **Perfect Bayesian Check:**
  P(+) = 0.8(0.8) + 0.2(0.4) = 0.72. P(-) = 0.28.
  P(A|+) = 0.64/0.72 = 8/9. P(A|-) = 0.16/0.28 = 4/7.
  If +: EU(Surg)=8.89, EU(Drug)=2.78 → Choose Surgery.
  If -: EU(Surg)=5.71, EU(Drug)=5.00 → Choose Surgery.
  Since a perfect Bayesian always chooses Surgery, the test changes nothing. **Value = 0.**

  **Option (ii) Test & Choose:**
  Bea's distorted posteriors:
  If +: P*(A) = 0.8/(0.8+0.4) = 2/3. EU*(Surg)=6.67, EU*(Drug)=4.33 → Chooses Surgery.
  If -: P*(A) = 0.2/(0.2+0.6) = 0.25. EU*(Surg)=2.5, EU*(Drug)=7.25 → Chooses Drug.
  Bea's Ex-Ante EU (weighting by true prior probabilities of state/result pairs):
  P(A&+) = 0.64 → Surgery → Utility 10.
  P(B&+) = 0.08 → Surgery → Utility 0.
  P(A&-) = 0.16 → Drug → Utility 2.
  P(B&-) = 0.12 → Drug → Utility 9.
  Total EU = 0.64(10) + 0.08(0) + 0.16(2) + 0.12(9) = 6.4 + 0.32 + 1.08 = **7.8.**
  Test Value = 7.8 - 8 = **-0.2.**

  **Option (iii) Directive:**
  Bea knows her future self will err. She can bind herself to "Always Surgery".
  EU = 8. This is the best directive.
  **WTP to avoid printout:** 0.2 (the difference between Decline/Directive and Unbound Test).
  **Explanation:** Bea's updating rule systematically distorts her credences away from the truth, causing her to switch to a inferior act in state B.

  **(b) Proof Failure and Control**
  The standard proof sums P(r) × Max_a EU(a|P(s|r)). The step that fails is the substitution of the posterior P(s|r). The proof assumes the agent updates via conditionalization, so the posterior is mathematically derived from the prior. Bea substitutes P*(s|r), which is not the true conditional probability. Consequently, the inequality Max_a Σ P(r)EU(a|P*) ≥ Max_a EU(a|P) does not hold.
  The "ignore it" objection fails for Bea. While she can behaviorally ignore the test via a directive, she cannot *doxastically* ignore it once seen; her disposition forces a credence change. The objection presupposes the agent has direct voluntary control over their belief-updating mechanisms (doxastic control), which Bea lacks.

  **(c) Irrationality and Good's Theorem**
  Bea is not irrational to decline the test; given her disposition, declining maximizes expected utility. She is irrational to have the disposition, as it violates the norm of conditionalization and leads to predictable utility loss.
  Good's theorem is not refuted but requires an explicit extra premise: that the agent updates via conditionalization. It cannot be used as an independent argument that one ought to conditionalize, because using the theorem to prove the value of information already presupposes conditionalization in its proof structure (circularity). It shows conditionalization is instrumentally necessary for information to guarantee non-negative value.

  ### Marking scheme

  **Part (a) (10 marks)**
  *   **Prior EU (2 marks):** 1 for correct calculation of Surgery/Drug, 1 for identifying Max EU = 8.
  *   **Perfect Bayesian Check (2 marks):** 1 for showing posteriors lead to Surgery in both cases, 1 for concluding Value = 0.
  *   **Bea's Test EU (2 marks):** 1 for correct distorted posteriors/choices, 1 for correct Ex-Ante EU calculation (7.8).
  *   **Directive & WTP (2 marks):** 1 for identifying Directive EU = 8, 1 for correct WTP (0.2).
  *   **One Sentence Explanation (2 marks):** 2 for linking distortion to suboptimal act choice (must be one sentence).

  **Part (b) (8 marks)**
  *   **Proof Step (3 marks):** 3 for identifying the substitution of the posterior/conditionalization assumption in the maximization step.
  *   **Ignore Objection (3 marks):** 2 for stating it fails for Bea, 1 for distinguishing behavioral vs doxastic ignoring.
  *   **Agency Presupposition (2 marks):** 2 for identifying the presupposition of doxastic control/voluntarism.

  **Part (c) (7 marks)**
  *   **Irrationality (4 marks):** 2 for Decline (Rational), 2 for Disposition (Irrational).
  *   **Good's Theorem Status (3 marks):** 1 for "needs extra premises", 1 for "not independent argument", 1 for clarity on instrumental value.

  ### A-grade vs B-grade

  The single move that separates an A-grade from a B-grade is the handling of the "ignore it" objection in part (b). A B-grade student will correctly note that Bea cannot ignore the information behaviorally without a directive. An A-grade student will explicitly identify that the objection presupposes *doxastic control* (the ability to choose one's updating rule), distinguishing between the ability to ignore data behaviorally versus the inability to prevent the data from altering credences due to a fixed disposition.

  ### Typical wrong answers

  *   **Using distorted credences for final EU:** Calculating Bea's final expected utility using her posterior credences (e.g., averaging 6.67 and 7.25) rather than the prior probabilities. This reveals a confusion between *subjective expected utility at the time of choice* and *objective expected utility of the strategy*.
  *   **Claiming Good's Theorem is refuted:** Arguing that because Bea loses utility, the theorem is false. This reveals a failure to recognize the theorem's hidden premise (conditionalization).
  *   **Ignoring the Directive option:** Calculating the WTP based on the difference between Decline and Test, but failing to note that a Directive recovers the loss, or claiming the Directive is useless.
  *   **Perfect Bayesian Error:** Calculating that a perfect Bayesian would switch to Drug on result '-'. This reveals arithmetic errors in posterior calculation (4/7 vs 3/7).
  *   **"Ignore it" works:** Arguing Bea can just choose to ignore the test result after seeing it. This reveals a misunderstanding of the case stipulation that her disposition is "stable" and "unchangeable."
  *   **Circularity Denial:** Arguing Good's theorem *does* prove you ought to conditionalize. This reveals a lack of understanding of the logical structure of the proof (using conditionalization to prove the value of info).
