answer: |-
  Look, I'm not going to accept discontinuous existence just to save qualitative similarity—that's where the real arbitrariness lies. If I allow that a thing can pop out of existence and pop back as the same entity, what stops me from saying two identical statues could reassemble from the same dust pile? Which one is the original? You'd have no way to decide, and identity would become indeterminate. So I deny it's the same statue. The original endured wholly present until it was crushed, and then it ceased to be. The Thursday arrangement is a numerically distinct duplicate, however perfect the match. This doesn't hurt my view; it protects it. Endurance means being wholly present at every moment of your existence, but it doesn't guarantee that existence can be interrupted and resumed without breaking the chain of identity. Continuity isn't an arbitrary add-on; it's the backbone of being the same concrete thing over time.
