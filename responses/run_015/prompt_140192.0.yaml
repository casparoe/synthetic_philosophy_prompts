      *   **Use Case 2 (Philosophical Induction):** Discussing rational preference for prediction rules. Interlocutor says NFL means all inductive biases (simplicity, etc.) are arbitrary because gains on some worlds = losses on others. Implies: No distribution matters; all assumptions are circular/unjustified.
      *   **User's Hypothesis:** Use 1 presupposes the actual distribution matters; Use 2 denies any distribution can matter rationally. They seem in tension.
