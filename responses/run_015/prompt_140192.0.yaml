      *   **Task:** Disambiguate the claims behind "No Free Lunch" as a menu.
          *   Range: Trivial (opportunity costs) $\rightarrow$ Mathematical (Wolpert-Macready) $\rightarrow$ Epistemological (Humean skepticism).
