  2.  **Deconstruct "No Free Lunch" (NFL):**
      *   *Origin:* Wolpert & Macready (1995/1997).
      *   *Core Math:* Averaged over the set of *all possible* objective functions (uniform prior), all optimization/search algorithms have identical performance.
      *   *Key Condition:* The set of functions must be closed under permutation (or effectively "all possible").
