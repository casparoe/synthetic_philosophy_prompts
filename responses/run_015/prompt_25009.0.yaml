      *   *The "Lopsided" Issue:* To make the math work, the vote *must* be close. How to ensure that? Pre-activity survey? Or just accept the risk and use it as a teaching moment? *Better:* Use a "Secret Ballot" with a known close split (e.g., Red vs. Blue team, where teams are pre-assigned to be equal). No, that's artificial.
      *   *Best Fix:* Acknowledge the lopsided risk. If the vote is lopsided, the lesson is *even stronger* regarding instrumental rationality. But for the *feeling* of decisiveness, we need uncertainty. I will suggest a mechanism to ensure a close race (e.g., two equally appealing options determined by a pre-class poll).
      *   *The "Free Rider" Student:* This is a feature, not a bug. The lesson plan needs to harness this moment.

  4.  **Drafting the Lesson Plan (Iterative Process):**

      *   **Timeline:** 75 mins.
          *   Intro (5)
          *   Round 1 Vote (10)
          *   The Math/Downsian Model (20)
          *   Round 2 Vote (10)
          *   Debrief/Discussion (30)
      *   **Stakes:** Let's go with **"The Review Session Format"** vs. **"Early Dismissal."** Both have utility.
      *   **The Math:** Need to walk through $R = PB - C$.
      *   **The Debrief:** Needs to hit the 3 points requested.

  5.  **Addressing Specific Concerns:**
      *   *Coercion:* Make participation optional but the *outcome* binding on the whole class. This creates the free-rider tension naturally.
      *   *Lopsided Vote:* Suggest pre-testing the options. If one is clearly better, the activity fails. Offer two options that are roughly equal in value (e.g., Candy vs. Extra Credit vs. Time). Actually, **Option A: 5 mins early release. Option B: 5 mins extra review.** This is perfect.
      *   *The "Rational Abstainer":* Plan a specific response protocol. Don't shut them down; ask the class to respond.
      *   *Reflexivity:* This is the hardest part. If everyone learns voting is irrational, $P$ goes up? Only if $N$ drops significantly. In a class of 25, if 10 people abstain, $P$ rises for the remaining 15. I need to make sure this logic is clear in the debrief.

  6.  **Refining the Theory Connection:**
