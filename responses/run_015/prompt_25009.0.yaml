answer: |-
  This is a fantastic teaching moment. You're right to move beyond lecturing Downs; the paradox of voting is one of those concepts that students intellectually grasp but don't *feel* until they are forced to calculate the cost of their own participation.

  However, your proposed stakes (paper deadlines, dropping grades) carry significant pedagogical and administrative risk. Allowing students to vote on grading policy can violate departmental rules, create equity issues for students who miss class, and set a precedent you may regret in week 14.

  Below is a refined lesson plan that keeps the tension high but mitigates the risk. It uses **Class Time** as the currency (universally valued, no policy violations) and structures the debrief to handle the "proud abstainer" and the "lopsided vote" scenarios you're worried about.

  ### Activity Title: The Rational Voter Lab
  **Class Size:** 25 students
  **Time:** 75 minutes
  **Materials:** Slips of paper (ballots), a box, whiteboard, calculator.

  ---

  ### 1. The Stakes (Safe but Real)
  Do not vote on grades or deadlines. Vote on **Class Time**.
  *   **Option A:** The class ends 10 minutes early next week.
  *   **Option B:** The class runs full time, but the last 10 minutes are a structured, high-yield review session for the midterm.

  *Why this works:* Every student values time. Every student values grades. The trade-off is real, subjective, and binding without violating grading policies.

  ### 2. Timeline (75 Minutes)

  | Time | Activity | Notes |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Hook** | Explain the stakes. Emphasize: "The majority rule binds the *entire* class, even those who don't vote." |
  | **05-15** | **Round 1: The Intuitive Vote** | Secret ballot. Collect and count publicly. Record the margin. |
  | **15-35** | **The Downsian Calculation** | Walk through $R = PB - C$. Estimate variables together. |
  | **35-45** | **Round 2: The Rational Vote** | Same ballot. Ask: "Knowing the math, do you vote?" |
  | **45-75** | **Debrief & Theory Mapping** | Connect results to Instrumental vs. Expressive, Free Riding, and Reflexivity. |

  ---

  ### 3. Step-by-Step Rules

  #### Phase 1: The Intuitive Vote (10 mins)
  1.  **Announce the Choice:** Option A (Early Dismissal) vs. Option B (Review Session).
  2.  **The Rule:** Simple majority. If there is a tie, you (the professor) flip a coin.
  3.  **The Catch:** Voting is optional. You can abstain.
  4.  **Action:** Hand out slips. Students write A, B, or "Abstain." Collect in a box. Count live on the board.
      *   *Example Result:* 18 for A, 6 for B, 1 Abstain.

  #### Phase 2: The Math (20 mins)
  Write the **Downsian Equation** on the board:
  $$R = (P \times B) - C$$
  *   **R:** Reward from voting. If $R > 0$, vote. If $R < 0$, abstain.
  *   **P:** Probability your vote is decisive.
  *   **B:** Benefit differential (Utility of A winning minus Utility of B winning).
  *   **C:** Cost of voting (Time, effort, opportunity cost).

  **Guide the estimation (Socratic Method):**
  1.  **C (Cost):** Ask a student who walked from the dorms. "How much is 5 minutes of your time worth?" Let's say \$1. Or just utility units: **C = 1**.
  2.  **B (Benefit):** How much do you prefer A over B? On a scale of 0-100. Let's say the average student prefers Early Dismissal by **B = 50**.
  3.  **P (Probability):** This is the killer. In a class of 25, with a vote of 18-6, what is the chance *one* vote changes the outcome?
      *   *Math:* It's effectively **0**. Even in a close race (13-12), $P$ is roughly $1/\sqrt{N}$ or calculated via binomial distribution. For 25 people, $P$ is roughly **0.01** (generous) to **0.00001** (realistic).
  4.  **Calculate:**
      *   $R = (0.01 \times 50) - 1$
      *   $R = 0.5 - 1 = -0.5$
      *   **Conclusion:** Rational choice is **Abstain**.

  #### Phase 3: The Rational Vote (10 mins)
  1.  Tell them: "You now know the math. The instrumental value of voting is negative. You are buying a lottery ticket with a guaranteed loss."
  2.  Hold Round 2. Same stakes. Same rules.
  3.  Count the votes. **Watch for the drop in turnout.**

  ---

  ### 4. The Debrief (30 mins)
  *This is where you address your three specific goals.*

  #### Point 1: Instrumental vs. Expressive (10 mins)
  *   **Observation:** Did turnout drop in Round 2? If yes, why did anyone still vote?
  *   **Theory:** If $R$ is negative, why vote? Introduce **Expressive Voting** (Brennan & Lomasky).
  *   **Discussion:** "If voting doesn't change the outcome, what does it do?"
      *   It signals identity ("I am the kind of person who votes").
      *   It alleviates anxiety ("I did my duty").
      *   It's consumption, not production.
  *   **Connection to your bar argument:** Your friend was right about the *instrumental* logic, but wrong about the *human* logic. We don't vote to change the world; we vote to affirm our place in it.

  #### Point 2: The "What If Everyone?" Move (10 mins)
  *   **Scenario:** Address the student who proudly abstains (see troubleshooting below).
  *   **Theory:** The Kantian/Rules Utilitarian objection. "If everyone abstained, democracy collapses. Therefore, I must vote."
  *   **Critique:** Ask the class: "Is that logically valid?"
      *   *The Free Rider Problem:* My voting doesn't *cause* others to vote. My abstaining doesn't *cause* others to abstain.
      *   *The Causal Fallacy:* I am not a representative agent. I cannot control the $N$ (total voters), only my own participation.
      *   *Takeaway:* It feels morally right, but it's instrumentally weak. It relies on magic thinking (that my action controls others).

  #### Point 3: Reflexivity & Equilibrium (10 mins)
  *   **The Twist:** This is the sophisticated point you wanted.
  *   **Question:** "If everyone in this class takes my political theory course and learns that voting is irrational, what happens to $P$ (Probability of being decisive)?"
  *   **Logic:**
      1.  Everyone learns $R < 0$.
      2.  Turnout drops (N decreases).
      3.  As $N$ decreases, $P$ (probability of a tie) **increases**.
      4.  If $P$ rises high enough, $R$ might become positive again!
  *   **Conclusion:** The "Paradox" isn't static. It's a dynamic equilibrium. If too many people believe the paradox, voting becomes rational again. This explains why turnout stabilizes rather than collapsing to zero.

  ---

  ### 5. Troubleshooting: What Will Go Wrong

  #### Scenario A: The Lopsided Vote (The "Zero Probability" Problem)
  *   **Risk:** In Round 1, the vote is 24-1. The math shows $P=0$. The activity feels dead.
  *   **Fix:** **Pre-test the options.** Before class, ask 3 students what they prefer. If everyone says "Early Dismissal," change Option B to "Pizza Party." You need genuine ambivalence.
  *   **Teaching Moment:** If the vote *is* lopsided, lean into it. "Look! The paradox is strongest here. If the race isn't close, voting is *literally* a waste of time instrumentally. This explains why people don't vote in safe districts."

  #### Scenario B: The "Proud Abstainer" (The Free Rider)
  *   **Risk:** A student says, "I calculated R. It's negative. I'm not voting in Round 2, and you guys are suckers if you do."
  *   **Reaction:** **Do not shut them down.** This is the golden moment.
  *   **Script:** "Thank you. You are being perfectly Downsian. You are the 'Free Rider.' You get the benefit of the Early Dismissal without paying the cost of voting. But I have a question for the class: If everyone listens to [Student], what happens?"
  *   **Follow-up:** Let the class argue with them. This naturally leads into Point 2 (The "What if everyone?" argument). The student becomes the villain of the piece, which makes the *need* for expressive/normative voting obvious.

  #### Scenario C: Turnout Doesn't Drop
  *   **Risk:** Everyone votes in Round 2 anyway. The math fails to move them.
  *   **Interpretation:** This proves the **Expressive** argument overwhelmingly.
  *   **Script:** "The math said 'don't do it.' You did it anyway. That proves voting isn't an investment; it's a consumption good. You 'bought' the feeling of participation. My friend at the bar was right: it is a warm glow. The question is: Is a warm glow a valid reason for political action?"

  #### Scenario D: Administrative Pushback
  *   **Risk:** Department head hears you let students vote on class time and complains.
  *   **Fix:** Frame it as a "Pedagogical Experiment on Collective Action." If you are worried, make the stakes **Charitable**.
      *   *Option A:* Professor donates $50 to Charity X.
      *   *Option B:* Professor donates $50 to Charity Y.
      *   *Why:* It removes the "coercion" element entirely while keeping the voting mechanics identical. (However, Time is usually more engaging for undergrads).

  ### 6. Instructor Prep Checklist
  1.  **Validate the Stakes:** Ensure you are actually willing to give the 10 minutes early or do the review. If you renege, you lose all credibility.
  2.  **Calculate P beforehand:** Have the binomial probability for N=25 ready on a slide so you don't fumble the math during class. (For N=25, P of a tie is roughly 0.15 if preferences are 50/50, but drops drastically with skew).
  3.  **Prepare the "Proud Abstainer":** Have a specific compliment ready for them ("You are the only purely rational actor in the room") to diffuse tension while isolating their position.

  ### Summary for your Debrief
  End the class by returning to your bar argument.
  *"My friend said voting is just buying a lottery ticket for a warm glow. Today showed us he's instrumentally right. But if voting were only instrumental, democracy would have collapsed centuries ago. We vote because we aren't just calculators; we're citizens. The paradox isn't a mistake in the math; it's a limitation of using math to explain human duty."*
