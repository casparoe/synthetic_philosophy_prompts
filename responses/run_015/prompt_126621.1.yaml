  anyway, i want the full spec, not just the usual continuity fight. can you write the desiderata for an adequate theory of personal survival and what actually matters in it? i need the list of what it must deliver: the cases it has to handle (standard teletransport, split-brain fission, maybe this narrative-drift branching case), the distinctions it can't collapse (survival versus identity versus what we rationally care about, being the same person versus being psycholgically continuous), and what it can't contradict from neuroscience or biology. for each, say why it's a requirement and flag which ones are non-negotiable versus just camp preferences. also say if some subset is jointly unsatisfiable — like if demanding both no-branching and full psychological continuity is impossible once split-brain cases are on the table. then briefly, how do the usual suspects — the psychological-continuity view, bodily-continuity view, and a narrative-self view — do against the list? don't do a full scorecard, just where they clearly fail or pass. and please, no bibliographies or citation lists — i'm writing for readers who can't check sources and i don't want to fake authority.
