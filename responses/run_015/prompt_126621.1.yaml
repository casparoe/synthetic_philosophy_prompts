answer: |-
  Here is the specification sheet you asked for. It breaks down the logical, phenomenological, and scientific requirements for a theory of personal survival, flags the hard constraints against the philosophical preferences, and highlights where the standard theories break under pressure.

  ### The Spec: Desiderata for a Theory of Personal Survival

  To be adequate, a theory of personal identity/survival must satisfy the following requirements. I have categorized them by **Non-Negotiable** (logical or empirical hard limits) and **Camp Preferences** (metaphysical choices where reasonable people disagree).

  #### 1. The Logical Constraints (Non-Negotiable)
  *   **Transitivity of Identity:** If Person A is the same as Person B, and Person B is the same as Person C, then Person A must be the same as Person C. A theory cannot violate basic logic.
      *   *Why:* Identity is a one-to-one relation. You cannot be identical to two different people simultaneously without breaking the definition of "identity."
  *   **The Fission Handling:** The theory must explicitly state what happens when one psychological stream splits into two (e.g., split-brain cases or your friend's non-destructive teleporter).
      *   *Why:* If the theory says "Psychological Continuity = Identity," but allows for fission, it violates Transitivity (see above). The theory must either deny fission is possible, deny continuity equals identity, or redefine identity.

  #### 2. The Phenomenological Constraints (Camp Preferences)
  *   **The "What Matters" Distinction:** The theory must distinguish between *Strict Identity* (Am I numerically the same entity?) and *Survival* (Is there someone in the future who is psychologically continuous enough that I should care about them now?).
      *   *Status:* **Camp Preference.** Traditionalists say Identity is what matters. Revisionists (like Parfit) say Survival is what matters, even if Identity is lost. Your spec needs to pick a lane or explain the gap.
  *   **The Narrative Drift Accommodation:** The theory must account for the fact that memory is reconstructive, not reproductive. In your friend's case, the Mars copy develops "grief they never lived" and a diverging narrative.
      *   *Status:* **Camp Preference.** A strict Lockean view might say any significant memory error breaks identity. A Narrative view says identity *is* the drift. A theory must decide if gradual divergence preserves survival or kills it.

  #### 3. The Empirical Constraints (Non-Negotiable)
  *   **Neurobiological Plausibility:** The theory cannot treat memory like a computer file. It must acknowledge that recalling a memory changes the memory (reconsolidation).
      *   *Why:* If a theory requires "exact memory copy" for identity, it contradicts neuroscience. No two moments in a human brain are identical.
  *   **Organism Continuity:** The theory must account for the fact that we are biological animals. We survive sleep, coma, and cell replacement.
      *   *Why:* A theory that says you cease to exist during deep sleep or when your cells turnover is empirically false regarding human biology.

  ---

  ### The Joint Unsatisfiability (The Trilemma)

  You asked if some subset of these is jointly unsatisfiable. **Yes.** This is the core engine of the debate. You cannot hold these three propositions simultaneously:

  1.  **Identity is what matters.** (We care about being the *same* person, not just a copy).
  2.  **Psychological Continuity is the criterion for Identity.** (Memories/character make you, you).
  3.  **Fission is possible.** (One person can become two psychologically continuous people).

  **Why it breaks:**
  If Fission happens (your friend's teleporter leaves the original in a coma and sends a copy to Mars), the Original is psychologically continuous with the Copy.
  *   If (2) is true, Original = Copy.
  *   But if the Original wakes up *and* the Copy wakes up, Original ≠ Copy (they are two people in different places).
  *   Therefore, (1) and (2) cannot both be true if (3) is possible.

  **The Fix:**
  *   **Drop (1):** Say Identity doesn't matter; only Continuity matters (Parfit's move).
  *   **Drop (2):** Say Biology matters, not Psychology (Animalism).
  *   **Drop (3):** Say Fission is metaphysically impossible (rarely defended).
  *   **Add a "No-Branching" Clause:** Say Psychological Continuity counts as Identity *only if* it is unique. (This saves logic but makes survival depend on what happens to someone else, which feels arbitrary).

  ---

  ### Evaluation of the Usual Suspects

  Here is how the standard theories stack up against the spec above.

  #### 1. The Psychological Continuity View
  *   **Core Claim:** You are where your memories and character traits are.
  *   **Passes:** Standard Teletransport. It handles the "Narrative Drift" well by allowing degrees of connection. It aligns with how we intuitively treat memory loss (severe loss feels like death).
  *   **Fails:** **The Fission Constraint.** Without modification, it violates the Transitivity of Identity. If you branch, you can't be identical to both successors.
  *   **Fails:** **Neurobiological Plausibility.** If it demands "exact" memory matches, it contradicts how memory works. It must be softened to "overlapping chains of continuity," which introduces vagueness (at what % of memory loss do you die?).

  #### 2. The Bodily Continuity View (Animalism)
  *   **Core Claim:** You are your living biological organism.
  *   **Passes:** **Organism Continuity.** It handles sleep, coma, and cell turnover perfectly. It handles your friend's twist easily: The person in the coma is the survivor; the Mars copy is a distinct twin with false memories.
  *   **Fails:** **Standard Teletransport.** If the body is destroyed, you are dead. Full stop. This contradicts the intuition many have that "I would wake up on Mars."
  *   **Fails:** **The "What Matters" Distinction.** It struggles to explain why we care so much about psychological future (e.g., why we fear dementia more than limb loss) if the body is the only thing that matters.

  #### 3. The Narrative Self View
  *   **Core Claim:** You are the story you tell yourself about yourself.
  *   **Passes:** **Narrative Drift.** This is its strongest suit. It handles your friend's "emotional residue" case perfectly. The Mars copy and Earth original become different people because their stories diverge. Identity is a gradient, not a switch.
  *   **Fails:** **Transitivity of Identity.** Because narratives are vague and subjective, this view often dissolves "Identity" entirely into "Similarity." It struggles to give a hard answer on legal or moral responsibility (e.g., which one goes to jail?).
  *   **Fails:** **Neurobiological Plausibility (Sort of).** While it fits memory reconstruction, it risks making identity too fragile. If you lose your narrative (severe amnesia), this view suggests you cease to exist, which clashes with the biological reality that the person is still there.

  ### Summary for Your Feature

  If you are writing about tech, the **Psychological Continuity** view is the one most transhumanists implicitly rely on (uploading the mind), but it breaks on the logic of branching. The **Bodily** view is the legal and biological standard, but it makes teleportation death. The **Narrative** view is the most honest about the human experience of your friend's "drift" scenario, but it offers the least comfort for those wanting to know if they will *survive*.

  The "Non-Negotiable" takeaway for your readers is this: You can have logical consistency, or you can have the intuition that you'd survive teleportation, but if branching is on the table, you cannot have both without redefining what "survival" means.
