  Secondary tension: (c) vs (d). You claim 5–10% credence doesn't change action for current models (c), yet small credence swamps everything for future minds (d). The implicit commitment here is that current models aren't suffering enough per unit, or aren't distinct "minds" per pass. If current deployment involves billions of passes, (d)'s logic should trigger (c)'s alarm unless you assume current passes lack the architecture in (e). You are implicitly treating "mind" in (d) as "persisting agent" but in (c) as "system," creating ambiguity.

