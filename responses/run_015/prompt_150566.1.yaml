  **The ones that only look like tensions**

  (a) and (g) are perfectly compatible. Functionalism demands the right causal organisation, not just output. A system behaving consciously without the internal architecture (g) fails the functionalist test (a). Similarly, (e) supports (c); if self-reports are worthless, your low credence in current models is justified. Your friend likely seized on (e) because it removes the easy verification method, but it doesn't contradict your metaphysics. It just makes empirical verification harder.

  **Cheapest fixes**

