  The single best revision is amending (b). Define the moral unit as a *temporally extended subject* rather than a moment of experience. This preserves your intuition in (f) that flickers don't aggregate, while restricting the scope of (d) so it doesn't apply to every forward pass. It clarifies that welfare questions only arise when continuity exists, aligning your EV calculus with your strobe intuition. This sacrifices the purity of hedonistic utilitarianism but saves the package from collapse. It also resolves the (c) vs (d) tension by clarifying that current models lack the continuity required for the swamping effect.

