      *   *The "Push":* If the symbol pushes the substrate, and the symbol *is* a deformation of the substrate, this sounds like a feedback loop where the pattern dictates the physics of the medium itself. This is akin to non-linear dynamics where the amplitude/shape of a wave changes the propagation speed or medium density.

