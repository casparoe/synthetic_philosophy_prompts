      *   *Objection 1: The "Wrong Questions" Problem.* If the distribution $D$ is skewed, a false theory could be "more truthlike" than a true one relative to $D$.
          *   *Counter:* The user defines $D$ as part of the metric. But if $D$ is *too* flexible, the metric loses normative bite.
      *   *Objection 2: The "Deep Structure" Intuition.* We often feel a theory is closer to the truth because it posits the *right entities*, even if it makes worse predictions on current questions (e.g., early atomic theory vs. phenomenological thermodynamics).
