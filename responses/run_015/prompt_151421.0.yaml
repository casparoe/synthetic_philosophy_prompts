      *   *Key Insight:* The "Distribution" is the free parameter. If I can choose the distribution to make Phlogiston > Oxygen, is the view broken?
      *   *Refining the Historical Case:* I need a case where the *later* theory is intuitively closer to the truth, but the *earlier* theory wins on almost any reasonable question distribution available at the time or even retrospectively for a specific domain.
      *   *Idea:* **The Case of Ignaz Semmelweis / Germ Theory.**
          *   Miasma theory could predict outbreaks based on "bad air" markers (swamps, smells).
