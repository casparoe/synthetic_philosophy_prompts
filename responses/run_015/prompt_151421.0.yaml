  2.  **Deconstruct the View (Question-Relative Verisimilitude - QRV):**
      *   It's essentially a pragmatic or contextualist account of truthlikeness.
      *   It aligns closely with "truth approximation" accounts that focus on specific parameters rather than whole theories.
      *   The "collapse" worry is the strongest philosophical threat. If $V(T, D)$ is just $E[Accuracy(T, D)]$, and $D$ is determined by "what we care about," then $V$ tracks utility, not mind-independent truth.

