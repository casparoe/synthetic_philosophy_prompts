          *   QRV says MOND > DM.
          *   *Is this intolerable?* Many realists say yes.

  5.  **Addressing the "Collapse" Objection:**
      *   If $V(T, D) = \text{Utility}(T, D)$, then "Truth" drops out.
      *   Defense: Utility depends on $T$'s mapping to the world. But if $D$ is "questions we care about," and we care about survival, it's pragmatic.
      *   To save "Truth," $D$ must be fixed by the *domain*, not by *interests*. But who fixes the domain?
      *   If the domain is "all facts in region R," we return to structural problems (Miller's paradox).
      *   If the domain is "questions," we need a theory of questions that isn't just "propositions we want to know."

  6.  **Addressing Unfalsifiability (Free Parameter):**
      *   If $D$ is adjustable post-hoc to save the ranking, it's degenerate.
      *   If $D$ is fixed independently (e.g., by experimental capacity, or by the natural kinds of the domain), it's not.
      *   *Bug or Feature?* For a *normative* account of science, it's a bug (we want to say which $D$ *ought* to be used). For a *descriptive* account, it's a feature.

  7.  **Ranking Defeaters:**
      *   *Fatal:* The "Ontological Depth" case (Right stuff, wrong predictions). QRV cannot distinguish "lucky fit" from "structural grasp" if questions are purely observational.
      *   *Fatal:* The "Trivialization" risk. If any ranking can be saved by tweaking $D$, the theory explains nothing.
      *   *Embarrassing:* The "Aim of Science" concession. Admitting it's just reliability.
      *   *Shrug:* The "Simpliciter" loss. We never had simpliciter truthlikeness anyway.

  8.  **Drafting the Response:**
      *   *Tone:* Philosophical peer-to-peer. Sharp, no fluff, no citations.
      *   *Structure:*
