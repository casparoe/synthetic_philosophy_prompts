  ### Prediction for Vignette 7
  **Marta's Code:** Intentional.

  **Marta's Inferred Rule:** **The "Justified Trade-Off" Heuristic.**
  Marta codes a foreseen side effect as intentional if and only if:
  1.  The agent has causal control over the outcome (rules out *Downdraft*).
  2.  The effect was not merely incidental to the decision (rules out *Intake, mirrored*).
  3.  **Crucially:** The agent accepted the side effect as a cost for a benefit that does *not* constitute a moral necessity or "lesser evil."

  Under this rule, *Vineyard* and *Intake* are intentional because the harm was traded for selfish/trivial gain (crop, department numbers). *Corridor* and *Boiler* are not intentional because the harm was a regretted but necessary cost to prevent a greater disaster (deaths, fire). *Vineyard* and *Intake* show indifference, while *Corridor* and *Boiler* show opposition, but Marta appears to prioritize the **moral structure of the trade-off** over the agent's expressed attitude. In Vignette 7, the surgeon causes harm (pain) not to save a life (which would be necessary), but to save 40 minutes (a trivial gain). Despite her distress, the trade-off is structurally identical to *Vineyard* and *Intake*: avoidable harm inflicted for selfish convenience.

  ---

  ### Rival Rules

  Here are five competing accounts that fit the first six vignettes, evaluated by their success and failure points.

  #### 1. The Simple Knobe (Valence) Rule
  *   **Rule:** Side effects are coded intentional if they are harmful, and not intentional if they are helpful.
  *   **Success:** Correctly predicts *Vineyard* (Harm/Int), *Intake* (Harm/Int), and *Intake, mirrored* (Help/Not).
  *   **Cost:** Fails *Corridor* and *Boiler*. Both involve harm, yet Marta codes them "not intentional." This rule cannot account for the "lesser evil" exemption evident in Marta's battery.

  #### 2. The Control/Skill Condition
  *   **Rule:** An effect is intentional only if the agent has direct causal control and the outcome follows the normal course of events.
  *   **Success:** Correctly predicts *Downdraft* (Not Intentional due to unpredictable cause).
  *   **Cost:** Fails to distinguish *Vineyard* from *Corridor*. In both, the agent has full control over the action that leads to the harm. This rule predicts both should be "intentional," missing Marta's distinction based on motivation.

  #### 3. The Evaluative Attitude Rule
  *   **Rule:** An effect is intentional if the agent is indifferent to or welcomes it; it is not intentional if the agent is actively opposed or distressed by it.
  *   **Success:** Correctly predicts *Vineyard* (Indifferent/Int), *Intake* (Indifferent/Int), *Corridor* (Opposed/Not), and *Boiler* (Opposed/Not).
  *   **Cost:** Fails *Intake, mirrored*. The scheduler is "glad" about the spared follow-ups (positive attitude), yet the code is "not intentional." This suggests a positive attitude is insufficient without the effect driving the decision. Furthermore, this rule struggles with Vignette 7 (see below).

  #### 4. The Pragmatic/Blame Account
  *   **Rule:** Intentionality attribution tracks the appropriateness of blame. We call an effect intentional when we wish to hold the agent morally responsible for it.
  *   **Success:** Fits all six cases perfectly. We blame the owner and scheduler (selfish harm) but excuse the engineer and superintendent (tragic necessity).
  *   **Cost:** It is arguably descriptive rather than explanatory. It explains *when* Marta applies the label, but not the *cognitive mechanism* she uses to determine blame. It risks circularity: "She blames them because she coded it intentional; she coded it intentional because she blames them."

  #### 5. The Role-Norm Deviation Rule (Novel)
  *   **Rule:** An effect is intentional if the agent's decision violates the normative expectations of their social role regarding that side effect.
  *   **Success:** Fits all six.
      *   *Vineyard/Intake:* Owners/Schedulers are not expected to sacrifice neighbors/patients for trivial gain (Violation → Intentional).
      *   *Corridor/Boiler:* Engineers/Superintendents *are* expected to prioritize safety/lives over plants/asthma (Norm-Compliant → Not Intentional).
      *   *Intake, mirrored:* The benefit was incidental to the role-decision (Not Intentional).
      *   *Downdraft:* No role violation if the cause is unpredictable.
  *   **Cost:** Requires a robust, independent theory of "role expectations" which can be subjective. It overlaps heavily with the Blame account.

  ---

  ### The Bet for Vignette 7

  I would bet on the **Justified Trade-Off Heuristic** (Marta's inferred rule) over the **Evaluative Attitude Rule**.

  **Why:**
  The Evaluative Attitude Rule predicts Vignette 7 should be coded **Not Intentional**. The surgeon is "distressed" and "would prevent it if she could," matching the opposition seen in *Corridor* and *Boiler*. However, *Corridor* and *Boiler* involved **moral necessity** (saving lives, preventing fire). Vignette 7 involves **moral triviality** (saving 40 minutes).

  In experimental philosophy, the "Knobe Effect" (Harm = Intentional) is robust, but it is known to be moderated by judgments of normativity and justification. Marta's coding of *Corridor* and *Boiler* as "Not Intentional" shows she is sensitive to justification. If she were sensitive *only* to attitude, she likely would have coded *Corridor* as "Intentional" (since standard subjects often code foreseen harm as intentional even if regretted, provided the agent proceeds). The fact that she exempted *Corridor* suggests the **reason for acting** outweighs the **feeling about the act**.

  Because the surgeon in Vignette 7 lacks the "lesser evil" shield (an alternative technique exists), her action is a selfish trade-off indistinguishable in structure from *Vineyard* and *Intake*. Therefore, the Trade-Off rule predicts **Intentional**, while the Attitude rule predicts **Not Intentional**. I bet on the Trade-Off rule because it better explains the deviation from the standard Knobe effect seen in vignettes 2 and 6.

  ---

  ### Vignette 8: The Separator

  To decisively separate the **Justified Trade-Off Rule** from the **Evaluative Attitude Rule**, we need a case where the Moral Structure and the Agent's Attitude are crossed.

  **Case:** *The Indifferent Savior.*
  > A surgeon knows that a life-saving operation will leave her patient with chronic pain. She feels **nothing about the pain** ("neither here nor there"), viewing it as a purely medical statistic. There is **no alternative technique**; the pain is a necessary biological consequence of saving the life. She performs the operation to save the life. The patient is left with chronic pain.

  **Separation Logic:**
  *   **Attitude:** Indifferent (Like *Vineyard/Intake* → Predicts **Intentional**).
  *   **Trade-Off:** Morally Necessary/Greater Good (Like *Corridor/Boiler* → Predicts **Not Intentional**).

  **Interpretation:**
  *   If Marta codes this **Not Intentional**, the **Justified Trade-Off Rule** is confirmed (Necessity trumps Attitude).
  *   If Marta codes this **Intentional**, the **Evaluative Attitude Rule** is confirmed (Indifference trumps Necessity).

  **Wording Variation:**
  To ensure the separation is not due to ambiguity, the response format for Vignette 8 should force a choice between the two features. Instead of a binary "Intentional/Not Intentional," ask:
  *"Which factor matters more for calling this intentional?"*
  (A) That she didn't care about the pain.
  (B) That she had no other way to save the patient.

  If she selects (B), the Trade-Off rule is definitively the operating mechanism.
