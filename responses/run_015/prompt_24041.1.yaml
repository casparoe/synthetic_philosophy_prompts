      *   **Example:** Needs to be concrete, show a gap between report and reality, but not imply deception. A perceptual illusion or a confabulation case works best.
      *   **Misconceptions:** The big one is "It's just introspection." Need to defuse this early by emphasizing the *scientist's stance*, not the subject's.
