answer: |-
  **Dependencies & Order**
  First, crack "privileged access." Students assume subjects know their minds best. You must establish that self-reports can be sincere yet false *before* defining the term. If you define "heterophenomenology" before challenging authority, they'll hear "phenomenology" and assume first-person privilege. Order: Intuition → Challenge → Method.

  **The Example**
  Use Nisbett's stocking study. Subjects choose between identical stockings, inventing reasons for preference (e.g., "texture").
  *   **Needs:** Sincerity (no lying) and Error (reasons are confabulated).
  *   **Lacks:** Neuroscience jargon. Keep it psychological.
  *   **Function:** Separates the *report* (data) from the *cause* (theory). It shows the subject is the "oracle," not the authority.

  **Misconceptions & Defusal**
  1.  *"It's just introspection."* Defuse at the method introduction. Introspection is the subject's act; heterophenomenology is the scientist's recording of that act as text.
  2.  *"It denies feelings."* Defuse during the example. We aren't saying the feeling is fake, just that the *explanation* is data, not fact.

  **Sequence (50 mins)**
  1.  **Poll (5 mins):** "Can you be wrong about your own mind?" Elicit discomfort.
  2.  **Case Study (15 mins):** Present Stocking Case. Highlight sincere error.
  3.  **Definition (15 mins):** Define Heterophenomenology: Treating the report as a publication, not a revelation. Address "Just Introspection" worry explicitly here.
  4.  **Assessment (5 mins):** See below.
  5.  **Wrap (10 mins):** Q&A.

  **Assessment Question**
  "A patient claims they feel pain in a missing limb. The heterophenomenologist records: (A) The pain is real, (B) The patient is lying, (C) The patient believes they are in pain."
  *   **Correct:** C. (A is metaphysics, B is accusation, C is data).

  **Exclusions**
  Explicitly bracket the "Hard Problem" and whether qualia exist. Tell them: "We aren't solving what consciousness *is*, only how to *study* it scientifically." Do not dive into neural correlates yet; keep it methodological.
