      3.  **The Example (20-35 mins):** Use the "Left/Right Choice" confabulation (Nisbett). Subject picks an item, makes up a reason. The report is data, not truth. This distinguishes it from introspection (which seeks truth).
      4.  **Misconception Defusal:** When introducing the example, explicitly state: "Introspection tries to look inside; heterophenomenology listens to the output."
      5.  **Assessment:** "If a subject says they see a red afterimage, but neuroscience shows no corresponding activity, what does the heterophenomenologist do?"
      6.  **Exclusions:** Don't discuss whether qualia exist. Bracket it.

