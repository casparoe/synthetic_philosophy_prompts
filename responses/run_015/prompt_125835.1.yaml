answer: |-
  # SYSTEM SPECIFICATION: NON-TRIVIAL INCONSISTENT REASONING ENGINE

  ## 1. FUNCTIONAL REQUIREMENTS (TARGET CASES)
  The system must accept inconsistent input sets without collapsing into triviality (where every well-formed formula becomes derivable). It must successfully model the following specific domains:

  *   **Semantic Closure (The Liar Family):** The system must allow a language to contain its own truth predicate. It must handle sentences that assert their own falsity ($\lambda \leftrightarrow \neg T(\lambda)$) without requiring a hierarchy of languages or declaring the sentence meaningless.
  *   **Unrestricted Comprehension (Set Theory):** The system must allow the formation of sets defined by any property, including $\{x \mid x \notin x\}$, without deriving that all sets are identical.
  *   **Normative Conflicts (Deontic Overlap):** The system must handle cases where two valid authorities issue conflicting obligations regarding the same act at the same time (e.g., Statute A obligates $\phi$, Statute B obligates $\neg \phi$). The output must not imply that every possible act is obligatory.
  *   **Transient Informational States:** The system must process data streams where contradictory states are reported simultaneously from distinct sources without rejecting the entire dataset.

  ## 2. TAXONOMIC DISTINCTIONS (NON-COLLAPSE CONDITIONS)
  The system must maintain strict boundaries between the following concepts. Collapsing these distinctions renders the system useless for diagnosis.

  *   **Contradiction vs. Ambiguity:**
      *   *Requirement:* $P \land \neg P$ must not be treated as equivalent to "$P$ is vague" or "$P$ has multiple senses."
      *   *Reasoning:* Ambiguity is resolved by disambiguation; contradiction is resolved (in this system) by containment. Conflating them prevents the system from identifying genuine logical conflicts.
  *   **Dialetheia vs. Absurdity:**
      *   *Requirement:* The system must distinguish between a *true contradiction* (a sentence where both it and its negation hold) and a *false contradiction* (a sentence that is simply false).
      *   *Reasoning:* Not all contradictions are true. Most are errors. The system must allow for the possibility of true contradictions without mandating that all contradictions are true.
  *   **Negation Types:**
      *   *Requirement:* The negation operator ($\neg$) must be a **contradictory-forming** operator, not a subcontrary one.
      *   *Reasoning:* $\neg P$ must mean "P is false," not "P is contrary" or "P is distinct." If $\neg$ is weakened too much, the system is no longer paraconsistent; it is just paracomplete or fuzzy.

  ## 3. CLASSICAL LOGIC INHERITANCE (PRESERVE/REJECT)
  The system must explicitly declare its stance on standard classical inference rules.

  ### 3.1 Mandatory Rejections
  *   **Ex Falso Quodlibet (Explosion):** $(A \land \neg A) \vdash B$ must be invalid.
      *   *Why:* This is the definition of paraconsistency. Without this rejection, any inconsistency trivializes the database.
  *   **Disjunctive Syllogism (Unrestricted):** $(A \lor B), \neg A \vdash B$ must be restricted or invalid.
      *   *Why:* In the presence of explosion avoidance, retaining full Disjunctive Syllogism often allows explosion to be re-derived via disjunctive introduction.

  ### 3.2 Mandatory Preservations (Ideal)
  *   **Modus Ponens:** $A, A \to B \vdash B$.
      *   *Why:* Without this, the conditional loses its inferential force. The system becomes unable to chain reasoning.
  *   **Non-Contradiction (as a heuristic):** $\neg(A \land \neg A)$ should hold in consistent domains.
      *   *Why:* The system should not force contradictions where none exist. It should be *compatible* with classical logic in consistent sub-domains.
  *   **De Morgan's Laws:**
      *   *Why:* To ensure negation interacts predictably with conjunction and disjunction.

  ## 4. HARD CONSTRAINTS VS. CONFIGURABLE PREFERENCES
  This section distinguishes between architectural necessities and philosophical policy settings.

  ### 4.1 Hard Constraints (Architecture)
  *   **Non-Triviality:** There must exist at least one theory within the system where a contradiction holds, but not every sentence holds.
  *   **Semantic Closure:** The object language must be able to express the semantics of the object language.
  *   **Detachment:** There must be some mechanism to move from premises to conclusions (even if Modus Ponens is restricted, some form of implication must work).

  ### 4.2 Configurable Preferences (Policy)
  *   **Scope of Dialetheia:**
      *   *Option A (Conservative):* True contradictions are permitted *only* in semantic/set-theoretic limit cases (paradoxes). Empirical/physical descriptions must remain consistent.
      *   *Option B (Radical):* True contradictions are permitted in empirical domains (e.g., quantum states, changing boundaries, legal conflicts).
      *   *Note:* Option A is sufficient for mathematical rescue; Option B is required for ontological realism regarding change and conflict.
  *   **Truth Value Gluts vs. Gaps:**
      *   *Preference:* The system should prioritize **Gluts** (both true and false) over **Gaps** (neither true nor false) to handle the Liar, though it may tolerate gaps for category mistakes.

  ## 5. KNOWN TENSIONS (THE IMPOSSIBLE CLUSTER)
  The following cluster of features is jointly impossible to maximize simultaneously. The system architect must sacrifice at least one.

  **The Trilemma:**
  1.  **Explosion Avoidance:** $(A \land \neg A) \nvdash B$.
  2.  **Full Modus Ponens:** $A, A \to B \vdash B$ holds universally.
  3.  **Relevance/Transitivity:** The entailment relation is transitive and requires content overlap between premises and conclusion.

  **The Tension Map:**
  *   If you keep **Explosion Avoidance** and **Full Modus Ponens**, you typically lose **Transitivity** of entailment. (You can have $A \vdash B$ and $B \vdash C$, but not $A \vdash C$ in certain inconsistent contexts).
  *   If you keep **Explosion Avoidance** and **Transitivity**, you typically must weaken **Modus Ponens** (e.g., it holds as a theorem $A \land (A \to B) \to B$, but not as a rule of inference).
  *   If you keep **Modus Ponens** and **Transitivity**, you typically reintroduce **Explosion** unless you severely restrict the structural rules (like Contraction or Weakening), which makes the logic "relevant" but computationally expensive and counter-intuitive for standard mathematics.

  *Recommendation:* For a general-purpose spec, sacrifice unrestricted Modus Ponens as a *rule* in favor of preserving it as a *theorem*, or accept non-transitive entailment in inconsistent sub-regions.

  ## 6. EDGE CASE SPECIFICATION: THE DATABASE TIMESTAMP
  **Scenario:** A distributed database records that Record $R$ has `Status: Updated` at Timestamp $T$, and simultaneously records `Status: Not Updated` at Timestamp $T$.

  **Diagnostic Protocol:**
  The logic must not immediately classify this as a Dialetheia (true contradiction). It must run the following classification tree:

  1.  **Check Granularity:** Is $T$ atomic? If $T$ is a range (e.g., 12:00:00.000 to 12:00:00.001), the contradiction is apparent, not real. One update occurred at the start, one at the end.
      *   *Verdict:* **Ambiguity/Vagueness.** Resolve by refining $T$.
  2.  **Check Source Authority:** Do the two records come from the same node?
      *   *If Different Nodes:* This is an **Epistemic Conflict**. The system represents "Node 1 says Updated" and "Node 2 says Not Updated." No contradiction in reality, only in reports.
      *   *If Same Node:* This is an **Ontic/State Conflict**.
  3.  **Check Causal History:** Is there a valid transaction log that permits a state to be both $S$ and $\neg S$?
      *   *If No:* This is a **System Error (False Contradiction).** The logic should flag this for deletion/correction, not acceptance.
      *   *If Yes (e.g., race condition designed to allow dual states):* This is a **True Contradiction (Dialetheia).** The system must allow queries to return both values without crashing.

  **Requirement:** The logic must provide a meta-predicate `Is_Glitch(P)` vs `Is_Dialetheia(P)`. If the system treats the database glitch as a Dialetheia by default, it is unfit for engineering. If it treats all Dialetheias as Glitches, it is unfit for semantics. The spec requires the capacity to distinguish them.
