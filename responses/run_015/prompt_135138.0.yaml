answer: |-
  Here is a breakdown of the precise claims hiding behind the "same river" slogan, structured for your seminar. This moves from the trivial physical observation to the heavy metaphysics, specifically mapping how each applies to the Oxford University case.

  ### 1. The Trivial Materialist Reading (The "Water Molecules" Claim)
  *   **The Claim:** Numerical identity requires the exact same constituent matter. Since the water molecules in the river are different, it is a different river. Since the bricks and lecturers at Oxford are different, it is a different university.
  *   **Metaphysical Commitment:** Mereological Essentialism (an object is the sum of its parts; change the parts, you change the object).
  *   **Verdict on Oxford:** **Supports the claim that Oxford is gone.**
  *   **Critique:** This is generally considered too strict for macro-objects. By this logic, *you* are not the same person you were five years ago because your cells have replaced themselves. It renders "persistence" impossible for almost anything.
  *   **Status:** **Mostly Empty Wordplay.** It uses a definition of "same" (numerical identity of matter) that we don't use for ordinary objects.

  ### 2. The Structural/Functionalist Reading (The "Riverbed" Claim)
  *   **The Claim:** Identity is preserved by the continuity of structure, function, or pattern, not matter. A river is defined by its channel and flow, not its water. A university is defined by its charter, curriculum, and institutional role, not its buildings or staff.
  *   **Metaphysical Commitment:** Hylomorphism (Aristotelian form/matter distinction) or Functionalism.
  *   **Verdict on Oxford:** **Refutes the claim that Oxford is gone.** Oxford persists because the "form" (the institution) survived the replacement of the "matter" (buildings/people).
  *   **Status:** **Standard Common Sense.** This is how we legally and socially treat institutions.

  ### 3. The Spatiotemporal Continuity Reading (The "Continuous Path" Claim)
  *   **The Claim:** An object persists if there is a continuous path through space and time connecting its earlier stage to its later stage, even if parts are swapped gradually (The Ship of Theseus).
  *   **Metaphysical Commitment:** Continuity Theory of Identity.
  *   **Verdict on Oxford:** **Refutes the claim that Oxford is gone.** As long as there was no break in the administration or legal existence (e.g., it wasn't dissolved and recreated), the continuity holds despite total turnover.
  *   **Status:** **Robust Metaphysics.** This is the standard counter to Heraclitus.

  ### 4. The Perdurantist / 4D-Process Reading (Your Tutor's Point)
  *   **The Claim:** Objects are not 3D things that "stay put" through time (Endurantism); they are 4D "worms" extended across time (Perdurantism). Oxford is not a thing that *has* a history; Oxford *is* its entire history from founding to extinction.
  *   **Metaphysical Commitment:** Perdurantism / Temporal Parts Theory.
  *   **Verdict on Oxford:** **Reframes the debate.** Strictly speaking, "Oxford Today" and "Oxford 1200" are different *temporal parts* of the same 4D object.
      *   If your peer says "It's not the same university," they are confusing a *temporal slice* with the *whole worm*.
      *   The 4D view says the whole worm exists timelessly. The "turnover" is just variation along the temporal axis of the worm.
  *   **Status:** **Standard Perdurantism.** This isn't a niche social-ontology twist; it's standard analytic metaphysics applied to social objects. It supports the idea that Oxford is a **process** rather than a static substance.

  ### 5. The Diachronic Institutional Essence Reading (The "Social Kind" Claim)
  *   **The Claim:** Different kinds of objects have different persistence conditions. Rivers are natural kinds; Universities are social kinds. The "essence" of a university is not material but deontic (based on rules, rights, and recognition).
  *   **Metaphysical Commitment:** Social Ontology / Essentialism about Kinds.
  *   **Verdict on Oxford:** **Refutes the claim that Oxford is gone.** The "essence" of Oxford is its legal charter and recognition by the academic community. As long as that abstract structure persists, the material turnover is irrelevant.
  *   **Status:** **Strongest Argument against your peer.** It points out that applying river-metaphysics (natural objects) to universities (institutional objects) is a category mistake.

  ### 6. The Radical Heraclitean / Flux Ontology
  *   **The Claim:** Change is fundamental; stability is an illusion. There are no persistent objects, only events. "Oxford" is just a name we give to a slow-moving event.
  *   **Metaphysical Commitment:** Process Ontology.
  *   **Verdict on Oxford:** **Supports the claim that Oxford is gone (sort of).** It says "Oxford" never existed as a static thing to begin with. It supports the idea that you cannot point to a stable entity.
  *   **Status:** **Radical Metaphysics.** Hard to live by, but coherent.

  ---

  ### ⚠️ THE FLAG: Where Metaphysics Ends and Value Judgments Begin

  The debate stops being metaphysics and becomes a **value judgment/convention** at the point where you ask: **"Which persistence conditions matter *to us*?"**

  *   **Metaphysical Fact:** We can describe the material turnover (Buildings changed) and the structural continuity (Charter remained).
  *   **Value Judgment:** Deciding whether the *Charter* matters more than the *Buildings* for the label "Oxford."

  **How to spot the wordplay in the seminar:**
  If your peer argues that Oxford *cannot* be the same because the matter changed, they are smuggling in a value judgment that **material continuity is the only thing that counts for identity.**

  *   **Challenge:** Ask them, "Are *you* the same person you were at birth, given your cells have replaced themselves?"
  *   **If they say Yes:** They admit material continuity isn't required. They must explain why Universities require it when humans don't.
  *   **If they say No:** They are committed to a metaphysics where nothing persists, making conversation impossible (including their own argument).

  ### Summary for your Seminar Intervention

  1.  **Distinguish Natural vs. Social Kinds:** The "River" argument applies to natural kinds (water/flow). Universities are **institutional facts** (Searle). Their identity is constituted by collective agreement and legal continuity, not material constitution.
  2.  **Clarify "Same":** Ask if they mean **Qualitatively Same** (looks the same) or **Numerically Same** (is the very same object). Heraclitus argues we aren't numerically same due to matter; Functionalists argue we are numerically same due to causal/structural continuity.
  3.  **Use the Tutor's 4D Point:** If Oxford is a 4D process, then "total turnover" is just a feature of the process's extension. It doesn't break the object; it *is* the object.
  4.  **Call the Bluff:** The claim that "Oxford isn't the same" is usually a rhetorical move to imply the *value* or *prestige* has degraded. That is an axiological claim (about value), not an ontological claim (about being). Don't let them dress up a complaint about quality as a metaphysical necessity.
