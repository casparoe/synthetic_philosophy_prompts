answer: |-
  # Joint Methodological Statement on the Science of Consciousness
  **Prepared by:** [Heterophenomenology Proponent] & [First-Person Methodologist]
  **Date:** October 2023
  **Context:** Adversarial Collaboration Workshop

  ## 1. Agreed Methodological Claims

  We, the undersigned, acknowledge significant divergences in our ontological and methodological commitments regarding the study of consciousness. However, to facilitate empirical progress, we endorse the following procedural commitments as a baseline for collaborative research:

  1.  **Non-Infallibility of Reports:** No first-person report is self-certifying. A subject's utterance does not guarantee the truth of the proposition reported, nor does it guarantee the presence of the reported experience.
  2.  **Naive Unreliability:** Reports from untrained (naive) subjects are subject to specifiable errors, including confabulation under pressure, failure to detect changes (change blindness), and the conflation of stimulus properties with experiential properties.
  3.  **Public Verifiability:** Scientific data must be public, repeatable, and third-person checkable. Private access cannot serve as the final arbiter of scientific claims; all data must be transcribable into a public record.
  4.  **Defeasibility of Authority:** A subject's authority over their own case is defeasible. Neural, behavioral, or physiological evidence may override self-report (e.g., in cases of blindsight, anosognosia, or verified confabulation).
  5.  **Explicit Protocols:** All methods of elicitation, whether interview-based or stimulus-driven, must be explicitly codified and teachable to allow for replication and error-checking across laboratories.
  6.  **Theory-Ladenness:** All data collection is theory-laden. We agree that the design of the experiment shapes the data, though we disagree on whether this shape distorts or reveals the target phenomenon.

  ## 2. Areas of Disagreement and Empirical Adjudication

  The following table outlines our core theoretical divergences. For each crux, we have identified a concrete test case drawn from our collaborative planning. We have recorded our respective positions in our own preferred terminology and registered advance predictions for the agreed tests.

  | Crux | Heterophenomenologist (HP) Position | First-Person Methodologist (FP) Position | Agreed Test Case | HP Prediction | FP Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **(i) Neutrality of Suspension**<br>Is the suspension of judgment regarding the *reality* of experience genuinely neutral, or does it smuggle in eliminativism? | The suspension of judgment is a methodological bracket, not an ontological denial. We treat the "heterophenomenological world" as a theorist's construct derived from texts. This remains neutral between realism and eliminativism until the best theory is in. | The treatment of experiential reports as "texts" to be interpreted rather than "disclosures" to be consulted is already an ontological commitment. It posits experience as a theoretical entity rather than the precondition of data, effectively enforcing eliminativism by methodological fiat. | **Simulator Protocol (Standard):** A decoder trained on neural data + past reports generates new reports in the subject's voice. | The generated text *is* part of the heterophenomenological record if it is the most charitable interpretation of the subject's neural state. The "world" is the set of commitments in the text, regardless of the generator. | The generated text is a *simulation* of a report, not a report. Without the subject's conscious act of reporting, there is no phenomenological anchor, rendering the text semantically empty regarding experience. |
  | **(ii) Nature of Reports**<br>Are reports data *about* experience, or data about dispositions to speak? | Reports are data about a subject's dispositions to produce speech acts under specific conditions. They are behavioral outputs that must be explained, not transparent windows into a private realm. | Reports are data *about* experience, provided the noise of naive reflection is minimized. The speech act is the vehicle, but the content refers to the phenomenal field, which is the object of study. | **Single-Bit Reporter:** A locked-in patient with a reliable yes/no channel tracks a stimulus but cannot elaborate. | The 'yes' responses constitute a heterophenomenological world minimal in content but real as a record of the subject's intentional stance. We attribute experience consistent with the 'yes'. | The 'yes' indicates detection or discrimination, but without elaboration, we cannot distinguish between phenomenal experience and unconscious processing. The "world" is indeterminate. |
  | **(iii) Training Effects**<br>Does disciplined training improve the evidential base or manufacture artifacts? | Training risks manufacturing compliance or inducing response biases that align with the experimenter's expectations. Refusing to train is a neutral stance; training is a substantive intervention that alters the data. | Training (epoché, descriptive sampling) reduces the "natural attitude" and pre-reflective distortion. Refusing to train is not neutral; it is a bet that naive noise is preferable to disciplined signal. | **Trained-Describer Asymmetry:** Multi-lab replication where training separates duration conditions but conflates spatial conditions. | The spatial inconsistency reveals that the training method manufactures artifacts where the stimulus does not support the requested distinction. The method fails the validity check. | The spatial inconsistency reveals a structural feature of the phenomenon itself (temporal experience is more accessible than spatial). The method successfully tracks the limits of the phenomenal field. |
  | **(iv) Non-Reporting Subjects**<br>What status do infants, animals, or binary-channel patients have? | We attribute a heterophenomenological world to any system whose behavior (including binary signals) is best interpreted by the intentional stance. The world is what we must attribute to make sense of the output. | We lose access to the *phenomenon* when descriptive capacity is lost. We can infer consciousness by analogy or neural markers, but we cannot characterize the *what-it-is-like* without descriptive depth. | **Single-Bit Reporter (Ontological):** Is the patient's world the "same kind of thing" as the experimenter's? | Yes, insofar as the intentional stance applies. The "kind of thing" is a locus of intentional states attributed by the theorist to explain the binary output. | No, not scientifically. Without the capacity for phenomenological variation and description, we cannot confirm the *quality* of the world is comparable, only the *capacity* for response. |
  | **(v) Absent Qualia / Zombies**<br>Could there be a difference in experience with no difference in the heterophenomenological record? | Yes. "Absent qualia with intact reports" is a coherent scientific hypothesis (the philosophical zombie). If the heterophenomenological record is identical, the science is identical, regardless of the metaphysical glow. | No, not within a science of consciousness. If the report is disciplined and validated, a difference in experience *must* manifest as a difference in the report or its neural correlates. To deny this is to abandon the target. | **Simulator Protocol (Anaesthesia):** Generator runs on spontaneous neural activity while subject is under general anaesthesia, producing coherent reports. | The heterophenomenological world exists (the text exists) even if the subject is unconscious. The record is decoupled from the "experiencer." This validates the method's independence from metaphysical baggage. | The reports are nonsense masquerading as sense. Without a conscious subject, there is no experience to report. This condition reveals the method's failure to distinguish signal from noise when the anchor is removed. |
  | **(vi) Bootstrapping**<br>Does the experimenter's interpretation rely on their own first-person data? | The interpreter uses public language and theory to decode reports. Any analogy to their own case is heuristic and must be discarded if it conflicts with third-person data. It does not enter as evidence. | The interpreter *must* use their own bracketed experience to understand the report vocabulary (e.g., "red," "pain"). This first-person access is the bridge of meaning; denying it makes the interpretation of texts impossible. | **Trained-Describer Asymmetry (Coding):** How the experimenter codes "consistency" in the spatial task. | Consistency is coded by inter-subject agreement on the text strings. If trained describers disagree, the data is inconsistent, regardless of what the experimenter "feels" the task should yield. | Consistency is coded by alignment with invariant structures of experience known to the experimenter via their own training. If describers disagree, it indicates a failure of training or a limit of the phenomenon, not just text mismatch. |

  ## 3. Conclusion: Verbal Disputes and Substantive Moves

  Upon review, we identify that a portion of our disagreement regarding **Crux (i) (Neutrality)** and **Crux (vi) (Bootstrapping)** is verbal. The HP uses "heterophenomenological world" to denote a *theorist's model*, while the FP uses "phenomenal world" to denote the *subject's reality*. When the HP claims the Simulator Protocol produces a "world" under anaesthesia, they mean a valid theoretical model; the FP hears a claim that experience exists without an experiencer. Clarifying that HP speaks of *models of experience* and FP speaks of *experience itself* dissolves the contradiction, though it leaves the utility of the model in question.

  However, the disagreement regarding **Crux (iii) (Training)** and **Crux (v) (Absent Qualia)** is substantive. The **Simulator Protocol under Anaesthesia** offers a decisive test. If the decoder generates coherent, neurally-predictive reports while the subject is unconscious, the HP will claim victory for the autonomy of the heterophenomenological record. The FP will claim this demonstrates the record's independence from consciousness, thereby proving it is not a measure of consciousness at all. Both parties agree that if this result obtains, the definition of "data" in consciousness science must change: either we accept data without experience (HP), or we reject the decoder as a measure of experience (FP). This result would move the debate by forcing a choice between a science of *reporting behavior* and a science of *phenomenal reality*, rather than allowing the two to remain ambiguously conflated.
