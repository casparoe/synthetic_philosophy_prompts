answer: |-
  # Joint Statement on the Epistemic Status of the Church–Turing Thesis

  **From:** The Empirical Camp (Physics-First) and The Conceptual Camp (Definition-First)
  **To:** Technical Readers, Software Engineers, and Computer Scientists
  **Subject:** Clarifying the disagreement regarding the limits of computation

  We have spent months in adversarial collaboration to map our disagreement. We agree on the mathematics and the engineering constraints. We disagree on how to label the boundary between "computation" and "physical process." Below is our joint report.

  ### 1. Common Ground: Claims Both Camps Sign

  We agree on the following hierarchy of claims. We disagree only on the status of Claim 3.

  1.  **Formal Equivalence (Proven):** The standard mathematical models of computation—Turing Machines, Lambda Calculus, General Recursive Functions, and modern RAM models—are extensionally equivalent. If a function is computable in one, it is computable in all. This is a mathematical theorem, not a hypothesis.
  2.  **The Definitional Core (Agreed Context):** The original Church–Turing Thesis was proposed to capture the pre-formal notion of "effective calculability." This notion refers to a procedure a human can carry out with paper and pencil, following explicit rules, without insight or creativity, in a finite number of steps.
  3.  **The Physical Claim (Contested):** The claim that "No physical system can compute a function that a Turing Machine cannot."
      *   **Agreement on Readout:** Both camps agree that for a physical process to count as "computing a value," the result must be readable. A readout requires a finite physical signal (e.g., voltage high/low, bit flip) distinguishable from noise within finite time and energy.
      *   **Agreement on Refutation Condition:** Both camps agree that if a device reliably outputs the solution to the Halting Problem (which is provably non-Turing-computable) using a finite, robust readout, the *Physical Claim* (3) is falsified.
      *   **Disagreement on Consequence:**
          *   The **Empirical Camp** holds that such a device would prove the Physical Claim false while leaving the Definitional Core (2) intact.
          *   The **Conceptual Camp** holds that such a device would prove the process does not meet the definition of "effective calculability" (2), and thus is not a counterexample to the Thesis properly understood.

  ### 2. Map of Disagreements

  | Issue | Empirical Camp Wording (Physics-First) | Conceptual Camp Wording (Definition-First) | Verdict |
  | :--- | :--- | :--- | :--- |
  | **Status of Physical CTT** | A contingent law of nature, like thermodynamics. It holds in our universe but could have been otherwise. | A methodological principle. It defines the boundary of "algorithm." If physics crosses it, we call it "simulation," not "computation." | **Substantive** (regarding physics), **Verbal** (regarding the word "computation"). |
  | **What Counts as Refutation** | A black box that solves a non-recursive problem (e.g., Halting) reliably. The internal mechanism matters less than the input/output behavior. | A black box that solves a non-recursive problem *via effective steps*. If it relies on infinite density or Zeno limits, it violates the "finite step" requirement of the definition. | **Substantive** (depends on physical realizability of the readout). |
  | **Relationship of Math to Physics** | Math defines the abstract space; Physics determines which points in that space are reachable by building things. | Math defines the concept of "computation." Physics determines what processes exist. Not all physical processes are computations. | **Verbal** (mostly about labeling). |

  ### 3. The Cruxes: Predictions and Concessions

  We identified three specific scenarios where our views diverge. Below are the setups we both accept, our respective predictions, and what we would count as losing the argument.

  #### (i) The Halving Clock (The Zeno Machine)
  **The Setup:** A chip performs an exhaustive search for a halting computation. At step $n$, it takes time $1/2^n$. The total time for infinite steps is 1 second.
  ```python
  # Pseudocode for the physical process
  t = 0
  while True:
      perform_next_step_of_search()
      if found_halting_proof:
          flip_bit_to_1
      # Physical stipulation: clock period halves every loop
      set_clock_period(current_period / 2) 
      # At t = 1.0, the loop has completed infinitely many iterations
  ```
  **The Stipulation:** We assume engineering limits (heat, Planck length, energy) are magically solved. The only question is the logic of the readout at $t=1$.

  *   **Empirical Prediction:** If this chip is built and the bit at $t=1$ reliably indicates the Halting status, a non-recursive function has been computed. The Physical CTT is false.
      *   **Empirical Concession:** We lose if the value of the bit at $t=1$ cannot be read without performing another infinite process (e.g., if measuring the limit state requires infinite precision).
  *   **Conceptual Prediction:** The "output" at $t=1$ is not the result of a computation, but a physical limit state. The definition of "effective calculability" requires a finite number of steps to reach a result. This device cheats the definition.
      *   **Conceptual Concession:** We lose if the bit value can be read with finite energy and precision, and reliably correlates to the Halting status, forcing us to admit our definition of "step" was too narrow.

  #### (ii) The Burden Question (The Historical Analogy)
  **The Setup:** Comparing the history of failed hypercomputation attempts to other scientific histories.

  *   **Empirical Position:** The record is like **Perpetual Motion**. We haven't built one yet, but the laws of physics are contingent. Future physics (e.g., general relativity loopholes, quantum gravity) might allow it.
      *   **Prediction:** In 100 years, this dispute will look like thermodynamics. We will have a "Law of Computability" derived from fundamental physics.
  *   **Conceptual Position:** The record is like the **Parallel Postulate**. For centuries, people tried to prove it from other axioms. Eventually, we realized non-Euclidean geometries were consistent. Similarly, "hypercomputation" is just a different geometry of information, not a refutation of the standard one.
      *   **Prediction:** In 100 years, this dispute will look like geometry. We will teach "Turing Computation" as the logic of effective procedures, and "Physical Hypercomputation" as a separate study of analog dynamics, without conflating the two.
  *   **Shared Test:** If a hypercomputer is built, Empirics say "Physics is richer than we thought." Conceptuals say "We need a new word for this process." The substantive crux is whether the new word is *necessary* or merely *pedantic*.

  #### (iii) The Asymmetry
  **The Setup:** No one expects a purely mathematical proof to refute the Thesis (since the Thesis links math to the world), but some expect a physical discovery to do so.

  *   **The Question:** Does this asymmetry show that the Conceptual Claim (about effective procedures) and the Physical Claim (about devices) are independent?
  *   **Empirical Answer:** **Yes.** The Conceptual Claim is about human rules. The Physical Claim is about the universe. The universe is under no obligation to obey human rules of "effective procedure." The asymmetry proves (c) is doing the real work in engineering contexts.
  *   **Conceptual Answer:** **No.** The asymmetry exists because the Thesis *is* a conceptual claim. We are asking if the universe supports *our concept*. If the universe does something else, it doesn't refute the concept; it just means the universe isn't running an algorithm. The asymmetry shows (b) is the anchor; (c) is just an application.
  *   **Shared Conclusion:** We agree that for a software engineer, the distinction is moot unless a hypercomputer is actually built. Until then, the asymmetry serves as a reminder: Math defines the map; Physics defines the territory.

  ### 4. Guidance for the Working Programmer

  To the engineer asking whether analog, quantum, or machine learning systems can break the Turing limit:

  **Treat the Church–Turing Thesis as a working axiom.**

  Whether you view the Thesis as a law of physics or a definition of logic, the practical outcome for software is identical.
  1.  **Quantum Computers:** They offer speedups (polynomial vs. exponential), but they do not compute functions that a classical Turing Machine cannot. If a problem is undecidable for a classical computer, it is undecidable for a quantum one.
  2.  **Analog/Neural Systems:** These systems operate on continuous values. However, to interface with the digital world (input/output), you must quantize their signals. Once you define a finite readout, they collapse back to Turing-equivalent power.
  3.  **The Limit:** If you are waiting for a hardware breakthrough to solve the Halting Problem or decide arbitrary logical propositions, you will wait forever.

  **Verdict:** You may bet on physics breaking speed barriers. Do not bet on physics breaking logical barriers. If a device claims to do the latter, the Empirical Camp says it's a miracle of physics; the Conceptual Camp says it's a category error. In either case, you cannot write a compiler for it today.
