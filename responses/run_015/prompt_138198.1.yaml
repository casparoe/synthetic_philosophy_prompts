      *   **Key Constraints/Philosophical Stances:**
          *   Must justify euthanasia without equating it to all arranged deaths (e.g., livestock).
          *   Must not sanitize June's behavior (she bit, killed hens, feared children).
          *   Must not rely on speciesism (pigs matter too) but must explain why *June* mattered specifically (particularity vs. general value).
          *   Must not say "she mattered because we loved her" (circular/subjective).
          *   **The Test:** Every sentence must survive replacing "June" with "one of Mr. Aksoy's pigs." (This is the hardest constraint).
          *   **Tone:** Grief, not a position paper. No statistics, slogans, guilt, or false consolation.
