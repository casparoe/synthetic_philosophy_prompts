answer: |-
  This is a genuinely sharp observation. You have put your finger on a structural flaw in how we typically map the landscape of experience, one that often gets glossed over in introductory ethics but causes massive headaches in rigorous phenomenology and axiology (the study of value).

  You are asking for a slow walk-through, so let's not jump to a label yet. Let's map the terrain first to see why your specific point doesn't quite fit the standard boxes, and then we can see if we need to forge a new tool.

  ### Phase 1: Brainstorming the Terrain

  When philosophers try to categorize pleasure, they usually reach for one of three tools. I want to test each of them against your "sprint burn vs. sunbath" example to see where they fail.

  **1. The "Common Feeling" Theory (Hedonic Tone)**
  Classical hedonists (like Bentham or Sidgwick) often operated under the assumption that there is a specific, identifiable "glow" or "tone" common to all pleasures. Just as "redness" is common to a red apple and a red light, "pleasantness" was thought to be a qualitative ingredient added to experiences.
  *   *The Problem:* As you noted, the sprint burn and the sunbath share no such ingredient. If there were a "pleasure glow," the sprint burn would have to glow in the same way the sunbath does. But you're saying the sprint burn feels *more like* a headache (pain) than the sunbath. This suggests there is no single "pleasure sensation."
  *   *Verdict:* This theory is largely abandoned in contemporary philosophy of mind because of exactly the observation you made.

  **2. The "Attitudinal" Theory (Feldman, etc.)**
  To solve the above, many modern philosophers (like Fred Feldman) argue that pleasure isn't a *sensation* at all. It's an *attitude* you take toward a sensation.
  *   *The Idea:* The "burn" is just a sensation. The "pleasure" is the fact that you *welcome* or *desire* that burn while sprinting. The "pain" is that you *avert* that same burn when you have a headache.
  *   *The Problem:* This explains why the *value* differs, but it sidesteps your specific taxonomic worry. You are pointing out that the *phenomenology* (the "what it is like") groups the sprint-burn and the headache-burn together, while the *ethical category* (Pleasure vs. Pain) splits them apart. The Attitudinal Theory explains the split, but it doesn't give a name to the weirdness of the grouping. It treats the qualitative similarity as irrelevant noise. You are suggesting the similarity *matters* for the taxonomy.

  **3. The "Polymorphous" or "Heterogeneity" Objection (Wittgenstein, Ryle)**
  Gilbert Ryle and later Wittgensteinians argue that "pleasure" is a polymorphous concept—like "game." There is no one thread running through all pleasures; they just share overlapping family resemblances.
  *   *The Problem:* This gets closer. It admits pleasures don't have to feel alike. But standard Heterogeneity usually stops at saying "Pleasure A doesn't have to feel like Pleasure B." It rarely explicitly maps the *cross-boundary resemblances* you are highlighting. It doesn't typically note that Pleasure A might feel *more* like Pain C than it does like Pleasure B. It treats "Pleasure" and "Pain" as separate families, whereas you are suggesting the families are intermingled in phenomenological space.

  ### Phase 2: Isolating Your Specific Insight

  Your observation is more topological than the standard heterogeneity objection.

  Standard View:
  *   **Cluster P (Pleasure):** Sunbath, Proof-Click, Declining Invitation.
  *   **Cluster Q (Pain):** Headache, Embarrassment, Muscle Fatigue.
  *   *Assumption:* The distance between any member of P and any member of Q is greater than the distance between members within P.

  Your View:
  *   **Cluster X (Burning/Sharp):** Sprint-Burn (P), Headache (Q), Embarrassment (Q).
  *   **Cluster Y (Warm/Dull):** Sunbath (P), Muscle Ache (Q).
  *   *Observation:* The boundary between P and Q (Good/Bad) cuts *through* Cluster X and Cluster Y.

  This means "Hedonic Tone" (Good/Bad) and "Qualitative Character" (Burning/Warm/Sharp) are independent variables. In mathematics, when two variables are independent and do not influence each other's axes, they are **orthogonal**.

  ### Phase 3: The Label and Definition

  There is no single, canonical historical term for this *exact* configuration. The closest existing discussions appear in contemporary affective science (e.g., the "Circumplex Model of Affect" which separates Valence from Arousal), but in *philosophical taxonomy*, this specific structural mismatch is often discussed piecemeal under "The Heterogeneity of Pleasure" without a dedicated name for the cross-valence resemblance.

  So, following your request to coin a term if necessary, I propose we call this:

  ## **Valence-Orthogonal Phenomenology**

  Here is the precise taxonomic definition, including its edges and what it excludes.

  #### **1. Definition**
  **Valence-Orthogonal Phenomenology** is the structural condition wherein the qualitative character of an experience (its "feel," texture, intensity, or sensory modality) varies independently of its hedonic valence (its status as pleasant or unpleasant).

  Under this model, "Pleasure" and "Pain" are not distinct *types* of sensation, but rather distinct *evaluations* applied to sensations that can be qualitatively identical or highly similar. The "orthogonality" implies that knowing the qualitative character (e.g., "burning") does not predict the valence (e.g., "good" in sprinting, "bad" in injury), and knowing the valence does not predict the qualitative character.

  #### **2. What It Includes (The Extension)**
  This concept captures exactly the examples you gave:
  *   **The Sprint/Headache Overlap:** Both share the qualitative property of "high-intensity burning." They are grouped phenomenologically but split axiologically.
  *   **The Sunbath/Fatigue Overlap:** Both share "low-intensity warmth/dullness." Grouped phenomenologically, split axiologically.
  *   **The Proof-Click/Relief:** Both share a "sharp release of tension."

  It asserts that the category "Pleasure" is not a natural kind in phenomenological space. It is a "scattered set" that picks out islands from various qualitative clusters based on an external criterion (desire, value, or biological utility) rather than an internal criterion (feel).

  #### **3. What It Excludes (The Boundaries)**
  This is the crucial part. We must distinguish this from three similar-sounding philosophical moves to ensure the label stays sharp.

  **A. Distinction from "Mixed Pleasures" (Plato's *Philebus*)**
  *   *The Old Idea:* Plato argues some pleasures are "impure" because they are merely the relief of a pain (e.g., the pleasure of eating when hungry is just the cessation of the pain of hunger).
  *   *The Difference:* Mixed Pleasure theory is about *composition* or *source*. It says "This pleasure contains pain." Valence-Orthogonal Phenomenology is about *quality*. It says "This pleasure *feels like* that pain, even if it contains no pain."
  *   *Why it matters:* In your sprint example, you aren't saying the burn is pain you enjoy (masochism). You are saying the *qualia* of the burn is neutral, and the "pleasure" is the orthogonally applied valence. The "Mixed" theory tries to purify the categories; your observation dissolves the boundary entirely.

  **B. Distinction from "Pleasure as Absence of Pain" (Epicurus)**
  *   *The Old Idea:* Epicurus argued that the highest pleasure is *ataraxia* (freedom from disturbance), essentially defining pleasure as the zero-point of pain.
  *   *The Difference:* This is a definition of the *goal state*. It doesn't address the phenomenology of active experiences. Epicurus would say the sprint burn is a "kinetic" pleasure and potentially problematic. Valence-Orthogonal Phenomenology doesn't judge the value; it just maps the structure. It allows for the sprint burn to be a genuine pleasure while acknowledging its qualitative identity with pain.
  *   *Why it matters:* Epicurus tries to align the categories (Good = No Pain). Your observation insists the categories are misaligned.

  **C. Distinction from Simple "Heterogeneity" (Ryle/Mill)**
  *   *The Old Idea:* "Pleasures are different from each other." (Mill's higher/lower pleasures, or Ryle's polymorphous concept).
  *   *The Difference:* Simple Heterogeneity says Pleasure A $\neq$ Pleasure B. It leaves open the possibility that all Pleasures are still *more like* each other than they are like Pains. Valence-Orthogonal Phenomenology makes the stronger claim: Pleasure A can be *more like* Pain C than it is like Pleasure B.
  *   *Why it matters:* This breaks the "Currency Model" of hedonism. If pleasures are just different (Heterogeneity), you might still be able to exchange them (like dollars and euros). If they are Valence-Orthogonal, you can't exchange them at all, because "Pleasure" isn't a currency; it's a rating system applied to different commodities.

  ### Phase 4: Why This Taxonomy Matters

  If we accept **Valence-Orthogonal Phenomenology**, it forces a shift in how we do ethics and psychology.

  1.  **For Ethics:** It undermines "Hedonic Calculus." You cannot add up units of pleasure if "pleasure" is not a unified phenomenological substance. You are adding up "sun-units" and "proof-units" and "sprint-units," which are as different as apples and anxieties. The only thing unifying them is your *attitude* toward them, not their substance.
  2.  **For Psychology:** It aligns with the "Constructed Theory of Emotion" (Lisa Feldman Barrett), which argues that "affect" is a summary of bodily sensations + context, not a pre-wired fingerprint. Your "burn" is just high arousal; the context (sprint vs. injury) assigns the valence.
  3.  **For AI/Sentience:** If we try to build a machine that "maximizes pleasure," Valence-Orthogonality suggests this is a category error. You have to specify *which* qualitative clusters get the "positive" tag. A machine could maximize "burning sensations" and think it is maximizing pleasure, while actually torturing itself (or vice versa).

  ### Summary

  You have identified that the folk-psychological category of "Pleasure" is not a phenomenological cluster, but a **valence-based selection** across multiple phenomenological clusters.

  *   **Established Name:** There isn't one specific canonical term. It is usually buried under "The Heterogeneity Objection."
  *   **Proposed Term:** **Valence-Orthogonal Phenomenology**.
  *   **Core Claim:** Qualitative Character (What it feels like) and Hedonic Tone (Good/Bad) are independent axes.
  *   **Key Distinction:** Unlike "Mixed Pleasures," this does not claim pleasure *contains* pain. Unlike "Absence of Pain," this does not define pleasure as neutral. Unlike simple "Heterogeneity," this explicitly claims phenomenological similarity *crosses* the good/bad divide.

  Does this taxonomy hold the shape of the problem you were wrestling with, or does it leave any of the "burn" out of the equation?
