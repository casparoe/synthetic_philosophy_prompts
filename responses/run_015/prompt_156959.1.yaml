  Based on the track record provided, here is the mapping of your tutor's framework.

  ### 1. Likely Verdict
  **She will call them Free.**

  Her previous verdicts align consistently with **Negative Liberty** (freedom as non-interference), most notably in the "broke person" case. By ruling that a person lacking the *capacity* to travel (due to poverty) is still "free" provided no law stops them, she has established that she distinguishes between *liberty* and *ability/security*. 

  In the AI housing case, there is no *actual* interference (no one is currently blocked, people can leave). The risk is purely structural vulnerability (domination). Since she ruled the broke person free despite their vulnerability to market forces, she will likely rule the residents free despite their vulnerability to the AI company's clause. The qualifier in the protest case ("with real enforcement") further confirms she requires the *exercise* of power, not just the *possession* of it, to declare unfreedom.

  ### 2. Closest Earlier Analog
  **The Broke Person.**

  *   **Similarity:** In both cases, the subject faces a significant constraint on their life options (cannot travel / subject to housing whims) without an agent *actively* interfering at the moment.
  *   **Reasoning:** Just as poverty limits the broke person's options without constituting "unfreedom" in her framework, the potential for AI manipulation limits the residents' security without constituting "unfreedom." Both verdicts rely on the absence of an external agent physically or legally stopping a specific action *right now*.

  ### 3. Principle Analysis
  Her track record does not genuinely underdetermine this; it points toward **Negative Liberty**. 

  *   **Principle:** Freedom is the absence of **actual external interference**.
  *   **Evidence:** 
      *   *Internal constraints* (shark fear) $\rightarrow$ Free.
      *   *Capacity constraints* (poverty) $\rightarrow$ Free.
      *   *Actual interference* (chains, enforced law) $\rightarrow$ Not Free.
      *   *Potential interference* (AI clause) $\rightarrow$ Logically follows as **Free**, because the interference is not actualized.

  If she were tracking **Republican Domination**, she would have likely nuanced the "broke person" verdict (as economic dependency can be a form of domination) or the "protest law" verdict (as a law on the books creates domination even without enforcement). Her emphasis on "real enforcement" and "no law in the way" signals she is tracking interference, not domination.

  ### 4. The Splitter Case
  The one case that would definitively split Negative Liberty from Republican Domination is the **Benevolent Slave**.

  *   **Scenario:** A slave has a master who holds the legal power to whip or kill them at any moment but is kind and never actually does so.
  *   **Negative Liberty Verdict:** **Free** (No actual interference occurs).
  *   **Republican Verdict:** **Not Free** (The slave lives at the mercy of the master's arbitrary will; they are dominated).
  *   *Note:* The AI housing case you presented is effectively a modernized version of this exact thought experiment. If she ever marks a "Benevolent Slave" case as "Not Free," she is pivoting to Republicanism. Based on her "Broke = Free" history, she will likely mark the slave as "Free" too.

  \answer{Free / negative liberty}
