answer: |-
  Elias stands before Marcus outside the bank, voice carrying to the queue. "You told them I defaulted. Retract it." Marcus adjusts his cufflinks, calm. "I filed a formal complaint. The bank investigates. I won't debate ledgers in the street." Elias turns to the neighbors. "He lies to break me. Ask him for proof." Marcus enters the bank doors. The queue disperses; no one lends Marcus money either. The bank clears Elias's name the next day, but his shop stays open today because Elias spoke. Marcus's silence poisoned the well; Elias's public confrontation purified it. The law vindicates Elias later, but only honor saved him now.

  ***

  **Specification Compliance**

  1.  **Institutions:** The bank investigates and clears Elias's name the next day. The mechanism works; it is merely too slow to prevent immediate ruin.
  2.  **No Violence:** The confrontation is verbal. The sanction is social (dispersing queue, withholding loans), not physical.
  3.  **Characters:** Marcus is not cowardly; he trusts due process. Elias is not a thug; he defends his livelihood against a specific falsehood.
  4.  **Format:** Single paragraph, neutral narration, 136 words.

  **Why Honor Wins (by Dignity Standards)**
  Dignity culture values individual autonomy and truth. Marcus's adherence to procedure allows a falsehood to impair Elias's autonomy (livelihood) for a critical window. Elias's honor response restores truth and autonomy immediately. Honor wins here not because standing matters more than rights, but because it secures rights faster than the institution can.

  **The Single Feature Doing the Work**
  **Temporal Lag.** The harm is immediate (credit stoppage); the institutional remedy is delayed (one day).
  **If Removed:** If the bank cleared Elias instantly, Marcus's procedure would suffice. Honor becomes unnecessary agitation, and the case collapses into the standard view that honor is only useful where law is absent or slow.

  **Strongest Objection from a Dignity Defender**
  "The Honor prescription lacks error correction. If Elias is wrong about the lie, his public confrontation destroys Marcus's reputation irreparably before any truth emerges. Dignity culture sacrifices speed for safety against false accusation. Your scene assumes Elias is right; in the aggregate, Honor cultures punish more innocents than Dignity cultures do."

  **The Victimhood Mirror**
  Constructing a mirror case where Victimhood culture (appealing to third parties to highlight vulnerability) wins is **harder** under Specification 1. Victimhood culture relies on the premise that institutions are biased or insensitive. If institutions function tolerably well, the Victimhood prescription (publicizing vulnerability to compel institutional action) looks redundant or manipulative compared to simply using the institution. To make Victimhood win, you must introduce a blind spot in the institution that only public vulnerability signaling can reveal, which strains Specification 1.

  **Conclusion on Ranking**
  If this case succeeds, it demonstrates that these cultures cannot be linearly ranked as evolutionary stages. It suggests they are distinct toolkits optimized for different temporal and social constraints: Dignity for systemic stability, Honor for immediate interpersonal enforcement. The ranking question itself is a category error.
