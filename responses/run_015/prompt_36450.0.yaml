answer: |-
  Your intuition is spot-on. The sleight of hand is exactly where you think it is. Your office mate is running a version of the **Argument from Vagueness**, most famously championed by David Lewis and Ted Sider. It's a formidable argument, but it is not a trap.

  You should **reject Premise (6)**.

  Here is the breakdown of why (6) fails, how to explain it to your office mate, and what you have to give up to make it stick.

  ### The Problem with Premise (6)
  Premise (6) states: *"But it can't be indeterminate whether something exists, or how many things there are. Existence isn't like baldness."*

  This premise relies on conflating two different kinds of vagueness:
  1.  **Ontic Vagueness (*De Re*):** The world itself is fuzzy. There is an object $x$, and it is an indeterminate fact of reality whether $x$ exists. (This is what Lewis/Sider claim is impossible).
  2.  **Semantic/Conceptual Vagueness (*De Dicto*):** Our concepts or language are fuzzy. The statement "There exists an object composed of these parts" lacks a determinate truth value because the word "object" (or "compose") is vague, not because reality is fuzzy.

  Your office mate's argument works only if vagueness in composition *entails* ontic vagueness. But restricted compositionists argue that composition vagueness is merely semantic.

  When you say, "It is indeterminate whether a mug-lake-tail object exists," you are **not** saying:
  > "There is some entity $x$ such that it is fuzzy whether $x$ is in the domain of existence." (Ontic Vagueness)

  You **are** saying:
  > "The concept 'composite object' is vague. In this borderline case, the concept fails to latch onto the world in a determinate way. Therefore, the sentence 'There exists a composite object here' is neither true nor false." (Semantic Vagueness)

  ### How to Deploy This Objection
  Tell your office mate that (6) begs the question. It assumes that the existential quantifier ("there exists") must be precise and map directly to natural joints in reality. But for restricted compositionists, "exists" (when applied to composites) is a concept that depends on human interests, cohesion, function, etc.

  If "object" is a vague sortal (like "heap" or "bald"), then "the number of objects" is a vague quantity. That doesn't mean reality is fuzzy; it means the *question* "How many objects are there?" is sometimes ill-posed.

  **The Analogy:**
  Imagine a room with a pile of sand. You add grains one by one.
  *   **Universalist:** "There is always a heap. Even with one grain."
  *   **Nihilist:** "There are never any heaps. Just grains."
  *   **Restricted (You):** "Sometimes there is a heap, sometimes there isn't. In the middle, 'Is there a heap?' has no answer."

  Does the indeterminacy of "Is there a heap?" mean there is a *fuzzy heap* floating in the room? No. It means "heap" is a vague concept. Premise (6) claims that because "heap" is vague, reality must be fuzzy. That's false. Reality (the sand grains) is precise; the classification is vague.

  Apply this to the mug-lake-tail. The atoms are arranged precisely. The question is whether that arrangement counts as an "object." If "object" is vague, then existence claims involving "object" can be indeterminate without reality being indeterminate.

  ### What You Have to Give Up
  You asked what you have to sacrifice to keep statues and kill the mug-lake-tail monster. By rejecting (6), you are giving up **the precision of existence.**

  You have to accept that:
  1.  **"Existence" is not a perfectly sharp natural kind.** There is no single, precise fact of the matter about "how many things" exist in the universe, independent of conceptual schemes.
  2.  **Vagueness is in the mind/language, not the world.** You are committing to the view that all vagueness is semantic/representational. You cannot be an ontic vagueness realist.
  3.  **Identity can be vague (sort of).** If it's indeterminate whether the parts compose an object, it's indeterminate whether "the object" is identical to "the parts." (Though you can frame this as vague reference rather than vague identity to avoid Evans' objections).

  ### Why This is the "Least Bad" Option
  Compare this to the alternatives your office mate offers:
  *   **Universalism:** You have to accept the mug-lake-tail. This violates every intuitive constraint you have about parthood and causation. It makes "object" trivial.
  *   **Nihilism:** You have to deny the statue exists. This makes language and science systematically false or in need of massive paraphrase.
  *   **Brutal Sharpness (Epistemicism):** You accept Restricted Composition but say there *is* a precise cutoff (e.g., at exactly nanometer $n$ of cohesion), we just can't know it. You explicitly said you don't want this. It's metaphysically magical.

  Rejecting (6) allows you to keep **Statues** (clear cases), kill **Mug-Lake-Tail** (clear non-cases), and handle the **Borderline** (indeterminate truth, not fuzzy reality).

  ### The Script for Your Office Mate
  Here is how you can put it to him:

  > "I'm rejecting (6). You're assuming that if it's indeterminate whether an object exists, then there must be *ontic* vagueness—a fuzzy object in the world. But I'm a semantic vagueness realist.
  >
  > The indeterminacy is in the concept 'composite object,' not in the arrangement of particles. The particles are precisely arranged. The question is whether that arrangement satisfies the vague predicate 'composes an object.'
  >
  > When I say 'It's indeterminate whether the statue exists,' I'm not saying there's a fuzzy statue. I'm saying the word 'statue' doesn't determinately refer in this context. So, the count of 'things' is vague only because 'thing' is a vague sortal. That doesn't make reality fuzzy; it just means 'how many things' isn't always a well-formed question. You can have restricted composition without ontic vagueness. You just have to admit that existence isn't as precise as logic."

  ### Summary
  *   **Step to Attack:** Premise (6).
  *   **The Move:** Distinguish *de dicto* vagueness (indeterminate truth of proposition) from *de re* vagueness (indeterminate existence of object).
  *   **The Cost:** Admit that "existence" (for composites) is conceptually relative and not perfectly precise.
  *   **The Gain:** You keep the statues, lose the mug-lake-tail, and avoid magical sharp boundaries.

  Your office mate is relying on the idea that logic demands precision. You reply that logic demands precision, but *metaphysics* deals with concepts, and some concepts are inherently vague. Don't let him force a logical constraint onto an ontological question.
