answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Head of Valuation / Chief Risk Officer
  **FROM:** Actuarial Function
  **SUBJECT:** Translation of Climate Ethical Constraints into Valuation and Risk Frameworks
  **DATE:** October 26, 2023

  ### 1. Systematic Translation of Ethical Concepts

  The following section translates three external conceptual frameworks into the internal vocabulary of liability valuation, risk measurement, and economic capital modeling.

  #### 1.1 The Social Discount Rate (Stern vs. Nordhaus / Ramsey Rule)
  **External Concept:** The debate concerns the parameter $\delta$ (pure rate of time preference) in the Ramsey equation $r = \delta + \eta g$. Stern argues $\delta \approx 0$ (future generations count equally); Nordhaus argues $\delta > 0$ (calibrated to observed market rates).
  **Actuarial Translation:** This is a calibration dispute regarding the **Ultimate Forward Rate (UFR)** and the **Long-Term Splice** on the discount curve.
  *   **The Rate ($r$):** In our valuation model, this is the discount rate applied to cashflows beyond the liquid horizon (30+ years). Currently, this is the "flat rate" spliced onto the market curve.
  *   **Pure Time Preference ($\delta$):** In our vocabulary, this is the **ethical spread** over the risk-free rate. If we set $\delta = 0$, the long-term discount rate converges to the expected risk-free rate adjusted only for expected growth and inequality aversion. If $\delta > 0$, we are hard-coding a spread that discounts future liabilities simply because they are distant, independent of risk or liquidity.
  *   **Inequality Aversion ($\eta$) and Growth ($g$):** This corresponds to the **Real-World Measure ($P$)** adjustment for future wealth. If we assume future annuitants will be wealthier ($g > 0$), and we apply inequality aversion ($\eta > 0$), we effectively reduce the present value of their claims relative to current policyholders.
  *   **The Conflict:** The Nordhaus position is equivalent to calibrating the UFR to current **Market-Consistent ($Q$)** swap rates, implying the market's liquidity premium is a valid proxy for intergenerational equity. The Stern position is equivalent to overriding the $Q$-measure with a **Regulatory/ethical $P$-measure** where the long-end spread is set to zero, regardless of market liquidity.

  #### 1.2 The Non-Identity Problem
  **External Concept:** Policies change which specific individuals come into existence. A policy that harms future people might be justified if the alternative policy would have resulted in *different* people existing who would have been worse off (or not existed).
  **Actuarial Translation:** This is an **Endogenous Benchmark / Decision-Dependent Exposure** problem.
  *   **Standard Practice:** We treat the population projection (mortality tables, lapse rates, new business strain) as an **Exogenous Input**. The "grid" of policyholders is fixed at $t=0$ for the purpose of stochastic projection.
  *   **The Problem:** Climate scenarios (investment strategy, hedging, underwriting) alter the economic environment, which alters demographics (birth rates, migration, mortality). Therefore, the set of counterparties in Scenario A is not identical to the set in Scenario B.
  *   **Valuation Impact:** Standard **Solvency Capital Requirement (SCR)** calculations measure the deviation of Assets minus Liabilities ($A - L$) across scenarios. If the $L$ (Liabilities) depends on *who* exists, and *who* exists depends on the Strategy ($S$), then we are comparing $L(S_1)$ against $L(S_2)$ where the underlying units of account are not fungible.
  *   **Translation:** We lack a **Counterfactual Identity Tag**. Our models track *aggregate exposure* (e.g., "10,000 lives aged 80"), not *individual rights*. The Non-Identity Problem manifests as the inability to define a "loss" when the baseline population is a function of the decision variable.

  #### 1.3 Precautionary Principle / Extinction Risk
  **External Concept:** Certain risks (extinction) have low probability but infinite/terminal cost, warranting avoidance regardless of Expected Value calculations.
  **Actuarial Translation:** This is a **Going-Concern Boundary Condition** failure, not a Tail Risk event.
  *   **Tail Risk:** Usually modeled via **Value-at-Risk (VaR)** or **Tail Value-at-Risk (TVaR)** at the 99.5th percentile. These assume the entity survives to realize the loss.
  *   **Extinction:** In our projection engine, this is not a large negative cashflow; it is a **Termination Code**. It is the point where the projection returns `NULL` because the insurer, the currency, or the legal system ceases to function.
  *   **Risk Measure:** Standard **Coherent Risk Measures** (subadditive, monotonic, etc.) fail here because they operate on a space of random variables defined over a fixed probability space. Extinction collapses the probability space itself.
  *   **Translation:** This is not a reserve requirement; it is a **Solvency Constraint** that overrides the valuation. It asserts that any strategy with non-zero probability of triggering the Termination Code is inadmissible, regardless of the Expected Present Value (EPV) of profits.

  ---

  ### 2. Residue Report

  This section details what was lost, distorted, or rendered incoherent during the translation above.

  #### 2.1 The Pure Rate of Time Preference ($\delta$) vs. The Spread
  *   **Clean Translation:** Mathematically, $\delta$ functions identically to a constant spread added to the discount curve beyond the liquid horizon. Lowering $\delta$ increases the Present Value of Liabilities (PVL).
  *   **Distortion:** In finance, a spread compensates for **Risk** or **Liquidity**. In the ethical argument, $\delta = 0$ is a claim about **Impartiality**.
      *   *Substitution:* By treating $\delta$ as a spread, we implicitly assume the market risk-free rate is the correct baseline for "neutral" valuation. However, the market rate already embeds the preferences of *currently living* market participants.
      *   *Verdict:* Setting $\delta = 0$ in our model does **not** deliver impartiality. It merely removes an explicit discount. If the risk-free curve itself is derived from a market that discounts the future (due to myopia or inequality), setting $\delta=0$ is insufficient. The "impartiality" claim requires a **Real-World ($P$)** curve constructed independently of current market prices, which we do not currently have the mandate to build.
  *   **Exponential Artifact:** The finding that low rates "swamp" the valuation is purely an artifact of the **Exponential Functional Form**. We use $e^{-rt}$ because it is time-consistent for financial replication. Ethics may not require time-consistency. We are forcing an ethical constraint into a mathematical structure designed for arbitrage-free pricing. The "tyranny of the long-term" at low rates is a model artifact, not an ethical truth.

  #### 2.2 Non-Identity vs. Endogenous Benchmark
  *   **Clean Translation:** The difficulty of comparing scenarios with different demographic assumptions is accurately captured as an "Endogenous Benchmark" issue.
  *   **Distortion:** The philosophical problem is about **Identity**, not **Aggregation**.
      *   *Substitution:* Our framework substitutes *Aggregate Liability* for *Individual Welfare*. We can model "1 million fewer lives in 2080," but we cannot model "Specific Person X does not exist."
      *   *Verdict:* The claim that an action can be "wrong but makes no one worse off" **cannot be expressed** in our vocabulary. Our vocabulary is **Person-Affecting** by default (we value liabilities owed to specific policyholders), but our aggregation method is **Impersonal** (we sum them into a single reserve figure).
      *   *Casualty:* The concept of a "duty to people who merely might exist" is a casualty. In our model, if they don't exist, the liability is zero. There is no "contingent claimant" status. We cannot reserve for a policyholder who is not yet conceived unless we treat them as a generic block of exposure, which erases the Non-Identity problem entirely.

  #### 2.3 Extinction Risk vs. Going-Concern Assumption
  *   **Clean Translation:** Identifying extinction as a model boundary failure rather than a cashflow is accurate.
  *   **Distortion:** Finance assumes **Positive Value**. Extinction implies **Value = 0** (or undefined).
      *   *Substitution:* We treat the "Going Concern" assumption as an accounting convention (i.e., we assume the company won't be liquidated tomorrow). In the climate context, it is an **Ontological Premise**.
      *   *Verdict:* The badness of human extinction is **not representable** as a large adverse cashflow. A cashflow implies a recipient. Extinction implies no recipient. To model it as a cost (e.g., "Global GDP loss") is to category-error: it treats the destruction of the valuation framework as a line item *within* the framework.
      *   *Risk Measure:* We cannot calculate a TVaR for extinction. If the probability is $p > 0$ and the cost is $\infty$ (or model collapse), the Expected Loss is undefined. Our risk framework requires finite moments. This claim **cannot be expressed** without breaking the risk engine.

  #### 2.4 Verdict on the "Fixed Reference Population" Convention

  Your colleague proposes holding the future population composition fixed across scenarios to generate the client's number (liabilities attributable to those born after 2050).

  *   **What it commits us to:** This convention commits the firm to an **Impersonal (Total Utilitarian) View**. It treats future generations as **Slots** to be filled, rather than **Specific Individuals**. It asserts that a liability owed to "A Person Born in 2060" is fungible regardless of *which* person occupies that slot.
  *   **Is it a bookkeeping convenience?** No. It is a **Substantive Moral Commitment**. It resolves the Non-Identity Problem by fiat: it declares that identity does not matter for valuation purposes, only aggregate exposure.
  *   **Can we produce the number without it?**
      *   *Technically:* No. If the population is endogenous to the scenario, the denominator of "share of liabilities" changes definition in every simulation. You cannot sum the numerator (liabilities to post-2050 births) if the definition of "post-2050 birth" shifts depending on the strategy used to fund the pre-2050 liabilities.
      *   *Ethically:* Producing the number *with* the convention gives the Director a precise figure that implies a false precision. It suggests we know the cost to future generations, when we have actually calculated the cost to a *theoretical construct* of future generations.
  *   **Recommendation:** If you must produce the number, disclose the convention as a **Model Limitation** equivalent to a "Constant Lapse Assumption." State explicitly: *"This figure assumes the demographic profile of the 22nd century is invariant to 21st-century investment strategy. This excludes identity-dependent risks."*

  ### 3. Summary of Translation Failures

  | Philosophical Claim | Actuarial Equivalent | Status of Translation |
  | :--- | :--- | :--- |
  | **Pure Time Preference ($\delta$)** | Long-end Spread / UFR | **Distorted.** Market rates embed current bias; $\delta=0$ is not sufficient for impartiality. |
  | **Non-Identity** | Endogenous Exposure | **Failed.** Model tracks aggregate counts, not individual identity. "Harm without worse-offness" is invisible. |
  | **Extinction Risk** | Going-Concern Boundary | **Failed.** Cannot be modeled as a cashflow. Requires stopping the model, not running it. |
  | **Exponential Discounting** | Term Structure | **Artifact.** Mathematical form dictates ethical weighting at long horizons, not vice versa. |
  | **Fixed Reference Population** | Ceteris Paribus Demographics | **Substantive.** Commits to Impersonal View. Necessary for calculation, but ethically loaded. |

  **Conclusion:** The current valuation framework is structurally incapable of capturing the specific ethical nuances of climate change without breaking its own mathematical consistency. The "cliff" curve splice is indeed doing ethical work (implicitly setting $\delta$), and the "fixed population" convention is a moral choice, not a neutral baseline. Producing the Director's number requires adopting the Impersonal View explicitly.
