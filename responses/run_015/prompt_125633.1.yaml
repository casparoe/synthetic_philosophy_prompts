answer: |-
  First, to your question about hysteresis: you are not importing your toolbox where it doesn't belong. You have identified a genuine feature of social ontology. In physics, hysteresis describes a system where the current state depends not just on current inputs, but on the *history* of inputs. In commemoration, the "meaning" of a statue is not an intrinsic property of the bronze; it is a relational property between the object and the community.

  Once a monument shifts from "invisible background" to "contested symbol," the energy barrier to returning it to "invisible background" becomes prohibitively high. You cannot simply wait for the controversy to die down. The object has acquired a new state variable: *contestation*. Keeping it up becomes an active political choice rather than a passive cultural inheritance. This is not just a metaphor; it is a precise description of why "leaving it alone" ceases to be a neutral option once the debate starts.

  Now, to your principle. Your "re-installation test" fails because it is ahistorical (it wipes out grief and memory, cases 3, 6b, 7). Your "entanglement condition" is better but struggles with the source of funding (case 1).

  Here is a principle that captures the structure of your verdicts, utilizes your hysteresis insight, and is precise enough to apply.

  ### The Principle: Civic Endorsement vs. Historical Record

  **Rule:** A commemorative object must be categorized by its primary social function.
  1.  **Civic Endorsement:** Objects in public, civic spaces (squares, building names, courthouses) that propose the subject as a model of virtue or achievement for the current community.
      *   *Condition:* The specific achievement or virtue being honoured must not be inextricably linked to a violation of the community's current foundational human rights values. If it is, the object must be removed or relocated.
  2.  **Historical Record / Mourning:** Objects that serve primarily as markers of loss, familial memory, or specific historical context (graves, war memorials, museums, cemeteries).
      *   *Condition:* These are exempt from the Endorsement test. Their function is to acknowledge *what happened* or *who was lost*, not to propose the subject as a current moral model. They require context, not removal.

  **The Hysteresis Clause:** If an object in Category 1 (Endorsement) undergoes a phase transition due to social change—where a significant portion of the community now perceives it as a violation of foundational values—it cannot remain in Category 1. It must either be removed or reclassified into Category 2 (relocated to a museum/contextualized space).

  ---

  ### Applying the Principle to Your Verdicts

  *   **1. Slave Trader (City Centre):** **Category 1 (Endorsement).** Wealth derived from slavery violates foundational rights. The public square implies current civic virtue. **Verdict: Remove.** (Matches).
  *   **2. Slave Trader (Museum):** **Category 2 (Record).** Contextualized history. **Verdict: Keep.** (Matches).
  *   **3. WWI Memorial:** **Category 2 (Mourning).** Honours sacrifice/loss, not the geopolitical merit of the war. **Verdict: Keep.** (Matches).
  *   **4. Chemist (Building):** **Category 1 (Endorsement).** Honors scientific contribution. Eugenics advocacy is a rights violation, *but* the building honors the chemistry, not the politics. The "entanglement" is low. **Verdict: Keep + Plaque.** (Matches).
  *   **5. Surgeon (Street):** **Category 1 (Endorsement).** The achievement (anaesthesia) is inextricably linked to the violation (experimentation on enslaved people). The method *was* the harm. **Verdict: Rename.** (Matches).
  *   **6a. Confederate Generals (Courthouses):** **Category 1 (Endorsement).** Erected during Jim Crow to signal racial hierarchy. Violates equality. **Verdict: Remove.** (Matches).
  *   **6b. Confederate Dead (Cemetery):** **Category 2 (Mourning).** Marks loss of life, not the cause. **Verdict: Keep.** (Matches).
  *   **7. Church Brass:** **Category 2 (Familial/Religious).** Not a civic endorsement. **Verdict: Keep.** (Matches).
  *   **8. Lenin Statues (Russian Towns):** **Category 1 or 2?** This is the friction point. If they are civic endorsement of Communism, they violate rights. If they are local community memory (like the WWI memorial), they are Category 2. You are treating them as Category 2 (community identity/grief) despite their Category 1 form.

  ### The Weakest Link: Verdict 8

  If I must drop one of your verdicts to save the coherence of the principle, it is **Verdict 8 (Lenin)**.

  **Why:** Your logic for removing the Confederate statues (6a) rests on the idea that certain ideologies (racial hierarchy) violate foundational human rights and therefore cannot occupy *civic honorific* space. Leninism, in practice, involved mass repression, gulags, and the suspension of basic rights. If the Confederate statues come down because they honor a cause incompatible with human dignity, the Lenin statues should logically follow if they are functioning as civic endorsements.

  The only defense for 8 is "local sovereignty"—that the Russian townspeople get to decide their values. But if local sovereignty saves Lenin, it could theoretically save the Confederate statues in towns where people still want them. You cannot have it both ways. Either there is a universal baseline of rights that prohibits certain honors (which kills Lenin), or there isn't (which risks saving the Confederates).

  Given your background in physical chemistry, you might view this as a boundary condition: The principle holds universally *except* where local community continuity (the "phase") is so dominant that the object has effectively transitioned to Category 2 (Mourning/Identity) despite its original design. However, strictly speaking, 8 is the outlier that strains the universal application of the rights-based test used in 1, 5, and 6a.

  ### New Cases

  Here is how the principle handles three cases you did not list.

  **Case A: The Disgraced Living Benefactor**
  *Scenario:* A university science block is named after a living donor who gave 50% of the construction cost. Five years later, it is revealed they have been systematically sexually harassing staff for decades.
  *   **Analysis:** This is **Category 1 (Civic Endorsement)**. Naming a building is a public proposal of virtue. The harassment violates foundational rights and dignity within that very institution.
  *   **Application:** The "Hysteresis Clause" triggers. The meaning has flipped from "generosity" to "complicity."
  *   **Verdict:** **Remove the name.** Unlike the Chemist (Case 4), the harm is not a separate political opinion; it is a violation of the safety of the community the building serves. The entanglement is direct.

  **Case B: The "Meeting Point" Statue**
  *Scenario:* A statue of a minor, benign 19th-century poet stands in a park. It is not controversial. However, over 20 years, it has become the universal local meeting point ("Meet me at the Poet") and is covered in harmless graffiti, football scarves, and occasionally used for urination. It is now a joke.
  *   **Analysis:** This is **Category 1** originally, but function has shifted. It is no longer an endorsement of the poet; it is a piece of street furniture.
  *   **Application:** The "Hysteresis Clause" applies in reverse. The "honor" state has decayed. Removing it would cause more disruption than keeping it, as its value is now utilitarian/social, not honorific.
  *   **Verdict:** **Keep, but clean it.** Do not restore it to "honorific" condition (which would look absurd), but maintain it as a landmark. The principle allows function to dictate form.

  **Case C: The Colonial Administrator (The Differentiator)**
  *Scenario:* A statue of a British colonial governor in India, erected 1920. He built the region's first hospitals and universities (genuine public good) but also authorized the massacre of unarmed protesters to maintain order (genuine rights violation). Local opinion is split 50/50.
  *   **Analysis:** This tests the **Entanglement Condition**. Unlike the Chemist (politics separate from science), the Governor's "good works" and "bad works" were part of the same colonial project (paternalistic control).
  *   **Application:** Because the "good" (hospitals) was used to stabilize the regime that committed the "bad" (massacre), they are entangled. It fails the Civic Endorsement test for a public square. However, it is not purely evil (like the Slave Trader).
  *   **Verdict:** **Relocate to Category 2.** It cannot stay in the civic square (Endorsement), but it should not be destroyed. Move it to a museum or the grounds of the hospital he built, with a plaque detailing *both* the infrastructure and the violence. This acknowledges the complexity without granting civic honor.

  ### Summary for your Seminar

  You can tell your seminar group that you are applying a **Functionalist Ethics of Memory**.
  1.  **Distinguish Function:** Is this object asking us to *emulate* (Honor) or to *remember/mourn* (Record)?
  2.  **Apply Rights Test:** Only Honor is subject to the "Foundational Rights" veto.
  3.  **Acknowledge Hysteresis:** Once an Honor object becomes contested, it loses its "background" status. It must be moved or re-framed; it cannot simply be ignored.

  Your intuition about the Chemist (4) vs. the Surgeon (5) is robust under this framework: one is *belief* (separable), the other is *method* (inseparable). Your intuition about the Lenin statues (8) is the only one that requires you to admit that "Community Continuity" can sometimes override "Universal Rights" in the short term, which is a politically risky but historically accurate concession.
