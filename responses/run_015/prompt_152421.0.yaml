      *   *Fruitfulness vs. Intuition:* Skolem was skeptical of "self-evident" axioms (like Power Set). He preferred viewing axioms as rules for generating sets. This aligns with the *metaphysical/relativist* reading. If axioms are just rules, then truth is truth-in-the-system, not correspondence to a Platonic realm. This anticipates the "internalist" reading mentioned by the user.

