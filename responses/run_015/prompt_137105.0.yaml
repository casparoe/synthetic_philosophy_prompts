  **MEMORANDUM**

  **TO:** Campus Food and Wellness Committee
  **FROM:** Undergraduate Student Representative
  **DATE:** October 23
  **SUBJECT:** Recommendation on Verdant "Streak Prompt" Proposal

  **Recommendation**
  I recommend that the Committee **approve the "Streak Prompt" pilot on a conditional basis**. The pilot should run for eight weeks during the spring term, with a mandatory report to this Committee at week 10. Approval is contingent on three specific conditions regarding data transparency, commercial usage, and the definition of success metrics. We should not adopt the proposal permanently until the pilot data is reviewed.

  **Context**
  The Committee previously rejected making salads the default option (5–4), citing paternalism. Two Taps now proposes a "streak prompt": if a student orders the same default combo (fries/soda) five days in a row, the app interrupts to ask if they wish to keep or switch. This is not a default change but a friction point. Verdant requires an eight-week randomized rollout to validate the feature for other campuses. The IRB has classified this as quality improvement, not research.

  **The Autonomy Argument (Two Taps)**
  The strongest case for this proposal rests on a distinction between *substantive* and *procedural* interference. The rejected salad default was substantive: it substituted the Committee's judgment about what students *should* eat for the students' own judgment. The Streak Prompt is procedural. It does not advocate for salad; it advocates for *choosing*.

  Two Taps correctly identifies that the status quo is not neutral. The current one-tap fries/soda option is itself a nudge encoding a preference for speed over health. By leaving that frictionless path untouched while adding friction to the *pattern* of repetition, the prompt targets habit rather than preference. The "dismiss three times" clause attempts to respect negative liberty—the right to be left alone. If autonomy requires that choices be reflective rather than robotic, interrupting a five-day streak serves autonomy rather than overriding it.

  **The Manipulation Objection (Halvorsen/Okonjo)**
  However, Prof. Halvorsen's "washout objection" must be steelmanned. If the prompt were truly neutral regarding outcomes, Verdant would have no incentive to fund it. The expectation is that reflection will lead to healthier choices. Therefore, the neutrality is procedural clothing for a substantive bet on student welfare. This risks manipulation: manufacturing doubt in students who are content with their choices.

  Furthermore, we must address the captive audience concern. On-campus residents cannot opt out of the meal plan, and the app is the primary interface for that plan. For these students, the "dismiss" button is not a true exit route. If the UX is designed to interrupt habits for their own good, we establish a precedent that the University may manipulate the choice architecture of essential services. This is distinct from nudging a voluntary purchase; it is managing the behavior of a captive population.

  **The Commercial Risk**
  Finally, Verdant's condition for building this feature is the ability to sell the UX to other campuses. This creates a slippery slope. If we authorize habit-interruption for wellness today, we authorize it for margin tomorrow. Verdant has hinted at using similar streak prompts to upsell desserts. If we accept that interrupting a pattern is legitimate when *we* define the good, we cannot easily block Verdant from interrupting patterns when *they* define the good (profit).

  **Resolution and Conditions**
  My recommendation hinges on treating this pilot as a test of *agency*, not health. The philosophical gap here is between intervening on a single choice versus intervening on a pattern. We can justify the latter only if the goal is restoring deliberative capacity, not shifting caloric intake. To bridge this gap and address the Committee's split, I propose the following conditions for approval:

  1.  **Data Transparency:** Verdant must share raw data with the Committee, not just summaries. We need to see not only *if* students switched, but *what* they switched to. If 95% of switches are to other high-calorie options, the "wellness" justification fails, and the manipulation objection stands confirmed.
  2.  **Commercial Firewall:** Approval for this pilot does not grant Verdant rights to replicate this UX for commercial upselling (e.g., desserts, premiums) without separate Committee review. The "quality improvement" classification cannot be used to bypass governance on profit-driven nudges.
  3.  **Success Metrics:** The pilot is successful only if it demonstrates increased engagement without significant student complaint volume. If the "dismiss three times" clause is triggered excessively, it indicates the prompt is perceived as harassment, not assistance.

  **Pilot Structure**
  The eight-week spring term timeline is acceptable, provided the week 10 report includes qualitative feedback from student focus groups, not just transaction logs. We need to know if students felt the prompt was helpful or insulting. If the data shows the prompt functions as a hidden health mandate (validating Halvorsen's view) or if Verdant attempts to monetize the mechanic during the pilot, the feature must be killed immediately.

  **Conclusion**
  We are not deciding whether to nudge; the app already nudges. We are deciding whether to nudge for reflection or for habit. This proposal sits on the knife-edge between promoting autonomy and manufacturing doubt. By approving it with strict conditions, we allow Two Taps to test their theory of procedural autonomy while protecting students from Verdant's commercial interests and validating Dr. Okonjo's concerns about captive audiences. We treat the students as ends capable of reflection, not merely means for health metrics or corporate data.

  I move we adopt this conditional approval.
