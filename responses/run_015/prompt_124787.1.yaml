answer: |-
  This is an exceptionally sophisticated piece of moral reasoning. You have identified the central tension in modern welfare philosophy: the conflict between *social insurance* (you paid in, so you can draw out), *mutual obligation* (society supports you, so you must contribute back), and *paternalism* (the state knows how you should live better than you do).

  Your confusion is not a failure of logic; it is a sign that your intuition is detecting nuances that a single, simple slogan cannot capture. Your friend's "net contributor" theory fails because it is purely actuarial; it cannot account for care work (Marta) or moral refusal (Nadia). Your own three-part draft is stronger, but it breaks on Dwayne (volunteering vs. novel) and Sunil (proportionality).

  Here is the test of your original principle, the repaired version, the necessary sacrifices, and the application to your new cases.

  ### Part 1: Testing Your Original Principle

  1.  **"Support is insurance-like... state is entitled to investigate ability but not judge time use."**
      *   **Holds for:** Grace (spending), Marta (care is a valid use of time).
      *   **Breaks on:** Dwayne. If the state cannot judge how you use your time, it cannot privilege *volunteering* over *writing a novel*. Both are non-paid uses of time. By allowing volunteering to count, you are implicitly arguing that the state *can* judge the social value of time use.
  2.  **"Fraud is a separate wrong... taking money under a false description."**
      *   **Holds for:** Aisha. This distinction is robust. Fraud breaks the contract; non-compliance breaches a term.
  3.  **"Conditions must be known and met at the point of claiming... not quietly tightened."**
      *   **Holds for:** Sunil (admin error), Ravi (medical assessment error).
      *   **Breaks on:** The *severity* of sanctions. Your principle explains why Sunil shouldn't be sanctioned *at all*, but it doesn't explain why a 4-week sanction is proportionate for Dwayne (job refusal) but grotesque for Sunil (admin error). You need a theory of *culpability*, not just *feasibility*.

  ### Part 2: The Repaired Principle (The Contract of Reciprocity)

  To accommodate your verdicts, we must move from an "Insurance" model to a "Reciprocal Citizenship" model. The state provides security; the citizen provides availability for social contribution.

  **Clause 1: The Basis of Claim (Motivated by Marta & Ravi)**
  > Support is owed not merely on past contributions, but on present *availability for social contribution*. A claimant is unavailable if they are physically/mentally incapacitated (Ravi) or if their time is already claimed by necessary care duties that society otherwise would have to fund (Marta).
  > *Repair:* This expands "inability" to include "competing social obligations" like care.

  **Clause 2: The Valuation of Activity (Motivated by Dwayne)**
  > The state may distinguish between *private consumption of time* and *public contribution*. Conditions are met by paid work or unpaid activity that generates public value (volunteering). Purely private projects (writing a novel for potential future gain) do not count as reciprocity during the claim period.
  > *Repair:* This explicitly permits the state to judge the *social utility* of time use, abandoning the "no judgement" rule from your original draft.

  **Clause 3: The Culpability Constraint (Motivated by Sunil)**
  > Sanctions must be proportionate to the claimant's *moral culpability*. A sanction for administrative error (zero culpability) is impermissible. A sanction for flat refusal (high culpability) is permissible. Where culpability is low, sanctions must be negligible or non-existent.
  > *Repair:* This solves the Sunil paradox. Structurally the money loss is the same, but morally the blame is different.

  **Clause 4: The Fraud Distinction (Motivated by Aisha)**
  > Fraud is not a breach of conditionality but a violation of the legal contract itself. It warrants punitive penalty rather than mere withdrawal of support, as it undermines the system's integrity rather than just an individual exchange.
  > *Repair:* Retains your original insight but clarifies *why* it is different (systemic integrity vs. individual compliance).

  **Clause 5: The Anti-Paternalism Rule (Motivated by Grace)**
  > Once support is received, the state has no authority to judge private consumption choices, provided they do not indicate fraud. The claimant is a moral agent, not a ward of the state.
  > *Repair:* Codifies the "nobody's business" verdict.

  ### Part 3: The Sacrifices

  To maintain this consistent framework, you must abandon two of your intuitions:

  1.  **The "Flicker of Irritation" regarding Grace:**
      You must discard this entirely. Under Clause 5, Grace is a moral agent. If the money is hers legitimately, her purchase is an exercise of agency. Your irritation is likely a class-based or cultural bias (the "deserving poor" trope) that contradicts your own principle of agency. A defensible principle cannot accommodate a feeling that implies she is incapable of managing her own affairs.
  2.  **The Idea that the State Cannot Judge Time Use:**
      You wrote that the state is "not to pass judgement on how well you use your time." You must abandon this. To count volunteering but not the novel *is* a judgement on time use. You must accept that welfare is a *quid pro quo*: society pays for *social availability*. If you are not available for social value (work or volunteering), the reciprocity is broken. The novel is a private investment; volunteering is a public dividend.

  *Note on Ravi:* You felt Ravi's case was "worse" than Marta's. The principle supports this, but not because his need is greater. It is worse because it involves **Epistemic Injustice**. In Marta's case, the state acknowledges her care duty but weighs it against work. In Ravi's case, the state *denies his reality* (declaring him fit when he is not). A system that gaslights the claimant is morally worse than one that disagrees with them.

  ### Part 4: Verdicts on New Cases

  Applying the **Contract of Reciprocity**:

  **1. Nadia (Refuses weapons components job)**
  *   **Verdict:** She should not be sanctioned.
  *   **Reasoning:** Under Clause 1 (Availability), availability is not absolute. A democratic society recognises conscientious objection as a valid limit on "social contribution." Forcing her to build weapons negates her citizenship status (moral agent). This is a "reasonable refusal" akin to Marta's care duties.

  **2. Lone Parent (Work pays less than childcare)**
  *   **Verdict:** She should not be sanctioned / Condition is invalid.
  *   **Reasoning:** Under Clause 1, she is not truly "available" if the net economic result is a loss. Furthermore, if she works, the state saves on benefits but incurs a cost in childcare support (or the child suffers neglect). Requiring work that results in a net loss to the household is a condition she "could not have met" in a rational sense (Clause 3 spirit). It is a bureaucratic fiction of availability.

  **3. The Housing Trap (Formal job loses top-up)**
  *   **Verdict:** This is a policy failure, not a claimant failure. She should not be sanctioned.
  *   **Reasoning:** This is the "Benefit Trap." If taking the job leaves her financially worse off, the "incentive" structure of the welfare state is broken. Under Clause 3 (Culpability), it is not culpable to refuse financial harm. However, the principle suggests the *state* should adjust the taper rate of benefits, not that the claimant should accept poverty.

  **4. Pensions and Student Grants**
  *   **Verdict:** The principle does **not** govern these in the same way.
  *   **Reasoning:**
      *   **Pension:** This is **Deferred Wage/Insurance**, not Reciprocity. You paid in explicitly to draw out later. Conditionality (e.g., "you must volunteer to get your pension") is illegitimate here. It violates the insurance contract.
      *   **Student Grant:** This is **Capacity Building**. The "contribution" is not immediate labor, but the development of future human capital. Conditionality should be based on *academic progress*, not labor market availability. To apply the "workfare" principle to students is to mistake investment for maintenance.
      *   **Conclusion:** Your "insurance" framing was actually doing the work for the Pension verdict, but the "Reciprocity" framing is required for Working Age Benefits. They are distinct moral categories.

  ### Summary

  You have moved from a vague sense of fairness to a **Reciprocal Citizenship** model.
  *   **The Core:** Support is bought with *availability for social contribution*, not just past taxes.
  *   **The Limit:** The state can judge the *social value* of your time (Volunteering yes, Novel no), but cannot judge your *private consumption* (TV yes).
  *   **The Safeguard:** Sanctions must match *culpability* (Admin error no, Refusal yes).

  You are seventeen. The fact that you found the "Insurance" model insufficient for Marta and the "Liberty" model insufficient for Dwayne suggests you are thinking like a policy architect. Keep the irritation about Grace, but recognise it as a bias to be checked, not a principle to be followed.
