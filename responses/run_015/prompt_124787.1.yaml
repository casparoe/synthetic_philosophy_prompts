prompt: |-
  I'm seventeen, in the second year of sixth form, and I recently spoke at a debating competition on whether state support should come with conditions attached. I prepared it by reading about conditionality, sanctions, workfare-style schemes where you work for your payment, and the recurring panic about benefit fraud, and I came away with the opposite of a settled view: I have very firm reactions to individual cases and no idea what general thing I believe. I've written my verdicts down below in the hope that someone can tell me whether a single principle generates them, which of them I would have to abandon to get a principle, and what the principle says about the cases I can't make up my mind on.

  Marta is fifty-four, worked twenty-five years in a textile factory that closed, and is offered warehouse night shifts an hour's bus ride away, which she refuses because she looks after her mother three afternoons a week. She is sanctioned. I think that is wrong. Dwayne is twenty-three, walked out of a call-centre job he hated, refuses that employer's offer to take him back, and wants six months to finish a novel. I think it is fine to require him to take work or lose the payment, and I feel none of the anger I feel about Marta. But I also think unpaid volunteering at a food bank ought to count as meeting his conditions, and I cannot say why that is different from the novel. Aisha works four shifts a week for cash at her cousin's restaurant while claiming jobseeker's allowance and doesn't declare it. That is not just something the state may stop; it deserves an actual penalty, and it feels to me like a different kind of wrong from Marta's or Dwayne's, not merely a worse version of it. Ravi has severe depression, can't get a diagnosis in time, is recorded as fit for work, and loses money for missing a work-focused interview. I think that is worse than Marta's case, and I'm not sure why. Grace spends a lump sum on an enormous television. My considered view is that it is nobody's business, but I feel a flicker of irritation I can't defend. Sunil misses one appointment because the letter went to the wrong address and loses four weeks of money, which strikes me as grotesque, even though I find a four-week reduction proportionate for flatly refusing an offered job. Those two are structurally the same, and I react to them as if they weren't.

  The best I can do on my own is this: support is insurance-like, owed in virtue of past contributions together with present inability, so the state is entitled to investigate whether you are able to work but not to pass judgement on how well you use your time; fraud is a separate wrong rather than a failed condition, because it involves taking money under a false description of the facts, which is why it can be punished and not merely withdrawn; and any condition must be one the claimant could have known and met at the point of claiming, and must not be quietly tightened afterwards. A friend of mine says the whole matter reduces to whether someone is a net contributor over a lifetime, and I don't think that reaches Marta at all. Please test my three-part principle against the cases above and repair it where it breaks, stating the finished version precisely, clause by clause, with the case that motivates each clause. Then tell me, honestly, which of my verdicts no defensible version of it can keep. Finally, I'd like its verdicts on cases I haven't listed: Nadia, who refuses an offered job because the employer makes components for weapons; a lone parent who turns down work paying less than the childcare that would make the work possible; someone who stays in cash work because taking the formal job would cost them their housing top-up; and whether the same principle governs a pension or a student maintenance grant, or whether the insurance framing has been doing all the work in my verdicts about workers.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** 17 years old, second year of sixth form (UK education system, approx. A-Level year 2). This indicates high intelligence, strong writing ability, and engagement with political philosophy/social policy. The tone is sophisticated, nuanced, and self-reflective.
      *   **Task:** The user has presented a set of intuitive verdicts on specific welfare cases (Marta, Dwayne, Aisha, Ravi, Grace, Sunil) and a preliminary three-part principle. They want me to:
          1.  Test their principle against the cases.
          2.  Repair/refine the principle to fit the cases (stating it precisely, clause by clause, with motivating cases).
          3.  Identify which verdicts must be abandoned for consistency.
          4.  Apply the final principle to new cases (Nadia, lone parent, housing trap, pension/student grant).
      *   **Tone:** Respectful, intellectually rigorous, acknowledging the sophistication of the user's thinking while providing constructive critique. Avoid condescension. Treat them as a junior colleague in philosophy/politics.

  2.  **Deconstruct the User's Verdicts:**
      *   *Marta (54, factory closed, care duties, sanctioned for refusing night shift):* Wrong to sanction. (Reason: Care duties + reasonable refusal).
      *   *Dwayne (23, quit job, wants to write novel):* Fine to sanction/require work. *But* unpaid volunteering should count. (Reason: Novel = leisure/selfish? Volunteering = social good? Inconsistency noted by user).
      *   *Aisha (Cash in hand fraud):* Deserves penalty, distinct wrong. (Reason: Fraud vs. Non-compliance).
      *   *Ravi (Depression, no diagnosis, sanctioned):* Worse than Marta. (Reason: Incapacity beyond control + administrative failure).
      *   *Grace (TV purchase):* Nobody's business, but feels irritation. (Reason: Paternalism vs. Stewardship).
      *   *Sunil (Admin error sanction):* Grotesque. (Reason: Procedural fairness/Proportionality).

  3.  **Deconstruct the User's Preliminary Principle:**
      1.  *Insurance/Contribution:* Support owed due to past contributions + present inability. State can investigate ability, not judge time use.
      2.  *Fraud Distinction:* Fraud is a separate wrong (false description), punishable, not just withdrawal.
      3.  *Notice/Feasibility:* Conditions must be known/met at point of claiming, not tightened quietly.

  4.  **Test the Principle against the Cases (Gap Analysis):**
      *   *Marta:* Fits Principle 1 (Inability due to care?) and 3 (Condition unreasonable?). But "Insurance" might not cover care duties if not previously contributed specifically for that.
      *   *Dwayne:* Fits Principle 1 (Able to work, choosing not to). *Problem:* Why does volunteering count but novel doesn't? Principle 1 says state shouldn't judge "how well you use your time." If volunteering counts, the state *is* judging the value of time use. This is a contradiction.
      *   *Aisha:* Fits Principle 2 perfectly.
      *   *Ravi:* Fits Principle 1 (Present inability). Fits Principle 3 (Condition not meetable). Why "worse than Marta"? Maybe severity of inability?
      *   *Grace:* Principle 1 says "not pass judgement on how well you use your time." This supports the "nobody's business" verdict. The "irritation" is extra-principled (social norm).
      *   *Sunil:* Fits Principle 3 (Condition not meetable due to admin error). But why is 4 weeks grotesque here but proportionate for job refusal? Principle 3 doesn't cover *proportionality of sanction*, only the *condition itself*.

  5.  **Develop the Repaired Principle:**
      *   *Core Tension:* The user wants to distinguish between "can't work" (Marta/Ravi), "won't work" (Dwayne), and "cheated" (Aisha). They also want to value social contribution (Volunteering) without being paternalistic about spending (Grace).
      *   *Refinement 1 (The Basis of Claim):* Move away from strict "insurance/contribution" (which fails Marta if she didn't contribute enough, or Ravi if young). Move towards "Citizenship/Mutual Obligation." You get support if you are *available* for social contribution, broadly defined.
      *   *Refinement 2 (The Value of Time):* To solve Dwayne (Novel vs. Volunteering), the principle must distinguish between *private* consumption of time and *public* contribution. Volunteering is a contribution; writing a novel (in this context) is seen as private leisure.
      *   *Refinement 3 (Procedural Justice):* To solve Sunil, we need a clause on *Proportionality* and *Control*. Sanctions must match the culpability.
      *   *Refinement 4 (Fraud):* Keep the distinction. Fraud breaks the contract; non-compliance breaches a term.

      *Drafting the Clauses:*
      1.  *Eligibility:* Based on need + willingness to contribute (broadly defined).
      2.  *Conditionality:* Conditions must be within the claimant's control (Ravi/Marta/Sunil).
      3.  *Valuation of Activity:* Activities with public benefit count as compliance (Dwayne/Volunteering).
      4.  *Sanctions:* Must be proportionate to culpability (Sunil vs. Job Refusal).
      5.  *Fraud:* Distinct category (Aisha).
      6.  *Paternalism:* Spending is private (Grace).

  6.  **Identify Verdicts to Abandon:**
      *   *The "Irritation" about Grace:* If the principle is "spending is private," the irritation is prejudicial and must be discarded.
      *   *Dwayne's Novel vs. Volunteering:* If the principle is "state shouldn't judge time use," volunteering shouldn't count. If volunteering counts, the state *is* judging value. The user must accept that the state *can* value public good over private projects. This means abandoning the "no judgement on time use" part of their original Principle 1.
      *   *Marta vs. Ravi:* User says Ravi is "worse." Is it? Both are inability. Maybe Ravi is worse because of the *administrative* failure to recognize illness. This can be kept if framed around procedural injustice.

  7.  **Address the New Cases:**
      *   *Nadia (Weapons):* Conscientious objection. Does public benefit override moral objection? Usually, reasonable refusal allows for ethical constraints.
      *   *Lone Parent (Childcare costs):* Economic irrationality. If work pays less than childcare, "ability to work" is negated by net loss. Condition fails the "feasibility" test.
      *   *Housing Trap (Formal job loses top-up):* The "Benefit Trap." Similar to above. If taking the job leaves them worse off, the condition is unreasonable.
      *   *Pension/Student Grant:*
          *   Pension: Deferred wage/Insurance. Less conditionality appropriate.
          *   Student Grant: Investment in future capacity. Conditionality based on academic progress, not labor market.
          *   *Conclusion:* The "Insurance" frame works for Pension, less for Welfare (which is mutual obligation), less for Student Grants (which is investment).

  8.  **Structure the Response:**
      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the confusion (it's a classic philosophical tension).
      *   **Part 1: Testing the Original Principle:** Show where it holds and where it leaks (specifically Dwayne and Sunil).
      *   **Part 2: The Repaired Principle:** Present the numbered clauses with case motivations.
      *   **Part 3: The Sacrifices:** Honestly state which intuitions don't fit (Grace's irritation, the strict "no judgement" on time).
      *   **Part 4: The New Cases:** Apply the principle.
      *   **Part 5: Pension/Grants:** Distinguish the frameworks.
      *   **Conclusion:** Encouraging closing thought.

  9.  **Refining the Tone:**
      *   Ensure I don't sound like I'm "grading" them. Use phrases like "Your intuition here is robust," "The tension lies here," "A consistent framework requires..."
      *   Keep the UK context in mind (Sixth form, JSA, sanctions).
      *   *Self-Correction on Dwayne:* The user asks *why* volunteering is different from the novel. The answer is "Social Reciprocity." The welfare contract is society supports you, you contribute back. Volunteering is contribution; novel-writing (in this specific context of avoiding work) is seen as consumption. I need to make sure this distinction is clear.

  10. **Final Review against Constraints:**
      *   Did I state the finished version precisely, clause by clause? Yes.
      *   Did I state the case motivating each clause? Yes.
      *   Did I say which verdicts to abandon? Yes.
      *   Did I answer the new cases? Yes.
      *   Did I address Pension/Grants? Yes.

      *(Self-Correction during drafting)*: I need to be careful with the "Insurance" model. The user's friend suggested "net contributor." The user rejected it. I should explain *why* the insurance model fails Marta (she contributed but is still sanctioned) and why a "Citizenship/Mutual Obligation" model works better.

      *(Refining the Sunil verdict)*: The user says 4 weeks is proportionate for job refusal but grotesque for admin error. This implies *Culpability* matters. The principle needs a "Culpability Constraint."

      *(Refining the Grace verdict)*: The user feels irritation but says it's nobody's business. The principle should validate the "nobody's business" part and classify the irritation as a bias to be overcome.

      *(Refining Ravi)*: Why is Ravi worse than Marta? Marta has a *reason* (care) but chooses not to work. Ravi has an *incapacity* but is *classified* as able. Ravi involves a lie by the state (that he is fit). Marta involves a conflict of duties. Ravi is epistemic injustice + material harm. Marta is conflicting rights. Ravi is worse because the state is gaslighting him. I will incorporate "Epistemic Authority" into the principle.

