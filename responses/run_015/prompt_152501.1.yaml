  8.  *(Mental Check on Anscombe)*: Anscombe's "Intention" (1957) is the technical work, but "Mr. Truman's Degree" is the political application. The prompt mentions the Truman protest specifically. I need to lean heavily on the idea that *consequences do not justify the act*.
      *(Mental Check on Strangelove)*: The film is about the failure of rationality. Anscombe assumes rational agents can choose good. The film suggests the system makes choice impossible.

  9.  **Structuring the Response:**
