answer: |-
  This is a sharp observation. Your professor is implicitly navigating the tension between **agent-centered** accounts of dirty hands (focused on the moral burden and sacrifice of the leader) and **institution-centered** accounts (focused on the health of the democratic system).

  Here is the breakdown of the two competing rules, how they read the past five verdicts, their prediction for the forged-referendum case, a tie-breaker scenario, and a potential third rule.

  ### 1. The Two Competing Rules

  #### Rule A: The Stain-Bearing Rule (Agent-Centric)
  **The Logic:** A rights violation is justified as "dirty hands" if (1) it prevents catastrophic harm, and (2) the agent voluntarily accepts the personal, legal, and moral cost (the "stain") to reaffirm that the act was an exception, not a new norm. The focus is on the **agent's sacrifice** balancing the moral ledger.

  *   **Reads the Past Verdicts:**
      *   **Cases 1, 2, 5 (Justified):** In all three, the agent accepts accountability (apology, trial, retroactive authorization). The "stain" is taken.
      *   **Cases 3, 4 (Not Justified):** In Case 3, the mayor's lie creates a debt that resignation can't fully pay (trust is gone). In Case 4, the diplomat *cannot* pay the stain because there is no international court to submit to; the "cost" cannot be meaningfully borne.
  *   **Prediction for Case 6 (Forged Referendum):** **Justified.**
      *   *Reasoning:* The official averted catastrophe (toxic spill) and satisfied the core condition: she did not hide. She confessed, resigned, and submitted to prosecution. She bore the full stain. Under this rule, the personal sacrifice cleans the act.

  #### Rule B: The Institutional-Integrity Rule (System-Centric)
  **The Logic:** A rights violation is only justified if it does not permanently corrupt the **epistemic or procedural foundations** required for the polity to function. Some wrongs (lying about risk, rigging votes) destroy the public's ability to be rational agents or trust the system, regardless of whether the leader apologizes. The focus is on **systemic restorability**.

  *   **Reads the Past Verdicts:**
      *   **Cases 1, 2, 5 (Justified):** Property rights (Case 1) and procedural rules (Case 5) can be restored via compensation or votes. Torture (Case 2) is horrific, but submitting to trial *reaffirms* the Rule of Law. The system survives.
      *   **Cases 3, 4 (Not Justified):** Lying about risk (Case 3) destroys *epistemic trust* (citizens can't assess danger). Blackmail (Case 4) corrupts diplomatic norms with no legal framework to clean it. These acts rot the system's ability to function later.
  *   **Prediction for Case 6 (Forged Referendum):** **Not Justified.**
      *   *Reasoning:* Forging election results is structurally identical to the Mayor's lie (Case 3) but worse. It attacks the *source* of democratic legitimacy. Even if the official resigns, the act proves the electoral mechanism is fragile and manipulable. You cannot "restore" the integrity of a vote that never happened. The stain on the *system* is permanent, even if the agent is punished.

  ---

  ### 2. The Tie-Breaker Case

  To force your professor to reveal which rule she is actually running, you need a case where the **Agent bears the stain** (satisfying Rule A) but the **System is epistemically corrupted** (violating Rule B).

  **The Case: The "Staged Threat"**
  > A Defense Secretary, knowing Congress will not fund a vital missile defense in time to stop an imminent attack, stages a minor, non-lethal fake terror incident on domestic soil. Panic ensues, Congress funds the system, the missile threat is neutralized, and thousands are saved. The Secretary immediately holds a press conference, reveals the deception, resigns, and surrenders to federal prosecutors.

  *   **Rule A (Stain-Bearing) says: Justified.**
      *   Catastrophe averted? Yes.
      *   Agent bears stain? Yes (resignation + prosecution).
      *   *Verdict:* The moral ledger is balanced by the Secretary's sacrifice.
  *   **Rule B (Institutional-Integrity) says: Not Justified.**
      *   This is a direct parallel to the Mayor's water lie (Case 3). It corrupts the public's epistemic access to reality. If the government can fake terror to get policy passed, the public can no longer assess risk or policy rationally. The *system's* truth-function is broken, regardless of the Secretary's resignation.

  **Why this splits them:** If she calls this **Justified**, she is prioritizing the Agent's sacrifice (Rule A). If she calls it **Not Justified**, she is prioritizing Institutional Epistemics (Rule B).

  ---

  ### 3. Is There a Third Rule?

  Yes. There is a subtler rule hiding in the distinction between Case 2 (Torture/Justified) and Case 3 (Lie/Not Justified).

  #### Rule C: The Norm-Reaffirmation Rule
  **The Logic:** Dirty hands are only justified if the *accountability mechanism* serves to **reaffirm the specific norm that was violated.** The punishment must prove the rule still matters.

  *   **How it reads the verdicts:**
      *   **Case 2 (Torture):** Submitting to a criminal trial reaffirms that *torture is a crime*. The punishment validates the norm.
      *   **Case 1 & 5 (Property/Procedure):** Legislative approval reaffirms that *legislative authority matters*.
      *   **Case 3 (Lie):** Resignation does not bring back the truth at the moment it was needed. You cannot "reaffirm" truth-telling by lying, even if you apologize later. The norm is self-negating.
      *   **Case 4 (Blackmail):** There is no court to reaffirm diplomatic norms.
  *   **Application to Case 6 (Forged Referendum):**
      *   **Verdict:** **Not Justified.**
      *   *Reasoning:* Prosecuting the official punishes the *person*, but it does not reaffirm the *vote*. You cannot hold a "do-over" election that erases the forgery. Unlike torture (where the trial reaffirms the law against torture), punishing a forger does not restore the democratic will that was bypassed. The norm (popular sovereignty) was rendered moot, not just violated.

  **Summary of the Third Rule:** This rule is stricter than Rule A (Stain) and more specific than Rule B (Integrity). It asks: *Does the punishment fix the specific moral break?* In Case 6, the break is in the chain of popular consent. No amount of prosecution can re-link that chain.

  ### Recommendation for Seminar
  If you want to press the professor, ask about the **"Staged Threat"** tie-breaker. It isolates the variable of *epistemic corruption* vs. *personal sacrifice*.

  However, if you want to show deep engagement, raise **Rule C (Norm-Reaffirmation)**. Point out that in Case 2, the trial *makes sense of* the torture by reaffirming the law. Ask her: *"In the referendum case, does prosecution actually reaffirm the value of the vote, or does it just punish the voter's surrogate? Is there a difference?"* That gets to the heart of whether dirty hands can ever exist in the core mechanics of democracy itself.
