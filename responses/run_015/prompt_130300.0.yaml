answer: |-
  Here is the ranking from most locked in to least locked in, based on switching costs and the age of the standard:

  1.  **QWERTY Layout**
      It survives because retraining billions of fingers and replacing physical hardware creates switching costs that vastly outweigh the ergonomic benefits of alternatives.
  2.  **TCP/IP as the Network Standard**
      Replacing it would require coordinating a simultaneous global upgrade of every connected device and router, making the network effect practically insurmountable.
  3.  **English as the Language of Code**
      Since programming syntax and technical documentation are globally standardized around English, shifting would require retraining every developer and rewriting every library.
  4.  **Python Being the Default for ML**
      While libraries create massive momentum, languages have shifted before (like C++ to Python), so performance needs could eventually force a migration to something like Rust or Julia.
  5.  **RLHF for Aligning Language Models**
      This is the newest and least stable paradigm, with active research into alternatives like DPO or constitutional AI already challenging its dominance.

  ***

  On your broader question: tech history is layered, where infrastructure locks in hard but algorithms shift rapidly when performance plateaus hit.

  You're right that RLHF feels like a patch because it essentially brute-forces alignment rather than solving it architecturally, but that doesn't mean we're stuck with it forever. In ML specifically, the field is too young for true path dependence; when a fundamentally better design emerges that offers a step-change in capability or efficiency (like Transformers did to RNNs), the industry switches surprisingly fast because the economic incentive overrides the switching cost. So while we are patching now, you shouldn't bet against a paradigm shift happening within the next decade once we hit the limits of what reward modeling can do.
