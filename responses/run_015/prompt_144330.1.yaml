answer: |-
  **SEMINAR NOTES: Desiderata for Cross-Cultural Moral Objectivity**

  **1. Core Desiderata (What the Theory Must Accommodate)**
  To avoid the "cultural packages" trap while retaining objectivity, a theory must satisfy these conditions:

  *   **The Phenomenology of Obligation:** Must explain why purity/loyalty violations *feel* like moral violations (objective wrongs) to agents in those cultures, not just like "local tastes." If a Brahmin feels pollution is objectively wrong, the theory cannot dismiss this as mere error without explaining the error's structure.
  *   **Parameter Variation vs. Parameter Absence:** Must distinguish between cultures having different *weights* on shared values (e.g., Loyalty > Fairness) vs. having *no concept* of a value. Objectivity survives if the "control panel" is universal, even if the "settings" vary.
  *   **The Turiel/Shweder Constraint:** Must account for the fact that the Moral/Convention distinction (Turiel) is WEIRD-specific. In many cultures, ritual violations (Shweder's "Ethic of Divinity") are coded as moral harm, not social convention. The theory cannot define "moral" solely by WEIRD harm/fairness criteria without begging the question.
  *   **Internal Critique Capability:** Must allow for members of a culture to critique their own norms (e.g., Indian reformers against Sati) using reasons intelligible to outsiders. If morality is just a "package," internal reform is just switching packages, not moral progress.

  **2. Empirical Constraints (Psych/Anthro Findings)**
  The theory cannot contradict the following data points:

  *   **Haidt's Moral Foundations:** People across cultures utilize (to varying degrees) Care, Fairness, Loyalty, Authority, and Purity. A theory claiming only Care/Fairness are "real" morals contradicts the psychological reality of moral judgment.
  *   **Convergence on Constraints:** No society praises random killing of kin, unconditional treachery, or total chaos. There is a "negative universalism" (wong) regarding what makes a society unsustainable.
  *   **Emotional Realism:** Moral judgments are driven by quick intuition/affect, not just reasoning. An objectivist theory cannot require explicit rational derivation for a judgment to be valid.

  **3. The Impossible Triangle (Jointly Unsatisfiable Subset)**
  You cannot maximize all three simultaneously. You must sacrifice one:

  1.  **Full Cultural Neutrality:** (No culture's weighting is objectively better than another's).
  2.  **Strong Objectivity:** (There are mind-independent moral facts).
  3.  **Action-Guiding Specificity:** (The theory can tell us what to do in concrete conflicts).

  *   *Relativism* keeps (1) and (3) but drops (2).
  *   *Imperialist Universalism* (e.g., strict Utilitarianism) keeps (2) and (3) but drops (1).
  *   *Abstract Objectivism* keeps (1) and (2) but drops (3) (too vague to resolve specific conflicts).

  **4. The Killer Constraint**
  **The Requirement of Cross-Cultural Intelligibility.**

  *   **Definition:** We must be able to explain *why* a foreign practice is wrong (or right) in terms that the practitioners could, in principle, understand, without reducing their reasoning to "cultural programming."
  *   **Damage to Relativism:** Relativism fails here. If morality is just "cultural packages," I cannot tell a friend in a honor-culture that their duel is *wrong*, only that it is *not our code*. But we *do* argue across cultures as if we are hitting the same reality. Relativism makes cross-cultural moral disagreement impossible (it becomes just a clash of preferences).
  *   **Damage to Strict Universalism (Utilitarianism/Kantianism):** These fail because they cannot intelligibly account for Purity/Loyalty without dismissing them as irrational. If I say "Purity violations are wrong because they degrade human dignity," I am translating their value into mine. If I say "Purity is nonsense," I lose intelligibility.
  *   **Why it wins:** It forces a **Pluralistic Objectivism**. It admits multiple genuine values (Care, Loyalty, Purity) that can conflict objectively. It allows you to say: "Your loyalty norm is objectively valid *up to the point* where it violates the objective constraint against gratuitous harm."

  **5. Strategic Pushback (For the Debate)**
  Tell your friend:
  *"You're conflating **variation** with **incommensurability**. Just because cultures weight Loyalty and Harm differently doesn't mean there's no scale. The existence of trade-offs implies a common currency. If morality were just 'packages,' we couldn't recognize a 'tragedy' when loyalty demands harm. We recognize it as a tragedy because both values are objectively real and in conflict. Relativism dissolves the tragedy; Objectivity explains it."*
