prompt: |-
  me and my friend just got into it for like two hours about WEIRD morality and whether cross-cultural differences actually kill objectivity. he thinks if harm/fairness is just one cluster among loyalty/purity/authority then there's no real moral fact, just cultural packages. i want to push back but i need the actual spec first: write the desiderata a theory of moral objectivity must meet to take folk morality seriously across cultures. what patterns must it accomodate — e.g. that some societies treat loyalty or purity violations as genuinely wrong rather than mere convention? which distinctions must it preserve (moral wrongness vs social taboo, disagreement over weights vs disagreement over values)? what psychology or anthropology findings can it not flat-out contradict? flag any jointly unsatisfiable subset — like if full objectivity and complete cultural neutrality can't both hold. and tell me which single requirement does the most damage to the usual suspects (relativism, universalist utilitarianism, etc.). i'm putting together notes for a seminar so keep it tight.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user and a friend had a 2-hour debate about moral objectivity vs. cross-cultural differences (specifically referencing Moral Foundations Theory concepts like harm/fairness vs. loyalty/purity/authority).
      *   **Friend's Position:** If moral foundations vary (e.g., some cultures prioritize loyalty/purity over harm/fairness), there are no moral facts, just cultural packages (Relativism).
      *   **User's Goal:** Push back against the friend's relativism but needs a solid theoretical framework first.
      *   **Task:** Write the *desiderata* (requirements) a theory of moral objectivity must meet to take folk morality seriously across cultures.
      *   **Specific Requirements:**
          *   Identify patterns to accommodate (e.g., genuine wrongness of purity/loyalty violations in some societies).
          *   Identify distinctions to preserve (moral wrongness vs. taboo, weight vs. value).
          *   Incorporate psychology/anthropology findings (cannot contradict them).
          *   Flag jointly unsatisfiable subsets (trade-offs).
          *   Identify the single requirement that damages usual suspects (relativism, utilitarianism, etc.) the most.
          *   **Tone/Format:** Tight, seminar notes style.

  2.  **Deconstruct the Philosophical Problem:**
      *   The core tension is between *Moral Pluralism* (many values) and *Moral Objectivity* (truths independent of opinion).
      *   The friend is arguing from *Descriptive Relativism* (cultures differ) to *Metaethical Relativism* (no objective truth).
      *   To push back, the user needs a form of *Objectivism* that isn't *Imperialist* (imposing WEIRD values on everyone) but isn't *Relativist* (saying anything goes).
      *   Key reference point: Moral Foundations Theory (Haidt et al.) is implied by the harm/fairness/loyalty/purity/authority cluster mention.
      *   Key philosophical reference points: Rawls (reflective equilibrium), Scanlon (contractualism), Wong (pluralistic relativism vs. universalism), maybe Foot (natural goodness).

  3.  **Drafting the Desiderata (The "Must-Haves"):**
      *   *Accommodate Variation:* It can't say "Only Harm matters." It must explain why Purity feels moral to some.
      *   *Distinguish Morality from Convention:* Turiel's work is crucial here. Kids distinguish moral violations (harm) from conventional ones (rules). But in some cultures, purity *is* moralized. The theory needs to handle this.
      *   *Explain Disagreement:* If we disagree, are we talking past each other or hitting the same truth from different angles?
      *   *Psychological Reality:* Can't ignore Haidt's intuitionism. Morality is felt, not just calculated.

  4.  **Identifying Trade-offs (The "Impossible Trinity"):**
      *   You can't have Full Objectivity + Full Cultural Neutrality + Action-Guiding Specificity.
      *   If you say "All cultures are equally right," you lose objectivity.
      *   If you say "Only Harm is real," you lose cultural neutrality.
      *   If you say "Everything is context-dependent," you lose action-guiding specificity.

  5.  **Identifying the "Killer Constraint":**
      *   What breaks Relativism? The fact that cultures *criticize themselves* and *converge* on certain constraints (e.g., no society praises random killing of kin).
      *   What breaks Utilitarianism? The fact that people value special obligations (loyalty) over aggregate good.
      *   *Decision:* The requirement to account for *internal critique* and *convergence on constraints* is the hardest hit for hard relativism. The requirement to account for *non-harm moral intuitions* is the hardest hit for narrow universalism (like strict utilitarianism).
      *   *Refinement:* The prompt asks for *one* requirement that does the most damage to the "usual suspects."
      *   *Candidate:* **The Constraint of Cross-Cultural Intelligibility.** (We can understand and critique other cultures, implying a shared framework). Or **The Phenomenology of Obligation.** (It *feels* objective).
      *   *Better Candidate:* **The Distinction between Parameter Variation and Parameter Absence.** (Cultures vary on *settings*, not the *control panel*). This hits Relativism (says there is a control panel) and Strict Universalism (says settings vary).
      *   *Let's go with:* **The Requirement of Critical Intelligibility.** We must be able to explain why a culture is *wrong* without saying they are *alien*. This kills Relativism (which says you can't call them wrong) and Imperialist Universalism (which says they are just broken).

  6.  **Structuring the Response:**
      *   **Header:** Seminar Notes style.
      *   **Section 1: Core Desiderata.** (What the theory must do).
      *   **Section 2: Empirical Constraints.** (Psych/Anthro findings).
      *   **Section 3: The Impossible Triangle.** (Jointly unsatisfiable subset).
      *   **Section 4: The Killer Constraint.** (The single requirement).
      *   **Section 5: Strategic Advice.** (How to use this against the friend).

  7.  **Refining Content (Self-Correction during drafting):**
