      *   *Correction:* Ensure the distinction between "weight" and "value" is clear.
      *   *Correction:* Keep it tight. No fluff.
      *   *Philosophical Nuance:* Be careful not to endorse Moral Foundations Theory as *truth*, but as *data* the theory must explain.
      *   *Key Distinction:* Turiel's Moral/Convention distinction is WEIRD-biased. Need to acknowledge that. Shweder's work on ethics of autonomy/community/divinity is relevant.

  8.  **Final Polish:** Check against the prompt's specific questions.
      *   Patterns to accommodate? Yes (Purity as moral).
      *   Distinctions to preserve? Yes (Wrongness vs. Taboo).
      *   Psych/Anthro findings? Yes (Haidt, Turiel, Shweder).
      *   Jointly unsatisfiable subset? Yes (Neutrality/Objectivity/Specificity).
