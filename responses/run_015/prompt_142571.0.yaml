  2. The narrative arc ultimately validates the substitutability-friendly outlook by culminating in Billy's successful escape to London and a career that treats his birthplace as merely an origin story rather than a binding obligation. By framing his departure as a triumph rather than a loss, the film concedes that self-authorship trumps inherited obligation when the two conflict.
  3. However, the film resists a clean victory for mobility by showing that Billy's exit is purchased through the father's humiliating crossing of the picket line, acknowledging that individual ascent often requires breaking collective bonds. This suggests the substitutability-friendly outcome is not cost-free but relies on the very solidarity it ostensibly transcends.
  4. The film struggles to distinguish genuine loyalty from a valorized trap, ultimately relying on the historical inevitability of the mine closures to justify Billy's departure as pragmatic rather than purely moral. It settles the tension by borrowing the audience's sympathy for the talented individual against a dying industry, sidestepping the harder question of obligation in a viable community.
  5. What the film adds to the abstract argument is the visceral emotional cost of the substitutability-friendly transition, embodied in the father's grief rather than just the boy's gain. It demonstrates that material conditions do not merely shape moral vocabularies but actively break them, forcing a choice that concepts alone cannot reconcile.
