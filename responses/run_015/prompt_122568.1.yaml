  **DRAFT REPORT SECTION: SPECIES DELIMITATION AND CONSERVATION UNITS**

  **1. Agreed Premises**
  1.  **Biological Facts:** The panel accepts the empirical data regarding the ridge beetle populations (A–E): neighboring populations interbreed where contiguous; populations A and E are reproductively isolated at the ridge loop; mitochondrial DNA groups (A+B+C) separately from (D+E); and population C carries a unique chromosomal inversion despite gene flow with B.
  2.  **Legal Function:** The primary purpose of this definition is to identify discrete units eligible for protection under county conservation law, which requires actionable boundaries.
  3.  **Operational Utility:** All cited species concepts (Biological, Phylogenetic, Ecological) identify real biological patterns, even if those patterns do not coincide.
  4.  **Predictive Testing:** The "Swap Test" is accepted as a valid metric for utility: a delimitation method is scored by its ability to predict unmeasured traits (ecological, genetic, or morphological) across proposed units.
  5.  **Pre-registration:** Both parties agree to state predictions regarding the Swap Test outcomes prior to the analysis of unmeasured traits.

  **2. Statement of Disagreement**
  | Issue | Pluralist Position | Monist (General Lineage) Position |
  | :--- | :--- | :--- |
  | **Category Ontology** | Multiple species categories exist; each is legitimate depending on the investigative question. | One species category exists (segments of metapopulation lineages); other concepts are operational criteria that may mislead. |
  | **Boundary Authority** | Boundaries are set by the concept best suited to the specific conservation goal (e.g., viability vs. distinctness). | Boundaries are set by evidence of lineage separation; operational criteria are only valid insofar as they track this separation. |
  | **Conflict Resolution** | Conflicting concepts indicate genuine biological complexity requiring multiple designations or context-specific rulings. | Conflicting concepts indicate operational error; the true lineage boundary exists independently of the conflicting signals. |

  **3. Empirical Cruxes and Pre-registered Predictions**
  **Crux 1: Mind-Independence of Boundaries**
  *   **Question:** Are species boundaries fixed independent of human investigative interests?
  *   **Evidence:** The beetle ring-species pattern (A–E), where gene flow connects populations that are reproductively isolated at the terminus.
  *   **Pluralist Prediction:** The Swap Test will show that mtDNA grouping best predicts genetic history, while interbreeding grouping best predicts ecological stability; no single grouping will maximize predictive success across all trait categories.
  *   **Monist Prediction:** The Swap Test will show that the grouping which best approximates the independent lineage segment (even if imperfectly detected) will outperform operational groups in predicting *both* genetic and ecological traits.

  **Crux 2: Priority of Lineage Tracking**
  *   **Question:** Is a criterion that tracks lineage separation automatically superior for conservation law?
  *   **Evidence:** Population C, which is genetically swamped by B but maintains distinctness via chromosomal inversion.
  *   **Pluralist Prediction:** Protecting C as distinct preserves adaptive potential (the inversion) even if lineage data is ambiguous; lineage tracking is not automatically superior to preserving functional distinctness.
  *   **Monist Prediction:** Protecting C is only justified if the inversion signals an independent evolutionary trajectory; lineage tracking is the necessary condition for conservation priority.

  **4. Ontological and Semantic Clarifications**
  *   **Individuals vs. Classes:** The debate over whether species are historical individuals (spatiotemporally restricted entities) rather than natural kinds (classes) is orthogonal to the Monist/Pluralist dispute. Both parties acknowledge that species can be treated as individuals without resolving whether there is one or multiple species categories. This is not a barrier to agreement.
  *   **Verbal Dispute:** A portion of the conflict is verbal. Both parties agree on the biological facts (gene flow, coalescence, morphology). The disagreement lies in whether the legal label "Species" should apply to the operational unit identified by a specific concept (Pluralist) or strictly to the theoretical lineage segment (Monist).

