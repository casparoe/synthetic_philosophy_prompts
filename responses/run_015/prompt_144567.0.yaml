answer: |-
  ### Research Agenda: Universalizability and Institutional Roles

  Your project addresses a critical gap in Kantian ethics: the tension between the individualist ontology of the *Groundwork* and the structural reality of modern institutional agency. The ambiguity you identify—whether the contradiction in the will (CIW) is internal to the agent or emergent in the institution—is the pivot point. If the CIW is merely functional, the test loses moral force; if it is purely individual, the test ignores the structural conditions that make the maxim possible.

  Given your constraints (three years, moral philosophy background, conceptual focus), I recommend the following priority ordering:

  1.  **The Coherence of Extension (Line 1)**
  2.  **The Diagnosis of Contradiction (Line 2)**
  3.  **The Imputation of Responsibility (Line 3)**

  This ordering is governed by three criteria: **Logical Priority** (upstream dependencies), **Methodological Fit** (alignment with conceptual tools vs. empirical study), and **Risk of Category Error** (preventing the project from collapsing into a non-Kantian framework).

  ---

  ### 1. Priority One: The Coherence of Extension (Line 1)
  **Question:** Can the Formula of Universal Law (FUL) be coherently extended to maxims whose subject is an institutional role without collapsing into contractualism or rule-utilitarianism?

  **Rationale for Priority:**
  This is the absolute upstream precondition. If the FUL cannot grammatically or logically accommodate a "role" as the maxim-formulating subject without losing its distinctive Kantian character, the subsequent lines of inquiry are moot. Kant's moral law binds rational beings *qua* rational beings. Institutional roles are functional constructs, not ontological givens. You must establish that a "maxim of the judge" is a valid input for the FUL before you can interpret the output.

  **Upstream/Downstream Status:**
  Strictly upstream. Line 2 asks what a contradiction *means*; Line 3 asks who is *blamed*. Neither can proceed if Line 1 fails to demonstrate that the test is valid for this input type. If the extension fails, the project must pivot to a critique of institutional agency from the outside, rather than an application of Kantian tests from the inside.

  **Tractability and Methodological Fit:**
  *   **Tractability:** Low to Moderate. This is pure conceptual work, fitting your background. It requires analyzing the structure of a maxim (subject, end, action, circumstance) and determining if "role" can substitute for "agent" without invoking consequences (which would drift toward utilitarianism) or hypothetical consent (which would drift toward contractualism).
  *   **Risk:** High. The risk is that "universalizing a role" inevitably becomes "what would happen if everyone did this," which is the classic misreading of Kant as a rule-utilitarian. You must defend a reading where the contradiction arises from the *concept* of the role, not the *consequences* of its universal performance.

  **Key Conceptual Task:**
  Define the "Role-Maxim." Does the agent will the maxim *as* an individual occupying a role, or does the role itself will the maxim? The former preserves individual rationality; the latter risks reifying the institution. You must argue for the former while acknowledging that the content of the maxim is structurally dependent.

  ---

  ### 2. Priority Two: The Diagnosis of Contradiction (Line 2)
  **Question:** Does the "practical contradiction" indicate a moral failure of the agent, a functional impossibility of the institution, or a category error?

  **Rationale for Priority:**
  Once you establish that the test *can* run (Line 1), you must interpret the result. This is the core of your ambiguity problem. In standard Kantian ethics, a CIW indicates a perfect or imperfect duty violation by the agent. In institutional settings, a CIW might indicate that the institution is self-defeating (functional impossibility) rather than that the agent is immoral. Distinguishing these is necessary before assigning responsibility.

  **Upstream/Downstream Status:**
  Downstream from Line 1, upstream from Line 3. You cannot determine if an individual is responsible for a harmful act (Line 3) if you haven't determined whether the contradiction reveals a moral wrong or merely a systemic glitch. If the contradiction is purely functional, moral blame may be misplaced.

  **Tractability and Methodological Fit:**
  *   **Tractability:** Moderate. This requires conceptual distinction but risks bleeding into institutional theory. You must remain focused on the *logic* of the contradiction, not the sociology of the institution.
  *   **Risk:** Moderate. The risk here is "functionalism creep," where moral impermissibility is reduced to systemic inefficiency. You need to show how a functional contradiction in a role (e.g., a judge who takes bribes undermines the concept of judging) translates to a moral contradiction for the rational being occupying that role.

  **Key Conceptual Task:**
  Develop a taxonomy of contradictions. Distinguish between a *Contradiction in Conception* (the role becomes incoherent) and a *Contradiction in the Will* (the rational agent cannot consistently will the end). Map these onto the institutional context. If the institution collapses, does the agent's will collapse with it?

  ---

  ### 3. Priority Three: The Imputation of Responsibility (Line 3)
  **Question:** What are the implications for moral responsibility when the contradiction is visible only at the institutional level but the act is performed by an individual who claims her personal maxim is universalizable?

  **Rationale for Priority:**
  This is the payoff question, but it is downstream of the first two. It deals with the "Sincere Agent" problem: the bureaucrat who says, "I was just doing my job," where "the job" fails the universalizability test, but their personal maxim ("I will support my family") passes. Resolving this requires the definitions established in Lines 1 and 2.

  **Upstream/Downstream Status:**
  Strictly downstream. It relies on the validity of the test (Line 1) and the interpretation of the failure (Line 2). If Line 2 determines that the contradiction is purely functional, Line 3 might conclude that moral responsibility is attenuated. If Line 2 determines it is moral, Line 3 must explain how to impute systemic fault to individual will.

  **Tractability and Methodological Fit:**
  *   **Tractability:** Low (for your profile). This line risks becoming a study in legal theory or organizational sociology. To keep it philosophical, you must focus on the *conditions of imputation*, not the *distribution of blame* in specific cases.
  *   **Risk:** High risk of scope creep. It is tempting to move toward policy design (how should we punish?), which violates your constraint. You must stay on the metaphysics of agency.

  **Key Conceptual Task:**
  Analyze the relationship between the "personal maxim" and the "role maxim." Can they be severed? If the role maxim is non-universalizable, does participating in the role implicate the agent in that non-universalizability, regardless of their personal intent?

  ---

  ### Criteria Governing the Ranking

  1.  **Logical Dependency:** You cannot interpret a result (Line 2) from a test that hasn't been validated (Line 1). You cannot assign blame (Line 3) for a violation that hasn't been defined (Line 2).
  2.  **Methodological Safety:** Line 1 is the most purely philosophical. Line 3 is the most likely to drift into empirical sociology. By front-loading the conceptual work, you ensure the project remains within your expertise for the majority of the three-year window.
  3.  **Failure Mode Management:** If Line 1 fails, you know immediately. If you start with Line 3, you might spend two years building a theory of responsibility on a foundation that turns out to be non-Kantian.

  ---

  ### Evidence or Arguments That Would Change the Ordering

  The proposed agenda assumes that Kantian universalizability is *capable* of being extended to roles. Certain discoveries would force a re-ordering or abandonment of this plan.

  **1. The "Individualist Essence" Discovery (Threatens Line 1)**
  If rigorous textual analysis or logical reconstruction demonstrates that Kant's concept of "rational being" is inextricably tied to biological individuality or non-functional autonomy, Line 1 becomes impossible.
  *   *Consequence:* Abandon Line 1. Move Line 2 upstream. The project shifts from "Applying FUL to Roles" to "Using the Failure of FUL to Critique Institutional Agency." The priority becomes diagnosing *why* Kant fails here (Line 2), rather than trying to make it work (Line 1).

  **2. The "Individuation" Problem (Threatens Line 2)**
  If recent work in collective intentionality (e.g., Tuomela, Searle, or Gilbert) demonstrates that role-based maxims cannot be individuated sharply enough to enter the universalization procedure (i.e., you cannot isolate a "judge's maxim" from the "court's practice"), then Line 2 becomes incoherent.
  *   *Consequence:* Prioritize Line 3. If maxims cannot be individuated, the focus must shift immediately to how responsibility is distributed across the collective, bypassing the specific universalization of the role. This would require you to engage more deeply with collective agency literature than currently planned.

  **3. The "Functional Reduction" Proof (Threatens Line 2/3)**
  If it is proven that all institutional contradictions are reducible to functional inefficiencies (e.g., a corrupt judge is just a broken tool, not a moral agent), then Line 3 loses its moral stakes.
  *   *Consequence:* Collapse Line 3 into Line 2. The project becomes a study in the philosophy of social functions rather than moral responsibility.

  ### Summary of the Defense
  This agenda prioritizes **validity over application**. It recognizes that the greatest risk to your project is not that you will fail to solve the responsibility problem (Line 3), but that you will solve it using a distorted version of Kant (Line 1 failure). By securing the coherence of the role-maxim first, you ensure that any subsequent conclusions about responsibility are genuinely Kantian, even if they ultimately reveal limits to Kant's framework when faced with institutional reality. This maximizes conceptual clarity and minimizes the risk of the project dissolving into empirical institutional analysis.
