      *   *Check:* Did I address the specific premises? Yes, focus on (3).
      *   *Check:* Is the explanation of Braudel accurate? Yes, the consensus among historians is that Braudel allows for agency within structures. He doesn't say events *don't happen*, just that they don't reshape the *longue durée* quickly.
      *   *Check:* Is the "cost" clear? The cost is giving up the idea that history is a hard science like physics. It becomes more interpretive.

