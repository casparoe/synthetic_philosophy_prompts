      *   *Concern B: (4) vs. (5) (No Authority vs. Normativity).*
          *   (4) denies *epistemic* justification (I shouldn't believe X just because evolution made me).
          *   (5) affirms *semantic* normativity (Belief X is *true/false* based on evolutionary function).
          *   *Conflict:* Is this a category error? Teleosemantics grounds *truth conditions*, not *warrant*.
          *   *Severity:* Low/Apparent. This is a standard distinction in the literature (Normativity of Meaning vs. Normativity of Belief).
          *   *Resolution:* Clarify the type of normativity.

  5.  **Developing the Audit Structure:**

      *   **Introduction:** Acknowledge the sophistication of the package (it's a "Liberalized Teleosemantics").
      *   **Categorization:** Group tensions into "Genuine/Structural" and "Apparent/Clarificatory."
      *   **Detailed Analysis of Tensions:**
          *   Tension 1: The Etiological Anchor vs. Contextual Drift (1 & 3).
          *   Tension 2: Historical Proper Function vs. Novel Content (1 & 6).
          *   Tension 3: Semantic Normativity vs. Epistemic Authority (4 & 5).
      *   **Ranking:** Order by severity.
      *   **Revision Options:** For each genuine tension, offer the "least costly revision" and its trade-off.

  6.  **Drafting the Content (Iterative Refinement):**

      *   *Refining (1) vs (3):* This is the biggest problem. Standard Teleosemantics (Millikan) is rigid on history. (3) sounds like Externalism/Active Externalism or Inferentialism. If content *outstrips* ancestral assignment, history is no longer the *primary* fixer.
          *   *Revision:* Weaken (1) to say history fixes the *vehicle's capacity*, but context fixes the *value*. Cost: Moves away from pure teleosemantics toward hybrid views (e.g., Teleo-functionalism).
          *   *Revision:* Constrain (3). Say context triggers specific contents *within* the ancestral range. Cost: Loses the ability to explain radical novelty (undermines 6).

      *   *Refining (1) vs (6):* How do we get "quark" or "justice" from evolution?
          *   *Standard Move:* General learning mechanisms were selected.
          *   *Problem:* If the mechanism is a general learner, what is the specific content?
          *   *Revision:* Allow exaptation to create *new* proper functions via cultural selection (Dual-Inheritance). Cost: Expands "selection history" beyond biological evolution, potentially diluting the naturalism in (5).

      *   *Refining (4) vs (5):*
          *   *Analysis:* (5) is about *conditions of satisfaction* (truth). (4) is about *warrant* (justification). A thermometer has correctness conditions (5) but believing the thermometer gives me no reason to think it's hot if I know it's broken (4).
          *   *Verdict:* Apparent tension. Needs clarification, not revision.

      *   *Refining (2) vs (3):* If content changes via context, what is the "proper function" for misrepresentation?
          *   *Analysis:* If the function changes, the error conditions change. If (3) holds, the "historical" function in (2) might be obsolete.
          *   *Verdict:* Derivative of the (1) vs (3) tension.

  7.  **Finalizing the Recommendations:**

      *   *Severity 1:* (1) vs (3). The core definition vs. the flexibility claim.
      *   *Severity 2:* (1) vs (6). The novelty problem.
      *   *Severity 3:* (4) vs (5). The normativity distinction (likely resolvable).

      *   *Revisions:*
