          *   For (4)/(5): Distinguish Semantic vs. Epistemic Normativity. Cost: None, just clarification.

  8.  **Review against Constraints:**
      *   Did I answer the specific questions? Yes (tensions, severity, revisions, costs).
      *   Is it even-handed? Yes, not defending teleosemantics but analyzing the internal coherence.
      *   Did I address the user's specific worries? Yes (History vs. Context, Authority vs. Normativity).

  9.  **Final Polish:** Ensure philosophical terminology is precise (e.g., distinguishing "proper function" from "system function," "semantic normativity" from "epistemic justification"). Make sure the distinction between Millikan-style consumer semantics and other variants is clear where relevant. (Self-Correction: Ensure I don't just say "Millikan says X." Focus on the user's stated commitments.)

      *   *Wait, one nuance on (4) & (5):* The user says evolutionary success confers no *present normative authority*. Teleosemantics says it confers *correctness conditions*. Is correctness a form of normative authority? Yes, in the semantic sense. But (4) seems to refer to *doxastic* authority (reason to believe). I need to make sure this distinction is sharp. If (4) means "I have no reason to trust my faculties," that's skepticism. If it means "Evolution doesn't make P true," that's compatible with (5). I will assume the latter but warn about the former.

      *   *Nuance on (3):* "Outstrip any fixed ancestral assignment." This is the killer phrase. If content *outstrips* history, history isn't fixing it. This is the strongest tension.

      *   *Nuance on (6):* "Exapted for new representational roles." If the role is *new*, what is the *old* function? If the old function determines content (per 1), how does the new role get content? This requires a theory of derived proper functions (e.g., language games selected culturally).

      *   *Ordering:*
