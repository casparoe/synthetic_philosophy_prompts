      *   *Minute 5-15: The Engine (SDT).* Explain the three variables (People, Elites, State). Use the US example here.
      *   *Minute 15-25: The US Case Study.* Walk through the 19th/20th century cycle. Gilded Age -> Progressive Era -> Mid-century stability -> Late-century fragmentation.
      *   *Minute 25-35: Misconceptions & Limits.* Address agency, correlation, and prediction limits.
      *   *Minute 35-40: Wrap & Check.* The final question.

  4.  **Addressing Specific Misconceptions (The "Kill Points"):**
