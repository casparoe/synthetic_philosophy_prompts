          1.  Population dynamics (supply of labor).
          2.  Elite dynamics (supply of elites vs. demand).
          3.  State capacity (fiscal health).
      *   *Mechanism:* Population grows -> Labor supply up -> Wages down -> Immiseration. Elites multiply -> Competition for positions up -> Intra-elite conflict. State spends more/collects less -> Fiscal crisis. Result: Instability/Revolution.
      *   *Ontology:* Measuring structural pressure, not individual intent.

  3.  **Drafting the Teaching Arc (40 Minutes):**
