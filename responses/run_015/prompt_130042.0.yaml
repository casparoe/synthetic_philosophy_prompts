      *   *What to include:* Real wage stagnation, number of lawyers/lobbyists (elite proxy), debt/deficit.
      *   *What to avoid:* Partisan blame (Democrats vs. Republicans). Keep it structural.

  6.  **Refining the Ontology Check:**
      *   Need a question that forces him to distinguish between "why did this person rebel?" (agency) and "why was rebellion likely?" (structure).
