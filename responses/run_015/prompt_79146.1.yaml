answer: |-
  This is a sharp application of the theory. You have identified a stress point where semantic externalism meets human stipulation. Here is the analysis broken down by your four questions.

  ### 1. Truth Values, Experts, and Nature vs. Vote

  If we apply strict Putnamian externalism to Pluto, we run into an immediate category error. Putnam's theory works best on **natural kind terms** (like *water*, *gold*, *tiger*). These terms refer to things with a hidden microstructure or essence that exists independently of human classification.

  *   **Was it true in 1990?**
      If *planet* were a natural kind term like *water*, externalism would force you to say: "If Pluto didn't meet the essential criteria in 1990, it was always false, we just didn't know it." This is the "whales are fish" model. Whales were never fish; we were just ignorant.
      However, the Pluto case is not ignorance; it is **legislation**. In 1990, the extension of *planet* was fixed by a loose cluster of properties (orbits sun, round, big). Pluto fit that cluster. In 2006, the IAU added a new necessary condition (clearing the neighborhood).
      Therefore, externalism committed to the "Division of Linguistic Labor" implies that the **experts fix the extension**. In 1990, the relevant experts (astronomers) used the term to include Pluto. So, "Pluto is a planet" was **true in 1990**. It is **false now**.
      Unlike "whales are fish," which was always false because biology is mind-independent, "Pluto is a planet" changed truth value because the linguistic rule changed.

  *   **Nature vs. Us:**
      This is where the theory strains. In Twin Earth, the environment fixes the reference (H2O vs. XYZ). In the Pluto case, **we fixed the reference**. The "clearing the neighborhood" criterion isn't a hidden essence of Pluto; it is a boundary we drew because, as you noted, we didn't want 40 planets in textbooks.
      Externalism says meaning isn't in the head, but in this case, meaning isn't fully "out there" either. It's in the **agreement**. If the reference is fixed by a vote, then the "environment" that fixes meaning is the **social environment**, not the physical one.

  ### 2. The Counterfactual IAU: Environmental vs. Social Externalism

  This is where you drive the wedge. Let's look at the predictions for the world where the IAU votes the other way (Pluto stays a planet), while the physical universe remains identical.

  *   **Environmental Externalism (Putnam):**
      This theory posits that the physical world determines extension. In both the actual world and the counterfactual world, Pluto is physically identical. It has the same mass, orbit, and composition.
      *Prediction:* If meaning is fixed by the physical environment, the term *planet* should have the **same extension** in both worlds. The vote shouldn't matter, because the "stuff" hasn't changed.
      *Result:* This prediction fails our intuition. We intuitively understand that if they had voted differently, Pluto would *be* a planet. The physical facts alone didn't settle the meaning.

  *   **Social Externalism (Burge):**
      Tyler Burge argued that meaning depends on the normative practices of your linguistic community. What you mean by your words depends on how the experts in your community use them.
      *Prediction:* In World A (actual), the community norm excludes Pluto. In World B (counterfactual), the community norm includes Pluto. Therefore, the concept *planet* has a **different extension** in the two worlds, even though the physical world is identical.
      *Result:* This matches our intuition. The meaning shifted because the social practice shifted.

  *   **The Wedge:**
      The Pluto case supports **Social Externalism** over strict Environmental Externalism. It shows that for certain terms, the "environment" that fixes reference is the landscape of human agreement, not the landscape of atoms. If you hold to strict Environmental Externalism, you have to say the IAU vote was irrelevant to meaning, which is absurd. If you hold to Social Externalism, the vote is constitutive of the meaning.

  ### 3. Discovery (Jade/Whales) vs. Stipulation (Pluto)

  You asked if this is like Jade (two minerals: jadeite/nephrite) or Whales (mammals not fish).

  *   **Jade/Whales (Discovery):**
      In these cases, we thought there was one kind, but the world revealed there were two (Jade) or we thought it was one kind but the world revealed it was another (Whales). The **world corrected us**. The extension changed because our knowledge of the *independent reality* changed.
  *   **Pluto (Stipulation):**
      Here, the world did not correct us. We knew Pluto's orbit and neighbors before 2006. The **we corrected the definition**. We decided that "clearing the neighborhood" matters.
  *   **Natural Kind vs. Functional Kind:**
      This tells us that *planet* is **not a natural kind term**. It is a **functional or historical kind term**, more like *continent* or *chair*. There is no "microstructure" of planet-hood.
      *Implication for Externalism:* Externalism derives its power from the idea that nature carves the joints. If *planet* is a category we invented for convenience (to keep textbooks manageable), then externalism loses its grip. The reference isn't fixed by a causal link to a natural essence; it's fixed by a **stipulative definition**.
      If *planet* is not a natural kind, the Twin Earth machinery doesn't fully apply. Twin Earth relies on there being a "real" water (H2O) to which we are causally connected. There is no "real" planet to which Pluto is connected, only a definition we agreed upon.

  ### 4. The Verdict: Confirm, Embarrass, or Silence?

  It does not confirm externalism, and it doesn't exactly embarrass it, but it exposes a **silence** in the theory regarding **stipulative kinds**.

  *   **Where it goes silent:**
      Externalism explains how we latch onto pre-existing categories in the world (causal theory of reference). It assumes the kind exists prior to the label.
      In the Pluto case, the kind *planet* (as defined by the IAU) **did not exist prior to the vote**. The physical objects existed, but the category boundary was created by the vote.
      Externalism has no mechanism to explain reference fixing when the "kind" is brought into existence by the linguistic community itself. It can explain how we refer to Pluto (the object), but it cannot explain how we refer to *Planet* (the category) when the category is a human artifact.

  *   **The Honest Answer:**
      The Pluto case shows that Externalism is not a monolith.
      1.  It confirms **Social Externalism**: Meaning depends on the community's norms (the IAU vote).
      2.  It embarrasses **Strict Environmental Externalism**: The physical environment was identical, yet the meaning changed (or could have).
      3.  It reveals a **limit**: Externalism works for discovery (Whales), but it goes silent on **creation** (Pluto). When we vote on what counts as a planet, we aren't discovering a natural joint; we are drawing a map. Externalism explains how the map hooks to the territory, but it doesn't explain why we drew the border *there* instead of *here*. That part is pragmatic, not semantic.

  **Summary:** The Pluto case proves that for non-natural kind terms, the "environment" that fixes meaning is social, not physical. It forces you to choose Burge over Putnam. If you refuse to choose, the theory goes silent on how a vote changes truth conditions without changing physical facts.
