prompt: |-
  Ok so my philosophy club just did the Twin Earth thing where Putnam asks you to imagine a planet that looks exactly like ours, and the people there call the stuff in their lakes water, except it turns out their stuff isnt H2O, its some other chemical, and the question is whether their word means the same as ours. I get that the answer is supposed to be no, because what a word refers to gets fixed by the environment and not by whats inside your head. Fine, I buy it.

  What I want is to run that machinery on something that actually happened: the 2006 IAU vote where Pluto got demoted. Heres the facts as I understand them, and if I've got them wrong just say so and keep going: to be a planet now you have to orbit the sun, be massive enough that gravity has rounded you out, and have cleared the neighborhood around your orbit of other junk. Pluto fails the third one because it shares its zone with a bunch of other icy bodies, so it got moved into a new box called dwarf planet, along with Ceres and Eris. Only a small fraction of the IAU's members actually voted, and plenty of planetary scientists, including people who study Pluto for a living, still call it a planet. So nothing out in space changed at all, Pluto is the same ball of ice it always was, but the word changed.

  Analyze this both ways, the theory on the case and the case on the theory:

  1. If externalism is right, was it true in 1990 that Pluto is a planet, and false now? Or was it always false, the way that whales are fish was always false? Which of those does the theory actually commit you to, and does it matter who's doing the talking, the experts or the rest of us who just go along with whatever the experts say (the division of linguistic labor thing)? And does it matter that the change came out of a vote, where a big part of the motivation was that we dont want forty planets in the textbooks? Is the reference getting fixed by nature here, or by us?

  2. Heres the bit I actually care about. Suppose the IAU had voted the other way and Pluto stayed a planet. Same world, same objects, same orbits, only the committee vote differs. Does planet mean the same thing in that world? Environmental externalism seems to say yes, because the stuff out there is identical, so the extension is identical. But the Burge arthritis case seems to say no, because what your word means depends on the norms of your community, and communities can differ. So does this case support environmental externalism, support social externalism, or drive a wedge between them? Be specific about what each one predicts about the counterfactual IAU, dont just tell me both of them are externalist.

  3. Compare it to cases where we revised a terms extension because we found out the world wasnt what we thought, like jade turning out to be two different minerals, or whales turning out not to be fish. Is the Pluto case that kind of case or a different kind? And if its a different kind, what does that tell us about whether planet is a natural kind term at all, or whether its a category we invented for convenience, and if its the latter then what was the externalist argument even about?

  4. Then be honest with me: does this case definately confirm externalism, embarrass it, or is it something the theory never thought about and just goes silent on? If it goes silent, point at exactly which step has nothing to say here.

  Dont give me a reading list or names of papers, I only want the argument, and dont just tell me its controversial which definition of planet is right. I know that. I want to know what the theory of meaning says about the controversy, and what the controversy shows about the theory.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user understands Putnam's Twin Earth argument (semantic externalism: meaning ain't in the head, reference fixed by environment).
      *   **Task:** Apply this externalist framework to the 2006 IAU Pluto demotion.
      *   **Specific Questions:**
          1.  Truth value over time (1990 vs. now)? Always false (like whales/fish)? Role of experts (division of linguistic labor)? Role of the vote/pragmatics (nature vs. us)?
          2.  Counterfactual IAU vote (Pluto stays a planet). Does *planet* mean the same thing? Compare Environmental Externalism (Putnam) vs. Social Externalism (Burge).
          3.  Comparison to discovery cases (Jade, Whales). Is *planet* a natural kind term or a functional/conventional category? What does this imply for externalism?
          4.  Verdict: Does this confirm, embarrass, or silence externalism? Where does the theory go silent?
      *   **Constraints:** No reading lists, no paper names. Focus on the argument. Don't just say "it's controversial." Be specific about predictions.

  2.  **Deconstruct Question 1: Truth Values, Experts, and Nature vs. Vote.**
      *   *Externalism's core:* Reference is fixed by the world (causal theory) or social usage (division of labor).
      *   *1990 vs. Now:* If *planet* is a natural kind term (like *water*), then the truth depends on the underlying nature. If it's a functional/classificatory term, it depends on the criteria.
      *   *Whales/Fish analogy:* "Whales are fish" was always false because biological essence trumps appearance. If *planet* works like *water*, then if Pluto didn't meet the criteria (even unknown ones), it was always false. But unlike water, the criteria were *stipulated* in 2006.
      *   *Division of Linguistic Labor:* Putnam says experts fix the extension. The IAU are the experts. So when they voted, they shifted the extension.
      *   *Nature vs. Us:* In Twin Earth, nature fixes reference (H2O vs. XYZ). In Pluto, *humans* fixed the reference (the definition). This is a crucial tension. Externalism usually relies on mind-independent structures. Here, the structure is mind-dependent (orbital clearance is a physical fact, but the *requirement* for clearance is a human rule).
      *   *Prediction:* Strict Putnamian externalism struggles here because there is no hidden "essence" of planet-hood independent of human classification. However, if we treat the IAU as the "experts" fixing the stereotype/extension, then the truth value changes *when the linguistic practice changes*. So, "Pluto is a planet" was true in 1990 (by the standards of the time) and false now. This looks more like conceptual change than discovery.

  3.  **Deconstruct Question 2: Counterfactual IAU & Environmental vs. Social Externalism.**
      *   *Scenario:* IAU votes differently. Physical world is identical.
      *   *Environmental Externalism (Putnam):* Meaning depends on the physical environment. Since the physical environment (Pluto's orbit, mass, etc.) is identical in both worlds, a strict environmental reading might suggest the extension *should* be the same. But wait, Putnam allows for social context in fixing reference.
      *   *Social Externalism (Burge):* Meaning depends on communal norms/concepts. In World A (actual), the community norm (via IAU) says "No Pluto." In World B (counterfactual), the norm says "Yes Pluto." Therefore, the concept *planet* differs in extension between World A and World B.
      *   *The Wedge:* This case drives a wedge. Environmental externalism (focused on physical stuff) has trouble explaining why the meaning changes when the physical stuff doesn't. Social externalism handles it easily: the social practice changed.
      *   *Prediction:*
          *   Environmental: Predicts stability of meaning (same physical facts).
          *   Social: Predicts shift in meaning (different social stipulation).
          *   Reality: We intuitively feel the *definition* changed, not the object. This supports Social Externalism over strict Environmental Externalism for this specific term.

  4.  **Deconstruct Question 3: Discovery (Jade/Whales) vs. Stipulation (Pluto).**
      *   *Jade/Whales:* We found out the world wasn't what we thought. Essence discovered.
      *   *Pluto:* We found out the Kuiper Belt was crowded. We *chose* to make "clearing the neighborhood" a necessary condition.
      *   *Natural Kind vs. Functional:* *Water* is a natural kind. *Planet* is likely a functional or historical kind, not a natural kind in the chemical sense. It's more like *continent* or *chair*.
      *   *Implication for Externalism:* Externalism works best for natural kinds (H2O). If *planet* isn't a natural kind, externalism loses its grip. The reference isn't fixed by microstructure but by human interest/pragmatics ("we don't want 40 planets").
      *   *Conclusion:* This suggests *planet* is not a natural kind term. It's a classificatory term. Externalism about natural kinds doesn't fully apply.

  5.  **Deconstruct Question 4: The Verdict (Confirm, Embarrass, Silence).**
      *   *Confirm?* No, because the reference fixing wasn't causal/physical in the Twin Earth sense.
      *   *Embarrass?* It highlights a limitation. Externalism assumes the world dictates terms. Here, we dictated terms to the world.
      *   *Silence?* It goes silent on *stipulative* definitions. Externalism explains how we latch onto pre-existing kinds. It doesn't explain how we *create* kinds by vote.
      *   *Specific Step:* The step where "reference is fixed by ostension or causal contact with a natural kind." There is no natural kind "planet" to latch onto. The theory assumes the kind exists prior to the label. Here, the label created the boundary.

  6.  **Synthesize and Refine:**
      *   *Tone:* Direct, philosophical, engaging with the user's specific constraints.
      *   *Structure:* Follow the four numbered points.
      *   *Key Distinction:* Natural Kind (Water) vs. Functional/Conventional Kind (Planet).
      *   *Key Distinction:* Environmental (Putnam) vs. Social (Burge).
      *   *Drafting the response:*
          *   *Intro:* Acknowledge the sharpness of the analogy.
          *   *Section 1:* Address truth values. It's not like whales/fish (always false). It's a change in linguistic practice. Experts (IAU) matter, but they changed the rules, not discovered a fact.
          *   *Section 2:* Counterfactual. Environmental externalism fails here (same physics, different meaning). Social externalism wins (different norms, different meaning). This drives a wedge.
          *   *Section 3:* Jade/Whales vs. Pluto. Jade/Whales = Discovery of essence. Pluto = Decision on boundary. *Planet* is not a natural kind. Externalism applies weakly or not at all.
          *   *Section 4:* Verdict. It embarrasses strict environmental externalism and shows the necessity of social externalism or a hybrid. It reveals externalism is silent on *stipulative* kind-creation.

  7.  **Self-Correction/Refinement during drafting:**
      *   *Check:* Did I answer "Was it true in 1990?"
      *   *Correction:* Be careful. If *planet* is defined by usage, it was true then. If defined by hidden essence, maybe false. But since there is no hidden essence, it was true then. The change is semantic, not ontological.
      *   *Check:* Did I distinguish Putnam and Burge clearly?
      *   *Correction:* Putnam = Physical environment fixes reference. Burge = Social environment fixes reference. Pluto case favors Burge.
      *   *Check:* Did I avoid reading lists?
      *   *Correction:* Yes.
      *   *Check:* Did I address the "40 planets in textbooks" pragmatic motivation?
      *   *Correction:* Yes, this proves it's interest-relative, not nature-relative.

  8.  **Final Polish:** Ensure the distinction between "changing the world" and "changing the map" is clear. Ensure the distinction between "discovery" and "decision" is clear. (Proceed to generate output).

  *(Self-Correction Note on Q1)*: I need to be precise about the Division of Linguistic Labor. Putnam says experts fix the extension. If the experts changed their minds, did the extension change? Yes. So "Pluto is a planet" was true *relative to the extension fixed in 1990*. But is it *timelessly* false? No, because there's no timeless essence. This contrasts with "Whales are mammals," which is timelessly true because biology doesn't vote.

  *(Self-Correction Note on Q2)*: Make sure to explicitly state what Environmental Externalism predicts. It predicts meaning *shouldn't* change if the physical stuff is the same. But it *did* change (or could have). This is the wedge.

  *(Self-Correction Note on Q4)*: "Silence" is the strongest critique. Externalism assumes kinds are there to be found. If we *make* the kind, the theory has no mechanism to explain the reference fixing other than "we decided."

  9.  **Final Review against constraints:** No paper names. No reading list. Direct argument. Address all 4 points.

