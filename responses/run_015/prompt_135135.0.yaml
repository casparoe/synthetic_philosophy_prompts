answer: |-
  ### Ratings

  1.  **The sulfate veil:** Traction **10** | Legibility **1**
  2.  **Demobilization of armies:** Traction **7** | Legibility **8**
  3.  **Redrawing of borders:** Traction **6** | Legibility **7**
  4.  **Typhus:** Traction **5** | Legibility **3**
  5.  **Secretary's suppression:** Traction **2** | Legibility **9**

  ### Tiers

  **Tier I: Cause**
  *   **The sulfate veil:** This belongs here because it possesses maximum counterfactual power yet remains epistemically closed to the characters, acting as the invisible engine of the plot.

  **Tier II: Condition**
  *   **Demobilization of armies:** This is a condition because it created the structural vulnerability of the labor and food markets that made the climate shock catastrophic rather than merely inconvenient.
  *   **Redrawing of borders:** This is a condition because it established the logistical friction that turned a regional shortage into a localized starvation event, visible to elites but opaque to peasants.

  **Tier III: Occasion**
  *   **Typhus:** This is an occasion because it is the specific biological spark that ignites the tinder of malnutrition, accelerating the crisis without being its root origin.
  *   **Secretary's suppression:** This is an occasion because it is a discrete human choice that seals the fate of specific characters, offering high narrative clarity despite low historical impact.

  ### On Divergence and Structure

  **When the scales pull apart, which should the novel follow?**
  For the **plot**, you must follow *Legibility*, because characters cannot act upon what they cannot perceive; for the **theme**, you must follow *Traction*, allowing the invisible weight of the non-human to press down on the visible struggles of the human. The tension of your novel lies precisely in the gap between what your characters *think* is destroying them (politics, greed, disease) and what is *actually* destroying them (stratospheric chemistry).

  **Should the eruption deserve a prologue?**
  Yes, grant the eruption a prologue. To give genuine agency to a non-human cause, you must ontologically elevate it from a background "setting" to a foreground "actor"; by witnessing the violence of Tambora directly, the reader understands the indifference of the physical world before the humans even begin their petty scheming in Vienna or Styria.
