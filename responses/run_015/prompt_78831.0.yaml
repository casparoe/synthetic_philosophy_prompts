answer: |-
  You have correctly identified a gap in the standard vocabulary. You are describing a stratification of **pragmatic context**, not just semiotic signs. Most frameworks (like Peirce or Grice) focus on the relationship between the sign and the object, or the speaker and the listener. You are focused on the **infrastructure of agreement** required before the sign can even function.

  There is no single settled term in escape room design (the field is too young), but your intuition aligns perfectly with three distinct theoretical frameworks: **Human-Computer Interaction (HCI)**, **Linguistic Pragmatics**, and **Game Studies**.

  Here is the vocabulary you are looking for, followed by an analysis of the "seams" you asked about.

  ### 1. The Vocabulary: Signal, Protocol, Payload

  To separate these layers in your design documents and post-mortems, I recommend adopting this triad. It borrows from cryptography and communications theory but fits physical puzzle design better than "clue/hint/answer."

  *   **Layer 1: The Signal (or Signifier)**
      *   *Definition:* The physical indication that **intent exists**. It distinguishes "noise" (random clutter) from "signal" (placed on purpose).
      *   *Your example:* The padlock on the drawer; the book face-down.
      *   *HCI Term:* **Signifier** (Don Norman). A signifier indicates where an interaction can take place. It says, "Attend to me; I am not background."
      *   *Failure Mode:* **Camouflage.** The player treats the signal as noise. (e.g., They think the book fell there accidentally).

  *   **Layer 2: The Protocol (or Grammar)**
      *   *Definition:* The shared convention required to **decode** the signal. This is the "how." It relies on cultural literacy, prior game experience, or established room rules.
      *   *Your example:* Dials run 0–9; red means stop; three digits implies a 3-digit index.
      *   *Linguistic Term:* **Code** or **Competence**. In game design, this is often called **Literacy**.
      *   *Failure Mode:* **Mismatch.** The player sees the signal but applies the wrong protocol. (e.g., They try to pick the lock instead of finding the key; they assume the dial is 0–39 like a gym lock).

  *   **Layer 3: The Payload (or Referent)**
      *   *Definition:* The specific data contained within the signal once decoded. The "what."
      *   *Your example:* The combination 4-2-9; the word "OPEN."
      *   *Information Theory Term:* **Message**.
      *   *Failure Mode:* **Obfuscation.** The protocol is understood, but the payload is too hard to retrieve (e.g., the handwriting is illegible).

  ### 2. Analyzing the Seams

  You asked where the boundaries lie and whether they shift. This is where the framework becomes useful for debugging.

  #### Seam A: Does universal convention become Layer 1? (Naturalization)
  **Yes.** This process is called **Naturalization** (Roland Barthes) or **Reification**.

  When a protocol becomes so universal that it feels physical rather than cultural, it migrates from Layer 2 to Layer 1.
  *   *Example:* A door handle. Thirty years ago, you might have needed to teach a player "pulling this metal loop opens the latch" (Layer 2). Today, the handle *affords* pulling (Layer 1). The convention has hardened into an affordance.
  *   *Design Implication:* You can save "brain cycles" by using naturalized protocols. However, be careful of **False Affordances**. If a object *looks* like it belongs to Layer 1 (a naturalized object, like a light switch) but actually requires a specific Layer 2 protocol (flip it three times quickly), you will cause rage. Players treat Layer 1 as physics; they treat Layer 2 as logic.

  #### Seam B: Is Layer 1 secretly a stack? (Signal Detection)
  **Yes.** Layer 1 relies on **Signal Detection Theory**.

  For a player to recognize "this was placed on purpose," they must have a mental model of "what looks random."
  *   *The Sub-layer:* **Salience Threshold.** In a messy room (high noise), a clue needs a stronger signal (bright color, isolation) to cross the threshold. In a sterile room (low noise), a subtle signal works.
  *   *Design Implication:* If players miss Layer 1, do not make the clue bigger; make the background quieter. You are adjusting the signal-to-noise ratio, not the clue itself.

  #### Seam C: When the Protocol *is* the Payload (Recursion)
  **This is a Layer Collapse.**

  When the fact that you chose French, or the fact that it is a red herring, becomes the solution, Layer 2 and Layer 3 have merged. In game studies, this is often called **Procedural Rhetoric** or **Meta-Puzzling**.
  *   *The Phenomenon:* The medium is the message. The "how" *is* the "what."
  *   *Example:* A puzzle where the solution is to realize the clues are arranged in the shape of a key. The protocol (spatial arrangement) *is* the payload (the key shape).
  *   *Risk:* This is high-difficulty design. It requires the player to have "Layer 2 awareness"—they must be thinking about *why* you designed the puzzle this way, not just solving the puzzle. This breaks the "Magic Circle" slightly, asking them to think like a designer. Use this sparingly, usually as a climax.

  ### 3. The Theoretical Home: Common Ground

  Since you have a linguistics background, the most accurate theoretical home for this is **Stalnaker's Common Ground**.

  In pragmatics, communication only works if there is shared knowledge (Common Ground). Your three layers are actually three tiers of Common Ground that must be established sequentially:

  1.  **Perceptual Common Ground (Layer 1):** "We are both looking at the same object, and we both agree it is distinct from the background."
  2.  **Cultural Common Ground (Layer 2):** "We share the same encyclopedia of how symbols, locks, and numbers work."
  3.  **Situational Common Ground (Layer 3):** "We agree that *this* specific number opens *this* specific lock right now."

  **Why your Layer 2 failures happen:**
  You are assuming **Cultural Common Ground** that the players do not possess. This is the **Curse of Knowledge**. You know the convention because you built the room; they do not.
  *   *Fix:* You must **bootstrap** the protocol. Early puzzles in the room should explicitly teach the Layer 2 conventions (e.g., a note that says "Use the color code") so that later puzzles can rely on them without explanation. This is called **Scaffolding**.

  ### 4. Proposed Terminology for Your Team

  If you want to implement this tomorrow, I suggest using these terms in your design docs:

  1.  **Salience** (Layer 1): Is the object noticeable as intentional?
  2.  **Literacy** (Layer 2): Does the player know the rules to read this object?
  3.  **Resolution** (Layer 3): Can the player extract the specific data?

  **The "Seam Check" Question:**
  When a puzzle fails, ask:
  *   *Did they see it?* (Salience failure)
  *   *Did they know how to read it?* (Literacy failure)
  *   *Did they get the wrong answer?* (Resolution failure)

  You are almost certainly finding that your "Literacy Failures" are being misdiagnosed as "Resolution Failures." You think the math was too hard, but actually, they didn't know they were supposed to do math.

  ### Summary
  There is no single word because you are describing the **infrastructure of interpretation**.
  *   Use **Signal/Protocol/Payload** for engineering the puzzle.
  *   Use **Naturalization** to understand when conventions become invisible.
  *   Use **Common Ground** to understand why players get stuck.

  You are effectively designing a temporary language for the duration of the hour. Layer 2 is the grammar. If the grammar isn't taught or inferred, the sentence cannot be parsed, regardless of how obvious the words are.
