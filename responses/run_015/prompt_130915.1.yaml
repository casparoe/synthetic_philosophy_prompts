answer: |-
  This room still smells like wet wool and guano, and I hope it always does. It smells like work. It smells like the forty-one seasons Rafe Halloran spent standing on these rocks, weighing chicks in the rain, arguing with the wind, and writing numbers in notebooks that never got wet. We are naming this lab after him because he built the truth we stand on, one gram at a time.

  I worked with Rafe for all forty-one of those years. We were friends, though we argued like brothers about puffins. He was a biologist who loved the order of things; I'm a retired biologist who has gotten into philosophy, which means I spend too much time worrying about what the numbers actually mean. But today, I want to talk about what Rafe's numbers told us, even when they told us something he didn't expect.

  For decades, we tracked two colonies. The Nubble, out in the cold water with plenty of herring, where chicks fledged at about 340 grams. And Outer Double Head, sitting in the warmer, poorer water, where chicks fledged at about 260 grams. That eighty-gram gap was the puzzle.

  Rafe measured the heritability of fledging mass within each colony. For those of you who don't speak statistics, heritability is just a measure of how much of the difference between individuals is due to their parents rather than their luck. Rafe's number was 0.6. That is high. It means that within a colony, big parents reliably made big chicks. Rafe looked at that number, looked at the gap between the islands, and he concluded the difference was in the blood. He thought the Outer Double Head birds were genetically smaller, locally adapted to save energy. He wanted to translocate chicks from the Nubble to Outer Double Head to "improve the stock."

  I thought it was the breakfast, not the breeding. I thought the gap was the food.

  We disagreed until the season he died. Finally, we did the cross-fostering. We swapped the eggs. We took Outer Double Head eggs and put them in Nubble nests, and vice versa. We let the foster parents do the work.

  The result was clean. The Outer Double Head eggs raised at the Nubble fledged at 335 grams. The Nubble eggs raised at Outer Double Head fledged at 265 grams. The gap followed the water, not the genes.

  Now, I know there is a story going around town that Rafe has been vindicated, that "heritable" means the difference is fixed in the blood. I need to speak to that, gently, because Rafe would want the data to stand clear. That 0.6 heritability Rafe measured is real. It is his number. It means genetics matter deeply within a population. If you are a puffin at the Nubble, your weight is largely down to your parents. But heritability is not a property of the trait itself; it is a property of the population in its environment.

  Here is how I know. Over the last decade, the water at Outer Double Head warmed. The forage fish vanished. The chicks became wildly variable in what they were fed because some parents could find food and others couldn't. In that chaos, the heritability estimate slid from 0.6 down to about 0.1.

  Why? Because the environment got so noisy it drowned out the genetic signal. When food is scarce and unpredictable, it doesn't matter who your parents were; it matters whether your foster parents found a herring that day. That 0.1 tells us that heritability isn't a stamp of permanence. It changes when the world changes.

  Rafe had a slogan he used to repeat when the management meetings got tough. He'd say, "If it's heritable, it isn't fixable." He meant that if a trait is genetic, you can't solve it by changing the habitat. It was a way of protecting the birds from human interference. But the cross-fostering experiment showed us that even a highly heritable trait can be fixed if you change the environment. We fixed the mass difference not by breeding better birds, but by moving them to better water.

  So, how do we honor Rafe? We don't honor him by pretending he was right about everything. We honor him by using the lab he built to ask the questions he was too polite to ask himself. He spent forty-one years measuring the world so that when we finally tested it, the answer would be undeniable.

  To Mary, to Kevin, and to the crew: This lab is not a monument to a conclusion. It is a tool for the next measurement. Rafe taught us that the birds deserve precision. He taught us that if you show up every year, rain or shine, the data will eventually speak. Sometimes it speaks in support of your hopes, and sometimes it speaks in support of the herring.

  The difference between the colonies wasn't in the blood. It was in the sea. And if we want the puffins back at Outer Double Head to reach 340 grams, we don't need to move the chicks. We need to fix the water. That is the work left to do. Rafe gave us the scales to weigh the problem. Now we have to find the courage to fix the scale of the ocean.

  Thank you.
