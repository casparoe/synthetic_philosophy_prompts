answer: |-
  The Scenario
  Imagine an infinite, boundary-less crystalline lattice composed of identical, featureless point-particles at regular intervals. Insert two perfectly identical macroscopic spheres, replacing two lattice nodes separated by exactly half the lattice constant. There is no external observer, no edge, and no other macroscopic objects to serve as landmarks. The spheres share every intrinsic quality—mass, composition, temperature—and every direct relational property to each other, such as distance. The lattice provides the only structure, yet no node is intrinsically distinct from any other except by its structural relation to the spheres. The physics remains classical and ordinary, devoid of quantum indeterminacy or topological quirks, relying solely on spatial arrangement within the rigid grid.

  The Verdicts
  The structural realist asserts discernibility. For them, reality is fundamentally relational structure. Each sphere occupies a unique node within the global lattice network. Even without external labels, Sphere A sits at coordinate (0,0,0) relative to the grid's internal logic, while Sphere B sits at (0.5, 0, 0). These structural positions are distinct properties grounded in the lattice's geometry, satisfying the Identity of Indiscernibles. Conversely, the strict Leibnizian denies this. They argue that spatial position within a homogeneous grid is not a genuine intrinsic property but merely a conceptual placeholder. Without an external reference frame or intrinsic difference, swapping the spheres changes nothing observable or real. Since both spheres share all qualitative properties and the lattice offers no intrinsic anchor, the Leibnizian concludes they are numerically identical or truly indiscernible, violating the principle if distinctness requires qualitative difference.

  The Engine
  The disagreement hinges on the ontological status of structural properties within a symmetric system. The lattice introduces relational asymmetry only if a node's position constitutes a genuine property independent of external labeling. For the realist, the grid's geometry individuates the spheres via their unique structural roles. For the Leibnizian, the lattice is merely a backdrop; without intrinsic differentiation or an external observer, the two positions are qualitatively identical. Thus, the conflict arises over whether relational structure alone can confer individuality without qualitative distinction.

  The Counterattack
  The Leibnizian resists by arguing the lattice lacks individuating features. If the lattice shifts by one unit, the situation remains unchanged because every node is identical. Assigning coordinates implies a hidden, unobservable absolute space. They contend that if spheres share all qualitative properties, including relations to indistinguishable lattice points, positing distinct structural roles disguises a commitment to haecceity. Without intrinsic markers on the nodes, claiming Sphere A occupies a different structural role than Sphere B is metaphysically empty, reducing to a verbal distinction without ontological weight.

  The Collapse Check
  If the lattice dissolves into continuous space, the argument reverts to Black's original case. Without discrete nodes, there are no structural anchors. Every point is qualitatively identical relative to the spheres. The realist loses the grid's asymmetry, forced to rely on absolute positions which the Leibnizian rejects. Consequently, without the lattice's discrete geometry to provide unique relational profiles, the spheres become truly indiscernible, collapsing the realist's advantage.
