prompt: |-
  In a recent discussion about evolutionary psychology, a colleague kept returning to the phrase "nature knows best" to shut down spandrel explanations—most recently, to insist that human susceptibility to the sunk-cost fallacy must be an adaptation selected for some strategic function, rather than a by-product of domain-general reasoning mechanisms that happen to misfire in modern economic contexts. Separate the precise claims hiding in that slogan, laying them out as a menu from the trivial (for example, that selection tends to eliminate severely maladaptive traits) through the substantive and empirically testable (for example, optimality predictions about trait design) to the false or conceptually confused (for example, that widespread existence entails adaptive purpose). For each reading, say whether it is a platitude, a defensible scientific thesis, or a mistake, and identify which version the speaker was actually invoking when using the phrase to dismiss the spandrel hypothesis. In particular, clarify whether any defensible reading of "nature knows best" actually supports the inference from "this cognitive bias is common" to "this bias was directly selected for its current effect," or whether accommodating spandrels requires rejecting only the false readings while leaving the platitudes intact.
