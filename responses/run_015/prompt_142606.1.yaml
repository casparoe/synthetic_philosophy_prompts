answer: |-
  You are right to feel that the standard conceptual tools are blunt here. "Family resemblance" is too loose because it denies the existence of the very thing you perceive: a binding constraint that is real but invisible. "Prototype theory" is too graded because it conflates *what* a thing is with *how well* it fits. You are describing a distinction between **categorical identity** (is this an *a*?) and **systemic membership** (does this *a* belong to *this* set?).

  There is no single, universally agreed-upon term in philosophy or psychology that captures this specific property without carrying unwanted baggage. However, the conceptual carving you need exists at the intersection of **generative systems** and **constraint satisfaction**.

  Here is the distinction, the name for the property, and the verdict on the ontology.

  ### The Carving: Class vs. System

  You are conflating two different hierarchies of categorization.

  1.  **Class Identity (Extension):** This is the question, "Is this shape an *a*?" This is determined by legibility and function. It is binary (or nearly so) and relies on perceptual features shared across all instances of *a* in all contexts. This is where prototype theory applies.
  2.  **Systemic Membership (Intension):** This is the question, "Is this *a* a member of *this* alphabet?" This is determined not by the shape's features in isolation, but by its adherence to the **implicit generative rules** that produced the other letters.

  The property you are looking for is **Generative Consistency**.

  A shape has generative consistency with a set if it could have been produced by the same underlying constraints (the "hand," the "spirit," the parametric equations) that produced the set. This explains why two visually different shapes can be "the same letter by the same hand" (they satisfy the same deep constraints) and why two visually identical shapes can differ in membership (one satisfies the constraints, the other is an accidental match).

  ### The Name

  If you require a term of art, **Systemic Coherence** is the closest existing descriptor, but it is often used too loosely. In the philosophy of art, this touches on **Style**, but specifically **Style as a Generative Rule** rather than Style as a Cluster of Features.

  In cognitive science, this is often discussed under **Latent Variable Inference**. The observer is not comparing shapes; they are inferring the hidden variables (the "hand") that generated the shapes. The judgment of "wrongness" is a judgment that the shape requires a different setting of the latent variables than the rest of the page.

  However, since you asked for a tight definition to earn its keep on hard cases, I propose we treat **Generative Consistency** as the technical term for this property.

  ### The Ontology: Fact or Projection?

  You ask if there is a fact of the matter. If style were merely a cluster of visual features (Wittgenstein), then sameness of style would be a projection of the observer's similarity metric. But if style is a **generative constraint**, then there is a fact of the matter.

  The fact is not in the ink; it is in the **counterfactuals**.
  *   **Fact:** "If the writer had continued writing, would this shape have appeared?"
  *   **Projection:** "Does this shape look like the others?"

  Your teacher's judgment is a hypothesis about the generative process. When she says a letter is "wrong," she is saying, "This shape implies a rule that contradicts the rules implied by the other shapes." This is a realist position: the style exists as a set of constraints, independent of any single instance. The "sociology of certain eyes" is merely the mechanism by which we detect the constraints. Experts are simply better at inferring the latent variables.

  ### Verdicts on the Hard Cases

  Using **Generative Consistency** as the definition:

  1.  **The One-Letter Alphabet:**
      *   *Verdict:* It cannot have a style.
      *   *Reasoning:* Style is a relational property of a system. A single data point cannot reveal a rule; it can only reveal a shape. To have a style, there must be the possibility of variation constrained by invariance. A one-letter script has no internal relations to constrain. Embrace this reductio; it confirms that style is systemic, not intrinsic.

  2.  **The Perfect Forgery:**
      *   *Verdict:* It is a member of the style, but not of the oeuvre.
      *   *Reasoning:* Generative consistency is about the *rules*, not the *biology*. If the forgery satisfies the same implicit constraints as the original, it is stylistically identical. The "wrongness" of a forgery is historical/provenancial, not stylistic. This separates **Stylistic Membership** (does it fit the rules?) from **Authorship** (did the original rule-maker make it?).

  3.  **The Bitmap/Stencil Letter:**
      *   *Verdict:* It has a style, and the style is "Grid-Constrained."
      *   *Reasoning:* The lack of curvature is not an absence of style; it is the presence of a severe constraint. Stylelessness is impossible; even the absence of decoration is a rule. The "spirit" here is the submission to the material constraint.

  4.  **The Weathered Inscription (Nobody Made It):**
      *   *Verdict:* It has Categorical Identity, but Stylistic Ambiguity.
      *   *Reasoning:* If the erosion creates shapes that satisfy the generative constraints of a known script, we attribute that style to it. If the shapes are random, they have no style. We project style onto it only if we infer a generative intent behind the erosion. If it reads as an *a* but implies no consistent rules for *b* or *c*, it is a letter without a style.

  5.  **The Child's Drawing:**
      *   *Verdict:* High Generative Intent, Low Generative Consistency.
      *   *Reasoning:* The child is attempting to instantiate a system (the "spirit" is right), but fails the specific constraints (the "details" are wrong). This explains why it feels "right" in spirit but "wrong" in execution. It is a failed attempt at membership, not a successful member of a different style.

  ### One Phenomenon or Several?

  Your calligrapher's complaint is **one thing**.

  The confusion arises because we use the word "letter" to refer to three different levels:
  1.  **The Abstract Character** (the concept of *a*).
  2.  **The Glyph** (the visual shape).
  3.  **The Token** (the specific instance in a specific system).

  Your teacher is judging the **Token's** fit within the **System**. The cognitive science program you recall from the nineties failed because it tried to model the Glyph without inferring the System. They treated style as a texture to be applied, rather than a rule to be obeyed.

  The evidence that settles the "fact of the matter" question is **predictive power**. If you can look at five letters and accurately predict the shape of the sixth, the style is real (it is a functioning generative model). If you cannot, the style is a projection. In your calligraphy class, the style is real because your teacher can predict, with high accuracy, what a "right" *a* must look like before you write it.

  ### Summary

  The concept you are missing is **Generative Consistency**.
  *   **Not Family Resemblance:** Because it relies on shared underlying rules, not overlapping features.
  *   **Not Prototype Theory:** Because membership is binary (it fits the rule or it doesn't), even if the *degree* of fit is graded.
  *   **The Fact:** Lies in the implicit constraints, not the explicit shapes.
  *   **The Cost of a Negative Answer:** If you deny there is a fact of the matter, you must admit that your teacher's corrections are arbitrary preferences rather than judgments of coherence. Given that you can learn to see what she sees, the coherence is discoverable, and therefore real.

  You are teaching your students that concepts are not just buckets for things; they are rules for making things. Your calligraphy teacher is grading you not on the bucket, but on the rule.
