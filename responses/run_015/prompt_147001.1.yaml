  **Joint Statement on Democratic Legitimacy**

  **I. Shared Claims**

  1.  **Mediation:** Representation is constitutively opaque; all aggregation mechanisms filter heterogeneous preferences, introducing inevitable distortion between individual intent and collective output.
  2.  **Heterogeneity:** Preference conflict is structural, not transient; incompatible demands exist ontologically prior to aggregation, rendering unanimous satisfaction impossible.
  3.  **Exclusion:** Assertions of absolute popular unity inherently risk illegitimate exclusion; legitimacy requires institutional checks against the dangers of false unification.
  4.  **Collective Agency:** A government acts for a collective only when operating under rules accepted as binding by those subject to coercion, irrespective of whether those rules track a pre-existing will.

  **II. Disagreements Table**

  | Issue | Sovereignist Formulation | Constructivist Formulation | Diagnostic Case & Predictions |
  | :--- | :--- | :--- | :--- |
  | **Aggregation-Independence**<br>Does a coherent collective preference exist independently of the rules used to aggregate it? | Yes. A discoverable, pre-institutional popular will exists; rules function merely to approximate or obscure this latent entity. | No. "Will" has no ontological status outside procedural mechanisms; treating it as independent is a category error licensing exclusion. | **Case:** Condorcet Cycles.<br>**Sov:** Indicates institutional failure to capture the true majority will.<br>**Const:** Proves collective preference is an artifact of rules, not a pre-existing fact. |
  | **Correspondence-vs-Fairness**<br>Does democratic legitimacy require correspondence to a pre-existing will? | Yes. Legitimacy requires substantive correspondence to the popular will; procedure is instrumental to this end. | No. Legitimacy is satisfied solely by procedural fairness among irreconcilable interests; correspondence is conceptually incoherent. | **Case:** Executive emergency decrees.<br>**Sov:** Potentially legitimate if corresponding to urgent popular demand.<br>**Const:** Illegitimate *per se*; violates necessary discursive filtering of interests. |
  | **Boundary-Circularity**<br>Can defining "the people" be done without presupposing the popular will one seeks to identify? | Yes. Pre-political identity grounds the boundary; the will identifies the true members independent of constitutional framing. | No. Defining membership presupposes the will; boundaries are constitutional artifacts that produce the entity they claim to find. | **Case:** Secession referendum (mutually exclusive boundaries).<br>**Sov:** Reveals a hidden prior will of the remaining polity.<br>**Const:** Demonstrates "the people" is always an artifact of prior constitutional framing. |
