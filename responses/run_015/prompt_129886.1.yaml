prompt: |-
  Had a three-hour argument with my flatmate last night (hes doing a Buddhism module and kept insisting that Confucian role ethics is just no-self with extra steps, and then my friend who works on care ethics said it is care ethics with a nicer vocabulary) and I am still slightly annoyed about it, which is maybe why I am writing this now. I am a TA and I have got a single fifty-minute section next Tuesday with about twenty first-years, nearly all non-majors, who will have read one short and quite sympathetic secondary piece on role ethics and nothing from the primary texts; possibly one of them will have heard of the bit where Confucius is asked about an upright man and the son who covers for his father, so I cannot count on that being fresh or on them having it right. Do not explain role ethics to me. Plan how I explain it: what has to be in the room, conceptually, before the view even sounds like a claim rather than a platitude, and in what order, and why each step depends on the one before it.

  Here is what I want specifically. First, the carrying example: I have been playing with a case where an adult daughter visits a parent with advanced dementia who no longer recognises her, so that nothing reciprocal is left, no contract, no affection on one side, and yet the daughter is still obviously in a role that has content. Tell me whether that should carry the whole session or whether something else should, and why not the two obvious candidates: the father who stole a sheep (I worry that turns the hour into a fight about nepotism and I lose the constitutive claim in five minutes) and the be-a-different-person-at-work-and-at-home example (which, after last night, I now think actively invites the misreading that roles are things you wear). I also made up two devices and I want you to place them or kill them: the empty-room version, where we strip a particular person of every role and ask what is left over, and the failed-role case, where a father has not spoken to his daughter in ten years and I ask whether he is still a father on this view and what the role is even made of if so. Say which of those helps, which backfires, and exactly where in the sequence it belongs.

  Then the misconception map, which is the part I am most worried about. The ones I expect: roles as costume or social script; role ethics as virtue ethics in Chinese vocabulary (my flatmates version of this was that it is basically character without the unity of a character); relativism, or whatever-your-society-happens-to-expect; and the reform objection my friend hammered on, that if a person just is their roles then there is no standing ground from which to say a role is corrupt and should be reshaped or abolished, so the view collapses into conservatism. For each, tell me the point in the sequence where it should be defused rather than answered, and whether defusing it requires something I should have put in earlier, since that is really what I am asking about. Also tell me what I should refuse to explain at this level and say out loud that I am refusing: I am guessing the process-cosmology background and the scholarly fight about whether this is a reconstruction of the early texts or a modern philosophical build on them. And give me one thing to ask or have them do at the end that would actually show me they have the constitutive claim rather than the ability to repeat the word role, something that fails loudly if they only have the platitude version.

  Last thing: be honest about where your plan is most likely to break. Tell me which ordering choice you are least confident in, what would change your mind about it (a different example, a different opening move, a class that shows up with more or less background than I think), and what I would see in the room in the first ten minutes that should make me abandon your sequence and do something else instead.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** A TA (Teaching Assistant) in philosophy/religious studies/ethics.
      *   **Emotional State:** Slightly annoyed after a 3-hour argument with a flatmate (Buddhism student) and a friend (care ethics scholar). They feel the need to clarify Role Ethics against these specific misreadings (No-self + extra steps; Care ethics + nicer vocabulary).
      *   **Audience:** ~20 first-year students, nearly all non-majors.
      *   **Preparation:** Read *one* short, sympathetic secondary piece on Role Ethics. No primary texts. Unreliable knowledge of specific Confucian anecdotes (e.g., father stealing sheep).
      *   **Time:** 50 minutes.
      *   **Goal:** Explain Role Ethics not as a platitude ("we all have roles") but as a *constitutive claim* (roles make the self).
      *   **Constraints:** Do *not* explain role ethics to the TA (they know it). Plan *how* to explain it. Focus on conceptual ordering, dependency of steps, managing misconceptions, and specific pedagogical devices.

  2.  **Deconstruct the Request:**
      *   **Carrying Example:** Evaluate the "Dementia Daughter" case vs. "Father Steals Sheep" vs. "Work/Home Persona". Decide which carries the session.
      *   **Pedagogical Devices:** Evaluate "Empty-Room Version" (stripping roles) vs. "Failed-Role Case" (estranged father). Place or kill them.
      *   **Misconception Map:** Address: Costumes/Scripts, Virtue Ethics in Chinese, Relativism/Conventionalism, Reform/Conservatism Objection. Determine *when* to defuse vs. answer.
      *   **Refusals:** What to explicitly *not* explain (Process Cosmology, Scholarly Reconstruction debates).
      *   **Assessment:** One final task/question to test for the *constitutive claim* vs. platitude.
      *   **Risk Assessment:** Where is the plan most likely to break? What would cause an abort mid-class?

  3.  **Evaluate the Carrying Example:**
      *   *Father Steals Sheep:* User is right. It triggers "nepotism/corruption" debates immediately. Students get stuck on "Is covering for a criminal right?" rather than "What constitutes the self?" It distracts from the metaphysical/ethical constitution point.
      *   *Work/Home Persona:* User is right (especially after the argument). It reinforces the "mask/costume" view (Goffman-esque). It suggests a core self *behind* the roles.
      *   *Dementia Daughter:* Strong candidate. It isolates the *obligation* from *reciprocity* and *affect*. It highlights that the role persists even when the "content" (interaction) vanishes. It forces the question: "Why do I still owe this?" If the answer is "Because I am a daughter," it points toward constitution.
      *   *Decision:* The Dementia Daughter case should carry the session. It avoids the legalistic trap of the sheep and the psychological trap of the work/home split.

  4.  **Evaluate Pedagogical Devices:**
      *   *Empty-Room Version (Stripping roles):* This is the classic "Onion" analogy. If you peel away all roles, is there a core? Role ethics says "No" (or "Nothing meaningful"). This is crucial for the *constitutive* claim. It needs to happen *early* to set the metaphysical stage before discussing ethics.
      *   *Failed-Role Case (Estranged Father):* This is tricky. If the father hasn't spoken in 10 years, is he still a father? Role ethics might say "Yes, but a failed one" or "The role is broken but the locus remains." This risks confusing students who think roles are defined by *performance*. If roles are constitutive, failing the role doesn't mean you aren't in the locus, but it complicates the "no core self" argument. It might be better as a stress test *after* the constitution point is made, but in 50 mins, it might muddy the water.
      *   *Decision:* Use "Empty-Room" early (Minute 10). Kill "Failed-Role" or save it for office hours. It invites the "performance = role" confusion which is the enemy here.

  5.  **Map the Misconceptions:**
      *   *Costume/Script:* Defuse this *immediately* via the Empty-Room exercise. If roles were costumes, there'd be a wearer. If there's no wearer, they aren't costumes.
      *   *Virtue Ethics (Character):* Defuse during the Dementia case. Virtue ethics focuses on internal disposition. Role ethics focuses on the relational locus. If the parent doesn't know you, your "disposition" matters less than the "locus."
      *   *Relativism/Conventionalism:* This comes up when asking "Where do roles come from?" Defuse by distinguishing *specific* roles (cultural) from the *structure* of role-bearing (universal/human).
      *   *Reform/Conservatism:* This is the friend's objection. Do not try to solve this fully in 50 mins. Acknowledge it at the end as a "critical limitation" or "next step." If you address it too early, students think the theory is just about obeying society.
      *   *Refusals:* Explicitly state: "We are not doing metaphysics of *qi* today" and "We are not deciding if Confucius actually said this."

  6.  **Develop the Assessment (The "Loud Failure" Test):**
      *   Need a prompt where the "Platitude" answer ("Be a good worker") differs from the "Constitutive" answer ("There is no 'I' to choose the role").
      *   *Idea:* Ask them to write a advice letter to someone having an identity crisis.
      *   *Better Idea:* A specific scenario where "being yourself" is the problem.
      *   *Best Idea:* The "Resignation" test. If I quit the role, do I cease to exist morally? Or, ask them to describe a moral failure. If they say "He broke the rules," it's platitude. If they say "He fractured his relational existence," it's constitutive.
      *   *Refinement:* Ask: "If you could press a button to remove all your roles and be 'just you,' would you press it? Why/Why not?" A platitude reader says "Yes, to be free." A constitutive reader says "No, because there's nothing left to be."

  7.  **Sequence and Timing (50 Minutes):**
      *   0-5: Hook & Refusals (Set boundaries).
      *   5-15: The Empty Room (Metaphysical groundwork).
      *   15-35: The Dementia Case (Ethical application).
      *   35-45: Misconception Defusal (Virtue/Relativism).
      *   45-50: Assessment & Wrap.

  8.  **Risk Assessment:**
      *   *Weakest Link:* The transition from Empty Room to Dementia. Students might accept "No core self" abstractly but revert to "But I feel like a core self" during the emotional Dementia case.
      *   *Abort Signal:* If during the Empty Room exercise, the class unanimously agrees "There's definitely a soul/core left," the constitutive claim is dead. You have to pivot to "Roles as primary *moral* guides" rather than "Roles as *ontological* constitution."

  9.  **Drafting the Response:**
      *   *Tone:* Professional, empathetic to the TA's frustration, direct, pedagogical.
      *   *Structure:* Follow the user's specific headers (Carrying Example, Devices, Misconception Map, Refusals, Assessment, Risk).
      *   *Content:* Ensure the "Why" is clear for every ordering decision. Emphasize that the *constitutive* claim is the hard part, not the *ethical* part.

      *(Self-Correction during drafting)*: I need to make sure I don't accidentally explain Role Ethics to the TA. Keep it focused on *pedagogy*.
      *(Refining the "Failed Role" device)*: Actually, the "Failed Role" might be useful to distinguish Role Ethics from Contractualism. But in 50 mins? It's risky. I'll advise killing it to save time for the Reform objection which is more pressing given the friend's comment.
      *(Refining the Assessment)*: The "Button" question is good. Let's make it concrete. "Describe a person who has lost their moral compass." Platitude: "They broke rules." Constitutive: "They lost their connections."

      *(Final Polish on Risks)*: Be honest. The "Empty Room" can feel like a parlor trick. If they don't buy the "nothing is left" premise, the rest fails. I need to emphasize *how* to facilitate that so it doesn't feel like a gotcha.

  10. **Final Review against constraints:**
      *   Did I explain Role Ethics? No.
      *   Did I address the flatmate/friend arguments implicitly? Yes, by structuring against "No-self" (it's not Buddhist negation, it's relational constitution) and "Care Ethics" (it's not affect-based, it's locus-based).
      *   Did I answer all specific sub-questions? Yes.

      *Let's write.*
answer: |-
  This is a solid pedagogical challenge. You are fighting two fronts: the "Platitude Front" (roles are just things we do) and the "Reduction Front" (this is just Virtue/Care/No-self in disguise). With non-majors and 50 minutes, you cannot win on textual nuance. You must win on *intuition pumping*.

  Here is the plan.

  ### 1. The Carrying Example
  **Verdict:** Use the **Dementia Daughter** case. Drop the other two.

  **Why the Dementia Case carries it:**
  Role ethics makes a constitutive claim: the self is the sum of its relational loci. To prove this to first-years, you need a case where *everything else* that usually defines a self (reciprocity, memory, affection, contract, utility) is stripped away, leaving *only* the role.
  *   **The Sheep Case:** You are correct to kill this. It triggers a deontological/utilitarian alarm ("Is stealing wrong?") that drowns out the metaphysical question ("Who is the son?"). It turns the session into a debate about legalism vs. family loyalty.
  *   **The Work/Home Case:** You are correct to kill this. It reinforces the "Mask" theory (Goffman). It suggests there is a "real me" who goes home and takes the mask off. This is the exact opposite of the constitutive claim.
  *   **The Dementia Case:** This works because it isolates the *locus* from the *interaction*. The parent cannot recognize the role; the daughter receives no emotional reward. If she still owes care, it cannot be because of a contract or affection. It must be because *being a daughter* is what she *is*. It forces the constitutive claim without needing primary texts.

  **Instruction:** Do not present this as a "dilemma" (What should she do?). Present it as an "ontology check" (What is happening to her identity?).

  ### 2. The Pedagogical Devices
  **Verdict:** Deploy the **Empty-Room Version**. Kill the **Failed-Role Case**.

  **The Empty-Room Version (Place at Minute 10):**
  *   **Why:** You cannot make the ethical claim (you ought to fulfill roles) until you secure the metaphysical claim (you *are* your roles). If they think there is a "core self" choosing roles, you have already lost to the "Costume" misconception.
  *   **Placement:** Do this *before* the Dementia case.
  *   **Execution:** Ask them to list every role they have (student, sibling, citizen, friend). Ask them to imagine removing them one by one. Ask: "What is left in the room?"
  *   **Goal:** You want them to feel the unease of the "nothing." If they say "My personality," press: "Is your personality not formed by how others treat you?" You need them to concede that without the roles, there is no *moral agent* left to discuss. This sets the table for the Dementia case: if there is no core self, the daughter doesn't "choose" to care; she cares because that is the only shape her existence takes.

  **The Failed-Role Case (Kill it):**
  *   **Why:** In a 50-minute session, asking "Is an estranged father still a father?" invites a semantic debate ("Well, biologically yes, but morally no..."). This distracts from the constitutive claim. It risks suggesting that roles are earned by performance (Virtue Ethics) rather than given by relational locus (Role Ethics). It consumes too much time for too little gain. Save this for office hours if a student asks about abuse or estrangement.

  ### 3. The Misconception Map
  You cannot "answer" these objections fully in 50 minutes. You must **defuse** them by ordering the content so the objection doesn't stick.

  | Misconception | When to Defuse | How (The Pre-emptive Move) |
  | :--- | :--- | :--- |
  | **Roles as Costume/Script** | **Minute 10 (Empty Room)** | If the Empty Room exercise works, there is no "wearer" of the costume. State explicitly: "If roles were costumes, there would be a body underneath. We just agreed there isn't." |
  | **Virtue Ethics (Character)** | **Minute 25 (Dementia Case)** | Students will say "She's a virtuous person." Correct them: "Virtue ethics asks 'What kind of person is she?' Role ethics asks 'Where is she standing?' The parent doesn't know her character. The location remains." |
  | **Relativism / Conformity** | **Minute 35 (Discussion)** | Distinguish *specific* roles (cultural) from *role-bearing* (human). "The specific duties might change, but the fact that we are constituted by relationships does not." |
  | **Reform / Conservatism** | **Minute 45 (The Limit)** | **Do not solve this.** Your friend is right that this is a hard problem for the view. Acknowledge it: "If I am my roles, how do I change them? This is the hardest question for this theory." Validating the objection prevents them from thinking the theory is stupid, but refusing to solve it keeps you on time. |

  ### 4. The Refusals
  You must explicitly state what you are *not* doing. This protects you from the "flatmate" (Buddhism) and "scholar" (Sinology) objections.

  **Say this verbatim at Minute 5:**
  > "Two things we are not doing today. First, we are not doing metaphysics about *qi* or process cosmology. We are treating this as a structural claim about identity. Second, we are not arguing about whether Confucius actually said this. We are analyzing the philosophical machinery of Role Ethics as a model, not doing history."

  **Why:** This stops the Buddhism student from jumping in with "But *anatta*..." and stops the history buffs from nitpicking the Analects. It frames the hour as *conceptual analysis*.

  ### 5. The Assessment (The "Loud Failure" Test)
  **The Task (Minute 48):**
  Give them 2 minutes to write a response to this prompt:
  > *"A friend says they are having an identity crisis and want to 'find out who they really are' underneath all their social expectations. Based on today's view, what is the mistake in their thinking?"*

  **The Grading Rubric (Mental Check):**
  *   **Platitude Failure:** "The mistake is ignoring their duties." (This treats roles as external obligations).
  *   **Platitude Failure:** "They should find themselves through their roles." (This implies the self is separate and can be found *via* roles).
  *   **Constitutive Success:** "There is no 'underneath.' To look for a self under the roles is to look for nothing." OR "They aren't finding themselves; they are fracturing their relationships."

  **Why this works:** It forces them to articulate the *ontological* claim. If they only understood the ethical claim ("be good"), they will fail this. It exposes the "Costume" misconception immediately.

  ### 6. Risk Assessment: Where This Breaks
  **The Weakest Link:** The transition from **Empty Room (Minute 15)** to **Dementia Case (Minute 20)**.

  **Why:** The Empty Room exercise is abstract. Students often nod along but don't *believe* there is no core self. When you hit them with the emotional weight of the Dementia case, their intuition will scream, "But she *feels* like a distinct person making a choice!" If they revert to individualism during the emotional case, the constitutive claim collapses back into Virtue Ethics ("She chooses to be good").

  **What Would Change My Mind:**
  If you have a class that is heavily religious (belief in a soul) or heavily liberal-individualist (strong belief in autonomy), the Empty Room exercise will face immediate, vocal resistance.

  **The Abort Signal (First 10 Minutes):**
  During the Empty Room exercise, ask: "If we strip the roles, is there a 'you' left?"
  *   **Green Light:** Hesitation, silence, or "I guess not really."
  *   **Red Light:** Immediate, confident consensus that "Yes, my consciousness/soul/personality remains."

  **If you see the Red Light:**
  **Abandon the Constitutive Claim.** You cannot teach "No core self" to 20 resistant first-years in 40 minutes.
  **Pivot To:** "Relational Priority."
  *   *New Script:* "Okay, maybe there is a core self. But Role Ethics argues that even if there is, it is *inaccessible* and *irrelevant* to ethics. We can only ever encounter each other through roles. So ethically, we must act *as if* the roles are constitutive."
  *   This saves the hour. You lose the metaphysics but keep the ethics. It turns the view from "You *are* your roles" to "You are *responsible for* your roles," which is easier to digest and still distinguishes it from pure individualism.

  **Final Advice:**
  Your flatmate and friend are arguing about high-level synthesis (Buddhism, Care Ethics). Your students are struggling with basic categorization. Do not try to prove your flatmate wrong in this room. If you set up the "Constitutive Claim" clearly, the flatmate's objection (No-self) falls away because Role Ethics is relational *construction*, not ontological *negation*. The friend's objection (Care Ethics) falls away because Care relies on *affect*, and your Dementia case removes affect. Trust the Dementia case to do that work. Don't mention your friends. Let the example kill their arguments for you.
