answer: |-
  My dear sir, you pose a difficulty that has troubled me greatly during the composition of *The Descent*, and I am pleased to grapple with it rather than sweep it aside. It is the mark of a true inquirer to test the theory against the most stubborn of facts.

  First, I must correct a slight misapprehension regarding my views on religion. I do not argue that morality is *derived* from religious belief, but rather that both spring from similar roots in the constitution of the human mind. The belief in spiritual agencies arises from the cognitive faculties—imagination, curiosity, and fear—working upon the unknown. Morality, however, is founded upon the **social instincts**. These are the impulses of sympathy and affection that bind a parent to offspring, or a member to his tribe. Thus, a society might conceivably lack the theological imagination yet retain the social instincts in full force. The absence of religion in your Kesh people does not, in my view, sever the evolutionary link of morality, for morality stands on its own legs, supported by instinct and habit, not by dogma.

  Now, concerning this Kesh society. You say they aid distant strangers at serious cost to themselves and to the... "fitness of the group"? I must pause here. You use the term "fitness" in a manner that feels somewhat technical. Do you mean simply their capacity to endure and flourish in the struggle for existence against rival tribes? Or do you imply some arithmetic of reproduction I am not acquainted with? I shall assume you mean that their numbers dwindle, or their power to defend themselves wanes, due to this excessive charity.

  If this is so, it presents a profound puzzle. In my view, a tribe possessing many members who, from sympathy, are always ready to aid each other and sacrifice themselves for the common good, would be victorious over most other tribes. This is natural selection acting on the community. But your Kesh extend this sympathy to *distant strangers*. This is where Reason enters the picture.

  I have argued that the conscience is the voice of the social instincts, guided by reason and habit. In a savage state, sympathy rarely extends beyond the tribe. But as reason advances, a man perceives that distant strangers are, in essence, no different from his kin. He may thus habitually override the immediate impulse of self-preservation for a higher standard of duty.

  If the Kesh practice a morality that leads to their own destruction, we must admit one of two things. Either this is a temporary phase before they are supplanted by less scrupulous neighbours—a tragic but natural consequence—or, and this is vital, we must distinguish between the *origin* of the moral sense and its *present application*.

  The moral feeling itself—the binding force you mention—is genuine. It is not an illusion. When a Kesh man feels he *ought* to aid a stranger, that feeling is as real as his hunger or his fear. It arises from an instinct that was selected because it generally promoted the welfare of the community in the past. That this instinct, when guided by advanced reason, may now push him towards actions that are biologically costly does not make the feeling false. It merely shows that the moral sense, once acquired, can transcend the narrow limits of its original utility.

  Consider our own civilized nations. We build hospitals for the sick and support the poor, actions which, strictly speaking, check the rigour of natural selection. Yet, do we deem these moral feelings illusory? Surely not. They are the noblest part of our nature, even if they stand somewhat apart from the brute struggle for existence.

  So, I would ask you: If the Kesh possess this binding moral feeling, even to their detriment, does that not prove that the instinct is powerful enough to override the very survival pressures that shaped it? And if it can override survival, does that not suggest that morality, once evolved, becomes a law unto itself, binding on the individual regardless of the consequence to the tribe?

  I am eager to hear if this distinction satisfies your objection, or if you believe I am granting too much to "Reason" without explaining how such a self-destructive habit could persist long enough to become a societal norm.
