answer: |-
  You have identified a genuine and profound structural problem in knowledge transfer, one that often goes unnamed because it sits in the blind spot between epistemology (what is true) and pedagogy (what works).

  You are asking if there is a concept for the mismatch between a description's **truth value** and its **competence-generating power**.

  The short answer is: **Yes, but it is usually treated as two separate problems.** The "useful falsehood" is typically discussed under *pedagogical scaffolding* or *instrumentalism*. The "inert truth" is typically discussed under *tacit knowledge* or the *expertise reversal effect*.

  However, your intuition that they are "one thing" is correct. They are two sides of the same coin. The unifying concept is the distinction between **Descriptive Validity** (does this match the system?) and **Operational Validity** (does this tune the human?).

  Here is the carving you are looking for.

  ### The Core Distinction: Model vs. Interface

  The mismatch arises because we treat documentation and instructions as **Models** (descriptions of reality) when they are actually functioning as **Interfaces** (controls for the user's cognitive state).

  *   **A Model** aims for *Descriptive Truth*. It tries to map the territory accurately.
  *   **An Interface** aims for *Operational Efficacy*. It tries to produce a specific state in the user (calm, focused, rhythmic) that leads to success.

  Your three cases are all failures of **Representational Assumption**: the assumption that the text must represent the system accurately to be useful.

  1.  **The Runbook (Useful Falsehood):** The text is a bad *Model* (it describes a step that doesn't exist) but a good *Interface* (it forces a pause, creates a rhythm, offloads anxiety). It regulates the engineer's state.
  2.  **The Expert Summary (Inert Truth):** The text is a good *Model* (it accurately summarizes the expert's past actions) but a bad *Interface* for the novice (it lacks the timing, the sensory cues, and the "feel" required to execute). It describes the terrain but gives no compass.
  3.  **The Code Review (Uncodifiable Intuition):** The expert has a highly tuned *Interface* (intuition) that operates directly on the code, but cannot be rendered into a *Model* (rule) without losing the signal-to-noise ratio required for detection.

  ### A Proposed Term: Regulative Knowledge

  If you need a label for the "one thing," the closest philosophical carving is the distinction between **Constative** and **Performative** utterances, but applied to technical systems.

  *   **Constative:** Statements that describe a state of affairs (e.g., "The valve is closed"). These can be True or False.
  *   **Performative:** Statements that *do* something by being said (e.g., "I name this ship..."). These are not True/False; they are **Happy/Unhappy** (successful/unsuccessful).

  Your runbook step is a **Performative** disguised as a **Constative**. It looks like a description of the system ("Drain connections"), but its function is to perform an action on the engineer ("Induce caution").

  When you remove the step, you remove the performative trigger. The engineer's cognitive state changes (they rush), and they fail. The "falsehood" is load-bearing because it is actually a **Regulative Fiction**.

  I propose calling this phenomenon **The Descriptive-Operational Decoupling**.
  *   **Descriptive Validity:** Correspondence with the system.
  *   **Operational Validity:** Correspondence with the user's cognitive needs.

  In your runbook case, Operational Validity is high, Descriptive Validity is low. In the expert summary, Descriptive Validity is high, Operational Validity is low (for the novice).

  ### Boundaries: What This Is Not

  You asked for the edges of this concept. It is crucial to distinguish **Regulative Fictions** from similar concepts.

  **1. It is not a Placebo.**
  *   *Placebo:* The mechanism of action is *belief*. If the user knows it's fake, it stops working.
  *   *Regulative Fiction:* The mechanism of action is *behavior*. In your runbook, even if they know the step is a no-op, it forces a temporal pause. However, you noted that telling them later sometimes breaks competence. This suggests there is a placebo component (trust in the runbook), but the primary mechanism is the *rhythm* it imposes. A placebo treats the mind by tricking it; a regulative fiction treats the mind by *structuring* it.

  **2. It is not a Lie.**
  *   *Lie:* Intent to deceive for the benefit of the speaker or to the detriment of the listener.
  *   *Regulative Fiction:* Intent to stabilize for the benefit of the listener. It is a **Noble Fiction**. The boundary is transparency: if you hide the fiction forever, it becomes a lie. If you reveal it only after competence is achieved (as you do), it remains scaffolding.

  **3. It is not a Mnemonic.**
  *   *Mnemonic:* A hook to help you recall a *true* fact (e.g., "ROYGBIV").
  *   *Regulative Fiction:* A hook that *replaces* a fact. There is no underlying truth to recall. The step *is* the pause.

  **4. It is not "Simplification."**
  *   *Simplification:* Removing detail but keeping the vector true (e.g., a subway map).
  *   *Regulative Fiction:* Adding detail that is vector-neutral or false, but stability-positive. The runbook step adds friction where there is none.

  ### Bearing on "Knowing-How" vs. "Knowing-That"

  You asked if this bears on the philosophical debate about whether *knowing-how* is just a special case of *knowing-that*.

  This phenomenon strongly suggests that **Knowing-That (propositional knowledge) is a lossy compression of Knowing-How.**

  *   **Case 2 (Expert Summary):** The expert compresses their *how* into *that*. The compression loses the timing and context data. The novice tries to decompress it and fails.
  *   **Case 1 (Runbook):** You are providing a *false* "That" to generate a correct "How." This proves that "That" is not the source of the "How." The "That" is merely a control signal. If a false signal controls the system better than a true one, then the signal's truth is irrelevant to its function.

  This supports the view that **Knowing-How is primary.** Propositions ("That") are tools we use to transmit "How." Sometimes, a tool works better when it is shaped for the hand (the user's mind) rather than shaped for the nail (the system's reality).

  ### Summary of the Carving

  If you need to name this to your team or in your head, I recommend **Operational Scaffolding** for the positive case (the runbook), and **The Descriptive-Operational Gap** for the mismatch itself.

  **Definition:**
  A **Descriptive-Operational Gap** exists when the fidelity of an instruction to the *system* (Descriptive) diverges from its fidelity to the *user's cognitive control loop* (Operational).

  *   **High Operational / Low Descriptive:** Regulative Fiction (The Runbook). Useful for novices, risky if exposed too early.
  *   **High Descriptive / Low Operational:** Compressed Expertise (The Expert Summary). Useful for peers, useless for novices.
  *   **High Operational / Null Descriptive:** Intuition (The Code Review). Highly effective, non-transferable via text.

  **The Rule of Thumb:**
  When onboarding, optimize for **Operational Validity**. When documenting for maintenance, optimize for **Descriptive Validity**. The error occurs when you use maintenance documentation for onboarding, or when you refuse to retire onboarding fictions once the engineer has internalized the rhythm.

  The "one thing" you are seeing is that **knowledge transfer is a control problem, not a data transfer problem.** You are not downloading a map into their brain; you are tuning a control loop. Sometimes a false signal stabilizes the loop better than a true one.
