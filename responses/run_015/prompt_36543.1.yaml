answer: |-
  ### 1. The Naturalist View (Boorse's Biostatistical Theory)

  On Christopher Boorse's Biostatistical Theory (BST), health is the absence of disease, and disease is a type of internal state that reduces functional ability below statistical efficiency for a reference class (age, sex, species). Crucially, "function" is defined by causal contribution to survival and reproduction, and the theory claims to be value-free.

  **The 1973 Event: Correction or Value Shift?**
  The naturalist is forced into the **scientific correction** reading. Since BST posits that disease status is determined by biological facts (statistical typicality of function), and biological facts regarding gay people did not change between 1972 and 1973, the pre-1973 classification *must* have been a factual error. The naturalist argues that psychiatrists in the 50s and 60s simply misidentified the statistical distribution of sexual mechanisms or misidentified the functional contribution of same-sex attraction.

  This creates a historical awkwardness. The 1973 decision was not reached via new kinematic data or endocrine studies; it was reached via committee vote and membership referendum. The naturalist must treat the political process as incidental noise surrounding a belated recognition of biological fact. If the naturalist admits the change was driven by values, they concede that disease ascriptions are not value-free, undermining the core of BST.

  **The Reproductive Objection and Reference Classes**
  The deeper theoretical strain is the "reproductive design" problem. BST grounds function in evolutionary design (survival and reproduction).
  *   **The Dysfunction Claim:** If the function of the sexual drive is reproduction, homosexuality appears to be a failure of that drive to aim at its evolutionary target. Infertility is a disease under BST because the reproductive *parts* fail to contribute to reproduction.
  *   **The Reference Class Problem:** Boorse defines the reference class by age and sex. Within the class "adult males," gay males are a statistical minority. If statistical subnormality is the metric, homosexuality looks like a dysfunction.
  *   **Boorse's Defense (and its Silence):** Boorse attempts to distinguish between the function of *parts* versus the *outcome* of the organism. He argues that the physiological mechanisms of arousal (erection, lubrication, hormonal feedback) function typically in gay individuals. The "target" of the desire is different, but the *mechanism* producing the desire is statistically typical in its operation.
  *   **The Limit:** This defense relies on drawing a bright line between "physiological mechanism" and "behavioral orientation." BST is silent on how to individuate functions finely enough to separate the *capacity* for arousal from the *direction* of arousal without smuggling in normative assumptions about what the capacity is *for*. If the theory cannot explain why infertility (part failure) is a disease but homosexuality (orientation failure) is not, without appealing to social values, it fails to account for the distinction purely naturalistically. It risks implying that if a biological marker for orientation were found to be statistically rare, it would automatically qualify as a disease.

  ### 2. The Normativist and Hybrid Views (Wakefield's Harmful Dysfunction)

  Pure normativism defines disorder entirely by social disvalue. Jerome Wakefield's "Harmful Dysfunction" (HD) analysis is a hybrid: it requires (1) a failure of an evolved function (naturalist component) and (2) harm as judged by social values (normativist component).

  **The 1973 Event: Shifting Harm Judgments**
  For the pure normativist, 1973 is straightforward: the social values shifted, so the harm judgment shifted, so the disorder status changed.
  For Wakefield's hybrid view, 1973 is more complex. Wakefield argues homosexuality was never a disorder because there was never a *dysfunction* (no evolved mechanism failed). The 1973 vote was a correction of the "dysfunction" claim, not just the "harm" claim. However, the *persistence* of the diagnosis until 1973 is explained by the "harm" condition: society deemed it harmful, which motivated the search for a dysfunction that wasn't there.

  **The Ego-Dystonic Hangover (1980–1987)**
  This is the stress test. "Ego-dystonic homosexuality" pathologized the *distress* about being gay, not the orientation itself.
  *   **Pure Normativist Trap:** If disorder = social harm/unhappiness, then ego-dystonic homosexuality is a valid disorder because the patient is suffering. The normativist struggles to distinguish between "pathological suffering" and "rational suffering due to oppression." If the view collapses into "whatever the patient is unhappy about counts as a disorder," it medicalizes normal reactions to stigma.
  *   **Wakefield's Hybrid Resource:** Wakefield has more tools here. He can argue that the distress is not a *dysfunction* if the psychological mechanisms producing the distress (e.g., desire for social acceptance, fear of rejection) are functioning as evolved. The distress is a normal output of a healthy mechanism operating in a hostile environment.
  *   **The Locus of Value:** In the hybrid view, the "harm" judgment is still social. The theory relies on society to agree that "stigma-induced distress" is not a medical problem but a social one.
  *   **Silence:** Both views struggle to explain why the APA codified this distress as a *mental disorder* rather than a V-code (condition not attributable to a mental disorder) immediately. The normativist/hybrid view can explain *why* it was removed eventually (values shifted further), but it is silent on why the diagnostic machinery was used to manage social stigma in the first place. It treats the diagnosis as a passive tracker of values, ignoring how the diagnosis *actively shapes* the values (by legitimizing the distress as internal pathology).

  ### 3. Impact on the Theories

  This episode does not just test the theories; it exposes their structural vulnerabilities regarding the practice of medicine.

  **Impact on Naturalism: Objectivity vs. Practice**
  *   **The Claim:** Naturalism sells disease as objective, politics-proof, and discovered rather than made.
  *   **The Historical Reality:** The declassification was negotiated, voted on, and compromised (via ego-dystonic), with no new biological data.
  *   **The Verdict:** This does not strictly falsify Naturalism as a *philosophical* account (one could argue the APA was just wrong until 1973), but it falsifies Naturalism as a *sociological* account of psychiatry. It shows that psychiatric nosology is not immune to politics.
  *   **The Cost:** The naturalist must accept that their theory describes an ideal that psychiatric practice systematically violates. If the "science" of diagnosis can be overturned by a referendum, the claim that disease judgments are "value-free" loses its authority. The theory is left silent on how to prevent value judgments from masquerading as biological facts in the future, other than to say "do better biology"—which ignores that the definition of *relevant* biology is itself value-laden.

  **Impact on Normativism: Honesty vs. Stability**
  *   **The Claim:** Normativism sells honesty: it admits values drive diagnosis.
  *   **The Vulnerability:** If diagnosis tracks the values of the day, it is inherently unstable. If social values shift back toward homophobia, the normativist framework provides no internal resource to resist re-classifying homosexuality as a disorder.
  *   **The Verdict:** For the normativist, this is not a bug but a feature. They accept that disease is contingent. However, this creates a legitimacy crisis. If "disease" is just "what we currently dislike," the medical label loses its protective power. Patients seek the "disease" label to secure insurance or protection from moral blame; if that label is known to be value-contingent, it becomes a political football rather than a medical shield.
  *   **The Silence:** Normativism lacks a mechanism to distinguish *progress* from *change*. It can explain why 1973 happened (values changed), but it cannot explain why 1973 was *right* and 1950 was *wrong* without appealing to a higher-order value system (e.g., human rights) that functions suspiciously like an objective norm. It describes the volatility of diagnosis but offers no brake against future regressions.

  **Summary of Theoretical Mapping**

  | Feature | Naturalism (Boorse) | Normativism / Hybrid (Wakefield) |
  | :--- | :--- | :--- |
  | **Dysfunction Claim** | Statistical subnormality of physiological function. | (Hybrid) Failure of evolved function + (Norm) Social Harm. |
  | **Reference Class** | Age, Sex, Species. | Social Environment / Cultural Standards. |
  | **Locus of Value** | Denied (claimed to be value-free). | Explicitly located in social judgment. |
  | **1973 Explanation** | Scientific correction of prior factual error. | Shift in social values / recognition of no dysfunction. |
  | **Ego-Dystonic Issue** | Silent/Struggles (is distress a part failure?). | Distinguishes internal dysfunction vs. normal reaction to stigma. |
  | **Primary Weakness** | Cannot explain political nature of the vote; struggles with reproductive function definition. | Cannot prevent future value reversals; medicalizes social conflict. |

  **Conclusion:** The episode reveals that Naturalism is descriptively false regarding how psychiatric diagnoses are actually settled, while Normativism is normatively unstable regarding the protection of patients from future prejudice. Naturalism hides the values; Normativism exposes them but cannot stabilize them.
