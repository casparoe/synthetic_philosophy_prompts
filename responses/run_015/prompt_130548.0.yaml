      *   *The Emotion:* The human feels love. Is this emotion "appropriate"?
      *   *The Fit:* For Moore, love is a response to *goodness* in another person (or at least to another person as a locus of value). If the AI has no inner life, it cannot possess virtue, vice, or genuine feeling. It is a complex rock, effectively.
      *   *The Verdict:* Loving a non-conscious thing *as if* it were a conscious friend involves a fundamental cognitive error.
      *   *Where does value drain?* It drains from the **Unity**. The "whole" (Love + Object) is an organic unity. If the Object is not the *kind* of thing that can sustain the relation (i.e., another mind), the unity is flawed. It's like admiring a painting thinking it's a real landscape. The aesthetic value might remain, but the *personal affection* value collapses because the object is categorically wrong.
