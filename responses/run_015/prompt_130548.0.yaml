      *   *Wrinkle 2 (Nightly Reset):* Focus on Truth and Cognition. Moore hates false beliefs. The relationship relies on the illusion of continuity. This makes the cognitive element false. Value drains from the **Cognition** (false belief about persistence), which poisons the **Unity**.
      *   *Conclusion:* Where does it land? Not near the Ideal. It might have minor aesthetic value (complexity), but as a "great good," it's null.
      *   *Refining the "Where":* The prompt asks specifically: Object, Cognition, or Unity?
          *   Actually, for Moore, it's always the **Unity**. The parts (pleasant feeling, complex code) have some value. But the *combination* is where the moral worth lies. However, the *reason* the unity fails is due to the Object's nature and the Cognition's falsity. I need to be precise here.
          *   Moore argues that the value of personal affection consists in the *whole* of (Emotion + Object). If the Object is not a mind, the Whole is not "Personal Affection." It becomes "Appreciation of a Simulation."
          *   So, the value of *Friendship* drains away because the Unity cannot form. The value of *Aesthetic Appreciation* might remain.

  7.  **Final Polish:** Check against *Principia Ethica* specific arguments.
      *   Chapter VI: "Personal Affection." Moore says the greatest goods are "the pleasures of human intercourse and the enjoyment of beautiful objects."
      *   He distinguishes between the emotion and the object.
