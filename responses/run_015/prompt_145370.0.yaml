answer: |-
  You have hit on one of the most sophisticated and contentious fault lines in the philosophy of mind and language. Your intuition is not only correct; it maps almost perfectly onto a specific technical debate that has occupied philosophers for the last 40 years.

  There isn't a single colloquial phrase for this, but the established technical framework that captures exactly what you are describing is called **Two-Factor Semantics** (or the **Two-Factor Theory of Mental Content**). Within that framework, the specific asymmetry you noticed is the distinction between **Narrow Content** and **Broad Content**.

  However, to capture your insight about the "shifting boundary" and the specific noun/predicate split, the most precise modern formalization is **Two-Dimensional Semantics** (specifically the distinction between **Primary** and **Secondary Intensions**).

  Here is the precise breakdown of the phenomenon you observed, the name for it, and how it differs from the alternatives you mentioned.

  ### 1. The Name and Definition

  **The Phenomenon:** The Asymmetry of Semantic Externalism (or The Narrow/Broad Content Split).

  **The Definition:** This is the theoretical move where a mental representation is analyzed as having two components:
  1.  **Broad Content (Reference/Secondary Intension):** The part of the meaning determined by the external environment (e.g., "water" refers to H2O on Earth, XYZ on Twin Earth). This is "outsourced."
  2.  **Narrow Content (Psychological Role/Primary Intension):** The part of the meaning determined solely by the internal state of the thinker (e.g., "clear, drinkable, wet liquid"). This is "locked inside the head."

  **Why it exists:** It is designed to solve the exact problem you identified. Pure externalism (Putnam) makes it hard to explain why the Twin Earth duplicate isn't "crazy" (since their beliefs are about different stuff). Pure internalism (Descartes/Fodor) makes it hard to explain why "water" refers to H2O specifically. The **Two-Factor** view splits the difference: Reference is external (satisfying the intuition about science/truth), but Psychological Role is internal (satisfying the intuition about rationality/error).

  ### 2. The "Shifting Boundary" You Noticed

  You observed that the line between what is external and what is internal seems to move to protect intuitions. In the literature, this is known as **The Demarcation Problem for Externalism**.

  *   **Natural Kind Terms (e.g., "Water", "Gold"):** Philosophers almost universally agree these are **Broad**. The environment fixes the reference.
  *   **Phenomenal/Functional Terms (e.g., "Wet", "Drinkable"):** Philosophers often treat these as **Narrow**. They describe how the substance *appears* or *functions* for the agent, regardless of its chemical makeup.

  **Why the boundary shifts:**
  You are right that this boundary is flexible. A radical externalist (like Tyler Burge) might argue that even "drinkable" is external, because what counts as drinkable depends on your biological relation to the environment (XYZ might not actually sustain Earth biology). A moderate externalist (like David Chalmers) uses **Two-Dimensional Semantics** to formalize the shift:
  *   **Dimension 1 (Internal):** "Whatever plays the 'water-role' (clear, wet, drinkable)." This is shared by the twins.
  *   **Dimension 2 (External):** "The actual stuff that plays that role here." This is H2O for you, XYZ for the twin.

  When your friend says "drinkable" means the same thing, they are appealing to Dimension 1. When they say "water" means different things, they are appealing to Dimension 2.

  ### 3. How This Differs from Equivocation

  You asked how this differs from plain equivocation (using the same word with two different meanings inconsistently).

  *   **Equivocation** is a fallacy where a word shifts meaning *within* an argument to trick the listener. It is unstructured and erroneous.
  *   **The Two-Factor Split** is a structured theoretical claim that the word *systematically* carries two types of meaning simultaneously.
      *   *Example:* If I say, "Water is H2O, but my twin thinks water is XYZ," I am not equivocating. I am acknowledging that the *reference* (Dimension 2) differs while the *concept* (Dimension 1) remains the same. The theory explicitly predicts this divergence; equivocation hides it.

  ### 4. How This Differs from "Multidimensional Concepts"

  You also asked how this differs from saying concepts are just "multidimensional" (i.e., having many features).

  *   **Multidimensional Concepts:** This implies a list of features (e.g., Water = [clear, liquid, H2O, wet, drinkable]). If it were just multidimensional, then changing *any* feature (like H2O to XYZ) would just change the concept slightly, but it would be the same *kind* of change as changing "clear" to "cloudy."
  *   **The Two-Factor Asymmetry:** This claims the dimensions come from **different sources**.
      *   The "H2O" dimension comes from the **World**.
      *   The "clear/drinkable" dimension comes from the **Head**.
      *   *Crucial Difference:* In a standard multidimensional view, if the world changes, the concept is just "wrong." In the Two-Factor view, if the world changes (Earth to Twin Earth), the *reference* changes, but the *rationality* of the thinker is preserved. This explains why your friend treats the twin as rational (internal dimension intact) but referring to something else (external dimension shifted).

  ### 5. Summary for Your Debate

  If you want to use the precise terminology in your next conversation, you can say:

  > "What we're running into is the **Narrow/Broad Content distinction** within **Two-Factor Semantics**. You're treating 'water' as having **Broad Content** (fixed by the environment), but 'drinkable' as having **Narrow Content** (fixed by internal functional role). The problem is that there's no agreed-upon rule for **where to draw the demarcation line**. If externalism is true, why does it stop at the noun and not apply to the adjectives? It feels like we're using **Two-Dimensional Semantics** to have it both ways: keeping reference external to save science, but keeping psychology internal to save rationality."

  **The Edge of the Thing:**
  The "edge" you are looking for is the distinction between **Natural Kind Terms** (which are typically treated as externally fixed) and **Descriptive/Functional Terms** (which are typically treated as internally fixed). The controversy lies in whether *all* terms are ultimately external (Radical Externalism) or whether this split is a fundamental feature of human cognition (Two-Factor Theory).

  You have essentially rediscovered the motivation for **David Chalmers' 2D Semantics**. He argues exactly what you did: that we need two "dimensions" of meaning to explain why the Twin Earth thought experiment feels compelling in two different ways at once.
