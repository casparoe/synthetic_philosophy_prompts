answer: |-
  # JOINT STATEMENT ON THE STRUCTURE AND STATUS OF AGENT-CENTERED RESTRICTIONS

  **Date:** October 24, 2023
  **Parties:** The Relational Constraint Camp (RCC) and The Threshold Collapse Camp (TCC)
  **Subject:** Adversarial Collaboration regarding the Paradox of Deontology

  ## PREAMBLE

  This document records the results of an adversarial collaboration undertaken to clarify the nature of agent-centered restrictions in normative ethics. Specifically, we address the so-called "paradox of deontology": the contention that a moral theory prohibiting the direct violation of individuals (even to prevent more numerous violations by others) appears to license or require states of affairs containing more total harm than necessary.

  The Relational Constraint Camp (RCC) maintains that this paradox is an artifact of aggregation errors and dissolves when constraints are modeled as pairwise agent-patient relations. The Threshold Collapse Camp (TCC) maintains that the paradox identifies an irreducible tension, implying that non-consequentialist restrictions must either be arbitrarily rigid or admit a threshold where aggregate harm becomes decisive.

  While we remain divided on the resolution, we agree on the following formal and substantive groundwork.

  ## I. POINTS OF AGREEMENT

  1.  **Definition of the Paradox:** Both camps agree that the "paradox" refers to the structural feature of agent-centered restrictions wherein an agent is forbidden from committing a specific type of act (e.g., killing one innocent person) even when performing that act would prevent other agents (or natural causes) from committing tokens of the same type of act on a larger scale (e.g., killing five innocent persons).
  2.  **Formal Structure of Restrictions:** We agree that agent-centered restrictions cannot be fully captured by agent-neutral value functions. Any formal model of these restrictions must account for the moral significance of *who* performs the action, not merely the state of the world that results.
  3.  **Intuitive Data:** Both camps accept as provisional data the strong pre-theoretical intuition that there is a moral difference between directly harming a person and merely allowing harm to befall them, and that this difference retains weight even when the allowed harm is quantitatively greater than the prevented harm.
  4.  **Formal Limitations (No-Go Results):** We acknowledge formal results demonstrating that moral theories incorporating agent-centered restrictions cannot simultaneously satisfy standard conditions of completeness, transitivity, and separability (the principle that the value of a whole is determined solely by the values of its parts). We agree that any viable theory must explicitly reject or modify at least one of these formal conditions.
  5.  **Rejection of Pure Consequentialism:** Both camps agree that a purely agent-neutral maximizing theory fails to capture the specific moral prohibitions against direct violation that motivate this inquiry. The dispute is not between deontology and consequentialism generally, but regarding the internal coherence of the non-consequentialist position.

  ## II. DISAGREEMENTS TABLE

  | Issue | Relational Constraint Camp (RCC) Formulation | Threshold Collapse Camp (TCC) Formulation | Point of Divergence |
  | :--- | :--- | :--- | :--- |
  | **1. The Locus of Constraint** | Moral constraints are properties of **dyadic relations**. A restriction binds Agent A regarding Patient P. It is not a free-floating prohibition on "killing" generally, but a prohibition on "A-killing-P." | Moral constraints are properties of **agency types**. A restriction binds Agent A regarding the *type* of act performed. The tension arises because the agent must weigh their own agency against the total state of the world. | RCC denies the "total state of the world" is the relevant counter-value. TCC insists the total state of the world exerts inevitable normative pressure. |
  | **2. Aggregation of Harm** | Aggregating harms across different agent-patient dyads is a category error. One cannot sum violations occurring in distinct relations to override the sanctity of a single relation. | Aggregation is unavoidable for rational choice. If the moral cost of "allowing" is finite, a sufficient quantity of "allowed" costs must eventually outweigh the moral cost of "doing." | RCC views aggregation as conceptually illicit in this domain. TCC views the refusal to aggregate as irrational rigidity. |
  | **3. The Threshold Question** | There is no threshold. The constraint is categorical relative to the relation. Any apparent "threshold" is actually a shift in the description of the act (e.g., from killing to saving). | There must be a threshold. If no threshold exists, the theory is absurd in extreme cases. If a threshold exists, the theory structurally collapses into consequentialism above that limit. | RCC denies the absurdity charge. TCC denies the collapse charge is fatal, arguing it is the only way to preserve rationality. |
  | **4. Interpretation of "Worse Outcomes"** | A world with more deaths is not necessarily a "worse" moral outcome if the additional deaths result from allowed harms rather than direct violations. Moral value is not monistic. | A world with more deaths is pro tanto worse, regardless of the causal history. The tension exists precisely because deontology acknowledges this while forbidding the minimization of deaths. | RCC denies the "pro tanto worse" claim applies universally. TCC insists on the independent badness of harm states. |

  ## III. CRUCES AND TEST CASES

  We identify two specific sub-questions (cruxes) where resolving the disagreement would significantly shift the dialectic. For each crux, we propose a concrete conceptual test.

  ### Crux 1: The Formalizability of Distributive Asymmetry
  **Question:** Can the asymmetry between "doing" and "allowing" be formalized without implicit reference to aggregate outcomes?
  **The Test Case: *The Distributed Lever Network***
  *Scenario:* Imagine 1,000 separate agents. Each agent stands at a lever. If Agent *i* pulls their lever, they directly kill one specific person (*P_i*). If Agent *i* does *not* pull their lever, a mechanical failure causes five *other* specific people (*Q_i1...Q_i5*) to die. The agents cannot communicate. The deaths of *P* and *Q* groups are causally isolated from one another.
  *   **RCC Prediction:** Every agent is strictly forbidden from pulling the lever. The total result (5,000 deaths vs. 1,000 deaths) is morally secondary because no single agent violates their specific pairwise duty. The "distributive asymmetry" holds perfectly without reference to the total.
  *   **TCC Prediction:** Rational agents must recognize that if the network is viewed as a single moral problem, the aggregate harm (5,000 vs. 1,000) creates a threshold. Either the theory forbids pulling (and is thus irrational in the aggregate) or it permits pulling (admitting a threshold). TCC predicts that intuition will waver at this scale, revealing the hidden threshold.

  ### Crux 2: The Consistency of Total Harm
  **Question:** Is there a possible world-configuration in which satisfying every pairwise relation yields a total harm strictly greater than an alternative where one pairwise relation is violated?
  **The Test Case: *The Institutional Chain***
  *Scenario:* A bureaucracy consists of a chain of 100 officials. Each official has a rule: "Do not sign a document that directly causes harm." If Official *n* refuses to sign, Official *n+1* is forced by protocol to sign a document causing ten times the harm. If Official *n* signs, the harm is minimal, but Official *n* has directly violated the rule. This repeats down the chain.
  *   **RCC Prediction:** Yes, this configuration is possible. Every official refusing to sign satisfies their pairwise duty. The resulting catastrophe is a tragedy, but not a moral failure of the officials. The theory remains consistent because "moral consistency" is defined by adherence to relations, not optimization of states.
  *   **TCC Prediction:** If this configuration yields a catastrophe, the theory is demonstrably defective. TCC argues that a moral theory that guarantees a worse world when a better one is available (via a single violation) fails the basic requirement of practical rationality. TCC predicts that at some link in the chain, the official *must* be permitted to violate the rule to stop the cascade.

  ## IV. ANALYSIS OF VERBAL DISPUTE

  We have examined whether our disagreement is merely verbal, specifically regarding the definitions of "respect for persons" and "minimizing violations."

  1.  **Competing Descriptions?** We conclude this is **not** merely a verbal dispute. The RCC uses "respect for persons" to denote a structural constraint on interaction (a side-constraint). The TCC uses "minimizing violations" to denote a goal state (an objective). These are not competing descriptions of the same feature; they are competing accounts of the *fundamental unit of moral evaluation*.
  2.  **Ambiguity in "Violation":** However, we acknowledge a potential verbal ambiguity regarding the term "violation."
      *   If "violation" means *any* instance of a person being harmed unjustly (regardless of cause), then RCC and TCC agree we should minimize violations, but disagree on whether agents can causally contribute to that minimization.
      *   If "violation" means *an agent's direct transgression of a duty*, then RCC seeks to minimize their own violations, while TCC seeks to minimize total violations in the world.
  3.  **Resolution:** We agree to stipulate that for the purposes of this collaboration, "violation" refers to the **agent's direct transgression**. The substantive disagreement remains: RCC holds that minimizing one's own transgressions is the sole primary duty, whereas TCC holds that minimizing total transgressions (including those of others) exerts independent normative force that must eventually override the primary duty.

  ## SIGNATORIES

  **Representative, Relational Constraint Camp:** ______________________

  **Representative, Threshold Collapse Camp:** ______________________

  **Date:** ______________________
