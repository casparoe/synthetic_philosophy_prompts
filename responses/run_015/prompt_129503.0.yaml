answer: |-
  This is an exceptionally sharp observation. You have identified a friction point that occupies a significant amount of professional headspace in bioethics and legal theory, often without being resolved as neatly as you have described it. The fact that you are seeing this in both clinical directives and informal social pacts suggests you have found a structural feature of how we think about agency over time, not just a quirk of medical law.

  Per your instructions, I will not hand you a bibliography. I will not pretend to know the specific statutes of your jurisdiction regarding the nurse's comment (she is partially right in many common-law jurisdictions, but not universally). Instead, I will treat this as a conceptual problem.

  ### Phase 1: Brainstorming Candidate Concepts

  Before settling on an explanation, here are five ways we might categorize this phenomenon. I will evaluate them as I go, rejecting some to clear the ground.

  **1. The Negative/Positive Rights Distinction**
  *Concept:* This is the idea that I have a strong right to be left alone (negative right) but a weak or non-existent right to be helped (positive right).
  *Verdict:* **Reject.**
  *Why:* As you suspected in your first prompt question, this fails the "phone pact" test. When you ask your friend to take your phone, you are asking them to *do* something (an action), not just leave you alone. If this were purely about negative rights, the "take my phone" pact should be just as weak as the "drag me to practice" pact, because both require your friend to act. The asymmetry persists even when both options require action.

  **2. The Harm Principle (Non-Maleficence vs. Beneficence)**
  *Concept:* In bioethics, the duty to "do no harm" is often seen as stricter than the duty to "do good." Overriding a refusal harms the patient (violates integrity); ignoring a request merely fails to benefit them.
  *Verdict:* **Partial Fit, but ultimately Reject.**
  *Why:* This explains the medical case well. Force-feeding feels like a violation (harm); not tube-feeding feels like a letting-die (omission). However, in the "practice pact," ignoring your request to be dragged out of bed doesn't clearly "harm" you in the moral sense; it just lets you fail your goal. Yet, you feel *less* bound to enforce the practice pact than the phone pact. The "harm" intuition is muddy outside of bodily intrusion.

  **3. Status Quo Bias and Default Rules**
  *Concept:* This comes from behavioral economics and law. Systems have a "default" setting (e.g., in medicine, the default is usually "preserve life"). A refusal fights the default; a request rides with it. We respect things that stop the machine more than things that start it.
  *Verdict:* **Strong Contender (Keep for analysis).**
  *Why:* This is powerful. If the medical default is "treat," a refusal is an active brake. A request is just pressing the gas pedal that was already down. If we flipped the default (e.g., hospice care is the standard), would the asymmetry flip? This needs testing.

  **4. Epistemic Privilege of the "Sober Self"**
  *Concept:* This is a philosophy of action idea. We trust the "cool hour" judgment (past self) over the "hot hour" judgment (present self) only when the present self is clearly compromised (dementia, addiction, 2 a.m. texting).
  *Verdict:* **Reject.**
  *Why:* In both your cases (Mrs. H and Mr. A, plus the phone vs. practice), the "past self" is equally sober and the "present self" is equally compromised (or happy). The *degree* of compromise doesn't change between the refusal and the request, yet the authority changes. The epistemic quality of the instruction is identical; the uptake is not.

  **5. Autonomy as a Veto (The "Shield" vs. "Sword" Theory)**
  *Concept:* This suggests that personal autonomy functions primarily as a shield against interference, not a sword to command resources or labor from others. We view the "self" as a fortress; the past self can lock the gate (refusal), but cannot force the guards to march out (request).
  *Verdict:* **Accept (The Core Mechanism).**
  *Why:* This captures the non-medical cases best. "Take my phone" is locking the gate against your own weakness. "Drag me to practice" is commanding your friend to labor for your improvement. We grant the past self the power to protect the self's boundaries, but hesitate to grant it the power to conscript others (even friends) into enforcing improvement.

  ***

  ### Phase 2: The Considered Answer (The Carving)

  You have identified a genuine phenomenon. In the literature, this is often discussed under the umbrella of **Diachronic Autonomy** (authority of the self over time) and **Ulysses Contracts** (binding one's future self), but the specific *asymmetry* you noticed is less frequently named as a distinct unit.

  I propose we call this **The Asymmetry of Diachronic Constraint.**

  Here is the definition: *The normative principle that a past self possesses strong authority to restrict the options of a future self (and those acting on their behalf), but possesses weak authority to mandate positive interventions for that future self, particularly when the future self appears content.*

  This is not just about rights or harm. It is about the **direction of fit** between the instruction and the agent's duty.
  *   **Refusals (Mrs. H / Phone Pact):** These align with the agent's duty of *restraint*. It is easier for a doctor or friend to *stop* doing something than to *start* doing something. A refusal creates a "stop" sign.
  *   **Requests (Mr. A / Practice Pact):** These align with the agent's duty of *beneficence* or *enforcement*. This requires ongoing labor, risk, and the assumption of responsibility for the outcome.

  The asymmetry exists because we view the "integrity" of the person as something to be defended from violation (which the past self defines), but we view the "good" of the person as something that must be responsive to current experience (which the present self defines). When Mrs. H says "no ventilator," she is defending her integrity. When Mr. A says "yes ventilator," he is requesting a benefit. If current-Mrs. H is happy, violating her integrity seems worse than denying her a benefit.

  ***

  ### Phase 3: Addressing Your Five Analytical Points

  **1. Is this just the asymmetry between a right to refuse and a right to demand?**
  *Analysis:* You were right to doubt this. As we saw in the "phone pact," no legal rights are involved, yet the asymmetry holds.
  *Conclusion:* It is not a *legal* rights asymmetry, but a *moral* one. It is about the **Normative Weight of Negative vs. Positive Claims**. A negative claim ("Do not cross this line") creates a duty for everyone. A positive claim ("Help me cross this line") creates a duty only for specific agents under specific conditions. The past self can impose universal negative duties easily; it struggles to impose specific positive duties.

  **2. Is it the distinction between substituted judgment and best interests?**
  *Analysis:* You are correct to reject this. In both Mrs. H and Mr. A's cases, the staff claims to be using "substituted judgment" (what would they want?).
  *Conclusion:* The switch happens *within* the standard. When the document says "No," substituted judgment is treated as **binding evidence**. When the document says "Yes," substituted judgment is treated as **advisory evidence**, overridden by "best interests" (she looks happy now). This reveals that "Substituted Judgment" is often a rhetorical tool used to validate refusals, but abandoned when requests conflict with current well-being.

  **3. Is it the doing/allowing distinction (act/omission)?**
  *Analysis:* This is the strongest competing explanation. Overriding a refusal is an *act* (inserting the tube). Ignoring a request is an *omission* (not inserting the tube). We generally feel acts are morally heavier than omissions.
  *The Control Case:* Imagine a directive that says, "If I am in this state, **turn off** my music therapy." (Refusal of a positive good). Now imagine one that says, "If I am in this state, **do not stop** my music therapy." (Request for continuation).
  *Verdict:* If the asymmetry persists here (we turn off the music easily if the present self seems sad, but refuse to start it if the present self seems happy), then it is *not* about act/omission. It is about **Constraint vs. Enablement**. I suspect the asymmetry holds: stopping a benefit is easier to justify than starting one, even if both are "acts."

  **4. Is it about error costs and risk-aversion (defaults)?**
  *Analysis:* This is the **Status Quo Bias** candidate. In medicine, the default is "treat." A refusal fights the current. A request flows with it.
  *The Test:* Imagine a jurisdiction where the legal default is "No Treatment" (e.g., strict hospice unless opted in).
  *Prediction:* If the default flips, the asymmetry should weaken or flip. If the default is "No Treatment," then a request for treatment becomes a *refusal of the default*.
  *Reality Check:* Even in "No Treatment" default systems, requests for aggressive care are often scrutinized more heavily than refusals of care. This suggests the asymmetry is deeper than just defaults. It is about the **Irreversibility of Intrusion**. Once a tube is in, it is hard to remove. Once a phone is taken, it is awkward to return. We are more afraid of imposing an intrusion (ignoring a refusal) than withholding an aid (ignoring a request).

  **5. Boundary Cases**
  *   **The Cancellation Clause:** ("If I seem happy, ignore this.")
      *   *Effect:* This dissolves the asymmetry. It gives the *Past Self* the authority to validate the *Present Self*. If Mrs. H wrote this, and she seems happy, the staff can follow the directive *and* honor her current mood. The conflict vanishes. This proves the tension is between Past Authority and Present Experience.
  *   **The Resisting Request:** ("Make me take my pills even when I say no.")
      *   *Effect:* This is the hardest case. This is a **Ulysses Contract**. In psychiatry, these are sometimes honored. In dementia care, rarely. Why? Because we doubt the *competence* of the past self to predict the *nature* of the resistance. If the present self is screaming "No," overriding that feels like violence, even if requested. This suggests the asymmetry has a **Violence Threshold**. Refusals prevent violence; Requests can authorize it. We are skeptical of authorizing violence in advance.
  *   **The Inexperienced Directive:** (Written by someone who has never had the condition.)
      *   *Effect:* This undermines the **Epistemic Authority** of the past self. If the asymmetry persists even here (we honor the refusal but not the request), it proves the asymmetry is about **Protection**, not **Knowledge**. We protect the right to be wrong about one's own death (refusal), but we do not protect the right to be wrong about one's own care (request).

  ***

  ### Phase 4: Terminology Key

  To help you write your paper, here is how you should label these concepts.

  *   **Established Terminology (Safe to use):**
      *   *Advance Directive / Living Will:* Standard legal/medical terms.
      *   *Substituted Judgment vs. Best Interests:* Standard bioethics distinctions.
      *   *Ulysses Contract:* Established term for precommitment strategies (originating from Jon Elster, widely used in philosophy/psychiatry).
      *   *Diachronic Autonomy:* Established philosophical term for autonomy over time.
      *   *Negative vs. Positive Rights:* Standard political philosophy/legal theory.

  *   **Contested/Variable Terminology (Use with caution):**
      *   *The Harm Principle:* In bioethics, "harm" is debated. Does failing to extend life count as harm? Different scholars say different things.
      *   *Default Rules:* In law, this is precise. In moral psychology, it is metaphorical.

  *   **My Coinage / Synthesis (For your specific argument):**
      *   *The Asymmetry of Diachronic Constraint:* I am proposing this phrase for your paper. It is not a standard database term yet. It precisely describes the phenomenon you found: the constraint flows one way (past to future, negative) stronger than the other (past to future, positive).
      *   *The Violence Threshold:* I am using this to describe the limit where a request to be forced (pills) becomes morally unacceptable despite consent.

  ***

  ### Phase 5: What Would Change My Mind? (Falsification)

  A philosophical claim is only as good as its vulnerability to being wrong. Here is where my reasoning is weakest, and what would lead me to conclude this is *not* a single phenomenon.

  **1. The "High-Stakes Request" Counter-Example**
  If you can find cases where a **Request** binds *more* strongly than a **Refusal**, my theory collapses.
  *   *Test Case:* Religious blood transfusions. A Jehovah's Witness refuses blood (Refusal). This is honored strictly. But imagine a religion that *requires* a specific ritual treatment to save a life (Request). Is that honored as strictly?
  *   *Falsification:* If "Do this sacred ritual" is honored as strictly as "Do not give blood," then the asymmetry is not about Constraint vs. Enablement, but about **Sacredness vs. Secularism**.

  **2. The "Competence Flip"**
  My theory assumes the Present Self is less competent (dementia/intoxication).
  *   *Test Case:* If the Present Self is fully competent but temporarily emotional (e.g., a depressed but lucid adult who previously requested life-saving care), do we still ignore the request?
  *   *Falsification:* If we honor the request of a lucid but depressed person because of the past directive, the asymmetry disappears. The asymmetry might just be a proxy for **Current Competence**, not the direction of the instruction.

  **3. The Weak Step in My Reasoning**
  The weakest step is my claim that this applies equally to non-medical pacts (the phone vs. practice). It is possible these are two different phenomena that merely look alike.
  *   *Medical:* Driven by bodily integrity and liability.
  *   *Social:* Driven by friendship norms and effort.
  *   *Risk:* I am unifying them under "Diachronic Constraint." If you find that people *do* feel equally bound to drag you to practice as they do to take your phone, then the medical asymmetry is unique to **bodily intrusion**, and my general theory is wrong.

  ### Final Advice for Your Paper
  You have the seed of a very strong argument. Do not try to solve the legal question (whether the nurse is right). Solve the **moral architecture** question. Why do we *feel* the nurse is right?

  Focus on the idea that we treat the Past Self as the **Guardian of Boundaries** (which is static) but the Present Self as the **Judge of Experience** (which is dynamic). A refusal protects a boundary. A request seeks an experience. When the two conflict, we let the Guardian protect the wall, but we let the Judge decide if the room inside is comfortable.

  That is the carving. Good luck with the paper.
