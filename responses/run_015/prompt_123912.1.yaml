answer: |-
  These are not three separate problems. They are three symptoms of a single structural error in how you framed the search.

  The core error is this: **You treated a discovery process as a selection process.**

  You assumed your preferences (the four conditions) were fixed and known before you began, and that the market was a static pool of options to be filtered. In reality, apartment hunting is a **Bayesian updating process**. You do not know what you value until you see what is available, and you do not know what is available until you look. Your preferences and your perception of the market co-evolve during the search.

  Here is the breakdown of your three problems through that lens, followed by what you should do.

  ### 1. Are these one problem or three?
  They are one problem: **The Exploration/Exploitation Conflict.**

  *   **Problem 1 (The Rule):** Your roommate and brother are arguing past each other because they are optimizing for different phases. Your roommate is optimizing for *exploitation* (execute the plan). Your brother is optimizing for *exploration* (gather data to improve the plan). Your rule was an exploitation rule ("take the first"), but you were still in the exploration phase ("just to see"). You tried to exploit before you finished exploring.
  *   **Problem 2 (Sunlight):** This is not "cheating." It is data acquisition. You learned a new variable in your utility function. The "cheating" feeling comes from the fact that adding a constraint *after* seeing the distribution of options drastically reduces the probability of finding a match. It feels unfair because it changes the odds, but it isn't morally wrong. It is, however, expensive.
  *   **Problem 3 (Drift):** This is the mechanism that broke the rule. Because you didn't separate "learning the market" from "choosing the apartment," your baseline for "reasonable" was anchored to your most recent viewing rather than your actual needs. This made the first apartment look worse in retrospect than it did in the moment.

  **Which one is costing you?**
  **Problem 3 (Drift)** caused **Problem 1 (Breaking the Rule)**, which cost you the apartment and the rent overlap. **Problem 2 (Sunlight)** is currently costing you decision-making speed, which is your scarcest resource right now.

  ### 2. What to do with the week you have left
  You are in a crisis of constraints. You have high time pressure and low inventory certainty. You cannot afford to continue the strategy you started with because the conditions for that strategy (patience, stable inventory) no longer exist.

  **Step 1: Freeze the Criteria.**
  Do not add "morning sun" to the list. You have identified it as a preference, not a dealbreaker. In a normal search, you would weigh this. In a one-week search, new constraints are luxury items you cannot afford. Acknowledge you want it, but classify it as "bonus," not "condition."

  **Step 2: Re-evaluate the Original Four.**
  Look at your original four conditions. Rank them.
  1.  Rent (Hard constraint: budget)
  2.  Private Bath (Hard constraint: sanity)
  3.  Commute (Soft constraint: 35 mins is a threshold, but is 40 fatal?)
  4.  Street/Bus (Soft constraint: noise preference)

  If you do not find a match for all four in the next 72 hours, you must drop the lowest-ranked soft constraint. This is not failure; it is triage.

  **Step 3: Switch from "First Match" to "Best of Remaining."**
  Your "take the first" rule is broken because you have proven you cannot trust your adherence to it under pressure. For this week, switch to a **window strategy**.
  *   View everything available in the next 3 days.
  *   Compare them *only* against each other and your Hard Constraints.
  *   Take the best one that meets the Hard Constraints.
  *   If nothing meets Hard Constraints, relax the lowest Soft Constraint and repeat.

  **Step 4: Prepare a Fallback.**
  If day 6 arrives and you have nothing, you need a bridge. Look for a month-to-month sublet or extended-stay hotel *now*. Knowing you have a safety net reduces the desperation drift (Problem 3) and allows you to make a clearer decision on the permanent lease.

  ### 3. How to set up decisions like this next time
  You asked how to choose the standard before you know what there is to choose between. The answer is: **You don't.**

  You cannot set a precise standard before you have calibrated your eyes to the market. When you set your four conditions three weeks ago, you were guessing. When you found the first apartment, you were still guessing. Now you know more.

  **The Fix: Separate Calibration from Selection.**
  Next time, structure the search in two distinct phases.

  **Phase 1: Calibration (No Intent to Rent)**
  *   Schedule viewings for 5–10 apartments that you *do not intend to apply for*.
  *   Goal: Test your criteria. You might think you care about "no bus route" until you realize every cheap apartment is on a bus route and the noise is fine. You might discover "morning sun" matters more than "updated kitchen."
  *   Outcome: A revised, realistic set of criteria based on market reality, not theoretical desire.

  **Phase 2: Selection (Intent to Rent)**
  *   Now you apply an optimal stopping rule.
  *   **The 37% Rule:** Mathematically, to maximize the chance of picking the best option, you should look at the first 37% of your expected search pool without choosing anything (to set a baseline), then pick the next one that beats the best of the first 37%.
  *   **The Satisficing Rule (Your original attempt):** Set a threshold based on Phase 1 data. Take the first one that meets it. *Crucially:* If you violate this rule, you must restart the clock or accept a penalty. You cannot just "keep looking" without cost.

  **Addressing the Drift (Problem 3)**
  To prevent your judgment from drifting based on the last apartment seen:
  *   **Scorecards:** Create a spreadsheet before you start. Rate every apartment on the same 5 metrics immediately after viewing. Do not rely on memory or "vibe."
  *   **Blind Comparison:** When comparing Apartment A to Apartment B, look at the scores, not the memory of the rooms.
  *   **The "Cooling Off" Period:** Never decide immediately after a viewing. Wait 2 hours. This dampens the contrast effect of the previous viewing.

  ### Summary of Reasoning
  Your framing was confused because you assumed **stability** in a **dynamic** system.
  1.  You assumed your preferences were stable (they weren't; you learned about sunlight).
  2.  You assumed your judgment was stable (it wasn't; it drifted with recent views).
  3.  You assumed the market was stable (it wasn't; the first apartment vanished).

  The cost you paid (rent overlap, lost apartment) was the tuition for learning that **pre-commitment rules only work if you have already calibrated your expectations.** You tried to run a marathon without training, then blamed your pacing strategy when your legs gave out.

  For this week: Triage. Drop the new constraint. Rank the old ones. Secure a fallback.
  For next time: Calibrate first, then commit. Separate learning from choosing.
