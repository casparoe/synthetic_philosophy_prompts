answer: |-
  There is no single established term in film theory, ethics, or historiography that captures this specific triad of intuitions. The nearest candidate is **ethical ventriloquism**, but it diverges from your description in two critical ways: it generally condemns *any* speaking-for the Other (failing to account for the restitution case), and it does not distinguish sharply between third-person commentary and first-person simulation (failing to account for the statesman/aide distinction).

  Since no established term fits, I propose the term **Interiority Trespass**.

  ### Definition
  **Interiority Trespass** is the unauthorized simulation of a historical subject's first-personal conscious experience, specifically where the simulation claims epistemic access to mental states (intentions, confessions, realizations) that are not evidentially anchored in the subject's own surviving record.

  It is distinct from **Interpretive Preemption**. Preemption is a quantitative wrong (drowning out other views); Trespass is a qualitative wrong (crossing a boundary).
  *   **Proof of Distinction:** If Preemption were the driving variable, Case 3 (the public speech restaged as private) would not be invasive. The speech is recorded; the interpretation is not crowded out, merely recontextualized. Yet it feels *more* invasive than plain invention. This proves the intuition tracks **access**, not **volume**.

  ### The Variable: Epistemic Sovereignty
  The intuition tracks **First-Personal Epistemic Sovereignty**. This is the presumption that a person (even a dead one) retains exclusive authority over the attribution of their own internal states.

  *   **Third-Person Commentary (The Aide):** This observes the subject from the outside. It acknowledges the gap between the observer and the subject. It does not claim to *be* the subject.
  *   **First-Person Simulation (The Statesman):** This collapses the gap. It claims to inhabit the subject. When the content is invented, the film claims a knowledge it cannot possess.
  *   **Recontextualized Truth (The Public Speech):** This is the boundary case that proves the rule. The words are true, but the *interiority* is false. A public speech is an external performance; a private confession is an internal state. Moving the former into the slot of the latter is a trespass on the subject's intent, even if the words are accurate.

  ### The Restitution Inversion
  You asked why the enslaved woman's case inverts the rule. The variable is not who controls the archive, but the **Etiology of Silence**.

  *   **Default State (Entropy):** In the statesman's case, the silence is natural (he didn't say it, no one heard it). Filling it is an imposition.
  *   **Exceptional State (Violence):** In the enslaved woman's case, the silence is artificial (her voice was systematically suppressed/destroyed). The archive is not empty due to time, but due to injustice.
  *   **The Mechanism:** In the restitution case, you are not committing Interiority Trespass; you are performing **Archival Repair**. You are not enlisting her voice for *your* reading; you are using your medium to restore the agency that was stolen. The "invention" is treated as a placeholder for a voice that *should* exist but was forcibly removed.

  **Test:** If you applied the same device to a subject whose silence was self-imposed (e.g., a recluse who burned their diaries), the restitution defense would fail, and it would revert to Interiority Trespass.

  ### Boundary Conditions: When the Phenomenon Vanishes
  The intuition of Interiority Trespass dissolves under the following conditions. If these conditions do not hold, the term loses its grip.

  1.  **Mythic Distance:** If the subject is sufficiently remote (e.g., Alexander the Great, King Arthur), they cease to be historical subjects and become cultural symbols. Sovereignty over their interiority is waived by time; they belong to the tradition, not themselves.
  2.  **Explicit Fictionalization:** If the work is marketed as "inspired by" rather than "based on," the contract shifts. The audience suspends the expectation of epistemic fidelity.
  3.  **Self-Mythologizers:** If the subject themselves habitually fictionalized their life (e.g., a politician known for lying about their past), their claim to Epistemic Sovereignty is weakened. You cannot trespass on a boundary the subject themselves erased.
  4.  **Historiographical Convention:** In ancient history (Thucydides, Tacitus), composed speeches were an accepted convention of truth-telling (capturing the *spirit* of the moment). If the audience adopts this contract, Trespass vanishes.

  ### Falsification Conditions
  To argue that **Interiority Trespass** is the wrong concept, or that you have packed two phenomena together, look for the following:

  1.  **The Flattery Test:** If you can find a case where a subject is made to say something invented but deeply flattering in a private setting, and audiences *still* object, then "damage to reputation" is not the shield, and Trespass holds. If audiences *accept* flattering invention but reject critical invention, then the phenomenon is actually **Reputational Guarding**, not Interiority Trespass.
  2.  **The Third-Person Failure:** If you can find a case where third-person commentary (the aide) is treated as *more* invasive than first-person invention, the distinction collapses. This would suggest the variable is **Specific Content**, not **Grammatical Person**.
  3.  **The Documentary Test:** If a documentary uses the same invented voiceover for the enslaved woman and audiences reject it, but accept it in a drama, then the phenomenon is not about the subject's sovereignty, but about **Genre Contract**.

  ### Summary
  The shape of the thing is a boundary around the **private self**.
  *   **Name:** Interiority Trespass.
  *   **Definition:** Claiming first-personal access to a subject's unrecorded mental states.
  *   **Driver:** Epistemic Sovereignty (the right to own one's own mind).
  *   **Exception:** When silence is a result of violence rather than entropy (Archival Repair).
  *   **Proof:** The fact that true words moved from public to private (Case 3) feel more invasive than invented words kept in the third person (Case 1). This proves the wrong is about *access to the interior*, not truth or reputation.
