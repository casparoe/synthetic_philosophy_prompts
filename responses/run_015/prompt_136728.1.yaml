      *(Refining the "Therapy" point)*: Be careful not to dismiss it as *mere* therapy. Stoic/Epicurean consolation literature *is* philosophy. The distinction is blurry. Frame it as "applied philosophy."

      *(Refining the "Uselessness" point)*: This is the crux. Cicero shifts the goalposts from *capacity* to *function*. Acknowledge that.

