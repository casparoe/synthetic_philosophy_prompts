answer: |-
  JUDICAL REVIEW TAXONOMY (LOGICAL SPACE)

  1. **Primary Legitimacy Check:** What is the main constraint on judge's power?
      ├── **A. Democratic Consent** (Votes matter most)
      │    ├── 2. **Mechanism Flaw:** Where is the democratic deficit?
      │    │    ├── **Appointment Only** (Okay if elected reps pick them)
      │    │    ├── **Tenure Only** (Okay if fixed terms, not life)
      │    │    └── **No Sunset/Re-enactment** (Okay if legislature can override)
      │    │         ├── 3. **Scope of Power:** What can they do?
      │    │         │    ├── **Narrow Interpretation Only** (Save the law, don't kill it)
      │    │         │    └── **Strike Down Allowed** (Void the law)
      │    │         │         ├── 4. **Non-Electoral Representativeness:** Does the bench need to mirror the people?
      │    │         │         │    ├── **No** (Merit/Logic only)
      │    │         │         │    ├── **Demographic Mirroring** (Race/Gender balance required)
      │    │         │         │    └── **Deliberative Quality** (Diverse viewpoints, not demographics)
      │    │         │         │         ├── 5. **Override Clause:** Can legislature re-enact over the ruling?
      │    │         │         │         │    ├── **Yes, Simple Majority** -> **Leaf: Weak-Form/Dialogic Review**
      │    │         │         │         │    ├── **Yes, Supermajority** -> **Leaf: Unnamed** (Awkward commitment: Courts check haste, but supermajority ensures deep consensus overrides rights)
      │    │         │         │         │    └── **No, Court Final** -> **Leaf: Unnamed** (Incoherent: Claims democratic deficit matters but denies democratic fix)
      │    │         │         │         └── **No Representativeness Needed**
      │    │         │         │              ├── **Override Yes** -> **Leaf: Parliamentary Supremacy** [NOTE: Indistinguishable from Popular Constitutionalism here]
      │    │         │         │              └── **Override No** -> **Leaf: Unnamed** (Toxic: Unelected veto with no democratic fix and no rep requirement)
      │    │         │    └── **No Interpretation, Only Advisory** -> **Leaf: Unnamed** (Unexplored: Judges as mere consultants)
      │    │    └── **All Mechanisms Flawed** -> **Leaf: Pure Legislative Supremacy**
      │    └── **Epistemic/Rights** (Judges know better/protect minorities)
      │         ├── 2. **Scope:** Is striking down okay?
      │         │    ├── **No, Only Interpret** -> **Leaf: Unnamed** (Unexplored: Epistemic authority without enforcement teeth)
      │         │    └── **Yes, Strike Down**
      │         │         ├── 3. **Sunset Clause:** Should rulings expire unless re-confirmed?
      │         │         │    ├── **Yes** -> **Leaf: Unnamed** (Unexplored: Rights expire? Seems unstable)
      │         │         │    └── **No** -> **Leaf: Strong Judicial Review**
      │         └── **No Epistemic Advantage** -> **Leaf: Legal Realism/Skepticism**
      └── **B. No Constraint** (Judges decide truth)
           ├── 2. **Mechanism:** Does appointment matter?
           │    ├── **Yes** -> **Leaf: Unnamed** (Contradictory: Truth shouldn't depend on who picks)
           │    └── **No** -> **Leaf: Strong Judicial Review (Philosophical)**

  ***

  **LOGIC CHECKS & EMPTY NODES**

  *   **Indistinguishable Pair:** **Popular Constitutionalism** and **Parliamentary Supremacy** both land in the "Override Yes / No Representativeness" box. The tree can't seperate them because both ultimately let elected reps have the final word, even if Popular Constitutionalism argues the "people" speak outside the legislature. You'd need a branch on "Extra-Legislative Mobilization" to split them.
  *   **Empty Branch (Incoherent):** **Strong Review + Democratic Sunset.** If you require a sunset clause on rights rulings, it implies rights are provisional. This box is mostly empty because it undermines the epistemic claim that judges protect fundamental truths.
  *   **Empty Branch (Unexplored):** **Epistemic Authority + Narrow Interpret Only.** Why claim judges know better but forbid them from striking down laws? Maybe a "advisory council" model, but no major theory owns this yet.
  *   **Niche Distinction:** The **Sunset/Re-enactment** branch (Node 5) is rarely standard in textbooks. It separates "dialogic" models (Canada/UK) from pure supremacy, but also catches weird hybrid views where courts pause laws rather than killing them.
  *   **Typo Note:** Noticed "judical" in the header? Keeping it casual.
