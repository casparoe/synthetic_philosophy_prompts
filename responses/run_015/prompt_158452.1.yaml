answer: |-
  The stalemate is structural because it conflates two distinct projects—normative idealization versus social phenomenology—under a single label, so resolution requires fragmenting the concept of responsibility rather than solving the puzzle. The side insisting on control treats moral evaluation as a court of ultimate fairness, where the function of blame is to judge the agent's will in isolation from the world; the side accepting luck treats evaluation as a social practice, where the function of blame is to regulate relationships and respond to harm regardless of intent. Your hypothesis about synchronic versus diachronic focus captures the temporal scope of this divide, but it misses the functional divergence: one project aims to protect the agent's integrity, while the other aims to preserve the community's intelligibility. This is not merely verbal, because both camps claim to describe the truth about morality rather than simply defining terms, nor is it purely substantive regarding causation or evidence, since empirical clarifications do not shift the intuitive weight either side assigns to outcomes. Instead, it is a clash of bedrock intuitions that neither side can argue for without begging the question, as the Control Principle is axiomatic for the former and the reality of reactive attitudes is axiomatic for the latter. Consequently, the debate will remain permanently stalled so long as philosophers seek a unified theory of responsibility that satisfies both intuitions simultaneously. Progress is possible only by adopting a pluralistic model, such as distinguishing attributability (assessment of character, which is luck-free) from accountability (liability to sanction, which is luck-sensitive), thereby acknowledging that "blame" names different practices in different contexts. Unless the field accepts that morality serves incompatible purposes that cannot be reconciled into a single coherent system, the same cases will continue to generate the same irresolvable conflict.
