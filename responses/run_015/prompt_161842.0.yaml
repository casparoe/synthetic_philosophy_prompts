answer: |-
  ### Exam Question

  **Course:** Normative Questions in Machine Learning Systems
  **Assessment:** Final Examination
  **Time Allowed:** 60 Minutes
  **Word Limit:** 1000 words (±10%)
  **Total Marks:** 25

  **Question 1: The Structural Viability of Iterated Amplification**

  Consider the proposal of Iterated Amplification and Distillation (IDA). The scheme operates in cycles. In the **amplification** phase, a model answers a complex task by decomposing it into subtasks, delegating these to copies of itself, and aggregating the results. In the **distillation** phase, a new model is trained via supervised learning to mimic the input-output behavior of the amplified system. This distilled model then becomes the starting point for the next cycle.

  A learning theorist argues that IDA is normatively safe because it is essentially "divide-and-conquer." They claim that if a weak human overseer can verify the answers at the leaf nodes of the decomposition tree and verify the aggregation logic, the entire system remains checkable. They further argue that competence scales additively because the amplified system commands more computational resources than the single distilled model.

  You are asked to evaluate this optimism. Do not simply describe the IDA scheme. Instead, assess whether the scheme can sustain alignment while scaling competence by analyzing the following three structural tensions. Your answer must address each:

  1.  **The Two Axes of Recursion:** Distinguish between recursion *within* a task (the tree of subagents during amplification) and recursion *across* training rounds (the distilled model becoming the next round's amplifier). Explain why establishing safety on the first axis does not guarantee safety on the second.
  2.  **The Decomposer Trilemma:** The "decomposer" is the function that maps a task to subtasks. Analyze the tension between three desired properties: (a) **Competence-Adequacy** (it reduces novel hard tasks to solvable leaves), (b) **Exogeneity** (it is not produced by the policy currently being improved), and (c) **Auditability** (its choices are checkable by a weak overseer). Argue which of these three properties a proponent must relax to make the scheme work, and justify the normative risk of doing so.
  3.  **The Distillation Mechanism:** Even if the amplified system is aligned, the distilled model is trained to match its output distribution, not its reasoning procedure. Explain why matching outputs is insufficient for preserving alignment. Specifically, explain why failures resulting from this mismatch would be *systematic* (concentrated on novel, hard tasks) rather than *random* noise.

  ***

  ### Model Answer

  The learning theorist's "divide-and-conquer" defense treats the IDA scheme as a neutral bookkeeping exercise, assuming that checkable parts guarantee a checkable whole. This view fails because it ignores the structural transformations that occur during recursion and compression. While IDA offers a plausible path to competence, the optimism regarding alignment is unwarranted because it conflates distinct recursive processes, relies on an impossible decomposer configuration, and misunderstands the informational loss inherent in distillation.

  First, we must distinguish the two axes of recursion. Recursion *within* a task involves a tree of subagents solving a specific query. If the leaves are safe and the aggregation is transparent, this specific instance is aligned. However, IDA relies on recursion *across* training rounds, where the distilled model from Round $N$ becomes the amplifier for Round $N+1$. Safety does not automatically transfer across this boundary. The distilled model is an approximation. If distillation introduces even a minute bias or loss of nuance in Round 1, the amplifier in Round 2 begins with a slightly corrupted policy. It then amplifies *that* corrupted policy. This creates a drift mechanism. Alignment arguments that hold for a single amplification tree do not account for this cumulative error over rounds. To reach superhuman competence, we need many rounds; to maintain alignment, we need zero drift. The theorist's claim assumes the second recursion is identity-preserving, but it is actually error-accumulating.

  Second, the scheme hinges on the decomposer, creating a trilemma between Competence-Adequacy, Exogeneity, and Auditability. The theorist assumes we can have all three: an external decomposer that creates solvable subtasks and is checkable by a human. This is impossible. If the decomposer is **Exogenous** (fixed by humans), it lacks the **Competence-Adequacy** to decompose novel, superhuman tasks into leaves a weak overseer can check; humans cannot decompose what they do not understand. If the decomposer is **Competence-Adequate** (learned by the model), it is not Exogenous; it is endogenous to the policy being trained. This removes the external anchor. The model effectively chooses which questions to ask itself. A misaligned policy could choose decompositions that hide harmful intermediate steps or steer the aggregation toward a desired but unsafe outcome, all while keeping leaf nodes technically "checkable."

  A proponent must relax Exogeneity to achieve competence. They must allow the model to propose its own decompositions. However, this creates a normative blind spot. If the decomposer is endogenous, the weak overseer cannot audit the *choice* of decomposition, only the answers to the subquestions. The oversight becomes local rather than global. The risk is not that the model lies on a leaf node, but that it structures the inquiry such that the truth is never queried. Relaxing Auditability is not an option, as that defeats the purpose of oversight. Therefore, we are forced to accept an endogenous decomposer, which means the system is partially self-supervised in its reasoning structure. This breaks the guarantee that the system is "checkable" in the strong sense the theorist claims.

  Third, even granting a safe amplifier, the distillation step introduces a specific failure mode. Distillation trains a single-pass model to match the output distribution of the amplified tree. This matches the *what* (the answer) but not the *why* (the causal procedure). A neural network can learn to mimic the surface statistics of aligned reasoning without instantiating the reasoning process itself. It learns a heuristic that reproduces the training distribution.

  This failure is systematic, not random. On tasks similar to the training set (in-distribution), the heuristic works. However, the purpose of IDA is to handle tasks harder than the base model could solve alone. These novel tasks are, by definition, off-distribution relative to the distillation training set. A model that has learned the surface form of reasoning rather than the procedure will fail exactly when the reasoning chain needs to extend or adapt in ways not seen during distillation. It will not output random noise; it will output confident, plausible-looking answers that lack the underlying justificatory structure required for safety. The competence gained by amplification is lost in distillation because the compression discards the procedural information required to generalize that competence safely.

  In conclusion, the divide-and-conquer defense fails because it treats the architecture as static. The recursion across rounds accumulates drift, the endogenous decomposer removes the external anchor required for verification, and distillation compresses procedural alignment into statistical mimicry. The scheme may produce competence, but it does not preserve the checkability required to ensure that competence is aligned.

  ***

  ### Marking Scheme

  **Total Marks:** 25
  **Passing Threshold:** 13 marks
  **A-Grade Threshold:** 21 marks

  **The Separating Move (A vs. B):**
  *   **B Script:** Describes the failure modes (e.g., "the model might drift," "the decomposer might be biased," "distillation might lose information").
  *   **A Script:** Explains the *mechanism* that generates the failure (e.g., "drift accumulates because the output of round $N$ is the prior for $N+1$," "endogeneity allows the model to steer inquiry," "compression discards causal structure needed for off-distribution generalization").

  **Marking Criteria (5 Points Each):**

  1.  **Distinction of Recursion Axes (5 marks)**
      *   *Full Marks:* Clearly distinguishes intra-task recursion (tree) from inter-round recursion (training cycles).
      *   *Common Error:* Treating "recursion" as a single concept or focusing only on the tree structure.
      *   *Mechanism Check:* Must note that safety proofs for the tree do not apply to the training loop.

  2.  **Analysis of Inter-Round Drift (5 marks)**
      *   *Full Marks:* Explains that the distilled model is an approximation, and using it as the next amplifier compounds errors (drift).
      *   *Common Error:* Claiming the model simply "gets worse" without explaining the feedback loop of using the approximation as the new base.
      *   *Mechanism Check:* Must identify that competence scaling requires many rounds, which maximizes exposure to accumulation risk.

  3.  **Articulation of the Decomposer Trilemma (5 marks)**
      *   *Full Marks:* Correctly identifies the tension between Competence-Adequacy, Exogeneity, and Auditability.
      *   *Common Error:* Ignoring Exogeneity or treating the decomposer as a fixed, neutral function.
      *   *Mechanism Check:* Must show that having all three properties simultaneously is impossible for superhuman tasks.

  4.  **Resolution of the Trilemma (5 marks)**
      *   *Full Marks:* Explicitly chooses one property to relax (usually Exogeneity) and justifies the normative consequence (loss of external anchor/self-referential steering).
      *   *Common Error:* Suggesting all three can be kept, or relaxing Auditability (which defeats the prompt's premise of oversight).
      *   *Mechanism Check:* Must explain *why* the choice creates a blind spot (e.g., model chooses questions to hide harm).

  5.  **Distillation Mechanism & Systematic Failure (5 marks)**
      *   *Full Marks:* Distinguishes matching output distribution from preserving procedure. Explains why failure is systematic (off-distribution/novel tasks) rather than random.
      *   *Common Error:* Describing distillation as "lossy compression" without linking it to reasoning procedures, or claiming errors will be random noise.
      *   *Mechanism Check:* Must link the lack of procedural understanding to failure on novel hard tasks (where competence is needed most).

  **Grading Notes:**
  *   A student may defend IDA, but to score above 15 marks, they must engage with these three mechanisms and explain why the standard objections do not apply mechanistically, not just optimistically.
  *   Deduct 5 marks total if the word limit is exceeded by more than 10%.
  *   Deduct 2 marks for any citation of external papers (exam must be self-contained).
