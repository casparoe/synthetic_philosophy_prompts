answer: |-
  ### Desiderata for an Adequate Account of 'Western Values'

  To determine whether 'Western values' is a coherent philosophical category or a rhetorical boundary-object, an adequate account must satisfy specific explanatory and conceptual criteria. It must explain how the phrase functions in practice without collapsing critical distinctions or imploding under inherent tensions.

  **1. Usage-Case Coverage**
  An account must explain the divergent pragmatic functions of the phrase across three primary contexts:
  *   **Diplomatic Speeches:** The phrase must function as a cohesive identifier for bloc politics (e.g., NATO, G7), implying shared strategic interests grounded in common ethics.
  *   **Immigration Rhetoric:** The phrase must function as a gatekeeping mechanism, defining a cultural baseline required for assimilation or entry.
  *   **Internal Western Self-Critique:** The phrase must allow for internal contradiction, enabling critics to argue that the West has failed its own values (e.g., colonialism vs. liberty).

  **2. Conceptual Distinctions**
  The account must maintain separation between three key pairs that are often conflated:
  *   **Descriptive vs. Normative:** It must distinguish between what Western societies *have historically done* (descriptive) and what they *claim to stand for* (normative).
  *   **Plural vs. Singular:** It must clarify whether 'Western values' refers to a single monolithic system or a family resemblance of competing traditions (e.g., liberalism vs. conservatism).
  *   **Geographic vs. Civilizational:** It must resolve whether the label applies to a region (Europe/North America) or an ideology that could theoretically exist elsewhere (e.g., Australia vs. Argentina).

  **3. Tension Management**
  The account must survive the central paradox of the phrase:
  *   **Universal vs. Particular:** The values are often claimed as universal human rights (applicable to all) while simultaneously serving as particular identity markers (exclusive to us).

  **Jointly Unsatisfiable Pair:**
  The most significant tension lies between **Immigration Rhetoric** and **Diplomatic Universalism**.
  *   *Motivating Case:* To justify strict immigration controls, 'Western values' must be particular, culturally thick, and acquired (not everyone has them). To justify foreign intervention or human rights advocacy, 'Western values' must be universal, abstract, and innate (everyone should have them).
  *   *Flag:* An account that makes the values robust enough to gatekeep immigration (Particular) often renders them too specific to serve as universal diplomatic norms (Universal). Conversely, making them sufficiently universal for diplomacy often dissolves the cultural specificity required for immigration gatekeeping. An adequate account must explain how actors navigate this contradiction without resolving it.

  ### Scoring Three Approaches

  **1. The Civilizational-Inheritance View**
  *   *Logic:* Defines values as historical products of specific traditions (Greek reason, Roman law, Christianity, Enlightenment).
  *   *Score:* Low Fit.
  *   *Analysis:* This view excels at explaining Immigration Rhetoric and the Geographic/Civilizational distinction. However, it fails the Internal Self-Critique test (if values are inherited history, historical failures like slavery implicate the values themselves) and collapses under the Universal/Particular tension (it cannot easily claim universality for historically specific traditions).

  **2. The Liberal-Proceduralist View**
  *   *Logic:* Defines values as abstract political commitments (democracy, rule of law, individual rights) regardless of culture.
  *   *Score:* Medium Fit.
  *   *Analysis:* This view handles Diplomatic Speeches and the Universal claim well. However, it struggles with Immigration Rhetoric (procedures are easy to learn, making them poor cultural gatekeepers) and fails the Descriptive/Normative distinction (it ignores the illiberal history of Western states to focus on ideals).

  **3. The Boundary-Object View (STS)**
  *   *Logic:* Defines the phrase as a flexible concept that maintains coherence across different social worlds precisely because it is vague enough to mean different things to different users.
  *   *Score:* High Fit.
  *   *Analysis:* This view explains all Usage-Cases by treating the contradictions as features, not bugs. It survives the Universal/Particular tension by acknowledging the phrase is *used* to bridge that gap, not to solve it. Its only weakness is ontological deflationism (it denies the values exist as a fixed philosophical category), but this fits the prompt's inquiry into the phrase's coherence.

