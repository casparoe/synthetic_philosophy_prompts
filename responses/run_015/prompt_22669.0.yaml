      *   *Why?* Insurance against guests? (Individual). Offering to the ancestors/spirit of the house? (Holist).
      *   *Let's try:* **The Wall of Names.** A wall in the center of town. Every time someone makes a mistake that costs the community money, they carve a notch. But no one knows who carved which notch.
      *   *Okay, the winner:* **The Shadow Tax.** Every Friday, everyone places 10% of their weekly earnings into a central box. On Monday, the box is opened, and the money is redistributed *randomly*. Not based on need. Just random.
      *   *Why?* Insurance? (Individual). Redistribution of luck? (Holist).
      *   *Actually, let's go with the "Unspoken Greeting".* When two people pass, they must not look each other in the eye. They look at the feet.
      *   *Let's go with the **"Midnight Light"**.* Every night, one house is chosen to keep their porch light on. No one knows how the choice is made. If your light is on, you don't sleep. You watch.
