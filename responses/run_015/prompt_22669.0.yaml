  5.  **Refining the Tension:**
      *   *Individualist moments:* Elias notices people hiding jewelry. He notices the "traders" who swap keys to get into specific houses (gaming the system). He calculates the risk/reward.
      *   *Holist moments:* Elias feels a physical compulsion to follow the rule even when no one is watching. He sees an old woman cry when she can't find her key, not because of loss, but because of "breaking the circle." The town reacts to a breach not as a sum of angry individuals, but as a single organism recoiling.

  6.  **Writing - Focusing on Sensory Details:**
