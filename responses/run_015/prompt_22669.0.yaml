      *   *Wait, I need the newcomer to oscillate.*
      *   *Let's try:* **The Village of Kettering.** The custom is **The Swap.** Every Sunday, everyone leaves their front door key on a hook in the town square. They take a random key. They spend Sunday afternoon in someone else's house.
      *   *Individualist view:* Security through mutual hostage situation. Everyone has leverage.
      *   *Holist view:* Dissolution of private property boundaries, creating a collective consciousness.
      *   *This works.* It's concrete, weird, and allows for both interpretations.

  3.  **Character Development:**
      *   **Newcomer:** Elias Thorne. A data analyst/behavioral economist. He wants to model the utility function. He represents Methodological Individualism.
      *   **Local Contact:** Mara. An elder or just a resident. She doesn't explain it philosophically, she just *does* it. She represents the Holist reality (without lecturing).
      *   **The Custom:** "The Key Turn."

  4.  **Drafting - Scene by Scene:**
