      *   **Scene 2: The Interview.** Elias talks to Mara. Asks *why*. She gives circular answers ("It's how we stay safe," "It's just done"). Elias looks for incentives.
      *   **Scene 3: The Observation (Individualist Lens).** Elias watches people. He sees them checking locks, hiding valuables before leaving. He thinks: *It's mutual assured destruction. If I'm in your house, you won't rob mine.* He builds a model.
      *   **Scene 4: The Participation (Holist Lens).** Elias participates. He feels the weird psychological shift. Entering a stranger's home feels sacred, not strategic. He feels the weight of the "Town" watching. The custom seems to have agency.
      *   **Scene 5: The Crisis/Ambiguity.** A theft occurs? Or a key is lost? Let's say a key is lost. The system doesn't collapse. It absorbs it.
