answer: |-
  ### The Paragraph

  The coffee in the committee room had gone cold, but the minutes of the meeting recorded a unanimous decision: the Kessler Prize goes to Dr. Thorne. Around the table, seven senior scientists agreed on every non-evaluative fact regarding the two finalists. They knew that Dr. Aris, working in a basement lab prone to flooding, had logged fourteen-hour days to salvage data that Thorne, in a well-funded wing, had gathered in standard shifts. They knew Aris's intellectual lift was steeper, her baseline harder, and that by any measure of effort relative to opportunity, her contribution carried more weight. They also knew Thorne's paper had accrued fifteen percent more citations in the eligibility window, solely because his sub-field moves faster, not because his insight was deeper. The rule for the Kessler, printed in the call for nominations and unchanged for a decade, was explicit: "Highest citation count in the eligible period." To award Aris would be to acknowledge the private facts they all knew; to award Thorne was to honor the public rule they had all sworn to uphold. The Chair noted that if they adjusted for Aris's flooding now, they would render the rule opaque for the next cycle, forcing future applicants to guess not just how to do good science, but how to plead their hardships. They voted for Thorne, not because they doubted Aris's desert, but because they valued the legibility of the system over the precision of this single verdict.

  ***

  ### The Two Principles

  **1. The Baseline-Relative Desert Principle**
  "Credit is owed in proportion to the agent's achievement measured against the specific difficulties and opportunity costs she personally overcame; two agents producing identical output deserve unequal credit if the resistance overcome by one was significantly greater than the other."

  **2. The Public-Proxy Allocator Principle**
  "Credit is assigned via the most reliable *publicly verifiable* proxy for achievement, applied consistently across all agents, even when private knowledge confirms the proxy misaligns with true desert in specific cases, provided that maintaining the proxy's rigidity is necessary to preserve the system's ex ante legibility."

  ***

  ### Step-by-Step Walk-Through

  1.  **The Desert Verdict (Aris):** Under the Baseline-Relative Desert Principle, Aris wins. The committee possesses perfect information: they know the flood damage, the extra hours, and the baseline difficulty. They judge that Aris's *agency* was more potent because it operated against higher resistance. Her moral claim to the prize is stronger because the prize is meant to honor what the scientist *made of her opportunities*, and she made more of fewer opportunities.
  2.  **The Allocator Verdict (Thorne):** Under the Public-Proxy Allocator Principle, Thorne wins. The allocator (the council) aims to track desert but recognizes it cannot distribute credit based on private committee knowledge without violating the Publicity Condition. Citations are the chosen proxy because they are objective and verifiable by the candidates *before* they submit.
  3.  **The Divergence:** The divergence arises because the committee *refuses* to use the private data they possess. It is not a measurement failure (Constraint 1); they *know* Aris is more deserving. It is a constraint of rule design (Constraint 2); they have determined that a rule allowing "hardship adjustments" would be impossible to codify without granting the committee dangerous discretion.
  4.  **The Role of Publicity:** The Publicity Condition forces the allocator to ignore the truth in this instance to preserve the rule's integrity for future instances. If they reward Aris, they change the rule from "Highest Citations" to "Highest Citations, unless the committee sympathizes with your lab conditions." Future scientists cannot plan for the latter. Thus, the allocator assigns credit to B to maintain the legibility required for the system to function as an incentive structure.

  ***

  ### The Single Feature and The Variant

  **The Feature:** The *non-codifiability of the baseline.* The divergence exists because "baseline difficulty" (flooding, personal hardship, equipment age) is factually knowable to the committee but cannot be turned into a public rule without introducing unacceptable discretion.

  **The Variant:** Suppose the baseline difficulty *were* easily codified—for example, suppose the rule was "Highest citation count, adjusted by a publicly available index of Lab Funding Levels."
  **The Result:** The divergence collapses. Aris would win. The committee would apply the public adjustment factor, the rule would remain legible, and the allocator would track desert successfully.
  **What This Shows:** The conflict is not between *Merit* and *Incentives* in the abstract, but between *Individual Justice* and *Administrative Legibility*. When the factors that constitute desert (struggle, baseline) are too complex to be written into a public rule, the system must sacrifice the individual case to save the rule.

  ***

  ### The Strongest Attack and The Answer

  **The Attack (Desert Theorist):** "You have sacrificed justice for bureaucracy. If the committee knows Aris deserves the prize, withholding it is a lie. Publicity is merely a tool to serve fairness; when the tool breaks the very fairness it was meant to protect, you must discard the tool. A system that knowingly rewards the less deserving candidate to maintain 'legibility' is not a meritocracy; it is a ritual that has forgotten its purpose."

  **The Answer:** "Legibility is not bureaucracy; it is a precondition for agency. If the rule bends for Aris, it becomes a secret negotiation rather than a public standard. The next applicant cannot know if their hardship will count, so they cannot plan their career around the rules. By holding the line for Thorne, the committee ensures that every future scientist knows exactly what is required, preserving their ability to act as free agents. To save Aris is to blind everyone else."

  ***

  ### Generalization

  This case exposes a structural feature of allocating credit in any large-scale institution, not merely an artefact of this specific prize. Any system that scales beyond face-to-face interaction must rely on proxies (citations, grades, sales figures) because true desert (effort, intent, baseline) is internal and costly to verify. The tension will always exist wherever the cost of codifying the "true" measure of desert exceeds the benefit of precision in a single case. You can lean on this in your closing section: the machinery of credit does not fail when it misses a deserving individual; it fails only when it forgets that it is using a proxy and claims to be the truth.

  ***

  ### Subheading

  **The rule must be blind to the truth to remain visible to the candidates.**
