answer: |-
  Here is a design for a 90-minute experimental simulation titled **"The Novaria Convention."** It is built to your specifications: fixed electorate, varied aggregation rules, and a payoff structure that forces participants to feel the specific pathologies of each system without lecturing them.

  ### I. The Setup (Materials & Room)

  *   **Room:** One large table or clustered seating. A whiteboard is essential.
  *   **Materials:**
      *   20 Identity Cards (sealed envelopes): 8 Red, 6 Blue, 4 Green, 2 Yellow.
      *   20 Ballot Cards (identical): Checkboxes for Red, Blue, Green, Yellow.
      *   5 District Maps (printed on card stock): Labeled District 1 through 5, each with 4 seats marked.
      *   Sticky dots (4 colors) for the whiteboard.
      *   Score sheets (index cards) and pens.
      *   A "Policy Deck": 4 cards labeled Policy 1, 2, 3, 4.
  *   **The Fiction:** The country is **Novaria**. There are four factions (Red, Blue, Green, Yellow). Each faction has one specific Policy they care about above all else (e.g., Red wants Policy 1, Blue wants Policy 2, etc.).

  ### II. The Procedure (90 Minutes)

  #### Phase 1: The Constitutional Convention (0–20 mins)
  *   **The Veil:** Tell the group they are framers of a new constitution. They know the **National Vote Share** of the factions (write on board: Red 40%, Blue 30%, Green 20%, Yellow 10%).
  *   **The Hidden Variable:** Do *not* tell them how these voters are geographically distributed. This is the "cleavage structure" bet. Is the country regionally sorted (favoring FPTP) or ideologically mixed everywhere (favoring PR)?
  *   **The Choice:** Present two aggregation rules without using the standard names:
      *   **Rule A (Single-District):** The country is one single electorate. Seats are awarded strictly proportional to total votes. Government requires >50% seats or a coalition.
      *   **Rule B (Multi-District):** The country is divided into 5 districts of 4 seats each. In each district, the faction with the most votes wins all 4 seats (Winner-Take-All). The national government is formed by the faction with the most *seats*.
  *   **Vote:** Participants vote by show of hands for Rule A or Rule B. Record the result. (Expect a split; scientists often prefer Rule A for precision, engineers often prefer Rule B for decisiveness).

  #### Phase 2: Identity & Voting (20–35 mins)
  *   **Distribution:** Hand out the sealed Identity Cards randomly. (Ensure the 8 Reds, 6 Blues, etc., are distributed).
  *   **Seating (The Rig):** This is the critical experimental control. Do not let them sit randomly.
      *   *To make Rule B bite:* Seat the Reds so they are "cracked." Place 2 Reds in each of the 5 Districts.
      *   Seat the Blues so they are "packed." Place 3 Blues in District 1 & 2, 0 in others.
      *   Seat Greens/Yellows to fill the gaps.
      *   *Result:* In Rule B, Red has the most votes nationally (40%) but wins 0 districts (always 2 vs 3 or 2 vs 2 tie-break). Blue wins 2 districts (8 seats). Green wins 2 districts. Red gets 0 seats.
  *   **The Ballot:** Ask everyone to vote honestly for their faction color. Collect ballots.

  #### Phase 3: Count I – The Chosen Rule (35–50 mins)
  *   **Count:** Tally the ballots according to the rule they voted for in Phase 1.
  *   **Government Formation:**
      *   *If Rule A (PR) won:* No one has 50%. Red (40%) must form a coalition. Allow 5 minutes of bargaining. Red needs Green (20%) to reach 60%. Green demands **Policy 3** as the price of support. Red accepts. Government enacts Policy 3.
      *   *If Rule B (FPTP) won:* Blue has the most seats (despite fewer votes). Blue forms government alone. Blue enacts **Policy 2**.
  *   **Payoff:** Hand out score sheets.
      *   If the enacted Policy matches your Faction's Policy: **10 Points**.
      *   If it is a Coalition Compromise (only in Rule A): **5 Points**.
      *   If it is an Opponent's Policy: **0 Points**.
  *   **Reveal:** Ask participants to announce their scores. (In Rule B, 40% of the room gets 0 points. In Rule A, the largest faction gets only 5 points while a smaller faction gets 10).

  #### Phase 4: Count II – The Counterfactual (50–65 mins)
  *   **The Twist:** Announce that the Constitutional Court has struck down the rule. You must now count the *exact same ballots* using the *other* rule.
  *   **Count:** Run the math for the alternative system on the whiteboard.
      *   *If Rule B was first:* Show that under Rule A, Red would have had 40% of seats and could have governed.
      *   *If Rule A was first:* Show that under Rule B, Red would have won 0 seats due to geographic spread.
  *   **Payoff:** Recalculate scores. Watch the mood shift. The people who were happy are now angry, and vice versa.

  #### Phase 5: Debrief (65–90 mins)
  *   **Mapping:** Connect the feelings to the theory.
      *   *The FPTP Bite:* Ask the Reds who got 0 points in Rule B: "Did you lose because you were unpopular?" (No, you had the most votes). "You lost because you were inefficiently distributed." This is **Cohesion vs. Popularity**.
      *   *The PR Bite:* Ask the Reds who got 5 points in Rule A: "You had the most votes, but you had to let the Greens dictate policy." This is **Decision vs. Mirroring**. The power migrated from the ballot box to the bargaining table.
  *   **The Hidden Cleavage:** Reveal the seating chart. "You chose a rule betting on a geographic cleavage that didn't exist. If you had known the map, would you have changed your vote?"

  ### III. Predicted Failure Modes & Fixes

  **1. The "Hybrid" Objection**
  *   *Failure:* Halfway through, a participant (likely an engineer) will propose a "better" system (e.g., "PR with a 5% threshold" or "Ranked Choice").
  *   *Fix:* "This is a controlled experiment, not a policy workshop. We are isolating variables. We can discuss hybrids in the pub afterwards, but for the data to hold, we must run the binary comparison."

  **2. The "Both Are Rigged" Cynic**
  *   *Failure:* Someone realizes the seating was rigged and declares the simulation invalid.
  *   *Fix:* Acknowledge it immediately. "Exactly. In FPTP, the 'rigging' is often a byproduct of history and geography, not necessarily malicious intent. The system amplifies existing distributions. The question is: do you want a system that amplifies or one that dampens?"

  **3. Coalition Stalemate (PR)**
  *   *Failure:* In the PR scenario, parties refuse to coalition, resulting in no government.
  *   *Fix:* Impose a "Collapse Penalty." If no government forms in 5 minutes, everyone gets 0 points. This incentivizes the "Kingmaker" dynamic you want to demonstrate.

  **4. Dominant Personalities**
  *   *Failure:* One loud participant dictates the coalition bargaining.
  *   *Fix:* Assign "Party Whips." The person holding the most points of a specific color is the only one allowed to speak for that faction during bargaining.

  ### IV. Limitations & The Closing

  **What this design leaves out (The Physicist's Caveat):**
  You must explicitly state these in the debrief, as your group will spot them:
  1.  **Strategic Voting:** In this game, they voted honestly. In reality, FPTP forces tactical voting (voting against the worst rather than for the best). This simulation *understates* the distortion of FPTP because voters didn't adapt.
  2.  **Party Adaptation:** Over decades, parties change their platforms to fit the rules (Duverger's Law). This is a single-shot game; it cannot show how FPTP kills third parties over time.
  3.  **District Magnitude:** We used a extreme Winner-Take-All district. Real-world FPTP often has nuances.
  4.  **Stability:** We showed PR as "messy bargaining." We did not show FPTP's risk of "elective dictatorship" where a government with 40% support makes 100% of the changes.

  **What you must supply:**
  You need to verbally bridge the gap between the game's "Points" and real-world "Legitimacy." Explain that in the real world, 0 points isn't just a lost score; it's alienation, protest, or instability.

  **The Closing Sentence:**
  > "Electoral systems do not discover the will of the people; they construct it, and the choice of rule is a choice about which distortions you prefer to live with."

  ### V. Why This Works for Your Group
  *   **Experimental Control:** By holding the ballots fixed and changing only the counting algorithm, you satisfy the physicist's need for isolation of variables.
  *   **No Jargon:** You avoid "Gerrymandering," "Duverger," or "Coalition" until the debrief, preventing pre-existing political baggage from triggering.
  *   **The "Bite":** The payoff scheme ensures that "winning the vote" does not guarantee "winning the points," forcing them to reconcile the disconnect between popularity and power.
  *   **The Wrinkle:** The hidden seating chart forces them to realize that choosing a voting system is a bet on the *structure* of society, not just the *preferences* of individuals.
