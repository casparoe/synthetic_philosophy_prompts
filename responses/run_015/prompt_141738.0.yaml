answer: |-
  **Brainstorming Notes**

  Okay, let's tear this apart. The practice is standard cost-benefit analysis (CBA) with a discount rate. Why do we discount? 
  1. *Pure Time Preference:* We care less about future people just because they are later. Ramsey called this indefensible. It's discrimination by date of birth. But maybe it reflects uncertainty about whether *we* will care? No, that's not ethical.
  2. *Opportunity Cost/Growth:* Money today grows. Future people will be richer. So a dollar is worth less to them (diminishing marginal utility). This works for consumption. Does it work for lives? Is a life saved in a rich future worth less than a life saved now? That seems wrong. Suffering is suffering. So this justifies discounting *monetary* costs, not *moral* weights of lives.
  3. *Uncertainty/Existence:* Maybe the project won't happen. Maybe the people won't exist. This is an empirical probability, not a moral discount. If there's a 1% chance of extinction per year, expected value drops. But this should be explicit, not hidden in a ethical discount rate.

  The Asymmetry: We discount lives saved in 2200 to ~0. But we spend billions to guard nuclear waste until 12000. Why? 
  *Defense:* We created the waste. Duty not to harm vs. duty to aid. 
  *Objection:* Climate change. We create emissions now that harm people in 2200. Do we discount those harms? Often yes. That contradicts the nuclear logic. If the line is "harm we create," climate should be treated like nuclear waste. It isn't. So the practice is inconsistent.
  *Another Defense:* Institutional responsibility. Agencies have mandates. Nuclear agencies guard waste; health agencies guard now. But this is bureaucratic siloing, not ethical justification.

  The Hinge: If the next 200 years determine if we survive for billions of years, the expected value of the future is astronomical. 
  *Conflict:* Standard discounting (e.g., 5%) makes the future negligible. 
  *Resolution?* Maybe the discount rate *is* the extinction risk. If I discount at 5%, I'm assuming a 5% annual chance of value destruction. 
  *Problem:* If I can *reduce* that risk, I shouldn't discount the benefit of reducing it by the risk itself. That's double counting. If I fix the brakes, I don't say "this fix is worth less because the car might crash anyway." The fix prevents the crash. 
  *Cluelessness:* Maybe we don't know which actions help. But Hinge says some do (existential risk reduction). 
  *Decomposition:* Split the rate into "pure time preference" (should be 0) and "hazard rate" (empirical). If pure time preference is 0, the far future dominates unless hazard is 100%. 

  Verdict intuition: The practice is ethically bankrupt but economically entrenched. It needs to separate economics from ethics. The strongest pull is the distinction between *valuing* future lives less vs. *expecting* them not to exist. The practice conflates them.

  ***

  **The Hidden Ethics of the Rate**

  To reconstruct the implicit theory of the discounting practice, we must disentangle the distinct justifications that are typically conflated into a single percentage figure. The practice presupposes that a benefit occurring later is less valuable than a benefit occurring now, but it remains agnostic on *why* this devaluation occurs. There are four candidate grounds. First, there is *pure time preference*, the view that temporal distance itself diminishes moral significance. This is the claim that a life saved in 2100 is intrinsically less important than a life saved today, simply due to its location in time. Second, there is the *opportunity cost of capital*, an economic argument that resources invested today yield growth, making future generations wealthier. Third, linked to growth, is the *diminishing marginal value of resources*, which suggests that a unit of consumption is worth less to a richer future population than to a poorer present one. Fourth, there is *uncertainty*, encompassing both the probability that the project will fail to materialize and the probability that the beneficiaries will not exist due to extinction or catastrophe.

  The practice is philosophically underdetermined because any specific discount rate, such as three percent, can be derived from infinitely many combinations of these four grounds. A policymaker might choose three percent because they believe future people matter less (pure time preference), or because they expect robust economic growth (diminishing marginal value), or because they assume a steady background risk of societal collapse (uncertainty). The practice strictly requires only that the *expected* value declines; it does not require any specific ethical justification for that decline. However, the tie-breaking consideration lies in the object of evaluation. If the metric is monetary consumption, the growth and diminishing value arguments hold sway. But if the metric is welfare, suffering, or the preservation of life, the growth argument falters—it is not clear that a life is worth less in a wealthy era. The pure time preference argument remains available but ethically precarious, as it implies a form of discrimination based on birth date. The uncertainty argument is empirical, not ethical. Thus, the practice hides a moral choice behind an economic parameter: it allows the user to treat an ethical indifference to the future as if it were a financial calculation about investment returns.

  **The Asymmetry of Harm and Benefit**

  The asymmetry between discounting future benefits and mandating millennial safety for nuclear waste appears inconsistent on its face, yet a principled line can be drawn, though it is narrower than current practice suggests. The strongest defense of the asymmetry rests on the distinction between duties of non-interference and duties of aid. In the case of nuclear waste, the government is managing a hazard it has actively created; the duty is to prevent harm that originates from the state's own actions. In the case of discounted public projects, such as healthcare infrastructure or disease prevention, the government is considering whether to provide a benefit to prevent harms that arise from natural causes or background conditions. On this view, we have a stringent, non-discountable obligation not to poison the future, but only a discretionary, discountable obligation to save the future from natural threats.

  However, this line breaks down when we consider policies that lie between these poles, most notably climate change. Greenhouse gas emissions create a harm in the future analogous to nuclear waste, yet cost-benefit analyses of climate policy often apply standard discount rates to future damages, effectively valuing those future lives at a fraction of present ones. If the principled line is "avoid harms we create," then climate damages should be subject to the same non-discounted strictures as nuclear waste. Current practice often fails this test, applying high discount rates to climate damages while maintaining low-discount containment for nuclear materials. Therefore, the asymmetry is only defensible if restricted to direct, contained hazards like waste repositories. It cannot sustain a general policy of discounting future harms caused by present emissions. Consequently, the asymmetry lets very little of the far future back in; it protects only against specific, engineered threats, leaving the broader future vulnerable to neglected systemic risks that are treated as mere background costs.

  **The Hinge and the Hazard**

  The Hinge Hypothesis posits that the present era is pivotal for the total duration and size of the future lineage. Standard discounting presupposes a fixed hazard rate—a constant probability that the future will end or lose value independent of our actions. If one accepts the Hinge Hypothesis, standard discounting becomes self-defeating. This is because the discount rate is often used as a proxy for the risk that the future will not exist. But if our actions can influence that risk, we cannot discount the value of reducing the risk by the risk itself. To decompose the rate: one part is pure time preference (ethical), and one part is the hazard rate (empirical). Ethical consistency demands pure time preference be zero. The hazard rate should be an explicit probability of extinction, not a blanket discount on value.

  If we separate these, the Hinge considerations dominate every appraisal. If there is even a small chance that a policy reduces the probability of permanent extinction, its expected value is proportional to the entire future stream of value that follows. A standard positive discount rate effectively assumes that the hazard rate is exogenous and unchangeable. But if the Hinge is true, the hazard rate is endogenous; it is something we can lower. Applying a discount rate to existential risk reduction is a category error: it treats the prevention of the crash as less valuable because the crash might happen, ignoring that the prevention is what stops the crash. This decomposition reveals that the practice has been hiding a fatalistic assumption—that the long-run future is out of our hands. If the Hinge is true, that assumption is false. Therefore, accepting the Hinge Hypothesis is incompatible with standard discounting practices for policies affecting existential risk. The only way to reconcile them is to claim "cluelessness"—that we cannot know which actions reduce risk—but even then, a zero pure time preference requires we treat the expected value of the far future as equal to the near future, weighted only by the explicit probability of existence, not an arbitrary temporal decay.

  **Institutional Implications**

  If the presupposed view were replaced by its strongest rival—zero pure time preference, explicit hazard modeling, and recognition of pivotality—institutional practice would undergo radical transformation. The appraisal of nuclear waste would remain largely unchanged, as it is already treated with high caution, but it would be contextualized as merely one subset of long-term risk management rather than a unique exception. Pandemic preparedness and biosecurity would see funding priorities skyrocket; a small reduction in the probability of a civilization-ending pathogen would outweigh vast present costs, as the benefit is the continuation of all future generations. Funding for basic science would be evaluated not just on immediate innovation but on its contribution to long-term resilience and knowledge preservation.

  Regarding discount schedules, a declining or horizon-dependent rate is a coherent halfway house only if it reflects decreasing uncertainty about the hazard rate over time, not a moral compromise. A stable compromise is impossible because the ethical demand (zero pure time preference) and the economic habit (positive discounting) are fundamentally at odds. For current practice to be vindicated, two things would have to be true of the world. First, the marginal utility of consumption must grow fast enough to offset the moral weight of additional lives, implying future people will be so rich that saving their lives is less valuable than increasing present consumption. Second, and more critically, our leverage over the long-term trajectory must be negligible. If we are not in a Hinge era, if the future's duration is determined by forces entirely outside our influence, then discounting the far future is rational because our actions cannot save it. But if we have leverage, the current practice is a mechanism for neglecting the most important consequences of our actions.

  **Verdict**

  The practice is indefensible as it stands, but defensible after repair. The core mechanism of weighing trade-offs is sound, but the parameters currently in use conflate ethical indifference with economic growth and empirical uncertainty. The single consideration that moves me most is the decomposition of the discount rate into pure time preference and hazard risk. Once separated, the ethical case for zero pure time preference is overwhelming; there is no moral justification for caring less about a person simply because they live later. The economic case for discounting consumption does not translate to discounting welfare or existence. By hiding these distinct factors behind a single number, the practice allows policymakers to achieve the appearance of fiscal prudence while enacting a form of moral discrimination against future generations. Repair requires splitting the rate: apply zero pure time preference to welfare and existence, use explicit probabilities for extinction risks, and reserve positive discounting strictly for monetary consumption adjustments based on projected wealth. Without this repair, the practice systematically undervalues the stakes of the Hinge, treating the potential end of the human story as a minor line item in a quarterly budget.
