  This ensures Green is viable initially (beats Mix in Col 3) but doomed later.
  And empirically, if Col plays 3, Green is King (11 pts). Mix is 10.
  So "Mix is bad advice" holds if Col plays 3 often.
  But Logic says "Col won't play 3."
  Tension: Logic vs Empirics.
  This is exactly Req 3.

  Okay, ready to write.
