  ## Session Plan: The Cascade of Elimination

  **Session Title:** Decisions, Bets and Games: The Logic of "Never"
  **Time:** 90 Minutes (including break)
  **Materials:** Printed payoff cards (one per pair), counters (for scoring), dice (for tie-breaks/randomization if needed), whiteboard + markers.
  **Stakes:** The winner of the final round chooses the next month's game topic. A chocolate bar for the pair with the highest cumulative score.

  ---

  ### Part 1: The Handout (Distribute at start)

  *Note: This handout contains no game theory vocabulary. It presents the game as a pure scoring challenge.*

  **GAME 1: THE POINT CHASE**

  **The Setup:**
  You are the **Row Player**. Your opponent is the **Column Player**.
  You have 4 Options: **Red, Blue, Green, Yellow**.
  They have 4 Options: **1, 2, 3, 4**.

  **The Rules:**
  1.  You will play 10 rounds against a partner.
  2.  In each round, both of you choose an option secretly.
  3.  Reveal simultaneously.
  4.  Look up your score on the table below. (Your opponent is trying to *minimize* your score; you are trying to *maximize* it).
  5.  Record your points. Swap partners after 10 rounds.

  **PAYOFF TABLE (Your Points)**

  | | Col 1 | Col 2 | Col 3 | Col 4 |
  | :--- | :---: | :---: | :---: | :---: |
  | **Red** | 10 | 0 | 10 | 2 |
  | **Blue** | 0 | 10 | 10 | 2 |
  | **Green** | 2 | 2 | 11 | 1 |
  | **Yellow** | 4 | 4 | 0 | 1 |

  **Strategy Note:** There is no "correct" way to play. Some options look safe, some look risky. Play to win as many points as possible.

  ---

  ### Part 2: Minute-by-Minute Timeline

  **00:00 – 00:10 | Introduction & Setup**
  *   Welcome the room. Explain the trivial stakes (chocolate/topic choice).
  *   Distribute handouts and counters.
  *   **Crucial Instruction:** "Do not discuss your strategy with your partner during play. Just play."
  *   Split the room into pairs. Designate one person Row, one Column. (If odd number, you play a Row against the House/Whiteboard).

  **00:10 – 00:30 | Game Play (Two Blocks)**
  *   **Block 1 (10 mins):** Play 10 rounds. Record scores.
  *   **Block 2 (10 mins):** Swap partners. Play 10 more rounds.
  *   *Host Role:* Circulate. Watch for people playing Yellow or Green. Note if Column players avoid Option 3.
  *   *Data Collection:* Ask for a show of hands: "Who played Yellow at least once?" "Who played Green?" "Column players, who played Option 3?"

  **00:30 – 00:45 | BREAK**
  *   Let them chat. Put the Payoff Table on the whiteboard (large).

  **00:45 – 01:00 | The "Impossible" Elimination (Req 1 & 3)**
  *   **The Hook:** Ask, "Who played Yellow? Why?" (Usually: "It looked consistent," or "I hoped they'd play 1 or 2").
  *   **The Reveal:** Draw the "Mix" on the board.
      *   "Imagine I don't pick Red or Blue. Imagine I flip a coin. Heads I play Red, Tails I play Blue."
      *   Calculate the Expected Value of this **50/50 Mix** against each Column option.
      *   *Col 1:* (10+0)/2 = **5**. (Yellow gets 4). **Mix Wins.**
      *   *Col 2:* (0+10)/2 = **5**. (Yellow gets 4). **Mix Wins.**
      *   *Col 3:* (10+10)/2 = **10**. (Yellow gets 0). **Mix Wins.**
      *   *Col 4:* (2+2)/2 = **2**. (Yellow gets 1). **Mix Wins.**
  *   **The Point:** "No matter what they play, this coin flip beats Yellow. Yellow is logically dead. It can never be part of a guaranteed-better plan."
  *   **The Twist (Req 3):** "But should you play the Mix?"
      *   Look at the empirical data from the break. "How many Columns played Option 3?"
      *   If anyone played Option 3: "Against Option 3, Green scores 11. The Mix scores 10. Yellow scores 0."
      *   **Conclusion:** "The Mix kills Yellow, but the Mix isn't necessarily the *best* thing to play against *you*. Green might be better if you think they'll play 3. The logic tells you what **not** to do (Yellow), not exactly what **to** do."

  **01:00 – 01:15 | The Cascade (Req 2)**
  *   **Step 1:** Cross out **Yellow** on the board. (It's gone).
  *   **Step 2:** Look at the Column Player's perspective (they want *low* numbers).
      *   Compare **Option 3** vs **Option 4**.
      *   Against Red/Blue/Green (Yellow is gone):
      *   Option 3 gives them: 10, 10, 11.
      *   Option 4 gives them: 2, 2, 1.
      *   "Option 4 is always lower (better for them) than Option 3."
      *   **Cross out Option 3.** "Yellow was the only thing saving Option 3. Once Yellow died, Option 3 died."
  *   **Step 3:** Look back at Row Player (You).
      *   Options left: Red, Blue, Green. Columns left: 1, 2, 4.
      *   Compare **Green** vs the **Mix (Red/Blue)**.
      *   *Col 1:* Green (2) vs Mix (5). Mix Wins.
      *   *Col 2:* Green (2) vs Mix (5). Mix Wins.
      *   *Col 4:* Green (1) vs Mix (2). Mix Wins.
      *   **Cross out Green.** "Green looked strong earlier (11 points!), but that relied on Option 3. Once Option 3 vanished, Green became weak."
  *   **Result:** Only Red and Blue survive. "If we all think logically, we only play Red and Blue. But did anyone here play just Red and Blue?" (Highlight the gap between logic and human play).

  **01:15 – 01:25 | Coda: The Danger of "Weak" Elimination (Req 4)**
  *   Draw two small matrices on the whiteboard.
  *   **Warning:** "We crossed out options that were *strictly* worse. What if an option is only *equal or* worse? (Weak Dominance). The order you cross them out changes the result."
  *   **Matrix A:**
      *   L, R
      *   T: 1, 1
      *   M: 1, 0
      *   B: 0, 1
  *   **Demo:**
      1.  Cross out M (Weakly dominated by T). Then Col crosses out R. Result: **(T, L)**.
      2.  Cross out B (Weakly dominated by T). Then Col crosses out L. Result: **(T, R)**.
  *   **Takeaway:** "With weak dominance, the path matters. With strict dominance (like today), the destination is unique. That's why we were so careful to show Yellow was *strictly* worse."

  **01:25 – 01:30 | Debrief & Close**
  *   Answer the two expected objections (see below).
  *   Award chocolate.
  *   Winner chooses next topic.

  ---

  ### Part 3: Host Notes & Calculations

  **Verification of Eliminations (For your pencil):**

  1.  **Yellow vs Mix (0.5 Red + 0.5 Blue):**
      *   Col 1: $0.5(10) + 0.5(0) = 5$. Yellow = 4. ($5 > 4$)
      *   Col 2: $0.5(0) + 0.5(10) = 5$. Yellow = 4. ($5 > 4$)
      *   Col 3: $0.5(10) + 0.5(10) = 10$. Yellow = 0. ($10 > 0$)
      *   Col 4: $0.5(2) + 0.5(2) = 2$. Yellow = 1. ($2 > 1$)
      *   *Result:* Yellow is Strictly Dominated.

  2.  **Col 3 vs Col 4 (After Yellow removed):**
      *   (Column minimizes Row score)
      *   vs Red: Col 3 (10) > Col 4 (2). (4 is better).
      *   vs Blue: Col 3 (10) > Col 4 (2). (4 is better).
      *   vs Green: Col 3 (11) > Col 4 (1). (4 is better).
      *   *Result:* Col 3 is Strictly Dominated by Col 4.

  3.  **Green vs Mix (After Col 3 removed):**
      *   vs Col 1: Mix (5) > Green (2).
      *   vs Col 2: Mix (5) > Green (2).
      *   vs Col 4: Mix (2) > Green (1).
      *   *Result:* Green is Strictly Dominated.

  **The "Hedge $\neq$ Advice" Arithmetic:**
  *   If the Column player plays **Option 3** (perhaps irrationally, or because they fear Green):
      *   **Green** scores 11.
      *   **The Mix** scores 10.
      *   **Yellow** scores 0.
  *   *Lesson:* Yellow is always trash. But the Mix (which killed Yellow) is not necessarily the King. Green beats the Mix against Option 3. This forces the room to separate "Logical Safety" from "Exploiting Human Error."

  **Debrief Script (Answering Objections):**

  1.  **"Why would I ever randomize? I'm not trying to be unpredictable."**
      *   *Answer:* "You don't have to. The Mix wasn't advice to flip a coin. It was a *measuring stick*. We used the Mix to prove Yellow was broken. You can play Red 100% of the time if you want, as long as you don't play Yellow. The Mix is a tool for analysis, not necessarily a command for action."

  2.  **"Why should I assume the other person is reasoning this way?"**
      *   *Answer:* "You shouldn't. That's why we looked at the empirical data. If you know your opponent plays Option 3 a lot, playing Green is smarter than the Mix. The logic we did today tells you what happens if *everyone* is perfectly rational. In this room, you have to adjust for the fact that people aren't. But knowing the logic stops you from playing Yellow, which is a mistake against *anyone*."

  **What Will Predictably Go Wrong:**

  1.  **Someone plays Yellow and wins.**
      *   *Why:* Their opponent played Option 1 or 2 repeatedly. Yellow (4 pts) beats Blue (0 pts).
      *   *Fix:* Acknowledge it. "Yellow won points because your opponent made a mistake. But Yellow *cannot* win against a rational opponent. You got lucky, not smart. The logic protects you from being exploited, not from getting lucky."
  2.  **Nobody calculates the Mix.**
      *   *Why:* Pub math is hard.
      *   *Fix:* Do the calculation on the whiteboard yourself. Ask them to verify. "Does 5 beat 4? Yes. Does 10 beat 0? Yes." Keep it concrete.
  3.  **The Cascade feels abstract.**
      *   *Why:* Removing options on a board is less visceral than playing.
      *   *Fix:* Physically cross them out with a thick marker. Say "This option is now illegal for a rational player." Make it feel like a rule change.

  **On the 3-Player Stage (Requirement 5):**
  *   **Recommendation:** **Do not attempt this.**
  *   **Reasoning:** Staging a 3-player correlation argument requires establishing that two opponents are coordinating or correlated in a way that breaks the independence assumption of mixed strategies. In a 90-minute pub session, explaining *why* the opponents are correlated (e.g., "Player B and C are friends") introduces social noise that drowns the math. Furthermore, demonstrating the failure of the hedge requires comparing a correlated equilibrium against a Nash equilibrium, which demands a level of bookkeeping (tracking joint probabilities) that will stall the session. The 2-player cascade already delivers the core insight (that logical elimination depends on the structure of options) without the fragility of 3-player dynamics. It is better to state this limitation verbally in the debrief: *"This logic assumes your opponents act independently. If two opponents conspire, the hedge might fail, but that's a different game."*

  ---

  ### Part 4: Whiteboard Coda Matrices (Weak Dominance)

  *Draw these clearly during the last 10 minutes.*

  **Matrix 1 (Order: Row moves first)**
  | | L | R |
  |---|---|---|
  | **T** | 1 | 1 |
  | **M** | 1 | 0 |
  | **B** | 0 | 1 |

  *   **Step 1:** Row deletes **M** (Weakly dominated by T: $1=1, 0<1$).
  *   **Step 2:** Col sees T and B. L gives (1, 0). R gives (1, 1). Col prefers **L** (0 < 1). Delete R.
  *   **Step 3:** Row sees T and B against L. T=1, B=0. Delete B.
  *   **Survivor:** **(T, L)**.

  **Matrix 2 (Order: Row deletes B first)**
  | | L | R |
  |---|---|---|
  | **T** | 1 | 1 |
  | **M** | 1 | 0 |
  | **B** | 0 | 1 |

  *   **Step 1:** Row deletes **B** (Weakly dominated by T: $0<1, 1=1$).
  *   **Step 2:** Col sees T and M. L gives (1, 1). R gives (1, 0). Col prefers **R** (0 < 1). Delete L.
  *   **Step 3:** Row sees T and M against R. T=1, M=0. Delete M.
  *   **Survivor:** **(T, R)**.

  *Warning:* "Notice the Column outcome changed (L vs R) just by changing the order of deletion. This is why we insist on *Strict* Dominance in the main game. Strict dominance never has this problem."
