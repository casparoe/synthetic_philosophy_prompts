answer: |-
  This is an excellent catch, and it identifies a genuine gap in the taxonomy of responsibility. You are right to feel that the existing literature on moral ignorance, moral luck, and presentism describes the *terrain* but does not name the specific *maneuver* you are isolating.

  There is no single, canonical term in the standard literature (e.g., Wallace, Sher, Smith, FitzPatrick) that captures this specific triad of moves (baseline conflation, prevalence dilution, and credit/blame asymmetry). However, the phenomenon is structurally identifiable. It is a specific failure mode of **Historical Contextualism**.

  For the purposes of your dissertation, I recommend framing this as **The Normative Baseline Ambiguity**, with two specific corollaries: **The Prevalence Exculpation Effect** and **The Diachronic Evaluation Asymmetry**.

  Here is how you should carve this concept, distinguish it from its neighbors, and define the conditions for its legitimate use.

  ### 1. The Core Concept: Normative Baseline Ambiguity

  The "man of his time" defense relies on an equivocation between two distinct standards for establishing what an agent *ought* to have known or done.

  *   **Baseline A (Statistical/Descriptive):** What was *typical* for an agent of that class, time, and station? (The sociological baseline).
  *   **Baseline B (Epistemic/Normative):** What was *accessible* or *reasonably expectable* for an agent of that intellect and position to discern? (The philosophical baseline).

  **The Move:** The defender invokes Baseline A to establish excuse ("Everyone did it") while implicitly claiming the authority of Baseline B ("No one *could* have known better").

  **Why it matters:** As you noted, these come apart. In the cases of Jefferson, Columbus, and Churchill, Baseline A (the plantation owner, the conquistador, the imperialist) was deeply implicated in the wrong, while Baseline B (abolitionist tracts, Las Casas, anti-imperialists) was available. The defense works by treating statistical normality as a proxy for epistemic impossibility.

  **Distinction from Neighbors:**
  *   **Vs. Excusable Moral Ignorance (Rosen/FitzPatrick):** The literature on moral ignorance focuses on the *internal* cognitive state of the agent (did they make a reasonable effort to inquire?). Your point is *external* and *comparative*: it targets the *selection of the standard* against which that effort is measured. Rosen asks, "Was the ignorance culpable?" You are asking, "Against which reference class is the culpability of the ignorance being judged?"
  *   **Vs. Circumstantial Moral Luck (Nagel):** Moral luck explains *why* the agent faced the dilemma. It does not justify the *metric* used to evaluate their response to it. Luck is metaphysical; Baseline Ambiguity is methodological.
  *   **Vs. Presentism:** Presentism is the charge of applying current standards unfairly. The Normative Baseline Ambiguity is the *mechanism* by which defenders claim to avoid presentism but actually avoid *accountability*. One can avoid presentism (by using historical standards) and still be guilty of Baseline Ambiguity (by choosing the wrong historical standard).

  ### 2. The Corollary: The Prevalence Exculpation Effect

  This is the phenomenon you identified where blame thins out as wrongdoing becomes structural.

  *   **Definition:** The inverse relationship between the prevalence of a moral violation within a reference class and the ascription of individual blameworthiness to members of that class.
  *   **The Problem:** This creates a **Structural Immunity Paradox**. If a practice is truly systemic (e.g., chattel slavery in 18th-century Virginia), the "man of his time" defense becomes strongest precisely where the moral harm is greatest. It grants a "license to conform" to unjust norms.
  *   **Distinction from Complicity/Diffusion:** In the literature on complicity (e.g., Kutz, Isaacs), shared participation usually *increases* or distributes responsibility. The Prevalence Exculpation Effect *dissolves* it. It treats widespread participation not as evidence of a collective crime, but as evidence of a collective excuse.

  ### 3. The Corollary: The Diachronic Evaluation Asymmetry

  This is the credit/blame imbalance.

  *   **Definition:** The tendency to evaluate historical agents against the *statistical baseline* (Baseline A) when assessing culpability, but against the *epistemic baseline* (Baseline B) when assessing moral credit or achievement.
  *   **The Mechanism:**
      *   **For Blame:** We ask, "Was he typical?" (If yes, excuse).
      *   **For Credit:** We ask, "Was he exceptional?" (If yes, praise).
  *   **Why it's unfair:** It rigs the game. To avoid blame, one must be average. To gain credit, one must be exceptional. This makes moral sainthood the only path to praise, while mediocrity in evil is a path to excuse.

  ### 4. Proposed Terminology for the Dissertation

  Since you need a tight handle for the text, I propose you adopt **"The Normative Baseline Ambiguity"** as the umbrella term.

  When you need to refer to the specific statistical move, use **"The Statistical-Normative Conflation."**

  When discussing the dilution of blame, use **"The Prevalence Exculpation Effect."**

  ### 5. Defining Legitimacy: When does the defense work?

  To make your argument constructive rather than just critical, you need a criterion for when the "man of his time" defense is *valid*. The distinction lies in the **Cost of Moral Attention**.

  The defense is legitimate only when the gap between Baseline A (Statistical) and Baseline B (Epistemic) is caused by **genuine epistemic unavailability**, not **social cost**.

  *   **Legitimate Case:** A 14th-century physician bleeding a patient. The epistemic resources to know germ theory did not exist. The cost of accessing the "truth" was infinite (it was impossible). Here, Statistical Normality tracks Epistemic Possibility.
  *   **Illegitimate Case:** Jefferson reading abolitionist arguments. The epistemic resources existed. The *cost* of accepting them was high (economic loss, social ostracization, cognitive dissonance).
  *   **The Test:** If the agent *could* have accessed the dissenting view without violating the laws of physics or logic, but only by violating social or economic norms, the "man of his time" defense fails. It conflates *social difficulty* with *epistemic impossibility*.

  ### 6. Key Literature to Engage/Contrast

  To situate this in your bibliography, you should explicitly position your argument against/alongside:

  1.  **Cheshire Calhoun, "Responsibility and Reproach" (1989):** She argues that common morality can be wrong and agents can be blameworthy for following it. Your point extends this by analyzing *how* defenders use common morality to shield agents.
  2.  **George Sher, *In Praise of Blame* (2006) & "Who Knew?" (2009):** Sher discusses expectations and reasonable foreseeability. Your work refines what counts as "reasonable" in a historical context.
  3.  **Holly Smith, "Culpable Ignorance" (1983):** She distinguishes between ignorance that is culpable and non-culpable. Your "Baseline Ambiguity" explains how agents manipulate the classification of their ignorance.
  4.  **T.M. Scanlon, *Moral Dimensions* (2008):** Specifically the chapters on blame and historical context.
  5.  **Recent work on "Moral Ecology":** Scholars like **Amia Srinivasan** or **Kate Manne** (though more contemporary) discuss how social structures shape moral perception. Your historical application adds a diachronic dimension to this.

  ### Summary for your Introduction/Chapter

  You might frame it like this:

  > "While the literature on moral ignorance addresses the internal conditions of culpability, it often overlooks the external methodological choice involved in selecting the *normative baseline* for historical judgment. I term this **The Normative Baseline Ambiguity**. It occurs when defenders of historical figures conflate *statistical normality* (what was done) with *epistemic possibility* (what could be known). This conflation generates a **Prevalence Exculpation Effect**, wherein structural wrongdoing immunizes participants from blame, and a **Diachronic Evaluation Asymmetry**, where conformity excuses vice but only deviation credits virtue. I argue that the 'man of his time' defense is legitimate only where the gap between statistical norm and moral truth is a matter of epistemic impossibility, not merely social cost."

  This gives you a precise, defensible conceptual tool that captures the phenomenon you've observed without relying on the vague charge of "presentism."
