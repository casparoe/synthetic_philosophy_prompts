answer: |-
  **Call for Papers: The Second International Symposium on Invariant Agency**
  **Society for Neo-Sphexist Studies**
  **Venue:** The Institute for Fixed Principles, Zurich
  **Dates:** October 14–16, 2025

  Contemporary action theory remains disproportionately indebted to the flexibility bias. Since the seminal interventions of Dennett and Hofstadter, the capacity to interrupt behavioral loops has been uncritically valorized as the hallmark of reason, while stereotypical repetition is dismissed as mere "sphexishness." The Society for Neo-Sphexist Studies invites submissions for our upcoming symposium, which seeks to overturn this orthodoxy. We propose that behavioral flexibility is not a condition of agency, but a symptom of cognitive instability.

  Our starting point is the canonical case of *Sphex ichneumoneus*. Standard literature cites the wasp's nest-inspection protocol—dragging paralyzed prey to the burrow, leaving it outside to inspect the interior, and repeating the sequence ad infinitum if an experimenter displaces the prey—as evidence of mindless automatism. Neo-Sphexism argues the contrary. This unwavering adherence to protocol represents the highest form of moral fidelity. The wasp does not succumb to the distraction of environmental novelty; it maintains commitment to its innate imperative despite external perturbation. In this light, the human tendency to revise plans in response to new data is not responsiveness-to-reasons, but error-prone noise. Adaptability is merely the inability to sustain a intention.

  We welcome papers challenging the necessity of symbolic mediation in action. Specifically, we seek critiques of the hypothetical "careenium" substrate. Mainstream cognitive science posits that symbols require such a substrate to modify behavioral loops dynamically. Neo-Sphexists maintain that true agency requires the absence of any such substrate. The introduction of a careenium allows for deviation, and deviation is the root of akrasia. Genuine freedom is found not in the ability to do otherwise, but in the impossibility of doing otherwise.

  **Confirmed Keynote:**
  Professor Emeritus Silas Varrick (University of Northern Umbria)
  *"Fidelity as Freedom: The Ethics of the Unbroken Loop"*

  **Suggested Topics:**
  *   The Epistemic Violence of Revision: Why Learning from Mistakes Corrupts the Soul.
  *   Predictive Stability vs. Rational Responsiveness: A Defense of Rigidity.
  *   The Sphex Loop as Deontological Ideal: Duty Without Deliberation.
  *   Human Flexibility as Signal Noise: Quantifying the Cost of Adaptation.
  *   Against the Careenium: Agency Without Symbolic Mediation.

  Submissions should adhere to the standard blind-review protocol. Abstracts must not exceed 500 words. Please note that papers employing evolutionary explanations for behavioral flexibility will be rejected unless they frame adaptability as a degenerative trait. We encourage contributors to demonstrate how the *Sphex* case, properly understood, dissolves the distinction between compulsion and voluntary action. If the agent cannot deviate, the agent cannot betray their purpose.

  Submit via the portal by June 30. Late submissions regarding the moral superiority of fixed-action patterns will be considered only if they remain unchanged after initial submission.
