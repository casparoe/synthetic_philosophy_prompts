      *   *Validity:* Mathematically sound for *distance* and *time*.
      *   *Limit vs. Completion:* The limit describes the *boundary* of the process, not necessarily the *completion* of the process in a discrete step sense. In continuous mathematics (real numbers), reaching the limit is defined as being at that point at the limit time. In discrete computation (frames), you never reach the limit exactly without a snap.
      *   *Mapping:*
          *   Sub-races = Frames/Steps.
          *   Meeting Point = Target coordinate.
          *   Sum = Total Distance (or Time).
          *   Limit = The value approached.
