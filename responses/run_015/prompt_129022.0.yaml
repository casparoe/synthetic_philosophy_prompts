      *   *The Break:* The mapping breaks at "Arrival." In math, $t=2$ exists. In a step-by-step procedure, step $\infty$ does not exist.
      *   *Sum vs. Action:* A sum is a static property of a sequence. An action is a dynamic process. Convergence guarantees the *space* exists to finish, not that the *mechanism* can finish.
      *   *Variant 2:* This is Thomson's Lamp. The state is undefined. This proves Friend 2's point. You can't derive a state from an infinite history of flips.
