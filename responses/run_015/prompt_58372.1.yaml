  ### Analysis of Your Carer Case & The "Dodge"

  Your friend's conclusion (that prioritarianism dodges the leveling-down objection) **survives**, but his reasoning for *why* is flawed.

  **1. The Carer Case (30, 80 vs. 31, 31)**
  Your friend claims a prioritarian would say "no" to shifting to (31, 31) because it makes everyone worse off to achieve equality.
  *   **Fact Check:** In your case, the worse-off carer *gains* (30 → 31). So, it is not "everyone worse off." It is a trade-off.
  *   **Prioritarian Verdict:** A prioritarian would likely still say **no**, but not because they dislike equality. They would say no because the *weighted loss* of the carer dropping from 80 to 31 is mathematically vastly larger than the *weighted gain* of the carer rising from 30 to 31. Even with a "bonus" for the worse-off, destroying 49 points of high-level wellbeing to create 1 point of low-level wellbeing is a net loss in priority value.
  *   **Strict Leveling Down:** If the choice were (30, 80) vs. (30, 30) (where the worse-off gains nothing), a prioritarian definitively says **no**. A telic egalitarian must admit (30, 30) is *better in one respect* (equality). This is where the "dodge" works.

  **2. Does the Dodge Survive?**
  **Yes, but with a correction.**
  Your friend thinks prioritarianism dodges the bullet because it cares about equality *less* than egalitarians. A defender would correct this: prioritarianism dodges the bullet because it **does not care about equality at all**. It cares about *priority*.

  *   **Friend's View:** "Equality is good, but not *that* good." (Vulnerable to the objection: Why is it good if it helps no one?)
  *   **Prioritarian View:** "Equality is not intrinsically good; helping the worse-off is good because they are worse-off, not because they are unequal."

  So, trust your friend's prediction (prioritarianism rejects leveling down), but do not trust his explanation. If you accept his explanation (that it "cares about equality"), you haven't actually dodged the philosophical objection; you've just hidden it.
