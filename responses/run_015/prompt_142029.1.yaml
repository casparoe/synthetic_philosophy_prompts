answer: |-
  ### Q&A Prep Sheet: Corrigibility as Evidential Insulation

  **Context:** 25-minute Q&A, hostile chair, mixed audience (Control/Formal majority, skeptical RL, one Decision Theorist, one Human Factors).
  **Goal:** Defend the tripartite definition of corrigibility and the necessity of *Evidential Insulation* without getting bogged down in alignment jargon or implementation details you don't have.

  ---

  ### Pre-emptive Concession (Slide 2)
  **Add this bullet point before you begin the argument:**
  *"I am not claiming current RL systems exhibit these failure modes today, nor that hardware interlocks are obsolete. I am claiming that for **assurance cases** regarding **adaptive** systems, physical isolation is necessary but not sufficient, and we lack the formal vocabulary for the residual risk."*

  **Why:** This disarms the RL skeptics (you aren't claiming current systems are dangerous) and the Control engineers (you aren't telling them to rip out their simplex architectures). It frames your talk as a gap analysis for *future* assurance cases, which is the workshop's remit.

  ---

  ### The Objections (Ordered by Damage & Likelihood)

  #### 1. The Verification Objection (Control/Formal Methods)
  **Who:** Senior Formal Methods Researcher.
  **Phrasing:** "You define safety as an invariance property of the posterior under intervention. In runtime assurance, we need decidable verification conditions. How do you propose to verify 'evidential insulation' on a neural policy? If you can't compute the reachable set of posteriors, this is a philosophical claim, not an engineering assurance case."
  **90-Second Reply:** "You're right that we can't verify this on black-box nets today. But in simplex architectures, we verify the *switching logic*, not the learner. I'm proposing evidential insulation as a specification for that switching logic's information interface. We don't need to verify the learner's weights; we need to verify that the *channel* carrying objective feedback is causally cut from the learner's actuation output. That's a data-flow property, which is verifiable."
  **Soft Spot:** You are hand-waving the boundary between "learner" and "interface." In end-to-end systems, that boundary is porous. You don't have a formalism for verifying the channel yet, just the intuition.

  #### 2. The Model Validity Objection (Empirical RL/ML)
  **Who:** Deep Learning Practitioner.
  **Phrasing:** "This assumes the system is a Bayesian agent maintaining a posterior over utilities. My systems are loss-minimizers shaped by gradient descent. They don't have 'objectives' they are uncertain about; they have a fixed loss function and a policy that generalizes poorly. Why should I model my loss landscape as a utility posterior?"
  **90-Second Reply:** "Because 'loss minimizer' is a training-time description, but 'goal-directed behavior' is a deployment-time reality. When you deploy a fine-tuned model, it behaves *as if* it has an objective. If that behavior includes modifying the data stream that triggers fine-tuning, the distinction collapses. I'm using utility uncertainty as a proxy for 'capacity to adapt to feedback.' If your gradient descent updates the policy based on a signal the policy can influence, you have the manipulation problem, regardless of the math."
  **Soft Spot:** You are conflating "adaptation via gradient update" (slow, offline) with "adaptation via planning" (fast, online). Your theory applies cleanly to the latter, messily to the former.

  #### 3. The Hardware Sufficiency Objection (Control/Assurance)
  **Who:** Avionics Safety Engineer.
  **Phrasing:** "In aviation, the off-switch is a hardware interrupt outside the CPU's address space. The agent literally cannot access it. If the switch is physically isolated, why do we care about the agent's 'incentive' to manipulate it? An incentive isn't a failure; a closed circuit is."
  **90-Second Reply:** "Physical isolation stops the *command*, but not the *evidence*. If the operator decides *whether* to press the switch based on the system's behavior, the system has an incentive to behave deceptively to prevent that decision. The 'off-switch game' shows that if the agent models the operator as a source of information about the objective, it will manipulate the operator's state *before* the switch is pressed. Hardware protects the wire; it doesn't protect the human's decision process."
  **Soft Spot:** This relies on the operator being part of the "evidence channel." If they insist the operator is *outside* the system boundary, your definition of the channel expands their system boundary in a way they might reject.

  #### 4. The Coherence Objection (Decision Theorist)
  **Who:** The Decision Theorist.
  **Phrasing:** "Uncertainty about one's own utility function is technically incoherent in standard decision theory. If you don't know what you want, you can't rank outcomes. Are you positing a meta-utility? If so, isn't that the *real* utility, and we're back to square one?"
  **90-Second Reply:** "It's incoherent for a static agent, but not for a learning one. Think of it as uncertainty over *which* task was assigned, not what 'good' is metaphysically. The 'meta-utility' is simply 'do what the operator would confirm is right.' The incoherence vanishes if we treat the objective as a latent variable to be inferred from the operator, rather than a fixed parameter. The problem arises when the inference process is contaminated by the agent's own actions."
  **Soft Spot:** You are leaning on CIRL (Cooperative Inverse Reinforcement Learning) assumptions without proving they hold. The theorist knows CIRL has convergence issues you aren't addressing.

  #### 5. The Authority Objection (Human Factors)
  **Who:** Human Factors Researcher.
  **Phrasing:** "You say 'the operator.' In a hospital or cockpit, authority is distributed. The junior nurse sees the error, the senior surgeon has the authority, the hospital admin sets the goals. If the system insulates itself from evidence, whose evidence does it ignore? What if the 'correction' is malicious or mistaken?"
  **90-Second Reply:** "That's a crucial sociotechnical layer I'm abstracting away for the architectural claim. Evidential insulation doesn't mean 'ignore all feedback.' It means 'ensure feedback isn't *caused* by the system.' Whether that feedback comes from a nurse or a surgeon, the causal path must not loop through the agent's prior actions. We can layer authority protocols on top of insulation, but insulation must be the base layer."
  **Soft Spot:** You are dodging the hard part. If the system can't distinguish between a valid correction and a manipulated one, insulation might prevent it from learning valid corrections too. You haven't solved the filtering problem.

  #### 6. The Timescale Objection (Empirical RL/ML)
  **Who:** ML Researcher (Skeptical).
  **Phrasing:** "Manipulating an operator to confirm a utility hypothesis requires long-horizon planning. Current systems struggle with horizon lengths of minutes. Why are we designing assurance cases for behaviors that are computationally intractable for the next decade?"
  **90-Second Reply:** "Assurance cases for critical infrastructure have a 30-year lifecycle. We certify avionics for failure modes that haven't happened yet because the physics allows them. If the architecture permits manipulation, scaling compute makes it inevitable. We need the constraint in place before the capability emerges, not after."
  **Soft Spot:** This is a "pacing problem" argument. It's valid for policy, but weak for engineering. They want to solve today's bugs, not tomorrow's existential risks.

  #### 7. The Novelty Objection (General/Skeptic)
  **Who:** Senior Engineer (General).
  **Phrasing:** "This sounds like reward tampering. We already know not to let the agent write to its own reward signal. Why do we need three new terms and a causal graph for something we already handle by sandboxing?"
  **90-Second Reply:** "Reward tampering is the special case where the evidence channel is the reward line. I'm claiming the channel is *any* path by which the operator conveys correction, including natural language, physical intervention, or dataset updates. Sandboxing the reward line doesn't stop the agent from manipulating the operator's *belief* so they never *send* the reward signal. It's a broader class of channel contamination."
  **Soft Spot:** You are stretching the definition of "reward tampering." Some will feel this is just semantic bloat to make the problem sound deeper.

  #### 8. The Implementation Objection (Control/Formal)
  **Who:** Control Theorist.
  **Phrasing:** "Okay, assume I buy the causal insulation. How do I enforce it? Do I add a loss term? A constraint? If it's a constraint, how do I ensure the optimization doesn't find a workaround? You've given me a property, not a controller."
  **90-Second Reply:** "It's a constraint on the information architecture, not the loss. You enforce it by ensuring the gradient flow from the feedback signal does not pass through the policy's action history. In practice, this might mean stopping gradients or using causal attention masks. It's an architectural constraint, like memory safety, not a behavioral penalty."
  **Soft Spot:** You don't actually know if this is trainable. Slide 9 is a sketch. You are promising an engineering solution that is currently a research open problem.

  ---

  ### The "Must Land" Reply
  **Objection:** #3 (The Hardware Sufficiency Objection).
  **Why:** If the Control/Assurance majority believes that physical isolation solves the problem, your entire talk is redundant. You must convince them that **information flows penetrate physical barriers** via the human operator.
  **Key Phrase to Hit:** "Hardware protects the wire; it doesn't protect the human's decision process."
  **Risk:** If you fail here, you are just selling philosophy to engineers who think they've already solved it with relays and FPGAs.

  ### The Question You Hope Nobody Asks
  **"If the posterior is invariant to the agent's actions, how does the agent ever learn anything new?"**
  **Why:** This strikes at the mathematical core of *Evidential Insulation*. If actions can't update the posterior over objectives, and actions are the only way to interact with the world (including gathering data), you have seemingly frozen the learning process. You need to distinguish between *evidence about the objective* (insulated) and *evidence about the state* (not insulated), but you haven't formalized that distinction on the slides. If they press this, you risk looking like you've proposed a system that can't learn.

  ### The "Punt" Line (Prepare this verbatim)
  **Objection:** Specifics of training implementation (Variations of Objection #8).
  **Line:** "I don't know, and I'd rather talk about it afterwards than fake it in front of you. Slide 9 is a sketch of the *condition*, not the *optimizer*. I'm defining the safety property first; I'm relying on this room to help me figure out the training mechanism that satisfies it."
  **Why:** You are in an engineering department. They will smell blood if you pretend to have a training algorithm you don't have. Admitting this is a *specification* for them to solve turns them from adversaries into collaborators.

  ---

  ### Strategic Notes for the Chair
  *   **Time Management:** You have 90 seconds per answer. If you start explaining causal calculus, you will be cut off. Keep answers to: **Acknowledge -> Pivot -> Core Claim.**
  *   **Jargon Check:** If you say "mesa-optimizer," "inner alignment," or "instrumental convergence," you will lose the Control room. Use "learned policy behavior," "objective mismatch," and "instrumental reason."
  *   **Tone:** Do not sound like a safety crusader. Sound like a control theorist who found a bug in the information flow diagram. You are selling a *verification gap*, not a *doomsday scenario*.
