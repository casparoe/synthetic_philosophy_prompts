answer: |-
  # Taxonomy of the Integrity Objection: A Decision Tree

  This tree sorts positions based on substantive commitments regarding moral psychology and justification. It avoids technical labels (e.g., "deontology," "consequentialism") in the branching questions to allow students to locate their own intuitions before seeing which philosophical camp they inhabit.

  ### **ROOT: The Nature of the Error**
  **Q1: When an agent saves their spouse, is the "one thought too many" a problem with the *mental process* (thinking about duty ruins the love) or the *retrospective account* (citing duty misdescribes the bond)?**

  *   **A. The Mental Process:** Yes, consciously consulting a moral principle *during* the decision corrupts the motive. The thought itself is alienating.
      *   *(Go to Branch 2)*
  *   **B. The Retrospective Account:** No, the agent can think about duty, but claiming that duty was the *primary motive* misdescribes the relationship. The problem is philosophical attribution, not psychology.
      *   *(Go to Leaf: The Moderate Defender)*

  ---

  ### **BRANCH 2: The Scope of Protection**
  **Q2: Does this prohibition on moral calculation apply only to intimate relationships (spouses, children), or does it also protect professional roles (judges, doctors triaging patients)?**

  *   **A. Intimate Only:** Calculation is fine for public roles (judges *should* weigh rules), but destructive in private life.
      *   *(Go to Branch 3)*
  *   **B. Universal Scope:** Calculation is alienating in *any* context where deep commitment is required, including professional identities.
      *   *(Go to Leaf: The Strict Williamsian)*
  *   **C. Professional Only:** (Rare) Private love is irrational anyway; only professional integrity requires protection from calculation.
      *   *(Go to Leaf: The Bureaucratic Formalist)*

  ---

  ### **BRANCH 3: The Source of the Rule**
  **Q3: Why do we prohibit calculation in private life? Is it because love has intrinsic value independent of outcomes, or because cultivating "non-calculative love" happens to produce better societal results overall?**

  *   **A. Intrinsic Value:** Love is a "ground project" that defines the self; justifying it by outcomes destroys it.
      *   *(Go to Leaf: The Integrity Absolutist)*
  *   **B. Better Outcomes:** We should cultivate direct love *because* a world where people love directly works better than a world where everyone calculates.
      *   *(Go to Leaf: The Two-Level Utilitarian)*
  *   **C. Structural Split:** Private life follows one logic (care), public life follows another (justice), and never the twain shall meet.
      *   *(Go to Leaf: The Institutional Separationist)*

  ---

  ### **LEAVES: Positions & Awkward Commitments**

  #### **1. The Moderate Defender** (From Root Q1-B)
  *   **View:** The agent can run the calculus, but the *justification* rests on the relationship. The objection is merely about accurate moral psychology.
  *   **Most Awkward Commitment:** Must explain why the calculus doesn't *actually* crowd out the love in practice, even if it's theoretically permissible. Risks making love instrumental by stealth.

  #### **2. The Strict Williamsian** (From Branch 2-B)
  *   **View:** Any appeal to a substitutable justification (even "one ought to save one's spouse") corrupts the attachment. Applies to any deep commitment, including some professional vocations.
  *   **Most Awkward Commitment:** Leaves the agent unable to morally justify preferring their spouse over a stranger in a conflict case. Risks making integrity incompatible with morality.

  #### **3. The Bureaucratic Formalist** (From Branch 2-C)
  *   **View:** Private preferences are morally irrelevant noise. Integrity is only at stake when institutional rules are compromised by personal calculation.
  *   **Most Awkward Commitment:** Treats personal relationships as amoral or pre-moral. Implies a judge saving their own child from drowning is acting unethically if they bypass triage protocol.

  #### **4. The Integrity Absolutist (Particularist leanings)** (From Branch 3-A)
  *   **View:** Reasons are holistic. The fact "she is my wife" is a reason only within the context of the marriage, not an instance of a general rule.
  *   **Most Awkward Commitment:** Lacks guidance for when ground projects conflict (e.g., save spouse or save five strangers?). Risks moral ineffability—you know it when you see it, but can't argue it.

  #### **5. The Two-Level Utilitarian** (From Branch 3-B)
  *   **View:** At the "intuitive level," act on love. At the "critical level," cultivate that love because it maximizes utility. The calculation is pushed upstairs.
  *   **Most Awkward Commitment:** Requires a degree of self-deception or compartmentalization. The "critical" level still views the spouse as a vessel for utility, which Williams argues is the very corruption we sought to avoid.

  #### **6. The Institutional Separationist** (From Branch 3-C)
  *   **View:** Distinct spheres of morality. Private sphere = partiality permitted/required. Public sphere = impartiality required.
  *   **Most Awkward Commitment:** **FRAGMENTED AGENCY.** The agent must switch moral "operating systems" between home and work. Risks schizophrenia: How can the same person hold two incommensurable standards of value?

  ---

  ### **⚠️ FLAGGED COLLAPSE: The Institutional Node**

  **The Problem:** Distinguishing **The Two-Level Utilitarian (Leaf 5)** from **The Institutional Separationist (Leaf 6)**.

  *   **The Collapse:** If the Separationist justifies the *existence* of the separate spheres by claiming "society works best when we separate them," they have secretly become a Two-Level Utilitarian.
  *   **The Test:** Ask the Separationist: *"Why do we keep these spheres separate?"*
      *   If they answer: *"Because it maximizes overall well-being,"* → **They are a Two-Level Utilitarian.**
      *   If they answer: *"Because personal love has value that utility cannot measure,"* → **They are an Integrity Absolutist (Leaf 4) with a domain restriction.**
  *   **Seminar Note:** Many students will claim to be Separationists but will collapse into Two-Level Utilitarianism when pressed on the *justification* for the separation. The tree cannot separate them unless the agent commits to the *source* of the separation's value (Instrumental vs. Intrinsic).

  ---

  ### **How to Use This in Seminar**
  1.  **Read Q1 aloud.** Ask for a show of hands for A vs. B.
  2.  **Follow the path.** As you move down the branches, ask students if they want to exit at a Leaf or continue.
  3.  **Test the Collapse.** When you reach Leaf 5 and Leaf 6, ask the class to propose a case where the Two-Level Utilitarian and the Separationist would give *different* advice. If they can't, discuss whether the distinction is merely rhetorical.
  4.  **Focus on Awkwardness.** Don't ask which view is "true." Ask which "Awkward Commitment" the class is most willing to swallow.
