  ### First, the scenario

  Elara stands in a kitchen, facing a blank wall. She wears lightweight AR glasses. On the wall, a red apple appears. It is perfectly round, shaded, and occludes background objects correctly. Unbeknownst to her, a hidden high-speed camera scans the actual apple sitting on a counter behind her, feeding data to the glasses which render the image on the wall. The rendering is lossless and latency-free. If the apple moves, the image moves. If the apple is removed, the image vanishes. The light entering Elara's eyes originates from the glasses' projectors, not the apple's surface. Her belief that an apple is present is true. Her visual experience is phenomenally indistinguishable from direct viewing. The reliability of this setup matches normal vision across nearby possible worlds.

  Fixed: Phenomenal character, truth of content, reliability, and total evidence.
  Varied: The physical source of the photons stimulating the retina.

  ### Second, the fork

  If relational disjunctivism classifies this as perception, the required relation to the object is merely counterfactual dependence, not direct presence. This concedes that the "constitutive" link is thin enough to include digital mediation, collapsing the view into a sophisticated reliabilism where the object's actual presence is irrelevant so long as information flows reliably. If classified as non-perception, the epistemic asymmetry motivating the view dissolves. The subject possesses a true belief grounded in a reliable, law-like connection to the fact, yet is denied the perceptual status that supposedly grants immediate knowledge. The disjunctivist must explain why the subject lacks perceptual access to the fact despite the fact determining the experience without error or coincidence.

  ### Third, verdicts from two other positions

  The common-factor theorist says the internal state is identical to a hallucination, but the external condition is satisfied. They classify this as perception. Their bill: they must accept that "causal condition" includes complex computational mediation, potentially blurring the line between seeing and inferring from data. The epistemological disjunctivist grants the common factor but argues warrant differs. They struggle here: if warrant requires the fact to be manifest, is it manifest via screen? If yes, why isn't it perception? If no, why does the subject know? Their bill: they must posit a brute distinction between "manifestation" and "reliable indication" that tracks technology rather than epistemic access.

  ### Fourth, structural feature

  The work is done by *non-standard transduction*. The object determines the experience via information transfer, but not via energy transfer from the object's surface to the eye. The weight lies on the distinction between the *source of information* (the apple) and the *source of stimulation* (the projector). This isolates the requirement for direct energy propagation from the requirement for informational fidelity, forcing the theory to choose which physical relation constitutes "presence."

  ### Fifth, ablation variants

  Variant A (mismatch): The screen shows a pear while the apple remains. All positions classify this as error/hallucination. This confirms the original case was not merely coincidental veridical hallucination; the law-like connection mattered. Variant B (transparent): The glasses are removed, and Elara looks directly at the apple. All classify this as perception. This confirms the only variable was the mediation. Honest report: Variant A shows the case is not just veridical hallucination in new clothes, because the match here is nomic, not coincidental. The pressure survives because the disjunctivist cannot appeal to coincidence to dismiss the case.

  ### Sixth, steelman reply

  The critic replies that perception requires the object to *present itself*, not a representation generated by a device. Digital mediation interposes a representation, breaking the constitutive link regardless of reliability. This is a retreat to a brute intuition about "natural" versus "artificial" channels. The crux is whether perceptual presence is a metaphysical status of the object or a functional status of the information channel. If the former, the view risks obscurity; if the latter, it admits the counterfactual dependence is what mattered all along.

  ### Seventh, constraints checklist

  1. One paragraph, <150 words: Yes (138 words).
  2. Realistic tech: Yes (AR, cameras).
  3. Variable isolated: Yes (photons/source).
  4. No verdict in scenario: Yes.
  5. Genuine fork: Yes.
  Verdict: The case successfully isolates transduction from information to pressure the relation.
