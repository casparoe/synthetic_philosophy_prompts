answer: |-
  Your knob does not dissolve the dispute; it relocates it. You have correctly identified the mathematical mechanism underlying the ergodicity economics argument (popularized by Ole Peters): the transition from time-average growth (geometric) to ensemble-average growth (arithmetic) is indeed a function of parallelism ($n$) and rebalancing frequency ($\tau$). The math here is settled; the limit theorems are not in contention.

  However, the standoff survives because the disagreement shifts from "Which formula is correct?" to "What are the values of $n$ and $\tau$ for a real-world agent?" This is no longer a debate about probability theory, but a **structural-factual** disagreement about the topology of risk in the actual environment. The expected-value camp implicitly assumes $n$ is large and $\tau$ is short because they model the agent as a node in a liquid, diversified capital network where ruin is local but wealth is transferable. The geometric-rationality camp implicitly assumes $n \approx 1$ and $\tau \to \infty$ because they model the agent as a singular trajectory facing systemic correlation and friction-heavy wealth transfer.

  What survives the knob is the difficulty of measuring these latent parameters. There is no consensus on the "effective ensemble size" of a human life, a corporation, or a civilization, nor on the friction cost of merging/splitting funds across time (succession) versus space (markets). Furthermore, there is a boundary problem: defining where the "agent" ends and the "ensemble" begins is partly empirical (transfer mechanisms) and partly normative (moral weight of successors), but in the context of betting strategy, it is argued as a factual claim about market permeability and correlation structures during tail events.

  Progress will not come from new theorems about the gamble itself, nor from semantic clarifications of "rationality." It requires treating the agent's environment as an empirical object. We need to quantify the correlation structure of "independent" bets during crises and the actual friction of wealth transfer across successors to determine where reality sits on your $\tau$-$n$ plane.

  \answer{structural-factual}
  Empirical measurement of effective risk-pooling scale and correlation structures in the agent's actual environment.
