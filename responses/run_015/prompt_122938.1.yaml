  *   **Forecaster 3 (0.1 on B, 0.5 on C):**
      *   Error: $0.1^2 + 0.5^2 = 0.01 + 0.25 = \mathbf{0.26}$

  **Brier Ranking (Best to Worst):**
  1.  **Forecaster 1** (Lowest Error: 0.18)
  2.  **Forecaster 3** (Middle Error: 0.26)
  3.  **Forecaster 2** (Highest Error: 0.36)

  **Why?** The Brier Score penalizes *confidence in falsehoods*. Forecaster 2 was very confident (0.6) that 25–29 would happen. Forecaster 1 was modestly confident (0.3) in both falsehoods. Even though Forecaster 2 was "closer" to the truth (25–29 is nearer to 20–24 than 100+ is), the Brier Score doesn't measure semantic distance; it measures probabilistic calibration. Forecaster 2 was more wrong about their own uncertainty.

