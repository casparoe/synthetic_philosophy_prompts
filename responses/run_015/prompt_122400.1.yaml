prompt: |-
  In discussions of epistemic modesty and expert judgment—particularly among forecasting theorists and philosophers of rationality—a recurring analogy compares the inside view to being an actor performing a role with access only to her own lines and immediate stage directions, while comparing the outside view to being the director who sees the production's place in theatrical history: its genre conventions, its base-rate success with audiences, and the performer's track record in similar roles. The analogy is often used to license a normative conclusion: that rational belief-formation requires the agent to "direct herself" by giving decisive weight to statistical information about her reasoning-class, rather than trusting the internal coherence of her present belief-set.

  I want this analogy pressed well beyond its usual deployment. Please provide a precise correspondence table: what in the epistemic domain maps onto the actor's first-person knowledge, the stage directions, the director's historical database, the genre taxonomy, the act of self-direction, and the audience's response? Then identify the fractures that matter specifically for the argument about modesty: does the director's perspective remain available to the actor without disrupting the performance she is evaluating? Is the "genre" of one's reasoning determinable without circular reliance on inside-view judgments? And does the fact that in forecasting—unlike theater—the "script" is not authored in advance undermine the very distinction between performing a part and assessing it?

  Crucially, assess whether the normative conclusion—that epistemic modesty requires privileging base-rate data over narrative coherence—survives once these disanalogies are explicit, or whether the analogy was carrying the entire argumentative load. If you think a different analogy better captures the relation between first-person reasoning and statistical self-assessment without these fractures, propose it briefly.

  Please organize your response in two parts. First, a prose audit addressing the mapping, the critical disanalogies, and the survival of the conclusion. Second, a structured summary as a JSON object with exactly these fields: "correspondence_table" (an array of objects with keys "source_domain", "target_domain", "mapping_quality"), "critical_disanalogies" (an array of objects with keys "location", "normative_consequence"), "verdict_on_analogy" (string), "alternative_analogy_proposed" (string or null), and "bottom_line_for_epistemic_modesty" (string).
