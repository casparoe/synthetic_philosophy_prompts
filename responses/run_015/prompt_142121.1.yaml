      *   *Drafting Bottom Line:* Theo wins the debate on the specific bill because he successfully shifts the burden of proof regarding norm erosion, though Mara lands significant blows against a naive harm principle by highlighting law's expressive function and the fragility of social norms.

      *   *Drafting Move Analysis:*
