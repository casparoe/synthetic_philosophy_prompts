      *   *Revision on Bottom Line:* Needs to be definitive. "Theo wins the substantive argument regarding the bill because he successfully exposes the unfalsifiable nature of Mara's precautionary claims, although Mara correctly identifies genuine limitations in a rigid harm principle concerning law's expressive function."

      *   *Revision on Move 2:* Theo's coordination point is actually a bit weak philosophically (criminal law isn't just coordination), but effective here. I should note that.
