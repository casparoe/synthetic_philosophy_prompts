      *   **Format:** Lead with the bottom line in the first sentence. Then give reasoning move-by-move. No preamble, no restating the question. British English.
      *   **Content:** Evaluate six specific moves (3 each). Identify which land, which are weak/question-begging, where each is right about something the other sidesteps. Conclude who is more right overall and what both are missing.
      *   **Tone:** Analytical, philosophical, decisive but nuanced.

  2.  **Analyze the Debate Moves:**

      *   **Move 1 (Mara):** "No victim, no crime" is insufficient. Law already punishes victimless wrongs (animal cruelty, corpses, incest, environment). Society entitled to protect shared moral environment.
          *   *Strengths:* Correctly identifies that legal moralism exists in practice (Devlin vs. Hart). Challenges the pure harm principle.
          *   *Weaknesses:* Equates different types of "victimless" crimes. Animal cruelty/environment often have sentient victims or public goods aspects. Incest is often banned due to genetic harm or coercion risks, though sometimes purely moral.
          *   *Verdict:* Strong opening salvo, exposes inconsistency in strict harm principles.

      *   **Move 2 (Theo):** Hart distinction: cooperative framework rules vs. majority disgust. Coordination audit: criminalise only where compliance depends on others (driving, contracts). Self-regarding sex fails audit. Animal cruelty/pollution recast as harm.
          *   *Strengths:* Refines Harm Principle (Feinberg/Hart). Distinguishes public goods from private morality.
          *   *Weaknesses:* The "coordination audit" is too narrow for criminal law (murder isn't a coordination problem in the driving sense). Recasting animal cruelty as harm is plausible but stretches "harm to identifiable present people" for environmental offences.
          *   *Verdict:* Strong theoretical grounding, but the coordination test is too specific to cover all legitimate criminal law.

      *   **Move 3 (Mara):** Coordination audit is useless. Moral norms rely on mutual expectations. Decay is hidden until too late (antibiotic resistance analogy). Precautionary principle needed.
          *   *Strengths:* Highlights the invisible nature of norm erosion. Good analogy for social capital.
          *   *Weaknesses:* Precautionary principle is notoriously difficult to apply without stifling liberty. Assumes the norm is valuable without proving it.
          *   *Verdict:* Insightful about social dynamics, but risks authoritarianism via unfalsifiable claims.

      *   **Move 4 (Theo):** Precaution is symmetric/empty. Past moral panics (homosexuality, divorce) used same "fraying fabric" argument falsely. Need way to distinguish real fraying from panic. "Wait and see" isn't a test.
          *   *Strengths:* Historical evidence undermines Mara's claim. Highlights the burden of proof problem.
          *   *Weaknesses:* Doesn't prove *this* case isn't different, just that past cases were wrong.
          *   *Verdict:* Very strong. Undermines the epistemic basis of Mara's precaution.

      *   **Move 5 (Mara):** Irreversibility test. Norms once lost can't be restored (unlike drugs). Law is expressive, not just instrumental. Expressive criminalisation exists (hate crime).
          *   *Strengths:* Norms *are* often hard to restore (path dependence). Law *does* have expressive function (Anderson, Pildes).
          *   *Weaknesses:* "Irreversibility" is empirically shaky (norms return). Expressive function of hate crime laws is about protecting victims, not enforcing morality for its own sake.
          *   *Verdict:* Mixed. Expressive point is valid, irreversibility test is weak.

      *   **Move 6 (Theo):** Irreversibility cuts both ways (moral progress is irreversible too). Expressivism needs content validation; law can express protection without despising. Doesn't get you to Devlin.
          *   *Strengths:* Exposes the symmetry problem again. Clarifies expressivism (needs legitimate content).
          *   *Weaknesses:* None significant in this context.
          *   *Verdict:* Strong closing.

  3.  **Determine the Winner:**
      *   Theo holds the stronger position philosophically (liberal neutrality, burden of proof). Mara relies on assertions about norm decay that are hard to verify and historically contested.
      *   However, Mara successfully exposes that pure harm principles are incomplete (expressive function, hard cases like incest/corpses).
      *   Overall: Theo is more right on the specific case (synthetic material), but Mara wins points on the general theory of law (expressivism, normativity).
      *   Decision: Theo is more right overall regarding the specific legislation, but Mara identifies genuine gaps in liberal theory.

  4.  **Identify What Both Miss:**
      *   **Technology/Materiality:** Neither discusses the specific nature of *synthetic* material. Does it affect demand for real abuse? (Empirical link).
      *   **Enforcement Costs:** Privacy invasion required to ban private consumption.
      *   **Alternative Regulation:** Age verification, labeling, etc.
      *   **The "Offence Principle":** Feinberg's offence principle isn't really deployed by Mara (she sticks to moralism).

  5.  **Drafting the Response (incorporating constraints):**
      *   *Constraint:* British English (e.g., "criminalisation", "centre", "programme").
      *   *Constraint:* First sentence = bottom line.
      *   *Constraint:* No preamble.
      *   *Constraint:* Move-by-move adjudication.
