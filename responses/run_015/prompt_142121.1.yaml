          *   (2) Theo: Strong theoretical defence, but the 'coordination audit' is too narrow to justify criminal law generally (murder isn't a coordination game), though it works well for this specific case.
          *   (3) Mara: The antibiotic analogy is vivid and correctly identifies the lag in social data, but the precautionary principle here is epistemically vacant without a metric for 'decay'.
          *   (4) Theo: This is his strongest move; historical symmetry dismantles the precautionary claim by showing it is universally applicable to any status quo, rendering it useless as a discriminator.
          *   (5) Mara: The expressive point is philosophically sound (law teaches), but the irreversibility claim is empirically dubious (norms fluctuate), and hate crime laws protect persons, not abstract morals.
          *   (6) Theo: Correctly notes that progress is also irreversible, neutralising Mara's test, and rightly insists expressivism requires legitimate content, not just any content.

      *   *Drafting Overall:* Theo is more right because he maintains the burden of proof where it belongs—on those restricting liberty—while Mara relies on unfalsifiable claims about social decay.
