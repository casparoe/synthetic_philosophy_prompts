prompt: |-
  I'm a staff engineer at a company with about forty backend services spread across nine teams, and I've been asked to run a fifty-minute internal engineering-craft session on how technical conventions form and hold together. The reason I'm running it is a design review next week: we are about to rewrite our internal messaging layer, and the argument in the room keeps collapsing into the same shape — the retry policy is arbitrary, so let's just pick the better option and write it into the migration document. I've read a couple of summaries of David Lewis's account of convention and it looks like the right tool for what is going wrong in that room. I don't want to lecture at people about philosophy, and I don't want to put his numbered formal definition on the board, because I lose the thread in it myself and so will they. What I want from you is a plan for making the structure land with twenty-five engineers of mixed seniority, no philosophy background, one whiteboard and no slides, half of whom will arrive convinced that this is a management problem rather than a technical one.

  The case I was going to build everything on: when a consumer fails to process a message, it either retries with backoff until the message goes through, or it retries a fixed number of times and then parks the message in a dead-letter queue that a human drains by hand. There is no written policy. Every team I asked does the second thing, and every team I asked assumed every other team does the second thing. It appears to have started with one incident about three years ago — a consumer stuck retrying held a malformed message against a checkpoint for nine hours — and the fix that got posted in the incident channel somehow became the way everybody does it. If everyone did the other thing instead, throughput would arguably be better and nobody would be draining anything by hand, so the current practice looks arbitrary, and that word is doing real damage in the design review.

  There is a wrinkle. This is not a pure case of everyone just wanting to match: the platform team would rather each consumer team own its own dead-letter draining, and the consumer teams would rather the platform offered it as a feature. So there is a small dispute about who does the work sitting on top of the coordination problem. Tell me whether that wrinkle ruins the example, whether I should keep it and deal with it explicitly, or whether I should swap in something cleaner — say, two services that must agree on which of two functionally identical header names carries the correlation ID, which is cleanly arbitrary but invites someone to say we should just run a find-and-replace across the monorepo, and I don't know whether that objection is a problem with the example or the beginning of the lesson.

  Concretely, please plan:

  1. The order the pieces have to come in and what depends on what. In particular: does the definitional core — the stable regularity, the expectations each person has about everyone else, the fact that the expectations are themselves mutually visible, and the fact that some alternative regularity would have served just as well if everyone had converged on it — come before or after the case, and why? And at which point does the word arbitrary have to be repaired, given that they will hear it as costless?
  2. Whether my case or the cleaner one should carry the whole session, and what the carrying example must have and must lack. My guess is that it must lack a linter, a mandate and a single owner who could flip everyone at once, and must have a real alternative that would have done as well — tell me if that's wrong or incomplete.
  3. The misconceptions, and exactly where in the sequence to head each off. The ones I already expect: arbitrary means it doesn't matter, so pick the technically best option; a convention is just a habit, or just a rule nobody happened to write down; we'll announce it in the migration document and it will change; and — a fourth I only half-expect — that people will think the incident three years ago is why the policy is still there. Name the ones I'm missing.
  4. One thing I can have them do or answer in the last ten minutes that would show me they've got the structure rather than the vocabulary, and how I'd tell the difference.
  5. What I should openly refuse to explain in fifty minutes to this audience, and where the temptation to over-explain will be strongest for me.

  Assume they are smart, allergic to theory, and will try to turn every point back into an argument about who should own what. Please don't give me a reading list or citations, and don't quote Lewis: paraphrase the conditions in whatever terms make them usable on a whiteboard.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the User and Context:**
      *   **Role:** Staff Engineer.
      *   **Audience:** 25 engineers (mixed seniority), 9 teams, 40 backend services. Smart, allergic to theory, prone to turning discussions into ownership arguments.
      *   **Goal:** Run a 50-minute session on *how technical conventions form and hold together* to prepare for a design review on rewriting an internal messaging layer.
      *   **Problem:** The design review is stuck. People think the current retry/DLQ policy is "arbitrary" (meaning "doesn't matter/costless to change") and want to just pick the "better" technical option via a migration doc.
      *   **Constraint:** No slides, one whiteboard, no philosophy lecturing, no Lewis quotes/definitions.
      *   **Specific Input:** A specific case study (retry/DLQ policy emerged from an incident 3 years ago, everyone does it, everyone expects everyone else to do it, but there's a wrinkle about *who* does the work).
      *   **Theoretical Basis:** David Lewis's account of convention (coordination equilibrium, common knowledge, arbitrariness), but needs to be translated into engineering pragmatism.

  2.  **Deconstruct the Theoretical Core (Lewis simplified):**
      *   *Regularity:* Everyone does $R$.
      *   *Expectation:* Everyone expects everyone else to do $R$.
      *   *Preference:* Everyone prefers to do $R$ *if* everyone else does $R$ (coordination problem).
      *   *Arbitrariness:* There is an alternative $R'$ that would have worked just as well if everyone had converged on *that* instead.
      *   *Common Knowledge:* Everyone knows everyone knows... (this is the glue).

  3.  **Address the "Wrinkle" (Ownership Dispute):**
      *   *User's Question:* Does the dispute about who owns DLQ draining ruin the example?
      *   *Analysis:* Actually, it *helps*. Pure coordination problems (like driving on the left vs. right) are too clean. Real engineering conventions often have friction. The friction highlights *why* the convention holds despite the friction. If the convention holds even though Platform wants one thing and Consumers want another, it proves the power of the *expectation* over the *preference*.
      *   *Decision:* Keep the retry/DLQ case. It's richer. The header example is too trivial (find-and-replace solves it easily). The DLQ example involves runtime behavior, operational burden, and risk. That's where conventions matter.
      *   *Caveat:* Need to separate the *coordination* aspect (what happens when a message fails) from the *ownership* aspect (who drains the queue). The convention is "We park it." The ownership dispute is "Who drains it." The session is about the former stabilizing the latter.

  4.  **Drafting the Plan - Section by Section:**

      *   **1. Order of Pieces:**
          *   Start with the *conflict*, not the theory. Hook them with the design review problem.
          *   Introduce the Case Study immediately.
          *   Derive the "Structure" (the Lewis conditions) *from* the case study, not before. Engineers learn bottom-up.
          *   Address "Arbitrary" early, because that's the blocker.
          *   *Sequence:* Problem -> Case -> Anatomy of the Convention -> The "Arbitrary" Trap -> Application to Design Review.

      *   **2. Choosing the Example:**
          *   Retry/DLQ is better than Headers.
          *   *Why:* Headers can be fixed by linting/automation. Runtime behavior requires social coordination.
          *   *Requirements:* Must lack a central enforcer (no linter/mandate). Must have a real alternative (retry vs. DLQ). Must have *consequences* for breaking coordination (system instability).
          *   *The Wrinkle:* Keep it. It shows conventions survive sub-optimal local preferences.

      *   **3. Misconceptions:**
          *   *Arbitrary = Costless:* This is the big one. Arbitrary means "could have been otherwise," not "easy to change."
          *   *Convention = Habit:* Habit is individual; Convention is mutual expectation.
          *   *Documentation = Enforcement:* Writing it down doesn't make it real.
          *   *Origin = Maintenance:* The incident started it, but *expectations* keep it.
          *   *Missing Misconception:* "If it's technical debt, we should fix it." Conventions aren't debt; they're infrastructure.
          *   *Missing Misconception:* "Staff/Principal engineers can decree this." (Authority vs. Coordination).

      *   **4. The Exercise (Last 10 mins):**
          *   Need to test if they understand *coordination*, not just vocabulary.
          *   *Idea:* Propose a change to the messaging layer. Ask them to identify the *friction points* that aren't technical.
          *   *Better Idea:* "The Migration Trap." Give them a proposed migration plan. Ask them to find where it assumes coordination without establishing it.
          *   *Success Metric:* They point out social/expectation gaps, not technical bugs.

      *   **5. What to Refuse to Explain:**
          *   Don't solve the ownership dispute (Platform vs. Consumer). That's a political/product decision, not a convention lesson.
          *   Don't explain *how* to migrate.
          *   Don't explain Common Knowledge formally (too philosophical).
          *   *Temptation:* To solve the retry policy debate. The goal is to teach them *how to debate it*, not to decide it.

  5.  **Refining the Flow (Whiteboard Strategy):**
      *   Left side: The Case (Retry vs. DLQ).
      *   Middle: The Three Legs (Regularity, Expectation, Alternative).
      *   Right: The Migration Risk.
      *   Visualizing "Arbitrary": Draw two peaks on a graph (Coordination Equilibria). Moving from one to the other requires crossing a valley (instability).

  6.  **Addressing the "Arbitrary" Repair:**
      *   This needs to happen *during* the case analysis. When they say "It's arbitrary," write it down. Then redefine it as "Switching costs are high, not because the tech is hard, but because the *alignment* is hard."

  7.  **Addressing the Ownership Wrinkle:**
      *   Explicitly call it out. "Note: People hate draining DLQs. But they do it anyway. Why? Because they expect the sender to expect them to do it." This proves the convention is stronger than the preference.

  8.  **Final Review against Constraints:**
      *   50 mins? Yes, tight agenda.
      *   No slides? Yes, whiteboard focused.
      *   No Lewis quotes? Yes, plain English.
      *   Mixed seniority? Yes, focuses on practical system stability.
      *   Allergic to theory? Yes, theory is derived from practice.

  9.  **Self-Correction/Polish:**
      *   *Check:* Did I answer the specific question about the order of the definitional core?
      *   *Correction:* Yes, insist on Case *before* Core. Engineers need concrete context before abstraction.
      *   *Check:* Did I address the "Management Problem" half of the room?
      *   *Correction:* Frame convention as "Distributed System Consistency" applied to humans. That appeals to backend engineers.
      *   *Check:* The Exercise. Make sure it's actionable. "Spot the gap in this migration plan."

  10. **Final Polish of the Plan:** (Drafting the response following the user's 5 specific points).
      *   *Tone:* Peer-to-peer, pragmatic, direct.
      *   *Structure:* Follow the user's 5 numbered requests exactly.

  *(Self-Correction during drafting point 4)*: Make sure the exercise distinguishes between "knowing the definition" and "seeing the dynamic." If they just recite "common knowledge," they failed. If they say "Team A won't know Team B switched," they succeeded.

  *(Self-Correction during drafting point 5)*: Be very clear on the "Ownership" trap. The session is about *coordination*, not *resource allocation*.

  *(Final thought on the "Wrinkle")*: The user asked if the wrinkle ruins the example. I need to be definitive. It does *not* ruin it; it validates it. Pure coordination is rare in engineering. Coordination *despite* conflicting incentives is the norm. I will advise keeping it but bracketing it.

  Okay, ready to write.cltr
answer: |-
  Here is a plan for the session. It treats the engineers as a distributed system that needs to reach consensus, rather than a class that needs to learn a definition.

  ### 1. Order of Pieces and Dependencies

  **Do not start with the definition.** If you put the "structure" on the board first, they will treat it as a checklist to ignore. You must derive the structure from the pain they are currently feeling.

  **Sequence:**
  1.  **The Hook (5 mins):** State the design review deadlock. "We are stuck because we think the current state is *arbitrary*. I want to convince you that 'arbitrary' does not mean 'costless to change'."
  2.  **The Case Study (10 mins):** Walk through the Retry vs. DLQ history.
      *   Draw the timeline on the whiteboard.
      *   Mark the Incident (3 years ago).
      *   Mark the Current State (9 teams, all DLQ).
      *   **Crucial Step:** Ask the room: "If you joined tomorrow, what would you build?" (They will say DLQ). "Why?" (They will say "Because everyone else does").
  3.  **The Anatomy (15 mins):** *Now* you extract the definition from their answers. Draw three columns on the board.
      *   **Regularity:** We all do $X$.
      *   **Expectation:** We all expect everyone else to do $X$.
      *   **Alternative:** We could have all done $Y$, and it would have worked fine, *provided* we all did $Y$.
      *   *Dependency:* This only works because you established the Case Study first. The definition is now a summary of reality, not a theory.
  4.  **Repairing "Arbitrary" (10 mins):** This is the pivot.
      *   Write "Arbitrary = Costless" on the board. Cross it out.
      *   Write "Arbitrary = Multiple Equilibria."
      *   Draw two hills with a valley in between. We are on Hill A (DLQ). Hill B (Retry) is just as high. But to get there, we must cross the valley (mixed state instability).
      *   *Timing:* This must happen after the Anatomy. They need to see that the *Expectation* is the glue holding them on Hill A.
  5.  **The Wrinkle & Application (10 mins):** Address the Platform vs. Consumer ownership dispute, then move to the exercise.

  **Why this order:** Engineers trust data and post-mortems more than definitions. By the time you show them the structure, they have already agreed to its premises empirically.

  ### 2. The Carrying Example

  **Keep the Retry/DLQ case.** Do not swap to the Header/Correlation-ID example.

  **Why:**
  *   **The Header example is too clean.** It implies a linter or a schema registry could solve it. It suggests the problem is *technical enforcement*.
  *   **The Retry/DLQ example is behavioral.** It involves runtime risk, operational burden, and incident response. This mirrors the messaging layer rewrite exactly.
  *   **The Wrinkle (Ownership):** Do not remove the Platform vs. Consumer dispute. It actually strengthens the lesson.
      *   *Reason:* Pure coordination (driving on the left) is easy. Coordination *despite* conflicting incentives (I want you to drain the queue, you want me to drain the queue) is where conventions prove their value.
      *   *How to handle it:* Explicitly bracket it. "There is a separate argument about *who* drains the queue. Ignore that for this session. The convention is that the message *gets parked*. The convention holds even though people complain about the work. That proves the expectation is stronger than the preference."

  **What the example must have:**
  *   **No Single Owner:** No one person could have flipped a switch 3 years ago.
  *   **Runtime Consequence:** If coordination breaks, the system degrades (messages lost or loops created), not just lint errors.
  *   **Visible Alternative:** Everyone must agree that "Retry with Backoff" is a valid technical strategy, just not the *coordinated* one.

  ### 3. Misconceptions and Interception Points

  You need to head these off as they arise, not in a block.

  1.  **"Arbitrary means it doesn't matter."**
      *   *Intercept:* During the "Repairing Arbitrary" section (Step 4 above).
      *   *Counter:* "It matters immensely. It means there are two valid states, but being in *different* states is fatal. The cost is not the code; the cost is the migration valley."
  2.  **"A convention is just a habit."**
      *   *Intercept:* During the Anatomy (Step 3).
      *   *Counter:* "Habits are individual. If I habitually tie my left shoe first, it doesn't affect you. If I habitually drive on the right, it kills you. Conventions require *mutual expectation*."
  3.  **"We'll announce it in the migration doc and it will change."**
      *   *Intercept:* During the Application/Wrinkle section.
      *   *Counter:* "Documentation updates knowledge. It does not update *common knowledge*. When does Team A know that Team B has read the doc? When does Team B know Team A knows?"
  4.  **"The incident three years ago is why the policy is still there."**
      *   *Intercept:* During the Case Study (Step 2).
      *   *Counter:* "The incident was the spark. The *expectation* is the fuel. If the incident were the cause, we would have changed it when the original engineers left. We didn't."
  5.  **Missing Misconception: "Seniority solves coordination."**
      *   *Intercept:* Early, when discussing why it hasn't changed.
      *   *Counter:* "A mandate from a Staff Engineer creates a rule. It does not create a convention. A rule is followed because of authority; a convention is followed because of prediction. If we mandate Retry but everyone expects DLQ, we get bugs."
  6.  **Missing Misconception: "This is a management problem."**
      *   *Intercept:* Opening hook.
      *   *Counter:* "Management assigns resources. Conventions are distributed consensus. You cannot manage this into existence any more than you can manage a distributed commit into existence without a protocol."

  ### 4. The Exercise (Last 10 Minutes)

  **The Task:** "The Migration Gap Analysis."
  Draw a simplified migration plan on the board for the new messaging layer.
  *   *Step 1:* Platform team deploys new layer supporting both Retry and DLQ.
  *   *Step 2:* Migration doc sent to all 9 teams.
  *   *Step 3:* Teams migrate consumers at their own pace over 3 months.
  *   *Step 4:* Old layer deprecated.

  **Ask them:** "Where does the coordination break? Don't tell me about code. Tell me about *expectations*."

  **Success Criteria (They get the structure):**
  *   They identify that during Step 3, Senders and Receivers might mismatch (Sender expects DLQ, Receiver expects Retry).
  *   They identify that "Reading the doc" is not synchronized (Common Knowledge gap).
  *   They suggest a "flag day" or a "dual-write period" where the behavior is forced, rather than relying on teams to read and act.

  **Failure Criteria (They only got the vocabulary):**
  *   They say "We need to document it better."
  *   They say "Team Leads need to enforce this."
  *   They recite "We need common knowledge" without explaining *how* to achieve it technically (e.g., feature flags, handshake protocols).

  ### 5. What to Refuse to Explain

  **1. Do not solve the Ownership Dispute.**
  *   *The Trap:* Someone will ask, "So should Platform own the DLQ or not?"
  *   *The Refusal:* "That is a resource allocation question, not a convention question. We can decide that *after* we agree on the mechanism. Today is about how we agree on the mechanism without breaking the system."
  *   *Why:* If you solve the ownership bit, you validate the idea that this is a management decision. You need them to leave knowing it's a coordination protocol.

  **2. Do not explain "Common Knowledge" formally.**
  *   *The Trap:* Explaining the infinite recursion ("I know that you know that I know...").
  *   *The Refusal:* "We aren't doing epistemology. In engineering terms, Common Knowledge means: There is a public signal that everyone has seen, and everyone knows everyone else saw it. A Slack message is not a public signal. A merged PR in a shared repo that blocks deployment is."
  *   *Why:* You will lose the room. Keep it operational.

  **3. Do not promise the "Better" Technical Option will win.**
  *   *The Trap:* "If we use this framework, we can switch to Retry."
  *   *The Refusal:* "This framework might tell us that switching is too expensive. The goal is to make the decision *conscious*, not to guarantee we change."
  *   *Why:* If you promise change, the "Management Problem" half of the room will treat this session as a means to an end, rather than learning the constraint.

  **Where the temptation to over-explain is strongest:**
  It will be strongest when you draw the "Two Hills" diagram. You will want to explain game theory equilibria. **Don't.** Just say: "If half the fleet is on Hill A and half on Hill B, messages fall in the valley and die. That is the cost of 'Arbitrary'." Keep it physical. Keep it about message loss. That is the language they speak.
