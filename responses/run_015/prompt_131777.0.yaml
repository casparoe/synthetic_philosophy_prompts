answer: |-
  # Workshop Activity: The Justification Trap

  ## 1. Rules, Materials, and Room Setup

  **Room Setup:**
  *   Arrange 7 tables or desk-pairs in a circle or semi-circle so all pairs can see each other, but partners sit directly opposite one another.
  *   **Materials per Pair:**
      *   1 "Prize Token" (a distinct object, e.g., a colored block) placed in the center.
      *   10 Index Cards (green) for Player A, 10 Index Cards (yellow) for Player B.
      *   1 Pen per student.
      *   1 "Score Sheet" per pair (to track current bid, profile, and net points).
      *   1 Trash bin or designated "Ritual Tear Zone" in the center of the table.
  *   **Materials for Facilitator:**
      *   21 Profile Slips (7 of each type: Instrumentalist, Identity-Consistent, Rule-Follower).
      *   A visible timer projected on the wall.
      *   A master scoreboard (whiteboard) to track pair standings实时更新 (real-time).

  **The Profiles (Printed on Slips):**
  1.  **Instrumentalist:** "Every bid must be justified solely by the calculation: *Expected Net Gain = (Prize Value - Current Bid) - Cost of Losing.*"
  2.  **Identity-Consistent:** "Every bid must be justified solely by coherence: *This move aligns with the public persona I have established in previous rounds.*"
  3.  **Rule-Follower:** "In Round 1, you must announce a maximum bid threshold (e.g., 'I stop at 4'). Every bid must be justified solely by adherence to this threshold. If you bid past your threshold, you are violating your profile."

  **Game Rules:**
  1.  **Objective:** Maximize your individual point total. Points determine your rank in the course participation metric.
  2.  **The Auction:**
      *   Prize Value: **10 Points**.
      *   Starting Bid: **1 Point**.
      *   Increment: **1 Point** per turn.
      *   **Payoff:** The Highest Bidder wins the 10 points but pays their bid amount. The Second-Highest Bidder pays their bid amount and receives **0**.
      *   *Example:* If A bids 6 and B bids 5, A gets (10 - 6) = 4 points. B gets (0 - 5) = -5 points.
  3.  **The Justification Constraint:**
      *   To place a bid, you must write a one-sentence rationale on an index card matching your **current profile**.
      *   Place the card face-up on the table. Your partner must see it before the bid is registered.
      *   **Profile Switching:** You may switch profiles at any time.
          *   **Cost:** Deduct **3 Points** from your final score immediately.
          *   **Ritual:** You must physically tear up your current justification card in front of your partner and place the pieces in the Ritual Tear Zone.
          *   **Reset:** You must draw a new card and write a new rationale based on the new profile.
  4.  **Termination:**
      *   The auction ends when one player refuses to bid higher.
      *   Maximum 12 Rounds. If both continue to Round 12, the auction forces a "Double or Nothing" final bid (bid 13, winner takes all, loser pays 13).
  5.  **Facilitator Enforcement:**
      *   You will walk between tables. If a rationale does not match the profile (e.g., an Instrumentalist writing "I don't want to look weak"), reject the bid. The player must rewrite or switch profiles.

  ## 2. Point/Payoff Scheme and Emotional Stakes

  **The Currency:**
  Do not use money. Use "Seminar Capital."
  *   **Top 3 Individual Scores:** Priority selection for seminar paper topics + 1 extension token for the semester.
  *   **Middle 8 Scores:** Standard participation credit.
  *   **Bottom 3 Individual Scores:** Must lead the opening 10 minutes of a future seminar session (a task most grad students dread due to preparation time).

  **Why This Stings:**
  *   **Loss Aversion:** The "Second-Highest Bidder Pays" rule means doing nothing yields 0, but participating and losing yields negative points. Students will bid to avoid the negative, not just to win the positive.
  *   **The Switch Cost:** 3 points is 30% of the prize value. Switching profiles feels like admitting the previous strategy was wrong. To avoid paying the "admission of error" tax, they will often bid 1 or 2 points *past* rationality rather than tear the card.
  *   **Public Visibility:** The index cards create a paper trail of commitment. Tearing the card is a performative admission of inconsistency. In a cohort of peers, maintaining intellectual consistency is often valued higher than point optimization.

  ## 3. Timeline (90 Minutes Total)

  **Phase 1: Setup & Profile Draw (10 Minutes)**
  *   **0:00–0:05:** Explain the payoff scheme (Seminar Capital). Emphasize that negative points are possible and affect the ranking.
  *   **0:05–0:10:** Distribute profile slips secretly. Instruct Rule-Followers to decide their threshold silently. Instruct all students that they cannot show their profile slip to their partner, only the justification cards.

  **Phase 2: The Auction (30 Minutes)**
  *   **0:10–0:40:** Run the simultaneous auctions.
  *   **Facilitator Role:** Do not intervene unless rules are broken. Walk the room. If a pair stalls, announce "30 seconds to bid or you both forfeit."
  *   **Observation:** Watch for the "Tear Hesitation." Note which pairs switch profiles and which dig in.
  *   **Hard Stop:** At 0:40, blow a whistle. All bidding ceases. Calculate final scores immediately on the whiteboard.

  **Phase 3: The Debrief (50 Minutes)**
  *   **0:40–0:50:** **Immediate Reaction.** Ask students to put pens down. Ask: "Who feels angry at their partner? Who feels angry at themselves?"
  *   **0:50–1:10:** **Mechanical Autopsy.** Walk through the specific bids where the math broke.
  *   **1:10–1:30:** **Philosophical Synthesis.** Connect the card-tearing to identity protection.

  ## 4. Debrief Map: Connecting Mechanics to Philosophy

  **Moment A: The "Half-Value" Threshold (Bid 5 vs. 6)**
  *   *Game Event:* The point where the bid exceeds half the prize value (5 points). Instrumental rationality suggests stopping, as net gain is now lower than the risk.
  *   *Discussion:* Ask an Instrumentalist who bid past 5: "What was your expected yield calculation?" They will likely struggle to articulate it.
  *   *Philosophical Link:* This is the transition from *profit-seeking* to *loss-minimization*. Rationality shifts from "How much can I make?" to "How much pain can I avoid?"

  **Moment B: The Silent Glare (Round 8–10)**
  *   *Game Event:* Partners stop looking at the cards and start staring at each other. Bidding slows. Justifications become repetitive ("I am maintaining coherence").
  *   *Discussion:* "When did the game stop being about the points and start being about the person across from you?"
  *   *Philosophical Link:* **Intersubjective Rationality.** Your rationality is no longer internal; it is negotiated. Quitting is not a math problem; it is a social signal of weakness. The "Identity-Consistent" profile weaponizes this by making consistency a virtue regardless of outcome.

  **Moment C: The Card Tear Hesitation**
  *   *Game Event:* A player considers switching profiles to escape the trap but hesitates to tear the card. They bid +1 instead.
  *   *Discussion:* "The cost to switch was 3 points. The cost to bid was 1 point. Mathematically, switching was often the better long-term play if you intended to quit soon. Why did you bid?"
  *   *Philosophical Link:* **Constitutive Rules vs. Regulative Rules.** The profile wasn't just a strategy; it became part of *who you were* in that room. Tearing the card was an ontological crisis (admitting "I am not the kind of person who sticks to this"). We often burn resources to preserve our self-narrative.

  ## 5. Prediction of Failure and Correction

  **Predicted Failure 1: Collusion (The "Gentleman's Agreement")**
  *   *Risk:* Pairs realize the trap immediately, bid 1, and stop to split the points.
  *   *Correction:* During setup, announce: "I am tracking variance. If I see suspiciously low bidding across multiple tables, I will invoke the 'Market Correction': All scores will be halved, and the 'Seminar Capital' stakes will be doubled for the next assignment." This introduces uncertainty that breaks trust.

  **Predicted Failure 2: Profile Cynicism**
  *   *Risk:* Students treat the justification cards as busywork, writing nonsense to match the profile without feeling the constraint.
  *   *Correction:* Enforce the "Rejection Rule" aggressively. In the first 5 minutes, reject 2 or 3 bids publicly because the rationale didn't match the profile. "That is an Instrumentalist calculation, but you are holding an Identity card. Rewrite or Switch." This makes the constraint real.

  **Predicted Failure 3: Early Defection**
  *   *Risk:* One player refuses to bid past 0, ruining the escalation dynamic.
  *   *Correction:* Remind them of the "Second-Highest Bidder Pays" rule. If Player A bids 1 and Player B bids 0, Player B loses 0 points, but Player A wins 9. However, announce that *inaction* is treated as a bid of 0. If the partner bids 1, the non-bidder is now the second-highest bidder at 0. They are safe at 0, but the moment they bid 1 to "test," they are in. Encourage aggression: "To win the Seminar Capital, you cannot be passive."

  ## 6. Limitations and Verbal Supplementation

  **The Missing Feature:**
  This activity cannot reproduce **genuine financial ruin**. The "Seminar Capital" stakes are low enough that a negative score is an annoyance, not a life-altering disaster. Additionally, the profiles are **assigned**, whereas in the real world, we choose our own rational frameworks and defend them because we genuinely believe in them, not because a slip of paper told us to.

  **Verbal Supplementation (To be spoken at 1:20 in the debrief):**
  "In this room, the worst that happens is you lead a seminar discussion. In the real world, the 'points' are your reputation, your career trajectory, or a marriage. When you hesitated to tear that card, you felt a micro-version of the fear a CEO feels when refusing to cancel a failing billion-dollar project. You didn't cancel the project because admitting the project was a failure would mean admitting *you* were a failure.

  Furthermore, you were assigned these profiles. In life, you assigned them to yourself. You chose to be the 'Identity-Consistent' person long before you walked into this room. You built your career on a specific threshold. When the world changes and that threshold becomes ruinous, the cost of tearing up your own identity card is not 3 points—it is a crisis of self. That is why escalation happens. It is not a math error. It is an identity preservation strategy."
